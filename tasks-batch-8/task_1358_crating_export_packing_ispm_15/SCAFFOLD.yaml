# =============================================================================
# Task 1358: Crating, Export Packing & ISPM-15 — benchmark seed tables
# =============================================================================

scenario: |
  Crating, Export Packing & ISPM-15 (industrial crating company): item dimension/weight capture & crate design, wood treatment certification & stamp control, shock/tilt indicator & moisture barrier, hazardous & battery-in-equipment declaration, packing list vs commercial invoice consistency, on-site vs shop packing labor, freight class & container load plan, damage claim documentation

domain_name: crating-export-ispm15
api_prefix: /crating

complexity_profile:
  primary_archetype: compliance_audit        # ISPM-15 stamp control, doc consistency, SoD
  secondary_archetype: quota_allocation      # wood board-feet + stamp pools, container payload
  complexity_layers:
    - optimistic_concurrency                 # OCC on PackingJob.version and Item.version
    - cascading_side_effects                 # cancel/suspend cascades across 3+ entities
    - dual_variant_calculation               # provisional vs final quote; declared vs depreciated claims
    - version_pinning_on_approval            # Crate pins CrateDesign (+ its WoodBatch) at build
  entity_topology: hybrid                    # Job->Item->Design/Crate tree + flat WoodBatch/Crew/Container refs
  state_machine_shape: compound              # PackingJob status is a derived aggregate of child Crate states
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # hazmat preparer != approver; docs finalized by SalesRep, released by ComplianceOfficer
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: site_code, type: string, source: input, description: "Site identifier used as the OnsitePermit overlap resource key; unique across customers" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open exposure allowed", constraints: ">= 0" }
      - { name: open_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of quoted_price_cents over this customer's PackingJobs with status IN {DESIGN, PACKING, READY_TO_LOAD, LOADED, SHIPPED, DELIVERED}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED" }

  - name: PackingJob
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: mode, type: enum, source: input, description: "SHOP | ONSITE — where packing labor happens", constraints: "SHOP | ONSITE" }
      - { name: incoterm, type: enum, source: input, description: "EXW | FOB | DDP", constraints: "EXW | FOB | DDP" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | DESIGN | PACKING | READY_TO_LOAD | LOADED | SHIPPED | DELIVERED | CLOSED | CANCELLED; compound: READY_TO_LOAD/LOADED auto-derive from child Crate states" }
      - { name: total_board_feet, type: integer, source: computed, default: 0, description: "Sum of board_feet_required over the current (non-SUPERSEDED) CrateDesign of every Item" }
      - { name: total_chargeable_weight_kg, type: number, source: computed, default: 0, description: "Sum of Item.chargeable_weight_kg over all Items" }
      - { name: estimated_labor_hours, type: integer, source: computed, default: 0, description: "ceil(total item volume_m3 * HOURS_PER_M3[mode]); SHOP=1.5, ONSITE=2.5" }
      - { name: quoted_price_cents, type: integer, source: computed, default: 0, description: "Provisional quote (job_quote calc); frozen snapshot taken at accept-quote" }
      - { name: invoiced_total_cents, type: integer, source: computed, description: "Final invoice (job_quote FINAL variant, actual labor); null until CLOSED", default: null }
      - { name: readiness_posture, type: enum, source: computed, default: BLOCKED, description: "READY iff >=1 Crate exists AND every Crate.status IN {SEALED, LOADED, SHIPPED, DELIVERED} AND no Crate has compliance_hold=true; else BLOCKED", constraints: "READY | BLOCKED" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp stamped at deliver; basis for claim window and depreciation" }

  - name: Item
    parent: PackingJob
    common_fields: true
    fields:
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; parent job (path)" }
      - { name: description, type: string, source: input, description: "Free-text item description" }
      - { name: length_cm, type: number, source: input, description: "Item length", constraints: "> 0" }
      - { name: width_cm, type: number, source: input, description: "Item width", constraints: "> 0" }
      - { name: height_cm, type: number, source: input, description: "Item height", constraints: "> 0" }
      - { name: weight_kg, type: number, source: input, description: "Actual net weight", constraints: "> 0" }
      - { name: fragile_class, type: enum, source: input, description: "STANDARD | DELICATE | HIGHLY_FRAGILE — drives clearance/thickness/indicator", constraints: "STANDARD | DELICATE | HIGHLY_FRAGILE" }
      - { name: hazmat, type: boolean, source: input, default: false, description: "True if dangerous goods; requires an APPROVED HazmatDeclaration before seal" }
      - { name: battery_in_equipment, type: enum, source: input, default: NONE, description: "NONE | LITHIUM_ION | LITHIUM_METAL | WET_CELL; non-NONE also requires declaration and VACUUM_SEALED barrier", constraints: "NONE | LITHIUM_ION | LITHIUM_METAL | WET_CELL" }
      - { name: declared_value_cents, type: integer, source: input, description: "Declared value for customs/claims cap", constraints: ">= 0" }
      - { name: volume_m3, type: number, source: computed, description: "length_cm*width_cm*height_cm / 1e6, 6 decimal places" }
      - { name: dimensional_weight_kg, type: number, source: computed, description: "round(length_cm*width_cm*height_cm / 5000, 2), round_half_up" }
      - { name: chargeable_weight_kg, type: number, source: computed, description: "max(weight_kg, dimensional_weight_kg)" }
      - { name: status, type: enum, source: system, default: CAPTURED, description: "CAPTURED | DESIGN_APPROVED | PACKED | SEALED; bubble-up from CrateDesign/Crate events; SEALED -> PACKED on crate reopen" }

  - name: CrateDesign
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; parent item (path)" }
      - { name: revision, type: integer, source: system, default: 1, description: "1 for first design; revise after REJECTED increments by 1; supersede-create sets revision = (count of prior designs for item) + 1" }
      - { name: clearance_cm, type: number, source: computed, description: "STANDARD=5, DELICATE=10, HIGHLY_FRAGILE=15" }
      - { name: internal_l_cm, type: number, source: computed, description: "length_cm + 2*clearance_cm" }
      - { name: internal_w_cm, type: number, source: computed, description: "width_cm + 2*clearance_cm" }
      - { name: internal_h_cm, type: number, source: computed, description: "height_cm + 2*clearance_cm" }
      - { name: thickness_cm, type: number, source: computed, description: "weight_kg < 50 -> 1.2; 50 <= weight_kg < 500 -> 1.8; >= 500 -> 2.5" }
      - { name: external_l_cm, type: number, source: computed, description: "internal_l_cm + 2*thickness_cm" }
      - { name: external_w_cm, type: number, source: computed, description: "internal_w_cm + 2*thickness_cm" }
      - { name: external_h_cm, type: number, source: computed, description: "internal_h_cm + 2*thickness_cm" }
      - { name: board_feet_required, type: integer, source: computed, description: "ceil( (2*(L*W + L*H + W*H) over external dims in cm^2 / 10000) * 11 )" }
      - { name: tare_weight_kg, type: number, source: computed, description: "round(board_feet_required * 1.8, 2)" }
      - { name: shock_indicator_g, type: integer, source: computed, description: "STANDARD=75, DELICATE=50, HIGHLY_FRAGILE=25" }
      - { name: moisture_barrier_required, type: enum, source: computed, description: "VACUUM_SEALED if battery_in_equipment != NONE; else VCI if fragile_class != STANDARD; else NONE", constraints: "NONE | VCI | VACUUM_SEALED" }
      - { name: wood_batch_id, type: string, source: system, default: null, description: "FK -> WoodBatch.id; assigned at approval from the approve payload" }
      - { name: reject_reason, type: string, source: system, default: null, description: "Reason recorded at reject" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_REVIEW | APPROVED | REJECTED | LOCKED | SUPERSEDED; cyclic REJECTED -> DRAFT via revise" }

  - name: WoodBatch
    parent: null
    common_fields: true
    fields:
      - { name: ht_certificate_no, type: string, source: input, description: "ISPM-15 heat-treatment certificate number; unique" }
      - { name: treatment_type, type: enum, source: input, description: "HT | KD_HT", constraints: "HT | KD_HT" }
      - { name: expires_at, type: datetime, source: input, description: "Certificate expiry; batch reads EXPIRED when logical clock > expires_at" }
      - { name: received_board_feet, type: integer, source: input, description: "Total lumber received", constraints: "> 0" }
      - { name: stamps_acquired, type: integer, source: input, description: "Physical ISPM-15 stamp serials issued against this batch", constraints: ">= 0" }
      - { name: reserved_board_feet, type: integer, source: computed, default: 0, description: "Reserved at design approval, released at supersede/cancel" }
      - { name: consumed_board_feet, type: integer, source: computed, default: 0, description: "Reserved -> consumed at crate build (wood is cut)" }
      - { name: scrapped_board_feet, type: integer, source: computed, default: 0, description: "Scrapped at crate reopen (2 board feet padding loss per reopen)" }
      - { name: available_board_feet, type: integer, source: computed, description: "= received_board_feet - reserved_board_feet - consumed_board_feet - scrapped_board_feet" }
      - { name: stamps_applied, type: integer, source: computed, default: 0, description: "Stamps currently active on SEALED crates" }
      - { name: stamps_voided, type: integer, source: computed, default: 0, description: "Stamps voided by crate reopen; never reusable" }
      - { name: stamps_available, type: integer, source: computed, description: "= stamps_acquired - stamps_applied - stamps_voided" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | DEPLETED | EXPIRED; DEPLETED auto when available_board_feet==0 AND (reserved+consumed)>0; EXPIRED auto (lazy, vs logical clock)" }

  - name: Crate
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; parent item (path); at most one non-VOIDED Crate per Item" }
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; denormalized from Item for queries" }
      - { name: design_id, type: string, source: input, description: "FK -> CrateDesign.id; pinned at creation (version-pinning); immutable" }
      - { name: container_id, type: string, source: system, default: null, description: "FK -> Container.id; set by load-crate, cleared by unload-crate" }
      - { name: stamp_serial, type: string, source: system, default: null, description: "Minted at seal: 'ISPM15-' + ht_certificate_no + '-' + zero-padded (stamps_applied + stamps_voided + 1, width 4); unique; old serial voided on reopen" }
      - { name: stamp_status, type: enum, source: system, default: null, description: "ACTIVE | VOIDED | null", constraints: "ACTIVE | VOIDED" }
      - { name: tare_weight_kg, type: number, source: computed, description: "Copied from pinned CrateDesign.tare_weight_kg at creation" }
      - { name: gross_weight_kg, type: number, source: computed, description: "= Item.weight_kg + tare_weight_kg" }
      - { name: external_volume_m3, type: number, source: computed, description: "external dims product / 1e6, 6 decimal places" }
      - { name: freight_density_kg_m3, type: number, source: computed, description: "round(gross_weight_kg / external_volume_m3, 2), round_half_up" }
      - { name: freight_class, type: enum, source: computed, description: "NMFC class from freight_density_kg_m3 tiers (inclusive >=): >=800 '55'; >=400 '60'; >=200 '65'; >=100 '70'; >=50 '77.5'; >=25 '85'; >=10 '92.5'; else '125'", constraints: "'55' | '60' | '65' | '70' | '77.5' | '85' | '92.5' | '125'" }
      - { name: compliance_hold, type: boolean, source: computed, default: false, description: "Set true by WoodBatch suspend cascade when design's batch suspended and crate in {PLANNED,BUILT,PACKED,SEALED}; cleared by reinstate" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | BUILT | PACKED | SEALED | REOPENED | LOADED | SHIPPED | DELIVERED | VOIDED; cyclic SEALED -> REOPENED -> PACKED -> SEALED" }

  - name: HazmatDeclaration
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; parent item (path)" }
      - { name: un_number, type: string, source: input, description: "UN number, e.g. UN3481" }
      - { name: dg_class, type: enum, source: input, description: "Dangerous-goods class", constraints: "'1' | '2.1' | '3' | '4.1' | '5.1' | '6.1' | '8' | '9'" }
      - { name: packing_group, type: enum, source: input, description: "I | II | III", constraints: "I | II | III" }
      - { name: battery_type, type: enum, source: input, default: NONE, description: "Battery declaration mirroring Item.battery_in_equipment", constraints: "NONE | LITHIUM_ION | LITHIUM_METAL | WET_CELL" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties reference" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver; must differ from prepared_by_user_id" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on revise after REJECTED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED; cyclic REJECTED -> DRAFT via revise" }

  - name: PackingList
    parent: PackingJob
    common_fields: true
    fields:
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; parent job (path); at most one per job" }
      - { name: lines, type: array, source: input, description: "Array of {crate_id, description, qty (integer >=1), net_weight_kg (number >0), gross_weight_kg (number >0)}; every crate_id must belong to this job" }
      - { name: total_gross_weight_kg, type: number, source: computed, default: 0, description: "Sum of lines[].gross_weight_kg, 2 decimal places" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | RELEASED | AMENDING; cyclic RELEASED -> AMENDING -> FINALIZED -> RELEASED" }

  - name: CommercialInvoice
    parent: PackingJob
    common_fields: true
    fields:
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; parent job (path); at most one per job" }
      - { name: lines, type: array, source: input, description: "Array of {crate_id, description, qty (integer >=1), unit_price_cents (integer >=0), duty_rate_bp (integer 0..10000)}; every crate_id must belong to this job" }
      - { name: invoice_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line round_half_up(qty * unit_price_cents) — per-line rounding pinned" }
      - { name: duty_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line round_half_up(line_total * duty_rate_bp / 10000) — per-line rounding pinned (NOT round(sum * rate))" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | RELEASED | AMENDING" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: capabilities, type: array, source: input, description: "Array of SHOP_BUILD | ONSITE_PACK | HAZMAT_CERT; booking requires mode capability, plus HAZMAT_CERT when the job has any hazmat/battery item", constraints: "subset of SHOP_BUILD | ONSITE_PACK | HAZMAT_CERT, non-empty" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: LaborBooking
    parent: PackingJob
    common_fields: true
    fields:
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; parent job (path)" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; booked crew" }
      - { name: mode, type: enum, source: input, description: "SHOP | ONSITE; must equal PackingJob.mode", constraints: "SHOP | ONSITE" }
      - { name: start_at, type: datetime, source: input, description: "Interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (exclusive); half-open [start_at, end_at) — adjacency allowed on the same Crew", constraints: "end_at > start_at" }
      - { name: hours, type: number, source: computed, description: "round((end_at - start_at) seconds / 3600, 2)" }
      - { name: rate_cents_per_hour, type: integer, source: computed, description: "SHOP=8500, ONSITE=12000" }
      - { name: travel_surcharge_cents, type: integer, source: computed, default: 0, description: "ONSITE=15000 flat per booking, SHOP=0" }
      - { name: total_cost_cents, type: integer, source: computed, description: "round_half_up(hours * rate_cents_per_hour) + travel_surcharge_cents" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: OnsitePermit
    parent: PackingJob
    common_fields: true
    fields:
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; parent job (path)" }
      - { name: site_code, type: string, source: system, description: "Copied from Customer.site_code at creation; the buffered-overlap resource key" }
      - { name: window_start, type: datetime, source: input, description: "Permit window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Permit window end (inclusive); closed interval WITH 60-minute buffer on both sides against other permits for the same site_code", constraints: "window_end > window_start" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | CLOSED | CANCELLED" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: container_no, type: string, source: input, description: "Container number; unique" }
      - { name: size, type: enum, source: input, description: "20FT | 40FT | 40HC", constraints: "20FT | 40FT | 40HC" }
      - { name: max_payload_kg, type: integer, source: computed, description: "20FT=21770, 40FT=26780, 40HC=26680" }
      - { name: dunnage_weight_kg, type: number, source: input, default: 0, description: "Blocking/bracing weight counting against payload", constraints: ">= 0" }
      - { name: payload_used_kg, type: number, source: computed, default: 0, description: "Sum of gross_weight_kg over Crates with container_id == this container AND status == LOADED" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING | LOCKED | GATED_OUT; LOCKED -> PLANNING via unlock only when payload_used_kg == 0" }

  - name: DamageClaim
    parent: PackingJob
    common_fields: true
    fields:
      - { name: packing_job_id, type: string, source: system, description: "FK -> PackingJob.id; parent job (path)" }
      - { name: crate_id, type: string, source: input, description: "FK -> Crate.id; damaged crate (must belong to this job)" }
      - { name: claim_type, type: enum, source: input, description: "IMPACT | TILT | MOISTURE | OTHER — selects settlement cap variant", constraints: "IMPACT | TILT | MOISTURE | OTHER" }
      - { name: description, type: string, source: input, description: "Damage description" }
      - { name: amount_claimed_cents, type: integer, source: input, description: "Claimed amount", constraints: "> 0" }
      - { name: amount_approved_cents, type: integer, source: computed, default: null, description: "Set at approve per claim_settlement calc (variant by claim_type)" }
      - { name: amount_settled_cents, type: integer, source: computed, default: 0, description: "Set at settle from amount_paid_cents" }
      - { name: amount_waived_cents, type: integer, source: computed, default: 0, description: "= amount_approved_cents - amount_settled_cents at settle" }
      - { name: appeal_used, type: boolean, source: system, default: false, description: "Set true on first appeal; second appeal rejected" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | SETTLED; cyclic DENIED -> UNDER_REVIEW once via appeal" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PackingJob
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUOTED
        to: DESIGN
        trigger: "POST /packing-jobs/{id}/accept-quote"
        actor: Customer
        preconditions:
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "Customer.open_exposure_cents + quoted_price_cents <= Customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "acting Customer id == job.customer_id (ERR_FORBIDDEN)"
        side_effects:
          - "quoted_price_cents := provisional job_quote snapshot (frozen)"
          - "Customer.open_exposure_cents += quoted_price_cents"
          - "increments PackingJob.version by 1"
      - from: DESIGN
        to: PACKING
        trigger: "POST /packing-jobs/{id}/start-packing"
        actor: ShopForeman
        preconditions:
          - ">= 1 Item exists AND every Item has a CrateDesign with status IN {APPROVED, LOCKED} (ERR_NO_APPROVED_DESIGN)"
          - "mode == ONSITE => an OnsitePermit for this job with status == CONFIRMED exists (ERR_PERMIT_REQUIRED)"
        side_effects: ["increments PackingJob.version by 1"]
      - from: PACKING
        to: READY_TO_LOAD
        trigger: "system (automatic when >=1 Crate exists and every Crate.status IN {SEALED, LOADED, SHIPPED, DELIVERED})"
        actor: system
        preconditions: []
        side_effects: ["readiness_posture recomputed"]
      - from: READY_TO_LOAD
        to: PACKING
        trigger: "system (automatic when any Crate leaves the sealed-set, e.g. crate reopen)"
        actor: system
        preconditions: []
        side_effects: ["readiness_posture recomputed"]
      - from: READY_TO_LOAD
        to: LOADED
        trigger: "system (automatic when every Crate.status IN {LOADED, SHIPPED, DELIVERED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: READY_TO_LOAD
        trigger: "system (automatic when a crate is unloaded from its container)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: SHIPPED
        trigger: "POST /packing-jobs/{id}/ship"
        actor: LogisticsCoordinator
        preconditions:
          - "PackingList.status == RELEASED AND CommercialInvoice.status == RELEASED (ERR_DOCS_NOT_RELEASED)"
          - "every Container holding this job's crates has status == GATED_OUT (ERR_CONTAINER_INVALID_STATE)"
        side_effects:
          - "every Crate with status LOADED -> SHIPPED"
          - "increments PackingJob.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /packing-jobs/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "every Crate with status SHIPPED -> DELIVERED"
          - "delivered_at := logical clock now"
          - "increments PackingJob.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /packing-jobs/{id}/close"
        actor: SalesRep
        preconditions:
          - "no DamageClaim for this job with status IN {FILED, UNDER_REVIEW, APPROVED} (ERR_OPEN_CLAIMS)"
        side_effects:
          - "invoiced_total_cents := FINAL variant of job_quote (actual COMPLETED labor)"
          - "Customer.open_exposure_cents -= quoted_price_cents"
          - "increments PackingJob.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /packing-jobs/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "every CrateDesign in {DRAFT, IN_REVIEW, REJECTED, APPROVED, LOCKED} -> SUPERSEDED; APPROVED/LOCKED designs release wood: WoodBatch.reserved_board_feet -= board_feet_required"
          - "every Crate in {PLANNED, BUILT, PACKED} -> VOIDED"
          - "every LaborBooking in {RESERVED, CONFIRMED} -> CANCELLED"
          - "every OnsitePermit in {REQUESTED, CONFIRMED} -> CANCELLED"
          - "WoodBatch status re-derived (DEPLETED -> ACTIVE when available_board_feet becomes > 0)"
          - "increments PackingJob.version by 1"
      - from: DESIGN
        to: CANCELLED
        trigger: "POST /packing-jobs/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "same cascade as QUOTED -> CANCELLED"
          - "Customer.open_exposure_cents -= quoted_price_cents"
          - "increments PackingJob.version by 1"

  - entity: Item
    initial_state: CAPTURED
    terminal_states: []
    transitions:
      - from: CAPTURED
        to: DESIGN_APPROVED
        trigger: "system (automatic when one of its CrateDesigns transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DESIGN_APPROVED
        to: PACKED
        trigger: "system (automatic when its Crate transitions to PACKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PACKED
        to: SEALED
        trigger: "system (automatic when its Crate transitions to SEALED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SEALED
        to: PACKED
        trigger: "system (automatic when its Crate is reopened: SEALED -> REOPENED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CrateDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /designs/{id}/submit"
        actor: CratingDesigner
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /designs/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "wood_batch_id resolves to a WoodBatch with status == ACTIVE and expires_at >= logical clock now (ERR_BATCH_NOT_ACTIVE)"
          - "WoodBatch.available_board_feet >= board_feet_required (ERR_INSUFFICIENT_WOOD)"
        side_effects:
          - "wood_batch_id := payload value"
          - "WoodBatch.reserved_board_feet += board_feet_required; available_board_feet recomputed; batch auto DEPLETED if available hits 0 with (reserved+consumed)>0"
          - "Item.status CAPTURED -> DESIGN_APPROVED"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /designs/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["reject_reason := payload.reason"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /designs/{id}/revise"
        actor: CratingDesigner
        preconditions: []
        side_effects: ["revision += 1", "computed geometry fields recomputed from current Item dims"]
      - from: APPROVED
        to: LOCKED
        trigger: "system (automatic when a Crate is created pinning this design)"
        actor: system
        preconditions: []
        side_effects: ["design immutable thereafter (version-pinning)"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new CrateDesign is created for the same Item, or job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: SUPERSEDED
        trigger: "system (supersede or cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system (supersede or cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (job cancel cascade only; supersede-by-create is blocked once a Crate exists)"
        actor: system
        preconditions: []
        side_effects: ["WoodBatch.reserved_board_feet -= board_feet_required"]
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (job cancel cascade only)"
        actor: system
        preconditions: []
        side_effects: ["WoodBatch.reserved_board_feet -= board_feet_required"]

  - entity: Crate
    initial_state: PLANNED
    terminal_states: [DELIVERED, VOIDED]
    transitions:
      - from: PLANNED
        to: BUILT
        trigger: "POST /crates/{id}/build"
        actor: ShopForeman
        preconditions:
          - "PackingJob.status == PACKING (ERR_JOB_INVALID_STATE)"
          - "pinned design's WoodBatch status == ACTIVE and unexpired (ERR_BATCH_NOT_ACTIVE)"
          - "compliance_hold == false (ERR_BATCH_NOT_ACTIVE)"
        side_effects:
          - "WoodBatch.reserved_board_feet -= board_feet_required; WoodBatch.consumed_board_feet += board_feet_required"
      - from: BUILT
        to: PACKED
        trigger: "POST /crates/{id}/pack"
        actor: ShopForeman
        preconditions:
          - "payload.indicator_g == pinned design.shock_indicator_g (ERR_INDICATOR_MISMATCH)"
          - "payload.moisture_barrier == pinned design.moisture_barrier_required (ERR_BARRIER_MISMATCH)"
        side_effects: ["Item.status -> PACKED"]
      - from: REOPENED
        to: PACKED
        trigger: "POST /crates/{id}/pack"
        actor: ShopForeman
        preconditions:
          - "payload.indicator_g == pinned design.shock_indicator_g (ERR_INDICATOR_MISMATCH)"
          - "payload.moisture_barrier == pinned design.moisture_barrier_required (ERR_BARRIER_MISMATCH)"
        side_effects: []
      - from: PACKED
        to: SEALED
        trigger: "POST /crates/{id}/seal"
        actor: ComplianceOfficer
        preconditions:
          - "PackingJob.status IN {PACKING, READY_TO_LOAD} (ERR_JOB_INVALID_STATE)"
          - "Item.hazmat == false AND Item.battery_in_equipment == NONE, OR a HazmatDeclaration for this Item with status == APPROVED exists (ERR_HAZMAT_DECLARATION_REQUIRED)"
          - "pinned design's WoodBatch status == ACTIVE and unexpired AND compliance_hold == false (ERR_BATCH_NOT_ACTIVE)"
          - "WoodBatch.stamps_available > 0 (ERR_STAMPS_EXHAUSTED)"
        side_effects:
          - "stamp_serial := 'ISPM15-' + ht_certificate_no + '-' + zero-padded(stamps_applied + stamps_voided + 1, 4); stamp_status := ACTIVE"
          - "WoodBatch.stamps_applied += 1"
          - "Item.status -> SEALED"
          - "PackingJob PACKING -> READY_TO_LOAD auto-check"
      - from: SEALED
        to: REOPENED
        trigger: "POST /crates/{id}/reopen"
        actor: ShopForeman
        preconditions: []
        side_effects:
          - "stamp_status := VOIDED; stamp_serial retained for audit"
          - "WoodBatch.stamps_applied -= 1; WoodBatch.stamps_voided += 1"
          - "WoodBatch.consumed_board_feet -= 2; WoodBatch.scrapped_board_feet += 2 (padding loss)"
          - "Item.status SEALED -> PACKED"
          - "PackingJob READY_TO_LOAD -> PACKING auto-check"
      - from: SEALED
        to: LOADED
        trigger: "POST /containers/{containerId}/load-crate"
        actor: LogisticsCoordinator
        preconditions:
          - "Container.status == PLANNING (ERR_CONTAINER_INVALID_STATE)"
          - "compliance_hold == false (ERR_BATCH_NOT_ACTIVE)"
          - "Container.payload_used_kg + Container.dunnage_weight_kg + gross_weight_kg <= Container.max_payload_kg (ERR_CONTAINER_OVERWEIGHT)"
          - "DG segregation: if crate's item has APPROVED declaration with dg_class '1', no other LOADED crate may carry any DG declaration; dg_class '3' and '5.1' may not share a container (ERR_DG_SEGREGATION_VIOLATION)"
        side_effects:
          - "container_id := container; Container.payload_used_kg += gross_weight_kg"
          - "PackingJob READY_TO_LOAD -> LOADED auto-check"
      - from: LOADED
        to: SEALED
        trigger: "POST /containers/{containerId}/unload-crate"
        actor: LogisticsCoordinator
        preconditions:
          - "Container.status == PLANNING (ERR_CONTAINER_INVALID_STATE)"
        side_effects:
          - "container_id := null; Container.payload_used_kg -= gross_weight_kg"
          - "PackingJob LOADED -> READY_TO_LOAD auto-check"
      - from: LOADED
        to: SHIPPED
        trigger: "system (job ship cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "system (job deliver cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: VOIDED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BUILT
        to: VOIDED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["consumed wood is NOT returned (already cut)"]
      - from: PACKED
        to: VOIDED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HazmatDeclaration
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hazmat-declarations/{id}/submit"
        actor: ShopForeman
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /hazmat-declarations/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != prepared_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: ["approved_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /hazmat-declarations/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != prepared_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /hazmat-declarations/{id}/revise"
        actor: ShopForeman
        preconditions: []
        side_effects: ["revision += 1", "approved_by_user_id := null"]

  - entity: PackingList
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /packing-jobs/{id}/finalize-docs"
        actor: SalesRep
        preconditions: ["CommercialInvoice exists and is in {DRAFT, AMENDING} (ERR_DOC_INVALID_STATE)"]
        side_effects: ["CommercialInvoice DRAFT|AMENDING -> FINALIZED in the same call"]
      - from: AMENDING
        to: FINALIZED
        trigger: "POST /packing-jobs/{id}/finalize-docs"
        actor: SalesRep
        preconditions: ["CommercialInvoice exists and is in {DRAFT, AMENDING} (ERR_DOC_INVALID_STATE)"]
        side_effects: ["CommercialInvoice -> FINALIZED in the same call"]
      - from: FINALIZED
        to: RELEASED
        trigger: "POST /packing-jobs/{id}/release-docs"
        actor: ComplianceOfficer
        preconditions:
          - "CommercialInvoice.status == FINALIZED (ERR_DOC_INVALID_STATE)"
          - "crate_id set of PackingList.lines == crate_id set of CommercialInvoice.lines (ERR_DOC_CRATE_MISMATCH)"
          - "per crate_id, PackingList qty == CommercialInvoice qty (ERR_DOC_QUANTITY_MISMATCH)"
          - "|PackingList.total_gross_weight_kg - sum of crate gross_weight_kg| <= 0.5 (ERR_DOC_WEIGHT_MISMATCH)"
          - "CommercialInvoice.invoice_total_cents >= 0.95 * sum of Item.declared_value_cents (ERR_INVOICE_UNDERVALUED)"
        side_effects: ["CommercialInvoice FINALIZED -> RELEASED in the same call"]
      - from: RELEASED
        to: AMENDING
        trigger: "POST /packing-jobs/{id}/amend-docs"
        actor: SalesRep
        preconditions: ["PackingJob.status IN {READY_TO_LOAD, LOADED} (ERR_JOB_INVALID_STATE — cannot amend after SHIPPED)"]
        side_effects: ["CommercialInvoice RELEASED -> AMENDING in the same call"]

  - entity: CommercialInvoice
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "system (via finalize-docs on the parent job)"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: AMENDING
        to: FINALIZED
        trigger: "system (via finalize-docs)"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: RELEASED
        trigger: "system (via release-docs, after consistency checks pass)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: AMENDING
        trigger: "system (via amend-docs)"
        actor: SalesRep
        preconditions: []
        side_effects: []

  - entity: WoodBatch
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wood-batches/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "every Crate whose pinned design's wood_batch_id == this batch AND status IN {PLANNED, BUILT, PACKED, SEALED} gets compliance_hold := true"
          - "each affected Crate's PackingJob.readiness_posture recomputed (READY -> BLOCKED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wood-batches/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["expires_at >= logical clock now (ERR_BATCH_NOT_ACTIVE)"]
        side_effects:
          - "compliance_hold cleared on all crates whose pinned design uses this batch"
          - "affected PackingJob.readiness_posture recomputed"
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic when available_board_feet == 0 AND (reserved_board_feet + consumed_board_feet) > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (automatic when available_board_feet becomes > 0 after a reservation release)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: any read or use when logical clock now > expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (lazy: any read or use when logical clock now > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LaborBooking
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /labor-bookings/{id}/confirm"
        actor: ShopForeman
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /labor-bookings/{id}/complete"
        actor: ShopForeman
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /labor-bookings/{id}/cancel or system (job cancel cascade)"
        actor: ShopForeman
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /labor-bookings/{id}/cancel or system (job cancel cascade)"
        actor: ShopForeman
        preconditions: []
        side_effects: []

  - entity: OnsitePermit
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /onsite-permits/{id}/confirm"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CLOSED
        trigger: "system (job CLOSED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Container
    initial_state: PLANNING
    terminal_states: [GATED_OUT]
    transitions:
      - from: PLANNING
        to: LOCKED
        trigger: "POST /containers/{id}/lock"
        actor: LogisticsCoordinator
        preconditions: [">= 1 Crate with container_id == this container AND status == LOADED (ERR_CONTAINER_INVALID_STATE)"]
        side_effects: []
      - from: LOCKED
        to: PLANNING
        trigger: "POST /containers/{id}/unlock"
        actor: LogisticsCoordinator
        preconditions: ["payload_used_kg == 0 (ERR_CONTAINER_INVALID_STATE)"]
        side_effects: []
      - from: LOCKED
        to: GATED_OUT
        trigger: "POST /containers/{id}/gate-out"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["amount_approved_cents := claim_settlement calc (variant by claim_type)"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/appeal"
        actor: Customer
        preconditions:
          - "appeal_used == false (ERR_CLAIM_INVALID_STATE — only one appeal)"
          - "acting Customer id == job.customer_id (ERR_FORBIDDEN)"
        side_effects: ["appeal_used := true"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions: ["0 <= amount_paid_cents <= amount_approved_cents (ERR_INVALID_REQUEST)"]
        side_effects:
          - "amount_settled_cents := amount_paid_cents; amount_waived_cents := amount_approved_cents - amount_paid_cents"
          - "invariant: amount_approved_cents == amount_settled_cents + amount_waived_cents"

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/suspend"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/reinstate"
        actor: SalesRep
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: design-create-supersede-item
    parent_entity: Item
    write_endpoint: "POST /items/{itemId}/designs"
    occ_field: "expected_item_version"
    description: |
      Creating a CrateDesign supersedes the item's existing non-terminal designs and
      is legitimate even when a prior design exists; a create carrying an
      expected_item_version that no longer matches Item.version is rejected because
      the caller's view of the item's design set is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: job-patch-stale-terms
    parent_entity: PackingJob
    write_endpoint: "PATCH /packing-jobs/{id}"
    occ_field: "expected_packing_job_version"
    description: |
      Revising a QUOTED job's mode/incoterm is legitimate at any time while QUOTED;
      a patch carrying an expected_packing_job_version that no longer matches
      PackingJob.version is rejected because the caller's view of the quote basis
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_chargeable_weight
    trigger: "on Item create and on PATCH /items/{id}"
    algorithm: threshold
    formula: |
      dimensional_weight_kg = round_half_up(length_cm * width_cm * height_cm / 5000, 2)
      chargeable_weight_kg  = max(weight_kg, dimensional_weight_kg)
      volume_m3             = round(length_cm * width_cm * height_cm / 1000000, 6)
    input_set: "the single Item being written"
    constants:
      DIM_DIVISOR_CM3_PER_KG: 5000
    precision: "2 decimal places, round_half_up (volume 6 dp)"
    variants: []

  - name: crate_design_geometry
    trigger: "on CrateDesign create and on revise (recompute from current Item dims)"
    algorithm: constraint_propagation
    formula: |
      clearance_cm = {STANDARD: 5, DELICATE: 10, HIGHLY_FRAGILE: 15}[item.fragile_class]
      internal_*   = item.dim + 2 * clearance_cm            (per axis)
      thickness_cm = item.weight_kg < 50 ? 1.2 : (item.weight_kg < 500 ? 1.8 : 2.5)
      external_*   = internal_* + 2 * thickness_cm          (per axis)
      area_m2      = 2*(L*W + L*H + W*H over external dims in cm) / 10000
      board_feet_required = ceil(area_m2 * BF_PER_M2)
      tare_weight_kg      = round_half_up(board_feet_required * TARE_KG_PER_BF, 2)
      shock_indicator_g   = {STANDARD: 75, DELICATE: 50, HIGHLY_FRAGILE: 25}[item.fragile_class]
      moisture_barrier_required = VACUUM_SEALED if item.battery_in_equipment != NONE
                                  else VCI if item.fragile_class != STANDARD else NONE
    input_set: "the CrateDesign's Item (current dims/weight/flags)"
    constants:
      BF_PER_M2: 11
      TARE_KG_PER_BF: 1.8
    precision: "tare 2 dp round_half_up; board feet integer via ceil"
    variants: []

  - name: freight_classification
    trigger: "on Crate creation (gross weight and external volume known from pinned design)"
    algorithm: threshold
    formula: |
      external_volume_m3     = round(ext_l * ext_w * ext_h / 1e6, 6)
      gross_weight_kg        = item.weight_kg + tare_weight_kg
      freight_density_kg_m3  = round_half_up(gross_weight_kg / external_volume_m3, 2)
      freight_class          = first tier with density >= tier floor (floors INCLUSIVE):
                               800->'55', 400->'60', 200->'65', 100->'70',
                               50->'77.5', 25->'85', 10->'92.5', else '125'
    input_set: "the Crate + its pinned CrateDesign + its Item"
    constants: {}
    precision: "density 2 dp round_half_up; tier floors inclusive (>=)"
    variants: []

  - name: job_quote
    trigger: "GET /packing-jobs/{id}/quote (live provisional); snapshot at accept-quote; FINAL variant computed at close"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (circular-looking dependency broken by this order):
      #   1 lines -> 2 subtotal -> 3 handling tier keyed on SUBTOTAL -> 4 fuel on (subtotal+handling) -> 5 total
      wood_bf_total   = sum over items of current-design board_feet_required
      wood_cost       = wood_bf_total * WOOD_RATE_CENTS_PER_BF
      wood_discount   = 10% if wood_bf_total >= 500 else 5% if >= 200 else 0   (average-rate, whole wood_cost)
      wood_net        = round_half_up(wood_cost * (1 - wood_discount), 0)
      est_hours       = ceil(sum(item.volume_m3) * HOURS_PER_M3[mode])          # SHOP 1.5 / ONSITE 2.5
      labor_est       = est_hours * RATE[mode] + (ONSITE ? TRAVEL_FLAT : 0)     # 8500/12000, 15000
      protection      = sum over items: INDICATOR_COST[shock_indicator_g] + BARRIER_COST[moisture_barrier_required]
      hazmat_cost     = 4500 * count(items where hazmat OR battery_in_equipment != NONE)
      subtotal        = wood_net + labor + protection + hazmat_cost
      handling        = round_half_up(subtotal * (3% if subtotal >= 2000000 else 5% if subtotal >= 500000 else 8%), 0)
      fuel            = round_half_up((subtotal + handling) * 9%, 0)
      total           = subtotal + handling + fuel
    input_set: "all Items of the job with their current non-SUPERSEDED designs (a missing design contributes item volume to labor but 0 wood/protection); provisional uses estimated labor, FINAL uses actual COMPLETED bookings"
    constants:
      WOOD_RATE_CENTS_PER_BF: 350
      INDICATOR_COST: { "75": 900, "50": 1200, "25": 1800 }
      BARRIER_COST: { NONE: 0, VCI: 2500, VACUUM_SEALED: 6000 }
      HAZMAT_SURCHARGE_CENTS: 4500
      TRAVEL_FLAT_CENTS: 15000
    precision: "integer cents; round_half_up at each step; tier floors inclusive (>=)"
    variants:
      - name: PROVISIONAL
        when: "job not yet CLOSED; used for GET /quote and the accept-quote snapshot"
        difference: "labor = estimated hours from item volume (ceil(volume_m3 * HOURS_PER_M3[mode]))"
      - name: FINAL
        when: "computed once at POST /packing-jobs/{id}/close"
        difference: "labor = sum of total_cost_cents over LaborBookings with status == COMPLETED (actual hours and rates, per-booking travel surcharge); identical items therefore produce a different total whenever actual hours differ from estimated hours"

  - name: invoice_totals
    trigger: "on POST /packing-jobs/{id}/commercial-invoice (upsert)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: round EACH LINE first, then sum. Sum-then-round is FORBIDDEN.
      line_total_cents_i = round_half_up(qty_i * unit_price_cents_i, 0)
      line_duty_cents_i  = round_half_up(line_total_cents_i * duty_rate_bp_i / 10000, 0)
      invoice_total_cents = sum(line_total_cents_i)
      duty_total_cents    = sum(line_duty_cents_i)
    input_set: "the CommercialInvoice.lines payload"
    constants: {}
    precision: "integer cents; per-line round_half_up BEFORE summation"
    variants: []

  - name: claim_settlement
    trigger: "on POST /claims/{id}/approve"
    algorithm: decay_function
    formula: |
      days_since_delivery = floor((filed_at - job.delivered_at) / 86400)   # logical clock
      weeks               = floor(days_since_delivery / 7)
      base_cap            = item.declared_value_cents  (item = crate's item)
      cap = claim_type == IMPACT  ? base_cap
          : claim_type == TILT    ? base_cap
          : claim_type == MOISTURE? round_half_up(base_cap * max(0.5, 1 - 0.01 * weeks), 0)
          :                         round_half_up(base_cap * 0.5, 0)        # OTHER
      amount_approved_cents = min(amount_claimed_cents, cap)
    input_set: "the DamageClaim, its Crate's Item.declared_value_cents, PackingJob.delivered_at"
    constants:
      MOISTURE_WEEKLY_DEPRECIATION: 0.01
      MOISTURE_FLOOR: 0.5
      OTHER_CAP_FACTOR: 0.5
    precision: "integer cents, round_half_up"
    variants:
      - name: DECLARED_VALUE
        when: "claim_type IN {IMPACT, TILT}"
        difference: "cap = full declared_value_cents"
      - name: DEPRECIATED
        when: "claim_type == MOISTURE"
        difference: "cap decays 1% per whole week since delivery, floored at 50% — same claimed amount yields a lower approved amount than DECLARED_VALUE once weeks >= 1"
      - name: PARTIAL_OTHER
        when: "claim_type == OTHER"
        difference: "cap = 50% of declared value"

  - name: labor_booking_cost
    trigger: "on LaborBooking create"
    algorithm: aggregation
    formula: |
      hours = round((end_at - start_at) / 3600 seconds, 2)
      rate_cents_per_hour = SHOP ? 8500 : 12000
      travel_surcharge_cents = ONSITE ? 15000 : 0
      total_cost_cents = round_half_up(hours * rate_cents_per_hour, 0) + travel_surcharge_cents
    input_set: "the single LaborBooking"
    constants: {}
    precision: "hours 2 dp; total integer cents round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list; for Customer-role writes the X-User-ID must equal the owning customer id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body shape: required fields present, types valid, enum members valid, ranges valid (>0 dims/weight, end_at > start_at, qty >= 1, amount > 0, duty_rate_bp 0..10000)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids resolve left-to-right; body FK ids (customer_id, wood_batch_id, design_id, crew_id, crate_id, doc-line crate_ids) resolve and belong to the path parent", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version matches the parent's current version (designs POST, job PATCH)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /items/{itemId}/designs", "PATCH /packing-jobs/{id}"] }
  - { priority: 6, category: state, check: "PackingJob in required from-state for the action (accept needs QUOTED; start-packing needs DESIGN; ship needs LOADED; deliver SHIPPED; close DELIVERED; cancel QUOTED|DESIGN; items create/PATCH need QUOTED; bookings need post-accept; docs upsert needs DESIGN..LOADED)", error_id: ERR_JOB_INVALID_STATE, http_status: 409, applies_to: "job-scoped actions" }
  - { priority: 7, category: state, check: "Customer.status == ACTIVE for job create and accept-quote", error_id: ERR_CUSTOMER_SUSPENDED, http_status: 409, applies_to: ["POST /packing-jobs", "POST /packing-jobs/{id}/accept-quote"] }
  - { priority: 8, category: state, check: "CrateDesign transition guards (submit from DRAFT; approve/reject from IN_REVIEW; revise from REJECTED)", error_id: ERR_DESIGN_INVALID_STATE, http_status: 409, applies_to: "design actions" }
  - { priority: 9, category: state, check: "Crate transition guards (build from PLANNED; pack from BUILT|REOPENED; seal from PACKED; reopen from SEALED)", error_id: ERR_CRATE_INVALID_STATE, http_status: 409, applies_to: "crate actions" }
  - { priority: 10, category: state, check: "HazmatDeclaration transition guards (submit from DRAFT; approve/reject from SUBMITTED; revise from REJECTED)", error_id: ERR_DECLARATION_INVALID_STATE, http_status: 409, applies_to: "hazmat-declaration actions" }
  - { priority: 11, category: state, check: "Document transition guards (finalize needs both DRAFT|AMENDING; release needs both FINALIZED; amend needs both RELEASED; upsert needs DRAFT|AMENDING)", error_id: ERR_DOC_INVALID_STATE, http_status: 409, applies_to: "docs endpoints" }
  - { priority: 12, category: state, check: "Container transition guards (lock needs >=1 LOADED crate; unlock needs payload_used_kg == 0; gate-out from LOCKED; load/unload need PLANNING)", error_id: ERR_CONTAINER_INVALID_STATE, http_status: 409, applies_to: "container actions" }
  - { priority: 13, category: state, check: "DamageClaim transition guards (review from FILED; approve/deny from UNDER_REVIEW; settle from APPROVED; appeal from DENIED with appeal_used == false)", error_id: ERR_CLAIM_INVALID_STATE, http_status: 409, applies_to: "claim actions" }
  - { priority: 14, category: state, check: "LaborBooking/OnsitePermit/WoodBatch/Customer lifecycle guards (confirm from RESERVED; complete from CONFIRMED; suspend from ACTIVE; reinstate from SUSPENDED; etc.)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "booking/permit/batch/customer actions" }
  - { priority: 15, category: state, check: "start-packing cross-entity guards: every Item has design APPROVED|LOCKED; ONSITE mode requires CONFIRMED permit", error_id: ERR_NO_APPROVED_DESIGN, http_status: 409, applies_to: ["POST /packing-jobs/{id}/start-packing"], description: "ERR_PERMIT_REQUIRED (409) used for the permit guard; same priority tier" }
  - { priority: 16, category: state, check: "ship requires both docs RELEASED", error_id: ERR_DOCS_NOT_RELEASED, http_status: 409, applies_to: ["POST /packing-jobs/{id}/ship"] }
  - { priority: 17, category: state, check: "close requires no open claims (FILED|UNDER_REVIEW|APPROVED)", error_id: ERR_OPEN_CLAIMS, http_status: 409, applies_to: ["POST /packing-jobs/{id}/close"] }
  - { priority: 18, category: state, check: "Item PATCH / design-create guards: PATCH rejected when a non-SUPERSEDED design exists; design create rejected when a non-VOIDED Crate exists", error_id: ERR_ITEM_NOT_CAPTURABLE, http_status: 409, applies_to: ["PATCH /items/{id}", "POST /items/{itemId}/designs"], description: "ERR_ITEM_HAS_CRATE (409) for the crate-exists case; same priority tier" }
  - { priority: 19, category: business_safety, check: "seal: hazmat/battery item must have an APPROVED HazmatDeclaration", error_id: ERR_HAZMAT_DECLARATION_REQUIRED, http_status: 422, applies_to: ["POST /crates/{id}/seal"] }
  - { priority: 20, category: business_safety, check: "approve/build/seal: pinned or selected WoodBatch must be ACTIVE and unexpired vs logical clock; crate.compliance_hold must be false", error_id: ERR_BATCH_NOT_ACTIVE, http_status: 409, applies_to: ["POST /designs/{id}/approve", "POST /crates/{id}/build", "POST /crates/{id}/seal"] }
  - { priority: 21, category: business_safety, check: "load-crate DG segregation: dg_class '1' shares with no other DG crate; '3' and '5.1' may not co-load", error_id: ERR_DG_SEGREGATION_VIOLATION, http_status: 422, applies_to: ["POST /containers/{id}/load-crate"] }
  - { priority: 22, category: business_safety, check: "pack: indicator_g and moisture_barrier must equal pinned design's required values", error_id: ERR_INDICATOR_MISMATCH, http_status: 422, applies_to: ["POST /crates/{id}/pack"], description: "ERR_BARRIER_MISMATCH (422) for barrier mismatch; indicator checked first" }
  - { priority: 23, category: business_safety, check: "booking: crew capabilities must include mode capability (SHOP_BUILD|ONSITE_PACK) and HAZMAT_CERT when the job has any hazmat/battery item", error_id: ERR_CREW_UNQUALIFIED, http_status: 422, applies_to: ["POST /packing-jobs/{id}/labor-bookings"] }
  - { priority: 24, category: business_safety, check: "hazmat approve/reject: X-User-ID must differ from prepared_by_user_id (segregation of duties)", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: ["POST /hazmat-declarations/{id}/approve", "POST /hazmat-declarations/{id}/reject"] }
  - { priority: 25, category: business_temporal, check: "claim create: logical clock now - job.delivered_at <= 30 days", error_id: ERR_CLAIM_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /packing-jobs/{id}/claims"] }
  - { priority: 26, category: business_constraint, check: "booking: half-open [start_at, end_at) must not overlap any RESERVED|CONFIRMED booking of the same Crew (adjacency allowed)", error_id: ERR_CREW_DOUBLE_BOOKED, http_status: 409, applies_to: ["POST /packing-jobs/{id}/labor-bookings"] }
  - { priority: 27, category: business_constraint, check: "permit: closed window +/- 60-minute buffer must not intersect any REQUESTED|CONFIRMED permit with the same site_code (adjacency within buffer rejected)", error_id: ERR_PERMIT_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /packing-jobs/{id}/onsite-permit"] }
  - { priority: 28, category: business_constraint, check: "uniqueness: Customer.site_code, WoodBatch.ht_certificate_no, Container.container_no, one PackingList/CommercialInvoice per job, one non-VOIDED Crate per Item", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "create endpoints" }
  - { priority: 29, category: business_referential, check: "release-docs consistency in pinned order: crate_id sets equal; per-crate qty equal; PL gross weight within 0.5 kg of crate gross sum; invoice_total >= 95% of declared value sum", error_id: ERR_DOC_CRATE_MISMATCH, http_status: 422, applies_to: ["POST /packing-jobs/{id}/release-docs"], description: "sub-order: ERR_DOC_CRATE_MISMATCH -> ERR_DOC_QUANTITY_MISMATCH -> ERR_DOC_WEIGHT_MISMATCH -> ERR_INVOICE_UNDERVALUED (all 422)" }
  - { priority: 30, category: business_referential, check: "crate create: design_id belongs to this item and is APPROVED", error_id: ERR_NO_APPROVED_DESIGN, http_status: 409, applies_to: ["POST /items/{itemId}/crates"] }
  - { priority: 31, category: business_fiscal, check: "accept-quote: open_exposure_cents + quoted_price_cents <= credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /packing-jobs/{id}/accept-quote"] }
  - { priority: 32, category: business_fiscal, check: "design approve: WoodBatch.available_board_feet >= board_feet_required", error_id: ERR_INSUFFICIENT_WOOD, http_status: 422, applies_to: ["POST /designs/{id}/approve"] }
  - { priority: 33, category: business_fiscal, check: "seal: WoodBatch.stamps_available > 0", error_id: ERR_STAMPS_EXHAUSTED, http_status: 422, applies_to: ["POST /crates/{id}/seal"] }
  - { priority: 34, category: business_fiscal, check: "load-crate: payload_used_kg + dunnage_weight_kg + gross_weight_kg <= max_payload_kg (inclusive)", error_id: ERR_CONTAINER_OVERWEIGHT, http_status: 422, applies_to: ["POST /containers/{id}/load-crate"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/crating/customers", description: "Create a Customer", roles: [SalesRep], code: 201, input: [name, site_code, credit_limit_cents], output: Customer, side_effects: ["status=ACTIVE, open_exposure_cents=0"] }
  - { method: GET, path: "/crating/customers/{id}", description: "Get a Customer", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/crating/customers", description: "List Customers", roles: [SalesRep, ComplianceOfficer, ShopForeman, LogisticsCoordinator, ClaimsAdjuster, CratingDesigner], code: 200, input: ["status?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: PATCH, path: "/crating/customers/{id}", description: "Update name/credit limit", roles: [SalesRep], code: 200, input: ["name?", "credit_limit_cents?"], output: Customer, side_effects: ["increments Customer.version by 1"] }
  - { method: POST, path: "/crating/customers/{id}/suspend", description: "Suspend a Customer", roles: [SalesRep], code: 200, input: [], output: Customer, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/crating/customers/{id}/reinstate", description: "Reinstate a Customer", roles: [SalesRep], code: 200, input: [], output: Customer, side_effects: ["status -> ACTIVE"] }

  # --- PackingJob ---
  - { method: POST, path: "/crating/packing-jobs", description: "Create a PackingJob (status QUOTED)", roles: [SalesRep], code: 201, input: [customer_id, mode, incoterm], output: PackingJob, side_effects: ["status=QUOTED, readiness_posture=BLOCKED"] }
  - { method: GET, path: "/crating/packing-jobs/{id}", description: "Get a PackingJob", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: PackingJob, side_effects: [] }
  - { method: GET, path: "/crating/packing-jobs", description: "List PackingJobs", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["customer_id?", "status?", "limit?", "offset?"], output: "PackingJob[]", side_effects: [] }
  - { method: PATCH, path: "/crating/packing-jobs/{id}", description: "Revise mode/incoterm while QUOTED (OCC)", roles: [SalesRep], code: 200, input: [expected_packing_job_version, "mode?", "incoterm?"], output: PackingJob, side_effects: ["increments PackingJob.version by 1", "live quote recomputed"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/accept-quote", description: "Customer accepts the quote (QUOTED -> DESIGN)", roles: [Customer], code: 200, input: [], output: PackingJob, side_effects: ["quoted_price_cents snapshot frozen", "Customer.open_exposure_cents += quoted_price_cents", "increments PackingJob.version by 1"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/start-packing", description: "DESIGN -> PACKING", roles: [ShopForeman], code: 200, input: [], output: PackingJob, side_effects: ["increments PackingJob.version by 1"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/ship", description: "LOADED -> SHIPPED (docs must be RELEASED; containers GATED_OUT)", roles: [LogisticsCoordinator], code: 200, input: [], output: PackingJob, side_effects: ["crates LOADED -> SHIPPED", "increments PackingJob.version by 1"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/deliver", description: "SHIPPED -> DELIVERED; stamps delivered_at from logical clock", roles: [LogisticsCoordinator], code: 200, input: [], output: PackingJob, side_effects: ["crates SHIPPED -> DELIVERED", "delivered_at set", "increments PackingJob.version by 1"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/close", description: "DELIVERED -> CLOSED; computes FINAL invoice from COMPLETED bookings", roles: [SalesRep], code: 200, input: [], output: PackingJob, side_effects: ["invoiced_total_cents := job_quote FINAL", "Customer.open_exposure_cents -= quoted_price_cents", "increments PackingJob.version by 1"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/cancel", description: "QUOTED|DESIGN -> CANCELLED with full cascade", roles: [SalesRep], code: 200, input: [], output: PackingJob, side_effects: ["designs SUPERSEDED + wood reservations released", "crates VOIDED", "bookings/permits CANCELLED", "batch status re-derived", "exposure released if accepted"] }
  - { method: GET, path: "/crating/packing-jobs/{id}/quote", description: "Computed read: live provisional quote breakdown", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: { quoted_price_cents: integer, subtotal_cents: integer, wood_cost_cents: integer, labor_cost_cents: integer, protection_cost_cents: integer, hazmat_cost_cents: integer, handling_fee_cents: integer, fuel_surcharge_cents: integer, estimated_labor_hours: integer, total_chargeable_weight_kg: number, total_board_feet: integer }, side_effects: [] }

  # --- Item ---
  - { method: POST, path: "/crating/packing-jobs/{id}/items", description: "Capture an item (dims/weight/flags); job must be QUOTED", roles: [SalesRep], code: 201, input: [description, length_cm, width_cm, height_cm, weight_kg, fragile_class, declared_value_cents, "hazmat?", "battery_in_equipment?", "chargeable_weight_kg?", "dimensional_weight_kg?"], output: Item, side_effects: ["computed volume/dim/chargeable weights; any client-sent computed field is ignored", "increments PackingJob.version by 1"] }
  - { method: GET, path: "/crating/items/{id}", description: "Get an Item", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: Item, side_effects: [] }
  - { method: GET, path: "/crating/items", description: "List Items", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["packing_job_id?", "status?", "limit?", "offset?"], output: "Item[]", side_effects: [] }
  - { method: PATCH, path: "/crating/items/{id}", description: "Correct captured dims/flags; rejected once a non-SUPERSEDED design exists", roles: [SalesRep], code: 200, input: ["description?", "length_cm?", "width_cm?", "height_cm?", "weight_kg?", "fragile_class?", "hazmat?", "battery_in_equipment?", "declared_value_cents?"], output: Item, side_effects: ["recomputes volume/dim/chargeable", "increments Item.version by 1", "increments PackingJob.version by 1"] }

  # --- CrateDesign ---
  - { method: POST, path: "/crating/items/{itemId}/designs", description: "Create a CrateDesign (OCC on Item; supersedes existing DRAFT/IN_REVIEW/REJECTED designs)", roles: [CratingDesigner], code: 201, input: [expected_item_version], output: CrateDesign, side_effects: ["existing DRAFT|IN_REVIEW|REJECTED designs -> SUPERSEDED", "revision = prior design count + 1", "increments Item.version by 1"] }
  - { method: GET, path: "/crating/designs/{id}", description: "Get a CrateDesign", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: CrateDesign, side_effects: [] }
  - { method: GET, path: "/crating/designs", description: "List CrateDesigns", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["item_id?", "wood_batch_id?", "status?", "limit?", "offset?"], output: "CrateDesign[]", side_effects: [] }
  - { method: POST, path: "/crating/designs/{id}/submit", description: "DRAFT -> IN_REVIEW", roles: [CratingDesigner], code: 200, input: [], output: CrateDesign, side_effects: [] }
  - { method: POST, path: "/crating/designs/{id}/approve", description: "IN_REVIEW -> APPROVED; selects WoodBatch and reserves board feet", roles: [ComplianceOfficer], code: 200, input: [wood_batch_id], output: CrateDesign, side_effects: ["wood_batch_id pinned", "WoodBatch.reserved_board_feet += board_feet_required", "Item -> DESIGN_APPROVED"] }
  - { method: POST, path: "/crating/designs/{id}/reject", description: "IN_REVIEW -> REJECTED", roles: [ComplianceOfficer], code: 200, input: [reason], output: CrateDesign, side_effects: ["reject_reason set"] }
  - { method: POST, path: "/crating/designs/{id}/revise", description: "REJECTED -> DRAFT; revision += 1; geometry recomputed", roles: [CratingDesigner], code: 200, input: [], output: CrateDesign, side_effects: ["revision += 1"] }

  # --- WoodBatch ---
  - { method: POST, path: "/crating/wood-batches", description: "Register an ISPM-15 certified lumber batch", roles: [ComplianceOfficer], code: 201, input: [ht_certificate_no, treatment_type, expires_at, received_board_feet, stamps_acquired], output: WoodBatch, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/crating/wood-batches/{id}", description: "Get a WoodBatch (lazy EXPIRED evaluation against logical clock)", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: WoodBatch, side_effects: ["status may flip to EXPIRED"] }
  - { method: GET, path: "/crating/wood-batches", description: "List WoodBatches", roles: [SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "WoodBatch[]", side_effects: [] }
  - { method: POST, path: "/crating/wood-batches/{id}/suspend", description: "ACTIVE -> SUSPENDED; cascades compliance holds", roles: [ComplianceOfficer], code: 200, input: [], output: WoodBatch, side_effects: ["crate compliance_hold set", "job readiness_posture recomputed"] }
  - { method: POST, path: "/crating/wood-batches/{id}/reinstate", description: "SUSPENDED -> ACTIVE; clears compliance holds", roles: [ComplianceOfficer], code: 200, input: [], output: WoodBatch, side_effects: ["crate compliance_hold cleared", "job readiness_posture recomputed"] }

  # --- Crate ---
  - { method: POST, path: "/crating/items/{itemId}/crates", description: "Create a Crate pinning an APPROVED design (design -> LOCKED)", roles: [ShopForeman], code: 201, input: [design_id], output: Crate, side_effects: ["CrateDesign APPROVED -> LOCKED", "tare/gross/volume/density/freight_class computed", "status=PLANNED"] }
  - { method: GET, path: "/crating/crates/{id}", description: "Get a Crate", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: Crate, side_effects: [] }
  - { method: GET, path: "/crating/crates", description: "List Crates", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["item_id?", "packing_job_id?", "container_id?", "design_id?", "status?", "limit?", "offset?"], output: "Crate[]", side_effects: [] }
  - { method: POST, path: "/crating/crates/{id}/build", description: "PLANNED -> BUILT; consumes reserved wood", roles: [ShopForeman], code: 200, input: [], output: Crate, side_effects: ["batch reserved -> consumed"] }
  - { method: POST, path: "/crating/crates/{id}/pack", description: "BUILT|REOPENED -> PACKED; records protection devices", roles: [ShopForeman], code: 200, input: [indicator_g, moisture_barrier], output: Crate, side_effects: ["Item -> PACKED (from BUILT path)"] }
  - { method: POST, path: "/crating/crates/{id}/seal", description: "PACKED -> SEALED; mints ISPM-15 stamp serial", roles: [ComplianceOfficer], code: 200, input: [], output: Crate, side_effects: ["stamp_serial minted", "batch stamps_applied += 1", "Item -> SEALED", "job READY_TO_LOAD auto-check"] }
  - { method: POST, path: "/crating/crates/{id}/reopen", description: "SEALED -> REOPENED; voids stamp, scraps padding", roles: [ShopForeman], code: 200, input: [], output: Crate, side_effects: ["stamp voided", "batch stamps_applied -= 1, stamps_voided += 1", "batch consumed -= 2, scrapped += 2", "Item -> PACKED", "job PACKING auto-revert"] }

  # --- HazmatDeclaration ---
  - { method: POST, path: "/crating/items/{itemId}/hazmat-declarations", description: "Create a DRAFT declaration for an item", roles: [ShopForeman, ComplianceOfficer], code: 201, input: [un_number, dg_class, packing_group, "battery_type?"], output: HazmatDeclaration, side_effects: ["prepared_by_user_id := X-User-ID"] }
  - { method: GET, path: "/crating/hazmat-declarations/{id}", description: "Get a HazmatDeclaration", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: HazmatDeclaration, side_effects: [] }
  - { method: GET, path: "/crating/hazmat-declarations", description: "List HazmatDeclarations", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["item_id?", "status?", "limit?", "offset?"], output: "HazmatDeclaration[]", side_effects: [] }
  - { method: POST, path: "/crating/hazmat-declarations/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [ShopForeman, ComplianceOfficer], code: 200, input: [], output: HazmatDeclaration, side_effects: [] }
  - { method: POST, path: "/crating/hazmat-declarations/{id}/approve", description: "SUBMITTED -> APPROVED (SoD: approver != preparer)", roles: [ComplianceOfficer], code: 200, input: [], output: HazmatDeclaration, side_effects: ["approved_by_user_id set"] }
  - { method: POST, path: "/crating/hazmat-declarations/{id}/reject", description: "SUBMITTED -> REJECTED (SoD applies)", roles: [ComplianceOfficer], code: 200, input: [], output: HazmatDeclaration, side_effects: [] }
  - { method: POST, path: "/crating/hazmat-declarations/{id}/revise", description: "REJECTED -> DRAFT; revision += 1", roles: [ShopForeman, ComplianceOfficer], code: 200, input: [], output: HazmatDeclaration, side_effects: ["revision += 1"] }

  # --- Export documents ---
  - { method: POST, path: "/crating/packing-jobs/{id}/packing-list", description: "Create or replace the PackingList while DRAFT|AMENDING", roles: [SalesRep], code: 201, input: [lines], output: PackingList, side_effects: ["total_gross_weight_kg recomputed"] }
  - { method: GET, path: "/crating/packing-lists/{id}", description: "Get a PackingList", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: PackingList, side_effects: [] }
  - { method: GET, path: "/crating/packing-lists", description: "List PackingLists", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["packing_job_id?", "status?", "limit?", "offset?"], output: "PackingList[]", side_effects: [] }
  - { method: POST, path: "/crating/packing-jobs/{id}/commercial-invoice", description: "Create or replace the CommercialInvoice while DRAFT|AMENDING", roles: [SalesRep], code: 201, input: [lines], output: CommercialInvoice, side_effects: ["invoice_total_cents and duty_total_cents recomputed (per-line rounding)"] }
  - { method: GET, path: "/crating/commercial-invoices/{id}", description: "Get a CommercialInvoice", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: CommercialInvoice, side_effects: [] }
  - { method: GET, path: "/crating/commercial-invoices", description: "List CommercialInvoices", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["packing_job_id?", "status?", "limit?", "offset?"], output: "CommercialInvoice[]", side_effects: [] }
  - { method: POST, path: "/crating/packing-jobs/{id}/finalize-docs", description: "Both docs DRAFT|AMENDING -> FINALIZED", roles: [SalesRep], code: 200, input: [], output: PackingList, side_effects: ["PackingList FINALIZED", "CommercialInvoice FINALIZED"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/release-docs", description: "Both docs FINALIZED -> RELEASED after consistency checks (ComplianceOfficer only — SoD vs SalesRep finalize)", roles: [ComplianceOfficer], code: 200, input: [], output: PackingList, side_effects: ["PackingList RELEASED", "CommercialInvoice RELEASED"] }
  - { method: POST, path: "/crating/packing-jobs/{id}/amend-docs", description: "Both docs RELEASED -> AMENDING (only before SHIPPED)", roles: [SalesRep], code: 200, input: [], output: PackingList, side_effects: ["PackingList AMENDING", "CommercialInvoice AMENDING"] }

  # --- Crew / LaborBooking / OnsitePermit ---
  - { method: POST, path: "/crating/crews", description: "Create a Crew", roles: [ShopForeman], code: 201, input: [name, capabilities], output: Crew, side_effects: [] }
  - { method: GET, path: "/crating/crews/{id}", description: "Get a Crew", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: Crew, side_effects: [] }
  - { method: POST, path: "/crating/packing-jobs/{id}/labor-bookings", description: "Book crew time (half-open overlap check on crew)", roles: [ShopForeman], code: 201, input: [crew_id, mode, start_at, end_at], output: LaborBooking, side_effects: ["hours/rate/total computed", "status=RESERVED"] }
  - { method: GET, path: "/crating/labor-bookings/{id}", description: "Get a LaborBooking", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: LaborBooking, side_effects: [] }
  - { method: GET, path: "/crating/labor-bookings", description: "List LaborBookings", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["crew_id?", "packing_job_id?", "status?", "limit?", "offset?"], output: "LaborBooking[]", side_effects: [] }
  - { method: POST, path: "/crating/labor-bookings/{id}/confirm", description: "RESERVED -> CONFIRMED", roles: [ShopForeman], code: 200, input: [], output: LaborBooking, side_effects: [] }
  - { method: POST, path: "/crating/labor-bookings/{id}/complete", description: "CONFIRMED -> COMPLETED", roles: [ShopForeman], code: 200, input: [], output: LaborBooking, side_effects: [] }
  - { method: POST, path: "/crating/labor-bookings/{id}/cancel", description: "RESERVED|CONFIRMED -> CANCELLED", roles: [ShopForeman], code: 200, input: [], output: LaborBooking, side_effects: [] }
  - { method: POST, path: "/crating/packing-jobs/{id}/onsite-permit", description: "Request an on-site permit window (buffered overlap check on site_code)", roles: [LogisticsCoordinator], code: 201, input: [window_start, window_end], output: OnsitePermit, side_effects: ["site_code copied from customer", "status=REQUESTED"] }
  - { method: GET, path: "/crating/onsite-permits/{id}", description: "Get an OnsitePermit", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: OnsitePermit, side_effects: [] }
  - { method: GET, path: "/crating/onsite-permits", description: "List OnsitePermits", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["packing_job_id?", "site_code?", "status?", "limit?", "offset?"], output: "OnsitePermit[]", side_effects: [] }
  - { method: POST, path: "/crating/onsite-permits/{id}/confirm", description: "REQUESTED -> CONFIRMED", roles: [LogisticsCoordinator], code: 200, input: [], output: OnsitePermit, side_effects: [] }

  # --- Container / load plan ---
  - { method: POST, path: "/crating/containers", description: "Create a Container", roles: [LogisticsCoordinator], code: 201, input: [container_no, size, "dunnage_weight_kg?"], output: Container, side_effects: ["max_payload_kg derived", "status=PLANNING"] }
  - { method: GET, path: "/crating/containers/{id}", description: "Get a Container", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: Container, side_effects: [] }
  - { method: POST, path: "/crating/containers/{id}/lock", description: "PLANNING -> LOCKED (needs >= 1 LOADED crate)", roles: [LogisticsCoordinator], code: 200, input: [], output: Container, side_effects: [] }
  - { method: POST, path: "/crating/containers/{id}/unlock", description: "LOCKED -> PLANNING (only when payload_used_kg == 0)", roles: [LogisticsCoordinator], code: 200, input: [], output: Container, side_effects: [] }
  - { method: POST, path: "/crating/containers/{id}/load-crate", description: "Assign a SEALED crate; weight + DG segregation checks; crate -> LOADED", roles: [LogisticsCoordinator], code: 200, input: [crate_id], output: Crate, side_effects: ["Crate.container_id set", "Container.payload_used_kg += gross", "job LOADED auto-check"] }
  - { method: POST, path: "/crating/containers/{id}/unload-crate", description: "Remove a LOADED crate; crate -> SEALED", roles: [LogisticsCoordinator], code: 200, input: [crate_id], output: Crate, side_effects: ["Crate.container_id cleared", "Container.payload_used_kg -= gross", "job READY_TO_LOAD auto-revert"] }
  - { method: POST, path: "/crating/containers/{id}/gate-out", description: "LOCKED -> GATED_OUT", roles: [LogisticsCoordinator], code: 200, input: [], output: Container, side_effects: [] }

  # --- DamageClaim ---
  - { method: POST, path: "/crating/packing-jobs/{id}/claims", description: "File a damage claim (job DELIVERED; <=30-day window by logical clock)", roles: [Customer], code: 201, input: [crate_id, claim_type, description, amount_claimed_cents], output: DamageClaim, side_effects: ["filed_at := logical clock now"] }
  - { method: GET, path: "/crating/claims/{id}", description: "Get a DamageClaim", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: GET, path: "/crating/claims", description: "List DamageClaims", roles: [Customer, SalesRep, CratingDesigner, ShopForeman, ComplianceOfficer, LogisticsCoordinator, ClaimsAdjuster], code: 200, input: ["packing_job_id?", "crate_id?", "status?", "limit?", "offset?"], output: "DamageClaim[]", side_effects: [] }
  - { method: POST, path: "/crating/claims/{id}/review", description: "FILED -> UNDER_REVIEW", roles: [ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: POST, path: "/crating/claims/{id}/approve", description: "UNDER_REVIEW -> APPROVED; computes amount_approved_cents", roles: [ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: ["claim_settlement calc"] }
  - { method: POST, path: "/crating/claims/{id}/deny", description: "UNDER_REVIEW -> DENIED", roles: [ClaimsAdjuster], code: 200, input: [], output: DamageClaim, side_effects: [] }
  - { method: POST, path: "/crating/claims/{id}/settle", description: "APPROVED -> SETTLED; records paid/waived split", roles: [ClaimsAdjuster], code: 200, input: [amount_paid_cents], output: DamageClaim, side_effects: ["amount_settled_cents + amount_waived_cents == amount_approved_cents"] }
  - { method: POST, path: "/crating/claims/{id}/appeal", description: "DENIED -> UNDER_REVIEW (once)", roles: [Customer], code: 200, input: [], output: DamageClaim, side_effects: ["appeal_used := true"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/crating/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["lazy EXPIRED re-evaluation on next batch read/use"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint, or entity-backed identity mismatch (Customer acting on another customer's resource)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or range violation (non-positive dims, end<=start, qty<1, etc.)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist (or FK parent mismatch)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_JOB_INVALID_STATE, http: 409, condition: "PackingJob not in the required from-state for the requested action" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer.status == SUSPENDED on job create or accept-quote" }
  - { id: ERR_DESIGN_INVALID_STATE, http: 409, condition: "CrateDesign transition attempted from a non-source state" }
  - { id: ERR_CRATE_INVALID_STATE, http: 409, condition: "Crate transition attempted from a non-source state (e.g. seal a BUILT crate)" }
  - { id: ERR_DECLARATION_INVALID_STATE, http: 409, condition: "HazmatDeclaration transition attempted from a non-source state" }
  - { id: ERR_DOC_INVALID_STATE, http: 409, condition: "Document transition guard failed (upsert/finalize/release/amend from wrong state, or missing sibling doc)" }
  - { id: ERR_CONTAINER_INVALID_STATE, http: 409, condition: "Container transition guard failed (lock without LOADED crate, unlock with payload, load/unload outside PLANNING)" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "DamageClaim transition attempted from a non-source state (incl. second appeal)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Lifecycle guard on LaborBooking/OnsitePermit/WoodBatch/Customer transitions" }
  - { id: ERR_NO_APPROVED_DESIGN, http: 409, condition: "start-packing without APPROVED|LOCKED design for every item, or crate create without an APPROVED design for the item" }
  - { id: ERR_PERMIT_REQUIRED, http: 409, condition: "start-packing on ONSITE job without a CONFIRMED OnsitePermit" }
  - { id: ERR_DOCS_NOT_RELEASED, http: 409, condition: "ship attempted before both documents are RELEASED" }
  - { id: ERR_OPEN_CLAIMS, http: 409, condition: "close attempted with claims in FILED|UNDER_REVIEW|APPROVED" }
  - { id: ERR_ITEM_NOT_CAPTURABLE, http: 409, condition: "PATCH item attempted while a non-SUPERSEDED CrateDesign exists" }
  - { id: ERR_ITEM_HAS_CRATE, http: 409, condition: "CrateDesign create attempted on an item that already has a non-VOIDED Crate" }
  - { id: ERR_HAZMAT_DECLARATION_REQUIRED, http: 422, condition: "seal attempted on a hazmat/battery item without an APPROVED HazmatDeclaration" }
  - { id: ERR_BATCH_NOT_ACTIVE, http: 409, condition: "WoodBatch not ACTIVE or expired vs logical clock (approve/build/seal), or crate under compliance_hold" }
  - { id: ERR_DG_SEGREGATION_VIOLATION, http: 422, condition: "load-crate would co-load incompatible DG classes ('1' with any DG; '3' with '5.1')" }
  - { id: ERR_INDICATOR_MISMATCH, http: 422, condition: "pack indicator_g != pinned design's shock_indicator_g" }
  - { id: ERR_BARRIER_MISMATCH, http: 422, condition: "pack moisture_barrier != pinned design's moisture_barrier_required" }
  - { id: ERR_CREW_UNQUALIFIED, http: 422, condition: "Crew lacks mode capability or HAZMAT_CERT required by the job's items" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Claim filed more than 30 days (logical clock) after delivered_at" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Half-open interval overlap with an existing RESERVED|CONFIRMED booking on the same Crew" }
  - { id: ERR_PERMIT_WINDOW_CONFLICT, http: 409, condition: "Buffered (+/-60min) closed-window intersection with an existing REQUESTED|CONFIRMED permit on the same site_code" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (site_code, ht_certificate_no, container_no, second PL/CI create per job, second non-VOIDED crate per item)" }
  - { id: ERR_DOC_CRATE_MISMATCH, http: 422, condition: "release-docs: PackingList crate_id set != CommercialInvoice crate_id set" }
  - { id: ERR_DOC_QUANTITY_MISMATCH, http: 422, condition: "release-docs: per-crate qty differs between the two documents" }
  - { id: ERR_DOC_WEIGHT_MISMATCH, http: 422, condition: "release-docs: |PL total gross - sum(crate gross)| > 0.5 kg" }
  - { id: ERR_INVOICE_UNDERVALUED, http: 422, condition: "release-docs: invoice_total_cents < 95% of the sum of declared values" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Hazmat approver/rejector X-User-ID equals prepared_by_user_id" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "accept-quote would push Customer.open_exposure_cents above credit_limit_cents" }
  - { id: ERR_INSUFFICIENT_WOOD, http: 422, condition: "design approve: WoodBatch.available_board_feet < board_feet_required" }
  - { id: ERR_STAMPS_EXHAUSTED, http: 422, condition: "seal: WoodBatch.stamps_available == 0" }
  - { id: ERR_CONTAINER_OVERWEIGHT, http: 422, condition: "load-crate: payload_used + dunnage + crate gross > max_payload_kg" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "External client; owns jobs; accepts quotes and files damage claims"
    identity: "entity_backed:Customer"
    exclusive_operations: ["accept-quote", "create damage claim", "appeal damage claim"]
    shared_operations: ["GET reads across own resources"]
  - name: SalesRep
    description: "Inside sales; intake of customers/jobs/items, document preparation, job close/cancel"
    identity: "opaque"
    exclusive_operations: ["customer create/update/suspend/reinstate", "job create/patch/close/cancel", "item create/patch", "document upsert/finalize/amend"]
    shared_operations: ["GET reads"]
  - name: CratingDesigner
    description: "Crate engineer; authors and revises crate designs"
    identity: "opaque"
    exclusive_operations: ["design create/submit/revise"]
    shared_operations: ["GET reads"]
  - name: ShopForeman
    description: "Shop floor lead; builds/packs/reopens crates, manages crews and labor bookings"
    identity: "opaque"
    exclusive_operations: ["crate create/build/pack/reopen", "crew create", "labor booking create/confirm/complete/cancel", "start-packing", "hazmat declaration create/submit/revise (shared with ComplianceOfficer)"]
    shared_operations: ["GET reads"]
  - name: ComplianceOfficer
    description: "ISPM-15 stamp custodian and DG authority; approves designs and declarations, seals crates, releases export documents, controls wood batches"
    identity: "opaque"
    exclusive_operations: ["design approve/reject", "wood batch create/suspend/reinstate", "crate seal", "hazmat approve/reject", "release-docs"]
    shared_operations: ["hazmat declaration create/submit/revise", "GET reads"]
  - name: LogisticsCoordinator
    description: "Export logistics; containers/load plan, ship/deliver, on-site permits"
    identity: "opaque"
    exclusive_operations: ["container create/lock/unlock/load-crate/unload-crate/gate-out", "ship", "deliver", "onsite permit create/confirm"]
    shared_operations: ["GET reads"]
  - name: ClaimsAdjuster
    description: "Post-delivery claims handling"
    identity: "opaque"
    exclusive_operations: ["claim review/approve/deny/settle"]
    shared_operations: ["GET reads"]
  - name: PlatformAdmin
    description: "Test-driving operator for the logical clock"
    identity: "opaque"
    exclusive_operations: ["set logical clock"]
    shared_operations: []
