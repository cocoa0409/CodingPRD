  # =======================================================================
  - rule_id: resource_temporal_overlap
    mechanism: |
      Two different resources are booked over time under DELIBERATELY OPPOSITE
      interval conventions:
        * TrackingStation occupancy uses a CLOSED interval
          [captured_at, captured_at + capture_lock_seconds + 60] with both ends
          inclusive, capacity exactly one, scoped per station;
        * Hauler pickup windows use a HALF-OPEN interval
          [pickup_window_start, pickup_window_end) with an aggregate capacity of
          Hauler.max_concurrent_pickups, so windows that merely touch are legal.
      Each instance probes its own convention at the shared instant, so an
      implementation that uses one convention everywhere fails one of the two.
    instances:

      - name: station_lock_is_a_closed_interval_of_capture_lock_plus_sixty_seconds
        grounds: "§1.4 validations[priority=90] ERR_STATION_OCCUPIED (closed interval, STATION_TURNAROUND_SECONDS 60); §1.1 TrackingStation.capture_lock_seconds, WasteEntry.capture_window_end; §1.6 ERR_STATION_OCCUPIED."
        distinguishing_aspect: "Resource: a single TrackingStation, capacity one, CLOSED interval measured in seconds. The upper endpoint is INCLUSIVE, so the rejection happens at exactly t + 90 s and the acceptance one second later; and the lock is scoped to the station, which the fixture proves by accepting a capture at the very same rejected instant on a DIFFERENT station of the same site."
        test_recipe:
          setup: |
            Site with two ACTIVE stations: PREP-1 with capture_lock_seconds 30 and LINE-1 with
            capture_lock_seconds 30. FT_PREP. One OPEN shift 2026-06-10 AM meals_served 1000. A
            first capture at PREP-1 at exactly 2026-06-10T10:00:00Z sets capture_window_end
            10:00:30 and, with the 60 s turnaround, occupies PREP-1 through 10:01:30 inclusive.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "LINE-1", station_kind: "HOT_LINE", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { other_station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 500, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { first_entry_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 300, loss_reason: "TRIM", captured_at: "2026-06-10T10:01:30Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { occupied_error: "$.data.error_id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${other_station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 300, loss_reason: "TRIM", captured_at: "2026-06-10T10:01:30Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { other_entry_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 300, loss_reason: "TRIM", captured_at: "2026-06-10T10:01:31Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { late_entry_id: "$.data.id" }
          assert:
            - "The setup capture returns capture_window_end == 2026-06-10T10:00:30Z (captured_at + capture_lock_seconds), which is NOT the end of the occupancy interval."
            - "The FIRST trigger call, at exactly 2026-06-10T10:01:30Z (captured_at + 30 + 60 seconds), returns 409 with error_id ERR_STATION_OCCUPIED — the closed upper endpoint rejects the boundary instant."
            - "The SECOND trigger call succeeds at the SAME instant 2026-06-10T10:01:30Z because it targets LINE-1: the lock is per station, not per site or per shift."
            - "The THIRD trigger call succeeds at 2026-06-10T10:01:31Z on PREP-1, one second past the closed interval."
            - "After all three calls, GET /shifts/${shift_id} returns shift_waste_grams == 1100 (500 + 300 + 300) and GET /waste-entries?station_id=${station_id} returns total_count == 2 — the rejected capture created nothing."
            - "Voiding the first entry would free the interval, because the occupancy set is restricted to entries with status IN {RECORDED, FLAGGED}; the rejected instant is only blocked while a live entry holds it."

      - name: hauler_window_capacity_is_half_open_so_touching_windows_are_allowed
        grounds: "§1.4 validations[priority=92] ERR_HAULER_WINDOW_CAPACITY (half-open interval, aggregate capacity); §1.1 Hauler.max_concurrent_pickups; §1.5 POST /diversion-consignments side effect reserving the window."
        distinguishing_aspect: "Resource: a Hauler shared across many consignments, HALF-OPEN interval, and the capacity is an AGGREGATE COUNT rather than an exclusive lock — the opposite convention from the station instance on both axes. The decisive pair is a one-minute overlap (rejected) versus an exact endpoint touch at 10:00:00 (accepted); a closed-interval implementation rejects the touching window and a strictly-inside implementation accepts the overlapping one."
        test_recipe:
          setup: |
            One site and one hauler with max_concurrent_pickups 1 and channels [COMPOST]. A first
            DRAFT consignment C1 reserves 2026-08-10T08:00:00Z .. 2026-08-10T10:00:00Z. It is left
            in DRAFT, which is one of the three window-holding logistics states.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Loop Compost", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500, max_concurrent_pickups: 1 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-08-10T08:00:00Z", pickup_window_end: "2026-08-10T10:00:00Z", container_tare_grams: 0 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { consignment_1: "$.data.id" }
          trigger:
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-08-10T09:59:00Z", pickup_window_end: "2026-08-10T11:00:00Z", container_tare_grams: 0 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { capacity_error: "$.data.error_id" }
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-08-10T10:00:00Z", pickup_window_end: "2026-08-10T11:00:00Z", container_tare_grams: 0 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { consignment_3: "$.data.id" }
          assert:
            - "The FIRST trigger call overlaps C1 by one minute ([09:59, 11:00) versus [08:00, 10:00)) and returns 409 with error_id ERR_HAULER_WINDOW_CAPACITY; GET /diversion-consignments?hauler_id=${hauler_id} returns total_count == 1 afterwards."
            - "The SECOND trigger call starts exactly at C1's pickup_window_end and SUCCEEDS with logistics_status DRAFT and settlement_status UNBILLED, because [10:00, 11:00) and [08:00, 10:00) do not intersect under half-open semantics."
            - "After both calls, GET /diversion-consignments?hauler_id=${hauler_id} returns total_count == 2 with C1 and the touching window both DRAFT."
            - "The capacity is aggregate, not per-site: raising the hauler to max_concurrent_pickups 2 would have admitted the rejected 09:59 window, and cancelling C1 (logistics_status CANCELLED leaves the counted set) would too."
            - "POST /diversion-consignments with pickup_window_start == pickup_window_end returns 400 ERR_INVALID_REQUEST from validations[priority=30], so a zero-length window can never be used to sidestep the capacity count."

  # =======================================================================
  - rule_id: compensating_invariant
    mechanism: |
      Two different conserved quantities are pushed out of balance and then
      restored by a compensating write, and in both cases the restored value must
      be BYTE-IDENTICAL to the original rather than merely close:
        * GRAMS — WasteEntry.weight_grams == routed_weight_grams +
          unrouted_weight_grams holds at all times, and deleting a
          ConsignmentLine must return the entry and the consignment to their
          pre-allocation numbers;
        * CENTS — Site.valued_waste_cost_cents is a full recompute over the
          {RECORDED, FLAGGED} set, so voiding a correcting entry (which restores
          its SUPERSEDED predecessor) must land back on the exact original total.
      §1.3 calculations.site_waste_aggregates and routed_weight_allocation both
      recompute from source rows precisely so that no incremental drift is
      possible; these instances are what detects a delta-based implementation.
    instances:

      - name: deleting_a_consignment_line_restores_the_gram_conservation_exactly
        grounds: "§1.3 calculations.routed_weight_allocation INVARIANT (weight_grams == routed_weight_grams + unrouted_weight_grams); §1.5 DELETE /consignment-lines/{id}; §1.1 DiversionConsignment.staged_weight_grams / line_count."
        distinguishing_aspect: "Conserved quantity: GRAMS across the WasteEntry / ConsignmentLine / DiversionConsignment triangle, undone by a DELETE. The partial allocation (400 of 1000 g) means the invariant is non-trivial in BOTH directions — 400 + 600 before the delete and 0 + 1000 after it — and three separate stored fields must move back together (entry routed/unrouted, consignment staged_weight_grams, consignment line_count)."
        test_recipe:
          setup: |
            Site, PREP station, FT_PREP, hauler with channels [COMPOST], OPEN shift 2026-06-10 AM
            meals_served 1000 and one 1000 g capture. A DRAFT COMPOST consignment receives a
            PARTIAL line of 400 g, leaving 600 g unrouted.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Loop Compost", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500, max_concurrent_pickups: 1 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_id: "$.data.id" }
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-06-11T08:00:00Z", pickup_window_end: "2026-06-11T10:00:00Z", container_tare_grams: 0 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { consignment_id: "$.data.id" }
            - call: "POST /consignment-lines"
              payload: { consignment_id: "${consignment_id}", waste_entry_id: "${entry_id}", allocated_weight_grams: 400 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { line_id: "$.data.id" }
            - call: "GET /waste-entries/${entry_id}"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          trigger:
            - call: "DELETE /consignment-lines/${line_id}"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          assert:
            - "Before the trigger, the setup GET /waste-entries/${entry_id} returns weight_grams == 1000, routed_weight_grams == 400 and unrouted_weight_grams == 600, so routed + unrouted == weight_grams."
            - "Before the trigger, GET /diversion-consignments/${consignment_id} returns line_count == 1 and staged_weight_grams == 400."
            - "After the trigger, GET /waste-entries/${entry_id} returns weight_grams == 1000, routed_weight_grams == 0 and unrouted_weight_grams == 1000 — the conservation identity holds again with no residue."
            - "After the trigger, GET /diversion-consignments/${consignment_id} returns line_count == 0 and staged_weight_grams == 0, and GET /consignment-lines?consignment_id=${consignment_id} returns total_count == 0."
            - "GET /sites/${site_id} returns total_captured_weight_grams == 1000 before and after the trigger, and diverted_weight_grams_settled == 0 both times (nothing was ever settled), so the delete did not leak into the site ledger."
            - "POST /consignment-lines with allocated_weight_grams 1000 immediately after the trigger SUCCEEDS, which proves the 400 g reservation was truly released rather than merely hidden; re-running it a second time returns 422 ERR_ALLOCATION_EXCEEDS_UNROUTED."
            - "POST /diversion-consignments/${consignment_id}/stage before the trigger would have frozen the lines, so the delete is only reachable while the consignment is DRAFT — after staging, DELETE /consignment-lines/{id} returns 409 ERR_INVALID_CONSIGNMENT_STATE."

      - name: voiding_a_correcting_entry_restores_the_site_cost_ledger_to_the_exact_cent
        grounds: "§1.3 calculations.site_waste_aggregates (full recompute from source rows); §1.2 state_machines.WasteEntry.RECORDED_to_SUPERSEDED and SUPERSEDED_to_RECORDED compensation; §1.4 validations[priority=70] ERR_SEGREGATION_OF_DUTIES."
        distinguishing_aspect: "Conserved quantity: CENTS on Site.valued_waste_cost_cents, undone by a VOID rather than a DELETE, and the compensation is INDIRECT — the void acts on the correcting row while the value is restored by resurrecting a third row (the SUPERSEDED predecessor). The excursion is asymmetric in cents (640 -> 960 -> 640) and in grams (1000 -> 1500 -> 1000) at once, so an implementation that adjusts totals by the voided row's own cost lands on 0 instead of 640."
        test_recipe:
          setup: |
            Site, PREP station, FT_PREP (640 c/kg), OPEN shift 2026-06-10 AM meals_served 1000
            (high enough that the 12.000 coaching threshold is never approached). KitchenStaff
            ks-1 captures 1000 g, worth 640 c. ShiftLead sl-1 then corrects the weight up to
            1500 g, worth 960 c, which supersedes the original.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { original_id: "$.data.id", original_v1: "$.data.version" }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /waste-entries/${original_id}/corrections"
              payload: { expected_entry_version: "${original_v1}", correction_note: "scale under-read by 500 g", weight_grams: 1500 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { corrector_id: "$.data.id" }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /waste-entries/${corrector_id}/void"
              payload: { void_reason: "correction belonged to the PM service" }
              as: ShiftLead
              as_user_id: "sl-2"
          assert:
            - "The first setup GET /sites/${site_id} returns valued_waste_cost_cents == 640 and total_captured_weight_grams == 1000."
            - "The correction response returns weight_grams 1500 with provisional_cost_cents == 960 and captured_by_user_id 'sl-1'; the second setup GET /sites/${site_id} returns valued_waste_cost_cents == 960 and total_captured_weight_grams == 1500 (the superseded 1000 g has left the set entirely — the two rows are never both counted, which would give 2500 g / 1600 c)."
            - "The trigger is issued as ShiftLead sl-2 because X-User-ID must differ from the correcting entry's captured_by_user_id; the same call as sl-1 returns 403 ERR_SEGREGATION_OF_DUTIES and would leave the ledger at 960."
            - "After the trigger, GET /sites/${site_id} returns valued_waste_cost_cents == 640 EXACTLY and total_captured_weight_grams == 1000 — byte-identical to the first setup read, not 0 and not 1600."
            - "After the trigger, GET /waste-entries/${original_id} returns status RECORDED with effective_cost_cents == 640, and GET /waste-entries/${corrector_id} returns status VOIDED with effective_cost_cents still 960 (the voided row keeps its own valuation for audit; it just stops being counted)."
            - "After the trigger, GET /shifts/${shift_id} returns shift_waste_grams == 1000 and waste_intensity_kg_per_1k_meals == 1.000, and GET /coaching-alerts?shift_id=${shift_id} returns total_count == 0 throughout, so no alert side effect masks the restoration."
            - "POST /waste-entries/${original_id}/corrections a second time (with the restored entry's current version) returns 409 ERR_ENTRY_ALREADY_CORRECTED, so the restored row cannot be used to double-count the excursion."
