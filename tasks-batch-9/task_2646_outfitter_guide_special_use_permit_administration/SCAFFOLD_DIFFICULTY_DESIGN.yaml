      - name: performance_band_before_penalty_pinned_order
        grounds:
          - calculations.performance_weighted_rating
          - entities.PerformanceEvaluation.fields.provisional_band
          - entities.PerformanceEvaluation.fields.penalty_points_applied
          - entities.PerformanceEvaluation.fields.weighted_score
          - entities.PerformanceEvaluation.fields.rating
          - entities.Permit.fields.open_noncompliance_points
          - entities.Permit.fields.latest_performance_rating
        distinguishing_aspect: |
          MODE (c) PINNED EVALUATION ORDER. band() is called twice on different arguments: step 2
          reads the RAW score to pick the penalty multiplier, step 6 reads the ADJUSTED score to
          publish the rating. The dependency looks circular, and resolving it the other way round —
          deriving the multiplier from the score after the penalty — is arithmetically consistent
          but yields a different published number. With component scores 96/92/86/86 and 8 open
          points the pinned order gives weighted_score 87.00, while the alternative order gives
          83.00; both land in SATISFACTORY, so only the numeric field distinguishes them.
        test_recipe:
