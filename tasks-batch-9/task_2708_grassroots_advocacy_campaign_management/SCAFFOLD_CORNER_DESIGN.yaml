              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { rev_seq: $.data.sequence_no }
          trigger:
            - call: "POST /advocacy/consent-events"
              payload: { supporter_id: "${sup1_id}", channel: "EMAIL", action: "GRANT", lawful_basis: "OPT_IN_FORM", source_reference: "resubscribe-form-2" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { grant_seq: $.data.sequence_no }
          assert:
            - "${events_after_create} == 3"
            - "${rev_seq} == 4"
            - "${grant_seq} == 5"
