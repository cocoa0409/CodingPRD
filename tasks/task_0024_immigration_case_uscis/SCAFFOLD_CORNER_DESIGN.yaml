scaffold_corner_design:

  # =========================================================================
  # Entities — basic CRUD claims
  # =========================================================================
  - section: entities
    instances:
      - name: create_applicant_minimal_required_fields_returns_201_with_system_fields
        claim_type: creation
        grounds:
          - entities.Applicant
          - endpoints."POST /uscis/applicants/register"
        distinguishing_aspect: |
          Posting all required fields creates an Applicant; response includes server-minted id,
          created_at, updated_at, version=1, plus the input fields and is_under_14 (computed=null until file_date).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100100", full_name: "Alice A", date_of_birth: "1990-04-15", country_of_chargeability: "WORLDWIDE", email: "alice@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "response.data.alien_number == 'A100100100'"
            - "response.data.full_name == 'Alice A'"
            - "response.data.version == 1"

      - name: get_applicant_by_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /uscis/applicants/{id}"
          - errors[id=ERR_NOT_FOUND]
        distinguishing_aspect: "GET on unknown applicant id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No applicants of id 00000000-...-000999 exist."
          setup_api_calls:
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100101", full_name: "Stub S", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "stub@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "GET /uscis/applicants/00000000-0000-0000-0000-000000000999"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_NOT_FOUND'"
            - "response.http_status == 404"

      - name: create_applicant_missing_alien_number_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints."POST /uscis/applicants/register"
          - validations[priority=17]
          - errors[id=ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field alien_number yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /uscis/applicants/register"
              payload: { full_name: "NoNum N", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "n@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_INVALID_REQUEST'"
            - "response.http_status == 400"

      - name: receipt_number_system_minted_matches_pattern
        claim_type: system_fields
        grounds:
          - entities.Case.fields.receipt_number
          - state_machines.Case.DRAFT_to_FILED
        distinguishing_aspect: "Filing a case stamps receipt_number with server-minted 13-char code per regex; client input is ignored."
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z; applicant exists; case is DRAFT."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100102", full_name: "Rcpt R", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "rcpt@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { receipt: $.data.receipt_number, file_date: $.data.file_date, priority_date: $.data.priority_date }
          assert:
            - "Case.${case_id}.receipt_number matches ^(NBC|MSC|SRC|EAC|WAC|LIN|YSC|NSC|VSC|TSC)\\d{10}$"
            - "Case.${case_id}.file_date == '2026-06-15'"
            - "Case.${case_id}.priority_date == '2026-06-15'"

      - name: invalid_case_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Case.fields.case_type
          - validations[priority=17]
          - errors[id=ERR_INVALID_REQUEST]
        distinguishing_aspect: "Case POST with case_type='I-999' fails enum constraint, returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Applicant exists."
          setup_api_calls:
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100103", full_name: "Enum E", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "enum@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-999" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_INVALID_REQUEST'"
            - "response.http_status == 400"

      - name: list_visa_bulletin_supports_pagination
        claim_type: listing
        grounds:
          - endpoints."GET /uscis/visa-bulletin"
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /uscis/visa-bulletin returns paginated list including total_count and has_more."
        test_recipe:
          setup:
            - "Two VisaBulletinEntry rows exist."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/visa-bulletin"
              payload: { bulletin_month: "2026-06", preference_category: "F1", country: "WORLDWIDE", chart_type: "FINAL_ACTION", cutoff_date: "2024-01-01" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/visa-bulletin"
              payload: { bulletin_month: "2026-06", preference_category: "F2A", country: "WORLDWIDE", chart_type: "FINAL_ACTION", cutoff_date: "2024-02-01" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /uscis/visa-bulletin"
              payload: { bulletin_month: "2026-06", limit: 1, offset: 0 }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          assert:
            - "response.data.total_count == 2"
            - "response.data.has_more == true"

  # =========================================================================
  # State Machines — invalid transitions and terminal lockdown
  # =========================================================================
  - section: state_machines
    instances:
      - name: file_a_draft_then_re_file_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Case.DRAFT_to_FILED
          - errors[id=ERR_INVALID_STATE]
        distinguishing_aspect: "Filing a case twice fails the second time with ERR_INVALID_STATE since Case.status is no longer DRAFT."
        test_recipe:
          setup:
            - "I-130 case has been filed once already."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100104", full_name: "Refile R", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "refile@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_INVALID_STATE'"

      - name: approved_case_decide_again_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Case.UNDER_REVIEW_to_APPROVED
          - errors[id=ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Once Case is APPROVED, calling /decide again returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "I-130 case has been approved."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100105", full_name: "Approve A", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "approve@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v: $.data.version }
            - call: "POST /uscis/cases/${case_id}/decide"
              payload: { decision: "APPROVE", expected_case_version: "${case_v}" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v_post: $.data.version }
          trigger:
            - call: "POST /uscis/cases/${case_id}/decide"
              payload: { decision: "APPROVE", expected_case_version: "${case_v_post}" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_ALREADY_TERMINAL'"
            - "Case.${case_id}.status == 'APPROVED'"

      - name: initial_case_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.Case
          - entities.Case.fields.status
        distinguishing_aspect: "POST /uscis/cases creates a Case with status='DRAFT'."
        test_recipe:
          setup:
            - "Applicant exists."
          setup_api_calls:
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100106", full_name: "Init I", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "init@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.status == 'DRAFT'"
            - "Case.${case_id}.rfe_round_count == 0"
            - "Case.${case_id}.version == 1"

      - name: biometrics_noshow_cascades_case_to_abandoned
        claim_type: side_effect_execution
        grounds:
          - state_machines.BiometricsAppointment.SCHEDULED_to_NO_SHOW
          - state_machines.Case
        distinguishing_aspect: "POST /uscis/biometrics/{id}/mark-no-show cascades parent Case to ABANDONED."
        test_recipe:
          setup:
            - "I-485 case in BIOMETRICS_SCHEDULED with appointment whose scheduled_at + 24h passed."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100107", full_name: "NoShow N", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "noshow@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-06-25T15:00:00Z", asc_location_code: "ASC-SF-20" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { biom_id: $.data.id }
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-27T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /uscis/biometrics/${biom_id}/mark-no-show"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
          assert:
            - "BiometricsAppointment.${biom_id}.status == 'NO_SHOW'"
            - "Case.${case_id}.status == 'ABANDONED'"

      - name: rfe_cap_exceeded_third_rfe_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Case.UNDER_REVIEW_to_RFE_PENDING
          - validations[priority=10]
          - errors[id=ERR_RFE_CAP_EXCEEDED]
        distinguishing_aspect: "After two RFE rounds, a third issuance fails ERR_RFE_CAP_EXCEEDED (rfe_round_count >= MAX_RFE_ROUNDS=2)."
        test_recipe:
          setup:
            - "I-130 case has issued 2 RFEs, both responded; rfe_round_count==2; case back in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100108", full_name: "Cap C", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "cap@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["doc_1"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { rfe_1_id: $.data.id }
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v_1: $.data.version }
            - call: "POST /uscis/rfes/${rfe_1_id}/respond"
              payload: { expected_case_version: "${case_v_1}", response_summary: "doc_1 sent" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["doc_2"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { rfe_2_id: $.data.id }
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v_2: $.data.version }
            - call: "POST /uscis/rfes/${rfe_2_id}/respond"
              payload: { expected_case_version: "${case_v_2}", response_summary: "doc_2 sent" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["doc_3"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_RFE_CAP_EXCEEDED'"
            - "Case.${case_id}.rfe_round_count == 2"
            - "Case.${case_id}.status == 'UNDER_REVIEW'"

      - name: error_visa_retrogressed_already_covered_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[id=ERR_VISA_RETROGRESSED]
        excluded_because:
          difficulty_instance: case_interview_requires_visabulletin_current_pair_case_visabulletin
          rationale: "ERR_VISA_RETROGRESSED is asserted as the failure path of the named §1.8 cross-entity instance."

      - name: error_appt_overlap_same_case_already_covered_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[id=ERR_APPT_OVERLAP_SAME_CASE]
        excluded_because:
          difficulty_instance: same_case_two_biometrics_window_overlap_halfopen_interval
          rationale: "ERR_APPT_OVERLAP_SAME_CASE is asserted as the failure path of the named §1.8 resource_temporal_overlap instance."

      - name: error_asc_slot_taken_already_covered_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[id=ERR_ASC_SLOT_TAKEN]
        excluded_because:
          difficulty_instance: asc_location_point_instant_collision_capacity_one_resource_asc
          rationale: "ERR_ASC_SLOT_TAKEN is asserted as the failure path of the named §1.8 resource_temporal_overlap instance."

      - name: error_invalid_state_already_covered_by_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors[id=ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: case_advance_review_requires_biometrics_completed_pair_case_biometricsappointment
          rationale: "ERR_INVALID_STATE is exercised by the named §1.8 cross_entity_state_dependency instance; this §1.9 row would duplicate."

  # =========================================================================
  # Calculations — boundaries beyond §1.8
  # =========================================================================
  - section: calculations
    instances:
      - name: filing_fee_i130_no_biometrics_surcharge
        claim_type: correct_result
        grounds:
          - calculations.filing_fee
          - calculations.filing_fee.constants.BASE_FEE_CENTS
        distinguishing_aspect: "I-130 base fee=56000 cents; biometrics surcharge omitted (case_type NOT in {I-485, I-765, I-131}); under-14 discount only applies to I-485, so I-130 adult = 56000 cents exactly."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; adult applicant registered."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100109", full_name: "Fee F", date_of_birth: "1985-01-01", country_of_chargeability: "WORLDWIDE", email: "fee@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "Case.${case_id}.filing_fee_cents == 56000"

      - name: filing_fee_i485_adult_with_surcharge_no_discount
        claim_type: correct_result
        grounds:
          - calculations.filing_fee
          - calculations.filing_fee.constants.BIOMETRICS_SURCHARGE_CENTS
        distinguishing_aspect: "I-485 adult: base 142000 + surcharge 8500 = 150500 cents; under-14 discount NOT applied since applicant is adult."
        test_recipe:
          setup:
            - "Clock at 2026-06-15; adult applicant (born 1990) registered."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100110", full_name: "Adult A", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "adult@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "Case.${case_id}.filing_fee_cents == 150500"

      - name: rfe_deadline_calendar_day_arithmetic_one_day_before_expiry_passes
        claim_type: boundary
        grounds:
          - calculations.rfe_deadline
          - validations[priority=15]
          - errors[id=ERR_RFE_DEADLINE_PASSED]
        distinguishing_aspect: "Submitting RFE response at exactly response_deadline - 1 day succeeds; submitting at exactly response_deadline fails (strict less-than)."
        test_recipe:
          setup:
            - "I-130 case post-RFE issuance with issued_at=2026-06-15 -> response_deadline=2026-09-10."
            - "Clock advanced to 2026-09-09 (one day before deadline)."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A100100111", full_name: "Deadline D", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "deadline@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
