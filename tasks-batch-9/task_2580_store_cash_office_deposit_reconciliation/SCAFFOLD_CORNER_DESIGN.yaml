        difficulty_instance: reconcile_cascade_session_to_cashier_to_case_to_journal
        rationale: >
          A separate corner instance would only re-assert the same chain with smaller numbers; the
          difficulty instance is strictly stronger because it also pins the order in which the
          derived counters settle.

