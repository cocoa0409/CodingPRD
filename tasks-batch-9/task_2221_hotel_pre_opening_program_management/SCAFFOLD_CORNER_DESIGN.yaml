              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_cc: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
            - call: "POST /pre-opening/milestones/${ms_cc}/start"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/milestones/${ms_cc}/complete"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /pre-opening/programs/${prog_id}/open-booking"
              payload: {}
              as: CommercialDirector
              as_user_id: "cd-1"
              captures: { prog_v3: "$.data.version" }
            - call: "POST /pre-opening/reservation-blocks"
              payload: { program_id: "${prog_id}", account_name: "Harbour Regatta", arrival_date: "2026-10-05", night_count: 2, room_count: 5, rate_cents: 20000, expected_program_version: "${prog_v3}" }
              as: CommercialDirector
              as_user_id: "cd-1"
              captures: { block_1: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/reservation-blocks/${block_1}/resolve-contingency"
