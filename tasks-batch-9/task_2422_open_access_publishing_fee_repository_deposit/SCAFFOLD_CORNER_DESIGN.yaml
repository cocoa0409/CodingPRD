      - name: corner_unauthorized_role_outranks_existence_which_outranks_shape
        claim_type: priority_ordering
        grounds:
          - validations[priority 2]
          - validations[priority 3]
          - validations[priority 5]
        distinguishing_aspect: |
          The same freeze endpoint is hit three ways. A CorrespondingAuthor sending an unknown
          fund id and an empty body gets ERR_UNAUTHORIZED 403 (priority 2 beats 3 and 5); a
          FundManager sending that unknown id with the required `reason` missing gets
          ERR_FUND_NOT_FOUND 404 (priority 3 beats 5); only once the id resolves does the missing
          field surface as ERR_INVALID_REQUEST 400.
        test_recipe:
          setup:
            - "one OPEN fund"
          setup_api_calls:
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-CENTRAL-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 500000, priority_rank: 1, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY"], per_article_cap_cents: 500000 }
              as: FundManager
              captures: { v2_fd_id: $.data.id, v2_status_before: $.data.status }
          trigger:
            - call: "POST /apc-funds/00000000-0000-4000-8000-0000000000f1/freeze"
              payload: {}
              as: CorrespondingAuthor
              as_user_id: "author-unrelated-01"
              captures: { v2_err_role: $.data.error_id }
            - call: "POST /apc-funds/00000000-0000-4000-8000-0000000000f1/freeze"
              payload: {}
              as: FundManager
              as_user_id: "fm-approver-01"
              captures: { v2_err_missing: $.data.error_id }
            - call: "POST /apc-funds/${v2_fd_id}/freeze"
              payload: {}
              as: FundManager
              as_user_id: "fm-approver-01"
              captures: { v2_err_shape: $.data.error_id }
          assert:
            - "${v2_status_before} == OPEN"
            - "${v2_err_role} == ERR_UNAUTHORIZED"
            - "the first response returned HTTP 403"
            - "${v2_err_missing} == ERR_FUND_NOT_FOUND"
            - "the second response returned HTTP 404"
            - "${v2_err_shape} == ERR_INVALID_REQUEST"
            - "the third response returned HTTP 400"
            - "APCFund.${v2_fd_id}.status == OPEN"
            - "APCFund.${v2_fd_id}.freeze_reason == null"
            - "APCFund.${v2_fd_id}.version == 1"

      - name: corner_unknown_article_id_returns_not_found_before_the_owner_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 3]
          - validations[priority 4]
        distinguishing_aspect: |
          A CorrespondingAuthor posts a fund request for an article id that does not exist. The
          ownership rule at priority 4 cannot be evaluated without the row, so the response is
          ERR_ARTICLE_NOT_FOUND 404, not ERR_NOT_RESOURCE_OWNER 403. The companion call shows
          that once the id resolves but belongs to a different author, the ownership rule does
          fire.
        test_recipe:
          setup:
            - "author A owns one article; author B is unrelated"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { v3_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${v3_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { v3_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { v3_au_a: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Nadia Roux", email: "nadia.roux@uni.example", orcid: "0000-0003-4444-5555", department_code: "CEL", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { v3_au_b: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${v3_j_id}", corresponding_author_id: "${v3_au_a}", manuscript_title: "Owned by author A", accepted_on: "2026-07-20" }
              as: ScholCommLibrarian
              captures: { v3_a_id: $.data.id }
            - call: "POST /articles/${v3_a_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
          trigger:
            - call: "POST /fund-requests"
              payload: { article_id: "00000000-0000-4000-8000-0000000000a9", requested_cents: 100000, justification: "Article id does not exist." }
              as: CorrespondingAuthor
              as_user_id: "${v3_au_b}"
              captures: { v3_err_missing: $.data.error_id }
            - call: "POST /fund-requests"
              payload: { article_id: "${v3_a_id}", requested_cents: 100000, justification: "Article belongs to another author." }
