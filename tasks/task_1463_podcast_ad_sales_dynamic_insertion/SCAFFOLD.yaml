# =============================================================================
# Task 1463 — Podcast Ad Sales & Dynamic Insertion
# PRD Benchmark scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  Podcast Ad Sales & Dynamic Insertion (podcast ad network): inventory
  forecasting by show/episode & download projection, host-read vs produced-spot
  scheduling, campaign flight setup & dynamic insertion rules, download
  measurement standard & make-good on shortfall, category exclusivity & brand
  safety by show, ad copy approval & host script, attribution (promo
  code/pixel) reporting, billing & agency commission

domain_name: podcast-ad-sales-dynamic-insertion
api_prefix: /adnet

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite show/episode ad inventory reserved, committed, released
  secondary_archetype: pricing_engine        # CPM billing with position multipliers, commission, credits
  complexity_layers:
    - optimistic_concurrency                 # OCC on Show/Campaign version for PATCH writes
    - cascading_side_effects                 # advertiser suspend -> campaign -> line item -> show pool
    - dual_variant_calculation               # provisional vs final measurement; ACTUAL vs BOOKED billing
    - scheduled_actions                      # logical clock gates publish, measurement close, attribution window
  entity_topology: flat                      # peer entities, FK references in bodies, flat URL space
  state_machine_shape: cyclic                # AdCopy revision loop; Campaign pause/resume + make-good reopen
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # LineItem references Campaign + Show/Episode + AdCopy
  role_model: peer_roles                     # AdOps / Advertiser / Agency / ShowProducer / Finance / Ingestion
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Show title" }
      - { name: content_category, type: enum, source: input, description: "Editorial category: TECHNOLOGY | BUSINESS | COMEDY | NEWS | HEALTH | SPORTS" }
      - { name: avg_downloads_30d, type: integer, source: input, description: "Trailing 30-day average qualified downloads per episode; forecast baseline", constraints: ">= 0" }
      - { name: blocked_advertiser_categories, type: array, source: input, default: [], description: "Advertiser categories the producer bans from this show (brand safety)" }
      - { name: brand_safety_tier, type: enum, source: system, description: "CLEAR | FLAGGED | SUSPENDED; drives forecast sell-through cap and line-item gating" }
      - { name: forecast_impressions, type: integer, source: computed, description: "Projected sellable impressions for the next 30 days (inventory_forecast)" }
      - { name: reserved_impressions, type: integer, source: computed, description: "Sum of reserved_impressions over ACTIVE run-of-show LineItems (show_id set) targeting this show" }
      - { name: available_impressions, type: integer, source: computed, description: "forecast_impressions - reserved_impressions; may dip negative when the rolling horizon drops episodes that still hold ACTIVE reservations (the activation gate simply fails then)" }

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; owning show" }
      - { name: title, type: string, source: input, description: "Episode title" }
      - { name: publish_at, type: datetime, source: input, description: "Scheduled publish instant (UTC); PUBLISH allowed once logical clock >= publish_at" }
      - { name: measurement_window_days, type: integer, source: input, default: 30, description: "Days after publish_at during which downloads count toward final measurement", constraints: "1..90" }
      - { name: slot_capacity, type: integer, source: input, default: 2, description: "Maximum number of distinct ACTIVE line items that may serve into one download of this episode", constraints: "1..5" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PUBLISHED | MEASURED" }
      - { name: provisional_download_count, type: integer, source: computed, description: "Count of downloads with qualified_provisional == true" }
      - { name: measured_download_count, type: integer, source: computed, description: "Count of downloads with qualified_final == true; set at FINALIZE_MEASUREMENT, 0 before" }
      - { name: slots_in_use, type: integer, source: computed, description: "Count of ACTIVE episode-targeted LineItems whose campaign flight contains the current logical clock time" }

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency name" }
      - { name: commission_bps, type: integer, source: input, description: "Agency commission in basis points of post-credit gross (e.g. 1500 = 15%)", constraints: "0..5000" }

  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand / advertiser name" }
      - { name: category, type: enum, source: input, description: "AUTOMOTIVE | CPG_FOOD | FINTECH | GAMBLING | ALCOHOL | HEALTH_PHARMA | TECHNOLOGY; drives exclusivity and brand safety" }
      - { name: agency_id, type: string, source: input, default: null, description: "FK -> Agency.id; representing agency, null for direct advertisers" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; buying advertiser" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: flight_start, type: datetime, source: input, description: "Flight start (inclusive); half-open interval [flight_start, flight_end)" }
      - { name: flight_end, type: datetime, source: input, description: "Flight end (exclusive); extended by make-good acceptance" }
      - { name: booked_impressions, type: integer, source: input, description: "Contracted (guaranteed) qualified impressions", constraints: "> 0" }
      - { name: cpm_cents, type: integer, source: input, description: "Rate: cents per 1000 qualified impressions", constraints: "> 0" }
      - { name: billing_model, type: enum, source: input, description: "ACTUAL_DELIVERY | BOOKED_GROSS; selects invoice_billing variant; immutable after creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | ENDED | RECONCILED | CANCELLED" }
      - { name: delivered_impressions, type: integer, source: computed, description: "Count of this campaign's Impressions with billable_final == true (delivery_aggregation)" }

  - name: LineItem
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: show_id, type: string, source: input, default: null, description: "FK -> Show.id; run-of-show target. Exactly one of show_id / episode_id must be set" }
      - { name: episode_id, type: string, source: input, default: null, description: "FK -> Episode.id; episode-specific target. Exactly one of show_id / episode_id must be set" }
      - { name: ad_format, type: enum, source: input, description: "HOST_READ | PRODUCED_SPOT; must match the referenced AdCopy kind (HOST_READ <-> HOST_READ_SCRIPT, PRODUCED_SPOT <-> PRODUCED_AUDIO)" }
      - { name: position, type: enum, source: input, description: "PRE_ROLL | MID_ROLL | POST_ROLL; feeds the billing position multiplier" }
      - { name: reserved_impressions, type: integer, source: input, description: "Impressions reserved against the show forecast pool; only debited while ACTIVE and only for run-of-show targets", constraints: "> 0" }
      - { name: priority, type: integer, source: input, description: "Serve-time ranking key; higher priority wins slot contention" }
      - { name: ad_copy_id, type: string, source: input, description: "FK -> AdCopy.id; creative to serve; must belong to the same campaign and be APPROVED at activation" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | ENDED" }

  - name: AdCopy
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: kind, type: enum, source: input, description: "HOST_READ_SCRIPT | PRODUCED_AUDIO" }
      - { name: show_id, type: string, source: input, default: null, description: "FK -> Show.id; required iff kind == HOST_READ_SCRIPT (the show whose host reads the script)" }
      - { name: script_text, type: string, source: input, description: "Script body or produced-spot copy brief; editable in DRAFT and CHANGES_REQUESTED" }
      - { name: revision, type: integer, source: system, description: "Starts at 1; increments by 1 on every SUBMIT from CHANGES_REQUESTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | WITHDRAWN" }

  - name: Download
    parent: null
    common_fields: false
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; downloaded episode" }
      - { name: listener_key, type: string, source: system, description: "Listener identity key, minted as `${listener_key_prefix}-${i}` for i in 0..count-1 at ingest" }
      - { name: occurred_at, type: datetime, source: input, description: "Client-reported download instant (UTC); late arrival permitted" }
      - { name: user_agent_class, type: enum, source: input, description: "HUMAN | BOT | UNKNOWN" }
      - { name: qualified_provisional, type: boolean, source: computed, description: "Provisional qualification: user_agent_class != BOT (download_qualification, provisional variant)" }
      - { name: qualified_final, type: boolean, source: computed, description: "Final per-standard qualification; null until the episode is MEASURED (download_qualification, final variant)" }

  - name: Impression
    parent: null
    common_fields: false
    fields:
      - { name: download_id, type: string, source: system, description: "FK -> Download.id; download that carried this impression" }
      - { name: line_item_id, type: string, source: system, description: "FK -> LineItem.id; line item selected by dynamic insertion" }
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; denormalized from the line item at serve time" }
      - { name: position, type: enum, source: system, description: "PRE_ROLL | MID_ROLL | POST_ROLL; copied from the line item at serve time" }
      - { name: served_at, type: datetime, source: system, description: "Set to the parent download's occurred_at" }
      - { name: billable_provisional, type: boolean, source: computed, description: "Mirrors download.qualified_provisional at serve time" }
      - { name: billable_final, type: boolean, source: computed, description: "Mirrors download.qualified_final; null until the episode is MEASURED" }

  - name: AttributionEvent
    parent: null
    common_fields: false
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; attributed campaign" }
      - { name: kind, type: enum, source: input, description: "PROMO_CODE | PIXEL" }
      - { name: promo_code, type: string, source: input, default: null, description: "Redeemed code; required iff kind == PROMO_CODE" }
      - { name: occurred_at, type: datetime, source: input, description: "Client-reported conversion instant (UTC)" }
      - { name: attributed, type: boolean, source: computed, description: "True iff occurred_at falls inside [flight_start, flight_end + 30 days] inclusive (attribution_window)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; exactly one invoice per campaign" }
      - { name: billing_model, type: enum, source: system, description: "ACTUAL_DELIVERY | BOOKED_GROSS; snapshot from the campaign at creation" }
      - { name: delivered_impressions_billed, type: integer, source: computed, description: "Qualified delivered impressions in the flight window used for billing" }
      - { name: lines, type: array, source: computed, description: "Per-line-item breakdown: { line_item_id, position, billable_impressions, line_cents } frozen at creation" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of per-line line_cents (ACTUAL_DELIVERY) or booked-impressions charge (BOOKED_GROSS)" }
      - { name: shortfall_impressions, type: integer, source: computed, description: "max(0, booked_impressions - delivered_impressions_billed)" }
      - { name: make_good_credit_cents, type: integer, source: computed, description: "Cash credit granted when the make-good is DECLINED; 0 otherwise" }
      - { name: agency_commission_cents, type: integer, source: computed, description: "Commission on (gross_cents - make_good_credit_cents) when the advertiser has an agency; 0 for direct advertisers" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - agency_commission_cents - make_good_credit_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | PAID" }

  - name: MakeGood
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; shortfall campaign; at most one MakeGood per campaign" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; invoice that documented the shortfall" }
      - { name: granted_impressions, type: integer, source: system, description: "Bonus impressions offered; equals the invoice's shortfall_impressions at creation" }
      - { name: baseline_delivered_impressions, type: integer, source: system, description: "campaign.delivered_impressions snapshot taken at ACCEPT; fulfillment is measured against it" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | FULFILLED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Show
    field: brand_safety_tier
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: FLAGGED
        trigger: "POST /adnet/shows/{id}/transition (to_tier=FLAGGED)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Recompute forecast_impressions with the FLAGGED sell-through cap (inventory_forecast)"
      - from: CLEAR
        to: SUSPENDED
        trigger: "POST /adnet/shows/{id}/transition (to_tier=SUSPENDED)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Recompute forecast_impressions with the SUSPENDED cap of 0 (inventory_forecast)"
          - "Every ACTIVE LineItem targeting this show (show_id) or one of its episodes (episode_id) -> PAUSED; each pause releases its reservation and recomputes reserved_impressions / available_impressions"
          - "Each Campaign whose LineItems were paused by this cascade and which has no remaining ACTIVE LineItem -> PAUSED (bubble-up)"
      - from: FLAGGED
        to: CLEAR
        trigger: "POST /adnet/shows/{id}/transition (to_tier=CLEAR)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Recompute forecast_impressions with the CLEAR cap (inventory_forecast)"
        note: "Reinstatement does NOT resume paused line items or campaigns."
      - from: FLAGGED
        to: SUSPENDED
        trigger: "POST /adnet/shows/{id}/transition (to_tier=SUSPENDED)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Same cascades as CLEAR -> SUSPENDED"
      - from: SUSPENDED
        to: FLAGGED
        trigger: "POST /adnet/shows/{id}/transition (to_tier=FLAGGED)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Recompute forecast_impressions with the FLAGGED cap (inventory_forecast)"
        note: "SUSPENDED reinstates only to FLAGGED, never directly to CLEAR; paused children stay paused."

  - entity: Episode
    field: status
    initial_state: SCHEDULED
    terminal_states: [MEASURED]
    transitions:
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /adnet/episodes/{id}/transition (action=PUBLISH)"
        actor: AdOps
        preconditions:
          - "Current logical clock time >= publish_at (ERR_EPISODE_NOT_DUE)"
        side_effects:
          - "Recompute owning show's forecast_impressions (inventory_forecast)"
      - from: PUBLISHED
        to: MEASURED
        trigger: "POST /adnet/episodes/{id}/transition (action=FINALIZE_MEASUREMENT)"
        actor: AdOps
        preconditions:
          - "Current logical clock time > publish_at + measurement_window_days (ERR_MEASUREMENT_WINDOW_OPEN)"
        side_effects:
          - "Set qualified_final on every Download of this episode (download_qualification, final variant)"
          - "Set measured_download_count to the count of qualified_final == true downloads"
          - "Cascade: set billable_final on every Impression of those downloads"
          - "Cascade: recompute delivered_impressions of every Campaign with Impressions on this episode (delivery_aggregation)"
          - "Recompute owning show's forecast_impressions (MEASURED episodes leave the eligible set)"

  - entity: Advertiser
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /adnet/advertisers/{id}/transition (action=SUSPEND)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Every Campaign of this advertiser in ACTIVE -> PAUSED"
          - "Cascade: every ACTIVE LineItem of each such Campaign -> PAUSED, releasing its show-pool reservation"
          - "Cascade: each affected Show's reserved_impressions / available_impressions recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /adnet/advertisers/{id}/transition (action=REINSTATE)"
        actor: AdOps
        preconditions: []
        side_effects: []
        note: "Reinstatement does NOT resume campaigns or line items."

  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, RECONCILED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /adnet/campaigns/{id}/transition (action=ACTIVATE)"
        actor: AdOps
        preconditions:
          - "Advertiser.status == ACTIVE (ERR_ADVERTISER_SUSPENDED)"
          - "At least one AdCopy of this campaign has status == APPROVED (ERR_NO_APPROVED_COPY)"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /adnet/campaigns/{id}/transition (action=ACTIVATE)"
        actor: AdOps
        preconditions:
          - "Advertiser.status == ACTIVE (ERR_ADVERTISER_SUSPENDED)"
          - "At least one AdCopy of this campaign has status == APPROVED (ERR_NO_APPROVED_COPY)"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /adnet/campaigns/{id}/transition (action=PAUSE), or system (advertiser suspended; show suspended; last ACTIVE line item lost)"
        actor: "AdOps or system"
        preconditions: []
        side_effects: []
        note: "Pausing a campaign does NOT pause its ACTIVE line items when triggered manually; line items stop serving because the campaign gate in the insertion selector requires campaign.status == ACTIVE."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /adnet/campaigns/{id}/transition (action=END)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Every LineItem of this campaign in ACTIVE or PAUSED -> ENDED; reservations and episode slots released"
          - "Recompute delivered_impressions (delivery_aggregation)"
          - "If a MakeGood of this campaign is ACCEPTED: evaluate make_good_fulfillment -> FULFILLED or EXPIRED"
          - "If the campaign's Invoice is PAID and no MakeGood is in {OFFERED, ACCEPTED}: -> RECONCILED instead of resting in ENDED"
      - from: PAUSED
        to: ENDED
        trigger: "POST /adnet/campaigns/{id}/transition (action=END)"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Same side effects as ACTIVE -> ENDED"
      - from: ENDED
        to: ACTIVE
        trigger: "system (MakeGood ACCEPTED via POST /adnet/make-goods/{id}/transition)"
        actor: system
        preconditions: []
        side_effects:
          - "flight_end extended by the acceptance's extension_days"
          - "MakeGood.baseline_delivered_impressions := delivered_impressions at acceptance"
      - from: ENDED
        to: RECONCILED
        trigger: "system (invoice MARK_PAID while campaign ENDED and no MakeGood in {OFFERED, ACCEPTED}; or END with those conditions already met)"
        actor: system
        preconditions:
          - "Invoice for this campaign has status == PAID"
          - "No MakeGood of this campaign is in {OFFERED, ACCEPTED}"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /adnet/campaigns/{id}/transition (action=CANCEL)"
        actor: AdOps
        preconditions: []
        side_effects: []

  - entity: LineItem
    field: status
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /adnet/line-items/{id}/transition (action=ACTIVATE)"
        actor: AdOps
        preconditions:
          - "Campaign.status == ACTIVE (ERR_CAMPAIGN_NOT_ACTIVE)"
          - "Target show brand_safety_tier != SUSPENDED (ERR_SHOW_SUSPENDED)"
          - "Campaign advertiser category NOT IN target show's blocked_advertiser_categories (ERR_BRAND_SAFETY_CONFLICT)"
          - "Referenced AdCopy status == APPROVED (ERR_COPY_NOT_APPROVED)"
          - "Category exclusivity: no other ACTIVE LineItem of a different advertiser with the same category targets the same show with an overlapping half-open flight (ERR_CATEGORY_EXCLUSIVE_CONFLICT)"
          - "Episode-targeted: count of other ACTIVE episode-targeted LineItems with overlapping flight < episode.slot_capacity (ERR_SLOT_CAPACITY_EXCEEDED)"
          - "Run-of-show: reserved_impressions <= show.available_impressions (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "Run-of-show: show.reserved_impressions += reserved_impressions; available_impressions recomputed"
          - "Episode-targeted: episode.slots_in_use recomputed (episode_slot_occupancy)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /adnet/line-items/{id}/transition (action=ACTIVATE)"
        actor: AdOps
        preconditions:
          - "Same preconditions as DRAFT -> ACTIVE"
        side_effects:
          - "Same side effects as DRAFT -> ACTIVE"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /adnet/line-items/{id}/transition (action=PAUSE), or system (show suspended; advertiser suspended cascade; ad copy revoked)"
        actor: "AdOps or system"
        preconditions: []
        side_effects:
          - "Run-of-show: show.reserved_impressions -= reserved_impressions; available_impressions recomputed"
          - "Episode-targeted: episode.slots_in_use recomputed"
          - "If the owning campaign has no remaining ACTIVE LineItem and the cascade did not already pause it, the campaign is NOT auto-paused on manual pause; auto-pause only fires on system cascades (show/advertiser suspension)"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /adnet/line-items/{id}/transition (action=END), or system (campaign ENDED)"
        actor: "AdOps or system"
        preconditions: []
        side_effects:
          - "Reservation / slot release, same as PAUSE"
      - from: PAUSED
        to: ENDED
        trigger: "POST /adnet/line-items/{id}/transition (action=END), or system (campaign ENDED)"
        actor: "AdOps or system"
        preconditions: []
        side_effects: []

  - entity: AdCopy
    field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /adnet/ad-copies/{id}/submit"
        actor: "Advertiser or Agency (owner scope)"
        preconditions: []
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /adnet/ad-copies/{id}/submit"
        actor: "Advertiser or Agency (owner scope)"
        preconditions: []
        side_effects:
          - "revision += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /adnet/ad-copies/{id}/review (action=APPROVE)"
        actor: "ShowProducer of show_id when kind == HOST_READ_SCRIPT; AdOps when kind == PRODUCED_AUDIO"
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /adnet/ad-copies/{id}/review (action=REQUEST_CHANGES)"
        actor: "ShowProducer of show_id when kind == HOST_READ_SCRIPT; AdOps when kind == PRODUCED_AUDIO"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CHANGES_REQUESTED
        trigger: "POST /adnet/ad-copies/{id}/review (action=REQUEST_CHANGES)"
        actor: "ShowProducer of show_id when kind == HOST_READ_SCRIPT; AdOps when kind == PRODUCED_AUDIO"
        preconditions: []
        side_effects:
          - "Revocation: every ACTIVE LineItem referencing this copy -> PAUSED (reservations/slots released)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /adnet/ad-copies/{id}/review (action=WITHDRAW)"
        actor: "Advertiser or Agency (owner scope)"
        preconditions: []
        side_effects: []
        note: "Withdraw uses the review endpoint with action=WITHDRAW but is restricted to the owning Advertiser/Agency; AdOps/ShowProducer may not withdraw."

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /adnet/invoices/{id}/transition (action=ISSUE)"
        actor: Finance
        preconditions:
          - "No MakeGood of this campaign is in OFFERED (ERR_MAKE_GOOD_OUTSTANDING)"
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /adnet/invoices/{id}/transition (action=ISSUE)"
        actor: Finance
        preconditions:
          - "No MakeGood of this campaign is in OFFERED (ERR_MAKE_GOOD_OUTSTANDING)"
        side_effects: []
        note: "Re-issuing a disputed invoice does not recompute amounts; the figures frozen at creation (plus a DECLINE credit) are final."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /adnet/invoices/{id}/transition (action=DISPUTE)"
        actor: Finance
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /adnet/invoices/{id}/transition (action=MARK_PAID)"
        actor: Finance
        preconditions: []
        side_effects:
          - "If the campaign is ENDED and no MakeGood is in {OFFERED, ACCEPTED}: campaign -> RECONCILED"

  - entity: MakeGood
    field: status
    initial_state: OFFERED
    terminal_states: [DECLINED, FULFILLED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /adnet/make-goods/{id}/transition (action=ACCEPT, extension_days)"
        actor: "Advertiser (owner), Agency (representative), or AdOps"
        preconditions:
          - "Owning invoice status == DRAFT (invoice issuance is blocked while OFFERED, so this always holds; kept as an explicit guard)"
          - "extension_days present, 1..30 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Campaign ENDED -> ACTIVE with flight_end += extension_days"
          - "baseline_delivered_impressions := campaign.delivered_impressions"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /adnet/make-goods/{id}/transition (action=DECLINE)"
        actor: "Advertiser (owner), Agency (representative), or AdOps"
        preconditions: []
        side_effects:
          - "Invoice (still DRAFT) recomputes: make_good_credit_cents = round_half_up(shortfall_impressions * cpm_cents / 1000); agency_commission_cents and net_cents recomputed in pinned order (invoice_commission)"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "system (campaign END evaluation: make_good_fulfillment)"
        actor: system
        preconditions:
          - "campaign.delivered_impressions - baseline_delivered_impressions >= granted_impressions"
        side_effects: []
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system (campaign END evaluation: make_good_fulfillment)"
        actor: system
        preconditions:
          - "campaign.delivered_impressions - baseline_delivered_impressions < granted_impressions"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-patch-stale-version
    parent_entity: Campaign
    write_endpoint: "PATCH /adnet/campaigns/{id}"
    occ_field: "expected_campaign_version"
    description: |
      A PATCH that edits flight dates, booked_impressions, or cpm_cents is
      rejected when the client's last observed Campaign.version no longer
      matches the stored version. Any successful mutation of the campaign
      (including cascaded delivered_impressions recomputes) advances the
      version, so a writer holding an older version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: show-patch-stale-version
    parent_entity: Show
    write_endpoint: "PATCH /adnet/shows/{id}"
    occ_field: "expected_show_version"
    description: |
      A PATCH that edits avg_downloads_30d or blocked_advertiser_categories is
      rejected when the client's last observed Show.version no longer matches
      the stored version, which advances on every mutation (including
      cascaded reservation and forecast recomputes).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: download_qualification
    trigger: "download ingest (provisional variant); episode FINALIZE_MEASUREMENT (final variant)"
    algorithm: threshold
    formula: |
      Provisional variant (at ingest):
        qualified_provisional = (user_agent_class != "BOT")
      Final variant (at FINALIZE_MEASUREMENT):
        window = [episode.publish_at, episode.publish_at + measurement_window_days]  (both bounds inclusive)
        candidate set = downloads of this episode with user_agent_class == "HUMAN"
                        AND occurred_at inside window
        group candidates by (listener_key, UTC calendar day of occurred_at)
        per group: only the download with the earliest occurred_at qualifies
        qualified_final = true for group winners, false for every other download
    input_set: "All Download rows of the episode; provisional uses only the ingested row, final uses the whole episode set"
    constants:
      WINDOW_INCLUSIVE: true
    precision: "boolean; no rounding"
    variants:
      - name: provisional
        when: "computed at ingest, before measurement finalization"
        difference: "Excludes only BOT; no dedupe, no window filter -> counts UNKNOWN and same-day repeats"
      - name: final
        when: "computed once at FINALIZE_MEASUREMENT"
        difference: "HUMAN-only, measurement-window filter, one download per listener_key per UTC day"

  - name: inventory_forecast
    trigger: "episode create / PUBLISH / FINALIZE_MEASUREMENT; show PATCH of avg_downloads_30d; show tier transition; logical clock set"
    algorithm: threshold
    formula: |
      eligible_episodes = count(Episode of this show with
          status IN {SCHEDULED, PUBLISHED}
          AND publish_at in [current_utc, current_utc + 30 days]  (both bounds inclusive))
      cap = 0.95 if brand_safety_tier == CLEAR
            0.70 if FLAGGED
            0.00 if SUSPENDED
      forecast_impressions = floor(avg_downloads_30d * eligible_episodes * cap)
      available_impressions = forecast_impressions - reserved_impressions
      reserved_impressions = sum(reserved_impressions of ACTIVE LineItems with show_id == this show)
    input_set: "Episodes of the show filtered by status IN {SCHEDULED, PUBLISHED} and the rolling 30-day publish window; ACTIVE run-of-show LineItems only"
    constants:
      FORECAST_HORIZON_DAYS: 30
      CAP_CLEAR: 0.95
      CAP_FLAGGED: 0.70
      CAP_SUSPENDED: 0.00
    precision: "integer impressions, floor"

  - name: delivery_aggregation
    trigger: "download ingest (provisional counters); episode FINALIZE_MEASUREMENT; campaign END"
    algorithm: aggregation
    formula: |
      campaign.delivered_impressions = count(Impression where
          campaign_id == campaign.id AND billable_final == true)
      Provisional variant (report only, never stored on Campaign):
          provisional_delivered_impressions = count(Impression where
              campaign_id == campaign.id AND billable_provisional == true)
      Billable window guard: an Impression is billable only when its download's
      occurred_at lies in [campaign.flight_start, campaign.flight_end) — enforced
      at serve time (no Impression is created outside the flight).
    input_set: "Impressions of the campaign; final counts only billable_final == true, provisional counts only billable_provisional == true"
    precision: "integer count"
    variants:
      - name: provisional
        when: "live reporting before measurement finalization"
        difference: "Counts billable_provisional; over-counts vs final (no dedupe, UNKNOWN included)"
      - name: final
        when: "after FINALIZE_MEASUREMENT of the serving episodes"
        difference: "Counts billable_final only"

  - name: episode_slot_occupancy
    trigger: "line item ACTIVATE / PAUSE / END; logical clock set"
    algorithm: aggregation
    formula: |
      slots_in_use = count(LineItem where episode_id == episode.id
          AND status == ACTIVE
          AND campaign.flight_start <= current_utc < campaign.flight_end)
      slots_free = slot_capacity - slots_in_use
      Activation gate (aggregate capacity over half-open flight overlap):
        reject ACTIVATE when count(other ACTIVE episode-targeted LineItems whose
        campaign flight overlaps the candidate's campaign flight) >= slot_capacity.
      Overlap test (half-open): a_start < b_end AND b_start < a_end.
    input_set: "ACTIVE LineItems targeting this episode"
    precision: "integer count"

  - name: invoice_billing
    trigger: "POST /adnet/invoices (amounts frozen at creation)"
    algorithm: tiered_pricing
    formula: |
      For each LineItem of the campaign that produced >= 1 billable_final Impression:
        billable_i = count of that line item's Impressions with billable_final == true
        line_cents_i = round_half_up(billable_i * cpm_cents * POSITION_MULT[position_i] / 1000000)
      Rounding order is PINNED: round each line to integer cents first, then sum.
      delivered_impressions_billed = sum(billable_i)
      shortfall_impressions = max(0, booked_impressions - delivered_impressions_billed)
      Variant ACTUAL_DELIVERY: gross_cents = sum(line_cents_i)
      Variant BOOKED_GROSS:    gross_cents = round_half_up(booked_impressions * cpm_cents / 1000)
    input_set: "Campaign's LineItems and their billable_final Impressions; all episodes that produced impressions must be MEASURED before invoice creation"
    constants:
      POSITION_MULT_PRE_ROLL: 800      # per mille of cpm
      POSITION_MULT_MID_ROLL: 1000
      POSITION_MULT_POST_ROLL: 600
    precision: "integer cents, round_half_up per line, then sum"
    variants:
      - name: ACTUAL_DELIVERY
        when: "campaign.billing_model == ACTUAL_DELIVERY"
        difference: "Bills only qualified delivered impressions, per line item with position multipliers"
      - name: BOOKED_GROSS
        when: "campaign.billing_model == BOOKED_GROSS"
        difference: "Bills the full booked_impressions at base cpm regardless of delivery or position"

  - name: invoice_commission
    trigger: "POST /adnet/invoices; MakeGood DECLINE (while invoice DRAFT)"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (each step uses only earlier steps):
        1. delivered_impressions_billed and shortfall_impressions (from invoice_billing)
        2. gross_cents (variant-selected, from invoice_billing)
        3. make_good_credit_cents = round_half_up(shortfall_impressions * cpm_cents / 1000)
           if a MakeGood of this campaign is DECLINED, else 0
        4. agency_commission_cents = round_half_up((gross_cents - make_good_credit_cents)
           * agency.commission_bps / 10000) if advertiser.agency_id is set, else 0
        5. net_cents = gross_cents - agency_commission_cents - make_good_credit_cents
      Invariant: net_cents + agency_commission_cents + make_good_credit_cents == gross_cents.
    input_set: "The invoice's frozen gross/shortfall, the campaign's cpm_cents, the advertiser's agency commission_bps"
    precision: "integer cents, round_half_up at steps 3 and 4"

  - name: attribution_window
    trigger: "attribution event ingest"
    algorithm: threshold
    formula: |
      attributed = (flight_start <= occurred_at <= flight_end + ATTRIBUTION_WINDOW_DAYS days)
      Both bounds inclusive; flight_end is the campaign's CURRENT flight_end at ingest time.
      Report counts only AttributionEvents with attributed == true, split by kind.
    input_set: "The ingested AttributionEvent and its campaign's current flight"
    constants:
      ATTRIBUTION_WINDOW_DAYS: 30
    precision: "boolean; boundary at exactly flight_end + 30 days is inclusive"

  - name: campaign_report
    trigger: "GET /adnet/campaigns/{id}/report (computed live on read)"
    algorithm: aggregation
    formula: |
      delivered_impressions = count(Impression of campaign with billable_final == true)
      provisional_delivered_impressions = count(Impression with billable_provisional == true)
      shortfall_impressions = max(0, booked_impressions - delivered_impressions)
      attributed_promo_code_count = count(AttributionEvent with campaign_id, kind == PROMO_CODE, attributed == true)
      attributed_pixel_count = count(AttributionEvent with campaign_id, kind == PIXEL, attributed == true)
      gross_cents_estimate: invoice_billing ACTUAL_DELIVERY shape over billable_final
        impressions (per-line round_half_up, then sum); BOOKED_GROSS campaigns report
        round_half_up(booked_impressions * cpm_cents / 1000) regardless of delivery
      effective_cpm_cents = 0 when delivered_impressions == 0 (zero-guard), else
        round_half_up(gross_cents_estimate * 1000 / delivered_impressions)
    input_set: "Impressions and AttributionEvents of the campaign; no state filter on the campaign itself (report is readable in any status)"
    precision: "integer cents / integer counts, round_half_up"

  - name: make_good_fulfillment
    trigger: "campaign END transition when a MakeGood of the campaign is ACCEPTED"
    algorithm: threshold
    formula: |
      bonus_delivered = campaign.delivered_impressions - make_good.baseline_delivered_impressions
      if bonus_delivered >= granted_impressions: MakeGood -> FULFILLED
      else: MakeGood -> EXPIRED
      Boundary: bonus_delivered exactly equal to granted_impressions FULFILLS (>=).
    input_set: "The ACCEPTED MakeGood and its campaign's delivered_impressions at END time"
    precision: "integer impressions"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership/scope: Advertiser acts only on own campaigns/copies/make-goods (advertiser_id == X-User-ID); Agency acts only for advertisers it represents (advertiser.agency_id == X-User-ID, else ERR_AGENCY_MISMATCH); ShowProducer reviews only HOST_READ_SCRIPT copies with show_id == X-User-ID and manages brand safety of own show only"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /adnet/campaigns, PATCH /adnet/campaigns/{id}, POST /adnet/ad-copies, POST /adnet/ad-copies/{id}/submit, POST /adnet/ad-copies/{id}/review, POST /adnet/make-goods/{id}/transition, GET owner-scoped reads"

  - priority: 3.5
    category: auth
    check: "Agency representation: advertiser referenced by the request is represented by the acting agency"
    error_id: ERR_AGENCY_MISMATCH
    http_status: 403
    applies_to: "POST /adnet/campaigns, POST /adnet/ad-copies, POST /adnet/make-goods/{id}/transition when X-User-Role == Agency"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right; body foreign keys (show_id, episode_id, campaign_id, advertiser_id, agency_id, ad_copy_id, invoice_id) reference existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_show_version / expected_campaign_version equals the stored version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /adnet/shows/{id}, PATCH /adnet/campaigns/{id}"

  - priority: 6
    category: state
    check: "Resource state permits the operation: episode PUBLISH requires SCHEDULED; FINALIZE_MEASUREMENT requires PUBLISHED; download ingest requires PUBLISHED (ERR_EPISODE_NOT_PUBLISHED); campaign transitions follow the Campaign machine (ERR_CAMPAIGN_NOT_ACTIVATABLE); campaign PATCH only in DRAFT/PAUSED (ERR_CAMPAIGN_NOT_EDITABLE); line-item transitions follow the LineItem machine (ERR_LINE_ITEM_STATE); ad-copy submit only from DRAFT/CHANGES_REQUESTED and review only from SUBMITTED/APPROVED (ERR_COPY_STATE); invoice create requires campaign ENDED (ERR_CAMPAIGN_NOT_ENDED); invoice transitions follow the Invoice machine (ERR_INVOICE_STATE); make-good transitions require OFFERED (ERR_MAKE_GOOD_STATE); line-item create requires campaign in {DRAFT, ACTIVE, PAUSED} (ERR_CAMPAIGN_NOT_EDITABLE)"
    error_id: "ERR_EPISODE_NOT_PUBLISHED | ERR_CAMPAIGN_NOT_ACTIVATABLE | ERR_CAMPAIGN_NOT_EDITABLE | ERR_CAMPAIGN_NOT_ENDED | ERR_CAMPAIGN_NOT_ACTIVE | ERR_LINE_ITEM_STATE | ERR_COPY_STATE | ERR_INVOICE_STATE | ERR_MAKE_GOOD_STATE"
    http_status: 409
    applies_to: "all mutation endpoints with a state machine"

  - priority: 7
    category: business_safety
    check: "Brand safety: target show brand_safety_tier != SUSPENDED (ERR_SHOW_SUSPENDED); campaign advertiser category not in show.blocked_advertiser_categories (ERR_BRAND_SAFETY_CONFLICT)"
    error_id: "ERR_SHOW_SUSPENDED | ERR_BRAND_SAFETY_CONFLICT"
    http_status: 409
    applies_to: "POST /adnet/line-items, POST /adnet/line-items/{id}/transition (ACTIVATE)"

  - priority: 8
    category: business_referential
    check: "Cross-reference integrity: exactly one of show_id/episode_id set (ERR_TARGET_SCOPE_INVALID); HOST_READ_SCRIPT copy requires show_id (ERR_HOST_READ_REQUIRES_SHOW); ad_copy.campaign_id == line item campaign_id (ERR_COPY_CAMPAIGN_MISMATCH); ad_format matches copy kind (ERR_INVALID_REQUEST); promo_code present iff kind == PROMO_CODE (ERR_INVALID_REQUEST)"
    error_id: "ERR_TARGET_SCOPE_INVALID | ERR_HOST_READ_REQUIRES_SHOW | ERR_COPY_CAMPAIGN_MISMATCH | ERR_INVALID_REQUEST"
    http_status: 400
    applies_to: "POST /adnet/line-items, POST /adnet/ad-copies, POST /adnet/attribution-events"
    note: "ERR_TARGET_SCOPE_INVALID and ERR_HOST_READ_REQUIRES_SHOW return 400; ERR_COPY_CAMPAIGN_MISMATCH returns 409 (the referenced copy exists but is attached to another campaign)."

  - priority: 9
    category: business_temporal
    check: "Time rules: flight_end strictly after flight_start (ERR_FLIGHT_WINDOW_INVALID); PUBLISH requires clock >= publish_at (ERR_EPISODE_NOT_DUE); FINALIZE_MEASUREMENT requires clock > publish_at + measurement_window_days (ERR_MEASUREMENT_WINDOW_OPEN); invoice creation requires every impression-producing episode of the campaign to be MEASURED (ERR_MEASUREMENT_PENDING)"
    error_id: "ERR_FLIGHT_WINDOW_INVALID | ERR_EPISODE_NOT_DUE | ERR_MEASUREMENT_WINDOW_OPEN | ERR_MEASUREMENT_PENDING"
    http_status: 409
    applies_to: "POST /adnet/campaigns, PATCH /adnet/campaigns/{id}, POST /adnet/episodes/{id}/transition, POST /adnet/invoices"
    note: "ERR_FLIGHT_WINDOW_INVALID returns 422."

  - priority: 10
    category: business_constraint
    check: "Structural business rules: campaign activate requires >= 1 APPROVED AdCopy (ERR_NO_APPROVED_COPY); line-item ACTIVATE requires copy APPROVED (ERR_COPY_NOT_APPROVED); category exclusivity over half-open flight overlap (ERR_CATEGORY_EXCLUSIVE_CONFLICT); episode slot aggregate capacity (ERR_SLOT_CAPACITY_EXCEEDED); advertiser must be ACTIVE at campaign create/activate (ERR_ADVERTISER_SUSPENDED)"
    error_id: "ERR_NO_APPROVED_COPY | ERR_COPY_NOT_APPROVED | ERR_CATEGORY_EXCLUSIVE_CONFLICT | ERR_SLOT_CAPACITY_EXCEEDED | ERR_ADVERTISER_SUSPENDED"
    http_status: 409
    applies_to: "POST /adnet/campaigns, POST /adnet/campaigns/{id}/transition, POST /adnet/line-items/{id}/transition"

  - priority: 11
    category: business_fiscal
    check: "Inventory sufficiency: run-of-show line-item ACTIVATE requires reserved_impressions <= show.available_impressions (equality allowed)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /adnet/line-items/{id}/transition (ACTIVATE)"

  - priority: 12
    category: business_fiscal
    check: "Invoice issuance blocked while a MakeGood of the campaign is OFFERED"
    error_id: ERR_MAKE_GOOD_OUTSTANDING
    http_status: 409
    applies_to: "POST /adnet/invoices/{id}/transition (ISSUE)"

  - priority: 13
    category: business_constraint
    check: "Malformed or missing required fields, enum values outside the declared set, out-of-range integers, duplicate invoice for a campaign"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
    note: "Field-shape validation is the catch-all and runs only when no earlier category fired; dual-failure tests always involve one earlier category."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time fixed at startup) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. May be set to any ISO-8601 UTC instant, forward or backward. Side effect: recomputes every show's inventory_forecast and every episode's slots_in_use against the new time."
    roles: [AdOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["inventory_forecast recompute for all shows", "episode_slot_occupancy recompute for all episodes"]

  # --- Show ---
  - method: POST
    path: "/adnet/shows"
    description: "Create a show"
    roles: [AdOps]
    code: 201
    input: [title, content_category, avg_downloads_30d, "blocked_advertiser_categories?"]
    output: Show
    side_effects: ["brand_safety_tier=CLEAR", "forecast_impressions computed (0 episodes -> 0)", "reserved_impressions=0"]

  - method: GET
    path: "/adnet/shows/{id}"
    description: "Get a show"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: GET
    path: "/adnet/shows"
    description: "List shows with optional filters and pagination"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: ["content_category?", "brand_safety_tier?", "limit?", "offset?"]
    output: Show[]
    side_effects: []

  - method: PATCH
    path: "/adnet/shows/{id}"
    description: "Edit show baseline / brand-safety category blocks; OCC-guarded"
    roles: [AdOps]
    code: 200
    input: ["avg_downloads_30d?", "blocked_advertiser_categories?", expected_show_version]
    output: Show
    side_effects: ["increments Show.version by 1", "inventory_forecast recompute"]

  - method: POST
    path: "/adnet/shows/{id}/transition"
    description: "Move brand_safety_tier per the Show machine (CLEAR/FLAGGED/SUSPENDED)"
    roles: [AdOps]
    code: 200
    input: [to_tier]
    output: Show
    side_effects: ["tier transition", "SUSPENDED cascades: pause ACTIVE line items, bubble-pause campaigns, release reservations", "inventory_forecast recompute"]

  # --- Episode ---
  - method: POST
    path: "/adnet/episodes"
    description: "Create an episode"
    roles: [AdOps]
    code: 201
    input: [show_id, title, publish_at, "measurement_window_days?", "slot_capacity?"]
    output: Episode
    side_effects: ["status=SCHEDULED", "inventory_forecast recompute for the show"]

  - method: GET
    path: "/adnet/episodes/{id}"
    description: "Get an episode"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: Episode
    side_effects: []

  - method: GET
    path: "/adnet/episodes"
    description: "List episodes; show_id filter provides FK reverse-reachability"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: ["show_id?", "status?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []

  - method: POST
    path: "/adnet/episodes/{id}/transition"
    description: "PUBLISH or FINALIZE_MEASUREMENT per the Episode machine"
    roles: [AdOps]
    code: 200
    input: [action]
    output: Episode
    side_effects: ["PUBLISH: status=PUBLISHED, forecast recompute", "FINALIZE_MEASUREMENT: sets qualified_final, cascades billable_final and delivered_impressions recomputes"]

  - method: GET
    path: "/adnet/episodes/{id}/downloads"
    description: "List downloads of an episode (FK reverse-reachability)"
    roles: [AdOps, Finance]
    code: 200
    input: ["limit?", "offset?"]
    output: Download[]
    side_effects: []

  # --- Agency ---
  - method: POST
    path: "/adnet/agencies"
    description: "Create an agency"
    roles: [AdOps]
    code: 201
    input: [name, commission_bps]
    output: Agency
    side_effects: []

  - method: GET
    path: "/adnet/agencies/{id}"
    description: "Get an agency"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- Advertiser ---
  - method: POST
    path: "/adnet/advertisers"
    description: "Create an advertiser (agency_id optional)"
    roles: [AdOps]
    code: 201
    input: [name, category, "agency_id?"]
    output: Advertiser
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/adnet/advertisers/{id}"
    description: "Get an advertiser"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: Advertiser
    side_effects: []

  - method: GET
    path: "/adnet/advertisers"
    description: "List advertisers; agency_id filter provides FK reverse-reachability"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: ["agency_id?", "category?", "status?", "limit?", "offset?"]
    output: Advertiser[]
    side_effects: []

  - method: POST
    path: "/adnet/advertisers/{id}/transition"
    description: "SUSPEND / REINSTATE per the Advertiser machine; SUSPEND cascades"
    roles: [AdOps]
    code: 200
    input: [action]
    output: Advertiser
    side_effects: ["SUSPEND: ACTIVE campaigns -> PAUSED, their ACTIVE line items -> PAUSED, reservations released"]

  # --- Campaign ---
  - method: POST
    path: "/adnet/campaigns"
    description: "Create a campaign flight"
    roles: [AdOps, Advertiser, Agency]
    code: 201
    input: [advertiser_id, name, flight_start, flight_end, booked_impressions, cpm_cents, billing_model]
    output: Campaign
    side_effects: ["status=DRAFT", "delivered_impressions=0"]

  - method: GET
    path: "/adnet/campaigns/{id}"
    description: "Get a campaign"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/adnet/campaigns"
    description: "List campaigns; advertiser_id filter provides FK reverse-reachability"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: ["advertiser_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: PATCH
    path: "/adnet/campaigns/{id}"
    description: "Edit flight/booking while DRAFT or PAUSED; OCC-guarded"
    roles: [AdOps, Advertiser, Agency]
    code: 200
    input: ["flight_start?", "flight_end?", "booked_impressions?", "cpm_cents?", expected_campaign_version]
    output: Campaign
    side_effects: ["increments Campaign.version by 1"]

  - method: POST
    path: "/adnet/campaigns/{id}/transition"
    description: "ACTIVATE | PAUSE | END | CANCEL per the Campaign machine"
    roles: [AdOps]
    code: 200
    input: [action]
    output: Campaign
    side_effects: ["END: line items -> ENDED, delivered recompute, make-good fulfillment evaluation, reconcile check"]

  - method: GET
    path: "/adnet/campaigns/{id}/report"
    description: "Computed campaign delivery + attribution report"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: { campaign_id: string, status: string, booked_impressions: integer, delivered_impressions: integer, provisional_delivered_impressions: integer, shortfall_impressions: integer, attributed_promo_code_count: integer, attributed_pixel_count: integer, gross_cents_estimate: integer, effective_cpm_cents: integer }
    side_effects: []

  - method: GET
    path: "/adnet/campaigns/{id}/attribution-events"
    description: "List attribution events of a campaign (FK reverse-reachability)"
    roles: [AdOps, Advertiser, Agency, Finance]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: AttributionEvent[]
    side_effects: []

  # --- LineItem ---
  - method: POST
    path: "/adnet/line-items"
    description: "Create a line item (run-of-show via show_id XOR episode-targeted via episode_id)"
    roles: [AdOps]
    code: 201
    input: [campaign_id, "show_id?", "episode_id?", ad_format, position, reserved_impressions, priority, ad_copy_id]
    output: LineItem
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/adnet/line-items/{id}"
    description: "Get a line item"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: LineItem
    side_effects: []

  - method: GET
    path: "/adnet/line-items"
    description: "List line items; FK filters provide reverse-reachability"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: ["campaign_id?", "show_id?", "episode_id?", "ad_copy_id?", "status?", "limit?", "offset?"]
    output: LineItem[]
    side_effects: []

  - method: POST
    path: "/adnet/line-items/{id}/transition"
    description: "ACTIVATE | PAUSE | END per the LineItem machine; activation runs safety/exclusivity/capacity/inventory gates"
    roles: [AdOps]
    code: 200
    input: [action]
    output: LineItem
    side_effects: ["ACTIVATE: debit show pool or occupy episode slot", "PAUSE/END: release reservation / slot"]

  # --- AdCopy ---
  - method: POST
    path: "/adnet/ad-copies"
    description: "Create ad copy (HOST_READ_SCRIPT requires show_id)"
    roles: [Advertiser, Agency]
    code: 201
    input: [campaign_id, kind, script_text, "show_id?"]
    output: AdCopy
    side_effects: ["status=DRAFT", "revision=1"]

  - method: GET
    path: "/adnet/ad-copies/{id}"
    description: "Get ad copy"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: []
    output: AdCopy
    side_effects: []

  - method: GET
    path: "/adnet/ad-copies"
    description: "List ad copies; campaign_id/show_id filters provide FK reverse-reachability"
    roles: [AdOps, Advertiser, Agency, ShowProducer, Finance, Ingestion]
    code: 200
    input: ["campaign_id?", "show_id?", "status?", "limit?", "offset?"]
    output: AdCopy[]
    side_effects: []

  - method: POST
    path: "/adnet/ad-copies/{id}/submit"
    description: "Submit copy for review; resubmission from CHANGES_REQUESTED bumps revision"
    roles: [Advertiser, Agency]
    code: 200
    input: []
    output: AdCopy
    side_effects: ["status=SUBMITTED", "revision += 1 when leaving CHANGES_REQUESTED"]

  - method: POST
    path: "/adnet/ad-copies/{id}/review"
    description: "APPROVE | REQUEST_CHANGES (reviewer) or WITHDRAW (owner). HOST_READ_SCRIPT reviewed by the show's ShowProducer; PRODUCED_AUDIO by AdOps"
    roles: [AdOps, ShowProducer, Advertiser, Agency]
    code: 200
    input: [action, "note?"]
    output: AdCopy
    side_effects: ["REQUEST_CHANGES from APPROVED revokes: ACTIVE line items referencing the copy -> PAUSED"]

  # --- Download / Impression (dynamic insertion) ---
  - method: POST
    path: "/adnet/downloads"
    description: "Batch ingest of download pings. Creates count Download rows with listener_key = `${listener_key_prefix}-${i}` for i in 0..count-1. Each download triggers the insertion selector: eligible line items are ACTIVE, their campaign ACTIVE, occurred_at inside [flight_start, flight_end), and target matches (episode_id == this episode OR show_id == this episode's show); ranked by priority DESC then created_at ASC; the top slot_capacity receive an Impression. Requires episode PUBLISHED."
    roles: [Ingestion]
    code: 201
    input: [episode_id, listener_key_prefix, count, occurred_at, user_agent_class]
    output: Download[]
    side_effects: ["creates Impressions per the selector", "sets qualified_provisional and billable_provisional", "updates episode provisional_download_count"]

  - method: GET
    path: "/adnet/impressions/{id}"
    description: "Get an impression"
    roles: [AdOps, Finance]
    code: 200
    input: []
    output: Impression
    side_effects: []

  - method: GET
    path: "/adnet/impressions"
    description: "List impressions; campaign_id/line_item_id/download_id filters provide FK reverse-reachability"
    roles: [AdOps, Finance]
    code: 200
    input: ["campaign_id?", "line_item_id?", "download_id?", "limit?", "offset?"]
    output: Impression[]
    side_effects: []

  # --- Attribution ---
  - method: POST
    path: "/adnet/attribution-events"
    description: "Ingest a promo-code redemption or pixel hit; computes the attributed flag"
    roles: [Ingestion]
    code: 201
    input: [campaign_id, kind, occurred_at, "promo_code?"]
    output: AttributionEvent
    side_effects: ["attributed computed per attribution_window"]

  # --- Invoice ---
  - method: POST
    path: "/adnet/invoices"
    description: "Create the (single) invoice for an ENDED campaign; freezes billing amounts; auto-creates an OFFERED MakeGood when shortfall_impressions > 0"
    roles: [Finance]
    code: 201
    input: [campaign_id]
    output: Invoice
    side_effects: ["invoice_billing + invoice_commission", "MakeGood OFFERED created when shortfall_impressions > 0"]

  - method: GET
    path: "/adnet/invoices/{id}"
    description: "Get an invoice"
    roles: [AdOps, Advertiser, Agency, Finance]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/adnet/invoices"
    description: "List invoices; campaign_id filter provides FK reverse-reachability"
    roles: [AdOps, Advertiser, Agency, Finance]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/adnet/invoices/{id}/transition"
    description: "ISSUE | DISPUTE | MARK_PAID per the Invoice machine"
    roles: [Finance]
    code: 200
    input: [action]
    output: Invoice
    side_effects: ["MARK_PAID: campaign reconcile check"]

  # --- MakeGood ---
  - method: GET
    path: "/adnet/make-goods/{id}"
    description: "Get a make-good"
    roles: [AdOps, Advertiser, Agency, Finance]
    code: 200
    input: []
    output: MakeGood
    side_effects: []

  - method: GET
    path: "/adnet/make-goods"
    description: "List make-goods; campaign_id/invoice_id filters provide FK reverse-reachability"
    roles: [AdOps, Advertiser, Agency, Finance]
    code: 200
    input: ["campaign_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: MakeGood[]
    side_effects: []

  - method: POST
    path: "/adnet/make-goods/{id}/transition"
    description: "ACCEPT (requires extension_days 1..30; reopens the campaign) or DECLINE (grants cash credit on the DRAFT invoice)"
    roles: [Advertiser, Agency, AdOps]
    code: 200
    input: [action, "extension_days?"]
    output: MakeGood
    side_effects: ["ACCEPT: campaign ENDED -> ACTIVE, flight_end += extension_days, baseline snapshot", "DECLINE: invoice credit/commission/net recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity-backed ownership/scope violated" }
  - { id: ERR_AGENCY_MISMATCH, http: 403, condition: "Agency acts for an advertiser whose agency_id differs from X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed required field, bad enum, out-of-range integer, count outside 1..1000, promo_code presence mismatch, ad_format/copy-kind mismatch, duplicate invoice for a campaign" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the stored version (OCC)" }
  - { id: ERR_EPISODE_NOT_PUBLISHED, http: 409, condition: "Download ingest into an episode that is not PUBLISHED" }
  - { id: ERR_EPISODE_NOT_DUE, http: 409, condition: "PUBLISH attempted before publish_at per the logical clock" }
  - { id: ERR_MEASUREMENT_WINDOW_OPEN, http: 409, condition: "FINALIZE_MEASUREMENT attempted at or before publish_at + measurement_window_days" }
  - { id: ERR_MEASUREMENT_PENDING, http: 409, condition: "Invoice creation while an impression-producing episode of the campaign is not MEASURED" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVATABLE, http: 409, condition: "Campaign ACTIVATE/PAUSE/END/CANCEL attempted from a state where the machine forbids it" }
  - { id: ERR_CAMPAIGN_NOT_EDITABLE, http: 409, condition: "Campaign PATCH outside DRAFT/PAUSED, or line-item create against an ENDED/RECONCILED/CANCELLED campaign" }
  - { id: ERR_CAMPAIGN_NOT_ENDED, http: 409, condition: "Invoice creation for a campaign not in ENDED" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Line-item ACTIVATE while the owning campaign is not ACTIVE" }
  - { id: ERR_LINE_ITEM_STATE, http: 409, condition: "Line-item transition forbidden by the LineItem machine (e.g. ACTIVATE from ENDED)" }
  - { id: ERR_COPY_STATE, http: 409, condition: "Ad-copy submit/review attempted from a state where the AdCopy machine forbids it" }
  - { id: ERR_NO_APPROVED_COPY, http: 409, condition: "Campaign ACTIVATE without any APPROVED AdCopy" }
  - { id: ERR_COPY_NOT_APPROVED, http: 409, condition: "Line-item ACTIVATE whose referenced AdCopy is not APPROVED" }
  - { id: ERR_COPY_CAMPAIGN_MISMATCH, http: 409, condition: "ad_copy_id belongs to a different campaign than the line item's campaign_id" }
  - { id: ERR_HOST_READ_REQUIRES_SHOW, http: 400, condition: "HOST_READ_SCRIPT ad copy created without show_id" }
  - { id: ERR_TARGET_SCOPE_INVALID, http: 400, condition: "Line item created with both or neither of show_id/episode_id" }
  - { id: ERR_BRAND_SAFETY_CONFLICT, http: 409, condition: "Campaign advertiser category is in the target show's blocked_advertiser_categories" }
  - { id: ERR_SHOW_SUSPENDED, http: 409, condition: "Line-item create/activate targets a show whose brand_safety_tier is SUSPENDED" }
  - { id: ERR_ADVERTISER_SUSPENDED, http: 409, condition: "Campaign create/activate while the advertiser is SUSPENDED" }
  - { id: ERR_FLIGHT_WINDOW_INVALID, http: 422, condition: "flight_end <= flight_start on campaign create or PATCH" }
  - { id: ERR_CATEGORY_EXCLUSIVE_CONFLICT, http: 409, condition: "ACTIVATE would put two different advertisers of the same category on the same show with overlapping half-open flights" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "ACTIVATE would exceed the episode's slot_capacity for overlapping flights" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Run-of-show ACTIVATE with reserved_impressions > show.available_impressions" }
  - { id: ERR_MAKE_GOOD_OUTSTANDING, http: 409, condition: "Invoice ISSUE while a MakeGood of the campaign is OFFERED" }
  - { id: ERR_MAKE_GOOD_STATE, http: 409, condition: "Make-good ACCEPT/DECLINE from a state other than OFFERED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AdOps
    description: "Network ad-operations staff; runs inventory, campaigns, line items, measurement, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /adnet/shows, PATCH /adnet/shows/{id}, POST /adnet/shows/{id}/transition"
      - "POST /adnet/episodes, POST /adnet/episodes/{id}/transition"
      - "POST /adnet/agencies, POST /adnet/advertisers, POST /adnet/advertisers/{id}/transition"
      - "POST /adnet/campaigns/{id}/transition"
      - "POST /adnet/line-items, POST /adnet/line-items/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /adnet/campaigns (unscoped)"
      - "POST /adnet/ad-copies/{id}/review (PRODUCED_AUDIO only)"
      - "POST /adnet/make-goods/{id}/transition"
      - "All GET endpoints"

  - name: Advertiser
    description: "Brand-side buyer acting on its own campaigns, ad copies, and make-good decisions"
    identity: "entity_backed:Advertiser"
    exclusive_operations: []
    shared_operations:
      - "POST /adnet/campaigns (advertiser_id must equal X-User-ID)"
      - "PATCH /adnet/campaigns/{id} (own campaigns)"
      - "POST /adnet/ad-copies, POST /adnet/ad-copies/{id}/submit (own campaigns)"
      - "POST /adnet/ad-copies/{id}/review action=WITHDRAW (own copies)"
      - "POST /adnet/make-goods/{id}/transition (own campaigns' make-goods)"
      - "All GET endpoints"

  - name: Agency
    description: "Media agency acting on behalf of represented advertisers (advertiser.agency_id == X-User-ID)"
    identity: "entity_backed:Agency"
    exclusive_operations: []
    shared_operations:
      - "POST /adnet/campaigns (represented advertisers only, else ERR_AGENCY_MISMATCH)"
      - "PATCH /adnet/campaigns/{id} (represented advertisers' campaigns)"
      - "POST /adnet/ad-copies, POST /adnet/ad-copies/{id}/submit (represented advertisers' campaigns)"
      - "POST /adnet/ad-copies/{id}/review action=WITHDRAW (represented advertisers' copies)"
      - "POST /adnet/make-goods/{id}/transition (represented advertisers' make-goods)"
      - "All GET endpoints"

  - name: ShowProducer
    description: "Producer of a show; owns brand-safety voice and host-read script approval for that show"
    identity: "entity_backed:Show"
    exclusive_operations:
      - "POST /adnet/ad-copies/{id}/review for HOST_READ_SCRIPT copies with show_id == X-User-ID (APPROVE / REQUEST_CHANGES)"
    shared_operations:
      - "All GET endpoints"

  - name: Finance
    description: "Billing operations; owns invoice lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /adnet/invoices"
      - "POST /adnet/invoices/{id}/transition"
    shared_operations:
      - "All GET endpoints"

  - name: Ingestion
    description: "Measurement and attribution pipeline identity used by player pings and pixel/promo webhooks"
    identity: opaque
    exclusive_operations:
      - "POST /adnet/downloads"
      - "POST /adnet/attribution-events"
    shared_operations:
      - "All GET endpoints"
