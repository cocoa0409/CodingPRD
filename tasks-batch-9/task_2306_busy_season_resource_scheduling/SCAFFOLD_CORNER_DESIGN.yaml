              payload: { staff_member_id: "${s1_id}", engagement_id: "00000000-0000-0000-0000-0000000000cc", week_start_date: "2026-08-04", extra_hours_allowance: 3.00 }
              as: EngagementStaff
              as_user_id: "${s1_id}"
              captures: { err_id: $.data.error_id }
          assert:
