        claim_type: priority_ordering
        grounds: ["validations[priority=10]", "validations[priority=15]"]
        distinguishing_aspect: "A third priority pair (business_temporal vs business_referential, distinct from the two §1.8 pairs): with BOTH a permit window gap and missing assignments, the permit error wins."
