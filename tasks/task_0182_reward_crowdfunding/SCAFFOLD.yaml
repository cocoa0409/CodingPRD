# =============================================================================
# PRD Benchmark Seed Tables — Reward Crowdfunding (Expert)
# Scenario 182
# =============================================================================

scenario: |
  182. Reward Crowdfunding: campaign/funding goal, reward tier/limited quantity,
  all-or-nothing vs flexible, stretch goal, pledge/payment auth at close, add-on,
  fulfillment/shipping survey, refund/failed campaign

domain_name: reward-crowdfunding
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  difficulty_level: Expert
  primary_archetype: quota_allocation          # limited-quantity reward tiers / add-ons competed for
  secondary_archetype: event_sourcing          # campaign raise derived from an ordered pledge / auth stream
  complexity_layers:
    - dual_variant_calculation                 # projected raise vs settled raise; optimistic vs realized backer contribution
    - cascading_side_effects                   # close → settle pledges → release tier inventory → refunds
    - rate_threshold_triggers                  # funding goal + stretch-goal breakpoints
    - optimistic_concurrency                   # pledge create against stale campaign.version (true CREATE-supersede race)
    - derived_field_reconciliation             # committed_amount, claimed_quantity, settled_amount

  entity_topology: hierarchical                # Campaign tree (tiers, stretch goals, add-ons, pledges) + cross-cutting Backer/Creator refs
  state_machine_shape: parallel                # Pledge payment_status × fulfillment_status evolve independently; plus cyclic RewardTier, branching Campaign
  relationship_patterns:
    - one_to_many                              # Campaign → RewardTier / StretchGoal / AddOn / Pledge
    - many_to_many                             # Pledge ↔ AddOn via PledgeAddOn junction
    - cross_aggregate                          # Pledge references Backer (different aggregate); Campaign references Creator
  role_model: peer_roles                       # Creator owns campaigns; Backer owns pledges; PlatformAdmin operates settlement
  consistency_model: immediate                 # all derived fields reconciled in-request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Creator
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: display_name, type: string, source: input, description: "Public creator name" }
      - { name: payout_currency, type: string, source: input, description: "ISO-4217 currency code, e.g. USD; all owned campaigns must match" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Backer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Backer contact email" }
      - { name: display_name, type: string, source: input, description: "Public backer name" }
      - { name: lifetime_authorized_cents, type: integer, source: computed, description: "Optimistic contribution: sum of pledge.committed_amount_cents for this backer over pledges whose payment_status IN {AUTHORIZED, CAPTURED}" }
      - { name: lifetime_captured_cents, type: integer, source: computed, description: "Realized contribution: sum of pledge.committed_amount_cents for this backer over pledges whose payment_status == CAPTURED only" }
      - { name: declined_auth_count, type: integer, source: computed, description: "Count of this backer's pledges whose payment_status == AUTH_DECLINED" }
      - { name: reliability_score, type: number, source: computed, description: "Weighted reliability score in [0,100]; see calculations.backer_reliability_score" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Campaign
    parent: Creator
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: creator_id, type: string, source: input, description: "FK -> Creator.id; owning creator" }
      - { name: title, type: string, source: input, description: "Campaign title" }
      - { name: currency, type: string, source: computed, description: "Copied from owning Creator.payout_currency at creation; all tiers/add-ons/pledges use it" }
      - { name: funding_goal_cents, type: integer, source: input, description: "All-or-nothing/flexible goal in cents; must be > 0" }
      - { name: funding_model, type: enum, source: input, description: "ALL_OR_NOTHING | FLEXIBLE", constraints: "ALL_OR_NOTHING | FLEXIBLE" }
      - { name: deadline_utc, type: datetime, source: input, description: "Campaign close instant (ISO 8601 UTC); must be strictly after launch time" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: DRAFT, constraints: "DRAFT | LIVE | CLOSING | SUCCESSFUL | FAILED | CANCELED" }
      - { name: committed_amount_cents, type: integer, source: computed, description: "Projected raise while LIVE: sum of pledge.committed_amount_cents over pledges with payment_status IN {PENDING_AUTH, AUTHORIZED, CAPTURED}; see calculations.projected_raise" }
      - { name: settled_amount_cents, type: integer, source: computed, description: "Final raise after CLOSING: sum of pledge.committed_amount_cents over pledges with payment_status IN {AUTHORIZED, CAPTURED}; see calculations.settled_raise; null until CLOSING begins" }
      - { name: goal_met, type: boolean, source: computed, description: "True iff settled_amount_cents >= funding_goal_cents (evaluated at close); null until CLOSING" }
      - { name: launched_at, type: datetime, source: system, description: "Set when status DRAFT->LIVE; null in DRAFT" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1; incremented on every mutation including cascades" }

  - name: RewardTier
    parent: Campaign
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: title, type: string, source: input, description: "Tier title" }
      - { name: price_cents, type: integer, source: input, description: "Minimum pledge price for this tier in cents; must be > 0" }
      - { name: limit_quantity, type: integer, source: input, description: "Max claimable units; null means unlimited", constraints: "null or > 0" }
      - { name: claimed_quantity, type: integer, source: computed, description: "Count of non-released pledges (payment_status != AUTH_DECLINED and status != CANCELED) on this tier; see calculations.tier_claimed_quantity", default: 0 }
      - { name: weight_grams, type: integer, source: input, description: "Per-unit shipping weight used by pledge_total shipping calc; >= 0" }
      - { name: is_early_bird, type: boolean, source: input, description: "True if this tier is a time-windowed early-bird tier", default: false }
      - { name: available_from, type: datetime, source: input, description: "Early-bird window start (ISO 8601 UTC); null when is_early_bird false. Interval is half-open [available_from, available_until)" }
      - { name: available_until, type: datetime, source: input, description: "Early-bird window end (ISO 8601 UTC, exclusive); null when is_early_bird false. Must be strictly after available_from" }
      - { name: status, type: enum, source: system, description: "Inventory state", default: AVAILABLE, constraints: "AVAILABLE | SOLD_OUT | RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: StretchGoal
    parent: Campaign
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: title, type: string, source: input, description: "Stretch goal title" }
      - { name: threshold_cents, type: integer, source: input, description: "Committed amount at/above which this goal unlocks; must be > campaign.funding_goal_cents" }
      - { name: unlocked, type: boolean, source: computed, description: "True iff campaign.committed_amount_cents >= threshold_cents while LIVE, or settled_amount_cents >= threshold_cents once closed; see calculations.stretch_goal_unlock", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: AddOn
    parent: Campaign
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: title, type: string, source: input, description: "Add-on title" }
      - { name: price_cents, type: integer, source: input, description: "Per-unit add-on price in cents; must be > 0" }
      - { name: limit_quantity, type: integer, source: input, description: "Max total units across all pledges; null means unlimited", constraints: "null or > 0" }
      - { name: claimed_quantity, type: integer, source: computed, description: "Sum of PledgeAddOn.quantity over non-released pledges referencing this add-on; see calculations.addon_claimed_quantity", default: 0 }
      - { name: weight_grams, type: integer, source: input, description: "Per-unit shipping weight used by pledge_total shipping calc; >= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Pledge
    parent: Campaign
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; owning campaign" }
      - { name: backer_id, type: string, source: input, description: "FK -> Backer.id; pledging backer" }
      - { name: tier_id, type: string, source: input, description: "FK -> RewardTier.id; selected reward tier" }
      - { name: pledge_amount_cents, type: integer, source: input, description: "Backer-chosen base pledge in cents; must be >= tier.price_cents" }
      - { name: destination_zone, type: enum, source: input, description: "Shipping zone for the shipping component of pledge total", constraints: "DOMESTIC | INTL" }
      - { name: items_subtotal_cents, type: integer, source: computed, description: "pledge_amount_cents + sum(addon line totals); see calculations.pledge_total" }
      - { name: shipping_cents, type: integer, source: computed, description: "Shipping component from tier+add-on weight and destination_zone; see calculations.pledge_total" }
      - { name: committed_amount_cents, type: integer, source: computed, description: "items_subtotal_cents + shipping_cents; the amount authorized at close; see calculations.pledge_total" }
      - { name: payment_status, type: enum, source: system, description: "Payment axis (parallel)", default: PENDING_AUTH, constraints: "PENDING_AUTH | AUTHORIZED | CAPTURED | AUTH_DECLINED | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment axis (parallel), independent of payment_status", default: NOT_STARTED, constraints: "NOT_STARTED | SURVEY_SENT | SURVEY_COMPLETE | SHIPPED" }
      - { name: status, type: enum, source: system, description: "Pledge lifecycle relative to backer intent", default: ACTIVE, constraints: "ACTIVE | CANCELED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; chronological tie-break key for settlement order" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: PledgeAddOn
    parent: Pledge
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; owning pledge" }
      - { name: addon_id, type: string, source: input, description: "FK -> AddOn.id; selected add-on" }
      - { name: quantity, type: integer, source: input, description: "Units of this add-on on the pledge; must be > 0" }
      - { name: line_total_cents, type: integer, source: computed, description: "quantity * addon.price_cents at attach time" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: PaymentAuthorization
    parent: Pledge
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; pledge being authorized" }
      - { name: outcome, type: enum, source: input, description: "Simulated processor outcome at close", constraints: "SUCCEEDED | DECLINED" }
      - { name: amount_cents, type: integer, source: system, description: "Snapshot of pledge.committed_amount_cents at authorization time" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; chronological replay key" }

  - name: Refund
    parent: Pledge
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; pledge being refunded" }
      - { name: reason, type: enum, source: system, description: "FAILED_CAMPAIGN | BACKER_CANCEL", constraints: "FAILED_CAMPAIGN | BACKER_CANCEL" }
      - { name: amount_cents, type: integer, source: system, description: "Amount returned; equals pledge.committed_amount_cents at refund time" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: FulfillmentSurvey
    parent: Pledge
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; pledge being surveyed" }
      - { name: shipping_address, type: string, source: input, description: "Backer-supplied shipping address; set on completion" }
      - { name: completed, type: boolean, source: computed, description: "True once backer submits the survey response", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    field: status
    initial_state: DRAFT
    terminal_states: [SUCCESSFUL, FAILED, CANCELED]
    note: "Branching fork at close: CLOSING forks to SUCCESSFUL or FAILED based on goal_met and funding_model, with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /campaigns/{campaign_id}/launch"
        actor: Creator
        preconditions:
          - "Acting Creator owns the campaign (X-User-ID == campaign.creator_id)"
          - "Campaign has at least one RewardTier with status == AVAILABLE (ERR_NO_TIERS)"
          - "campaign.deadline_utc is strictly after current clock (ERR_DEADLINE_IN_PAST)"
          - "No LIVE campaign of the same creator has a live window [launched_at, deadline_utc) that overlaps this campaign's prospective window [current_clock, deadline_utc) — half-open, touching endpoints allowed (ERR_CAMPAIGN_WINDOW_OVERLAP)"
        side_effects:
          - "Set launched_at = current clock"
          - "Initialize committed_amount_cents = 0"
          - "increments Campaign.version by 1"
        note: "Creator live-window overlap (resource=Creator): a creator may not run two campaigns whose live windows overlap. Half-open interval; an adjacent campaign whose launched_at == the other's deadline_utc is allowed."

      - from: LIVE
        to: CLOSING
        trigger: "POST /_clock/advance (clock reaches deadline) OR POST /campaigns/{campaign_id}/close"
        actor: system
        preconditions:
          - "current clock >= campaign.deadline_utc"
        side_effects:
          - "Compute settled_amount_cents over pledges with payment_status IN {PENDING_AUTH-resolved} — i.e. each ACTIVE pledge with payment_status PENDING_AUTH is authorized in created_at ASC order via its PaymentAuthorization outcome; SUCCEEDED -> AUTHORIZED, DECLINED -> AUTH_DECLINED"
          - "settled_amount_cents = sum of committed_amount_cents over pledges now AUTHORIZED (calculations.settled_raise)"
          - "Each AUTH_DECLINED pledge releases its tier and add-on inventory (cascade -> RewardTier.claimed_quantity, AddOn.claimed_quantity recompute; tier SOLD_OUT->AVAILABLE if it drops below limit)"
          - "goal_met = settled_amount_cents >= funding_goal_cents"
          - "increments Campaign.version by 1"
        note: "Authorization replay order is created_at ASC on Pledge; ties broken by created_at then never by id."

      - from: CLOSING
        to: SUCCESSFUL
        trigger: "system (campaign finalize, branch: funded)"
        actor: system
        preconditions:
          - "funding_model == FLEXIBLE, OR (funding_model == ALL_OR_NOTHING AND goal_met == true)"
        side_effects:
          - "All AUTHORIZED pledges transition payment_status AUTHORIZED->CAPTURED (cascade)"
          - "Each captured pledge fulfillment_status NOT_STARTED->SURVEY_SENT and a FulfillmentSurvey row is created (cascade)"
          - "Each captured pledge's Backer.lifetime_captured_cents and reliability_score recompute (cascade)"
          - "RETIRE all tiers (status -> RETIRED)"
          - "increments Campaign.version by 1"

      - from: CLOSING
        to: FAILED
        trigger: "system (campaign finalize, branch: not funded)"
        actor: system
        preconditions:
          - "funding_model == ALL_OR_NOTHING AND goal_met == false"
        side_effects:
          - "All AUTHORIZED pledges transition payment_status AUTHORIZED->REFUNDED and a Refund(reason=FAILED_CAMPAIGN, amount=committed_amount_cents) row is created (cascade)"
          - "Each refunded pledge releases tier and add-on inventory (cascade -> claimed_quantity recompute)"
          - "RETIRE all tiers (status -> RETIRED)"
          - "increments Campaign.version by 1"
        note: "Depth-3 cascade: finalize-failed -> pledge REFUNDED -> tier/add-on inventory release."

      - from: [DRAFT, LIVE]
        to: CANCELED
        trigger: "POST /campaigns/{campaign_id}/cancel"
        actor: Creator
        preconditions:
          - "Acting Creator owns the campaign"
          - "campaign.status IN {DRAFT, LIVE}"
        side_effects:
          - "All ACTIVE pledges with payment_status IN {PENDING_AUTH, AUTHORIZED} -> Refund(reason=FAILED_CAMPAIGN) if AUTHORIZED, else just void; pledge payment_status -> REFUNDED (if was AUTHORIZED) and pledge status -> CANCELED"
          - "Release all tier and add-on inventory (cascade)"
          - "RETIRE all tiers"
          - "increments Campaign.version by 1"

  - entity: Pledge
    field: payment_status
    initial_state: PENDING_AUTH
    terminal_states: [AUTH_DECLINED, REFUNDED]
    note: "Payment axis. Evolves independently of fulfillment_status (parallel dimensions on the same Pledge row)."
    transitions:
      - from: PENDING_AUTH
        to: AUTHORIZED
        trigger: "system (campaign close authorization replay; PaymentAuthorization.outcome == SUCCEEDED)"
        actor: system
        preconditions:
          - "Owning campaign.status == CLOSING"
          - "Pledge.status == ACTIVE"
        side_effects:
          - "Backer.lifetime_authorized_cents and reliability_score recompute (cascade)"
          - "Contributes committed_amount_cents to campaign.settled_amount_cents"

      - from: PENDING_AUTH
        to: AUTH_DECLINED
        trigger: "system (campaign close authorization replay; PaymentAuthorization.outcome == DECLINED)"
        actor: system
        preconditions:
          - "Owning campaign.status == CLOSING"
        side_effects:
          - "Release tier inventory: RewardTier.claimed_quantity recompute; if tier was SOLD_OUT and now below limit, tier SOLD_OUT->AVAILABLE (cascade)"
          - "Release add-on inventory: AddOn.claimed_quantity recompute (cascade)"
          - "Backer.declined_auth_count and reliability_score recompute (cascade)"

      - from: AUTHORIZED
        to: CAPTURED
        trigger: "system (campaign finalize SUCCESSFUL)"
        actor: system
        preconditions:
          - "Owning campaign.status transitions CLOSING->SUCCESSFUL"
        side_effects:
          - "Backer.lifetime_captured_cents and reliability_score recompute (cascade)"

      - from: AUTHORIZED
        to: REFUNDED
        trigger: "system (campaign finalize FAILED, or campaign cancel)"
        actor: system
        preconditions:
          - "Owning campaign.status transitions CLOSING->FAILED, or campaign canceled"
        side_effects:
          - "Create Refund(reason=FAILED_CAMPAIGN, amount=committed_amount_cents)"
          - "Release tier and add-on inventory (cascade -> claimed_quantity recompute)"

  - entity: Pledge
    field: fulfillment_status
    initial_state: NOT_STARTED
    terminal_states: [SHIPPED]
    note: "Fulfillment axis. Independent of payment_status; only advances after the pledge is CAPTURED (campaign SUCCESSFUL)."
    transitions:
      - from: NOT_STARTED
        to: SURVEY_SENT
        trigger: "system (campaign finalize SUCCESSFUL; survey created)"
        actor: system
        preconditions:
          - "Pledge.payment_status == CAPTURED"
        side_effects:
          - "Create FulfillmentSurvey(completed=false)"

      - from: SURVEY_SENT
        to: SURVEY_COMPLETE
        trigger: "POST /pledges/{pledge_id}/survey"
        actor: Backer
        preconditions:
          - "Acting Backer owns the pledge (X-User-ID == pledge.backer_id)"
          - "Pledge.payment_status == CAPTURED"
          - "FulfillmentSurvey for the pledge exists and completed == false"
        side_effects:
          - "Set FulfillmentSurvey.shipping_address, completed = true"

      - from: SURVEY_COMPLETE
        to: SHIPPED
        trigger: "POST /pledges/{pledge_id}/ship"
        actor: Creator
        preconditions:
          - "Acting Creator owns the owning campaign"
          - "Pledge.fulfillment_status == SURVEY_COMPLETE"
        side_effects:
          - "Mark shipped (terminal on fulfillment axis)"

  - entity: RewardTier
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Cyclic: AVAILABLE<->SOLD_OUT loops as pledges claim and release inventory while campaign LIVE."
    transitions:
      - from: AVAILABLE
        to: SOLD_OUT
        trigger: "system (pledge create or add-on attach drives claimed_quantity to limit_quantity)"
        actor: system
        preconditions:
          - "limit_quantity is not null AND claimed_quantity == limit_quantity after the claiming pledge"
        side_effects:
          - "Block further pledges referencing this tier (ERR_TIER_SOLD_OUT)"

      - from: SOLD_OUT
        to: AVAILABLE
        trigger: "system (pledge cancel, or AUTH_DECLINED at close releases a claimed unit)"
        actor: system
        preconditions:
          - "claimed_quantity < limit_quantity after the release"
        side_effects:
          - "Tier accepts new pledges again"

      - from: [AVAILABLE, SOLD_OUT]
        to: RETIRED
        trigger: "system (owning campaign reaches SUCCESSFUL, FAILED, or CANCELED)"
        actor: system
        preconditions:
          - "Owning campaign.status IN {SUCCESSFUL, FAILED, CANCELED}"
        side_effects:
          - "Tier locked; no further pledges"

  - entity: StretchGoal
    field: unlocked
    initial_state: LOCKED
    terminal_states: []
    note: "Compound/derived boolean, cyclic: tracks campaign.committed_amount_cents while LIVE; can lock and unlock as projected raise crosses threshold_cents in either direction."
    transitions:
      - from: LOCKED
        to: UNLOCKED
        trigger: "system (campaign.committed_amount_cents crosses >= threshold_cents on pledge create while LIVE)"
        actor: system
        preconditions:
          - "campaign.status == LIVE"
          - "campaign.committed_amount_cents >= threshold_cents"
        side_effects:
          - "unlocked = true"

      - from: UNLOCKED
        to: LOCKED
        trigger: "system (campaign.committed_amount_cents drops below threshold_cents on pledge cancel while LIVE)"
        actor: system
        preconditions:
          - "campaign.status == LIVE"
          - "campaign.committed_amount_cents < threshold_cents"
        side_effects:
          - "unlocked = false"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version only)
# =============================================================================
concurrency_rules:
  - rule_id: pledge-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /campaigns/{campaign_id}/pledges"
    occ_field: "expected_campaign_version"
    description: |
      Creating a Pledge against a Campaign whose version has advanced since the
      client last observed it is rejected. A prior pledge create (or a stretch-goal
      unlock cascade, or an inventory recompute) legitimately advances the
      campaign's version; a create that still carries the older version is
      operating on a stale view of remaining tier inventory and projected raise,
      so it is rejected as a stale-version write.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pledge_total
    trigger: "POST /campaigns/{campaign_id}/pledges and POST /pledges/{pledge_id}/add-ons (recompute on each line change)"
    algorithm: aggregation
    formula: |
      # ----- items subtotal (mode-a combinatorial: >=3 inputs, conditional branches) -----
      items_subtotal_cents = pledge_amount_cents
                           + sum(line.quantity * addon.price_cents for each PledgeAddOn line)
      # ----- shipping component (tiered by zone, weight, and per-line rounding) -----
      total_weight_grams = tier.weight_grams
                         + sum(line.quantity * addon.weight_grams for each PledgeAddOn line)
      # zone base + per-kg surcharge, rounding UP to whole kg per the weight ladder:
      billable_kg = ceil(total_weight_grams / 1000)        # ceil to whole kg
      if destination_zone == DOMESTIC:
          shipping_cents = DOMESTIC_BASE_CENTS + billable_kg * DOMESTIC_PER_KG_CENTS
      else: # INTL
          shipping_cents = INTL_BASE_CENTS + billable_kg * INTL_PER_KG_CENTS
      shipping_cents = min(shipping_cents, SHIPPING_CAP_CENTS)   # capped
      committed_amount_cents = items_subtotal_cents + shipping_cents
    input_set: "The pledge's own tier (RewardTier) and its attached PledgeAddOn lines (each joined to its AddOn for price/weight)."
    constants:
      DOMESTIC_BASE_CENTS: 500
      DOMESTIC_PER_KG_CENTS: 150
      INTL_BASE_CENTS: 1500
      INTL_PER_KG_CENTS: 400
      SHIPPING_CAP_CENTS: 5000
    precision: "Integer cents throughout; billable_kg uses ceil(total_weight_grams/1000); shipping capped via min."
    note: "Mode (a) combinatorial: >=3 inputs (pledge_amount, add-on lines, weight, zone), nested min for cap, conditional zone branch."

  - name: platform_fee
    trigger: "system (campaign finalize SUCCESSFUL) and computed-read GET /campaigns/{campaign_id}/settlement"
    algorithm: tiered_pricing
    formula: |
      # ----- mode-b nested rounding: round per-pledge fee, THEN sum (pinned order) -----
      # Per-captured-pledge fee = pledge.committed_amount_cents * FEE_RATE, rounded HALF_UP to whole cents,
      # then summed. (round-per-line-then-sum, NOT sum-then-round.)
      per_pledge_fee_cents(p) = round_half_up(p.committed_amount_cents * FEE_RATE)
      platform_fee_cents = sum(per_pledge_fee_cents(p) for p in captured pledges)
      creator_payout_cents = settled_amount_cents - platform_fee_cents
    input_set: "Pledges with payment_status == CAPTURED on the campaign (i.e. campaign SUCCESSFUL)."
    constants:
      FEE_RATE: 0.05
    precision: "round_half_up to whole cents PER pledge, THEN sum; do not sum-then-round."
    note: "Mode (b) combinatorial: per-line rounding order is pinned and observably differs from sum-then-round."

  - name: projected_raise
    trigger: "POST /campaigns/{campaign_id}/pledges, POST /pledges/{pledge_id}/cancel (recompute while LIVE)"
    algorithm: forward_looking
    formula: |
      committed_amount_cents = sum(p.committed_amount_cents
                                   for p in pledges
                                   where p.status == ACTIVE
                                     and p.payment_status IN {PENDING_AUTH, AUTHORIZED, CAPTURED})
    input_set: "ACTIVE pledges still authorizable: payment_status NOT in {AUTH_DECLINED, REFUNDED}."
    precision: "Integer cents."
    variants:
      - name: projected_while_live
        when: "campaign.status == LIVE"
        difference: "Includes optimistic PENDING_AUTH pledges that have not yet been processed; forward-looking."
      - name: settled_after_close
        when: "campaign.status IN {CLOSING, SUCCESSFUL, FAILED}"
        difference: "Excludes pledges whose authorization DECLINED; see calculations.settled_raise. For identical pledge sets the two variants differ whenever any auth declines."

  - name: settled_raise
    trigger: "system (campaign LIVE->CLOSING finalize)"
    algorithm: chronological
    formula: |
      # Replay each ACTIVE PENDING_AUTH pledge in created_at ASC order; apply its
      # PaymentAuthorization outcome; accumulate only SUCCEEDED.
      settled_amount_cents = 0
      for p in sorted(active_pending_pledges, key=created_at ASC):
          auth = p.payment_authorization
          if auth.outcome == SUCCEEDED:
              p.payment_status = AUTHORIZED
              settled_amount_cents += p.committed_amount_cents
          else:
              p.payment_status = AUTH_DECLINED  # releases inventory
      # AUTHORIZED/CAPTURED pledges that pre-existed also count.
    input_set: "ACTIVE pledges on the campaign; processed in created_at ASC (tie-break created_at, never id)."
    precision: "Integer cents."
    note: "Differs from projected_raise.projected_while_live by the sum of all DECLINED pledges' committed_amount_cents (dual-variant on Campaign)."

  - name: backer_reliability_score
    trigger: "system (pledge payment_status change cascade: AUTHORIZED, AUTH_DECLINED, CAPTURED, REFUNDED)"
    algorithm: weighted_scoring
    formula: |
      total = count of this backer's pledges with payment_status IN {AUTHORIZED, CAPTURED, AUTH_DECLINED}
      if total == 0:
          reliability_score = 100.0
      else:
          good = count with payment_status IN {AUTHORIZED, CAPTURED}
          reliability_score = round_half_up( (good / total) * 100, 1 )   # 1 decimal place
    input_set: "All pledges by this backer that reached an authorization decision (excludes still-PENDING_AUTH and REFUNDED-by-failed-campaign which do not penalize the backer)."
    constants:
      BASE_SCORE: 100.0
    precision: "round_half_up to 1 decimal place."
    variants:
      - name: provisional_reliability
        when: "the backer's pledges are still PENDING_AUTH (no authorization decision reached yet)"
        difference: "total == 0 so reliability_score = 100.0 (provisional): a not-yet-decided pledge does not penalize the backer."
      - name: final_reliability
        when: "the backer's pledges have been decided at close (AUTHORIZED/CAPTURED/AUTH_DECLINED)"
        difference: "reliability_score = round_half_up(good/total*100, 1); for one DECLINED pledge this is 0.0, diverging from the provisional 100.0 on the SAME pledge. Dual-variant (provisional vs final) on Backer.reliability_score."

  - name: backer_lifetime_contribution
    trigger: "system (pledge payment_status change cascade: AUTHORIZED, CAPTURED)"
    algorithm: aggregation
    formula: |
      lifetime_authorized_cents = sum(p.committed_amount_cents for p in this backer's pledges
                                      where p.payment_status IN {AUTHORIZED, CAPTURED})   # optimistic
      lifetime_captured_cents   = sum(p.committed_amount_cents for p in this backer's pledges
                                      where p.payment_status == CAPTURED)                  # realized
    input_set: "This backer's pledges that reached AUTHORIZED or CAPTURED."
    precision: "Integer cents."
    note: "Two denormalized lifetime fields on Backer with different inclusion filters (optimistic {AUTHORIZED,CAPTURED} vs realized {CAPTURED})."

  - name: tier_claimed_quantity
    trigger: "POST /campaigns/{campaign_id}/pledges, POST /pledges/{pledge_id}/cancel, and close-time AUTH_DECLINED release"
    algorithm: aggregation
    formula: |
      claimed_quantity = count of pledges p where p.tier_id == tier.id
                           and p.status == ACTIVE
                           and p.payment_status != AUTH_DECLINED
                           and p.payment_status != REFUNDED
      status = SOLD_OUT if (limit_quantity is not null and claimed_quantity >= limit_quantity)
               else AVAILABLE   # unless RETIRED by campaign terminal state
    input_set: "ACTIVE, non-released pledges on the tier."
    precision: "Integer count."
    note: "Boundary: SOLD_OUT iff claimed_quantity >= limit_quantity (>= not >)."

  - name: addon_claimed_quantity
    trigger: "POST /pledges/{pledge_id}/add-ons, POST /pledges/{pledge_id}/cancel, and close-time release"
    algorithm: aggregation
    formula: |
      claimed_quantity = sum(la.quantity for la in PledgeAddOn la
                             where la.addon_id == addon.id
                               and la.pledge.status == ACTIVE
                               and la.pledge.payment_status NOT IN {AUTH_DECLINED, REFUNDED})
    input_set: "PledgeAddOn lines on non-released pledges."
    precision: "Integer count."
    note: "Boundary: attach rejected (ERR_ADDON_SOLD_OUT) iff claimed_quantity + requested_quantity > limit_quantity."

  - name: stretch_goal_unlock
    trigger: "system (projected_raise recompute on pledge create/cancel while LIVE; settled_raise at close)"
    algorithm: threshold
    formula: |
      basis = campaign.committed_amount_cents if campaign.status == LIVE
              else campaign.settled_amount_cents
      unlocked = (basis >= threshold_cents)
    input_set: "The campaign's projected raise while LIVE, settled raise once closed."
    precision: "Integer cents comparison."
    note: "Boundary: unlocked iff basis >= threshold_cents (>= not >)."

  - name: campaign_window_overlap
    trigger: "POST /campaigns/{campaign_id}/launch"
    algorithm: interval_merge
    formula: |
      # Half-open live window [start, end). Two windows A=[a0,a1), B=[b0,b1) overlap iff a0 < b1 AND b0 < a1.
      # Touching endpoints (a1 == b0 or b1 == a0) do NOT overlap.
      new_window = [current_clock, this_campaign.deadline_utc)
      reject (ERR_CAMPAIGN_WINDOW_OVERLAP) if any other campaign C of the same creator with C.status == LIVE has
        (current_clock < C.deadline_utc) AND (C.launched_at < this_campaign.deadline_utc)
    input_set: "Same-creator campaigns with status == LIVE."
    constants: {}
    precision: "Datetime comparison; half-open, strict inequalities."
    note: "Resource = Creator. Interval semantics: half-open, adjacency (touching) allowed."

  - name: tier_window_overlap
    trigger: "POST /campaigns/{campaign_id}/tiers"
    algorithm: interval_merge
    formula: |
      # Early-bird windows require a buffer gap of TIER_GAP_SECONDS between them.
      # New window N=[n0,n1). Existing early-bird tier window E=[e0,e1) on same campaign.
      # Reject (ERR_TIER_WINDOW_OVERLAP) if the gap between N and E is less than TIER_GAP_SECONDS:
      #   NOT ( n0 >= e1 + TIER_GAP_SECONDS  OR  e0 >= n1 + TIER_GAP_SECONDS )
      # i.e. windows must be separated by at least TIER_GAP_SECONDS; mere adjacency (gap 0) is INSUFFICIENT.
      reject if exists early-bird tier E on this campaign with
        (n0 < e1 + TIER_GAP_SECONDS) AND (e0 < n1 + TIER_GAP_SECONDS)
    input_set: "Existing is_early_bird tiers on the same campaign."
    constants:
      TIER_GAP_SECONDS: 3600
    precision: "Datetime comparison with TIER_GAP_SECONDS buffer; gap-based, adjacency rejected."
    note: "Resource = RewardTier. Interval semantics differ from campaign_window_overlap: a mandatory buffer gap, so touching/adjacent windows are rejected (unlike the campaign rule)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is authorized for this operation per §1.7"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_referential
    check: "Body foreign keys resolve to existing resources owned by the right parent (tier_id, addon_id, backer_id belong to the campaign / are valid)"
    error_id: ERR_FK_INVALID
    http_status: 422
    applies_to: "POST /campaigns/{campaign_id}/pledges, POST /pledges/{pledge_id}/add-ons"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-formed (enum membership, integers > 0 where required)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all POST/PUT

  - priority: 6
    category: business_referential
    check: "Acting entity_backed user owns the target resource (Creator owns campaign; Backer owns pledge)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "launch, cancel, ship, survey, ownership-scoped mutations"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for this transition (campaign status, pledge payment_status/fulfillment_status, tier status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 8
    category: business_temporal
    check: "Pledges/add-ons only while campaign LIVE and clock < deadline_utc; launch deadline must be in the future"
    error_id: ERR_CAMPAIGN_NOT_LIVE
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/pledges, POST /pledges/{pledge_id}/add-ons"

  - priority: 9
    category: business_constraint
    check: "Pledge amount >= tier.price_cents"
    error_id: ERR_PLEDGE_BELOW_TIER_MIN
    http_status: 422
    applies_to: "POST /campaigns/{campaign_id}/pledges"

  - priority: 10
    category: business_constraint
    check: "Currency consistency: pledge currency derives from campaign.currency; cross-currency add-ons rejected (add-on belongs to same campaign)"
    error_id: ERR_CURRENCY_MISMATCH
    http_status: 422
    applies_to: "POST /pledges/{pledge_id}/add-ons"

  - priority: 11
    category: business_constraint
    check: "Tier has inventory: tier.status == AVAILABLE and (limit_quantity null or claimed_quantity < limit_quantity)"
    error_id: ERR_TIER_SOLD_OUT
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/pledges"

  - priority: 12
    category: business_constraint
    check: "Add-on has inventory: claimed_quantity + requested_quantity <= limit_quantity (when limit not null)"
    error_id: ERR_ADDON_SOLD_OUT
    http_status: 409
    applies_to: "POST /pledges/{pledge_id}/add-ons"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_campaign_version matches campaign.version"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /campaigns/{campaign_id}/pledges"

  - priority: 14
    category: business_temporal
    check: "Campaign live-window overlap (resource=Creator): launching a campaign whose prospective live window [current_clock, deadline_utc) overlaps any LIVE campaign of the same creator (half-open; touching endpoints allowed) is rejected"
    error_id: ERR_CAMPAIGN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/launch"

  - priority: 15
    category: business_temporal
    check: "Tier early-bird-window overlap (resource=RewardTier): creating an early-bird tier whose window [available_from, available_until) comes within TIER_GAP_SECONDS of an existing early-bird tier's window on the same campaign is rejected (buffer-based, gap required between windows)"
    error_id: ERR_TIER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/tiers"

  - priority: 16
    category: state
    check: "close/advance settlement requires current clock >= campaign.deadline_utc"
    error_id: ERR_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/close"

  - priority: 17
    category: state
    check: "Survey submission requires pledge.payment_status == CAPTURED and an existing FulfillmentSurvey with completed == false"
    error_id: ERR_SURVEY_NOT_READY
    http_status: 409
    applies_to: "POST /pledges/{pledge_id}/survey"

  - priority: 18
    category: business_constraint
    check: "Pagination bounds: limit in [1,100], offset >= 0"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Creator ----
  - method: POST
    path: "/creators"
    description: "Register a creator"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, payout_currency]
    output: Creator
    side_effects: ["version=1"]

  - method: GET
    path: "/creators/{creator_id}"
    description: "Read creator"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: Creator
    side_effects: []

  # ---- Backer ----
  - method: POST
    path: "/backers"
    description: "Register a backer"
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: Backer
    side_effects: ["version=1"]

  - method: GET
    path: "/backers/{backer_id}"
    description: "Read backer (includes reliability_score, lifetime contributions)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: Backer
    side_effects: []

  # ---- Campaign ----
  - method: POST
    path: "/campaigns"
    description: "Create a campaign in DRAFT"
    roles: [Creator]
    code: 201
    input: [creator_id, title, funding_goal_cents, funding_model, deadline_utc]
    output: Campaign
    side_effects: ["status=DRAFT", "currency copied from Creator.payout_currency", "version=1"]

  - method: GET
    path: "/campaigns"
    description: "List campaigns; filterable by creator_id (FK reverse-reachability for Campaign.creator_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["creator_id?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: GET
    path: "/campaigns/{campaign_id}"
    description: "Read campaign (includes committed_amount_cents, settled_amount_cents, goal_met, status)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/campaigns/{campaign_id}/launch"
    description: "Launch campaign DRAFT->LIVE"
    roles: [Creator]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status->LIVE", "launched_at set", "committed_amount_cents=0", "increments Campaign.version by 1"]

  - method: POST
    path: "/campaigns/{campaign_id}/close"
    description: "Force-close a LIVE campaign now (clock>=deadline required); runs LIVE->CLOSING->{SUCCESSFUL|FAILED}"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status->CLOSING then SUCCESSFUL or FAILED", "settlement cascade (auth replay, captures or refunds, inventory release, tier RETIRED)", "increments Campaign.version by 1"]

  - method: POST
    path: "/campaigns/{campaign_id}/cancel"
    description: "Cancel a DRAFT or LIVE campaign"
    roles: [Creator]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status->CANCELED", "refund AUTHORIZED pledges, void others", "release/retire inventory", "increments Campaign.version by 1"]

  - method: GET
    path: "/campaigns/{campaign_id}/settlement"
    description: "Computed read: settled_amount_cents, platform_fee_cents, creator_payout_cents (only meaningful once SUCCESSFUL)"
    roles: [PlatformAdmin, Creator]
    code: 200
    input: []
    output: { settled_amount_cents: integer, platform_fee_cents: integer, creator_payout_cents: integer, captured_pledge_count: integer }
    side_effects: []

  # ---- RewardTier ----
  - method: POST
    path: "/campaigns/{campaign_id}/tiers"
    description: "Create a reward tier (only while campaign DRAFT). Early-bird tiers carry a half-open availability window; a new early-bird window within TIER_GAP_SECONDS of an existing early-bird tier's window is rejected (ERR_TIER_WINDOW_OVERLAP)."
    roles: [Creator]
    code: 201
    input: [title, price_cents, "limit_quantity?", weight_grams, "is_early_bird?", "available_from?", "available_until?"]
    output: RewardTier
    side_effects: ["status=AVAILABLE", "claimed_quantity=0", "version=1"]

  - method: GET
    path: "/tiers"
    description: "List reward tiers; filterable by campaign_id (FK reverse-reachability for RewardTier.campaign_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["campaign_id?", "limit?", "offset?"]
    output: RewardTier[]
    side_effects: []

  - method: GET
    path: "/tiers/{tier_id}"
    description: "Read a tier (includes claimed_quantity, status)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: RewardTier
    side_effects: []

  # ---- StretchGoal ----
  - method: POST
    path: "/campaigns/{campaign_id}/stretch-goals"
    description: "Create a stretch goal (only while campaign DRAFT)"
    roles: [Creator]
    code: 201
    input: [title, threshold_cents]
    output: StretchGoal
    side_effects: ["unlocked=false", "version=1"]

  - method: GET
    path: "/stretch-goals"
    description: "List stretch goals; filterable by campaign_id (FK reverse-reachability for StretchGoal.campaign_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["campaign_id?", "limit?", "offset?"]
    output: StretchGoal[]
    side_effects: []

  - method: GET
    path: "/stretch-goals/{stretch_goal_id}"
    description: "Read a stretch goal (includes unlocked)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: StretchGoal
    side_effects: []

  # ---- AddOn ----
  - method: POST
    path: "/campaigns/{campaign_id}/add-on-products"
    description: "Create a campaign add-on product (only while campaign DRAFT or LIVE)"
    roles: [Creator]
    code: 201
    input: [title, price_cents, "limit_quantity?", weight_grams]
    output: AddOn
    side_effects: ["claimed_quantity=0", "version=1"]

  - method: GET
    path: "/add-on-products"
    description: "List add-on products; filterable by campaign_id (FK reverse-reachability for AddOn.campaign_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["campaign_id?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: GET
    path: "/add-on-products/{addon_id}"
    description: "Read an add-on product (includes claimed_quantity)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # ---- Pledge ----
  - method: POST
    path: "/campaigns/{campaign_id}/pledges"
    description: "Create a pledge against a LIVE campaign (OCC on campaign.version)"
    roles: [Backer]
    code: 201
    input: [backer_id, tier_id, pledge_amount_cents, destination_zone, expected_campaign_version]
    output: Pledge
    side_effects:
      - "status=ACTIVE, payment_status=PENDING_AUTH, fulfillment_status=NOT_STARTED"
      - "Compute items_subtotal_cents, shipping_cents, committed_amount_cents (calculations.pledge_total)"
      - "RewardTier.claimed_quantity recompute; tier may flip AVAILABLE->SOLD_OUT"
      - "campaign.committed_amount_cents recompute (calculations.projected_raise); stretch goals may unlock"
      - "increments Campaign.version by 1"

  - method: GET
    path: "/pledges"
    description: "List pledges; filterable by campaign_id, backer_id, tier_id (FK reverse-reachability for Pledge.campaign_id, Pledge.backer_id, Pledge.tier_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["campaign_id?", "backer_id?", "tier_id?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []

  - method: GET
    path: "/pledges/{pledge_id}"
    description: "Read a pledge (includes payment_status, fulfillment_status, committed_amount_cents)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: Pledge
    side_effects: []

  - method: POST
    path: "/pledges/{pledge_id}/add-ons"
    description: "Attach an add-on line to a pledge (only while campaign LIVE)"
    roles: [Backer]
    code: 201
    input: [addon_id, quantity]
    output: PledgeAddOn
    side_effects:
      - "Compute line_total_cents = quantity * addon.price_cents"
      - "Recompute pledge items_subtotal_cents/shipping_cents/committed_amount_cents (calculations.pledge_total)"
      - "AddOn.claimed_quantity recompute; campaign.committed_amount_cents recompute"

  - method: POST
    path: "/pledges/{pledge_id}/cancel"
    description: "Backer cancels their own pledge while campaign LIVE"
    roles: [Backer]
    code: 200
    input: []
    output: Pledge
    side_effects:
      - "pledge status->CANCELED"
      - "Release tier and add-on inventory (claimed_quantity recompute; tier SOLD_OUT->AVAILABLE if below limit)"
      - "campaign.committed_amount_cents recompute; stretch goals may re-lock"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/pledges/{pledge_id}/survey"
    description: "Backer completes the fulfillment/shipping survey (SURVEY_SENT->SURVEY_COMPLETE)"
    roles: [Backer]
    code: 200
    input: [shipping_address]
    output: Pledge
    side_effects: ["FulfillmentSurvey.completed=true, shipping_address set", "fulfillment_status->SURVEY_COMPLETE"]

  - method: POST
    path: "/pledges/{pledge_id}/ship"
    description: "Creator marks a surveyed pledge shipped (SURVEY_COMPLETE->SHIPPED)"
    roles: [Creator]
    code: 200
    input: []
    output: Pledge
    side_effects: ["fulfillment_status->SHIPPED"]

  # ---- PledgeAddOn (junction line) ----
  - method: GET
    path: "/pledge-add-ons"
    description: "List pledge add-on lines; filterable by pledge_id, addon_id (FK reverse-reachability for PledgeAddOn.pledge_id and PledgeAddOn.addon_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["pledge_id?", "addon_id?", "limit?", "offset?"]
    output: PledgeAddOn[]
    side_effects: []

  - method: GET
    path: "/pledge-add-ons/{pledge_addon_id}"
    description: "Read a single pledge add-on line"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: PledgeAddOn
    side_effects: []

  # ---- PaymentAuthorization (event) ----
  - method: POST
    path: "/pledges/{pledge_id}/authorization"
    description: "Record the simulated processor outcome to be applied at close (queued PaymentAuthorization)"
    roles: [PlatformAdmin]
    code: 201
    input: [outcome]
    output: PaymentAuthorization
    side_effects: ["Stores PaymentAuthorization.outcome and amount snapshot; consumed at campaign close"]

  - method: GET
    path: "/authorizations"
    description: "List payment authorizations; filterable by pledge_id (FK reverse-reachability for PaymentAuthorization.pledge_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["pledge_id?", "limit?", "offset?"]
    output: PaymentAuthorization[]
    side_effects: []

  - method: GET
    path: "/authorizations/{authorization_id}"
    description: "Read a single payment authorization"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: PaymentAuthorization
    side_effects: []

  # ---- Refund (event) ----
  - method: GET
    path: "/refunds"
    description: "List refunds; filterable by pledge_id (FK reverse-reachability for Refund.pledge_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["pledge_id?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  - method: GET
    path: "/refunds/{refund_id}"
    description: "Read a single refund"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: Refund
    side_effects: []

  # ---- FulfillmentSurvey ----
  - method: GET
    path: "/surveys"
    description: "List fulfillment surveys; filterable by pledge_id (FK reverse-reachability for FulfillmentSurvey.pledge_id)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: ["pledge_id?", "limit?", "offset?"]
    output: FulfillmentSurvey[]
    side_effects: []

  - method: GET
    path: "/surveys/{survey_id}"
    description: "Read a single fulfillment survey (includes completed, shipping_address)"
    roles: [PlatformAdmin, Creator, Backer]
    code: 200
    input: []
    output: FulfillmentSurvey
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [now_utc]
    output: null
    side_effects: ["Server clock set to now_utc; does NOT auto-close campaigns"]

  - method: POST
    path: "/_clock/advance"
    description: "Advance clock to a timestamp and auto-close any LIVE campaign whose deadline_utc <= clock (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [now_utc]
    output: null
    side_effects: ["Any LIVE campaign with deadline_utc <= now_utc runs LIVE->CLOSING->{SUCCESSFUL|FAILED} settlement cascade"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role or X-User-ID header absent" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Role not authorized for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting entity_backed user is not the owner of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed body field, bad enum, non-positive integer where >0 required" }
  - { id: ERR_FK_INVALID, http: 422, condition: "Body foreign key does not resolve or does not belong to the expected parent (tier/add-on not in campaign, backer missing)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_NO_TIERS, http: 409, condition: "Launch attempted on a campaign with no AVAILABLE reward tier" }
  - { id: ERR_DEADLINE_IN_PAST, http: 422, condition: "Launch attempted with deadline_utc <= current clock" }
  - { id: ERR_CAMPAIGN_NOT_LIVE, http: 409, condition: "Pledge or add-on attach attempted when campaign not LIVE or clock past deadline" }
  - { id: ERR_PLEDGE_BELOW_TIER_MIN, http: 422, condition: "pledge_amount_cents < tier.price_cents" }
  - { id: ERR_CURRENCY_MISMATCH, http: 422, condition: "Add-on does not belong to the pledge's campaign (cross-currency/cross-campaign)" }
  - { id: ERR_TIER_SOLD_OUT, http: 409, condition: "Tier status SOLD_OUT or claimed_quantity >= limit_quantity" }
  - { id: ERR_ADDON_SOLD_OUT, http: 409, condition: "claimed_quantity + requested_quantity > add-on limit_quantity" }
  - { id: ERR_STALE_CAMPAIGN_VERSION, http: 412, condition: "expected_campaign_version != campaign.version on pledge create" }
  - { id: ERR_NOT_CLOSABLE, http: 409, condition: "close/advance requires clock >= deadline_utc; campaign not yet at deadline" }
  - { id: ERR_SURVEY_NOT_READY, http: 409, condition: "Survey submitted before pledge CAPTURED / survey already completed" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Launch would create a live window overlapping another LIVE campaign of the same creator (half-open interval)" }
  - { id: ERR_TIER_WINDOW_OVERLAP, http: 409, condition: "Early-bird tier window within TIER_GAP_SECONDS of an existing early-bird tier on the same campaign (buffer-based gap required)" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset out of bounds (limit 1..100, offset >=0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates registration, settlement, authorization queueing, and the clock; not tied to a persisted business entity"
    identity: "opaque"
    exclusive_operations:
      - "POST /creators — register creator"
      - "POST /backers — register backer"
      - "POST /campaigns/{id}/close — force settlement"
      - "POST /pledges/{id}/authorization — queue auth outcome"
      - "POST /_clock/set — set clock"
      - "POST /_clock/advance — advance clock + auto-close"
    shared_operations:
      - "GET reads across creators, backers, campaigns, tiers, add-ons, pledges, settlement"

  - name: Creator
    description: "Campaign owner; manages campaigns, tiers, stretch goals, add-on products, shipping"
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /campaigns — create campaign"
      - "POST /campaigns/{id}/launch — launch"
      - "POST /campaigns/{id}/cancel — cancel"
      - "POST /campaigns/{id}/tiers — create tier"
      - "POST /campaigns/{id}/stretch-goals — create stretch goal"
      - "POST /campaigns/{id}/add-on-products — create add-on product"
      - "POST /pledges/{id}/ship — mark shipped"
    shared_operations:
      - "GET reads of own campaigns, tiers, add-ons, pledges, settlement"

  - name: Backer
    description: "Pledging user; creates and cancels pledges, attaches add-ons, completes surveys"
    identity: "entity_backed:Backer"
    exclusive_operations:
      - "POST /campaigns/{id}/pledges — create pledge"
      - "POST /pledges/{id}/add-ons — attach add-on"
      - "POST /pledges/{id}/cancel — cancel own pledge"
      - "POST /pledges/{id}/survey — complete fulfillment survey"
    shared_operations:
      - "GET reads of campaigns, tiers, add-ons, own pledges"
