            - "trigger[2] succeeds: HTTP 201, data.status == REQUESTED (transaction now ESCROW_FUNDED)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_buffer_rejects_adjacent_slot
        grounds:
          - validations[priority=7]
          - errors[ERR_FACILITY_SLOT_CONFLICT]
          - entities.InspectionFacility.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          Buffer-expanded interval semantics on the InspectionFacility
          resource: an adjacent booking (gap 0 minutes) at the same facility
          is REJECTED because the facility turnaround buffer is 120; a booking
          starting exactly 120 minutes after the prior end (gap == buffer, >=)
          is ACCEPTED — adjacency is not allowed here, unlike the aircraft rule.
        test_recipe:
          setup:
            - "Two independent deals (two listings), both ESCROW_FUNDED; one facility with turnaround_buffer_minutes 120; booking B1 for deal 1 at 10:00-14:00 REQUESTED"
          setup_api_calls:
