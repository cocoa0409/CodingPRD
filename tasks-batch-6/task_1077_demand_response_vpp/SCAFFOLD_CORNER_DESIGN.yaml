  - section: cross_cutting_complexity_layers
    instances:
      - name: patch_program_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-config-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second PATCH carrying the original expected_program_version (now stale after the first PATCH bumped Program.version) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A program created at version 1; one PATCH already applied bumping it to version 2."]
          setup_api_calls:
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id, v0: $.data.version }
            - call: "PATCH /dr/programs/${prog_id}"
              payload: { expected_program_version: "${v0}", incentive_rate_cents_per_kwh: 55 }
              as: ProgramOperator
          trigger:
            - call: "PATCH /dr/programs/${prog_id}"
              payload: { expected_program_version: "${v0}", incentive_rate_cents_per_kwh: 60 }
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "Second PATCH returns 412 error_id == ERR_STALE_VERSION"

