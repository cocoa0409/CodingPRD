            - "hop 0: AssetClassSlot.${slot_lg_id}.status AT_RISK -> RETIRED with current_fund_id still == ${fund_lg_id} (retained for audit)"
            - "hop 1 (caused by hop 0): Fund.${fund_lg_id}.menu_status ACTIVE -> PENDING_REMOVAL"
            - "hop 1: Fund.${fund_lg_id}.watch_status == WATCH and consecutive_breach_quarters == 1 — unchanged, because retiring a slot touches only the menu dimension"
            - "hop 1: Fund.${fund_lg_id}.credit_accrual_status == ACCRUING (a PENDING_REMOVAL fund keeps accruing; only REMOVED closes it out)"
            - "hop 2 (caused by hop 1): Plan.${plan_id}.occupied_menu_slots == 1 and Plan.${plan_id}.available_menu_slots == 7, so occupied + reserved + available == 1 + 0 + 7 == 8 == menu_slot_capacity"
