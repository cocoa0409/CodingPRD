              payload: { employer_id: "${er_id}", category_type: "PARKING", monthly_exclusion_limit_cents: 30000 }
              as: PayrollProcessor
              as_user_id: "pay-deny"
              captures: { pay_category_error: $.data.error_id }
            - call: "POST /benefits/election-windows/${win_id}/lock"
