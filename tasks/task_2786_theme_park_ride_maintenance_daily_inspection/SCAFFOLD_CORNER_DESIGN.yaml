            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t1: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t1}/items"
              payload: { sequence_no: 1, description: "Walk the track", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-02" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t2: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t2}/items"
              payload: { sequence_no: 1, description: "Walk the track and the lift hill", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_v1: "$.data.version" }
          trigger:
            - call: "POST /park-ops/inspection-templates/${t1}/activate"
              payload: { expected_attraction_version: "${a_v1}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_v2: "$.data.version" }
            - call: "POST /park-ops/inspection-templates/${t2}/activate"
              payload: { expected_attraction_version: "${a_v2}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "InspectionTemplate.${t1}.revision == 1 and InspectionTemplate.${t2}.revision == 2"
            - "After trigger 1: InspectionTemplate.${t1}.status == \"ACTIVE\" and activated_at == \"2026-08-01T00:00:00.000Z\"; Attraction.${a_id}.active_template_id == \"${t1}\"; ${a_v2} == 2"
            - "After trigger 3: InspectionTemplate.${t1}.status == \"SUPERSEDED\" and InspectionTemplate.${t2}.status == \"ACTIVE\""
            - "Attraction.${a_id}.active_template_id == \"${t2}\" and Attraction.${a_id}.version == 3"
            - "GET /park-ops/inspection-templates?attraction_id=${a_id}&status=ACTIVE returns total_count == 1"
            - "Attraction.${a_id}.operational_posture == \"CLOSED_PENDING_INSPECTION\" throughout (activation alone never opens a ride)"

      - name: invalid_from_state_triggers_are_rejected_with_the_owning_entity_state_error
        claim_type: invalid_transitions
        grounds:
          - "validations[priority 7]"
          - "errors[ERR_DOWNTIME_STATE_INVALID]"
          - "errors[ERR_REQUISITION_STATE_INVALID]"
          - "errors[ERR_INCIDENT_STATE_INVALID]"
          - "errors[ERR_TEMPLATE_STATE_INVALID]"
          - "errors[ERR_ACTION_STATE_INVALID]"
          - "errors[ERR_CERTIFICATION_STATE_INVALID]"
          - "errors[ERR_WORK_ORDER_STATE_INVALID]"
