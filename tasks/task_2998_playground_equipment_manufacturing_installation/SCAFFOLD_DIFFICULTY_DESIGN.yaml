  - rule_id: priority_pair_validation_conflict
    instances:
      - name: placement_validate_state_error_precedes_use_zone_overlap
        grounds:
          - validations[priority=42]
          - validations[priority=60]
          - errors.ERR_PROJECT_NOT_EDITABLE
          - errors.ERR_USE_ZONE_OVERLAP
          - state_machines.DesignProject.CONSULTATION_to_RENDERED
        distinguishing_aspect: |
          The SAME POST /playground/placements/{id}/validate call on the SAME placement returns
          ERR_USE_ZONE_OVERLAP (priority 60, business_constraint) while the project is in
          CONSULTATION and ERR_PROJECT_NOT_EDITABLE (priority 42, state) once a rendering has moved
          the project to RENDERED; the geometric violation never disappears, so a wrong ordering
          (checking geometry first) is caught by the second response, and a wrong ordering the
          other way is caught by the first.
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE; DECK-TDL-122 and CLIMB-MTL-122 CERTIFIED."
            - "DesignProject 'Ridgeway Park' in CONSULTATION with one TODDLER_6_23M area 0..2000 depth 30."
            - "Deck placement at x=700 (use zone 517..883) already VALIDATED."
            - "Unattached METAL_CLIMBER placement at x=900 (use zone 687..1113) still DRAFT - it overlaps the deck's zone on 687..883 and is NOT attached to it, so it cannot claim the attachment exemption."
