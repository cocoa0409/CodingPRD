  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lease_generate_supersede_cancel_conserves_committed_units
        grounds:
          - entities.Floorplan.fields.committed_units
          - state_machines.Lease.ISSUED_to_SUPERSEDED
          - state_machines.Lease.ISSUED_to_CANCELLED
          - concurrency_rules[lease-create-stale-application]
        distinguishing_aspect: |
          Conserved quantity: floorplan unit commitments. Forward/regenerate/cancel
          sequence keeps committed_units == count of leases in {ISSUED,
          SIGNED_BY_APPLICANT, EXECUTED} at every step: ISSUED L1 → 1; regenerate
          (L1 SUPERSEDED, L2 ISSUED) → still 1 (net zero); cancel L2 → 0 = baseline.
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 2 units (baseline committed_units 0)"
            - "Application APPROVED (version advanced by decide)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Conserve Court", code: "CV1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "CvA", email: "cva@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 2 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "V1", contact_email: "v1@x.com", source: "PHONE" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "V App", applicant_email: "v1@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v2: $.data.version }
          trigger:
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v2}" }
              as: PropertyManager
              captures: { l1_id: $.data.id }
            - call: "GET /leasing/floorplans/${f_id}"
              as: PropertyManager
              captures: { committed_mid: $.data.committed_units }
            - call: "GET /leasing/applications/${app_id}"
              as: PropertyManager
              captures: { app_v3: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v3}" }
              as: PropertyManager
              captures: { l2_id: $.data.id }
            - call: "GET /leasing/floorplans/${f_id}"
              as: PropertyManager
              captures: { committed_superseded: $.data.committed_units }
            - call: "POST /leasing/leases/${l2_id}/cancel"
              payload: {}
              as: PropertyManager
            - call: "GET /leasing/floorplans/${f_id}"
              as: PropertyManager
              captures: { committed_end: $.data.committed_units }
          assert:
            - "committed_mid == 1          # L1 ISSUED commits one unit"
            - "committed_superseded == 1   # supersede is net-zero: L1 leaves as L2 enters the committed set"
            - "Lease.${l1_id}.status == SUPERSEDED and superseded_by_id == ${l2_id}"
            - "committed_end == 0          # cancel restores the baseline — no drift in the conserved quantity"
            - "Application.${app_id}.status == APPROVED   # L2 was never executed, so no LEASED compensation needed"

      - name: waitlist_promote_decline_conserves_queue_cardinality
        grounds:
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_WAITING
          - calculations.waitlist_position_assignment
        distinguishing_aspect: |
          Conserved quantity: waitlist queue cardinality — a different conserved
          quantity than unit commitments. Promote (WAITING → OFFERED) paired with its
          compensating decline (OFFERED → WAITING) leaves count(status IN {WAITING,
          OFFERED}) unchanged at 3, and the declined entry requeues strictly behind
          every previously waiting entry (position 4 > 2, 3).
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 1 unit occupied by an EXECUTED lease"
            - "Waitlist entries E1 (pos 1), E2 (pos 2), E3 (pos 3); lease cancelled → E1 auto-promoted OFFERED"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Cardinal Court", code: "CD1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/agents"
              payload: { full_name: "CdA", email: "cda@x.com", property_id: "${p_id}" }
              as: PropertyManager
              captures: { a_id: $.data.id }
            - call: "POST /leasing/floorplans"
              payload: { property_id: "${p_id}", name: "1BR", bedrooms: 1, base_rent_cents: 200000, total_units: 1 }
              as: PropertyManager
              captures: { f_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", floorplan_id: "${f_id}", contact_name: "CdI", contact_email: "cdi@x.com", source: "WEB_FORM" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { i_id: $.data.id }
            - call: "POST /leasing/inquiries/${i_id}/claim"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/inquiries/${i_id}/respond"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/applications"
              payload: { inquiry_id: "${i_id}", floorplan_id: "${f_id}", applicant_name: "Cd App", applicant_email: "cdi@x.com", annual_income_cents: 9000000, credit_score: 750 }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { app_id: $.data.id }
            - call: "POST /leasing/applications/${app_id}/decide"
              payload: { decision: "APPROVED" }
              as: PropertyManager
              captures: { app_v: $.data.version }
            - call: "POST /leasing/leases"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: PropertyManager
              captures: { l_id: $.data.id }
            - call: "POST /leasing/leases/${l_id}/sign"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
            - call: "POST /leasing/leases/${l_id}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/waitlist-entries"
              payload: { floorplan_id: "${f_id}", contact_name: "E1", contact_email: "w1@x.com" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /leasing/waitlist-entries"
              payload: { floorplan_id: "${f_id}", contact_name: "E2", contact_email: "w2@x.com" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /leasing/waitlist-entries"
              payload: { floorplan_id: "${f_id}", contact_name: "E3", contact_email: "w3@x.com" }
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { e3_id: $.data.id }
            - call: "POST /leasing/leases/${l_id}/cancel"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leasing/waitlist-entries/${e1_id}/decline"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
            - call: "POST /leasing/waitlist-entries/${e3_id}/promote"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
            - call: "POST /leasing/waitlist-entries/${e2_id}/promote"
              payload: {}
              as: LeasingAgent
              as_user_id: "${a_id}"
          assert:
            - "count of entries for floorplan ${f_id} with status IN {WAITING, OFFERED} == 3 after promote+decline (unchanged by the pair)"
            - "WaitlistEntry.${e1_id}.status == WAITING and position == 4   # strictly behind E2 (2) and E3 (3)"
            - "err == ERR_NOT_QUEUE_HEAD   # E3 at position 3 is not head while E2 (2) waits"
            - "WaitlistEntry.${e2_id}.status == OFFERED   # head promotion succeeds after the failed non-head attempt"
