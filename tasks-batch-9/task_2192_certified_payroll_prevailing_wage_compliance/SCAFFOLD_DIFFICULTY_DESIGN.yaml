  - rule_id: compensating_invariant
    instances:
      - name: restitution_obligation_cents_conserved_across_disburse_and_reverse
        conserved_quantity: "Finding.restitution_required_cents == Finding.restitution_outstanding_cents + sum(amount_cents of that finding's DISBURSED RestitutionPayments)"
        grounds:
          - calculations.restitution_obligation_ledger
          - endpoints.POST /restitution-payments/{id}/reverse
          - state_machines.RestitutionPayment.status
        distinguishing_aspect: |
          The compensating action is a reversal of a disbursement, and it must restore FOUR
          derived values exactly: the finding's outstanding balance, the assignment's
          cumulative restitution, the project's outstanding exposure, and the finding's own
          status (the auto-acceptance that the disbursement produced has to roll back to
          RESPONSE_SUBMITTED). Because no DISBURSED payment remains afterwards, the cited
          submission's compliance axis returns to DEFICIENT rather than
          RESTITUTION_PENDING. The reversed payment row is retained as REVERSED rather than
          deleted, so the ledger identity is checkable at every point.
        test_recipe:
          setup:
            - "ACTIVE project in CA-ALAMEDA on a determination whose ELEC-INSIDE-JW BASE rate is 5000 base + 2000 fringe; prime tier ACTIVE."
            - "A week-ending 2026-08-01 payroll with two 0-pay journeyworker lines of 40.00 h is certified, submitted and under review, so make_whole_underpayment_cents is 560000."
            - "An UNDERPAYMENT/MAJOR finding demands 560000, the contractor files a response, and a 560000 payment is created and DISBURSED, which drives the finding to RESPONSE_ACCEPTED, the submission to REMEDIED and the project posture back to OPEN."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { prime_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
            - call: "POST /contractors/${prime_id}/staff"
              payload: { full_name: "Cora Cert", capability: "CERTIFIER" }
              as: PortalAdmin
              captures: { staff_cert_id: $.data.id }
            - call: "POST /projects"
              payload: { project_name: "Alameda Transit Center", awarding_agency: "City of Alameda", locality_code: "CA-ALAMEDA", zone_code: "BASE", wage_determination_id: "${wd_id}", reporting_portal_id: "${portal_id}", funding_source: "FEDERAL_DAVIS_BACON", contract_award_date: "2026-02-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract-assignments"
              payload: { contractor_id: "${prime_id}", subcontract_amount_cents: 100000000 }
              as: PortalAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-assignments/${ca_id}/activate"
              payload: {}
              as: PortalAdmin
              captures: { ca_v: $.data.version }
            - call: "POST /projects/${proj_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PortalAdmin
            - call: "POST /workers"
              payload: { employer_contractor_id: "${prime_id}", worker_number: "W-001", full_name: "Jo Journey", default_classification_code: "ELEC-INSIDE-JW" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_contractor_id: "${prime_id}", worker_number: "W-002", full_name: "Kim Kilowatt", default_classification_code: "ELEC-INSIDE-JW" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { w2_id: $.data.id }
            - call: "POST /payroll-submissions"
              payload: { contract_assignment_id: "${ca_id}", week_ending_date: "2026-08-01T00:00:00.000Z", prepared_by_staff_id: "${staff_prep_id}", expected_contract_assignment_version: "${ca_v}" }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /payroll-submissions/${sub_id}/lines"
              payload: { worker_id: "${w1_id}", classification_code: "ELEC-INSIDE-JW", straight_hours: 40.00, overtime_hours: 0.00, base_rate_paid_cents: 0, overtime_rate_paid_cents: 0, fringe_cash_paid_cents: 0, reported_as_apprentice: false }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
            - call: "POST /payroll-submissions/${sub_id}/lines"
              payload: { worker_id: "${w2_id}", classification_code: "ELEC-INSIDE-JW", straight_hours: 40.00, overtime_hours: 0.00, base_rate_paid_cents: 0, overtime_rate_paid_cents: 0, fringe_cash_paid_cents: 0, reported_as_apprentice: false }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
            - call: "POST /payroll-submissions/${sub_id}/finalize"
              payload: {}
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
            - call: "POST /payroll-submissions/${sub_id}/certify"
              payload: {}
              as: CertifyingOfficial
              as_user_id: "${staff_cert_id}"
            - call: "POST /payroll-submissions/${sub_id}/begin-review"
              payload: {}
              as: AgencyComplianceOfficer
              as_user_id: "officer-anna"
            - call: "POST /findings"
              payload: { project_id: "${proj_id}", payroll_submission_id: "${sub_id}", finding_type: "UNDERPAYMENT", severity: "MAJOR", restitution_required_cents: 560000 }
              as: LaborStandardsAuditor
              as_user_id: "auditor-cruz"
              captures: { finding_id: $.data.id, finding_v: $.data.version }
            - call: "POST /findings/${finding_id}/response"
              payload: { response_narrative: "Restitution cheques issued to both workers.", expected_finding_version: "${finding_v}" }
              as: CertifyingOfficial
              as_user_id: "${staff_cert_id}"
            - call: "POST /findings/${finding_id}/restitution-payments"
              payload: { worker_id: "${w1_id}", amount_cents: 560000 }
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /restitution-payments/${pay_id}/disburse"
              payload: {}
              as: PayrollPreparer
              as_user_id: "${staff_prep_id}"
          trigger:
            - call: "POST /restitution-payments/${pay_id}/reverse"
              payload: { reversal_reason: "Cheque returned unpaid by the drawee bank." }
              as: AgencyComplianceOfficer
              as_user_id: "officer-anna"
          assert:
            - "RestitutionPayment.${pay_id}.status == REVERSED"
            - "RestitutionPayment.${pay_id}.amount_cents == 560000"
            - "Finding.${finding_id}.restitution_required_cents == 560000"
            - "Finding.${finding_id}.restitution_outstanding_cents == 560000"
            - "Finding.${finding_id}.status == RESPONSE_SUBMITTED"
            - "ContractAssignment.${ca_id}.cumulative_restitution_cents == 0"
            - "PayrollSubmission.${sub_id}.compliance_status == DEFICIENT"
            - "Project.${proj_id}.outstanding_restitution_cents == 560000"
            - "Project.${proj_id}.open_finding_count == 1"
            - "Project.${proj_id}.posture == FROZEN"

      - name: certified_hours_ledger_conserved_across_accept_and_rescind
        conserved_quantity: "ContractAssignment.cumulative_certified_hours == sum of total_hours_reported over that assignment's ACCEPTED PayrollSubmissions"
        grounds:
          - calculations.certified_hours_ledger
          - endpoints.POST /payroll-submissions/{id}/rescind-acceptance
          - state_machines.PayrollSubmission.workflow_status
        distinguishing_aspect: |
          A different conserved quantity (HOURS on the assignment, not CENTS on the finding)
          restored by a different compensating endpoint. Acceptance is the only event that
          credits the hours ledger, and rescission is its exact inverse: the ledger returns
          to 0.00 rather than to some netted remainder, accepted_by_user_id is cleared, and
          the workflow axis returns to UNDER_REVIEW so the submission can be accepted or
          returned again. Implementations that treat cumulative_certified_hours as
          append-only leave 40.00 behind.
        test_recipe:
          setup:
            - "ACTIVE project in CA-ALAMEDA on a determination whose ELEC-INSIDE-JW BASE rate is 5000 base + 2000 fringe; prime tier ACTIVE."
            - "A week-ending 2026-08-01 payroll with a single fully compliant journeyworker line of 40.00 h (paid exactly 5000 base + 2000 cash fringe) is certified, submitted, reviewed and ACCEPTED, so the assignment's hours ledger reads 40.00."
