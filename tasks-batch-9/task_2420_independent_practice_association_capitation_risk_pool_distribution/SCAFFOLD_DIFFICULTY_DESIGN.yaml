  - rule_id: priority_pair_validation_conflict
    instances:

      - name: physician_notice_given_wins_over_full_panel_capacity
        category_pair: "{state, business_fiscal}"
        grounds:
          - validations.priority_9_ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS
          - validations.priority_27_ERR_PANEL_CAPACITY_EXCEEDED
          - errors.ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: a single create violates
          the credential-state rule at priority 9 AND the panel-capacity rule at
          priority 27, and the state error is returned. Note the panel also
          auto-closed when it filled, so priority 10 is violated too — priority 9
