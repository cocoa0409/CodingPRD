scenario: |
  Generate task harder than expert level!

  2562. Short-Term Rental Guest Screening & Damage Protection (vacation rental trust and safety):
  guest verification with identity documents, payment risk signals and prior stay history, party and
  event risk screening with local booking restrictions and occupancy limits, noise and occupancy
  monitoring device policy with privacy-compliant sensor placement, security deposit versus damage
  waiver product structure with claim thresholds, damage claim intake with evidence requirements,
  adjudication timelines and appeal, guest ban and blocklist management with dispute rights,
  insurance coverage layering across platform protection, host policies and owner coverage,
  incident escalation to law enforcement and neighborhood complaint response

domain_name: short-term-rental-guest-screening-damage-protection
api_prefix: /rentals

complexity_profile:
  difficulty_level: expert_plus          # deliberately above the §0.4 Expert band per the scenario's "harder than expert" directive
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Guest and Property are joined many-to-many through Reservation; DamageClaim fans into a
  # per-layer SettlementAllocation junction against CoverageLayer; BlocklistEntry is polymorphic
  # over {PLATFORM, HOST, PROPERTY} scope AND self-referential through supersedes_entry_id.

  state_machine_shape: parallel
  # Reservation carries three independent dimensions (screening_state x stay_state x deposit_state);
  # DamageClaim, MonitoringDevice and BlocklistEntry are cyclic; Incident is branching fork;
  # Property.listing_state is compound over MonitoringDevice / CoverageLayer aggregates.

  relationship_patterns:
    - one_to_many          # Property -> MonitoringDevice, DamageClaim -> ClaimEvidence
    - many_to_many         # Guest <-> Property via Reservation; DamageClaim <-> CoverageLayer via SettlementAllocation
    - self_referential     # BlocklistEntry.supersedes_entry_id -> BlocklistEntry.id
    - polymorphic          # BlocklistEntry scope resolves to property_id XOR host_id XOR neither (PLATFORM)
    - cross_aggregate      # DamageClaim decisions mutate CoverageLayer and Property aggregates

  role_model: segregation_of_duties
  # The TrustAdjudicator who decided a claim may not decide its appeal; the ComplianceOfficer who
  # created a PLATFORM blocklist entry may not decide the guest's dispute of that entry.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guest legal name as printed on the identity document.
      - name: email
        type: string
        source: input
        description: Contact email; unique across Guest rows.
        constraints: unique, case-insensitive
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of residence.
        constraints: exactly 2 uppercase letters
      - name: payment_risk_signal
        type: enum
        source: system
        description: Latest payment-processor risk signal, overwritten by POST /rentals/guests/{id}/payment-signals.
        default: CLEAN
        constraints: "CLEAN | WATCH | ADVERSE"
      - name: chargeback_count
        type: integer
        source: system
        description: Absolute lifetime chargeback count, overwritten by POST /rentals/guests/{id}/payment-signals.
        default: 0
        constraints: ">= 0"
      - name: verification_state
        type: enum
        source: computed
        description: Derived from this guest's IdentityDocument review_state values by calculations.guest_verification_state.
        constraints: "UNVERIFIED | PENDING_REVIEW | VERIFIED | VERIFICATION_EXPIRED"
      - name: accepted_doc_count
        type: integer
        source: computed
        description: Count of IdentityDocument rows with guest_id == this Guest.id and review_state == ACCEPTED.
      - name: accepted_gov_id_count
        type: integer
        source: computed
        description: Count of IdentityDocument rows with guest_id == this Guest.id, review_state == ACCEPTED and doc_type == GOVERNMENT_ID.
      - name: completed_stay_count
        type: integer
        source: computed
        description: Count of Reservation rows with guest_id == this Guest.id and stay_state == COMPLETED.
      - name: substantiated_incident_count
        type: integer
        source: computed
        description: Count of Incident rows whose reservation_id resolves to a Reservation with guest_id == this Guest.id, having substantiated == true and incident_state IN {ACKNOWLEDGED, ESCALATED_LAW_ENFORCEMENT, CLOSED}.
      - name: escalated_incident_count
        type: integer
        source: computed
        description: Count of Incident rows whose reservation_id resolves to a Reservation with guest_id == this Guest.id, having escalated == true.
      - name: approved_claim_count
        type: integer
        source: computed
        description: Count of DamageClaim rows whose reservation_id resolves to a Reservation with guest_id == this Guest.id, having claim_state IN {APPROVED, SETTLED}.
      - name: risk_score
        type: integer
        source: computed
        description: Live guest risk score per calculations.guest_risk_score variant live_current.
        constraints: "0..100"
      - name: risk_tier
        type: enum
        source: computed
        description: Band of risk_score per calculations.guest_risk_score tier table.
        constraints: "LOW | ELEVATED | HIGH | CRITICAL"
      - name: deposit_held_cents
        type: integer
        source: computed
        description: Sum of deposit_hold_cents over Reservation rows with guest_id == this Guest.id and deposit_state == HELD.
      - name: active_blocklist_scope_count
        type: integer
        source: computed
        description: Count of BlocklistEntry rows with guest_id == this Guest.id and entry_state IN {ACTIVE, DISPUTED} — the enforcing set, so filing a dispute does not reduce it.

  - name: Host
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Host legal or business name.
      - name: email
        type: string
        source: input
        description: Host contact email; unique across Host rows.
        constraints: unique, case-insensitive
      - name: payout_hold
        type: boolean
        source: system
        description: "Set true while a guest's appeal against one of this host's APPROVED claims is pending, and cleared back to false when that appeal is decided either way; blocks further claim intake while true. A host appealing its own denial does NOT set the flag."
        default: false
      - name: settled_claim_count
        type: integer
        source: computed
        description: Count of DamageClaim rows with host_id == this Host.id and claim_state == SETTLED.
      - name: denied_claim_count
        type: integer
        source: computed
        description: Count of DamageClaim rows with host_id == this Host.id and claim_state IN {DENIED, CLOSED_DENIED}.
      - name: total_recovered_cents
        type: integer
        source: computed
        description: Sum of recovered_cents over DamageClaim rows with host_id == this Host.id and claim_state == SETTLED.

  - name: JurisdictionRule
    parent: null
    common_fields: false
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: Local jurisdiction identifier (e.g. "US-CA-SFO"); unique across JurisdictionRule rows.
        constraints: unique
      - name: min_stay_nights
        type: integer
        source: input
        description: Minimum nights a reservation in this jurisdiction must span.
        constraints: ">= 1"
      - name: max_occupancy_cap
        type: integer
        source: input
        description: Statutory occupancy ceiling; combined with Property.max_occupancy by calculations.effective_max_occupancy.
        constraints: ">= 1"
      - name: events_prohibited
        type: boolean
        source: input
        description: True when local law bans parties/events at short-term rentals.
      - name: registration_required
        type: boolean
        source: input
        description: True when a listing must carry a local registration number before activation.
      - name: indoor_camera_allowed
        type: boolean
        source: input
        description: True when INDOOR_CAMERA devices are permitted in COMMON_INTERIOR zones.
      - name: indoor_audio_allowed
        type: boolean
        source: input
        description: True when a device may record audio anywhere other than the EXTERIOR zone.
      - name: sensor_notice_required
        type: boolean
        source: input
        description: True when every monitoring device (including NOISE_DECIBEL) requires guest_disclosure_text.
      - name: noise_threshold_db
        type: number
        source: input
        description: Decibel level at or above which a SENSOR-sourced NOISE_VIOLATION incident is admissible.
        constraints: "> 0"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: host_id
        type: string
        source: input
        description: FK -> Host.id; the owning host, must equal X-User-ID when acting as Host.
      - name: jurisdiction_rule_id
        type: string
        source: input
        description: FK -> JurisdictionRule.id; supplies the local booking restrictions applied to this listing.
      - name: address_line
        type: string
        source: input
        description: Street address of the unit.
      - name: city
        type: string
        source: input
        description: City label for operator display.
      - name: registration_number
        type: string
        source: input
        description: Local short-term-rental registration number; required for activation when the jurisdiction requires registration.
        default: null
      - name: max_occupancy
        type: integer
        source: input
        description: Host-declared sleeping capacity.
        constraints: ">= 1"
      - name: bedrooms
        type: integer
        source: input
        description: Bedroom count, used for operator display only.
        constraints: ">= 0"
      - name: nightly_rate_cents
        type: integer
        source: input
        description: Accommodation price per night in cents.
        constraints: "> 0"
      - name: protection_product
        type: enum
        source: input
        description: Damage-protection product structure attached to every reservation of this listing.
        constraints: "DEPOSIT | WAIVER"
      - name: deposit_amount_cents
        type: integer
        source: input
        description: Refundable security-deposit hold placed at confirmation when protection_product == DEPOSIT; must be 0 when protection_product == WAIVER.
        constraints: ">= 0"
      - name: waiver_nightly_fee_cents
        type: integer
        source: input
        description: Per-night base damage-waiver fee used when protection_product == WAIVER; must be 0 when protection_product == DEPOSIT.
        constraints: ">= 0"
      - name: claim_ceiling_cents
        type: integer
        source: input
        description: Maximum claimed_amount_cents accepted on a single DamageClaim for this listing.
        constraints: "> 0"
      - name: event_policy
        type: enum
        source: input
        description: House rule on parties/events, independent of the jurisdiction ban.
        constraints: "EVENTS_ALLOWED | EVENTS_PROHIBITED"
      - name: turnover_buffer_nights
        type: integer
        source: input
        description: Nights of mandatory cleaning gap enforced between two reservations of this listing.
        default: 0
        constraints: ">= 0"
      - name: listing_state
        type: enum
        source: system
        description: Booking availability lifecycle of the listing.
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED"
      - name: suspension_reason
        type: enum
        source: system
        description: Why the listing was suspended; null while listing_state != SUSPENDED.
        default: null
        constraints: "COVERAGE_EXHAUSTED | SENSOR_NON_COMPLIANT | null"
      - name: sensor_compliance_state
        type: enum
        source: computed
        description: Aggregate monitoring-device disclosure posture per calculations.sensor_compliance_state.
        constraints: "COMPLIANT | PENDING_REVIEW | NON_COMPLIANT"
      - name: coverage_posture
        type: enum
        source: computed
        description: Aggregate insurance-layer availability per calculations.coverage_posture.
        constraints: "FULL | REDUCED | UNPROTECTED"
      - name: open_reservation_count
        type: integer
        source: computed
        description: Count of Reservation rows with property_id == this Property.id and stay_state IN {REQUESTED, CONFIRMED, IN_STAY}.
      - name: open_claim_count
        type: integer
        source: computed
        description: Count of DamageClaim rows whose reservation_id resolves to a Reservation with property_id == this Property.id, having claim_state IN {AWAITING_EVIDENCE, UNDER_REVIEW, APPEALED}.

  - name: MonitoringDevice
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the listing the device is installed at.
      - name: device_type
        type: enum
        source: input
        description: Class of monitoring hardware.
        constraints: "NOISE_DECIBEL | OCCUPANCY_COUNTER | INDOOR_CAMERA | OUTDOOR_CAMERA"
      - name: placement_zone
        type: enum
        source: input
        description: Physical zone the device is mounted in; drives the privacy validations.
        constraints: "EXTERIOR | COMMON_INTERIOR | BEDROOM | BATHROOM"
      - name: records_audio
        type: boolean
        source: input
        description: True when the device captures audio in addition to its primary signal.
      - name: guest_disclosure_text
        type: string
        source: input
        description: Pre-booking disclosure copy shown to guests; required per validations priority 24.
        default: null
      - name: disclosure_state
        type: enum
        source: system
        description: Compliance review lifecycle of the device disclosure.
        default: DRAFT
        constraints: "DRAFT | PENDING_REVIEW | APPROVED | REJECTED"
      - name: reject_reason_code
        type: enum
        source: system
        description: Reason recorded by the reviewing ComplianceOfficer on rejection; null otherwise.
        default: null
        constraints: "DISCLOSURE_UNCLEAR | PLACEMENT_DISPUTED | JURISDICTION_CHANGE | null"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who last reviewed this device; null while DRAFT/PENDING_REVIEW.
        default: null

  - name: IdentityDocument
    parent: Guest
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: FK -> Guest.id; the guest the document belongs to.
      - name: doc_type
        type: enum
        source: input
        description: Kind of verification artifact submitted.
        constraints: "GOVERNMENT_ID | SELFIE | ADDRESS_PROOF"
      - name: issuing_country
        type: string
        source: input
        description: ISO-3166 alpha-2 issuing country.
        constraints: exactly 2 uppercase letters
      - name: document_ref
        type: string
        source: input
        description: Opaque storage reference for the uploaded artifact.
      - name: expires_on
        type: datetime
        source: input
        description: Document expiry instant (ISO 8601 UTC); compared against the logical clock on review and by the sweep.
      - name: review_state
        type: enum
        source: system
        description: Verification review lifecycle of this document.
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED | EXPIRED"
      - name: reject_reason_code
        type: enum
        source: system
        description: Reason recorded on rejection; null otherwise.
        default: null
        constraints: "UNREADABLE | NAME_MISMATCH | SUSPECTED_FORGERY | null"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who reviewed this document; null while PENDING.
        default: null

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: FK -> Guest.id; the booking guest, must equal X-User-ID when acting as Guest.
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; the listing being booked.
      - name: check_in
        type: string
        source: input
        description: Arrival calendar date, YYYY-MM-DD.
      - name: check_out
        type: string
        source: input
        description: Departure calendar date, YYYY-MM-DD; must be strictly after check_in.
      - name: guest_count
        type: integer
        source: input
        description: Declared number of overnight guests.
        constraints: ">= 1"
      - name: event_declared
        type: boolean
        source: input
        description: Guest declaration that a party/event will be held during the stay.
      - name: nights
        type: integer
        source: computed
        description: check_out minus check_in in days, half-open interval [check_in, check_out).
      - name: check_in_at
        type: datetime
        source: computed
        description: check_in at CHECK_IN_HOUR_UTC (15:00Z); the earliest instant POST check-in is allowed.
      - name: check_out_at
        type: datetime
        source: computed
        description: check_out at CHECK_OUT_HOUR_UTC (11:00Z); the earliest instant POST complete is allowed.
      - name: claim_window_ends_at
        type: datetime
        source: computed
        description: check_out_at plus CLAIM_FILING_WINDOW_HOURS (72h); the last instant a DamageClaim may be filed.
      - name: screening_state
        type: enum
        source: system
        description: Dimension 1 of 3 — trust-and-safety screening outcome for this booking.
        default: SCREENING
        constraints: "SCREENING | CLEARED | MANUAL_REVIEW | DENIED"
      - name: screening_reason_code
        type: enum
        source: system
        description: Machine-readable justification for the current screening_state.
        default: null
        constraints: "LOW_RISK_AUTO_CLEAR | ELEVATED_FULL_HOUSE | HIGH_RISK_REVIEW | RISK_CRITICAL | EVENT_PROHIBITED | EVENT_RISK | EVENT_REVIEW | ADJUDICATOR_CLEARED | ADJUDICATOR_DENIED | null"
      - name: risk_score_at_booking
        type: integer
        source: computed
        description: Snapshot of Guest.risk_score pinned at creation per calculations.guest_risk_score variant booking_snapshot; never recomputed afterwards.
      - name: risk_tier_at_booking
        type: enum
        source: computed
        description: Tier band of risk_score_at_booking, pinned at creation.
        constraints: "LOW | ELEVATED | HIGH | CRITICAL"
      - name: screening_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrustAdjudicator who resolved MANUAL_REVIEW; null otherwise.
        default: null
      - name: stay_state
        type: enum
        source: system
        description: Dimension 2 of 3 — occupancy lifecycle of the booking.
        default: REQUESTED
        constraints: "REQUESTED | CONFIRMED | IN_STAY | COMPLETED | CANCELLED"
      - name: cancel_reason_code
        type: enum
        source: system
        description: Why the booking was cancelled; null while stay_state != CANCELLED.
        default: null
        constraints: "GUEST_WITHDREW | HOST_WITHDREW | SCREENING_DENIED | BLOCKLISTED | null"
      - name: deposit_state
        type: enum
        source: system
        description: Dimension 3 of 3 — security-deposit hold lifecycle; stays NONE for WAIVER listings.
        default: NONE
        constraints: "NONE | HELD | APPLIED | RELEASED"
      - name: deposit_hold_cents
        type: integer
        source: computed
        description: Property.deposit_amount_cents when protection_product == DEPOSIT, else 0; frozen at creation.
      - name: deposit_applied_cents
        type: integer
        source: system
        description: Portion of the hold consumed by an approved DamageClaim; restored to 0 when that approval is overturned on appeal.
        default: 0
      - name: deposit_refunded_cents
        type: integer
        source: system
        description: Portion of the hold returned to the guest when the hold is released or partially applied.
        default: 0
      - name: accommodation_cents
        type: integer
        source: computed
        description: nightly_rate_cents multiplied by nights, per calculations.reservation_charge.
      - name: waiver_fee_cents
        type: integer
        source: computed
        description: Risk-multiplied damage-waiver fee, per calculations.reservation_charge; 0 for DEPOSIT listings.
      - name: pre_fee_subtotal_cents
        type: integer
        source: computed
        description: accommodation_cents plus waiver_fee_cents; the ONLY input to the trust-fee tier selection.
      - name: trust_fee_pct
        type: number
        source: computed
        description: Trust-and-safety fee rate selected from pre_fee_subtotal_cents, never re-selected after the fee is added.
      - name: trust_fee_cents
        type: integer
        source: computed
        description: Trust-and-safety fee, per calculations.reservation_charge.
      - name: total_charged_cents
        type: integer
        source: computed
        description: pre_fee_subtotal_cents plus trust_fee_cents; excludes the refundable deposit hold.

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; the stay the incident occurred during.
      - name: sensor_device_id
        type: string
        source: input
        description: FK -> MonitoringDevice.id; the device that produced the reading, required when source == SENSOR.
        default: null
      - name: incident_type
        type: enum
        source: input
        description: Category of trust-and-safety incident.
        constraints: "NOISE_VIOLATION | OVER_OCCUPANCY | UNAUTHORIZED_EVENT | PROPERTY_DAMAGE | SAFETY_THREAT"
      - name: severity
        type: enum
        source: input
        description: Reporter-assessed severity; gates law-enforcement escalation.
        constraints: "LOW | MEDIUM | HIGH"
      - name: source
        type: enum
        source: input
        description: Where the report originated.
        constraints: "SENSOR | NEIGHBOR_COMPLAINT | HOST_REPORT"
      - name: detected_at
        type: datetime
        source: input
        description: Instant the condition was observed (ISO 8601 UTC).
      - name: description
        type: string
        source: input
        description: Free-text narrative for adjudicators.
      - name: decibel_reading
        type: number
        source: input
        description: Measured dB for NOISE_VIOLATION reports; compared against JurisdictionRule.noise_threshold_db.
        default: null
      - name: observed_occupancy
        type: integer
        source: input
        description: Head count observed for OVER_OCCUPANCY reports; compared against calculations.effective_max_occupancy.
        default: null
      - name: complainant_ref
        type: string
        source: input
        description: Neighborhood complaint tracking reference, recorded for NEIGHBOR_COMPLAINT reports.
        default: null
      - name: incident_state
        type: enum
        source: system
        description: Incident triage lifecycle.
        default: OPEN
        constraints: "OPEN | ACKNOWLEDGED | ESCALATED_LAW_ENFORCEMENT | CLOSED | DISMISSED"
      - name: substantiated
        type: boolean
        source: system
        description: True once the incident is acknowledged; false when dismissed. Feeds Guest.substantiated_incident_count.
        default: false
      - name: escalated
        type: boolean
        source: system
        description: Set true at law-enforcement escalation and never unset, so closing the incident does not undo the guest risk penalty.
        default: false
      - name: law_enforcement_ref
        type: string
        source: system
        description: Police report / case reference captured at escalation; null otherwise.
        default: null
      - name: response_due_at
        type: datetime
        source: computed
        description: detected_at plus NEIGHBOR_RESPONSE_SLA_HOURS (24h) when source == NEIGHBOR_COMPLAINT, else null.
      - name: response_sla_breached
        type: boolean
        source: system
        description: Set true by the adjudication sweep when incident_state == OPEN and the logical clock has passed response_due_at.
        default: false
      - name: dismiss_reason_code
        type: enum
        source: system
        description: Reason recorded on dismissal; null otherwise.
        default: null
        constraints: "NO_EVIDENCE | DUPLICATE_REPORT | GUEST_EXONERATED | null"

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; the completed stay the damage is claimed against.
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; optional link to the triaged incident that documents the damage.
        default: null
      - name: host_id
        type: string
        source: computed
        description: FK -> Host.id; copied at creation from Property.host_id of the reservation's listing.
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount the host claims, capped by Property.claim_ceiling_cents.
        constraints: "> 0"
      - name: description
        type: string
        source: input
        description: Host narrative of the damage.
      - name: claim_state
        type: enum
        source: system
        description: Adjudication lifecycle of the claim.
        default: AWAITING_EVIDENCE
        constraints: "AWAITING_EVIDENCE | UNDER_REVIEW | APPROVED | DENIED | APPEALED | SETTLED | CLOSED_DENIED"
      - name: evidence_round
        type: integer
        source: system
        description: Number of evidence-gathering rounds opened; starts at 1 and increments on each request-more-evidence, capped by MAX_EVIDENCE_ROUNDS.
        default: 1
      - name: evidence_count
        type: integer
        source: computed
        description: Count of ClaimEvidence rows with claim_id == this DamageClaim.id.
      - name: submitted_for_review_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit-for-review; null while never submitted.
        default: null
      - name: adjudication_due_at
        type: datetime
        source: computed
        description: submitted_for_review_at plus ADJUDICATION_SLA_HOURS (120h); advisory for manual decisions, binding only for the sweep.
      - name: sla_lapsed
        type: boolean
        source: system
        description: Set true when the sweep denies the claim because adjudication_due_at passed while UNDER_REVIEW.
        default: false
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the first-instance decision; null before it.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrustAdjudicator who issued the first-instance decision; the string "system" when the sweep denied it.
        default: null
      - name: decision_reason_code
        type: enum
        source: system
        description: Machine-readable justification of the first-instance decision.
        default: null
        constraints: "DAMAGE_CONFIRMED | PARTIAL_DEPRECIATION | EVIDENCE_INSUFFICIENT | NORMAL_WEAR | FRAUD_SUSPECTED | SLA_LAPSED | null"
      - name: approved_amount_cents
        type: integer
        source: system
        description: Amount the adjudicator approved; 0 whenever the claim is denied. Must never exceed claimed_amount_cents.
        default: 0
      - name: projected_recovery_cents
        type: integer
        source: computed
        description: Provisional recovery per calculations.claim_recovery variant provisional_at_submission, pinned at each submit-for-review.
      - name: deposit_applied_cents
        type: integer
        source: system
        description: Security-deposit portion of the settlement; mirrors Reservation.deposit_applied_cents.
        default: 0
      - name: recovered_cents
        type: integer
        source: system
        description: Final recovery per calculations.claim_recovery variant final_at_decision — deposit_applied_cents plus the sum of non-voided SettlementAllocation.allocated_cents.
        default: 0
      - name: uncovered_cents
        type: integer
        source: system
        description: Approved amount that exceeded the available deposit plus layer capacity, per calculations.claim_recovery.
        default: 0
      - name: host_absorbed_cents
        type: integer
        source: system
        description: approved_amount_cents minus recovered_cents — deductibles, co-insurance shortfalls and uncovered_cents combined.
        default: 0
      - name: appeal_due_at
        type: datetime
        source: computed
        description: decided_at plus APPEAL_WINDOW_HOURS (168h); the last instant an appeal may be filed.
      - name: appeal_round
        type: integer
        source: system
        description: 0 before any appeal, 1 after the single permitted appeal is filed.
        default: 0
      - name: appealed_by_role
        type: enum
        source: system
        description: Role that filed the appeal; null before it.
        default: null
        constraints: "Guest | Host | null"
      - name: appeal_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrustAdjudicator who decided the appeal; must differ from decided_by_user_id.
        default: null
      - name: appeal_decision
        type: enum
        source: system
        description: Outcome of the appeal review; null before it.
        default: null
        constraints: "UPHELD | OVERTURNED | null"

  - name: ClaimEvidence
    parent: DamageClaim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> DamageClaim.id; the claim this artifact supports.
      - name: evidence_type
        type: enum
        source: input
        description: Kind of supporting artifact.
        constraints: "PHOTO | RECEIPT | REPAIR_ESTIMATE | POLICE_REPORT | SENSOR_LOG"
      - name: amount_cents
        type: integer
        source: input
        description: Monetary figure carried by RECEIPT and REPAIR_ESTIMATE artifacts; null for other types.
        default: null
      - name: captured_at
        type: datetime
        source: input
        description: Instant the artifact was captured (ISO 8601 UTC).
      - name: file_ref
        type: string
        source: input
        description: Opaque storage reference for the artifact.
      - name: uploaded_by_role
        type: enum
        source: system
        description: Role from X-User-Role at upload time.
        constraints: "Host | Guest"
      - name: uploaded_by_user_id
        type: string
        source: system
        description: X-User-ID at upload time.
      - name: evidence_round
        type: integer
        source: system
        description: Value of DamageClaim.evidence_round at the moment of upload.

  - name: CoverageLayer
    parent: null
    common_fields: true
    fields:
      - name: source
        type: enum
        source: input
        description: Which party's coverage this layer represents.
        constraints: "DAMAGE_WAIVER | PLATFORM_PROTECTION | HOST_POLICY | OWNER_COVERAGE"
      - name: layer_order
        type: integer
        source: input
        description: Waterfall position; lower numbers absorb loss first.
        constraints: ">= 1"
      - name: limit_cents
        type: integer
        source: input
        description: Maximum gross loss this layer may absorb across all claims.
        constraints: "> 0"
      - name: deductible_cents
        type: integer
        source: input
        description: Gross amount this layer withholds before applying coverage_pct.
        constraints: ">= 0"
      - name: coverage_pct
        type: number
        source: input
        description: Fraction of the post-deductible gross this layer actually pays.
        constraints: "0 < coverage_pct <= 1"
      - name: scope
        type: enum
        source: input
        description: Whether the layer applies to every listing or to one listing only.
        constraints: "PLATFORM_GLOBAL | PROPERTY"
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; required when scope == PROPERTY, must be null when scope == PLATFORM_GLOBAL.
        default: null
      - name: layer_state
        type: enum
        source: system
        description: AVAILABLE while consumed_cents < limit_cents, EXHAUSTED once consumed_cents == limit_cents.
        default: AVAILABLE
        constraints: "AVAILABLE | EXHAUSTED"
      - name: consumed_cents
        type: integer
        source: computed
        description: Sum of gross_cents over SettlementAllocation rows referencing this layer with voided == false.

  - name: SettlementAllocation
    parent: DamageClaim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> DamageClaim.id; the settled claim this allocation line belongs to.
      - name: coverage_layer_id
        type: string
        source: input
        description: FK -> CoverageLayer.id; the layer charged by this line.
      - name: sequence_index
        type: integer
        source: system
        description: Zero-based position of this line in the waterfall order actually executed.
      - name: gross_cents
        type: integer
        source: system
        description: Loss charged against the layer's limit by this line.
      - name: deductible_cents
        type: integer
        source: system
        description: Deductible withheld on this line, copied from the layer at settlement time.
      - name: allocated_cents
        type: integer
        source: system
        description: Cash this line pays the host — round_half_up((gross_cents - deductible_cents) * coverage_pct).
      - name: voided
        type: boolean
        source: system
        description: Set true when an appeal overturns the approval; voided lines stop counting toward CoverageLayer.consumed_cents.
        default: false

  - name: BlocklistEntry
    parent: null
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: FK -> Guest.id; the banned guest.
      - name: scope
        type: enum
        source: input
        description: Breadth of the ban.
        constraints: "PROPERTY | HOST | PLATFORM"
      - name: property_id
        type: string
        source: input
        description: FK -> Property.id; required when scope == PROPERTY, must be null otherwise.
        default: null
      - name: host_id
        type: string
        source: input
        description: FK -> Host.id; required when scope == HOST, must be null otherwise.
        default: null
      - name: supersedes_entry_id
        type: string
        source: input
        description: FK -> BlocklistEntry.id; optional pointer to the narrower entry this one replaces, which is LIFTED as a side effect.
        default: null
      - name: reason_code
        type: enum
        source: input
        description: Grounds for the ban; each value has its own evidence precondition.
        constraints: "SUBSTANTIATED_INCIDENT | APPROVED_CLAIM | RISK_TIER_CRITICAL | LAW_ENFORCEMENT_ESCALATION"
      - name: created_by_role
        type: enum
        source: system
        description: Role that created the entry; "system" for sweeps and cascades.
        constraints: "Host | ComplianceOfficer | system"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the creator, or "system" when auto-generated by a cascade.
      - name: auto_generated
        type: boolean
        source: system
        description: True when the entry was created by the CRITICAL-tier cascade rather than by a request.
        default: false
      - name: entry_state
        type: enum
        source: system
        description: Dimension 1 of 2 — enforcement state of the ban.
        default: ACTIVE
        constraints: "ACTIVE | DISPUTED | LIFTED"
      - name: dispute_window_state
        type: enum
        source: system
        description: Dimension 2 of 2 — status of the guest's dispute right, independent of entry_state.
        default: OPEN
        constraints: "OPEN | DISPUTED | RESOLVED | EXPIRED"
      - name: dispute_due_at
        type: datetime
        source: computed
        description: created_at plus DISPUTE_WINDOW_HOURS (336h); the last instant the guest may dispute.
      - name: dispute_statement_code
        type: enum
        source: system
        description: Guest's stated grounds for the dispute; null before it.
        default: null
        constraints: "NOT_THE_GUEST | FACTS_DISPUTED | REMEDIED | null"
      - name: dispute_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who decided the dispute; must differ from created_by_user_id.
        default: null
      - name: dispute_reason_code
        type: enum
        source: system
        description: Machine-readable justification of the dispute decision.
        default: null
        constraints: "GROUNDS_CONFIRMED | GROUNDS_WITHDRAWN | IDENTITY_ERROR | null"

state_machines:
  - entity: IdentityDocument
    dimension: review_state
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /rentals/identity-documents/{id}/review with decision == ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "review_state == PENDING"
          - "expires_on > logical clock now (else ERR_DOCUMENT_EXPIRED)"
        side_effects:
          - "sets reviewed_by_user_id to X-User-ID"
          - "Guest.accepted_doc_count increases by 1 (and Guest.accepted_gov_id_count when doc_type == GOVERNMENT_ID)"
          - "that count change re-derives Guest.verification_state per calculations.guest_verification_state, which flips to VERIFIED once accepted_gov_id_count >= 1 and accepted_doc_count >= REQUIRED_ACCEPTED_DOC_COUNT"
          - "that VERIFIED value re-runs calculations.guest_risk_score variant live_current, applying VERIFIED_CREDIT (-15) so Guest.risk_score drops and Guest.risk_tier re-bands"
          - "increments Guest.version by 1"
        note: "Cascade chain link 1 of the verification cascade; each link is caused by the previous field change, not by the request."
      - from: PENDING
        to: REJECTED
        trigger: "POST /rentals/identity-documents/{id}/review with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "review_state == PENDING"
          - "reject_reason_code is present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets reject_reason_code and reviewed_by_user_id"
          - "Guest.verification_state re-derived; stays PENDING_REVIEW while another PENDING document exists, otherwise UNVERIFIED"
          - "increments Guest.version by 1"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system event: POST /rentals/ops/adjudication-sweep observes expires_on < logical clock now"
        actor: system
        preconditions:
          - "review_state == ACCEPTED"
          - "expires_on <= logical clock now"
        side_effects:
          - "Guest.accepted_doc_count decreases by 1"
          - "that count change re-derives Guest.verification_state to VERIFICATION_EXPIRED when the accepted-document requirement is no longer met"
          - "that value re-runs calculations.guest_risk_score, removing VERIFIED_CREDIT so Guest.risk_score increases by 15 and Guest.risk_tier re-bands"
          - "increments Guest.version by 1"

  - entity: MonitoringDevice
    dimension: disclosure_state
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /rentals/monitoring-devices/{id}/submit-for-review"
        actor: Host
        preconditions:
          - "disclosure_state == DRAFT"
          - "guest_disclosure_text is non-null and non-empty whenever the §1.4 priority-24 rule demands it (else ERR_DISCLOSURE_TEXT_REQUIRED)"
        side_effects:
          - "Property.sensor_compliance_state re-derived to PENDING_REVIEW (no REJECTED sibling device exists)"
          - "increments Property.version by 1"
        note: "PENDING_REVIEW blocks new confirmations on the listing but never suspends it; only REJECTED suspends."
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /rentals/monitoring-devices/{id}/submit-for-review after remediation"
        actor: Host
        preconditions:
          - "disclosure_state == REJECTED"
        side_effects:
          - "clears reject_reason_code to null"
          - "Property.sensor_compliance_state re-derived to PENDING_REVIEW once no REJECTED device remains"
          - "Property.listing_state is NOT auto-reinstated; it stays SUSPENDED until an explicit activate call"
          - "increments Property.version by 1"
        note: "Revision loop: PENDING_REVIEW -> REJECTED -> PENDING_REVIEW is the cyclic shape of this machine."
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /rentals/monitoring-devices/{id}/review with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "disclosure_state == PENDING_REVIEW"
          - "placement_zone NOT IN {BEDROOM, BATHROOM} (re-checked against current jurisdiction rule)"
          - "records_audio == false OR placement_zone == EXTERIOR OR JurisdictionRule.indoor_audio_allowed == true"
          - "device_type != INDOOR_CAMERA OR JurisdictionRule.indoor_camera_allowed == true"
        side_effects:
          - "sets reviewed_by_user_id to X-User-ID"
          - "Property.sensor_compliance_state re-derived; becomes COMPLIANT once every sibling device is APPROVED"
          - "increments Property.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /rentals/monitoring-devices/{id}/review with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "disclosure_state == PENDING_REVIEW"
          - "reject_reason_code is present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets reject_reason_code and reviewed_by_user_id"
          - "Property.sensor_compliance_state re-derived to NON_COMPLIANT because a REJECTED device now exists"
          - "that NON_COMPLIANT value causes Property.listing_state ACTIVE -> SUSPENDED with suspension_reason SENSOR_NON_COMPLIANT"
          - "increments Property.version by 1"
        note: "Sensor-compliance cascade: device REJECTED -> sensor_compliance_state NON_COMPLIANT -> listing SUSPENDED (3 links)."

  - entity: Property
    dimension: listing_state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rentals/properties/{id}/activate"
        actor: Host
        preconditions:
          - "listing_state == DRAFT"
          - "host_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
          - "sensor_compliance_state == COMPLIANT (zero installed devices counts as COMPLIANT)"
          - "registration_number is non-null when JurisdictionRule.registration_required == true (else ERR_REGISTRATION_REQUIRED)"
        side_effects:
          - "listing_state becomes ACTIVE; suspension_reason stays null"
          - "increments Property.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rentals/properties/{id}/activate (reinstatement)"
        actor: Host
        preconditions:
          - "listing_state == SUSPENDED"
          - "sensor_compliance_state == COMPLIANT"
          - "coverage_posture != UNPROTECTED (else ERR_COVERAGE_UNPROTECTED)"
          - "registration_number is non-null when JurisdictionRule.registration_required == true"
        side_effects:
          - "listing_state becomes ACTIVE; suspension_reason resets to null"
          - "increments Property.version by 1"
        note: "Asymmetry: the DRAFT -> ACTIVE path does not test coverage_posture, the reinstatement path does."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: sensor-compliance cascade (a device just moved to REJECTED) or coverage-exhaustion cascade (a CoverageLayer just moved AVAILABLE -> EXHAUSTED)"
        actor: system
        preconditions:
          - "listing_state == ACTIVE"
          - "the current request just wrote a device REJECTED transition or a CoverageLayer AVAILABLE -> EXHAUSTED transition for this property (a property that never had any eligible layer is NOT suspended by this rule, even though its coverage_posture reads UNPROTECTED)"
          - "sensor_compliance_state == NON_COMPLIANT OR coverage_posture == UNPROTECTED"
        side_effects:
          - "sets suspension_reason to SENSOR_NON_COMPLIANT or COVERAGE_EXHAUSTED per the causing condition"
          - "Reservation rows already in stay_state REQUESTED or CONFIRMED are left untouched, but no further confirm call can succeed while suspended"
          - "increments Property.version by 1"

  - entity: CoverageLayer
    dimension: layer_state
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: EXHAUSTED
        trigger: "system event: a SettlementAllocation row pushes consumed_cents to limit_cents"
        actor: system
        preconditions:
          - "consumed_cents == limit_cents after the allocation is written"
        side_effects:
          - "Property.coverage_posture re-derived for every property this layer is eligible for"
          - "increments CoverageLayer.version by 1"
      - from: EXHAUSTED
        to: AVAILABLE
        trigger: "system event: allocations voided by an overturned approval drop consumed_cents below limit_cents"
        actor: system
        preconditions:
          - "consumed_cents < limit_cents after the void"
        side_effects:
          - "Property.coverage_posture re-derived; a listing suspended for COVERAGE_EXHAUSTED is NOT auto-reinstated"
          - "increments CoverageLayer.version by 1"

  - entity: Reservation
    dimension: screening_state
    initial_state: SCREENING
    terminal_states: [CLEARED, DENIED]
    note: "Dimension 1 of 3 on Reservation. SCREENING is transient: calculations.screening_decision runs inside the creating request, so no persisted row is ever observed in SCREENING."
    transitions:
      - from: SCREENING
        to: CLEARED
        trigger: "POST /rentals/reservations (calculations.screening_decision returns CLEARED)"
        actor: system
        preconditions:
          - "risk_tier_at_booking == LOW and event_declared == false"
          - "OR risk_tier_at_booking == ELEVATED, event_declared == false and guest_count < Property.max_occupancy"
        side_effects:
          - "sets screening_reason_code to LOW_RISK_AUTO_CLEAR"
          - "stay_state stays REQUESTED, awaiting the host confirm"
      - from: SCREENING
        to: MANUAL_REVIEW
        trigger: "POST /rentals/reservations (calculations.screening_decision returns MANUAL_REVIEW)"
        actor: system
        preconditions:
          - "risk_tier_at_booking == HIGH and event_declared == false"
          - "OR risk_tier_at_booking == ELEVATED, event_declared == false and guest_count >= Property.max_occupancy"
          - "OR event_declared == true, risk_tier_at_booking IN {LOW, ELEVATED}, JurisdictionRule.events_prohibited == false and Property.event_policy == EVENTS_ALLOWED"
        side_effects:
          - "sets screening_reason_code to HIGH_RISK_REVIEW, ELEVATED_FULL_HOUSE or EVENT_REVIEW per the matching branch"
          - "stay_state stays REQUESTED and cannot advance until an adjudicator clears the screening"
      - from: SCREENING
        to: DENIED
        trigger: "POST /rentals/reservations (calculations.screening_decision returns DENIED)"
        actor: system
        preconditions:
          - "risk_tier_at_booking == CRITICAL"
          - "OR event_declared == true and (JurisdictionRule.events_prohibited == true OR Property.event_policy == EVENTS_PROHIBITED)"
          - "OR event_declared == true and risk_tier_at_booking == HIGH"
        side_effects:
          - "sets screening_reason_code to RISK_CRITICAL, EVENT_PROHIBITED or EVENT_RISK per the matching branch"
          - "cross-dimension cascade: stay_state moves REQUESTED -> CANCELLED with cancel_reason_code SCREENING_DENIED inside the same request"
          - "deposit_state stays NONE because no hold was ever placed"
      - from: MANUAL_REVIEW
        to: CLEARED
        trigger: "POST /rentals/reservations/{id}/screening-decision with decision == CLEAR"
        actor: TrustAdjudicator
        preconditions:
          - "screening_state == MANUAL_REVIEW"
          - "stay_state == REQUESTED"
        side_effects:
          - "sets screening_reason_code to ADJUDICATOR_CLEARED and screening_decided_by_user_id to X-User-ID"
          - "increments Reservation.version by 1"
      - from: MANUAL_REVIEW
        to: DENIED
        trigger: "POST /rentals/reservations/{id}/screening-decision with decision == DENY"
        actor: TrustAdjudicator
        preconditions:
          - "screening_state == MANUAL_REVIEW"
          - "stay_state == REQUESTED"
        side_effects:
          - "sets screening_reason_code to ADJUDICATOR_DENIED and screening_decided_by_user_id to X-User-ID"
          - "cross-dimension cascade: stay_state REQUESTED -> CANCELLED with cancel_reason_code SCREENING_DENIED"
          - "increments Reservation.version by 1"

  - entity: Reservation
    dimension: stay_state
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Dimension 2 of 3 on Reservation; evolves independently of screening_state except where a transition names it as a precondition."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /rentals/reservations/{id}/confirm"
        actor: Host
        preconditions:
          - "stay_state == REQUESTED"
          - "screening_state == CLEARED (else ERR_INVALID_STATE)"
          - "no BlocklistEntry with entry_state IN {ACTIVE, DISPUTED} covers this guest for this listing (else ERR_GUEST_BLOCKLISTED)"
          - "Property.sensor_compliance_state == COMPLIANT (else ERR_SENSOR_COMPLIANCE_BLOCKED)"
          - "Property.listing_state == ACTIVE (else ERR_PROPERTY_NOT_LISTED)"
        side_effects:
          - "when Property.protection_product == DEPOSIT: deposit_state NONE -> HELD and Guest.deposit_held_cents increases by deposit_hold_cents, incrementing Guest.version by 1"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: IN_STAY
        trigger: "POST /rentals/reservations/{id}/check-in"
        actor: Host
        preconditions:
          - "stay_state == CONFIRMED"
          - "logical clock now >= check_in_at (else ERR_INVALID_STATE)"
          - "Property.listing_state == ACTIVE"
        side_effects:
          - "increments Reservation.version by 1"
      - from: IN_STAY
        to: COMPLETED
        trigger: "POST /rentals/reservations/{id}/complete"
        actor: Host
        preconditions:
          - "stay_state == IN_STAY"
          - "logical clock now >= check_out_at (else ERR_INVALID_STATE)"
        side_effects:
          - "Guest.completed_stay_count increases by 1"
          - "that count change re-runs calculations.guest_risk_score, applying STAY_CREDIT_PER_STAY (-4, floored at STAY_CREDIT_FLOOR -20) so Guest.risk_score drops and Guest.risk_tier re-bands"
          - "the claim-filing window opens and closes at claim_window_ends_at"
          - "increments Guest.version by 1 and Reservation.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /rentals/reservations/{id}/cancel"
        actor: Guest | Host
        preconditions:
          - "stay_state == REQUESTED"
          - "acting Guest satisfies guest_id == X-User-ID, or acting Host owns Property.host_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "sets cancel_reason_code to GUEST_WITHDREW or HOST_WITHDREW per the acting role"
          - "deposit_state is untouched (still NONE — no hold had been placed)"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rentals/reservations/{id}/cancel"
        actor: Guest | Host
        preconditions:
          - "stay_state == CONFIRMED"
          - "acting Guest satisfies guest_id == X-User-ID, or acting Host owns Property.host_id == X-User-ID"
        side_effects:
          - "sets cancel_reason_code to GUEST_WITHDREW or HOST_WITHDREW per the acting role"
          - "when deposit_state == HELD: deposit_state -> RELEASED, deposit_refunded_cents = deposit_hold_cents and Guest.deposit_held_cents decreases by deposit_hold_cents, incrementing Guest.version by 1"
          - "increments Reservation.version by 1"
        note: "Compensating action for the CONFIRMED hold: the conserved quantity Guest.deposit_held_cents returns to its pre-confirm value."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system event: a newly ACTIVE PLATFORM-scope BlocklistEntry covers this guest"
        actor: system
        preconditions:
          - "stay_state IN {REQUESTED, CONFIRMED}"
          - "check_in_at > logical clock now"
        side_effects:
          - "sets cancel_reason_code to BLOCKLISTED"
          - "when deposit_state == HELD: deposit_state -> RELEASED with deposit_refunded_cents = deposit_hold_cents and Guest.deposit_held_cents decreases accordingly"
          - "increments Reservation.version by 1"
        note: "Final link of the escalation cascade; only future-dated stays are cancelled, an IN_STAY stay is left running."

  - entity: Reservation
    dimension: deposit_state
    initial_state: NONE
    terminal_states: [RELEASED]
    note: "Dimension 3 of 3 on Reservation; stays NONE for the whole lifecycle of a WAIVER listing's booking."
    transitions:
      - from: NONE
        to: HELD
        trigger: "POST /rentals/reservations/{id}/confirm on a listing with protection_product == DEPOSIT"
        actor: Host
        preconditions:
          - "deposit_state == NONE and deposit_hold_cents > 0"
        side_effects:
          - "Guest.deposit_held_cents increases by deposit_hold_cents"
      - from: HELD
        to: RELEASED
        trigger: "POST /rentals/reservations/{id}/cancel, or the sweep after claim_window_ends_at with no live claim"
        actor: Guest | Host | system
        preconditions:
          - "deposit_state == HELD"
          - "for the sweep path: logical clock now > claim_window_ends_at and no DamageClaim on this reservation has claim_state IN {AWAITING_EVIDENCE, UNDER_REVIEW, APPEALED, APPROVED}"
        side_effects:
          - "deposit_refunded_cents = deposit_hold_cents"
          - "Guest.deposit_held_cents decreases by deposit_hold_cents"
      - from: HELD
        to: APPLIED
        trigger: "system event: a DamageClaim on this reservation is APPROVED with a non-zero deposit slice"
        actor: system
        preconditions:
          - "deposit_state == HELD"
          - "calculations.claim_recovery assigns deposit_applied_cents > 0"
        side_effects:
          - "deposit_applied_cents is set to the assigned slice and deposit_refunded_cents stays 0 until settlement"
          - "Guest.deposit_held_cents decreases by deposit_hold_cents because the hold is no longer HELD"
      - from: APPLIED
        to: HELD
        trigger: "system event: the approval is OVERTURNED on appeal"
        actor: system
        preconditions:
          - "deposit_state == APPLIED"
        side_effects:
          - "deposit_applied_cents resets to 0"
          - "Guest.deposit_held_cents increases by deposit_hold_cents, returning the conserved quantity to its pre-approval value"
        note: "Compensating action; the HELD -> APPLIED -> HELD loop is a cycle on this dimension."
      - from: APPLIED
        to: RELEASED
        trigger: "system event: the sweep settles the approved claim after appeal_due_at"
        actor: system
        preconditions:
          - "deposit_state == APPLIED and the claim reaches SETTLED"
        side_effects:
          - "deposit_refunded_cents = deposit_hold_cents - deposit_applied_cents"

  - entity: Incident
    dimension: incident_state
    initial_state: OPEN
    terminal_states: [CLOSED, DISMISSED]
    note: "Branching machine: OPEN forks to ACKNOWLEDGED (substantiating branch) or DISMISSED (exonerating branch), and the two branches apply disjoint side-effect sets."
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /rentals/incidents/{id}/acknowledge"
        actor: TrustAdjudicator
        preconditions:
          - "incident_state == OPEN"
          - "when incident_type == NOISE_VIOLATION: decibel_reading is non-null and decibel_reading >= JurisdictionRule.noise_threshold_db of the reservation's listing (else ERR_NOISE_BELOW_THRESHOLD)"
          - "when incident_type == OVER_OCCUPANCY: observed_occupancy is non-null and observed_occupancy > calculations.effective_max_occupancy (else ERR_OCCUPANCY_WITHIN_LIMIT)"
        side_effects:
          - "sets substantiated to true"
          - "Guest.substantiated_incident_count increases by 1 (the count reads incident_state IN {ACKNOWLEDGED, ESCALATED_LAW_ENFORCEMENT, CLOSED})"
          - "that count change re-runs calculations.guest_risk_score with INCIDENT_PENALTY (+9 each, jointly capped with escalations at INCIDENT_PENALTY_CAP 40) so Guest.risk_score rises and Guest.risk_tier may re-band"
          - "when the re-banded Guest.risk_tier becomes CRITICAL, the cascade in calculations.guest_risk_score creates an auto PLATFORM BlocklistEntry, which in turn cancels the guest's future-dated reservations (4 links)"
          - "increments Guest.version by 1 and Incident.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /rentals/incidents/{id}/dismiss"
        actor: TrustAdjudicator
        preconditions:
          - "incident_state == OPEN"
          - "no DamageClaim references this incident with claim_state NOT IN {CLOSED_DENIED} (else ERR_INCIDENT_HAS_LIVE_CLAIM)"
        side_effects:
          - "sets dismiss_reason_code from the request and leaves substantiated false"
          - "Guest.substantiated_incident_count is unchanged, so Guest.risk_score does not move — the divergence from the ACKNOWLEDGED branch"
          - "response_sla_breached is frozen at its current value and the sweep stops considering this incident"
          - "increments Incident.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED_LAW_ENFORCEMENT
        trigger: "POST /rentals/incidents/{id}/escalate"
        actor: TrustAdjudicator
        preconditions:
          - "incident_state == ACKNOWLEDGED"
          - "severity == HIGH, or incident_type IN {SAFETY_THREAT, UNAUTHORIZED_EVENT} (else ERR_ESCALATION_NOT_WARRANTED)"
          - "law_enforcement_ref is supplied and non-empty"
        side_effects:
          - "sets law_enforcement_ref and sets escalated to true permanently"
          - "Guest.escalated_incident_count increases by 1 (the count reads escalated == true, so it survives closure)"
          - "that count change re-runs calculations.guest_risk_score with ESCALATION_PENALTY (+25 each)"
          - "increments Guest.version by 1 and Incident.version by 1"
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /rentals/incidents/{id}/close"
        actor: TrustAdjudicator
        preconditions:
          - "incident_state == ACKNOWLEDGED"
          - "no DamageClaim references this incident with claim_state IN {AWAITING_EVIDENCE, UNDER_REVIEW, APPEALED} (else ERR_INCIDENT_HAS_LIVE_CLAIM)"
        side_effects:
          - "Guest.substantiated_incident_count is unchanged because CLOSED remains inside the counted state set — the risk penalty is not undone"
          - "increments Incident.version by 1"
      - from: ESCALATED_LAW_ENFORCEMENT
        to: CLOSED
        trigger: "POST /rentals/incidents/{id}/close"
        actor: TrustAdjudicator
        preconditions:
          - "incident_state == ESCALATED_LAW_ENFORCEMENT"
          - "no DamageClaim references this incident with claim_state IN {AWAITING_EVIDENCE, UNDER_REVIEW, APPEALED}"
        side_effects:
          - "Guest.escalated_incident_count is unchanged because escalated stays true — both penalties survive closure"
          - "increments Incident.version by 1"

  - entity: DamageClaim
    dimension: claim_state
    initial_state: AWAITING_EVIDENCE
    terminal_states: [SETTLED, CLOSED_DENIED]
    note: "Cyclic machine: AWAITING_EVIDENCE <-> UNDER_REVIEW may loop up to MAX_EVIDENCE_ROUNDS (2), and APPROVED/DENIED -> APPEALED -> APPROVED/DENIED is a second, single-pass loop."
    transitions:
      - from: AWAITING_EVIDENCE
        to: UNDER_REVIEW
        trigger: "POST /rentals/damage-claims/{id}/submit-for-review"
        actor: Host
        preconditions:
          - "claim_state == AWAITING_EVIDENCE"
          - "X-User-ID == host_id (else ERR_NOT_RESOURCE_OWNER)"
          - "the evidence set satisfies calculations.evidence_requirement for claimed_amount_cents (else ERR_EVIDENCE_INCOMPLETE)"
        side_effects:
          - "sets submitted_for_review_at to the logical clock now, which recomputes adjudication_due_at"
          - "pins projected_recovery_cents from calculations.claim_recovery variant provisional_at_submission, using claimed_amount_cents as the gross"
          - "increments DamageClaim.version by 1"
      - from: UNDER_REVIEW
        to: AWAITING_EVIDENCE
        trigger: "POST /rentals/damage-claims/{id}/request-evidence"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == UNDER_REVIEW"
          - "evidence_round < MAX_EVIDENCE_ROUNDS (2) (else ERR_EVIDENCE_ROUNDS_EXHAUSTED)"
        side_effects:
          - "evidence_round increases by 1, so subsequent ClaimEvidence rows are stamped with the new round"
          - "clears submitted_for_review_at back to null, which makes adjudication_due_at null again and stops the SLA sweep"
          - "increments DamageClaim.version by 1"
        note: "Loop back edge; the second traversal is refused because evidence_round has reached the cap."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /rentals/damage-claims/{id}/decide with decision == APPROVE"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == UNDER_REVIEW"
          - "0 < approved_amount_cents <= claimed_amount_cents (else ERR_APPROVED_AMOUNT_INVALID)"
          - "Reservation.stay_state == COMPLETED"
        side_effects:
          - "sets decided_at, decided_by_user_id to X-User-ID, decision_reason_code and approved_amount_cents; recomputes appeal_due_at"
          - "runs calculations.claim_recovery variant final_at_decision: writes one SettlementAllocation per charged layer in layer_order, sets deposit_applied_cents, recovered_cents, uncovered_cents and host_absorbed_cents"
          - "each new allocation raises CoverageLayer.consumed_cents; a layer reaching its limit_cents flips layer_state to EXHAUSTED, which can flip Property.coverage_posture to UNPROTECTED and suspend the listing (5 links)"
          - "when deposit_applied_cents > 0, Reservation.deposit_state moves HELD -> APPLIED and Guest.deposit_held_cents drops by the reservation's deposit_hold_cents"
          - "Guest.approved_claim_count increases by 1, re-running calculations.guest_risk_score with CLAIM_PENALTY (+7 each)"
          - "increments DamageClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /rentals/damage-claims/{id}/decide with decision == DENY"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == UNDER_REVIEW"
          - "approved_amount_cents is absent or 0 (else ERR_APPROVED_AMOUNT_INVALID)"
        side_effects:
          - "sets decided_at, decided_by_user_id to X-User-ID and decision_reason_code; recomputes appeal_due_at"
          - "leaves approved_amount_cents, recovered_cents, uncovered_cents and host_absorbed_cents at 0 and writes no SettlementAllocation rows"
          - "increments DamageClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /rentals/ops/adjudication-sweep (SLA path)"
        actor: system
        preconditions:
          - "claim_state == UNDER_REVIEW and logical clock now > adjudication_due_at"
        side_effects:
          - "sets sla_lapsed true, decision_reason_code SLA_LAPSED, decided_by_user_id to the literal string \"system\" and decided_at to the sweep instant"
          - "an appeal filed against a sweep denial is always admissible because decided_by_user_id \"system\" can never equal an adjudicator's X-User-ID"
          - "increments DamageClaim.version by 1"
      - from: APPROVED
        to: APPEALED
        trigger: "POST /rentals/damage-claims/{id}/appeal"
        actor: Guest
        preconditions:
          - "claim_state == APPROVED"
          - "appeal_round == 0 (else ERR_APPEAL_ALREADY_FILED)"
          - "logical clock now <= appeal_due_at (else ERR_APPEAL_WINDOW_CLOSED)"
          - "X-User-ID == Reservation.guest_id — only the charged party may appeal an approval (else ERR_APPEAL_ROLE_MISMATCH)"
        side_effects:
          - "appeal_round becomes 1 and appealed_by_role becomes Guest"
          - "Host.payout_hold is set true, which blocks that host from creating further claims"
          - "increments Host.version by 1 and DamageClaim.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /rentals/damage-claims/{id}/appeal"
        actor: Host
        preconditions:
          - "claim_state == DENIED"
          - "appeal_round == 0 (else ERR_APPEAL_ALREADY_FILED)"
          - "logical clock now <= appeal_due_at (else ERR_APPEAL_WINDOW_CLOSED)"
          - "X-User-ID == host_id — only the refused party may appeal a denial (else ERR_APPEAL_ROLE_MISMATCH)"
        side_effects:
          - "appeal_round becomes 1 and appealed_by_role becomes Host"
          - "Host.payout_hold is NOT set on this branch, because nothing has been paid out to hold — the asymmetry against the APPROVED branch"
          - "increments DamageClaim.version by 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /rentals/damage-claims/{id}/appeal-decision with decision == OVERTURNED (appeal filed by Guest)"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == APPEALED and appealed_by_role == Guest"
          - "X-User-ID != decided_by_user_id — segregation of duties (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets appeal_decision OVERTURNED and appeal_decided_by_user_id to X-User-ID"
          - "voids every SettlementAllocation of this claim, so each CoverageLayer.consumed_cents falls back to its pre-approval value and any EXHAUSTED layer returns to AVAILABLE"
          - "a layer returning to AVAILABLE restores Property.coverage_posture, but a listing suspended by that cascade stays SUSPENDED until a host reactivates it"
          - "when Reservation.deposit_state == APPLIED it returns to HELD and Guest.deposit_held_cents is restored exactly"
          - "resets approved_amount_cents, recovered_cents, uncovered_cents, host_absorbed_cents and deposit_applied_cents to 0"
          - "Guest.approved_claim_count decreases by 1, re-running calculations.guest_risk_score"
          - "clears Host.payout_hold back to false"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /rentals/damage-claims/{id}/appeal-decision with decision == UPHELD (appeal filed by Guest)"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == APPEALED and appealed_by_role == Guest"
          - "X-User-ID != decided_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets appeal_decision UPHELD and appeal_decided_by_user_id to X-User-ID"
          - "every monetary field and every SettlementAllocation is left exactly as the first-instance approval wrote it"
          - "clears Host.payout_hold back to false"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /rentals/damage-claims/{id}/appeal-decision with decision == OVERTURNED (appeal filed by Host)"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == APPEALED and appealed_by_role == Host"
          - "0 < approved_amount_cents <= claimed_amount_cents"
          - "X-User-ID != decided_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets appeal_decision OVERTURNED, appeal_decided_by_user_id to X-User-ID and the newly approved amount"
          - "runs calculations.claim_recovery variant final_at_decision for the first time on this claim, writing SettlementAllocation rows and raising CoverageLayer.consumed_cents"
          - "sla_lapsed is left true when the denial came from the sweep, recording that the approval arrived out of band"
          - "Guest.approved_claim_count increases by 1, re-running calculations.guest_risk_score"
      - from: APPEALED
        to: DENIED
        trigger: "POST /rentals/damage-claims/{id}/appeal-decision with decision == UPHELD (appeal filed by Host)"
        actor: TrustAdjudicator
        preconditions:
          - "claim_state == APPEALED and appealed_by_role == Host"
          - "X-User-ID != decided_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets appeal_decision UPHELD and appeal_decided_by_user_id to X-User-ID"
          - "all monetary fields stay 0 and no SettlementAllocation row is written"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /rentals/ops/adjudication-sweep (settlement path)"
        actor: system
        preconditions:
          - "claim_state == APPROVED and logical clock now > appeal_due_at"
        side_effects:
          - "Host.settled_claim_count increases by 1 and Host.total_recovered_cents increases by recovered_cents"
          - "when Reservation.deposit_state == APPLIED it moves to RELEASED with deposit_refunded_cents = deposit_hold_cents - deposit_applied_cents"
          - "no appeal may be filed afterwards because SETTLED is terminal"
      - from: DENIED
        to: CLOSED_DENIED
        trigger: "POST /rentals/ops/adjudication-sweep (settlement path)"
        actor: system
        preconditions:
          - "claim_state == DENIED and logical clock now > appeal_due_at"
        side_effects:
          - "Host.denied_claim_count increases by 1 and Host.total_recovered_cents is unchanged"
          - "when the reservation's deposit is still HELD and the claim window has closed, deposit_state moves to RELEASED with a full refund"

  - entity: BlocklistEntry
    dimension: entry_state
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    note: "Dimension 1 of 2. ACTIVE <-> DISPUTED is a cycle: a dispute that confirms the grounds returns the entry to ACTIVE, and the guest may not dispute twice."
    transitions:
      - from: ACTIVE
        to: DISPUTED
        trigger: "POST /rentals/blocklist-entries/{id}/dispute"
        actor: Guest
        preconditions:
          - "entry_state == ACTIVE"
          - "dispute_window_state == OPEN (else ERR_DISPUTE_WINDOW_CLOSED)"
          - "X-User-ID == guest_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "sets dispute_statement_code from the request"
          - "cross-dimension cascade: dispute_window_state moves OPEN -> DISPUTED in the same request"
          - "the entry keeps blocking confirmations while DISPUTED — enforcement is not suspended by the dispute"
          - "increments BlocklistEntry.version by 1"
      - from: DISPUTED
        to: ACTIVE
        trigger: "POST /rentals/blocklist-entries/{id}/dispute-decision with dispute_reason_code == GROUNDS_CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "entry_state == DISPUTED"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets dispute_reason_code GROUNDS_CONFIRMED and dispute_decided_by_user_id to X-User-ID"
          - "dispute_window_state moves DISPUTED -> RESOLVED, so no second dispute is admissible"
          - "Guest.active_blocklist_scope_count is unchanged because the entry never left the enforcing set"
        note: "Back edge of the cycle; the entry is enforceable again but its dispute right is spent."
      - from: DISPUTED
        to: LIFTED
        trigger: "POST /rentals/blocklist-entries/{id}/dispute-decision with dispute_reason_code IN {GROUNDS_WITHDRAWN, IDENTITY_ERROR}"
        actor: ComplianceOfficer
        preconditions:
          - "entry_state == DISPUTED"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets dispute_reason_code and dispute_decided_by_user_id to X-User-ID"
          - "dispute_window_state moves DISPUTED -> RESOLVED"
          - "Guest.active_blocklist_scope_count decreases by 1 and the guest becomes confirmable again"
          - "reservations already cancelled by this ban are NOT reinstated — the cancellation is not compensated"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /rentals/blocklist-entries/{id}/lift"
        actor: ComplianceOfficer
        preconditions:
          - "entry_state == ACTIVE"
        side_effects:
          - "Guest.active_blocklist_scope_count decreases by 1"
          - "dispute_window_state is left where it stands — an OPEN window on a LIFTED entry can still lapse to EXPIRED in the sweep"
      - from: ACTIVE
        to: LIFTED
        trigger: "system event: a broader BlocklistEntry is created with supersedes_entry_id pointing at this entry"
        actor: system
        preconditions:
          - "entry_state == ACTIVE"
          - "the superseding entry's scope is strictly broader (PROPERTY < HOST < PLATFORM)"
        side_effects:
          - "Guest.active_blocklist_scope_count is recomputed over the remaining enforcing entries, so the net change is zero when the broader entry replaces exactly one narrower entry"

  - entity: BlocklistEntry
    dimension: dispute_window_state
    initial_state: OPEN
    terminal_states: [RESOLVED, EXPIRED]
    note: "Dimension 2 of 2; advances on its own clock and can reach EXPIRED while entry_state is still ACTIVE or already LIFTED."
    transitions:
      - from: OPEN
        to: DISPUTED
        trigger: "POST /rentals/blocklist-entries/{id}/dispute"
        actor: Guest
        preconditions:
          - "dispute_window_state == OPEN"
          - "logical clock now <= dispute_due_at"
        side_effects:
          - "entry_state moves ACTIVE -> DISPUTED in the same request"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /rentals/blocklist-entries/{id}/dispute-decision"
        actor: ComplianceOfficer
        preconditions:
          - "dispute_window_state == DISPUTED"
        side_effects:
          - "entry_state moves to ACTIVE or LIFTED depending on dispute_reason_code"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /rentals/ops/adjudication-sweep (dispute-window path)"
        actor: system
        preconditions:
          - "dispute_window_state == OPEN and logical clock now > dispute_due_at"
        side_effects:
          - "entry_state is untouched — an ACTIVE entry stays enforceable and a LIFTED entry stays lifted"
          - "a later dispute attempt fails with ERR_DISPUTE_WINDOW_CLOSED"

concurrency_rules:
  - rule_id: reservation-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /rentals/reservations"
    occ_field: "expected_property_version"
    description: |
      Booking a listing pins the listing terms the guest agreed to — nightly rate, protection
      product, deposit amount, waiver fee, claim ceiling, event policy and turnover buffer are all
      copied or applied at creation. The request therefore carries the Property.version the guest
      priced against, and the server refuses the booking when that version no longer matches the
      stored one, because the host has since repriced or re-configured the listing and the pinned
      terms would be stale. A second booking of an unchanged listing is legitimate product
      behaviour, so no state precondition can express this rule — only the version check can.
    error_id: ERR_PROPERTY_VERSION_STALE
    http_status: 412

  - rule_id: claim-create-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /rentals/damage-claims"
    occ_field: "expected_reservation_version"
    description: |
      A damage claim is filed against a specific settled position of the stay — the deposit hold
      still standing on it and the claim window computed from its checkout. The host submits the
      Reservation.version it inspected, and the server refuses the claim when the stored version has
      moved on, because the deposit may already have been released or applied by another claim.
      Filing a second claim against the same completed stay is permitted product behaviour, so the
      rejection cannot be reduced to a state precondition.
    error_id: ERR_RESERVATION_VERSION_STALE
    http_status: 412

  - rule_id: blocklist-create-stale-guest
    parent_entity: Guest
    write_endpoint: "POST /rentals/blocklist-entries"
    occ_field: "expected_guest_version"
    description: |
      Every ban is justified by the guest's evidence position at the moment it was written: the
      substantiated incident count, the approved claim count or the CRITICAL risk tier named in
      reason_code. The creator submits the Guest.version those grounds were read from, and the server
      refuses the entry when the stored version has advanced, because a claim overturned on appeal or
      a document expiry may have moved the grounds out from under it. A second, broader ban on an
      unchanged guest is legitimate (that is exactly what supersedes_entry_id is for), so this is a
      genuine version check and not a disguised state precondition.
    error_id: ERR_GUEST_VERSION_STALE
    http_status: 412

calculations:
  - name: guest_verification_state
    trigger: "Recomputed whenever an IdentityDocument for the guest is created, reviewed or expired by the sweep; read by guest_risk_score and by reservation creation."
    algorithm: threshold
    formula: |
      docs = IdentityDocument rows with guest_id == Guest.id
      accepted_doc_count     = count(docs where review_state == ACCEPTED)
      accepted_gov_id_count  = count(docs where review_state == ACCEPTED and doc_type == GOVERNMENT_ID)
      # evaluated top-down; the FIRST matching clause wins
      if accepted_gov_id_count >= MIN_ACCEPTED_GOV_IDS and accepted_doc_count >= MIN_ACCEPTED_DOCS:
          return VERIFIED
      if exists(docs where review_state == PENDING):
          return PENDING_REVIEW
      if exists(docs where review_state == EXPIRED):
          return VERIFICATION_EXPIRED
      return UNVERIFIED
    input_set: "All IdentityDocument rows of the guest regardless of review_state; REJECTED rows contribute to neither count and to no clause, so a guest holding only REJECTED documents reads UNVERIFIED."
    constants:
      MIN_ACCEPTED_GOV_IDS: 1
      MIN_ACCEPTED_DOCS: 2
    precision: "Integer counts; no rounding."

  - name: guest_risk_score
    trigger: "Recomputed on every change to a Guest's verification_state, completed_stay_count, payment_risk_signal, chargeback_count, substantiated_incident_count, escalated_incident_count or approved_claim_count. Also evaluated once inside POST /rentals/reservations to pin the booking snapshot."
    algorithm: weighted_scoring
    formula: |
      raw = BASE_RISK
          + (verification_state == VERIFIED ? VERIFIED_CREDIT : 0)
          + max(STAY_CREDIT_FLOOR, STAY_CREDIT_PER_STAY * completed_stay_count)
          + PAYMENT_SIGNAL_PENALTY[payment_risk_signal]
          + CHARGEBACK_PENALTY * chargeback_count
          + min(INCIDENT_PENALTY_CAP,
                INCIDENT_PENALTY   * substantiated_incident_count
              + ESCALATION_PENALTY * escalated_incident_count)
          + CLAIM_PENALTY * approved_claim_count
      risk_score = clamp(SCORE_MIN, SCORE_MAX, raw)

      # tier bands are inclusive on both ends and read from risk_score, never from raw
      risk_tier = LOW       when  0 <= risk_score <= 24
                  ELEVATED  when 25 <= risk_score <= 49
                  HIGH      when 50 <= risk_score <= 74
                  CRITICAL  when 75 <= risk_score <= 100

      # cascade fired only by the live_current variant
      if risk_tier == CRITICAL and no BlocklistEntry exists with guest_id == Guest.id,
         scope == PLATFORM and entry_state IN {ACTIVE, DISPUTED}:
          create BlocklistEntry(scope=PLATFORM, reason_code=RISK_TIER_CRITICAL,
                                auto_generated=true, created_by_role=system,
                                created_by_user_id="system")
          -> that entry cancels every Reservation of the guest with
             stay_state IN {REQUESTED, CONFIRMED} and check_in_at > now
    input_set: "Only the seven Guest aggregate fields listed in trigger. An escalated incident is necessarily also substantiated, so it contributes INCIDENT_PENALTY and ESCALATION_PENALTY together (9 + 25 = 34) before the cap is applied."
    constants:
      BASE_RISK: 35
      VERIFIED_CREDIT: -15
      STAY_CREDIT_PER_STAY: -4
      STAY_CREDIT_FLOOR: -20
      PAYMENT_SIGNAL_PENALTY: { CLEAN: 0, WATCH: 12, ADVERSE: 30 }
      CHARGEBACK_PENALTY: 5
      INCIDENT_PENALTY: 9
      ESCALATION_PENALTY: 25
      INCIDENT_PENALTY_CAP: 40
      CLAIM_PENALTY: 7
      SCORE_MIN: 0
      SCORE_MAX: 100
    precision: "All terms are integers; no rounding anywhere. Evaluation order is pinned: (1) the stay credit is floored at STAY_CREDIT_FLOOR before it enters the sum, (2) INCIDENT_PENALTY_CAP caps ONLY the incident+escalation subtotal and never the chargeback or claim terms, (3) the SCORE_MIN..SCORE_MAX clamp is applied exactly once to the finished sum, never per term."
    variants:
      - name: live_current
        when: "Reading Guest.risk_score / Guest.risk_tier at any time, and every recomputation triggered by a cascade."
        difference: "Reads the guest's aggregates as they stand now and fires the CRITICAL auto-blocklist cascade. Worked example: a VERIFIED guest with 0 stays, CLEAN signal and no history scores 35 - 15 = 20 -> LOW; after payment_risk_signal becomes ADVERSE the same guest scores 35 - 15 + 30 = 50, which is exactly the HIGH floor; after 5 chargebacks are also recorded the score is 75, exactly the CRITICAL floor."
      - name: booking_snapshot
        when: "Inside POST /rentals/reservations, to fill Reservation.risk_score_at_booking and Reservation.risk_tier_at_booking."
        difference: "Identical arithmetic, but the result is frozen on the Reservation row and never recomputed: no later incident, claim, chargeback, document expiry or completed stay moves it, and the snapshot fires no cascade. Divergence is observable on identical data — a reservation booked while the guest read 20/LOW still reports risk_score_at_booking 20 and risk_tier_at_booking LOW after an acknowledged incident has pushed Guest.risk_score to 29/ELEVATED, and the waiver fee stays priced at the LOW multiplier."

  - name: effective_max_occupancy
    trigger: "Evaluated on POST /rentals/reservations (guest_count validation) and on POST /rentals/incidents/{id}/acknowledge for OVER_OCCUPANCY reports."
    algorithm: threshold
    formula: |
      effective_max_occupancy = min(Property.max_occupancy,
                                    JurisdictionRule.max_occupancy_cap)
    input_set: "The reservation's Property and that property's JurisdictionRule."
    constants: {}
    precision: "Integer; the comparison in reservation validation is guest_count > effective_max_occupancy (equality is allowed), while incident substantiation uses observed_occupancy > effective_max_occupancy."

  - name: sensor_compliance_state
    trigger: "Recomputed whenever a MonitoringDevice of the property is created, submitted, approved or rejected; read by POST /rentals/reservations/{id}/confirm and by the listing state machine."
    algorithm: aggregation
    formula: |
      devices = MonitoringDevice rows with property_id == Property.id
      if exists(devices where disclosure_state == REJECTED):    return NON_COMPLIANT
      if exists(devices where disclosure_state IN {DRAFT, PENDING_REVIEW}): return PENDING_REVIEW
      return COMPLIANT      # includes the empty-device case
    input_set: "Every MonitoringDevice of the property. A property with no devices at all is COMPLIANT — the vacuous case is deliberately permissive so an unmonitored listing is bookable."
    constants: {}
    precision: "Enum; clause order is pinned — a single REJECTED device makes the whole listing NON_COMPLIANT even when other devices are APPROVED."

  - name: coverage_posture
    trigger: "Recomputed whenever a CoverageLayer visible to the property is created, consumed by a settlement, or restored by an overturned appeal."
    algorithm: aggregation
    formula: |
      visible = CoverageLayer rows where scope == PLATFORM_GLOBAL
                                     or property_id == Property.id
      available = visible where layer_state == AVAILABLE
      if count(available) == 0:              return UNPROTECTED
      if count(available) < count(visible):  return REDUCED
      return FULL
    input_set: "Platform-global layers plus the property's own layers. A property with no visible layer at all counts as UNPROTECTED (0 available of 0 visible)."
    constants: {}
    precision: "Enum; the UNPROTECTED clause is evaluated before REDUCED so the empty-set case cannot fall through to FULL."

  - name: reservation_charge
    trigger: "Evaluated exactly once inside POST /rentals/reservations, after risk_tier_at_booking has been pinned."
    algorithm: tiered_pricing
    formula: |
      nights                 = date_diff_days(check_out, check_in)        # half-open [check_in, check_out)
      accommodation_cents    = Property.nightly_rate_cents * nights

      if Property.protection_product == WAIVER:
          deposit_hold_cents = 0
          waiver_fee_cents   = round_half_up(Property.waiver_nightly_fee_cents
                                             * nights
                                             * WAIVER_RISK_MULTIPLIER[risk_tier_at_booking])
      else:
          deposit_hold_cents = Property.deposit_amount_cents
          waiver_fee_cents   = 0

      pre_fee_subtotal_cents = accommodation_cents + waiver_fee_cents

      # STEP 1 - select the tier from the pre-fee subtotal, and only from it
      trust_fee_pct = (pre_fee_subtotal_cents < TRUST_FEE_TIER_BREAK_CENTS)
                      ? TRUST_FEE_PCT_LOW : TRUST_FEE_PCT_HIGH
      # STEP 2 - apply it once
      trust_fee_cents        = round_half_up(pre_fee_subtotal_cents * trust_fee_pct)
      total_charged_cents    = pre_fee_subtotal_cents + trust_fee_cents
    input_set: "The reservation's own nights, the listing's pricing and product configuration, and the pinned risk_tier_at_booking. Nothing recomputes this after creation, so a later repricing of the listing never moves a booked charge."
    constants:
      CHECK_IN_HOUR_UTC: 15
      CHECK_OUT_HOUR_UTC: 11
      CLAIM_FILING_WINDOW_HOURS: 72
      WAIVER_RISK_MULTIPLIER: { LOW: 1.00, ELEVATED: 1.25, HIGH: 1.60, CRITICAL: 2.00 }
      TRUST_FEE_TIER_BREAK_CENTS: 100000
      TRUST_FEE_PCT_LOW: 0.035
      TRUST_FEE_PCT_HIGH: 0.025
    precision: "Cents, round_half_up, applied exactly twice: once to the waiver fee and once to the trust fee. Both roundings act on the full product, never per night. The tier selection in STEP 1 is PINNED to pre_fee_subtotal_cents and is NEVER re-selected from total_charged_cents even when adding the fee pushes the total across TRUST_FEE_TIER_BREAK_CENTS. Worked example (nightly 30000, 3 nights, WAIVER, nightly waiver fee 3000, tier LOW): accommodation 90000, waiver 9000, pre_fee_subtotal 99000 -> 99000 < 100000 so trust_fee_pct 0.035, trust_fee 3465, total 102465. The total exceeds the break, but re-selecting 0.025 would give 2562 and a total of 101562, which is WRONG. Same listing at tier ELEVATED: waiver round_half_up(3000 * 3 * 1.25) = 11250, pre_fee_subtotal 101250 -> trust_fee_pct 0.025, trust_fee 2531, total 103781."

  - name: screening_decision
    trigger: "Evaluated exactly once inside POST /rentals/reservations, after risk_tier_at_booking and the charge have been pinned; sets screening_state and screening_reason_code."
    algorithm: constraint_propagation
    formula: |
      # top-down decision table; the FIRST matching clause wins and no later clause is consulted
      1. risk_tier_at_booking == CRITICAL
             -> DENIED,         RISK_CRITICAL
      2. event_declared and (JurisdictionRule.events_prohibited
                             or Property.event_policy == EVENTS_PROHIBITED)
             -> DENIED,         EVENT_PROHIBITED
      3. event_declared and risk_tier_at_booking == HIGH
             -> DENIED,         EVENT_RISK
      4. event_declared                       # tiers LOW and ELEVATED only, events permitted
             -> MANUAL_REVIEW,  EVENT_REVIEW
      5. risk_tier_at_booking == HIGH
             -> MANUAL_REVIEW,  HIGH_RISK_REVIEW
      6. risk_tier_at_booking == ELEVATED and guest_count >= Property.max_occupancy
             -> MANUAL_REVIEW,  ELEVATED_FULL_HOUSE
      7. otherwise
             -> CLEARED,        LOW_RISK_AUTO_CLEAR
    input_set: "The pinned risk_tier_at_booking, the requested event_declared and guest_count, the listing's event_policy and max_occupancy, and the jurisdiction's events_prohibited flag."
    constants: {}
    precision: "Enum; clause order is pinned. Clause 1 dominates clause 2, so a CRITICAL guest declaring an event in an event-prohibiting jurisdiction is denied with RISK_CRITICAL, not EVENT_PROHIBITED. Clause 6 compares against Property.max_occupancy with >=, while the occupancy validation compares guest_count against effective_max_occupancy with >, so a booking at exactly max_occupancy is accepted by validation and then routed to MANUAL_REVIEW."

  - name: evidence_requirement
    trigger: "Evaluated on POST /rentals/damage-claims/{id}/submit-for-review; a failure yields ERR_EVIDENCE_INCOMPLETE and no state change."
    algorithm: threshold
    formula: |
      ev = ClaimEvidence rows with claim_id == DamageClaim.id
      required = { PHOTO: MIN_PHOTO_COUNT }
      if claimed_amount_cents >= RECEIPT_REQUIRED_AT_CENTS:        required[RECEIPT]        = 1
      if claimed_amount_cents >= POLICE_REPORT_REQUIRED_AT_CENTS:  required[POLICE_REPORT]  = 1
      if incident_id is non-null and that Incident.source == SENSOR:
                                                                   required[SENSOR_LOG]     = 1
      for each (type, n) in required:
          if count(ev where evidence_type == type) < n: FAIL
      if evidence_round > 1 and count(ev where evidence_round == DamageClaim.evidence_round) == 0:
          FAIL                      # a reopened round demands at least one newly stamped artifact
      PASS
    input_set: "Every ClaimEvidence row of the claim counts toward the per-type minimums regardless of which round stamped it; only the final freshness clause looks at evidence_round."
    constants:
      MIN_PHOTO_COUNT: 2
      RECEIPT_REQUIRED_AT_CENTS: 50000
      POLICE_REPORT_REQUIRED_AT_CENTS: 250000
    precision: "Integer counts; both money thresholds use >=, so a claim of exactly 50000 requires a RECEIPT and a claim of 49999 does not."

  - name: claim_recovery
    trigger: "Evaluated on POST /rentals/damage-claims/{id}/submit-for-review (provisional variant) and on every decision that approves the claim — POST /rentals/damage-claims/{id}/decide with APPROVE and POST /rentals/damage-claims/{id}/appeal-decision that overturns a denial (final variant)."
    algorithm: waterfall_allocation
    formula: |
      gross_remaining = G                       # per variant, see variants below
      # STEP 1 - the guest's own security deposit absorbs the loss first
      deposit_slice = (Reservation.deposit_state == HELD)
                      ? min(gross_remaining,
                            Reservation.deposit_hold_cents - Reservation.deposit_applied_cents)
                      : 0
      gross_remaining -= deposit_slice

      # STEP 2 - eligible insurance layers, in a deterministic order
      eligible = CoverageLayer rows where layer_state == AVAILABLE
                   and (scope == PLATFORM_GLOBAL or property_id == Reservation.property_id)
                   and (source != DAMAGE_WAIVER or Property.protection_product == WAIVER)
      order eligible by layer_order asc, then created_at asc     # never by id

      # STEP 3 - fill each layer before touching the next
      sequence_index = 0
      for layer in eligible:
          if gross_remaining == 0: break
          capacity = layer.limit_cents - layer.consumed_cents
          if capacity <= 0: continue
          charged_gross = min(gross_remaining, capacity)
          net           = max(0, charged_gross - layer.deductible_cents)
          allocated     = round_half_up(net * layer.coverage_pct)   # ROUNDED PER LINE
          emit SettlementAllocation(coverage_layer_id = layer.id,
                                    sequence_index    = sequence_index,
                                    gross_cents       = charged_gross,
                                    deductible_cents  = layer.deductible_cents,
                                    allocated_cents   = allocated,
                                    voided            = false)
          gross_remaining -= charged_gross
          sequence_index  += 1

      # STEP 4 - close the books
      recovered_cents     = deposit_slice + sum(allocated_cents over emitted lines)
      uncovered_cents     = gross_remaining
      host_absorbed_cents = G - recovered_cents
      # conserved invariant: recovered_cents + host_absorbed_cents == G, exactly, always
    input_set: "The reservation's live deposit position plus every AVAILABLE CoverageLayer visible to the reservation's property. EXHAUSTED layers and layers of another property are skipped; a DAMAGE_WAIVER layer is skipped entirely on a DEPOSIT listing. When no layer is eligible the loop body never runs, recovered_cents equals deposit_slice alone and uncovered_cents equals the whole post-deposit remainder."
    constants: {}
    precision: "Cents, round_half_up, applied ONCE PER ALLOCATION LINE to (charged_gross - deductible) * coverage_pct — never to the summed net across layers. The two orders diverge: approving 300000 with no deposit against layer A (limit 130000, deductible 24990, pct 0.85) and layer B (limit 400000, deductible 14990, pct 0.65) gives lines 89259 and 100757 for recovered_cents 190016, whereas rounding the aggregate 190015.5 in one step would give 190015. Per-line rounding is authoritative."
    variants:
      - name: provisional_at_submission
        when: "At each POST /rentals/damage-claims/{id}/submit-for-review, to pin DamageClaim.projected_recovery_cents."
        difference: "G = min(claimed_amount_cents, Property.claim_ceiling_cents) — the host's full ask, not an adjudicated figure. Writes NO SettlementAllocation rows, does not touch CoverageLayer.consumed_cents, does not move Reservation.deposit_state, and sets only projected_recovery_cents. Because capacity is read at submission time it can promise capacity that a competing claim consumes before the decision lands."
      - name: final_at_decision
        when: "At the approving decision, to set approved/recovered/uncovered/host_absorbed and to write the ledger."
        difference: "G = approved_amount_cents, and the run has real side effects: it emits SettlementAllocation rows, raises CoverageLayer.consumed_cents (possibly to EXHAUSTED), moves Reservation.deposit_state HELD -> APPLIED and writes recovered_cents, uncovered_cents and host_absorbed_cents. Divergence on identical inputs: a claim of 300000 against a 250000/20000/0.75 platform layer with a 50000 deposit projects recovered 222500 with uncovered 0 at submission, but if another claim consumes 100000 of that layer first, the same claim approved at 300000 recovers only 147500 and leaves uncovered_cents 100000 — a 75000 delta on an unchanged claim."

  - name: availability_conflict
    trigger: "Evaluated on POST /rentals/reservations, before the charge is computed; the two clauses raise different errors."
    algorithm: interval_merge
    formula: |
      # CLAUSE A - listing calendar, HALF-OPEN with a turnover buffer on the trailing edge
      for r in Reservation rows where property_id == requested property
                                  and stay_state IN {REQUESTED, CONFIRMED, IN_STAY}:
          blocked = [ r.check_in , r.check_out + Property.turnover_buffer_nights )
          if [check_in, check_out) intersects blocked: FAIL ERR_PROPERTY_CALENDAR_CONFLICT

      # CLAUSE B - the guest cannot be in two places at once, CLOSED intervals
      for r in Reservation rows where guest_id == requested guest
                                  and stay_state IN {REQUESTED, CONFIRMED, IN_STAY}:
          if [check_in, check_out] intersects [r.check_in, r.check_out]:
              FAIL ERR_GUEST_STAY_OVERLAP
    input_set: "Only reservations in the three live stay states block; CANCELLED and COMPLETED rows never conflict. Clause A is property-scoped, clause B is guest-scoped and spans every listing."
    constants: {}
    precision: "Calendar dates. The two clauses use DIFFERENT interval geometry on purpose. Clause A is half-open, so with turnover_buffer_nights == 0 a booking starting exactly on an existing check_out date is accepted; with turnover_buffer_nights == 1 the same booking conflicts. Clause B is closed on both ends, so the guest's own back-to-back stays at two different listings collide on the shared turnover date even though clause A would have allowed each one."

  - name: adjudication_sweep
    trigger: "POST /rentals/ops/adjudication-sweep, executed by PlatformAdmin; every phase reads the logical clock once, at the instant the sweep starts."
    algorithm: chronological
    formula: |
      now = logical clock
      # PHASE 1 - identity document expiry
      for d in IdentityDocument where review_state IN {PENDING, ACCEPTED} and d.expires_on < now:
          d.review_state = EXPIRED
          -> recompute guest_verification_state -> recompute guest_risk_score (may reach CRITICAL
             and fire the auto-blocklist cascade, which cancels future-dated reservations)
      # PHASE 2 - neighbourhood complaint response SLA
      for i in Incident where incident_state == OPEN and i.response_due_at < now:
          i.response_sla_breached = true
      # PHASE 3 - adjudication SLA
      for c in DamageClaim where claim_state == UNDER_REVIEW and c.adjudication_due_at < now:
          c.claim_state = DENIED; c.sla_lapsed = true
          c.decision_reason_code = SLA_LAPSED; c.decided_by_user_id = "system"; c.decided_at = now
      # PHASE 4 - settlement of decisions whose appeal window has closed
      for c in DamageClaim where claim_state == APPROVED and c.appeal_due_at < now: -> SETTLED
      for c in DamageClaim where claim_state == DENIED   and c.appeal_due_at < now: -> CLOSED_DENIED
      # PHASE 5 - deposit release
      for r in Reservation where deposit_state == HELD and r.claim_window_ends_at < now
               and no DamageClaim on r has claim_state IN {AWAITING_EVIDENCE, UNDER_REVIEW,
                                                           APPEALED, APPROVED}:
          r.deposit_state = RELEASED; r.deposit_refunded_cents = r.deposit_hold_cents
      # PHASE 6 - blocklist dispute windows
      for b in BlocklistEntry where dispute_window_state == OPEN and b.dispute_due_at < now:
          b.dispute_window_state = EXPIRED
      # PHASE 7 - posture recomputation
      recompute Property.sensor_compliance_state and Property.coverage_posture for every property
    input_set: "Every entity whose deadline field has passed the single `now` captured at the start of the run. Rows created or moved by an earlier phase of the SAME run are visible to later phases."
    constants:
      NEIGHBOR_RESPONSE_SLA_HOURS: 24
      ADJUDICATION_SLA_HOURS: 120
      APPEAL_WINDOW_HOURS: 168
      CLAIM_FILING_WINDOW_HOURS: 72
      DISPUTE_WINDOW_HOURS: 336
    precision: "Every deadline comparison is strict (`deadline < now`), so an entity sitting exactly on its deadline survives the sweep and lapses only on the next one. Phase order is observable and pinned: PHASE 3 denies a lapsed claim and stamps appeal_due_at = now + 168h, so PHASE 4 in the SAME run cannot settle it; and because DENIED is outside the live-claim set, PHASE 5 releases that reservation's deposit in the same run — running PHASE 5 before PHASE 3 would have left the deposit HELD, which is WRONG."

validations:
  # ---- 1-3 authentication, authorization, request shape ----
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty on every business request."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin AND is listed in the target endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body carries every required field with the declared type, every enum field holds a declared value, every integer respects its declared bound, and pagination limit/offset stay within 1..100 / >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # ---- 4-6 existence and ownership ----
  - priority: 4
    category: existence
    check: "Every {id} in the path resolves to a stored row, validated left-to-right."
    error_id: "ERR_GUEST_NOT_FOUND | ERR_HOST_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_JURISDICTION_RULE_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_COVERAGE_LAYER_NOT_FOUND | ERR_BLOCKLIST_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all paths containing {id}"
  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves to a stored row, validated in the field order declared in §1.1."
    error_id: "ERR_GUEST_NOT_FOUND | ERR_HOST_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_JURISDICTION_RULE_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_COVERAGE_LAYER_NOT_FOUND | ERR_BLOCKLIST_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /rentals/properties, POST /rentals/monitoring-devices, POST /rentals/identity-documents, POST /rentals/reservations, POST /rentals/incidents, POST /rentals/damage-claims, POST /rentals/claim-evidence, POST /rentals/coverage-layers, POST /rentals/blocklist-entries"
  - priority: 6
    category: auth
    check: "When X-User-Role is Guest, X-User-ID equals the resource's guest_id; when it is Host, X-User-ID equals the owning Property.host_id (or DamageClaim.host_id)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Guest- and Host-actioned endpoints"

  # ---- 7-8 concurrency and segregation of duties ----
  - priority: 7
    category: state
    check: "The submitted expected_<parent>_version equals the stored parent version, per the §1.2.1 rule guarding this endpoint."
    error_id: "ERR_PROPERTY_VERSION_STALE | ERR_RESERVATION_VERSION_STALE | ERR_GUEST_VERSION_STALE"
    http_status: 412
    applies_to: "POST /rentals/reservations, POST /rentals/damage-claims, POST /rentals/blocklist-entries"
  - priority: 8
    category: auth
    check: "X-User-ID differs from the user who took the first-instance action — DamageClaim.decided_by_user_id on an appeal decision, BlocklistEntry.created_by_user_id on a dispute decision."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rentals/damage-claims/{id}/appeal-decision, POST /rentals/blocklist-entries/{id}/dispute-decision"

  # ---- 9-16 state preconditions ----
  - priority: 9
    category: state
    check: "The target resource is not already in a terminal state for the dimension the action would move — checked BEFORE the transition-declared check, because no transition is ever declared out of a terminal state and the terminal case must report its own error."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: state
    check: "The target resource sits in a NON-terminal state from which the requested transition is declared in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 11
    category: state
    check: "A damage claim may only be filed against a Reservation whose stay_state == COMPLETED."
    error_id: ERR_STAY_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /rentals/damage-claims"
  - priority: 12
    category: state
    check: "DamageClaim.evidence_round is below MAX_EVIDENCE_ROUNDS (2) before a further evidence round may be opened."
    error_id: ERR_EVIDENCE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /rentals/damage-claims/{id}/request-evidence"
  - priority: 13
    category: state
    check: "DamageClaim.appeal_round == 0 — the single permitted appeal has not already been filed."
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /rentals/damage-claims/{id}/appeal"
  - priority: 14
    category: business_temporal
    check: "The logical clock is at or before DamageClaim.appeal_due_at."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rentals/damage-claims/{id}/appeal"
  - priority: 15
    category: auth
    check: "Only the charged party may appeal: the Guest of the reservation against an APPROVED claim, the Host that filed it against a DENIED claim."
    error_id: ERR_APPEAL_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /rentals/damage-claims/{id}/appeal"
  - priority: 16
    category: business_temporal
    check: "BlocklistEntry.dispute_window_state == OPEN and the logical clock is at or before dispute_due_at."
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rentals/blocklist-entries/{id}/dispute"

  # ---- 17-29 safety, privacy and compliance (business_safety) ----
  - priority: 17
    category: business_safety
    check: "No BlocklistEntry with entry_state IN {ACTIVE, DISPUTED} covers the guest for this listing — PLATFORM covers every listing, HOST covers every listing of that host, PROPERTY covers the one listing."
    error_id: ERR_GUEST_BLOCKLISTED
    http_status: 409
    applies_to: "POST /rentals/reservations, POST /rentals/reservations/{id}/confirm"
  - priority: 18
    category: business_safety
    check: "A device with device_type IN {INDOOR_CAMERA, OUTDOOR_CAMERA} is never placed in a BEDROOM or BATHROOM zone — an absolute privacy floor no jurisdiction flag can unlock."
    error_id: ERR_SENSOR_PLACEMENT_PROHIBITED
    http_status: 422
    applies_to: "POST /rentals/monitoring-devices"
  - priority: 19
    category: business_safety
    check: "An INDOOR_CAMERA in a COMMON_INTERIOR zone requires JurisdictionRule.indoor_camera_allowed == true."
    error_id: ERR_SENSOR_JURISDICTION_PROHIBITED
    http_status: 422
    applies_to: "POST /rentals/monitoring-devices"
  - priority: 20
    category: business_safety
    check: "A device with records_audio == true in any zone other than EXTERIOR requires JurisdictionRule.indoor_audio_allowed == true."
    error_id: ERR_SENSOR_AUDIO_PROHIBITED
    http_status: 422
    applies_to: "POST /rentals/monitoring-devices"
  - priority: 21
    category: business_safety
    check: "Property.sensor_compliance_state == COMPLIANT — no device of the listing is REJECTED, DRAFT or PENDING_REVIEW."
    error_id: ERR_SENSOR_COMPLIANCE_BLOCKED
    http_status: 409
    applies_to: "POST /rentals/reservations/{id}/confirm"
  - priority: 22
    category: business_safety
    check: "Property.listing_state == ACTIVE at confirmation time."
    error_id: ERR_PROPERTY_NOT_LISTED
    http_status: 409
    applies_to: "POST /rentals/reservations/{id}/confirm, POST /rentals/reservations/{id}/check-in"
  - priority: 23
    category: business_safety
    check: "When JurisdictionRule.registration_required == true, Property.registration_number is non-null and non-empty before the listing may be activated."
    error_id: ERR_REGISTRATION_REQUIRED
    http_status: 422
    applies_to: "POST /rentals/properties/{id}/activate"
  - priority: 24
    category: business_safety
    check: "guest_disclosure_text is non-null and non-empty when JurisdictionRule.sensor_notice_required == true, or when device_type IN {INDOOR_CAMERA, OUTDOOR_CAMERA}, or when records_audio == true."
    error_id: ERR_DISCLOSURE_TEXT_REQUIRED
    http_status: 422
    applies_to: "POST /rentals/monitoring-devices, POST /rentals/monitoring-devices/{id}/submit-for-review"
  - priority: 25
    category: business_safety
    check: "Escalation to law enforcement requires severity == HIGH or incident_type IN {SAFETY_THREAT, UNAUTHORIZED_EVENT}, plus a non-empty law_enforcement_ref."
    error_id: ERR_ESCALATION_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /rentals/incidents/{id}/escalate"
  - priority: 26
    category: business_safety
    check: "A NOISE_VIOLATION incident may only be acknowledged when decibel_reading is non-null and >= JurisdictionRule.noise_threshold_db."
    error_id: ERR_NOISE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /rentals/incidents/{id}/acknowledge"
  - priority: 27
    category: business_safety
    check: "An OVER_OCCUPANCY incident may only be acknowledged when observed_occupancy is non-null and strictly greater than calculations.effective_max_occupancy."
    error_id: ERR_OCCUPANCY_WITHIN_LIMIT
    http_status: 422
    applies_to: "POST /rentals/incidents/{id}/acknowledge"
  - priority: 28
    category: business_referential
    check: "An incident may not be dismissed or closed while a DamageClaim referencing it is in AWAITING_EVIDENCE, UNDER_REVIEW or APPEALED."
    error_id: ERR_INCIDENT_HAS_LIVE_CLAIM
    http_status: 409
    applies_to: "POST /rentals/incidents/{id}/dismiss, POST /rentals/incidents/{id}/close"
  - priority: 29
    category: business_safety
    check: "Host.payout_hold == false — a host with an appeal pending against one of its approved claims may not file further claims."
    error_id: ERR_HOST_PAYOUT_HELD
    http_status: 409
    applies_to: "POST /rentals/damage-claims"

  # ---- 30-47 constraint satisfaction (temporal, referential, uniqueness) ----
  - priority: 30
    category: business_temporal
    check: "check_out is strictly after check_in."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /rentals/reservations"
  - priority: 31
    category: business_temporal
    check: "check_in_at is strictly after the logical clock — a stay may not be booked into the past."
    error_id: ERR_CHECK_IN_IN_PAST
    http_status: 422
    applies_to: "POST /rentals/reservations"
  - priority: 32
    category: business_constraint
    check: "nights >= JurisdictionRule.min_stay_nights of the listing's jurisdiction."
    error_id: ERR_MIN_STAY_NOT_MET
    http_status: 422
    applies_to: "POST /rentals/reservations"
  - priority: 33
    category: business_constraint
    check: "guest_count <= calculations.effective_max_occupancy — equality is accepted."
    error_id: ERR_OCCUPANCY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /rentals/reservations"
  - priority: 34
    category: business_temporal
    check: "calculations.availability_conflict clause A finds no overlap against the listing's live reservations, using half-open intervals extended by turnover_buffer_nights."
    error_id: ERR_PROPERTY_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /rentals/reservations"
  - priority: 35
    category: business_temporal
    check: "calculations.availability_conflict clause B finds no overlap against the guest's own live reservations at any listing, using closed intervals."
    error_id: ERR_GUEST_STAY_OVERLAP
    http_status: 409
    applies_to: "POST /rentals/reservations"
  - priority: 36
    category: business_temporal
    check: "The logical clock is at or before Reservation.claim_window_ends_at."
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /rentals/damage-claims"
  - priority: 37
    category: business_referential
    check: "When incident_id is supplied it must belong to the same reservation, and no other DamageClaim outside CLOSED_DENIED may already reference it."
    error_id: ERR_DUPLICATE_CLAIM_FOR_INCIDENT
    http_status: 409
    applies_to: "POST /rentals/damage-claims"
  - priority: 38
    category: business_referential
    check: "Blocklist scope coherence — property_id is required and host_id null when scope == PROPERTY; host_id required and property_id null when scope == HOST; both null when scope == PLATFORM."
    error_id: ERR_SCOPE_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /rentals/blocklist-entries"
  - priority: 39
    category: business_constraint
    check: "No BlocklistEntry with entry_state IN {ACTIVE, DISPUTED} already exists for the same guest at the same or a broader scope."
    error_id: ERR_BLOCKLIST_DUPLICATE_SCOPE
    http_status: 409
    applies_to: "POST /rentals/blocklist-entries"
  - priority: 40
    category: business_referential
    check: "When supersedes_entry_id is supplied, the referenced entry belongs to the same guest, is ACTIVE, and its scope is strictly narrower than the new entry's (PROPERTY < HOST < PLATFORM)."
    error_id: ERR_SUPERSEDE_NOT_BROADER
    http_status: 422
    applies_to: "POST /rentals/blocklist-entries"
  - priority: 41
    category: business_constraint
    check: "The reason_code is evidenced: SUBSTANTIATED_INCIDENT needs Guest.substantiated_incident_count >= 1, APPROVED_CLAIM needs Guest.approved_claim_count >= 1, RISK_TIER_CRITICAL needs Guest.risk_tier == CRITICAL, LAW_ENFORCEMENT_ESCALATION needs Guest.escalated_incident_count >= 1."
    error_id: ERR_BLOCKLIST_GROUNDS_NOT_MET
    http_status: 422
    applies_to: "POST /rentals/blocklist-entries"
  - priority: 42
    category: business_referential
    check: "Coverage layer scope coherence — property_id required when scope == PROPERTY, must be null when scope == PLATFORM_GLOBAL; a DAMAGE_WAIVER layer must be PROPERTY-scoped at a listing whose protection_product == WAIVER."
    error_id: ERR_LAYER_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /rentals/coverage-layers"
  - priority: 43
    category: business_constraint
    check: "layer_order is unique among the layers visible to the same target — across PLATFORM_GLOBAL layers, and within each property's own layers."
    error_id: ERR_LAYER_ORDER_CONFLICT
    http_status: 409
    applies_to: "POST /rentals/coverage-layers"
  - priority: 44
    category: business_constraint
    check: "Guest.email is unique case-insensitively across Guest rows, and Host.email across Host rows."
    error_id: ERR_EMAIL_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /rentals/guests, POST /rentals/hosts"
  - priority: 45
    category: business_constraint
    check: "JurisdictionRule.jurisdiction_code is unique across JurisdictionRule rows."
    error_id: ERR_JURISDICTION_CODE_TAKEN
    http_status: 409
    applies_to: "POST /rentals/jurisdiction-rules"
  - priority: 46
    category: business_constraint
    check: "amount_cents is non-null and > 0 when evidence_type IN {RECEIPT, REPAIR_ESTIMATE}, and null for every other evidence_type."
    error_id: ERR_EVIDENCE_AMOUNT_REQUIRED
    http_status: 422
    applies_to: "POST /rentals/claim-evidence"
  - priority: 47
    category: business_constraint
    check: "calculations.evidence_requirement passes for the claim's claimed_amount_cents, linked incident source and current evidence_round."
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /rentals/damage-claims/{id}/submit-for-review"

  # ---- 48-50 fiscal checks, deliberately last ----
  - priority: 48
    category: business_fiscal
    check: "Protection-product coherence — deposit_amount_cents > 0 and waiver_nightly_fee_cents == 0 when protection_product == DEPOSIT; deposit_amount_cents == 0 and waiver_nightly_fee_cents > 0 when protection_product == WAIVER."
    error_id: ERR_PRODUCT_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /rentals/properties"
  - priority: 49
    category: business_fiscal
    check: "claimed_amount_cents <= Property.claim_ceiling_cents of the reservation's listing."
    error_id: ERR_CLAIM_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /rentals/damage-claims"
  - priority: 50
    category: business_fiscal
    check: "On an approving decision 0 < approved_amount_cents <= claimed_amount_cents; on a denying decision approved_amount_cents is absent or 0."
    error_id: ERR_APPROVED_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /rentals/damage-claims/{id}/decide, POST /rentals/damage-claims/{id}/appeal-decision"

endpoints:
  # ---------- logical clock (test-driving namespace) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, window and sweep comparison reads. Before any call the clock reads exactly 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; only the clock the next request observes moves"]

  # ---------- Guest ----------
  - method: POST
    path: "/rentals/guests"
    description: "Registers a guest account. verification_state starts UNVERIFIED, risk_score is computed immediately from the BASE_RISK baseline."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, country_code]
    output: Guest
    side_effects: ["computes verification_state (UNVERIFIED), risk_score (35) and risk_tier (ELEVATED) per calculations.guest_risk_score", "sets version to 1"]
  - method: GET
    path: "/rentals/guests/{id}"
    description: "Reads one guest with every derived counter, risk_score and risk_tier."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Guest
    side_effects: []
  - method: GET
    path: "/rentals/guests"
    description: "Lists guests, filterable by risk tier and verification state."
    roles: [TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["risk_tier?", "verification_state?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []
  - method: GET
    path: "/rentals/guests/{id}/risk-profile"
    description: "Computed read of the live risk position of a guest — every term that feeds calculations.guest_risk_score, so a test can attribute a score change to a specific cascade."
    roles: [TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ risk_score: integer, risk_tier: string, verification_state: string, completed_stay_count: integer, substantiated_incident_count: integer, escalated_incident_count: integer, approved_claim_count: integer, chargeback_count: integer, active_blocklist_scope_count: integer }"
    side_effects: []
  - method: POST
    path: "/rentals/guests/{id}/payment-signals"
    description: "Records the latest payment-processor risk signal and lifetime chargeback count for a guest; both values overwrite the stored ones."
    roles: [PlatformAdmin]
    code: 200
    input: [payment_risk_signal, chargeback_count]
    output: Guest
    side_effects: ["overwrites payment_risk_signal and chargeback_count", "re-runs calculations.guest_risk_score, which may re-band risk_tier and fire the CRITICAL auto-blocklist cascade", "increments Guest.version by 1"]

  # ---------- Host ----------
  - method: POST
    path: "/rentals/hosts"
    description: "Registers a host account with payout_hold false."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, email]
    output: Host
    side_effects: ["sets payout_hold false and all claim counters to 0", "sets version to 1"]
  - method: GET
    path: "/rentals/hosts/{id}"
    description: "Reads one host with its settlement counters and payout_hold flag."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Host
    side_effects: []
  - method: GET
    path: "/rentals/hosts"
    description: "Lists hosts, filterable by payout_hold."
    roles: [TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["payout_hold?", "limit?", "offset?"]
    output: Host[]
    side_effects: []

  # ---------- JurisdictionRule ----------
  - method: POST
    path: "/rentals/jurisdiction-rules"
    description: "Publishes the immutable local rule set a listing binds to — stay minimum, occupancy cap, event ban, registration duty, sensor permissions and the noise threshold."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [jurisdiction_code, min_stay_nights, max_occupancy_cap, events_prohibited, registration_required, indoor_camera_allowed, indoor_audio_allowed, sensor_notice_required, noise_threshold_db]
    output: JurisdictionRule
    side_effects: ["immutable entity — no version field, no update endpoint"]
  - method: GET
    path: "/rentals/jurisdiction-rules/{id}"
    description: "Reads one jurisdiction rule set."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: JurisdictionRule
    side_effects: []
  - method: GET
    path: "/rentals/jurisdiction-rules"
    description: "Lists jurisdiction rule sets, filterable by jurisdiction_code."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["jurisdiction_code?", "limit?", "offset?"]
    output: JurisdictionRule[]
    side_effects: []

  # ---------- Property ----------
  - method: POST
    path: "/rentals/properties"
    description: "Creates a listing in DRAFT with its protection-product structure, occupancy, pricing and claim ceiling."
    roles: [Host]
    code: 201
    input: [host_id, jurisdiction_rule_id, address_line, city, "registration_number?", max_occupancy, bedrooms, nightly_rate_cents, protection_product, deposit_amount_cents, waiver_nightly_fee_cents, claim_ceiling_cents, event_policy, "turnover_buffer_nights?"]
    output: Property
    side_effects: ["listing_state DRAFT", "computes sensor_compliance_state (COMPLIANT with no devices) and coverage_posture per calculations.coverage_posture", "sets version to 1"]
  - method: GET
    path: "/rentals/properties/{id}"
    description: "Reads one listing with its listing_state, sensor_compliance_state, coverage_posture and open counters."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/rentals/properties"
    description: "Lists listings, filterable by host, jurisdiction and listing_state."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["host_id?", "jurisdiction_rule_id?", "listing_state?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/rentals/properties/{id}/activate"
    description: "Activates a DRAFT listing, or reinstates a SUSPENDED one. Reinstatement additionally demands coverage_posture != UNPROTECTED; first activation does not."
    roles: [Host]
    code: 200
    input: []
    output: Property
    side_effects: ["listing_state -> ACTIVE and suspension_reason cleared to null", "increments Property.version by 1"]
  - method: GET
    path: "/rentals/properties/{id}/coverage-summary"
    description: "Computed read of the insurance stack visible to a listing — how calculations.coverage_posture reached its verdict and how much capacity is left."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "{ coverage_posture: string, visible_layer_count: integer, available_layer_count: integer, remaining_capacity_cents: integer }"
    side_effects: []

  # ---------- MonitoringDevice ----------
  - method: POST
    path: "/rentals/monitoring-devices"
    description: "Registers a noise / occupancy / camera device at a listing in DRAFT disclosure state. The three privacy validations (priorities 18-20) and the disclosure-text rule (priority 24) run here."
    roles: [Host]
    code: 201
    input: [property_id, device_type, placement_zone, records_audio, "guest_disclosure_text?"]
    output: MonitoringDevice
    side_effects: ["disclosure_state DRAFT", "recomputes Property.sensor_compliance_state to PENDING_REVIEW, which blocks new confirmations but does NOT suspend an ACTIVE listing", "increments Property.version by 1", "sets version to 1"]
  - method: GET
    path: "/rentals/monitoring-devices/{id}"
    description: "Reads one monitoring device with its disclosure_state and reviewer."
    roles: [Guest, Host, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: MonitoringDevice
    side_effects: []
  - method: GET
    path: "/rentals/monitoring-devices"
    description: "Lists monitoring devices, filterable by listing and disclosure_state."
    roles: [Guest, Host, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["property_id?", "disclosure_state?", "limit?", "offset?"]
    output: MonitoringDevice[]
    side_effects: []
  - method: POST
    path: "/rentals/monitoring-devices/{id}/submit-for-review"
    description: "Submits a DRAFT device — or resubmits a REJECTED one after remediation — for compliance review, optionally replacing the disclosure text."
    roles: [Host]
    code: 200
    input: ["guest_disclosure_text?"]
    output: MonitoringDevice
    side_effects: ["disclosure_state -> PENDING_REVIEW and reject_reason_code cleared", "recomputes Property.sensor_compliance_state", "increments MonitoringDevice.version by 1"]
  - method: POST
    path: "/rentals/monitoring-devices/{id}/review"
    description: "Compliance decision on a device disclosure. APPROVE clears the listing's sensor posture; REJECT marks the listing NON_COMPLIANT and suspends it."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "reject_reason_code?"]
    output: MonitoringDevice
    side_effects: ["disclosure_state -> APPROVED or REJECTED and reviewed_by_user_id set to X-User-ID", "recomputes Property.sensor_compliance_state; on REJECT the listing moves ACTIVE -> SUSPENDED with suspension_reason SENSOR_NON_COMPLIANT", "increments MonitoringDevice.version by 1 and Property.version by 1"]

  # ---------- IdentityDocument ----------
  - method: POST
    path: "/rentals/identity-documents"
    description: "Uploads a verification artifact for a guest; the row starts PENDING, which moves the guest to PENDING_REVIEW."
    roles: [Guest]
    code: 201
    input: [guest_id, doc_type, issuing_country, document_ref, expires_on]
    output: IdentityDocument
    side_effects: ["review_state PENDING", "recomputes Guest.verification_state and Guest.risk_score", "increments Guest.version by 1", "sets version to 1"]
  - method: GET
    path: "/rentals/identity-documents/{id}"
    description: "Reads one identity document with its review_state and reviewer."
    roles: [Guest, ComplianceOfficer, TrustAdjudicator, PlatformAdmin]
    code: 200
    input: []
    output: IdentityDocument
    side_effects: []
  - method: GET
    path: "/rentals/identity-documents"
    description: "Lists identity documents, filterable by guest and review_state."
    roles: [Guest, ComplianceOfficer, TrustAdjudicator, PlatformAdmin]
    code: 200
    input: ["guest_id?", "review_state?", "limit?", "offset?"]
    output: IdentityDocument[]
    side_effects: []
  - method: POST
    path: "/rentals/identity-documents/{id}/review"
    description: "Compliance decision on a submitted document. Accepting the second document including a government ID flips the guest to VERIFIED and drops the risk score by VERIFIED_CREDIT."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "reject_reason_code?"]
    output: IdentityDocument
    side_effects: ["review_state -> ACCEPTED or REJECTED and reviewed_by_user_id set to X-User-ID", "recomputes Guest.accepted_doc_count, accepted_gov_id_count, verification_state, risk_score and risk_tier (a 4-link cascade)", "increments IdentityDocument.version by 1 and Guest.version by 1"]

  # ---------- Reservation ----------
  - method: POST
    path: "/rentals/reservations"
    description: "Requests a stay. One request pins the risk snapshot, prices the charge, runs the screening decision table and, when the decision is DENIED, cancels the booking before it is ever returned. Guarded by OCC on the listing (§1.2.1 reservation-create-stale-property)."
    roles: [Guest]
    code: 201
    input: [guest_id, property_id, check_in, check_out, guest_count, event_declared, expected_property_version]
    output: Reservation
    side_effects: ["computes nights, check_in_at, check_out_at and claim_window_ends_at", "pins risk_score_at_booking and risk_tier_at_booking per calculations.guest_risk_score variant booking_snapshot", "computes the whole charge per calculations.reservation_charge, including deposit_hold_cents", "sets screening_state and screening_reason_code per calculations.screening_decision; a DENIED decision also drives stay_state to CANCELLED with cancel_reason_code SCREENING_DENIED", "recomputes Property.open_reservation_count and increments Property.version by 1", "sets version to 1"]
  - method: GET
    path: "/rentals/reservations/{id}"
    description: "Reads one reservation across all three state dimensions plus the pinned charge and risk snapshot."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/rentals/reservations"
    description: "Lists reservations, filterable by guest, listing and either state dimension."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["guest_id?", "property_id?", "stay_state?", "screening_state?", "deposit_state?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: GET
    path: "/rentals/reservations/{id}/charge-breakdown"
    description: "Computed read of every intermediate value calculations.reservation_charge produced, so the tier-selection pin is observable independently of the stored fields."
    roles: [Guest, Host, TrustAdjudicator, PlatformAdmin]
    code: 200
    input: []
    output: "{ nights: integer, accommodation_cents: integer, waiver_fee_cents: integer, pre_fee_subtotal_cents: integer, trust_fee_pct: number, trust_fee_cents: integer, total_charged_cents: integer, deposit_hold_cents: integer }"
    side_effects: []
  - method: POST
    path: "/rentals/reservations/{id}/screening-decision"
    description: "Resolves a reservation parked in MANUAL_REVIEW. CLEAR releases it for host confirmation; DENY cancels the booking."
    roles: [TrustAdjudicator]
    code: 200
    input: [decision, "note?"]
    output: Reservation
    side_effects: ["screening_state -> CLEARED or DENIED with screening_reason_code ADJUDICATOR_CLEARED / ADJUDICATOR_DENIED and screening_decided_by_user_id set to X-User-ID", "on DENY, stay_state -> CANCELLED with cancel_reason_code SCREENING_DENIED", "increments Reservation.version by 1"]
  - method: POST
    path: "/rentals/reservations/{id}/confirm"
    description: "Host accepts a CLEARED request. This is where the blocklist, sensor-compliance and listing-state gates fire, and where a DEPOSIT listing places the security hold."
    roles: [Host]
    code: 200
    input: []
    output: Reservation
    side_effects: ["stay_state -> CONFIRMED", "on a DEPOSIT listing, deposit_state -> HELD and Guest.deposit_held_cents increases by deposit_hold_cents, incrementing Guest.version by 1", "increments Reservation.version by 1"]
  - method: POST
    path: "/rentals/reservations/{id}/check-in"
    description: "Marks the stay as started; refused until the logical clock reaches check_in_at."
    roles: [Host]
    code: 200
    input: []
    output: Reservation
    side_effects: ["stay_state -> IN_STAY", "increments Reservation.version by 1"]
  - method: POST
    path: "/rentals/reservations/{id}/complete"
    description: "Closes out the stay once the logical clock reaches check_out_at, opening the 72h damage-claim window and crediting the guest's stay history."
    roles: [Host]
    code: 200
    input: []
    output: Reservation
    side_effects: ["stay_state -> COMPLETED", "Guest.completed_stay_count increases by 1, re-running calculations.guest_risk_score with the stay credit; increments Guest.version by 1", "increments Reservation.version by 1"]
  - method: POST
    path: "/rentals/reservations/{id}/cancel"
    description: "Guest or host withdraws a REQUESTED or CONFIRMED booking; a standing deposit hold is released in full."
    roles: [Guest, Host]
    code: 200
    input: []
    output: Reservation
    side_effects: ["stay_state -> CANCELLED with cancel_reason_code GUEST_WITHDREW or HOST_WITHDREW per the acting role", "when deposit_state == HELD: deposit_state -> RELEASED, deposit_refunded_cents = deposit_hold_cents and Guest.deposit_held_cents decreases accordingly, incrementing Guest.version by 1", "recomputes Property.open_reservation_count and increments Property.version by 1", "increments Reservation.version by 1"]

  # ---------- Incident ----------
  - method: POST
    path: "/rentals/incidents"
    description: "Files a trust-and-safety incident against a stay — a sensor reading, a neighbourhood complaint or a host report. A NEIGHBOR_COMPLAINT gets a 24h response SLA."
    roles: [Host, ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [reservation_id, "sensor_device_id?", incident_type, severity, source, detected_at, description, "decibel_reading?", "observed_occupancy?", "complainant_ref?"]
    output: Incident
    side_effects: ["incident_state OPEN with substantiated false and escalated false", "computes response_due_at as detected_at + 24h when source == NEIGHBOR_COMPLAINT, else null", "sets version to 1"]
  - method: GET
    path: "/rentals/incidents/{id}"
    description: "Reads one incident with its triage state, substantiation and escalation flags."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/rentals/incidents"
    description: "Lists incidents, filterable by stay, reporting device and triage state."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["reservation_id?", "sensor_device_id?", "incident_state?", "source?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/rentals/incidents/{id}/acknowledge"
    description: "Substantiates an OPEN incident. NOISE_VIOLATION and OVER_OCCUPANCY reports must clear their measured thresholds first."
    roles: [TrustAdjudicator]
    code: 200
    input: []
    output: Incident
    side_effects: ["incident_state -> ACKNOWLEDGED and substantiated true", "Guest.substantiated_incident_count increases by 1, re-running calculations.guest_risk_score; a re-band to CRITICAL fires the auto PLATFORM blocklist, which cancels the guest's future-dated reservations and releases their holds (a 4-link cascade)", "increments Incident.version by 1 and Guest.version by 1"]
  - method: POST
    path: "/rentals/incidents/{id}/dismiss"
    description: "Closes an OPEN incident without substantiating it; the guest's risk score is left untouched."
    roles: [TrustAdjudicator]
    code: 200
    input: [dismiss_reason_code]
    output: Incident
    side_effects: ["incident_state -> DISMISSED with dismiss_reason_code recorded and substantiated left false", "no guest counter moves — the deliberate divergence from the acknowledge branch", "increments Incident.version by 1"]
  - method: POST
    path: "/rentals/incidents/{id}/escalate"
    description: "Refers an ACKNOWLEDGED incident to law enforcement; permitted only for HIGH severity or for SAFETY_THREAT / UNAUTHORIZED_EVENT types."
    roles: [TrustAdjudicator]
    code: 200
    input: [law_enforcement_ref]
    output: Incident
    side_effects: ["incident_state -> ESCALATED_LAW_ENFORCEMENT, law_enforcement_ref stored and escalated set true permanently", "Guest.escalated_incident_count increases by 1, re-running calculations.guest_risk_score with ESCALATION_PENALTY", "increments Incident.version by 1 and Guest.version by 1"]
  - method: POST
    path: "/rentals/incidents/{id}/close"
    description: "Files an ACKNOWLEDGED or ESCALATED_LAW_ENFORCEMENT incident away; blocked while a live damage claim references it."
    roles: [TrustAdjudicator]
    code: 200
    input: []
    output: Incident
    side_effects: ["incident_state -> CLOSED", "both risk penalties survive: CLOSED stays inside the substantiated count set and escalated is never unset", "increments Incident.version by 1"]

  # ---------- DamageClaim ----------
  - method: POST
    path: "/rentals/damage-claims"
    description: "Opens a damage claim against a COMPLETED stay inside its 72h window. Guarded by OCC on the reservation (§1.2.1 claim-create-stale-reservation)."
    roles: [Host]
    code: 201
    input: [reservation_id, "incident_id?", claimed_amount_cents, description, expected_reservation_version]
    output: DamageClaim
    side_effects: ["claim_state AWAITING_EVIDENCE with evidence_round 1", "copies host_id from the reservation's Property.host_id", "recomputes Property.open_claim_count and increments Reservation.version by 1", "sets version to 1"]
  - method: GET
    path: "/rentals/damage-claims/{id}"
    description: "Reads one claim with its adjudication state, deadlines, appeal position and full money breakdown."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/rentals/damage-claims"
    description: "Lists claims, filterable by stay, linked incident, host and adjudication state."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["reservation_id?", "incident_id?", "host_id?", "claim_state?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: GET
    path: "/rentals/damage-claims/{id}/settlement-summary"
    description: "Computed read reconciling the conserved quantity — approved_amount_cents against the deposit slice, the layer allocations, the uncovered tail and the host's absorbed share."
    roles: [Guest, Host, TrustAdjudicator, PlatformAdmin]
    code: 200
    input: []
    output: "{ approved_amount_cents: integer, deposit_applied_cents: integer, allocation_count: integer, allocated_total_cents: integer, recovered_cents: integer, uncovered_cents: integer, host_absorbed_cents: integer }"
    side_effects: []
  - method: POST
    path: "/rentals/damage-claims/{id}/submit-for-review"
    description: "Host closes the evidence round and asks for adjudication; calculations.evidence_requirement must pass and the provisional recovery is pinned."
    roles: [Host]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim_state -> UNDER_REVIEW", "sets submitted_for_review_at, which recomputes adjudication_due_at as +120h", "pins projected_recovery_cents per calculations.claim_recovery variant provisional_at_submission", "increments DamageClaim.version by 1"]
  - method: POST
    path: "/rentals/damage-claims/{id}/request-evidence"
    description: "Adjudicator sends a claim back for one more evidence round; refused once evidence_round has reached MAX_EVIDENCE_ROUNDS (2)."
    roles: [TrustAdjudicator]
    code: 200
    input: ["note?"]
    output: DamageClaim
    side_effects: ["claim_state -> AWAITING_EVIDENCE and evidence_round increases by 1", "clears submitted_for_review_at to null, which nulls adjudication_due_at and takes the claim out of the SLA sweep", "increments DamageClaim.version by 1"]
  - method: POST
    path: "/rentals/damage-claims/{id}/decide"
    description: "First-instance adjudication. APPROVE runs the settlement waterfall for real; DENY writes no money at all."
    roles: [TrustAdjudicator]
    code: 200
    input: [decision, decision_reason_code, "approved_amount_cents?"]
    output: DamageClaim
    side_effects: ["claim_state -> APPROVED or DENIED with decided_at, decided_by_user_id (X-User-ID) and appeal_due_at (+168h) set", "on APPROVE: runs calculations.claim_recovery variant final_at_decision, writing SettlementAllocation rows, raising CoverageLayer.consumed_cents (possibly to EXHAUSTED), flipping Property.coverage_posture and suspending the listing when the stack empties (a 5-link cascade)", "on APPROVE with a deposit slice: Reservation.deposit_state HELD -> APPLIED and Guest.deposit_held_cents decreases, incrementing Reservation.version and Guest.version by 1", "on APPROVE: Guest.approved_claim_count increases by 1, re-running calculations.guest_risk_score", "increments DamageClaim.version by 1"]
  - method: POST
    path: "/rentals/damage-claims/{id}/appeal"
    description: "The charged party appeals inside the 168h window — the guest against an approval, the host against a denial. Only one appeal is ever admissible."
    roles: [Guest, Host]
    code: 200
    input: ["note?"]
    output: DamageClaim
    side_effects: ["claim_state -> APPEALED, appeal_round -> 1 and appealed_by_role recorded", "on the guest-appeals-approval branch only: Host.payout_hold -> true, incrementing Host.version by 1", "increments DamageClaim.version by 1"]
  - method: POST
    path: "/rentals/damage-claims/{id}/appeal-decision"
    description: "Final adjudication of the appeal by a DIFFERENT adjudicator than the one who decided first instance. Overturning an approval reverses every monetary side effect exactly."
    roles: [TrustAdjudicator]
    code: 200
    input: [decision, "decision_reason_code?", "approved_amount_cents?"]
    output: DamageClaim
    side_effects: ["claim_state -> APPROVED or DENIED per the appeal outcome, with appeal_decision and appeal_decided_by_user_id set", "overturning an approval voids every SettlementAllocation, restores each CoverageLayer.consumed_cents and layer_state, returns Reservation.deposit_state APPLIED -> HELD, restores Guest.deposit_held_cents exactly and decrements Guest.approved_claim_count", "overturning a denial runs calculations.claim_recovery variant final_at_decision for the first time on this claim", "clears Host.payout_hold to false when the guest had appealed", "increments DamageClaim.version by 1"]

  # ---------- ClaimEvidence ----------
  - method: POST
    path: "/rentals/claim-evidence"
    description: "Uploads one supporting artifact to a claim, stamped with the claim's current evidence_round and the uploader's role and id."
    roles: [Host, Guest]
    code: 201
    input: [claim_id, evidence_type, "amount_cents?", captured_at, file_ref]
    output: ClaimEvidence
    side_effects: ["stamps uploaded_by_role, uploaded_by_user_id and evidence_round from the claim", "recomputes DamageClaim.evidence_count", "immutable entity — no version field, no update endpoint"]
  - method: GET
    path: "/rentals/claim-evidence/{id}"
    description: "Reads one evidence artifact."
    roles: [Guest, Host, TrustAdjudicator, PlatformAdmin]
    code: 200
    input: []
    output: ClaimEvidence
    side_effects: []
  - method: GET
    path: "/rentals/claim-evidence"
    description: "Lists evidence artifacts, filterable by claim, type and round — the reverse-reachability channel for ClaimEvidence."
    roles: [Guest, Host, TrustAdjudicator, PlatformAdmin]
    code: 200
    input: ["claim_id?", "evidence_type?", "evidence_round?", "limit?", "offset?"]
    output: ClaimEvidence[]
    side_effects: []

  # ---------- CoverageLayer ----------
  - method: POST
    path: "/rentals/coverage-layers"
    description: "Publishes one rung of the insurance waterfall — a damage-waiver pool, platform protection, a host policy or owner coverage — with its position, limit, deductible and co-insurance percentage."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [source, layer_order, limit_cents, deductible_cents, coverage_pct, scope, "property_id?"]
    output: CoverageLayer
    side_effects: ["layer_state AVAILABLE with consumed_cents 0", "recomputes Property.coverage_posture for every listing the layer becomes visible to", "sets version to 1"]
  - method: GET
    path: "/rentals/coverage-layers/{id}"
    description: "Reads one coverage layer with its consumed_cents and layer_state."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CoverageLayer
    side_effects: []
  - method: GET
    path: "/rentals/coverage-layers"
    description: "Lists coverage layers, filterable by listing, scope, source and layer_state."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["property_id?", "scope?", "source?", "layer_state?", "limit?", "offset?"]
    output: CoverageLayer[]
    side_effects: []

  # ---------- SettlementAllocation (cascade-created only) ----------
  - method: GET
    path: "/rentals/settlement-allocations/{id}"
    description: "Reads one waterfall line. Allocations are never created by a request — only calculations.claim_recovery variant final_at_decision emits them."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SettlementAllocation
    side_effects: []
  - method: GET
    path: "/rentals/settlement-allocations"
    description: "Lists waterfall lines, filterable by claim, layer and voided flag — the only discovery channel for these cascade-created rows, and the way a test reads sequence_index ordering."
    roles: [Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["claim_id?", "coverage_layer_id?", "voided?", "limit?", "offset?"]
    output: SettlementAllocation[]
    side_effects: []

  # ---------- BlocklistEntry ----------
  - method: POST
    path: "/rentals/blocklist-entries"
    description: "Bans a guest at property, host or platform scope, optionally superseding a narrower standing entry. Guarded by OCC on the guest (§1.2.1 blocklist-create-stale-guest)."
    roles: [Host, ComplianceOfficer]
    code: 201
    input: [guest_id, scope, "property_id?", "host_id?", "supersedes_entry_id?", reason_code, expected_guest_version]
    output: BlocklistEntry
    side_effects: ["entry_state ACTIVE and dispute_window_state OPEN with dispute_due_at at +336h", "records created_by_role and created_by_user_id from the request headers with auto_generated false", "lifts the entry named by supersedes_entry_id", "when scope == PLATFORM, cancels every reservation of the guest with stay_state IN {REQUESTED, CONFIRMED} and check_in_at in the future, releasing any deposit hold", "recomputes Guest.active_blocklist_scope_count and increments Guest.version by 1", "sets version to 1"]
  - method: GET
    path: "/rentals/blocklist-entries/{id}"
    description: "Reads one blocklist entry across both of its state dimensions."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BlocklistEntry
    side_effects: []
  - method: GET
    path: "/rentals/blocklist-entries"
    description: "Lists blocklist entries, filterable by guest, scope target, superseded entry and either state dimension."
    roles: [Guest, Host, TrustAdjudicator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["guest_id?", "property_id?", "host_id?", "supersedes_entry_id?", "scope?", "entry_state?", "dispute_window_state?", "limit?", "offset?"]
    output: BlocklistEntry[]
    side_effects: []
  - method: POST
    path: "/rentals/blocklist-entries/{id}/dispute"
    description: "The banned guest exercises the dispute right inside the 336h window. Enforcement is NOT suspended while the dispute is pending."
    roles: [Guest]
    code: 200
    input: [dispute_statement_code]
    output: BlocklistEntry
    side_effects: ["entry_state ACTIVE -> DISPUTED and dispute_window_state OPEN -> DISPUTED in one request", "Guest.active_blocklist_scope_count is unchanged because DISPUTED stays in the enforcing set", "increments BlocklistEntry.version by 1"]
  - method: POST
    path: "/rentals/blocklist-entries/{id}/dispute-decision"
    description: "A DIFFERENT compliance officer than the entry's creator rules on the dispute. Confirming the grounds returns the entry to ACTIVE; withdrawing them or finding identity error lifts it."
    roles: [ComplianceOfficer]
    code: 200
    input: [dispute_reason_code]
    output: BlocklistEntry
    side_effects: ["entry_state -> ACTIVE (GROUNDS_CONFIRMED) or LIFTED (GROUNDS_WITHDRAWN / IDENTITY_ERROR); dispute_window_state -> RESOLVED either way", "dispute_decided_by_user_id set to X-User-ID", "on LIFTED, recomputes Guest.active_blocklist_scope_count and increments Guest.version by 1; reservations already cancelled by the ban are NOT reinstated", "increments BlocklistEntry.version by 1"]
  - method: POST
    path: "/rentals/blocklist-entries/{id}/lift"
    description: "Compliance lifts an ACTIVE ban outright, without a dispute. The dispute window is left where it stands and may still lapse in a later sweep."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BlocklistEntry
    side_effects: ["entry_state -> LIFTED", "recomputes Guest.active_blocklist_scope_count and increments Guest.version by 1", "increments BlocklistEntry.version by 1"]

  # ---------- ops-run checkpoint ----------
  - method: POST
    path: "/rentals/ops/adjudication-sweep"
    description: "Advances the system epoch. Runs the seven phases of calculations.adjudication_sweep in the pinned order against a single logical-clock reading, and reports what each phase moved."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_at: datetime, documents_expired: integer, incidents_sla_breached: integer, claims_denied_sla: integer, claims_settled: integer, claims_closed_denied: integer, deposits_released: integer, dispute_windows_expired: integer }"
    side_effects: ["expires stale identity documents, re-running the guest verification and risk cascade", "flags breached neighbourhood-complaint SLAs", "denies claims whose adjudication SLA lapsed, stamping decided_by_user_id \"system\"", "settles APPROVED / DENIED claims whose appeal window has closed, updating Host.settled_claim_count, Host.denied_claim_count and Host.total_recovered_cents", "releases deposit holds past the claim window with no live claim", "expires unexercised blocklist dispute windows", "recomputes every Property.sensor_compliance_state and Property.coverage_posture"]

errors:
  # ---- auth ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role header absent or empty."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unrecognised, or is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting Guest is not the resource's guest, or acting Host does not own the listing / claim."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The user deciding an appeal already decided the claim at first instance, or the officer deciding a dispute created the blocklist entry."
  - id: ERR_APPEAL_ROLE_MISMATCH
    http: 403
    condition: "A guest appeals a denial, or a host appeals an approval — neither is the charged party."
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, undeclared enum value, out-of-range integer, or pagination limit/offset outside 1..100 / >= 0."
  # ---- existence ----
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "No Guest row for the supplied guest id."
  - id: ERR_HOST_NOT_FOUND
    http: 404
    condition: "No Host row for the supplied host id."
  - id: ERR_JURISDICTION_RULE_NOT_FOUND
    http: 404
    condition: "No JurisdictionRule row for the supplied jurisdiction_rule_id."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "No Property row for the supplied property id."
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "No MonitoringDevice row for the supplied device id."
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "No IdentityDocument row for the supplied document id."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "No Reservation row for the supplied reservation id."
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "No Incident row for the supplied incident id."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No DamageClaim row for the supplied claim id."
  - id: ERR_EVIDENCE_NOT_FOUND
    http: 404
    condition: "No ClaimEvidence row for the supplied evidence id."
  - id: ERR_COVERAGE_LAYER_NOT_FOUND
    http: 404
    condition: "No CoverageLayer row for the supplied coverage_layer_id."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No SettlementAllocation row for the supplied allocation id."
  - id: ERR_BLOCKLIST_ENTRY_NOT_FOUND
    http: 404
    condition: "No BlocklistEntry row for the supplied entry id (including a supersedes_entry_id that resolves to nothing)."
  # ---- optimistic concurrency ----
  - id: ERR_PROPERTY_VERSION_STALE
    http: 412
    condition: "expected_property_version does not equal the stored Property.version on POST /rentals/reservations."
  - id: ERR_RESERVATION_VERSION_STALE
    http: 412
    condition: "expected_reservation_version does not equal the stored Reservation.version on POST /rentals/damage-claims."
  - id: ERR_GUEST_VERSION_STALE
    http: 412
    condition: "expected_guest_version does not equal the stored Guest.version on POST /rentals/blocklist-entries."
  # ---- state ----
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state in the dimension the action moves."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The resource has already reached a terminal state in that dimension."
  - id: ERR_STAY_NOT_COMPLETED
    http: 409
    condition: "A damage claim is filed against a reservation whose stay_state is not COMPLETED."
  - id: ERR_EVIDENCE_ROUNDS_EXHAUSTED
    http: 409
    condition: "request-evidence is called when DamageClaim.evidence_round has already reached MAX_EVIDENCE_ROUNDS (2)."
  - id: ERR_APPEAL_ALREADY_FILED
    http: 409
    condition: "A second appeal is filed on a claim whose appeal_round is already 1."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "An appeal is filed after the logical clock passed DamageClaim.appeal_due_at."
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "A dispute is filed when dispute_window_state is not OPEN, or after dispute_due_at has passed."
  # ---- safety, privacy, compliance ----
  - id: ERR_GUEST_BLOCKLISTED
    http: 409
    condition: "A BlocklistEntry in the enforcing set {ACTIVE, DISPUTED} covers the guest for this listing at PROPERTY, HOST or PLATFORM scope."
  - id: ERR_SENSOR_PLACEMENT_PROHIBITED
    http: 422
    condition: "A camera device is registered in a BEDROOM or BATHROOM zone."
  - id: ERR_SENSOR_JURISDICTION_PROHIBITED
    http: 422
    condition: "An INDOOR_CAMERA is registered in a COMMON_INTERIOR zone where JurisdictionRule.indoor_camera_allowed is false."
  - id: ERR_SENSOR_AUDIO_PROHIBITED
    http: 422
    condition: "A device with records_audio true is registered outside the EXTERIOR zone where JurisdictionRule.indoor_audio_allowed is false."
  - id: ERR_DISCLOSURE_TEXT_REQUIRED
    http: 422
    condition: "guest_disclosure_text is missing or empty while the jurisdiction requires notice, or the device is a camera, or it records audio."
  - id: ERR_SENSOR_COMPLIANCE_BLOCKED
    http: 409
    condition: "A reservation is confirmed while the listing's sensor_compliance_state is PENDING_REVIEW or NON_COMPLIANT."
  - id: ERR_PROPERTY_NOT_LISTED
    http: 409
    condition: "A reservation is confirmed or checked in while the listing is DRAFT or SUSPENDED."
  - id: ERR_REGISTRATION_REQUIRED
    http: 422
    condition: "A listing in a registration-required jurisdiction is activated without a registration_number."
  - id: ERR_ESCALATION_NOT_WARRANTED
    http: 422
    condition: "Escalation is requested for a non-HIGH severity incident whose type is neither SAFETY_THREAT nor UNAUTHORIZED_EVENT."
  - id: ERR_NOISE_BELOW_THRESHOLD
    http: 422
    condition: "A NOISE_VIOLATION incident is acknowledged with a null decibel_reading or one below JurisdictionRule.noise_threshold_db."
  - id: ERR_OCCUPANCY_WITHIN_LIMIT
    http: 422
    condition: "An OVER_OCCUPANCY incident is acknowledged with observed_occupancy at or below calculations.effective_max_occupancy."
  - id: ERR_INCIDENT_HAS_LIVE_CLAIM
    http: 409
    condition: "An incident is dismissed or closed while a claim referencing it is AWAITING_EVIDENCE, UNDER_REVIEW or APPEALED."
  - id: ERR_HOST_PAYOUT_HELD
    http: 409
    condition: "A host with payout_hold true files another damage claim."
  # ---- constraint, temporal, referential, uniqueness ----
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "check_out is not strictly after check_in."
  - id: ERR_CHECK_IN_IN_PAST
    http: 422
    condition: "check_in_at is at or before the logical clock."
  - id: ERR_MIN_STAY_NOT_MET
    http: 422
    condition: "nights is below JurisdictionRule.min_stay_nights."
  - id: ERR_OCCUPANCY_LIMIT_EXCEEDED
    http: 422
    condition: "guest_count exceeds calculations.effective_max_occupancy."
  - id: ERR_PROPERTY_CALENDAR_CONFLICT
    http: 409
    condition: "The requested half-open date range intersects a live reservation of the listing extended by turnover_buffer_nights."
  - id: ERR_GUEST_STAY_OVERLAP
    http: 409
    condition: "The requested closed date range intersects a live reservation of the same guest at any listing."
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "A claim is filed after the logical clock passed Reservation.claim_window_ends_at."
  - id: ERR_DUPLICATE_CLAIM_FOR_INCIDENT
    http: 409
    condition: "The supplied incident_id belongs to another reservation, or is already referenced by a claim outside CLOSED_DENIED."
  - id: ERR_SCOPE_TARGET_MISMATCH
    http: 422
    condition: "Blocklist scope and target ids disagree — PROPERTY without property_id, HOST without host_id, or PLATFORM with either set."
  - id: ERR_BLOCKLIST_DUPLICATE_SCOPE
    http: 409
    condition: "An enforcing entry already covers the guest at the same or a broader scope."
  - id: ERR_SUPERSEDE_NOT_BROADER
    http: 422
    condition: "supersedes_entry_id points at another guest's entry, a non-ACTIVE entry, or one whose scope is not strictly narrower."
  - id: ERR_BLOCKLIST_GROUNDS_NOT_MET
    http: 422
    condition: "The declared reason_code is not evidenced by the guest's counters or risk tier."
  - id: ERR_LAYER_SCOPE_MISMATCH
    http: 422
    condition: "Coverage layer scope and property_id disagree, or a DAMAGE_WAIVER layer is attached to a DEPOSIT listing."
  - id: ERR_LAYER_ORDER_CONFLICT
    http: 409
    condition: "layer_order duplicates an existing layer visible to the same target."
  - id: ERR_EMAIL_ALREADY_REGISTERED
    http: 409
    condition: "The email is already registered for a Guest (or a Host), compared case-insensitively."
  - id: ERR_JURISDICTION_CODE_TAKEN
    http: 409
    condition: "jurisdiction_code already exists."
  - id: ERR_EVIDENCE_AMOUNT_REQUIRED
    http: 422
    condition: "amount_cents is missing or non-positive on a RECEIPT / REPAIR_ESTIMATE artifact, or supplied on any other evidence type."
  - id: ERR_EVIDENCE_INCOMPLETE
    http: 422
    condition: "calculations.evidence_requirement fails — too few photos, a missing receipt or police report at the money thresholds, a missing sensor log, or no artifact stamped with the reopened round."
  # ---- fiscal ----
  - id: ERR_PRODUCT_CONFIG_INVALID
    http: 422
    condition: "deposit_amount_cents and waiver_nightly_fee_cents do not match the declared protection_product."
  - id: ERR_CLAIM_CEILING_EXCEEDED
    http: 422
    condition: "claimed_amount_cents exceeds the listing's claim_ceiling_cents."
  - id: ERR_APPROVED_AMOUNT_INVALID
    http: 422
    condition: "approved_amount_cents is absent, zero or above claimed_amount_cents on an approval, or non-zero on a denial."

roles:
  - name: Guest
    description: "The travelling party — books stays, uploads identity documents, appeals approvals against them and disputes bans."
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /rentals/identity-documents"
      - "POST /rentals/reservations"
      - "POST /rentals/blocklist-entries/{id}/dispute"
    shared_operations:
      - "POST /rentals/reservations/{id}/cancel (with Host)"
      - "POST /rentals/damage-claims/{id}/appeal (with Host, but only against an APPROVED claim)"
      - "POST /rentals/claim-evidence (with Host)"
      - "GET reads of own guest, reservations, claims and blocklist entries"
  - name: Host
    description: "The listing owner — configures listings and monitoring devices, confirms and runs stays, files damage claims and can ban a guest at property or host scope."
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /rentals/properties"
      - "POST /rentals/properties/{id}/activate"
      - "POST /rentals/monitoring-devices"
      - "POST /rentals/monitoring-devices/{id}/submit-for-review"
      - "POST /rentals/reservations/{id}/confirm"
      - "POST /rentals/reservations/{id}/check-in"
      - "POST /rentals/reservations/{id}/complete"
      - "POST /rentals/damage-claims"
      - "POST /rentals/damage-claims/{id}/submit-for-review"
    shared_operations:
      - "POST /rentals/reservations/{id}/cancel (with Guest)"
      - "POST /rentals/damage-claims/{id}/appeal (with Guest, but only against a DENIED claim)"
      - "POST /rentals/claim-evidence (with Guest)"
      - "POST /rentals/incidents (with ComplianceOfficer and PlatformAdmin)"
      - "POST /rentals/blocklist-entries (with ComplianceOfficer, limited to PROPERTY and HOST scope)"
  - name: TrustAdjudicator
    description: "Trust-and-safety case worker — resolves manual screening, triages incidents and adjudicates damage claims and their appeals. Bound by segregation of duties on appeals."
    identity: "opaque"
    exclusive_operations:
      - "POST /rentals/reservations/{id}/screening-decision"
      - "POST /rentals/incidents/{id}/acknowledge"
      - "POST /rentals/incidents/{id}/dismiss"
      - "POST /rentals/incidents/{id}/escalate"
      - "POST /rentals/incidents/{id}/close"
      - "POST /rentals/damage-claims/{id}/request-evidence"
      - "POST /rentals/damage-claims/{id}/decide"
      - "POST /rentals/damage-claims/{id}/appeal-decision"
    shared_operations:
      - "GET reads across guests, listings, reservations, incidents, claims, evidence, allocations and blocklist entries"
    note: "Segregation of duties: the X-User-ID that decided a claim (DamageClaim.decided_by_user_id) may never be the X-User-ID that decides its appeal. Because the sweep stamps the literal \"system\", a sweep denial is always appealable by any adjudicator."
  - name: ComplianceOfficer
    description: "Regulatory reviewer — publishes jurisdiction rules and coverage layers, reviews identity documents and sensor disclosures, and administers platform-scope bans and their disputes. Bound by segregation of duties on disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /rentals/jurisdiction-rules"
      - "POST /rentals/coverage-layers"
      - "POST /rentals/identity-documents/{id}/review"
      - "POST /rentals/monitoring-devices/{id}/review"
      - "POST /rentals/blocklist-entries/{id}/dispute-decision"
      - "POST /rentals/blocklist-entries/{id}/lift"
    shared_operations:
      - "POST /rentals/incidents (with Host and PlatformAdmin)"
      - "POST /rentals/blocklist-entries (with Host; the only role permitted to write PLATFORM scope)"
      - "GET reads across guests, listings, devices, documents, claims, layers and blocklist entries"
    note: "Segregation of duties: the X-User-ID recorded as BlocklistEntry.created_by_user_id may never be the X-User-ID that decides that entry's dispute."
  - name: PlatformAdmin
    description: "Operator — registers accounts, records payment-processor signals, drives the logical clock and runs the adjudication sweep. Holds no adjudication or compliance authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /rentals/guests"
      - "POST /rentals/hosts"
      - "POST /rentals/guests/{id}/payment-signals"
      - "POST /rentals/ops/adjudication-sweep"
    shared_operations:
      - "POST /rentals/jurisdiction-rules (with ComplianceOfficer)"
      - "POST /rentals/coverage-layers (with ComplianceOfficer)"
      - "POST /rentals/incidents (with Host and ComplianceOfficer)"
      - "GET reads across every collection"
    note: "PlatformAdmin cannot decide claims, appeals, screening or disputes, and cannot create or lift blocklist entries — the operator role is deliberately outside the adjudication chain."
