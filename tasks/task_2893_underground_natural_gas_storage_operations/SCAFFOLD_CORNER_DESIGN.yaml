              payload: { storage_field_id: "${f1}", status: "ACTIVE", limit: 100 }
              as: ComplianceOfficer
          assert:
            - "GET /storage-contracts/${c3} returns HTTP 200 with status DRAFT, inventory_balance_dth 0.000, imbalance_dth 0.000, scheduled_injection_dth 0, cash_out_through_date null and version 1"
            - "the unparameterised list returns total_count == 5, has_more == false and all five rows (5 <= the default limit of 10)"
            - "the rows arrive in created_at ASC order: ${c1}, ${c2}, ${c3}, ${c4}, ${c5}"
            - "limit 2 / offset 2 returns exactly ${c3} and ${c4} with total_count == 5 and has_more == true"
            - "shipper_id + service_class returns total_count == 1 and only ${c2}"
            - "storage_field_id + status ACTIVE returns total_count == 3 (${c1}, ${c2}, ${c4}) — the two DRAFT rows are excluded"

      - name: season_flip_action_returns_the_repriced_field_row
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /storage-fields/{id}/season]
          - entities.StorageField.fields.season
          - calculations.deliverability_rates
          - curtailment_sweep.phase_A
        distinguishing_aspect: |
          The action's response is the full StorageField row, not an acknowledgement, and the ONLY
          quantity it changes on an empty book is `season` plus `version`: the inventory, pressure,
          tier and both deliverability rates come back identical to the pre-flip values because the
          curve is indexed on inventory, not on direction. The counterflow sweep is a no-op here since
          no nomination exists, which is what distinguishes this from the state-machine instance.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1 and no contracts or nominations."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
          trigger:
            - call: "POST /storage-fields/${f1}/season"
              payload: { season: "WITHDRAWAL" }
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "the action returns HTTP 200 with the StorageField row: season == WITHDRAWAL and version == ${fv1} + 1"
            - "working_gas_inventory_dth == 250000, inventory_pct == 50.00, current_pressure_psig == 1500, deliverability_tier == TIER_3"
            - "max_withdrawal_rate_dth_per_day == 150000 and max_injection_rate_dth_per_day == 150000 are unchanged by the flip"
            - "field_posture == OPEN and wells_in_service_count == 1 are unchanged"
            - "the follow-up GET returns the identical row, so the action persisted rather than merely projected it"

      - name: nested_listings_are_scoped_to_the_parent_in_the_path
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /compressor-units/{id}/runs]
          - endpoints[GET /storage-fields/{id}/regulatory-reports]
          - response_envelope.list_ordering
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Two sub-resource listings hang off different parents and both must filter on the path id
          rather than on a query field: with two units on one field holding two runs and one run
          respectively, GET /compressor-units/{u1}/runs returns exactly 2 and GET
          /compressor-units/{u2}/runs exactly 1, and a status filter of SCHEDULED narrows the first to
          the row that is still scheduled. The report listing is scoped the same way, so a report filed
          on the sibling field never appears under F_MINI.
        test_recipe:
          setup:
            - "Fields F_MINI and F-TWO, each with one well; units U-1 and U-2 on F_MINI, unit U-3 on F-TWO."
            - "U-1 holds two runs (one over 2026-08-02T00:00:00Z-08:00:00Z that is completed at clock 2026-08-02T08:00:00Z, one over 2026-08-10T00:00:00Z-08:00:00Z still SCHEDULED); U-2 holds one SCHEDULED run."
            - "One INVENTORY_VERIFICATION report is prepared on F_MINI and one on F-TWO, both for 2026-08-01..2026-08-31."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
