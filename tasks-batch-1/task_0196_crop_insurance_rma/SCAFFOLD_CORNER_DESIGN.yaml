# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Crop Insurance (USDA RMA) — task_0196_crop_insurance_rma
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that §1.8
# does not already cover. section/claim_type taken from claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_commodity_program_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.CommodityProgram, endpoints]
        distinguishing_aspect: "POST /commodity-programs with all required fields -> 201; status DRAFT, harvest_price_published=false in response."
        test_recipe:
          setup: ["Empty DB; RmaAdmin authenticated"]
          setup_api_calls: []
          trigger:
            - call: "POST /commodity-programs"
              payload: { crop_code: "WHEAT", county_code: "20001", crop_year: 2026, projected_price: 6.50, base_premium_rate: 0.09, pp_coverage_factor: 0.55, final_planting_date: "2026-04-30T00:00:00Z", acreage_reporting_deadline: "2026-06-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id, st: $.data.status }
          assert:
            - "response status code == 201"
            - "CommodityProgram.${prog_id}.status == DRAFT"
            - "CommodityProgram.${prog_id}.harvest_price_published == false"

      - name: get_policy_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Policy, endpoints]
        distinguishing_aspect: "GET /policies/{id} returns the policy created earlier with matching producer_id and agent_id."
        test_recipe:
          setup: ["A producer, a selling agent, and a DRAFT policy exist"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A1", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P1" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
              captures: { pid: $.data.producer_id }
          assert:
            - "Policy.${policy_id}.producer_id == ${prod_id}"
            - "Policy.${policy_id}.agent_id == ${sa_id}"

      - name: list_commodity_programs_paginated
        claim_type: Listing
        grounds: [entities.CommodityProgram, endpoints]
        distinguishing_aspect: "GET /commodity-programs returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["At least one program exists"]
          setup_api_calls:
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
          trigger:
            - call: "GET /commodity-programs?limit=10&offset=0"
              payload: {}
              as: RmaAdmin
          assert:
            - "response_type == array"
            - "response meta contains total_count >= 1 and has_more == false"

      - name: get_nonexistent_policy_returns_not_found
        claim_type: Not Found
        grounds: [entities.Policy, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /policies/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["RmaAdmin authenticated; no such policy"]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RmaAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_coverage_election_missing_plan_type_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.CoverageElection, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /coverage-elections without plan_type -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["OPEN program; DRAFT policy"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A2", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P2" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_coverage_election_invalid_coverage_level_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.CoverageElection.fields.coverage_level, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "coverage_level=0.72 (not in the allowed set) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["OPEN program; DRAFT policy"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A3", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P3" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.72 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: coverage_election_computed_fields_set_on_create
        claim_type: Computed Fields
        grounds: [entities.CoverageElection.fields.yield_guarantee_bu, entities.CoverageElection.fields.dollar_liability_per_acre_cents, calculations.yield_guarantee_and_liability]
        distinguishing_aspect: "On create, yield_guarantee_bu=round(180*0.75,2)=135.0 and dollar_liability_per_acre_cents=round(135*4.00*100)=54000."
        test_recipe:
          setup: ["OPEN program (projected 4.00); DRAFT policy"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A4", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P4" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { gb: $.data.yield_guarantee_bu, dl: $.data.dollar_liability_per_acre_cents, sf: $.data.subsidy_factor }
          assert:
            - "CoverageElection.yield_guarantee_bu == 135.0"
            - "CoverageElection.dollar_liability_per_acre_cents == 54000"
            - "CoverageElection.subsidy_factor == 0.55"

      - name: system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Policy, endpoints]
        distinguishing_aspect: "id, created_at, version are server-minted on POST /policies; version starts at 1; client cannot set them."
        test_recipe:
          setup: ["A producer and selling agent exist"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A5", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P5" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { v: $.data.version, st: $.data.status }
          assert:
            - "Policy.version == 1"
            - "Policy.status == DRAFT"
            - "Policy.total_premium_cents == 0"

      - name: immutable_producer_has_no_version_field
        claim_type: Immutability
        grounds: [entities.Producer]
        distinguishing_aspect: "Producer has common_fields:false — its create response carries id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["RmaAdmin authenticated"]
          setup_api_calls: []
          trigger:
            - call: "POST /producers"
              payload: { name: "Producer Immutable", tax_id: "C-P6" }
              as: RmaAdmin
              captures: { pid: $.data.id }
          assert:
            - "Producer.${pid}.id is a server-minted UUID"
            - "Producer response has no version field"

      - name: coverage_election_wrong_program_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.CoverageElection.fields.commodity_program_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /coverage-elections with a commodity_program_id that does not exist -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["DRAFT policy exists"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A7", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P7" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "00000000-0000-4000-8000-000000000999", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: flat_fk_reverse_reachability_units_by_election
        claim_type: Foreign key references validated
        grounds: [entities.Unit.fields.coverage_election_id, endpoints]
        distinguishing_aspect: "GET /coverage-elections/{id}/units returns the Unit[] whose coverage_election_id matches; flat-topology FK reverse-reachability."
        test_recipe:
          setup: ["An election with one unit"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A8", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P8" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /coverage-elections/${elec_id}/units"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
          assert:
            - "response_type == array containing one Unit with id == ${unit_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_loss_claim_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.LossClaim, entities.LossClaim.fields.status]
        distinguishing_aspect: "A newly created LossClaim has status DRAFT, indemnity_cents 0, revision_count 0."
        test_recipe:
          setup: ["A REPORTED unit under a YP election"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A9", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "C-J9", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P9" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${unit_v}" }
              as: Agent
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /loss-claims"
              payload: { unit_id: "${unit_id}", harvest_date: "2026-10-15T00:00:00Z", production_to_count_bu: 9000, assigned_adjuster_id: "${adj_id}" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { st: $.data.status, ic: $.data.indemnity_cents, rc: $.data.revision_count }
          assert:
            - "LossClaim.status == DRAFT"
            - "LossClaim.indemnity_cents == 0"
            - "LossClaim.revision_count == 0"

      - name: approve_loss_claim_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LossClaim.UNDER_REVIEW_to_APPROVED, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a LossClaim still in DRAFT (never submitted), by the assigned non-selling adjuster, -> ERR_INVALID_STATE; not covered by the §1.8 priority instance (there the adjuster was the selling agent)."
        test_recipe:
          setup: ["A DRAFT (unsubmitted) LossClaim with a distinct assigned adjuster"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A10", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "C-J10", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P10" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: RmaAdmin
            - call: "POST /commodity-programs/${prog_id}/publish-harvest-price"
              payload: { harvest_price: 5.20 }
              as: RmaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RmaAdmin
            - call: "POST /policies"
              payload: { producer_id: "${prod_id}", agent_id: "${sa_id}", crop_year: 2026 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /coverage-elections"
              payload: { policy_id: "${policy_id}", commodity_program_id: "${prog_id}", plan_type: "YP", aph_yield: 180, coverage_level: 0.75 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${unit_v}" }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "POST /loss-claims"
              payload: { unit_id: "${unit_id}", harvest_date: "2026-10-15T00:00:00Z", production_to_count_bu: 9000, assigned_adjuster_id: "${adj_id}" }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /loss-claims/${claim_id}/approve"
              payload: {}
              as: LossAdjuster
              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "LossClaim.${claim_id}.status == DRAFT"

      - name: pay_terminal_paid_claim_again_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.LossClaim.APPROVED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-paying a LossClaim already in PAID (terminal) -> ERR_INVALID_STATE; no further transition leaves PAID."
        test_recipe:
          setup: ["An APPROVED LossClaim then PAID by RmaAdmin"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A11", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "C-J11", role_kind: "ADJUSTING" }
              as: RmaAdmin
              captures: { adj_id: $.data.id }
            - call: "POST /producers"
              payload: { name: "Producer", tax_id: "C-P11" }
              as: RmaAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
