  - section: endpoints
    instances:
      - name: list_notices_filtered_by_case_id_reverse_reachability
        claim_type: Computed read
        grounds: [entities.ViolationNotice.fields.case_id]
        distinguishing_aspect: "GET /notices?case_id={id} returns the case's notices (reverse-reachability for the cascade-created notice's FK)."
        test_recipe:
          setup: ["A case with one issued MAJOR notice."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "List L", mailing_email: "list@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-LL", street_address: "23 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
          trigger:
            - call: "GET /notices"
              payload: { case_id: "${case_id}" }
              as: FinanceClerk
          assert:
            - "Response is an array containing exactly one notice with id == ${notice_id}"
            - "Envelope includes total_count == 1 and has_more == false"

      - name: list_case_complaints_subresource_reverse_reachability
        claim_type: Computed read
        grounds: [entities.Complaint.fields.case_id]
        distinguishing_aspect: "GET /cases/{id}/complaints returns the case's complaints (sub-resource reverse-reachability for Complaint.case_id)."
        test_recipe:
          setup: ["A case with one complaint filed."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Cmp C", mailing_email: "cmp@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-CP", street_address: "24 X St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /complaints"
              payload: { case_id: "${case_id}", reporter_kind: "ANONYMOUS", narrative: "trash" }
              as: CodeOfficer
              captures: { comp_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}/complaints"
              payload: {}
              as: CodeOfficer
          assert:
            - "Response is an array containing exactly one complaint with id == ${comp_id}"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_posture_after_notice_issue
        claim_type: immediate
        grounds: [entities.Case.fields.posture]
        excluded_because:
          difficulty_instance: transitive_cascade / notice_issue_cascade_depth2_posture_active
          rationale: "Immediate same-flow visibility of the INTAKE->ACTIVE posture flip is asserted by the named §1.8 cascade instance."
        # NO test_recipe.
