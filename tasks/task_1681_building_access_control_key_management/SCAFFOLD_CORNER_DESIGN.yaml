              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EXPIRY_REQUIRED_FOR_VENDOR (http 422)"
            - "Credential.${vb1}.status == IN_STOCK (unchanged)"

      - name: non_vendor_issue_with_expiry_returns_invalid_request
        claim_type: violation_to_error
        grounds: ['validations[priority=9]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "expires_at is forbidden for non-vendor holders; supplying it for a resident fails schema validation."
