            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "COMPLETE" }, as: InstallationManager, captures: { err3: $.data.error_id } }
            - { call: "POST /api/installation-tasks/${t2_id}/complete", as: InstallationManager }
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "COMPLETE" }, as: InstallationManager, captures: { w_status: $.data.status } }
            - { call: "GET /api/po-lines/${l_id}", as: PurchasingAgent }
          assert:
            - "Complete while window RELEASED: 409 ERR_WINDOW_NOT_IN_PROGRESS"
            - "Complete while IN_PROGRESS: T1 status COMPLETE; repeat completion: 409 ERR_INVALID_TASK_TRANSITION (no double pool debit)"
            - "Window COMPLETE attempt with T2 still SCHEDULED: 409 ERR_TASKS_OUTSTANDING"
            - "After T2 completes, window completes: status COMPLETE"
            - "POLine.${l_id}: qty_installed == 6, qty_installable == 4 (10 - 6, consumed exactly once)"

      - name: pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more per the fixed envelope defaults."
        test_recipe:
          setup: ["Three projects P-A, P-B, P-C exist"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-N2A", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 1000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects", payload: { name: "P-N2B", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 1000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects", payload: { name: "P-N2C", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 1000000 }, as: PurchasingAgent }
          trigger:
            - { call: "GET /api/projects?limit=2&offset=0", as: PurchasingAgent }
            - { call: "GET /api/projects?limit=2&offset=2", as: PurchasingAgent }
          assert:
            - "Page 1: 2 rows, total_count == 3, has_more == true; response_type == array"
            - "Page 2: 1 row, total_count == 3, has_more == false"

      - name: fk_reverse_lists
        claim_type: cross_reference
