              as_user_id: "cert-1"
              captures: { fail_total: $.total_count }
            - call: "GET /signal-ops/timing-plans/${tp1_id}"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { plan_state: $.data.ped_compliance_state, plan_v: $.data.version }
          assert:
            - "${pre_total} == 0 — before coordinate the plan has no pedestrian checks, and §1.5 offers no endpoint to create one directly"
            - "${total} == 1 and ${phase} == 2 — exactly one row per is_pedestrian_phase split, so phases 1, 4 and 6 produce nothing"
            - "${speed} == 3.5 (STD_3_5_FPS) and ${req_clear} == 17.8 — 62 / 3.5 == 17.7142 ceiled to the tenth, with ${prov_clear} == 20.0"
            - "${req_walk} == 4.0 (MIN_WALK_STD_SEC, since aps_installed is false) and ${prov_walk} == 7.0"
            - "${req_phase} == 25.8 == 4.0 + 17.8 + 3.0 + 1.0 and ${prov_phase} == 34 — the POST-rescale effective split for phase 2 (30 * 105 / 95 == 33.16 -> 33, plus the +1 residual), not the drafted 30"
            - "${res} == PASS with ${reason} == null, ${plan_state} == COMPLIANT, and ${fail_total} == 0 for the result=FAIL filter"
            - "the two GETs do not change ${chk_v} or ${plan_v} — a computed read persists nothing"

      - name: coordinate_is_an_all_or_nothing_bulk_action_over_every_plan
        claim_type: bulk_action
        grounds:
          - endpoints[POST /signal-ops/retiming-projects/{id}/coordinate]
          - validations[priority 70 ERR_CYCLE_EXCEEDS_LOCAL_MAX]
          - state_machines.TimingPlan[DRAFT -> COORDINATED]
        distinguishing_aspect: "One call transitions EVERY draft plan of the project, and it is atomic: while i2's max_cycle_length_sec is 90 the 105 s coordinated cycle breaches the corridor-wide hard ceiling, so the call fails and BOTH plans remain DRAFT with their drafted cycles and zero offsets — a per-plan loop would leave tp1 coordinated and tp2 untouched. After a single PATCH lifts i2's ceiling the same call coordinates both plans together and both versions advance by exactly one."
