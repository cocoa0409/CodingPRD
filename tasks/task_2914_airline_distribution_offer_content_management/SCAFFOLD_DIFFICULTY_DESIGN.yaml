          assert:
            - "the publish call returns HTTP 200, NOT 422 ERR_DISCLOSURE_INCOMPLETE"
            - "Offer.${offer_gds_id}.status == PUBLISHED"
            - "Offer.${offer_gds_id}.disclosure_complete == true"
            - "Offer.${offer_gds_id}.acknowledged_disclosure_codes == []"
            - "Offer.${offer_gds_id}.subtotal_cents == 21600"
            - "Offer.${offer_gds_id}.surcharge_cents == 648"
            - "Offer.${offer_gds_id}.total_cents == 22248"
            - "Offer.${offer_gds_id}.item_count == 2"

  # ===========================================================================
  # RULE 7 — cross-entity state dependencies on different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_creation_requires_agreement_in_signed_state
        grounds:
          - validations[priority=12]
          - errors.ERR_AGREEMENT_NOT_SIGNED
          - state_machines.Order.null_to_AUTHORIZED_RESERVED
          - state_machines.AgencyAgreement.PROPOSED_to_SIGNED
          - entities.Order.fields.agency_agreement_id
        distinguishing_aspect: |
          ENTITY PAIR Order -> AgencyAgreement: creating an Order is legal only while a DIFFERENT
          entity — the (partner_id, channel_id) AgencyAgreement — sits in SIGNED. With the agreement
          left in PROPOSED the identical POST /orders fails with ERR_AGREEMENT_NOT_SIGNED, and the very
          same request succeeds once ACCEPT moves the agreement to SIGNED, at which point the order's
          agency_agreement_id resolves to that agreement.
        test_recipe:
          setup:
            - "Channel NDC_AGG, travel agency Alpha, FareFiling YNDC01 ACTIVE, ancillaries published."
            - "An AgencyAgreement for (Alpha, NDC_AGG) created by dm-001 and LEFT IN PROPOSED — ACCEPT is deliberately not performed."
            - "OFFER_A constructed and PUBLISHED for that pair (offer construction has no agreement precondition at all)."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
            - *k_agreement
            - *k_offer_a
            - *k_publish_a
          trigger:
            - call: "POST /orders"
              payload: { offer_id: "${offer_a_id}", disclosure_ack_codes: ["DOT-FARE-INCL"], message_count: 4, segment_count: 2 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { dep1_error: $.data.error_id }
            - call: "POST /agency-agreements/${agreement_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
            - call: "POST /orders"
              payload: { offer_id: "${offer_a_id}", disclosure_ack_codes: ["DOT-FARE-INCL"], message_count: 4, segment_count: 2 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { dep1_order_id: $.data.id }
          assert:
            - "the first POST /orders returns HTTP 409 with data.error_id == ERR_AGREEMENT_NOT_SIGNED"
            - "at that moment AgencyAgreement.${agreement_id}.status == PROPOSED and Offer.${offer_a_id}.status == PUBLISHED"
            - "after ACCEPT: AgencyAgreement.${agreement_id}.status == SIGNED and agreed_incentive_pct == 0.025"
            - "the second POST /orders returns HTTP 201"
            - "Order.${dep1_order_id}.agency_agreement_id == ${agreement_id}"
            - "Order.${dep1_order_id}.net_revenue_cents == 59560"
            - "Offer.${offer_a_id}.status == ORDERED"

      - name: refund_apply_requires_channel_refund_parity_state
        grounds:
          - validations[priority=16]
          - errors.ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL
          - state_machines.ServiceRequest.APPROVED_to_APPLIED
          - entities.Channel.fields.servicing_parity_refund
          - endpoints.PATCH_channels_id_content_policy
        distinguishing_aspect: |
          A DIFFERENT entity pair — ServiceRequest -> Channel — and the dependency is on a mutable
          configuration flag rather than a lifecycle state: an already APPROVED refund becomes
          inapplicable the moment the channel's servicing_parity_refund is patched to false, and
          becomes applicable again when it is patched back to true. The ServiceRequest never leaves
          APPROVED during the rejected attempt.
        test_recipe:
          setup:
            - "OFFER_A ordered and CAPTUREd on NDC_AGG (servicing_parity_refund starts true)."
            - "A REFUND ServiceRequest on that order driven SUBMITTED -> UNDER_REVIEW -> APPROVED, so its settlement figures are already written (refund_total_cents 46340)."
            - "The channel's content policy is then patched to servicing_parity_refund = false."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
            - *k_agreement
            - *k_agreement_accept
            - *k_offer_a
            - *k_publish_a
            - *k_order_a
            - *k_capture_a
            - *k_sr_refund_a
            - *k_sr_refund_a_review
            - &k_sr_refund_a_approve
              call: "POST /service-requests/${svc_refund_id}/review"
              payload: { action: "APPROVE" }
              as: DistributionManager
              as_user_id: "dm-002"
            - call: "PATCH /channels/${channel_ndc_id}/content-policy"
              payload: { servicing_parity_refund: false }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /service-requests/${svc_refund_id}/apply"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-002"
              captures: { dep2_error: $.data.error_id }
            - call: "PATCH /channels/${channel_ndc_id}/content-policy"
              payload: { servicing_parity_refund: true }
              as: DistributionManager
              as_user_id: "dm-001"
            - call: "POST /service-requests/${svc_refund_id}/apply"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "the first apply returns HTTP 422 with data.error_id == ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL"
            - "after the rejected apply: ServiceRequest.${svc_refund_id}.status == APPROVED and Order.${order_a_id}.payment_status == PAID and Order.${order_a_id}.refunded_amount_cents == 0"
            - "Channel.${channel_ndc_id}.booking_count is still 1 after the rejected apply"
            - "the second apply returns HTTP 200 and ServiceRequest.${svc_refund_id}.status == APPLIED"
            - "Order.${order_a_id}.payment_status == REFUNDED and Order.${order_a_id}.refunded_amount_cents == 46340"
            - "Channel.${channel_ndc_id}.booking_count == 0 and AgencyAgreement.${agreement_id}.cumulative_net_revenue_cents == 0"

  # ===========================================================================
  # RULE 8 — resource/temporal overlap with different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: fare_sale_window_adjacency_allowed_but_strict_overlap_rejected
        grounds:
          - validations[priority=24]
          - errors.ERR_FARE_SALE_WINDOW_OVERLAP
          - state_machines.FareFiling.FILED_to_ACTIVE
          - entities.FareFiling.fields.sale_from
          - entities.FareFiling.fields.sale_to
        distinguishing_aspect: |
          HALF-OPEN interval semantics [sale_from, sale_to) scoped to the
          (origin, destination, cabin, fare_basis_code) key: two filings whose windows TOUCH at
          2026-09-01 both reach ACTIVE because a.sale_to == b.sale_from is not an overlap, while a
          third window that strictly straddles the join is refused. Adjacency is legal; sharing any
          interior instant is not.
        test_recipe:
          setup:
            - "Three FareFilings share (FRA, JFK, ECONOMY, YADJ01) and the travel window [2026-09-01, 2026-12-31]."
            - "F1 sale window [2026-07-01, 2026-09-01) is FILED then ACTIVE."
            - "F2 sale window [2026-09-01, 2026-11-01) is FILED then ACTIVE — it touches F1's exclusive end."
            - "F3 sale window [2026-08-15, 2026-09-15) is FILED only."
          setup_api_calls:
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YADJ01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 30000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-09-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { adj_f1_id: $.data.id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YADJ01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 31000, sale_from: "2026-09-01T00:00:00.000Z", sale_to: "2026-11-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { adj_f2_id: $.data.id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YADJ01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 32000, sale_from: "2026-08-15T00:00:00.000Z", sale_to: "2026-09-15T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { adj_f3_id: $.data.id }
            - call: "POST /fare-filings/${adj_f1_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${adj_f2_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${adj_f3_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${adj_f1_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          trigger:
            - call: "POST /fare-filings/${adj_f2_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${adj_f3_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { ovl1_error: $.data.error_id }
          assert:
            - "activating F2 returns HTTP 200 and FareFiling.${adj_f2_id}.status == ACTIVE — touching endpoints do not overlap"
            - "activating F3 returns HTTP 409 with data.error_id == ERR_FARE_SALE_WINDOW_OVERLAP"
            - "FareFiling.${adj_f3_id}.status is still FILED"
            - "FareFiling.${adj_f1_id}.status == ACTIVE"
            - "GET /fare-filings?status=ACTIVE&origin=FRA&destination=JFK has total_count == 2"

      - name: connectivity_test_teardown_buffer_gap_of_exactly_fifteen_conflicts
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - calculations.connectivity_slot_occupation
          - errors.ERR_TEST_SLOT_CONFLICT
          - errors.ERR_TEST_ENV_CAPACITY_EXCEEDED
          - entities.PartnerCertification.fields.reserved_test_minutes
        distinguishing_aspect: |
          DIFFERENT interval semantics from the sale-window instance: here the intervals are CLOSED and
          the pairwise rule widens each existing slot by TEST_TEARDOWN_BUFFER_MINUTES, so a gap of
          EXACTLY 15 minutes conflicts (10:00 end vs 10:15 start) while a gap of 16 minutes does not —
          and that buffered rule is scoped to (env_code, test_code) while a second, unbuffered rule
          counts raw overlaps env-wide against MAX_CONCURRENT_TESTS_PER_ENV.
        test_recipe:
          setup:
            - "Technology provider Nexus with a PartnerCertification on NDC_AGG in CERT_ENV_A."
            - "One SCHEDULED test AUTH_HANDSHAKE occupying the closed interval [09:00, 10:00] on 2026-08-10."
          setup_api_calls:
            - *k_ch_ndc
            - *k_tech_partner
            - *k_cert
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "AUTH_HANDSHAKE", is_mandatory: true, scheduled_start: "2026-08-10T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { ovl_auth1_id: $.data.id }
          trigger:
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "AUTH_HANDSHAKE", is_mandatory: false, scheduled_start: "2026-08-10T10:15:00.000Z", duration_minutes: 30 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { ovl2_error: $.data.error_id }
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "SHOP_FLOW", is_mandatory: false, scheduled_start: "2026-08-10T10:15:00.000Z", duration_minutes: 30 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { ovl_shop_id: $.data.id }
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "AUTH_HANDSHAKE", is_mandatory: false, scheduled_start: "2026-08-10T10:16:00.000Z", duration_minutes: 30 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { ovl_auth2_id: $.data.id }
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "ORDER_FLOW", is_mandatory: false, scheduled_start: "2026-08-10T10:30:00.000Z", duration_minutes: 30 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { ovl3_error: $.data.error_id }
          assert:
            - "the AUTH_HANDSHAKE slot starting 10:15 (gap exactly TEST_TEARDOWN_BUFFER_MINUTES after the 10:00 end) returns HTTP 409 with data.error_id == ERR_TEST_SLOT_CONFLICT"
            - "the SHOP_FLOW slot starting 10:15 returns HTTP 201 — Rule A is scoped to the same test_code only"
            - "the AUTH_HANDSHAKE slot starting 10:16 (gap 16 minutes, strictly greater than the buffer) returns HTTP 201"
            - "ConnectivityTest.${ovl_auth2_id}.scheduled_end == 2026-08-10T10:46:00.000Z"
            - "the ORDER_FLOW slot [10:30, 11:00] returns HTTP 409 with data.error_id == ERR_TEST_ENV_CAPACITY_EXCEEDED because it raw-overlaps both SHOP_FLOW [10:15, 10:45] and AUTH_HANDSHAKE [10:16, 10:46], making 3 > MAX_CONCURRENT_TESTS_PER_ENV"
            - "PartnerCertification.${cert_id}.reserved_test_minutes == 120 (60 + 30 + 30; the two rejected slots reserved nothing)"
            - "GET /partner-certifications/${cert_id}/connectivity-tests?status=SCHEDULED has total_count == 3"

  # ===========================================================================
  # RULE 9 — compensating invariants over different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: capture_then_refund_apply_restores_agreement_revenue_ledger
        grounds:
          - calculations.agency_incentive_accrual
          - calculations.distribution_cost_per_booking
          - entities.AgencyAgreement.fields.cumulative_net_revenue_cents
          - entities.AgencyAgreement.fields.incentive_accrued_cents
          - entities.AgencyAgreement.fields.tier_downgrade_count
          - state_machines.ServiceRequest.APPROVED_to_APPLIED
        distinguishing_aspect: |
          CONSERVED QUANTITY: the agreement's money ledger (cumulative_net_revenue_cents and the
          incentive_accrued_cents derived from it) plus the channel cost ledger. Capturing OFFER_C then
          OFFER_A raises the ledger 5176200 -> 5235760 (accrual 68006 -> 69868); refunding exactly the
          OFFER_A order returns it to 5176200 / 68006 and the channel figures to 68122 / 400000 — the
          exact values held before OFFER_A existed, with no drift and no downgrade, even though the
          audit clawback figure recorded on the request is 1159.
        test_recipe:
          setup:
            - "Channel NDC_AGG and travel agency Alpha with a SIGNED agreement (agreed_incentive_pct 0.025, incentive_multiplier 1.25)."
            - "OFFER_C (total 5176200) ordered with message_count 3 / segment_count 2 and CAPTUREd: cumulative 5176200, accrual 68006, TIER_2, channel activity_cost 68122."
            - "OFFER_A (total 59560) ordered with message_count 4 / segment_count 2 and CAPTUREd: cumulative 5235760, accrual 69868, channel activity_cost 70112 over 2 bookings."
            - "A REFUND ServiceRequest on the OFFER_A order driven to APPROVED (refundable_base 53840, fee 7500, refund_total 46340, clawback 1159 at the stored TIER_2 rate)."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
            - *k_filing02
            - *k_filing02_filed
            - *k_filing02_active
            - *k_agreement
            - *k_agreement_accept
            - *k_offer_c
            - *k_publish_c
            - *k_order_c
            - *k_capture_c
            - *k_offer_a
            - *k_publish_a
            - *k_order_a
            - *k_capture_a
            - *k_sr_refund_a
            - *k_sr_refund_a_review
            - *k_sr_refund_a_approve
          trigger:
            - call: "POST /service-requests/${svc_refund_id}/apply"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "before the apply: AgencyAgreement.${agreement_id}.cumulative_net_revenue_cents == 5235760 and incentive_accrued_cents == 69868"
            - "ServiceRequest.${svc_refund_id}.refund_total_cents == 46340 and incentive_clawback_cents == 1159"
            - "after the apply: AgencyAgreement.${agreement_id}.cumulative_net_revenue_cents == 5176200 — exactly the pre-OFFER_A value"
            - "after the apply: AgencyAgreement.${agreement_id}.incentive_accrued_cents == 68006 — exactly the pre-OFFER_A value, and NOT 69868 - 1159 == 68709"
            - "AgencyAgreement.${agreement_id}.incentive_tier == TIER_2 and tier_downgrade_count == 0"
            - "Channel.${channel_ndc_id}.booking_count == 1"
            - "Channel.${channel_ndc_id}.activity_cost_cents == 68122 and cost_per_booking_activity_cents == 68122"
            - "Channel.${channel_ndc_id}.cost_per_booking_flat_cents == 400000"
            - "Order.${order_c_id}.payment_status == PAID is untouched by the other order's refund"

      - name: schedule_then_cancel_restores_reserved_test_minutes
        grounds:
          - calculations.connectivity_slot_occupation
          - calculations.certification_readiness_score
          - entities.PartnerCertification.fields.reserved_test_minutes
          - entities.ConnectivityTest.fields.score
          - state_machines.ConnectivityTest.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — the certification environment's reserved minutes ledger,
          measured in minutes rather than cents: scheduling 60 then 45 minutes raises
          reserved_test_minutes to 105, and CANCELLED on the 45-minute slot returns it to exactly 60
          while leaving both readiness variants at 0 and the cancelled test's score null, so a
          cancelled slot leaves no trace in either the minutes ledger or the score population.
        test_recipe:
          setup:
            - "Channel NDC_AGG and technology provider Nexus registered."
            - "A PartnerCertification opened on NDC_AGG in CERT_ENV_B, so reserved_test_minutes starts at 0."
            - "AUTH_HANDSHAKE scheduled [09:00, 10:00] (60 minutes) and SHOP_FLOW scheduled [11:00, 11:45] (45 minutes), both SCHEDULED and non-overlapping."
          setup_api_calls:
            - *k_ch_ndc
            - *k_tech_partner
            - call: "POST /partner-certifications"
              payload: { partner_id: "${partner_tech_id}", channel_id: "${channel_ndc_id}", env_code: "CERT_ENV_B" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { cert_b_id: $.data.id }
            - call: "POST /partner-certifications/${cert_b_id}/connectivity-tests"
              payload: { test_code: "AUTH_HANDSHAKE", is_mandatory: true, scheduled_start: "2026-08-11T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { inv_auth_id: $.data.id }
            - call: "POST /partner-certifications/${cert_b_id}/connectivity-tests"
              payload: { test_code: "SHOP_FLOW", is_mandatory: false, scheduled_start: "2026-08-11T11:00:00.000Z", duration_minutes: 45 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { inv_shop_id: $.data.id }
          trigger:
            - call: "POST /connectivity-tests/${inv_shop_id}/outcome"
              payload: { outcome: "CANCELLED" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
          assert:
            - "before the cancellation: PartnerCertification.${cert_b_id}.reserved_test_minutes == 105"
            - "after the cancellation: PartnerCertification.${cert_b_id}.reserved_test_minutes == 60 — exactly the value held before SHOP_FLOW was scheduled"
            - "ConnectivityTest.${inv_shop_id}.status == CANCELLED and ConnectivityTest.${inv_shop_id}.score == null"
            - "ConnectivityTest.${inv_auth_id}.status == SCHEDULED and ConnectivityTest.${inv_auth_id}.scheduled_end == 2026-08-11T10:00:00.000Z"
            - "PartnerCertification.${cert_b_id}.readiness_score_strict == 0 and readiness_score_provisional == 0"
            - "PartnerCertification.${cert_b_id}.mandatory_failed_count == 0"
            - "PartnerCertification.${cert_b_id}.status == TESTING"
            - "DistributionPartner.${partner_tech_id}.certification_status == IN_CERTIFICATION"
