            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${pm}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
