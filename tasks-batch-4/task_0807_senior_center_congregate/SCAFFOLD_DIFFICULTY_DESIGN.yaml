scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_meal_reimbursable_provisional_vs_final
        grounds:
          - calculations.meal_reimbursable_count
          - entities.MealServiceDay.fields.provisional_reimbursable_units
          - entities.MealServiceDay.fields.final_reimbursable_units
          - state_machines.MealReservation.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: "On MealServiceDay: provisional counts held seats (CONFIRMED|CHECKED_IN)=3 while final counts CHECKED_IN=1 for the same reservations, so the two variants diverge on the meal-service domain."
        test_recipe:
          setup:
            - "One OPEN MealServiceDay capacity 10; three distinct participants each hold a reservation; exactly one is CHECKED_IN."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P1", birth_date: "1948-02-02T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "P2", birth_date: "1949-03-03T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "P3", birth_date: "1950-04-04T00:00:00Z", gender: "OTHER", ethnicity: "HISPANIC", race: "MULTI", poverty_status: "DECLINED", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p3: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-10T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { sd: "$.data.id", sd_v0: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p1}", expected_service_day_version: "${sd_v0}" }
              as: Coordinator
              captures: { r1: "$.data.id" }
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
              captures: { sd_v1: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p2}", expected_service_day_version: "${sd_v1}" }
              as: Coordinator
              captures: { r2: "$.data.id" }
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
              captures: { sd_v2: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p3}", expected_service_day_version: "${sd_v2}" }
              as: Coordinator
              captures: { r3: "$.data.id" }
            - call: "POST /meal-reservations/${r1}/check-in"
              payload: {}
              as: Coordinator
          trigger:
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
          assert:
            - "MealServiceDay.${sd}.provisional_reimbursable_units == 3"
            - "MealServiceDay.${sd}.final_reimbursable_units == 1"
            - "MealServiceDay.${sd}.reserved_count == 3"
            - "MealServiceDay.${sd}.served_count == 1"
      - name: dv_wellness_projected_vs_final
        grounds:
          - calculations.wellness_completion
          - entities.WellnessEnrollment.fields.projected_graduation_status
          - state_machines.WellnessEnrollment.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: "On WellnessEnrollment: projected variant is WILL_GRADUATE (total_sessions 6 - absences_total 1 = 5 >= fidelity 5) but the final variant WITHDRAWS (sessions_attended 3 < 5), a different entity domain than the meal count."
        test_recipe:
          setup:
            - "Wellness program total_sessions=6, fidelity_min=5; one enrollment with 3 attended logs and 1 absence log (absences_total=1), status ACTIVE."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "W1", birth_date: "1947-05-05T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "ASIAN", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /wellness-programs"
              payload: { title: "Enhance Fitness", model: "ENHANCE_FITNESS", total_sessions: 6, fidelity_min_sessions: 5 }
              as: Coordinator
              captures: { prog: "$.data.id" }
            - call: "POST /wellness-enrollments"
              payload: { program_id: "${prog}", participant_id: "${p}" }
              as: Coordinator
              captures: { enr: "$.data.id" }
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: false }
              as: Coordinator
          trigger:
            - call: "POST /wellness-enrollments/${enr}/finalize"
              payload: {}
              as: Coordinator
          assert:
            - "WellnessEnrollment.${enr}.projected_graduation_status == WILL_GRADUATE"
            - "WellnessEnrollment.${enr}.sessions_attended == 3"
            - "WellnessEnrollment.${enr}.absences_total == 1"
            - "WellnessEnrollment.${enr}.status == WITHDRAWN"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_funding_waterfall_grant_then_donation
        grounds:
          - calculations.funding_waterfall
          - entities.FundedService.fields.grant_amount_cents
          - entities.FundedService.fields.donation_amount_cents
          - concurrency_rules[funded-service-create-stale-grant]
        distinguishing_aspect: "Mode (a): the waterfall nests min(billable, grant.available_cents) then min(remaining, donation.remaining_cents) over three inputs with conditional branches on grant/donation state, yielding grant 1000 + donation 500 + unfunded 0."
        test_recipe:
          setup:
            - "Participant; ACTIVE WELLNESS grant authorized 1000c; WELLNESS donation 2000c."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "F1", birth_date: "1946-06-06T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "Title IIID Wellness", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 1000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { g_v: "$.data.version" }
            - call: "POST /donations"
              payload: { donor_name: "Rotary Club", category: "WELLNESS", amount_cents: 2000 }
              as: CenterAdmin
              captures: { d: "$.data.id" }
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", donation_id: "${d}", expected_grant_award_version: "${g_v}" }
              as: Coordinator
              captures: { fs: "$.data.id" }
          assert:
            - "FundedService.${fs}.billable_cents == 1500"
            - "FundedService.${fs}.grant_amount_cents == 1000"
            - "FundedService.${fs}.donation_amount_cents == 500"
            - "FundedService.${fs}.unfunded_amount_cents == 0"
            - "FundedService.${fs}.funding_status == FUNDED"
            - "GrantAward.${g}.available_cents == 0"
            - "GrantAward.${g}.committed_cents == 1000"
            - "Donation.${d}.remaining_cents == 1500"
            - "Participant.${p}.funded_cents == 1500"
      - name: cf_contribution_statement_per_meal_rounding
        grounds:
          - calculations.participant_contribution_statement
          - endpoints[GET /participants/{id}/contribution-statement]
        distinguishing_aspect: "Mode (b): round_half_up(850*0.15=127.5)=128 per meal THEN sum over 3 meals = 384; the pinned per-meal rounding differs from sum-then-round (round(2550*0.15=382.5)=383)."
        test_recipe:
          setup:
            - "Participant with 3 CHECKED_IN meals across 3 distinct March-2026 service days (one reservation per day, since duplicates on one day are barred)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /participants"
              payload: { full_name: "C1", birth_date: "1945-07-07T00:00:00Z", gender: "FEMALE", ethnicity: "HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-05T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { d1: "$.data.id", d1v: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${d1}", participant_id: "${p}", expected_service_day_version: "${d1v}" }
              as: Coordinator
              captures: { m1: "$.data.id" }
            - call: "POST /meal-reservations/${m1}/check-in"
              payload: {}
              as: Coordinator
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-12T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { d2: "$.data.id", d2v: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${d2}", participant_id: "${p}", expected_service_day_version: "${d2v}" }
              as: Coordinator
              captures: { m2: "$.data.id" }
            - call: "POST /meal-reservations/${m2}/check-in"
              payload: {}
              as: Coordinator
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-19T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { d3: "$.data.id", d3v: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${d3}", participant_id: "${p}", expected_service_day_version: "${d3v}" }
              as: Coordinator
              captures: { m3: "$.data.id" }
            - call: "POST /meal-reservations/${m3}/check-in"
              payload: {}
              as: Coordinator
          trigger:
            - call: "GET /participants/${p}/contribution-statement"
              payload: { month: "2026-03" }
              as: Participant
              as_user_id: "${p}"
          assert:
            - "response.data.total_suggested_contribution_cents == 384"
            - "response.data.meal_count == 3"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nl_grant_active_suspended_cycle
        grounds:
          - state_machines.GrantAward.ACTIVE_to_SUSPENDED
          - state_machines.GrantAward.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "GrantAward is cyclic: ACTIVE->SUSPENDED->ACTIVE reaches ACTIVE a second time via /activate, proving a non-linear loop on the grant entity."
        test_recipe:
          setup:
            - "A grant activated then suspended (status SUSPENDED)."
          setup_api_calls:
            - call: "POST /grant-awards"
              payload: { title: "Title IIIB", oaa_title: "IIIB", category: "TRANSPORTATION", authorized_cents: 5000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /grant-awards/${g}/suspend"
              payload: {}
              as: CenterAdmin
              captures: { g_v_susp: "$.data.version" }
          trigger:
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { g_v_resumed: "$.data.version" }
          assert:
            - "GrantAward.${g}.status == ACTIVE"
            - "GrantAward.${g}.version == ${g_v_susp} + 1"
      - name: nl_wellness_active_lapsed_cycle
        grounds:
          - state_machines.WellnessEnrollment.ACTIVE_to_LAPSED
          - state_machines.WellnessEnrollment.LAPSED_to_ACTIVE
        distinguishing_aspect: "WellnessEnrollment is cyclic on a different entity: two absences drive ACTIVE->LAPSED, then an attended log drives LAPSED->ACTIVE (re-engagement loop)."
        test_recipe:
          setup:
            - "Enrollment lapsed via 2 consecutive absence logs (consecutive_absences=2, status LAPSED)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "L1", birth_date: "1944-08-08T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "NATIVE", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: true, veteran: true }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /wellness-programs"
              payload: { title: "Matter of Balance", model: "MATTER_OF_BALANCE", total_sessions: 8, fidelity_min_sessions: 5 }
              as: Coordinator
              captures: { prog: "$.data.id" }
            - call: "POST /wellness-enrollments"
              payload: { program_id: "${prog}", participant_id: "${p}" }
              as: Coordinator
              captures: { enr: "$.data.id" }
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: false }
              as: Coordinator
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: false }
              as: Coordinator
          trigger:
            - call: "POST /wellness-enrollments/${enr}/log-session"
              payload: { attended: true }
              as: Coordinator
          assert:
            - "WellnessEnrollment.${enr}.status == ACTIVE"
            - "WellnessEnrollment.${enr}.sessions_attended == 1"
            - "WellnessEnrollment.${enr}.consecutive_absences == 0"
            - "WellnessEnrollment.${enr}.absences_total == 2"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_grant_suspend_unfunds_services
        grounds:
          - state_machines.GrantAward.ACTIVE_to_SUSPENDED
          - state_machines.FundedService.APPLIED_to_REVERSED
          - entities.Participant.fields.funded_cents
        distinguishing_aspect: "Depth-3 chain from the /suspend trigger: GrantAward(SUSPENDED) -> its FundedService(REVERSED) -> Participant.funded_cents decremented; each hop is caused by the previous one."
        test_recipe:
          setup:
            - "Participant; ACTIVE WELLNESS grant authorized 2000c; one APPLIED FundedService funded 1500c from the grant (available 500, committed 1500, participant funded 1500)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "T1", birth_date: "1943-09-09T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "Title IIID Wellness", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 2000 }
              as: CenterAdmin
              captures: { g: "$.data.id" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
              captures: { g_v: "$.data.version" }
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${g_v}" }
              as: Coordinator
              captures: { fs: "$.data.id" }
          trigger:
            - call: "POST /grant-awards/${g}/suspend"
              payload: {}
              as: CenterAdmin
          assert:
            - "GrantAward.${g}.status == SUSPENDED"
            - "FundedService.${fs}.status == REVERSED"
            - "FundedService.${fs}.funding_status == UNFUNDED"
            - "FundedService.${fs}.grant_amount_cents == 0"
            - "GrantAward.${g}.committed_cents == 0"
            - "GrantAward.${g}.available_cents == 2000"
            - "Participant.${p}.funded_cents == 0"
      - name: tc_participant_deactivate_frees_meal_seats
        grounds:
          - state_machines.Participant.ACTIVE_to_INACTIVE
          - state_machines.MealReservation.CONFIRMED_to_CANCELLED
          - entities.MealServiceDay.fields.reserved_count
        distinguishing_aspect: "Depth-3 chain from a different trigger (/deactivate): Participant(INACTIVE) -> its MealReservation(CANCELLED) -> MealServiceDay.reserved_count decremented and available_seats restored."
        test_recipe:
          setup:
            - "ACTIVE participant with one CONFIRMED reservation on an OPEN day (capacity 10, reserved_count 1, available_seats 9)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "D1", birth_date: "1942-10-10T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "AT_OR_ABOVE", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-15T12:00:00Z", site_name: "Annex", capacity: 10 }
              as: CenterAdmin
              captures: { sd: "$.data.id", sdv: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p}", expected_service_day_version: "${sdv}" }
              as: Coordinator
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /participants/${p}/deactivate"
              payload: {}
              as: CenterAdmin
          assert:
            - "Participant.${p}.status == INACTIVE"
            - "MealReservation.${r}.status == CANCELLED"
            - "MealServiceDay.${sd}.reserved_count == 0"
            - "MealServiceDay.${sd}.available_seats == 10"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_state_vs_fiscal_meal_closed_and_full
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_SERVICE_DAY_CLOSED]
        distinguishing_aspect: "A reservation on a day that is both CLOSED (state, priority 5) and full (business_fiscal, priority 9) returns ERR_SERVICE_DAY_CLOSED — the state error outranks the fiscal error (different category pair from the temporal/constraint conflict)."
        test_recipe:
          setup:
            - "Day capacity 1 with one CONFIRMED reservation (full), then CLOSED; a second participant attempts to reserve."
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "S1", birth_date: "1941-11-11T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "S2", birth_date: "1940-12-12T00:00:00Z", gender: "MALE", ethnicity: "HISPANIC", race: "MULTI", poverty_status: "DECLINED", lives_alone: false, rural: true, veteran: true }
              as: CenterAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-20T12:00:00Z", site_name: "Main Hall", capacity: 1 }
              as: CenterAdmin
              captures: { sd: "$.data.id", sdv: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p1}", expected_service_day_version: "${sdv}" }
              as: Coordinator
              captures: { r1: "$.data.id" }
            - call: "POST /meal-service-days/${sd}/close"
              payload: {}
              as: CenterAdmin
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
              captures: { sd_v_closed: "$.data.version" }
          trigger:
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p2}", expected_service_day_version: "${sd_v_closed}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SERVICE_DAY_CLOSED"
      - name: pp_temporal_vs_constraint_signup_closed_and_full
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SIGNUP_CLOSED]
        distinguishing_aspect: "A signup after the session start (business_temporal, priority 6) for a session that is also full (business_constraint, priority 7) returns ERR_SIGNUP_CLOSED — temporal outranks constraint, a different category pair than state-vs-fiscal."
        test_recipe:
          setup:
            - "Session capacity 1 starting 2026-03-10T10:00Z, filled by one signup; clock advanced to 2026-03-10T10:30Z (past start); a second participant attempts to sign up."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /participants"
              payload: { full_name: "SG1", birth_date: "1948-01-01T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "SG2", birth_date: "1949-02-02T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "ASIAN", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /rooms"
              payload: { name: "Studio A", capacity: 20 }
              as: CenterAdmin
              captures: { room: "$.data.id" }
            - call: "POST /activity-sessions"
              payload: { title: "Tai Chi", room_id: "${room}", starts_at: "2026-03-10T10:00:00Z", ends_at: "2026-03-10T11:00:00Z", capacity: 1 }
              as: Coordinator
              captures: { sess: "$.data.id" }
            - call: "POST /activity-signups"
              payload: { session_id: "${sess}", participant_id: "${p1}" }
              as: Coordinator
              captures: { su1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T10:30:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /activity-signups"
              payload: { session_id: "${sess}", participant_id: "${p2}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SIGNUP_CLOSED"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bp_meal_capacity_exact_reserved_lt_capacity
        grounds:
          - validations[priority=9]
          - errors[ERR_MEAL_CAPACITY_EXCEEDED]
          - endpoints[POST /meal-reservations]
        distinguishing_aspect: "Numeric boundary reserved_count < capacity on POST /meal-reservations: the 2nd reservation succeeds (1 < 2) and the 3rd fails at exactly reserved_count 2 (2 < 2 is false)."
        test_recipe:
          setup:
            - "Day capacity 2 with two CONFIRMED reservations (reserved_count 2); a third participant attempts to reserve."
          setup_api_calls:
            - call: "POST /participants"
