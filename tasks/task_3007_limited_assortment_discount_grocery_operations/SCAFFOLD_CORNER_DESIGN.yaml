              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_LIMIT_EXCEEDED, HTTP 409 (7th window in one ISO week)"
      - name: error_cashier_role_required
        claim_type: violation_to_error
        grounds: ["errors[ERR_CASHIER_ROLE_REQUIRED]"]
