              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Cons Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "St", last_name: "Im", base_day_rate_cents: 100000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
