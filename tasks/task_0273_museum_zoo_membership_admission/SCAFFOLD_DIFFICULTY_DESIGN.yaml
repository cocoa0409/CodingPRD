            - call: "POST /admission-orders/${o2_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EXHIBIT_BUFFER_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: guest_pass_count_conserved_under_confirm_then_cancel
        grounds:
          - calculations.guest_pass_conservation
          - state_machines.GuestPass.UNUSED_to_RESERVED
          - state_machines.GuestPass.RESERVED_to_UNUSED
        distinguishing_aspect: |
          Conserved quantity = guest pass count: forward confirm (UNUSED->RESERVED) paired with its
          compensating order cancel (RESERVED->UNUSED) leaves UNUSED + RESERVED + REDEEMED ==
          guest_passes_granted (==2) with the membership ending back at 2 UNUSED, 0 RESERVED.
        test_recipe:
          setup:
            - "Plan guest_passes_granted=2; Patron P, ACTIVE membership M; slot S capacity 10."
            - "Order O on S, membership M, 1 GUEST ticket, CONFIRMED (1 pass RESERVED, 1 UNUSED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p17@x.com", full_name: "P Seventeen" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "GUEST", person_name: "Visitor" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "count(GuestPass where membership_id==${m_id} and status==UNUSED) == 2"
            - "count(GuestPass where membership_id==${m_id} and status==RESERVED) == 0"

      - name: slot_seat_count_conserved_under_confirm_then_cancel
        grounds:
          - calculations.slot_reserved_count
          - state_machines.AdmissionOrder.DRAFT_to_CONFIRMED
          - state_machines.AdmissionOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          A different conserved quantity = slot seats: forward confirm (+party_size) paired with its
          compensating cancel (-party_size) leaves reserved_count + available == capacity_total, with
          reserved_count returning to its pre-confirm value (0) for a slot of capacity 5.
        test_recipe:
          setup:
            - "Patron P; slot S capacity_total=5, window 2026-06-10T10:00..12:00Z, reserved_count==0."
            - "Order O CONFIRMED with 3 NON_MEMBER tickets (reserved_count==3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "p18@x.com", full_name: "P Eighteen" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 5, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "B" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "C" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "TimedEntrySlot.${slot_id}.reserved_count == 0"
            - "AdmissionOrder.${o_id}.status == CANCELLED"
