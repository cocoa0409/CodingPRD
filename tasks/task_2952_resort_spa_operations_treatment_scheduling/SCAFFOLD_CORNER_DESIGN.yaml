      - "${gB} (form SCREENED_CLEAR, consent never signed) returns 409 ERR_CONSENT_MISSING: priority 12 passes because the authoritative form is SCREENED_CLEAR, and 13 fails on the consent_signed_at clause"
      - "${gC} (form SCREENED_CLEAR, consent_version 2025.2) also returns 409 ERR_CONSENT_MISSING, this time on the equality clause against TreatmentType.required_consent_version == 2026.1"
      - "${gD} (form OVERRIDDEN carrying ACUTE_HYPERTENSION) returns 409 ERR_CONTRAINDICATION_PRESENT: 12 passes on OVERRIDDEN, 13 passes on consent 2026.1, and 14 fails because screened_condition_codes intersects contraindication_codes"
      - "GET /guests/${gD} shows authoritative_intake_form_id == ${inD}, screened_condition_codes == [\"ACUTE_HYPERTENSION\"] and version incremented twice (create + screen), proving the override does not clear the recorded codes"
      - "GET /intake-forms/${inA} still shows status SUBMITTED, consent_version 2026.1 and consent_signed_at set: signing consent before submit is legal and does not by itself clear the guest"
      - "no Appointment row exists after all four probes"

