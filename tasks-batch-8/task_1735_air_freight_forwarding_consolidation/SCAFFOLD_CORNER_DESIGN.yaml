            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
          trigger:
            - { call: "GET /air-freight/flight-bookings/${bk1}/master-waybills", as: ForwarderOps }
            - { call: "GET /air-freight/house-waybills", payload: { mawb_id: "${mb1}" }, as: ForwarderOps }
            - { call: "GET /air-freight/house-waybills", payload: { shipper_id: "${sh1}" }, as: ForwarderOps }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps }
            - { call: "GET /air-freight/master-waybills/${mb1}/milestone-events", as: ForwarderOps }
          assert:
            - "booking -> master waybills: total_count == 1 containing ${mb1}"
            - "mawb filter: total_count == 1 containing ${hwa}; shipper filter: total_count == 1"
            - "waybill -> screening records: total_count == 1 (result CLEARED); waybill -> milestones via MAWB: total_count == 0 (empty array, not error)"

  - section: errors
    instances:
      - name: not_found_family_covers_all_resources
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIPPER_NOT_FOUND]", "errors[ERR_FLIGHT_BOOKING_NOT_FOUND]", "errors[ERR_SCREENING_RECORD_NOT_FOUND]", "errors[ERR_CUSTOMS_ENTRY_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Every 404 in the catalog is triggerable on its own resource family with a well-formed unknown UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /air-freight/shippers/00000000-0000-4000-8000-000000000001", as: ForwarderOps, captures: { e1: "$.data.error_id" } }
            - { call: "GET /air-freight/flight-bookings/00000000-0000-4000-8000-000000000002", as: ForwarderOps, captures: { e2: "$.data.error_id" } }
            - { call: "POST /air-freight/screening-records/00000000-0000-4000-8000-000000000003/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, captures: { e3: "$.data.error_id" } }
            - { call: "POST /air-freight/customs-entries/00000000-0000-4000-8000-000000000004/transition", payload: { target_status: "FILED" }, as: CustomsBroker, captures: { e4: "$.data.error_id" } }
            - { call: "GET /air-freight/claims/00000000-0000-4000-8000-000000000005", as: ForwarderOps, captures: { e5: "$.data.error_id" } }
          assert:
            - "${e1} == ERR_SHIPPER_NOT_FOUND; ${e2} == ERR_FLIGHT_BOOKING_NOT_FOUND; ${e3} == ERR_SCREENING_RECORD_NOT_FOUND; ${e4} == ERR_CUSTOMS_ENTRY_NOT_FOUND; ${e5} == ERR_CLAIM_NOT_FOUND (all HTTP 404)"

      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request dispatched without X-User-ID and X-User-Role headers fails authentication (priority 1) with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["Shipper ACME exists"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "GET /air-freight/shippers/${sh1}", as: ForwarderOps, send_headers: false, note: "dispatch WITHOUT the X-User-ID and X-User-Role headers", captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"

  - section: rbac
    instances:
      - name: forwarder_ops_cannot_verify_shipper_returns_forbidden
        claim_type: role_denial
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Known-shipper verification is exclusive to ComplianceOfficer: ForwarderOps gets ERR_FORBIDDEN_ROLE and the shipper stays UNVERIFIED."
        test_recipe:
          setup: ["Shipper ACME exists (UNVERIFIED)"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (HTTP 403); GET shipper still shows known_shipper_status == UNVERIFIED"

      - name: claims_adjuster_cannot_create_booking_returns_forbidden
        claim_type: role_denial
        grounds: ["roles[CapacityPlanner]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Capacity procurement is exclusive to CapacityPlanner; a ClaimsAdjuster cannot create a flight booking."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: ClaimsAdjuster, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (HTTP 403)"

      - name: customs_transition_role_map_enforced
        claim_type: role_denial
        grounds: ["validations[priority=2]", "state_machines.CustomsEntry.PREPARING_to_HANDED_OFF", "state_machines.CustomsEntry.HANDED_OFF_to_FILED"]
        distinguishing_aspect: "The transition endpoint enforces a per-target role map (ops handoff vs broker filing): CustomsBroker attempting HANDED_OFF and ForwarderOps attempting FILED are both rejected with ERR_FORBIDDEN_ROLE while the legal pair succeeds."
        test_recipe:
          setup: ["Shipper ACME KNOWN; HWB-CU CLEARED; customs entry CE-1 in PREPARING"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-CU", origin_code: "SFO", destination_code: "NRT", pieces: 3, gross_weight_kg: 25.0, declared_volume_m3: 0.12, dg_flag: false }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sr1: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills/${hw1}/customs-entries", payload: { entry_type: "CONSUMPTION" }, as: ForwarderOps, captures: { ce1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "HANDED_OFF" }, as: CustomsBroker, captures: { err1: "$.data.error_id" } }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "HANDED_OFF" }, as: ForwarderOps, captures: { st1: "$.data.status" } }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "FILED" }, as: ForwarderOps, captures: { err2: "$.data.error_id" } }
            - { call: "POST /air-freight/customs-entries/${ce1}/transition", payload: { target_status: "FILED", broker_reference: "BRK-001" }, as: CustomsBroker, captures: { st2: "$.data.status" } }
          assert:
            - "broker cannot hand off: ${err1} == ERR_FORBIDDEN_ROLE; ops handoff succeeds: ${st1} == HANDED_OFF"
            - "ops cannot file: ${err2} == ERR_FORBIDDEN_ROLE; broker filing succeeds: ${st2} == FILED"

      - name: segregation_of_duties_same_user_cannot_resolve_own_submission
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties is identity-based, not role-based: the same X-User-ID that submitted the waybill (as ForwarderOps) is forbidden from resolving its screening (as ComplianceOfficer); a different officer resolves fine."
        test_recipe:
          setup: ["Shipper ACME KNOWN; HWB-SOD submitted by user ops-1 (SCREENING, record PENDING)"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-SOD", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sr1: "$.data[0].id" } }
          trigger:
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "ops-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /air-freight/screening-records/${sr1}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1", captures: { res: "$.data.result", by: "$.data.resolved_by_user_id" } }
          assert:
            - "same-user resolve: captured ${err} == ERR_SEGREGATION_OF_DUTIES (HTTP 403); record stays PENDING"
            - "different officer: ${res} == CLEARED with resolved_by_user_id == comp-1 (captured ${by}); HouseWaybill.${hw1} bubbles to CLEARED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected_then_current_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[consolidate-stale-mawb-version]"]
        distinguishing_aspect: "OCC on MasterWaybill.version: a consolidation carrying the pre-consolidation version (stale after the first consolidation bumped it) is rejected with ERR_STALE_VERSION 412; re-reading and resubmitting with the current version succeeds."
        test_recipe:
          setup: ["Base SFO->NRT fixture; MAWB OPEN_FOR_CONSOLIDATION; HWB-A and HWB-B both CLEARED (each 10.0 kg chargeable)"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-B", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { hwb: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwb}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwb}/screening-records", as: ForwarderOps, captures: { srb: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srb}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv_pre: "$.data.version" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv_pre}" }, as: ForwarderOps, captures: { st_a: "$.data.status" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwb}", expected_master_waybill_version: "${mv_pre}" }, as: ForwarderOps, captures: { err: "$.data.error_id" } }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv_cur: "$.data.version", tot_w: "$.data.total_chargeable_weight_kg" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwb}", expected_master_waybill_version: "${mv_cur}" }, as: ForwarderOps, captures: { st_b: "$.data.status" } }
          assert:
            - "first consolidation with the observed version succeeds (${st_a} == CONSOLIDATED) and bumps MasterWaybill.version"
            - "second consolidation replaying the stale version: captured ${err} == ERR_STALE_VERSION (HTTP 412); totals unchanged (${tot_w} == 10.0)"
            - "after re-reading (version advanced by exactly 1): resubmit with the current version succeeds (${st_b} == CONSOLIDATED)"

      - name: cascading_side_effects_layer
        claim_type: cascading_chain
        grounds: ["state_machines.FlightBooking.OPEN_to_CANCELLED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / booking_cancel_cascade_depth3"
          rationale: "The depth-3 cancel cascade (MAWB void -> HWB detach -> capacity recompute) is asserted end-to-end in the named 1.8 instance."

      - name: dual_variant_calculation_layer
        claim_type: variant_divergence
        grounds: ["calculations.chargeable_weight", "calculations.liability_limit"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / quoted_vs_final_chargeable_weight"
          rationale: "Both dual-variant calculations are exercised with exact literals by the two 1.8 dual_variant_calc instances."

  - section: consistency_model
    instances:
      - name: immediate_consistency_consolidate_visible_everywhere
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "state_machines.HouseWaybill.CLEARED_to_CONSOLIDATED"]
        distinguishing_aspect: "Immediate consistency: the consolidation response itself carries the rated waybill, and the very next GETs show the MAWB totals and booking consumption already updated (no async lag)."
        test_recipe:
          setup: ["Base SFO->NRT fixture; MAWB open; HWB-A (80.0/0.60 -> 100.0 kg, total 475.00) CLEARED"]
          setup_api_calls:
