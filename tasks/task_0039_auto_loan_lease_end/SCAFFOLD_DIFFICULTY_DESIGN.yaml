        grounds:
          - entities.RateCard.fields.active
          - validations[priority=7]
        distinguishing_aspect: "RateCard resource (different entity, different interval semantics — exclusive singleton aggregate-capacity-of-1 over the whole table rather than per-vehicle point occupation): activating a second card deactivates the prior one so exactly one card is active at any time."
