# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3275_small_business_accounting_subscription_payroll_add_advisor
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_price_list_vs_wholesale_divergence
        grounds:
          - calculations.monthly_subscription_price
          - entities.Subscription.fields.billing_owner
          - entities.Subscription.fields.monthly_price_cents
          - entities.AccountantFirm.fields.wholesale_discount_pct
          - entities.AccountantFirm.fields.proadvisor_tier
        distinguishing_aspect: |
          Same plan, same period, same addon composition — a CLIENT-owned
          subscription's monthly_price_cents equals list_price_cents verbatim,
          while a FIRM-owned subscription's equals round_half_up(list * (1 -
          min(firm.wholesale_discount_pct, tier_ceiling))). The two variants
          operate on the Subscription/Pricing domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan PLUS with list_price_cents=8000 created."
            - "Firm GOLD tier with wholesale_discount_pct=0.30 (within GOLD ceiling of 0.35)."
            - "Company A on PLUS with billing_owner=CLIENT; Company B on PLUS whose billing transfer to Firm has been accepted."
          setup_api_calls:
            - &k_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_plan_plus
              call: "POST /api/plans"
              payload: { plan_code: "PLUS", list_price_cents: 8000, max_seats: 5, feature_inventory: true, feature_project_profitability: true, feature_multi_currency: true, feature_bank_rules: true, plan_rank: 3 }
              as: PlatformAdmin
              captures: { plan_plus_id: $.data.id }
            - &k_firm_gold
              call: "POST /api/firms"
              payload: { firm_name: "Gold Tier CPA LLP", wholesale_discount_pct: 0.30, proadvisor_tier: "GOLD" }
              as: PlatformAdmin
              captures: { firm_gold_id: $.data.id }
            - &k_firm_user_admin
              call: "POST /api/firms/${firm_gold_id}/users"
              payload: { firm_id: "${firm_gold_id}", full_name: "Firm Admin", email: "admin@gold.example", is_firm_admin: true }
              as: PlatformAdmin
              captures: { firm_admin_id: $.data.id }
            - &k_company_a
              call: "POST /api/companies"
              payload: { legal_name: "Alpha Corp", admin_email: "a@alpha.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_a_id: $.data.id }
            - &k_company_b
              call: "POST /api/companies"
              payload: { legal_name: "Beta Corp", admin_email: "b@beta.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_b_id: $.data.id }
            - &k_company_a_admin
              call: "POST /api/companies/${company_a_id}/users"
              payload: { company_id: "${company_a_id}", email: "admin@alpha.example", display_name: "A Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_a_admin_id: $.data.id }
            - &k_company_b_admin
              call: "POST /api/companies/${company_b_id}/users"
              payload: { company_id: "${company_b_id}", email: "admin@beta.example", display_name: "B Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_b_admin_id: $.data.id }
            - call: "POST /api/companies/${company_a_id}/users/${company_a_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_a_admin_id}"
            - call: "POST /api/companies/${company_b_id}/users/${company_b_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_b_admin_id}"
            - &k_sub_a
              call: "GET /api/companies/${company_a_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id, sub_a_v: $.data.version }
            - &k_sub_b
              call: "GET /api/companies/${company_b_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { sub_b_id: $.data.id, sub_b_v: $.data.version }
            - &k_transfer_b
              call: "POST /api/companies/${company_b_id}/billing_transfers"
              payload: { company_id: "${company_b_id}", subscription_id: "${sub_b_id}", initiating_firm_id: "${firm_gold_id}", to_owner: "FIRM" }
              as: AccountantUser
              as_user_id: "${firm_admin_id}"
              captures: { transfer_b_id: $.data.id }
            - call: "POST /api/companies/${company_b_id}/billing_transfers/${transfer_b_id}/accept"
              payload: { expected_subscription_version: "${sub_b_v}" }
              as: CompanyUser
              as_user_id: "${company_b_admin_id}"
          trigger:
            - call: "GET /api/companies/${company_a_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { a_price: $.data.monthly_price_cents }
            - call: "GET /api/companies/${company_b_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { b_price: $.data.monthly_price_cents }
          assert:
            - "Subscription A monthly_price_cents == 8000 (list price, CLIENT billing)"
            - "Subscription B monthly_price_cents == 5600 (round_half_up(8000 * (1 - 0.30)) = 5600; wholesale variant)"
            - "Subscription B billing_owner == FIRM AND billing_firm_id == ${firm_gold_id}"
            - "a_price != b_price"

      - name: payroll_per_employee_provisional_vs_final
        grounds:
          - calculations.payroll_per_employee_fee
          - entities.PayrollAddon.fields.per_employee_fee_cents
          - entities.Invoice.fields.payroll_per_employee_cents
        distinguishing_aspect: |
          Provisional variant (quoted at subscription read) uses CURRENT headcount
          * per_employee_fee (a flat estimate). Final variant at Invoice issue uses
          day-by-day proration with per-line rounding and a fixed 30-day divisor.
          Same company, same period, same employee list — the two variants operate
          on the Payroll/Invoice domain (different from the Subscription domain
          in the other instance).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan PLUS (list 8000, seats 5, all features on)."
            - "Company C on PLUS, ACTIVE subscription (paid via simulate)."
            - "PayrollAddon SELF_SERVICE (base 4500, per-employee 600) activated on 2026-09-01."
            - "Two employees: hire_date 2026-09-01 (full month) and hire_date 2026-09-16 (half month)."
            - "Clock advanced to 2026-10-01 (period_end)."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_c
              call: "POST /api/companies"
              payload: { legal_name: "Gamma Corp", admin_email: "c@gamma.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_c_id: $.data.id }
            - &k_company_c_admin
              call: "POST /api/companies/${company_c_id}/users"
              payload: { company_id: "${company_c_id}", email: "admin@gamma.example", display_name: "C Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_c_admin_id: $.data.id }
            - call: "POST /api/companies/${company_c_id}/users/${company_c_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_c_admin_id}"
            - call: "POST /api/companies/${company_c_id}/subscription/activate"
              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_c_admin_id}"
            - &k_sub_c
              call: "GET /api/companies/${company_c_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { sub_c_id: $.data.id }
            - &k_payroll_c
              call: "POST /api/companies/${company_c_id}/payroll"
              payload: { subscription_id: "${sub_c_id}", service_level: "SELF_SERVICE" }
              as: CompanyUser
              as_user_id: "${company_c_admin_id}"
              captures: { payroll_c_id: $.data.id }
            - call: "POST /api/companies/${company_c_id}/payroll/employees"
              payload: { payroll_addon_id: "${payroll_c_id}", legal_name: "Emp One", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_c_admin_id}"
            - call: "POST /api/companies/${company_c_id}/payroll/employees"
              payload: { payroll_addon_id: "${payroll_c_id}", legal_name: "Emp Two", hire_date: "2026-09-16T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_c_admin_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_invoice_c
              call: "POST /api/companies/${company_c_id}/invoices/${sub_c_id}/issue"
              payload: {}
              as: PlatformAdmin
              captures: { invoice_c_id: $.data.id }
          trigger:
            - call: "GET /api/companies/${company_c_id}/invoices/${invoice_c_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Invoice.${invoice_c_id}.payroll_per_employee_cents == 900 — final variant: day-by-day proration"
            - "  breakdown: Emp One active 30 days * 600/30 = 600; Emp Two active 15 days (Sep 16..30) * 600/30 = 300; sum=900 (round-per-line then sum)"
            - "Invoice.${invoice_c_id}.payroll_per_employee_cents != 1200 (provisional would be 2 * 600 = 1200)"
            - "Invoice.${invoice_c_id}.payroll_base_cents == 4500 (SELF_SERVICE base fee, full month)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_subscription_price_mode_a_3input_conditional
        grounds:
          - calculations.monthly_subscription_price
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — discount is
          min(firm.wholesale_discount_pct, tier_ceiling), and tier_ceiling itself
          switches on firm.proadvisor_tier (three inputs: list_price, discount_pct,
          proadvisor_tier, with a tiered-rate selection structure).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Plan ADVANCED with list 10000."
            - "Three firms: SILVER with discount 0.50 (over ceiling 0.20), GOLD with discount 0.35 (at ceiling), PLATINUM with discount 0.10 (below ceiling 0.50)."
            - "Three companies D/E/F, each on ADVANCED, each transferred to its respective firm."
          setup_api_calls:
            - *k_clock
            - &k_plan_adv
              call: "POST /api/plans"
              payload: { plan_code: "ADVANCED", list_price_cents: 10000, max_seats: 25, feature_inventory: true, feature_project_profitability: true, feature_multi_currency: true, feature_bank_rules: true, plan_rank: 4 }
              as: PlatformAdmin
              captures: { plan_adv_id: $.data.id }
            - &k_firm_silver
