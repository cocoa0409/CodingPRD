scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_fare_product_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.FareProduct
          - endpoints./fare-products
          - entities.FareProduct.fields.transfer_window_minutes
          - entities.FareProduct.fields.transfer_discount_pct
        distinguishing_aspect: "POST /fare-products with only required fields -> 201; transfer_window_minutes defaults to 120, transfer_discount_pct to 1.0, reduced_fare_pct to 0.5, status ACTIVE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_A", base_fare_cents: 250, daily_cap_cents: 500, weekly_cap_cents: 2000 }
              as: FareAdmin
              captures: { p: $.data.id }
          assert:
            - "status == 201"
            - "data.transfer_window_minutes == 120 and data.transfer_discount_pct == 1.0 and data.reduced_fare_pct == 0.5"
            - "data.status == ACTIVE and data.version == 1"

      - name: register_rider_returns_201_with_status_active
        claim_type: Creation
        grounds:
          - entities.Rider
          - endpoints./riders
          - entities.Rider.fields.income_tier
        distinguishing_aspect: "POST /riders with required fields -> 201; income_tier defaults STANDARD, status ACTIVE, version 1."
        test_recipe:
          setup:
            - "An ACTIVE FareProduct ZONE_A exists (home_zone_code must match)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_A", base_fare_cents: 250, daily_cap_cents: 500, weekly_cap_cents: 2000 }
              as: FareAdmin
          trigger:
            - call: "POST /riders"
              payload: { email: "cr@x.com", full_name: "C R", home_zone_code: "ZONE_A" }
              as: Anonymous
              captures: { r: $.data.id }
          assert:
            - "status == 201 and data.income_tier == STANDARD and data.status == ACTIVE and data.version == 1"

      - name: get_rider_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Rider
          - endpoints./riders/{id}
          - validations[priority=4]
        distinguishing_aspect: "GET /riders/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No rider with id 11111111-1111-4111-8111-111111111111."
          setup_api_calls: []
          trigger:
            - call: "GET /riders/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_funding_source_missing_required_source_type_returns_422
        claim_type: Required Fields
        grounds:
          - entities.FundingSource.fields.source_type
          - endpoints./funding-sources
          - validations[priority=5]
        distinguishing_aspect: "POST /funding-sources omitting source_type -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Rider RF exists."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_A", base_fare_cents: 250, daily_cap_cents: 500, weekly_cap_cents: 2000 }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rf@x.com", full_name: "R F", home_zone_code: "ZONE_A" }
              as: Anonymous
              captures: { rf: $.data.id }
          trigger:
            - call: "POST /funding-sources"
              payload: { rider_id: "${rf}" }
              as: Rider
              as_user_id: "${rf}"
              captures: { err: $.data.error_id }
          assert:
            - "status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_funding_source_invalid_enum_source_type_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.FundingSource.fields.source_type
          - endpoints./funding-sources
          - validations[priority=5]
        distinguishing_aspect: "source_type outside {APPLE_PAY, GOOGLE_PAY, CONTACTLESS_CARD} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Rider RF2 exists."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_A", base_fare_cents: 250, daily_cap_cents: 500, weekly_cap_cents: 2000 }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rf2@x.com", full_name: "R F2", home_zone_code: "ZONE_A" }
              as: Anonymous
              captures: { rf2: $.data.id }
          trigger:
            - call: "POST /funding-sources"
              payload: { rider_id: "${rf2}", source_type: "BITCOIN" }
              as: Rider
              as_user_id: "${rf2}"
              captures: { err: $.data.error_id }
          assert:
            - "status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: load_funding_source_increments_balance_system_field
        claim_type: System Fields
        grounds:
          - entities.FundingSource.fields.prepaid_balance_cents
          - endpoints./funding-sources/{id}/load
        distinguishing_aspect: "prepaid_balance_cents is system-managed: created at 0 and only mutated by /load; loading 1500 yields 1500 and bumps version."
        test_recipe:
          setup:
            - "Rider RL with ACTIVE FundingSource FL at balance 0."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_A", base_fare_cents: 250, daily_cap_cents: 500, weekly_cap_cents: 2000 }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rl@x.com", full_name: "R L", home_zone_code: "ZONE_A" }
              as: Anonymous
              captures: { rl: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rl}", source_type: "GOOGLE_PAY" }
              as: Rider
              as_user_id: "${rl}"
              captures: { fl: $.data.id }
          trigger:
            - call: "POST /funding-sources/${fl}/load"
              payload: { amount_cents: 1500 }
              as: Rider
              as_user_id: "${rl}"
              captures: { bal: $.data.prepaid_balance_cents }
          assert:
            - "data.prepaid_balance_cents == 1500 and data.version == 2"

      - name: list_taps_pagination_envelope_fields_present
        claim_type: Listing
        grounds:
          - entities.Tap
          - endpoints./taps
        distinguishing_aspect: "GET /taps returns response_type array with meta and pagination total_count/has_more reflecting created taps."
        test_recipe:
          setup:
            - "Rider RP with one PENDING tap in an OPEN week."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_A", base_fare_cents: 250, daily_cap_cents: 500, weekly_cap_cents: 2000 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rp@x.com", full_name: "R P", home_zone_code: "ZONE_A" }
              as: Anonymous
              captures: { rp: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rp}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rp}"
              captures: { fp: $.data.id }
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rp}", week_start_date: "2026-06-01", zone_code: "ZONE_A" }
              as: Rider
              as_user_id: "${rp}"
              captures: { wp: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${rp}", fare_week_id: "${wp}", funding_source_id: "${fp}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${rp}"
          trigger:
            - call: "GET /taps?rider_id=${rp}"
              payload: { rider_id: "${rp}" }
              as: Rider
              as_user_id: "${rp}"
          assert:
            - "response_type == array and meta.api_request_id present"
            - "data length == 1 and pagination total_count == 1 and has_more == false"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: settle_already_captured_tap_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Tap.PENDING_to_CAPTURED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Settling a tap already CAPTURED -> ERR_INVALID_STATE (409); no second debit; balance unchanged."
        test_recipe:
          setup:
            - "Rider RS with CAPTURED tap T1 (charged 300, balance 700)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rs@x.com", full_name: "R S", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rs: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rs}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rs}"
              captures: { fs: $.data.id }
            - call: "POST /funding-sources/${fs}/load"
              payload: { amount_cents: 1000 }
              as: Rider
              as_user_id: "${rs}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rs}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${rs}"
              captures: { ws: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${rs}", fare_week_id: "${ws}", funding_source_id: "${fs}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${rs}"
              captures: { ts: $.data.id }
            - call: "POST /taps/${ts}/settle"
              payload: {}
              as: PaymentGateway
          trigger:
            - call: "POST /taps/${ts}/settle"
              payload: {}
              as: PaymentGateway
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and data.error_id == ERR_INVALID_STATE"
            - "FundingSource.${fs}.prepaid_balance_cents == 700 (unchanged)"

      - name: reverse_a_pending_tap_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Tap.CAPTURED_to_REVERSED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reverse is only defined from CAPTURED; reversing a PENDING tap -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Rider RR with a PENDING tap TR (never settled)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rr@x.com", full_name: "R R", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rr: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rr}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rr}"
              captures: { fr: $.data.id }
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rr}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${rr}"
              captures: { wr: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${rr}", fare_week_id: "${wr}", funding_source_id: "${fr}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${rr}"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /taps/${tr}/reverse"
              payload: {}
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: verify_revoked_card_returns_invalid_state_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ReducedFareCard.PENDING_VERIFICATION_to_REVOKED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is terminal; verifying a REVOKED card -> ERR_INVALID_STATE (409), no transition."
        test_recipe:
          setup:
            - "Rider RV with a REVOKED ReducedFareCard CV."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rv@x.com", full_name: "R V", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rv: $.data.id }
            - call: "POST /reduced-fare-cards"
              payload: { rider_id: "${rv}", program_code: "SENIOR", expires_on: "2027-01-01" }
              as: Rider
              as_user_id: "${rv}"
              captures: { cv: $.data.id, tokv: $.data.verification_token }
            - call: "POST /reduced-fare-cards/${cv}/revoke"
              payload: {}
              as: FareAdmin
          trigger:
            - call: "POST /reduced-fare-cards/${cv}/verify"
              payload: { verification_token: "${tokv}" }
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: close_week_with_pending_tap_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FareWeek.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing a week that still has a PENDING tap violates the close precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Rider RC with OPEN week WC containing one PENDING (unsettled) tap."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rc@x.com", full_name: "R C", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rc: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rc}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rc}"
              captures: { fc: $.data.id }
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rc}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${rc}"
              captures: { wc: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${rc}", fare_week_id: "${wc}", funding_source_id: "${fc}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${rc}"
          trigger:
            - call: "POST /fare-weeks/${wc}/close"
              payload: {}
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and data.error_id == ERR_INVALID_STATE; FareWeek.${wc}.status remains OPEN"

      - name: newly_created_tap_starts_pending
        claim_type: Initial State
        grounds:
          - state_machines.Tap
          - entities.Tap.fields.status
        distinguishing_aspect: "A newly created tap has status == PENDING before any settle."
        test_recipe:
          setup:
            - "Rider RI with OPEN week WI."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "ri@x.com", full_name: "R I", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { ri: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${ri}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${ri}"
              captures: { fi: $.data.id }
            - call: "POST /fare-weeks"
              payload: { rider_id: "${ri}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${ri}"
              captures: { wi: $.data.id }
          trigger:
            - call: "POST /taps"
              payload: { rider_id: "${ri}", fare_week_id: "${wi}", funding_source_id: "${fi}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${ri}"
              captures: { st: $.data.status }
          assert:
            - "status == 201 and data.status == PENDING and data.charge_cents == 0"

      - name: tap_branching_capture_vs_reject_stub
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Tap.PENDING_to_REJECTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / tap_branching_capture_vs_reject_then_reverse
          rationale: "The CAPTURED and REJECTED branch side-effect divergence is fully asserted by the named §1.8 instance."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: weekly_cap_clips_charge_across_days
        claim_type: Correct Result
        grounds:
          - calculations.compute_tap_charge
          - entities.FareProduct.fields.weekly_cap_cents
          - entities.FareWeek.fields.charged_total_cents
        distinguishing_aspect: "With weekly_cap 1200 and 1000 already charged across earlier days, a day-3 tap is clipped to weekly_room 200 even though daily_room is 500."
        test_recipe:
          setup:
            - "Clock 2026-06-03T12:00:00Z."
            - "FareProduct ZONE_W base 300, daily 500, weekly 1200, transfer_discount_pct 0."
            - "Rider RW; FundingSource FW loaded 100000; OPEN week WW (week_start 2026-06-01)."
            - "Four CAPTURED taps over days 1-2 summing to 1000 (day1: 09:00 300 + 13:00 200 cap; day2: 09:00 300 + 13:00 200 cap)."
            - "Day-3 tap T5 at 2026-06-03T09:00 PENDING."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_W", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 1200, transfer_discount_pct: 0 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rw@x.com", full_name: "R W", home_zone_code: "ZONE_W" }
              as: Anonymous
              captures: { rw: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${rw}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${rw}"
              captures: { fw: $.data.id }
            - call: "POST /funding-sources/${fw}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${rw}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${rw}", week_start_date: "2026-06-01", zone_code: "ZONE_W" }
              as: Rider
              as_user_id: "${rw}"
              captures: { ww: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${rw}", fare_week_id: "${ww}", funding_source_id: "${fw}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${rw}"
              captures: { d1a: $.data.id }
            - call: "POST /taps/${d1a}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${rw}", fare_week_id: "${ww}", funding_source_id: "${fw}", tapped_at: "2026-06-01T13:00:00Z" }
              as: Rider
              as_user_id: "${rw}"
              captures: { d1b: $.data.id }
            - call: "POST /taps/${d1b}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${rw}", fare_week_id: "${ww}", funding_source_id: "${fw}", tapped_at: "2026-06-02T09:00:00Z" }
              as: Rider
              as_user_id: "${rw}"
              captures: { d2a: $.data.id }
            - call: "POST /taps/${d2a}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${rw}", fare_week_id: "${ww}", funding_source_id: "${fw}", tapped_at: "2026-06-02T13:00:00Z" }
              as: Rider
              as_user_id: "${rw}"
              captures: { d2b: $.data.id }
            - call: "POST /taps/${d2b}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${rw}", fare_week_id: "${ww}", funding_source_id: "${fw}", tapped_at: "2026-06-03T09:00:00Z" }
              as: Rider
              as_user_id: "${rw}"
              captures: { d3: $.data.id }
          trigger:
            - call: "POST /taps/${d3}/settle"
              payload: {}
              as: PaymentGateway
              captures: { ch: $.data.charge_cents }
          assert:
            - "Tap.${d3}.charge_cents == 200 (weekly_room == 1200 - 1000 == 200 binds before daily_room 500)"
            - "FareWeek.${ww}.charged_total_cents == 1200"

      - name: reduced_fare_card_halves_fare_input_set_filtering
        claim_type: Input Set Filtering
        grounds:
          - calculations.compute_tap_charge
          - entities.ReducedFareCard.fields.status
          - entities.FareProduct.fields.reduced_fare_pct
        distinguishing_aspect: "Only a VERIFIED unexpired card applies reduced_fare_pct; a PENDING_VERIFICATION card is excluded, so the rider pays full fare."
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X base 300, daily 5000, weekly 5000, reduced_fare_pct 0.5, transfer_discount_pct 0."
            - "Rider RD with a PENDING_VERIFICATION (NOT verified) ReducedFareCard; FundingSource FD loaded 100000; OPEN week WD."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 5000, weekly_cap_cents: 5000, reduced_fare_pct: 0.5, transfer_discount_pct: 0 }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "rd@x.com", full_name: "R D", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { rd: $.data.id }
            - call: "POST /reduced-fare-cards"
