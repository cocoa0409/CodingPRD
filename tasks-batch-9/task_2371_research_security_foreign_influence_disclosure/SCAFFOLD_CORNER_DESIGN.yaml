          difficulty_instance: support_statement_strict_agency_vs_institutional_rollup_flip_verdict
          rationale: "That instance re-reconciles the same statement under both variants and asserts the stored applied_variant, institutional_person_months, omission_count and the CONSISTENT to MATERIAL_DISCREPANCY flip with its downstream posture and blocker effects."

      - name: commitment_totals_round_per_row_before_summation
        claim_type: precision
        grounds:
          - calculations.investigator_commitment_totals
        excluded_because:
          difficulty_instance: commitment_totals_round_per_row_and_per_item_before_summation
          rationale: "That instance asserts 24.99 for three 1.00-person-month rows and 14.43 for three 100-hour items, which is exactly the per-row-then-sum precision claim."

      - name: risk_score_caps_the_item_subtotal_before_clamping
        claim_type: correct_result
        grounds:
          - calculations.investigator_risk_score
        excluded_because:
          difficulty_instance: risk_score_per_item_rounding_then_cap_then_clamp
          rationale: "That instance drives per-item rounding, the ITEM_POINT_CAP of 60 and the final clamp in one recipe and asserts the resulting posture, so a separate corner would only re-test the same arithmetic."

      - name: area_capacity_windows_are_half_open
        claim_type: interval_merge
        grounds:
          - calculations.controlled_area_capacity_projection
        excluded_because:
          difficulty_instance: area_windows_are_half_open_so_adjacent_grants_coexist
          rationale: "That instance activates a grant beginning exactly at another grant's valid_until and asserts peak 1, then rejects a genuinely overlapping third grant with ERR_AREA_CAPACITY_EXCEEDED."

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_investigator_email_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_15_uniqueness
          - errors.ERR_DUPLICATE_EMAIL
        distinguishing_aspect: "Email uniqueness is enforced at priority 15, after shape validation, so a second create with an existing email and otherwise valid body is a 409 ERR_DUPLICATE_EMAIL rather than a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one investigator already registered with email carla.imani@uni.edu."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Carla Imani", email: "carla.imani@uni.edu", appointment_type: "FACULTY", home_department: "Law" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /investigators"
              payload: { full_name: "Carla Imani (visiting)", email: "carla.imani@uni.edu", appointment_type: "RESEARCH_STAFF", home_department: "Law" }
              as: SystemAdmin
          assert:
            - "response code 409 with data.error_id == ERR_DUPLICATE_EMAIL"
            - "GET /investigators returns total_count == 1"

