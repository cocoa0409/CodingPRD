          - entities.Payer.fields.contact_deadline_basis
          - entities.CareEpisode.fields.contact_deadline_at
          - entities.CareEpisode.fields.contact_timely
        distinguishing_aspect: |
          The dual variant lives on the CareEpisode entity domain - the same
          2-unit SLA against the same Friday 2026-05-01 discharge resolves to
          2026-05-05T23:59:59.999Z under BUSINESS_DAYS (weekend skipped) and to
          2026-05-03T14:00:00.000Z under CALENDAR_HOURS, so one identical
