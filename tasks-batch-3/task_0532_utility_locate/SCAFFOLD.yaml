  - method: POST
    path: "/mark-outs/{markOutId}/complete"
    description: "Complete a mark-out; bubbles ticket to MARKED and (refresh) supersedes prior"
    roles: [LocateTech]
    code: 200
    input: []
    output: MarkOut
    side_effects:
      - "Set completed_at, valid_until = completed_at + MARKOUT_VALID_DAYS"
      - "Bubble-up: ticket.markout_completed_at, dig_window_expires_at; ticket -> MARKED"
      - "If refresh: prior MarkOut -> SUPERSEDED; increment ticket.version"

  # ---- MeetRequest ----
  - method: POST
    path: "/meet-requests"
    description: "Excavator requests a field meet / white-lining meet with a member"
    roles: [Excavator, CallCenter]
    code: 201
    input: [ticket_id, member_utility_id, proposed_start_min, proposed_end_min]
    output: MeetRequest
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/meet-requests"
    description: "List meet requests; filter by ticket_id or member_utility_id (FK reverse-reachability)"
    roles: [CallCenter, Admin, Excavator, LocateTech, FacilityOwner]
    code: 200
    input: ["ticket_id?", "member_utility_id?", "limit?", "offset?"]
    output: "MeetRequest[]"
    side_effects: []

  - method: GET
    path: "/meet-requests/{meetRequestId}"
    description: "Get a meet request"
    roles: [CallCenter, Admin, Excavator, LocateTech, FacilityOwner]
    code: 200
    input: []
    output: MeetRequest
    side_effects: []

  - method: POST
    path: "/meet-requests/{meetRequestId}/schedule"
    description: "Facility owner schedules a meet (overlap-checked)"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: MeetRequest
    side_effects: ["status -> SCHEDULED"]

  - method: POST
    path: "/meet-requests/{meetRequestId}/complete"
    description: "Facility owner completes a scheduled meet"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: MeetRequest
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/meet-requests/{meetRequestId}/decline"
    description: "Facility owner declines a meet"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: MeetRequest
    side_effects: ["status -> DECLINED"]

  # ---- DamageReport ----
  - method: POST
    path: "/damage-reports"
    description: "File a damage report / claim"
    roles: [FacilityOwner, Excavator]
    code: 201
    input: [ticket_id, member_utility_id, repair_cost_cents, dug_within_marks, "markout_id?"]
    output: DamageReport
    side_effects: ["status = FILED"]

  - method: GET
    path: "/damage-reports"
    description: "List damage reports; filter by ticket_id, member_utility_id, or markout_id (FK reverse-reachability)"
    roles: [CallCenter, Admin, Excavator, LocateTech, FacilityOwner]
    code: 200
    input: ["ticket_id?", "member_utility_id?", "markout_id?", "limit?", "offset?"]
    output: "DamageReport[]"
    side_effects: []

  - method: GET
    path: "/damage-reports/{damageReportId}"
    description: "Get a damage report"
    roles: [CallCenter, Admin, Excavator, LocateTech, FacilityOwner]
    code: 200
    input: []
    output: DamageReport
    side_effects: []

  - method: POST
    path: "/damage-reports/{damageReportId}/review"
    description: "Facility owner opens review; apportions liability"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: DamageReport
    side_effects:
      - "Recompute excavator_liability_cents, member_liability_cents (calc liability_apportionment)"
      - "status -> UNDER_REVIEW"

  - method: POST
    path: "/damage-reports/{damageReportId}/settle"
    description: "Facility owner settles the claim"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["status -> SETTLED"]

  - method: POST
    path: "/damage-reports/{damageReportId}/dispute"
    description: "Excavator disputes the claim"
    roles: [Excavator]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["status -> DISPUTED"]

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an absolute UTC instant. Server default before any call is 2026-05-01T00:00:00Z. Advancing past sla_due_at / sla_deadline_at / dig_window_expires_at fires system auto-transitions (ticket EXPIRED/SLA_BREACHED, assignment BREACHED, markout EXPIRED)."
    roles: [Admin, CallCenter]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Advance logical clock"
      - "Fire due auto-transitions across tickets, assignments, mark-outs"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Not found ---
  - { id: ERR_EXCAVATOR_NOT_FOUND, http: 404, condition: "Excavator id not found" }
  - { id: ERR_MEMBER_UTILITY_NOT_FOUND, http: 404, condition: "MemberUtility id not found" }
  - { id: ERR_LOCATE_TECH_NOT_FOUND, http: 404, condition: "LocateTech id not found" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "LocateTicket id not found" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "UtilityNotification id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "LocateAssignment id not found" }
  - { id: ERR_MARKOUT_NOT_FOUND, http: 404, condition: "MarkOut id not found" }
  - { id: ERR_MEET_REQUEST_NOT_FOUND, http: 404, condition: "MeetRequest id not found" }
  - { id: ERR_DAMAGE_REPORT_NOT_FOUND, http: 404, condition: "DamageReport id not found" }

  # --- Input / geometry ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "General malformed request body" }
  - { id: ERR_INVALID_GEOMETRY, http: 422, condition: "Invalid polygon box, marks_count<1, repair_cost_cents<0, or meet end<=start" }

  # --- Ticket state / submit ---
  - { id: ERR_TICKET_NOT_IN_INTAKE, http: 409, condition: "Submit requires ticket in INTAKE" }
  - { id: ERR_EXCAVATOR_SUSPENDED, http: 409, condition: "Submitting excavator is SUSPENDED" }
  - { id: ERR_NO_MEMBERS_IN_AREA, http: 422, condition: "No ACTIVE member utility's service_polygon intersects the dig_polygon" }
  - { id: ERR_MEET_REQUEST_REQUIRED, http: 409, condition: "NORMAL non-white-lined ticket has no MeetRequest before submit" }
  - { id: ERR_TICKET_NOT_MARKED, http: 409, condition: "Close requires ticket in MARKED" }
  - { id: ERR_DIG_WINDOW_EXPIRED, http: 409, condition: "Dig window expired: clock > dig_window_expires_at" }
  - { id: ERR_TICKET_NOT_CANCELLABLE, http: 409, condition: "Cancel requires ticket in INTAKE or SUBMITTED" }
  - { id: ERR_TICKET_NOT_ACCEPTING_RESPONSES, http: 409, condition: "Positive response requires parent ticket in SUBMITTED" }
  - { id: ERR_TICKET_NOT_ALL_CLEAR, http: 409, condition: "MarkOut complete requires ticket.response_posture == ALL_CLEAR" }

  # --- Notification / response ---
  - { id: ERR_NOTIFICATION_ALREADY_ANSWERED, http: 409, condition: "Notification not in PENDING" }
  - { id: ERR_NOT_NOTIFICATION_OWNER, http: 403, condition: "Acting FacilityOwner does not own notification.member_utility_id" }

  # --- Assignment / dispatch ---
  - { id: ERR_TECH_NOT_CERTIFIED, http: 422, condition: "Tech not certified for the member's facility_type" }
  - { id: ERR_TECH_OFF_DUTY, http: 409, condition: "Dispatched tech is OFF_DUTY" }
  - { id: ERR_ASSIGNMENT_NOT_DISPATCHED, http: 409, condition: "en-route requires assignment in DISPATCHED" }
  - { id: ERR_ASSIGNMENT_NOT_EN_ROUTE, http: 409, condition: "complete requires assignment in EN_ROUTE" }
  - { id: ERR_ASSIGNMENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires assignment in DISPATCHED or EN_ROUTE" }
  - { id: ERR_ASSIGNMENT_ACTIVE, http: 409, condition: "Ticket cancel blocked: an assignment is DISPATCHED or EN_ROUTE" }
  - { id: ERR_NOT_ASSIGNMENT_TECH, http: 403, condition: "Acting LocateTech does not own the assignment" }
  - { id: ERR_MARKOUT_NOT_COMPLETE, http: 409, condition: "Assignment complete requires a COMPLETE MarkOut" }

  # --- MarkOut ---
  - { id: ERR_MARKOUT_NOT_IN_PROGRESS, http: 409, condition: "MarkOut complete requires IN_PROGRESS" }
  - { id: ERR_MARKOUT_NOT_REFRESHABLE, http: 409, condition: "Refresh target not COMPLETE, or ticket dig window already expired" }
  - { id: ERR_STALE_TICKET_VERSION, http: 412, condition: "Refresh MarkOut expected_ticket_version != current ticket.version" }

  # --- MeetRequest ---
  - { id: ERR_MEET_NOT_REQUESTED, http: 409, condition: "schedule requires meet in REQUESTED" }
  - { id: ERR_MEET_NOT_SCHEDULED, http: 409, condition: "complete requires meet in SCHEDULED" }
  - { id: ERR_MEET_NOT_DECLINABLE, http: 409, condition: "decline requires meet in REQUESTED or SCHEDULED" }
  - { id: ERR_MEET_WINDOW_OVERLAP, http: 409, condition: "Proposed meet window overlaps another SCHEDULED meet for the same member" }
  - { id: ERR_NOT_MEET_OWNER, http: 403, condition: "Acting FacilityOwner does not own the meet's member_utility_id" }

  # --- DamageReport ---
  - { id: ERR_DAMAGE_NOT_FILED, http: 409, condition: "review requires report in FILED" }
  - { id: ERR_DAMAGE_NOT_UNDER_REVIEW, http: 409, condition: "settle/dispute requires report in UNDER_REVIEW" }
  - { id: ERR_NOT_DAMAGE_OWNER, http: 403, condition: "Acting FacilityOwner does not own the report's member_utility_id" }
  - { id: ERR_NOT_DAMAGE_EXCAVATOR, http: 403, condition: "Acting Excavator does not own the report's parent ticket excavator" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Excavator
    description: "Digging contractor; files tickets, meet requests, closes/cancels, disputes damage"
    identity: "entity_backed:Excavator"
    exclusive_operations:
      - "POST /locate-tickets/{id}/close — Close a marked ticket"
      - "POST /locate-tickets/{id}/submit (shared with CallCenter) — see shared"
      - "POST /damage-reports/{id}/dispute — Dispute a claim"
    shared_operations:
      - "POST /locate-tickets — Create ticket (with CallCenter)"
      - "POST /locate-tickets/{id}/submit — Submit ticket (with CallCenter)"
      - "POST /locate-tickets/{id}/cancel — Cancel ticket (with CallCenter)"
      - "POST /meet-requests — Request a meet (with CallCenter)"
      - "POST /damage-reports — File a damage report (with FacilityOwner)"
      - "GET endpoints — read access"

  - name: FacilityOwner
    description: "Member utility operator; posts positive responses, dispatches/cancels assignments, schedules meets, reviews/settles claims"
    identity: "entity_backed:MemberUtility"
    exclusive_operations:
      - "POST /positive-responses — Post positive response"
      - "POST /locate-assignments/{id}/cancel (shared with CallCenter) — see shared"
      - "POST /meet-requests/{id}/schedule — Schedule a meet"
      - "POST /meet-requests/{id}/complete — Complete a meet"
      - "POST /meet-requests/{id}/decline — Decline a meet"
      - "POST /damage-reports/{id}/review — Open review / apportion"
      - "POST /damage-reports/{id}/settle — Settle a claim"
    shared_operations:
      - "POST /locate-assignments — Dispatch a tech (with CallCenter)"
      - "POST /locate-assignments/{id}/cancel — Cancel assignment (with CallCenter)"
      - "POST /damage-reports — File a damage report (with Excavator)"
      - "GET endpoints — read access"

  - name: LocateTech
    description: "Field technician; drives assignment lifecycle and mark-outs"
    identity: "entity_backed:LocateTech"
    exclusive_operations:
      - "POST /locate-assignments/{id}/en-route — Go en route"
      - "POST /locate-assignments/{id}/complete — Complete assignment"
      - "POST /mark-outs — Create/refresh mark-out"
      - "POST /mark-outs/{id}/complete — Complete mark-out"
    shared_operations:
      - "GET endpoints — read access"

  - name: CallCenter
    description: "811 call-center operator; registers parties, creates/submits tickets on behalf of excavators, dispatches"
    identity: "opaque"
    exclusive_operations:
      - "POST /excavators — Register excavator"
      - "POST /member-utilities — Register member utility"
      - "POST /locate-techs — Register locate tech"
    shared_operations:
      - "POST /locate-tickets, /submit, /cancel — (with Excavator)"
      - "POST /meet-requests — (with Excavator)"
      - "POST /locate-assignments, /cancel — (with FacilityOwner)"
      - "POST /_clock/set_current_utc — (with Admin)"
      - "GET endpoints — read access"

  - name: Admin
    description: "System administrator; suspensions, deactivations, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /excavators/{id}/suspend — Suspend excavator"
      - "POST /member-utilities/{id}/deactivate — Deactivate member"
    shared_operations:
      - "POST /_clock/set_current_utc — (with CallCenter)"
      - "GET endpoints — read access"
