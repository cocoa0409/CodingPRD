# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_2008_builder_warranty_homeowner_callback
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: homeowner_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Homeowner]
        distinguishing_aspect: "POST /homeowners with phone omitted returns 201 with phone null, server-minted UUID id, created_at, and version 1."
        test_recipe:
          setup: ["empty DB; default logical clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id, ho_phone: $.data.phone, ho_v: $.data.version, ho_created: $.data.created_at }
          assert:
            - "ho_phone is null (documented default applied)"
            - "ho_v == 1 and ho_created == 2026-08-01T00:00:00Z (system fields stamped from the logical clock)"
            - "ho_id is a UUID with no type prefix"
      - name: home_creation_computes_tier_dates_and_reserve
        claim_type: computed_fields
        grounds: [entities.Home.fields.workmanship_end_date, entities.WarrantyReserve]
        distinguishing_aspect: "Creating a home with closing 2026-06-01 computes the three EXCLUSIVE tier end dates and auto-creates the 1:1 reserve with expected accrual 200000 and balance 0."
        test_recipe:
          setup: ["homeowner exists"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-901", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id, wm_end: $.data.workmanship_end_date, sys_end: $.data.systems_end_date, str_end: $.data.structural_end_date }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_balance: "$.data[0].balance_cents", res_expected: "$.data[0].expected_lifetime_accrual_cents", res_alert: "$.data[0].alert_status" }
          assert:
            - "wm_end == 2027-06-01 and sys_end == 2028-06-01 and str_end == 2036-06-01 (12/24/120 months)"
            - "res_expected == 200000 (round_half_up(40000000 x 0.005)) and res_balance == 0 and res_alert == NORMAL"
            - "exactly one reserve exists for the home (list length 1)"
      - name: service_request_intake_stamps_logical_clock
        claim_type: system_fields
        grounds: [entities.ServiceRequest.fields.reported_at, entities.ServiceRequest.fields.response_due_at]
        distinguishing_aspect: "Without any clock-set call, intake stamps reported_at from the DEFAULT clock 2026-08-01T00:00:00Z and derives response_due_at +72h for STANDARD severity."
        test_recipe:
          setup: ["homeowner + home exist; clock never set (startup default)"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-902", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "HVAC", severity: "STANDARD", description: "AC not cooling" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_reported: $.data.reported_at, sr_due: $.data.response_due_at, sr_status: $.data.status, sr_homeowner: $.data.homeowner_id }
          assert:
            - "sr_reported == 2026-08-01T00:00:00Z (startup default clock, not wall clock)"
            - "sr_due == 2026-08-04T00:00:00Z (72h STANDARD response leg)"
            - "sr_status == RECEIVED (initial state) and sr_homeowner == ${ho_id} (copied from X-User-ID)"
      - name: reserve_entry_has_no_version_field
        claim_type: immutability
        grounds: [entities.ReserveEntry]
        distinguishing_aspect: "ReserveEntry is append-only (common_fields false): fetched entries expose id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["home closing 2026-06-01; clock 2026-08-01; sweep posted 2 ACCRUAL entries"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-903", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: WarrantyManager
            - call: "POST /ops/run-sweep"
              as: WarrantyManager
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id" }
          trigger:
            - call: "GET /warranty-reserves/${res_id}/entries"
              as: FinanceAdmin
              captures: { entry_id: "$.data[0].id", entry_kind: "$.data[0].kind", entry_month: "$.data[0].month_index" }
          assert:
            - "entry_kind == ACCRUAL and entry_month == 1 (first elapsed month posted first)"
            - "entry objects contain id and created_at and contain NO version and NO updated_at keys"
            - "no PUT/PATCH/DELETE endpoint exists for /warranty-reserves/{id}/entries (append-only)"
      - name: home_invalid_program_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Home.fields.warranty_program, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "warranty_program outside {STANDARD, THIRD_PARTY_ADMINISTERED} is a 400 shape error."
        test_recipe:
          setup: ["homeowner exists"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-904", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "PREMIUM" }
              as: WarrantyManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"
            - "no home and no reserve are created (GET /homes?homeowner_id=${ho_id} total_count == 0)"

  - section: state_machines
    instances:
      - name: sr_closed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceRequest, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A fully closed request rejects every further action (assess shown) with ERR_ALREADY_TERMINAL 409, not ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "approved PLUMBING request with one work order completed (actual 60000, BUILDER) and ACCEPTED, then follow-up closed it"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-910", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 60000 }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "POST /work-orders/${wo_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /service-requests/${sr_id}/follow-up"
              payload: { satisfaction_score: 5, notes: "All good" }
              as: WarrantyRep
              captures: { closed_status: $.data.status }
          trigger:
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
              captures: { err: $.data.error_id }
            - call: "POST /service-requests/${sr_id}/dispute"
              payload: { dispute_reason: "Changed my mind" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "closed_status == CLOSED (follow-up closed the request)"
            - "err == ERR_ALREADY_TERMINAL and err2 == ERR_ALREADY_TERMINAL, both HTTP 409"
      - name: wo_rework_cycle_reject_then_reschedule
        claim_type: valid_transition
        grounds: [state_machines.WorkOrder.COMPLETED_to_REJECTED, state_machines.WorkOrder.REJECTED_to_SCHEDULED]
        distinguishing_aspect: "The rework loop is real: verify REJECT requires a reason (400 without it), lands in REJECTED, and reschedule returns the order to SCHEDULED with a fresh window and re-counted capacity."
        test_recipe:
          setup: ["approved request; tp; work order completed with actual 80000"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-911", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "FLOORING", severity: "STANDARD", description: "Tile lippage" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "TrueLevel Flooring", trade: "FLOORING", contact_email: "sched@truelevel.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 90000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 80000 }
              as: TradePartner
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/verify"
              payload: { outcome: "REJECT" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
            - call: "POST /work-orders/${wo_id}/verify"
              payload: { outcome: "REJECT", rejection_reason: "Grout lines still uneven" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { rej_status: $.data.status }
            - call: "POST /work-orders/${wo_id}/reschedule"
              payload: { window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T11:00:00Z" }
              as: WarrantyRep
              captures: { re_status: $.data.status, re_start: $.data.window_start, re_completed: $.data.completed_at }
            - call: "GET /trade-partners/${tp_id}"
              as: WarrantyManager
              captures: { tp_open: $.data.open_work_order_count }
          assert:
            - "err == ERR_INVALID_REQUEST (rejection_reason required) with HTTP 400 and the order stays COMPLETED"
            - "rej_status == REJECTED"
            - "re_status == SCHEDULED and re_start == 2026-08-12T09:00:00Z and re_completed is null (re-armed)"
            - "tp_open == 1 (REJECTED -> SCHEDULED re-enters the count)"
      - name: wo_verify_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify is defined only from COMPLETED; on a SCHEDULED order it fails ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["approved request; tp; work order SCHEDULED (not yet completed)"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-912", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE, HTTP 409; order remains SCHEDULED"
      - name: cb_cancelled_work_order_voids_chargeback_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Chargeback.ISSUED_to_VOID, state_machines.WorkOrder.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED work order auto-VOIDs its provisional chargeback; a later contest hits ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["approved request; tp; wo estimated 110000 SUBCONTRACTOR; cb ISSUED 93500"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-913", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 110000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { cancel_reason: "Duplicate dispatch" }
              as: WarrantyRep
          trigger:
            - call: "GET /chargebacks/${cb_id}"
              as: WarrantyRep
              captures: { cb_status: $.data.status }
            - call: "POST /chargebacks/${cb_id}/contest"
              payload: { contest_reason: "Too late anyway" }
              as: TradePartner
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "cb_status == VOID (cancel cascade voided the provisional chargeback)"
            - "err == ERR_ALREADY_TERMINAL, HTTP 409"
      - name: claim_deny_requires_reason_then_terminal
        claim_type: precondition_enforcement
        grounds: [state_machines.AdministratorClaim.SUBMITTED_to_DENIED, state_machines.AdministratorClaim]
        distinguishing_aspect: "DENY without denial_reason is a 400 shape error; once DENIED the claim is terminal and a second decide hits ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["THIRD_PARTY home; approved FOUNDATION request; claim SUBMITTED for 900000"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-914", community_name: "Cedar Ridge", sale_price_cents: 50000000, closing_date: "2026-06-01", warranty_program: "THIRD_PARTY_ADMINISTERED" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "FOUNDATION", severity: "URGENT", description: "Stem wall crack" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /administrator-claims"
              payload: { service_request_id: "${sr_id}", claimed_amount_cents: 900000 }
              as: WarrantyRep
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /administrator-claims/${cl_id}/decide"
              payload: { outcome: "DENY" }
              as: WarrantyAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /administrator-claims/${cl_id}/decide"
              payload: { outcome: "DENY", denial_reason: "Pre-existing soil condition excluded" }
              as: WarrantyAdministrator
              captures: { cl_status: $.data.status }
            - call: "POST /administrator-claims/${cl_id}/decide"
              payload: { outcome: "ACCEPT", approved_amount_cents: 900000 }
              as: WarrantyAdministrator
              captures: { err2: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST, HTTP 400 (denial_reason required for DENY)"
            - "cl_status == DENIED"
            - "err2 == ERR_ALREADY_TERMINAL, HTTP 409"
      - name: sr_auto_close_after_followup_window
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServiceRequest.PENDING_FOLLOWUP_to_CLOSED
        distinguishing_aspect: "The sweep auto-closes a request whose followup_entered_at + 14 days has been reached (inclusive), stamping closed_at from the clock."
        test_recipe:
          setup:
            - "request driven to PENDING_FOLLOWUP at the default clock 2026-08-01 (approved, work order completed 60000 and ACCEPTED)"
            - "clock advanced to exactly 2026-08-15T00:00:00Z (14 days after follow-up entry)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-915", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 60000 }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "POST /work-orders/${wo_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { wo_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: WarrantyManager
          trigger:
            - call: "POST /ops/run-sweep"
              as: WarrantyManager
              captures: { n_closed: $.data.requests_auto_closed }
            - call: "GET /service-requests/${sr_id}"
              as: WarrantyRep
              captures: { sr_status: $.data.status, sr_closed_at: $.data.closed_at }
          assert:
            - "wo_status == ACCEPTED (bubble-up moved the request to PENDING_FOLLOWUP at 2026-08-01T00:00:00Z)"
            - "n_closed == 1 (boundary is inclusive: now == followup_entered_at + 14 days auto-closes)"
            - "sr_status == CLOSED and sr_closed_at == 2026-08-15T00:00:00Z"
