      - name: crew_buffer_edge_exactly_five_minutes_is_admitted
        grounds:
          - calculations.crew_calendar_occupation
          - validations[priority 16 - business_temporal - ERR_CREW_INTERVAL_CONFLICT]
          - endpoints[POST /crr/visits]
        distinguishing_aspect: |
          A third metric on a third endpoint: the same-route travel buffer in whole minutes on visit
          booking. The existing visit ends at 14:35Z, so a candidate starting exactly at 14:40Z
          (end + TRAVEL_BUFFER_SAME_ROUTE_MINUTES) is admitted, while one starting at 14:39Z - one
          minute inside the buffer - is rejected. The interval itself is half-open on the end instant.
