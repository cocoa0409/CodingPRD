      - name: second_lottery_run_blocked_while_active_returns_active_lottery_exists
        claim_type: conditional_action
        grounds:
          - validations[priority=6]
          - errors[ERR_ACTIVE_LOTTERY_EXISTS]
        distinguishing_aspect: "With a DRAFT run present and a FRESH campaign version (OCC passes), a second create fails with ERR_ACTIVE_LOTTERY_EXISTS — the state-tier guard, distinct from the OCC-tier stale-version failure."
