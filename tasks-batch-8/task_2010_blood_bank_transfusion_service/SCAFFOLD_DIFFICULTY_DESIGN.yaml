  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (two different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_reservation_half_open_adjacency
        grounds:
          - validations[priority=7]
          - calculations.crossmatch_reserved_until
        distinguishing_aspect: |
          Resource = BloodUnit, semantics = half-open reservation window
          [resulted_at, reserved_until): a second crossmatch on the RESERVED unit
          is rejected ERR_UNIT_NOT_AVAILABLE, but the moment the reservation is
          cancelled the unit is re-reservable with ZERO gap — no buffer period
          exists in this semantics.
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; patient A POS, T&S ACTIVE; order O1 READY with U1 RESERVED via X1 (reserved_until 2026-08-13T08:00:00Z)"
            - "order O2 (same patient, RBC x1) verified -> AWAITING_CROSSMATCH"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-9040", full_name: "Pat Forty", date_of_birth: "1981-06-06", special_requirements: [] }
              as: BloodBankTechnologist
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat_id}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts_id: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts_id}/result"
              payload: { abo_result: "A", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts_id}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat_id}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord1: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord1}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord1}", unit_id: "${u1}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm1: $.data.id }
            - call: "POST /blood-bank/crossmatches/${xm1}/record-result"
              payload: { result: "COMPATIBLE" }
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat_id}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord2: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord2}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
          trigger:
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord2}", unit_id: "${u1}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err: $.data.error_id }
            - call: "POST /blood-bank/crossmatches/${xm1}/cancel"
              as: BloodBankTechnologist
