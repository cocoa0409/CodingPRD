            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/buyers"
