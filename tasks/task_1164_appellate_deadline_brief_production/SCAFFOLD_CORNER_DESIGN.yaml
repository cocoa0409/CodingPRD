# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Enumerates every testable claim §1.1–§1.7 declares that §1.8 does not cover.
# Taxonomy follows claim-extraction-guide.md sections.
# =============================================================================
scaffold_corner_design:
  # =========================================================================
  # §1.1 Entities
  # =========================================================================
  - section: entities
    instances:
      - name: court_creation_returns_201_and_computed_defaults
        claim_type: creation
        grounds:
          - entities.Court
        distinguishing_aspect: "POST /appellate/courts with all required fields returns 201, server-minted id, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
          trigger:
            - call: "POST /appellate/courts"
              payload: { code: "CT1", name: "Court 1", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_id: $.data.id, ct_v: $.data.version }
          assert:
            - "HTTP 201"
            - "Court.${ct_id}.id is a UUID"
            - "Court.${ct_id}.version == 1"
            - "Court.${ct_id}.code == 'CT1'"

      - name: court_get_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - entities.Court
        distinguishing_aspect: "GET /appellate/courts/{id} returns the court created earlier with identical fields."
        test_recipe:
          setup: ["Court CT1 exists"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CT1", name: "Court 1", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_id: $.data.id }
          trigger:
            - call: "GET /appellate/courts/${ct_id}"
              payload: {}
              as: CourtAdmin
              captures: { got_code: $.data.code, got_jur: $.data.jurisdiction_type }
          assert:
            - "HTTP 200"
            - "returned code == 'CT1'"
            - "returned jurisdiction_type == FEDERAL"

      - name: court_list_pagination
        claim_type: listing
        grounds:
          - entities.Court
          - response_envelope
        distinguishing_aspect: "GET /appellate/courts returns paginated list with total_count and has_more."
        test_recipe:
          setup: ["Three courts created"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "L1", name: "L1", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "L2", name: "L2", jurisdiction_type: "STATE", appeal_deadline_days: 60, reply_brief_window_days: 21, uses_word_count: false, max_words_opening: 0, max_pages_opening: 40, max_words_reply: 0, max_pages_reply: 20, efiling_required: false, weekend_holiday_rollforward: true }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "L3", name: "L3", jurisdiction_type: "TRIBAL", appeal_deadline_days: 45, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 10000, max_pages_opening: 0, max_words_reply: 5000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
          trigger:
            - call: "GET /appellate/courts?limit=2&offset=0"
              payload: {}
              as: CourtAdmin
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array"
            - "data array length == 2"
            - "total_count == 3"
            - "has_more == true"

      - name: court_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Court
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
          trigger:
            - call: "GET /appellate/courts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CourtAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: court_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Court
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST without `code` returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
          trigger:
            - call: "POST /appellate/courts"
              payload: { name: "No Code", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: court_duplicate_code_returns_duplicate
        claim_type: type_constraints
        grounds:
          - entities.Court
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Two courts with same code violate uniqueness — second POST returns ERR_DUPLICATE."
        test_recipe:
          setup: ["Court with code='DUP' exists"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "DUP", name: "First", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
          trigger:
            - call: "POST /appellate/courts"
              payload: { code: "DUP", name: "Second", jurisdiction_type: "STATE", appeal_deadline_days: 60, reply_brief_window_days: 21, uses_word_count: false, max_words_opening: 0, max_pages_opening: 40, max_words_reply: 0, max_pages_reply: 20, efiling_required: false, weekend_holiday_rollforward: true }
              as: CourtAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE"

      - name: attorney_computed_fields_not_settable_by_input
        claim_type: computed_fields
        grounds:
          - entities.Attorney
          - entities.Case
        distinguishing_aspect: "Attempting to pass `version` or `created_at` in POST /attorneys body is ignored — server-minted values returned."
        test_recipe:
          setup: ["Court exists"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CF1", name: "CF1", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_cf1: $.data.id }
          trigger:
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-CF1", full_name: "CF1", email: "cf1@x.com", admitted_court_ids: ["${ct_cf1}"] }
              as: CourtAdmin
              captures: { att_id: $.data.id, att_v: $.data.version, att_ca: $.data.created_at }
          assert:
            - "Attorney.${att_id}.version == 1"
            - "Attorney.${att_id}.created_at == '2026-05-01T00:00:00Z' (logical clock)"
            - "Server ignores any client-supplied version/created_at"

      - name: case_creation_cascade_creates_record_and_schedule
        claim_type: creation
        grounds:
          - entities.Case
          - entities.Record
          - entities.BriefingSchedule
        distinguishing_aspect: "Case POST doesn't immediately create Record/Schedule (they're created on NOA filing accept); but it does auto-create the JUDGMENT_ENTERED AppealEvent and NOTICE_OF_APPEAL Deadline."
        test_recipe:
          setup: ["Court and attorney exist"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "CC1", name: "CC1", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: true, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_cc1: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-CC1", full_name: "CC1", email: "cc1@x.com", admitted_court_ids: ["${ct_cc1}"] }
              as: CourtAdmin
              captures: { att_cc1: $.data.id }
          trigger:
            - call: "POST /appellate/cases"
              payload: { court_id: "${ct_cc1}", docket_number: "CC-1", caption: "CC1", lead_attorney_id: "${att_cc1}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_cc1}"
              captures: { case_cc1: $.data.id, case_posture: $.data.posture }
            - call: "GET /appellate/cases/${case_cc1}/events"
              payload: {}
              as: Attorney
              as_user_id: "${att_cc1}"
            - call: "GET /appellate/cases/${case_cc1}/deadlines"
              payload: {}
              as: Attorney
              as_user_id: "${att_cc1}"
          assert:
            - "Case.${case_cc1}.posture == OPEN"
            - "GET events returns 1 event with event_type == JUDGMENT_ENTERED"
            - "GET deadlines returns 1 deadline with kind == NOTICE_OF_APPEAL"
            - "Deadline.provisional_due_at == '2026-05-31T00:00:00Z' (2026-05-01 + 30 days)"

  # =========================================================================
  # §1.2 State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: brief_submit_review_from_non_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Brief.DRAFT_to_IN_REVIEW
        distinguishing_aspect: "Calling submit-review on a brief already IN_REVIEW returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Brief B in IN_REVIEW"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "SM1", name: "SM1", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_sm1: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-SM1", full_name: "SM1", email: "sm1@x.com", admitted_court_ids: ["${ct_sm1}"] }
              as: CourtAdmin
              captures: { att_sm1: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${ct_sm1}", docket_number: "SM-1", caption: "SM1", lead_attorney_id: "${att_sm1}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { case_sm1: $.data.id }
            - call: "POST /appellate/cases/${case_sm1}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { f_sm1: $.data.id }
            - call: "POST /appellate/filings/${f_sm1}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_sm1}/record"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { rec_sm1: "$.data[0].id" }
            - call: "POST /appellate/records/${rec_sm1}/designate"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm1}"
            - call: "POST /appellate/records/${rec_sm1}/transcript-orders"
              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "R", estimated_pages: 5 }
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { to_sm1: $.data.id }
            - call: "POST /appellate/transcript-orders/${to_sm1}/begin-preparation"
              payload: {}
              as: CourtClerk
            - call: "POST /appellate/transcript-orders/${to_sm1}/deliver"
              payload: { actual_pages: 5 }
              as: CourtClerk
            - call: "GET /appellate/cases/${case_sm1}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { sched_sm1: "$.data[0].id" }
            - call: "POST /appellate/cases/${case_sm1}/briefs"
              payload: { schedule_id: "${sched_sm1}", brief_type: "OPENING", author_attorney_id: "${att_sm1}", page_count: 5, word_count: 1000 }
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { brief_sm1: $.data.id }
            - call: "POST /appellate/briefs/${brief_sm1}/submit-review"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm1}"
          trigger:
            - call: "POST /appellate/briefs/${brief_sm1}/submit-review"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm1}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"
            - "Brief remains IN_REVIEW"

      - name: transcript_cancel_from_terminal_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TranscriptOrder
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Cancel a transcript already in FILED status — terminal state, returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["TranscriptOrder in FILED"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "SM2", name: "SM2", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_sm2: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-SM2", full_name: "SM2", email: "sm2@x.com", admitted_court_ids: ["${ct_sm2}"] }
              as: CourtAdmin
              captures: { att_sm2: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${ct_sm2}", docket_number: "SM-2", caption: "SM2", lead_attorney_id: "${att_sm2}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_sm2}"
              captures: { case_sm2: $.data.id }
            - call: "POST /appellate/cases/${case_sm2}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_sm2}"
              captures: { f_sm2: $.data.id }
            - call: "POST /appellate/filings/${f_sm2}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_sm2}/record"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm2}"
              captures: { rec_sm2: "$.data[0].id" }
            - call: "POST /appellate/records/${rec_sm2}/designate"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm2}"
            - call: "POST /appellate/records/${rec_sm2}/transcript-orders"
              payload: { hearing_date: "2026-04-01T10:00:00Z", court_reporter: "R", estimated_pages: 5 }
              as: Attorney
              as_user_id: "${att_sm2}"
              captures: { to_sm2: $.data.id }
            - call: "POST /appellate/transcript-orders/${to_sm2}/begin-preparation"
              payload: {}
              as: CourtClerk
            - call: "POST /appellate/transcript-orders/${to_sm2}/deliver"
              payload: { actual_pages: 5 }
              as: CourtClerk
            - call: "POST /appellate/transcript-orders/${to_sm2}/file"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm2}"
          trigger:
            - call: "POST /appellate/transcript-orders/${to_sm2}/cancel"
              payload: {}
              as: Attorney
              as_user_id: "${att_sm2}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_ALREADY_TERMINAL"

      - name: extension_motion_withdraw_precondition_lead_attorney_only
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ExtensionMotion.PENDING_to_WITHDRAWN
        distinguishing_aspect: "Only the lead_attorney of the case may withdraw; another attorney gets ERR_INVALID_STATE (or ERR_FORBIDDEN_ROLE)."
        test_recipe:
          setup: ["Case with lead=A1; motion in PENDING; another attorney A2 admitted"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "SM3", name: "SM3", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_sm3: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-L1", full_name: "Lead", email: "lead@x.com", admitted_court_ids: ["${ct_sm3}"] }
              as: CourtAdmin
              captures: { att_lead: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-OTHER", full_name: "Other", email: "other@x.com", admitted_court_ids: ["${ct_sm3}"] }
              as: CourtAdmin
              captures: { att_other: $.data.id }
            - call: "POST /appellate/cases"
              payload: { court_id: "${ct_sm3}", docket_number: "SM-3", caption: "SM3", lead_attorney_id: "${att_lead}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_lead}"
              captures: { case_sm3: $.data.id }
            - call: "POST /appellate/cases/${case_sm3}/filings"
              payload: { filing_type: "NOTICE_OF_APPEAL", method: "EFILE", served_party_emails: ["o@x.com"] }
              as: Attorney
              as_user_id: "${att_lead}"
              captures: { f_sm3: $.data.id }
            - call: "POST /appellate/filings/${f_sm3}/accept"
              payload: {}
              as: CourtClerk
            - call: "GET /appellate/cases/${case_sm3}/briefing-schedule"
              payload: {}
              as: Attorney
              as_user_id: "${att_lead}"
              captures: { sched_sm3: "$.data[0].id" }
            - call: "POST /appellate/cases/${case_sm3}/extension-motions"
              payload: { schedule_id: "${sched_sm3}", target: "OPENING", requested_days: 7, reason: "x" }
              as: Attorney
              as_user_id: "${att_lead}"
              captures: { motion_sm3: $.data.id }
          trigger:
            - call: "POST /appellate/extension-motions/${motion_sm3}/withdraw"
              payload: {}
              as: Attorney
              as_user_id: "${att_other}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 4xx (403 or 409) — non-lead attorney cannot withdraw"
            - "error_id IN {ERR_FORBIDDEN_ROLE, ERR_INVALID_STATE}"

      - name: case_posture_open_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Case
        distinguishing_aspect: "Newly created Case has posture == OPEN."
        test_recipe:
          setup: ["Court and attorney exist"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /appellate/courts"
              payload: { code: "SM4", name: "SM4", jurisdiction_type: "FEDERAL", appeal_deadline_days: 30, reply_brief_window_days: 14, uses_word_count: true, max_words_opening: 14000, max_pages_opening: 0, max_words_reply: 7000, max_pages_reply: 0, efiling_required: false, weekend_holiday_rollforward: false }
              as: CourtAdmin
              captures: { ct_sm4: $.data.id }
            - call: "POST /appellate/attorneys"
              payload: { bar_number: "BAR-SM4", full_name: "SM4", email: "sm4@x.com", admitted_court_ids: ["${ct_sm4}"] }
              as: CourtAdmin
              captures: { att_sm4: $.data.id }
          trigger:
            - call: "POST /appellate/cases"
              payload: { court_id: "${ct_sm4}", docket_number: "SM-4", caption: "SM4", lead_attorney_id: "${att_sm4}", appellant_side: "APPELLANT", judgment_entered_at: "2026-05-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_sm4}"
              captures: { case_sm4_posture: "$.data.posture" }
          assert:
            - "Case.posture == OPEN on creation"

      - name: record_revoke_designation_cancels_open_transcripts
        claim_type: side_effect_execution
        grounds:
          - state_machines.Record.DESIGNATED_to_PENDING_DESIGNATION
        distinguishing_aspect: "Revoking designation transitions all non-terminal TranscriptOrders to CANCELLED."
        test_recipe:
