            - "L2: ${l2_review} == \"QUALIFIED\"."
            - "L3: ${l3_status} == \"CONVERTED\", ${l3_segdate} == \"2026-09-15\", earnings_growth_bps == 300, earnings_adjustment_cents == 48001, hold_amount_cents == 1600000 unchanged, expires_at == \"2028-03-02T00:00:00Z\" unchanged."
            - "L4: ${l4_mode} == \"SEPARATE_INTEREST\", ${l4_balance} == 1648001, after_tax_basis_cents == 24000, per_period_amount_cents == 0, shared_payment_end_date == null, total_distributed_gross_cents == 0, established_at == \"2026-09-15T00:00:00Z\", status == \"ESTABLISHED\", version == 1."
            - "L5: GET /plan-accounts/${acct_id}/money-sources reports AFTER_TAX 58800 with basis_cents 36000, EMPLOYER_MATCH 876193, PRE_TAX_DEFERRAL 1417006, LOAN_RECEIVABLE 300000; ${l5_vested} == 2651999 and ${l5_held} == 0, with assignable_base_cents 2351999, after_tax_basis_cents 36000 and available_balance_cents 2651999."
            - "L6: ${l6_seg} == \"CONVERTED\" and GET /qdro-cases/${case_id}/communications returns exactly 3 rows in order — (PARTICIPANT, RECEIPT_ACKNOWLEDGMENT, LIMITED, SYSTEM, sent_at 2026-09-01T00:00:00Z), (PARTICIPANT, DETERMINATION_QUALIFIED, FULL, SYSTEM, sent_at 2026-09-15T00:00:00Z), (ALTERNATE_PAYEE, DETERMINATION_QUALIFIED, FULL, SYSTEM, sent_at 2026-09-15T00:00:00Z) — with attorney_email null on all three."
            - "L7: ${l7_version} == 3 — one increment for the receipt, one for the qualification."
            - "Conservation across the whole chain: the payee's 1648001 equals the sum of the three source debits 41200 + 613932 + 992869, and 2651999 + 1648001 == 4300000, the account's original vested balance."
            - "A second POST /draft-orders/${draft_id}/qualify returns ERR_DRAFT_ORDER_NOT_UNDER_REVIEW (409) and neither the payee balance nor any money source changes — the cascade does not run twice."

      - name: segregation_lapse_sweep_five_level_denial_cascade
        grounds:
          - endpoints[POST /_ops/run-segregation-sweep]
          - state_machines.SegregationHold
          - state_machines.QdroCase[dimension=segregation_status]
          - state_machines.QdroCase[dimension=review_status]
          - state_machines.DraftOrder
          - state_machines.DeficiencyNotice
          - entities.DraftOrder.fields.denial_reason
          - calculations.hold_window_and_deadlines
        distinguishing_aspect: |
          One system call with an empty body drives a five-level chain in the opposite direction from
          qualification: hold HELD -> EXPIRED, the PlanAccount's held/available balances restored,
          QdroCase.segregation_status -> LAPSED, the case's live DraftOrder -> DENIED with
          denial_reason SEGREGATION_LAPSED and every ISSUED DeficiencyNotice on it -> EXPIRED, then
          QdroCase.review_status -> DENIED with two Communication rows. Two of those five levels are
          themselves nested cascades (the draft's notices, the case's second dimension), and the
          sweep's own response body must enumerate the ids it touched in five separate arrays. An
          implementation that expires the hold but forgets link L4 leaves a DEFICIENT draft order alive
          on a case whose money is already gone.
        test_recipe:
          setup:
            - "A PUBLISHED plan with segregation_period_days 548 and resubmission_window_days 60."
            - "A participant not in pay status with a single assignable PRE_TAX_DEFERRAL source of 1000000 and one snapshot on 2026-06-30 at 1000000."
            - "A draft order with uses_model_language false received at clock 2026-09-01, so the hold of 400000 is placed with expires_at 2028-03-02T00:00:00Z and a deficiency notice can be issued."
            - "A deficiency notice is issued at 2026-09-01 (resubmission_deadline_at 2026-10-31), left ISSUED — never cured."
            - "The clock is pushed to 2028-03-03T00:00:00Z, strictly past the hold's expiry."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Lapse Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 5000, max_assignable_amount_cents: 2000000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Oona Brightwater", ssn_last4: "9004", date_of_birth: "1974-12-01", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Ilse Brightwater", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1977-05-05", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-X1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", expires: "$.data[0].expires_at" }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "model language missing; resubmit with plan model language" }
              as: QdroAnalyst
              as_user_id: "u-9001"
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-03T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { evaluated: $.data.evaluated_count }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { hold_status: $.data.status }
            - call: "GET /qdro-cases/${case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { case_seg: $.data.segregation_status, case_review: $.data.review_status }
            - call: "GET /draft-orders/${draft_id}"
              payload: {}
              as: PlanAdministrator
              captures: { draft_status: $.data.status, draft_reason: $.data.denial_reason }
            - call: "GET /draft-orders/${draft_id}/deficiency-notices"
              payload: {}
              as: PlanAdministrator
              captures: { notice_status: "$.data[0].status" }
            - call: "GET /plan-accounts/${acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { avail: $.data.available_balance_cents, held: $.data.held_amount_cents }
          assert:
            - "${expires} == \"2028-03-02T00:00:00Z\" — placed_at 2026-09-01T00:00:00Z plus 548 days."
            - "The sweep response reports expired_hold_ids == [\"${hold_id}\"], lapsed_case_ids == [\"${case_id}\"], denied_draft_order_ids == [\"${draft_id}\"], expired_notice_ids == [\"${notice_id}\"], closed_ap_account_ids == [] and ${evaluated} == 1."
            - "L1: ${hold_status} == \"EXPIRED\" with hold_amount_cents still 400000, segregation_date still null, earnings_adjustment_cents still 0."
            - "L2: ${held} == 0 and ${avail} == 1000000 — the participant's money is fully available again; GET /plan-accounts/${acct_id}/money-sources shows PRE_TAX_DEFERRAL still 1000000, never debited."
            - "L3: ${case_seg} == \"LAPSED\"."
            - "L4: ${draft_status} == \"DENIED\" with ${draft_reason} == \"SEGREGATION_LAPSED\", and ${notice_status} == \"EXPIRED\" — the notice was expired by the nested cascade, not cured."
            - "L5: ${case_review} == \"DENIED\" and GET /qdro-cases/${case_id}/communications returns exactly 5 rows in sent_at order: the receipt acknowledgment, the two DEFICIENCY_NOTICE rows, then (PARTICIPANT, SEGREGATION_LAPSE_NOTICE, FULL, SYSTEM) followed by (ALTERNATE_PAYEE, SEGREGATION_LAPSE_NOTICE, LIMITED, SYSTEM), the last two both sent_at 2028-03-03T00:00:00Z."
            - "L6: GET /qdro-cases/${case_id} reports version == 4 (creation 1, receipt, notice, sweep)."
            - "A second POST /_ops/run-segregation-sweep returns evaluated_count == 0 with all five id arrays empty and changes nothing — the phase-1 predicate only sees HELD holds."
            - "POST /segregation-holds/${hold_id}/release now returns ERR_HOLD_NOT_HELD (409) — the lapse consumed the hold, so the manual release path is closed."

      - name: distribution_void_three_level_compensating_cascade
        grounds:
          - endpoints[POST /distributions/{id}/void]
          - state_machines.Distribution
          - calculations.ap_account_derived_totals
          - calculations.tax_report_net_position
          - entities.TaxReport.fields.correction_of_tax_report_id
          - entities.AlternatePayeeAccount.fields.total_distributed_gross_cents
        distinguishing_aspect: |
          The void is a three-level compensation whose middle level is a RECOMPUTATION, not a
          subtraction: L1 flips the Distribution to VOIDED, L2 restores the funding side and re-derives
          the account's totals from the ISSUED set only, L3 appends a negated TaxReport line pointing
          back at the original through correction_of_tax_report_id, and L4 bumps the account version.
          The append-only tax ledger therefore grows to two rows while every derived total returns to
          its pre-distribution value — total_distributed_gross_cents back to 0, balance back to
          1648001, basis back to 24000. An implementation that decrements the totals instead of
          recomputing them, or that edits the original tax line instead of appending a correction,
          drifts on the second issue/void cycle and destroys the audit trail.
        test_recipe:
          setup:
            - "Fixture A qualified at 2026-09-15, giving an AlternatePayeeAccount with balance_cents 1648001, after_tax_basis_cents 24000, version 1."
            - "One CASH distribution of 1050000 issued against it while the clock is still in 2026, so the void stays inside the same tax year."
