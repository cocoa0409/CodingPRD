              payload: {}
              as: ClubManager
            - call: "POST /capital-assessments"
              payload: { club_id: "${club_id}", description: "Roof", total_target_cents: 1000, allocation_basis: "EQUAL" }
              as: ClubManager
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /capital-assessments/${asmt_id}/levy"
              payload: {}
              as: BillingClerk
