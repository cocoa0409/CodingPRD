              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
