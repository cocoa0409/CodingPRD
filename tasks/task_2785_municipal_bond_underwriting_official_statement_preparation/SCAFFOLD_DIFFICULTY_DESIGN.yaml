  - rule_id: compensating_invariant
    instances:

      - name: order_period_reopen_conserves_tranche_par
        grounds:
          - state_machines.OrderPeriod.CLOSED_to_OPEN
          - calculations.order_allotment_waterfall
          - entities.MaturityTranche.fields.par_allotted_usd
          - entities.MaturityTranche.fields.par_unsold_usd
          - entities.Deal.fields.par_allotted_total_usd
        distinguishing_aspect: |
          The conserved quantity is PAR: for every MaturityTranche,
          par_allotted_usd + par_unsold_usd == principal_amount_usd, and
          Deal.par_allotted_total_usd equals the sum of the tranche allotments. The compensating
          action is POST /order-periods/{id}/reopen, which voids a full waterfall run (including a
          pro-rated tier and a starved tier) and must restore the identity with zero drift; closing
          a second time must reproduce the identical allotment, proving the reversal was exact
          rather than merely arithmetically balanced.
        test_recipe:
          setup:
            - "A PRICING_NEGOTIATED deal (Series 2026M) has tranche 1 of 5,000,000 (5.000/4.250) and tranche 2 of 5,000,000 (5.000/4.000)."
            - "AU0001 is SENIOR_MANAGER at liability 60.0000 and AU0002 is CO_MANAGER at 40.0000."
            - "A RETAIL order period with priority_policy STANDARD_PRIORITY runs 2026-08-05T13:00:00Z to 17:00:00Z and is OPEN."
            - "Four orders on tranche 1 are PENDING: RETAIL 2,005,000 (14:00), INSTITUTIONAL_PRIORITY 2,000,000 (14:05), INSTITUTIONAL_PRIORITY 1,500,000 (14:10) and MEMBER 1,000,000 (14:15)."
