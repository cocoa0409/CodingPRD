            - call: "POST /golf-shop/build-specs/${spec_id}/approve"
              payload: { payment_method: "EXTERNAL" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /golf-shop/component-orders"
              payload: { build_spec_id: "${spec_id}" }
              as: ShopManager
              captures: { ord_id: "$$.data[0].id" }
          trigger:
            - call: "POST /golf-shop/component-items/${head_id}/receive"
              payload: { qty: 1 }
              as: ShopManager
            - call: "POST /golf-shop/component-items/${shaft_id}/receive"
              payload: { qty: 1 }
              as: ShopManager
            - call: "POST /golf-shop/component-items/${grip_id}/receive"
              payload: { qty: 1 }
              as: ShopManager
          assert:
            - "before receipts: ComponentOrder.${ord_id}.status == BACKORDERED and ClubBuildSpec.${spec_id}.status == ORDERED"
            - "after only the head receipt: ComponentOrder.${ord_id}.status == BACKORDERED (sweep cannot complete the order yet)"
            - "after all three receipts: ComponentOrder.${ord_id}.status == ALLOCATED (link 2 caused by link 1's stock mutation)"
            - "ClubBuildSpec.${spec_id}.status == IN_BUILD (link 3 caused by link 2's ALLOCATED flip)"
            - "ComponentItem.${head_id}: stock_on_hand == 0, stock_reserved == 1, received_total == 1"

      - name: ticket_cancel_shaft_release_cascades_to_spec
        grounds:
          - state_machines.RepairTicket.IN_PROGRESS_to_CANCELLED
          - calculations.allocation_sweep
          - state_machines.ComponentOrder.BACKORDERED_to_ALLOCATED
          - state_machines.ClubBuildSpec.ORDERED_to_IN_BUILD
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (repair-ticket cancel, not a
          receipt): cancel releases the reserved shaft onto
          ComponentItem.stock_on_hand (link 1), the release runs the sweep that
          flips the waiting ComponentOrder to ALLOCATED (link 2), which
          auto-advances its ClubBuildSpec to IN_BUILD (link 3).
        test_recipe:
          setup:
            - "SHAFT item with initial_stock 1; RESHAFT ticket IN_PROGRESS holding the only shaft (reserved)"
            - "Approved spec whose order is BACKORDERED (head+grip allocated, shaft short); spec in ORDERED"
