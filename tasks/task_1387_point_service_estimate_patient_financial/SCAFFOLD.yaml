# =============================================================================
# PRD Benchmark Scaffold: patient-financial-clearance (v1)
# Point-of-Service Estimate & Patient Financial Clearance
# =============================================================================

scenario: |
  Point-of-Service Estimate & Patient Financial Clearance (hospital financial clearance unit): procedure/CPT bundling & contracted rate lookup, deductible/coinsurance remaining calculation from eligibility, good-faith estimate for uninsured with timeline, payment plan & financing option presentation, prepayment/deposit posting & refund logic, estimate accuracy variance tracking, authorization & medical-necessity check, escalation for high-dollar cases

domain_name: patient-financial-clearance
api_prefix: /clearance

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# Global conventions:
#  - All monetary fields are integer cents. All percentage fields are integer
#    percent (0-100). All dates are ISO "YYYY-MM-DD"; all datetimes ISO 8601 UTC.
#  - common_fields: true => id (UUID, no prefix), created_at, updated_at
#    (3 fractional digits, refreshed on every mutation incl. cascades),
#    version (integer, starts 1, +1 per mutation).
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across patients (ERR_DUPLICATE_MRN)" }
      - { name: full_name, type: string, source: input, description: "Patient full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }

  - name: ChargeItem
    parent: null
    common_fields: true
    fields:
      - { name: cpt_code, type: string, source: input, description: "CPT/HCPCS procedure code; unique across charge items" , constraints: "unique" }
      - { name: description, type: string, source: input, description: "Procedure description" }
      - { name: list_price_cents, type: integer, source: input, description: "Charge-master list price in cents; > 0" }
      - { name: requires_auth_prior, type: boolean, source: input, description: "True when insured cases containing this CPT need prior authorization" }

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - { name: payer_code, type: string, source: input, description: "Payer identifier matched against EligibilitySnapshot.payer_code at pricing time; unique across contracts", constraints: "unique" }
      - { name: payer_name, type: string, source: input, description: "Payer display name" }
      - { name: bundling_rule, type: enum, source: input, description: "NONE | MULTIPLE_PROCEDURE_REDUCTION" }
      - { name: reduction_pct, type: integer, source: input, default: 0, description: "Secondary-procedure payment percentage under MULTIPLE_PROCEDURE_REDUCTION (e.g. 50 = secondary paid at 50%); required 1..99 when bundling_rule=MULTIPLE_PROCEDURE_REDUCTION, ignored otherwise" }

  - name: ContractRate
    parent: PayerContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> PayerContract.id; owning contract" }
      - { name: cpt_code, type: string, source: input, description: "CPT code this rate covers; must exist as a ChargeItem.cpt_code" }
      - { name: rate_cents, type: integer, source: input, description: "Contracted allowed rate per unit in cents; > 0" }
      - { name: effective_from, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: effective_to, type: string, source: input, default: null, description: "ISO date; half-open window end (exclusive); null = open-ended", constraints: "must be > effective_from when present; windows for same (contract_id, cpt_code) must not overlap under half-open [from, to) semantics (ERR_RATE_WINDOW_OVERLAP)" }

  - name: EligibilitySnapshot
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; verified patient" }
      - { name: payer_code, type: string, source: input, description: "Payer identifier; matched to PayerContract.payer_code at pricing time" }
      - { name: member_id, type: string, source: input, description: "Subscriber/member id on the policy" }
      - { name: deductible_total_cents, type: integer, source: input, description: "Annual individual deductible in cents; >= 0" }
      - { name: deductible_met_cents, type: integer, source: input, description: "Deductible already met at verification time in cents; 0 <= met <= total" }
      - { name: oop_max_cents, type: integer, source: input, description: "Annual out-of-pocket maximum in cents; > 0" }
      - { name: oop_met_cents, type: integer, source: input, description: "Out-of-pocket already met at verification time in cents; 0 <= met <= max" }
      - { name: coinsurance_pct, type: integer, source: input, description: "Patient coinsurance percentage after deductible; 0..100" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp when the snapshot was created" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | STALE", default: "ACTIVE" }

  - name: FinancialClearanceCase
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; case patient" }
      - { name: service_date, type: string, source: input, description: "ISO date of the scheduled service" }
      - { name: service_description, type: string, source: input, description: "Free-text description of the scheduled service" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | CLEARED | CANCELLED", default: "OPEN" }
      - { name: active_estimate_id, type: string, source: computed, description: "id of the latest non-superseded, non-cancelled, non-expired estimate; null when none" }
      - { name: auth_required, type: boolean, source: computed, description: "true when active estimate pricing_mode=INSURED and any line's ChargeItem.requires_auth_prior is true; false otherwise" }
      - { name: auth_satisfied, type: boolean, source: computed, description: "true when auth_required=false, or an Authorization for this case is APPROVED with valid_from <= service_date <= valid_to (inclusive) and not EXPIRED" }
      - { name: required_deposit_cents, type: integer, source: computed, description: "round_half_up(25% of accepted estimate patient_responsibility_cents); 0 until an estimate is ACCEPTED" }
      - { name: deposit_posted_cents, type: integer, source: computed, description: "Ledger: sum of amount_cents over this case's Deposits with status=POSTED" }
      - { name: deposit_satisfied, type: boolean, source: computed, description: "true when active estimate is FINALIZED, or deposit_posted_cents >= required_deposit_cents (and an estimate is ACCEPTED/FINALIZED)" }
      - { name: high_dollar_flag, type: boolean, source: computed, description: "true when active estimate patient_responsibility_cents >= 1000000 ($10,000) at last price" }
      - { name: escalation_cleared, type: boolean, source: computed, description: "true when no Escalation for this case is OPEN, and (high_dollar_flag=false OR an APPROVED HIGH_DOLLAR Escalation exists for the active estimate)" }
      - { name: clearance_posture, type: enum, source: computed, description: "READY when auth_satisfied AND deposit_satisfied AND escalation_cleared; else BLOCKED" }

  - name: Estimate
    parent: FinancialClearanceCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> FinancialClearanceCase.id; owning case" }
      - { name: eligibility_snapshot_id, type: string, source: input, default: null, description: "FK -> EligibilitySnapshot.id; required when pricing_mode=INSURED, must be null when pricing_mode=UNINSURED_GFE" }
      - { name: pricing_mode, type: enum, source: input, description: "INSURED | UNINSURED_GFE" }
      - { name: revision, type: integer, source: system, description: "1 for the first estimate of a case; each new estimate on the same case increments" }
      - { name: lines, type: array, source: input, description: "Array of { cpt_code, quantity } (quantity integer >= 1); server augments each line with computed unit_rate_cents and line_amount_cents at price time" }
      - { name: status, type: enum, source: system, description: "DRAFT | PRICED | PRESENTED | ACCEPTED | FINALIZED | SUPERSEDED | EXPIRED | CANCELLED", default: "DRAFT" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "INSURED: bundled contracted allowed total; UNINSURED_GFE: undiscounted list subtotal; 0 until PRICED" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "INSURED: amount of allowed applied to remaining deductible; GFE: 0" }
      - { name: coinsurance_cents, type: integer, source: computed, description: "INSURED: sum of per-line rounded coinsurance; GFE: 0" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "INSURED: min(deductible_applied + coinsurance, oop remaining); GFE: gfe_total_cents" }
      - { name: insurance_pays_cents, type: integer, source: computed, description: "INSURED: allowed_amount_cents - patient_responsibility_cents; GFE: 0" }
      - { name: gfe_total_cents, type: integer, source: computed, description: "UNINSURED_GFE: good-faith total after per-line uninsured discount; INSURED: 0" }
      - { name: gfe_required, type: boolean, source: computed, description: "GFE only: false when fewer than 3 business days separate creation date and service_date (good-faith estimate not mandated)" }
      - { name: gfe_delivery_deadline, type: datetime, source: computed, default: null, description: "GFE only: end-of-day (23:59:59.999Z) of the deadline business day per gfe_delivery_deadline rule; null when gfe_required=false or INSURED" }
      - { name: presented_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the first DRAFT->...->PRESENTED transition reaching PRESENTED" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of PRESENTED->ACCEPTED" }
      - { name: first_presented_patient_resp_cents, type: integer, source: system, default: null, description: "Case-level pinned value: patient_responsibility_cents of the first estimate on this case to reach PRESENTED; written once" }
      - { name: finalized_actual_billed_cents, type: integer, source: input, default: null, description: "Actual billed patient amount supplied at finalize" }
      - { name: high_dollar_flag, type: boolean, source: computed, description: "true when patient_responsibility_cents >= 1000000 at price time" }
      - { name: dispute_eligible, type: boolean, source: computed, default: false, description: "GFE only, set at finalize: finalized_actual_billed_cents - gfe_total_cents >= 40000 ($400)" }

  - name: Authorization
    parent: FinancialClearanceCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> FinancialClearanceCase.id; case the authorization covers" }
      - { name: payer_code, type: string, source: input, description: "Payer the authorization is requested from" }
      - { name: cpt_codes, type: array, source: input, description: "Non-empty array of CPT codes under review" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | APPEALED | DENIED_FINAL | WITHDRAWN | EXPIRED", default: "REQUESTED" }
      - { name: medical_necessity_met, type: boolean, source: input, default: null, description: "Reviewer determination supplied at decide; must be true for APPROVED and false for DENIED (ERR_MEDICAL_NECESSITY_CONFLICT)" }
      - { name: auth_number, type: string, source: system, default: null, description: "Payer authorization number minted on APPROVED (e.g. AUTH-<sequential>)" }
      - { name: valid_from, type: string, source: input, default: null, description: "ISO date; required on APPROVED; closed-interval start (inclusive)" }
      - { name: valid_to, type: string, source: input, default: null, description: "ISO date; required on APPROVED; closed-interval end (inclusive); must be >= valid_from" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the latest deciding reviewer; must differ from requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)" }

  - name: PaymentPlan
    parent: FinancialClearanceCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> FinancialClearanceCase.id; case being financed" }
      - { name: principal_cents, type: integer, source: input, description: "Financed amount in cents; > 0" }
      - { name: num_installments, type: integer, source: input, description: "Number of installments; 2..12" }
      - { name: installment_amount_cents, type: integer, source: computed, description: "floor(principal_cents / num_installments); installments 1..N-1 carry this amount, installment N carries the remainder" }
      - { name: installments, type: array, source: computed, description: "Array of { seq, due_date, amount_cents, paid_cents, status(PENDING|PAID) }; amounts fixed at create; due dates fixed at activate (first = activation date + 30 days, then calendar-month steps with day clamped to month end)" }
      - { name: principal_outstanding_cents, type: integer, source: computed, description: "principal_cents - sum of paid_cents across installments" }
      - { name: missed_payment_count, type: integer, source: computed, description: "Count of installments with status=PENDING and due_date strictly before the current logical date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEFAULTED | COMPLETED | CANCELLED", default: "DRAFT" }

  - name: Deposit
    parent: FinancialClearanceCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> FinancialClearanceCase.id; case the prepayment secures" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged amount in cents; > 0" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK | CASH" }
      - { name: status, type: enum, source: system, description: "PLEDGED | POSTED | APPLIED | REFUNDED | CANCELLED", default: "PLEDGED" }
      - { name: posted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of PLEDGED->POSTED" }
      - { name: applied_amount_cents, type: integer, source: system, default: null, description: "Portion applied to the final bill at estimate finalize" }
      - { name: refund_amount_cents, type: integer, source: system, default: null, description: "Amount returned to the patient per deposit_refund_amount rule (or overpayment remainder at finalize)" }
      - { name: refund_reason, type: enum, source: system, default: null, description: "SERVICE_CANCELLED | OVERPAYMENT; null until refunded" }

  - name: VarianceRecord
    parent: Estimate
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: system, description: "FK -> Estimate.id; the FINALIZED estimate measured" }
      - { name: baseline_first_presented_resp_cents, type: integer, source: system, description: "Estimate.first_presented_patient_resp_cents captured at finalize" }
      - { name: baseline_last_accepted_resp_cents, type: integer, source: system, description: "patient_responsibility_cents of the ACCEPTED estimate at finalize" }
      - { name: actual_billed_cents, type: integer, source: system, description: "Copy of Estimate.finalized_actual_billed_cents" }
      - { name: variance_vs_first_cents, type: integer, source: computed, description: "actual_billed_cents - baseline_first_presented_resp_cents (signed)" }
      - { name: variance_vs_accepted_cents, type: integer, source: computed, description: "actual_billed_cents - baseline_last_accepted_resp_cents (signed)" }
      - { name: variance_pct, type: number, source: computed, description: "round_half_up(abs(variance_vs_accepted_cents) / baseline_last_accepted_resp_cents * 100, 2 decimals); when baseline is 0: 0.0 if actual is 0 else 100.0" }
      - { name: classification, type: enum, source: computed, description: "WITHIN_TOLERANCE when variance_pct <= 10.00; OVER_TOLERANCE when variance_vs_accepted_cents > 0 and pct > 10.00; UNDER_TOLERANCE when variance_vs_accepted_cents < 0 and pct > 10.00" }
      - { name: dispute_eligible, type: boolean, source: computed, description: "Copy of Estimate.dispute_eligible (GFE $400 rule)" }
      - { name: status, type: enum, source: system, description: "UNREVIEWED | REVIEWED", default: "UNREVIEWED" }
      - { name: root_cause, type: string, source: input, default: null, description: "Free-text root cause recorded at review" }

  - name: Escalation
    parent: FinancialClearanceCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> FinancialClearanceCase.id; case under escalation" }
      - { name: estimate_id, type: string, source: system, default: null, description: "FK -> Estimate.id; triggering estimate for HIGH_DOLLAR and GFE_DISPUTE escalations; null for case-level AUTH_EXCEPTION" }
      - { name: reason, type: enum, source: input, description: "HIGH_DOLLAR | AUTH_EXCEPTION | GFE_DISPUTE" }
      - { name: trigger_amount_cents, type: integer, source: system, description: "patient_responsibility_cents (HIGH_DOLLAR) or variance overage (GFE_DISPUTE) that triggered the escalation; 0 for AUTH_EXCEPTION" }
      - { name: status, type: enum, source: system, description: "OPEN | APPROVED | REJECTED", default: "OPEN" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the opener; the literal string \"system\" when auto-created by the high-dollar or GFE-dispute trigger" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approver/rejecter; must differ from opened_by_user_id unless opened_by_user_id is \"system\" (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: decision_note, type: string, source: input, default: null, description: "Optional note recorded at approve/reject" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: EligibilitySnapshot
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, STALE]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /clearance/patients/{id}/eligibility-snapshots (a newer snapshot for the same (patient_id, payer_code) is created)"
        actor: system
        preconditions: []
        side_effects:
          - "The prior ACTIVE snapshot for the same (patient_id, payer_code) flips to SUPERSEDED; only one ACTIVE snapshot exists per (patient_id, payer_code) at any time"
      - from: ACTIVE
        to: STALE
        trigger: "POST /clearance/_clock/set_current_utc (sweep: current logical time strictly greater than verified_at + 30 days)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Exactly at verified_at + 30 days the snapshot is still ACTIVE (strict >)."

  - entity: FinancialClearanceCase
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "system (automatic when the first estimate on this case reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "case.required_deposit_cents, auth_required, high_dollar_flag recomputed from the accepted estimate"
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /clearance/cases/{id}/clear"
        actor: ClearanceSupervisor
        preconditions:
          - "auth_satisfied must be true (else ERR_AUTH_NOT_SATISFIED)"
          - "escalation_cleared must be true: high_dollar_flag with no APPROVED and no OPEN HIGH_DOLLAR escalation -> ERR_ESCALATION_REQUIRED; any OPEN escalation -> ERR_ESCALATION_PENDING"
          - "deposit_satisfied must be true (else ERR_DEPOSIT_SHORTFALL)"
        side_effects:
          - "status -> CLEARED"
      - from: CLEARED
        to: IN_REVIEW
        trigger: "system (automatic regression: a deposit refund drops deposit_satisfied to false; an APPROVED authorization expires via sweep; or a new Escalation opens, incl. the auto-created GFE_DISPUTE escalation at finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "clearance_posture recomputed to BLOCKED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /clearance/cases/{id}/cancel"
        actor: ClearanceSupervisor
        preconditions:
          - "No estimate on the case is FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: estimates in DRAFT/PRICED/PRESENTED -> CANCELLED"
          - "Cascade: deposits in PLEDGED -> CANCELLED; deposits in POSTED -> REFUNDED with refund_amount_cents per deposit_refund_amount (reason SERVICE_CANCELLED) and case.deposit_posted_cents reduced accordingly"
          - "Cascade: authorizations in REQUESTED/APPEALED -> WITHDRAWN"
          - "Cascade: payment plans in DRAFT/ACTIVE/DEFAULTED -> CANCELLED"
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /clearance/cases/{id}/cancel"
        actor: ClearanceSupervisor
        preconditions:
          - "No estimate on the case is FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "Same child cascades as OPEN -> CANCELLED"
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /clearance/cases/{id}/cancel"
        actor: ClearanceSupervisor
        preconditions:
          - "No estimate on the case is FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "Same child cascades as OPEN -> CANCELLED"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /clearance/estimates/{id}/price"
        actor: FinancialCounselor
        preconditions:
          - "INSURED: linked snapshot must belong to the case patient (ERR_SNAPSHOT_PATIENT_MISMATCH) and be ACTIVE and not older than 30 days (ERR_SNAPSHOT_STALE)"
          - "INSURED: an ACTIVE PayerContract exists for snapshot.payer_code (ERR_NO_ACTIVE_CONTRACT)"
          - "INSURED: every line cpt has a ContractRate effective on service_date (ERR_RATE_NOT_FOUND)"
          - "Every line cpt_code exists as a ChargeItem (ERR_UNKNOWN_CPT_CODE)"
        side_effects:
          - "Runs bundled_contract_pricing + estimate_patient_responsibility; fills line unit_rate_cents/line_amount_cents and all totals"
          - "high_dollar_flag set; when true the system creates an Escalation (reason HIGH_DOLLAR, status OPEN, opened_by_user_id=\"system\", estimate_id=this estimate, trigger_amount_cents=patient_responsibility_cents) unless one is already OPEN for this estimate"
          - "case.high_dollar_flag updated"
      - from: PRICED
        to: PRESENTED
        trigger: "POST /clearance/estimates/{id}/present"
        actor: FinancialCounselor
        preconditions:
          - "UNINSURED_GFE with gfe_required=true: current logical time must be <= gfe_delivery_deadline (ERR_GFE_DEADLINE_MISSED)"
        side_effects:
          - "presented_at = current logical time (first arrival only)"
          - "first_presented_patient_resp_cents = patient_responsibility_cents when this is the first estimate on the case to reach PRESENTED (written once, never overwritten)"
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /clearance/estimates/{id}/accept"
        actor: FinancialCounselor
        preconditions: []
        side_effects:
          - "accepted_at = current logical time"
          - "case.active_estimate_id = this estimate; case.required_deposit_cents = round_half_up(25% * patient_responsibility_cents); case.auth_required recomputed; case.high_dollar_flag = this estimate's flag"
          - "case.status OPEN -> IN_REVIEW when the case was OPEN"
      - from: ACCEPTED
        to: FINALIZED
        trigger: "POST /clearance/estimates/{id}/finalize"
        actor: FinancialCounselor | ClearanceSupervisor
        preconditions:
          - "actual_billed_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Cascade link 1: creates a VarianceRecord for this estimate (baselines, variance, classification, dispute_eligible computed)"
          - "Cascade link 2 (when pricing_mode=UNINSURED_GFE and dispute_eligible=true): the new VarianceRecord causes the system to create an Escalation (reason GFE_DISPUTE, OPEN, opened_by_user_id=\"system\", estimate_id=this estimate, trigger_amount_cents=variance_vs_accepted_cents)"
          - "Cascade link 3: the new OPEN Escalation flips case.escalation_cleared to false; a CLEARED case regresses to IN_REVIEW"
          - "Deposit application: each POSTED deposit of the case, oldest created_at first, applies applied_amount_cents = min(amount_cents, remaining actual_billed_cents); a deposit whose amount_cents exceeds the remaining bill keeps status APPLIED with the excess in refund_amount_cents (reason OVERPAYMENT); a deposit with applied_amount_cents=0 becomes REFUNDED with refund_amount_cents=amount_cents (reason OVERPAYMENT); case.deposit_posted_cents recomputed (all resolved deposits leave POSTED)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new estimate is created on the same case)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Divergent fork branch: supersede carries no case-level financial side effects (no deposit requirement, no status change on the case)."
      - from: PRICED
        to: SUPERSEDED
        trigger: "system (a new estimate is created on the same case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system (a new estimate is created on the same case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: EXPIRED
        trigger: "POST /clearance/_clock/set_current_utc (sweep: current logical date strictly after case.service_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRICED
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Authorization
    initial_state: REQUESTED
    terminal_states: [DENIED_FINAL, WITHDRAWN, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /clearance/authorizations/{id}/decide with decision=APPROVED"
        actor: UtilizationReviewer
        preconditions:
          - "decided_by (X-User-ID) must differ from requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "medical_necessity_met must be true and valid_from/valid_to present (ERR_MEDICAL_NECESSITY_CONFLICT / ERR_INVALID_REQUEST)"
        side_effects:
          - "auth_number minted; decided_by_user_id set"
          - "case.auth_satisfied recomputed (bubble up)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /clearance/authorizations/{id}/decide with decision=DENIED"
        actor: UtilizationReviewer
        preconditions:
          - "decided_by (X-User-ID) must differ from requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "medical_necessity_met must be false (ERR_MEDICAL_NECESSITY_CONFLICT)"
        side_effects:
          - "decided_by_user_id set"
      - from: DENIED
        to: APPEALED
        trigger: "POST /clearance/authorizations/{id}/appeal"
        actor: UtilizationReviewer
        preconditions: []
        side_effects: []
        note: "Appeal cycle: DENIED -> APPEALED -> (APPROVED | DENIED_FINAL)."
      - from: APPEALED
        to: APPROVED
        trigger: "POST /clearance/authorizations/{id}/decide with decision=APPROVED"
        actor: UtilizationReviewer
        preconditions:
          - "decided_by (X-User-ID) must differ from requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "medical_necessity_met must be true and valid_from/valid_to present"
        side_effects:
          - "auth_number minted; case.auth_satisfied recomputed"
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /clearance/authorizations/{id}/decide with decision=DENIED"
        actor: UtilizationReviewer
        preconditions:
          - "decided_by (X-User-ID) must differ from requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "medical_necessity_met must be false"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /clearance/_clock/set_current_utc (sweep: current logical date strictly after valid_to)"
        actor: system
        preconditions: []
        side_effects:
          - "case.auth_satisfied recomputed; a CLEARED case regresses to IN_REVIEW"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: WITHDRAWN
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PaymentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clearance/payment-plans/{id}/activate"
        actor: FinancialCounselor
        preconditions:
          - "The case has an estimate in ACCEPTED or FINALIZED status (ERR_NO_ACCEPTED_ESTIMATE)"
        side_effects:
          - "installment due dates fixed: first due_date = activation date + 30 days, then calendar-month steps (day clamped to month end)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (a posted payment brings principal_outstanding_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /clearance/_clock/set_current_utc (sweep: any installment PENDING with due_date + 14 days strictly before current logical date)"
        actor: system
        preconditions: []
        side_effects:
          - "missed_payment_count recomputed (PENDING installments with due_date strictly before current date)"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /clearance/payment-plans/{id}/reinstate"
        actor: FinancialCounselor
        preconditions:
          - "cure_amount_cents >= sum of amount_cents - paid_cents over installments with due_date strictly before current date (ERR_CURE_INSUFFICIENT)"
        side_effects:
          - "cure amount applied via plan_payment_waterfall; missed_payment_count recomputed"
        note: "Default/reinstate cycle: ACTIVE -> DEFAULTED -> ACTIVE is allowed repeatedly."
      - from: DRAFT
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFAULTED
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deposit
    initial_state: PLEDGED
    terminal_states: [APPLIED, REFUNDED, CANCELLED]
    transitions:
      - from: PLEDGED
        to: POSTED
        trigger: "POST /clearance/deposits/{id}/post"
        actor: FinancialCounselor
        preconditions: []
        side_effects:
          - "posted_at = current logical time"
          - "Ledger sync: case.deposit_posted_cents += amount_cents; case.deposit_satisfied recomputed"
      - from: POSTED
        to: REFUNDED
        trigger: "POST /clearance/deposits/{id}/refund"
        actor: ClearanceSupervisor
        preconditions: []
        side_effects:
          - "Cascade link 1: refund_amount_cents computed per deposit_refund_amount against case.service_date; refund_reason=SERVICE_CANCELLED; case.deposit_posted_cents -= amount_cents (the retained cancellation fee also leaves the deposit ledger)"
          - "Cascade link 2: case.deposit_posted_cents change recomputes deposit_satisfied; a CLEARED case regresses to IN_REVIEW when deposit_satisfied flips to false"
      - from: POSTED
        to: REFUNDED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "refund_amount_cents per deposit_refund_amount (reason SERVICE_CANCELLED); case.deposit_posted_cents reduced"
      - from: POSTED
        to: APPLIED
        trigger: "system (estimate finalize deposit application)"
        actor: system
        preconditions: []
        side_effects:
          - "applied_amount_cents set; excess (if any) in refund_amount_cents with refund_reason=OVERPAYMENT"
      - from: PLEDGED
        to: CANCELLED
        trigger: "system (case cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VarianceRecord
    initial_state: UNREVIEWED
    terminal_states: [REVIEWED]
    transitions:
      - from: UNREVIEWED
        to: REVIEWED
        trigger: "POST /clearance/variance-records/{id}/review"
        actor: ClearanceSupervisor
        preconditions:
          - "root_cause must be a non-empty string (ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: Escalation
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /clearance/escalations/{id}/approve"
        actor: ClearanceSupervisor
        preconditions:
          - "decided_by (X-User-ID) must differ from opened_by_user_id unless opened_by_user_id is \"system\" (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "case.escalation_cleared recomputed (bubble up)"
      - from: OPEN
        to: REJECTED
        trigger: "POST /clearance/escalations/{id}/reject"
        actor: ClearanceSupervisor
        preconditions:
          - "decided_by (X-User-ID) must differ from opened_by_user_id unless opened_by_user_id is \"system\" (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "case.escalation_cleared recomputed"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: snapshot-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /clearance/patients/{id}/eligibility-snapshots"
    occ_field: expected_patient_version
    description: |
      Creating an EligibilitySnapshot against a Patient whose version has
      advanced since the client last observed it is rejected. This covers the
      case where another writer has just created a snapshot for the same
      patient (which legitimately supersedes the prior ACTIVE snapshot for the
      same payer_code) and the current writer's view of the patient is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: estimate-create-stale-case
    parent_entity: FinancialClearanceCase
    write_endpoint: "POST /clearance/cases/{id}/estimates"
    occ_field: expected_case_version
    description: |
      Creating an Estimate against a FinancialClearanceCase whose version has
      advanced since the client last observed it is rejected. This covers the
      case where another writer has just created an estimate (which
      legitimately supersedes the prior non-locked estimate) and the current
      writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: bundled_contract_pricing
    trigger: "POST /clearance/estimates/{id}/price (INSURED mode)"
    algorithm: tiered_pricing
    formula: |
      Input lines: estimate.lines [{cpt_code, quantity}].
      For each line, unit_rate_cents = ContractRate.rate_cents of the case
      payer contract (PayerContract.payer_code == snapshot.payer_code) whose
      half-open window covers service_date: effective_from <= service_date AND
      (effective_to IS NULL OR service_date < effective_to).
      When contract.bundling_rule == NONE:
        line_amount_cents = quantity * unit_rate_cents for every line.
      When contract.bundling_rule == MULTIPLE_PROCEDURE_REDUCTION:
        Rank lines by unit_rate_cents DESC; tie-break by cpt_code ASC; final
        tie-break by input line index ASC (never by id).
        Rank 0 (primary): adjusted_rate = unit_rate_cents.
        Ranks >= 1 (secondary): adjusted_rate = round_half_up(unit_rate_cents * reduction_pct / 100) to whole cents, computed per line BEFORE multiplying by quantity.
        line_amount_cents = quantity * adjusted_rate.
      allowed_amount_cents = sum(line_amount_cents).
    input_set: "Estimate.lines of the DRAFT estimate being priced; ContractRates of the matched PayerContract"
    constants:
      REDUCTION_APPLIES_FROM_RANK: 1
    precision: "integer cents; per-line round_half_up before quantity multiplication"
    variants:
      - name: none_vs_mpr
        when: "PayerContract.bundling_rule selects the variant"
        difference: "NONE pays every line at 100%; MULTIPLE_PROCEDURE_REDUCTION pays only the highest-ranked line at 100% and all others at reduction_pct, so identical lines price lower under MPR"

  - name: estimate_patient_responsibility
    trigger: "POST /clearance/estimates/{id}/price"
    algorithm: benefit_accumulator
    formula: |
      Canonical variant INSURED_CONTRACT:
        allowed = bundled_contract_pricing(lines)
        Benefit application is PER LINE in cpt_code ASC order (input index ASC
        as final tie-break), carrying a running deductible remainder:
          ded_remaining = max(0, snapshot.deductible_total_cents - snapshot.deductible_met_cents)
          for each line (cpt_code ASC):
            line_to_deductible = min(line_amount_cents, ded_remaining)
            ded_remaining -= line_to_deductible
            line_coinsurance = round_half_up((line_amount_cents - line_to_deductible) * coinsurance_pct / 100)   # rounded PER LINE, then summed
          deductible_applied_cents = sum(line_to_deductible)
          coinsurance_cents = sum(line_coinsurance)
        oop_remaining = max(0, snapshot.oop_max_cents - snapshot.oop_met_cents)
        patient_responsibility_cents = min(deductible_applied_cents + coinsurance_cents, oop_remaining)
        insurance_pays_cents = allowed - patient_responsibility_cents
      Rounding order is pinned: deductible allocation first (in cpt order),
      then per-line coinsurance rounded half-up to whole cents, then the sum,
      then the OOP cap. Rounding coinsurance once on the aggregate base is the
      documented trap and is NOT canonical.
    input_set: "Priced lines from bundled_contract_pricing; the ACTIVE EligibilitySnapshot linked to the estimate"
    constants:
      OOP_CAP_APPLIES_LAST: true
    precision: "integer cents; per-line round_half_up, then sum"
    variants:
      - name: insured_contract
        when: "pricing_mode = INSURED"
        difference: "Uses contracted rates with deductible/coinsurance/OOP accumulator math (formula above)"
      - name: uninsured_good_faith
        when: "pricing_mode = UNINSURED_GFE"
        difference: "Same line items priced from the charge master instead: per line, line_gross = quantity * ChargeItem.list_price_cents; line_discount = round_half_up(line_gross * UNINSURED_DISCOUNT_PCT / 100) computed PER LINE then summed; gfe_total_cents = sum(line_gross - line_discount); patient_responsibility_cents = gfe_total_cents; allowed_amount_cents = sum(line_gross); deductible_applied_cents = coinsurance_cents = insurance_pays_cents = 0. Identical lines under the two modes therefore produce different patient_responsibility_cents."

  - name: gfe_delivery_deadline
    trigger: "POST /clearance/cases/{id}/estimates with pricing_mode=UNINSURED_GFE (computed at creation)"
    algorithm: threshold
    formula: |
      Let created_date = logical date at estimate creation, S = case.service_date.
      Business day = Monday-Friday (no holiday calendar).
      business_days_between(a, b) counts dates d in the half-open interval (a, b] with weekday(d) in Mon..Fri.
      bd = business_days_between(created_date, S)
      if bd >= 10: deadline_bd = 3
      elif bd >= 3: deadline_bd = 1
      else: gfe_required = false; gfe_delivery_deadline = null; STOP
      gfe_required = true
      gfe_delivery_deadline = end-of-day (23:59:59.999Z) of the date reached by
      adding deadline_bd business days to created_date (adding skips Sat/Sun).
      POST /present when gfe_required and current logical time > gfe_delivery_deadline
      is rejected with ERR_GFE_DEADLINE_MISSED.
    input_set: "The UNINSURED_GFE estimate being created"
    constants:
      GFE_FULL_WINDOW_BD: 10
      GFE_SHORT_WINDOW_BD: 3
      GFE_FULL_DEADLINE_BD: 3
      GFE_SHORT_DEADLINE_BD: 1
    precision: "dates at day granularity; deadline stored as 23:59:59.999Z datetime"

  - name: high_dollar_check
    trigger: "POST /clearance/estimates/{id}/price (after estimate_patient_responsibility)"
    algorithm: threshold
    formula: |
      estimate.high_dollar_flag = (patient_responsibility_cents >= HIGH_DOLLAR_THRESHOLD_CENTS)
      Boundary: exactly 1000000 cents ($10,000.00) IS high-dollar (>=).
      When the flag flips true the system opens one HIGH_DOLLAR Escalation (OPEN,
      opened_by_user_id="system") for the estimate unless one is already OPEN.
    input_set: "The estimate just priced"
    constants:
      HIGH_DOLLAR_THRESHOLD_CENTS: 1000000
    precision: "integer cents; >= comparison"

  - name: required_deposit
    trigger: "POST /clearance/estimates/{id}/accept"
    algorithm: threshold
    formula: |
      case.required_deposit_cents = round_half_up(REQUIRED_DEPOSIT_PCT * estimate.patient_responsibility_cents / 100)
      case.deposit_satisfied = (case.deposit_posted_cents >= case.required_deposit_cents)
    input_set: "The ACCEPTED estimate and POSTED deposits of the case"
    constants:
      REQUIRED_DEPOSIT_PCT: 25
    precision: "integer cents; round_half_up"

  - name: deposit_refund_amount
    trigger: "POST /clearance/deposits/{id}/refund and case-cancellation cascade"
    algorithm: threshold
    formula: |
      bd = business_days_between(current logical date, case.service_date)   # same counter as gfe_delivery_deadline
      if bd >= 2: refund_amount_cents = amount_cents            (100%)
      elif bd == 1: refund_amount_cents = round_half_up(amount_cents * 50 / 100)   (50%)
      else: refund_amount_cents = 0                             (day-of-service / after: forfeit)
      Boundary: exactly 2 business days before service IS a full refund (>=).
      On refund the deposit leaves POSTED, so case.deposit_posted_cents -= amount_cents
      (the retained cancellation fee is NOT part of the deposit ledger).
    input_set: "The POSTED deposit being refunded; case.service_date; current logical date"
    constants:
      REFUND_FULL_WINDOW_BD: 2
      REFUND_PARTIAL_PCT: 50
    precision: "integer cents; round_half_up for the 50% tier"

  - name: installment_schedule
    trigger: "POST /clearance/cases/{id}/payment-plans (amounts); POST /payment-plans/{id}/activate (due dates)"
    algorithm: waterfall_allocation
    formula: |
      Canonical variant FLOOR_LAST_REMAINDER:
        installment_amount_cents = floor(principal_cents / num_installments)   # integer division, truncated
        installments[1..N-1].amount_cents = installment_amount_cents
        installments[N].amount_cents = principal_cents - (N-1) * installment_amount_cents   # remainder lands on the LAST installment
      Rounding order is pinned: floor once, distribute remainder to the final
      installment. Rounding each installment half-up independently is the
      documented trap (it can overshoot principal, e.g. 100001/3 -> 33334 x3 = 100002).
      Due dates at activate: due_date[1] = activation date + 30 days;
      due_date[k] = due_date[k-1] + 1 calendar month, day clamped to month end.
      Invariant: sum(installments.amount_cents) == principal_cents before and
      after every payment, default, and reinstatement.
    input_set: "The PaymentPlan being created/activated"
    constants:
      MIN_INSTALLMENTS: 2
      MAX_INSTALLMENTS: 12
      FIRST_DUE_DAYS: 30
    precision: "integer cents"
    variants:
      - name: floor_last_remainder
        when: "canonical"
        difference: "floor division + remainder on last installment"
      - name: round_each_installment
        when: "documented non-canonical trap"
        difference: "round_half_up per installment; per-installment amounts differ (e.g. 33334 vs 33333) and the schedule can exceed principal_cents"

  - name: plan_payment_waterfall
    trigger: "POST /clearance/payment-plans/{id}/payments and /reinstate (cure application)"
    algorithm: waterfall_allocation
    formula: |
      Reject amount_cents > principal_outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING).
      Apply to installments in due_date ASC order, tie-break seq ASC:
        take = min(amount_remaining, installment.amount_cents - installment.paid_cents)
        installment.paid_cents += take; PAID when paid_cents == amount_cents.
      principal_outstanding_cents = principal_cents - sum(paid_cents).
      Plan auto-completes (ACTIVE -> COMPLETED) when principal_outstanding_cents reaches 0.
    input_set: "Installments of the ACTIVE/DEFAULTED plan"
    constants: {}
    precision: "integer cents"

  - name: estimate_variance
    trigger: "POST /clearance/estimates/{id}/finalize"
    algorithm: aggregation
    formula: |
      baseline_first = estimate.first_presented_patient_resp_cents
      baseline_accepted = estimate.patient_responsibility_cents (the ACCEPTED-and-now-FINALIZED estimate)
      variance_vs_first_cents = actual_billed_cents - baseline_first
      variance_vs_accepted_cents = actual_billed_cents - baseline_accepted
      variance_pct = round_half_up(abs(variance_vs_accepted_cents) * 100 / baseline_accepted, 2 decimals);
                     when baseline_accepted == 0: 0.0 if actual == 0 else 100.0
      classification: WITHIN_TOLERANCE when variance_pct <= 10.00 (inclusive boundary);
                      OVER_TOLERANCE when variance_vs_accepted_cents > 0 and pct > 10.00;
                      UNDER_TOLERANCE when variance_vs_accepted_cents < 0 and pct > 10.00.
      One VarianceRecord is created per finalize, carrying BOTH baselines.
    input_set: "The estimate being finalized; its case's first-presented baseline"
    constants:
      VARIANCE_TOLERANCE_PCT: 10.00
    precision: "variance_pct: 2 decimals, round_half_up; cents exact"
    variants:
      - name: first_presented_baseline
        when: "accuracy measured against the first estimate the patient was shown"
        difference: "variance_vs_first_cents uses first_presented_patient_resp_cents; differs whenever a revision changed the price between first presentation and acceptance"
      - name: last_accepted_baseline
        when: "canonical for classification; accuracy measured against the estimate the patient actually accepted"
        difference: "variance_vs_accepted_cents uses the accepted estimate's patient_responsibility_cents"

  - name: gfe_dispute_eligibility
    trigger: "POST /clearance/estimates/{id}/finalize (UNINSURED_GFE only)"
    algorithm: threshold
    formula: |
      dispute_eligible = (finalized_actual_billed_cents - gfe_total_cents >= GFE_DISPUTE_THRESHOLD_CENTS)
      Boundary: an overage of exactly 40000 cents ($400.00) IS dispute-eligible (>=).
      INSURED estimates always compute dispute_eligible = false.
      When true, the system opens a GFE_DISPUTE Escalation (see Estimate FINALIZED cascade).
    input_set: "The GFE estimate being finalized"
    constants:
      GFE_DISPUTE_THRESHOLD_CENTS: 40000
    precision: "integer cents; >= comparison"

  - name: eligibility_staleness
    trigger: "POST /clearance/_clock/set_current_utc (sweep); also evaluated at price time"
    algorithm: threshold
    formula: |
      An ACTIVE snapshot becomes STALE when current logical time is STRICTLY
      greater than verified_at + 30 days. At exactly verified_at + 30 days the
      snapshot remains ACTIVE.
      Pricing an INSURED estimate off a STALE snapshot -> ERR_SNAPSHOT_STALE.
    input_set: "ACTIVE EligibilitySnapshots"
    constants:
      SNAPSHOT_TTL_DAYS: 30
    precision: "second granularity; strict > comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, types match, enum values in range, amounts > 0 where required, num_installments in 2..12, quantity >= 1, effective_to > effective_from, valid_to >= valid_from, GFE estimates must not carry eligibility_snapshot_id, INSURED estimates must carry one"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: state
    check: "OCC: expected_patient_version / expected_case_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clearance/patients/{id}/eligibility-snapshots; POST /clearance/cases/{id}/estimates"

  - priority: 6
    category: state
    check: "Target resource must be in a state from which the requested transition exists (incl. terminal lockdown, refund of non-POSTED deposit, decide on non-REQUESTED/non-APPEALED authorization, clear of an already-CLEARED or CANCELLED case)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: authorization decide and escalation approve/reject must be performed by a different X-User-ID than the opener/requester (except when opened_by_user_id == \"system\")"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /clearance/authorizations/{id}/decide; POST /clearance/escalations/{id}/approve; POST /clearance/escalations/{id}/reject"

  - priority: 8
    category: business_safety
    check: "Compliance gate on clear: case.auth_satisfied must be true"
    error_id: ERR_AUTH_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /clearance/cases/{id}/clear"

  - priority: 9
    category: business_temporal
    check: "GFE delivery deadline: presenting a required good-faith estimate after gfe_delivery_deadline is forbidden"
    error_id: ERR_GFE_DEADLINE_MISSED
    http_status: 409
    applies_to: "POST /clearance/estimates/{id}/present"

  - priority: 10
    category: business_temporal
    check: "Eligibility freshness: INSURED pricing requires the linked snapshot to be ACTIVE and within the 30-day TTL"
    error_id: ERR_SNAPSHOT_STALE
    http_status: 409
    applies_to: "POST /clearance/estimates/{id}/price"

  - priority: 11
    category: business_referential
    check: "Every estimate line cpt_code must exist as a ChargeItem"
    error_id: ERR_UNKNOWN_CPT_CODE
    http_status: 422
    applies_to: "POST /clearance/cases/{id}/estimates; POST /clearance/payer-contracts/{id}/rates"

  - priority: 12
    category: business_referential
    check: "INSURED estimate's eligibility_snapshot_id must belong to the case's patient"
    error_id: ERR_SNAPSHOT_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /clearance/cases/{id}/estimates; POST /clearance/estimates/{id}/price"

  - priority: 13
    category: business_referential
    check: "A PayerContract must exist for the snapshot's payer_code at price time"
    error_id: ERR_NO_ACTIVE_CONTRACT
    http_status: 422
    applies_to: "POST /clearance/estimates/{id}/price"

  - priority: 14
    category: business_referential
    check: "Every line cpt must have a ContractRate effective on service_date at price time"
    error_id: ERR_RATE_NOT_FOUND
    http_status: 422
    applies_to: "POST /clearance/estimates/{id}/price"

  - priority: 15
    category: business_referential
    check: "Patient mrn must be unique"
    error_id: ERR_DUPLICATE_MRN
    http_status: 409
    applies_to: "POST /clearance/patients"

  - priority: 16
    category: business_constraint
    check: "ContractRate half-open [effective_from, effective_to) windows for the same (contract_id, cpt_code) must not overlap; touching endpoints (new.from == existing.to) are allowed"
    error_id: ERR_RATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /clearance/payer-contracts/{id}/rates"

  - priority: 17
    category: business_constraint
    check: "Authorization create: rejected when any requested cpt_code intersects the cpt_codes of an APPROVED, non-expired Authorization on the same case whose closed [valid_from, valid_to] window contains case.service_date"
    error_id: ERR_AUTH_ALREADY_COVERED
    http_status: 409
    applies_to: "POST /clearance/cases/{id}/authorizations"

  - priority: 18
    category: business_constraint
    check: "Estimate create: rejected when the case already has an estimate in ACCEPTED or FINALIZED status (approval locks the estimate set)"
    error_id: ERR_ESTIMATE_LOCKED
    http_status: 409
    applies_to: "POST /clearance/cases/{id}/estimates"

  - priority: 19
    category: business_constraint
    check: "Authorization decide consistency: APPROVED requires medical_necessity_met=true; DENIED requires medical_necessity_met=false"
    error_id: ERR_MEDICAL_NECESSITY_CONFLICT
    http_status: 422
    applies_to: "POST /clearance/authorizations/{id}/decide"

  - priority: 20
    category: business_constraint
    check: "PaymentPlan activate requires an ACCEPTED or FINALIZED estimate on the case"
    error_id: ERR_NO_ACCEPTED_ESTIMATE
    http_status: 409
    applies_to: "POST /clearance/payment-plans/{id}/activate"

  - priority: 21
    category: business_fiscal
    check: "Clear: high_dollar_flag with no APPROVED HIGH_DOLLAR escalation for the active estimate and none OPEN"
    error_id: ERR_ESCALATION_REQUIRED
    http_status: 409
    applies_to: "POST /clearance/cases/{id}/clear"

  - priority: 22
    category: business_fiscal
    check: "Clear: any Escalation on the case is still OPEN"
    error_id: ERR_ESCALATION_PENDING
    http_status: 409
    applies_to: "POST /clearance/cases/{id}/clear"

  - priority: 23
    category: business_fiscal
    check: "Clear: deposit_posted_cents < required_deposit_cents"
    error_id: ERR_DEPOSIT_SHORTFALL
    http_status: 409
    applies_to: "POST /clearance/cases/{id}/clear"

  - priority: 24
    category: business_fiscal
    check: "Payment amount exceeds plan principal_outstanding_cents"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /clearance/payment-plans/{id}/payments"

  - priority: 25
    category: business_fiscal
    check: "Reinstate cure amount below the sum of past-due unpaid installment balances"
    error_id: ERR_CURE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /clearance/payment-plans/{id}/reinstate"

# =============================================================================
# Table 5 preamble: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Configuration (SystemAdmin) ---
  - method: POST
    path: "/clearance/charge-items"
    description: "Create a charge-master item (CPT list price + prior-auth flag)"
    roles: [SystemAdmin]
    code: 201
    input: ["cpt_code", "description", "list_price_cents", "requires_auth_prior"]
    output: ChargeItem
    side_effects: []

  - method: POST
    path: "/clearance/payer-contracts"
    description: "Create a payer contract (bundling policy per payer_code)"
    roles: [SystemAdmin]
    code: 201
    input: ["payer_code", "payer_name", "bundling_rule", "reduction_pct?"]
    output: PayerContract
    side_effects: []

  - method: GET
    path: "/clearance/payer-contracts/{id}"
    description: "Get a payer contract"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: [""]
    output: PayerContract
    side_effects: []

  - method: GET
    path: "/clearance/payer-contracts"
    description: "List payer contracts (filterable by payer_code)"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["payer_code?", "limit?", "offset?"]
    output: "PayerContract[]"
    side_effects: []

  - method: POST
    path: "/clearance/payer-contracts/{id}/rates"
    description: "Add a contracted rate window for a CPT; half-open overlap rejected"
    roles: [SystemAdmin]
    code: 201
    input: ["cpt_code", "rate_cents", "effective_from", "effective_to?"]
    output: ContractRate
    side_effects: ["ERR_RATE_WINDOW_OVERLAP on half-open window collision for same (contract, cpt)"]

  - method: GET
    path: "/clearance/payer-contracts/{id}/rates"
    description: "List rates of a contract"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContractRate[]"
    side_effects: []

  # --- Patients & eligibility (Registrar) ---
  - method: POST
    path: "/clearance/patients"
    description: "Register a patient"
    roles: [Registrar]
    code: 201
    input: ["mrn", "full_name", "date_of_birth"]
    output: Patient
    side_effects: ["ERR_DUPLICATE_MRN when mrn already registered"]

  - method: GET
    path: "/clearance/patients/{id}"
    description: "Get a patient"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: [""]
    output: Patient
    side_effects: []

  - method: POST
    path: "/clearance/patients/{id}/eligibility-snapshots"
    description: "Capture an eligibility verification snapshot; supersedes the ACTIVE snapshot for the same (patient, payer_code); OCC-guarded on Patient.version"
    roles: [Registrar]
    code: 201
    input: ["expected_patient_version", "payer_code", "member_id", "deductible_total_cents", "deductible_met_cents", "oop_max_cents", "oop_met_cents", "coinsurance_pct"]
    output: EligibilitySnapshot
    side_effects:
      - "verified_at = current logical time; status = ACTIVE"
      - "Prior ACTIVE snapshot for same (patient_id, payer_code) -> SUPERSEDED"
      - "increments Patient.version by 1"
      - "ERR_STALE_VERSION when expected_patient_version != Patient.version"

  - method: GET
    path: "/clearance/eligibility-snapshots/{id}"
    description: "Get an eligibility snapshot"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: [""]
    output: EligibilitySnapshot
    side_effects: []

  - method: GET
    path: "/clearance/eligibility-snapshots"
    description: "List eligibility snapshots (filterable)"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["patient_id?", "payer_code?", "status?", "limit?", "offset?"]
    output: "EligibilitySnapshot[]"
    side_effects: []

  # --- Cases ---
  - method: POST
    path: "/clearance/patients/{id}/cases"
    description: "Open a financial clearance case for a scheduled service"
    roles: [Registrar, FinancialCounselor]
    code: 201
    input: ["service_date", "service_description"]
    output: FinancialClearanceCase
    side_effects: ["status=OPEN; derived flags default false/0"]

  - method: GET
    path: "/clearance/cases/{id}"
    description: "Get a case (with computed clearance posture fields)"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: [""]
    output: FinancialClearanceCase
    side_effects: []

  - method: GET
    path: "/clearance/cases"
    description: "List cases (filterable)"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: "FinancialClearanceCase[]"
    side_effects: []

  - method: POST
    path: "/clearance/cases/{id}/clear"
    description: "Attempt financial clearance; ordered gates: auth (compliance) -> escalation -> deposit (fiscal)"
    roles: [ClearanceSupervisor]
    code: 200
    input: [""]
    output: FinancialClearanceCase
    side_effects: ["status IN_REVIEW -> CLEARED"]

  - method: POST
    path: "/clearance/cases/{id}/cancel"
    description: "Cancel a case; cascades to estimates, deposits (BD-rule refunds), authorizations, plans"
    roles: [ClearanceSupervisor]
    code: 200
    input: [""]
    output: FinancialClearanceCase
    side_effects: ["status -> CANCELLED", "child cascades per FinancialClearanceCase state machine"]

  # --- Estimates ---
  - method: POST
    path: "/clearance/cases/{id}/estimates"
    description: "Create an estimate revision for a case; supersedes the prior non-locked estimate; OCC-guarded on Case.version"
    roles: [FinancialCounselor]
    code: 201
    input: ["expected_case_version", "pricing_mode", "eligibility_snapshot_id?", "lines"]
    output: Estimate
    side_effects:
      - "status=DRAFT; revision = prior revision + 1"
      - "Prior estimate in DRAFT/PRICED/PRESENTED -> SUPERSEDED"
      - "increments FinancialClearanceCase.version by 1"
      - "GFE: gfe_required and gfe_delivery_deadline computed per gfe_delivery_deadline rule"
      - "ERR_STALE_VERSION when expected_case_version != Case.version; ERR_ESTIMATE_LOCKED when an estimate is ACCEPTED/FINALIZED"

  - method: GET
    path: "/clearance/estimates/{id}"
    description: "Get an estimate"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: [""]
    output: Estimate
    side_effects: []

  - method: GET
    path: "/clearance/cases/{id}/estimates"
    description: "List estimates of a case (all revisions, incl. SUPERSEDED)"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []

  - method: GET
    path: "/clearance/estimates"
    description: "List estimates (filterable)"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["case_id?", "eligibility_snapshot_id?", "status?", "limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []

  - method: POST
    path: "/clearance/estimates/{id}/price"
    description: "Price a DRAFT estimate (contracted bundling + benefits, or GFE list-less-discount)"
    roles: [FinancialCounselor]
    code: 200
    input: [""]
    output: Estimate
    side_effects: ["status DRAFT -> PRICED", "runs bundled_contract_pricing + estimate_patient_responsibility", "high_dollar_check may auto-open a HIGH_DOLLAR Escalation"]

  - method: POST
    path: "/clearance/estimates/{id}/present"
    description: "Present the estimate to the patient (GFE delivery timestamp; deadline enforced)"
    roles: [FinancialCounselor]
    code: 200
    input: [""]
    output: Estimate
    side_effects: ["status PRICED -> PRESENTED", "presented_at set on first arrival", "first_presented_patient_resp_cents pinned once per case"]

  - method: POST
    path: "/clearance/estimates/{id}/accept"
    description: "Record patient acceptance; computes case deposit requirement and auth requirement"
    roles: [FinancialCounselor]
    code: 200
    input: [""]
    output: Estimate
    side_effects: ["status PRESENTED -> ACCEPTED", "case.required_deposit_cents computed (25%)", "case OPEN -> IN_REVIEW"]

  - method: POST
    path: "/clearance/estimates/{id}/finalize"
    description: "Post-service: record actual billed amount; creates VarianceRecord; applies POSTED deposits; may auto-open GFE_DISPUTE escalation"
    roles: [FinancialCounselor, ClearanceSupervisor]
    code: 200
    input: ["actual_billed_cents"]
    output: Estimate
    side_effects: ["status ACCEPTED -> FINALIZED", "VarianceRecord created", "deposit application cascade", "GFE dispute escalation cascade (3-link)"]

  # --- Authorizations (UtilizationReviewer) ---
  - method: POST
    path: "/clearance/cases/{id}/authorizations"
    description: "Request prior authorization for CPT codes"
    roles: [UtilizationReviewer]
    code: 201
    input: ["cpt_codes", "payer_code"]
    output: Authorization
    side_effects: ["status=REQUESTED", "requested_by_user_id = X-User-ID", "ERR_AUTH_ALREADY_COVERED when an APPROVED auth already covers any requested cpt for service_date"]

  - method: GET
    path: "/clearance/cases/{id}/authorizations"
    description: "List authorizations of a case"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Authorization[]"
    side_effects: []

  - method: POST
    path: "/clearance/authorizations/{id}/decide"
    description: "Decide a REQUESTED or APPEALED authorization (SoD: decider differs from requester)"
    roles: [UtilizationReviewer]
    code: 200
    input: ["decision", "medical_necessity_met", "valid_from?", "valid_to?"]
    output: Authorization
    side_effects: ["REQUESTED -> APPROVED|DENIED; APPEALED -> APPROVED|DENIED_FINAL", "auth_number minted on APPROVED", "case.auth_satisfied recomputed"]

  - method: POST
    path: "/clearance/authorizations/{id}/appeal"
    description: "Appeal a DENIED authorization"
    roles: [UtilizationReviewer]
    code: 200
    input: [""]
    output: Authorization
    side_effects: ["status DENIED -> APPEALED"]

  # --- Payment plans (FinancialCounselor) ---
  - method: POST
    path: "/clearance/cases/{id}/payment-plans"
    description: "Draft a payment plan; installment amounts computed immediately (floor + remainder on last)"
    roles: [FinancialCounselor]
    code: 201
    input: ["principal_cents", "num_installments"]
    output: PaymentPlan
    side_effects: ["status=DRAFT", "installments[] amounts computed per installment_schedule"]

  - method: GET
    path: "/clearance/cases/{id}/payment-plans"
    description: "List payment plans of a case"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PaymentPlan[]"
    side_effects: []

  - method: POST
    path: "/clearance/payment-plans/{id}/activate"
    description: "Activate a draft plan (requires an ACCEPTED or FINALIZED estimate on the case); fixes due dates"
    roles: [FinancialCounselor]
    code: 200
    input: [""]
    output: PaymentPlan
    side_effects: ["status DRAFT -> ACTIVE", "due_date[1] = activation date + 30 days, monthly thereafter"]

  - method: POST
    path: "/clearance/payment-plans/{id}/payments"
    description: "Record a payment; waterfall across installments by due_date then seq"
    roles: [FinancialCounselor]
    code: 200
    input: ["amount_cents"]
    output: PaymentPlan
    side_effects: ["installments updated oldest-first", "principal_outstanding_cents recomputed", "ACTIVE -> COMPLETED at zero"]

  - method: POST
    path: "/clearance/payment-plans/{id}/reinstate"
    description: "Cure a DEFAULTED plan; cure amount must cover all past-due unpaid balances"
    roles: [FinancialCounselor]
    code: 200
    input: ["cure_amount_cents"]
    output: PaymentPlan
    side_effects: ["status DEFAULTED -> ACTIVE", "cure applied via plan_payment_waterfall", "ERR_CURE_INSUFFICIENT"]

  # --- Deposits ---
  - method: POST
    path: "/clearance/cases/{id}/deposits"
    description: "Pledge a prepayment/deposit"
    roles: [FinancialCounselor]
    code: 201
    input: ["amount_cents", "method"]
    output: Deposit
    side_effects: ["status=PLEDGED"]

  - method: GET
    path: "/clearance/cases/{id}/deposits"
    description: "List deposits of a case"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Deposit[]"
    side_effects: []

  - method: POST
    path: "/clearance/deposits/{id}/post"
    description: "Capture/post a pledged deposit; syncs the case deposit ledger"
    roles: [FinancialCounselor]
    code: 200
    input: [""]
    output: Deposit
    side_effects: ["status PLEDGED -> POSTED", "case.deposit_posted_cents += amount_cents", "case.deposit_satisfied recomputed"]

  - method: POST
    path: "/clearance/deposits/{id}/refund"
    description: "Refund a posted deposit per the business-day refund rule; regresses a CLEARED case when the deposit requirement breaks"
    roles: [ClearanceSupervisor]
    code: 200
    input: [""]
    output: Deposit
    side_effects: ["status POSTED -> REFUNDED", "refund_amount_cents per deposit_refund_amount", "case.deposit_posted_cents -= amount_cents", "possible CLEARED -> IN_REVIEW regression"]

  # --- Variance tracking ---
  - method: GET
    path: "/clearance/estimates/{id}/variance-records"
    description: "List variance records of an estimate"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "VarianceRecord[]"
    side_effects: []

  - method: POST
    path: "/clearance/variance-records/{id}/review"
    description: "Mark a variance record reviewed with a root cause"
    roles: [ClearanceSupervisor]
    code: 200
    input: ["root_cause"]
    output: VarianceRecord
    side_effects: ["status UNREVIEWED -> REVIEWED"]

  # --- Escalations ---
  - method: POST
    path: "/clearance/cases/{id}/escalations"
    description: "Manually open an escalation (AUTH_EXCEPTION or GFE_DISPUTE or HIGH_DOLLAR)"
    roles: [FinancialCounselor, ClearanceSupervisor]
    code: 201
    input: ["reason", "estimate_id?", "note?"]
    output: Escalation
    side_effects: ["status=OPEN", "opened_by_user_id = X-User-ID", "case.escalation_cleared recomputed (OPEN blocks clearance)"]

  - method: GET
    path: "/clearance/cases/{id}/escalations"
    description: "List escalations of a case"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Escalation[]"
    side_effects: []

  - method: GET
    path: "/clearance/estimates/{id}/escalations"
    description: "List escalations tied to an estimate"
    roles: [Registrar, FinancialCounselor, UtilizationReviewer, ClearanceSupervisor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Escalation[]"
    side_effects: []

  - method: POST
    path: "/clearance/escalations/{id}/approve"
    description: "Approve an escalation (SoD: approver differs from opener unless system-opened)"
    roles: [ClearanceSupervisor]
    code: 200
    input: ["decision_note?"]
    output: Escalation
    side_effects: ["status OPEN -> APPROVED", "case.escalation_cleared recomputed"]

  - method: POST
    path: "/clearance/escalations/{id}/reject"
    description: "Reject an escalation (SoD as approve)"
    roles: [ClearanceSupervisor]
    code: 200
    input: ["decision_note?"]
    output: Escalation
    side_effects: ["status OPEN -> REJECTED", "case.escalation_cleared recomputed"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/clearance/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Setting the clock also runs the time-driven sweep: snapshots stale past 30-day TTL, APPROVED authorizations expire past valid_to, PRESENTED estimates expire past service_date, plans default past the 14-day grace."
    roles: [SystemAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, staled_snapshots: integer, expired_authorizations: integer, expired_estimates: integer, defaulted_plans: integer }
    side_effects: ["logical clock advance", "sweep transitions per state machines", "case regressions triggered by auth expiry"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing/empty, or role not declared"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not listed in the endpoint's roles"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-template resource id does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, type mismatch, enum out of range, non-positive amount, num_installments outside 2..12, quantity < 1, effective_to <= effective_from, valid_to < valid_from, eligibility_snapshot_id present on UNINSURED_GFE or absent on INSURED, empty cpt_codes array"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_patient_version / expected_case_version does not match the parent's current version (OCC)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition exists (incl. terminal-state lockdown, refund of a non-POSTED deposit, decide on a decided authorization, clear of a CLEARED/CANCELLED case, cancel of a case with a FINALIZED estimate)"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "decide/approve/reject attempted by the same X-User-ID that requested/opened the item (system-opened escalations exempt)"

  - id: ERR_AUTH_NOT_SATISFIED
    http: 409
    condition: "Clear attempted while the case requires an authorization that is missing, not APPROVED, expired, or whose window does not cover service_date"

  - id: ERR_GFE_DEADLINE_MISSED
    http: 409
    condition: "Presenting a required good-faith estimate after gfe_delivery_deadline"

  - id: ERR_SNAPSHOT_STALE
    http: 409
    condition: "INSURED pricing with a snapshot that is STALE or older than the 30-day TTL"

  - id: ERR_UNKNOWN_CPT_CODE
    http: 422
    condition: "A cpt_code (estimate line or contract rate) does not exist as a ChargeItem"

  - id: ERR_SNAPSHOT_PATIENT_MISMATCH
    http: 422
    condition: "The estimate's eligibility snapshot belongs to a different patient than the case"

  - id: ERR_NO_ACTIVE_CONTRACT
    http: 422
    condition: "No PayerContract exists for the snapshot's payer_code at price time"

  - id: ERR_RATE_NOT_FOUND
    http: 422
    condition: "No ContractRate effective on service_date for a line's cpt_code at price time"

  - id: ERR_DUPLICATE_MRN
    http: 409
    condition: "Patient registration with an mrn that already exists"

  - id: ERR_RATE_WINDOW_OVERLAP
    http: 409
    condition: "New ContractRate's half-open [effective_from, effective_to) window intersects an existing window for the same (contract_id, cpt_code)"

  - id: ERR_AUTH_ALREADY_COVERED
    http: 409
    condition: "Requested cpt already covered by an APPROVED, non-expired authorization whose closed window contains service_date"

  - id: ERR_ESTIMATE_LOCKED
    http: 409
    condition: "New estimate creation blocked because the case has an ACCEPTED or FINALIZED estimate"

  - id: ERR_MEDICAL_NECESSITY_CONFLICT
    http: 422
    condition: "decision=APPROVED with medical_necessity_met=false, or decision=DENIED with medical_necessity_met=true"

  - id: ERR_NO_ACCEPTED_ESTIMATE
    http: 409
    condition: "Payment plan activation without an ACCEPTED or FINALIZED estimate on the case"

  - id: ERR_ESCALATION_REQUIRED
    http: 409
    condition: "Clear blocked: high-dollar case has no APPROVED HIGH_DOLLAR escalation and none OPEN (e.g. after a rejection)"

  - id: ERR_ESCALATION_PENDING
    http: 409
    condition: "Clear blocked: an escalation is still OPEN"

  - id: ERR_DEPOSIT_SHORTFALL
    http: 409
    condition: "Clear blocked: deposit_posted_cents < required_deposit_cents"

  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "Payment amount_cents exceeds principal_outstanding_cents"

  - id: ERR_CURE_INSUFFICIENT
    http: 409
    condition: "Reinstatement cure amount below the sum of past-due unpaid installment balances"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Front-desk registration staff: registers patients, captures eligibility verifications, opens clearance cases"
    identity: opaque
    exclusive_operations:
      - "POST /clearance/patients — register patient"
      - "POST /clearance/patients/{id}/eligibility-snapshots — capture eligibility verification"
    shared_operations:
      - "POST /clearance/patients/{id}/cases — open case (shared with FinancialCounselor)"
      - "All GET endpoints (shared with all roles)"

  - name: FinancialCounselor
    description: "Patient financial counselor: builds and presents estimates, sets up payment plans, posts deposits, opens escalations"
    identity: opaque
    exclusive_operations:
      - "POST /clearance/cases/{id}/estimates — create estimate revision"
      - "POST /clearance/estimates/{id}/price — price estimate"
      - "POST /clearance/estimates/{id}/present — present estimate"
      - "POST /clearance/estimates/{id}/accept — record patient acceptance"
      - "POST /clearance/cases/{id}/payment-plans — draft payment plan"
      - "POST /clearance/payment-plans/{id}/activate — activate plan"
      - "POST /clearance/payment-plans/{id}/payments — record plan payment"
      - "POST /clearance/payment-plans/{id}/reinstate — cure defaulted plan"
      - "POST /clearance/cases/{id}/deposits — pledge deposit"
      - "POST /clearance/deposits/{id}/post — post deposit"
    shared_operations:
      - "POST /clearance/patients/{id}/cases — open case (shared with Registrar)"
      - "POST /clearance/estimates/{id}/finalize — finalize estimate (shared with ClearanceSupervisor)"
      - "POST /clearance/cases/{id}/escalations — open escalation (shared with ClearanceSupervisor)"
      - "All GET endpoints (shared with all roles)"

  - name: UtilizationReviewer
    description: "Utilization review nurse: requests prior authorizations, runs medical-necessity checks, decides and appeals; segregation of duties binds decider vs requester"
    identity: opaque
    exclusive_operations:
      - "POST /clearance/cases/{id}/authorizations — request authorization"
      - "POST /clearance/authorizations/{id}/decide — decide authorization"
      - "POST /clearance/authorizations/{id}/appeal — appeal denial"
    shared_operations:
      - "All GET endpoints (shared with all roles)"

  - name: ClearanceSupervisor
    description: "Financial clearance supervisor: clears and cancels cases, refunds deposits, reviews variance, approves/rejects escalations; segregation of duties binds decider vs opener"
    identity: opaque
    exclusive_operations:
      - "POST /clearance/cases/{id}/clear — grant financial clearance"
      - "POST /clearance/cases/{id}/cancel — cancel case"
      - "POST /clearance/deposits/{id}/refund — refund deposit"
      - "POST /clearance/variance-records/{id}/review — review variance"
      - "POST /clearance/escalations/{id}/approve — approve escalation"
      - "POST /clearance/escalations/{id}/reject — reject escalation"
    shared_operations:
      - "POST /clearance/estimates/{id}/finalize — finalize estimate (shared with FinancialCounselor)"
      - "POST /clearance/cases/{id}/escalations — open escalation (shared with FinancialCounselor)"
      - "All GET endpoints (shared with all roles)"

  - name: SystemAdmin
    description: "Revenue-cycle IT administrator: maintains charge master, payer contracts and rates; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /clearance/charge-items — create charge item"
      - "POST /clearance/payer-contracts — create payer contract"
      - "POST /clearance/payer-contracts/{id}/rates — add contracted rate"
      - "POST /clearance/_clock/set_current_utc — set logical clock and run sweep"
    shared_operations:
      - "All GET endpoints (shared with all roles)"
