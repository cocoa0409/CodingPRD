            - "ledger for crediting_run_id ${run_id} contains CREDITING_GAIN +142 and CREDITING_REVERSAL -142 summing to 0"
      - name: assess_then_correct_leaves_zero_liability_drift
        grounds:
          - state_machines.OperationalFailureCase
          - calculations.income_inclusion
          - entities.Participant.fields.inclusion_liability_cents
        distinguishing_aspect: |
          Conserved quantity: Participant.inclusion_liability_cents (tax
          liability cents — a different quantity than account balance cents in
          the sibling instance). assess adds total_inclusion_cents == 501863;
          correct subtracts exactly the same 501863; net drift is zero, and the
          account flag cycle ACTIVE -> FLAGGED_FOR_INCLUSION -> ACTIVE restores
          the account state as well.
        test_recipe:
          setup:
            - "ACTIVE plan, vested participant, account with 100000 settled cents"
            - "operational failure EARLY_PAYMENT of 500000 cents dated 2027-01-15, reported by BenefitsAdministrator ba-1; clock at 2027-02-01"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan IL", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
