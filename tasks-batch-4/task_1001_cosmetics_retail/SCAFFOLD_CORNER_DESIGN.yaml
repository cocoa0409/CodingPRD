      - name: redeeming_more_points_than_the_balance_returns_insufficient_points
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "The balance check runs at reserve, not at create: a DRAFT order redeeming 600 points against a 500-point balance is accepted as a quote but rejected at POST /reserve with ERR_INSUFFICIENT_POINTS (422), with no inventory drawn."
