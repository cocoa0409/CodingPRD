          depends on the finding flag in the same request body: a SUBSTANTIATED
          finding must carry 1..15 points capped by the severity tier, while an
          UNSUBSTANTIATED finding must carry nothing at all. The fixture is chosen
          so the two candidate ceilings disagree - BENEFICIARY plus
          SOLICITATION_PRACTICE plus zero documents scores 45.00 at intake, which
          is LOW and caps at 5, but the investigated variant adds the +10
          substantiated adjustment to reach 55.00, which is MEDIUM and caps at 10.
          The accepted call therefore submits exactly 10 points: an implementation
          that range-checks against the stored intake tier rejects a legal penalty,
          and one that forgets the absolute 1..15 bound accepts an illegal one.
        test_recipe:
          setup:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /organizations"
              payload: { legal_name: "Lakeside Youth Trust", ein: "22-2222222", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 6, contact_email: "ops@lakesideyouth.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org2: $.data.id }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "BENEFICIARY", category: "SOLICITATION_PRACTICE", narrative: "The telephone appeal claimed 90 percent of my gift reaches the food programme", corroborating_document_count: 0 }
              as: PublicUser
              as_user_id: "public-1"
              captures: { cp1: $.data.id }
            - call: "POST /complaints/${cp1}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "worth a look at the script" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { cp1_intake: $.data.credibility_score, cp1_intake_tier: $.data.severity_tier }
            - call: "POST /complaints"
              payload: { organization_id: "${org2}", complainant_kind: "DONOR", category: "TRANSPARENCY", narrative: "The annual report is two years out of date" }
              as: PublicUser
              as_user_id: "public-2"
              captures: { cp2: $.data.id }
            - call: "POST /complaints/${cp2}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "check the filing cabinet" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /complaints"
              payload: { organization_id: "${org2}", complainant_kind: "DONOR", category: "OTHER", narrative: "Nobody answered my letter" }
              as: PublicUser
              as_user_id: "public-3"
              captures: { cp3: $.data.id }
            - call: "POST /complaints/${cp3}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "routine" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 16, finding_note: "the script overstated the programme share" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_above_absolute: $.data.error_id }
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 0, finding_note: "the script overstated the programme share" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_zero_points: $.data.error_id }
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 11, finding_note: "the script overstated the programme share" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_above_tier: $.data.error_id }
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "UNSUBSTANTIATED", penalty_points: 3, finding_note: "no misstatement found" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_unsub_points: $.data.error_id }
            - call: "POST /complaints/${cp1}/resolve"
              payload: { finding: "SUBSTANTIATED", penalty_points: 10, finding_note: "the script overstated the programme share" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { cp1_status: $.data.status, cp1_final: $.data.credibility_score, cp1_tier: $.data.severity_tier, cp1_applied: $.data.penalty_points_applied, cp1_target: $.data.penalized_rating_cycle_id }
            - call: "POST /complaints/${cp2}/resolve"
              payload: { finding: "UNSUBSTANTIATED", finding_note: "the report was published on time" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { cp2_status: $.data.status, cp2_applied: $.data.penalty_points_applied }
            - call: "POST /complaints/${cp3}/resolve"
              payload: { finding: "UNSUBSTANTIATED", penalty_points: 0, finding_note: "correspondence backlog, no misconduct" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { cp3_status: $.data.status, cp3_score: $.data.credibility_score }
          assert:
            - "${cp1_intake} == 45.00 and ${cp1_intake_tier} == LOW: 25 for BENEFICIARY plus 20 for SOLICITATION_PRACTICE plus 0 document points, with no pattern term and no finding adjustment at intake"
            - "${e_above_absolute} == ERR_PENALTY_POINTS_RANGE with HTTP 422: 16 breaches the absolute ceiling of 15 that no severity tier can lift"
            - "${e_zero_points} == ERR_PENALTY_POINTS_RANGE with HTTP 422: a SUBSTANTIATED finding must carry at least 1 point, so 0 is not a way to substantiate without consequence"
            - "${e_above_tier} == ERR_PENALTY_POINTS_RANGE with HTTP 422: 11 is inside 1..15 but above MAX_PENALTY_BY_SEVERITY[MEDIUM] == 10"
            - "${e_unsub_points} == ERR_PENALTY_POINTS_RANGE with HTTP 422: the conditional clause forbids any positive penalty on an UNSUBSTANTIATED finding, and 3 would otherwise be legal for a MEDIUM complaint"
            - "${cp1_status} == SUBSTANTIATED, ${cp1_final} == 55.00, ${cp1_tier} == MEDIUM and ${cp1_applied} == 10: the accepted penalty sits exactly on the ceiling derived from the investigated score 45.00 + 0 pattern + 10, which the intake tier LOW would have capped at 5"
            - "${cp1_target} == null: ${org1} has no RatingCycle at all, so the substantiated cascade records the penalty on the Complaint and finds nothing to penalise"
            - "Complaint ${cp1}.version == 3 after the run: the create, the triage and the accepted resolve each incremented it once, and the four rejected resolves burned no version at all"
            - "${cp2_status} == UNSUBSTANTIATED with ${cp2_applied} == 0: penalty_points omitted entirely is admissible on an unsubstantiated finding"
            - "${cp3_status} == UNSUBSTANTIATED and ${cp3_score} == 20.00: an explicit penalty_points of 0 is equally admissible, and the investigated score is 30 for DONOR plus 5 for OTHER plus 0 pattern points minus the 15 unsubstantiated adjustment"
            - "Organization ${org1}.substantiated_complaint_count == 1 and Organization ${org2}.substantiated_complaint_count == 0"
      - name: the_retired_pin_verdict_is_handed_down_the_priority_chain_twelve_thirteen_fifteen
        claim_type: Cascading validation
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=15]
          - errors.ERR_METHODOLOGY_NOT_ADOPTED
          - errors.ERR_TRANSITION_GRACE_UNAVAILABLE
          - errors.ERR_METHODOLOGY_NOT_EFFECTIVE
          - endpoints.POST_/rating-cycles
          - entities.TransitionGrant.fields.grace_until
          - calculations.methodology_impact_projection
        distinguishing_aspect: |
          Pinning a methodology to a new cycle is decided by three rules that must
          run in order and hand the verdict along: priority 12 admits an ADOPTED
          version outright, defers a RETIRED one to priority 13 only when
          use_transition_grant is true, and rejects it otherwise; priority 13 then
          demands a matching ACTIVE grant whose grace_until has not passed; and
          priority 15 finally checks effectivity, from which a grant-admitted
          RETIRED version is explicitly exempt. All four outcomes are exercised
          against the same retirement: the flagless pin answers 12, the
          not-yet-effective successor answers 15, the flagged pin at exactly
          grace_until succeeds and consumes the grant, and the next flagged pin
          answers 13 - first because the grant is CONSUMED and then, one second
          into the following day, because it is also out of time.
