- method: GET
  path: /deals/{dealId}/payment-milestones
  description: List payment milestones
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - status?
  - season_index?
  - deal_id?
  output: PaymentMilestone[]
  side_effects: []
- method: GET
  path: /deals/{dealId}/payment-milestones/{milestoneId}
  description: Get a payment milestone
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
