            - { call: "GET /plant/lines/${line_id}", payload: {}, as: LineScheduler, captures: { lv2: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${corn_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T12:00:00Z", end_at: "2026-08-02T14:00:00Z", expected_line_version: "${lv2}" }, as: LineScheduler, captures: { run_b: "$.data.id" } }
            - { call: "GET /plant/runs/${run_b}/changeovers", payload: {}, as: LineScheduler, captures: { co_b: "$.data[0].id", co_st: "$.data[0].changeover_status" } }
            - { call: "POST /plant/runs/${run_b}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_b}", allocated_kg: 388.8 }, as: LineScheduler }
