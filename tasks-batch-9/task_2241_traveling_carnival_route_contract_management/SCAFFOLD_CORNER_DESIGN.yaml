              as: PlatformAdmin
              captures: { ride_n5: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_n5: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_n5}", venue_id: "${ven_n5}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_n5: "$.data.id", sv_n5: "$.data.version" }
          trigger:
