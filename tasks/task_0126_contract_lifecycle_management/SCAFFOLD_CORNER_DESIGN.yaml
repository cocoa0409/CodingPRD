# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims of SCAFFOLD.yaml §1.1–§1.7 not already covered by
# §1.8. Each active instance's setup_api_calls drives empty-DB -> precondition
# using only §1.5 endpoints. excluded_because stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_organization_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Organization", "endpoints.POST /organizations"]
        distinguishing_aspect: "POST /organizations with only name -> 201; risk_appetite_threshold defaults 60, auto_renew_lead_days defaults 30, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /organizations"
              payload: { name: "DefOrg" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, thr: $.data.risk_appetite_threshold, lead: $.data.auto_renew_lead_days, v: $.data.version }
          assert:
            - "Organization.risk_appetite_threshold == 60 (default applied)"
            - "Organization.auto_renew_lead_days == 30 (default applied)"
            - "Organization.version == 1"

      - name: get_contract_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Contract", "errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "GET /contracts/{id} with a non-existent UUID -> ERR_CONTRACT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTRACT_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_clause_template_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.ClauseTemplate.fields.risk_weight", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clause-templates omitting required risk_weight -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One organization."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "X", category: "OTHER", standard_text: "s" }
              as: ClauseLibrarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_clause_template_invalid_enum_category_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.ClauseTemplate.fields.category", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category not in {LIABILITY,INDEMNITY,TERMINATION,PAYMENT,CONFIDENTIALITY,OTHER} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One organization."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "X", category: "BOGUS", standard_text: "s", risk_weight: 5 }
              as: ClauseLibrarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_contract_defaults_term_and_autorenew_from_template
        claim_type: Defaults
        grounds: ["entities.Contract.fields.term_months", "entities.Contract.fields.auto_renew", "entities.ContractTemplate.fields.default_term_months"]
        distinguishing_aspect: "POST /contracts omitting term_months/auto_renew copies default_term_months=24 and auto_renew_default=true from the template."
        test_recipe:
          setup: ["Org; one clause; template with default_term_months 24 and auto_renew_default true."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 24, auto_renew_default: true }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { term: $.data.term_months, ar: $.data.auto_renew }
          assert:
            - "Contract.term_months == 24 (defaulted from template)"
            - "Contract.auto_renew == true (defaulted from template)"

      - name: contract_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: ["entities.Contract.fields.drafter_user_id", "entities.Contract.fields.status", "entities.Contract.fields.risk_score"]
        distinguishing_aspect: "On contract create, status==DRAFT, risk_score==0, drafter_user_id==X-User-ID, version==1 — server-set, not client-supplied."
        test_recipe:
          setup: ["Org + clause + template."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "drafter-7"
              captures: { st: $.data.status, rs: $.data.risk_score, drf: $.data.drafter_user_id, v: $.data.version }
          assert:
            - "Contract.status == DRAFT"
            - "Contract.risk_score == 0"
            - "Contract.drafter_user_id == 'drafter-7'"
            - "Contract.version == 1"

      - name: create_contract_unknown_template_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Contract.fields.contract_template_id", "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /contracts with a contract_template_id that does not exist -> ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["One organization, no templates."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "11111111-1111-4111-8111-111111111111", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_clause_templates_pagination_envelope
        claim_type: Listing
        grounds: ["entities.ClauseTemplate", "endpoints.GET /clause-templates"]
        distinguishing_aspect: "GET /clause-templates returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Org with two clause templates."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K1", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K2", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
          trigger:
            - call: "GET /clause-templates"
              payload: { organization_id: "${org_id}", limit: 1, offset: 0 }
              as: ClauseLibrarian
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true with limit 1"

      - name: contract_version_computed_deviation_count
        claim_type: Computed Fields
        grounds: ["entities.ContractVersion.fields.deviation_count"]
        distinguishing_aspect: "deviation_count is computed from clauses[] is_deviation flags (3 deviated of 4 -> 3), client-supplied deviation_count ignored."
        test_recipe:
          setup: ["Org + 4 clauses + template."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "A", category: "OTHER", standard_text: "s", risk_weight: 1 }
              as: ClauseLibrarian
              captures: { a: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "B", category: "OTHER", standard_text: "s", risk_weight: 1 }
              as: ClauseLibrarian
              captures: { b: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "C", category: "OTHER", standard_text: "s", risk_weight: 1 }
              as: ClauseLibrarian
              captures: { c: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "D", category: "OTHER", standard_text: "s", risk_weight: 1 }
              as: ClauseLibrarian
              captures: { d: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${a}","${b}","${c}","${d}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${a}", text: "d", is_deviation: true }, { clause_template_id: "${b}", text: "d", is_deviation: true }, { clause_template_id: "${c}", text: "d", is_deviation: true }, { clause_template_id: "${d}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { dc: $.data.deviation_count }
          assert:
            - "ContractVersion.deviation_count == 3"

      - name: clause_template_create_out_of_range_risk_weight
        claim_type: Type Constraints
        grounds: ["entities.ClauseTemplate.fields.risk_weight", "errors[ERR_VALIDATION_RANGE]"]
        distinguishing_aspect: "risk_weight outside 0-40 (e.g. 99) -> ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup: ["One organization."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 99 }
              as: ClauseLibrarian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION_RANGE"

  # =========================================================================
  - section: state_machines
    instances:
      - name: submit_contract_with_no_version_returns_no_version
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Contract.DRAFT_to_UNDER_REVIEW", "errors[ERR_NO_VERSION]"]
        distinguishing_aspect: "submit on a DRAFT contract that has no ContractVersion -> ERR_NO_VERSION (409)."
        test_recipe:
          setup: ["A freshly created DRAFT contract with zero versions."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_VERSION"

      - name: terminate_draft_contract_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Contract.ACTIVE_to_TERMINATED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "terminate on a DRAFT contract (no ACTIVE->TERMINATED applicable) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT contract with one version."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${k_id}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: sign_already_signed_request_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.SignatureRequest.SENT_to_SIGNED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Signing a SignatureRequest that is already SIGNED (or whose contract left OUT_FOR_SIGNATURE) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contract ACTIVE: both SignatureRequests already SIGNED; re-sign the first."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${k_id}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
            - call: "POST /approval-workflows/${wf_id}/steps"
              payload: { approval_workflow_id: "${wf_id}", decision: "APPROVE" }
              as: ContractApprover
              as_user_id: "appr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v3: $.data.version }
            - call: "POST /contracts/${contract_id}/send-for-signature"
              payload: { expected_contract_version: "${c_v3}", signers: [ { signer_party: "INTERNAL", signer_name: "Us" }, { signer_party: "COUNTERPARTY", signer_name: "Them" } ] }
              as: ContractManager
              as_user_id: "mgr-1"
            - call: "GET /contracts/${contract_id}/signature-requests"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { sig0_id: $.data.0.id, sig1_id: $.data.1.id }
            - call: "POST /signature-requests/${sig0_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-int"
            - call: "POST /signature-requests/${sig1_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-cp"
          trigger:
            - call: "POST /signature-requests/${sig0_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-int"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (request already SIGNED / contract ACTIVE)"

      - name: signature_decline_bounces_to_redlining_and_voids_siblings
        claim_type: Cross-entity
        grounds: ["state_machines.SignatureRequest.SENT_to_DECLINED", "state_machines.Contract.OUT_FOR_SIGNATURE_to_REDLINING", "state_machines.SignatureRequest.SENT_to_VOIDED"]
        distinguishing_aspect: "DECLINE on one SignatureRequest -> contract OUT_FOR_SIGNATURE->REDLINING and the other SENT request -> VOIDED."
        test_recipe:
          setup: ["Contract OUT_FOR_SIGNATURE with two SENT requests."]
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0 }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "C", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${k_id}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
            - call: "POST /approval-workflows/${wf_id}/steps"
              payload: { approval_workflow_id: "${wf_id}", decision: "APPROVE" }
              as: ContractApprover
              as_user_id: "appr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v3: $.data.version }
            - call: "POST /contracts/${contract_id}/send-for-signature"
              payload: { expected_contract_version: "${c_v3}", signers: [ { signer_party: "INTERNAL", signer_name: "Us" }, { signer_party: "COUNTERPARTY", signer_name: "Them" } ] }
              as: ContractManager
              as_user_id: "mgr-1"
            - call: "GET /contracts/${contract_id}/signature-requests"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { sig0_id: $.data.0.id, sig1_id: $.data.1.id }
          trigger:
            - call: "POST /signature-requests/${sig0_id}/decline"
              payload: {}
              as: Signer
              as_user_id: "signer-int"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_status: $.data.status }
            - call: "GET /contracts/${contract_id}/signature-requests"
              payload: { status: "VOIDED" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { voided0: $.data.0.id }
          assert:
            - "Contract.${contract_id}.status == REDLINING"
            - "The other SignatureRequest (${sig1_id}) has status == VOIDED"

      - name: retire_clause_template_in_use_returns_clause_in_use
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ClauseTemplate.ACTIVE_to_RETIRED", "errors[ERR_CLAUSE_IN_USE]"]
        distinguishing_aspect: "Retiring a ClauseTemplate referenced by a DRAFT contract's current version -> ERR_CLAUSE_IN_USE (409)."
        test_recipe:
