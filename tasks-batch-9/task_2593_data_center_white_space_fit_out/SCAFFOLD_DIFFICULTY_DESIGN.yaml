            - call: "POST /halls"
              payload: { name: "Data Hall G", code: "HG1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 10 }
