        distinguishing_aspect: "Each 2000000-cent plan is individually under the 3000000-cent credit limit, but at the second approval plan_exposure is already 2000000 and cash_share_cents adds 2000000 for a total of 4000000, so the aggregate check fires with ERR_CREDIT_LIMIT_EXCEEDED (402) even though the windows are adjacent and never overlap."
