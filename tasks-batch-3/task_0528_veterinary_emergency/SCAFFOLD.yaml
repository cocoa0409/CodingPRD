# =============================================================================
# task_0528_veterinary_emergency — Veterinary Specialty & Emergency Hospital
# Scaffold seed tables (§1.0–§1.7). Design difficulty: Expert.
# =============================================================================

scenario: |
  Veterinary Specialty & Emergency Hospital: triage & ER intake, referral to
  specialty department, estimate/deposit & treatment authorization,
  hospitalization & ICU board, diagnostics & surgery scheduling, multi-doctor
  case continuity, payment plan & CareCredit, discharge & referring-DVM report .

domain_name: veterinary-emergency
api_prefix: /

# Complexity profile ----------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation          # estimate/deposit vs. actual finalized charges
  secondary_archetype: workflow_orchestration       # triage -> referral -> auth -> hospitalization -> discharge
  complexity_layers:
    - dual_variant_calculation                       # estimate-vs-actual; per-line-tax vs sum-then-tax
    - cascading_side_effects                         # discharge / authorization void chains span 3+ entities
    - optimistic_concurrency                         # OCC on Visit.version for supersede-create races
    - rate_threshold_triggers                        # deposit tier %, CareCredit promo eligibility boundaries

  entity_topology: hybrid
  # Visit is the case root; Referral/Estimate/Authorization/Hospitalization/
  # Procedure/Invoice/PaymentPlan/ReferringVetReport hang off it, and several
  # cross-reference each other (Authorization -> Estimate, PaymentPlan -> Invoice).

  state_machine_shape: branching
  # Visit fork-joins into DISCHARGED vs DECEASED vs LWBS; Authorization has a
  # revision cycle (DECLINED -> re-issued Estimate -> re-authorized); Invoice
  # carries a parallel-ish settlement track.

  relationship_patterns:
    - one_to_many          # Visit -> Procedures, Visit -> Estimates
    - cross_aggregate      # PaymentPlan references Invoice; Authorization references Estimate
    - polymorphic          # Procedure.modality spans imaging vs surgery resources

  role_model: peer_roles
  # TriageNurse owns intake/triage; ClinicianDVM owns clinical orders & procedures;
  # FinanceCoordinator owns estimates/invoices/payment plans; Owner authorizes &
  # pays for their own animal.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Animal name" }
      - { name: species, type: enum, source: input, description: "CANINE | FELINE | EXOTIC" }
      - { name: weight_kg, type: number, source: input, description: "Body weight in kilograms; must be > 0" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque id of the owning client; equals X-User-ID when acting as Owner (see §1.7 identity)" }

  - name: Visit
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the animal presenting for this ER encounter" }
      - { name: chief_complaint, type: string, source: input, description: "Presenting complaint text" }
      - { name: triage_level, type: enum, source: system, description: "RED | ORANGE | YELLOW | GREEN — set by triage; drives deposit tier. Null until triaged" }
      - { name: department, type: enum, source: system, description: "Specialty department after referral: ER | CARDIOLOGY | ONCOLOGY | SURGERY | NEUROLOGY. Starts ER" }
      - { name: attending_dvm_id, type: string, source: system, description: "Opaque id of the ClinicianDVM currently owning the case (multi-doctor continuity)" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> TRIAGED -> IN_TREATMENT -> READY_FOR_DISCHARGE -> DISCHARGED / DECEASED / LWBS. Lifecycle root" }
      - { name: authorized_ceiling_cents, type: integer, source: computed, default: 0, description: "Sum of approved_ceiling_cents over ACTIVE Authorizations on this Visit; gates new charges" }
      - { name: charges_committed_cents, type: integer, source: computed, default: 0, description: "Running finalized charge total posted to the open Invoice for this Visit" }
      - { name: version, type: integer, source: system, description: "OCC version; starts 1, +1 on every mutation incl. cascades" }

  - name: Referral
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the case being referred" }
      - { name: to_department, type: enum, source: input, description: "Target specialty: CARDIOLOGY | ONCOLOGY | SURGERY | NEUROLOGY" }
      - { name: accepting_dvm_id, type: string, source: input, description: "Opaque id of the specialist ClinicianDVM who will take the case on accept" }
      - { name: reason, type: string, source: input, description: "Clinical reason for referral" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACCEPTED / DECLINED. Terminal at ACCEPTED/DECLINED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Estimate
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: line_items, type: array, source: input, description: "Array of {code, description, qty(int>0), unit_price_cents(int>=0)} planned charge lines" }
      - { name: low_cents, type: integer, source: computed, description: "Optimistic (low) estimate subtotal+tax; see estimate_range calc" }
      - { name: high_cents, type: integer, source: computed, description: "Pessimistic (high) estimate subtotal+tax; deposit is a % of this" }
      - { name: deposit_pct, type: number, source: computed, description: "Deposit fraction chosen by Visit.triage_level tier at estimate creation" }
      - { name: deposit_cents, type: integer, source: computed, description: "= ceil(high_cents * deposit_pct); required up-front deposit" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> SUPERSEDED / CONSUMED. CONSUMED when an Authorization approves it" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Authorization
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: estimate_id, type: string, source: input, description: "FK -> Estimate.id; the ISSUED estimate the owner authorizes" }
      - { name: approved_ceiling_cents, type: integer, source: input, description: "Spend ceiling the owner authorizes; must be >= the estimate's high_cents" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Deposit amount collected on approval; copied from Estimate.deposit_cents" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> DECLINED / VOIDED. ACTIVE authorizations contribute to Visit.authorized_ceiling_cents" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Hospitalization
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: ward, type: enum, source: input, description: "ICU | WARD — board level; ICU has finite cage capacity" }
      - { name: cage_number, type: integer, source: input, description: "Cage/kennel slot within the ward; 1..capacity. Unique among ACTIVE hospitalizations of that ward" }
      - { name: admit_at, type: datetime, source: input, description: "ISO8601 admission instant" }
      - { name: planned_discharge_at, type: datetime, source: input, description: "ISO8601 planned end; admit_at < planned_discharge_at" }
      - { name: released_at, type: datetime, source: system, description: "ISO8601 actual release instant; null until released" }
      - { name: nights_accrued, type: integer, source: computed, description: "Chronological per-diem night count accrued at release; see icu_board_accrual calc" }
      - { name: board_cents, type: integer, source: computed, description: "= nights_accrued * per_diem for ward; posted to Invoice at release" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED / CANCELLED. Occupies a cage while ACTIVE" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Procedure
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: modality, type: enum, source: input, description: "IMAGING_CT | IMAGING_MRI | SURGERY — polymorphic over resource pool" }
      - { name: resource_room, type: enum, source: input, description: "Physical resource booked: CT_SUITE | MRI_SUITE | OR_1 | OR_2. Must match modality family" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 slot start" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 slot end; start_at < end_at" }
      - { name: price_cents, type: integer, source: input, description: "Charge for this procedure once performed; int >= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> PERFORMED / CANCELLED. Booking occupies the resource_room slot while SCHEDULED or PERFORMED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Invoice
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; exactly one OPEN invoice per Visit" }
      - { name: charge_lines, type: array, source: computed, description: "Posted charge lines {source_type, source_id, qty, unit_price_cents}; appended by procedure/board finalization" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of qty*unit_price_cents over charge_lines" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax computed PER_LINE then summed; see invoice_reconciliation calc" }
      - { name: deposit_applied_cents, type: integer, source: computed, description: "Deposit(s) collected via ACTIVE Authorizations, credited against the invoice" }
      - { name: balance_due_cents, type: integer, source: computed, description: "= subtotal_cents + tax_cents - deposit_applied_cents (floored at 0)" }
      - { name: status, type: enum, source: system, description: "OPEN -> FINALIZED -> SETTLED. FINALIZED locks charge_lines; SETTLED when paid in full or a PaymentPlan is ACTIVE" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PaymentPlan
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; the FINALIZED invoice being financed" }
      - { name: provider, type: enum, source: input, description: "CARECREDIT | IN_HOUSE — CARECREDIT may qualify for a 0% promo" }
      - { name: principal_cents, type: integer, source: computed, description: "Copied from Invoice.balance_due_cents at plan creation" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments; int in 1..24" }
      - { name: promo_applied, type: boolean, source: computed, description: "True iff CARECREDIT + principal >= PROMO_MIN_CENTS + term_months <= PROMO_MAX_MONTHS" }
      - { name: financing_fee_cents, type: integer, source: computed, description: "Deferred-interest fee; 0 when promo_applied. See payment_plan_schedule calc" }
      - { name: installment_cents, type: integer, source: computed, description: "= ceil((principal_cents + financing_fee_cents) / term_months) for installments 1..n-1" }
      - { name: final_installment_cents, type: integer, source: computed, description: "Remainder-absorbing last installment (see calc)" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> CANCELLED. ACTIVE marks the linked Invoice SETTLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ReferringVetReport
    parent: Visit
    common_fields: false     # append-only discharge artifact; id + created_at only, no version
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the discharged case" }
      - { name: referring_dvm_email, type: string, source: input, description: "rDVM recipient email" }
      - { name: summary, type: string, source: input, description: "Discharge summary narrative" }
      - { name: procedures_performed, type: array, source: computed, description: "Snapshot of PERFORMED Procedure ids on the Visit at report generation" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Snapshot of the Visit's Invoice subtotal_cents + tax_cents at report generation" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Visit
    initial_state: REGISTERED
    terminal_states: [DISCHARGED, DECEASED, LWBS]
    transitions:
      - from: REGISTERED
        to: TRIAGED
        trigger: "POST /visits/{id}/triage"
        actor: TriageNurse
        preconditions:
          - "Visit.status == REGISTERED (ERR_INVALID_STATE)"
          - "triage_level in {RED,ORANGE,YELLOW,GREEN} (ERR_INVALID_REQUEST)"
        side_effects:
          - "Set Visit.triage_level; increments Visit.version by 1"

      - from: TRIAGED
        to: LWBS
        trigger: "POST /visits/{id}/mark-lwbs"
        actor: TriageNurse
        preconditions:
          - "Visit.status == TRIAGED (ERR_INVALID_STATE)"
          - "No ACTIVE Authorization exists on the Visit (ERR_VISIT_HAS_ACTIVE_AUTH)"
        side_effects:
          - "Visit left-without-being-seen; terminal. Increments Visit.version by 1"

      - from: TRIAGED
        to: IN_TREATMENT
        trigger: "POST /visits/{id}/begin-treatment"
        actor: ClinicianDVM
        preconditions:
          - "Visit.status == TRIAGED (ERR_INVALID_STATE)"
          - "At least one ACTIVE Authorization exists on the Visit (ERR_NO_ACTIVE_AUTH)"
        side_effects:
          - "Set Visit.attending_dvm_id = acting ClinicianDVM id; increments Visit.version by 1"

      - from: IN_TREATMENT
        to: READY_FOR_DISCHARGE
        trigger: "POST /visits/{id}/ready-for-discharge"
        actor: ClinicianDVM
        preconditions:
          - "Visit.status == IN_TREATMENT (ERR_INVALID_STATE)"
          - "No ACTIVE Hospitalization on the Visit (ERR_PATIENT_STILL_BOARDED)"
          - "No SCHEDULED Procedure on the Visit (ERR_PROCEDURE_PENDING)"
        side_effects:
          - "Increments Visit.version by 1"

      - from: READY_FOR_DISCHARGE
        to: DISCHARGED
        trigger: "POST /visits/{id}/discharge"
        actor: ClinicianDVM
        preconditions:
          - "Visit.status == READY_FOR_DISCHARGE (ERR_INVALID_STATE)"
          - "The Visit's Invoice.status in {SETTLED} (ERR_INVOICE_NOT_SETTLED)"
        side_effects:
          - "CASCADE hop1: Invoice, if not already FINALIZED, is FINALIZED (charge_lines locked, tax recomputed)"
          - "CASCADE hop2: a ReferringVetReport is generated snapshotting PERFORMED procedures and Invoice totals"
          - "Increments Visit.version by 1"

      - from: IN_TREATMENT
        to: DECEASED
        trigger: "POST /visits/{id}/mark-deceased"
        actor: ClinicianDVM
        preconditions:
          - "Visit.status == IN_TREATMENT (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop1: every ACTIVE Hospitalization on the Visit -> RELEASED (board_cents accrued, posted to Invoice)"
          - "CASCADE hop2: that Invoice posting recomputes Invoice.subtotal_cents/tax_cents/balance_due_cents"
          - "CASCADE hop1(parallel): every SCHEDULED Procedure on the Visit -> CANCELLED (frees its resource slot)"
          - "Increments Visit.version by 1"

  - entity: Referral
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /visits/{id}/referrals/{referralId}/accept"
        actor: ClinicianDVM
        preconditions:
          - "Referral.status == PENDING (ERR_INVALID_STATE)"
          - "Visit.status in {TRIAGED, IN_TREATMENT} (ERR_VISIT_NOT_OPEN)"
        side_effects:
          - "CROSS-ENTITY: set Visit.department = Referral.to_department AND Visit.attending_dvm_id = Referral.accepting_dvm_id"
          - "Increments Referral.version and Visit.version by 1"

      - from: PENDING
        to: DECLINED
        trigger: "POST /visits/{id}/referrals/{referralId}/decline"
        actor: ClinicianDVM
        preconditions:
          - "Referral.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "No department change; increments Referral.version by 1"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CONSUMED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /visits/{id}/estimates/{estimateId}/issue"
        actor: FinanceCoordinator
        preconditions:
          - "Estimate.status == DRAFT (ERR_INVALID_STATE)"
          - "Visit.triage_level is not null (ERR_VISIT_NOT_TRIAGED)"
        side_effects:
          - "Freeze low_cents/high_cents/deposit_pct/deposit_cents; increments Estimate.version by 1"

      - from: ISSUED
        to: CONSUMED
        trigger: "system (when an Authorization referencing this Estimate becomes ACTIVE)"
        actor: system
        preconditions:
          - "Estimate.status == ISSUED"
        side_effects:
          - "Increments Estimate.version by 1"

      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (when a newer Estimate on the same Visit is ISSUED, or the referencing Authorization is DECLINED)"
        actor: system
        preconditions:
          - "Estimate.status == ISSUED"
        side_effects:
          - "Increments Estimate.version by 1"

  - entity: Authorization
    initial_state: PENDING
    terminal_states: [DECLINED, VOIDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /visits/{id}/authorizations/{authorizationId}/approve"
        actor: Owner
        preconditions:
          - "Authorization.status == PENDING (ERR_INVALID_STATE)"
          - "Referenced Estimate.status == ISSUED (ERR_ESTIMATE_NOT_ISSUED)"
          - "approved_ceiling_cents >= Estimate.high_cents (ERR_CEILING_BELOW_ESTIMATE)"
        side_effects:
          - "CROSS-ENTITY hop1: referenced Estimate ISSUED -> CONSUMED"
          - "hop1(parallel): copy Estimate.deposit_cents into Authorization.deposit_paid_cents"
          - "CASCADE hop2: recompute Visit.authorized_ceiling_cents (sum of ACTIVE approved_ceiling_cents)"
          - "CASCADE hop2(parallel): credit deposit into the Visit's OPEN Invoice.deposit_applied_cents, recompute balance_due_cents"
          - "Increments Authorization.version, Estimate.version, Invoice.version, Visit.version by 1"

      - from: PENDING
        to: DECLINED
        trigger: "POST /visits/{id}/authorizations/{authorizationId}/decline"
        actor: Owner
        preconditions:
          - "Authorization.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "CROSS-ENTITY: referenced Estimate ISSUED -> SUPERSEDED; increments both versions by 1"

      - from: ACTIVE
        to: VOIDED
        trigger: "POST /visits/{id}/authorizations/{authorizationId}/void"
        actor: FinanceCoordinator
        preconditions:
          - "Authorization.status == ACTIVE (ERR_INVALID_STATE)"
          - "Visit.charges_committed_cents <= (Visit.authorized_ceiling_cents - Authorization.approved_ceiling_cents) (ERR_CEILING_BELOW_COMMITTED)"
        side_effects:
          - "COMPENSATION hop1: recompute Visit.authorized_ceiling_cents excluding this authorization"
          - "COMPENSATION hop2: remove this authorization's deposit from Invoice.deposit_applied_cents, recompute balance_due_cents"
          - "Increments Authorization.version, Invoice.version, Visit.version by 1"

  - entity: Hospitalization
    initial_state: ACTIVE
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /visits/{id}/hospitalizations/{hospitalizationId}/release"
        actor: ClinicianDVM
        preconditions:
          - "Hospitalization.status == ACTIVE (ERR_INVALID_STATE)"
          - "released_at (request) > admit_at (ERR_INVALID_REQUEST)"
        side_effects:
          - "LEDGER hop1: compute nights_accrued and board_cents (icu_board_accrual calc)"
          - "LEDGER hop2: append a board charge line to the Visit's OPEN Invoice; recompute subtotal/tax/balance; bump Visit.charges_committed_cents"
          - "Frees the cage; increments Hospitalization.version, Invoice.version, Visit.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /visits/{id}/hospitalizations/{hospitalizationId}/cancel"
        actor: ClinicianDVM
        preconditions:
          - "Hospitalization.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "No board charge; frees the cage; increments Hospitalization.version and Visit.version by 1"

  - entity: Procedure
    initial_state: SCHEDULED
    terminal_states: [PERFORMED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /visits/{id}/procedures/{procedureId}/perform"
        actor: ClinicianDVM
        preconditions:
          - "Procedure.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Visit.charges_committed_cents + price_cents <= Visit.authorized_ceiling_cents (ERR_CEILING_EXCEEDED)"
        side_effects:
          - "LEDGER hop1: append a procedure charge line to the Visit's OPEN Invoice; recompute subtotal/tax/balance"
          - "LEDGER hop2: bump Visit.charges_committed_cents += price_cents"
          - "Increments Procedure.version, Invoice.version, Visit.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/procedures/{procedureId}/cancel"
        actor: ClinicianDVM
        preconditions:
          - "Procedure.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Frees the resource_room slot; increments Procedure.version and Visit.version by 1"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /visits/{id}/invoice/finalize (or system on discharge/decease cascade)"
        actor: FinanceCoordinator
        preconditions:
          - "Invoice.status == OPEN (ERR_INVALID_STATE)"
          - "No SCHEDULED Procedure and no ACTIVE Hospitalization on the Visit (ERR_CHARGES_PENDING)"
        side_effects:
          - "Lock charge_lines; recompute tax_cents (PER_LINE) and balance_due_cents; increments Invoice.version and Visit.version by 1"

      - from: FINALIZED
        to: SETTLED
        trigger: "POST /visits/{id}/invoice/pay (full payment) or system (when a PaymentPlan becomes ACTIVE)"
        actor: FinanceCoordinator
        preconditions:
          - "Invoice.status == FINALIZED (ERR_INVALID_STATE)"
          - "Full payment covers balance_due_cents, OR an ACTIVE PaymentPlan links this Invoice (ERR_PAYMENT_INSUFFICIENT)"
        side_effects:
          - "Increments Invoice.version and Visit.version by 1"

  - entity: PaymentPlan
    initial_state: PROPOSED
    terminal_states: [CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /visits/{id}/payment-plans/{paymentPlanId}/activate"
        actor: FinanceCoordinator
        preconditions:
          - "PaymentPlan.status == PROPOSED (ERR_INVALID_STATE)"
          - "Linked Invoice.status == FINALIZED (ERR_INVOICE_NOT_FINALIZED)"
          - "No other ACTIVE PaymentPlan links the same Invoice (ERR_PLAN_ALREADY_ACTIVE)"
        side_effects:
          - "CROSS-ENTITY: linked Invoice FINALIZED -> SETTLED; increments Invoice.version and Visit.version"
          - "Increments PaymentPlan.version by 1"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /visits/{id}/payment-plans/{paymentPlanId}/cancel"
        actor: FinanceCoordinator
        preconditions:
          - "PaymentPlan.status == PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "Increments PaymentPlan.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (true races only; OCC on parent Visit.version)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-issue-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /visits/{id}/estimates/{estimateId}/issue"
    occ_field: "expected_visit_version"
    description: |
      Issuing an Estimate against a Visit whose version has advanced since the
      client last observed it is rejected. Issuing a newer Estimate legitimately
      supersedes any other ISSUED Estimate on the Visit, so a second issue is a
      valid supersede-create whose loser is detected only by the stale Visit
      version — not by any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payment-plan-activate-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /visits/{id}/payment-plans/{paymentPlanId}/activate"
    occ_field: "expected_visit_version"
    description: |
      Activating a PaymentPlan against a Visit whose version has advanced since
      the client last read it is rejected. A newly ACTIVE plan legitimately
      settles the Invoice and supersedes any competing PROPOSED plan; the losing
      writer's stale Visit version is the only deterministic signal.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant #1: estimate range (Estimate domain) -----------------
  - name: estimate_range
    trigger: "POST /visits/{id}/estimates (create) and frozen at issue"
    algorithm: aggregation
    formula: |
      subtotal_low  = sum(li.qty * li.unit_price_cents for li in line_items)
      # high band adds a 20% clinical-variance uplift, ceil-rounded
      subtotal_high = ceil(subtotal_low * (1 + VARIANCE_UPLIFT))
      # tax PER_LINE (round each line's tax half-up, then sum) — pinned order
      tax_low  = sum(round_half_up(li.qty * li.unit_price_cents * TAX_RATE) for li in line_items)
      tax_high = round_half_up(subtotal_high * TAX_RATE)
      low_cents  = subtotal_low  + tax_low
      high_cents = subtotal_high + tax_high
      deposit_pct = DEPOSIT_TIER[Visit.triage_level]
      deposit_cents = ceil(high_cents * deposit_pct)
    input_set: "line_items of the Estimate; Visit.triage_level frozen at issue time"
    constants:
      VARIANCE_UPLIFT: 0.20
      TAX_RATE: 0.0725
      DEPOSIT_TIER: { RED: 0.80, ORANGE: 0.60, YELLOW: 0.50, GREEN: 0.30 }
    precision: "cents integers, round_half_up on tax, ceil on high uplift and deposit"
    variants:
      - name: low_band
        when: "optimistic quote shown to owner"
        difference: "no variance uplift; tax summed per-line on raw subtotal"
      - name: high_band
        when: "deposit basis; drives deposit_cents"
        difference: "20% uplift then tax on the uplifted subtotal (sum-then-tax on the single high number)"

  # --- Dual-variant #2: invoice reconciliation (Invoice domain) ----------
  - name: invoice_reconciliation
    trigger: "any charge posting (procedure perform, board release) and Invoice finalize"
    algorithm: chronological
    formula: |
      # charge_lines accumulate in posting order (chronological ledger)
      subtotal_cents = sum(cl.qty * cl.unit_price_cents for cl in charge_lines)
      # PINNED tax order = PER_LINE: round each line's tax half-up, then sum.
      tax_cents = sum(round_half_up(cl.qty * cl.unit_price_cents * TAX_RATE) for cl in charge_lines)
      deposit_applied_cents = sum(a.deposit_paid_cents for a in ACTIVE Authorizations on Visit)
      balance_due_cents = max(0, subtotal_cents + tax_cents - deposit_applied_cents)
    input_set: "charge_lines posted to this Invoice in chronological order; ACTIVE authorizations for deposit credit"
    constants:
      TAX_RATE: 0.0725
    precision: "round_half_up per line, then sum; balance floored at 0"
    variants:
      - name: per_line_tax
        when: "authoritative order used by the system"
        difference: "round each line's tax then sum — the pinned order"
      - name: sum_then_tax
        when: "naive alternative that MUST NOT be used"
        difference: "sum subtotal then apply tax once; can differ by 1 cent from per_line"

  # --- Combinatorial (b) rounding-order: covered by invoice_reconciliation's
  #     per_line-vs-sum_then divergence (pinned PER_LINE). ------------------

  # --- Combinatorial (c) circular-looking eval order: payment plan --------
  - name: payment_plan_schedule
    trigger: "POST /visits/{id}/payment-plans (create)"
    algorithm: waterfall_allocation
    formula: |
      principal_cents = Invoice.balance_due_cents            # copied at creation
      # promo eligibility is a threshold gate on BOTH principal and term
      promo_applied = (provider == CARECREDIT
                       and principal_cents >= PROMO_MIN_CENTS
                       and term_months <= PROMO_MAX_MONTHS)
      # fee depends on promo, which depends on principal AND term -> pin order:
      #   (1) principal, (2) promo, (3) fee, (4) total, (5) installments
      if promo_applied:
        financing_fee_cents = 0
      else:
        financing_fee_cents = ceil(principal_cents * APR_MONTHLY * term_months)
      total = principal_cents + financing_fee_cents
      installment_cents = ceil(total / term_months)          # installments 1..n-1
      final_installment_cents = total - installment_cents * (term_months - 1)
    input_set: "linked Invoice.balance_due_cents, provider, term_months"
    constants:
      PROMO_MIN_CENTS: 100000
      PROMO_MAX_MONTHS: 6
      APR_MONTHLY: 0.0225
    precision: "cents integers; ceil on fee and installment; final absorbs remainder"

  # --- ICU board per-diem (chronological accrual) ------------------------
  - name: icu_board_accrual
    trigger: "Hospitalization release (manual or cascade from mark-deceased)"
    algorithm: chronological
    formula: |
      # nights = number of calendar-night boundaries crossed, ceil of duration/24h
      hours = (released_at - admit_at) in hours
      nights_accrued = max(1, ceil(hours / 24))
      board_cents = nights_accrued * PER_DIEM[ward]
    input_set: "single Hospitalization's admit_at and released_at; ward per-diem"
    constants:
      PER_DIEM: { ICU: 180000, WARD: 60000 }
    precision: "integer nights, ceil; minimum 1 night"

  # --- Visit authorized ceiling (aggregation) ----------------------------
  - name: authorized_ceiling
    trigger: "Authorization approve / void"
    algorithm: aggregation
    formula: |
      authorized_ceiling_cents = sum(a.approved_ceiling_cents
                                     for a in Authorizations on Visit
                                     where a.status == ACTIVE)
    input_set: "Authorizations on the Visit with status == ACTIVE only"
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (Visit before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in the required state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "Cross-entity references resolve and are in the required state (e.g. Estimate ISSUED for approve, Invoice FINALIZED for plan activate)"
    error_id: "ERR_ESTIMATE_NOT_ISSUED / ERR_INVOICE_NOT_FINALIZED"
    http_status: 409
    applies_to: "authorization approve, payment-plan activate"

  - priority: 6
    category: business_safety
    check: "Discharge blocked while patient still boarded or a procedure is pending; ready-for-discharge same"
    error_id: "ERR_PATIENT_STILL_BOARDED / ERR_PROCEDURE_PENDING"
    http_status: 409
    applies_to: "ready-for-discharge, invoice finalize"

  - priority: 7
    category: business_temporal
    check: "A new Procedure booking must not overlap an existing SCHEDULED/PERFORMED booking on the same resource_room (half-open [start,end)); a new Hospitalization must not reuse a cage occupied by an ACTIVE hospitalization of the same ward (point-occupancy)"
    error_id: "ERR_RESOURCE_DOUBLE_BOOKED / ERR_CAGE_OCCUPIED"
    http_status: 409
    applies_to: "procedure create, hospitalization create"

  - priority: 8
    category: business_constraint
    check: "modality must match resource_room family (IMAGING_CT->CT_SUITE, IMAGING_MRI->MRI_SUITE, SURGERY->OR_1/OR_2); ICU cage_number within 1..ICU_CAPACITY"
    error_id: "ERR_MODALITY_ROOM_MISMATCH / ERR_CAGE_OUT_OF_RANGE"
    http_status: 422
    applies_to: "procedure create, hospitalization create"

  - priority: 9
    category: business_fiscal
    check: "Authorization ceiling >= estimate high; performing a procedure must not push committed charges over the Visit authorized ceiling; voiding an authorization must not drop ceiling below committed"
    error_id: "ERR_CEILING_BELOW_ESTIMATE / ERR_CEILING_EXCEEDED / ERR_CEILING_BELOW_COMMITTED"
    http_status: 409
    applies_to: "authorization approve/void, procedure perform"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_visit_version must match current Visit.version on supersede-create endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "estimate issue, payment-plan activate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient (animal)"
    roles: [TriageNurse, FinanceCoordinator]
    code: 201
    input: [name, species, weight_kg, owner_user_id]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Get a patient"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{id}/visits"
    description: "List visits for a patient (FK reverse-reachability: Visit.patient_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: Visit[]
    side_effects: []

  # ---- Visit ----
  - method: POST
    path: "/visits"
    description: "Create (register) an ER visit for a patient"
    roles: [TriageNurse]
    code: 201
    input: [patient_id, chief_complaint]
    output: Visit
    side_effects:
      - "status=REGISTERED, department=ER, triage_level=null, authorized_ceiling_cents=0, charges_committed_cents=0, version=1"
      - "Create the single OPEN Invoice for this Visit"

  - method: GET
    path: "/visits/{id}"
    description: "Get a visit (case) with computed ceiling/committed fields"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/visits/{id}/triage"
    description: "Assign triage level"
    roles: [TriageNurse]
    code: 200
    input: [triage_level]
    output: Visit
    side_effects: ["status REGISTERED->TRIAGED; set triage_level; version+1"]

  - method: POST
    path: "/visits/{id}/begin-treatment"
    description: "Begin clinical treatment (requires an ACTIVE authorization)"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Visit
    side_effects: ["status TRIAGED->IN_TREATMENT; set attending_dvm_id=acting DVM; version+1"]

  - method: POST
    path: "/visits/{id}/ready-for-discharge"
    description: "Mark case ready for discharge"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Visit
    side_effects: ["status IN_TREATMENT->READY_FOR_DISCHARGE; version+1"]

  - method: POST
    path: "/visits/{id}/discharge"
    description: "Discharge the patient (Invoice must be SETTLED)"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "status READY_FOR_DISCHARGE->DISCHARGED; version+1"
      - "cascade: Invoice FINALIZED if not already; ReferringVetReport generated"

  - method: POST
    path: "/visits/{id}/mark-deceased"
    description: "Record patient death; unwinds boarding and scheduled procedures"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "status IN_TREATMENT->DECEASED; version+1"
      - "cascade: ACTIVE Hospitalizations -> RELEASED (board posted); SCHEDULED Procedures -> CANCELLED"

  - method: POST
    path: "/visits/{id}/mark-lwbs"
    description: "Mark left-without-being-seen"
    roles: [TriageNurse]
    code: 200
    input: []
    output: Visit
    side_effects: ["status TRIAGED->LWBS; version+1"]

  # ---- Referral ----
  - method: POST
    path: "/visits/{id}/referrals"
    description: "Create a referral to a specialty department"
    roles: [ClinicianDVM]
    code: 201
    input: [to_department, accepting_dvm_id, reason]
    output: Referral
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/visits/{id}/referrals"
    description: "List referrals for a visit (FK reverse-reachability: Referral.visit_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/referrals/{referralId}/accept"
    description: "Accept a referral; transfers department and attending DVM"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Referral
    side_effects: ["status PENDING->ACCEPTED; Visit.department & attending_dvm_id updated; versions+1"]

  - method: POST
    path: "/visits/{id}/referrals/{referralId}/decline"
    description: "Decline a referral"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Referral
    side_effects: ["status PENDING->DECLINED"]

  # ---- Estimate ----
  - method: POST
    path: "/visits/{id}/estimates"
    description: "Create a draft estimate"
    roles: [FinanceCoordinator]
    code: 201
    input: [line_items]
    output: Estimate
    side_effects: ["status=DRAFT; low_cents/high_cents/deposit_pct/deposit_cents computed provisionally"]

  - method: GET
    path: "/visits/{id}/estimates"
    description: "List estimates for a visit (FK reverse-reachability: Estimate.visit_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: Estimate[]
    side_effects: []

  - method: GET
    path: "/visits/{id}/estimates/{estimateId}"
    description: "Get an estimate"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: []
    output: Estimate
    side_effects: []

  - method: POST
    path: "/visits/{id}/estimates/{estimateId}/issue"
    description: "Issue an estimate (freezes amounts). Supersede-create: OCC on Visit.version"
    roles: [FinanceCoordinator]
    code: 200
    input: [expected_visit_version]
    output: Estimate
    side_effects:
      - "status DRAFT->ISSUED; freeze amounts"
      - "any other ISSUED Estimate on the Visit -> SUPERSEDED"
      - "increments Visit.version by 1"

  # ---- Authorization ----
  - method: POST
    path: "/visits/{id}/authorizations"
    description: "Create a pending authorization against an ISSUED estimate"
    roles: [FinanceCoordinator]
    code: 201
    input: [estimate_id, approved_ceiling_cents]
    output: Authorization
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/visits/{id}/authorizations"
    description: "List authorizations for a visit (FK reverse-reachability: Authorization.visit_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: GET
    path: "/authorizations/{authorizationId}"
    description: "Get a single authorization by id (top-level)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: "/authorizations"
    description: "List authorizations, filterable by estimate_id (FK reverse-reachability: Authorization.estimate_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["estimate_id?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/authorizations/{authorizationId}/approve"
    description: "Owner approves an authorization; consumes estimate, credits deposit"
    roles: [Owner]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "status PENDING->ACTIVE; Estimate->CONSUMED; deposit_paid_cents copied"
      - "recompute Visit.authorized_ceiling_cents; credit Invoice.deposit_applied_cents; recompute balance"
      - "versions+1"

  - method: POST
    path: "/visits/{id}/authorizations/{authorizationId}/decline"
    description: "Owner declines an authorization; supersedes the estimate"
    roles: [Owner]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status PENDING->DECLINED; Estimate->SUPERSEDED"]

  - method: POST
    path: "/visits/{id}/authorizations/{authorizationId}/void"
    description: "Void an ACTIVE authorization (compensating: reverse ceiling & deposit)"
    roles: [FinanceCoordinator]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "status ACTIVE->VOIDED; recompute Visit.authorized_ceiling_cents; remove deposit from Invoice; recompute balance"
      - "versions+1"

  # ---- Hospitalization ----
  - method: POST
    path: "/visits/{id}/hospitalizations"
    description: "Admit patient to a board (ICU/WARD) and cage"
    roles: [ClinicianDVM]
    code: 201
    input: [ward, cage_number, admit_at, planned_discharge_at]
    output: Hospitalization
    side_effects: ["status=ACTIVE; occupies cage"]

  - method: GET
    path: "/visits/{id}/hospitalizations"
    description: "List hospitalizations for a visit (FK reverse-reachability: Hospitalization.visit_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: Hospitalization[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/hospitalizations/{hospitalizationId}/release"
    description: "Release from board; accrues per-diem and posts board charge"
    roles: [ClinicianDVM]
    code: 200
    input: [released_at]
    output: Hospitalization
    side_effects:
      - "status ACTIVE->RELEASED; nights_accrued & board_cents computed; board charge posted to Invoice"
      - "Visit.charges_committed_cents += board_cents; versions+1"

  - method: POST
    path: "/visits/{id}/hospitalizations/{hospitalizationId}/cancel"
    description: "Cancel an admission with no board charge"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Hospitalization
    side_effects: ["status ACTIVE->CANCELLED; frees cage"]

  # ---- Procedure ----
  - method: POST
    path: "/visits/{id}/procedures"
    description: "Schedule a diagnostics/surgery procedure into a resource slot"
    roles: [ClinicianDVM]
    code: 201
    input: [modality, resource_room, start_at, end_at, price_cents]
    output: Procedure
    side_effects: ["status=SCHEDULED; occupies resource_room slot [start_at,end_at)"]

  - method: GET
    path: "/visits/{id}/procedures"
    description: "List procedures for a visit (FK reverse-reachability: Procedure.visit_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: Procedure[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/procedures/{procedureId}/perform"
    description: "Mark a procedure performed; posts its charge (ceiling-gated)"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Procedure
    side_effects:
      - "status SCHEDULED->PERFORMED; procedure charge posted to Invoice; Visit.charges_committed_cents += price_cents"
      - "versions+1"

  - method: POST
    path: "/visits/{id}/procedures/{procedureId}/cancel"
    description: "Cancel a scheduled procedure; frees the slot"
    roles: [ClinicianDVM]
    code: 200
    input: []
    output: Procedure
    side_effects: ["status SCHEDULED->CANCELLED; frees slot"]

  # ---- Invoice ----
  - method: GET
    path: "/visits/{id}/invoice"
    description: "Get the Visit's Invoice (single OPEN/FINALIZED/SETTLED invoice) as a list (FK reverse-reachability: Invoice.visit_id)"
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/invoice/finalize"
    description: "Finalize the Invoice (locks charge lines)"
    roles: [FinanceCoordinator]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status OPEN->FINALIZED; recompute tax & balance; versions+1"]

  - method: POST
    path: "/visits/{id}/invoice/pay"
    description: "Record a full cash/card payment; settles the invoice"
    roles: [FinanceCoordinator]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["status FINALIZED->SETTLED when amount_cents >= balance_due_cents; versions+1"]

  # ---- PaymentPlan ----
  - method: POST
    path: "/visits/{id}/payment-plans"
    description: "Propose a payment plan (CareCredit/in-house) for a FINALIZED invoice"
    roles: [FinanceCoordinator]
    code: 201
    input: [invoice_id, provider, term_months]
    output: PaymentPlan
    side_effects: ["status=PROPOSED; principal/fee/installment schedule computed"]

  - method: GET
    path: "/visits/{id}/payment-plans"
    description: "List payment plans for a visit (FK reverse-reachability: PaymentPlan.visit_id)"
    roles: [FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  - method: GET
    path: "/payment-plans/{paymentPlanId}"
    description: "Get a single payment plan by id (top-level)"
    roles: [FinanceCoordinator, Owner]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: GET
    path: "/payment-plans"
    description: "List payment plans, filterable by invoice_id (FK reverse-reachability: PaymentPlan.invoice_id)"
    roles: [FinanceCoordinator, Owner]
    code: 200
    input: ["invoice_id?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  - method: POST
    path: "/visits/{id}/payment-plans/{paymentPlanId}/activate"
    description: "Activate a proposed plan; settles the invoice. Supersede-create: OCC on Visit.version"
    roles: [FinanceCoordinator]
    code: 200
    input: [expected_visit_version]
    output: PaymentPlan
    side_effects:
      - "status PROPOSED->ACTIVE; linked Invoice FINALIZED->SETTLED"
      - "increments Visit.version by 1"

  - method: POST
    path: "/visits/{id}/payment-plans/{paymentPlanId}/cancel"
    description: "Cancel a proposed plan"
    roles: [FinanceCoordinator]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status PROPOSED->CANCELLED"]

  # ---- ReferringVetReport ----
  - method: GET
    path: "/visits/{id}/referring-vet-reports"
    description: "List referring-DVM reports for a visit (FK reverse-reachability: ReferringVetReport.visit_id). Generated on discharge"
    roles: [ClinicianDVM, FinanceCoordinator, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: ReferringVetReport[]
    side_effects: []

  # ---- Test-driving: system clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-05-01T00:00:00Z (never real wall-clock)."
    roles: [TriageNurse, ClinicianDVM, FinanceCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for the operation, or Owner acting on a patient they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, weight_kg<=0, released_at<=admit_at, start_at>=end_at" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in the required state for the transition" }
  - { id: ERR_VISIT_NOT_TRIAGED, http: 409, condition: "Estimate issue attempted before Visit is triaged" }
  - { id: ERR_VISIT_NOT_OPEN, http: 409, condition: "Referral accept attempted while Visit not in {TRIAGED, IN_TREATMENT}" }
  - { id: ERR_NO_ACTIVE_AUTH, http: 409, condition: "begin-treatment without any ACTIVE Authorization on the Visit" }
  - { id: ERR_VISIT_HAS_ACTIVE_AUTH, http: 409, condition: "mark-lwbs while an ACTIVE Authorization exists" }
  - { id: ERR_ESTIMATE_NOT_ISSUED, http: 409, condition: "Authorization approve references an Estimate not in ISSUED status" }
  - { id: ERR_CEILING_BELOW_ESTIMATE, http: 409, condition: "approved_ceiling_cents < referenced Estimate.high_cents on approve" }
  - { id: ERR_CEILING_EXCEEDED, http: 409, condition: "Performing a procedure would push charges_committed_cents over authorized_ceiling_cents" }
  - { id: ERR_CEILING_BELOW_COMMITTED, http: 409, condition: "Voiding an authorization would drop authorized_ceiling_cents below charges_committed_cents" }
  - { id: ERR_PATIENT_STILL_BOARDED, http: 409, condition: "ready-for-discharge / finalize while an ACTIVE Hospitalization exists" }
  - { id: ERR_PROCEDURE_PENDING, http: 409, condition: "ready-for-discharge / finalize while a SCHEDULED Procedure exists" }
  - { id: ERR_CHARGES_PENDING, http: 409, condition: "Invoice finalize while SCHEDULED procedures or ACTIVE hospitalizations remain" }
  - { id: ERR_RESOURCE_DOUBLE_BOOKED, http: 409, condition: "Procedure slot overlaps an existing SCHEDULED/PERFORMED booking on the same resource_room (half-open interval)" }
  - { id: ERR_CAGE_OCCUPIED, http: 409, condition: "Cage already occupied by an ACTIVE hospitalization of the same ward" }
  - { id: ERR_MODALITY_ROOM_MISMATCH, http: 422, condition: "modality does not match resource_room family" }
  - { id: ERR_CAGE_OUT_OF_RANGE, http: 422, condition: "ICU cage_number outside 1..ICU_CAPACITY" }
  - { id: ERR_INVOICE_NOT_SETTLED, http: 409, condition: "discharge attempted while Invoice not SETTLED" }
  - { id: ERR_INVOICE_NOT_FINALIZED, http: 409, condition: "payment-plan activate while linked Invoice not FINALIZED" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "activate while another ACTIVE PaymentPlan already links the Invoice" }
  - { id: ERR_PAYMENT_INSUFFICIENT, http: 402, condition: "invoice pay amount_cents < balance_due_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_visit_version does not match current Visit.version on a supersede-create endpoint" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TriageNurse
    description: "Front-desk / triage: registers patients & visits, assigns triage, marks LWBS."
    identity: "opaque"
    exclusive_operations:
      - "POST /visits — register visit"
      - "POST /visits/{id}/triage — assign triage level"
      - "POST /visits/{id}/mark-lwbs — mark left-without-being-seen"
    shared_operations:
      - "POST /patients — register patient (shared with FinanceCoordinator)"
      - "GET reads on patients/visits/children"

  - name: ClinicianDVM
    description: "Attending / specialist veterinarian: clinical workflow, referrals, hospitalization, procedures, discharge/decease. Multi-doctor continuity via Visit.attending_dvm_id."
    identity: "opaque"
    exclusive_operations:
      - "POST /visits/{id}/begin-treatment, /ready-for-discharge, /discharge, /mark-deceased"
      - "POST /visits/{id}/referrals (+ accept/decline)"
      - "POST /visits/{id}/hospitalizations (+ release/cancel)"
      - "POST /visits/{id}/procedures (+ perform/cancel)"
    shared_operations:
      - "GET reads on visits and children"

  - name: FinanceCoordinator
    description: "Financial workflow: estimates, authorizations lifecycle (create/void), invoice finalize/pay, payment plans, deposits & CareCredit."
    identity: "opaque"
    exclusive_operations:
      - "POST /visits/{id}/estimates (+ issue)"
      - "POST /visits/{id}/authorizations (create), /authorizations/{id}/void"
      - "POST /visits/{id}/invoice/finalize, /invoice/pay"
      - "POST /visits/{id}/payment-plans (+ activate/cancel)"
    shared_operations:
      - "POST /patients — register patient (shared with TriageNurse)"
      - "GET reads on visits and children"

  - name: Owner
    description: "Animal's client/owner: authorizes treatment (approve/decline) and views their animal's case. entity_backed: X-User-ID must equal Patient.owner_user_id for the visit's patient."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /visits/{id}/authorizations/{id}/approve — authorize treatment"
      - "POST /visits/{id}/authorizations/{id}/decline — decline treatment"
    shared_operations:
      - "GET reads on their own patient's visits and children"
