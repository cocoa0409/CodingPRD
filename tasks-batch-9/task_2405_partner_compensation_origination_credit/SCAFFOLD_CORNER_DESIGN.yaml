          - validations[priority=130]
        distinguishing_aspect: |
          A single SUBMITTED claim holds the whole cycle in OPEN_INTAKE with
          ERR_UNRESOLVED_CLAIMS 409; adjudicating it to REJECTED - a terminal state that
          grants no credit - clears the gate, proving the precondition counts in-flight
          claims rather than approved ones.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partner P has one SUBMITTED NEW_CLIENT claim on OPEN Matter M; ARB is the credit arbiter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
