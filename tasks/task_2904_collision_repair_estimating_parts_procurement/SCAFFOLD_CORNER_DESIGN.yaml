          - errors.ERR_OEM_UPGRADE_NOT_APPLICABLE
          - validations.priority_62
          - validations.priority_80
        distinguishing_aspect: >-
          Policy refusal and upgrade refusal are separate codes on the same endpoint. The insurer bars
          RECONDITIONED outright, so such a line never exists; and oem_upgrade is refused both on a
          non-OEM line and on an OEM line whose vehicle is younger than the program's alternate-parts
          age, which is the case a single boolean check would miss.
        test_recipe:
          setup:
            - "The clock stands at 2026-08-01T00:00:00Z. An Insurer with reconditioned_allowed false (the default), aftermarket_allowed true and alternate_parts_min_vehicle_age_years 5."
            - "Order N is a 2024 vehicle - two years old, below the alternate-parts age - and is blueprinted with one BODY line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
