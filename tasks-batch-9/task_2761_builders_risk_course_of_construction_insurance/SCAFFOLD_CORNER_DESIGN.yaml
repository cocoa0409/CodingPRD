            - call: "GET /builders-risk/loss-payments/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e7: $.data.error_id }
            - call: "GET /builders-risk/testing-notices/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e8: $.data.error_id }
            - call: "GET /builders-risk/facilities/00000000-0000-4000-8000-000000000009"
              payload: {}
