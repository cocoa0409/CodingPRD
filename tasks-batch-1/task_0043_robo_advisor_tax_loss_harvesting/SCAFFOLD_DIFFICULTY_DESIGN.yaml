          - validations[priority=6]
        distinguishing_aspect: |
          A non-Compliance caller (Advisor) rejecting an already-EXECUTED harvest violates both
          auth (priority 2, ERR_FORBIDDEN) and state (priority 6, ERR_INVALID_STATE); the
