  - rule_id: resource_temporal_overlap
    instances:

      - name: order_period_half_open_adjacency_allowed
        grounds:
          - validations[order-period-no-overlap]
          - entities.OrderPeriod.fields.opens_at
          - entities.OrderPeriod.fields.closes_at
          - errors[ERR_ORDER_PERIOD_OVERLAP]
        distinguishing_aspect: |
          The contended resource is the Deal's order book and the interval semantics are HALF-OPEN
          [opens_at, closes_at) with no buffer, so an abutting window (closes_at == the next
          opens_at) is legal while a one-second intrusion is not. This is the opposite convention
          from the rating-presentation resource, which uses a closed interval plus a buffer.
        test_recipe:
          setup:
            - "Firm MA0001 is a MUNICIPAL_ADVISOR and issuer C is a CITY."
            - "A DRAFT deal (Series 2026W) exists with no order periods."
            - "The logical clock stands at its 2026-08-01T00:00:00Z default; scheduling never reads the clock."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026W", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T13:00:00.000Z", closes_at: "2026-08-05T17:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { op1_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T17:00:00.000Z", closes_at: "2026-08-05T21:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T20:59:59.000Z", closes_at: "2026-08-05T22:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T21:00:00.000Z", closes_at: "2026-08-05T22:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T16:59:59.000Z", closes_at: "2026-08-05T16:59:59.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}/order-periods"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the 17:00:00 to 21:00:00 period returns 201 because closes_at of ${op1_id} equals its opens_at and the interval is half-open"
            - "the 20:59:59 to 22:00:00 period returns 422 with error_id ERR_ORDER_PERIOD_OVERLAP because it intrudes one second into the 17:00-21:00 window"
            - "the 21:00:00 to 22:00:00 period returns 201, abutting the 17:00-21:00 window on the other side"
            - "the zero-length 16:59:59 to 16:59:59 period returns 422 with error_id ERR_ORDER_PERIOD_OVERLAP because opens_at < closes_at is required"
            - "GET /bond-offerings/deals/${deal_id}/order-periods returns total_count 3"
            - "every accepted period has status SCHEDULED and allotment_run_count 0"

      - name: rating_presentation_closed_interval_sixty_minute_buffer
        grounds:
          - validations[presentation-buffer-per-agency]
          - entities.RatingPresentation.fields.starts_at
          - entities.RatingPresentation.fields.ends_at
          - errors[ERR_PRESENTATION_BUFFER_CONFLICT]
        distinguishing_aspect: |
          A different resource (the deal team's presentation slot for one rating agency, scoped by
          agency rather than by deal alone) with different interval semantics: a CLOSED interval
          [starts_at, ends_at] expanded by PRESENTATION_BUFFER_MINUTES (60) on both sides. A gap
          of exactly 60 minutes is therefore legal and 59 is not, and two agencies may occupy the
          very same instant, which no order-period pair may do.
        test_recipe:
          setup:
            - "Firm MA0001 is a MUNICIPAL_ADVISOR and issuer C is a CITY."
            - "A DRAFT deal (Series 2026V) has a MOODYS engagement and an SP engagement."
            - "The MOODYS engagement already has one SCHEDULED presentation on 2026-08-10 from 14:00 to 16:00 UTC."
            - "The logical clock stands at its 2026-08-01T00:00:00Z default, so nothing is promoted to HELD."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
