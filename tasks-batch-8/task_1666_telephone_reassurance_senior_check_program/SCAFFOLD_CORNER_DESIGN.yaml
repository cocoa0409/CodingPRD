        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_NOT_OPEN]", state_machines.WaitlistEntry]
        distinguishing_aspect: "Accept requires OFFERED; a WAITING entry (never offered) rejects with ERR_OFFER_NOT_OPEN."
