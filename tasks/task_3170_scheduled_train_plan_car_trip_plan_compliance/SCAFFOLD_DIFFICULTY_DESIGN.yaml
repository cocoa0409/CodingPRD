            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p}", leg_sequence: 1 }] }
              as: NetworkPlanner
          trigger:
            - call: "POST /rail/train-plans/${p}/retire"
              payload: { expected_train_plan_version: "${p_v2}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
            - call: "POST /rail/shipments/${s}/cancel"
              payload: {}
