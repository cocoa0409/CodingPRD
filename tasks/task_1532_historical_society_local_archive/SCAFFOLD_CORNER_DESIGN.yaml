  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_deed_execute_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deed-execute-stale-accession]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Accession.version: executing deed D2 with the pre-execute version succeeds (superseding D1) and bumps the accession version; a second execute of D3 carrying the same stale version fails 412 ERR_STALE_VERSION; refetching and retrying D3 succeeds and supersedes D2."
        test_recipe:
          setup: ["accession ACCESSIONED with D1 EXECUTED; drafts D2 and D3 created; client captured accession version V after the drafts"]
          setup_api_calls:
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: { required_citation_text: "A" }, as: Registrar, captures: { d1: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av0: $.data.version } }
            - { call: "POST /deeds/${d1}/execute", payload: { expected_accession_version: "${av0}" }, as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: { required_citation_text: "B" }, as: Registrar, captures: { d2: $.data.id } }
            - { call: "POST /accessions/${a}/deeds", payload: { required_citation_text: "C" }, as: Registrar, captures: { d3: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /deeds/${d2}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar, captures: { s2: $.data.status } }
            - { call: "POST /deeds/${d3}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar, captures: { err: $.data.error_id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av2: $.data.version, cd: $.data.current_deed_id } }
            - { call: "POST /deeds/${d3}/execute", payload: { expected_accession_version: "${av2}" }, as: Registrar, captures: { s3: $.data.status } }
            - { call: "GET /accessions/${a}/deeds", as: Registrar }
          assert:
            - "D2 execute with fresh version: EXECUTED (${s2}); accession.version incremented"
            - "D3 execute with the stale captured version: error_id == ERR_STALE_VERSION (${err}), http 412; D3 stays DRAFT"
            - "refetched version (${av2} == ${av} + 1); current_deed_id == ${d2} (${cd})"
            - "D3 retry with fresh version: EXECUTED (${s3}); D2 now SUPERSEDED — exactly one EXECUTED deed at all times"

      - name: occ_assessment_create_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-item]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Item.version: creating an assessment with the current item version succeeds and supersedes the prior DRAFT; a second create with the stale version fails 412; retry with the fresh version succeeds and supersedes the first assessment."
        test_recipe:
          setup: ["item I AVAILABLE; client captured item version V"]
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 1000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "I1" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "x", condition_grade: "POOR", appraised_value_cents: 50000, format: "ARTIFACT" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
