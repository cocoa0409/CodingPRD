              captures: { a1: $.data.id }
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
          trigger:
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o1}", pasture_id: "${p1}", rate_cents: 85, head_count_committed: 150, head_value_cents: 140000, start_date: "2026-08-10", end_date: "2026-11-10", water_responsibility: "SHARED", fence_responsibility: "GRAZIER", death_loss_terms: "OWNER_BEARS_ALL" }
