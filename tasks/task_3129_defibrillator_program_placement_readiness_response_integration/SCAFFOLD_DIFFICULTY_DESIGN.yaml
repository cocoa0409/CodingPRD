# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3129_defibrillator_program_placement_readiness_response_integration
# Nine §0.5 Difficulty Rules × 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: install_expiration_pad_vs_battery_use_distinct_shelf_lives
        grounds:
          - calculations.install_expiration
          - entities.DeviceModel.fields.pad_shelf_life_months
          - entities.DeviceModel.fields.battery_shelf_life_months
          - entities.Install.fields.expires_at
        distinguishing_aspect: |
          Two variants of install_expiration on the SAME Device produce different
          expires_at values when DeviceModel.pad_shelf_life_months (24) differs
          from battery_shelf_life_months (48): pad expires_at = min(lot_mfg, install+24mo),
          battery expires_at = min(lot_mfg, install+48mo).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "DeviceModel with pad_shelf_life_months=24, battery_shelf_life_months=48, prescription_required=false."
            - "Campus with medical_director_id placeholder, response_time_target_seconds=240."
            - "Device registered but NOT installed in cabinet."
            - "Pad lot with manufacturer_expires_at=2030-01-01, qty=5. Battery lot with manufacturer_expires_at=2030-01-01, qty=5."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "AED-PLUS", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "Main Campus", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-001", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm_id }", serial_number: "SN-001" }
              as: ProgramManager
              captures: { device_id: $.data.id, dev_v0: $.data.version }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm_id }", kind: "PAD", lot_code: "LOT-P1", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { pad_lot_id: $.data.id }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm_id }", kind: "BATTERY", lot_code: "LOT-B1", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { batt_lot_id: $.data.id }
            - call: "POST /api/installs"
              payload: { device_id: "${device_id}", consumable_lot_id: "${pad_lot_id }", expected_device_version: "${dev_v0}" }
              as: ProgramManager
              captures: { pad_install_id: $.data.id, pad_exp: $.data.expires_at }
            - call: "GET /api/devices/${device_id}"
              payload: {}
              as: ProgramManager
              captures: { dev_v1: $.data.version }
            - call: "POST /api/installs"
              payload: { device_id: "${device_id}", consumable_lot_id: "${batt_lot_id }", expected_device_version: "${dev_v1}" }
              as: ProgramManager
              captures: { batt_install_id: $.data.id, batt_exp: $.data.expires_at }
          trigger:
            - call: "GET /api/installs"
              payload: { device_id: "${device_id}" }
              as: ProgramManager
          assert:
            - "Install.${pad_install_id}.expires_at == 2028-09-01T00:00:00Z (install 2026-09-01 + 24mo, less than lot mfg 2030-01-01)"
            - "Install.${batt_install_id}.expires_at == 2030-01-01T00:00:00Z (install + 48mo = 2030-09-01, clamped by lot mfg 2030-01-01)"
            - "Install.${pad_install_id}.expires_at != Install.${batt_install_id}.expires_at"

      - name: response_time_straight_line_vs_walk_path_diverge
        grounds:
          - calculations.response_time_estimate_seconds
          - calculations.response_time_estimate_seconds.variants.straight_line_optimistic
          - calculations.response_time_estimate_seconds.variants.walk_path_pessimistic
        distinguishing_aspect: |
          Two variants of response_time_estimate_seconds on the SAME Zone/Cabinet
          produce different integer seconds: straight-line uses euclidean distance,
          walk-path uses manhattan × 1.30. For dx=100, dy=100, walk_speed=1.5m/s,
          no elevator: A=round(141.42/1.5)=94s, B=round(200*1.30/1.5)=173s.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Campus with response_time_target_seconds=120."
            - "Zone with centroid implicit (0,0), avg_walk_speed_mps=1.5, requires_elevator=false."
            - "Cabinet at (100, 100)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C2", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-002", medical_director_id: "md-tbd", response_time_target_seconds: 120 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "Z1", floor_area_sqm: 40000, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zone_id}", location_label: "L1", centroid_x_m: 100.0, centroid_y_m: 100.0 }
              as: ProgramManager
              captures: { cab_id: $.data.id }
          trigger:
            - call: "GET /api/campuses/${campus_id}/coverage-report"
              payload: {}
              as: ProgramManager
          assert:
            - "response_time_estimate_seconds straight-line (OPTIMISTIC) for ${cab_id} == 94"
            - "response_time_estimate_seconds walk-path (PESSIMISTIC) for ${cab_id} == 173"
            - "OPTIMISTIC != PESSIMISTIC for the same cabinet"
            - "Zone Z1 is NOT covered in the PESSIMISTIC variant because 173 > target 120"
            - "Zone Z1 IS covered in the OPTIMISTIC variant because 94 <= target 120"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: readiness_posture_mode_a_multi_input_nonlinear
        grounds:
          - calculations.readiness_posture
          - entities.Device.fields.readiness_posture
        distinguishing_aspect: |
          Mode (a): posture formula has >= 4 inputs (pad expiry, battery expiry,
          last_selftest_status, last_inspection_at, Device.status) with non-linear
          conditional branches: a single FAIL self-test forces OUT_OF_SERVICE even
          when all consumables are fresh and inspection is current.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Device fully installed (pad + battery, fresh lots), commissioned to IN_SERVICE, posture=READY."
            - "Recent PASS inspection, last_selftest_status=PASS."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M3", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C3", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-003", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "Z", floor_area_sqm: 1000, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zone_id}", location_label: "L", centroid_x_m: 0.0, centroid_y_m: 0.0 }
              as: ProgramManager
              captures: { cab_id: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm_id }", serial_number: "SN-003" }
              as: ProgramManager
              captures: { device_id: $.data.id, dv0: $.data.version }
            - call: "POST /api/devices/${device_id}/install"
              payload: { cabinet_id: "${cab_id}", expected_device_version: "${dv0}" }
              as: ProgramManager
              captures: { dv1: $.data.version }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm_id }", kind: "PAD", lot_code: "P3", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { pad_lot: $.data.id }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm_id }", kind: "BATTERY", lot_code: "B3", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { batt_lot: $.data.id }
            - call: "POST /api/installs"
              payload: { device_id: "${device_id}", consumable_lot_id: "${pad_lot }", expected_device_version: "${dv1}" }
              as: ProgramManager
              captures: { dv2: $.data.version }
            - call: "GET /api/devices/${device_id}"
              payload: {}
              as: ProgramManager
              captures: { dv2b: $.data.version }
            - call: "POST /api/installs"
              payload: { device_id: "${device_id}", consumable_lot_id: "${batt_lot }", expected_device_version: "${dv2b}" }
              as: ProgramManager
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "Insp I", badge_number: "IN-1", responder_role: "INSPECTOR" }
              as: ProgramManager
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { device_id: "${device_id}", inspector_id: "${insp_id }", scheduled_for: "2026-09-01T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { insp_rec: $.data.id }
            - call: "POST /api/inspections/${insp_rec}/submit"
              payload: { checklist_items: [{item_code: "PADS_OK", result: "PASS"}, {item_code: "BATT_OK", result: "PASS"}, {item_code: "CABINET_OK", result: "PASS"}] }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/self-test-reports"
              payload: { device_id: "${device_id}", reported_at: "2026-09-01T00:00:00Z", result: "PASS" }
              as: System
            - call: "POST /api/devices/${device_id}/commission"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /api/self-test-reports"
              payload: { device_id: "${device_id}", reported_at: "2026-09-01T01:00:00Z", result: "FAIL", fault_code: "BATT-LOW" }
              as: System
            - call: "GET /api/devices/${device_id}"
              payload: {}
              as: ProgramManager
          assert:
            - "Device.${device_id}.readiness_posture == OUT_OF_SERVICE"
            - "Device.${device_id}.last_selftest_status == FAIL"
            - "readiness_posture flipped OUT_OF_SERVICE even though pad and battery are unexpired and last_inspection_at is current"

      - name: coverage_score_mode_b_per_zone_then_sum_rounding
        grounds:
          - calculations.coverage_score_percent
          - calculations.coverage_score_percent.variants.per_zone_then_sum
        distinguishing_aspect: |
          Mode (b): pinned rounding order — per-zone coverage is integer 0/1,
          summed, multiplied by 100, divided by zone count, rounded half-up ONCE
          at the end. Sum-then-round (treating each zone as a fractional
          contribution) is rejected. For 3 zones where 2 are covered: 2*100/3
          = 66.67 → round_half_up = 67. The alternate formula
          round(0.67*100) would also give 67 here, so we use 3 zones/2 covered
          AND a 6-zone/4-covered case where 4*100/6=66.67→67 (vs
          sum-of-fractions rounding intermediate per-zone values would yield
          a different number when per-zone fraction is itself rounded).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Campus with response_time_target_seconds=100."
            - "3 zones. Zone A and B each have a cabinet at distance giving PESSIMISTIC response <= 100. Zone C has a cabinet giving PESSIMISTIC > 100 (or no cabinet)."
            - "avg_walk_speed_mps=1.5; Zone A,B cabinets at (10,0) so manhattan=10, walk=10*1.3/1.5=8.67 → round=9s. Zone C cabinet at (200,0) → 200*1.3/1.5=173.3→173s."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C4", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-004", medical_director_id: "md-tbd", response_time_target_seconds: 100 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "ZA", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { za: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "ZB", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zb: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "ZC", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zc: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${za}", location_label: "LA", centroid_x_m: 10.0, centroid_y_m: 0.0 }
              as: ProgramManager
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zb}", location_label: "LB", centroid_x_m: 10.0, centroid_y_m: 0.0 }
              as: ProgramManager
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zc}", location_label: "LC", centroid_x_m: 200.0, centroid_y_m: 0.0 }
              as: ProgramManager
          trigger:
            - call: "GET /api/campuses/${campus_id}/coverage-report"
              payload: {}
              as: ProgramManager
          assert:
            - "coverage-report.coverage_pct == 67 (per-zone-then-sum: 2 covered of 3, 2*100/3 = 66.67, round_half_up → 67)"
            - "per_zone[ZA].covered == 1 (pessimistic 9s <= 100s target)"
            - "per_zone[ZB].covered == 1"
            - "per_zone[ZC].covered == 0 (pessimistic 173s > 100s target)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: case_review_cyclic_draft_submit_reopen
        grounds:
          - state_machines.CaseReview
          - state_machines.CaseReview.transitions.DRAFT_to_SUBMITTED
          - state_machines.CaseReview.transitions.SUBMITTED_to_DRAFT
        distinguishing_aspect: |
          CaseReview has a CYCLE: DRAFT → SUBMITTED → DRAFT (reopen), allowing
          iterative revision before ACCEPTED. The cycle is on CaseReview (not
          EmergencyEvent, not Device).
        test_recipe:
          setup:
            - "Device commissioned IN_SERVICE; cabinet opened creating EmergencyEvent; responder acknowledged; event RESOLVED with hospital handoff; case review created (DRAFT) and submitted."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M5", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C5", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-005", medical_director_id: "md-other", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/zones"
              payload: { campus_id: "${campus_id}", zone_code: "Z", floor_area_sqm: 100, avg_walk_speed_mps: 1.5, requires_elevator: false, elevator_delay_seconds: 0 }
              as: ProgramManager
              captures: { zid: $.data.id }
            - call: "POST /api/cabinets"
              payload: { zone_id: "${zid}", location_label: "L", centroid_x_m: 0.0, centroid_y_m: 0.0 }
              as: ProgramManager
              captures: { cab: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", serial_number: "SN-005" }
              as: ProgramManager
              captures: { dev: $.data.id, dv: $.data.version }
            - call: "POST /api/devices/${dev}/install"
              payload: { cabinet_id: "${cab}", expected_device_version: "${dv}" }
              as: ProgramManager
              captures: { dv1: $.data.version }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", kind: "PAD", lot_code: "P5", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { pl: $.data.id }
            - call: "POST /api/consumable-lots"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", kind: "BATTERY", lot_code: "B5", manufacturer_expires_at: "2030-01-01T00:00:00Z", quantity_received: 5 }
              as: ProgramManager
              captures: { bl: $.data.id }
            - call: "POST /api/installs"
              payload: { device_id: "${dev}", consumable_lot_id: "${pl }", expected_device_version: "${dv1}" }
              as: ProgramManager
            - call: "GET /api/devices/${dev}"
              payload: {}
              as: ProgramManager
              captures: { dv2: $.data.version }
            - call: "POST /api/installs"
              payload: { device_id: "${dev}", consumable_lot_id: "${bl }", expected_device_version: "${dv2}" }
              as: ProgramManager
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "MD Reviewer", badge_number: "MD-1", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md1: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "MD Acceptor", badge_number: "MD-2", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md2: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "R One", badge_number: "R-1", responder_role: "LAY_RESPONDER" }
              as: ProgramManager
              captures: { resp: $.data.id }
            - call: "POST /api/training-sessions"
              payload: { campus_id: "${campus_id}", instructor_id: "${md1 }", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z", capacity: 5, certification_months_granted: 24 }
              as: ProgramManager
              captures: { ts: $.data.id }
            - call: "POST /api/training-sessions/${ts}/enroll"
              payload: { responder_id: "${resp}" }
              as: ProgramManager
            - call: "POST /api/training-sessions/${ts}/complete"
              payload: { attendee_ids: ["${resp}"] }
              as: ProgramManager
            - call: "POST /api/devices/${dev}/commission"
              payload: {}
              as: ProgramManager
            - call: "POST /api/cabinets/${cab}/open"
              payload: {}
              as: Anonymous
              captures: { ev: $.data.id }
            - call: "POST /api/emergency-events/${ev}/acknowledge"
              payload: {}
              as: Responder
              as_user_id: "${resp}"
            - call: "POST /api/emergency-events/${ev}/resolve"
              payload: { hospital_code: "H-1", patient_transported: true, pads_consumed: true }
              as: Responder
              as_user_id: "${resp}"
            - call: "POST /api/case-reviews"
              payload: { emergency_event_id: "${ev}", reviewer_id: "${md1 }", hospital_reviewer_name: "Dr X", device_data_retrieved: true, outcome_code: "SURVIVED_TO_DISCHARGE", notes: "n" }
              as: MedicalDirector
              as_user_id: "${md1}"
              captures: { cr: $.data.id }
            - call: "POST /api/case-reviews/${cr}/submit"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md1}"
          trigger:
            - call: "POST /api/case-reviews/${cr}/reopen"
              payload: {}
              as: MedicalDirector
              as_user_id: "${md2}"
          assert:
            - "CaseReview.${cr}.status == DRAFT (cycled back from SUBMITTED)"
            - "CaseReview.${cr} can be re-submitted (loop count not bounded)"

      - name: device_compound_posture_driven_by_children
        grounds:
          - state_machines.Device
          - entities.Device.fields.readiness_posture
          - calculations.readiness_posture
        distinguishing_aspect: |
          Device.readiness_posture is a COMPOUND/PARALLEL state dimension: it is
          derived from independent child state machines (Install ACTIVE/EXPIRED,
          Inspection SCHEDULED/PASS/FAIL/OVERDUE, SelfTestReport PASS/FAIL), each
          evolving on its own entity. The posture gates commission and
          return_to_service transitions.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01. Device REGISTERED but never installed. No installs, no inspection."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M6", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C6", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-006", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", serial_number: "SN-006" }
              as: ProgramManager
              captures: { dev: $.data.id }
          trigger:
            - call: "GET /api/devices/${dev}"
              payload: {}
              as: ProgramManager
          assert:
            - "Device.${dev}.readiness_posture == OUT_OF_SERVICE (no pad install → forced OUT_OF_SERVICE regardless of other inputs)"
            - "Device.${dev}.status == REGISTERED (compound posture does not change primary status)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cabinet_open_cascade_five_hop
        grounds:
          - state_machines.Cabinet.transitions.OCCUPIED_to_ALARM_OPEN
          - state_machines.Device.transitions.IN_SERVICE_to_POST_EVENT
          - state_machines.Install.transitions.ACTIVE_to_CONSUMED_IN_EVENT
          - state_machines.EmergencyEvent.transitions.OPEN_to_RESPONDING
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_RESOLVED
          - state_machines.ReplenishmentOrder
        distinguishing_aspect: |
          Depth >= 4 cascade originating from cabinet open: cabinet.open →
          Cabinet.ALARM_OPEN → Device.POST_EVENT → EmergencyEvent created →
          (on resolve) Install.CONSUMED_IN_EVENT → ReplenishmentOrder auto-created.
          Each link is caused by the previous link's mutation, not the original
          cabinet open.
