# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds only in elements declared by SCAFFOLD.yaml §1.1-§1.7.
# All numeric assert literals were computed by executing the §1.3 formulas
# (.scratch/step2/verify18.py) against the pinned setup inputs.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: area_stats_diverge_between_systematic_and_adverse_variants
        grounds:
          - calculations.area_water_quality_statistics
          - calculations.area_eligible_classification
          - entities.GrowingArea.fields.geometric_mean_mpn
          - entities.GrowingArea.fields.p90_mpn
          - entities.GrowingArea.fields.eligible_classification
          - entities.WaterSample.fields.is_adverse_condition
          - entities.RainfallEvent.fields.triggered_closure
        distinguishing_aspect: |
          The two variants differ by WINDOW MEMBERSHIP over identical stored rows: SYSTEMATIC_RANDOM
          admits all 15 ACCEPTED samples (geometric_mean_mpn 8.8, eligible RESTRICTED) while
          ADVERSE_CONDITION admits only the 5 samples flagged is_adverse_condition (geometric_mean_mpn
          114.1, eligible PROHIBITED), and only the SYSTEMATIC_RANDOM result is persisted on GrowingArea.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One GrowingArea GA-114 with classification APPROVED, harvest_status CLOSED_RAINFALL, rainfall_closure_threshold_in 1.00, rainfall_closure_hours 96."
            - "Ten ACCEPTED WaterSamples with is_adverse_condition false (fecal_coliform_mpn 2,2,2,2,2,3,3,3,3,3 on 2026-07-01..2026-07-10)."
            - "One RainfallEvent of 1.50 inches observed 2026-07-20T00:00:00Z with triggered_closure true."
            - "Five ACCEPTED WaterSamples collected inside the 120-hour adverse window after that event (fecal_coliform_mpn 160,120,90,140,80), all with is_adverse_condition true."
            - "GrowingArea.accepted_sample_count == 15; the sample sweep never fired because the running SYSTEMATIC_RANDOM geometric mean peaks at 8.8, below GEOMEAN_APPROVED_LIMIT 14.0."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.00, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-06T09:00:00Z", fecal_coliform_mpn: 3, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-07T09:00:00Z", fecal_coliform_mpn: 3, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-08T09:00:00Z", fecal_coliform_mpn: 3, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-09T09:00:00Z", fecal_coliform_mpn: 3, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-10T09:00:00Z", fecal_coliform_mpn: 3, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/rainfall-events"
              payload: { gauge_code: "RG-7", observed_at: "2026-07-20T00:00:00Z", inches_24h: 1.50 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-20T06:00:00Z", fecal_coliform_mpn: 160, water_temp_c: 25.0, salinity_ppt: 28.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-21T06:00:00Z", fecal_coliform_mpn: 120, water_temp_c: 25.0, salinity_ppt: 28.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-22T06:00:00Z", fecal_coliform_mpn: 90, water_temp_c: 25.0, salinity_ppt: 28.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-23T06:00:00Z", fecal_coliform_mpn: 140, water_temp_c: 25.0, salinity_ppt: 28.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-24T06:00:00Z", fecal_coliform_mpn: 80, water_temp_c: 25.0, salinity_ppt: 28.0 }
              as: ShellfishControlAuthority
          trigger:
            - call: "GET /shellfish/growing-areas/${area}/classification-summary"
              payload: { variant: "SYSTEMATIC_RANDOM" }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}/classification-summary"
              payload: { variant: "ADVERSE_CONDITION" }
              as: ShellfishControlAuthority
          assert:
            - "The SYSTEMATIC_RANDOM response has sample_count == 15, mean_log10 == 0.9451, geometric_mean_mpn == 8.8, p90_mpn == 98.8, eligible_classification == RESTRICTED"
            - "The ADVERSE_CONDITION response has sample_count == 5, mean_log10 == 2.0573, geometric_mean_mpn == 114.1, p90_mpn == 165.8, eligible_classification == PROHIBITED"
            - "The two variants diverge over identical stored rows: 114.1 - 8.8 == 105.3 on geometric_mean_mpn and RESTRICTED vs PROHIBITED on eligible_classification"
            - "GrowingArea.${area}.geometric_mean_mpn == 8.8 and GrowingArea.${area}.p90_mpn == 98.8 (only the SYSTEMATIC_RANDOM variant is persisted)"
            - "GrowingArea.${area}.eligible_classification == RESTRICTED"
            - "GrowingArea.${area}.accepted_sample_count == 15"
            - "GrowingArea.${area}.classification == APPROVED (the ADVERSE_CONDITION variant never drives the sample sweep)"
            - "GrowingArea.${area}.harvest_status == CLOSED_RAINFALL"

      - name: ttt_minutes_diverge_between_first_and_last_out_of_water_basis
        grounds:
          - calculations.harvest_lot_time_to_temperature
          - calculations.vibrio_allowed_time_to_temperature_minutes
          - entities.HarvestLot.fields.ttt_minutes_first_basis
          - entities.HarvestLot.fields.ttt_minutes_last_basis
          - entities.HarvestLot.fields.ttt_basis_variant
          - entities.HarvestLot.fields.governing_ttt_minutes
          - state_machines.GrowingArea.APPROVED_to_CONDITIONALLY_APPROVED
        distinguishing_aspect: |
          The variant selector is a DIFFERENT ENTITY's state field (GrowingArea.classification ==
          CONDITIONALLY_APPROVED) rather than a request parameter, and both basis values are persisted
          side by side on the same HarvestLot: ttt_minutes_first_basis 280 would be NONCOMPLIANT against
          allowed_ttt_minutes 270 while the selected ttt_minutes_last_basis 160 is COMPLIANT.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-10T11:00:00Z by the end of setup."
            - "GrowingArea GA-114 with conditional_management_plan_on_file true, five ACCEPTED samples of fecal_coliform_mpn 2 (eligible_classification APPROVED, accepted_sample_count 5), classification administratively moved to CONDITIONALLY_APPROVED, harvest_status OPEN."
            - "ACTIVE VibrioControlPlan for season_month 8 with max_time_to_temperature_minutes 300, high_water_temp_c 23.0, high_temp_reduction_minutes 60."
            - "APPROVED Lease held by op-1 with plots P1..P3, gear BOTTOM and RACK_AND_BAG, authorized_gear_units 200, rent_paid_through_date 2026-12-31."
            - "SeedLot READY_FOR_PLANTING with 60000 surviving seed; GrowoutUnit on plot P1 with gear_type BOTTOM, current INSPECTION and PREDATOR_CONTROL logs."
            - "HarvestVessel with refrigeration_type MECHANICAL; HarvestAuthorization ACTIVE for window 2026-08-10T06:00:00Z..2026-08-10T18:00:00Z."
            - "LISTED SeafoodDealer with certification_category SHELLSTOCK_SHIPPER and certification_no NC-1234-SS."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.00, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: true }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-01T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-02T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-03T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-04T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v: $.data.version }
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "CONDITIONALLY_APPROVED", expected_area_version: "${area_v}", decision_note: "conditional management plan in force" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/vibrio-control-plans"
              payload: { season_month: 8, max_time_to_temperature_minutes: 300, high_water_temp_c: 23.0, high_temp_reduction_minutes: 60 }
              as: ShellfishControlAuthority
              captures: { plan: $.data.id }
            - call: "POST /shellfish/hatcheries"
              payload: { name: "Sound Hatchery", state_code: "NC", ncsp_certificate_no: "NCSP-77", certificate_expires_on: "2027-03-31", pathogen_free_species: ["CRASSOSTREA_VIRGINICA"] }
              as: ShellfishControlAuthority
              captures: { hatchery: $.data.id }
            - call: "POST /shellfish/dealers"
              payload: { name: "Coastal Shellstock", state_code: "NC", certification_category: "SHELLSTOCK_SHIPPER", certification_no: "NC-1234-SS", certified_through: "2027-06-30" }
              as: ShellfishControlAuthority
              captures: { dealer: $.data.id, dealer_v: $.data.version }
            - call: "POST /shellfish/dealers/${dealer}/certification-renewals"
              payload: { expected_dealer_version: "${dealer_v}", certified_through: "2027-06-30", icssl_listed_through: "2027-06-30" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/harvest-vessels"
              payload: { name: "Miss Pamlico", registration_no: "NC-4410", refrigeration_type: "MECHANICAL", concurrent_authorization_capacity: 2 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { vessel: $.data.id }
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "CLEARED", review_note: "outside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/environmental-review"
              payload: { decision: "CLEARED", review_note: "no SAV impact" }
              as: SitingReviewer
              as_user_id: "rev-env-1"
            - call: "POST /shellfish/leases/${lease}/decision"
              payload: { decision: "APPROVE", rent_paid_through_date: "2026-12-31", decision_note: "granted" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots"
              payload: { hatchery_id: "${hatchery}", lease_id: "${lease}", species: "CRASSOSTREA_VIRGINICA", received_seed_count: 100000, disease_certificate_no: "DC-9001", disease_cert_issued_on: "2026-03-15", shipped_on: "2026-04-01" }
              as: HatcheryOperator
              as_user_id: "${hatchery}"
              captures: { seed: $.data.id }
            - call: "POST /shellfish/seed-lots/${seed}/screening"
              payload: { result: "NEGATIVE", screened_on: "2026-04-03" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/seed-lots/${seed}/nursery-start"
              payload: { nursery_started_on: "2026-04-05", nursery_system: "UPWELLER" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/seed-lots/${seed}/nursery-complete"
              payload: { nursery_completed_on: "2026-05-01", surviving_seed_count: 60000 }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/growout-units"
              payload: { lease_id: "${lease}", seed_lot_id: "${seed}", plot_code: "P1", gear_type: "BOTTOM", gear_units: 40, seed_count_planted: 25000, deployed_on: "2026-05-05", planned_retrieval_on: "2026-10-15" }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { unit: $.data.id }
            - call: "POST /shellfish/growout-units/${unit}/husbandry-logs"
              payload: { log_type: "INSPECTION", performed_at: "2026-07-20T12:00:00Z", mortality_count: 0, notes: "routine" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/growout-units/${unit}/husbandry-logs"
              payload: { log_type: "PREDATOR_CONTROL", performed_at: "2026-07-20T13:00:00Z", predator_species: "OYSTER_DRILL", control_method: "NETTING", mortality_count: 0 }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/harvest-authorizations"
              payload: { lease_id: "${lease}", growout_unit_id: "${unit}", vessel_id: "${vessel}", dealer_id: "${dealer}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T18:00:00Z", projected_bushels: 600 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { auth: $.data.id }
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/harvest-authorizations/${auth}/activate"
              payload: {}
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T11:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/harvest-authorizations/${auth}/harvest-lots"
              payload: { lot_code: "LOT-001", bushels: 10, first_out_of_water_at: "2026-08-10T06:00:00Z", last_out_of_water_at: "2026-08-10T08:00:00Z", placed_in_temperature_control_at: "2026-08-10T10:40:00Z", water_temp_c: 24.0 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
          assert:
            - "HarvestLot.${lot}.ttt_minutes_first_basis == 280"
            - "HarvestLot.${lot}.ttt_minutes_last_basis == 160"
            - "HarvestLot.${lot}.ttt_basis_variant == LAST_HARVEST_BASIS"
            - "HarvestLot.${lot}.governing_ttt_minutes == 160"
            - "HarvestLot.${lot}.allowed_ttt_minutes == 270"
            - "HarvestLot.${lot}.compliance_status == COMPLIANT"
            - "The two bases diverge by 280 - 160 == 120 minutes, and the selected basis flips the verdict: 280 > 270 would be NONCOMPLIANT while 160 <= 270 is COMPLIANT"
            - "HarvestLot.${lot}.vibrio_control_plan_id == ${plan} and HarvestLot.${lot}.vibrio_plan_month == 8"
            - "GrowingArea.${area}.classification == CONDITIONALLY_APPROVED (the variant selector lives on GrowingArea, not in the landing payload)"
  - rule_id: combinatorial_formula
    instances:

      - name: surcharge_rounds_per_lot_before_accrual_sum
        grounds:
          - calculations.lease_harvest_settlement
          - entities.HarvestLot.fields.conservation_surcharge_cents
          - entities.HarvestLot.fields.lot_settlement_cents
          - entities.Lease.fields.royalty_accrued_cents
        distinguishing_aspect: |
          This instance pins MULTI-STEP ROUNDING ORDER: SURCHARGE_RATE 0.03 is applied and rounded
          HALF_UP once per lot (110 cents on a 3650-cent base) before the lot total enters
          Lease.royalty_accrued_cents, so two identical 10-bushel lots accrue 7520 cents; rounding a
          summed base once (0.03 * 7300 -> 219) would yield 7519 and is therefore falsified by 1 cent.
        test_recipe:
          setup:
            - "Full production chain from empty DB: GrowingArea GA-114 APPROVED and OPEN, ACTIVE VibrioControlPlan for month 8, LISTED dealer NC-1234-SS, MECHANICAL vessel, APPROVED lease held by op-1 with rent_paid_through_date 2026-12-31, SeedLot READY_FOR_PLANTING, GrowoutUnit on P1 with current husbandry, HarvestAuthorization ACTIVE with projected_bushels 600."
            - "One HarvestLot LOT-001 of 10 bushels already landed: royalty_rate_cents_per_bushel 115, royalty_cents 1150, inspection_fee_cents 2500, conservation_surcharge_cents 110, lot_settlement_cents 3760."
            - "Lease.royalty_accrued_cents == 3760 before the trigger; logical clock 2026-08-10T11:00:00Z."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/vibrio-control-plans"
              payload: { season_month: 8, max_time_to_temperature_minutes: 300, high_water_temp_c: 23.0, high_temp_reduction_minutes: 60 }
              as: ShellfishControlAuthority
              captures: { plan: $.data.id }
            - call: "POST /shellfish/hatcheries"
              payload: { name: "Sound Hatchery", state_code: "NC", ncsp_certificate_no: "NCSP-77", certificate_expires_on: "2027-03-31", pathogen_free_species: ["CRASSOSTREA_VIRGINICA"] }
              as: ShellfishControlAuthority
              captures: { hatchery: $.data.id }
            - call: "POST /shellfish/dealers"
              payload: { name: "Coastal Shellstock", state_code: "NC", certification_category: "SHELLSTOCK_SHIPPER", certification_no: "NC-1234-SS", certified_through: "2027-06-30" }
              as: ShellfishControlAuthority
              captures: { dealer: $.data.id, dealer_v: $.data.version }
            - call: "POST /shellfish/dealers/${dealer}/certification-renewals"
              payload: { expected_dealer_version: "${dealer_v}", certified_through: "2027-06-30", icssl_listed_through: "2027-06-30" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/harvest-vessels"
              payload: { name: "Miss Pamlico", registration_no: "NC-4410", refrigeration_type: "MECHANICAL", concurrent_authorization_capacity: 2 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { vessel: $.data.id }
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "CLEARED", review_note: "outside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/environmental-review"
              payload: { decision: "CLEARED", review_note: "no SAV impact" }
              as: SitingReviewer
