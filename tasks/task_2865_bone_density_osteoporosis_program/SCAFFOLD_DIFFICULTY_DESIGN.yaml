  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_creation_blocked_by_cross_cal_pending_device_returns_409
        grounds:
          - validations[priority=21]
          - errors[ERR_DENSITOMETER_NOT_ACTIVE]
          - state_machines.Densitometer.ACTIVE_to_CROSS_CAL_PENDING
          - endpoints["POST /bone-density/scan-appointments/{id}/scan-sessions"]
          - entities.ScanAppointment.fields.status
        distinguishing_aspect: |
          Nothing about the ScanAppointment is wrong: it is BOOKED, the clock is inside its window,
          the order is SCHEDULED and the actor is the assigned Technologist. The operation is refused
          purely because a third entity two hops away — the Densitometer named by the appointment —
          entered CROSS_CAL_PENDING after the appointment was booked. Opening the calibration event
          deliberately does NOT cancel booked appointments, so an implementation that only checks the
          appointment's own status, or that only guards against QC_HOLD, lets the scan start on an
          uncalibrated device. The appointment must survive untouched with no ScanSession created.
        test_recipe:
          setup:
            - "One ACTIVE Densitometer with lsc_g_cm2 certified, and a BOOKED appointment for 2026-03-10T09:00:00Z on it."
            - "A DETECTOR calibration event is then opened on that densitometer, moving it ACTIVE -> CROSS_CAL_PENDING while the appointment stays BOOKED."
            - "The clock is advanced to 2026-03-10T09:05:00Z, inside the appointment window."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
