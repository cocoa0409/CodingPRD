scenario: |
  Textile Mill & Yarn Production (Carolina textile mill): fiber lot & blend
  recipe, spinning/knitting machine assignment & count change, dye lot & shade
  band matching, shrinkage/hand test & second-quality grading, greige inventory
  vs finished allocation, customer color approval & lab dip, roll goods put-up
  & yardage tolerance, seconds/close-out channel.

domain_name: textile-mill-yarn-production
api_prefix: /mill

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FiberLot
    parent: null
    common_fields: true
    fields:
      - name: fiber_type
        type: enum
        source: input
        description: "Cotton or synthetic family; constrains blend compatibility."
        constraints: "Enum: COTTON | POLYESTER | RAYON | WOOL | NYLON"
      - name: received_weight_lbs
        type: number
        source: input
        description: "Gross received weight at the dock, in pounds."
        constraints: "Must be > 0; precision 0.01 lb"
      - name: available_weight_lbs
        type: number
        source: computed
        description: "Received weight minus weight consumed into BlendRecipes. Maintained by blend_consumption calculation."
        constraints: "0 <= available_weight_lbs <= received_weight_lbs"
      - name: unit_cost_per_lb
        type: number
        source: input
        description: "Fibre purchase cost per pound; used by blend cost calculations."
        constraints: "Must be >= 0; precision 0.0001 USD"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the fiber lot."
        default: RECEIVED
        constraints: "Enum: RECEIVED | BLENDED | EXHAUSTED"

  - name: BlendRecipe
    parent: null
    common_fields: true
    fields:
      - name: recipe_code
        type: string
        source: input
        description: "Human-readable unique code, e.g. 'CTN-POLY-60-40'."
        constraints: "Unique across non-superseded recipes"
      - name: target_yarn_count_ne
        type: number
        source: input
        description: "Target English cotton count (Ne) of the produced yarn."
        constraints: "Must be > 0"
      - name: status
        type: enum
        source: system
        description: "Approval workflow state."
        default: DRAFT
        constraints: "Enum: DRAFT | APPROVED | REJECTED | SUPERSEDED"
      - name: total_component_weight_lbs
        type: number
        source: computed
        description: "Sum of component weights across BlendComponents. Derived on every component add/remove."
      - name: projected_cost_per_lb
        type: number
        source: computed
        description: "Forward-looking cost estimate at approval time. Computed by blend_cost_estimate calculation (forward_looking variant)."
      - name: approved_at
        type: datetime
        source: system
        description: "Timestamp at which the recipe transitioned to APPROVED; null until approved."

  - name: BlendComponent
    parent: BlendRecipe
    common_fields: false
    fields:
      - name: recipe_id
        type: string
        source: input
        description: "FK -> BlendRecipe.id; owning recipe."
      - name: fiber_lot_id
        type: string
        source: input
        description: "FK -> FiberLot.id; lot contributing fiber."
      - name: component_weight_lbs
        type: number
        source: input
        description: "Weight of this fiber lot committed to the recipe."
        constraints: "Must be > 0"
      - name: proportion_pct
        type: number
        source: computed
        description: "component_weight_lbs / recipe.total_component_weight_lbs * 100; recomputed on every change."

  - name: SpinningMachine
    parent: null
    common_fields: true
    fields:
      - name: machine_code
        type: string
        source: input
        description: "Unique identifier on the floor, e.g. 'SPIN-07'."
        constraints: "Unique"
      - name: supported_count_min_ne
        type: number
        source: input
        description: "Minimum yarn count (Ne) the machine can spin."
        constraints: "Must be > 0 and < supported_count_max_ne"
      - name: supported_count_max_ne
        type: number
        source: input
        description: "Maximum yarn count (Ne) the machine can spin."
        constraints: "Must be > supported_count_min_ne"
      - name: status
        type: enum
        source: system
        description: "Machine availability."
        default: ACTIVE
        constraints: "Enum: ACTIVE | DOWN | DECOMMISSIONED"

  - name: YarnLot
    parent: null
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: input
        description: "FK -> BlendRecipe.id; recipe the yarn was spun from. Recipe must be APPROVED."
      - name: spun_weight_lbs
        type: number
        source: input
        description: "Actual weight of yarn produced in this lot."
        constraints: "Must be > 0"
      - name: actual_yarn_count_ne
        type: number
        source: input
        description: "Actual measured English count of the spun yarn."
        constraints: "Must be > 0"
      - name: greige_yards_available
        type: number
        source: computed
        description: "Yards of greige yarn not yet committed into DyeLots. Maintained by greige_allocation calculation."
      - name: actual_cost_per_lb
        type: number
        source: computed
        description: "Chronological actual cost derived from the FiberLots consumed at spin time. Computed by blend_cost_estimate (chronological variant)."
      - name: status
        type: enum
        source: system
        description: "Production lifecycle."
        default: GREIGE
        constraints: "Enum: GREIGE | DYEING | FINISHED | ALLOCATED | REJECTED"

  - name: MachineAssignment
    parent: SpinningMachine
    common_fields: true
    fields:
      - name: machine_id
        type: string
        source: input
        description: "FK -> SpinningMachine.id; the machine being scheduled."
      - name: yarn_lot_id
        type: string
        source: input
        description: "FK -> YarnLot.id; the lot being spun."
      - name: window_start
        type: datetime
        source: input
        description: "Start of the production window (inclusive)."
      - name: window_end
        type: datetime
        source: input
        description: "End of the production window (exclusive)."
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle."
        default: SCHEDULED
        constraints: "Enum: SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"

  - name: DyeLot
    parent: null
    common_fields: true
    fields:
      - name: yarn_lot_id
        type: string
        source: input
        description: "FK -> YarnLot.id; the greige lot submitted for dyeing."
      - name: shade_band_id
        type: string
        source: input
        description: "FK -> ShadeBand.id; the target customer-approved shade tolerance band."
      - name: vat_id
        type: string
        source: input
        description: "Identifier of the dye vat used. Combined with scheduled_at to enforce buffer between batches."
      - name: scheduled_at
        type: datetime
        source: input
        description: "Instant this dye lot enters the vat."
      - name: requested_yards
        type: number
        source: input
        description: "Yards of greige yarn submitted."
        constraints: "Must be > 0"
      - name: status
        type: enum
        source: system
        description: "Dye workflow."
        default: SUBMITTED
        constraints: "Enum: SUBMITTED | DYEING | SHADE_PENDING | APPROVED | REJECTED"
      - name: measured_delta_e
        type: number
        source: system
        description: "Color difference from shade band centroid, set when quality test records it."

  - name: ShadeBand
    parent: null
    common_fields: true
    fields:
      - name: customer_code
        type: string
        source: input
        description: "External customer identifier."
      - name: color_code
        type: string
        source: input
        description: "Mill's internal color code, e.g. 'NAVY-2B'."
      - name: centroid_l
        type: number
        source: input
        description: "CIELAB L* centroid of the approved color."
      - name: centroid_a
        type: number
        source: input
        description: "CIELAB a* centroid."
      - name: centroid_b
        type: number
        source: input
        description: "CIELAB b* centroid."
      - name: delta_e_tolerance
        type: number
        source: input
        description: "Maximum acceptable ΔE*ab from the centroid for first-quality."
        constraints: "Must be > 0"
      - name: status
        type: enum
        source: system
        description: "Approval state of the band."
        default: ACTIVE
        constraints: "Enum: ACTIVE | ARCHIVED"

  - name: LabDip
    parent: ShadeBand
    common_fields: true
    fields:
      - name: shade_band_id
        type: string
        source: input
        description: "FK -> ShadeBand.id; the band this dip is targeted at."
      - name: submitted_by_operator_id
        type: string
        source: input
        description: "X-User-ID of the DyeHouseOperator submitting the dip."
      - name: measured_delta_e
        type: number
        source: input
        description: "Measured ΔE*ab of the dip versus the band centroid."
        constraints: "Must be >= 0"
      - name: status
        type: enum
        source: system
        description: "Customer decision on the dip."
        default: PENDING
        constraints: "Enum: PENDING | APPROVED | REJECTED"

  - name: QualityTest
    parent: DyeLot
    common_fields: true
    fields:
      - name: dye_lot_id
        type: string
        source: input
        description: "FK -> DyeLot.id; the lot under test."
      - name: shrinkage_pct_provisional
        type: number
        source: input
        description: "Oven-dry estimate of shrinkage percent, taken within 4 hours of dyeing."
        constraints: "0 <= value <= 100"
      - name: shrinkage_pct_final
        type: number
        source: input
        description: "Conditioned-atmosphere final shrinkage percent, taken 24 hours later. Null until conditioning complete."
        constraints: "0 <= value <= 100; may be null"
      - name: hand_score
        type: integer
        source: input
        description: "Subjective hand feel score on a 1–5 scale."
        constraints: "1 <= hand_score <= 5"
      - name: grade
        type: enum
        source: computed
        description: "FIRST_QUALITY | SECOND_QUALITY | REJECTED — derived by quality_grading calculation."
        constraints: "Enum: FIRST_QUALITY | SECOND_QUALITY | REJECTED"

  - name: FinishedRoll
    parent: DyeLot
    common_fields: true
    fields:
      - name: dye_lot_id
        type: string
        source: input
        description: "FK -> DyeLot.id; the dye lot this roll was cut from."
      - name: put_up_yards
        type: number
        source: input
        description: "Declared yards wound onto this roll at put-up time."
        constraints: "Must be > 0"
      - name: actual_yards
        type: number
        source: input
        description: "Physically measured yards on the roll after inspection."
        constraints: "Must be > 0"
      - name: yardage_deviation_pct
        type: number
        source: computed
        description: "(actual_yards - put_up_yards) / put_up_yards * 100; computed at roll creation."
      - name: is_second_quality
        type: boolean
        source: computed
        description: "True when parent DyeLot's QualityTest graded SECOND_QUALITY; roll is routed to close-out."
      - name: allocated_order_id
        type: string
        source: system
        description: "FK -> CustomerOrder.id; the order this roll is allocated to, null until allocated."
      - name: status
        type: enum
        source: system
        description: "Roll disposition."
        default: AVAILABLE
        constraints: "Enum: AVAILABLE | ALLOCATED | SHIPPED | CLOSE_OUT"

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_code
        type: string
        source: input
        description: "External customer identifier."
      - name: color_code
        type: string
        source: input
        description: "Color being ordered; matched against ShadeBand.color_code."
      - name: requested_yards
        type: number
        source: input
        description: "Total yards the customer ordered."
        constraints: "Must be > 0"
      - name: allocated_yards
        type: number
        source: computed
        description: "Sum of actual_yards of rolls currently ALLOCATED to this order. Maintained by roll_allocation calculation."
      - name: yardage_tolerance_pct
        type: number
        source: input
        description: "Acceptable over/under-ship tolerance (default ±2%)."
        default: 2.0
        constraints: "0 <= value <= 10"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle."
        default: OPEN
        constraints: "Enum: OPEN | PARTIALLY_ALLOCATED | FULLY_ALLOCATED | SHIPPED | CANCELLED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FiberLot
    initial_state: RECEIVED
    terminal_states: [EXHAUSTED]
    transitions:
      - from: RECEIVED
        to: BLENDED
        trigger: "POST /mill/blend-recipes (creating a recipe that consumes this lot)"
        actor: MillPlanner
        preconditions:
          - "FiberLot.status == RECEIVED"
          - "FiberLot.available_weight_lbs >= sum(component_weight_lbs) across the recipe's components from this lot"
        side_effects:
          - "FiberLot.available_weight_lbs decreases by component_weight_lbs consumed"
          - "FiberLot.updated_at refreshed"
      - from: BLENDED
        to: EXHAUSTED
        trigger: "system auto-transition when available_weight_lbs reaches 0"
        actor: system
        preconditions:
          - "FiberLot.available_weight_lbs == 0"
        side_effects:
          - "No further BlendComponents may reference this lot"

  - entity: BlendRecipe
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /mill/blend-recipes/{id}/approve"
        actor: MillPlanner
        preconditions:
          - "BlendRecipe.status == DRAFT"
          - "BlendRecipe has at least one BlendComponent"
          - "Every referenced FiberLot has status in {RECEIVED, BLENDED}"
          - "expected_recipe_version matches current version (OCC)"
        side_effects:
          - "BlendRecipe.approved_at = now"
          - "BlendRecipe.projected_cost_per_lb computed via blend_cost_estimate (forward_looking variant)"
          - "Each referenced FiberLot.status transitions RECEIVED → BLENDED (if still RECEIVED)"
          - "Each referenced FiberLot.available_weight_lbs debited by component weight"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /mill/blend-recipes/{id}/reject"
        actor: MillPlanner
        preconditions:
          - "BlendRecipe.status == DRAFT"
        side_effects:
          - "All BlendComponents detached (deleted)"
          - "No FiberLot weight changes"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /mill/blend-recipes (creating a new recipe with same recipe_code)"
        actor: MillPlanner
        preconditions:
          - "Existing recipe with same recipe_code is APPROVED"
        side_effects:
          - "Old recipe becomes SUPERSEDED"
          - "YarnLots already spun from old recipe are unaffected"

  - entity: YarnLot
    initial_state: GREIGE
    terminal_states: [ALLOCATED, REJECTED]
    transitions:
      - from: GREIGE
        to: DYEING
        trigger: "POST /mill/dye-lots (submitting this lot for dyeing)"
        actor: DyeHouseOperator
        preconditions:
          - "YarnLot.status == GREIGE"
          - "YarnLot.greige_yards_available >= dye_lot.requested_yards"
          - "BlendRecipe referenced by YarnLot has status == APPROVED"
        side_effects:
          - "YarnLot.greige_yards_available debited by requested_yards"
          - "DyeLot created in SUBMITTED status"
      - from: DYEING
        to: GREIGE
        trigger: "POST /mill/dye-lots/{id}/reject (rework loop)"
        actor: QualityInspector
        preconditions:
          - "DyeLot.status == REJECTED"
          - "QualityTest.grade == REJECTED"
        side_effects:
          - "YarnLot.greige_yards_available credited back by DyeLot.requested_yards"
          - "YarnLot may be resubmitted in a new DyeLot"
      - from: DYEING
        to: FINISHED
        trigger: "POST /mill/dye-lots/{id}/approve"
        actor: QualityInspector
        preconditions:
          - "DyeLot.status == SHADE_PENDING"
          - "QualityTest exists with grade == FIRST_QUALITY or SECOND_QUALITY"
        side_effects:
          - "FinishedRoll creation becomes permitted for this DyeLot"
      - from: FINISHED
        to: ALLOCATED
        trigger: "system auto-transition when all FinishedRolls are ALLOCATED or SHIPPED"
        actor: system
        preconditions:
          - "Every FinishedRoll of every DyeLot of this YarnLot is in {ALLOCATED, SHIPPED, CLOSE_OUT}"
        side_effects: []
      - from: GREIGE
        to: REJECTED
        trigger: "POST /mill/yarn-lots/{id}/reject"
        actor: QualityInspector
        preconditions:
          - "YarnLot.status == GREIGE"
        side_effects:
          - "YarnLot.greige_yards_available zeroed"

  - entity: MachineAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /mill/machine-assignments/{id}/start"
        actor: SpinningSupervisor
        preconditions:
          - "MachineAssignment.status == SCHEDULED"
          - "SpinningMachine.status == ACTIVE"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /mill/machine-assignments/{id}/complete"
        actor: SpinningSupervisor
        preconditions:
          - "MachineAssignment.status == IN_PROGRESS"
        side_effects:
          - "YarnLot.actual_cost_per_lb computed via blend_cost_estimate (chronological variant)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mill/machine-assignments/{id}/cancel"
        actor: SpinningSupervisor
        preconditions:
          - "MachineAssignment.status == SCHEDULED"
        side_effects: []

  - entity: DyeLot
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: DYEING
        trigger: "POST /mill/dye-lots/{id}/start"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status == SUBMITTED"
          - "YarnLot.status == DYEING"
        side_effects: []
      - from: DYEING
        to: SHADE_PENDING
        trigger: "POST /mill/dye-lots/{id}/submit-shade"
        actor: DyeHouseOperator
        preconditions:
          - "DyeLot.status == DYEING"
          - "At least one QualityTest exists for this DyeLot"
        side_effects:
          - "DyeLot.measured_delta_e populated from latest QualityTest"
      - from: SHADE_PENDING
        to: APPROVED
        trigger: "POST /mill/dye-lots/{id}/approve"
        actor: QualityInspector
        preconditions:
          - "DyeLot.status == SHADE_PENDING"
          - "QualityTest.grade in {FIRST_QUALITY, SECOND_QUALITY}"
        side_effects:
          - "YarnLot transitions DYEING → FINISHED"
          - "YarnLot.version incremented (cascade)"
      - from: SHADE_PENDING
        to: REJECTED
        trigger: "POST /mill/dye-lots/{id}/reject"
        actor: QualityInspector
        preconditions:
          - "DyeLot.status == SHADE_PENDING"
        side_effects:
          - "YarnLot transitions DYEING → GREIGE (rework loop)"
          - "YarnLot.greige_yards_available credited back by DyeLot.requested_yards"

  - entity: LabDip
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /mill/lab-dips/{id}/approve"
        actor: CustomerServiceRep
        preconditions:
          - "LabDip.status == PENDING"
          - "LabDip.measured_delta_e <= ShadeBand.delta_e_tolerance"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /mill/lab-dips/{id}/reject"
        actor: CustomerServiceRep
        preconditions:
          - "LabDip.status == PENDING"
        side_effects: []

  - entity: FinishedRoll
    initial_state: AVAILABLE
    terminal_states: [SHIPPED, CLOSE_OUT]
    transitions:
      - from: AVAILABLE
        to: ALLOCATED
        trigger: "POST /mill/customer-orders/{id}/allocate"
        actor: CustomerServiceRep
        preconditions:
          - "FinishedRoll.status == AVAILABLE"
          - "FinishedRoll.is_second_quality == false (first-quality only for normal orders)"
          - "CustomerOrder.status in {OPEN, PARTIALLY_ALLOCATED}"
          - "FinishedRoll's DyeLot's ShadeBand.color_code == CustomerOrder.color_code"
        side_effects:
          - "CustomerOrder.allocated_yards += FinishedRoll.actual_yards"
          - "If CustomerOrder.allocated_yards >= requested_yards * (1 - yardage_tolerance_pct/100) then CustomerOrder.status → FULLY_ALLOCATED, else PARTIALLY_ALLOCATED"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /mill/finished-rolls/{id}/ship"
        actor: CustomerServiceRep
        preconditions:
          - "FinishedRoll.status == ALLOCATED"
        side_effects:
          - "If all rolls of CustomerOrder are SHIPPED then CustomerOrder.status → SHIPPED"
      - from: AVAILABLE
        to: CLOSE_OUT
        trigger: "POST /mill/finished-rolls/{id}/close-out"
        actor: CustomerServiceRep
        preconditions:
          - "FinishedRoll.status == AVAILABLE"
          - "FinishedRoll.is_second_quality == true"
        side_effects: []
      - from: ALLOCATED
        to: AVAILABLE
        trigger: "POST /mill/finished-rolls/{id}/release"
        actor: CustomerServiceRep
        preconditions:
          - "FinishedRoll.status == ALLOCATED"
        side_effects:
          - "CustomerOrder.allocated_yards -= FinishedRoll.actual_yards"
          - "CustomerOrder.status reverts from FULLY_ALLOCATED to PARTIALLY_ALLOCATED or OPEN as appropriate"

  - entity: CustomerOrder
    initial_state: OPEN
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_ALLOCATED
        trigger: "system auto-transition on first roll allocation"
        actor: system
        preconditions:
          - "CustomerOrder.allocated_yards > 0"
        side_effects: []
      - from: PARTIALLY_ALLOCATED
        to: FULLY_ALLOCATED
        trigger: "system auto-transition when allocated_yards >= requested_yards * (1 - yardage_tolerance_pct/100)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "system auto-transition when a roll is released"
        actor: system
        preconditions:
          - "CustomerOrder.allocated_yards < requested_yards * (1 - yardage_tolerance_pct/100)"
        side_effects: []
      - from: FULLY_ALLOCATED
        to: SHIPPED
        trigger: "system auto-transition when all allocated rolls transition to SHIPPED"
        actor: system
        preconditions:
          - "Every FinishedRoll with allocated_order_id == this order has status == SHIPPED"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /mill/customer-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions:
          - "CustomerOrder.status in {OPEN, PARTIALLY_ALLOCATED}"
        side_effects:
          - "All FinishedRolls ALLOCATED to this order transition ALLOCATED → AVAILABLE (release cascade)"
          - "CustomerOrder.allocated_yards zeroed"
      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "POST /mill/customer-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions:
          - "CustomerOrder.status in {OPEN, PARTIALLY_ALLOCATED}"
        side_effects:
          - "All FinishedRolls ALLOCATED to this order transition ALLOCATED → AVAILABLE (release cascade)"
          - "CustomerOrder.allocated_yards zeroed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: recipe-approve-stale-version
    parent_entity: BlendRecipe
    write_endpoint: "POST /mill/blend-recipes/{id}/approve"
    occ_field: "expected_recipe_version"
    description: |
      Approving a BlendRecipe whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has just
      modified components or approved/rejected the recipe and the current
      writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-allocate-stale-version
    parent_entity: CustomerOrder
    write_endpoint: "POST /mill/customer-orders/{id}/allocate"
    occ_field: "expected_order_version"
    description: |
      Allocating a roll into a CustomerOrder whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      allocation or release has just mutated the order's allocated_yards.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: blend_cost_estimate
    trigger: "Variant A (forward_looking): on BlendRecipe approval. Variant B (chronological): on MachineAssignment completion (yarn lot actual cost)."
    algorithm: forward_looking
    formula: |
      Variant A (projected): projected_cost_per_lb = sum over components of
        (component_weight_lbs * fiber_lot.unit_cost_per_lb) / total_component_weight_lbs
      where fiber_lot.unit_cost_per_lb is the CURRENT lot cost at approval time.

      Variant B (actual): actual_cost_per_lb = sum over the recipe's components of
        (component_weight_lbs * fiber_lot.unit_cost_per_lb_AT_SPIN_TIME)
        / yarn_lot.spun_weight_lbs
      where unit_cost_per_lb_AT_SPIN_TIME is the value recorded on the FiberLot at
      the moment the MachineAssignment completes. Because the recipe consumes a
      fixed component weight but the spun_weight_lbs may differ (waste, count
      change), the two variants produce different numbers for identical inputs.
    input_set: "BlendComponents of the recipe; each referenced FiberLot"
    constants:
      WASTE_ALLOWANCE_PCT: 0.0
    precision: "4 decimal places, round_half_up"
    variants:
      - name: forward_looking_projected
        when: "BlendRecipe approval"
        difference: "Denominator is total_component_weight_lbs; uses FiberLot cost at approval time"
      - name: chronological_actual
        when: "MachineAssignment completion"
        difference: "Denominator is spun_weight_lbs (which may differ from component sum due to waste); uses FiberLot cost at spin completion"

  - name: yarn_count_deviation
    trigger: "On MachineAssignment completion (count change detection)"
    algorithm: threshold
    formula: |
      deviation_pct = (actual_yarn_count_ne - target_yarn_count_ne) / target_yarn_count_ne * 100
      if |deviation_pct| > COUNT_TOLERANCE_PCT (3.0):
        flag lot for QualityInspector review
      The tolerance check is non-linear because it interacts with spun_weight_lbs
      (lighter lots have higher variance), machine's supported_count range, and
      whether the recipe's target_ne falls inside the machine's supported band
      (eligibility filter for selector).
    input_set: "YarnLot, BlendRecipe, SpinningMachine"
    constants:
      COUNT_TOLERANCE_PCT: 3.0
    precision: "2 decimal places, round_half_up"

  - name: quality_grading
    trigger: "On QualityTest creation (POST /mill/dye-lots/{id}/quality-tests)"
    algorithm: threshold
    formula: |
      if shrinkage_pct_final is not null:
        shrinkage_input = shrinkage_pct_final   # final variant
      else:
        shrinkage_input = shrinkage_pct_provisional  # provisional variant

      if shrinkage_input >= SHRINKAGE_REJECT_PCT (8.0):
        grade = REJECTED
      elif shrinkage_input >= SHRINKAGE_SECOND_PCT (5.0):
        grade = SECOND_QUALITY
      elif hand_score < HAND_MIN (3):
        grade = SECOND_QUALITY
      else:
        grade = FIRST_QUALITY
    input_set: "Single QualityTest record"
    constants:
      SHRINKAGE_REJECT_PCT: 8.0
      SHRINKAGE_SECOND_PCT: 5.0
      HAND_MIN: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_grading
        when: "QualityTest created before conditioning completes (shrinkage_pct_final is null)"
        difference: "Uses shrinkage_pct_provisional as the shrinkage input"
      - name: final_grading
        when: "QualityTest updated with shrinkage_pct_final (PATCH)"
        difference: "Re-derives grade using shrinkage_pct_final; may upgrade or downgrade the earlier provisional grade"

  - name: roll_yardage_total
    trigger: "On FinishedRoll creation and on CustomerOrder.allocated_yards recompute"
    algorithm: aggregation
    formula: |
      For put-up totals (used in variance reporting):
        total_put_up_yards = sum over rolls of round(put_up_yards, 2)
        (round per-roll, then sum)

      For allocation totals (drives CustomerOrder status):
        total_allocated_yards = round(sum over rolls of actual_yards, 2)
        (sum raw actual_yards, then round at the aggregate)

      The two orderings differ when put_up_yards values have sub-cent
      fractional yards; the scaffold PINS the first ordering (round-then-sum)
      for put-up totals and the second (sum-then-round) for allocation totals,
      and they may diverge by up to N*0.005 yards.
    input_set: "FinishedRolls of the parent DyeLot or allocated to the CustomerOrder"
    constants:
      ROUNDING_PLACES: 2
    precision: "2 decimal places, round_half_up; pinned order per above"

  - name: greige_allocation
    trigger: "On DyeLot creation (debit), DyeLot rejection (credit), YarnLot rejection (zero)"
    algorithm: waterfall_allocation
    formula: |
      YarnLot.greige_yards_available starts equal to (spun_weight_lbs *
      YARDS_PER_LB_BY_COUNT[actual_yarn_count_ne band]).
      On DyeLot create: debit by requested_yards (rejected if insufficient).
      On DyeLot reject: credit back by requested_yards.
      On YarnLot reject: zero out.
    input_set: "YarnLot and its DyeLots in non-terminal states"
    constants:
      YARDS_PER_LB_NE_10: 8400
      YARDS_PER_LB_NE_20: 16800
      YARDS_PER_LB_NE_30: 25200
    precision: "2 decimal places, round_half_up"

  - name: shade_match_check
    trigger: "On QualityTest creation (computes DyeLot.measured_delta_e)"
    algorithm: aggregation
    formula: |
      delta_e = sqrt( (L - centroid_l)^2 + (a - centroid_a)^2 + (b - centroid_b)^2 )
      where L, a, b are the measured CIELAB values on the QualityTest.
      Passes shade band if delta_e <= ShadeBand.delta_e_tolerance.
    input_set: "QualityTest measured values + ShadeBand centroid + tolerance"
    constants: {}
    precision: "3 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and maps to a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template IDs resolve to existing entities (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All FK fields in request body resolve to existing entities"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST endpoints with FK payloads"

  - priority: 5
    category: state
    check: "Target entity is in a state that permits the requested transition (state machine precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Quality-gate: dye lot cannot be approved when QualityTest.grade == REJECTED; yarn lot cannot enter DYEING if its BlendRecipe is not APPROVED"
    error_id: ERR_QUALITY_GATE_FAILED
    http_status: 422
    applies_to: "POST /mill/dye-lots/{id}/approve, POST /mill/dye-lots"

  - priority: 7
    category: business_constraint
    check: "Uniqueness: BlendRecipe.recipe_code unique among non-superseded; SpinningMachine.machine_code unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /mill/blend-recipes, POST /mill/spinning-machines"

  - priority: 8
    category: business_temporal
    check: "MachineAssignment window does not overlap any other SCHEDULED/IN_PROGRESS assignment on the same machine (half-open [start, end)); DyeLot vat schedule respects 30-minute cooldown buffer between batches on same vat_id"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /mill/machine-assignments, POST /mill/dye-lots"

  - priority: 9
    category: business_referential
    check: "Referential integrity: FinishedRoll cannot be created if its DyeLot is not APPROVED; LabDip cannot be approved if measured_delta_e > ShadeBand tolerance"
    error_id: ERR_REFERENTIAL_VIOLATION
    http_status: 422
    applies_to: "POST /mill/finished-rolls, POST /mill/lab-dips/{id}/approve"

  - priority: 10
    category: business_fiscal
    check: "Capacity: YarnLot.greige_yards_available >= DyeLot.requested_yards; FiberLot.available_weight_lbs >= component_weight_lbs"
    error_id: ERR_INSUFFICIENT_CAPACITY
    http_status: 422
    applies_to: "POST /mill/dye-lots, POST /mill/blend-recipes/{id}/components"

  - priority: 11
    category: business_constraint
    check: "Roll routed to normal order allocation must not be second-quality (is_second_quality == false)"
    error_id: ERR_SECOND_QUALITY_NOT_ALLOCATABLE
    http_status: 422
    applies_to: "POST /mill/customer-orders/{id}/allocate"

