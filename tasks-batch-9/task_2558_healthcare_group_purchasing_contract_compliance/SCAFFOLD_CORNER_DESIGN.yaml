              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/contracts/${c1}/suspend"
              payload: { reason: "again" }
              as: ComplianceAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-02" }
