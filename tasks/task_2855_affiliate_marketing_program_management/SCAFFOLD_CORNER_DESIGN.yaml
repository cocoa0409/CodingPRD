              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { aff_child: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "MetaNet Grandchild LLC", contact_email: "gchild@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD", parent_affiliate_id: "${aff_child}" }
