      - name: amendment_pending_suspends_planned_and_freezes_running_programs
        claim_type: conditional_cascade
        grounds:
          - state_machines.MarketingProgram.PLANNED_to_SUSPENDED_PENDING_AMENDMENT
          - state_machines.AnnualWorkPlan.APPROVED_to_AMENDMENT_PENDING
          - entities.MarketingProgram.fields.spend_frozen
        excluded_because:
          difficulty_instance: transitive_cascade / granted_dispute_cascades_through_funding_ratio_into_a_frozen_program
          rationale: "That §1.8 instance drives the plan APPROVED -> AMENDMENT_PENDING through a granted dispute and asserts hop 4 exactly — the RUNNING program stays RUNNING with spend_frozen true, its closure is refused, and the later amendment thaws it — which is this conditional cascade."

      - name: statement_filing_and_payment_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.AssessmentStatement.filing_dimension
          - state_machines.AssessmentStatement.payment_dimension
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / statement_filing_and_payment_dimensions_advance_independently
          rationale: "That §1.8 instance walks the row through FILED/PARTIALLY_PAID, AUDITED/PARTIALLY_PAID, AUDITED/PAID_IN_FULL and CERTIFIED/PAID_IN_FULL, asserting each dimension stands still while the other moves."

      - name: program_launch_is_guarded_by_the_districts_dmo_agreement_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.MarketingProgram.PLANNED_to_RUNNING
          - entities.District.fields.dmo_agreement_status
          - errors[ERR_DMO_AGREEMENT_NOT_EXECUTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / program_launch_gated_on_the_district_dmo_agreement_reaching_executed
          rationale: "That §1.8 instance holds the program in a perfectly valid PLANNED state and moves only the district's dmo_agreement_status, asserting the refusal and then the success."

      - name: delinquency_sweep_adjusts_signatures_on_a_different_aggregate
        claim_type: cross_entity
        grounds:
          - state_machines.AssessmentPeriod.CLOSED_to_DELINQUENCY_SWEPT
          - state_machines.PetitionSignature.VALID_to_DISQUALIFIED
          - entities.LodgingBusiness.fields.compliance_standing
        excluded_because:
          difficulty_instance: transitive_cascade / delinquency_sweep_cascades_four_hops_into_renewal_petition_support
          rationale: "That §1.8 instance asserts every hop of the sweep's cross-aggregate reach, ending on the affected drive's recomputed weighted_support_pct."

      - name: remittance_ledger_stays_in_sync_with_the_district_total
        claim_type: ledger_sync
        grounds:
          - calculations.remittance_waterfall
          - entities.District.fields.collected_to_date_cents
          - entities.AssessmentPeriod.fields.collected_total_cents
        excluded_because:
          difficulty_instance: compensating_invariant / remittance_reversals_restore_the_statement_and_district_ledger_exactly
          rationale: "That §1.8 instance reconciles District.collected_to_date_cents against the sum of the four per-statement buckets before and after a reversal."

      - name: signature_withdrawal_compensates_the_drive_totals_exactly
        claim_type: compensation
        grounds:
          - state_machines.PetitionSignature.VALID_to_WITHDRAWN
          - calculations.petition_support
          - entities.PetitionDrive.fields.signed_basis_cents
        excluded_because:
          difficulty_instance: compensating_invariant / signature_withdrawal_restores_petition_support_to_its_prior_value
          rationale: "That §1.8 instance asserts signed_basis_cents, valid_signature_count and weighted_support_pct return to their exact pre-signature values with no drift."

  # ===========================================================================
  # SECTION 3 — Calculations (claim-extraction-guide Table 3)
  # Every literal below was produced by running the §1.3 formula with Decimal
  # ROUND_HALF_UP. The two unexercised assessment_amount branches get real
  # instances on their own districts, because §1.8 works the PCT branch only.
  # ===========================================================================
  - section: calculations
    instances:

      - name: per_occupied_room_night_branch_ignores_revenue_and_binds_the_period_cap
        claim_type: correct_result
        grounds:
          - calculations.assessment_amount.PER_OCCUPIED_ROOM_NIGHT_branch
          - calculations.assessment_amount.constants.PER_NIGHT_RATE_CENTS
          - calculations.assessment_amount.constants.CLASS_MULTIPLIER
          - calculations.assessment_amount.constants.PERIOD_CAP_CENTS
        distinguishing_aspect: |
          A second district on assessment_method PER_OCCUPIED_ROOM_NIGHT bills nights x 300 x the
          class multiplier and never touches reported_gross_room_revenue_cents: 10,000 nights of a
          FULL_SERVICE property gross 3,000,000 and are cut to the 2,500,000 period cap, while the
          same row under the PCT branch would have billed 2 percent of 60,000,000 = 1,200,000. The
          BOUTIQUE row lands on 189,000 and the LIMITED_SERVICE row on 255,000, so all three
          multipliers are exercised and the zone rate is proved irrelevant on this branch.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "district Cove Reach on PER_OCCUPIED_ROOM_NIGHT, ACTIVE, three assessable properties summing to 100,000,000 of prior-year revenue"
            - "period FY2027-Q1 generated, so every statement snapshots assessment_method_at_period_start PER_OCCUPIED_ROOM_NIGHT"
          setup_api_calls:
            - *c_clock_form
            - &c2_district
              call: "POST /districts"
              payload: { name: "Cove Reach Tourism Improvement District", assessment_method: "PER_OCCUPIED_ROOM_NIGHT", included_zones: ["ZONE_CORE", "ZONE_PERIMETER"], term_years: 1, current_fiscal_year: 2027 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { d2_id: "$.data.id" }
            - &c2_b1
              call: "POST /lodging-businesses"
              payload: { district_id: "${d2_id}", legal_name: "Cove Reach Grand", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 400, prior_year_gross_room_revenue_cents: 60000000, operator_contact_email: "ops@covereachgrand.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { c2b1_id: "$.data.id" }
            - &c2_b2
              call: "POST /lodging-businesses"
              payload: { district_id: "${d2_id}", legal_name: "Cove Reach Boutique", boundary_zone: "ZONE_PERIMETER", classification: "BOUTIQUE", room_count: 60, prior_year_gross_room_revenue_cents: 15000000, operator_contact_email: "ops@covereachboutique.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { c2b2_id: "$.data.id" }
            - &c2_b3
              call: "POST /lodging-businesses"
              payload: { district_id: "${d2_id}", legal_name: "Cove Reach Inn", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 100, prior_year_gross_room_revenue_cents: 25000000, operator_contact_email: "ops@covereachinn.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { c2b3_id: "$.data.id" }
            - &c2_drive
              call: "POST /petition-drives"
              payload: { district_id: "${d2_id}", drive_type: "FORMATION", closes_at: "2026-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pd2_id: "$.data.id" }
            - &c2_sign
              call: "POST /petition-drives/${pd2_id}/signatures"
              payload: { lodging_business_id: "${c2b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c2_tally
              call: "POST /petition-drives/${pd2_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c2_certify
              call: "POST /petition-drives/${pd2_id}/certification"
              payload: { certified_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c2_activate
              call: "POST /districts/${d2_id}/lifecycle-advances"
              payload: { to_status: "ACTIVE", effective_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c2_period
              call: "POST /assessment-periods"
              payload: { district_id: "${d2_id}", period_label: "FY2027-Q1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_date: "2026-11-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { ap2_id: "$.data.id" }
            - &c2_generate
              call: "POST /assessment-periods/${ap2_id}/statement-generation"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c2_find_1
              call: "GET /assessment-periods/${ap2_id}/statements"
              payload: { lodging_business_id: "${c2b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { c2st1_id: "$.data[0].id" }
            - &c2_find_2
              call: "GET /assessment-periods/${ap2_id}/statements"
              payload: { lodging_business_id: "${c2b2_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { c2st2_id: "$.data[0].id" }
            - &c2_find_3
              call: "GET /assessment-periods/${ap2_id}/statements"
