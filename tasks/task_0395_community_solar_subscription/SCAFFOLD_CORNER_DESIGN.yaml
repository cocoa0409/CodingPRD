      - name: missing_role_header_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET./projects/{id}
        distinguishing_aspect: "A request whose X-User-Role is not one of the declared roles → 401 ERR_UNAUTHENTICATED."
