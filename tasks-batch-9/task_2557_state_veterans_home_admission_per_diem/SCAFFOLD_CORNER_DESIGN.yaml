            - "s2_cert == CERTIFIED"
            - "s2_posture == OPEN"
            - "s2_wlcount == 2"
            - "the admission decision after re-certification returns HTTP 201"
            - "res_occ == ADMITTED"
            - "nu_occ_f == 1"
            - "nu_avail_f == 1"
            - "nu_wl_f == 1"
            - "nu_posture_f == OPEN"

      - name: layer_dual_variant_calculation_cost_share_and_claim_basis
        claim_type: dual_variant_calculation
        grounds:
          - calculations.governing_cost_share_selector
          - calculations.per_diem_claim_amount
        excluded_because:
          difficulty_instance: dual_variant_calc / per_diem_claim_census_vs_audited_basis_divergence
          rationale: "The named §1.8 instance drives the same census through both the CENSUS_REPORTED and AUDITED bases and asserts the two claim amounts diverge on the identical inputs, which is the whole content of this layer; the cost-share half is covered by dual_variant_calc / cost_share_provisional_vs_final_divergence."

      - name: layer_rate_threshold_triggers_at_band_edges
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.survey_compliance_score
          - calculations.resident_cost_share_monthly
        excluded_because:
          difficulty_instance: boundary_precision_check / survey_score_24_conditional_versus_25_decertified
          rationale: "The named §1.8 instance straddles CERTIFICATION_DECERTIFY_THRESHOLD with scores 24 and 25 on adjacent runs, which is the sharpest threshold edge in the design; the cost-share tier edges are covered by combinatorial_formula / cost_share_medical_cap_tier_evaluation_order_pinned."

  - section: consistency_model
    instances:
      - name: consistency_derived_counters_visible_on_the_immediately_following_read
        claim_type: immediate_consistency
        grounds:
          - consistency_model.immediate
          - entities.CareUnit
          - entities.VeteransHome
          - endpoints[POST /svh/residents/{id}/discharge].side_effects
        distinguishing_aspect: |
          consistency_model is immediate, so every computed counter is recomputed inside the writing request:
          the read issued immediately after the admission already shows occupied_bed_count 1,
          available_bed_count 1 and active_resident_count 1, and the list read shows the identical numbers as
          the single-resource read - no refresh call, no ops run, no second request is needed to settle them.
          The discharge reverses all of them in the same one-request window. An implementation that recomputes
          counters lazily (on a later GET, on the census run, or from a cached projection) shows stale zeroes
          or stale ones on at least one of these reads.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit, licensed_bed_count 2, out_of_service_bed_count 0."
            - "Applicant A is ELIGIBLE with an ACTIVE WaitlistEntry on that unit and a SUBMITTED NURSING assessment."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Ambleside State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Cato Rennemo", date_of_birth: "1943-02-02", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { a_id: "$.data.id" }
            - call: "POST /svh/applicants/${a_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${a_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
              captures: { a_wl_id: "$.data.id" }
            - call: "POST /svh/applicants/${a_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 3.00, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { a_asmt_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${a_asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { nu_v: "$.data.version", pre_occ: "$.data.occupied_bed_count", pre_avail: "$.data.available_bed_count" }
          trigger:
            - call: "POST /svh/applicants/${a_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${nu_id}", clinical_assessment_id: "${a_asmt_id}", expected_care_unit_version: "${nu_v}", admission_date: "2026-08-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { res_id: "$.data.id", res_occ: "$.data.occupancy_status" }
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { post_occ: "$.data.occupied_bed_count", post_held: "$.data.held_bed_count", post_avail: "$.data.available_bed_count", post_wl: "$.data.waitlist_active_count", post_posture: "$.data.operational_posture" }
            - call: "GET /svh/veterans-homes/${home_id}/care-units"
              payload: { care_level: "NURSING", limit: 10 }
              as: AdmissionsCoordinator
              captures: { list_occ: "$.data[0].occupied_bed_count", list_avail: "$.data[0].available_bed_count", list_total: "$.meta.total_count" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { home_active: "$.data.active_resident_count" }
            - call: "GET /svh/care-units/${nu_id}/waitlist-entries"
              payload: { status: "ADMITTED", limit: 10 }
              as: AdmissionsCoordinator
              captures: { adm_wl_total: "$.meta.total_count", adm_wl_id: "$.data[0].id" }
            - call: "POST /svh/residents/${res_id}/discharge"
              payload: { discharge_date: "2026-08-01", discharge_reason: "VOLUNTARY" }
              as: AdmissionsCoordinator
              captures: { disc_status: "$.data.occupancy_status", disc_billing: "$.data.billing_status" }
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { end_occ: "$.data.occupied_bed_count", end_avail: "$.data.available_bed_count", end_posture: "$.data.operational_posture" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { home_active_end: "$.data.active_resident_count" }
          assert:
            - "pre_occ == 0"
            - "pre_avail == 2"
            - "res_occ == ADMITTED"
            - "post_occ == 1"
            - "post_held == 0"
            - "post_avail == 1"
            - "post_wl == 0"
            - "post_posture == OPEN"
            - "list_occ == 1"
            - "list_avail == 1"
            - "list_total == 1"
            - "home_active == 1"
            - "adm_wl_total == 1"
            - "adm_wl_id == ${a_wl_id}"
            - "disc_status == DISCHARGED"
            - "disc_billing == CLOSED"
            - "end_occ == 0"
            - "end_avail == 2"
            - "end_posture == OPEN"
            - "home_active_end == 0"

      - name: consistency_transfer_recomputes_both_units_in_one_request
        claim_type: immediate_consistency
        grounds:
          - consistency_model.immediate
          - calculations.care_unit_bed_availability
        excluded_because:
          difficulty_instance: compensating_invariant / transfer_conserves_occupied_plus_held_beds
          rationale: "The named §1.8 instance reads both the source and the destination unit immediately after the transfer and asserts occupied + held + available + out_of_service still equals licensed on each side, which is the strongest possible statement of immediate cross-entity recomputation in this domain."
