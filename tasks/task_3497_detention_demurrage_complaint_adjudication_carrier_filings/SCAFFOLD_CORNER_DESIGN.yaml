  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: tariff_filing_stale_carrier_version_returns_412
        claim_type: OCC stale-version conflict
        grounds:
          - concurrency_rules[tariff-filing-stale-carrier]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "optimistic_concurrency on the carrier aggregate: a tariff filing carrying the pre-filing version (1) is rejected 412 ERR_STALE_VERSION after a sibling filing advanced the carrier to version 2; refetching and resubmitting with the current version succeeds — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "VOCC carrier at version 1."
          setup_api_calls:
            - *c_clock
            - *c_carrier
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-OCC-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_occ: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-OCC-2", charge_scope: "DEMURRAGE", free_time_days: 3, per_diem_rate_cents: 6000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /fmc/carriers/${carrier_id}"
              payload: {}
              as: CommissionDocket
              captures: { carrier_v_now: $.data.version }
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-OCC-3", charge_scope: "DEMURRAGE", free_time_days: 3, per_diem_rate_cents: 6000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v_now}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_occ3: $.data.id }
          assert:
            - "the first filing succeeds (201) and advances CarrierOrganization.${carrier_id}.version to 2"
            - "the second filing with the stale version fails: 412 ERR_STALE_VERSION and no tariff DD-OCC-2 is stored"
            - "the refetched version allows the third filing: 201, and the carrier version is now 3 (every mutation increments by exactly 1)"

      - name: bond_draw_stale_license_version_returns_412
        claim_type: OCC stale-version conflict
        grounds:
          - concurrency_rules[bond-draw-stale-license]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "optimistic_concurrency on the license ledger: after a +100 draw advances the license version, a second draw replaying the pre-draw version is rejected 412 ERR_STALE_VERSION; the same draw with the current version succeeds — the ledger serializes on version, not on arrival order."
        test_recipe:
          setup:
            - "NVOCC carrier with an ACTIVE license via an 8000000-cent bond (above the 7500000 minimum so small draws do not suspend it)."
          setup_api_calls:
            - *c_clock
            - call: "POST /fmc/carriers"
              payload: { org_name: "Stale Ledger Forwarders", org_type: "NVOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/oti-licenses"
              payload: { license_type: "NVOCC" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /fmc/oti-licenses/${lic_id}/surety-bonds"
              payload: { bond_ref: "B1", surety_name: "Pacific Surety", coverage_cents: 8000000 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { lic_v: $.data.version }
          trigger:
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 100, reason: "claim 1", expected_license_version: "${lic_v}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 100, reason: "claim 2", expected_license_version: "${lic_v}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /fmc/carriers/${carrier_id}/oti-licenses"
              payload: {}
              as: CommissionDocket
              captures: { lic_v_now: "$.data[0].version" }
            - call: "POST /fmc/oti-licenses/${lic_id}/draws"
              payload: { bond_ref: "B1", amount_cents: 200, reason: "claim 2 retry", expected_license_version: "${lic_v_now}" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { total_now: $.data.total_available_coverage_cents }
          assert:
            - "the replayed-version draw fails: 412 ERR_STALE_VERSION (drawn stays 100)"
            - "the draw with the refetched version succeeds: total_available_coverage_cents == 7999700 (8000000 - 100 - 200)"
            - "the license stays ACTIVE throughout (7999700 >= 7500000)"

      - name: carrier_derived_totals_reconcile_after_two_determinations
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.civil_penalty_assessment
          - calculations.compliance_score_adjustment
          - entities.CarrierOrganization.fields.cumulative_civil_penalties_cents
        distinguishing_aspect: "derived_field_reconciliation: after two determinations (1,000,000 first-offense then 1,500,000 with the repeat-offender multiplier), the carrier's cumulative_civil_penalties_cents == 2500000 equals the sum of the two proceedings' penalty_cents, and compliance_score == 900 equals 1000 plus both score_deltas — the denormalized fields stay consistent with their sources."
        test_recipe:
          setup:
            - "VOCC carrier, no prior proceedings."
          setup_api_calls:
            - *c_clock
            - *c_carrier
          trigger:
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "TARIFF_VIOLATION" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { p1: $.data.id }
            - call: "POST /fmc/enforcement-proceedings/${p1}/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 1, willful: false }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { pen1: $.data.penalty_cents, delta1: $.data.score_delta }
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "AGREEMENT_VIOLATION" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { p2: $.data.id }
            - call: "POST /fmc/enforcement-proceedings/${p2}/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 1, willful: false }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { pen2: $.data.penalty_cents, delta2: $.data.score_delta, rep2: $.data.repeat_offender }
          assert:
            - "pen1 == 1000000 (repeat_offender false) and pen2 == 1500000 (repeat_offender true: x1.5)"
            - "GET /fmc/carriers/${carrier_id} shows cumulative_civil_penalties_cents == 2500000 (== pen1 + pen2) and compliance_score == 900 (1000 - 50 - 50)"
            - "status stays ACTIVE (900 >= 600)"

