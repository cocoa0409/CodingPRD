              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv2_id: $.data.id }
            - call: "POST /protocol-versions/${pv2_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
