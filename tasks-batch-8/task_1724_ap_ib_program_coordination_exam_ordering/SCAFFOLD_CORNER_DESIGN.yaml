# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: AP/IB Program Coordination & Exam Ordering
# Breadth probe over §1.1-§1.7 per references/claim-extraction-guide.md.
# Instances already exercised by §1.8 appear as excluded_because stubs.
# Names are unique across both design files.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: course_creation_returns_stamped_system_fields
        claim_type: creation
        grounds: [entities.Course, "endpoints:POST /courses"]
        distinguishing_aspect: "POST /courses returns 201 with server-minted id, created_at/updated_at, version == 1, and derived initial status SUSPENDED (no authorized teacher yet); input fields echo verbatim."
        test_recipe:
          setup: ["Cycle exists (SETUP suffices for course creation)"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id, co_v: $.data.version }
          assert:
            - "Response 201; data.id is a UUID; created_at == updated_at (ISO 8601, millisecond precision); version == 1"
            - "Course.${co}.status == SUSPENDED (derived: authorized_teacher_count == 0) and subject_code == AP_CALC_BC"

      - name: get_course_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /courses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND; response_type == error"

      - name: registration_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /registrations omitting required course_id returns 400 ERR_INVALID_REQUEST even though student_id is present."
        test_recipe:
          setup: ["Cycle OPEN; one course; one student"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}" }
              as: Student
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST (course_id missing)"

      - name: create_course_with_extra_field_returns_invalid_request
        claim_type: computed_fields
        grounds: ["validations[priority=4]", entities.Course.fields.status]
        distinguishing_aspect: "Sending the computed field status in a create payload is rejected (strict unknown-field validation), proving computed fields are server-owned."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3, status: "ACTIVE" }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST (unexpected field status)"

      - name: accommodation_type_defaults_to_none
        claim_type: defaults
        grounds: [entities.ExamRegistration.fields.accommodation_type]
        distinguishing_aspect: "Omitting accommodation_type on registration stores the declared default NONE."
        test_recipe:
          setup: ["Cycle OPEN; course; student"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          assert:
            - "ExamRegistration.${r1}.accommodation_type == NONE (default applied)"

      - name: create_course_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.Course.fields.program]
        distinguishing_aspect: "program outside {AP, IB} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Cycle exists"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "APX", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST (program APX not in enum)"

      - name: session_end_not_after_start_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.ExamSession.fields.end_at]
        distinguishing_aspect: "end_at equal to start_at violates the strict ordering rule (400), independent of window/overlap checks."
        test_recipe:
          setup: ["Cycle OPEN; course ACTIVE (teacher authorized)"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
          trigger:
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T09:00:00Z" }
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST (end_at must be strictly after start_at)"

      - name: registrations_list_pagination_interaction
        claim_type: listing
        grounds: [response_envelope, "endpoints:GET /registrations"]
        distinguishing_aspect: "limit/offset paginate deterministically: page 1 of limit 2 over 3 rows returns 2 items with has_more true and total_count 3; page 2 returns 1 item with has_more false."
        test_recipe:
          setup: ["Cycle OPEN; one course; three students each registered once"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s2: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu C", grade_level: 12, subgroup_code: "FRL" }
              as: ApCoordinator
              captures: { s3: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /registrations"
              payload: { student_id: "${s2}", course_id: "${co}" }
              as: Student
              as_user_id: "${s2}"
            - call: "POST /registrations"
              payload: { student_id: "${s3}", course_id: "${co}" }
              as: Student
              as_user_id: "${s3}"
          trigger:
            - call: "GET /registrations?course_id=${co}&limit=2&offset=0"
              as: ApCoordinator
            - call: "GET /registrations?course_id=${co}&limit=2&offset=2"
              as: ApCoordinator
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: 1 item, total_count == 3, has_more == false, offset == 2"

      - name: registration_with_unknown_course_returns_reference_not_found
        claim_type: fk_integrity
        grounds: ["validations[priority=5]", "errors[ERR_REFERENCE_NOT_FOUND]", entities.ExamRegistration.fields.course_id]
        distinguishing_aspect: "A body FK that does not resolve returns 422 ERR_REFERENCE_NOT_FOUND (distinct from 404 path Not Found)."
        test_recipe:
          setup: ["Cycle OPEN; one student"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: Student
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_REFERENCE_NOT_FOUND"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: new_registration_initial_states
        claim_type: initial_state
        grounds: [state_machines.ExamRegistration]
        distinguishing_aspect: "A freshly created registration starts REGISTERED x PENDING with version 1 and the fee snapshot copied from the course."
        test_recipe:
          setup: ["Cycle OPEN; course fee 9800; student"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          assert:
            - "ExamRegistration.${r1}.registration_status == REGISTERED and score_status == PENDING and version == 1"
            - "fee_cents == 9800 (snapshot from course), is_late == false (default clock 2026-08-01T00:00:00Z precedes deadline), late_fee_applied_cents == 0, net_fee_cents == 9800"

      - name: cancelled_registration_cannot_be_cancelled_again
        claim_type: invalid_transition
        grounds: [state_machines.ExamRegistration.REGISTERED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected with 409 ERR_INVALID_STATE and fires no side effects (balance stays put)."
        test_recipe:
          setup: ["Cycle OPEN; course fee 9800; student with one registration r1; r1 then cancelled"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations/${r1}/cancel"
              as: ApCoordinator
          trigger:
            - call: "POST /registrations/${r1}/cancel"
              as: ApCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
          assert:
            - "Second cancel: HTTP 409 and error_id == ERR_INVALID_STATE"
            - "statement.balance_cents == 0 (the terminal registration contributes nothing; no double-decrement drift)"

      - name: posted_score_cannot_be_reposted
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExamRegistration.RELEASED_to_POSTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POSTED is terminal for the score dimension: a second post-to-transcript is rejected with 409 ERR_INVALID_STATE and transcript_posted_count does not double-increment."
        test_recipe:
          setup:
            - "Cycle OPEN; course ACTIVE; student registered r1; session administered with r1 SAT"
            - "Clock at score_release_at; r1 released with score 4 and posted to transcript"
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /exam-sessions"
              payload: { course_id: "${co}", room_name: "GYM", room_capacity: 5, start_at: "2027-05-05T09:00:00Z", end_at: "2027-05-05T11:00:00Z" }
              as: ApCoordinator
              captures: { se: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-sessions/${se}/administer"
              payload: { present_registration_ids: ["${r1}"] }
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-05T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-cycles/${cy}/release-scores"
              payload: { scores: [{ registration_id: "${r1}", score: 4 }] }
              as: Registrar
            - call: "POST /registrations/${r1}/post-to-transcript"
              as: Registrar
          trigger:
            - call: "POST /registrations/${r1}/post-to-transcript"
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
          assert:
            - "Second post: HTTP 409 and error_id == ERR_INVALID_STATE"
            - "statement.transcript_posted_count == 1 (no double increment)"

      - name: administer_marks_absentees_no_show
        claim_type: side_effect_execution
        grounds: [state_machines.ExamSession.SCHEDULED_to_ADMINISTERED, state_machines.ExamRegistration.REGISTERED_to_SAT, state_machines.ExamRegistration.REGISTERED_to_NO_SHOW]
        distinguishing_aspect: "Administer splits the roster: listed registration becomes SAT x PENDING, the unlisted REGISTERED registration becomes NO_SHOW x NO_SCORE, and seats_reserved recomputes to 0."
        test_recipe:
          setup: ["Cycle OPEN; course ACTIVE; students s1, s2 registered; session scheduled (capacity 5)"]
          setup_api_calls:
            - call: "POST /exam-cycles"
