  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: checkout_then_void_conserves_inventory_available_units
        grounds:
          - state_machines.Order.payment_status=AUTHORIZED_to_payment_status=VOIDED
          - calculations.reservation_waterfall
          - entities.InventoryItem.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity = available units. checkout reserves 4 units (available 10→6); void releases those HELD
          reservations (available 6→10), restoring available_qty to its pre-checkout value 10 exactly. Invariant:
          InventoryItem.available_qty after (checkout then void) == on_hand_qty with no held reservations.
        test_recipe:
          setup:
            - "Product with on_hand 10 at one warehouse; an AUTHORIZED order reserving 4 units (available 6)."
          setup_api_calls:
