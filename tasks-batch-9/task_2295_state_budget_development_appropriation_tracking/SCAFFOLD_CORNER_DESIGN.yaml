          assert:
            - "the first certify-balance returns HTTP 422 with error_id == ERR_NO_ADOPTED_FORECAST"
            - "BudgetCycle.${cyc_id}.balance_certified is still false and required_reserve_cents is still 0 after the rejected call"
            - "the second certify-balance returns HTTP 200 with balance_certified == true"
            - "BudgetCycle.${cyc_id}.adopted_general_fund_revenue_cents == 10000000000 and required_reserve_cents == 500000000"
            - "the DEDICATED forecast never contributes to adopted_general_fund_revenue_cents"

