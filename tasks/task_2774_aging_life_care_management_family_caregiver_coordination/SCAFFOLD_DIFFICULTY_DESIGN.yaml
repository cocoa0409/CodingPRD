            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-13T14:00:00Z", end_at: "2026-08-13T15:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
