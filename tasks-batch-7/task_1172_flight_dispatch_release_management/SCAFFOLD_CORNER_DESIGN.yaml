      - name: cdl_item_narrows_cg_envelope
        claim_type: constants_applied
        grounds: [calculations.cg_percent_mac, "errors[ERR_CG_OUT_OF_ENVELOPE]"]
        distinguishing_aspect: "Conditional validation: cg 30.50 %MAC (cargo-heavy load) is inside the normal envelope [20.0, 31.0] but outside the CDL-narrowed [22.0, 30.0]; the same manifest PUT passes before the CDL item exists and fails after."
        test_recipe:
          setup: ["Standard chain to LOCKED plan (required 9077); manifest pax 0 bags 0 cargo 8070 -> cg_percent_mac 30.50"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
