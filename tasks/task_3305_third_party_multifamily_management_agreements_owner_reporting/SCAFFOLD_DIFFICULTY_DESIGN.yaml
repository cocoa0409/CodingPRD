              captures: { sm11b_id: $.data.id }
            - call: "POST /mgmt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PortfolioManager
          trigger:
            - call: "POST /mgmt/statements/${sm11a_id}/close"
              payload: {}
