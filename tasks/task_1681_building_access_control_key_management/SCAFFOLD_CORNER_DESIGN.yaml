              payload: { credential_id: "${k1}", mode: "RECORDED" }
              as: SecurityOfficer
              captures: { oc: $.data.outcome, ev: $.data.access_event_id }
          assert:
            - "oc == DENIED_CREDENTIAL_NOT_ISSUED"
            - "AccessEvent.${ev}.outcome == DENIED_CREDENTIAL_NOT_ISSUED (denials are also audited)"
            - "Door.${d1}.open_since == null (denied check does not open the door)"

  - section: state_machines
    instances:
      - name: incident_resolve_deactivate_credential_action
        claim_type: valid_transition
        grounds: ['state_machines.Incident.UNDER_REVIEW_to_RESOLVED', 'state_machines.Credential.LOST_to_DEACTIVATED']
        distinguishing_aspect: "resolution_action DEACTIVATE_CREDENTIAL drives the linked LOST credential to DEACTIVATED with reason INCIDENT and creates no campaign."
        test_recipe:
          setup: ["Building B; M -> C1; staff S1 held K-1 (FOB on C1); K-1 reported lost; incident INC UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Deact House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: SecurityAdmin
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", level: "MASTER", label: "M" }
              as: SecurityAdmin
              captures: { m: $.data.id }
            - call: "POST /key-nodes"
              payload: { building_id: "${b}", parent_id: "${m}", level: "CHANGE", label: "C1" }
              as: SecurityAdmin
              captures: { c1: $.data.id }
            - call: "POST /persons"
              payload: { building_id: "${b}", full_name: "Staff One", kind: "STAFF" }
              as: FrontDesk
              captures: { s1: $.data.id }
            - call: "POST /credentials"
              payload: { building_id: "${b}", key_node_id: "${c1}", serial_no: "K-1", type: "FOB" }
              as: FrontDesk
              captures: { k1: $.data.id }
            - call: "POST /credentials/${k1}/issue"
              payload: { person_id: "${s1}" }
              as: FrontDesk
            - call: "POST /credentials/${k1}/report-lost"
              as: FrontDesk
            - call: "GET /incidents?credential_id=${k1}"
              as: SecurityOfficer
              captures: { inc: "$.data[0].id" }
            - call: "POST /incidents/${inc}/start-review"
              as: SecurityOfficer
          trigger:
            - call: "POST /incidents/${inc}/resolve"
              payload: { resolution_action: "DEACTIVATE_CREDENTIAL", resolution_note: "Badge recovered and shredded" }
              as: SecurityOfficer
              captures: { st: $.data.status, camp: $.data.campaign_id }
            - call: "GET /credentials/${k1}"
              as: FrontDesk
              captures: { k1_status: $.data.status, k1_reason: $.data.deactivated_reason }
          assert:
            - "st == RESOLVED and camp == null (no rekey campaign for this action)"
            - "k1_status == DEACTIVATED and k1_reason == INCIDENT"
            - "KeyNode.${c1}.status == COMPROMISED (deactivating the credential does not un-compromise the node)"
