              as_user_id: "${pid}"
              captures: { e_window_policy: $.data.error_id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-01-20T09:00:00Z", planned_end: "2026-01-20T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 51.51, launch_longitude: -0.13 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { e_window_past: $.data.error_id }
          assert:
            - "${first_grade} == \"PASSED\" and the regrade returns HTTP 409 with ${e_test} == \"ERR_TEST_ALREADY_GRADED\" - the stored raw_score stays 100, not 60"
            - "${e_policy} == \"ERR_POLICY_INVALID_STATE\" at 409 - verify is declared only from PENDING_VERIFICATION, and coverage_status stays ACTIVE"
            - "${e_flight} == \"ERR_FLIGHT_INVALID_STATE\" at 409 - cancelling a CANCELLED flight is not idempotent, and cancellation_reason keeps its original text"
            - "${e_tfr} == \"ERR_TFR_INVALID_STATE\" at 409 - the restriction stays LIFTED"
            - "${e_clock} == \"ERR_CLOCK_REWIND_FORBIDDEN\" at 409 - setting the clock to its current value is a rewind, because the guard demands strictly greater"
            - "${e_window_tfr} == ${e_window_policy} == ${e_window_past} == \"ERR_INVALID_WINDOW\" at 400 - zero-length, reversed and past-dated intervals all resolve to the one interval code"
            - "the past-dated flight is ERR_INVALID_WINDOW and not ERR_INVALID_REQUEST: planned_start is a well-formed instant that merely precedes the logical clock"

      - name: category_and_airframe_eligibility_gates_are_triggerable
        claim_type: triggerable
        grounds:
          - errors.ERR_RECREATIONAL_OPERATION_FORBIDDEN
          - errors.ERR_AIRCRAFT_NOT_REGISTERED
          - errors.ERR_AIRCRAFT_GROUNDED
          - errors.ERR_PILOT_SUSPENDED
          - validations.priority_27
        distinguishing_aspect: |
          The recreational/commercial distinction and the two airframe states are probed on the
          endpoints that declare them, with the PENDING_REGISTRATION and GROUNDED cases kept
          apart on purpose: priority 18 owns the unregistered airframe and priority 19 owns the
          grounded one, so a single "airframe not usable" code fails here. The knowledge-test
          probe uses a second, still UNCERTIFIED pilot so that the category rule answers rather
          than the pilot-state rule at priority 13.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "Pilot R: RECREATIONAL, CERTIFIED via TRUST_RECREATIONAL at 100. Pilot R2: RECREATIONAL, still UNCERTIFIED."
            - "Airframe AR1 under R: 249 g, REGISTERED. Airframe AR2 under R: 249 g, still PENDING_REGISTRATION."
