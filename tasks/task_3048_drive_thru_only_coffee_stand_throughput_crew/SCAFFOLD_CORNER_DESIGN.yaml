      - name: stale_stand_version_rejected_on_merge
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-merge-stale-stand]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC rule order-merge-stale-stand: a merge carrying a stand version captured before a window order bumped it fails 412; the app order stays QUEUED and can retry with the fresh version."
        test_recipe:
          setup: ["Stand OPEN; app order QUEUED; client holds stale stand version."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
