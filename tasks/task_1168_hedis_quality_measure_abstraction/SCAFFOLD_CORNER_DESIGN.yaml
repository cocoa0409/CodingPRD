            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${mb}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-06-13T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${mb}", span_start: "2025-07-30T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
