              payload: { reviewer_id: "${rev}", occurred_at: "2026-07-15T00:00:00Z", rating: 4 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/certify"
              payload: {}
              as: ProgramAdmin
            # Pre-existing session on R1 at 10:00-11:00 (so any new session at 10:30 would overlap IF room existed)
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rid}" }
              as: ProgramAdmin
              captures: { s1: $.data.id }
            - call: "GET /facilitators/${fid}"
