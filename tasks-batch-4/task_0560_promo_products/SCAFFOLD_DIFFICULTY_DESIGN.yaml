  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: line_min_quantity_boundary_rejects_below
        grounds:
          - validations[priority=7]
          - errors[ERR_BELOW_MIN_QUANTITY]
          - entities.Product.fields.min_order_qty
        distinguishing_aspect: |
          Metric = ordered quantity vs product.min_order_qty (48) at POST /orders/{id}/lines:
          quantity 47 is rejected, quantity 48 (== min, the >= boundary) is accepted.
        test_recipe:
          setup:
            - "Product with min_order_qty 48 and a SCREEN_PRINT 48-tier; a draft order."
          setup_api_calls:
            - { call: "POST /suppliers", payload: { name: "BlankCo", blank_unit_cost_cents: 150, concurrent_capacity_units: 500 }, as: CatalogAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /products", payload: { supplier_id: "${sup_id}", sku: "TOTE", name: "Cotton Tote", min_order_qty: 48 }, as: CatalogAdmin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/price-tiers", payload: { decoration_method: "SCREEN_PRINT", min_quantity: 48, unit_price_cents: 599 }, as: CatalogAdmin }
            - { call: "POST /customers", payload: { name: "Acme", initial_credit_cents: 500000 }, as: CatalogAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "STANDARD", in_hands_date: "2026-05-20T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 47, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 48, imprint_color_count: 1 }, as: Customer, as_user_id: "${cust_id}", captures: { ok_line_id: "$.data.id" } }
          assert:
            - "first trigger response data.error_id == ERR_BELOW_MIN_QUANTITY"
            - "OrderLine.${ok_line_id}.quantity == 48"
            - "OrderLine.${ok_line_id}.status == PENDING_ART"

      - name: qc_spoilage_tolerance_boundary_rejects_underrun
        grounds:
          - calculations.spoilage_tolerance
          - state_machines.OrderLine.QC_HOLD_to_COMPLETED
          - errors[ERR_SPOILAGE_OUT_OF_TOLERANCE]
        distinguishing_aspect: |
          Metric = good_qty vs spoilage band at POST /order-lines/{id}/qc: for ordered 200,
          min_acceptable = 200 - floor(200*0.05) = 190; good_qty 189 (min-1) is rejected —
          a different metric and endpoint than the min-quantity boundary.
        test_recipe:
          setup:
