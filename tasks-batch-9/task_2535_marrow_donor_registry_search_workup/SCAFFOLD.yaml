  # ------------------------------------------------------------- mutations ----
  - method: POST
    path: "/registry/registries"
    description: "Register a domestic or international partner registry"
    roles: [RegistryOperations]
    code: 201
    input: [code, name, country_code, currency_code, fx_rate_to_usd, is_domestic, cooperation_tier, ct_response_deadline_hours, "cooperation_status?"]
    output: Registry
    side_effects: ["donor_count starts at 0"]
  - method: PATCH
    path: "/registry/registries/{id}"
    description: "Update a registry's cooperation state, service tier, FX rate or contractual CT response hours"
    roles: [RegistryOperations]
    code: 200
    input: ["cooperation_status?", "cooperation_tier?", "fx_rate_to_usd?", "ct_response_deadline_hours?"]
    output: Registry
    side_effects:
      - "increments Registry.version by 1"
      - "a new fx_rate_to_usd changes only claims computed after the change; PROVISIONAL claims keep their fx_rate_snapshot until finalize re-reads it"
      - "cooperation_status SUSPENDED or TERMINATED blocks new confirmatory-typing requests against this registry's donors but leaves already REQUESTED rows untouched"
      - "a new ct_response_deadline_hours applies only to typing requests raised afterwards"
  - method: POST
    path: "/registry/collection-centers"
    description: "Register an apheresis / marrow harvest center with its parallel-collection capacity"
    roles: [RegistryOperations]
    code: 201
    input: [name, country_code, concurrent_collection_capacity]
    output: CollectionCenter
    side_effects: ["committed_slot_minutes starts at 0"]
  - method: POST
    path: "/registry/donors"
    description: "Register a donor profile under the acting liaison's registry"
    roles: [DonorRegistryLiaison]
    code: 201
    input: [registry_id, donor_code, age_years, sex, weight_kg, cmv_status, hla_typing_registry, consented_methods, "ambiguous_loci?", "prior_donation_count?", "availability_status?"]
    output: DonorProfile
    side_effects:
      - "registry_id MUST equal X-User-ID, else ERR_REGISTRY_SCOPE_VIOLATION"
      - "Registry.donor_count increases by 1"
      - "blocked_day_count and adverse_event_count start at 0"
  - method: POST
    path: "/registry/donors/{id}/unavailability-windows"
    description: "Block the donor's calendar for a closed inclusive date range (reason PERSONAL or MEDICAL_HOLD only)"
    roles: [DonorRegistryLiaison]
    code: 201
    input: [date_from, date_to, reason]
    output: DonorUnavailability
    side_effects:
      - "day_count is computed as date_to - date_from + 1 and added to DonorProfile.blocked_day_count"
      - "reason DEFERRAL and COLLECTION_WINDOW are refused with ERR_INVALID_REQUEST; source_booking_id stays null"
  - method: DELETE
    path: "/registry/donors/{id}/unavailability-windows/{windowId}"
    description: "Release a donor calendar window; COLLECTION_WINDOW rows are never manually releasable and DEFERRAL rows only after the deferral lapsed"
    roles: [DonorRegistryLiaison]
    code: 204
    input: []
    output: null
    side_effects:
      - "the row's status becomes RELEASED and released_at is stamped; blocked_day_count drops by its day_count"
      - "releasing the last ACTIVE DEFERRAL window returns the donor to availability_status AVAILABLE and clears deferral_until"
  - method: POST
    path: "/registry/donors/{id}/follow-ups"
    description: "File a scheduled follow-up contact or an adverse-event report for the donor"
    roles: [DonorRegistryLiaison, MedicalDirector]
    code: 201
    input: [event_type, severity_grade, "description?"]
    output: DonorFollowUp
    side_effects:
      - "reported_at is stamped from the logical clock; DonorProfile.last_followup_at is updated"
      - "adverse_event_count increases by 1 for event_type ADVERSE_EVENT"
      - "severity_grade >= 4 sets availability_status PERMANENTLY_DEFERRED, records triggered_permanent_deferral true, EXCLUDES the donor's non-terminal candidates and CANCELS their REQUESTED typing requests"
  - method: POST
    path: "/registry/patients"
    description: "Register a transplant patient with HLA typing and a case budget"
    roles: [TransplantCoordinator]
    code: 201
    input: [mrn, transplant_center_code, country_code, diagnosis_code, urgency_tier, weight_kg, cmv_status, hla_typing, case_budget_cents]
    output: Patient
    side_effects:
      - "coordinating_user_id is stamped from X-User-ID"
      - "conditioning_status starts at NOT_SCHEDULED and committed_cost_cents at 0"
  - method: POST
    path: "/registry/patients/{id}/conditioning"
    description: "Drive the patient's conditioning timeline: SCHEDULE (also used to re-schedule), START, INFUSE or ABORT"
    roles: [TransplantCoordinator, MedicalDirector]
    code: 200
    input: [action, expected_patient_version, "conditioning_start_date?", "reason?"]
    output: Patient
    side_effects:
      - "increments Patient.version by 1"
      - "SCHEDULE stores conditioning_start_date and re-derives the legal collection window, cancelling HELD or CONFIRMED bookings that fall outside it"
      - "INFUSE completes the WorkupCase, CLOSES the MatchCandidate and FULFILLS the SearchRequest"
      - "ABORT cancels bookings and shipments, releases the donor's COLLECTION_WINDOW rows and the center's committed minutes, VOIDS the PROVISIONAL claim, restores committed_cost_cents and STALLS the SearchRequest"
      - "SCHEDULE and ABORT accept action-specific bodies: conditioning_start_date is required for SCHEDULE, reason for ABORT"
  - method: POST
    path: "/registry/search-requests"
    description: "Open a preliminary registry search: scores every eligible donor, materializes the top 5 candidates and assigns their roles"
    roles: [TransplantCoordinator]
    code: 201
    input: [patient_id, search_scope, "min_preliminary_score?"]
    output: SearchRequest
    side_effects:
      - "runs match_probability_score (PRELIMINARY) and candidate_rank_score over the eligible donor set"
      - "creates up to MAX_CANDIDATES_MATERIALIZED MatchCandidate rows with frozen rank_position and candidate_role"
      - "sets match_pool_size and backup_candidate_count; an empty pool sets status NO_MATCH_FOUND"
  - method: POST
    path: "/registry/search-requests/{id}/deadline-sweep"
    description: "Expire every overdue confirmatory-typing request of this search, promote a backup when the primary is lost and stall the search when nothing is promotable"
    roles: [RegistryOperations]
    code: 200
    input: []
    output: SearchRequest
    side_effects:
      - "processes REQUESTED typing requests in created_at ASC order; expires only those whose deadline_at is strictly before the current logical instant"
      - "sets candidate status TYPING_EXPIRED, or EXCLUDED once ct_attempt_count == MAX_CT_ATTEMPTS"
      - "runs the promotion cascade and updates status, backup_candidate_count and last_sweep_at"
  - method: POST
    path: "/registry/match-candidates/{id}/typing-requests"
    description: "Ask the donor's registry for allele-level confirmatory typing, with a contractual response deadline"
    roles: [TransplantCoordinator]
    code: 201
    input: ["priority_flag?"]
    output: ConfirmatoryTypingRequest
    side_effects:
      - "increments MatchCandidate.ct_attempt_count and sets its status TYPING_REQUESTED"
      - "computes deadline_at from the donor registry's ct_response_deadline_hours plus INTERNATIONAL_GRACE_HOURS for partner registries, minus PRIORITY_DEADLINE_REDUCTION_HOURS when priority_flag is true"
      - "moves the SearchRequest to PRIMARY_ENGAGED when the candidate is the PRIMARY"
  - method: POST
    path: "/registry/typing-requests/{id}/response"
    description: "The donor's registry answers the confirmatory typing request with allele-level typing and a donor availability answer"
    roles: [DonorRegistryLiaison]
    code: 200
    input: [reported_hla_typing, donor_available_flag]
    output: ConfirmatoryTypingRequest
    side_effects:
      - "stores responded_at, reported_hla_typing and reported_match_grade"
      - "computes MatchCandidate.confirmed_score and confirmed_match_grade with the CONFIRMED variant and moves the candidate to TYPING_RESPONDED"
      - "a grade below MIN_ACCEPTABLE_ALLELE_MATCHES/10 EXCLUDES the candidate and runs the promotion cascade"
      - "donor_available_flag false sets the donor WITHDRAWN, EXCLUDES the candidate and runs the promotion cascade"
  - method: POST
    path: "/registry/match-candidates/{id}/screening"
    description: "Record the donor health screening outcome for this candidate: PASS, DEFER (temporary) or FAIL (permanent)"
    roles: [DonorRegistryLiaison]
    code: 200
    input: [outcome, deferral_type, "deferral_until?", "questionnaire_flags?"]
    output: MatchCandidate
    side_effects:
      - "PASS moves the candidate to SCREENING_PASSED"
      - "DEFER sets the donor TEMPORARILY_DEFERRED with deferral_until, creates an ACTIVE DEFERRAL window raising blocked_day_count, moves the candidate to DEFERRED and runs the promotion cascade for a PRIMARY"
      - "FAIL sets the donor PERMANENTLY_DEFERRED, EXCLUDES the candidate and runs the promotion cascade for a PRIMARY"
  - method: POST
    path: "/registry/match-candidates/{id}/workup-cases"
    description: "Open the donor workup for the primary candidate: creates the three clearance items and the provisional reimbursement claim"
    roles: [TransplantCoordinator]
    code: 201
    input: []
    output: WorkupCase
    side_effects:
      - "creates three ClearanceItem rows in the pinned order PHYSICAL_EXAM, IDM_PANEL, CONSENT, all with result PENDING"
      - "creates a PROVISIONAL ReimbursementClaim with the PROVISIONAL variant of reimbursement_claim_amount and raises Patient.committed_cost_cents by its total_usd_cents"
      - "moves the MatchCandidate to WORKUP_OPEN and the SearchRequest to WORKUP_ACTIVE"
      - "rejected with ERR_PATIENT_BUDGET_EXCEEDED when committed_cost_cents plus the new claim total would exceed case_budget_cents"
  - method: POST
    path: "/registry/clearance-items/{id}/result"
    description: "Record a PASS or FAIL for one clearance item of an open workup case"
    roles: [MedicalDirector]
    code: 200
    input: [result, "note?"]
    output: ClearanceItem
    side_effects:
      - "stamps resulted_at from the logical clock and resulted_by_user_id from X-User-ID"
      - "an IDM_PANEL PASS sets expires_at to resulted_at + IDM_VALIDITY_DAYS and exposes WorkupCase.idm_resulted_at"
      - "a PHYSICAL_EXAM PASS stamps WorkupCase.physical_cleared_by_user_id, which the segregation-of-duties check later compares against the method decider"
      - "the case's clearance_status is re-derived: IN_PROGRESS, CLEARED when all three PASS, FAILED on any FAIL"
      - "a FAIL ABORTS the case, TEMPORARILY_DEFERS the donor for CLEARANCE_FAIL_DEFERRAL_DAYS days, VOIDS the PROVISIONAL claim, restores committed_cost_cents, promotes a backup and moves the SearchRequest to BACKUP_REQUIRED"
  - method: POST
    path: "/registry/workup-cases/{id}/collection-method"
    description: "Authorize the collection method (PBSC or MARROW) for a cleared donor; a second physician is required"
    roles: [MedicalDirector]
    code: 200
    input: [method, rationale]
    output: WorkupCase
    side_effects:
      - "stores collection_method and method_decided_by_user_id, sets logistics_status METHOD_SET and planned_window_days (6 for PBSC, 8 for MARROW)"
      - "increments WorkupCase.version by 1"
      - "refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals physical_cleared_by_user_id"
  - method: POST
    path: "/registry/collection-bookings"
    description: "Book a collection slot at a center for a cleared workup case; a new booking supersedes the case's prior HELD booking"
    roles: [CollectionCenterOps]
    code: 201
    input: [workup_case_id, collection_center_id, start_at, expected_workup_case_version]
    output: CollectionBooking
    side_effects:
      - "increments WorkupCase.version by 1"
      - "copies method from the case, derives duration_minutes, end_at and collection_date"
      - "adds duration_minutes to CollectionCenter.committed_slot_minutes and sets logistics_status BOOKED"
      - "any prior HELD booking of the same case becomes SUPERSEDED and releases its minutes"
      - "rejected with ERR_STALE_WORKUP_VERSION when expected_workup_case_version is not the case's current version"
  - method: POST
    path: "/registry/collection-bookings/{id}/confirm"
    description: "Confirm a held slot; the donor's calendar is blocked over the method-specific collection window"
    roles: [CollectionCenterOps]
    code: 200
    input: []
    output: CollectionBooking
    side_effects:
      - "stamps confirmed_at from the logical clock"
      - "creates an ACTIVE COLLECTION_WINDOW DonorUnavailability row (source_booking_id set) over collection_date - before .. collection_date + after and raises blocked_day_count by its day_count"
      - "rejected with ERR_DONOR_CALENDAR_CONFLICT when that window overlaps any ACTIVE window of the donor"
  - method: POST
    path: "/registry/collection-bookings/{id}/cancel"
    description: "Cancel a held or confirmed collection slot"
    roles: [CollectionCenterOps, MedicalDirector]
    code: 200
    input: [reason]
    output: CollectionBooking
    side_effects:
      - "releases the center's committed_slot_minutes and RELEASES the booking's COLLECTION_WINDOW row, restoring blocked_day_count"
      - "sets cancelled_after_confirmation true when the booking had been CONFIRMED, which adds the CANCELLATION line to the FINAL claim variant"
      - "reverts WorkupCase.logistics_status to METHOD_SET when the case keeps no HELD or CONFIRMED booking"
  - method: POST
    path: "/registry/collection-bookings/{id}/shipments"
    description: "Record the collected product and hand it to the courier"
    roles: [CollectionCenterOps]
    code: 201
    input: [collected_cd34_e6_per_kg, collected_volume_ml, courier_reference]
    output: ProductShipment
    side_effects:
      - "stamps collected_at from the logical clock and computes must_infuse_by = collected_at + VIABILITY_HOURS[method]"
      - "sets dose_adequacy from MIN_CD34_E6_PER_KG"
      - "the booking becomes COMPLETED, the candidate COLLECTED and logistics_status COLLECTED"
  - method: POST
    path: "/registry/shipments/{id}/events"
    description: "Record a courier chain-of-custody event: DEPARTED, DELIVERED or LOST"
    roles: [CollectionCenterOps, RegistryOperations]
    code: 200
    input: [event_type, "note?"]
    output: ProductShipment
    side_effects:
      - "increments transit_event_count and stamps departed_at or delivered_at from the logical clock"
      - "DELIVERED filed after must_infuse_by, or a LOST event, DISCARDS the shipment and sets logistics_status PRODUCT_LOST"
  - method: POST
    path: "/registry/reimbursement-claims/{id}/finalize"
    description: "Recompute the claim with the FINAL variant and close it"
    roles: [RegistryOperations]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects:
      - "sets variant_applied FINAL and recomputes every line, the discount tier, the coordination fee, the total and billed_amount_local_cents with a freshly read fx_rate_snapshot"
      - "stamps finalized_at and moves Patient.committed_cost_cents by the FINAL minus PROVISIONAL delta"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, which every deadline, expiry, viability and calendar rule reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [RegistryOperations]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "no business state changes; only the instant that later reads and writes observe"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the called endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "schema violation: missing required field, wrong type, enum out of range, numeric bound exceeded, malformed HLA typing object, empty consented_methods, or a client-supplied window reason of DEFERRAL or COLLECTION_WINDOW"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer"
  - id: ERR_REGISTRY_NOT_FOUND
    http: 404
    condition: "the registry id in the path or in registry_id does not exist"
  - id: ERR_COLLECTION_CENTER_NOT_FOUND
    http: 404
    condition: "the collection center id in the path or in collection_center_id does not exist"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "the patient id in the path or in patient_id does not exist"
  - id: ERR_SEARCH_REQUEST_NOT_FOUND
    http: 404
    condition: "the search request id in the path does not exist"
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "the donor id in the path does not exist"
  - id: ERR_MATCH_CANDIDATE_NOT_FOUND
    http: 404
    condition: "the match candidate id in the path does not exist"
  - id: ERR_TYPING_REQUEST_NOT_FOUND
    http: 404
    condition: "the confirmatory typing request id in the path does not exist"
  - id: ERR_WORKUP_CASE_NOT_FOUND
    http: 404
    condition: "the workup case id in the path or in workup_case_id does not exist"
  - id: ERR_CLEARANCE_ITEM_NOT_FOUND
    http: 404
    condition: "the clearance item id in the path does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "the collection booking id in the path does not exist"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "the product shipment id in the path does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the reimbursement claim id in the path does not exist"
  - id: ERR_UNAVAILABILITY_WINDOW_NOT_FOUND
    http: 404
    condition: "the window id in the path does not exist, or belongs to a different donor than the path donor"
  - id: ERR_PATIENT_NOT_OWNED
    http: 403
    condition: "a TransplantCoordinator acts on a patient whose coordinating_user_id differs from X-User-ID"
  - id: ERR_REGISTRY_SCOPE_VIOLATION
    http: 403
    condition: "a DonorRegistryLiaison acts on a donor, window, follow-up, typing request or screening whose donor belongs to a registry other than X-User-ID"
  - id: ERR_CENTER_SCOPE_VIOLATION
    http: 403
    condition: "a CollectionCenterOps user acts on a booking or shipment whose collection_center_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the MedicalDirector deciding the collection method is the same user who recorded the PHYSICAL_EXAM clearance result on that case"
  - id: ERR_SEARCH_ALREADY_TERMINAL
    http: 409
    condition: "the search request is NO_MATCH_FOUND, FULFILLED or STALLED and no longer accepts workflow operations"
  - id: ERR_INVALID_CANDIDATE_STATE
    http: 409
    condition: "the match candidate's status does not permit the requested operation"
  - id: ERR_CANDIDATE_NOT_PRIMARY
    http: 409
    condition: "a workup case is opened for a candidate whose candidate_role is BACKUP or ARCHIVED_POOL"
  - id: ERR_TYPING_REQUEST_NOT_OPEN
    http: 409
    condition: "a response is filed against a typing request that is RESPONDED, EXPIRED or CANCELLED"
  - id: ERR_DONOR_NOT_AVAILABLE
    http: 409
    condition: "a screening PASS is recorded while the donor is TEMPORARILY_DEFERRED, PERMANENTLY_DEFERRED or WITHDRAWN"
  - id: ERR_WORKUP_CASE_NOT_OPEN
    http: 409
    condition: "the workup case is COMPLETED or ABORTED"
  - id: ERR_CLEARANCE_ITEM_ALREADY_RESULTED
    http: 409
    condition: "the clearance item already carries PASS or FAIL"
  - id: ERR_CLEARANCE_ORDER_VIOLATION
    http: 409
    condition: "a clearance item is resulted before its predecessors in the pinned order PHYSICAL_EXAM, IDM_PANEL, CONSENT all carry PASS"
  - id: ERR_METHOD_ALREADY_DECIDED
    http: 409
    condition: "the workup case already carries a collection_method"
  - id: ERR_METHOD_NOT_DECIDED
    http: 409
    condition: "a booking is created for a case whose collection_method is still null"
  - id: ERR_CLEARANCE_NOT_COMPLETE
    http: 409
    condition: "a booking is created for a case whose clearance_status is not CLEARED"
  - id: ERR_BOOKING_NOT_HELD
    http: 409
    condition: "confirm is called on a booking that is not HELD"
  - id: ERR_BOOKING_NOT_CANCELLABLE
    http: 409
    condition: "cancel is called on a booking that is COMPLETED, CANCELLED or SUPERSEDED, or that already has a shipment"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "a shipment is recorded against a booking that is not CONFIRMED, or that already has a shipment"
  - id: ERR_CONDITIONING_NOT_STARTED
    http: 409
    condition: "a shipment is recorded while the patient's conditioning_status is not STARTED"
  - id: ERR_INVALID_CONDITIONING_ACTION
    http: 409
    condition: "the requested conditioning action is not legal from the patient's current conditioning_status"
  - id: ERR_CONDITIONING_PRECONDITION_UNMET
    http: 409
    condition: "SCHEDULE without a WORKUP_ACTIVE search, or START without a CONFIRMED booking on the patient's open workup case"
  - id: ERR_PRODUCT_NOT_DELIVERED
    http: 409
    condition: "INFUSE is requested while no shipment of the patient's workup case is DELIVERED"
  - id: ERR_SHIPMENT_EVENT_NOT_ALLOWED
    http: 409
    condition: "DEPARTED filed on a shipment that is not SCHEDULED, or DELIVERED / LOST filed on a shipment that is not IN_TRANSIT"
  - id: ERR_CLAIM_NOT_PROVISIONAL
    http: 409
    condition: "finalize is called on a claim that is already FINALIZED or VOID"
  - id: ERR_CLAIM_NOT_FINALIZABLE
    http: 409
    condition: "finalize is called while the claim's workup case is neither COMPLETED nor holder of a booking cancelled after confirmation"
  - id: ERR_WINDOW_NOT_RELEASABLE
    http: 409
    condition: "release is called on a COLLECTION_WINDOW row, on an already RELEASED row, or on a DEFERRAL row whose deferral_until has not yet passed"
  - id: ERR_STALE_WORKUP_VERSION
    http: 412
    condition: "expected_workup_case_version does not equal the workup case's current version"
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the patient's current version"
  - id: ERR_IDM_RESULT_EXPIRED
    http: 422
    condition: "the requested collection_date falls after the UTC date of the IDM_PANEL clearance item's expires_at"
  - id: ERR_DONOR_METHOD_NOT_CONSENTED
    http: 422
    condition: "the authorized collection method is absent from the donor's consented_methods"
  - id: ERR_SCREENING_OUTCOME_MISMATCH
    http: 422
    condition: "outcome and deferral_type disagree, or deferral_until is missing / not in the future for a DEFER, or supplied for PASS or FAIL"
  - id: ERR_ADVERSE_EVENT_GRADE_INVALID
    http: 422
    condition: "severity_grade is non-zero for a contact event, or zero for an ADVERSE_EVENT"
  - id: ERR_PRODUCT_DOSE_INADEQUATE
    http: 422
    condition: "INFUSE is requested for a DELIVERED shipment whose dose_adequacy is INADEQUATE"
  - id: ERR_REGISTRY_NOT_COOPERATING
    http: 422
    condition: "a confirmatory typing request targets a donor whose registry cooperation_status is SUSPENDED or TERMINATED"
  - id: ERR_CT_TYPING_NOT_ALLELE_LEVEL
    http: 422
    condition: "reported_hla_typing contains an antigen-level string at any of the five loci"
  - id: ERR_CT_DEADLINE_PASSED
    http: 422
    condition: "a typing response is filed strictly after the request's deadline_at"
  - id: ERR_CONDITIONING_DATE_IN_PAST
    http: 422
    condition: "conditioning_start_date is earlier than the current logical UTC date"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "date_to is earlier than date_from on a donor calendar window"
  - id: ERR_COLLECTION_OUTSIDE_CONDITIONING_WINDOW
    http: 422
    condition: "the requested collection_date is outside conditioning_start_date + 6 .. + 8 days, or the patient is not yet SCHEDULED"
  - id: ERR_PRODUCT_VIABILITY_EXPIRED
    http: 422
    condition: "INFUSE is requested strictly after the shipment's must_infuse_by"
  - id: ERR_DONOR_CALENDAR_CONFLICT
    http: 409
    condition: "the requested or derived donor window overlaps an ACTIVE window of the same donor under closed inclusive whole-day comparison"
  - id: ERR_CENTER_SLOT_CONFLICT
    http: 409
    condition: "the number of the center's buffered overlapping HELD, CONFIRMED and COMPLETED bookings has reached concurrent_collection_capacity"
  - id: ERR_CT_ATTEMPTS_EXHAUSTED
    http: 422
    condition: "a third confirmatory typing request is raised for the same candidate"
  - id: ERR_DUPLICATE_OPEN_WORKUP
    http: 409
    condition: "the candidate already has a workup case in case_status OPEN"
  - id: ERR_SEARCH_ALREADY_ACTIVE
    http: 409
    condition: "the patient already has a search request in SEARCHING, PRIMARY_ENGAGED, WORKUP_ACTIVE or BACKUP_REQUIRED"
  - id: ERR_MRN_ALREADY_EXISTS
    http: 409
    condition: "another patient already uses this mrn"
  - id: ERR_REGISTRY_CODE_ALREADY_EXISTS
    http: 409
    condition: "another registry already uses this code"
  - id: ERR_DONOR_CODE_ALREADY_EXISTS
    http: 409
    condition: "another donor of the same registry already uses this donor_code"
  - id: ERR_PATIENT_BUDGET_EXCEEDED
    http: 402
    condition: "committed_cost_cents plus the new provisional claim total would exceed the patient's case_budget_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TransplantCoordinator
    description: "Owns the patient's case: registers the patient, opens the registry search, drives confirmatory-typing requests, opens the donor workup and manages the conditioning timeline"
    identity: opaque
    exclusive_operations:
      - "POST /registry/patients"
      - "POST /registry/search-requests"
      - "POST /registry/match-candidates/{id}/typing-requests"
      - "POST /registry/match-candidates/{id}/workup-cases"
    shared_operations:
      - "POST /registry/patients/{id}/conditioning (shared with MedicalDirector)"
      - "every patient, search, candidate, workup, booking, shipment and claim read"
    note: "Ownership is enforced against Patient.coordinating_user_id, which is stamped from X-User-ID at patient creation; the opaque id is never compared to an entity id."
  - name: DonorRegistryLiaison
    description: "Acts on behalf of one registry: registers its donors, answers confirmatory-typing requests, records health screening, maintains donor calendars and files follow-ups"
    identity: "entity_backed:Registry"
    exclusive_operations:
      - "POST /registry/donors"
      - "POST /registry/donors/{id}/unavailability-windows"
      - "DELETE /registry/donors/{id}/unavailability-windows/{windowId}"
      - "POST /registry/typing-requests/{id}/response"
      - "POST /registry/match-candidates/{id}/screening"
    shared_operations:
      - "POST /registry/donors/{id}/follow-ups (shared with MedicalDirector)"
      - "donor, candidate, typing-request and registry reads"
    note: "X-User-ID equals a Registry.id; every donor-scoped write requires DonorProfile.registry_id == X-User-ID."
  - name: MedicalDirector
    description: "Physician authority for donor safety: records clearance results, authorizes the collection method, drives conditioning start / infusion / abort and files adverse events"
    identity: opaque
    exclusive_operations:
      - "POST /registry/clearance-items/{id}/result"
      - "POST /registry/workup-cases/{id}/collection-method"
    shared_operations:
      - "POST /registry/patients/{id}/conditioning (shared with TransplantCoordinator)"
      - "POST /registry/collection-bookings/{id}/cancel (shared with CollectionCenterOps)"
      - "POST /registry/donors/{id}/follow-ups (shared with DonorRegistryLiaison)"
      - "patient, candidate, workup, clearance, booking, shipment and claim reads"
    note: "Segregation of duties: the opaque id that recorded the PHYSICAL_EXAM result on a case is barred from that case's collection-method decision."
  - name: CollectionCenterOps
    description: "Acts on behalf of one collection center: books and confirms slots, records the collected product and files courier events"
    identity: "entity_backed:CollectionCenter"
    exclusive_operations:
      - "POST /registry/collection-bookings"
      - "POST /registry/collection-bookings/{id}/confirm"
      - "POST /registry/collection-bookings/{id}/shipments"
    shared_operations:
      - "POST /registry/collection-bookings/{id}/cancel (shared with MedicalDirector)"
      - "POST /registry/shipments/{id}/events (shared with RegistryOperations)"
      - "booking, shipment, workup, donor-window and center reads"
    note: "X-User-ID equals a CollectionCenter.id; every booking write requires collection_center_id == X-User-ID."
  - name: RegistryOperations
    description: "National program operations: maintains registries and collection centers, runs the deadline sweep, finalizes reimbursement claims and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /registry/registries"
      - "PATCH /registry/registries/{id}"
      - "POST /registry/collection-centers"
      - "POST /registry/search-requests/{id}/deadline-sweep"
      - "POST /registry/reimbursement-claims/{id}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /registry/shipments/{id}/events (shared with CollectionCenterOps)"
      - "every read endpoint"
    note: "Purely operational: RegistryOperations may not perform any clinical write (no clearance result, no method decision, no conditioning action, no screening)."
