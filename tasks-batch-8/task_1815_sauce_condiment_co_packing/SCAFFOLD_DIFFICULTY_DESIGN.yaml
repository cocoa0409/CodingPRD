            - "GET /copack/quality-holds?production_run_id=${r1} returns empty list (total_count == 0)"
            - "ProductionRun.${r1}.final_charge_cents == 735000 (2000*120 + 15000 + 0.8*2000*300, no packaging requirements)"

      - name: packaging_exact_availability_allows_confirm
        grounds:
          - calculations.packaging_availability_check
          - "errors[ERR_PACKAGING_SHORTAGE]"
        distinguishing_aspect: |
          Metric component units at POST confirm (different endpoint and metric than
          the pH boundary): shortage predicate is strictly-greater (required >
          available), so required exactly equal to available 2000 confirms
          successfully and drives available_units to exactly 0.
        test_recipe:
          setup:
            - "Customer c1 credit 100000000; formula f2 (ACID, NONE, min 500, rate 200, salt COPACKER 0.1 @50) APPROVED; kettle k1; bottle bx @10 with initial_on_hand 2000; run r1 planned 2000 requiring 1 bottle/unit"
