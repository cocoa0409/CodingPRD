            - call: "POST /studio/projects"
              payload: { client_id: "${c2}", title: "P2", upc: "222222222222", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T13:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${c2}"
          trigger:
            - call: "GET /studio/projects?client_id=${c1}"
              as: StudioManager
          assert:
            - "response.data is array of length 1"
            - "response.data[0].client_id == ${c1}"
            - "response.meta has api_request_id"
            - "response contains pagination fields limit, offset, total_count, has_more"

      - name: response_envelope_success_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success envelope has meta.api_request_id, meta.api_request_timestamp, response_type=object, data"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
          assert:
            - "response.meta.api_request_id is non-empty string"
            - "response.meta.api_request_timestamp matches ISO-8601"
            - "response.response_type == 'object'"
            - "response.data contains id, status, version, created_at, updated_at"

      - name: response_envelope_error_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Error envelope has response_type=error and data.error_id, data.message"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "GET /studio/projects/00000000-0000-0000-0000-000000000000"
              as: StudioManager
          assert:
            - "response.response_type == 'error'"
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.data.message is non-empty"

