      - name: schema_check_precedes_the_missing_price_rule_and_a_new_rule_reopens_pricing
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - validations[priority=53]
          - calculations.price_rule_selector
          - endpoints[POST /chargemaster/change-requests]
        distinguishing_aspect: "Once the clock passes the only rule's effective_to (2026-10-01) the candidate set is empty, so reprice and the change-request dry run both return ERR_NO_APPLICABLE_PRICE_RULE (422) — but a 7-character justification still returns ERR_VALIDATION first. Creating a FLAT_FEE successor rule immediately reopens pricing: gross moves 240000 -> 500000 and the dry run projects 500000 while ignoring proposed_cost_basis_cents entirely."
        test_recipe:
          setup:
