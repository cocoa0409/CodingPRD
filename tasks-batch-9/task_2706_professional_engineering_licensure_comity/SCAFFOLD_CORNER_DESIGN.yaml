      - name: license_reinstate_after_expiry_opens_fresh_biennium
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /licenses/{license_id}/reinstate]
          - calculations.license_period_roll
          - state_machines.License.transitions.EXPIRED_to_ACTIVE
        distinguishing_aspect: "Unlike renew (which chains off the old period_end), reinstate restarts the biennium at the reinstatement instant: from clock 2028-02-01 the period becomes 2028-02-01..2030-02-01 with renewal_window_opens_at 2029-11-03, and reinstatement_eligible_until is cleared."
        test_recipe:
          setup:
            - "Engineer 'Hana Brix' held an ACTIVE STANDARD licence issued 2026-01-15 (period ends 2028-01-15)."
            - "The logical clock has been advanced to 2028-02-01T00:00:00Z, so the sweep has moved the licence ACTIVE -> EXPIRED and stamped reinstatement_eligible_until 2030-01-14T00:00:00.000Z (period_end + 730 days)."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Hana Brix", email: "hana.brix@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_hana: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_hana}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_hana: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-1"
          trigger:
            - call: "POST /licenses/${lic_hana}/reinstate"
              payload: { makeup_pdh: 15, reinstatement_fee_cents: 45000 }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
          assert:
            - "trigger[0] http_status == 200"
            - "trigger[0] response.data.status == \"ACTIVE\""
            - "trigger[0] response.data.current_period_start == \"2028-02-01T00:00:00.000Z\""
            - "trigger[0] response.data.current_period_end == \"2030-02-01T00:00:00.000Z\""
            - "trigger[0] response.data.renewal_window_opens_at == \"2029-11-03T00:00:00.000Z\""
            - "trigger[0] response.data.reinstatement_eligible_until == null"
            - "trigger[0] response.data.suspension_ends_at == null"
            - "Engineer.${eng_hana}.active_license_number == License.${lic_hana}.license_number"

