      - name: pact_version_mismatch_is_evaluated_before_capacity_and_returns_412
        layer: optimistic_concurrency
        claim_type: Optimistic concurrency
        grounds:
          - concurrency_rules.aid-commitment-stale-pact
          - validations.priority_25_ERR_STALE_PACT_VERSION
          - validations.priority_48_ERR_AID_CAPACITY_EXCEEDED
        distinguishing_aspect: "One request is both stale and over capacity: it returns 412 ERR_STALE_PACT_VERSION, and only after the version is refreshed does the identical body reveal 409 ERR_AID_CAPACITY_EXCEEDED, so the concurrency gate strictly precedes the capacity gate."
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions; one shared HEALTH asset in Harbor; one OPEN MutualAidPact hosted by Harbor pledging 10 units; one COMMITTED commitment from Ridge for 6 units."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
