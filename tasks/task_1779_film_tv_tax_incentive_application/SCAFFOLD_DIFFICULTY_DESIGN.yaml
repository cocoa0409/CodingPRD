            - { call: "GET /api/jurisdiction-programs/${prog_id}", as: FilmOfficeAdmin, captures: { rem_after: $.data.remaining_cap_cents, alloc_after: $.data.allocated_credit_cents } }
            - { call: "POST /api/applications/${app_b}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { err: $.data.error_id } }
