            - call: "POST /practice/clients"
              payload: { full_name: "Client TO", email: "to@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tblX}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tblX_v}" }
              as: FrontDesk
              captures: { apX: $.data.id }
          trigger:
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tblY}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T09:30:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tblY_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_THERAPIST_DOUBLE_BOOKED"
            - "HTTP status == 409"

  # =========================================================================
