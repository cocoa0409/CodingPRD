  # ==================== validations (remaining error coverage) ====
  - section: validations
    instances:
      - name: record_purchase_requires_under_contract_lot
        claim_type: violation_to_error
        grounds:
          - state_machines.Resident.PROSPECT_to_PURCHASER
          - "errors[ERR_LOT_NOT_UNDER_CONTRACT]"
        distinguishing_aspect: "record-purchase against an OFFERED (not yet escrowed) lot fails ERR_LOT_NOT_UNDER_CONTRACT — the purchase record must trail a real escrow."
        test_recipe:
          setup: ["ACTIVE community; phase SALES_OPEN; lot OFFERED; prospect resident"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Purchase Point", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "P1" }
              as: DeclarantExecutive
              captures: { l1_id: $.data.id }
            - call: "POST /mpc/lots/${l1_id}/offer"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/residents"
              payload: { community_id: "${c_id}", full_name: "Peter Prospect", email: "peter@x.com" }
              as: LifestyleCoordinator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /mpc/residents/${r_id}/record-purchase"
              payload: { lot_id: "${l1_id}" }
              as: LifestyleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LOT_NOT_UNDER_CONTRACT (409); resident stays PROSPECT"

      - name: fiscal_year_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FISCAL_YEAR_MISMATCH]"
          - entities.AssessmentRate.fields.fiscal_year
        distinguishing_aspect: "A rate whose fiscal_year (2028) differs from its budget's fiscal_year (2027) is a 422 referential error even though the budget is ADOPTED."
        test_recipe:
          setup: ["ACTIVE community; FY2027 budget ADOPTED"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Mismatch Meadows", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/budgets"
              payload: { community_id: "${c_id}", fiscal_year: 2027 }
              as: DeclarantController
              captures: { bud_id: $.data.id }
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "MANAGEMENT", amount_cents: 100000 }
              as: DeclarantController
            - call: "POST /mpc/budgets/${bud_id}/propose"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/notices"
              payload: { community_id: "${c_id}", notice_type: "BUDGET_ADOPTION", subject: "b", body: "adopt", send_at: "2026-05-02T00:00:00Z", budget_id: "${bud_id}" }
              as: LifestyleCoordinator
              captures: { n_id: $.data.id }
            - call: "POST /mpc/notices/${n_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mpc/budgets/${bud_id}/adopt"
              payload: {}
              as: AssociationDirector
          trigger:
            - call: "POST /mpc/assessment-rates"
              payload: { community_id: "${c_id}", budget_id: "${bud_id}", fiscal_year: 2028 }
              as: DeclarantController
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FISCAL_YEAR_MISMATCH (422); no rate row is created"

  # ==================== rbac (reviewer rotation SoD) ====
  - section: rbac
    instances:
      - name: reviewer_conflict_rotation
        claim_type: role_denied
        grounds:
          - "errors[ERR_REVIEWER_CONFLICT]"
          - state_machines.DesignReviewApplication.RESUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: "Reviewer rotation SoD: the reviewer who denied round 1 cannot claim the round-2 resubmission (403 ERR_REVIEWER_CONFLICT); a different reviewer can."
        test_recipe:
          setup: ["ACTIVE community; builder application denied by reviewer rev-1 and resubmitted (round 2, RESUBMITTED)"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Rotation Ridge", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "R1" }
              as: DeclarantExecutive
              captures: { l1_id: $.data.id }
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "Rotation Builders", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { b_id: $.data.id }
            - call: "POST /mpc/applications"
              payload: { community_id: "${c_id}", lot_id: "${l1_id}", project_type: "LANDSCAPE", applicant_builder_id: "${b_id}" }
              as: BuilderRep
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mpc/applications/${app_id}/begin-review"
              payload: {}
              as: DesignReviewer
              as_user_id: "rev-1"
            - call: "POST /mpc/applications/${app_id}/deny"
              payload: { denial_reason: "species palette" }
              as: DesignReviewer
              as_user_id: "rev-1"
            - call: "POST /mpc/applications/${app_id}/resubmit"
              payload: {}
              as: BuilderRep
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /mpc/applications/${app_id}/begin-review"
              payload: {}
              as: DesignReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
            - call: "POST /mpc/applications/${app_id}/begin-review"
              payload: {}
              as: DesignReviewer
              as_user_id: "rev-2"
              captures: { ok_status: $.data.status, ok_reviewer: $.data.reviewer_user_id }
          assert:
            - "latest denier rev-1 claiming the resubmission -> ${err} == ERR_REVIEWER_CONFLICT (403)"
            - "fresh reviewer rev-2 -> ${ok_status} == UNDER_REVIEW and ${ok_reviewer} == rev-2"
