            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MOISTURE, measured_value: 9.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 0.5, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1", captures: { st: $.data.status } }
          assert:
            - "incomplete suite: ${err} == ERR_TEST_SUITE_INCOMPLETE (HTTP 409)"
            - "after the missing ADULTERANT_SCREEN PASS: ${st} == ACCEPTED"

      - name: blend_run_create_requires_active_formula
        claim_type: violation_to_error
        grounds:
