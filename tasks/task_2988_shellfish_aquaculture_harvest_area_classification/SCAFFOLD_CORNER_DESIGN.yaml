            - "data.error_id is not ERR_DEALER_NOT_LISTED_FOR_INTERSTATE (is_interstate is false) and not ERR_DEALER_SUSPENDED"
            - "GET /shellfish/dealers/${dealer} reports listing_status == NOT_LISTED and icssl_listed_through == null"
