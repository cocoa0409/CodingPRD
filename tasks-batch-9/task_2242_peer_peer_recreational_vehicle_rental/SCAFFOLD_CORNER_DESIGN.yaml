      - name: three_claims_fill_the_deductible_bucket_before_the_plan_pays
        claim_type: waterfall_allocation
        grounds:
          - calculations.damage_claim_adjudication
          - calculations.final_trip_total
          - state_machines.DamageClaim.transitions.UNDER_REVIEW_to_APPROVED
          - state_machines.DamageClaim.transitions.UNDER_REVIEW_to_PARTIAL
          - state_machines.DamageClaim.transitions.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: >-
          Three claims on one booking exercise all three exit states and both
          waterfall buckets: an AWNING_WIND ROOF claim is DENIED at gross 0 by
          the plan exclusion regardless of its NO_VISIBLE_CHANGE verdict; an
          INTERIOR COLLISION claim of 220000 with NO_VISIBLE_CHANGE halves to
          gross 110000 which sits entirely inside the 150000 deductible, so
          renter_charge 110000 / plan_paid 0 / PARTIAL; an EXTERIOR_REAR
          COLLISION claim of 220000 with NEW_DAMAGE stays at 220000 and
          OVERFLOWS the deductible, so renter_charge 150000 / plan_paid 70000 /
          APPROVED. Only APPROVED and PARTIAL feed final_total_cents, giving
          411876 and balance_due_cents 265813.
        test_recipe:
          setup: >-
            The canonical trip at RETURNED (final_total 151876, hold 146063),
            three DamageClaims filed against it (ROOF/AWNING_WIND/80000,
            INTERIOR/COLLISION/220000, EXTERIOR_REAR/COLLISION/220000), each
            moved to UNDER_REVIEW by the ClaimsAdjuster.
          setup_api_calls:
            - *k_clock
            - *k_owner
            - *k_renter
            - *k_season_peak
