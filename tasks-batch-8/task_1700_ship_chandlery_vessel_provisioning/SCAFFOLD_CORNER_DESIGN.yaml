              as_user_id: "${vc73}"
          trigger:
            - call: "POST /chandlery/requisitions/${req72}/quotations"
              payload: { lines: [{ catalog_item_id: "${fishC10}", qty: 10, unit_price_cents: 2500, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo72: $.data.id, tot72: $.data.provisional_total_cents }
            - call: "POST /chandlery/requisitions/${req73}/quotations"
