            - "CalcinerBatch.${b1_id}.status == COMPLETED and CalcinerBatch.${b3_id}.status == ABORTED before the triggers"
            - "the first trigger returned 201: the 10:00Z-14:00Z window fully overlaps COMPLETED B1 yet the summed live rate is only 40.0 tph <= 60"
            - "the second trigger returned 201: the 17:00Z-19:00Z window sits inside ABORTED B3 yet the summed live rate is only 20.0 tph"
            - "the third trigger returned status 409 with ${err_id} == ERR_CALCINER_CAPACITY_EXCEEDED (12:00Z-14:00Z carries PLANNED ${b_over_completed} at 40.0 plus this 40.0 = 80.0 tph)"
            - "the rejected call created no batch: GET /plant-ops/calciner-batches?plant_id=${plant_id} returns total_count == 4"

      - name: freight_zone_boundaries_fall_at_150_350_and_600_miles
        claim_type: tiered_pricing
        grounds:
          - calculations.freight_charge
          - entities.Market.fields.rate_zone
        distinguishing_aspect: |
          Zone selection uses an inclusive lower and exclusive upper bound, so 149 mi is ZONE_1 and 150 mi
          is already ZONE_2, 349/350 splits ZONE_2 from ZONE_3 and 599/600 splits ZONE_3 from ZONE_4 —
          six markets one mile apart in pairs pin all three cut points.
        test_recipe:
          setup:
            - "Empty database; all six markets share fuel_surcharge_pct 10.0 and min_charge_usd 100.00 so only distance differs."
          setup_api_calls: []
          trigger:
            - call: "POST /plant-ops/markets"
              payload: { name: "M149", distance_miles: 149, fuel_surcharge_pct: 10.0, min_charge_usd: 100.00 }
              as: PlantAdmin
              captures: { m149: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "M150", distance_miles: 150, fuel_surcharge_pct: 10.0, min_charge_usd: 100.00 }
              as: PlantAdmin
              captures: { m150: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "M349", distance_miles: 349, fuel_surcharge_pct: 10.0, min_charge_usd: 100.00 }
              as: PlantAdmin
              captures: { m349: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "M350", distance_miles: 350, fuel_surcharge_pct: 10.0, min_charge_usd: 100.00 }
              as: PlantAdmin
              captures: { m350: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "M599", distance_miles: 599, fuel_surcharge_pct: 10.0, min_charge_usd: 100.00 }
              as: PlantAdmin
              captures: { m599: $.data.id }
            - call: "POST /plant-ops/markets"
              payload: { name: "M600", distance_miles: 600, fuel_surcharge_pct: 10.0, min_charge_usd: 100.00 }
              as: PlantAdmin
              captures: { m600: $.data.id }
          assert:
            - "Market.${m149}.rate_zone == ZONE_1 and base_rate_per_msf == 8.50"
            - "Market.${m150}.rate_zone == ZONE_2 and base_rate_per_msf == 12.75"
            - "Market.${m349}.rate_zone == ZONE_2 and base_rate_per_msf == 12.75"
            - "Market.${m350}.rate_zone == ZONE_3 and base_rate_per_msf == 17.40"
            - "Market.${m599}.rate_zone == ZONE_3 and base_rate_per_msf == 17.40"
            - "Market.${m600}.rate_zone == ZONE_4 and base_rate_per_msf == 23.10"

      - name: free_water_at_pass_ceiling_versus_marginal_band
        claim_type: threshold
        grounds:
          - calculations.stucco_test_result
          - state_machines.CalcinerBatch.status.CALCINING_to_COMPLETED
        distinguishing_aspect: |
          FREE_WATER_PASS_MAX 0.30 is inclusive, so 0.30 % is a clean PASS while 0.40 % lands in the
          MARGINAL band below FREE_WATER_FAIL_MAX 0.50; both dispositions complete the batch and credit
          the silo, and only the batch's stucco_quality_flag differs — which is what later gates a
          fire-rated run.
