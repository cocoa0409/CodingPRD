scaffold_corner_design:
  - section: entities
    instances:
      - name: builder_creation_returns_system_fields_and_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Builder
          - endpoints[POST /builders]
        distinguishing_aspect: "A builder created with only name/builder_type/utility_program_budget_cents comes back ACTIVE, sampling_eligible true, all four counters 0 and version 1; a server that left sampling_eligible null or version 0 fails."
        test_recipe:
          setup:
            - "Empty database; no prior calls needed"
          setup_api_calls: []
          trigger:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Builder.${c_b1}.status == ACTIVE"
            - "Builder.${c_b1}.sampling_eligible == true"
            - "Builder.${c_b1}.open_corrective_action_count == 0"
            - "Builder.${c_b1}.revoked_package_count == 0"
            - "Builder.${c_b1}.certified_incentive_cents == 0"
            - "Builder.${c_b1}.utility_program_budget_cents == 250000"
            - "Builder.${c_b1}.version == 1"
            - "response body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: subdivision_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Subdivision.fields.sampling_enabled
          - entities.Subdivision.fields.compliance_path_preference
          - endpoints[POST /subdivisions]
        distinguishing_aspect: "Omitting sampling_enabled and compliance_path_preference yields false and ERI_PATH respectively, with homes_count/sampled/unsampled all 0 — not null and not PRESCRIPTIVE_PATH."
        test_recipe:
          setup:
            - "One builder exists"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b2: $.data.id }
          trigger:
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b2}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ5" }
              as: RatingProviderAdmin
              captures: { c_sd2: $.data.id }
          assert:
            - "Subdivision.${c_sd2}.sampling_enabled == false"
            - "Subdivision.${c_sd2}.compliance_path_preference == ERI_PATH"
            - "Subdivision.${c_sd2}.homes_count == 0"
            - "Subdivision.${c_sd2}.sampled_home_count == 0"
            - "Subdivision.${c_sd2}.unsampled_home_count == 0"
            - "Subdivision.${c_sd2}.climate_zone == CZ5"

      - name: home_retrieval_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Home
          - endpoints[GET /homes/{id}]
        distinguishing_aspect: "GET /homes/{id} echoes the stored lot_number/permit_date/FKs and the untouched sampling defaults (sampling_role UNASSIGNED, sample_set_id null, individual_testing_required false)."
        test_recipe:
          setup:
            - "Builder, subdivision, plan model and one home L-2001 exist"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b3: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b3}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd3: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r3: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd3}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${c_r3}"
              captures: { c_pm3: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd3}", plan_model_id: "${c_pm3}", lot_number: "L-2001", permit_date: "2026-08-10" }
              as: BuilderRep
              as_user_id: "${c_b3}"
              captures: { c_h3: $.data.id }
          trigger:
            - call: "GET /homes/${c_h3}"
              payload: {}
              as: BuilderRep
              as_user_id: "${c_b3}"
          assert:
            - "HTTP status == 200"
            - "Home.${c_h3}.lot_number == L-2001"
            - "Home.${c_h3}.permit_date == 2026-08-10"
            - "Home.${c_h3}.subdivision_id == ${c_sd3}"
            - "Home.${c_h3}.plan_model_id == ${c_pm3}"
            - "Home.${c_h3}.sampling_role == UNASSIGNED"
            - "Home.${c_h3}.sample_set_id == null"
            - "Home.${c_h3}.individual_testing_required == false"
            - "Subdivision.${c_sd3}.homes_count == 1"
            - "Subdivision.${c_sd3}.unsampled_home_count == 1"

      - name: homes_listing_filters_by_subdivision_and_paginates
        claim_type: Listing
        grounds:
          - endpoints[GET /homes]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three homes in one subdivision, limit 2 / offset 0 returns exactly 2 items with total_count 3 and has_more true, and offset 2 returns the last item with has_more false — filter, count and page flag must all agree."
        test_recipe:
          setup:
            - "One subdivision with three homes L-2101, L-2102, L-2103 created in that order"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b4: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b4}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd4: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r4: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd4}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${c_r4}"
              captures: { c_pm4: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd4}", plan_model_id: "${c_pm4}", lot_number: "L-2101", permit_date: "2026-08-10" }
              as: BuilderRep
              as_user_id: "${c_b4}"
              captures: { c_h4a: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd4}", plan_model_id: "${c_pm4}", lot_number: "L-2102", permit_date: "2026-08-11" }
              as: BuilderRep
              as_user_id: "${c_b4}"
              captures: { c_h4b: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd4}", plan_model_id: "${c_pm4}", lot_number: "L-2103", permit_date: "2026-08-12" }
              as: BuilderRep
              as_user_id: "${c_b4}"
              captures: { c_h4c: $.data.id }
          trigger:
            - call: "GET /homes"
              payload: { subdivision_id: "${c_sd4}", limit: 2, offset: 0 }
              as: BuilderRep
              as_user_id: "${c_b4}"
            - call: "GET /homes"
              payload: { subdivision_id: "${c_sd4}", limit: 2, offset: 2 }
              as: BuilderRep
              as_user_id: "${c_b4}"
          assert:
            - "the first page returns exactly 2 items with total_count == 3 and has_more == true"
            - "the second page returns exactly 1 item with total_count == 3 and has_more == false"
            - "the second page's single item is Home.${c_h4c}"
            - "response_type == array on both pages"

      - name: get_rating_with_unknown_id_returns_404_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RATING_NOT_FOUND]
          - endpoints[GET /ratings/{id}]
        distinguishing_aspect: "A well-formed but unknown UUID on GET /ratings/{id} returns ERR_RATING_NOT_FOUND with HTTP 404 in the §1.0 error envelope, never an empty 200 body."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /ratings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RatingProviderAdmin
              captures: { c_err1: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_RATING_NOT_FOUND"
            - "response_type == error"

      - name: plan_model_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /plan-models]
        distinguishing_aspect: "Omitting conditioned_volume_cuft (an input field with no default) is rejected with ERR_INVALID_REQUEST 422 before any database read, so no PlanModel row is created."
        test_recipe:
          setup:
            - "Builder, subdivision and an ACTIVE RATER exist"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b5: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b5}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd5: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r5: $.data.id }
          trigger:
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd5}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9 }
              as: CertifiedRater
              as_user_id: "${c_r5}"
              captures: { c_err2: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /subdivisions/${c_sd5}/plan-models returns exactly 0 items"

      - name: invalid_enum_member_on_climate_zone_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - entities.Subdivision.fields.climate_zone
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "climate_zone CZ9 is outside the declared CZ2..CZ6 enum and is rejected with ERR_INVALID_REQUEST 422; the enum check runs in the same request-shape pass as missing fields."
        test_recipe:
          setup:
            - "One builder exists"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b6: $.data.id }
          trigger:
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b6}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ9", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_err3: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /subdivisions?builder_id=${c_b6} returns exactly 0 items"

      - name: rating_computed_fields_derived_from_pinned_plan_model
        claim_type: Computed Fields
        grounds:
          - entities.Rating.fields.projected_index
          - entities.Rating.fields.plan_model_id
          - endpoints[POST /ratings]
        distinguishing_aspect: "POST /ratings takes only home_id and rater_id, yet the created row pins plan_model_id from the home and copies projected_index 43 from that plan, with all four state dimensions at their initial values."
        test_recipe:
          setup:
            - "Builder, subdivision, plan STD-2400 (projected_index 43), home L-2201 and an ACTIVE RATER exist"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b7: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b7}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd7: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r7: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd7}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${c_r7}"
              captures: { c_pm7: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd7}", plan_model_id: "${c_pm7}", lot_number: "L-2201", permit_date: "2026-08-10" }
              as: BuilderRep
              as_user_id: "${c_b7}"
              captures: { c_h7: $.data.id }
          trigger:
            - call: "POST /ratings"
              payload: { home_id: "${c_h7}", rater_id: "${c_r7}" }
              as: CertifiedRater
              as_user_id: "${c_r7}"
              captures: { c_rt7: $.data.id }
          assert:
            - "Rating.${c_rt7}.plan_model_id == ${c_pm7}"
            - "Rating.${c_rt7}.projected_index == 43"
            - "Rating.${c_rt7}.stage == PROJECTED"
            - "Rating.${c_rt7}.compliance_status == UNDETERMINED"
            - "Rating.${c_rt7}.qa_status == NOT_SELECTED"
            - "Rating.${c_rt7}.registry_status == NOT_SUBMITTED"
            - "Rating.${c_rt7}.file_locked == false"
            - "Rating.${c_rt7}.confirmed_index == null"
            - "Rating.${c_rt7}.version == 1"

      - name: diagnostic_test_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.DiagnosticTest
          - endpoints[POST /inspections/{id}/tests]
          - endpoints[GET /inspections/{id}/tests]
        distinguishing_aspect: "DiagnosticTest is declared common_fields false, so the created row exposes id and created_at but no version or updated_at, and §1.5 offers no update or delete route for it — the measurement log is append-only."
        test_recipe:
          setup:
            - "A rating with a SCHEDULED FINAL inspection exists"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b8: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b8}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd8: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r8: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Ines Pike", cert_level: "RATING_FIELD_INSPECTOR", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_fi8: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd8}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${c_r8}"
              captures: { c_pm8: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd8}", plan_model_id: "${c_pm8}", lot_number: "L-2301", permit_date: "2026-08-10" }
              as: BuilderRep
              as_user_id: "${c_b8}"
              captures: { c_h8: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${c_h8}", rater_id: "${c_r8}" }
              as: CertifiedRater
              as_user_id: "${c_r8}"
              captures: { c_rt8: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${c_rt8}", inspector_id: "${c_fi8}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-21T09:00:00Z", scheduled_end_utc: "2026-08-21T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${c_fi8}"
              captures: { c_in8: $.data.id }
          trigger:
            - call: "POST /inspections/${c_in8}/tests"
              payload: { test_type: "DUCT_LEAKAGE_TOTAL", measured_value: 96 }
              as: FieldInspector
              as_user_id: "${c_fi8}"
              captures: { c_dt8: $.data.id }
          assert:
            - "DiagnosticTest.${c_dt8}.result == PASS"
            - "DiagnosticTest.${c_dt8}.normalized_value == 4.00"
            - "the response body for DiagnosticTest.${c_dt8} contains id and created_at"
            - "the response body for DiagnosticTest.${c_dt8} contains no version field and no updated_at field"
            - "GET /inspections/${c_in8}/tests returns exactly 1 item"

      - name: home_with_unknown_subdivision_parent_returns_404
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_SUBDIVISION_NOT_FOUND]
          - endpoints[POST /homes]
        distinguishing_aspect: "A body FK that names no existing Subdivision is a 404 ERR_SUBDIVISION_NOT_FOUND, distinct from the 422 shape error — body-FK existence is checked at priority 5, after path existence."
        test_recipe:
          setup:
            - "A builder and a plan model in a different, existing subdivision exist"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b9: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b9}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd9: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r9: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd9}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${c_r9}"
              captures: { c_pm9: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { subdivision_id: "00000000-0000-4000-8000-000000000000", plan_model_id: "${c_pm9}", lot_number: "L-2401", permit_date: "2026-08-10" }
              as: BuilderRep
              as_user_id: "${c_b9}"
              captures: { c_err4: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_SUBDIVISION_NOT_FOUND"
            - "Subdivision.${c_sd9}.homes_count == 0"

      - name: home_rejects_plan_model_from_another_subdivision
        claim_type: Parent Relationships
        grounds:
          - validations[priority=15]
          - errors[ERR_PLAN_MODEL_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Graph-topology cross-reference integrity: both FKs resolve, but the plan model belongs to a different subdivision, so the create is refused with ERR_PLAN_MODEL_MISMATCH 422 rather than silently binding a foreign plan."
        test_recipe:
          setup:
            - "One builder with two subdivisions; plan STD-2400 exists only in the first subdivision"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Anchor Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 250000 }
              as: RatingProviderAdmin
              captures: { c_b10: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b10}", name: "Mill Race", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd10a: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${c_b10}", name: "Stone Row", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { c_sd10b: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { c_r10: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${c_sd10a}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${c_r10}"
              captures: { c_pm10: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { subdivision_id: "${c_sd10b}", plan_model_id: "${c_pm10}", lot_number: "L-2501", permit_date: "2026-08-10" }
              as: BuilderRep
              as_user_id: "${c_b10}"
              captures: { c_err5: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_PLAN_MODEL_MISMATCH"
            - "Subdivision.${c_sd10b}.homes_count == 0"

  - section: state_machines
    instances:
      - name: sample_set_initial_state_is_forming_with_zero_members
        claim_type: Initial State
