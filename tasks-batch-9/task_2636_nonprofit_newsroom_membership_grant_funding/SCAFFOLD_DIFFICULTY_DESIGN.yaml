            - call: "POST /grant-proposals/${gp_id}/record-outcome"
              payload: { outcome: "AWARDED", awarded_amount_cents: 350000, award_date: "2026-08-15" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
            - call: "GET /grant-proposals/${gp_id}/reports"
              payload: {}
              as: FinanceController
              captures: { rep_id: "$.data[0].id" }
            - call: "POST /grant-proposals/${gp_id}/release-restricted-funds"
              payload: { request_amount_cents: 210000 }
              as: FinanceController
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-15T00:00:00Z" }
              as: FinanceController
            - call: "POST /ops/daily-sweep"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /grant-proposals/${gp_id}/reinstate"
              payload: {}
              as: FinanceController
