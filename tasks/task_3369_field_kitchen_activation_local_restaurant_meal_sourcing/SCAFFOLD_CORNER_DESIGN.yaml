  - section: rbac
    instances:
      - name: missing_auth_headers_return_401
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_MISSING_AUTH_HEADER]
          - roles.PlatformAdmin.identity
        distinguishing_aspect: "Authentication is the first gate after payload well-formedness, so a well-formed incident create with no X-User-Role header returns ERR_MISSING_AUTH_HEADER with HTTP 401."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: Anonymous
              captures: { err_auth: "$.data.error_id" }
          assert:
            - "${err_auth} == \"ERR_MISSING_AUTH_HEADER\""

      - name: role_not_permitted_on_incident_creation_returns_403
        claim_type: exclusive_operations
        grounds:
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - roles.FieldCoordinator.exclusive_operations
        distinguishing_aspect: "Incident creation is exclusive to PlatformAdmin, so the same well-formed body sent as FieldCoordinator returns ERR_UNAUTHORIZED_ROLE and no incident row is written."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: FieldCoordinator
              captures: { err_role: "$.data.error_id" }
          assert:
            - "${err_role} == \"ERR_UNAUTHORIZED_ROLE\""

      - name: kitchen_operator_cannot_act_on_another_kitchens_meal_order
        claim_type: exclusive_operations
        grounds:
          - validations[priority=4]
