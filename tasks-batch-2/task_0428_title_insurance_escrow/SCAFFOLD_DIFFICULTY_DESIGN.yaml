# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0428
# Nine Difficulty Rules (§0.5) x >= 2 instances each. Every grounds[] ref
# resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls/trigger chain
# is replay-valid against §1.2/§1.4/§1.6 and reachable from empty-DB via §1.5.
# Numeric asserts are pre-computed literals (see worklog of computed values).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: owner_premium_standard_vs_reissue
        grounds:
          - calculations.owner_premium
          - entities.Policy.fields.is_reissue
          - entities.Policy.fields.gross_premium_cents
          - state_machines.Policy.PENDING_to_ISSUED
        distinguishing_aspect: |
          Same OWNER coverage 250000_00 cents yields gross_premium_cents=110000 when
          is_reissue=false but 66000 when is_reissue=true (REISSUE_FACTOR 0.60) — a
          dual-variant calc on the Policy entity domain.
        test_recipe:
          setup:
            - "Two orders under one agency, each with an ISSUED commitment (insured 250000_00) and a PENDING OWNER policy coverage 250000_00; one policy is_reissue=false, the other is_reissue=true."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-1", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /title/orders/${o1_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o1_v}" }
              as: TitleOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /title/commitments/${c1_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o1_id}/policies"
              payload: { commitment_id: "${c1_id}", policy_type: "OWNER", coverage_amount_cents: 25000000, is_reissue: false }
              as: Underwriter
              captures: { p_std_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-2", county: "King", transaction_type: "REISSUE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /title/orders/${o2_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o2_v}" }
              as: TitleOfficer
              captures: { c2_id: $.data.id }
            - call: "POST /title/commitments/${c2_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o2_id}/policies"
              payload: { commitment_id: "${c2_id}", policy_type: "OWNER", coverage_amount_cents: 25000000, is_reissue: true }
              as: Underwriter
              captures: { p_re_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_std_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { std_premium: $.data.gross_premium_cents }
            - call: "POST /title/policies/${p_re_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { re_premium: $.data.gross_premium_cents }
          assert:
            - "Policy.${p_std_id}.gross_premium_cents == 110000"
            - "Policy.${p_re_id}.gross_premium_cents == 66000"
            - "Policy.${p_std_id}.gross_premium_cents != Policy.${p_re_id}.gross_premium_cents"

      - name: claim_reserve_provisional_vs_final_payout
        grounds:
          - calculations.claim_reserve
          - entities.Claim.fields.reserve_cents
          - entities.Claim.fields.paid_cents
          - state_machines.Claim.FNOL_to_INVESTIGATING
          - state_machines.Claim.CURATIVE_to_PAID
        distinguishing_aspect: |
          The SAME Claim shows reserve_cents=92000 (provisional, estimated_loss 80000 *
          1.15 loading) at INVESTIGATING, then paid_cents=70000 (final, settled_loss
          70000, no loading) at PAID — dual-variant on the Claim entity domain, a
          different domain from owner_premium's Policy.
        test_recipe:
          setup:
            - "An ISSUED OWNER policy (coverage 250000_00) with a claim filed (FNOL), estimated_loss 80000, a RESOLVED CurativeAction(subject=CLAIM); claim advanced FNOL->INVESTIGATING->CURATIVE."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-3", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/policies/${p_id}/claims"
              payload: { claim_type: "UNDISCLOSED_LIEN", estimated_loss_cents: 80000 }
              as: Underwriter
              captures: { cl_id: $.data.id }
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "INVESTIGATING" }
              as: Underwriter
              captures: { reserve_at_invest: $.data.reserve_cents }
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "CURATIVE" }
              as: Underwriter
            - call: "POST /title/orders/${o_id}/curative-actions"
              payload: { subject_type: "CLAIM", subject_id: "${cl_id}", action_type: "PAYOFF" }
              as: Underwriter
              captures: { ca_id: $.data.id }
            - call: "POST /title/curative-actions/${ca_id}/transitions"
              payload: { to_status: "RESOLVED" }
              as: Underwriter
          trigger:
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "PAID", settled_loss_cents: 70000 }
              as: Underwriter
              captures: { paid: $.data.paid_cents }
          assert:
            - "Claim.${cl_id}.reserve_cents == 0"
            - "Claim.${cl_id}.paid_cents == 70000"
            - "the provisional reserve observed at INVESTIGATING was 92000, distinct from the final paid_cents 70000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: owner_premium_tiered_three_inputs_mode_a
        grounds:
          - calculations.owner_premium
          - entities.Policy.fields.coverage_amount_cents
          - entities.Policy.fields.is_reissue
          - state_machines.Policy.PENDING_to_ISSUED
        distinguishing_aspect: |
          Mode (a) non-linear: premium is selected across three rate tiers (5/4/3 per
          $1000) keyed on coverage_amount_cents, then conditionally scaled by
          REISSUE_FACTOR — >=3 inputs (coverage, tier boundaries, is_reissue) with
          tiered-rate selection. Coverage 600000_00 std = 240000.
        test_recipe:
          setup:
            - "An ISSUED commitment insured 600000_00 with a PENDING OWNER policy coverage 600000_00, is_reissue=false (spans all three tiers)."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-4", county: "King", transaction_type: "PURCHASE", sales_price_cents: 60000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 60000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 60000000, is_reissue: false }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { prem: $.data.gross_premium_cents }
          assert:
            - "Policy.${p_id}.gross_premium_cents == 240000"

      - name: premium_split_rounding_order_mode_b
        grounds:
          - calculations.premium_split
          - entities.PremiumRemittance.fields.agency_retained_cents
          - entities.PremiumRemittance.fields.underwriter_remit_cents
          - entities.PremiumRemittance.fields.gross_premium_cents
          - state_machines.Policy.PENDING_to_ISSUED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: agency_retained_cents =
          round_half_up(gross * 0.82) is rounded FIRST, then underwriter_remit_cents =
          gross - agency_retained_cents. For gross 110000 -> retained 90200, remit
          19800, conserving exactly 110000 (rounding each half independently would
          drift). Different combinatorial mode from the tiered owner_premium (a).
        test_recipe:
          setup:
            - "An ISSUED OWNER policy gross_premium 110000 (coverage 250000_00) under an agency with remit_split_pct 0.82; PremiumRemittance auto-created on issue."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-5", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "GET /title/policies/${p_id}/remittances"
              as: Underwriter
              captures: { rem_retained: "$.data[0].agency_retained_cents", rem_remit: "$.data[0].underwriter_remit_cents" }
          assert:
            - "the policy's PremiumRemittance has agency_retained_cents == 90200"
            - "the policy's PremiumRemittance has underwriter_remit_cents == 19800"
            - "agency_retained_cents + underwriter_remit_cents == 110000 (== gross_premium_cents)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: commitment_issued_updated_revision_loop
        grounds:
          - state_machines.Commitment.ISSUED_to_UPDATED
          - state_machines.Commitment.UPDATED_to_ISSUED
          - entities.Commitment.fields.revision_no
        distinguishing_aspect: |
          The Commitment entity cycles ISSUED -> UPDATED (on re-issue create) -> ISSUED
          (re-issue of the superseded commitment), a non-linear revision loop; the
          prior commitment's revision_no increments to 1. Distinct from the linear
          Order pipeline.
        test_recipe:
          setup:
            - "An order with an ISSUED commitment C1; a re-issued commitment C2 is created which flips C1 to UPDATED (revision_no 1); C1 is then re-issued back to ISSUED."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-6", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v0}" }
              as: TitleOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /title/commitments/${c1_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "GET /title/orders/${o_id}"
              as: TitleOfficer
              captures: { o_v1: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-06T00:00:00Z", expiry_date: "2026-07-06T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v1}" }
              as: TitleOfficer
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /title/commitments/${c2_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "GET /title/commitments/${c1_id}"
              as: TitleOfficer
              captures: { c1_status: $.data.status, c1_rev: $.data.revision_no }
          assert:
            - "Commitment.${c1_id}.status == UPDATED (superseded by the C2 re-issue create)"
            - "Commitment.${c1_id}.revision_no == 1"
            - "Commitment.${c2_id}.status == ISSUED"

      - name: claim_investigating_curative_loop
        grounds:
          - state_machines.Claim.INVESTIGATING_to_CURATIVE
          - state_machines.Claim.CURATIVE_to_INVESTIGATING
          - entities.Claim.fields.status
        distinguishing_aspect: |
          The Claim entity cycles INVESTIGATING -> CURATIVE -> INVESTIGATING (curative
          inconclusive, loop back), a non-linear cycle on a DIFFERENT entity than the
          Commitment revision loop.
        test_recipe:
          setup:
            - "An ISSUED OWNER policy with a claim advanced FNOL->INVESTIGATING->CURATIVE."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-7", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/policies/${p_id}/claims"
              payload: { claim_type: "BOUNDARY_DISPUTE", estimated_loss_cents: 40000 }
              as: Underwriter
              captures: { cl_id: $.data.id }
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "INVESTIGATING" }
              as: Underwriter
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "CURATIVE" }
              as: Underwriter
          trigger:
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "INVESTIGATING" }
              as: Underwriter
              captures: { cl_status: $.data.status }
          assert:
            - "Claim.${cl_id}.status == INVESTIGATING (looped back from CURATIVE)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_cascade_depth3_commitment_policy_remittance
        grounds:
          - state_machines.Order.IN_TITLE_to_CANCELLED
          - state_machines.Commitment.ISSUED_to_CANCELLED
          - state_machines.Policy.ISSUED_to_VOID
          - state_machines.PremiumRemittance.REMITTED_to_REVERSED
        distinguishing_aspect: |
          Depth-3 chain: Order CANCEL -> Commitment CANCELLED (link1) -> that
          commitment cancel itself voids its Policy (link2) -> that policy void itself
          reverses its PremiumRemittance (link3). Each link caused by the previous, not
          by the original CANCEL. Trigger = Order IN_TITLE -> CANCELLED.
        test_recipe:
          setup:
            - "An order in IN_TITLE with an ISSUED commitment, an ISSUED OWNER policy (so a PENDING PremiumRemittance exists), escrow_balance 0 (no deposits)."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-8", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/title-searches"
              payload: { searched_parcel_id: "APN-8", effective_date: "2026-01-05T00:00:00Z" }
              as: TitleOfficer
              captures: { s_id: $.data.id }
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "IN_TITLE" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "GET /title/policies/${p_id}/remittances"
              as: Underwriter
              captures: { rem_id: "$.data[0].id" }
          trigger:
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "CANCELLED" }
              as: Agency
              as_user_id: "${ag_id}"
          assert:
            - "Order.${o_id}.status == CANCELLED"
            - "Commitment.${c_id}.status == CANCELLED"
            - "Policy.${p_id}.status == VOID"
            - "PremiumRemittance.${rem_id}.status == REVERSED"

      - name: disbursement_wire_cascade_depth2_balance_autoclose
        grounds:
          - state_machines.Disbursement.APPROVED_to_WIRED
          - state_machines.Order.CLEAR_TO_CLOSE_to_CLOSED
          - calculations.escrow_balance
          - entities.Order.fields.escrow_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger: Disbursement WIRE -> Order escrow
          balance recomputed to 0 (link1) -> that zero-balance state itself
          auto-transitions Order CLEAR_TO_CLOSE -> CLOSED (link2). Distinct from the
          Order-CANCEL cascade trigger.
        test_recipe:
          setup:
            - "An order in CLEAR_TO_CLOSE with a POSTED deposit 300000 (balance 300000) and an APPROVED disbursement for 300000 in a wire window."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-9", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/title-searches"
              payload: { searched_parcel_id: "APN-9", effective_date: "2026-01-05T00:00:00Z" }
              as: TitleOfficer
              captures: { s_id: $.data.id }
