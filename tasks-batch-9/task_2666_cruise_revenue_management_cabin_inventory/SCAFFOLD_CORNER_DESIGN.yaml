          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Categories IA (tier_rank 1) and OV (tier_rank 2) exist; sailing DUP-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 60/4 and the 365..120 fare window."
