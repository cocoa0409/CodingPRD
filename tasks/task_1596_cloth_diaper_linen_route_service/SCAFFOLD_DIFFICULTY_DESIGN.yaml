  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: customer_suspend_cascade_depth3
        grounds:
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.service_status_ACTIVE_to_SUSPENDED
          - state_machines.RouteStop.PLANNED_to_SKIPPED
        distinguishing_aspect: |
          Depth-3 cascade from the Customer SUSPEND trigger: customer suspension mutates the
          Subscription (link 1), that mutation skips its PLANNED RouteStops (link 2), and each
          skip itself recomputes the parent Route manifest counters and bumps Route.version
          (link 3) — each hop caused by the previous one, not by the original event.
        test_recipe:
          setup:
            - "ACTIVE subscription; route 2026-08-03 freshly created (PLANNED, version 1) with the subscription's auto-created PLANNED stop"
          setup_api_calls:
