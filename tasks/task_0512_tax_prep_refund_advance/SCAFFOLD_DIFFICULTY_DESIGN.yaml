# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules × ≥2 instances = 18 instances.
# Every numeric assert literal below was computed against the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: prep_fee_new_vs_returning_client
        grounds:
          - calculations.prep_fee_total
          - entities.Client.fields.is_returning
          - entities.TaxReturn.fields.prep_fee_cents
          - state_machines.TaxReturn.DOCS_PENDING_to_IN_PREP
        distinguishing_aspect: "Dual variant on the TaxReturn fee domain: identical schedules/band yield prep_fee_cents=40800 for a new client but 38300 for a returning client (10%-of-subtotal discount capped at $25), proving the two variants diverge on the same inputs."
        test_recipe:
          setup:
            - "Office with bank products off; one ACTIVE credential + preparer; two clients (one new, one returning) each with a STANDARD return carrying schedules [A,C] and state_return_count=1; one received document each."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Main St", efin: "123456", state_code: "CA", bank_product_enabled: false }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P12345678", holder_name: "Pat Prep", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Pat Prep" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "New Ned", ssn_last4: "1111", is_returning: false }
              as: FrontDeskAgent
              captures: { client_new: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Ret Rita", ssn_last4: "2222", is_returning: true }
              as: FrontDeskAgent
              captures: { client_ret: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_new}", tax_year: 2025, complexity_band: "STANDARD", schedules: ["A","C"], state_return_count: 1 }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_new: $.data.id }
            - call: "POST /returns/${ret_new}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_new: $.data.id }
            - call: "POST /documents/${doc_new}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_new}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_new}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_ret}", tax_year: 2025, complexity_band: "STANDARD", schedules: ["A","C"], state_return_count: 1 }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_ret: $.data.id }
            - call: "POST /returns/${ret_ret}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_ret: $.data.id }
            - call: "POST /documents/${doc_ret}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_ret}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_ret}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
          trigger:
            - call: "POST /returns/${ret_new}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { new_fee: $.data.prep_fee_cents }
            - call: "POST /returns/${ret_ret}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_fee: $.data.prep_fee_cents }
          assert:
            - "TaxReturn.${ret_new}.prep_fee_cents == 40800"
            - "TaxReturn.${ret_ret}.prep_fee_cents == 38300"
            - "TaxReturn.${ret_new}.prep_fee_cents - TaxReturn.${ret_ret}.prep_fee_cents == 2500"

      - name: advance_max_eligible_low_vs_high_risk
        grounds:
          - calculations.advance_max_eligible
          - entities.Client.fields.risk_band
          - entities.RefundAdvance.fields.approved_cents
          - state_machines.RefundAdvance.REQUESTED_to_APPROVED
        distinguishing_aspect: "Dual variant on the RefundAdvance domain (a different entity from prep_fee's TaxReturn): expected_refund_cents=250000 yields approved_cents=50000 for a LOW-risk client but is rejected with ERR_ADVANCE_INELIGIBLE for a HIGH-risk client (fraction 0.00)."
        test_recipe:
          setup:
            - "Bank-product office; two accepted returns each with expected_refund_cents=250000, one client LOW risk, one HIGH risk; advances requested at 200000 each."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Bank Office", efin: "654321", state_code: "TX", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Low Lou", ssn_last4: "3333", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_low: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "High Hal", ssn_last4: "4444", risk_band: "HIGH" }
              as: FrontDeskAgent
              captures: { client_high: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_low}", tax_year: 2025, expected_refund_cents: 250000 }
              as: FrontDeskAgent
              captures: { ret_low: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_high}", tax_year: 2025, expected_refund_cents: 250000 }
              as: FrontDeskAgent
              captures: { ret_high: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_low}", requested_cents: 200000 }
              as: BankProductOfficer
              captures: { adv_low: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_high}", requested_cents: 200000 }
              as: BankProductOfficer
              captures: { adv_high: $.data.id }
          trigger:
            - call: "POST /refund-advances/${adv_low}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
              captures: { low_approved: $.data.approved_cents }
            - call: "POST /refund-advances/${adv_high}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
              captures: { err: $.data.error_id }
          assert:
            - "RefundAdvance.${adv_low}.approved_cents == 50000"
            - "RefundAdvance.${adv_low}.status == APPROVED"
            - "underwrite ${adv_high} response error_id == ERR_ADVANCE_INELIGIBLE (409); RefundAdvance.${adv_high}.status remains REQUESTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: advance_max_eligible_nested_min_tier_mode_a
        grounds:
          - calculations.advance_max_eligible
          - entities.TaxReturn.fields.expected_refund_cents
          - entities.Client.fields.risk_band
        distinguishing_aspect: "Mode (a): a 3-input non-linear formula min(tier_cap(refund), round(refund*risk_fraction)) where the binding term flips by input — MEDIUM-risk refund 500000 gives min(150000, 250000)=150000, while LOW-risk refund 100000 gives min(50000, 75000)=50000."
        test_recipe:
          setup:
            - "Bank-product office; client MEDIUM risk on a return with expected_refund_cents=500000; a second LOW-risk client on a return with expected_refund_cents=100000; advances requested above each cap."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Combo Office", efin: "222333", state_code: "NY", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Med Meg", ssn_last4: "5555", risk_band: "MEDIUM" }
              as: FrontDeskAgent
              captures: { client_med: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Low Len", ssn_last4: "6666", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_low: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_med}", tax_year: 2025, expected_refund_cents: 500000 }
              as: FrontDeskAgent
              captures: { ret_med: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_low}", tax_year: 2025, expected_refund_cents: 100000 }
              as: FrontDeskAgent
              captures: { ret_low: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_med}", requested_cents: 400000 }
              as: BankProductOfficer
              captures: { adv_med: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_low}", requested_cents: 400000 }
              as: BankProductOfficer
              captures: { adv_low: $.data.id }
          trigger:
            - call: "POST /refund-advances/${adv_med}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
              captures: { med_approved: $.data.approved_cents }
            - call: "POST /refund-advances/${adv_low}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
              captures: { low_approved: $.data.approved_cents }
          assert:
            - "RefundAdvance.${adv_med}.approved_cents == 150000"
            - "RefundAdvance.${adv_low}.approved_cents == 50000"

      - name: disbursement_surcharge_round_per_bucket_mode_b
        grounds:
          - calculations.disbursement_surcharge
          - calculations.refund_disbursement_waterfall
          - state_machines.RefundTransfer.PENDING_FUNDING_to_DISBURSED
          - entities.RefundTransfer.fields.net_to_taxpayer_cents
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — the 2.9% surcharge over funded bucket takes [3995, 15000, 1000, 1020] rounds per bucket then sums to 610, whereas sum-then-round would give 609; the scaffold mandates round-per-bucket so the disburse response surcharge is exactly 610."
        test_recipe:
          setup:
            - "Bank-product office; SIMPLE return (prep_fee 15000) accepted; AuditProtection fee_cents=1000 ACTIVE; advance approved 1020 and disbursed; RefundTransfer pending with disbursed_refund_cents=50000."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Surcharge Office", efin: "333444", state_code: "FL", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P22223333", holder_name: "Sue Surch", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Sue Surch" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Sim Sam", ssn_last4: "7777", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE", expected_refund_cents: 500000 }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /audit-protections"
              payload: { tax_return_id: "${ret_id}", fee_cents: 1000 }
              as: BankProductOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_id}", requested_cents: 1020 }
              as: BankProductOfficer
              captures: { adv_id: $.data.id }
            - call: "POST /refund-advances/${adv_id}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
            - call: "POST /refund-transfers"
              payload: { tax_return_id: "${ret_id}" }
              as: BankProductOfficer
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /returns/${ret_id}/efile"
              payload: {}
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/efile-ack"
              payload: { ack_status: "ACCEPTED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /refund-advances/${adv_id}/disburse"
              payload: {}
              as: BankProductOfficer
          trigger:
            - call: "POST /refund-transfers/${rt_id}/disburse"
              payload: { disbursed_refund_cents: 50000, expected_refundtransfer_version: "${rt_v}" }
              as: BankProductOfficer
              captures: { net: $.data.net_to_taxpayer_cents }
          assert:
            - "disburse response surcharge_cents == 610 (round-per-bucket; sum-then-round would be 609)"
            - "RefundTransfer.${rt_id}.net_to_taxpayer_cents == 28985"
            - "RefundAdvance.${adv_id}.repaid_cents == 1020"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tax_return_reject_correction_cycle
        grounds:
          - state_machines.TaxReturn.EFILED_PENDING_to_EFILED_REJECTED
          - state_machines.TaxReturn.EFILED_REJECTED_to_PREPARED
          - state_machines.TaxReturn.PREPARED_to_EFILED_PENDING
          - entities.TaxReturn.fields.reject_count
        distinguishing_aspect: "Cyclic shape on TaxReturn: PREPARED→EFILED_PENDING→EFILED_REJECTED→PREPARED loops back, incrementing reject_count each cycle, distinct from any forward-only pipeline."
        test_recipe:
          setup:
            - "Bank-off office; ACTIVE credential+preparer; SIMPLE return assigned, docs received, advanced to PREPARED, e-filed once (TRANSMITTED)."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Cycle Office", efin: "444555", state_code: "OH" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P33334444", holder_name: "Cy Cyc", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Cy Cyc" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Cli Cy", ssn_last4: "8888" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/efile"
              payload: {}
              as: TaxPreparer
              as_user_id: "${prep_id}"
          trigger:
            - call: "POST /returns/${ret_id}/efile-ack"
              payload: { ack_status: "REJECTED", reject_code: "R0000-901" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/efile"
              payload: {}
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/efile-ack"
              payload: { ack_status: "ACCEPTED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
          assert:
            - "After first REJECTED: TaxReturn.${ret_id}.status == EFILED_REJECTED and reject_count == 1"
            - "After to=PREPARED: TaxReturn.${ret_id}.status == PREPARED (loop-back succeeded)"
            - "After re-efile + ACCEPTED: TaxReturn.${ret_id}.status == EFILED_ACCEPTED and reject_count == 1"

      - name: refund_advance_approve_or_deny_branch
        grounds:
          - state_machines.RefundAdvance.REQUESTED_to_APPROVED
          - state_machines.RefundAdvance.REQUESTED_to_DENIED
          - entities.RefundAdvance.fields.approved_cents
        distinguishing_aspect: "Branching fork on RefundAdvance (a different entity from TaxReturn): from REQUESTED the underwrite forks to APPROVED (approved_cents set via formula) or DENIED (approved_cents=0) with divergent side-effects per branch."
        test_recipe:
          setup:
            - "Bank-product office; LOW-risk client with two returns each expected_refund_cents=500000; two REQUESTED advances of 100000 each."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Branch Office", efin: "555666", state_code: "WA", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Br Bea", ssn_last4: "9999", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, expected_refund_cents: 500000 }
              as: FrontDeskAgent
              captures: { ret_a: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2024, expected_refund_cents: 500000, return_kind: "PRIOR_YEAR" }
              as: FrontDeskAgent
              captures: { ret_b: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_a}", requested_cents: 100000 }
              as: BankProductOfficer
              captures: { adv_appr: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_b}", requested_cents: 100000 }
              as: BankProductOfficer
              captures: { adv_deny: $.data.id }
          trigger:
            - call: "POST /refund-advances/${adv_appr}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
            - call: "POST /refund-advances/${adv_deny}/underwrite"
              payload: { decision: "DENY" }
              as: BankProductOfficer
          assert:
            - "RefundAdvance.${adv_appr}.status == APPROVED and approved_cents == 100000"
            - "RefundAdvance.${adv_deny}.status == DENIED and approved_cents == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_cancel_cascades_advance_then_transfer_depth3
        grounds:
          - state_machines.TaxReturn.INTAKE_to_CANCELLED
          - state_machines.RefundAdvance.REQUESTED_to_APPROVED
          - state_machines.RefundTransfer.PENDING_FUNDING_to_CANCELLED
          - entities.RefundAdvance.fields.status
          - entities.RefundTransfer.fields.status
        distinguishing_aspect: "Depth-3 cascade triggered by TaxReturn CANCELLED: the cancel mutates RefundAdvance→CANCELLED, and THAT advance-cancellation in turn drives the linked PENDING_FUNDING RefundTransfer→CANCELLED (each link caused by the previous, not the original action)."
        test_recipe:
          setup:
            - "Bank-product office; LOW-risk client; return in INTAKE with expected_refund_cents=500000; an APPROVED advance and a PENDING_FUNDING refund-transfer both linked to the return."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Cascade Office", efin: "666777", state_code: "AZ", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Cas Cal", ssn_last4: "1212", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, expected_refund_cents: 500000 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_id}", requested_cents: 100000 }
              as: BankProductOfficer
              captures: { adv_id: $.data.id }
            - call: "POST /refund-advances/${adv_id}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
            - call: "POST /refund-transfers"
              payload: { tax_return_id: "${ret_id}" }
              as: BankProductOfficer
              captures: { rt_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "CANCELLED" }
              as: TaxPreparer
          assert:
            - "TaxReturn.${ret_id}.status == CANCELLED"
            - "RefundAdvance.${adv_id}.status == CANCELLED"
            - "RefundTransfer.${rt_id}.status == CANCELLED"

