  - rule_id: cross_entity_state_dependency
    instances:

      - name: plan_lock_requires_every_sibling_pool_calibrated
        grounds:
          - validations.priority_108
          - errors.ERR_POOL_CALIBRATION_PENDING
          - state_machines.BonusPlan
          - state_machines.BusinessUnitPool
          - entities.BonusPlan.fields.locked_total_cents
          - endpoints."POST /bonus-plans/{planId}/lock"
        distinguishing_aspect: |
          Entity pair (BonusPlan <- BusinessUnitPool). The plan transition
          CALIBRATION_REVIEW -> LOCKED is guarded by the state of EVERY pool,
          not by the plan's own fields: with pool 1 CALIBRATED and pool 2 only
          CALIBRATION_SUBMITTED the lock is refused 409, and the identical
          request succeeds once pool 2 is certified. A per-pool check that
          stops at the first CALIBRATED pool locks a plan whose second unit is
          still under review.
        test_recipe:
          setup:
            - "Two units EAST1 and EAST2, one plan (weights 50/30/20), L3 target 10.00%, REVENUE metric weight 100.00 with actual == target, one pool per unit, one L3 participant at 10,000,000 hired 2025-01-01 in each unit (target 1,000,000 each)."
            - "Both scorecards certified at 100.00, plan certified at blended 100.00 / multiplier 1.0000, each pool funded 1,000,000 and fully allocated (WITHIN_GUIDELINES, plan COMPLIANT)."
            - "Both pools submitted for calibration and the plan moved to CALIBRATION_REVIEW; only pool 1 has been certified, pool 2 is still CALIBRATION_SUBMITTED."
