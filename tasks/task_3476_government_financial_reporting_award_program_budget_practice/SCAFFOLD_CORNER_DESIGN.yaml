# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 3476 — breadth probe over §1.1–§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Anchors (&c_*) are defined at first use and
# aliased later IN THIS FILE; every ${var} binds earlier in the same instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: government_create_returns_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Government
          - endpoints.POST_/gfoa/governments
          - response_envelope
        distinguishing_aspect: "A government created with the four required fields returns 201 with system id/created_at/updated_at, version 1, and lifetime_award_count 0 — no client input can seed the computed counter."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_gov_s
              call: "POST /gfoa/governments"
              payload: { legal_name: "City of Example", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_s: $.data.id }
          assert:
            - "the response status is 201 with response_type object and meta.api_request_id present"
            - "Government.${gov_s}.lifetime_award_count == 0 and version == 1"
            - "Government.${gov_s}.created_at == 2026-09-15T00:00:00Z (logical clock, not wall clock)"

      - name: member_create_dues_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.annual_dues_cents
          - calculations.member_annual_dues
        distinguishing_aspect: "annual_dues_cents is computed; a client-supplied 999999 is ignored and the stored value follows the dues formula (MEDIUM non-independent -> 28500)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /gfoa/members"
              payload: { full_name: "Mid Plain", email: "mp@x.com", government_size_band: "MEDIUM", independent_finance_officer: false, annual_dues_cents: 999999 }
              as: PlatformAdmin
              captures: { dues: $.data.annual_dues_cents }
          assert:
            - "the response status is 201 and Member.annual_dues_cents == 28500, not the client-supplied 999999"

      - name: reviewer_profile_create_defaults
        claim_type: Defaults
        grounds:
          - entities.ReviewerProfile
          - state_machines.ReviewerProfile
        distinguishing_aspect: "A fresh reviewer profile starts APPLICANT with independence_attested false, trained_at null, all three counters 0, and empty conflict/window arrays when omitted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; member m1 and employer government e1 exist."
          setup_api_calls:
            - *c_clock
            - &c_m1
              call: "POST /gfoa/members"
              payload: { full_name: "Rita One", email: "r1@x.com", government_size_band: "MEDIUM" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - &c_e1
              call: "POST /gfoa/governments"
              payload: { legal_name: "County of Peer One", gov_type: "COUNTY", population_band: "LARGE", state_code: "MI" }
              as: PlatformAdmin
              captures: { e1: $.data.id }
          trigger:
            - &c_rev1
              call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m1}", employer_government_id: "${e1}" }
              as: Member
              as_user_id: "${m1}"
              captures: { rev1: $.data.id }
          assert:
            - "ReviewerProfile.${rev1}.status == APPLICANT and independence_attested == false"
            - "open_assignment_count == 0, completed_review_count == 0, declined_assignment_count == 0"
            - "trained_at is null and conflicted_government_ids == [] and unavailability_windows == []"

      - name: submission_create_pins_checklist_and_copies_program
        claim_type: Creation
        grounds:
          - entities.ReportSubmission.fields.pinned_checklist_version_id
          - entities.ReportSubmission.fields.program_type
          - endpoints.POST_/gfoa/report-submissions
        distinguishing_aspect: "Creation pins the cycle's checklist at write time: pinned_checklist_version_id == the cycle's checklist, program_type is copied from the cycle, appeal_round is 1, award_conferred false, status DRAFT."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; FR checklist and cycle exist."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - &c_cl_fr
              call: "POST /gfoa/checklist-versions"
              payload: { program_type: "FINANCIAL_REPORTING", version_label: "2026.1", pass_score: 85.00, criteria: [{ criterion_code: "C1", weight: 0.5 }, { criterion_code: "C2", weight: 0.5 }] }
              as: PlatformAdmin
              captures: { cl_fr: $.data.id }
            - &c_cyc_fr
              call: "POST /gfoa/award-cycles"
              payload: { program_type: "FINANCIAL_REPORTING", fiscal_year: 2026, submission_opens_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z", review_close_at: "2026-12-01T00:00:00Z", checklist_version_id: "${cl_fr}" }
              as: PlatformAdmin
              captures: { cyc_fr: $.data.id }
          trigger:
            - &c_sub_create
              call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_s}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { sub_s: $.data.id, sub_pin: $.data.pinned_checklist_version_id }
          assert:
            - "ReportSubmission.${sub_s}.pinned_checklist_version_id == ${cl_fr} (pinned from the cycle at creation)"
            - "ReportSubmission.${sub_s}.program_type == FINANCIAL_REPORTING (copied, not client-supplied)"
            - "status == DRAFT, appeal_round == 1, pinned_checklist_stale == false, award_conferred == false"

      - name: submission_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/gfoa/report-submissions/{id}
          - errors.ERR_SUBMISSION_NOT_FOUND
        distinguishing_aspect: "A well-formed but unallocated id returns the entity-specific 404 ERR_SUBMISSION_NOT_FOUND, not a generic error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; no submissions exist."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /gfoa/report-submissions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id == ERR_SUBMISSION_NOT_FOUND"

      - name: report_submissions_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/gfoa/report-submissions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three submissions on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count spans the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; FR checklist/cycle; three governments each with one DRAFT submission."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Second", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_2: $.data.id }
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_2}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_2}"
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Third", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_3: $.data.id }
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_3}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_3}"
          trigger:
            - call: "GET /gfoa/report-submissions"
              payload: { cycle_id: "${cyc_fr}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /gfoa/report-submissions?cycle_id=${cyc_fr}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /gfoa/report-submissions?cycle_id=${cyc_fr} with no pagination params returns all 3 rows under the defaults (limit 10, offset 0)"

      - name: review_finding_immutable_second_finding_rejected
        claim_type: Immutability
        grounds:
          - entities.ReviewFinding
          - state_machines.ReviewAssignment.ACCEPTED_to_SUBMITTED
          - errors.ERR_ASSIGNMENT_STATE_INVALID
        distinguishing_aspect: "ReviewFinding is append-only (common_fields false, no update endpoint anywhere); the only write path is creation, and a second finding against the same assignment is rejected because the assignment is already SUBMITTED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED; rev1 ELIGIBLE with an ACCEPTED assignment and one finding already filed."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - &c_submit
              call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
            - *c_m1
            - *c_e1
            - *c_rev1
            - &c_train1
              call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - &c_att1
              call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev1}"
            - &c_asg1
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg1: $.data.id, asg1_rev: $.data.reviewer_id }
            - &c_acc1
              call: "POST /gfoa/review-assignments/${asg1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
          trigger:
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 50 }, { criterion_code: "C2", score: 50 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err: $.data.error_id }
          assert:
            - "the second finding returns 409 ERR_ASSIGNMENT_STATE_INVALID (assignment already SUBMITTED)"
            - "GET /gfoa/review-findings?assignment_id=${asg1} still returns exactly 1 row with weighted_score == 85.00 (the original finding is unchanged)"

      - name: member_comment_member_id_from_header_not_payload
        claim_type: System Fields
        grounds:
          - entities.MemberComment.fields.member_id
          - endpoints.POST_/gfoa/member-comments
        distinguishing_aspect: "member_id is system-sourced from X-User-ID; the commenter cannot attribute a comment to another member."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication pub in MEMBER_COMMENT with window closing 2026-09-20; commenter member cm exists."
          setup_api_calls:
            - *c_clock
            - &c_chairM
              call: "POST /gfoa/members"
              payload: { full_name: "Chair Chen", email: "chair@x.com", government_size_band: "LARGE" }
              as: PlatformAdmin
              captures: { chairM: $.data.id }
            - &c_creatorM
              call: "POST /gfoa/members"
              payload: { full_name: "Creator Cole", email: "creator@x.com", government_size_band: "MEDIUM" }
              as: PlatformAdmin
              captures: { creatorM: $.data.id }
            - &c_pub
              call: "POST /gfoa/publications"
              payload: { committee_name: "Accounting Practices Committee", chair_member_id: "${chairM}", member_ids: ["${chairM}", "${creatorM}"], title: "Internal Control Over Grants", topic_code: "IC-GRANTS" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub: $.data.id }
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /gfoa/members"
              payload: { full_name: "Commenter Kim", email: "kim@x.com", government_size_band: "SMALL" }
              as: PlatformAdmin
              captures: { cm: $.data.id }
          trigger:
            - call: "POST /gfoa/member-comments"
              payload: { publication_id: "${pub}", body: "Please clarify the escalation matrix." }
              as: Member
              as_user_id: "${cm}"
              captures: { cmt: $.data.id, cmt_member: $.data.member_id }
          assert:
            - "MemberComment.${cmt}.member_id == ${cm} (taken from X-User-ID)"
            - "MemberComment.${cmt}.resolution == PENDING and version == 1"
            - "BestPracticePublication.${pub}.pending_comment_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: submission_starts_draft_and_reviewer_applicant
        claim_type: initial_state
        grounds:
          - state_machines.ReportSubmission
          - state_machines.ReviewerProfile
        distinguishing_aspect: "Fresh entities land in their declared initial states: ReportSubmission DRAFT, ReviewerProfile APPLICANT, StandardsReference ISSUED, publication DRAFTING, application PENDING."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_m1
            - *c_e1
          trigger:
            - *c_sub_create
            - *c_rev1
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Financial Reporting Model Improvements", program_type: "FINANCIAL_REPORTING", effective_date: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { std: $.data.id, std_status: $.data.status }
          assert:
            - "ReportSubmission.${sub_s}.status == DRAFT"
            - "ReviewerProfile.${rev1}.status == APPLICANT"
            - "StandardsReference.${std}.status == ISSUED"

      - name: submit_twice_returns_state_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.ReportSubmission.DRAFT_to_SUBMITTED
          - errors.ERR_SUBMISSION_STATE_INVALID
        distinguishing_aspect: "SUBMITTED is not a valid from-state for submit; the second submit is rejected and submitted_at/cycle counters do not double-count."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
            - call: "GET /gfoa/award-cycles/${cyc_fr}"
              payload: {}
              as: PlatformAdmin
              captures: { cyc_submitted: "$.data.submitted_count" }
          assert:
            - "second submit returns 409 ERR_SUBMISSION_STATE_INVALID"
            - "AwardCycle.${cyc_fr}.submitted_count == 1 (no double count)"

      - name: decide_from_under_review_returns_findings_incomplete
        claim_type: invalid_transition
        grounds:
          - state_machines.ReportSubmission
          - errors.ERR_FINDINGS_INCOMPLETE
        distinguishing_aspect: "UNDER_REVIEW is close to decidable but short of quorum: decide from UNDER_REVIEW yields ERR_FINDINGS_INCOMPLETE, a different error than the generic state error used from DRAFT/SUBMITTED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED with one OFFERED assignment (status now UNDER_REVIEW)."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - *c_asg1
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/decide"
              payload: {}
              as: AwardsDirector
              captures: { err: $.data.error_id }
          assert:
            - "decide returns 409 ERR_FINDINGS_INCOMPLETE (1 of 3 findings present)"
            - "ReportSubmission.${sub_s}.status remains UNDER_REVIEW and final_score stays null"

      - name: appeal_from_decided_awarded_returns_state_invalid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ReportSubmission
          - errors.ERR_SUBMISSION_STATE_INVALID
        distinguishing_aspect: "DECIDED_AWARDED is terminal: appeal from it is rejected, and government.lifetime_award_count stays 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission fully reviewed (85.00/86.00/84.00) and decided AWARDED."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - &c_m2
              call: "POST /gfoa/members"
              payload: { full_name: "Rita Two", email: "r2@x.com", government_size_band: "SMALL" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - &c_e2
              call: "POST /gfoa/governments"
              payload: { legal_name: "County of Peer Two", gov_type: "COUNTY", population_band: "LARGE", state_code: "IN" }
              as: PlatformAdmin
              captures: { e2: $.data.id }
            - &c_rev2
              call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m2}", employer_government_id: "${e2}" }
              as: Member
              as_user_id: "${m2}"
              captures: { rev2: $.data.id }
            - &c_train2
              call: "PUT /gfoa/reviewer-profiles/${rev2}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - &c_att2
              call: "PUT /gfoa/reviewer-profiles/${rev2}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev2}"
            - &c_m3
              call: "POST /gfoa/members"
              payload: { full_name: "Rita Three", email: "r3@x.com", government_size_band: "LARGE" }
              as: PlatformAdmin
              captures: { m3: $.data.id }
            - &c_e3
              call: "POST /gfoa/governments"
              payload: { legal_name: "State of Peer Three", gov_type: "STATE_GOV", population_band: "LARGE", state_code: "KY" }
              as: PlatformAdmin
              captures: { e3: $.data.id }
            - &c_rev3
              call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m3}", employer_government_id: "${e3}" }
              as: Member
              as_user_id: "${m3}"
              captures: { rev3: $.data.id }
            - &c_train3
              call: "PUT /gfoa/reviewer-profiles/${rev3}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - &c_att3
              call: "PUT /gfoa/reviewer-profiles/${rev3}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev3}"
            - *c_asg1
            - &c_asg2
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg2: $.data.id }
            - &c_asg3
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg3: $.data.id }
            - *c_acc1
            - &c_acc2
              call: "POST /gfoa/review-assignments/${asg2}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev2}"
            - &c_acc3
              call: "POST /gfoa/review-assignments/${asg3}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev3}"
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asg2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 88 }, { criterion_code: "C2", score: 84 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asg3}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 92 }, { criterion_code: "C2", score: 76 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
            - call: "POST /gfoa/report-submissions/${sub_s}/decide"
              payload: {}
              as: AwardsDirector
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/appeal"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "precondition: ReportSubmission.${sub_s}.status == DECIDED_AWARDED with award_conferred == true"
            - "appeal returns 409 ERR_SUBMISSION_STATE_INVALID (terminal state lockdown)"
            - "Government.${gov_s}.lifetime_award_count == 1 (unchanged by the failed appeal)"

      - name: reviewer_attestation_before_training_returns_not_trained
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReviewerProfile.TRAINED_to_ELIGIBLE
          - errors.ERR_REVIEWER_NOT_TRAINED
        distinguishing_aspect: "The recruitment pipeline is ordered: independence attestation from APPLICANT fails with ERR_REVIEWER_NOT_TRAINED; only after PlatformAdmin records TRAINED does the same PUT succeed into ELIGIBLE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; reviewer profile APPLICANT."
          setup_api_calls:
            - *c_clock
            - *c_m1
            - *c_e1
            - *c_rev1
          trigger:
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err: $.data.error_id }
            - *c_train1
            - *c_att1
          assert:
            - "attestation while APPLICANT returns 409 ERR_REVIEWER_NOT_TRAINED and status stays APPLICANT"
            - "after TRAINED the same attestation returns 200 and ReviewerProfile.${rev1}.status == ELIGIBLE"

      - name: publication_close_before_closes_at_returns_still_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BestPracticePublication.MEMBER_COMMENT_to_RESOLUTION
          - errors.ERR_COMMENT_WINDOW_STILL_OPEN
        distinguishing_aspect: "The comment window is a hard temporal gate on the state machine: closing at 2026-09-19 with closes_at 2026-09-20 fails; at exactly 2026-09-20 it succeeds (>= boundary)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication in MEMBER_COMMENT with closes_at 2026-09-20T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-19T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_status: $.data.status }
          assert:
            - "close at 2026-09-19 returns 409 ERR_COMMENT_WINDOW_STILL_OPEN; status stays MEMBER_COMMENT"
            - "close at exactly closes_at (2026-09-20) succeeds — the gate is now >= closes_at"
            - "BestPracticePublication.${pub}.status == RESOLUTION"

      - name: comment_after_window_close_returns_window_closed
        claim_type: precondition_enforcement
        grounds:
          - errors.ERR_COMMENT_WINDOW_CLOSED
          - entities.BestPracticePublication.fields.comment_window_closes_at
        distinguishing_aspect: "Comments are accepted only while now < closes_at; at exactly closes_at the window is shut even though the publication still shows MEMBER_COMMENT (state vs temporal gate split)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication in MEMBER_COMMENT closing 2026-09-20; commenter member exists; clock advanced to 2026-09-20."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /gfoa/members"
              payload: { full_name: "Commenter Kim", email: "kim@x.com", government_size_band: "SMALL" }
              as: PlatformAdmin
              captures: { cm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /gfoa/member-comments"
              payload: { publication_id: "${pub}", body: "Late comment." }
              as: Member
              as_user_id: "${cm}"
              captures: { err: $.data.error_id }
          assert:
            - "comment at exactly closes_at returns 409 ERR_COMMENT_WINDOW_CLOSED (now < closes_at required)"
            - "BestPracticePublication.${pub}.pending_comment_count == 0"

      - name: standard_activate_before_effective_returns_not_yet_effective
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StandardsReference.ISSUED_to_EFFECTIVE
          - errors.ERR_STANDARD_NOT_YET_EFFECTIVE
        distinguishing_aspect: "Activation is clock-gated: effective_date 2026-10-01 cannot activate at 2026-09-15; at exactly 2026-10-01 it activates (>= boundary), cascading the checklist supersession."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; FR checklist ACTIVE; standard with effective_date 2026-10-01 registered."
          setup_api_calls:
            - *c_clock
            - *c_cl_fr
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Financial Reporting Model Improvements", program_type: "FINANCIAL_REPORTING", effective_date: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { std: $.data.id }
          trigger:
            - call: "POST /gfoa/standards-references/${std}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/standards-references/${std}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { std_status: $.data.status }
          assert:
            - "activate before effective_date returns 409 ERR_STANDARD_NOT_YET_EFFECTIVE; standard stays ISSUED"
            - "activate at exactly effective_date succeeds: StandardsReference.${std}.status == EFFECTIVE"
            - "ChecklistVersion.${cl_fr}.status == SUPERSEDED after activation (cascade fires on the boundary activation)"

      - name: appeal_after_30_days_returns_appeal_window_closed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReportSubmission.DECIDED_DENIED_to_APPEALED
          - errors.ERR_APPEAL_WINDOW_CLOSED
        distinguishing_aspect: "Appeals die 30 days after decided_at: decision at 2026-09-15 makes 2026-10-15 the last valid day; at 2026-10-16 the appeal is rejected."
        test_recipe:
          setup:
