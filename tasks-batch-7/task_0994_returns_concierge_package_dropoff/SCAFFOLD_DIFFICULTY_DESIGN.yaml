            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/slot-reservations/${res2}/consume", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { err: $.data.error_id } }
          assert:
            - "res1_st == CONSUMED at hold_until - 1s"
            - "err == ERR_RESERVATION_EXPIRED at exactly hold_until"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_requires_merchant_active
        grounds:
          - validations[priority=7]
          - state_machines.MerchantAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair ReturnOrder x MerchantAccount: order creation is gated on the
          merchant being ACTIVE; a SUSPENDED merchant rejects with
          ERR_MERCHANT_SUSPENDED, reactivation restores the capability.
        test_recipe:
          setup: ["Plan; merchant MM; OPEN cycle; shopper SM; merchant suspended"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Gate", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sg@x.com", full_name: "S Gate", postal_code: "10019" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "G1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/reactivate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "G2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_ok: $.data.id } }
          assert:
            - "err == ERR_MERCHANT_SUSPENDED while merchant SUSPENDED"
            - "ro_ok created (201) after reactivation (same request shape succeeds)"

      - name: tote_dispatch_requires_route_dispatched
        grounds:
          - state_machines.ConsolidationTote.SEALED_to_DISPATCHED
          - validations[priority=6]
        distinguishing_aspect: |
          Pair ConsolidationTote x CarrierRoute: tote dispatch is gated on the
          linked route being DISPATCHED; PLANNED route rejects with
          ERR_ROUTE_NOT_DISPATCHED, dispatching the route unblocks the tote.
        test_recipe:
          setup: ["Counter location LD; route RD (PLANNED) origin LD; tote TD with one dropped-off order, sealed"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-RD", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "srd@x.com", full_name: "S RD", postal_code: "10020" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-RD", kind: COUNTER, postal_code: "20007" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-3", weight_capacity_grams: 100000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id, tote_v: $.data.version } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, boxless: false, items: [ { sku: "RD", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id, ro1_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro1}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro1_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro1}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/consolidation-totes/${tote_id}/seal", payload: {}, as: LocationOperator, as_user_id: "${loc_id}" }
          trigger:
            - { call: "POST /v1/consolidation-totes/${tote_id}/dispatch", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/carrier-routes/${route_id}/dispatch", payload: {}, as: CarrierDispatcher }
            - { call: "POST /v1/consolidation-totes/${tote_id}/dispatch", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_st: $.data.status } }
          assert:
            - "err == ERR_ROUTE_NOT_DISPATCHED while route PLANNED"
            - "tote_st == DISPATCHED after the route was dispatched"
            - "ReturnOrder.${ro1}.status == IN_TRANSIT after tote dispatch"

      - name: reservation_requires_location_operational
        grounds:
          - validations[priority=11]
          - state_machines.DropoffLocation.OPERATIONAL_to_PAUSED
        distinguishing_aspect: |
          Pair SlotReservation x DropoffLocation: creating a reservation at a
          PAUSED location fails with ERR_LOCATION_NOT_OPERATIONAL; resume
          restores the capability for the same slot.
        test_recipe:
          setup: ["Plan boxless true; merchant; cycle; shopper; LOCKER location LP with XL slot; LOCKER_QR order; location paused"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Loc", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sloc@x.com", full_name: "S Loc", postal_code: "10021" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-P", kind: LOCKER, postal_code: "20008" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "LP", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/pause", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro_id}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/resume", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro_id}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res_ok: $.data.id } }
          assert:
            - "err == ERR_LOCATION_NOT_OPERATIONAL while PAUSED"
            - "res_ok HELD after resume (identical request succeeds)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_live_hold_exclusive_interval
        grounds:
          - calculations.slot_hold_window
          - state_machines.LockerSlot.EMPTY_to_RESERVED
        distinguishing_aspect: |
          Semantics A — exclusive half-open interval on LockerSlot: a second
          reservation on the same slot while the first is live (hold_until > now)
          is rejected; after a release the same slot accepts a new hold
          immediately (no gap requirement).
        test_recipe:
          setup: ["Plan boxless true; merchant; cycle; shopper; LOCKER location LE with XL slot SE; two LOCKER_QR orders O1/O2"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Excl", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "se@x.com", full_name: "S Excl", postal_code: "10022" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-E", kind: LOCKER, postal_code: "20009" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "E1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "E2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id } }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro1}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res1: $.data.id } }
          trigger:
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro2}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/slot-reservations/${res1}/release", payload: {}, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro2}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res2: $.data.id, res2_st: $.data.status } }
          assert:
            - "err == ERR_SLOT_UNAVAILABLE while the first hold is live"
            - "res2_st == HELD immediately after the release (adjacency: no cooling gap)"

      - name: zone_window_aggregate_capacity_overlap
        grounds:
          - calculations.zone_window_load
          - validations[priority=11]
        distinguishing_aspect: |
          Semantics B (different from the slot's exclusive interval) — aggregate
          capacity on CourierZone: N overlapping appointments are allowed; only
          the (N+1)-th overlapping one is rejected, and a disjoint window is
          always free.
        test_recipe:
          setup: ["Plan pickup true; merchant; cycle; shopper; zone ZAGG window_capacity 2; three HOME_PICKUP orders"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Agg", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sag@x.com", full_name: "S Agg", postal_code: "10023" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZAGG", window_capacity: 2 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "A1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "A2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "A3", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro3: $.data.id } }
          trigger:
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro1}", zone_id: "${zone_id}", window_start: "2026-05-01T01:00:00Z", window_end: "2026-05-01T03:00:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap1: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro2}", zone_id: "${zone_id}", window_start: "2026-05-01T02:00:00Z", window_end: "2026-05-01T04:00:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap2: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro3}", zone_id: "${zone_id}", window_start: "2026-05-01T02:30:00Z", window_end: "2026-05-01T03:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro3}", zone_id: "${zone_id}", window_start: "2026-05-01T05:00:00Z", window_end: "2026-05-01T06:00:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap3: $.data.id, ap3_st: $.data.status } }
          assert:
            - "ap1 and ap2 SCHEDULED (overlap count 2 == capacity allowed)"
            - "err == ERR_PICKUP_WINDOW_FULL for the third overlapping window (load 2 >= capacity 2)"
            - "ap3_st == SCHEDULED for the disjoint [05:00, 06:00) window"

      - name: billing_period_half_open_adjacency
        grounds:
          - entities.BillingCycle.fields.period_end
          - errors[ERR_BILLING_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Semantics C — interval-vs-interval overlap with half-open arithmetic on
          BillingCycle (third resource): a cycle starting exactly at the previous
          cycle's period_end is adjacent, not overlapping (allowed); a one-day
          overlap is rejected.
        test_recipe:
          setup: ["Plan; merchant MP"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Per", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }, as: PlatformAdmin, captures: { bc_a: $.data.id } }
          trigger:
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, captures: { bc_b: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-05-15T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "bc_b created (201) — start == prior period_end is allowed (half-open)"
            - "err == ERR_BILLING_PERIOD_OVERLAP for the [05-15, 07-01) window overlapping both cycles"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: tote_add_remove_conserves_manifest_totals
        grounds:
          - calculations.tote_manifest_totals
          - concurrency_rules[tote-membership-stale-tote]
        distinguishing_aspect: |
          Conserved quantity: tote manifest totals. Adding an order (2 units /
          1600 g) then removing it restores manifest_units and
          manifest_weight_grams to exactly their pre-add values and clears
          order.tote_id; only tote.version advances.
        test_recipe:
          setup: ["Counter location LI; route RI; tote TI (empty, version captured); order OI dropped off at LI (item qty 2 weight 800 -> 2 units / 1600 g)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Inv", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "siv@x.com", full_name: "S Inv", postal_code: "10024" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-I", kind: COUNTER, postal_code: "20010" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-4", weight_capacity_grams: 100000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id, tote_v1: $.data.version, pre_units: $.data.manifest_units, pre_weight: $.data.manifest_weight_grams } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, boxless: false, items: [ { sku: "IV", quantity: 2, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 800 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id, ro1_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro1}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro1_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro1}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
          trigger:
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v1}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_v2: $.data.version, mid_units: $.data.manifest_units, mid_weight: $.data.manifest_weight_grams } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders/remove", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v2}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_v3: $.data.version, post_units: $.data.manifest_units, post_weight: $.data.manifest_weight_grams } }
            - { call: "GET /v1/return-orders/${ro1}", payload: {}, as: LocationOperator, as_user_id: "${loc_id}", captures: { ro_tote: $.data.tote_id } }
          assert:
            - "pre_units == 0 and pre_weight == 0"
            - "mid_units == 2 and mid_weight == 1600"
            - "post_units == 0 and post_weight == 0 (invariant restored exactly)"
            - "ro_tote == null and tote_v3 == tote_v1 + 2"

      - name: ledger_adjustment_correction_conserves_payable
        grounds:
          - calculations.refund_projection
          - entities.RefundLedgerEntry.fields.kind
        distinguishing_aspect: |
          Conserved quantity: refund payable_cents. An ADJUSTMENT of +500 followed
          by its CORRECTION of -500 leaves payable_cents identical to the
          post-FINAL baseline; only the entry count grows.
        test_recipe:
          setup: ["Plan free_returns=false, pickup true; merchant; cycle; shopper; zone; order fulfilled to REFUND_POSTED with single NEW item unit 10000 (payable 10000)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 1000, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Led", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sle@x.com", full_name: "S Led", postal_code: "10025" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZL", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "LD", quantity: 1, unit_price_cents: 10000, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/return-orders/${ro_id}/receive", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/items", payload: {}, as: PlatformAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /v1/return-items/${it1}/inspect", payload: { condition: NEW }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/refund-projection", payload: {}, as: PlatformAdmin, captures: { pre_pay: $.data.payable_cents, pre_n: $.data.entry_count } }
          trigger:
            - { call: "POST /v1/return-orders/${ro_id}/refund-ledger/entries", payload: { kind: ADJUSTMENT, amount_cents: 500, note: "goodwill" }, as: SupportAgent, as_user_id: "agent-a" }
            - { call: "GET /v1/return-orders/${ro_id}/refund-projection", payload: {}, as: PlatformAdmin, captures: { mid_pay: $.data.payable_cents } }
            - { call: "POST /v1/return-orders/${ro_id}/refund-ledger/entries", payload: { kind: CORRECTION, amount_cents: -500, note: "reverse goodwill" }, as: PlatformAdmin }
            - { call: "GET /v1/return-orders/${ro_id}/refund-projection", payload: {}, as: PlatformAdmin, captures: { post_pay: $.data.payable_cents, post_n: $.data.entry_count } }
          assert:
            - "pre_pay == 10000 and pre_n == 2 (ESTIMATE + FINAL)"
            - "mid_pay == 10500 after ADJUSTMENT"
            - "post_pay == 10000 after CORRECTION (invariant restored) and post_n == 4"

      - name: reserve_release_conserves_slot_occupancy_counters
        grounds:
          - state_machines.SlotReservation.HELD_to_RELEASED
          - entities.DropoffLocation.fields.reserved_slot_count
        distinguishing_aspect: |
          Conserved quantity: location slot occupancy counters. reserve (+1
          reserved) followed by release (-1) returns reserved_slot_count and
          occupied_slot_count to baseline and the slot to EMPTY.
        test_recipe:
          setup: ["Plan boxless true; merchant; cycle; shopper; LOCKER location LC with XL slot SC (both counters 0); LOCKER_QR order OC"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-Cnt", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "scn@x.com", full_name: "S Cnt", postal_code: "10026" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-C", kind: LOCKER, postal_code: "20011" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/dropoff-locations/${loc_id}/locker-slots", payload: { size_class: XL }, as: PlatformAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: LOCKER_QR, items: [ { sku: "CN", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 20, weight_grams: 100 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
          trigger:
            - { call: "POST /v1/slot-reservations", payload: { return_order_id: "${ro_id}", slot_id: "${slot_id}" }, as: Shopper, as_user_id: "${sh_id}", captures: { res_id: $.data.id } }
            - { call: "GET /v1/dropoff-locations/${loc_id}", payload: {}, as: PlatformAdmin, captures: { mid_res: $.data.reserved_slot_count, mid_occ: $.data.occupied_slot_count } }
            - { call: "POST /v1/slot-reservations/${res_id}/release", payload: {}, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "GET /v1/dropoff-locations/${loc_id}", payload: {}, as: PlatformAdmin, captures: { post_res: $.data.reserved_slot_count, post_occ: $.data.occupied_slot_count } }
            - { call: "GET /v1/locker-slots/${slot_id}", payload: {}, as: PlatformAdmin, captures: { slot_st: $.data.status } }
          assert:
            - "mid_res == 1 and mid_occ == 0 after reserve"
            - "post_res == 0 and post_occ == 0 after release (invariant restored)"
            - "slot_st == EMPTY"
