              captures: { notif_id: $.data.id }
          trigger:
            - call: "POST /notifications/${notif_id}/transitions"
              payload: { action: "SEND" }
              as: DistrictAdmin
            - call: "POST /notifications/${notif_id}/transitions"
              payload: { action: "FAIL", failure_reason: "Number unreachable" }
              as: DistrictAdmin
            - call: "POST /notifications/${notif_id}/transitions"
              payload: { action: "REQUEUE" }
              as: DistrictAdmin
            - call: "POST /notifications/${notif_id}/transitions"
              payload: { action: "SEND" }
              as: DistrictAdmin
            - call: "POST /notifications/${notif_id}/transitions"
              payload: { action: "FAIL", failure_reason: "Voicemail full" }
