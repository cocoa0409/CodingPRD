# =============================================================================
# SCAFFOLD DIFFICULTY DESIGN — task_2812 Design Firm Project Accounting &
# Multiplier Billing. Index of every difficulty feature the scaffold claims,
# cross-referenced from SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 rules.
# 9 rule_ids / 20 instances. Every literal in an `assert:` line was computed
# by executing the corresponding §1.3 formula (round_half_up at the declared
# precision) against the pinned setup values.
# Logical-clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: phase_earned_value_effort_based_vs_assessed
        grounds:
          - calculations.phase_earned_value
          - entities.Project.fields.percent_complete_method
          - entities.Phase.fields.effort_based_earned_value
          - entities.Phase.fields.assessed_earned_value
          - entities.Phase.fields.recognized_earned_value
        distinguishing_aspect: |
          Two projects carrying byte-identical phase fees, budgets, timesheets and a
          0.2500 physical assessment recognize different revenue solely because
          percent_complete_method selects the cost-to-cost variant (3620.00) on one and
          the assessed variant (50000.00) on the other.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "one private client; two projects on it, identical except percent_complete_method (EFFORT_BASED vs ASSESSED)"
            - "each project has one LUMP_SUM phase with phase_fee 200000.00 and budget_labor_cost 60000.00"
            - "each project has the same two approved PROJECT_ARCHITECT time entries (7.35 h and 10.00 h at raw_cost_rate 62.50, multiplier 3.0500) so actual_labor_cost_to_date is 1084.38 on both"
            - "each phase is assessed at 0.2500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "PROJECT_ARCHITECT", raw_cost_rate: 62.50, effective_from: "2026-01-01" }
              as: Controller
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Riverside Library - effort", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000, wip_alert_threshold: 50000.00 }
              as: Controller
              captures: { p_eff: $.data.id, p_eff_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_eff}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph_eff: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_eff}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_eff_v0}" }
              as: Controller
            - call: "POST /projects/${p_eff}/activate"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_eff}", phase_id: "${ph_eff}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 7.35 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_eff_1: $.data.id }
            - call: "POST /time-entries/${te_eff_1}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { project_id: "${p_eff}", phase_id: "${ph_eff}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-12", hours: 10.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_eff_2: $.data.id }
            - call: "POST /time-entries/${te_eff_2}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Riverside Library - assessed", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "ASSESSED", target_multiplier: 3.0000, wip_alert_threshold: 50000.00 }
              as: Controller
              captures: { p_asm: $.data.id, p_asm_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_asm}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph_asm: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_asm}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_asm_v0}" }
              as: Controller
            - call: "POST /projects/${p_asm}/activate"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_asm}", phase_id: "${ph_asm}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 7.35 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_asm_1: $.data.id }
            - call: "POST /time-entries/${te_asm_1}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { project_id: "${p_asm}", phase_id: "${ph_asm}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-12", hours: 10.00 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_asm_2: $.data.id }
            - call: "POST /time-entries/${te_asm_2}/approve"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
          trigger:
            - call: "POST /phases/${ph_eff}/assess"
              payload: { assessed_percent_complete: 0.2500 }
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "POST /phases/${ph_asm}/assess"
              payload: { assessed_percent_complete: 0.2500 }
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "GET /phases/${ph_eff}/earned-value"
              payload: {}
              as: Controller
            - call: "GET /phases/${ph_asm}/earned-value"
              payload: {}
              as: Controller
          assert:
            - "Phase.${ph_eff}.actual_labor_cost_to_date == 1084.38 and Phase.${ph_asm}.actual_labor_cost_to_date == 1084.38"
            - "Phase.${ph_eff}.effort_based_percent_complete == 0.0181 and Phase.${ph_eff}.effort_based_earned_value == 3620.00"
            - "Phase.${ph_eff}.assessed_earned_value == 50000.00 (computed but NOT recognized)"
            - "Phase.${ph_eff}.recognized_earned_value == 3620.00"
            - "Phase.${ph_asm}.recognized_earned_value == 50000.00"
            - "Phase.${ph_asm}.effort_based_earned_value == 3620.00 (computed but NOT recognized)"
            - "Project.${p_eff}.earned_revenue_to_date == 3620.00"
            - "Project.${p_asm}.earned_revenue_to_date == 50000.00"
            - "the two projects' earned_revenue_to_date differ by exactly 46380.00 from identical charge data"

      - name: overhead_rate_provisional_vs_final_ceiling
        grounds:
          - calculations.overhead_rate_computation
          - state_machines.OverheadRateCertification.SUBMITTED_to_CERTIFIED
          - validations[priority=51]
          - entities.OverheadRateCertification.fields.provisional_overhead_rate
          - entities.OverheadRateCertification.fields.final_overhead_rate
          - entities.OverheadRateCertification.fields.certified_multiplier_ceiling
        distinguishing_aspect: |
          The same submitted figures (pool 1980000.00, base 1200000.00, unallowable 90000.00,
          ytd_months 6) yield 1.6500 through the PROVISIONAL variant (annualized, unallowable
          costs retained) and 1.5750 through the FINAL variant (actual basis, unallowable
          costs removed), and only the FINAL variant publishes the 2.8325 multiplier ceiling
          that then rejects a 3.0500 multiplier while admitting exactly 2.8325.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z, so the governing fiscal year is 2026"
            - "one public-agency client with a project activated on a 2.5000 multiplier effective 2026-01-01"
            - "no overhead certification exists yet, so Project.certified_multiplier_ceiling is null and no ceiling check applies"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "State Transit Authority", is_public_agency: true, retainage_pct: 0.0500, expense_markup_pct: 0.0500, disallowed_categories: [], receipt_required_above: 75.00, review_cycle_days: 45 }
              as: FirmAdmin
              captures: { cl_pub: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl_pub}", name: "Transit Center Renovation", contract_type: "TIME_AND_MATERIALS", contract_amount: 900000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 2.5000 }
              as: Controller
              captures: { p_pub: $.data.id, p_pub_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_pub}", wbs_code: "01-SD", fee_basis: "PERCENT_OF_CONTRACT", fee_percent: 0.2500, budget_labor_cost: 50000.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_pub: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_pub}", multiplier: 2.5000, effective_from: "2026-01-01", expected_project_version: "${p_pub_v0}" }
              as: Controller
            - call: "POST /projects/${p_pub}/activate"
              payload: {}
              as: Controller
          trigger:
            - call: "POST /overhead-certifications"
              payload: { fiscal_year: 2026, ytd_months: 6, direct_labor_base: 1200000.00, indirect_cost_pool: 1980000.00, unallowable_costs: 90000.00 }
              as: Controller
              as_user_id: "ctl-prep"
              captures: { cert_id: $.data.id, prov_rate: $.data.provisional_overhead_rate }
            - call: "POST /overhead-certifications/${cert_id}/certify"
              payload: {}
              as: Controller
              as_user_id: "ctl-cert"
            - call: "GET /projects/${p_pub}"
              payload: {}
              as: Controller
              captures: { p_pub_v1: $.data.version }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_pub}", multiplier: 3.0500, effective_from: "2026-07-01", expected_project_version: "${p_pub_v1}" }
              as: Controller
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_pub}", multiplier: 2.8325, effective_from: "2026-07-01", expected_project_version: "${p_pub_v1}" }
              as: Controller
          assert:
            - "OverheadRateCertification.${cert_id}.provisional_overhead_rate == 1.6500 at submission"
            - "OverheadRateCertification.${cert_id}.final_overhead_rate is null while status == SUBMITTED"
            - "after certify: OverheadRateCertification.${cert_id}.final_overhead_rate == 1.5750 and status == CERTIFIED"
            - "after certify: OverheadRateCertification.${cert_id}.certified_multiplier_ceiling == 2.8325"
            - "after certify: Project.${p_pub}.certified_multiplier_ceiling == 2.8325 and Project.${p_pub}.billing_posture == OPEN"
            - "the 3.0500 multiplier request returns 422 ERR_MULTIPLIER_ABOVE_CERTIFIED_CEILING"
            - "the 2.8325 multiplier request returns 201 (the ceiling comparison is inclusive) with BillingMultiplier.status == ACTIVE"
            - "final_overhead_rate (1.5750) != provisional_overhead_rate (1.6500) for identical submitted figures"

  - rule_id: combinatorial_formula
    instances:
      - name: consultant_markup_four_input_interaction
        grounds:
          - calculations.consultant_markup_computation
          - entities.Project.fields.contract_type
          - entities.Client.fields.is_public_agency
          - entities.ConsultantInvoice.fields.applied_markup_pct
          - state_machines.ConsultantInvoice.RECEIVED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) multi-input interaction: applied_markup_pct is a non-additive function of
          four inputs — project-level cumulative approved consultant volume, contract_type,
          Client.is_public_agency and the invoice amount — so an identical 40000.00 payable
          draws 0.1200 (private FIXED_FEE) or 0.0500 (public FIXED_FEE, capped), while on a
          private TIME_AND_MATERIALS project the very same payable draws 0.1000 before the
          250000.00 cumulative threshold and 0.0600 after it.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client with two projects: P1 TIME_AND_MATERIALS and P3 FIXED_FEE; public client with project P2 FIXED_FEE"
            - "each project has one leaf phase with a consultant_budget large enough for its subcontract, and one EXECUTED subcontract"
            - "no consultant payable has been approved anywhere yet, so every project's cumulative approved volume starts at 0.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_priv: $.data.id }
            - call: "POST /clients"
              payload: { name: "State Transit Authority", is_public_agency: true, retainage_pct: 0.0500, expense_markup_pct: 0.0500, disallowed_categories: [], receipt_required_above: 75.00, review_cycle_days: 45 }
              as: FirmAdmin
              captures: { cl_pub: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl_priv}", name: "P1 hourly tower", contract_type: "TIME_AND_MATERIALS", contract_amount: 2000000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p1}", wbs_code: "03-CD", fee_basis: "LUMP_SUM", lump_sum_fee: 800000.00, budget_labor_cost: 200000.00, consultant_budget: 400000.00 }
              as: Controller
              captures: { ph1: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p1}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p1_v0}" }
              as: Controller
            - call: "POST /projects/${p1}/activate"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p1}", phase_id: "${ph1}", consultant_name: "Meridian Structural", committed_amount: 300000.00, pay_when_paid: false, commitment_start: "2026-04-01", commitment_end: "2026-12-31" }
              as: Controller
              captures: { sc1: $.data.id }
            - call: "POST /consultant-subcontracts/${sc1}/execute"
              payload: {}
              as: Controller
            - call: "POST /projects"
              payload: { client_id: "${cl_priv}", name: "P3 fixed fee annex", contract_type: "FIXED_FEE", contract_amount: 500000.00, project_manager_user_id: "pm-001", percent_complete_method: "ASSESSED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p3: $.data.id, p3_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p3}", wbs_code: "03-CD", fee_basis: "PERCENT_OF_CONTRACT", fee_percent: 0.2000, budget_labor_cost: 40000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph3: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p3}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p3_v0}" }
              as: Controller
            - call: "POST /projects/${p3}/activate"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p3}", phase_id: "${ph3}", consultant_name: "Meridian Structural", committed_amount: 50000.00, pay_when_paid: false, commitment_start: "2026-04-01", commitment_end: "2026-12-31" }
              as: Controller
              captures: { sc3: $.data.id }
            - call: "POST /consultant-subcontracts/${sc3}/execute"
              payload: {}
              as: Controller
            - call: "POST /projects"
              payload: { client_id: "${cl_pub}", name: "P2 fixed fee transit", contract_type: "FIXED_FEE", contract_amount: 500000.00, project_manager_user_id: "pm-001", percent_complete_method: "ASSESSED", target_multiplier: 2.5000 }
              as: Controller
              captures: { p2: $.data.id, p2_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p2}", wbs_code: "03-CD", fee_basis: "PERCENT_OF_CONTRACT", fee_percent: 0.2000, budget_labor_cost: 40000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph2: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p2}", multiplier: 2.5000, effective_from: "2026-01-01", expected_project_version: "${p2_v0}" }
              as: Controller
            - call: "POST /projects/${p2}/activate"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p2}", phase_id: "${ph2}", consultant_name: "Meridian Structural", committed_amount: 50000.00, pay_when_paid: false, commitment_start: "2026-04-01", commitment_end: "2026-12-31" }
              as: Controller
              captures: { sc2: $.data.id }
            - call: "POST /consultant-subcontracts/${sc2}/execute"
              payload: {}
              as: Controller
          trigger:
            - call: "POST /consultant-invoices"
              payload: { subcontract_id: "${sc1}", amount: 250000.00, invoice_date: "2026-05-05", backup_attached: true }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ci_tier1: $.data.id }
            - call: "POST /consultant-invoices/${ci_tier1}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /consultant-invoices"
              payload: { subcontract_id: "${sc1}", amount: 10000.00, invoice_date: "2026-05-20", backup_attached: true }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ci_tier2: $.data.id }
            - call: "POST /consultant-invoices/${ci_tier2}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /consultant-invoices"
              payload: { subcontract_id: "${sc3}", amount: 40000.00, invoice_date: "2026-05-20", backup_attached: true }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ci_priv_ffe: $.data.id }
            - call: "POST /consultant-invoices/${ci_priv_ffe}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /consultant-invoices"
              payload: { subcontract_id: "${sc2}", amount: 40000.00, invoice_date: "2026-05-20", backup_attached: true }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ci_pub_ffe: $.data.id }
            - call: "POST /consultant-invoices/${ci_pub_ffe}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-001"
          assert:
            - "ConsultantInvoice.${ci_tier1}.applied_markup_pct == 0.1000, markup_amount == 25000.00, billable_amount == 275000.00"
            - "ConsultantInvoice.${ci_tier2}.applied_markup_pct == 0.0600, markup_amount == 600.00, billable_amount == 10600.00 (cumulative approved volume was exactly 250000.00, an inclusive threshold)"
            - "ConsultantInvoice.${ci_priv_ffe}.applied_markup_pct == 0.1200, markup_amount == 4800.00, billable_amount == 44800.00"
            - "ConsultantInvoice.${ci_pub_ffe}.applied_markup_pct == 0.0500, markup_amount == 2000.00, billable_amount == 42000.00"
            - "the same 40000.00 payable produces markup_amount 4800.00 on the private FIXED_FEE project and 2000.00 on the public FIXED_FEE project"
            - "ConsultantSubcontract.${sc1}.approved_to_date == 260000.00 and committed_remaining == 40000.00"

      - name: labor_charge_two_step_rounding_order
        grounds:
          - calculations.labor_charge_computation
          - calculations.effective_rate_lookup
          - entities.TimeEntry.fields.raw_cost
          - entities.TimeEntry.fields.billable_amount
          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (b) pinned evaluation order: raw_cost must be rounded to cents BEFORE the
          multiplier is applied, so 7.35 h at 62.50 with multiplier 3.0500 must yield
          1401.11 and never the single-step 1401.09, and 3.25 h must yield 619.55 and never
          the single-step 619.53 — two independent operand sets whose two orders diverge.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client, TIME_AND_MATERIALS project activated with multiplier 3.0500 effective 2026-01-01"
            - "PROJECT_ARCHITECT raw_cost_rate 62.50 effective from 2026-01-01, open-ended"
            - "two submitted time entries of 7.35 h and 3.25 h, both dated inside the rate and multiplier windows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "PROJECT_ARCHITECT", raw_cost_rate: 62.50, effective_from: "2026-01-01" }
              as: Controller
            - call: "POST /projects"
              payload: { client_id: "${cl_id}", name: "Riverside Library", contract_type: "TIME_AND_MATERIALS", contract_amount: 800000.00, project_manager_user_id: "pm-001", percent_complete_method: "EFFORT_BASED", target_multiplier: 3.0000 }
              as: Controller
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", lump_sum_fee: 200000.00, budget_labor_cost: 60000.00, consultant_budget: 100000.00 }
              as: Controller
              captures: { ph_id: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 7.35 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_a: $.data.id }
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-12", hours: 3.25 }
