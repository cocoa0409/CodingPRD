            - { call: "POST /group-orders/${grp_ord_id}/submit", as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "PATCH /restaurants/${rest_thai_id}", payload: { status: "ELIGIBLE" }, as: PlatformAdmin }
            - { call: "POST /group-orders/${grp_ord_id}/submit", as: Employee, as_user_id: "${emp_ada_id}" }
          assert:
            - "the first submit returns 409 with error_id ERR_RESTAURANT_NOT_ELIGIBLE"
            - "GroupOrder.${grp_ord_id}.status == LOCKED after the refusal and allocated_delivery_fee_cents == 0"
            - "the second submit succeeds: GroupOrder.${grp_ord_id}.status == SUBMITTED and allocated_delivery_fee_cents == 1250"
            - "Order.${mem1_id}.delivery_fee_cents == 1250 (sole member takes the whole group fee) and covered_base_cents == 2438"
            - "Order.${mem1_id}.employer_covered_cents == 2438 and BenefitPeriod.${per_ada_id}.reserved_cents == 2438"

      - name: locked_tax_month_record_blocks_deliver_of_a_backdated_order_from_a_later_period
        grounds:
          - validations[priority=14]
          - state_machines.ImputedIncomeRecord.ACCRUING_to_LOCKED
          - state_machines.BenefitPeriod.OPEN_to_CLOSED
          - errors.ERR_TAX_MONTH_LOCKED
        distinguishing_aspect: |
          The gating entity is reached through a THIRD key rather than the order's own parent: the
          order draws on an OPEN 2026-09 BenefitPeriod, but its tax_month is 2026-08 whose
          ImputedIncomeRecord was cascaded to LOCKED by the 2026-08 final close, so deliver fails
          while an otherwise identical 2026-09-dated order on the same period delivers fine.
        test_recipe:
          setup:
            - "Program (DE_MINIMIS_EXCLUSION, CAPPED_PCT 0.25) / Engineering / HQ dock / Thai Garden / Ada."
            - "Ada's 2026-08 period is opened, one 3 x 1000 order with tip 200 is DELIVERED, then the period is closed with mode FINAL, which cascades the 2026-08 ImputedIncomeRecord to LOCKED."
            - "A 2026-09 period is opened with the 2026-08 period as predecessor, carrying 12500 rollover into 62500 allocated."
            - "Two orders are placed and confirmed against the 2026-09 period: one dated 2026-08-10T12:00:00Z (tax_month 2026-08) and one dated 2026-09-01T12:00:00Z (tax_month 2026-09)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0, taxable_benefit_method: "DE_MINIMIS_EXCLUSION", rollover_policy: "CAPPED_PCT", rollover_cap_pct: 0.25 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_aug_id: $.data.id, per_aug_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_aug_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord_aug_id: $.data.id } }
            - { call: "POST /orders/${ord_aug_id}/place", payload: { expected_benefit_period_version: "${per_aug_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord_aug_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord_aug_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /benefit-periods/${per_aug_id}/close", payload: { mode: "FINAL" }, as: ProgramAdmin }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-09", predecessor_period_id: "${per_aug_id}" }, as: ProgramAdmin, captures: { per_sep_id: $.data.id, per_sep_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_sep_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-10T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord_backdated_id: $.data.id } }
            - { call: "POST /orders/${ord_backdated_id}/place", payload: { expected_benefit_period_version: "${per_sep_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord_backdated_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "GET /benefit-periods/${per_sep_id}", as: ProgramAdmin, captures: { per_sep_v2: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_sep_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-09-01T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord_sep_id: $.data.id } }
            - { call: "POST /orders/${ord_sep_id}/place", payload: { expected_benefit_period_version: "${per_sep_v2}" }, as: Employee, as_user_id: "${emp_ada_id}" }
