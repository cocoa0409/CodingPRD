  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: long_track_five_minute_boundary
        grounds:
          - calculations.usage_line_royalty
          - entities.UsageLine.fields.duration_seconds
        distinguishing_aspect: |
          Numeric-threshold boundary on the duration metric via the line
          creation endpoint: duration_seconds == 300 prices at the flat
          131-cent rate (<= is inclusive), while 301 tips into the per-minute
          formula (max(131, 252 * 6) == 1512 cents unit).
        test_recipe:
          setup:
            - "Clock 2026-09-10; schedule 131/252 ACTIVE; DSP ACTIVE; DRAFT report for 2026-08"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
