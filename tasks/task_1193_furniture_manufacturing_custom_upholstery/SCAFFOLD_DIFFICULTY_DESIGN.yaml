  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cell_capacity_aggregate_overlap
        grounds:
          - errors[ERR_CELL_CAPACITY_EXCEEDED]
          - entities.Cell.fields.capacity_slots
        distinguishing_aspect: |
          Interval semantics = aggregate capacity with INCLUSIVE boundary on resource Cell:
          a CUTTING cell with capacity_slots 2 accepts two overlapping bookings (exactly at
          capacity) and rejects the booking that would make it three. Distinct from the
          sample-serial gap semantics and from the half-open exclusivity on capacity-1 cells.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-NP (no match, rule (A, ESPRESSO, allowed, 0), no components)"
            - "PLANT spec FAB-A; lot AVAILABLE 30.0; order ORD-CAP with line qty 1 confirmed → CONFIRMED"
            - "Cell C-CAP: CUTTING, capacity_slots 2"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-CAP", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CAP", cell_type: "CUTTING", capacity_slots: 2, certifications: [] }
              as: ProductionPlanner
              captures: { c_cap: $.data.id }
          trigger:
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cap}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T12:00:00Z" }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cap}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-08T11:00:00Z", end_at: "2026-06-08T13:00:00Z" }
              as: ProductionPlanner
              captures: { b2: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cap}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-08T11:30:00Z", end_at: "2026-06-08T12:30:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Bookings ${b1} [10:00,12:00) and ${b2} [11:00,13:00) both BOOKED — overlapping count 2 == capacity_slots is allowed"
            - "Third overlapping booking [11:30,12:30) rejected: 409 data.error_id == ERR_CELL_CAPACITY_EXCEEDED"
            - "Cell.${c_cap}.committed_hours == 4.0"

      - name: sample_serial_refurb_gap
        grounds:
          - errors[ERR_SAMPLE_IN_REFURB]
          - errors[ERR_UNIT_SERIAL_UNAVAILABLE]
          - entities.ShowroomSample.fields.unit_serial
        distinguishing_aspect: |
          Interval semantics = closed loan interval plus a mandatory 5-day refurbishment gap
          on resource unit_serial (a ShowroomSample attribute, not a Cell): a re-loan at
          returned_at + 4 days is rejected, while exactly returned_at + 5 days is allowed —
          different resource and different interval treatment than the cell rules.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer DLR-001 with sample_allowance 100000; model M-NP"
            - "Sample S1 (serial UNIT-77, value 10000) ON_LOAN, then returned at clock 2026-05-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 100000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/showroom-samples"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", unit_serial: "UNIT-77", sample_value_cents: 10000, due_back_days: 30 }
              as: SalesRep
              captures: { s1: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/showroom-samples/${s1}/return"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-24T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/showroom-samples"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", unit_serial: "UNIT-77", sample_value_cents: 10000, due_back_days: 30 }
              as: SalesRep
              captures: { err: $.data.error_id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/showroom-samples"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", unit_serial: "UNIT-77", sample_value_cents: 10000, due_back_days: 30 }
              as: SalesRep
              captures: { s2: $.data.id }
          assert:
            - "Re-loan at returned_at + 4 days rejected: 409 data.error_id == ERR_SAMPLE_IN_REFURB"
            - "Re-loan at exactly returned_at + 5 days (2026-05-25T00:00:00Z) succeeds: Sample.${s2}.disposition == ON_LOAN (gap boundary inclusive)"
            - "DealerAccount.${dealer_id}.outstanding_sample_value_cents == 10000 after the successful re-loan"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cell_hours_book_release_conserved
        grounds:
          - calculations.cell_committed_hours
          - state_machines.CellBooking.BOOKED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = cell hours. committed_hours = Σ duration_hours of bookings in
          {BOOKED, IN_PROGRESS}: booking 3.5 hours moves 0.0 → 3.5, and the compensating
          release returns it to exactly 0.0 — no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-NP (no match, rule (A, ESPRESSO, allowed, 0), no components)"
            - "PLANT spec FAB-A; lot AVAILABLE 30.0; order ORD-HRS with line qty 1 confirmed → CONFIRMED"
            - "Cell C-CUT: CUTTING, capacity_slots 1, committed_hours 0.0"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
