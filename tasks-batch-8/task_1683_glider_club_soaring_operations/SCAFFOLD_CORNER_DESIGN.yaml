              captures: { fm: $.data.id }
            - call: "POST /soaring/flights/${fm}/land"
              payload: { landed_at: "2026-08-23T12:15:00Z" }
              as: Member
              as_user_id: "${mm}"
          trigger:
            - call: "POST /soaring/aircraft/${gm}/maintenance-records"
              payload: { kind: "INSPECTION_100H", performed_at: "2026-08-23T13:00:00Z", hobbs_hours_at_service: 100.0 }
              as: ClubAdmin
          assert:
            - "after land: Aircraft.${gm}.status == GROUNDED and hours_since_inspection == 100.0"
            - "after INSPECTION_100H record: Aircraft.${gm}.hours_since_inspection == 0 and status == AIRWORTHY and grounded_reason == null"

