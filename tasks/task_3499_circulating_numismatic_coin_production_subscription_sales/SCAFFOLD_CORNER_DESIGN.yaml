              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "SUB-CX", product_family: "SUBFAM", product_type: "SUBSCRIPTION_SERIES", price_cents: 9995, mintage_limit: 10000, household_order_limit: 1000, release_datetime: "2026-08-15T00:00:00Z", subscription_eligible: true }
              as: ProgramManager
