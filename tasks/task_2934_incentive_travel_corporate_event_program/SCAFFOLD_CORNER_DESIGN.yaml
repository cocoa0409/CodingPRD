        200 with status "PROPOSED", round_count 3 and nightly_rate_cents back to 38500.
      - 'The second execute returns 200 with status "EXECUTED": the aggregate 2310000 <= 2310000 passes
        again, and segregation of duties is satisfied because ca-01 is neither last_proposed_by_user_id
        "sm-01" nor last_countered_by_user_id "ca-02".'
      - GET /programs/${p_id} then shows status "CONTRACTED" and per_person_cost_basis_cents 431757.
  - name: guest_policy_rules_apply_only_to_guest_rows_and_read_the_assigned_tier_allowance
    claim_type: conditional_validation
    grounds:
    - §1.4 priority 20 ERR_GUEST_ALLOWANCE_EXCEEDED
    - §1.4 priority 21 ERR_GUEST_LINK_INVALID
    - §1.1 AwardTier.guest_allowance, Registration.guest_of_registration_id
    - §1.0 relationship_patterns self_referential
    distinguishing_aspect: |
      Both guest rules are conditional in the sense the pattern means: they consult a per-row
      configuration (the assigned tier's guest_allowance) and they apply only when
      registration_kind == GUEST. The instance carries two winners on tiers with DIFFERENT
      allowances in the same program and the same request shape — PLATINUM permits one guest,
      BRONZE permits none — so the with-config and without-config halves are a single API call
