# =============================================================================
# SCAFFOLD.yaml — High School Athletic Training & Injury Management
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  High School Athletic Training & Injury Management (school athletic trainer):
  pre-participation physical & baseline concussion testing, injury evaluation &
  documentation, return-to-play protocol stages & clearance authority, emergency
  action plan by venue, coverage assignment across simultaneous events, referral
  to physician & communication with family, heat/lightning policy enforcement,
  supply/equipment inventory

domain_name: athletic-training-injury-management
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Staff
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: role_type, type: enum, source: input, description: "ATHLETIC_TRAINER | TEAM_COACH | PHYSICIAN | ATHLETIC_DIRECTOR | SCHOOL_NURSE", constraints: "enum; immutable after creation" }
      - { name: sport_certifications, type: array, source: input, description: "Sports the staff member is certified to cover (strings from the sport enum)", default: [] }
      - { name: is_active, type: boolean, source: input, description: "Inactive staff cannot be newly assigned", default: true }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student-athlete full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: grade, type: integer, source: input, description: "School grade 9..12", constraints: "integer in [9,12]" }
      - { name: sex, type: enum, source: input, description: "M | F" }
      - { name: primary_sport, type: enum, source: input, description: "FOOTBALL | SOCCER | BASKETBALL | BASEBALL | SOFTBALL | VOLLEYBALL | WRESTLING | LACROSSE | FIELD_HOCKEY | CROSS_COUNTRY | TRACK | SWIMMING | TENNIS | GOLF" }
      - { name: team_level, type: enum, source: input, description: "VARSITY | JV | FRESHMAN" }
      - { name: guardian_name, type: string, source: input, description: "Parent/guardian full name" }
      - { name: guardian_user_id, type: string, source: input, description: "Opaque login id the ParentGuardian role presents as X-User-ID; ownership anchor for acknowledgement endpoints. NOT an entity id." }
      - { name: guardian_email, type: string, source: input, description: "Guardian email; required for EMAIL-channel notification send", default: null, constraints: "nullable" }
      - { name: guardian_phone, type: string, source: input, description: "Guardian phone; required for PHONE-channel notification send", default: null, constraints: "nullable" }
      - { name: participation_posture, type: enum, source: computed, description: "Derived gate per calculation athlete_participation_posture: NOT_CLEARED | INELIGIBLE | MEDICAL_HOLD | CLEARED_WITH_RESTRICTIONS | CLEARED", default: NOT_CLEARED }
      - { name: posture_reasons, type: array, source: computed, description: "Ordered list of machine-readable reason codes that produced the posture", default: [] }

  - name: PreParticipationPhysical
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: exam_date, type: string, source: input, description: "ISO date of the physical exam; must be <= current clock date" }
      - { name: examining_physician_name, type: string, source: input, description: "Free-text name of examining physician (often external)" }
      - { name: outcome, type: enum, source: input, description: "CLEARED | CLEARED_WITH_RESTRICTIONS | NOT_CLEARED | DEFERRED" }
      - { name: validity_policy, type: enum, source: input, description: "DISTRICT_13MO | STATE_SCHOOL_YEAR; selects physical_expiry variant" }
      - { name: restriction_notes, type: string, source: input, description: "Restriction detail when outcome is CLEARED_WITH_RESTRICTIONS", default: null, constraints: "nullable" }
      - { name: recorded_by_staff_id, type: string, source: system, description: "FK -> Staff.id; set from X-User-ID at creation" }
      - { name: verified_by_staff_id, type: string, source: system, description: "FK -> Staff.id; nullable; set on verify transition; must differ from recorded_by_staff_id", default: null, constraints: "nullable" }
      - { name: expires_on, type: datetime, source: computed, description: "Computed per physical_expiry calculation from exam_date + validity_policy" }
      - { name: status, type: enum, source: system, description: "RECORDED | VERIFIED | EXPIRED | VOIDED", default: RECORDED }

  - name: BaselineConcussionTest
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: test_date, type: string, source: input, description: "ISO date administered; must be <= current clock date" }
      - { name: instrument, type: enum, source: input, description: "SCAT6 | IMPACT | SWAY" }
      - { name: symptom_score, type: integer, source: input, description: "Total symptom severity 0..132", constraints: "0..132" }
      - { name: memory_index, type: number, source: input, description: "Composite memory index 0..100" }
      - { name: reaction_time_ms, type: number, source: input, description: "Mean reaction time in milliseconds, > 0" }
      - { name: balance_errors, type: integer, source: input, description: "BESS error count 0..60", constraints: "0..60" }
      - { name: administered_by_staff_id, type: string, source: system, description: "FK -> Staff.id; set from X-User-ID; caller role must be AthleticTrainer or SchoolNurse" }
      - { name: valid_until, type: datetime, source: computed, description: "= test_date + 24 months (calendar)" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED | EXPIRED", default: CURRENT }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: venue_name, type: string, source: input, description: "Venue name" }
      - { name: venue_type, type: enum, source: input, description: "INDOOR | OUTDOOR" }
      - { name: surface, type: enum, source: input, description: "GRASS | TURF | COURT | TRACK | POOL | GYM_FLOOR" }
      - { name: lightning_detection, type: boolean, source: input, description: "Whether the venue has on-site lightning detection", default: false }
      - { name: lightning_radius_miles, type: number, source: input, description: "Suspension trigger radius in miles", default: 8.0, constraints: "> 0" }
      - { name: address, type: string, source: input, description: "Street address used by EMS in the EAP" }
      - { name: is_active, type: boolean, source: input, description: "Inactive venues reject new events", default: true }
      - { name: active_eap_id, type: string, source: computed, description: "FK -> EmergencyActionPlan.id; nullable; pointer to the currently ACTIVE plan, moved by the activate transition", default: null, constraints: "nullable" }

  - name: EmergencyActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: version_label, type: string, source: input, description: "Human label, e.g. 2026-fall-v1; unique per venue" }
      - { name: evacuation_route, type: string, source: input, description: "Evacuation route text" }
      - { name: aed_location, type: string, source: input, description: "AED location text" }
      - { name: ems_contact, type: string, source: input, description: "EMS contact instructions" }
      - { name: nearest_hospital, type: string, source: input, description: "Nearest hospital name and address" }
      - { name: supersedes_eap_id, type: string, source: input, description: "FK -> EmergencyActionPlan.id; nullable; declared predecessor version at the same venue", default: null, constraints: "nullable" }
      - { name: authored_by_staff_id, type: string, source: system, description: "FK -> Staff.id; set from X-User-ID at creation" }
      - { name: approved_by_staff_id, type: string, source: system, description: "FK -> Staff.id; nullable; set on approve; must differ from authored_by_staff_id", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | ACTIVE | SUPERSEDED", default: DRAFT }

  - name: AthleticEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_name, type: string, source: input, description: "Event name" }
      - { name: sport, type: enum, source: input, description: "Same sport enum as Athlete.primary_sport" }
      - { name: team_level, type: enum, source: input, description: "VARSITY | JV | FRESHMAN" }
      - { name: event_type, type: enum, source: input, description: "PRACTICE | SCRIMMAGE | HOME_GAME | AWAY_GAME | TOURNAMENT" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC end; must be strictly after scheduled_start" }
      - { name: expected_attendance, type: integer, source: input, description: "Expected spectators; >= 0", constraints: ">= 0" }
      - { name: required_trainer_count, type: integer, source: computed, description: "Per event_coverage_requirement calculation" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of CoverageAssignment in ASSIGNED | ACKNOWLEDGED | ON_SITE | ON_HOLD for this event", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COVERED | IN_PROGRESS | SUSPENDED_WEATHER | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: suspension_reason, type: enum, source: system, description: "LIGHTNING | HEAT | MANUAL; nullable; set when entering SUSPENDED_WEATHER", default: null, constraints: "nullable" }

  - name: CoverageAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> AthleticEvent.id" }
      - { name: staff_id, type: string, source: input, description: "FK -> Staff.id; must reference role_type ATHLETIC_TRAINER" }
      - { name: coverage_role, type: enum, source: input, description: "PRIMARY | SECONDARY" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACKNOWLEDGED | ON_SITE | ON_HOLD | COMPLETED | DECLINED | CANCELLED", default: ASSIGNED }
      - { name: pre_hold_status, type: enum, source: system, description: "ACKNOWLEDGED | ON_SITE; nullable; snapshot restored when event resumes", default: null, constraints: "nullable" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Nullable; set on acknowledge", default: null, constraints: "nullable" }
      - { name: checked_in_at, type: datetime, source: system, description: "Nullable; set on check-in", default: null, constraints: "nullable" }

  - name: EnvironmentalReading
    parent: null
    common_fields: false
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: reading_type, type: enum, source: input, description: "HEAT_WBGT | LIGHTNING_STRIKE" }
      - { name: value_wbgt_f, type: number, source: input, description: "Wet-bulb globe temperature F; required iff reading_type=HEAT_WBGT", default: null, constraints: "nullable; 1 decimal" }
      - { name: strike_distance_miles, type: number, source: input, description: "Strike distance in miles; required iff reading_type=LIGHTNING_STRIKE", default: null, constraints: "nullable; >= 0" }
      - { name: recorded_at, type: datetime, source: input, description: "When the phenomenon was observed; must be <= current clock" }
      - { name: source, type: enum, source: input, description: "ON_SITE_SENSOR | WEATHER_SERVICE | MANUAL" }

  - name: InjuryEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: event_id, type: string, source: input, description: "FK -> AthleticEvent.id; nullable; event where injury occurred", default: null, constraints: "nullable" }
      - { name: body_region, type: enum, source: input, description: "HEAD_NECK | SHOULDER | ARM_HAND | TRUNK | HIP_PELVIS | KNEE | LOWER_LEG | ANKLE_FOOT | SYSTEMIC" }
      - { name: injury_type, type: enum, source: input, description: "CONCUSSION | FRACTURE | SPRAIN | STRAIN | LACERATION | HEAT_ILLNESS | CARDIAC | OTHER" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE | CRITICAL" }
      - { name: mechanism, type: string, source: input, description: "Free-text mechanism of injury" }
      - { name: evaluated_at, type: datetime, source: input, description: "When the evaluation occurred; must be <= current clock" }
      - { name: restricted_activities, type: array, source: input, description: "Subset of {PRACTICE, CONTACT, GAME, CONDITIONING, WEIGHTS}", default: [] }
      - { name: reopen_of_id, type: string, source: input, description: "FK -> InjuryEvaluation.id; nullable; documents recurrence of a CLOSED prior injury of the same athlete", default: null, constraints: "nullable" }
      - { name: evaluated_by_staff_id, type: string, source: system, description: "FK -> Staff.id; set from X-User-ID; creator must be AthleticTrainer" }
      - { name: recurrence_count, type: integer, source: system, description: "0 normally; = reopen_of.recurrence_count + 1 when reopen_of_id is given", default: 0 }
      - { name: resolved_at, type: datetime, source: system, description: "Nullable; set on RESOLVED transition, cleared on reopen", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_CARE | REFERRED | RTP_IN_PROGRESS | RESOLVED | CLOSED", default: OPEN }

  - name: PhysicianReferral
    parent: null
    common_fields: true
    fields:
      - { name: injury_id, type: string, source: input, description: "FK -> InjuryEvaluation.id" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; copied from the injury" }
      - { name: physician_staff_id, type: string, source: input, description: "FK -> Staff.id; must reference role_type PHYSICIAN" }
      - { name: reason, type: string, source: input, description: "Referral reason" }
      - { name: urgency, type: enum, source: input, description: "ROUTINE | URGENT | EMERGENT" }
      - { name: due_by, type: datetime, source: computed, description: "created_at + referral_due_window (14d ROUTINE, 3d URGENT, 1d EMERGENT)" }
      - { name: appointment_at, type: datetime, source: input, description: "Nullable; set on schedule", default: null, constraints: "nullable" }
      - { name: report_diagnosis, type: string, source: input, description: "Nullable; physician report text set on complete", default: null, constraints: "nullable" }
      - { name: report_clearance, type: enum, source: input, description: "Nullable; CLEARED_FULL | CLEARED_RESTRICTED | NOT_CLEARED; set on complete", default: null, constraints: "nullable" }
      - { name: reported_at, type: datetime, source: system, description: "Nullable; set on complete", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | COMPLETED | ADDENDUM_REQUESTED | CLOSED | CANCELLED | EXPIRED", default: REQUESTED }

  - name: ReturnToPlayProtocol
    parent: null
    common_fields: true
    fields:
      - { name: injury_id, type: string, source: input, description: "FK -> InjuryEvaluation.id" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; copied from the injury" }
      - { name: protocol_type, type: enum, source: input, description: "GRADUATED_6_STAGE" }
      - { name: current_stage, type: integer, source: system, description: "1..6", default: 1 }
      - { name: stage_entered_at, type: datetime, source: system, description: "Clock time when current_stage was entered" }
      - { name: recurrence_count, type: integer, source: system, description: "Symptom recurrences on THIS protocol", default: 0 }
      - { name: clearance_authority_required, type: enum, source: computed, description: "PHYSICIAN if injury_type=CONCUSSION or severity in {SEVERE, CRITICAL}; else TRAINER" }
      - { name: stage_history, type: array, source: system, description: "Append-only in-document log of {stage, entered_at, exited_at, exit_reason}", default: [] }
      - { name: cleared_by_staff_id, type: string, source: system, description: "FK -> Staff.id; nullable; set on clear", default: null, constraints: "nullable" }
      - { name: cleared_at, type: datetime, source: system, description: "Nullable; set on clear", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLEARED | TERMINATED", default: ACTIVE }

  - name: GuardianNotification
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id" }
      - { name: injury_id, type: string, source: system, description: "FK -> InjuryEvaluation.id; nullable", default: null, constraints: "nullable" }
      - { name: referral_id, type: string, source: system, description: "FK -> PhysicianReferral.id; nullable", default: null, constraints: "nullable" }
      - { name: notification_type, type: enum, source: system, description: "INJURY_INITIAL | REFERRAL_REQUEST | RTP_REGRESSION | CLEARANCE_GRANTED | EVENT_SUSPENSION" }
      - { name: channel, type: enum, source: system, description: "EMAIL | PHONE; chosen at creation: EMAIL if athlete.guardian_email present else PHONE" }
      - { name: subject, type: string, source: system, description: "Rendered subject line" }
      - { name: sent_at, type: datetime, source: system, description: "Nullable; set on send", default: null, constraints: "nullable" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Nullable; set on acknowledge", default: null, constraints: "nullable" }
      - { name: attempts, type: integer, source: system, description: "Send attempts", default: 0 }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | FAILED | ACKNOWLEDGED | ESCALATED", default: QUEUED }

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - { name: item_name, type: string, source: input, description: "Item name" }
      - { name: category, type: enum, source: input, description: "TAPE | FIRST_AID | HYDRATION | EQUIPMENT | MEDICATION" }
      - { name: unit, type: enum, source: input, description: "ROLL | EACH | CASE | LITER | BOX" }
      - { name: par_level, type: integer, source: input, description: "Desired shelf quantity; >= 1", constraints: ">= 1" }
      - { name: reorder_threshold, type: integer, source: input, description: "LOW_STOCK boundary; 0 <= threshold < par_level", constraints: ">= 0 and < par_level" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Standard unit cost in cents; > 0", constraints: "> 0" }
      - { name: is_discontinued, type: boolean, source: input, description: "Discontinued items reject new restock orders", default: false }
      - { name: current_stock, type: integer, source: computed, description: "Ledger sum per inventory_stock calculation", default: 0 }
      - { name: stock_status, type: enum, source: computed, description: "OUT_OF_STOCK (==0) | LOW_STOCK (1..reorder_threshold) | IN_STOCK (> reorder_threshold)", default: OUT_OF_STOCK }

  - name: InventoryTransaction
    parent: null
    common_fields: false
    fields:
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id" }
      - { name: txn_type, type: enum, source: input, description: "RESTOCK | USAGE | WASTE | ADJUSTMENT" }
      - { name: quantity, type: integer, source: input, description: "Always positive; sign is derived from txn_type (RESTOCK/ADJUSTMENT +, USAGE/WASTE -)", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Required iff txn_type=RESTOCK; ignored otherwise", default: null, constraints: "nullable; > 0 when present" }
      - { name: occurred_at, type: datetime, source: input, description: "When the movement occurred; must be <= current clock" }
      - { name: event_id, type: string, source: input, description: "FK -> AthleticEvent.id; nullable; links usage to an event", default: null, constraints: "nullable" }
      - { name: restock_order_id, type: string, source: system, description: "FK -> RestockOrder.id; nullable; set when created by order receipt", default: null, constraints: "nullable" }
      - { name: reason, type: string, source: input, description: "Free-text reason (mandatory for ADJUSTMENT and WASTE)", default: null, constraints: "nullable" }
      - { name: recorded_by_staff_id, type: string, source: system, description: "FK -> Staff.id; set from X-User-ID" }

  - name: RestockOrder
    parent: null
    common_fields: true
    fields:
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id" }
      - { name: quantity, type: integer, source: input, description: "Units to order; > 0", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Quoted unit cost; > 0", constraints: "> 0" }
      - { name: fiscal_year, type: integer, source: input, description: "Budget year charged" }
      - { name: extended_cost_cents, type: integer, source: computed, description: "= quantity * unit_cost_cents" }
      - { name: requested_by_staff_id, type: string, source: system, description: "FK -> Staff.id; set from X-User-ID" }
      - { name: approved_by_staff_id, type: string, source: system, description: "FK -> Staff.id; nullable; set on approve; must differ from requested_by_staff_id", default: null, constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RECEIVED | REJECTED | CANCELLED", default: DRAFT }

  - name: SupplyBudget
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Budget year; unique across SupplyBudget" }
      - { name: total_budget_cents, type: integer, source: input, description: "Annual supply budget; > 0", constraints: "> 0" }
      - { name: realized_spend_cents, type: integer, source: computed, description: "Sum of extended_cost_cents over RECEIVED orders for this fiscal_year", default: 0 }
      - { name: committed_spend_cents, type: integer, source: computed, description: "Sum of extended_cost_cents over APPROVED (not yet RECEIVED/CANCELLED) orders for this fiscal_year", default: 0 }
      - { name: available_cents, type: integer, source: computed, description: "= total_budget_cents - realized_spend_cents - committed_spend_cents", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Athlete
    initial_state: NOT_CLEARED
    terminal_states: []
    note: "Posture-driven derived machine: participation_posture is recomputed by the system after every mutation to the athlete's physicals, baselines, injuries, RTP protocols, or clock sweeps. No direct client transition endpoint exists."
    transitions:
      - from: "*"
        to: NOT_CLEARED
        trigger: "system recompute (calculation athlete_participation_posture)"
        actor: system
        preconditions: ["No VERIFIED physical has ever existed for the athlete"]
        side_effects: ["posture_reasons = [NO_VERIFIED_PHYSICAL]"]
      - from: "*"
        to: INELIGIBLE
        trigger: "system recompute"
        actor: system
        preconditions:
          - "A VERIFIED physical exists but is EXPIRED (now >= expires_on), or its outcome is NOT_CLEARED or DEFERRED, OR no CURRENT baseline with valid_until > now exists"
        side_effects: ["posture_reasons lists each failed gate (PHYSICAL_EXPIRED | PHYSICAL_OUTCOME_BLOCKS | NO_CURRENT_BASELINE)"]
      - from: "*"
        to: MEDICAL_HOLD
        trigger: "system recompute"
        actor: system
        preconditions:
          - "Physical and baseline gates pass, AND (athlete has an injury in OPEN or REFERRED, OR has an ACTIVE concussion RTP protocol with recurrence_count >= 2 and no COMPLETED physician referral carrying report_clearance in {CLEARED_FULL, CLEARED_RESTRICTED})"
        side_effects: ["posture_reasons includes ACUTE_INJURY_OPEN and/or PHYSICIAN_REVIEW_PENDING"]
      - from: "*"
        to: CLEARED_WITH_RESTRICTIONS
        trigger: "system recompute"
        actor: system
        preconditions:
          - "Higher-priority gates pass, AND athlete has an injury in UNDER_CARE or RTP_IN_PROGRESS, OR latest VERIFIED physical outcome is CLEARED_WITH_RESTRICTIONS"
        side_effects: ["posture_reasons includes INJURY_RESTRICTIONS and/or PHYSICAL_RESTRICTIONS"]
      - from: "*"
        to: CLEARED
        trigger: "system recompute"
        actor: system
        preconditions: ["All gates pass; no injury in {OPEN, UNDER_CARE, REFERRED, RTP_IN_PROGRESS}"]
        side_effects: ["posture_reasons = []"]
    posture_evaluation_order: "NOT_CLEARED > INELIGIBLE > MEDICAL_HOLD > CLEARED_WITH_RESTRICTIONS > CLEARED (first matching gate wins)"

  - entity: PreParticipationPhysical
    initial_state: RECORDED
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /physicals/{physicalId}/verify"
        actor: SchoolNurse
        preconditions:
          - "Physical is RECORDED (ERR_INVALID_STATE)"
          - "X-User-ID != recorded_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_staff_id = X-User-ID"
          - "Athlete.participation_posture recomputed (may leave NOT_CLEARED/INELIGIBLE)"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /physicals/{physicalId}/void"
        actor: AthleticTrainer
        preconditions: ["Physical is RECORDED (ERR_INVALID_STATE)"]
        side_effects: ["Athlete.participation_posture recomputed"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (clock sweep: now >= expires_on)"
        actor: system
        preconditions: ["Physical is VERIFIED and current clock >= expires_on"]
        side_effects:
          - "Athlete.participation_posture recomputed (typically -> INELIGIBLE)"
      - from: RECORDED
        to: EXPIRED
        trigger: "system (clock sweep: now >= expires_on)"
        actor: system
        preconditions: ["Physical is RECORDED and current clock >= expires_on"]
        side_effects: ["Athlete.participation_posture recomputed"]

  - entity: BaselineConcussionTest
    initial_state: CURRENT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (a newer BaselineConcussionTest is created for the same athlete, OR a CONCUSSION-type InjuryEvaluation is created for the athlete)"
        actor: system
        preconditions: ["This test is the athlete's CURRENT baseline"]
        side_effects:
          - "Athlete.participation_posture recomputed (no CURRENT baseline -> INELIGIBLE gate)"
      - from: CURRENT
        to: EXPIRED
        trigger: "system (clock sweep: now >= valid_until)"
        actor: system
        preconditions: ["Test is CURRENT and now >= valid_until"]
        side_effects: ["Athlete.participation_posture recomputed"]

  - entity: EmergencyActionPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /emergency-action-plans/{eapId}/submit"
        actor: AthleticTrainer
        preconditions: ["Plan is DRAFT (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /emergency-action-plans/{eapId}/approve"
        actor: AthleticDirector
        preconditions:
          - "Plan is PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID != authored_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_staff_id = X-User-ID"]
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /emergency-action-plans/{eapId}/reject"
        actor: AthleticDirector
        preconditions: ["Plan is PENDING_APPROVAL (ERR_INVALID_STATE)"]
        side_effects: []
        note: "Cyclic revision loop DRAFT -> PENDING_APPROVAL -> DRAFT"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /emergency-action-plans/{eapId}/activate with expected_venue_version (OCC on Venue)"
        actor: AthleticDirector
        preconditions:
          - "Plan is APPROVED (ERR_INVALID_STATE)"
          - "expected_venue_version == venue.version (ERR_STALE_VERSION)"
        side_effects:
          - "Venue's prior ACTIVE plan (if any) -> SUPERSEDED (caused by this activation)"
          - "venue.active_eap_id = this plan id"
          - "increments Venue.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another plan at the same venue is activated)"
        actor: system
        preconditions: ["This plan is ACTIVE"]
        side_effects: []

  - entity: AthleticEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COVERED
        trigger: "system (bubble-up: active_assignment_count reaches required_trainer_count)"
        actor: system
        preconditions: ["Event is SCHEDULED and active_assignment_count >= required_trainer_count"]
        side_effects: []
      - from: COVERED
        to: SCHEDULED
        trigger: "system (bubble-down: a decline/cancel drops active_assignment_count below required_trainer_count)"
        actor: system
        preconditions: ["Event is COVERED and active_assignment_count < required_trainer_count"]
        side_effects: []
        note: "Cyclic coverage loop SCHEDULED <-> COVERED"
      - from: COVERED
        to: IN_PROGRESS
        trigger: "POST /events/{eventId}/start"
        actor: AthleticTrainer
        preconditions:
          - "Event is COVERED (ERR_INVALID_STATE)"
          - "venue.active_eap_id is not null (ERR_NO_ACTIVE_EAP)"
          - "Current heat tier at venue is not EXTREME for OUTDOOR events (ERR_HEAT_TIER_EXTREME)"
          - "No active lightning hold at venue (ERR_LIGHTNING_HOLD_ACTIVE)"
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED_WEATHER
        trigger: "POST /events/{eventId}/suspend (manual) OR system on EnvironmentalReading (lightning strike within venue radius, or heat tier EXTREME at an OUTDOOR venue)"
        actor: AthleticTrainer | system
        preconditions: ["Event is IN_PROGRESS (ERR_INVALID_STATE)"]
        side_effects:
          - "suspension_reason = LIGHTNING | HEAT | MANUAL"
          - "Each CoverageAssignment of this event in ACKNOWLEDGED or ON_SITE -> ON_HOLD, pre_hold_status snapshotted (caused by the event suspension)"
          - "GuardianNotification EVENT_SUSPENSION created for every athlete on the event roster (sport + team_level match) with an injury in {OPEN, UNDER_CARE, REFERRED, RTP_IN_PROGRESS} (caused by the event suspension)"
      - from: SUSPENDED_WEATHER
        to: IN_PROGRESS
        trigger: "POST /events/{eventId}/resume"
        actor: AthleticTrainer
        preconditions:
          - "Event is SUSPENDED_WEATHER (ERR_INVALID_STATE)"
          - "If suspension_reason = LIGHTNING: now >= lightning all-clear time (ERR_LIGHTNING_HOLD_ACTIVE)"
          - "If suspension_reason = HEAT: latest heat tier is not EXTREME (ERR_HEAT_TIER_EXTREME)"
        side_effects:
          - "suspension_reason = null"
          - "Each CoverageAssignment in ON_HOLD -> its pre_hold_status (ACKNOWLEDGED or ON_SITE), pre_hold_status cleared (caused by the event resumption)"
        note: "Cyclic weather loop IN_PROGRESS <-> SUSPENDED_WEATHER"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /events/{eventId}/complete"
        actor: AthleticTrainer
        preconditions: ["Event is IN_PROGRESS (ERR_INVALID_STATE)"]
        side_effects:
          - "Each CoverageAssignment in ON_SITE or ACKNOWLEDGED or ON_HOLD -> COMPLETED (caused by event completion)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{eventId}/cancel"
        actor: AthleticTrainer | AthleticDirector
        preconditions: ["Event in SCHEDULED | COVERED | SUSPENDED_WEATHER (ERR_INVALID_STATE)"]
        side_effects:
          - "Each CoverageAssignment in ASSIGNED | ACKNOWLEDGED | ON_HOLD -> CANCELLED (caused by event cancellation)"
      - from: COVERED
        to: CANCELLED
        trigger: "POST /events/{eventId}/cancel"
        actor: AthleticTrainer | AthleticDirector
        preconditions: ["Event in SCHEDULED | COVERED | SUSPENDED_WEATHER (ERR_INVALID_STATE)"]
        side_effects:
          - "Each CoverageAssignment in ASSIGNED | ACKNOWLEDGED | ON_HOLD -> CANCELLED (caused by event cancellation)"
      - from: SUSPENDED_WEATHER
        to: CANCELLED
        trigger: "POST /events/{eventId}/cancel"
        actor: AthleticTrainer | AthleticDirector
        preconditions: ["Event in SCHEDULED | COVERED | SUSPENDED_WEATHER (ERR_INVALID_STATE)"]
        side_effects:
          - "Each CoverageAssignment in ASSIGNED | ACKNOWLEDGED | ON_HOLD -> CANCELLED (caused by event cancellation)"

  - entity: CoverageAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACKNOWLEDGED
        trigger: "POST /coverage-assignments/{assignmentId}/acknowledge"
        actor: AthleticTrainer
        preconditions:
          - "Assignment is ASSIGNED (ERR_INVALID_STATE)"
          - "X-User-ID == staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["acknowledged_at = now"]
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /coverage-assignments/{assignmentId}/decline"
        actor: AthleticTrainer
        preconditions:
          - "Assignment is ASSIGNED (ERR_INVALID_STATE)"
          - "X-User-ID == staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "event.active_assignment_count -= 1 (caused by this decline); if event was COVERED and count < required_trainer_count, event -> SCHEDULED (caused by the count change)"
      - from: ACKNOWLEDGED
        to: ON_SITE
        trigger: "POST /coverage-assignments/{assignmentId}/check-in"
        actor: AthleticTrainer
        preconditions:
          - "Assignment is ACKNOWLEDGED (ERR_INVALID_STATE)"
          - "X-User-ID == staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["checked_in_at = now"]
      - from: ACKNOWLEDGED
        to: ON_HOLD
        trigger: "system (event enters SUSPENDED_WEATHER)"
        actor: system
        preconditions: ["Assignment is ACKNOWLEDGED or ON_SITE"]
        side_effects: ["pre_hold_status = ACKNOWLEDGED"]
      - from: ON_SITE
        to: ON_HOLD
        trigger: "system (event enters SUSPENDED_WEATHER)"
        actor: system
        preconditions: ["Assignment is ACKNOWLEDGED or ON_SITE"]
        side_effects: ["pre_hold_status = ON_SITE"]
      - from: ON_HOLD
        to: ACKNOWLEDGED
        trigger: "system (event resumes; restores pre_hold_status)"
        actor: system
        preconditions: ["Assignment is ON_HOLD and pre_hold_status = ACKNOWLEDGED"]
        side_effects: ["pre_hold_status = null"]
      - from: ON_HOLD
        to: ON_SITE
        trigger: "system (event resumes; restores pre_hold_status)"
        actor: system
        preconditions: ["Assignment is ON_HOLD and pre_hold_status = ON_SITE"]
        side_effects: ["pre_hold_status = null"]
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /coverage-assignments/{assignmentId}/complete OR system (event completes)"
        actor: AthleticTrainer | system
        preconditions: ["Assignment in ON_SITE | ACKNOWLEDGED | ON_HOLD (ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /coverage-assignments/{assignmentId}/complete OR system (event completes)"
        actor: AthleticTrainer | system
        preconditions: ["Assignment in ON_SITE | ACKNOWLEDGED | ON_HOLD (ERR_INVALID_STATE)"]
        side_effects: []
      - from: ON_HOLD
        to: COMPLETED
        trigger: "system (event completes)"
        actor: system
        preconditions: ["Assignment in ON_SITE | ACKNOWLEDGED | ON_HOLD"]
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /coverage-assignments/{assignmentId}/cancel OR system (event cancelled)"
        actor: AthleticTrainer | AthleticDirector | system
        preconditions: ["Assignment in ASSIGNED | ACKNOWLEDGED | ON_HOLD (ERR_INVALID_STATE)"]
        side_effects:
          - "On manual cancel: event.active_assignment_count -= 1; if event was COVERED and count < required_trainer_count, event -> SCHEDULED (caused by the count change)"
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /coverage-assignments/{assignmentId}/cancel OR system (event cancelled)"
        actor: AthleticTrainer | AthleticDirector | system
        preconditions: ["Assignment in ASSIGNED | ACKNOWLEDGED | ON_HOLD (ERR_INVALID_STATE)"]
        side_effects:
          - "On manual cancel: event.active_assignment_count -= 1; if event was COVERED and count < required_trainer_count, event -> SCHEDULED (caused by the count change)"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "system (event cancelled)"
        actor: system
        preconditions: ["Assignment in ASSIGNED | ACKNOWLEDGED | ON_HOLD"]
        side_effects: []

  - entity: InjuryEvaluation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_CARE
        trigger: "POST /injuries/{injuryId}/begin-care"
        actor: AthleticTrainer
        preconditions: ["Injury in OPEN | REFERRED (ERR_INVALID_STATE)"]
        side_effects: ["Athlete.participation_posture recomputed (OPEN acute -> UNDER_CARE restricted)"]
      - from: REFERRED
        to: UNDER_CARE
        trigger: "POST /injuries/{injuryId}/begin-care"
        actor: AthleticTrainer
        preconditions: ["Injury in OPEN | REFERRED (ERR_INVALID_STATE)"]
        side_effects: ["Athlete.participation_posture recomputed"]
      - from: OPEN
        to: REFERRED
        trigger: "system (POST /referrals created for this injury)"
        actor: system
        preconditions: ["Injury in OPEN | UNDER_CARE"]
        side_effects: ["Athlete.participation_posture recomputed (REFERRED stays MEDICAL_HOLD)"]
      - from: UNDER_CARE
        to: REFERRED
        trigger: "system (POST /referrals created for this injury)"
        actor: system
        preconditions: ["Injury in OPEN | UNDER_CARE"]
        side_effects: ["Athlete.participation_posture recomputed"]
      - from: UNDER_CARE
        to: RTP_IN_PROGRESS
        trigger: "system (POST /injuries/{injuryId}/rtp-protocols activates a protocol, OR a successful POST /rtp-protocols/{id}/advance while the injury is UNDER_CARE after a regression)"
        actor: system
        preconditions: ["Injury in UNDER_CARE | RTP_IN_PROGRESS (supersede)"]
        side_effects: ["Athlete.participation_posture recomputed"]
      - from: RTP_IN_PROGRESS
        to: RTP_IN_PROGRESS
        trigger: "system (a replacement protocol is created with OCC, superseding the ACTIVE one)"
        actor: system
        preconditions: ["Injury in UNDER_CARE | RTP_IN_PROGRESS"]
        side_effects: ["increments InjuryEvaluation.version by 1"]
      - from: RTP_IN_PROGRESS
        to: UNDER_CARE
        trigger: "system (the ACTIVE protocol regresses or is terminated)"
        actor: system
        preconditions: ["Injury is RTP_IN_PROGRESS"]
        side_effects: ["Athlete.participation_posture recomputed (caused by the injury status change)"]
      - from: UNDER_CARE
        to: RESOLVED
        trigger: "POST /injuries/{injuryId}/resolve"
        actor: AthleticTrainer
        preconditions:
          - "Injury is UNDER_CARE (ERR_INVALID_STATE)"
          - "No ACTIVE ReturnToPlayProtocol for this injury (ERR_INVALID_STATE)"
        side_effects: ["resolved_at = now", "Athlete.participation_posture recomputed (may reach CLEARED)"]
      - from: RTP_IN_PROGRESS
        to: RESOLVED
        trigger: "system (POST /rtp-protocols/{id}/clear succeeds)"
        actor: system
        preconditions: ["Injury is RTP_IN_PROGRESS"]
        side_effects: ["resolved_at = now", "Athlete.participation_posture recomputed"]
      - from: RESOLVED
        to: OPEN
        trigger: "POST /injuries/{injuryId}/reopen"
        actor: AthleticTrainer
        preconditions: ["Injury is RESOLVED (ERR_INVALID_STATE)"]
        side_effects:
          - "resolved_at = null"
          - "Athlete.participation_posture recomputed (back to MEDICAL_HOLD)"
        note: "Cyclic re-injury loop OPEN -> ... -> RESOLVED -> OPEN"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /injuries/{injuryId}/close"
        actor: AthleticTrainer
        preconditions:
          - "Injury is RESOLVED (ERR_INVALID_STATE)"
          - "now >= resolved_at + 30 days (ERR_CLOSE_WINDOW_NOT_MET)"
        side_effects: []

  - entity: PhysicianReferral
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /referrals/{referralId}/schedule"
        actor: AthleticTrainer
        preconditions: ["Referral is REQUESTED (ERR_INVALID_STATE)"]
        side_effects: ["appointment_at = input"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /referrals/{referralId}/complete"
        actor: Physician
        preconditions:
          - "Referral is SCHEDULED (ERR_INVALID_STATE)"
          - "X-User-ID == physician_staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "report_diagnosis / report_clearance / reported_at set"
          - "If report_clearance = NOT_CLEARED and an ACTIVE ReturnToPlayProtocol exists for the injury: protocol -> TERMINATED (caused by this report); that termination moves the injury RTP_IN_PROGRESS -> UNDER_CARE (caused by the protocol termination); athlete posture recomputed (caused by the injury change)"
          - "GuardianNotification CLEARANCE_GRANTED created when report_clearance in {CLEARED_FULL, CLEARED_RESTRICTED}"
      - from: COMPLETED
        to: ADDENDUM_REQUESTED
        trigger: "POST /referrals/{referralId}/request-addendum"
        actor: AthleticTrainer
        preconditions: ["Referral is COMPLETED (ERR_INVALID_STATE)"]
        side_effects: []
        note: "Cyclic addendum loop COMPLETED -> ADDENDUM_REQUESTED -> COMPLETED"
      - from: ADDENDUM_REQUESTED
        to: COMPLETED
        trigger: "POST /referrals/{referralId}/complete (amended report)"
        actor: Physician
        preconditions:
          - "Referral in SCHEDULED | ADDENDUM_REQUESTED (ERR_INVALID_STATE)"
          - "X-User-ID == physician_staff_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["report fields overwritten; reported_at refreshed; same cascades as a fresh completion"]
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /referrals/{referralId}/close"
        actor: AthleticTrainer
        preconditions: ["Referral is COMPLETED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /referrals/{referralId}/cancel"
        actor: AthleticTrainer
        preconditions: ["Referral in REQUESTED | SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /referrals/{referralId}/cancel"
        actor: AthleticTrainer
        preconditions: ["Referral in REQUESTED | SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (clock sweep: now > due_by)"
        actor: system
        preconditions: ["Referral in REQUESTED | SCHEDULED and now > due_by (strictly greater)"]
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (clock sweep: now > due_by)"
        actor: system
        preconditions: ["Referral in REQUESTED | SCHEDULED and now > due_by (strictly greater)"]
        side_effects: []

  - entity: ReturnToPlayProtocol
    initial_state: ACTIVE
    terminal_states: [CLEARED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rtp-protocols/{protocolId}/advance (current_stage N -> N+1, N in 1..5)"
        actor: AthleticTrainer
        preconditions:
          - "Protocol is ACTIVE and current_stage <= 5 (ERR_INVALID_STATE)"
          - "now >= stage_entered_at + 24 hours (ERR_RTP_STAGE_DWELL_NOT_MET)"
          - "symptom_check_passed = true (ERR_SYMPTOMS_REPORTED)"
          - "Athlete.participation_posture != INELIGIBLE and != NOT_CLEARED (ERR_PHYSICAL_EXPIRED)"
          - "If advancing into stage 5 and injury_type = CONCUSSION: a COMPLETED or CLOSED PhysicianReferral for this injury with report_clearance in {CLEARED_FULL, CLEARED_RESTRICTED} exists (ERR_RTP_PHYSICIAN_REVIEW_REQUIRED)"
          - "If recurrence_count >= 2 (any injury type): same physician-report requirement (ERR_RTP_PHYSICIAN_REVIEW_REQUIRED)"
        side_effects:
          - "current_stage += 1; stage_entered_at = now; stage_history appended {stage: N, exited_at: now, exit_reason: ADVANCED}"
          - "If the injury is UNDER_CARE (post-regression): injury -> RTP_IN_PROGRESS (caused by this advance); athlete posture recomputed"
        note: "Intra-status progression; the machine is cyclic because regress loops the stage dimension"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rtp-protocols/{protocolId}/regress (symptom recurrence)"
        actor: AthleticTrainer
        preconditions: ["Protocol is ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "stage_history appended {stage: current_stage, exited_at: now, exit_reason: REGRESSED}"
          - "current_stage = 1; stage_entered_at = now; recurrence_count += 1"
          - "InjuryEvaluation.status RTP_IN_PROGRESS -> UNDER_CARE (caused by this regression); the injury change recomputes Athlete.participation_posture -> CLEARED_WITH_RESTRICTIONS (caused by the injury change)"
          - "GuardianNotification RTP_REGRESSION created QUEUED (caused by this regression)"
          - "The injury returns to RTP_IN_PROGRESS only via the next successful advance (see that transition's side effects)"
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /rtp-protocols/{protocolId}/clear"
        actor: Physician | AthleticTrainer
        preconditions:
          - "Protocol is ACTIVE and current_stage = 6 (ERR_INVALID_STATE)"
          - "now >= stage_entered_at + 24 hours (ERR_RTP_STAGE_DWELL_NOT_MET)"
          - "If clearance_authority_required = PHYSICIAN: caller role must be Physician (ERR_CLEARANCE_AUTHORITY_INSUFFICIENT)"
          - "If clearance_authority_required = TRAINER: caller role must be AthleticTrainer or Physician"
        side_effects:
          - "cleared_by_staff_id = X-User-ID; cleared_at = now; stage_history appended {stage: 6, exited_at: now, exit_reason: CLEARED}"
          - "InjuryEvaluation.status RTP_IN_PROGRESS -> RESOLVED (caused by this clearance); resolved_at = now; athlete posture recomputed (caused by the injury change)"
          - "GuardianNotification CLEARANCE_GRANTED created QUEUED (caused by this clearance)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rtp-protocols/{protocolId}/terminate OR system (referral report NOT_CLEARED) OR system (OCC supersede by a replacement protocol)"
        actor: AthleticTrainer | Physician | system
        preconditions: ["Protocol is ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "stage_history appended {stage: current_stage, exited_at: now, exit_reason: TERMINATED}"
          - "If injury is RTP_IN_PROGRESS and no other ACTIVE protocol remains: injury -> UNDER_CARE (caused by this termination); athlete posture recomputed (caused by the injury change)"

  - entity: GuardianNotification
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /guardian-notifications/{notificationId}/send"
        actor: AthleticTrainer
        preconditions:
          - "Notification in QUEUED | FAILED (ERR_INVALID_STATE)"
          - "If channel = EMAIL: athlete.guardian_email is not null; if channel = PHONE: athlete.guardian_phone is not null (ERR_GUARDIAN_CONTACT_MISSING)"
        side_effects: ["sent_at = now; attempts += 1"]
      - from: QUEUED
        to: FAILED
        trigger: "POST /guardian-notifications/{notificationId}/send (delivery failure: required guardian contact field missing is a rejection, but a transient carrier failure surfaces as FAILED)"
        actor: system
        preconditions: ["Send attempted and carrier simulation fails (channel = PHONE and athlete.guardian_phone = 'UNREACHABLE')"]
        side_effects: ["attempts += 1"]
      - from: FAILED
        to: QUEUED
        trigger: "POST /guardian-notifications/{notificationId}/retry"
        actor: AthleticTrainer
        preconditions: ["Notification is FAILED (ERR_INVALID_STATE)"]
        side_effects: []
        note: "Cyclic retry loop QUEUED -> FAILED -> QUEUED"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /guardian-notifications/{notificationId}/acknowledge"
        actor: ParentGuardian
        preconditions:
          - "Notification in SENT | ESCALATED (ERR_INVALID_STATE)"
          - "X-User-ID == athlete.guardian_user_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["acknowledged_at = now"]
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /guardian-notifications/{notificationId}/acknowledge"
        actor: ParentGuardian
        preconditions: ["Notification in SENT | ESCALATED (ERR_INVALID_STATE)"]
        side_effects: ["acknowledged_at = now"]
      - from: SENT
        to: ESCALATED
        trigger: "system (clock sweep: now >= sent_at + 24 hours and not acknowledged)"
        actor: system
        preconditions: ["Notification is SENT and now >= sent_at + 24h (inclusive)"]
        side_effects: []

  - entity: RestockOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /restock-orders/{orderId}/submit"
        actor: AthleticTrainer
        preconditions: ["Order is DRAFT (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /restock-orders/{orderId}/approve"
        actor: AthleticDirector
        preconditions:
          - "Order is SUBMITTED (ERR_INVALID_STATE)"
          - "X-User-ID != requested_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
          - "SupplyBudget for fiscal_year: available_cents >= extended_cost_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "approved_by_staff_id = X-User-ID"
          - "budget.committed_spend_cents += extended_cost_cents; budget.available_cents recomputed (caused by this approval)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /restock-orders/{orderId}/reject"
        actor: AthleticDirector
        preconditions: ["Order is SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /restock-orders/{orderId}/receive"
        actor: AthleticTrainer
        preconditions: ["Order is APPROVED (ERR_INVALID_STATE)"]
        side_effects:
          - "InventoryTransaction {txn_type: RESTOCK, quantity, unit_cost_cents, restock_order_id: this id, occurred_at: now, recorded_by_staff_id: X-User-ID} created (caused by this receipt)"
          - "That ledger entry recomputes SupplyItem.current_stock and stock_status (caused by the ledger append)"
          - "budget.committed_spend_cents -= extended_cost_cents; budget.realized_spend_cents += extended_cost_cents; available_cents recomputed (caused by this receipt)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /restock-orders/{orderId}/cancel"
        actor: AthleticTrainer
        preconditions: ["Order in DRAFT | SUBMITTED | APPROVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /restock-orders/{orderId}/cancel"
        actor: AthleticTrainer
        preconditions: ["Order in DRAFT | SUBMITTED | APPROVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /restock-orders/{orderId}/cancel"
        actor: AthleticTrainer
        preconditions: ["Order in DRAFT | SUBMITTED | APPROVED (ERR_INVALID_STATE)"]
        side_effects:
          - "budget.committed_spend_cents -= extended_cost_cents; available_cents recomputed (compensation for the approval's commit)"

  - entity: SupplyItem
    initial_state: OUT_OF_STOCK
    terminal_states: []
    note: "Derived stock machine: stock_status recomputed from current_stock after every InventoryTransaction append or threshold edit. No direct client transition."
    transitions:
      - from: "*"
        to: OUT_OF_STOCK
        trigger: "system recompute"
        actor: system
        preconditions: ["current_stock == 0"]
        side_effects: []
      - from: "*"
        to: LOW_STOCK
        trigger: "system recompute"
        actor: system
        preconditions: ["1 <= current_stock <= reorder_threshold"]
        side_effects: []
      - from: "*"
        to: IN_STOCK
        trigger: "system recompute"
        actor: system
        preconditions: ["current_stock > reorder_threshold"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: rtp-create-stale-injury
    parent_entity: InjuryEvaluation
    write_endpoint: "POST /injuries/{injuryId}/rtp-protocols"
    occ_field: expected_injury_version
    description: |
      Creating a ReturnToPlayProtocol against an InjuryEvaluation whose version
      has advanced since the client last observed it is rejected. Product
      semantics allow a new protocol to legitimately supersede (TERMINATED) an
      existing ACTIVE protocol on the same injury, so the injury row itself is
      the OCC anchor: the write bumps InjuryEvaluation.version, and a stale
      expected_injury_version proves the caller's view of the injury is old.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: eap-activate-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /emergency-action-plans/{eapId}/activate"
    occ_field: expected_venue_version
    description: |
      Activating an EmergencyActionPlan against a Venue whose version has
      advanced since the client last observed it is rejected. Activation
      legitimately supersedes the venue's currently ACTIVE plan (a supersede,
      not a state conflict), so the venue row is the OCC anchor: activation
      bumps Venue.version, and a stale expected_venue_version proves the
      caller's view of the venue is old.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: physical_expiry
    trigger: "PreParticipationPhysical creation (computes expires_on); clock sweep (compares now >= expires_on to set EXPIRED)"
    algorithm: threshold
    formula: |
      DISTRICT_13MO:   expires_on = exam_date + 13 calendar months, at 00:00:00Z of that day.
      STATE_SCHOOL_YEAR: expires_on = Aug 1 00:00:00Z of (exam_year if exam_month < 8 else exam_year + 1).
      Expiry transition fires when now >= expires_on (inclusive boundary).
    input_set: "The single physical's exam_date and validity_policy"
    precision: "date arithmetic in UTC; boundary inclusive (now == expires_on -> EXPIRED)"
    variants:
      - name: DISTRICT_13MO
        when: "validity_policy = DISTRICT_13MO"
        difference: "Fixed 13-calendar-month window from exam_date"
      - name: STATE_SCHOOL_YEAR
        when: "validity_policy = STATE_SCHOOL_YEAR"
        difference: "Valid through the end of the current school year (Jul 31); expires the following Aug 1"

  - name: baseline_validity
    trigger: "BaselineConcussionTest creation (computes valid_until); clock sweep"
    algorithm: threshold
    formula: |
      valid_until = test_date + 24 calendar months at 00:00:00Z.
      EXPIRED when now >= valid_until (inclusive).
    input_set: "The single test's test_date"
    precision: "date arithmetic in UTC"

  - name: athlete_participation_posture
    trigger: "Any mutation to the athlete's physicals, baselines, injuries, RTP protocols, referral reports, or a clock sweep"
    algorithm: constraint_propagation
    formula: |
      Gates evaluated in strict order; first match wins:
      1. NOT_CLEARED  — no VERIFIED physical has ever existed.
      2. INELIGIBLE   — latest VERIFIED physical is EXPIRED (now >= expires_on),
                        or its outcome in {NOT_CLEARED, DEFERRED},
                        or no CURRENT baseline with valid_until > now exists.
      3. MEDICAL_HOLD — any InjuryEvaluation in {OPEN, REFERRED},
                        OR an ACTIVE concussion-type RTP protocol with
                        recurrence_count >= 2 lacking a COMPLETED/CLOSED
                        physician referral with report_clearance in
                        {CLEARED_FULL, CLEARED_RESTRICTED}.
      4. CLEARED_WITH_RESTRICTIONS — any injury in {UNDER_CARE, RTP_IN_PROGRESS},
                        or latest VERIFIED physical outcome = CLEARED_WITH_RESTRICTIONS.
      5. CLEARED      — otherwise.
    input_set: "Athlete's physicals (any status), baselines (any status), injuries (all), RTP protocols (ACTIVE), referrals (COMPLETED/CLOSED with clearance)"
    precision: "n/a (enum output); posture_reasons records each fired gate"

  - name: heat_activity_tier
    trigger: "POST /weather-readings (HEAT_WBGT); GET /venues/{venueId}/activity-status; event start/resume gates"
    algorithm: threshold
    formula: |
      Variant selected by event context: TOURNAMENT events use STATE_ASSOCIATION,
      all others use DISTRICT. Tiers (lower bounds inclusive):
      DISTRICT:           wbgt < 80.0 NORMAL | [80.0,84.0) CAUTION | [84.0,87.0) MODERATE | [87.0,90.0) SEVERE | >= 90.0 EXTREME
      STATE_ASSOCIATION:  wbgt < 82.0 NORMAL | [82.0,86.0) CAUTION | [86.0,89.0) MODERATE | [89.0,92.0) SEVERE | >= 92.0 EXTREME
      "Current tier at a venue" = tier of the HEAT_WBGT reading with the max
      recorded_at (ties broken by created_at ASC, latest created wins).
      A venue with no HEAT_WBGT readings is treated as NORMAL.
      EXTREME at an OUTDOOR venue suspends IN_PROGRESS outdoor events and blocks
      start/resume. INDOOR venues ignore heat tiers.
    input_set: "EnvironmentalReading rows of type HEAT_WBGT for the venue, ordered by recorded_at DESC then created_at DESC"
    constants:
      DISTRICT_BREAKS: "80.0/84.0/87.0/90.0"
      STATE_BREAKS: "82.0/86.0/89.0/92.0"
    precision: "wbgt compared at 1 decimal place; lower bounds inclusive (84.0 -> MODERATE)"
    variants:
      - name: DISTRICT
        when: "event_type != TOURNAMENT (and venue-level status checks default to DISTRICT)"
        difference: "Lower breakpoints; 87.5 F -> SEVERE"
      - name: STATE_ASSOCIATION
        when: "event_type = TOURNAMENT"
        difference: "Higher breakpoints; 87.5 F -> MODERATE"

  - name: lightning_all_clear
    trigger: "POST /weather-readings (LIGHTNING_STRIKE); event suspend/resume; GET /venues/{venueId}/activity-status"
    algorithm: chronological
    formula: |
      A strike "counts" at a venue when strike_distance_miles <= venue.lightning_radius_miles
      (inclusive). hold_until = max over counting strikes of (recorded_at + HOLD_MINUTES).
      The hold is ACTIVE while now < hold_until; resume/start allowed when now >= hold_until
      (inclusive boundary). Each new counting strike re-raises hold_until (timer reset).
      HOLD_MINUTES = 30 for DISTRICT context, 45 for TOURNAMENT events (STATE_ASSOCIATION).
      The venue-level hold (activity-status, non-tournament gates) uses 30.
    input_set: "EnvironmentalReading rows of type LIGHTNING_STRIKE for the venue"
    constants:
      HOLD_MINUTES_DISTRICT: 30
      HOLD_MINUTES_STATE: 45
    precision: "whole seconds; boundary inclusive (now == hold_until -> clear)"
    variants:
      - name: DISTRICT_30
        when: "all contexts except TOURNAMENT events"
        difference: "30-minute hold"
      - name: STATE_45
        when: "TOURNAMENT events"
        difference: "45-minute hold"

  - name: event_coverage_requirement
    trigger: "AthleticEvent creation; re-evaluated on athlete posture changes that alter the restricted-roster count (derived recompute)"
    algorithm: tiered_pricing
    formula: |
      contact_level(sport): HIGH = {FOOTBALL, WRESTLING, LACROSSE, ICE_HOCKEY=n/a},
        MEDIUM = {SOCCER, BASKETBALL, BASEBALL, SOFTBALL, FIELD_HOCKEY, VOLLEYBALL},
        LOW = {CROSS_COUNTRY, TRACK, SWIMMING, TENNIS, GOLF}.
      base: HIGH: PRACTICE -> 1, SCRIMMAGE -> 2, HOME_GAME/AWAY_GAME -> 2, TOURNAMENT -> 2
            MEDIUM: any type -> 1
            LOW: any type -> 1
      modifiers (in this order):
        +1 if event_type = TOURNAMENT
        +1 if roster_restricted_count >= 4   (athletes matching event.sport + event.team_level
                                              whose participation_posture = CLEARED_WITH_RESTRICTIONS)
        +1 if expected_attendance >= 1000
      required_trainer_count = min(4, max(1, base + modifiers))
    input_set: "The event; athletes with primary_sport = event.sport AND team_level = event.team_level"
    constants:
      RESTRICTED_BUMP_AT: 4
      ATTENDANCE_BUMP_AT: 1000
      CAP: 4
    precision: "integer; modifier boundaries inclusive (>= 4 counts, >= 1000 counts)"

  - name: inventory_stock
    trigger: "InventoryTransaction append (direct or via order receipt); item reads"
    algorithm: aggregation
    formula: |
      current_stock = sum over all InventoryTransaction of the item of signed quantity,
      where RESTOCK and ADJUSTMENT contribute +quantity, USAGE and WASTE contribute -quantity.
      Ledger is append-only; there is no update or delete. stock_status derived:
      0 -> OUT_OF_STOCK; 1..reorder_threshold -> LOW_STOCK; > reorder_threshold -> IN_STOCK.
    input_set: "All InventoryTransaction rows for the item, no status filter (ledger rows are immutable facts)"
    precision: "integer units"

  - name: inventory_valuation
    trigger: "GET /supply-items/{itemId}/valuation?policy=FIFO|WAC_RUNNING|WAC_EXACT"
    algorithm: chronological
    formula: |
      Replay the item's ledger ordered by occurred_at ASC, tie-break created_at ASC.
      FIFO: maintain cost layers [(qty, unit_cost_cents)]; RESTOCK pushes a layer;
      USAGE/WASTE consume layers oldest-first; ADJUSTMENT pushes a layer priced at
      the most recent RESTOCK unit cost (0 cents if the item was never restocked).
      valuation = sum over remaining layers of qty * unit_cost_cents (exact integer cents).
      WAC_RUNNING: after every transaction, unit_cost = round_half_up(running_value / running_qty)
      (only when running_qty > 0; a usage that empties stock resets running_value to 0);
      running_value updated as: RESTOCK -> running_value += qty*cost; USAGE/WASTE ->
      running_value -= qty * unit_cost(after recompute). valuation = running_value.
      WAC_EXACT: same flow but unit cost kept as an exact rational; valuation =
      round_half_up(exact_value) applied ONCE at the end.
      The canonical policy for display is WAC_RUNNING; the rounding order is pinned
      (per-transaction, then final value is the accumulator).
    input_set: "All InventoryTransaction rows for the item"
    precision: "2 decimal places equivalent in integer cents; round_half_up; per-transaction rounding for WAC_RUNNING"
    variants:
      - name: FIFO
        when: "policy = FIFO"
        difference: "Layer-based; earliest costs consumed first"
      - name: WAC_RUNNING
        when: "policy = WAC_RUNNING"
        difference: "Weighted average re-rounded after every transaction"
      - name: WAC_EXACT
        when: "policy = WAC_EXACT"
        difference: "Exact rational arithmetic, single rounding at the end"

  - name: supply_reorder_suggestion
    trigger: "GET /supply-items/{itemId}/reorder-suggestion"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (this collapses the apparent loop where the
      suggested quantity depends on available budget, available budget depends on
      committed spend, and committed spend is itself a function of open orders):
      1. current_stock  = inventory_stock ledger sum.
      2. inbound_qty    = sum of quantity over this item's RestockOrder in APPROVED status.
      3. deficit_qty    = max(0, par_level - current_stock - inbound_qty).
      4. budget         = SupplyBudget whose fiscal_year = year of the current clock;
                          if none exists, available_cents is treated as 0.
      5. available_cents = budget.total_budget_cents - realized - committed
                           (committed includes the APPROVED orders counted in step 2).
      6. max_affordable_qty = floor(available_cents / unit_cost_cents of the item).
      7. suggested_qty  = max(0, min(deficit_qty, max_affordable_qty)).
    input_set: "The item's ledger, its APPROVED RestockOrder rows, the current-year SupplyBudget"
    precision: "integer units; floor division"

  - name: rtp_stage_dwell
    trigger: "POST /rtp-protocols/{id}/advance and /clear"
    algorithm: chronological
    formula: |
      dwell_ok = (now - stage_entered_at) >= 24 hours (inclusive boundary:
      exactly 24h00m00s is advanceable). stage_entered_at resets on every
      advance and every regress.
    input_set: "The protocol's stage_entered_at and the current clock"
    constants:
      DWELL_HOURS: 24
    precision: "whole seconds; boundary inclusive"

  - name: referral_due_window
    trigger: "PhysicianReferral creation (due_by); clock sweep (EXPIRED when now > due_by)"
    algorithm: threshold
    formula: |
      due_by = created_at + window, window = 14 days ROUTINE | 3 days URGENT | 1 day EMERGENT.
      EXPIRED when now > due_by (STRICTLY greater — at now == due_by the referral is still actionable).
    input_set: "The referral's created_at and urgency"
    constants:
      ROUTINE_DAYS: 14
      URGENT_DAYS: 3
      EMERGENT_DAYS: 1
    precision: "whole seconds; boundary exclusive (>)"

  - name: notification_escalation_window
    trigger: "clock sweep"
    algorithm: threshold
    formula: |
      A GuardianNotification in SENT escalates when now >= sent_at + 24 hours (inclusive)
      and it has not been acknowledged. ESCALATED notifications remain acknowledgeable.
    input_set: "Notifications in SENT"
    constants:
      ESCALATE_HOURS: 24
    precision: "whole seconds; boundary inclusive (>=)"

  - name: injury_close_window
    trigger: "POST /injuries/{injuryId}/close"
    algorithm: threshold
    formula: |
      close allowed when injury is RESOLVED and now >= resolved_at + 30 days (inclusive).
    input_set: "The injury's resolved_at"
    constants:
      CLOSE_AFTER_DAYS: 30
    precision: "whole seconds; boundary inclusive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared role names"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership scope: ParentGuardian may only touch resources of the athlete whose guardian_user_id == X-User-ID; AthleticTrainer acting on a CoverageAssignment must be its staff_id; Physician completing a referral must be its physician_staff_id"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "GET /athletes/{id} (ParentGuardian), GET /guardian-notifications (ParentGuardian), POST /guardian-notifications/{id}/acknowledge, POST /coverage-assignments/{id}/{acknowledge,decline,check-in}, POST /referrals/{id}/complete"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist"
    error_id: "ERR_NOT_FOUND / ERR_ATHLETE_NOT_FOUND / ERR_STAFF_NOT_FOUND / ERR_VENUE_NOT_FOUND / ERR_EVENT_NOT_FOUND / ERR_INJURY_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_PROTOCOL_NOT_FOUND / ERR_EAP_NOT_FOUND / ERR_PHYSICAL_NOT_FOUND / ERR_BASELINE_NOT_FOUND / ERR_NOTIFICATION_NOT_FOUND / ERR_SUPPLY_ITEM_NOT_FOUND / ERR_RESTOCK_ORDER_NOT_FOUND / ERR_BUDGET_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: existence
    check: "OCC: expected_<parent>_version equals the parent entity's current version (checked before all business logic)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /injuries/{injuryId}/rtp-protocols, POST /emergency-action-plans/{eapId}/activate"
  - priority: 6
    category: state
    check: "Target resource is in a from-state the transition allows (covers all invalid-from, terminal-lockdown, and duplicate-action cases). For creation endpoints with a stateful reference: POST /coverage-assignments requires the event in SCHEDULED | COVERED; POST /referrals requires the injury in OPEN | UNDER_CARE | RTP_IN_PROGRESS; POST /injuries/{injuryId}/rtp-protocols requires the injury in UNDER_CARE | RTP_IN_PROGRESS."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints; POST /coverage-assignments; POST /referrals; POST /injuries/{injuryId}/rtp-protocols"
  - priority: 7
    category: business_safety
    check: "Safety gates: venue has ACTIVE EAP for event start; heat tier not EXTREME (outdoor); no lightning hold; RTP clearance authority; segregation of duties (physical verify vs record, EAP approve vs author, order approve vs request); symptom check; physician review after 2 recurrences / before stage 5 for concussion; athlete posture must not be INELIGIBLE/NOT_CLEARED for RTP advance or clear"
    error_id: "ERR_NO_ACTIVE_EAP | ERR_HEAT_TIER_EXTREME | ERR_LIGHTNING_HOLD_ACTIVE | ERR_CLEARANCE_AUTHORITY_INSUFFICIENT | ERR_SEGREGATION_OF_DUTIES | ERR_SYMPTOMS_REPORTED | ERR_RTP_PHYSICIAN_REVIEW_REQUIRED | ERR_GUARDIAN_CONTACT_MISSING | ERR_PHYSICAL_EXPIRED"
    http_status: 409
    applies_to: "POST /events/{id}/start, POST /events/{id}/resume, POST /rtp-protocols/{id}/{advance,clear}, POST /physicals/{id}/verify, POST /emergency-action-plans/{id}/approve, POST /restock-orders/{id}/approve, POST /guardian-notifications/{id}/send"
    note: "ERR_CLEARANCE_AUTHORITY_INSUFFICIENT and ERR_SEGREGATION_OF_DUTIES return 403; ERR_SYMPTOMS_REPORTED returns 422; the rest 409"
  - priority: 8
    category: business_temporal
    check: "Temporal gates: coverage overlap for the same trainer (PRIMARY, half-open [start,end)); venue double-booking with 30-minute buffers; RTP 24h stage dwell; injury 30-day close window"
    error_id: "ERR_COVERAGE_OVERLAP | ERR_VENUE_OVERLAP | ERR_RTP_STAGE_DWELL_NOT_MET | ERR_CLOSE_WINDOW_NOT_MET"
    http_status: 409
    applies_to: "POST /coverage-assignments, POST /events, POST /rtp-protocols/{id}/{advance,clear}, POST /injuries/{id}/close"
  - priority: 9
    category: business_referential
    check: "Reference quality: coverage staff_id must be role_type ATHLETIC_TRAINER and is_active; referral physician_staff_id must be role_type PHYSICIAN; restock item not discontinued; reopen_of_id references a CLOSED injury of the same athlete; venue is_active for new events"
    error_id: "ERR_STAFF_ROLE_MISMATCH | ERR_ITEM_DISCONTINUED | ERR_REFERENCED_INJURY_NOT_CLOSED | ERR_VENUE_INACTIVE"
    http_status: 422
    applies_to: "POST /coverage-assignments, POST /referrals, POST /restock-orders, POST /injuries, POST /events"
  - priority: 10
    category: business_constraint
    check: "Aggregate/constraint rules: usage/waste must not drive stock negative; SupplyBudget fiscal_year unique; one CURRENT baseline per athlete (new supersedes old); supply field constraints (par_level > reorder_threshold, quantity > 0)"
    error_id: "ERR_INSUFFICIENT_STOCK | ERR_DUPLICATE_BUDGET_YEAR | ERR_INVALID_REQUEST | ERR_QUANTITY_NONPOSITIVE"
    http_status: 409
    applies_to: "POST /inventory-transactions, POST /supply-budgets, POST /supply-items, POST /baseline-tests"
    note: "ERR_INVALID_REQUEST / ERR_QUANTITY_NONPOSITIVE are 400/422 respectively"
  - priority: 11
    category: business_fiscal
    check: "Budget: approving a restock order requires available_cents >= extended_cost_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /restock-orders/{id}/approve"
  - priority: 12
    category: existence
    check: "Field shape: required fields present, enums valid, date ranges sane (scheduled_end > scheduled_start; exam_date/test_date/evaluated_at/occurred_at/recorded_at <= now)"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_DATE_RANGE"
    http_status: 400
    applies_to: all
    note: "Schema-level checks are listed last here for readability of the business ordering, but malformed JSON / missing required fields short-circuit with ERR_INVALID_REQUEST before business rules run; the ordering that matters for tests is priorities 6 < 7 < 8 < 9 < 11"
# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Staff ---
  - method: POST
    path: "/staff"
    description: "Create a staff member"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, role_type, "sport_certifications?", "is_active?"]
    output: Staff
    side_effects: []
  - method: GET
    path: "/staff"
    description: "List staff"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector, SchoolNurse, Physician, TeamCoach]
    code: 200
    input: ["role_type?", "is_active?", "limit?", "offset?"]
    output: "Staff[]"
    side_effects: []
  - method: GET
    path: "/staff/{staffId}"
    description: "Get one staff member"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector, SchoolNurse, Physician, TeamCoach]
    code: 200
    input: []
    output: Staff
    side_effects: []
  - method: PATCH
    path: "/staff/{staffId}"
    description: "Activate/deactivate a staff member"
    roles: [SystemAdmin]
    code: 200
    input: ["is_active?"]
    output: Staff
    side_effects: []

  # --- Athletes ---
  - method: POST
    path: "/athletes"
    description: "Register a student-athlete"
    roles: [AthleticTrainer, SystemAdmin]
    code: 201
    input: [full_name, date_of_birth, grade, sex, primary_sport, team_level, guardian_name, guardian_user_id, "guardian_email?", "guardian_phone?"]
    output: Athlete
    side_effects: ["participation_posture initialized NOT_CLEARED"]
  - method: GET
    path: "/athletes"
    description: "List athletes"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector, SchoolNurse, Physician, TeamCoach]
    code: 200
    input: ["primary_sport?", "team_level?", "participation_posture?", "limit?", "offset?"]
    output: "Athlete[]"
    side_effects: []
  - method: GET
    path: "/athletes/{athleteId}"
    description: "Get one athlete (ParentGuardian restricted to own child via guardian_user_id)"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector, SchoolNurse, Physician, TeamCoach, ParentGuardian]
    code: 200
    input: []
