  # ===========================================================================
  # SECTION 6 — Errors (every id in §1.6 must be reachable)
  # ===========================================================================
  - section: errors
    instances:

      - name: a_request_missing_the_x_user_id_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          Priority 1 fires before existence, so both header defects answer 401 even against a route id that does
          exist: the missing X-User-ID header and an X-User-Role that is not one of the ten §1.7 role names.
        test_recipe:
          setup:
            - "Route R1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_x1: "$.data.id" }
          trigger:
            - call: "GET /routes/${route_x1}"
              payload: {}
              as: "(X-User-Role sent, X-User-ID header omitted)"
              captures: { err_x1a: "$.data.error_id" }
            - call: "GET /routes/${route_x1}"
              payload: {}
              as: "Ringmaster"
              captures: { err_x1b: "$.data.error_id" }
          assert:
            - "Both calls answer HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "Neither answer leaks the Route payload: data holds only the error envelope"

      - name: unknown_path_ids_return_the_per_entity_not_found_family
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ROUTE_NOT_FOUND]
          - errors[ERR_ROUTE_STOP_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SETTLEMENT_NOT_FOUND]
          - errors[ERR_CLOSURE_NOT_FOUND]
          - errors[ERR_MAKEGOOD_NOT_FOUND]
          - errors[ERR_WORKER_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: |
          Priority 10 maps the path resource to its own error id — eleven distinct ids, one per entity — and it is
          checked before the body schema and before every state gate, so even a well-formed action body against a
          missing id answers 404 with the entity-specific id rather than 400 or 409.
        test_recipe:
          setup:
            - "Empty database except the logical clock; every id below is a syntactically valid UUID that names no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /routes/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: RouteManager
              captures: { e_route: "$.data.error_id" }
            - call: "GET /route-stops/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: LotBoss
              captures: { e_stop: "$.data.error_id" }
            - call: "GET /contracts/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: ContractNegotiator
              captures: { e_con: "$.data.error_id" }
            - call: "GET /ride-allocations/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: LotBoss
              captures: { e_alloc: "$.data.error_id" }
            - call: "POST /permit-applications/00000000-0000-0000-0000-000000000005/submit"
              payload: {}
              as: ComplianceClerk
