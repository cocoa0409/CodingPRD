scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fmr_comparable_average_vs_psf_regression_diverge
        grounds:
          - calculations.fair_market_rent
          - entities.MarketRateAssessment.fields.method
        distinguishing_aspect: |
          Variant divergence sits on MarketRateAssessment (rent appraisal domain):
          for the same option, COMPARABLE_AVERAGE over [5000,5001,5002,5003] yields
          5002 while PSF_REGRESSION with base 4800 and adjustments [150,-75,300]
          yields 5175 — two valid methods, two different rents on the same subject.
        test_recipe:
          setup:
            - "Portfolio P with asset-manager contact AM and a second contact LC"
            - "Lease L ACTIVE: commenced 2026-01-01, expires 2027-12-31, RSF 10000, base rent 5000"
            - "FAIR_MARKET RENEWAL option O on L with window [2026-09-01, 2027-06-30]"
            - "Two assessments on O: one COMPARABLE_AVERAGE [5000,5001,5002,5003], one PSF_REGRESSION base 4800 adj [150,-75,300]"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P1", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM One", email: "am1@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC One", email: "lc1@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "HQ-1", rentable_square_feet: 10000, base_rent_cents_per_rsf_year: 5000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-09-01T00:00:00Z", notice_window_close_date: "2027-06-30T00:00:00Z", target_commencement_date: "2028-01-01T00:00:00Z", extension_years: 5, rate_determination: "FAIR_MARKET" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id, o_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments"
              payload: { method: "COMPARABLE_AVERAGE", comparable_rents_cents: [5000, 5001, 5002, 5003], expected_option_version: "${o_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { mid_comp: $.data.id }
            - call: "GET /portfolios/${pid}/leases/${lid}/options/${oid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { o_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments"
              payload: { method: "PSF_REGRESSION", regression_base_cents: 4800, regression_adjustments: [150, -75, 300], expected_option_version: "${o_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { mid_reg: $.data.id }
          trigger:
            - call: "GET /portfolios/${pid}/leases/${lid}/options/${oid}/assessments"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
          assert:
            - "Assessment.${mid_comp}.status == SUPERSEDED and Assessment.${mid_comp}.provisional_rent_cents == 5002"
            - "Assessment.${mid_reg}.status == PROVISIONAL and Assessment.${mid_reg}.provisional_rent_cents == 5175"
            - "Assessment.${mid_comp}.provisional_rent_cents != Assessment.${mid_reg}.provisional_rent_cents (5002 != 5175)"

      - name: missed_option_penalty_vs_silent_lapse_diverge
        grounds:
          - calculations.missed_option_consequence
          - state_machines.Option.WINDOW_OPEN_to_LAPSED
        distinguishing_aspect: |
          Variant divergence sits on Option lapse consequences (penalty-ledger domain,
          different subject from rent appraisal): two otherwise identical options,
          one with missed_option_penalty_cents=250000 and one with 0, lapse on the
          same clock sweep — the first posts a MISSED_OPTION_PENALTY LedgerEntry
          and the second posts nothing.
        test_recipe:
          setup:
            - "Portfolio P, lease L ACTIVE (commenced 2026-01-01, expires 2027-12-31)"
            - "Option A: TERMINATION, window [2026-08-10, 2026-09-10], missed_option_penalty_cents=250000"
            - "Option B: ROFR, window [2026-08-10, 2026-09-10], missed_option_penalty_cents=0"
            - "Clock advanced to 2026-09-11 — both lapse in the same sweep"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P2", region: "EAST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Two", email: "am2@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "BR-2", rentable_square_feet: 8000, base_rent_cents_per_rsf_year: 4200, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "TERMINATION", notice_window_open_date: "2026-08-10T00:00:00Z", notice_window_close_date: "2026-09-10T00:00:00Z", target_commencement_date: "2027-03-31T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200, exercise_fee_cents: 0, missed_option_penalty_cents: 250000 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid_a: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "ROFR", notice_window_open_date: "2026-08-10T00:00:00Z", notice_window_close_date: "2026-09-10T00:00:00Z", target_commencement_date: "2027-03-31T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200, exercise_fee_cents: 0, missed_option_penalty_cents: 0 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /portfolios/${pid}/leases/${lid}/ledger"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
          assert:
            - "Option.${oid_a}.status == LAPSED and Option.${oid_b}.status == LAPSED"
            - "Ledger contains exactly one MISSED_OPTION_PENALTY entry: source_option_id == ${oid_a}, amount_cents == 250000, effective_date == 2026-09-11"
            - "No ledger entry with source_option_id == ${oid_b} exists"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: holdover_accrual_nested_rounding_order
        grounds:
          - calculations.holdover_rent_accrual
          - entities.Lease.fields.accrued_holdover_rent_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the spec pins round-per-day-tier-then-multiply;
          the forbidden sum-then-round interpretation yields a different total.
          With daily_base=floor(5000*10000/365)=136986, tier1_daily=205479,
          tier2_daily=273972, 100 days in holdover yields exactly 21232830 cents —
          90*205479 + 10*273972 — a value only the pinned order produces.
        test_recipe:
          setup:
            - "Portfolio P, lease L ACTIVE: RSF 10000, base 5000, tier1 150%, tier2 200%, tier1_days default 90"
            - "Lease commenced 2026-01-01, expires 2026-12-31; clock advanced to 2027-01-01T00:00:00Z so lease enters HOLDOVER with holdover_entered_at = 2027-01-01"
            - "Clock then advanced to 2027-04-11T00:00:00Z so days_held == 100 (2027-01-01 exclusive through 2027-04-11 inclusive)"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P3", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Three", email: "am3@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "WH-3", rentable_square_feet: 10000, base_rent_cents_per_rsf_year: 5000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
          assert:
            - "Lease.${lid}.status == HOLDOVER"
            - "Lease.${lid}.holdover_entered_at == 2027-01-01T00:00:00Z"
            - "Lease.${lid}.accrued_holdover_rent_cents == 21232830"

      - name: arbitration_award_tiebreak_and_assessment_resolution_cycle
        grounds:
          - calculations.fair_market_rent
          - state_machines.ArbitrationCase.OPEN_to_DECIDED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          award feeds assessment.determined_rent_cents, which feeds
          option.determined_rent_cents_per_rsf_year, which feeds the lease rent on
          exercise — and with guidance exactly midway (landlord 6000, tenant 5000,
          guidance 5500) the tie-break rule (lower submission wins) pins award to
          5000, so evaluation order and tie-break both change observable results.
        test_recipe:
          setup:
            - "Portfolio P with AM, LC, and Broker contacts"
            - "Lease L ACTIVE; FAIR_MARKET RENEWAL option O window [2026-08-01, 2027-06-30]"
            - "Clock at 2026-08-15; notice sent, delivered; assessment submitted COMPARABLE_AVERAGE [5001,5002,5003] → provisional 5002; disputed with landlord 6000 / tenant 5000"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P4", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Four", email: "am4@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "BK Four", email: "bk4@x.com", contact_kind: "BROKER" }
              as: PlatformAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC Four", email: "lc4@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "OF-4", rentable_square_feet: 12000, base_rent_cents_per_rsf_year: 5000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2027-06-30T00:00:00Z", target_commencement_date: "2028-01-01T00:00:00Z", extension_years: 5, rate_determination: "FAIR_MARKET" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id, o_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "COURIER", expected_lease_version: "${l_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid}/deliver"
              payload: {}
              as: Broker
              as_user_id: "${bk_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments"
              payload: { method: "COMPARABLE_AVERAGE", comparable_rents_cents: [5001, 5002, 5003], expected_option_version: "${o_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { mid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments/${mid}/dispute"
              payload: { landlord_rent_cents: 6000, tenant_rent_cents: 5000 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { arb_id: $.data.id }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments/${mid}/arbitration/decide"
              payload: { panel_guidance_rent_cents: 5500 }
              as: LandlordCounsel
              as_user_id: "${lc_id}"
          assert:
            - "ArbitrationCase.${arb_id}.status == DECIDED"
            - "ArbitrationCase.${arb_id}.award_rent_cents == 5000 (exact midpoint tie → lower submission)"
            - "MarketRateAssessment.${mid}.status == FINAL and determined_rent_cents == 5000"
            - "Option.${oid}.status == NOTICE_SENT (returned from IN_ARBITRATION)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: amendment_cyclic_negotiation_loop
        grounds:
          - state_machines.Amendment.PROPOSED_to_COUNTERED
          - state_machines.Amendment.COUNTERED_to_PROPOSED
        distinguishing_aspect: |
          Cyclic shape on Amendment: PROPOSED → COUNTERED → PROPOSED → AGREED
          loops the negotiation dimension an arbitrary number of times before
          joining the execute path — a cycle on the Amendment entity.
        test_recipe:
          setup:
            - "Portfolio P with AM and LC contacts; lease L ACTIVE (expires 2027-12-31)"
            - "Amendment A created (RENEWAL_TERM, new expiration 2032-12-31, new rent 5500), proposed"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P5", region: "WEST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Five", email: "am5@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC Five", email: "lc5@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "RT-5", rentable_square_feet: 9000, base_rent_cents_per_rsf_year: 5000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id, l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments"
              payload: { kind: "RENEWAL_TERM", new_expiration_date: "2032-12-31T00:00:00Z", new_base_rent_cents_per_rsf_year: 5500 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { aid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/propose"
              payload: { expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/counter"
              payload: { new_base_rent_cents_per_rsf_year: 5800 }
              as: LandlordCounsel
              as_user_id: "${lc_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/repropose"
              payload: { new_base_rent_cents_per_rsf_year: 5650 }
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/agree"
              payload: {}
              as: LandlordCounsel
              as_user_id: "${lc_id}"
          assert:
            - "Amendment.${aid}.status == AGREED after the PROPOSED→COUNTERED→PROPOSED→AGREED loop"
            - "Amendment.${aid}.new_base_rent_cents_per_rsf_year == 5650 (reproposed value survived the loop)"

      - name: option_in_arbitration_cycle_suspends_and_resumes_notice_path
        grounds:
          - state_machines.Option.NOTICE_SENT_to_IN_ARBITRATION
          - state_machines.Option.IN_ARBITRATION_to_NOTICE_SENT
        distinguishing_aspect: |
          Cyclic shape on Option (different entity than Amendment): NOTICE_SENT →
          IN_ARBITRATION → NOTICE_SENT is a loop that suspends and resumes the
          notice path — option leaves the exercise path mid-flight and re-enters it
          after the arbitration decision, with reminder firing suspended during the
          arbitration leg.
        test_recipe:
          setup:
            - "Portfolio P with AM, BK, LC; lease L ACTIVE; FAIR_MARKET RENEWAL option O window [2026-08-01, 2027-06-30]"
            - "Clock 2026-08-15; notice SENT; assessment PROVISIONAL; dispute filed → option IN_ARBITRATION; arbitration decided guidance 5300 → landlord 6000/tenant 5000 → award 5000? no: |6000-5300|=700, |5000-5300|=300 → award 5000"
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "P6", region: "EAST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Six", email: "am6@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
              captures: { am_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "BK Six", email: "bk6@x.com", contact_kind: "BROKER" }
              as: PlatformAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "LC Six", email: "lc6@x.com", contact_kind: "LANDLORD_COUNSEL" }
              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "OF-6", rentable_square_feet: 12000, base_rent_cents_per_rsf_year: 5000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id, l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-08-01T00:00:00Z", notice_window_close_date: "2027-06-30T00:00:00Z", target_commencement_date: "2028-01-01T00:00:00Z", extension_years: 5, rate_determination: "FAIR_MARKET" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id, o_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices"
              payload: { delivery_method: "CERTIFIED_MAIL", expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { nid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments"
              payload: { method: "COMPARABLE_AVERAGE", comparable_rents_cents: [5001, 5002, 5003], expected_option_version: "${o_ver}" }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { mid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments/${mid}/dispute"
              payload: { landlord_rent_cents: 6000, tenant_rent_cents: 5000 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { arb_id: $.data.id }
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/assessments/${mid}/arbitration/decide"
              payload: { panel_guidance_rent_cents: 5300 }
              as: LandlordCounsel
              as_user_id: "${lc_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid}/deliver"
              payload: {}
              as: Broker
              as_user_id: "${bk_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${oid}/notices/${nid}/acknowledge"
              payload: {}
              as: LandlordCounsel
              as_user_id: "${lc_id}"
          assert:
