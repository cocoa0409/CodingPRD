            - "SUSTAINED: interest_cents == 502500 (40 days at 0.0005/day, under the 50% cap), assessed_total_cents == 25627500, recovered_from_certificate_cents == 60750000, cash_assessment_cents == 0 (recovery covers the assessment)"
            - "After sustain: allocated == 0, remaining == 100000000; invariant 0 + 100000000 == annual_cap_cents — full restoration, zero drift"
            - "CreditCertificate.${cert_id}: status == CLAWED_BACK, remaining_amount_cents == 0; Application.${app_id}.status == REVOKED"
