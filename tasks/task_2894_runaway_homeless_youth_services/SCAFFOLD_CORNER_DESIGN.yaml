          setup:
            - "an EMERGENCY_SHELTER program plus a TRANSITIONAL_LIVING program with three free beds"
            - "youth Kira Adeoye (dob 2010-03-15, age 16) with a CLEARED screening and an ACTIVE admission whose GuardianNotification is still PENDING, so risk_posture is RESTRICTED"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rsp_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rsp_tlp_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Kira", legal_last_name: "Adeoye", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rsp_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${rsp_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rsp_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${rsp_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${rsp_youth_id}", program_id: "${rsp_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { rsp_adm_id: $.data.id }
          trigger:
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${rsp_youth_id}", program_id: "${rsp_tlp_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { rsp_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 422 with error_id ERR_YOUTH_POSTURE_RESTRICTED"
            - "the request does NOT return error_id ERR_SCREENING_REQUIRED"
            - "Youth.${rsp_youth_id}.risk_posture == RESTRICTED"
            - "Youth.${rsp_youth_id}.status == SHELTERED"
            - "ShelterProgram.${rsp_tlp_id}.occupied_beds == 0"
            - "GET /ryhs/tlp-placements?youth_id=${rsp_youth_id} returns total_count 0"

      - name: admission_occupancy_overlap_on_the_same_youth
        claim_type: error_triggerability
        grounds:
          - validations[priority=27]
          - errors.ERR_ADMISSION_OVERLAP
        excluded_because:
          difficulty_instance: admission_half_open_occupancy_adjacency_on_the_youth_is_legal
          rationale: "That difficulty instance already contrasts the legal exact-adjacency case with a one-second-earlier start that intersects the prior interval and returns ERR_ADMISSION_OVERLAP, at a second program so the priority 11 same-program rule cannot shadow it. A corner test would repeat the same pair of calls."

      - name: transitional_living_placement_requires_a_cleared_screening
        claim_type: error_triggerability
        grounds:
          - validations[priority=30]
          - errors.ERR_SCREENING_REQUIRED
        excluded_because:
          difficulty_instance: tlp_placement_blocked_until_latest_screening_is_cleared
          rationale: "ERR_SCREENING_REQUIRED is already the asserted outcome of that cross-entity difficulty instance, which walks the youth from no usable screening to a CLEARED one and shows the placement flipping from refused to accepted. A corner duplicate adds no new observation."

      - name: frozen_program_with_waitlist_opt_out_exceeds_bed_capacity
        claim_type: error_triggerability
        grounds:
          - validations[priority=43]
          - errors.ERR_BED_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: admission_landing_state_determined_by_program_posture
          rationale: "The FROZEN branch is already exercised there: the same request lands ACTIVE, then WAITLISTED once the beds are full, then returns ERR_BED_CAPACITY_EXCEEDED when waitlist_opt_out is true. Both the waitlisted landing and the hard refusal are asserted, leaving nothing for a corner instance."

  - section: rbac
    instances:
      - name: blank_auth_headers_are_rejected
        claim_type: rbac_enforcement
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_AUTH_HEADERS
        distinguishing_aspect: "Priority 1 fires before any existence check, so an empty X-User-Role, an empty X-User-ID and an unrecognised role name all return 401 ERR_MISSING_AUTH_HEADERS even when the path id is a real row - and the header must be sent empty, not as whitespace."
        test_recipe:
          setup:
            - "one youth exists, so the addressed id resolves and the 401 cannot be confused with a 404"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Odile", legal_last_name: "Marchand", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { auth_youth_id: $.data.id }
          trigger:
            - call: "GET /ryhs/youths/${auth_youth_id}"
              payload: {}
              as: ""
              as_user_id: "worker-1"
              captures: { auth_norole_err: $.data.error_id }
            - call: "GET /ryhs/youths/${auth_youth_id}"
              payload: {}
              as: OutreachWorker
              as_user_id: ""
              captures: { auth_nouser_err: $.data.error_id }
            - call: "GET /ryhs/youths/${auth_youth_id}"
              payload: {}
              as: "Superintendent"
              as_user_id: "worker-1"
              captures: { auth_badrole_err: $.data.error_id }
          assert:
            - "the call with X-User-Role sent as the empty string returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "the call with X-User-ID sent as the empty string returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "the call with X-User-Role Superintendent returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS, not 403"
            - "none of the three calls returns error_id ERR_UNAUTHORIZED_ROLE or ERR_YOUTH_NOT_FOUND"

      - name: wrong_role_on_another_roles_exclusive_operation_is_rejected
        claim_type: rbac_enforcement
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED_ROLE
          - roles.OutreachWorker.exclusive_operations
          - roles.ShelterCaseManager.exclusive_operations
          - roles.ProgramAdmin.exclusive_operations
          - roles.TlpCoordinator.exclusive_operations
        distinguishing_aspect: "The peer roles are mutually exclusive on their own writes: OutreachWorker cannot admit, ProgramAdmin cannot intake a youth, TlpCoordinator cannot license a program and ShelterCaseManager cannot disposition a screening - all 403 ERR_UNAUTHORIZED_ROLE, and none of them mutates state despite otherwise valid payloads."
        test_recipe:
          setup:
            - "an OPEN EMERGENCY_SHELTER program and a youth with a SUBMITTED screening, so every trigger payload below is otherwise legal"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rol_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Lior", legal_last_name: "Benali", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rol_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${rol_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rol_scr_id: $.data.id }
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${rol_youth_id}", program_id: "${rol_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rol_adm_err: $.data.error_id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Mona", legal_last_name: "Benali", date_of_birth: "2011-03-15", unaccompanied: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rol_intake_err: $.data.error_id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Unauthorized Annex", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 4, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { rol_prog_err: $.data.error_id }
            - call: "POST /ryhs/safety-screenings/${rol_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { rol_disp_err: $.data.error_id }
          assert:
            - "all four calls return HTTP 403 with error_id ERR_UNAUTHORIZED_ROLE"
            - "GET /ryhs/admissions returns total_count 0"
            - "GET /ryhs/youths returns total_count 1"
            - "GET /ryhs/shelter-programs returns total_count 1"
            - "SafetyScreening.${rol_scr_id}.status == SUBMITTED"

      - name: a_youth_member_cannot_touch_another_youths_row_or_vote
