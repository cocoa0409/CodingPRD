              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-410", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 1, avg_weekly_hours: 47 }
