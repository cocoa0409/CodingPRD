            - "an unfiltered list for the film returns total_count 2"

      - name: contract_reverse_lookup_filters_each_status_axis_independently
        claim_type: cross_reference_link
        grounds:
          - "endpoints[GET /film-sales/pre-sale-contracts]"
          - entities.PreSaleContract.fields.delivery_status
        distinguishing_aspect: |
          One contract carries three orthogonal status axes, so the same row must be findable by
          negotiation_status EXECUTED, by delivery_status NOT_STARTED and by collection_status
          PARTIALLY_PAID after a receipt — and must disappear from a query that mixes one true axis with
          one stale value, which a single-status implementation cannot reproduce.
