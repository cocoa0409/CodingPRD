# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Ride-Sharing Dynamic Surge Pricing
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 surface not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_zone_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Zone.fields.open_demand_count
          - entities.Zone.fields.current_multiplier
          - entities.Zone.fields.heat_level
        distinguishing_aspect: "POST /zones with name/grid_code/base_fare_cents returns 201; counters init 0, current_multiplier 1.00, heat_level COOL, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "A1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
          assert:
            - "response_type == object and code 201"
            - "Zone.${z_id}.open_demand_count == 0 and Zone.${z_id}.available_supply_count == 0"
            - "Zone.${z_id}.current_multiplier == 1.00 and Zone.${z_id}.heat_level == COOL"
            - "Zone.${z_id}.version == 1"

      - name: create_zone_is_airport_default_false
        claim_type: Defaults
        grounds: [entities.Zone.fields.is_airport]
        distinguishing_aspect: "Omitting is_airport on POST /zones defaults it to false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "Z2", grid_code: "A2", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
          assert:
            - "Zone.${z_id}.is_airport == false"

      - name: get_zone_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /zones/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /zones/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_NOT_FOUND"

      - name: create_zone_missing_base_fare_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /zones omitting required base_fare_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "Z3", grid_code: "A3" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_REQUEST"

      - name: create_zone_base_fare_below_min_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=14]", "entities.Zone.fields.base_fare_cents"]
        distinguishing_aspect: "base_fare_cents 50 (< 100 minimum) on POST /zones returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "Z4", grid_code: "A4", base_fare_cents: 50 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_grid_code_returns_conflict
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_GRID_CODE]"]
        distinguishing_aspect: "Creating a second Zone with an existing grid_code returns ERR_DUPLICATE_GRID_CODE (409)."
        test_recipe:
          setup: ["One zone with grid_code 'A1'."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "A1", base_fare_cents: 1000 }
              as: Dispatcher
          trigger:
            - call: "POST /zones"
              payload: { name: "Z1dup", grid_code: "A1", base_fare_cents: 2000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_DUPLICATE_GRID_CODE"

      - name: surge_snapshot_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SurgeSnapshot]
        distinguishing_aspect: "SurgeSnapshot is common_fields:false — append-only; no update endpoint exists and it carries no version field."
        test_recipe:
          setup: ["One zone with a published snapshot."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "B1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 1, observed_supply: 4, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
              captures: { snap_id: $.data.id }
          trigger:
            - call: "GET /zones/${z_id}/surge-snapshots"
              payload: {}
              as: Dispatcher
          assert:
            - "SurgeSnapshot.${snap_id} appears in the list with no version field"

      - name: rider_wallet_default_zero
        claim_type: Defaults
        grounds: [entities.Rider.fields.wallet_balance_cents]
        distinguishing_aspect: "POST /riders omitting wallet_balance_cents defaults to 0."
        test_recipe:
          setup: ["One zone."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "C1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
          trigger:
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { rider_id: $.data.id }
          assert:
            - "Rider.${rider_id}.wallet_balance_cents == 0"

      - name: driver_current_zone_initialized_to_home
        claim_type: Computed Fields
        grounds: [entities.Driver.fields.current_zone_id, entities.Driver.fields.status]
        distinguishing_aspect: "A newly created Driver has current_zone_id == home_zone_id and status OFFLINE."
        test_recipe:
          setup: ["One zone."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "D1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
          trigger:
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
          assert:
            - "Driver.${drv_id}.current_zone_id == ${z_id} and Driver.${drv_id}.status == OFFLINE"

      - name: trip_freezes_quoted_surge_at_request
        claim_type: Computed Fields
        grounds: [entities.Trip.fields.quoted_multiplier, entities.Trip.fields.quoted_base_fare_cents]
        distinguishing_aspect: "POST /trips freezes quoted_multiplier from Zone.current_multiplier (2.00) and quoted_base_fare_cents from Zone.base_fare_cents (1000) at request time."
        test_recipe:
          setup: ["Zone base 1000 with current_multiplier 2.00; one rider."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "E1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
          assert:
            - "Trip.${trip_id}.quoted_multiplier == 2.00 and Trip.${trip_id}.quoted_base_fare_cents == 1000"
            - "Zone.${z_id}.open_demand_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: start_trip_from_requested_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Trip.MATCHED_to_ENROUTE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling start on a REQUESTED (not yet MATCHED) trip returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A REQUESTED trip (no dispatch run); its driver online."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "F1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_STATE"
            - "Trip.${trip_id}.status == REQUESTED"

      - name: complete_already_completed_trip_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Trip.ENROUTE_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED trip is terminal; a second complete returns ERR_INVALID_STATE (409) and does not re-charge the rider."
        test_recipe:
          setup: ["One completed trip; rider funded 5000, charged 2150 -> wallet 2850."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "G1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_STATE"
            - "Rider.${rider_id}.wallet_balance_cents == 2850"

      - name: new_trip_initial_state_requested
        claim_type: Initial State
        grounds: [state_machines.Trip.initial_state, entities.Trip.fields.status]
        distinguishing_aspect: "A newly created Trip starts in REQUESTED with driver_id null."
        test_recipe:
          setup: ["One zone and one rider."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "H1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
          assert:
            - "Trip.${trip_id}.status == REQUESTED and Trip.${trip_id}.driver_id == null"

      - name: quest_earned_on_reaching_target_trips
        claim_type: Side Effect Execution
        grounds: [state_machines.Quest.ACTIVE_to_EARNED, entities.Quest.fields.completed_trips, entities.Quest.fields.paid_out_cents]
        distinguishing_aspect: "Completing the target_trips-th trip flips an ACTIVE Quest to EARNED, sets completed_trips==target_trips and paid_out_cents==bonus_cents."
        test_recipe:
          setup: ["Driver with an ACTIVE Quest target_trips 1 bonus 5000; rider funded; one trip ready to complete."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "I1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 5000 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /quests"
              payload: { driver_id: "${drv_id}", target_trips: 1, bonus_cents: 5000, window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Dispatcher
              captures: { q_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${z_id}" }
              as: Dispatcher
            - call: "POST /trips/${trip_id}/start"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "Quest.${q_id}.status == EARNED and Quest.${q_id}.completed_trips == 1 and Quest.${q_id}.paid_out_cents == 5000"

      - name: expire_active_quest_stays_zero_payout
        claim_type: Valid Transition
        grounds: [state_machines.Quest.ACTIVE_to_EXPIRED, entities.Quest.fields.paid_out_cents]
        distinguishing_aspect: "Expiring an ACTIVE Quest moves it to EXPIRED with paid_out_cents staying 0."
        test_recipe:
          setup: ["Driver with one ACTIVE Quest."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "J1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${z_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /quests"
              payload: { driver_id: "${drv_id}", target_trips: 3, bonus_cents: 5000, window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-01T05:00:00Z" }
              as: Dispatcher
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quests/${q_id}/expire"
              payload: {}
              as: Dispatcher
          assert:
            - "Quest.${q_id}.status == EXPIRED and Quest.${q_id}.paid_out_cents == 0"

      - name: withdraw_already_withdrawn_queue_entry_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.AirportQueueEntry.WAITING_to_WITHDRAWN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second withdraw on an already-WITHDRAWN AirportQueueEntry returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Airport zone with one driver queued then withdrawn."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "AZ", grid_code: "Z1", is_airport: true, base_fare_cents: 1500 }
              as: Dispatcher
              captures: { az_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${az_id}" }
              as: Dispatcher
              captures: { drv_id: $.data.id }
            - call: "POST /drivers/${drv_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /airport-queue"
              payload: { zone_id: "${az_id}", driver_id: "${drv_id}" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { q_id: $.data.id }
            - call: "POST /airport-queue/${q_id}/withdraw"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /airport-queue/${q_id}/withdraw"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_INVALID_STATE"

      - name: airport_dispatch_uses_fifo_queue_order
        claim_type: guarded transitions
        grounds: [state_machines.Trip.REQUESTED_to_MATCHED, state_machines.AirportQueueEntry.WAITING_to_DISPATCHED]
        distinguishing_aspect: "For an airport pickup zone, dispatch matches the earliest-joined WAITING driver (FIFO by joined_at), not the earliest-registered; the first queued driver is dispatched and its entry -> DISPATCHED."
        test_recipe:
          setup: ["Airport zone with driver D2 (registered second) joining the queue FIRST, then D1; one REQUESTED trip from the airport zone."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "AZ", grid_code: "Z2", is_airport: true, base_fare_cents: 1500 }
              as: Dispatcher
              captures: { az_id: $.data.id, az_v: $.data.version }
            - call: "POST /zones/${az_id}/surge-snapshots"
              payload: { observed_demand: 1, observed_supply: 4, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${az_v}" }
              as: Dispatcher
            - call: "POST /drivers"
              payload: { name: "D1", home_zone_id: "${az_id}" }
              as: Dispatcher
              captures: { d1_id: $.data.id }
            - call: "POST /drivers"
              payload: { name: "D2", home_zone_id: "${az_id}" }
              as: Dispatcher
              captures: { d2_id: $.data.id }
            - call: "POST /drivers/${d1_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${d1_id}"
            - call: "POST /drivers/${d2_id}/go-online"
              payload: {}
              as: Driver
              as_user_id: "${d2_id}"
            - call: "POST /airport-queue"
              payload: { zone_id: "${az_id}", driver_id: "${d2_id}" }
              as: Driver
              as_user_id: "${d2_id}"
              captures: { q2_id: $.data.id }
            - call: "POST /airport-queue"
              payload: { zone_id: "${az_id}", driver_id: "${d1_id}" }
              as: Driver
              as_user_id: "${d1_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${az_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${az_id}", dropoff_zone_id: "${az_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /_dispatch/tick"
              payload: { zone_id: "${az_id}" }
              as: Dispatcher
          assert:
            - "Trip.${trip_id}.driver_id == ${d2_id}"
            - "AirportQueueEntry.${q2_id}.status == DISPATCHED"

      - name: error_match_then_cancel_supply_conserved
        claim_type: Compensation
        grounds: [state_machines.Trip.MATCHED_to_CANCELLED]
        excluded_because:
          difficulty_instance: compensating_invariant / match_then_cancel_conserves_total_available_supply
          rationale: "Match-then-cancel supply conservation is the named §1.8 compensating-invariant instance."
        # NO test_recipe.

  # ===========================================================================
  - section: calculations
    instances:
      - name: heat_level_warm_band_boundary
        claim_type: Constants Applied
        grounds: [calculations.heat_level, entities.Zone.fields.heat_level]
        distinguishing_aspect: "Multiplier 1.50 (ratio 1.50 band, demand 3 / supply 2) maps to heat_level WARM (1.25 <= m < 1.75)."
        test_recipe:
          setup: ["One non-airport zone base 1000 at version 1."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "K1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
          trigger:
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 3, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
              captures: { mult: $.data.multiplier }
          assert:
