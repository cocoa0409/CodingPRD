      - name: settlement_threshold_strict_inequality_at_exact_equality
        grounds:
          - calculations.settlement_recognition
          - state_machines.BuyoutTranche.ASSETS_TRANSFERRED_to_SETTLED
          - entities.SettlementEntry.fields.deferred_amount_cents
          - concurrency_rules.valuation-update-stale-plan
        distinguishing_aspect: |
          ASC 715 recognition turns on a STRICT greater-than, and this instance
          settles two arithmetically identical tranches across a single one-cent
          change in the plan's interest cost. With interest_cost 9000000 the
          threshold is exactly 12000000 and settlement_cost is exactly 12000000, so
          12000000 > 12000000 is false and the entire 998400 charge defers to AOCI
          with recognized_amount_cents 0. A valuation update lowering interest_cost
          to 8999999 moves the threshold to 11999999, and the very same 12000000
          cost now recognises the full 998400 in earnings with
          deferred_amount_cents 0. Every other input — pbo_settled 11460000,
          gain_loss 540000, pro_rata 458400 — is byte-identical between the two
          settlements, so only the comparison operator can explain the difference.
