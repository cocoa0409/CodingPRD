  - section: endpoints
    instances:

      - name: corner_logical_clock_defaults_to_2026_05_01_until_set
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - conventions.timestamps
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z, so the first row created stamps created_at 2026-05-01T00:00:00.000Z; after moving the clock to 2026-08-01T12:00:00Z, the next row stamps 2026-08-01T12:00:00.000Z. Wall-clock time is never used."
        test_recipe:
          setup:
            - "Empty database; the clock has never been set."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Early Bird", discipline: "RN", specialty: "ER", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_early_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { now: "$.data.current_utc" }
            - call: "POST /clinicians"
              payload: { full_name: "Late Bird", discipline: "RN", specialty: "ER", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_late_id: "$.data.id" }
          assert:
            - "Clinician.${clin_early_id}.created_at == 2026-05-01T00:00:00.000Z and updated_at == 2026-05-01T00:00:00.000Z"
            - "The clock response's current_utc == 2026-08-01T12:00:00Z"
            - "Clinician.${clin_late_id}.created_at == 2026-08-01T12:00:00.000Z"
            - "Timestamps carry exactly three fractional digits and a trailing Z"

      - name: corner_pagination_limit_above_maximum_rejected
        claim_type: Computed read
        grounds:
          - response_envelope.pagination_defaults
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "The pagination envelope pins limit to 1..100, so GET /assignments?limit=101 is refused 400 ERR_VALIDATION while limit=100 succeeds."
        test_recipe:
          setup:
            - "Empty database - the guard runs before any row is read."
          setup_api_calls: []
          trigger:
            - call: "GET /assignments?limit=101&offset=0"
              as: Recruiter
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 400 with error_id == ERR_VALIDATION"
            - "GET /assignments?limit=100&offset=0 returns 200 with data == [], total_count == 0, has_more == false"
            - "GET /assignments with no query parameters returns limit == 10 and offset == 0 in the envelope"

  - section: errors
    instances:

      - name: corner_license_transition_unknown_id_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LICENSE_NOT_FOUND]
          - endpoints[POST /licenses/{id}/transition]
          - validations[priority=3]
        distinguishing_aspect: "Path existence (priority 3) fires before the state check (priority 7), so transitioning a non-existent license id returns 404 ERR_LICENSE_NOT_FOUND rather than 409."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /licenses/99999999-8888-4777-8666-555555555555/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 404 with error_id == ERR_LICENSE_NOT_FOUND"

      - name: corner_timesheet_create_with_unknown_assignment_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - validations[priority=6]
          - endpoints[POST /timesheets]
        distinguishing_aspect: "Body-FK existence (priority 6) fires before the state precondition (priority 7), so an unknown assignment_id returns 404 ERR_ASSIGNMENT_NOT_FOUND rather than ERR_ASSIGNMENT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "One clinician exists so the acting identity resolves; no assignment exists."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
          trigger:
            - call: "POST /timesheets"
              payload: { assignment_id: "00000000-1111-4222-8333-444444444444", week_start_date: "2026-06-07", daily_hours: [0, 12, 12, 12, 0, 0, 0], callback_hours: 0 }
              as: Clinician
