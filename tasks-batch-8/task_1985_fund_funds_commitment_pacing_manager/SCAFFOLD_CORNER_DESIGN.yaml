              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { cst: $.data.status }
            - call: "GET /fof/programs/${prog}"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { posture_od: $.data.posture }
            - call: "POST /fof/calls/${call1}/pay"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "GET /fof/programs/${prog}"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { posture_ok: $.data.posture }
          assert:
            - "cst == OVERDUE (sweep fired at due_date + grace)"
            - "posture_od == RESTRICTED (OVERDUE call present)"
            - "pay on OVERDUE succeeds: CapitalCall.${call1}.status == PAID"
            - "posture_ok == NORMAL after the pay (19000000 >= 1.10 * 1000000 and no OVERDUE calls)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: concentration_check_excludes_pending_and_cancelled
