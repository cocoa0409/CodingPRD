            - "assigning the afternoon session then returns 409 with data.error_id == 'ERR_PROCTOR_DAILY_CAP_EXCEEDED' (projected 8.00 > 4.00), NOT ERR_PROCTOR_TIME_CONFLICT - 09:00-13:00 and 14:00-18:00 are disjoint"
            - "GET /exam-sessions/${sess_draft} reports data.status == 'DRAFT' and data.proctor_id == null"
