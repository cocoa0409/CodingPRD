  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: reblend_limit_at_exactly_two
        grounds:
          - calculations.brix_adjustment
          - errors[ERR_REBLEND_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric: integer adjustment counter; endpoint: apply-adjustment. The
          boundary is adjustment_count < 2 BEFORE applying: two adjustments
          succeed, the third attempt (count already == 2) is rejected with
          ERR_REBLEND_LIMIT_EXCEEDED — the limit trips at == 2, not > 2.
        test_recipe:
          setup:
            - "ACTIVE customer; DRAFT formula; tank cap 5000; batch 2000 L having failed QA twice and applied two adjustments (count == 2); third FAIL verdict recorded"
          setup_api_calls:
