            - "After certificate issuance: second confirm succeeds, stW == CONFIRMED and assigned_supervisor_id == 'sup-9'"

      - name: initial_visit_gated_on_facility_pending_review
        grounds:
          - state_machines.SupervisionVisit
          - entities.Facility.fields.status
        distinguishing_aspect: "Entity pair SupervisionVisit x Facility (distinct from siblings): an INITIAL visit is creatable only while the facility is PENDING_REVIEW — after approval the same call fails ERR_FACILITY_INVALID_STATE, while a ROUTINE visit on the APPROVED facility succeeds (conditional validation keyed on visit_type)."
        test_recipe:
          setup:
            - "Client + facility already APPROVED (INITIAL visit v1 completed, equipment assessed)"
          setup_api_calls:
