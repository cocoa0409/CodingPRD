      - name: waiving_a_fee_accrual_releases_the_month_for_re_accrual
        claim_type: conditional_action
        grounds:
          - endpoints.POST_fee-accruals_id_status
          - validations.priority_19_fee_period_overlap
          - errors.ERR_FEE_PERIOD_OVERLAP
        distinguishing_aspect: "The same POST body is refused, then accepted, with no change to the loan or the trust — only the first accrual's status moved to WAIVED. This isolates the overlap predicate's exclusion of WAIVED rows, and shows the waiver compensating loan.fees_payable_usd exactly rather than merely marking the row."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; loan principal 10,000,000.00, trust on the 0.25 STATED_PRINCIPAL defaults, so each monthly accrual is 2,083.33."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V34", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V34", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { first_fee_id: "$.data.id", first_amount: "$.data.amount_usd" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { payable_after_first: "$.data.fees_payable_usd" }
          trigger:
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-10T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /special-servicing/fee-accruals/${first_fee_id}/status"
              payload: { to_status: "WAIVED", waived_reason: "period accrued against the wrong servicing convention" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { waived_status: "$.data.status" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { payable_after_waiver: "$.data.fees_payable_usd" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { re_accrual_id: "$.data.id", re_accrual_amount: "$.data.amount_usd", re_accrual_status: "$.data.status", re_accruer: "$.data.accrued_by_user_id" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { payable_after_re_accrual: "$.data.fees_payable_usd" }
            - call: "GET /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { first_listed_id: "$.data[0].id" }
          assert:
            - "The first accrual is 2083.33 and Loan.fees_payable_usd == 2083.33"
            - "The partially overlapping July window is refused with HTTP 409 and error_id ERR_FEE_PERIOD_OVERLAP while the first accrual is still ACCRUED"
            - "WAIVED is accepted from cmte-001, who is not the accruing user ms-001, and returns 200 with status WAIVED"
            - "The waiver compensates the ledger exactly: Loan.fees_payable_usd back to 0.00, not left at 2083.33 and not driven negative"
            - "Re-accruing the identical 2026-07-01..2026-07-31 window now returns 201 with amount_usd 2083.33 and accrued_by_user_id 'amgr-001' — the WAIVED row no longer occupies the slot"
            - "Loan.fees_payable_usd == 2083.33 again after the re-accrual: exactly one live accrual for July"
            - "The list keeps both rows in created_at ASC order with the WAIVED row first; nothing is deleted"
            - "The trust's fee-independent aggregates (total_ara_usd, total_advances_outstanding_usd, realized_loss_usd) stayed 0.00 throughout"

  - section: errors
    instances:
      - name: unauthenticated_and_role_denied_calls_rejected_before_any_business_check
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles
        distinguishing_aspect: "Both header gates fire ahead of every existence, state and calculation check: the bodies used here would also fail those checks (an absent loan_id, a request that is not UNDER_ANALYSIS), yet the response is 401 or 403 and never 404 or 409. Empty X-User-ID is treated exactly like a missing one."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one trust and one loan in MASTER_SERVICING."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V35", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V35", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
          trigger:
            - call: "GET /special-servicing/loans/${loan_id}"
              as: MasterServicer
              as_user_id: ""
              captures: { empty_user_error: "$.data.error_id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "00000000-0000-4000-8000-000000000051", advance_type: "PI_ADVANCE", amount_usd: 60000, advanced_on: "2026-07-01T00:00:00Z" }
              as: Trustee
              as_user_id: "trustee-001"
              captures: { wrong_role_error: "$.data.error_id" }
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V36", closing_date: "2026-02-15T00:00:00Z", original_controlling_class_balance_usd: 20000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { admin_only_error: "$.data.error_id" }
            - call: "POST /special-servicing/consultations/sweep"
              payload: {}
              as: Trustee
              as_user_id: "trustee-001"
              captures: { sweep_role_error: "$.data.error_id" }
            - call: "GET /special-servicing/trusts/${trust_id}"
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { borrower_read_error: "$.data.error_id" }
          assert:
            - "The read with an empty X-User-ID returns HTTP 401 with error_id ERR_UNAUTHENTICATED; an entirely missing X-User-ID or X-User-Role header, and an X-User-Role outside the seven declared roles, return the same 401"
            - "The Trustee advance attempt returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED, NOT ERR_LOAN_NOT_FOUND, even though the body's loan_id does not exist"
            - "A MasterServicer boarding a trust returns 403 ERR_ROLE_NOT_PERMITTED — POST /trusts is PlatformAdmin-exclusive"
            - "A Trustee running the consultation sweep returns 403 ERR_ROLE_NOT_PERMITTED — the sweep is PlatformAdmin-exclusive"
            - "A Borrower reading a trust returns 403 ERR_ROLE_NOT_PERMITTED: GET /trusts/{id} does not list Borrower in its roles"
            - "Not one of the five calls created, mutated or version-bumped any row: Trust.version and Loan.version are unchanged"

      - name: permitted_role_requesting_a_forbidden_target_status_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ROLE_NOT_PERMITTED_FOR_STATUS
          - endpoints.POST_workout-plans_id_status
          - endpoints.POST_loans_id_servicing-status
        distinguishing_aspect: "The 403 here is finer-grained than ERR_ROLE_NOT_PERMITTED: every caller is on the endpoint's roles list, so the endpoint gate passes and only the (role, to_status) pair is refused. It separates two causes — another role's reserved target, and a system-only target that no role may request — and both are checked before the (from, to) legality that would otherwise yield 409."
