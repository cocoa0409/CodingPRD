      - name: reverse_pending_event_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CHARGEABILITY_VIOLATION]"
          - "state_machines.RevenueEvent"
        distinguishing_aspect: "Reverse on a PENDING event -> ERR_CHARGEABILITY_VIOLATION; reverse on a CHARGEBACK event -> ERR_CHARGEABILITY_VIOLATION (no reversal of a reversal)."
        test_recipe:
          setup: ["Channel; one PENDING TIP (August); one CLEARED TIP that was then reversed (producing a CHARGEBACK event)"]
          setup_api_calls:
            - call: "POST /api/channels"
