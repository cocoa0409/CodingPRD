  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: frost_declaration_defers_window_reverts_task_and_debits_ledger
        grounds:
          - state_machines.WeatherEvent.None_to_ACTIVE
          - state_machines.MaintenanceWindow.SCHEDULED_to_DEFERRED
          - state_machines.PlanTask.SCHEDULED_to_PLANNED
          - calculations.plan_nitrogen_commitment_lb
          - calculations.turf_nitrogen_load
        distinguishing_aspect: |
          Depth 3 from a weather trigger: POST /weather-events (FROST) causes
          the MaintenanceWindow defer, the defer causes the PlanTask reversion,
          and the reversion causes the AgronomicPlan ledger debit and the
          TurfArea projection recompute. Each link is caused strictly by the
          previous one — the frost event names no task and no plan, and the
          non-intersecting second window proves the chain is driven by interval
          intersection rather than by course membership alone.
        test_recipe:
          setup:
            - "The two-task 2026 plan fixture: an 8.00 lb budget, 0.85 lb per 1000 on the 5500 sq ft hole 7 green and 0.75 lb per 1000 on the 4300 sq ft hole 12 green, submitted by agro-1 and approved by super-1."
            - "Both tasks scheduled onto SCHEDULED windows, the first on 2026-08-12 from 05:00Z to 07:00Z and the second on 2026-08-13 from 05:00Z to 07:00Z, so committed_nitrogen_lb is 7.91."
            - "Logical clock moved to 2026-08-12T04:00:00Z, one hour before the first window."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 8.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.75, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task2_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", window_start: "2026-08-12T05:00:00Z", window_end: "2026-08-12T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win1_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", window_start: "2026-08-13T05:00:00Z", window_end: "2026-08-13T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win2_id: $.data.id }
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win1_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_after_t1: $.data.version }
            - call: "POST /plan-tasks/${task2_id}/schedule"
              payload: { maintenance_window_id: "${win2_id}", expected_plan_version: "${plan_v_after_t1}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T04:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
          trigger:
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "FROST", delay_minutes: 45, expected_clear_at: "2026-08-12T06:00:00Z", expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { frost_id: $.data.id }
          assert:
            - "before the trigger AgronomicPlan.${plan_id}.committed_nitrogen_lb == 7.91 and status == ACTIVE"
            - "link 1: WeatherEvent.${frost_id}.status == ACTIVE, declared_at == 2026-08-12T04:00:00Z, deferred_window_count == 1"
            - "link 1: Course.${course_id}.play_posture == FROST_DELAY and frost_delay_minutes == 45"
            - "link 2: MaintenanceWindow.${win1_id}.status == DEFERRED, deferral_count == 1, plan_task_id still ${task1_id}"
            - "link 3: PlanTask.${task1_id}.status == PLANNED"
            - "link 4: AgronomicPlan.${plan_id}.committed_nitrogen_lb == 3.23 and status is still ACTIVE"
            - "link 4: TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 0.850 and nitrogen_applied_lb_per_1000_ytd == 0.000"
            - "the non-intersecting window is untouched: MaintenanceWindow.${win2_id}.status == SCHEDULED, deferral_count == 0, PlanTask.${task2_id}.status == SCHEDULED"

