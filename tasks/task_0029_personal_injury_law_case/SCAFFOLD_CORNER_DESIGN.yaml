      - name: stub_demand_prereq_validation
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / demand_letter_requires_active_case_and_reviewed_records
          rationale: "ERR_DEMAND_PREREQUISITES_NOT_MET path is asserted by the named §1.8 instance."

      - name: stub_disputed_lien_blocks_settlement
