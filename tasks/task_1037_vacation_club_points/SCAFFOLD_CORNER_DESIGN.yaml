# =============================================================================
# task_1037 — Vacation-Club & Points Travel
# SCAFFOLD_CORNER_DESIGN.yaml (§1.9 Coverage Index for non-difficulty tests)
# Breadth probe: walks references/claim-extraction-guide against §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: corner_create_member_success_and_tier
        claim_type: Creation
        grounds: [entities.Member.fields.tier, calculations.member_tier]
        distinguishing_aspect: "POST /club/members with owned_points 7000 -> 201; tier computed GOLD; account_status ACTIVE; version 1; initial 2026 bucket created."
        test_recipe:
          setup: ["Empty DB, clock default 2026-07-01."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
          trigger:
            - { call: "POST /club/members", payload: { full_name: "Gold Owner", email: "go@x.com", owned_points: 7000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
          assert:
            - "HTTP status == 201"
            - "Member.${m}.tier == GOLD"
            - "Member.${m}.account_status == ACTIVE"
            - "Member.${m}.current_use_year == 2026"
            - "Member.${m}.version == 1"

      - name: corner_member_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /club/members/{unknown-uuid} -> ERR_MEMBER_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /club/members/00000000-0000-0000-0000-000000000000", payload: {}, as: ClubAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: corner_reservation_missing_required_field
        claim_type: Required Fields
        grounds: [endpoints, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /club/reservations with check_out <= check_in -> ERR_VALIDATION 422."
        test_recipe:
          setup: ["Member with bucket, resort, unit type."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "V", email: "v@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 2, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-14", check_out: "2026-08-10" }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: corner_points_bucket_available_computed
        claim_type: Computed Fields
        grounds: [calculations.bucket_available_points, entities.PointsBucket.fields.points_available]
        distinguishing_aspect: "Fresh bucket for owned 5000 reports points_available == 5000 (allotment, all counters 0)."
        test_recipe:
          setup: ["Member owned 5000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Bal", email: "bal@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
          trigger:
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
          assert:
            - "PointsBucket.${b}.annual_allotment == 5000"
            - "PointsBucket.${b}.points_available == 5000"
            - "PointsBucket.${b}.status == OPEN"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: corner_response_envelope_shape_on_get
        claim_type: Retrieval
        grounds: [response_envelope]
        distinguishing_aspect: "GET single member returns response_type 'object' with meta.api_request_id and data payload per §1.0 envelope."
        test_recipe:
          setup: ["One member."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Env", email: "env@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
          trigger:
            - { call: "GET /club/members/${m}", payload: {}, as: ClubAdmin }
          assert:
            - "response.response_type == 'object'"
            - "response.meta.api_request_id is present"
            - "response.data.id == ${m}"

      - name: corner_reservation_list_pagination
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "Member with 2 non-overlapping reservations; GET /club/reservations?member_id=&limit=1 -> total_count 2, has_more true, 1 item."
        test_recipe:
          setup: ["Member with two reservations Aug 10-14 and Sep 10-14 on a total_units 2 unit type."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Pg", email: "pg@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 2, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}" }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-09-10", check_out: "2026-09-14" }, as: Member, as_user_id: "${m}" }
          trigger:
            - { call: "GET /club/reservations", payload: { member_id: "${m}", limit: 1 }, as: ClubAdmin }
          assert:
            - "response.data length == 1"
            - "response total_count == 2 and has_more == true"

      - name: corner_fk_reverse_points_buckets_listing
        claim_type: Parent Relationships
        grounds: [entities.PointsBucket.fields.member_id]
        distinguishing_aspect: "GET /club/members/{id}/points-buckets returns the member's initial bucket (FK reverse-reachability for PointsBucket.member_id)."
        test_recipe:
          setup: ["Member owned 5000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Fk", email: "fk@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
          trigger:
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
          assert:
            - "response.data length == 1"
            - "PointsBucket.${b}.member_id == ${m} and use_year == 2026"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: corner_confirm_twice_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Reservation.HELD_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an already-CONFIRMED reservation -> ERR_INVALID_STATE 409 (source must be HELD)."
        test_recipe:
          setup: ["Member holds and confirms Aug 10-14."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Cf", email: "cf@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
            - { call: "POST /club/reservations/${res}/confirm", payload: {}, as: Member, as_user_id: "${m}" }
          trigger:
            - { call: "POST /club/reservations/${res}/confirm", payload: {}, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: corner_run_cycle_completes_reservation_and_uses_guest_cert
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.CONFIRMED_to_COMPLETED, state_machines.GuestCertificate.ISSUED_to_USED]
        distinguishing_aspect: "After check_out passes, run_billing_cycle sets reservation COMPLETED and its ISSUED guest certificate USED."
        test_recipe:
          setup: ["Member confirms Aug 10-14 and issues a guest cert; clock advanced to 2026-08-20."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Cm", email: "cm@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
            - { call: "POST /club/reservations/${res}/confirm", payload: {}, as: Member, as_user_id: "${m}" }
            - { call: "POST /club/reservations/${res}/guest-certificates", payload: { guest_name: "Guest G" }, as: Member, as_user_id: "${m}", captures: { gc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ClubAdmin }
          trigger:
            - { call: "POST /_ops/run_billing_cycle", payload: {}, as: ClubAdmin }
          assert:
            - "Reservation.${res}.status == COMPLETED"
            - "GuestCertificate.${gc}.status == USED"

      - name: corner_bank_on_closed_bucket
        claim_type: Precondition Enforcement
        grounds: [state_machines.PointsBucket.OPEN_to_CLOSED, "errors[ERR_BUCKET_CLOSED]"]
        distinguishing_aspect: "After the use-year rolls over and run_billing_cycle CLOSES the 2026 bucket, banking against it -> ERR_BUCKET_CLOSED 409."
        test_recipe:
          setup: ["Member owned 5000, 2026 bucket. Clock advanced to 2027-01-02 and run_billing_cycle closed the 2026 bucket."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Cl", email: "cl@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /_ops/run_billing_cycle", payload: {}, as: ClubAdmin }
          trigger:
            - { call: "POST /club/points-buckets/${b}/bank", payload: { points: 100 }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_BUCKET_CLOSED"

      - name: corner_accept_nonpending_transfer_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Transfer.PENDING_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a transfer already COMPLETED -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A->B transfer 500 accepted once (COMPLETED)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "at@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "POST /club/members", payload: { full_name: "B", email: "bt@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_b: "$.data.id" } }
            - { call: "POST /club/transfers", payload: { from_member_id: "${m_a}", to_member_id: "${m_b}", points: 500 }, as: Member, as_user_id: "${m_a}", captures: { tr: "$.data.id" } }
            - { call: "POST /club/transfers/${tr}/accept", payload: { outcome: "ACCEPT" }, as: Member, as_user_id: "${m_b}" }
          trigger:
            - { call: "POST /club/transfers/${tr}/accept", payload: { outcome: "ACCEPT" }, as: Member, as_user_id: "${m_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: corner_waitlist_cancel_success
        claim_type: Valid Transition
        grounds: [state_machines.Waitlist.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "POST /club/waitlist-entries/{id}/cancel on an ACTIVE entry -> CANCELLED."
        test_recipe:
          setup: ["Member has an ACTIVE waitlist entry (unit full)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Wl", email: "wl2@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/waitlist-entries", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { wl: "$.data.id" } }
          trigger:
            - { call: "POST /club/waitlist-entries/${wl}/cancel", payload: {}, as: Member, as_user_id: "${m}" }
          assert:
            - "Waitlist.${wl}.status == CANCELLED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: corner_guest_cert_fee_charged
        claim_type: Constants Applied
        grounds: [entities.GuestCertificate.fields.fee_points, calculations.bucket_available_points]
        distinguishing_aspect: "Issuing a guest certificate charges GUEST_CERT_FEE_POINTS (50) to the paying bucket; cert fee_points == 50."
        test_recipe:
          setup: ["Member holds Aug 10-14 (cost 1000); bucket points_used 1000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Gc", email: "gc@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations/${res}/guest-certificates", payload: { guest_name: "Guest" }, as: Member, as_user_id: "${m}", captures: { gc: "$.data.id" } }
          assert:
            - "GuestCertificate.${gc}.fee_points == 50 and status == ISSUED"
            - "PointsBucket.${b}.points_used == 1050"
            - "PointsBucket.${b}.points_available == 3950"

      - name: corner_late_bank_half_credit
        claim_type: Correct Result
        grounds: [calculations.banking_transfer_value]
        distinguishing_aspect: "Banking 1000 after the deadline (clock 2026-11-01 > 2026-10-01) credits floor(1000*0.5)=500 to the next-year bucket (LATE variant)."
        test_recipe:
          setup: ["Member owned 5000. Clock set to 2026-11-01 (past bank deadline 2026-10-01)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Lb", email: "lb@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b26: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ClubAdmin }
          trigger:
            - { call: "POST /club/points-buckets/${b26}/bank", payload: { points: 1000 }, as: Member, as_user_id: "${m}" }
          assert:
            - "PointsBucket.${b26}.banked_out == 1000 and points_available == 4000"
            - "The 2027 bucket has banked_in == 500 (LATE half credit)"

      - name: corner_transfer_complete_moves_points
        claim_type: Correct Result
        grounds: [state_machines.Transfer.PENDING_to_COMPLETED, entities.PointsBucket.fields.transferred_in]
        distinguishing_aspect: "A->B accept of a 500-point transfer: sender bucket available 4500 (transferred_out 500), receiver 5500 (transferred_in 500)."
        test_recipe:
          setup: ["Members A and B owned 5000; A initiated a 500 transfer to B (PENDING)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "atc@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/members", payload: { full_name: "B", email: "btc@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_b: "$.data.id" } }
            - { call: "GET /club/members/${m_b}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_b: "$.data[0].id" } }
            - { call: "POST /club/transfers", payload: { from_member_id: "${m_a}", to_member_id: "${m_b}", points: 500 }, as: Member, as_user_id: "${m_a}", captures: { tr: "$.data.id" } }
          trigger:
            - { call: "POST /club/transfers/${tr}/accept", payload: { outcome: "ACCEPT" }, as: Member, as_user_id: "${m_b}" }
          assert:
            - "Transfer.${tr}.status == COMPLETED"
            - "PointsBucket.${b_a}.points_available == 4500 and transferred_out == 500"
            - "PointsBucket.${b_b}.points_available == 5500 and transferred_in == 500"

      - name: corner_insufficient_points_on_reservation
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "ACTIVE member, free capacity, but cost 1000 > available 200 -> ERR_INSUFFICIENT_POINTS 422 (fiscal check reached because state/temporal/constraint all pass)."
        test_recipe:
          setup: ["Member owned 200; unit type total_units 2 (capacity free)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Ip", email: "ip@x.com", owned_points: 200 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 2, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INSUFFICIENT_POINTS"

      - name: corner_bank_cap_exceeded
        claim_type: Violation to Error
        grounds: [calculations.banking_borrowing_caps, "errors[ERR_BANK_CAP_EXCEEDED]"]
