    side_effects:
      - "Placement ACTIVE -> TERMINATED_NO_REMEDY and stamps separation_date"
      - "Candidate.availability_status PLACED -> COOLING_OFF with cooling_off_until = clock date + COOLING_OFF_DAYS"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_DATE_FORMAT, ERR_PLACEMENT_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_PLACEMENT_NOT_ACTIVE, ERR_INVALID_SEPARATION_DATE]

