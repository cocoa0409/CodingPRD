        captures:
          mew_acc_lic: $.data.id
      trigger:
      - call: POST /treatment-network/facilities/${mew_fac}/facility-ops/run
        payload: {}
        as: PlatformAdmin
      assert:
      - Facility.${mew_fac}.ops_epoch == 1 and last_ops_run_at == 2026-09-01T00:00:00Z
      - Facility.${mew_fac}.compliance_risk_points == 45 and facility_posture == RESTRICTED in the SAME
