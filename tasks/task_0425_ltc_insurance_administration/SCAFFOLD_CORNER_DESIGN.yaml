# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Long-Term Care Insurance Administration — breadth probe over §1.1–§1.7.
# Section/claim_type values come from references/claim-extraction-guide.md.
# Every setup_api_calls chain is a §1.5 reachability audit.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_policy_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Policy, endpoints]
        distinguishing_aspect: "POST /policies with all required fields -> 201; response.data carries product_mode, daily_benefit_max_cents, coverage_status=APPLIED, premium_status=PENDING, version=1."
        test_recipe:
          setup: ["A registered policyholder."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Cre Ate", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 90 }
              as: Underwriter
              captures: { pol_id: $.data.id, cov: $.data.coverage_status, prem: $.data.premium_status, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Policy.${pol_id}.coverage_status == APPLIED"
            - "Policy.${pol_id}.premium_status == PENDING"
            - "Policy.${pol_id}.version == 1"

      - name: get_policy_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Policy, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /policies/{nonexistent-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_policy_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Policy.fields.product_mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /policies omitting required product_mode -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered policyholder."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Miss Field", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 90 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_policy_invalid_enum_inflation_rider_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Policy.fields.inflation_rider, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /policies with inflation_rider not in {NONE,COMPOUND_3PCT,COMPOUND_5PCT} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered policyholder."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Bad Enum", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "COMPOUND_7PCT", elimination_period_days: 90 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_policy_defaults_is_partnership_false
        claim_type: Defaults
        grounds: [entities.Policy.fields.is_partnership_policy]
        distinguishing_aspect: "Omitting is_partnership_policy defaults to false; no PartnershipDisregard is created (GET partnership-disregard returns empty)."
        test_recipe:
          setup: ["A registered policyholder."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Def Ault", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 90 }
              as: Underwriter
              captures: { pol_id: $.data.id, part: $.data.is_partnership_policy }
          trigger:
            - call: "GET /policies/${pol_id}/partnership-disregard"
              payload: {}
              as: Underwriter
          assert:
            - "Policy.${pol_id}.is_partnership_policy == false"
            - "GET /policies/${pol_id}/partnership-disregard returns an empty array (total_count == 0)"

      - name: system_fields_minted_on_create_input_ignored
        claim_type: System Fields
        grounds: [entities.Policy.fields.coverage_status]
        distinguishing_aspect: "Client-supplied coverage_status/version/id on POST /policies are ignored; server mints id, sets coverage_status=APPLIED, version=1."
        test_recipe:
          setup: ["A registered policyholder."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Sys Fld", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "INDEMNITY", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id, cov: $.data.coverage_status, ver: $.data.version }
          assert:
            - "Policy.${pol_id}.coverage_status == APPLIED"
            - "Policy.${pol_id}.version == 1"

      - name: list_policies_paginated_envelope
        claim_type: Listing
        grounds: [entities.Policy, endpoints]
        distinguishing_aspect: "GET /policies returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two policies for one holder."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Lis Ter", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "INDEMNITY", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
          trigger:
            - call: "GET /policies"
              payload: { policyholder_id: "${ph_id}" }
              as: Underwriter
          assert:
            - "response_type == array"
            - "meta total_count == 2 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: issue_already_in_force_policy_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Policy.APPLIED_to_IN_FORCE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /policies/{id}/issue on an already IN_FORCE policy -> ERR_INVALID_STATE (409); coverage_status unchanged."
        test_recipe:
          setup: ["An IN_FORCE policy."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Dbl Issue", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: rescind_in_force_policy_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Policy.APPLIED_to_RESCINDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /policies/{id}/rescind is only valid from APPLIED; on an IN_FORCE policy -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An IN_FORCE policy."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Resc Ind", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/rescind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: initial_state_provider_pending
        claim_type: Initial State
        grounds: [state_machines.Provider, entities.Provider.fields.eligibility_status]
        distinguishing_aspect: "A newly created Provider starts in eligibility_status == PENDING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { name: "Init Prov", provider_type: "HOME_HEALTH_AGENCY", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id, st: $.data.eligibility_status }
          assert:
            - "Provider.${prov_id}.eligibility_status == PENDING"

      - name: certify_provider_inactive_license_returns_license_inactive
        claim_type: Precondition Enforcement
        grounds: [state_machines.Provider.PENDING_to_ELIGIBLE, "errors[ERR_PROVIDER_LICENSE_INACTIVE]"]
        distinguishing_aspect: "POST /providers/{id}/certify on a provider with license_active=false -> ERR_PROVIDER_LICENSE_INACTIVE (409)."
        test_recipe:
          setup: ["A PENDING provider with license_active=false."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { name: "No Lic", provider_type: "NURSING_HOME", state_code: "CA", license_active: false }
              as: CareAssessor
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_PROVIDER_LICENSE_INACTIVE"

      - name: terminal_claim_void_cannot_resume
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VOID claim (after provider suspend cascade) cannot be moved by resume-review -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A claim VOIDed by a provider suspend cascade."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Term Lock", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "TL NH", provider_type: "NURSING_HOME", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-04-06" }
              as: Underwriter
              captures: { inv0: $.data.id }
            - call: "POST /premium-invoices/${inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: ["BATHING", "DRESSING"], cognitive_impairment: false }
              as: CareAssessor
            - call: "POST /care-plans"
              payload: { policy_id: "${pol_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { cp_id: $.data.id }
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: CareAssessor
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { pol_v: $.data.version }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", care_plan_id: "${cp_id}", service_month: "2026-03", expected_policy_version: "${pol_v}" }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /providers/${prov_id}/suspend"
              payload: {}
              as: CareAssessor
          trigger:
            - call: "POST /claims/${claim_id}/resume-review"
              payload: {}
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: rate_filing_reject_branch_no_invoice_recompute
        claim_type: Side Effect Execution
        grounds: [state_machines.RateIncreaseFiling.FILED_to_REJECTED, calculations.premium_amount]
        distinguishing_aspect: "Adjudicate with granted_pct=0 -> REJECTED; approved_increase_pct stays 0 and an OPEN invoice at effective_period_index keeps its base amount (no recompute)."
        test_recipe:
          setup: ["An IN_FORCE policy with a FILED rate filing and an OPEN invoice at period 1."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Rej Ect", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 1, base_premium_cents: 12000, due_date: "2026-02-28", grace_deadline: "2026-05-04" }
              as: Underwriter
              captures: { inv1: $.data.id }
            - call: "POST /rate-filings"
              payload: { policy_id: "${pol_id}", requested_increase_pct: 40, effective_period_index: 1 }
              as: Underwriter
              captures: { fil_id: $.data.id }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Regulator
              captures: { pol_v: $.data.version }
          trigger:
            - call: "POST /rate-filings/${fil_id}/adjudicate"
              payload: { granted_pct: 0, expected_policy_version: "${pol_v}" }
              as: Regulator
              captures: { st: $.data.status, appr: $.data.approved_increase_pct }
            - call: "GET /premium-invoices/${inv1}"
              payload: {}
              as: Underwriter
              captures: { amt: $.data.amount_cents }
          assert:
            - "RateIncreaseFiling.${fil_id}.status == REJECTED"
            - "RateIncreaseFiling.${fil_id}.approved_increase_pct == 0"
            - "PremiumInvoice.${inv1}.amount_cents == 12000"

      - name: care_plan_activate_supersedes_prior_active
        claim_type: Side Effect Execution
        grounds: [state_machines.CarePlan.DRAFT_to_ACTIVE, state_machines.CarePlan.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Activating a second DRAFT plan for the same policy transitions the prior ACTIVE plan to SUPERSEDED."
        test_recipe:
          setup: ["A policy with one ACTIVE care plan and a second DRAFT plan, both on the same ELIGIBLE provider."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Sup Erse", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "SE NH", provider_type: "NURSING_HOME", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /care-plans"
              payload: { policy_id: "${pol_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { cp1: $.data.id }
            - call: "POST /care-plans/${cp1}/activate"
              payload: {}
              as: CareAssessor
            - call: "POST /care-plans"
              payload: { policy_id: "${pol_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { cp2: $.data.id }
          trigger:
            - call: "POST /care-plans/${cp2}/activate"
              payload: {}
              as: CareAssessor
            - call: "GET /care-plans/${cp1}"
              payload: {}
              as: CareAssessor
              captures: { cp1_st: $.data.status }
          assert:
            - "CarePlan.${cp2}.status == ACTIVE"
            - "CarePlan.${cp1}.status == SUPERSEDED"

      - name: activate_care_plan_setting_type_mismatch_returns_mismatch
        claim_type: Precondition Enforcement
        grounds: [state_machines.CarePlan.DRAFT_to_ACTIVE, "errors[ERR_CARE_SETTING_MISMATCH]"]
        distinguishing_aspect: "Activating a care plan whose care_setting=NURSING_HOME references a HOME_HEALTH_AGENCY provider -> ERR_CARE_SETTING_MISMATCH (422)."
        test_recipe:
          setup: ["A DRAFT care plan with care_setting NURSING_HOME on an ELIGIBLE HOME_HEALTH_AGENCY provider."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Mis Match", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "HHA", provider_type: "HOME_HEALTH_AGENCY", state_code: "CA" }
              as: CareAssessor
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/certify"
              payload: {}
              as: CareAssessor
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /care-plans"
              payload: { policy_id: "${pol_id}", provider_id: "${prov_id}", care_setting: "NURSING_HOME" }
              as: CareAssessor
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: CareAssessor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_CARE_SETTING_MISMATCH"

      - name: pool_exhausted_on_approve_when_empty_pool
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_POOL_EXHAUSTED]"]
        distinguishing_aspect: "Approving a second claim after the pool is already 0 -> ERR_POOL_EXHAUSTED (409); but with auto-EXHAUST the second claim is VOID, so the rejection is by state precondition. This corner targets a fresh UNDER_REVIEW claim against an exhausted pool reached differently — excluded as redundant."
        excluded_because:
          difficulty_instance: boundary_precision_check / pool_exhaustion_at_exactly_zero_auto_exhaust
          rationale: "Pool-at-zero behavior and the EXHAUSTED auto-transition are asserted by the named §1.8 boundary instance; ERR_POOL_EXHAUSTED on the empty-pool approve path is the same claim."

  # ===========================================================================
  - section: calculations
    instances:
      - name: cognitive_impairment_alone_certifies_with_zero_adls
        claim_type: Correct Result
        grounds: [calculations.benefit_trigger_decision, entities.BenefitTriggerCertification.fields.decision]
        distinguishing_aspect: "A certification with empty adl_deficiencies but cognitive_impairment=true -> decision CERTIFIED (cognitive path independent of the 2-of-6 ADL count)."
        test_recipe:
          setup: ["An IN_FORCE policy."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Cog Nit", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol_id}/trigger-certifications"
              payload: { adl_deficiencies: [], cognitive_impairment: true }
              as: CareAssessor
              captures: { cert_id: $.data.id, dec: $.data.decision }
          assert:
            - "BenefitTriggerCertification.${cert_id}.decision == CERTIFIED"

      - name: elimination_period_self_pay_days_zero_benefit
        claim_type: Correct Result
