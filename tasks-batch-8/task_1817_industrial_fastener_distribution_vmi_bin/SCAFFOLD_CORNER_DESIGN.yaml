      - name: obsolescence_cascade_retires_agreements_and_deactivates_xrefs
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Part.ACTIVE_to_OBSOLETE"
        distinguishing_aspect: "Cascade down: obsoleting a part with no blocking orders/kits and NO active substitute retires its non-terminal BinAgreements; separately, any cross-reference pointing TO the obsoleted part is deactivated while references FROM it stay active for substitution."
        test_recipe:
          setup:
            - "Site S; parts PA (no outgoing substitutes), PB, PC; agreement A1 on PA; agreement A2 on PB; cross-reference PC->PA (PA is someone else's substitute); no open orders"
          setup_api_calls:
