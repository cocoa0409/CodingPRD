          setup: ["Default policy ACTIVE; eligible referrer; OPEN IC requisition (no campaign)"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
