  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_term_overlap_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TERM_OVERLAP]"
        excluded_because:
          difficulty_instance: term_closed_interval_overlap_with_adjacency_allowed
