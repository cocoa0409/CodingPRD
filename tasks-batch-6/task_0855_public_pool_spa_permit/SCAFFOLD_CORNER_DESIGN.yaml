              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-001", staff_name: "Ana Ruiz", role_type: "LIFEGUARD", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-02T08:00:00Z", shift_end_at: "2026-05-02T12:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { sa1_id: $.data.id }
          trigger:
            - call: "POST /staff-assignments"
