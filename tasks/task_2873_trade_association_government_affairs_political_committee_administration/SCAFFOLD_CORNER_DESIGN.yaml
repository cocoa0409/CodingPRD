      - name: revoking_a_prior_approval_that_was_never_granted_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=8].error_id
          - state_machines.PriorApproval[GRANTED -> REVOKED].preconditions
        distinguishing_aspect: "Revocation is declared only from GRANTED: a REQUESTED approval cannot be short-circuited to REVOKED, so the answer is 409 ERR_INVALID_PRIOR_APPROVAL_STATE and the row stays available to be granted later."
        test_recipe:
          setup:
            - "One ACTIVE member holding a single REQUESTED approval for 2026-01-01..2026-12-31 that has never been granted."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 5, effective_date: "2026-01-01", expires_at_date: "2026-12-31" }
