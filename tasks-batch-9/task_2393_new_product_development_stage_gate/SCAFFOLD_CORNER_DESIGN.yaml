      - name: calc_screening_weights_keyed_on_project_type
        claim_type: constant_table_lookup
        grounds:
          - calculations.screening_score.SCREENING_WEIGHTS
        excluded_because:
          difficulty_instance: combinatorial_formula / screening_weight_vector_with_capped_margin_norm
          rationale: "That instance asserts 78.00, 79.00 and 77.00 from identical inputs plus the margin_norm clamp at 100."

      - name: calc_per_line_rounding_precedes_summation
        claim_type: rounding
        grounds:
          - calculations.forecast_volume_and_revenue
        excluded_because:
          difficulty_instance: combinatorial_formula / forecast_per_line_rounding_before_summation
          rationale: "That instance pins 821248 against the 821247 of sum-then-round and 2781915.07 against 2781915.06."

      - name: calc_trade_tier_keys_on_gross_not_net
        claim_type: input_selection
        grounds:
          - calculations.business_case_financials.step_1
        excluded_because:
          difficulty_instance: combinatorial_formula / trade_rate_keyed_on_gross_before_net_derivation
          rationale: "That instance holds gross at exactly 5000000.00 and shows the 15.00 tier rather than the 12.00 a net-keyed lookup would pick."

      - name: calc_variant_mode_selects_the_volume_basis
        claim_type: variant_selection
        grounds:
          - calculations.forecast_volume_and_revenue.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / business_case_volume_variant_divergence
          rationale: "That instance runs byte-identical line sets through both modes and asserts 500000 against 821248 units."

      - name: calc_attainment_basis_selects_the_stored_reading
        claim_type: variant_selection
        grounds:
          - calculations.post_launch_attainment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / post_launch_attainment_basis_divergence
          rationale: "That instance asserts 78.32 against 67.88 on the same stored row and the decision flip that follows."

      - name: calc_completeness_of_an_empty_checklist
        claim_type: zero_denominator
        grounds:
          - calculations.deliverable_completeness_pct.EMPTY_CHECKLIST_RESULT
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_required_checklist_is_vacuously_complete
          rationale: "That instance asserts 100.00 from the constant with a deliverable list of total_count 0 and contrasts it with the naive 0.00."

      - name: calc_pilot_yield_floor_is_inclusive
        claim_type: threshold_boundary
        grounds:
          - calculations.gate_readiness_index
          - state_machines.Formulation.DRAFT_to_PILOT_PASSED
        excluded_because:
          difficulty_instance: boundary_precision_check / pilot_yield_at_floor_versus_one_hundredth_below
          rationale: "That instance separates 85.00 from 84.99 out of 10000 planned units and asserts the two formulation outcomes."

      - name: calc_screening_pass_floor_is_inclusive
        claim_type: threshold_boundary
        grounds:
          - calculations.screening_score.SCREENING_PASS_FLOOR
        excluded_because:
          difficulty_instance: boundary_precision_check / screening_score_at_pass_floor_versus_one_hundredth_below
          rationale: "That instance separates 60.00 from 59.99 with a single 0.01 step in target_gross_margin_pct."

  # --------------------------------------------------------- Validations ----
  - section: validations
    instances:
      - name: val_invalid_enum_beats_unknown_body_fk_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 4].ERR_INVALID_REQUEST
          - validations[priority 5].body_foreign_keys
        distinguishing_aspect: |
          Body shape is judged before body references: a request carrying both a misspelled
          deliverable_type and a gate_id that resolves to nothing answers 400 ERR_INVALID_REQUEST,
          and only after the enum is corrected does the unresolved reference surface as a 404.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One SNACK project in dev_status IDEA and no stage gate at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-p45"
              captures: { p45_p_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${p45_p_id}/deliverables"
              payload: { gate_id: "11111111-1111-4111-8111-111111111111", deliverable_type: "MANUFACTURING_READYNESS", owner_function: "OPERATIONS" }
              as: GateChair
            - call: "POST /innovation-projects/${p45_p_id}/deliverables"
              payload: { gate_id: "11111111-1111-4111-8111-111111111111", deliverable_type: "PILOT_SCALE_UP_REPORT", owner_function: "OPERATIONS" }
              as: GateChair
          assert:
            - "the first call returns 400 with error_id ERR_INVALID_REQUEST"
            - "the first call does not return 404 ERR_STAGE_GATE_NOT_FOUND even though the gate_id resolves to nothing"
            - "the second call, identical but for a legal enum value, returns 404 with error_id ERR_STAGE_GATE_NOT_FOUND"
            - "GET /deliverables?project_id=${p45_p_id} returns total_count 0, so neither refusal stored a row"
            - "InnovationProject.${p45_p_id}.version is unchanged by both refusals"

      - name: val_unknown_path_id_beats_invalid_body_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority 3].path_existence
          - validations[priority 4].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          A write aimed at a project that does not exist is answered 404 before its body is
          examined, so a body missing every required field still yields ERR_PROJECT_NOT_FOUND
          rather than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One real SNACK project exists so that the 404 cannot be blamed on an empty table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-p34"
              captures: { p34_p_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/22222222-2222-4222-8222-222222222222/deliverables"
              payload: { owner_function: "BAKING" }
              as: GateChair
            - call: "POST /innovation-projects/22222222-2222-4222-8222-222222222222/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 0, purchase_intent_top2_pct: 700.00, uniqueness_pct: -5.00, fielded_at: "not-a-date" }
              as: InnovationLead
          assert:
            - "both calls return 404 with error_id ERR_PROJECT_NOT_FOUND"
            - "neither call returns 400 ERR_INVALID_REQUEST although both bodies are unusable"
            - "GET /innovation-projects returns total_count 1, containing only ${p34_p_id}"

      - name: val_unknown_body_fk_beats_killed_project_state_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority 5].body_foreign_keys
          - validations[priority 6].ERR_PROJECT_INVALID_STATE
        distinguishing_aspect: |
          On a project already KILLED by screening, an unresolvable gate_id is reported as a 404
          rather than the 409 the terminal project state would otherwise produce, and the same call
          with a real gate_id proves the 409 was waiting behind it.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One SNACK gate 2 with an empty checklist."
            - "One LINE_EXTENSION project screened at 59.99 and therefore KILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { p56_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Thins", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 6, consumer_need_score: 6, target_gross_margin_pct: 23.99, category_attractiveness_score: 6, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-p56"
              captures: { p56_p_id: $.data.id }
            - call: "POST /innovation-projects/${p56_p_id}/screen"
              payload: { screening_notes: "Margin too thin to carry the slot." }
              as: GateChair
              as_user_id: "chair-p56"
          trigger:
            - call: "POST /innovation-projects/${p56_p_id}/deliverables"
              payload: { gate_id: "33333333-3333-4333-8333-333333333333", deliverable_type: "PILOT_SCALE_UP_REPORT", owner_function: "OPERATIONS" }
              as: GateChair
            - call: "POST /innovation-projects/${p56_p_id}/deliverables"
              payload: { gate_id: "${p56_g2_id}", deliverable_type: "PILOT_SCALE_UP_REPORT", owner_function: "OPERATIONS" }
              as: GateChair
          assert:
            - "InnovationProject.${p56_p_id}.screening_score == 59.99 with screening_decision REJECTED and dev_status KILLED"
            - "the first call returns 404 with error_id ERR_STAGE_GATE_NOT_FOUND"
            - "the second call returns 409 with error_id ERR_PROJECT_INVALID_STATE, so the state refusal was the next rule in line"
            - "GET /deliverables?project_id=${p56_p_id} returns total_count 0"

      - name: val_owner_disqualification_beats_duplicate_function_vote_returns_403
        claim_type: priority_ordering
        grounds:
          - validations[priority 8].ERR_OWNER_CANNOT_VOTE
          - validations[priority 9].ERR_DUPLICATE_FUNCTION_VOTE
        distinguishing_aspect: |
          The project owner voting on a function that is already spoken for is refused for who he
          is, not for what he duplicates: 403 ERR_OWNER_CANNOT_VOTE, while a bystander making the
          identical call gets 409 ERR_DUPLICATE_FUNCTION_VOTE.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist, quorum 2 and no veto functions."
            - "A project owned by user lead-sod, screened and holding an IN_SESSION gate review with one MARKETING vote already cast."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 2, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
