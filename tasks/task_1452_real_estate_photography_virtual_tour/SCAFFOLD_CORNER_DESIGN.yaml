            - "ShootBooking.${b25}.shoot_duration_minutes == 60 and scheduled_end_utc == 2026-08-10T15:00:00Z"
            - "ShootBooking.${b26}.shoot_duration_minutes == 70 and scheduled_end_utc == 2026-08-10T15:10:00Z"

      - name: volume_discount_floor_49999_vs_50000
        claim_type: boundary_edge
        grounds:
          - calculations.provisional_quote.constants.VOLUME_DISCOUNT_FLOOR_CENTS
          - calculations.provisional_quote.constants.VOLUME_DISCOUNT_BPS
        distinguishing_aspect: "Add-on total of exactly 50000 cents qualifies for the 10% add-on discount (>= floor); 49999 cents does not. Using DRONE_VIDEO(35000)+RUSH_EDIT(15000)=50000 vs DRONE_VIDEO+RUSH_EDIT in a 9999-multiplier market to land one cent under the floor is fragile — instead pin the boundary with two markets: mult=10000 (addons 50000 -> discount 5000) and a second booking with only DRONE_VIDEO+0 = 35000 (no discount). Plus one exact-floor booking with VIRTUAL_STAGING+RUSH_EDIT+DRONE_VIDEO = 10000+15000+35000 = 60000 -> discount 6000."
        test_recipe:
          setup: ["Market DEN mult 10000; drone-certified photographer; agent A; three bookings: K1 with DRONE_VIDEO+RUSH_EDIT (=50000 exactly), K2 with DRONE_VIDEO only (35000), K3 with DRONE_VIDEO+RUSH_EDIT+VIRTUAL_STAGING (60000)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
