  # ===========================================================================
  # Entity topology and consistency model
  # ===========================================================================
  - section: entity_topology
    instances:
      - name: site_creation_requires_a_resolvable_host
        claim_type: parent_relationships
        grounds:
          - entities.HostParkingSite.fields.host_id
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints./api/hosts/{hostId}/parking-sites
        distinguishing_aspect: "The site is a flat child keyed by host_id, so an unresolvable parent is refused at priority 3 and no orphan site row can exist."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; one host but no sites"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Orphan Farm", category: "FARM", address_line1: "56 Orphan Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_or2: $.data.id }
          trigger:
            - call: "POST /api/hosts/3f1a2b4c-0000-4000-8000-000000000020/parking-sites"
              payload: { site_label: "Z1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
              captures: { err_parent: $.data.error_id }
            - call: "POST /api/hosts/${h_or2}/parking-sites"
              payload: { site_label: "Z1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
              captures: { site_ok: $.data.id, site_host: $.data.host_id }
            - call: "GET /api/hosts/${h_or2}/parking-sites"
              payload: { limit: 10, offset: 0 }
              as: HostOperator
              captures: { site_first: "$.data[0].id", site_count: "$.data[0].site_label" }
          assert:
            - "the site declaration against an unknown host returns error_id \"ERR_RESOURCE_NOT_FOUND\" with http 404"
            - "the site created under the real host carries host_id == ${h_or2}"
            - "GET /api/hosts/${h_or2}/parking-sites returns exactly one entry, HostParkingSite.${site_ok}, so the refused call created no orphan"
            - "the same label under a second host would be accepted, so the parent relationship is the only scoping constraint"

      - name: stay_request_references_span_four_peer_entities
        claim_type: many_to_many
        grounds:
          - entities.StayRequest.fields.vehicle_id
          - entities.StayRequest.fields.confirmed_site_id
