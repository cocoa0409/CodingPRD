              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "DRAIN_CERTIFICATION", effective_on: "2026-05-01", drain_cover_model: "AquaSafe VGB-12", sva_system_type: "MULTIPLE_MAIN_DRAINS" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "SIGNAGE", effective_on: "2026-05-01", signage_type: "DEPTH_MARKERS" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "SIGNAGE", effective_on: "2026-05-01", signage_type: "EMERGENCY_PHONE" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "SIGNAGE", effective_on: "2026-05-01", signage_type: "DIARRHEA_NOTICE" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-001", staff_name: "Ana Ruiz", role_type: "LIFEGUARD", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-01T00:00:00Z", shift_end_at: "2026-05-01T08:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { sa_id: $.data.id }
          assert:
            - "Before the shift is created, Facility.${fac_id}.operating_posture == RESTRICTED with posture_reason == LIFEGUARD_COVERAGE_MISSING"
            - "After the shift is created, Facility.${fac_id}.operating_posture == OPEN and posture_reason == NONE"
            - "Facility.${fac_id}.vgb_compliance_status == COMPLIANT"
            - "GET /facilities/${fac_id}/compliance-artifacts returns four rows, all ACTIVE"

      - name: operator_payment_reduces_the_fee_balance
        claim_type: Correct Result
        grounds: [calculations.operator_fee_balance, "endpoints.POST_/operators/{id}/payments", entities.FeeLedgerEntry.fields.entry_type]
        distinguishing_aspect: "A PAYMENT posts amount_cents as the negation of the request's amount_cents, so a 10000-cent payment against a 25000-cent plan-review fee leaves fee_balance_cents at exactly 15000."
        test_recipe:
          setup: ["An operator has filed one plan review, so a 25000-cent charge is outstanding."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /plan-reviews"
              payload: { facility_id: "${fac_id}", project_type: "EQUIPMENT_REPLACEMENT", drawing_reference: "DR-EQ-1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /operators/${op_id}/payments"
              payload: { amount_cents: 10000, reference_note: "Partial payment" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "FeeLedgerEntry.${pay_id}.entry_type == PAYMENT with amount_cents == -10000 and permit_id == null"
            - "Operator.${op_id}.fee_balance_cents == 15000"
            - "GET /fee-ledger-entries?operator_id=${op_id} returns two rows summing to 15000"

  - section: validations
    instances:

      - name: permit_term_overlap_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=35]", "errors[ERR_PERMIT_TERM_OVERLAP]"]
        distinguishing_aspect: "A second application whose term intersects a SUBMITTED permit's closed [term_start_date, term_end_date] interval is rejected with ERR_PERMIT_TERM_OVERLAP (409)."
        test_recipe:
          setup: ["A SUBMITTED annual permit covers 2026-05-01 to 2027-04-30."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /permits/${p1_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-06-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_PERMIT_TERM_OVERLAP"
            - "GET /permits?facility_id=${fac_id} returns exactly one row, ${p1_id}"

      - name: permit_filed_too_far_ahead_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=36]", "errors[ERR_RENEWAL_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "term_start_date 2026-08-01 is more than PERMIT_RENEWAL_WINDOW_DAYS (60) past the 2026-05-01 clock, so the application is rejected with ERR_RENEWAL_WINDOW_NOT_OPEN (409)."
        test_recipe:
          setup: ["A pool facility with no permits at all; the clock reads 2026-05-01T00:00:00Z, so the renewal window ends 2026-06-30."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-08-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RENEWAL_WINDOW_NOT_OPEN"
            - "GET /permits?facility_id=${fac_id} returns zero rows"

      - name: seasonal_permit_for_season_longer_than_the_cap_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=34]", "errors[ERR_SEASON_TERM_TOO_LONG]"]
        distinguishing_aspect: "A declared season of 2026-01-01 to 2026-12-31 is 365 inclusive days, beyond SEASONAL_PERMIT_MAX_TERM_DAYS (183), so the SEASONAL application is rejected with ERR_SEASON_TERM_TOO_LONG (422)."
        test_recipe:
          setup: ["A seasonal facility declares a full-year season."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Yearlong Swim Club", contact_email: "club@yearlong.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Club Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2, is_seasonal: true, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "SEASONAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_SEASON_TERM_TOO_LONG"
            - "GET /permits?facility_id=${fac_id} returns zero rows"

      - name: reinspection_without_prior_inspection_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=39]", "errors[ERR_INSPECTION_TYPE_REQUIRES_PRIOR]"]
        distinguishing_aspect: "inspection_type REINSPECTION with prior_inspection_id omitted is rejected with ERR_INSPECTION_TYPE_REQUIRES_PRIOR (422)."
        test_recipe:
          setup: ["A pool facility with no inspections."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "REINSPECTION", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_INSPECTION_TYPE_REQUIRES_PRIOR"
            - "GET /inspections?facility_id=${fac_id} returns zero rows"

      - name: reinspection_prior_belonging_to_another_facility_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_PRIOR_INSPECTION_MISMATCH]"]
        distinguishing_aspect: "prior_inspection_id resolves but points at a FINALIZED inspection of a different facility, which is ERR_PRIOR_INSPECTION_MISMATCH (409), not a 404."
        test_recipe:
          setup: ["One operator owns two pools; pool A has a FINALIZED ROUTINE inspection and pool B has none."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Twin Pools Trust", contact_email: "ops@twinpools.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "North Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_a_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "South Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_b_id: $.data.id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_a_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-01T09:00:00Z", scheduled_end_at: "2026-05-01T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_a_id: $.data.id }
            - call: "POST /inspections/${insp_a_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_a_id}/transition"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_a_id}/transition"
              payload: { action: "FINALIZE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_b_id}", inspection_type: "REINSPECTION", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z", prior_inspection_id: "${insp_a_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_PRIOR_INSPECTION_MISMATCH"
            - "GET /inspections?prior_inspection_id=${insp_a_id} returns zero rows"

      - name: compliance_artifact_with_wrong_type_fields_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=5]", "errors[ERR_ARTIFACT_FIELDS_MISMATCH]"]
        distinguishing_aspect: "A SIGNAGE artifact carrying drain_cover_model is a type-conditional field violation answered with ERR_ARTIFACT_FIELDS_MISMATCH (422), distinct from the generic ERR_VALIDATION."
        test_recipe:
          setup: ["A pool facility with no artifacts."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "SIGNAGE", effective_on: "2026-05-01", signage_type: "DEPTH_MARKERS", drain_cover_model: "AquaSafe VGB-12" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "DRAIN_CERTIFICATION", effective_on: "2026-05-01", drain_cover_model: "AquaSafe VGB-12" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id2: $.data.error_id }
          assert:
            - "Both calls return HTTP 422 with data.error_id == ERR_ARTIFACT_FIELDS_MISMATCH"
            - "The second call fails because sva_system_type is required for DRAIN_CERTIFICATION"
            - "GET /facilities/${fac_id}/compliance-artifacts returns zero rows"

      - name: staff_shift_with_expired_certification_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=32]", "errors[ERR_CERTIFICATION_EXPIRED]"]
        distinguishing_aspect: "certification_expires_on 2026-05-01 is before the shift's start date 2026-05-02, so the assignment is rejected with ERR_CERTIFICATION_EXPIRED (409); the comparison is inclusive, so an expiry equal to the shift date would pass."
        test_recipe:
          setup: ["A pool facility with an ISSUED permit so the posture gate is not CLOSED."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-009", staff_name: "Dev Patel", role_type: "LIFEGUARD", certification_expires_on: "2026-05-01", shift_start_at: "2026-05-02T08:00:00Z", shift_end_at: "2026-05-02T14:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_CERTIFICATION_EXPIRED"
            - "GET /facilities/${fac_id}/staff-assignments returns zero rows"

      - name: staff_shift_longer_than_the_maximum_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=31]", "errors[ERR_SHIFT_TOO_LONG]"]
        distinguishing_aspect: "A 780-minute shift exceeds MAX_SHIFT_MINUTES (720) and is rejected with ERR_SHIFT_TOO_LONG (422), a check that runs before the certification and overlap rules."
        test_recipe:
          setup: ["A pool facility with an ISSUED permit so the posture gate is not CLOSED."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-010", staff_name: "Sam Cole", role_type: "ATTENDANT", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-02T08:00:00Z", shift_end_at: "2026-05-02T21:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_SHIFT_TOO_LONG"
            - "GET /facilities/${fac_id}/staff-assignments returns zero rows"

      - name: two_staff_refs_may_hold_identical_shift_windows
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=33]", entities.StaffAssignment.fields.staff_ref]
        distinguishing_aspect: "The overlap rule is keyed on staff_ref, not on the facility, so LG-001 and LG-002 may both be scheduled 08:00-12:00 at the same pool."
        test_recipe:
          setup: ["A pool facility with an ISSUED permit already carries a SCHEDULED 08:00-12:00 shift for LG-001."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
