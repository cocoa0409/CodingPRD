    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["client_id?", "carrier_id?", "supersedes_contract_id?", "status?", "limit?", "offset?"]
    output: "RateContract[]"
    side_effects: []
  - method: POST
    path: "/fap/rate-contracts/{id}/activate"
    description: "DRAFT -> ACTIVE with OCC and supersede/re-rate cascade"
    roles: [FapAdmin]
    code: 200
    input: [expected_rate_contract_version]
    output: RateContract
    side_effects: ["increments RateContract.version by 1", "supersede + re-rate cascade per state machine"]
  - method: POST
    path: "/fap/rate-contracts/{id}/discard"
    description: "DRAFT -> DISCARDED"
    roles: [FapAdmin]
    code: 200
    input: []
    output: RateContract
    side_effects: []

  # --- ShipmentRecord ---
  - method: POST
    path: "/fap/clients/{id}/shipments"
    description: "Register a shipment fact"
    roles: [AuditAnalyst]
    code: 201
    input: [carrier_id, pro_number, ship_date, origin_country, dest_country, mode, actual_weight_kg, "accessorials_rendered?"]
