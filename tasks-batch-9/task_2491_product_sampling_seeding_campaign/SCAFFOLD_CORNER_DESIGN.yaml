            - "KitLine.${kl1_id}.units_reserved == 0 and units_available == 10"
            - "KitLine.${kl2_id}.units_reserved == 0 and units_available == 1"
            - "KitLine.${kl3_id}.units_reserved == 0 and units_available == 10"
