# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1214 — Internal Mobility & Succession Planning
# Breadth coverage of every testable claim in §1.1–§1.7 not covered by §1.8.
# Logical clock default: 2026-05-01T00:00:00Z. Names unique across BOTH design files.
# =============================================================================

scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: employee_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Employee.fields.employment_status, entities.Employee.fields.demographic_group]
        distinguishing_aspect: "Create with only required fields: demographic_group defaults to UNDISCLOSED, employment_status ACTIVE, is_high_potential false, active_hold_count 0, rating_history [], version 1, server-minted id/created_at present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/employees", payload: { employee_code: "E100", full_name: "Amy New", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { e: $.data.id } }
          assert:
            - "response 201; Employee.${e}.demographic_group == UNDISCLOSED (default applied)"
            - "Employee.${e}.employment_status == ACTIVE; is_high_potential == false; active_hold_count == 0; rating_history == []"
            - "id is a UUID; created_at == 2026-05-01T00:00:00Z (logical clock default); version == 1; updated_at == created_at"

      - name: employee_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", entities.Employee.fields.employee_code]
        distinguishing_aspect: "Omitting required employee_code yields ERR_INVALID_REQUEST (400) before any existence or state check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/employees", payload: { full_name: "No Code", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: employee_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.Employee.fields.performance_rating]
        distinguishing_aspect: "performance_rating 'GREAT' is not in {LOW, SOLID, STRONG, EXCEPTIONAL} -> ERR_INVALID_REQUEST; computed field is_high_potential supplied by the client is likewise rejected as an undeclared input field."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/employees", payload: { employee_code: "E101", full_name: "Bad Enum", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "GREAT" }, as: HRAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E102", full_name: "Computed Inject", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID", is_high_potential: true }, as: HRAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "both calls fail with ERR_INVALID_REQUEST (invalid enum member; undeclared computed field in input)"

      - name: employee_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that matches no employee yields ERR_NOT_FOUND (404) on GET by id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /talent/employees/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: employee_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, endpoints.GET_/talent/employees]
        distinguishing_aspect: "With 3 employees, limit=2 returns exactly 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false; every response carries meta.api_request_id and response_type."
        test_recipe:
          setup: ["three employees exist"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "P1", full_name: "Pa One", department: "ENG", job_level: 3, hire_date: "2022-01-10", performance_rating: "SOLID" }, as: HRAdmin }
            - { call: "POST /talent/employees", payload: { employee_code: "P2", full_name: "Pa Two", department: "ENG", job_level: 3, hire_date: "2022-01-10", performance_rating: "SOLID" }, as: HRAdmin }
            - { call: "POST /talent/employees", payload: { employee_code: "P3", full_name: "Pa Three", department: "ENG", job_level: 3, hire_date: "2022-01-10", performance_rating: "SOLID" }, as: HRAdmin }
          trigger:
            - { call: "GET /talent/employees", payload: { limit: 2 }, as: HRAdmin }
            - { call: "GET /talent/employees", payload: { limit: 2, offset: 2 }, as: HRAdmin }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true, response_type == array, meta.api_request_id present"
            - "page 2: data length == 1, has_more == false"

      - name: employee_manager_self_reference_reverse_reachable
        claim_type: parent_relationships
        grounds: [entities.Employee.fields.current_manager_id]
        distinguishing_aspect: "Employee.current_manager_id is a self-referential FK: filtering the employees collection by current_manager_id returns exactly that manager's reports."
        test_recipe:
          setup: ["manager M with two reports R1, R2 and one unrelated employee U"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "M100", full_name: "Mara Boss", department: "ENG", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { m: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "R100", full_name: "Rep One", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID", current_manager_id: "${m}" }, as: HRAdmin, captures: { r1: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "R101", full_name: "Rep Two", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID", current_manager_id: "${m}" }, as: HRAdmin, captures: { r2: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "U100", full_name: "Una Related", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID" }, as: HRAdmin }
          trigger:
            - { call: "GET /talent/employees", payload: { current_manager_id: "${m}" }, as: HRAdmin }
          assert:
            - "exactly 2 employees returned: ${r1} and ${r2}; the unrelated employee is excluded"

      - name: diversity_snapshot_immutable_no_version
        claim_type: immutability
        grounds: [entities.DiversitySnapshot.fields.diversity_index, entities.DiversitySnapshot.fields.scope_ref]
        distinguishing_aspect: "DiversitySnapshot has common_fields false: the response carries id and created_at but no version or updated_at, and no update endpoint exists — the record is an append-only measurement."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /talent/diversity-snapshots", payload: { scope_type: "DEPARTMENT", scope_ref: "NOWHERE" }, as: HRAdmin, captures: { snap: $.data.id } }
            - { call: "GET /talent/diversity-snapshots/${snap}", as: HRAdmin }
          assert:
            - "response contains id and created_at; contains no version and no updated_at keys"
            - "empty-population result: total_subjects == 0, underrepresented_count == 0, diversity_index == null"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: terminate_twice_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Employee.ACTIVE_to_TERMINATED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "The second terminate observes employment_status == TERMINATED and fails with ERR_ALREADY_TERMINAL; no cascade fires twice (no duplicate vacancy)."
        test_recipe:
          setup: ["one ACTIVE employee who is NOT an incumbent anywhere"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "T100", full_name: "Tom Twice", department: "ENG", job_level: 4, hire_date: "2023-06-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/employees/${e}/terminate", as: HRAdmin }
          trigger:
            - { call: "POST /talent/employees/${e}/terminate", as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL (409)"
            - "GET /talent/vacancies returns an empty list (no vacancy for a non-incumbent, and no duplicate cascade)"

      - name: successor_suspend_reinstate_roundtrip_bench_follows
        claim_type: valid_transition
        grounds: [state_machines.SuccessorEntry.ACTIVE_to_SUSPENDED, state_machines.SuccessorEntry.SUSPENDED_to_ACTIVE, calculations.bench_strength]
        distinguishing_aspect: "On a COVERAGE role with two ACTIVE READY_NOW entries (bench 40, ADEQUATE), suspending one drops coverage to 20 (THIN, posture_alert set); reinstating restores 40 (ADEQUATE, posture_alert cleared) — the DRAFT/SUSPENDED exclusion from the bench input set is exercised both ways."
        test_recipe:
          setup: ["COVERAGE role ACTIVE with two ACTIVE READY_NOW entries at positions 1 and 2"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB51", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC51", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S51A", full_name: "Sue A", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sa: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S51B", full_name: "Sue B", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sb: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "QA Manager", department: "ENG", criticality_tier: "TIER_2", assessment_method: "COVERAGE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sa}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ea: $.data.id } }
            - { call: "PATCH /talent/successors/${ea}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v3: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sb}", readiness_rating: "READY_NOW", slate_position: 2, expected_critical_role_version: "${r_v3}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { eb: $.data.id } }
            - { call: "PATCH /talent/successors/${eb}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "PATCH /talent/successors/${eb}", payload: { status: "SUSPENDED", suspension_reason: "PERFORMANCE_CONCERN" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { st1: $.data.status } }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bench_mid: $.data.bench_strength, alert_mid: $.data.posture_alert } }
            - { call: "PATCH /talent/successors/${eb}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { st2: $.data.status } }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bench_end: $.data.bench_strength, alert_end: $.data.posture_alert } }
          assert:
            - "after suspend: SuccessorEntry.${eb}.status == SUSPENDED with suspension_reason PERFORMANCE_CONCERN; bench_strength == 20, bench_posture == THIN, posture_alert == true"
            - "after reinstate: status == ACTIVE; bench_strength == 40, bench_posture == ADEQUATE, posture_alert == false (cleared on recovery)"

      - name: successor_suspend_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SuccessorEntry.ACTIVE_to_SUSPENDED, "errors[ERR_SUCCESSOR_INVALID_STATE]"]
        distinguishing_aspect: "Suspend is defined only from ACTIVE; a DRAFT entry rejects the transition with ERR_SUCCESSOR_INVALID_STATE."
        test_recipe:
          setup: ["PROPOSED role with one DRAFT entry"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB52", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S52", full_name: "Sue Draft", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Draft Role", department: "ENG", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_3_PLUS", slate_position: 1, expected_critical_role_version: "${r_v}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
          trigger:
            - { call: "PATCH /talent/successors/${es}", payload: { status: "SUSPENDED", suspension_reason: "ORG_CHANGE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUCCESSOR_INVALID_STATE; SuccessorEntry.${es}.status remains DRAFT"

      - name: successor_suspend_missing_reason_returns_invalid_request
        claim_type: precondition_enforcement
        grounds: [state_machines.SuccessorEntry.ACTIVE_to_SUSPENDED, "validations[priority=3]"]
        distinguishing_aspect: "The transition's suspension_reason precondition is enforced at request-shape level: omitting it while suspending yields ERR_INVALID_REQUEST before the state transition runs."
        test_recipe:
          setup: ["ACTIVE role with one ACTIVE entry"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB53", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC53", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S53", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 53", department: "ENG", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "PATCH /talent/successors/${es}", payload: { status: "SUSPENDED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; SuccessorEntry.${es}.status remains ACTIVE"

      - name: application_withdraw_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.PostingApplication, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing an already-WITHDRAWN application repeats the trigger against a terminal state and fails with ERR_APPLICATION_INVALID_STATE — the second call changes nothing."
        test_recipe:
          setup: ["one PENDING_MANAGER_CONSENT application of E55 (manager M55) on an OPEN posting"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB55", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC55", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR55", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E55", full_name: "Erin With", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 55", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Role 55", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e}", captures: { app: $.data.id } }
            - { call: "POST /talent/applications/${app}/withdraw", as: Employee, as_user_id: "${e}" }
          trigger:
            - { call: "POST /talent/applications/${app}/withdraw", as: Employee, as_user_id: "${e}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_INVALID_STATE; status remains WITHDRAWN"

      - name: session_finalize_with_unratified_entry_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.CalibrationSession.IN_PROGRESS_to_FINALIZED, "errors[ERR_UNRATIFIED_ENTRIES_REMAIN]"]
        distinguishing_aspect: "The compound gate ratified_count == entry_count blocks finalize while a PROPOSED entry exists; the session stays IN_PROGRESS."
        test_recipe:
          setup: ["IN_PROGRESS session with one PROPOSED entry"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM56", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR56", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E56", full_name: "Erin Subj", department: "ENG", job_level: 5, hire_date: "2023-02-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-56", department_scope: "ENG", scheduled_start: "2026-04-06T09:00:00Z", scheduled_end: "2026-04-06T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s}/entries", payload: { employee_id: "${e}", proposed_rating: "STRONG" }, as: Manager, as_user_id: "${mgr}" }
          trigger:
            - { call: "POST /talent/calibration-sessions/${s}/finalize", as: TalentManager, as_user_id: "${tm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNRATIFIED_ENTRIES_REMAIN; session remains IN_PROGRESS; employee rating unchanged (SOLID)"

      - name: session_finalize_empty_returns_session_empty
        claim_type: precondition_enforcement
        grounds: ["validations[priority=27]", "errors[ERR_SESSION_EMPTY]"]
        distinguishing_aspect: "entry_count == 0 is a distinct failure from unratified entries: ERR_SESSION_EMPTY fires first (priority 27 < 28)."
        test_recipe:
          setup: ["IN_PROGRESS session with no entries"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM57", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-57", department_scope: "HR", scheduled_start: "2026-04-06T09:00:00Z", scheduled_end: "2026-04-06T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s}/start", as: TalentManager, as_user_id: "${tm}" }
          trigger:
            - { call: "POST /talent/calibration-sessions/${s}/finalize", as: TalentManager, as_user_id: "${tm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SESSION_EMPTY; session remains IN_PROGRESS"

      - name: entry_challenge_from_ratified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CalibrationEntry.PROPOSED_to_CHALLENGED, "errors[ERR_ENTRY_INVALID_STATE]"]
        distinguishing_aspect: "Challenge is defined only from PROPOSED; a RATIFIED entry rejects it with ERR_ENTRY_INVALID_STATE."
        test_recipe:
          setup: ["IN_PROGRESS session with one RATIFIED entry"]
          setup_api_calls:
