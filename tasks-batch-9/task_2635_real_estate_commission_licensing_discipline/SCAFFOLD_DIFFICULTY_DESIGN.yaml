  - rule_id: non_linear_state_machine
    instances:
      - name: trust_audit_remediation_verify_cycle_re_arms_before_manual_escalation_unlocks
        grounds:
          - state_machines.TrustAudit.REMEDIATION_ORDERED_to_VERIFYING
          - state_machines.TrustAudit.VERIFYING_to_REMEDIATION_ORDERED
          - state_machines.TrustAudit.VERIFYING_to_CLOSED
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The audit is not a forward-only pipeline: a failed verification sends it backwards from
          VERIFYING to REMEDIATION_ORDERED with remediation_round incremented, and the manual ESCALATE
          door is locked until that loop has run at least once, so the same request body is a 409 at
          round 1 and would be legal at round 2. Only the verification that lands on shortage 0 exits
          the loop, and after CLOSED the loop cannot be re-entered.
        test_recipe:
          setup:
            - "Harbor Realty Group holds trust account TA with an OBLIGATION_OPENED of 1000000 cents and a single cleared DEPOSIT of 700000 cents, so shortage_cents == 300000"
            - "auditor auditor-01 has one BOOK audit scheduled for the 2026-08-01 window and has already opened fieldwork, persisting computed_shortage_cents == 300000"
            - "ISSUE_FINDINGS has cascaded the audit to REMEDIATION_ORDERED with remediation_round == 1 and the account to RESTRICTED"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 1000000, effective_date: "2026-08-01", transaction_reference: "OBL-1", expected_trust_account_version: "${ta_v0}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 700000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-1", expected_trust_account_version: "${ta_v1}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/trust-accounts/${ta_id}/audits"
              payload: { auditor_user_id: "auditor-01", basis: "BOOK", as_of_date: "2026-08-31", fieldwork_start_at: "2026-08-01T00:00:00Z", fieldwork_end_at: "2026-08-01T17:00:00Z" }
              as: TrustAuditor
              as_user_id: "auditor-01"
              captures: { au_id: $.data.id }
            - call: "POST /commission/trust-audits/${au_id}/fieldwork"
              payload: {}
              as: TrustAuditor
              as_user_id: "auditor-01"
            - call: "POST /commission/trust-audits/${au_id}/disposition"
              payload: { action: "ISSUE_FINDINGS", remediation_days: 3 }
              as: TrustAuditor
              as_user_id: "auditor-01"
          trigger:
            - call: "POST /commission/trust-audits/${au_id}/disposition"
              payload: { action: "ESCALATE", note: "too early" }
              as: TrustAuditor
              as_user_id: "auditor-01"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v2: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 100000, effective_date: "2026-08-02", cleared_date: "2026-08-02", transaction_reference: "DEP-2", expected_trust_account_version: "${ta_v2}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/trust-audits/${au_id}/disposition"
              payload: { action: "VERIFY_REMEDIATION", remediation_days: 3 }
              as: TrustAuditor
              as_user_id: "auditor-01"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v3: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 200000, effective_date: "2026-08-03", cleared_date: "2026-08-03", transaction_reference: "DEP-3", expected_trust_account_version: "${ta_v3}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/trust-audits/${au_id}/disposition"
              payload: { action: "VERIFY_REMEDIATION" }
              as: TrustAuditor
              as_user_id: "auditor-01"
            - call: "POST /commission/trust-audits/${au_id}/disposition"
              payload: { action: "VERIFY_REMEDIATION" }
              as: TrustAuditor
              as_user_id: "auditor-01"
          assert:
            - "the first ESCALATE returns 409 ERR_INVALID_STATE - remediation_round is 1 and the manual escalation guard demands >= 2 - and TrustAudit.${au_id}.status stays REMEDIATION_ORDERED"
            - "the first VERIFY_REMEDIATION returns 200 with TrustAudit.${au_id}.verified_shortage_cents == 200000, TrustAudit.${au_id}.status == REMEDIATION_ORDERED (the loop-back, not VERIFYING) and TrustAudit.${au_id}.remediation_round == 2"
            - "TrustAccount.${ta_id}.status is RESTRICTED for the whole loop and the two remediation DEPOSITs are still accepted while RESTRICTED"
            - "the second VERIFY_REMEDIATION returns 200 with TrustAudit.${au_id}.verified_shortage_cents == 0, TrustAudit.${au_id}.status == CLOSED and TrustAudit.${au_id}.remediation_round == 2 (unchanged by the successful exit)"
            - "TrustAccount.${ta_id}.status == OPEN and TrustAccount.${ta_id}.shortage_cents == 0 after the exit"
            - "Brokerage.${bkg_id}.supervision_posture == COMPLIANT and Brokerage.${bkg_id}.open_shortage_cents == 0 after the exit"
            - "the third VERIFY_REMEDIATION returns 409 ERR_INVALID_STATE - CLOSED is terminal and the cycle cannot be re-entered"
      - name: consent_offer_counter_cycle_dead_ends_at_round_three_with_withdraw_as_only_exit
        grounds:
          - state_machines.ConsentAgreement.OFFERED_to_COUNTERED
          - state_machines.ConsentAgreement.COUNTERED_to_OFFERED
          - state_machines.ConsentAgreement.COUNTERED_to_REJECTED
          - validations[priority=32]
          - errors.ERR_CONSENT_ROUND_LIMIT
        distinguishing_aspect: |
          The negotiation loops OFFERED -> COUNTERED -> OFFERED twice and the third counter leaves the
          agreement in COUNTERED with round_number == 3, a state whose only legal successor is WITHDRAW:
          the REVISE edge that worked twice now returns ERR_CONSENT_ROUND_LIMIT, and the terminal
          REJECTED sends the parent Complaint backwards from CONSENT_PENDING to PROBABLE_CAUSE, which
          re-opens the hearing route that was closed while the agreement was live.
        test_recipe:
          setup:
            - "salesperson Rae Field is ACTIVE and affiliated with Harbor Realty Group"
            - "complaint CMP against Rae Field alleging MISREPRESENTATION with alleged_loss_cents 500000 has been moved to INVESTIGATION and then PROBABLE_CAUSE (investigation-variant priority_score 45 >= 40)"
            - "counsel counsel-01 has offered consent round 1 (SUSPENSION, 200000 cents, 30 days), so the complaint is CONSENT_PENDING"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
