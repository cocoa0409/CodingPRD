# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Last-Mile Delivery Route Optimization
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_parcel_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Parcel]
        distinguishing_aspect: "POST /delivery/parcels with required fields -> 201; response carries tracking_code, status=RECEIVED, sorted_at_center_id=null, id, created_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-NEW", weight_kg: 3.5 }
              as: SortAssociate
              captures: { pid: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Parcel.${pid}.status == RECEIVED"
            - "Parcel.${pid}.service_level == GROUND"
            - "Parcel.${pid}.version == 1"

      - name: get_parcel_returns_stored
        claim_type: Retrieval
        grounds: [entities.Parcel]
        distinguishing_aspect: "GET /delivery/parcels/{id} returns the stored parcel with matching tracking_code."
        test_recipe:
          setup: ["one parcel exists"]
          setup_api_calls:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-GET", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /delivery/parcels/${pid}"
              payload: {}
              as: DispatchManager
              captures: { tc: $.data.tracking_code }
          assert:
            - "Parcel.${pid}.tracking_code == P-GET"

      - name: list_routes_paginated_envelope
        claim_type: Listing
        grounds: [entities.DeliveryRoute, endpoints]
        distinguishing_aspect: "GET /delivery/routes returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["no routes"]
          setup_api_calls: []
          trigger:
            - call: "GET /delivery/routes"
              payload: {}
              as: DispatchManager
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 0"
            - "response.meta.has_more == false"

      - name: get_parcel_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PARCEL_NOT_FOUND]"]
        distinguishing_aspect: "GET /delivery/parcels/{nonexistent} -> ERR_PARCEL_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /delivery/parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_PARCEL_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_parcel_missing_weight_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.Parcel.fields.weight_kg"]
        distinguishing_aspect: "POST /delivery/parcels without required weight_kg -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-NOW" }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: create_parcel_default_service_level_applied
        claim_type: Defaults
        grounds: [entities.Parcel.fields.service_level, entities.Parcel.fields.signature_required, entities.Parcel.fields.hazmat_class]
        distinguishing_aspect: "Omitting service_level/signature_required/hazmat_class applies GROUND/false/NONE defaults."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-DEF", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pid: $.data.id }
          assert:
            - "Parcel.${pid}.service_level == GROUND"
            - "Parcel.${pid}.signature_required == false"
            - "Parcel.${pid}.hazmat_class == NONE"

      - name: parcel_status_system_field_input_ignored
        claim_type: System Fields
        grounds: [entities.Parcel.fields.status]
        distinguishing_aspect: "status is system-sourced: a client-supplied status is ignored; created parcel is RECEIVED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-SYS", weight_kg: 1.0 }
              as: SortAssociate
              captures: { pid: $.data.id }
          assert:
            - "Parcel.${pid}.status == RECEIVED"

      - name: create_parcel_invalid_enum_service_level
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.Parcel.fields.service_level"]
        distinguishing_aspect: "service_level not in {GROUND,EXPRESS,PRIORITY} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-ENUM", weight_kg: 1.0, service_level: "OVERNIGHT" }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: create_stop_window_end_le_start_invalid
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.DeliveryStop.fields.window_end_min"]
        distinguishing_aspect: "window_end_min <= window_start_min -> ERR_INVALID_REQUEST on stop create."
        test_recipe:
          setup: ["route in PLANNING with a SORTED parcel"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC1", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dx", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-WIN", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-01", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 600, window_end_min: 600 }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_tracking_code_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_TRACKING_CODE]", "validations[priority=5]"]
        distinguishing_aspect: "Second parcel with the same tracking_code -> ERR_DUPLICATE_TRACKING_CODE (409)."
        test_recipe:
          setup: ["one parcel with tracking_code P-DUP exists"]
          setup_api_calls:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-DUP", weight_kg: 1.0 }
              as: SortAssociate
          trigger:
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-DUP", weight_kg: 2.0 }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_TRACKING_CODE"

      - name: delivery_attempt_immutable_no_version
        claim_type: Immutability
        grounds: [entities.DeliveryAttempt]
        distinguishing_aspect: "DeliveryAttempt is common_fields:false (append-only): it carries id+created_at, no version; there is no update endpoint."
        test_recipe:
          setup: ["dispatched route, OUT_FOR_DELIVERY stop"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC2", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Da", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-IM", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-02", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
          trigger:
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "NO_ONE_HOME" }
              as: Driver
              as_user_id: "${d1}"
              captures: { aid: $.data.id, ai: $.data.attempt_index }
          assert:
            - "DeliveryAttempt.attempt_index == 1"
            - "response.http_status == 201"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sort_parcel_not_received_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Parcel.transitions.RECEIVED_to_SORTED", "errors[ERR_PARCEL_NOT_RECEIVED]"]
        distinguishing_aspect: "Sorting an already-SORTED parcel again -> ERR_PARCEL_NOT_RECEIVED."
        test_recipe:
          setup: ["a parcel already SORTED at a center"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC3", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-RS", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
          trigger:
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_PARCEL_NOT_RECEIVED"

      - name: stop_create_parcel_not_sorted_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Parcel.transitions.SORTED_to_ROUTED", "errors[ERR_PARCEL_NOT_SORTED]"]
        distinguishing_aspect: "Creating a stop for a RECEIVED (unsorted) parcel -> ERR_PARCEL_NOT_SORTED."
        test_recipe:
          setup: ["a RECEIVED parcel (never sorted), a PLANNING route"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC4", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dy", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-NS", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-03", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_PARCEL_NOT_SORTED"

      - name: dispatch_empty_route_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DeliveryRoute.transitions.PLANNING_to_DISPATCHED", "errors[ERR_ROUTE_EMPTY]"]
        distinguishing_aspect: "Dispatching a route with zero non-CANCELLED stops -> ERR_ROUTE_EMPTY."
        test_recipe:
          setup: ["a PLANNING route with no stops; correct version"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC5", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "De", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-04", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
          trigger:
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_ROUTE_EMPTY"

      - name: complete_with_open_stops_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DeliveryRoute.transitions.DISPATCHED_to_COMPLETED", "errors[ERR_OPEN_STOPS_REMAIN]"]
        distinguishing_aspect: "Completing a DISPATCHED route while a stop is still OUT_FOR_DELIVERY -> ERR_OPEN_STOPS_REMAIN."
        test_recipe:
          setup: ["dispatched route with one OUT_FOR_DELIVERY stop"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC6", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Df", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-OP", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-05", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
          trigger:
            - call: "POST /delivery/routes/${r1}/complete"
              payload: {}
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_OPEN_STOPS_REMAIN"

      - name: complete_route_after_delivery_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.DeliveryRoute.transitions.DISPATCHED_to_COMPLETED]
        distinguishing_aspect: "After the only stop is DELIVERED, complete drives route DISPATCHED->COMPLETED."
        test_recipe:
          setup: ["dispatched route, single stop delivered"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC7", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dg", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-CMP", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-06", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "DELIVERED" }
              as: Driver
              as_user_id: "${d1}"
          trigger:
            - call: "POST /delivery/routes/${r1}/complete"
              payload: {}
              as: DispatchManager
              captures: { st: $.data.status }
          assert:
            - "DeliveryRoute.${r1}.status == COMPLETED"

      - name: cancel_completed_route_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.DeliveryRoute.transitions.PLANNING_to_CANCELLED", "errors[ERR_ROUTE_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) route -> ERR_ROUTE_NOT_CANCELLABLE; no transition out of terminal."
        test_recipe:
          setup: ["a COMPLETED route"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC8", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dh", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-TL", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-07", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
            - call: "POST /delivery/stops/${s1}/attempts"
              payload: { outcome: "DELIVERED" }
              as: Driver
              as_user_id: "${d1}"
            - call: "POST /delivery/routes/${r1}/complete"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /delivery/routes/${r1}/cancel"
              payload: {}
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_ROUTE_NOT_CANCELLABLE"

      - name: reschedule_non_attempted_stop_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.DeliveryStop.transitions.ATTEMPTED_to_REDELIVERY_SCHEDULED", "errors[ERR_STOP_NOT_ATTEMPTED]"]
        distinguishing_aspect: "Rescheduling an OUT_FOR_DELIVERY stop (never attempted) -> ERR_STOP_NOT_ATTEMPTED."
        test_recipe:
          setup: ["dispatched route, one OUT_FOR_DELIVERY stop"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC9", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Di", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-NA", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-08", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv: $.data.version }
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: DispatchManager
          trigger:
            - call: "POST /delivery/stops/${s1}/reschedule"
              payload: {}
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_STOP_NOT_ATTEMPTED"

      - name: attempt_on_pending_stop_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.DeliveryStop.transitions.OUT_FOR_DELIVERY_to_ATTEMPTED", "errors[ERR_STOP_NOT_OUT_FOR_DELIVERY]"]
        distinguishing_aspect: "Logging an attempt on a PENDING stop (route not yet dispatched) -> ERR_STOP_NOT_OUT_FOR_DELIVERY."
        test_recipe:
          setup: ["a PLANNING route with one PENDING stop"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC10", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Dj", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-PE", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-09", max_stops: 5 }
              as: DispatchManager
