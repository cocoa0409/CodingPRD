      - name: the_institutional_floor_table_plateaus_where_the_nih_table_still_rises
        claim_type: constants_applied
        grounds:
          - calculations.salary_floor_computation
          - constants.INSTITUTIONAL_MIN_BY_BAND
          - constants.NIH_SCALE_BY_BAND
        distinguishing_aspect: "Bands 3 and 4 of INSTITUTIONAL_MIN_BY_BAND are both 62000 while NIH_SCALE_BY_BAND rises from 64536 to 67284 across the same two bands. Two INSTITUTIONAL_MIN appointments with 36 and 48 prior months therefore land on the identical floor, while a NIH_SCALE appointment at 48 prior months lands on 67284.00 - so an implementation that shares one table, or that interpolates between bands, produces different numbers for at least one of the three."
