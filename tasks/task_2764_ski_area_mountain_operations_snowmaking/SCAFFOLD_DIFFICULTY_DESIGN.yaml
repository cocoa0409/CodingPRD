              payload: { terrain_area_id: "${area_id}", cat_route_code: "R1", sequence_index: 1, snowcat_unit_code: "CAT-1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T04:00:00Z", winch_required: false }
              as: GroomingLead
              captures: { task_a_id: $.data.id }
            - call: "POST /mountain-ops/grooming-tasks"
              payload: { terrain_area_id: "${area_id}", cat_route_code: "R2", sequence_index: 1, snowcat_unit_code: "CAT-1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T04:00:00Z", winch_required: false }
              as: GroomingLead
