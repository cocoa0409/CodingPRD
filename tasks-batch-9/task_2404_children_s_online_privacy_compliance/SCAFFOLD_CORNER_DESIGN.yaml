          assert:
            - "${pr_status} == SUBMITTED and ${err_from_submitted} == ERR_RIGHTS_REQUEST_NOT_VERIFIED with HTTP 409"
            - "${err_from_verifying} == ERR_RIGHTS_REQUEST_NOT_VERIFIED with HTTP 409 (the same dedicated code, not ERR_INVALID_STATE)"
            - "${err_missing_scope} == ERR_INVALID_REQUEST with HTTP 422 and the request is still VERIFIED"
            - "${fulfilled_status} == FULFILLED, ${scope_count} == 0, ${fulfilled_at} == 2026-08-01T00:00:00Z"
            - "${err_second_fulfilment} == ERR_INVALID_STATE with HTTP 409 (FULFILLED is terminal, so the code changes once the state is reached)"
            - "ConsentRequest.${consent_id}.status == REVOKED with revocation_reason DELETION_FULFILLED — LINK 4 fires on an empty record scope too"

      - name: assessment_year_uniqueness_is_scoped_to_service_and_program
        claim_type: violation_to_error
        grounds:
          - validations[priority=106]
          - errors[ERR_ASSESSMENT_YEAR_DUPLICATE]
        distinguishing_aspect: "The uniqueness key is the triple (service_id, program_id, assessment_year): re-using the same year is refused for the same service+program, yet the same year is accepted for a different program on the same service and for the same program on a different service, and a different year is accepted for the original pair."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two services and two regulator-approved programs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Year Key Kids A", operator_organization: "Year Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_a: $.data.id }
            - call: "POST /online-services"
              payload: { name: "Year Key Kids B", operator_organization: "Year Media", service_category: "EDUCATION_APP", subject_matter_code: "CHILD_EDUCATION" }
              as: ComplianceOfficer
              captures: { svc_b: $.data.id }
            - call: "POST /safe-harbor-programs"
