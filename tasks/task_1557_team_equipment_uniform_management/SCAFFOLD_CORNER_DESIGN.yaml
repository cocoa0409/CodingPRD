            - "InventoryPool.${jp}.stock_on_hand remains 4 and status ACTIVE"

      - name: lock_kit_blocked_until_prior_laundry_ready
        claim_type: violation_to_error
        grounds:
          - "calculations.laundry_turnaround"
          - "errors[ERR_LAUNDRY_NOT_READY]"
          - "state_machines.GameEvent.SCHEDULED_to_KIT_LOCKED"
        distinguishing_aspect: "Cross-event turnaround gate: EV2 cannot lock its kit while EV1's laundry is mid-cycle; advancing EV1's laundry to READY unblocks EV2 and restocks the pool."
        test_recipe:
          setup: ["pool stock 3 point 0; EV1 (Sep 5) completed with a load of 1 -> laundry COLLECTING; EV2 (Sep 12) scheduled"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 3, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { ev1: $.data.id } }
            - { call: "POST /game-events/${ev1}/lock-kit", payload: {}, as: EquipmentManager }
            - { call: "POST /game-events/${ev1}/complete", payload: { laundry_load: [{ pool_id: "${jp}", quantity: 1 }] }, as: EquipmentManager }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "B", kickoff_at: "2026-09-12T15:00:00Z", designated_kit: "AWAY" }, as: EquipmentManager, captures: { ev2: $.data.id } }
          trigger:
            - { call: "POST /game-events/${ev2}/lock-kit", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /game-events/${ev1}/laundry-advance", payload: {}, as: LaundryVendor }
            - { call: "POST /game-events/${ev1}/laundry-advance", payload: {}, as: LaundryVendor }
            - { call: "POST /game-events/${ev2}/lock-kit", payload: {}, as: EquipmentManager }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          assert:
            - "first lock rejected with error_id == ERR_LAUNDRY_NOT_READY (http 409)"
            - "after two advances GameEvent.${ev1}.laundry_status == READY"
            - "second lock succeeds: GameEvent.${ev2}.status == KIT_LOCKED"
            - "InventoryPool.${jp}.stock_on_hand == 3 and in_laundry_quantity == 0 (READY restocked the load)"

      - name: checklist_incomplete_blocks_event_complete
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CHECKLIST_INCOMPLETE]"
          - "state_machines.GameEvent.KIT_LOCKED_to_COMPLETED"
        distinguishing_aspect: "A required checklist item still PENDING blocks completion; after marking it DONE the event completes, and an empty laundry_load leaves laundry_status NOT_STARTED."
        test_recipe:
          setup: ["event with one required checklist item, kit locked"]
          setup_api_calls:
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME", checklist: [{ item_ref: "BENCH", label: "Bench set up", required: true }] }, as: EquipmentManager, captures: { ev: $.data.id } }
            - { call: "POST /game-events/${ev}/lock-kit", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /game-events/${ev}/complete", payload: { laundry_load: [] }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /game-events/${ev}/checklist/BENCH/complete", payload: { outcome: "DONE" }, as: EquipmentManager }
            - { call: "POST /game-events/${ev}/complete", payload: { laundry_load: [] }, as: EquipmentManager }
          assert:
            - "first complete rejected with error_id == ERR_CHECKLIST_INCOMPLETE (http 409)"
            - "second complete succeeds: GameEvent.${ev}.status == COMPLETED"
            - "GameEvent.${ev}.laundry_status == NOT_STARTED and laundry_due_at == null (empty load)"

      - name: player_release_blocked_by_issued_kit_rejected
        claim_type: violation_to_error
