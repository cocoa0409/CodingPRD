        distinguishing_aspect: "Priority 13 checks the suppression flag first, so an EMAIL action for a fully revoked supporter returns ERR_SUPPORTER_SUPPRESSED (422) rather than ERR_CONSENT_MISSING - the two codes are distinguished by whether any channel remains GRANTED."
