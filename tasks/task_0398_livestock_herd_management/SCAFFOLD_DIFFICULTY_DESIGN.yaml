              as: HerdManager
              captures: { ao1_v1: $.data.version }
            - call: "POST /movement-records/${mvo1}/apply"
              payload: { expected_animal_version: "${ao1_v1}" }
              as: HerdManager
            - call: "POST /movement-records"
