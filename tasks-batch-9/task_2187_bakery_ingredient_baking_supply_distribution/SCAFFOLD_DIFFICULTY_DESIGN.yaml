              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-HRW-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "HRW_WHEAT", list_price_cents_per_lb: 42, min_rotation_days: 30 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { flour_id: $.data.id }
            - call: "POST /bakery-distribution/index-quotes"
              payload: { index_code: "HRW_WHEAT", effective_on: "2026-08-01T00:00:00Z", price_cents_per_lb: 38 }
              as: PricingController
              as_user_id: "pc-1"
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU-01", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_glu_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
