              captures: { batch_b: "$.data.id" }
            - call: "POST /v1/census-batches/${batch_b}/participants"
              payload:
                participants:
                  - { external_ref: "R1", date_of_birth: "1965-01-30", status: "RETIREE", current_annual_benefit: 100000 }
                  - { external_ref: "R2", date_of_birth: "1965-05-01", status: "RETIREE", current_annual_benefit: 0 }
                  - { external_ref: "R3", date_of_birth: "1965-09-09", status: "RETIREE", current_annual_benefit: 0 }
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_b}/submit-screening"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_b}/lock"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_b}/assumption-sets"
              payload: { plan_year: 2028, label: "base", mortality_table: "TEST_TABLE_4AGE", funding_discount_rate: 0.05, disclosure_discount_rate: 0.04, retirement_age: 62 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { aset_b: "$.data.id" }
            - call: "POST /v1/assumption-sets/${aset_b}/submit"
              payload: {}
