              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { collection_after: $.data.collection_status }
          assert:
            - "before the second certification Venue.${v_id}.data_posture == RESTRICTED with certified_installation_count == 1 and uncertified_installation_count == 1"
            - "${err_posture} == ERR_VENUE_NOT_CERTIFIED with HTTP 409"
            - "Game.${g_id}.collection_status == SCHEDULED after the rejected call"
            - "after certifying RIG-B Venue.${v_id}.data_posture == CERTIFIED with certified_installation_count == 2 and uncertified_installation_count == 0"
            - "${collection_after} == LIVE and Game.${g_id}.data_quality_flag == CLEAN"

      - name: feed_session_requires_active_rights_window
        grounds:
          - validations[priority=48]
