        test_recipe:
          setup: ["A QUOTED policy with one RING; the owning Policyholder id known."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
