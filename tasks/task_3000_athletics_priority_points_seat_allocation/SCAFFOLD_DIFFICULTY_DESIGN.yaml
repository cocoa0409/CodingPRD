              payload: { seat_id: "${seat_b3_id}", expected_seat_version: "${seat_b3_v}" }
              as: Donor
              as_user_id: "${blake_id}"
              captures: { sa_market_id: "$.data.id" }
          assert:
            - "SeatAssignment.${sa_renewal_id}.pricing_mode == RENEWAL"
            - "SeatAssignment.${sa_renewal_id}.first_occupied_cycle_year == 2020"
            - "SeatAssignment.${sa_renewal_id}.grandfathered_requirement_cents == 250000"
            - "SeatAssignment.${sa_renewal_id}.requirement_cents == 298513"
            - "SeatAssignment.${sa_renewal_id}.handling_fee_cents == 0"
            - "SeatAssignment.${sa_renewal_id}.total_due_cents == 298513"
            - "SeatAssignment.${sa_market_id}.pricing_mode == MARKET"
            - "SeatAssignment.${sa_market_id}.first_occupied_cycle_year == 2026"
            - "SeatAssignment.${sa_market_id}.requirement_cents == 400000"
            - "SeatAssignment.${sa_market_id}.total_due_cents == 400000"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_point_score_tiered_loyalty_nonlinear
        grounds:
          - calculations.priority_point_score
          - entities.Donor.fields.consecutive_giving_years
          - entities.Donor.fields.season_ticket_seasons_purchased
          - entities.Donor.fields.alumni_status
        distinguishing_aspect: |
          Mode (a) — a single output composed from six interacting inputs. Two
          donors with the identical 15,000,000-cent cumulative total score
          310.25 and 242.50: the marginal tier bands contribute the same 237.50,
          then the loyalty multiplier, streak points, tenure points and the
          status-gated alumni bonus stack non-linearly on top of the rounded S1
          rather than on the raw band products.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor A is FACULTY_STAFF with five RECEIVED ATHLETICS_ANNUAL gifts of 3,000,000 cents, one in each of 2022, 2023, 2024, 2025 and 2026, plus three season-ticket renewals."
            - "Donor B is NON_ALUMNUS with one RECEIVED ATHLETICS_ANNUAL gift of 15,000,000 cents in 2026 and no renewals."
            - "A DRAFT PointRecalculation for cycle 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Avery Streak", email: "avery.streak@example.com", alumni_status: "FACULTY_STAFF", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /athletics/donors/${a_id}/gifts"
              payload: { gift_date: "2022-03-01T00:00:00.000Z", amount_cents: 3000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/gifts"
              payload: { gift_date: "2023-03-01T00:00:00.000Z", amount_cents: 3000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/gifts"
              payload: { gift_date: "2024-03-01T00:00:00.000Z", amount_cents: 3000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/gifts"
              payload: { gift_date: "2025-03-01T00:00:00.000Z", amount_cents: 3000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 3000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/season-ticket-renewals"
              payload: { cycle_year: 2024 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/season-ticket-renewals"
              payload: { cycle_year: 2025 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${a_id}/season-ticket-renewals"
              payload: { cycle_year: 2026 }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Bailey Lumpsum", email: "bailey.lumpsum@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { b_id: "$.data.id" }
            - call: "POST /athletics/donors/${b_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 15000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-recalculations/${r_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "Donor.${a_id}.cumulative_giving_cents == 15000000"
            - "Donor.${a_id}.consecutive_giving_years == 5"
            - "Donor.${a_id}.season_ticket_seasons_purchased == 3"
            - "Donor.${a_id}.certified_base_points == 310.25"
            - "Donor.${a_id}.certified_points == 310.25"
            - "Donor.${b_id}.cumulative_giving_cents == 15000000"
            - "Donor.${b_id}.consecutive_giving_years == 1"
            - "Donor.${b_id}.certified_base_points == 242.50"
            - "Donor.${b_id}.certified_points == 242.50"
            - "PointLedgerEntry with donor_id ${a_id}, entry_type CUMULATIVE_GIVING and variant CERTIFIED has points == 261.25"
            - "PointLedgerEntry with donor_id ${b_id}, entry_type CUMULATIVE_GIVING and variant CERTIFIED has points == 237.50"
            - "PointLedgerEntry with donor_id ${a_id}, entry_type SEASON_TICKET_TENURE and variant CERTIFIED has points == 9.00"

      - name: reseating_invoice_rounds_per_seat_before_sum
        grounds:
          - calculations.reseating_invoice_total
          - state_machines.Section.REPRICED_to_RESEATING
          - entities.Section.fields.reseating_invoice_total_cents
          - entities.Section.fields.reseated_donor_count
        distinguishing_aspect: |
          Mode (b) — the same three inputs summed in the opposite order give a
          different answer. Three seats at 250,000 cents prorated by 7/12 give
          145,833.33 each; rounding per seat before summing yields 437,499 while
          summing the raw shares and rounding once yields 437,500, so the
          off-by-one cent is the signature of the wrong order.
        test_recipe:
          setup:
            - "Section SEC-C with seat_capacity 3, per_seat_requirement_cents 250,000, required_points_per_seat 0 and three seats C/1, C/2 and C/3."
            - "A CERTIFIED PointRecalculation for cycle 2026 with an OPEN SEASON_TICKET event over 2026-09-01 to 2026-09-10 and slot_minutes 2880."
            - "Three zero-point donors each hold exactly one seat in SEC-C in occupancy HELD, picked in slot order."
            - "The section has already passed SURVEY and REPRICE with post_renovation_capacity 3 and post_renovation_requirement_cents 250,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
