  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_order_state_beats_suspended_owner_fiscal
        grounds:
          - validations[priority=55]
          - validations[priority=80]
          - errors[ERR_ORDER_NOT_SCHEDULABLE]
          - errors[ERR_OWNER_STANDING_SUSPENDED]
          - calculations.owner_arrears_and_standing
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the schedule request violates both the
          state precondition at priority 55 and the standing gate at priority 80, and the response
          must be 409 ERR_ORDER_NOT_SCHEDULABLE, never 402 ERR_OWNER_STANDING_SUSPENDED.
        test_recipe:
          setup:
            - "District T-HIGH with travel_surcharge_cents 25000, so a lot-free completed order assesses exactly 25000."
            - "Owner A has one completed order assessed 25000 with fee_due_on 2026-08-31T00:00:00Z."
            - "Clock advanced to 2026-09-01T00:00:00Z and a sweep run, so that order is DELINQUENT, posted_arrears_cents is 25000 and standing is SUSPENDED."
            - "A second order for owner A has been created and then cancelled, so its schedule_status is CANCELLED."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Powder River Cattle", mailing_state: "MT", contact_email: "powder@example.test" }
              as: BoardAdmin
