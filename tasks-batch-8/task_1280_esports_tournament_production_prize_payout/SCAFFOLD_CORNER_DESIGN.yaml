          trigger:
            - { call: "POST /api/talent-bookings/${b1}/transition", payload: { action: SETTLE }, as: BroadcastProducer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_BOOKING_STATUS; TalentBooking.${b1}.status == TENTATIVE and fee_final_cents == null"

      - name: activate_proposed_deal_returns_invalid_deal_status
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_DEAL_STATUS]", "state_machines.SponsorDeal"]
        distinguishing_aspect: "ACTIVATE is valid only from CONTRACTED: the owning SponsorManager activating a PROPOSED deal passes ownership (priority 3) but fails the state check (priority 6) with ERR_INVALID_DEAL_STATUS."
        test_recipe:
          setup: ["tournament exists; deal sd PROPOSED with contact_user_id sm-1"]
