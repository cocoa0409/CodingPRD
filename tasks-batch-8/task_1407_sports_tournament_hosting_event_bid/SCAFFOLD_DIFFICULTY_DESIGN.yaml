          assert:
            - "response error_id == ERR_BLOCK_NOT_CONTRACTED (state priority 6.6)"
            - "error_id != ERR_BLOCK_INVENTORY_EXCEEDED (business_fiscal priority 11 loses)"
            - "no RoomBooking created: GET /api/v1/hotel-blocks/${hb_id}/room-bookings returns empty data"

      - name: assignment_cert_vs_window_priority_rejected
        grounds:
          - validations[priority=7.1]
          - validations[priority=9.1]
          - errors[ERR_CERTIFICATION_INSUFFICIENT]
