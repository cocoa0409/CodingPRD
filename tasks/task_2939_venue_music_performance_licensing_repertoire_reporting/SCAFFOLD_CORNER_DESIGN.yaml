            - "License.${lic_p1_id}.rate_schedule_id == ${sched_ch_id}, the CONCERT_HALL schedule, never the BAR_GRILL one"
            - "The BLANKET license of Venue ${v1_id} also has reporting_required == true, because its MIXED profile qualifies"

      - name: corner_license_type_bgm_exempt_zeroes_the_whole_fee
        claim_type: correct_result
        grounds:
          - calculations.license_type_assignment.formula
          - calculations.annual_license_fee.formula
          - entities.Venue.fields.bgm_exemption_status
        distinguishing_aspect: "An EXEMPT venue short-circuits both variants of the fee formula to 0, so the provisional fee, the verified fee and the INITIAL assessment are all 0 while coverage still becomes ACTIVE."
        test_recipe:
          setup:
            - "Society BMI has an EFFECTIVE FITNESS_STUDIO schedule"
            - "Venue V5 is a BACKGROUND_ONLY FITNESS_STUDIO whose analysis already returned EXEMPT"
          setup_api_calls:
            - call: "POST /licensing/societies"
              payload: { society_code: "BMI", display_name: "Broadcast Music Inc", repertoire_share_bp: 4600 }
              as: LicensingAdmin
              captures: { bmi_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules"
              payload: { society_id: "${bmi_id}", venue_category: "FITNESS_STUDIO", effective_from: "2026-01-01T00:00:00Z" }
              as: LicensingAdmin
              captures: { sched_id: "$.data.id" }
            - call: "POST /licensing/rate-schedules/${sched_id}/publish"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues"
              payload: { legal_name: "Pulse Fitness Studio", venue_category: "FITNESS_STUDIO", seating_capacity: 0, standing_capacity: 40, occupancy_limit: 45, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0, gross_square_feet: 1800, speaker_count: 6, max_speakers_per_room: 4, has_cover_charge: false, retransmission_only: true }
              as: LicensingAdmin
              captures: { v5_id: "$.data.id" }
            - call: "POST /licensing/venues/${v5_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
              captures: { v5_exempt: "$.data.bgm_exemption_status", v5_v1: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v5_id}", society_id: "${bmi_id}", requested_license_type: "BGM_EXEMPT", declared_seating: 0, declared_standing: 40, declared_cover_revenue_cents: 0, declared_live_nights: 0, declared_music_use_profile: "BACKGROUND_ONLY", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v5_v1}" }
              as: VenueOperator
              as_user_id: "${v5_id}"
              captures: { app5_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app5_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v5_id}"
            - call: "POST /licensing/license-applications/${app5_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app5_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
              captures: { app5_assigned: "$.data.assigned_license_type", app5_prov: "$.data.provisional_annual_fee_cents" }
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app5_id}" }
              as: LicensingAdmin
              captures: { lic5_id: "$.data[0].id" }
          trigger:
            - call: "POST /licensing/licenses/${lic5_id}/activate"
              payload: {}
              as: LicensingAdmin
          assert:
            - "The captured ${v5_exempt} was EXEMPT, ${app5_assigned} was BGM_EXEMPT and ${app5_prov} was 0"
            - "License.${lic5_id}: license_type == BGM_EXEMPT, annual_fee_cents == 0, provisional_annual_fee_cents == 0, verified_fee_delta_cents == 0, reporting_required == false"
            - "The unclamped arithmetic would have produced 1476 and the floor would have produced 30000; the short circuit overrides both, and the min_annual_fee_cents floor is not applied to an exempt licence"
            - "No FeeAssessment was issued: GET /licensing/fee-assessments?license_id=${lic5_id} returns total_count == 0, Venue.${v5_id}.lifetime_assessed_cents == 0 and outstanding_balance_cents == 0, and License.${lic5_id}.billing_status is still UNBILLED"
            - "Coverage still moved: coverage_status == ACTIVE, covered_share_bp == 4600, coverage_posture == PARTIALLY_COVERED and an ANNUAL_TERM window exists"

      - name: corner_annual_fee_variant_divergence_declared_versus_verified
