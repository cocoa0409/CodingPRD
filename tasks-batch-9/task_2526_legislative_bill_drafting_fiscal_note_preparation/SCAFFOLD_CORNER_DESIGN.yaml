# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe
#
# Task: 2526. Legislative Bill Drafting & Fiscal Note Preparation
# Companion files: SCAFFOLD.yaml (§1.0–§1.7), SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
#
# Generated by walking references/claim-extraction-guide.md row-by-row against
# this scaffold's §1.1–§1.7 surface. The guide's nine sections are the `section:`
# values; its per-section rows are the `claim_type:` values. Where a §1.8
# difficulty instance already asserts the corner, an `excluded_because:` stub is
# emitted instead of a duplicate recipe.
#
# Shared timeline conventions (identical to §1.8 so fixtures are reusable):
#   logical clock default              2026-08-01T00:00:00Z
#   canonical clock at setup start     2026-09-01T00:00:00Z
#   session introduction_deadline_utc  2026-10-15T00:00:00Z
#   session committee_report_deadline  2026-11-01T00:00:00Z
#   session sine_die_utc               2026-11-20T18:00:00Z
#   session required_fiscal_years      [2027, 2028]
#   session fiscal_note_default_days   21
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: session_creation_returns_every_declared_field_with_system_defaults_seeded
        claim_type: Creation
        grounds:
          - entities.Session
          - endpoints.POST_sessions
          - response_envelope.success
        distinguishing_aspect: "POST /sessions with all seven required inputs returns 201 and a Session whose computed and system fields are seeded exactly: status PENDING, next_house_bill_number 1, next_senate_bill_number 1, certified_fiscal_total_cents 0, fiscal_posture NORMAL, bills_introduced_count 0, bills_enrolled_count 0, convened_utc null, adjourned_utc null."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          assert:
            - "HTTP status == 201 and response_type == 'object'"
            - "Session.${s_id}.name == '2027 Regular Session' and required_fiscal_years == [2027, 2028]"
            - "Session.${s_id}.status == PENDING and convened_utc == null and adjourned_utc == null"
            - "Session.${s_id}.next_house_bill_number == 1 and next_senate_bill_number == 1"
            - "Session.${s_id}.certified_fiscal_total_cents == 0 and fiscal_posture == NORMAL"
            - "Session.${s_id}.bills_introduced_count == 0 and bills_enrolled_count == 0"
            - "Session.${s_id}.version == 1 and created_at and updated_at are present"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: session_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Session
          - endpoints.GET_sessions_id
        distinguishing_aspect: "GET /sessions/{id} immediately after creation returns byte-identical field values to the POST response, including fiscal_note_default_days 21 and required_fiscal_years [2027, 2028]."
        test_recipe:
          setup:
            - "One PENDING session created at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: Clerk
          assert:
            - "HTTP status == 200 and response_type == 'object'"
            - "Session.${s_id}.status == PENDING and fiscal_note_default_days == 21"
            - "Session.${s_id}.sine_die_utc == 2026-11-20T18:00:00Z"
            - "Session.${s_id}.version == 1 (a read never bumps the version)"

      - name: drafting_requests_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_drafting_requests
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three drafting requests in one session, GET /drafting-requests?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "CONVENED session with three drafting requests filed by the same member at clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 3 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Request one", summary: "First measure.", requested_sections_count: 1, target_code_chapter: "Title 1", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Request two", summary: "Second measure.", requested_sections_count: 1, target_code_chapter: "Title 2", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Request three", summary: "Third measure.", requested_sections_count: 1, target_code_chapter: "Title 3", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "GET /drafting-requests"
              payload: { session_id: "${s_id}", limit: 2, offset: 0 }
              as: Clerk
            - call: "GET /drafting-requests"
              payload: { session_id: "${s_id}", limit: 2, offset: 2 }
              as: Clerk
          assert:
            - "The FIRST call returns response_type == 'array' with exactly 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "The SECOND call returns exactly 1 row, offset == 2, total_count == 3, has_more == false"
            - "Rows are ordered created_at ASC, so 'Request one' precedes 'Request two' in the first page"

      - name: bill_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_bills_id
          - errors[ERR_BILL_NOT_FOUND]
          - validations.priority_40
        distinguishing_aspect: "GET /bills/{id} with an id that matches no row returns 404 ERR_BILL_NOT_FOUND in the error envelope, never an empty 200 object."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no Bill row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /bills/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response_type == 'error' and data.error_id == 'ERR_BILL_NOT_FOUND'"
            - "data.message is a non-empty string"

      - name: drafting_request_missing_required_target_code_chapter_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_drafting_requests
          - entities.DraftingRequest.fields.target_code_chapter
          - validations.priority_60.ERR_INVALID_REQUEST
        distinguishing_aspect: "target_code_chapter has source input with no default, so omitting it from POST /drafting-requests returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup:
            - "CONVENED session and one member with no drafting requests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Missing chapter", summary: "No target chapter supplied.", requested_sections_count: 2, confidentiality: "PUBLIC", priority_flag: false }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /drafting-requests filtered by session_id ${s_id} returns total_count == 0"
            - "Member.${m1_id}.priority_slots_used == 0"

      - name: member_and_agency_and_committee_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Member.fields.priority_slots_total
          - entities.Agency.fields.status
          - entities.Agency.fields.max_open_requests
          - entities.Committee.fields.is_fiscal_committee
          - entities.Committee.fields.max_concurrent_referrals
        distinguishing_aspect: "Omitting priority_slots_total yields 2; omitting status yields ACTIVE and max_open_requests yields 3; omitting is_fiscal_committee yields false and max_concurrent_referrals yields 2 — every §1.1 default is exercised in one pass."
        test_recipe:
          setup:
            - "One PENDING session (committees may be created before convening)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028] }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "Rep Default", chamber: "SENATE", party: "IND" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dept of Defaults", agency_code: "DOD" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /sessions/${s_id}/committees"
              payload: { chamber: "SENATE", name: "Senate Rules" }
              as: Clerk
              captures: { c_id: $.data.id }
          assert:
            - "Member.${m_id}.priority_slots_total == 2 and priority_slots_used == 0 and intake_hold == false"
            - "Agency.${ag_id}.status == ACTIVE and max_open_requests == 3 and responsiveness_score == 100"
            - "Agency.${ag_id}.open_request_count == 0 and late_submission_count == 0 and revision_count == 0"
            - "Committee.${c_id}.is_fiscal_committee == false and max_concurrent_referrals == 2 and active_referral_count == 0"
            - "Session.${s_id}.fiscal_note_default_days == 21 (the omitted session default)"
            - "Committee.${c_id}.session_id == ${s_id} (taken from the path, never the body)"

      - name: drafting_request_computed_intake_estimate_ignores_any_client_supplied_value_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.DraftingRequest.fields.intake_complexity_estimate
          - calculations.drafting_complexity_score
        distinguishing_aspect: "intake_complexity_estimate is source computed and is not in POST /drafting-requests' input list; a request declaring 6 sections, CONFIDENTIAL, priority true and appropriation 12000000 stores exactly 59 (24 + 12 + 8 + 15) regardless of anything the client sends."
        test_recipe:
          setup:
            - "CONVENED session; one member with priority_slots_total 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Confidential caucus measure", summary: "Sensitive drafting request.", requested_sections_count: 6, target_code_chapter: "Title 11", confidentiality: "CONFIDENTIAL", priority_flag: true, appropriation_requested_cents: 12000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id }
          assert:
            - "DraftingRequest.${dr_id}.intake_complexity_estimate == 59"
            - "DraftingRequest.${dr_id}.actual_complexity_score == null (no research has run yet)"
            - "DraftingRequest.${dr_id}.status == SUBMITTED and sla_due_utc == null"
            - "DraftingRequest.${dr_id}.member_id == ${m1_id} (taken from X-User-ID, not the body)"
            - "Member.${m1_id}.priority_slots_used == 1"

      - name: bill_system_fields_are_server_generated_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Bill.fields.bill_number
          - entities.Bill.fields.introduced_utc
          - entities.Bill.fields.sponsor_member_id
          - endpoints.POST_bills
        distinguishing_aspect: "POST /bills accepts only drafting_request_id, so id, created_at, updated_at, version, bill_number 'HB 1', introduced_utc 2026-09-01T00:00:00Z, chamber HOUSE, sponsor_member_id and appropriation_requested_cents are all server-derived and cannot be influenced by the caller."
        test_recipe:
          setup:
            - "CONVENED session at clock 2026-09-01T00:00:00Z; one HOUSE member; one DRAFT_READY drafting request with appropriation_requested_cents 7000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Ferry service subsidy", summary: "Subsidize rural ferry service.", requested_sections_count: 3, target_code_chapter: "Title 46", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 7000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /drafting-requests/${dr_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T00:00:00Z", engagement_end_utc: "2026-09-04T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr_id}/complete-research"
              payload: { affected_sections_count: 3 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
          trigger:
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr_id}" }
              as: Clerk
              captures: { b_id: $.data.id, b_v: $.data.version }
          assert:
            - "Bill.${b_id}.bill_number == 'HB 1' and chamber == 'HOUSE'"
            - "Bill.${b_id}.introduced_utc == 2026-09-01T00:00:00Z (the logical clock, not wall clock)"
            - "Bill.${b_id}.sponsor_member_id == ${m1_id} and appropriation_requested_cents == 7000000"
            - "Bill.${b_id}.version == 1 and created_at == 2026-09-01T00:00:00Z"
            - "Bill.${b_id}.legislative_status == INTRODUCED and fiscal_status == NOTE_PENDING"
            - "Bill.${b_id}.referral_count == 0 and adopted_amendment_count == 0 and adopted_fiscal_delta_cents == 0"
            - "Session.${s_id}.next_house_bill_number == 2 and bills_introduced_count == 1"

      - name: drafting_request_invalid_confidentiality_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.DraftingRequest.fields.confidentiality
          - validations.priority_60.ERR_INVALID_REQUEST
        distinguishing_aspect: "confidentiality is an enum of exactly {PUBLIC, CONFIDENTIAL}; the value 'SECRET' is rejected with 400 ERR_INVALID_REQUEST rather than coerced to a default."
        test_recipe:
          setup:
            - "CONVENED session and one member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Bad enum", summary: "Enum probe.", requested_sections_count: 2, target_code_chapter: "Title 9", confidentiality: "SECRET", priority_flag: false, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /drafting-requests filtered by session_id ${s_id} returns total_count == 0"

      - name: cost_estimate_rows_are_append_only_and_carry_no_version_field
        claim_type: Immutability
        grounds:
          - entities.CostEstimate
          - endpoints.POST_fiscal_note_requests_cost_estimates
          - endpoints.GET_fiscal_note_requests_cost_estimates
        distinguishing_aspect: "CostEstimate is declared common_fields false: its rows expose no version field and §1.5 declares no update or delete endpoint for them, so a correction is expressed as a NEW row in a new revision_round while the superseded row stays readable with included_in_certification false."
        test_recipe:
          setup:
            - "CONVENED session; a bill with a ROUTED INCREMENTAL_COST note; one FY2027 and one FY2028 BASELINE line filed in revision_round 0; the note submitted and then returned for revision, bumping it to revision_round 1; a replacement FY2027 line filed in round 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dept of Revenue", agency_code: "DOR", status: "ACTIVE", max_open_requests: 3 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /drafting-requests"
