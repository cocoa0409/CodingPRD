              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r2}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
              captures: { m: $.data.minted_count }
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-10T00:00:00Z", metered_kwh: 700 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/meter-readings/${r2}/void"
              payload: { reason: "fraud suspected" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
            - call: "POST /greenpower/meter-readings/${r1}/void"
