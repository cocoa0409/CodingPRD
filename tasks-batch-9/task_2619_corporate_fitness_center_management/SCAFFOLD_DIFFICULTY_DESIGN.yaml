  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # ---------------------------------------------------------------- 1 / 2 --
      - name: labor_cost_rounds_per_assignment_then_sums
        grounds:
          - calculations.session_labor_cost
          - entities.StaffAssignment.fields.paid_minutes
          - entities.StaffAssignment.fields.labor_cost_cents
          - entities.MonthlyInvoice.fields.labor_subtotal_cents
          - state_machines.StaffAssignment.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER of rounding decides the cents.
          calculations.session_labor_cost pins "round each assignment, then sum":
          LEAD 4700*70/60 = 5483.33 -> 5483, SUPPORT 4700*55/60 = 4308.33 -> 4308,
          total 9791. The forbidden "sum the minutes, then round once" order gives
          round_half_up(4700*125/60) = 9792 and propagates a different invoice net
          (35111 instead of 35110), so the off-by-one cent is observable twice.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE COST_PLUS contract (not_to_exceed_cents 5000000, ytd_billed_cents 0)."
            - "Two GROUP_EX_INSTRUCTOR staff at the SAME hourly_cost_cents = 4700, both with a VERIFIED GROUP_EX_CERT, so the per-assignment difference comes only from LEAD_SETUP_MIN."
            - "One session 12:00-12:55Z (scheduled_minutes = 55) with direct_supply_cost_cents = 23522."
            - "Both assignments CONFIRMED, then the session is STARTed and COMPLETEd so both assignments reach COMPLETED and enter the invoice."
