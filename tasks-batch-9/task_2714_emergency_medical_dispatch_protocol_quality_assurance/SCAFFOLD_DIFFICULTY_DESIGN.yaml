          assert:
            - "HighRiskCaseReview.${hrp_id}.compression_compliant == true and dacpr_index == 63.9 (weighted, uncapped) and dacpr_pass == false"
            - "HighRiskCaseReview.${hrq_id}.compression_compliant == false and dacpr_index == 50.0 (the weighted 63.9 is replaced by LATE_COMPRESSION_CAP) and dacpr_pass == false"
            - "Both HighRiskCaseReviews are in status DACPR_SCORED immediately after scoring"
            - "The COACHING_ONLY sign-off on ${hrq_id} SUCCEEDS with 200 because the sentinel floor test is `dacpr_index < 50.0`, and 50.0 is not below 50.0; HighRiskCaseReview.${hrq_id}.status == COACHING_ONLY"
            - "Dispatcher.${dq_id}.sentinel_event_count == 0 and GET /coaching-plans?dispatcher_id=${dq_id} returns exactly 1 element with severity ADVISORY, focus_area DACPR, required_hours 2.0 (COACHING_ONLY with dacpr_pass false)"
            - "Control — a HighRiskCaseReview whose time_to_first_compression_sec is 122 with recognition_time_sec 60 has recognition_sub 100.0*(90-60)/90 = 33.33 and therefore dacpr_index 33.3, already below the 50.0 cap so the cap does not bind; a COACHING_ONLY sign-off on it returns 422 ERR_SENTINEL_CLASSIFICATION_REQUIRED"

      - name: hours_owed_exactly_at_the_restriction_threshold_versus_a_quarter_hour_over
        grounds:
          - calculations.remediation_hours_ledger
          - calculations.dispatch_privilege_derivation
          - calculations.coaching_plan_credited_hours
          - calculations.session_duration_hours
        distinguishing_aspect: |
          The privilege comparison is strictly greater-than against
          hours_owed_restriction_threshold, and the value being compared is the residue of a
          two-decimal subtraction: 8.0 - 2.00 = 6.00 leaves the dispatcher FULL, while
          8.0 - 1.75 = 6.25 restricts them. A `>=` comparison, or a one-decimal duration, flips
          the first dispatcher wrongly.
        test_recipe:
          setup:
            - "Program with hours_owed_restriction_threshold 6.0 and one APPROVED protocol version."
            - "Dispatchers P and Q each carry a MANUAL CRITICAL plan (required_hours 8.0)."
            - "P's plan has one session 2026-08-15 09:00-11:00 (2.00 h); Q's has one session 2026-08-15 09:00-10:45 (1.75 h)."
            - "The clock is 2026-08-20, past both sessions' ends_at, so both may be completed."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Ridgeline EMD QA", accreditation_body: "STATE_OEMS", hours_owed_restriction_threshold: 6.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-H01", full_name: "Tova Lindqvist" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { dp_id: $.data.id, dp_v: $.data.version }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-H02", full_name: "Ulric Mbeki" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { dq_id: $.data.id, dq_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /coaching-plans"
              payload: { dispatcher_id: "${dp_id}", expected_dispatcher_version: "${dp_v}", severity: "CRITICAL", focus_area: "DETERMINANT_CODING" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { planp_id: $.data.id }
            - call: "POST /coaching-plans"
              payload: { dispatcher_id: "${dq_id}", expected_dispatcher_version: "${dq_v}", severity: "CRITICAL", focus_area: "DETERMINANT_CODING" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { planq_id: $.data.id }
            - call: "POST /coaching-plans/${planp_id}/retraining-sessions"
              payload: { protocol_version_id: "${pv_id}", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T11:00:00Z", modality: "ONE_ON_ONE" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sessp_id: $.data.id }
            - call: "POST /coaching-plans/${planq_id}/retraining-sessions"
              payload: { protocol_version_id: "${pv_id}", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T10:45:00Z", modality: "ONE_ON_ONE" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sessq_id: $.data.id }
          trigger:
            - call: "POST /retraining-sessions/${sessp_id}/complete"
              payload: { attendance_confirmed: true }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /retraining-sessions/${sessq_id}/complete"
              payload: { attendance_confirmed: true }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "RetrainingSession.${sessp_id}.duration_hours == 2.00 and status == COMPLETED; RetrainingSession.${sessq_id}.duration_hours == 1.75 and status == COMPLETED"
            - "CoachingPlan.${planp_id}.credited_hours == 2.00, required_hours == 8.0, status == IN_PROGRESS (credit is short of the requirement, so no bubble-up to VERIFIED)"
            - "CoachingPlan.${planq_id}.credited_hours == 1.75, required_hours == 8.0, status == IN_PROGRESS"
            - "Dispatcher.${dp_id}.remediation_hours_owed == 6.00 and dispatch_privilege == FULL (6.00 > 6.0 is false)"
            - "Dispatcher.${dq_id}.remediation_hours_owed == 6.25 and dispatch_privilege == RESTRICTED"
            - "Both dispatchers keep certification_status PROVISIONAL and sentinel_event_count 0, so the privilege difference is attributable to the hours ledger alone"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: scoring_and_finalizing_are_blocked_by_the_periods_locked_state
        grounds:
          - state_machines.Review.SCORED_to_SCORED
          - state_machines.Review.SCORED_to_FINALIZED
          - state_machines.SamplingPeriod.CLOSED_to_LOCKED
          - errors.ERR_PERIOD_LOCKED
        distinguishing_aspect: |
          The Review itself is in a perfectly scorable state (SCORED, no open rebuttal, correct OCC
          version) and the request is well-formed; what refuses it is the state of a DIFFERENT
          entity two hops away — the SamplingPeriod that was locked by an accreditation report
          submitted against the program. The reviewer never touched the period.
        test_recipe:
          setup:
            - "Program with target_compliance_pct 90.0; one dispatcher with two CHEST_PAIN calls in August."
            - "A TARGETED period [2026-08-01, 2026-09-01) with target_sample_count 2; both calls targeted."
            - "Review 1 scored 23/25 in each section with an ACCURATE code and FINALIZED (92.0, posture GOOD)."
            - "Review 2 scored but left in SCORED, so the lock cascade freezes rather than voids it."
            - "The period is CLOSED and a CASE_WEIGHTED report over the same window has been SUBMITTED, so the period is LOCKED."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Sable EMD QA", accreditation_body: "IAED", target_compliance_pct: 90.0, watch_floor_pct: 80.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-J01", full_name: "Vera Osei" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-J001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-J002", call_type: "CHEST_PAIN", received_at: "2026-08-06T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c2_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "TARGETED", target_sample_count: 2 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c2_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 23, case_entry_points_possible: 25, key_questions_points_earned: 23, key_questions_points_possible: 25, pre_arrival_points_earned: 23, pre_arrival_points_possible: 25, final_coding_points_earned: 23, final_coding_points_possible: 25, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
              as_user_id: "rev-1"
            - call: "POST /reviews/${r2_id}/scores"
              payload: { expected_review_version: "${r2_v}", case_entry_points_earned: 20, case_entry_points_possible: 25, key_questions_points_earned: 20, key_questions_points_possible: 25, pre_arrival_points_earned: 20, pre_arrival_points_possible: 25, final_coding_points_earned: 20, final_coding_points_possible: 25, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
              as_user_id: "rev-1"
            - call: "POST /reviews/${r1_id}/finalize"
              payload: { finalization_note: "clean" }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /sampling-periods/${sp_id}/close"
              payload: { closing_note: "quota met" }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /audit-programs/${prog_id}/accreditation-reports"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", variant: "CASE_WEIGHTED" }
              as: AccreditationOfficer
              as_user_id: "acc-1"
              captures: { rep_id: $.data.id }
            - call: "POST /accreditation-reports/${rep_id}/submit"
              payload: { submitted_to: "MEDICAL_DIRECTOR" }
              as: AccreditationOfficer
              as_user_id: "acc-1"
            - call: "GET /reviews/${r2_id}"
              payload: {}
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r2_v2: $.data.version }
          trigger:
            - call: "POST /reviews/${r2_id}/scores"
              payload: { expected_review_version: "${r2_v2}", case_entry_points_earned: 25, case_entry_points_possible: 25, key_questions_points_earned: 25, key_questions_points_possible: 25, pre_arrival_points_earned: 25, pre_arrival_points_possible: 25, final_coding_points_earned: 25, final_coding_points_possible: 25, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
              as_user_id: "rev-1"
          assert:
            - "SamplingPeriod.${sp_id}.status == LOCKED"
            - "Review.${r2_id}.status == SCORED (frozen, not voided — only SELECTED reviews are voided by the lock)"
            - "The trigger returns 409 with data.error_id == ERR_PERIOD_LOCKED, even though the review's own state, the OCC version and the payload are all valid"
            - "GET /reviews/${r2_id}/score-sheets still returns exactly 1 element and Review.${r2_id}.current_sheet_round is still 1"
            - "POST /reviews/${r2_id}/finalize as QaSupervisor sup-1 also returns 409 ERR_PERIOD_LOCKED"
            - "Control — Review.${r1_id} is unaffected: it stays FINALIZED with final_composite_score 92.0"

      - name: retraining_session_requires_the_curriculum_version_to_be_out_of_draft
        grounds:
          - validations.priority_50_business_referential.ERR_CURRICULUM_VERSION_NOT_TRAINABLE
          - state_machines.ProtocolVersion.DRAFT_to_APPROVED
          - state_machines.CoachingPlan.ASSIGNED_to_IN_PROGRESS
        distinguishing_aspect: |
          The scheduling request is refused purely because of a third entity's lifecycle state: the
          ProtocolVersion named as the curriculum is still DRAFT. Approving that version — an action
          taken by a different role on a different aggregate, with no change to the plan or the
          session payload — makes the identical request succeed and moves the plan ASSIGNED ->
          IN_PROGRESS. This is the retraining-and-go-live coordination gate: you cannot train
          dispatchers on a card set the medical director has not adopted.
        test_recipe:
          setup:
            - "Program with a single MPDS_CARDSET version in DRAFT, effective_from 2026-07-01 and effective_to null."
            - "One dispatcher with a MANUAL STANDARD coaching plan in status ASSIGNED."
            - "Clock at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Tallow EMD QA", accreditation_body: "NAED_LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.2", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-K01", full_name: "Wren Adeyemi" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /coaching-plans"
              payload: { dispatcher_id: "${d1_id}", expected_dispatcher_version: "${d1_v}", severity: "STANDARD", focus_area: "KEY_QUESTIONS" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /coaching-plans/${plan_id}/retraining-sessions"
              payload: { protocol_version_id: "${pv_id}", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T13:00:00Z", modality: "CLASSROOM" }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "The trigger returns 409 with data.error_id == ERR_CURRICULUM_VERSION_NOT_TRAINABLE while ProtocolVersion.${pv_id}.status == DRAFT"
            - "CoachingPlan.${plan_id}.status is still ASSIGNED and GET /coaching-plans/${plan_id}/retraining-sessions returns 0 elements"
            - "After POST /protocol-versions/${pv_id}/approve as MedicalDirector dir-1 (ProtocolVersion.${pv_id}.status == APPROVED), the byte-identical scheduling request returns 201"
            - "The created RetrainingSession has duration_hours 4.00, status SCHEDULED and protocol_version_id ${pv_id}"
            - "CoachingPlan.${plan_id}.status == IN_PROGRESS and GET /protocol-versions/${pv_id}/retraining-sessions returns exactly 1 element"

      - name: golive_requires_the_rollouts_training_dimension_to_be_complete
        grounds:
          - validations.priority_75_business_fiscal.ERR_TRAINING_INCOMPLETE
          - calculations.rollout_training_rollup
          - state_machines.ProtocolRollout.GOLIVE_SCHEDULED_to_GOLIVE_LIVE
        distinguishing_aspect: |
          Go-live is gated on an aggregate derived from a different entity type entirely: the count
          of Dispatchers whose certified_protocol_version_id points at this rollout's version. With
          one of two dispatchers certified the rollout is IN_PROGRESS and go-live is refused; the
          fix is to certify a dispatcher, an action against /dispatchers/{id}/certify that mentions
          no rollout at all. The go-live window is deliberately already open, so the lower-priority
          temporal gate (ERR_GOLIVE_WINDOW_NOT_OPEN, priority 62) cannot mask the readiness gate.
        test_recipe:
          setup:
            - "Program with one APPROVED MPDS_CARDSET version and a rollout whose target_dispatcher_count is 2 and scheduled_golive_at is 2026-08-01 (already past)."
            - "Two dispatchers exist; only the first has been certified on the version, so trained_dispatcher_count is 1 and training_status is IN_PROGRESS."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Umber EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-14.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-L01", full_name: "Xiomara Petit" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-L02", full_name: "Yosef Brandt" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /protocol-versions/${pv_id}/rollouts"
              payload: { scheduled_golive_at: "2026-08-01T00:00:00Z", target_dispatcher_count: 2, required_training_hours: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ro_id: $.data.id }
            - call: "POST /dispatchers/${d1_id}/certify"
              payload: { protocol_version_id: "${pv_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /protocol-rollouts/${ro_id}/go-live"
              payload: { golive_note: "premature go-live attempt" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "Before the trigger: ProtocolRollout.${ro_id}.trained_dispatcher_count == 1 and training_status == IN_PROGRESS and golive_status == SCHEDULED"
            - "The trigger returns 422 with data.error_id == ERR_TRAINING_INCOMPLETE (not ERR_GOLIVE_WINDOW_NOT_OPEN — the clock is already past scheduled_golive_at)"
            - "ProtocolRollout.${ro_id}.golive_status is still SCHEDULED, went_live_at == null, and ProtocolVersion.${pv_id}.status is still APPROVED"
            - "After POST /dispatchers/${d2_id}/certify with protocol_version_id ${pv_id}, ProtocolRollout.${ro_id}.trained_dispatcher_count == 2 and training_status == COMPLETE"
            - "The identical go-live request now returns 200: ProtocolRollout.${ro_id}.golive_status == LIVE, went_live_at == 2026-08-20T00:00:00Z, ProtocolVersion.${pv_id}.status == ACTIVE and activated_at == 2026-08-20T00:00:00Z"

  - rule_id: resource_temporal_overlap
    instances:
      - name: protocol_version_windows_are_half_open_so_touching_endpoints_approve
        grounds:
          - validations.priority_60_business_constraint.ERR_PROTOCOL_WINDOW_OVERLAP
          - state_machines.ProtocolVersion.DRAFT_to_APPROVED
        distinguishing_aspect: |
          The exclusivity interval is half-open and scoped per (program_id, protocol_family), and it
          is evaluated at APPROVAL time against versions already in {APPROVED, ACTIVE, SUPERSEDED},
          with effective_to == null meaning +infinity. So a version starting exactly where its
          predecessor ends approves, one ending exactly where its predecessor starts approves, a
          version straddling both is refused, and the same straddling window in a different card-set
          family approves — four outcomes from one comparison.
        test_recipe:
          setup:
            - "One program. Four DRAFT versions are created up front, all with weights 0.2000 / 0.3500 / 0.3000 / 0.1500."
            - "vA: MPDS_CARDSET [2026-07-01, 2026-09-01)."
            - "vB: MPDS_CARDSET [2026-09-01, null) — starts exactly where vA ends."
            - "vC: MPDS_CARDSET [2026-06-01, 2026-07-01) — ends exactly where vA starts."
            - "vD: MPDS_CARDSET [2026-08-15, 2026-10-01) — straddles vA and vB."
            - "vE: LOCAL_CARDSET [2026-08-15, 2026-10-01) — the same straddling window in a different family."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Verdant EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pva_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.1", effective_from: "2026-09-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pvb_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-12.9", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pvc_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0-regional", effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pvd_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "LOCAL_CARDSET", version_label: "LOCAL-2.0", effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pve_id: $.data.id }
            - call: "POST /protocol-versions/${pva_id}/approve"
              payload: { approval_note: "baseline" }
              as: MedicalDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /protocol-versions/${pvb_id}/approve"
              payload: { approval_note: "successor starting where the baseline ends" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /protocol-versions/${pvc_id}/approve"
              payload: { approval_note: "predecessor ending where the baseline starts" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /protocol-versions/${pvd_id}/approve"
              payload: { approval_note: "straddling window" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /protocol-versions/${pve_id}/approve"
              payload: { approval_note: "same window, different family" }
              as: MedicalDirector
              as_user_id: "dir-1"
          assert:
            - "The vB approval returns 200 and ProtocolVersion.${pvb_id}.status == APPROVED (effective_from == vA.effective_to is adjacency, not overlap, and null effective_to does not affect the comparison against vA)"
            - "The vC approval returns 200 and ProtocolVersion.${pvc_id}.status == APPROVED (effective_to == vA.effective_from is adjacency)"
            - "The vD approval returns 409 with data.error_id == ERR_PROTOCOL_WINDOW_OVERLAP and ProtocolVersion.${pvd_id}.status is still DRAFT"
            - "The vE approval returns 200 and ProtocolVersion.${pve_id}.status == APPROVED — exclusivity is scoped per (program_id, protocol_family), so the LOCAL_CARDSET version may sit inside the MPDS windows"
            - "GET /audit-programs/${prog_id}/protocol-versions?status=APPROVED returns exactly 4 elements (vA, vB, vC, vE)"
            - "GET /audit-programs/${prog_id}/protocol-versions?status=DRAFT returns exactly 1 element (vD)"

      - name: session_buffer_counts_completed_sessions_and_releases_cancelled_ones
        grounds:
          - validations.priority_60_business_constraint.ERR_SESSION_WINDOW_OVERLAP
          - state_machines.RetrainingSession.COMPLETED_to_CANCELLED
          - calculations.session_duration_hours
        distinguishing_aspect: |
          The 45-minute buffer is a closed comparison against the dispatcher's SCHEDULED *and*
          COMPLETED sessions across all of their coaching plans, so a session that has already
          happened still blocks a back-to-back booking; cancelling it releases the window and the
          identical request then succeeds. The blocking session belongs to a different (and by then
          CANCELLED) plan, so per-plan overlap checking passes the test wrongly.
        test_recipe:
          setup:
            - "Program with one APPROVED MPDS_CARDSET version; clock 2026-08-20T00:00:00Z."
            - "Dispatcher D1 with plan 1 (MANUAL ADVISORY, required 2.0 h) carrying session A on 2026-08-15 10:00-11:00, already COMPLETED (1.00 h credited)."
            - "Plan 2 (MANUAL STANDARD) is then created for D1, which supersedes plan 1 (CANCELLED, closure_reason SUPERSEDED) while session A stays COMPLETED."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Windrow EMD QA", accreditation_body: "STATE_OEMS", hours_owed_restriction_threshold: 6.0 }
