              as: EditorialStaff
              captures: { cyc_st: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00103", change_type: "ADDITION", category: "CATEGORY_I", code_family: "001", applicant_id: "${app_st}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
              captures: { chg_st: $.data.id, st_v0: $.data.version }
            - call: "POST /cpt/meetings/${mtg_st}/agenda"
              payload: { change_ids: ["${chg_st}"] }
              as: EditorialStaff
              captures: { mtg_st_v1: $.data.version }
            - call: "POST /cpt/code-changes/${chg_st}/returns"
              payload: { reason: "Returns the change for rework" }
              as: EditorialStaff
              captures: { st_v1: $.data.version }
          trigger:
            - call: "POST /cpt/release-cycles/${cyc_st}/submissions"
              payload: { change_ids: ["${chg_st}"], expected_change_version: "${st_v0}" }
              as: EditorialStaff
              captures: { err_st: $.data.error_id }
          assert:
            - "${err_st} == ERR_STALE_VERSION"
            - "the returned http status is 412"
            - "CodeChange.${chg_st}.cycle_id is null"