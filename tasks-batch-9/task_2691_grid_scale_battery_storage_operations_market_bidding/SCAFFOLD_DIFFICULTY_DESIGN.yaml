            - "SocReservation R4 ENERGY_ARBITRAGE 40.0 MWh, window 2026-08-10T12:00:00Z .. 20:00:00Z"
            - "MarketBid B4 left in DRAFT: DAY_AHEAD ENERGY DISCHARGE 20.0 MW, delivery 12:00:00Z .. 16:00:00Z, priced 37.00 with cycle_debit_efc 0.4"
            - "CapacityTest T4 scheduled 2026-08-01, started (IN_PROGRESS)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 4", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 200.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a4: $.data.id, a4_avail0: $.data.available_energy_mwh, a4_efc0: $.data.equivalent_full_cycles_ytd }
            - call: "POST /storage-assets/${a4}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { a4_v: $.data.version }
            - call: "POST /capacity-obligations"
