      - name: an_occupancy_exception_can_only_be_decided_once_in_either_direction
        claim_type: error_triggerable
        grounds:
          - validations[priority=23]
          - errors[ERR_EXCEPTION_ALREADY_DECIDED]
          - state_machines.OccupancyException
          - endpoints["POST /occupancy-exceptions/{id}/decision"]
        distinguishing_aspect: "The exception is GRANTED first and then attacked twice — once with the same GRANT verb and once with the opposite DENY verb — and both are refused at priority 23, proving the guard reads the exception's status rather than comparing the incoming decision with the recorded one; the entitlement ledger must not be debited a second time by either refused call."
        test_recipe:
          setup:
            - "A SHORTSTAY tier with max_consecutive_stay_nights 3 so a modest extension overruns the tier limit, and one CHECKED_IN 3-night stay whose extension to 2026-08-16 opens a REQUESTED exception for a 6-night merged run"
