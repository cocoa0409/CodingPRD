            - "the reversal is not symmetric and must not be: paid_to_date_cents never decreased at any state, so the 5000-cent overpayment survives as a credit rather than being netted out of paid_to_date_cents or silently dropped"
            - "assessed_fee_cents at state 4 equals assessed_fee_cents at state 0 to the cent, which is the no-drift condition — a rounding-order slip in the revert shows up here as 126001 or 126003"
            - "Permit.fee_delinquent tracks the identity: true at state 1, false at state 2, true at state 3 because balance_due_cents is 15000, and false again at state 4"
            - "the report chain is intact: ${r3_id} and ${r3b_id} are both SUPERSEDED, only ${r3c_id} is ACCEPTED, and the accepted set the fee is computed over is exactly three reports at every state"

      - name: guide_capacity_total_conservation_across_revoke_cycle
