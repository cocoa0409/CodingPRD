      - name: c_record_bounce_requires_postal_sent
        claim_type: invalid_transition
        grounds: [state_machines.TaxReturn.recipient_copy_status, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A bounce event against a PENDING copy (never postal-sent) is an invalid transition."
