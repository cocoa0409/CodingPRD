  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_bond_issue_version_on_a_second_draw_is_precondition_failed_while_the_refreshed_version_passes
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[draw-create-stale-bond-issue]
          - validations[priority=70]
          - errors[ERR_STALE_BOND_ISSUE_VERSION]
          - endpoints[POST /draw-requests].input.expected_bond_issue_version
          - entities.BondIssue.fields.undrawn_cents
        distinguishing_aspect: |
          The OCC token is checked against the parent bond issue, not the draw being
          created, and the thing that invalidates it is a funding event on a sibling
          draw - so the sponsor's token goes stale without the sponsor touching
          anything. The refusal must be a 412 on the version alone even though the
          second draw is perfectly fundable against the real undrawn balance, and it
          must leave no DrawRequest row behind. Re-reading the issue and resubmitting
          the identical body then succeeds, which distinguishes a genuine version
          check from an implementation that simply rejects any second draw.
        test_recipe:
          setup:
            - "CF chain through bond issuance: par 200000000, undrawn 200000000, allocation COMMITTED, project FINANCED."
            - "The version observed at issuance is retained as the sponsor's token."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
