    code: 200
    input: [expected_vehicle_version, "ceiling_cents?", "effective_from?", "effective_to?"]
    output: ContractVehicle
    side_effects: ["increments ContractVehicle.version"]
  - method: POST
    path: "/vehicles/{id}/authorize"
    description: "PENDING -> AUTHORIZED"
    roles: [ContractsManager]
    code: 200
    input: []
    output: ContractVehicle
    side_effects: ["increments ContractVehicle.version"]
  - method: POST
    path: "/vehicles/{id}/suspend"
    description: "AUTHORIZED -> SUSPENDED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ContractVehicle
    side_effects: ["increments ContractVehicle.version"]
  - method: POST
