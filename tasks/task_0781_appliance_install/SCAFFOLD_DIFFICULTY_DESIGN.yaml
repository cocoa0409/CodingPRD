              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/request-redo"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: PlatformAdmin
          assert:
            - "WorkOrder.${wo_id}.status == DISPATCHED"
            - "WorkOrder.${wo_id}.redo_count == 1"

      - name: proapplication_approved_suspended_reinstate_cycle
        grounds:
