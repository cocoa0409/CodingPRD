              as_user_id: "${juris}"
          assert:
            - "setup_api_calls[3] response HTTP status == 201 with data.status == SUBMITTED, data.effective_start_date == null and data.effective_end_date == null"
            - "trigger[0] response HTTP status == 409 and data.error_id == ERR_VARIANCE_STATE_INVALID"
            - "VarianceRequest.${v1}.status == SUBMITTED and effective_start_date == null after trigger[0]"
            - "trigger[1] response data.status == UNDER_REVIEW and data.decided_by_user_id == ${juris}"
            - "trigger[2] response data.status == GRANTED with effective_start_date == 2026-09-01 and effective_end_date == 2026-09-30 defaulted from the request"

      - name: variance_denied_is_terminal_and_cannot_be_granted_afterwards
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.VarianceRequest.terminal_states
          - validations[priority=10]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "DENIED is a declared terminal state, so a later GRANTED decision on the same request returns ERR_ALREADY_TERMINAL (409) - a different error from the ERR_VARIANCE_STATE_INVALID raised by a merely out-of-order decision."
        test_recipe:
          setup:
            - "One VarianceRequest taken through OPEN_REVIEW to DENIED."
          setup_api_calls:
