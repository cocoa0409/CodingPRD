- rule_id: non_linear_state_machine
  rationale: A bounded revision cycle, two independent state dimensions on one entity, and a second bounded cycle whose counter is a different ceiling.
  instances:
  - name: nonlinear_permit_info_requested_revision_cycle_hits_round_ceiling
    grounds:
    - §1.2 Permit DRAFT -> SUBMITTED, SUBMITTED -> INFO_REQUESTED, INFO_REQUESTED -> SUBMITTED (cycle)
    - §1.1 Permit.submission_round / status / missing_document_codes
    - §1.4 priority 10 ERR_INVALID_STATE, priority 12 ERR_INVALID_ACTION, priority 39 ERR_ROUND_LIMIT_EXCEEDED
    - §1.5 POST /aquarium/permits/{id}/submission, POST /aquarium/permits/{id}/decisions
    distinguishing_aspect: 'SUBMITTED is re-entered twice, so the state alone cannot tell the implementation whether the next submission is legal: only submission_round can. The ceiling PERMIT_MAX_ROUNDS 3 is itself allowed, and the fourth attempt fails while leaving the permit in INFO_REQUESTED — an implementation that flips to SUBMITTED before checking the counter is detectable.'
    test_recipe:
      setup: A wild-collection acquisition request in PENDING_PERMIT with an IMPORT permit carrying the complete document set, already submitted once (submission_round 1).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
