            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /api/licenses/${lic}/suspend", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/offers/${o1}/accept", payload: { broker_commission_bps: 300 }, as: Broker, as_user_id: "${b_id}", captures: { err_hold: "$.data.error_id" } }
            - { call: "POST /api/licenses/${lic}/reinstate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/offers/${o1}/accept", payload: { broker_commission_bps: 300 }, as: Broker, as_user_id: "${b_id}", captures: { o_status: "$.data.status" } }
          assert:
            - "After suspend: GET /api/cases/${c1} hold_status == COMPLIANCE_HOLD (license cascade)"
            - "captured err_hold == ERR_CASE_ON_COMPLIANCE_HOLD (accept blocked during hold)"
            - "After reinstate: GET /api/cases/${c1} hold_status == CLEAR"
            - "captured o_status == ACCEPTED; case status == IN_CLOSING"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: death_settlement_maturity_chain
        grounds:
          - state_machines.DeathClaim.FILED_to_PAID
          - state_machines.PolicyCase.ACQUIRED_to_MATURED
          - state_machines.PremiumSchedule.ACTIVE_to_TERMINATED
          - state_machines.ValuationSnapshot.DRAFT_to_SUPERSEDED
          - calculations.calc_death_claim_net
        distinguishing_aspect: |
          Depth-4 chain from the death-claim settle trigger: settle PAID -> case
          MATURED -> ACTIVE schedule TERMINATED -> portfolio nav_stale/version bump
          -> existing DRAFT snapshot SUPERSEDED; each hop is caused by the previous
          link, not by the settle itself.
        test_recipe:
          setup:
            - "Canonical TX chain to ACQUIRED (funded 2026-08-15, released 2026-09-05); PAY_AS_DUE schedule (50000/month) created at 2026-09-05; no payments made"
            - "DRAFT valuation snapshot exists on the portfolio (created at clock 2026-10-01, period [2026-09-05, 2026-10-01))"
            - "Two VERIFIED DEATH_INDICATED tracking events with distinct channels (OBIT, DMF)"
            - "Death claim FILED for date_of_death 2026-10-10; payment #1 (due 2026-10-05) still SCHEDULED (grace until 2026-11-05) so unpaid = 50000"
