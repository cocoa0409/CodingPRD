      - name: intake_branches_on_the_receiving_areas_design_review_flag
        claim_type: valid_transition
        grounds:
          - state_machines.ReceivingSiteApplication.initial_state
          - endpoints.POST_tdr_receiving-site-applications
          - entities.ReceivingArea.fields.design_review_required
          - validations.priority_15_design_review_state
        distinguishing_aspect: "The application's birth state is chosen by the RECEIVING AREA's design_review_required flag, not by anything in the request: the same payload lands in DESIGN_REVIEW under a review-required area and skips straight to DESIGN_APPROVED under an exempt one. The exempt application therefore has no design-review decision to record at all."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "DEVELOPER party"
            - "ACTIVE receiving area RA-REVIEW (base_density 4.0, max_bonus_pct 0.35, cap 500, design_review_required true)"
            - "ACTIVE receiving area RA-EXEMPT with identical sizing but design_review_required false"
