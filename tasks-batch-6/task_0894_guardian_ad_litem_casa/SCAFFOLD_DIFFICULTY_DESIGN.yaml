  - rule_id: compensating_invariant
    instances:
      - name: budget_money_conserved_by_approve_then_void
        grounds:
          - calculations.case_reimbursement_committed
          - state_machines.ExpenseClaim.SUBMITTED_to_APPROVED
          - state_machines.ExpenseClaim.APPROVED_to_VOIDED
          - entities.Case.fields.reimbursement_committed_cents
        distinguishing_aspect: |
          Conserved MONEY quantity: Case.reimbursement_committed_cents goes 0 -> 10700 on approve
          and back to 0 on void, exactly its pre-approve value (delta zero over the round trip).
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn+assigned to C1 (budget 20000). One SUBMITTED claim (120mi/6000c)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}", reimbursement_budget_cents: 20000 }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "POST /expense-claims", payload: { case_id: "${c1_id}", period_month: "2026-06", total_miles: 120, other_expense_cents: 6000 }, as: Volunteer, as_user_id: "${v1_id}", captures: { ec_id: "$.data.id" } }
          trigger:
            - { call: "POST /expense-claims/${ec_id}/approve", payload: {}, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "GET /cases/${c1_id}", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { committed_after_approve: "$.data.reimbursement_committed_cents" } }
            - { call: "POST /expense-claims/${ec_id}/void", payload: { reason: "reversed" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "GET /cases/${c1_id}", payload: {}, as: Supervisor, as_user_id: "${s1_id}", captures: { committed_after_void: "$.data.reimbursement_committed_cents" } }
          assert:
            - "Case.${c1_id}.reimbursement_committed_cents == 10700 after approve"
            - "Case.${c1_id}.reimbursement_committed_cents == 0 after void (restored to pre-approve value)"

      - name: caseload_count_conserved_by_assign_then_end
        grounds:
          - calculations.volunteer_active_case_count
          - state_machines.Case.INTAKE_to_ASSIGNED
          - state_machines.CaseAssignment.ACTIVE_to_ENDED
          - entities.Volunteer.fields.active_case_count
        distinguishing_aspect: |
          Conserved COUNT quantity (different type than money): Volunteer.active_case_count goes
          0 -> 1 on assign and back to 0 on end, exactly its starting value.
        test_recipe:
          setup:
            - "Clock 2026-06-01. S1, V1 sworn+assigned to C1 (active_case_count == 1 after assign)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /supervisors", payload: { full_name: "Sup One", email: "s1@casa.org" }, as: ProgramAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { full_name: "Val One", email: "v1@casa.org", home_zip: "94601" }, as: ProgramAdmin, captures: { v1_id: "$.data.id" } }
            - { call: "POST /volunteers/${v1_id}/start-screening", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/background-checks", payload: { check_type: "STATE_AND_FEDERAL" }, as: ProgramAdmin, captures: { bg1_id: "$.data.id" } }
            - { call: "POST /background-checks/${bg1_id}/clear", payload: {}, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/training-records", payload: { module_name: "CORE", hours: 30, completed_at: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /volunteers/${v1_id}/swear-in", payload: {}, as: ProgramAdmin }
            - { call: "POST /cases", payload: { child_initials: "J.D.", child_dob: "2018-04-01", jurisdiction: "CA-ALAMEDA", supervisor_id: "${s1_id}" }, as: ProgramAdmin, captures: { c1_id: "$.data.id", c1_v0: "$.data.version" } }
            - { call: "POST /cases/${c1_id}/assignments", payload: { volunteer_id: "${v1_id}", expected_case_version: "${c1_v0}" }, as: Supervisor, as_user_id: "${s1_id}", captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "GET /volunteers/${v1_id}", payload: {}, as: ProgramAdmin, captures: { count_after_assign: "$.data.active_case_count" } }
            - { call: "POST /cases/${c1_id}/assignments/${a1_id}/end", payload: { reason: "manual" }, as: Supervisor, as_user_id: "${s1_id}" }
            - { call: "GET /volunteers/${v1_id}", payload: {}, as: ProgramAdmin, captures: { count_after_end: "$.data.active_case_count" } }
          assert:
            - "Volunteer.${v1_id}.active_case_count == 1 after assign"
            - "Volunteer.${v1_id}.active_case_count == 0 after end (restored to starting value)"
