          setup:
            - "An ACTIVE adoption on Alder Creek with an APPROVED plan and an ISSUED permit."
            - "Work party P1 briefed with Milo registered, still PLANNED."
            - "A condition report triaged with exposure MEDIUM and then dispositioned SCHEDULE onto P1."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
