  # ===========================================================================
  - section: calculations
    instances:
      - name: recommended_path_bands_below_full_threshold
        claim_type: correct_result
        grounds: [calculations.recommended_path, calculations.wear_index]
        distinguishing_aspect: "Threshold bands below FULL_REBUILD: wear 20.00 (4/2/3) -> RETROFIT_ONLY; wear exactly 40.00 (16/0/0) -> MECHANICAL_REBUILD (>= 40.00 inclusive)."
        test_recipe:
          setup: ["two registered machines"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-230", machine_type: "LATHE", year_of_manufacture: 2021, control_generation: "MODERN", spindle_hours: 5000 }, as: PlatformAdmin, captures: { m1: $.data.id, m1_v: $.data.version } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-231", machine_type: "MILL", year_of_manufacture: 2019, control_generation: "LEGACY", spindle_hours: 30000 }, as: PlatformAdmin, captures: { m2: $.data.id, m2_v: $.data.version } }
          trigger:
            - { call: "POST /api/machines/${m1}/assessments", payload: { positioning_deviation_microns: 4, spindle_runout_microns: 2, backlash_microns: 3, scope_notes: "light", expected_machine_version: "${m1_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a1_wear: $.data.wear_index, a1_path: $.data.recommended_path } }
            - { call: "POST /api/machines/${m2}/assessments", payload: { positioning_deviation_microns: 16, spindle_runout_microns: 0, backlash_microns: 0, scope_notes: "band edge", expected_machine_version: "${m2_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a2_wear: $.data.wear_index, a2_path: $.data.recommended_path } }
          assert:
            - "assessment 1: wear_index == 20.0, recommended_path == RETROFIT_ONLY (< 40.00)"
            - "assessment 2: wear_index == 40.0 exactly (0.5*0.8), recommended_path == MECHANICAL_REBUILD (>= 40.00 inclusive)"

      - name: warranty_months_by_decision_class
        claim_type: constants_applied
        grounds: [calculations.warranty_end, calculations.sessions_required]
        distinguishing_aspect: "RETROFIT_ONLY class constants: sessions_required == 1 and warranty_months == 6, so delivery at 2026-06-01 yields warranty_end 2026-12-01T00:00:00Z."
        test_recipe:
          setup: ["RETROFIT_ONLY project (wear 20.00, quote 26770000 = 25000000 + 900000 + 870000) driven to HANDOVER_READY; clock pinned to 2026-06-01"]
          setup_api_calls:
