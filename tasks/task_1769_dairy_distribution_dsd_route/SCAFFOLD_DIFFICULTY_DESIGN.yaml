            - { call: "POST /dairy/orders/${oa}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /dairy/orders/${ob}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/trips/${t1}/temperature-readings"
              payload: { recorded_at: "2026-08-10T04:30:00Z", temp_tenths_f: 380, zone: "BOX" }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "POST /dairy/trips/${t1}/depart", payload: {}, as: RouteDriver, as_user_id: "${dr1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/orders/${oa}/deliver"
              payload: { delivered_lines: [{ product_id: "${p1}", delivered_units: 10, scanned_code_date: "2026-08-25" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - call: "POST /dairy/orders/${ob}/deliver"
              payload: { delivered_lines: [{ product_id: "${pl}", delivered_units: 2, scanned_code_date: "2026-09-01" }] }
              as: RouteDriver
              as_user_id: "${dr1}"
            - { call: "GET /dairy/invoices?order_id=${oa}", as: Any, captures: { inva: "$.data[0].id" } }
            - { call: "GET /dairy/invoices?order_id=${ob}", as: Any, captures: { invb: "$.data[0].id" } }
            - call: "POST /dairy/invoices/${inva}/payments"
              payload: { amount_cents: 2188 }
              as: StoreReceiver
              as_user_id: "${s1}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/returns"
              payload: { order_id: "${oa}", store_id: "${s1}", pickup_trip_id: "${t1}", product_id: "${p1}", quantity_units: 4, reason_code: "OUT_OF_CODE", scanned_code_date: "2026-08-25" }
              as: RouteDriver
              as_user_id: "${dr1}"
              captures: { ret1: "$.data.id" }
            - { call: "POST /dairy/returns/${ret1}/approve", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "GET /dairy/credit-memos?store_id=${s1}", as: Any, captures: { memo1: "$.data[0].id", memo_status_pre: "$.data[0].status", memo_applied_pre: "$.data[0].applied_cents" } }
            - { call: "GET /dairy/invoices/${invb}", as: Any, captures: { invb_due_applied: "$.data.amount_due_cents", invb_status_applied: "$.data.status" } }
          trigger:
            - { call: "POST /dairy/credit-memos/${memo1}/void", payload: {}, as: TerritoryManager, captures: { memo_status_post: "$.data.status" } }
            - { call: "GET /dairy/invoices/${invb}", as: Any, captures: { invb_due_restored: "$.data.amount_due_cents", invb_status_restored: "$.data.status", invb_credits_restored: "$.data.credits_applied_cents" } }
          assert:
            - "memo_applied_pre == 500 and memo_status_pre == PARTIALLY_APPLIED (auto-apply capped at INV_B's due; own invoice INV_A was SETTLED)"
            - "invb_due_applied == 0 and invb_status_applied == SETTLED (forward action)"
            - "memo_status_post == VOID (compensating action)"
            - "invb_due_restored == 500 and invb_status_restored == OPEN and invb_credits_restored == 0 (invariant: apply then void leaves amount_due exactly unchanged)"
