            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_tool
            - *c_price
            - *c_enterprod
            - call: "POST /brand-ops/product-lines/${line_e_id}/launch"
