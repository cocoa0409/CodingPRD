              captures: { ship_4_id: $.data.id }
            - call: "POST /vendor-shipments/${ship_1_id}/receive"
              payload: { arrived_at: "2026-09-02T09:00:00Z", bucket_units_reported: 60 }
              as: CrossDockOperator
          trigger:
            - call: "POST /vendor-shipments/${ship_2_id}/receive"
              payload: { arrived_at: "2026-09-02T09:30:00Z", bucket_units_reported: 40 }
              as: CrossDockOperator
            - call: "POST /vendor-shipments/${ship_3_id}/receive"
              payload: { arrived_at: "2026-09-02T10:00:00Z", bucket_units_reported: 30 }
              as: CrossDockOperator
              captures: { err_capacity_id: $.data.error_id }
            - call: "POST /vendor-shipments/${ship_4_id}/receive"
              payload: { arrived_at: "2026-09-02T11:00:00Z", bucket_units_reported: 20 }
              as: CrossDockOperator
              captures: { err_capacity_wide_id: $.data.error_id }
            - call: "POST /vendor-shipments/${ship_1_id}/reject"
              payload: { reason_code: "DAMAGED_IN_TRANSIT" }
              as: CrossDockOperator
            - call: "POST /vendor-shipments/${ship_4_id}/receive"
              payload: { arrived_at: "2026-09-02T11:00:00Z", bucket_units_reported: 20 }
              as: CrossDockOperator
          assert:
            - "the 06:00Z bucket holds exactly 100 units after the first two receives — 60 then 40 — and three shipments of three different orders sat inside it"
            - "the third receive is refused with 409 ERR_DOCK_BUCKET_CAPACITY_EXCEEDED because 100 + 30 > 100, and it is refused at the bucket level rather than against any single previous shipment"
            - "the fourth receive is also refused at the same 100-unit ceiling even though its own 20 units alone would fit — the conflict is with the aggregate, not with a neighbour"
            - "rejecting the first shipment releases its 60 units: after POST /vendor-shipments/${ship_1_id}/reject the bucket holds only 40"
            - "the fourth receive then succeeds and the bucket returns to exactly 60"
            - "the 12:00Z bucket is untouched throughout, so the rejection released capacity in one bucket without leaking into the next"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: buy_cancellation_restores_listing_units_ordered_exactly
        grounds:
          - state_machines.PurchaseOrder.ISSUED_to_CANCELLED
          - state_machines.PurchaseOrder.DRAFT_to_ISSUED
          - state_machines.Confirmation.PURCHASE_ORDER_ISSUED_to_VENDOR_CONFIRMED
          - calculations.event_filled_units_reconciliation
        distinguishing_aspect: |
          The conserved quantity is UNITS OF DEMAND on a listing: issuing a buy and then cancelling it
          must leave Listing.units_ordered and Event.units_ordered_total exactly where they started,
          because the compensation restores the line to VENDOR_CONFIRMED rather than dropping it.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1 STANDARD/EXCELLENT, Shop S1 OPEN, Event E1 LIVE with a 14-day quote, Listing L1 allocation 10 at 300 cents."
            - "Customer C1's order O1 carries one 4-unit line on L1, submitted and vendor-confirmed, so confirmation_status is VENDOR_CONFIRMED and Listing.units_ordered is 4."
            - "A DRAFT buy PO1 covers L1 with one POLine of quantity_ordered 4 and has not been issued yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Conservation Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-CONS-1", unit_price_cents: 300, vendor_unit_cost_cents: 180, allocation_units: 10, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 4 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Any
              captures: { listing_units_after_submit: $.data.units_ordered }
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 4 }
              as: InventoryPlanner
            - call: "POST /confirmations/${line_id}/confirm"
              payload: { confirm_units: 4 }
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "GET /events/${event_id}"
              payload: {}
              as: Any
              captures: { units_ordered_before: $.data.units_ordered_total, po_committed_before: $.data.units_po_committed_total }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/cancel"
              payload: { reason_code: "VENDOR_CAPACITY_LOST" }
              as: InventoryPlanner
          assert:
            - "before the issue, Event.${event_id}.units_ordered_total == 4 and units_po_committed_total == 0"
            - "after the issue, Event.units_po_committed_total == 4 and Event.units_ordered_total is still 4 — the forward action moved only the committed quantity"
            - "after the cancel, Event.${event_id}.units_po_committed_total == ${po_committed_before} == 0, exactly restoring the named quantity"
            - "after the cancel, Event.${event_id}.units_ordered_total == ${units_ordered_before} == 4 unchanged, because the invariant is defined over demand and not over the buy"
            - "Listing.${listing_id}.units_ordered was ${listing_units_after_submit} == 4 immediately after submission and is still 4 after the cancel, so the buy never moved the listing counter in the first place"
            - "Confirmation.${line_id}.confirmation_status == VENDOR_CONFIRMED and Listing.${listing_id}.units_ordered == 4, so the compensating hop restored the line rather than cancelling it"
            - "CustomerOrder.${order_id}.cancellation_waived is false again, matching its value before the issue"
            - "no drift: the difference units_ordered_total - units_po_committed_total is 4 before the issue and 4 after the cancel"

      - name: refund_payout_restores_customer_refund_balance_exactly
        grounds:
          - calculations.order_refund_claim
          - calculations.customer_refund_balance_reconciliation
          - state_machines.CustomerOrder.CAPTURED_to_PARTIALLY_REFUNDED
          - endpoints.POST_/customers/{id}/payouts
        distinguishing_aspect: |
          The conserved quantity is CENTS OF OWED REFUND, a different type from the unit quantity of
          the other instance: issuing a 600-cent refund and then paying it out must leave
          Customer.refund_balance_cents exactly at its pre-refund value while the ledger's net across
          the two compensating rows is zero.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1 STANDARD/EXCELLENT, Shop S1 OPEN, Event E1 LIVE with a 14-day quote, Listing L1 allocation 10 at 300 cents."
            - "Order O1 carries one 5-unit line, submitted, bought on PO1, captured, and then short-shipped at confirmed_units 3 so the line owes a 2-unit refund."
            - "Customer C1's refund_balance_cents is 0 and the ledger is empty before the compensation runs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Refund Conservation Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-CONS-2", unit_price_cents: 300, vendor_unit_cost_cents: 180, allocation_units: 10, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 5 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 5 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /confirmations/${line_id}/confirm"
              payload: { confirm_units: 3 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /orders/${order_id}/capture"
              payload: {}
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/close-short"
              payload: { force_close: true }
              as: InventoryPlanner
          trigger:
            - call: "GET /customers/${customer_id}"
              payload: {}
              as: Any
              captures: { refund_balance_before: $.data.refund_balance_cents }
            - call: "POST /orders/${order_id}/refunds"
              payload: { write_off_full_line: false }
              as: InventoryPlanner
            - call: "POST /customers/${customer_id}/payouts"
              payload: { amount_cents: 600, idempotency_key: "payout-cons-1" }
              as: CustomerService
          assert:
            - "Confirmation.${line_id}.short_shipped_units == 2 so the owed amount is exactly 600 cents at 300 cents per unit"
            - "before the refund, Customer.${customer_id}.refund_balance_cents == ${refund_balance_before} == 0"
            - "after POST /orders/${order_id}/refunds the balance is 600, matching the named quantity the forward action moved"
            - "after POST /customers/${customer_id}/payouts the balance is back to 0, exactly the pre-refund value"
            - "getting the compensation right is not enough on its own: GET /customers/${customer_id}/credit-ledger returns exactly 2 rows, a +600 issuance and a -600 payout, and GET /customers/${customer_id} still reports exactly 0"
            - "both the refund and the payout carry source_kind in the {OVERSELL, SHORT_SHIP, CANCELLATION} set that customer_refund_balance_reconciliation sums, and their amounts cancel to exactly 0"
            - "replaying POST /customers/${customer_id}/payouts with the same idempotency_key payout-cons-1 returns the original row and leaves the balance at 0, so the compensation cannot be applied twice"
