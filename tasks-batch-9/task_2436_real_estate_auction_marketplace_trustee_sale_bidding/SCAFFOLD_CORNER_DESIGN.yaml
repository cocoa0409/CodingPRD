        distinguishing_aspect: "Scheduling and compliance are separate authorities: AuctionOps owns events, lots and reserves but cannot verify identity or write exclusions, ComplianceOfficer owns KYC but cannot schedule, and registration itself is the one write reserved to Anonymous — so even PlatformAdmin cannot register a bidder."
