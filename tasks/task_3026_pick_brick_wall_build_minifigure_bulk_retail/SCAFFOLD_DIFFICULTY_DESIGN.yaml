  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: member_cycles_between_active_and_suspended
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - calculations.replacement_request_budget
        distinguishing_aspect: "Member is cyclic rather than a pipeline: a suspended member can be reinstated and then suspended again, so the same row visits SUSPENDED twice with the reinstatement resetting the no-show count each time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0006 with wall_bin_capacity_grams 2000 and one bin holding 600 g, so the reinstatement edge of 500 g is met."
          setup_api_calls:
