              as: VenueAdmin
              captures: { uj_util_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
              payload: { amount_cents: 200000 }
              as: VenueAdmin
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
