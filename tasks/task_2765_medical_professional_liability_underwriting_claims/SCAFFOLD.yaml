  # --- RateFiling -----------------------------------------------------------
  - method: POST
    path: "/mpl/rate-filings"
    description: "Draft a rate filing for a specialty class and run the experience, indication and reserve-adequacy block"
    roles: [ActuarialAnalyst, ChiefActuary]
    code: 201
    input: [specialty_class_id, indication_method, proposed_rate_change_pct, experience_period_start, experience_period_end, effective_date]
    output: RateFiling
    side_effects:
      - "filing_number assigned as RF- plus the next 6-digit zero-padded creation sequence"
      - "prepared_by_user_id set to the acting X-User-ID and status initialised to DRAFT"
      - "reserve_adequacy_ratio and rate_indication run, populating the whole actuarial block including adequacy_flag"

  - method: GET
    path: "/mpl/rate-filings/{id}"
    description: "Read one rate filing with its actuarial block"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: []
    output: RateFiling
    side_effects: []

  - method: GET
    path: "/mpl/rate-filings"
    description: "List rate filings, filterable by specialty class, state and adequacy verdict"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["specialty_class_id?", "status?", "adequacy_flag?", "indication_method?", "limit?", "offset?"]
    output: RateFiling[]
    side_effects: []

  - method: POST
    path: "/mpl/rate-filings/{id}/submission"
    description: "Submit the filing for decision, refreshing the whole actuarial block against current data"
    roles: [ActuarialAnalyst, ChiefActuary]
    code: 200
    input: []
    output: RateFiling
    side_effects:
      - "status set to SUBMITTED"
      - "reserve_adequacy_ratio and rate_indication re-run, refreshing claim_count_in_scope, in_scope_premium_total, actuarial_incurred_total, experience_loss_ratio, indicated_change_pct, credibility_weight, credibility_weighted_indication_pct, carried_reserve_total, required_reserve_total, reserve_adequacy_ratio and adequacy_flag"

  - method: POST
    path: "/mpl/rate-filings/{id}/decision"
    description: "Approve, reject or withdraw a filing; approval rewrites the specialty base rate and re-rates every drafted term"
    roles: [ChiefActuary]
    code: 200
    input: [decision, decision_note]
    output: RateFiling
    side_effects:
      - "status set to APPROVED, REJECTED or WITHDRAWN; decided_by_user_id and decision_note recorded"
      - "on APPROVE only: approved_rate_change_pct recorded, SpecialtyClass.base_rate_per_million rewritten, SpecialtyClass.rate_revision_index incremented, last_approved_rate_change_pct recorded"
      - "on APPROVE only: every DRAFT PolicyTerm on policies of insureds in the class is re-rated and each affected Policy.quoted_premium_total recomputed"

  # --- Analytics ------------------------------------------------------------
  - method: GET
    path: "/mpl/analytics/severity-trend"
    description: "Computed read: paid severity, benchmark trend index, verdict split and top allegation by specialty and venue"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["specialty_class_id", "venue_code?", "from_report_date?", "to_report_date?"]
    output: { specialty_class_id, venue_code, closed_severity_claim_count, paid_indemnity_total, paid_severity_avg, benchmark_severity, trend_index, defense_verdict_count, plaintiff_verdict_count, defense_win_rate, top_allegation_category }
    side_effects: []

  # --- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/mpl/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Setting the clock runs the scheduled checkpoints in a pinned order."
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc, promoted_term_ids, expired_term_ids, expired_enrollment_ids, lapsed_insured_ids, closed_claim_ids }
    side_effects:
      - "step 1: the logical clock is set to to_iso8601"
      - "step 2: PolicyTerm rows with status == ISSUED and effective_date <= the new date are promoted to IN_FORCE, ordered by effective_date ASC then created_at ASC"
      - "step 3: PolicyTerm rows with status == IN_FORCE and expiration_date <= the new date are EXPIRED, same ordering, then each Policy.status and current_term_id re-derived"
      - "step 4: RiskProgramEnrollment rows with status == COMPLETED and expires_on <= the new date are EXPIRED, then program_credit_pct recomputed and DRAFT terms re-rated"
      - "step 5: Insured rows with credentialing_status IN {CREDENTIALED, PROVISIONAL} and credentialing_expires_on < the new date become LAPSED, and any that were ACTIVE become SUSPENDED"
      - "step 6: Claim rows with claim_status == RESOLVED and resolved_on + 30 days <= the new date become CLOSED with closed_on set to the new date"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an actor with role Insured addresses a claim, policy, term, tail, negotiation or insured record whose insured_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals SettlementNegotiation.prepared_by_user_id on an authority decision, or equals RateFiling.prepared_by_user_id on a rate-filing APPROVE or REJECT"

  # --- request shape --------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "a required field is missing, an enum value is not a declared member, a money field is negative or carries more than 2 decimal places, a declared numeric range is breached, specialty_code duplicates an existing class, expiration_date is not after effective_date, votes_for is not greater than votes_against, suit_filed_on or resolved_on precedes report_date, or disposition == SETTLED is submitted to the disposition endpoint"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1, 100] or offset negative or non-integer"

  # --- existence ------------------------------------------------------------
  - id: ERR_SPECIALTY_CLASS_NOT_FOUND
    http: 404
    condition: "no SpecialtyClass matches the addressed id or the supplied specialty_class_id"
  - id: ERR_INSURED_NOT_FOUND
    http: 404
    condition: "no Insured matches the addressed id or the supplied insured_id"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "no RiskProgramEnrollment matches the addressed id"
  - id: ERR_PEER_REVIEW_CASE_NOT_FOUND
    http: 404
    condition: "no PeerReviewCase matches the addressed id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no Policy matches the addressed id"
  - id: ERR_POLICY_TERM_NOT_FOUND
    http: 404
    condition: "no PolicyTerm matches the addressed id, the supplied predecessor_term_id, or the supplied triggering_term_id, or the referenced term belongs to a different Policy than the one addressed"
  - id: ERR_TAIL_ENDORSEMENT_NOT_FOUND
    http: 404
    condition: "no TailEndorsement matches the addressed id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no Claim matches the addressed id"
  - id: ERR_COUNSEL_FIRM_NOT_FOUND
    http: 404
    condition: "no DefenseCounselFirm matches the addressed id"
  - id: ERR_COUNSEL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no CounselAssignment matches the addressed id or the supplied counsel_assignment_id"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "no SettlementNegotiation matches the addressed id"
  - id: ERR_NPDB_REPORT_NOT_FOUND
    http: 404
    condition: "no NPDBReport matches the addressed id"
  - id: ERR_RATE_FILING_NOT_FOUND
    http: 404
    condition: "no RateFiling matches the addressed id"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the Claim's current version on a reserve-entry or settlement-negotiation create"
  - id: ERR_STALE_INSURED_VERSION
    http: 412
    condition: "expected_insured_version does not equal the Insured's current version on an enrollment create"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not equal the Policy's current version on a term create"

  # --- state preconditions --------------------------------------------------
  - id: ERR_INSURED_STATE_INVALID
    http: 409
    condition: "a new Policy is quoted for an Insured whose status is SUSPENDED"
  - id: ERR_ENROLLMENT_STATE_INVALID
    http: 409
    condition: "completion is recorded on a RiskProgramEnrollment that is not ENROLLED"
  - id: ERR_PEER_REVIEW_STATE_INVALID
    http: 409
    condition: "a review track is recorded on a case that is not REFERRED or IN_REVIEW, or a committee vote is recorded on a case that is not REVIEWS_COMPLETE"
  - id: ERR_TERM_STATE_INVALID
    http: 409
    condition: "issuance is attempted on a term that is not DRAFT, cancellation on a term that is not ISSUED or IN_FORCE, a triggering_term_id that is not EXPIRED or CANCELLED_PRO_RATA, or a predecessor_term_id that is CANCELLED_FLAT"
  - id: ERR_TAIL_STATE_INVALID
    http: 409
    condition: "issuance is attempted on a TailEndorsement that is not QUOTED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "an operation is attempted from a claim_status the Claim state machine does not permit for it"
  - id: ERR_COVERAGE_ALREADY_DECIDED
    http: 409
    condition: "a coverage decision is recorded on a Claim whose coverage_status is already COVERED or DENIED"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "a decline is recorded on a CounselAssignment that is not ASSIGNED, or an expense payment names an assignment that is not ASSIGNED"
  - id: ERR_NEGOTIATION_STATE_INVALID
    http: 409
    condition: "a negotiation transition is attempted from a status the SettlementNegotiation state machine does not permit for that trigger"
  - id: ERR_NPDB_STATE_INVALID
    http: 409
    condition: "submission or void is attempted on an NPDBReport that is not PENDING"
  - id: ERR_FILING_STATE_INVALID
    http: 409
    condition: "submission is attempted on a RateFiling that is not DRAFT, APPROVE or REJECT on a filing that is not SUBMITTED, or WITHDRAW on a filing that is neither DRAFT nor SUBMITTED"

  # --- safety / compliance --------------------------------------------------
  - id: ERR_CREDENTIALING_NOT_VALID_FOR_TERM
    http: 409
    condition: "a term is issued while the Insured's credentialing_status is not CREDENTIALED or PROVISIONAL, or while credentialing_expires_on precedes the term's effective_date"
  - id: ERR_COVERAGE_DENIED_NO_DEFENSE
    http: 409
    condition: "counsel is assigned to, or a settlement negotiation is opened on, a Claim whose coverage_status is DENIED or which resolved to no responding coverage"
  - id: ERR_CONSENT_REQUIRED
    http: 409
    condition: "consent is requested on a negotiation whose consent_clause_applied is NONE, or payment is attempted from AUTHORITY_GRANTED while consent_clause_applied is ABSOLUTE or HAMMER"
  - id: ERR_HAMMER_NOT_AVAILABLE
    http: 409
    condition: "the hammer clause is invoked on a negotiation whose consent_clause_applied is not HAMMER"
  - id: ERR_RESERVE_DEFICIENCY_BLOCKS_FILING
    http: 409
    condition: "a RateFiling whose adequacy_flag is DEFICIENT is approved"
  - id: ERR_NPDB_SUBMISSION_DATE_INVALID
    http: 422
    condition: "submitted_on precedes the report's payment_date"

  # --- temporal -------------------------------------------------------------
  - id: ERR_REPORT_DATE_BEFORE_INCIDENT
    http: 422
    condition: "a claim is intaken with report_date earlier than incident_date"
  - id: ERR_RETRO_DATE_INVALID
    http: 422
    condition: "retroactive_date is omitted on a CLAIMS_MADE policy, or supplied on an OCCURRENCE policy"
  - id: ERR_EXPERIENCE_PERIOD_INVALID
    http: 422
    condition: "experience_period_end is not after experience_period_start, or the filing's effective_date precedes experience_period_end"
  - id: ERR_TERM_PERIOD_GAP
    http: 422
    condition: "predecessor_term_id is supplied and the new term's effective_date does not exactly equal the predecessor's expiration_date"
  - id: ERR_TERM_PERIOD_OVERLAP
    http: 409
    condition: "the new term's half-open period intersects the period of an existing non-flat-cancelled term on the same Policy; touching at a single shared endpoint is not an intersection"
  - id: ERR_CANCEL_DATE_INVALID
    http: 422
    condition: "cancel_effective_date does not equal effective_date on a FLAT cancellation, or does not lie strictly inside the term period on a PRO_RATA cancellation"
  - id: ERR_TAIL_EFFECTIVE_DATE_INVALID
    http: 422
    condition: "the tail's effective_date precedes the triggering term's expiration_date, or its cancel_effective_date when the term was cancelled pro rata"
  - id: ERR_TAIL_WINDOW_OVERLAP
    http: 409
    condition: "the tail's closed reporting window intersects the closed window of an ISSUED tail on the same Policy; because both endpoints are inclusive, sharing a single date is an intersection"

  # --- constraint -----------------------------------------------------------
  - id: ERR_TAIL_NOT_APPLICABLE
    http: 422
    condition: "a tail endorsement is quoted on an OCCURRENCE policy"
  - id: ERR_DDR_NOT_ELIGIBLE
    http: 422
    condition: "tail_type is DEATH_DISABILITY_RETIREMENT while Insured.years_in_practice is below 5 or the triggering term's claims_made_step_year is below 5"
  - id: ERR_TAIL_ALREADY_ISSUED
    http: 409
    condition: "issuance is attempted while another TailEndorsement on the same triggering_term_id is already ISSUED"
  - id: ERR_DUPLICATE_PROGRAM_ENROLLMENT
    http: 409
    condition: "the Insured already has an ENROLLED RiskProgramEnrollment for the same program_code"
  - id: ERR_REVIEW_TRACK_ALREADY_RECORDED
    http: 409
    condition: "the submitted review_track has already been recorded on the PeerReviewCase"
  - id: ERR_COUNSEL_ALREADY_ASSIGNED
    http: 409
    condition: "counsel is assigned to a Claim that already holds an ASSIGNED CounselAssignment"
  - id: ERR_AUTHORITY_GRANT_EXCEEDS_REQUEST
    http: 422
    condition: "granted_amount exceeds authority_requested, is zero or negative, is omitted on a GRANT, or is supplied on a DENY"
  - id: ERR_RESERVE_METHOD_INPUT_MISMATCH
    http: 422
    condition: "method is CASE_BASIS without both indemnity_amount and expense_amount, or FORMULA_BASIS with either supplied"

  # --- referential ----------------------------------------------------------
  - id: ERR_ASSIGNMENT_CLAIM_MISMATCH
    http: 422
    condition: "the supplied counsel_assignment_id belongs to a different Claim than the one addressed"
  - id: ERR_NO_ELIGIBLE_COUNSEL
    http: 409
    condition: "counsel_panel_selection produced an empty candidate pool for the claim's venue, allegation category, conflicts, capacity and exclusion list"

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_AUTHORITY_INSUFFICIENT
    http: 409
    condition: "the negotiation's proposed_amount exceeds the authority_granted at payment time"
  - id: ERR_AGGREGATE_LIMIT_EXCEEDED
    http: 409
    condition: "the amount being disbursed exceeds the responding term's aggregate_limit_remaining"
  - id: ERR_PER_CLAIM_LIMIT_EXCEEDED
    http: 422
    condition: "the amount being negotiated or disbursed exceeds the Policy's limit_per_claim less the Claim's paid_indemnity"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: UnderwritingOfficer
    description: "Owns the underwriting surface: insureds, credentialing verdicts, risk-management enrollments, policies, terms, issuance, cancellation and tail endorsements"
    identity: "opaque"
    exclusive_operations:
      - "POST /mpl/insureds"
      - "POST /mpl/insureds/{id}/credentialing-decision"
      - "POST /mpl/insureds/{id}/enrollments"
      - "POST /mpl/enrollments/{id}/completion"
      - "POST /mpl/policies"
      - "POST /mpl/policies/{id}/terms"
      - "POST /mpl/policy-terms/{id}/issuance"
      - "POST /mpl/policy-terms/{id}/cancellation"
      - "POST /mpl/policies/{id}/tail-endorsements"
      - "POST /mpl/tail-endorsements/{id}/issuance"
    shared_operations:
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: ClaimsAdjuster
    description: "Owns day-to-day claim handling: intake, coverage positions, reserves, litigation, expense payments, counsel assignment and settlement negotiation preparation"
    identity: "opaque"
    exclusive_operations:
      - "POST /mpl/claims"
      - "POST /mpl/claims/{id}/coverage-decision"
      - "POST /mpl/claims/{id}/reserve-entries"
      - "POST /mpl/claims/{id}/litigation"
      - "POST /mpl/claims/{id}/expense-payments"
      - "POST /mpl/claims/{id}/disposition"
      - "POST /mpl/claims/{id}/counsel-assignments"
      - "POST /mpl/counsel-assignments/{id}/decline"
      - "POST /mpl/settlement-negotiations/{id}/consent-request"
      - "POST /mpl/settlement-negotiations/{id}/revision"
      - "POST /mpl/settlement-negotiations/{id}/payment"
    shared_operations:
      - "POST /mpl/claims/{id}/settlement-negotiations (shared with ClaimsCommitteeApprover)"
      - "POST /mpl/peer-review-cases (shared with PeerReviewChair)"
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: ClaimsCommitteeApprover
    description: "Grants settlement authority, invokes the hammer clause and administers the defence panel; may never decide authority on a negotiation it prepared"
    identity: "opaque"
    exclusive_operations:
      - "POST /mpl/settlement-negotiations/{id}/authority-decision"
      - "POST /mpl/settlement-negotiations/{id}/hammer-invocation"
      - "POST /mpl/counsel-firms"
      - "POST /mpl/counsel-firms/{id}/panel-status"
    shared_operations:
      - "POST /mpl/claims/{id}/settlement-negotiations (shared with ClaimsAdjuster)"
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: PeerReviewChair
    description: "Runs the peer review process: referral, the two independent review tracks and the committee vote"
    identity: "opaque"
    exclusive_operations:
      - "POST /mpl/peer-review-cases/{id}/reviews"
      - "POST /mpl/peer-review-cases/{id}/committee-vote"
    shared_operations:
      - "POST /mpl/peer-review-cases (shared with ClaimsAdjuster)"
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: ActuarialAnalyst
    description: "Publishes rating specialty classes and prepares rate filings; may submit but never approve or reject a filing"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /mpl/specialty-classes (shared with ChiefActuary)"
      - "POST /mpl/rate-filings (shared with ChiefActuary)"
      - "POST /mpl/rate-filings/{id}/submission (shared with ChiefActuary)"
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: ChiefActuary
    description: "Decides rate filings; may not approve or reject a filing it prepared, but may withdraw its own"
    identity: "opaque"
    exclusive_operations:
      - "POST /mpl/rate-filings/{id}/decision"
    shared_operations:
      - "POST /mpl/specialty-classes (shared with ActuarialAnalyst)"
      - "POST /mpl/rate-filings (shared with ActuarialAnalyst)"
      - "POST /mpl/rate-filings/{id}/submission (shared with ActuarialAnalyst)"
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Owns national practitioner data bank reporting: transmission and voiding of reporting obligations"
    identity: "opaque"
    exclusive_operations:
      - "POST /mpl/npdb-reports/{id}/submission"
      - "POST /mpl/npdb-reports/{id}/void"
    shared_operations:
      - "every GET endpoint except GET endpoints restricted to the addressed Insured"
      - "POST /mpl/_clock/set_current_utc"

  - name: Insured
    description: "The physician or facility named on the policy; exercises the consent-to-settle right and reads only its own records"
    identity: "entity_backed:Insured"
    exclusive_operations:
      - "POST /mpl/settlement-negotiations/{id}/consent-response"
    shared_operations:
      - "GET /mpl/insureds/{id}, GET /mpl/policies/{id}, GET /mpl/policy-terms/{id}, GET /mpl/tail-endorsements/{id}, GET /mpl/claims/{id} and GET /mpl/settlement-negotiations/{id}, each restricted to resources whose insured_id equals X-User-ID"
