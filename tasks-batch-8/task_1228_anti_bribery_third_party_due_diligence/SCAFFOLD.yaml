# =============================================================================
# Task 1228 — Anti-Bribery & Third-Party Due Diligence (FCPA) — SCAFFOLD
# =============================================================================

scenario: |
  1228. Anti-Bribery & Third-Party Due Diligence (FCPA): counterparty risk scoring by country/industry/government touchpoint, due diligence questionnaire & screening (PEP/adverse media), red-flag escalation & enhanced review, contract clause & certification requirement, commission/payment reasonableness review, gift & hospitality pre-approval registry, periodic re-diligence & termination triggers, audit rights exercise & training

domain_name: anti-bribery-due-diligence
api_prefix: /compliance

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat            # peer entities joined by foreign keys; no URL nesting below one sub-resource level
  state_machine_shape: cyclic      # questionnaire RETURNED→SUBMITTED loop; ThirdParty DD_REVIEW→ENHANCED_REVIEW→DD_REVIEW; APPROVED⇄SUSPENDED
  relationship_patterns:
    - one_to_many                  # ThirdParty → checks/questionnaires/flags/cases/contracts/certs/payments/gifts/cycles/audits
    - cross_aggregate              # PaymentRequest→Contract→ThirdParty; Contract gates on ThirdParty state
    - polymorphic                  # RedFlag.source_type + source_ref_id points at ScreeningCheck | AuditExercise | null
  role_model: segregation_of_duties  # maker≠checker on payments (submit/approve, approve/reverse) and escalations (escalate/decide)
  consistency_model: immediate
  difficulty_target: beyond_expert  # 14 entities, 59 endpoints, 30 error codes, 5 calculations, 12 state machines

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CountryRiskProfile
    parent: null
    common_fields: true
    fields:
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 code, unique across profiles" }
      - { name: cpi_score, type: integer, source: input, description: "Corruption Perceptions Index 0-100; higher = cleaner. country_norm = 100 - cpi_score", constraints: "0 <= cpi_score <= 100" }
      - { name: sanctioned, type: boolean, source: input, description: "Comprehensive sanctions flag; true forces any third party in this country to score 100 / CRITICAL", default: false }

  - name: RiskScoringPolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED; at most one ACTIVE at any time", constraints: "enum: DRAFT, ACTIVE, SUPERSEDED" }
      - { name: w_country, type: integer, source: input, description: "Weight of country_norm component; w_country + w_industry + w_touchpoint MUST equal 100" }
      - { name: w_industry, type: integer, source: input, description: "Weight of industry component" }
      - { name: w_touchpoint, type: integer, source: input, description: "Weight of government touchpoint component" }
      - { name: tier_medium_min, type: integer, source: input, description: "score >= tier_medium_min -> MEDIUM (inclusive boundary)" }
      - { name: tier_high_min, type: integer, source: input, description: "score >= tier_high_min -> HIGH (inclusive boundary)" }
      - { name: tier_critical_min, type: integer, source: input, description: "score >= tier_critical_min -> CRITICAL (inclusive boundary)" }
      - { name: commission_base_cap_pct, type: number, source: input, description: "Base commission cap percent of contract value before country multiplier (2 decimal places)" }
      - { name: commission_hard_cap_pct, type: number, source: input, description: "Absolute ceiling percent; ratio strictly greater than this can never be approved" }

  - name: ThirdParty
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the counterparty" }
      - { name: country_code, type: string, source: input, description: "Lookup key matched against CountryRiskProfile.country_code (not an id reference)" }
      - { name: industry, type: enum, source: input, description: "Industry risk bucket", constraints: "enum: TECHNOLOGY(20), LOGISTICS(40), CONSULTING(60), CONSTRUCTION(70), GOVERNMENT_RELATIONS(90); parenthesized value is industry_score" }
      - { name: government_touchpoint, type: enum, source: input, description: "Degree of interaction with government officials", constraints: "enum: NONE(0), INDIRECT(50), DIRECT(100); parenthesized value is touchpoint_score" }
      - { name: sponsor_user_id, type: string, source: system, description: "X-User-ID of the creating BusinessSponsor; ownership checks compare against this" }
      - { name: onboarding_status, type: enum, source: system, description: "DRAFT | SCREENING | DD_REVIEW | ENHANCED_REVIEW | APPROVED | REJECTED | SUSPENDED | TERMINATED", constraints: "see state_machines.ThirdParty" }
      - { name: risk_score_provisional, type: integer, source: computed, description: "Base-only weighted score 0-100 computed at submit; null while DRAFT" }
      - { name: risk_score_final, type: integer, source: computed, description: "Provisional + questionnaire modifier + screening modifier, clamped 0-100; computed when the current questionnaire is ACCEPTED; null until then" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH | CRITICAL derived from the latest computed score via policy thresholds (>= boundaries); sanctioned country forces CRITICAL", constraints: "enum: LOW, MEDIUM, HIGH, CRITICAL" }
      - { name: approval_tier_snapshot, type: enum, source: system, description: "risk_tier pinned at the moment of approval; contract clause requirements key off this snapshot, not the live tier", constraints: "enum: LOW, MEDIUM, HIGH, CRITICAL; null until first approval" }
      - { name: approved_policy_id, type: string, source: system, description: "Snapshot pin: id of the RiskScoringPolicy that was ACTIVE at approval; null until first approval" }
      - { name: diligence_expires_at, type: datetime, source: computed, description: "Approval date + tier re-diligence interval (LOW/MEDIUM 365d, HIGH 180d, CRITICAL 90d); null until approved" }
      - { name: gov_gift_rolling_12m_cents, type: integer, source: computed, description: "Rolling 365-day sum of value_usd_cents over this third party's APPROVED gift entries with recipient_is_government_official=true; recomputed on entry create/approve/void" }

  - name: ScreeningCheck
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: check_type, type: enum, source: system, description: "PEP | ADVERSE_MEDIA | SANCTIONS; exactly one of each is auto-created at submit", constraints: "enum: PEP, ADVERSE_MEDIA, SANCTIONS" }
      - { name: check_status, type: enum, source: system, description: "QUEUED | CLEAR | POTENTIAL_HIT | HIT_CONFIRMED | HIT_DISMISSED", constraints: "see state_machines.ScreeningCheck" }
      - { name: match_detail, type: string, source: input, description: "Analyst-supplied description of the matched subject; required when outcome is POTENTIAL_HIT" }

  - name: Questionnaire
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: questionnaire_status, type: enum, source: system, description: "ISSUED | SUBMITTED | RETURNED | ACCEPTED | SUPERSEDED", constraints: "see state_machines.Questionnaire" }
      - { name: government_ownership_pct, type: integer, source: input, description: "0-100; >0 contributes +10 to final score modifier", constraints: "0 <= value <= 100" }
      - { name: has_facilitation_payments, type: boolean, source: input, description: "true contributes +15 to final score modifier" }
      - { name: uses_sub_agents, type: boolean, source: input, description: "true contributes +5 to final score modifier" }
      - { name: red_flag_count, type: integer, source: computed, description: "Count of risky answers among {government_ownership_pct>0, has_facilitation_payments, uses_sub_agents}; computed at submit; null before first submit" }
      - { name: return_note, type: string, source: input, description: "Officer note explaining a RETURNED disposition" }

  - name: RedFlag
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: source_type, type: enum, source: system, description: "SCREENING | QUESTIONNAIRE | AUDIT | SYSTEM | MANUAL", constraints: "enum: SCREENING, QUESTIONNAIRE, AUDIT, SYSTEM, MANUAL" }
      - { name: source_ref_id, type: string, source: system, description: "Polymorphic reference: ScreeningCheck.id when source_type=SCREENING, AuditExercise.id when source_type=AUDIT, null otherwise" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL; CRITICAL auto-escalates on creation", constraints: "enum: LOW, MEDIUM, HIGH, CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text description of the red flag" }
      - { name: flag_status, type: enum, source: system, description: "OPEN | UNDER_ENHANCED_REVIEW | CLEARED | SUBSTANTIATED", constraints: "see state_machines.RedFlag" }
      - { name: escalated_by_user_id, type: string, source: system, description: "X-User-ID of the officer who escalated; null for system auto-escalation of CRITICAL flags" }

  - name: EscalationCase
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: case_status, type: enum, source: system, description: "ENHANCED_DD | DECIDED", constraints: "see state_machines.EscalationCase" }
      - { name: escalated_by_user_id, type: string, source: system, description: "X-User-ID of escalating officer; null for auto-escalation. Segregation of duties: decider MUST differ from this value when non-null" }
      - { name: decision_outcome, type: enum, source: input, description: "APPROVE_WITH_CONDITIONS | REJECT | TERMINATE; null until decided", constraints: "enum: APPROVE_WITH_CONDITIONS, REJECT, TERMINATE" }
      - { name: conditions_note, type: string, source: input, description: "Conditions attached when outcome is APPROVE_WITH_CONDITIONS" }

  - name: Contract
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: contract_status, type: enum, source: system, description: "DRAFT | PENDING_CLAUSES | ACTIVE | EXPIRED | TERMINATED", constraints: "see state_machines.Contract" }
      - { name: contract_value_cents, type: integer, source: input, description: "Total contract value in USD cents; denominator of the commission ratio", constraints: "> 0" }
      - { name: start_date, type: string, source: input, description: "ISO date; start of the engagement window" }
      - { name: end_date, type: string, source: input, description: "ISO date; clock sweep flips PENDING_CLAUSES/ACTIVE to EXPIRED when current date > end_date" }
      - { name: clause_codes, type: array, source: input, description: "Clause codes attached via attach-clauses; validated against the required set at activation" }
      - { name: approved_payments_total_cents, type: integer, source: computed, description: "Ledger: sum(amount_cents of APPROVED payment requests) minus sum(amount_cents of REVERSED payment requests); never negative" }

  - name: Certification
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: cert_type, type: enum, source: input, description: "ANNUAL_ABAC | CODE_OF_CONDUCT", constraints: "enum: ANNUAL_ABAC, CODE_OF_CONDUCT" }
      - { name: cert_status, type: enum, source: system, description: "PENDING | SUBMITTED | VERIFIED | REJECTED | LAPSED", constraints: "see state_machines.Certification" }
      - { name: document_ref, type: string, source: input, description: "Reference to the uploaded certification document" }
      - { name: valid_until, type: string, source: computed, description: "ISO date = verification date + 365 days; clock sweep flips VERIFIED to LAPSED when current date > valid_until; null until verified" }

  - name: PaymentRequest
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; contract this payment is charged against" }
      - { name: payment_type, type: enum, source: input, description: "COMMISSION | SUCCESS_FEE | REIMBURSEMENT; cap brackets apply to all types except REIMBURSEMENT", constraints: "enum: COMMISSION, SUCCESS_FEE, REIMBURSEMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in USD cents", constraints: "> 0" }
      - { name: ratio_pct, type: number, source: computed, description: "round_half_up(amount_cents * 10000 / contract_value_cents) / 100; 2-decimal percent of contract value; computed at creation" }
      - { name: enhanced_review_evidence, type: boolean, source: input, description: "True when an approved escalation/evidence package is attached; required to approve when effective_cap < ratio <= hard_cap", default: false }
      - { name: payment_status, type: enum, source: system, description: "SUBMITTED | APPROVED | BLOCKED | REVERSED", constraints: "see state_machines.PaymentRequest" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of creating BusinessSponsor; SoD: approver MUST differ" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving FinanceReviewer; SoD: reverser MUST differ; null until approved" }

  - name: GiftHospitalityEntry
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: entry_type, type: enum, source: input, description: "GIFT | HOSPITALITY | TRAVEL", constraints: "enum: GIFT, HOSPITALITY, TRAVEL" }
      - { name: recipient_is_government_official, type: boolean, source: input, description: "true entries aggregate into gov_gift_rolling_12m_cents and trigger caps" }
      - { name: value_cents, type: integer, source: input, description: "Face value in local-currency cents", constraints: "> 0" }
      - { name: fx_rate_to_usd, type: number, source: input, description: "Decimal FX rate local->USD; value_usd_cents = round_half_up(value_cents * fx_rate_to_usd) computed per entry", constraints: "> 0" }
      - { name: value_usd_cents, type: integer, source: computed, description: "Per-entry rounded USD cents (round BEFORE summing; never sum-then-round)" }
      - { name: event_date, type: string, source: input, description: "ISO date of the gift/event; pre-approval requires event_date >= current date" }
      - { name: entry_status, type: enum, source: system, description: "PENDING_APPROVAL | APPROVED | REJECTED | VOIDED", constraints: "see state_machines.GiftHospitalityEntry" }
      - { name: requires_enhanced_approval, type: boolean, source: computed, description: "true when prospective gov-official rolling total (APPROVED entries in window + this entry) >= 25000 cents" }

  - name: ReDiligenceCycle
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; owning third party" }
      - { name: cycle_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | OVERDUE | COMPLETED", constraints: "see state_machines.ReDiligenceCycle" }
      - { name: trigger_source, type: enum, source: system, description: "SCHEDULED (auto at approval) | MANUAL (officer-triggered risk event)", constraints: "enum: SCHEDULED, MANUAL" }
      - { name: due_date, type: string, source: computed, description: "ISO date; approval-creation sets tier interval, manual creation sets current + 30 days; clock sweep past due flips to OVERDUE" }
      - { name: outcome, type: enum, source: input, description: "REAFFIRM | DOWNGRADE | TERMINATE; null until completed", constraints: "enum: REAFFIRM, DOWNGRADE, TERMINATE" }

  - name: AuditExercise
    parent: ThirdParty
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: system, description: "FK -> ThirdParty.id; audited third party" }
      - { name: audit_status, type: enum, source: system, description: "NOTICED | IN_FIELDWORK | FINDINGS_ISSUED | CLOSED", constraints: "see state_machines.AuditExercise" }
      - { name: notice_date, type: string, source: system, description: "ISO date the notice was issued (creation date)" }
      - { name: fieldwork_start_date, type: string, source: input, description: "ISO date; must be >= notice_date + 10 days (inclusive) and must not overlap another NOTICED/IN_FIELDWORK audit window for the same third party; windows are half-open [start, end)" }
      - { name: fieldwork_end_date, type: string, source: input, description: "ISO date; exclusive end of the fieldwork window; must be > fieldwork_start_date" }
      - { name: findings_total, type: integer, source: input, description: "Total findings count reported at issue-findings", constraints: ">= 0" }
      - { name: findings_substantiated_critical, type: integer, source: input, description: "Critical substantiated findings; >= 1 cascades a CRITICAL RedFlag -> auto EscalationCase -> ThirdParty suspension", constraints: "0 <= value <= findings_total" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: assignee_user_id, type: string, source: input, description: "X-User-ID of the assignee (plain operator id, not an entity FK)" }
      - { name: course_code, type: string, source: input, description: "Course identifier, e.g. ABAC-101" }
      - { name: due_date, type: string, source: input, description: "ISO date; clock sweep flips ASSIGNED to OVERDUE when current date > due_date" }
      - { name: training_status, type: enum, source: system, description: "ASSIGNED | OVERDUE | COMPLETED; OVERDUE -> COMPLETED (late completion) is allowed", constraints: "see state_machines.TrainingAssignment" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ThirdParty
    field: onboarding_status
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /compliance/third-parties/{third_party_id}/submit"
        actor: BusinessSponsor
        preconditions:
          - "sponsor_user_id == X-User-ID (ownership)"
          - "No TrainingAssignment with training_status == OVERDUE for X-User-ID (ERR_SPONSOR_TRAINING_OVERDUE)"
          - "Exactly one RiskScoringPolicy with policy_status == ACTIVE exists (ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "computes risk_score_provisional and risk_tier per calculations.third_party_risk_score (provisional variant)"
          - "auto-creates three ScreeningCheck rows (PEP, ADVERSE_MEDIA, SANCTIONS), each QUEUED"
          - "increments ThirdParty.version by 1"
      - from: SCREENING
        to: DD_REVIEW
        trigger: "system auto-advance: evaluated after every screening disposition"
        actor: system
        preconditions:
          - "All three ScreeningCheck rows are terminal (CLEAR | HIT_CONFIRMED | HIT_DISMISSED)"
          - "onboarding_status is still SCREENING (a CRITICAL-flag escalation may have moved it to ENHANCED_REVIEW first)"
        side_effects: []
      - from: DD_REVIEW
        to: ENHANCED_REVIEW
        trigger: "system: any RedFlag for this third party enters UNDER_ENHANCED_REVIEW (manual ESCALATE disposition or CRITICAL auto-escalation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENHANCED_REVIEW
        to: DD_REVIEW
        trigger: "POST /compliance/escalation-cases/{case_id}/decide with outcome=APPROVE_WITH_CONDITIONS"
        actor: ComplianceOfficer
        preconditions: ["the decided case belongs to this third party"]
        side_effects: ["linked RedFlags -> CLEARED"]
      - from: ENHANCED_REVIEW
        to: REJECTED
        trigger: "POST /compliance/escalation-cases/{case_id}/decide with outcome=REJECT"
        actor: ComplianceOfficer
        preconditions: ["the decided case belongs to this third party"]
        side_effects: ["linked RedFlags -> SUBSTANTIATED"]
      - from: DD_REVIEW
        to: APPROVED
        trigger: "POST /compliance/third-parties/{third_party_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "risk_score_final is non-null, i.e. the current (non-SUPERSEDED) questionnaire is ACCEPTED (ERR_QUESTIONNAIRE_NOT_ACCEPTED)"
          - "No RedFlag with flag_status IN {OPEN, UNDER_ENHANCED_REVIEW} and no EscalationCase with case_status == ENHANCED_DD (both reported as ERR_RED_FLAGS_OPEN; an open case always implies an escalated flag)"
        side_effects:
          - "approval_tier_snapshot := risk_tier; approved_policy_id := id of ACTIVE policy"
          - "diligence_expires_at := current date + tier interval (LOW/MEDIUM 365d, HIGH 180d, CRITICAL 90d)"
          - "auto-creates ReDiligenceCycle(trigger_source=SCHEDULED, cycle_status=SCHEDULED, due_date = diligence_expires_at)"
          - "increments ThirdParty.version by 1"
      - from: [SCREENING, DD_REVIEW]
        to: REJECTED
        trigger: "POST /compliance/third-parties/{third_party_id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments ThirdParty.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /compliance/third-parties/{third_party_id}/suspend, OR system (CRITICAL red-flag auto-escalation), OR system clock sweep (a ReDiligenceCycle OVERDUE for more than 30 days)"
        actor: "ComplianceOfficer or system"
        preconditions: []
        side_effects: ["increments ThirdParty.version by 1"]
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /compliance/third-parties/{third_party_id}/reinstate, OR POST /compliance/escalation-cases/{case_id}/decide with outcome=APPROVE_WITH_CONDITIONS"
        actor: ComplianceOfficer
        preconditions:
          - "No RedFlag with flag_status IN {OPEN, UNDER_ENHANCED_REVIEW} and no EscalationCase with case_status == ENHANCED_DD (ERR_RED_FLAGS_OPEN)"
        side_effects: ["increments ThirdParty.version by 1"]
      - from: [APPROVED, SUSPENDED]
        to: TERMINATED
        trigger: "POST /compliance/third-parties/{third_party_id}/terminate, OR escalation decide with outcome=TERMINATE, OR re-diligence complete with outcome=TERMINATE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Termination cascade: every Contract with contract_status IN {DRAFT, PENDING_CLAUSES, ACTIVE} -> TERMINATED"
          - "Every PaymentRequest (on those contracts) with payment_status == SUBMITTED -> BLOCKED"
          - "Every GiftHospitalityEntry with entry_status == PENDING_APPROVAL -> REJECTED"
          - "increments ThirdParty.version by 1"

  - entity: ScreeningCheck
    field: check_status
    initial_state: QUEUED
    terminal_states: [CLEAR, HIT_CONFIRMED, HIT_DISMISSED]
    transitions:
      - from: QUEUED
        to: CLEAR
        trigger: "POST /compliance/screening-checks/{check_id}/disposition with outcome=CLEAR"
        actor: ScreeningAnalyst
        preconditions: []
        side_effects: ["re-evaluates ThirdParty SCREENING -> DD_REVIEW auto-advance"]
      - from: QUEUED
        to: POTENTIAL_HIT
        trigger: "POST /compliance/screening-checks/{check_id}/disposition with outcome=POTENTIAL_HIT (match_detail required)"
        actor: ScreeningAnalyst
        preconditions: []
        side_effects: []
      - from: POTENTIAL_HIT
        to: HIT_CONFIRMED
        trigger: "POST /compliance/screening-checks/{check_id}/disposition with outcome=HIT_CONFIRMED"
        actor: ScreeningAnalyst
        preconditions: []
        side_effects:
          - "Cascade L0: recomputes ThirdParty.risk_score_provisional and risk_tier with the confirmed-hit screening modifier (SANCTIONS confirmed -> override score 100 / CRITICAL; PEP +20 and ADVERSE_MEDIA +10 apply at the final variant)"
          - "Cascade L1: creates RedFlag(source_type=SCREENING, source_ref_id=this check, severity = SANCTIONS->CRITICAL | PEP->HIGH | ADVERSE_MEDIA->MEDIUM, flag_status=OPEN)"
          - "Cascade L2 (severity CRITICAL only): RedFlag immediately -> UNDER_ENHANCED_REVIEW and an EscalationCase(case_status=ENHANCED_DD, escalated_by_user_id=null) is created"
          - "Cascade L3 (severity CRITICAL only): owning ThirdParty APPROVED -> SUSPENDED, or SCREENING/DD_REVIEW -> ENHANCED_REVIEW"
          - "re-evaluates ThirdParty SCREENING -> DD_REVIEW auto-advance (only if status still SCREENING after L3)"
      - from: POTENTIAL_HIT
        to: HIT_DISMISSED
        trigger: "POST /compliance/screening-checks/{check_id}/disposition with outcome=HIT_DISMISSED"
        actor: ScreeningAnalyst
        preconditions: []
        side_effects: ["re-evaluates ThirdParty SCREENING -> DD_REVIEW auto-advance"]

  - entity: Questionnaire
    field: questionnaire_status
    initial_state: ISSUED
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: [ISSUED, RETURNED]
        to: SUBMITTED
        trigger: "POST /compliance/questionnaires/{questionnaire_id}/submit"
        actor: BusinessSponsor
        preconditions:
          - "Owning ThirdParty.sponsor_user_id == X-User-ID"
          - "Questionnaire is the current (non-SUPERSEDED) questionnaire for its third party"
        side_effects: ["computes red_flag_count = count of risky answers among {government_ownership_pct>0, has_facilitation_payments, uses_sub_agents}"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance/questionnaires/{questionnaire_id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "Owning ThirdParty.onboarding_status IN {DD_REVIEW, ENHANCED_REVIEW} (ERR_INVALID_STATE)"
          - "All ScreeningChecks of the owning ThirdParty are terminal (ERR_SCREENING_UNRESOLVED)"
          - "Questionnaire is the current (non-SUPERSEDED) one (ERR_INVALID_STATE)"
        side_effects:
          - "computes ThirdParty.risk_score_final and risk_tier per calculations.third_party_risk_score (final variant)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /compliance/questionnaires/{questionnaire_id}/return"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: [ISSUED, SUBMITTED, RETURNED]
        to: SUPERSEDED
        trigger: "system: a new questionnaire is issued for the same third party"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RedFlag
    field: flag_status
    initial_state: OPEN
    terminal_states: [CLEARED, SUBSTANTIATED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /compliance/red-flags/{flag_id}/disposition with disposition=CLEARED"
        actor: ComplianceOfficer
        preconditions: ["severity is not CRITICAL (CRITICAL flags may only be resolved via escalation decision)"]
        side_effects: []
      - from: OPEN
        to: UNDER_ENHANCED_REVIEW
        trigger: "POST /compliance/red-flags/{flag_id}/disposition with disposition=ESCALATE, OR system auto-escalation of a CRITICAL flag at creation"
        actor: "ComplianceOfficer or system"
        preconditions: []
        side_effects:
          - "creates EscalationCase(case_status=ENHANCED_DD, escalated_by_user_id = officer id or null for auto)"
          - "ThirdParty APPROVED -> SUSPENDED; SCREENING/DD_REVIEW -> ENHANCED_REVIEW"
      - from: UNDER_ENHANCED_REVIEW
        to: CLEARED
        trigger: "POST /compliance/escalation-cases/{case_id}/decide with outcome=APPROVE_WITH_CONDITIONS"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_ENHANCED_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /compliance/escalation-cases/{case_id}/decide with outcome IN {REJECT, TERMINATE}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: EscalationCase
    field: case_status
    initial_state: ENHANCED_DD
    terminal_states: [DECIDED]
    transitions:
      - from: ENHANCED_DD
        to: DECIDED
        trigger: "POST /compliance/escalation-cases/{case_id}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != escalated_by_user_id when escalated_by_user_id is non-null (ERR_SOD_VIOLATION)"
          - "outcome=REJECT is valid only while the ThirdParty is in ENHANCED_REVIEW (post-approval suspensions must use TERMINATE)"
        side_effects:
          - "APPROVE_WITH_CONDITIONS: linked RedFlags -> CLEARED; ThirdParty ENHANCED_REVIEW -> DD_REVIEW or SUSPENDED -> APPROVED"
          - "REJECT: linked RedFlags -> SUBSTANTIATED; ThirdParty -> REJECTED"
          - "TERMINATE: linked RedFlags -> SUBSTANTIATED; ThirdParty -> TERMINATED plus the full termination cascade (contracts, payments, gifts)"

  - entity: Contract
    field: contract_status
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_CLAUSES
        trigger: "POST /compliance/contracts/{contract_id}/attach-clauses"
        actor: BusinessSponsor
        preconditions: ["Owning ThirdParty.onboarding_status == APPROVED (ERR_THIRD_PARTY_NOT_APPROVED)"]
        side_effects: ["stores clause_codes"]
      - from: PENDING_CLAUSES
        to: ACTIVE
        trigger: "POST /compliance/contracts/{contract_id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Owning ThirdParty.onboarding_status == APPROVED (ERR_THIRD_PARTY_NOT_APPROVED)"
          - "clause_codes superset of required set for ThirdParty.approval_tier_snapshot: LOW/MEDIUM {ABAC}; HIGH {ABAC, AUDIT_RIGHTS, ANNUAL_CERTIFICATION}; CRITICAL adds {TERMINATION_FOR_CAUSE, GOVT_OFFICIAL_DISCLOSURE} (ERR_CLAUSE_SET_INCOMPLETE)"
          - "At least one Certification for the ThirdParty with cert_status == VERIFIED (ERR_CERTIFICATION_REQUIRED)"
          - "No ReDiligenceCycle with cycle_status == OVERDUE for the ThirdParty (ERR_REDILIGENCE_OVERDUE)"
        side_effects: []
      - from: [PENDING_CLAUSES, ACTIVE]
        to: EXPIRED
        trigger: "system clock sweep: current date > end_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: [DRAFT, PENDING_CLAUSES, ACTIVE]
        to: TERMINATED
        trigger: "system: owning ThirdParty enters TERMINATED"
        actor: system
        preconditions: []
        side_effects: ["PaymentRequests with payment_status == SUBMITTED -> BLOCKED"]

  - entity: Certification
    field: cert_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: [PENDING, REJECTED]
        to: SUBMITTED
        trigger: "POST /compliance/certifications/{certification_id}/submit"
        actor: BusinessSponsor
        preconditions: ["Owning ThirdParty.sponsor_user_id == X-User-ID"]
        side_effects: []
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /compliance/certifications/{certification_id}/verify"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["valid_until := current date + 365 days"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/certifications/{certification_id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: LAPSED
        trigger: "system clock sweep: current date > valid_until"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PaymentRequest
    field: payment_status
    initial_state: SUBMITTED
    terminal_states: [BLOCKED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /compliance/payment-requests/{payment_id}/approve"
        actor: FinanceReviewer
        preconditions:
          - "SoD: X-User-ID != submitted_by_user_id (ERR_SOD_VIOLATION)"
          - "Contract.contract_status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Owning ThirdParty.onboarding_status == APPROVED (ERR_THIRD_PARTY_NOT_APPROVED)"
          - "At least one VERIFIED (non-LAPSED) Certification exists for the ThirdParty (ERR_CERTIFICATION_LAPSED)"
          - "Cap brackets per calculations.commission_reasonableness (skipped for payment_type == REIMBURSEMENT)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "Contract.approved_payments_total_cents += amount_cents"
      - from: SUBMITTED
        to: BLOCKED
        trigger: "POST /compliance/payment-requests/{payment_id}/block, OR system termination cascade"
        actor: "FinanceReviewer or system"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVERSED
        trigger: "POST /compliance/payment-requests/{payment_id}/reverse"
        actor: FinanceReviewer
        preconditions:
          - "SoD: X-User-ID != approved_by_user_id (ERR_SOD_VIOLATION) — a reviewer cannot reverse their own approval"
        side_effects:
          - "Contract.approved_payments_total_cents -= amount_cents (compensating invariant INV-PAY)"

  - entity: GiftHospitalityEntry
    field: entry_status
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /compliance/gift-hospitality-entries/{entry_id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "If requires_enhanced_approval == true then payload enhanced_review_evidence MUST be true (ERR_ENHANCED_REVIEW_REQUIRED)"
          - "Re-check at approval: (rolling APPROVED gov-official total in window + value_usd_cents) > 50000 -> ERR_GIFT_CAP_EXCEEDED"
        side_effects: ["ThirdParty.gov_gift_rolling_12m_cents recomputed (includes this entry)"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /compliance/gift-hospitality-entries/{entry_id}/reject, OR system termination cascade"
        actor: "ComplianceOfficer or system"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "POST /compliance/gift-hospitality-entries/{entry_id}/void"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "ThirdParty.gov_gift_rolling_12m_cents recomputed (excludes this entry) — compensating invariant INV-GIFT"

  - entity: ReDiligenceCycle
    field: cycle_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /compliance/rediligence-cycles/{cycle_id}/start"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /compliance/rediligence-cycles/{cycle_id}/complete with outcome"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "REAFFIRM: ThirdParty.diligence_expires_at := current date + tier interval; auto-creates successor cycle SCHEDULED at that date"
          - "DOWNGRADE: ThirdParty.risk_tier escalates one step (LOW->MEDIUM->HIGH->CRITICAL); diligence_expires_at := current date + NEW tier interval; auto-creates successor cycle SCHEDULED at current date + 30 days"
          - "TERMINATE: ThirdParty -> TERMINATED plus the full termination cascade"
      - from: [SCHEDULED, IN_PROGRESS]
        to: OVERDUE
        trigger: "system clock sweep: current date > due_date"
        actor: system
        preconditions: []
        side_effects:
          - "While any cycle is OVERDUE: contract activation for the ThirdParty is blocked (ERR_REDILIGENCE_OVERDUE)"
          - "When current date > due_date + 30 days: ThirdParty APPROVED -> SUSPENDED (auto)"

  - entity: AuditExercise
    field: audit_status
    initial_state: NOTICED
    terminal_states: [CLOSED]
    transitions:
      - from: NOTICED
        to: IN_FIELDWORK
        trigger: "POST /compliance/audit-exercises/{audit_id}/begin-fieldwork"
        actor: AuditLead
        preconditions:
          - "current date >= notice_date + 10 days (inclusive; ERR_AUDIT_NOTICE_TOO_SHORT)"
        side_effects: []
      - from: IN_FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /compliance/audit-exercises/{audit_id}/issue-findings"
        actor: AuditLead
        preconditions: ["0 <= findings_substantiated_critical <= findings_total (ERR_VALIDATION)"]
        side_effects:
          - "Cascade L1 (when findings_substantiated_critical >= 1): creates RedFlag(source_type=AUDIT, source_ref_id=this audit, severity=CRITICAL, flag_status=OPEN)"
          - "Cascade L2: that CRITICAL RedFlag -> UNDER_ENHANCED_REVIEW and an EscalationCase(ENHANCED_DD, escalated_by_user_id=null) is created"
          - "Cascade L3: owning ThirdParty APPROVED -> SUSPENDED (or SCREENING/DD_REVIEW -> ENHANCED_REVIEW)"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /compliance/audit-exercises/{audit_id}/close"
        actor: AuditLead
        preconditions:
          - "Every RedFlag with source_ref_id == this audit has flag_status IN {CLEARED, SUBSTANTIATED} (ERR_FINDINGS_PENDING)"
        side_effects: []

  - entity: TrainingAssignment
    field: training_status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    transitions:
      - from: [ASSIGNED, OVERDUE]
        to: COMPLETED
        trigger: "POST /compliance/training-assignments/{assignment_id}/complete"
        actor: "BusinessSponsor (self: assignee_user_id == X-User-ID) or ComplianceAdmin"
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system clock sweep: current date > due_date"
        actor: system
        preconditions: []
        side_effects: ["ThirdParty submit by assignee_user_id is blocked while any assignment is OVERDUE (ERR_SPONSOR_TRAINING_OVERDUE)"]

  - entity: RiskScoringPolicy
    field: policy_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /compliance/risk-scoring-policies/{policy_id}/activate"
        actor: ComplianceAdmin
        preconditions: ["OCC: expected_policy_version == current version (ERR_STALE_VERSION)"]
        side_effects:
          - "The previously ACTIVE policy (if any) -> SUPERSEDED"
          - "increments RiskScoringPolicy.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: another policy is activated"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: questionnaire-issue-stale-third-party
    parent_entity: ThirdParty
    write_endpoint: "POST /compliance/third-parties/{third_party_id}/questionnaires"
    occ_field: expected_third_party_version
    description: |
      Issuing a questionnaire against a ThirdParty whose version has advanced since
      the client last observed it is rejected. Issuing legitimately supersedes any
      prior ISSUED/SUBMITTED/RETURNED questionnaire, so a stale client would
      silently supersede a questionnaire it never saw; the stale version check
      forces a re-read first.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: third-party-profile-update-stale
    parent_entity: ThirdParty
    write_endpoint: "PATCH /compliance/third-parties/{third_party_id}"
    occ_field: expected_third_party_version
    description: |
      A profile update (industry / government_touchpoint / legal_name) against a
      ThirdParty whose version has advanced since the client last observed it is
      rejected, because the update feeds the provisional risk score and must not
      be computed from a stale base record.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: policy-activate-stale
    parent_entity: RiskScoringPolicy
    write_endpoint: "POST /compliance/risk-scoring-policies/{policy_id}/activate"
    occ_field: expected_policy_version
    description: |
      Activating a RiskScoringPolicy whose version has advanced since the client
      last observed it is rejected; activation supersedes the currently ACTIVE
      policy, so a stale activation would swap the global scoring basis the
      client never reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: third_party_risk_score
    trigger: "provisional variant: ThirdParty submit; final variant: questionnaire accept; re-run: CountryRiskProfile PATCH (recomputes both variants for every non-terminal ThirdParty with that country_code, keeping modifiers)"
    algorithm: weighted_scoring
    formula: |
      country_norm = 100 - CountryRiskProfile.cpi_score
      industry_score = map(ThirdParty.industry): TECHNOLOGY 20, LOGISTICS 40, CONSULTING 60, CONSTRUCTION 70, GOVERNMENT_RELATIONS 90
      touchpoint_score = map(ThirdParty.government_touchpoint): NONE 0, INDIRECT 50, DIRECT 100
      provisional = round_half_up( (w_country*country_norm + w_industry*industry_score + w_touchpoint*touchpoint_score) / 100 )   # integer 0-100
      questionnaire_modifier = (government_ownership_pct > 0 ? 10 : 0) + (has_facilitation_payments ? 15 : 0) + (uses_sub_agents ? 5 : 0)   # from the current ACCEPTED questionnaire
      screening_modifier = sum over ScreeningChecks with check_status == HIT_CONFIRMED: PEP +20, ADVERSE_MEDIA +10; SANCTIONS confirmed -> OVERRIDE (below)
      final = clamp(0, 100, provisional + questionnaire_modifier + screening_modifier)
      OVERRIDES (evaluated after the arithmetic): CountryRiskProfile.sanctioned == true OR any SANCTIONS check HIT_CONFIRMED -> score := 100
      tier mapping (inclusive lower bounds): score >= tier_critical_min -> CRITICAL; >= tier_high_min -> HIGH; >= tier_medium_min -> MEDIUM; else LOW
      risk_tier is derived from risk_score_provisional at submit, then re-derived from risk_score_final at questionnaire accept.
    input_set: "ThirdParty row + ACTIVE RiskScoringPolicy + CountryRiskProfile matched by country_code + current ACCEPTED Questionnaire + all ScreeningChecks of the ThirdParty"
    constants:
      CLAMP_MIN: 0
      CLAMP_MAX: 100
      Q_GOV_OWNERSHIP_MOD: 10
      Q_FACILITATION_MOD: 15
      Q_SUB_AGENTS_MOD: 5
      S_PEP_MOD: 20
      S_ADVERSE_MEDIA_MOD: 10
      OVERRIDE_SCORE: 100
    precision: "integer score, round_half_up"
    variants:
      - name: provisional
        when: "at submit, before questionnaire and screening results exist"
        difference: "base weighted formula only; no questionnaire/screening modifiers"
      - name: final
        when: "when the current questionnaire is ACCEPTED"
        difference: "base + questionnaire_modifier + screening_modifier, clamped; for identical base inputs the two variants differ whenever any modifier is non-zero (e.g. 73 -> 100)"

  - name: commission_reasonableness
    trigger: "PaymentRequest creation computes ratio_pct; approve evaluates the bracket verdict"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved): the verdict bracket
      is keyed on the ratio being tested, so the order MUST be:
      (1) ratio_pct = round_half_up(amount_cents * 10000 / contract_value_cents) / 100        # 2-decimal percent
      (2) country_norm = 100 - cpi_score of the ThirdParty's country
      (3) multiplier = 0.60 if country_norm >= 70; 0.80 if 40 <= country_norm <= 69; 1.00 if country_norm < 40
      (4) effective_cap_pct = commission_base_cap_pct * multiplier                             # exact decimal, 2dp
      (5) bracket selection on ratio_pct:
            ratio_pct >  commission_hard_cap_pct                       -> BLOCKED_ONLY  (approve -> ERR_COMMISSION_CAP_EXCEEDED)
            effective_cap_pct < ratio_pct <= commission_hard_cap_pct   -> EVIDENCE_REQUIRED (approve without enhanced_review_evidence=true -> ERR_ENHANCED_REVIEW_REQUIRED)
            ratio_pct <= effective_cap_pct                             -> APPROVABLE    (approve proceeds, boundary is inclusive)
      payment_type == REIMBURSEMENT skips brackets entirely (always APPROVABLE).
    input_set: "PaymentRequest + its Contract (contract_value_cents) + ThirdParty country profile + ACTIVE RiskScoringPolicy caps"
    constants:
      MULT_BAND_HIGH_RISK: 0.60
      MULT_BAND_MEDIUM_RISK: 0.80
      MULT_BAND_LOW_RISK: 1.00
      NORM_HIGH_MIN: 70
      NORM_MEDIUM_MIN: 40
    precision: "ratio_pct 2 decimal places round_half_up; effective_cap_pct 2 decimal places"
    variants:
      - name: flat_benchmark
        when: "naive reading — base cap applied regardless of country risk"
        difference: "effective_cap_pct = commission_base_cap_pct (e.g. 15.00); a 12.00% commission in a country_norm>=70 country would be straight APPROVABLE"
      - name: country_blended
        when: "PRODUCTION RULE — cap is multiplied by the country risk band"
        difference: "effective_cap_pct = 15.00 * 0.60 = 9.00 for country_norm >= 70; the same 12.00% commission becomes EVIDENCE_REQUIRED. The scaffold pins country_blended as authoritative."

  - name: gift_rolling_window_total
    trigger: "GiftHospitalityEntry create (prospective check + requires_enhanced_approval), approve (re-check), void (aggregate repair)"
    algorithm: aggregation
    formula: |
      Per-entry conversion FIRST, sum SECOND — pinned rounding order, never sum-then-round:
        value_usd_cents(entry) = round_half_up(value_cents * fx_rate_to_usd)          # per entry, integer cents
      Window (date granularity, half-open lower / closed upper):
        W(e) = ( e.event_date - 365 days , e.event_date ]
      rolling_total(e) = sum( value_usd_cents(x) ) over entries x of the SAME third_party_id
                         with recipient_is_government_official == true,
                         entry_status == APPROVED, and x.event_date in W(e)
      prospective_total = rolling_total(e) + value_usd_cents(e)
      Thresholds (different operators, pinned):
        prospective_total >= 25000  -> requires_enhanced_approval = true   (inclusive boundary)
        prospective_total >  50000  -> create rejected ERR_GIFT_CAP_EXCEEDED (strict; exactly 50000 is allowed)
      Non-government recipients are excluded from the aggregate and from both caps.
    input_set: "GiftHospitalityEntry rows of one ThirdParty with recipient_is_government_official == true; entry_status filter APPROVED; event_date window filter"
    constants:
      ENHANCED_THRESHOLD_CENTS: 25000
      HARD_CAP_CENTS: 50000
      WINDOW_DAYS: 365
    precision: "integer cents; per-entry round_half_up BEFORE summation"

  - name: rediligence_schedule
    trigger: "ThirdParty approve (successor cycle creation), ReDiligenceCycle complete (REAFFIRM / DOWNGRADE), manual cycle create, clock sweep"
    algorithm: threshold
    formula: |
      interval_days(tier) = CRITICAL 90 | HIGH 180 | MEDIUM 365 | LOW 365
      At approve: create cycle SCHEDULED with due_date = current date + interval_days(approval_tier_snapshot); diligence_expires_at = same date.
      Manual create: due_date = current date + 30 days; rejected when any cycle of the ThirdParty is in {SCHEDULED, IN_PROGRESS, OVERDUE} (ERR_DUPLICATE_ACTIVE_CYCLE).
      Clock sweep (on POST /compliance/_clock/set_current_utc, deterministic):
        cycle in {SCHEDULED, IN_PROGRESS} and current date > due_date  -> OVERDUE
        cycle OVERDUE and current date > due_date + 30 days            -> ThirdParty APPROVED -> SUSPENDED
      complete(REAFFIRM):  diligence_expires_at = current + interval_days(current tier); successor SCHEDULED at that date
      complete(DOWNGRADE): risk_tier one step up (LOW->MEDIUM->HIGH->CRITICAL; CRITICAL stays); diligence_expires_at = current + interval_days(NEW tier); successor SCHEDULED at current + 30 days
      complete(TERMINATE): ThirdParty -> TERMINATED + termination cascade
    input_set: "ReDiligenceCycle rows of one ThirdParty (status filter for the sweep: SCHEDULED, IN_PROGRESS, OVERDUE)"
    constants:
      INTERVAL_CRITICAL_DAYS: 90
      INTERVAL_HIGH_DAYS: 180
      INTERVAL_LOW_MED_DAYS: 365
      MANUAL_CYCLE_DAYS: 30
      AUTO_SUSPEND_GRACE_DAYS: 30
    precision: "whole ISO dates; comparison is strictly-greater (due date itself is NOT overdue)"

  - name: audit_notice_window
    trigger: "AuditExercise create (window validation) and begin-fieldwork (earliest-start check)"
    algorithm: threshold
    formula: |
      earliest_start = notice_date + NOTICE_DAYS (calendar days, ISO dates)
      Create validation: fieldwork_start_date >= earliest_start  -> else ERR_AUDIT_NOTICE_TOO_SHORT (boundary inclusive: exactly notice+10 is legal)
      begin-fieldwork validation: current date >= notice_date + NOTICE_DAYS -> else ERR_AUDIT_NOTICE_TOO_SHORT
      Overlap rule (per third_party_id, half-open intervals): a new window [start, end) conflicts with an existing
      NOTICED/IN_FIELDWORK window [s, e) iff start < e AND s < end. Adjacency (start == e) is ALLOWED.
      Also requires fieldwork_end_date > fieldwork_start_date (ERR_VALIDATION otherwise).
    input_set: "AuditExercise rows of one ThirdParty with audit_status IN {NOTICED, IN_FIELDWORK}"
    constants:
      NOTICE_DAYS: 10
    precision: "whole ISO dates; >= comparisons inclusive as stated"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every id in the path exists (left-to-right); country_code on third-party create resolves to a CountryRiskProfile", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "OCC: expected_*_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["PATCH /compliance/third-parties/{third_party_id}", "POST /compliance/third-parties/{third_party_id}/questionnaires", "POST /compliance/risk-scoring-policies/{policy_id}/activate"] }
  - { priority: 5, category: state, check: "Target entity's state machine permits the transition (from-state and terminal lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Action attempted on an entity already in a terminal state; within priority 5 this more specific check is evaluated first and takes precedence over ERR_INVALID_STATE", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Sanctions: creating a gift entry for a government official of a sanctioned country, or confirming a SANCTIONS hit, escalates per safety rules; gift create with recipient_is_government_official=true on a ThirdParty whose country profile is sanctioned is refused", error_id: ERR_COUNTRY_SANCTIONED, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/gift-hospitality-entries"] }
  - { priority: 7, category: business_temporal, check: "Gift pre-approval: event_date >= current date", error_id: ERR_EVENT_IN_PAST, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/gift-hospitality-entries"] }
  - { priority: 7, category: business_temporal, check: "Audit notice window and half-open overlap rules", error_id: ERR_AUDIT_NOTICE_TOO_SHORT, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/audit-exercises", "POST /compliance/audit-exercises/{audit_id}/begin-fieldwork"] }
  - { priority: 7, category: business_temporal, check: "Audit fieldwork window overlaps an existing NOTICED/IN_FIELDWORK window for the same third party", error_id: ERR_AUDIT_WINDOW_OVERLAP, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/audit-exercises"] }
  - { priority: 8, category: business_constraint, check: "Segregation of duties: payment approver != submitter; payment reverser != approver; escalation decider != escalator (when non-null)", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: ["POST /compliance/payment-requests/{payment_id}/approve", "POST /compliance/payment-requests/{payment_id}/reverse", "POST /compliance/escalation-cases/{case_id}/decide"] }
  - { priority: 8, category: business_constraint, check: "Ownership: sponsor acts only on own ThirdParty / questionnaire / certification", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: ["PATCH /compliance/third-parties/{third_party_id}", "POST /compliance/third-parties/{third_party_id}/submit", "POST /compliance/questionnaires/{questionnaire_id}/submit", "POST /compliance/certifications/{certification_id}/submit"] }
  - { priority: 8, category: business_constraint, check: "Contract clause set covers the required set for approval_tier_snapshot", error_id: ERR_CLAUSE_SET_INCOMPLETE, http_status: 422, applies_to: ["POST /compliance/contracts/{contract_id}/activate"] }
  - { priority: 8, category: business_constraint, check: "At most one non-completed ReDiligenceCycle per ThirdParty", error_id: ERR_DUPLICATE_ACTIVE_CYCLE, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/rediligence-cycles"] }
  - { priority: 8, category: business_constraint, check: "Audit close requires all spawned RedFlags terminal", error_id: ERR_FINDINGS_PENDING, http_status: 422, applies_to: ["POST /compliance/audit-exercises/{audit_id}/close"] }
  - { priority: 8, category: business_constraint, check: "Shape/domain errors: missing required fields, invalid enum, weights not summing to 100, findings_substantiated_critical > findings_total, end_date <= start_date", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 9, category: business_referential, check: "Exactly one ACTIVE RiskScoringPolicy exists (submit/approve paths)", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/submit", "POST /compliance/third-parties/{third_party_id}/approve"] }
  - { priority: 9, category: business_referential, check: "Sponsor has no OVERDUE TrainingAssignment", error_id: ERR_SPONSOR_TRAINING_OVERDUE, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/submit"] }
  - { priority: 9, category: business_referential, check: "All ScreeningChecks terminal before questionnaire accept (reachable because a questionnaire may be issued while the ThirdParty is still in SCREENING; third-party approve is only possible from DD_REVIEW which already implies terminal checks)", error_id: ERR_SCREENING_UNRESOLVED, http_status: 422, applies_to: ["POST /compliance/questionnaires/{questionnaire_id}/accept"] }
  - { priority: 9, category: business_referential, check: "Current questionnaire ACCEPTED before approve", error_id: ERR_QUESTIONNAIRE_NOT_ACCEPTED, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/approve"] }
  - { priority: 9, category: business_referential, check: "No OPEN / UNDER_ENHANCED_REVIEW RedFlags and no ENHANCED_DD EscalationCase before approve / reinstate (an open case always implies an escalated flag, so one error covers both)", error_id: ERR_RED_FLAGS_OPEN, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/approve", "POST /compliance/third-parties/{third_party_id}/reinstate"] }
  - { priority: 9, category: business_referential, check: "ThirdParty APPROVED where required (contract attach/activate, payment approve, gift create requires DD_REVIEW-or-later)", error_id: ERR_THIRD_PARTY_NOT_APPROVED, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/contracts", "POST /compliance/contracts/{contract_id}/attach-clauses", "POST /compliance/contracts/{contract_id}/activate", "POST /compliance/payment-requests/{payment_id}/approve"] }
  - { priority: 9, category: business_referential, check: "Contract ACTIVE where required", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 422, applies_to: ["POST /compliance/contracts/{contract_id}/payment-requests", "POST /compliance/payment-requests/{payment_id}/approve"] }
  - { priority: 9, category: business_referential, check: "VERIFIED (non-LAPSED) Certification exists for the ThirdParty", error_id: ERR_CERTIFICATION_REQUIRED, http_status: 422, applies_to: ["POST /compliance/contracts/{contract_id}/activate"] }
  - { priority: 9, category: business_referential, check: "Certification still valid (not LAPSED) at payment approval time", error_id: ERR_CERTIFICATION_LAPSED, http_status: 422, applies_to: ["POST /compliance/payment-requests/{payment_id}/approve"] }
  - { priority: 9, category: business_referential, check: "No OVERDUE ReDiligenceCycle blocks contract activation", error_id: ERR_REDILIGENCE_OVERDUE, http_status: 422, applies_to: ["POST /compliance/contracts/{contract_id}/activate"] }
  - { priority: 10, category: business_fiscal, check: "Commission ratio brackets (country_blended): EVIDENCE_REQUIRED band needs enhanced_review_evidence", error_id: ERR_ENHANCED_REVIEW_REQUIRED, http_status: 422, applies_to: ["POST /compliance/payment-requests/{payment_id}/approve", "POST /compliance/gift-hospitality-entries/{entry_id}/approve"] }
  - { priority: 10, category: business_fiscal, check: "Commission ratio strictly above hard cap can never be approved", error_id: ERR_COMMISSION_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /compliance/payment-requests/{payment_id}/approve"] }
  - { priority: 10, category: business_fiscal, check: "Gift rolling window hard cap (prospective_total > 50000)", error_id: ERR_GIFT_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /compliance/third-parties/{third_party_id}/gift-hospitality-entries", "POST /compliance/gift-hospitality-entries/{entry_id}/approve"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Sets the logical clock; settable to any ISO-8601 instant (no monotonicity constraint). Startup default before any call is exactly 2026-05-01T00:00:00Z (never wall-clock). Each set runs the deterministic sweep: certification lapse, re-diligence overdue (+30d auto-suspend), training overdue, contract expiry."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["clock sweep per calculations.rediligence_schedule / certification lapse / training overdue / contract expiry"]

  # --- CountryRiskProfile ---
  - method: POST
    path: "/compliance/country-risk-profiles"
    description: "Create a country risk profile"
    roles: [ComplianceAdmin]
    code: 201
    input: [country_code, cpi_score, "sanctioned?"]
    output: CountryRiskProfile
    side_effects: []
  - method: PATCH
    path: "/compliance/country-risk-profiles/{profile_id}"
    description: "Update CPI and/or sanctions flag; flipping sanctioned=true re-scores all non-terminal ThirdParties in that country (score 100 / CRITICAL) and raises a SYSTEM CRITICAL RedFlag -> auto EscalationCase -> suspension"
    roles: [ComplianceAdmin]
    code: 200
    input: ["cpi_score?", "sanctioned?"]
    output: CountryRiskProfile
    side_effects: ["risk re-score cascade per calculations.third_party_risk_score; CRITICAL RedFlag + EscalationCase + ThirdParty suspension per state_machines.RedFlag"]

  # --- RiskScoringPolicy ---
  - method: POST
    path: "/compliance/risk-scoring-policies"
    description: "Create a scoring policy (DRAFT). Weights must sum to 100 (ERR_VALIDATION)."
    roles: [ComplianceAdmin]
    code: 201
    input: [w_country, w_industry, w_touchpoint, tier_medium_min, tier_high_min, tier_critical_min, commission_base_cap_pct, commission_hard_cap_pct]
    output: RiskScoringPolicy
    side_effects: ["policy_status=DRAFT"]
  - method: POST
    path: "/compliance/risk-scoring-policies/{policy_id}/activate"
    description: "Activate a DRAFT policy (OCC); the previously ACTIVE policy becomes SUPERSEDED"
    roles: [ComplianceAdmin]
    code: 200
    input: [expected_policy_version]
    output: RiskScoringPolicy
    side_effects: ["policy_status -> ACTIVE; prior ACTIVE -> SUPERSEDED; increments RiskScoringPolicy.version by 1"]
  - method: GET
    path: "/compliance/risk-scoring-policies/{policy_id}"
    description: "Get a policy"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: []
    output: RiskScoringPolicy
    side_effects: []

  # --- ThirdParty ---
  - method: POST
    path: "/compliance/third-parties"
    description: "Register a third party (DRAFT); sponsor_user_id := X-User-ID"
    roles: [BusinessSponsor]
    code: 201
    input: [legal_name, country_code, industry, government_touchpoint]
    output: ThirdParty
    side_effects: ["onboarding_status=DRAFT; gov_gift_rolling_12m_cents=0"]
  - method: GET
    path: "/compliance/third-parties/{third_party_id}"
    description: "Get third party detail (computed scores, tier, rolling gift total)"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: []
    output: ThirdParty
    side_effects: []
  - method: GET
    path: "/compliance/third-parties"
    description: "List third parties with filters and pagination; results ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["onboarding_status?", "risk_tier?", "country_code?", "sponsor_user_id?", "limit?", "offset?"]
    output: ThirdParty[]
    side_effects: []
  - method: PATCH
    path: "/compliance/third-parties/{third_party_id}"
    description: "Update profile fields while DRAFT (OCC); owner sponsor only"
    roles: [BusinessSponsor]
    code: 200
    input: ["legal_name?", "industry?", "government_touchpoint?", expected_third_party_version]
    output: ThirdParty
    side_effects: ["increments ThirdParty.version by 1"]
  - method: POST
    path: "/compliance/third-parties/{third_party_id}/submit"
    description: "Submit for screening: computes provisional score/tier and auto-creates the 3 screening checks"
    roles: [BusinessSponsor]
    code: 200
    input: []
    output: ThirdParty
    side_effects: ["onboarding_status DRAFT -> SCREENING; provisional score; 3 QUEUED ScreeningChecks"]
  - method: POST
    path: "/compliance/third-parties/{third_party_id}/approve"
    description: "Approve after DD review; pins tier/policy snapshot, sets diligence expiry, auto-creates the scheduled re-diligence cycle"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ThirdParty
    side_effects: ["onboarding_status -> APPROVED; approval_tier_snapshot; approved_policy_id; diligence_expires_at; creates ReDiligenceCycle SCHEDULED"]
  - method: POST
    path: "/compliance/third-parties/{third_party_id}/reject"
    description: "Reject during screening/DD review (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ThirdParty
    side_effects: ["onboarding_status -> REJECTED"]
  - method: POST
    path: "/compliance/third-parties/{third_party_id}/suspend"
    description: "Suspend an approved third party"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ThirdParty
    side_effects: ["onboarding_status APPROVED -> SUSPENDED"]
  - method: POST
    path: "/compliance/third-parties/{third_party_id}/reinstate"
    description: "Reinstate a suspended third party (requires no open flags or cases)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ThirdParty
    side_effects: ["onboarding_status SUSPENDED -> APPROVED"]
  - method: POST
    path: "/compliance/third-parties/{third_party_id}/terminate"
    description: "Terminate (terminal) with the full termination cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ThirdParty
    side_effects: ["onboarding_status -> TERMINATED; contracts -> TERMINATED; SUBMITTED payments -> BLOCKED; PENDING_APPROVAL gifts -> REJECTED"]

  # --- ScreeningCheck ---
  - method: POST
    path: "/compliance/screening-checks/{check_id}/disposition"
    description: "Disposition a screening check: QUEUED -> CLEAR | POTENTIAL_HIT; POTENTIAL_HIT -> HIT_CONFIRMED | HIT_DISMISSED. HIT_CONFIRMED spawns the RedFlag cascade."
    roles: [ScreeningAnalyst]
    code: 200
    input: [outcome, "match_detail?"]
    output: ScreeningCheck
    side_effects: ["per state_machines.ScreeningCheck; HIT_CONFIRMED -> RedFlag (severity by check_type); CRITICAL -> EscalationCase -> ThirdParty suspension; auto-advance SCREENING -> DD_REVIEW"]
  - method: GET
    path: "/compliance/third-parties/{id}/screening-checks"
    description: "List screening checks of a third party; ordered created_at ASC (creation order at submit: PEP, ADVERSE_MEDIA, SANCTIONS)"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["limit?", "offset?"]
    output: ScreeningCheck[]
    side_effects: []

  # --- Questionnaire ---
  - method: POST
    path: "/compliance/third-parties/{id}/questionnaires"
    description: "Issue a questionnaire (OCC on ThirdParty.version); supersedes any prior ISSUED/SUBMITTED/RETURNED questionnaire. Requires ThirdParty in SCREENING, DD_REVIEW, or ENHANCED_REVIEW (ERR_INVALID_STATE otherwise)."
    roles: [ComplianceOfficer]
    code: 201
    input: [expected_third_party_version]
    output: Questionnaire
    side_effects: ["questionnaire_status=ISSUED; prior questionnaires -> SUPERSEDED; increments ThirdParty.version by 1"]
  - method: POST
    path: "/compliance/questionnaires/{questionnaire_id}/submit"
    description: "Sponsor submits answers (ISSUED or RETURNED -> SUBMITTED); computes red_flag_count"
    roles: [BusinessSponsor]
    code: 200
    input: [government_ownership_pct, has_facilitation_payments, uses_sub_agents]
    output: Questionnaire
    side_effects: ["questionnaire_status -> SUBMITTED; red_flag_count computed"]
  - method: POST
    path: "/compliance/questionnaires/{questionnaire_id}/accept"
    description: "Accept a submitted questionnaire; computes ThirdParty.risk_score_final and re-derives risk_tier"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Questionnaire
    side_effects: ["questionnaire_status -> ACCEPTED; ThirdParty.risk_score_final + risk_tier recomputed (final variant)"]
  - method: POST
    path: "/compliance/questionnaires/{questionnaire_id}/return"
    description: "Return a submitted questionnaire for corrections (cycle back to RETURNED; sponsor may resubmit)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["return_note?"]
    output: Questionnaire
    side_effects: ["questionnaire_status SUBMITTED -> RETURNED"]
  - method: GET
    path: "/compliance/third-parties/{id}/questionnaires"
    description: "List questionnaires of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["limit?", "offset?"]
    output: Questionnaire[]
    side_effects: []

  # --- RedFlag ---
  - method: POST
    path: "/compliance/third-parties/{id}/red-flags"
    description: "Raise a manual red flag (source_type=MANUAL). CRITICAL severity auto-escalates. Requires ThirdParty past DRAFT."
    roles: [ComplianceOfficer, ScreeningAnalyst]
    code: 201
    input: [severity, description]
    output: RedFlag
    side_effects: ["flag_status=OPEN; CRITICAL -> UNDER_ENHANCED_REVIEW + EscalationCase + ThirdParty suspension/enhanced review"]
  - method: POST
    path: "/compliance/red-flags/{flag_id}/disposition"
    description: "Cleared or escalate an OPEN flag. CRITICAL flags cannot be CLEARED directly. UNDER_ENHANCED_REVIEW flags are resolved only by the escalation decision."
    roles: [ComplianceOfficer]
    code: 200
    input: [disposition, "note?"]
    output: RedFlag
    side_effects: ["disposition=CLEARED -> CLEARED; disposition=ESCALATE -> UNDER_ENHANCED_REVIEW + EscalationCase + ThirdParty transition"]
  - method: GET
    path: "/compliance/third-parties/{id}/red-flags"
    description: "List red flags of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["flag_status?", "severity?", "limit?", "offset?"]
    output: RedFlag[]
    side_effects: []

  # --- EscalationCase (system-created only; discovered via list) ---
  - method: POST
    path: "/compliance/escalation-cases/{case_id}/decide"
    description: "Decide an ENHANCED_DD case. SoD: decider != escalated_by_user_id (when non-null). Outcomes drive flags and ThirdParty status."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "conditions_note?"]
    output: EscalationCase
    side_effects: ["per state_machines.EscalationCase: flags CLEARED/SUBSTANTIATED; ThirdParty DD_REVIEW/APPROVED/REJECTED/TERMINATED + termination cascade"]
  - method: GET
    path: "/compliance/third-parties/{id}/escalation-cases"
    description: "List escalation cases of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["limit?", "offset?"]
    output: EscalationCase[]
    side_effects: []

  # --- Contract ---
  - method: POST
    path: "/compliance/third-parties/{id}/contracts"
    description: "Create a contract (DRAFT). Requires ThirdParty APPROVED."
    roles: [BusinessSponsor]
    code: 201
    input: [contract_value_cents, start_date, end_date]
    output: Contract
    side_effects: ["contract_status=DRAFT; approved_payments_total_cents=0"]
  - method: POST
    path: "/compliance/contracts/{contract_id}/attach-clauses"
    description: "Attach clause codes (DRAFT -> PENDING_CLAUSES)"
    roles: [BusinessSponsor]
    code: 200
    input: [clause_codes]
    output: Contract
    side_effects: ["contract_status -> PENDING_CLAUSES"]
  - method: POST
    path: "/compliance/contracts/{contract_id}/activate"
    description: "Activate: validates clause set against approval_tier_snapshot, VERIFIED certification, no OVERDUE re-diligence cycle"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["contract_status -> ACTIVE"]
  - method: GET
    path: "/compliance/contracts/{contract_id}"
    description: "Get contract detail (incl. approved_payments_total_cents ledger)"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/compliance/third-parties/{id}/contracts"
    description: "List contracts of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["contract_status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  # --- Certification ---
  - method: POST
    path: "/compliance/third-parties/{id}/certifications"
    description: "Issue a certification requirement (PENDING); requires ThirdParty not in {REJECTED, TERMINATED} (ERR_INVALID_STATE)"
    roles: [ComplianceOfficer]
    code: 201
    input: [cert_type]
    output: Certification
    side_effects: ["cert_status=PENDING"]
  - method: POST
    path: "/compliance/certifications/{certification_id}/submit"
    description: "Sponsor submits the certification document (PENDING or REJECTED -> SUBMITTED)"
    roles: [BusinessSponsor]
    code: 200
    input: [document_ref]
    output: Certification
    side_effects: ["cert_status -> SUBMITTED"]
  - method: POST
    path: "/compliance/certifications/{certification_id}/verify"
    description: "Verify a submitted certification; valid_until := current date + 365 days"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Certification
    side_effects: ["cert_status -> VERIFIED; valid_until set"]
  - method: POST
    path: "/compliance/certifications/{certification_id}/reject"
    description: "Reject a submitted certification (may be resubmitted)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Certification
    side_effects: ["cert_status -> REJECTED"]
  - method: GET
    path: "/compliance/third-parties/{id}/certifications"
    description: "List certifications of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["cert_status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  # --- PaymentRequest ---
  - method: POST
    path: "/compliance/contracts/{id}/payment-requests"
    description: "Submit a payment request against an ACTIVE contract; computes ratio_pct at creation"
    roles: [BusinessSponsor]
    code: 201
    input: [payment_type, amount_cents, "enhanced_review_evidence?"]
    output: PaymentRequest
    side_effects: ["payment_status=SUBMITTED; ratio_pct computed; submitted_by_user_id := X-User-ID"]
  - method: POST
    path: "/compliance/payment-requests/{payment_id}/approve"
    description: "Approve: SoD vs submitter, contract ACTIVE, third party APPROVED, certification not LAPSED, commission brackets (country_blended)"
    roles: [FinanceReviewer]
    code: 200
    input: []
    output: PaymentRequest
    side_effects: ["payment_status -> APPROVED; approved_by_user_id := X-User-ID; Contract.approved_payments_total_cents += amount_cents"]
  - method: POST
    path: "/compliance/payment-requests/{payment_id}/block"
    description: "Block a submitted payment (terminal)"
    roles: [FinanceReviewer]
    code: 200
    input: ["reason?"]
    output: PaymentRequest
    side_effects: ["payment_status -> BLOCKED"]
  - method: POST
    path: "/compliance/payment-requests/{payment_id}/reverse"
    description: "Reverse an approved payment (SoD: reverser != approver); compensates the contract ledger"
    roles: [FinanceReviewer]
    code: 200
    input: ["reason?"]
    output: PaymentRequest
    side_effects: ["payment_status -> REVERSED; Contract.approved_payments_total_cents -= amount_cents"]
  - method: GET
    path: "/compliance/contracts/{id}/payment-requests"
    description: "List payment requests of a contract; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["payment_status?", "limit?", "offset?"]
    output: PaymentRequest[]
    side_effects: []

  # --- GiftHospitalityEntry ---
  - method: POST
    path: "/compliance/third-parties/{id}/gift-hospitality-entries"
    description: "Register a gift/hospitality pre-approval entry. Requires ThirdParty in DD_REVIEW/ENHANCED_REVIEW/APPROVED/SUSPENDED. Computes value_usd_cents (per-entry rounding), rolling window total, requires_enhanced_approval; hard cap rejects the create."
    roles: [BusinessSponsor]
    code: 201
    input: [entry_type, recipient_is_government_official, value_cents, fx_rate_to_usd, event_date]
    output: GiftHospitalityEntry
    side_effects: ["entry_status=PENDING_APPROVAL; value_usd_cents + requires_enhanced_approval computed"]
  - method: POST
    path: "/compliance/gift-hospitality-entries/{entry_id}/approve"
    description: "Approve an entry; enhanced entries need enhanced_review_evidence=true; re-checks the rolling hard cap at approval time"
    roles: [ComplianceOfficer]
    code: 200
    input: ["enhanced_review_evidence?"]
    output: GiftHospitalityEntry
    side_effects: ["entry_status -> APPROVED; ThirdParty.gov_gift_rolling_12m_cents recomputed"]
  - method: POST
    path: "/compliance/gift-hospitality-entries/{entry_id}/reject"
    description: "Reject a pending entry (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: GiftHospitalityEntry
    side_effects: ["entry_status -> REJECTED"]
  - method: POST
    path: "/compliance/gift-hospitality-entries/{entry_id}/void"
    description: "Void an approved entry; removes exactly its value from the rolling aggregate (compensating invariant)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: GiftHospitalityEntry
    side_effects: ["entry_status -> VOIDED; ThirdParty.gov_gift_rolling_12m_cents recomputed"]
  - method: GET
    path: "/compliance/third-parties/{id}/gift-hospitality-entries"
    description: "List gift/hospitality entries of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["entry_status?", "limit?", "offset?"]
    output: GiftHospitalityEntry[]
    side_effects: []

  # --- ReDiligenceCycle ---
  - method: POST
    path: "/compliance/third-parties/{id}/rediligence-cycles"
    description: "Manually trigger a re-diligence cycle (MANUAL, due = current + 30d). Refused when another cycle is non-completed."
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: ReDiligenceCycle
    side_effects: ["cycle_status=SCHEDULED; trigger_source=MANUAL; due_date := current + 30 days"]
  - method: POST
    path: "/compliance/rediligence-cycles/{cycle_id}/start"
    description: "Start work on a scheduled cycle"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ReDiligenceCycle
    side_effects: ["cycle_status -> IN_PROGRESS"]
  - method: POST
    path: "/compliance/rediligence-cycles/{cycle_id}/complete"
    description: "Complete with outcome REAFFIRM (renew expiry + successor cycle) | DOWNGRADE (tier up one step + 30d successor) | TERMINATE (termination cascade)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ReDiligenceCycle
    side_effects: ["cycle_status -> COMPLETED; outcome effects per calculations.rediligence_schedule"]
  - method: GET
    path: "/compliance/third-parties/{id}/rediligence-cycles"
    description: "List re-diligence cycles of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["cycle_status?", "limit?", "offset?"]
    output: ReDiligenceCycle[]
    side_effects: []

  # --- AuditExercise ---
  - method: POST
    path: "/compliance/third-parties/{id}/audit-exercises"
    description: "Notice an audit-rights exercise. Validates the 10-day notice window and half-open fieldwork overlap. Requires ThirdParty APPROVED."
    roles: [AuditLead]
    code: 201
    input: [fieldwork_start_date, fieldwork_end_date]
    output: AuditExercise
    side_effects: ["audit_status=NOTICED; notice_date := current date"]
  - method: POST
    path: "/compliance/audit-exercises/{audit_id}/begin-fieldwork"
    description: "Begin fieldwork; current date must be >= notice_date + 10 days (inclusive)"
    roles: [AuditLead]
    code: 200
    input: []
    output: AuditExercise
    side_effects: ["audit_status -> IN_FIELDWORK"]
  - method: POST
    path: "/compliance/audit-exercises/{audit_id}/issue-findings"
    description: "Issue findings; findings_substantiated_critical >= 1 fires the CRITICAL RedFlag -> EscalationCase -> ThirdParty suspension cascade"
    roles: [AuditLead]
    code: 200
    input: [findings_total, findings_substantiated_critical]
    output: AuditExercise
    side_effects: ["audit_status -> FINDINGS_ISSUED; CRITICAL RedFlag cascade per state_machines.AuditExercise"]
  - method: POST
    path: "/compliance/audit-exercises/{audit_id}/close"
    description: "Close the audit; requires every spawned RedFlag to be terminal (CLEARED/SUBSTANTIATED)"
    roles: [AuditLead]
    code: 200
    input: []
    output: AuditExercise
    side_effects: ["audit_status -> CLOSED"]
  - method: GET
    path: "/compliance/third-parties/{id}/audit-exercises"
    description: "List audit exercises of a third party; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["audit_status?", "limit?", "offset?"]
    output: AuditExercise[]
    side_effects: []

  # --- TrainingAssignment ---
  - method: POST
    path: "/compliance/training-assignments"
    description: "Assign a compliance training to an operator (ASSIGNED)"
    roles: [ComplianceAdmin]
    code: 201
    input: [assignee_user_id, course_code, due_date]
    output: TrainingAssignment
    side_effects: ["training_status=ASSIGNED"]
  - method: POST
    path: "/compliance/training-assignments/{assignment_id}/complete"
    description: "Complete an assignment (ASSIGNED or OVERDUE -> COMPLETED); self-service for the assignee, or ComplianceAdmin"
    roles: [BusinessSponsor, ComplianceAdmin]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["training_status -> COMPLETED"]
  - method: GET
    path: "/compliance/training-assignments"
    description: "List training assignments (filter by assignee/status) with pagination; ordered created_at ASC"
    roles: [ComplianceAdmin, BusinessSponsor, ScreeningAnalyst, ComplianceOfficer, FinanceReviewer, AuditLead]
    code: 200
    input: ["assignee_user_id?", "training_status?", "limit?", "offset?"]
    output: TrainingAssignment[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "BusinessSponsor attempts to act on a ThirdParty/questionnaire/certification owned by another sponsor" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: same X-User-ID on both sides of a maker/checker pair (payment submit/approve, payment approve/reverse, escalation escalate/decide)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist; or country_code has no CountryRiskProfile" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum member, policy weights not summing to 100, findings_substantiated_critical > findings_total, end_date <= start_date, percent out of 0-100" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine rejects the transition from the current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted on an entity in a terminal state" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 422, condition: "No RiskScoringPolicy is ACTIVE at submit/approve time" }
  - { id: ERR_SPONSOR_TRAINING_OVERDUE, http: 422, condition: "Sponsor has at least one TrainingAssignment with training_status == OVERDUE at third-party submit" }
  - { id: ERR_COUNTRY_SANCTIONED, http: 422, condition: "Gift/hospitality entry for a government official tied to a sanctioned-country third party" }
  - { id: ERR_EVENT_IN_PAST, http: 422, condition: "Gift pre-approval with event_date before the current date" }
  - { id: ERR_SCREENING_UNRESOLVED, http: 422, condition: "Questionnaire accept or third-party approve while any ScreeningCheck is QUEUED or POTENTIAL_HIT" }
  - { id: ERR_QUESTIONNAIRE_NOT_ACCEPTED, http: 422, condition: "Third-party approve without the current questionnaire ACCEPTED" }
  - { id: ERR_RED_FLAGS_OPEN, http: 422, condition: "Approve/reinstate while any RedFlag is OPEN or UNDER_ENHANCED_REVIEW" }
  - { id: ERR_CLAUSE_SET_INCOMPLETE, http: 422, condition: "Contract activation without the clause set required by approval_tier_snapshot" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "Contract activation without any VERIFIED certification for the third party" }
  - { id: ERR_CERTIFICATION_LAPSED, http: 422, condition: "Payment approval when no certification is VERIFIED-and-unlapsed at approval time" }
  - { id: ERR_THIRD_PARTY_NOT_APPROVED, http: 422, condition: "Contract create/attach/activate or payment approve while the third party is not APPROVED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 422, condition: "Payment create/approve while the contract is not ACTIVE" }
  - { id: ERR_COMMISSION_CAP_EXCEEDED, http: 422, condition: "ratio_pct strictly greater than commission_hard_cap_pct; cannot be approved" }
  - { id: ERR_ENHANCED_REVIEW_REQUIRED, http: 422, condition: "Amounts in the evidence-required band (effective_cap < ratio <= hard_cap) approved without enhanced_review_evidence=true; or enhanced gift approved without evidence" }
  - { id: ERR_GIFT_CAP_EXCEEDED, http: 422, condition: "Prospective government-official rolling total would exceed 50000 cents (strictly greater)" }
  - { id: ERR_AUDIT_NOTICE_TOO_SHORT, http: 422, condition: "Fieldwork starts before notice_date + 10 days (create-time window or begin-time clock check)" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 422, condition: "New fieldwork window [start, end) overlaps an existing NOTICED/IN_FIELDWORK window of the same third party" }
  - { id: ERR_REDILIGENCE_OVERDUE, http: 422, condition: "Contract activation while a re-diligence cycle of the third party is OVERDUE" }
  - { id: ERR_DUPLICATE_ACTIVE_CYCLE, http: 422, condition: "Manual re-diligence create while another cycle is SCHEDULED, IN_PROGRESS, or OVERDUE" }
  - { id: ERR_FINDINGS_PENDING, http: 422, condition: "Audit close while a spawned RedFlag is still OPEN or UNDER_ENHANCED_REVIEW" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Platform compliance administrator: owns risk configuration, the logical clock, and training assignments"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/_clock/set_current_utc"
      - "POST /compliance/country-risk-profiles"
      - "PATCH /compliance/country-risk-profiles/{profile_id}"
      - "POST /compliance/risk-scoring-policies (+ activate)"
      - "POST /compliance/training-assignments"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/training-assignments/{assignment_id}/complete"
  - name: BusinessSponsor
    description: "Business owner who onboards a third party and submits questionnaires, contracts, certifications, payments, and gift entries for it"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/third-parties (+ PATCH, submit — own records only)"
      - "POST /compliance/questionnaires/{questionnaire_id}/submit"
      - "POST /compliance/third-parties/{third_party_id}/contracts (+ attach-clauses)"
      - "POST /compliance/certifications/{certification_id}/submit"
      - "POST /compliance/contracts/{contract_id}/payment-requests"
      - "POST /compliance/third-parties/{third_party_id}/gift-hospitality-entries"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/training-assignments/{assignment_id}/complete (self only)"
  - name: ScreeningAnalyst
    description: "Runs PEP/adverse-media/sanctions screening dispositions and may raise manual red flags"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/screening-checks/{check_id}/disposition"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/third-parties/{third_party_id}/red-flags"
  - name: ComplianceOfficer
    description: "Compliance reviewer: questionnaires, red flags, escalations, approvals, suspensions, contracts activation, certifications, gifts, re-diligence"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/third-parties/{third_party_id}/questionnaires"
      - "POST /compliance/questionnaires/{questionnaire_id}/accept (+ return)"
      - "POST /compliance/red-flags/{flag_id}/disposition"
      - "POST /compliance/escalation-cases/{case_id}/decide"
      - "POST /compliance/third-parties/{third_party_id}/approve|reject|suspend|reinstate|terminate"
      - "POST /compliance/contracts/{contract_id}/activate"
      - "POST /compliance/third-parties/{third_party_id}/certifications (+ verify/reject)"
      - "POST /compliance/gift-hospitality-entries/{entry_id}/approve|reject|void"
      - "POST /compliance/third-parties/{third_party_id}/rediligence-cycles (+ start/complete)"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/third-parties/{third_party_id}/red-flags"
  - name: FinanceReviewer
    description: "Finance reviewer for commission/payment reasonableness; maker-checker with BusinessSponsor and peer FinanceReviewers"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/payment-requests/{payment_id}/approve|block|reverse"
    shared_operations:
      - "All GET endpoints"
  - name: AuditLead
    description: "Exercises contractual audit rights and reports findings"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/third-parties/{third_party_id}/audit-exercises"
      - "POST /compliance/audit-exercises/{audit_id}/begin-fieldwork|issue-findings|close"
    shared_operations:
      - "All GET endpoints"
