              captures: { e3: $.data.error_id }
          assert:
            - "the 500001 payment returns 422 ERR_PAYMENT_EXCEEDS_BALANCE and leaves fine_paid_cents == 0, fund_credited_cents == 0 and RecoveryFund.balance_cents == 0"
            - "the 300000 payment returns 200 with fine_paid_cents == 300000, fund_credited_cents == 300000, status still ISSUED, and RecoveryFund.balance_cents == 300000 with fine_credits_cents == 300000"
            - "the 200001 payment returns 422 ERR_PAYMENT_EXCEEDS_BALANCE: the ceiling is the remaining 200000, not the ordered 500000"
