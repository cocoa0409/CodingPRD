            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000, since every count submit requires a covering period."
            - "An ACTIVE HANDHELD schedule due 2026-08-01 with a started task on it."
