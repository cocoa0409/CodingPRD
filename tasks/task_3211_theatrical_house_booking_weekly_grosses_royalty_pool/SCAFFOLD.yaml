    side_effects: []

  - method: GET
    path: "/theatres/companies/{id}"
    description: "Read a production company"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: []
    output: ProductionCompany
    side_effects: []

  - method: GET
    path: "/theatres/companies"
    description: "List production companies"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionCompany[]"
    side_effects: []

  # --- Theatres ---
  - method: POST
    path: "/theatres/houses"
    description: "Register a theatre house"
    roles: [HouseManager]
    code: 201
    input: [name, capacity, size_class, is_landmark, base_weekly_rent_cents]
    output: Theatre
    side_effects: []

  - method: GET
    path: "/theatres/houses/{id}"
    description: "Read a theatre"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: []
    output: Theatre
    side_effects: []

  - method: GET
    path: "/theatres/houses"
    description: "List theatres"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Theatre[]"
    side_effects: []

  - method: GET
    path: "/theatres/houses/{id}/bookings"
    description: "List bookings for a theatre (reverse reachability)"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/theatres/houses/{id}/capital-projects"
    description: "List capital projects for a theatre"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "CapitalProject[]"
    side_effects: []

  # --- Productions ---
  - method: POST
    path: "/theatres/productions"
    description: "Create a production under a company"
    roles: [CompanyRep]
    code: 201
    input: [company_id, title, required_size_class, required_loadin_hours, required_loadout_hours]
    output: Production
    side_effects: []

  - method: GET
    path: "/theatres/productions/{id}"
    description: "Read a production"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: GET
    path: "/theatres/productions"
    description: "List productions; filterable by company_id"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["company_id?", "limit?", "offset?"]
    output: "Production[]"
    side_effects: []

  - method: GET
    path: "/theatres/productions/{id}/royalty-participants"
    description: "List royalty participants of a production"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RoyaltyParticipant[]"
    side_effects: []

  - method: GET
    path: "/theatres/productions/{id}/discount-codes"
    description: "List discount codes of a production"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "DiscountCode[]"
    side_effects: []

  # --- Bookings ---
  - method: POST
    path: "/theatres/bookings"
    description: "Request a booking window for a production in a house"
    roles: [CompanyRep]
    code: 201
    input: [production_id, theatre_id, loadin_start, run_end]
    output: Booking
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/theatres/bookings/{id}"
    description: "Read a booking"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/theatres/bookings"
    description: "List bookings; filterable by production_id and theatre_id"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["production_id?", "theatre_id?", "status?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/theatres/bookings/{id}/approve"
    description: "Approve a requested booking; cascades decline to overlapping REQUESTED competitors"
    roles: [HouseManager]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> APPROVED"
      - "overlapping REQUESTED bookings on same theatre -> DECLINED (cascade depth 1); their companies notified (cascade depth 2)"

  - method: POST
    path: "/theatres/bookings/{id}/decline"
    description: "Decline a requested booking"
    roles: [HouseManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/theatres/bookings/{id}/withdraw"
    description: "Withdraw a requested or approved booking"
    roles: [CompanyRep]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> WITHDRAWN"
      - "LicenseAgreement (DRAFT or SIGNED) -> VOIDED (cascade)"
      - "OPEN StopNotice -> DISCHARGED (cascade depth 2)"

  - method: POST
    path: "/theatres/bookings/{id}/close"
    description: "Close an active production run"
    roles: [CompanyRep]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/theatres/bookings/{id}/execute_stop_notice"
    description: "Evict an underperforming production once the stop-clause threshold is met"
    roles: [HouseManager]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> EVICTED"
      - "StopNotice -> EXECUTED (cascade depth 1)"
      - "future-dated SOLD TicketOrders -> REFUNDED (cascade depth 2)"
      - "DRAFT/SUBMITTED WeeklyGrossReport gross recomputed (cascade depth 3)"

  - method: GET
    path: "/theatres/bookings/{id}/stop-notices"
    description: "List stop notices for a booking"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "StopNotice[]"
    side_effects: []

  - method: GET
    path: "/theatres/bookings/{id}/weekly-gross-reports"
    description: "List weekly gross reports for a booking"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "WeeklyGrossReport[]"
    side_effects: []

  - method: GET
    path: "/theatres/bookings/{id}/ticket-orders"
    description: "List ticket orders for a booking"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "TicketOrder[]"
    side_effects: []

  - method: GET
    path: "/theatres/bookings/{id}/crew-assignments"
    description: "List crew assignments for a booking"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "CrewAssignment[]"
    side_effects: []

  - method: GET
    path: "/theatres/bookings/{id}/license-agreements"
    description: "List license agreements for a booking"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "LicenseAgreement[]"
    side_effects: []

  # --- License agreements ---
  - method: POST
    path: "/theatres/bookings/{booking_id}/license-agreements"
    description: "Create a license agreement for a booking; supersedes any existing DRAFT/SIGNED agreement (OCC on booking)"
    roles: [HouseManager]
    code: 201
    input: [weekly_rent_cents, stop_clause_weekly_floor_cents, stop_clause_consecutive_weeks, expected_booking_version]
    output: LicenseAgreement
    side_effects:
      - "existing DRAFT/SIGNED LicenseAgreement -> SUPERSEDED"
      - "increments Booking.version by 1"

  - method: GET
    path: "/theatres/license-agreements/{id}"
    description: "Read a license agreement"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: POST
    path: "/theatres/license-agreements/{id}/sign"
    description: "Sign a license agreement (OCC on booking)"
    roles: [CompanyRep]
    code: 200
    input: [expected_booking_version]
    output: LicenseAgreement
    side_effects:
      - "status -> SIGNED"
      - "increments Booking.version by 1"

  # --- Royalty participants ---
  - method: POST
    path: "/theatres/productions/{production_id}/royalty-participants"
    description: "Add a royalty participant (pool or fixed) to a production"
    roles: [CompanyRep]
    code: 201
    input: [participant_name, royalty_points, pool_eligible, "fixed_royalty_cents?"]
    output: RoyaltyParticipant
    side_effects: []

  - method: GET
    path: "/theatres/royalty-participants/{id}"
    description: "Read a royalty participant"
    roles: [HouseManager, CompanyRep]
    code: 200
    input: []
    output: RoyaltyParticipant
    side_effects: []

  # --- Discount codes ---
  - method: POST
    path: "/theatres/productions/{production_id}/discount-codes"
    description: "Create a discount code for a production"
    roles: [CompanyRep]
    code: 201
    input: [code, percent_off]
    output: DiscountCode
    side_effects: []

  - method: GET
    path: "/theatres/discount-codes/{id}"
    description: "Read a discount code"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: []
    output: DiscountCode
    side_effects: []

  - method: POST
    path: "/theatres/discount-codes/{id}/deactivate"
    description: "Deactivate a discount code"
    roles: [CompanyRep]
    code: 200
    input: []
    output: DiscountCode
    side_effects: ["active = false"]

  # --- Ticket orders ---
  - method: POST
    path: "/theatres/bookings/{booking_id}/ticket-orders"
    description: "Sell tickets for a performance of an ACTIVE booking"
    roles: [BoxOfficeAgent]
    code: 201
    input: [performance_date, ticket_count, is_group_sale, face_value_cents, "discount_code_id?", "dynamic_pricing_factor?"]
    output: TicketOrder
    side_effects:
      - "computed_gross_cents computed via ticket_order_gross (per-order rounding)"
      - "DRAFT WeeklyGrossReport covering performance_date, if any, has gross_cents recomputed (provisional)"

  - method: GET
    path: "/theatres/ticket-orders/{id}"
    description: "Read a ticket order"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: []
    output: TicketOrder
    side_effects: []

  - method: GET
    path: "/theatres/ticket-orders"
    description: "List ticket orders; filterable by discount_code_id"
    roles: [HouseManager, CompanyRep, BoxOfficeAgent]
    code: 200
    input: ["discount_code_id?", "limit?", "offset?"]
    output: "TicketOrder[]"
