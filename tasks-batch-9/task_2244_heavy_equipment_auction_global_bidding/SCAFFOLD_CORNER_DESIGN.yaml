          - errors[ERR_UNRESERVED_POLICY_NOT_ACK]
          - endpoints[POST /consignors/{consignor_id}/policy-ack]
        distinguishing_aspect: >
          The acknowledgement rule fires only for agreement_type UNRESERVED: the
          same unacknowledged consignor submits a RESERVE consignment
          successfully, is refused on the UNRESERVED one, and is accepted after
          signing the policy.
        test_recipe:
          setup:
