# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Crawlspace Encapsulation & Basement Waterproofing
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_job_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.Job.fields.lifecycle_status
          - entities.Job.fields.financing_status
          - endpoints
        distinguishing_aspect: "POST /jobs with all required fields returns 201 and a Job with lifecycle_status=LEAD, financing_status=NONE, assessment_severity=NONE, open_claim_count=0, version=1."
        test_recipe:
          setup:
            - "A registered homeowner exists."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "A1", email: "a1@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "100 St", structure_type: "CRAWLSPACE", footprint_sqft: 900 }
              as: Estimator
              captures: { job_id: $.data.id, life: $.data.lifecycle_status, fin: $.data.financing_status, ver: $.data.version }
          assert:
            - "Job.${job_id}.lifecycle_status == LEAD"
            - "Job.${job_id}.financing_status == NONE"
            - "Job.${job_id}.assessment_severity == NONE"
            - "Job.${job_id}.open_claim_count == 0"
            - "Job.${job_id}.version == 1"

      - name: create_job_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Job.fields.footprint_sqft
          - validations[priority=5]
        distinguishing_aspect: "POST /jobs omitting footprint_sqft (source:input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A registered homeowner exists."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "A2", email: "a2@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "101 St", structure_type: "BASEMENT" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_job_invalid_enum_structure_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Job.fields.structure_type
          - validations[priority=5]
        distinguishing_aspect: "POST /jobs with structure_type=GARAGE (not in {CRAWLSPACE,BASEMENT,COMBINED}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A registered homeowner exists."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "A3", email: "a3@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "102 St", structure_type: "GARAGE", footprint_sqft: 700 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_job_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /jobs/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "No job with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "GET /jobs/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_job_unknown_homeowner_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Job.fields.homeowner_id
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "POST /jobs whose homeowner_id references a non-existent Homeowner returns ERR_FK_NOT_FOUND (422), distinct from path-existence 404."
        test_recipe:
          setup:
            - "No homeowner with the referenced id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /jobs"
              payload: { homeowner_id: "00000000-0000-4000-8000-0000000000bb", property_address: "103 St", structure_type: "CRAWLSPACE", footprint_sqft: 700 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FK_NOT_FOUND"

      - name: quote_create_drain_under_free_threshold_charges_zero_drain
        claim_type: Computed Fields
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.subtotal_cents
          - entities.Quote.fields.drain_linear_ft
        distinguishing_aspect: "drain_linear_ft=20 with includes_drain=true yields zero billable drain feet (max(0,20-20)=0), so a 600-sqft drain-only quote has subtotal 250000; 21 ft would add 4500. Exercises the DRAIN_FREE_FT boundary as a computed field, distinct from the §1.8 footprint-tier boundary."
        test_recipe:
          setup:
            - "A 600-sqft job."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "A4", email: "a4@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "104 St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_drain: true, drain_linear_ft: 20 }
              as: Estimator
              captures: { q_id: $.data.id, sub: $.data.subtotal_cents }
          assert:
            - "Quote.${q_id}.subtotal_cents == 250000"

      - name: homeowner_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Homeowner.fields.id
        distinguishing_aspect: "Homeowner is common_fields:false — its read carries id and created_at only, no version field, and there is no update/transition endpoint for it."
        test_recipe:
          setup:
            - "A registered homeowner exists."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "A5", email: "a5@x.com", credit_band: "NEAR_PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
          trigger:
            - call: "GET /homeowners/${ho_id}"
              payload: {}
              as: Estimator
              captures: { cb: $.data.credit_band }
          assert:
            - "Homeowner.${ho_id}.credit_band == NEAR_PRIME"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_inspection_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Inspection.DRAFT_to_FINALIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Finalizing an Inspection that is already FINALIZED returns ERR_INVALID_STATE (409); no severity recompute fires."
        test_recipe:
          setup:
            - "A Job with one FINALIZED Inspection."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B1", email: "b1@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "200 St", structure_type: "CRAWLSPACE", footprint_sqft: 700 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 50, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: accept_quote_in_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Quote.SENT_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accepting a Quote still in DRAFT (never SENT) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A Job with a DRAFT (unsent) Quote."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B2", email: "b2@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "201 St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { q_id: $.data.id, qv: $.data.version }
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_inspection_supersedes_prior_finalized
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Inspection.FINALIZED_to_SUPERSEDED
          - entities.Job.fields.assessment_severity
        distinguishing_aspect: "Finalizing a second Inspection transitions the prior FINALIZED one to SUPERSEDED and updates Job.assessment_severity to the newer inspection's severity (SEVERE)."
        test_recipe:
          setup:
            - "A Job with one FINALIZED low-severity inspection and a second DRAFT inspection (moisture 85, 3 structural findings)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B3", email: "b3@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "202 St", structure_type: "COMBINED", footprint_sqft: 1000 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 40, structural_findings_count: 0 }
              as: Inspector
              captures: { insp1: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp1}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 85, structural_findings_count: 3 }
              as: Inspector
              captures: { insp2: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/inspections/${insp2}/finalize"
              payload: {}
              as: Inspector
              captures: { sev2: $.data.severity }
          assert:
            - "Inspection.${insp1}.status == SUPERSEDED"
            - "Inspection.${insp2}.severity == SEVERE"
            - "Job.${job_id}.assessment_severity == SEVERE"

      - name: terminal_install_completed_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.InstallOrder.PASSED_to_COMPLETED
          - state_machines.InstallOrder.PLANNED_to_CANCELLED
        distinguishing_aspect: "An InstallOrder in terminal COMPLETED rejects cancel with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A WARRANTED Job whose InstallOrder is COMPLETED."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B4", email: "b4@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/warranted-job"
              payload: { homeowner_id: "${ho_id}" }
              as: WarrantyAdmin
              captures: { io_id: $.data.install_order_id }
          trigger:
            - call: "POST /install-orders/${io_id}/cancel"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: install_fail_then_restart_rework_loop
        claim_type: cyclic
        grounds:
          - state_machines.InstallOrder.IN_PROGRESS_to_FAILED
          - state_machines.InstallOrder.FAILED_to_IN_PROGRESS
        distinguishing_aspect: "InstallOrder QA fail (IN_PROGRESS->FAILED) then start (FAILED->IN_PROGRESS) realizes the rework loop and lands back in IN_PROGRESS."
        test_recipe:
          setup:
            - "A SCHEDULED job whose InstallOrder is IN_PROGRESS with a CONFIRMED crew booking."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B5", email: "b5@x.com", credit_band: "PRIME" }
              as: WarrantyAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /_seed/scheduled-job"
              payload: { homeowner_id: "${ho_id}" }
              as: Scheduler
              captures: { io_id: $.data.install_order_id }
            - call: "POST /crews"
              payload: { name: "Echo", home_region: "NORTH", daily_capacity: 3 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { crew_id: "${crew_id}", install_order_id: "${io_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T17:00:00Z" }
              as: Scheduler
              captures: { cb_id: $.data.id }
            - call: "POST /crew-bookings/${cb_id}/confirm"
              payload: {}
              as: Scheduler
            - call: "POST /install-orders/${io_id}/dispatch"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: Scheduler
            - call: "POST /install-orders/${io_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /install-orders/${io_id}/inspect-fail"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /install-orders/${io_id}/start"
              payload: {}
              as: Scheduler
              captures: { st: $.data.status }
          assert:
            - "InstallOrder.${io_id}.status == IN_PROGRESS"

      - name: financing_declined_to_withdrawn_resets_job_financing
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FinancingApplication.DECLINED_to_WITHDRAWN
          - entities.Job.fields.financing_status
        distinguishing_aspect: "Withdrawing a DECLINED application moves it to WITHDRAWN and resets Job.financing_status DECLINED->NONE."
        test_recipe:
          setup:
            - "A SOLD job (PRIME) with a DECLINED financing application."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B6", email: "b6@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "203 St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /financing-applications"
              payload: { job_id: "${job_id}", quote_id: "${quote_id}", term_months: 24 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /financing-applications/${app_id}/decide"
              payload: { decision: "DECLINE" }
              as: FinancePartner
          trigger:
            - call: "POST /financing-applications/${app_id}/withdraw"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { st: $.data.status }
          assert:
            - "FinancingApplication.${app_id}.status == WITHDRAWN"
            - "Job.${job_id}.financing_status == NONE"

      - name: quote_accept_declines_sibling_sent_quotes
        claim_type: Cross-entity
        grounds:
          - state_machines.Quote.SENT_to_ACCEPTED
          - state_machines.Quote.SENT_to_DECLINED
        distinguishing_aspect: "Accepting one SENT Quote declines all sibling SENT Quotes on the same Job (sibling -> DECLINED) and sets Job.accepted_quote_id."
        test_recipe:
          setup:
            - "A QUOTED Job with two SENT Quotes (revision 1 and a revised revision 2)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "B7", email: "b7@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "204 St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/send"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q1}/revise"
              payload: { includes_sump: true, includes_dehumidifier: true }
              as: Estimator
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/send"
              payload: {}
              as: Estimator
              captures: { q2v: $.data.version }
          trigger:
            - call: "POST /quotes/${q2}/accept"
              payload: { expected_quote_version: "${q2v}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { acc_status: $.data.status }
          assert:
            - "Quote.${q2}.status == ACCEPTED"
            - "Quote.${q1}.status == REVISED"
            - "Job.${job_id}.accepted_quote_id == ${q2}"
            - "Job.${job_id}.lifecycle_status == SOLD"

  # ===========================================================================
  - section: calculations
    instances:
      - name: financing_subprime_apr_tier_selection
        claim_type: Variant Selection
        grounds:
          - calculations.financing_amortization
          - entities.FinancingApplication.fields.apr_bps
        distinguishing_aspect: "A SUBPRIME homeowner financing 395900 over 12 months selects apr 1999bps and monthly_payment 36672, exercising the subprime_tier variant distinct from the §1.8 prime_tier instance."
        test_recipe:
          setup:
            - "A SOLD job for a SUBPRIME homeowner with accepted Quote B (total 395900, under the 1.5M subprime ceiling)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "C1", email: "c1@x.com", credit_band: "SUBPRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "300 St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /financing-applications"
              payload: { job_id: "${job_id}", quote_id: "${quote_id}", term_months: 12 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id, apr: $.data.apr_bps, m: $.data.monthly_payment_cents }
          assert:
            - "FinancingApplication.${app_id}.apr_bps == 1999"
            - "FinancingApplication.${app_id}.monthly_payment_cents == 36672"

      - name: severity_pure_threshold_no_standing_water
        claim_type: Variant Selection
        grounds:
          - calculations.assessment_severity
          - entities.Inspection.fields.severity
        distinguishing_aspect: "moisture 50 + 1 structural finding + standing_water=false yields base mapping LOW with no override fired (severity stays LOW), the base_threshold_mapping variant complementing the §1.8 override instance."
        test_recipe:
          setup:
            - "A Job with a DRAFT inspection moisture 50, 1 structural finding, standing_water false."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "C2", email: "c2@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "301 St", structure_type: "CRAWLSPACE", footprint_sqft: 700 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 50, structural_findings_count: 1, standing_water: false }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
              captures: { sev: $.data.severity }
          assert:
            - "Inspection.${insp_id}.severity == LOW"

      - name: severity_severe_threshold_exact
        claim_type: Correct Result
        grounds:
          - calculations.assessment_severity
        distinguishing_aspect: "moisture 80 (+3) and 2 structural findings (min(2,4)*2=4) gives score exactly 7 == SEVERE_THRESHOLD -> SEVERE; verifies the >= boundary at the SEVERE breakpoint."
        test_recipe:
          setup:
            - "A Job with a DRAFT inspection moisture 80, 2 structural findings, no standing water."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "C3", email: "c3@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
