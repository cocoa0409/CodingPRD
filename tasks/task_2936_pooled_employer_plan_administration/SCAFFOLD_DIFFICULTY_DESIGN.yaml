      - name: fiduciary_allocation_closed_window_touching_day_rejected
        grounds:
          - validations[priority=45]
          - validations[priority=46]
          - state_machines.FiduciaryRoleAllocation.ALLOCATED_to_REVOKED
          - entities.FiduciaryRoleAllocation.fields.effective_to
        distinguishing_aspect: |
          The fiduciary window is a CLOSED interval, so it behaves the opposite way to the
          half-open pay period on the very same API: a successor whose effective_from equals
          the incumbent's effective_to is rejected, and only one day later is accepted. The
          resource being guarded is the (plan_document_id, fiduciary_role) pair, so the
          identical dates are legal for a different statutory role held by the same provider,
          and the accepted successor revokes the incumbent rather than coexisting with it.
        test_recipe:
          setup:
            - "Plan 001 ACTIVE with an acknowledged 3(16) recordkeeper and 403(a) trustee."
            - "A third ServiceProvider, Sentinel Asset Management (INVESTMENT_MANAGER)."
            - "An ALLOCATED INVESTMENT_MANAGER_3_38 allocation to Sentinel for the closed window [2026-08-03, 2026-10-31]."
