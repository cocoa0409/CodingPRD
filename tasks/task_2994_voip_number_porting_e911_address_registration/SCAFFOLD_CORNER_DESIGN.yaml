              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr1_id: $.data.id }
          trigger:
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551809"], claimed_account_number: "CSR-1043", claimed_pin: "1043", claimed_billing_name: "SUMAC OY", claimed_address_line1: "43 SUMAC SQ", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155551810"], claimed_account_number: "CSR-1043", claimed_pin: "1043", claimed_billing_name: "SUMAC OY", claimed_address_line1: "43 SUMAC SQ", claimed_zip: "94577" }
              as: PortingSpecialist
