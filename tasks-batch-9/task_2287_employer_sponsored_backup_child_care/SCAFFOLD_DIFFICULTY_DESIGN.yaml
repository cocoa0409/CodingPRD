  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: reservation_intake_blocked_by_superseded_plan_until_employee_remapped
        grounds:
          - state_machines.BenefitPlan.ACTIVE_to_SUPERSEDED
          - validations[priority=415]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - endpoints[POST /backup-care/reservations]
          - endpoints[PATCH /backup-care/employees/{id}]
        distinguishing_aspect: |
          Entity pair Reservation -> BenefitPlan: whether POST /backup-care/reservations succeeds is
          decided entirely by the status of a THIRD entity the payload never mentions — the plan
          referenced by Employee.benefit_plan_id. Activating a later-effective plan flips the
          incumbent to SUPERSEDED and the identical reservation payload turns from success into
          ERR_PLAN_NOT_ACTIVE, then succeeds again once the employee is remapped. Different entity
          pair from Provider -> Credential in
          provider_credential_review_flips_with_credential_status.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer with one ACTIVE plan P1 (effective_from 2026-01-01T00:00:00Z, annual_use_limit_days 10)."
            - "Employee mapped to P1 with one ACTIVE CHILD dependent."
            - "A second DRAFT plan P2 exists with effective_from 2026-02-01T00:00:00Z, not yet activated."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
