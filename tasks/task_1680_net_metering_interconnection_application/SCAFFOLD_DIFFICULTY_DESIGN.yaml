            - "MeterReading.${r1}.reading_status == VOIDED"
            - "After void: ServiceAccount.${acct}.credit_balance_cents == 0 (exactly the pre-reading value)"
            - "GET /ledger-entries?service_account_id=${acct} returns 2 entries: EXPORT_SURPLUS_CREDIT +3600 and REVERSAL -3600 (sum(amount_cents) == 0 == credit_balance_cents)"
            - "InterconnectionApplication.${app}.application_status == OPERATING (voiding does not revert the OPERATING flip)"
