              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF", moonlight_cap_hours: 48 }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-08-22"
              as: SchedulerAdmin
              captures: { s_0822: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-08-23"
              as: SchedulerAdmin
              captures: { s_0823: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-19"
              as: SchedulerAdmin
              captures: { s_0919_a: $.data.0.id, s_0919_b: $.data.1.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0822}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0823}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0919_a}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a3_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a1_id}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a2_id}/mark-served"
              as: SchedulerAdmin
          trigger:
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${s_0919_b}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the 2026-09-19 position-1 assignment was accepted at exactly 48 == 48 hours (captured ${a3_id}), proving the 2026-08-22 call fell outside [D-27, D]"
            - "the position-2 assignment is rejected with ERR_MOONLIGHT_CAP_EXCEEDED (captured ${err}): the 2026-08-23 call (D-27) plus position-1 plus this one total 72 > 48, proving D-27 is inside the window"

      - name: coverage_report_shortfall_and_exact_equality
        claim_type: correct_result
        grounds:
          - "calculations.coverage_compliance"
        distinguishing_aspect: "Per-date compliance uses >= semantics: 2026-09-08 with 1 of 2 primaries covered is noncompliant (shortfall 1) while 2026-09-09 with exactly 2 of 2 is compliant; open_gap_count == 1."
        test_recipe:
