              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /floral/orders/${ord_id}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/orders/${ord_id}/dispatch"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/orders/${ord_id}/confirm-delivery"
