        grounds:
          - validations[priority=41]
          - errors[ERR_BENCH_CAPACITY_EXCEEDED]
          - entities.ServiceCenter.fields.bench_capacity_blocks_per_day
        distinguishing_aspect: "Each block is individually legal (adjacent half-open windows, certified active technician) but the third one on 2026-06-16 breaks the per-date aggregate of 2; moving the same request to 2026-06-17 is accepted, proving the count is bucketed by the block's UTC calendar date and not by the center's lifetime total."
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; center bench_capacity_blocks_per_day = 2"
            - "WARRANTY_REPAIR order (NOT_BILLABLE) with two SCHEDULED FABRIC blocks already on 2026-06-16 (09:00-10:00 and 10:00-11:00, adjacent)"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
