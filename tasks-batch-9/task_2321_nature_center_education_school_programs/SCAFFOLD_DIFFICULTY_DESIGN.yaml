            - "Logical clock at 2026-09-28T07:00:00Z"
            - "ACTIVE Permit; AnimalAmbassador AVAILABLE under it with weekly_exposure_cap_minutes 240, contact_rule VIEW_ONLY, handling_tier_required TIER_1"
            - "TrailSegment OPEN with capacity_persons 40, habitat_sensitivity LOW, weekly_visitor_budget_persons 30, recovery_buffer_minutes 30"
            - "ProgramOffering PUBLISHED requiring both a live animal and a trail segment, 120 minutes"
            - "Educator CLEARED, CURRICULUM-certified for G3_5, animal_handling_tier TIER_1"
            - "Booking CONFIRMED for 20 students and 3 chaperones on that trail with that animal, so visitors_this_week is 23 and projected_exposure_minutes_7d is 120"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
