              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /vendor-firms"
              payload: { firm_name: "Blue Ridge Mitigation LLC", vendor_type: "MITIGATION", service_states: ["NC"], max_concurrent_jobs: 2, performance_score: 88.00 }
              as: VendorCoordinator
              as_user_id: "vc_seed"
              captures: { vf: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-7301", loss_state: "NC", loss_date_utc: "2026-07-27T00:00:00.000Z", reported_loss_amount: 90000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 200000, deductible_amount: 2500, estimated_damage_amount: 110000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /vendor-assignments"
              payload: { claim_id: "${cl}", scope_amount: 40000, required_vendor_type: "MITIGATION", vendor_firm_id: "${vf}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { va: $.data.id }
          trigger:
            - call: "POST /vendor-assignments/${va}/accept"
              payload: {}
              as: VendorCoordinator
              as_user_id: "${vf}"
            - call: "POST /vendor-firms/${vf}/activate"
              payload: { event_id: "${ev}" }
              as: VendorCoordinator
              as_user_id: "${vf}"
            - call: "POST /vendor-assignments/${va}/accept"
              payload: {}
              as: VendorCoordinator
              as_user_id: "${vf}"
          assert:
            - "trigger call 1 response.data.error_id == ERR_VENDOR_NOT_ACTIVATED"
            - "trigger call 1 response HTTP status == 409"
            - "trigger call 1 response.data.error_id != ERR_NOT_ASSIGNED_VENDOR"
            - "trigger call 1 response.data.error_id != ERR_VENDOR_CAPACITY_EXCEEDED"
            - "after trigger call 1: VendorAssignment.${va}.status == DISPATCHED"
            - "after trigger call 1: VendorFirm.${vf}.open_job_count == 1   # DISPATCHED already counts toward open jobs"
            - "VendorAssignment.${va}.selection_reason == EXPLICIT_VENDOR"
            - "Claim.${cl}.severity_score == 59.25   # base 100.0*min(1.0, 90000/200000) = 45.00; raw = 45.00*1.25 + 0.0 + 0.0 + 20.0*0.1500 = 56.25 + 3.00 = 59.25"
            - "Claim.${cl}.triage_tier == COMPLEX"
            - "trigger call 3 response HTTP status == 200"
            - "after trigger call 3: VendorAssignment.${va}.status == ACCEPTED"
            - "after trigger call 3: VendorFirm.${vf}.status == ACTIVATED   # open_job_count 1 < max_concurrent_jobs 2, so no CAPACITY_HOLD"
            - "VendorFirm.${vf}.activated_for_event_id == ${ev}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: adjuster_deployment_buffered_semantics_12h_gap_exact_boundary
        grounds:
          - validations[priority=23]
          - errors[ERR_DEPLOYMENT_WINDOW_CONFLICT]
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
          - calculations.deployment_cost
        distinguishing_aspect: |
          Resource entity: Adjuster. Interval semantics: BUFFERED half-open with a 12-hour REST_BUFFER_HOURS
          pad on BOTH sides, so non-overlapping intervals still collide. Probed exactly at the pad: a gap of
          11h59m59s from a DEMOBILIZED window is rejected, a gap of exactly 12h00m00s is accepted. Contrast
          with the strict zero-buffer instance below, where exact adjacency is legal.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z."
            - "One CatastropheEvent 'CAT-2026-801' in DECLARED: HAIL, TX, posture OPEN (no claims)."
            - "One STAFF Adjuster licensed in TX. All deployments use role_type DESK so no HousingBlock participates and validations priority 38 can never mask the temporal outcome."
            - "Deployment D_base (window 2026-09-01T00:00:00Z -> 2026-09-05T00:00:00Z) is confirmed, then demobilized at clock 2026-08-02T00:00:00Z. It is now DEMOBILIZED, which still counts for the buffer rule."
            - "Clock moved to 2026-08-03T00:00:00Z, well past last_demobilized_at_utc + 12h, so the Adjuster is AVAILABLE and priority 19 cannot preempt."
            - "Deployment D_bad requests 2026-09-05T11:59:59Z -> 2026-09-09T00:00:00Z: a gap of 11h59m59s after D_base's end, i.e. one second inside the pad."
            - "Deployment D_ok requests 2026-09-05T12:00:00Z -> 2026-09-09T00:00:00Z: a gap of exactly 12h00m00s, i.e. the first legal value."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-801", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 520, avg_insured_value: 165000, expected_severity_index: 0.0700 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Buffer Probe", employment_type: "STAFF", home_state: "TX", licensed_states: ["TX"], license_expiry_utc: "2027-08-31T00:00:00.000Z", max_open_claims: 10, daily_rate: 400, per_diem_rate: 0, desk_certified: true, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "DESK", window_start_utc: "2026-09-01T00:00:00.000Z", window_end_utc: "2026-09-05T00:00:00.000Z", adjuster_id: "${adj}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { d_base: $.data.id }
            - call: "POST /deployments/${d_base}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments/${d_base}/demobilize"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "DESK", window_start_utc: "2026-09-05T11:59:59.000Z", window_end_utc: "2026-09-09T00:00:00.000Z", adjuster_id: "${adj}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { d_bad: $.data.id }
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "DESK", window_start_utc: "2026-09-05T12:00:00.000Z", window_end_utc: "2026-09-09T00:00:00.000Z", adjuster_id: "${adj}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { d_ok: $.data.id }
          trigger:
            - call: "POST /deployments/${d_bad}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments/${d_ok}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "trigger call 1 response.data.error_id == ERR_DEPLOYMENT_WINDOW_CONFLICT"
            - "trigger call 1 response HTTP status == 409"
            - "after trigger call 1: Deployment.${d_bad}.status == REQUESTED"
            - "after trigger call 1: Adjuster.${adj}.deployment_status == AVAILABLE   # the rejected confirm produced no side effect"
            - "trigger call 2 response HTTP status == 200"
            - "after trigger call 2: Deployment.${d_ok}.status == CONFIRMED   # a gap of exactly 12h00m00s clears the pad"
            - "after trigger call 2: Adjuster.${adj}.deployment_status == DEPLOYED"
            - "Deployment.${d_base}.status == DEMOBILIZED   # DEMOBILIZED rows still participate in the buffer set"
            - "Adjuster.${adj}.cumulative_deployed_hours == 96.00   # only D_base has been demobilized: 4 whole days"
            - "GET /deployments?adjuster_id=${adj} returns exactly 3 rows"

      - name: housing_block_aggregate_nightly_capacity_not_overlap_per_se
        grounds:
          - validations[priority=24]
          - validations[priority=38]
          - calculations.housing_room_conservation_invariant
          - errors[ERR_HOUSING_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource entity: HousingBlock. Interval semantics: AGGREGATE-CAPACITY NIGHTLY — overlap is NOT the
          rejection criterion. Three mutually overlapping deployments are all accepted (the aggregate on the
          worst shared night 2026-09-12 is exactly 3 == rooms_total, the last accepting value), and then a
          FOURTH deployment that shares NO night with anybody is still rejected, because the flat
          rooms_available counter is 0. This inverts the usual overlap intuition in both directions.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-802' in DECLARED: FLOOD, LA, posture OPEN (no claims)."
            - "One ACTIVE HousingBlock: rooms_total 3, nightly_rate 140, block 2026-09-01 -> 2026-09-30 (block_night_count 29)."
