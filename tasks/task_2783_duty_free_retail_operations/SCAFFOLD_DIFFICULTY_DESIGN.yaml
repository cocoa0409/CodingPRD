  - rule_id: non_linear_state_machine
    instances:
      - name: sale_parallel_dimensions_tamper_advances_duty_status_only
        grounds:
          - state_machines.Sale.SUSPENDED_to_DUTY_LIABLE
          - state_machines.SealedBag.ISSUED_to_TAMPERED
          - entities.Sale.fields.fulfillment_status
          - entities.Sale.fields.duty_status
          - validations[priority=68]
        distinguishing_aspect: |
          PARALLEL shape: the two dimensions move independently. Verifying the STEB as TAMPERED
          drives duty_status SUSPENDED -> DUTY_LIABLE and rewrites the exemption to 0 exempt /
          5760 duty while fulfillment_status stays pinned at ELIGIBILITY_CLEARED, and the
          combined state then blocks pickup with ERR_SEALED_BAG_REQUIRED.
