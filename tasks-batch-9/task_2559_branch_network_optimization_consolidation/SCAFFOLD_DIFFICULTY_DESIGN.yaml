  - rule_id: resource_temporal_overlap
    instances:
      - name: notice_window_touching_buffered_end_date_collides
        grounds:
          - calculations.notice_market_window_conflict
          - validations.priority_25_ERR_NOTICE_WINDOW_CONFLICT
          - entities.ClosureNotice.fields.buffer_end_date
          - state_machines.ClosureNotice.FILED_to_EFFECTIVE
        distinguishing_aspect: |
          The contended resource is the MARKET's regulatory notice window and the intervals are
          CLOSED at both ends, so a new filing whose start date exactly equals an existing interval's
          buffered end date collides; moving the clock forward by a single day clears it. The blocking
          notice is in status EFFECTIVE (swept by the clock), proving the candidate set is not limited
          to FILED rows, and the 30-day buffer — not the effective date — is what the start touches.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with RB-101 (case X closing), RB-102 (receiving) and RB-103 (case Y closing)."
            - "Case X: APPROVED with a FINALIZED LOW assessment and a REGULATOR notice filed 2026-08-01 effective 2026-11-01, buffer_end_date 2026-12-01."
            - "Case Y: APPROVED with a FINALIZED LOW assessment (notice_required_days 90) and planned_closure_date 2027-05-15; no notice filed yet."
