            - { call: "POST /grants/work-samples", payload: { application_id: "${app1b}", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 14, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art1}" }
            - { call: "POST /grants/work-samples", payload: { application_id: "${app1b}", medium: MANUSCRIPT_PAGES, ordinal: 2, page_count: 8, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art1}" }
          trigger:
            - { call: "POST /grants/applications/${app1b}/submit", payload: {}, as: Artist, as_user_id: "${art1}", captures: { err_dup: "$.data.error_id" } }
            - *k_clock_oct16
            - { call: "POST /grants/applications/${app1b}/submit", payload: {}, as: Artist, as_user_id: "${art1}", captures: { err_deadline: "$.data.error_id" } }
            - *k_close_cycle
            - { call: "POST /grants/applications/${app1b}/submit", payload: {}, as: Artist, as_user_id: "${art1}", captures: { err_cycle: "$.data.error_id" } }
            - { call: "GET /grants/applications/${app1b}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/discipline-categories/${disc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "At clock 2026-09-01 only P85 is violated: 409 ERR_DUPLICATE_APPLICATION"
            - "At clock 2026-10-16 both P80 and P85 are violated: 409 ERR_APPLICATION_DEADLINE_PASSED"
            - "With the cycle CLOSED all of P70, P80 and P85 are violated: 409 ERR_CYCLE_STATE_INVALID"
            - "app1b stays DRAFT with submitted_at null, sealed_alias null and residency_months_at_deadline null after all three rejections"
            - "DisciplineCategory.submitted_sequence_counter is still 1 — no rejected submit consumed an alias number, and app1's sealed_alias is LIT-2027-0001"

