            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sale_v4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_inv: $.data.version }
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lot_v_inv}" }
              as: FinanceOfficer
            - call: "GET /bidders/${bidder_id}"
              payload: {}
              as: FinanceOfficer
              captures: { bal_mid: $.data.outstanding_balance_cents }
          trigger:
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_rev: $.data.version }
            - call: "POST /lots/${lot_id}/reverse-sale"
              payload: { expected_lot_version: "${lot_v_rev}" }
              as: FinanceOfficer
            - call: "GET /bidders/${bidder_id}"
              payload: {}
              as: FinanceOfficer
              captures: { bal_after: $.data.outstanding_balance_cents }
          assert:
            - "Bidder.${bidder_id}.outstanding_balance_cents before invoice == 0"
            - "Bidder.${bidder_id}.outstanding_balance_cents after invoice == 1575000"
            - "Bidder.${bidder_id}.outstanding_balance_cents after reverse-sale == 0 (equals pre-invoice value; no drift)"

      - name: invariant_seller_proceeds_conserved
        grounds:
          - calculations.seller_net_payable
          - calculations.buyers_premium
          - calculations.resale_royalty_due
          - state_machines.Lot.INVOICED_to_STATEMENTED
        distinguishing_aspect: |
          DIFFERENT conserved quantity: the hammer-price decomposition. For a
          settled lot the named identity hammer_price_cents ==
          seller_commission_cents + resale_royalty_withheld_cents +
          net_payable_cents must hold exactly (1,250,000 == 125,000 + 50,000 +
          1,075,000). Hammer is conserved across the seller-side split; no cent
          is created or lost.
        test_recipe:
          setup:
            - "Lot STATEMENTED: hammer 1,250,000, commission 10% -> 125,000, seller-borne royalty 50,000, net 1,075,000."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate Q", email: "estateq@x.com", country_code: "FR", payout_iban: "FR0000000000000000000000016" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer Q", email: "bq@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "Sale Q", sale_date_utc: "2026-07-09T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "Work Q", artist_name: "Living Q", artist_alive: true, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sale_v1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sale_v1}" }
              as: SaleAdministrator
              captures: { sale_v2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sale_v2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1250000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v_kd: $.data.version }
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lot_v_kd}" }
              as: Auctioneer
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: Auctioneer
              captures: { sale_v4: $.data.version }
            - call: "POST /auction-sales/${sale_id}/close"
              payload: { expected_auction_sale_version: "${sale_v4}" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_inv: $.data.version }
            - call: "POST /lots/${lot_id}/invoice"
              payload: { expected_lot_version: "${lot_v_inv}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /invoices/${inv_id}/payments"
              payload: { amount_cents: 1575000, expected_invoice_version: "${inv_v}" }
              as: FinanceOfficer
          trigger:
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lot_v_stmt: $.data.version }
            - call: "POST /lots/${lot_id}/statement"
              payload: { expected_lot_version: "${lot_v_stmt}" }
              as: FinanceOfficer
              captures: { h: $.data.hammer_price_cents, comm: $.data.seller_commission_cents, roy: $.data.resale_royalty_withheld_cents, net: $.data.net_payable_cents }
          assert:
            - "SellerStatement.hammer_price_cents == 1250000"
            - "SellerStatement.seller_commission_cents == 125000"
            - "SellerStatement.resale_royalty_withheld_cents == 50000"
            - "SellerStatement.net_payable_cents == 1075000"
            - "Identity holds: 1250000 == 125000 + 50000 + 1075000 (hammer conserved, no drift)"
