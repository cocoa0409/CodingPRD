            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "WX-FLC-617", name: "Merino Fleece Pullover", category: "APPAREL", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 4200, samples_per_case: 6, weekly_sample_case_pool: 30 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Priya Manthei", hourly_rate_cents: 2300, max_weekly_events: 5 }
              as: StaffingCoordinator
