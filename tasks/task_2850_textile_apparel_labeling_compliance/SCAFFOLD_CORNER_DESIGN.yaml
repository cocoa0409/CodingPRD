            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { v_before: $.data.version }
          trigger:
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "CUT_AND_SEW", country_code: "VN", value_added_usd: 9.00, weight_grams: 900.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { v_after: $.data.version }
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${v_before}" }
