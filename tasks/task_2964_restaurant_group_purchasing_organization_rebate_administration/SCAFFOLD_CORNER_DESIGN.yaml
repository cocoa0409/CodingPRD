  - section: state_machines
    instances:

      - name: countersign_decline_moves_letter_to_declined_without_counters
        claim_type: valid_transition
        grounds:
          - state_machines.AuthorizationLetter.SUBMITTED_to_DECLINED
          - endpoints["POST /authorization-letters/{letter_id}/countersign"]
        distinguishing_aspect: |
          The DECLINE branch of the same endpoint takes the OTHER edge out of
          SUBMITTED: countersigned_at stays null and neither counter moves,
          which is the observable difference from ACCEPT. DECLINED is terminal,
          so the member must file a fresh letter rather than retry this one.
        test_recipe:
          setup:
            - "Distributor METRO-01 ACTIVE, Member Harbor Grill PENDING, one SUBMITTED letter between them."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_ONLY" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
          trigger:
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "DECLINE" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
          assert:
            - "200 with AuthorizationLetter.${loa1_id}.status == DECLINED and countersigned_at == null"
            - "Member.${m1_id}.active_letter_count == 0 and Distributor.${dist_id}.active_letter_count == 0"
            - "GET /authorization-letters with status == ACTIVE returns total_count == 0"
            - "a second countersign on ${loa1_id} with decision ACCEPT returns 409 ERR_INVALID_STATE: DECLINED is terminal"
            - "POST /members/${m1_id}/activate returns 422 ERR_MEMBER_HAS_NO_ACTIVE_LOA — a declined letter does not enroll anyone"

      - name: member_activate_without_an_active_letter_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=35].ERR_MEMBER_HAS_NO_ACTIVE_LOA
          - state_machines.Member.PENDING_to_ACTIVE
          - endpoints["POST /members/{member_id}/activate"]
        distinguishing_aspect: |
          The PENDING -> ACTIVE edge exists, but its precondition is a COUNTER
          (active_letter_count >= 1), not a status: a SUBMITTED letter is not
          enough, and the same activate call flips from 422 to 200 the instant
          the distributor countersigns, with no other input changing.
        test_recipe:
          setup:
            - "Member Harbor Grill is PENDING with exactly one SUBMITTED (not yet countersigned) letter for METRO-01."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
          trigger:
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
          assert:
            - "${e1} == ERR_MEMBER_HAS_NO_ACTIVE_LOA with 422; Member.${m1_id}.enrollment_status is still PENDING and version is still 1"
            - "after the countersign: AuthorizationLetter.${loa1_id}.status == ACTIVE, countersigned_at == 2026-08-01T00:00:00.000Z, Member.${m1_id}.active_letter_count == 1, Distributor.${dist_id}.active_letter_count == 1"
            - "the second activate returns 200 with enrollment_status == ACTIVE and Member.${m1_id}.version == 2"
            - "reconciliation_posture is still CLEAR and payout_hold is still false — activation touches neither"

      - name: settle_recovery_written_off_suspends_the_distributor
        claim_type: side_effect_execution
        grounds:
          - state_machines.Distributor.ACTIVE_to_SUSPENDED
          - state_machines.PurchaseBatch.RECOVERY_REQUESTED_to_WRITTEN_OFF
          - endpoints["POST /purchase-batches/{batch_id}/settle-recovery"]
          - calculations.markup_overbilling
        distinguishing_aspect: |
          A write-off is the one path that reaches Distributor SUSPENDED, and it
          must credit NOTHING: recovered_cents is forced to 0, no member gets a
          recovery credit, and the distributor's lifetime recovered total stays
          put — while the batch's overbilled_cents (380) survives as the audit
          record of what was forgiven.
        test_recipe:
          setup:
