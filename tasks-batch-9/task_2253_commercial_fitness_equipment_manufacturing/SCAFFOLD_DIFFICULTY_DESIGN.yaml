        captures: {j1: $.data.id}
      - call: POST /install-jobs/${j1}/arrive
        payload: {}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: POST /install-jobs/${j1}/complete
        payload: {actual_labor_hours: 4.5, punch_list_open_count: 0}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /serialized-assets
        payload: {facility_id: '${f1}'}
        as: OrderPlanner
        captures: {a1: '$.data[0].id', a2: '$.data[1].id'}
      - call: POST /serialized-assets/${a1}/trade-in
        payload: {declared_condition_grade: A}
        as: OrderPlanner
      - call: GET /facilities/${f1}
        payload: {}
        as: OrderPlanner
        captures: {f1_v: $.data.version}
      - call: POST /orders/${o1}/apply-tradein-credit
        payload: {amount_cents: 100000, expected_facility_version: '${f1_v}'}
        as: OrderPlanner
      - call: POST /serialized-assets/${a1}/trade-in/reverse
        payload: {reverse_reason: premature reverse attempt}
        as: OrderPlanner
        captures: {err_applied: $.data.error_id}
      - call: POST /serialized-assets/${a2}/trade-in
        payload: {declared_condition_grade: A}
        as: OrderPlanner
      trigger:
      - call: POST /serialized-assets/${a1}/trade-in/reverse
        payload: {reverse_reason: facility retained the first unit}
        as: OrderPlanner
      - call: GET /facilities/${f1}
        payload: {}
        as: OrderPlanner
      - call: GET /orders/${o1}/price-breakdown
        payload: {}
        as: OrderPlanner
      assert:
      - The first trade-in returned 200 with SerializedAsset.${a1}.trade_in_valuation_cents == 263973 and Facility.${f1}.tradein_credit_balance_cents == 263973
      - POST /orders/${o1}/apply-tradein-credit returned 200 with Order.${o1}.tradein_credit_applied_cents == 100000 and Order.${o1}.amount_due_cents == 1033932
      - The premature reverse returned 409 with error_id ERR_TRADEIN_CREDIT_ALREADY_APPLIED (balance 163973 < grant 263973)
      - The second trade-in returned 200 with SerializedAsset.${a2}.trade_in_valuation_cents == 263973 and Facility.${f1}.tradein_credit_granted_cents == 527946
      - POST /serialized-assets/${a1}/trade-in/reverse returns 200 with SerializedAsset.${a1}.status == IN_SERVICE, trade_in_valuation_cents == null and declared_condition_grade == null
      - Facility.${f1}.tradein_credit_granted_cents == 263973, tradein_credit_applied_cents == 100000 and tradein_credit_balance_cents == 163973
      - 'The conservation invariant holds: 263973 == 100000 + 163973 and tradein_credit_balance_cents >= 0'
      - Order.${o1}.final_total_cents == 1133932 and Order.${o1}.amount_due_cents == 1033932 (the reverse does not claw back applied credit)
      - SerializedAsset.${a2}.status == TRADE_IN_RETURNED with trade_in_valuation_cents == 263973
      - Facility.${f1}.version was incremented by the successful apply-tradein-credit call
  - name: spare_stock_ledger_conserved_across_reserve_consume_release
    grounds:
    - calculations.spare_stock_ledger
    - validations[priority=35]
    - errors[ERR_INSUFFICIENT_PART_STOCK]
    - state_machines.MaintenanceVisit.SCHEDULED_to_COMPLETED
    - state_machines.MaintenanceVisit.SCHEDULED_to_CANCELLED
    - entities.ServicePartner.fields.spare_stock_on_hand_units
    - entities.SerializedAsset.fields.service_history_count
    - endpoints[POST /service-partners/{id}/parts-receipt]
    distinguishing_aspect: 'Across a receipt of 20, two reservations (5 and 12), one rejected reservation, one completion and one cancellation, the four ledger buckets always satisfy received 20 == on_hand
      + reserved + consumed: the completion moves 5 units reserved -> consumed and the cancellation returns 12 units reserved -> on_hand, ending at 15 / 0 / 5 with no unit created or destroyed.'
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - T900 Treadmill has RELEASED revision T900-R1; facility f1 (Z1) owns two IN_SERVICE assets a1 and a2.
      - ServicePartner p1 is CARDIO-certified with a 100.00-hour capacity and training current until 2027-12-31.
      - PMProgram pm1 (PRO, 90-day interval) is ACTIVE with covered_asset_count 2 and annual_labor_hours_committed 12.50.
      - Partner p1 received 20 spare units; visit v1 (asset a1) reserved 5 and visit v2 (asset a2) reserved 12, leaving on_hand 3.
      - A third visit requesting 5 units was rejected, then v1 was completed with 2.0 labor hours.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE, ARCTIC_WHITE, CLUB_RED]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: POST /facilities
        payload: {account_name: Parkway Athletic Club, freight_zone: Z1, credit_limit_cents: 500000000}
        as: OrderPlanner
        captures: {f1: $.data.id}
      - call: POST /orders
        payload: {facility_id: '${f1}', requested_install_window_start: '2026-09-10T08:00:00Z', requested_install_window_end: '2026-09-10T18:00:00Z'}
        as: OrderPlanner
        captures: {o1: $.data.id}
      - call: POST /orders/${o1}/lines
        payload: {model_revision_id: '${r1}', quantity: 2, finish_codes: [GRAPHITE], layout_zone_label: CARDIO-DECK}
        as: OrderPlanner
        captures: {l1: $.data.id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
        captures: {o1_v: $.data.version}
      - call: POST /orders/${o1}/quote
        payload: {expected_order_version: '${o1_v}'}
        as: OrderPlanner
      - call: POST /orders/${o1}/confirm
        payload: {}
        as: OrderPlanner
      - call: POST /orders/${o1}/production/complete
        payload: {}
        as: OrderPlanner
      - call: POST /service-partners
        payload: {name: Parkway Service Co, region: R_EAST, certified_categories: [CARDIO], certified_technician_count: 4, certified_hours_capacity: 100.0, training_current_until: '2027-12-31T00:00:00Z'}
        as: ServiceOpsAdmin
        captures: {p1: $.data.id}
      - call: POST /install-jobs
        payload: {order_id: '${o1}', service_partner_id: '${p1}', window_start: '2026-09-10T08:00:00Z', window_end: '2026-09-10T12:00:00Z', estimated_labor_hours: 3.0}
        as: OrderPlanner
        captures: {j1: $.data.id}
      - call: POST /install-jobs/${j1}/arrive
        payload: {}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: POST /install-jobs/${j1}/complete
        payload: {actual_labor_hours: 3.0, punch_list_open_count: 0}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /serialized-assets
        payload: {facility_id: '${f1}'}
        as: OrderPlanner
        captures: {a1: '$.data[0].id', a2: '$.data[1].id'}
      - call: POST /pm-programs
        payload: {facility_id: '${f1}', service_partner_id: '${p1}', tier: PRO, visit_interval_days: 90}
        as: ServiceOpsAdmin
        captures: {pm1: $.data.id}
      - call: POST /pm-programs/${pm1}/activate
        payload: {}
        as: ServiceOpsAdmin
      - call: POST /service-partners/${p1}/parts-receipt
        payload: {units: 20}
        as: ServiceOpsAdmin
      - call: POST /maintenance-visits
        payload: {pm_program_id: '${pm1}', serialized_asset_id: '${a1}', scheduled_date: '2026-09-18T09:00:00Z', reserved_units: 5}
        as: ServicePartnerTech
        as_user_id: ${p1}
        captures: {v1: $.data.id}
      - call: POST /maintenance-visits
        payload: {pm_program_id: '${pm1}', serialized_asset_id: '${a2}', scheduled_date: '2026-09-19T09:00:00Z', reserved_units: 12}
        as: ServicePartnerTech
        as_user_id: ${p1}
        captures: {v2: $.data.id}
      - call: POST /maintenance-visits
        payload: {pm_program_id: '${pm1}', serialized_asset_id: '${a1}', scheduled_date: '2026-09-24T09:00:00Z', reserved_units: 5}
        as: ServicePartnerTech
        as_user_id: ${p1}
        captures: {err_stock: $.data.error_id}
      - call: POST /maintenance-visits/${v1}/complete
        payload: {labor_hours: 2.0}
        as: ServicePartnerTech
        as_user_id: ${p1}
      trigger:
      - call: POST /maintenance-visits/${v2}/cancel
        payload: {cancel_reason: facility rescheduled the service window}
        as: ServicePartnerTech
        as_user_id: ${p1}
      - call: GET /service-partners/${p1}
        payload: {}
        as: ServiceOpsAdmin
      - call: GET /serialized-assets/${a1}
        payload: {}
        as: ServiceOpsAdmin
      assert:
      - After the two reservations, ServicePartner.${p1} held received 20, reserved 17, consumed 0, on_hand 3
      - The third visit request returned 409 with error_id ERR_INSUFFICIENT_PART_STOCK (on_hand 3 < requested 5)
      - POST /maintenance-visits/${v1}/complete returned 200 and moved the ledger to received 20, reserved 12, consumed 5, on_hand 3
      - POST /maintenance-visits/${v2}/cancel returns 200 with MaintenanceVisit.${v2}.status == CANCELLED
      - ServicePartner.${p1}.spare_stock_received_units == 20, spare_stock_reserved_units == 0, spare_stock_consumed_units == 5, spare_stock_on_hand_units == 15
      - 'The conservation invariant holds at every step: 20 == 15 + 0 + 5'
      - MaintenanceVisit.${v1}.status == COMPLETED with labor_hours == 2.0
      - SerializedAsset.${a1}.service_history_count == 1 and accrued_service_labor_hours == 2.0
      - SerializedAsset.${a2}.service_history_count == 0
      - PMProgram.${pm1}.annual_labor_hours_committed == 12.50 and ServicePartner.${p1}.committed_hours == 12.50
