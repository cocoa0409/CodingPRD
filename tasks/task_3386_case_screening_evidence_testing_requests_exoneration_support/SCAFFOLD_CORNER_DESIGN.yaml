          - "endpoints.POST_/ops/contact-overdue-sweep"
        distinguishing_aspect: "The overdue predicate is STRICTLY greater: at exactly interval days (90 for OPEN) the case is not overdue, at 91 it is; the sweep response enumerates only the newly flipped case ids, and log-contact clears the flag without a sweep."
        test_recipe:
          setup: ["One case created (OPEN, interval 90) at clock 2026-09-01T00:00:00Z; last_contact_at equals the creation clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
