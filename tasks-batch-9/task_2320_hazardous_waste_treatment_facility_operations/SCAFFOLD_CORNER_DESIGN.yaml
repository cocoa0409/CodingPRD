# =============================================================================
# task_2320 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml, walking
# references/claim-extraction-guide.md section by section. `section:` values are
# the guide's nine sections; `claim_type:` values are that section's own rows.
#
# The logical clock starts at 2026-08-01T00:00:00Z and moves only through
# POST /_clock/set_current_utc. Every literal in `assert:` was computed from the
# §1.3 formulas and their constants before being written down.
#
# Recurring literals used across the chains below:
#   facility          post_closure_cost_cents 8,000,000; permit to 2027-06-30
#   assurance         one TRUST_FUND instrument of 90,000,000 cents
#   empty facility    closure_base 25,000,000 -> TIER_1 -> estimate 26,250,000
#                     -> required 34,250,000
#   200 kg held       closure_base 25,360,000 -> TIER_1 -> estimate 26,628,000
#                     -> required 34,628,000
#   charge rates      SOLID x ORGANIC_SOLVENT = 30 * 1.2 = 36 cents/kg;
#                     BULK_LIQUID x ORGANIC_SOLVENT = 40 * 1.2 = 48 cents/kg;
#                     container handling fee 750 cents per received container
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: facility_create_returns_declared_and_derived_assurance_fields
        claim_type: creation
        grounds:
          - entities.Facility
          - calculations.financial_assurance_requirement
          - calculations.facility_mass_ledger
          - endpoints[POST /tsdf/facilities]
        distinguishing_aspect: |
          A facility created against an empty inventory must already publish the whole derived
          assurance stack: closure_base 25,000,000 (no held mass), TIER_1, estimate 26,250,000,
          required 34,250,000 and a shortfall equal to the requirement because nothing is posted yet.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "response status == 201"
            - "Facility.${fac_id}.version == 1"
            - "Facility.${fac_id}.permit_status == ACTIVE"
            - "Facility.${fac_id}.renewal_requested_at == null"
            - "Facility.${fac_id}.requested_permit_expires_at == null"
            - "Facility.${fac_id}.open_snc_finding_count == 0"
            - "Facility.${fac_id}.corrective_action_status == NONE"
            - "Facility.${fac_id}.received_mass_kg == 0.0"
            - "Facility.${fac_id}.held_mass_kg == 0.0"
            - "Facility.${fac_id}.mass_ledger_kg == 0.0"
            - "Facility.${fac_id}.closure_base_cost_cents == 25000000"
            - "Facility.${fac_id}.assurance_tier == TIER_1"
            - "Facility.${fac_id}.closure_cost_estimate_cents == 26250000"
            - "Facility.${fac_id}.corrective_action_reserve_cents == 0"
            - "Facility.${fac_id}.active_treatment_liability_cents == 0"
            - "Facility.${fac_id}.required_assurance_cents == 34250000"
            - "Facility.${fac_id}.posted_assurance_cents == 0"
            - "Facility.${fac_id}.assurance_shortfall_cents == 34250000"

      - name: facility_retrieval_returns_stored_row_with_posted_assurance
        claim_type: retrieval
        grounds:
          - entities.Facility
          - endpoints[GET /tsdf/facilities/{id}]
          - state_machines.FinancialAssuranceInstrument.initial_state
        distinguishing_aspect: |
          A GET after the instrument post must show the stored input fields verbatim AND the two
          fields the instrument moved: posted_assurance_cents 90,000,000 and shortfall 0. The
          facility's version is 2, because posting an instrument mutates the facility row.
        test_recipe:
          setup:
            - "One facility with a single ACTIVE 90,000,000-cent TRUST_FUND instrument"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
          trigger:
            - call: "GET /tsdf/facilities/${fac_id}"
              payload: {}
              as: RegulatoryInspector
          assert:
            - "response status == 200"
            - "Facility.${fac_id}.epa_id == TXD000111222"
            - "Facility.${fac_id}.permit_number == TX-HW-0091"
            - "Facility.${fac_id}.max_concurrent_treatment_batches == 5"
            - "Facility.${fac_id}.post_closure_cost_cents == 8000000"
            - "Facility.${fac_id}.permitted_methods == [INCINERATION, STABILIZATION, NEUTRALIZATION]"
            - "Facility.${fac_id}.version == 2"
            - "Facility.${fac_id}.posted_assurance_cents == 90000000"
            - "Facility.${fac_id}.required_assurance_cents == 34250000"
            - "Facility.${fac_id}.assurance_shortfall_cents == 0"

      - name: generator_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /tsdf/generators]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three generators with limit 2: the first page returns 2 rows with total_count 3 and
          has_more true, the second page returns the remaining row with has_more false. The
          envelope's total_count counts the whole filtered set, not the page.
        test_recipe:
          setup:
            - "Three generators created in EPA-id order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen1_id: $.data.id }
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555777", name: "Gulf Platers", generator_category: "SQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen2_id: $.data.id }
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555888", name: "Delta Labs", generator_category: "VSQG", state_code: "LA" }
              as: PlatformAdmin
              captures: { gen3_id: $.data.id }
          trigger:
            - call: "GET /tsdf/generators?limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /tsdf/generators?limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "First page: response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 row, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "GET /tsdf/generators?generator_category=SQG returns exactly 1 row whose id == ${gen2_id}"
            - "GET /tsdf/generators?status=ACTIVE returns total_count == 3"

      - name: waste_profile_create_applies_default_recertification_and_sorts_codes
        claim_type: defaults
        grounds:
          - entities.WasteProfile.fields.recertification_months
          - entities.WasteProfile.fields.waste_codes
          - endpoints[POST /tsdf/waste-profiles]
        distinguishing_aspect: |
          recertification_months is the only defaulted input on WasteProfile: omitting it must yield
          12, and waste_codes supplied out of order (["F003","D001"]) must be stored ascending, so
          later label comparison against the profile is order-independent.
        test_recipe:
          setup:
            - "One facility and one ACTIVE generator"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
          trigger:
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["F003", "D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION" }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
          assert:
            - "response status == 201"
            - "WasteProfile.${prof_id}.recertification_months == 12"
            - "WasteProfile.${prof_id}.waste_codes == [D001, F003]"
            - "WasteProfile.${prof_id}.status == DRAFT"
            - "WasteProfile.${prof_id}.sample_attempt_count == 0"
            - "WasteProfile.${prof_id}.latest_sample_result == NONE"
            - "WasteProfile.${prof_id}.approved_treatment_method == null"
            - "WasteProfile.${prof_id}.approved_at == null"
            - "WasteProfile.${prof_id}.recertification_due_at == null"
            - "WasteProfile.${prof_id}.version == 1"

      - name: container_computed_fields_derived_from_inputs_and_clock
        claim_type: computed_fields
        grounds:
          - entities.Container.fields.fill_ratio
          - entities.Container.fields.accumulation_days
          - entities.Container.fields.ten_day_overdue
          - entities.Container.fields.waste_profile_id
          - endpoints[POST /tsdf/containers]
        distinguishing_aspect: |
          fill_ratio 200.0/250.0 = 0.8, accumulation_days = floor(2026-08-01 minus 2026-07-25) = 7
          and ten_day_overdue false because the holding unit is a CONTAINER_AREA, not a
          TEN_DAY_TRANSFER unit. waste_profile_id is copied from the manifest line, never supplied.
        test_recipe:
          setup:
            - "Facility with assurance, ACTIVE generator, APPROVED SOLID/ORGANIC_SOLVENT profile"
            - "CONTAINER_AREA unit CA-01, manifest received clean at 1000.0 kg in 4 containers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/storage-units"
              payload: { facility_id: "${fac_id}", unit_code: "CA-01", unit_type: "CONTAINER_AREA", permitted_capacity_kg: 20000.0, aisle_width_cm: 120.0, aisle_free_container_capacity: 4, inspection_frequency_days: 7, allowed_compatibility_classes: ["ORGANIC_SOLVENT", "ACID"], air_emission_control_level: "LEVEL_2", containment_volume_l: 5000.0 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 1000.0, declared_container_count: 4, is_bulk: false }] }
              as: ReceivingClerk
              captures: { man_id: $.data.id }
            - call: "POST /tsdf/manifests/${man_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 1000.0, received_container_count: 4 }] }
              as: ReceivingClerk
            - call: "GET /tsdf/manifests/${man_id}/lines"
              payload: {}
              as: ReceivingClerk
              captures: { line1_id: "$.data[0].id" }
          trigger:
            - call: "POST /tsdf/containers"
              payload: { manifest_line_id: "${line1_id}", storage_unit_id: "${unit_id}", container_type: "DRUM_55G", capacity_kg: 250.0, net_weight_kg: 200.0, accumulation_start_date: "2026-07-25T00:00:00Z", label_waste_codes: ["D001"], label_hazard_class: "3", label_accumulation_start_marked: true }
              as: ReceivingClerk
              captures: { cont_id: $.data.id }
          assert:
            - "response status == 201"
            - "Container.${cont_id}.fill_ratio == 0.8"
            - "Container.${cont_id}.accumulation_days == 7"
            - "Container.${cont_id}.ten_day_overdue == false"
            - "Container.${cont_id}.custody_state == FILLING"
            - "Container.${cont_id}.compliance_state == COMPLIANT"
            - "Container.${cont_id}.last_finding_code == null"
            - "Container.${cont_id}.treatment_batch_id == null"
            - "Container.${cont_id}.waste_profile_id == ${prof_id}"
            - "Container.${cont_id}.version == 1"
            - "ManifestLine.${line1_id}.allocated_container_mass_kg == 200.0"

      - name: profile_sample_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ProfileSample
          - endpoints[POST /tsdf/waste-profiles/{id}/samples]
          - endpoints[GET /tsdf/waste-profiles/{id}/samples]
        distinguishing_aspect: |
          ProfileSample is declared common_fields false: the row carries id and created_at only —
          no version, no updated_at — and §1.5 exposes no update or delete route for it, so the
          laboratory record is append-only.
        test_recipe:
          setup:
            - "Facility, ACTIVE generator and a SUBMITTED profile awaiting its first sample"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
          trigger:
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
              captures: { sample_id: $.data.id }
          assert:
            - "response status == 201"
            - "The ProfileSample payload contains id and created_at"
            - "The ProfileSample payload contains no version key"
            - "The ProfileSample payload contains no updated_at key"
            - "ProfileSample.${sample_id}.recorded_by_user_id == chem-01"
            - "ProfileSample.${sample_id}.recorded_at == 2026-08-01T00:00:00Z"
            - "ProfileSample.${sample_id}.applied_tolerance_type == FINGERPRINT"
            - "ProfileSample.${sample_id}.result == PASS"
            - "§1.5 declares no PATCH, PUT or DELETE route addressing a ProfileSample"
            - "GET /tsdf/waste-profiles/${prof_id}/samples returns total_count == 1"

      - name: entity_specific_not_found_errors_returned_per_path_family
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_GENERATOR_NOT_FOUND]
          - errors[ERR_WASTE_PROFILE_NOT_FOUND]
          - errors[ERR_MANIFEST_NOT_FOUND]
          - errors[ERR_STORAGE_UNIT_NOT_FOUND]
          - errors[ERR_CONTAINER_NOT_FOUND]
          - errors[ERR_TREATMENT_BATCH_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          Priority 5 does not return one generic 404: each path family maps to its own error_id, and
          the four registry-style resources (instrument, sample-bearing inspection, repair order,
          finding) collapse onto ERR_RESOURCE_NOT_FOUND. All eight are asserted from an empty
          database so nothing but the path prefix can decide the error_id.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /tsdf/facilities/3f1b9c7e-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/generators/3f1b9c7e-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/waste-profiles/3f1b9c7e-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/manifests/3f1b9c7e-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/storage-units/3f1b9c7e-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/containers/3f1b9c7e-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/treatment-batches/3f1b9c7e-0000-4000-8000-000000000007"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/financial-assurance-instruments/3f1b9c7e-0000-4000-8000-000000000008"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/emission-repair-orders/3f1b9c7e-0000-4000-8000-000000000009"
              payload: {}
              as: PlatformAdmin
            - call: "GET /tsdf/compliance-findings/3f1b9c7e-0000-4000-8000-00000000000a"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Facility path: status == 404 and data.error_id == ERR_FACILITY_NOT_FOUND"
            - "Generator path: status == 404 and data.error_id == ERR_GENERATOR_NOT_FOUND"
            - "Waste-profile path: status == 404 and data.error_id == ERR_WASTE_PROFILE_NOT_FOUND"
            - "Manifest path: status == 404 and data.error_id == ERR_MANIFEST_NOT_FOUND"
            - "Storage-unit path: status == 404 and data.error_id == ERR_STORAGE_UNIT_NOT_FOUND"
            - "Container path: status == 404 and data.error_id == ERR_CONTAINER_NOT_FOUND"
            - "Treatment-batch path: status == 404 and data.error_id == ERR_TREATMENT_BATCH_NOT_FOUND"
            - "Instrument, repair-order and finding paths: status == 404 and data.error_id == ERR_RESOURCE_NOT_FOUND"
            - "Every error body carries response_type == error with meta.api_request_id and meta.api_request_timestamp"

      - name: manifest_create_without_lines_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /tsdf/manifests]
        distinguishing_aspect: |
          `lines` is a required input with no default, so a manifest posted without it is refused at
          priority 4 — before any generator, profile or duplicate-number check can run — and no
          Manifest row is created.
        test_recipe:
          setup:
            - "Facility and ACTIVE generator exist; no manifest exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tsdf/generators"
