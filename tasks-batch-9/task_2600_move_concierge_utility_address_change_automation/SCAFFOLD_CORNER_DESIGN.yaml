          - calculations.credit_deposit_amount_cents.constants.DEPOSIT_CAP_CENTS
          - entities.UtilityProvider.fields.deposit_policy
        distinguishing_aspect: |
          The only validation that fires on a reference-data write rather than on a move workflow,
          and one that is conditional on a sibling field: 50001 is refused under FLAT, exactly
          50000 is accepted, and the same 50001 is accepted under CREDIT_SCORE_BASED where
          flat_deposit_cents is ignored.
        test_recipe:
          setup:
