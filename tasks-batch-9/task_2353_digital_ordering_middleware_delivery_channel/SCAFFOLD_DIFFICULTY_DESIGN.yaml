              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1002", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o2_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1003", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
