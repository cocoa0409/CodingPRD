      - name: agency_scope_coverage_is_checked_against_the_agencys_own_accreditation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=28]
          - errors[ERR_AGENCY_SCOPE_NOT_COVERED]
          - constants.AGENCY_SCOPES
        distinguishing_aspect: "AGENCY_SCOPES is per-agency, so AGENCY_ALPHA cannot be asked for GAS: the mixed request is refused with ERR_AGENCY_SCOPE_NOT_COVERED (422) and creates no listing, while the SANITATION-only request against the same agency is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one GAS-energy EquipmentModel with no listings yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
