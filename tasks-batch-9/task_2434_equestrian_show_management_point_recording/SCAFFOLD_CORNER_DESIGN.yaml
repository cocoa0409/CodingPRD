      - name: projection_drift_closes_after_late_confirmation
        claim_type: reconciliation
        grounds:
          - calculations.class_duration_estimate.variants.confirmed_only
          - calculations.class_duration_estimate.variants.projected_all_entered
          - endpoints.GET_/shows/{id}/schedule-projection
        distinguishing_aspect: |
          The projection reports the all-entered variant against the confirmed-only
          variant, and the delta must close when the outstanding entries pay up:
          29 vs 25 (drift 4) with two of four entries confirmed becomes 29 vs 29
          (drift 0) once all four are. The stored ShowClass.estimated_minutes must NOT
          move — it was frozen at booking time — so an implementation that recomputes
          and rewrites it, or that caches the projection, is caught by the pair of
          reads.
        test_recipe:
          setup:
            - "APPROVED show, Ring A (buffer 10), JUMPER division (jumpoff true), class 101 at 120 cm OPEN."
            - "One rider with four horses -> four Entries, each with one ClassEntry on class 101 (total_due 30000 apiece); entries 1 and 2 are ACCEPTED and PAID, entries 3 and 4 are left at (RECEIVED, UNBILLED)."
            - "The slot is then booked, freezing estimated_minutes at the all-entered figure."
          setup_api_calls:
            - call: "POST /shows"
