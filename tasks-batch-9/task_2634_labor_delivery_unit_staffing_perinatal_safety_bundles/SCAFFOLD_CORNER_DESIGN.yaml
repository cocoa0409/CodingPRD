      - name: doula_certification_expiry_is_required_for_a_doula_pass_and_forbidden_for_a_partner_pass
        claim_type: Conditional action
        grounds:
          - endpoints[POST /support-person-passes]
          - entities.SupportPersonPass.fields.doula_certification_expires_at
          - entities.SupportPersonPass.fields.or_credentialed
          - entities.SupportPersonPass.fields.valid_until
          - validations[priority=5]
          - validations[priority=11.6]
          - errors[ERR_INVALID_FIELD_VALUE]
          - errors[ERR_DOULA_CREDENTIAL_EXPIRED]
        distinguishing_aspect: |
          doula_certification_expires_at is the scaffold's only conditionally-required-AND-conditionally-
          forbidden body field: §1.5 declares it "required when credential_type == DOULA_CERTIFIED and
          forbidden otherwise". Naive request validation treats optional-with-a-question-mark as
          "always accepted, never required", which passes a PARTNER pass carrying a doula expiry and a
          DOULA_CERTIFIED pass carrying none. The corner also separates two rungs that both concern the
          same field: presence/absence is the shape rule at priority 5 (400 ERR_INVALID_FIELD_VALUE)
          while freshness relative to the logical clock is the business rule §1.4 puts at priority 11.6
          (422 ERR_DOULA_CREDENTIAL_EXPIRED, explicitly "at issuance"). The success call pins the
          response-shape defaults an ISSUED pass must carry: or_credentialed false (the declared
          default, not the doula's implied privilege), reentry_count 0, and valid_until computed as
          clock_now + PASS_VALID_HOURS 24 == 2026-08-02T06:00:00Z rather than echoed from the client.
        test_recipe:
          setup: |
            One unit with one bedded LDR encounter in LATENT phase; the clock is pinned at
            2026-08-01T06:00:00Z, so 2026-07-01T00:00:00Z is a lapsed doula credential and
            2027-01-01T00:00:00Z is a live one.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
