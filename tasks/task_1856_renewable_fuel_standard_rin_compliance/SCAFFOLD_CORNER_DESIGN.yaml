            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 10, equivalence_value: 1.0 }
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_FORBIDDEN"

      - name: opsadmin_cannot_decide_own_attest_close
        claim_type: role_denial
        grounds: [roles.OpsAdmin, roles.Auditor]
        distinguishing_aspect: "Attest close is Auditor-only; OpsAdmin (regulator proxy) is denied — attest independence is preserved."
        test_recipe:
          setup: ["account + year; engagement in FINDINGS_ISSUED with CLEAN findings"]
          setup_api_calls:
