scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_plant_with_valid_fields_returns_201
        claim_type: creation
        grounds:
          - entities.TreatmentPlant
          - "endpoints.POST /treatment-plants"
        distinguishing_aspect: "POST /treatment-plants with plant_name + alsc_license_number returns 201, all input fields echoed, system fields initialized."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /treatment-plants"
              payload: { plant_name: "Cascade Treating", alsc_license_number: "ALSC-CA-0042" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
          assert:
            - "Response 201; data.plant_name == 'Cascade Treating'"
            - "data.compliance_score == 1000"
            - "data.hazardous_waste_liability_cents == 0"
            - "data.status == LICENSED"
            - "data.version == 1"

      - name: create_plant_missing_required_field_returns_400
        claim_type: required_field_validation
        grounds:
          - entities.TreatmentPlant.fields.plant_name
          - "endpoints.POST /treatment-plants"
        distinguishing_aspect: "POST /treatment-plants without plant_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /treatment-plants"
              payload: { alsc_license_number: "ALSC-1" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "Response 400; data.error_id == ERR_INVALID_REQUEST"

      - name: create_cylinder_invalid_enum_process_type_returns_400
        claim_type: type_constraint_violation
        grounds:
          - entities.TreatmentCylinder.fields.supported_process_types
          - "endpoints.POST /treatment-plants/{plantId}/cylinders"
        distinguishing_aspect: "supported_process_types containing an unsupported enum member returns 400 ERR_INVALID_ENUM."
        test_recipe:
          setup:
            - "Plant P exists"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["INVALID_PROCESS"] }
              as: PlantOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "Response 400; data.error_id == ERR_INVALID_ENUM"

      - name: computed_target_retention_pcf_derived_from_use_category
        claim_type: computed_field
        grounds:
          - entities.Charge.fields.target_retention_pcf
          - entities.Charge.fields.use_category
        distinguishing_aspect: "target_retention_pcf is computed server-side from use_category lookup; client input for it is ignored."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, slot"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC4A"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: "$.data.id", target_retention: "$.data.target_retention_pcf" }
          assert:
            - "Charge.target_retention_pcf == 0.40 (UC4A lookup value)"
            - "Any client-supplied target_retention_pcf is ignored"

      - name: computed_requires_incising_for_doug_fir_uc4b
        claim_type: computed_field
        grounds:
          - entities.Charge.fields.requires_incising
        distinguishing_aspect: "requires_incising = true when species_group in {DOUGLAS_FIR, HEM_FIR} AND use_category in {UC4B, UC4C}; false otherwise."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, slot"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "DOUGLAS_FIR"
                use_category: "UC4B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: "$.data.id", req_inc: "$.data.requires_incising" }
          assert:
            - "Charge.requires_incising == true (DOUGLAS_FIR + UC4B)"
            - "Charge.is_custom_treat == false (ownership_type == PLANT_STOCK)"

      - name: system_fields_input_ignored
        claim_type: system_field
        grounds:
          - entities.TreatmentPlant
          - entities.Charge
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated; client-supplied values are ignored."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1", id: "spoofed-id", version: 99 }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
          assert:
            - "Response 201; data.id != 'spoofed-id' (server-minted UUID)"
            - "data.version == 1 (not 99)"
            - "data.created_at present in ISO 8601 UTC format with 3 fractional digits"

      - name: list_plants_pagination_defaults
        claim_type: listing
        grounds:
          - "endpoints.GET /treatment-plants"
          - response_envelope
        distinguishing_aspect: "GET /treatment-plants with no pagination params uses defaults limit=10, offset=0; response envelope contains limit/offset/total_count/has_more."
        test_recipe:
          setup:
            - "Create 3 plants"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants"
              payload: { plant_name: "P2", alsc_license_number: "A2" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants"
              payload: { plant_name: "P3", alsc_license_number: "A3" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /treatment-plants"
              as: PlantOperator
          assert:
            - "Response envelope contains pagination fields: limit, offset, total_count, has_more"
            - "limit == 10, offset == 0, total_count == 3, has_more == false"
            - "data is an array of 3 TreatmentPlant objects"

      - name: immutable_retention_assay_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.RetentionAssay
        distinguishing_aspect: "RetentionAssay has common_fields: false — no update endpoint exists; only create and read."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, Charge Q CYCLE_COMPLETE"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.42
                min_sample_retention_pcf: 0.39
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
              captures: { assay_id: "$.data.id" }
          trigger:
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays/${assay_id}"
              as: LabTechnician
          assert:
            - "RetentionAssay has no 'version' or 'updated_at' field in response (common_fields: false)"
            - "No PUT/PATCH/DELETE endpoint exists for /retention-assays/{id} — 404 or 405"

      - name: fk_reverse_reachability_charge_pieces
        claim_type: parent_relationship
        grounds:
          - entities.ChargePiece.fields.charge_id
        distinguishing_aspect: "ChargePiece.charge_id FK -> Charge.id; reverse-reachable via GET /charges/{chargeId}/pieces."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, Charge Q with 2 pieces"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest:
                  - { piece_tag: "P1", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }
                  - { piece_tag: "P2", length_ft: 10, width_in: 5.5, thickness_in: 1.5 }
              as: PlantOperator
              captures: { charge_id: "$.data.id" }
          trigger:
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}/pieces"
              as: PlantOperator
          assert:
            - "Response is ChargePiece[] with exactly 2 pieces"
            - "Each piece has charge_id == ${charge_id}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: charge_tag_from_wrong_state_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Charge
          - "endpoints.POST /treatment-plants/{plantId}/charges/{chargeId}/tag"
        distinguishing_aspect: "POST /tag on a Charge in IN_CYLINDER (not ASSAYED_PASS) returns 409 ERR_CHARGE_NOT_ASSAYED_PASS."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, Charge Q in IN_CYLINDER"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: "$.data.id" }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/tag"
              as: PlantOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "Response 409; data.error_id == ERR_CHARGE_NOT_ASSAYED_PASS"

      - name: plant_terminal_revoked_no_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TreatmentPlant
        distinguishing_aspect: "TreatmentPlant in REVOKED (terminal) rejects all state-transition endpoints."
        test_recipe:
          setup:
            - "Plant P with compliance_score = 0, SUSPENDED then REVOKED"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/suspend"
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/revoke"
              as: ComplianceOfficer
          trigger:
            - call: "POST /treatment-plants/${plant_id}/suspend"
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "Response 409; data.error_id == ERR_INVALID_STATE"
            - "No transitions possible from REVOKED"

      - name: inspection_begin_outside_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QualityInspection.SCHEDULED_to_IN_PROGRESS
          - "errors[ERR_INSPECTION_WINDOW_MISSED]"
        distinguishing_aspect: "POST /inspections/{id}/begin when now is after inspection_window_end returns 409 ERR_INSPECTION_WINDOW_MISSED."
        test_recipe:
          setup:
            - "Plant P, Inspection window [09:00, 17:00]"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/inspections"
              payload:
                agency_code: "ALSC"
                inspection_window_start: "2026-08-10T09:00:00Z"
                inspection_window_end: "2026-08-10T17:00:00Z"
                charges_in_scope: []
                severity: "MINOR"
              as: QualityAgencyInspector
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /treatment-plants/${plant_id}/inspections/${insp_id}/begin"
              as: QualityAgencyInspector
              captures: { err: "$.data.error_id" }
          assert:
            - "Response 409; data.error_id == ERR_INSPECTION_WINDOW_MISSED"

      - name: cycle_complete_side_effects_cascade_to_charge
        claim_type: side_effect_execution
        grounds:
          - state_machines.TreatmentCycle.DRAINING_to_COMPLETE
          - state_machines.Charge.IN_CYLINDER_to_CYCLE_COMPLETE
        distinguishing_aspect: "Cycle complete triggers: cycle → COMPLETE, cylinder → NEEDS_CLEANING, charge → CYCLE_COMPLETE, provisional_retention_pcf computed."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, Charge Q, Cycle in DRAINING"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}"
              as: PlantOperator
              captures: { charge_status: "$.data.status", prov_ret: "$.data.provisional_retention_pcf" }
            - call: "GET /treatment-plants/${plant_id}/cylinders/${cyl_id}"
              as: PlantOperator
              captures: { cyl_status: "$.data.status" }
          assert:
            - "TreatmentCycle.${cycle_id}.status == COMPLETE"
            - "Charge.${charge_id}.status == CYCLE_COMPLETE"
            - "Cylinder.${cyl_id}.status == NEEDS_CLEANING"
            - "Charge.provisional_retention_pcf == round(0.85 * (6.0/100) * 0.92, 3) = 0.047"

      - name: initial_state_new_charge_is_in_cylinder
        claim_type: initial_state
        grounds:
          - state_machines.Charge
        distinguishing_aspect: "Charge created via POST /charges lands directly in IN_CYLINDER (skips STAGED in the API flow)."
        test_recipe:
          setup:
            - "Plant P, Cylinder C, slot"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: "$.data.id", status: "$.data.status" }
          assert:
            - "Charge.status == IN_CYLINDER on creation response"

      - name: idempotency_double_tag_returns_error
        claim_type: idempotency
        grounds:
