              captures: { note_a: $.data.0.id }
          trigger:
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_a}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == 'ERR_NOT_NOTIFICATION_OWNER'"

      - name: missing_user_context_header_rejected
        claim_type: unauthorized_role
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no valid X-User-Role/X-User-ID on POST /locate-tickets -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)."
        test_recipe:
          setup: ["One excavator for a valid excavator_id."]
