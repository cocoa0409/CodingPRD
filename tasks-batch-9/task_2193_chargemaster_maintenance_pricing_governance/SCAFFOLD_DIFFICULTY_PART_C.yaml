            - "Trigger item T (cdm CDM-1001, cost_basis 100000, companion_required_item_id = C, companion_window_hours 24) repriced to gross_charge_cents 240000 and ACTIVE."
            - "One INGESTED capture batch over closed window [2026-08-03T00:00:00Z, 2026-08-10T23:59:59Z] with four lines: for each of encounters ENC-1 and ENC-2 a T line (quantity 2, posted 480000) and a C line posted 48 hours later (quantity 2, posted 256000) — outside the 24-hour companion window, so both T lines are unpaired."
