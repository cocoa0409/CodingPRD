      - name: role_band_rejects_before_the_schema_band
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A single request violates priority 2 and priority 3 at once — a ServicingAgent posting a TradeRule body that is also missing max_ticket_cents — and the response is ERR_ROLE_NOT_PERMITTED (403), never ERR_INVALID_REQUEST (400): authorization is decided before the body is inspected."
        test_recipe:
          setup:
            - "Empty system; no TradeRule rows."
          setup_api_calls:
            - call: "GET /trade-rules"
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "TRIGGER 1: HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED — POST /trade-rules declares roles [ProgramAdmin] only"
            - "TRIGGER 1 does NOT return ERR_INVALID_REQUEST even though max_ticket_cents is absent"
            - "TRIGGER 2: the same body from the permitted role now fails on the schema band with HTTP 400 and data.error_id == ERR_INVALID_REQUEST (max_ticket_cents is required)"
            - "GET /trade-rules still returns total_count 0"

