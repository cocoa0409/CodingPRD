# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3005_small_format_rural_store_rollout_real_estate
# Breadth walk of the claim-extraction-guide taxonomy over §1.1–§1.7.
# All numeric asserts are literal values computed from the §1.3 formulas.
# Shared setup abbreviations used below:
#   QUALIFY_A: create program -> activate -> trade area A
#     (drive 20, hh 1000, income 4500000, gap 20 -> score 41.94) -> screen
#     with captured version -> QUALIFIED.
#   STORE_S: POST /stores in QUALIFIED trade area -> capture sid + s_v0.
#   FORMAT_S: select-format with expected_store_version ${s_v0}.
#   AG_FLOW: create developer DevCo -> create agreement -> execute.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_applies_defaults_and_envelope
        claim_type: creation_defaults_envelope
        grounds:
          - entities.Rollout
          - response_envelope
        distinguishing_aspect: "Omitting optional cannibalization_coefficient applies the 0.40 default; response envelope carries meta + response_type=object and pagination defaults on list endpoints."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /rollouts/${rid}"
              as: PROGRAM_ADMIN
          assert:
            - "Rollout.${rid}.cannibalization_coefficient == 0.4 (default applied)"
            - "Rollout.${rid}.status == DRAFT and committed_capital_cents == 0 and available_capital_cents == 2000000000 and version == 1"
            - "response envelope contains meta.api_request_id, meta.api_request_timestamp, response_type == object"

      - name: store_create_missing_trade_area_id_rejected
        claim_type: required_fields
        grounds:
          - entities.Store.fields.trade_area_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /stores without the required trade_area_id fails with ERR_INVALID_REQUEST (400) before any existence check."
        test_recipe:
          setup: ["ACTIVE program with QUALIFIED trade area A (QUALIFY_A)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
          trigger:
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", name: "NoArea" }
              as: PROGRAM_ADMIN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: get_missing_store_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Store
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent store id inside a real program returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["program exists (DRAFT)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /rollouts/stores/00000000-0000-0000-0000-000000000000"
              as: PROGRAM_ADMIN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: program_event_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.RolloutEvent
        distinguishing_aspect: "RolloutEvent has common_fields: false — no update endpoint exists and GET returns events without a version field; the log is append-only."
        test_recipe:
          setup: ["program created and activated (emits PROGRAM_ACTIVATED as sequence 1)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
          trigger:
            - call: "GET /rollouts/program-events"
              as: PROGRAM_ADMIN
          assert:
            - "events list has exactly 1 entry with event_type == PROGRAM_ACTIVATED and sequence_number == 1"
            - "the event entry has NO version field and NO updated_at field (common_fields: false)"

      - name: store_self_referential_existing_link
        claim_type: parent_relationship
        grounds:
          - entities.Store.fields.existing_store_id
        distinguishing_aspect: "Self-referential FK: a new EXISTING store record can link to a prior store via existing_store_id, and the reverse lookup GET /stores?existing_store_id=<id> returns exactly the linked record."
        test_recipe:
          setup: ["ACTIVE program; trade area T0 (unscreened SCREENING ok for EXISTING registration); EXISTING store X"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 50000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X2", is_existing: true, format_type: "TRADITIONAL", existing_store_id: "${ex}", open_year_sales_cents: 60000000 }
              as: PROGRAM_ADMIN
              captures: { ex2: $.data.id }
            - call: "GET /rollouts/stores"
              payload: { existing_store_id: "${ex}" }
              as: PROGRAM_ADMIN
          assert:
            - "Store.${ex2}.existing_store_id == ${ex} and status == EXISTING"
            - "filtered list returns exactly 1 store: ${ex2}"

      - name: trade_area_list_pagination_envelope
        claim_type: listing
        grounds:
          - entities.TradeArea
          - response_envelope
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more: 3 trade areas with limit=2 yields total_count 3 and has_more true."
        test_recipe:
          setup: ["ACTIVE program; three trade areas created"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A1", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A2", drive_time_minutes: 21, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A3", drive_time_minutes: 22, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
          trigger:
            - call: "GET /rollouts/trade-areas"
              payload: { limit: 2, offset: 0 }
              as: PROGRAM_ADMIN
          assert:
            - "response data has 2 entries; meta pagination reports total_count == 3 and has_more == true"

      - name: trade_area_create_out_of_range_gap_rejected
        claim_type: type_constraints
        grounds:
          - entities.TradeArea.fields.grocery_gap_pct
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "grocery_gap_pct 140 exceeds the declared 0..100 constraint -> ERR_VALIDATION (422), distinct from missing-field ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["program ACTIVE"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
          trigger:
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "BadGap", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 140 }
              as: PROGRAM_ADMIN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 422)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: screen_on_qualified_area_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TradeArea
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "QUALIFIED is not a from-state of any screen transition — re-screening a QUALIFIED area (without the de-qualifying rescreen path because a live store exists is a different check) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE program; trade area A QUALIFIED (QUALIFY_A); store S created so rescreen-to-REJECTED is also blocked"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
            - call: "GET /rollouts/trade-areas/${taid}"
              as: PROGRAM_ADMIN
              captures: { ta_v_now: $.data.version }
          trigger:
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v_now}" }
              as: PROGRAM_ADMIN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409): a live store pins the QUALIFIED trade area against rescreening"

      - name: executed_store_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Store
        distinguishing_aspect: "OPEN is terminal for the pipeline: executing an already-EXECUTED opening plan (store now OPEN) is rejected — no transition out of EXECUTED exists."
        test_recipe:
          setup: ["store S fully opened: QUALIFIED area, format, agreement EXECUTED->ACTIVE->DELIVERED on time 2026-11-01, plan (2026-12-05) created, locked, clock at 2026-12-02, executed"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-11-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/site-agreements/${agid}/activate"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/site-agreements/${agid}/deliveries"
              payload: { rollout_program_id: "${rid}", actual_delivery_date: "2026-11-01T00:00:00Z" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/opening-plans"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", opening_date: "2026-12-05T00:00:00Z", peak_season: false }
              as: OPERATIONS_LEAD
              captures: { opid: $.data.id }
            - call: "POST /rollouts/_clock-set"
              payload: { rollout_program_id: "${rid}", to_iso8601: "2026-12-02T00:00:00Z" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/opening-plans/${opid}/lock"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
            - call: "POST /rollouts/opening-plans/${opid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
          trigger:
            - call: "POST /rollouts/opening-plans/${opid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
              captures: { err: $.data.error_id }
          assert:
            - "second execute rejected: error_id == ERR_INVALID_STATE (plan already EXECUTED, terminal)"
            - "Store.${sid}.status == OPEN and SiteControlAgreement.${agid}.status == COMPLETED"

      - name: kill_proposed_store_terminal
        claim_type: valid_transition
        grounds:
          - state_machines.Store.PROPOSED_to_KILLED
        distinguishing_aspect: "Killing a bare PROPOSED store (no children) succeeds; a second kill is rejected because KILLED is terminal."
        test_recipe:
          setup: ["ACTIVE program; QUALIFIED area; store S PROPOSED"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /rollouts/stores/${sid}/kill"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/stores/${sid}/kill"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
              captures: { err: $.data.error_id }
          assert:
            - "first kill: Store.${sid}.status == KILLED"
            - "second kill: error_id == ERR_INVALID_STATE"

      - name: study_finalize_blocked_on_blocked_recommendation
        claim_type: invalid_transition
        grounds:
          - state_machines.CannibalizationStudy.DRAFT_to_FINAL
          - errors[ERR_CANNIBALIZATION_BLOCKED]
        distinguishing_aspect: "A study whose aggregate transfer_pct 20.33 exceeds the 15.00 BLOCK threshold (entries X@0.25 impact 10.00 + Y@0.40 impact 16.00) cannot be finalized — finalize is defined only for PROCEED/MITIGATE."
        test_recipe:
          setup: ["ACTIVE program; EXISTING X (sales 200000000) and Y (sales 60000000); store S DG_FRESH (projected_revenue_cents 145600000)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 200000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "Y", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 60000000 }
              as: PROGRAM_ADMIN
              captures: { ey: $.data.id }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "F", drive_time_minutes: 18, household_count: 2000, median_household_income_cents: 4500000, grocery_gap_pct: 30 }
              as: PROGRAM_ADMIN
              captures: { taf: $.data.id, taf_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taf}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${taf_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taf}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.25 }, { existing_store_id: "${ey}", overlap_weight: 0.40 } ] }
              as: FINANCE_ANALYST
              captures: { csid: $.data.id }
            - call: "POST /rollouts/cannibalization-studies/${csid}/finalize"
              payload: { rollout_program_id: "${rid}", rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
              captures: { fin_err: $.data.error_id }
          assert:
            - "study transfer: X contributes 200000000*0.25*0.4 = 20000000 (impact 10.00); Y contributes 60000000*0.40*0.4 = 9600000 (impact 16.00)"
            - "CannibalizationStudy.${csid}.transfer_pct == 20.33 (29600000/145600000) and recommendation == BLOCKED (aggregate 20.33 > 15)"
            - "finalize rejected: error_id == ERR_CANNIBALIZATION_BLOCKED; study stays DRAFT"

      - name: decide_on_draft_capital_project_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CapitalProject
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "decide is defined only from SUBMITTED — deciding a DRAFT project (never submitted) returns ERR_INVALID_STATE with a current expected_program_version."
        test_recipe:
          setup: ["ACTIVE program; EXISTING store X; REMODEL project CP in DRAFT"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
              captures: { p_v: $.data.version }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 50000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/capital-projects"
              payload: { rollout_program_id: "${rid}", kind: "REMODEL", store_id: "${ex}", remodel_cost_cents: 80000000, projected_uplift_cents: 60000000 }
              as: FINANCE_ANALYST
              captures: { cpid: $.data.id }
          trigger:
            - call: "POST /rollouts/capital-projects/${cpid}/decide"
              payload: { rollout_program_id: "${rid}", decision: "APPROVE", expected_program_version: "${p_v}" }
              as: PROGRAM_ADMIN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (DRAFT is not a decide from-state)"

      - name: activate_deliver_open_happy_path
        claim_type: side_effect_execution
        grounds:
          - state_machines.Store.DELIVERED_to_OPEN
          - state_machines.SiteControlAgreement.DELIVERED_to_COMPLETED
        distinguishing_aspect: "Full forward chain side effects all fire: execute opening plan -> plan EXECUTED, store OPEN, agreement COMPLETED, RolloutEvent STORE_OPENED appended."
        test_recipe:
          setup: ["store S DELIVERED (on-time delivery 2026-11-01); opening plan LOCKED (2026-12-05); clock 2026-12-04"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
