        claim_type: violation_to_error
        grounds: ["errors[ERR_FREEZE_LIMIT_REACHED]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / freeze_days_first_vs_subsequent_episode_divergence
          rationale: "Freeze accumulation toward MAX_FREEZE_DAYS is exercised by the §1.8 freeze-episode instance; the cap rejection is its boundary partner."

      - name: error_weather_hold_on_cabana_sale
        claim_type: violation_to_error
        grounds: ["errors[ERR_WEATHER_HOLD]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / weather_hold_beats_capacity_on_cabana_rental
          rationale: "ERR_WEATHER_HOLD is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_cabana_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_CABANA_OVERLAP]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cabana_overlap_with_turnover_buffer
          rationale: "ERR_CABANA_OVERLAP is the asserted failure of the named §1.8 overlap instance."

      - name: error_stale_version_on_cabana_rental
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[cabana-rent-stale-window]"]
