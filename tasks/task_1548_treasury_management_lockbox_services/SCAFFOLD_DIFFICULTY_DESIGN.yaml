      - name: gross_service_charges_per_line_rounding_then_sum
        grounds:
          - calculations.gross_service_charges
          - entities.AnalysisLineItem.fields.extended_amount_cents
          - entities.AnalysisCycle.fields.gross_service_charges_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Pinned order: round each
          line to whole cents first, THEN sum. If the implementation instead sums
          fractional products and rounds once at the end, the resulting
          gross_service_charges_cents can differ by one or more cents depending on
          the fee/quantity combinations (e.g. non-integer intermediate per-line
          products when quantity*unit_price_cents is fractional under certain
          tiered or discounted pricing extensions).
        test_recipe:
          setup:
            - "Bank B; Customer C; Agreement A with monthly_maintenance_fee_cents=33333 (an odd value), per_item_capture_fee_cents=7, per_exception_decision_fee_cents=13, per_image_retrieval_fee_cents=17"
