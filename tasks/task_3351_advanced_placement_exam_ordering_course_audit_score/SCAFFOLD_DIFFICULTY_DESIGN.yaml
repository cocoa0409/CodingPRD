scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: exam_order_fee_provisional_vs_consolidated_marginal_rebate
        grounds:
          - calculations.order_fee_dual_variant
          - state_machines.ExamOrder.OPEN_to_SUBMITTED
          - state_machines.ExamOrder.MATERIALS_RECEIVED_to_DELIVERED
          - entities.ExamOrder.fields.provisional_order_fee_cents
        distinguishing_aspect: "The ExamOrder fee has a provisional variant charged at the OPEN -> SUBMITTED transition and a consolidated variant charged at MATERIALS_RECEIVED -> DELIVERED, and the consolidated variant applies MARGINAL rebate slices (each slice rounded before summing) rather than a single blended rate, so provisional_fee 197000 and consolidated_fee 152360 are both readable on the same row and are never equal."
        test_recipe:
          setup:
            - "School S approved, clock at 2026-12-01T00:00:00Z so the ordering window is REGULAR, one order holding 10 registrations: 2 LATE, 1 EMERGENCY, 7 REGULAR, none delivered yet"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Northview High", school_code: "NV0001", country_code: "US", center_code: "4411", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Calculus AB", syllabus_hash: "h-nv-1", submitted_by_user_id: "u-coord-1" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_id_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_id_v1}" }
              as: CourseAuditReviewer
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "syllabus meets the curricular requirements" }
              as: CourseAuditReviewer
            - call: "POST /ap-program/students"
              payload: { full_name: "Ada Chan", school_id: "${school_id}", student_code: "S0001", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_id_v1: "$.data.version" }
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-CALC-AB", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "SUBMITTED", expected_exam_order_version: "${order_id_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "ExamOrder.order_fee_cents == 197000"
            - "ExamOrder.provisional_order_fee_cents == 197000"
      - name: score_send_fee_all_include_vs_college_only_exclude
        grounds:
          - calculations.score_send_fee_dual_variant
          - state_machines.ScoreSend.PENDING_to_CANCELLED
          - entities.ScoreSend.fields.credit_back_cents
        distinguishing_aspect: "The ScoreSend fee differs by INCLUDE-SET: the all_include variant counts SCHOOL sends against the same free allowance as COLLEGE sends while the college_only_exclude variant excludes SCHOOL sends from both the allowance and the count, so the very same ScoreSend row reports fee_cents 2500 under the school-level report and 0 under the per-student college checkout view."
        test_recipe:
          setup:
            - "A released score for one student; two COLLEGE sends already exist for that ExamScore (a third is already paid for), no SCHOOL send exists yet"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Northview High", school_code: "NV0002", country_code: "US", center_code: "4412", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Calculus AB", syllabus_hash: "h-nv-2", submitted_by_user_id: "u-coord-2" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_id_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_id_v1}" }
              as: CourseAuditReviewer
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "approved for program designation" }
              as: CourseAuditReviewer
            - call: "POST /ap-program/students"
              payload: { full_name: "Bo Diaz", school_id: "${school_id}", student_code: "S0002", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-CALC-AB", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { reg_id: "$.data.id" }
            - call: "POST /ap-program/readers"
              payload: { full_name: "Rita Ellis", subject_expertise: "AP-CALC-AB" }
              as: ScoringSpecialist
              captures: { reader_id: "$.data.id" }
            - call: "POST /ap-program/readers/${reader_id}/status-transitions"
              payload: { to_status: "CALIBRATING" }
              as: ScoringSpecialist
            - call: "POST /ap-program/readers/${reader_id}/status-transitions"
              payload: { to_status: "CALIBRATED", calibration_sample_count: 20, calibration_agreement_rate: 0.9000 }
              as: ScoringSpecialist
              captures: { reader_v3: "$.data.version" }
            - call: "POST /ap-program/exam-registrations/${reg_id}/status-transitions"
              payload: { to_status: "CONFIRMED" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/exam-registrations/${reg_id}/status-transitions"
              payload: { to_status: "MATERIAL_ASSIGNED" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/exam-scores"
              payload: { exam_registration_id: "${reg_id}", raw_composite: 96.0, reader_id: "${reader_id}" }
              as: ScoringSpecialist
              captures: { score_id: "$.data.id", score_id_v1: "$.data.version" }
            - call: "POST /ap-program/exam-scores/${score_id}/status-transitions"
              payload: { to_status: "RUBRIC_PENDING", expected_exam_score_version: "${score_id_v1}" }
              as: ScoringSpecialist
              captures: { score_v2: "$.data.version" }
            - call: "POST /ap-program/exam-scores/${score_id}/status-transitions"
              payload: { to_status: "AGGREGATED", expected_exam_score_version: "${score_v2}" }
              as: ScoringSpecialist
              captures: { score_v3: "$.data.version" }
            - call: "POST /ap-program/exam-scores/${score_id}/status-transitions"
              payload: { to_status: "RELEASED", expected_exam_score_version: "${score_v3}" }
              as: ScoringSpecialist
            - call: "POST /ap-program/score-sends"
              payload: { exam_score_id: "${score_id}", recipient_type: "COLLEGE", recipient_code: "C1001", designation_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { send_a_id: "$.data.id" }
            - call: "POST /ap-program/score-sends/${send_a_id}/status-transitions"
              payload: { to_status: "SENT", fees_paid_cents: 2500 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
            - call: "POST /ap-program/score-sends"
              payload: { exam_score_id: "${score_id}", recipient_type: "COLLEGE", recipient_code: "C1002", designation_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { send_b_id: "$.data.id" }
            - call: "POST /ap-program/score-sends/${send_b_id}/status-transitions"
              payload: { to_status: "SENT", fees_paid_cents: 2500 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/score-sends"
              payload: { exam_score_id: "${score_id}", recipient_type: "SCHOOL", recipient_code: "NV0002", designation_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { send_school_id: "$.data.id" }
            - call: "GET /ap-program/score-sends/${send_school_id}"
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "ScoreSend.fee_cents == 2500 under the all_include variant (COLLEGE_SENDS 2 + INCLUDE_SCHOOL 1 = 3 > FREE_SEND_ALLOWANCE 2)"
            - "ScoreSend.fee_cents == 0 under the college_only_exclude variant (first_college max(0, 2 - 1) = 1 <= FREE_SEND_ALLOWANCE 2)"
  - rule_id: combinatorial_formula
    instances:
      - name: consolidation_slices_round_before_summing
        grounds:
          - calculations.order_fee_dual_variant
          - entities.ExamOrder.fields.provisional_order_fee_cents
          - state_machines.ExamOrder.MATERIALS_RECEIVED_to_DELIVERED
        distinguishing_aspect: "Nested-rounding mode where the rounding ORDER decides the cents: rounding each consolidation slice before summing yields marginal_base 139140, while summing first and then applying one blended rate yields single_rate_base 135360, a 3780-cent divergence on the same 8-delivered order."
        test_recipe:
          setup:
            - "One approved order with 8 delivered registrations and 2 LATE registrations, clock in REGULAR"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Lakeview High", school_code: "LV0001", country_code: "US", center_code: "4501", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Biology", syllabus_hash: "h-lv-1", submitted_by_user_id: "u-coord-3" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_id_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_id_v1}" }
              as: CourseAuditReviewer
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "approved" }
              as: CourseAuditReviewer
            - call: "POST /ap-program/students"
              payload: { full_name: "Cy Park", school_id: "${school_id}", student_code: "S0101", grade_level: 11 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_id_v1: "$.data.version" }
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-BIO", registration_tier: "LATE" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "SUBMITTED", expected_exam_order_version: "${order_id_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "ExamOrder.provisional_order_fee_cents == 197000"
            - "The marginal slice sum 36000 + 52380 + 50760 == 139140 differs from the single-rate base round_half_up(8 * 18000 * 0.94) == 135360 by exactly 3780"
      - name: unused_charge_evaluation_order_after_fee
        grounds:
          - calculations.unused_exam_charge
          - calculations.order_fee_dual_variant
          - state_machines.ExamOrder.MATERIALS_RECEIVED_to_DELIVERED
          - entities.ExamOrder.fields.unused_exam_charge_cents
        distinguishing_aspect: "Evaluation-order-pinned mode: the final order fee is computed FIRST and the unused-exam charge is computed SECOND from the pre-transition CONFIRMED count, and the unused charge is never an input to the rebate tier, so the rebate tier stays keyed on delivered count rather than on the charge."
        test_recipe:
          setup:
            - "One approved order with 3 registrations left CONFIRMED (never material-assigned) and one delivered registration, clock in REGULAR"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Ridgeway High", school_code: "RW0001", country_code: "US", center_code: "4601", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Chemistry", syllabus_hash: "h-rw-1", submitted_by_user_id: "u-coord-4" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_id_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_id_v1}" }
              as: CourseAuditReviewer
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "APPROVED", expected_course_audit_version: "${audit_v2}", decision_notes: "approved" }
              as: CourseAuditReviewer
            - call: "POST /ap-program/students"
              payload: { full_name: "Dee Okafor", school_id: "${school_id}", student_code: "S0201", grade_level: 12 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { student_id: "$.data.id" }
            - call: "POST /ap-program/exam-orders"
              payload: { school_id: "${school_id}", course_audit_id: "${audit_id}", administration_year: 2027 }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { order_id: "$.data.id", order_id_v1: "$.data.version" }
            - call: "POST /ap-program/exam-registrations"
              payload: { exam_order_id: "${order_id}", student_id: "${student_id}", exam_subject: "AP-CHEM", registration_tier: "REGULAR" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /ap-program/exam-orders/${order_id}/status-transitions"
              payload: { to_status: "SUBMITTED", expected_exam_order_version: "${order_id_v1}" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
          assert:
            - "ExamOrder.provisional_order_fee_cents == 18000"
            - "With CONFIRMED_AND_UNUSED == 1 the grace count is not exceeded, so unused_exam_charge_cents == 0; with 2 CONFIRMED the charge would be 27000 and with 3 it would be 54000"
  - rule_id: non_linear_state_machine
    instances:
      - name: course_audit_revision_loop_with_rejection_branch
        grounds:
          - state_machines.CourseAudit
          - validations[priority=9]
          - entities.CourseAudit.fields.syllabus_revision_count
        distinguishing_aspect: "The CourseAudit machine is genuinely non-linear: it contains a revision CYCLE IN_REVIEW -> REVISION_REQUESTED -> SUBMITTED (which re-enters the machine and increments syllabus_revision_count) AND a divergent REJECTED branch that terminates the audit, so the same entity exhibits both a loop and a fork rather than a linear pipeline."
        test_recipe:
          setup:
            - "One submitted audit for an approved school, clock in REGULAR"
          setup_api_calls:
            - call: "POST /ap-program/schools"
              payload: { name: "Pinecrest High", school_code: "PC0001", country_code: "US", center_code: "4701", seat_capacity: 10 }
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /ap-program/course-audits"
              payload: { school_id: "${school_id}", course_title: "AP Physics 1", syllabus_hash: "h-pc-1", submitted_by_user_id: "u-coord-5" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_id: "$.data.id", audit_id_v1: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_id_v1}" }
              as: CourseAuditReviewer
              captures: { audit_v2: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "REVISION_REQUESTED", expected_course_audit_version: "${audit_v2}", decision_notes: "resubmit with the lab component" }
              as: CourseAuditReviewer
              captures: { audit_v3: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "SUBMITTED", expected_course_audit_version: "${audit_v3}", syllabus_hash: "h-pc-1-rev" }
              as: SchoolCoordinator
              as_user_id: "${school_id}"
              captures: { audit_v4: "$.data.version" }
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "IN_REVIEW", expected_course_audit_version: "${audit_v4}" }
              as: CourseAuditReviewer
              captures: { audit_v5: "$.data.version" }
          trigger:
            - call: "POST /ap-program/course-audits/${audit_id}/status-transitions"
              payload: { to_status: "REJECTED", expected_course_audit_version: "${audit_v5}", decision_notes: "curricular requirements not met" }
              as: CourseAuditReviewer
          assert:
            - "CourseAudit.syllabus_revision_count == 1 after the loop trip through REVISION_REQUESTED"
            - "CourseAudit.status == REJECTED after the fork takes the terminal branch instead of APPROVED"
      - name: irregularity_case_appeal_cycle_and_score_reblock
        grounds:
          - state_machines.IrregularityCase
          - state_machines.ExamScore.RELEASED_to_WITHHELD
          - entities.ExamScore.fields.release_blocked
        distinguishing_aspect: "The IrregularityCase machine is non-linear on a different entity: CONFIRMED -> APPEALED -> INVESTIGATING re-enters investigation and RE-BLOCKS score release for every released score of the registration, so the case cycles rather than terminating."
        test_recipe:
          setup:
            - "A confirmed irregularity case with finding_code WARNING_ONLY whose linked score was released, so release_blocked is false"
          setup_api_calls:
            - call: "POST /ap-program/schools"
