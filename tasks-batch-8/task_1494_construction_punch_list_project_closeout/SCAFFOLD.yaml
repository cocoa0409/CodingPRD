# =============================================================================
# SCAFFOLD — Construction Punch List & Project Closeout (GC closeout team)
# =============================================================================

scenario: |
  Construction Punch List & Project Closeout (GC closeout team): pre-punch walk
  by trade & self-performed correction, punch item creation with location/photo &
  responsible party, verification/re-inspection & sign-off, substantial completion
  determination & beneficial occupancy, closeout document package (O&M/warranty/
  as-built) collection, training/demonstration sessions, final lien waiver &
  retainage release, warranty start date & callback process

domain_name: construction-closeout
api_prefix: /closeout

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: contract_value_cents, type: integer, source: input, description: "Contract value in cents", constraints: ">= 1000" }
      - { name: retainage_pct, type: number, source: input, description: "Retainage fraction of contract value", constraints: "0 < retainage_pct <= 0.25" }
      - { name: reduction_policy, type: enum, source: input, default: STANDARD, description: "Retainage reduction policy", constraints: "STANDARD | ADJUSTED" }
      - { name: warranty_sla_mode, type: enum, source: input, default: CALENDAR, description: "Warranty SLA day-counting mode", constraints: "CALENDAR | BUSINESS" }
      - { name: status, type: enum, source: system, description: "MOBILIZED | PUNCH_ACTIVE | SC_REVIEW | SUBSTANTIALLY_COMPLETE | CLOSEOUT_IN_PROGRESS | FINAL_RELEASE_PENDING | CLOSED" }
      - { name: open_life_safety_count, type: integer, source: computed, default: 0, description: "PunchItems of this project with severity=LIFE_SAFETY and status IN {OPEN, READY_FOR_REVIEW}" }
      - { name: open_major_count, type: integer, source: computed, default: 0, description: "Same, severity=MAJOR" }
      - { name: open_minor_count, type: integer, source: computed, default: 0, description: "Same, severity=MINOR" }
      - { name: sc_eligible, type: boolean, source: computed, default: false, description: "Derived: LS==0 AND MAJOR==0 AND MINOR<=5 AND every TradePackage has_completed_walk==true" }
      - { name: substantial_completion_date, type: datetime, source: system, description: "Logical clock at approved SC determination; null until then", constraints: "nullable" }
      - { name: warranty_start_date, type: datetime, source: system, description: "Set equal to substantial_completion_date at SC determination", constraints: "nullable" }
      - { name: beneficial_occupancy_registered, type: boolean, source: system, default: false, description: "Owner registered beneficial occupancy" }
      - { name: beneficial_occupancy_date, type: datetime, source: input, description: "Occupancy date supplied at registration", constraints: "nullable" }
      - { name: retainage_held_cents, type: integer, source: computed, description: "round_half_up(contract_value_cents * retainage_pct), frozen at creation" }
      - { name: retainage_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this project's RetainageReleases with status PAID" }
      - { name: retainage_outstanding_cents, type: integer, source: computed, description: "= retainage_held_cents - retainage_paid_cents" }
      - { name: sc_rejection_count, type: integer, source: system, default: 0, description: "Times an SC review was rejected" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock at close", constraints: "nullable" }

  - name: TradePackage
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: trade_name, type: enum, source: input, description: "Trade scope", constraints: "ELECTRICAL | PLUMBING | HVAC | DRYWALL | FLOORING | ROOFING | PAINTING | CONCRETE; unique per project" }
      - { name: responsible_type, type: enum, source: input, description: "SUBCONTRACTOR | SELF_PERFORMED (GC self-performed correction)" }
      - { name: subcontractor_org, type: string, source: input, description: "Subcontractor organization name; required iff responsible_type=SUBCONTRACTOR", constraints: "nullable" }
      - { name: has_completed_walk, type: boolean, source: computed, default: false, description: "At least one PunchWalk for this trade reached COMPLETED" }
      - { name: open_item_count, type: integer, source: computed, default: 0, description: "PunchItems of this trade with status IN {OPEN, READY_FOR_REVIEW}" }
      - { name: om_doc_approved, type: boolean, source: computed, default: false, description: "An APPROVED CloseoutDocument of doc_type OM_MANUAL exists for this trade" }
      - { name: warranty_doc_approved, type: boolean, source: computed, default: false, description: "Same, doc_type WARRANTY_DOC" }
      - { name: asbuilt_doc_approved, type: boolean, source: computed, default: false, description: "Same, doc_type AS_BUILT" }
      - { name: has_conducted_training, type: boolean, source: computed, default: false, description: "At least one TrainingSession for this trade reached CONDUCTED" }
      - { name: lien_waiver_status, type: enum, source: system, description: "NONE | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: lien_waiver_type, type: enum, source: input, description: "CONDITIONAL | UNCONDITIONAL (set at waiver submission)", constraints: "nullable" }
      - { name: lien_waiver_amount_cents, type: integer, source: input, description: "Waiver amount, cents; > 0", constraints: "nullable" }
      - { name: lien_waiver_file_ref, type: string, source: input, description: "Waiver document reference", constraints: "nullable" }
      - { name: closeout_ready, type: boolean, source: computed, default: false, description: "Derived: open_item_count==0 AND om_doc_approved AND warranty_doc_approved AND asbuilt_doc_approved AND has_conducted_training AND lien_waiver_status==ACCEPTED AND lien_waiver_type==UNCONDITIONAL" }

  - name: PunchWalk
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: trade_package_id, type: string, source: input, description: "FK -> TradePackage.id" }
      - { name: lead_inspector_id, type: string, source: input, description: "Opaque user id of the lead inspector (walk-scheduling resource)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Walk window start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Walk window end; must be at least 30 minutes after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED" }

  - name: PunchItem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: trade_package_id, type: string, source: input, description: "FK -> TradePackage.id (the responsible party)" }
      - { name: punch_walk_id, type: string, source: input, description: "FK -> PunchWalk.id; walk during which the item was found", constraints: "nullable" }
      - { name: title, type: string, source: input, description: "Short deficiency title" }
      - { name: severity, type: enum, source: input, description: "LIFE_SAFETY | MAJOR | MINOR" }
      - { name: location_building, type: string, source: input, description: "Building / structure identifier" }
      - { name: location_floor, type: string, source: input, description: "Floor / level" }
      - { name: location_area, type: string, source: input, description: "Room / area / grid reference" }
      - { name: photo_ref, type: string, source: input, description: "Photo attachment reference (required)" }
      - { name: status, type: enum, source: system, description: "OPEN | READY_FOR_REVIEW | VERIFIED | VOIDED" }
      - { name: ready_by_user_id, type: string, source: system, description: "X-User-ID that marked the item ready; used for segregation-of-duties check", constraints: "nullable" }
      - { name: ready_at, type: datetime, source: system, description: "Logical clock at mark-ready", constraints: "nullable" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID that signed off", constraints: "nullable" }
      - { name: rejection_count, type: integer, source: system, default: 0, description: "Times a verification attempt was rejected" }
      - { name: rejection_reason, type: string, source: system, description: "Last rejection reason", constraints: "nullable" }

  - name: CloseoutDocument
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: trade_package_id, type: string, source: input, description: "FK -> TradePackage.id" }
      - { name: doc_type, type: enum, source: input, description: "OM_MANUAL | WARRANTY_DOC | AS_BUILT" }
      - { name: file_ref, type: string, source: input, description: "Document file reference" }
      - { name: revision, type: integer, source: system, description: "= count of prior CloseoutDocuments for the same (trade_package_id, doc_type) + 1" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason when rejected", constraints: "nullable" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: trade_package_id, type: string, source: input, description: "FK -> TradePackage.id" }
      - { name: system_name, type: string, source: input, description: "System being demonstrated (e.g. 'AHU-1 controls')" }
      - { name: location_room, type: string, source: input, description: "Room resource for scheduling (buffer overlap applies per room)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session window end; must be after scheduled_start" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Times rescheduled; hard cap 2" }
      - { name: attendee_count, type: integer, source: system, description: "Attendees recorded at conduct; must be >= 1", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONDUCTED" }

  - name: RetainageRelease
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: kind, type: enum, source: input, description: "REDUCTION (partial release at substantial completion) | FINAL (release of all remaining retainage)" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed at creation per release_amount / final_release_amount rules; never client-supplied" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PAID | VOIDED" }

  - name: WarrantyCase
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: title, type: string, source: input, description: "Callback issue title" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR" }
      - { name: description, type: string, source: input, description: "Issue description" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at case creation" }
      - { name: sla_due_at, type: datetime, source: computed, description: "Computed at triage per project.warranty_sla_mode and severity", constraints: "nullable" }
      - { name: resolution_note, type: string, source: system, description: "Set at resolve", constraints: "nullable" }
      - { name: denial_reason, type: string, source: system, description: "Set at deny", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | RESOLVED | DENIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: MOBILIZED
    terminal_states: [CLOSED]
    transitions:
      - from: MOBILIZED
        to: PUNCH_ACTIVE
        trigger: "POST /closeout/projects/{projectId}/begin-punch"
        actor: GCProjectManager
        preconditions:
          - "At least one TradePackage exists for the project (ERR_NO_TRADE_PACKAGES)"
        side_effects: ["Project.version increments by 1"]
      - from: PUNCH_ACTIVE
        to: SC_REVIEW
        trigger: "POST /closeout/projects/{projectId}/request-sc-review"
        actor: GCProjectManager
        preconditions:
          - "open_life_safety_count == 0 (ERR_OPEN_LIFE_SAFETY_ITEMS)"
          - "open_major_count == 0 (ERR_OPEN_MAJOR_ITEMS)"
          - "open_minor_count <= 5 (ERR_TOO_MANY_OPEN_MINOR_ITEMS)"
          - "Every TradePackage has_completed_walk == true (ERR_WALK_INCOMPLETE)"
        side_effects: ["Project.version increments by 1"]
      - from: SC_REVIEW
        to: SUBSTANTIALLY_COMPLETE
        trigger: "POST /closeout/projects/{projectId}/determine-substantial-completion with approved=true"
        actor: OwnerRep
        preconditions:
          - "Eligibility re-checked at determination time: same four checks as request-sc-review"
        side_effects:
          - "substantial_completion_date := current logical clock"
          - "warranty_start_date := substantial_completion_date"
          - "Project.version increments by 1"
      - from: SC_REVIEW
        to: PUNCH_ACTIVE
        trigger: "POST /closeout/projects/{projectId}/determine-substantial-completion with approved=false"
        actor: OwnerRep
        preconditions: ["rejection_note required when approved=false (ERR_INVALID_REQUEST)"]
        side_effects:
          - "sc_rejection_count += 1"
          - "Project.version increments by 1"
      - from: SUBSTANTIALLY_COMPLETE
        to: CLOSEOUT_IN_PROGRESS
        trigger: "POST /closeout/projects/{projectId}/start-closeout"
        actor: GCProjectManager
        preconditions:
          - "beneficial_occupancy_registered == true (ERR_OCCUPANCY_NOT_REGISTERED)"
        side_effects: ["Project.version increments by 1"]
      - from: CLOSEOUT_IN_PROGRESS
        to: FINAL_RELEASE_PENDING
        trigger: "system (automatic when every TradePackage of the project has closeout_ready == true)"
        actor: system
        preconditions: []
        side_effects: ["Project.version increments by 1"]
        note: "Cascade terminus: fired from doc approve / session conduct / waiver accept / item verify when the last unready trade flips"
      - from: FINAL_RELEASE_PENDING
        to: CLOSED
        trigger: "POST /closeout/projects/{projectId}/close"
        actor: GCProjectManager
        preconditions:
          - "A RetainageRelease with kind=FINAL and status=PAID exists for the project (ERR_FINAL_RELEASE_NOT_PAID)"
        side_effects:
          - "closed_at := current logical clock"
          - "Project.version increments by 1"

  - entity: TradePackage
    initial_state: NONE
    terminal_states: []
    note: "State machine over field lien_waiver_status"
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /closeout/trade-packages/{tradePackageId}/lien-waiver-submission"
        actor: "SubcontractorRep (own SUBCONTRACTOR trade) | GCProjectManager (SELF_PERFORMED trade)"
        preconditions:
          - "Project.status IN {PUNCH_ACTIVE, SC_REVIEW, SUBSTANTIALLY_COMPLETE, CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING} (ERR_INVALID_STATE)"
          - "lien_waiver_amount_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects: ["lien_waiver_type / lien_waiver_amount_cents / lien_waiver_file_ref stored", "TradePackage.version increments by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /closeout/trade-packages/{tradePackageId}/lien-waiver-submission (resubmission overwrites waiver fields)"
        actor: "SubcontractorRep (own SUBCONTRACTOR trade) | GCProjectManager (SELF_PERFORMED trade)"
        preconditions: ["Same as NONE -> SUBMITTED"]
        side_effects: ["Waiver fields overwritten", "TradePackage.version increments by 1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /closeout/trade-packages/{tradePackageId}/lien-waiver-decision with decision=ACCEPT"
        actor: GCProjectManager
        preconditions:
          - "waiver_type CONDITIONAL: Project.status IN {SUBSTANTIALLY_COMPLETE, CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING}"
          - "waiver_type UNCONDITIONAL: Project.status IN {CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING}"
          - "Otherwise ERR_WAIVER_NOT_ACCEPTABLE_STATE"
        side_effects:
          - "Recompute closeout_ready; if this flips the last unready trade and Project.status == CLOSEOUT_IN_PROGRESS, Project auto-transitions to FINAL_RELEASE_PENDING (cascade)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /closeout/trade-packages/{tradePackageId}/lien-waiver-decision with decision=REJECT"
        actor: GCProjectManager
        preconditions: ["rejection_reason required (ERR_INVALID_REQUEST)"]
        side_effects: ["TradePackage.version increments by 1"]
    note_terminal: "ACCEPTED is absorbing: lien-waiver-submission while lien_waiver_status == ACCEPTED is rejected with ERR_WAIVER_ALREADY_ACCEPTED; lien-waiver-decision requires current status SUBMITTED (else ERR_INVALID_STATE)"

  - entity: PunchWalk
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /closeout/punch-walks/{walkId}/complete"
        actor: "GCInspector | GCProjectManager"
        preconditions:
          - "current logical clock >= scheduled_start (ERR_WALK_NOT_STARTED)"
        side_effects:
          - "TradePackage.has_completed_walk := true (recompute Project.sc_eligible)"

  - entity: PunchItem
    initial_state: OPEN
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: OPEN
        to: READY_FOR_REVIEW
        trigger: "POST /closeout/punch-items/{itemId}/mark-ready"
        actor: "SubcontractorRep (own SUBCONTRACTOR trade) | GCProjectManager (SELF_PERFORMED trade)"
        preconditions:
          - "Project.status IN {PUNCH_ACTIVE, SC_REVIEW, SUBSTANTIALLY_COMPLETE, CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING} (ERR_INVALID_STATE)"
          - "Item's TradePackage has_completed_walk == true (ERR_WALK_INCOMPLETE)"
          - "Responsible-party ownership (ERR_NOT_RESPONSIBLE_PARTY)"
        side_effects:
          - "ready_by_user_id := X-User-ID; ready_at := current logical clock"
      - from: READY_FOR_REVIEW
        to: VERIFIED
        trigger: "POST /closeout/punch-items/{itemId}/verify"
        actor: "GCInspector | GCProjectManager (GCProjectManager REQUIRED when rejection_count >= 2: ERR_VERIFICATION_ESCALATED)"
        preconditions:
          - "Project.status IN {PUNCH_ACTIVE, SC_REVIEW, SUBSTANTIALLY_COMPLETE, CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING} (ERR_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != ready_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "rejection_count >= 2 requires actor role GCProjectManager (ERR_VERIFICATION_ESCALATED)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "Project.open_<severity>_count -= 1; TradePackage.open_item_count -= 1 (recompute sc_eligible)"
          - "Recompute TradePackage.closeout_ready; if flip to true completes all trades and Project.status == CLOSEOUT_IN_PROGRESS, Project auto-transitions to FINAL_RELEASE_PENDING"
      - from: READY_FOR_REVIEW
        to: OPEN
        trigger: "POST /closeout/punch-items/{itemId}/reject"
        actor: GCInspector
        preconditions:
          - "Project.status IN {PUNCH_ACTIVE, SC_REVIEW, SUBSTANTIALLY_COMPLETE, CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING} (ERR_INVALID_STATE)"
          - "reason required (ERR_INVALID_REQUEST)"
        side_effects:
          - "rejection_count += 1; rejection_reason := reason; ready_by_user_id := null"
      - from: OPEN
        to: VOIDED
        trigger: "POST /closeout/punch-items/{itemId}/void"
        actor: GCProjectManager
        preconditions:
          - "Project.status == PUNCH_ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Project.open_<severity>_count -= 1; TradePackage.open_item_count -= 1 (recompute sc_eligible and closeout_ready)"

  - entity: CloseoutDocument
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /closeout/closeout-documents/{docId}/approve"
        actor: GCProjectManager
        preconditions:
          - "Project.status IN {CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING} (ERR_INVALID_STATE)"
        side_effects:
          - "TradePackage.<doc_type>_approved flag := true; recompute closeout_ready; if flip completes all trades and Project.status == CLOSEOUT_IN_PROGRESS, Project auto-transitions to FINAL_RELEASE_PENDING"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /closeout/closeout-documents/{docId}/reject"
        actor: GCProjectManager
        preconditions:
          - "Project.status IN {CLOSEOUT_IN_PROGRESS, FINAL_RELEASE_PENDING} (ERR_INVALID_STATE)"
          - "rejection_reason required (ERR_INVALID_REQUEST)"
        side_effects: []
        note: "Revision loop runs through a NEW CloseoutDocument for the same (trade, doc_type); revision increments server-side"

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /closeout/training-sessions/{sessionId}/reschedule"
        actor: GCProjectManager
        preconditions:
          - "OCC: expected_training_session_version == current version (ERR_STALE_VERSION)"
          - "reschedule_count < 2 (ERR_RESCHEDULE_LIMIT)"
          - "new scheduled_start >= current logical clock (ERR_SCHEDULED_IN_PAST)"
          - "room buffer rule vs other sessions (excluding self) (ERR_SESSION_ROOM_CONFLICT)"
        side_effects:
          - "scheduled_start / scheduled_end replaced; reschedule_count += 1; TrainingSession.version increments by 1"
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /closeout/training-sessions/{sessionId}/conduct"
        actor: GCProjectManager
        preconditions:
          - "current logical clock >= scheduled_start (ERR_SESSION_NOT_STARTED)"
          - "attendee_count >= 1 (ERR_NO_ATTENDEES)"
        side_effects:
          - "attendee_count stored; TradePackage.has_conducted_training := true; recompute closeout_ready; if flip completes all trades and Project.status == CLOSEOUT_IN_PROGRESS, Project auto-transitions to FINAL_RELEASE_PENDING"

  - entity: RetainageRelease
    initial_state: REQUESTED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /closeout/retainage-releases/{releaseId}/approve"
        actor: OwnerRep
        preconditions: []
        side_effects:
          - "Project.retainage_paid_cents += amount_cents; retainage_outstanding_cents -= amount_cents; Project.version increments by 1"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /closeout/retainage-releases/{releaseId}/void"
        actor: GCProjectManager
        preconditions: []
        side_effects: ["No money movement (release never paid)"]
      - from: PAID
        to: VOIDED
        trigger: "POST /closeout/retainage-releases/{releaseId}/void (clawback)"
        actor: GCProjectManager
        preconditions: []
        side_effects:
          - "Project.retainage_paid_cents -= amount_cents; retainage_outstanding_cents += amount_cents; Project.version increments by 1"
        note: "Compensating action: approve-then-void leaves paid/outstanding unchanged (INV-1)"

  - entity: WarrantyCase
    initial_state: REPORTED
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /closeout/warranty-cases/{caseId}/triage"
        actor: GCProjectManager
        preconditions: []
        side_effects:
          - "severity := input severity; sla_due_at computed per project.warranty_sla_mode (warranty_sla_due_at rule)"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /closeout/warranty-cases/{caseId}/resolve"
        actor: GCProjectManager
        preconditions: []
        side_effects: ["resolution_note stored"]
      - from: REPORTED
        to: DENIED
        trigger: "POST /closeout/warranty-cases/{caseId}/deny"
        actor: GCProjectManager
        preconditions: ["denial_reason required (ERR_INVALID_REQUEST)"]
        side_effects: []
      - from: TRIAGED
        to: DENIED
        trigger: "POST /closeout/warranty-cases/{caseId}/deny"
        actor: GCProjectManager
        preconditions: ["denial_reason required (ERR_INVALID_REQUEST)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: release-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /closeout/retainage-releases"
    occ_field: expected_project_version
    description: |
      Creating a RetainageRelease against a Project whose version has advanced
      since the client last observed it is rejected. A new release legitimately
      supersedes the client's stale view of the project's release ledger (e.g.,
      another writer just created or voided a release, which does not change
      Project.status), so the stale writer is rejected with a version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: session-reschedule-stale-version
    parent_entity: TrainingSession
    write_endpoint: "POST /closeout/training-sessions/{sessionId}/reschedule"
    occ_field: expected_training_session_version
    description: |
      Rescheduling a TrainingSession whose version has advanced since the client
      last observed it is rejected. A reschedule keeps the session in SCHEDULED,
      so a second sequential reschedule carrying the stale version observes
      identical state and would otherwise legitimately apply on top of an
      unseen reschedule.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: retainage_held_cents
    trigger: "Project creation"
    algorithm: aggregation
    formula: |
      retainage_held_cents = round_half_up(contract_value_cents * retainage_pct)
      Rounding order is pinned: the held amount is rounded ONCE at creation and
      stored; all downstream release math derives from the rounded stored value.
    input_set: "The created Project"
    precision: "integer cents, round_half_up"

  - name: release_amount
    trigger: "POST /closeout/retainage-releases with kind=REDUCTION"
    algorithm: withholding
    formula: |
      base_cents = round_half_up(retainage_held_cents * REDUCTION_PCT)
      # retainage_held_cents is already an integer; base rounds the product
      # held*0.5 — never compute round(contract_value_cents * retainage_pct * 0.5).
      STANDARD:  amount_cents = base_cents
      ADJUSTED:  amount_cents = max(0, base_cents - open_blocking_minor_count * MINOR_WITHHOLD_CENTS)
      If amount_cents == 0: reject creation with ERR_RELEASE_AMOUNT_ZERO.
    input_set: "open_blocking_minor_count = count of PunchItems with project_id = this project, severity = MINOR, status IN {OPEN, READY_FOR_REVIEW}, evaluated at request time"
    constants:
      REDUCTION_PCT: 0.5
      MINOR_WITHHOLD_CENTS: 25000
    precision: "integer cents, round_half_up"
    variants:
      - name: STANDARD
        when: "project.reduction_policy == STANDARD"
        difference: "Flat 50% of retainage held; ignores open minor items"
      - name: ADJUSTED
        when: "project.reduction_policy == ADJUSTED"
        difference: "Withholds 25000 cents per blocking MINOR item, floored at 0; identical project data yields a smaller (or equal) release"

  - name: final_release_amount
    trigger: "POST /closeout/retainage-releases with kind=FINAL"
    algorithm: aggregation
    formula: |
      amount_cents = retainage_held_cents - sum(amount_cents of RetainageReleases
                     where project_id = this project AND status == PAID)
                   = retainage_outstanding_cents at request time
    input_set: "All RetainageReleases of the project with status == PAID (REQUESTED and VOIDED excluded)"
    precision: "integer cents"

  - name: open_blocking_counts
    trigger: "PunchItem creation, verify, void (and recomputed on read)"
    algorithm: aggregation
    formula: |
      For severity s in {LIFE_SAFETY, MAJOR, MINOR}:
        Project.open_<s>_count = count of PunchItems with project_id = project,
                                 severity = s, status IN {OPEN, READY_FOR_REVIEW}
      READY_FOR_REVIEW still blocks (counted as open). Terminal states
      (VERIFIED, VOIDED) do not. TradePackage.open_item_count = same predicate
      over the trade's items across all severities.
    input_set: "PunchItems of the project/trade in non-terminal status"

  - name: sc_eligibility
    trigger: "Recomputed whenever open counts or walk completion change; enforced by request-sc-review and re-checked by determine-substantial-completion"
    algorithm: threshold
    formula: |
      sc_eligible = (open_life_safety_count == 0)
                AND (open_major_count == 0)
                AND (open_minor_count <= MINOR_OPEN_ALLOWANCE)
                AND (every TradePackage of the project has_completed_walk == true)
      Boundary: open_minor_count == 5 passes; 6 fails.
    input_set: "Project blocking counts + all TradePackages of the project"
    constants:
      MINOR_OPEN_ALLOWANCE: 5

  - name: trade_closeout_ready
    trigger: "PunchItem verify/void, CloseoutDocument approve, TrainingSession conduct, lien-waiver ACCEPT"
    algorithm: constraint_propagation
    formula: |
      closeout_ready = (open_item_count == 0)
                   AND om_doc_approved AND warranty_doc_approved AND asbuilt_doc_approved
                   AND has_conducted_training
                   AND (lien_waiver_status == ACCEPTED AND lien_waiver_type == UNCONDITIONAL)
      When closeout_ready flips to true and this completes ALL trades of the
      project AND Project.status == CLOSEOUT_IN_PROGRESS:
        Project auto-transitions to FINAL_RELEASE_PENDING.
    input_set: "TradePackage derived flags + lien waiver fields + all sibling TradePackages"

  - name: warranty_sla_due_at
    trigger: "WarrantyCase triage (REPORTED -> TRIAGED)"
    algorithm: chronological
    formula: |
      CALENDAR: sla_due_at = triaged_at + SLA_DAYS[severity] days
                (timestamp arithmetic, time-of-day preserved)
      BUSINESS: advance SLA_DAYS[severity] business days from triaged_at,
                skipping Saturdays and Sundays; the triage instant is t0 and the
                first day counted is the next business day; time-of-day preserved.
    input_set: "The triaged WarrantyCase + its Project.warranty_sla_mode"
    constants:
      SLA_DAYS: { CRITICAL: 1, MAJOR: 7, MINOR: 30 }
    precision: "second precision ISO8601 UTC"
    variants:
      - name: CALENDAR
        when: "project.warranty_sla_mode == CALENDAR"
        difference: "Weekend days count toward the SLA"
      - name: BUSINESS
        when: "project.warranty_sla_mode == BUSINESS"
        difference: "Weekend days skipped; identical triage instant yields a later due timestamp (e.g. MAJOR triaged Friday 2026-09-04T10:00:00Z: CALENDAR 2026-09-11T10:00:00Z vs BUSINESS 2026-09-15T10:00:00Z)"

  - name: warranty_window_end
    trigger: "WarrantyCase creation"
    algorithm: threshold
    formula: |
      warranty_end = warranty_start_date + WARRANTY_PERIOD_DAYS days
      Case admissible iff reported_at <= warranty_end (closed interval:
      reported_at exactly equal to warranty_end is accepted; one second after
      is rejected with ERR_WARRANTY_EXPIRED).
    input_set: "The Project (must be CLOSED) + current logical clock"
    constants:
      WARRANTY_PERIOD_DAYS: 365

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is in the endpoint's allowed roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Responsible-party ownership: SubcontractorRep X-User-ID must equal the resource's trade_package_id and the trade must be SUBCONTRACTOR; GCProjectManager may act only on SELF_PERFORMED trades"
    error_id: ERR_NOT_RESPONSIBLE_PARTY
    http_status: 403
    applies_to: "POST mark-ready, POST closeout-documents, POST lien-waiver-submission"
  - priority: 4
    category: auth
    check: "Segregation of duties on verify: X-User-ID != PunchItem.ready_by_user_id; and when rejection_count >= 2 only GCProjectManager may verify"
    error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_VERIFICATION_ESCALATED"
    http_status: 403
    applies_to: "POST /closeout/punch-items/{itemId}/verify"
  - priority: 5
    category: existence
    check: "Request schema: required fields present, enums valid, numeric ranges (retainage_pct, amounts > 0, scheduled_end > scheduled_start, walk duration >= 30 minutes)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: existence
    check: "Referenced resources exist (path ids and body FK ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 7
    category: state
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /closeout/retainage-releases, POST /closeout/training-sessions/{sessionId}/reschedule"
  - priority: 8
    category: state
    check: "Resource is in a valid state for the operation (state-machine preconditions; project-phase gates; warranty case requires CLOSED project)"
    error_id: "ERR_INVALID_STATE / ERR_PROJECT_NOT_CLOSED"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: business_safety
    check: "No blocking LIFE_SAFETY punch items may exist when entering or confirming substantial completion"
    error_id: ERR_OPEN_LIFE_SAFETY_ITEMS
    http_status: 409
    applies_to: "POST request-sc-review, POST determine-substantial-completion"
  - priority: 10
    category: business_temporal
    check: "Clock-based rules: no scheduling in the past; walk/session cannot start before its window; occupancy date not before SC date; warranty case inside warranty window"
    error_id: "ERR_SCHEDULED_IN_PAST / ERR_WALK_NOT_STARTED / ERR_SESSION_NOT_STARTED / ERR_OCCUPANCY_BEFORE_SC / ERR_WARRANTY_EXPIRED"
    http_status: 422
    applies_to: "walk/session create + reschedule + complete/conduct, register-beneficial-occupancy, warranty case create"
  - priority: 11
    category: business_constraint
    check: "Domain constraints: MAJOR items zero / MINOR items <= 5 / all trades walked (SC gates); walk inspector half-open overlap; session room 30-minute buffer; unique trade per project; one pending doc per (trade, doc_type); doc type not already satisfied; reschedule cap; attendee_count >= 1; waiver acceptability phase; waiver not already accepted; occupancy not already registered; occupancy registered before closeout; FINAL release paid before close"
    error_id: "ERR_OPEN_MAJOR_ITEMS / ERR_TOO_MANY_OPEN_MINOR_ITEMS / ERR_WALK_INCOMPLETE / ERR_WALK_OVERLAP / ERR_SESSION_ROOM_CONFLICT / ERR_DUPLICATE_TRADE / ERR_DOC_ALREADY_PENDING / ERR_DOC_TYPE_ALREADY_SATISFIED / ERR_RESCHEDULE_LIMIT / ERR_NO_ATTENDEES / ERR_WAIVER_NOT_ACCEPTABLE_STATE / ERR_WAIVER_ALREADY_ACCEPTED / ERR_OCCUPANCY_ALREADY_REGISTERED / ERR_OCCUPANCY_NOT_REGISTERED / ERR_FINAL_RELEASE_NOT_PAID"
    http_status: 409
    applies_to: "per-check endpoints"
  - priority: 12
    category: business_referential
    check: "Cross-reference integrity: trade_package_id belongs to project_id; punch_walk_id (if given) belongs to the same project"
    error_id: "ERR_TRADE_NOT_IN_PROJECT / ERR_WALK_NOT_IN_PROJECT"
    http_status: 422
    applies_to: "POST punch-items, punch-walks, closeout-documents, training-sessions"
  - priority: 13
    category: business_fiscal
    check: "Money rules: a release kind may be used at most once in non-VOIDED status; computed REDUCTION amount of zero is rejected"
    error_id: "ERR_RELEASE_KIND_ALREADY_USED / ERR_RELEASE_AMOUNT_ZERO"
    http_status: 409
    applies_to: "POST /closeout/retainage-releases"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/closeout/projects"
    description: "Create a project (status MOBILIZED; retainage_held_cents computed and frozen)"
    roles: [GCProjectManager]
    code: 201
    input: [name, contract_value_cents, retainage_pct, "reduction_policy?", "warranty_sla_mode?"]
    output: Project
    side_effects: ["retainage_held_cents := round_half_up(contract_value_cents * retainage_pct); retainage_outstanding_cents := retainage_held_cents; counts zeroed"]
  - method: GET
    path: "/closeout/projects/{projectId}"
    description: "Get a project"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/closeout/projects/{projectId}/begin-punch"
    description: "MOBILIZED -> PUNCH_ACTIVE"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["increments Project.version by 1"]
  - method: POST
    path: "/closeout/projects/{projectId}/request-sc-review"
    description: "PUNCH_ACTIVE -> SC_REVIEW; enforces sc_eligibility in priority order (safety first)"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["increments Project.version by 1"]
  - method: POST
    path: "/closeout/projects/{projectId}/determine-substantial-completion"
    description: "Owner determination; approved=true -> SUBSTANTIALLY_COMPLETE (sets SC date + warranty start), approved=false -> back to PUNCH_ACTIVE"
    roles: [OwnerRep]
    code: 200
    input: [approved, "rejection_note?"]
    output: Project
    side_effects: ["on approval: substantial_completion_date and warranty_start_date := clock; on rejection: sc_rejection_count += 1; increments Project.version by 1"]
  - method: POST
    path: "/closeout/projects/{projectId}/register-beneficial-occupancy"
    description: "Register beneficial occupancy (only while SUBSTANTIALLY_COMPLETE)"
    roles: [OwnerRep]
    code: 200
    input: [occupancy_date]
    output: Project
    side_effects: ["beneficial_occupancy_registered := true; beneficial_occupancy_date := input; increments Project.version by 1"]
  - method: POST
    path: "/closeout/projects/{projectId}/start-closeout"
    description: "SUBSTANTIALLY_COMPLETE -> CLOSEOUT_IN_PROGRESS; requires occupancy registered"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["increments Project.version by 1"]
  - method: POST
    path: "/closeout/projects/{projectId}/close"
    description: "FINAL_RELEASE_PENDING -> CLOSED; requires a PAID FINAL release"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["closed_at := clock; increments Project.version by 1"]

  # --- TradePackage ---
  - method: POST
    path: "/closeout/trade-packages"
    description: "Register a trade package (project must be MOBILIZED; trade_name unique per project)"
    roles: [GCProjectManager]
    code: 201
    input: [project_id, trade_name, responsible_type, "subcontractor_org?"]
    output: TradePackage
    side_effects: ["lien_waiver_status := NONE; derived flags false"]
  - method: GET
    path: "/closeout/trade-packages/{tradePackageId}"
    description: "Get a trade package"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: TradePackage
    side_effects: []
  - method: GET
    path: "/closeout/trade-packages"
    description: "List trade packages (filterable by project)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: TradePackage[]
    side_effects: []
  - method: POST
    path: "/closeout/trade-packages/{tradePackageId}/lien-waiver-submission"
    description: "Submit or resubmit the trade's lien waiver"
    roles: [SubcontractorRep, GCProjectManager]
    code: 200
    input: [waiver_type, amount_cents, file_ref]
    output: TradePackage
    side_effects: ["lien_waiver_status := SUBMITTED; waiver fields stored; increments TradePackage.version by 1"]
  - method: POST
    path: "/closeout/trade-packages/{tradePackageId}/lien-waiver-decision"
    description: "Accept or reject a submitted lien waiver (phase-gated by waiver type)"
    roles: [GCProjectManager]
    code: 200
    input: [decision, "rejection_reason?"]
    output: TradePackage
    side_effects: ["on ACCEPT: lien_waiver_status := ACCEPTED, recompute closeout_ready, possible Project auto-advance to FINAL_RELEASE_PENDING; on REJECT: status REJECTED"]

  # --- PunchWalk ---
  - method: POST
    path: "/closeout/punch-walks"
    description: "Schedule a pre-punch walk for a trade (project must be PUNCH_ACTIVE; half-open overlap per lead_inspector_id; duration >= 30 min; not in the past)"
    roles: [GCProjectManager]
    code: 201
    input: [project_id, trade_package_id, lead_inspector_id, scheduled_start, scheduled_end]
    output: PunchWalk
    side_effects: ["status := SCHEDULED"]
  - method: GET
    path: "/closeout/punch-walks/{walkId}"
    description: "Get a punch walk"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: PunchWalk
    side_effects: []
  - method: GET
    path: "/closeout/punch-walks"
    description: "List punch walks (filterable)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "trade_package_id?", "lead_inspector_id?", "limit?", "offset?"]
    output: PunchWalk[]
    side_effects: []
  - method: POST
    path: "/closeout/punch-walks/{walkId}/complete"
    description: "SCHEDULED -> COMPLETED; clock must be >= scheduled_start; flips trade has_completed_walk"
    roles: [GCInspector, GCProjectManager]
    code: 200
    input: []
    output: PunchWalk
    side_effects: ["TradePackage.has_completed_walk := true; recompute Project.sc_eligible"]

  # --- PunchItem ---
  - method: POST
    path: "/closeout/punch-items"
    description: "Create a punch item with location/photo/responsible party (project must be PUNCH_ACTIVE)"
    roles: [GCInspector, GCProjectManager]
    code: 201
    input: [project_id, trade_package_id, title, severity, location_building, location_floor, location_area, photo_ref, "punch_walk_id?"]
    output: PunchItem
    side_effects: ["status := OPEN; Project.open_<severity>_count += 1; TradePackage.open_item_count += 1; recompute sc_eligible / closeout_ready"]
  - method: GET
    path: "/closeout/punch-items/{itemId}"
    description: "Get a punch item"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: PunchItem
    side_effects: []
  - method: GET
    path: "/closeout/punch-items"
    description: "List punch items (filterable)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "trade_package_id?", "status?", "severity?", "punch_walk_id?", "limit?", "offset?"]
    output: PunchItem[]
    side_effects: []
  - method: POST
    path: "/closeout/punch-items/{itemId}/mark-ready"
    description: "OPEN -> READY_FOR_REVIEW by the responsible party; requires a completed walk for the trade"
    roles: [SubcontractorRep, GCProjectManager]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["ready_by_user_id := X-User-ID; ready_at := clock"]
  - method: POST
    path: "/closeout/punch-items/{itemId}/verify"
    description: "READY_FOR_REVIEW -> VERIFIED sign-off; SoD vs ready_by_user_id; rejection_count >= 2 requires GCProjectManager"
    roles: [GCInspector, GCProjectManager]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["verified_by_user_id := X-User-ID; Project.open_<severity>_count -= 1; TradePackage.open_item_count -= 1; recompute closeout_ready; conditional Project auto-advance to FINAL_RELEASE_PENDING"]
  - method: POST
    path: "/closeout/punch-items/{itemId}/reject"
    description: "READY_FOR_REVIEW -> OPEN (failed re-inspection); increments rejection_count"
    roles: [GCInspector]
    code: 200
    input: [reason]
    output: PunchItem
    side_effects: ["rejection_count += 1; rejection_reason := reason; ready_by_user_id := null"]
  - method: POST
    path: "/closeout/punch-items/{itemId}/void"
    description: "OPEN -> VOIDED (erroneous/duplicate item); releases blocking counts"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["Project.open_<severity>_count -= 1; TradePackage.open_item_count -= 1; recompute sc_eligible / closeout_ready"]

  # --- CloseoutDocument ---
  - method: POST
    path: "/closeout/closeout-documents"
    description: "Submit a closeout document (O&M / warranty / as-built) for a trade; one pending doc per (trade, doc_type); approved pair locked"
    roles: [SubcontractorRep, GCProjectManager]
    code: 201
    input: [project_id, trade_package_id, doc_type, file_ref]
    output: CloseoutDocument
    side_effects: ["status := SUBMITTED; revision := prior docs for (trade, doc_type) + 1"]
  - method: GET
    path: "/closeout/closeout-documents/{docId}"
    description: "Get a closeout document"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: CloseoutDocument
    side_effects: []
  - method: GET
    path: "/closeout/closeout-documents"
    description: "List closeout documents (filterable)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "trade_package_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: CloseoutDocument[]
    side_effects: []
  - method: POST
    path: "/closeout/closeout-documents/{docId}/approve"
    description: "SUBMITTED -> APPROVED (project must be in closeout phase); flips trade doc flag"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: CloseoutDocument
    side_effects: ["TradePackage.<doc_type>_approved := true; recompute closeout_ready; conditional Project auto-advance to FINAL_RELEASE_PENDING"]
  - method: POST
    path: "/closeout/closeout-documents/{docId}/reject"
    description: "SUBMITTED -> REJECTED with reason; resubmission happens via a new document (revision increments)"
    roles: [GCProjectManager]
    code: 200
    input: [rejection_reason]
    output: CloseoutDocument
    side_effects: []

  # --- TrainingSession ---
  - method: POST
    path: "/closeout/training-sessions"
    description: "Schedule a training/demonstration session (project must be SUBSTANTIALLY_COMPLETE or CLOSEOUT_IN_PROGRESS; 30-minute room turnover buffer)"
    roles: [GCProjectManager]
    code: 201
    input: [project_id, trade_package_id, system_name, location_room, scheduled_start, scheduled_end]
    output: TrainingSession
    side_effects: ["status := SCHEDULED"]
  - method: GET
    path: "/closeout/training-sessions/{sessionId}"
    description: "Get a training session"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []
  - method: GET
    path: "/closeout/training-sessions"
    description: "List training sessions (filterable)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "trade_package_id?", "status?", "limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []
  - method: POST
    path: "/closeout/training-sessions/{sessionId}/reschedule"
    description: "Reschedule a SCHEDULED session (OCC on session version; max 2 reschedules; buffer rule re-applied excluding self)"
    roles: [GCProjectManager]
    code: 200
    input: [scheduled_start, scheduled_end, expected_training_session_version]
    output: TrainingSession
    side_effects: ["reschedule_count += 1; increments TrainingSession.version by 1"]
  - method: POST
    path: "/closeout/training-sessions/{sessionId}/conduct"
    description: "SCHEDULED -> CONDUCTED; clock >= scheduled_start; attendee_count >= 1"
    roles: [GCProjectManager]
    code: 200
    input: [attendee_count]
    output: TrainingSession
    side_effects: ["attendee_count stored; TradePackage.has_conducted_training := true; recompute closeout_ready; conditional Project auto-advance to FINAL_RELEASE_PENDING"]

  # --- RetainageRelease ---
  - method: POST
    path: "/closeout/retainage-releases"
    description: "Request a retainage release (REDUCTION while SUBSTANTIALLY_COMPLETE; FINAL while FINAL_RELEASE_PENDING); amount computed server-side; OCC on Project version"
    roles: [GCProjectManager]
    code: 201
    input: [project_id, kind, expected_project_version]
    output: RetainageRelease
    side_effects: ["amount_cents computed per release_amount / final_release_amount; status := REQUESTED; increments Project.version by 1"]
  - method: GET
    path: "/closeout/retainage-releases/{releaseId}"
    description: "Get a retainage release"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: RetainageRelease
    side_effects: []
  - method: GET
    path: "/closeout/retainage-releases"
    description: "List retainage releases (filterable)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "kind?", "status?", "limit?", "offset?"]
    output: RetainageRelease[]
    side_effects: []
  - method: POST
    path: "/closeout/retainage-releases/{releaseId}/approve"
    description: "Owner approves: REQUESTED -> PAID; money moves"
    roles: [OwnerRep]
    code: 200
    input: []
    output: RetainageRelease
    side_effects: ["Project.retainage_paid_cents += amount_cents; retainage_outstanding_cents -= amount_cents; increments Project.version by 1"]
  - method: POST
    path: "/closeout/retainage-releases/{releaseId}/void"
    description: "Void a REQUESTED release (no money moved) or a PAID release (clawback restores outstanding)"
    roles: [GCProjectManager]
    code: 200
    input: []
    output: RetainageRelease
    side_effects: ["on PAID void: Project.retainage_paid_cents -= amount_cents, retainage_outstanding_cents += amount_cents; increments Project.version by 1"]

  # --- WarrantyCase ---
  - method: POST
    path: "/closeout/warranty-cases"
    description: "Report a warranty callback (project must be CLOSED; clock must be <= warranty_start_date + 365 days, closed interval)"
    roles: [OwnerRep]
    code: 201
    input: [project_id, title, severity, description]
    output: WarrantyCase
    side_effects: ["status := REPORTED; reported_at := clock"]
  - method: GET
    path: "/closeout/warranty-cases/{caseId}"
    description: "Get a warranty case"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: []
    output: WarrantyCase
    side_effects: []
  - method: GET
    path: "/closeout/warranty-cases"
    description: "List warranty cases (filterable)"
    roles: [GCProjectManager, GCInspector, OwnerRep, SubcontractorRep]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: WarrantyCase[]
    side_effects: []
  - method: POST
    path: "/closeout/warranty-cases/{caseId}/triage"
    description: "REPORTED -> TRIAGED; sets severity and computes sla_due_at per project.warranty_sla_mode"
    roles: [GCProjectManager]
    code: 200
    input: [severity]
    output: WarrantyCase
    side_effects: ["severity := input; sla_due_at computed (warranty_sla_due_at rule)"]
  - method: POST
    path: "/closeout/warranty-cases/{caseId}/resolve"
    description: "TRIAGED -> RESOLVED with resolution note"
    roles: [GCProjectManager]
    code: 200
    input: [resolution_note]
    output: WarrantyCase
    side_effects: []
  - method: POST
    path: "/closeout/warranty-cases/{caseId}/deny"
    description: "REPORTED or TRIAGED -> DENIED with reason"
    roles: [GCProjectManager]
    code: 200
    input: [denial_reason]
    output: WarrantyCase
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/closeout/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [GCProjectManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or unrecognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's allowed roles" }
  - { id: ERR_NOT_RESPONSIBLE_PARTY, http: 403, condition: "SubcontractorRep acting on a trade other than their own (or on a SELF_PERFORMED trade), or GCProjectManager acting as responsible party on a SUBCONTRACTOR trade" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Verify attempted by the same X-User-ID recorded as ready_by_user_id" }
  - { id: ERR_VERIFICATION_ESCALATED, http: 403, condition: "PunchItem.rejection_count >= 2 and verify attempted by a role other than GCProjectManager" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or value-range violation (incl. end <= start, walk duration < 30 minutes, amount_cents <= 0, retainage_pct out of (0, 0.25], contract_value_cents < 1000)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource or project is not in a valid state for the requested operation" }
  - { id: ERR_PROJECT_NOT_CLOSED, http: 409, condition: "Warranty case reported for a project whose status is not CLOSED" }
  - { id: ERR_OPEN_LIFE_SAFETY_ITEMS, http: 409, condition: "SC request/determination while blocking LIFE_SAFETY punch items exist" }
  - { id: ERR_OPEN_MAJOR_ITEMS, http: 409, condition: "SC request/determination while blocking MAJOR punch items exist" }
  - { id: ERR_TOO_MANY_OPEN_MINOR_ITEMS, http: 409, condition: "SC request/determination with open_minor_count > 5" }
  - { id: ERR_WALK_INCOMPLETE, http: 409, condition: "A TradePackage has no COMPLETED walk (blocks SC gates and mark-ready)" }
  - { id: ERR_NO_TRADE_PACKAGES, http: 409, condition: "begin-punch with zero trade packages" }
  - { id: ERR_WALK_OVERLAP, http: 409, condition: "New walk window overlaps (half-open semantics) another walk for the same lead_inspector_id" }
  - { id: ERR_WALK_NOT_STARTED, http: 409, condition: "Walk completion attempted before scheduled_start per the logical clock" }
  - { id: ERR_SCHEDULED_IN_PAST, http: 409, condition: "scheduled_start is before the current logical clock (walk/session create, reschedule)" }
  - { id: ERR_SESSION_ROOM_CONFLICT, http: 409, condition: "Session violates the 30-minute room turnover buffer against another session in the same location_room" }
  - { id: ERR_SESSION_NOT_STARTED, http: 409, condition: "conduct attempted before scheduled_start per the logical clock" }
  - { id: ERR_NO_ATTENDEES, http: 409, condition: "conduct with attendee_count < 1" }
  - { id: ERR_RESCHEDULE_LIMIT, http: 409, condition: "reschedule attempted when reschedule_count == 2" }
  - { id: ERR_DUPLICATE_TRADE, http: 409, condition: "A TradePackage with the same trade_name already exists for the project" }
  - { id: ERR_DOC_ALREADY_PENDING, http: 409, condition: "A SUBMITTED CloseoutDocument already exists for the same (trade_package_id, doc_type)" }
  - { id: ERR_DOC_TYPE_ALREADY_SATISFIED, http: 409, condition: "An APPROVED CloseoutDocument already exists for the same (trade_package_id, doc_type)" }
  - { id: ERR_WAIVER_NOT_ACCEPTABLE_STATE, http: 409, condition: "Waiver ACCEPT attempted in a project phase not allowed for the waiver type" }
  - { id: ERR_WAIVER_ALREADY_ACCEPTED, http: 409, condition: "Waiver submission attempted while lien_waiver_status == ACCEPTED" }
  - { id: ERR_OCCUPANCY_NOT_REGISTERED, http: 409, condition: "start-closeout before beneficial occupancy registration" }
  - { id: ERR_OCCUPANCY_ALREADY_REGISTERED, http: 409, condition: "Second register-beneficial-occupancy call" }
  - { id: ERR_OCCUPANCY_BEFORE_SC, http: 422, condition: "occupancy_date earlier than substantial_completion_date" }
  - { id: ERR_RELEASE_KIND_ALREADY_USED, http: 409, condition: "A RetainageRelease of the same kind already exists in REQUESTED or PAID status" }
  - { id: ERR_RELEASE_AMOUNT_ZERO, http: 409, condition: "Computed REDUCTION amount is zero (ADJUSTED withholding fully consumed the base)" }
  - { id: ERR_FINAL_RELEASE_NOT_PAID, http: 409, condition: "Project close attempted without a PAID FINAL RetainageRelease" }
  - { id: ERR_TRADE_NOT_IN_PROJECT, http: 422, condition: "trade_package_id does not belong to the referenced project_id" }
  - { id: ERR_WALK_NOT_IN_PROJECT, http: 422, condition: "punch_walk_id does not belong to the referenced project_id" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Warranty case reported after warranty_start_date + 365 days (strictly later than the end instant)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GCProjectManager
    description: "GC closeout project manager; runs the closeout pipeline, scheduling, document/waiver decisions, releases, warranty triage"
    identity: opaque
    exclusive_operations:
      - "Project lifecycle: create project, begin-punch, request-sc-review, start-closeout, close"
      - "TradePackage creation; lien-waiver-decision"
      - "PunchWalk scheduling; PunchItem void"
      - "CloseoutDocument approve/reject"
      - "TrainingSession create/reschedule/conduct"
      - "RetainageRelease create/void"
      - "WarrantyCase triage/resolve/deny"
      - "Logical clock control"
    shared_operations:
      - "PunchItem create (with GCInspector)"
      - "PunchItem mark-ready — SELF_PERFORMED trades only (with SubcontractorRep on SUBCONTRACTOR trades)"
      - "PunchItem verify — required (not merely allowed) when rejection_count >= 2 (with GCInspector otherwise)"
      - "PunchWalk complete (with GCInspector)"
      - "Lien-waiver-submission — SELF_PERFORMED trades only (with SubcontractorRep on SUBCONTRACTOR trades)"
      - "CloseoutDocument create — SELF_PERFORMED trades only (with SubcontractorRep on SUBCONTRACTOR trades)"
      - "All GET endpoints"
  - name: GCInspector
    description: "GC quality inspector; walks the work, writes punch items, performs re-inspection and sign-off"
    identity: opaque
    exclusive_operations:
      - "PunchItem reject (re-inspection failure)"
    shared_operations:
      - "PunchItem create (with GCProjectManager)"
      - "PunchItem verify — only when rejection_count < 2 (with GCProjectManager)"
      - "PunchWalk complete (with GCProjectManager)"
      - "All GET endpoints"
  - name: OwnerRep
    description: "Owner's representative; determines substantial completion, registers beneficial occupancy, releases retainage, reports warranty callbacks"
    identity: opaque
    exclusive_operations:
      - "determine-substantial-completion"
      - "register-beneficial-occupancy"
      - "RetainageRelease approve"
      - "WarrantyCase create"
    shared_operations:
      - "All GET endpoints"
  - name: SubcontractorRep
    description: "Responsible party for a SUBCONTRACTOR TradePackage; X-User-ID equals the TradePackage id"
    identity: "entity_backed:TradePackage"
    exclusive_operations:
      - "PunchItem mark-ready on own SUBCONTRACTOR trade's items"
      - "CloseoutDocument create for own SUBCONTRACTOR trade"
      - "lien-waiver-submission for own SUBCONTRACTOR trade"
    shared_operations:
      - "All GET endpoints"
