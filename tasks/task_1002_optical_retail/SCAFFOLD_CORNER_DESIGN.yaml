              as: PlatformAdmin
          trigger:
            - call: "POST /optical/home-try-on-kits/${kit_id}/return"
              payload: { kept_frame_ids: [] }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "HomeTryOnKit.${kit_id}.status == RETURNED"
            - "HomeTryOnKit.${kit_id}.was_overdue == true"
            - "HomeTryOnKit.${kit_id}.late_fee_cents == 5000"
            - "Frame.${frame_id}.tryon_available == 1"
            - "Customer.${cust_id}.return_risk_score == 100"

