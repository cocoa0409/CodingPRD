  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_activate_requires_vehicle_available
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - validations[priority=7]
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Lease->Vehicle dependency: a Lease can only activate when its referenced Vehicle.status ==
          AVAILABLE; a vehicle already ALLOCATED by another lease blocks activation (ERR_VEHICLE_NOT_AVAILABLE).
        test_recipe:
          setup:
            - "One vehicle; lease A activated (vehicle now ALLOCATED); a second DRAFT lease B on the same vehicle."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "CE1 Co", billing_email: "ce1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCE10001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_a_id: $.data.id }
            - call: "POST /fleet/leases/${lease_a_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_b_id: $.data.id }
          trigger:
            - call: "POST /fleet/leases/${lease_b_id}/activate"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VEHICLE_NOT_AVAILABLE"

      - name: allocation_create_requires_lease_active
        grounds:
          - validations[priority=9]
          - entities.Lease.fields.status
          - entities.Allocation.fields.lease_id
        distinguishing_aspect: |
          Allocation->Lease dependency (a different entity pair than Lease->Vehicle): creating an Allocation
          against a Lease still in DRAFT is rejected with ERR_LEASE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Lease in DRAFT (not yet activated); a VALID driver."
          setup_api_calls:
