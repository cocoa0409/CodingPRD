              as: AccessoryTechnician
              as_user_id: "u-tech-1"
              captures: { forbidden_error: $.data.error_id }
          assert:
            - "${forbidden_error} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "GET /vpc/vessels?processing_center_id=${center_id} returns total_count == 0"
            - "The identical body as PortOperationsPlanner returns HTTP 201"

      - name: corner_error_codes_already_triggered_by_difficulty_instances
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VEHICLE_STOP_SHIP_BLOCKED
          - errors.ERR_DEALER_QUOTA_EXCEEDED
          - errors.ERR_YARD_GRIDLOCK
          - errors.ERR_BERTH_WINDOW_CONFLICT
          - errors.ERR_CARRIER_WINDOW_CAPACITY
          - errors.ERR_CLAIM_REVISION_LIMIT
          - errors.ERR_VESSEL_DISCHARGE_INCOMPLETE
          - errors.ERR_NO_ELIGIBLE_CARRIER
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stop_ship_safety_outranks_dealer_quota_fiscal_on_allocation
          rationale: "Stop-ship and dealer-quota are asserted by the named instance; ERR_YARD_GRIDLOCK by boundary_precision_check / yard_occupancy_exactly_at_constrained_ratio_still_admits_a_unit; ERR_BERTH_WINDOW_CONFLICT by resource_temporal_overlap / berth_window_requires_turnaround_buffer_clearance_on_both_sides; ERR_CARRIER_WINDOW_CAPACITY by resource_temporal_overlap / carrier_concurrent_pickup_windows_aggregate_with_adjacency_allowed; ERR_CLAIM_REVISION_LIMIT by non_linear_state_machine / carrier_claim_dispute_resubmit_cycle_returns_to_filed_until_ceiling; ERR_VESSEL_DISCHARGE_INCOMPLETE by cross_entity_state_dependency / prep_to_shipping_condition_requires_vessel_discharge_complete; ERR_NO_ELIGIBLE_CARRIER by boundary_precision_check / carrier_free_slot_count_exactly_zero_empties_the_candidate_pool."

  # =============================================================== 7. RBAC
  - section: rbac
    instances:
      - name: corner_shared_reads_are_open_to_every_declared_role
        claim_type: role_permitted_operations
        grounds:
          - roles.PortOperationsPlanner.shared_operations
          - roles.Dealer.shared_operations
          - endpoints.GET_/vpc/vehicles/{vehicleId}
        distinguishing_aspect: "All six declared roles — including Dealer, whose ownership scoping is confined to delivery-confirmation — read the same unit successfully and see the identical VIN; no read returns 403."
        test_recipe:
          setup:
            - "One discharged unit in the yard."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
