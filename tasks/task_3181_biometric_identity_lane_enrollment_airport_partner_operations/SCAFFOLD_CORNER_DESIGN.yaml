# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3181 — Biometric Identity Lane Enrollment & Airport Partner Ops
# Breadth probe: every claim §1.1–§1.7 declares that §1.8 does not already
# exercise. §1.8-covered corners appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: member_register_creation_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints.POST_/members/register
          - response_envelope
        distinguishing_aspect: "Register returns 201 with status PENDING_ENROLLMENT, verification_level NONE, risk_score 0, version 1, server-minted id/created_at/updated_at, and the envelope carries meta.api_request_id + response_type object."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { email: "fresh@x.com", full_name: "Fresh Member", date_of_birth: "1993-04-04" }
              as: Member
              captures: { m_id: $.data.id }
          assert:
            - "HTTP 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "Member.${m_id}.status == PENDING_ENROLLMENT"
            - "Member.${m_id}.verification_level == NONE and risk_score == 0 and document_reject_count_90d == 0"
            - "Member.${m_id}.version == 1 and created_at == 2026-09-01T00:00:00Z (default logical clock)"

      - name: enrollment_center_default_and_required_fields
        claim_type: Required Fields
        grounds:
          - entities.EnrollmentCenter
          - endpoints.POST_/enrollment-centers
        distinguishing_aspect: "ambassador_capacity is required (no default); omitting it fails ERR_VALIDATION while a complete POST returns 201 with status ACTIVE."
        test_recipe:
          setup:
            - "Airport PHL exists (no agreement needed for center creation)."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "PHL", name: "Philadelphia Intl", city: "Philadelphia", state_code: "PA" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "PHL Center" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "PHL Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
          assert:
            - "${err} == ERR_VALIDATION (400) for the missing ambassador_capacity"
            - "EnrollmentCenter.${ec_id}.status == ACTIVE and ambassador_capacity == 2"

      - name: venue_access_rule_mode_default_age_18_plus
        claim_type: Defaults
        grounds:
          - entities.Venue.fields.access_rule_mode
        distinguishing_aspect: "Omitting access_rule_mode on venue creation applies the default AGE_18_PLUS — a supplied default is never required."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Default Arena", venue_type: "ARENA", city: "Tulsa", state_code: "OK" }
              as: VenueOps
              captures: { ven_id: $.data.id }
          assert:
            - "Venue.${ven_id}.access_rule_mode == AGE_18_PLUS (default applied)"

      - name: partner_agreement_lane_capacity_computed_zero_at_create
        claim_type: Computed Fields
        grounds:
          - entities.PartnerAgreement.fields.lane_capacity
        distinguishing_aspect: "lane_capacity is computed: a client-supplied lane_capacity in the create payload is ignored and the value is 0 until lanes open."
        test_recipe:
          setup:
            - "Airport TUL exists."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "TUL", name: "Tulsa Intl", city: "Tulsa", state_code: "OK" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              captures: { cap: $.data.lane_capacity }
          assert:
            - "${cap} == 0 (computed field initialized to 0 at creation; any client-supplied value is not part of the input contract and never lands)"
            - "POST returned HTTP 201"

      - name: biometric_retention_log_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.BiometricRetentionLog
        distinguishing_aspect: "BiometricRetentionLog has common_fields false: it carries id and created_at only, no version, and no update endpoint exists — the audit log is append-only."
        test_recipe:
          setup:
            - "Member enrolled ACTIVE with subscription; subscription cancelled to schedule deletion."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "ABQ", name: "Albuquerque Sunport", city: "Albuquerque", state_code: "NM" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "ABQ Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "log@x.com", full_name: "Log Subject", date_of_birth: "1990-09-09" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PL000001", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions"
              payload: { member_id: "${m_id}", plan: "INDIVIDUAL", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /biometric-retention-logs"
              payload: { member_id: "${m_id}" }
              as: ComplianceOfficer
              captures: { log_id: "$.data[0].id" }
          assert:
            - "The log entry carries id, created_at, action == DELETION_SCHEDULED, member_id == ${m_id}"
            - "The log entry has NO version field (common_fields: false)"
            - "No PUT/PATCH/DELETE endpoint exists for /biometric-retention-logs/{id} — a hypothetical PATCH returns 404"

      - name: enrollment_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/enrollments
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /enrollments?member_id=... returns the fixed pagination fields: limit, offset, total_count, has_more with defaults limit=10, offset=0."
        test_recipe:
          setup:
            - "One member with one DRAFT enrollment at an enrollment center."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "OMA", name: "Eppley Airfield", city: "Omaha", state_code: "NE" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "OMA Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "list@x.com", full_name: "List Member", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PL100001", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /enrollments"
              payload: { member_id: "${m_id}" }
              as: OpsAdmin
          assert:
            - "Response carries pagination fields: total_count == 1, has_more == false, limit == 10 (default), offset == 0"
            - "data[0].member_id == ${m_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: enrollment_terminal_completed_rejects_capture
        claim_type: invalid_transition
        grounds:
          - state_machines.Enrollment
        distinguishing_aspect: "COMPLETED is terminal: capture-biometric on a COMPLETED enrollment fails ERR_INVALID_STATE and fires no side effects."
        test_recipe:
          setup:
            - "Member fully enrolled (enrollment COMPLETED) at an enrollment center."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "SLC", name: "Salt Lake City Intl", city: "Salt Lake City", state_code: "UT" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "SLC Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "term@x.com", full_name: "Term Member", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m_id: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m_id}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PL200001", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${m_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /enrollments/${enr_id}/complete"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (409)"
            - "Enrollment.${enr_id}.status == COMPLETED (unchanged)"

      - name: settlement_initial_state_draft
        claim_type: Initial State
        grounds:
          - state_machines.AgreementSettlement
        distinguishing_aspect: "A freshly created settlement is DRAFT and can never skip to PAID: mark-paid on DRAFT fails ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Airport OKC with ACTIVE agreement."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "OKC", name: "Will Rogers World", city: "Oklahoma City", state_code: "OK" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
          trigger:
            - call: "POST /partner-agreements/${agr_id}/settlements"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01", attributable_mrr_cents: 500000, verification_revenue_cents: 500000 }
              as: PartnerManager
              captures: { set_id: $.data.id, st: $.data.status }
            - call: "POST /agreement-settlements/${set_id}/mark-paid"
              payload: {}
              as: PartnerManager
              captures: { err: $.data.error_id }
          assert:
            - "${st} == DRAFT at creation"
            - "${err} == ERR_INVALID_STATE (409) — DRAFT cannot jump to PAID"

      - name: airport_suspend_cascades_agreement_and_lanes
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Airport.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Suspending the airport flips its ACTIVE agreement to SUSPENDED and every OPEN lane to MAINTENANCE — the cross-entity cascade is atomic in the same request."
        test_recipe:
          setup:
            - "Airport BNA ACTIVE with one OPEN lane."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "BNA", name: "Nashville Intl", city: "Nashville", state_code: "TN" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /lanes"
              payload: { airport_id: "${ap_id}", agreement_id: "${agr_id}", terminal: "T1", position_index: 1, open_time: "05:00", close_time: "22:00", capacity_hours: 4 }
              as: OpsAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /airports/${ap_id}/suspend"
              payload: {}
              as: OpsAdmin
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: PartnerManager
              captures: { agr_status: $.data.status }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: OpsAdmin
              captures: { lane_status: $.data.status }
          assert:
            - "Airport.${ap_id}.status == SUSPENDED"
            - "${agr_status} == SUSPENDED (cascade hop 1)"
            - "${lane_status} == MAINTENANCE (cascade hop 2)"

      - name: kiosk_third_consecutive_capture_failure_auto_suspends
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Kiosk
          - entities.Kiosk.fields.consecutive_capture_failures
        distinguishing_aspect: "Three failed biometric captures at the same kiosk auto-suspend it (system transition ACTIVE → SUSPENDED); the counter resets on re-activation."
        test_recipe:
          setup:
            - "Airport RDU, ACTIVE agreement, ACTIVE kiosk K; three members each with a DRAFT enrollment at kiosk K declared biometric_capture_ok=false."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "RDU", name: "Raleigh Durham Intl", city: "Raleigh", state_code: "NC" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /kiosks"
              payload: { airport_id: "${ap_id}", code: "RDU-K1" }
              as: OpsAdmin
              captures: { k_id: $.data.id }
            - call: "POST /kiosks/${k_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /members/register"
              payload: { email: "k1@x.com", full_name: "K One", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m1: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m1}", site_type: "KIOSK", site_id: "${k_id}", document_type: "PASSPORT", document_number: "PK000001", document_expiry: "2030-01-01", biometric_capture_ok: false }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /enrollments/${e1}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /members/register"
              payload: { email: "k2@x.com", full_name: "K Two", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m2: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m2}", site_type: "KIOSK", site_id: "${k_id}", document_type: "PASSPORT", document_number: "PK000002", document_expiry: "2030-01-01", biometric_capture_ok: false }
              as: Member
              as_user_id: "${m2}"
              captures: { e2: $.data.id }
            - call: "POST /enrollments/${e2}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /members/register"
              payload: { email: "k3@x.com", full_name: "K Three", date_of_birth: "1990-01-01" }
              as: Member
              captures: { m3: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${m3}", site_type: "KIOSK", site_id: "${k_id}", document_type: "PASSPORT", document_number: "PK000003", document_expiry: "2030-01-01", biometric_capture_ok: false }
              as: Member
              as_user_id: "${m3}"
              captures: { e3: $.data.id }
            - call: "POST /enrollments/${e3}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${m3}"
          trigger:
            - call: "POST /enrollments/${e1}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { err1: $.data.error_id }
            - call: "POST /enrollments/${e2}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { err2: $.data.error_id }
            - call: "POST /enrollments/${e3}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${m3}"
              captures: { err3: $.data.error_id }
            - call: "GET /kiosks/${k_id}"
              payload: {}
              as: OpsAdmin
              captures: { k_status: $.data.status, k_fail: $.data.consecutive_capture_failures }
          assert:
            - "${err1} == ${err2} == ${err3} == ERR_BIOMETRIC_CAPTURE_FAILED (422)"
            - "${k_fail} == 3"
            - "${k_status} == SUSPENDED (system auto-transition on the third consecutive failure)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: venue_age_gate_birthday_boundary
        claim_type: Correct Result
        grounds:
          - calculations.venue_age_gate
          - entities.Venue.fields.access_rule_mode
        distinguishing_aspect: "AGE_21_PLUS venue admits a member whose 21st birthday is exactly the logical clock date (>= semantics) and rejects one day short."
        test_recipe:
          setup:
            - "Venue AGE_21_PLUS with an event covering 2026-09-01; members born 2005-09-01 (turns 21 that day) and 2005-09-02 (still 20)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Club 21", venue_type: "OTHER", city: "Reno", state_code: "NV", access_rule_mode: "AGE_21_PLUS" }
              as: VenueOps
              captures: { ven_id: $.data.id }
            - call: "POST /venue-events"
              payload: { venue_id: "${ven_id}", name: "Night", start_time: "2026-09-01T00:00:00Z", end_time: "2026-09-02T00:00:00Z", buffer_hours: 0 }
              as: VenueOps
            - call: "POST /airports"
              payload: { iata_code: "RNO", name: "Reno Tahoe Intl", city: "Reno", state_code: "NV" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "RNO Center", ambassador_capacity: 2 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "a21@x.com", full_name: "Turns Today", date_of_birth: "2005-09-01" }
              as: Member
              captures: { ma: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${ma}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PN000001", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${ma}"
              captures: { ea: $.data.id }
            - call: "POST /enrollments/${ea}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${ma}"
            - call: "POST /enrollments/${ea}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${ma}"
            - call: "POST /enrollments/${ea}/complete"
              payload: {}
              as: Member
              as_user_id: "${ma}"
            - call: "POST /members/register"
              payload: { email: "b21@x.com", full_name: "Turns Tomorrow", date_of_birth: "2005-09-02" }
              as: Member
              captures: { mb: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${mb}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PN000002", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${mb}"
              captures: { eb: $.data.id }
            - call: "POST /enrollments/${eb}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${mb}"
            - call: "POST /enrollments/${eb}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${mb}"
            - call: "POST /enrollments/${eb}/complete"
              payload: {}
              as: Member
              as_user_id: "${mb}"
          trigger:
            - call: "POST /venue-access"
              payload: { venue_id: "${ven_id}", member_id: "${ma}" }
              as: Member
              as_user_id: "${ma}"
              captures: { out_a: $.data.outcome }
            - call: "POST /venue-access"
              payload: { venue_id: "${ven_id}", member_id: "${mb}" }
              as: Member
              as_user_id: "${mb}"
              captures: { out_b: $.data.outcome, reason_b: $.data.reject_reason }
          assert:
            - "${out_a} == ADMITTED (21st birthday exactly on the access date counts)"
