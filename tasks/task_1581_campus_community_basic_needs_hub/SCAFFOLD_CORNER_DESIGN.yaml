              as: HubAdmin
            - call: "POST /grant-applications/${g1_id}/disburse"
              payload: {}
              as: HubAdmin
              as_user_id: "admin-9"
              captures: { g1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
