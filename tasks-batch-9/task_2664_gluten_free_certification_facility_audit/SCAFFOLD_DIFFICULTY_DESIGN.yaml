          - entities.Certificate.fields.fee_refunded
          - entities.Applicant.fields.fee_balance_cents
          - state_machines.Certificate.ISSUED_to_REVOKED
          - endpoints."POST /gfco/certificates/{certificateId}/revocation"
        distinguishing_aspect: |
          The money invariant is fee_balance_cents == sum of total_fee_cents over certificates with
          fee_charged true and fee_refunded false, and revocation is the compensating write that
          must keep it exact. Two identically priced certificates (178800 each, 357600 charged) are
          revoked for VOLUNTARY_WITHDRAWAL one second apart across the inclusive 30-day boundary:
          the first, revoked at exactly issued_on + 30 days, refunds and takes the balance to
          178800; the trigger, one second later, must NOT refund, so the balance stays 178800
          rather than falling to 0. An implementation with an exclusive boundary refunds neither,
          one that ignores the window refunds both, and one that subtracts a recomputed fee rather
          than the stored total_fee_cents drifts on the second revocation.
        test_recipe:
          setup:
            - "One applicant, one facility with shared equipment whose sanitation validation is current and whose INITIAL audit closed CLOSED_PASS."
            - "One APPROVED INHERENTLY_GF ingredient shared by two STANDARD-tier products, each with formula CLEARED, an active testing plan and label APPROVED, so each product prices identically: base 149000, surcharge 29800, total 178800."
            - "Both certificates are issued at clock 2026-08-11T00:00:00Z, taking Applicant.fee_balance_cents to 357600; no UNANNOUNCED lot test exists for either product, so refund condition (3) is satisfied."
            - "At clock 2026-09-10T00:00:00Z - exactly issued_on + 30 days - the first certificate is revoked for VOLUNTARY_WITHDRAWAL, which refunds 178800 and leaves the balance at 178800."
            - "The clock then advances one second to 2026-09-10T00:00:01Z before the trigger."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 3.0, method: "R5_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2029-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_id}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_id}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_a: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_a}", ingredient_id: "${ing_id}", inclusion_pct: 60 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_a}/formula-review"
              payload: { decision: "CLEAR" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { pa_v1: $.data.version }
            - call: "POST /gfco/products/${prod_a}/testing-plan"
              payload: { expected_product_version: "${pa_v1}" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products/${prod_a}/label-review"
              payload: { decision: "APPROVE", mark_tier_granted: "STANDARD" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { pa_v3: $.data.version }
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Dinner Roll", sku: "RDR-002", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_b: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_b}", ingredient_id: "${ing_id}", inclusion_pct: 60 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_b}/formula-review"
              payload: { decision: "CLEAR" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { pb_v1: $.data.version }
            - call: "POST /gfco/products/${prod_b}/testing-plan"
              payload: { expected_product_version: "${pb_v1}" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products/${prod_b}/label-review"
              payload: { decision: "APPROVE", mark_tier_granted: "STANDARD" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { pb_v3: $.data.version }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-05T08:00:00Z", onsite_end_at: "2026-08-05T16:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T17:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/certificates"
              payload: { product_id: "${prod_a}", expected_product_version: "${pa_v3}" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { cert_a: $.data.id, fee_a: $.data.total_fee_cents, issued_a: $.data.issued_on, charged_a: $.data.fee_charged }
            - call: "POST /gfco/certificates"
              payload: { product_id: "${prod_b}", expected_product_version: "${pb_v3}" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { cert_b: $.data.id, fee_b: $.data.total_fee_cents }
            - call: "GET /gfco/applicants/${app_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { bal_issued: $.data.fee_balance_cents, active_issued: $.data.active_certified_product_count }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/certificates/${cert_a}/revocation"
              payload: { revocation_reason: "VOLUNTARY_WITHDRAWAL" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { refund_a: $.data.fee_refunded, status_a: $.data.status, revoked_on_a: $.data.revoked_on }
            - call: "GET /gfco/applicants/${app_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { bal_after_a: $.data.fee_balance_cents, revoked_after_a: $.data.revoked_certificate_count }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:01Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/certificates/${cert_b}/revocation"
              payload: { revocation_reason: "VOLUNTARY_WITHDRAWAL" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
          assert:
            - "response.status == 200"
            - "${fee_a} == 178800"
            - "${fee_b} == 178800"
            - "${charged_a} == true"
            - "${issued_a} == \"2026-08-11T00:00:00Z\""
            - "${bal_issued} == 357600"
            - "${active_issued} == 2"
            - "${refund_a} == true"
            - "${status_a} == \"REVOKED\""
            - "${revoked_on_a} == \"2026-09-10T00:00:00Z\""
            - "${bal_after_a} == 178800"
            - "${revoked_after_a} == 1"
            - "Certificate.${cert_a}.fee_refunded == true"
            - "Certificate.${cert_a}.fee_charged == true"
            - "Certificate.${cert_b}.status == \"REVOKED\""
            - "Certificate.${cert_b}.revocation_reason == \"VOLUNTARY_WITHDRAWAL\""
            - "Certificate.${cert_b}.revoked_on == \"2026-09-10T00:00:01Z\""
            - "Certificate.${cert_b}.fee_charged == true"
            - "Certificate.${cert_b}.fee_refunded == false"
            - "Certificate.${cert_b}.mark_usage_locked == true"
            - "Certificate.${cert_b}.total_fee_cents == 178800"
            - "Product.${prod_a}.label_status == \"FROZEN\""
            - "Product.${prod_b}.label_status == \"FROZEN\""
            - "Applicant.${app_id}.fee_balance_cents == 178800"
            - "Applicant.${app_id}.revoked_certificate_count == 2"
            - "Applicant.${app_id}.active_certified_product_count == 0"
            - "Applicant.${app_id}.suspended_certificate_count == 0"
            - "Applicant.${app_id}.posture_score_cycle == 100"
            - "Applicant.${app_id}.compliance_posture == \"GOOD_STANDING\""
