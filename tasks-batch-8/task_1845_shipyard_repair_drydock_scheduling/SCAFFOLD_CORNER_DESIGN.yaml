              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p2: $.data.id }
            - call: "POST /v1/permits"
              payload: { project_id: "${p1}", permit_type: "HOT_WORK", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-08-10T23:59:59Z" }
              as: EnvironmentalOfficer
              captures: { hw1: $.data.id }
            - call: "POST /v1/permits/${hw1}/grant"
