    - validations[priority=2]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: "Authentication precedes authorisation and payload validation: a POST /tracts carrying X-User-Role TitleAnalyst but no X-User-ID header returns ERR_UNAUTHENTICATED (401), and so does a request whose X-User-Role is not one of the six declared roles - never a 400 or a 403."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "no fixtures; the first trigger call omits the X-User-ID header entirely and the second sends X-User-Role: Auditor, which is not a declared role"
      setup_api_calls: []
      trigger:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000 }
        as: TitleAnalyst
        captures: { err: $.data.error_id }
      assert:
      - "with X-User-ID omitted the response is HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
      - "with X-User-Role Auditor (undeclared) the same body also returns HTTP 401 ERR_UNAUTHENTICATED, not 403"
      - "an empty-string X-User-ID is treated as missing and also returns 401"
      - "no Tract row is created by any of the rejected calls"

