  - rule_id: boundary_precision_check
    instances:

      - name: timing_risk_amber_red_frontier_is_one_minute_wide
        grounds:
          - calculations.departure_timing_risk
          - entities.ExcursionDeparture.fields.slack_minutes_actual
          - entities.ExcursionDeparture.fields.timing_risk_band_actual
          - endpoints[POST /shore-excursions/port-calls/{portCallId}/delays]
        distinguishing_aspect: |
          Metric: slack_minutes_actual against RED_SLACK_CEILING 0, exercised on
          POST /shore-excursions/port-calls/{portCallId}/delays. A 74-minute delay leaves slack exactly 1
          and the band AMBER; one more minute of delay would make it 0 and RED. The band is decided by
          `slack <= 0`, not `slack < 0`, so 1 must not be RED.
