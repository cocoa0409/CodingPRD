        distinguishing_aspect: |
          permitted_instrument_types is enforced at proposal time, not at execution:
          the COLLAR never becomes a PROPOSED row, so open_instrument_count stays 0
          and no delta_factor 0.65 is ever assigned. The SWAP proposed straight after
          proves the endpoint itself is healthy.
