  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_parallel_dimensions_delivered_stays_while_settlement_partially_refunds
        grounds:
          - state_machines.Order.CONFIRMED_to_DELIVERED
          - state_machines.Order.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.settlement_status
        distinguishing_aspect: |
          PARALLEL shape: the settlement dimension advances CAPTURED -> PARTIALLY_REFUNDED while the
          fulfillment dimension stays DELIVERED, so the combined state (DELIVERED, PARTIALLY_REFUNDED)
          is reached without any fulfillment transition firing.
        test_recipe:
          setup:
            - "Program / Engineering group / HQ dock / Thai Garden / Ada with an OPEN 2026-08 period."
            - "Ada's 3 x 1000 order with tip 200 is delivered: (DELIVERED, CAPTURED), employer_covered 2500, employee_card 1863, gross 4363."
            - "A MISSING_ITEM claim for line 0 claiming 1000 is resolved PROPORTIONAL for 1000 cents by user ctrl-resolver."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
