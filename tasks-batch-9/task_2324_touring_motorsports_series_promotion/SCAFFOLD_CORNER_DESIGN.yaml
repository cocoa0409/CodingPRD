              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Window Racing", driver_name: "P. Deng", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "41", vehicle_weight_lbs: 7000, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { e_open: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "42", vehicle_weight_lbs: 7000, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { e_close: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "43", vehicle_weight_lbs: 7000, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { e_late: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T14:59:59Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${e_open}/check-in"
              payload: {}
              as: SeriesPromoter
              captures: { err_early: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T15:00:00Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${e_open}/check-in"
              payload: { arrival_note: "exactly at the open bound" }
              as: SeriesPromoter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T21:00:00Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${e_close}/check-in"
              payload: { arrival_note: "exactly at the close bound" }
              as: SeriesPromoter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T21:00:01Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${e_late}/check-in"
              payload: {}
              as: SeriesPromoter
              captures: { err_late: "$.data.error_id" }
          assert:
            - "trigger call 2 returns HTTP 409 with ${err_early} == ERR_STAGING_WINDOW_CLOSED one second before the window opens; VehicleEntry.${e_open}.logistics_state is still ENTERED and actual_arrival_utc is null"
            - "trigger call 4 returns HTTP 200: VehicleEntry.${e_open}.logistics_state == STAGED, actual_arrival_utc == 2026-11-14T15:00:00Z, readiness_variant == POST_STAGING, readiness_score == 100 (arrived before the promised 16:00Z, so no slip penalty)"
            - "trigger call 6 returns HTTP 200 at the inclusive close bound: VehicleEntry.${e_close}.actual_arrival_utc == 2026-11-14T21:00:00Z and readiness_score == 85 == 100 - ARRIVAL_SLIP_PENALTY, because 21:00Z is later than the promised 16:00Z"
            - "trigger call 8 returns HTTP 409 with ${err_late} == ERR_STAGING_WINDOW_CLOSED one second after the window closes; VehicleEntry.${e_late} stays ENTERED with readiness_variant == PRE_STAGING and readiness_score == 100"
