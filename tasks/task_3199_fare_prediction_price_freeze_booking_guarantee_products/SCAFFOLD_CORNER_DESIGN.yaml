              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 14000, seats_left: 4 }
              as: OpsAgent
            - call: "POST /fare/claims"
              payload: { freeze_id: "${f1_id}", market_price_cents: 16500 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /fare/price-freezes/${f1_id}/cancellations"
              payload: { cancel_reason: "CHANGED_MIND" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "POST /fare/claims/${c1_id}/withdrawals"
              payload: { withdrawal_reason: "NOT_NEEDED" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "the cancellation is rejected with ERR_INVALID_STATE at priority 8"
            - "PriceFreeze.${f1_id}.status is still CLAIM_PENDING after the refusal"
            - "after the withdrawal the freeze returns to FROZEN, proving the claim is the only route back"
            - "the withdrawal never sets deposit_forfeited_cents"

      - name: corner_payment_refund_clears_the_entitlement_to_zero
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Payment.PARTIALLY_REFUNDED_to_REFUNDED
          - entities.Payment.fields.refundable_remaining_cents
        distinguishing_aspect: "A full refund zeroes the entitlement exactly, and a further one-cent refund is refused with the over-allocation error."
        test_recipe:
          setup:
