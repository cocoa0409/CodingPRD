      - name: corner_non_party_actors_cannot_read_or_write_another_agreement
        claim_type: peer_party_isolation
        grounds:
          - validations[priority=20]
          - errors.ERR_NOT_AGREEMENT_PARTY
          - rbac.roles.PlatformAdmin
          - rbac.roles.Developer
        distinguishing_aspect: "Party scoping is symmetric and applies to reads as well as writes: a Developer actor backed by a different Studio and a PublisherFinance actor backed by a different Publisher both get 403 ERR_NOT_AGREEMENT_PARTY on the very same agreement, and the check runs BEFORE any state precondition, so a foreign studio submitting a build to a legally buildable milestone still sees the party error rather than a build error. PlatformAdmin is the single declared exemption and reads the same agreement with 200."
        test_recipe:
          setup:
            - "Agreement Aurora Solo belongs to Studio Northlight and Publisher Vantage, is ACTIVE, and its single ALPHA milestone is IN_DEVELOPMENT (so a build would otherwise be legal)."
            - "Studio Farshore and Publisher Rivalcorp (with its own FINANCE user Rho) are unrelated to that agreement."
