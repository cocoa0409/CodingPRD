  # =========================================================================
  # RULE 9 — compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: sign_then_cancel_returns_every_square_foot_to_the_floor
        grounds:
          - calculations.show_booth_area_conservation
          - state_machines.SpaceContract.SIGNED_to_CANCELLED
          - state_machines.Booth.ASSIGNED_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: FLOOR AREA in square feet. sellable_booth_sqft must always equal
          available + held + assigned, and the sign -> cancel round trip must restore all three terms
          plus committed_ratio_pct and floor_posture to their exact pre-hold values with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z (202 days before event_start, so the 180-day 25% cancellation bucket applies)."
            - "Show published with booths A100 (400 sqft CORNER/MAIN_AISLE) and C050 (200 sqft INLINE): sellable_booth_sqft == 600, available_net_sqft == 600."
