# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2740 — Fitness Equipment Service & Maintenance Contract
# Nine §0.5 Difficulty Rules x 2 differentiated instances = 18 instances.
# Every literal below was computed against the §1.3 formulas and their constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: downtime_credit_wall_clock_provisional_vs_operating_hours_final
        grounds:
          - calculations.downtime_credit
          - calculations.credit_reconciliation
          - state_machines.DowntimeEvent.OPEN_to_CLOSED
          - state_machines.DowntimeEvent.CLOSED_to_RECONCILED
          - entities.DowntimeEvent.fields.provisional_credit_cents
          - entities.DowntimeEvent.fields.final_credit_cents
          - entities.Club.fields.operating_open_minute
        distinguishing_aspect: |
          One DowntimeEvent row yields two different money numbers on the CONTRACT LEDGER domain:
          the provisional variant bills all 780 wall-clock minutes (16000 cents) while the final
          variant bills only the 420 minutes inside the club's 05:00-23:00 operating window
          (6400 cents), because the outage straddles an overnight closure.
        test_recipe:
          setup:
            - "Club NORTH open 05:00-23:00 UTC (operating_open_minute 300, operating_close_minute 1380)."
            - "GOLD/FULL contract, annual_base_cents 250000 so credit_cap_cents is 37500 and never clips this event."
            - "One treadmill in service; one MAJOR service call opened 2026-08-10T20:00Z and resolved 2026-08-11T09:00Z."
            - "Its DowntimeEvent is CLOSED in period 2026-08 and the contract has never been reconciled."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", operating_open_minute: 300, operating_close_minute: 1380 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-DT-1", install_date: "2024-03-01", initial_usage_hours: 100 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T20:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_SLIP" }, as: ServiceCoordinator, captures: { call_a_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/dispatch", payload: { start_at: "2026-08-10T20:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T20:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/resolve", payload: { resolution_code: "BELT_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "GET /fleetcare/downtime-events", payload: { service_call_id: "${call_a_id}" }, as: ContractAdministrator, captures: { ev_a_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { c_ver: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/credit-reconciliations", payload: { period_key: "2026-08", expected_contract_version: "${c_ver}" }, as: ContractAdministrator, captures: { posted: "$.data.posted_credit_cents" } }
          assert:
            - "DowntimeEvent.${ev_a_id}.downtime_minutes == 780"
            - "DowntimeEvent.${ev_a_id}.operating_downtime_minutes == 420"
            - "DowntimeEvent.${ev_a_id}.provisional_credit_cents == 16000"
            - "DowntimeEvent.${ev_a_id}.final_credit_cents == 6400"
            - "DowntimeEvent.${ev_a_id}.posted_credit_cents == 6400"
            - "DowntimeEvent.${ev_a_id}.status == RECONCILED"
            - "response.posted_credit_cents == 6400"
            - "response.final_credit_total_cents == 6400"
            - "response.reconciled_event_count == 1"
            - "ServiceContract.${c_id}.credit_accrued_cents == 6400"
            - "ServiceContract.${c_id}.credit_forgone_cents == 0"
            - "ServiceContract.${c_id}.credit_provisional_cents == 16000"
            - "ServiceContract.${c_id}.last_reconciled_period_key == '2026-08'"

      - name: equipment_health_usage_based_vs_failure_based_after_third_call
        grounds:
          - calculations.equipment_health_score
          - entities.Equipment.fields.health_score
          - entities.Equipment.fields.health_score_variant
          - entities.Equipment.fields.downtime_minutes_ytd
          - state_machines.ServiceCall.ON_SITE_to_RESOLVED
        distinguishing_aspect: |
          The same Equipment row scores 56.00 under the usage variant (6000 of 20000 life hours,
          7 years old) and 77.00 under the failure variant the moment its third resolved call in
          365 days lands - a RISK-SCORING domain on Equipment, not money on a ledger, and the
          variant switch is driven by a row count rather than by a workflow phase.
        test_recipe:
          setup:
            - "Clock 2026-08-20T08:00Z; treadmill installed 2019-05-10 with 6000 usage hours against a 20000-hour design life (age 7)."
            - "GOLD/FULL contract ACTIVE; one technician in region NORTH skilled on TREADMILL."
            - "Two CRITICAL calls already resolved on the unit, each with exactly 60 minutes of downtime, so downtime_minutes_ytd is 120 and the score is still usage-based 56.00."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-HS-1", install_date: "2019-05-10", initial_usage_hours: 6000 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "CRITICAL", symptom_code: "DECK_SEIZED" }, as: ServiceCoordinator, captures: { call_1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/dispatch", payload: { start_at: "2026-08-20T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/resolve", payload: { resolution_code: "DECK_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "CRITICAL", symptom_code: "MOTOR_FAULT" }, as: ServiceCoordinator, captures: { call_2_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/dispatch", payload: { start_at: "2026-08-20T09:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T10:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/resolve", payload: { resolution_code: "MOTOR_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "GET /fleetcare/equipment/${e1_id}", as: ContractAdministrator, captures: { health_before: "$.data.health_score", variant_before: "$.data.health_score_variant" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "CONSOLE_DEAD" }, as: ServiceCoordinator, captures: { call_3_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_3_id}/dispatch", payload: { start_at: "2026-08-20T10:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_3_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T11:00:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_3_id}/resolve", payload: { resolution_code: "CONSOLE_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
          assert:
            - "${health_before} == 56.00 and ${variant_before} == 'USAGE_BASED' (two resolved calls is below the 3-call switch)"
            - "Equipment.${e1_id}.health_score_variant == 'FAILURE_BASED'"
            - "Equipment.${e1_id}.health_score == 77.00"
            - "Equipment.${e1_id}.downtime_minutes_ytd == 180"
            - "Equipment.${e1_id}.usage_hours == 6000.00 (unchanged, so the 56.00 usage value is still what the other variant would return)"
            - "Equipment.${e1_id}.replacement_recommended == false"
            - "ServiceContract.${c_id}.replacement_candidate_count == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: credit_reconciliation_rounds_each_event_before_summing
        grounds:
          - calculations.credit_reconciliation
          - calculations.downtime_credit
          - entities.DowntimeEvent.fields.final_credit_cents
          - entities.ServiceContract.fields.credit_accrued_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding order: two events of 181 operating minutes each round to 27
          cents apiece for a period total of 54, whereas summing the billable minutes first
          (2 minutes -> 53.33) would post 53; the scaffold pins per-event rounding.
        test_recipe:
          setup:
            - "GOLD/FULL contract (grace 180 min, rate 1600 cents/hour), annual_base_cents 250000 so the 37500 cap never binds."
            - "Two service calls on the same treadmill, resolved in sequence, each producing exactly 181 minutes of downtime inside club hours: 10:00-13:01 and 14:00-17:01 on 2026-08-10."
            - "Both DowntimeEvents are CLOSED in period 2026-08 and the contract has never been reconciled."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", operating_open_minute: 300, operating_close_minute: 1380 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-RD-1", install_date: "2024-03-01", initial_usage_hours: 100 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MINOR", symptom_code: "PANEL_RATTLE" }, as: ServiceCoordinator, captures: { call_1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/dispatch", payload: { start_at: "2026-08-10T10:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:01:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/resolve", payload: { resolution_code: "PANEL_TIGHTENED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MINOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_2_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/dispatch", payload: { start_at: "2026-08-10T14:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:01:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/resolve", payload: { resolution_code: "BELT_ALIGNED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "GET /fleetcare/downtime-events", payload: { service_call_id: "${call_1_id}" }, as: ContractAdministrator, captures: { ev_1_id: "$.data[0].id" } }
            - { call: "GET /fleetcare/downtime-events", payload: { service_call_id: "${call_2_id}" }, as: ContractAdministrator, captures: { ev_2_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { c_ver: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/credit-reconciliations", payload: { period_key: "2026-08", expected_contract_version: "${c_ver}" }, as: ContractAdministrator }
          assert:
            - "DowntimeEvent.${ev_1_id}.operating_downtime_minutes == 181"
            - "DowntimeEvent.${ev_2_id}.operating_downtime_minutes == 181"
            - "DowntimeEvent.${ev_1_id}.final_credit_cents == 27"
            - "DowntimeEvent.${ev_2_id}.final_credit_cents == 27"
            - "response.final_credit_total_cents == 54 (not 53, which sum-then-round would give)"
            - "response.reconciled_event_count == 2"
            - "ServiceContract.${c_id}.credit_accrued_cents == 54"
            - "ServiceContract.${c_id}.credit_forgone_cents == 0"

      - name: renewal_quote_pricing_stacks_age_parts_history_and_compliance
        grounds:
          - calculations.renewal_quote_pricing
          - entities.RenewalQuote.fields.history_load_pct
          - entities.RenewalQuote.fields.compliance_discount_cents
          - entities.RenewalQuote.fields.quoted_annual_cents
          - entities.RenewalQuote.fields.fleet_age_index
          - concurrency_rules[quote-create-stale-contract]
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: five interacting inputs (per-unit age tier,
          parts-inclusion percentage keyed on the base, a min()-capped service-history load,
          a stepped compliance discount on the subtotal, and a floor/cap collar on the expiring
          annual price) compose to exactly 336214 cents; changing the evaluation order of any
          step moves the answer.
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z when the fleet is created; quote issued at 2026-08-20T12:00Z."
            - "Club with two treadmills of one model (base_annual_service_cents 120000): E1 installed 2019-05-10 (age 7 -> 1.35) with 6000 usage hours (health 56.00, not replacement-recommended), E2 installed 2024-03-01 (age 2 -> 1.00) with 4000 usage hours (health 76.00)."
            - "GOLD/FULL contract ACTIVE, annual_base_cents 250000 (floor 225000, cap 337500)."
            - "Three resolved calls: two MAJOR calls that arrived one minute past their 120-minute target (sla_met false) and one CRITICAL call inside target, split across the two units so neither unit reaches three resolved calls."
            - "No preventive visits have ever been completed or missed, so pm_compliance_pct is 100.00."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-RQ-1", install_date: "2019-05-10", initial_usage_hours: 6000 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-RQ-2", install_date: "2024-03-01", initial_usage_hours: 4000 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_SLIP" }, as: ServiceCoordinator, captures: { call_a_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:01:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/resolve", payload: { resolution_code: "BELT_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", severity: "MAJOR", symptom_code: "ROLLER_WEAR" }, as: ServiceCoordinator, captures: { call_b_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_b_id}/dispatch", payload: { start_at: "2026-08-15T10:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:02:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_b_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_b_id}/resolve", payload: { resolution_code: "ROLLER_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "CRITICAL", symptom_code: "EMERGENCY_STOP" }, as: ServiceCoordinator, captures: { call_c_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_c_id}/dispatch", payload: { start_at: "2026-08-15T12:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_c_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T13:00:00Z" }, as: ContractAdministrator }
