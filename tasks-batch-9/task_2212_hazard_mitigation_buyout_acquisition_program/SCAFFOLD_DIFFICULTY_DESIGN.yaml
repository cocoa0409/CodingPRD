  - rule_id: priority_pair_validation_conflict
    instances:

      - name: offer_state_check_outranks_federal_cap_check_on_presentation
        grounds:
          - validations.priority_28
          - validations.priority_55
          - endpoints.POST_purchase-offers_offer_id_present
          - calculations.federal_obligation
          - state_machines.PurchaseOffer.DRAFT_to_WITHDRAWN
        distinguishing_aspect: |
          PAIR A, declared on POST /purchase-offers/{offer_id}/present: the request violates
          priority 28 (offer is WITHDRAWN, not DRAFT) AND priority 55 (the prospective federal share
          16050000 exceeds the 10000000 cap on its own, with no prior obligation). Only
          ERR_INVALID_OFFER_STATE with HTTP 409 may be returned; an implementation that evaluates
          the fiscal cap first answers 422 ERR_FEDERAL_SHARE_CAP_EXCEEDED and fails.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with total_federal_share_cap_cents 10000000 and federal_obligated_cents 0."
