  # ===========================================================================
  - rule_id: compensating_invariant
    rule_summary: "A forward action and its compensation must leave a declared invariant exactly intact, with no residue in any derived field."
    instances:

      - name: goodwill_ledger_conserves_authorized_across_approve_fulfill_void
        grounds: "§1.1 Consumer invariant goodwill_paid_cents + goodwill_outstanding_cents + goodwill_voided_cents == goodwill_authorized_cents; §1.2 Remedy APPROVED -> FULFILLED -> VOIDED_AFTER_FULFILLMENT side effects; ProductionLot.goodwill_charged_cents"
        distinguishing_aspect: "MONEY conservation across a three-hop forward-and-reverse path, where the compensation lands in a THIRD bucket (voided) rather than restoring the original bucket, and a separate lot-level charge must return to zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 (CareSupervisor, TIER_3) exist."
            - "Consumer C-1 exists with goodwill_authorized_cents, goodwill_outstanding_cents, goodwill_paid_cents and goodwill_voided_cents all 0."
            - "ProductionLot A1B-2026-0710 is RELEASED with goodwill_charged_cents 0."
            - "One QUALITY Complaint on that lot carries units_claimed 2 against a unit_retail_price_cents of 2500."
            - "One Remedy of remedy_type REFUND with requested_value_cents 4900 on that complaint is in status SUBMITTED with payout_cents already computed."
            - "No SampleKit exists on the complaint, so the approval is not gated by an in-flight kit."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Two stale packs." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710", units_claimed: 2 }, captures: { cp1: "$.data.id", cp1_v: "$.data.version" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: REFUND, requested_value_cents: 4900, expected_complaint_version: "${cp1_v}" }, captures: { rm1: "$.data.id", pay: "$.data.payout_cents" } }
            - { call: "POST /remedies/${rm1}/submit", as: CareAgent, as_user_id: "${ag1}", payload: { submit_note: "Refund." } }
          trigger:
            - { call: "POST /remedies/${rm1}/decide", as: CareSupervisor, as_user_id: "${sup1}", payload: { decision: APPROVE, decision_note: "Approved." } }
            - { call: "GET /consumers/${c1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { a1: "$.data.goodwill_authorized_cents", o1: "$.data.goodwill_outstanding_cents", p1: "$.data.goodwill_paid_cents", v1: "$.data.goodwill_voided_cents" } }
            - { call: "POST /remedies/${rm1}/fulfill", as: CareSupervisor, as_user_id: "${sup1}", payload: { fulfilment_reference: "CHK-7781" } }
            - { call: "GET /consumers/${c1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { a2: "$.data.goodwill_authorized_cents", o2: "$.data.goodwill_outstanding_cents", p2: "$.data.goodwill_paid_cents", v2: "$.data.goodwill_voided_cents" } }
            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { g2: "$.data.goodwill_charged_cents" } }
            - { call: "POST /remedies/${rm1}/void", as: CareSupervisor, as_user_id: "${sup1}", payload: { reason: "Payment returned undeliverable." }, captures: { rstat: "$.data.status" } }
            - { call: "GET /consumers/${c1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { a3: "$.data.goodwill_authorized_cents", o3: "$.data.goodwill_outstanding_cents", p3: "$.data.goodwill_paid_cents", v3: "$.data.goodwill_voided_cents" } }
            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { g3: "$.data.goodwill_charged_cents" } }
          assert:
            - "payout_cents == 5390 (base 4900, uplift_pct 0.10, uplift 490)"
            - "after APPROVE: authorized 5390, outstanding 5390, paid 0, voided 0 — invariant holds: 0 + 5390 + 0 == 5390"
            - "after FULFILL: authorized 5390, outstanding 0, paid 5390, voided 0 — invariant holds: 5390 + 0 + 0 == 5390; ProductionLot.goodwill_charged_cents == 5390"
            - "after VOID: authorized 5390, outstanding 0, paid 0, voided 5390 — invariant holds: 0 + 0 + 5390 == 5390"
            - "goodwill_authorized_cents is 5390 at all three checkpoints: the compensation never rewrites the authorization"
            - "the compensation lands in voided, NOT back in outstanding: outstanding is 0 after the void, not 5390"
            - "ProductionLot.goodwill_charged_cents returns to 0 after the void — no residue on the lot"
            - "remedy status == \"VOIDED_AFTER_FULFILLMENT\" and fulfilled_at is still populated"

      - name: lot_complaint_bucket_counts_conserve_across_duplicate_round_trip
        grounds: "§1.1 ProductionLot invariant linked_complaint_count == provisional_complaint_count + adjudicated_complaint_count + duplicate_complaint_count; §1.2 Complaint INTAKE -> DUPLICATE -> INTAKE side effects; Consumer.complaint_count"
        distinguishing_aspect: "COUNT conservation rather than money, and a true round trip that returns every bucket to its starting value, including a second denormalised counter on a different entity (Consumer.complaint_count). Also proves the derived complaint-rate numerator moves with the buckets and comes back."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 (TIER_3) exist."
            - "ProductionLot A1B-2026-0710 is RELEASED with exactly 200000 units_produced."
            - "TWO indistinguishable QUALITY Complaints from Consumer C-1 resolve to that lot, both in handling_status INTAKE and neither adjudicated."
            - "The lot therefore starts at linked_complaint_count 2, provisional_complaint_count 2, adjudicated_complaint_count 0 and duplicate_complaint_count 0, and Consumer C-1.complaint_count is 2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Reporting the same pack twice by mistake." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { cpa: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { cpb: "$.data.id" } }
            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { l0: "$.data.linked_complaint_count", p0: "$.data.provisional_complaint_count", d0: "$.data.duplicate_complaint_count" } }
          trigger:
            - { call: "POST /complaints/${cpb}/mark-duplicate", as: CareSupervisor, as_user_id: "${sup1}", payload: { duplicate_of_complaint_id: "${cpa}" }, captures: { dstat: "$.data.handling_status" } }
            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { l1: "$.data.linked_complaint_count", p1: "$.data.provisional_complaint_count", d1: "$.data.duplicate_complaint_count" } }
            - { call: "GET /production-lots/${lot1}/complaint-rate", as: CareSupervisor, as_user_id: "${sup1}", payload: { variant: provisional }, captures: { r1: "$.data.rate_ppm" } }
            - { call: "GET /consumers/${c1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { cc1: "$.data.complaint_count" } }
            - { call: "POST /complaints/${cpb}/unmark-duplicate", as: CareSupervisor, as_user_id: "${sup1}", payload: { reason: "Distinct packs after all." }, captures: { ustat: "$.data.handling_status" } }
            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { l2: "$.data.linked_complaint_count", p2: "$.data.provisional_complaint_count", d2: "$.data.duplicate_complaint_count" } }
            - { call: "GET /production-lots/${lot1}/complaint-rate", as: CareSupervisor, as_user_id: "${sup1}", payload: { variant: provisional }, captures: { r2: "$.data.rate_ppm" } }
            - { call: "GET /consumers/${c1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { cc2: "$.data.complaint_count" } }
          assert:
            - "start: linked_complaint_count 2, provisional_complaint_count 2, adjudicated_complaint_count 0, duplicate_complaint_count 0 — invariant 2 == 2 + 0 + 0"
            - "after mark-duplicate: handling_status == \"DUPLICATE\", linked_complaint_count STILL 2, provisional_complaint_count 1, duplicate_complaint_count 1 — invariant 2 == 1 + 0 + 1"
            - "after mark-duplicate the provisional rate drops to 5.00 ppm (numerator 1 of 200000) and Consumer.complaint_count is 1"
            - "after unmark-duplicate: handling_status back to \"INTAKE\" (adjudicated_severity_score is null), duplicate_of_complaint_id null"
            - "after unmark-duplicate: linked_complaint_count 2, provisional_complaint_count 2, duplicate_complaint_count 0 — byte-identical to the starting buckets, invariant 2 == 2 + 0 + 0"
            - "after unmark-duplicate the provisional rate returns to 10.00 ppm (numerator 2 of 200000) and Consumer.complaint_count is back to 2"
            - "linked_complaint_count never changed at any checkpoint: the round trip moved complaints BETWEEN buckets and back without creating or destroying any"
