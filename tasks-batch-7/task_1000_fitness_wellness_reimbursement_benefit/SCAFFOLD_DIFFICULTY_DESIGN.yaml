  - rule_id: boundary_precision_check
    instances:
      - name: quarterly_cap_exact_landing
        grounds:
          - calculations.calc_quarter_usage
          - calculations.calc_claim_payable
        distinguishing_aspect: |
          Boundary on the quarterly_used metric via the approve endpoint: the second approval
          lands quarter_used exactly ON the 10000 cap (allowed, >= semantics), the third fails
          with zero quarterly window remaining.
        test_recipe:
          setup:
            - "Standard fixture (quarterly cap 10000, per-claim 5000); claim1 5000 APPROVED and PAID (quarter_used 5000); claim2 5000 UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
