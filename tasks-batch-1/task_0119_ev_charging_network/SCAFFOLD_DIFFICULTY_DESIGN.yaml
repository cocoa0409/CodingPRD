              captures: { batch_v: $.data.version }
          trigger:
            - call: "POST /api/settlement-batches/${batch_id}/settle"
              payload: { expected_settlementbatch_version: "${batch_v}" }
              as: CPOOperator
          assert:
            - "SettlementBatch.${batch_id}.status == SETTLED (hop1)"
            - "SettlementLineItem.${li_id}.status == SETTLED (hop2)"
            - "ChargingSession.${sess_id}.billing_status == SETTLED (hop3: session billing flipped by the line-item settle)"

