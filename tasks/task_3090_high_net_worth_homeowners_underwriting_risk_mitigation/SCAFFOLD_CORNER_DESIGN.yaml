          - state_machines.WildfireDefenseDispatch.REQUESTED_to_CANCELLED
        excluded_because:
          difficulty_instance: enrollment_decline_cascades_through_dispatch_zone_and_posture
          rationale: "The four-hop decline cascade and its ordering sensitivity are asserted there."

      - name: pagination_with_filtering_and_sort_interact_correctly
