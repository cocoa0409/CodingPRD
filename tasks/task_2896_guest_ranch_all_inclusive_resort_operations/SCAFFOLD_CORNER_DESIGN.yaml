        claim_type: compensation
        excluded_because:
          difficulty_instance: mount_release_returns_the_horses_scheduled_hours_to_zero
          rationale: "The §1.8 compensating_invariant instance already asserts that ASSIGNED -> RELEASED restores Horse.scheduled_load_hours to its exact pre-assignment value with no drift and bumps mount_release_count, which is the whole compensation claim for this scaffold."

