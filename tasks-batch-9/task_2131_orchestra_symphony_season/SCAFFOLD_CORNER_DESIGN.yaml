  # ===========================================================================
  - section: calculations
    instances:
      - name: donor_level_threshold_is_inclusive_at_250000
        claim_type: threshold boundary
        grounds: ["calculations.donor_level_derivation", "entities.Patron.fields.donor_level", "endpoints[POST /orchestra/patrons/{patron_id}/donations]"]
        distinguishing_aspect: "A cumulative gift of 249999 cents leaves donor_level NONE; one more cent reaches exactly 250000 and flips it to FRIEND, so the threshold comparison is >= and not >."
        test_recipe:
          setup: ["One freshly registered patron with no gifts and no seniority"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoxOfficeAgent
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/patrons/${p1}/donations"
              payload: { amount_cents: 249999 }
              as: BoxOfficeAgent
              captures: { lvl_before: "$.data.donor_level", score_before: "$.data.renewal_priority_score" }
            - call: "POST /orchestra/patrons/${p1}/donations"
              payload: { amount_cents: 1 }
              as: BoxOfficeAgent
              captures: { lvl_after: "$.data.donor_level", score_after: "$.data.renewal_priority_score" }
          assert:
            - "${lvl_before} == NONE"
            - "${score_before} == 0"
            - "${lvl_after} == FRIEND"
            - "${score_after} == 50"
            - "Patron.${p1}.lifetime_donation_cents == 250000"
            - "Patron.${p1}.lifetime_cash_in_cents == 0  (gifts never touch the cash ledger)"

