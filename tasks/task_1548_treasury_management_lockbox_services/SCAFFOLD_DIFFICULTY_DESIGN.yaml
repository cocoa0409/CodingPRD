            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${ba_id}/items"
              payload: { check_number: "5", payer_routing_number: "0710002880", amount_cents: 10000, payee_name: "C" }
