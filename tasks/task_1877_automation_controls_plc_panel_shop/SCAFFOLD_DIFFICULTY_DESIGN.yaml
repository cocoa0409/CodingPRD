  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: engineer_double_booked_half_open_adjacency
        grounds:
          - validations[priority=13]
          - entities.StartupSession.fields.engineer_id
        distinguishing_aspect: |
          Half-open [start, end) overlap semantics on the FieldEngineer resource:
          two sessions for engineer fe-060 on DIFFERENT panels overlapping by one
          hour are rejected with ERR_ENGINEER_DOUBLE_BOOKED, while a session whose
          scheduled_start exactly equals the other's scheduled_end (adjacent,
          zero-gap) is accepted because end == start is not an overlap under
          half-open semantics.
        test_recipe:
          setup:
            - "Two SHIPPED panels P-H1 and P-H2 (same job or different jobs), engineer fe-060 free"
            - "Logical clock at 2026-10-04T00:00:00Z so all windows are in the future"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Pi Ceramics", site_state_code: "AZ" }
              as: ProjectManager
              captures: { cust16_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust16_id}", job_number: "J-9301", quoted_price_cents: 200000, warranty_months: 12 }
              as: ProjectManager
              captures: { job16_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job16_id}/panels"
              payload: { panel_tag: "P-H1", enclosure_rating: "NEMA_1", design_engineer_id: "de-013" }
              as: DesignEngineer
              captures: { panel_h1: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job16_id}/panels"
              payload: { panel_tag: "P-H2", enclosure_rating: "NEMA_1", design_engineer_id: "de-013" }
              as: DesignEngineer
              captures: { panel_h2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T00:00:00Z" }
              as: ProjectManager
            - call: "POST /panel-shop/panels/${panel_h1}/startup-sessions"
              payload: { scheduled_start: "2026-10-06T08:00:00Z", scheduled_end: "2026-10-06T17:00:00Z", engineer_id: "fe-060", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { ss_h1: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/panels/${panel_h2}/startup-sessions"
              payload: { scheduled_start: "2026-10-06T12:00:00Z", scheduled_end: "2026-10-06T20:00:00Z", engineer_id: "fe-060", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /panel-shop/panels/${panel_h2}/startup-sessions"
              payload: { scheduled_start: "2026-10-06T17:00:00Z", scheduled_end: "2026-10-06T20:00:00Z", engineer_id: "fe-060", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { ss_h2: "$.data.id" }
          assert:
            - "Overlapping request (12:00-20:00 vs 08:00-17:00) rejected with ERR_ENGINEER_DOUBLE_BOOKED http 422"
            - "Adjacent request (17:00-20:00, touching at exactly 17:00) succeeds: StartupSession.${ss_h2}.status == SCHEDULED"

      - name: panel_turnover_buffer_24h_gap_boundary
        grounds:
          - validations[priority=14]
          - entities.StartupSession.fields.panel_id
        distinguishing_aspect: |
          Buffer-inflated interval semantics on the Panel resource (distinct from
          the sibling's bare half-open overlap on the engineer): a second session
          for the SAME panel must leave a >= 24h turnover gap after the previous
          session's scheduled_end. A 23h gap is rejected with
          ERR_PANEL_TURNOVER_VIOLATION even though the windows do NOT overlap under
          half-open semantics; a gap of exactly 24h is accepted (>= is inclusive).
        test_recipe:
          setup:
            - "One panel P-T1 with an existing SCHEDULED session ending 2026-10-06T17:00:00Z (different engineer to keep the engineer rule out of play)"
            - "Logical clock at 2026-10-04T00:00:00Z"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Rho Glass", site_state_code: "CO" }
              as: ProjectManager
              captures: { cust17_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust17_id}", job_number: "J-9302", quoted_price_cents: 200000, warranty_months: 12 }
              as: ProjectManager
              captures: { job17_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job17_id}/panels"
              payload: { panel_tag: "P-T1", enclosure_rating: "NEMA_1", design_engineer_id: "de-014" }
              as: DesignEngineer
              captures: { panel_t1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T00:00:00Z" }
              as: ProjectManager
            - call: "POST /panel-shop/panels/${panel_t1}/startup-sessions"
              payload: { scheduled_start: "2026-10-06T08:00:00Z", scheduled_end: "2026-10-06T17:00:00Z", engineer_id: "fe-070", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { ss_t1a: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/panels/${panel_t1}/startup-sessions"
              payload: { scheduled_start: "2026-10-07T16:00:00Z", scheduled_end: "2026-10-07T20:00:00Z", engineer_id: "fe-071", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { err_turn: "$.data.error_id" }
            - call: "POST /panel-shop/panels/${panel_t1}/startup-sessions"
              payload: { scheduled_start: "2026-10-07T17:00:00Z", scheduled_end: "2026-10-07T20:00:00Z", engineer_id: "fe-071", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { ss_t1b: "$.data.id" }
          assert:
            - "23h-gap request (start 2026-10-07T16:00 after end 2026-10-06T17:00) rejected with ERR_PANEL_TURNOVER_VIOLATION http 422 despite zero half-open overlap"
            - "24h-gap request (start 2026-10-07T17:00) succeeds: StartupSession.${ss_t1b}.status == SCHEDULED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: change_order_approve_rescind_ledger_conservation
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - state_machines.ChangeOrder.APPROVED_to_SUPERSEDED
          - concurrency_rules[change-order-rescind-stale-job]
          - entities.Job.fields.approved_co_delta_cents
        distinguishing_aspect: |
          Conserved quantity: Job.approved_co_delta_cents (and therefore
          contract_price_cents). Approving CO#1 (+114000 computed) then CO#2 (+47500
          computed) then rescinding CO#1 MUST leave approved_co_delta_cents ==
          47500 exactly — the compensation subtracts precisely the rescinded order's
          computed_delta_cents, not the current ledger value; the assert pins the
          ledger after each mutation so any drift (e.g., subtracting a re-derived or
          stale delta) is caught.
        test_recipe:
          setup:
            - "Job J-9401 quoted 1000000 with two PROPOSED change orders: CO1 price_delta 120000 (T1 tier since 100000 <= 120000 < 500000, floor 0.05, computed_delta 114000) and CO2 price_delta 50000 (T0 tier since 50000 < 100000, floor 0.00, computed_delta 50000)"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Sigma Frozen", site_state_code: "WA" }
              as: ProjectManager
              captures: { cust18_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust18_id}", job_number: "J-9401", quoted_price_cents: 1000000 }
              as: ProjectManager
              captures: { job18_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job18_id}/change-orders"
              payload: { description: "CO1 add UPS", price_delta_cents: 120000 }
              as: ProjectManager
              captures: { co1: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job18_id}/change-orders"
              payload: { description: "CO2 add beacon", price_delta_cents: 50000 }
              as: ProjectManager
              captures: { co2: "$.data.id" }
            - call: "GET /panel-shop/jobs/${job18_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust18_id}"
              captures: { job18_v1: "$.data.version" }
            - call: "POST /panel-shop/change-orders/${co1}/approve"
              payload: { expected_job_version: "${job18_v1}" }
              as: Customer
              as_user_id: "${cust18_id}"
            - call: "GET /panel-shop/jobs/${job18_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust18_id}"
              captures: { job18_v2: "$.data.version" }
            - call: "POST /panel-shop/change-orders/${co2}/approve"
              payload: { expected_job_version: "${job18_v2}" }
              as: Customer
              as_user_id: "${cust18_id}"
          trigger:
            - call: "GET /panel-shop/jobs/${job18_id}"
              payload: {}
              as: ProjectManager
              captures: { job18_v3: "$.data.version" }
            - call: "POST /panel-shop/change-orders/${co1}/rescind"
              payload: { expected_job_version: "${job18_v3}" }
              as: ProjectManager
          assert:
            - "After both approvals, Job.${job18_id}.approved_co_delta_cents == 164000 (114000 + 50000)"
            - "After rescinding CO1, Job.${job18_id}.approved_co_delta_cents == 50000"
            - "Job.${job18_id}.contract_price_cents == 1050000 after rescind"
            - "ChangeOrder.${co1}.status == SUPERSEDED and ChangeOrder.${co2}.status == APPROVED"
            - "Invariant: contract_price_cents == quoted_price_cents + approved_co_delta_cents holds at every step"

      - name: test_session_abort_restores_point_results_and_counts
        grounds:
          - state_machines.TestSession.OPEN_to_ABORTED
          - state_machines.TestPoint.FAIL_to_UNTESTED
          - entities.TestSession.fields.pass_count
        distinguishing_aspect: |
          Conserved quantity: the panel's undecided-point pool
          (count(TestPoint.result == UNTESTED) + session's recorded results) and the
          session's pass_count/fail_count. Recording 1 PASS + 1 FAIL + 1 SKIPPED on
          a 4-point panel then aborting MUST restore all 4 points to UNTESTED and
          zero both counters — the compensating action undoes each recorded result
          individually, so a partial wipe (e.g., resetting only FAIL points) or
          counter drift fails the assert.
