          assert:
            - "tp_status_pre == BUYOUT_IN_PROGRESS and tp_awarded_pre == 9000000 (DRAFT sibling sub_j blocks the AWARDED bubble-up)"
            - "sub_i_status == REPLACED (hop 1)"
            - "repl_status == DRAFT and repl_link == ${sub_i} (hop 2: spawn with cross-aggregate link)"
            - "repl_tp == ${tp_id} (spawn inherits the package)"
            - "repl_ins == MISSING and repl_round == 0 and repl_val == 0 (insurance and negotiation state reset by the cascade)"
            - "cert_i_status == SUPERSEDED (old certificates retired by the cascade)"
            - "tp_status_post == BUYOUT_IN_PROGRESS and tp_awarded_post == 0 (REPLACED no longer counts as awarded anchor)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_invalid_state_over_contingency_exceeded
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_CONTINGENCY_EXCEEDED]
        distinguishing_aspect: |
          Pair = state (priority 5) vs business_fiscal (priority 9): awarding a
          DRAFT subcontract while the package's fiscal headroom is already blown
          by a PENDING_AWARD sibling (10000000 pending vs 9900000 budget with
          the contingency pool fully drawn) MUST return
          ERR_INVALID_STATE_TRANSITION, never ERR_CONTINGENCY_EXCEEDED.
