              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v1}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "GET /udi/lots/${lot_id}"
              payload: {}
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_v2: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0002", acquisition_cost_cents: 400000, expected_lot_version: "${lot_v2}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u2_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "GET /udi/catalog-items/${cat_id}"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { qty_before: "$.data.on_hand_available_qty" }
          trigger:
            - call: "POST /udi/surgical-cases/${case_id}/reservations"
              payload: { device_unit_id: "${u1_id}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { custody_now: "$.data.custody_state", case_ref: "$.data.reserved_case_id" }
            - call: "GET /udi/catalog-items/${cat_id}"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { qty_after: "$.data.on_hand_available_qty" }
          assert:
            - "Before the reservation, CatalogItem.${cat_id}.on_hand_available_qty == 2"
            - "The reservation response itself already carries custody_state == RESERVED and reserved_case_id == ${case_id}"
            - "Immediately afterwards, CatalogItem.${cat_id}.on_hand_available_qty == 1 with no ops-run in between"
            - "Lot.${lot_id}.on_hand_qty == 2 and Lot.${lot_id}.consumed_qty == 0 (a reservation does not consume)"
            - "SurgicalCase.${case_id}.readiness_status == READY and blocked_reservation_count == 0"
