  - rule_id: compensating_invariant
    instances:
      - name: obligation_ledger_conserved_by_full_final_deobligation
        grounds:
          - calculations.applicant_grant_ledger
          - state_machines.Project.VALIDATED_to_OBLIGATED
          - state_machines.Deobligation.PROPOSED_to_FINAL
          - entities.Project.fields.deobligated_cents
          - entities.Disaster.fields.total_obligated_cents
        distinguishing_aspect: |
          Conserved quantity 1 — the OBLIGATION ledger, pinned as
          `Applicant.total_obligated_cents == Σ over the applicant's OBLIGATED /
          CLOSEOUT_REQUESTED / CLOSED projects of (federal_share_obligated_cents
          - deobligated_cents)`: obligating 3420000 and then finalizing a
          deobligation of exactly 3420000 must return that sum, and
          Disaster.total_obligated_cents, to 0 with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4927 (TX / FLOOD) DECLARED, applicant ELIGIBLE, facility ELIGIBLE."
            - "Project cost-reviewed VALIDATE on a reviewed basis of 3800000 cents with mitigation_approved_cents 760000, then OBLIGATED at 3420000 cents by GrantsOfficer 'officer-1'."
            - "Applicant.total_obligated_cents == 3420000 and Disaster.total_obligated_cents == 3420000 before the compensating pair runs."
