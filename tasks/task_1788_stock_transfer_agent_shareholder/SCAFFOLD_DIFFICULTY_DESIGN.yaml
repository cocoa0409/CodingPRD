  - rule_id: boundary_precision_check
    instances:
      - name: medallion_coverage_boundary_inclusive
        grounds:
          - calculations.indemnity_bond_premium
          - validations[priority=10]
          - entities.TransferRequest.fields.transfer_value_cents
        distinguishing_aspect: |
          Boundary on a money metric at the submit-medallion endpoint: coverage_cents >=
          transfer_value_cents is INCLUSIVE — coverage exactly equal to the 500000-cent transfer
          value is accepted, one cent short is rejected with ERR_MEDALLION_COVERAGE_INSUFFICIENT.
        test_recipe:
          setup:
            - "Issuer outstanding 200, price 5000; accounts A (200 book) and B"
            - "Two transfers t1 and t2 of 100 shares each (value 500000 cents each); account version advances to 2 after t1 creation"
          setup_api_calls:
