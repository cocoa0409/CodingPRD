  # ===========================================================================
  # Section: state_machines (claim-extraction-guide Table 2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: customer_close_blocked_by_open_run_and_pending_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CustomerAccount.ACTIVE_to_CLOSED
          - errors[ERR_CUSTOMER_STATE_INVALID]
        distinguishing_aspect: |
          Close is refused while any ProductionRun is non-terminal (a QUOTED
          run suffices), and close from PENDING_CREDIT is refused outright;
          after the run is cancelled the same close succeeds.
        test_recipe:
          setup:
            - "Customer C1 ACTIVE with a QUOTED run; customer C2 still PENDING_CREDIT"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "CloseOne", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "CS-1", name: "Close Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /v1/customer-accounts", payload: { name: "CloseTwo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust2_id: $.data.id } }
          trigger:
            - { call: "POST /v1/customer-accounts/${cust_id}/close", payload: {}, as: FinanceClerk, captures: { err_open: $.data.error_id } }
            - { call: "POST /v1/customer-accounts/${cust2_id}/close", payload: {}, as: FinanceClerk, captures: { err_pend: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/cancel", payload: {}, as: ProductionPlanner }
            - { call: "POST /v1/customer-accounts/${cust_id}/close", payload: {}, as: FinanceClerk, captures: { end_status: $.data.status } }
          assert:
            - "err_open == ERR_CUSTOMER_STATE_INVALID, HTTP 409 (QUOTED run blocks close)"
            - "err_pend == ERR_CUSTOMER_STATE_INVALID, HTTP 409 (PENDING_CREDIT is not a closeable state)"
            - "After run cancel: end_status == CLOSED"

