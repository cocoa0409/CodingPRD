scenario: "2239. Long-Term Disaster Recovery Group & Unmet Needs (community long-term recovery organization): survivor intake and case management with damage documentation and assistance received from other sources, unmet needs determination after insurance, federal assistance and other resources are exhausted, case presentation to an unmet needs table with member organization funding commitments, construction management for repair and rebuild projects with volunteer labor and donated materials, volunteer group hosting with housing, tools and skill matching to project needs, duplication of benefits verification before disbursing assistance, funding assembly from donations, foundations and grants with restricted use tracking, case closure criteria and long-term follow-up with survivors"

domain_name: long-term-disaster-recovery-group
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Recovery cases, table sessions, member organizations, funding sources,
  # volunteer groups and lodging sites are peer aggregates wired together by
  # junction entities (CasePresentation, FundingCommitment, VolunteerDeployment,
  # HousingAssignment) plus a self-referential ConstructionProject phase chain.

  state_machine_shape: cyclic
  # RecoveryCase carries TWO independent state dimensions (case_status ×
  # funding_status). CasePresentation cycles DELIBERATING -> DEFERRED -> QUEUED
  # with a MAX_DEFERRALS termination guard. Disbursement forks
  # REQUESTED -> {DOB_CLEARED, DOB_FLAGGED} and cycles DOB_FLAGGED -> REQUESTED.
  # ConstructionProject cycles IN_PROGRESS -> SUSPENDED -> IN_PROGRESS.

  relationship_patterns:
    - one_to_many          # Survivor -> RecoveryCase -> DamageItem/AssistanceRecord
    - many_to_many         # CasePresentation, FundingCommitment, VolunteerDeployment, HousingAssignment
    - self_referential     # ConstructionProject.predecessor_project_id -> ConstructionProject.id
    - cross_aggregate      # Disbursement spans RecoveryCase, FundingSource, ConstructionProject, FundingCommitment

  role_model: segregation_of_duties
  # The case manager who prepares a case may not chair its award decision;
  # the disbursement officer who requests a payment may not approve it;
  # the construction manager who verifies damage costs is not the case manager.

  consistency_model: immediate

difficulty_level: expert_plus
# 17 entities / 65 endpoints / 62 error codes / 8 calculations (2 dual-variant)
# / 8 state-machine blocks over 7 entities / 2 OCC rules / 8 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Survivor
    parent: null
    common_fields: true
    fields:
      - name: household_name
        type: string
        source: input
        description: "Household surname or label used at intake"
      - name: primary_contact_phone
        type: string
        source: input
        description: "Primary voice contact for follow-up"
      - name: household_size
        type: integer
        source: input
        description: "Number of persons in the household at time of disaster"
        constraints: ">= 1"
      - name: income_band
        type: enum
        source: input
        description: "HUD-style income band used in the priority score"
        constraints: "one of ELI, VLI, LOW, MODERATE, ABOVE"
      - name: head_of_household_age
        type: integer
        source: input
        description: "Age in years of the head of household"
        constraints: ">= 18"
      - name: has_member_with_disability
        type: boolean
        source: input
        description: "True when at least one household member has a documented disability"
        default: false
      - name: is_uninsured
        type: boolean
        source: input
        description: "True when the household carried no property insurance at time of disaster"
        default: false
      - name: consent_on_file
        type: boolean
        source: input
        description: "Signed release allowing the LTRG to share the case at the unmet needs table"
        default: false
      - name: follow_up_opt_in
        type: boolean
        source: input
        description: "Survivor consents to long-term follow-up contacts after closure"
        default: true
      - name: priority_score
        type: integer
        source: computed
        description: "Vulnerability priority score 0-100 per calculations.survivor_priority_score"
        constraints: "0..100"
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of RecoveryCase rows for this survivor with case_status NOT IN {CLOSED, INACTIVE}"

  - name: RecoveryCase
    parent: Survivor
    common_fields: true
    fields:
      - name: survivor_id
        type: string
        source: input
        description: "FK -> Survivor.id; the household this case serves"
      - name: disaster_code
        type: string
        source: input
        description: "Federal or state declaration code (e.g. DR-4801) this case is opened under"
      - name: assigned_case_manager_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the CaseManager who owns this case; used by segregation-of-duties checks"
      - name: primary_residence_status
        type: enum
        source: input
        description: "Tenure of the damaged dwelling"
        constraints: "one of OWNER_OCCUPIED, RENTER, MOBILE_HOME, OTHER"
      - name: temporary_housing_need_cents
        type: integer
        source: input
        description: "Documented temporary-housing need; the sole source of the TEMPORARY_HOUSING bucket need"
        default: 0
        constraints: ">= 0"
      - name: case_status
        type: enum
        source: system
        description: "Case lifecycle dimension; see state_machines.RecoveryCase (state_field case_status)"
        default: INTAKE
        constraints: "one of INTAKE, ASSESSED, PRESENTED, ACTIVE_RECOVERY, CLOSURE_PENDING, CLOSED, INACTIVE"
      - name: funding_status
        type: enum
        source: system
        description: "Independent funding dimension; see state_machines.RecoveryCase (state_field funding_status)"
        default: UNFUNDED
        constraints: "one of UNFUNDED, PARTIALLY_COMMITTED, FULLY_COMMITTED, DISBURSING, SATISFIED"
      - name: verified_damage_total_cents
        type: integer
        source: computed
        description: "Sum of capped verified damage per calculations.verified_damage_total"
        default: 0
      - name: reference_unmet_cents
        type: integer
        source: computed
        description: "unmet_need_total_cents of the assessment pinned on the most recently AWARDED CasePresentation for this case (decided_at DESC, tie-break created_at ASC); 0 when no AWARDED presentation exists"
        default: 0
      - name: total_committed_cents
        type: integer
        source: computed
        description: "Sum of FundingCommitment.pledged_cents with status IN {CONFIRMED, DISBURSED} across this case's presentations, plus the sum of CasePresentation.bridge_authorized_cents over presentations with status AWARDED"
        default: 0
      - name: total_net_disbursed_cents
        type: integer
        source: computed
        description: "Sum of Disbursement.net_cents for this case with status IN {PAID}"
        default: 0
      - name: residual_unmet_cents
        type: integer
        source: computed
        description: "max(0, reference_unmet_cents - total_committed_cents)"
        default: 0
      - name: closure_waiver_reason
        type: string
        source: input
        description: "Written justification permitting closure with residual_unmet_cents > 0; null when not waived"
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times this case has moved CLOSED -> ACTIVE_RECOVERY"
        default: 0
      - name: withdrawn_reason
        type: string
        source: input
        description: "Reason recorded when the case moves to INACTIVE"
        default: null

  - name: DamageItem
    parent: RecoveryCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case this documented damage belongs to"
      - name: category
        type: enum
        source: input
        description: "Damage category; drives CATEGORY_CAP_CENTS and BUCKET_OF_CATEGORY"
        constraints: "one of STRUCTURE, ROOF, HVAC, PLUMBING, ELECTRICAL, CONTENTS, ACCESSIBILITY"
      - name: item_description
        type: string
        source: input
        description: "Free-text description of the documented damage"
      - name: documented_cost_cents
        type: integer
        source: input
        description: "Cost as documented by the case manager before inspection"
        constraints: ">= 0"
      - name: photo_count
        type: integer
        source: input
        description: "Number of photographs attached as documentation"
        default: 0
      - name: is_habitability_critical
        type: boolean
        source: input
        description: "True when this damage makes the dwelling uninhabitable"
        default: false
      - name: verification_status
        type: enum
        source: system
        description: "Inspection outcome; only VERIFIED rows enter need calculations"
        default: UNVERIFIED
        constraints: "one of UNVERIFIED, VERIFIED, REJECTED"
      - name: verified_cost_cents
        type: integer
        source: system
        description: "Cost confirmed by the ConstructionManager inspection; null until verification_status leaves UNVERIFIED"
        default: null
      - name: capped_cost_cents
        type: integer
        source: computed
        description: "min(verified_cost_cents, CATEGORY_CAP_CENTS[category]) when verification_status == VERIFIED, else 0"
        default: 0
      - name: purpose_bucket
        type: enum
        source: computed
        description: "BUCKET_OF_CATEGORY[category]; one of STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD"
      - name: verified_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ConstructionManager who recorded the verification; null while UNVERIFIED"
        default: null

  - name: AssistanceRecord
    parent: RecoveryCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case that received this outside assistance"
      - name: source_type
        type: enum
        source: input
        description: "Where the assistance came from"
        constraints: "one of INSURANCE_SETTLEMENT, FEMA_IA, SBA_LOAN, NONPROFIT_GRANT, STATE_PROGRAM, CROWDFUNDING, OTHER"
      - name: purpose_code
        type: enum
        source: input
        description: "Bucket the award was earmarked for"
        constraints: "one of STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD, TEMPORARY_HOUSING"
      - name: awarded_cents
        type: integer
        source: input
        description: "Amount awarded by the outside source"
        constraints: ">= 0"
      - name: received_on
        type: datetime
        source: input
        description: "ISO 8601 date the award was received (YYYY-MM-DD)"
      - name: documentation_status
        type: enum
        source: input
        description: "DOCUMENTED rows offset unmet need; DOCUMENTED and DISPUTED rows both enter the duplication-of-benefits pool"
        default: UNDOCUMENTED
        constraints: "one of UNDOCUMENTED, DOCUMENTED, DISPUTED"
      - name: is_excluded_from_dob
        type: boolean
        source: system
        description: "Set true by POST /disbursements/{id}/dob-resolution; excluded rows leave the duplication-of-benefits pool but never affect unmet-need offsets"
        default: false
      - name: exclusion_note
        type: string
        source: system
        description: "Justification recorded when is_excluded_from_dob was set true"
        default: null

  - name: UnmetNeedAssessment
    parent: RecoveryCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case this immutable determination snapshot belongs to"
      - name: variant
        type: enum
        source: input
        description: "Which unmet-need algorithm produced this snapshot"
        constraints: "one of PURPOSE_MATCHED, POOLED"
      - name: verified_damage_total_cents
        type: integer
        source: computed
        description: "Snapshot of RecoveryCase.verified_damage_total_cents at determination time; used for the staleness gate"
      - name: total_documented_assistance_cents
        type: integer
        source: computed
        description: "Sum of AssistanceRecord.awarded_cents for the case with documentation_status == DOCUMENTED"
      - name: bucket_need_cents
        type: object
        source: computed
        description: "Per-bucket need map keyed by STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD, TEMPORARY_HOUSING"
      - name: bucket_offset_cents
        type: object
        source: computed
        description: "Per-bucket DOCUMENTED assistance offset map, same four keys"
      - name: unmet_need_total_cents
        type: integer
        source: computed
        description: "Determination result per calculations.unmet_need_determination for this variant"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CaseManager who ran the determination"

  - name: MemberOrganization
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: "Legal name of the member organization seated at the unmet needs table"
      - name: org_type
        type: enum
        source: input
        description: "Category of member organization"
        constraints: "one of FAITH_BASED, NONPROFIT, GOVERNMENT, CIVIC_CLUB, FOUNDATION"
      - name: contact_email
        type: string
        source: input
        description: "Delegate contact address"
      - name: annual_pledge_cap_cents
        type: integer
        source: input
        description: "Ceiling on the sum of live pledges this organization may carry"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE orgs may pledge; CAPPED is auto-derived on EVERY capacity recompute (pledge creation, confirmation, rescission, disbursement) whenever remaining_pledge_capacity_cents reaches 0, and reverts to ACTIVE the moment capacity is restored; SUSPENDED/WITHDRAWN are set only by LTRGAdmin"
        default: ACTIVE
        constraints: "one of ACTIVE, CAPPED, SUSPENDED, WITHDRAWN"
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of FundingCommitment.pledged_cents for this org with status IN {PLEDGED, CONFIRMED}"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Sum of FundingCommitment.pledged_cents for this org with status == DISBURSED"
        default: 0
      - name: remaining_pledge_capacity_cents
        type: integer
        source: computed
        description: "annual_pledge_cap_cents - (committed_cents + disbursed_cents); the conserved quantity of pledge-capacity invariant"
        default: 0
      - name: suspension_reason
        type: string
        source: input
        description: "Reason recorded when status was set to SUSPENDED or WITHDRAWN"
        default: null

  - name: TableSession
    parent: null
    common_fields: true
    fields:
      - name: session_label
        type: string
        source: input
        description: "Human label for the unmet needs table meeting"
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO 8601 date the table meets (YYYY-MM-DD)"
      - name: quorum_min_member_orgs
        type: integer
        source: input
        description: "Minimum number of attending member organizations required to open the session"
        default: 3
        constraints: ">= 1"
      - name: attending_member_org_ids
        type: array
        source: system
        description: "MemberOrganization ids recorded at POST /table-sessions/{id}/open; only these orgs may pledge in this session"
        default: []
      - name: status
        type: enum
        source: system
        description: "Session lifecycle; see state_machines.TableSession"
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_SESSION, ADJOURNED, CANCELLED"
      - name: chaired_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the UnmetNeedsChair who opened the session"
        default: null
      - name: awarded_total_cents
        type: integer
        source: computed
        description: "Sum of CasePresentation.awarded_cents for presentations in this session with status == AWARDED"
        default: 0
      - name: queued_count
        type: integer
        source: computed
        description: "Count of CasePresentation rows in this session with status == QUEUED"
        default: 0

  - name: CasePresentation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case being presented"
      - name: session_id
        type: string
        source: input
        description: "FK -> TableSession.id; the table meeting this presentation is queued into"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> UnmetNeedAssessment.id; the determination snapshot pinned to this presentation"
      - name: prepared_by_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the preparing CaseManager; must equal RecoveryCase.assigned_case_manager_user_id"
      - name: narrative
        type: string
        source: input
        description: "Case narrative read to the table"
      - name: status
        type: enum
        source: system
        description: "Presentation lifecycle; see state_machines.CasePresentation"
        default: QUEUED
        constraints: "one of QUEUED, PRESENTING, DELIBERATING, AWARDED, DEFERRED, DENIED"
      - name: queue_position
        type: integer
        source: computed
        description: "1-based rank among status == QUEUED presentations of the same session ordered by priority_score_snapshot DESC, then pinned assessment unmet_need_total_cents DESC, then created_at ASC; 0 when status != QUEUED"
        default: 0
      - name: priority_score_snapshot
        type: integer
        source: computed
        description: "Survivor.priority_score copied at presentation creation; frozen thereafter"
      - name: pledged_total_cents
        type: integer
        source: computed
        description: "Sum of FundingCommitment.pledged_cents on this presentation with status IN {PLEDGED, CONFIRMED, DISBURSED}"
        default: 0
      - name: bridge_tier
        type: enum
        source: system
        description: "Bridge tier selected at AWARD from the pinned assessment's unmet_need_total_cents"
        default: null
        constraints: "one of TIER_A, TIER_B, TIER_C, or null before a decision"
      - name: bridge_authorized_cents
        type: integer
        source: system
        description: "Chair bridge authorization computed at AWARD per calculations.table_award_assembly"
        default: 0
      - name: awarded_cents
        type: integer
        source: system
        description: "pledged_total_cents at decision time plus bridge_authorized_cents; recomputed downward when a CONFIRMED commitment is rescinded"
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: "max(0, pinned assessment unmet_need_total_cents - awarded_cents)"
        default: 0
      - name: deferral_count
        type: integer
        source: system
        description: "Number of times this presentation has entered DEFERRED; the DEFER branch is refused once this reaches MAX_DEFERRALS (3), which is what terminates the deferral cycle"
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the AWARD/DEFER/DENY decision; null before"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the UnmetNeedsChair who decided"
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Chair note recorded with the decision"
        default: null

  - name: FundingCommitment
    parent: null
    common_fields: true
    fields:
      - name: presentation_id
        type: string
        source: input
        description: "FK -> CasePresentation.id; the presentation this pledge answers"
      - name: member_org_id
        type: string
        source: input
        description: "FK -> MemberOrganization.id; the pledging organization"
      - name: pledged_cents
        type: integer
        source: input
        description: "Amount pledged at the table"
        constraints: "> 0"
      - name: purpose_code
        type: enum
        source: input
        description: "Bucket the pledge is earmarked for"
        constraints: "one of STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD, TEMPORARY_HOUSING"
      - name: status
        type: enum
        source: system
        description: "Commitment lifecycle; see state_machines.FundingCommitment"
        default: PLEDGED
        constraints: "one of PLEDGED, CONFIRMED, DISBURSED, RESCINDED"
      - name: pledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MemberOrgDelegate who pledged; equals member_org_id by role identity"
      - name: rescission_reason
        type: string
        source: input
        description: "Reason recorded when the pledge was rescinded"
        default: null

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Name of the donation, foundation grant, government grant or in-kind lot"
      - name: source_type
        type: enum
        source: input
        description: "Kind of funding assembled"
        constraints: "one of INDIVIDUAL_DONATION, FOUNDATION_GRANT, GOVERNMENT_GRANT, IN_KIND_MATERIAL, MEMBER_ORG_TRANSFER"
      - name: restriction_code
        type: enum
        source: input
        description: "Donor-imposed restricted use"
        constraints: "one of UNRESTRICTED, STRUCTURE_REPAIR_ONLY, CONTENTS_ONLY, ACCESSIBILITY_ONLY, TEMPORARY_HOUSING_ONLY, MATERIALS_ONLY"
      - name: eligible_purpose_codes
        type: array
        source: computed
        description: "ELIGIBLE_PURPOSES_BY_RESTRICTION[restriction_code]"
      - name: restriction_specificity
        type: integer
        source: computed
        description: "0 when restriction_code == UNRESTRICTED, else 1; primary sort key of the waterfall"
      - name: total_cents
        type: integer
        source: input
        description: "Face amount of the source"
        constraints: ">= 0"
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) after which the source may no longer be drawn; null means no expiry"
        default: null
      - name: admin_retention_allowed
        type: boolean
        source: input
        description: "True when the donor permits the ADMIN_RETENTION_BPS administrative retention on each drawn line"
        default: true
      - name: committed_cents
        type: integer
        source: computed
        description: "Gross allocated to APPROVED (not yet PAID) disbursements"
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: "Net paid out to survivors from this source"
        default: 0
      - name: admin_retained_cents
        type: integer
        source: computed
        description: "Administrative retention actually kept from PAID lines drawn on this source"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "total_cents - committed_cents - disbursed_cents - admin_retained_cents; the conserved quantity of the restricted-fund invariant"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN while available_cents > 0 and unexpired; EXHAUSTED when available_cents == 0; EXPIRED when the logical clock passes expires_on"
        default: OPEN
        constraints: "one of OPEN, EXHAUSTED, EXPIRED"

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case being paid on behalf of"
      - name: project_id
        type: string
        source: input
        description: "FK -> ConstructionProject.id; required when purpose_code == STRUCTURE_REPAIR, else null"
        default: null
      - name: commitment_id
        type: string
        source: input
        description: "FK -> FundingCommitment.id; the member-org pledge this payment retires, or null for a bridge-funded payment"
        default: null
      - name: purpose_code
        type: enum
        source: input
        description: "Bucket the payment is applied to"
        constraints: "one of STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD, TEMPORARY_HOUSING"
      - name: requested_cents
        type: integer
        source: input
        description: "NET amount that must reach the survivor or vendor; administrative retention is added on top per drawn line"
        constraints: "> 0"
      - name: payee_name
        type: string
        source: input
        description: "Vendor or survivor the check is written to"
      - name: status
        type: enum
        source: system
        description: "Disbursement lifecycle; see state_machines.Disbursement"
        default: REQUESTED
        constraints: "one of REQUESTED, DOB_CLEARED, DOB_FLAGGED, APPROVED, PAID, REVERSED, VOIDED"
      - name: dob_pool_cents
        type: integer
        source: computed
        description: "Cross-case duplication-of-benefits pool for this purpose_code per calculations.dob_exposure_check"
        default: 0
      - name: dob_exposure_cents
        type: integer
        source: computed
        description: "Duplication-of-benefits exposure for this payment; > 0 forces DOB_FLAGGED"
        default: 0
      - name: allocation_lines
        type: array
        source: computed
        description: "Waterfall result: ordered objects { funding_source_id, net_cents, retention_cents, gross_cents } set at APPROVED"
        default: []
      - name: net_cents
        type: integer
        source: system
        description: "Sum of allocation_lines[].net_cents; equals requested_cents once APPROVED"
        default: 0
      - name: admin_retained_cents
        type: integer
        source: system
        description: "Sum of allocation_lines[].retention_cents, each rounded per line before summing"
        default: 0
      - name: gross_cents
        type: integer
        source: system
        description: "net_cents + admin_retained_cents"
        default: 0
      - name: requested_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the DisbursementOfficer who created the request"
      - name: approved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the LTRGAdmin who approved; must differ from requested_by_user_id"
        default: null
      - name: dob_resolution_note
        type: string
        source: input
        description: "Justification recorded when a DOB_FLAGGED request was re-driven to REQUESTED"
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded when a PAID disbursement was reversed"
        default: null

  - name: ConstructionProject
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case whose dwelling is repaired or rebuilt"
      - name: predecessor_project_id
        type: string
        source: input
        description: "FK -> ConstructionProject.id; the phase that must reach CLOSED_OUT before this one may be permitted; null for a first phase"
        default: null
      - name: scope_code
        type: enum
        source: input
        description: "Work scope of this phase"
        constraints: "one of ROOF_REPLACEMENT, STRUCTURE_REBUILD, INTERIOR_REPAIR, ACCESSIBILITY_RAMP, MECHANICAL_REPAIR"
      - name: required_trade_hours
        type: object
        source: input
        description: "Map of trade code to required labour hours; keys drawn from FRAMING, ROOFING, DRYWALL, ELECTRICAL, PLUMBING, PAINTING, GENERAL_LABOR"
      - name: critical_trades
        type: array
        source: input
        description: "Subset of required_trade_hours keys weighted CRITICAL_TRADE_WEIGHT in the skill-fit score"
        default: []
      - name: estimated_material_cents
        type: integer
        source: input
        description: "Estimated material cost for the phase"
        constraints: ">= 0"
      - name: permit_number
        type: string
        source: input
        description: "Building permit number recorded at the PERMIT transition"
        default: null
      - name: status
        type: enum
        source: system
        description: "Project lifecycle; see state_machines.ConstructionProject"
        default: SCOPED
        constraints: "one of SCOPED, PERMITTED, IN_PROGRESS, SUSPENDED, PUNCHLIST, CLOSED_OUT, CANCELLED"
      - name: suspension_reason
        type: string
        source: input
        description: "Reason recorded at the SUSPEND transition"
        default: null
      - name: volunteer_hours_logged
        type: integer
        source: system
        description: "Cumulative VolunteerDeployment.hours_logged over deployments with status == COMPLETED"
        default: 0
      - name: confirmed_deployment_count
        type: integer
        source: computed
        description: "Count of VolunteerDeployment rows on this project with status IN {REQUESTED, CONFIRMED}"
        default: 0

  - name: VolunteerGroup
    parent: null
    common_fields: true
    fields:
      - name: group_name
        type: string
        source: input
        description: "Name of the visiting volunteer group"
      - name: home_organization
        type: string
        source: input
        description: "Sending congregation, employer or club"
      - name: member_count
        type: integer
        source: input
        description: "Number of volunteers travelling; also the number of beds the group needs"
        constraints: ">= 1"
      - name: skill_profile
        type: object
        source: input
        description: "Map of trade code to count of qualified members; keys drawn from the same trade vocabulary as ConstructionProject.required_trade_hours"
      - name: requires_housing
        type: boolean
        source: input
        description: "True when the group must be hosted at a LodgingSite"
        default: true
      - name: brings_own_tools
        type: boolean
        source: input
        description: "True when the group supplies its own tools"
        default: false
      - name: active_deployment_count
        type: integer
        source: computed
        description: "Count of VolunteerDeployment rows for this group with status IN {REQUESTED, CONFIRMED}"
        default: 0

  - name: VolunteerDeployment
    parent: null
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: "FK -> VolunteerGroup.id; the group being deployed"
      - name: project_id
        type: string
        source: input
        description: "FK -> ConstructionProject.id; the project the group works"
      - name: arrival_date
        type: datetime
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the crew starts work; interval is CLOSED on this end"
      - name: departure_date
        type: datetime
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) the crew finishes work; interval is CLOSED on this end"
      - name: day_count
        type: integer
        source: computed
        description: "Inclusive day count departure_date - arrival_date + 1"
      - name: crew_hours_committed
        type: integer
        source: computed
        description: "VolunteerGroup.member_count * VOLUNTEER_HOURS_PER_DAY * day_count"
      - name: skill_fit_score_bps
        type: integer
        source: computed
        description: "COVERAGE_WEIGHTED score in basis points per calculations.volunteer_skill_fit_score"
      - name: status
        type: enum
        source: system
        description: "Deployment lifecycle; see state_machines.VolunteerDeployment"
        default: REQUESTED
        constraints: "one of REQUESTED, CONFIRMED, CANCELLED, COMPLETED"
      - name: hours_logged
        type: integer
        source: input
        description: "Actual volunteer hours reported at the COMPLETE transition"
        default: 0
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded at the CANCEL transition, including cascaded cancellations"
        default: null

  - name: LodgingSite
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: "Name of the host church, camp or bunkhouse"
      - name: bed_capacity
        type: integer
        source: input
        description: "Beds available on any single night"
        constraints: ">= 1"
      - name: has_showers
        type: boolean
        source: input
        description: "True when on-site showers are available"
        default: false
      - name: nightly_cost_cents
        type: integer
        source: input
        description: "Cost per bed-night charged to the LTRG"
        default: 0
      - name: peak_committed_beds
        type: integer
        source: computed
        description: "Maximum over every night covered by any HousingAssignment with status == ACTIVE on this site of the summed beds_requested"
        default: 0
      - name: available_beds
        type: integer
        source: computed
        description: "bed_capacity - peak_committed_beds; the beds still free on the site's worst night, never negative"
        default: 0
      - name: status
        type: enum
        source: system
        description: "FULL when peak_committed_beds >= bed_capacity, else OPEN"
        default: OPEN
        constraints: "one of OPEN, FULL"

  - name: HousingAssignment
    parent: null
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        description: "FK -> VolunteerGroup.id; the group being hosted"
      - name: lodging_site_id
        type: string
        source: input
        description: "FK -> LodgingSite.id; the host site"
      - name: check_in_date
        type: datetime
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); interval is HALF-OPEN [check_in_date, check_out_date)"
      - name: check_out_date
        type: datetime
        source: input
        description: "ISO 8601 date (YYYY-MM-DD); the night of check_out_date is NOT occupied"
      - name: beds_requested
        type: integer
        source: computed
        description: "Copy of VolunteerGroup.member_count at assignment creation"
      - name: night_count
        type: integer
        source: computed
        description: "check_out_date - check_in_date in days (half-open night count)"
      - name: status
        type: enum
        source: system
        description: "ACTIVE assignments occupy beds; RELEASED assignments free them"
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock timestamp written when status moves ACTIVE -> RELEASED; null while ACTIVE"
        default: null
      - name: release_reason
        type: string
        source: input
        description: "Reason recorded at release, including cascaded releases"
        default: null

  - name: FollowUpContact
    parent: RecoveryCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> RecoveryCase.id; the case the contact was logged against"
      - name: contact_type
        type: enum
        source: input
        description: "Which long-term follow-up touchpoint this record is"
        constraints: "one of CHECK_IN_30_DAY, CHECK_IN_90_DAY, CLOSURE_REVIEW, ANNIVERSARY, REFERRAL"
      - name: contacted_on
        type: datetime
        source: input
        description: "ISO 8601 date (YYYY-MM-DD) of the contact"
      - name: outcome
        type: enum
        source: input
        description: "Result of the contact attempt"
        constraints: "one of REACHED, NO_ANSWER, DECLINED, NEEDS_REOPENED"
      - name: notes
        type: string
        source: input
        description: "Free-text notes from the contact"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CaseManager who logged the contact"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # ---- RecoveryCase: PARALLEL DIMENSION 1 of 2 -----------------------------
  - entity: RecoveryCase
    state_field: case_status
    initial_state: INTAKE
    terminal_states: [INACTIVE]
    note: |
      Dimension 1 of two independent state axes on the same row. case_status
      tracks the casework lifecycle; funding_status (below) tracks the money.
      The two axes advance independently: a case can be ACTIVE_RECOVERY while
      funding_status is still PARTIALLY_COMMITTED, and funding_status can move
      FULLY_COMMITTED -> DISBURSING without any case_status change. CLOSED is
      NOT terminal because POST /recovery-cases/{id}/reopen cycles back.
    transitions:
      - from: INTAKE
        to: ASSESSED
        trigger: "POST /recovery-cases/{id}/assessments (first successful determination)"
        actor: CaseManager
        preconditions:
          - "case_status == INTAKE"
          - "at least one DamageItem on the case with verification_status == VERIFIED"
        side_effects:
          - "creates the UnmetNeedAssessment snapshot with unmet_need_total_cents from calculations.unmet_need_determination"
          - "sets RecoveryCase.case_status = ASSESSED"
          - "increments RecoveryCase.version by 1"
      - from: ASSESSED
        to: PRESENTED
        trigger: "POST /case-presentations"
        actor: CaseManager
        preconditions:
          - "case_status IN {ASSESSED, PRESENTED}"
          - "no other CasePresentation for this case with status IN {QUEUED, PRESENTING, DELIBERATING}"
          - "pinned assessment.variant == PURPOSE_MATCHED"
          - "pinned assessment.verified_damage_total_cents == case.verified_damage_total_cents"
        side_effects:
          - "creates CasePresentation in QUEUED with priority_score_snapshot copied from Survivor.priority_score"
          - "recomputes queue_position for every QUEUED presentation in the target session"
          - "sets RecoveryCase.case_status = PRESENTED"
          - "increments RecoveryCase.version by 1"
      - from: PRESENTED
        to: ACTIVE_RECOVERY
        trigger: "system: CasePresentation DELIBERATING -> AWARDED"
        actor: system
        preconditions:
          - "case_status == PRESENTED"
        side_effects:
          - "sets RecoveryCase.reference_unmet_cents = pinned assessment.unmet_need_total_cents"
          - "recomputes RecoveryCase.total_committed_cents and residual_unmet_cents"
          - "recomputes RecoveryCase.funding_status per calculations.case_funding_status_derivation"
          - "increments RecoveryCase.version by 1"
      - from: PRESENTED
        to: ASSESSED
        trigger: "system: CasePresentation DELIBERATING -> DENIED, or DEFERRED presentation reaching deferral_count == MAX_DEFERRALS"
        actor: system
        preconditions:
          - "case_status == PRESENTED"
          - "no remaining CasePresentation for this case with status IN {QUEUED, PRESENTING, DELIBERATING}"
        side_effects:
          - "sets RecoveryCase.case_status = ASSESSED so the case may be re-presented"
          - "increments RecoveryCase.version by 1"
      - from: ACTIVE_RECOVERY
        to: CLOSURE_PENDING
        trigger: "POST /recovery-cases/{id}/closure-review"
        actor: CaseManager
        preconditions:
          - "case_status == ACTIVE_RECOVERY"
          - "funding_status == SATISFIED"
          - "every ConstructionProject on the case has status IN {CLOSED_OUT, CANCELLED}"
          - "at least one FollowUpContact exists on the case"
        side_effects:
          - "sets RecoveryCase.case_status = CLOSURE_PENDING"
          - "increments RecoveryCase.version by 1"
      - from: CLOSURE_PENDING
        to: CLOSED
        trigger: "POST /recovery-cases/{id}/close"
        actor: LTRGAdmin
        preconditions:
          - "case_status == CLOSURE_PENDING"
          - "residual_unmet_cents == 0 OR closure_waiver_reason is a non-empty string in the request"
          - "at least one FollowUpContact on the case with contact_type == CLOSURE_REVIEW"
        side_effects:
          - "sets RecoveryCase.case_status = CLOSED"
          - "decrements Survivor.open_case_count"
          - "increments RecoveryCase.version by 1"
      - from: CLOSED
        to: ACTIVE_RECOVERY
        trigger: "POST /recovery-cases/{id}/reopen"
        actor: LTRGAdmin
        preconditions:
          - "case_status == CLOSED"
        side_effects:
          - "sets RecoveryCase.case_status = ACTIVE_RECOVERY"
          - "increments RecoveryCase.reopen_count by 1"
          - "increments Survivor.open_case_count"
          - "increments RecoveryCase.version by 1"
        note: "Cycle: CLOSED -> ACTIVE_RECOVERY -> CLOSURE_PENDING -> CLOSED may repeat without bound."
      - from: CLOSURE_PENDING
        to: ACTIVE_RECOVERY
        trigger: "system: Disbursement PAID -> REVERSED, or FundingCommitment CONFIRMED -> RESCINDED"
        actor: system
        preconditions:
          - "case_status == CLOSURE_PENDING"
        side_effects:
          - "sets RecoveryCase.case_status = ACTIVE_RECOVERY because the closure precondition funding_status == SATISFIED no longer holds"
          - "increments RecoveryCase.version by 1"
      - from: INTAKE
        to: INACTIVE
        trigger: "POST /recovery-cases/{id}/reopen is NOT the path; INACTIVE is reached by POST /recovery-cases/{id}/close with withdrawn_reason on an un-presented case"
        actor: LTRGAdmin
        preconditions:
          - "case_status IN {INTAKE, ASSESSED}"
          - "request supplies a non-empty withdrawn_reason"
          - "case has no CasePresentation with status IN {QUEUED, PRESENTING, DELIBERATING, AWARDED}"
        side_effects:
          - "sets RecoveryCase.case_status = INACTIVE and RecoveryCase.withdrawn_reason"
          - "decrements Survivor.open_case_count"
          - "excludes the case from every cross-case duplication-of-benefits pool"
          - "increments RecoveryCase.version by 1"
      - from: ASSESSED
        to: INACTIVE
        trigger: "POST /recovery-cases/{id}/close with withdrawn_reason"
        actor: LTRGAdmin
        preconditions:
          - "case_status == ASSESSED"
          - "request supplies a non-empty withdrawn_reason"
        side_effects:
          - "sets RecoveryCase.case_status = INACTIVE and RecoveryCase.withdrawn_reason"
          - "decrements Survivor.open_case_count"
          - "increments RecoveryCase.version by 1"

  # ---- RecoveryCase: PARALLEL DIMENSION 2 of 2 -----------------------------
  - entity: RecoveryCase
    state_field: funding_status
    initial_state: UNFUNDED
    terminal_states: []
    note: |
      Dimension 2 of two independent state axes on the same row. Every
      transition here is a system recompute driven by
      calculations.case_funding_status_derivation, whose five clauses are
      evaluated strictly top-down. No actor triggers this axis directly and no
      case_status value gates it.
    transitions:
      - from: UNFUNDED
        to: PARTIALLY_COMMITTED
        trigger: "system: recompute after CasePresentation DELIBERATING -> AWARDED when total_committed_cents < reference_unmet_cents"
        actor: system
        preconditions:
          - "total_committed_cents > 0"
          - "total_net_disbursed_cents == 0"
          - "total_committed_cents < reference_unmet_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = PARTIALLY_COMMITTED"
      - from: UNFUNDED
        to: FULLY_COMMITTED
        trigger: "system: recompute after CasePresentation DELIBERATING -> AWARDED when total_committed_cents >= reference_unmet_cents"
        actor: system
        preconditions:
          - "total_committed_cents > 0"
          - "total_net_disbursed_cents == 0"
          - "total_committed_cents >= reference_unmet_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = FULLY_COMMITTED"
      - from: PARTIALLY_COMMITTED
        to: DISBURSING
        trigger: "system: recompute after Disbursement APPROVED -> PAID"
        actor: system
        preconditions:
          - "0 < total_net_disbursed_cents < total_committed_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = DISBURSING"
      - from: FULLY_COMMITTED
        to: DISBURSING
        trigger: "system: recompute after Disbursement APPROVED -> PAID"
        actor: system
        preconditions:
          - "0 < total_net_disbursed_cents < total_committed_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = DISBURSING"
      - from: FULLY_COMMITTED
        to: SATISFIED
        trigger: "system: recompute after Disbursement APPROVED -> PAID"
        actor: system
        preconditions:
          - "total_committed_cents > 0"
          - "total_net_disbursed_cents >= total_committed_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = SATISFIED"
      - from: DISBURSING
        to: SATISFIED
        trigger: "system: recompute after Disbursement APPROVED -> PAID"
        actor: system
        preconditions:
          - "total_net_disbursed_cents >= total_committed_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = SATISFIED"
      - from: SATISFIED
        to: FULLY_COMMITTED
        trigger: "system: recompute after Disbursement PAID -> REVERSED"
        actor: system
        preconditions:
          - "total_net_disbursed_cents == 0"
          - "total_committed_cents >= reference_unmet_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = FULLY_COMMITTED"
      - from: SATISFIED
        to: DISBURSING
        trigger: "system: recompute after Disbursement PAID -> REVERSED with other PAID rows remaining"
        actor: system
        preconditions:
          - "0 < total_net_disbursed_cents < total_committed_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = DISBURSING"
      - from: DISBURSING
        to: PARTIALLY_COMMITTED
        trigger: "system: recompute after FundingCommitment CONFIRMED -> RESCINDED or Disbursement PAID -> REVERSED leaving total_net_disbursed_cents == 0"
        actor: system
        preconditions:
          - "total_committed_cents > 0"
          - "total_net_disbursed_cents == 0"
          - "total_committed_cents < reference_unmet_cents"
        side_effects:
          - "sets RecoveryCase.funding_status = PARTIALLY_COMMITTED"
      - from: PARTIALLY_COMMITTED
        to: UNFUNDED
        trigger: "system: recompute after the last live FundingCommitment on the case is RESCINDED and no bridge remains"
        actor: system
        preconditions:
          - "total_committed_cents == 0"
        side_effects:
          - "sets RecoveryCase.funding_status = UNFUNDED"

  # ---- TableSession --------------------------------------------------------
  - entity: TableSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /table-sessions/{id}/open"
        actor: UnmetNeedsChair
        preconditions:
          - "status == SCHEDULED"
          - "length(attending_member_org_ids in request) >= quorum_min_member_orgs"
          - "every id in attending_member_org_ids resolves to a MemberOrganization with status IN {ACTIVE, CAPPED}"
        side_effects:
          - "sets TableSession.status = IN_SESSION"
          - "stores attending_member_org_ids and chaired_by_user_id"
          - "increments TableSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /table-sessions/{id}/adjourn with cancel_instead == true"
        actor: UnmetNeedsChair
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "sets TableSession.status = CANCELLED"
          - "cascades: every CasePresentation in this session with status == QUEUED moves QUEUED -> DEFERRED"
          - "increments TableSession.version by 1"
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /table-sessions/{id}/adjourn"
        actor: UnmetNeedsChair
        preconditions:
          - "status == IN_SESSION"
          - "no CasePresentation in this session with status IN {PRESENTING, DELIBERATING}"
        side_effects:
          - "sets TableSession.status = ADJOURNED"
          - "CASCADE HOP 1: every CasePresentation in this session with status == QUEUED and deferral_count < MAX_DEFERRALS moves QUEUED -> DEFERRED and increments its deferral_count; a QUEUED presentation whose deferral_count has already reached MAX_DEFERRALS cannot be deferred again and moves QUEUED -> DENIED instead"
          - "CASCADE HOP 2: because such a presentation became DENIED, every FundingCommitment on it with status == PLEDGED moves PLEDGED -> RESCINDED with rescission_reason 'MAX_DEFERRALS_REACHED'"
          - "CASCADE HOP 3: because those pledges were rescinded, MemberOrganization.committed_cents and remaining_pledge_capacity_cents are recomputed and any affected org moves CAPPED -> ACTIVE"
          - "CASCADE HOP 4: because that presentation became DENIED and no live presentation remains for its case, RecoveryCase.case_status moves PRESENTED -> ASSESSED"
          - "recomputes TableSession.queued_count to 0 and awarded_total_cents"
          - "increments TableSession.version by 1"

  # ---- CasePresentation (CYCLIC + BRANCHING) ------------------------------
  - entity: CasePresentation
    state_field: status
    initial_state: QUEUED
    terminal_states: [AWARDED, DENIED]
    note: |
      Non-linear on two counts: a DELIBERATING -> DEFERRED -> QUEUED cycle whose
      termination guard is `deferral_count < MAX_DEFERRALS` on the DEFER branch
      (the requeue leg is unguarded; the cycle terminates because the FOURTH
      DEFER is refused with ERR_MAX_DEFERRALS_REACHED, leaving the presentation
      in DELIBERATING for the chair to AWARD or DENY), and a three-way branch
      out of DELIBERATING whose side-effect sets are disjoint (AWARD confirms
      pledges and moves money; DEFER only bumps a counter; DENY releases pledges
      and rewinds the case).
    transitions:
      - from: QUEUED
        to: PRESENTING
        trigger: "POST /case-presentations/{id}/present"
        actor: UnmetNeedsChair
        preconditions:
          - "status == QUEUED"
          - "TableSession(session_id).status == IN_SESSION"
          - "queue_position == 1 among status == QUEUED presentations of the same session"
        side_effects:
          - "sets CasePresentation.status = PRESENTING and queue_position = 0"
          - "recomputes queue_position for the remaining QUEUED presentations of the session"
          - "decrements TableSession.queued_count"
          - "increments CasePresentation.version by 1"
      - from: PRESENTING
        to: DELIBERATING
        trigger: "POST /case-presentations/{id}/deliberate"
        actor: UnmetNeedsChair
        preconditions:
          - "status == PRESENTING"
          - "TableSession(session_id).status == IN_SESSION"
        side_effects:
          - "sets CasePresentation.status = DELIBERATING, opening the pledge window"
          - "increments CasePresentation.version by 1"
      - from: DELIBERATING
        to: AWARDED
        trigger: "POST /case-presentations/{id}/decision with decision == AWARD"
        actor: UnmetNeedsChair
        preconditions:
          - "status == DELIBERATING"
          - "TableSession(session_id).status == IN_SESSION"
          - "X-User-ID != RecoveryCase(case_id).assigned_case_manager_user_id"
          - "pledged_total_cents <= pinned assessment.unmet_need_total_cents"
          - "computed awarded_cents > 0"
        side_effects:
          - "sets CasePresentation.bridge_tier, bridge_authorized_cents and awarded_cents per calculations.table_award_assembly"
          - "recomputes CasePresentation.shortfall_cents"
          - "CASCADE HOP 1: every FundingCommitment on this presentation with status == PLEDGED moves PLEDGED -> CONFIRMED"
          - "CASCADE HOP 2: because those commitments became CONFIRMED (and the bridge was authorized), RecoveryCase.reference_unmet_cents is set and total_committed_cents / residual_unmet_cents are recomputed"
          - "CASCADE HOP 3: because total_committed_cents rose above 0, RecoveryCase.funding_status moves UNFUNDED -> PARTIALLY_COMMITTED or UNFUNDED -> FULLY_COMMITTED per calculations.case_funding_status_derivation"
          - "CASCADE HOP 4: because the case is now funded, RecoveryCase.case_status moves PRESENTED -> ACTIVE_RECOVERY, which is what unblocks construction permitting and disbursement approval"
          - "recomputes MemberOrganization.committed_cents, disbursed_cents and remaining_pledge_capacity_cents for each pledging org (values are unchanged by PLEDGED -> CONFIRMED, since committed_cents spans both states, so CAPPED/ACTIVE derivation does not flip here)"
          - "recomputes TableSession.awarded_total_cents"
          - "stores decided_at from the logical clock and decided_by_user_id"
          - "increments CasePresentation.version by 1"
      - from: DELIBERATING
        to: DEFERRED
        trigger: "POST /case-presentations/{id}/decision with decision == DEFER"
        actor: UnmetNeedsChair
        preconditions:
          - "status == DELIBERATING"
          - "TableSession(session_id).status == IN_SESSION"
          - "X-User-ID != RecoveryCase(case_id).assigned_case_manager_user_id"
          - "deferral_count < MAX_DEFERRALS (this is the cycle's termination guard; the fourth DEFER is refused with ERR_MAX_DEFERRALS_REACHED and the presentation stays in DELIBERATING)"
        side_effects:
          - "sets CasePresentation.status = DEFERRED and increments deferral_count by 1"
          - "leaves every FundingCommitment on the presentation in PLEDGED so the pledge survives to the next session"
          - "does NOT change RecoveryCase.case_status, funding_status or total_committed_cents"
          - "stores decided_at and decided_by_user_id"
          - "increments CasePresentation.version by 1"
        note: "Divergent from the AWARD branch: no money moves and no org capacity is consumed beyond the existing PLEDGED hold."
      - from: DELIBERATING
        to: DENIED
        trigger: "POST /case-presentations/{id}/decision with decision == DENY"
        actor: UnmetNeedsChair
        preconditions:
          - "status == DELIBERATING"
          - "TableSession(session_id).status == IN_SESSION"
          - "X-User-ID != RecoveryCase(case_id).assigned_case_manager_user_id"
        side_effects:
          - "sets CasePresentation.status = DENIED and awarded_cents = 0"
          - "every FundingCommitment on this presentation with status == PLEDGED moves PLEDGED -> RESCINDED with rescission_reason 'PRESENTATION_DENIED'"
          - "recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents for each affected org"
          - "moves RecoveryCase.case_status PRESENTED -> ASSESSED"
          - "stores decided_at and decided_by_user_id"
          - "increments CasePresentation.version by 1"
      - from: DEFERRED
        to: QUEUED
        trigger: "POST /case-presentations/{id}/requeue"
        actor: CaseManager
        preconditions:
          - "status == DEFERRED"
          - "target TableSession(new_session_id).status IN {SCHEDULED, IN_SESSION}"
          - "pinned assessment.verified_damage_total_cents == RecoveryCase.verified_damage_total_cents"
        side_effects:
          - "sets CasePresentation.session_id = new_session_id and status = QUEUED"
          - "recomputes queue_position for every QUEUED presentation of the new session and of the old session"
          - "increments queued_count on the new session and decrements it on the old session"
          - "increments CasePresentation.version by 1"
        note: "Closes the cycle QUEUED -> PRESENTING -> DELIBERATING -> DEFERRED -> QUEUED. This leg is UNGUARDED by deferral_count; the guard lives on the DEFER leg."
      - from: QUEUED
        to: DENIED
        trigger: "system: POST /table-sessions/{id}/adjourn cascade on a presentation that can no longer be deferred"
        actor: system
        preconditions:
          - "status == QUEUED"
          - "the presentation's TableSession is being adjourned or cancelled"
          - "deferral_count >= MAX_DEFERRALS"
        side_effects:
          - "sets CasePresentation.status = DENIED and awarded_cents = 0"
          - "every FundingCommitment on this presentation with status == PLEDGED moves PLEDGED -> RESCINDED with rescission_reason 'MAX_DEFERRALS_REACHED'"
          - "recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents for each affected org and moves any of them CAPPED -> ACTIVE"
          - "moves RecoveryCase.case_status PRESENTED -> ASSESSED"
          - "increments CasePresentation.version by 1"
      - from: QUEUED
        to: DEFERRED
        trigger: "system: POST /table-sessions/{id}/adjourn cascade on a presentation the table never reached"
        actor: system
        preconditions:
          - "status == QUEUED"
          - "the presentation's TableSession is being adjourned or cancelled"
          - "deferral_count < MAX_DEFERRALS"
        side_effects:
          - "sets CasePresentation.status = DEFERRED and increments deferral_count by 1"
          - "leaves every FundingCommitment on the presentation in PLEDGED"
          - "decrements TableSession.queued_count"
          - "increments CasePresentation.version by 1"

  # ---- FundingCommitment ---------------------------------------------------
  - entity: FundingCommitment
    state_field: status
    initial_state: PLEDGED
    terminal_states: [RESCINDED]
    transitions:
      - from: PLEDGED
        to: CONFIRMED
        trigger: "system: CasePresentation DELIBERATING -> AWARDED"
        actor: system
        preconditions:
          - "status == PLEDGED"
          - "CasePresentation(presentation_id).status transitions to AWARDED in the same request"
        side_effects:
          - "sets FundingCommitment.status = CONFIRMED"
          - "recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents"
          - "increments FundingCommitment.version by 1"
      - from: CONFIRMED
        to: DISBURSED
        trigger: "system: Disbursement APPROVED -> PAID where Disbursement.commitment_id == this commitment"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "sets FundingCommitment.status = DISBURSED"
          - "moves the amount from MemberOrganization.committed_cents to MemberOrganization.disbursed_cents leaving remaining_pledge_capacity_cents unchanged"
          - "increments FundingCommitment.version by 1"
      - from: PLEDGED
        to: RESCINDED
        trigger: "POST /funding-commitments/{id}/rescind, or system on presentation DENIED / MAX_DEFERRALS"
        actor: MemberOrgDelegate
        preconditions:
          - "status == PLEDGED"
          - "acting MemberOrgDelegate X-User-ID == member_org_id, or actor is LTRGAdmin"
        side_effects:
          - "sets FundingCommitment.status = RESCINDED and stores rescission_reason"
          - "recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents"
          - "recomputes CasePresentation.pledged_total_cents"
          - "increments FundingCommitment.version by 1"
      - from: CONFIRMED
        to: RESCINDED
        trigger: "POST /funding-commitments/{id}/rescind"
        actor: MemberOrgDelegate
        preconditions:
          - "status == CONFIRMED"
          - "no Disbursement with commitment_id == this commitment and status IN {APPROVED, PAID}"
          - "acting MemberOrgDelegate X-User-ID == member_org_id, or actor is LTRGAdmin"
        side_effects:
          - "COMPENSATION: sets FundingCommitment.status = RESCINDED, exactly undoing the CONFIRMED side effects"
          - "CASCADE HOP 1: recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents so annual_pledge_cap_cents - (committed_cents + disbursed_cents) holds again"
          - "CASCADE HOP 2: because remaining_pledge_capacity_cents rose above 0, MemberOrganization.status moves CAPPED -> ACTIVE"
          - "CASCADE HOP 3: because the org released capacity, CasePresentation.awarded_cents and shortfall_cents and RecoveryCase.total_committed_cents / residual_unmet_cents / funding_status are recomputed"
          - "CASCADE HOP 4: because funding_status is no longer SATISFIED, RecoveryCase.case_status moves CLOSURE_PENDING -> ACTIVE_RECOVERY when it was CLOSURE_PENDING"
          - "increments FundingCommitment.version by 1"

  # ---- Disbursement (BRANCHING FORK + CYCLE) ------------------------------
  - entity: Disbursement
    state_field: status
    initial_state: REQUESTED
    terminal_states: [REVERSED, VOIDED]
    note: |
      Non-linear: REQUESTED forks to DOB_CLEARED or DOB_FLAGGED on the same
      trigger with disjoint side-effect sets, and DOB_FLAGGED cycles back to
      REQUESTED once the duplication-of-benefits finding is resolved.
    transitions:
      - from: REQUESTED
        to: DOB_CLEARED
        trigger: "POST /disbursements (auto-evaluated at creation) or POST /disbursements/{id}/dob-resolution"
        actor: system
        preconditions:
          - "calculations.dob_exposure_check yields dob_exposure_cents == 0"
        side_effects:
          - "stores Disbursement.dob_pool_cents and dob_exposure_cents"
          - "sets Disbursement.status = DOB_CLEARED"
          - "increments RecoveryCase.version by 1"
      - from: REQUESTED
        to: DOB_FLAGGED
        trigger: "POST /disbursements (auto-evaluated at creation) or POST /disbursements/{id}/dob-resolution"
        actor: system
        preconditions:
          - "calculations.dob_exposure_check yields dob_exposure_cents > 0"
        side_effects:
          - "stores Disbursement.dob_pool_cents and dob_exposure_cents"
          - "sets Disbursement.status = DOB_FLAGGED"
          - "no FundingSource field is touched and RecoveryCase.total_committed_cents is unchanged"
          - "increments RecoveryCase.version by 1"
        note: "Divergent from the DOB_CLEARED branch: the request cannot be approved until the finding is resolved or the request is voided."
      - from: DOB_FLAGGED
        to: REQUESTED
        trigger: "POST /disbursements/{id}/dob-resolution"
        actor: DisbursementOfficer
        preconditions:
          - "status == DOB_FLAGGED"
          - "every id in excluded_assistance_record_ids resolves to an AssistanceRecord whose case belongs to the same Survivor as this disbursement's case"
        side_effects:
          - "sets AssistanceRecord.is_excluded_from_dob = true and exclusion_note on each listed record"
          - "sets Disbursement.dob_resolution_note and status = REQUESTED"
          - "immediately re-runs calculations.dob_exposure_check, moving the row on to DOB_CLEARED or back to DOB_FLAGGED"
          - "increments Disbursement.version by 1"
        note: "Cycle: REQUESTED -> DOB_FLAGGED -> REQUESTED may repeat while exposure remains."
      - from: DOB_CLEARED
        to: APPROVED
        trigger: "POST /disbursements/{id}/approve"
        actor: LTRGAdmin
        preconditions:
          - "status == DOB_CLEARED"
          - "X-User-ID != Disbursement.requested_by_user_id"
          - "re-run calculations.dob_exposure_check still yields dob_exposure_cents == 0"
          - "when purpose_code == STRUCTURE_REPAIR, ConstructionProject(project_id).status IN {PERMITTED, IN_PROGRESS, PUNCHLIST}"
          - "calculations.restricted_fund_waterfall covers requested_cents in full"
          - "sum of net_cents over this case's Disbursements with status IN {APPROVED, PAID} plus requested_cents <= RecoveryCase.total_committed_cents"
        side_effects:
          - "sets Disbursement.allocation_lines, net_cents, admin_retained_cents and gross_cents from calculations.restricted_fund_waterfall"
          - "for each allocation line increments FundingSource.committed_cents by gross_cents and recomputes available_cents"
          - "sets FundingSource.status = EXHAUSTED for any drawn source whose available_cents reached 0"
          - "stores approved_by_user_id and sets status = APPROVED"
          - "increments Disbursement.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /disbursements/{id}/pay"
        actor: DisbursementOfficer
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "for each allocation line decrements FundingSource.committed_cents by gross_cents, increments disbursed_cents by net_cents and admin_retained_cents by retention_cents, leaving available_cents unchanged"
          - "when commitment_id is set, moves that FundingCommitment CONFIRMED -> DISBURSED"
          - "recomputes RecoveryCase.total_net_disbursed_cents and funding_status"
          - "sets Disbursement.status = PAID"
          - "increments Disbursement.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /disbursements/{id}/reverse"
        actor: LTRGAdmin
        preconditions:
          - "status == PAID"
          - "request supplies a non-empty reversal_reason"
        side_effects:
          - "COMPENSATION: sets Disbursement.status = REVERSED and stores reversal_reason"
          - "CASCADE HOP 1: for each allocation line decrements FundingSource.disbursed_cents by net_cents and admin_retained_cents by retention_cents"
          - "CASCADE HOP 2: because those decrements raised FundingSource.available_cents above 0, FundingSource.status moves EXHAUSTED -> OPEN"
          - "CASCADE HOP 3: because the case's total_net_disbursed_cents fell, RecoveryCase.funding_status is recomputed downward from SATISFIED"
          - "CASCADE HOP 4: because funding_status is no longer SATISFIED, RecoveryCase.case_status moves CLOSURE_PENDING -> ACTIVE_RECOVERY when it was CLOSURE_PENDING"
          - "when commitment_id is set, moves that FundingCommitment DISBURSED -> CONFIRMED restoring MemberOrganization.committed_cents"
          - "increments Disbursement.version by 1"
      - from: DOB_FLAGGED
        to: VOIDED
        trigger: "POST /disbursements/{id}/void"
        actor: DisbursementOfficer
        preconditions:
          - "status IN {DOB_FLAGGED, DOB_CLEARED}"
        side_effects:
          - "sets Disbursement.status = VOIDED"
          - "no FundingSource or RecoveryCase money field changes because none were ever reserved"
          - "increments Disbursement.version by 1"
      - from: DOB_CLEARED
        to: VOIDED
        trigger: "POST /disbursements/{id}/void"
        actor: DisbursementOfficer
        preconditions:
          - "status == DOB_CLEARED"
        side_effects:
          - "sets Disbursement.status = VOIDED"
          - "increments Disbursement.version by 1"

  # ---- ConstructionProject (CYCLE) ---------------------------------------
  - entity: ConstructionProject
    state_field: status
    initial_state: SCOPED
    terminal_states: [CLOSED_OUT, CANCELLED]
    transitions:
      - from: SCOPED
        to: PERMITTED
        trigger: "POST /construction-projects/{id}/transition with action == PERMIT"
        actor: ConstructionManager
        preconditions:
          - "status == SCOPED"
          - "predecessor_project_id is null OR ConstructionProject(predecessor_project_id).status == CLOSED_OUT"
          - "RecoveryCase(case_id).case_status NOT IN {CLOSURE_PENDING, CLOSED, INACTIVE}"
        side_effects:
          - "sets ConstructionProject.status = PERMITTED and permit_number"
          - "increments ConstructionProject.version by 1"
      - from: PERMITTED
        to: IN_PROGRESS
        trigger: "POST /construction-projects/{id}/transition with action == START"
        actor: ConstructionManager
        preconditions:
          - "status == PERMITTED"
        side_effects:
          - "sets ConstructionProject.status = IN_PROGRESS"
          - "increments ConstructionProject.version by 1"
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /construction-projects/{id}/transition with action == SUSPEND"
        actor: ConstructionManager
        preconditions:
          - "status == IN_PROGRESS"
          - "request supplies a non-empty reason"
        side_effects:
          - "sets ConstructionProject.status = SUSPENDED and suspension_reason"
          - "CASCADE HOP 1: every VolunteerDeployment on this project with status IN {REQUESTED, CONFIRMED} moves to CANCELLED with cancellation_reason 'PROJECT_SUSPENDED'"
          - "CASCADE HOP 2: because those deployments were cancelled, each affected VolunteerGroup's HousingAssignment rows with status == ACTIVE whose interval intersects the cancelled deployment window move ACTIVE -> RELEASED with release_reason 'DEPLOYMENT_CANCELLED'"
          - "CASCADE HOP 3: because those assignments were released, LodgingSite.peak_committed_beds is recomputed and LodgingSite.status moves FULL -> OPEN for any site whose recomputed peak fell below bed_capacity"
          - "recomputes ConstructionProject.confirmed_deployment_count and VolunteerGroup.active_deployment_count"
          - "increments ConstructionProject.version by 1"
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /construction-projects/{id}/transition with action == RESUME"
        actor: ConstructionManager
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "sets ConstructionProject.status = IN_PROGRESS and clears suspension_reason"
          - "does NOT restore the cancelled VolunteerDeployment or released HousingAssignment rows"
          - "increments ConstructionProject.version by 1"
        note: "Cycle: IN_PROGRESS -> SUSPENDED -> IN_PROGRESS may repeat without bound."
      - from: IN_PROGRESS
        to: PUNCHLIST
        trigger: "POST /construction-projects/{id}/transition with action == PUNCHLIST"
        actor: ConstructionManager
        preconditions:
          - "status == IN_PROGRESS"
          - "no VolunteerDeployment on this project with status IN {REQUESTED, CONFIRMED}"
        side_effects:
          - "sets ConstructionProject.status = PUNCHLIST"
          - "increments ConstructionProject.version by 1"
      - from: PUNCHLIST
        to: CLOSED_OUT
        trigger: "POST /construction-projects/{id}/transition with action == CLOSE_OUT"
        actor: ConstructionManager
        preconditions:
          - "status == PUNCHLIST"
          - "no Disbursement with project_id == this project and status IN {REQUESTED, DOB_CLEARED, DOB_FLAGGED, APPROVED}"
        side_effects:
          - "sets ConstructionProject.status = CLOSED_OUT"
          - "unblocks the PERMIT transition of any successor project whose predecessor_project_id is this project"
          - "increments ConstructionProject.version by 1"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /construction-projects/{id}/transition with action == CANCEL"
        actor: ConstructionManager
        preconditions:
          - "status IN {SCOPED, PERMITTED, SUSPENDED}"
          - "request supplies a non-empty reason"
        side_effects:
          - "sets ConstructionProject.status = CANCELLED"
          - "every VolunteerDeployment on this project with status IN {REQUESTED, CONFIRMED} moves to CANCELLED"
          - "increments ConstructionProject.version by 1"
      - from: PERMITTED
        to: CANCELLED
        trigger: "POST /construction-projects/{id}/transition with action == CANCEL"
        actor: ConstructionManager
        preconditions:
          - "status == PERMITTED"
          - "request supplies a non-empty reason"
        side_effects:
          - "sets ConstructionProject.status = CANCELLED"
          - "increments ConstructionProject.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /construction-projects/{id}/transition with action == CANCEL"
        actor: ConstructionManager
        preconditions:
          - "status == SUSPENDED"
          - "request supplies a non-empty reason"
        side_effects:
          - "sets ConstructionProject.status = CANCELLED"
          - "increments ConstructionProject.version by 1"

  # ---- VolunteerDeployment -----------------------------------------------
  - entity: VolunteerDeployment
    state_field: status
    initial_state: REQUESTED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /volunteer-deployments/{id}/transition with action == CONFIRM"
        actor: VolunteerCoordinator
        preconditions:
          - "status == REQUESTED"
          - "ConstructionProject(project_id).status IN {PERMITTED, IN_PROGRESS}"
          - "when VolunteerGroup(group_id).requires_housing is true, at least one HousingAssignment with status == ACTIVE exists for the group covering every night in [arrival_date, departure_date)"
        side_effects:
          - "sets VolunteerDeployment.status = CONFIRMED"
          - "recomputes ConstructionProject.confirmed_deployment_count and VolunteerGroup.active_deployment_count"
          - "increments VolunteerDeployment.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /volunteer-deployments/{id}/transition with action == COMPLETE"
        actor: VolunteerCoordinator
        preconditions:
          - "status == CONFIRMED"
          - "request supplies hours_logged >= 0"
        side_effects:
          - "sets VolunteerDeployment.status = COMPLETED and hours_logged"
          - "increments ConstructionProject.volunteer_hours_logged by hours_logged"
          - "recomputes ConstructionProject.confirmed_deployment_count and VolunteerGroup.active_deployment_count"
          - "increments VolunteerDeployment.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /volunteer-deployments/{id}/transition with action == CANCEL, or system on ConstructionProject SUSPEND/CANCEL"
        actor: VolunteerCoordinator
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "sets VolunteerDeployment.status = CANCELLED and cancellation_reason"
          - "recomputes ConstructionProject.confirmed_deployment_count and VolunteerGroup.active_deployment_count"
          - "increments VolunteerDeployment.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /volunteer-deployments/{id}/transition with action == CANCEL, or system on ConstructionProject IN_PROGRESS -> SUSPENDED"
        actor: VolunteerCoordinator
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "sets VolunteerDeployment.status = CANCELLED and cancellation_reason"
          - "releases the group's ACTIVE HousingAssignment rows intersecting [arrival_date, departure_date) with release_reason 'DEPLOYMENT_CANCELLED'"
          - "recomputes LodgingSite.peak_committed_beds and LodgingSite.status for each affected site"
          - "recomputes ConstructionProject.confirmed_deployment_count and VolunteerGroup.active_deployment_count"
          - "increments VolunteerDeployment.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: pledge-create-stale-presentation
    parent_entity: CasePresentation
    write_endpoint: "POST /funding-commitments"
    occ_field: "expected_presentation_version"
    description: |
      A delegate sizes a pledge against the gap it observed on the
      presentation. Creating a FundingCommitment whose
      expected_presentation_version is lower than the presentation's current
      version is rejected: the delegate's view of pledged_total_cents (and
      therefore of the remaining gap) is stale because another delegate's
      pledge has already been recorded on that presentation. A second pledge
      is legitimate business behaviour, so this is not a state precondition —
      only the stale version distinguishes the rejected write.
    error_id: ERR_STALE_PRESENTATION_VERSION
    http_status: 412

  - rule_id: disbursement-create-stale-case
    parent_entity: RecoveryCase
    write_endpoint: "POST /disbursements"
    occ_field: "expected_case_version"
    description: |
      A disbursement request is sized against the case's remaining committed
      funds and duplication-of-benefits posture. Creating a Disbursement whose
      expected_case_version is lower than RecoveryCase.version is rejected
      because the officer's view of total_committed_cents,
      total_net_disbursed_cents and the case's assistance records is stale.
      Multiple disbursements per case are legitimate, so only the stale
      version distinguishes the rejected write.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: survivor_priority_score
    trigger: "on POST /survivors and on any change to the survivor's household fields; snapshotted into CasePresentation.priority_score_snapshot at POST /case-presentations"
    algorithm: weighted_scoring
    formula: |
      score = INCOME_POINTS[income_band]
            + min(20, 4 * max(0, household_size - 1))
            + (15 if has_member_with_disability else 0)
            + (10 if head_of_household_age >= 65 else 0)
            + (15 if is_uninsured else 0)
      priority_score = min(100, score)
    input_set: "Survivor row only; no cross-entity inputs. head_of_household_age uses >= 65 (age 64 scores 0 for that term)."
    constants:
      INCOME_POINTS: { ELI: 40, VLI: 30, LOW: 20, MODERATE: 10, ABOVE: 0 }
      HOUSEHOLD_POINT_PER_EXTRA_MEMBER: 4
      HOUSEHOLD_POINT_CAP: 20
      DISABILITY_POINTS: 15
      ELDER_POINTS: 10
      ELDER_AGE_THRESHOLD: 65
      UNINSURED_POINTS: 15
      SCORE_CEILING: 100
    precision: "integer points, no rounding needed (all terms are integers)"

  - name: verified_damage_total
    trigger: "on POST /damage-items/{id}/verification; result written to RecoveryCase.verified_damage_total_cents"
    algorithm: aggregation
    formula: |
      verified_damage_total_cents =
        sum over DamageItem d where d.case_id == case.id
            and d.verification_status == 'VERIFIED'
        of min(d.verified_cost_cents, CATEGORY_CAP_CENTS[d.category])
    input_set: "DamageItem rows of the case with verification_status == VERIFIED only; UNVERIFIED and REJECTED rows contribute 0. Sum is order-independent (integer addition), so no tie-break is required."
    constants:
      CATEGORY_CAP_CENTS:
        STRUCTURE: 12000000
        ROOF: 3500000
        HVAC: 1200000
        PLUMBING: 900000
        ELECTRICAL: 900000
        CONTENTS: 1500000
        ACCESSIBILITY: 2500000
    precision: "integer cents; the per-item cap is applied BEFORE summation"

  - name: unmet_need_determination
    trigger: "on POST /recovery-cases/{id}/assessments; result written to UnmetNeedAssessment.unmet_need_total_cents, bucket_need_cents and bucket_offset_cents"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — per-bucket need
      need['STRUCTURE_REPAIR']      = sum of min(d.verified_cost_cents, CATEGORY_CAP_CENTS[d.category])
                                      over VERIFIED DamageItems with BUCKET_OF_CATEGORY[d.category] == 'STRUCTURE_REPAIR'
      need['CONTENTS_REPLACEMENT']  = same restricted to BUCKET_OF_CATEGORY == 'CONTENTS_REPLACEMENT'
      need['ACCESSIBILITY_MOD']     = same restricted to BUCKET_OF_CATEGORY == 'ACCESSIBILITY_MOD'
      need['TEMPORARY_HOUSING']     = RecoveryCase.temporary_housing_need_cents

      # STEP 2 — per-bucket offset (DOCUMENTED assistance only)
      offset[b] = sum of a.awarded_cents over AssistanceRecord a where a.case_id == case.id
                  and a.documentation_status == 'DOCUMENTED' and a.purpose_code == b
      # AssistanceRecord.is_excluded_from_dob NEVER affects offset[b]; it only
      # affects calculations.dob_exposure_check.

      # STEP 3 — variant-specific reduction
      if variant == 'PURPOSE_MATCHED':
          unmet_need_total_cents = sum over b in BUCKET_ORDER of max(0, need[b] - offset[b])
      else:  # variant == 'POOLED'
          unmet_need_total_cents = max(0, sum(need[b] for b in BUCKET_ORDER)
                                          - sum(offset[b] for b in BUCKET_ORDER))

      verified_damage_total_cents        = need['STRUCTURE_REPAIR'] + need['CONTENTS_REPLACEMENT'] + need['ACCESSIBILITY_MOD']
      total_documented_assistance_cents  = sum(offset[b] for b in BUCKET_ORDER)
    input_set: "VERIFIED DamageItems plus DOCUMENTED AssistanceRecords of the SAME case. UNDOCUMENTED and DISPUTED assistance rows are excluded from offsets. Buckets are always all four keys of BUCKET_ORDER, present with value 0 when empty."
    constants:
      BUCKET_ORDER: [STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD, TEMPORARY_HOUSING]
      BUCKET_OF_CATEGORY:
        STRUCTURE: STRUCTURE_REPAIR
        ROOF: STRUCTURE_REPAIR
        HVAC: STRUCTURE_REPAIR
        PLUMBING: STRUCTURE_REPAIR
        ELECTRICAL: STRUCTURE_REPAIR
        CONTENTS: CONTENTS_REPLACEMENT
        ACCESSIBILITY: ACCESSIBILITY_MOD
    precision: "integer cents; max(0, ...) floor is applied PER BUCKET in PURPOSE_MATCHED and ONCE on the pooled total in POOLED"
    variants:
      - name: PURPOSE_MATCHED
        when: "The authoritative determination. Required for any UnmetNeedAssessment pinned to a CasePresentation."
        difference: "Floors the surplus per bucket, so over-award in one purpose (e.g. FEMA temporary-housing money exceeding the housing need) cannot subsidise a deficit in another purpose. Result is always >= POOLED."
      - name: POOLED
        when: "Advisory triage figure produced on demand; never eligible for presentation to the unmet needs table."
        difference: "Nets all buckets together before flooring at zero, so a bucket surplus silently absorbs another bucket's deficit and the reported unmet need is smaller."

  - name: dob_exposure_check
    trigger: "on POST /disbursements, on POST /disbursements/{id}/dob-resolution and re-run as a precondition of POST /disbursements/{id}/approve; result written to Disbursement.dob_pool_cents and dob_exposure_cents"
    algorithm: threshold
    formula: |
      survivor_id     = RecoveryCase(disbursement.case_id).survivor_id
      sibling_case_ids = ids of every RecoveryCase with survivor_id == survivor_id
                         and case_status != 'INACTIVE'          # includes the target case itself
      dob_pool_cents  = sum of a.awarded_cents over AssistanceRecord a where
                          a.case_id IN sibling_case_ids
                          and a.purpose_code == disbursement.purpose_code
                          and a.documentation_status IN {'DOCUMENTED', 'DISPUTED'}
                          and a.is_excluded_from_dob == false
      prior_disbursed_cents = sum of d.requested_cents over Disbursement d where
                          d.case_id IN sibling_case_ids
                          and d.purpose_code == disbursement.purpose_code
                          and d.status IN {'APPROVED', 'PAID'}
                          and d.id != disbursement.id
      bucket_need_cents = need[disbursement.purpose_code] computed by
                          calculations.unmet_need_determination STEP 1 for the TARGET case only
      dob_exposure_cents = max(0, dob_pool_cents + prior_disbursed_cents
                                  + disbursement.requested_cents - bucket_need_cents)
      # Branch: dob_exposure_cents == 0 -> DOB_CLEARED; dob_exposure_cents > 0 -> DOB_FLAGGED
    input_set: "AssistanceRecords across EVERY non-INACTIVE case of the same Survivor (not just the target case) with documentation_status IN {DOCUMENTED, DISPUTED} and is_excluded_from_dob == false, plus APPROVED/PAID Disbursements on those cases for the same purpose_code, excluding the row under evaluation."
    constants:
      DOB_FLAG_THRESHOLD_CENTS: 0
      DOB_COUNTED_DOCUMENTATION_STATUSES: [DOCUMENTED, DISPUTED]
    precision: "integer cents; the flag fires on strictly greater than DOB_FLAG_THRESHOLD_CENTS, so exposure of exactly 0 clears and exposure of 1 cent flags"

  - name: restricted_fund_waterfall
    trigger: "on POST /disbursements/{id}/approve; result written to Disbursement.allocation_lines, net_cents, admin_retained_cents and gross_cents, and to FundingSource.committed_cents"
    algorithm: waterfall_allocation
    formula: |
      # ELIGIBILITY FILTER (explicit predicate over FundingSource fields)
      eligible = [ s for s in FundingSource
                   if s.status == 'OPEN'
                   and disbursement.purpose_code in s.eligible_purpose_codes
                   and (s.expires_on is null or s.expires_on >= clock.current_date)
                   and s.available_cents > 0 ]

      # RANKING EXPRESSION, then TIE-BREAK
      order by s.restriction_specificity DESC,        # spend restricted money first
               s.expires_on ASC with null last,       # then soonest-expiring
               s.created_at ASC                       # tie-break (never `id`)

      remaining_net = disbursement.requested_cents
      lines = []
      for s in eligible (in the order above):
          if remaining_net == 0: break
          if s.admin_retention_allowed:
              # largest net n such that n + round_half_up(n * ADMIN_RETENTION_BPS / 10000) <= s.available_cents
              net_cap = (s.available_cents * 10000) // (10000 + ADMIN_RETENTION_BPS)
              while net_cap > 0 and net_cap + round_half_up(net_cap * ADMIN_RETENTION_BPS / 10000) > s.available_cents:
                  net_cap -= 1
          else:
              net_cap = s.available_cents
          net_line = min(remaining_net, net_cap)
          if net_line == 0: continue
          # ROUNDING ORDER IS PINNED: round EACH LINE to the cent here, then sum.
          retention_line = round_half_up(net_line * ADMIN_RETENTION_BPS / 10000) if s.admin_retention_allowed else 0
          lines.append({ funding_source_id: s.id, net_cents: net_line,
                         retention_cents: retention_line,
                         gross_cents: net_line + retention_line })
          remaining_net -= net_line

      if remaining_net > 0: reject with ERR_INSUFFICIENT_RESTRICTED_FUNDS

      net_cents           = sum(l.net_cents for l in lines)          # == requested_cents
      admin_retained_cents = sum(l.retention_cents for l in lines)   # per-line rounding, THEN sum
      gross_cents         = net_cents + admin_retained_cents
    input_set: "FundingSource rows with status == OPEN whose eligible_purpose_codes contain the disbursement's purpose_code and which are unexpired against the logical clock. EXHAUSTED and EXPIRED sources are excluded. Empty candidate pool => ERR_INSUFFICIENT_RESTRICTED_FUNDS."
    constants:
      ADMIN_RETENTION_BPS: 350
      ELIGIBLE_PURPOSES_BY_RESTRICTION:
        UNRESTRICTED: [STRUCTURE_REPAIR, CONTENTS_REPLACEMENT, ACCESSIBILITY_MOD, TEMPORARY_HOUSING]
        STRUCTURE_REPAIR_ONLY: [STRUCTURE_REPAIR]
        CONTENTS_ONLY: [CONTENTS_REPLACEMENT]
        ACCESSIBILITY_ONLY: [ACCESSIBILITY_MOD]
        TEMPORARY_HOUSING_ONLY: [TEMPORARY_HOUSING]
        MATERIALS_ONLY: [STRUCTURE_REPAIR]
      RESTRICTION_SPECIFICITY: { UNRESTRICTED: 0, STRUCTURE_REPAIR_ONLY: 1, CONTENTS_ONLY: 1, ACCESSIBILITY_ONLY: 1, TEMPORARY_HOUSING_ONLY: 1, MATERIALS_ONLY: 1 }
    precision: |
      Integer cents, round_half_up. ROUNDING ORDER IS PINNED: retention is
      rounded to the cent PER ALLOCATION LINE and the rounded line values are
      then summed into admin_retained_cents. Summing the net first and rounding
      once produces a different total (e.g. lines of 1500100 and 1499900 cents
      give 52504 + 52497 = 105001 per line versus 105000 for
      round_half_up(3000000 * 350 / 10000)) and is INCORRECT.

  - name: table_award_assembly
    trigger: "on POST /case-presentations/{id}/decision with decision == AWARD; results written to CasePresentation.bridge_tier, bridge_authorized_cents, awarded_cents and shortfall_cents"
    algorithm: threshold
    formula: |
      # STEP 1 — the tier key. PINNED: the tier is selected from the PINNED
      # ASSESSMENT's unmet_need_total_cents, NOT from awarded_cents. This
      # resolves what looks like a circular dependency (awarded_cents depends
      # on bridge_authorized_cents, which depends on the tier, which appears to
      # depend on the award total). Evaluation order is 1 -> 2 -> 3 -> 4 -> 5
      # and is not iterated to a fixed point.
      unmet = UnmetNeedAssessment(presentation.assessment_id).unmet_need_total_cents

      # STEP 2 — tier selection on `unmet` with half-open bands
      tier = 'TIER_A' if unmet < TIER_A_CEILING_CENTS
             else ('TIER_B' if unmet < TIER_B_CEILING_CENTS else 'TIER_C')

      # STEP 3 — pledges already on the table
      pledged_total = sum of c.pledged_cents over FundingCommitment c
                      where c.presentation_id == presentation.id and c.status == 'PLEDGED'
      gap = max(0, unmet - pledged_total)

      # STEP 4 — bridge cap and pool
      bridge_cap  = round_half_up(unmet * BRIDGE_PCT_BPS[tier] / 10000)
      bridge_pool = sum of s.available_cents over FundingSource s
                    where s.restriction_code == 'UNRESTRICTED' and s.status == 'OPEN'
                    and (s.expires_on is null or s.expires_on >= clock.current_date)
      bridge_authorized_cents = min(gap, bridge_cap, bridge_pool)

      # STEP 5 — the award
      awarded_cents   = pledged_total + bridge_authorized_cents
      shortfall_cents = max(0, unmet - awarded_cents)
      # The bridge is an AUTHORIZATION only: no FundingSource field is mutated
      # here. Unrestricted money is actually drawn later by
      # calculations.restricted_fund_waterfall at disbursement approval.
    input_set: "FundingCommitment rows on THIS presentation with status == PLEDGED only (CONFIRMED, DISBURSED and RESCINDED rows are excluded), plus UNRESTRICTED FundingSource rows with status == OPEN and unexpired against the logical clock."
    constants:
      TIER_A_CEILING_CENTS: 500000
      TIER_B_CEILING_CENTS: 2500000
      BRIDGE_PCT_BPS: { TIER_A: 5000, TIER_B: 3000, TIER_C: 1500 }
      MAX_DEFERRALS: 3    # table-governance constant: the DEFER branch of POST /case-presentations/{id}/decision is refused once deferral_count == 3
    precision: "integer cents, round_half_up on bridge_cap only. Tier bands are half-open: unmet == 500000 is TIER_B and unmet == 2500000 is TIER_C."

  - name: volunteer_skill_fit_score
    trigger: "on POST /volunteer-deployments (COVERAGE_WEIGHTED, written to VolunteerDeployment.skill_fit_score_bps and gated by MIN_FIT_BPS) and on GET /construction-projects/{id}/skill-fit (either variant, read-only)"
    algorithm: weighted_scoring
    formula: |
      day_count = (departure_date - arrival_date) in days + 1        # CLOSED interval, inclusive
      trades    = keys of ConstructionProject.required_trade_hours
      weight(t) = CRITICAL_TRADE_WEIGHT if t in project.critical_trades else NORMAL_TRADE_WEIGHT

      if variant == 'COVERAGE_WEIGHTED':
          capacity(t) = group.skill_profile.get(t, 0) * VOLUNTEER_HOURS_PER_DAY * day_count
          covered(t)  = min(project.required_trade_hours[t], capacity(t))
          numerator   = sum over t of weight(t) * covered(t)
          denominator = sum over t of weight(t) * project.required_trade_hours[t]
      else:  # variant == 'HEADCOUNT_WEIGHTED'
          numerator   = sum over t of weight(t) * (1 if group.skill_profile.get(t, 0) >= 1 else 0)
          denominator = sum over t of weight(t)

      score_bps = round_half_up(10000 * numerator / denominator)
      # denominator == 0 (project declares no required_trade_hours) => score_bps = 10000
    input_set: "The single (VolunteerGroup, ConstructionProject) pair named in the request plus the requested date window. No other deployments are considered; the score is independent of the group's other commitments."
    constants:
      VOLUNTEER_HOURS_PER_DAY: 6
      CRITICAL_TRADE_WEIGHT: 3
      NORMAL_TRADE_WEIGHT: 1
      MIN_FIT_BPS: 6000
      DEPLOYMENT_TURNAROUND_DAYS: 1    # hosting constant: mandatory rest/turnaround day between two deployments of the same group (validation priority 23)
      LODGING_INTERVAL_SEMANTICS: "half_open"    # HousingAssignment nights are [check_in_date, check_out_date)
      DEPLOYMENT_INTERVAL_SEMANTICS: "closed"    # VolunteerDeployment work days are [arrival_date, departure_date]
    precision: "basis points, round_half_up to the nearest integer bps. The deployment gate is score_bps >= MIN_FIT_BPS, so exactly 6000 is accepted."
    variants:
      - name: COVERAGE_WEIGHTED
        when: "The authoritative gate. Computed on every POST /volunteer-deployments and stored on the row."
        difference: "Measures how many of the project's weighted required HOURS the crew can actually cover in the requested window, so a small crew of qualified people scores low even when every trade is represented."
      - name: HEADCOUNT_WEIGHTED
        when: "Advisory preview only, returned by GET /construction-projects/{id}/skill-fit; never stored and never gates a deployment."
        difference: "Measures weighted trade REPRESENTATION (does the group have at least one qualified member per trade), ignoring hours and window length, so it scores far higher than COVERAGE_WEIGHTED for undersized crews."

  - name: case_funding_status_derivation
    trigger: "on CasePresentation DELIBERATING -> AWARDED, on Disbursement APPROVED -> PAID, on Disbursement PAID -> REVERSED and on FundingCommitment CONFIRMED -> RESCINDED; result written to RecoveryCase.funding_status"
    algorithm: constraint_propagation
    formula: |
      total_committed_cents    = sum of c.pledged_cents over FundingCommitment c
                                 where c.presentation_id IN (presentations of this case)
                                 and c.status IN {'CONFIRMED', 'DISBURSED'}
                               + sum of p.bridge_authorized_cents over CasePresentation p
                                 where p.case_id == case.id and p.status == 'AWARDED'
      total_net_disbursed_cents = sum of d.net_cents over Disbursement d
                                 where d.case_id == case.id and d.status == 'PAID'
      reference_unmet_cents     = unmet_need_total_cents of the assessment pinned on the
                                 AWARDED CasePresentation of this case with the greatest
                                 decided_at (tie-break created_at ASC); 0 if none
      residual_unmet_cents      = max(0, reference_unmet_cents - total_committed_cents)

      # CLAUSES ARE EVALUATED STRICTLY TOP-DOWN; THE FIRST MATCH WINS
      1. if total_committed_cents == 0:                                      funding_status = 'UNFUNDED'
      2. elif total_net_disbursed_cents >= total_committed_cents:            funding_status = 'SATISFIED'
      3. elif total_net_disbursed_cents > 0:                                 funding_status = 'DISBURSING'
      4. elif total_committed_cents >= reference_unmet_cents:                funding_status = 'FULLY_COMMITTED'
      5. else:                                                               funding_status = 'PARTIALLY_COMMITTED'
    input_set: "FundingCommitment rows with status IN {CONFIRMED, DISBURSED} reachable through this case's CasePresentations, AWARDED presentations of this case for the bridge term, and PAID Disbursements of this case. PLEDGED and RESCINDED commitments and non-PAID disbursements are excluded."
    constants: {}
    precision: "integer cents; clause order is normative and clause 2 deliberately precedes clause 4"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "request body is well-formed JSON, required fields present, enum values legal, integers non-negative where constrained, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "path-parameter resources exist, validated left-to-right"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; the error_id names the missing entity (ERR_SURVIVOR_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_DAMAGE_ITEM_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_PRESENTATION_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_MEMBER_ORG_NOT_FOUND, ERR_FUNDING_SOURCE_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_VOLUNTEER_GROUP_NOT_FOUND, ERR_DEPLOYMENT_NOT_FOUND, ERR_LODGING_SITE_NOT_FOUND, ERR_HOUSING_ASSIGNMENT_NOT_FOUND)"

  - priority: 5
    category: existence
    check: "body-referenced foreign keys resolve, in declaration order: survivor_id, case_id, session_id, assessment_id, presentation_id, member_org_id, project_id, commitment_id, group_id, lodging_site_id, predecessor_project_id"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /recovery-cases, POST /case-presentations, POST /funding-commitments, POST /disbursements, POST /construction-projects, POST /volunteer-deployments, POST /housing-assignments"

  - priority: 6
    category: business_referential
    check: "UnmetNeedAssessment(assessment_id).case_id == case_id in the same request"
    error_id: ERR_ASSESSMENT_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /case-presentations"

  - priority: 7
    category: auth
    check: "when the acting role is MemberOrgDelegate, X-User-ID equals the member_org_id in the body (create) or FundingCommitment.member_org_id (rescind)"
    error_id: ERR_ORG_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /funding-commitments, POST /funding-commitments/{id}/rescind"

  - priority: 8
    category: auth
    check: "prepared_by_user_id equals RecoveryCase.assigned_case_manager_user_id AND equals the acting X-User-ID"
    error_id: ERR_CASE_MANAGER_MISMATCH
    http_status: 403
    applies_to: "POST /case-presentations"

  - priority: 9
    category: business_safety
    check: "segregation of duties: the chair deciding a presentation must not be the case's assigned case manager; the LTRGAdmin approving a disbursement must not be the officer who requested it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /case-presentations/{id}/decision, POST /disbursements/{id}/approve"

  - priority: 10
    category: state
    check: "target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_PRESENTATION_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints; the error_id names the entity (ERR_CASE_INVALID_STATE, ERR_PRESENTATION_INVALID_STATE, ERR_COMMITMENT_INVALID_STATE, ERR_DISBURSEMENT_INVALID_STATE, ERR_PROJECT_INVALID_TRANSITION, ERR_DEPLOYMENT_INVALID_TRANSITION, ERR_HOUSING_ALREADY_RELEASED, ERR_DAMAGE_ITEM_ALREADY_VERIFIED)"

  - priority: 11
    category: state
    check: "RecoveryCase.case_status IN {INTAKE, ASSESSED, PRESENTED, ACTIVE_RECOVERY} before damage items, assistance records or assessments may be added"
    error_id: ERR_CASE_NOT_ASSESSABLE
    http_status: 409
    applies_to: "POST /recovery-cases/{id}/damage-items, POST /recovery-cases/{id}/assistance-records, POST /recovery-cases/{id}/assessments"

  - priority: 12
    category: state
    check: "CasePresentation.status == DELIBERATING before a pledge may be recorded against it"
    error_id: ERR_PRESENTATION_NOT_ACCEPTING_PLEDGES
    http_status: 409
    applies_to: "POST /funding-commitments"

  - priority: 13
    category: state
    check: "cross-entity gate: TableSession(session_id).status == IN_SESSION"
    error_id: ERR_SESSION_NOT_IN_SESSION
    http_status: 409
    applies_to: "POST /case-presentations/{id}/present, POST /case-presentations/{id}/deliberate, POST /case-presentations/{id}/decision, POST /funding-commitments"

  - priority: 14
    category: state
    check: "cross-entity gate: TableSession(session_id).status IN {SCHEDULED, IN_SESSION} when queueing or requeueing a presentation into it"
    error_id: ERR_SESSION_NOT_ACCEPTING_QUEUE
    http_status: 409
    applies_to: "POST /case-presentations, POST /case-presentations/{id}/requeue"

  - priority: 15
    category: state
    check: "cross-entity gate: MemberOrganization(member_org_id).status == ACTIVE (CAPPED, SUSPENDED and WITHDRAWN orgs may not pledge)"
    error_id: ERR_MEMBER_ORG_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /funding-commitments"

  - priority: 16
    category: state
    check: "cross-entity gate: when purpose_code == STRUCTURE_REPAIR, ConstructionProject(project_id).status IN {PERMITTED, IN_PROGRESS, PUNCHLIST}"
    error_id: ERR_PROJECT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 17
    category: state
    check: "cross-entity gate: ConstructionProject(project_id).status IN {PERMITTED, IN_PROGRESS} before a volunteer deployment may be created or confirmed"
    error_id: ERR_PROJECT_NOT_ACCEPTING_VOLUNTEERS
    http_status: 409
    applies_to: "POST /volunteer-deployments, POST /volunteer-deployments/{id}/transition"

  - priority: 18
    category: state
    check: "cross-entity gate: ConstructionProject(predecessor_project_id).status == CLOSED_OUT before the successor may be PERMITTED"
    error_id: ERR_PREDECESSOR_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /construction-projects/{id}/transition (action == PERMIT)"

  - priority: 19
    category: state
    check: "no CasePresentation in the session with status IN {PRESENTING, DELIBERATING} when adjourning (ERR_SESSION_HAS_ACTIVE_PRESENTATION); no other CasePresentation for the case with status IN {QUEUED, PRESENTING, DELIBERATING} when queueing a new one (ERR_PRESENTATION_ALREADY_ACTIVE)"
    error_id: ERR_SESSION_HAS_ACTIVE_PRESENTATION
    http_status: 409
    applies_to: "POST /table-sessions/{id}/adjourn, POST /case-presentations"

  - priority: 20
    category: state
    check: "OCC: expected_presentation_version equals CasePresentation.version / expected_case_version equals RecoveryCase.version"
    error_id: ERR_STALE_PRESENTATION_VERSION
    http_status: 412
    applies_to: "POST /funding-commitments (expected_presentation_version), POST /disbursements (expected_case_version -> ERR_STALE_CASE_VERSION)"

  - priority: 21
    category: business_safety
    check: "duplication-of-benefits: re-running calculations.dob_exposure_check at approval yields dob_exposure_cents == 0"
    error_id: ERR_DUPLICATION_OF_BENEFITS
    http_status: 422
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 22
    category: business_temporal
    check: "start/end ordering: departure_date >= arrival_date, check_out_date > check_in_date, arrival_date >= clock.current_date, check_in_date >= clock.current_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /volunteer-deployments, POST /housing-assignments"

  - priority: 23
    category: business_temporal
    check: "CLOSED-interval overlap with a mandatory turnaround buffer on the VolunteerGroup: reject when an existing deployment E of the same group with status IN {REQUESTED, CONFIRMED, COMPLETED} satisfies new.arrival_date <= E.departure_date + DEPLOYMENT_TURNAROUND_DAYS AND new.departure_date + DEPLOYMENT_TURNAROUND_DAYS >= E.arrival_date"
    error_id: ERR_DEPLOYMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /volunteer-deployments"

  - priority: 24
    category: business_temporal
    check: "HALF-OPEN aggregate-capacity overlap on the LodgingSite: for every night n in [check_in_date, check_out_date), sum of beds_requested over the site's ACTIVE HousingAssignments covering n plus this group's member_count must be <= LodgingSite.bed_capacity. Adjacency (check_out_date of one equals check_in_date of another) is NOT a conflict"
    error_id: ERR_LODGING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housing-assignments"

  - priority: 25
    category: business_constraint
    check: "the presentation being presented has queue_position == 1 among the session's QUEUED presentations"
    error_id: ERR_NOT_AT_QUEUE_HEAD
    http_status: 409
    applies_to: "POST /case-presentations/{id}/present"

  - priority: 26
    category: business_constraint
    check: "attending_member_org_ids length >= TableSession.quorum_min_member_orgs"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /table-sessions/{id}/open"

  - priority: 27
    category: business_constraint
    check: "the pledging MemberOrganization id appears in TableSession.attending_member_org_ids of the presentation's session"
    error_id: ERR_ORG_NOT_IN_SESSION
    http_status: 409
    applies_to: "POST /funding-commitments"

  - priority: 28
    category: business_constraint
    check: "CasePresentation.deferral_count < MAX_DEFERRALS (3) before the table may defer the presentation again; the requeue leg itself is unguarded"
    error_id: ERR_MAX_DEFERRALS_REACHED
    http_status: 409
    applies_to: "POST /case-presentations/{id}/decision (decision == DEFER)"

  - priority: 29
    category: business_constraint
    check: "at least one DamageItem on the case has verification_status == VERIFIED"
    error_id: ERR_NO_VERIFIED_DAMAGE
    http_status: 422
    applies_to: "POST /recovery-cases/{id}/assessments"

  - priority: 30
    category: business_referential
    check: "the pinned UnmetNeedAssessment.variant == PURPOSE_MATCHED"
    error_id: ERR_ASSESSMENT_VARIANT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /case-presentations"

  - priority: 31
    category: business_referential
    check: "the pinned UnmetNeedAssessment.verified_damage_total_cents equals RecoveryCase.verified_damage_total_cents (the determination has not been overtaken by later inspections)"
    error_id: ERR_ASSESSMENT_STALE
    http_status: 409
    applies_to: "POST /case-presentations, POST /case-presentations/{id}/requeue"

  - priority: 32
    category: business_referential
    check: "the disbursement's purpose_code appears in eligible_purpose_codes of at least one OPEN unexpired FundingSource"
    error_id: ERR_RESTRICTION_MISMATCH
    http_status: 422
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 33
    category: business_referential
    check: "ConstructionProject(predecessor_project_id).case_id == case_id in the same request"
    error_id: ERR_PREDECESSOR_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /construction-projects"

  - priority: 34
    category: business_constraint
    check: "COVERAGE_WEIGHTED skill_fit_score_bps >= MIN_FIT_BPS (6000)"
    error_id: ERR_SKILL_FIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /volunteer-deployments"

  - priority: 35
    category: business_fiscal
    check: "pledged_cents <= MemberOrganization.remaining_pledge_capacity_cents"
    error_id: ERR_PLEDGE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /funding-commitments"

  - priority: 36
    category: business_fiscal
    check: "pledged_total_cents on the presentation <= pinned assessment.unmet_need_total_cents at award time"
    error_id: ERR_AWARD_EXCEEDS_UNMET_NEED
    http_status: 422
    applies_to: "POST /case-presentations/{id}/decision (decision == AWARD)"

  - priority: 37
    category: business_fiscal
    check: "computed awarded_cents > 0 at award time"
    error_id: ERR_AWARD_ZERO
    http_status: 422
    applies_to: "POST /case-presentations/{id}/decision (decision == AWARD)"

  - priority: 38
    category: business_fiscal
    check: "sum of net_cents over this case's APPROVED and PAID disbursements plus requested_cents <= RecoveryCase.total_committed_cents"
    error_id: ERR_DISBURSEMENT_EXCEEDS_COMMITMENT
    http_status: 422
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 39
    category: business_fiscal
    check: "calculations.restricted_fund_waterfall leaves remaining_net == 0 across the eligible ordered pool"
    error_id: ERR_INSUFFICIENT_RESTRICTED_FUNDS
    http_status: 422
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 40
    category: business_constraint
    check: "closure criteria: funding_status == SATISFIED, every ConstructionProject of the case is CLOSED_OUT or CANCELLED, and at least one FollowUpContact exists (closure-review); plus residual_unmet_cents == 0 or a closure_waiver_reason, and at least one FollowUpContact with contact_type == CLOSURE_REVIEW (close)"
    error_id: ERR_CLOSURE_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /recovery-cases/{id}/closure-review, POST /recovery-cases/{id}/close"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---- Survivor ----------------------------------------------------------
  - method: POST
    path: "/survivors"
    description: "Intake a survivor household"
    roles: [IntakeSpecialist, LTRGAdmin]
    code: 201
    input: [household_name, primary_contact_phone, household_size, income_band, head_of_household_age, "has_member_with_disability?", "is_uninsured?", "consent_on_file?", "follow_up_opt_in?"]
    output: Survivor
    side_effects:
      - "computes Survivor.priority_score per calculations.survivor_priority_score"
      - "initialises open_case_count to 0"

  - method: GET
    path: "/survivors/{id}"
    description: "Read one survivor household"
    roles: [IntakeSpecialist, CaseManager, UnmetNeedsChair, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: []
    output: Survivor
    side_effects: []

  # ---- RecoveryCase ------------------------------------------------------
  - method: POST
    path: "/recovery-cases"
    description: "Open a recovery case for a survivor under a disaster declaration"
    roles: [IntakeSpecialist, LTRGAdmin]
    code: 201
    input: [survivor_id, disaster_code, assigned_case_manager_user_id, primary_residence_status, "temporary_housing_need_cents?"]
    output: RecoveryCase
    side_effects:
      - "sets case_status = INTAKE and funding_status = UNFUNDED"
      - "increments Survivor.open_case_count"

  - method: GET
    path: "/recovery-cases/{id}"
    description: "Read one recovery case including both state dimensions and all money roll-ups"
    roles: [IntakeSpecialist, CaseManager, UnmetNeedsChair, DisbursementOfficer, ConstructionManager, LTRGAdmin]
    code: 200
    input: []
    output: RecoveryCase
    side_effects: []

  - method: GET
    path: "/recovery-cases"
    description: "List recovery cases, filterable by survivor and by either state dimension"
    roles: [IntakeSpecialist, CaseManager, UnmetNeedsChair, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: ["survivor_id?", "case_status?", "funding_status?", "disaster_code?", "limit?", "offset?"]
    output: RecoveryCase[]
    side_effects: []

  - method: POST
    path: "/recovery-cases/{id}/damage-items"
    description: "Document a damage line item on the case"
    roles: [CaseManager, LTRGAdmin]
    code: 201
    input: [category, item_description, documented_cost_cents, "photo_count?", "is_habitability_critical?"]
    output: DamageItem
    side_effects:
      - "sets verification_status = UNVERIFIED and capped_cost_cents = 0"
      - "derives purpose_bucket from BUCKET_OF_CATEGORY[category]"

  - method: GET
    path: "/recovery-cases/{id}/damage-items"
    description: "List the documented damage items of a case"
    roles: [CaseManager, ConstructionManager, UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: ["verification_status?", "category?", "limit?", "offset?"]
    output: DamageItem[]
    side_effects: []

  - method: POST
    path: "/damage-items/{id}/verification"
    description: "Record the inspection outcome and verified cost for a damage item"
    roles: [ConstructionManager, LTRGAdmin]
    code: 200
    input: [verification_status, verified_cost_cents]
    output: DamageItem
    side_effects:
      - "sets verified_cost_cents, verified_by_user_id and capped_cost_cents = min(verified_cost_cents, CATEGORY_CAP_CENTS[category])"
      - "recomputes RecoveryCase.verified_damage_total_cents per calculations.verified_damage_total"
      - "increments RecoveryCase.version by 1"

  - method: POST
    path: "/recovery-cases/{id}/assistance-records"
    description: "Record assistance the household received from another source"
    roles: [CaseManager, LTRGAdmin]
    code: 201
    input: [source_type, purpose_code, awarded_cents, received_on, "documentation_status?"]
    output: AssistanceRecord
    side_effects:
      - "sets is_excluded_from_dob = false"
      - "increments RecoveryCase.version by 1"

  - method: GET
    path: "/recovery-cases/{id}/assistance-records"
    description: "List the outside assistance recorded on a case"
    roles: [CaseManager, DisbursementOfficer, UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: ["purpose_code?", "documentation_status?", "limit?", "offset?"]
    output: AssistanceRecord[]
    side_effects: []

  - method: POST
    path: "/recovery-cases/{id}/assessments"
    description: "Run an unmet-needs determination and store the immutable snapshot"
    roles: [CaseManager, LTRGAdmin]
    code: 201
    input: [variant]
    output: UnmetNeedAssessment
    side_effects:
      - "computes bucket_need_cents, bucket_offset_cents and unmet_need_total_cents per calculations.unmet_need_determination"
      - "snapshots verified_damage_total_cents and total_documented_assistance_cents"
      - "moves RecoveryCase.case_status INTAKE -> ASSESSED on the first determination"
      - "increments RecoveryCase.version by 1"

  - method: GET
    path: "/recovery-cases/{id}/assessments"
    description: "List the determination snapshots of a case"
    roles: [CaseManager, UnmetNeedsChair, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: UnmetNeedAssessment[]
    side_effects: []

  - method: GET
    path: "/recovery-cases/{id}/dob-report"
    description: "Computed read: duplication-of-benefits exposure for a purpose code across every non-INACTIVE case of the same survivor"
    roles: [CaseManager, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: [purpose_code, "requested_cents?"]
    output: "{ case_id: string, survivor_id: string, purpose_code: string, dob_pool_cents: integer, prior_disbursed_cents: integer, bucket_need_cents: integer, dob_exposure_cents: integer, sibling_case_ids: string[] }"
    side_effects: []

  - method: POST
    path: "/recovery-cases/{id}/closure-review"
    description: "Move an active case into closure review"
    roles: [CaseManager, LTRGAdmin]
    code: 200
    input: ["review_note?"]
    output: RecoveryCase
    side_effects:
      - "sets case_status = CLOSURE_PENDING"
      - "increments RecoveryCase.version by 1"

  - method: POST
    path: "/recovery-cases/{id}/close"
    description: "Close a case, or mark an un-presented case INACTIVE when withdrawn_reason is supplied"
    roles: [LTRGAdmin]
    code: 200
    input: ["closure_waiver_reason?", "withdrawn_reason?"]
    output: RecoveryCase
    side_effects:
      - "sets case_status = CLOSED (or INACTIVE when withdrawn_reason is supplied)"
      - "decrements Survivor.open_case_count"
      - "increments RecoveryCase.version by 1"

  - method: POST
    path: "/recovery-cases/{id}/reopen"
    description: "Reopen a closed case for further long-term recovery work"
    roles: [LTRGAdmin]
    code: 200
    input: [reopen_reason]
    output: RecoveryCase
    side_effects:
      - "sets case_status = ACTIVE_RECOVERY and increments reopen_count"
      - "increments Survivor.open_case_count"
      - "increments RecoveryCase.version by 1"

  - method: POST
    path: "/recovery-cases/{id}/follow-ups"
    description: "Log a long-term follow-up contact with the survivor"
    roles: [CaseManager, LTRGAdmin]
    code: 201
    input: [contact_type, contacted_on, outcome, notes]
    output: FollowUpContact
    side_effects:
      - "stores recorded_by_user_id from the acting X-User-ID"

  - method: GET
    path: "/recovery-cases/{id}/follow-ups"
    description: "List the follow-up contacts logged on a case"
    roles: [CaseManager, LTRGAdmin]
    code: 200
    input: ["contact_type?", "limit?", "offset?"]
    output: FollowUpContact[]
    side_effects: []

  # ---- MemberOrganization ------------------------------------------------
  - method: POST
    path: "/member-organizations"
    description: "Seat a member organization at the unmet needs table"
    roles: [LTRGAdmin]
    code: 201
    input: [org_name, org_type, contact_email, annual_pledge_cap_cents]
    output: MemberOrganization
    side_effects:
      - "sets status = ACTIVE, committed_cents = 0, disbursed_cents = 0 and remaining_pledge_capacity_cents = annual_pledge_cap_cents"

  - method: GET
    path: "/member-organizations/{id}"
    description: "Read one member organization including its live pledge capacity"
    roles: [UnmetNeedsChair, MemberOrgDelegate, CaseManager, LTRGAdmin]
    code: 200
    input: []
    output: MemberOrganization
    side_effects: []

  - method: POST
    path: "/member-organizations/{id}/status"
    description: "Suspend, withdraw or reinstate a member organization"
    roles: [LTRGAdmin]
    code: 200
    input: [status, "suspension_reason?"]
    output: MemberOrganization
    side_effects:
      - "sets MemberOrganization.status and suspension_reason"
      - "increments MemberOrganization.version by 1"

  # ---- TableSession ------------------------------------------------------
  - method: POST
    path: "/table-sessions"
    description: "Schedule an unmet needs table meeting"
    roles: [UnmetNeedsChair, LTRGAdmin]
    code: 201
    input: [session_label, scheduled_for, "quorum_min_member_orgs?"]
    output: TableSession
    side_effects:
      - "sets status = SCHEDULED and attending_member_org_ids = []"

  - method: GET
    path: "/table-sessions/{id}"
    description: "Read one table session including quorum and roll-up totals"
    roles: [UnmetNeedsChair, CaseManager, MemberOrgDelegate, LTRGAdmin]
    code: 200
    input: []
    output: TableSession
    side_effects: []

  - method: POST
    path: "/table-sessions/{id}/open"
    description: "Open the session, recording the attending member organizations"
    roles: [UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: [attending_member_org_ids]
    output: TableSession
    side_effects:
      - "sets status = IN_SESSION, attending_member_org_ids and chaired_by_user_id"
      - "increments TableSession.version by 1"

  - method: POST
    path: "/table-sessions/{id}/adjourn"
    description: "Adjourn (or cancel) the session, deferring every presentation still queued"
    roles: [UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: ["cancel_instead?", "minutes_note?"]
    output: TableSession
    side_effects:
      - "sets status = ADJOURNED (or CANCELLED when cancel_instead is true)"
      - "cascades every QUEUED presentation of the session to DEFERRED (deferral_count++), or straight to DENIED when its deferral_count already reached MAX_DEFERRALS — which rescinds that presentation's PLEDGED commitments, restores the pledging orgs' capacity and rewinds its case PRESENTED -> ASSESSED"
      - "recomputes queued_count and awarded_total_cents"
      - "increments TableSession.version by 1"

  # ---- CasePresentation --------------------------------------------------
  - method: POST
    path: "/case-presentations"
    description: "Queue a case with a pinned determination onto a table session"
    roles: [CaseManager, LTRGAdmin]
    code: 201
    input: [case_id, session_id, assessment_id, prepared_by_user_id, narrative]
    output: CasePresentation
    side_effects:
      - "sets status = QUEUED, snapshots priority_score_snapshot from Survivor.priority_score"
      - "recomputes queue_position for every QUEUED presentation of the session and TableSession.queued_count"
      - "moves RecoveryCase.case_status ASSESSED -> PRESENTED"
      - "increments RecoveryCase.version by 1"

  - method: GET
    path: "/case-presentations/{id}"
    description: "Read one presentation including queue position, pledged total, bridge and award"
    roles: [CaseManager, UnmetNeedsChair, MemberOrgDelegate, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: []
    output: CasePresentation
    side_effects: []

  - method: GET
    path: "/case-presentations"
    description: "List presentations, filterable by case, session, pinned assessment and status"
    roles: [CaseManager, UnmetNeedsChair, MemberOrgDelegate, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: ["case_id?", "session_id?", "assessment_id?", "status?", "limit?", "offset?"]
    output: CasePresentation[]
    side_effects: []

  - method: POST
    path: "/case-presentations/{id}/present"
    description: "Call the queue-head presentation before the table"
    roles: [UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: []
    output: CasePresentation
    side_effects:
      - "sets status = PRESENTING and queue_position = 0"
      - "recomputes queue_position of the remaining QUEUED presentations and TableSession.queued_count"
      - "increments CasePresentation.version by 1"

  - method: POST
    path: "/case-presentations/{id}/deliberate"
    description: "Open the pledge window on the presentation"
    roles: [UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: []
    output: CasePresentation
    side_effects:
      - "sets status = DELIBERATING"
      - "increments CasePresentation.version by 1"

  - method: POST
    path: "/case-presentations/{id}/decision"
    description: "Record the table's decision: AWARD, DEFER or DENY (branching, with disjoint side-effect sets)"
    roles: [UnmetNeedsChair, LTRGAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: CasePresentation
    side_effects:
      - "AWARD: computes bridge_tier, bridge_authorized_cents, awarded_cents and shortfall_cents per calculations.table_award_assembly; confirms PLEDGED commitments; sets RecoveryCase.reference_unmet_cents, total_committed_cents, residual_unmet_cents and funding_status; moves case_status PRESENTED -> ACTIVE_RECOVERY; recomputes TableSession.awarded_total_cents"
      - "DEFER: increments deferral_count only (refused with ERR_MAX_DEFERRALS_REACHED once deferral_count == MAX_DEFERRALS), leaving pledges PLEDGED and every money field untouched"
      - "DENY: rescinds PLEDGED commitments, restores MemberOrganization capacity and rewinds case_status PRESENTED -> ASSESSED"
      - "stores decided_at and decided_by_user_id and increments CasePresentation.version by 1"

  - method: POST
    path: "/case-presentations/{id}/requeue"
    description: "Requeue a deferred presentation onto another session (closes the deferral cycle)"
    roles: [CaseManager, LTRGAdmin]
    code: 200
    input: [new_session_id]
    output: CasePresentation
    side_effects:
      - "sets session_id and status = QUEUED"
      - "recomputes queue_position and queued_count on both the old and the new session"
      - "increments CasePresentation.version by 1"

  # ---- FundingCommitment -------------------------------------------------
  - method: POST
    path: "/funding-commitments"
    description: "Record a member organization's pledge against a deliberating presentation (OCC-guarded on the presentation)"
    roles: [MemberOrgDelegate, LTRGAdmin]
    code: 201
    input: [presentation_id, member_org_id, pledged_cents, purpose_code, expected_presentation_version]
    output: FundingCommitment
    side_effects:
      - "sets status = PLEDGED and pledged_by_user_id"
      - "recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents, and moves that org ACTIVE -> CAPPED when remaining_pledge_capacity_cents reaches 0 (so the org can no longer pledge on any other presentation)"
      - "recomputes CasePresentation.pledged_total_cents"
      - "increments CasePresentation.version by 1"

  - method: GET
    path: "/funding-commitments/{id}"
    description: "Read one pledge"
    roles: [UnmetNeedsChair, MemberOrgDelegate, DisbursementOfficer, CaseManager, LTRGAdmin]
    code: 200
    input: []
    output: FundingCommitment
    side_effects: []

  - method: GET
    path: "/funding-commitments"
    description: "List pledges, filterable by presentation, member organization and status"
    roles: [UnmetNeedsChair, MemberOrgDelegate, DisbursementOfficer, CaseManager, LTRGAdmin]
    code: 200
    input: ["presentation_id?", "member_org_id?", "status?", "limit?", "offset?"]
    output: FundingCommitment[]
    side_effects: []

  - method: POST
    path: "/funding-commitments/{id}/rescind"
    description: "Rescind a pledge; on a CONFIRMED pledge this is the compensating action that restores pledge capacity exactly"
    roles: [MemberOrgDelegate, LTRGAdmin]
    code: 200
    input: [rescission_reason]
    output: FundingCommitment
    side_effects:
      - "sets status = RESCINDED"
      - "recomputes MemberOrganization.committed_cents and remaining_pledge_capacity_cents and moves status CAPPED -> ACTIVE when capacity is restored"
      - "recomputes CasePresentation.pledged_total_cents, awarded_cents and shortfall_cents"
      - "recomputes RecoveryCase.total_committed_cents, residual_unmet_cents and funding_status, and rewinds case_status CLOSURE_PENDING -> ACTIVE_RECOVERY when applicable"
      - "increments FundingCommitment.version by 1"

  # ---- FundingSource -----------------------------------------------------
  - method: POST
    path: "/funding-sources"
    description: "Register assembled funding: a donation, foundation grant, government grant, in-kind material lot or member transfer"
    roles: [LTRGAdmin]
    code: 201
    input: [label, source_type, restriction_code, total_cents, "expires_on?", "admin_retention_allowed?"]
    output: FundingSource
    side_effects:
      - "derives eligible_purpose_codes and restriction_specificity from restriction_code"
      - "sets committed_cents, disbursed_cents and admin_retained_cents to 0, available_cents = total_cents and status = OPEN"

  - method: GET
    path: "/funding-sources/{id}"
    description: "Read one funding source including the restricted-use ledger"
    roles: [DisbursementOfficer, LTRGAdmin, UnmetNeedsChair]
    code: 200
    input: []
    output: FundingSource
    side_effects: []

  - method: GET
    path: "/funding-sources"
    description: "List funding sources, filterable by restriction and status"
    roles: [DisbursementOfficer, LTRGAdmin, UnmetNeedsChair]
    code: 200
    input: ["restriction_code?", "status?", "source_type?", "limit?", "offset?"]
    output: FundingSource[]
    side_effects: []

  # ---- Disbursement ------------------------------------------------------
  - method: POST
    path: "/disbursements"
    description: "Request an assistance payment; duplication-of-benefits is evaluated immediately and forks the row to DOB_CLEARED or DOB_FLAGGED (OCC-guarded on the case)"
    roles: [DisbursementOfficer, LTRGAdmin]
    code: 201
    input: [case_id, purpose_code, requested_cents, payee_name, expected_case_version, "project_id?", "commitment_id?"]
    output: Disbursement
    side_effects:
      - "computes dob_pool_cents and dob_exposure_cents per calculations.dob_exposure_check"
      - "sets status = DOB_CLEARED when dob_exposure_cents == 0, else DOB_FLAGGED"
      - "stores requested_by_user_id"
      - "increments RecoveryCase.version by 1"

  - method: GET
    path: "/disbursements/{id}"
    description: "Read one disbursement including its duplication-of-benefits figures and waterfall allocation lines"
    roles: [DisbursementOfficer, LTRGAdmin, CaseManager]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/disbursements"
    description: "List disbursements, filterable by case, project, retired commitment and status"
    roles: [DisbursementOfficer, LTRGAdmin, CaseManager]
    code: 200
    input: ["case_id?", "project_id?", "commitment_id?", "status?", "purpose_code?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: POST
    path: "/disbursements/{id}/dob-resolution"
    description: "Resolve a duplication-of-benefits flag by excluding named assistance records, then re-evaluate (cycles DOB_FLAGGED -> REQUESTED -> DOB_CLEARED or back to DOB_FLAGGED)"
    roles: [DisbursementOfficer, LTRGAdmin]
    code: 200
    input: [dob_resolution_note, excluded_assistance_record_ids]
    output: Disbursement
    side_effects:
      - "sets AssistanceRecord.is_excluded_from_dob = true and exclusion_note on each listed record"
      - "re-runs calculations.dob_exposure_check and re-forks the row"
      - "increments Disbursement.version by 1"

  - method: POST
    path: "/disbursements/{id}/approve"
    description: "Approve a cleared request, running the restricted-fund waterfall (segregation of duties: approver must differ from requester)"
    roles: [LTRGAdmin]
    code: 200
    input: ["approval_note?"]
    output: Disbursement
    side_effects:
      - "re-runs calculations.dob_exposure_check as a precondition"
      - "sets allocation_lines, net_cents, admin_retained_cents and gross_cents per calculations.restricted_fund_waterfall"
      - "increments FundingSource.committed_cents per drawn line and moves any drawn source OPEN -> EXHAUSTED at available_cents == 0"
      - "stores approved_by_user_id and sets status = APPROVED"
      - "increments Disbursement.version by 1"

  - method: POST
    path: "/disbursements/{id}/pay"
    description: "Pay an approved disbursement, converting committed funds into disbursed funds and retention"
    roles: [DisbursementOfficer, LTRGAdmin]
    code: 200
    input: ["payment_reference?"]
    output: Disbursement
    side_effects:
      - "per line moves gross out of FundingSource.committed_cents into disbursed_cents and admin_retained_cents leaving available_cents unchanged"
      - "moves a linked FundingCommitment CONFIRMED -> DISBURSED"
      - "recomputes RecoveryCase.total_net_disbursed_cents and funding_status"
      - "sets status = PAID and increments Disbursement.version by 1"

  - method: POST
    path: "/disbursements/{id}/reverse"
    description: "Reverse a paid disbursement; the compensating action must leave every drawn FundingSource's conservation identity intact"
    roles: [LTRGAdmin]
    code: 200
    input: [reversal_reason]
    output: Disbursement
    side_effects:
      - "per line decrements FundingSource.disbursed_cents and admin_retained_cents, restoring available_cents"
      - "moves any restored source EXHAUSTED -> OPEN"
      - "recomputes RecoveryCase.total_net_disbursed_cents and funding_status, and rewinds case_status CLOSURE_PENDING -> ACTIVE_RECOVERY"
      - "moves a linked FundingCommitment DISBURSED -> CONFIRMED"
      - "sets status = REVERSED and increments Disbursement.version by 1"

  - method: POST
    path: "/disbursements/{id}/void"
    description: "Void a request that was never approved"
    roles: [DisbursementOfficer, LTRGAdmin]
    code: 200
    input: [void_reason]
    output: Disbursement
    side_effects:
      - "sets status = VOIDED without touching any FundingSource field"
      - "increments Disbursement.version by 1"

  # ---- ConstructionProject ----------------------------------------------
  - method: POST
    path: "/construction-projects"
    description: "Scope a repair or rebuild phase for a case, optionally chained behind a predecessor phase"
    roles: [ConstructionManager, LTRGAdmin]
    code: 201
    input: [case_id, scope_code, required_trade_hours, estimated_material_cents, "critical_trades?", "predecessor_project_id?"]
    output: ConstructionProject
    side_effects:
      - "sets status = SCOPED and volunteer_hours_logged = 0"

  - method: GET
    path: "/construction-projects/{id}"
    description: "Read one construction project"
    roles: [ConstructionManager, VolunteerCoordinator, CaseManager, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: []

  - method: GET
    path: "/construction-projects"
    description: "List construction projects, filterable by case, predecessor phase and status"
    roles: [ConstructionManager, VolunteerCoordinator, CaseManager, DisbursementOfficer, LTRGAdmin]
    code: 200
    input: ["case_id?", "predecessor_project_id?", "status?", "scope_code?", "limit?", "offset?"]
    output: ConstructionProject[]
    side_effects: []

  - method: POST
    path: "/construction-projects/{id}/transition"
    description: "Advance a project: PERMIT, START, SUSPEND, RESUME, PUNCHLIST, CLOSE_OUT or CANCEL"
    roles: [ConstructionManager, LTRGAdmin]
    code: 200
    input: [action, "reason?", "permit_number?"]
    output: ConstructionProject
    side_effects:
      - "applies the §1.2 ConstructionProject transition for the requested action"
      - "SUSPEND and CANCEL cascade: cancel live VolunteerDeployments, release the affected ACTIVE HousingAssignments, then recompute LodgingSite.peak_committed_beds and LodgingSite.status"
      - "increments ConstructionProject.version by 1"

  - method: GET
    path: "/construction-projects/{id}/skill-fit"
    description: "Computed read: skill-fit score of a volunteer group against this project for a date window, in either variant"
    roles: [VolunteerCoordinator, ConstructionManager, LTRGAdmin]
    code: 200
    input: [group_id, variant, arrival_date, departure_date]
    output: "{ project_id: string, group_id: string, variant: string, day_count: integer, weighted_covered: integer, weighted_required: integer, score_bps: integer, meets_minimum: boolean }"
    side_effects: []

  # ---- VolunteerGroup / Deployment --------------------------------------
  - method: POST
    path: "/volunteer-groups"
    description: "Register a visiting volunteer group with its skill profile and housing need"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 201
    input: [group_name, home_organization, member_count, skill_profile, "requires_housing?", "brings_own_tools?"]
    output: VolunteerGroup
    side_effects:
      - "sets active_deployment_count = 0"

  - method: GET
    path: "/volunteer-groups/{id}"
    description: "Read one volunteer group"
    roles: [VolunteerCoordinator, ConstructionManager, LTRGAdmin]
    code: 200
    input: []
    output: VolunteerGroup
    side_effects: []

  - method: POST
    path: "/volunteer-deployments"
    description: "Deploy a volunteer group to a project for a closed date window, gated by the COVERAGE_WEIGHTED skill-fit score and the turnaround-buffer overlap rule"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 201
    input: [group_id, project_id, arrival_date, departure_date]
    output: VolunteerDeployment
    side_effects:
      - "computes day_count, crew_hours_committed and skill_fit_score_bps (COVERAGE_WEIGHTED)"
      - "sets status = REQUESTED"
      - "recomputes ConstructionProject.confirmed_deployment_count and VolunteerGroup.active_deployment_count"

  - method: GET
    path: "/volunteer-deployments/{id}"
    description: "Read one deployment"
    roles: [VolunteerCoordinator, ConstructionManager, LTRGAdmin]
    code: 200
    input: []
    output: VolunteerDeployment
    side_effects: []

  - method: GET
    path: "/volunteer-deployments"
    description: "List deployments, filterable by group, project and status"
    roles: [VolunteerCoordinator, ConstructionManager, LTRGAdmin]
    code: 200
    input: ["group_id?", "project_id?", "status?", "limit?", "offset?"]
    output: VolunteerDeployment[]
    side_effects: []

  - method: POST
    path: "/volunteer-deployments/{id}/transition"
    description: "Advance a deployment: CONFIRM, CANCEL or COMPLETE"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 200
    input: [action, "hours_logged?", "cancellation_reason?"]
    output: VolunteerDeployment
    side_effects:
      - "applies the §1.2 VolunteerDeployment transition for the requested action"
      - "COMPLETE increments ConstructionProject.volunteer_hours_logged"
      - "CANCEL from CONFIRMED releases the group's intersecting ACTIVE HousingAssignments and recomputes LodgingSite.peak_committed_beds and status"
      - "increments VolunteerDeployment.version by 1"

  # ---- LodgingSite / HousingAssignment ----------------------------------
  - method: POST
    path: "/lodging-sites"
    description: "Register a host lodging site for volunteer group hosting"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 201
    input: [site_name, bed_capacity, "has_showers?", "nightly_cost_cents?"]
    output: LodgingSite
    side_effects:
      - "sets peak_committed_beds = 0, available_beds = bed_capacity and status = OPEN"

  - method: GET
    path: "/lodging-sites/{id}"
    description: "Read one lodging site including its peak committed beds"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 200
    input: []
    output: LodgingSite
    side_effects: []

  - method: POST
    path: "/housing-assignments"
    description: "Host a volunteer group at a lodging site over a half-open night interval, gated by per-night aggregate bed capacity"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 201
    input: [group_id, lodging_site_id, check_in_date, check_out_date]
    output: HousingAssignment
    side_effects:
      - "copies beds_requested from VolunteerGroup.member_count and computes night_count"
      - "sets status = ACTIVE"
      - "recomputes LodgingSite.peak_committed_beds and available_beds and moves LodgingSite.status OPEN -> FULL at capacity"
      - "increments LodgingSite.version by 1"

  - method: GET
    path: "/housing-assignments/{id}"
    description: "Read one housing assignment"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 200
    input: []
    output: HousingAssignment
    side_effects: []

  - method: GET
    path: "/housing-assignments"
    description: "List housing assignments, filterable by group, site and status"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 200
    input: ["group_id?", "lodging_site_id?", "status?", "limit?", "offset?"]
    output: HousingAssignment[]
    side_effects: []

  - method: POST
    path: "/housing-assignments/{id}/release"
    description: "Release a housing assignment, freeing the beds it held"
    roles: [VolunteerCoordinator, LTRGAdmin]
    code: 200
    input: [release_reason]
    output: HousingAssignment
    side_effects:
      - "sets status = RELEASED, released_at = the current logical clock, and release_reason"
      - "recomputes LodgingSite.peak_committed_beds and available_beds and moves LodgingSite.status FULL -> OPEN when the peak falls below bed_capacity"
      - "increments LodgingSite.version by 1"

  # ---- Test-driving endpoint (last resort per the §1.5 priority ladder) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Setting the clock also expires funding sources whose expires_on has passed."
    roles: [LTRGAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_funding_source_ids: string[] }"
    side_effects:
      - "sets the logical clock used by every date comparison, decided_at stamp and expiry check"
      - "moves every FundingSource with status == OPEN and expires_on < the new current date to EXPIRED"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_ORG_IDENTITY_MISMATCH
    http: 403
    condition: "MemberOrgDelegate acts on a pledge whose member_org_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "chair deciding a presentation is the case's assigned case manager, or the LTRGAdmin approving a disbursement is the officer who requested it"
  - id: ERR_CASE_MANAGER_MISMATCH
    http: 403
    condition: "prepared_by_user_id does not equal both the acting X-User-ID and RecoveryCase.assigned_case_manager_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, illegal enum value, negative amount, or limit/offset outside 1..100 / >= 0"
  - id: ERR_SURVIVOR_NOT_FOUND
    http: 404
    condition: "survivor id in path or body does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "recovery case id in path or body does not resolve"
  - id: ERR_DAMAGE_ITEM_NOT_FOUND
    http: 404
    condition: "damage item id in path does not resolve"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id in body does not resolve"
  - id: ERR_MEMBER_ORG_NOT_FOUND
    http: 404
    condition: "member organization id in path or body (including attending_member_org_ids) does not resolve"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "table session id in path or body does not resolve"
  - id: ERR_PRESENTATION_NOT_FOUND
    http: 404
    condition: "case presentation id in path or body does not resolve"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "funding commitment id in path or body does not resolve"
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "funding source id in path does not resolve"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "disbursement id in path does not resolve"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "construction project id in path or body (project_id, predecessor_project_id) does not resolve"
  - id: ERR_VOLUNTEER_GROUP_NOT_FOUND
    http: 404
    condition: "volunteer group id in path or body does not resolve"
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "volunteer deployment id in path does not resolve"
  - id: ERR_LODGING_SITE_NOT_FOUND
    http: 404
    condition: "lodging site id in path or body does not resolve"
  - id: ERR_HOUSING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "housing assignment id in path does not resolve"
  - id: ERR_CASE_NOT_ASSESSABLE
    http: 409
    condition: "case_status is CLOSURE_PENDING, CLOSED or INACTIVE when documenting damage, recording assistance or running a determination"
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "case_status is not a declared `from` state for the requested case transition"
  - id: ERR_SESSION_NOT_ACCEPTING_QUEUE
    http: 409
    condition: "target TableSession.status is not SCHEDULED or IN_SESSION when queueing or requeueing"
  - id: ERR_SESSION_NOT_IN_SESSION
    http: 409
    condition: "TableSession.status is not IN_SESSION when presenting, deliberating, deciding or pledging"
  - id: ERR_SESSION_HAS_ACTIVE_PRESENTATION
    http: 409
    condition: "adjourning a session that still has a PRESENTING or DELIBERATING presentation"
  - id: ERR_PRESENTATION_INVALID_STATE
    http: 409
    condition: "presentation status is not a declared `from` state for the requested presentation transition"
  - id: ERR_PRESENTATION_ALREADY_ACTIVE
    http: 409
    condition: "the case already has a CasePresentation with status IN {QUEUED, PRESENTING, DELIBERATING}"
  - id: ERR_PRESENTATION_NOT_ACCEPTING_PLEDGES
    http: 409
    condition: "pledging against a presentation whose status is not DELIBERATING"
  - id: ERR_COMMITMENT_INVALID_STATE
    http: 409
    condition: "rescinding a commitment already RESCINDED or DISBURSED, or whose linked disbursement is APPROVED or PAID"
  - id: ERR_DISBURSEMENT_INVALID_STATE
    http: 409
    condition: "disbursement status is not a declared `from` state for the requested disbursement transition"
  - id: ERR_PROJECT_INVALID_TRANSITION
    http: 409
    condition: "requested project action is not declared from the project's current status, or PUNCHLIST is requested while live deployments remain, or CLOSE_OUT is requested while an unpaid disbursement targets the project"
  - id: ERR_DEPLOYMENT_INVALID_TRANSITION
    http: 409
    condition: "requested deployment action is not declared from the deployment's current status"
  - id: ERR_HOUSING_ALREADY_RELEASED
    http: 409
    condition: "releasing a housing assignment whose status is already RELEASED"
  - id: ERR_DAMAGE_ITEM_ALREADY_VERIFIED
    http: 409
    condition: "recording verification on a damage item whose verification_status is not UNVERIFIED"
  - id: ERR_MEMBER_ORG_NOT_ACTIVE
    http: 409
    condition: "pledging as a MemberOrganization whose status is CAPPED, SUSPENDED or WITHDRAWN"
  - id: ERR_PROJECT_NOT_PAYABLE
    http: 409
    condition: "approving a STRUCTURE_REPAIR disbursement whose ConstructionProject is not PERMITTED, IN_PROGRESS or PUNCHLIST"
  - id: ERR_PROJECT_NOT_ACCEPTING_VOLUNTEERS
    http: 409
    condition: "creating or confirming a deployment on a project that is not PERMITTED or IN_PROGRESS"
  - id: ERR_PREDECESSOR_NOT_COMPLETE
    http: 409
    condition: "permitting a project whose predecessor phase is not CLOSED_OUT"
  - id: ERR_PREDECESSOR_CASE_MISMATCH
    http: 422
    condition: "predecessor_project_id belongs to a different RecoveryCase than case_id"
  - id: ERR_STALE_PRESENTATION_VERSION
    http: 412
    condition: "expected_presentation_version does not equal CasePresentation.version"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal RecoveryCase.version"
  - id: ERR_NO_VERIFIED_DAMAGE
    http: 422
    condition: "running a determination on a case with zero DamageItem rows in verification_status VERIFIED"
  - id: ERR_ASSESSMENT_STALE
    http: 409
    condition: "the pinned assessment's verified_damage_total_cents no longer equals RecoveryCase.verified_damage_total_cents"
  - id: ERR_ASSESSMENT_VARIANT_NOT_ELIGIBLE
    http: 422
    condition: "pinning a POOLED assessment to a case presentation"
  - id: ERR_ASSESSMENT_CASE_MISMATCH
    http: 422
    condition: "assessment_id belongs to a different RecoveryCase than case_id"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "opening a session with fewer attending member organizations than quorum_min_member_orgs"
  - id: ERR_ORG_NOT_IN_SESSION
    http: 409
    condition: "pledging as an organization absent from the session's attending_member_org_ids"
  - id: ERR_NOT_AT_QUEUE_HEAD
    http: 409
    condition: "presenting a queued presentation whose queue_position is not 1"
  - id: ERR_MAX_DEFERRALS_REACHED
    http: 409
    condition: "the table votes DEFER on a presentation whose deferral_count has already reached MAX_DEFERRALS (3)"
  - id: ERR_DUPLICATION_OF_BENEFITS
    http: 422
    condition: "approving a disbursement whose re-run duplication-of-benefits exposure is greater than 0"
  - id: ERR_RESTRICTION_MISMATCH
    http: 422
    condition: "approving a disbursement whose purpose_code appears in no OPEN unexpired funding source's eligible_purpose_codes"
  - id: ERR_INSUFFICIENT_RESTRICTED_FUNDS
    http: 422
    condition: "the eligible funding-source waterfall cannot cover requested_cents in full"
  - id: ERR_DISBURSEMENT_EXCEEDS_COMMITMENT
    http: 422
    condition: "approving a disbursement would push the case's approved-plus-paid net above total_committed_cents"
  - id: ERR_PLEDGE_CAP_EXCEEDED
    http: 422
    condition: "pledged_cents exceeds the organization's remaining_pledge_capacity_cents"
  - id: ERR_AWARD_EXCEEDS_UNMET_NEED
    http: 422
    condition: "awarding when pledged_total_cents already exceeds the pinned assessment's unmet_need_total_cents"
  - id: ERR_AWARD_ZERO
    http: 422
    condition: "awarding when the computed awarded_cents is 0"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "departure_date < arrival_date, check_out_date <= check_in_date, or a start date before the logical clock's current date"
  - id: ERR_DEPLOYMENT_WINDOW_CONFLICT
    http: 409
    condition: "the requested deployment window collides with another live deployment of the same group once the turnaround buffer is applied"
  - id: ERR_LODGING_CAPACITY_EXCEEDED
    http: 409
    condition: "some night in the requested half-open interval would exceed the lodging site's bed_capacity"
  - id: ERR_SKILL_FIT_BELOW_MINIMUM
    http: 422
    condition: "the COVERAGE_WEIGHTED skill-fit score is below MIN_FIT_BPS"
  - id: ERR_CLOSURE_CRITERIA_NOT_MET
    http: 409
    condition: "closure review or closure attempted while the funding, project, residual-need or follow-up criteria are unmet"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: IntakeSpecialist
    description: "Takes survivor intake and opens recovery cases; sees no money and no table decisions"
    identity: opaque
    exclusive_operations:
      - "POST /survivors"
      - "POST /recovery-cases"
    shared_operations:
      - "GET /survivors/{id}"
      - "GET /recovery-cases/{id}"
      - "GET /recovery-cases"

  - name: CaseManager
    description: "Owns a case: documents damage, records outside assistance, runs determinations, queues the case at the table, logs follow-up and drives closure review"
    identity: opaque
    exclusive_operations:
      - "POST /recovery-cases/{id}/damage-items"
      - "POST /recovery-cases/{id}/assistance-records"
      - "POST /recovery-cases/{id}/assessments"
      - "POST /case-presentations"
      - "POST /case-presentations/{id}/requeue"
      - "POST /recovery-cases/{id}/follow-ups"
      - "POST /recovery-cases/{id}/closure-review"
    shared_operations:
      - "GET /survivors/{id}"
      - "GET /recovery-cases/{id}"
      - "GET /recovery-cases"
      - "GET /recovery-cases/{id}/damage-items"
      - "GET /recovery-cases/{id}/assistance-records"
      - "GET /recovery-cases/{id}/assessments"
      - "GET /recovery-cases/{id}/dob-report"
      - "GET /recovery-cases/{id}/follow-ups"
      - "GET /case-presentations/{id}"
      - "GET /case-presentations"
      - "GET /funding-commitments/{id}"
      - "GET /funding-commitments"
      - "GET /member-organizations/{id}"
      - "GET /table-sessions/{id}"
      - "GET /construction-projects/{id}"
      - "GET /construction-projects"
      - "GET /disbursements/{id}"
      - "GET /disbursements"

  - name: UnmetNeedsChair
    description: "Chairs the unmet needs table: schedules and opens sessions, calls presentations and records AWARD/DEFER/DENY decisions. May not decide a case they case-manage."
    identity: opaque
    exclusive_operations:
      - "POST /table-sessions/{id}/open"
      - "POST /table-sessions/{id}/adjourn"
      - "POST /case-presentations/{id}/present"
      - "POST /case-presentations/{id}/deliberate"
      - "POST /case-presentations/{id}/decision"
    shared_operations:
      - "POST /table-sessions"
      - "GET /table-sessions/{id}"
      - "GET /survivors/{id}"
      - "GET /recovery-cases/{id}"
      - "GET /recovery-cases"
      - "GET /recovery-cases/{id}/damage-items"
      - "GET /recovery-cases/{id}/assistance-records"
      - "GET /recovery-cases/{id}/assessments"
      - "GET /case-presentations/{id}"
      - "GET /case-presentations"
      - "GET /funding-commitments/{id}"
      - "GET /funding-commitments"
      - "GET /member-organizations/{id}"
      - "GET /funding-sources/{id}"
      - "GET /funding-sources"

  - name: MemberOrgDelegate
    description: "Delegate of a seated member organization; pledges and rescinds only on behalf of their own organization"
    identity: "entity_backed:MemberOrganization"
    exclusive_operations:
      - "POST /funding-commitments"
      - "POST /funding-commitments/{id}/rescind"
    shared_operations:
      - "GET /funding-commitments/{id}"
      - "GET /funding-commitments"
      - "GET /member-organizations/{id}"
      - "GET /table-sessions/{id}"
      - "GET /case-presentations/{id}"
      - "GET /case-presentations"

  - name: DisbursementOfficer
    description: "Requests, resolves duplication-of-benefits findings on, pays and voids assistance payments; may never approve their own request"
    identity: opaque
    exclusive_operations:
      - "POST /disbursements"
      - "POST /disbursements/{id}/dob-resolution"
      - "POST /disbursements/{id}/pay"
      - "POST /disbursements/{id}/void"
    shared_operations:
      - "GET /disbursements/{id}"
      - "GET /disbursements"
      - "GET /recovery-cases/{id}"
      - "GET /recovery-cases"
      - "GET /recovery-cases/{id}/dob-report"
      - "GET /recovery-cases/{id}/assistance-records"
      - "GET /recovery-cases/{id}/assessments"
      - "GET /survivors/{id}"
      - "GET /funding-sources/{id}"
      - "GET /funding-sources"
      - "GET /funding-commitments/{id}"
      - "GET /funding-commitments"
      - "GET /case-presentations/{id}"
      - "GET /case-presentations"
      - "GET /construction-projects/{id}"
      - "GET /construction-projects"

  - name: ConstructionManager
    description: "Verifies damage costs by inspection and drives repair/rebuild phases through their lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /damage-items/{id}/verification"
      - "POST /construction-projects/{id}/transition"
    shared_operations:
      - "POST /construction-projects"
      - "GET /construction-projects/{id}"
      - "GET /construction-projects"
      - "GET /construction-projects/{id}/skill-fit"
      - "GET /recovery-cases/{id}"
      - "GET /recovery-cases/{id}/damage-items"
      - "GET /volunteer-groups/{id}"
      - "GET /volunteer-deployments/{id}"
      - "GET /volunteer-deployments"

  - name: VolunteerCoordinator
    description: "Registers volunteer groups and lodging sites, matches skills to project needs, and hosts groups"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-groups"
      - "POST /volunteer-deployments"
      - "POST /volunteer-deployments/{id}/transition"
      - "POST /housing-assignments"
      - "POST /housing-assignments/{id}/release"
    shared_operations:
      - "POST /lodging-sites"
      - "GET /volunteer-groups/{id}"
      - "GET /volunteer-deployments/{id}"
      - "GET /volunteer-deployments"
      - "GET /lodging-sites/{id}"
      - "GET /housing-assignments/{id}"
      - "GET /housing-assignments"
      - "GET /construction-projects/{id}"
      - "GET /construction-projects"
      - "GET /construction-projects/{id}/skill-fit"

  - name: LTRGAdmin
    description: "Long-term recovery group administrator: assembles funding, seats member organizations, approves and reverses disbursements, closes and reopens cases, and drives the logical clock. Superset of every other role's write surface EXCEPT that segregation of duties still bars approving a disbursement they requested."
    identity: opaque
    exclusive_operations:
      - "POST /member-organizations"
      - "POST /member-organizations/{id}/status"
      - "POST /funding-sources"
      - "POST /disbursements/{id}/approve"
      - "POST /disbursements/{id}/reverse"
