          rationale: "That §1.8 instance walks dispute_state NONE -> DISPUTE_OPEN -> DISPUTE_RESOLVED_UPHELD -> DISPUTE_OPEN while asserting status == OWNER_ACKNOWLEDGED at every hop, which is exactly the parallel-dimension claim."

