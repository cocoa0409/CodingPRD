            - "${minute_720} == 720; ${dp_720} == LUNCH with ${layout_720} == WEST_LUNCH and ${phase_720} == ACTIVE — the child slot shadows the ancestor's LUNCH"
            - "${dp_920} is null with ${layout_920} == STATIC_FALLBACK and ${phase_920} == FALLBACK — the ancestor's LUNCH was shadowed out of the candidate set entirely, so 920 is uncovered"
