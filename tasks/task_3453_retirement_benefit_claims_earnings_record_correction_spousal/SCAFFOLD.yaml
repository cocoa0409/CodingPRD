# =============================================================================
# PRD Benchmark Scaffold — SSA Retirement Benefit Claims, Earnings Record
# Correction & Spousal Entitlement
# =============================================================================

scenario: |
  Retirement Benefit Claims, Earnings Record Correction & Spousal Entitlement (Social Security Administration): earnings record construction from employer wage reports with correction requests for missing or misposted years, benefit computation from indexed earnings with the highest years selected and the bend point formula applied, claiming age effects with reductions for early claiming and delayed retirement credits accrued monthly, spousal, divorced spouse and survivor entitlement rules with dual entitlement offsets, government pension offset and windfall elimination adjustments for non-covered employment, withdrawal of application and voluntary suspension options with narrow deadlines, representative payee determination when a beneficiary cannot manage funds, overpayment detection, waiver requests and recovery from future benefits

domain_name: retirement-benefit-claims
api_prefix: /ssa

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat            # peer entities linked by FKs; URL paths stay shallow
  state_machine_shape: cyclic      # suspend/resume, evidence-request, denial-reopen, payee-restore loops
  relationship_patterns:
    - one_to_many                  # Worker -> EarningsYear/WageReport/CorrectionRequest/Claim
    - self_referential             # Relationship links Worker <-> Worker (spouse)
    - cross_aggregate              # BenefitClaim -> Relationship; OverpaymentCase -> BenefitClaim
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker full legal name" }
      - { name: birth_year, type: integer, source: input, description: "4-digit birth year", constraints: "1900..2100" }
      - { name: birth_month, type: integer, source: input, description: "Birth month 1-12", constraints: "1..12" }
      - { name: noncovered_pension_monthly_cents, type: integer, source: input, description: "Monthly pension from employment not covered by Social Security; 0 when none", default: 0, constraints: ">= 0" }
      - { name: noncovered_pension_start_month, type: string, source: input, description: "First month (YYYY-MM) the non-covered pension is received; null when none", default: null }
      - { name: status, type: enum, source: system, description: "LIVING | DECEASED", default: LIVING }
      - { name: death_date, type: string, source: system, description: "YYYY-MM-DD date of death set by report-death; null while LIVING", default: null }
      - { name: fra_months, type: integer, source: computed, description: "Full retirement age in months: 804 when birth_year >= 1960, else 792" }
      - { name: age_months, type: integer, source: computed, description: "Age in whole months at the logical clock: (clock_year - birth_year)*12 + (clock_month - birth_month)" }
      - { name: eligibility_year, type: integer, source: computed, description: "Benefit eligibility year = birth_year + 62 (drives indexation and bend points)" }
      - { name: withdrawal_used, type: boolean, source: system, description: "True after any claim of this worker has been WITHDRAWN; withdrawal is once per lifetime", default: false }

  - name: EarningsYear
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id; owner of this earnings row" }
      - { name: tax_year, type: integer, source: system, description: "Calendar year of earnings; unique per worker (upserted by wage reports)" }
      - { name: posted_earnings_cents, type: integer, source: computed, description: "Creditable covered earnings: min(sum of posted_amount_cents over covered POSTED wage reports, TAXABLE_MAX_CENTS(tax_year)); overwritten by an APPROVED correction" }
      - { name: noncovered_earnings_cents, type: integer, source: computed, description: "Sum of posted_amount_cents over wage reports with covered_employment=false; informational only, never enters AIME", default: 0 }
      - { name: corrected, type: boolean, source: system, description: "True once an APPROVED CorrectionRequest has set this row", default: false }
      - { name: indexed_earnings_cents, type: integer, source: computed, description: "Per earnings_indexation: posted_earnings_cents indexed to eligibility_year-2 wage level; face value for tax_year >= eligibility_year-2" }

  - name: WageReport
    parent: null
    common_fields: false
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; worker credited" }
      - { name: employer_name, type: string, source: input, description: "Reporting employer name" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year wages were earned", constraints: "1986..2100" }
      - { name: amount_cents, type: integer, source: input, description: "Gross wages reported", constraints: "> 0" }
      - { name: covered_employment, type: boolean, source: input, description: "Whether the employment is covered by Social Security", default: true }
      - { name: posted_amount_cents, type: integer, source: computed, description: "Amount actually credited after applying the remaining taxable-maximum headroom for (worker_id, tax_year) in created_at order" }
      - { name: status, type: enum, source: system, description: "POSTED (only state; reports are immutable once accepted)", default: POSTED }

  - name: CorrectionRequest
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; worker whose earnings record is disputed" }
      - { name: tax_year, type: integer, source: input, description: "Disputed tax year" }
      - { name: claimed_earnings_cents, type: integer, source: input, description: "Earnings the requester claims for that year", constraints: ">= 0" }
      - { name: evidence_type, type: enum, source: input, description: "WAGE_STATEMENT | TAX_RETURN | EMPLOYER_LETTER | OTHER" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | EVIDENCE_REQUESTED | APPROVED | DENIED | EXPIRED", default: PENDING_REVIEW }
      - { name: statute_deadline, type: string, source: computed, description: "Last date a correction may be approved: (tax_year+4)-04-15 (3 years, 3 months, 15 days after the tax year closes)" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the ClaimsSpecialist who approved or denied", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the APPROVED/DENIED decision", default: null }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on denial", default: null }

  - name: Relationship
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; covered worker on whose record auxiliary benefits are claimed" }
      - { name: spouse_worker_id, type: string, source: input, description: "FK -> Worker.id; spouse/divorced-spouse/widow claimant's own worker record" }
      - { name: relationship_type, type: enum, source: input, description: "CURRENT_SPOUSE | DIVORCED_SPOUSE | WIDOW" }
      - { name: marriage_date, type: string, source: input, description: "YYYY-MM-DD marriage start" }
      - { name: divorce_date, type: string, source: input, description: "YYYY-MM-DD divorce finalization; null unless DIVORCED_SPOUSE", default: null }
      - { name: status, type: enum, source: system, description: "ASSERTED | VERIFIED | REJECTED", default: ASSERTED }
      - { name: marriage_months, type: integer, source: computed, description: "Whole months from marriage_date to the earliest of divorce_date, covered worker death_date, or the logical clock" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verification", default: null }

  - name: BenefitClaim
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; the claimant's own worker record" }
      - { name: claim_type, type: enum, source: input, description: "RETIREMENT | SPOUSAL | DIVORCED_SPOUSAL | SURVIVOR" }
      - { name: entitlement_month, type: string, source: input, description: "First month (YYYY-MM) of benefit entitlement" }
      - { name: relationship_id, type: string, source: input, description: "FK -> Relationship.id; REQUIRED for SPOUSAL | DIVORCED_SPOUSAL | SURVIVOR, forbidden for RETIREMENT", default: null }
      - { name: status, type: enum, source: system, description: "FILED | ENTITLED | DENIED | SUSPENDED | WITHDRAWN | TERMINATED", default: FILED }
      - { name: claiming_age_months, type: integer, source: computed, description: "Claimant age in whole months at entitlement_month" }
      - { name: aime_cents, type: integer, source: computed, description: "Average indexed monthly earnings per aime_computation (RETIREMENT claims; auxiliary claims carry the covered worker's PIA context instead)" }
      - { name: pia_cents, type: integer, source: computed, description: "Primary insurance amount per pia_bend_point / wep_adjusted_pia at approve time" }
      - { name: reduction_months, type: integer, source: computed, description: "Months claimed before FRA (0 when claiming at/after FRA)" }
      - { name: drc_months, type: integer, source: system, description: "Delayed retirement credits accrued: months after FRA with no payment, capped at age 70; recomputed on resume", default: 0 }
      - { name: monthly_benefit_cents, type: integer, source: computed, description: "Current monthly benefit after age adjustment, WEP/GPO, family maximum, and COLA; 0 while FILED/DENIED/WITHDRAWN/TERMINATED" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Sum of net_paid_cents over this claim's BenefitPayment rows with status PAID or WITHHELD_FULL" }
      - { name: underpayment_credit_cents, type: integer, source: system, description: "Outstanding underpayment credit pool added in full to the next generated payment", default: 0 }
      - { name: recovery_mode, type: enum, source: system, description: "FULL | PARTIAL | PROPORTIONAL — withholding policy elected by the most recent begin-recovery call on this claim", default: FULL }
      - { name: has_active_payee, type: boolean, source: system, description: "True while a PayeeCase for this claim is ACTIVE", default: false }
      - { name: suspended_since, type: string, source: system, description: "Month (YYYY-MM) voluntary suspension took effect; null unless SUSPENDED", default: null }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the ClaimsSpecialist who approved or denied", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the approve/deny decision", default: null }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on denial", default: null }

  - name: BenefitPayment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> BenefitClaim.id; claim this payment belongs to" }
      - { name: month, type: string, source: system, description: "Payment month (YYYY-MM) = the batch run_month that generated it; unique per claim" }
      - { name: gross_cents, type: integer, source: computed, description: "Monthly benefit before withholding for this month" }
      - { name: withheld_cents, type: integer, source: computed, description: "Total withheld for overpayment recovery per overpayment_withholding" }
      - { name: underpayment_credit_cents, type: integer, source: computed, description: "Underpayment credit applied to this payment (drains the claim's credit pool)", default: 0 }
      - { name: net_paid_cents, type: integer, source: computed, description: "gross_cents - withheld_cents + underpayment_credit_cents" }
      - { name: paid_to, type: enum, source: computed, description: "BENEFICIARY | REPRESENTATIVE_PAYEE — routing when the claim has an ACTIVE payee case" }
      - { name: status, type: enum, source: system, description: "PAID | WITHHELD_FULL | REPAYED", default: PAID }

  - name: OverpaymentCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> BenefitClaim.id; claim the debt arose on" }
      - { name: amount_cents, type: integer, source: input, description: "Original overpaid amount", constraints: "> 0" }
      - { name: period_start_month, type: string, source: input, description: "First overpaid month (YYYY-MM)" }
      - { name: period_end_month, type: string, source: input, description: "Last overpaid month (YYYY-MM)" }
      - { name: reason, type: enum, source: input, description: "RECOMPUTATION | FRAUD | REPORTING_ERROR | SYSTEM_ERROR" }
      - { name: status, type: enum, source: system, description: "NOTIFIED | WAIVER_REVIEW | WAIVED | RECOVERY_ACTIVE | RECOVERED", default: NOTIFIED }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating ClaimsSpecialist (or 'system' for recomputation-created cases)" }
      - { name: recovered_cents, type: integer, source: system, description: "Amount recovered so far through withholding", default: 0 }
      - { name: remaining_cents, type: integer, source: computed, description: "amount_cents - recovered_cents" }
      - { name: waiver_grounds, type: string, source: system, description: "Grounds text recorded on the waiver request", default: null }
      - { name: waiver_decided_by, type: string, source: system, description: "X-User-ID of the SeniorAdjudicator who decided the waiver", default: null }

  - name: PayeeCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> BenefitClaim.id; claim whose beneficiary may need a representative payee" }
      - { name: payee_name, type: string, source: input, description: "Proposed representative payee full name" }
      - { name: determination_basis, type: string, source: input, description: "Evidence summary that the beneficiary cannot manage funds" }
      - { name: status, type: enum, source: system, description: "INVESTIGATING | ACTIVE | DENIED | ENDED", default: INVESTIGATING }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creating ClaimsSpecialist" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding SeniorAdjudicator", default: null }

  - name: RecomputationEvent
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> BenefitClaim.id; claim recomputed" }
      - { name: trigger, type: enum, source: system, description: "CORRECTION_APPROVED | PENSION_UPDATED | SUSPENSION_RESUME" }
      - { name: old_pia_cents, type: integer, source: system, description: "PIA before recomputation" }
      - { name: new_pia_cents, type: integer, source: system, description: "PIA after recomputation" }
      - { name: old_monthly_benefit_cents, type: integer, source: system, description: "Monthly benefit before recomputation" }
      - { name: new_monthly_benefit_cents, type: integer, source: system, description: "Monthly benefit after recomputation" }
      - { name: retro_delta_cents, type: integer, source: computed, description: "Signed retroactive delta per recomputation_delta: (new_monthly - old_monthly) x count of PAID/WITHHELD_FULL payments; positive = underpaid" }
      - { name: resolution, type: enum, source: system, description: "UNDERPAYMENT_CREDIT | OVERPAYMENT_CREATED | NONE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Worker
    initial_state: LIVING
    terminal_states: [DECEASED]
    transitions:
      - from: LIVING
        to: DECEASED
        trigger: "POST /ssa/workers/{id}/report-death"
        actor: ClaimsSpecialist
        preconditions:
          - "worker.status == LIVING"
          - "death_date (input) <= logical clock date"
        side_effects:
          - "worker.death_date := input death_date"
          - "CASCADE hop 1: every BenefitClaim with worker_id == worker.id and status IN {ENTITLED, SUSPENDED} -> TERMINATED (monthly_benefit_cents := 0)"
          - "CASCADE hop 2: every PayeeCase with claim_id IN (those claims) and status == ACTIVE -> ENDED; claim.has_active_payee := false"
          - "CASCADE hop 2 (continued): suspended claims stop accruing DRC months"
          - "increments worker.version by 1"
        note: "Survivor claims (claim_type=SURVIVOR) filed by other workers against this deceased worker become approvable only after this transition."

  - entity: CorrectionRequest
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /ssa/correction-requests/{id}/request-evidence"
        actor: ClaimsSpecialist
        preconditions:
          - "logical clock date <= statute_deadline (else auto-EXPIRED, ERR_CORRECTION_TIME_BARRED on the attempt)"
        side_effects: ["increments version by 1"]
      - from: EVIDENCE_REQUESTED
        to: PENDING_REVIEW
        trigger: "POST /ssa/correction-requests/{id}/submit-evidence"
        actor: Claimant
        preconditions:
          - "logical clock date <= statute_deadline"
        side_effects: ["increments version by 1"]
        note: "Cycle: a request may bounce between PENDING_REVIEW and EVIDENCE_REQUESTED any number of times before the statute deadline."
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /ssa/correction-requests/{id}/approve"
        actor: ClaimsSpecialist
        preconditions:
          - "logical clock date <= statute_deadline"
          - "claimed_earnings_cents != current posted_earnings_cents for (worker_id, tax_year), treating a missing EarningsYear as posted = 0"
        side_effects:
          - "decided_by := X-User-ID; decided_at := logical clock"
          - "CASCADE hop 1: upsert EarningsYear(worker_id, tax_year) with posted_earnings_cents := claimed_earnings_cents, corrected := true"
          - "CASCADE hop 2: for each BenefitClaim of that worker with status IN {ENTITLED, SUSPENDED}, recompute pia_cents/monthly_benefit_cents and append a RecomputationEvent (trigger=CORRECTION_APPROVED)"
          - "CASCADE hop 3: per recomputation_delta, retro_delta_cents > 0 adds to claim.underpayment_credit_cents; retro_delta_cents < 0 auto-creates an OverpaymentCase (amount=-delta, reason=RECOMPUTATION, status=NOTIFIED, created_by='system')"
          - "increments version by 1"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /ssa/correction-requests/{id}/deny"
        actor: ClaimsSpecialist
        preconditions:
          - "logical clock date <= statute_deadline"
        side_effects:
          - "decided_by := X-User-ID; decided_at := logical clock; denial_reason := input"
          - "increments version by 1"
      - from: DENIED
        to: PENDING_REVIEW
        trigger: "POST /ssa/correction-requests/{id}/reopen"
        actor: SeniorAdjudicator
        preconditions:
          - "logical clock <= decided_at + 60 days (ERR_REOPEN_WINDOW_EXPIRED)"
          - "X-User-ID != decided_by (segregation of duties, ERR_SAME_ADJUDICATOR)"
          - "logical clock date <= statute_deadline (ERR_CORRECTION_TIME_BARRED)"
        side_effects:
          - "denial_reason := null; decided_by/decided_at cleared"
          - "increments version by 1"
        note: "Denial-reopen loop: a correction may cycle DENIED -> PENDING_REVIEW -> DENIED repeatedly inside the 60-day reopen window and the statute deadline."
      - from: PENDING_REVIEW
        to: EXPIRED
        trigger: "system sweep during POST /_batch/run-monthly-cycle when logical clock date > statute_deadline"
        actor: system
        preconditions: ["logical clock date > statute_deadline"]
        side_effects: ["increments version by 1"]
      - from: EVIDENCE_REQUESTED
        to: EXPIRED
        trigger: "system sweep during POST /_batch/run-monthly-cycle when logical clock date > statute_deadline"
        actor: system
        preconditions: ["logical clock date > statute_deadline"]
        side_effects: ["increments version by 1"]
      - from: DENIED
        to: EXPIRED
        trigger: "system sweep during POST /_batch/run-monthly-cycle when logical clock date > statute_deadline"
        actor: system
        preconditions: ["logical clock date > statute_deadline"]
        side_effects: ["increments version by 1"]

  - entity: Relationship
    initial_state: ASSERTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: ASSERTED
        to: VERIFIED
        trigger: "POST /ssa/relationships/{id}/verify"
        actor: ClaimsSpecialist
        preconditions:
          - "No other VERIFIED Relationship sharing worker_id or spouse_worker_id whose [marriage_date, divorce_date|open) interval overlaps this one (ERR_RELATIONSHIP_OVERLAP); half-open semantics: divorce_date == another's marriage_date is NOT an overlap"
          - "relationship_type == WIDOW requires covered worker (worker_id) status == DECEASED (ERR_WORKER_NOT_DECEASED)"
          - "DIVORCED_SPOUSE requires divorce_date present (ERR_INVALID_REQUEST)"
        side_effects:
          - "verified_at := logical clock"
          - "increments version by 1"
      - from: ASSERTED
        to: REJECTED
        trigger: "POST /ssa/relationships/{id}/reject"
        actor: ClaimsSpecialist
        preconditions: []
        side_effects: ["increments version by 1"]

  - entity: BenefitClaim
    initial_state: FILED
    terminal_states: [WITHDRAWN, TERMINATED]
    transitions:
      - from: FILED
        to: ENTITLED
        trigger: "POST /ssa/claims/{id}/approve"
        actor: ClaimsSpecialist
        preconditions:
          - "claiming_age_months >= 744 for RETIREMENT/SPOUSAL/DIVORCED_SPOUSAL (ERR_AGE_INELIGIBLE); >= 720 for SURVIVOR"
          - "claiming_age_months <= 840 (claims after age 70 are rejected, ERR_AGE_INELIGIBLE)"
          - "For SPOUSAL/DIVORCED_SPOUSAL/SURVIVOR: relationship_id present and Relationship.status == VERIFIED (ERR_RELATIONSHIP_NOT_VERIFIED)"
          - "For SPOUSAL: covered worker has a RETIREMENT claim in ENTITLED or SUSPENDED (ERR_SPOUSE_NOT_ENTITLED); marriage_months at entitlement_month >= 12 (ERR_MARRIAGE_DURATION_INSUFFICIENT)"
          - "For DIVORCED_SPOUSAL: relationship.marriage_months >= 120 (ERR_MARRIAGE_DURATION_INSUFFICIENT); if covered worker has no ENTITLED/SUSPENDED RETIREMENT claim then entitlement_month must be >= 24 months after divorce_date (ERR_DIVORCE_WAITING_PERIOD)"
          - "For SURVIVOR: covered worker status == DECEASED (ERR_WORKER_NOT_DECEASED); relationship.marriage_months >= 9 measured at death_date (ERR_MARRIAGE_DURATION_INSUFFICIENT)"
          - "For RETIREMENT: claim.worker.status == LIVING (ERR_WORKER_DECEASED)"
        side_effects:
          - "Compute aime_cents, pia_cents (WEP-adjusted when applicable), claiming_age_months, reduction_months, monthly_benefit_cents per the calculations table; for auxiliary claims monthly_benefit_cents := spousal excess after family-maximum and GPO"
          - "decided_by := X-User-ID; decided_at := logical clock"
          - "increments version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /ssa/claims/{id}/deny"
        actor: ClaimsSpecialist
        preconditions: []
        side_effects:
          - "decided_by := X-User-ID; decided_at := logical clock; denial_reason := input"
          - "increments version by 1"
      - from: DENIED
        to: FILED
        trigger: "POST /ssa/claims/{id}/reopen"
        actor: SeniorAdjudicator
        preconditions:
          - "logical clock <= decided_at + 60 days (ERR_REOPEN_WINDOW_EXPIRED)"
          - "X-User-ID != decided_by (ERR_SAME_ADJUDICATOR)"
        side_effects:
          - "denial_reason := null; decided_by/decided_at cleared"
          - "increments version by 1"
      - from: ENTITLED
        to: SUSPENDED
        trigger: "POST /ssa/claims/{id}/suspend"
        actor: Claimant
        preconditions:
          - "claimant age_months at logical clock >= fra_months and < 840 (ERR_SUSPENSION_AGE_INELIGIBLE)"
          - "OCC: request expected_claim_version == claim.version (ERR_STALE_VERSION)"
        side_effects:
          - "suspended_since := current logical month"
          - "monthly_benefit_cents remains stored; batch skips payment generation while SUSPENDED"
          - "increments version by 1"
      - from: SUSPENDED
        to: ENTITLED
        trigger: "POST /ssa/claims/{id}/resume OR system auto-resume in POST /_batch/run-monthly-cycle when age_months >= 840"
        actor: Claimant
        preconditions: []
        side_effects:
          - "drc_months := min(months_between(suspended_since, current month), max(0, 840 - age_months_at(suspended_since)))"
          - "Recompute monthly_benefit_cents with accrued DRCs; append RecomputationEvent (trigger=SUSPENSION_RESUME)"
          - "suspended_since := null"
          - "increments version by 1"
        note: "Suspend/resume cycle: ENTITLED -> SUSPENDED -> ENTITLED may repeat; each suspension accrues DRCs only for months with no payment, before age 70."
      - from: ENTITLED
        to: WITHDRAWN
        trigger: "POST /ssa/claims/{id}/withdraw"
        actor: Claimant
        preconditions:
          - "months_between(entitlement_month, current logical month) <= 12 (ERR_WITHDRAWAL_WINDOW_EXPIRED)"
          - "worker.withdrawal_used == false (ERR_WITHDRAWAL_ALREADY_USED)"
          - "input repaid_amount_cents == claim.total_paid_cents (ERR_REPAYMENT_SHORTFALL)"
        side_effects:
          - "Every BenefitPayment of this claim with status IN {PAID, WITHHELD_FULL} -> REPAYED"
          - "worker.withdrawal_used := true; monthly_benefit_cents := 0; total_paid_cents := 0"
          - "increments version by 1"
        note: "The withdrawn claim is treated as never filed: the worker may file a new RETIREMENT claim, but may never withdraw again."
      - from: ENTITLED
        to: TERMINATED
        trigger: "system cascade from Worker.report-death"
        actor: system
        preconditions: ["claim.worker.status became DECEASED"]
        side_effects:
          - "monthly_benefit_cents := 0"
          - "increments version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system cascade from Worker.report-death"
        actor: system
        preconditions: ["claim.worker.status became DECEASED"]
        side_effects:
          - "monthly_benefit_cents := 0"
          - "increments version by 1"

  - entity: BenefitPayment
    initial_state: PAID
    terminal_states: [REPAYED]
    transitions:
      - from: PAID
        to: REPAYED
        trigger: "system cascade from BenefitClaim.withdraw"
        actor: system
        preconditions: []
        side_effects: ["payment remains queryable; totals reconcile per withdrawal_repayment_invariant"]
      - from: WITHHELD_FULL
        to: REPAYED
        trigger: "system cascade from BenefitClaim.withdraw"
        actor: system
        preconditions: []
        side_effects: []
    note: "WITHHELD_FULL is assigned at creation when withholding consumed the entire gross (net_paid_cents == 0 and withheld_cents > 0); otherwise PAID."

  - entity: OverpaymentCase
    initial_state: NOTIFIED
    terminal_states: [WAIVED, RECOVERED]
    transitions:
      - from: NOTIFIED
        to: WAIVER_REVIEW
        trigger: "POST /ssa/overpayment-cases/{id}/request-waiver"
        actor: Claimant
        preconditions:
          - "logical clock date <= notice date (created_at) + 30 days (ERR_WAIVER_WINDOW_CLOSED)"
          - "OCC: request expected_overpayment_version == case.version (ERR_STALE_VERSION)"
        side_effects:
          - "waiver_grounds := input"
          - "increments version by 1"
      - from: WAIVER_REVIEW
        to: WAIVED
        trigger: "POST /ssa/overpayment-cases/{id}/decide-waiver with outcome=GRANTED"
        actor: SeniorAdjudicator
        preconditions:
          - "X-User-ID != created_by (ERR_SAME_ADJUDICATOR)"
        side_effects:
          - "waiver_decided_by := X-User-ID; debt forgiven: remaining_cents becomes 0 by definition and the case leaves the withholding set"
          - "increments version by 1"
      - from: WAIVER_REVIEW
        to: RECOVERY_ACTIVE
        trigger: "POST /ssa/overpayment-cases/{id}/decide-waiver with outcome=DENIED"
        actor: SeniorAdjudicator
        preconditions:
          - "X-User-ID != created_by (ERR_SAME_ADJUDICATOR)"
        side_effects:
          - "waiver_decided_by := X-User-ID; withholding begins on the next batch cycle"
          - "increments version by 1"
      - from: NOTIFIED
        to: RECOVERY_ACTIVE
        trigger: "POST /ssa/overpayment-cases/{id}/begin-recovery OR system auto-start during POST /_batch/run-monthly-cycle when the 30-day waiver window has lapsed"
        actor: ClaimsSpecialist
        preconditions:
          - "manual begin-recovery: logical clock date > created_at + 30 days (ERR_WAIVER_WINDOW_OPEN)"
          - "claim.status == ENTITLED (ERR_INVALID_STATE: recovery is only from future benefits of an active claim)"
          - "recovery_mode == PARTIAL requires monthly_rate_cents >= 10% of claim.monthly_benefit_cents (ERR_RECOVERY_RATE_TOO_LOW)"
        side_effects:
          - "claim.recovery_mode := input recovery_mode (FULL default; PARTIAL with monthly_rate_cents; PROPORTIONAL)"
          - "increments version by 1"
      - from: RECOVERY_ACTIVE
        to: RECOVERED
        trigger: "system during POST /_batch/run-monthly-cycle when recovered_cents reaches amount_cents"
        actor: system
        preconditions: ["recovered_cents == amount_cents after withholding step"]
        side_effects: ["increments version by 1"]

  - entity: PayeeCase
    initial_state: INVESTIGATING
    terminal_states: [DENIED, ENDED]
    transitions:
      - from: INVESTIGATING
        to: ACTIVE
        trigger: "POST /ssa/payee-cases/{id}/decide with outcome=APPROVED"
        actor: SeniorAdjudicator
        preconditions:
          - "X-User-ID != created_by (ERR_SAME_ADJUDICATOR)"
          - "claim.status == ENTITLED (ERR_INVALID_STATE)"
          - "No other PayeeCase for this claim with status == ACTIVE (capacity-1 exclusivity, ERR_ACTIVE_PAYEE_EXISTS)"
        side_effects:
          - "claim.has_active_payee := true; decided_by := X-User-ID"
          - "increments version by 1"
      - from: INVESTIGATING
        to: DENIED
        trigger: "POST /ssa/payee-cases/{id}/decide with outcome=DENIED"
        actor: SeniorAdjudicator
        preconditions:
          - "X-User-ID != created_by (ERR_SAME_ADJUDICATOR)"
        side_effects:
          - "decided_by := X-User-ID"
          - "increments version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "system cascade from Worker.report-death on the claim's worker"
        actor: system
        preconditions: []
        side_effects:
          - "claim.has_active_payee := false"
          - "increments version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-suspend-stale-view
    parent_entity: BenefitClaim
    write_endpoint: "POST /ssa/claims/{id}/suspend"
    occ_field: "expected_claim_version"
    description: |
      Suspending a claim with an expected_claim_version below the claim's
      current version is rejected. This captures the case where the client's
      view of the claim (e.g., monthly_benefit_cents after a recomputation
      side effect from a correction approval or pension update) is stale at
      the moment the suspension decision was made.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: overpayment-waiver-stale-view
    parent_entity: OverpaymentCase
    write_endpoint: "POST /ssa/overpayment-cases/{id}/request-waiver"
    occ_field: "expected_overpayment_version"
    description: |
      Filing a waiver request with an expected_overpayment_version below the
      case's current version is rejected. This captures the case where a
      withholding batch has advanced recovered_cents since the claimant last
      observed the case, so the decision to seek a waiver rested on a stale
      remaining balance.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: worker-pension-patch-stale-view
    parent_entity: Worker
    write_endpoint: "PATCH /ssa/workers/{id}"
    occ_field: "expected_worker_version"
    description: |
      Updating a worker's non-covered pension fields with an
      expected_worker_version below the worker's current version is rejected.
      This captures the case where another writer (e.g., a death report or a
      prior pension update that triggered recomputation) advanced the worker
      since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. "dime_floor(x)" = floor(x / 10) * 10 (round the
# cent value DOWN to the next lower multiple of 10 cents). All intermediate
# arithmetic is exact rational; rounding is applied only where stated.
# =============================================================================
calculations:
  - name: earnings_indexation
    trigger: "Recomputed whenever EarningsYear.posted_earnings_cents changes (wage report posting, approved correction) and at claim approve"
    algorithm: chronological
    formula: |
      Let EY = worker.eligibility_year (= birth_year + 62).
      AWI_CENTS(y) = 1,000,000 + 25,000 * (y - 1986)          # published average wage index series
      TAXABLE_MAX_CENTS(y) = 12,000,000 + 300,000 * (y - 1986) # annual contribution base
      For each EarningsYear row of the worker:
        if tax_year < EY - 2:
          indexed_earnings_cents = round_half_up_to_cents(posted_earnings_cents * AWI_CENTS(EY-2) / AWI_CENTS(tax_year))
        else:
          indexed_earnings_cents = posted_earnings_cents       # years at/after EY-2 enter at face value
    input_set: "All EarningsYear rows of the worker, any tax_year; years with no row count as 0 (no row is created for them)"
    constants:
      AWI_BASE_YEAR: 1986
      AWI_BASE_CENTS: 1000000
      AWI_STEP_CENTS_PER_YEAR: 25000
      TAXABLE_MAX_BASE_CENTS: 12000000
      TAXABLE_MAX_STEP_CENTS_PER_YEAR: 300000
    precision: "integer cents; indexation multiply-then-divide with round_half_up to cents; no other rounding"
    note: "Wage-report posting applies the taxable maximum chronologically: reports for one (worker, tax_year) credit in created_at ASC order, each crediting min(amount_cents, remaining headroom under TAXABLE_MAX_CENTS(tax_year)) as posted_amount_cents. Out-of-order report creation still yields the created_at-ordered result."

  - name: aime_computation
    trigger: "At claim approve for RETIREMENT; at recomputation when earnings change"
    algorithm: aggregation
    formula: |
      Select the 35 highest indexed_earnings_cents values over all EarningsYear rows
      (missing years are implicit zeros and ARE included in the divisor).
      Tie-break when selecting the top 35: higher value first; equal values are
      interchangeable (selection of equal values does not change the sum).
      AIME_cents = floor(sum_of_top_35_cents / (35 * 12 * 100)) * 100
      i.e., average monthly earnings rounded DOWN to the next lower whole dollar.
    input_set: "EarningsYear rows of the worker only; noncovered_earnings_cents never participate"
    constants:
      COMPUTATION_YEARS: 35
      MONTHS_DIVISOR_CENTS: 42000
    precision: "whole-dollar floor on the monthly average; result stored in cents"

  - name: pia_bend_point
    trigger: "At claim approve and at every recomputation"
    algorithm: tiered_pricing
    formula: |
      BEND1_CENTS(EY) = 100,000 + 1,500 * (EY - 2024)
      BEND2_CENTS(EY) = 600,000 + 9,000 * (EY - 2024)
      PIA = dime_floor( 0.90 * min(AIME, B1)
                      + 0.32 * max(0, min(AIME, B2) - B1)
                      + 0.15 * max(0, AIME - B2) )
    input_set: "worker.aime_cents and the bend points for worker.eligibility_year"
    constants:
      BEND1_BASE_CENTS: 100000
      BEND1_STEP_CENTS_PER_YEAR: 1500
      BEND2_BASE_CENTS: 600000
      BEND2_STEP_CENTS_PER_YEAR: 9000
      RATE_TIER_1: "0.90"
      RATE_TIER_2: "0.32"
      RATE_TIER_3: "0.15"
    precision: "exact rational tiers summed first, then dime_floor once at the end"
    variants:
      - name: wep_adjusted
        when: "worker.noncovered_pension_monthly_cents > 0 AND years_of_substantial_coverage < 30 (see wep_adjusted_pia)"
        difference: "Tier-1 rate 0.90 is replaced by a lower factor and the reduction is capped at half the pension; produces a strictly smaller PIA for identical earnings"

  - name: wep_adjusted_pia
    trigger: "Same moments as pia_bend_point, selected when the worker has a non-covered pension and fewer than 30 substantial-coverage years"
    algorithm: tiered_pricing
    formula: |
      YOC = count of EarningsYear rows with posted_earnings_cents >= SUBSTANTIAL_CENTS(tax_year)
      SUBSTANTIAL_CENTS(y) = 900,000 + 22,500 * (y - 1986)
      tier1_factor = max(0.40, 0.90 - 0.05 * (30 - YOC))     # YOC<=20 -> 0.40; 30+ -> no WEP at all
      wep_raw = dime_floor( tier1_factor * min(AIME, B1)
                          + 0.32 * max(0, min(AIME, B2) - B1)
                          + 0.15 * max(0, AIME - B2) )
      wep_reduction = standard_PIA - wep_raw
      guarantee_cap = floor(worker.noncovered_pension_monthly_cents / 2)
      final_PIA = standard_PIA - min(wep_reduction, guarantee_cap)   # WEP guarantee
    input_set: "EarningsYear rows of the worker; worker.noncovered_pension_monthly_cents"
    constants:
      SUBSTANTIAL_BASE_CENTS: 900000
      SUBSTANTIAL_STEP_CENTS_PER_YEAR: 22500
      WEP_FULL_EXEMPTION_YOC: 30
      WEP_FLOOR_FACTOR: "0.40"
      WEP_STEP_PER_MISSING_YOC: "0.05"
    precision: "dime_floor on wep_raw; guarantee cap as integer-cent floor(pension/2); subtraction exact"

  - name: age_adjustment
    trigger: "At claim approve (RETIREMENT); at resume with accrued DRCs"
    algorithm: threshold
    formula: |
      n_early = max(0, fra_months - claiming_age_months)
      n_late  = max(0, min(claiming_age_months, 840) - fra_months) + drc_months_accrued_during_suspension
      If n_early > 0:
        factor = 1 - min(n_early, 36) * 5/900 - max(0, n_early - 36) * 5/1200
      Else:
        factor = 1 + n_late * 1/150
      monthly_benefit_cents = dime_floor(pia_cents * factor)
      drc_months stop accruing at age 70 (840 months): the +1/150 term applies only
      to months with age < 840 and no payment made.
    input_set: "claim.pia_cents, worker.fra_months, claim.claiming_age_months, claim.drc_months"
    constants:
      EARLY_RED_FIRST36_PER_MONTH: "5/900"
      EARLY_RED_BEYOND36_PER_MONTH: "5/1200"
      DRC_PER_MONTH: "1/150"
      MAX_DRC_AGE_MONTHS: 840
      MIN_CLAIM_AGE_MONTHS: 744
      SURVIVOR_MIN_AGE_MONTHS: 720
    precision: "factor as exact rational; dime_floor applied once to the product"
    note: "The 36-month kink is the boundary: month 36 of early claiming is priced at 5/900, month 37 at 5/1200."

  - name: spousal_computation
    trigger: "At approve of SPOUSAL / DIVORCED_SPOUSAL claims; recomputed if the covered worker's PIA changes"
    algorithm: tiered_pricing
    formula: |
      worker_pia = covered worker's current pia_cents (via Relationship.worker_id -> their ENTITLED/SUSPENDED RETIREMENT claim; if none for DIVORCED_SPOUSAL under the 24-month rule, the covered worker's hypothetical PIA is still computed from their earnings record)
      spousal_base_cents = dime_floor(0.50 * worker_pia)
      s_early = max(0, claimant fra_months - claiming_age_months)   # claimant = spouse
      spousal_reduced = dime_floor(spousal_base_cents * (1 - min(s_early,36) * 25/3600 - max(0, s_early-36) * 5/1200))
      own_pia = claimant's own RETIREMENT claim pia_cents with status IN {ENTITLED, SUSPENDED}, else 0
      EVALUATION ORDER (pinned, circular-looking dependency made explicit):
        (1) spousal_reduced from covered worker's PIA and spouse's age
        (2) excess = max(0, spousal_reduced - own_pia)               # dual-entitlement offset
        (3) family_maximum allocation across this record's auxiliary claims (may lower excess)
        (4) gpo_offset = dime_floor(2/3 * claimant.noncovered_pension_monthly_cents)
            monthly_benefit_cents = max(0, excess_after_family_max - gpo_offset)
      The spouse's TOTAL income is their own RETIREMENT monthly_benefit_cents plus this claim's
      monthly_benefit_cents; the two claims remain separate entities.
    input_set: "Relationship (VERIFIED), covered worker's RETIREMENT claim or earnings record, claimant's own RETIREMENT claim, claimant pension"
    constants:
      SPOUSAL_RATE: "0.50"
      SPOUSAL_RED_FIRST36_PER_MONTH: "25/3600"
      SPOUSAL_RED_BEYOND36_PER_MONTH: "5/1200"
      GPO_FRACTION: "2/3"
    precision: "dime_floor at spousal_base, again at spousal_reduced, again at gpo_offset; subtraction exact"

  - name: survivor_computation
    trigger: "At approve of SURVIVOR claims"
    algorithm: threshold
    formula: |
      worker_pia = deceased covered worker's pia_cents as of death (recomputed from their earnings record at approve)
      s_early = max(0, 804 - claiming_age_months)        # claimant age below survivor FRA 804
      survivor_factor = 1 - s_early * 0.005
      survivor_benefit = dime_floor(worker_pia * survivor_factor)
      Then GPO applies exactly as in spousal_computation step (4) to the survivor amount.
    input_set: "covered worker (DECEASED), Relationship VERIFIED with type WIDOW, claimant age and pension"
    constants:
      SURVIVOR_RED_PER_MONTH: "0.005"
      SURVIVOR_FRA_MONTHS: 804
      SURVIVOR_MIN_AGE_MONTHS: 720
    precision: "exact rational factor; dime_floor once"

  - name: family_maximum
    trigger: "At approve of any auxiliary claim and re-evaluated in each monthly batch for the covered record"
    algorithm: waterfall_allocation
    formula: |
      FMAX = dime_floor( 1.50 * min(worker_pia, B1)
                       + 2.72 * max(0, min(worker_pia, B2) - B1)
                       + 1.34 * max(0, worker_pia - B2) )
      If worker_own_benefit + sum(auxiliary monthly_benefit_cents pre-family-reduction) <= FMAX: no reduction.
      Else pool = FMAX - worker_own_benefit and each auxiliary's allocated share is:
        share_i = dime_floor(pool * aux_i / sum_aux)          # ROUND PER-AUXILIARY FIRST (pinned order)
      residual_cents = pool - sum(share_i)                    # dimes stranded by per-line rounding
      Distribute residual one dime (10 cents) at a time to auxiliary claims in
      created_at ASC order (earliest first), one dime per claim per pass, until exhausted.
      The worker's own benefit is NEVER reduced by the family maximum.
      A sum-then-round order yields different cents and is NON-CONFORMANT.
    input_set: "covered worker's RETIREMENT claim plus all auxiliary claims (SPOUSAL, DIVORCED_SPOUSAL) with status ENTITLED on that worker's record"
    constants:
      FMAX_RATE_1: "1.50"
      FMAX_RATE_2: "2.72"
      FMAX_RATE_3: "1.34"
    precision: "dime_floor on FMAX; dime_floor per auxiliary share; residual reconciled in created_at order"

  - name: overpayment_withholding
    trigger: "During POST /_batch/run-monthly-cycle for each generated payment, after gross is known"
    algorithm: waterfall_allocation
    formula: |
      active = this claim's OverpaymentCase rows with status == RECOVERY_ACTIVE
      capacity = payment.gross_cents
      If claim.recovery_mode == PROPORTIONAL and active is non-empty:
        total_remaining = sum(remaining_cents over active)
        For each case: withhold_i = min(remaining_i, dime_floor(capacity * remaining_i / total_remaining))
        Residual dimes (capacity not fully allocated though debts remain) go one dime at a
        time to cases in created_at ASC order, respecting remaining_i.
      Else (FULL or PARTIAL — chronological):
        Process active cases in created_at ASC order (oldest debt first).
        FULL:    withhold_i = min(remaining_i, capacity_left)
        PARTIAL: withhold_i = min(case's elected monthly_rate_cents, remaining_i, capacity_left)
        capacity_left decreases by each withhold_i.
      payment.withheld_cents = sum(withhold_i)
      payment.net_paid_cents = gross - withheld + underpayment_credit_applied
      underpayment_credit_applied = claim.underpayment_credit_cents (drained in full into this payment)
      Each case: recovered_cents += withhold_i; when recovered_cents == amount_cents -> RECOVERED.
    input_set: "RECOVERY_ACTIVE OverpaymentCase rows of the claim; claim.recovery_mode; claim.underpayment_credit_cents"
    constants:
      PARTIAL_RATE_MIN_PCT_OF_BENEFIT: "0.10"
    precision: "dime_floor per case in PROPORTIONAL mode; chronological mode is exact integer subtraction"
    variants:
      - name: proportional_recovery
        when: "claim.recovery_mode == PROPORTIONAL (elected by the most recent begin-recovery)"
        difference: "Splits one month's capacity across all active cases pro-rata to remaining balances instead of draining the oldest case first; identical debts and capacity produce different per-case recovered_cents and a different month in which each case closes"

  - name: cola_adjustment
    trigger: "During POST /_batch/run-monthly-cycle when run_month is a January (MM == '01')"
    algorithm: threshold
    formula: |
      For every claim with status == ENTITLED and entitlement_month strictly BEFORE this
      January (YYYY-MM < run_month): monthly_benefit_cents = dime_floor(monthly_benefit_cents * 1.025)
      Claims ENTITLED with entitlement_month == run_month, and SUSPENDED claims, receive no COLA this cycle.
    input_set: "ENTITLED claims with entitlement_month < run_month (January runs only)"
    constants:
      COLA_RATE: "0.025"
    precision: "dime_floor once per claim per January"

  - name: recomputation_delta
    trigger: "After any event that changes pia_cents or monthly_benefit_cents of an ENTITLED or SUSPENDED claim (correction approval, pension PATCH, resume)"
    algorithm: projection
    formula: |
      paid_count = count of this claim's BenefitPayment rows with status IN {PAID, WITHHELD_FULL}
      retro_delta_cents = (new_monthly_benefit_cents - old_monthly_benefit_cents) * paid_count
      Simplification (pinned): no COLA restatement of past months; the current factor applies
      uniformly to all past payments.
      If retro_delta_cents > 0: claim.underpayment_credit_cents += retro_delta_cents; resolution = UNDERPAYMENT_CREDIT
      If retro_delta_cents < 0: auto-create OverpaymentCase(amount=-delta, period = first..last paid month,
        reason=RECOMPUTATION, status=NOTIFIED, created_by='system'); resolution = OVERPAYMENT_CREATED
      Else resolution = NONE.
    input_set: "the claim's payments and its old/new monthly_benefit_cents"
    precision: "exact integer arithmetic"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and the role is recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per §1.5 roles / §1.7 matrix", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: when role is Claimant, X-User-ID must equal the worker_id of the target resource (Worker itself, BenefitClaim.worker_id, CorrectionRequest.worker_id, or the owning claim's worker_id for payments/overpayments/payee-cases sub-resources)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "all endpoints invoked as Claimant" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, types/enums parse, amount_cents > 0, claimed_earnings_cents >= 0, relationship_id present iff claim_type is SPOUSAL|DIVORCED_SPOUSAL|SURVIVOR, divorce_date present for DIVORCED_SPOUSE relationships, recovery_mode in {FULL, PARTIAL, PROPORTIONAL} with monthly_rate_cents required iff PARTIAL, outcome in {GRANTED, DENIED} (waivers) or {APPROVED, DENIED} (payee)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a request body" }
  - { priority: 5, category: existence, check: "Path identifiers resolve, left to right: worker, claim, correction request, relationship, overpayment case, payee case", error_id: ERR_WORKER_NOT_FOUND, http_status: 404, applies_to: "all parameterized endpoints (ERR_CLAIM_NOT_FOUND / ERR_CORRECTION_NOT_FOUND / ERR_RELATIONSHIP_NOT_FOUND / ERR_OVERPAYMENT_NOT_FOUND / ERR_PAYEE_CASE_NOT_FOUND for the corresponding segment)" }
  - { priority: 6, category: state, check: "State-machine preconditions: the target entity is in a from-state of the invoked transition; terminal entities (claim WITHDRAWN/TERMINATED, correction APPROVED/EXPIRED, case WAIVED/RECOVERED, relationship VERIFIED/REJECTED, payee case DENIED/ENDED) reject all further actions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints; use ERR_CLAIM_ALREADY_TERMINAL instead when the claim is WITHDRAWN or TERMINATED" }
  - { priority: 6, category: state, check: "Terminal-claim lockdown variant of the above", error_id: ERR_CLAIM_ALREADY_TERMINAL, http_status: 409, applies_to: "claim action endpoints when claim.status IN {WITHDRAWN, TERMINATED}" }
  - { priority: 7, category: state, check: "OCC: expected_claim_version / expected_overpayment_version / expected_worker_version equals the entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /ssa/claims/{id}/suspend, POST /ssa/overpayment-cases/{id}/request-waiver, PATCH /ssa/workers/{id}" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: reopen (claim/correction), decide-waiver, and payee decide require X-User-ID different from the recorded decided_by / created_by of the prior determination", error_id: ERR_SAME_ADJUDICATOR, http_status: 409, applies_to: "POST /ssa/claims/{id}/reopen, POST /ssa/correction-requests/{id}/reopen, POST /ssa/overpayment-cases/{id}/decide-waiver, POST /ssa/payee-cases/{id}/decide" }
  - { priority: 8, category: business_safety, check: "No new RETIREMENT claim for a DECEASED worker", error_id: ERR_WORKER_DECEASED, http_status: 409, applies_to: "POST /ssa/claims" }
  - { priority: 9, category: business_constraint, check: "At most one non-terminal claim per (worker_id, claim_type); WITHDRAWN and TERMINATED claims do not block re-filing", error_id: ERR_DUPLICATE_ACTIVE_CLAIM, http_status: 409, applies_to: "POST /ssa/claims" }
  - { priority: 9, category: business_constraint, check: "At most one non-terminal correction per (worker_id, tax_year): an existing PENDING_REVIEW or EVIDENCE_REQUESTED or DENIED-within-reopen-window request blocks a new one", error_id: ERR_DUPLICATE_PENDING_CORRECTION, http_status: 409, applies_to: "POST /ssa/correction-requests" }
  - { priority: 9, category: business_constraint, check: "Verified-marriage interval exclusivity: no two VERIFIED relationships sharing worker_id or spouse_worker_id may have overlapping [marriage_date, divorce_date|open) intervals; half-open semantics — an interval ending exactly when another begins does NOT overlap", error_id: ERR_RELATIONSHIP_OVERLAP, http_status: 409, applies_to: "POST /ssa/relationships/{id}/verify" }
  - { priority: 9, category: business_constraint, check: "Capacity-1 representative payee: no second ACTIVE PayeeCase per claim", error_id: ERR_ACTIVE_PAYEE_EXISTS, http_status: 409, applies_to: "POST /ssa/payee-cases/{id}/decide" }
  - { priority: 9, category: business_constraint, check: "Correction must allege a real discrepancy: claimed_earnings_cents != posted_earnings_cents (missing year counts as 0)", error_id: ERR_NO_EARNINGS_DISCREPANCY, http_status: 422, applies_to: "POST /ssa/correction-requests" }
  - { priority: 10, category: business_temporal, check: "Correction statute: logical clock date <= (tax_year+4)-04-15 for filing and for every review transition", error_id: ERR_CORRECTION_TIME_BARRED, http_status: 422, applies_to: "POST /ssa/correction-requests and all /ssa/correction-requests/{id}/* transitions" }
  - { priority: 10, category: business_temporal, check: "Withdrawal window: months_between(entitlement_month, logical clock month) <= 12", error_id: ERR_WITHDRAWAL_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /ssa/claims/{id}/withdraw" }
  - { priority: 10, category: business_temporal, check: "Reopen window: logical clock <= decided_at + 60 days", error_id: ERR_REOPEN_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /ssa/claims/{id}/reopen, POST /ssa/correction-requests/{id}/reopen" }
  - { priority: 10, category: business_temporal, check: "Waiver request window: logical clock date <= case created_at date + 30 days", error_id: ERR_WAIVER_WINDOW_CLOSED, http_status: 422, applies_to: "POST /ssa/overpayment-cases/{id}/request-waiver" }
  - { priority: 10, category: business_temporal, check: "Manual begin-recovery only after the 30-day waiver window lapses", error_id: ERR_WAIVER_WINDOW_OPEN, http_status: 422, applies_to: "POST /ssa/overpayment-cases/{id}/begin-recovery" }
  - { priority: 10, category: business_temporal, check: "Divorced-spouse independent-entitlement wait: when the covered worker has no ENTITLED/SUSPENDED RETIREMENT claim, entitlement_month must be >= 24 months after divorce_date", error_id: ERR_DIVORCE_WAITING_PERIOD, http_status: 422, applies_to: "POST /ssa/claims/{id}/approve" }
  - { priority: 11, category: business_referential, check: "Auxiliary claims require relationship_id -> Relationship.status == VERIFIED", error_id: ERR_RELATIONSHIP_NOT_VERIFIED, http_status: 422, applies_to: "POST /ssa/claims/{id}/approve" }
  - { priority: 11, category: business_referential, check: "SPOUSAL claims require the covered worker to hold a RETIREMENT claim in ENTITLED or SUSPENDED", error_id: ERR_SPOUSE_NOT_ENTITLED, http_status: 422, applies_to: "POST /ssa/claims/{id}/approve" }
  - { priority: 11, category: business_referential, check: "SURVIVOR claims and WIDOW relationships require the covered worker status == DECEASED", error_id: ERR_WORKER_NOT_DECEASED, http_status: 422, applies_to: "POST /ssa/claims/{id}/approve, POST /ssa/relationships/{id}/verify" }
  - { priority: 12, category: business_fiscal, check: "Claiming-age floors: claiming_age_months >= 744 (RETIREMENT/SPOUSAL/DIVORCED_SPOUSAL) or >= 720 (SURVIVOR), and <= 840", error_id: ERR_AGE_INELIGIBLE, http_status: 422, applies_to: "POST /ssa/claims/{id}/approve" }
  - { priority: 12, category: business_fiscal, check: "Suspension age band: fra_months <= age_months < 840 at suspension", error_id: ERR_SUSPENSION_AGE_INELIGIBLE, http_status: 422, applies_to: "POST /ssa/claims/{id}/suspend" }
  - { priority: 12, category: business_fiscal, check: "Marriage durations: SPOUSAL >= 12 months at entitlement; DIVORCED_SPOUSAL >= 120 total; SURVIVOR >= 9 at death", error_id: ERR_MARRIAGE_DURATION_INSUFFICIENT, http_status: 422, applies_to: "POST /ssa/claims/{id}/approve" }
  - { priority: 12, category: business_fiscal, check: "Withdrawal repayment equality: repaid_amount_cents == claim.total_paid_cents", error_id: ERR_REPAYMENT_SHORTFALL, http_status: 422, applies_to: "POST /ssa/claims/{id}/withdraw" }
  - { priority: 12, category: business_fiscal, check: "Withdrawal is once per worker lifetime", error_id: ERR_WITHDRAWAL_ALREADY_USED, http_status: 422, applies_to: "POST /ssa/claims/{id}/withdraw" }
  - { priority: 12, category: business_fiscal, check: "PARTIAL recovery election requires monthly_rate_cents >= 10% of claim.monthly_benefit_cents", error_id: ERR_RECOVERY_RATE_TOO_LOW, http_status: 422, applies_to: "POST /ssa/overpayment-cases/{id}/begin-recovery" }

# =============================================================================
# §1.5 API Endpoint Table
# All business paths live under the /ssa prefix; the two platform endpoints
# (/_clock, /_batch) are intentionally unprefixed.
# =============================================================================
endpoints:
  - { method: POST, path: "/ssa/workers", description: "Intake: create a worker record", roles: [ClaimsSpecialist, ProgramAdministrator], code: 201, input: [full_name, birth_year, birth_month, "noncovered_pension_monthly_cents?", "noncovered_pension_start_month?"], output: Worker, side_effects: ["status := LIVING; fra_months/eligibility_year computed"] }
  - { method: GET, path: "/ssa/workers/{id}", description: "Read one worker (Claimant: own record only)", roles: [ClaimsSpecialist, SeniorAdjudicator, ProgramAdministrator, Claimant], code: 200, input: [], output: Worker, side_effects: [] }
  - { method: PATCH, path: "/ssa/workers/{id}", description: "Record/update non-covered pension; triggers recomputation of the worker's ENTITLED/SUSPENDED claims (WEP) and of auxiliary claims where this worker is the claimant (GPO). OCC-guarded.", roles: [ClaimsSpecialist], code: 200, input: [noncovered_pension_monthly_cents, noncovered_pension_start_month, expected_worker_version], output: Worker, side_effects: ["RecomputationEvent (trigger=PENSION_UPDATED) per affected claim; recomputation_delta may create OverpaymentCase or underpayment credit", "increments worker.version by 1"] }
  - { method: POST, path: "/ssa/workers/{id}/report-death", description: "Report the worker's death; cascades per Worker state machine", roles: [ClaimsSpecialist], code: 200, input: [death_date], output: Worker, side_effects: ["Worker LIVING -> DECEASED; own ENTITLED/SUSPENDED claims -> TERMINATED; their ACTIVE payee cases -> ENDED", "increments worker.version by 1"] }
  - { method: GET, path: "/ssa/workers/{id}/earnings-years", description: "List the worker's earnings record rows", roles: [ClaimsSpecialist, SeniorAdjudicator, ProgramAdministrator, Claimant], code: 200, input: [], output: "EarningsYear[]", side_effects: [] }
  - { method: GET, path: "/ssa/workers/{id}/relationships", description: "List all relationships where this worker is the covered worker OR the spouse", roles: [ClaimsSpecialist, SeniorAdjudicator, Claimant], code: 200, input: [], output: "Relationship[]", side_effects: [] }
  - { method: GET, path: "/ssa/workers/{id}/wage-reports", description: "List wage reports posted for this worker", roles: [ClaimsSpecialist, ProgramAdministrator, Employer, Claimant], code: 200, input: [], output: "WageReport[]", side_effects: [] }
  - { method: GET, path: "/ssa/workers/{id}/correction-requests", description: "List correction requests filed on this worker's record", roles: [ClaimsSpecialist, SeniorAdjudicator, Claimant], code: 200, input: [], output: "CorrectionRequest[]", side_effects: [] }
  - { method: POST, path: "/ssa/wage-reports", description: "Employer wage report; posts to the worker's EarningsYear (upsert) applying the taxable-maximum headroom in created_at order", roles: [Employer, ProgramAdministrator], code: 201, input: [worker_id, employer_name, tax_year, amount_cents, "covered_employment?"], output: WageReport, side_effects: ["EarningsYear upsert: posted_earnings_cents recomputed from covered reports; non-covered reports accumulate into noncovered_earnings_cents"] }
  - { method: POST, path: "/ssa/correction-requests", description: "File an earnings-record correction request for a missing or misposted year", roles: [Claimant, ClaimsSpecialist], code: 201, input: [worker_id, tax_year, claimed_earnings_cents, evidence_type], output: CorrectionRequest, side_effects: ["status := PENDING_REVIEW; statute_deadline computed"] }
  - { method: POST, path: "/ssa/correction-requests/{id}/request-evidence", description: "ClaimsSpecialist asks the requester for more evidence", roles: [ClaimsSpecialist], code: 200, input: ["evidence_note?"], output: CorrectionRequest, side_effects: ["PENDING_REVIEW -> EVIDENCE_REQUESTED", "increments version by 1"] }
  - { method: POST, path: "/ssa/correction-requests/{id}/submit-evidence", description: "Requester returns evidence; re-enters review queue", roles: [Claimant, ClaimsSpecialist], code: 200, input: [evidence_detail], output: CorrectionRequest, side_effects: ["EVIDENCE_REQUESTED -> PENDING_REVIEW", "increments version by 1"] }
  - { method: POST, path: "/ssa/correction-requests/{id}/approve", description: "Approve the correction; applies the earnings change and cascades recomputation", roles: [ClaimsSpecialist], code: 200, input: [], output: CorrectionRequest, side_effects: ["EarningsYear overwrite (corrected := true)", "RecomputationEvent per affected claim", "recomputation_delta: underpayment credit or auto-OverpaymentCase", "increments version by 1"] }
  - { method: POST, path: "/ssa/correction-requests/{id}/deny", description: "Deny the correction", roles: [ClaimsSpecialist], code: 200, input: [denial_reason], output: CorrectionRequest, side_effects: ["PENDING_REVIEW -> DENIED", "increments version by 1"] }
  - { method: POST, path: "/ssa/correction-requests/{id}/reopen", description: "Reopen a denied correction within 60 days; adjudicator segregation enforced", roles: [SeniorAdjudicator], code: 200, input: [reopen_reason], output: CorrectionRequest, side_effects: ["DENIED -> PENDING_REVIEW", "increments version by 1"] }
  - { method: POST, path: "/ssa/claims", description: "File a benefit claim (RETIREMENT | SPOUSAL | DIVORCED_SPOUSAL | SURVIVOR)", roles: [Claimant, ClaimsSpecialist], code: 201, input: [worker_id, claim_type, entitlement_month, "relationship_id?"], output: BenefitClaim, side_effects: ["status := FILED"] }
  - { method: GET, path: "/ssa/claims/{id}", description: "Read one claim", roles: [ClaimsSpecialist, SeniorAdjudicator, ProgramAdministrator, Claimant], code: 200, input: [], output: BenefitClaim, side_effects: [] }
  - { method: GET, path: "/ssa/claims", description: "List claims with optional filters and pagination", roles: [ClaimsSpecialist, SeniorAdjudicator, ProgramAdministrator, Claimant], code: 200, input: ["worker_id?", "relationship_id?", "status?", "limit?", "offset?"], output: "BenefitClaim[]", side_effects: [] }
  - { method: POST, path: "/ssa/claims/{id}/approve", description: "Adjudicate approval: computes AIME/PIA (WEP), age adjustment (DRC), spousal excess, family maximum, GPO", roles: [ClaimsSpecialist], code: 200, input: [], output: BenefitClaim, side_effects: ["FILED -> ENTITLED; all computed fields populated", "increments version by 1"] }
  - { method: POST, path: "/ssa/claims/{id}/deny", description: "Adjudicate denial", roles: [ClaimsSpecialist], code: 200, input: [denial_reason], output: BenefitClaim, side_effects: ["FILED -> DENIED", "increments version by 1"] }
  - { method: POST, path: "/ssa/claims/{id}/reopen", description: "Reopen a denied claim within 60 days; adjudicator segregation enforced", roles: [SeniorAdjudicator], code: 200, input: [reopen_reason], output: BenefitClaim, side_effects: ["DENIED -> FILED", "increments version by 1"] }
  - { method: POST, path: "/ssa/claims/{id}/withdraw", description: "Withdrawal of application: within 12 months of entitlement, full repayment in the same call, once per lifetime", roles: [Claimant, ClaimsSpecialist], code: 200, input: [repaid_amount_cents], output: BenefitClaim, side_effects: ["ENTITLED -> WITHDRAWN; payments -> REPAYED; worker.withdrawal_used := true", "increments version by 1"] }
  - { method: POST, path: "/ssa/claims/{id}/suspend", description: "Voluntary suspension at/after FRA and before 70; OCC-guarded", roles: [Claimant, ClaimsSpecialist], code: 200, input: [expected_claim_version], output: BenefitClaim, side_effects: ["ENTITLED -> SUSPENDED; suspended_since := current month", "increments version by 1"] }
  - { method: POST, path: "/ssa/claims/{id}/resume", description: "Resume from suspension; accrues DRCs for suspended months and recomputes the benefit", roles: [Claimant, ClaimsSpecialist], code: 200, input: [], output: BenefitClaim, side_effects: ["SUSPENDED -> ENTITLED; drc_months recomputed; RecomputationEvent (SUSPENSION_RESUME)", "increments version by 1"] }
  - { method: GET, path: "/ssa/claims/{id}/payments", description: "List generated payments for the claim", roles: [ClaimsSpecialist, SeniorAdjudicator, ProgramAdministrator, Claimant], code: 200, input: [], output: "BenefitPayment[]", side_effects: [] }
  - { method: GET, path: "/ssa/claims/{id}/overpayment-cases", description: "List overpayment cases on the claim", roles: [ClaimsSpecialist, SeniorAdjudicator, Claimant], code: 200, input: [], output: "OverpaymentCase[]", side_effects: [] }
  - { method: GET, path: "/ssa/claims/{id}/payee-cases", description: "List representative-payee cases on the claim", roles: [ClaimsSpecialist, SeniorAdjudicator, Claimant], code: 200, input: [], output: "PayeeCase[]", side_effects: [] }
  - { method: GET, path: "/ssa/claims/{id}/recomputation-events", description: "List recomputation events for the claim (append-only audit)", roles: [ClaimsSpecialist, SeniorAdjudicator, ProgramAdministrator, Claimant], code: 200, input: [], output: "RecomputationEvent[]", side_effects: [] }
  - { method: POST, path: "/ssa/overpayment-cases", description: "Open an overpayment case; notice is stamped at creation (status NOTIFIED)", roles: [ClaimsSpecialist], code: 201, input: [claim_id, amount_cents, period_start_month, period_end_month, reason], output: OverpaymentCase, side_effects: ["status := NOTIFIED; created_by := X-User-ID"] }
  - { method: POST, path: "/ssa/overpayment-cases/{id}/request-waiver", description: "Request waiver of recovery within 30 days of notice; OCC-guarded", roles: [Claimant, ClaimsSpecialist], code: 200, input: [expected_overpayment_version, waiver_grounds], output: OverpaymentCase, side_effects: ["NOTIFIED -> WAIVER_REVIEW", "increments version by 1"] }
  - { method: POST, path: "/ssa/overpayment-cases/{id}/decide-waiver", description: "Decide the waiver; segregation from the case creator enforced", roles: [SeniorAdjudicator], code: 200, input: [outcome], output: OverpaymentCase, side_effects: ["GRANTED -> WAIVED (debt forgiven); DENIED -> RECOVERY_ACTIVE", "increments version by 1"] }
  - { method: POST, path: "/ssa/overpayment-cases/{id}/begin-recovery", description: "Start recovery after the waiver window; elects the claim-level recovery mode", roles: [ClaimsSpecialist], code: 200, input: [recovery_mode, "monthly_rate_cents?"], output: OverpaymentCase, side_effects: ["NOTIFIED -> RECOVERY_ACTIVE; claim.recovery_mode := recovery_mode", "increments version by 1"] }
  - { method: POST, path: "/ssa/relationships", description: "Assert a spousal relationship between two worker records", roles: [Claimant, ClaimsSpecialist], code: 201, input: [worker_id, spouse_worker_id, relationship_type, marriage_date, "divorce_date?"], output: Relationship, side_effects: ["status := ASSERTED"] }
  - { method: POST, path: "/ssa/relationships/{id}/verify", description: "Verify relationship evidence; overlap exclusivity and WIDOW-requires-death enforced here", roles: [ClaimsSpecialist], code: 200, input: [], output: Relationship, side_effects: ["ASSERTED -> VERIFIED", "increments version by 1"] }
  - { method: POST, path: "/ssa/relationships/{id}/reject", description: "Reject relationship evidence", roles: [ClaimsSpecialist], code: 200, input: [rejection_reason], output: Relationship, side_effects: ["ASSERTED -> REJECTED", "increments version by 1"] }
  - { method: POST, path: "/ssa/payee-cases", description: "Open a representative-payee determination for a claim whose beneficiary cannot manage funds; claim must be ENTITLED", roles: [ClaimsSpecialist], code: 201, input: [claim_id, payee_name, determination_basis], output: PayeeCase, side_effects: ["status := INVESTIGATING; created_by := X-User-ID"] }
  - { method: POST, path: "/ssa/payee-cases/{id}/decide", description: "Decide the payee determination; segregation from creator; capacity-1 ACTIVE per claim", roles: [SeniorAdjudicator], code: 200, input: [outcome], output: PayeeCase, side_effects: ["APPROVED -> ACTIVE (claim.has_active_payee := true, future payments route paid_to=REPRESENTATIVE_PAYEE); DENIED -> DENIED", "increments version by 1"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO-8601 UTC). Server startup default before any call is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time.", roles: [ProgramAdministrator], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }
  - { method: POST, path: "/_batch/run-monthly-cycle", description: "Ops-run checkpoint: run the monthly benefit cycle (default run_month = current logical month; explicit run_month allowed for operator replay). Processing order within a run is pinned: (1) January COLA for ENTITLED claims entitled before this January; (2) auto-resume of SUSPENDED claims whose age_months at run_month >= 840; (3) payment generation — one BenefitPayment per ENTITLED claim with entitlement_month <= run_month, applying the withholding waterfall and draining underpayment credits; (4) sweep of time-barred corrections to EXPIRED; (5) auto begin-recovery (FULL mode) for NOTIFIED overpayment cases whose 30-day waiver window lapsed before run_month — such cases start withholding from the NEXT cycle. Idempotent: re-running an already-run month returns already_run=true with zero counts and creates nothing.", roles: [ProgramAdministrator], code: 200, input: ["run_month?"], output: "{ run_month: string, payments_created: integer, corrections_expired: integer, claims_auto_resumed: integer, overpayments_recovered: integer, cola_applied: integer, already_run: boolean }", side_effects: ["BenefitPayment rows created", "cola_adjustment (January runs)", "overpayment_withholding", "CorrectionRequest EXPIRED sweep", "auto-resume at 70", "auto begin-recovery after waiver window"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or unrecognized role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Recognized role is not in the endpoint's allowed roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Claimant's X-User-ID does not match the target resource's worker_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unparseable type/enum, violated conditional-requirement, or out-of-range scalar" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "No worker with the given id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No claim with the given id" }
  - { id: ERR_CORRECTION_NOT_FOUND, http: 404, condition: "No correction request with the given id" }
  - { id: ERR_RELATIONSHIP_NOT_FOUND, http: 404, condition: "No relationship with the given id" }
  - { id: ERR_OVERPAYMENT_NOT_FOUND, http: 404, condition: "No overpayment case with the given id" }
  - { id: ERR_PAYEE_CASE_NOT_FOUND, http: 404, condition: "No payee case with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a from-state of the invoked transition" }
  - { id: ERR_CLAIM_ALREADY_TERMINAL, http: 409, condition: "Claim is WITHDRAWN or TERMINATED; no further actions exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the entity's current version (OCC)" }
  - { id: ERR_SAME_ADJUDICATOR, http: 409, condition: "Segregation of duties violated: reopen/waiver/payee decision attempted by the same operator who made the prior determination" }
  - { id: ERR_WORKER_DECEASED, http: 409, condition: "New RETIREMENT claim filed for a worker with status DECEASED" }
  - { id: ERR_DUPLICATE_ACTIVE_CLAIM, http: 409, condition: "A non-terminal claim already exists for (worker_id, claim_type)" }
  - { id: ERR_DUPLICATE_PENDING_CORRECTION, http: 409, condition: "A non-terminal correction already exists for (worker_id, tax_year)" }
  - { id: ERR_RELATIONSHIP_OVERLAP, http: 409, condition: "Verifying would create overlapping VERIFIED marriage intervals on a shared worker endpoint (half-open interval semantics)" }
  - { id: ERR_ACTIVE_PAYEE_EXISTS, http: 409, condition: "The claim already has an ACTIVE representative payee (capacity 1)" }
  - { id: ERR_NO_EARNINGS_DISCREPANCY, http: 422, condition: "Correction claims earnings equal to the posted amount (missing year counts as 0)" }
  - { id: ERR_CORRECTION_TIME_BARRED, http: 422, condition: "Logical clock is past (tax_year+4)-04-15, the 3-year/3-month/15-day correction statute" }
  - { id: ERR_WITHDRAWAL_WINDOW_EXPIRED, http: 422, condition: "Withdrawal attempted more than 12 months after entitlement_month" }
  - { id: ERR_WITHDRAWAL_ALREADY_USED, http: 422, condition: "The worker has already used the once-per-lifetime withdrawal" }
  - { id: ERR_REPAYMENT_SHORTFALL, http: 422, condition: "repaid_amount_cents differs from claim.total_paid_cents at withdrawal" }
  - { id: ERR_WAIVER_WINDOW_CLOSED, http: 422, condition: "Waiver requested more than 30 days after the overpayment notice" }
  - { id: ERR_WAIVER_WINDOW_OPEN, http: 422, condition: "Manual begin-recovery attempted while the 30-day waiver window is still open" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 422, condition: "Reopen attempted more than 60 days after the denial decision" }
  - { id: ERR_DIVORCE_WAITING_PERIOD, http: 422, condition: "Divorced-spouse claim within 24 months of divorce while the covered worker is not yet entitled" }
  - { id: ERR_RELATIONSHIP_NOT_VERIFIED, http: 422, condition: "Auxiliary claim approved against a relationship that is not VERIFIED" }
  - { id: ERR_SPOUSE_NOT_ENTITLED, http: 422, condition: "SPOUSAL claim while the covered worker holds no ENTITLED/SUSPENDED RETIREMENT claim" }
  - { id: ERR_WORKER_NOT_DECEASED, http: 422, condition: "SURVIVOR claim or WIDOW verification while the covered worker is LIVING" }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "Claiming age below 744 months (720 for survivors) or above 840 at entitlement" }
  - { id: ERR_SUSPENSION_AGE_INELIGIBLE, http: 422, condition: "Voluntary suspension before FRA or at/after age 70 (840 months)" }
  - { id: ERR_MARRIAGE_DURATION_INSUFFICIENT, http: 422, condition: "Marriage shorter than 12 months (SPOUSAL at entitlement), 120 months (DIVORCED_SPOUSAL), or 9 months (SURVIVOR at death)" }
  - { id: ERR_RECOVERY_RATE_TOO_LOW, http: 422, condition: "PARTIAL recovery election below 10% of the claim's monthly benefit" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Claimant
    description: "A worker acting on their own record: files claims and corrections, submits evidence, withdraws, suspends/resumes, requests waivers. X-User-ID equals the Worker.id they act as."
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /ssa/claims/{id}/withdraw (own claim, shared with ClaimsSpecialist)"
      - "POST /ssa/claims/{id}/suspend and /resume (own claim)"
      - "POST /ssa/correction-requests/{id}/submit-evidence (own record)"
      - "POST /ssa/overpayment-cases/{id}/request-waiver (own debt)"
    shared_operations:
      - "read own worker, earnings, wage reports, relationships, corrections, claims, payments, overpayments, payee cases, recomputation events"
      - "POST /ssa/claims and /ssa/correction-requests for self"
      - "POST /ssa/relationships involving self"
  - name: Employer
    description: "External employer payroll account submitting wage reports; not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /ssa/wage-reports (shared with ProgramAdministrator)"
      - "GET /ssa/workers/{id}/wage-reports"
  - name: ClaimsSpecialist
    description: "Field-office adjudicator, level 1: intake, evidence verification, first-instance decisions, overpayment creation, payee-case creation."
    identity: "opaque"
    exclusive_operations:
      - "POST /ssa/workers/{id}/report-death"
      - "PATCH /ssa/workers/{id} (pension recording)"
      - "POST /ssa/relationships/{id}/verify and /reject"
      - "POST /ssa/claims/{id}/approve and /deny"
      - "POST /ssa/correction-requests/{id}/request-evidence, /approve, /deny"
      - "POST /ssa/overpayment-cases and /begin-recovery"
      - "POST /ssa/payee-cases"
    shared_operations:
      - "POST /ssa/workers (shared with ProgramAdministrator)"
      - "create claims/corrections on behalf of claimants"
      - "read all resources"
  - name: SeniorAdjudicator
    description: "Second-instance decision maker: reopens denials, decides waivers, decides payee determinations. Segregation of duties: must never be the operator who made the contested first-instance decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /ssa/claims/{id}/reopen"
      - "POST /ssa/correction-requests/{id}/reopen"
      - "POST /ssa/overpayment-cases/{id}/decide-waiver"
      - "POST /ssa/payee-cases/{id}/decide"
    shared_operations:
      - "read all resources"
  - name: ProgramAdministrator
    description: "Platform operator: logical clock, monthly batch cycle, worker intake, wage report ingestion fallback."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_batch/run-monthly-cycle"
