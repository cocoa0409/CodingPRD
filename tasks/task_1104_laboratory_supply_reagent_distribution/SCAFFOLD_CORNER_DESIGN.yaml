            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
