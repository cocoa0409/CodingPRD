      - name: cascading_side_effect_chain_covered_by_difficulty_index
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.InterchangeEvent.RECORDED_to_VOIDED
        excluded_because:
          difficulty_instance: erroneous_event_void_cascades_five_levels_from_event_to_railroad_exposure
          rationale: "The five-level chain event -> movement -> ledger -> cycle -> exposure, including ordering sensitivity and the requirement that already-settled levels are not silently rewritten, is designed end-to-end in the difficulty index. Restating it here would duplicate the same call sequence and the same asserted totals."

      - name: dual_variant_divergence_covered_by_difficulty_index
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.settlement_statement
        excluded_because:
          difficulty_instance: settlement_statement_as_reported_vs_reconciled_diverge_by_4676
          rationale: "Both variants of the statement, the exact delta between them and the ledger consequence of switching are all asserted in the difficulty index on a fixture built for that divergence; the layer-level claim adds nothing beyond it."

