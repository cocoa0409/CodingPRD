  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: packaging_yield_nested_floor_then_min_against_the_request_cap
        grounds:
          - calculations.packaging_yield
          - entities.PackagingRun.fields.net_liters
          - entities.PackagingRun.fields.units_produced
          - state_machines.PackagingRun.start_run
        distinguishing_aspect: |
          Mode (a) — a four-input non-linear formula (gross liters, loss
          percentage, container size, request cap) whose result switches
          between the floor-division branch and the min-cap branch: the same
          100 L draw yields 258 units at max_units_requested 300 and exactly
          200 units at max_units_requested 200.
        test_recipe:
          setup:
            - "Clock at 2026-05-10. One NON_ALCOHOLIC recipe with an APPROVED raw label."
            - "One CONFORMING READY_TO_PACKAGE batch of 400 L with a PACKAGING reading of abv_pct 0.44."
            - "Two BOTTLE runs on the same approved label, each holding one 100 L draw, differing only in max_units_requested (300 versus 200)."
