            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "GET /glass-plant/bottle-designs/${d}"
              payload: {}
              as: QualityEngineer
              captures: { dv: "$.data.version" }
          trigger:
            - call: "POST /glass-plant/lightweighting-programs"
              payload: { baseline_design_id: "${d}", code: "LW-X2-HEAVY", target_weight_g: 200.00, annual_volume_units: 1000000, resin_free_glass_price_per_kg: 0.5000, expected_design_version: "${dv}" }
              as: QualityEngineer
          assert:
            - "HTTP 422 and data.error_id == ERR_TARGET_WEIGHT_NOT_LIGHTER"
            - "${dv} == 4 and BottleDesign.${d}.version is still 4 after the refusal"
            - "GET /glass-plant/lightweighting-programs with baseline_design_id ${d} returns total_count 0"
            - "the same body with target_weight_g 189.00 and code LW-X2-LIGHT returns 201 with status DRAFT and weight_saved_g == 0.00 until assess-risk"
            - "after that success BottleDesign.${d}.version == 5"

