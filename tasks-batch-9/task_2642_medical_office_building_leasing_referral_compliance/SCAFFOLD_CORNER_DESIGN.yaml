      - name: building_read_is_a_computed_read_over_the_mix_and_the_pool
        claim_type: computed_read
        grounds:
          - endpoints[GET /buildings/{id}]
        excluded_because:
          difficulty_instance: rentable_square_footage_conserved_across_execute_and_terminate
          rationale: "The derived mix and vacancy fields returned by GET /buildings/{id} are asserted there before and after both an execute and a terminate; the parking side of the same read is asserted by parking_stall_pool_conserved_across_allocate_and_revoke."

