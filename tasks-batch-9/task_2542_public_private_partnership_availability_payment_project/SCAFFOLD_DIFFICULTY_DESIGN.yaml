          setup:
            - "A concession at OPERATIONS with monthly_unitary_charge_cents 8604167."
            - "One ServicePeriod (period_index 1, 2027-03-01 .. 2027-04-01) freshly created, so reporting_status == PENDING and payment_status == UNBILLED."
            - "Logical clock at 2027-04-02T00:00:00Z."
