            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "BEVERAGES", facings: 1, window_start_date: "2026-08-10", window_end_date: "2026-08-20" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "w2 created (6 + 4 == 10 == total_facings — equality allowed; distinct categories so no overlap gate)"
            - "err == ERR_SPACE_CAPACITY_EXCEEDED (6 + 4 + 1 == 11 > 10)"
            - "SpaceAllocation.${w2}.status == PLANNED (window starts 2026-08-10 after clock 2026-08-01)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_confirm_requires_agreement_active
        grounds: [state_machines.ServiceVisit.COUNTS_SUBMITTED_to_CONFIRMED, "validations[priority=27]", "errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        distinguishing_aspect: |
          Pair ServiceVisit -> StoreAgreement: a visit legally in COUNTS_SUBMITTED
          cannot confirm once its (separate) agreement aggregate has moved to
          SUSPENDED — the visit's own state is necessary but not sufficient.
        test_recipe:
          setup:
            - "ACTIVE agreement (cap 50000); directive 200; route drv-1; visit checked in with counts submitted (restock 10, value 1000)"
            - "Agreement then suspended by JobberAdmin before the retailer confirms"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "GateCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store G", store_code: "STG", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "MILK-001", name: "Milk 1L", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route G", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 10 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /agreements/${agr}/suspend", payload: { reason: "shrink investigation" }, as: JobberAdmin }
          trigger:
            - { call: "POST /service-visits/${visit}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_AGREEMENT_NOT_ACTIVE (http 409)"
            - "ServiceVisit.${visit}.status remains COUNTS_SUBMITTED; no InventoryBalance is created (no restock posted)"

      - name: settlement_finalize_requires_certified_audits
        grounds: [state_machines.SettlementStatement.PROVISIONAL_to_FINALIZED, "validations[priority=28]", "errors[ERR_AUDIT_NOT_CERTIFIED]"]
        distinguishing_aspect: |
          Pair SettlementStatement -> AuditCount (a different entity pair than
          ServiceVisit -> StoreAgreement): finalize is blocked while any audit whose
          submitted_at falls inside the statement window is still SUBMITTED, even
          though the statement itself is in a valid PROVISIONAL state with a correct
          OCC version and a closed period.
        test_recipe:
          setup:
            - "ACTIVE agreement (est shrink 0); directive 200; SALE 10 units at 2026-08-01T10:00:00Z"
            - "Audit created 2026-08-02, started, submitted (counted 0 = book 0) and left SUBMITTED"
            - "Statement for period 0 generated (PROVISIONAL); clock advanced past period end"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "AuditGate" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store A", store_code: "STA", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, estimated_shrink_rate: 0.0 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
