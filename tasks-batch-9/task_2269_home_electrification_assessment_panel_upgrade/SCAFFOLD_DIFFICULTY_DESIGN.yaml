              as_user_id: "admin-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections"
              payload: { project_id: "${proj_id}", inspector_id: "${insp_id}", inspection_type: "SPOT", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z" }
