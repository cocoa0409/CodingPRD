              as: DealerPartner
              as_user_id: "${dlr1_id}"
              captures: { errD1: $.data.error_id }
            - call: "POST /api/v1/dealers/${dlr1_id}/enroll-used-program"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/dealers/${dlr1_id}/used-reactivations"
