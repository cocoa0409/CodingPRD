      - name: station_hours_round_once_at_the_end_not_per_factor
        claim_type: precision
        grounds:
          - calculations.unit_order_configuration_totals.precision
          - calculations.unit_order_configuration_totals.formula
        distinguishing_aspect: "required_station_hours is 47.47, not 47.48: raw 41.10 * 1.05 * 1.15... precisely raw 41.10 * 1.05 * 1.10 = 47.4705 rounded once, whereas rounding the intermediate 43.155 to 43.16 first and then multiplying by 1.10 yields 47.48."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "FloorPlan FP-2900 (CLASS_C, 29 ft, msrp 8000000, base hours 36.10, dry 6000, gvwr 9000, wheelbase 180, 50 A, 60 gal); five weightless zero-amp INTERIOR options OPT-N1..OPT-N5 of 1.00 h each; dealer D-TOW in region CENTRAL; one DRAFT STOCK order on all five."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-2900", chassis_class: "CLASS_C", length_ft: 29, base_msrp_cents: 8000000, base_station_hours: 36.10, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
