  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: cascading_side_effects_settle_servicing_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SettlementWindow.NETTED_to_SETTLED
          - calculations.custody_position_servicing
          - calculations.fail_mark_to_market
        distinguishing_aspect: "A single settle call runs two labelled servicing passes in a pinned order — corporate-action servicing first, then the fail-mark recompute — so the observable cash leg reflects the serviced quantity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants SO2 and SP2 are ACTIVE; Security ORD1 has a NETTED window for 2026-09-10 with SO2 net long 4 units at 400000 cents fully funded; a CASH_DIVIDEND of 25 cents per unit with effective_date 2026-09-09 is announced and applied."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Order Alpha", lei: "LEI-SO2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_so2: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Order Beta", lei: "LEI-SP2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_sp2: $.data.id }
            - call: "POST /clearing/participants/${p_so2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_sp2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "ORD1", cusip: "912828XV4", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_ord: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_ord}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_ord: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_sp2}", security_id: "${sec_ord}", side: "BUY", quantity: 4, trade_price_cents: 100000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_so2}"
              captures: { t_ord: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_ord}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_so2}"
            - call: "POST /clearing/settlement-windows/${win_ord}/net"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/participants/${p_so2}/net-positions"
              payload: {}
              as: ClearingMember
              captures: { np_ord: "$.data[0].id" }
            - call: "POST /clearing/net-positions/${np_ord}/fund"
              payload: { amount_cents: 400000 }
              as: ClearingMember
              as_user_id: "${p_so2}"
            - call: "POST /clearing/corporate-actions"
              payload: { security_id: "${sec_ord}", action_type: "CASH_DIVIDEND", cash_rate_cents_per_unit: 25, effective_date: "2026-09-09" }
              as: PlatformAdmin
              captures: { ca_ord: $.data.id }
            - call: "POST /clearing/corporate-actions/${ca_ord}/apply"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/settlement-windows/${win_ord}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 and SettlementWindow.${win_ord}.status == SETTLED"
            - "NetPosition.${np_ord}.dvp_status == RECEIVED and cash_delta_cents == 400100, being the 400000 trade leg plus 4 units at 25 cents"
            - "the corporate-action servicing pass is the first of the two passes, so the cash leg already includes the dividend when the response returns"

      - name: pagination_filter_interaction_on_net_positions
