            - call: "POST /cle/courses"
              payload: { title: "Ethics And Tech Only", delivery_format: "LIVE_WEBCAST", total_minutes: 240, presented_at: "2026-03-03T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 180 }, { category: "TECHNOLOGY", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "GET /cle/courses/${crs_id}"
              as: BoardAdmin
              captures: { code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2031", full_name: "Marcus Feld", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "IL" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 240, completion_date: "2026-03-03T13:00:00Z", attendance_code: "${code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_id: $.data.id }
            - call: "GET /cle/attorneys/${att_id}"
              as: BoardAdmin
              captures: { att_v: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "COMITY", origin_jurisdiction: "IL", origin_course_title: "Illinois full compliance certificate", origin_credit_hours: 1.0, origin_category: "GENERAL", completion_date: "2026-04-04T00:00:00Z", expected_attorney_version: "${att_v}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { clm_id: $.data.id }
          trigger:
            - call: "POST /cle/reciprocity-claims/${clm_id}/determination"
