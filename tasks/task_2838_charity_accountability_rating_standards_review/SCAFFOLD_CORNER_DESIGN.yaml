      - name: complaint_triage_twice_returns_complaint_state_invalid
        claim_type: Idempotency
        grounds:
          - state_machines.Complaint.INTAKE_to_INVESTIGATING
          - endpoints.POST_/complaints/{complaint_id}/triage
          - errors.ERR_COMPLAINT_STATE_INVALID
          - calculations.complaint_credibility_score
        distinguishing_aspect: |
          The second triage carries a different disposition, so replaying it
          would not merely be redundant - it would overwrite an INVESTIGATING
          complaint's credibility_variant back to INTAKE and stamp resolved_at
          on a case that is still open. Only the INTAKE row may be triaged, and
          the investigation_due_at horizon is therefore armed exactly once.
        test_recipe:
          setup:
            - "A DONOR complaint in category MISUSE_OF_FUNDS with 2 corroborating documents has been triaged INVESTIGATE at clock 2026-09-01, giving credibility_score 76.00 and severity_tier MEDIUM"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /complaints"
              payload: { organization_id: "${org1}", complainant_kind: "DONOR", category: "MISUSE_OF_FUNDS", narrative: "Restricted gift was spent on general overhead", corroborating_document_count: 2 }
              as: PublicUser
              as_user_id: "public-1"
              captures: { cp1: $.data.id }
            - call: "POST /complaints/${cp1}/triage"
              payload: { disposition: "INVESTIGATE", triage_note: "Documents warrant review" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /complaints/${cp1}/triage"
