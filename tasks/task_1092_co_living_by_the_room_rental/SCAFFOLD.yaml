scenario: "Co-Living & By-the-Room Rental (PadSplit style): room & member, application & background/income, weekly/monthly all-in rent, house-rules & compliance, move-in/out & proration, maintenance & shared-space, community/manager, payout"
domain_name: "co-living-by-the-room-rental"
api_prefix: "/co-living"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nested ownership path
  # beyond two sub-resource read channels (screening reports, payments).
  # Every write endpoint addresses its own top-level collection.

  state_machine_shape: parallel
  # Membership carries two independent state axes (tenancy_status x
  # billing_status) that evolve on different triggers; HouseRuleIncident and
  # Room are cyclic; House.compliance_posture is a derived posture gate.

  relationship_patterns:
    - one_to_many        # House -> Room, Membership -> Invoice, Invoice -> Payment
    - cross_aggregate    # Membership references Application, Member, Room and House
    - polymorphic_optional  # MaintenanceTicket.room_id / affected_membership_id may be null (shared-space tickets)

  role_model: segregation_of_duties
  # The ComplianceOfficer who filed a HouseRuleIncident may not adjudicate it;
  # the FinanceAdmin who projected a Payout may not release it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Host
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal entity name of the property owner receiving payouts."
        constraints: "non-empty, max 200 chars"
      - name: payout_account_ref
        type: string
        source: input
        description: "Opaque bank/payment account reference the Payout is remitted to."
        constraints: "non-empty"
      - name: contact_email
        type: string
        source: input
        description: "Operational contact address for the host."
        constraints: "must contain '@'"

  - name: House
    parent: null
    common_fields: true
    fields:
      - name: host_id
        type: string
        source: input
        description: "FK -> Host.id; owner of the property and payout recipient."
      - name: label
        type: string
        source: input
        description: "Human-readable house label, e.g. 'Peachtree A'."
        constraints: "non-empty"
      - name: address_line1
        type: string
        source: input
        description: "Street address of the co-living house."
      - name: city
        type: string
        source: input
        description: "City the house sits in."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code."
        constraints: "exactly 2 uppercase letters"
      - name: monthly_utility_budget_cents
        type: integer
        source: input
        description: "House-level all-in utility budget per month, shared across occupied rooms by calculations.invoice_charge_assembly."
        constraints: ">= 0"
      - name: total_room_count
        type: integer
        source: computed
        description: "Count of Room rows whose house_id equals this House.id. Recomputed on every Room create."
        default: 0
      - name: vacant_room_count
        type: integer
        source: computed
        description: "Count of Rooms in this house with occupancy_state == VACANT."
        default: 0
      - name: reserved_room_count
        type: integer
        source: computed
        description: "Count of Rooms in this house with occupancy_state == RESERVED."
        default: 0
      - name: occupied_room_count
        type: integer
        source: computed
        description: "Count of Rooms in this house with occupancy_state == OCCUPIED."
        default: 0
      - name: notice_pending_room_count
        type: integer
        source: computed
        description: "Count of Rooms in this house with occupancy_state == NOTICE_PENDING."
        default: 0
      - name: out_of_service_room_count
        type: integer
        source: computed
        description: "Count of Rooms in this house with occupancy_state == OUT_OF_SERVICE."
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate over the house; re-evaluated freshly at the start of every request that reads or gates on it (see calculations.house_compliance_posture). OPEN allows move-ins; RESTRICTED blocks move-ins; FROZEN blocks move-ins and payout releases."
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: house_id
        type: string
        source: input
        description: "FK -> House.id; the house this rentable room belongs to."
      - name: room_number
        type: string
        source: input
        description: "Room label, unique within the house."
        constraints: "non-empty; unique per house_id"
      - name: weekly_rate_cents
        type: integer
        source: input
        description: "All-in weekly base rent for this room, excluding the shared utility share."
        constraints: "> 0"
      - name: monthly_rate_cents
        type: integer
        source: input
        description: "All-in monthly base rent for this room, excluding the shared utility share."
        constraints: "> 0"
      - name: private_bath
        type: boolean
        source: input
        description: "True when the room has a private bathroom."
        default: false
      - name: occupancy_state
        type: enum
        source: system
        description: "Room lifecycle axis driven by state_machines.Room."
        default: VACANT
        constraints: "one of VACANT, RESERVED, OCCUPIED, NOTICE_PENDING, OUT_OF_SERVICE"
      - name: available_from_date
        type: datetime
        source: computed
        description: "Date (YYYY-MM-DD) the room is next bookable; set to scheduled_move_out_date + TURNOVER_BUFFER_DAYS when the room enters NOTICE_PENDING, and to null when it returns to VACANT."
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Resident's full name."
        constraints: "non-empty"
      - name: email
        type: string
        source: input
        description: "Login/contact email; globally unique across Members."
        constraints: "must contain '@'; unique"
      - name: declared_monthly_income_cents
        type: integer
        source: input
        description: "Self-declared monthly income at signup. Never used for qualification; only ScreeningReport.verified_monthly_income_cents is."
        constraints: ">= 0"
      - name: strike_points
        type: integer
        source: computed
        description: "Rolling house-rule strike total, see calculations.member_strike_standing. Cross-entity: aggregated over UPHELD HouseRuleIncident rows of this member's memberships."
        default: 0
      - name: standing_band
        type: enum
        source: computed
        description: "Derived band over strike_points: GOOD (0), WATCH (1-5), PROBATION (>= STRIKE_SUSPENSION_THRESHOLD)."
        default: GOOD
        constraints: "one of GOOD, WATCH, PROBATION"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the prospective resident."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the specific by-the-room unit applied for."
      - name: requested_move_in_date
        type: datetime
        source: input
        description: "Requested move-in date (YYYY-MM-DD)."
      - name: billing_cycle
        type: enum
        source: input
        description: "Chosen all-in rent cadence for the resulting tenancy."
        constraints: "one of WEEKLY, MONTHLY"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle axis driven by state_machines.Application."
        default: SUBMITTED
        constraints: "one of SUBMITTED, SCREENED, APPROVED, CONDITIONAL, DENIED, CONVERTED"
      - name: cosigner_monthly_income_cents
        type: integer
        source: input
        description: "Verified cosigner income added to the applicant's own on the resubmit round; null until POST /co-living/applications/{id}/resubmit supplies it."
        default: null
        constraints: ">= 0 when present"
      - name: screening_round
        type: integer
        source: computed
        description: "Count of ScreeningReport rows whose application_id equals this Application.id."
        default: 0
      - name: monthly_equivalent_cents
        type: integer
        source: computed
        description: "Normalized monthly rent used for qualification, see calculations.application_income_qualification."
        default: 0
      - name: required_income_cents
        type: integer
        source: computed
        description: "round_half_up(monthly_equivalent_cents * INCOME_MULTIPLE); the bar qualifying income must reach with '>='."
        default: 0
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Deposit pinned at decision time, see calculations.application_deposit_requirement. Stays 0 until a decision lands."
        default: 0
      - name: decision_note
        type: string
        source: input
        description: "Free-text note recorded by the ComplianceOfficer on the decision call."
        default: null

  - name: ScreeningReport
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this background/income result belongs to."
      - name: sequence_number
        type: integer
        source: computed
        description: "1-based round index; equals the application's prior screening_round + 1 at insert time. Used as the deterministic tie-break when two reports share created_at."
      - name: background_result
        type: enum
        source: input
        description: "Vendor background outcome."
        constraints: "one of CLEAR, FLAGGED, FAILED"
      - name: verified_monthly_income_cents
        type: integer
        source: input
        description: "Vendor-verified monthly income for the applicant (excludes any cosigner)."
        constraints: ">= 0"
      - name: report_reference
        type: string
        source: input
        description: "Opaque vendor report reference string."
        constraints: "non-empty"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that filed the report."

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the approved application converted into this tenancy."
      - name: member_id
        type: string
        source: computed
        description: "FK -> Member.id; copied from the application at creation."
      - name: room_id
        type: string
        source: computed
        description: "FK -> Room.id; copied from the application at creation."
      - name: house_id
        type: string
        source: computed
        description: "FK -> House.id; copied from the room at creation."
      - name: billing_cycle
        type: enum
        source: computed
        description: "Copied from Application.billing_cycle at creation."
        constraints: "one of WEEKLY, MONTHLY"
      - name: period_days
        type: integer
        source: computed
        description: "Fixed divisor for every proration on this tenancy: 7 when billing_cycle == WEEKLY, 30 when MONTHLY. Calendar month length is never used."
      - name: base_period_rate_cents
        type: integer
        source: computed
        description: "Room.weekly_rate_cents when WEEKLY, Room.monthly_rate_cents when MONTHLY, pinned at creation and immune to later PUT /co-living/rooms/{id} rate edits."
      - name: deposit_cents
        type: integer
        source: computed
        description: "Copied from Application.required_deposit_cents at creation."
      - name: move_in_date
        type: datetime
        source: input
        description: "Scheduled first billable day (YYYY-MM-DD)."
      - name: tenancy_status
        type: enum
        source: system
        description: "First parallel state axis, driven by state_machines.Membership (tenancy_status)."
        default: PENDING_MOVE_IN
        constraints: "one of PENDING_MOVE_IN, ACTIVE, NOTICE_GIVEN, MOVED_OUT, CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: "Second parallel state axis, driven by state_machines.Membership (billing_status). Evolves independently of tenancy_status."
        default: CURRENT
        constraints: "one of CURRENT, PAST_DUE, SETTLED"
      - name: notice_reason
        type: enum
        source: system
        description: "Why the tenancy entered NOTICE_GIVEN; null in every other tenancy_status."
        default: null
        constraints: "one of MEMBER_INITIATED, NONPAYMENT, COMPLIANCE"
      - name: scheduled_move_out_date
        type: datetime
        source: system
        description: "Move-out date pinned when notice is given (YYYY-MM-DD); cleared back to null on auto-rescind."
        default: null
      - name: actual_move_out_date
        type: datetime
        source: input
        description: "Real last billable day supplied on POST /co-living/memberships/{id}/move-out."
        default: null
      - name: effective_end_date
        type: datetime
        source: computed
        description: "COALESCE(actual_move_out_date, scheduled_move_out_date); the right edge of this tenancy's closed occupancy interval on the room."
        default: null
      - name: provisional_final_charge_cents
        type: integer
        source: computed
        description: "Forward-looking whole-period estimate written at notice time, see calculations.move_out_proration variant provisional_notice_block."
        default: null
      - name: final_charge_cents
        type: integer
        source: computed
        description: "Chronological daily settlement written at move-out, see calculations.move_out_proration variant final_settlement_daily."
        default: null
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Live outstanding balance, see calculations.membership_balance_due."
        default: 0

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the tenancy this billing period belongs to."
      - name: period_start
        type: datetime
        source: input
        description: "First day of the billing period (YYYY-MM-DD), inclusive."
      - name: period_end
        type: datetime
        source: input
        description: "Last day of the billing period (YYYY-MM-DD), inclusive. period_end - period_start + 1 must equal Membership.period_days."
      - name: due_date
        type: datetime
        source: computed
        description: "Equal to period_start; all-in rent is due on the first day of the period."
      - name: occupied_rooms_at_period_start
        type: integer
        source: computed
        description: "Audit copy of the utility-share denominator sampled at period_start, see calculations.invoice_charge_assembly STEP 2."
      - name: base_rent_cents
        type: integer
        source: computed
        description: "Membership.base_period_rate_cents at generation time."
      - name: utility_share_cents
        type: integer
        source: computed
        description: "This tenancy's slice of House.monthly_utility_budget_cents for the period."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "base_rent_cents + utility_share_cents. This is the ONLY value the late-fee tier is keyed on; it never includes proration or fees."
      - name: proration_adjustment_cents
        type: integer
        source: computed
        description: "Signed move-out adjustment; negative when the resident leaves mid-period."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Tiered late fee, 0 until assessed and back to 0 after a waive."
        default: 0
      - name: total_amount_cents
        type: integer
        source: computed
        description: "subtotal_cents + proration_adjustment_cents + late_fee_cents."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents rows whose invoice_id equals this Invoice.id."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle axis driven by state_machines.Invoice."
        default: OPEN
        constraints: "one of OPEN, PARTIAL, PAST_DUE, PAID"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this cash application lands on."
      - name: amount_cents
        type: integer
        source: input
        description: "Cash applied, in cents."
        constraints: "> 0"
      - name: method
        type: enum
        source: input
        description: "How the money arrived."
        constraints: "one of CARD, ACH, CASH"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant the payment was applied (ISO 8601 UTC, three fractional digits)."
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Member or FinanceAdmin that recorded the payment."

  - name: HouseRuleIncident
    parent: null
    common_fields: true
    fields:
      - name: house_id
        type: string
        source: computed
        description: "FK -> House.id; copied from the membership's house at creation."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the tenancy the alleged violation is charged to."
      - name: rule_code
        type: enum
        source: input
        description: "Which house rule was allegedly broken."
        constraints: "one of QUIET_HOURS, GUEST_POLICY, CLEANLINESS, SMOKING, UNAUTHORIZED_OCCUPANT"
      - name: severity
        type: enum
        source: input
        description: "Severity band selected by the reporter."
        constraints: "one of MINOR, MAJOR, SEVERE"
      - name: severity_points
        type: integer
        source: computed
        description: "MINOR -> 1, MAJOR -> 3, SEVERE -> 6; counted into Member.strike_points only while status == UPHELD."
      - name: occurred_at
        type: datetime
        source: input
        description: "When the violation happened (ISO 8601 UTC); drives the 90-day strike window."
      - name: description
        type: string
        source: input
        description: "Narrative of the incident."
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Incident lifecycle axis driven by state_machines.HouseRuleIncident (cyclic through DISPUTED)."
        default: REPORTED
        constraints: "one of REPORTED, UPHELD, DISMISSED, DISPUTED"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter; the segregation-of-duties comparison key."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that last adjudicated; must never equal reported_by_user_id."
        default: null
      - name: dispute_round
        type: integer
        source: system
        description: "Number of times the member has disputed an UPHELD outcome on this incident."
        default: 0
      - name: dispute_reason
        type: string
        source: input
        description: "Member's most recent dispute narrative."
        default: null

  - name: MaintenanceTicket
    parent: null
    common_fields: true
    fields:
      - name: house_id
        type: string
        source: input
        description: "FK -> House.id; the property the work order is against."
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; set only for in-room work, null for shared-space work. When set, the room must belong to house_id."
        default: null
      - name: affected_membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the tenancy entitled to a rent credit if the SLA is breached. Null means no credit is ever issued for this ticket."
        default: null
      - name: area
        type: enum
        source: input
        description: "Which part of the house is impacted; drives the area weight of the rent credit."
        constraints: "one of ROOM, SHARED_KITCHEN, SHARED_BATH, LAUNDRY, COMMON_AREA"
      - name: severity
        type: enum
        source: input
        description: "Severity band; selects the SLA window."
        constraints: "one of CRITICAL, HIGH, NORMAL"
      - name: description
        type: string
        source: input
        description: "What is broken."
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Ticket lifecycle axis driven by state_machines.MaintenanceTicket."
        default: OPEN
        constraints: "one of OPEN, SCHEDULED, RESOLVED"
      - name: sla_deadline_at
        type: datetime
        source: computed
        description: "created_at + SLA_HOURS_BY_SEVERITY[severity]."
      - name: visit_start
        type: datetime
        source: input
        description: "Inclusive start of the technician visit window on the house calendar."
        default: null
      - name: visit_end
        type: datetime
        source: input
        description: "Exclusive end of the technician visit window; the house calendar uses half-open [visit_start, visit_end) intervals."
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant the ticket was resolved."
        default: null
      - name: breach_hours
        type: integer
        source: computed
        description: "max(0, whole hours between created_at and resolved_at minus SLA_HOURS_BY_SEVERITY[severity]); 0 until resolved."
        default: 0
      - name: rent_credit_cents
        type: integer
        source: computed
        description: "Credit owed to affected_membership_id, see calculations.maintenance_rent_credit; deducted from the house Payout."
        default: 0
      - name: resolution_note
        type: string
        source: input
        description: "What the technician did."
        default: null

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: house_id
        type: string
        source: input
        description: "FK -> House.id; the property whose collections are being remitted."
      - name: cycle_start
        type: datetime
        source: input
        description: "First day of the payout cycle (YYYY-MM-DD), inclusive."
      - name: cycle_end
        type: datetime
        source: input
        description: "Last day of the payout cycle (YYYY-MM-DD), inclusive."
      - name: status
        type: enum
        source: system
        description: "Payout lifecycle axis driven by state_machines.Payout."
        default: DRAFT
        constraints: "one of DRAFT, PROJECTED, RELEASED"
      - name: variant_applied
        type: enum
        source: computed
        description: "Which variant of calculations.payout_net_settlement produced the current numbers."
        default: NONE
        constraints: "one of NONE, ACCRUAL_PROJECTION, CASH_FINAL"
      - name: gross_cents
        type: integer
        source: computed
        description: "Cycle gross, accrual-basis under ACCRUAL_PROJECTION and cash-basis under CASH_FINAL."
        default: 0
      - name: platform_fee_cents
        type: integer
        source: computed
        description: "Platform take, rounded PER INVOICE then summed (never summed then rounded)."
        default: 0
      - name: maintenance_credit_cents
        type: integer
        source: computed
        description: "Sum of MaintenanceTicket.rent_credit_cents resolved inside the cycle for this house."
        default: 0
      - name: reserve_cents
        type: integer
        source: computed
        description: "Withheld reserve; non-zero only under ACCRUAL_PROJECTION."
        default: 0
      - name: net_payout_cents
        type: integer
        source: computed
        description: "Amount remitted to Host.payout_account_ref; floored at 0."
        default: 0
      - name: projected_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceAdmin that produced the projection; the segregation-of-duties comparison key for release."
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceAdmin that released the payout; must never equal projected_by_user_id."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the payout was released."
        default: null

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: Application
    state_field: status
    shape: branching_with_revision_cycle
    initial_state: SUBMITTED
    terminal_states: [DENIED, CONVERTED]
    transitions:
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /co-living/applications/{id}/screening-reports"
        actor: ComplianceOfficer
        preconditions:
          - "application.status == SUBMITTED"
          - "application.screening_round < MAX_APPLICATION_ROUNDS"
        side_effects:
          - "creates a ScreeningReport with sequence_number = application.screening_round + 1"
          - "recomputes Application.screening_round"
          - "recomputes Application.monthly_equivalent_cents and Application.required_income_cents per calculations.application_income_qualification"
        note: "Screening is the only path out of SUBMITTED."

      - from: SCREENED
        to: APPROVED
        trigger: "POST /co-living/applications/{id}/decision with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "application.status == SCREENED (which by construction implies at least one ScreeningReport exists)"
          - "latest ScreeningReport.background_result == CLEAR"
          - "qualifying_income_cents >= application.required_income_cents"
          - "Room.occupancy_state == VACANT for application.room_id (cross-entity gate)"
        side_effects:
          - "sets Application.required_deposit_cents per calculations.application_deposit_requirement (APPROVED branch)"
          - "records Application.decision_note"

      - from: SCREENED
        to: CONDITIONAL
        trigger: "POST /co-living/applications/{id}/decision with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "application.status == SCREENED"
          - "Room.occupancy_state == VACANT for application.room_id (cross-entity gate)"
          - "latest ScreeningReport.background_result == FLAGGED, OR (qualifying_income_cents < application.required_income_cents AND application.cosigner_monthly_income_cents IS NULL)"
        side_effects:
          - "sets Application.required_deposit_cents per calculations.application_deposit_requirement (CONDITIONAL branch, double deposit)"
        note: "Divergent branch of the same trigger; the fork is decided by the latest ScreeningReport, not by operator input."

      - from: SCREENED
        to: DENIED
        trigger: "POST /co-living/applications/{id}/decision with decision=DENY"
        actor: ComplianceOfficer
        preconditions:
          - "application.status == SCREENED"
        side_effects:
          - "sets Application.required_deposit_cents = 0"
          - "records Application.decision_note"

      - from: CONDITIONAL
        to: SUBMITTED
        trigger: "POST /co-living/applications/{id}/resubmit"
        actor: Member
        preconditions:
          - "application.status == CONDITIONAL"
          - "application.screening_round < MAX_APPLICATION_ROUNDS"
        side_effects:
          - "stores Application.cosigner_monthly_income_cents when supplied"
          - "resets Application.required_deposit_cents to 0"
        note: "Revision cycle: CONDITIONAL -> SUBMITTED -> SCREENED -> CONDITIONAL is a legal loop, bounded by MAX_APPLICATION_ROUNDS."

      - from: APPROVED
        to: CONVERTED
        trigger: "POST /co-living/memberships"
        actor: CommunityManager
        preconditions:
          - "application.status == APPROVED"
          - "Room.occupancy_state == VACANT for application.room_id"
        side_effects:
          - "creates a Membership in tenancy_status PENDING_MOVE_IN / billing_status CURRENT"
          - "Room.occupancy_state VACANT -> RESERVED"
          - "recomputes House room-state counts and House.compliance_posture"

      - from: CONDITIONAL
        to: CONVERTED
        trigger: "POST /co-living/memberships"
        actor: CommunityManager
        preconditions:
          - "application.status == CONDITIONAL"
          - "Room.occupancy_state == VACANT for application.room_id"
        side_effects:
          - "creates a Membership carrying the doubled Application.required_deposit_cents"
          - "Room.occupancy_state VACANT -> RESERVED"
          - "recomputes House room-state counts and House.compliance_posture"
        note: "A CONDITIONAL application is convertible; it simply carries CONDITIONAL_DEPOSIT_MULTIPLE."

  - entity: Membership
    state_field: tenancy_status
    shape: cyclic
    initial_state: PENDING_MOVE_IN
    terminal_states: [MOVED_OUT, CANCELLED]
    transitions:
      - from: PENDING_MOVE_IN
        to: ACTIVE
        trigger: "POST /co-living/memberships/{id}/move-in"
        actor: CommunityManager
        preconditions:
          - "membership.tenancy_status == PENDING_MOVE_IN"
          - "clock_date >= membership.move_in_date"
          - "House.compliance_posture == OPEN for membership.house_id (cross-entity gate)"
        side_effects:
          - "Room.occupancy_state RESERVED -> OCCUPIED"
          - "recomputes House.reserved_room_count, House.occupied_room_count and House.compliance_posture"

      - from: PENDING_MOVE_IN
        to: CANCELLED
        trigger: "POST /co-living/memberships/{id}/cancel"
        actor: CommunityManager | Member
        preconditions:
          - "membership.tenancy_status == PENDING_MOVE_IN"
        side_effects:
          - "Room.occupancy_state RESERVED -> VACANT"
          - "Room.available_from_date -> null"
          - "recomputes House room-state counts so House.occupied_room_count returns to its pre-creation value and the room-count partition invariant holds"

      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "POST /co-living/memberships/{id}/notice"
        actor: Member | CommunityManager
        preconditions:
          - "membership.tenancy_status == ACTIVE"
          - "when reason == MEMBER_INITIATED: scheduled_move_out_date >= clock_date + MIN_NOTICE_DAYS"
          - "when reason == NONPAYMENT: membership.billing_status == PAST_DUE"
        side_effects:
          - "sets Membership.notice_reason and Membership.scheduled_move_out_date (clock_date + NONPAYMENT_NOTICE_DAYS when reason == NONPAYMENT, the supplied date when MEMBER_INITIATED)"
          - "writes Membership.provisional_final_charge_cents per calculations.move_out_proration variant provisional_notice_block"
          - "Room.occupancy_state OCCUPIED -> NOTICE_PENDING and Room.available_from_date = scheduled_move_out_date + TURNOVER_BUFFER_DAYS"
          - "recomputes House.notice_pending_room_count / House.occupied_room_count, then House.compliance_posture"

      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "system cascade from state_machines.HouseRuleIncident REPORTED_to_UPHELD when Member.strike_points >= STRIKE_SUSPENSION_THRESHOLD"
        actor: system
        preconditions:
          - "membership.tenancy_status == ACTIVE"
          - "the incident's member reached strike_points >= STRIKE_SUSPENSION_THRESHOLD on this uphold"
        side_effects:
          - "sets Membership.notice_reason = COMPLIANCE and Membership.scheduled_move_out_date = clock_date + COMPLIANCE_NOTICE_DAYS"
          - "writes Membership.provisional_final_charge_cents per calculations.move_out_proration variant provisional_notice_block"
          - "Room.occupancy_state OCCUPIED -> NOTICE_PENDING (cascade hop 3)"
          - "recomputes House room-state counts, then House.compliance_posture (cascade hop 4)"
        note: "Hop 2 of the depth-4 uphold cascade; caused by the strike-point bump on Member, not directly by the adjudicate call."

      - from: NOTICE_GIVEN
        to: ACTIVE
        trigger: "system cascade from state_machines.Membership PAST_DUE_to_CURRENT when notice_reason == NONPAYMENT"
        actor: system
        preconditions:
          - "membership.tenancy_status == NOTICE_GIVEN"
          - "membership.notice_reason == NONPAYMENT"
          - "membership.billing_status just became CURRENT"
        side_effects:
          - "clears Membership.notice_reason and Membership.scheduled_move_out_date to null"
          - "clears Membership.provisional_final_charge_cents to null"
          - "Room.occupancy_state NOTICE_PENDING -> OCCUPIED and Room.available_from_date -> null"
          - "recomputes House room-state counts, then House.compliance_posture"
        note: "The cycle back-edge: ACTIVE -> NOTICE_GIVEN -> ACTIVE. Only NONPAYMENT notices auto-rescind; MEMBER_INITIATED and COMPLIANCE notices do not."

      - from: NOTICE_GIVEN
        to: MOVED_OUT
        trigger: "POST /co-living/memberships/{id}/move-out"
        actor: CommunityManager
        preconditions:
          - "membership.tenancy_status == NOTICE_GIVEN"
          - "actual_move_out_date >= membership.move_in_date"
          - "actual_move_out_date <= clock_date"
        side_effects:
          - "sets Membership.actual_move_out_date and Membership.effective_end_date"
          - "writes Membership.final_charge_cents per calculations.move_out_proration variant final_settlement_daily"
          - "applies the signed delta to the matching open Invoice (Invoice.proration_adjustment_cents, then Invoice.total_amount_cents)"
          - "recomputes Membership.balance_due_cents"
          - "Room.occupancy_state NOTICE_PENDING -> VACANT and Room.available_from_date -> null"
          - "recomputes House room-state counts, then House.compliance_posture"

  - entity: Membership
    state_field: billing_status
    shape: cyclic
    initial_state: CURRENT
    terminal_states: [SETTLED]
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /co-living/invoices/{id}/fee-adjustment with action=ASSESS"
        actor: FinanceAdmin
        preconditions:
          - "clock_date > invoice.due_date + GRACE_DAYS"
          - "invoice.status IN {OPEN, PARTIAL}"
          - "invoice.late_fee_cents == 0"
        side_effects:
          - "Invoice.late_fee_cents = tier(Invoice.subtotal_cents) per calculations.invoice_charge_assembly STEP 4"
          - "Invoice.total_amount_cents increases by the fee; Invoice.status -> PAST_DUE"
          - "recomputes Membership.balance_due_cents"
        note: "This axis moves independently of tenancy_status; a PAST_DUE membership can be ACTIVE, NOTICE_GIVEN or MOVED_OUT."

      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /co-living/invoices/{id}/payments"
        actor: Member | FinanceAdmin
        preconditions:
          - "membership.billing_status == PAST_DUE"
          - "Membership.balance_due_cents reaches 0 after the payment is applied"
        side_effects:
          - "cascade hop 3: if tenancy_status == NOTICE_GIVEN and notice_reason == NONPAYMENT, auto-rescind the notice (see Membership tenancy NOTICE_GIVEN_to_ACTIVE)"
          - "recomputes Member.strike_points and Member.standing_band"

      - from: CURRENT
        to: SETTLED
        trigger: "POST /co-living/memberships/{id}/move-out"
        actor: CommunityManager
        preconditions:
          - "the move-out transition succeeded"
          - "Membership.balance_due_cents == 0 after the proration delta is applied"
        side_effects:
          - "freezes the billing axis; no further invoice may be generated for this membership"

      - from: PAST_DUE
        to: SETTLED
        trigger: "POST /co-living/invoices/{id}/payments"
        actor: Member | FinanceAdmin
        preconditions:
          - "membership.tenancy_status == MOVED_OUT"
          - "Membership.balance_due_cents reaches 0 after the payment is applied"
        side_effects:
          - "freezes the billing axis"
          - "recomputes Member.strike_points and Member.standing_band"

  - entity: Room
    state_field: occupancy_state
    shape: cyclic
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: RESERVED
        trigger: "POST /co-living/memberships"
        actor: CommunityManager
        preconditions:
          - "room.occupancy_state == VACANT"
          - "no prior Membership on this room has effective_end_date within TURNOVER_BUFFER_DAYS of the new move_in_date"
        side_effects:
          - "recomputes House.vacant_room_count and House.reserved_room_count"

      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /co-living/memberships/{id}/move-in"
        actor: CommunityManager
        preconditions:
          - "the membership's move-in transition succeeded"
        side_effects:
          - "recomputes House.reserved_room_count and House.occupied_room_count"

      - from: RESERVED
        to: VACANT
        trigger: "POST /co-living/memberships/{id}/cancel"
        actor: CommunityManager | Member
        preconditions:
          - "the membership's cancel transition succeeded"
        side_effects:
          - "recomputes House.reserved_room_count and House.vacant_room_count"

      - from: OCCUPIED
        to: NOTICE_PENDING
        trigger: "POST /co-living/memberships/{id}/notice, or the COMPLIANCE cascade"
        actor: Member | CommunityManager | system
        preconditions:
          - "the membership's notice transition succeeded"
        side_effects:
          - "sets Room.available_from_date = scheduled_move_out_date + TURNOVER_BUFFER_DAYS"
          - "recomputes House.occupied_room_count and House.notice_pending_room_count"

      - from: NOTICE_PENDING
        to: OCCUPIED
        trigger: "system cascade from the NONPAYMENT auto-rescind"
        actor: system
        preconditions:
          - "the membership auto-rescind transition succeeded"
        side_effects:
          - "clears Room.available_from_date"
          - "recomputes House.notice_pending_room_count and House.occupied_room_count"

      - from: NOTICE_PENDING
        to: VACANT
        trigger: "POST /co-living/memberships/{id}/move-out"
        actor: CommunityManager
        preconditions:
          - "the membership's move-out transition succeeded"
        side_effects:
          - "clears Room.available_from_date"
          - "recomputes House.notice_pending_room_count and House.vacant_room_count"

      - from: VACANT
        to: OUT_OF_SERVICE
        trigger: "POST /co-living/tickets with severity=CRITICAL and area=ROOM"
        actor: Member | CommunityManager
        preconditions:
          - "room.occupancy_state == VACANT"
          - "ticket.room_id is set and ticket.severity == CRITICAL and ticket.area == ROOM"
        side_effects:
          - "recomputes House.vacant_room_count and House.out_of_service_room_count"
        note: "Conditional cascade: an OCCUPIED or NOTICE_PENDING room is NOT taken out of service, it keeps its tenancy state."

      - from: OUT_OF_SERVICE
        to: VACANT
        trigger: "POST /co-living/tickets/{id}/resolve"
        actor: CommunityManager
        preconditions:
          - "the ticket that took the room out of service is being resolved"
        side_effects:
          - "recomputes House.out_of_service_room_count and House.vacant_room_count"

  - entity: Invoice
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: PARTIAL
        trigger: "POST /co-living/invoices/{id}/payments"
        actor: Member | FinanceAdmin
        preconditions:
          - "invoice.status == OPEN"
          - "0 < amount_cents < invoice.total_amount_cents - invoice.amount_paid_cents"
        side_effects:
          - "increases Invoice.amount_paid_cents; recomputes Membership.balance_due_cents"
      - from: OPEN
        to: PAID
        trigger: "POST /co-living/invoices/{id}/payments"
        actor: Member | FinanceAdmin
        preconditions:
          - "invoice.status == OPEN"
          - "amount_cents == invoice.total_amount_cents - invoice.amount_paid_cents"
        side_effects:
          - "increases Invoice.amount_paid_cents; recomputes Membership.balance_due_cents"
      - from: PARTIAL
        to: PAID
        trigger: "POST /co-living/invoices/{id}/payments"
        actor: Member | FinanceAdmin
        preconditions:
          - "invoice.status == PARTIAL"
          - "amount_cents == invoice.total_amount_cents - invoice.amount_paid_cents"
        side_effects:
          - "increases Invoice.amount_paid_cents; recomputes Membership.balance_due_cents"
      - from: OPEN
        to: PAST_DUE
        trigger: "POST /co-living/invoices/{id}/fee-adjustment with action=ASSESS"
        actor: FinanceAdmin
        preconditions:
          - "clock_date > invoice.due_date + GRACE_DAYS"
          - "invoice.late_fee_cents == 0"
        side_effects:
          - "sets Invoice.late_fee_cents and raises Invoice.total_amount_cents"
          - "drives Membership.billing_status CURRENT -> PAST_DUE"
      - from: PARTIAL
        to: PAST_DUE
        trigger: "POST /co-living/invoices/{id}/fee-adjustment with action=ASSESS"
        actor: FinanceAdmin
        preconditions:
          - "clock_date > invoice.due_date + GRACE_DAYS"
          - "invoice.late_fee_cents == 0"
        side_effects:
          - "sets Invoice.late_fee_cents and raises Invoice.total_amount_cents"
          - "drives Membership.billing_status CURRENT -> PAST_DUE"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /co-living/invoices/{id}/payments"
        actor: Member | FinanceAdmin
        preconditions:
          - "invoice.status == PAST_DUE"
          - "amount_cents == invoice.total_amount_cents - invoice.amount_paid_cents"
        side_effects:
          - "increases Invoice.amount_paid_cents; recomputes Membership.balance_due_cents; may drive Membership.billing_status PAST_DUE -> CURRENT"
      - from: PAST_DUE
        to: PAST_DUE
        trigger: "POST /co-living/invoices/{id}/fee-adjustment with action=WAIVE"
        actor: FinanceAdmin
        preconditions:
          - "invoice.late_fee_cents > 0"
        side_effects:
          - "Invoice.total_amount_cents decreases by exactly Invoice.late_fee_cents; Invoice.late_fee_cents -> 0"
          - "recomputes Membership.balance_due_cents back to its pre-assessment value (compensating-action invariant)"
        note: "Status deliberately stays PAST_DUE; only a full payment clears it."

  - entity: HouseRuleIncident
    state_field: status
    shape: cyclic
    initial_state: REPORTED
    terminal_states: [DISMISSED]
    transitions:
      - from: REPORTED
        to: UPHELD
        trigger: "POST /co-living/incidents/{id}/adjudicate with outcome=UPHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status IN {REPORTED, DISPUTED}"
          - "X-User-ID != incident.reported_by_user_id (segregation of duties)"
        side_effects:
          - "cascade hop 1: recomputes Member.strike_points and Member.standing_band per calculations.member_strike_standing"
          - "cascade hop 2: when strike_points >= STRIKE_SUSPENSION_THRESHOLD, drives Membership ACTIVE -> NOTICE_GIVEN with notice_reason=COMPLIANCE"
          - "cascade hop 3: that notice drives Room OCCUPIED -> NOTICE_PENDING"
          - "cascade hop 4: the room-state change recomputes House room counts and then House.compliance_posture"

      - from: REPORTED
        to: DISMISSED
        trigger: "POST /co-living/incidents/{id}/adjudicate with outcome=DISMISS"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status IN {REPORTED, DISPUTED}"
          - "X-User-ID != incident.reported_by_user_id (segregation of duties)"
        side_effects:
          - "recomputes Member.strike_points (a DISMISSED incident contributes 0 points)"

      - from: UPHELD
        to: DISPUTED
        trigger: "POST /co-living/incidents/{id}/dispute"
        actor: Member
        preconditions:
          - "incident.status == UPHELD"
          - "incident.dispute_round < MAX_DISPUTE_ROUNDS"
          - "the acting Member owns incident.membership_id"
        side_effects:
          - "increments HouseRuleIncident.dispute_round by 1"
          - "recomputes Member.strike_points (a DISPUTED incident contributes 0 points while under re-review)"
          - "may relax Member.standing_band and, when the member drops back under STRIKE_SUSPENSION_THRESHOLD, leaves an existing COMPLIANCE notice in place (notice rescission is never automatic for COMPLIANCE)"

      - from: DISPUTED
        to: UPHELD
        trigger: "POST /co-living/incidents/{id}/adjudicate with outcome=UPHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == DISPUTED"
          - "X-User-ID != incident.reported_by_user_id (segregation of duties)"
        side_effects:
          - "recomputes Member.strike_points and Member.standing_band"
        note: "The cycle back-edge: UPHELD -> DISPUTED -> UPHELD, bounded by MAX_DISPUTE_ROUNDS."

      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /co-living/incidents/{id}/adjudicate with outcome=DISMISS"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == DISPUTED"
          - "X-User-ID != incident.reported_by_user_id (segregation of duties)"
        side_effects:
          - "recomputes Member.strike_points and Member.standing_band"

  - entity: MaintenanceTicket
    state_field: status
    shape: linear_with_direct_close
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /co-living/tickets/{id}/schedule"
        actor: CommunityManager
        preconditions:
          - "ticket.status == OPEN"
          - "visit_end > visit_start"
          - "expected_house_version == House.version"
          - "adding [visit_start, visit_end) keeps the count of overlapping SCHEDULED visits in this house at or below MAX_CONCURRENT_VISITS_PER_HOUSE"
        side_effects:
          - "stores MaintenanceTicket.visit_start and MaintenanceTicket.visit_end"
          - "increments House.version by 1"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /co-living/tickets/{id}/resolve"
        actor: CommunityManager
        preconditions:
          - "ticket.status IN {OPEN, SCHEDULED}"
        side_effects:
          - "sets MaintenanceTicket.resolved_at = clock instant and MaintenanceTicket.breach_hours"
          - "writes MaintenanceTicket.rent_credit_cents per calculations.maintenance_rent_credit"
          - "when the ticket had taken a room OUT_OF_SERVICE, drives Room OUT_OF_SERVICE -> VACANT and recomputes House counts and posture"

      - from: SCHEDULED
        to: RESOLVED
        trigger: "POST /co-living/tickets/{id}/resolve"
        actor: CommunityManager
        preconditions:
          - "ticket.status IN {OPEN, SCHEDULED}"
        side_effects:
          - "sets MaintenanceTicket.resolved_at, breach_hours and rent_credit_cents"
          - "frees the [visit_start, visit_end) slot on the house calendar"
          - "when the ticket had taken a room OUT_OF_SERVICE, drives Room OUT_OF_SERVICE -> VACANT and recomputes House counts and posture"

  - entity: Payout
    state_field: status
    shape: linear
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: PROJECTED
        trigger: "POST /co-living/payouts/{id}/project"
        actor: FinanceAdmin
        preconditions:
          - "payout.status == DRAFT"
        side_effects:
          - "writes gross_cents, platform_fee_cents, maintenance_credit_cents, reserve_cents and net_payout_cents per calculations.payout_net_settlement variant accrual_projection"
          - "sets Payout.variant_applied = ACCRUAL_PROJECTION and Payout.projected_by_user_id = X-User-ID"

      - from: PROJECTED
        to: RELEASED
        trigger: "POST /co-living/payouts/{id}/release"
        actor: FinanceAdmin
        preconditions:
          - "payout.status == PROJECTED"
          - "House.compliance_posture != FROZEN for payout.house_id (cross-entity gate)"
          - "X-User-ID != payout.projected_by_user_id (segregation of duties)"
        side_effects:
          - "rewrites the money fields per calculations.payout_net_settlement variant cash_final; reserve_cents drops to 0"
          - "sets Payout.variant_applied = CASH_FINAL, Payout.released_by_user_id and Payout.released_at"

  - entity: House
    state_field: compliance_posture
    shape: posture_driven
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system re-evaluation of calculations.house_compliance_posture on every read or gated write"
        actor: system
        preconditions:
          - "no CRITICAL MaintenanceTicket in {OPEN, SCHEDULED} is past its sla_deadline_at"
          - "notice_pending_room_count / total_room_count > TURNOVER_ALERT_RATIO, OR the house has >= RESTRICT_UPHELD_INCIDENT_COUNT UPHELD incidents whose occurred_at falls in the last INCIDENT_WINDOW_DAYS"
        side_effects:
          - "blocks POST /co-living/memberships/{id}/move-in with ERR_HOUSE_POSTURE_BLOCKED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system re-evaluation of calculations.house_compliance_posture"
        actor: system
        preconditions:
          - "neither the RESTRICTED nor the FROZEN condition holds any more"
        side_effects:
          - "re-enables move-ins"
      - from: OPEN
        to: FROZEN
        trigger: "system re-evaluation of calculations.house_compliance_posture"
        actor: system
        preconditions:
          - "at least one CRITICAL MaintenanceTicket in status {OPEN, SCHEDULED} has clock_instant > sla_deadline_at"
        side_effects:
          - "blocks POST /co-living/memberships/{id}/move-in with ERR_HOUSE_POSTURE_BLOCKED and POST /co-living/payouts/{id}/release with ERR_HOUSE_FROZEN"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system re-evaluation of calculations.house_compliance_posture"
        actor: system
        preconditions:
          - "at least one CRITICAL MaintenanceTicket in status {OPEN, SCHEDULED} has clock_instant > sla_deadline_at"
        side_effects:
          - "blocks move-ins and payout releases"
      - from: FROZEN
        to: OPEN
        trigger: "system re-evaluation of calculations.house_compliance_posture after the CRITICAL ticket is resolved"
        actor: system
        preconditions:
          - "no CRITICAL MaintenanceTicket in {OPEN, SCHEDULED} is past its sla_deadline_at"
          - "the RESTRICTED condition does not hold"
        side_effects:
          - "re-enables move-ins and payout releases"

# =====================================================================
# 1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: room-rate-revision-stale-room
    parent_entity: Room
    write_endpoint: "PUT /co-living/rooms/{id}"
    occ_field: "expected_room_version"
    description: |
      Revising a Room's all-in rate card against a Room whose version has
      advanced since the client last read it is rejected. A rate revision
      legitimately supersedes the previous card, so the second sequential
      write would otherwise succeed and silently overwrite an edit the
      client never saw; OCC on Room.version turns that into a deterministic
      stale-version rejection.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

  - rule_id: visit-schedule-stale-house
    parent_entity: House
    write_endpoint: "POST /co-living/tickets/{id}/schedule"
    occ_field: "expected_house_version"
    description: |
      Booking a technician visit window against a House whose version has
      advanced since the client last read the house calendar is rejected.
      Booking a second, different ticket into the same house is a legitimate
      operation under MAX_CONCURRENT_VISITS_PER_HOUSE, so the write cannot be
      rejected by any state precondition; OCC on House.version reduces it to
      a stale-version check.
    error_id: ERR_STALE_HOUSE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: application_income_qualification
    trigger: "runs on POST /co-living/applications/{id}/screening-reports (writes monthly_equivalent_cents and required_income_cents) and is re-evaluated as the gate on POST /co-living/applications/{id}/decision"
    algorithm: threshold
    formula: |
      # STEP 1 - normalize the all-in rent to a monthly figure
      if application.billing_cycle == MONTHLY:
          monthly_equivalent_cents = room.monthly_rate_cents
      else:  # WEEKLY
          monthly_equivalent_cents = round_half_up(room.weekly_rate_cents * WEEKS_PER_YEAR / MONTHS_PER_YEAR)

      # STEP 2 - the bar
      required_income_cents = round_half_up(monthly_equivalent_cents * INCOME_MULTIPLE)

      # STEP 3 - the applicant's side of the comparison
      latest = the ScreeningReport for this application with the greatest created_at;
               ties broken by the greatest sequence_number
      qualifying_income_cents = latest.verified_monthly_income_cents
                              + COALESCE(application.cosigner_monthly_income_cents, 0)

      # STEP 4 - inclusive comparison; equality qualifies
      income_ok = (qualifying_income_cents >= required_income_cents)
    input_set: "Exactly one ScreeningReport per application - the latest by created_at, tie-broken by the greatest sequence_number. Member.declared_monthly_income_cents is NEVER an input. Rooms are read at their current rate card."
    constants:
      INCOME_MULTIPLE: 3.0
      WEEKS_PER_YEAR: 52
      MONTHS_PER_YEAR: 12
      MAX_APPLICATION_ROUNDS: 2
    precision: "integer cents; round_half_up at STEP 1 and STEP 2 independently (never a single fused multiply)"

  - name: application_deposit_requirement
    trigger: "runs inside POST /co-living/applications/{id}/decision, after the APPROVED/CONDITIONAL/DENIED branch is chosen"
    algorithm: threshold
    formula: |
      if resulting_status == APPROVED:
          required_deposit_cents = round_half_up(room.weekly_rate_cents * DEPOSIT_MULTIPLE)
      elif resulting_status == CONDITIONAL:
          required_deposit_cents = round_half_up(room.weekly_rate_cents * CONDITIONAL_DEPOSIT_MULTIPLE)
      else:  # DENIED
          required_deposit_cents = 0
    input_set: "The room's CURRENT weekly_rate_cents at decision time, regardless of the application's billing_cycle."
    constants:
      DEPOSIT_MULTIPLE: 1.0
      CONDITIONAL_DEPOSIT_MULTIPLE: 2.0
    precision: "integer cents, round_half_up"

  - name: invoice_charge_assembly
    trigger: "runs on POST /co-living/invoices (STEP 1-3 and STEP 5) and on POST /co-living/invoices/{id}/fee-adjustment with action=ASSESS (STEP 4 and STEP 5)"
    algorithm: constraint_propagation
    formula: |
      # The evaluation order below is PINNED. The fee tier looks circular
      # (total needs the fee, the fee needs a tier keyed on an amount) - it is
      # resolved by keying the tier on subtotal_cents, which by construction
      # excludes proration and any fee.

      # STEP 1 - base rent
      base_rent_cents = membership.base_period_rate_cents

      # STEP 2 - shared-utility slice, denominator sampled at period_start
      occupied_rooms_at_period_start =
          count of DISTINCT Membership m2 such that
              m2.house_id == membership.house_id
            AND m2.tenancy_status IN {ACTIVE, NOTICE_GIVEN}
            AND m2.move_in_date <= invoice.period_start
            AND (m2.actual_move_out_date IS NULL
                 OR m2.actual_move_out_date >= invoice.period_start)
      denom = max(occupied_rooms_at_period_start, 1)
      monthly_share_cents = ceil(house.monthly_utility_budget_cents / denom)
      if membership.billing_cycle == MONTHLY:
          utility_share_cents = monthly_share_cents
      else:
          utility_share_cents = ceil(monthly_share_cents * 7 / 30)

      # STEP 3 - the ONLY tier key
      subtotal_cents = base_rent_cents + utility_share_cents

      # STEP 4 - late fee, keyed on subtotal_cents (NOT on total_amount_cents)
      if subtotal_cents < LATE_FEE_TIER1_CEILING_CENTS:        late_fee_cents = LATE_FEE_TIER1_CENTS
      elif subtotal_cents < LATE_FEE_TIER2_CEILING_CENTS:      late_fee_cents = LATE_FEE_TIER2_CENTS
      else:                                                    late_fee_cents = LATE_FEE_TIER3_CENTS

      # STEP 5 - assemble
      total_amount_cents = subtotal_cents + proration_adjustment_cents + late_fee_cents
    input_set: "Memberships of the same house in tenancy_status ACTIVE or NOTICE_GIVEN whose closed occupancy interval covers period_start; PENDING_MOVE_IN, CANCELLED and MOVED_OUT tenancies are excluded from the denominator. The membership being invoiced counts itself."
    constants:
      LATE_FEE_TIER1_CEILING_CENTS: 20000
      LATE_FEE_TIER2_CEILING_CENTS: 40000
      LATE_FEE_TIER1_CENTS: 1500
      LATE_FEE_TIER2_CENTS: 2500
      LATE_FEE_TIER3_CENTS: 4000
      GRACE_DAYS: 3
    precision: "integer cents; ceil (never round) at both utility divisions, applied in the order monthly-first-then-weekly"

  - name: move_out_proration
    trigger: "the provisional_notice_block variant runs on POST /co-living/memberships/{id}/notice and on the COMPLIANCE cascade; the final_settlement_daily variant runs on POST /co-living/memberships/{id}/move-out"
    algorithm: forward_looking
    formula: |
      # Shared definitions
      target_period_start, target_period_end =
          the billing period of length membership.period_days that contains
          the move-out date under evaluation, anchored on membership.move_in_date
          (period k spans move_in_date + k*period_days ... + (k+1)*period_days - 1)
      period_subtotal_cents = base_rent_cents + utility_share_cents for that period,
                              computed by calculations.invoice_charge_assembly STEP 1-3

      # VARIANT A - provisional_notice_block (whole-period block accounting)
      provisional_final_charge_cents = period_subtotal_cents     # no daily refund at all

      # VARIANT B - final_settlement_daily (daily accounting)
      daily_rate_cents = round_half_up(period_subtotal_cents / membership.period_days)
      occupied_days    = (actual_move_out_date - target_period_start).days + 1   # inclusive of the move-out day
      final_charge_cents = daily_rate_cents * occupied_days
      proration_adjustment_cents = final_charge_cents - period_subtotal_cents    # negative = credit
    input_set: "Variant A reads scheduled_move_out_date and samples occupied_rooms_at_period_start AS OF THE NOTICE INSTANT. Variant B reads actual_move_out_date and reuses the stored Invoice.subtotal_cents of the matching invoice when one exists. The matching invoice is the Invoice of this membership with status IN {OPEN, PARTIAL, PAST_DUE} whose period_start <= actual_move_out_date <= period_end; when several match, the one with the greatest period_start; when none matches, only Membership.final_charge_cents is written and no invoice is touched."
    constants:
      MIN_NOTICE_DAYS: 14
      NONPAYMENT_NOTICE_DAYS: 7
      COMPLIANCE_NOTICE_DAYS: 14
      TURNOVER_BUFFER_DAYS: 2
    precision: "integer cents; round_half_up once on the daily rate, then an exact integer multiply by occupied_days (never round the product)"
    variants:
      - name: provisional_notice_block
        when: "at notice time, written into Membership.provisional_final_charge_cents"
        difference: "Charges the ENTIRE period containing the move-out date with no daily refund; the resident is quoted a full period."
      - name: final_settlement_daily
        when: "at move-out time, written into Membership.final_charge_cents and pushed into the matching invoice"
        difference: "Charges round_half_up(period_subtotal / period_days) x occupied_days, so an identical move-out date yields a strictly smaller number than variant A whenever occupied_days < period_days."

  - name: payout_net_settlement
    trigger: "the accrual_projection variant runs on POST /co-living/payouts/{id}/project; the cash_final variant runs on POST /co-living/payouts/{id}/release"
    algorithm: waterfall_allocation
    formula: |
      cycle_invoices = every Invoice i such that
            the Membership of i has house_id == payout.house_id
        AND payout.cycle_start <= i.period_start <= payout.cycle_end     # keyed on period_start, both ends inclusive
      cycle_tickets  = every MaintenanceTicket t such that
            t.house_id == payout.house_id
        AND t.status == RESOLVED
        AND payout.cycle_start <= date(t.resolved_at) <= payout.cycle_end

      maintenance_credit_cents = sum over cycle_tickets of t.rent_credit_cents

      # VARIANT A - accrual_projection (POST .../project)
      gross_cents        = sum over cycle_invoices of i.total_amount_cents        # billed, not collected
      platform_fee_cents = sum over cycle_invoices of round_half_up(i.total_amount_cents * PLATFORM_FEE_RATE)
      reserve_cents      = round_half_up(gross_cents * PAYOUT_RESERVE_RATE)
      net_payout_cents   = max(gross_cents - platform_fee_cents - maintenance_credit_cents - reserve_cents, 0)

      # VARIANT B - cash_final (POST .../release)
      gross_cents        = sum over cycle_invoices of i.amount_paid_cents         # collected only
      platform_fee_cents = sum over cycle_invoices of round_half_up(i.amount_paid_cents * PLATFORM_FEE_RATE)
      reserve_cents      = 0
      net_payout_cents   = max(gross_cents - platform_fee_cents - maintenance_credit_cents, 0)

      # ROUNDING ORDER IS PINNED: round the platform fee PER INVOICE, then sum.
      # Summing the invoice amounts first and rounding once produces a different
      # cents value and is wrong.
    input_set: "Invoices are selected by period_start inside the closed cycle window, in every status (OPEN, PARTIAL, PAST_DUE, PAID); the two variants differ only in which money column of those same invoices they read. Tickets are selected by RESOLVED status and resolved_at date inside the same closed window. An empty cycle_invoices set is legal and yields gross_cents = 0 and net_payout_cents = 0."
    constants:
      PLATFORM_FEE_RATE: 0.125
      PAYOUT_RESERVE_RATE: 0.05
    precision: "integer cents; round_half_up applied per invoice line before summation, and once on the reserve"
    variants:
      - name: accrual_projection
        when: "POST /co-living/payouts/{id}/project, status DRAFT -> PROJECTED"
        difference: "Reads Invoice.total_amount_cents (billed) and withholds PAYOUT_RESERVE_RATE of gross."
      - name: cash_final
        when: "POST /co-living/payouts/{id}/release, status PROJECTED -> RELEASED"
        difference: "Reads Invoice.amount_paid_cents (collected) and releases the reserve to zero, so the same invoice set produces a different net_payout_cents."

  - name: maintenance_rent_credit
    trigger: "runs on POST /co-living/tickets/{id}/resolve, writing MaintenanceTicket.breach_hours and MaintenanceTicket.rent_credit_cents"
    algorithm: weighted_scoring
    formula: |
      sla_hours     = SLA_HOURS_BY_SEVERITY[ticket.severity]
      elapsed_hours = floor((resolved_at - created_at) in whole hours)
      breach_hours  = max(0, elapsed_hours - sla_hours)

      if ticket.affected_membership_id IS NULL or breach_hours == 0:
          rent_credit_cents = 0
      else:
          area_weight       = AREA_WEIGHT[ticket.area]
          breach_days       = ceil(breach_hours / 24)
          daily_rate_cents  = round_half_up(membership.base_period_rate_cents / membership.period_days)
          raw_credit_cents  = round_half_up(daily_rate_cents * breach_days * area_weight)
          cap_cents         = round_half_up(membership.base_period_rate_cents * MAINTENANCE_CREDIT_CAP_RATE)
          rent_credit_cents = min(raw_credit_cents, cap_cents)
    input_set: "Only the ticket's own affected_membership_id; the membership's base_period_rate_cents and period_days pinned at membership creation are used, never the room's current rate card. A ticket with affected_membership_id = null always yields 0."
    constants:
      SLA_HOURS_BY_SEVERITY: { CRITICAL: 24, HIGH: 72, NORMAL: 168 }
      AREA_WEIGHT: { ROOM: 1.00, SHARED_KITCHEN: 0.50, SHARED_BATH: 0.50, LAUNDRY: 0.25, COMMON_AREA: 0.25 }
      MAINTENANCE_CREDIT_CAP_RATE: 0.25
      MAX_CONCURRENT_VISITS_PER_HOUSE: 2
    precision: "integer cents; round_half_up on the daily rate, again on the weighted product, and again on the cap - three independent roundings, in that order"

  - name: member_strike_standing
    trigger: "runs after every HouseRuleIncident adjudication or dispute, writing Member.strike_points and Member.standing_band"
    algorithm: aggregation
    formula: |
      strike_points = sum of i.severity_points over every HouseRuleIncident i such that
            i.membership_id belongs to a Membership whose member_id == member.id
        AND i.status == UPHELD
        AND i.occurred_at >= clock_instant - STRIKE_WINDOW_DAYS days
      # severity_points: MINOR -> 1, MAJOR -> 3, SEVERE -> 6

      if strike_points == 0:                              standing_band = GOOD
      elif strike_points < STRIKE_SUSPENSION_THRESHOLD:    standing_band = WATCH
      else:                                               standing_band = PROBATION
    input_set: "Only incidents whose status is exactly UPHELD count; REPORTED, DISPUTED and DISMISSED contribute 0. The window is half-open on the left: occurred_at strictly older than STRIKE_WINDOW_DAYS is excluded, occurred_at exactly at the boundary instant is included."
    constants:
      STRIKE_WINDOW_DAYS: 90
      STRIKE_SUSPENSION_THRESHOLD: 6
      SEVERITY_POINTS: { MINOR: 1, MAJOR: 3, SEVERE: 6 }
      MAX_DISPUTE_ROUNDS: 2
    precision: "integer points, no rounding"

  - name: house_compliance_posture
    trigger: "re-evaluated at the start of every request that reads a House (GET /co-living/houses, GET /co-living/houses/{id}) and of every request whose validation gates on posture (move-in, payout release)"
    algorithm: threshold
    formula: |
      frozen_condition = EXISTS MaintenanceTicket t with
            t.house_id == house.id
        AND t.severity == CRITICAL
        AND t.status IN {OPEN, SCHEDULED}
        AND clock_instant > t.sla_deadline_at

      turnover_ratio = house.notice_pending_room_count / house.total_room_count   # 0 when total_room_count == 0
      recent_upheld  = count of HouseRuleIncident i with
            i.house_id == house.id
        AND i.status == UPHELD
        AND i.occurred_at >= clock_instant - INCIDENT_WINDOW_DAYS days

      restricted_condition = (turnover_ratio > TURNOVER_ALERT_RATIO)
                             OR (recent_upheld >= RESTRICT_UPHELD_INCIDENT_COUNT)

      if   frozen_condition:      compliance_posture = FROZEN
      elif restricted_condition:  compliance_posture = RESTRICTED
      else:                       compliance_posture = OPEN
    input_set: "FROZEN dominates RESTRICTED dominates OPEN; the three conditions are evaluated in that fixed order. The turnover comparison is STRICTLY greater than TURNOVER_ALERT_RATIO, so a house with exactly half its rooms NOTICE_PENDING stays OPEN."
    constants:
      TURNOVER_ALERT_RATIO: 0.5
      INCIDENT_WINDOW_DAYS: 30
      RESTRICT_UPHELD_INCIDENT_COUNT: 3
    precision: "exact rational comparison on the ratio (compare notice_pending_room_count * 2 > total_room_count); no floating rounding"

  - name: house_room_state_counts
    trigger: "recomputed on every Room create and on every Room.occupancy_state transition"
    algorithm: aggregation
    formula: |
      total_room_count            = count of Rooms with house_id == house.id
      vacant_room_count           = count of those with occupancy_state == VACANT
      reserved_room_count         = count of those with occupancy_state == RESERVED
      occupied_room_count         = count of those with occupancy_state == OCCUPIED
      notice_pending_room_count   = count of those with occupancy_state == NOTICE_PENDING
      out_of_service_room_count   = count of those with occupancy_state == OUT_OF_SERVICE

      # PARTITION INVARIANT (must hold after every request, including cascades):
      total_room_count == vacant_room_count + reserved_room_count
                        + occupied_room_count + notice_pending_room_count
                        + out_of_service_room_count
    input_set: "Every Room row of the house, in every occupancy_state; there is no soft delete, so the five buckets always partition the total."
    constants: {}
    precision: "integer counts"

  - name: membership_balance_due
    trigger: "recomputed after every invoice create, fee adjustment, payment and move-out proration"
    algorithm: aggregation
    formula: |
      balance_due_cents = sum over Invoice i with i.membership_id == membership.id
                          and i.status IN {OPEN, PARTIAL, PAST_DUE}
                          of (i.total_amount_cents - i.amount_paid_cents)

      # COMPENSATING-ACTION INVARIANT: assessing a late fee and then waiving it
      # must leave balance_due_cents at exactly its pre-assessment value.
    input_set: "PAID invoices are excluded entirely. Invoices of other memberships never enter the sum."
    constants: {}
    precision: "integer cents"

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the six roles declared in section 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id embedded in the request path resolves to a stored row, validated left to right"
    error_id: ERR_HOUSE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_MEMBERSHIP_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_PAYOUT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 4
    category: auth
    check: "for entity_backed roles, X-User-ID matches the resource owner - Member must equal Application.member_id / Membership.member_id / the Membership behind the Invoice or Incident; Host must equal House.host_id for the house behind the room or payout"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /co-living/houses, POST /co-living/rooms, PUT /co-living/rooms/{id}, POST /co-living/applications, POST /co-living/applications/{id}/resubmit, POST /co-living/memberships/{id}/notice, POST /co-living/memberships/{id}/cancel, POST /co-living/invoices/{id}/payments, POST /co-living/incidents, POST /co-living/incidents/{id}/dispute, POST /co-living/tickets. Read endpoints are platform-wide and are NOT ownership-scoped."

  - priority: 5
    category: business_constraint
    check: "request body and query string conform: required fields present, enum members valid, integers non-negative where declared, dates are YYYY-MM-DD, datetimes are ISO 8601 UTC, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row"
    error_id: ERR_HOST_NOT_FOUND | ERR_HOUSE_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "POST /co-living/houses, POST /co-living/rooms, POST /co-living/applications, POST /co-living/memberships, POST /co-living/invoices, POST /co-living/incidents, POST /co-living/tickets, POST /co-living/payouts"

  - priority: 7
    category: business_referential
    check: "cross-entity linkage is coherent: MaintenanceTicket.room_id must belong to MaintenanceTicket.house_id, and MaintenanceTicket.affected_membership_id must be a Membership of that same house"
    error_id: ERR_ENTITY_MISMATCH
    http_status: 409
    applies_to: "POST /co-living/tickets"

  - priority: 8
    category: business_referential
    check: "uniqueness: Member.email is globally unique; Room.room_number is unique within its house_id"
    error_id: ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_ROOM_NUMBER
    http_status: 409
    applies_to: "POST /co-living/members, POST /co-living/rooms"

  - priority: 9
    category: business_referential
    check: "the member behind the application has no other Membership in tenancy_status PENDING_MOVE_IN, ACTIVE or NOTICE_GIVEN"
    error_id: ERR_MEMBER_ALREADY_HOUSED
    http_status: 409
    applies_to: "POST /co-living/memberships"

  - priority: 10
    category: state
    check: "the target resource is in a state the requested transition accepts, per section 1.2"
    error_id: ERR_APPLICATION_NOT_PENDING | ERR_INVALID_MEMBERSHIP_STATE | ERR_INVALID_INCIDENT_STATE | ERR_INVALID_TICKET_STATE | ERR_INVALID_PAYOUT_STATE | ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 11
    category: state
    check: "cross-entity state gate: the application's Room.occupancy_state == VACANT when a decision is rendered or a membership is created"
    error_id: ERR_ROOM_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /co-living/applications/{id}/decision, POST /co-living/memberships"

  - priority: 12
    category: state
    check: "cross-entity state gate: an invoice may only be generated while the membership's tenancy_status is ACTIVE or NOTICE_GIVEN; PENDING_MOVE_IN, CANCELLED and MOVED_OUT tenancies cannot be billed"
    error_id: ERR_INVALID_MEMBERSHIP_STATE
    http_status: 409
    applies_to: "POST /co-living/invoices"

  - priority: 13
    category: business_constraint
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_ROOM_VERSION | ERR_STALE_HOUSE_VERSION
    http_status: 412
    applies_to: "PUT /co-living/rooms/{id}, POST /co-living/tickets/{id}/schedule"

  - priority: 14
    category: business_safety
    check: "the latest ScreeningReport.background_result is not FAILED when approving"
    error_id: ERR_BACKGROUND_FAILED
    http_status: 409
    applies_to: "POST /co-living/applications/{id}/decision with decision=APPROVE"

  - priority: 15
    category: business_safety
    check: "House.compliance_posture == OPEN, freshly re-evaluated per calculations.house_compliance_posture"
    error_id: ERR_HOUSE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /co-living/memberships/{id}/move-in"

  - priority: 16
    category: business_safety
    check: "House.compliance_posture != FROZEN, freshly re-evaluated per calculations.house_compliance_posture"
    error_id: ERR_HOUSE_FROZEN
    http_status: 409
    applies_to: "POST /co-living/payouts/{id}/release"

  - priority: 17
    category: business_safety
    check: "segregation of duties: the adjudicating X-User-ID differs from HouseRuleIncident.reported_by_user_id; the releasing X-User-ID differs from Payout.projected_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /co-living/incidents/{id}/adjudicate, POST /co-living/payouts/{id}/release"

  - priority: 18
    category: business_temporal
    check: "date ranges are ordered: Invoice.period_end >= period_start, Payout.cycle_end >= cycle_start, MaintenanceTicket.visit_end > visit_start, actual_move_out_date >= Membership.move_in_date and actual_move_out_date <= clock_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /co-living/invoices, POST /co-living/payouts, POST /co-living/tickets/{id}/schedule, POST /co-living/memberships/{id}/move-out"

  - priority: 19
    category: business_temporal
    check: "Membership.move_in_date is not earlier than the current logical clock date"
    error_id: ERR_MOVE_IN_DATE_IN_PAST
    http_status: 409
    applies_to: "POST /co-living/memberships"

  - priority: 20
    category: business_temporal
    check: "a MEMBER_INITIATED notice pins scheduled_move_out_date >= clock_date + MIN_NOTICE_DAYS (14)"
    error_id: ERR_NOTICE_TOO_SHORT
    http_status: 409
    applies_to: "POST /co-living/memberships/{id}/notice"

  - priority: 21
    category: business_temporal
    check: "a NONPAYMENT notice requires Membership.billing_status == PAST_DUE"
    error_id: ERR_NOT_PAST_DUE
    http_status: 409
    applies_to: "POST /co-living/memberships/{id}/notice"

  - priority: 22
    category: business_temporal
    check: "period_end - period_start + 1 equals Membership.period_days (7 for WEEKLY, 30 for MONTHLY)"
    error_id: ERR_INVALID_PERIOD_LENGTH
    http_status: 422
    applies_to: "POST /co-living/invoices"

  - priority: 23
    category: business_temporal
    check: "the new invoice's closed [period_start, period_end] interval does not intersect any existing invoice of the same membership; adjacency (previous period_end + 1 day == new period_start) is allowed"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /co-living/invoices"

  - priority: 24
    category: business_temporal
    check: "the new payout's closed [cycle_start, cycle_end] interval does not intersect any existing Payout of the same house in status DRAFT, PROJECTED or RELEASED"
    error_id: ERR_PAYOUT_CYCLE_OVERLAP
    http_status: 409
    applies_to: "POST /co-living/payouts"

  - priority: 25
    category: business_temporal
    check: "a late fee may only be assessed once the grace window has expired: clock_date > Invoice.due_date + GRACE_DAYS (3)"
    error_id: ERR_LATE_FEE_NOT_DUE
    http_status: 409
    applies_to: "POST /co-living/invoices/{id}/fee-adjustment with action=ASSESS"

  - priority: 26
    category: business_constraint
    check: "room turnover: the new move_in_date must be STRICTLY LATER than (effective_end_date + TURNOVER_BUFFER_DAYS) of every prior Membership on that room whose tenancy_status is MOVED_OUT or NOTICE_GIVEN; the occupancy interval is closed on both ends"
    error_id: ERR_ROOM_TURNOVER_CONFLICT
    http_status: 409
    applies_to: "POST /co-living/memberships"

  - priority: 27
    category: business_constraint
    check: "house visit calendar: over the half-open interval [visit_start, visit_end), no instant may be covered by more than MAX_CONCURRENT_VISITS_PER_HOUSE (2) SCHEDULED tickets of the same house, counting the new one; touching windows (previous visit_end == new visit_start) do not overlap"
    error_id: ERR_VISIT_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /co-living/tickets/{id}/schedule"

  - priority: 28
    category: business_constraint
    check: "HouseRuleIncident.dispute_round < MAX_DISPUTE_ROUNDS (2)"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /co-living/incidents/{id}/dispute"

  - priority: 29
    category: business_constraint
    check: "Application.screening_round < MAX_APPLICATION_ROUNDS (2)"
    error_id: ERR_APPLICATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /co-living/applications/{id}/resubmit, POST /co-living/applications/{id}/screening-reports"

  - priority: 30
    category: business_constraint
    check: "fee adjustment is coherent with the invoice: ASSESS requires Invoice.late_fee_cents == 0; WAIVE requires Invoice.late_fee_cents > 0"
    error_id: ERR_LATE_FEE_ALREADY_ASSESSED | ERR_NO_LATE_FEE_TO_WAIVE
    http_status: 409
    applies_to: "POST /co-living/invoices/{id}/fee-adjustment"

  - priority: 31
    category: business_fiscal
    check: "qualifying_income_cents >= Application.required_income_cents when the cosigner round has already been consumed (Application.cosigner_monthly_income_cents IS NOT NULL)"
    error_id: ERR_INCOME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /co-living/applications/{id}/decision with decision=APPROVE"

  - priority: 32
    category: business_fiscal
    check: "amount_cents <= Invoice.total_amount_cents - Invoice.amount_paid_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /co-living/invoices/{id}/payments"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---- test-driving clock -------------------------------------------
  - method: POST
    path: "/co-living/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z; it MUST NOT fall back to real wall-clock time. Every created_at / applied_at / resolved_at / released_at stamp and every deadline comparison in the system reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["advances or rewinds the logical clock; no entity is mutated"]

  # ---- hosts ---------------------------------------------------------
  - method: POST
    path: "/co-living/hosts"
    description: "Registers a property owner that will receive payouts."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "payout_account_ref", "contact_email"]
    output: Host
    side_effects: []

  # ---- houses --------------------------------------------------------
  - method: POST
    path: "/co-living/houses"
    description: "Creates a co-living house under a host."
    roles: [Host, PlatformAdmin]
    code: 201
    input: ["host_id", "label", "address_line1", "city", "state_code", "monthly_utility_budget_cents"]
    output: House
    side_effects: ["initializes all room-state counts to 0 and compliance_posture to OPEN"]

  - method: GET
    path: "/co-living/houses/{id}"
    description: "Reads one house with freshly re-evaluated compliance_posture and room-state counts."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: House
    side_effects: ["re-evaluates calculations.house_compliance_posture before serializing"]

  - method: GET
    path: "/co-living/houses"
    description: "Lists houses, filterable by owning host and by posture."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["host_id?", "compliance_posture?", "limit?", "offset?"]
    output: House[]
    side_effects: ["re-evaluates calculations.house_compliance_posture for every row before filtering"]

  # ---- rooms ---------------------------------------------------------
  - method: POST
    path: "/co-living/rooms"
    description: "Adds a rentable by-the-room unit to a house."
    roles: [Host, PlatformAdmin]
    code: 201
    input: ["house_id", "room_number", "weekly_rate_cents", "monthly_rate_cents", "private_bath?"]
    output: Room
    side_effects: ["room starts VACANT", "recomputes House.total_room_count and House.vacant_room_count"]

  - method: PUT
    path: "/co-living/rooms/{id}"
    description: "Revises a room's all-in rate card or amenity flags. Optimistically concurrent on Room.version."
    roles: [Host, PlatformAdmin]
    code: 200
    input: ["expected_room_version", "weekly_rate_cents?", "monthly_rate_cents?", "private_bath?"]
    output: Room
    side_effects: ["increments Room.version by 1", "does NOT retro-change Membership.base_period_rate_cents of existing tenancies"]

  - method: GET
    path: "/co-living/rooms/{id}"
    description: "Reads one room."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/co-living/rooms"
    description: "Lists rooms, filterable by house and occupancy state."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["house_id?", "occupancy_state?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  # ---- members -------------------------------------------------------
  - method: POST
    path: "/co-living/members"
    description: "Onboards a prospective resident."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "email", "declared_monthly_income_cents"]
    output: Member
    side_effects: ["strike_points starts at 0 and standing_band at GOOD"]

  - method: GET
    path: "/co-living/members/{id}"
    description: "Reads one member with freshly recomputed strike_points and standing_band."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["re-evaluates calculations.member_strike_standing before serializing"]

  # ---- applications --------------------------------------------------
  - method: POST
    path: "/co-living/applications"
    description: "Submits an application for a specific room at a chosen billing cycle."
    roles: [Member, CommunityManager]
    code: 201
    input: ["member_id", "room_id", "requested_move_in_date", "billing_cycle"]
    output: Application
    side_effects: ["application starts in SUBMITTED with screening_round 0 and required_deposit_cents 0"]

  - method: GET
    path: "/co-living/applications/{id}"
    description: "Reads one application."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/co-living/applications"
    description: "Lists applications, filterable by applicant, room and status."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["member_id?", "room_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/co-living/applications/{id}/screening-reports"
    description: "Files a background/income screening round against an application, moving it SUBMITTED -> SCREENED."
    roles: [ComplianceOfficer]
    code: 201
    input: ["background_result", "verified_monthly_income_cents", "report_reference"]
    output: ScreeningReport
    side_effects: ["Application.status SUBMITTED -> SCREENED", "increments Application.screening_round", "writes Application.monthly_equivalent_cents and Application.required_income_cents"]

  - method: GET
    path: "/co-living/applications/{id}/screening-reports"
    description: "Lists every screening round filed against the application, oldest first by created_at then sequence_number."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ScreeningReport[]
    side_effects: []

  - method: POST
    path: "/co-living/applications/{id}/decision"
    description: "Renders the compliance decision. decision=DENY always yields DENIED; decision=APPROVE forks into APPROVED or CONDITIONAL based on the latest screening report and the income multiple."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "decision_note?"]
    output: Application
    side_effects: ["writes Application.required_deposit_cents per calculations.application_deposit_requirement"]

  - method: POST
    path: "/co-living/applications/{id}/resubmit"
    description: "Sends a CONDITIONAL application back to SUBMITTED for another screening round, optionally adding cosigner income."
    roles: [Member]
    code: 200
    input: ["cosigner_monthly_income_cents?"]
    output: Application
    side_effects: ["Application.status CONDITIONAL -> SUBMITTED", "resets Application.required_deposit_cents to 0"]

  # ---- memberships ---------------------------------------------------
  - method: POST
    path: "/co-living/memberships"
    description: "Converts an APPROVED or CONDITIONAL application into a tenancy and reserves the room."
    roles: [CommunityManager]
    code: 201
    input: ["application_id", "move_in_date"]
    output: Membership
    side_effects: ["Application.status -> CONVERTED", "Room.occupancy_state VACANT -> RESERVED", "pins period_days, base_period_rate_cents and deposit_cents", "recomputes House room-state counts and compliance_posture"]

  - method: GET
    path: "/co-living/memberships/{id}"
    description: "Reads one tenancy with both state axes and the live balance."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["re-evaluates calculations.membership_balance_due before serializing"]

  - method: GET
    path: "/co-living/memberships"
    description: "Lists tenancies, filterable by member, room, house, application and either state axis."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["member_id?", "room_id?", "house_id?", "application_id?", "tenancy_status?", "billing_status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/co-living/memberships/{id}/move-in"
    description: "Moves the resident in; gated on House.compliance_posture == OPEN."
    roles: [CommunityManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["tenancy_status PENDING_MOVE_IN -> ACTIVE", "Room.occupancy_state RESERVED -> OCCUPIED", "recomputes House room-state counts and compliance_posture"]

  - method: POST
    path: "/co-living/memberships/{id}/notice"
    description: "Files a move-out notice. reason=MEMBER_INITIATED requires the supplied scheduled_move_out_date to be at least MIN_NOTICE_DAYS out; reason=NONPAYMENT ignores the supplied date and pins clock_date + NONPAYMENT_NOTICE_DAYS."
    roles: [Member, CommunityManager]
    code: 200
    input: ["reason", "scheduled_move_out_date?"]
    output: Membership
    side_effects: ["tenancy_status ACTIVE -> NOTICE_GIVEN", "writes Membership.provisional_final_charge_cents per calculations.move_out_proration variant provisional_notice_block", "Room.occupancy_state OCCUPIED -> NOTICE_PENDING and Room.available_from_date set", "recomputes House room-state counts and compliance_posture"]

  - method: POST
    path: "/co-living/memberships/{id}/move-out"
    description: "Finalizes the move-out with the real last billable day and settles the proration."
    roles: [CommunityManager]
    code: 200
    input: ["actual_move_out_date"]
    output: Membership
    side_effects: ["tenancy_status NOTICE_GIVEN -> MOVED_OUT", "writes Membership.final_charge_cents and pushes Invoice.proration_adjustment_cents into the matching invoice", "recomputes Membership.balance_due_cents and may settle billing_status", "Room.occupancy_state NOTICE_PENDING -> VACANT", "recomputes House room-state counts and compliance_posture"]

  - method: POST
    path: "/co-living/memberships/{id}/cancel"
    description: "Cancels a tenancy that has not moved in yet and releases the room."
    roles: [CommunityManager, Member]
    code: 200
    input: ["cancel_reason?"]
    output: Membership
    side_effects: ["tenancy_status PENDING_MOVE_IN -> CANCELLED", "Room.occupancy_state RESERVED -> VACANT", "recomputes House room-state counts so the partition invariant and occupied_room_count return to their pre-creation values"]

  # ---- invoices & payments -------------------------------------------
  - method: POST
    path: "/co-living/invoices"
    description: "Generates one all-in rent invoice for a billing period of exactly Membership.period_days."
    roles: [FinanceAdmin]
    code: 201
    input: ["membership_id", "period_start", "period_end"]
    output: Invoice
    side_effects: ["runs calculations.invoice_charge_assembly STEP 1-3 and STEP 5", "sets due_date = period_start and status OPEN", "recomputes Membership.balance_due_cents"]

  - method: GET
    path: "/co-living/invoices/{id}"
    description: "Reads one invoice with its full charge breakdown."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/co-living/invoices"
    description: "Lists invoices, filterable by tenancy and status."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["membership_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/co-living/invoices/{id}/payments"
    description: "Applies cash to an invoice."
    roles: [Member, FinanceAdmin]
    code: 201
    input: ["amount_cents", "method"]
    output: Payment
    side_effects: ["raises Invoice.amount_paid_cents and advances Invoice.status", "recomputes Membership.balance_due_cents", "may drive Membership.billing_status PAST_DUE -> CURRENT, which may auto-rescind a NONPAYMENT notice and return the room to OCCUPIED"]

  - method: GET
    path: "/co-living/invoices/{id}/payments"
    description: "Lists every cash application against the invoice, oldest first by applied_at then created_at."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/co-living/invoices/{id}/fee-adjustment"
    description: "action=ASSESS applies the tiered late fee keyed on Invoice.subtotal_cents; action=WAIVE reverses it exactly."
    roles: [FinanceAdmin]
    code: 200
    input: ["action"]
    output: Invoice
    side_effects: ["ASSESS: sets Invoice.late_fee_cents, raises total_amount_cents, moves Invoice.status to PAST_DUE and Membership.billing_status to PAST_DUE", "WAIVE: zeroes Invoice.late_fee_cents and lowers total_amount_cents by exactly that amount", "recomputes Membership.balance_due_cents"]

  # ---- house-rule incidents ------------------------------------------
  - method: POST
    path: "/co-living/incidents"
    description: "Files a house-rule violation report against a tenancy."
    roles: [CommunityManager, ComplianceOfficer, Member]
    code: 201
    input: ["membership_id", "rule_code", "severity", "description", "occurred_at"]
    output: HouseRuleIncident
    side_effects: ["copies house_id from the membership", "records reported_by_user_id from X-User-ID", "status starts REPORTED and contributes 0 strike points"]

  - method: GET
    path: "/co-living/incidents/{id}"
    description: "Reads one incident."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: HouseRuleIncident
    side_effects: []

  - method: GET
    path: "/co-living/incidents"
    description: "Lists incidents, filterable by house, tenancy and status."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["house_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: HouseRuleIncident[]
    side_effects: []

  - method: POST
    path: "/co-living/incidents/{id}/adjudicate"
    description: "Upholds or dismisses a reported or disputed incident. The acting X-User-ID must differ from reported_by_user_id."
    roles: [ComplianceOfficer]
    code: 200
    input: ["outcome", "adjudication_note?"]
    output: HouseRuleIncident
    side_effects: ["records adjudicated_by_user_id", "recomputes Member.strike_points and standing_band", "on UPHOLD crossing STRIKE_SUSPENSION_THRESHOLD, cascades a COMPLIANCE notice onto the membership, the room and the house posture"]

  - method: POST
    path: "/co-living/incidents/{id}/dispute"
    description: "Lets the charged resident dispute an UPHELD incident, sending it back for re-review."
    roles: [Member]
    code: 200
    input: ["dispute_reason"]
    output: HouseRuleIncident
    side_effects: ["status UPHELD -> DISPUTED", "increments dispute_round", "recomputes Member.strike_points (a DISPUTED incident contributes 0)"]

  # ---- maintenance ----------------------------------------------------
  - method: POST
    path: "/co-living/tickets"
    description: "Opens a maintenance work order against a house, optionally scoped to a room and to the tenancy entitled to a credit."
    roles: [Member, CommunityManager]
    code: 201
    input: ["house_id", "area", "severity", "description", "room_id?", "affected_membership_id?"]
    output: MaintenanceTicket
    side_effects: ["computes sla_deadline_at from created_at + SLA_HOURS_BY_SEVERITY", "a CRITICAL ROOM ticket on a VACANT room drives Room VACANT -> OUT_OF_SERVICE and recomputes House counts"]

  - method: GET
    path: "/co-living/tickets/{id}"
    description: "Reads one maintenance ticket."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: []

  - method: GET
    path: "/co-living/tickets"
    description: "Lists maintenance tickets, filterable by house, room, credited tenancy and status."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["house_id?", "room_id?", "affected_membership_id?", "status?", "limit?", "offset?"]
    output: MaintenanceTicket[]
    side_effects: []

  - method: POST
    path: "/co-living/tickets/{id}/schedule"
    description: "Books a technician visit window on the house calendar. Optimistically concurrent on House.version."
    roles: [CommunityManager]
    code: 200
    input: ["visit_start", "visit_end", "expected_house_version"]
    output: MaintenanceTicket
    side_effects: ["status OPEN -> SCHEDULED", "increments House.version by 1"]

  - method: POST
    path: "/co-living/tickets/{id}/resolve"
    description: "Closes the work order and issues any SLA-breach rent credit."
    roles: [CommunityManager]
    code: 200
    input: ["resolution_note?"]
    output: MaintenanceTicket
    side_effects: ["sets resolved_at from the logical clock and computes breach_hours", "writes rent_credit_cents per calculations.maintenance_rent_credit", "returns an OUT_OF_SERVICE room to VACANT and recomputes House counts and posture"]

  # ---- payouts ---------------------------------------------------------
  - method: POST
    path: "/co-living/payouts"
    description: "Opens a payout cycle for a house."
    roles: [FinanceAdmin]
    code: 201
    input: ["house_id", "cycle_start", "cycle_end"]
    output: Payout
    side_effects: ["status starts DRAFT with every money field at 0 and variant_applied NONE"]

  - method: POST
    path: "/co-living/payouts/{id}/project"
    description: "Runs the accrual projection over the cycle and withholds the reserve."
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status DRAFT -> PROJECTED", "writes the money fields per calculations.payout_net_settlement variant accrual_projection", "records projected_by_user_id"]

  - method: POST
    path: "/co-living/payouts/{id}/release"
    description: "Re-runs the settlement on a cash basis and remits. Blocked while the house is FROZEN, and the releasing operator must differ from the projecting one."
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["status PROJECTED -> RELEASED", "rewrites the money fields per calculations.payout_net_settlement variant cash_final and drops reserve_cents to 0", "records released_by_user_id and released_at"]

  - method: GET
    path: "/co-living/payouts/{id}"
    description: "Reads one payout with the variant that produced its current numbers."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/co-living/payouts"
    description: "Lists payouts, filterable by house and status."
    roles: [Host, Member, CommunityManager, ComplianceOfficer, FinanceAdmin, PlatformAdmin]
    code: 200
    input: ["house_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Member or Host acts on a resource whose owning member_id / host_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the adjudicating operator equals HouseRuleIncident.reported_by_user_id, or the releasing operator equals Payout.projected_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required body field, unknown enum member, malformed date/datetime, negative amount, or limit/offset outside 1..100 / >= 0"
  - id: ERR_HOST_NOT_FOUND
    http: 404
    condition: "host_id in the request body resolves to no Host"
  - id: ERR_HOUSE_NOT_FOUND
    http: 404
    condition: "a house id in the path or body resolves to no House"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "a room id in the path or body resolves to no Room"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id in the path or body resolves to no Member"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "an application id in the path or body resolves to no Application"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "a membership id in the path or body resolves to no Membership"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "an invoice id in the path resolves to no Invoice"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "an incident id in the path resolves to no HouseRuleIncident"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "a ticket id in the path resolves to no MaintenanceTicket"
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "a payout id in the path resolves to no Payout"
  - id: ERR_ENTITY_MISMATCH
    http: 409
    condition: "MaintenanceTicket.room_id belongs to a different house than house_id, or affected_membership_id belongs to a different house"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "another Member already holds that email"
  - id: ERR_DUPLICATE_ROOM_NUMBER
    http: 409
    condition: "another Room in the same house already holds that room_number"
  - id: ERR_MEMBER_ALREADY_HOUSED
    http: 409
    condition: "the member already has a Membership in PENDING_MOVE_IN, ACTIVE or NOTICE_GIVEN"
  - id: ERR_APPLICATION_NOT_PENDING
    http: 409
    condition: "a decision is rendered on an application whose status is not SCREENED, a screening round is filed on an application whose status is not SUBMITTED, a resubmit targets an application whose status is not CONDITIONAL, or a membership is created from an application whose status is neither APPROVED nor CONDITIONAL"
  - id: ERR_ROOM_NOT_AVAILABLE
    http: 409
    condition: "the application's room is not in occupancy_state VACANT at decision or conversion time"
  - id: ERR_INVALID_MEMBERSHIP_STATE
    http: 409
    condition: "move-in, notice, move-out or cancel is attempted from a tenancy_status the transition does not accept, or an invoice is generated for a tenancy that is not ACTIVE or NOTICE_GIVEN"
  - id: ERR_INVALID_INCIDENT_STATE
    http: 409
    condition: "adjudicate is attempted on an incident that is not REPORTED or DISPUTED, or dispute is attempted on an incident that is not UPHELD"
  - id: ERR_INVALID_TICKET_STATE
    http: 409
    condition: "schedule is attempted on a ticket that is not OPEN, or resolve is attempted on a RESOLVED ticket"
  - id: ERR_INVALID_PAYOUT_STATE
    http: 409
    condition: "project is attempted on a payout that is not DRAFT, or release on a payout that is not PROJECTED"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "a payment is applied to an invoice already in status PAID"
  - id: ERR_STALE_ROOM_VERSION
    http: 412
    condition: "expected_room_version differs from the room's current version"
  - id: ERR_STALE_HOUSE_VERSION
    http: 412
    condition: "expected_house_version differs from the house's current version"
  - id: ERR_BACKGROUND_FAILED
    http: 409
    condition: "decision=APPROVE while the latest ScreeningReport.background_result is FAILED"
  - id: ERR_HOUSE_POSTURE_BLOCKED
    http: 409
    condition: "move-in attempted while House.compliance_posture is RESTRICTED or FROZEN"
  - id: ERR_HOUSE_FROZEN
    http: 409
    condition: "payout release attempted while House.compliance_posture is FROZEN"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "period_end < period_start, cycle_end < cycle_start, visit_end <= visit_start, actual_move_out_date < move_in_date, or actual_move_out_date later than the logical clock date"
  - id: ERR_MOVE_IN_DATE_IN_PAST
    http: 409
    condition: "move_in_date is strictly earlier than the logical clock date"
  - id: ERR_NOTICE_TOO_SHORT
    http: 409
    condition: "a MEMBER_INITIATED notice pins a scheduled_move_out_date less than MIN_NOTICE_DAYS out from the clock date"
  - id: ERR_NOT_PAST_DUE
    http: 409
    condition: "a NONPAYMENT notice is filed while Membership.billing_status is not PAST_DUE"
  - id: ERR_INVALID_PERIOD_LENGTH
    http: 422
    condition: "period_end - period_start + 1 differs from Membership.period_days"
  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "the new closed billing interval intersects an existing invoice of the same membership"
  - id: ERR_PAYOUT_CYCLE_OVERLAP
    http: 409
    condition: "the new closed payout cycle intersects an existing payout of the same house"
  - id: ERR_LATE_FEE_NOT_DUE
    http: 409
    condition: "action=ASSESS while clock_date <= Invoice.due_date + GRACE_DAYS"
  - id: ERR_LATE_FEE_ALREADY_ASSESSED
    http: 409
    condition: "action=ASSESS while Invoice.late_fee_cents is already greater than 0"
  - id: ERR_NO_LATE_FEE_TO_WAIVE
    http: 409
    condition: "action=WAIVE while Invoice.late_fee_cents is 0"
  - id: ERR_ROOM_TURNOVER_CONFLICT
    http: 409
    condition: "the requested move_in_date is not strictly later than a prior tenancy's effective_end_date plus TURNOVER_BUFFER_DAYS on the same room"
  - id: ERR_VISIT_CAPACITY_CONFLICT
    http: 409
    condition: "the requested half-open visit window would put more than MAX_CONCURRENT_VISITS_PER_HOUSE scheduled visits over some instant in the same house"
  - id: ERR_DISPUTE_LIMIT_REACHED
    http: 409
    condition: "dispute attempted while HouseRuleIncident.dispute_round has already reached MAX_DISPUTE_ROUNDS"
  - id: ERR_APPLICATION_ROUND_LIMIT
    http: 409
    condition: "resubmit or a further screening round attempted while Application.screening_round has already reached MAX_APPLICATION_ROUNDS"
  - id: ERR_INCOME_INSUFFICIENT
    http: 422
    condition: "decision=APPROVE while qualifying income is below required_income_cents and the cosigner round has already been consumed"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "amount_cents exceeds the invoice's outstanding remainder"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operations: onboards hosts and members and controls the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /co-living/_clock/set_current_utc"
      - "POST /co-living/hosts"
      - "POST /co-living/members"
    shared_operations:
      - "POST /co-living/houses (shared with Host)"
      - "POST /co-living/rooms and PUT /co-living/rooms/{id} (shared with Host)"
      - "every GET endpoint"

  - name: Host
    description: "Property owner: defines houses and rooms and receives the payout."
    identity: "entity_backed:Host"
    exclusive_operations: []
    shared_operations:
      - "POST /co-living/houses (must equal host_id)"
      - "POST /co-living/rooms and PUT /co-living/rooms/{id} (must own the room's house)"
      - "every GET endpoint"

  - name: Member
    description: "Prospective or current by-the-room resident."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /co-living/applications/{id}/resubmit"
      - "POST /co-living/incidents/{id}/dispute"
    shared_operations:
      - "POST /co-living/applications (must equal member_id)"
      - "POST /co-living/memberships/{id}/notice and /cancel (must own the tenancy)"
      - "POST /co-living/invoices/{id}/payments (must own the tenancy behind the invoice)"
      - "POST /co-living/incidents and POST /co-living/tickets (must own the referenced tenancy)"
      - "every GET endpoint"

  - name: CommunityManager
    description: "House-level operator: converts applications into tenancies, runs move-in/move-out, files incidents and manages maintenance."
    identity: "opaque"
    exclusive_operations:
      - "POST /co-living/memberships"
      - "POST /co-living/memberships/{id}/move-in"
      - "POST /co-living/memberships/{id}/move-out"
      - "POST /co-living/tickets/{id}/schedule"
      - "POST /co-living/tickets/{id}/resolve"
    shared_operations:
      - "POST /co-living/applications (on behalf of a walk-in)"
      - "POST /co-living/memberships/{id}/notice and /cancel"
      - "POST /co-living/incidents and POST /co-living/tickets"
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: "Screening and house-rule adjudication. Segregated from the reporting duty: may file an incident OR adjudicate it, never both."
    identity: "opaque"
    exclusive_operations:
      - "POST /co-living/applications/{id}/screening-reports"
      - "POST /co-living/applications/{id}/decision"
      - "POST /co-living/incidents/{id}/adjudicate"
    shared_operations:
      - "POST /co-living/incidents"
      - "every GET endpoint"

  - name: FinanceAdmin
    description: "Billing and remittance. Segregated on the payout: the operator who projects may not release."
    identity: "opaque"
    exclusive_operations:
      - "POST /co-living/invoices"
      - "POST /co-living/invoices/{id}/fee-adjustment"
      - "POST /co-living/payouts"
      - "POST /co-living/payouts/{id}/project"
      - "POST /co-living/payouts/{id}/release"
    shared_operations:
      - "POST /co-living/invoices/{id}/payments (records offline cash)"
      - "every GET endpoint"
