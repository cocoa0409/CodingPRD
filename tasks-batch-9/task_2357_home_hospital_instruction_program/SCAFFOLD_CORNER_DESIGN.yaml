              payload: { abort_reason: "CAMPUS_CAPACITY" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_abort_twice: $.data.error_id }
          assert:
            - "Plan create: HTTP 201, data.status == \"DRAFT\", data.required_ack_count == 0, data.classroom_ack_count == 0; the case moves to TRANSITION_PLANNED."
            - "${err_not_ready} == \"ERR_PLAN_NOT_READY\" with HTTP 409 — priority 8 fires before the priority-13 return-date rule."
            - "${err_no_pacing} == \"ERR_NO_PACING_COORDINATION\" with HTTP 422; the plan is still DRAFT so the priority-8 state check passed and the priority-12 referential check is what failed."
            - "First coordinate after the sync exists: HTTP 200, data.status == \"CLASSROOM_COORD_PENDING\", data.required_ack_count == 1, data.classroom_ack_count == 0."
            - "${err_coord_twice} == \"ERR_PLAN_STATE_INVALID\" with HTTP 409 (coordinate demands DRAFT)."
