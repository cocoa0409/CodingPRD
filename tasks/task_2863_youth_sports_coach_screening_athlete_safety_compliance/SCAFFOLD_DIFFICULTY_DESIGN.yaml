  - rule_id: non_linear_state_machine
    instances:
      - name: member_screening_and_membership_dimensions_advance_independently
        grounds:
          - state_machines.Member.UNSCREENED_to_SCREENING_ORDERED
          - state_machines.Member.SCREENING_ORDERED_to_CLEARED
          - state_machines.Member.PENDING_to_ACTIVE
          - entities.Member.fields.screening_status
          - entities.Member.fields.membership_status
          - calculations.contact_eligibility_derivation
        distinguishing_aspect: |
          Member carries two independent state dimensions on one row: the screening dimension
          reaches CLEARED after adjudication while the membership dimension is still PENDING
          (because training_status is NEVER), and only the later SS101 completion bubbles
          membership PENDING -> ACTIVE without moving the screening dimension at all - so the
          combined state (CLEARED, PENDING) is reachable and observable between the two events.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000"
            - "course SS101 published, 365-day validity, required for TIER_1"
            - "member m_par is a VOLUNTEER with no minor-athlete contact and one jurisdiction, so required_tier TIER_1"
            - "m_par starts at screening_status UNSCREENED, membership_status PENDING, training_status NEVER, contact_eligibility RESTRICTED"
