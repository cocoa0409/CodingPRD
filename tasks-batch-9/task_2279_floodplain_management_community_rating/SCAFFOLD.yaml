# =============================================================================
# task_2279 — Floodplain Management & Community Rating
# Seed tables §1.0–§1.7 (single source of truth for PRD / tests / implementation)
# =============================================================================

scenario: |
  2279. Floodplain Management & Community Rating (municipal floodplain administrator): floodplain development permit review with base flood elevation determination and freeboard requirements, elevation certificate collection, review and record retention for new and substantially improved structures, substantial improvement and substantial damage determination with cumulative tracking, higher standards adoption for credit under the community rating system with documentation cycles, repetitive loss area analysis and outreach to affected property owners, enforcement of violations with remediation orders and community sanction risk, map revision coordination and post-disaster inspection procedures, annual recertification and verification visits

domain_name: floodplain-management-community-rating
api_prefix: /floodplain

# -----------------------------------------------------------------------------
# Step 0: Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection directly under /floodplain. Ownership is
  # expressed with foreign keys in request bodies, never with nested URL paths.

  state_machine_shape: cyclic
  # DevelopmentPermit: UNDER_REVIEW <-> REVISION_REQUIRED revision loop.
  # ElevationCertificate: SUBMITTED <-> DEFICIENT amendment loop.
  # Violation: ESCALATED -> REMEDIATED revert.
  # DeterminationCase: branching fork-join (DETERMINED -> {APPEALED, WITHDRAWN},
  #   APPEALED -> {APPEAL_SUSTAINED, APPEAL_DENIED}) with divergent side effects.
  # Structure: parallel dimensions (compliance_status x substantial_status).
  # RepetitiveLossArea: parallel dimensions (status x analysis_status x outreach_status).

  relationship_patterns:
    - one_to_many          # Community -> FirmPanel / Property / HigherStandard / CrsCycle
    - self_referential     # FirmPanel.supersedes_panel_id, ImprovementRecord.reverses_record_id
    - cross_aggregate      # HigherStandard verification reads RepetitiveLossArea outreach results
    - polymorphic          # ImprovementRecord.source distinguishes permit / inspection / admin origin

  role_model: segregation_of_duties
  # The FloodplainAdministrator who determines a case may never decide its
  # appeal; the StateNfipCoordinator who verifies credit never submits it.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Municipality name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code", constraints: "exactly 2 uppercase letters" }
      - { name: cid_number, type: string, source: input, description: "NFIP community identification number", constraints: "unique across all communities" }
      - { name: freeboard_ft, type: number, source: input, default: 1.0, description: "Adopted freeboard above base flood elevation, in feet", constraints: ">= 0.0 and <= 6.0, one decimal or two decimals" }
      - { name: cumulative_period_years, type: integer, source: input, default: 10, description: "Look-back window in whole years used by the CUMULATIVE substantial-improvement method; 0 disables cumulative tracking", constraints: ">= 0 and <= 25" }
      - { name: standards_adopted_at, type: datetime, source: system, description: "Logical-clock instant at which freeboard_ft / cumulative_period_years were last changed" }
      - { name: sanction_risk_points, type: integer, source: computed, default: 0, description: "Net enforcement risk score; see calculations.sanction_risk_and_posture" }
      - { name: compliance_posture, type: enum, source: computed, default: GOOD_STANDING, description: "GOOD_STANDING | ON_PROBATION | SUSPENDED — derived from sanction_risk_points" }
      - { name: crs_credit_points_claimed, type: integer, source: computed, default: 0, description: "Sum of HigherStandard.claimed_points for standards with documentation_status IN {SUBMITTED, VERIFIED}" }
      - { name: crs_credit_points_verified, type: integer, source: computed, default: 0, description: "Sum of HigherStandard.verified_points for standards with documentation_status == VERIFIED" }
      - { name: crs_class, type: integer, source: computed, default: 10, description: "Community Rating System class 1..10; see calculations.crs_class_determination (VERIFIED variant)" }

  - name: FirmPanel
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: panel_number, type: string, source: input, description: "FIRM panel number, e.g. 12345C0100" }
      - { name: suffix, type: string, source: input, description: "Panel revision suffix letter, e.g. H" }
      - { name: flood_zone, type: enum, source: input, description: "A | AE | AO | VE | X" }
      - { name: base_flood_elevation_ft, type: number, source: input, description: "BFE in feet NAVD88 for A/AE/VE; flood DEPTH in feet for AO; null permitted only for zone A (unnumbered)" }
      - { name: effective_date, type: datetime, source: input, description: "Instant at which this panel becomes the governing map" }
      - { name: status, type: enum, source: computed, default: PENDING_REVISION, description: "PENDING_REVISION | EFFECTIVE | SUPERSEDED" }
      - { name: supersedes_panel_id, type: string, source: computed, description: "FK -> FirmPanel.id; self-referential — the panel that was EFFECTIVE for the same panel_number at activation time, null for the first panel" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of activation" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: firm_panel_id, type: string, source: input, description: "FK -> FirmPanel.id; must have status == EFFECTIVE at creation; repointed by map revision cascade" }
      - { name: parcel_id, type: string, source: input, description: "Assessor parcel identifier", constraints: "unique per community_id" }
      - { name: mapped_area_code, type: string, source: input, description: "Flood-hazard sub-area code printed on the panel; matched against RepetitiveLossArea.area_code during analysis" }
      - { name: owner_name, type: string, source: input, description: "Owner of record" }
      - { name: owner_email, type: string, source: input, description: "Owner contact for repetitive-loss outreach" }
      - { name: repetitive_loss_area_id, type: string, source: computed, description: "FK -> RepetitiveLossArea.id; assigned by repetitive-loss-area analysis, null when unassigned" }
      - { name: qualifying_claim_count, type: integer, source: computed, default: 0, description: "Count of qualifying NFIP claims; see calculations.repetitive_loss_classification" }
      - { name: max_window_claim_count, type: integer, source: computed, default: 0, description: "Largest qualifying-claim count found in any RL_WINDOW_YEARS rolling window" }
      - { name: cumulative_claim_paid_usd, type: number, source: computed, default: 0, description: "Sum of claim_paid_amount_usd over qualifying claims" }
      - { name: repetitive_loss_status, type: enum, source: computed, default: NONE, description: "NONE | REPETITIVE_LOSS | SEVERE_REPETITIVE_LOSS" }

  - name: Structure
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: structure_use, type: enum, source: input, description: "RESIDENTIAL | NON_RESIDENTIAL | ACCESSORY" }
      - { name: pre_firm, type: boolean, source: input, description: "True when construction predates the community's first FIRM" }
      - { name: construction_year, type: integer, source: input, description: "Year of original construction" }
      - { name: market_value_usd, type: number, source: input, description: "Assessed market value of the structure excluding land", constraints: "> 0" }
      - { name: highest_adjacent_grade_ft, type: number, source: input, description: "Highest adjacent grade in feet NAVD88; denominator of AO-zone elevation requirements" }
      - { name: lowest_floor_elevation_ft, type: number, source: computed, description: "Normalized lowest floor from the most recently ACCEPTED FINISHED_CONSTRUCTION ElevationCertificate; null until one exists" }
      - { name: compliance_status, type: enum, source: computed, default: PENDING_CERTIFICATE, description: "PRE_FIRM_EXISTING | PENDING_CERTIFICATE | COMPLIANT | NON_COMPLIANT — driven only by elevation-certificate acceptance and violations" }
      - { name: substantial_status, type: enum, source: computed, default: NONE, description: "NONE | SUBSTANTIAL_IMPROVEMENT | SUBSTANTIAL_DAMAGE — driven only by DeterminationCase outcomes; evolves independently of compliance_status" }
      - { name: anchor_record_id, type: string, source: computed, description: "FK -> ImprovementRecord.id; the counted record that anchors the cumulative window, null when no counted record exists" }
      - { name: cumulative_counted_cost_usd, type: number, source: computed, default: 0, description: "Net counted cost inside the anchored cumulative window; see calculations.structure_improvement_aggregates" }
      - { name: cumulative_improvement_pct, type: number, source: computed, default: 0, description: "CUMULATIVE-method ratio in percent, 2 decimals" }
      - { name: single_event_improvement_pct, type: number, source: computed, default: 0, description: "SINGLE_EVENT-method ratio in percent, 2 decimals" }

  - name: DevelopmentPermit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: structure_id, type: string, source: input, description: "FK -> Structure.id; must belong to property_id" }
      - { name: project_type, type: enum, source: input, description: "NEW_CONSTRUCTION | IMPROVEMENT | REPAIR" }
      - { name: declared_project_cost_usd, type: number, source: input, description: "Applicant-declared cost of the work", constraints: ">= 0" }
      - { name: proposed_lowest_floor_elevation_ft, type: number, source: input, description: "Lowest floor elevation the applicant proposes to build to, feet NAVD88" }
      - { name: floodproofing_requested, type: boolean, source: input, default: false, description: "Applicant requests dry-floodproofing credit instead of elevation" }
      - { name: determined_zone, type: enum, source: computed, description: "A | AE | AO | VE — flood zone snapshot taken from the governing panel at submit" }
      - { name: determined_bfe_ft, type: number, source: computed, description: "Base flood elevation (or AO depth) snapshot taken from the governing panel at submit" }
      - { name: freeboard_applied_ft, type: number, source: computed, description: "Snapshot of Community.freeboard_ft at submit; later community amendments never rewrite it" }
      - { name: required_lowest_floor_elevation_ft, type: number, source: computed, description: "See calculations.required_lowest_floor_elevation" }
      - { name: si_determination_case_id, type: string, source: computed, description: "FK -> DeterminationCase.id; the case whose outcome gated approval, null when none applied" }
      - { name: status, type: enum, source: computed, default: DRAFT, description: "DRAFT | UNDER_REVIEW | REVISION_REQUIRED | APPROVED | ISSUED | CLOSED_COMPLIANT | DENIED | REVOKED" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Incremented on every REVISION_REQUIRED -> UNDER_REVIEW resubmission" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + PERMIT_VALIDITY_DAYS" }

  - name: ElevationCertificate
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> DevelopmentPermit.id" }
      - { name: structure_id, type: string, source: input, description: "FK -> Structure.id" }
      - { name: certificate_type, type: enum, source: input, description: "CONSTRUCTION_DRAWINGS | BUILDING_UNDER_CONSTRUCTION | FINISHED_CONSTRUCTION" }
      - { name: surveyor_license_no, type: string, source: input, description: "Licensed surveyor number; mandatory for FINISHED_CONSTRUCTION" }
      - { name: datum, type: enum, source: input, description: "NAVD88 | NGVD29" }
      - { name: measured_lowest_floor_ft, type: number, source: input, description: "Surveyed lowest floor elevation expressed in the submitted datum" }
      - { name: measured_bfe_ft, type: number, source: input, description: "BFE the surveyor read off the map, expressed in the submitted datum" }
      - { name: normalized_lowest_floor_ft, type: number, source: computed, description: "measured_lowest_floor_ft converted to NAVD88; see calculations.certificate_datum_normalization" }
      - { name: freeboard_margin_ft, type: number, source: computed, description: "normalized_lowest_floor_ft - permit.required_lowest_floor_elevation_ft, 1 decimal" }
      - { name: status, type: enum, source: computed, default: SUBMITTED, description: "SUBMITTED | ACCEPTED | DEFICIENT | SUPERSEDED" }
      - { name: deficiency_codes, type: array, source: computed, default: [], description: "Reviewer-supplied deficiency codes recorded on a DEFICIENT review" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant of acceptance" }
      - { name: retention_review_due_at, type: datetime, source: computed, description: "accepted_at + DOC_RETENTION_REVIEW_YEARS — record-retention audit date for CRS Activity 310 credit" }

  - name: ImprovementRecord
    parent: null
    common_fields: false
    fields:
      - { name: structure_id, type: string, source: input, description: "FK -> Structure.id" }
      - { name: record_type, type: enum, source: input, description: "IMPROVEMENT | DAMAGE | REVERSAL" }
      - { name: source, type: enum, source: computed, description: "PERMIT_CLOSEOUT | DISASTER_INSPECTION | ADMIN_ADJUSTMENT | REVERSAL_ADJUSTMENT" }
      - { name: permit_id, type: string, source: computed, description: "FK -> DevelopmentPermit.id; set for PERMIT_CLOSEOUT records, else null" }
      - { name: inspection_id, type: string, source: computed, description: "FK -> PostDisasterInspection.id; set for DISASTER_INSPECTION records, else null" }
      - { name: reverses_record_id, type: string, source: input, description: "FK -> ImprovementRecord.id; self-referential, required for record_type == REVERSAL and forbidden otherwise" }
      - { name: event_date, type: datetime, source: input, description: "Date the improvement or damage occurred; drives cumulative-window membership" }
      - { name: cost_usd, type: number, source: computed, description: "Cost of work or damage; supplied for IMPROVEMENT/DAMAGE, copied from the target for REVERSAL", constraints: ">= 0" }
      - { name: market_value_at_event_usd, type: number, source: computed, description: "Snapshot of Structure.market_value_usd at record creation; denominator of both ratio methods" }
      - { name: claim_paid_amount_usd, type: number, source: computed, default: 0, description: "NFIP claim paid for this event; drives repetitive-loss classification" }
      - { name: is_code_compliance_only, type: boolean, source: input, default: false, description: "Work required solely to correct pre-cited health/safety code violations; excluded from cumulative tracking" }
      - { name: counted_in_cumulative, type: boolean, source: computed, description: "True iff record_type IN {IMPROVEMENT, DAMAGE} AND is_code_compliance_only == false AND cost_usd >= MIN_COUNTED_COST_USD" }
      - { name: reversed, type: boolean, source: computed, default: false, description: "True once a REVERSAL record targets this record" }

  - name: DeterminationCase
    parent: null
    common_fields: true
    fields:
      - { name: structure_id, type: string, source: input, description: "FK -> Structure.id" }
      - { name: anchor_record_id, type: string, source: computed, description: "FK -> ImprovementRecord.id; snapshot of Structure.anchor_record_id at case creation, null when the structure has no counted record" }
      - { name: method, type: enum, source: input, description: "SINGLE_EVENT | CUMULATIVE" }
      - { name: trigger_source, type: enum, source: computed, description: "PERMIT_REVIEW | DISASTER_INSPECTION | ADMIN" }
      - { name: determination_type, type: enum, source: computed, description: "SUBSTANTIAL_IMPROVEMENT | SUBSTANTIAL_DAMAGE — derived from the anchor record's record_type (IMPROVEMENT -> SUBSTANTIAL_IMPROVEMENT, DAMAGE -> SUBSTANTIAL_DAMAGE); SUBSTANTIAL_IMPROVEMENT when anchor is null" }
      - { name: computed_ratio_pct, type: number, source: computed, description: "Ratio in percent produced by the selected method, 2 decimals" }
      - { name: threshold_pct, type: number, source: computed, default: 50.0, description: "SI_THRESHOLD_PCT snapshot used for this case" }
      - { name: outcome, type: enum, source: computed, description: "SUBSTANTIAL | NOT_SUBSTANTIAL; null while status == OPEN" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | DETERMINED | APPEALED | APPEAL_SUSTAINED | APPEAL_DENIED | WITHDRAWN" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of the FloodplainAdministrator who determined the case; null for system auto-determinations" }
      - { name: determined_at, type: datetime, source: system, description: "Logical-clock instant of determination" }
      - { name: appeal_deadline_at, type: datetime, source: computed, description: "determined_at + APPEAL_WINDOW_DAYS" }
      - { name: appealed_at, type: datetime, source: system, description: "Logical-clock instant the owner filed the appeal" }
      - { name: appeal_decided_by_user_id, type: string, source: system, description: "X-User-ID of the AppealsBoardMember who decided the appeal" }

  - name: PostDisasterInspection
    parent: null
    common_fields: true
    fields:
      - { name: structure_id, type: string, source: computed, description: "FK -> Structure.id; assigned by the inspection sweep" }
      - { name: declaration_code, type: string, source: computed, description: "Disaster declaration code that spawned this inspection" }
      - { name: disaster_event_date, type: datetime, source: computed, description: "Date of the flood event named in the declaration" }
      - { name: deadline_at, type: datetime, source: computed, description: "disaster_event_date + inspection_window_days of the sweep" }
      - { name: status, type: enum, source: computed, default: SCHEDULED, description: "SCHEDULED | ASSESSED | FINALIZED" }
      - { name: damage_cost_usd, type: number, source: input, description: "Estimated cost to restore the structure to pre-damage condition", constraints: ">= 0" }
      - { name: claim_paid_amount_usd, type: number, source: input, default: 0, description: "NFIP claim paid for this event", constraints: ">= 0" }
      - { name: market_value_at_inspection_usd, type: number, source: computed, description: "Snapshot of Structure.market_value_usd at assessment" }
      - { name: damage_ratio_pct, type: number, source: computed, description: "round(damage_cost_usd / market_value_at_inspection_usd * 100, 2)" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock instant of assessment" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock instant of finalization" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: structure_id, type: string, source: input, description: "FK -> Structure.id; null for site-only violations such as UNPERMITTED_FILL" }
      - { name: permit_id, type: string, source: input, description: "FK -> DevelopmentPermit.id; null when the work was never permitted" }
      - { name: violation_type, type: enum, source: input, description: "NO_PERMIT | ELEVATION_DEFICIENT | MISSING_CERTIFICATE | UNPERMITTED_FILL" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | ORDER_ISSUED | REMEDIATED | ESCALATED | CLOSED_UNRESOLVED" }
      - { name: sanction_points_contributed, type: integer, source: computed, default: 0, description: "SEVERITY_WEIGHT[severity] while status IN {OPEN, ORDER_ISSUED, ESCALATED}, else 0" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant the notice was issued" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock instant of REMEDIATED / CLOSED_UNRESOLVED" }

  - name: RemediationOrder
    parent: null
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id" }
      - { name: required_action, type: string, source: input, description: "Corrective action the owner must complete" }
      - { name: deadline_at, type: datetime, source: input, description: "Compliance deadline; must be strictly after the current logical clock at creation" }
      - { name: extension_count, type: integer, source: computed, default: 0, description: "Number of granted deadline extensions" }
      - { name: status, type: enum, source: computed, default: ISSUED, description: "ISSUED | EXTENDED | SATISFIED | DEFAULTED" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock instant of SATISFIED / DEFAULTED" }

  - name: RepetitiveLossArea
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: area_code, type: string, source: input, description: "Area designation matched against Property.mapped_area_code", constraints: "unique per community_id" }
      - { name: boundary_description, type: string, source: input, description: "Narrative boundary of the repetitive loss area" }
      - { name: status, type: enum, source: computed, default: DRAFT, description: "DRAFT | DESIGNATED" }
      - { name: analysis_status, type: enum, source: computed, default: PENDING_ANALYSIS, description: "PENDING_ANALYSIS | ANALYZED | STALE — evolves independently of status and outreach_status" }
      - { name: analyzed_at, type: datetime, source: system, description: "Logical-clock instant of the last completed analysis" }
      - { name: property_count, type: integer, source: computed, default: 0, description: "Properties linked to this area by the last analysis" }
      - { name: rl_property_count, type: integer, source: computed, default: 0, description: "Linked properties with repetitive_loss_status != NONE at the last analysis" }
      - { name: outreach_status, type: enum, source: computed, default: NOT_STARTED, description: "NOT_STARTED | IN_PROGRESS | COMPLETED | INSUFFICIENT" }
      - { name: outreach_cycle_year, type: integer, source: computed, description: "Cycle year the in-flight or last outreach effort was credited to" }
      - { name: outreach_crs_cycle_id, type: string, source: computed, description: "FK -> CrsCycle.id; the cycle the outreach effort is documented under, null before launch" }
      - { name: target_property_count, type: integer, source: computed, default: 0, description: "Certified mailing-list size snapshot taken at outreach launch" }
      - { name: delivered_count, type: integer, source: computed, default: 0, description: "Deliveries recorded against the current outreach effort" }
      - { name: coverage_pct, type: number, source: computed, default: 0, description: "round(delivered_count / target_property_count * 100, 2); 0 when target_property_count == 0" }

  - name: HigherStandard
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: activity_code, type: enum, source: input, description: "A430_FREEBOARD | A430_CUMULATIVE_SI | A420_OPEN_SPACE | A510_HIGHER_STD_ENFORCEMENT | A330_OUTREACH" }
      - { name: documentation_cycle_year, type: integer, source: input, description: "CRS documentation cycle year this submission belongs to" }
      - { name: claimed_points, type: integer, source: input, description: "Credit points the community claims for this activity", constraints: ">= 1" }
      - { name: max_points_allowed, type: integer, source: computed, description: "Activity ceiling recomputed from live community/RLA/violation state; see calculations.higher_standard_credit" }
      - { name: verified_points, type: integer, source: computed, default: 0, description: "min(claimed_points, max_points_allowed) once VERIFIED, else 0" }
      - { name: documentation_status, type: enum, source: computed, default: DRAFT, description: "DRAFT | SUBMITTED | VERIFIED | REJECTED | EXPIRED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock instant of verification" }
      - { name: doc_expires_at, type: datetime, source: computed, description: "verified_at + DOC_CYCLE_YEARS — documentation must be recertified before this instant" }
      - { name: rejection_reason, type: string, source: input, description: "Reviewer note recorded on a REJECT decision" }

  - name: CrsCycle
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: cycle_year, type: integer, source: input, description: "Recertification year", constraints: "unique per community_id" }
      - { name: cycle_start_date, type: datetime, source: input, description: "First instant of the cycle's closed coverage interval" }
      - { name: cycle_end_date, type: datetime, source: input, description: "Last instant of the cycle's closed coverage interval; must be strictly after cycle_start_date" }
      - { name: due_at, type: datetime, source: input, description: "Recertification submission deadline" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | SUBMITTED | UNDER_VERIFICATION | CERTIFIED | RETROGRADED | LAPSED" }
      - { name: verification_visit_required, type: boolean, source: computed, description: "True when cycle_year % VERIFICATION_VISIT_YEAR_MODULUS == 0 OR provisional_class is better (numerically lower) than prior_class" }
      - { name: verification_visit_completed_at, type: datetime, source: system, description: "Logical-clock instant the verification visit was recorded" }
      - { name: total_claimed_points, type: integer, source: computed, default: 0, description: "Community.crs_credit_points_claimed snapshot taken at submission" }
      - { name: total_verified_points, type: integer, source: computed, default: 0, description: "Community.crs_credit_points_verified snapshot taken at certification" }
      - { name: provisional_class, type: integer, source: computed, description: "CLAIMED variant of calculations.crs_class_determination, computed at submission" }
      - { name: resulting_class, type: integer, source: computed, description: "VERIFIED variant of calculations.crs_class_determination, computed at certification" }
      - { name: prior_class, type: integer, source: computed, description: "Community.crs_class snapshot taken at submission" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- FirmPanel
  - entity: FirmPanel
    initial_state: PENDING_REVISION
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING_REVISION
        to: EFFECTIVE
        trigger: "POST /floodplain/firm-panels/{panelId}/activate"
        actor: StateNfipCoordinator
        preconditions:
          - "status == PENDING_REVISION"
          - "no FirmPanel with the same community_id and panel_number has status == EFFECTIVE and effective_date >= this.effective_date"
        side_effects:
          - "status -> EFFECTIVE; activated_at = current logical clock"
          - "supersedes_panel_id = id of the FirmPanel with the same community_id and panel_number and status == EFFECTIVE (null when none)"
          - "MAP-REVISION CASCADE hop 1: the superseded panel's status -> SUPERSEDED"
          - "MAP-REVISION CASCADE hop 2: caused by hop 1, every Property whose firm_panel_id was the superseded panel is repointed to this panel (firm_panel_id = this.id)"
          - "MAP-REVISION CASCADE hop 3: caused by hop 2, every DevelopmentPermit whose property_id is one of the repointed properties and whose status IN {UNDER_REVIEW, APPROVED} and whose determined_bfe_ft != this.base_flood_elevation_ft OR determined_zone != this.flood_zone -> status = REVISION_REQUIRED, determined_zone / determined_bfe_ft re-snapshotted from this panel, required_lowest_floor_elevation_ft recomputed"
          - "MAP-REVISION CASCADE hop 4: caused by hop 3, for every permit moved to REVISION_REQUIRED in hop 3, every ElevationCertificate whose structure_id equals that permit's structure_id and whose status == ACCEPTED -> status = SUPERSEDED (the survey no longer reflects the governing map), and that Structure's lowest_floor_elevation_ft is cleared to null and compliance_status -> PENDING_CERTIFICATE unless it is PRE_FIRM_EXISTING"
        note: "Cascade C. Processing order for hops 2-4 is created_at ASC within each affected collection."

      - from: PENDING_REVISION
        to: SUPERSEDED
        trigger: "POST /floodplain/firm-panels/{panelId}/activate (system: superseded incumbent)"
        actor: system
        preconditions: ["status == EFFECTIVE at the moment another panel with the same community_id and panel_number is activated"]
        side_effects: ["status -> SUPERSEDED (see hop 1 above)"]
        note: "Recorded here for completeness: an EFFECTIVE panel is retired only by the activation of its successor; PENDING_REVISION panels are never superseded directly."

  # ------------------------------------------------------- DevelopmentPermit
  - entity: DevelopmentPermit
    initial_state: DRAFT
    terminal_states: [CLOSED_COMPLIANT, DENIED, REVOKED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /floodplain/permits/{permitId}/submit"
        actor: PropertyOwner
        preconditions:
          - "status == DRAFT"
          - "the acting X-User-ID equals the permit's property_id"
          - "the property's FirmPanel has status == EFFECTIVE"
          - "the governing panel's flood_zone != X"
          - "the governing panel's base_flood_elevation_ft is not null"
        side_effects:
          - "determined_zone / determined_bfe_ft snapshotted from the property's EFFECTIVE FirmPanel"
          - "freeboard_applied_ft = Community.freeboard_ft snapshot"
          - "required_lowest_floor_elevation_ft = calculations.required_lowest_floor_elevation"

      - from: REVISION_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /floodplain/permits/{permitId}/submit"
        actor: PropertyOwner
        preconditions:
          - "status == REVISION_REQUIRED"
          - "the acting X-User-ID equals the permit's property_id"
          - "revision_round < MAX_REVISION_ROUNDS"
          - "the property's FirmPanel has status == EFFECTIVE"
          - "the governing panel's base_flood_elevation_ft is not null"
        side_effects:
          - "revision_round += 1"
          - "determined_zone / determined_bfe_ft / freeboard_applied_ft re-snapshotted from current community and panel state"
          - "required_lowest_floor_elevation_ft recomputed"
        note: "Revision loop — cyclic shape."

      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /floodplain/permits/{permitId}/review with decision = REQUEST_REVISION"
        actor: FloodplainAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "revision_round < MAX_REVISION_ROUNDS"
        side_effects: ["status -> REVISION_REQUIRED"]

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /floodplain/permits/{permitId}/review with decision = APPROVE"
        actor: FloodplainAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "proposed_lowest_floor_elevation_ft >= required_lowest_floor_elevation_ft"
          - "when project_type IN {IMPROVEMENT, REPAIR} and single-event ratio of declared_project_cost_usd against Structure.market_value_usd >= SI_THRESHOLD_PCT, the Structure must have a DeterminationCase whose status IN {DETERMINED, APPEAL_SUSTAINED, APPEAL_DENIED}"
        side_effects:
          - "status -> APPROVED"
          - "si_determination_case_id = id of the newest resolved DeterminationCase for the structure (order by determined_at DESC, then created_at DESC), null when none was required"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /floodplain/permits/{permitId}/review with decision = DENY"
        actor: FloodplainAdministrator
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: ["status -> DENIED (terminal)"]

      - from: APPROVED
        to: ISSUED
        trigger: "POST /floodplain/permits/{permitId}/issue"
        actor: FloodplainAdministrator
        preconditions:
          - "status == APPROVED"
          - "Community.compliance_posture != SUSPENDED"
          - "Community.compliance_posture != ON_PROBATION when the Structure's substantial_status != NONE"
        side_effects:
          - "status -> ISSUED; issued_at = current logical clock"
          - "expires_at = issued_at + PERMIT_VALIDITY_DAYS"

      - from: APPROVED
        to: REVISION_REQUIRED
        trigger: "system: Structure.substantial_status changed, or governing FirmPanel replaced"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the recomputed required_lowest_floor_elevation_ft > proposed_lowest_floor_elevation_ft, or the governing panel's determined_bfe_ft / determined_zone changed"
        side_effects:
          - "required_lowest_floor_elevation_ft recomputed"
          - "status -> REVISION_REQUIRED"
        note: "Cascade A hop 4 and Cascade C hop 3 both land here."

      - from: ISSUED
        to: CLOSED_COMPLIANT
        trigger: "POST /floodplain/permits/{permitId}/close"
        actor: FloodplainAdministrator
        preconditions:
          - "status == ISSUED"
          - "an ElevationCertificate exists with permit_id == this permit, certificate_type == FINISHED_CONSTRUCTION and status == ACCEPTED"
        side_effects:
          - "status -> CLOSED_COMPLIANT"
          - "when project_type IN {IMPROVEMENT, REPAIR}: append ImprovementRecord {record_type: IMPROVEMENT, source: PERMIT_CLOSEOUT, permit_id: this permit, cost_usd: declared_project_cost_usd, event_date: current logical clock, claim_paid_amount_usd: 0}"
          - "the appended record triggers calculations.structure_improvement_aggregates and the auto-case rule below"

      - from: APPROVED
        to: REVOKED
        trigger: "system: RemediationOrder default escalated a Violation naming this permit"
        actor: system
        preconditions: ["status IN {APPROVED, ISSUED}", "a Violation with permit_id == this permit reached status ESCALATED"]
        side_effects: ["status -> REVOKED (terminal)"]

      - from: ISSUED
        to: REVOKED
        trigger: "system: RemediationOrder default escalated a Violation naming this permit"
        actor: system
        preconditions: ["status IN {APPROVED, ISSUED}", "a Violation with permit_id == this permit reached status ESCALATED"]
        side_effects: ["status -> REVOKED (terminal); Cascade B hop 3b"]

  # ---------------------------------------------------- ElevationCertificate
  - entity: ElevationCertificate
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /floodplain/elevation-certificates/{certificateId}/review with decision = ACCEPT"
        actor: FloodplainAdministrator
        preconditions:
          - "status == SUBMITTED"
          - "structure_id == permit.structure_id"
          - "freeboard_margin_ft >= 0.0"
        side_effects:
          - "status -> ACCEPTED; accepted_at = current logical clock; retention_review_due_at = accepted_at + DOC_RETENTION_REVIEW_YEARS"
          - "every other ElevationCertificate of the same structure_id with status == ACCEPTED -> SUPERSEDED (order created_at ASC)"
          - "when certificate_type == FINISHED_CONSTRUCTION: Structure.lowest_floor_elevation_ft = normalized_lowest_floor_ft and Structure.compliance_status -> COMPLIANT unless the structure has a Violation with status IN {OPEN, ORDER_ISSUED, ESCALATED}"

      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /floodplain/elevation-certificates/{certificateId}/review with decision = DEFICIENT"
        actor: FloodplainAdministrator
        preconditions: ["status == SUBMITTED"]
        side_effects: ["status -> DEFICIENT; deficiency_codes = supplied list"]

      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /floodplain/elevation-certificates/{certificateId}/amend"
        actor: PropertyOwner
        preconditions:
          - "status == DEFICIENT"
          - "the acting X-User-ID equals the certificate's permit.property_id"
        side_effects:
          - "status -> SUBMITTED; deficiency_codes = []"
          - "measured_lowest_floor_ft / measured_bfe_ft / datum / surveyor_license_no replaced by the amendment payload"
          - "normalized_lowest_floor_ft and freeboard_margin_ft recomputed"
        note: "Amendment loop — cyclic shape."

      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a newer certificate for the same structure was accepted, or the governing FirmPanel was replaced"
        actor: system
        preconditions: ["status == ACCEPTED"]
        side_effects: ["status -> SUPERSEDED (terminal)"]

  # ------------------------------------------------------- DeterminationCase
  - entity: DeterminationCase
    initial_state: OPEN
    terminal_states: [APPEAL_SUSTAINED, APPEAL_DENIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: DETERMINED
        trigger: "POST /floodplain/determination-cases/{caseId}/determine"
        actor: FloodplainAdministrator
        preconditions: ["status == OPEN"]
        side_effects:
          - "computed_ratio_pct = calculations.substantial_ratio (selected method); outcome = SUBSTANTIAL when computed_ratio_pct >= threshold_pct else NOT_SUBSTANTIAL"
          - "determined_by_user_id = acting X-User-ID; determined_at = current logical clock; appeal_deadline_at = determined_at + APPEAL_WINDOW_DAYS"
          - "when outcome == SUBSTANTIAL: Structure.substantial_status -> determination_type; when outcome == NOT_SUBSTANTIAL: Structure.substantial_status -> NONE"
          - "the Structure.substantial_status change re-runs calculations.required_lowest_floor_elevation for every DevelopmentPermit of that structure with status IN {UNDER_REVIEW, REVISION_REQUIRED, APPROVED} and may move APPROVED permits to REVISION_REQUIRED"

      - from: OPEN
        to: DETERMINED
        trigger: "system: ImprovementRecord appended with source == DISASTER_INSPECTION pushes cumulative_improvement_pct >= SI_THRESHOLD_PCT"
        actor: system
        preconditions: ["no DeterminationCase for the structure has status IN {OPEN, DETERMINED, APPEALED}"]
        side_effects:
          - "case is created directly in DETERMINED with method = CUMULATIVE, trigger_source = DISASTER_INSPECTION, determined_by_user_id = null"
          - "outcome / Structure.substantial_status / downstream permit recomputation exactly as in the manual determine transition"
        note: "Cascade A hop 3. Records from other sources create the case in OPEN instead."

      - from: DETERMINED
        to: APPEALED
        trigger: "POST /floodplain/determination-cases/{caseId}/appeal"
        actor: PropertyOwner
        preconditions:
          - "status == DETERMINED"
          - "the acting X-User-ID equals the structure's property_id"
          - "current logical clock <= appeal_deadline_at"
        side_effects: ["status -> APPEALED; appealed_at = current logical clock"]

      - from: APPEALED
        to: APPEAL_SUSTAINED
        trigger: "POST /floodplain/determination-cases/{caseId}/appeal-decision with decision = SUSTAIN"
        actor: AppealsBoardMember
        preconditions:
          - "status == APPEALED"
          - "the acting X-User-ID != determined_by_user_id"
        side_effects:
          - "status -> APPEAL_SUSTAINED (terminal); appeal_decided_by_user_id = acting X-User-ID"
          - "outcome -> NOT_SUBSTANTIAL; Structure.substantial_status -> NONE"
          - "required_lowest_floor_elevation_ft recomputed for every permit of the structure with status IN {UNDER_REVIEW, REVISION_REQUIRED, APPROVED}"
        note: "Branch 1 of the fork — compensates the determination's side effects."

      - from: APPEALED
        to: APPEAL_DENIED
        trigger: "POST /floodplain/determination-cases/{caseId}/appeal-decision with decision = DENY"
        actor: AppealsBoardMember
        preconditions:
          - "status == APPEALED"
          - "the acting X-User-ID != determined_by_user_id"
        side_effects:
          - "status -> APPEAL_DENIED (terminal); appeal_decided_by_user_id = acting X-User-ID"
          - "outcome and Structure.substantial_status are left exactly as the determination set them"
        note: "Branch 2 of the fork — no compensation; divergent side-effect set from SUSTAIN."

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /floodplain/determination-cases (supersede) or POST /floodplain/improvement-records (REVERSAL of the anchor record)"
        actor: FloodplainAdministrator
        preconditions: ["status == OPEN"]
        side_effects: ["status -> WITHDRAWN (terminal)"]

      - from: DETERMINED
        to: WITHDRAWN
        trigger: "POST /floodplain/determination-cases (supersede) or POST /floodplain/improvement-records (REVERSAL of the anchor record)"
        actor: FloodplainAdministrator
        preconditions: ["status == DETERMINED"]
        side_effects:
          - "status -> WITHDRAWN (terminal)"
          - "Structure.substantial_status -> NONE (compensates the determination)"

  # -------------------------------------------------- PostDisasterInspection
  - entity: PostDisasterInspection
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: ASSESSED
        trigger: "POST /floodplain/inspections/{inspectionId}/assess"
        actor: FloodplainAdministrator
        preconditions:
          - "status == SCHEDULED"
          - "current logical clock <= deadline_at"
        side_effects:
          - "damage_cost_usd / claim_paid_amount_usd recorded; market_value_at_inspection_usd = Structure.market_value_usd snapshot"
          - "damage_ratio_pct = round(damage_cost_usd / market_value_at_inspection_usd * 100, 2)"
          - "status -> ASSESSED; assessed_at = current logical clock"

      - from: ASSESSED
        to: FINALIZED
        trigger: "POST /floodplain/inspections/{inspectionId}/finalize"
        actor: FloodplainAdministrator
        preconditions: ["status == ASSESSED"]
        side_effects:
          - "status -> FINALIZED; finalized_at = current logical clock"
          - "CASCADE A hop 1: append ImprovementRecord {record_type: DAMAGE, source: DISASTER_INSPECTION, inspection_id: this inspection, cost_usd: damage_cost_usd, claim_paid_amount_usd: claim_paid_amount_usd, event_date: disaster_event_date}"
          - "CASCADE A hop 2: caused by hop 1, Structure.anchor_record_id / cumulative_counted_cost_usd / cumulative_improvement_pct / single_event_improvement_pct recomputed, and Property repetitive-loss fields recomputed"
          - "CASCADE A hop 3: caused by hop 2, when cumulative_improvement_pct >= SI_THRESHOLD_PCT and no case is in {OPEN, DETERMINED, APPEALED}, a DeterminationCase is created directly in DETERMINED (method CUMULATIVE) and Structure.substantial_status -> SUBSTANTIAL_DAMAGE"
          - "CASCADE A hop 4: caused by hop 3, every DevelopmentPermit of the structure with status IN {UNDER_REVIEW, REVISION_REQUIRED, APPROVED} has required_lowest_floor_elevation_ft recomputed (+ SI_ADDITIONAL_FREEBOARD_FT) and APPROVED permits whose proposed elevation now falls short -> REVISION_REQUIRED"
          - "CASCADE A hop 5: caused by hop 2, when Property.repetitive_loss_status changes and the property has repetitive_loss_area_id set, that RepetitiveLossArea.analysis_status -> STALE"

  # ---------------------------------------------------------------- Violation
  - entity: Violation
    initial_state: OPEN
    terminal_states: [REMEDIATED, CLOSED_UNRESOLVED]
    transitions:
      - from: OPEN
        to: ORDER_ISSUED
        trigger: "POST /floodplain/remediation-orders"
        actor: FloodplainAdministrator
        preconditions:
          - "status == OPEN"
          - "no RemediationOrder for this violation has status IN {ISSUED, EXTENDED}"
        side_effects:
          - "status -> ORDER_ISSUED"
          - "Community.sanction_risk_points and compliance_posture recomputed (weight unchanged; the transition keeps the violation inside the counted set)"

      - from: ORDER_ISSUED
        to: ESCALATED
        trigger: "POST /floodplain/remediation-orders/{orderId}/resolve with resolution = DEFAULTED"
        actor: FloodplainAdministrator
        preconditions: ["status == ORDER_ISSUED", "the order's status IN {ISSUED, EXTENDED}", "current logical clock > order.deadline_at"]
        side_effects:
          - "CASCADE B hop 2: status -> ESCALATED"
          - "CASCADE B hop 3a: caused by hop 2, Community.sanction_risk_points recomputed (the DEFAULTED order now contributes DEFAULTED_ORDER_PENALTY_POINTS) and compliance_posture re-derived"
          - "CASCADE B hop 3b: caused by hop 2, when permit_id is set and that permit's status IN {APPROVED, ISSUED}, the permit -> REVOKED"
          - "CASCADE B hop 4: caused by hop 3a, when compliance_posture becomes SUSPENDED every CrsCycle of the community with status IN {OPEN, SUBMITTED, UNDER_VERIFICATION} -> RETROGRADED and Community.crs_class -> 10"

      - from: OPEN
        to: REMEDIATED
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = REMEDIATED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {OPEN, ORDER_ISSUED, ESCALATED}"]
        side_effects:
          - "status -> REMEDIATED (terminal); resolved_at = current logical clock; sanction_points_contributed -> 0"
          - "every RemediationOrder of this violation with status IN {ISSUED, EXTENDED} -> SATISFIED (order created_at ASC)"
          - "Community.sanction_risk_points and compliance_posture recomputed"
          - "when violation_type == ELEVATION_DEFICIENT and structure_id is set and the structure has no other Violation with status IN {OPEN, ORDER_ISSUED, ESCALATED}: Structure.compliance_status -> COMPLIANT when lowest_floor_elevation_ft is not null, else PENDING_CERTIFICATE"

      - from: ORDER_ISSUED
        to: REMEDIATED
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = REMEDIATED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {OPEN, ORDER_ISSUED, ESCALATED}"]
        side_effects: ["identical to the OPEN -> REMEDIATED side-effect list"]

      - from: ESCALATED
        to: REMEDIATED
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = REMEDIATED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {OPEN, ORDER_ISSUED, ESCALATED}"]
        side_effects:
          - "identical to the OPEN -> REMEDIATED side-effect list"
          - "the DEFAULTED order stops contributing DEFAULTED_ORDER_PENALTY_POINTS because its violation is no longer ESCALATED"
        note: "Revert edge — the escalation is compensated and sanction_risk_points returns to its pre-violation value."

      - from: OPEN
        to: CLOSED_UNRESOLVED
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = CLOSED_UNRESOLVED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {OPEN, ORDER_ISSUED, ESCALATED}"]
        side_effects:
          - "status -> CLOSED_UNRESOLVED (terminal); resolved_at = current logical clock; sanction_points_contributed -> 0"
          - "Community.sanction_risk_points and compliance_posture recomputed"

      - from: ESCALATED
        to: CLOSED_UNRESOLVED
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = CLOSED_UNRESOLVED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {OPEN, ORDER_ISSUED, ESCALATED}"]
        side_effects: ["identical to the OPEN -> CLOSED_UNRESOLVED side-effect list"]

  # ---------------------------------------------------------- RemediationOrder
  - entity: RemediationOrder
    initial_state: ISSUED
    terminal_states: [SATISFIED, DEFAULTED]
    transitions:
      - from: ISSUED
        to: EXTENDED
        trigger: "POST /floodplain/remediation-orders/{orderId}/extend"
        actor: FloodplainAdministrator
        preconditions: ["status IN {ISSUED, EXTENDED}", "extension_count < MAX_ORDER_EXTENSIONS", "the new deadline_at is strictly after the current deadline_at"]
        side_effects: ["status -> EXTENDED; extension_count += 1; deadline_at = supplied new deadline"]

      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /floodplain/remediation-orders/{orderId}/extend"
        actor: FloodplainAdministrator
        preconditions: ["status IN {ISSUED, EXTENDED}", "extension_count < MAX_ORDER_EXTENSIONS", "the new deadline_at is strictly after the current deadline_at"]
        side_effects: ["extension_count += 1; deadline_at = supplied new deadline"]
        note: "Self-loop, bounded by MAX_ORDER_EXTENSIONS."

      - from: ISSUED
        to: SATISFIED
        trigger: "POST /floodplain/remediation-orders/{orderId}/resolve with resolution = SATISFIED, or system when the violation is remediated"
        actor: FloodplainAdministrator
        preconditions: ["status IN {ISSUED, EXTENDED}"]
        side_effects: ["status -> SATISFIED (terminal); resolved_at = current logical clock", "Violation -> REMEDIATED when it is still in {OPEN, ORDER_ISSUED}", "Community.sanction_risk_points and compliance_posture recomputed"]

      - from: EXTENDED
        to: SATISFIED
        trigger: "POST /floodplain/remediation-orders/{orderId}/resolve with resolution = SATISFIED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {ISSUED, EXTENDED}"]
        side_effects: ["identical to the ISSUED -> SATISFIED side-effect list"]

      - from: ISSUED
        to: DEFAULTED
        trigger: "POST /floodplain/remediation-orders/{orderId}/resolve with resolution = DEFAULTED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {ISSUED, EXTENDED}", "current logical clock > deadline_at"]
        side_effects:
          - "CASCADE B hop 1: status -> DEFAULTED (terminal); resolved_at = current logical clock"
          - "the Violation transition ORDER_ISSUED -> ESCALATED fires with the full Cascade B chain"

      - from: EXTENDED
        to: DEFAULTED
        trigger: "POST /floodplain/remediation-orders/{orderId}/resolve with resolution = DEFAULTED"
        actor: FloodplainAdministrator
        preconditions: ["status IN {ISSUED, EXTENDED}", "current logical clock > deadline_at"]
        side_effects: ["identical to the ISSUED -> DEFAULTED side-effect list"]

  # -------------------------------------------------------- RepetitiveLossArea
  # Parallel dimensions: status (designation) x analysis_status (analysis) x
  # outreach_status (outreach). Each axis advances independently.
  - entity: RepetitiveLossArea
    initial_state: DRAFT
    terminal_states: [DESIGNATED]
    transitions:
      - from: DRAFT
        to: DESIGNATED
        trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/designate"
        actor: FloodplainAdministrator
        preconditions: ["status == DRAFT", "analysis_status == ANALYZED"]
        side_effects: ["status -> DESIGNATED (terminal on the designation axis)"]

      - from: PENDING_ANALYSIS
        to: ANALYZED
        trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/analyze"
        actor: FloodplainAdministrator
        preconditions: ["analysis_status IN {PENDING_ANALYSIS, STALE}"]
        side_effects:
          - "every Property with community_id == this.community_id and mapped_area_code == this.area_code gets repetitive_loss_area_id = this.id (order created_at ASC)"
          - "property_count / rl_property_count recomputed; analysis_status -> ANALYZED; analyzed_at = current logical clock"
        note: "analysis axis"

      - from: STALE
        to: ANALYZED
        trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/analyze"
        actor: FloodplainAdministrator
        preconditions: ["analysis_status IN {PENDING_ANALYSIS, STALE}"]
        side_effects: ["identical to the PENDING_ANALYSIS -> ANALYZED side-effect list"]
        note: "analysis axis, re-analysis loop"

      - from: ANALYZED
        to: STALE
        trigger: "system: a linked Property's repetitive_loss_status changed (Cascade A hop 5)"
        actor: system
        preconditions: ["analysis_status == ANALYZED"]
        side_effects: ["analysis_status -> STALE"]
        note: "analysis axis"

      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/outreach"
        actor: FloodplainAdministrator
        preconditions:
          - "status == DESIGNATED"
          - "analysis_status == ANALYZED"
          - "outreach_status IN {NOT_STARTED, COMPLETED, INSUFFICIENT}"
          - "the referenced CrsCycle belongs to the same community and has status == OPEN"
          - "target_property_count >= property_count"
        side_effects:
          - "outreach_status -> IN_PROGRESS; delivered_count -> 0; coverage_pct -> 0"
          - "target_property_count / outreach_cycle_year / outreach_crs_cycle_id snapshotted from the payload and the referenced cycle"
        note: "outreach axis"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/complete-outreach"
        actor: FloodplainAdministrator
        preconditions: ["outreach_status == IN_PROGRESS", "coverage_pct >= OUTREACH_PARTIAL_CREDIT_PCT"]
        side_effects: ["outreach_status -> COMPLETED"]
        note: "outreach axis"

      - from: IN_PROGRESS
        to: INSUFFICIENT
        trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/complete-outreach"
        actor: FloodplainAdministrator
        preconditions: ["outreach_status == IN_PROGRESS", "coverage_pct < OUTREACH_PARTIAL_CREDIT_PCT"]
        side_effects: ["outreach_status -> INSUFFICIENT"]
        note: "outreach axis, divergent branch"

  # ------------------------------------------------------------ HigherStandard
  - entity: HigherStandard
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /floodplain/higher-standards/{standardId}/submit"
        actor: FloodplainAdministrator
        preconditions: ["documentation_status == DRAFT"]
        side_effects:
          - "documentation_status -> SUBMITTED; submitted_at = current logical clock"
          - "Community.crs_credit_points_claimed recomputed"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /floodplain/higher-standards/{standardId}/verify with decision = VERIFY"
        actor: StateNfipCoordinator
        preconditions:
          - "documentation_status == SUBMITTED"
          - "max_points_allowed >= 1 (the live community/RLA/violation state supports the activity)"
        side_effects:
          - "max_points_allowed recomputed; verified_points = min(claimed_points, max_points_allowed)"
          - "documentation_status -> VERIFIED; verified_at = current logical clock; doc_expires_at = verified_at + DOC_CYCLE_YEARS"
          - "Community.crs_credit_points_verified recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /floodplain/higher-standards/{standardId}/verify with decision = REJECT"
        actor: StateNfipCoordinator
        preconditions: ["documentation_status == SUBMITTED"]
        side_effects:
          - "documentation_status -> REJECTED; rejection_reason recorded; verified_points -> 0"
          - "Community.crs_credit_points_claimed recomputed"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system: PATCH /floodplain/communities/{communityId} lowered the standard below its verified level, POST /floodplain/higher-standards superseded it, or certification found doc_expires_at in the past"
        actor: system
        preconditions: ["documentation_status == VERIFIED"]
        side_effects:
          - "documentation_status -> EXPIRED; verified_points -> 0"
          - "Community.crs_credit_points_verified and crs_class recomputed"

      - from: DRAFT
        to: EXPIRED
        trigger: "POST /floodplain/higher-standards (supersede of the same activity_code and documentation_cycle_year)"
        actor: FloodplainAdministrator
        preconditions: ["documentation_status IN {DRAFT, REJECTED}"]
        side_effects: ["documentation_status -> EXPIRED (terminal)"]

      - from: REJECTED
        to: EXPIRED
        trigger: "POST /floodplain/higher-standards (supersede of the same activity_code and documentation_cycle_year)"
        actor: FloodplainAdministrator
        preconditions: ["documentation_status IN {DRAFT, REJECTED}"]
        side_effects: ["documentation_status -> EXPIRED (terminal)"]

  # ------------------------------------------------------------------ CrsCycle
  - entity: CrsCycle
    initial_state: OPEN
    terminal_states: [CERTIFIED, RETROGRADED, LAPSED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /floodplain/crs-cycles/{cycleId}/submit"
        actor: FloodplainAdministrator
        preconditions:
          - "status == OPEN"
          - "current logical clock <= due_at"
          - "at least one HigherStandard of the community has documentation_status IN {SUBMITTED, VERIFIED}"
        side_effects:
          - "status -> SUBMITTED; submitted_at = current logical clock"
          - "total_claimed_points = Community.crs_credit_points_claimed; prior_class = Community.crs_class"
          - "provisional_class = calculations.crs_class_determination (CLAIMED variant)"
          - "verification_visit_required recomputed"

      - from: SUBMITTED
        to: UNDER_VERIFICATION
        trigger: "POST /floodplain/crs-cycles/{cycleId}/verify-visit"
        actor: StateNfipCoordinator
        preconditions: ["status == SUBMITTED"]
        side_effects: ["status -> UNDER_VERIFICATION; verification_visit_completed_at = current logical clock"]

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /floodplain/crs-cycles/{cycleId}/certify"
        actor: StateNfipCoordinator
        preconditions:
          - "status IN {SUBMITTED, UNDER_VERIFICATION}"
          - "verification_visit_required == false OR verification_visit_completed_at is not null"
          - "no HigherStandard of the community has documentation_status == SUBMITTED"
        side_effects:
          - "expiry sweep: every HigherStandard of the community with documentation_status == VERIFIED and doc_expires_at <= current logical clock -> EXPIRED (order created_at ASC), then Community.crs_credit_points_verified recomputed"
          - "total_verified_points = Community.crs_credit_points_verified"
          - "resulting_class = calculations.crs_class_determination (VERIFIED variant); Community.crs_class -> resulting_class"
          - "status -> CERTIFIED (terminal)"

      - from: UNDER_VERIFICATION
        to: CERTIFIED
        trigger: "POST /floodplain/crs-cycles/{cycleId}/certify"
        actor: StateNfipCoordinator
        preconditions: ["identical to the SUBMITTED -> CERTIFIED precondition list"]
        side_effects: ["identical to the SUBMITTED -> CERTIFIED side-effect list"]

      - from: OPEN
        to: LAPSED
        trigger: "POST /floodplain/crs-cycles/{cycleId}/lapse"
        actor: StateNfipCoordinator
        preconditions: ["status == OPEN", "current logical clock > due_at"]
        side_effects: ["status -> LAPSED (terminal); Community.crs_class -> 10"]

      - from: OPEN
        to: RETROGRADED
        trigger: "system: Community.compliance_posture became SUSPENDED (Cascade B hop 4)"
        actor: system
        preconditions: ["status IN {OPEN, SUBMITTED, UNDER_VERIFICATION}"]
        side_effects: ["status -> RETROGRADED (terminal); Community.crs_class -> 10"]

      - from: SUBMITTED
        to: RETROGRADED
        trigger: "system: Community.compliance_posture became SUSPENDED (Cascade B hop 4)"
        actor: system
        preconditions: ["status IN {OPEN, SUBMITTED, UNDER_VERIFICATION}"]
        side_effects: ["identical to the OPEN -> RETROGRADED side-effect list"]

      - from: UNDER_VERIFICATION
        to: RETROGRADED
        trigger: "system: Community.compliance_posture became SUSPENDED (Cascade B hop 4)"
        actor: system
        preconditions: ["status IN {OPEN, SUBMITTED, UNDER_VERIFICATION}"]
        side_effects: ["identical to the OPEN -> RETROGRADED side-effect list"]

  # ----------------------------------------------------------------- Structure
  # Parallel dimensions on one row: compliance_status (certificate/enforcement
  # axis) x substantial_status (determination axis). Neither axis reads the other.
  - entity: Structure
    initial_state: PENDING_CERTIFICATE
    terminal_states: []
    transitions:
      - from: PENDING_CERTIFICATE
        to: PRE_FIRM_EXISTING
        trigger: "POST /floodplain/structures with pre_firm = true"
        actor: FloodplainAdministrator
        preconditions: ["structure is being created"]
        side_effects: ["compliance_status = PRE_FIRM_EXISTING instead of PENDING_CERTIFICATE"]
        note: "compliance axis — initial-state selection"

      - from: PENDING_CERTIFICATE
        to: COMPLIANT
        trigger: "POST /floodplain/elevation-certificates/{certificateId}/review with decision = ACCEPT (FINISHED_CONSTRUCTION)"
        actor: FloodplainAdministrator
        preconditions: ["the accepted certificate's certificate_type == FINISHED_CONSTRUCTION", "the structure has no Violation with status IN {OPEN, ORDER_ISSUED, ESCALATED}"]
        side_effects: ["compliance_status -> COMPLIANT; lowest_floor_elevation_ft = certificate.normalized_lowest_floor_ft"]
        note: "compliance axis"

      - from: COMPLIANT
        to: NON_COMPLIANT
        trigger: "POST /floodplain/violations with violation_type == ELEVATION_DEFICIENT"
        actor: FloodplainAdministrator
        preconditions: ["the violation names this structure"]
        side_effects: ["compliance_status -> NON_COMPLIANT"]
        note: "compliance axis"

      - from: PENDING_CERTIFICATE
        to: NON_COMPLIANT
        trigger: "POST /floodplain/violations with violation_type == ELEVATION_DEFICIENT"
        actor: FloodplainAdministrator
        preconditions: ["the violation names this structure"]
        side_effects: ["compliance_status -> NON_COMPLIANT"]
        note: "compliance axis"

      - from: NON_COMPLIANT
        to: PENDING_CERTIFICATE
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = REMEDIATED"
        actor: FloodplainAdministrator
        preconditions: ["no other Violation of the structure has status IN {OPEN, ORDER_ISSUED, ESCALATED}", "lowest_floor_elevation_ft is null"]
        side_effects: ["compliance_status -> PENDING_CERTIFICATE"]
        note: "compliance axis, revert edge"

      - from: NON_COMPLIANT
        to: COMPLIANT
        trigger: "POST /floodplain/violations/{violationId}/resolve with resolution = REMEDIATED"
        actor: FloodplainAdministrator
        preconditions: ["no other Violation of the structure has status IN {OPEN, ORDER_ISSUED, ESCALATED}", "lowest_floor_elevation_ft is not null"]
        side_effects: ["compliance_status -> COMPLIANT"]
        note: "compliance axis, revert edge"

      - from: COMPLIANT
        to: PENDING_CERTIFICATE
        trigger: "system: the governing FirmPanel was replaced (Cascade C hop 4)"
        actor: system
        preconditions: ["an ACCEPTED certificate of this structure was superseded by the map revision"]
        side_effects: ["lowest_floor_elevation_ft -> null; compliance_status -> PENDING_CERTIFICATE"]
        note: "compliance axis"

      - from: NONE
        to: SUBSTANTIAL_IMPROVEMENT
        trigger: "DeterminationCase determined SUBSTANTIAL with determination_type == SUBSTANTIAL_IMPROVEMENT"
        actor: FloodplainAdministrator
        preconditions: ["the case's structure_id is this structure"]
        side_effects: ["substantial_status -> SUBSTANTIAL_IMPROVEMENT; permits of the structure recompute required_lowest_floor_elevation_ft"]
        note: "determination axis — independent of compliance_status"

      - from: NONE
        to: SUBSTANTIAL_DAMAGE
        trigger: "DeterminationCase determined SUBSTANTIAL with determination_type == SUBSTANTIAL_DAMAGE (manual or Cascade A hop 3)"
        actor: FloodplainAdministrator
        preconditions: ["the case's structure_id is this structure"]
        side_effects: ["substantial_status -> SUBSTANTIAL_DAMAGE; permits of the structure recompute required_lowest_floor_elevation_ft"]
        note: "determination axis"

      - from: SUBSTANTIAL_DAMAGE
        to: NONE
        trigger: "APPEAL_SUSTAINED, case WITHDRAWN, or a determination whose outcome is NOT_SUBSTANTIAL"
        actor: AppealsBoardMember
        preconditions: ["the case's structure_id is this structure"]
        side_effects: ["substantial_status -> NONE; permits of the structure recompute required_lowest_floor_elevation_ft"]
        note: "determination axis, revert edge"

      - from: SUBSTANTIAL_IMPROVEMENT
        to: NONE
        trigger: "APPEAL_SUSTAINED, case WITHDRAWN, or a determination whose outcome is NOT_SUBSTANTIAL"
        actor: AppealsBoardMember
        preconditions: ["the case's structure_id is this structure"]
        side_effects: ["substantial_status -> NONE; permits of the structure recompute required_lowest_floor_elevation_ft"]
        note: "determination axis, revert edge"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: determination-case-create-stale-structure
    parent_entity: Structure
    write_endpoint: "POST /floodplain/determination-cases"
    occ_field: "expected_structure_version"
    description: |
      Opening a DeterminationCase against a Structure whose version has advanced
      since the client last read it is rejected. A new case legitimately
      supersedes any prior case in {OPEN, DETERMINED} for that structure and
      reverts substantial_status, so a second create carrying an outdated
      structure version would silently discard a determination made against
      newer improvement-record data.
    error_id: ERR_STALE_STRUCTURE_VERSION
    http_status: 412

  - rule_id: higher-standard-create-stale-community
    parent_entity: Community
    write_endpoint: "POST /floodplain/higher-standards"
    occ_field: "expected_community_version"
    description: |
      Creating a HigherStandard submission for an activity_code and
      documentation_cycle_year that already has a DRAFT or REJECTED submission
      supersedes that submission (it becomes EXPIRED). A create carrying a
      Community version older than the current one is rejected, because the
      claimed points are only meaningful against the freeboard and cumulative
      standards recorded on the community at the version the client observed.
    error_id: ERR_STALE_COMMUNITY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: structure_improvement_aggregates
    trigger: "Every ImprovementRecord append (POST /floodplain/improvement-records, permit close, inspection finalize) and every PATCH /floodplain/structures/{structureId} that changes market_value_usd"
    algorithm: chronological
    formula: |
      # --- anchor selection (deterministic, no random fields) ---
      counted = [ r for r in ImprovementRecord
                  if r.structure_id == structure.id
                  and r.counted_in_cumulative == true
                  and r.reversed == false ]
      if counted is empty:
          structure.anchor_record_id            = null
          structure.cumulative_counted_cost_usd = 0
          structure.cumulative_improvement_pct  = 0.00
          structure.single_event_improvement_pct = 0.00
          return
      # sort key: event_date DESC, then created_at DESC (created_at is the only
      # sanctioned common-field fallback; `id` is never used for ordering)
      anchor = sort(counted, key=(event_date DESC, created_at DESC))[0]
      structure.anchor_record_id = anchor.id

      # --- cumulative window: CLOSED on both ends ---
      P = community.cumulative_period_years
      window_start = anchor.event_date minus P calendar years   # Feb 29 -> Feb 28
      window_end   = anchor.event_date
      in_window = [ r for r in counted
                    if r.event_date >= window_start
                    and r.event_date <= window_end ]

      structure.cumulative_counted_cost_usd = sum(r.cost_usd for r in in_window)
      denom = anchor.market_value_at_event_usd
      structure.cumulative_improvement_pct   = round(structure.cumulative_counted_cost_usd / denom * 100, 2)
      structure.single_event_improvement_pct = round(anchor.cost_usd / denom * 100, 2)
    input_set: |
      Only ImprovementRecord rows of the structure with counted_in_cumulative == true
      and reversed == false. Records with record_type == REVERSAL, with
      is_code_compliance_only == true, or with cost_usd < MIN_COUNTED_COST_USD are
      excluded (counted_in_cumulative == false). When cumulative_period_years == 0
      the window collapses to [anchor.event_date, anchor.event_date] so only records
      sharing the anchor's exact event_date are summed.
    constants:
      MIN_COUNTED_COST_USD: 500.00
    precision: "cost sums exact to the cent; percentages 2 decimal places, round_half_up"

  - name: substantial_ratio
    trigger: "DeterminationCase determination (POST /floodplain/determination-cases/{caseId}/determine) and Cascade A hop 3 auto-determination"
    algorithm: threshold
    formula: |
      if case.anchor_record_id is null:
          case.computed_ratio_pct = 0.00          # empty-ledger edge, never a division by zero
      elif case.method == SINGLE_EVENT:
          case.computed_ratio_pct = structure.single_event_improvement_pct
      else:  # CUMULATIVE
          case.computed_ratio_pct = structure.cumulative_improvement_pct
      case.threshold_pct = SI_THRESHOLD_PCT
      case.outcome = SUBSTANTIAL if case.computed_ratio_pct >= case.threshold_pct
                     else NOT_SUBSTANTIAL
    input_set: "The aggregates produced by structure_improvement_aggregates as of the determination instant; the case's anchor_record_id was snapshotted at case creation and is not re-anchored at determination time."
    constants:
      SI_THRESHOLD_PCT: 50.00
    precision: "2 decimal places, round_half_up; comparison is inclusive (>=)"
    variants:
      - name: single_event
        when: "case.method == SINGLE_EVENT — the classic per-permit test applied to the anchor event alone"
        difference: "Denominator identical, numerator is only anchor.cost_usd; earlier work inside the look-back window is ignored, so the same ledger can yield NOT_SUBSTANTIAL."
      - name: cumulative
        when: "case.method == CUMULATIVE — the adopted higher standard that aggregates the look-back window"
        difference: "Numerator sums every counted record inside the closed window [anchor.event_date - cumulative_period_years, anchor.event_date], so the same ledger can yield SUBSTANTIAL."

  - name: required_lowest_floor_elevation
    trigger: "DevelopmentPermit submit / resubmit, Structure.substantial_status change, and map-revision Cascade C hop 3"
    algorithm: constraint_propagation
    formula: |
      # (a) zone-dependent base
      if permit.determined_zone in {A, AE, VE}:
          base = permit.determined_bfe_ft
      elif permit.determined_zone == AO:
          base = structure.highest_adjacent_grade_ft + permit.determined_bfe_ft   # AO stores DEPTH
      # (b) freeboard is the larger of the community standard and the zone floor
      freeboard = max(permit.freeboard_applied_ft, ZONE_MIN_FREEBOARD_FT[permit.determined_zone])
      # (c) substantially improved / damaged structures carry extra freeboard
      si_bump = SI_ADDITIONAL_FREEBOARD_FT if structure.substantial_status != NONE else 0.0
      # (d) dry-floodproofing credit applies to NON_RESIDENTIAL only; requesting it
      #     on any other use is recorded but grants nothing
      fp_credit = FLOODPROOFING_CREDIT_FT if (permit.floodproofing_requested == true
                                              and structure.structure_use == NON_RESIDENTIAL)
                  else 0.0
      permit.required_lowest_floor_elevation_ft = round(base + freeboard + si_bump - fp_credit, 1)
    input_set: "Snapshots on the permit (determined_zone, determined_bfe_ft, freeboard_applied_ft) plus live Structure fields (structure_use, highest_adjacent_grade_ft, substantial_status). Community.freeboard_ft changes after submit never reach an existing permit — only freeboard_applied_ft is read."
    constants:
      ZONE_MIN_FREEBOARD_FT: { A: 1.0, AE: 1.0, AO: 1.0, VE: 2.0 }
      SI_ADDITIONAL_FREEBOARD_FT: 0.5
      FLOODPROOFING_CREDIT_FT: 1.0
    precision: "1 decimal place, round_half_up, applied once to the final sum"

  - name: certificate_datum_normalization
    trigger: "ElevationCertificate creation and amendment, and any recomputation of the permit's required elevation while the certificate is SUBMITTED"
    algorithm: threshold
    formula: |
      normalized = round(certificate.measured_lowest_floor_ft + DATUM_OFFSET_FT[certificate.datum], 1)
      certificate.normalized_lowest_floor_ft = normalized
      certificate.freeboard_margin_ft = round(normalized - permit.required_lowest_floor_elevation_ft, 1)
      accepted_is_allowed = certificate.freeboard_margin_ft >= 0.0
    input_set: "The certificate's own measurements plus the current required_lowest_floor_elevation_ft of its permit. The datum offset is applied before rounding; the difference is rounded a second time so the margin is always a single-decimal value."
    constants:
      DATUM_OFFSET_FT: { NAVD88: 0.0, NGVD29: -0.85 }
    precision: "1 decimal place, round_half_up; the offset is added first, then rounded, then subtracted, then rounded again (order is fixed)"

  - name: repetitive_loss_classification
    trigger: "Every ImprovementRecord append or reversal touching a Structure of the property, and every RepetitiveLossArea analysis"
    algorithm: interval_merge
    formula: |
      claims = [ r for r in ImprovementRecord
                 if r.record_type == DAMAGE
                 and r.reversed == false
                 and r.claim_paid_amount_usd >= RL_CLAIM_MIN_PAID_USD
                 and r.structure_id in structures_of(property) ]
      claims = sort(claims, key=(event_date ASC, created_at ASC))
      property.qualifying_claim_count   = count(claims)
      property.cumulative_claim_paid_usd = sum(c.claim_paid_amount_usd for c in claims)
      # rolling closed window anchored on each claim
      best = 0
      for anchor in claims:
          w_end = anchor.event_date plus RL_WINDOW_YEARS calendar years
          n = count(c for c in claims if c.event_date >= anchor.event_date
                                      and c.event_date <= w_end)
          best = max(best, n)
      property.max_window_claim_count = best
      newest = claims[-1] if claims else null
      if best >= RL_SEVERE_CLAIM_COUNT
         or (best >= RL_REPETITIVE_CLAIM_COUNT and newest is not null
             and property.cumulative_claim_paid_usd > newest.market_value_at_event_usd):
          property.repetitive_loss_status = SEVERE_REPETITIVE_LOSS
      elif best >= RL_REPETITIVE_CLAIM_COUNT:
          property.repetitive_loss_status = REPETITIVE_LOSS
      else:
          property.repetitive_loss_status = NONE
    input_set: "DAMAGE records only, not reversed, with claim_paid_amount_usd >= RL_CLAIM_MIN_PAID_USD (inclusive), across every Structure whose property_id is this property. Windows are closed on both ends; ties in event_date are ordered by created_at ASC."
    constants:
      RL_CLAIM_MIN_PAID_USD: 1000.00
      RL_WINDOW_YEARS: 10
      RL_REPETITIVE_CLAIM_COUNT: 2
      RL_SEVERE_CLAIM_COUNT: 4
    precision: "currency exact to the cent; counts are integers"

  - name: outreach_coverage_and_credit
    trigger: "POST /floodplain/repetitive-loss-areas/{areaId}/record-outreach-delivery, POST .../complete-outreach, and CRS credit evaluation of activity A330_OUTREACH"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — per-area coverage, rounded FIRST (this order is normative)
      area.coverage_pct = 0.00 if area.target_property_count == 0
                          else round(area.delivered_count / area.target_property_count * 100, 2)

      # STEP 2 — cycle score: arithmetic mean of the already-rounded per-area
      # values, then rounded again. Pooling the raw numerators and denominators
      # (sum(delivered)/sum(target)) is FORBIDDEN and produces a different score.
      scored = [ a for a in RepetitiveLossArea
                 if a.community_id == community.id
                 and a.status == DESIGNATED
                 and a.outreach_status in {COMPLETED, INSUFFICIENT}
                 and a.outreach_cycle_year == standard.documentation_cycle_year ]
      scored = sort(scored, key=(created_at ASC))
      cycle_outreach_score = 0.00 if scored is empty
                             else round(sum(a.coverage_pct for a in scored) / count(scored), 2)

      # STEP 3 — credit tier
      if   cycle_outreach_score >= OUTREACH_FULL_CREDIT_PCT:    a330_points = A330_FULL_POINTS
      elif cycle_outreach_score >= OUTREACH_PARTIAL_CREDIT_PCT: a330_points = A330_PARTIAL_POINTS
      else:                                                     a330_points = 0
    input_set: "Only DESIGNATED areas of the community whose outreach_status is COMPLETED or INSUFFICIENT and whose outreach_cycle_year equals the standard's documentation_cycle_year. IN_PROGRESS and NOT_STARTED areas are excluded from the mean."
    constants:
      OUTREACH_FULL_CREDIT_PCT: 90.00
      OUTREACH_PARTIAL_CREDIT_PCT: 75.00
      A330_FULL_POINTS: 50
      A330_PARTIAL_POINTS: 25
    precision: "2 decimal places, round_half_up, applied per area (step 1) and once more to the mean (step 2)"

  - name: higher_standard_credit
    trigger: "POST /floodplain/higher-standards/{standardId}/verify and PATCH /floodplain/communities/{communityId}"
    algorithm: tiered_pricing
    formula: |
      switch standard.activity_code:
        case A430_FREEBOARD:
            max_points = floor(A430_POINTS_PER_FOOT * min(community.freeboard_ft, A430_FREEBOARD_CAP_FT))
        case A430_CUMULATIVE_SI:
            max_points = A430_CUMULATIVE_POINTS if community.cumulative_period_years >= 10 else 0
        case A420_OPEN_SPACE:
            designated = count(RepetitiveLossArea where community_id == community.id
                                                   and status == DESIGNATED)
            max_points = min(A420_POINTS_PER_AREA * designated, A420_POINTS_CAP)
        case A510_HIGHER_STD_ENFORCEMENT:
            max_points = A510_POINTS if exists(Violation v where
                              v.property_id in properties_of(community)
                              and v.status == REMEDIATED) else 0
        case A330_OUTREACH:
            max_points = a330_points from calculations.outreach_coverage_and_credit
      standard.max_points_allowed = max_points
      standard.verified_points    = min(standard.claimed_points, max_points)   # only when VERIFIED
    input_set: "Live community configuration, DESIGNATED repetitive loss areas, REMEDIATED violations of the community's properties, and the cycle outreach score for the standard's documentation_cycle_year. Nothing is read from the CrsCycle."
    constants:
      A430_POINTS_PER_FOOT: 100
      A430_FREEBOARD_CAP_FT: 5.0
      A430_CUMULATIVE_POINTS: 90
      A420_POINTS_PER_AREA: 50
      A420_POINTS_CAP: 200
      A510_POINTS: 60
    precision: "integer points; floor() applied to the freeboard product"

  - name: crs_class_determination
    trigger: "POST /floodplain/crs-cycles/{cycleId}/submit (CLAIMED variant) and POST /floodplain/crs-cycles/{cycleId}/certify (VERIFIED variant)"
    algorithm: threshold
    formula: |
      # points argument depends on the variant (see variants below)
      raw_class = 10 - floor(points / CRS_POINTS_PER_CLASS)
      class     = max(raw_class, BEST_CRS_CLASS)
      if community.compliance_posture != GOOD_STANDING:
          class = WORST_CRS_CLASS          # sanction cap: no credit while on probation or suspended
    input_set: "CLAIMED variant reads Community.crs_credit_points_claimed (HigherStandard rows in {SUBMITTED, VERIFIED}); VERIFIED variant reads Community.crs_credit_points_verified (rows in {VERIFIED} only, after the certification expiry sweep)."
    constants:
      CRS_POINTS_PER_CLASS: 500
      BEST_CRS_CLASS: 1
      WORST_CRS_CLASS: 10
    precision: "integer class 1..10; the boundary is inclusive — exactly 500 points is class 9"
    variants:
      - name: claimed_provisional
        when: "cycle submission — written to CrsCycle.provisional_class, never to Community.crs_class"
        difference: "Uses claimed_points of SUBMITTED standards, which are unbounded by max_points_allowed, so the provisional class can be better than any class the community can actually be certified at."
      - name: verified_final
        when: "cycle certification — written to CrsCycle.resulting_class and to Community.crs_class"
        difference: "Uses verified_points = min(claimed, max_points_allowed) after the expiry sweep, so the same submission yields a numerically worse class than the provisional one whenever any claim was trimmed."

  - name: sanction_risk_and_posture
    trigger: "Violation create / resolve, RemediationOrder resolve, and HigherStandard verify or expiry of activity A510_HIGHER_STD_ENFORCEMENT"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is FIXED and single-pass. The probation credit depends on
      # the provisional tier and the tier depends on the points, so the order below
      # is what makes the value well defined; it is never iterated to a fixed point.
      # STEP 1 — raw points
      raw = sum(SEVERITY_WEIGHT[v.severity] for v in Violation
                where v.property_id in properties_of(community)
                and v.status in {OPEN, ORDER_ISSUED, ESCALATED})
          + DEFAULTED_ORDER_PENALTY_POINTS * count(o in RemediationOrder
                where o.status == DEFAULTED
                and o.violation.status == ESCALATED
                and o.violation.property_id in properties_of(community))
      # STEP 2 — provisional tier from raw
      provisional = tier(raw)
      # STEP 3 — credit is granted ONLY when the provisional tier is ON_PROBATION
      credit = A510_PROBATION_CREDIT_POINTS
               if provisional == ON_PROBATION
                  and exists(HigherStandard h where h.community_id == community.id
                             and h.activity_code == A510_HIGHER_STD_ENFORCEMENT
                             and h.documentation_status == VERIFIED)
               else 0
      # STEP 4 — net points and FINAL tier; step 2's provisional tier is discarded
      community.sanction_risk_points = max(raw - credit, 0)
      community.compliance_posture   = tier(community.sanction_risk_points)

      def tier(p):
          if p >= SUSPENSION_THRESHOLD_POINTS: return SUSPENDED
          if p >= PROBATION_THRESHOLD_POINTS:  return ON_PROBATION
          return GOOD_STANDING
    input_set: "Violations of every Property of the community whose status is OPEN, ORDER_ISSUED or ESCALATED (REMEDIATED and CLOSED_UNRESOLVED contribute nothing), plus DEFAULTED RemediationOrders whose violation is still ESCALATED."
    constants:
      SEVERITY_WEIGHT: { MINOR: 2, MAJOR: 6, CRITICAL: 12 }
      DEFAULTED_ORDER_PENALTY_POINTS: 5
      A510_PROBATION_CREDIT_POINTS: 4
      PROBATION_THRESHOLD_POINTS: 10
      SUSPENSION_THRESHOLD_POINTS: 25
    precision: "integer points; tier comparisons are inclusive (>=)"

  - name: derived_deadlines_and_loop_limits
    trigger: "Every write that stamps a derived deadline (permit issue, certificate acceptance, determination, credit verification, inspection sweep) and every bounded-loop precondition check"
    algorithm: threshold
    formula: |
      permit.expires_at                   = permit.issued_at + PERMIT_VALIDITY_DAYS days
      certificate.retention_review_due_at = certificate.accepted_at + DOC_RETENTION_REVIEW_YEARS calendar years
      case.appeal_deadline_at             = case.determined_at + APPEAL_WINDOW_DAYS days
      standard.doc_expires_at             = standard.verified_at + DOC_CYCLE_YEARS calendar years
      inspection.deadline_at              = sweep.event_date + sweep.inspection_window_days days
      # buffer-expanded sweep window used by validations priority 75
      sweep_window(candidate) = [ candidate.event_date - SWEEP_BUFFER_DAYS days,
                                  candidate.event_date + candidate.inspection_window_days
                                                       + SWEEP_BUFFER_DAYS days ]
      cycle.verification_visit_required   = (cycle.cycle_year % VERIFICATION_VISIT_YEAR_MODULUS == 0)
                                            or (cycle.provisional_class is not null
                                                and cycle.provisional_class < cycle.prior_class)
      # bounded loops (both are inclusive ceilings on the counter)
      permit revision loop  is allowed only while revision_round  < MAX_REVISION_ROUNDS
      order extension loop  is allowed only while extension_count < MAX_ORDER_EXTENSIONS
    input_set: "The logical clock at the stamping write plus the entity's own counters. Calendar-year arithmetic clamps Feb 29 to Feb 28; day arithmetic is exact."
    constants:
      PERMIT_VALIDITY_DAYS: 365
      DOC_RETENTION_REVIEW_YEARS: 5
      APPEAL_WINDOW_DAYS: 30
      DOC_CYCLE_YEARS: 5
      SWEEP_BUFFER_DAYS: 7
      VERIFICATION_VISIT_YEAR_MODULUS: 5
      MAX_REVISION_ROUNDS: 3
      MAX_ORDER_EXTENSIONS: 2
    precision: "whole days and whole calendar years; comparisons against a deadline are inclusive (<=) unless a §1.4 row says strictly after"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 10
    category: existence
    check: "Every path-segment resource exists, validated left to right: community, firm panel, property, structure, permit, certificate, determination case, inspection, violation, remediation order, repetitive loss area, higher standard, crs cycle"
    error_id: ERR_COMMUNITY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (each entity raises its own 404: ERR_FIRM_PANEL_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_STRUCTURE_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_DETERMINATION_CASE_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_VIOLATION_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_LOSS_AREA_NOT_FOUND, ERR_HIGHER_STANDARD_NOT_FOUND, ERR_CRS_CYCLE_NOT_FOUND)"

  - priority: 15
    category: auth
    check: "When the acting role is PropertyOwner, X-User-ID equals the Property.id that owns the target resource (permit.property_id, certificate.permit.property_id, determination case's structure.property_id)"
    error_id: ERR_NOT_PROPERTY_OWNER
    http_status: 403
    applies_to: "POST /floodplain/permits, POST /floodplain/permits/{permitId}/submit, POST /floodplain/elevation-certificates, POST /floodplain/elevation-certificates/{certificateId}/amend, POST /floodplain/determination-cases/{caseId}/appeal"

  - priority: 20
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, enum members valid, numbers within declared constraints, limit within [1,100], offset >= 0, market_value_usd > 0, claimed_points >= 1, cost_usd >= 0, cycle_end_date strictly after cycle_start_date, state_code exactly two uppercase letters"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 25
    category: existence
    check: "Every body-supplied foreign key resolves: community_id, firm_panel_id, property_id, structure_id, permit_id, violation_id, reverses_record_id, crs_cycle_id"
    error_id: ERR_IMPROVEMENT_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key (each raises the 404 of the missing entity; reverses_record_id raises ERR_IMPROVEMENT_RECORD_NOT_FOUND)"

  - priority: 28
    category: business_referential
    check: "structure_id belongs to property_id on permit creation; certificate structure_id equals permit.structure_id; reverses_record_id targets a record of the same structure_id; crs_cycle_id belongs to the area's community"
    error_id: ERR_CERTIFICATE_STRUCTURE_MISMATCH
    http_status: 422
    applies_to: "POST /floodplain/permits (ERR_STRUCTURE_PROPERTY_MISMATCH), POST /floodplain/elevation-certificates (ERR_CERTIFICATE_STRUCTURE_MISMATCH), POST /floodplain/improvement-records (ERR_REVERSAL_TARGET_INVALID), POST /floodplain/repetitive-loss-areas/{areaId}/outreach (ERR_CYCLE_COMMUNITY_MISMATCH)"

  - priority: 30
    category: state
    check: "OCC — expected_structure_version equals Structure.version; expected_community_version equals Community.version"
    error_id: ERR_STALE_STRUCTURE_VERSION
    http_status: 412
    applies_to: "POST /floodplain/determination-cases (ERR_STALE_STRUCTURE_VERSION), POST /floodplain/higher-standards (ERR_STALE_COMMUNITY_VERSION)"

  - priority: 40
    category: state
    check: "The target resource is in a state that permits this transition, per §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints (each raises its domain error: ERR_PANEL_NOT_PENDING, ERR_PERMIT_NOT_SUBMITTABLE, ERR_PERMIT_NOT_UNDER_REVIEW, ERR_PERMIT_NOT_APPROVED, ERR_PERMIT_NOT_ISSUED, ERR_CERTIFICATE_NOT_REVIEWABLE, ERR_CERTIFICATE_NOT_DEFICIENT, ERR_DETERMINATION_NOT_OPEN, ERR_DETERMINATION_NOT_DETERMINED, ERR_APPEAL_NOT_PENDING, ERR_INSPECTION_NOT_SCHEDULED, ERR_INSPECTION_NOT_ASSESSED, ERR_VIOLATION_NOT_ACTIONABLE, ERR_ORDER_NOT_ACTIONABLE, ERR_LOSS_AREA_NOT_DESIGNATED, ERR_OUTREACH_NOT_IN_PROGRESS, ERR_OUTREACH_ALREADY_IN_PROGRESS, ERR_STANDARD_NOT_DRAFT, ERR_STANDARD_NOT_SUBMITTED, ERR_CYCLE_NOT_OPEN, ERR_CYCLE_NOT_SUBMITTED, ERR_CYCLE_NOT_CERTIFIABLE)"

  - priority: 44
    category: state
    check: "Cross-entity state guard: the property's FirmPanel has status == EFFECTIVE when a property is created or a permit is submitted; the referenced CrsCycle has status == OPEN when outreach is launched; the RepetitiveLossArea has analysis_status == ANALYZED when outreach is launched or designation is requested"
    error_id: ERR_PANEL_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /floodplain/properties, POST /floodplain/permits/{permitId}/submit, POST /floodplain/repetitive-loss-areas/{areaId}/outreach (ERR_CYCLE_NOT_OPEN), POST /floodplain/repetitive-loss-areas/{areaId}/designate (ERR_LOSS_AREA_ANALYSIS_STALE), POST /floodplain/repetitive-loss-areas/{areaId}/outreach (ERR_LOSS_AREA_ANALYSIS_STALE)"

  - priority: 50
    category: business_safety
    check: "The governing panel supports an elevation determination: flood_zone != X and base_flood_elevation_ft is not null"
    error_id: ERR_BFE_UNDETERMINED
    http_status: 422
    applies_to: "POST /floodplain/permits/{permitId}/submit (zone X raises ERR_OUTSIDE_FLOOD_HAZARD_AREA)"

  - priority: 52
    category: business_safety
    check: "Elevation adequacy: on APPROVE, proposed_lowest_floor_elevation_ft >= required_lowest_floor_elevation_ft; on certificate ACCEPT, freeboard_margin_ft >= 0.0"
    error_id: ERR_ELEVATION_BELOW_REQUIRED
    http_status: 422
    applies_to: "POST /floodplain/permits/{permitId}/review, POST /floodplain/elevation-certificates/{certificateId}/review"

  - priority: 54
    category: business_safety
    check: "A substantial-improvement review is resolved before approval: when project_type IN {IMPROVEMENT, REPAIR} and declared_project_cost_usd / Structure.market_value_usd * 100 >= SI_THRESHOLD_PCT, the structure must carry a DeterminationCase with status IN {DETERMINED, APPEAL_SUSTAINED, APPEAL_DENIED}"
    error_id: ERR_DETERMINATION_REQUIRED
    http_status: 422
    applies_to: "POST /floodplain/permits/{permitId}/review with decision = APPROVE"

  - priority: 55
    category: business_safety
    check: "A FINISHED_CONSTRUCTION certificate accepted for the permit exists before closeout"
    error_id: ERR_FINISHED_CERTIFICATE_REQUIRED
    http_status: 422
    applies_to: "POST /floodplain/permits/{permitId}/close"

  - priority: 56
    category: business_safety
    check: "Community sanction gate: Community.compliance_posture != SUSPENDED"
    error_id: ERR_COMMUNITY_SUSPENDED
    http_status: 403
    applies_to: "POST /floodplain/permits/{permitId}/issue"

  - priority: 57
    category: business_safety
    check: "Probation gate: when Community.compliance_posture == ON_PROBATION, permits for structures whose substantial_status != NONE may not be issued"
    error_id: ERR_COMMUNITY_ON_PROBATION
    http_status: 403
    applies_to: "POST /floodplain/permits/{permitId}/issue"

  - priority: 60
    category: business_temporal
    check: "The appeal is filed on or before appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /floodplain/determination-cases/{caseId}/appeal"

  - priority: 61
    category: business_temporal
    check: "The inspection is assessed on or before deadline_at"
    error_id: ERR_INSPECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /floodplain/inspections/{inspectionId}/assess"

  - priority: 62
    category: business_temporal
    check: "Cycle submission occurs on or before due_at; a lapse requires the clock to be strictly past due_at; an order default requires the clock to be strictly past deadline_at; an ImprovementRecord event_date is not in the future"
    error_id: ERR_CYCLE_PAST_DUE
    http_status: 422
    applies_to: "POST /floodplain/crs-cycles/{cycleId}/submit (ERR_CYCLE_PAST_DUE), POST /floodplain/crs-cycles/{cycleId}/lapse (ERR_CYCLE_NOT_PAST_DUE), POST /floodplain/remediation-orders/{orderId}/resolve (ERR_ORDER_DEADLINE_NOT_PASSED), POST /floodplain/improvement-records (ERR_EVENT_DATE_IN_FUTURE), POST /floodplain/_clock (ERR_CLOCK_NOT_MONOTONIC)"

  - priority: 70
    category: business_constraint
    check: "Segregation of duties — the AppealsBoardMember deciding an appeal must not be the user recorded in determined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /floodplain/determination-cases/{caseId}/appeal-decision"

  - priority: 71
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS on resubmission and on REQUEST_REVISION"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /floodplain/permits/{permitId}/submit, POST /floodplain/permits/{permitId}/review"

  - priority: 72
    category: business_constraint
    check: "extension_count < MAX_ORDER_EXTENSIONS and the new deadline is strictly after the current one"
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /floodplain/remediation-orders/{orderId}/extend"

  - priority: 73
    category: business_temporal
    check: "FirmPanel interval geometry (half-open, zero-length forbidden): no FirmPanel with the same community_id and panel_number has status == EFFECTIVE with effective_date >= the candidate's effective_date"
    error_id: ERR_PANEL_EFFECTIVE_DATE_OVERLAP
    http_status: 422
    applies_to: "POST /floodplain/firm-panels, POST /floodplain/firm-panels/{panelId}/activate"

  - priority: 74
    category: business_temporal
    check: "CrsCycle interval geometry (closed on both ends, shared endpoints are an overlap): the candidate [cycle_start_date, cycle_end_date] must not intersect the closed interval of any CrsCycle of the same community whose status IN {OPEN, SUBMITTED, UNDER_VERIFICATION, CERTIFIED, RETROGRADED}"
    error_id: ERR_CYCLE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /floodplain/crs-cycles"

  - priority: 75
    category: business_temporal
    check: "Inspection sweep interval geometry (buffer-expanded intersection): the candidate window [event_date - SWEEP_BUFFER_DAYS, event_date + inspection_window_days + SWEEP_BUFFER_DAYS] must not intersect the closed window [disaster_event_date, deadline_at] of any existing sweep of the same community"
    error_id: ERR_SWEEP_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /floodplain/communities/{communityId}/inspection-sweep"

  - priority: 76
    category: business_constraint
    check: "Uniqueness: Community.cid_number globally; Property.parcel_id per community; RepetitiveLossArea.area_code per community; CrsCycle.cycle_year per community; declaration_code per community; at most one PENDING_REVISION FirmPanel per (community_id, panel_number); at most one HigherStandard in {DRAFT, SUBMITTED, VERIFIED} per (community_id, activity_code, documentation_cycle_year) unless the existing one is DRAFT or REJECTED and is superseded"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /floodplain/communities (ERR_DUPLICATE_CID_NUMBER), POST /floodplain/properties (ERR_DUPLICATE_PARCEL_ID), POST /floodplain/repetitive-loss-areas (ERR_DUPLICATE_AREA_CODE), POST /floodplain/crs-cycles (ERR_DUPLICATE_CYCLE_YEAR), POST /floodplain/communities/{communityId}/inspection-sweep (ERR_DUPLICATE_DECLARATION_CODE), POST /floodplain/firm-panels (ERR_DUPLICATE_PANEL_REVISION), POST /floodplain/higher-standards (ERR_DUPLICATE_STANDARD_ACTIVITY)"

  - priority: 78
    category: business_constraint
    check: "At most one RemediationOrder with status IN {ISSUED, EXTENDED} per violation; a REVERSAL may not target an already reversed record"
    error_id: ERR_ORDER_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /floodplain/remediation-orders, POST /floodplain/improvement-records (ERR_RECORD_ALREADY_REVERSED)"

  - priority: 85
    category: business_referential
    check: "Credit eligibility — max_points_allowed computed from live community, repetitive-loss-area and violation state must be >= 1 for the activity being verified"
    error_id: ERR_STANDARD_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /floodplain/higher-standards/{standardId}/verify with decision = VERIFY"

  - priority: 86
    category: business_referential
    check: "Certification readiness — no HigherStandard of the community is still SUBMITTED, and the verification visit is recorded when verification_visit_required is true"
    error_id: ERR_VERIFICATION_VISIT_REQUIRED
    http_status: 422
    applies_to: "POST /floodplain/crs-cycles/{cycleId}/certify (unresolved submissions raise ERR_UNRESOLVED_SUBMISSIONS)"

  - priority: 88
    category: business_referential
    check: "A FINISHED_CONSTRUCTION certificate carries a surveyor_license_no; a certificate may only be submitted against a permit whose status == ISSUED"
    error_id: ERR_SURVEYOR_LICENSE_REQUIRED
    http_status: 422
    applies_to: "POST /floodplain/elevation-certificates (non-ISSUED permit raises ERR_PERMIT_NOT_ISSUED)"

  - priority: 90
    category: business_fiscal
    check: "Outreach arithmetic: target_property_count >= property_count at launch, and delivered_count + delivered_increment <= target_property_count"
    error_id: ERR_OUTREACH_TARGET_BELOW_ANALYZED
    http_status: 422
    applies_to: "POST /floodplain/repetitive-loss-areas/{areaId}/outreach, POST /floodplain/repetitive-loss-areas/{areaId}/record-outreach-delivery (ERR_DELIVERY_EXCEEDS_TARGET)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ Community
  - method: POST
    path: "/floodplain/communities"
    description: "Register an NFIP participating community"
    roles: [StateNfipCoordinator]
    code: 201
    input: ["name", "state_code", "cid_number", "freeboard_ft?", "cumulative_period_years?"]
    output: Community
    side_effects:
      - "sanction_risk_points = 0, compliance_posture = GOOD_STANDING, crs_class = 10"
      - "crs_credit_points_claimed = 0, crs_credit_points_verified = 0, version = 1"
      - "standards_adopted_at = current logical clock"

  - method: GET
    path: "/floodplain/communities/{communityId}"
    description: "Read a community"
    roles: [StateNfipCoordinator, FloodplainAdministrator, AppealsBoardMember, PropertyOwner]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: PATCH
    path: "/floodplain/communities/{communityId}"
    description: "Amend the adopted higher standards (freeboard and cumulative look-back period)"
    roles: [FloodplainAdministrator]
    code: 200
    input: ["freeboard_ft?", "cumulative_period_years?"]
    output: Community
    side_effects:
      - "standards_adopted_at = current logical clock; version += 1"
      - "every VERIFIED HigherStandard whose recomputed max_points_allowed < verified_points -> EXPIRED with verified_points = 0 (order created_at ASC)"
      - "crs_credit_points_verified and crs_class recomputed"
      - "existing permits keep their freeboard_applied_ft snapshot and are NOT recomputed"

  - method: GET
    path: "/floodplain/communities/{communityId}/compliance-summary"
    description: "Computed read: enforcement and CRS posture of the community"
    roles: [StateNfipCoordinator, FloodplainAdministrator]
    code: 200
    input: []
    output: "{ community_id: string, sanction_risk_points: integer, compliance_posture: string, counted_violation_count: integer, defaulted_order_count: integer, a510_credit_applied: integer, crs_class: integer, crs_credit_points_claimed: integer, crs_credit_points_verified: integer, freeboard_ft: number, cumulative_period_years: integer }"
    side_effects: []

  - method: POST
    path: "/floodplain/communities/{communityId}/inspection-sweep"
    description: "Open a post-disaster damage-assessment sweep: schedules one inspection per structure inside the special flood hazard area"
    roles: [FloodplainAdministrator]
    code: 201
    input: [declaration_code, event_date, inspection_window_days]
    output: "{ declaration_code: string, event_date: string, deadline_at: string, inspections_created: integer, inspection_ids: string[] }"
    side_effects:
      - "eligibility filter: Property.community_id == this community AND the property's FirmPanel.status == EFFECTIVE AND FirmPanel.flood_zone IN {A, AE, AO, VE}; every Structure of those properties is swept, ordered created_at ASC"
      - "one PostDisasterInspection per eligible structure with status SCHEDULED, declaration_code, disaster_event_date = event_date, deadline_at = event_date + inspection_window_days"
      - "when the eligible set is empty, inspections_created = 0 and inspection_ids = []"

  # ------------------------------------------------------------------ FirmPanel
  - method: POST
    path: "/floodplain/firm-panels"
    description: "File a FIRM panel (initial issue or a map revision) in PENDING_REVISION"
    roles: [StateNfipCoordinator]
    code: 201
    input: ["community_id", "panel_number", "suffix", "flood_zone", "effective_date", "base_flood_elevation_ft?"]
    output: FirmPanel
    side_effects: ["status = PENDING_REVISION; supersedes_panel_id = null; version = 1"]

  - method: GET
    path: "/floodplain/firm-panels/{panelId}"
    description: "Read a FIRM panel"
    roles: [StateNfipCoordinator, FloodplainAdministrator, AppealsBoardMember, PropertyOwner]
    code: 200
    input: []
    output: FirmPanel
    side_effects: []

  - method: GET
    path: "/floodplain/firm-panels"
    description: "List FIRM panels with filters"
    roles: [StateNfipCoordinator, FloodplainAdministrator, AppealsBoardMember, PropertyOwner]
    code: 200
    input: ["community_id?", "supersedes_panel_id?", "panel_number?", "status?", "limit?", "offset?"]
    output: FirmPanel[]
    side_effects: []

  - method: POST
    path: "/floodplain/firm-panels/{panelId}/activate"
    description: "Make a filed panel the governing map; runs the map-revision cascade"
    roles: [StateNfipCoordinator]
    code: 200
    input: []
    output: FirmPanel
    side_effects:
      - "see state_machines.FirmPanel PENDING_REVISION -> EFFECTIVE (Cascade C hops 1-4)"

  # ------------------------------------------------------------------- Property
  - method: POST
    path: "/floodplain/properties"
    description: "Create a parcel record on the governing panel"
    roles: [FloodplainAdministrator]
    code: 201
    input: [community_id, firm_panel_id, parcel_id, mapped_area_code, owner_name, owner_email]
    output: Property
    side_effects: ["repetitive_loss_status = NONE; qualifying_claim_count = 0; repetitive_loss_area_id = null; version = 1"]

  - method: GET
    path: "/floodplain/properties/{propertyId}"
    description: "Read a property"
