              as_user_id: "coord-1"
              captures: { order_b: $.data.id }
          trigger:
            - call: "POST /api/catering-orders/${order_b}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VENUE_TIME_CONFLICT"
            - "CateringOrder.${order_b}.status == DRAFT (unchanged)"

      - name: session_changeover_buffer_gap
        grounds:
          - entities.ClientSite.fields.session_changeover_buffer_minutes
          - entities.ServiceSession.fields.window_start
          - entities.ServiceSession.fields.window_end
          - errors[ERR_SESSION_BUFFER_CONFLICT]
          - validations[priority=8]
        distinguishing_aspect: "Buffer/gap interval semantics on ClientSite (not half-open touch): a LUNCH session starting only 15 min after a BREAKFAST session's end violates the 30-min changeover buffer -> ERR_SESSION_BUFFER_CONFLICT."
        test_recipe:
          setup:
            - "Site buffer 30 min; BREAKFAST session same date over [10:00,11:00); attempt LUNCH session starting 11:15 (gap 15 < 30)."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32, session_changeover_buffer_minutes: 30 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "BREAKFAST", window_start: "2026-03-02T10:00:00Z", window_end: "2026-03-02T11:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_a: $.data.id }
          trigger:
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:15:00Z", window_end: "2026-03-02T12:15:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_BUFFER_CONFLICT"
            - "only one ServiceSession persisted for (site, 2026-03-02)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: catering_reserve_release_conserves_on_hand
        grounds:
          - state_machines.CateringOrder.APPROVED_to_CONFIRMED
          - state_machines.CateringOrder.CONFIRMED_to_CANCELLED
          - entities.InventoryLot.fields.qty_on_hand
          - entities.InventoryLot.fields.qty_reserved
        distinguishing_aspect: "Conserved quantity = physical inventory units: confirm reserves KIT 4 (qty_reserved 0->4, qty_on_hand stays 10), cancel releases (qty_reserved 4->0); qty_on_hand==10 throughout."
        test_recipe:
          setup:
            - "KIT lot qty 10 @ 100; APPROVED order; site version captured."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-venues"
              payload: { client_site_id: "${site_id}", name: "Hall A", capacity: 100 }
              as: SiteAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "DRY_GOODS" }
              as: SiteAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "KIT", qty: 10, unit_cost_cents: 100 } ] }
              as: CafeteriaManager
              captures: { po_id: $.data.id }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "GET /api/inventory-lots?purchase_order_id=${po_id}"
              payload: {}
              as: CafeteriaManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /api/catering-orders"
              payload: { client_site_id: "${site_id}", venue_id: "${venue_id}", event_date: "2026-03-10", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T11:00:00Z", headcount: 25, lines: [ { menu_item_id: "${wrap_id}", qty: 1 } ] }
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/catering-orders/${order_id}/review"
              payload: { decision: "APPROVE" }
              as: CateringApprover
              as_user_id: "appr-1"
            - call: "GET /api/client-sites/${site_id}"
              payload: {}
              as: FinanceController
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /api/catering-orders/${order_id}/confirm"
              payload: { expected_client_site_version: "${site_v}", reserved_ingredients: [ { ingredient: "KIT", qty: 4 } ] }
              as: FinanceController
            - call: "POST /api/catering-orders/${order_id}/cancel"
              payload: {}
              as: FinanceController
          assert:
            - "after confirm: InventoryLot.${lot_id}.qty_reserved == 4 and qty_on_hand == 10"
            - "after cancel: InventoryLot.${lot_id}.qty_reserved == 0 and qty_on_hand == 10"
            - "invariant qty_on_hand == 10 across reserve+release (physical units conserved)"

      - name: pos_void_conserves_employee_money
        grounds:
          - state_machines.BadgeTransaction.COMPLETED_to_VOIDED
          - entities.Employee.fields.wallet_balance_cents
          - entities.Employee.fields.daily_subsidy_used_cents
          - calculations.badge_subsidy
        distinguishing_aspect: "Different conserved quantity = employee money: a WALLET Chicken txn debits wallet 2000->1550 (charge 450) and used 0->450; void restores wallet to 2000 and used to 0 (wallet + charged conserved at 2000)."
        test_recipe:
          setup:
            - "IN_SERVICE session; Chicken ENTREE 900; employee wallet 2000; one COMPLETED WALLET txn (charge 450, subsidy 450)."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Dee Iner", wallet_balance_cents: 2000 }
              as: SiteAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Chicken", category: "ENTREE", price_cents: 900, standard_recipe_cost_cents: 300 }
              as: CafeteriaManager
              captures: { chick_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_id: $.data.id }
            - call: "POST /api/service-sessions/${sess_id}/lock-forecast"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions/${sess_id}/open"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/badge-transactions"
              payload: { employee_id: "${emp_id}", service_session_id: "${sess_id}", lines: [ { menu_item_id: "${chick_id}", qty: 1 } ], payment_method: "WALLET" }
              as: Diner
              as_user_id: "${emp_id}"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /api/badge-transactions/${txn_id}/void"
              payload: {}
              as: CafeteriaManager
          assert:
            - "before void: Employee.${emp_id}.wallet_balance_cents == 1550 and daily_subsidy_used_cents == 450"
            - "after void: Employee.${emp_id}.wallet_balance_cents == 2000 and daily_subsidy_used_cents == 0"
            - "invariant wallet_balance_cents + charged == 2000 (employee money conserved)"
