  # ============================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cesd_annual_report_file_requires_non_dissolved_business_entity
        grounds:
          - state_machines.AnnualReport.DRAFT_to_FILED
          - state_machines.BusinessEntity.ACTIVE_to_DISSOLVED
        distinguishing_aspect: |
          Pair (AnnualReport, BusinessEntity). AnnualReport.file requires
          BusinessEntity.status != DISSOLVED; the precondition on the file
          transition consults a sibling entity (the parent) explicitly.
        test_recipe:
          setup:
            - "DE LLC entity with one DRAFT AnnualReport for period_year=2024, then dissolved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "QUEBEC LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0110" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar_id: $.data.id }
            # Dissolving will VOID the AnnualReport, so the file attempt will fail.
            # The dissolution path is the cross-entity gate; the AR is no longer
            # in DRAFT and ERR_ENTITY_DISSOLVED guards even FILED transitions on
            # children of DISSOLVED parents.
            - call: "PATCH /business-entities/${be_id}/dissolve"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
          trigger:
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_ENTITY_DISSOLVED  # cross-entity gate (AnnualReport <- BusinessEntity)"

      - name: cesd_boi_submit_requires_active_registered_agent
        grounds:
          - state_machines.BOIDisclosure.DRAFT_to_SUBMITTED
          - state_machines.RegisteredAgent.ACTIVE_to_RESIGNED
        distinguishing_aspect: |
          Different pair (BOIDisclosure, RegisteredAgent). BOIDisclosure.submit
          requires at least one RegisteredAgent with status=ACTIVE for the
          parent BusinessEntity; resigning the only ACTIVE agent leaves zero
          and submit fails with ERR_INVALID_STATE per the BOI submit
          precondition (no ACTIVE agent). Structurally a different cross-
          entity pair than instance #1, satisfying §0.5's differentiation
          clause.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with a DRAFT BOIDisclosure; the sole RegisteredAgent has just been resigned."
            - "Clock within FORMATION 90-day window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "ROMEO LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0120" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/boi-disclosures"
              payload: { triggering_event: "FORMATION", beneficial_owners_json: { entries: [ { name: "O1", dob: "1980-01-01", ownership_pct: 100, control_role: "BOTH" } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { boi_id: $.data.id }
            - call: "POST /registered-agents/${ra_id}/resign"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
          trigger:
            - call: "POST /boi-disclosures/${boi_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_INVALID_STATE  # cross-entity (BOIDisclosure <- RegisteredAgent)"

  # ============================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: rto_annual_report_zero_width_period_year_uniqueness
        grounds:
          - validations[priority=70]
          - entities.AnnualReport.fields.period_year
        distinguishing_aspect: |
          Interval semantics: zero-width interval — at most ONE AnnualReport
          per (business_entity_id, period_year) for the entity's lifetime.
          Even VOIDED reports occupy the slot. Resource entity = AnnualReport.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with a FILED AnnualReport for period_year=2024."
            - "Clock pinned at 2025-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "SIERRA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0130" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar1_id: $.data.id }
            - call: "POST /annual-reports/${ar1_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_REPORT_PERIOD_TAKEN  # zero-width interval at (entity_id, 2024)"

      - name: rto_foreign_qualification_halfopen_interval_overlap
        grounds:
          - validations[priority=72]
          - state_machines.ForeignQualification.PENDING_to_QUALIFIED
        distinguishing_aspect: |
          Different resource entity (ForeignQualification, not AnnualReport)
          and different interval semantics (half-open [qualified_at, withdrawn_at)).
          Two ForeignQualifications for the same (BusinessEntity,
          foreign_state_code) cannot have overlapping QUALIFIED intervals.
          A second QUALIFIED that would overlap is rejected; only once the
          first is WITHDRAWN can a second qualify for the same foreign state.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE qualified in CA via FQ#1 with a CA-state RegisteredAgent; FQ#1.status=QUALIFIED."
            - "Second ForeignQualification PENDING for the same (entity, CA) with a CA agent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "TANGO LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { be_v1: $.data.version }
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0140" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            # Foreign-state agent (CA) — note: §1.4 priority 65 ERR_AGENT_STATE_MISMATCH
            # requires agent_state_code == formation_state_code on the home-state agent;
            # the §1.4 wording allows foreign-state agents to be created via the same
            # endpoint because the rule only binds when intended as the home agent.
            # The scaffold's intent is: agents whose state != formation_state_code are
            # *foreign* agents, accepted by the create endpoint, usable only as
            # FQ.foreign_registered_agent_id. (See §1.1 RegisteredAgent.agent_state_code
            # constraint note.)
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "CA Agent", agent_type: "COMMERCIAL", agent_state_code: "CA", expected_business_entity_version: "${be_v1}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra_ca_id: $.data.id }
            - call: "POST /business-entities/${be_id}/foreign-qualifications"
              payload: { foreign_state_code: "CA", foreign_registered_agent_id: "${ra_ca_id}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { fq1_id: $.data.id }
            - call: "POST /foreign-qualifications/${fq1_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/foreign-qualifications"
              payload: { foreign_state_code: "CA", foreign_registered_agent_id: "${ra_ca_id}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { fq2_id: $.data.id }
          trigger:
            - call: "POST /foreign-qualifications/${fq2_id}/approve"
              payload: {}
              as: StateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "$.data.error_id == ERR_FQ_OVERLAP  # half-open overlap at (entity, CA)"

  # ============================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:

      - name: ci_void_and_refile_preserves_cumulative_franchise_tax_paid_cents
        grounds:
          - calculations.franchise_tax
          - state_machines.AnnualReport.FILED_to_VOIDED
          - state_machines.AnnualReport.DRAFT_to_FILED
          - entities.BusinessEntity.fields.cumulative_franchise_tax_paid_cents
        distinguishing_aspect: |
          Named conserved quantity:
          BusinessEntity.cumulative_franchise_tax_paid_cents
          = SUM over AnnualReports in {FILED} of (franchise_tax_amount_cents + late_fee_cents).
          Invariant: filing an AnnualReport then voiding it then creating a
          new AnnualReport for the same period_year and filing it (with
          identical revenue_band and clock) MUST restore the cumulative to
          its pre-void value exactly. No drift in cents.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE; AnnualReport for period_year=2024 FILED, cumulative_franchise_tax_paid_cents=30000."
            - "Clock pinned at 2025-03-01T00:00:00Z (no late fee)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "UNIFORM LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0150" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar1_id: $.data.id }
            - call: "POST /annual-reports/${ar1_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { cum_pre: $.data.cumulative_franchise_tax_paid_cents }
          trigger:
            - call: "POST /annual-reports/${ar1_id}/void"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { cum_after_void: $.data.cumulative_franchise_tax_paid_cents }
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar2_id: $.data.id }
            - call: "POST /annual-reports/${ar2_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { cum_post: $.data.cumulative_franchise_tax_paid_cents }
          assert:
            - "BusinessEntity.${be_id}.cumulative_franchise_tax_paid_cents (pre) == 30000"
            - "BusinessEntity.${be_id}.cumulative_franchise_tax_paid_cents (after_void) == 0"
            - "BusinessEntity.${be_id}.cumulative_franchise_tax_paid_cents (post_refile) == 30000"
            - "Invariant holds: cumulative_pre == cumulative_post (no drift in cents)"

      - name: ci_registered_agent_supersede_preserves_active_count
        grounds:
          - state_machines.RegisteredAgent.ACTIVE_to_RESIGNED
          - concurrency_rules[registered-agent-create-stale-business-entity]
          - entities.RegisteredAgent.fields.status
        distinguishing_aspect: |
          Different conserved quantity: invariant_active_agent_count = COUNT
          of RegisteredAgents for this BusinessEntity whose status=ACTIVE.
          Creating a new RegisteredAgent via POST
          /business-entities/{id}/registered-agents performs an
          atomic supersede: prior ACTIVE -> RESIGNED AND new ACTIVE persisted.
          Invariant: count of ACTIVE remains exactly 1 across this
          compensating-pair. The conserved-quantity domain is a discrete
          enum count, structurally distinct from the cents-summed invariant
          above.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with exactly one ACTIVE RegisteredAgent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "VICTOR LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent 1", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra1_id: $.data.id, be_v1: $.data.version }
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { be_v2: $.data.version }
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0160" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
              captures: { be_v3: $.data.version }
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { be_v_now: $.data.version }
          trigger:
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent 2", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v_now}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra2_id: $.data.id }
            - call: "GET /business-entities/${be_id}/registered-agents"
              payload: { status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { active_id: $.data.0.id }
          assert:
            - "RegisteredAgent.${ra1_id}.status == RESIGNED  # superseded"
            - "RegisteredAgent.${ra2_id}.status == ACTIVE  # new ACTIVE"
            - "COUNT(RegisteredAgent WHERE business_entity_id == ${be_id} AND status==ACTIVE) == 1  # invariant preserved"
