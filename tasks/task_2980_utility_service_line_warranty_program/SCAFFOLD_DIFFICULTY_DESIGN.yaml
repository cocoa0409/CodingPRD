              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Occurrence 3: one-cent callout that lands exactly on the cap." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim3_id: $.data.id, claim3_eligibility: $.data.eligibility_assessment }
            - call: "POST /claims/${claim3_id}/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Covered." }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim3_v: $.data.version }
            - call: "POST /claims/${claim3_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim3_v}", contractor_id: "${c_a_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d3_id: $.data.id }
            - call: "POST /dispatches/${d3_id}/events"
              payload: { event_type: "ACCEPT" }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
            - call: "POST /dispatches/${d3_id}/events"
              payload: { event_type: "COMPLETE", labor_cents: 1, materials_cents: 0 }
              as: NetworkContractor
              as_user_id: "${c_a_id}"
              captures: { d3_paid: $.data.benefit_paid_cents }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { used_p3: $.data.annual_benefit_used_cents, cap_p3: $.data.cap_status, reserved_p3: $.data.annual_benefit_reserved_cents }
          assert:
            - "${cap_at_birth} == WITHIN_CAP and ${used_at_birth} == 0"
            - "point 1 (far below) - ${d1_paid} == 527000  # LABOR 260000 + MATERIALS 175000 + PERMIT 42000 + covered restoration 50000, all inside the 800000 occurrence pool"
            - "point 1 (far below) - ${used_p1} == 527000 and ${cap_p1} == WITHIN_CAP"
            - "point 2 (cap minus one cent) - ${d2_paid} == 472999 and ${d2_customer} == 0"
            - "point 2 (cap minus one cent) - ${used_p2} == 999999 and ${cap_p2} == WITHIN_CAP  # 999999 >= 1000000 is false, so the cap has NOT been reached"
            - "point 2 - ${claim3_eligibility} == ELIGIBLE  # still within cap at the moment claim 3 is filed"
            - "point 3 (exactly at the cap) - ${d3_paid} == 1"
            - "point 3 (exactly at the cap) - ${used_p3} == 1000000 and ${cap_p3} == ANNUAL_CAP_EXHAUSTED  # `>=` fires on equality; a `>` implementation leaves this WITHIN_CAP"
            - "point 3 - ${used_p3} == 1000000 exactly, never 1000001: the pool never over-pays"
