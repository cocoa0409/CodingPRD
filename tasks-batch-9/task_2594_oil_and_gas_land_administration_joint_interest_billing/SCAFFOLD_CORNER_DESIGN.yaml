            - "JibStatement.${stmt_id}.statement_status == VOID with total_billed_cents still 2934000 on the voided row"
            - "Well.${well_id}.billed_to_date_cents == 0"
            - "the three June cost entries are selectable again by a fresh statement over the same period, which issues to the identical 2934000"

      - name: the_expiry_chain_runs_end_to_end_in_one_sweep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.POST_/land-admin/obligation-runs
        excluded_because:
          difficulty_instance: transitive_cascade / lease_expiry_cascades_four_hops_into_suspended_disbursements
          rationale: |
            The layer's claims are an N-level chain verified end to end with ordering sensitivity. The
            §1.8 transitive_cascade instance drives the deepest chain in the scaffold - Lease EXPIRED
            to allocation WITHDRAWN to Well POOLED_TERMINATED to ProductionRevenue SUSPENDED to
            OwnerDisbursement SUSPENDED - and asserts each hop plus the recomputed suspense balance.

      - name: both_cost_bases_are_exercised_on_one_cost_history
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.jib_direct_cost_pool
        excluded_because:
          difficulty_instance: dual_variant_calc / jib_cost_basis_accrual_versus_cash_on_identical_cost_history
          rationale: |
            The layer asks for both variants to produce their expected results with a verified delta on
            the switch. The §1.8 dual_variant_calc instance issues an ACCRUAL and a CASH statement over
            one cost history and asserts both totals and their difference, which is the whole claim.

  # ============================================================================
  # Section 9 - Consistency model (immediate)
  # ============================================================================
  - section: consistency_model
    instances:
      - name: the_issuance_response_already_carries_the_recomputed_totals
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/land-admin/jib-statements/{statement_id}/issuance
          - entities.JibStatement.fields.payment_due_date
        distinguishing_aspect: |
          Nothing lags: the issuance response itself already reports total_billed_cents 2934000,
          payment_due_date 2026-08-09 and statement_status ISSUED, and a GET of the well issued in the
          very next call already shows billed_to_date_cents 2934000 with the three line items present -
          no second write or re-read is needed to settle the derived values.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
            - "Well Sandstone 1H, OIL, 9500 ft, with 480.00 acres committed from L-001 and 160.00 from L-002 (allocation factors 0.750000 / 0.250000), well_status PRODUCING, pooling_status POOLED_EFFECTIVE"
            - "Four interest owners: OP (operator, WI 0.500000, NRI 0.412500, preferential_right true, bond 50000000), OA (WI 0.300000, NRI 0.240000, preferential_right true, bond 10000000), OB (WI 0.200000, NRI 0.150000, preferential_right false, bond 0), OC (Gamma Operating LP, bond 20000000, holds no interest in this well)"
            - "June 2026 costs on the well: CAPITAL 2000000, CAPITAL 500000, OPERATING 300000, none under an AFE"
            - "A DRAFT statement JIB-2026-06 over 2026-06-01..2026-06-30, ACCRUAL, PRODUCING, PERCENTAGE_BASIS"
            - "Well.billed_to_date_cents is 0 and the statement has no line items yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31", extension_option_months: 12, extension_bonus_per_acre_cents: 12000, shut_in_royalty_per_acre_cents: 400, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500, spud_date: "2026-02-10" }
              as: LandAdministrator
