      - name: plan_activate_is_conditional_on_an_open_practice_group
        claim_type: conditional_action
        grounds:
          - endpoints[POST /lateral-hiring/integration-plans/{plan_id}/activate]
          - endpoints[POST /lateral-hiring/practice-groups/{practice_group_id}/freeze]
          - validations[priority=21]
          - errors[ERR_PRACTICE_GROUP_FROZEN]
          - state_machines.IntegrationPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          activate is CONDITIONAL on the state of an aggregate it does not name: the request
          carries no body and its path points at the plan, yet the gate lives on the
          PracticeGroup. The identical request is refused and then accepted with nothing
          changed on the plan at all — only a freeze and an unfreeze on a third resource in
          between. The refused attempt must also leave active_onboarding_count at 0, so a
          partially applied activation is detectable.
