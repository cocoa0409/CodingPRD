scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: precinct_margin_provisional_vs_reconciled
        grounds:
          - calculations.precinct_margin
          - state_machines.Election.ELECTION_DAY_to_TALLY
          - state_machines.RecountRequest.APPROVED_to_IN_PROGRESS
          - entities.BallotCast.fields.method
        distinguishing_aspect: |
          Operates on the BallotCast entity domain (precinct-scoped tallies). The provisional_tally variant
          excludes ELECTION_DAY_PROVISIONAL ballots, while reconciled_recount includes them — same input
          rows, different totals, different winner whenever any PROVISIONAL ballot exists.
        test_recipe:
          setup:
            - "POST /elections — name='General', election_date='2026-11-03T00:00:00.000Z', registration_deadline='2026-10-04T00:00:00.000Z', absentee_request_deadline='2026-10-27T00:00:00.000Z', early_voting_starts_at='2026-10-20T00:00:00.000Z', early_voting_ends_at='2026-11-02T00:00:00.000Z', ballot_return_deadline='2026-11-03T20:00:00.000Z', cure_deadline='2026-11-10T00:00:00.000Z', certification_deadline='2026-11-20T00:00:00.000Z', recount_threshold_pct=0.005"
            - "POST /elections/{id}/precincts — code='P1', street_pattern='.*Main.*', capacity_machines=2"
            - "POST .../voting-machines for P1 (one machine M1)"
            - "POST /elections/{id}/state {OPEN_REGISTRATION}"
            - "Register 204 voters (status=ACTIVE) at Main St addresses for P1"
            - "POST /_clock/advance to 2026-10-20T00:00:00.001Z (EARLY_VOTING)"
            - "POST /_clock/advance to 2026-11-03T07:00:00.000Z (ELECTION_DAY)"
            - "Cast: 99 BallotCast for voter_choice='A' (50 EARLY_IN_PERSON before clock advance, 49 ELECTION_DAY_MACHINE via M1)"
            - "Cast: 100 BallotCast for voter_choice='B' (all EARLY_IN_PERSON before clock advance)"
            - "POST /voting-machines/{M1}/state {DOWN, failure_reason=POWER} → machine_failure_active=true at P1"
            - "Cast 5 ELECTION_DAY_PROVISIONAL BallotCast for voter_choice='A'"
            - "POST /_clock/advance to 2026-11-03T20:00:01.000Z (past ballot_return_deadline)"
            - "POST /elections/{id}/state {TALLY}"
          trigger:
            - "GET /elections/{id}/tally?variant=provisional"
            - "POST /elections/{id}/recounts {petition_count: 100} then POST /recounts/{rid}/state {APPROVED} then {IN_PROGRESS}"
            - "GET /elections/{id}/tally?variant=reconciled"
            - "POST /recounts/{rid}/state {RESOLVED_OVERTURN}"
          assert:
            - "provisional tally winner == 'B' with totals {A: 99, B: 100, sum: 199, margin_pct: 0.005025}"
            - "reconciled tally winner == 'A' with totals {A: 104, B: 100, sum: 204, margin_pct: 0.019608}"
            - "RecountRequest.status == 'RESOLVED_OVERTURN' (reconciled winner != provisional winner)"

      - name: voter_eligibility_strict_vs_cure_grace
        grounds:
          - calculations.voter_eligibility
          - state_machines.Voter.PENDING_to_ACTIVE
          - state_machines.Election.OPEN_REGISTRATION_to_EARLY_VOTING
          - entities.Voter.fields.residency_since
        distinguishing_aspect: |
          Operates on the Voter entity domain (eligibility scoring), not on BallotCast. The strict_pre_deadline
          variant requires residency_days >= 30 absolutely; the cure_grace_window variant, applied during the
          7 days after registration_deadline for voters previously ACTIVE, waives the residency requirement —
          same Voter row, same residency_since, different ACTIVE/SUSPENDED outcome.
        test_recipe:
          setup:
            - "POST /elections — registration_deadline='2026-10-04T00:00:00.000Z', early_voting_starts_at='2026-10-05T00:00:00.000Z', election_date='2026-11-03T00:00:00.000Z'"
            - "POST /precincts (P1, street_pattern='.*Oak.*')"
            - "Voter V1 registered on 2026-09-01 with residency_since='2026-10-01' (residency_days at election_date = 33 → passes strict)"
            - "Voter V2 registered on 2026-09-01 with residency_since='2026-10-25' (residency_days at election_date = 9 → fails strict)"
            - "Both POST /voters/{id}/state {ACTIVE} succeed for V1, fail for V2 with ERR_RESIDENCY_INSUFFICIENT"
            - "Advance clock to 2026-10-04T00:00:01.000Z (post registration_deadline)"
            - "Suspend V1: POST /voters/V1/state {SUSPENDED}"
            - "Update V1.residency_since='2026-10-25' via PATCH (residency_days now 9)"
            - "Advance clock to 2026-10-05T00:00:01.000Z (EARLY_VOTING begins)"
          trigger:
            - "POST /voters/V1/state {ACTIVE} (within 7-day grace, was previously ACTIVE)"
            - "POST /voters/V2/state {ACTIVE} (was never previously ACTIVE)"
          assert:
            - "V1 transition succeeds (cure_grace_window waives residency)"
            - "V2 transition fails with error_id == 'ERR_RESIDENCY_INSUFFICIENT'"
            - "Different outcomes from identical residency_days=9 prove dual variants on the Voter domain"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: precinct_margin_three_input_non_linear  # mode (a): >=3 inputs, non-linear branching on entity state
        grounds:
          - calculations.precinct_margin
          - entities.BallotCast.fields.status
          - entities.BallotCast.fields.method
          - entities.BallotCast.fields.challenge_reason
        distinguishing_aspect: |
          Mode (a): formula depends on ≥3 inputs (status set, method set, challenge_reason) with conditional
          branching on entity state — the same Ballot contributes or not based on three independent
          dimensions, and the variant-selector is a fourth conditional layer.
        test_recipe:
          setup:
            - "Create election + P1 as in rule_id=dual_variant_calc.precinct_margin_provisional_vs_reconciled"
            - "Cast 10 BallotCast for choice A (method=EARLY_IN_PERSON)"
            - "Cast 8 BallotCast for choice B (method=EARLY_IN_PERSON)"
            - "Cast 1 BallotCast for choice A and immediately POST /ballots/{id}/state {INVALIDATED, challenge_reason=DOUBLE_VOTE} via ElectionBoard"
          trigger:
            - "POST /_clock/advance past ballot_return_deadline"
            - "POST /elections/{id}/state {TALLY}"
            - "GET /elections/{id}/tally?variant=provisional"
          assert:
            - "provisional totals == {A: 10, B: 8, sum: 18, margin_pct: 0.111111}"
            - "INVALIDATED ballot with challenge_reason=DOUBLE_VOTE is excluded from totals (status filter + challenge_reason filter both apply)"

      - name: election_margin_pinned_rounding_order  # mode (b): nested rounding where order matters
        grounds:
          - calculations.election_margin_pct
          - calculations.precinct_margin
        distinguishing_aspect: |
          Mode (b): rounding order is pinned. The formula REQUIRES rounding integer counts per-precinct
          first (which is exact), summing across precincts, then dividing once. Dividing per-precinct and
          summing ratios produces a different value, so the implementation MUST follow the pinned order.
        test_recipe:
          setup:
            - "Election with two precincts P1, P2"
            - "P1: 67 A, 33 B (sum=100, A/total=0.67)"
            - "P2: 1 A, 2 B (sum=3, A/total=0.333…)"
            - "Advance clock past ballot_return_deadline"
            - "POST /elections/{id}/state {TALLY}"
          trigger:
            - "GET /elections/{id}/tally?variant=provisional"
          assert:
            - "election_margin_pct == 0.320388 (pinned order: sum integer counts across precincts first → A_total=67+1=68, B_total=33+2=35, sum=103; then compute margin once = (68-35)/103 = 33/103 = 0.320388349… rounded 6dp = 0.320388)"
            - "Implementation that computed per-precinct ratios first ((67-33)/100=0.34 for P1; (1-2)/3=-0.333… for P2 → average=0.003) would yield ~0.003 → fails this assertion, proving rounding-order sensitivity"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: curing_case_cyclic_revision_loop
        grounds:
          - state_machines.CuringCase
          - state_machines.CuringCase.UNDER_REVIEW_to_OPEN_PENDING_VOTER
          - state_machines.CuringCase.OPEN_PENDING_VOTER_to_UNDER_REVIEW
          - entities.CuringCase.fields.round_count
          - entities.CuringCase.fields.max_rounds
        distinguishing_aspect: |
          CuringCase is cyclic: OPEN_PENDING_VOTER → UNDER_REVIEW → OPEN_PENDING_VOTER, bounded by
          max_rounds. Each cycle increments round_count; the cycle is on the CuringCase entity.
        test_recipe:
          setup:
            - "Create election with cure_deadline far in future"
            - "RegistrarClerk RC1 (X-User-ID='rc1') registers Voter V1; Voter.registered_by_user_id='rc1'"
            - "AbsenteeBallot AB1 ISSUED, then return with signature_match=MISMATCH → CuringCase CC1 in OPEN_PENDING_VOTER"
            - "ReviewerClerk RV1 (X-User-ID='rv1', distinct from 'rc1') handles all subsequent CuringCase actions"
            - "Voter V1 submits CC1 → UNDER_REVIEW"
            - "RV1 POST /curing-cases/CC1/request-revision → OPEN_PENDING_VOTER (round_count=1)"
            - "Voter V1 submits → UNDER_REVIEW"
            - "RV1 POST /curing-cases/CC1/request-revision → OPEN_PENDING_VOTER (round_count=2)"
            - "Voter V1 submits → UNDER_REVIEW"
            - "RV1 POST /curing-cases/CC1/request-revision → OPEN_PENDING_VOTER (round_count=3)"
            - "Voter V1 submits → UNDER_REVIEW"
          trigger:
            - "RV1 POST /curing-cases/CC1/request-revision (round_count=3 not < max_rounds=3)"
          assert:
            - "Response status == 409 with error_id == 'ERR_MAX_ROUNDS_REACHED'"
            - "CuringCase.round_count remains 3 (no increment on rejected revision)"

      - name: recount_request_branching_resolution
        grounds:
          - state_machines.RecountRequest
          - state_machines.RecountRequest.IN_PROGRESS_to_RESOLVED_NO_CHANGE
          - state_machines.RecountRequest.IN_PROGRESS_to_RESOLVED_OVERTURN
          - state_machines.RecountRequest.REQUESTED_to_DENIED
        distinguishing_aspect: |
          RecountRequest is branching (fork-join): REQUESTED splits into {APPROVED, DENIED}; APPROVED →
          IN_PROGRESS then splits into {RESOLVED_NO_CHANGE, RESOLVED_OVERTURN}, each with divergent
          side-effect sets (overturn changes Election.certified_winner_voter_choice; no-change does not).
          Lives on a different entity (RecountRequest) from the cyclic curing case.
        test_recipe:
          setup:
            - "Election in TALLY with provisional margin <= recount_threshold_pct so system created a RecountRequest RR1"
            - "POST /recounts/RR1/state {APPROVED}"
            - "POST /recounts/RR1/state {IN_PROGRESS} → Election TALLY → RECOUNT, all TALLIED ballots → CHALLENGED"
          trigger:
            - "Branch A: POST /recounts/RR1/state {RESOLVED_OVERTURN} with reconciled winner != provisional winner"
            - "Branch B (separate test): POST /recounts/RR1/state {RESOLVED_NO_CHANGE}"
          assert:
            - "Branch A: side_effects include reconciled_totals_json populated and CHALLENGED ballots → TALLIED"
            - "Branch B: RESOLVED_OVERTURN attempted when winners match yields ERR_RECOUNT_NO_OVERTURN"
            - "Two distinct resolution branches from same APPROVED parent state confirm branching shape"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: voter_suspend_cascades_to_absentee_to_curing  # depth 3
        grounds:
          - state_machines.Voter.ACTIVE_to_SUSPENDED
          - state_machines.AbsenteeBallot.RETURNED_to_REJECTED
          - state_machines.CuringCase.UNDER_REVIEW_to_RESOLVED_REJECT
          - entities.AbsenteeBallot.fields.status
          - entities.CuringCase.fields.status
        distinguishing_aspect: |
          Depth-3 cascade where each link is caused by the previous link, not by the original action:
          (link 1) Voter ACTIVE → SUSPENDED triggers (link 2) AbsenteeBallot AB2 RETURNED → REJECTED
          via the voter-suspend cascade transition, and that AbsenteeBallot transition itself triggers
          (link 3) the linked CuringCase CC1 OPEN_PENDING_VOTER/UNDER_REVIEW → RESOLVED_REJECT.
          Link 3 is fired by the AbsenteeBallot state machine, not by the Voter state machine.
        test_recipe:
          setup:
            - "Voter V1 ACTIVE in an Election with cure_deadline far in future"
            - "AbsenteeBallot AB2 (voter=V1) ISSUED then returned with signature_match=MISMATCH → AB2.status=RETURNED with linked_curing_case_id=CC1"
            - "CuringCase CC1 status=OPEN_PENDING_VOTER, linked to AB2"
            - "POST /curing-cases/CC1/submit → CC1.status = UNDER_REVIEW"
          trigger:
            - "POST /voters/V1/state {SUSPENDED}"
          assert:
            - "Voter V1.status == 'SUSPENDED' (link 1)"
            - "AbsenteeBallot AB2.status == 'REJECTED' (link 2 — fired by voter-suspend cascade in Voter state machine)"
            - "CuringCase CC1.status == 'RESOLVED_REJECT' (link 3 — fired by AbsenteeBallot RETURNED→REJECTED side_effect, NOT directly by voter SUSPEND; chain is depth 3)"

      - name: machine_failure_cascades_to_precinct_flag  # depth 2 from a different trigger
        grounds:
          - state_machines.VotingMachine.IN_USE_to_DOWN
          - entities.Precinct.fields.machine_failure_active
          - entities.BallotCast.fields.method
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /voting-machines/{id}/state {DOWN} (different trigger from
          rule above's Voter suspend): (1) VotingMachine IN_USE → DOWN triggers (2) Precinct.machine_failure_active
          recomputes to true, which gates subsequent BallotCast.method validation.
        test_recipe:
          setup:
            - "Election in ELECTION_DAY, Precinct P1 with one machine M1 in IN_USE"
            - "Voter V1 (ACTIVE, assigned to P1)"
          trigger:
            - "POST /voting-machines/M1/state {DOWN, failure_reason=POWER}"
            - "POST /ballots (voter_id=V1, precinct_id=P1, method=ELECTION_DAY_MACHINE, machine_id=M1)"
          assert:
            - "VotingMachine.M1.status == 'DOWN' (link 1)"
            - "Precinct.P1.machine_failure_active == true (link 2 — derived recompute)"
            - "Second POST /ballots fails with error_id == 'ERR_MACHINE_FAILURE'"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deadline_temporal_vs_constraint_residency
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair: business_temporal (priority 6, ERR_DEADLINE_PASSED) vs business_constraint (priority 9,
          ERR_RESIDENCY_INSUFFICIENT). A voter activation attempt where the registration_deadline has
          passed AND residency_days < 30 triggers both checks; the lower priority number wins, so the
          temporal error must be returned (NOT the constraint error).
        test_recipe:
          setup:
            - "Election with election_date=2026-11-03T00:00:00.000Z, registration_deadline=2026-10-04T00:00:00.000Z"
            - "Voter V1 PENDING, residency_since=2026-10-25 (residency_days at election_date = 9)"
            - "Advance clock to 2026-10-05T00:00:00.000Z (past registration_deadline)"
          trigger:
            - "POST /voters/V1/state {ACTIVE}"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_DEADLINE_PASSED' (priority 6 wins over priority 9; residency check is never reached)"

      - name: sod_referential_vs_state_invalid
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair: business_referential SOD (priority 4, ERR_FORBIDDEN_SOD) vs state (priority 5,
          ERR_INVALID_STATE). When the same RegistrarClerk who registered the voter attempts to resolve
          a CuringCase that is already in RESOLVED_REJECT (so the from-state is invalid), the SOD
          violation must be returned, not the state error.
        test_recipe:
          setup:
            - "RegistrarClerk RC1 registered Voter V1"
            - "AbsenteeBallot returned with MISMATCH → CuringCase CC1 in OPEN_PENDING_VOTER"
            - "Voter submitted → UNDER_REVIEW"
            - "ReviewerClerk RC2 (different id from RC1) RESOLVED_REJECT → CC1 in RESOLVED_REJECT"
          trigger:
            - "POST /curing-cases/CC1/state {RESOLVED_ACCEPT} with X-User-Role=ReviewerClerk, X-User-ID=RC1"
          assert:
            - "Response status == 403"
            - "error_id == 'ERR_FORBIDDEN_SOD' (priority 4 wins over priority 5)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: recount_threshold_inclusive_boundary
        grounds:
          - calculations.recount_threshold_check
          - entities.Election.fields.recount_threshold_pct
          - state_machines.Election.ELECTION_DAY_to_TALLY
        distinguishing_aspect: |
          Numeric threshold boundary: recount_threshold_check uses <= (INCLUSIVE). Exactly equal to
          the threshold MUST trigger an auto-recount. Reachable via POST /elections/{id}/state {TALLY}.
        test_recipe:
          setup:
            - "recount_threshold_pct = 0.005"
            - "P1: choice A=201 EARLY_IN_PERSON, choice B=199 EARLY_IN_PERSON (sum=400, margin=2/400=0.005000 exactly)"
            - "Advance clock past ballot_return_deadline"
          trigger:
            - "POST /elections/{id}/state {TALLY}"
            - "GET /elections/{id}/recounts"
          assert:
            - "election_margin_pct computed == 0.005000"
            - "Exactly one RecountRequest exists with requested_by_role='system' and trigger_margin_pct=0.005000"
            - "POST /elections/{id}/state {CERTIFIED} returns error_id == 'ERR_RECOUNT_REQUIRED' (boundary <= triggered)"

      - name: residency_days_strict_boundary
        grounds:
          - calculations.voter_eligibility
          - validations[priority=9]
        distinguishing_aspect: |
          Different metric (residency_days, an integer) on a different endpoint (POST /voters/{id}/state
          {ACTIVE}). Uses >= (INCLUSIVE) — exactly 30 days passes; 29 fails. Distinct from the recount
          threshold which is a ratio.
        test_recipe:
          setup:
            - "Election.election_date=2026-11-03T00:00:00.000Z, registration_deadline future"
            - "Voter V_pass with residency_since=2026-10-04T00:00:00.000Z (election_date - residency_since = 30 days exactly)"
            - "Voter V_fail with residency_since=2026-10-05T00:00:00.000Z (29 days)"
          trigger:
            - "POST /voters/V_pass/state {ACTIVE}"
            - "POST /voters/V_fail/state {ACTIVE}"
          assert:
            - "V_pass succeeds with Voter.status == 'ACTIVE' (boundary 30 inclusive)"
            - "V_fail fails with error_id == 'ERR_RESIDENCY_INSUFFICIENT' (29 < 30)"

      - name: empty_precinct_match_set
        grounds:
          - calculations.precinct_assignment
          - validations[priority=10]
        distinguishing_aspect: |
          Different boundary kind: empty candidate set (no Precinct.street_pattern matches). Reachable
          via POST /voters which runs precinct_assignment. Not a numeric threshold but a zero-cardinality
          boundary on a different endpoint.
        test_recipe:
          setup:
            - "Election with one Precinct P1 street_pattern='.*Oak.*'"
          trigger:
            - "POST /voters with residency_address='123 Maple Street'"
          assert:
            - "Voter created with status=PENDING, precinct_id=null"
            - "Subsequent POST /voters/{id}/state {ACTIVE} returns error_id == 'ERR_NO_PRECINCT_MATCH'"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: absentee_issue_requires_voter_active  # pair: AbsenteeBallot ↔ Voter
        grounds:
          - state_machines.AbsenteeBallot.REQUESTED_to_ISSUED
          - entities.Voter.fields.status
        distinguishing_aspect: |
          AbsenteeBallot REQUESTED → ISSUED requires Voter.status == ACTIVE. Pair: AbsenteeBallot depends
          on Voter state.
        test_recipe:
          setup:
            - "Voter V1 status=PENDING"
            - "POST /voters/V1/absentee-ballots → AbsenteeBallot AB1 REQUESTED"
          trigger:
            - "POST /absentee-ballots/AB1/state {ISSUED}"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_VOTER_NOT_ACTIVE'"

      - name: tally_blocked_by_open_curing_case  # pair: Election ↔ CuringCase
        grounds:
          - state_machines.Election.ELECTION_DAY_to_TALLY
          - entities.CuringCase.fields.status
        distinguishing_aspect: |
          Election ELECTION_DAY → TALLY requires no CuringCase in OPEN_PENDING_VOTER or UNDER_REVIEW.
          Distinct entity pair (Election ↔ CuringCase, not AbsenteeBallot ↔ Voter).
        test_recipe:
          setup:
            - "Election in ELECTION_DAY, one CuringCase CC1 in OPEN_PENDING_VOTER"
            - "Advance clock past ballot_return_deadline"
          trigger:
            - "POST /elections/{id}/state {TALLY}"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_CURING_IN_PROGRESS'"

      - name: voter_suspend_blocked_by_existing_ballot  # pair: Voter ↔ BallotCast
        grounds:
          - state_machines.Voter.ACTIVE_to_SUSPENDED
          - entities.BallotCast.fields.status
        distinguishing_aspect: |
          Voter ACTIVE → SUSPENDED requires the voter has no BallotCast in {CAST, TALLIED, CHALLENGED}.
          Third entity pair (Voter ↔ BallotCast).
        test_recipe:
          setup:
            - "Voter V1 ACTIVE, cast in-person BallotCast B1 (status=CAST)"
          trigger:
            - "POST /voters/V1/state {SUSPENDED}"
          assert:
            - "Response status == 409"
            - "error_id == 'ERR_VOTER_HAS_BALLOT'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: early_voting_window_half_open
        grounds:
          - entities.Election.fields.early_voting_starts_at
          - entities.Election.fields.early_voting_ends_at
          - state_machines.Election.OPEN_REGISTRATION_to_EARLY_VOTING
          - state_machines.Election.EARLY_VOTING_to_ELECTION_DAY
        distinguishing_aspect: |
          Half-open interval semantics on the Election early-voting resource window:
          [early_voting_starts_at, early_voting_ends_at) — start INCLUSIVE (transition fires at >=),
          end EXCLUSIVE (transition to ELECTION_DAY fires at >=). The window is half-open [closed,open).
        test_recipe:
          setup:
            - "Election with early_voting_starts_at='2026-10-20T00:00:00.000Z', early_voting_ends_at='2026-11-02T00:00:00.000Z', election_date='2026-11-03T00:00:00.000Z'"
            - "Election state: OPEN_REGISTRATION"
          trigger:
            - "POST /_clock/advance to 2026-10-20T00:00:00.000Z (exactly start)"
            - "GET /elections/{id}"
            - "POST /_clock/advance to 2026-11-02T00:00:00.000Z (exactly early_voting_ends_at)"
            - "GET /elections/{id}"
          assert:
            - "After clock at start instant: Election.state == 'EARLY_VOTING' (start is inclusive — closed at left)"
            - "After clock at early_voting_ends_at: Election.state == 'ELECTION_DAY' (transition fires at >= early_voting_ends_at; the early-voting window is closed at right too, but a NEW window opens; aggregate of [start, end) describes the EARLY_VOTING state span — open at right because at end-instant the state is no longer EARLY_VOTING)"
            - "Window is half-open: included on the left, excluded on the right (different geometry from cure_deadline below)"

      - name: cure_deadline_strict_inclusive_right
        grounds:
          - calculations.ballot_cure_window_check
          - state_machines.CuringCase.OPEN_PENDING_VOTER_to_UNDER_REVIEW
          - entities.Election.fields.cure_deadline
          - state_machines.CuringCase.OPEN_PENDING_VOTER_to_EXPIRED
        distinguishing_aspect: |
          Distinct interval semantics on a different resource (CuringCase): closed interval semantics
          on submission window. The formula PINS strict > rejection (now > cure_deadline rejects),
          so exactly-equal succeeds (closed at right). Combined with the implicit closed-at-left at
          OPEN_PENDING_VOTER creation, the cure window is a fully-closed [open_at, cure_deadline]
          interval — geometrically different from the half-open early-voting window above.
        test_recipe:
          setup:
            - "Election with cure_deadline='2026-11-10T00:00:00.000Z'"
            - "CuringCase CC1 in OPEN_PENDING_VOTER (created earlier)"
            - "CuringCase CC2 in OPEN_PENDING_VOTER (separate AbsenteeBallot, separate Voter)"
            - "POST /_clock/advance to 2026-11-10T00:00:00.000Z (exactly equal to cure_deadline)"
          trigger:
            - "POST /curing-cases/CC1/submit (exactly at deadline)"
            - "POST /_clock/advance to 2026-11-10T00:00:00.001Z"
            - "POST /curing-cases/CC2/submit (1 millisecond after)"
          assert:
            - "First submit succeeds: CC1.status == 'UNDER_REVIEW' (formula uses strict > so exactly-equal passes — closed at right)"
            - "Second submit fails with error_id == 'ERR_DEADLINE_PASSED'"
            - "Different geometry from early_voting_window_half_open: cure window is [open, deadline] closed-closed, early-voting window is [start, end) closed-open"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: total_registered_active_invariant_on_suspend_then_reactivate
        grounds:
          - entities.Election.fields.total_registered_active
          - state_machines.Voter.ACTIVE_to_SUSPENDED
          - state_machines.Voter.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: Election.total_registered_active. Forward action ACTIVE→SUSPENDED
          decrements by 1; compensating action SUSPENDED→ACTIVE increments by 1. Invariant pinned as:
          total_registered_active == count(Voter where election_id=this AND status=ACTIVE).
        test_recipe:
          setup:
            - "Election with 10 ACTIVE voters; Election.total_registered_active == 10"
          trigger:
            - "POST /voters/V1/state {SUSPENDED}"
            - "POST /voters/V1/state {ACTIVE} (within registration window)"
          assert:
            - "After SUSPEND: Election.total_registered_active == 9"
            - "After REACTIVATE: Election.total_registered_active == 10 (invariant restored exactly)"
            - "Sum check: total_registered_active == COUNT(Voter where status=ACTIVE) at every step"

      - name: ballotcast_status_invariant_on_recount_resolution
        grounds:
          - state_machines.BallotCast.TALLIED_to_CHALLENGED
          - state_machines.BallotCast.CHALLENGED_to_TALLIED
          - state_machines.RecountRequest.APPROVED_to_IN_PROGRESS
          - state_machines.RecountRequest.IN_PROGRESS_to_RESOLVED_NO_CHANGE
        distinguishing_aspect: |
          Different conserved quantity: count(BallotCast where election_id=E AND status IN {TALLIED,
          CHALLENGED}) MUST remain constant across a recount cycle. Forward (RecountRequest APPROVED→
          IN_PROGRESS) flips all TALLIED→CHALLENGED; compensating (IN_PROGRESS→RESOLVED_NO_CHANGE)
          flips all CHALLENGED→TALLIED. The global cardinality of {TALLIED ∪ CHALLENGED} is invariant.
        test_recipe:
          setup:
            - "Election in TALLY with N=50 BallotCast all status=TALLIED"
            - "RecountRequest RR1 REQUESTED → APPROVED"
          trigger:
            - "POST /recounts/RR1/state {IN_PROGRESS}"
            - "POST /recounts/RR1/state {RESOLVED_NO_CHANGE}"
          assert:
            - "Before: count(BallotCast where status='TALLIED') == 50"
            - "After IN_PROGRESS: count(status='CHALLENGED') == 50 AND count('TALLIED') == 0"
            - "After RESOLVED_NO_CHANGE: count('TALLIED') == 50 AND count('CHALLENGED') == 0"
            - "Invariant: |{TALLIED ∪ CHALLENGED}| == 50 at all three steps"
