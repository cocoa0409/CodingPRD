  - section: validations
    instances:

      - name: violation_to_error_each_statutory_and_temporal_gate_maps_to_its_own_code
        claim_type: violation_to_error
        grounds:
          - validations.priority_24_ERR_DUPLICATE_STATE_RULE
          - validations.priority_25_ERR_TERM_EXCEEDS_STATE_MAXIMUM
          - validations.priority_27_ERR_SERVICE_FEE_ABOVE_CAP
          - validations.priority_31_ERR_INVALID_POLICY_TERM
          - validations.priority_33_ERR_INVALID_FIRST_DUE_DATE
          - validations.priority_37_ERR_CLOCK_REWIND
          - validations.priority_38_ERR_PREMIUM_VARIANCE_EXCEEDED
        distinguishing_aspect: |
          Seven rules are violated ONE AT A TIME, each from an otherwise fully legal request, so each
          must surface its own distinct error_id rather than a shared ERR_INVALID_REQUEST. Every
          violation is placed exactly one unit outside its declared bound — installment_count 11 against
          max_term_months 10, service_fee 2001 against a 2000 cap, first due 2026-10-15 against a
          clock+60 window that closes on 2026-10-14, a corrected premium 750001 against a tolerance
          that admits 750000, and a clock rewind of a single day. Collapsing any of these into the
          generic 400 is visible because the specific code is asserted, and the one-unit margins mean a
          rule implemented with the wrong comparison operator fails here rather than passing by luck.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15, so the legal first-installment window is 2026-08-16 through 2026-10-14 inclusive"
            - "the canonical TX regime with an effective License, one Insured, one ProducerAgent, one Insurer"
            - "one legal agreement carrying a single 600000 policy with term 2026-09-01 to 2027-09-01, submitted so it is awaiting attestations"
