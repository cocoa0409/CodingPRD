              as_user_id: "sponsor-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_PLAN_FROZEN with HTTP 409"
            - "EsopPlan.${plan_id}.plan_status == FROZEN and frozen_reason == DOL examination opened."
            - "POST /plans/${plan_id}/rollover, POST /participants for this plan and a second POST /plans/${plan_id}/freeze all return ERR_PLAN_FROZEN (409)"
            - "GET /plans/${plan_id} still returns HTTP 200"
            - "Participant.${p_id}.status == ACTIVE, untouched by the freeze"

