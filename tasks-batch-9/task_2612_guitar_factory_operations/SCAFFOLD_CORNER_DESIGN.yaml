            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 100000 }, as: CustomShopCoordinator }
            - { call: "POST /build-orders/${bo1}/lock-options", payload: {}, as: CustomShopCoordinator }
