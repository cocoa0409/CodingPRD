              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /leasing/pricing-offers/${o2_id}/publish"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
            - call: "POST /leasing/pricing-offers/${o1_id}/retire"
              payload: {}
              as: PropertyManager
            - call: "POST /leasing/pricing-offers/${o2_id}/publish"
              payload: {}
              as: PropertyManager
          assert:
            - "err == ERR_OFFER_ALREADY_PUBLISHED"
            - "after retiring O1 and republishing: PricingOffer.${o2_id}.status == PUBLISHED"
            - "PricingOffer.${o1_id}.status == RETIRED"

