# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3068
# Fractional Collectible Investment Offering & Securitized Asset Administration
#
# 9 rule_id blocks × 2-or-more instances. Every `grounds:` entry resolves to a
# declared element of SCAFFOLD.yaml §1.1–§1.6. Every `setup_api_calls` /
# `trigger` entry is a structured call object whose every ${var} is bound by a
# `captures:` block earlier in the same instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: valuation_legacy_and_restated_diverge_on_an_unvetted_appraisal
        grounds:
          - calculations.appraised_value_per_share
          - calculations.appraised_value_per_share.variants.legacy_provisional
          - calculations.appraised_value_per_share.variants.restated_final
          - entities.Artwork.fields.last_appraised_value_cents
          - endpoints.GET_/api/offerings/{id}/valuation
        distinguishing_aspect: "The two valuation variants read the same Appraisal row set but filter it differently: legacy takes the newest SELECTED appraisal unconditionally, restated takes the newest SELECTED appraisal carrying a PROVENANCE/VERIFIED attestation filed at or before it, so an appraisal filed without new provenance leaves legacy at 2250 cents per share while restated stays at 2000 — the dual variant lives on the valuation metric of the Offering domain."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One artist, one fully authenticated artwork, one offering of 40000 shares at 1500 cents, holding clock unstarted."
            - "One SELECTED appraisal A1 of 80000000 cents filed 2026-09-15 with the provenance attestation already on file from earlier."
            - "One later SELECTED appraisal A2 of 90000000 cents filed 2027-01-05; no provenance report was filed between 2026-09-15 and 2027-01-05."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Hollis Vandermeer", attribution_status: "CONFIRMED", nationality_country_code: "US", birth_year: 1948 }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Untitled (Meridian Field)", artist_id: "${artist_id}", creation_year: 1971, medium: "PAINTING", acquisition_cost_cents: 60000000, reserve_price_cents: 100000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id, artwork_v: $.data.version }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Vandermeer Catalogue Raisonne Committee" }
              as: IssuerOps
            - call: "GET /api/artworks/${artwork_id}"
              payload: {}
              as: IssuerOps
              captures: { artwork_v_ready: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artworks/${artwork_id}/appraisals"
              payload: { appraised_value_cents: 80000000, appraiser_firm: "Ashgrove Fine Art Appraisals", appraisal_method: "AUCTION_COMPARABLE", expected_artwork_version: "${artwork_v_ready}" }
              as: IssuerOps
              captures: { appraisal_a1: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1500, exemption_type: "REG_D_506C", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { offering_id: $.data.id, off_v0: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/artworks/${artwork_id}"
              payload: {}
              as: IssuerOps
              captures: { artwork_v_a2: $.data.version }
            - call: "POST /api/artworks/${artwork_id}/appraisals"
              payload: { appraised_value_cents: 90000000, appraiser_firm: "Ashgrove Fine Art Appraisals", appraisal_method: "AUCTION_COMPARABLE", expected_artwork_version: "${artwork_v_a2}" }
              as: IssuerOps
              captures: { appraisal_a2: $.data.id }
          trigger:
            - call: "GET /api/offerings/${offering_id}/valuation"
              payload: {}
              as: Investor
          assert:
            - "the response status is 200"
            - "valuation.legacy_value_per_share_cents == 2250"
            - "valuation.restated_value_per_share_cents == 2000"
            - "valuation.valuation_delta_cents == 250"
            - "GET /api/artworks/${artwork_id}/appraisals?is_selected=true returns exactly 1 row, appraisal ${appraisal_a2}, with appraised_value_cents == 90000000"
            - "Appraisal.${appraisal_a1}.is_selected == false and Appraisal.${appraisal_a2}.is_selected == true"

      - name: management_fee_presentation_and_settlement_rounding_diverge
        grounds:
          - calculations.held_period_management_fee
          - calculations.held_period_management_fee.variants.calendar_days_diff
          - calculations.held_period_management_fee.variants.inclusive_start_days
          - entities.FeeAccrual.fields.amount_cents
          - endpoints.POST_/api/offerings/{id}/accrue-fees
        distinguishing_aspect: "The same offering and the same clock produce two different fee figures because the presentation variant takes the plain calendar difference (302 days) while the settlement variant adds the start day back (303 days), so the two fields of one FeeAccrual differ on identical inputs; the dual variant lives on the FeeAccrual domain, not on the valuation domain."
        test_recipe:
          setup:
            - "Logical clock at 2027-06-30T00:00:00Z, 302 days after a holding clock started at 2026-09-01T00:00:00Z with hold_period_days 182."
            - "One fully allocated offering of 40000 shares, fee basis acquisition_cost_cents 60000000, management_fee_bps 150."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Hollis Vandermeer", attribution_status: "CONFIRMED", nationality_country_code: "US", birth_year: 1948 }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Untitled (Meridian Field)", artist_id: "${artist_id}", creation_year: 1971, medium: "PAINTING", acquisition_cost_cents: 60000000, reserve_price_cents: 100000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Vandermeer Catalogue Raisonne Committee" }
              as: IssuerOps
            - call: "GET /api/artworks/${artwork_id}"
              payload: {}
              as: IssuerOps
              captures: { artwork_v1: $.data.version }
            - call: "POST /api/artworks/${artwork_id}/appraisals"
              payload: { appraised_value_cents: 80000000, appraiser_firm: "Ashgrove Fine Art Appraisals", appraisal_method: "AUCTION_COMPARABLE", expected_artwork_version: "${artwork_v1}" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1500, exemption_type: "REG_D_506C", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { offering_id: $.data.id, off_v0: $.data.version }
            - call: "POST /api/investors"
              payload: { email: "nadia@x.com", legal_name: "Nadia Okonjo", password: "p", citizenship_country_code: "US", residency_country_code: "GB", birth_date: "1966-04-02", annual_income_cents: 40000000, net_worth_cents: 300000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /api/offerings/${offering_id}/qualification-filing"
              payload: { circular_reference: "CIRC-2026-3068-01", expected_offering_version: "${off_v0}" }
              as: ComplianceOfficer
            - call: "POST /api/subscriptions"
              payload: { offering_id: "${offering_id}", investor_id: "${inv_id}", requested_shares: 4000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/screen"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "GET /api/offerings/${offering_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { off_v_alloc: $.data.version }
            - call: "POST /api/offerings/${offering_id}/allocate"
              payload: { expected_offering_version: "${off_v_alloc}" }
              as: ComplianceOfficer
            - call: "POST /api/offerings/${offering_id}/custody-records"
              payload: { custodian_name: "Delaware Freeport Holdings", facility_code: "DFH-A", is_freeport: true, custodian_dea_registered: true }
              as: IssuerOps
              captures: { custody_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/offerings/${offering_id}"
              payload: {}
              as: IssuerOps
              captures: { off_v_recv: $.data.version }
            - call: "POST /api/custody-records/${custody_id}/receive"
              payload: { expected_offering_version: "${off_v_recv}" }
              as: IssuerOps
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/offerings/${offering_id}/accrue-fees"
              payload: { accrual_type: "MANAGEMENT" }
              as: IssuerOps
          assert:
            - "the response status is 201"
            - "FeeAccrual.basis_value_cents == 60000000"
            - "FeeAccrual.presentation_amount_cents == 433973"
            - "FeeAccrual.settle_amount_cents == 436438"
            - "presentation_amount_cents != settle_amount_cents — the 302-day clock settles on 303 days of fee"
            - "GET /api/offerings/${offering_id}/fee-accruals?accrual_type=MANAGEMENT returns exactly 1 row"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: sale_distribution_waterfall_floors_each_step_before_subtraction
        grounds:
          - calculations.sale_distribution_waterfall
          - calculations.held_period_management_fee
          - calculations.profit_participation
          - entities.Distribution.fields.investor_residual_cents
          - state_machines.Offering.SALE_PENDING_to_CLOSED
          - endpoints.POST_/api/holdings/{id}/execute
        distinguishing_aspect: "Mode (b) nested rounding: the waterfall pins that every one of the four deductions is floored BEFORE it is subtracted, so the residual is 32785480 and not the 32785490 that unrounded subtraction then a final floor would give — the rounding ORDER is what the assertion pins, at three levels of nested flooring over three different bases."
        test_recipe:
          setup:
            - "Logical clock at 2027-06-30T00:00:00Z. One allocated-and-custodied offering of 40000 shares; custody_cost_ledger_cents 12000000; holding clock started 2027-01-05T00:00:00Z with hold_period_days 176, so held_for_days is 176."
            - "One approved SELL holding decision whose proposed_gross_cents is 120000000."
