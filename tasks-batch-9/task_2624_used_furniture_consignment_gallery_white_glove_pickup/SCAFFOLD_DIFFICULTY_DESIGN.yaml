            - "BD collected on a completed 2-mover job from floor 1 (surcharge 27000) and placed in Front A while the clock still reads 2026-08-01T00:00:00Z, so listed_at is exactly the epoch"
            - "the clock is then set to 2026-08-30T00:00:00Z, which is days_on_floor 29, and the markdown epoch is run once"
