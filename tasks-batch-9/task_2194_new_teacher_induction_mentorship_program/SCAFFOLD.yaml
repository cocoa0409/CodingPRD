    side_effects: []
  - method: GET
    path: "/observation-cycles"
    description: "List observation cycles, optionally filtered by match, phase or feedback review status. Reverse lookup for ObservationCycle.match_id -> MentorMatch.id."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, StateCredentialingOfficer]
    code: 200
    input: ["match_id?", "phase?", "feedback_review_status?", "limit?", "offset?"]
    output: "ObservationCycle[]"
    side_effects: []
  - method: POST
    path: "/observation-cycles/{id}/advance"
    description: "Advance an observation cycle along the phase dimension to OBSERVED, POST_CONFERENCE, DOCUMENTED or ABANDONED."
    roles: [Mentor, SiteInductionLead]
    code: 200
