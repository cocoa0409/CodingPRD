          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Applicant A1 Baltic Timber Imports AS (NO) with a USD 50000000 facility FA1, and applicant A2 Suomi Puutuote Oy (FI) with its own USD 50000000 facility FA2."
