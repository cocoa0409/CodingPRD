    input: [plan_id, version_label, scoring_variant, watch_trigger_score_max, remediation_trigger_score_max, cure_margin_points, expense_peer_multiple, min_track_record_quarters, style_drift_r2_floor, watch_grace_quarters, weights, benchmark_map]
    output: InvestmentPolicyStatement
    side_effects:
      - "status = DRAFT"
      - "Rejected with ERR_INVALID_REQUEST unless the five weights sum to exactly 1.00 and remediation_trigger_score_max <= watch_trigger_score_max"

  - method: GET
    path: "/governance/investment-policy-statements"
    description: "List investment policy statement versions, filterable by plan, adopting motion and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["plan_id?", "approving_motion_id?", "status?", "scoring_variant?", "limit?", "offset?"]
    output: InvestmentPolicyStatement[]
    side_effects: []

  - method: GET
    path: "/governance/investment-policy-statements/{ipsId}"
    description: "Read one investment policy statement version with its full criteria set"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: InvestmentPolicyStatement
    side_effects: []

  - method: POST
    path: "/governance/investment-policy-statements/{ipsId}/adopt"
    description: "Adopt a drafted IPS version under a carried motion whose meeting minutes are approved; the prior adopted version is superseded and every other draft on the plan is retired"
    roles: [CommitteeChair]
    code: 200
    input: [approving_motion_id]
    output: InvestmentPolicyStatement
    side_effects:
      - "status DRAFT -> ADOPTED; approving_motion_id pinned"
      - "The plan's previously ADOPTED IPS -> SUPERSEDED; every other DRAFT IPS on the plan -> RETIRED, ordered by created_at ASC"
      - "AssetClassSlot.ips_id values still pointing at the superseded version make their slots stale, so seat-fund on them fails with ERR_IPS_VERSION_STALE until re-pinned"

  # ---------------------------------------------------------- AssetClassSlot
  - method: POST
    path: "/governance/asset-class-slots"
    description: "Create an empty menu slot for an asset class, pinned to the plan's currently adopted IPS version"
    roles: [InvestmentConsultant, PlanSponsorAdmin]
    code: 201
    input: [plan_id, asset_class_code, designation, slot_index]
    output: AssetClassSlot
    side_effects:
      - "status = EMPTY; current_fund_id = null; ips_id = the plan's ADOPTED IPS id"
      - "Rejected with ERR_NO_ADOPTED_IPS when the plan has no ADOPTED IPS, and with ERR_DUPLICATE_RESOURCE on a repeated (plan_id, asset_class_code, designation) or a second QDIA slot"

  - method: GET
    path: "/governance/asset-class-slots"
    description: "List menu slots, filterable by plan, pinned IPS version, seated fund, designation and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: ["plan_id?", "ips_id?", "current_fund_id?", "designation?", "status?", "limit?", "offset?"]
    output: AssetClassSlot[]
    side_effects: []

  - method: GET
    path: "/governance/asset-class-slots/{slotId}"
    description: "Read one menu slot with its seated fund and at-risk history"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: []
    output: AssetClassSlot
    side_effects: []

  - method: POST
    path: "/governance/asset-class-slots/{slotId}/seat-fund"
    description: "Seat a candidate fund in an empty slot, consuming one available menu slot. The fund must satisfy every IPS selection criterion"
    roles: [InvestmentConsultant]
    code: 200
    input: [fund_id]
    output: AssetClassSlot
    side_effects:
      - "status EMPTY -> ACTIVE; current_fund_id = fund_id"
      - "fund.menu_status CANDIDATE -> ACTIVE; fund.credit_accrual_status = ACCRUING; fund.qdia_flag = (designation == QDIA)"
      - "Plan.occupied_menu_slots += 1; Plan.available_menu_slots -= 1; Plan.total_plan_assets_cents recomputed; menu_posture recomputed"

  - method: POST
    path: "/governance/asset-class-slots/{slotId}/retire"
    description: "Retire a menu slot, releasing its capacity and marking any seated fund for removal. A QDIA slot can never be retired"
    roles: [PlanSponsorAdmin]
    code: 200
    input: ["reason?"]
    output: AssetClassSlot
    side_effects:
      - "status {EMPTY, ACTIVE, AT_RISK} -> RETIRED"
      - "Any seated fund menu_status ACTIVE -> PENDING_REMOVAL"
      - "Plan.occupied_menu_slots -= 1 when the slot was counted as occupied; Plan.available_menu_slots += 1; at_risk_slot_ratio and menu_posture recomputed"
      - "Rejected with ERR_QDIA_SLOT_REQUIRED for a QDIA slot and with ERR_SLOT_HAS_OPEN_PROPOSAL when a non-terminal proposal targets it"

  # -------------------------------------------------------------------- Fund
  - method: POST
    path: "/governance/funds"
    description: "Register a fund in the plan's candidate universe with its expense, revenue-sharing, style and manager data; target-date suites carry glidepath fields"
    roles: [InvestmentConsultant, Recordkeeper]
    code: 201
    input: [plan_id, ticker, fund_name, asset_class_code, share_class_code, gross_expense_ratio_bps, net_expense_ratio_bps, revenue_share_bps, peer_median_expense_bps, track_record_quarters, manager_tenure_quarters, manager_change_flag, style_drift_r2, "plan_assets_cents?", "is_target_date_suite?", "glidepath_type?", "construction?", "equity_at_65_pct?", "landing_point_age?"]
    output: Fund
    side_effects:
      - "menu_status = CANDIDATE; watch_status = CLEAR; consecutive_breach_quarters = 0; credit_accrual_status = NOT_ACCRUING; qdia_flag = false"
      - "glidepath_fit_score computed when is_target_date_suite == true (calculations.glidepath_fit_score)"
      - "Plan.total_plan_assets_cents recomputed; Plan.revenue_credit_accrued_cents unchanged until the fund is seated"
      - "Rejected with ERR_DUPLICATE_RESOURCE on a repeated (plan_id, ticker), and with ERR_INVALID_REQUEST when net_expense_ratio_bps > gross_expense_ratio_bps or a target-date suite omits any glidepath field"

  - method: GET
    path: "/governance/funds"
    description: "List funds, filterable by plan, asset class, menu status, watch status and target-date flag"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: ["plan_id?", "asset_class_code?", "menu_status?", "watch_status?", "is_target_date_suite?", "share_class_code?", "limit?", "offset?"]
    output: Fund[]
    side_effects: []

  - method: GET
    path: "/governance/funds/{fundId}"
    description: "Read one fund with its scoring inputs, watch state, glidepath data and revenue-credit ledger fields"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: []
    output: Fund
    side_effects: []

  - method: PATCH
    path: "/governance/funds/{fundId}"
    description: "Update a fund's monitoring data (expense, peer median, style drift, tenure, manager change flag, assets) as fresh data arrives from the recordkeeper"
    roles: [Recordkeeper, InvestmentConsultant]
    code: 200
    input: ["gross_expense_ratio_bps?", "net_expense_ratio_bps?", "revenue_share_bps?", "peer_median_expense_bps?", "track_record_quarters?", "manager_tenure_quarters?", "manager_change_flag?", "style_drift_r2?", "plan_assets_cents?", "equity_at_65_pct?", "landing_point_age?"]
    output: Fund
    side_effects:
      - "glidepath_fit_score recomputed for target-date suites; Plan.total_plan_assets_cents recomputed when plan_assets_cents changed"
      - "Never changes menu_status or watch_status — those move only through review finalize, replacement execution and slot actions"

  - method: POST
    path: "/governance/funds/{fundId}/share-class-change"
    description: "Move a fund to a cheaper share class as part of the revenue-sharing review; the new class must be strictly cheaper and must not raise revenue sharing"
    roles: [InvestmentConsultant, Recordkeeper]
    code: 200
    input: [share_class_code, net_expense_ratio_bps, gross_expense_ratio_bps, revenue_share_bps]
    output: Fund
    side_effects:
      - "share_class_code, expense ratios and revenue_share_bps replaced; accrued_revenue_credit_cents retained"
      - "Rejected with ERR_SHARE_CLASS_INELIGIBLE when the new net expense ratio is not strictly lower, when revenue sharing would rise, or when the fund sits inside an APPROVED or NOTICE_ISSUED replacement proposal"

  - method: POST
    path: "/governance/funds/{fundId}/target-date-selection"
    description: "Seat the winning target-date suite in the plan's QDIA slot under a carried TARGET_DATE_SELECTION motion. The winner is chosen by the deterministic selector, and the fundId in the path must be that winner"
    roles: [CommitteeChair]
    code: 200
    input: [approving_motion_id, glidepath_type]
    output: Fund
    side_effects:
      - "The selector (calculations.target_date_suite_selection) ranks the eligible pool; when the path fund is not the top-ranked candidate the request fails with ERR_INVALID_REQUEST naming the winner"
      - "The plan's QDIA slot: current_fund_id = fundId, status EMPTY -> ACTIVE (or the fund replaces the prior QDIA occupant, whose menu_status ACTIVE -> PENDING_REMOVAL)"
      - "fund.menu_status CANDIDATE -> ACTIVE; fund.qdia_flag = true; credit_accrual_status = ACCRUING"
      - "Empty eligible pool -> 422 ERR_NO_ELIGIBLE_TARGET_DATE_SUITE with nothing mutated"

  # --------------------------------------------------------- QuarterlyReview
  - method: POST
    path: "/governance/quarterly-reviews"
    description: "Open a quarterly investment review for a quarter, pinning the plan's adopted IPS version and its scoring variant for the whole review"
    roles: [InvestmentConsultant]
    code: 201
    input: [plan_id, quarter_index, "meeting_id?"]
    output: QuarterlyReview
    side_effects:
      - "status = DRAFT; ips_id = the plan's ADOPTED IPS id; scoring_variant copied from that IPS; reopen_count = 0"
      - "Rejected with ERR_NO_ADOPTED_IPS without an adopted IPS and with ERR_DUPLICATE_RESOURCE on a repeated (plan_id, quarter_index)"

  - method: GET
    path: "/governance/quarterly-reviews"
    description: "List quarterly reviews, filterable by plan, pinned IPS version, meeting, quarter and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["plan_id?", "ips_id?", "meeting_id?", "quarter_index?", "status?", "limit?", "offset?"]
    output: QuarterlyReview[]
    side_effects: []

  - method: GET
    path: "/governance/quarterly-reviews/{reviewId}"
    description: "Read one quarterly review with its scorecard counts, pinned IPS version and finalization stamps"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: QuarterlyReview
    side_effects: []

  - method: POST
    path: "/governance/quarterly-reviews/{reviewId}/present"
    description: "Present the review to the committee in session, locking its scorecard set. Requires full slot coverage and a quorate meeting"
    roles: [InvestmentConsultant]
    code: 200
    input: ["meeting_id?"]
    output: QuarterlyReview
    side_effects:
      - "status SCORING -> PENDING_MINUTES; meeting_id pinned when supplied"
      - "No new or superseding scorecards are accepted afterwards (ERR_REVIEW_NOT_SCORING)"

  - method: POST
    path: "/governance/quarterly-reviews/{reviewId}/finalize"
    description: "Finalize the review, writing composite scores onto the funds and driving the full watch-list, slot, posture and proposal cascade. Requires approved minutes for the presenting meeting"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: QuarterlyReview
    side_effects:
      - "hop 0: status PENDING_MINUTES -> FINALIZED; finalized_at and finalized_quarter_index stamped; each scored Fund.latest_composite_score and last_scored_quarter_index written"
      - "hop 1: each scored Fund.watch_status escalates or cures per calculations.watch_recommendation, snapshotting watch_status_before_last_review and menu_status_before_last_review; TERMINATE also moves menu_status ACTIVE -> PENDING_REMOVAL; watch_additions_count set"
      - "hop 2: each AssetClassSlot seating an escalated fund goes ACTIVE -> AT_RISK (status_before_last_review snapshotted); cured funds return their slot AT_RISK -> ACTIVE"
      - "hop 3: Plan.at_risk_slot_ratio recomputed and menu_posture moves OPEN -> RESTRICTED at >= 0.2500 and -> FROZEN at >= 0.5000"
      - "hop 4: every FundReplacementProposal in {DRAFT, UNDER_REVIEW, REVISION_REQUESTED} caught by the new posture -> BLOCKED with pre_block_status snapshotted, iterated by slot_index ASC then created_at ASC"

  - method: POST
    path: "/governance/quarterly-reviews/{reviewId}/reopen"
    description: "Reopen a finalized review, exactly reversing every hop of the finalize cascade from the stored snapshots. Limited to the current or immediately prior quarter, twice per review, and only while no authorised decision has been approved or executed"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [reason]
    output: QuarterlyReview
    side_effects:
      - "status FINALIZED -> REOPENED; reopen_count += 1; finalized_at = null"
      - "Every Fund with last_scored_quarter_index == review.quarter_index restores watch_status and menu_status from its snapshots and decrements consecutive_breach_quarters with a floor of 0; latest_composite_score reverts to the value from the most recent earlier FINALIZED review, or null"
      - "Every AssetClassSlot restores status from status_before_last_review"
      - "Plan.at_risk_slot_ratio and menu_posture recomputed; BLOCKED proposals restored to pre_block_status when the posture relaxes to OPEN"
      - "Rejected with ERR_QUARTER_CLOSED, ERR_REOPEN_LIMIT_REACHED or ERR_REVIEW_DECISIONS_EXECUTED"

  # ------------------------------------------------------------ FundScorecard
  - method: POST
    path: "/governance/fund-scorecards"
    description: "Submit a fund scorecard into a review, computing the composite score and watch recommendation. A second submission for the same review and fund supersedes the first. Requires the caller's expected_review_version to match the review's current version"
    roles: [InvestmentConsultant]
    code: 201
    input: [review_id, fund_id, expected_review_version, trailing_return_3y_bps, trailing_return_5y_bps, benchmark_return_3y_bps, benchmark_return_5y_bps, "rolling_since_watch_return_bps?", "rolling_since_watch_benchmark_bps?", peer_rank_pct, style_drift_r2, net_expense_ratio_bps, peer_median_expense_bps, manager_tenure_quarters, manager_change_flag]
    output: FundScorecard
    side_effects:
      - "The five components, composite_score and watch_recommendation computed under the review's pinned scoring_variant (calculations.fund_composite_score, calculations.watch_recommendation)"
      - "Any prior SUBMITTED scorecard for the same (review_id, fund_id) -> SUPERSEDED and is referenced by supersedes_scorecard_id"
      - "review.status DRAFT -> SCORING or REOPENED -> SCORING on the first scorecard after opening or reopening; scorecard_count and submitted_scorecard_count recomputed"
      - "increments QuarterlyReview.version by 1"
      - "Rejected with 412 ERR_STALE_REVIEW_VERSION on a version mismatch, and with ERR_REVIEW_NOT_SCORING (409, checked first) once the review is PENDING_MINUTES or FINALIZED"

  - method: GET
    path: "/governance/fund-scorecards"
    description: "List fund scorecards, filterable by review, fund, superseded predecessor, recommendation and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["review_id?", "fund_id?", "supersedes_scorecard_id?", "watch_recommendation?", "status?", "limit?", "offset?"]
    output: FundScorecard[]
    side_effects: []

  - method: GET
    path: "/governance/fund-scorecards/{scorecardId}"
    description: "Read one fund scorecard with every component score and the recommendation it produced"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: FundScorecard
    side_effects: []

  # -------------------------------------------------------- CommitteeMeeting
  - method: POST
    path: "/governance/committee-meetings"
    description: "Schedule a committee meeting for a quarter"
    roles: [PlanSponsorAdmin, CommitteeChair]
    code: 201
    input: [plan_id, meeting_date, quarter_index]
    output: CommitteeMeeting
    side_effects:
      - "status = SCHEDULED; attendee_member_ids = []; quorum_met = false; carried_motion_count = 0"

  - method: GET
    path: "/governance/committee-meetings"
    description: "List committee meetings, filterable by plan, quarter, status and quorum outcome"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["plan_id?", "quarter_index?", "status?", "quorum_met?", "limit?", "offset?"]
    output: CommitteeMeeting[]
    side_effects: []

  - method: GET
    path: "/governance/committee-meetings/{meetingId}"
    description: "Read one committee meeting with its attendance roster, frozen quorum figures and minutes reference"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: CommitteeMeeting
    side_effects: []

  - method: POST
    path: "/governance/committee-meetings/{meetingId}/convene"
    description: "Convene the meeting with an attendance roster, freezing the quorum determination and the charter version. Only one meeting per plan may be in session"
    roles: [CommitteeChair]
    code: 200
    input: [attendee_member_ids]
    output: CommitteeMeeting
    side_effects:
      - "status SCHEDULED -> IN_SESSION"
      - "eligible_voting_seat_count, voting_attendee_count and quorum_met computed and frozen (calculations.quorum_evaluation); charter_version_pinned = Plan.version"
      - "Convening without quorum is allowed and recorded; it blocks presenting a review, closing a motion and approving minutes"
      - "Rejected with ERR_CHARTER_NOT_ADOPTED, ERR_MEETING_IN_SESSION, ERR_CHAIR_NOT_PRESENT or ERR_TRAINING_NOT_CURRENT"

  - method: POST
    path: "/governance/committee-meetings/{meetingId}/adjourn"
    description: "Adjourn the meeting, withdrawing every motion still open"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: CommitteeMeeting
    side_effects:
      - "status IN_SESSION -> ADJOURNED"
      - "Every Motion on this meeting with status == OPEN -> WITHDRAWN with closed_at stamped, ordered by created_at ASC"

  - method: POST
    path: "/governance/committee-meetings/{meetingId}/minutes-approve"
    description: "Approve the meeting minutes, the documentation gate every fiduciary decision from this meeting depends on"
    roles: [CommitteeChair]
    code: 200
    input: [minutes_doc_ref]
    output: CommitteeMeeting
    side_effects:
      - "status ADJOURNED -> MINUTES_APPROVED; minutes_approved_at stamped; carried_motion_count frozen"
      - "Unlocks IPS adoption, replacement approval, levelization approval, RFP award and review finalization for motions carried at this meeting"
      - "Rejected with ERR_QUORUM_NOT_MET when the meeting was inquorate, and with ERR_CHAIR_NOT_PRESENT when the acting chair was not on the roster or is no longer ACTIVE"

  # ----------------------------------------------------------------- Motion
  - method: POST
    path: "/governance/motions"
    description: "Move a motion in a meeting in session, freezing its tally basis, carried threshold and eligible voter count"
    roles: [CommitteeChair, CommitteeMember]
    code: 201
    input: [meeting_id, subject_type, subject_id, tally_basis, "carried_threshold_pct?"]
    output: Motion
    side_effects:
      - "status = OPEN; votes = []; all four vote counters = 0"
      - "carried_threshold_pct defaults to Plan.voting_threshold_pct; eligible_voter_count copied from meeting.eligible_voting_seat_count"
      - "subject_provider_role populated from the subject engagement when subject_type == RFP_AWARD, so the recusal rule can be evaluated per vote"
      - "Rejected with ERR_MEETING_NOT_IN_SESSION unless the meeting is IN_SESSION, and with ERR_RESOURCE_NOT_FOUND when subject_id does not resolve within subject_type"

  - method: GET
    path: "/governance/motions"
    description: "List motions, filterable by meeting, subject type, subject id and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: ["meeting_id?", "subject_type?", "subject_id?", "status?", "tally_basis?", "limit?", "offset?"]
    output: Motion[]
    side_effects: []

  - method: GET
    path: "/governance/motions/{motionId}"
    description: "Read one motion with its full vote roll, counters and support percentage"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, PlanAuditor]
    code: 200
    input: []
    output: Motion
    side_effects: []

  - method: POST
    path: "/governance/motions/{motionId}/votes"
    description: "Cast the acting member's own vote on an open motion. A later vote from the same member replaces the earlier one"
    roles: [CommitteeChair, CommitteeMember]
    code: 200
    input: [member_id, vote, "recusal_basis?"]
    output: Motion
    side_effects:
      - "The vote is appended to motion.votes with cast_at stamped, replacing any prior entry for the same member_id; the four counters and votes_cast_count are recomputed"
      - "Rejected with ERR_ACTOR_NOT_SELF when member_id != X-User-ID, ERR_TRAINING_NOT_CURRENT when the member is not ACTIVE with current training, and ERR_RECUSAL_REQUIRED when a conflicted member votes anything other than RECUSE"

  - method: POST
    path: "/governance/motions/{motionId}/close"
    description: "Close an open motion, freezing the tally under its variant and carrying or failing it"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Motion
    side_effects:
      - "support_pct computed (calculations.motion_tally); status OPEN -> CARRIED when support_pct >= carried_threshold_pct, else OPEN -> FAILED; closed_at stamped"
      - "CARRIED increments meeting.carried_motion_count"
      - "A FAILED motion whose subject_type == FUND_REPLACEMENT moves the subject proposal UNDER_REVIEW -> REJECTED"
      - "Rejected with ERR_QUORUM_NOT_MET on an inquorate meeting and ERR_NO_ELIGIBLE_VOTERS when the tally denominator is zero"

  # ------------------------------------------------ FundReplacementProposal
  - method: POST
    path: "/governance/fund-replacements"
    description: "Draft a fund replacement proposal for a slot with a mapping strategy. Requires the caller's expected_plan_version to match the plan's current version, and supersedes any prior draft on the same slot"
    roles: [InvestmentConsultant]
    code: 201
    input: [plan_id, slot_id, outgoing_fund_id, incoming_fund_id, mapping_strategy, rationale, expected_plan_version]
    output: FundReplacementProposal
    side_effects:
      - "status = DRAFT; revision_round = 0; pinned_ips_id = the plan's ADOPTED IPS id; pinned_plan_version = Plan.version; notice_lead_days_required computed (calculations.notice_lead_days)"
      - "Every prior FundReplacementProposal on the same slot_id with status == DRAFT -> WITHDRAWN with superseded_by_proposal_id set, ordered by created_at ASC"
      - "Plan.draft_proposal_count recomputed; increments Plan.version by 1"
      - "Rejected with 412 ERR_STALE_PLAN_VERSION on a version mismatch, ERR_MENU_FROZEN under a frozen posture, and ERR_ASSET_CLASS_MISMATCH when the incoming fund's asset class does not match the slot"

  - method: GET
    path: "/governance/fund-replacements"
    description: "List fund replacement proposals, filterable by plan, slot, outgoing and incoming fund, authorising motion, superseding proposal, pinned IPS version and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: ["plan_id?", "slot_id?", "outgoing_fund_id?", "incoming_fund_id?", "approving_motion_id?", "superseded_by_proposal_id?", "pinned_ips_id?", "mapping_strategy?", "status?", "limit?", "offset?"]
    output: FundReplacementProposal[]
    side_effects: []

  - method: GET
    path: "/governance/fund-replacements/{proposalId}"
    description: "Read one fund replacement proposal with its mapping strategy, notice lead time, blackout window and pinned versions"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: []
    output: FundReplacementProposal
    side_effects: []

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/submit"
    description: "Submit a drafted proposal for committee review, re-validating the incoming fund against the adopted IPS and recomputing the notice lead time"
    roles: [InvestmentConsultant]
    code: 200
    input: []
    output: FundReplacementProposal
    side_effects:
      - "status DRAFT -> UNDER_REVIEW; pinned_ips_id and pinned_plan_version refreshed; notice_lead_days_required computed"
      - "Plan.draft_proposal_count -= 1"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/request-revision"
    description: "Send a proposal back to the consultant for revision, at most three times"
    roles: [CommitteeChair]
    code: 200
    input: [revision_note]
    output: FundReplacementProposal
    side_effects:
      - "status UNDER_REVIEW -> REVISION_REQUESTED; revision_round += 1"
      - "Rejected with ERR_REVISION_LIMIT_REACHED once revision_round would reach 3"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/revise"
    description: "Resubmit a revised proposal, optionally changing the incoming fund or mapping strategy"
    roles: [InvestmentConsultant]
    code: 200
    input: ["incoming_fund_id?", "mapping_strategy?", "rationale?"]
    output: FundReplacementProposal
    side_effects:
      - "status REVISION_REQUESTED -> UNDER_REVIEW; notice_lead_days_required recomputed; pinned_plan_version refreshed"
      - "The incoming fund is re-checked against pinned_ips_id, not against a newer adopted IPS"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/approve"
    description: "Approve a proposal under a carried motion with approved minutes, reserving the slot and withdrawing every competing proposal on it"
    roles: [CommitteeChair]
    code: 200
    input: [approving_motion_id]
    output: FundReplacementProposal
    side_effects:
      - "status UNDER_REVIEW -> APPROVED; approving_motion_id pinned"
      - "slot.status {ACTIVE, AT_RISK} -> PENDING_REPLACEMENT; Plan.reserved_menu_slots += 1; Plan.available_menu_slots -= 1"
      - "Every other non-terminal proposal on the same slot_id -> WITHDRAWN with superseded_by_proposal_id set, ordered by created_at ASC"
      - "Rejected with ERR_MOTION_NOT_CARRIED, ERR_MINUTES_NOT_APPROVED, ERR_IPS_VERSION_STALE, ERR_MENU_CAPACITY_EXHAUSTED or ERR_MENU_FROZEN"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/rescind-approval"
    description: "Rescind an approval before any participant notice was issued, exactly restoring the slot state and the plan capacity triple"
    roles: [CommitteeChair]
    code: 200
    input: [reason]
    output: FundReplacementProposal
    side_effects:
      - "status APPROVED -> UNDER_REVIEW; approving_motion_id = null (the carried motion is spent)"
      - "slot.status PENDING_REPLACEMENT -> ACTIVE when the seated fund's watch_status == CLEAR, else -> AT_RISK"
      - "Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1, restoring the triple to its pre-approve values"
      - "Rejected with ERR_NOTICE_ALREADY_ISSUED once notice_delivered_at is set"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/notice-issue"
    description: "Issue the participant notice and reserve the mapping blackout window. The window must not overlap another live mapping on the plan and must start no earlier than the notice period allows"
    roles: [Recordkeeper]
    code: 200
    input: [blackout_start_at, blackout_end_at]
    output: FundReplacementProposal
    side_effects:
      - "status APPROVED -> NOTICE_ISSUED; notice_delivered_at = clock now; the half-open window [blackout_start_at, blackout_end_at) is reserved"
      - "Rejected with ERR_BLACKOUT_WINDOW_CONFLICT on an overlap, ERR_NOTICE_PERIOD_NOT_ELAPSED when the window starts too soon, and ERR_FEE_DISCLOSURE_RESTATEMENT_REQUIRED when the plan's fee disclosure is under restatement"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/execute"
    description: "Execute the mapping inside the blackout window, moving participant assets and driving the removal cascade through the credit ledger, levelization runs, fee disclosure and open fee motions"
    roles: [Recordkeeper]
    code: 200
    input: []
    output: FundReplacementProposal
    side_effects:
      - "hop 0: status NOTICE_ISSUED -> EXECUTED; mapped_assets_cents captured and moved per calculations.mapped_assets_transfer; slot.current_fund_id = incoming_fund_id; slot PENDING_REPLACEMENT -> ACTIVE; incoming fund CANDIDATE -> ACTIVE; outgoing fund -> REMOVED; Plan.reserved_menu_slots -= 1; Plan.available_menu_slots += 1"
      - "hop 1: outgoing fund credit_accrual_status ACCRUING -> CLOSED_OUT and qdia_flag = false"
      - "hop 2: every APPROVED FeeLevelizationRun whose pool_fund_ids contains the outgoing fund -> RECALC_REQUIRED"
      - "hop 3: Plan.fee_disclosure_status COMPLIANT -> RESTATEMENT_REQUIRED"
      - "hop 4: every OPEN Motion on the plan with subject_type == FEE_LEVELIZATION -> TABLED, ordered by created_at ASC"
      - "Rejected with ERR_NOTICE_PERIOD_NOT_ELAPSED before the lead time expires and ERR_BLACKOUT_WINDOW_CONFLICT outside the window"

  - method: POST
    path: "/governance/fund-replacements/{proposalId}/unwind"
    description: "Unwind an executed mapping while still inside the blackout window, restoring the outgoing fund, the slot and the plan-wide asset total to the cent"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [reason]
    output: FundReplacementProposal
    side_effects:
      - "status EXECUTED -> UNWOUND; the receiving fund gives back mapped_assets_cents and the outgoing fund is restored to exactly that figure, so the plan-wide asset sum is unchanged"
      - "Outgoing fund menu_status REMOVED -> ACTIVE and credit_accrual_status CLOSED_OUT -> ACCRUING; incoming fund ACTIVE -> CANDIDATE; slot.current_fund_id = outgoing_fund_id with status ACTIVE"
      - "Plan.fee_disclosure_status RESTATEMENT_REQUIRED -> COMPLIANT only when no other EXECUTED proposal on the plan is still inside its blackout window; RECALC_REQUIRED runs stay RECALC_REQUIRED"
      - "Rejected with ERR_UNWIND_WINDOW_CLOSED once the clock reaches blackout_end_at"

  # ------------------------------------------------------ FeeLevelizationRun
  - method: POST
    path: "/governance/fee-levelization-runs"
    description: "Draft a fee levelization run for a quarter over a pool of revenue-sharing funds, under a per-capita or pro-rata method"
    roles: [InvestmentConsultant, Recordkeeper]
    code: 201
    input: [plan_id, quarter_index, method, credit_pool_cents, pool_fund_ids]
    output: FeeLevelizationRun
    side_effects:
      - "status = DRAFT; allocation_lines, per_account_cents, allocated_total_cents and remainder_cents computed (calculations.levelized_fee_allocation)"
      - "Rejected with ERR_NO_PARTICIPANT_ACCOUNTS for a PER_CAPITA run on a plan with no participant accounts, and with ERR_POOL_FUND_INELIGIBLE when a pool fund is not accruing"

  - method: GET
    path: "/governance/fee-levelization-runs"
    description: "List fee levelization runs, filterable by plan, authorising motion, quarter, method and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: ["plan_id?", "approving_motion_id?", "quarter_index?", "method?", "status?", "limit?", "offset?"]
    output: FeeLevelizationRun[]
    side_effects: []

  - method: GET
    path: "/governance/fee-levelization-runs/{runId}"
    description: "Read one fee levelization run with its allocation lines, allocated total and retained remainder"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: []
    output: FeeLevelizationRun
    side_effects: []

  - method: POST
    path: "/governance/fee-levelization-runs/{runId}/approve"
    description: "Approve a levelization run under a carried motion with approved minutes, freezing its allocation lines"
    roles: [CommitteeChair]
    code: 200
    input: [approving_motion_id]
    output: FeeLevelizationRun
    side_effects:
      - "status DRAFT -> APPROVED; allocation figures frozen"
      - "Rejected with ERR_MOTION_NOT_CARRIED, ERR_MINUTES_NOT_APPROVED, ERR_QUARTER_CLOSED or ERR_CREDIT_POOL_INSUFFICIENT"

  - method: POST
    path: "/governance/fee-levelization-runs/{runId}/post"
    description: "Post an approved run to the credit ledger, moving each pool fund's accrued credit into its levelized credit and charging the plan's allocated total"
    roles: [Recordkeeper]
    code: 200
    input: []
    output: FeeLevelizationRun
    side_effects:
      - "status APPROVED -> POSTED; posted_at stamped"
      - "Plan.revenue_credit_allocated_cents += allocated_total_cents and revenue_credit_balance_cents = accrued - allocated (calculations.revenue_credit_ledger)"
      - "Each pool fund's levelized_credit_cents += its line amount and accrued_revenue_credit_cents -= that amount"
      - "Rejected with ERR_ALLOCATION_NOT_BALANCED, ERR_CREDIT_POOL_INSUFFICIENT or ERR_FEE_DISCLOSURE_RESTATEMENT_REQUIRED"

  - method: POST
    path: "/governance/fee-levelization-runs/{runId}/reverse"
    description: "Reverse a posted run within one quarter, restoring the plan and per-fund credit figures line by line"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [reason]
    output: FeeLevelizationRun
    side_effects:
      - "status POSTED -> REVERSED; reversed_at stamped"
      - "Plan.revenue_credit_allocated_cents -= allocated_total_cents and every pool fund's two credit figures restored from allocation_lines, so accrued - allocated == balance still holds"
      - "Rejected with ERR_QUARTER_CLOSED beyond one quarter after the run's quarter"

  - method: POST
    path: "/governance/fee-levelization-runs/{runId}/recompute"
    description: "Recompute a run flagged for recalculation, pruning removed funds from the pool and clearing its spent motion"
    roles: [InvestmentConsultant]
    code: 200
    input: ["method?", "credit_pool_cents?"]
    output: FeeLevelizationRun
    side_effects:
      - "status RECALC_REQUIRED -> DRAFT; pool_fund_ids pruned to funds still ACCRUING; approving_motion_id = null"
      - "allocation_lines, per_account_cents, allocated_total_cents and remainder_cents recomputed under the (possibly changed) method"
      - "Rejected with ERR_QUARTER_CLOSED outside the run's own quarter"

  # ------------------------------------------- ServiceProviderEngagement
  - method: POST
    path: "/governance/service-provider-engagements"
    description: "Register a recordkeeper, advisor, auditor or custodian engagement for a term, pending benchmarking"
    roles: [PlanSponsorAdmin]
    code: 201
    input: [plan_id, provider_name, provider_role, term_start_date, term_end_date, per_head_fee_cents, asset_based_bps, "benchmark_percentile?", "last_rfp_quarter_index?"]
    output: ServiceProviderEngagement
    side_effects:
      - "status = PENDING; gross_cost_bps, fee_credit_tier, total_cost_bps and rfp_required left unset until the first benchmark"
      - "Rejected with ERR_ENGAGEMENT_TERM_OVERLAP when the term overlaps a live engagement of the same provider_role on the plan"

  - method: GET
    path: "/governance/service-provider-engagements"
    description: "List provider engagements, filterable by plan, successor engagement, authorising motion, role, tier and status"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: ["plan_id?", "successor_engagement_id?", "approving_motion_id?", "provider_role?", "fee_credit_tier?", "status?", "rfp_required?", "limit?", "offset?"]
    output: ServiceProviderEngagement[]
    side_effects: []

  - method: GET
    path: "/governance/service-provider-engagements/{engagementId}"
    description: "Read one provider engagement with its benchmarked cost figures, fee credit tier and RFP trigger state"
    roles: [PlanSponsorAdmin, CommitteeChair, CommitteeMember, InvestmentConsultant, Recordkeeper, PlanAuditor]
    code: 200
    input: []
    output: ServiceProviderEngagement
    side_effects: []

  - method: POST
    path: "/governance/service-provider-engagements/{engagementId}/benchmark"
    description: "Benchmark an engagement against peers, deriving gross cost, fee credit tier, total cost and whether a request for proposal is required"
    roles: [InvestmentConsultant]
    code: 200
    input: [benchmark_percentile]
    output: ServiceProviderEngagement
    side_effects:
      - "gross_cost_bps, fee_credit_tier, total_cost_bps and rfp_required computed in the pinned pass order (calculations.total_provider_cost_bps); last_benchmarked_quarter_index = Plan.fiscal_quarter_index"
      - "status PENDING -> ACTIVE on the first benchmark; ACTIVE -> ACTIVE on a re-benchmark in a later quarter; ACTIVE -> UNDER_RFP when rfp_required becomes true; UNDER_RFP -> ACTIVE when it becomes false"
      - "Rejected with ERR_BENCHMARK_ALREADY_CURRENT in the same quarter as the last benchmark, ERR_NO_PLAN_ASSETS on a plan with no assets, and ERR_ENGAGEMENT_TERM_OVERLAP on activation into an occupied role window"

  - method: POST
    path: "/governance/service-provider-engagements/{engagementId}/rfp-award"
    description: "Award the request for proposal to a pending successor engagement under a carried motion with approved minutes, superseding the incumbent"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [approving_motion_id, successor_engagement_id]
    output: ServiceProviderEngagement
    side_effects:
      - "status UNDER_RFP -> SUPERSEDED; successor_engagement_id pinned; this row's term_end_date clamped to the successor's term_start_date minus one day"
      - "The successor PENDING -> ACTIVE with last_rfp_quarter_index = Plan.fiscal_quarter_index"
      - "Rejected with ERR_MOTION_NOT_CARRIED, ERR_MINUTES_NOT_APPROVED or ERR_RECUSAL_REQUIRED when a member affiliated with this provider_role voted FOR"

  - method: POST
    path: "/governance/service-provider-engagements/{engagementId}/terminate"
    description: "Terminate an engagement; a plan may never be left without a recordkeeper and never mid-mapping"
    roles: [PlanSponsorAdmin]
    code: 200
    input: [reason]
    output: ServiceProviderEngagement
    side_effects:
      - "status {PENDING, ACTIVE} -> TERMINATED; term_end_date clamped to the current logical date when it was later"
      - "Rejected with ERR_RECORDKEEPER_REQUIRED for a sole recordkeeper and ERR_ENGAGEMENT_HAS_PENDING_MAPPING while a NOTICE_ISSUED proposal is outstanding"

errors:
  # --- auth / authorization ---
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-ID or X-User-Role header absent, empty, or X-User-Role not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_ACTOR_NOT_COMMITTEE_MEMBER
    http: 403
    condition: "X-User-ID does not resolve to a CommitteeMember on the target plan, or a CommitteeChair caller's seat_class is not CHAIR"
  - id: ERR_ACTOR_NOT_SELF
    http: 403
    condition: "A member action was attempted on another member's behalf — vote member_id or acceptance target does not equal X-User-ID"

  # --- existence / referential ---
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id or body reference does not resolve to a live row, checked left-to-right in the path then in declared body-field order"
  - id: ERR_CROSS_PLAN_REFERENCE
    http: 422
    condition: "Two or more referenced rows in one request belong to different plans"
  - id: ERR_MOTION_SUBJECT_MISMATCH
    http: 422
    condition: "A motion's subject_id does not resolve within its subject_type, or an approving motion's subject does not match the row being approved"
  - id: ERR_OUTGOING_FUND_MISMATCH
    http: 422
    condition: "A replacement proposal's outgoing_fund_id is not the fund currently seated in slot_id"
  - id: ERR_ASSET_CLASS_MISMATCH
    http: 422
    condition: "The fund's asset_class_code does not equal the slot's, or a non-target-date fund was offered to a QDIA slot"
  - id: ERR_QDIA_REQUIRES_TARGET_DATE_SUITE
    http: 422
    condition: "A QDIA slot was given a fund with is_target_date_suite == false, or a REENROLLMENT mapping was attempted on a plan with no QDIA slot"
  - id: ERR_POOL_FUND_INELIGIBLE
    http: 422
    condition: "A fee-levelization pool fund is not on this plan or its credit_accrual_status is not ACCRUING"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Field domain, scale, enum, interval or length constraint violated; also raised when a target-date-selection names a fund that is not the top-ranked candidate"
  - id: ERR_IPS_WEIGHTS_INVALID
    http: 400
    condition: "The five IPS scoring weights do not sum to exactly 1.00, or remediation_trigger_score_max exceeds watch_trigger_score_max"

  # --- state ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared from the row's current state in §1.2"
  - id: ERR_CHARTER_NOT_ADOPTED
    http: 409
    condition: "A committee action was attempted while Plan.charter_status is DRAFT or SUPERSEDED"
  - id: ERR_CHARTER_SEATS_INSUFFICIENT
    http: 409
    condition: "Charter adoption would leave fewer filled voting seats than quorum_min_voting_members"
  - id: ERR_VOTING_SEATS_EXCEEDED
    http: 409
    condition: "Creating a voting seat would exceed Plan.max_voting_seats"
  - id: ERR_SEAT_NOT_VACANT
    http: 409
    condition: "An appointment targeted a seat whose status is not VACANT"
  - id: ERR_SEAT_NOT_ACTIVE
    http: 409
    condition: "A member action was attempted on a SUSPENDED or RETIRED seat"
  - id: ERR_TERM_NOT_IN_EFFECT
    http: 409
    condition: "The acting member's closed term interval does not contain the current logical date"
  - id: ERR_ACCEPTANCE_ALREADY_SIGNED
    http: 409
    condition: "A second fiduciary acceptance was submitted for a member whose acceptance_signed_at is already set"
  - id: ERR_FIDUCIARY_ACCEPTANCE_MISSING
    http: 409
    condition: "Activation attempted without acceptance_signed_at and acceptance_doc_ref — including the dead TRAINING_ASSIGNED -> ACTIVE branch, which always fails"
  - id: ERR_TRAINING_NOT_CURRENT
    http: 409
    condition: "An acting or voting member's fiduciary_training_status is not CURRENT"
  - id: ERR_MEETING_NOT_IN_SESSION
    http: 409
    condition: "A motion or presentation action requires the meeting to be IN_SESSION"
  - id: ERR_MEETING_IN_SESSION
    http: 409
    condition: "A second meeting on the same plan cannot be convened while one is IN_SESSION"
  - id: ERR_CHAIR_NOT_PRESENT
    http: 409
    condition: "The acting chair is not on the meeting's attendee roster, or is no longer an ACTIVE member"
  - id: ERR_OPEN_MOTION_VOTE_LOCK
    http: 409
    condition: "A vote was cast on a motion that is no longer OPEN"
  - id: ERR_REVIEW_NOT_SCORING
    http: 409
    condition: "A scorecard was submitted to a review that is not DRAFT, SCORING or REOPENED"
  - id: ERR_REVIEW_MEETING_MISSING
    http: 409
    condition: "A review was presented without a meeting_id pinned"
  - id: ERR_REVIEW_DECISIONS_EXECUTED
    http: 409
    condition: "A reopen was attempted after a decision authorised at the review's meeting reached APPROVED, NOTICE_ISSUED or EXECUTED"
  - id: ERR_FUND_NOT_CANDIDATE
    http: 409
    condition: "A fund offered for seating is not in menu_status CANDIDATE"
  - id: ERR_SLOT_NOT_REPLACEABLE
    http: 409
    condition: "A replacement approval targeted a slot that is not ACTIVE or AT_RISK"
  - id: ERR_SLOT_HAS_OPEN_PROPOSAL
    http: 409
    condition: "A retire or seat-status action was blocked by outstanding work — a non-terminal proposal on the slot, or a non-terminal member on the seat"
  - id: ERR_NOTICE_ALREADY_ISSUED
    http: 409
    condition: "An approval rescission was attempted after notice_delivered_at was set"
  - id: ERR_BENCHMARK_ALREADY_CURRENT
    http: 409
    condition: "A re-benchmark was attempted in the same fiscal quarter as last_benchmarked_quarter_index"
  - id: ERR_RECORDKEEPER_REQUIRED
    http: 409
    condition: "Terminating this engagement would leave the plan with no PENDING or ACTIVE RECORDKEEPER"
  - id: ERR_ENGAGEMENT_HAS_PENDING_MAPPING
    http: 409
    condition: "An engagement cannot be terminated while a NOTICE_ISSUED replacement proposal is outstanding on the plan"
  - id: ERR_QDIA_SLOT_REQUIRED
    http: 409
    condition: "A plan must retain exactly one QDIA-designated slot, so a QDIA slot may not be retired"

  # --- concurrency ---
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal Plan.version on POST /governance/fund-replacements"
  - id: ERR_STALE_REVIEW_VERSION
    http: 412
    condition: "expected_review_version does not equal QuarterlyReview.version on POST /governance/fund-scorecards"

  # --- governance safety and compliance ---
  - id: ERR_MENU_FROZEN
    http: 409
    condition: "A menu-changing write was attempted while Plan.menu_posture is FROZEN, or touched an at-risk slot while RESTRICTED"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "meeting.quorum_met is false when closing a motion, approving minutes or presenting a review"
  - id: ERR_NO_ELIGIBLE_VOTERS
    http: 422
    condition: "The motion tally denominator is zero under the motion's tally_basis — every voter recused, or no votes were cast under VOTES_CAST"
  - id: ERR_RECUSAL_REQUIRED
    http: 409
    condition: "A member with a conflicting affiliated_provider_role, or a non-independent member on a fee motion, voted anything other than RECUSE"
  - id: ERR_MOTION_NOT_CARRIED
    http: 409
    condition: "The referenced approving motion is not CARRIED, or its subject does not match the row being approved"
  - id: ERR_MINUTES_NOT_APPROVED
    http: 409
    condition: "The meeting behind the carried motion has not reached MINUTES_APPROVED — the fiduciary-defense documentation gate"
  - id: ERR_NO_ADOPTED_IPS
    http: 409
    condition: "The plan has no InvestmentPolicyStatement in status ADOPTED"
  - id: ERR_IPS_VERSION_STALE
    http: 409
    condition: "The row's pinned IPS id is no longer the plan's ADOPTED IPS id"
  - id: ERR_FUND_FAILS_IPS_CRITERIA
    http: 422
    condition: "The candidate fund fails an IPS selection criterion — track record, expense peer multiple, style drift floor or manager tenure after a change"
  - id: ERR_ROLLING_WINDOW_UNAVAILABLE
    http: 422
    condition: "A ROLLING_SINCE_WATCH scorecard was submitted for a fund with no watch_started_quarter_index or with the rolling fields absent"
  - id: ERR_SCORECARD_COVERAGE_INCOMPLETE
    http: 422
    condition: "At least one ACTIVE, AT_RISK or PENDING_REPLACEMENT slot's seated fund has no SUBMITTED scorecard in this review"
  - id: ERR_NO_SCORECARDS
    http: 422
    condition: "A review was presented with submitted_scorecard_count == 0"
  - id: ERR_MODULE_NOT_WAIVABLE
    http: 422
    condition: "A waiver was requested for FIDUCIARY_DUTIES, or a WAIVED record omitted a waiver_basis of at least 12 characters"
  - id: ERR_TRAINING_SCORE_INSUFFICIENT
    http: 422
    condition: "A training completion reported score_pct below the 80.00 passing floor"
  - id: ERR_SHARE_CLASS_INELIGIBLE
    http: 422
    condition: "The requested share class is not strictly cheaper, would raise revenue sharing, or the fund is inside a live replacement proposal"
  - id: ERR_NO_ELIGIBLE_TARGET_DATE_SUITE
    http: 422
    condition: "No target-date suite satisfies the selector's eligibility filter for the moved glidepath_type"

  # --- uniqueness and overlap constraints ---
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A declared uniqueness key already exists — seat_code, ticker, (asset_class_code, designation), (plan_id, quarter_index), (review_id, fund_id) among SUBMITTED scorecards, (member_id, module_code) among non-EXPIRED records, version_label, or a second QDIA slot"
  - id: ERR_SEAT_TERM_OVERLAP
    http: 409
    condition: "A member's closed term interval overlaps or is adjacent to another non-terminal member's interval on the same seat"
  - id: ERR_ENGAGEMENT_TERM_OVERLAP
    http: 409
    condition: "An engagement's closed term interval overlaps a live engagement of the same provider_role on the plan"

  # --- temporal windows ---
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "The clock has not reached notice_delivered_at plus notice_lead_days_required days, or a blackout window was requested to start before that instant"
  - id: ERR_BLACKOUT_WINDOW_CONFLICT
    http: 409
    condition: "The half-open blackout window overlaps another live mapping's window, or an execute was attempted outside the window"
  - id: ERR_UNWIND_WINDOW_CLOSED
    http: 409
    condition: "An unwind was attempted at or after blackout_end_at"
  - id: ERR_QUARTER_CLOSED
    http: 409
    condition: "The action falls outside its permitted fiscal-quarter window — reopen, levelization approve, recompute or reverse"
  - id: ERR_REOPEN_LIMIT_REACHED
    http: 409
    condition: "reopen_count has already reached 2"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "revision_round has already reached 3"

  # --- capacity and fiscal ---
  - id: ERR_MENU_CAPACITY_EXHAUSTED
    http: 409
    condition: "Plan.available_menu_slots is 0, so no seating or slot reservation can be made without releasing one"
  - id: ERR_CREDIT_POOL_INSUFFICIENT
    http: 409
    condition: "credit_pool_cents exceeds Plan.revenue_credit_balance_cents at approve or at post time"
  - id: ERR_ALLOCATION_NOT_BALANCED
    http: 422
    condition: "allocated_total_cents plus remainder_cents does not equal the eligible pool, or a line amount is negative"
  - id: ERR_FEE_DISCLOSURE_RESTATEMENT_REQUIRED
    http: 409
    condition: "Plan.fee_disclosure_status is RESTATEMENT_REQUIRED when issuing a participant notice or posting a levelization run"
  - id: ERR_NO_PARTICIPANT_ACCOUNTS
    http: 422
    condition: "A PER_CAPITA levelization was attempted with Plan.participant_account_count == 0"
  - id: ERR_NO_PLAN_ASSETS
    http: 422
    condition: "A provider benchmark was attempted with Plan.total_plan_assets_cents == 0, which would divide by zero"

roles:
  - name: PlanSponsorAdmin
    description: "The plan sponsor's operational administrator. Builds the governance structure — plan and charter, seats, appointments, training assignments, slots — advances the fiscal quarter, and holds the compensating powers that reverse committee decisions after the fact (review reopen, mapping unwind, levelization reverse, engagement termination and RFP award). Deliberately cannot vote, cannot close a motion, cannot approve minutes and cannot approve a fund replacement or a levelization run."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/plans"
      - "POST /governance/plans/{planId}/charter/adopt"
      - "POST /governance/plans/{planId}/advance-quarter"
      - "POST /governance/committee-seats"
      - "POST /governance/committee-seats/{seatId}/status"
      - "POST /governance/committee-members"
      - "POST /governance/committee-members/{memberId}/activate"
      - "POST /governance/committee-members/{memberId}/end-term"
      - "POST /governance/quarterly-reviews/{reviewId}/reopen"
      - "POST /governance/fund-replacements/{proposalId}/unwind"
      - "POST /governance/fee-levelization-runs/{runId}/reverse"
      - "POST /governance/service-provider-engagements"
      - "POST /governance/service-provider-engagements/{engagementId}/rfp-award"
      - "POST /governance/service-provider-engagements/{engagementId}/terminate"
    shared_operations:
      - "POST /governance/training-records (with CommitteeMember for completion)"
      - "POST /governance/investment-policy-statements (with InvestmentConsultant)"
      - "POST /governance/asset-class-slots (with InvestmentConsultant)"
      - "POST /governance/asset-class-slots/{slotId}/retire"
      - "POST /governance/committee-meetings (with CommitteeChair)"
      - "POST /governance/plans/{planId}/menu-posture/recompute (with InvestmentConsultant)"
      - "POST /_clock/set_current_utc (with Recordkeeper, PlanAuditor)"
      - "every GET"

  - name: CommitteeChair
    description: "The chair seat of the fiduciary committee, resolved through an ACTIVE CommitteeMember whose seat_class is CHAIR. Runs meetings, closes motions, approves the minutes that unlock every fiduciary decision, and executes the committee's approvals — IPS adoption, target-date suite selection, replacement approval and rescission, levelization approval, review finalization. Segregation of duties: the chair can approve but cannot post a levelization run, cannot issue a participant notice, cannot execute a mapping and cannot reverse or unwind anything."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /governance/committee-meetings/{meetingId}/convene"
      - "POST /governance/committee-meetings/{meetingId}/adjourn"
      - "POST /governance/committee-meetings/{meetingId}/minutes-approve"
      - "POST /governance/motions/{motionId}/close"
      - "POST /governance/investment-policy-statements/{ipsId}/adopt"
      - "POST /governance/funds/{fundId}/target-date-selection"
      - "POST /governance/quarterly-reviews/{reviewId}/finalize"
      - "POST /governance/fund-replacements/{proposalId}/request-revision"
      - "POST /governance/fund-replacements/{proposalId}/approve"
      - "POST /governance/fund-replacements/{proposalId}/rescind-approval"
      - "POST /governance/fee-levelization-runs/{runId}/approve"
    shared_operations:
      - "POST /governance/committee-meetings (with PlanSponsorAdmin)"
      - "POST /governance/motions (with CommitteeMember)"
      - "POST /governance/motions/{motionId}/votes (with CommitteeMember, own vote only)"
      - "POST /governance/committee-members/{memberId}/acceptance (own acceptance only)"
      - "every GET"

  - name: CommitteeMember
    description: "A non-chair fiduciary committee member, resolved through their own CommitteeMember row. Signs their own acceptance of fiduciary responsibility, completes their own training, moves motions and casts their own vote — and must vote RECUSE on any motion touching a provider they are affiliated with. Cannot close a motion, cannot approve anything and cannot appoint or activate members."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations: []
    shared_operations:
      - "POST /governance/committee-members/{memberId}/acceptance (own acceptance only, ERR_ACTOR_NOT_SELF otherwise)"
      - "POST /governance/training-records/{recordId}/complete (own record)"
      - "POST /governance/motions (with CommitteeChair)"
      - "POST /governance/motions/{motionId}/votes (own vote only)"
      - "every GET"

  - name: InvestmentConsultant
    description: "The plan's investment adviser. Owns the analytical surface — drafting IPS versions, creating slots and funds, seating funds, submitting scorecards, presenting reviews, drafting and revising replacement proposals, drafting and recomputing levelization runs, and benchmarking providers. Segregation of duties: the consultant produces every recommendation but approves none of them, casts no votes and touches no ledger."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/fund-scorecards"
      - "POST /governance/quarterly-reviews"
      - "POST /governance/quarterly-reviews/{reviewId}/present"
      - "POST /governance/asset-class-slots/{slotId}/seat-fund"
      - "POST /governance/fund-replacements"
      - "POST /governance/fund-replacements/{proposalId}/submit"
      - "POST /governance/fund-replacements/{proposalId}/revise"
      - "POST /governance/fee-levelization-runs/{runId}/recompute"
      - "POST /governance/service-provider-engagements/{engagementId}/benchmark"
    shared_operations:
      - "POST /governance/investment-policy-statements (with PlanSponsorAdmin)"
      - "POST /governance/asset-class-slots (with PlanSponsorAdmin)"
      - "POST /governance/funds and PATCH /governance/funds/{fundId} (with Recordkeeper)"
      - "POST /governance/funds/{fundId}/share-class-change (with Recordkeeper)"
      - "POST /governance/fee-levelization-runs (with Recordkeeper)"
      - "POST /governance/plans/{planId}/menu-posture/recompute (with PlanSponsorAdmin)"
      - "every GET"

  - name: Recordkeeper
    description: "The plan's recordkeeping provider. Holds the execution surface the committee's approvals authorise — issuing participant notices, executing mappings inside the blackout window, and posting approved levelization runs to the credit ledger — plus the fund data feed. Segregation of duties: the recordkeeper executes and posts but never approves, votes, reopens, reverses or unwinds."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/fund-replacements/{proposalId}/notice-issue"
      - "POST /governance/fund-replacements/{proposalId}/execute"
      - "POST /governance/fee-levelization-runs/{runId}/post"
    shared_operations:
      - "POST /governance/funds and PATCH /governance/funds/{fundId} (with InvestmentConsultant)"
      - "POST /governance/funds/{fundId}/share-class-change (with InvestmentConsultant)"
      - "POST /governance/fee-levelization-runs (with InvestmentConsultant)"
      - "POST /_clock/set_current_utc (with PlanSponsorAdmin, PlanAuditor)"
      - "every GET"

  - name: PlanAuditor
    description: "The independent auditor assembling the fiduciary-defense record. Strictly read-only across every entity — minutes, motions and their vote rolls, scorecards, allocation lines, snapshots and version counters — and may move the logical clock to reproduce a historical evaluation. Holds no write capability on any business entity, which is what makes the audit trail credible."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /_clock/set_current_utc (with PlanSponsorAdmin, Recordkeeper)"
      - "every GET across all fourteen entities"
