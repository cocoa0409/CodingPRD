scenario: |
  Farmers Market Nutrition Incentive & Token Program (Double Up Food Bucks style program): shopper eligibility & benefit type (SNAP/WIC/senior voucher), token/scrip issuance & tracking at market info booth, vendor eligibility & reimbursement submission, matching (double-up) funding cap per shopper & per day, reconciliation between tokens issued and redeemed, fraud prevention & token counterfeiting, reimbursement timeline & vendor payment, program reporting to funders

domain_name: farmers-market-nutrition-incentive
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: season_start, type: datetime, source: input, description: "Season start instant (UTC); market days must fall on/after this" }
      - { name: season_end, type: datetime, source: input, description: "Season end instant (UTC); market day date must be strictly before this" }
      - { name: match_pool_budget_cents, type: integer, source: input, description: "Total incentive (double-up) funding budgeted for the season, cents", constraints: ">= 0" }
      - { name: match_pool_remaining_cents, type: integer, source: computed, description: "match_pool_budget_cents minus sum of match_cents over all Issuance rows with status ACTIVE in this program" }
      - { name: liability_forward_cents, type: integer, source: computed, description: "Forward-looking liability: sum of denomination_cents over all tokens in this program with status IN {ISSUED, REDEEMED, FLAGGED}" }
      - { name: liability_realized_cents, type: integer, source: computed, description: "Chronological realized liability: sum of denomination_cents over all tokens in this program with status IN {REDEEMED, SETTLED}" }
      - { name: paid_out_cents, type: integer, source: computed, description: "Sum of paid_amount_cents over all RedemptionSubmission rows with status PAID in this program" }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; market operates under this program" }
      - { name: name, type: string, source: input, description: "Market name" }
      - { name: city, type: string, source: input, description: "Market city" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; home market where the vendor sells" }
      - { name: legal_name, type: string, source: input, description: "Vendor legal business name" }
      - { name: stall_number, type: string, source: input, description: "Stall identifier at the market" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED", default: PENDING }
      - { name: payable_cents, type: integer, source: computed, description: "Sum of approved_amount_cents over this vendor's submissions with status IN {APPROVED, PAID} minus sum of paid_amount_cents over PAID ones (i.e. approved-but-unpaid balance)" }

  - name: Shopper
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program the shopper is enrolled in" }
      - { name: external_benefit_ref, type: string, source: input, description: "External benefit identifier (EBT card token / WIC id / senior voucher id); unique per program" }
      - { name: benefit_type, type: enum, source: input, description: "SNAP | WIC | SENIOR" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ACTIVE | SUSPENDED", default: ENROLLED }
      - { name: season_match_used_cents, type: integer, source: computed, description: "Sum of match_cents over this shopper's Issuance rows with status ACTIVE" }

  - name: MarketDay
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market operating this day" }
      - { name: date, type: string, source: input, description: "Operating date, ISO YYYY-MM-DD; combined with opens_at/closes_at for the operating window" }
      - { name: opens_at, type: datetime, source: input, description: "Window open instant (UTC); half-open window start" }
      - { name: closes_at, type: datetime, source: input, description: "Window close instant (UTC); half-open window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | VARIANCE_FLAGGED | RECONCILED", default: SCHEDULED }
      - { name: issued_value_cents, type: integer, source: computed, description: "Sum of denomination_cents over tokens minted by Issuance rows with market_day_id = this day and issuance status ACTIVE" }
      - { name: voided_value_cents, type: integer, source: computed, description: "Sum of denomination_cents over tokens minted at this day's ACTIVE issuances whose own status is VOIDED (batch recall)" }
      - { name: redeemed_value_cents, type: integer, source: computed, description: "Sum of denomination_cents over tokens minted at this day's ACTIVE issuances whose status IN {REDEEMED, SETTLED}" }
      - { name: variance_cents, type: integer, source: computed, description: "issued_value_cents - voided_value_cents - redeemed_value_cents; reconcilable when |variance| <= RECONCILE_TOLERANCE_CENTS (500)" }

  - name: TokenBatch
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; booth this batch is shipped to" }
      - { name: kind, type: enum, source: input, description: "BASE | MATCH — which token pool this batch supplies" }
      - { name: denomination_cents, type: integer, source: input, description: "Face value of every token in the batch; BASE batches may be 500 or 100, MATCH batches must be 100", constraints: "BASE: 500 or 100; MATCH: 100" }
      - { name: serial_start, type: integer, source: input, description: "First serial number in the batch range (inclusive, closed interval)" }
      - { name: serial_end, type: integer, source: input, description: "Last serial number in the batch range (inclusive, closed interval); must be >= serial_start" }
      - { name: status, type: enum, source: system, description: "SEALED | ACTIVE | RECALLED", default: SEALED }
      - { name: next_serial, type: integer, source: computed, description: "Lowest serial in [serial_start, serial_end] not yet minted; minting assigns serials in ascending order; when next_serial > serial_end the batch is exhausted" }

  - name: Issuance
    parent: null
    common_fields: true
    fields:
      - { name: shopper_id, type: string, source: input, description: "FK -> Shopper.id; benefit recipient receiving tokens" }
      - { name: market_day_id, type: string, source: input, description: "FK -> MarketDay.id; day the issuance occurs at the info booth" }
      - { name: benefit_charged_cents, type: integer, source: input, description: "Amount charged to the shopper's benefit; must be a multiple of 100 and >= 100" }
      - { name: base_value_cents, type: integer, source: computed, description: "Always equals benefit_charged_cents; base tokens minted to this value" }
      - { name: match_cents, type: integer, source: computed, description: "Incentive value minted per calculations.match_computation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED", default: ACTIVE }

  - name: Token
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: integer, source: system, description: "Minted serial from the supplying batch; unique program-wide" }
      - { name: kind, type: enum, source: system, description: "BASE | MATCH (copied from batch)" }
      - { name: denomination_cents, type: integer, source: system, description: "Face value (copied from batch)" }
      - { name: issuance_id, type: string, source: system, description: "FK -> Issuance.id; issuance that minted this token" }
      - { name: token_batch_id, type: string, source: system, description: "FK -> TokenBatch.id; batch the serial was drawn from" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | SETTLED | VOIDED | FLAGGED | CONFISCATED", default: ISSUED }
      - { name: redeemed_vendor_id, type: string, source: system, description: "FK -> Vendor.id; vendor who accepted the token (null until redeemed); nullable" }
      - { name: submission_id, type: string, source: system, description: "FK -> RedemptionSubmission.id; submission currently holding this token (null when not attached); nullable" }

  - name: RedemptionSubmission
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; submitting vendor (= X-User-ID of creator)" }
      - { name: market_day_id, type: string, source: input, description: "FK -> MarketDay.id; day the tokens were redeemed" }
      - { name: token_ids, type: array, source: input, description: "Ordered array of Token ids to claim; strictly validated at create/resubmit" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | DISPUTED | APPROVED | REJECTED | PAID", default: SUBMITTED }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Optimistic estimate at create/resubmit: sum over attached tokens of round_half_up(denomination_cents * (1 - FEE_BPS/10000)) computed PER LINE then summed" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Final settlement at approve: round_half_up(sum of denomination_cents over attached tokens with status REDEEMED * (1 - FEE_BPS/10000)) — aggregate rounding AFTER summing; null until APPROVED" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Amount actually paid when swept into a SettlementRun; equals approved_amount_cents; null until PAID" }
      - { name: approved_at, type: datetime, source: system, description: "Timestamp of APPROVED transition; null until approved; settlement sweep eligibility key" }
      - { name: disputed_at, type: datetime, source: system, description: "Timestamp of most recent DISPUTED transition; null until disputed; resubmit grace clock key" }

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; subject vendor when case targets a vendor; nullable" }
      - { name: shopper_id, type: string, source: input, description: "FK -> Shopper.id; subject shopper when case targets a shopper; nullable" }
      - { name: token_id, type: string, source: input, description: "FK -> Token.id; subject token when case targets a token; nullable" }
      - { name: reason, type: string, source: input, description: "Free-text suspicion rationale" }
      - { name: origin, type: enum, source: system, description: "MANUAL (opened via API) | AUTO_DOUBLE_SPEND | AUTO_COUNTERFEIT_SERIAL", default: MANUAL }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | CLEARED", default: OPEN }

  - name: SettlementRun
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program being settled" }
      - { name: cutoff_at, type: datetime, source: input, description: "Inclusive upper bound: submissions with approved_at <= cutoff_at are swept" }
      - { name: swept_submission_ids, type: array, source: system, description: "Ids of submissions transitioned APPROVED -> PAID by this run, in sweep order (approved_at ASC, tie created_at ASC)" }
      - { name: total_paid_cents, type: integer, source: system, description: "Sum of paid_amount_cents over swept submissions" }
      - { name: vendor_payment_count, type: integer, source: system, description: "Count of distinct vendors receiving payment in this run" }

# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: Shopper
    initial_state: ENROLLED
    terminal_states: [SUSPENDED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /shoppers/{id}/verify"
        actor: ProgramAdmin
        preconditions:
          - "Shopper.status == ENROLLED"
        side_effects:
          - "Shopper.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shoppers/{id}/suspend OR fraud-case confirm cascade (subject_type shopper)"
        actor: ProgramAdmin | system
        preconditions:
          - "Shopper.status == ACTIVE"
        side_effects:
          - "Shopper.version increments by 1"
          - "Further issuance to this shopper rejected with ERR_SHOPPER_NOT_ELIGIBLE"

  - entity: Vendor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /vendors/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Vendor.status == PENDING"
        side_effects:
          - "Vendor.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/set-status {to: SUSPENDED} OR fraud-case confirm cascade (subject_type vendor)"
        actor: ProgramAdmin | system
        preconditions:
          - "Vendor.status == ACTIVE"
        side_effects:
          - "Vendor.version increments by 1"
          - "HOP-2 (fraud cascade only): every RedemptionSubmission of this vendor with status IN {SUBMITTED, DISPUTED} transitions to REJECTED"
          - "Redemption attempts and submission creation by this vendor rejected with ERR_VENDOR_NOT_ACTIVE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{id}/set-status {to: ACTIVE}"
        actor: ProgramAdmin
        preconditions:
          - "Vendor.status == SUSPENDED"
        side_effects:
          - "Vendor.version increments by 1"

  - entity: MarketDay
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /market-days/{id}/open"
        actor: MarketManager
        preconditions:
          - "MarketDay.status == SCHEDULED"
          - "Logical clock current date == MarketDay.date (ERR_MARKET_DAY_NOT_OPEN otherwise)"
        side_effects:
          - "MarketDay.version increments by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /market-days/{id}/close"
        actor: MarketManager
        preconditions:
          - "MarketDay.status == OPEN"
        side_effects:
          - "MarketDay.version increments by 1"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /market-days/{id}/reconcile {override_variance: false} by MarketManager, or {override_variance: true} by ProgramAdmin"
        actor: MarketManager | ProgramAdmin
        preconditions:
          - "MarketDay.status == CLOSED"
          - "|variance_cents| <= RECONCILE_TOLERANCE_CENTS (500) when override_variance is absent/false"
          - "override_variance: true is ProgramAdmin-only (MarketManager sending override_variance: true -> ERR_FORBIDDEN)"
        side_effects:
          - "MarketDay.version increments by 1"
      - from: CLOSED
        to: VARIANCE_FLAGGED
        trigger: "POST /market-days/{id}/reconcile {override_variance: false} when |variance_cents| > 500 (soft failure: the reconcile attempt itself routes the day to VARIANCE_FLAGGED and returns 200)"
        actor: MarketManager | ProgramAdmin
        preconditions:
          - "MarketDay.status == CLOSED"
          - "|variance_cents| > RECONCILE_TOLERANCE_CENTS (500)"
        side_effects:
          - "MarketDay.version increments by 1"
      - from: VARIANCE_FLAGGED
        to: RECONCILED
        trigger: "POST /market-days/{id}/reconcile {override_variance: true}"
        actor: ProgramAdmin
        preconditions:
          - "MarketDay.status == VARIANCE_FLAGGED"
          - "override_variance must be true; a plain reconcile on a VARIANCE_FLAGGED day is rejected ERR_RECONCILIATION_VARIANCE"
        side_effects:
          - "MarketDay.version increments by 1"

  - entity: TokenBatch
    initial_state: SEALED
    terminal_states: [RECALLED]
    transitions:
      - from: SEALED
        to: ACTIVE
        trigger: "POST /token-batches/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "TokenBatch.status == SEALED"
        side_effects:
          - "TokenBatch.version increments by 1"
      - from: ACTIVE
        to: RECALLED
        trigger: "POST /token-batches/{id}/recall"
        actor: ProgramAdmin
        preconditions:
          - "TokenBatch.status == ACTIVE"
        side_effects:
          - "TokenBatch.version increments by 1"
          - "HOP-1: every Token of this batch with status ISSUED transitions to VOIDED (tokens already REDEEMED/SETTLED/FLAGGED/CONFISCATED are unaffected)"
          - "HOP-2: for each affected MarketDay, voided_value_cents and variance_cents recompute (variance drops by the voided face value)"
          - "Each affected Token.version and MarketDay.version increments by 1"

  - entity: Issuance
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /issuances/{id}/void"
        actor: BoothOperator
        preconditions:
          - "Issuance.status == ACTIVE"
          - "Every token of this issuance still has status ISSUED (none redeemed/voided/flagged/settled/confiscated) — else ERR_ISSUANCE_NOT_VOIDABLE"
          - "Issuance's MarketDay.status == OPEN (same-day reversal only) — else ERR_MARKET_DAY_NOT_OPEN"
        side_effects:
          - "Issuance.version increments by 1"
          - "HOP-1: every token of this issuance transitions ISSUED -> VOIDED"
          - "HOP-2: Shopper.season_match_used_cents decreases by this issuance's match_cents; Program.match_pool_remaining_cents increases by match_cents (compensating credit); MarketDay.issued_value_cents recomputes (issuance excluded); Shopper.version and Program.version and MarketDay.version each increment by 1"

  - entity: Token
    initial_state: ISSUED
    terminal_states: [SETTLED, VOIDED, CONFISCATED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /tokens/redeem {serial_number} as Vendor"
        actor: Vendor
        preconditions:
          - "serial_number maps to a minted Token (unknown serial -> ERR_TOKEN_UNKNOWN_SERIAL; serial inside an ACTIVE batch range but not yet minted -> ERR_TOKEN_NOT_MINTED)"
          - "Token.status == ISSUED (REDEEMED/SETTLED -> ERR_TOKEN_ALREADY_REDEEMED + auto-flag cascade; FLAGGED -> ERR_TOKEN_FLAGGED; VOIDED/CONFISCATED -> ERR_TOKEN_VOID)"
          - "Acting Vendor.status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
          - "Acting Vendor.market_id == token's issuing MarketDay.market_id (ERR_VENDOR_MARKET_MISMATCH)"
          - "Token's issuing MarketDay.status == OPEN (ERR_MARKET_DAY_NOT_OPEN; tokens are same-day scrip)"
        side_effects:
          - "Token.redeemed_vendor_id := acting vendor id; Token.version increments by 1"
          - "HOP-1: MarketDay.redeemed_value_cents increases by denomination_cents; variance_cents recomputes; MarketDay.version increments by 1"
      - from: REDEEMED
        to: ISSUED
        trigger: "POST /tokens/{id}/reverse-redemption"
        actor: Vendor
        preconditions:
          - "Token.status == REDEEMED"
          - "Acting vendor id == Token.redeemed_vendor_id (ERR_FORBIDDEN otherwise)"
          - "Token.submission_id is null (not yet attached to any submission) — else ERR_TOKEN_ALREADY_SUBMITTED"
          - "Token's issuing MarketDay.status == OPEN (same-day correction only; ERR_MARKET_DAY_NOT_OPEN)"
        side_effects:
          - "Token.redeemed_vendor_id := null; Token.version increments by 1"
          - "MarketDay.redeemed_value_cents decreases by denomination_cents; variance_cents recomputes; MarketDay.version increments by 1"
      - from: REDEEMED
        to: SETTLED
        trigger: "system (cascade of RedemptionSubmission VERIFIED -> APPROVED)"
        actor: system
        preconditions:
          - "Token.status == REDEEMED and Token.submission_id == the approved submission"
        side_effects:
          - "Token.version increments by 1"
          - "HOP-2: token's issuing MarketDay totals recompute (no change in redeemed_value_cents since REDEEMED and SETTLED both count); Vendor.payable_cents recomputes"
      - from: REDEEMED
        to: FLAGGED
        trigger: "system (a redeem attempt against this token while it is REDEEMED/SETTLED — double-spend signal) OR FraudCase OPEN targeting this token"
        actor: system
        preconditions:
          - "Token.status == REDEEMED"
        side_effects:
          - "Token.version increments by 1"
          - "MarketDay.redeemed_value_cents recomputes (FLAGGED no longer counts); variance_cents recomputes"
          - "A FraudCase with origin AUTO_DOUBLE_SPEND is opened with token_id = this token (exactly-one-subject invariant holds); reason records the attempting vendor id"
      - from: FLAGGED
        to: REDEEMED
        trigger: "system (FraudCase targeting this token transitions OPEN -> CLEARED)"
        actor: system
        preconditions:
          - "Token.status == FLAGGED and the cleared case's token_id == this token"
        side_effects:
          - "Token.version increments by 1"
          - "MarketDay.redeemed_value_cents recomputes (counts again); variance_cents recomputes"
      - from: FLAGGED
        to: CONFISCATED
        trigger: "system (FraudCase targeting this token transitions OPEN -> CONFIRMED)"
        actor: system
        preconditions:
          - "Token.status == FLAGGED and the confirmed case's token_id == this token"
        side_effects:
          - "Token.version increments by 1"
          - "Token detached from any non-terminal submission (submission_id := null)"
          - "MarketDay totals recompute; variance recomputes"
      - from: ISSUED
        to: VOIDED
        trigger: "system (issuance void cascade OR token-batch recall cascade)"
        actor: system
        preconditions:
          - "Token.status == ISSUED"
        side_effects:
          - "Token.version increments by 1"
          - "MarketDay.voided_value_cents / issued_value_cents / variance_cents recompute"

  - entity: RedemptionSubmission
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /redemption-submissions/{id}/verify {outcome: VERIFIED}"
        actor: MarketManager
        preconditions:
          - "RedemptionSubmission.status == SUBMITTED"
          - "Submission's MarketDay.status IN {CLOSED, VARIANCE_FLAGGED} (ERR_MARKET_DAY_NOT_CLOSED otherwise; RECONCILED days are locked)"
        side_effects:
          - "RedemptionSubmission.version increments by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /redemption-submissions/{id}/verify {outcome: DISPUTED}"
        actor: MarketManager
        preconditions:
          - "RedemptionSubmission.status == SUBMITTED"
          - "Submission's MarketDay.status IN {CLOSED, VARIANCE_FLAGGED} (ERR_MARKET_DAY_NOT_CLOSED otherwise)"
        side_effects:
          - "disputed_at := now; RedemptionSubmission.version increments by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /redemption-submissions/{id}/resubmit (full replacement token_ids)"
        actor: Vendor
        preconditions:
          - "RedemptionSubmission.status == DISPUTED"
          - "Acting vendor id == RedemptionSubmission.vendor_id (ERR_FORBIDDEN)"
          - "Within submission window OR within RESUBMIT_GRACE_HOURS (72h) of disputed_at (ERR_SUBMISSION_WINDOW_CLOSED)"
          - "Replacement token_ids pass the same strict per-token validation ladder as create"
        side_effects:
          - "Old tokens detached (submission_id := null); new tokens attached; provisional_amount_cents recomputed; version increments"
      - from: VERIFIED
        to: APPROVED
        trigger: "POST /redemption-submissions/{id}/decide {outcome: APPROVED}"
        actor: ProgramAdmin
        preconditions:
          - "RedemptionSubmission.status == VERIFIED"
          - "Submission's MarketDay.status IN {CLOSED, VARIANCE_FLAGGED} (ERR_INVALID_STATE on RECONCILED days — terminal lock)"
          - "Segregation of duties enforced by role: verification is MarketManager-only, approval is ProgramAdmin-only"
        side_effects:
          - "approved_amount_cents computed (aggregate-rounding variant); approved_at := now; version increments"
          - "HOP-1: every attached Token with status REDEEMED transitions REDEEMED -> SETTLED"
          - "HOP-2: Vendor.payable_cents recomputes (increases by approved_amount_cents); Vendor.version increments by 1"
          - "HOP-3: token MarketDay totals recompute (REDEEMED and SETTLED both count toward redeemed_value_cents, so variance is unchanged)"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /redemption-submissions/{id}/decide {outcome: REJECTED}"
        actor: ProgramAdmin
        preconditions:
          - "RedemptionSubmission.status IN {VERIFIED, DISPUTED}"
        side_effects:
          - "HOP-1: every attached Token transitions REDEEMED -> FLAGGED (rejected claim quarantines its tokens); submission_id := null on each"
          - "HOP-2: for each such token, its MarketDay.redeemed_value_cents recomputes (FLAGGED excluded); variance recomputes; CLOSED-day auto-flag rules apply"
          - "RedemptionSubmission.version increments by 1"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /redemption-submissions/{id}/decide {outcome: REJECTED}"
        actor: ProgramAdmin
        preconditions:
          - "RedemptionSubmission.status IN {VERIFIED, DISPUTED}"
        side_effects:
          - "Same token-quarantine cascade as VERIFIED -> REJECTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (fraud-case confirm cascade: subject vendor suspended -> this vendor's SUBMITTED submissions rejected)"
        actor: system
        preconditions:
          - "RedemptionSubmission.status == SUBMITTED and submission's vendor just transitioned ACTIVE -> SUSPENDED via fraud confirm"
        side_effects:
          - "Same token-quarantine cascade as VERIFIED -> REJECTED (attached tokens REDEEMED -> FLAGGED, detached)"
      - from: DISPUTED
        to: REJECTED
        trigger: "system (fraud-case confirm cascade: subject vendor suspended -> this vendor's DISPUTED submissions rejected)"
        actor: system
        preconditions:
          - "RedemptionSubmission.status == DISPUTED and submission's vendor just transitioned ACTIVE -> SUSPENDED via fraud confirm"
        side_effects:
          - "Same token-quarantine cascade as VERIFIED -> REJECTED"
      - from: APPROVED
        to: PAID
        trigger: "system (SettlementRun sweep: POST /settlement-runs with cutoff_at >= this submission's approved_at)"
        actor: system
        preconditions:
          - "RedemptionSubmission.status == APPROVED"
          - "approved_at <= run.cutoff_at (inclusive boundary)"
        side_effects:
          - "paid_amount_cents := approved_amount_cents; version increments"
          - "Vendor.payable_cents recomputes (decreases by paid amount); Vendor.version increments"
          - "Program.paid_out_cents increases by paid amount; Program.version increments (also bumped once by the run itself)"

  - entity: FraudCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, CLEARED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /fraud-cases/{id}/confirm"
        actor: ProgramAdmin
        preconditions:
          - "FraudCase.status == OPEN"
        side_effects:
          - "Subject cascade by which FK is set:"
          - "vendor_id set: Vendor ACTIVE -> SUSPENDED (hop 1); then that vendor's SUBMITTED/DISPUTED submissions -> REJECTED (hop 2); then each rejected submission's attached tokens REDEEMED -> FLAGGED and detached (hop 3); each token's MarketDay totals recompute"
          - "shopper_id set: Shopper ACTIVE -> SUSPENDED"
          - "token_id set: if token FLAGGED -> CONFISCATED; if token REDEEMED -> FLAGGED then CONFISCATED (two-step, both side effects applied); if token ISSUED -> FLAGGED (escalation stops, review hold)"
          - "FraudCase.version increments by 1"
      - from: OPEN
        to: CLEARED
        trigger: "POST /fraud-cases/{id}/clear"
        actor: ProgramAdmin
        preconditions:
          - "FraudCase.status == OPEN"
        side_effects:
          - "token_id set and token currently FLAGGED: token FLAGGED -> REDEEMED (compensation), MarketDay totals recompute"
          - "vendor/shopper subjects: NO automatic reinstatement (manual set-status required)"
          - "FraudCase.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: issuance-create-stale-shopper
    parent_entity: Shopper
    write_endpoint: "POST /issuances"
    occ_field: "expected_shopper_version"
    description: |
      Creating an Issuance against a Shopper whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION. This
      captures the double-issue vector where a booth operator's screen holds a
      stale view of the shopper's daily match ledger after another write
      (issuance, void, suspension) has legitimately advanced the shopper row.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-run-stale-program
    parent_entity: Program
    write_endpoint: "POST /settlement-runs"
    occ_field: "expected_program_version"
    description: |
      Creating a SettlementRun against a Program whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION.
      The sweep snapshots APPROVED submissions; a stale program view means the
      caller priced the run off a superseded payable/approval state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (7 rules)
# =============================================================================
calculations:
  - name: match_computation
    trigger: "POST /issuances (at issuance creation)"
    algorithm: threshold
    formula: |
      Inputs: benefit_charged_cents, benefit_type, day_remaining, season_remaining, pool_remaining.
      Constants per benefit_type:
        SNAP:   MATCH_RATIO 1.0, DAILY_CAP 2000, SEASON_CAP 20000
        WIC:    MATCH_RATIO 0.5, DAILY_CAP 1000, SEASON_CAP 10000
        SENIOR: MATCH_RATIO 1.0, DAILY_CAP 1500, SEASON_CAP 15000
      Evaluation order (pinned, non-commutative):
        1. raw_match_cents      = floor(benefit_charged_cents * MATCH_RATIO)
        2. day_remaining        = DAILY_CAP - shopper_day_match_used_cents   (see shopper_match_usage; same calendar date as the MarketDay)
        3. season_remaining     = SEASON_CAP - Shopper.season_match_used_cents
        4. pool_remaining       = Program.match_pool_remaining_cents
        5. capped               = min(raw_match_cents, day_remaining, season_remaining, pool_remaining)
        6. match_cents          = floor(capped / 100) * 100    # whole-dollar match tokens only; sub-dollar remainder forfeited
      Clamping semantics: any remaining allowance of 0 yields match_cents = 0; issuance still succeeds (base tokens always mint). No error is raised for cap exhaustion.
    input_set: "Single issuance request; usage accumulators include only Issuance rows with status ACTIVE"
    constants:
      SNAP_RATIO: 1.0
      WIC_RATIO: 0.5
      SENIOR_RATIO: 1.0
      SNAP_DAILY_CAP_CENTS: 2000
      WIC_DAILY_CAP_CENTS: 1000
      SENIOR_DAILY_CAP_CENTS: 1500
      SNAP_SEASON_CAP_CENTS: 20000
      WIC_SEASON_CAP_CENTS: 10000
      SENIOR_SEASON_CAP_CENTS: 15000
      MATCH_TOKEN_DENOM_CENTS: 100
    precision: "integer cents; floor operations as written"
    variants:
      - name: clamped
        when: "one or more allowance (day / season / pool) is below raw_match_cents"
        difference: "match is silently clamped to the binding allowance, floored to whole dollars; issuance still succeeds"
      - name: full
        when: "raw_match_cents is within all three allowances"
        difference: "match equals floor(raw_match_cents / 100) * 100"

  - name: shopper_match_usage
    trigger: "issuance created (accumulate) or voided (decrement); read by match_computation"
    algorithm: aggregation
    formula: |
      shopper_day_match_used_cents(shopper, date) =
        sum(match_cents) over Issuance rows where shopper_id = shopper
          AND status == ACTIVE
          AND market_day's date == date
      Shopper.season_match_used_cents =
        sum(match_cents) over Issuance rows where shopper_id = shopper AND status == ACTIVE
      Day boundary: an issuance counts toward the calendar date of its MarketDay, not the request wall-clock.
    input_set: "Issuance rows with status ACTIVE only; VOIDED issuances excluded"
    constants: {}
    precision: "integer cents"

  - name: token_denomination_split
    trigger: "POST /issuances (after match_computation)"
    algorithm: waterfall_allocation
    formula: |
      Base value benefit_charged_cents is split greedily largest-denomination-first
      over BASE denominations [500, 100]: n500 = floor(value/500); rem = value - 500*n500; n100 = rem/100.
      Match value match_cents (always a multiple of 100) splits over MATCH denominations [100] only.
      Batch selector per (market, kind, denomination), pinned 4 elements:
        (a) eligibility filter: TokenBatch.market_id == issuance market AND kind == needed kind
            AND denomination_cents == needed denomination AND status == ACTIVE
            AND serial_end - next_serial + 1 >= needed_count (enough unminted serials; atomic — no partial mint across batches for one denomination)
        (b) ranking: serial_start ASC
        (c) tie-break: created_at ASC (never id)
        (d) empty-pool fallback: no eligible batch -> ERR_NO_ACTIVE_TOKEN_BATCH;
            eligible batches exist but none has enough serials -> ERR_BATCH_SERIALS_INSUFFICIENT
      Minting assigns serials ascending from the chosen batch's next_serial; next_serial advances by needed_count.
    input_set: "TokenBatch rows of the issuance's market"
    constants:
      BASE_DENOMINATIONS: [500, 100]
      MATCH_DENOMINATIONS: [100]
    precision: "integer cents and integer serials"

  - name: reimbursement_amount
    trigger: "provisional variant: submission create/resubmit; final variant: submission approve"
    algorithm: aggregation
    formula: |
      FEE_BPS = 250 (2.5% program administration withholding).
      PROVISIONAL (per-line rounding, optimistic inclusion):
        provisional_amount_cents = sum over attached tokens (all statuses attached at create) of
          round_half_up(denomination_cents * (1 - 250/10000))
        — rounding applied PER TOKEN LINE, then summed.
      FINAL (aggregate rounding, verified inclusion):
        approved_amount_cents = round_half_up(
          sum(denomination_cents over attached tokens with status == REDEEMED at approve time)
          * (1 - 250/10000))
        — sum first, withhold once, round once.
      The two variants legitimately diverge on identical token sets (e.g. tokens 500+100+100:
      provisional = 488+98+98 = 684; final = round_half_up(700*0.975) = round_half_up(682.5) = 683)
      and diverge further when tokens left REDEEMED status (FLAGGED/VOIDED) before approval.
    input_set: "Provisional: tokens attached at create/resubmit time. Final: attached tokens with status REDEEMED at approve time (FLAGGED/VOIDED/CONFISCATED excluded)"
    constants:
      FEE_BPS: 250
    precision: "round_half_up to integer cents; rounding order pinned per variant and NOT interchangeable"
    variants:
      - name: provisional
        when: "submission create and resubmit"
        difference: "per-line round_half_up of net-per-token, summed; includes all attached tokens regardless of later status changes"
      - name: final
        when: "submission approve"
        difference: "sum-then-withhold-then-round once; includes only tokens still REDEEMED at approve time"

  - name: program_liability
    trigger: "read of Program computed fields; funder-report generation"
    algorithm: forward_looking
    formula: |
      FORWARD (forward_looking): liability_forward_cents = sum(denomination_cents) over tokens
        in this program with status IN {ISSUED, REDEEMED, FLAGGED}
        — every token that may still legitimately be presented counts as exposure.
      REALIZED (chronological): liability_realized_cents = sum(denomination_cents) over tokens
        in this program with status IN {REDEEMED, SETTLED}
        — only value actually presented at stalls counts; replayed in token event order.
      Both EXCLUDE VOIDED and CONFISCATED. FLAGGED counts toward forward but not realized:
      a flagged token is contingent exposure, not yet a claim.
    input_set: "All Token rows whose issuance belongs to this program; status filters as written"
    constants: {}
    precision: "integer cents"
    variants:
      - name: forward_looking
        when: "funder exposure reporting and pool planning"
        difference: "includes ISSUED and FLAGGED tokens"
      - name: realized
        when: "reconciliation against reimbursement"
        difference: "includes only REDEEMED and SETTLED tokens"

  - name: market_day_reconciliation
    trigger: "any token status change on the day; POST /market-days/{id}/reconcile"
    algorithm: threshold
    formula: |
      issued_value_cents  = sum(denomination_cents) over tokens minted by this day's ACTIVE issuances
      voided_value_cents  = sum(denomination_cents) over those tokens with status VOIDED
      redeemed_value_cents= sum(denomination_cents) over those tokens with status IN {REDEEMED, SETTLED}
      variance_cents      = issued_value_cents - voided_value_cents - redeemed_value_cents
      Reconcilable iff |variance_cents| <= RECONCILE_TOLERANCE_CENTS (500) — the boundary is INCLUSIVE:
      variance exactly 500 reconciles; 501 flags.
      FLAGGED and CONFISCATED tokens count toward NEITHER redeemed NOR voided (they sit outside the
      ledger until their fraud case resolves) — flagging a redeemed token RAISES variance.
    input_set: "Tokens minted by this MarketDay's Issuance rows with issuance status ACTIVE"
    constants:
      RECONCILE_TOLERANCE_CENTS: 500
    precision: "integer cents"

  - name: settlement_sweep
    trigger: "POST /settlement-runs"
    algorithm: chronological
    formula: |
      Eligible set: RedemptionSubmission rows of the program with status == APPROVED
        AND approved_at <= cutoff_at (INCLUSIVE: approved_at exactly equal to cutoff is swept).
      Processing order (pinned): approved_at ASC; tie-break created_at ASC; id never used.
      Per swept submission: status APPROVED -> PAID; paid_amount_cents = approved_amount_cents;
        Vendor.payable_cents decreases; Program.paid_out_cents increases.
      Run outputs: total_paid_cents = sum of paid amounts; vendor_payment_count = count of
        DISTINCT vendor_id among swept submissions; swept_submission_ids in processing order.
      An empty eligible set is legal: run succeeds with total_paid_cents = 0 and empty list.
    input_set: "RedemptionSubmission rows of the program, status APPROVED, approved_at <= cutoff_at"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is in the endpoint's roles list; for entity_backed roles X-User-ID must equal an existing row of that entity (Vendor/Shopper); payload-scoped role rules also evaluate here (POST /market-days/{id}/reconcile with override_variance: true is ProgramAdmin-only — MarketManager sending it gets ERR_FORBIDDEN)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: business_constraint, check: "All POST endpoints require an Idempotency-Key header", error_id: ERR_MISSING_IDEMPOTENCY_KEY, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 4, category: business_constraint, check: "Idempotency-Key reused with a different request body replays conflict; same key + identical body returns the original response with no new side effects", error_id: ERR_IDEMPOTENCY_CONFLICT, http_status: 409, applies_to: "all POST endpoints" }
  - { priority: 5, category: existence, check: "Path template ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 6, category: existence, check: "Body-referenced ids (shopper_id, market_day_id, program_id, market_id, token_ids elements, fraud-case subject ids) exist", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 422, applies_to: "endpoints with body FK references" }
  - { priority: 7, category: existence, check: "POST /tokens/redeem serial_number maps to a minted token; serial outside every batch range of the program -> ERR_TOKEN_UNKNOWN_SERIAL; serial inside a batch range but not yet minted -> counterfeit signal ERR_TOKEN_NOT_MINTED", error_id: ERR_TOKEN_UNKNOWN_SERIAL, http_status: 404, applies_to: "POST /tokens/redeem" }
  - { priority: 8, category: business_constraint, check: "Required fields present, types correct, enum values in range (benefit_type, kind, outcome, to), serial_end >= serial_start, closes_at strictly after opens_at, MATCH batches must have denomination_cents 100 and BASE batches 500 or 100", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 9, category: business_constraint, check: "token_ids array empty on submission create/resubmit", error_id: ERR_SUBMISSION_EMPTY, http_status: 422, applies_to: "POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit" }
  - { priority: 10, category: state, check: "OCC: expected_shopper_version (POST /issuances) / expected_program_version (POST /settlement-runs) equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /issuances, POST /settlement-runs" }
  - { priority: 11, category: state, check: "Target entity state machine: transition valid from current state (generic invalid-from rejection)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 12, category: state, check: "Shopper.status == ACTIVE for issuance", error_id: ERR_SHOPPER_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /issuances" }
  - { priority: 13, category: state, check: "Vendor.status == ACTIVE for redeem/submission create/resubmit", error_id: ERR_VENDOR_NOT_ACTIVE, http_status: 409, applies_to: "POST /tokens/redeem, POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit" }
  - { priority: 14, category: state, check: "MarketDay.status == OPEN for issuance, redeem, reverse-redemption, issuance void; clock date == market day date for open", error_id: ERR_MARKET_DAY_NOT_OPEN, http_status: 409, applies_to: "POST /issuances, POST /tokens/redeem, POST /tokens/{id}/reverse-redemption, POST /issuances/{id}/void, POST /market-days/{id}/open" }
  - { priority: 15, category: state, check: "MarketDay.status IN {CLOSED, VARIANCE_FLAGGED} for verify and decide (RECONCILED days are locked)", error_id: ERR_MARKET_DAY_NOT_CLOSED, http_status: 409, applies_to: "POST /redemption-submissions/{id}/verify, POST /redemption-submissions/{id}/decide" }
  - { priority: 16, category: business_safety, check: "No attached/submitted token has status FLAGGED (fraud quarantine beats every other business rule, including submission-window expiry)", error_id: ERR_TOKEN_FLAGGED, http_status: 409, applies_to: "POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit, POST /tokens/redeem" }
  - { priority: 17, category: business_safety, check: "Redeem target token not already REDEEMED or SETTLED (double-spend); violation auto-transitions the held token REDEEMED -> FLAGGED and opens an AUTO_DOUBLE_SPEND FraudCase", error_id: ERR_TOKEN_ALREADY_REDEEMED, http_status: 409, applies_to: "POST /tokens/redeem" }
  - { priority: 18, category: business_safety, check: "Redeem target token not VOIDED or CONFISCATED", error_id: ERR_TOKEN_VOID, http_status: 409, applies_to: "POST /tokens/redeem" }
  - { priority: 19, category: business_referential, check: "Acting vendor's market == token's issuing market (redeem); submission token was redeemed by the submitting vendor (create/resubmit)", error_id: ERR_TOKEN_VENDOR_MISMATCH, http_status: 409, applies_to: "POST /tokens/redeem, POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit" }
  - { priority: 20, category: business_referential, check: "Token not already attached to another non-terminal (SUBMITTED/VERIFIED/DISPUTED/APPROVED) submission", error_id: ERR_TOKEN_ALREADY_SUBMITTED, http_status: 409, applies_to: "POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit" }
  - { priority: 21, category: business_temporal, check: "MarketDay.date within [Program.season_start, Program.season_end) at creation; issuance only on an OPEN day", error_id: ERR_SEASON_INACTIVE, http_status: 409, applies_to: "POST /market-days" }
  - { priority: 22, category: business_temporal, check: "Submission create/resubmit within window: market day OPEN, or CLOSED and now <= closes_at + SUBMISSION_WINDOW_DAYS (7d); resubmit alternatively within 72h of disputed_at", error_id: ERR_SUBMISSION_WINDOW_CLOSED, http_status: 409, applies_to: "POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit" }
  - { priority: 23, category: business_constraint, check: "New MarketDay operating window [opens_at, closes_at) must not overlap any other MarketDay window of the same market regardless of status; half-open semantics: abutting windows (existing.closes_at == new.opens_at) are LEGAL; date equality alone is not the test", error_id: ERR_MARKET_DAY_OVERLAP, http_status: 409, applies_to: "POST /market-days" }
  - { priority: 24, category: business_constraint, check: "New TokenBatch closed serial range [serial_start, serial_end] must not intersect any other non-RECALLED batch range in the same program (any kind/denomination); closed semantics: sharing an endpoint serial IS a conflict; strictly adjacent ranges (prev.end + 1 == next.start) are legal", error_id: ERR_SERIAL_RANGE_OVERLAP, http_status: 409, applies_to: "POST /token-batches" }
  - { priority: 25, category: business_constraint, check: "external_benefit_ref unique among non-SUSPENDED shoppers of the same program", error_id: ERR_DUPLICATE_ENROLLMENT, http_status: 409, applies_to: "POST /shoppers" }
  - { priority: 26, category: business_constraint, check: "FraudCase create: exactly one of vendor_id / shopper_id / token_id set", error_id: ERR_SUBJECT_AMBIGUOUS, http_status: 422, applies_to: "POST /fraud-cases" }
  - { priority: 27, category: business_constraint, check: "Batch selector: eligible ACTIVE batches exist for a needed (kind, denomination) but none has enough remaining serials (atomic per-denomination mint)", error_id: ERR_BATCH_SERIALS_INSUFFICIENT, http_status: 409, applies_to: "POST /issuances" }
  - { priority: 28, category: business_fiscal, check: "benefit_charged_cents >= 100", error_id: ERR_CHARGE_TOO_SMALL, http_status: 422, applies_to: "POST /issuances" }
  - { priority: 29, category: business_fiscal, check: "benefit_charged_cents multiple of 100 (whole-dollar scrip)", error_id: ERR_FRACTIONAL_CHARGE, http_status: 422, applies_to: "POST /issuances" }
  - { priority: 30, category: business_fiscal, check: "Token-batch selector fallback: no ACTIVE batch at all for a needed (kind, denomination)", error_id: ERR_NO_ACTIVE_TOKEN_BATCH, http_status: 409, applies_to: "POST /issuances" }
  - { priority: 31, category: business_fiscal, check: "Issuance void requires all tokens still ISSUED", error_id: ERR_ISSUANCE_NOT_VOIDABLE, http_status: 409, applies_to: "POST /issuances/{id}/void" }
  - { priority: 32, category: business_fiscal, check: "Manual reconcile without override requires |variance_cents| <= 500", error_id: ERR_RECONCILIATION_VARIANCE, http_status: 409, applies_to: "POST /market-days/{id}/reconcile" }

# =============================================================================
# §1.5 API Endpoint Table (49 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["All temporal validations and computed deadline checks evaluate against this clock"] }

  - { method: POST, path: "/programs", description: "Create an incentive program", roles: [ProgramAdmin], code: 201, input: [name, season_start, season_end, match_pool_budget_cents], output: Program, side_effects: ["match_pool_remaining_cents initialized to budget; liability fields 0; version 1"] }
  - { method: GET, path: "/programs/{id}", description: "Read program incl. computed pool/liability fields", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Vendor, Shopper], code: 200, input: [], output: Program, side_effects: [] }
  - { method: GET, path: "/programs/{id}/funder-report", description: "Computed read: funder snapshot over [period_start, period_end) half-open on issuance created_at — issued_base_cents, issued_match_cents, redeemed_cents, reimbursed_cents (PAID submissions), match_pool_remaining_cents, liability_forward_cents, liability_realized_cents, utilization_bp (10000 * match spent / budget, floor), days_flagged_count", roles: [ProgramAdmin, Auditor], code: 200, input: ["period_start?", "period_end?"], output: "{ issued_base_cents: integer, issued_match_cents: integer, redeemed_cents: integer, reimbursed_cents: integer, match_pool_remaining_cents: integer, liability_forward_cents: integer, liability_realized_cents: integer, utilization_bp: integer, days_flagged_count: integer }", side_effects: [] }
  - { method: GET, path: "/programs/{id}/markets", description: "List markets of a program (FK reverse)", roles: [ProgramAdmin, MarketManager, Auditor], code: 200, input: ["limit?", "offset?"], output: "Market[]", side_effects: [] }
  - { method: GET, path: "/programs/{id}/shoppers", description: "List shoppers of a program (FK reverse)", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor], code: 200, input: ["limit?", "offset?", "status?"], output: "Shopper[]", side_effects: [] }

  - { method: POST, path: "/markets", description: "Register a market under a program", roles: [ProgramAdmin], code: 201, input: [program_id, name, city], output: Market, side_effects: [] }

  - { method: POST, path: "/vendors", description: "Register a vendor at a market (PENDING)", roles: [ProgramAdmin], code: 201, input: [market_id, legal_name, stall_number], output: Vendor, side_effects: ["status PENDING; payable_cents 0"] }
  - { method: GET, path: "/vendors/{id}", description: "Read vendor incl. payable_cents", roles: [ProgramAdmin, MarketManager, Auditor, Vendor], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: GET, path: "/vendors", description: "List vendors, filterable by market_id / status", roles: [ProgramAdmin, MarketManager, Auditor], code: 200, input: ["market_id?", "status?", "limit?", "offset?"], output: "Vendor[]", side_effects: [] }
  - { method: POST, path: "/vendors/{id}/approve", description: "PENDING -> ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: Vendor, side_effects: ["Vendor.version +1"] }
  - { method: POST, path: "/vendors/{id}/set-status", description: "ACTIVE <-> SUSPENDED cycle (to: SUSPENDED|ACTIVE)", roles: [ProgramAdmin], code: 200, input: [to], output: Vendor, side_effects: ["Vendor.version +1"] }

  - { method: POST, path: "/shoppers", description: "Enroll a shopper (ENROLLED)", roles: [BoothOperator], code: 201, input: [program_id, external_benefit_ref, benefit_type], output: Shopper, side_effects: ["status ENROLLED; season_match_used_cents 0"] }
  - { method: GET, path: "/shoppers/{id}", description: "Read shopper incl. season_match_used_cents", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Shopper], code: 200, input: [], output: Shopper, side_effects: [] }
  - { method: POST, path: "/shoppers/{id}/verify", description: "ENROLLED -> ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: Shopper, side_effects: ["Shopper.version +1"] }
  - { method: POST, path: "/shoppers/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [ProgramAdmin], code: 200, input: [], output: Shopper, side_effects: ["Shopper.version +1"] }

  - { method: POST, path: "/market-days", description: "Schedule a market day (window overlap checked half-open)", roles: [MarketManager], code: 201, input: [market_id, date, opens_at, closes_at], output: MarketDay, side_effects: ["status SCHEDULED; totals 0"] }
  - { method: GET, path: "/market-days/{id}", description: "Read market day incl. issued/voided/redeemed/variance", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Vendor], code: 200, input: [], output: MarketDay, side_effects: [] }
  - { method: GET, path: "/market-days", description: "List market days, filterable by market_id / status", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Vendor], code: 200, input: ["market_id?", "status?", "limit?", "offset?"], output: "MarketDay[]", side_effects: [] }
  - { method: POST, path: "/market-days/{id}/open", description: "SCHEDULED -> OPEN (clock date must equal date)", roles: [MarketManager], code: 200, input: [], output: MarketDay, side_effects: ["MarketDay.version +1"] }
  - { method: POST, path: "/market-days/{id}/close", description: "OPEN -> CLOSED", roles: [MarketManager], code: 200, input: [], output: MarketDay, side_effects: ["MarketDay.version +1"] }
  - { method: POST, path: "/market-days/{id}/reconcile", description: "CLOSED -> RECONCILED when |variance| <= 500; CLOSED -> VARIANCE_FLAGGED (soft failure, 200) when |variance| > 500 and no override; VARIANCE_FLAGGED -> RECONCILED requires override_variance: true (ProgramAdmin only) else ERR_RECONCILIATION_VARIANCE", roles: [MarketManager, ProgramAdmin], code: 200, input: ["override_variance?"], output: MarketDay, side_effects: ["MarketDay.version +1"] }

  - { method: POST, path: "/token-batches", description: "Register a token batch (SEALED); closed-range serial overlap check program-wide", roles: [ProgramAdmin], code: 201, input: [market_id, kind, denomination_cents, serial_start, serial_end], output: TokenBatch, side_effects: ["next_serial := serial_start"] }
  - { method: GET, path: "/token-batches/{id}", description: "Read batch incl. next_serial", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor], code: 200, input: [], output: TokenBatch, side_effects: [] }
  - { method: GET, path: "/token-batches", description: "List batches, filterable by market_id / status / kind", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor], code: 200, input: ["market_id?", "status?", "kind?", "limit?", "offset?"], output: "TokenBatch[]", side_effects: [] }
  - { method: POST, path: "/token-batches/{id}/activate", description: "SEALED -> ACTIVE", roles: [ProgramAdmin], code: 200, input: [], output: TokenBatch, side_effects: ["TokenBatch.version +1"] }
  - { method: POST, path: "/token-batches/{id}/recall", description: "ACTIVE -> RECALLED; voids all ISSUED tokens of the batch (cascade)", roles: [ProgramAdmin], code: 200, input: [], output: TokenBatch, side_effects: ["ISSUED tokens -> VOIDED; MarketDay voided/variance recompute; auto CLOSED<->VARIANCE_FLAGGED transitions"] }

  - { method: POST, path: "/issuances", description: "Info-booth issuance: charge benefit, compute match, mint tokens (OCC on Shopper.version)", roles: [BoothOperator], code: 201, input: [shopper_id, market_day_id, benefit_charged_cents, expected_shopper_version], output: Issuance, side_effects: ["match_computation + token_denomination_split run; tokens minted ISSUED; Shopper.season_match_used_cents += match_cents; Shopper.version +1; Program.match_pool_remaining_cents -= match_cents; Program.version +1; MarketDay.issued_value_cents += base+match; MarketDay.version +1"] }
  - { method: GET, path: "/issuances/{id}", description: "Read issuance", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Shopper], code: 200, input: [], output: Issuance, side_effects: [] }
  - { method: GET, path: "/issuances", description: "List issuances, filterable by shopper_id / market_day_id / status", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor], code: 200, input: ["shopper_id?", "market_day_id?", "status?", "limit?", "offset?"], output: "Issuance[]", side_effects: [] }
  - { method: POST, path: "/issuances/{id}/void", description: "Same-day full reversal of an issuance (all tokens must be ISSUED)", roles: [BoothOperator], code: 200, input: [], output: Issuance, side_effects: ["tokens -> VOIDED; shopper season usage -= match; pool += match; MarketDay totals recompute"] }

  - { method: GET, path: "/tokens/{id}", description: "Read a token", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Vendor], code: 200, input: [], output: Token, side_effects: [] }
  - { method: GET, path: "/tokens", description: "List tokens, filterable by issuance_id / token_batch_id / submission_id / redeemed_vendor_id / serial_number / status; default order serial_number ASC (deterministic for indexed reads)", roles: [ProgramAdmin, MarketManager, BoothOperator, Auditor, Vendor], code: 200, input: ["issuance_id?", "token_batch_id?", "submission_id?", "redeemed_vendor_id?", "serial_number?", "status?", "limit?", "offset?"], output: "Token[]", side_effects: [] }
  - { method: POST, path: "/tokens/redeem", description: "Vendor accepts a physical token by serial_number (same-day scrip: issuing MarketDay must be OPEN)", roles: [Vendor], code: 200, input: [serial_number], output: Token, side_effects: ["ISSUED -> REDEEMED; redeemed_vendor_id set; MarketDay redeemed/variance recompute; double-spend attempt -> token FLAGGED + AUTO_DOUBLE_SPEND FraudCase"] }
  - { method: POST, path: "/tokens/{id}/reverse-redemption", description: "Undo a redemption (same-day, pre-submission, owning vendor only)", roles: [Vendor], code: 200, input: [], output: Token, side_effects: ["REDEEMED -> ISSUED; redeemed_vendor_id cleared; MarketDay redeemed/variance recompute"] }

  - { method: POST, path: "/redemption-submissions", description: "Vendor submits redeemed tokens for reimbursement (strict per-token ladder; provisional amount computed per-line)", roles: [Vendor], code: 201, input: [market_day_id, token_ids], output: RedemptionSubmission, side_effects: ["tokens attached (submission_id set); provisional_amount_cents computed (per-line rounding variant)"] }
  - { method: GET, path: "/redemption-submissions/{id}", description: "Read submission", roles: [ProgramAdmin, MarketManager, Auditor, Vendor], code: 200, input: [], output: RedemptionSubmission, side_effects: [] }
  - { method: GET, path: "/redemption-submissions", description: "List submissions, filterable by vendor_id / market_day_id / status", roles: [ProgramAdmin, MarketManager, Auditor, Vendor], code: 200, input: ["vendor_id?", "market_day_id?", "status?", "limit?", "offset?"], output: "RedemptionSubmission[]", side_effects: [] }
  - { method: POST, path: "/redemption-submissions/{id}/verify", description: "MarketManager verification: SUBMITTED -> VERIFIED or DISPUTED (requires day closed-or-later)", roles: [MarketManager], code: 200, input: [outcome], output: RedemptionSubmission, side_effects: ["DISPUTED sets disputed_at; version +1"] }
  - { method: POST, path: "/redemption-submissions/{id}/resubmit", description: "Vendor cures a DISPUTED submission with a full replacement token_ids list", roles: [Vendor], code: 200, input: [token_ids], output: RedemptionSubmission, side_effects: ["old tokens detached; new tokens attached; provisional recomputed; version +1"] }
  - { method: POST, path: "/redemption-submissions/{id}/decide", description: "ProgramAdmin adjudication: VERIFIED -> APPROVED (final aggregate-rounding amount; tokens SETTLED; cascades) or VERIFIED/DISPUTED -> REJECTED (tokens quarantined FLAGGED)", roles: [ProgramAdmin], code: 200, input: [outcome], output: RedemptionSubmission, side_effects: ["APPROVED: approved_amount_cents (aggregate rounding), approved_at, tokens -> SETTLED, Vendor.payable recompute, MarketDay variance recompute + auto flag transitions; REJECTED: tokens -> FLAGGED + detached"] }

  - { method: POST, path: "/fraud-cases", description: "Open a fraud case targeting exactly one of vendor/shopper/token", roles: [Auditor], code: 201, input: [reason, "vendor_id?", "shopper_id?", "token_id?"], output: FraudCase, side_effects: ["token_id target: token REDEEMED -> FLAGGED immediately on open; status OPEN; origin MANUAL"] }
  - { method: GET, path: "/fraud-cases/{id}", description: "Read fraud case", roles: [ProgramAdmin, Auditor], code: 200, input: [], output: FraudCase, side_effects: [] }
  - { method: GET, path: "/fraud-cases", description: "List fraud cases, filterable by vendor_id / shopper_id / token_id / status", roles: [ProgramAdmin, Auditor], code: 200, input: ["vendor_id?", "shopper_id?", "token_id?", "status?", "limit?", "offset?"], output: "FraudCase[]", side_effects: [] }
  - { method: POST, path: "/fraud-cases/{id}/confirm", description: "OPEN -> CONFIRMED with subject cascade (vendor suspend chain / shopper suspend / token confiscate)", roles: [ProgramAdmin], code: 200, input: [], output: FraudCase, side_effects: ["subject cascade per state machine"] }
  - { method: POST, path: "/fraud-cases/{id}/clear", description: "OPEN -> CLEARED; token subject FLAGGED -> REDEEMED compensation; no auto-reinstatement of vendor/shopper", roles: [ProgramAdmin], code: 200, input: [], output: FraudCase, side_effects: ["token compensation per state machine"] }

  - { method: POST, path: "/settlement-runs", description: "Sweep APPROVED submissions with approved_at <= cutoff_at (inclusive) into PAID (OCC on Program.version)", roles: [ProgramAdmin], code: 201, input: [program_id, cutoff_at, expected_program_version], output: SettlementRun, side_effects: ["per swept submission: -> PAID, paid_amount := approved_amount; Vendor.payable recompute; Program.paid_out_cents += total; Program.version +1"] }
  - { method: GET, path: "/settlement-runs/{id}", description: "Read settlement run incl. swept ids and totals", roles: [ProgramAdmin, Auditor], code: 200, input: [], output: SettlementRun, side_effects: [] }
  - { method: GET, path: "/settlement-runs", description: "List settlement runs, filterable by program_id", roles: [ProgramAdmin, Auditor], code: 200, input: ["program_id?", "limit?", "offset?"], output: "SettlementRun[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog (33 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity_backed identity mismatch (X-User-ID not an existing Vendor/Shopper row, or vendor acting on another vendor's resource)" }
  - { id: ERR_MISSING_IDEMPOTENCY_KEY, http: 400, condition: "POST without Idempotency-Key header" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "Idempotency-Key reused with a different request body" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body-referenced id (shopper_id, market_day_id, program_id, market_id, token_ids element, subject id) does not exist" }
  - { id: ERR_TOKEN_UNKNOWN_SERIAL, http: 404, condition: "Redeem serial_number not within any batch range of the program" }
  - { id: ERR_TOKEN_NOT_MINTED, http: 409, condition: "Redeem serial inside a batch range but not yet minted (counterfeit signal)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum out of range, serial_end < serial_start" }
  - { id: ERR_SUBMISSION_EMPTY, http: 422, condition: "token_ids empty on submission create/resubmit" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent entity current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not valid from the entity's current state" }
  - { id: ERR_SHOPPER_NOT_ELIGIBLE, http: 409, condition: "Issuance for shopper not ACTIVE (ENROLLED or SUSPENDED)" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Redeem/submission by vendor not ACTIVE" }
  - { id: ERR_MARKET_DAY_NOT_OPEN, http: 409, condition: "Operation requires MarketDay OPEN (or clock date mismatch on open)" }
  - { id: ERR_MARKET_DAY_NOT_CLOSED, http: 409, condition: "Verify requires MarketDay CLOSED/VARIANCE_FLAGGED/RECONCILED" }
  - { id: ERR_TOKEN_FLAGGED, http: 409, condition: "Token in FLAGGED status presented (redeem or submission); fraud quarantine outranks other business rules" }
  - { id: ERR_TOKEN_ALREADY_REDEEMED, http: 409, condition: "Double-spend: redeem of token already REDEEMED or SETTLED; token auto-FLAGGED and AUTO_DOUBLE_SPEND case opened" }
  - { id: ERR_TOKEN_VOID, http: 409, condition: "Redeem of VOIDED or CONFISCATED token" }
  - { id: ERR_TOKEN_VENDOR_MISMATCH, http: 409, condition: "Token redeemed by a different vendor than the actor/submitter, or actor's market != issuing market" }
  - { id: ERR_TOKEN_ALREADY_SUBMITTED, http: 409, condition: "Token already attached to a non-terminal submission" }
  - { id: ERR_SEASON_INACTIVE, http: 409, condition: "MarketDay.date outside [season_start, season_end)" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 409, condition: "Submission/resubmit outside the 7-day post-close window (and outside 72h dispute grace for resubmit)" }
  - { id: ERR_MARKET_DAY_OVERLAP, http: 409, condition: "New half-open operating window overlaps an existing non-terminal MarketDay window at the same market" }
  - { id: ERR_SERIAL_RANGE_OVERLAP, http: 409, condition: "New closed serial range intersects another non-RECALLED batch range in the program" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "external_benefit_ref already enrolled (non-SUSPENDED) in this program" }
  - { id: ERR_SUBJECT_AMBIGUOUS, http: 422, condition: "Fraud case must set exactly one of vendor_id/shopper_id/token_id" }
  - { id: ERR_BATCH_SERIALS_INSUFFICIENT, http: 409, condition: "ACTIVE batches exist for the (kind, denomination) but none has enough remaining serials" }
  - { id: ERR_NO_ACTIVE_TOKEN_BATCH, http: 409, condition: "No ACTIVE batch at all for a needed (kind, denomination)" }
  - { id: ERR_CHARGE_TOO_SMALL, http: 422, condition: "benefit_charged_cents < 100" }
  - { id: ERR_FRACTIONAL_CHARGE, http: 422, condition: "benefit_charged_cents not a multiple of 100" }
  - { id: ERR_ISSUANCE_NOT_VOIDABLE, http: 409, condition: "Void attempted after some token left ISSUED status" }
  - { id: ERR_RECONCILIATION_VARIANCE, http: 409, condition: "Manual reconcile without override while |variance_cents| > 500" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program operator: configures program/markets/vendors/batches, approves reimbursements, confirms fraud, runs settlements. Segregated FROM booth issuance (cannot issue/void) and FROM market verification (cannot verify submissions)."
    identity: opaque
    exclusive_operations:
      - "POST /programs, POST /markets, POST /vendors, POST /vendors/{id}/approve, POST /vendors/{id}/set-status"
      - "POST /shoppers/{id}/verify, POST /shoppers/{id}/suspend"
      - "POST /token-batches, POST /token-batches/{id}/activate, POST /token-batches/{id}/recall"
      - "POST /redemption-submissions/{id}/decide"
      - "POST /fraud-cases/{id}/confirm, POST /fraud-cases/{id}/clear"
      - "POST /settlement-runs"
      - "POST /market-days/{id}/reconcile with override_variance: true"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across resources"
      - "POST /market-days/{id}/reconcile with override_variance: false (shared with MarketManager)"
  - name: MarketManager
    description: "Runs market days and verifies vendor submissions. Segregated FROM approval/payment (ProgramAdmin) and FROM issuance (BoothOperator)."
    identity: opaque
    exclusive_operations:
      - "POST /market-days, POST /market-days/{id}/open, POST /market-days/{id}/close"
      - "POST /redemption-submissions/{id}/verify"
    shared_operations:
      - "GET reads"
      - "POST /market-days/{id}/reconcile with override_variance: false"
  - name: BoothOperator
    description: "Info-booth staff: enrolls shoppers, issues and voids tokens. Segregated FROM verification, approval, reconciliation override, and fraud adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /shoppers"
      - "POST /issuances, POST /issuances/{id}/void"
    shared_operations:
      - "GET reads (shoppers, market days, tokens, issuances, batches)"
  - name: Vendor
    description: "Market vendor: redeems tokens by serial, reverses own redemptions, submits and resubmits reimbursement claims. Cannot verify or approve own claims (segregation of duties)."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /tokens/redeem, POST /tokens/{id}/reverse-redemption"
      - "POST /redemption-submissions, POST /redemption-submissions/{id}/resubmit"
    shared_operations:
      - "GET /vendors/{id}, GET /tokens..., GET /redemption-submissions..., GET /market-days..., GET /programs/{id}"
  - name: Auditor
    description: "External auditor: read-mostly; opens fraud cases but CANNOT confirm or clear them (ProgramAdmin adjudicates)."
    identity: opaque
    exclusive_operations:
      - "POST /fraud-cases"
    shared_operations:
      - "GET reads"
  - name: Shopper
    description: "Benefit recipient: read-only access to own record and issuances."
    identity: "entity_backed:Shopper"
    exclusive_operations: []
    shared_operations:
      - "GET /shoppers/{id} (self), GET /issuances..., GET /programs/{id}"
