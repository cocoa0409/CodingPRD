  # ===========================================================================
  # Rule 9 - compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ride_credit_conservation_survives_redeem_then_interruption_restore
        grounds:
          - invariants.INV_RIDE_CREDIT_CONSERVATION
          - state_machines.Booking.OFFERED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_INTERRUPTED
          - entities.RidePass.fields.rides_remaining
          - entities.RidePass.fields.rides_consumed
          - entities.Booking.fields.redemption_status
        distinguishing_aspect: |
          Conserved quantity 1 of 2: ride credits. The forward action (confirm, taking 2 rides) and
          its compensating action (the posture cascade restoring them) must leave
          rides_purchased == rides_remaining + sum(party_size over REDEEMED bookings) true, so the
          pass ends at exactly 5 remaining and 0 consumed. Counting a RESTORED booking as still
          consumed silently loses two credits.
        test_recipe:
          setup:
            - "ServiceDay 2026-09-13 at 10.0 kn / 0.30 m / 2.10 m with no event, posture NORMAL."
            - "One SCHEDULED trip 10:00-10:25 Ferry Landing -> Quay Two with effective_capacity 40."
            - "An INNER pass owned by rider-ann with 5 rides bought for 5000 cents, valid to 2026-12-31."
            - "One confirmed 2-seat booking on that trip paid with the pass, so rides_remaining is 3, rides_consumed is 2 and redemption_status is REDEEMED."
            - "The clock reads 2026-09-13T08:00:00Z."
