            - "Crew.${crew_id}.mobility_status == ARRIVED throughout (capture crew_mobile)"
            - "TimeSheet.${ts_id}.status == SUBMITTED after hold release (capture ts_back)"
            - "Crew.${crew_id}.last_suspended_at is not null"

  # ==========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: safety_suspend_depth3_cascade
        grounds:
          - state_machines.Crew.CLEARED_TO_WORK_to_SAFETY_HOLD
          - state_machines.TimeSheet.SUBMITTED_to_HELD
          - state_machines.PerDiemClaim.SUBMITTED_to_HELD
          - state_machines.AssistanceRequest.FULFILLED_to_IN_PROGRESS
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /crews/{id}/suspend: (1) crew readiness
          -> SAFETY_HOLD; (2) that readiness mutation moves the crew's SUBMITTED
          timesheet AND SUBMITTED per-diem claim to HELD; (3) the crew-state
          mutation forces deployable_crew_count 1 -> 0 which demotes the request
          FULFILLED -> IN_PROGRESS. Each link is caused by the previous link.
        test_recipe:
          setup: ["Request FULFILLED with required_minimum_crews 1 and exactly one ARRIVED+CLEARED crew; one SUBMITTED timesheet; one SUBMITTED per-diem claim"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
