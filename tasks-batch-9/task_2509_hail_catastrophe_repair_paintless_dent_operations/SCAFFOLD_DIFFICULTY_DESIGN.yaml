  - rule_id: non_linear_state_machine
    instances:

      - name: vehicle_rework_cycle_returns_to_in_repair_and_resets_on_retriage
        grounds:
          - state_machines.Vehicle.QC_PENDING_to_QC_FAILED
          - state_machines.Vehicle.QC_FAILED_to_IN_REPAIR
          - state_machines.Vehicle.IN_REPAIR_to_QC_PENDING
          - state_machines.Vehicle.QC_FAILED_to_TRIAGED
          - state_machines.WorkTicket.SUBMITTED_to_VOIDED
          - entities.Vehicle.fields.rework_count
          - entities.Vehicle.fields.pdr_feasible
          - validations[priority=34]
          - calculations.repairability_triage
          - calculations.vehicle_net_billable
        distinguishing_aspect: |
          The repair dimension loops QC_PENDING -> QC_FAILED -> IN_REPAIR -> QC_PENDING three times
          on the same vehicle, and the loop is not idempotent: rework_count climbs 1 -> 2 -> 3, the
          fourth start-repair is rejected with ERR_REWORK_LIMIT_EXCEEDED, and only then does the
          re-triage escape hatch fire, flipping pdr_feasible to false, rewriting approved_repair_cents
          from 202886 to the conventional 257750, VOIDing all three tickets and resetting
          rework_count to 0 - so the state reached after three cycles differs from the state after one.
        test_recipe:
          setup:
            - "Base fixture: clock 2026-08-05T08:00:00Z, event ACTIVE, KS facility COMMISSIONED with both permits, ACTIVE rate agreement, carrier direct_bill_enabled."
            - "Technicians TA (MASTER, KS) and TC (JOURNEYMAN, KS, inspector) both ON_SITE."
            - "Vehicle with the three-panel matrix estimated (matrix 202886, conventional 257750), TRIAGED to PDR_REPAIR, AUTHORIZED, IN_REPAIR with TA's first ticket submitted so it is QC_PENDING."
