  - rule_id: non_linear_state_machine
    instances:
      - name: application_correction_loop_cycle
        grounds:
          - state_machines.IncentiveApplication.UNDER_REVIEW_to_CORRECTION_REQUESTED
          - state_machines.IncentiveApplication.CORRECTION_REQUESTED_to_UNDER_REVIEW
          - state_machines.IncentiveApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          IncentiveApplication runs a CYCLIC machine: UNDER_REVIEW ->
          CORRECTION_REQUESTED -> UNDER_REVIEW twice in a row (unbounded
          correction loop) before APPROVED — a non-linear shape on the
          application entity, distinct from the transfer negotiation loop.
        test_recipe:
          setup:
            - "GA program OPEN; application created and submitted at the default clock; claimed by reviewer-1"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
