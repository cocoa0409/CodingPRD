  - section: errors
    instances:
      - name: shipment_not_delivered_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHIPMENT_NOT_DELIVERED]
          - validations[priority=22]
        excluded_because:
          difficulty_instance: claim_filing_requires_delivered_shipment
          rationale: >-
            The §1.8 instance already opens a claim against a PICKED_UP shipment and pins
            ERR_SHIPMENT_NOT_DELIVERED, then repeats the call after delivery to show the same
            payload succeeding; a §1.9 copy would add no new discrimination.

      - name: capacity_block_not_assigned_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAPACITY_BLOCK_NOT_ASSIGNED]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: packing_requires_an_awarded_capacity_block
          rationale: >-
            Packing a SURVEYED shipment whose capacity_block_id is still null is exactly the §1.8
            gate scenario, including the follow-up pack that succeeds once the award exists.

      - name: market_not_served_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MARKET_NOT_SERVED]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: award_market_referential_error_outranks_capacity_fiscal_error
          rationale: >-
            The §1.8 priority-ordering instance triggers the market mismatch on an award that is
            also over capacity, so the code is already exercised together with its precedence.

      - name: capacity_exceeded_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAPACITY_EXCEEDED]
          - validations[priority=58]
        excluded_because:
          difficulty_instance: award_exactly_filling_general_pool_is_accepted
          rationale: >-
            The §1.8 boundary instance awards exactly the pool (accepted) and then one pound more
            (ERR_CAPACITY_EXCEEDED), which covers the code at the only interesting point.

      - name: sit_period_overlap_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SIT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: sit_periods_are_inclusive_and_need_a_one_day_gap
          rationale: >-
            The §1.8 instance drives the touching-interval boundary (entry on the released period's
            last day, then on the next day) and pins the overlap code on the first attempt.

      - name: capacity_block_overlap_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAPACITY_BLOCK_OVERLAP]
        excluded_because:
          difficulty_instance: capacity_weeks_are_half_open_so_adjacent_weeks_are_legal
          rationale: >-
            The §1.8 half-open-interval instance creates the adjacent week (accepted) and an
            overlapping week (ERR_CAPACITY_BLOCK_OVERLAP) for the same TSP and market.

      - name: claim_info_request_limit_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLAIM_INFO_REQUEST_LIMIT]
        excluded_because:
          difficulty_instance: claim_review_info_request_cycle_terminates_at_third_request
          rationale: >-
            The §1.8 cycle instance walks UNDER_REVIEW -> INFO_REQUESTED three times and shows the
            fourth request returning ERR_CLAIM_INFO_REQUEST_LIMIT.

      - name: no_waiver_to_revoke_error_excluded_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_WAIVER_TO_REVOKE]
          - validations[priority=61]
        excluded_because:
          difficulty_instance: excess_cost_waiver_and_revocation_conserve_gross_excess_cost
          rationale: >-
            The §1.8 conservation instance revokes a real waiver and then revokes again with
            excess_cost_waived_usd back at 0.00, which is the only way to reach this code.

  - section: rbac
    instances:
      - name: read_with_missing_x_user_role_header_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - roles[ServiceMember, MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
        distinguishing_aspect: >-
          401 is reserved for a missing or undeclared identity, so the same GET that succeeds for a
          declared role fails with ERR_UNAUTHENTICATED — not ERR_UNAUTHORIZED — when the header is
          absent or names a role outside §1.7.
        test_recipe:
          setup:
            - "One registered service member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000054", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: "(none — X-User-Role header omitted)"
              as_user_id: "counselor-01"
              captures: { err_missing: $.data.error_id }
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: "TransportationAuditor (role not declared in §1.7)"
              as_user_id: "auditor-01"
              captures: { err_unknown: $.data.error_id }
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: TspCoordinator
              as_user_id: "tsp-coordinator-01"
              captures: { ok_name: $.data.full_name }
          assert:
            - "${err_missing} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${err_unknown} == ERR_UNAUTHENTICATED with HTTP 401 as well — an undeclared role never reaches the 403 path"
            - "${ok_name} == Dana Reyes: the identical path and body succeed for a declared role, so the 401s are attributable to identity alone"

      - name: tsp_coordinator_cannot_authorize_an_entitlement_unauthorized
        claim_type: role_denial
        grounds:
          - roles[MoveCounselor.shared_operations]
          - endpoints[POST /hhg/entitlements/{id}/authorize]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >-
          Authorization of the weight allowance is limited to MoveCounselor and ProgramAdmin; a
          TspCoordinator carrying a valid identity is refused with 403 and the entitlement stays
          DRAFT, so no side effect leaks from the denied call.
        test_recipe:
          setup:
            - "A DRAFT entitlement created by counseling completion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
