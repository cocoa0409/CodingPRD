              as: Contractor
              as_user_id: "${ctr_id}"
          assert:
            - "The first trigger call returns 200 with RebateProject.${proj_id}.status == SUBMITTED (the entity re-enters a state it already occupied)"
            - "RebateProject.${proj_id}.submission_count == 2 after the loop and incomplete_reason is null again"
            - "RebateProject.${proj_id}.provisional_total_incentive_cents == 600000 after the resubmission (before the loop it was 800000: 609523 + 190477 under HVAC_GROUP proration)"
