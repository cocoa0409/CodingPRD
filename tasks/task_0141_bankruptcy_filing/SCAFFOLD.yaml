# =============================================================================
# task_0141_bankruptcy_filing — SCAFFOLD.yaml
# =============================================================================

scenario: |
  Bankruptcy Filing (Chapter 7/13): Means Test, Schedules A-J, 341 creditors'
  meeting, Automatic Stay, Chapter 13 reorganization plan, monthly trustee
  payment, Discharge exemptions. Output folder: tasks/task_0141_bankruptcy_filing

domain_name: bankruptcy-filing
api_prefix: /cases

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - waterfall_allocation

  entity_topology: hybrid
  state_machine_shape: branching        # Case branches between Ch7 / Ch13 paths
  relationship_patterns:
    - one_to_many                       # Case → Claim, Case → Schedule, Plan → TrusteePayment
    - cross_aggregate                   # CollectionAction references Creditor + Case across boundary

  role_model: segregation_of_duties     # Debtor / Trustee / Creditor cannot cross roles
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Debtor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Debtor legal name" }
      - { name: household_size, type: integer, source: input, description: "Household size (used for median-income lookup)", constraints: ">= 1" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; controls state median income table", constraints: "exactly 2 uppercase letters" }
      - { name: total_cases_filed, type: integer, source: computed, description: "Count of Case rows referencing this debtor where status != WITHDRAWN_PRE_FILE" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: debtor_id, type: string, source: input, description: "Owning Debtor.id" }
      - { name: chapter_requested, type: enum, source: input, description: "CHAPTER_7 | CHAPTER_13 — debtor's initial filing intent", constraints: "CHAPTER_7 | CHAPTER_13" }
      - { name: chapter_effective, type: enum, source: computed, description: "CHAPTER_7 | CHAPTER_13 — set on file_case after means-test gate; equals chapter_requested unless means test forces CHAPTER_13", constraints: "CHAPTER_7 | CHAPTER_13" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | MEETING_SCHEDULED | MEETING_HELD | PLAN_PROPOSED | PLAN_CONFIRMED | IN_REPAYMENT | DISCHARGED | DISMISSED | WITHDRAWN_PRE_FILE", constraints: "see state machine" }
      - { name: automatic_stay_active, type: boolean, source: computed, description: "true while status in {FILED, MEETING_SCHEDULED, MEETING_HELD, PLAN_PROPOSED, PLAN_CONFIRMED, IN_REPAYMENT}; false otherwise" }
      - { name: filing_date, type: datetime, source: system, description: "Server clock at the DRAFT→FILED transition" }
      - { name: meeting_341_date, type: datetime, source: input, description: "Date of the 341 creditors' meeting (must be >= filing_date + 21 days)" }
      - { name: schedule_completeness, type: array, source: computed, description: "List of missing schedule_types from {A,B,C,D,E,F,G,H,I,J}; empty means complete" }
      - { name: means_test_result_id, type: string, source: computed, description: "FK to the active MeansTestResult; null until first means-test run" }
      - { name: total_unsecured_pool_cents, type: integer, source: computed, description: "Sum of allowed Claim.amount_cents for claim_class=GENERAL_UNSECURED" }

  - name: Schedule
    parent: Case
    common_fields: false                # append-only snapshots — only id + created_at
    fields:
      - { name: case_id, type: string, source: system, description: "Owning Case.id" }
      - { name: schedule_type, type: enum, source: input, description: "A | B | C | D | E | F | G | H | I | J — Schedule A-J letter" }
      - { name: line_items, type: array, source: input, description: "Schedule line items, each {label, amount_cents}" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of all line_items[].amount_cents" }
      - { name: superseded_by_id, type: string, source: system, description: "If non-null, id of the Schedule row that replaced this one" }

  - name: Creditor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Creditor legal name" }
      - { name: creditor_type, type: enum, source: input, description: "SECURED | PRIORITY | GENERAL_UNSECURED", constraints: "SECURED | PRIORITY | GENERAL_UNSECURED" }

  - name: Claim
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "Owning Case.id" }
      - { name: creditor_id, type: string, source: input, description: "FK to Creditor.id" }
      - { name: claim_class, type: enum, source: input, description: "SECURED | PRIORITY | GENERAL_UNSECURED — copied from Creditor.creditor_type at creation and frozen", constraints: "SECURED | PRIORITY | GENERAL_UNSECURED" }
      - { name: amount_cents, type: integer, source: input, description: "Filed amount, integer cents" }
      - { name: is_dischargeable, type: boolean, source: input, description: "false for support, certain taxes, criminal restitution, fraud (the exempt set); true otherwise" }
      - { name: status, type: enum, source: system, description: "FILED | ALLOWED | DISALLOWED | DISCHARGED | NON_DISCHARGEABLE_REMAINS" }

  - name: MeansTestResult
    parent: Case
    common_fields: false                # immutable computation snapshot
    fields:
      - { name: case_id, type: string, source: system, description: "Owning Case.id" }
      - { name: current_monthly_income_cents, type: integer, source: computed, description: "Average of last 6 months of income from Schedule I line items, in cents (rounded half-up at the end)" }
      - { name: cmi_annualized_cents, type: integer, source: computed, description: "current_monthly_income_cents * 12" }
      - { name: state_median_annual_cents, type: integer, source: computed, description: "STATE_MEDIAN_TABLE[state_code][household_size] in cents (constant table; see §1.3)" }
      - { name: presumption_of_abuse, type: boolean, source: computed, description: "true iff cmi_annualized_cents > state_median_annual_cents" }
      - { name: allowed_monthly_expenses_cents, type: integer, source: computed, description: "Sum of Schedule J line_items[].amount_cents at run time" }
      - { name: disposable_monthly_income_cents, type: integer, source: computed, description: "max(0, current_monthly_income_cents - allowed_monthly_expenses_cents)" }
      - { name: required_plan_months, type: integer, source: computed, description: "36 if presumption_of_abuse=false else 60" }
      - { name: minimum_plan_total_cents, type: integer, source: computed, description: "disposable_monthly_income_cents * required_plan_months" }

  - name: Plan
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "Owning Case.id (must have chapter_effective=CHAPTER_13)" }
      - { name: proposed_monthly_payment_cents, type: integer, source: input, description: "Debtor's proposed monthly trustee payment" }
      - { name: plan_months, type: integer, source: input, description: "Number of months in the plan; must equal Case.MeansTestResult.required_plan_months" }
      - { name: planned_total_cents, type: integer, source: computed, description: "proposed_monthly_payment_cents * plan_months" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "Sum of TrusteePayment.amount_cents for status=APPLIED on this plan" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | COMPLETED | DEFAULTED | WITHDRAWN" }
      - { name: missed_payment_count, type: integer, source: computed, description: "Count of TrusteePayment rows with status=MISSED on this plan" }

  - name: TrusteePayment
    parent: Plan
    common_fields: false                # append-only ledger entries
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: sequence_number, type: integer, source: input, description: "Monthly index 1..plan_months; unique per plan" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; APPLIED status only" }
      - { name: status, type: enum, source: input, description: "APPLIED | MISSED — APPLIED = paid; MISSED = recorded missed month", constraints: "APPLIED | MISSED" }
      - { name: applied_at, type: datetime, source: system, description: "Server clock when row was recorded" }

  - name: CollectionAction
    parent: null
    common_fields: false                # immutable attempt log
    fields:
      - { name: creditor_id, type: string, source: input, description: "Acting creditor" }
      - { name: case_id, type: string, source: input, description: "Target case" }
      - { name: action_kind, type: enum, source: input, description: "GARNISH | LIEN | LAWSUIT | DUNNING_LETTER" }
      - { name: outcome, type: enum, source: computed, description: "PROCESSED | REJECTED_STAY — REJECTED_STAY iff Case.automatic_stay_active=true at insert time" }
      - { name: rejected_reason, type: string, source: computed, description: "Empty string when PROCESSED; 'AUTOMATIC_STAY_ACTIVE' when REJECTED_STAY" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: DRAFT
    terminal_states: [DISCHARGED, DISMISSED, WITHDRAWN_PRE_FILE]
    transitions:
      - from: DRAFT
        to: WITHDRAWN_PRE_FILE
        trigger: "DELETE /cases/{case_id}"
        actor: Debtor
        preconditions: []
        side_effects:
          - "automatic_stay_active stays false"

      - from: DRAFT
        to: FILED
        trigger: "POST /cases/{case_id}/file"
        actor: Debtor
        preconditions:
          - "schedule_completeness == [] (all 10 schedules A-J present, ERR_SCHEDULES_INCOMPLETE)"
          - "Active MeansTestResult exists (ERR_MEANS_TEST_NOT_RUN)"
          - "If chapter_requested=CHAPTER_7 and MeansTestResult.presumption_of_abuse=true: reject (ERR_PRESUMPTION_OF_ABUSE)"
        side_effects:
          - "filing_date set to server clock"
          - "chapter_effective set: CHAPTER_7 if chapter_requested=CHAPTER_7 (presumption already cleared); else CHAPTER_13"
          - "automatic_stay_active flips to true (debtor_protection_invariant)"
          - "Server triggers stay-cascade: any CollectionAction inserted from now on for this case → outcome=REJECTED_STAY (see CollectionAction state machine)"

      - from: FILED
        to: MEETING_SCHEDULED
        trigger: "POST /cases/{case_id}/schedule-341 with meeting_date"
        actor: Trustee
        preconditions:
          - "meeting_date >= filing_date + 21 days (ERR_MEETING_TOO_EARLY)"
        side_effects:
          - "meeting_341_date set"

      - from: MEETING_SCHEDULED
        to: MEETING_HELD
        trigger: "POST /cases/{case_id}/conduct-341"
        actor: Trustee
        preconditions:
          - "Server clock >= meeting_341_date (ERR_MEETING_DATE_NOT_REACHED)"
        side_effects:
          - "Cascade hop 1: all Claim rows in FILED state for this case auto-transition FILED → ALLOWED (claim_review_cascade)"

      - from: MEETING_HELD
        to: DISCHARGED
        trigger: "POST /cases/{case_id}/discharge"
        actor: Judge
        preconditions:
          - "chapter_effective == CHAPTER_7 (Chapter 13 cases must finish plan first, ERR_PLAN_NOT_COMPLETE)"
        side_effects:
          - "Cascade hop 1: every Claim with status=ALLOWED → DISCHARGED if is_dischargeable=true, else NON_DISCHARGEABLE_REMAINS"
          - "Cascade hop 2: automatic_stay_active flips to false (stay lifts on discharge)"

      - from: MEETING_HELD
        to: PLAN_PROPOSED
        trigger: "POST /cases/{case_id}/plans (Plan creation)"
        actor: Debtor
        preconditions:
          - "chapter_effective == CHAPTER_13 (ERR_NOT_CHAPTER_13)"
        side_effects:
          - "Plan row created in PROPOSED"

      - from: PLAN_PROPOSED
        to: PLAN_CONFIRMED
        trigger: "POST /cases/{case_id}/plans/{plan_id}/confirm"
        actor: Judge
        preconditions:
          - "Plan.proposed_monthly_payment_cents * Plan.plan_months >= MeansTestResult.minimum_plan_total_cents (ERR_PLAN_UNDERFUNDED — fiscal_feasibility_invariant)"
          - "Plan.plan_months == MeansTestResult.required_plan_months (ERR_PLAN_MONTHS_MISMATCH)"
        side_effects:
          - "Plan.status → CONFIRMED"

      - from: PLAN_CONFIRMED
        to: IN_REPAYMENT
        trigger: "POST /cases/{case_id}/plans/{plan_id}/payments (first APPLIED payment)"
        actor: Debtor
        preconditions:
          - "First TrusteePayment with status=APPLIED and sequence_number=1 has been recorded for this plan"
        side_effects: []

      - from: IN_REPAYMENT
        to: DISCHARGED
        trigger: "POST /cases/{case_id}/discharge"
        actor: Judge
        preconditions:
          - "Plan.paid_to_date_cents >= Plan.planned_total_cents (ERR_PLAN_NOT_COMPLETE)"
          - "Plan.missed_payment_count == 0 (ERR_PLAN_IN_DEFAULT)"
        side_effects:
          - "Plan.status → COMPLETED"
          - "Cascade hop 1: trustee-payment waterfall runs final reconciliation (every APPLIED TrusteePayment.amount_cents is allocated via waterfall_allocation calc; see §1.3)"
          - "Cascade hop 2: every Claim with status=ALLOWED → DISCHARGED if is_dischargeable=true, else NON_DISCHARGEABLE_REMAINS (uses post-waterfall residual)"
          - "Cascade hop 3: automatic_stay_active flips to false"

      - from: IN_REPAYMENT
        to: DISMISSED
        trigger: "POST /cases/{case_id}/dismiss"
        actor: Trustee
        preconditions:
          - "Plan.missed_payment_count >= 3 (ERR_DISMISSAL_NOT_WARRANTED — boundary at >=3)"
        side_effects:
          - "Plan.status → DEFAULTED"
          - "automatic_stay_active flips to false"
          - "Cascade: every Claim with status=ALLOWED → NON_DISCHARGEABLE_REMAINS (dismissal does NOT discharge anything; allowed_claim_invariant compensates: total ALLOWED amount unchanged across the dismiss action)"

      - from: MEETING_SCHEDULED
        to: DISMISSED
        trigger: "POST /cases/{case_id}/dismiss"
        actor: Trustee
        preconditions: []
        side_effects:
          - "automatic_stay_active flips to false"

      - from: PLAN_PROPOSED
        to: DISMISSED
        trigger: "POST /cases/{case_id}/dismiss"
        actor: Trustee
        preconditions: []
        side_effects:
          - "automatic_stay_active flips to false"

  - entity: Plan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, DEFAULTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "DELETE /cases/{case_id}/plans/{plan_id}"
        actor: Debtor
        preconditions:
          - "Case.status == PLAN_PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "Case.status reverts MEETING_HELD (revision loop: debtor may submit a different Plan — cyclic shape)"

      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /cases/{case_id}/plans/{plan_id}/confirm"
        actor: Judge
        preconditions:
          - "Case.status == PLAN_PROPOSED"
          - "planned_total_cents >= Case.MeansTestResult.minimum_plan_total_cents (ERR_PLAN_UNDERFUNDED)"
          - "plan_months == Case.MeansTestResult.required_plan_months (ERR_PLAN_MONTHS_MISMATCH)"
        side_effects:
          - "Case.status → PLAN_CONFIRMED"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (auto on Case discharge)"
        actor: system
        preconditions:
          - "paid_to_date_cents >= planned_total_cents"
        side_effects: []

      - from: CONFIRMED
        to: DEFAULTED
        trigger: "system (auto on Case dismissal from IN_REPAYMENT)"
        actor: system
        preconditions:
          - "missed_payment_count >= 3"
        side_effects: []

  - entity: Claim
    initial_state: FILED
    terminal_states: [DISALLOWED, DISCHARGED, NON_DISCHARGEABLE_REMAINS]
    transitions:
      - from: FILED
        to: ALLOWED
        trigger: "system (auto on Case MEETING_SCHEDULED → MEETING_HELD)"
        actor: system
        preconditions:
          - "Claim.amount_cents > 0 (ERR_CLAIM_AMOUNT_INVALID)"
        side_effects:
          - "Case.total_unsecured_pool_cents recomputes"

      - from: FILED
        to: DISALLOWED
        trigger: "POST /cases/{case_id}/claims/{claim_id}/disallow"
        actor: Trustee
        preconditions:
          - "Case.status in {FILED, MEETING_SCHEDULED} (ERR_INVALID_STATE)"
        side_effects: []

      - from: ALLOWED
        to: DISCHARGED
        trigger: "system (auto on Case discharge)"
        actor: system
        preconditions:
          - "is_dischargeable == true"
        side_effects: []

      - from: ALLOWED
        to: NON_DISCHARGEABLE_REMAINS
        trigger: "system (auto on Case discharge or dismissal)"
        actor: system
        preconditions:
          - "is_dischargeable == false OR Case was dismissed"
        side_effects: []

  - entity: CollectionAction
    initial_state: PROCESSED          # set at insert; immutable thereafter
    terminal_states: [PROCESSED, REJECTED_STAY]
    transitions:
      - from: PROCESSED
        to: REJECTED_STAY
        trigger: "POST /collection-actions (system gate at insert)"
        actor: system
        preconditions:
          - "Case.automatic_stay_active == true at insert time"
        side_effects:
          - "rejected_reason set to 'AUTOMATIC_STAY_ACTIVE'"
        note: "CollectionAction is immutable — the row is born in its final state. Transition modeled here for difficulty-rule cross-entity-state-dependency."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Debtor submits a second Plan while an existing Plan is still PROPOSED"
    guarantee: "At most one Plan per Case in PROPOSED+CONFIRMED+IN_REPAYMENT states; second insert rejected"
    error_id: ERR_PLAN_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on (case_id, status IN {PROPOSED, CONFIRMED}) uniqueness"

  - scenario: "Two trustee-payment rows submitted concurrently with the same sequence_number on the same plan"
    guarantee: "At most one payment per (plan_id, sequence_number); second insert rejected"
    error_id: ERR_PAYMENT_SEQUENCE_DUPLICATE
    http_status: 409
    serialization: "First-writer-wins on (plan_id, sequence_number) uniqueness"

  - scenario: "Trustee conducts the 341 meeting while debtor concurrently dismisses the case from MEETING_SCHEDULED"
    guarantee: "Exactly one operation succeeds; loser is rejected because Case.status no longer matches the precondition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Case.status"

  - scenario: "Creditor inserts a CollectionAction at the exact instant of the DRAFT→FILED transition"
    guarantee: "Insertions evaluate Case.automatic_stay_active after the file_case transition commits; once stay is on, all subsequent CollectionAction rows are REJECTED_STAY"
    error_id: ERR_AUTOMATIC_STAY_VIOLATION
    http_status: 409
    serialization: "First-writer-wins on Case.status; CollectionAction reads stay flag inside the same transaction as the action insert"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: means_test
    trigger: "POST /cases/{case_id}/means-test"
    algorithm: threshold
    formula: |
      # All values in integer cents; rounding only on the CMI division step
      monthly_income_lines = Schedule I most recent for this case → line_items
      raw_six_month_sum_cents = sum(line.amount_cents for line in monthly_income_lines[-6:])
      current_monthly_income_cents = round_half_up(raw_six_month_sum_cents / 6)
      cmi_annualized_cents       = current_monthly_income_cents * 12
      state_median_annual_cents  = STATE_MEDIAN_TABLE[debtor.state_code][debtor.household_size]
      presumption_of_abuse       = (cmi_annualized_cents > state_median_annual_cents)   # strict greater-than boundary
      allowed_monthly_expenses_cents = sum(line.amount_cents for line in Schedule J line_items)
      disposable_monthly_income_cents = max(0, current_monthly_income_cents - allowed_monthly_expenses_cents)
      required_plan_months       = 60 if presumption_of_abuse else 36
      minimum_plan_total_cents   = disposable_monthly_income_cents * required_plan_months
    input_set: "Most recent Schedule of type I and most recent Schedule of type J (superseded_by_id == null) for the case"
    constants:
      STATE_MEDIAN_TABLE_CA_1: 6500000   # cents, $65,000 — single in CA
      STATE_MEDIAN_TABLE_CA_2: 8500000   # cents, $85,000 — two-person household in CA
      STATE_MEDIAN_TABLE_TX_1: 6000000   # cents, $60,000 — single in TX
      STATE_MEDIAN_TABLE_TX_2: 8000000   # cents, $80,000 — two-person household in TX
      DEFAULT_STATE_MEDIAN_1: 6000000    # cents, fallback single
      DEFAULT_STATE_MEDIAN_2: 8000000    # cents, fallback two-person
    precision: "integer cents throughout; one round_half_up on the CMI division step; no further rounding"
    variants:
      - name: chapter_7_gate
        when: "chapter_requested == CHAPTER_7 at file_case time"
        difference: "Only presumption_of_abuse is consulted; disposable_monthly_income_cents is IGNORED. If presumption_of_abuse=true, ERR_PRESUMPTION_OF_ABUSE is raised — debtor cannot file Ch7."
      - name: chapter_13_plan_floor
        when: "chapter_effective == CHAPTER_13 at plan confirmation"
        difference: "Only disposable_monthly_income_cents × required_plan_months (= minimum_plan_total_cents) is consulted; presumption_of_abuse is IGNORED. Plan must meet or exceed this floor."

  - name: trustee_payment_waterfall
    trigger: "system on Case IN_REPAYMENT → DISCHARGED (final reconciliation of the plan)"
    algorithm: waterfall_allocation
    formula: |
      # Pin: round per-bucket allocation, then sum (NOT sum-then-round).
      # Pin: iterate buckets in ORDER [ADMIN_FEE, PRIORITY, SECURED_ARREARS, GENERAL_UNSECURED]
      # Pin: tie-break inside GENERAL_UNSECURED is Claim.id lexicographic ascending.
      pool_cents = Plan.paid_to_date_cents
      # 1. ADMIN_FEE: 10% of pool, rounded half-up at this step
      admin_fee_cents = round_half_up(pool_cents * 0.10)
      pool_cents -= admin_fee_cents
      # 2. PRIORITY claims paid in full in Claim.id ascending order; partial fills allowed only on the last bucket
      for claim in sorted(claims where claim_class=PRIORITY, status=ALLOWED, key=Claim.id asc):
          take = min(pool_cents, claim.amount_cents)
          claim.recovered_cents = take
          pool_cents -= take
      # 3. SECURED_ARREARS bucket — same shape as PRIORITY (Claim.id asc)
      for claim in sorted(claims where claim_class=SECURED, status=ALLOWED, key=Claim.id asc):
          take = min(pool_cents, claim.amount_cents)
          claim.recovered_cents = take
          pool_cents -= take
      # 4. GENERAL_UNSECURED pro-rata: each claim's share is round_half_up(remaining_pool * claim.amount / sum_of_unsecured_amounts).
      #    Sum the per-claim rounded shares first; if rounding drift left pool_cents > sum_of_shares, give the residual cent(s)
      #    to the smallest Claim.id (deterministic tie-break).
      remaining = pool_cents
      total_unsecured = sum(claim.amount_cents for claim in unsecured_allowed)
      shares = []
      for claim in unsecured_allowed:
          shares.append(round_half_up(remaining * claim.amount_cents / total_unsecured))
      residual = remaining - sum(shares)
      if residual != 0:
          shares[0] += residual   # smallest Claim.id sorted ascending receives drift
      assert sum(admin_fee_cents, sum(priority_takes), sum(secured_takes), sum(shares)) == Plan.paid_to_date_cents
    input_set: "Plan.paid_to_date_cents (single Plan); claims for the case in status=ALLOWED, partitioned by claim_class"
    constants:
      ADMIN_FEE_RATE: 0.10
    precision: "integer cents; round_half_up on admin-fee step and on each pro-rata per-claim share; residual cents go to smallest Claim.id"

  - name: schedule_completeness
    trigger: "Any POST/PUT on /cases/{case_id}/schedules and pre-condition of POST /cases/{case_id}/file"
    algorithm: aggregation
    formula: |
      required = {A, B, C, D, E, F, G, H, I, J}
      present_types = {s.schedule_type for s in Schedule where case_id=this and superseded_by_id is null}
      schedule_completeness = sorted(list(required - present_types))
      # Empty list => case is filing-ready w.r.t. schedules.
    input_set: "All Schedule rows for this Case with superseded_by_id == null"
    constants: {}
    precision: "exact set membership; no numerics"

  - name: total_unsecured_pool
    trigger: "Claim transitions to/from ALLOWED; called after each Claim mutation"
    algorithm: aggregation
    formula: |
      Case.total_unsecured_pool_cents = sum(c.amount_cents
                                           for c in Claim
                                           where c.case_id = this.id
                                             and c.claim_class = GENERAL_UNSECURED
                                             and c.status = ALLOWED)
    input_set: "All Claim rows on this Case with status=ALLOWED and claim_class=GENERAL_UNSECURED"
    constants: {}
    precision: "integer cents; no rounding (additions of cents are exact)"

  - name: discharge_exemption_partition
    trigger: "Case DISCHARGED transition (Ch7 from MEETING_HELD or Ch13 from IN_REPAYMENT)"
    algorithm: aggregation
    formula: |
      # Partition ALLOWED claims into dischargeable vs exempt sets.
      # Sum invariant: sum_dischargeable + sum_exempt == sum_allowed (compensating invariant).
      for claim in case.claims where status=ALLOWED:
          if claim.is_dischargeable:
              claim.status = DISCHARGED
          else:
              claim.status = NON_DISCHARGEABLE_REMAINS
      assert sum(c.amount_cents for c in case.claims where status in {DISCHARGED, NON_DISCHARGEABLE_REMAINS})
          == sum(c.amount_cents for c in case.claims where status was ALLOWED just before)
    input_set: "All Claim rows for the case in status=ALLOWED at the moment of discharge"
    constants: {}
    precision: "no rounding — pure partition by is_dischargeable boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of {Debtor, Trustee, Creditor, Judge}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-segment IDs (case_id, plan_id, claim_id, debtor_id) resolve to existing rows, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path IDs"

  - priority: 4
    category: state
    check: "Target Case/Plan/Claim is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 5
    category: business_safety
    check: "Automatic stay enforcement: any CollectionAction insert against a case where automatic_stay_active=true is recorded as REJECTED_STAY and returned with 409 (debtor-protection takes priority over creditor-money rules)"
    error_id: ERR_AUTOMATIC_STAY_VIOLATION
    http_status: 409
    applies_to: "POST /collection-actions"

  - priority: 6
    category: business_referential
    check: "Plan.case_id must reference a Case with chapter_effective=CHAPTER_13 and status in {MEETING_HELD, PLAN_PROPOSED}"
    error_id: ERR_NOT_CHAPTER_13
    http_status: 409
    applies_to: "POST /cases/{case_id}/plans"

  - priority: 7
    category: business_temporal
    check: "meeting_341_date >= filing_date + 21 days"
    error_id: ERR_MEETING_TOO_EARLY
    http_status: 422
    applies_to: "POST /cases/{case_id}/schedule-341"

  - priority: 8
    category: business_temporal
    check: "Server clock >= meeting_341_date when conducting the 341 meeting"
    error_id: ERR_MEETING_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /cases/{case_id}/conduct-341"

  - priority: 9
    category: business_constraint
    check: "Schedule completeness: schedule_completeness == [] before DRAFT→FILED"
    error_id: ERR_SCHEDULES_INCOMPLETE
    http_status: 409
    applies_to: "POST /cases/{case_id}/file"

  - priority: 10
    category: business_constraint
    check: "Active MeansTestResult must exist on the case before DRAFT→FILED"
    error_id: ERR_MEANS_TEST_NOT_RUN
    http_status: 409
    applies_to: "POST /cases/{case_id}/file"

  - priority: 11
    category: business_fiscal
    check: "Chapter 7 presumption-of-abuse gate: if chapter_requested=CHAPTER_7 and MeansTestResult.presumption_of_abuse=true, refuse file_case"
    error_id: ERR_PRESUMPTION_OF_ABUSE
    http_status: 409
    applies_to: "POST /cases/{case_id}/file"

  - priority: 12
    category: business_fiscal
    check: "Plan funding floor: Plan.planned_total_cents >= Case.MeansTestResult.minimum_plan_total_cents (boundary at >=)"
    error_id: ERR_PLAN_UNDERFUNDED
    http_status: 422
    applies_to: "POST /cases/{case_id}/plans/{plan_id}/confirm"

  - priority: 13
    category: business_constraint
    check: "Plan.plan_months == Case.MeansTestResult.required_plan_months"
    error_id: ERR_PLAN_MONTHS_MISMATCH
    http_status: 422
    applies_to: "POST /cases/{case_id}/plans, POST /cases/{case_id}/plans/{plan_id}/confirm"

  - priority: 14
    category: business_fiscal
    check: "Ch13 discharge requires Plan.paid_to_date_cents >= Plan.planned_total_cents AND missed_payment_count == 0"
    error_id: ERR_PLAN_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /cases/{case_id}/discharge when chapter_effective=CHAPTER_13"

  - priority: 15
    category: business_constraint
    check: "Dismissal-from-IN_REPAYMENT requires missed_payment_count >= 3 (boundary at >=3, strict three-strikes)"
    error_id: ERR_DISMISSAL_NOT_WARRANTED
    http_status: 409
    applies_to: "POST /cases/{case_id}/dismiss when Case.status=IN_REPAYMENT"

  - priority: 16
    category: business_constraint
    check: "Claim.amount_cents > 0 (zero-amount claims rejected; boundary at >0 strict)"
    error_id: ERR_CLAIM_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /cases/{case_id}/claims"

  - priority: 17
    category: business_referential
    check: "Claim.claim_class on creation must equal Creditor.creditor_type"
    error_id: ERR_CLAIM_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /cases/{case_id}/claims"

  - priority: 18
    category: business_constraint
    check: "TrusteePayment.sequence_number must be unique per plan and in range [1, Plan.plan_months]"
    error_id: ERR_PAYMENT_SEQUENCE_DUPLICATE
    http_status: 409
    applies_to: "POST /cases/{case_id}/plans/{plan_id}/payments"

  - priority: 19
    category: business_constraint
    check: "Only one Plan per Case in {PROPOSED, CONFIRMED, IN_REPAYMENT}"
    error_id: ERR_PLAN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /cases/{case_id}/plans"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Debtor ---
  - method: POST
    path: "/debtors"
    description: "Register a new Debtor"
    roles: [Debtor]
    code: 201
    input: [full_name, household_size, state_code]
    output: Debtor
    side_effects: ["total_cases_filed=0"]

  - method: GET
    path: "/debtors/{debtor_id}"
    description: "Get a Debtor"
    roles: [Debtor, Trustee, Judge]
    code: 200
    input: []
    output: Debtor
    side_effects: []

  # --- Creditor ---
  - method: POST
    path: "/creditors"
    description: "Register a Creditor (with creditor_type)"
    roles: [Creditor]
    code: 201
    input: [name, creditor_type]
    output: Creditor
    side_effects: []

  - method: GET
    path: "/creditors/{creditor_id}"
    description: "Get a Creditor"
    roles: [Creditor, Trustee, Judge]
    code: 200
    input: []
    output: Creditor
    side_effects: []

  # --- Case ---
  - method: POST
    path: "/cases"
    description: "Create a Case in DRAFT for the calling Debtor"
    roles: [Debtor]
    code: 201
    input: [debtor_id, chapter_requested]
    output: Case
    side_effects: ["status=DRAFT", "automatic_stay_active=false", "schedule_completeness=[A,B,C,D,E,F,G,H,I,J]"]

  - method: GET
    path: "/cases/{case_id}"
    description: "Get a Case"
    roles: [Debtor, Trustee, Creditor, Judge]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: DELETE
    path: "/cases/{case_id}"
    description: "Withdraw a DRAFT case (no automatic stay implications)"
    roles: [Debtor]
    code: 200
    input: []
    output: Case
    side_effects: ["status → WITHDRAWN_PRE_FILE"]

  - method: POST
    path: "/cases/{case_id}/schedules"
    description: "Submit or replace a Schedule (A-J) — supersedes any prior schedule of the same type for the case"
    roles: [Debtor]
    code: 201
    input: [schedule_type, line_items]
    output: Schedule
    side_effects:
      - "Any prior Schedule with same schedule_type and superseded_by_id=null is updated: superseded_by_id = new.id"
      - "total_cents recomputes"
      - "Case.schedule_completeness recomputes (schedule_completeness calculation)"

  - method: POST
    path: "/cases/{case_id}/means-test"
    description: "Run the Means Test on the most recent Schedule I + Schedule J; returns MeansTestResult"
    roles: [Debtor, Trustee]
    code: 201
    input: []
    output: MeansTestResult
    side_effects:
      - "Creates a new MeansTestResult row"
      - "Case.means_test_result_id updated to latest"

  - method: POST
    path: "/cases/{case_id}/file"
    description: "Transition Case DRAFT → FILED; activates automatic stay"
    roles: [Debtor]
    code: 200
    input: []
    output: Case
    side_effects:
      - "status=FILED, filing_date=now, automatic_stay_active=true, chapter_effective set per means-test gate"

  - method: POST
    path: "/cases/{case_id}/schedule-341"
    description: "Schedule the 341 creditors' meeting (Trustee)"
    roles: [Trustee]
    code: 200
    input: [meeting_date]
    output: Case
    side_effects: ["status=MEETING_SCHEDULED, meeting_341_date set"]

  - method: POST
    path: "/cases/{case_id}/conduct-341"
    description: "Conduct the 341 meeting (Trustee, after server clock reaches meeting date)"
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects:
      - "status=MEETING_HELD"
      - "All Claim rows in FILED → ALLOWED (cascade)"

  - method: POST
    path: "/cases/{case_id}/dismiss"
    description: "Dismiss the case (Trustee)"
    roles: [Trustee]
    code: 200
    input: []
    output: Case
    side_effects:
      - "status=DISMISSED, automatic_stay_active=false"
      - "If from IN_REPAYMENT: Plan.status=DEFAULTED; all ALLOWED Claim → NON_DISCHARGEABLE_REMAINS"

  - method: POST
    path: "/cases/{case_id}/discharge"
    description: "Discharge the case (Judge)"
    roles: [Judge]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Ch7: status=DISCHARGED from MEETING_HELD"
      - "Ch13: status=DISCHARGED from IN_REPAYMENT after plan complete"
      - "discharge_exemption_partition runs"
      - "Ch13: trustee_payment_waterfall runs"
      - "automatic_stay_active=false"

  # --- Claim ---
  - method: POST
    path: "/cases/{case_id}/claims"
    description: "Creditor files a Claim against the case"
    roles: [Creditor]
    code: 201
    input: [creditor_id, claim_class, amount_cents, is_dischargeable]
    output: Claim
    side_effects: ["status=FILED"]

  - method: GET
    path: "/cases/{case_id}/claims/{claim_id}"
    description: "Get a Claim"
    roles: [Debtor, Trustee, Creditor, Judge]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/cases/{case_id}/claims/{claim_id}/disallow"
    description: "Trustee marks a FILED claim DISALLOWED"
    roles: [Trustee]
    code: 200
    input: []
    output: Claim
    side_effects: ["status=DISALLOWED"]

  # --- Plan ---
  - method: POST
    path: "/cases/{case_id}/plans"
    description: "Debtor submits a Chapter 13 reorganization Plan (creates PROPOSED)"
    roles: [Debtor]
    code: 201
    input: [proposed_monthly_payment_cents, plan_months]
    output: Plan
    side_effects:
      - "Plan.status=PROPOSED"
      - "Case.status=PLAN_PROPOSED"

  - method: GET
    path: "/cases/{case_id}/plans/{plan_id}"
    description: "Get a Plan"
    roles: [Debtor, Trustee, Judge]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: DELETE
    path: "/cases/{case_id}/plans/{plan_id}"
    description: "Withdraw a PROPOSED plan (debtor may resubmit; cyclic shape)"
    roles: [Debtor]
    code: 200
    input: []
    output: Plan
    side_effects:
      - "Plan.status=WITHDRAWN"
      - "Case.status reverts to MEETING_HELD"

  - method: POST
    path: "/cases/{case_id}/plans/{plan_id}/confirm"
    description: "Judge confirms the plan"
    roles: [Judge]
    code: 200
    input: []
    output: Plan
    side_effects:
      - "Plan.status=CONFIRMED"
      - "Case.status=PLAN_CONFIRMED"

  - method: POST
    path: "/cases/{case_id}/plans/{plan_id}/payments"
    description: "Record a TrusteePayment (APPLIED or MISSED); first APPLIED transitions Case PLAN_CONFIRMED → IN_REPAYMENT"
    roles: [Debtor, Trustee]
    code: 201
    input: [sequence_number, amount_cents, status]
    output: TrusteePayment
    side_effects:
      - "Plan.paid_to_date_cents recomputes"
      - "Plan.missed_payment_count recomputes"
      - "Case.status may transition PLAN_CONFIRMED → IN_REPAYMENT"

  # --- CollectionAction (creditor-side; stay enforcement) ---
  - method: POST
    path: "/collection-actions"
    description: "Creditor attempts a collection action; rejected if stay is active"
    roles: [Creditor]
    code: 201
    input: [creditor_id, case_id, action_kind]
    output: CollectionAction
    side_effects:
      - "outcome=REJECTED_STAY if Case.automatic_stay_active=true"
      - "outcome=PROCESSED otherwise"

  - method: GET
    path: "/cases/{case_id}/collection-actions"
    description: "List all CollectionAction rows for a case (audit)"
    roles: [Trustee, Judge, Creditor]
    code: 200
    input: ["limit?", "offset?"]
    output: CollectionAction[]
    side_effects: []

  # --- Test-driving endpoints (required by §1.5 testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock (test-only; required so meeting_341_date can be reached without wall-clock waits)"
    roles: [Trustee]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock advances; preconditions checking 'now >= X' may flip"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed JSON or missing required input field"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or unknown"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-segment ID does not resolve to a row, or row is in the wrong scope"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined"

  - id: ERR_AUTOMATIC_STAY_VIOLATION
    http: 409
    condition: "CollectionAction insert against a case whose automatic_stay_active=true; row stored with outcome=REJECTED_STAY and 409 returned"

  - id: ERR_NOT_CHAPTER_13
    http: 409
    condition: "Plan operation against a case whose chapter_effective != CHAPTER_13"

  - id: ERR_MEETING_TOO_EARLY
    http: 422
    condition: "meeting_date < filing_date + 21 days"

  - id: ERR_MEETING_DATE_NOT_REACHED
    http: 409
    condition: "POST /cases/{id}/conduct-341 invoked while server clock < meeting_341_date"

  - id: ERR_SCHEDULES_INCOMPLETE
    http: 409
    condition: "Case.schedule_completeness is non-empty when filing"

  - id: ERR_MEANS_TEST_NOT_RUN
    http: 409
    condition: "Case has no MeansTestResult when filing"

  - id: ERR_PRESUMPTION_OF_ABUSE
    http: 409
    condition: "Chapter 7 filing blocked because MeansTestResult.presumption_of_abuse=true"

  - id: ERR_PLAN_UNDERFUNDED
    http: 422
    condition: "Plan.planned_total_cents < MeansTestResult.minimum_plan_total_cents at confirmation"

  - id: ERR_PLAN_MONTHS_MISMATCH
    http: 422
    condition: "Plan.plan_months does not equal MeansTestResult.required_plan_months"

  - id: ERR_PLAN_NOT_COMPLETE
    http: 409
    condition: "Ch13 discharge attempted while Plan.paid_to_date_cents < Plan.planned_total_cents OR missed_payment_count > 0"

  - id: ERR_PLAN_IN_DEFAULT
    http: 409
    condition: "Ch13 discharge attempted while Plan.missed_payment_count > 0 (catch even if amounts add up)"

  - id: ERR_DISMISSAL_NOT_WARRANTED
    http: 409
    condition: "Dismissal from IN_REPAYMENT requires missed_payment_count >= 3"

  - id: ERR_CLAIM_AMOUNT_INVALID
    http: 422
    condition: "Claim.amount_cents <= 0"

  - id: ERR_CLAIM_CLASS_MISMATCH
    http: 422
    condition: "Claim.claim_class != Creditor.creditor_type at creation"

  - id: ERR_PAYMENT_SEQUENCE_DUPLICATE
    http: 409
    condition: "Two TrusteePayment rows attempt the same (plan_id, sequence_number)"

  - id: ERR_PLAN_ALREADY_EXISTS
    http: 409
    condition: "Case already has a Plan in {PROPOSED, CONFIRMED, IN_REPAYMENT}"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Debtor
    description: "The bankruptcy filer; owns a Debtor row and one or more Case rows"
    identity: "entity_backed:Debtor"
    exclusive_operations:
      - "POST /debtors — create own Debtor row"
      - "POST /cases — open own Case in DRAFT"
      - "DELETE /cases/{case_id} — withdraw own DRAFT case"
      - "POST /cases/{case_id}/schedules — submit own A-J schedules"
      - "POST /cases/{case_id}/file — file own case"
      - "POST /cases/{case_id}/plans — propose Ch13 plan for own case"
      - "DELETE /cases/{case_id}/plans/{plan_id} — withdraw own PROPOSED plan"
    shared_operations:
      - "POST /cases/{case_id}/means-test (shared with Trustee)"
      - "POST /cases/{case_id}/plans/{plan_id}/payments (shared with Trustee)"
      - "GET /debtors/{debtor_id}, GET /cases/{case_id}, GET /cases/{case_id}/claims/{claim_id}, GET /cases/{case_id}/plans/{plan_id}"
    # Ownership semantics: X-User-ID for Debtor role equals Debtor.id; Case.debtor_id must equal X-User-ID for all write ops above.

  - name: Trustee
    description: "Court-appointed administrator; conducts the 341 meeting, manages claims, can dismiss"
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{case_id}/schedule-341 — set the 341 meeting date"
      - "POST /cases/{case_id}/conduct-341 — conduct the 341 meeting"
      - "POST /cases/{case_id}/dismiss — dismiss case"
      - "POST /cases/{case_id}/claims/{claim_id}/disallow — disallow a claim"
      - "POST /_clock/advance — advance the server clock (test-driving)"
    shared_operations:
      - "POST /cases/{case_id}/means-test (shared with Debtor)"
      - "POST /cases/{case_id}/plans/{plan_id}/payments (shared with Debtor)"
      - "GET endpoints"
    # Trustees are persona-level operators; X-User-ID is an opaque trustee identifier not tied to any persisted Trustee entity in this scaffold.

  - name: Creditor
    description: "Holder of a debt; can register, file claims, attempt collection actions"
    identity: "entity_backed:Creditor"
    exclusive_operations:
      - "POST /creditors — create own Creditor row"
      - "POST /cases/{case_id}/claims — file own claim against a case"
      - "POST /collection-actions — attempt collection action"
    shared_operations:
      - "GET /creditors/{creditor_id}, GET /cases/{case_id}, GET /cases/{case_id}/claims/{claim_id}, GET /cases/{case_id}/collection-actions"
    # Ownership: X-User-ID for Creditor role equals Creditor.id; Claim.creditor_id and CollectionAction.creditor_id must equal X-User-ID.

  - name: Judge
    description: "Bankruptcy court judge; sole authority to confirm Ch13 plans and grant discharge"
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{case_id}/plans/{plan_id}/confirm — confirm Ch13 plan"
      - "POST /cases/{case_id}/discharge — grant discharge"
    shared_operations:
      - "GET /cases/{case_id}, GET /cases/{case_id}/claims/{claim_id}, GET /cases/{case_id}/plans/{plan_id}, GET /cases/{case_id}/collection-actions"
    # Judges are persona-level operators; X-User-ID is an opaque court-officer identifier.
