scaffold_corner_design:

  # =========================================================================
  # §1.1 Entities
  # =========================================================================
  - section: entities
    instances:
      - name: agreement_creation_returns_persisted_configuration
        claim_type: creation
        grounds:
          - entities.ManagementAgreement.fields.hotel_name
          - entities.ManagementAgreement.fields.base_fee_pct
          - entities.ManagementAgreement.fields.status
        distinguishing_aspect: "POST /hotel-management/agreements with the five required inputs returns 201 and persists every supplied configuration value verbatim with status DRAFT."
        test_recipe:
          setup:
            - "Empty database; logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Corner Creation Hotel", owner_entity_name: "Creation Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { c_agr: $.data.id }
          assert:
            - "HTTP 201 with a non-null ManagementAgreement.${c_agr}.id, created_at, updated_at and version == 1"
            - "ManagementAgreement.${c_agr}.hotel_name == Corner Creation Hotel and owner_entity_name == Creation Owner LLC"
            - "ManagementAgreement.${c_agr}.base_fee_pct == 0.0325, incentive_fee_pct == 0.10, owner_priority_cents == 12000000"
            - "ManagementAgreement.${c_agr}.status == DRAFT"
            - "ManagementAgreement.${c_agr}.working_capital_balance_cents == 0 and ffe_reserve_balance_cents == 0"

      - name: agreement_omitted_configuration_takes_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ManagementAgreement.fields.min_benchmark_months
          - entities.ManagementAgreement.fields.max_revision_rounds
          - entities.ManagementAgreement.fields.employee_model
          - entities.ManagementAgreement.fields.termination_notice_days
        distinguishing_aspect: "An agreement created with only the five required inputs adopts every §1.1-declared default, so min_benchmark_months is 10 and max_revision_rounds is 2 rather than the values other fixtures pin explicitly."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Defaults Only Hotel", owner_entity_name: "Default Owner LP", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { d_agr: $.data.id }
          assert:
            - "ManagementAgreement.${d_agr}.incentive_tier2_pct == 0.15 and incentive_tier2_threshold_cents == 5000000"
            - "ManagementAgreement.${d_agr}.ffe_reserve_pct == 0.04 and centralized_services_cap_pct == 0.015"
            - "ManagementAgreement.${d_agr}.working_capital_floor_cents == 0 and initial_working_capital_cents == 0"
            - "ManagementAgreement.${d_agr}.owner_review_window_days == 30 and max_revision_rounds == 2"
            - "ManagementAgreement.${d_agr}.gop_test_threshold_pct == 0.85 and rpi_test_threshold == 90.0"
            - "ManagementAgreement.${d_agr}.min_benchmark_months == 10, test_periods_expected == 12, consecutive_failure_limit == 2"
            - "ManagementAgreement.${d_agr}.employee_model == MANAGER_EMPLOYEES and manager_indemnity_cap_cents == 0"
            - "ManagementAgreement.${d_agr}.cure_window_days == 60, dispute_standstill_days == 45, max_dispute_rounds == 2"
            - "ManagementAgreement.${d_agr}.funding_due_days == 15 and termination_notice_days == 90"
            - "ManagementAgreement.${d_agr}.distribution_hold == false and termination_effective_utc is null"

      - name: report_package_retrieval_returns_stored_inputs
        claim_type: retrieval
        grounds:
          - entities.MonthlyReportPackage.fields.rooms_revenue_cents
          - entities.MonthlyReportPackage.fields.gross_revenue_cents
          - endpoints[GET /hotel-management/report-packages/{id}]
        distinguishing_aspect: "GET /hotel-management/report-packages/{id} returns the same row the create call persisted, including gross_revenue_cents 55000025 and due_date_utc 2026-10-25T00:00:00Z."
        test_recipe:
          setup:
            - "One ACTIVE agreement with one (2026, 9) MonthlyReportPackage in financial_status PENDING."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Retrieval Hotel", owner_entity_name: "Read Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { r_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${r_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${r_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { r_pkg: $.data.id }
          trigger:
            - call: "GET /hotel-management/report-packages/${r_pkg}"
              payload: {}
              as: AssetManager
          assert:
            - "HTTP 200 with MonthlyReportPackage.${r_pkg}.agreement_id == ${r_agr}"
            - "MonthlyReportPackage.${r_pkg}.rooms_revenue_cents == 40000015, fnb_revenue_cents == 12000005, other_revenue_cents == 3000005"
            - "MonthlyReportPackage.${r_pkg}.gross_revenue_cents == 55000025 and due_date_utc == 2026-10-25T00:00:00Z"
            - "MonthlyReportPackage.${r_pkg}.financial_status == PENDING, benchmark_status == PENDING, package_status == INCOMPLETE"
            - "MonthlyReportPackage.${r_pkg}.base_fee_cents == 0, agop_cents == 0, incentive_fee_provisional_cents == 0 — nothing is computed before the submit"

      - name: report_package_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - response_envelope.pagination
          - endpoints[GET /hotel-management/agreements/{id}/report-packages]
        distinguishing_aspect: "With three packages present, limit 2 offset 0 returns 2 items with total_count 3 and has_more true, and offset 2 returns the last item with has_more false."
        test_recipe:
          setup:
            - "One ACTIVE agreement with (2026, 9), (2026, 10) and (2026, 11) MonthlyReportPackage rows."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Pagination Hotel", owner_entity_name: "Page Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { p_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${p_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${p_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
            - call: "POST /hotel-management/agreements/${p_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 10, rooms_revenue_cents: 21000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 6000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
            - call: "POST /hotel-management/agreements/${p_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 11, rooms_revenue_cents: 22000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 6000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
          trigger:
            - call: "GET /hotel-management/agreements/${p_agr}/report-packages"
              payload: { limit: 2, offset: 0 }
              as: OwnerRep
            - call: "GET /hotel-management/agreements/${p_agr}/report-packages"
              payload: { limit: 2, offset: 2 }
              as: OwnerRep
            - call: "GET /hotel-management/agreements/${p_agr}/report-packages"
              payload: { period_month: 10 }
              as: OwnerRep
          assert:
            - "the first read returns success true, data with 2 items, pagination.total_count == 3, pagination.limit == 2, pagination.offset == 0, pagination.has_more == true"
            - "the second read returns 1 item with pagination.offset == 2 and pagination.has_more == false"
            - "the filtered read returns exactly 1 item whose period_month == 10 and pagination.total_count == 1"
            - "every envelope carries the keys success, data, error and pagination, with error null on success"

      - name: agreement_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_AGREEMENT_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown agreement id on the read endpoint returns ERR_AGREEMENT_NOT_FOUND with HTTP 404 and a null data member."
        test_recipe:
          setup:
            - "Empty database; no agreement carries the probed id."
          setup_api_calls: []
          trigger:
            - call: "GET /hotel-management/agreements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP 404 with success == false and error.error_id == ERR_AGREEMENT_NOT_FOUND"
            - "the response data member is null"

      - name: budget_create_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /hotel-management/agreements/{id}/budgets]
        distinguishing_aspect: "Omitting budgeted_operating_expenses_cents from the budget create body returns ERR_INVALID_REQUEST with HTTP 400 and persists no OperatingBudget row."
        test_recipe:
          setup:
            - "One ACTIVE agreement with no budgets."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Required Fields Hotel", owner_entity_name: "Required Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { rf_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${rf_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { rf_agr_v2: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${rf_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, expected_agreement_version: "${rf_agr_v2}" }
              as: HotelManagerOps
              captures: { rf_err: $.data.error_id }
          assert:
            - "HTTP 400 with error.error_id == ERR_INVALID_REQUEST"
            - "GET /hotel-management/budgets with agreement_id ${rf_agr} returns pagination.total_count == 0"
            - "ManagementAgreement.${rf_agr}.version is still ${rf_agr_v2} — the rejected create did not bump the parent version"

      - name: benchmark_rpi_computed_and_extra_field_in_payload_ignored
        claim_type: computed_fields
        grounds:
          - entities.MarketBenchmark.fields.rpi
          - entities.MonthlyReportPackage.fields.reported_rpi
        distinguishing_aspect: "MarketBenchmark.rpi is computed as round(10000 / 12000 * 100, 2) == 83.33 and an rpi value smuggled into the request body is ignored rather than stored."
        test_recipe:
          setup:
            - "One ACTIVE agreement with one (2026, 9) MonthlyReportPackage in benchmark_status PENDING."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Computed Field Hotel", owner_entity_name: "Computed Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { cf_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${cf_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${cf_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { cf_pkg: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/${cf_pkg}/benchmarks"
              payload: { hotel_revpar_cents: 10000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT", rpi: 199.99, superseded: true }
              as: HotelManagerOps
              captures: { cf_bm: $.data.id }
          assert:
            - "MarketBenchmark.${cf_bm}.rpi == 83.33, not the 199.99 supplied in the body"
            - "MarketBenchmark.${cf_bm}.superseded == false, not the true supplied in the body"
            - "MonthlyReportPackage.${cf_pkg}.reported_rpi == 83.33 and benchmark_status == SUBMITTED"
            - "MonthlyReportPackage.${cf_pkg}.package_status == INCOMPLETE — neither dimension has reached ACCEPTED"

      - name: variance_request_stamps_requested_by_user_id_and_system_fields
        claim_type: system_fields
        grounds:
          - entities.VarianceRequest.fields.requested_by_user_id
          - entities.VarianceRequest.fields.effective_baseline_cents
          - calculations.variance_approval_routing
        distinguishing_aspect: "VarianceRequest.requested_by_user_id is stamped from the X-User-ID header rather than from the body, and id / created_at / version are server-generated."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 OperatingBudget whose budgeted_operating_expenses_cents is 400000000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "System Fields Hotel", owner_entity_name: "System Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { sf_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sf_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sf_agr_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${sf_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, expected_agreement_version: "${sf_agr_v2}" }
              as: HotelManagerOps
              captures: { sf_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${sf_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${sf_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "POST /hotel-management/budgets/${sf_bud}/variance-requests"
              payload: { category: "OPERATING", requested_amount_cents: 2000000, justification: "storm damage cleanup" }
              as: HotelManagerOps
              as_user_id: "u-mgr-7"
              captures: { sf_var: $.data.id }
          assert:
            - "VarianceRequest.${sf_var}.requested_by_user_id == u-mgr-7"
            - "VarianceRequest.${sf_var}.id, created_at, updated_at are non-null and version == 1"
            - "VarianceRequest.${sf_var}.effective_baseline_cents == 400000000 and variance_pct == 0.005000"
            - "VarianceRequest.${sf_var}.approval_level == MANAGER_DISCRETION and status == AUTO_APPROVED"
            - "VarianceRequest.${sf_var}.decided_by_user_id is null and denied_by_cascade == false"

      - name: employment_claim_invalid_enum_position_class_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.EmploymentClaim.fields.position_class
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "position_class HOUSEKEEPING is outside the declared set {GM, EXEC_COMMITTEE, LINE_STAFF} and returns ERR_INVALID_ENUM with HTTP 400, while GM on the same body is accepted."
        test_recipe:
          setup:
            - "One ACTIVE agreement with employee_model MANAGER_EMPLOYEES."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Enum Guard Hotel", owner_entity_name: "Enum Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, employee_model: "MANAGER_EMPLOYEES", manager_indemnity_cap_cents: 2000000 }
              as: PlatformAdmin
              captures: { en_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${en_agr}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /hotel-management/agreements/${en_agr}/employment-claims"
              payload: { position_class: "HOUSEKEEPING", claim_amount_cents: 3000001 }
              as: HotelManagerOps
              captures: { en_err: $.data.error_id }
            - call: "POST /hotel-management/agreements/${en_agr}/employment-claims"
              payload: { position_class: "GM", claim_amount_cents: 3000001 }
              as: HotelManagerOps
              captures: { en_clm: $.data.id }
          assert:
            - "the first trigger returns HTTP 400 with error.error_id == ERR_INVALID_ENUM"
            - "GET /hotel-management/agreements/${en_agr}/employment-claims returns pagination.total_count == 1 after both triggers"
            - "EmploymentClaim.${en_clm}.position_class == GM, status == FILED, employer_of_record == MANAGER"
            - "EmploymentClaim.${en_clm}.owner_share_cents == 0 and manager_share_cents == 0 before any allocation"

      - name: reserve_ledger_entry_is_append_only_without_version_field
        claim_type: immutability
        grounds:
          - entities.ReserveLedgerEntry
          - calculations.reserve_ledger_running_balance
          - endpoints[GET /hotel-management/agreements/{id}/reserve-ledger]
        distinguishing_aspect: "ReserveLedgerEntry is declared common_fields false, so its rows expose no version field and §1.5 offers no update or delete endpoint for them — the only write path is the append performed by a distribution execution."
        test_recipe:
          setup:
            - "One ACTIVE agreement whose (2026, 9) package has been accepted and whose distribution has been executed, contributing 1040000 to the reserve."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Append Only Hotel", owner_entity_name: "Ledger Only Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { al_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${al_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { al_agr_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${al_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${al_agr_v2}" }
              as: HotelManagerOps
              captures: { al_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${al_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${al_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${al_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 5000000 }
              as: HotelManagerOps
              captures: { al_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${al_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${al_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/report-packages/${al_pkg}/distributions"
              payload: {}
              as: HotelManagerOps
              captures: { al_dist: "$.data[0].id" }
            - call: "POST /hotel-management/distributions/${al_dist}/execute"
              payload: {}
              as: HotelManagerOps
          trigger:
            - call: "GET /hotel-management/agreements/${al_agr}/reserve-ledger"
              payload: {}
              as: AssetManager
              captures: { al_entry: "$.data[0].id" }
          assert:
            - "pagination.total_count == 1 and ReserveLedgerEntry.${al_entry}.entry_type == CONTRIBUTION"
            - "ReserveLedgerEntry.${al_entry}.amount_cents == 1040000 and balance_after_cents == 1040000 and source_kind == DISTRIBUTION_EXECUTION"
            - "the row exposes id and created_at but no version field and no updated_at, per common_fields false"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint under /hotel-management/agreements/{id}/reserve-ledger, so the row cannot be mutated"
            - "ManagementAgreement.${al_agr}.ffe_reserve_balance_cents == 1040000, equal to the signed sum of the ledger"

      - name: benchmark_post_to_unknown_report_package_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - entities.MarketBenchmark.fields.report_package_id
          - errors[ERR_PACKAGE_NOT_FOUND]
        distinguishing_aspect: "The flat topology validates the MarketBenchmark -> MonthlyReportPackage reference at the path level: an unknown report_package_id returns ERR_PACKAGE_NOT_FOUND with HTTP 404 and creates no benchmark."
        test_recipe:
          setup:
            - "One ACTIVE agreement with one (2026, 9) package; the probed package id belongs to no row."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "FK Guard Hotel", owner_entity_name: "FK Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { fk_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${fk_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${fk_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { fk_pkg: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/11111111-1111-1111-1111-111111111111/benchmarks"
              payload: { hotel_revpar_cents: 10000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT" }
              as: HotelManagerOps
              captures: { fk_err: $.data.error_id }
          assert:
            - "HTTP 404 with error.error_id == ERR_PACKAGE_NOT_FOUND"
            - "GET /hotel-management/report-packages/${fk_pkg}/benchmarks returns pagination.total_count == 0"
            - "MonthlyReportPackage.${fk_pkg}.benchmark_status is still PENDING and reported_rpi is null"

      - name: package_agop_and_fee_computed_fields
        claim_type: computed_fields
        grounds:
          - entities.MonthlyReportPackage.fields.agop_cents
          - entities.MonthlyReportPackage.fields.base_fee_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / agop_pinned_evaluation_order_centralized_then_fee_then_priority
          rationale: "The named §1.8 instance already pins base_fee_cents == 1787500 and agop_cents == 22712525 as computed fields on the submit path."

  # =========================================================================
  # §1.2 State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: agreement_activate_moves_draft_to_active_and_funds_working_capital
        claim_type: valid_transition
        grounds:
          - state_machines.ManagementAgreement.DRAFT_to_ACTIVE
          - entities.ManagementAgreement.fields.working_capital_balance_cents
        distinguishing_aspect: "The activate call moves status DRAFT -> ACTIVE, writes initial_working_capital_cents 1000000 into working_capital_balance_cents and bumps version from 1 to 2."
        test_recipe:
          setup:
            - "One ManagementAgreement in DRAFT with initial_working_capital_cents 1000000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Activate Hotel", owner_entity_name: "Activate Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, initial_working_capital_cents: 1000000, working_capital_floor_cents: 500000 }
              as: PlatformAdmin
              captures: { ac_agr: $.data.id }
          trigger:
            - call: "POST /hotel-management/agreements/${ac_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ac_v: $.data.version }
          assert:
