      - name: amended_contribution_records_are_excluded_from_every_allocation_window
        claim_type: Input Set Filtering
        grounds:
          - "calculations.per_year_contribution_index"
          - "calculations.annual_payment_amount"
          - "calculations.amortization_and_twenty_year_cap"
        distinguishing_aspect: |
          The superseded row is still physically present and still covers the same plan
          years, so an implementation that filters on nothing (or on plan-year overlap
          alone) double counts the employer's history and produces a gross of 350000000
          instead of 100000000. The surviving record's much lower rate also moves the peak
          rate from 1000 to 400, which drops the annual payment far enough to engage the
          twenty-year cap - so the filtering error is visible in the schedule shape as well
          as in the amount.
