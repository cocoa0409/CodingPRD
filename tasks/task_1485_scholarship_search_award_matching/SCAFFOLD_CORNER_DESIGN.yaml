        distinguishing_aspect: "Cadence is computed off the program close (2026-08-20): at create time 2026-08-10 the D14 offset (send_at 2026-08-06) is already past and skipped, leaving exactly D7 (2026-08-13) and D1 (2026-08-19) SCHEDULED; run_daily at exactly 2026-08-13 dispatches D7 (inclusive <=) and leaves D1 pending."
