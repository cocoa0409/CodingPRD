      - name: c_min_pull_force_recomputed_on_patch
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.crimp_pull_force_minimum
          - concurrency_rules[machine-program-patch-stale-version]
        distinguishing_aspect: "Patching wire_gauge_awg 22 -> 18 on a DRAFT class-3 CLOSED_BARREL program recomputes the minimum from 29.7 to 49.5 and bumps version from 1 to 2."
        test_recipe:
          setup: ["Class-3 released drawing; applicator; DRAFT program AWG 22 CLOSED (min 29.7, version 1)"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-C6", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_3" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-22", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 30 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-C6", compatible_terminal_mpn: "TERM-22" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-C6", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 22, wire_type: "TXL", cut_length_mm: 300.0, strip_length_mm: 4.0, terminal_mpn: "TERM-22", terminal_type: "CLOSED_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id, pr_v: $.data.version } }
          trigger:
            - { call: "PATCH /plant/machine-programs/${pr}", payload: { expected_machine_program_version: "${pr_v}", wire_gauge_awg: 18 }, as: ProcessEngineer }
          assert:
            - "MachineProgram.${pr}.min_pull_force_n == 49.5   # round(50*0.9*1.1, 1)"
            - "MachineProgram.${pr}.version == 2   # was 1 at creation, incremented once by the patch"

      - name: c_pull_force_just_below_min_fails
        claim_type: threshold
        grounds:
          - calculations.crimp_pull_force_minimum
          - entities.CrimpPullTest.fields.result
        distinguishing_aspect: "Just below the boundary: 29.6N against the 29.7N minimum records FAIL and leaves the applicator AVAILABLE and the program DRAFT (no qualification side effects on failure)."
        test_recipe:
          setup: ["Class-3 flow: released drawing; applicator with CLOSED setup for AWG-22 CLOSED_BARREL program (min 29.7); certified class-3 inspector"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-C7", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_3" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-22", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 30 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-C7", compatible_terminal_mpn: "TERM-22" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-C7", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 22, wire_type: "TXL", cut_length_mm: 300.0, strip_length_mm: 4.0, terminal_mpn: "TERM-22", terminal_type: "CLOSED_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI C7", badge_no: "B-QI-C7" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_3", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
          trigger:
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 29.6 }, as: QualityInspector, as_user_id: "${qi}", captures: { res: $.data.result } }
            - { call: "GET /plant/applicators/${ap}", payload: {}, as: ProcessEngineer }
          assert:
            - "captured res == FAIL   # 29.6 < 29.7"
            - "Applicator.${ap}.status == AVAILABLE   # no qualification on FAIL"
            - "MachineProgram.${pr}.status == DRAFT"

