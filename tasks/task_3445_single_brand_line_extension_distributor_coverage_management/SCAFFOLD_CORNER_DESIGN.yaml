            - *k_g1
            - *k_g1g
            - *k_g1a
            - *k_g2
            - *k_g2g
            - *k_g2a
            - *k_review
            - *k_pack
            - *k_tool
            - *k_price
            - *k_enterprod
            - *k_launch
            - *k_dist
