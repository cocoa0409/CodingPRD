            - { call: "POST /leasing/aircraft/${ac}/transition-slots", payload: { window_start: "2026-09-23", window_end: "2026-09-30" }, as: LessorAdmin, captures: { slot2: "$.data.id"} }
          assert:
            - "[2026-09-22, ...] rejected with ERR_SLOT_WINDOW_CONFLICT (only 2 clear days after the 2026-09-20 end; buffer requires 3)"
            - "[2026-09-23, 2026-09-30] accepted (exactly 3 clear days after the end satisfies the buffer boundary)"

      - name: reinspection_limit_corner
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REINSPECTION_LIMIT]"]
        excluded_because:
          difficulty_instance: return_case_negotiation_self_loop_and_reinspection_cycle
          rationale: "The second request-reinspection rejection is asserted inside the named difficulty instance."
  # =========================================================================
  # Section: endpoints (Table 5 claims)
  # =========================================================================
  - section: endpoints
    instances:
      - name: monthly_charge_computed_read
        claim_type: computed_read
        grounds: ["endpoints.GET_/leasing/leases/{id}/monthly-charge"]
        excluded_because:
          difficulty_instance: monthly_charge_tiered_overage
          rationale: "The computed read's field-level values are asserted in the named difficulty instance."

      - name: fk_reverse_reachability_utilization_reports_sorted
        claim_type: fk_reverse_reachability
        grounds: [entities.UtilizationReport.fields.lease_id, "endpoints.GET_/leasing/leases/{id}/utilization-reports"]
        distinguishing_aspect: "Children are discoverable from the parent: two reports created out of month order come back sorted period_month ASC."
        test_recipe:
          setup: ["ACTIVE lease; reports submitted for 2026-08 first and 2026-07 second"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-EP-1", model: "A320-200", manufacture_date: "2012-10-10" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-EP-1" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "EP1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 10.0, flight_cycles: 2 }, as: LesseeRep, as_user_id: "${les}" }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-07", flight_hours: 20.0, flight_cycles: 4 }, as: LesseeRep, as_user_id: "${les}" }
          trigger:
            - { call: "GET /leasing/leases/${lease}/utilization-reports", payload: {}, as: LessorAdmin, captures: { first_month: "$.data[0].period_month"} }
          assert:
            - "list returns both reports with data[0].period_month == 2026-07 (sorted ASC, not creation order)"
            - "total_count == 2 in the pagination envelope"

      - name: response_envelope_shape_success_and_error
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id + response_type object|array; error responses carry response_type error and data.error_id."
        test_recipe:
          setup: ["one lessee exists"]
          setup_api_calls:
            - { call: "POST /leasing/lessees", payload: { legal_name: "Env Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
          trigger:
            - { call: "GET /leasing/lessees/${les}", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/lessees/00000000-0000-4000-8000-000000000000", payload: {}, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "object read: meta.api_request_id and meta.api_request_timestamp present; response_type == object"
            - "error read: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"
  # =========================================================================
  # Section: errors (Table 6 claims) — every catalog error is exercised by at
  # least one instance across §1.8 and §1.9; only stubs needing a home remain.
  # =========================================================================
  - section: errors
    instances:
      - name: error_claim_not_payable
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_NOT_PAYABLE]"]
        excluded_because:
          difficulty_instance: pay_wrong_state_and_over_balance_state_wins
          rationale: "ERR_CLAIM_NOT_PAYABLE is the asserted outcome of the named difficulty instance."
      # Note: ERR_STALE_VERSION is exercised by the two OCC corner instances in
      # section cross_cutting_layers (occ_lease_amend_stale_version,
      # occ_return_agree_stale_version); every other catalog error is the asserted
      # outcome of a named instance in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
  # =========================================================================
  # Section: rbac (Table 7 claims)
  # =========================================================================
  - section: rbac
    instances:
      - name: rbac_lessee_rep_cannot_create_aircraft
        claim_type: role_deny
        grounds: [roles.LessorAdmin, roles.LesseeRep, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Aircraft registration is exclusive to LessorAdmin; LesseeRep is denied at priority 2 with ERR_FORBIDDEN."
        test_recipe:
          setup: ["one lessee exists to back the LesseeRep identity"]
          setup_api_calls:
            - { call: "POST /leasing/lessees", payload: { legal_name: "RBAC1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-RBAC-1", model: "A320-200", manufacture_date: "2012-01-01" }, as: LesseeRep, as_user_id: "${les}", captures: { err: "$.data.error_id"} }
          assert:
            - "rejected with ERR_FORBIDDEN (http 403); no aircraft created"

      - name: rbac_finance_manager_cannot_decide_claim
        claim_type: role_deny
        grounds: [roles.FinanceManager, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 3): FinanceManager calling decide on even a nonexistent claim id gets ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /leasing/reserve-claims/00000000-0000-4000-8000-000000000000/decide", payload: { decision: "APPROVE", approved_amount_cents: 1000 }, as: FinanceManager, captures: { err: "$.data.error_id"} }
          assert:
            - "rejected with ERR_FORBIDDEN (role check fires before the 404 existence check)"

      - name: rbac_lessee_rep_cannot_report_on_other_lessees_lease
        claim_type: ownership_deny
        grounds: [roles.LesseeRep, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: LesseeRep authenticated as lessee B cannot submit utilization against lessee A's lease."
        test_recipe:
          setup: ["ACTIVE lease held by lessee A; lessee B also exists"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-RBAC-2", model: "B737-800", manufacture_date: "2013-01-01" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-RBAC-2" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "RBAC2A Air" }, as: LessorAdmin, captures: { lesA: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "RBAC2B Air" }, as: LessorAdmin, captures: { lesB: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${lesA}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
          trigger:
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 10.0, flight_cycles: 2 }, as: LesseeRep, as_user_id: "${lesB}", captures: { err: "$.data.error_id"} }
          assert:
            - "rejected with ERR_FORBIDDEN (lease.lessee_id != X-User-ID)"

      - name: novation_credit_officer_cannot_perform_legal_stage
        claim_type: invalid_transition
        grounds: [state_machines.NovationRequest.CREDIT_APPROVED_to_APPROVED, roles.CreditOfficer, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Stage inference inside one endpoint: from CREDIT_APPROVED the only review transition has actor LegalApprover, so a CreditOfficer review attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE lease; NovationRequest SUBLEASE to lessee B credit-approved by cred_1"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-RBAC-3", model: "E190", manufacture_date: "2016-03-03" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-RBAC-3" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "RBAC3A Air" }, as: LessorAdmin, captures: { lesA: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "RBAC3B Air" }, as: LessorAdmin, captures: { lesB: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${lesA}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/novation-requests", payload: { request_type: "SUBLEASE", proposed_lessee_id: "${lesB}" }, as: LesseeRep, as_user_id: "${lesA}", captures: { nr: "$.data.id"} }
            - { call: "POST /leasing/novation-requests/${nr}/review", payload: { decision: "APPROVE" }, as: CreditOfficer, as_user_id: "cred_1" }
          trigger:
            - { call: "POST /leasing/novation-requests/${nr}/review", payload: { decision: "APPROVE" }, as: CreditOfficer, as_user_id: "cred_2", captures: { err: "$.data.error_id"} }
            - { call: "POST /leasing/novation-requests/${nr}/review", payload: { decision: "APPROVE" }, as: LegalApprover, as_user_id: "legal_1", captures: { st: "$.data.status"} }
            - { call: "GET /leasing/leases/${lease}", payload: {}, as: LessorAdmin, captures: { sub: "$.data.approved_sublessee_id"} }
          assert:
            - "CreditOfficer at the legal stage rejected with ERR_INVALID_STATE (no matching transition for that actor)"
            - "LegalApprover succeeds: status == APPROVED"
            - "SUBLEASE side effect: Lease.approved_sublessee_id == ${lesB} and Lease.lessee_id unchanged"
  # =========================================================================
  # Section: cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_lease_amend_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[lease-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Lease.version: an amendment carrying the version observed before a prior successful amendment is rejected 412; the loser is determined purely by staleness of expected_lease_version."
        test_recipe:
          setup: ["DRAFT lease; client captured version at creation"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-OCC-1", model: "A320-200", manufacture_date: "2014-04-04" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "OCC1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id", lease_v: "$.data.version"} }
          trigger:
            - { call: "PATCH /leasing/leases/${lease}", payload: { expected_lease_version: "${lease_v}", monthly_rent_cents: 1100000 }, as: LessorAdmin, captures: { v2: "$.data.version"} }
            - { call: "PATCH /leasing/leases/${lease}", payload: { expected_lease_version: "${lease_v}", monthly_rent_cents: 1200000 }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "first amendment succeeds and bumps version (v2 == lease_v + 1)"
            - "second amendment with the now-stale expected_lease_version rejected with ERR_STALE_VERSION (http 412); monthly_rent_cents stays 1100000"

      - name: occ_return_agree_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[return-agree-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ReturnCase.version: an agree carrying a version from before the latest proposal round is rejected 412 — the agreeing party must re-read the standing proposal first."
        test_recipe:
          setup: ["ReturnCase in NEGOTIATION (ENGINE NON_COMPLIANT 80000, others COMPLIANT); LESSOR proposal 200000 standing; lessee captured version rc_v BEFORE the lessor's second... correction: rc_v captured right after the first proposal, then a LESSEE counter-proposal bumps the version"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-OCC-2", model: "B737-800", manufacture_date: "2011-01-01" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-OCC-2" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "AIRWORTHINESS_CERT", doc_reference: "AC-OCC-2" }, as: LessorAdmin, captures: { d2: "$.data.id"} }
            - { call: "POST /leasing/documents/${d2}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "ENGINE_LOG", doc_reference: "EL-OCC-2" }, as: LessorAdmin, captures: { d3: "$.data.id"} }
            - { call: "POST /leasing/documents/${d3}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "LLP_STATUS", doc_reference: "LLP-OCC-2" }, as: LessorAdmin, captures: { d4: "$.data.id"} }
            - { call: "POST /leasing/documents/${d4}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "OCC2 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/initiate-return", payload: {}, as: LessorAdmin }
            - { call: "GET /leasing/leases/${lease}/return-cases", payload: {}, as: LessorAdmin, captures: { rc: "$.data[0].id"} }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "RECORDS_VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "INSPECTION" }, as: LessorAdmin }
            - { call: "POST /leasing/inspectors", payload: { full_name: "Iris Nspect", license_number: "LIC-OCC-2" }, as: LessorAdmin, captures: { insp: "$.data.id"} }
            - { call: "POST /leasing/return-cases/${rc}/inspection-bookings", payload: { inspector_id: "${insp}", booking_date: "2026-08-01" }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}/checklist-items", payload: {}, as: LessorAdmin, captures: { it_air: "$.data[0].id", it_eng: "$.data[1].id", it_int: "$.data[2].id", it_pnt: "$.data[3].id"} }
            - { call: "POST /leasing/checklist-items/${it_air}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_eng}/inspect", payload: { outcome: "NON_COMPLIANT", rectification_cost_estimate_cents: 80000 }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_int}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/checklist-items/${it_pnt}/inspect", payload: { outcome: "COMPLIANT" }, as: TechInspector, as_user_id: "${insp}" }
            - { call: "POST /leasing/return-cases/${rc}/advance", payload: { to: "NEGOTIATION" }, as: LessorAdmin }
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 200000 }, as: LessorAdmin }
            - { call: "GET /leasing/return-cases/${rc}", payload: {}, as: LessorAdmin, captures: { rc_v: "$.data.version"} }
            - { call: "POST /leasing/return-cases/${rc}/proposals", payload: { amount_cents: 150000 }, as: LesseeRep, as_user_id: "${les}" }
          trigger:
            - { call: "POST /leasing/return-cases/${rc}/agree", payload: { expected_return_case_version: "${rc_v}" }, as: LessorAdmin, captures: { err: "$.data.error_id"} }
            - { call: "GET /leasing/return-cases/${rc}", payload: {}, as: LessorAdmin, captures: { rc_v2: "$.data.version"} }
            - { call: "POST /leasing/return-cases/${rc}/agree", payload: { expected_return_case_version: "${rc_v2}" }, as: LessorAdmin, captures: { st: "$.data.status", agreed: "$.data.agreed_total_cents"} }
          assert:
            - "agree with the pre-counter-proposal version rejected with ERR_STALE_VERSION (http 412)"
            - "after re-reading, agree with the fresh version succeeds: status == AGREED, agreed_total_cents == 150000 (the LESSEE counter-proposal is the standing one)"

      - name: repossession_cascade_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.DefaultCase.REPOSSESSION_AUTHORIZED_to_REPOSSESSED]
        excluded_because:
          difficulty_instance: repossession_cascade_depth3
          rationale: "The full 3-link cascade is asserted end-to-end in the named difficulty instance."

      - name: settlement_cascade_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.ReturnCase.AGREED_to_SETTLED]
        excluded_because:
          difficulty_instance: settlement_cascade_depth3_and_slot_autoconfirm
          rationale: "The full 3-link cascade including slot auto-confirm is asserted in the named difficulty instance."

      - name: cycle_surcharge_threshold_exact_boundary
        claim_type: rate_threshold_boundary
        grounds: [calculations.monthly_lease_charge]
        distinguishing_aspect: "The cycle-surcharge trigger is strict-greater: cycles x 2 == hours exactly does NOT fire the surcharge, and hours exactly at the monthly cap produce zero overage."
        test_recipe:
          setup: ["ACTIVE lease rent 1000000 cap 300; ACCEPTED report 2026-08 of exactly 300.0 hours / 150 cycles"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-THR-1", model: "A321neo", manufacture_date: "2018-08-08" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-THR-1" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "THR1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 300.0, flight_cycles: 150 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
          trigger:
            - { call: "GET /leasing/leases/${lease}/monthly-charge", payload: { month: "2026-08" }, as: LessorAdmin, captures: { tot: "$.data.total_cents", ovg: "$.data.overage_cents", sur: "$.data.cycle_surcharge_cents"} }
          assert:
            - "overage_cents == 0 (hours 300.0 == cap 300: cap is inclusive, overage starts strictly above)"
            - "cycle_surcharge_cents == 0 (150 cycles x 2 == 300 hours: strict > does not fire at equality)"
            - "total_cents == 1000000"
  # =========================================================================
  # Section: consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_patch_echo
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "endpoints.PATCH_/leasing/leases/{id}"]
        distinguishing_aspect: "Consistency model is immediate: the PATCH response itself carries the amended fields and the incremented version; no re-read is needed to observe the mutation."
        test_recipe:
          setup: ["DRAFT lease with version captured at creation"]
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-CON-1", model: "A330-900", manufacture_date: "2022-02-02" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "CON1 Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { lease: "$.data.id", lease_v: "$.data.version"} }
          trigger:
            - { call: "PATCH /leasing/leases/${lease}", payload: { expected_lease_version: "${lease_v}", monthly_rent_cents: 1250000, monthly_hour_cap: 320 }, as: LessorAdmin, captures: { rent: "$.data.monthly_rent_cents", cap: "$.data.monthly_hour_cap", ver: "$.data.version"} }
          assert:
            - "response carries monthly_rent_cents == 1250000 and monthly_hour_cap == 320 in the same request"
            - "version == lease_v + 1 in the same response"
