  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_retort_firing_window_halfopen
        grounds:
          - validations[priority=11]
          - entities.CremationBatch.fields.scheduled_start
          - state_machines.CremationBatch.LOADED_to_FIRING
        distinguishing_aspect: >
          Retort half-open [start,end) overlap: a second batch on the same retort whose
          window overlaps a currently-FIRING batch is rejected with ERR_RETORT_WINDOW_CONFLICT;
          adjacency (next start == prior end) would be allowed but here the windows truly overlap.
        test_recipe:
          setup:
            - "Clock 2026-03-16T00:00:00Z; one retort; batch X FIRING with window 08:00-10:00; batch Y LOADED with overlapping window 09:00-11:00 on the same retort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: CrematoryAdmin
            - call: "POST /retorts"
              payload: { label: "RT-OV", max_load_lbs: 400 }
              as: CrematoryAdmin
              captures: { retort_id: $.data.id }
            - call: "POST /petowners"
              payload: { full_name: "Owner OV", email: "ownerov@x.com", phone: "555-0015" }
              as: CrematoryOperator
              captures: { owner_id: $.data.id }
            # batch X members + fire
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "X1", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { x1: $.data.id }
            - call: "POST /cases/${x1}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "X", driver_name: "T" }
              as: CrematoryOperator
              captures: { x1leg: $.data.id }
            - call: "PATCH /transport-legs/${x1leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${x1leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${x1}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-03-16T08:00:00Z", scheduled_end: "2026-03-16T10:00:00Z" }
              as: CrematoryOperator
              captures: { batchX: $.data.id }
            - call: "POST /batches/${batchX}/assign-case"
              payload: { case_id: "${x1}" }
              as: CrematoryOperator
            - call: "POST /batches/${batchX}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batchX}/fire"
              payload: {}
              as: CrematoryOperator
            # batch Y members + load (overlapping window)
            - call: "POST /cases"
              payload: { owner_id: "${owner_id}", pet_name: "Y1", species: "DOG", weight_lbs: 30, service_type: "PRIVATE", pickup_kind: "HOME", bill_to: "OWNER" }
              as: CrematoryOperator
              captures: { y1: $.data.id }
            - call: "POST /cases/${y1}/transport-legs"
              payload: { origin_kind: "HOME", origin_label: "Y", driver_name: "T" }
              as: CrematoryOperator
              captures: { y1leg: $.data.id }
            - call: "PATCH /transport-legs/${y1leg}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${y1leg}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${y1}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-03-16T09:00:00Z", scheduled_end: "2026-03-16T11:00:00Z" }
              as: CrematoryOperator
              captures: { batchY: $.data.id }
            - call: "POST /batches/${batchY}/assign-case"
              payload: { case_id: "${y1}" }
              as: CrematoryOperator
            - call: "POST /batches/${batchY}/load"
              payload: {}
              as: CrematoryOperator
          trigger:
            - call: "POST /batches/${batchY}/fire"
              payload: {}
              as: CrematoryOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RETORT_WINDOW_CONFLICT"
            - "CremationBatch.${batchY}.status == LOADED"

      - name: overlap_viewing_room_buffered_window
        grounds:
          - validations[priority=12]
          - entities.MemorialAddon.fields.viewing_start
          - entities.MemorialAddon.fields.viewing_room_code
        distinguishing_aspect: >
          Viewing-room BUFFERED interval (different interval semantics and resource than the
          retort): a new VIEWING_SESSION in the same room starting within VIEWING_BUFFER_MINUTES
          of a prior session's end collides (rejected) even though the raw windows do not overlap.
        test_recipe:
          setup:
            - "Clock 2026-03-17T00:00:00Z; case A1 has a VIEWING_SESSION in ROOM-1 from 10:00-11:00; case A2 wants ROOM-1 from 11:15-12:00 (within 30-min buffer of prior end 11:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-17T00:00:00Z" }
              as: CrematoryAdmin
