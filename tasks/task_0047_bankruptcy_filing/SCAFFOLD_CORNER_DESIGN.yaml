              as: Trustee
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /claims/22222222-2222-2222-2222-222222222222/allow"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /claims/22222222-2222-2222-2222-222222222222/allow .status == 404"
            - "POST /claims/22222222-2222-2222-2222-222222222222/allow .data.error_id == ERR_NOT_FOUND"

