            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGY_CONFLICT (422); order verification_status remains PENDING"
      - name: waste_witness_required_for_cii
