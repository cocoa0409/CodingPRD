    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advance LegionellaRiskPlan ACTIVE->VALIDATION_DUE and Invoice ISSUED->OVERDUE sweeps against the new clock"]

  # --- CustomerAccount ---
