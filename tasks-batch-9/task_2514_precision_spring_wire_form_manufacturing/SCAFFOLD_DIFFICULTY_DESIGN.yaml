  - rule_id: boundary_precision_check
    instances:

      - name: cpk_exactly_at_characteristic_floor_versus_one_unit_below_on_inspections
        boundary_metric: "process capability index Cpk, 3 decimal places, round_half_up, compared with cpk_floor using >="
        grounds:
          - calculations.process_capability
          - entities.CriticalCharacteristic.fields.cpk_floor
          - entities.InspectionRecord.fields.control_state
          - endpoints["POST /production-runs/{id}/inspections"]
        distinguishing_aspect: |
          The floor comparison happens AFTER rounding to 3 dp, so the boundary is decided by the sixth decimal of
          sigma: measurements +/-0.125 give sigma 0.125000 and Cpk exactly 1.333, which PASSES on >=, while
          +/-0.1251 give sigma 0.125100 and Cpk 1.332, which fails. A submission that rounds to 2 dp, that uses
          population sigma instead of the Bessel-corrected sample sigma, or that compares with > instead of >=
          flips one of the two calls.
        test_recipe:
          setup:
            - "An INDUSTRIAL program (required_ppk 1.0) with design D1 PROTOTYPE_RELEASED and a single safety-critical FREE_LENGTH characteristic: nominal 60.0, LSL 59.5, USL 60.5, cpk_floor 1.333."
            - "A 1000-piece run of D1 that is RUNNING after an ACCEPTED first article measured at [59.950, 60.000, 60.050]."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-IND-5", customer_name: "Bramble Industrial Supply", application_class: "INDUSTRIAL", ppap_level: 1, committed_pieces: 100000, minimum_order_quantity: 1000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.2, required_ppk: 1.0, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-CRSI-1", wire_material: "CHROME_SILICON_A401", tensile_grade_mpa: 1900, shear_modulus_gpa: 79.3, elastic_modulus_gpa: 203.0, density_kg_per_m3: 7850, coating: "ZINC_PHOSPHATE", salt_spray_hours: 96, biocompatible: false, cost_per_kg_cents: 850 }
              as: DesignEngineer
              captures: { ms_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_id}", material_spec_id: "${ms_id}", part_number: "D1-IND", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.5, outer_diameter_mm: 20.0, free_length_mm: 60.0, active_coils: 8, max_working_load_n: 150, min_working_load_n: 50, cycle_seconds_per_piece: 1.8, shot_peening_required: true }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d1_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/critical-characteristics"
              payload: { char_code: "FREE_LENGTH", nominal_value: 60.0, lsl: 59.5, usl: 60.5, is_safety_critical: true, cpk_floor: 1.333 }
              as: DesignEngineer
              captures: { cc_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/submit-for-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "de-01"
            - call: "POST /spring-designs/${d1_id}/review"
              payload: { decision: "APPROVE_PROTOTYPE" }
              as: EngineeringManager
              as_user_id: "em-01"
            - call: "POST /tooling-assets"
              payload: { design_id: "${d1_id}", tool_code: "TL-D1-IND", original_cost_cents: 1200000 }
              as: EngineeringManager
              as_user_id: "em-01"
              captures: { tool_id: $.data.id }
            - call: "POST /coiling-machines"
              payload: { machine_code: "COIL-4", max_wire_diameter_mm: 4.0, changeover_buffer_minutes: 45 }
              as: PlantAdmin
              captures: { mach_id: $.data.id, mach_v: $.data.version }
            - call: "POST /machine-setups"
              payload: { machine_id: "${mach_id}", design_id: "${d1_id}", tooling_asset_id: "${tool_id}", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_machine_version: "${mach_v}" }
              as: ProcessTechnician
              captures: { setup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:30:00Z" }
              as: PlantAdmin
            - call: "POST /machine-setups/${setup_id}/activate"
              payload: {}
              as: ProcessTechnician
            - call: "POST /wire-lots"
              payload: { material_spec_id: "${ms_id}", heat_number: "HT-500", received_kg: 500.0 }
              as: QualityInspector
              captures: { wl_id: $.data.id }
            - call: "POST /wire-lots/${wl_id}/certify"
              payload: { tensile_test_mpa: 1930 }
              as: QualityInspector
              as_user_id: "qi-01"
            - call: "POST /production-runs"
              payload: { setup_id: "${setup_id}", wire_lot_id: "${wl_id}", design_id: "${d1_id}", planned_pieces: 1000 }
              as: ProcessTechnician
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/fai"
              payload: { characteristic_id: "${cc_id}", measurements: [59.950, 60.000, 60.050] }
              as: QualityInspector
              as_user_id: "qi-01"
            - call: "POST /production-runs/${run_id}/fai-disposition"
              payload: { decision: "ACCEPT" }
              as: QualityInspector
              as_user_id: "qi-02"
          trigger:
            - call: "POST /production-runs/${run_id}/inspections"
              payload: { characteristic_id: "${cc_id}", measurements: [59.875, 60.000, 60.125] }
              as: QualityInspector
              as_user_id: "qi-01"
              captures: { rec_at_floor_id: $.data.id }
            - call: "POST /production-runs/${run_id}/inspections"
              payload: { characteristic_id: "${cc_id}", measurements: [59.8749, 60.0000, 60.1251] }
              as: QualityInspector
              as_user_id: "qi-01"
              captures: { rec_below_floor_id: $.data.id }
          assert:
            - "InspectionRecord.${rec_at_floor_id}: mean_value == 60.0000, sigma_value == 0.125000, cpk_value == 1.333, control_state == IN_CONTROL"
            - "InspectionRecord.${rec_at_floor_id}.ppk_value == 1.333 (it is the only SPC record pooled so far)"
            - "InspectionRecord.${rec_below_floor_id}: sigma_value == 0.125100, cpk_value == 1.332, control_state == OUT_OF_CONTROL"
            - "InspectionRecord.${rec_below_floor_id}.ppk_value == 1.490 (six pooled measurements, sigma 0.111848)"
            - "after the first trigger call ProductionRun.${run_id}.quality_status == OPEN; after the second it is SPC_HOLD"
            - "ProductionRun.${run_id}.min_cpk_observed == 1.332 and min_ppk_observed == 1.333"
            - "no measurement lies outside [59.5, 60.5], so the OUT_OF_CONTROL verdict is driven purely by the capability index, not by a spec-limit escape"

      - name: volume_discount_tier_breakpoint_at_and_below_fifty_thousand_cents_on_quote
        boundary_metric: "quoted_pre_discount_subtotal_cents, integer cents, compared with the 50000-cent tier breakpoint using < for the lower tier"
        grounds:
          - calculations.program_quote_pricing
          - entities.CustomerProgram.fields.quoted_volume_discount_pct
          - entities.CustomerProgram.fields.quoted_pre_discount_subtotal_cents
          - endpoints["POST /customer-programs/{id}/quote"]
        distinguishing_aspect: |
          A different metric (integer cents, not a 3-dp index) on a different endpoint. The tier is keyed on the
          PRE-discount subtotal, and one extra piece moves 21.2573 cents/piece across the 50000-cent breakpoint:
          2352 pieces subtotal 49997 stays in the 0.00 tier, 2353 pieces subtotal 50018 lands in the 0.03 tier.
          Because the amortization cap absorbs the difference, quoted_unit_price_cents is 26 on BOTH sides — so a
          submission cannot infer the tier from the unit price, it must expose the discount field itself.
        test_recipe:
          setup:
            - "An INDUSTRIAL program with no PPAP package, so quote_frozen is false and the quote endpoint can be called twice."
            - "Design D1 (mass 0.021185 kg/piece on 850 c/kg wire, 1.8 s/piece) still in DRAFT, and a 4800000-cent tool for it."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-IND-6", customer_name: "Bramble Industrial Supply", application_class: "INDUSTRIAL", ppap_level: 1, committed_pieces: 100000, minimum_order_quantity: 1000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.2, required_ppk: 1.0, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-CRSI-1", wire_material: "CHROME_SILICON_A401", tensile_grade_mpa: 1900, shear_modulus_gpa: 79.3, elastic_modulus_gpa: 203.0, density_kg_per_m3: 7850, coating: "ZINC_PHOSPHATE", salt_spray_hours: 96, biocompatible: false, cost_per_kg_cents: 850 }
              as: DesignEngineer
              captures: { ms_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_id}", material_spec_id: "${ms_id}", part_number: "D1-QUOTE", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.5, outer_diameter_mm: 20.0, free_length_mm: 60.0, active_coils: 8, max_working_load_n: 150, min_working_load_n: 50, cycle_seconds_per_piece: 1.8, shot_peening_required: true }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d1_id: $.data.id }
            - call: "POST /tooling-assets"
              payload: { design_id: "${d1_id}", tool_code: "TL-D1-Q", original_cost_cents: 4800000 }
              as: EngineeringManager
              as_user_id: "em-01"
              captures: { tool_id: $.data.id }
          trigger:
            - call: "POST /customer-programs/${prog_id}/quote"
              payload: { design_id: "${d1_id}", quoted_qty: 2352, expected_program_version: "${prog_v0}" }
              as: ProgramManager
              captures: { prog_v1: $.data.version }
            - call: "POST /customer-programs/${prog_id}/quote"
              payload: { design_id: "${d1_id}", quoted_qty: 2353, expected_program_version: "${prog_v1}" }
              as: ProgramManager
          assert:
            - "after the first call: quoted_pre_discount_subtotal_cents == 49997, quoted_volume_discount_pct == 0.00, quoted_tooling_amort_per_piece_cents == 5, quoted_unit_price_cents == 26, quoted_total_cents == 186152"
            - "after the second call: quoted_pre_discount_subtotal_cents == 50018, quoted_volume_discount_pct == 0.03, quoted_tooling_amort_per_piece_cents == 5, quoted_unit_price_cents == 26, quoted_total_cents == 186178"
            - "the 26-cent unit price is identical on both sides of the breakpoint, so only quoted_volume_discount_pct and quoted_pre_discount_subtotal_cents reveal the tier change"
            - "CustomerProgram.${prog_id}.quoted_qty == 2353 (the second quote fully supersedes the first)"
            - "CustomerProgram.${prog_id}.version == ${prog_v1} + 1 and quote_frozen == false"
            - "ToolingAsset.${tool_id}.unamortized_cents == 4800000 (quoting never posts to the tooling ledger)"

      - name: minimum_order_quantity_inclusive_at_and_one_piece_below_on_lot_creation
        boundary_metric: "piece_count, integer pieces, compared with program.minimum_order_quantity using >= (inclusive)"
        grounds:
          - validations[priority=63]
          - errors.ERR_BELOW_MINIMUM_ORDER_QUANTITY
          - entities.CustomerProgram.fields.minimum_order_quantity
          - endpoints["POST /shipment-lots"]
        distinguishing_aspect: |
          A third metric (integer pieces) on a third endpoint. The MOQ boundary is INCLUSIVE, so 25000 pieces
          against a 25000-piece MOQ must be accepted while 24999 must be rejected — and the accepted call has to
          price itself off the frozen quote (25000 x 24 = 600000 cents), so an off-by-one in the comparison is
          visible both as a wrong status and as a missing ledger posting.
