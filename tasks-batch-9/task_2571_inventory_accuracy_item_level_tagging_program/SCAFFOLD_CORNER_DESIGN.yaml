  # ==========================================================================
  - section: state_machines
    instances:

      - name: tag_batch_created_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.TagBatch.initial_state
          - entities.TagBatch.fields.status
        distinguishing_aspect: "A newly created TagBatch is in status DRAFT with rework_round 0, required_sample_units 0 and verification_outcome null — the sample size is not frozen until the encode transition."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1 and Item TEE-001 (SGTIN_96, epc_prefix_length 7) exist."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
          assert:
            - "response status 201 and data.status == \"DRAFT\""
            - "response data.rework_round == 0 and data.required_sample_units == 0"
            - "response data.sampled_units == 0, data.readable_units == 0, data.duplicate_epc_count == 0, data.unencoded_units == 0, data.read_rate_bps == 0"
            - "response data.verification_outcome is null"
            - "GET /inventory-integrity/tag-batches?vendor_id=${vendor1} returns total_count 1 with data[0].status == \"DRAFT\""

      - name: tag_batch_encode_from_draft_freezes_sample_units
        claim_type: valid_transition
        grounds:
          - state_machines.TagBatch.DRAFT_to_ENCODED
          - calculations.tag_verification_outcome
        distinguishing_aspect: "encode moves DRAFT -> ENCODED and freezes required_sample_units = ceil(1000 * 5 / 100) = 50 from the vendor's current 5 percent band; the scheme and 7-digit prefix both match the SKU so no mismatch fires."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1 (fresh, band 5 percent), Item TEE-001 with SGTIN_96 and epc_prefix_length 7."
            - "A DRAFT TagBatch for VEND1 / TEE-001 / S100 with quantity_encoded 1000."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/tag-batches/${batch1}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
          assert:
            - "response status 200 and data.status == \"ENCODED\""
            - "response data.required_sample_units == 50"
            - "response data.encoding_scheme == \"SGTIN_96\" and data.epc_prefix == \"0614141\""
            - "response data.version == 2 — the transition bumped the batch version exactly once"

      - name: tag_batch_verify_from_draft_rejected_before_sample_checks
        claim_type: invalid_transition
        grounds:
          - validations.priority_40_ERR_TAG_BATCH_INVALID_STATE
          - state_machines.TagBatch.RECEIVED_to_VERIFIED_PASS
        distinguishing_aspect: "verify is declared only from RECEIVED, so calling it on a DRAFT batch returns ERR_TAG_BATCH_INVALID_STATE (409) at priority 40 — ahead of the sample-size rule at 81, even though required_sample_units is still 0."
        test_recipe:
          setup:
            - "A DRAFT TagBatch for VEND1 / TEE-001 / S100 with quantity_encoded 1000; it has never been encoded, so required_sample_units is 0."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
