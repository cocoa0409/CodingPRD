              as_user_id: "coord-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-8001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-05T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { loop_e1_id: $.data.id }
            - call: "POST /exams/${loop_e1_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-8002", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-06T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { loop_e2_id: $.data.id }
            - call: "POST /exams/${loop_e2_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { loop_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${loop_e1_id}", "${loop_e2_id}"], expected_unit_version: "${loop_u_v1}", reviewer_note: "Attempt 1 packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { loop_sub_id: $.data.id }
            - call: "POST /clinical-image-reviews/${loop_sub_id}/review"
              payload: { decision: "REVISION_REQUIRED", deficiency_categories: ["POSITIONING"], reviewer_note: "Inframammary fold not included" }
