  - rule_id: transitive_cascade
    instances:
      - name: bi_positive_recall_cascade_depth4
        grounds:
          - state_machines.BiologicalIndicator.INCUBATING_to_RESULT_RECORDED
          - state_machines.SterilizationLoad.RELEASED_to_RECALLED
          - state_machines.Tray.STERILE_to_QUARANTINED
          - state_machines.TrayReservation.RESERVED_to_CANCELLED
          - state_machines.ORCase.TRAYS_RESERVED_to_AT_RISK
        distinguishing_aspect: |
          A depth-4 causal chain from one trigger: BI POSITIVE causes the load to
          flip RELEASED -> RECALLED; the recall causes member tray tq to flip
          STERILE -> QUARANTINED; the quarantine causes tq's RESERVED reservation
          to flip to CANCELLED; the cancellation causes case CQ to flip
          TRAYS_RESERVED -> AT_RISK. Each link is caused by the previous link, not
          by the trigger directly.
        test_recipe:
          setup:
            - "Template, sterilizer ST-G1, technicians A (operator) and S (supervisor)"
            - "Tray tq STERILE via load LQ (BI#1 NEGATIVE, released 2026-05-01T03:00:00Z, expiry 2026-05-31T03:00:00Z)"
            - "Case CQ (2026-05-10T09:00-11:00) holds reservation RQ on tq; CQ is TRAYS_RESERVED"
            - "A follow-up BI#2 (lot LOT-9) was added to the RELEASED load at 03:00 and is INCUBATING until 2026-05-01T06:00:00Z; clock at 06:00"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "PLAST-01", name: "Plastics Set", specialty: "PLAST", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 14 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TQ" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tq: "$.data.id" } }
            - { call: "POST /spd/trays/${tq}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tq}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tq}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tq}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lq: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lq}/trays", payload: { tray_id: "${tq}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lq}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lq}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lq}", as: Any, captures: { biq1: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${biq1}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lq}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-Q", surgeon: "Dr Q", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T11:00:00Z", priority: "URGENT" }, as: OrScheduler, captures: { cq: "$.data.id", cq_v: "$.data.version" } }
            - { call: "POST /spd/or-cases/${cq}/reservations", payload: { tray_id: "${tq}", expected_or_case_version: "${cq_v}" }, as: OrScheduler, captures: { rq: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lq}/biological-indicators", payload: { lot_number: "LOT-9" }, as: QualityAuditor, captures: { bi2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T06:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /spd/biological-indicators/${bi2}/record-result", payload: { result: "POSITIVE" }, as: QualityAuditor }
            - { call: "GET /spd/sterilization-loads/${lq}", as: Any }
            - { call: "GET /spd/trays/${tq}", as: Any }
            - { call: "GET /spd/tray-reservations/${rq}", as: Any }
            - { call: "GET /spd/or-cases/${cq}", as: Any }
          assert:
            - "Link 1 (BI -> load): SterilizationLoad.${lq}.status == RECALLED and recall_reason == BI_POSITIVE and recalled_at == 2026-05-01T06:00:00Z"
            - "Link 2 (load -> tray): Tray.${tq}.status == QUARANTINED, quarantine_reason == BI_POSITIVE, sterility_expires_at == null"
            - "Link 3 (tray -> reservation): TrayReservation.${rq}.status == CANCELLED"
            - "Link 4 (reservation -> case): ORCase.${cq}.status == AT_RISK"

      - name: repair_send_unassign_demotes_tray
        grounds:
          - state_machines.RepairOrder.OPEN_to_SENT
          - state_machines.Instrument.FLAGGED_FOR_REPAIR_to_OUT_FOR_REPAIR
          - state_machines.Tray.ASSEMBLED_to_IN_ASSEMBLY
        distinguishing_aspect: |
          A depth-2 cascade from a different trigger (repair-order send, not a BI
          result): OPEN -> SENT on the RepairOrder causes the Instrument to flip
          FLAGGED_FOR_REPAIR -> OUT_FOR_REPAIR and lose its tray assignment; the
          unassignment itself causes the owning tray to demote ASSEMBLED ->
          IN_ASSEMBLY so the count sheet must be re-verified.
        test_recipe:
          setup:
            - "Template (SCALPEL x2); technician A; tray tm IN_ASSEMBLY with instruments i1 (SN-M1) and i2 (SN-M2) assigned, then verified PASS -> ASSEMBLED"
            - "i1 flagged for repair: RepairOrder RO1 OPEN exists"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "VASC-01", name: "Vascular Set", specialty: "VASC", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 18 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TM" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tm: "$.data.id" } }
            - { call: "POST /spd/trays/${tm}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-M1", max_cycles: 50, usage_cycles: 0, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { i1: "$.data.id" } }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-M2", max_cycles: 50, usage_cycles: 0, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { i2: "$.data.id" } }
            - { call: "POST /spd/instruments/${i1}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/instruments/${i2}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tm}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/instruments/${i1}/flag-for-repair", as: SpdTechnician, as_user_id: "${tech_a}", captures: { ro1: "$.data.id" } }
          trigger:
            - { call: "POST /spd/repair-orders/${ro1}/send", payload: { vendor: "VendorCo", quoted_cost_cents: 1000 }, as: FacilityAdmin }
            - { call: "GET /spd/repair-orders/${ro1}", as: Any }
            - { call: "GET /spd/instruments/${i1}", as: Any }
            - { call: "GET /spd/trays/${tm}", as: Any }
          assert:
            - "RepairOrder.${ro1}.status == SENT"
            - "Instrument.${i1}.status == OUT_FOR_REPAIR and assigned_tray_id == null"
            - "Tray.${tm}.status == IN_ASSEMBLY (demoted from ASSEMBLED by the unassignment cascade)"
            - "Instrument SN-M2 remains IN_SERVICE and assigned to ${tm}"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_state_gate_beats_segregation
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.SterilizationLoad.COMPLETED_to_RELEASED
          - errors[ERR_LOAD_NOT_RELEASABLE]
          - errors[ERR_RELEASE_OPERATOR_SEGREGATION]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): one release call
          violates both — the load is still RUNNING (state gate,
          ERR_LOAD_NOT_RELEASABLE, priority 6) AND the caller is the load's own
          operator (segregation-of-duties safety gate,
          ERR_RELEASE_OPERATOR_SEGREGATION, priority 7). The state error MUST win
          because state preconditions outrank safety gates.
        test_recipe:
          setup:
            - "Template, sterilizer, technician A; load LS with one tray is RUNNING (operator_id == tech A); no BI exists yet"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "ORTH-02", name: "Ortho Minor", specialty: "ORTHO", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TS" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ts: "$.data.id" } }
            - { call: "POST /spd/trays/${ts}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ts}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ts}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ts}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ls: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${ls}/trays", payload: { tray_id: "${ts}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${ls}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "POST /spd/sterilization-loads/${ls}/release", as: SpdSupervisor, as_user_id: "${tech_a}", captures: { err: "$.data.error_id" } }
            - { call: "GET /spd/sterilization-loads/${ls}", as: Any }
          assert:
            - "err == ERR_LOAD_NOT_RELEASABLE (priority-6 state gate wins over the priority-7 segregation safety gate, which the same call also violates: caller ${tech_a} == load.operator_id)"
            - "Load.${ls}.status == RUNNING (rejection had no side effects)"

      - name: reservation_safety_expiry_beats_temporal_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_STERILITY_EXPIRED_FOR_CASE]
          - errors[ERR_TRAY_RESERVATION_TIME_CONFLICT]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal) — distinct
          from release_state_gate_beats_segregation's (state vs business_safety):
          one reservation call violates both the sterility safety gate (case
          starts 2026-06-08T10:30 after the tray's 2026-06-08T10:00 expiry) AND
          the buffered temporal-overlap gate (30-minute gap < 45-minute buffer
          against an existing reservation). ERR_STERILITY_EXPIRED_FOR_CASE MUST
          win because safety outranks temporal.
        test_recipe:
          setup:
            - "Template, sterilizer, technicians A and S; tray tx STERILE via load LX released at 2026-05-09T10:00:00Z -> sterility_expires_at 2026-06-08T10:00:00Z"
            - "Case CA (2026-06-08T09:00-10:00) holds a reservation on tx"
            - "Case CB (2026-06-08T10:30-11:30) created, version captured"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GU-01", name: "GU Set", specialty: "GU", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TX" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tx: "$.data.id" } }
            - { call: "POST /spd/trays/${tx}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tx}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tx}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tx}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lx: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lx}/trays", payload: { tray_id: "${tx}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lx}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lx}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T10:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lx}", as: Any, captures: { bix: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bix}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lx}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-A", surgeon: "Dr A", scheduled_start_at: "2026-06-08T09:00:00Z", scheduled_end_at: "2026-06-08T10:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { ca: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /spd/or-cases/${ca}/reservations", payload: { tray_id: "${tx}", expected_or_case_version: "${ca_v}" }, as: OrScheduler }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-B", surgeon: "Dr B", scheduled_start_at: "2026-06-08T10:30:00Z", scheduled_end_at: "2026-06-08T11:30:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cb: "$.data.id", cb_v: "$.data.version" } }
          trigger:
            - { call: "POST /spd/or-cases/${cb}/reservations", payload: { tray_id: "${tx}", expected_or_case_version: "${cb_v}" }, as: OrScheduler, captures: { err: "$.data.error_id" } }
            - { call: "GET /spd/tray-reservations?case_id=${cb}", as: Any }
          assert:
            - "err == ERR_STERILITY_EXPIRED_FOR_CASE (priority-7 safety gate: expiry 2026-06-08T10:00:00Z is not > case start 2026-06-08T10:30:00Z) — NOT ERR_TRAY_RESERVATION_TIME_CONFLICT, although the priority-8 temporal gate is also violated (30 min < 45 min buffer vs case CA)"
            - "CB holds zero reservations (list response total_count == 0)"

  - rule_id: boundary_precision_check
    instances:
      - name: iuss_third_event_allowed_fourth_requires_supervisor
        grounds:
          - calculations.iuss_rolling_window_rate
          - errors[ERR_IUSS_RATE_EXCEEDED]
          - entities.IussException.fields.logged_at
        distinguishing_aspect: |
          Cumulative-count boundary on the IUSS metric: with SUPERVISOR_THRESHOLD
          4 on the trailing-168h count, the technician's 3rd event in the window
          succeeds while the 4th is rejected with ERR_IUSS_RATE_EXCEEDED, and the
          same 4th payload succeeds under the SpdSupervisor role — exact >=
          threshold behavior, via POST /spd/iuss-exceptions.
        test_recipe:
