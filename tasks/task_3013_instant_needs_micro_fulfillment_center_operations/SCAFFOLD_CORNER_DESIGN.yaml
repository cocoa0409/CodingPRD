              payload: {}
              as: SiteOps
              captures: { a3: $.data.driver_id }
          assert:
            - "bag1 -> D-OLD (both at run 0; created_at tie-break picks the earlier driver ${d_old})"
            - "bag2 -> D-NEW (run 0 beats run 1)"
            - "bag3 -> D-OLD (runs tie at 1; created_at tie-break again)"
            - "a fourth bag would fail 409 ERR_NO_DRIVER_AVAILABLE only once both runs are at cap 2 — here D-OLD is at 2 but D-NEW still has room, so assignment remains possible"

      - name: wallet_adjustment_negative_amount_floors_at_zero
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/customers/{customerId}/wallet/adjustments
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "A debit larger than the balance floors the wallet at 0 (no negative credit) and still increments Customer.version."
        test_recipe:
          setup: ["Customer with wallet 50 after a +50 adjustment."]
          setup_api_calls:
            - call: "POST /mfc/customers"
              payload: { email: "floor@example.com", full_name: "Flo Floor", date_of_birth: "1991-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_f: $.data.id }
