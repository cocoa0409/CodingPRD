  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-reissue-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Project.version: after A1 expires and a first re-issuance succeeds (bumping the version), a second re-issuance carrying the pre-supersede version is rejected with ERR_STALE_VERSION (412) — the OCC check fires before the state check."
        test_recipe:
          setup:
            - "P1 (10 MW) STUDY_COMPLETE under a RESULTS_PUBLISHED study; A1 issued at the default clock; clock advanced past the deadline; one execute attempt expired A1; then A2 re-issued successfully with the then-current project version"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
