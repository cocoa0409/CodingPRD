  # ===========================================================================
  # RULE 5 - priority_pair_validation_conflict
  # Instance 1: pair = auth (priority 2) vs concurrency (priority 9).
  # Instance 2: pair = business_temporal (priority 17) vs business_constraint
  #             (priority 22) - a completely different pair of categories.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: role_gate_beats_stale_version_returns_403_not_412
        grounds:
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_9_ERR_STALE_VERSION
          - concurrency_rules.credit-support-post-stale-deal
          - endpoints.POST_/ppa/credit-support/{id}/post
        distinguishing_aspect: |
          The conflicting pair is AUTH (priority 2) against CONCURRENCY
          (priority 9): one request violates both at once, and the low-priority
          auth rule must win with 403 even though the OCC token in the body is
          also demonstrably stale. Ordering matters because a naive implementation
          reads the parent Deal to compare versions before it checks the role, and
          would answer 412. The same body sent by the correct role then returns 412,
          proving the staleness was real and not an artefact of the role rejection.
        test_recipe:
          setup:
            - "Buyer NW (A, 2.5, CDP_AND_TCFD, EBITDA 60000000.00, registry account WREGIS-ACC-00417) is QUALIFIED."
            - "Project KJ1 (SOLAR, 100.000 MW) exists in PRE_DEVELOPMENT; Deal D (25.000 MW, base 42.50, escalation 2.0, first_delivery_year 2027) has reached TERMS_AGREED at contract price 44.10 with one CONFIRMED 25.000 MW allocation."
            - "A LETTER_OF_CREDIT of purpose PERFORMANCE_SECURITY, face 500000.00, issuer_rating A, expiry 2027-12-31 has been REGISTERED but not posted, and registration deliberately does NOT bump Deal.version."
            - "Deal.version is read into ${deal_v_stale} and is then advanced twice, by submit-credit and by the APPROVE credit decision, so ${deal_v_stale} is two behind the live value at trigger time."
            - "Logical clock is the 2026-08-01T00:00:00Z startup default throughout."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2027, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 42.50, escalation_pct_per_year: 2.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/rounds"
              payload: { proposed_by: "DEVELOPER", proposed_fixed_price_usd_per_mwh: 42.50, proposed_escalation_pct_per_year: 2.0, proposed_shape_product: "AS_GENERATED", proposed_basis_responsibility: "SHARED", response_deadline: "2026-08-15T00:00:00Z" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { round_id: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_v1: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 25.000, expected_deal_version: "${deal_v1}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_id: $.data.id }
            - call: "POST /ppa/allocations/${alloc_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/rounds/${round_id}/respond"
              payload: { response: "ACCEPT" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/deals/${deal_id}/credit-support"
              payload: { instrument_type: "LETTER_OF_CREDIT", purpose: "PERFORMANCE_SECURITY", face_amount_usd: 500000.00, issuer_name: "Pacific Coast Bank NA", issuer_rating: "A", effective_date: "2026-08-01T00:00:00Z", expiry_date: "2027-12-31T00:00:00Z" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { lc_id: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_v_stale: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/submit-credit"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals/${deal_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
          trigger:
            - call: "POST /ppa/credit-support/${lc_id}/post"
              payload: { expected_deal_version: "${deal_v_stale}" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/credit-support/${lc_id}/post"
              payload: { expected_deal_version: "${deal_v_stale}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "GET /ppa/deals/${deal_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
              captures: { deal_v_fresh: $.data.version }
            - call: "POST /ppa/credit-support/${lc_id}/post"
              payload: { expected_deal_version: "${deal_v_fresh}" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
          assert:
            - "the first trigger returns 403 with error_id ERR_ROLE_NOT_PERMITTED, NOT 412 ERR_STALE_VERSION, even though the supplied expected_deal_version is genuinely two versions behind"
            - "after the first trigger CreditSupportInstrument.${lc_id}.status is still PROPOSED with haircut_pct null, eligible_credit_usd null and posted_at null, and Deal.${deal_id}.version is unchanged"
            - "the second trigger, identical body but sent by CreditOfficer, returns 412 with error_id ERR_STALE_VERSION - proving the staleness was real and that only the role check preempted it"
            - "after the second trigger CreditSupportInstrument.${lc_id}.status is still PROPOSED and Deal.${deal_id}.version is still unchanged"
            - "the fourth trigger, with the freshly re-read version, returns 200 and CreditSupportInstrument.${lc_id}.status == POSTED with haircut_pct 0.00 and eligible_credit_usd 500000.00"
            - "${deal_v_fresh} equals ${deal_v_stale} plus 2, and after the successful post Deal.${deal_id}.posted_credit_support_usd == 500000.00"

      - name: invalid_window_precedes_risk_window_overlap_on_risk_event_claim
        grounds:
          - validations.priority_17_ERR_INVALID_WINDOW
          - validations.priority_22_ERR_RISK_WINDOW_OVERLAP
          - endpoints.POST_/ppa/deals/{id}/risk-events
        distinguishing_aspect: |
          A different pair of categories entirely - BUSINESS_TEMPORAL (priority 17)
          against BUSINESS_CONSTRAINT (priority 22), with no auth or concurrency rule
          involved. The trigger window [2027-07-18, 2027-07-12] is inverted AND, when
          read as an unordered pair of endpoints, straddles an existing CURTAILMENT
          claim, so a naive overlap-first implementation answers 409. Ordering must
          yield 422 ERR_INVALID_WINDOW. Re-sending the same two dates in the correct
          order then returns 409, which is what makes the priority claim falsifiable.
