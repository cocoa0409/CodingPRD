scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_liability_holdback
        grounds:
          - calculations.consumer_liability_holdback
          - calculations.provisional_credit_amount
          - entities.DisputeCase.fields.provisional_holdback_cents
          - entities.ProvisionalCredit.fields.final_amount_cents
        distinguishing_aspect: |
          DisputeCase-domain dual variant: identical claim data yields provisional
          credit 15000 (claimed delay tier 1) but final credit 0 after the verified
          delay (5 days) shifts the liability tier to tier 2 (cap min(50000, 20000)
          = 20000); the variants disagree by the full claim amount.
        test_recipe:
          setup:
            - "Old account (opened 2026-05-01) with balance 100000; VISA ECOMMERCE transaction 20000 posted 2026-07-01"
            - "Fraud dispute (UNAUTHORIZED) received 2026-08-03, claim 20000, claimed_report_delay_days 1"
            - "Classified fraud with verified_report_delay_days 1, then provisional credit granted (15000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Dana Old", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${acct_id}", merchant_name: "SHOP", amount_cents: 20000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${txn_id}", error_type: "UNAUTHORIZED", claim_amount_cents: 20000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { case_id: $.data.id }
            - call: "POST /disputes/${case_id}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 1 }
              as: DisputeInvestigator
              captures: { dc_v: $.data.version }
            - call: "POST /disputes/${case_id}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { pc_id: $.data.id, pc_amt: $.data.amount_cents }
          trigger:
            - call: "POST /disputes/${case_id}/reclassify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 5, expected_dispute_version: "${dc_v}" }
              as: DisputeInvestigator
            - call: "POST /disputes/${case_id}/resolve"
              payload: { outcome: "ERROR_CONFIRMED" }
              as: DisputeInvestigator
            - call: "GET /card-accounts/${acct_id}"
              payload: {}
              as: FinanceOfficer
              captures: { bal_after: $.data.balance_cents }
            - call: "GET /disputes/${case_id}/provisional-credits"
              payload: {}
              as: FinanceOfficer
              captures: { pc_final: "$.data[0].final_amount_cents", pc_status: "$.data[0].status" }
          assert:
            - "provisional variant: captured pc_amt == 15000 (claim 20000 - tier-1 holdback min(5000,20000))"
            - "final variant: pc_final == 0 (tier-2 holdback min(50000,20000) = 20000) and pc_status == FINALIZED"
            - "bal_after == 100000 (true-up reversed the full 15000 provisional grant)"
            - "claim conservation: cardholder_keeps_cents (0) + final_liability_cents (20000) == claim_amount_cents (20000)"
      - name: pre_compliance_vs_arbitration_fee_projection
        grounds:
          - calculations.case_network_fees
          - entities.Chargeback.fields.fees_total_cents
          - state_machines.Chargeback.SECOND_PRESENTED_to_CLOSED_WON
        distinguishing_aspect: |
          Chargeback-domain dual variant: two chargebacks with identical
          amount_cents (20000) diverge purely by escalation stage variant —
          PRE_COMPLIANCE totals 12660 while ARBITRATION totals 27800 — a different
          entity domain (Chargeback fees) than provisional_vs_final_liability_holdback.
        test_recipe:
          setup:
            - "Old account opened 2026-05-01, balance 100000; two VISA ECOMMERCE transactions 20000 each posted 2026-07-01"
            - "Two non-fraud disputes (SERVICE_NOT_RECEIVED) received 2026-08-03, classified non-fraud"
            - "Chargeback A and B both filed 2026-08-05 with reason V13_1; both REPRESENTED then REJECTED to SECOND_PRESENTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Fee Case", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { facct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${facct}", merchant_name: "M-A", amount_cents: 20000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { txna: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${facct}", merchant_name: "M-B", amount_cents: 20000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T11:00:00Z" }
              as: BankAdmin
              captures: { txnb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${txna}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 20000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${facct}"
              captures: { casea: $.data.id }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${txnb}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 20000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${facct}"
              captures: { caseb: $.data.id }
            - call: "POST /disputes/${casea}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /disputes/${caseb}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${casea}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { cba: $.data.id }
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${caseb}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { cbb: $.data.id }
            - call: "POST /chargebacks/${cba}/representments"
              payload: { merchant_ref: "MR-A", evidence_documents: [{ doc_type: "RECEIPT", reference: "r-a" }] }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${cbb}/representments"
              payload: { merchant_ref: "MR-B", evidence_documents: [{ doc_type: "RECEIPT", reference: "r-b" }] }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${cba}/review-representment"
              payload: { decision: "REJECT" }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${cbb}/review-representment"
              payload: { decision: "REJECT" }
              as: ChargebackAnalyst
          trigger:
            - call: "POST /chargebacks/${cba}/escalate"
              payload: { stage: "PRE_COMPLIANCE", outcome: "WON" }
              as: ChargebackAnalyst
              captures: { fees_a: $.data.fees_total_cents }
            - call: "POST /chargebacks/${cbb}/escalate"
              payload: { stage: "ARBITRATION", outcome: "WON" }
              as: ChargebackAnalyst
              captures: { fees_b: $.data.fees_total_cents }
          assert:
            - "fees_a == 12660 (2500 filing + 10000 + round_half_up(0.008*20000)=160)"
            - "fees_b == 27800 (2500 filing + 25000 + round_half_up(0.015*20000)=300)"
            - "fees_b - fees_a == 15140 (variant divergence on identical amount_cents)"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: investigation_window_by_type_fraud_and_account_age
        grounds:
          - calculations.investigation_window
          - entities.DisputeCase.fields.investigation_window_days
          - entities.DisputeCase.fields.investigation_deadline_at
        distinguishing_aspect: |
          Mode (a): a >=3-input conditional formula — window is 90 when fraud
          (case A: POS_PIN + fraud) but 45 when non-fraud ECOMMERCE on an old
          account (case B); the branch depends on the interaction of
          transaction_type, is_fraud_claim, and account age.
        test_recipe:
          setup:
            - "Old account opened 2026-05-01; txn A POS_PIN VISA 5000 posted 2026-07-01; txn B ECOMMERCE VISA 5000 posted 2026-07-01"
            - "Both disputes received 2026-08-03; A classified fraud, B classified non-fraud"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Win Case", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { wacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${wacct}", merchant_name: "POS-A", amount_cents: 5000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { wtxa: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${wacct}", merchant_name: "EC-B", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T11:00:00Z" }
              as: BankAdmin
              captures: { wtxb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${wtxa}", error_type: "UNAUTHORIZED", claim_amount_cents: 5000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${wacct}"
              captures: { wca: $.data.id }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${wtxb}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${wacct}"
              captures: { wcb: $.data.id }
          trigger:
            - call: "POST /disputes/${wca}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 1 }
              as: DisputeInvestigator
              captures: { win_a: $.data.investigation_window_days, dl_a: $.data.investigation_deadline_at }
            - call: "POST /disputes/${wcb}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 1 }
              as: DisputeInvestigator
              captures: { win_b: $.data.investigation_window_days, dl_b: $.data.investigation_deadline_at }
          assert:
            - "win_a == 90 and dl_a == 2026-11-01T23:59:59Z (fraud branch)"
            - "win_b == 45 and dl_b == 2026-09-17T23:59:59Z (standard branch)"
      - name: per_stage_fee_rounding_then_sum
        grounds:
          - calculations.case_network_fees
          - entities.Chargeback.fields.fees_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — the 0.8% ad-valorem on an
          odd amount (33333 -> 266.664) is rounded half-up to 267 per stage BEFORE
          being summed with the 2500 filing fee and 10000 base, yielding 12767;
          a different rounding order would produce a different cent value.
        test_recipe:
          setup:
            - "Old account opened 2026-05-01; VISA ECOMMERCE transaction 33333 posted 2026-07-01"
            - "Non-fraud dispute received 2026-08-03, classified; chargeback filed 2026-08-05 with amount_cents 33333; representment REJECTED to SECOND_PRESENTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Round Case", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { racct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${racct}", merchant_name: "ODD", amount_cents: 33333, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { rtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${rtx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 33333, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${racct}"
              captures: { rcase: $.data.id }
            - call: "POST /disputes/${rcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${rcase}", reason_code: "V13_1", amount_cents: 33333 }
              as: ChargebackAnalyst
              captures: { rcb: $.data.id }
            - call: "POST /chargebacks/${rcb}/representments"
              payload: { merchant_ref: "MR-R", evidence_documents: [{ doc_type: "INVOICE", reference: "r-1" }] }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${rcb}/review-representment"
              payload: { decision: "REJECT" }
              as: ChargebackAnalyst
          trigger:
            - call: "POST /chargebacks/${rcb}/escalate"
              payload: { stage: "PRE_COMPLIANCE", outcome: "LOST" }
              as: ChargebackAnalyst
              captures: { fees_r: $.data.fees_total_cents, stage_r: $.data.stage_entered }
          assert:
            - "fees_r == 12767 (2500 + 10000 + round_half_up(266.664)=267, per-stage rounded then summed)"
            - "stage_r == PRE_COMPLIANCE"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_case_representment_review_cycle
        grounds:
          - state_machines.DisputeCase.CHARGEBACK_FILED_to_REPRESENTMENT_REVIEW
          - state_machines.DisputeCase.REPRESENTMENT_REVIEW_to_CHARGEBACK_FILED
          - state_machines.CardTransaction.RE_PRESENTED_to_CHARGED_BACK
        distinguishing_aspect: |
          DisputeCase exhibits a cycle: CHARGEBACK_FILED -> REPRESENTMENT_REVIEW ->
          CHARGEBACK_FILED on second presentment, with CardTransaction cycling
          CHARGED_BACK -> RE_PRESENTED -> CHARGED_BACK in lockstep.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 12000 posted 2026-07-01; non-fraud dispute received 2026-08-03, classified; chargeback filed 2026-08-05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Cycle Case", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { cacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${cacct}", merchant_name: "CYC", amount_cents: 12000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { ctx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${ctx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 12000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${cacct}"
              captures: { ccase: $.data.id }
            - call: "POST /disputes/${ccase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${ccase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { ccb: $.data.id }
          trigger:
            - call: "POST /chargebacks/${ccb}/representments"
              payload: { merchant_ref: "MR-C", evidence_documents: [{ doc_type: "RECEIPT", reference: "c-1" }] }
              as: ChargebackAnalyst
            - call: "GET /disputes/${ccase}"
              payload: {}
              as: ChargebackAnalyst
              captures: { st_mid: $.data.status }
            - call: "POST /chargebacks/${ccb}/review-representment"
              payload: { decision: "REJECT" }
              as: ChargebackAnalyst
              captures: { cb_status: $.data.status }
            - call: "GET /disputes/${ccase}"
              payload: {}
              as: ChargebackAnalyst
              captures: { st_end: $.data.status }
            - call: "GET /card-accounts/${cacct}/transactions"
              payload: {}
              as: ChargebackAnalyst
              captures: { tx_status: "$.data[0].status" }
          assert:
            - "st_mid == REPRESENTMENT_REVIEW (entered cycle)"
            - "st_end == CHARGEBACK_FILED (looped back to a prior state — non-linear)"
            - "cb_status == SECOND_PRESENTED and tx_status == CHARGED_BACK"
      - name: provisional_credit_reversal_reinstatement_cycle
        grounds:
          - state_machines.ProvisionalCredit.GRANTED_to_REVERSED
          - state_machines.ProvisionalCredit.REVERSED_to_REINSTATED
          - state_machines.DisputeCase.RESOLVED_MERCHANT_FAVOR_to_RESOLVED_CARDHOLDER_FAVOR
        distinguishing_aspect: |
          ProvisionalCredit exhibits a cycle on a different entity than Rule-3
          instance 1: GRANTED -> REVERSED -> REINSTATED, flipping the DisputeCase
          from RESOLVED_MERCHANT_FAVOR back to RESOLVED_CARDHOLDER_FAVOR.
        test_recipe:
          setup:
            - "Old account balance 100000; VISA ECOMMERCE txn 20000 posted 2026-07-01; non-fraud dispute received 2026-08-03, classified, credit granted 20000 (holdback 0)"
            - "Resolved NO_ERROR on 2026-08-21 (REVERSAL_PENDING, REVERSAL_NOTICE sent); clock advanced 3 business days to 2026-08-26"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "PC Cycle", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { pacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${pacct}", merchant_name: "PCC", amount_cents: 20000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { ptx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${ptx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 20000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${pacct}"
              captures: { pcase: $.data.id }
            - call: "POST /disputes/${pcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${pcase}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { ppc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T10:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${pcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /provisional-credits/${ppc}/reverse"
              payload: {}
              as: FinanceOfficer
              captures: { st_rev: $.data.status }
            - call: "POST /provisional-credits/${ppc}/reinstate"
              payload: {}
              as: FinanceOfficer
              captures: { st_rei: $.data.status }
            - call: "GET /disputes/${pcase}"
              payload: {}
              as: FinanceOfficer
              captures: { case_st: $.data.status, case_loss: $.data.outstanding_loss_cents }
          assert:
            - "st_rev == REVERSED then st_rei == REINSTATED (credit cycle)"
            - "case_st == RESOLVED_CARDHOLDER_FAVOR (correction loop flipped resolution)"
            - "case_loss == 20000 (auto LOSS_RECOGNIZED entry equals reinstated amount)"

  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >=3 and >=2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: credit_reversal_cascades_case_account_notice
        grounds:
          - state_machines.ProvisionalCredit.GRANTED_to_REVERSED
          - state_machines.DisputeCase.REVERSAL_PENDING_to_RESOLVED_MERCHANT_FAVOR
          - state_machines.CardAccount.RESTRICTED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from POST /provisional-credits/{id}/reverse: credit
          GRANTED->REVERSED (A) causes DisputeCase REVERSAL_PENDING->
          RESOLVED_MERCHANT_FAVOR (B), whose resolution itself causes the
          fraud-RESTRICTED CardAccount to restore to ACTIVE (C) and the
          RESOLUTION_LETTER notification to be created (C'). Each link is caused
          by the previous mutation, not by the original request.
        test_recipe:
          setup:
            - "Old account balance 100000; VISA POS_PIN txn 20000 posted 2026-07-01; FRAUD dispute received 2026-08-03, classified fraud (account RESTRICTED), credit 15000 granted (tier-1 holdback 5000)"
            - "Resolved NO_ERROR on 2026-08-21 (REVERSAL_PENDING); clock at 2026-08-26 (3 business days after notice)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Cascade A", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { xacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${xacct}", merchant_name: "CASC", amount_cents: 20000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { xtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${xtx}", error_type: "UNAUTHORIZED", claim_amount_cents: 20000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${xacct}"
              captures: { xcase: $.data.id }
            - call: "POST /disputes/${xcase}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 1 }
              as: DisputeInvestigator
            - call: "POST /disputes/${xcase}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { xpc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T10:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${xcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /provisional-credits/${xpc}/reverse"
              payload: {}
              as: FinanceOfficer
            - call: "GET /card-accounts/${xacct}"
              payload: {}
              as: FinanceOfficer
              captures: { acct_status: $.data.status, acct_bal: $.data.balance_cents, acct_out: $.data.provisional_outstanding_cents }
            - call: "GET /disputes/${xcase}"
              payload: {}
              as: FinanceOfficer
              captures: { xcase_st: $.data.status }
            - call: "GET /disputes/${xcase}/notifications"
              payload: {}
              as: FinanceOfficer
          assert:
            - "xcase_st == RESOLVED_MERCHANT_FAVOR (B: case auto-advanced by credit reversal)"
            - "acct_status == ACTIVE (C: fraud restriction lifted because no open fraud cases remain)"
            - "acct_bal == 100000 and acct_out == 0 (ledger restored)"
            - "notifications for the case include types PROVISIONAL_CREDIT_ADVICE, REVERSAL_NOTICE, RESOLUTION_LETTER"
      - name: representment_accept_cascades_loss_and_notice
        grounds:
          - state_machines.Chargeback.REPRESENTED_to_CLOSED_LOST
          - state_machines.DisputeCase.REPRESENTMENT_REVIEW_to_RESOLVED_MERCHANT_FAVOR
          - calculations.recovery_waterfall
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (review-representment ACCEPT):
          Chargeback REPRESENTED->CLOSED_LOST (A) causes DisputeCase
          REPRESENTMENT_REVIEW->RESOLVED_MERCHANT_FAVOR (B), which itself creates
          the auto LOSS_RECOGNIZED entry (2500 filing fee) and RESOLUTION_LETTER
          notification (C).
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 12000 posted 2026-07-01; non-fraud dispute received 2026-08-03, classified; NO provisional credit granted"
            - "Chargeback filed 2026-08-05 (fee 2500); merchant representment registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Cascade B", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { yacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${yacct}", merchant_name: "CASB", amount_cents: 12000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { ytx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${ytx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 12000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${yacct}"
              captures: { ycase: $.data.id }
            - call: "POST /disputes/${ycase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${ycase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { ycb: $.data.id }
            - call: "POST /chargebacks/${ycb}/representments"
              payload: { merchant_ref: "MR-Y", evidence_documents: [{ doc_type: "RECEIPT", reference: "y-1" }] }
              as: ChargebackAnalyst
          trigger:
            - call: "POST /chargebacks/${ycb}/review-representment"
              payload: { decision: "ACCEPT" }
              as: ChargebackAnalyst
              captures: { ycb_st: $.data.status }
            - call: "GET /disputes/${ycase}"
              payload: {}
              as: ChargebackAnalyst
              captures: { ycase_st: $.data.status, yloss: $.data.outstanding_loss_cents }
            - call: "GET /disputes/${ycase}/loss-recoveries"
              payload: {}
              as: FinanceOfficer
              captures: { lre_amt: "$.data[0].amount_cents", lre_src: "$.data[0].source", lre_type: "$.data[0].type" }
          assert:
            - "ycb_st == CLOSED_LOST (A)"
            - "ycase_st == RESOLVED_MERCHANT_FAVOR (B, no open credit)"
            - "lre_type == LOSS_RECOGNIZED and lre_amt == 2500 and lre_src == AUTO (C, caused by B)"
            - "yloss == 2500"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resolve_state_error_beats_window_expired
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INVESTIGATION_WINDOW_EXPIRED]
        distinguishing_aspect: |
          state vs business_temporal pair: resolving an already-terminal case AND
          past the investigation deadline are both violated; priority 6 (state)
          must win, returning ERR_INVALID_STATE, never ERR_INVESTIGATION_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 9000 posted 2026-07-01; non-fraud dispute received 2026-08-03, classified, credit granted"
            - "Resolved NO_ERROR 2026-08-10 -> REVERSAL_PENDING; clock advanced to 2026-09-20 (past the 2026-09-17 investigation deadline)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Prio A", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { pracct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${pracct}", merchant_name: "PRA", amount_cents: 9000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { prtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${prtx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 9000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${pracct}"
              captures: { prcase: $.data.id }
            - call: "POST /disputes/${prcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
            - call: "POST /disputes/${prcase}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes/${prcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /disputes/${prcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (case in REVERSAL_PENDING is not a resolve from-state; priority 6 beats the also-violated priority-9 window rule)"
      - name: intake_duplicate_dispute_beats_claim_exceeds
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_DUPLICATE_ACTIVE_DISPUTE]
          - errors[ERR_CLAIM_EXCEEDS_TRANSACTION]
        distinguishing_aspect: |
          state vs business_fiscal pair (different pair than instance 1): intake
          on an already-DISPUTED transaction with claim_amount_cents (99999)
          exceeding the transaction amount (9000) violates both; the priority-6
          duplicate-dispute state rule wins over the priority-11 fiscal rule.
        test_recipe:
          setup:
            - "Old account; VISA ECOMMERCE txn 9000 posted 2026-07-01; dispute received 2026-08-03 leaves transaction DISPUTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Prio B", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { pbacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${pbacct}", merchant_name: "PRB", amount_cents: 9000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { pbtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${pbtx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${pbacct}"
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "${pbtx}", error_type: "DUPLICATE_CHARGE", claim_amount_cents: 99999, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${pbacct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_ACTIVE_DISPUTE (not ERR_CLAIM_EXCEEDS_TRANSACTION, though both are violated)"

  # ==========================================================================
