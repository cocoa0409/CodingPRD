  - rule_id: non_linear_state_machine
    instances:
      - name: parity_case_notify_respond_cycle_bounded_at_three_rounds
        grounds:
          - state_machines.ParityCase.SUPPLIER_NOTIFIED_to_SUPPLIER_RESPONDED
          - state_machines.ParityCase.SUPPLIER_RESPONDED_to_SUPPLIER_NOTIFIED
          - entities.ParityCase.fields.notify_rounds
          - validations[priority=18]
          - errors.ERR_PARITY_ROUND_LIMIT
        distinguishing_aspect: |
          ParityCase is the cyclic machine: SUPPLIER_NOTIFIED and SUPPLIER_RESPONDED alternate three times
          on the same row, notify_rounds counts 1, 2, 3 across the loop, and the fourth notify from a legal
          SUPPLIER_RESPONDED state is refused by the round bound rather than by any state precondition.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; hotel supplier CERTIFIED with a LIVE offer for 2026-09-20 at display_total_cents 24240 on a parity_monitored plan."
            - "One ParityCase opened in OPEN at 100 bps (MINOR) by a direct-rate observation of 24000."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - &k_obs_100
              call: "POST /rate-plans/${rp_h}/parity-observations"
              payload: { travel_date: "2026-09-20", channel: "SUPPLIER_WEB", observed_at: "2026-08-06T09:00:00Z", direct_total_cents: 24000 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_100: $.data.id, case_100: $.data.parity_case_id }
          trigger:
            - call: "POST /parity-cases/${case_100}/notify-supplier"
              payload: { note: "round 1" }
              as: ParityAnalyst
              as_user_id: "pa-2"
            - call: "POST /parity-cases/${case_100}/respond"
              payload: { supplier_response_code: "DISPUTED", note: "our direct rate is a member rate" }
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /parity-cases/${case_100}/notify-supplier"
              payload: { note: "round 2" }
              as: ParityAnalyst
              as_user_id: "pa-2"
            - call: "POST /parity-cases/${case_100}/respond"
              payload: { supplier_response_code: "NO_ACTION", note: "no change" }
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /parity-cases/${case_100}/notify-supplier"
              payload: { note: "round 3" }
              as: ParityAnalyst
              as_user_id: "pa-2"
            - call: "POST /parity-cases/${case_100}/respond"
              payload: { supplier_response_code: "RATE_CORRECTED", note: "corrected" }
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /parity-cases/${case_100}/notify-supplier"
              payload: { note: "round 4 must be refused" }
              as: ParityAnalyst
              as_user_id: "pa-2"
          assert:
            - "after the first notify ParityCase.${case_100}.status == SUPPLIER_NOTIFIED and notify_rounds == 1"
            - "after the second notify notify_rounds == 2 and after the third notify notify_rounds == 3"
            - "each respond returns status SUPPLIER_RESPONDED, proving the loop revisits both states"
            - "ParityCase.${case_100}.supplier_response_code == RATE_CORRECTED after the third respond"
            - "the fourth notify-supplier returns HTTP 409 with error_id ERR_PARITY_ROUND_LIMIT"
            - "ParityCase.${case_100}.status is still SUPPLIER_RESPONDED and notify_rounds is still 3 after the refusal"

      - name: booking_payment_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.Booking.AUTHORIZED_to_CAPTURED
          - state_machines.Booking.RESERVED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_COMPLETED
          - state_machines.Booking.CAPTURED_to_CHARGEBACK
          - entities.Booking.fields.payment_status
          - entities.Booking.fields.fulfillment_status
        distinguishing_aspect: |
          Booking is the parallel machine: capture moves only payment_status and leaves fulfillment_status
          RESERVED, confirm moves only fulfillment_status and leaves payment_status CAPTURED, and the
          terminal combined state CHARGEBACK + COMPLETED is reached by advancing the two axes in
          independent order - a different entity and a different shape from the cyclic ParityCase.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; hotel supplier CERTIFIED with a LIVE offer for 2026-09-20 at display_total_cents 24240 and allotment_total 3."
            - "One booking on that offer in AUTHORIZED + RESERVED with allotment_held 1 and allotment_remaining 2."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - &k_bk_h
              call: "POST /bookings"
              payload: { offer_id: "${off_h}", traveler_reference: "PNR-C3", quoted_total_cents: 24240, payment_token: "tok_live_3" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { bk_h: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_h}/capture"
              payload: {}
              as: BookingAgent
              as_user_id: "ba-1"
            - call: "POST /bookings/${bk_h}/confirm"
              payload: { supplier_confirmation_code: "LUT-88213" }
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T15:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${bk_h}/complete"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /_payments/simulate-chargeback"
              payload: { booking_id: "${bk_h}", reason_code: "13.1" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "Booking.${bk_h}.charged_total_cents == 24240, marketplace_margin_cents == 3600, supplier_payable_cents == 20400, taxes_fees_cents == 240 and collection_model == SUPPLIER_OF_RECORD"
            - "Booking.${bk_h}.arrival_at == 2026-09-20T15:00:00Z"
            - "after capture: payment_status == CAPTURED and fulfillment_status == RESERVED (unchanged)"
            - "after capture: Offer.${off_h}.allotment_remaining == 2, allotment_held == 1 and allotment_sold == 0"
            - "after confirm: fulfillment_status == CONFIRMED and payment_status == CAPTURED (unchanged)"
            - "after confirm: Offer.${off_h}.allotment_held == 0 and allotment_sold == 1 while allotment_remaining stays 2"
            - "after complete: fulfillment_status == COMPLETED and payment_status == CAPTURED"
            - "after simulate-chargeback: payment_status == CHARGEBACK and fulfillment_status == COMPLETED"

  - rule_id: transitive_cascade
    instances:
      - name: certification_revoke_cascades_supplier_offer_package_and_ranking
        grounds:
          - state_machines.Certification.CERTIFIED_to_REVOKED
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.Offer.LIVE_to_SUPPRESSED
          - state_machines.Package.PUBLISHED_to_WITHDRAWN
          - state_machines.RankingRun.PUBLISHED_to_WITHDRAWN
        distinguishing_aspect: |
          A single POST /certifications/{id}/revoke propagates four hops - Certification REVOKED, Supplier
          SUSPENDED, its LIVE Offer SUPPRESSED, and both the PUBLISHED Package and the PUBLISHED RankingRun
          that quoted that offer WITHDRAWN - while the untouched air supplier's offer stays LIVE, proving the
          cascade follows the certification's ownership edge and not the whole market.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; market EU-PAR with ranking_disclosure_required true."
            - "Hotel supplier CERTIFIED with a LIVE offer for 2026-09-20 (display 198007); air supplier CERTIFIED with a LIVE offer for the same date (display 143106)."
            - "One opaque package holding both offers, PRICED then PUBLISHED with package_total_cents 310413."
            - "One ranking run for EU-PAR and 2026-09-20 with disclosure_version EU-2026-Q3, PUBLISHED with two entries."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_t7
            - *k_off_t7
            - *k_off_t7_pub
            - *k_sup_a
            - *k_cert_a_sub
            - *k_cert_a_rev
            - *k_cert_a_dec
            - *k_ma_a
            - *k_ma_a_act
            - *k_rp_a
            - *k_off_a
            - *k_off_a_pub
            - *k_pkg
            - *k_pkg_cmp_h
            - *k_pkg_cmp_a
            - *k_pkg_read
            - &k_pkg_price
              call: "POST /packages/${pkg}/price"
              payload: { expected_package_version: "${pkg_v}" }
              as: CommercialManager
              as_user_id: "cm-2"
            - call: "POST /packages/${pkg}/publish"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
            - &k_run
              call: "POST /ranking-runs"
              payload: { market_id: "${mkt_id}", travel_date: "2026-09-20", sort_profile: "BEST_VALUE", disclosure_version: "EU-2026-Q3" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { run: $.data.id }
            - call: "POST /ranking-runs/${run}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          trigger:
            - call: "POST /certifications/${cert_h}/revoke"
              payload: { revocation_reason: "content audit failed post-certification" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "hop 1: Certification.${cert_h}.status == REVOKED and revocation_reason == 'content audit failed post-certification'"
            - "hop 2: Supplier.${sup_h}.visibility_status == SUSPENDED, suspension_reason == CERTIFICATION_REVOKED and certification_level == NONE"
            - "hop 3: Offer.${off_t7}.status == SUPPRESSED and suppression_reason == SUPPLIER_SUSPENDED"
            - "hop 4: Package.${pkg}.status == WITHDRAWN and RankingRun.${run}.status == WITHDRAWN"
            - "Offer.${off_a}.status == LIVE and Supplier.${sup_a}.visibility_status == ACTIVE: the air supplier is untouched"
            - "Package.${pkg}.package_total_cents is still 310413: the withdrawal does not re-price the package"

      - name: parity_escalation_cascades_plan_hold_offer_suppression_and_strike
        grounds:
          - state_machines.ParityCase.SUPPLIER_NOTIFIED_to_ESCALATED
          - state_machines.RatePlan.ACTIVE_to_PARITY_HOLD
          - state_machines.Offer.LIVE_to_SUPPRESSED
          - entities.Supplier.fields.parity_strikes
          - entities.RatePlan.fields.parity_hold_case_id
        distinguishing_aspect: |
          A different trigger - POST /parity-cases/{id}/escalate - drives a three-hop chain through a
          different edge set: ParityCase ESCALATED, its RatePlan into PARITY_HOLD with parity_hold_case_id
          back-linked, every LIVE offer of that plan SUPPRESSED with suppression_reason PARITY_HOLD, plus
          the Supplier.parity_strikes counter advancing to 1 without suspending the supplier.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; hotel supplier CERTIFIED and ACTIVE with parity_strikes 0."
            - "A parity_monitored plan with a LIVE offer for 2026-09-20 at display_total_cents 24240."
            - "One ParityCase at 821 bps (SEVERE) already moved to SUPPLIER_NOTIFIED."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - call: "POST /rate-plans/${rp_h}/parity-observations"
              payload: { travel_date: "2026-09-20", channel: "META", observed_at: "2026-08-06T11:00:00Z", direct_total_cents: 22400 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_sev: $.data.id, case_sev: $.data.parity_case_id }
            - call: "POST /parity-cases/${case_sev}/notify-supplier"
              payload: { note: "severe breach, respond within 24h" }
              as: ParityAnalyst
              as_user_id: "pa-2"
          trigger:
            - call: "POST /parity-cases/${case_sev}/escalate"
              payload: { escalation_reason: "no supplier response to a severe breach" }
              as: ParityAnalyst
              as_user_id: "pa-2"
          assert:
            - "DirectRateObservation.${obs_sev}.breach_bps == 821 and severity == SEVERE"
            - "hop 1: ParityCase.${case_sev}.status == ESCALATED with escalated_at stamped at 2026-08-05T00:00:00Z"
            - "hop 2: RatePlan.${rp_h}.status == PARITY_HOLD and parity_hold_case_id == ${case_sev}"
            - "hop 3: Offer.${off_h}.status == SUPPRESSED and suppression_reason == PARITY_HOLD"
            - "Supplier.${sup_h}.parity_strikes == 1 and visibility_status is still ACTIVE"
            - "ParityCase.${case_sev}.peak_breach_bps == 821 and severity == SEVERE"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_booking_a_suppressed_offer_with_a_stale_quote
        grounds:
          - validations[priority=9]
          - validations[priority=31]
          - errors.ERR_OFFER_NOT_LIVE
          - errors.ERR_PRICE_CHANGED
          - state_machines.Offer.LIVE_to_SUPPRESSED
        distinguishing_aspect: |
          One POST /bookings violates the priority-9 `state` rule (the offer is SUPPRESSED) and the
          priority-31 `business_fiscal` rule (quoted_total_cents 20000 does not equal display_total_cents
          24240); the response must be ERR_OFFER_NOT_LIVE with HTTP 409, never ERR_PRICE_CHANGED - a
          state-versus-fiscal category pair.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; hotel supplier CERTIFIED."
            - "An offer for 2026-09-20 with display_total_cents 24240 that was published and then SUPPRESSED for a content defect."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - call: "POST /offers/${off_h}/suppress"
              payload: { suppression_reason: "content defect on the room description" }
              as: CommercialManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /bookings"
              payload: { offer_id: "${off_h}", traveler_reference: "PNR-D4", quoted_total_cents: 20000, payment_token: "tok_live_4" }
              as: BookingAgent
              as_user_id: "ba-1"
          assert:
            - "the response is HTTP 409 with error_id ERR_OFFER_NOT_LIVE"
            - "the response error_id is NOT ERR_PRICE_CHANGED even though quoted_total_cents 20000 != 24240"
            - "no Booking row is created and Offer.${off_h}.allotment_remaining is still 3"

      - name: safety_beats_referential_on_ranking_publish_missing_disclosure_with_cancelled_placement
        grounds:
          - validations[priority=11]
          - validations[priority=25]
          - errors.ERR_DISCLOSURE_MISSING
          - errors.ERR_PLACEMENT_NOT_ACTIVE
          - state_machines.PlacementAgreement.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          One POST /ranking-runs/{id}/publish violates the priority-11 `business_safety` rule (no
          disclosure_version in a market that requires one) and the priority-25 `business_referential` rule
          (the run's paid entry points at a CANCELLED placement agreement); the response must be
          ERR_DISCLOSURE_MISSING with HTTP 422 - a safety-versus-referential category pair distinct from the
          state-versus-fiscal pair above.
        test_recipe:
          setup:
            - "Market EU-PAR has ranking_disclosure_required true and paid_slot_capacity 3."
            - "Hotel supplier CERTIFIED with a LIVE offer for 2026-09-20."
            - "An ACTIVE placement agreement for that supplier and market over [2026-09-01, 2026-10-01) with boost_points 8."
            - "A DRAFT ranking run built with no disclosure_version, whose single entry is a paid placement."
            - "The placement agreement is then CANCELLED, so the run's paid entry is stale."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
            - &k_plc
              call: "POST /placement-agreements"
              payload: { supplier_id: "${sup_h}", market_id: "${mkt_id}", slots: 1, boost_points: 8, fee_cents: 500000, disclosure_label: "SPONSORED", window_start: "2026-09-01", window_end: "2026-10-01" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { plc: $.data.id }
            - &k_plc_appr
              call: "POST /placement-agreements/${plc}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /ranking-runs"
              payload: { market_id: "${mkt_id}", travel_date: "2026-09-20", sort_profile: "BEST_VALUE" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { run_nd: $.data.id }
            - call: "POST /placement-agreements/${plc}/cancel"
              payload: { cancellation_reason: "supplier withdrew from the paid programme" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /ranking-runs/${run_nd}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "RankingRun.${run_nd}.paid_entry_count == 1 and disclosure_version == null at creation time"
            - "the response is HTTP 422 with error_id ERR_DISCLOSURE_MISSING"
            - "the response error_id is NOT ERR_PLACEMENT_NOT_ACTIVE even though PlacementAgreement.${plc}.status == CANCELLED"
            - "RankingRun.${run_nd}.status is still DRAFT and published_at is null"

  - rule_id: boundary_precision_check
    instances:
      - name: parity_breach_exactly_at_tolerance_opens_a_minor_case
        grounds:
          - calculations.parity_breach_bps
          - entities.DirectRateObservation.fields.breach_bps
          - entities.DirectRateObservation.fields.severity
          - entities.ParityCase.fields.peak_breach_bps
        distinguishing_aspect: |
          The metric is breach_bps at POST /rate-plans/{id}/parity-observations: a direct total of 24100
          yields 58 bps and stays severity NONE with no case, while 24000 yields exactly
          PARITY_TOLERANCE_BPS (100) and opens a MINOR case, proving the band comparison is >= on the lower
          bound.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; hotel supplier CERTIFIED with a LIVE offer for 2026-09-20 at display_total_cents 24240 on a parity_monitored plan."
            - "No parity case exists for that plan and travel date."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - *k_rp_h
            - *k_off_h
            - *k_off_h_pub
          trigger:
            - call: "POST /rate-plans/${rp_h}/parity-observations"
              payload: { travel_date: "2026-09-20", channel: "SUPPLIER_WEB", observed_at: "2026-08-06T08:00:00Z", direct_total_cents: 24100 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_below: $.data.id }
            - call: "POST /rate-plans/${rp_h}/parity-observations"
              payload: { travel_date: "2026-09-20", channel: "SUPPLIER_WEB", observed_at: "2026-08-06T09:00:00Z", direct_total_cents: 24000 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_at: $.data.id, case_at: $.data.parity_case_id }
          assert:
            - "DirectRateObservation.${obs_below}.breach_bps == 58, severity == NONE and parity_case_id == null"
            - "DirectRateObservation.${obs_at}.breach_bps == 100 and severity == MINOR"
            - "ParityCase.${case_at}.status == OPEN, severity == MINOR, peak_breach_bps == 100 and opening_observation_id == ${obs_at}"
            - "GET /parity-cases with rate_plan_id ${rp_h} returns exactly 1 row"

      - name: refund_exactly_at_free_cancel_cutoff_returns_the_full_refund
        grounds:
          - calculations.refund_passthrough_due
          - entities.Booking.fields.cancellation_refund_pct
          - entities.Booking.fields.refunded_cents
          - state_machines.Booking.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          The metric is hours_to_arrival at POST /bookings/{id}/cancel: with the clock at
          2026-09-18T15:00:00Z the distance to the 2026-09-20T15:00:00Z arrival is exactly 48.0 hours, equal
          to free_cancel_cutoff_hours, so the >= comparison keeps the generous FLEX band and refunds 100%,
          leaving all three retained money components at zero.
        test_recipe:
          setup:
            - "Hotel supplier CERTIFIED with a FLEX plan whose free_cancel_cutoff_hours is 48 and tax_fee_pct is 0.01."
            - "A LIVE offer for 2026-09-20 with display_total_cents 24240, margin 3600, payable 20400 and taxes 240."
            - "One booking on that offer, CAPTURED, in fulfillment_status RESERVED."
            - "Logical clock moved to exactly 2026-09-18T15:00:00Z."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
