  # ---------------------------------------------------------------------------
  # 8. CROSS-CUTTING COMPLEXITY LAYERS. The scaffold declares
  #    complexity_layers: contagion_risk_propagation, cascading_side_effects,
  #    dual_variant_calculation, ops_run_checkpoint. Two of those four have no
  #    literal claim_type in the taxonomy, so they are mapped as follows:
  #      contagion_risk_propagation -> cascading_side_effects (the adverse-media
  #        fan-out that reaches the ownership graph, the rating and the calendar)
  #      ops_run_checkpoint        -> cascading_side_effects (POST /refresh-sweeps,
  #        the operator run that applies many transitions in a pinned order)
  #    optimistic_concurrency is included because §1.2.1 declares two
  #    concurrency_rules, and the taxonomy maps each rule to one OCC test.
  #    pagination_with_filtering is NOT an active layer here; list ordering,
  #    filtering and paging are covered in the endpoints section instead.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_questionnaire_create_rejects_a_stale_respondent_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[questionnaire-create-stale-respondent]
          - validations[priority=10]
          - errors[ERR_STALE_RESPONDENT_VERSION]
        distinguishing_aspect: "Walks the first §1.2.1 rule through a full read-write-retry cycle and proves the version counter is a strict per-write monotone: the create that SUCCEEDS also invalidates the token the client is holding, so a client that creates two questionnaires in a row must re-read in between. Every step asserts the exact version value, which no other instance in the suite does."
        test_recipe:
          setup: ["A DD_IN_PROGRESS respondent. The client reads its version once and holds that token across an intervening write by another actor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { ver_held: $.data.version }
            - call: "PATCH /correspondent-banking/respondents/${r_id}"
              payload: { expected_monthly_count: 120 }
              as: FIGRelationshipManager
              as_user_id: "u-fig-1"
            - call: "GET /correspondent-banking/respondents/${r_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { ver_fresh: $.data.version }
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_id}/questionnaires"
              payload: { questionnaire_version: "2026.1", expected_respondent_version: "${ver_held}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/questionnaires"
              payload: { questionnaire_version: "2026.1", expected_respondent_version: "${ver_fresh}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/questionnaires"
              payload: { questionnaire_version: "2026.1", expected_respondent_version: "${ver_fresh}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { ver_after: $.data.version }
            - call: "POST /correspondent-banking/respondents/${r_id}/questionnaires"
              payload: { questionnaire_version: "2026.1", expected_respondent_version: "${ver_after}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { q2: $.data.id }
          assert:
            - "${ver_fresh} == ${ver_held} + 1 - the intervening PATCH incremented the respondent version by exactly one"
            - "first response.status == 412 with error_id ERR_STALE_RESPONDENT_VERSION and GET /correspondent-banking/questionnaires?respondent_bank_id=${r_id} still returns total_count 0"
            - "second response.status == 201 in state DRAFT, and ${ver_after} == ${ver_fresh} + 1 - a successful create is itself a write on the parent"
            - "third response.status == 412 with error_id ERR_STALE_RESPONDENT_VERSION - the token that just worked is already stale, and total_count is still 1"
            - "fifth response.status == 201, and DueDiligenceQuestionnaire.${q1} is SUPERSEDED while ${q2} is DRAFT"

      - name: occ_monitoring_profile_create_beats_the_interval_overlap_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[monitoring-profile-create-stale-respondent]
          - validations[priority=10]
          - validations[priority=37]
          - errors[ERR_STALE_RESPONDENT_VERSION]
        distinguishing_aspect: "The second §1.2.1 rule, plus the ordering the rule exists for: a writer holding a stale token AND proposing an interval that collides with an existing profile is told its view is out of date (412), not that the interval is taken (409). Because the profile calibrates against the respondent's live risk_rating, learning the version is stale is the more actionable answer - and the same colliding interval returns 409 once the token is fresh."
