      - name: empty_packet_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - "errors[ERR_EMPTY_EVIDENCE_PACKET]"
        distinguishing_aspect: "evidence_item_ids must be non-empty: an empty array fails ERR_EMPTY_EVIDENCE_PACKET before any evidence lookup happens."
        test_recipe:
