          assert:
            - "HTTP 200 and ExecutiveEngagement.${eng_id}.state == \"NO_SHOW\" and outcome_recorded_at == \"2026-08-01T00:00:00Z\"."
            - "Account.${acct_id}.exec_engagement_score == 30.00 (50.00 base with buyer, minus the 20.00 no-show debit)."
            - "Account.${acct_id}.snapshot_health_score == 44.50 and trended_health_score == 44.50."
