  - rule_id: resource_temporal_overlap
    instances:

      - name: outage_window_half_open_adjacency_accepted_while_interior_start_collides
        grounds:
          - validations[priority=27]
          - errors[ERR_OUTAGE_WINDOW_OVERLAP]
          - entities.OutageEvent.fields.started_at
          - endpoints["POST /satellite-broadband/outage-events"]
        distinguishing_aspect: |
          Interval semantics 1 of 2 — half-open [started_at, ended_at) with no buffer, on the Beam as
          the occupied resource: a new event whose started_at is exactly the prior event's ended_at
          (2026-08-05T04:00:00Z) is accepted because the prior interval excludes its right endpoint,
          while a started_at strictly inside that interval (2026-08-05T02:00:00Z) is rejected with
          ERR_OUTAGE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for provisioning, then advanced to 2026-08-11T00:00:00Z."
            - "Base licence/beam/cell/plan fixture; cell max_active_terminals 1; one subscription ACTIVE and AUTHORIZED_FIXED."
            - "A RESOLVED EQUIPMENT_FAILURE / FULL_OUTAGE event on BEAM-01 occupies [2026-08-05T00:00:00Z, 2026-08-05T04:00:00Z) with outage_minutes 240."
