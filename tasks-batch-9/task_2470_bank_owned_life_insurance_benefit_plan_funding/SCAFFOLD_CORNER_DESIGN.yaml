              payload: {}
              as: BenefitsAnalyst
            - call: "POST /purchase-requests"
              payload: { carrier_id: "${carrier_dn_id}", product_type_id: "${prod_dn_id}", employee_id: "${emp_iyer_id}", single_premium_usd: 1000000.00, face_amount_usd: 3000000.00, requested_effective_date: "2026-09-01T00:00:00Z" }
              as: BenefitsAnalyst
              captures: { pr_iyer_id: $.data.id }
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_iyer_id}", coverage_start_date: "2027-09-01T00:00:00Z", coverage_end_date: "2028-08-31T00:00:00Z", consent_form_reference: "CF-9402", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
