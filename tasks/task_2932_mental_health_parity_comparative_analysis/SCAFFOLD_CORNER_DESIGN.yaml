            - "NqtlItem.${item_id}.status == INVENTORIED and determination_recorded_by_user_id == null"
            - "GET /parity/corrective-action-plans?nqtl_item_id=${item_id} returns total_count == 0"
            - "GET /parity/regulator-requests?plan_year_id=${py_id} returns total_count == 0"
            - "PlanYear.${py_id}.status == OPEN (no regulator review was opened) and version == ${py_v}"

      - name: plan_sponsor_cannot_review_and_compliance_officer_cannot_produce_data
        claim_type: Exclusive Operation Denied
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.Administrator.exclusive_operations
