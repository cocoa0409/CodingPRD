          Security is measured against the whole net_due_cents including the administrative
          charge, so 5189520 - one cent short of 5189521 - must be refused. The rejected
          agreement stays REQUESTED, is then denied, and a second agreement with exact
          security executes and defers the fee. The final replay of EXECUTE on the now
