              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_b_elec_id: $.data.id }
            - call: "POST /utility-connections/${uc_b_elec_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_b_id: $.data.id }
            - call: "POST /permit-submittals/${sub_b_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_b_id}/plan-check-result"
