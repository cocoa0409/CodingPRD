          assert:
            - "after A1: adjusted_quantity was 60 (floor(100 x 0.60))"
            - "after A2: A1 SUPERSEDED, adjusted_quantity was 120 (floor(100 x 1.20))"
            - "after A2 rescinded: adjusted_quantity reverted to 100"
