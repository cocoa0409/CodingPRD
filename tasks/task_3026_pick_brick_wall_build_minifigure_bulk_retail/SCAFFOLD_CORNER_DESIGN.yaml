              payload: { element_code: "6701", element_name: "Brick 2x4", theme: "Town", unit_mass_grams: 2.5, cost_basis_cents: 6, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el6701: $.data.id }
