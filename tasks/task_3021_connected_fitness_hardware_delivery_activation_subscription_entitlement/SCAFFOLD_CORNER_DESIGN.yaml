            - "scheduling then succeeds and DeliveryAppointment.${a_id}.status == SCHEDULED (captured as ${sch_state})"
            - "the repeat schedule returns 409 ERR_INVALID_STATE (captured as ${err_repeat}) because REQUESTED is the only admissible from-state"
            - "HardwareOrder.${o_id}.status == DELIVERY_SCHEDULED throughout"

      - name: service_order_and_part_get_with_an_unknown_id_returns_resource_not_found
        claim_type: Not Found
