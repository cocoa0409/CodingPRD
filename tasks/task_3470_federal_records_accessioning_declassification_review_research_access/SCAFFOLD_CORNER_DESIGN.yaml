            - "Logical clock at 2026-09-01T00:00:00Z. Agencies DOJ and CIA; classified C1; Ada ACTIVE with a RECEIVED FOIA request; an IN_PROGRESS MDR review holds one SENT referral to CIA."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_ag_cia
            - *k_sch_s1_create
            - *k_sch_s1_submit
            - *k_sch_s1_appraise
            - *k_sch_s1_decide
            - *k_tr_t1_create
            - *k_tr_t1_meta
            - *k_tr_t1_accession
            - *k_res_ada
            - *k_res_ada_act
