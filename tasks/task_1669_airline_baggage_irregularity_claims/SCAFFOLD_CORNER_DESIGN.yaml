            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234663", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00163", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/reports/${rpt}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster, captures: { rpt_v: $.data.version } }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SETTLEMENT_NOT_PAYABLE"
            - "HTTP status == 409"
            - "IrregularityReport.${rpt}.status == SETTLEMENT_OFFERED"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: passenger_cannot_create_dispatch
        claim_type: rbac_exclusive_denied
        grounds: ['roles[BaggageServiceAgent]', 'roles[Passenger]', 'errors[ERR_FORBIDDEN_FOR_ROLE]']
        distinguishing_aspect: "Dispatch creation is exclusive to BaggageServiceAgent: a Passenger caller is rejected with ERR_FORBIDDEN_FOR_ROLE (403) at priority 2, before existence checks on the body ids."
        test_recipe:
          setup: ["station JFK exists (filler so setup is non-empty)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
          trigger:
            - { call: "POST /baggage/dispatches", payload: { report_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", courier_service_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: Passenger, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "HTTP status == 403"

      - name: agent_cannot_adjudicate_claim
        claim_type: rbac_exclusive_denied
        grounds: ['roles[ClaimsAdjuster]', 'roles[BaggageServiceAgent]', 'errors[ERR_FORBIDDEN_FOR_ROLE]']
        distinguishing_aspect: "Adjudication is exclusive to ClaimsAdjuster: a BaggageServiceAgent calling adjudicate on a real SUBMITTED claim is rejected with ERR_FORBIDDEN_FOR_ROLE and the claim stays SUBMITTED."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; DELAYED report TRACING; claim SUBMITTED (4000 on 2026-08-02)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234671", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00171", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "meals", amount_minor: 4000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm}/adjudicate", payload: { decision: "APPROVE" }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "HTTP status == 403"
            - "ExpenseClaim.${clm}.status == SUBMITTED"

      - name: adjuster_cannot_create_courier_service
        claim_type: rbac_exclusive_denied
        grounds: ['roles[SystemAdmin]', 'roles[ClaimsAdjuster]', 'errors[ERR_FORBIDDEN_FOR_ROLE]']
        distinguishing_aspect: "Configuration entities are exclusive to SystemAdmin: a ClaimsAdjuster creating a courier service is rejected with ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["station JFK exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
          trigger:
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn}"], turnaround_buffer_minutes: 60 }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "HTTP status == 403"

      - name: passenger_can_read_own_report
        claim_type: rbac_shared_allowed
        grounds: ['roles[Passenger]', 'endpoints["GET /baggage/reports/{id}"]']
        distinguishing_aspect: "All GET endpoints are shared across the four roles: a Passenger can GET a report and receives the full entity including computed liability fields."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic bag; DELAYED report in TRACING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234672", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00172", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          trigger:
            - { call: "GET /baggage/reports/${rpt}", as: Passenger, as_user_id: "${pax}" }
          assert:
            - "HTTP 200"
            - "IrregularityReport.${rpt}.status == TRACING"
            - "IrregularityReport.${rpt}.effective_cap_cents == 50000"

  # ===========================================================================
  # Section: complexity_layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_report_version_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[settlement-create-stale-report]', 'errors[ERR_STALE_REPORT_VERSION]']
        distinguishing_aspect: "Two strictly sequential payment creations carrying the same captured report version: the first succeeds and bumps report.version; the second, replaying the stale version, is rejected with 412 ERR_STALE_REPORT_VERSION."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; international bag; DELAYED report swept DECLARED_LOST; assess-loss 100000; offer; accept (captures report version)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234681", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00181", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/reports/${rpt}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/accept-settlement", payload: {}, as: Passenger, as_user_id: "${pax}", captures: { rpt_v: $.data.version } }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { pay: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "First creation succeeds: SettlementPayment.${pay}.status == ISSUED"
            - "Second creation with the same version: error_id == ERR_STALE_REPORT_VERSION"
            - "HTTP status == 412 for the second request"

      - name: clock_default_is_fixed_epoch
        claim_type: scheduled_actions
        grounds: ['endpoints["POST /_clock/set_current_utc"]']
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z (never wall-clock): the first entity created on an empty DB has created_at == 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty DB; clock never set"]
          setup_api_calls: []
          trigger:
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
          assert:
            - "Station.${stn}.created_at == 2026-08-01T00:00:00Z"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ['state_machines.IrregularityReport.TRACING_to_FOUND_PENDING_DELIVERY']
        excluded_because:
          difficulty_instance: located_event_three_hop_cascade
          rationale: "The 3-hop LOCATED cascade (report -> bag -> station counter) is asserted hop-by-hop in the named difficulty instance."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: ['calculations.liability_cap', 'calculations.expense_reimbursement']
        excluded_because:
          difficulty_instance: liability_cap_montreal_vs_domestic_weight
          rationale: "Both variant pairs (liability cap and expense reimbursement) are asserted with divergent literals in the named difficulty instances."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: create_response_reflects_computed_state_immediately
        claim_type: immediate_consistency
        grounds: ['complexity_profile.consistency_model', 'entities.IrregularityReport']
        distinguishing_aspect: "Immediate consistency: the POST /baggage/reports creation response itself carries the post-cascade state (status TRACING, liability_regime, effective_cap_cents) without a follow-up GET."
        test_recipe:
          setup: ["station JFK; carrier AA; passenger; domestic 20kg bag"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234691", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00191", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id, st: $.data.status, cap: $.data.effective_cap_cents } }
          assert:
            - "Creation response data.status == TRACING"
            - "Creation response data.effective_cap_cents == 50000"
            - "Creation response data.liability_regime == DOMESTIC"
            - "Creation response data.version == 1"
