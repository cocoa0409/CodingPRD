            - { call: "POST /machine-resources", payload: { resource_code: "B-G", resource_type: INSPECTION_BOOTH, cleanliness_grade: MEDICAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
