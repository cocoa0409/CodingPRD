            - "an empty X-User-Id header returns HTTP 401 with ${e2} == ERR_UNAUTHENTICATED even though the role is a real one"
            - "the undeclared role name TravelDesk returns HTTP 401 with ${e3} == ERR_UNAUTHENTICATED, not 403: priority 1 fires before priority 2 can look at the endpoint's role list"
            - "the declared-but-not-permitted SecurityAnalyst returns HTTP 403 with ${e4} == ERR_UNAUTHORIZED_ROLE"
