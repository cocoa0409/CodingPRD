  # ------------------------------------------------------------------ RULE 6
  - rule_id: boundary_precision_check
    instances:
      - name: storage_capacity_exact_fit_then_one_over
        grounds:
          - calculations.order_capacity_gate
          - calculations.home_assessment_evaluation
          - entities.Patient.fields.storage_cap_units
        distinguishing_aspect: |
          Metric: storage units. The gate is inclusive (<=): exactly 100 units against cap 100 submits
          cleanly (twice, in two months), while 101 units is rejected — the boundary sits exactly at
          on_hand + total == cap, via POST /api/supply-orders/{id}/submit.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient with sqft 25 assessment (cap min(400, floor(25*4)) == 100), tpw 7 x 6 units (allowance 168), on_hand 0"
          setup_api_calls:
