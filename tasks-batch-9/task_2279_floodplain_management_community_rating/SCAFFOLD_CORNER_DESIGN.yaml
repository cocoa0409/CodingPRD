          - entities.DevelopmentPermit.fields.revision_round
        distinguishing_aspect: |
          A newly filed application is DRAFT with revision_round 0 and every determination
          snapshot still null (determined_zone, determined_bfe_ft, freeboard_applied_ft,
          required_lowest_floor_elevation_ft, si_determination_case_id) — the requirement is
          computed at submit, not at creation.
        test_recipe:
          setup:
            - "Canonical base fixture through the structure."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
