  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_blocked_by_customer_credit_hold
        grounds:
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
          - entities.CustomerAccount.fields.credit_status
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Entity pair SalesOrder -> CustomerAccount: the confirm transition's
          legality is gated by the customer's credit_status; HOLD blocks with
          ERR_CUSTOMER_CREDIT_HOLD and flipping the customer back to GOOD
          unblocks the identical request without touching the order.
        test_recipe:
          setup:
            - "Customer credit_status patched to HOLD; order DRAFT with one line qty 1 (total 10000)"
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "MTR-5HP", description: "Motor 5HP", family: "BEARING", list_price_cents: 10000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "MIA-13", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Sunshine Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "PATCH /motion/customers/${c_id}"
              payload: { credit_status: "HOLD" }
              as: ContractAdministrator
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1 }
              as: CounterSalesRep
          trigger:
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
              captures: { err: $.data.error_id }
            - call: "PATCH /motion/customers/${c_id}"
              payload: { credit_status: "GOOD" }
              as: ContractAdministrator
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
          assert:
            - "First confirm: err == ERR_CUSTOMER_CREDIT_HOLD (HTTP 402); order stays DRAFT"
            - "After customer returns to GOOD, the identical confirm succeeds: fulfillment_status == CONFIRMED, total_cents == 10000"

      - name: referral_requires_misapplication_verdict
        grounds:
          - state_machines.ServiceReferral
          - state_machines.WarrantyClaim.UNDER_ANALYSIS_to_DENIED
          - calculations.referral_shop_selector
          - errors[ERR_REFERRAL_VERDICT_NOT_MISAPPLICATION]
        distinguishing_aspect: |
          Entity pair ServiceReferral -> WarrantyClaim (different pair than
