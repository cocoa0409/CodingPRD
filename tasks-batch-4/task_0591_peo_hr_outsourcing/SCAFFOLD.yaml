scenario: "591. Professional Employer Organization (PEO) / HR Outsourcing (TriNet/Justworks style): client co-employment & onboarding, multi-client payroll & tax (master EIN), benefits pooling & open enrollment, workers-comp master policy & class, compliance (ACA/EEO) & filings, employee self-service, HR ticket/advisory, client invoice (admin + pass-through)"
domain_name: "peo-hr-outsourcing"
api_prefix: "/"
# Multi-root API: /clients, /worksite-employees, /onboarding-packets, /wc-policies, /benefit-plans,
# /benefit-enrollments, /payroll-runs, /tax-filings, /compliance-filings, /client-invoices,
# /hr-tickets, plus the /_clock test-driving namespace.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: graph
  # graph: WorksiteEmployee x BenefitPlan junction (BenefitEnrollment); PayrollRun belongs to a
  # ClientCompany but is also aggregated cross-tenant by a master-EIN TaxFiling; WorksiteEmployee
  # references a WcClassCode owned by the PEO-level WorkersCompPolicy, not by its own client.
  state_machine_shape: parallel
  # PayrollRun carries two independent dimensions (processing_status x funding_status);
  # OnboardingPacket and HrTicket are cyclic; ClientCompany is cyclic (ACTIVE<->SUSPENDED).
  relationship_patterns:
    - one_to_many          # ClientCompany -> WorksiteEmployee, PayrollRun -> PayrollLine
    - many_to_many         # WorksiteEmployee <-> BenefitPlan via BenefitEnrollment
    - cross_aggregate      # TaxFiling aggregates PayrollRuns of every client under one master EIN
  role_model: segregation_of_duties
  # The operator who calculates a PayrollRun may not be the operator who approves it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ClientCompany
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the co-employment client.
      - name: fein
        type: string
        source: input
        description: Client's own Federal EIN. Unique across all ClientCompany rows.
        constraints: "unique; format NN-NNNNNNN"
      - name: state_code
        type: string
        source: input
        description: Two-letter worksite state code.
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum outstanding_balance_cents the client may carry before further payroll approvals are blocked.
        default: 5000000
        constraints: ">= 0"
      - name: wc_experience_mod
        type: number
        source: input
        description: Workers-comp experience modification factor applied to every class-code base rate for this client.
        default: 1.0
        constraints: "0.5 <= wc_experience_mod <= 2.0"
      - name: part_time_monthly_hours_total
        type: number
        source: input
        description: Aggregate monthly hours the client reports for part-time worksite staff; feeds the ACA FTE computation.
        default: 0
        constraints: ">= 0"
      - name: service_agreement_signed
        type: boolean
        source: input
        description: Whether the co-employment service agreement has been executed. Required to activate.
        default: false
      - name: status
        type: enum
        source: system
        description: Co-employment lifecycle state.
        default: PROSPECT
        constraints: "PROSPECT | ACTIVE | SUSPENDED"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Derived ledger: SUM(ClientInvoice.total_cents - ClientInvoice.amount_paid_cents) over invoices of this client with status IN {ISSUED, PARTIALLY_PAID}."
        default: 0
      - name: delinquency_strikes
        type: integer
        source: computed
        description: Count of payroll debit returns charged against this client. Reset to 0 when the client returns to ACTIVE.
        default: 0
      - name: active_employee_count
        type: integer
        source: computed
        description: COUNT(WorksiteEmployee WHERE client_id = this.id AND status = ACTIVE).
        default: 0
      - name: fte_count
        type: integer
        source: computed
        description: ACA full-time-equivalent count. See calculations.aca_fte_count.
        default: 0
      - name: is_ale
        type: boolean
        source: computed
        description: True when fte_count >= 50 (Applicable Large Employer).
        default: false

  - name: WorksiteEmployee
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientCompany.id; the co-employer of record for this worksite employee."
      - name: wc_class_code_id
        type: string
        source: input
        description: "FK -> WcClassCode.id; workers-comp class the employee's duties fall under."
      - name: first_name
        type: string
        source: input
        description: Given name.
      - name: last_name
        type: string
        source: input
        description: Family name.
      - name: ssn_last4
        type: string
        source: input
        description: Last four digits of the SSN, used for self-service identification.
        constraints: "exactly 4 digits"
      - name: birth_year
        type: integer
        source: input
        description: Birth year; drives the age band used by AGE_BANDED benefit rating.
        constraints: "1930 <= birth_year <= 2010"
      - name: hire_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) of the co-employment start.
      - name: employment_type
        type: enum
        source: input
        description: Full-time employees count 1.0 toward ACA FTE; part-time employees do not (client reports their hours in aggregate).
        default: FULL_TIME
        constraints: "FULL_TIME | PART_TIME"
      - name: annual_salary_cents
        type: integer
        source: input
        description: Annual base salary in cents. Semi-monthly base wages = round_half_up(annual_salary_cents / 24).
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Employment lifecycle state.
        default: PENDING_ONBOARDING
        constraints: "PENDING_ONBOARDING | ACTIVE | TERMINATED"
      - name: termination_date
        type: string
        source: system
        description: ISO date the employee was terminated; null while employed.
        default: null
      - name: benefits_eligible
        type: boolean
        source: computed
        description: "True when status = ACTIVE AND current clock date >= hire_date + BENEFIT_WAITING_PERIOD_DAYS (30)."
        default: false
      - name: ytd_taxable_wages_cents
        type: integer
        source: computed
        description: Year-to-date taxable wages from PayrollLines of this employee's APPROVED or PAID runs. See calculations.employee_ytd_accumulators.
        default: 0
      - name: ytd_ss_taxable_cents
        type: integer
        source: computed
        description: Year-to-date wages already subjected to Social Security tax (capped by SS_WAGE_BASE_CENTS).
        default: 0
      - name: ytd_futa_taxable_cents
        type: integer
        source: computed
        description: Year-to-date wages already subjected to FUTA (capped by FUTA_WAGE_BASE_CENTS).
        default: 0

  - name: OnboardingPacket
    parent: WorksiteEmployee
    common_fields: true
    fields:
      - name: worksite_employee_id
        type: string
        source: input
        description: "FK -> WorksiteEmployee.id; the employee whose co-employment paperwork this packet carries."
      - name: i9_completed
        type: boolean
        source: input
        description: Form I-9 employment-eligibility verification completed.
        default: false
      - name: w4_completed
        type: boolean
        source: input
        description: Form W-4 withholding election completed.
        default: false
      - name: direct_deposit_completed
        type: boolean
        source: input
        description: Direct-deposit authorization completed.
        default: false
      - name: status
        type: enum
        source: system
        description: Packet review lifecycle. RETURNED packets may be corrected and re-submitted (cycle).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | RETURNED | VOIDED"
      - name: revision_rounds
        type: integer
        source: computed
        description: Number of times this packet has been RETURNED for correction. A fourth submission is rejected.
        default: 0
      - name: reviewer_note
        type: string
        source: input
        description: Note recorded by the PEO reviewer on the review decision.
        default: null

  - name: WorkersCompPolicy
    parent: null
    common_fields: true
    fields:
      - name: master_policy_number
        type: string
        source: input
        description: PEO master workers-comp policy number covering every client.
        constraints: unique
      - name: carrier_name
        type: string
        source: input
        description: Insurance carrier writing the master policy.
      - name: policy_year
        type: integer
        source: input
        description: Calendar year the master policy covers.
      - name: master_ein
        type: string
        source: input
        description: PEO master EIN under which all client payroll is reported.
      - name: payroll_cap_cents
        type: integer
        source: input
        description: Per-employee, per-run payroll ceiling used by the AUDITED workers-comp premium variant.
        default: 15000000
        constraints: "> 0"

  - name: WcClassCode
    parent: WorkersCompPolicy
    common_fields: false
    fields:
      - name: wc_policy_id
        type: string
        source: input
        description: "FK -> WorkersCompPolicy.id; the master policy this class code belongs to."
      - name: class_code
        type: string
        source: input
        description: NCCI class code (e.g. "8810").
      - name: description
        type: string
        source: input
        description: Human description of the covered duties.
      - name: base_rate_per_100_cents
        type: integer
        source: input
        description: Premium cents charged per $100 (10000 cents) of covered payroll, before the client's experience mod.
        constraints: "> 0"
      - name: hazard_tier
        type: enum
        source: input
        description: Hazard grouping of the class.
        default: LOW
        constraints: "LOW | MEDIUM | HIGH"

  - name: BenefitPlan
    parent: null
    common_fields: true
    fields:
      - name: carrier_name
        type: string
        source: input
        description: Carrier underwriting the pooled plan.
      - name: plan_type
        type: enum
        source: input
        description: Coverage line. Overlap of coverage windows is checked per (employee, plan_type).
        constraints: "MEDICAL | DENTAL | VISION"
      - name: plan_year
        type: integer
        source: input
        description: Plan year the pooled rates apply to; also the year used for age-band computation.
      - name: rating_method
        type: enum
        source: input
        description: Rating algorithm the pool uses when an enrollment is priced.
        default: COMPOSITE
        constraints: "COMPOSITE | AGE_BANDED"
      - name: composite_rate_cents
        type: integer
        source: input
        description: Flat monthly premium per enrollee under COMPOSITE rating.
        constraints: "> 0"
      - name: age_band_base_rate_cents
        type: integer
        source: input
        description: Monthly base premium multiplied by the enrollee's age-band factor under AGE_BANDED rating.
        constraints: "> 0"
      - name: employer_contribution_pct
        type: number
        source: input
        description: Share of the monthly premium the client pays; the remainder is the employee's pre-tax payroll deduction.
        default: 0.60
        constraints: "0 <= employer_contribution_pct <= 1"
      - name: pool_capacity
        type: integer
        source: input
        description: Maximum number of concurrently occupied seats (enrollments with status IN {PENDING, ACTIVE}) in the pool.
        constraints: "> 0"
      - name: participation_minimum_count
        type: integer
        source: input
        description: Carrier's minimum seat count; below it the pool is AT_RISK.
        constraints: ">= 1"
      - name: enrolled_count
        type: integer
        source: computed
        description: "COUNT(BenefitEnrollment WHERE benefit_plan_id = this.id AND status IN {PENDING, ACTIVE})."
        default: 0
      - name: pool_status
        type: enum
        source: computed
        description: Derived from enrolled_count. See calculations.benefit_pool_status.
        default: FORMING
        constraints: "FORMING | AT_RISK | ACTIVE | FULL"

  - name: OpenEnrollmentWindow
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientCompany.id; the client whose employees may enroll during this window."
      - name: plan_year
        type: integer
        source: input
        description: Plan year the window opens enrollment for.
      - name: open_date
        type: string
        source: input
        description: ISO date the window opens (inclusive).
      - name: close_date
        type: string
        source: input
        description: ISO date the window closes (inclusive).
        constraints: "close_date >= open_date"
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED when clock date < open_date; OPEN when open_date <= clock date <= close_date; CLOSED when clock date > close_date."
        default: SCHEDULED
        constraints: "SCHEDULED | OPEN | CLOSED"

  - name: BenefitEnrollment
    parent: WorksiteEmployee
    common_fields: true
    fields:
      - name: worksite_employee_id
        type: string
        source: input
        description: "FK -> WorksiteEmployee.id; the enrollee."
      - name: benefit_plan_id
        type: string
        source: input
        description: "FK -> BenefitPlan.id; the pooled plan seat being occupied."
      - name: plan_type
        type: enum
        source: system
        description: Snapshot of BenefitPlan.plan_type at enrollment; the coverage-overlap check keys on (worksite_employee_id, plan_type).
        constraints: "MEDICAL | DENTAL | VISION"
      - name: coverage_start_date
        type: string
        source: input
        description: ISO date coverage begins (inclusive).
      - name: coverage_end_date
        type: string
        source: input
        description: ISO date coverage ends (EXCLUSIVE). Null means open-ended; treated as 9999-12-31 by the overlap check.
        default: null
      - name: monthly_premium_cents
        type: integer
        source: computed
        description: Monthly premium priced at creation under the plan's rating_method. See calculations.benefit_premium_rating.
        default: 0
      - name: employer_share_cents
        type: integer
        source: computed
        description: round_half_up(monthly_premium_cents * BenefitPlan.employer_contribution_pct).
        default: 0
      - name: employee_share_cents
        type: integer
        source: computed
        description: monthly_premium_cents - employer_share_cents; halved to form the semi-monthly pre-tax payroll deduction.
        default: 0
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle.
        default: PENDING
        constraints: "PENDING | ACTIVE | CANCELLED | TERMINATED"

  - name: PayrollRun
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientCompany.id; the client whose worksite employees this run pays."
      - name: period_start
        type: string
        source: input
        description: ISO date, first day of the pay period (INCLUSIVE).
      - name: period_end
        type: string
        source: input
        description: ISO date, last day of the pay period (INCLUSIVE). Pay periods of one client are closed intervals and may not touch.
        constraints: "period_end >= period_start"
      - name: check_date
        type: string
        source: input
        description: ISO date wages are paid; drives CASH-basis quarter assignment and YTD ordering.
        constraints: "check_date >= period_end"
      - name: pay_frequency
        type: enum
        source: input
        description: Only SEMI_MONTHLY is supported; base wages = round_half_up(annual_salary_cents / 24).
        default: SEMI_MONTHLY
        constraints: "SEMI_MONTHLY"
      - name: processing_status
        type: enum
        source: system
        description: Processing dimension of the run (independent of funding_status).
        default: DRAFT
        constraints: "DRAFT | CALCULATED | APPROVED | PAID"
      - name: funding_status
        type: enum
        source: system
        description: Funding dimension of the run (independent of processing_status).
        default: UNFUNDED
        constraints: "UNFUNDED | DEBIT_PENDING | FUNDED | FAILED"
      - name: total_gross_wages_cents
        type: integer
        source: computed
        description: SUM(PayrollLine.gross_wages_cents) over this run's lines.
        default: 0
      - name: total_taxable_wages_cents
        type: integer
        source: computed
        description: SUM(PayrollLine.taxable_wages_cents) over this run's lines.
        default: 0
      - name: total_employee_tax_cents
        type: integer
        source: computed
        description: SUM(PayrollLine.employee_tax_total_cents) over this run's lines (per-line rounding, then sum).
        default: 0
      - name: total_employer_tax_cents
        type: integer
        source: computed
        description: SUM(PayrollLine.employer_tax_total_cents) over this run's lines (per-line rounding, then sum).
        default: 0
      - name: total_benefit_deduction_cents
        type: integer
        source: computed
        description: SUM(PayrollLine.pretax_benefit_deduction_cents) over this run's lines.
        default: 0
      - name: total_wc_premium_estimated_cents
        type: integer
        source: computed
        description: SUM(PayrollLine.wc_premium_estimated_cents) over this run's lines (ESTIMATED workers-comp variant).
        default: 0
      - name: calculated_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator whose calculate call produced the current lines.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who approved the run. Must differ from calculated_by_user_id.
        default: null

  - name: PayrollLine
    parent: PayrollRun
    common_fields: false
    fields:
      - name: payroll_run_id
        type: string
        source: system
        description: "FK -> PayrollRun.id; the run that generated this line."
      - name: worksite_employee_id
        type: string
        source: system
        description: "FK -> WorksiteEmployee.id; the paid employee."
      - name: base_wages_cents
        type: integer
        source: computed
        description: round_half_up(WorksiteEmployee.annual_salary_cents / 24).
      - name: overtime_premium_cents
        type: integer
        source: computed
        description: Overtime premium supplied on the calculate call for this employee; 0 when absent. Excluded from the AUDITED workers-comp payroll base.
        default: 0
      - name: gross_wages_cents
        type: integer
        source: computed
        description: base_wages_cents + overtime_premium_cents.
      - name: pretax_benefit_deduction_cents
        type: integer
        source: computed
        description: Employee pre-tax benefit deduction for this period. See calculations.payroll_line_taxes.
        default: 0
      - name: taxable_wages_cents
        type: integer
        source: computed
        description: gross_wages_cents - pretax_benefit_deduction_cents.
      - name: employee_ss_tax_cents
        type: integer
        source: computed
        description: Social Security withheld, capped by the SS wage base against the employee's YTD.
      - name: employee_medicare_tax_cents
        type: integer
        source: computed
        description: Medicare withheld.
      - name: employee_addl_medicare_tax_cents
        type: integer
        source: computed
        description: Additional Medicare withheld on YTD taxable wages above ADDL_MEDICARE_THRESHOLD_CENTS.
        default: 0
      - name: employee_income_tax_cents
        type: integer
        source: computed
        description: Flat federal income tax withheld.
      - name: employee_tax_total_cents
        type: integer
        source: computed
        description: Sum of the four employee tax components on this line.
      - name: employer_ss_tax_cents
        type: integer
        source: computed
        description: Employer Social Security match.
      - name: employer_medicare_tax_cents
        type: integer
        source: computed
        description: Employer Medicare match.
      - name: employer_futa_tax_cents
        type: integer
        source: computed
        description: FUTA, capped by the FUTA wage base against the employee's YTD.
      - name: employer_tax_total_cents
        type: integer
        source: computed
        description: Sum of the three employer tax components on this line.
      - name: wc_premium_estimated_cents
        type: integer
        source: computed
        description: ESTIMATED workers-comp premium for this line. See calculations.wc_premium (variant ESTIMATED).
      - name: net_pay_cents
        type: integer
        source: computed
        description: gross_wages_cents - pretax_benefit_deduction_cents - employee_tax_total_cents.

  - name: TaxFiling
    parent: null
    common_fields: true
    fields:
      - name: master_ein
        type: string
        source: system
        description: Master EIN copied from the single WorkersCompPolicy in force; all clients report under it.
      - name: year
        type: integer
        source: input
        description: Calendar year of the filing.
      - name: quarter
        type: integer
        source: input
        description: Calendar quarter of the filing.
        constraints: "1 | 2 | 3 | 4"
      - name: basis
        type: enum
        source: input
        description: Quarter-assignment algorithm. CASH keys on PayrollRun.check_date; ACCRUAL keys on PayrollRun.period_end.
        default: CASH
        constraints: "CASH | ACCRUAL"
      - name: aggregated_run_count
        type: integer
        source: computed
        description: Number of PayrollRuns aggregated into this filing at creation.
        default: 0
      - name: total_taxable_wages_cents
        type: integer
        source: computed
        description: SUM(PayrollRun.total_taxable_wages_cents) over aggregated runs, across every client.
        default: 0
      - name: total_employee_tax_cents
        type: integer
        source: computed
        description: SUM(PayrollRun.total_employee_tax_cents) over aggregated runs.
        default: 0
      - name: total_employer_tax_cents
        type: integer
        source: computed
        description: SUM(PayrollRun.total_employer_tax_cents) over aggregated runs.
        default: 0
      - name: status
        type: enum
        source: system
        description: Filing lifecycle.
        default: DRAFT
        constraints: "DRAFT | FILED"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp the filing was submitted to the tax authority.
        default: null

  - name: ComplianceFiling
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientCompany.id; the client the filing reports on."
      - name: filing_type
        type: enum
        source: input
        description: ACA_1095C requires the client to be an ALE; EEO1 requires fte_count >= EEO1_FTE_THRESHOLD.
        constraints: "ACA_1095C | EEO1"
      - name: plan_year
        type: integer
        source: input
        description: Reporting year.
      - name: fte_count
        type: integer
        source: computed
        description: Snapshot of ClientCompany.fte_count at creation.
      - name: is_ale
        type: boolean
        source: computed
        description: Snapshot of ClientCompany.is_ale at creation.
      - name: active_employee_count
        type: integer
        source: computed
        description: Snapshot of ClientCompany.active_employee_count at creation.
      - name: status
        type: enum
        source: system
        description: Filing lifecycle.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of submission.
        default: null

  - name: HrTicket
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> ClientCompany.id; the client raising the advisory request."
      - name: worksite_employee_id
        type: string
        source: input
        description: "FK -> WorksiteEmployee.id; the employee the ticket concerns. Null for company-level advisory."
        default: null
      - name: category
        type: enum
        source: input
        description: Advisory category.
        constraints: "TERMINATION_ADVICE | LEAVE | HARASSMENT | BENEFITS | OTHER"
      - name: subject
        type: string
        source: input
        description: Short subject line.
      - name: body
        type: string
        source: input
        description: Full description of the request.
      - name: priority
        type: enum
        source: input
        description: Requested priority. ESCALATE forces it to HIGH.
        default: NORMAL
        constraints: "LOW | NORMAL | HIGH"
      - name: status
        type: enum
        source: system
        description: Ticket lifecycle; AWAITING_CLIENT and RESOLVED can both loop back to IN_PROGRESS.
        default: OPEN
        constraints: "OPEN | IN_PROGRESS | AWAITING_CLIENT | ESCALATED | RESOLVED | CLOSED"
      - name: assigned_advisor_user_id
        type: string
        source: system
        description: X-User-ID of the HrAdvisor who took the ticket.
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times the ticket has been reopened from RESOLVED. A third reopen is rejected.
        default: 0

  - name: ClientInvoice
    parent: ClientCompany
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: system
        description: "FK -> ClientCompany.id; the invoiced client."
      - name: payroll_run_id
        type: string
        source: system
        description: "FK -> PayrollRun.id; the approved run this invoice bills."
      - name: invoice_number
        type: string
        source: system
        description: Human-readable invoice number minted at issue.
      - name: admin_fee_cents
        type: integer
        source: computed
        description: PEO administrative fee. See calculations.admin_fee.
      - name: pass_through_total_cents
        type: integer
        source: computed
        description: Sum of the four PASS_THROUGH InvoiceLine amounts (gross wages, employer tax, benefit premium, workers-comp).
      - name: total_cents
        type: integer
        source: computed
        description: admin_fee_cents + pass_through_total_cents; equal to SUM(InvoiceLine.amount_cents).
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Cumulative payments applied to this invoice.
        default: 0
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle. Issued directly on payroll approval.
        default: ISSUED
        constraints: "ISSUED | PARTIALLY_PAID | PAID | VOID"

  - name: InvoiceLine
    parent: ClientInvoice
    common_fields: false
    fields:
      - name: client_invoice_id
        type: string
        source: system
        description: "FK -> ClientInvoice.id; the invoice this line belongs to."
      - name: line_type
        type: enum
        source: system
        description: Exactly these five lines are emitted for every invoice, in this order, even when the amount is 0.
        constraints: "ADMIN_FEE | PASS_THROUGH_GROSS_WAGES | PASS_THROUGH_EMPLOYER_TAX | PASS_THROUGH_BENEFIT_PREMIUM | PASS_THROUGH_WC_PREMIUM"
      - name: description
        type: string
        source: system
        description: Line description.
      - name: amount_cents
        type: integer
        source: computed
        description: Line amount in cents.
state_machines:
  - entity: ClientCompany
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /clients/{id}/activate"
        actor: PeoAdmin
        preconditions:
          - "ClientCompany.status == PROSPECT"
          - "ClientCompany.service_agreement_signed == true"
        side_effects:
          - "status = ACTIVE"
          - "increments ClientCompany.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: a payroll debit return pushes delinquency_strikes to SUSPENSION_STRIKE_THRESHOLD (2) — cascade link 3 of POST /payroll-runs/{id}/funding-events with outcome RETURNED"
        actor: system
        preconditions:
          - "ClientCompany.status == ACTIVE"
          - "ClientCompany.delinquency_strikes >= 2 after the increment"
        side_effects:
          - "status = SUSPENDED"
          - "increments ClientCompany.version by 1"
        note: "While SUSPENDED the client may not create payroll runs, worksite employees, onboarding packets or benefit enrollments (ERR_CLIENT_NOT_ACTIVE)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: ClientCompany.outstanding_balance_cents reaches 0 after POST /client-invoices/{id}/payments or POST /client-invoices/{id}/void"
        actor: system
        preconditions:
          - "ClientCompany.status == SUSPENDED"
          - "ClientCompany.outstanding_balance_cents == 0 after the ledger recompute"
        side_effects:
          - "status = ACTIVE"
          - "delinquency_strikes = 0"
          - "increments ClientCompany.version by 1"

  - entity: WorksiteEmployee
    initial_state: PENDING_ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ONBOARDING
        to: ACTIVE
        trigger: "system: the employee's OnboardingPacket is APPROVED by POST /onboarding-packets/{id}/review with decision APPROVE"
        actor: system
        preconditions:
          - "OnboardingPacket.status transitions to APPROVED"
        side_effects:
          - "status = ACTIVE"
          - "ClientCompany.active_employee_count, fte_count and is_ale are recomputed"
          - "increments WorksiteEmployee.version by 1"
      - from: PENDING_ONBOARDING
        to: TERMINATED
        trigger: "POST /worksite-employees/{id}/terminate"
        actor: ClientAdmin
        preconditions:
          - "WorksiteEmployee.status != TERMINATED"
        side_effects:
          - "status = TERMINATED; termination_date = current clock date"
          - "any OnboardingPacket of this employee in status IN {DRAFT, SUBMITTED, RETURNED} becomes VOIDED"
          - "increments WorksiteEmployee.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /worksite-employees/{id}/terminate"
        actor: ClientAdmin
        preconditions:
          - "WorksiteEmployee.status != TERMINATED"
        side_effects:
          - "CASCADE L1: status = TERMINATED; termination_date = current clock date"
          - "CASCADE L2 (caused by L1): every BenefitEnrollment of this employee with status PENDING becomes CANCELLED, and every one with status ACTIVE becomes TERMINATED with coverage_end_date set to the first day of the month following the current clock date (exclusive end)"
          - "CASCADE L3 (caused by L2): for each BenefitPlan that lost a seat, BenefitPlan.enrolled_count is recomputed as COUNT(BenefitEnrollment WHERE benefit_plan_id = plan.id AND status IN {PENDING, ACTIVE})"
          - "CASCADE L4 (caused by L3): BenefitPlan.pool_status is re-derived from the new enrolled_count per calculations.benefit_pool_status (FULL -> ACTIVE, ACTIVE -> AT_RISK, or AT_RISK -> FORMING)"
          - "ClientCompany.active_employee_count, fte_count and is_ale are recomputed"
          - "increments WorksiteEmployee.version by 1"

  - entity: OnboardingPacket
    initial_state: DRAFT
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /onboarding-packets/{id}/submit"
        actor: ClientAdmin
        preconditions:
          - "OnboardingPacket.status IN {DRAFT, RETURNED}"
          - "i9_completed == true AND w4_completed == true AND direct_deposit_completed == true"
          - "revision_rounds <= MAX_PACKET_REVISION_ROUNDS (3)"
        side_effects:
          - "status = SUBMITTED"
          - "increments OnboardingPacket.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /onboarding-packets/{id}/review with decision APPROVE"
        actor: PeoAdmin
        preconditions:
          - "OnboardingPacket.status == SUBMITTED"
        side_effects:
          - "status = APPROVED; reviewer_note stored"
          - "the packet's WorksiteEmployee transitions PENDING_ONBOARDING -> ACTIVE (bubble-up)"
          - "increments OnboardingPacket.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /onboarding-packets/{id}/review with decision RETURN"
        actor: PeoAdmin
        preconditions:
          - "OnboardingPacket.status == SUBMITTED"
        side_effects:
          - "status = RETURNED; revision_rounds = revision_rounds + 1; reviewer_note stored"
          - "increments OnboardingPacket.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /onboarding-packets/{id}/submit (correction round — cycle back into review)"
        actor: ClientAdmin
        preconditions:
          - "OnboardingPacket.status == RETURNED"
          - "revision_rounds <= MAX_PACKET_REVISION_ROUNDS (3); a submit attempted while revision_rounds >= 3 is rejected with ERR_PACKET_REVISION_LIMIT"
        side_effects:
          - "status = SUBMITTED"
          - "increments OnboardingPacket.version by 1"
      - from: RETURNED
        to: VOIDED
        trigger: "system: a new OnboardingPacket is created for the same WorksiteEmployee via POST /worksite-employees/{id}/onboarding-packet (supersede), or the employee is terminated"
        actor: system
        preconditions:
          - "OnboardingPacket.status IN {DRAFT, SUBMITTED, RETURNED}"
        side_effects:
          - "status = VOIDED"
          - "increments OnboardingPacket.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system: a new OnboardingPacket is created for the same WorksiteEmployee via POST /worksite-employees/{id}/onboarding-packet (supersede), or the employee is terminated"
        actor: system
        preconditions:
          - "OnboardingPacket.status IN {DRAFT, SUBMITTED, RETURNED}"
        side_effects:
          - "status = VOIDED"
          - "increments OnboardingPacket.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: a new OnboardingPacket is created for the same WorksiteEmployee via POST /worksite-employees/{id}/onboarding-packet (supersede), or the employee is terminated"
        actor: system
        preconditions:
          - "OnboardingPacket.status IN {DRAFT, SUBMITTED, RETURNED}"
        side_effects:
          - "status = VOIDED"
          - "increments OnboardingPacket.version by 1"

  - entity: BenefitEnrollment
    initial_state: PENDING
    terminal_states: [CANCELLED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: the logical clock advances (POST /_clock/set_current_utc) to a date >= coverage_start_date"
        actor: system
        preconditions:
          - "BenefitEnrollment.status == PENDING"
          - "current clock date >= coverage_start_date"
        side_effects:
          - "status = ACTIVE"
          - "BenefitPlan.enrolled_count is unchanged (PENDING and ACTIVE both occupy a seat); BenefitPlan.pool_status unchanged"
          - "increments BenefitEnrollment.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /benefit-enrollments/{id}/cancel, or system cascade from POST /worksite-employees/{id}/terminate"
        actor: ClientAdmin
        preconditions:
          - "BenefitEnrollment.status == PENDING"
        side_effects:
          - "status = CANCELLED"
          - "BenefitPlan.enrolled_count is recomputed as COUNT(BenefitEnrollment WHERE benefit_plan_id = plan.id AND status IN {PENDING, ACTIVE}) — the seat is released"
          - "BenefitPlan.pool_status is re-derived per calculations.benefit_pool_status"
          - "increments BenefitEnrollment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /benefit-enrollments/{id}/cancel, or system cascade from POST /worksite-employees/{id}/terminate"
        actor: ClientAdmin
        preconditions:
          - "BenefitEnrollment.status == ACTIVE"
        side_effects:
          - "status = TERMINATED; coverage_end_date = first day of the month following the current clock date (exclusive end)"
          - "BenefitPlan.enrolled_count is recomputed — the seat is released"
          - "BenefitPlan.pool_status is re-derived per calculations.benefit_pool_status"
          - "increments BenefitEnrollment.version by 1"

  - entity: PayrollRun
    dimension: processing_status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /payroll-runs/{id}/calculate"
        actor: PayrollSpecialist
        preconditions:
          - "PayrollRun.processing_status IN {DRAFT, CALCULATED}"
          - "ClientCompany.status == ACTIVE"
          - "the payable set (WorksiteEmployee of this client with status IN {PENDING_ONBOARDING, ACTIVE}, hire_date <= period_end, and termination_date null or >= period_start) is non-empty — otherwise ERR_NO_PAYABLE_EMPLOYEES"
          - "every employee in the payable set has an OnboardingPacket with status == APPROVED — otherwise ERR_ONBOARDING_INCOMPLETE"
        side_effects:
          - "all existing PayrollLine rows of this run are discarded and regenerated"
          - "one PayrollLine is created per payable employee per calculations.payroll_line_taxes and calculations.wc_premium (variant ESTIMATED)"
          - "PayrollRun totals (total_gross_wages_cents, total_taxable_wages_cents, total_employee_tax_cents, total_employer_tax_cents, total_benefit_deduction_cents, total_wc_premium_estimated_cents) are recomputed by summing the regenerated lines"
          - "calculated_by_user_id = X-User-ID of the caller"
          - "processing_status = CALCULATED"
          - "increments PayrollRun.version by 1"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /payroll-runs/{id}/calculate (recalculation with different overtime_entries)"
        actor: PayrollSpecialist
        preconditions:
          - "PayrollRun.processing_status == CALCULATED"
        side_effects:
          - "same side effects as DRAFT -> CALCULATED; calculated_by_user_id is overwritten with the recalculating operator"
          - "increments PayrollRun.version by 1"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /payroll-runs/{id}/approve"
        actor: PeoAdmin
        preconditions:
          - "PayrollRun.processing_status == CALCULATED"
          - "X-User-ID != PayrollRun.calculated_by_user_id — otherwise ERR_SEGREGATION_OF_DUTIES"
          - "ClientCompany.outstanding_balance_cents <= ClientCompany.credit_limit_cents — otherwise ERR_CREDIT_LIMIT_EXCEEDED"
        side_effects:
          - "CASCADE L1: processing_status = APPROVED; approved_by_user_id = X-User-ID"
          - "the ytd_taxable_wages_cents / ytd_ss_taxable_cents / ytd_futa_taxable_cents of every paid WorksiteEmployee are recomputed per calculations.employee_ytd_accumulators"
          - "CASCADE L2 (caused by L1): a ClientInvoice is created with status ISSUED for (client_id = run.client_id, payroll_run_id = run.id)"
          - "CASCADE L3 (caused by L2): the new invoice emits its five InvoiceLine rows — ADMIN_FEE (calculations.admin_fee), PASS_THROUGH_GROSS_WAGES, PASS_THROUGH_EMPLOYER_TAX, PASS_THROUGH_BENEFIT_PREMIUM, PASS_THROUGH_WC_PREMIUM (calculations.wc_premium variant AUDITED) — and ClientInvoice.admin_fee_cents / pass_through_total_cents / total_cents are set from them"
          - "CASCADE L4 (caused by L3): ClientCompany.outstanding_balance_cents is recomputed per calculations.client_outstanding_balance and therefore rises by the new invoice's total_cents"
          - "increments PayrollRun.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "system: PayrollRun.funding_status becomes FUNDED (POST /payroll-runs/{id}/funding-events with outcome SETTLED)"
        actor: system
        preconditions:
          - "PayrollRun.processing_status == APPROVED"
          - "PayrollRun.funding_status == FUNDED"
        side_effects:
          - "processing_status = PAID"
          - "increments PayrollRun.version by 1"
        note: "The two dimensions are independent: a run can be FUNDED only after it is APPROVED, but funding_status can move to DEBIT_PENDING/FAILED while processing_status is still APPROVED."

  - entity: PayrollRun
    dimension: funding_status
    initial_state: UNFUNDED
    terminal_states: [FUNDED]
    transitions:
      - from: UNFUNDED
        to: DEBIT_PENDING
        trigger: "POST /payroll-runs/{id}/fund"
        actor: PayrollSpecialist
        preconditions:
          - "PayrollRun.funding_status IN {UNFUNDED, FAILED}"
          - "PayrollRun.processing_status == APPROVED"
        side_effects:
          - "funding_status = DEBIT_PENDING"
          - "increments PayrollRun.version by 1"
      - from: DEBIT_PENDING
        to: FUNDED
        trigger: "POST /payroll-runs/{id}/funding-events with outcome SETTLED"
        actor: PeoAdmin
        preconditions:
          - "PayrollRun.funding_status == DEBIT_PENDING"
        side_effects:
          - "funding_status = FUNDED"
          - "the processing dimension advances APPROVED -> PAID (bubble across dimensions)"
          - "increments PayrollRun.version by 1"
      - from: DEBIT_PENDING
        to: FAILED
        trigger: "POST /payroll-runs/{id}/funding-events with outcome RETURNED"
        actor: PeoAdmin
        preconditions:
          - "PayrollRun.funding_status == DEBIT_PENDING"
        side_effects:
          - "CASCADE L1: funding_status = FAILED"
          - "CASCADE L2 (caused by L1): ClientCompany.delinquency_strikes = delinquency_strikes + 1"
          - "CASCADE L3 (caused by L2): if delinquency_strikes >= SUSPENSION_STRIKE_THRESHOLD (2) and ClientCompany.status == ACTIVE, the client transitions ACTIVE -> SUSPENDED"
          - "processing_status is untouched (stays APPROVED)"
          - "increments PayrollRun.version by 1"
      - from: FAILED
        to: DEBIT_PENDING
        trigger: "POST /payroll-runs/{id}/fund (re-debit after a returned draft — cycle)"
        actor: PayrollSpecialist
        preconditions:
          - "PayrollRun.funding_status == FAILED"
          - "PayrollRun.processing_status == APPROVED"
        side_effects:
          - "funding_status = DEBIT_PENDING"
          - "increments PayrollRun.version by 1"
        note: "Re-funding is allowed even while the client is SUSPENDED — funding an already-approved run is how a suspended client digs out."

  - entity: ClientInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /client-invoices/{id}/payments where amount_cents < total_cents - amount_paid_cents"
        actor: ClientAdmin
        preconditions:
          - "ClientInvoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "expected_invoice_version == ClientInvoice.version — otherwise ERR_STALE_INVOICE_VERSION"
          - "amount_cents <= total_cents - amount_paid_cents — otherwise ERR_OVERPAYMENT"
        side_effects:
          - "amount_paid_cents = amount_paid_cents + amount_cents; status = PARTIALLY_PAID"
          - "ClientCompany.outstanding_balance_cents is recomputed per calculations.client_outstanding_balance"
          - "increments ClientInvoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /client-invoices/{id}/payments where amount_cents == total_cents - amount_paid_cents"
        actor: ClientAdmin
        preconditions:
          - "ClientInvoice.status IN {ISSUED, PARTIALLY_PAID}"
          - "expected_invoice_version == ClientInvoice.version"
          - "amount_cents == total_cents - amount_paid_cents"
        side_effects:
          - "amount_paid_cents = total_cents; status = PAID"
          - "ClientCompany.outstanding_balance_cents is recomputed"
          - "if the client is SUSPENDED and the recomputed outstanding_balance_cents == 0, the client transitions SUSPENDED -> ACTIVE and delinquency_strikes resets to 0"
          - "increments ClientInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /client-invoices/{id}/payments with a further partial amount"
        actor: ClientAdmin
        preconditions:
          - "ClientInvoice.status == PARTIALLY_PAID"
          - "expected_invoice_version == ClientInvoice.version"
          - "amount_cents < total_cents - amount_paid_cents"
        side_effects:
          - "amount_paid_cents = amount_paid_cents + amount_cents"
          - "ClientCompany.outstanding_balance_cents is recomputed"
          - "increments ClientInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /client-invoices/{id}/payments settling the remainder"
        actor: ClientAdmin
        preconditions:
          - "ClientInvoice.status == PARTIALLY_PAID"
          - "expected_invoice_version == ClientInvoice.version"
          - "amount_cents == total_cents - amount_paid_cents"
        side_effects:
          - "amount_paid_cents = total_cents; status = PAID"
          - "ClientCompany.outstanding_balance_cents is recomputed"
          - "if the client is SUSPENDED and outstanding_balance_cents == 0, the client transitions SUSPENDED -> ACTIVE and delinquency_strikes resets to 0"
          - "increments ClientInvoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /client-invoices/{id}/void"
        actor: PeoAdmin
        preconditions:
          - "ClientInvoice.status IN {ISSUED, PARTIALLY_PAID}"
        side_effects:
          - "status = VOID (compensating action for the approve cascade)"
          - "ClientCompany.outstanding_balance_cents is recomputed per calculations.client_outstanding_balance; the voided invoice drops out of the sum, so the balance returns to exactly its pre-issue value when no payment had been applied"
          - "if the client is SUSPENDED and the recomputed outstanding_balance_cents == 0, the client transitions SUSPENDED -> ACTIVE and delinquency_strikes resets to 0"
          - "the underlying PayrollRun is NOT reverted — it keeps its processing_status and funding_status"
          - "increments ClientInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "POST /client-invoices/{id}/void"
        actor: PeoAdmin
        preconditions:
          - "ClientInvoice.status IN {ISSUED, PARTIALLY_PAID}"
        side_effects:
          - "status = VOID; amount_paid_cents is retained on the record"
          - "ClientCompany.outstanding_balance_cents is recomputed; the invoice's unpaid remainder drops out of the sum"
          - "increments ClientInvoice.version by 1"

  - entity: HrTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /hr-tickets/{id}/transition with action ASSIGN"
        actor: HrAdvisor
        preconditions:
          - "HrTicket.status == OPEN"
        side_effects:
          - "status = IN_PROGRESS; assigned_advisor_user_id = X-User-ID"
          - "increments HrTicket.version by 1"
      - from: IN_PROGRESS
        to: AWAITING_CLIENT
        trigger: "POST /hr-tickets/{id}/transition with action AWAIT_CLIENT"
        actor: HrAdvisor
        preconditions:
          - "HrTicket.status == IN_PROGRESS"
        side_effects:
          - "status = AWAITING_CLIENT"
          - "increments HrTicket.version by 1"
      - from: AWAITING_CLIENT
        to: IN_PROGRESS
        trigger: "POST /hr-tickets/{id}/transition with action CLIENT_REPLY (cycle back to the advisor)"
        actor: ClientAdmin
        preconditions:
          - "HrTicket.status == AWAITING_CLIENT"
        side_effects:
          - "status = IN_PROGRESS"
          - "increments HrTicket.version by 1"
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /hr-tickets/{id}/transition with action ESCALATE"
        actor: HrAdvisor
        preconditions:
          - "HrTicket.status == IN_PROGRESS"
        side_effects:
          - "status = ESCALATED; priority = HIGH"
          - "increments HrTicket.version by 1"
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /hr-tickets/{id}/transition with action DEESCALATE"
        actor: PeoAdmin
        preconditions:
          - "HrTicket.status == ESCALATED"
        side_effects:
          - "status = IN_PROGRESS"
          - "increments HrTicket.version by 1"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /hr-tickets/{id}/transition with action RESOLVE"
        actor: HrAdvisor
        preconditions:
          - "HrTicket.status IN {IN_PROGRESS, ESCALATED}"
        side_effects:
          - "status = RESOLVED"
          - "increments HrTicket.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /hr-tickets/{id}/transition with action RESOLVE"
        actor: HrAdvisor
        preconditions:
          - "HrTicket.status IN {IN_PROGRESS, ESCALATED}"
        side_effects:
          - "status = RESOLVED"
          - "increments HrTicket.version by 1"
      - from: RESOLVED
        to: IN_PROGRESS
        trigger: "POST /hr-tickets/{id}/transition with action REOPEN (cycle)"
        actor: ClientAdmin
        preconditions:
          - "HrTicket.status == RESOLVED"
          - "reopen_count < MAX_TICKET_REOPENS (2) — otherwise ERR_TICKET_REOPEN_LIMIT"
        side_effects:
          - "status = IN_PROGRESS; reopen_count = reopen_count + 1"
          - "increments HrTicket.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /hr-tickets/{id}/transition with action CLOSE"
        actor: HrAdvisor
        preconditions:
          - "HrTicket.status == RESOLVED"
        side_effects:
          - "status = CLOSED"
          - "increments HrTicket.version by 1"

  - entity: TaxFiling
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /tax-filings/{id}/file"
        actor: PeoAdmin
        preconditions:
          - "TaxFiling.status == DRAFT"
          - "every PayrollRun in the filing's derived member set — calculations.tax_filing_aggregate.included(filing.basis) re-evaluated with the filing's stored year and quarter — has processing_status == PAID; a member still sitting at APPROVED is rejected with ERR_RUNS_NOT_SETTLED"
        side_effects:
          - "status = FILED; filed_at = current logical clock time"
          - "increments TaxFiling.version by 1"

  - entity: ComplianceFiling
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-filings/{id}/submit"
        actor: PeoAdmin
        preconditions:
          - "ComplianceFiling.status == DRAFT"
        side_effects:
          - "status = SUBMITTED; submitted_at = current logical clock time"
          - "increments ComplianceFiling.version by 1"

concurrency_rules:
  - rule_id: packet-create-stale-employee
    parent_entity: WorksiteEmployee
    write_endpoint: "POST /worksite-employees/{id}/onboarding-packet"
    occ_field: "expected_employee_version"
    description: |
      Creating a new OnboardingPacket for a WorksiteEmployee whose version has advanced since the
      client last observed it is rejected. A fresh packet legitimately supersedes any non-terminal
      packet the employee already carries (the prior packet is VOIDED), so a repeat of the same
      create would itself succeed on the natural product semantics; the OCC check on
      WorksiteEmployee.version is what pins the writer's view of the employee to the one it read.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412

  - rule_id: invoice-payment-stale-invoice
    parent_entity: ClientInvoice
    write_endpoint: "POST /client-invoices/{id}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Applying a payment against a ClientInvoice whose version has advanced since the client last
      observed it is rejected. Payments are legitimately repeatable (partial payments accumulate),
      so a second identical apply would otherwise succeed and double-credit the invoice; the OCC
      check on ClientInvoice.version pins each payment to the balance the payer actually saw.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
calculations:
  - name: employee_ytd_accumulators
    trigger: "Recomputed for every paid WorksiteEmployee when a PayrollRun transitions CALCULATED -> APPROVED (POST /payroll-runs/{id}/approve); read (never written) by calculations.payroll_line_taxes."
    algorithm: aggregation
    formula: |
      # Derived, never incremented in place — always a full recompute from finalized lines.
      finalized_lines(e, before_check_date) =
        PayrollLine rows L WHERE L.worksite_employee_id = e.id
          AND L.payroll_run.processing_status IN {APPROVED, PAID}
          AND L.payroll_run.check_date < before_check_date          # strictly earlier check date
        ORDER BY L.payroll_run.check_date ASC, L.created_at ASC     # tie-break: created_at, never id

      ytd_taxable_wages_cents(e, d) = SUM(L.taxable_wages_cents for L in finalized_lines(e, d))
      ytd_ss_taxable_cents(e, d)    = SUM(min over the chronological walk of the SS wage base;
                                          i.e. the SS-taxable portion actually charged on each line)
      ytd_futa_taxable_cents(e, d)  = SUM(the FUTA-taxable portion actually charged on each line)

      # Stored on WorksiteEmployee with d = +infinity (all finalized lines).
    input_set: "PayrollLines whose PayrollRun.processing_status IN {APPROVED, PAID}. Lines of DRAFT or CALCULATED runs are excluded, so calculating a run never sees its own (not yet approved) lines."
    constants: {}
    precision: "integer cents; no rounding (sums of already-rounded line values)"

  - name: payroll_line_taxes
    trigger: "POST /payroll-runs/{id}/calculate — one execution per payable WorksiteEmployee, producing one PayrollLine."
    algorithm: threshold
    formula: |
      # --- per-line inputs -------------------------------------------------
      base_wages_cents      = round_half_up(employee.annual_salary_cents / 24)      # SEMI_MONTHLY
      overtime_premium_cents = overtime_entries[employee.id].overtime_premium_cents, else 0
      gross_wages_cents     = base_wages_cents + overtime_premium_cents

      # pre-tax benefit deduction: enrollments ACTIVE at calculate time whose coverage
      # window overlaps the run period, half-open on the end date.
      covering(e) = BenefitEnrollment WHERE worksite_employee_id = e.id
                      AND status == ACTIVE
                      AND coverage_start_date <= run.period_end
                      AND (coverage_end_date IS NULL OR coverage_end_date > run.period_start)
      pretax_benefit_deduction_cents = SUM over covering(e) of
                                         round_half_up(enrollment.employee_share_cents / 2)   # semi-monthly half of the monthly share
      taxable_wages_cents = gross_wages_cents - pretax_benefit_deduction_cents

      # --- YTD reads (from calculations.employee_ytd_accumulators, d = run.check_date) ------
      ytd_taxable = ytd_taxable_wages_cents(e, run.check_date)
      ytd_ss      = ytd_ss_taxable_cents(e, run.check_date)
      ytd_futa    = ytd_futa_taxable_cents(e, run.check_date)

      # --- employee side (each component rounded half-up INDEPENDENTLY, at the LINE level) ---
      ss_taxable   = max(0, min(taxable_wages_cents, SS_WAGE_BASE_CENTS - ytd_ss))
      employee_ss_tax_cents        = round_half_up(ss_taxable * SS_RATE)
      employee_medicare_tax_cents  = round_half_up(taxable_wages_cents * MEDICARE_RATE)
      addl_base = max(0, min(taxable_wages_cents,
                             (ytd_taxable + taxable_wages_cents) - ADDL_MEDICARE_THRESHOLD_CENTS))
      employee_addl_medicare_tax_cents = round_half_up(addl_base * ADDL_MEDICARE_RATE)
      employee_income_tax_cents    = round_half_up(taxable_wages_cents * FLAT_FIT_RATE)
      employee_tax_total_cents = employee_ss_tax_cents + employee_medicare_tax_cents
                               + employee_addl_medicare_tax_cents + employee_income_tax_cents

      # --- employer side ---------------------------------------------------
      employer_ss_tax_cents       = round_half_up(ss_taxable * SS_RATE)          # employer match
      employer_medicare_tax_cents = round_half_up(taxable_wages_cents * MEDICARE_RATE)
      futa_taxable = max(0, min(taxable_wages_cents, FUTA_WAGE_BASE_CENTS - ytd_futa))
      employer_futa_tax_cents     = round_half_up(futa_taxable * FUTA_RATE)
      employer_tax_total_cents = employer_ss_tax_cents + employer_medicare_tax_cents
                               + employer_futa_tax_cents

      net_pay_cents = gross_wages_cents - pretax_benefit_deduction_cents - employee_tax_total_cents

      # --- ROUNDING ORDER (PINNED) -----------------------------------------
      # Every tax component is rounded half-up on the individual PayrollLine and only THEN summed
      # into PayrollRun.total_employee_tax_cents / total_employer_tax_cents and into the invoice's
      # PASS_THROUGH_EMPLOYER_TAX line. The system NEVER re-derives a tax from the run's aggregate
      # gross wages. round-per-line-then-sum and sum-then-round give different cents; per-line wins.
    input_set: "WorksiteEmployee rows of run.client_id with status IN {PENDING_ONBOARDING, ACTIVE}, hire_date <= run.period_end, and (termination_date IS NULL OR termination_date >= run.period_start), ordered by created_at ASC."
    constants:
      SS_RATE: 0.062
      SS_WAGE_BASE_CENTS: 17610000
      MEDICARE_RATE: 0.0145
      ADDL_MEDICARE_RATE: 0.009
      ADDL_MEDICARE_THRESHOLD_CENTS: 20000000
      FLAT_FIT_RATE: 0.10
      FUTA_RATE: 0.006
      FUTA_WAGE_BASE_CENTS: 700000
      PAY_PERIODS_PER_YEAR: 24
    precision: "integer cents, round_half_up per component, per line"

  - name: wc_premium
    trigger: "ESTIMATED variant runs on POST /payroll-runs/{id}/calculate (written to PayrollLine.wc_premium_estimated_cents). AUDITED variant runs on the invoice cascade of POST /payroll-runs/{id}/approve (written to the PASS_THROUGH_WC_PREMIUM InvoiceLine)."
    algorithm: tiered_pricing
    formula: |
      rate  = WcClassCode(employee.wc_class_code_id).base_rate_per_100_cents   # premium cents per $100 of payroll
      mod   = ClientCompany(run.client_id).wc_experience_mod
      cap   = WorkersCompPolicy(class_code.wc_policy_id).payroll_cap_cents

      premium(payroll_base) = round_half_up((payroll_base / 10000) * rate * mod)   # 10000 cents = $100

      ESTIMATED_base(line) = line.gross_wages_cents
      AUDITED_base(line)   = max(0, min(line.gross_wages_cents, cap) - line.overtime_premium_cents)

      # per-line premium is rounded, then summed across the run's lines
    input_set: "Every PayrollLine of the run. The two variants read the SAME lines; they differ only in the payroll base."
    constants: {}
    precision: "integer cents, round_half_up per line, then summed"
    variants:
      - name: ESTIMATED
        when: "At calculate time, when the PEO books the accrual for the payroll it is about to run."
        difference: "Uses the full gross_wages_cents of the line — no per-employee payroll cap, and the overtime premium IS included in the base."
      - name: AUDITED
        when: "At approve time, when the workers-comp pass-through is billed on the ClientInvoice."
        difference: "Caps the per-employee payroll base at WorkersCompPolicy.payroll_cap_cents AND subtracts overtime_premium_cents (the overtime premium portion is excluded from covered payroll). For the same PayrollLine this yields a strictly smaller premium whenever the line has overtime or exceeds the cap."

  - name: benefit_premium_rating
    trigger: "POST /worksite-employees/{id}/benefit-enrollments (prices the new BenefitEnrollment) and GET /benefit-plans/{id}/premium-quote (prices the whole pool under a caller-chosen method)."
    algorithm: weighted_scoring
    formula: |
      age(e, plan)      = plan.plan_year - e.birth_year
      band_factor(age)  = 0.80  if age < 30
                          1.00  if 30 <= age <= 39
                          1.30  if 40 <= age <= 49
                          1.75  if 50 <= age <= 59
                          2.20  if age >= 60

      COMPOSITE:  enrollee_premium(e)  = plan.composite_rate_cents
      AGE_BANDED: enrollee_premium(e)  = round_half_up(plan.age_band_base_rate_cents * band_factor(age(e, plan)))

      # Per enrollee: round, then split, then sum. Split is pinned:
      employer_share(e) = round_half_up(enrollee_premium(e) * plan.employer_contribution_pct)
      employee_share(e) = enrollee_premium(e) - employer_share(e)      # remainder absorbs the rounding

      # Pool quote (GET /benefit-plans/{id}/premium-quote):
      monthly_premium_cents = SUM over seated enrollees of enrollee_premium(e)
      employer_share_cents  = round_half_up(monthly_premium_cents * plan.employer_contribution_pct)
      employee_share_cents  = monthly_premium_cents - employer_share_cents
    input_set: "For the quote: BenefitEnrollment rows of the plan with status IN {PENDING, ACTIVE} (the seated enrollees), ordered by created_at ASC. For a single enrollment: that enrollee only."
    constants:
      BAND_FACTOR_UNDER_30: 0.80
      BAND_FACTOR_30_39: 1.00
      BAND_FACTOR_40_49: 1.30
      BAND_FACTOR_50_59: 1.75
      BAND_FACTOR_60_PLUS: 2.20
    precision: "integer cents, round_half_up per enrollee"
    variants:
      - name: COMPOSITE
        when: "BenefitPlan.rating_method == COMPOSITE (used to price stored enrollments), or rating_method=COMPOSITE passed to the quote endpoint."
        difference: "Every enrollee costs the same flat composite_rate_cents; the pool premium is a pure headcount multiple and is completely insensitive to who is enrolled."
      - name: AGE_BANDED
        when: "BenefitPlan.rating_method == AGE_BANDED (used to price stored enrollments), or rating_method=AGE_BANDED passed to the quote endpoint."
        difference: "Each enrollee is priced from age_band_base_rate_cents times their age-band factor, so the SAME enrolled population yields a different pool premium (and different employer/employee split) than COMPOSITE."

  - name: benefit_pool_status
    trigger: "Re-derived whenever BenefitPlan.enrolled_count changes (enrollment created, cancelled, or terminated by the employee-termination cascade)."
    algorithm: threshold
    formula: |
      enrolled_count = COUNT(BenefitEnrollment WHERE benefit_plan_id = plan.id
                             AND status IN {PENDING, ACTIVE})
      available_seats = plan.pool_capacity - enrolled_count           # conserved quantity

      pool_status = FULL     if enrolled_count >= plan.pool_capacity
                    FORMING  if enrolled_count == 0
                    AT_RISK  if 0 < enrolled_count < plan.participation_minimum_count
                    ACTIVE   otherwise (participation_minimum_count <= enrolled_count < pool_capacity)
    input_set: "BenefitEnrollment rows of the plan with status IN {PENDING, ACTIVE}. CANCELLED and TERMINATED enrollments release their seat."
    constants: {}
    precision: "integer counts"

  - name: admin_fee
    trigger: "Invoice cascade of POST /payroll-runs/{id}/approve — produces the ADMIN_FEE InvoiceLine and ClientInvoice.admin_fee_cents."
    algorithm: tiered_pricing
    formula: |
      G = PayrollRun.total_gross_wages_cents                  # billable payroll volume of this run

      # (1) volume tier — marginal rate is NOT used; ONE rate applies to the whole volume
      rate = ADMIN_RATE_TIER_1 (0.045)   if G < TIER_1_CEILING_CENTS (5000000)
             ADMIN_RATE_TIER_2 (0.035)   if TIER_1_CEILING_CENTS <= G < TIER_2_CEILING_CENTS (20000000)
             ADMIN_RATE_TIER_3 (0.0275)  if G >= TIER_2_CEILING_CENTS

      # (2) nested floor/cap collar
      raw    = round_half_up(G * rate)
      collar = min(max(raw, ADMIN_FEE_FLOOR_CENTS (25000)), ADMIN_FEE_CAP_CENTS (2500000))

      # (3) conditional delinquency surcharge, applied AFTER the collar
      admin_fee_cents = round_half_up(collar * DELINQUENCY_SURCHARGE_MULTIPLIER (1.10))
                          if ClientCompany.delinquency_strikes >= 1
                        collar
                          otherwise

      # EVALUATION ORDER IS PINNED: tier -> raw -> collar -> surcharge. Applying the surcharge
      # before the collar, or the collar before the tiered rate, yields a different fee.
    input_set: "The single PayrollRun being approved (its total_gross_wages_cents), plus the ClientCompany's current delinquency_strikes at approve time."
    constants:
      ADMIN_RATE_TIER_1: 0.045
      ADMIN_RATE_TIER_2: 0.035
      ADMIN_RATE_TIER_3: 0.0275
      TIER_1_CEILING_CENTS: 5000000
      TIER_2_CEILING_CENTS: 20000000
      ADMIN_FEE_FLOOR_CENTS: 25000
      ADMIN_FEE_CAP_CENTS: 2500000
      DELINQUENCY_SURCHARGE_MULTIPLIER: 1.10
    precision: "integer cents, round_half_up at step (2) and again at step (3)"

  - name: client_invoice_totals
    trigger: "Invoice cascade of POST /payroll-runs/{id}/approve — emits the five InvoiceLine rows and sets ClientInvoice.admin_fee_cents / pass_through_total_cents / total_cents."
    algorithm: aggregation
    formula: |
      # Exactly five lines, always emitted in this order, even when amount_cents == 0:
      ADMIN_FEE                  = calculations.admin_fee(run, client)
      PASS_THROUGH_GROSS_WAGES   = run.total_gross_wages_cents
      PASS_THROUGH_EMPLOYER_TAX  = run.total_employer_tax_cents      # per-line rounded, then summed
      PASS_THROUGH_BENEFIT_PREMIUM = SUM over the run's paid employees of
                                       (for each BenefitEnrollment with status ACTIVE covering the run
                                        period) enrollment.monthly_premium_cents
      PASS_THROUGH_WC_PREMIUM    = SUM over the run's PayrollLines of
                                       calculations.wc_premium(variant = AUDITED, line)

      pass_through_total_cents = PASS_THROUGH_GROSS_WAGES + PASS_THROUGH_EMPLOYER_TAX
                               + PASS_THROUGH_BENEFIT_PREMIUM + PASS_THROUGH_WC_PREMIUM
      total_cents = admin_fee_cents + pass_through_total_cents      # == SUM(InvoiceLine.amount_cents)
    input_set: "The PayrollLines of the approved run (all of them), and the ACTIVE BenefitEnrollments of those employees whose coverage window overlaps the run period (coverage_start_date <= period_end AND (coverage_end_date IS NULL OR coverage_end_date > period_start))."
    constants: {}
    precision: "integer cents; no re-rounding — every summand is already a rounded integer"

  - name: client_outstanding_balance
    trigger: "Recomputed after every ClientInvoice mutation: creation (approve cascade), payment, and void."
    algorithm: aggregation
    formula: |
      outstanding_balance_cents(client) =
        SUM over ClientInvoice I WHERE I.client_id = client.id
                                   AND I.status IN {ISSUED, PARTIALLY_PAID}
          of (I.total_cents - I.amount_paid_cents)

      # PAID and VOID invoices contribute nothing. This makes void the exact compensating action of
      # the approve cascade: issuing an invoice of T raises the balance by T, voiding it (with no
      # payment applied) lowers the balance by exactly T, leaving no drift.
    input_set: "ClientInvoice rows of the client with status IN {ISSUED, PARTIALLY_PAID}."
    constants: {}
    precision: "integer cents"

  - name: aca_fte_count
    trigger: "Recomputed on ClientCompany whenever a WorksiteEmployee's status changes (packet approval, termination); snapshotted onto ComplianceFiling at POST /clients/{id}/compliance-filings."
    algorithm: threshold
    formula: |
      full_time_count = COUNT(WorksiteEmployee WHERE client_id = client.id
                              AND status == ACTIVE AND employment_type == FULL_TIME)
      pt_equivalents  = floor(client.part_time_monthly_hours_total / ACA_PT_HOURS_PER_FTE (120))
      fte_count       = full_time_count + pt_equivalents

      is_ale = (fte_count >= ALE_FTE_THRESHOLD)          # 50, inclusive: exactly 50 IS an ALE

      # Filing eligibility gates (both are inclusive >=):
      #   ACA_1095C requires is_ale == true              (fte_count >= 50)
      #   EEO1      requires fte_count >= EEO1_FTE_THRESHOLD (15)
      active_employee_count = COUNT(WorksiteEmployee WHERE client_id = client.id AND status == ACTIVE)
    input_set: "WorksiteEmployee rows of the client with status == ACTIVE (PENDING_ONBOARDING and TERMINATED employees are excluded), plus the client's reported part_time_monthly_hours_total."
    constants:
      ACA_PT_HOURS_PER_FTE: 120
      ALE_FTE_THRESHOLD: 50
      EEO1_FTE_THRESHOLD: 15
    precision: "integer counts; floor on the part-time equivalent"

  - name: tax_filing_aggregate
    trigger: "POST /tax-filings — aggregates every client's payroll under the master EIN into one quarterly filing."
    algorithm: aggregation
    formula: |
      quarter_start(year, q) = first day of the quarter    # Q1 Jan 1, Q2 Apr 1, Q3 Jul 1, Q4 Oct 1
      quarter_end(year, q)   = last day of the quarter     # Q1 Mar 31, Q2 Jun 30, Q3 Sep 30, Q4 Dec 31

      included(basis) = PayrollRun R WHERE R.processing_status IN {APPROVED, PAID}
                          AND date_key(R, basis) BETWEEN quarter_start AND quarter_end  # inclusive
        where date_key(R, CASH)    = R.check_date
              date_key(R, ACCRUAL) = R.period_end
      # Runs of EVERY ClientCompany are pooled — the filing is made under the PEO's master EIN.
      # Order of aggregation: R.check_date ASC, then R.created_at ASC (tie-break; never id).

      aggregated_run_count      = COUNT(included)
      total_taxable_wages_cents = SUM(R.total_taxable_wages_cents for R in included)
      total_employee_tax_cents  = SUM(R.total_employee_tax_cents  for R in included)
      total_employer_tax_cents  = SUM(R.total_employer_tax_cents  for R in included)
      # The membership is DERIVED, never stored on the run: POST /tax-filings/{id}/file re-evaluates
      # included(filing.basis) with the filing's stored year/quarter and requires every member to be
      # PAID. A CASH filing and an ACCRUAL filing for the same quarter therefore see overlapping —
      # but not identical — run sets, which is exactly the point of the two variants.
      # If included is empty at creation -> ERR_NO_RUNS_IN_PERIOD.
    input_set: "PayrollRuns across all clients with processing_status IN {APPROVED, PAID} and tax_filing_id IS NULL. DRAFT and CALCULATED runs, and runs already claimed by another filing, are excluded."
    constants: {}
    precision: "integer cents"
    variants:
      - name: CASH
        when: "TaxFiling.basis == CASH (default) — the quarter a run belongs to is decided by when wages were PAID."
        difference: "Keys on PayrollRun.check_date. A run whose period ends 2026-06-30 but whose check_date is 2026-07-05 lands in Q3."
      - name: ACCRUAL
        when: "TaxFiling.basis == ACCRUAL — the quarter is decided by when the wages were EARNED."
        difference: "Keys on PayrollRun.period_end. The SAME run (period_end 2026-06-30, check_date 2026-07-05) lands in Q2 instead, so a Q2 ACCRUAL filing and a Q2 CASH filing over identical data report different aggregated_run_count and different wage/tax totals."
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five business roles (PeoAdmin, PayrollSpecialist, HrAdvisor, ClientAdmin, Employee). A missing or unknown role is the Anonymous identity and is refused here."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Tenancy/ownership: when the caller is ClientAdmin, X-User-ID must equal the ClientCompany.id that owns the target resource (the client itself, or the client_id of the employee / packet / run / invoice / ticket / enrollment being addressed). When the caller is Employee, X-User-ID must equal the WorksiteEmployee.id of the target resource (or the worksite_employee_id of the enrollment/ticket/line)."
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "all ClientAdmin- and Employee-accessible endpoints"

  - priority: 10
    category: existence
    check: "Every id in the path resolves, validated left-to-right."
    error_id: ERR_CLIENT_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_PACKET_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_PAYROLL_RUN_NOT_FOUND | ERR_TAX_FILING_NOT_FOUND | ERR_COMPLIANCE_FILING_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 15
    category: existence
    check: "Every foreign key supplied in the request body resolves: wc_class_code_id -> WcClassCode, benefit_plan_id -> BenefitPlan, worksite_employee_id -> WorksiteEmployee."
    error_id: ERR_CLASS_CODE_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    applies_to: "POST /clients/{id}/worksite-employees, POST /worksite-employees/{id}/benefit-enrollments, POST /clients/{id}/hr-tickets"

  - priority: 20
    category: business_constraint
    check: "Body schema: required fields present, types correct, enum members valid, numeric constraints honored (annual_salary_cents > 0, 0.5 <= wc_experience_mod <= 2.0, quarter in 1..4, amount_cents > 0, period_end >= period_start, check_date >= period_end, close_date >= open_date, ssn_last4 exactly 4 digits, pagination limit in [1,100])."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 25
    category: state
    check: "OCC: expected_employee_version must equal WorksiteEmployee.version on packet creation; expected_invoice_version must equal ClientInvoice.version on payment."
    error_id: ERR_STALE_EMPLOYEE_VERSION | ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /worksite-employees/{id}/onboarding-packet, POST /client-invoices/{id}/payments"

  - priority: 30
    category: business_constraint
    check: "Uniqueness: ClientCompany.fein is unique; WorkersCompPolicy.master_policy_number is unique; (year, quarter, basis) is unique across TaxFiling."
    error_id: ERR_DUPLICATE_FEIN | ERR_DUPLICATE_TAX_FILING
    http_status: 409
    applies_to: "POST /clients, POST /wc-policies, POST /tax-filings"

  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2 (packet submit/review, run calculate/approve/fund/funding-event, invoice payment/void, tax filing file, compliance filing submit, enrollment cancel, client activate)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints except POST /hr-tickets/{id}/transition"

  - priority: 41
    category: state
    check: "HrTicket: the requested action is declared for the ticket's current status (ASSIGN only from OPEN, CLIENT_REPLY only from AWAITING_CLIENT, DEESCALATE only from ESCALATED, CLOSE only from RESOLVED, ...)."
    error_id: ERR_TICKET_ACTION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /hr-tickets/{id}/transition"

  - priority: 45
    category: state
    check: "Cross-entity gate: the owning ClientCompany.status == ACTIVE. Applies to hiring, packet creation, enrollment creation, payroll-run creation and payroll calculation. (A SUSPENDED client may still fund/approve nothing new but may pay invoices and re-fund an already-approved run.)"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /clients/{id}/worksite-employees, POST /worksite-employees/{id}/onboarding-packet, POST /worksite-employees/{id}/benefit-enrollments, POST /clients/{id}/payroll-runs, POST /payroll-runs/{id}/calculate"

  - priority: 50
    category: business_safety
    check: "Payroll compliance gate: every employee in the run's payable set has an OnboardingPacket with status == APPROVED (I-9 / W-4 / direct deposit reviewed). An employee still in PENDING_ONBOARDING blocks the whole run."
    error_id: ERR_ONBOARDING_INCOMPLETE
    http_status: 422
    applies_to: "POST /payroll-runs/{id}/calculate"

  - priority: 51
    category: business_safety
    check: "Segregation of duties: the approving PeoAdmin's X-User-ID must differ from PayrollRun.calculated_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /payroll-runs/{id}/approve"

  - priority: 52
    category: business_safety
    check: "Onboarding packet completeness on submit: i9_completed, w4_completed and direct_deposit_completed are all true; and revision_rounds < MAX_PACKET_REVISION_ROUNDS (3) — a fourth submission of a packet returned three times is refused."
    error_id: ERR_PACKET_INCOMPLETE | ERR_PACKET_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /onboarding-packets/{id}/submit"

  - priority: 53
    category: business_safety
    check: "Benefits eligibility: the enrollee's WorksiteEmployee.benefits_eligible == true (status ACTIVE and clock date >= hire_date + 30 days)."
    error_id: ERR_EMPLOYEE_NOT_BENEFITS_ELIGIBLE
    http_status: 422
    applies_to: "POST /worksite-employees/{id}/benefit-enrollments"

  - priority: 54
    category: business_safety
    check: "Filing applicability: ACA_1095C requires ClientCompany.is_ale == true (fte_count >= 50); EEO1 requires fte_count >= 15."
    error_id: ERR_NOT_APPLICABLE_LARGE_EMPLOYER | ERR_EEO1_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /clients/{id}/compliance-filings"

  - priority: 55
    category: business_safety
    check: "Ticket reopen budget: reopen_count < MAX_TICKET_REOPENS (2)."
    error_id: ERR_TICKET_REOPEN_LIMIT
    http_status: 422
    applies_to: "POST /hr-tickets/{id}/transition with action REOPEN"

  - priority: 60
    category: business_temporal
    check: "Pay-period overlap (CLOSED intervals, per client): the new [period_start, period_end] must not intersect any existing PayrollRun of the same client. Because both endpoints are INCLUSIVE, two periods that merely touch (existing.period_end == new.period_start) DO collide."
    error_id: ERR_PAY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /clients/{id}/payroll-runs"

  - priority: 61
    category: business_temporal
    check: "Open-enrollment gate: at the current clock date the employee's client has an OpenEnrollmentWindow for the plan's plan_year whose status == OPEN (open_date <= clock date <= close_date, both inclusive)."
    error_id: ERR_ENROLLMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /worksite-employees/{id}/benefit-enrollments"

  - priority: 62
    category: business_temporal
    check: "Coverage overlap (HALF-OPEN intervals, per (worksite_employee_id, plan_type)): [coverage_start_date, coverage_end_date) of the new enrollment must not intersect that of any enrollment of the same employee and plan_type with status IN {PENDING, ACTIVE}. Because the end is EXCLUSIVE, an enrollment starting exactly on a prior enrollment's coverage_end_date is ACCEPTED (adjacency). A null coverage_end_date is treated as 9999-12-31."
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /worksite-employees/{id}/benefit-enrollments"

  - priority: 63
    category: business_temporal
    check: "Enrollment-window spacing (CLOSED intervals plus a BUFFER, per (client_id, plan_year)): the new window's open_date must be at least ENROLLMENT_WINDOW_BUFFER_DAYS (7) days after the close_date of every existing window of the same client and plan_year, and its close_date at least 7 days before the open_date of every later one."
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /clients/{id}/enrollment-windows"

  - priority: 66
    category: business_constraint
    check: "Pool capacity: BenefitPlan.enrolled_count < BenefitPlan.pool_capacity (a seat is free)."
    error_id: ERR_PLAN_POOL_FULL
    http_status: 422
    applies_to: "POST /worksite-employees/{id}/benefit-enrollments"

  - priority: 67
    category: business_constraint
    check: "Empty payable set: the run's payable employee set is non-empty."
    error_id: ERR_NO_PAYABLE_EMPLOYEES
    http_status: 422
    applies_to: "POST /payroll-runs/{id}/calculate"

  - priority: 68
    category: business_constraint
    check: "Empty aggregation set: at least one PayrollRun falls in the requested quarter under the requested basis."
    error_id: ERR_NO_RUNS_IN_PERIOD
    http_status: 422
    applies_to: "POST /tax-filings"

  - priority: 70
    category: business_referential
    check: "Every PayrollRun in the filing's derived member set has processing_status == PAID."
    error_id: ERR_RUNS_NOT_SETTLED
    http_status: 409
    applies_to: "POST /tax-filings/{id}/file"

  - priority: 80
    category: business_fiscal
    check: "Credit gate on approval: ClientCompany.outstanding_balance_cents <= ClientCompany.credit_limit_cents at the moment of approval (the check reads the balance BEFORE the new invoice is issued, so a single approval may legitimately push the balance past the limit; the NEXT approval is then refused)."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /payroll-runs/{id}/approve"

  - priority: 81
    category: business_fiscal
    check: "Payment ceiling: amount_cents <= ClientInvoice.total_cents - ClientInvoice.amount_paid_cents."
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /client-invoices/{id}/payments"

endpoints:
  - method: POST
    path: "/clients"
    description: "Register a prospective co-employment client."
    roles: [PeoAdmin]
    code: 201
    input: ["legal_name", "fein", "state_code", "credit_limit_cents?", "wc_experience_mod?", "part_time_monthly_hours_total?", "service_agreement_signed?"]
    output: ClientCompany
    side_effects: ["Client created in status PROSPECT with outstanding_balance_cents = 0, delinquency_strikes = 0, version = 1"]

  - method: GET
    path: "/clients/{id}"
    description: "Read one client, including the derived ledger (outstanding_balance_cents), strike count, headcount and ACA figures."
    roles: [PeoAdmin, PayrollSpecialist, HrAdvisor, ClientAdmin]
    code: 200
    input: []
    output: ClientCompany
    side_effects: []

  - method: POST
    path: "/clients/{id}/activate"
    description: "Countersign the co-employment agreement and take the client live."
    roles: [PeoAdmin]
    code: 200
    input: []
    output: ClientCompany
    side_effects: ["PROSPECT -> ACTIVE", "increments ClientCompany.version by 1"]

  - method: POST
    path: "/clients/{id}/worksite-employees"
    description: "Hire a worksite employee into the client's co-employment relationship."
    roles: [PeoAdmin, ClientAdmin]
    code: 201
    input: ["wc_class_code_id", "first_name", "last_name", "ssn_last4", "birth_year", "hire_date", "annual_salary_cents", "employment_type?"]
    output: WorksiteEmployee
    side_effects: ["Employee created in status PENDING_ONBOARDING with version = 1", "ClientCompany counters (active_employee_count / fte_count / is_ale) are unchanged until the packet is approved"]

  - method: GET
    path: "/worksite-employees/{id}"
    description: "Employee self-service record: status, benefits eligibility and YTD accumulators. An Employee may read only their own record."
    roles: [PeoAdmin, PayrollSpecialist, HrAdvisor, ClientAdmin, Employee]
    code: 200
    input: []
    output: WorksiteEmployee
    side_effects: []

  - method: GET
    path: "/worksite-employees"
    description: "List worksite employees, filterable by client, workers-comp class and status."
    roles: [PeoAdmin, PayrollSpecialist, HrAdvisor, ClientAdmin]
    code: 200
    input: ["client_id?", "wc_class_code_id?", "status?", "limit?", "offset?"]
    output: WorksiteEmployee[]
    side_effects: []

  - method: POST
    path: "/worksite-employees/{id}/terminate"
    description: "Terminate co-employment. Cascades into benefit enrollments, the pooled plans' seat counts and the client's ACA headcount."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: []
    output: WorksiteEmployee
    side_effects:
      - "status = TERMINATED; termination_date = clock date"
      - "non-terminal OnboardingPackets -> VOIDED"
      - "PENDING enrollments -> CANCELLED; ACTIVE enrollments -> TERMINATED with coverage_end_date = first day of the following month"
      - "each affected BenefitPlan.enrolled_count and pool_status are re-derived"
      - "ClientCompany.active_employee_count / fte_count / is_ale recomputed"
      - "increments WorksiteEmployee.version by 1"

  - method: POST
    path: "/worksite-employees/{id}/onboarding-packet"
    description: "Open a new co-employment onboarding packet. A fresh packet supersedes (VOIDs) any non-terminal packet the employee still carries, so the caller must pin the employee version it observed."
    roles: [PeoAdmin, ClientAdmin]
    code: 201
    input: ["expected_employee_version", "i9_completed?", "w4_completed?", "direct_deposit_completed?"]
    output: OnboardingPacket
    side_effects:
      - "any OnboardingPacket of this employee in DRAFT / SUBMITTED / RETURNED becomes VOIDED"
      - "new packet created in status DRAFT with revision_rounds = 0"
      - "increments WorksiteEmployee.version by 1"

  - method: GET
    path: "/worksite-employees/{id}/onboarding-packets"
    description: "All onboarding packets ever opened for this employee, including VOIDed ones."
    roles: [PeoAdmin, ClientAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: OnboardingPacket[]
    side_effects: []

  - method: POST
    path: "/onboarding-packets/{id}/submit"
    description: "Submit the packet for PEO review. Also the re-submission path for a RETURNED packet (correction round)."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: []
    output: OnboardingPacket
    side_effects: ["DRAFT|RETURNED -> SUBMITTED", "increments OnboardingPacket.version by 1"]

  - method: POST
    path: "/onboarding-packets/{id}/review"
    description: "PEO review decision. APPROVE activates the employee; RETURN sends the packet back for correction and burns a revision round."
    roles: [PeoAdmin]
    code: 200
    input: ["decision", "reviewer_note?"]
    output: OnboardingPacket
    side_effects:
      - "decision APPROVE: SUBMITTED -> APPROVED and the WorksiteEmployee transitions PENDING_ONBOARDING -> ACTIVE; the client's active_employee_count / fte_count / is_ale are recomputed"
      - "decision RETURN: SUBMITTED -> RETURNED and revision_rounds += 1"
      - "increments OnboardingPacket.version by 1"

  - method: POST
    path: "/wc-policies"
    description: "Create the PEO master workers-comp policy (also carries the master EIN used for tax filings)."
    roles: [PeoAdmin]
    code: 201
    input: ["master_policy_number", "carrier_name", "policy_year", "master_ein", "payroll_cap_cents?"]
    output: WorkersCompPolicy
    side_effects: []

  - method: GET
    path: "/wc-policies/{id}"
    description: "Read the master policy."
    roles: [PeoAdmin, PayrollSpecialist, ClientAdmin]
    code: 200
    input: []
    output: WorkersCompPolicy
    side_effects: []

  - method: POST
    path: "/wc-policies/{id}/class-codes"
    description: "Add a workers-comp class code (rate per $100 of payroll) to the master policy."
    roles: [PeoAdmin]
    code: 201
    input: ["class_code", "description", "base_rate_per_100_cents", "hazard_tier?"]
    output: WcClassCode
    side_effects: []

  - method: GET
    path: "/wc-policies/{id}/class-codes"
    description: "List the class codes on a master policy."
    roles: [PeoAdmin, PayrollSpecialist, ClientAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WcClassCode[]
    side_effects: []

  - method: POST
    path: "/benefit-plans"
    description: "Create a pooled benefit plan shared across all PEO clients."
    roles: [PeoAdmin]
    code: 201
    input: ["carrier_name", "plan_type", "plan_year", "composite_rate_cents", "age_band_base_rate_cents", "pool_capacity", "participation_minimum_count", "rating_method?", "employer_contribution_pct?"]
    output: BenefitPlan
    side_effects: ["Plan created with enrolled_count = 0 and pool_status = FORMING"]

  - method: GET
    path: "/benefit-plans/{id}"
    description: "Read a pooled plan, including enrolled_count and pool_status."
    roles: [PeoAdmin, ClientAdmin, Employee]
    code: 200
    input: []
    output: BenefitPlan
    side_effects: []

  - method: GET
    path: "/benefit-plans/{id}/premium-quote"
    description: "Re-price the plan's currently seated population under a caller-chosen rating method. The same enrolled population returns different premiums under COMPOSITE and AGE_BANDED; this endpoint does not mutate the stored enrollments."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: ["rating_method"]
    output: { benefit_plan_id: string, rating_method: string, enrollee_count: integer, monthly_premium_cents: integer, employer_share_cents: integer, employee_share_cents: integer }
    side_effects: []

  - method: POST
    path: "/clients/{id}/enrollment-windows"
    description: "Schedule an open-enrollment window for one client and plan year."
    roles: [PeoAdmin]
    code: 201
    input: ["plan_year", "open_date", "close_date"]
    output: OpenEnrollmentWindow
    side_effects: []

  - method: GET
    path: "/clients/{id}/enrollment-windows"
    description: "List a client's enrollment windows with their clock-derived status."
    roles: [PeoAdmin, ClientAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: OpenEnrollmentWindow[]
    side_effects: []

  - method: POST
    path: "/worksite-employees/{id}/benefit-enrollments"
    description: "Enroll an employee into a pooled plan, occupying a seat and pricing the enrollment under the plan's rating_method."
    roles: [ClientAdmin, Employee]
    code: 201
    input: ["benefit_plan_id", "coverage_start_date", "coverage_end_date?"]
    output: BenefitEnrollment
    side_effects:
      - "Enrollment created in status PENDING with plan_type snapshotted and monthly_premium_cents / employer_share_cents / employee_share_cents priced per calculations.benefit_premium_rating"
      - "BenefitPlan.enrolled_count is re-derived (the seat is taken) and BenefitPlan.pool_status is re-derived per calculations.benefit_pool_status"

  - method: GET
    path: "/benefit-enrollments/{id}"
    description: "Read one enrollment (self-service)."
    roles: [PeoAdmin, ClientAdmin, Employee]
    code: 200
    input: []
    output: BenefitEnrollment
    side_effects: []

  - method: GET
    path: "/benefit-enrollments"
    description: "List enrollments, filterable by employee, plan and status."
    roles: [PeoAdmin, ClientAdmin, Employee]
    code: 200
    input: ["worksite_employee_id?", "benefit_plan_id?", "status?", "limit?", "offset?"]
    output: BenefitEnrollment[]
    side_effects: []

  - method: POST
    path: "/benefit-enrollments/{id}/cancel"
    description: "Cancel a PENDING enrollment or terminate an ACTIVE one; the pooled seat is released."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: []
    output: BenefitEnrollment
    side_effects:
      - "PENDING -> CANCELLED; ACTIVE -> TERMINATED with coverage_end_date = first day of the following month"
      - "BenefitPlan.enrolled_count and pool_status are re-derived — available_seats returns to its pre-enrollment value"
      - "increments BenefitEnrollment.version by 1"

  - method: POST
    path: "/clients/{id}/payroll-runs"
    description: "Open a semi-monthly payroll run for a client."
    roles: [PayrollSpecialist, PeoAdmin]
    code: 201
    input: ["period_start", "period_end", "check_date", "pay_frequency?"]
    output: PayrollRun
    side_effects: ["Run created with processing_status = DRAFT and funding_status = UNFUNDED"]

  - method: GET
    path: "/payroll-runs/{id}"
    description: "Read a payroll run, including both status dimensions and all computed totals."
    roles: [PeoAdmin, PayrollSpecialist, ClientAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects: []

  - method: GET
    path: "/payroll-runs"
    description: "List payroll runs, filterable by client and by either status dimension."
    roles: [PeoAdmin, PayrollSpecialist, ClientAdmin]
    code: 200
    input: ["client_id?", "processing_status?", "funding_status?", "limit?", "offset?"]
    output: PayrollRun[]
    side_effects: []

  - method: GET
    path: "/payroll-runs/{id}/lines"
    description: "The generated pay lines of a run."
    roles: [PeoAdmin, PayrollSpecialist, ClientAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PayrollLine[]
    side_effects: []

  - method: GET
    path: "/worksite-employees/{id}/payroll-lines"
    description: "Employee self-service pay history: every PayrollLine ever generated for this employee."
    roles: [PeoAdmin, PayrollSpecialist, ClientAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: PayrollLine[]
    side_effects: []

  - method: POST
    path: "/payroll-runs/{id}/calculate"
    description: "Generate (or regenerate) the run's pay lines: wages, pre-tax benefit deductions, employee/employer taxes with wage-base caps, and the ESTIMATED workers-comp premium."
    roles: [PayrollSpecialist, PeoAdmin]
    code: 200
    input: ["overtime_entries?"]
    output: PayrollRun
    side_effects:
      - "existing lines discarded and regenerated per calculations.payroll_line_taxes and calculations.wc_premium (ESTIMATED)"
      - "run totals recomputed by summing the per-line, already-rounded components"
      - "calculated_by_user_id = X-User-ID; processing_status = CALCULATED"
      - "increments PayrollRun.version by 1"

  - method: POST
    path: "/payroll-runs/{id}/approve"
    description: "Approve a calculated run. The approver may not be the operator who calculated it. Cascades into invoice issue and the client ledger."
    roles: [PeoAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects:
      - "processing_status = APPROVED; approved_by_user_id = X-User-ID"
      - "each paid employee's ytd_* accumulators are recomputed"
      - "a ClientInvoice is issued with its five InvoiceLine rows (admin fee + four pass-throughs, workers-comp priced with the AUDITED variant)"
      - "ClientCompany.outstanding_balance_cents rises by the invoice total"
      - "increments PayrollRun.version by 1"

  - method: POST
    path: "/payroll-runs/{id}/fund"
    description: "Initiate (or re-initiate, after a return) the ACH debit that funds an approved run."
    roles: [PayrollSpecialist, PeoAdmin]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["funding_status UNFUNDED|FAILED -> DEBIT_PENDING", "increments PayrollRun.version by 1"]

  - method: POST
    path: "/payroll-runs/{id}/funding-events"
    description: "Record the bank's answer to a pending debit. SETTLED funds the run (and marks it PAID); RETURNED fails it, charges the client a delinquency strike and may suspend the client."
    roles: [PeoAdmin]
    code: 200
    input: ["outcome"]
    output: PayrollRun
    side_effects:
      - "outcome SETTLED: funding_status = FUNDED and processing_status APPROVED -> PAID"
      - "outcome RETURNED: funding_status = FAILED; ClientCompany.delinquency_strikes += 1; on reaching 2 strikes the client goes ACTIVE -> SUSPENDED"
      - "increments PayrollRun.version by 1"

  - method: POST
    path: "/tax-filings"
    description: "Aggregate every client's payroll for a quarter under the PEO master EIN. The basis chooses which date decides the quarter."
    roles: [PeoAdmin]
    code: 201
    input: ["year", "quarter", "basis?"]
    output: TaxFiling
    side_effects: ["Filing created in status DRAFT with aggregated_run_count and the three wage/tax totals set per calculations.tax_filing_aggregate"]

  - method: GET
    path: "/tax-filings/{id}"
    description: "Read a quarterly master-EIN filing."
    roles: [PeoAdmin]
    code: 200
    input: []
    output: TaxFiling
    side_effects: []

  - method: POST
    path: "/tax-filings/{id}/file"
    description: "File the quarterly return. Every payroll run in the filing's member set must already be PAID."
    roles: [PeoAdmin]
    code: 200
    input: []
    output: TaxFiling
    side_effects: ["status = FILED; filed_at = clock time", "increments TaxFiling.version by 1"]

  - method: POST
    path: "/clients/{id}/compliance-filings"
    description: "Open an ACA (1095-C) or EEO-1 filing for a client. Snapshots the client's FTE/ALE figures at creation."
    roles: [PeoAdmin]
    code: 201
    input: ["filing_type", "plan_year"]
    output: ComplianceFiling
    side_effects: ["fte_count, is_ale and active_employee_count snapshotted from the client per calculations.aca_fte_count"]

  - method: GET
    path: "/clients/{id}/compliance-filings"
    description: "List a client's compliance filings."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceFiling[]
    side_effects: []

  - method: POST
    path: "/compliance-filings/{id}/submit"
    description: "Submit a compliance filing to the agency."
    roles: [PeoAdmin]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: ["DRAFT -> SUBMITTED; submitted_at = clock time", "increments ComplianceFiling.version by 1"]

  - method: GET
    path: "/client-invoices/{id}"
    description: "Read one client invoice (admin fee + pass-throughs, paid amount, version for OCC)."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: []
    output: ClientInvoice
    side_effects: []

  - method: GET
    path: "/client-invoices"
    description: "List client invoices, filterable by client, originating payroll run and status."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: ["client_id?", "payroll_run_id?", "status?", "limit?", "offset?"]
    output: ClientInvoice[]
    side_effects: []

  - method: GET
    path: "/client-invoices/{id}/lines"
    description: "The five invoice lines: administrative fee plus the four pass-through components."
    roles: [PeoAdmin, ClientAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  - method: POST
    path: "/client-invoices/{id}/payments"
    description: "Apply a payment to an invoice. The caller pins the invoice version it observed, because payments are legitimately repeatable and would otherwise double-credit."
    roles: [ClientAdmin]
    code: 200
    input: ["expected_invoice_version", "amount_cents"]
    output: ClientInvoice
    side_effects:
      - "amount_paid_cents += amount_cents; status -> PARTIALLY_PAID or PAID"
      - "ClientCompany.outstanding_balance_cents recomputed; a SUSPENDED client whose balance reaches 0 returns to ACTIVE with delinquency_strikes = 0"
      - "increments ClientInvoice.version by 1"

  - method: POST
    path: "/client-invoices/{id}/void"
    description: "Void an issued invoice — the compensating action for the payroll-approval cascade."
    roles: [PeoAdmin]
    code: 200
    input: []
    output: ClientInvoice
    side_effects:
      - "status = VOID"
      - "ClientCompany.outstanding_balance_cents recomputed; with no payment applied it returns to exactly its pre-issue value"
      - "a SUSPENDED client whose balance reaches 0 returns to ACTIVE with delinquency_strikes = 0"
      - "increments ClientInvoice.version by 1"

  - method: POST
    path: "/clients/{id}/hr-tickets"
    description: "Raise an HR advisory ticket."
    roles: [ClientAdmin, Employee]
    code: 201
    input: ["category", "subject", "body", "worksite_employee_id?", "priority?"]
    output: HrTicket
    side_effects: ["Ticket created in status OPEN with reopen_count = 0"]

  - method: GET
    path: "/hr-tickets/{id}"
    description: "Read one HR ticket."
    roles: [PeoAdmin, HrAdvisor, ClientAdmin, Employee]
    code: 200
    input: []
    output: HrTicket
    side_effects: []

  - method: GET
    path: "/hr-tickets"
    description: "List HR tickets, filterable by client, employee and status."
    roles: [PeoAdmin, HrAdvisor, ClientAdmin, Employee]
    code: 200
    input: ["client_id?", "worksite_employee_id?", "status?", "limit?", "offset?"]
    output: HrTicket[]
    side_effects: []

  - method: POST
    path: "/hr-tickets/{id}/transition"
    description: "Drive the advisory workflow: ASSIGN, AWAIT_CLIENT, CLIENT_REPLY, ESCALATE, DEESCALATE, RESOLVE, REOPEN, CLOSE."
    roles: [HrAdvisor, PeoAdmin, ClientAdmin]
    code: 200
    input: ["action"]
    output: HrTicket
    side_effects: ["status advances per §1.2; ASSIGN stamps assigned_advisor_user_id; ESCALATE forces priority = HIGH; REOPEN increments reopen_count", "increments HrTicket.version by 1"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock also activates every PENDING BenefitEnrollment whose coverage_start_date is at or before the new date."
    roles: [PeoAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string, activated_enrollment_count: integer }
    side_effects:
      - "logical clock = to_iso8601"
      - "every BenefitEnrollment with status PENDING and coverage_start_date <= new clock date transitions PENDING -> ACTIVE (ordered by created_at ASC)"
      - "OpenEnrollmentWindow.status and WorksiteEmployee.benefits_eligible are re-derived from the new clock"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five business roles (the Anonymous identity)."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the endpoint."
  - id: ERR_NOT_OWNER
    http: 403
    condition: "A ClientAdmin addresses a resource belonging to another ClientCompany, or an Employee addresses another employee's resource."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No ClientCompany with the given id."
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "No WorksiteEmployee with the given id (path or body)."
  - id: ERR_PACKET_NOT_FOUND
    http: 404
    condition: "No OnboardingPacket with the given id."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "No WorkersCompPolicy with the given id."
  - id: ERR_CLASS_CODE_NOT_FOUND
    http: 404
    condition: "wc_class_code_id does not resolve to a WcClassCode."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No BenefitPlan with the given id (path or benefit_plan_id)."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No BenefitEnrollment with the given id."
  - id: ERR_PAYROLL_RUN_NOT_FOUND
    http: 404
    condition: "No PayrollRun with the given id."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No ClientInvoice with the given id."
  - id: ERR_TAX_FILING_NOT_FOUND
    http: 404
    condition: "No TaxFiling with the given id."
  - id: ERR_COMPLIANCE_FILING_NOT_FOUND
    http: 404
    condition: "No ComplianceFiling with the given id."
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "No HrTicket with the given id."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum member, or a violated numeric/date constraint (including period_end < period_start, check_date < period_end, close_date < open_date, limit outside [1,100])."
  - id: ERR_STALE_EMPLOYEE_VERSION
    http: 412
    condition: "expected_employee_version does not equal the WorksiteEmployee's current version on packet creation."
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not equal the ClientInvoice's current version on payment."
  - id: ERR_DUPLICATE_FEIN
    http: 409
    condition: "Another ClientCompany already holds this fein."
  - id: ERR_DUPLICATE_TAX_FILING
    http: 409
    condition: "A TaxFiling already exists for this (year, quarter, basis)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource's current state does not permit the requested transition."
  - id: ERR_TICKET_ACTION_NOT_ALLOWED
    http: 409
    condition: "The requested HrTicket action is not declared from the ticket's current status."
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "The owning ClientCompany is not ACTIVE (still PROSPECT, or SUSPENDED for delinquency)."
  - id: ERR_ONBOARDING_INCOMPLETE
    http: 422
    condition: "A payable employee in the run has no APPROVED OnboardingPacket."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The approving operator's X-User-ID equals PayrollRun.calculated_by_user_id."
  - id: ERR_PACKET_INCOMPLETE
    http: 422
    condition: "Submit attempted while i9_completed, w4_completed or direct_deposit_completed is false."
  - id: ERR_PACKET_REVISION_LIMIT
    http: 422
    condition: "Submit attempted on a packet already returned MAX_PACKET_REVISION_ROUNDS (3) times."
  - id: ERR_EMPLOYEE_NOT_BENEFITS_ELIGIBLE
    http: 422
    condition: "The enrollee is not ACTIVE, or the 30-day waiting period since hire_date has not elapsed at the current clock date."
  - id: ERR_NOT_APPLICABLE_LARGE_EMPLOYER
    http: 422
    condition: "ACA_1095C requested for a client whose fte_count < 50 (is_ale false)."
  - id: ERR_EEO1_NOT_REQUIRED
    http: 422
    condition: "EEO1 requested for a client whose fte_count < 15."
  - id: ERR_TICKET_REOPEN_LIMIT
    http: 422
    condition: "REOPEN requested on a ticket already reopened MAX_TICKET_REOPENS (2) times."
  - id: ERR_PAY_PERIOD_OVERLAP
    http: 409
    condition: "The new closed pay period [period_start, period_end] intersects (or merely touches) an existing run of the same client."
  - id: ERR_ENROLLMENT_WINDOW_CLOSED
    http: 422
    condition: "No OpenEnrollmentWindow of the employee's client for the plan's plan_year is OPEN at the current clock date."
  - id: ERR_COVERAGE_OVERLAP
    http: 409
    condition: "The new half-open coverage window [coverage_start_date, coverage_end_date) intersects a PENDING/ACTIVE enrollment of the same employee and plan_type. Exact adjacency (new start == prior end) does NOT trigger this."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "The new enrollment window is within ENROLLMENT_WINDOW_BUFFER_DAYS (7) days of another window of the same client and plan_year."
  - id: ERR_PLAN_POOL_FULL
    http: 422
    condition: "BenefitPlan.enrolled_count has reached pool_capacity — no seat is free."
  - id: ERR_NO_PAYABLE_EMPLOYEES
    http: 422
    condition: "The run's payable employee set is empty."
  - id: ERR_NO_RUNS_IN_PERIOD
    http: 422
    condition: "No PayrollRun falls in the requested quarter under the requested basis."
  - id: ERR_RUNS_NOT_SETTLED
    http: 409
    condition: "A PayrollRun in the filing's member set is still APPROVED rather than PAID."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Approval attempted while ClientCompany.outstanding_balance_cents already exceeds credit_limit_cents."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "amount_cents exceeds the invoice's unpaid remainder."

roles:
  - name: PeoAdmin
    description: "PEO operations administrator: onboards clients, reviews onboarding packets, owns the master workers-comp policy, pooled plans, enrollment windows, tax and compliance filings, invoice voids, and payroll approval."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{id}/activate"
      - "POST /onboarding-packets/{id}/review"
      - "POST /wc-policies"
      - "POST /wc-policies/{id}/class-codes"
      - "POST /benefit-plans"
      - "POST /clients/{id}/enrollment-windows"
      - "POST /payroll-runs/{id}/approve"
      - "POST /payroll-runs/{id}/funding-events"
      - "POST /tax-filings"
      - "POST /tax-filings/{id}/file"
      - "GET /tax-filings/{id}"
      - "POST /clients/{id}/compliance-filings"
      - "POST /compliance-filings/{id}/submit"
      - "POST /client-invoices/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /clients/{id}/worksite-employees, POST /worksite-employees/{id}/terminate, POST /worksite-employees/{id}/onboarding-packet, POST /onboarding-packets/{id}/submit (shared with ClientAdmin)"
      - "POST /clients/{id}/payroll-runs, POST /payroll-runs/{id}/calculate, POST /payroll-runs/{id}/fund (shared with PayrollSpecialist)"
      - "POST /benefit-enrollments/{id}/cancel (shared with ClientAdmin)"
      - "POST /hr-tickets/{id}/transition (shared with HrAdvisor and ClientAdmin)"
      - "all read endpoints"

  - name: PayrollSpecialist
    description: "PEO payroll operator: opens runs, calculates them and initiates funding. Deliberately cannot approve — segregation of duties."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /clients/{id}/payroll-runs, POST /payroll-runs/{id}/calculate, POST /payroll-runs/{id}/fund (shared with PeoAdmin)"
      - "GET /clients/{id}, GET /worksite-employees, GET /worksite-employees/{id}, GET /wc-policies/{id}, GET /wc-policies/{id}/class-codes, GET /payroll-runs, GET /payroll-runs/{id}, GET /payroll-runs/{id}/lines, GET /worksite-employees/{id}/payroll-lines"

  - name: HrAdvisor
    description: "PEO HR advisory staff: works the client ticket queue."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /hr-tickets/{id}/transition (ASSIGN / AWAIT_CLIENT / ESCALATE / RESOLVE / CLOSE; shared with PeoAdmin and ClientAdmin, which own the DEESCALATE / CLIENT_REPLY / REOPEN actions respectively)"
      - "GET /hr-tickets, GET /hr-tickets/{id}, GET /clients/{id}, GET /worksite-employees, GET /worksite-employees/{id}"

  - name: ClientAdmin
    description: "HR administrator at a co-employment client. Acts only inside their own ClientCompany."
    identity: "entity_backed:ClientCompany"
    exclusive_operations:
      - "POST /client-invoices/{id}/payments"
    shared_operations:
      - "POST /clients/{id}/worksite-employees, POST /worksite-employees/{id}/terminate, POST /worksite-employees/{id}/onboarding-packet, POST /onboarding-packets/{id}/submit (shared with PeoAdmin)"
      - "POST /worksite-employees/{id}/benefit-enrollments (shared with Employee), POST /benefit-enrollments/{id}/cancel (shared with PeoAdmin)"
      - "POST /clients/{id}/hr-tickets (shared with Employee), POST /hr-tickets/{id}/transition (CLIENT_REPLY / REOPEN)"
      - "reads scoped to their own client: GET /clients/{id}, GET /worksite-employees, GET /payroll-runs, GET /client-invoices, GET /client-invoices/{id}, GET /client-invoices/{id}/lines, GET /benefit-plans/{id}/premium-quote"

  - name: Anonymous
    description: "The unauthenticated caller: X-User-Role / X-User-ID absent or carrying an unknown role. Permitted on ZERO endpoints — every request presenting this identity is rejected at validation priority 1 with ERR_UNAUTHENTICATED (401). Declared so the auth boundary itself is a first-class, testable identity."
    identity: opaque
    exclusive_operations: []
    shared_operations: []

  - name: Employee
    description: "Worksite employee using self-service: reads their own record, pay history and enrollments; enrolls in benefits; raises HR tickets."
    identity: "entity_backed:WorksiteEmployee"
    exclusive_operations: []
    shared_operations:
      - "POST /worksite-employees/{id}/benefit-enrollments (own record only; shared with ClientAdmin)"
      - "POST /clients/{id}/hr-tickets (own client only; shared with ClientAdmin)"
      - "self-service reads: GET /worksite-employees/{id}, GET /worksite-employees/{id}/payroll-lines, GET /worksite-employees/{id}/onboarding-packets, GET /benefit-enrollments, GET /benefit-enrollments/{id}, GET /benefit-plans/{id}, GET /clients/{id}/enrollment-windows, GET /hr-tickets, GET /hr-tickets/{id}"
