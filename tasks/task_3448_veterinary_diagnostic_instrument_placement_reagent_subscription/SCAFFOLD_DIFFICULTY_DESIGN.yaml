# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3448 veterinary diagnostics
# 9 Difficulty Rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and replays from empty-DB using only §1.5 endpoints.
# Shared setup fragments are YAML anchors defined on first use in this file.
# Logical-clock default is 2026-09-01T00:00:00Z (September 2026).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commitment_attribution_provisional_vs_final
        grounds:
          - calculations.commitment_fulfillment
          - entities.CommitmentPeriod.fields.provisional_fulfilled_cents
          - entities.CommitmentPeriod.fields.fulfilled_cents
          - state_machines.CommitmentPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Dual variant on AGREEMENT ECONOMICS: the same FULFILLED order set
          yields provisional_fulfilled_cents == 0 (fulfillment-date
          attribution, order fulfilled in October) while the final close locks
          fulfilled_cents == 42000 (order-month attribution, order_month
          2026-09) — identical data, two valid algorithms, different numbers.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-09-01T00:00:00Z."
            - "Clinic (baseline 1000) with an ACTIVE 24-month REAGENT_COMMITMENT agreement, monthly_minimum_cents 100000, start 2026-09-01; 24 OPEN CommitmentPeriods exist."
            - "One reagent order (100 x VC300_CHEM_SLIDE at list 420c) SUBMITTED with order_month 2026-09, then FULFILLED after the clock advances to 2026-10-02."
            - "While the 2026-09 period is still OPEN its provisional_fulfilled_cents reads 0."
          setup_api_calls:
            - &mk_clinic_plain
              call: "POST /api/clinics"
              payload: { name: "Vale Veterinary", caseload_baseline_tests: 1000 }
              as: PlatformAdmin
              captures: { clinic_id: $.data.id }
            - &mk_pa_rc100
              call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2026-09-01T00:00:00Z", monthly_minimum_cents: 100000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_id: $.data.id }
            - &pa_approve
              call: "POST /api/placement-agreements/${pa_id}/approve"
              payload: {}
              as: FinanceReviewer
            - &pa_activate
              call: "POST /api/placement-agreements/${pa_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { pa_v: $.data.version }
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 100 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_id: $.data.id }
            - &clock_oct2
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "PATCH /api/reagent-orders/${ro_id}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1_id: "$.data[0].id", cp1_prov: "$.data[0].provisional_fulfilled_cents" }
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
              captures: { cp1_billed: $.data.billed_cents }
          assert:
            - "setup read proved the provisional variant: CommitmentPeriod.${cp1_id}.provisional_fulfilled_cents == 0 although the order was already FULFILLED (fulfilled_at in 2026-10, not 2026-09)"
            - "trigger response: period_status == CLOSED and billing_status == ISSUED"
            - "final variant on the SAME order set: fulfilled_cents == 42000 (order_month 2026-09 attribution of 100 x 420c)"
            - "shortfall_cents == 58000 and billed_cents == 46400 (round_half_up(58000 * 0.80))"
            - "the two variants diverge on identical data: 0 (provisional) != 42000 (final)"
            - "PlacementAgreement.${pa_id}.cumulative_unpaid_billed_cents == 46400"

      - name: uptime_reported_vs_breach_variants
        grounds:
          - calculations.uptime_and_service_credit
          - entities.Analyzer.fields.reported_uptime_pct
          - entities.Analyzer.fields.breach_uptime_pct
          - state_machines.ServiceCase.DISPATCHED_to_RESOLVED
        distinguishing_aspect: |
          Dual variant on the SERVICE/ANALYZER domain (different entity domain
          from commitment_attribution_provisional_vs_final): one 20-hour
          PREVENTIVE_CALIBRATION case yields breach_uptime_pct == 0.9907 (all
          downtime counted) but reported_uptime_pct == 0.9981 (16 free
          calibration hours excluded) — same inputs, different outputs.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with an ACTIVE 24-month PURCHASE agreement (model VETHEMAT_500, purchase_price_cents 950000); analyzer SN-UPT-1 IN_SERVICE."
            - "A PREVENTIVE_CALIBRATION ServiceCase opened at 2026-09-01T00:00:00Z and DISPATCHED; clock advanced 20 hours."
          setup_api_calls:
            - *mk_clinic_plain
            - &mk_pa_purchase
              call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETHEMAT_500", program_type: "PURCHASE", term_months: 24, start_date: "2026-09-01T00:00:00Z", purchase_price_cents: 950000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_id: $.data.id }
            - *pa_approve
            - *pa_activate
            - &mk_analyzer_snupt1
              call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", serial_number: "SN-UPT-1" }
              as: FieldServiceEngineer
              captures: { an_id: $.data.id }
            - &analyzer_in_service
              call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/service-cases"
              payload: { analyzer_id: "${an_id}", case_type: "PREVENTIVE_CALIBRATION" }
              as: FieldServiceEngineer
              captures: { sc_id: $.data.id }
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "DISPATCH" }
              as: FieldServiceEngineer
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "RESOLVE", resolution_note: "calibrated" }
              as: FieldServiceEngineer
            - call: "GET /api/analyzers/${an_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { an_breach: $.data.breach_uptime_pct, an_reported: $.data.reported_uptime_pct }
          assert:
            - "ServiceCase.${sc_id}.downtime_hours == 20 (round_half_up of 20.0h from opened_at to resolved_at)"
            - "ServiceCase.${sc_id}.sla_met == true (resolved 20h after open, within RESPONSE_SLA_HOURS 24)"
            - "Analyzer.${an_id}.breach_uptime_pct == 0.9907 (round_half_up((2160-20)/2160, 4) — all downtime counted)"
            - "Analyzer.${an_id}.reported_uptime_pct == 0.9981 (round_half_up((2160-4)/2160, 4) — 16 free calibration hours excluded from the same 20h)"
            - "same window, same case: 0.9907 != 0.9981"
            - "no credit: PlacementAgreement.${pa_id}.service_credit_cents == 0 (0.9907 >= 0.985)"
            - "Analyzer.${an_id}.operational_status == IN_SERVICE after resolve"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: layered_pricing_override_membership_program
        grounds:
          - calculations.reagent_order_pricing
          - entities.ReagentOrder.fields.pricing_detail
          - entities.ReagentOrder.fields.final_total_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the price of one
          order depends on group-membership branch (corporate excludes buying
          outright), sku override presence, discount tier, AND program family
          zero-pricing; final_total_cents == 45800 proves corporate override
          800 on VH500_CBC_CART, corporate 10% (37800, not the buying-20%
          33600) on VC300_CHEM_SLIDE, and 0 for QC_LEVEL_1 on a
          REAGENT_COMMITMENT agreement.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "CORPORATE GPA for CORP-1 ACTIVE (window 2026-09-01..2027-09-01, discount 0.10, override VH500_CBC_CART -> 800c); BUYING GPA for BUY-1 ACTIVE (discount 0.20)."
            - "Clinic belongs to BOTH groups (corporate_group_code CORP-1, buying_group_code BUY-1); ACTIVE REAGENT_COMMITMENT agreement (VETCHEM_300, 24 months, minimum 100000c)."
          setup_api_calls:
            - &mk_gpa_corp1
              call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-1", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", discount_pct: 0.10, sku_overrides: [{ sku: "VH500_CBC_CART", unit_price_cents: 800 }] }
              as: PlatformAdmin
              captures: { gpa_corp: $.data.id }
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "BUYING", group_code: "BUY-1", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", discount_pct: 0.20 }
              as: PlatformAdmin
            - call: "POST /api/clinics"
              payload: { name: "Dual Group Vet", caseload_baseline_tests: 1000, corporate_group_code: "CORP-1", buying_group_code: "BUY-1" }
              as: PlatformAdmin
              captures: { clinic_id: $.data.id }
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
          trigger:
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VH500_CBC_CART", quantity: 10 }, { sku: "VC300_CHEM_SLIDE", quantity: 100 }, { sku: "QC_LEVEL_1", quantity: 2 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_id: $.data.id, ro_total: $.data.final_total_cents }
          assert:
            - "ReagentOrder.${ro_id}.final_total_cents == 45800 (8000 override + 37800 corporate-discount + 0 program-included)"
            - "ReagentOrder.${ro_id}.list_total_cents == 56900 (8900 + 42000 + 6000)"
            - "pricing_detail line price_source values are OVERRIDE, CORPORATE_DISCOUNT, PROGRAM_INCLUDED in line order"
            - "VC300_CHEM_SLIDE resolved unit 378c = round_half_up(420 * 0.9); the BUYING 20% tier (336c) was never consulted despite clinic membership — corporate precedence is exclusive"
            - "QC_LEVEL_1 line totals 0 because the agreement is REAGENT_COMMITMENT (QC material bundled)"

      - name: shortfall_billing_sum_of_rounds
        grounds:
          - calculations.shortfall_billing
          - entities.PlacementAgreement.fields.cumulative_billed_cents
          - state_machines.CommitmentPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode from
          layered_pricing_override_membership's mode (a)): two periods each
          bill round_half_up(66667 * 0.80) == 53334; the agreement total is
          the sum-of-rounds 106668, NOT round-of-sum
          round_half_up(133334 * 0.80) == 106667 — one cent apart.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c, start 2026-09-01, 24 months)."
            - "Order A (79 x VC300_CHEM_SLIDE + 1 x VU200_URINE_STRIP = 33333c) order_month 2026-09, FULFILLED in September."
            - "Order B (identical lines, 33333c) order_month 2026-10, created and FULFILLED at clock 2026-10-05."
            - "Clock at 2026-11-01; agreement version 3 after activation."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 79 }, { sku: "VU200_URINE_STRIP", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_a: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro_a}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-10", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 79 }, { sku: "VU200_URINE_STRIP", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_b: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro_b}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
              captures: { cp_sep_billed: $.data.billed_cents }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pa_v2: $.data.version }
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-10", expected_agreement_version: "${pa_v2}" }
              as: PlatformAdmin
              captures: { cp_oct_billed: $.data.billed_cents }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pa_cum: $.data.cumulative_billed_cents }
          assert:
            - "September period billed_cents == 53334 (round_half_up((100000-33333) * 0.80) = round_half_up(53333.6))"
            - "October period billed_cents == 53334 (identical shortfall, identical per-period rounding)"
            - "PlacementAgreement.${pa_id}.cumulative_billed_cents == 106668 (sum-of-rounds: 53334 + 53334)"
            - "round-of-sum would produce round_half_up(133334 * 0.80) == 106667 — the observed 106668 proves per-period rounding is the pinned order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: placement_agreement_renegotiation_cycle
        grounds:
          - state_machines.PlacementAgreement.ACTIVE_to_RENEGOTIATION
          - state_machines.PlacementAgreement.RENEGOTIATION_to_ACTIVE
          - calculations.renegotiation_terms
        distinguishing_aspect: |
          CYCLIC machine on PlacementAgreement: ACTIVE -> RENEGOTIATION ->
          ACTIVE (reject) -> RENEGOTIATION -> ACTIVE (accept) traverses the
          loop twice; the version counter (3 -> 7) and the final
          monthly_minimum_cents == 140000 prove each lap executed.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic (baseline == current == 1000) with ACTIVE REAGENT_COMMITMENT agreement, minimum 100000c; activation snapshot 1000; agreement version 3."
            - "Clinic caseload raised to 1400 (delta 0.40 >= 0.30, gate open)."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - &clinic_caseload_1400
              call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 1400 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { reneg_v: $.data.version, proposed_1: $.data.proposed_minimum_cents }
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: false, expected_agreement_version: "${reneg_v}" }
              as: FinanceReviewer
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { reneg_v2: $.data.version }
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: true, new_minimum_cents: 140000, expected_agreement_version: "${reneg_v2}" }
              as: FinanceReviewer
              captures: { pa_final_v: $.data.version }
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp_open_min: "$.data[0].minimum_cents" }
          assert:
            - "the second request-renegotiation succeeded from ACTIVE — the machine looped (linear machines cannot re-enter RENEGOTIATION)"
            - "proposed_minimum_cents == 140000 on the first request (round_half_up(100000 * 1400/1000))"
            - "reject lap left terms unchanged; accept lap set PlacementAgreement.${pa_id}.monthly_minimum_cents == 140000"
            - "OPEN CommitmentPeriod minimums rewritten: periods[0].minimum_cents == 140000"
            - "PlacementAgreement.${pa_id}.version == 7 exactly (create 1, approve 2, activate 3, request 4, resolve 5, request 6, resolve 7)"
            - "PlacementAgreement.${pa_id}.status == ACTIVE and proposed_minimum_cents is null after the final resolve"

      - name: analyzer_parallel_dimensions
        grounds:
          - state_machines.Analyzer
          - entities.Analyzer.fields.operational_status
          - entities.Analyzer.fields.connectivity_status
          - entities.Analyzer.fields.proficiency_standing
        distinguishing_aspect: |
          PARALLEL dimensions on Analyzer (different entity and different
          non-linear shape from placement_agreement_renegotiation_cycle):
          while operational_status is held at UNDER_SERVICE by an open repair
          case, connectivity_status still cycles NOT_CONFIGURED -> ACTIVE ->
          DEGRADED, and proficiency_standing stays LAPSED — three independent
          state axes on one row.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE."
            - "A REPAIR ServiceCase (OPEN) has moved the analyzer to UNDER_SERVICE."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_purchase
            - *pa_approve
            - *pa_activate
            - *mk_analyzer_snupt1
            - *analyzer_in_service
            - call: "POST /api/service-cases"
              payload: { analyzer_id: "${an_id}", case_type: "REPAIR" }
              as: FieldServiceEngineer
              captures: { sc_id: $.data.id }
          trigger:
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { connectivity_status: "ACTIVE" }
              as: FieldServiceEngineer
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { connectivity_status: "DEGRADED" }
              as: FieldServiceEngineer
            - call: "GET /api/analyzers/${an_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { an_op: $.data.operational_status, an_conn: $.data.connectivity_status, an_prof: $.data.proficiency_standing }
          assert:
            - "Analyzer.${an_id}.operational_status == UNDER_SERVICE throughout (held by the open ServiceCase.${sc_id})"
            - "connectivity_status cycled NOT_CONFIGURED -> ACTIVE -> DEGRADED while operational stayed UNDER_SERVICE — the dimensions are independent"
            - "proficiency_standing == LAPSED and was untouched by either dimension's transitions"
            - "Analyzer.${an_id}.version == 5 (create 1, enter-service 2, service-case open 3, connectivity 4, degrade 5)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_period_breach_cascade
        grounds:
          - state_machines.CommitmentPeriod.OPEN_to_CLOSED
          - state_machines.CommitmentPeriod.NONE_to_ISSUED
          - state_machines.PlacementAgreement.ACTIVE_to_BREACHED
          - state_machines.Clinic.ACTIVE_to_SUSPENDED
          - calculations.shortfall_billing
        distinguishing_aspect: |
          Depth-3 cascade from the close-commitment-period trigger: the period
          close (link 1) issues billing and debits the agreement (link 2), the
          agreement breaches at cumulative_unpaid_billed_cents >= 250000
          (link 3), and the breach suspends the owning Clinic. The threshold
          is crossed exactly on the FOURTH consecutive 80000c shortfall bill
          (240000 after three, 320000 after four).
        test_recipe:
          setup:
            - "Logical clock at default; clinic with ACTIVE REAGENT_COMMITMENT agreement, minimum 100000c, start 2026-09-01; NO reagent orders exist."
            - "Clock advanced to 2027-01-15 so periods 2026-09 through 2026-12 are all closable."
            - "Agreement version 3 after activation."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_a: $.data.version, unpaid_a: $.data.cumulative_unpaid_billed_cents }
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-10", expected_agreement_version: "${v_a}" }
              as: PlatformAdmin
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_b: $.data.version, unpaid_b: $.data.cumulative_unpaid_billed_cents }
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-11", expected_agreement_version: "${v_b}" }
              as: PlatformAdmin
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_c: $.data.version, unpaid_c: $.data.cumulative_unpaid_billed_cents, pa_status_c: $.data.status }
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-12", expected_agreement_version: "${v_c}" }
              as: PlatformAdmin
              captures: { cp_dec_billed: $.data.billed_cents }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { unpaid_d: $.data.cumulative_unpaid_billed_cents, pa_status_d: $.data.status }
            - call: "GET /api/clinics/${clinic_id}"
              payload: {}
              as: PlatformAdmin
              captures: { clinic_status: $.data.status }
          assert:
            - "after three closes: cumulative_unpaid_billed_cents == 240000 and status still ACTIVE (240000 < 250000)"
            - "fourth close (2026-12): billed_cents == 80000 (round_half_up(100000 * 0.80)) and billing_status == ISSUED"
            - "cascade link: PlacementAgreement.${pa_id}.status == BREACHED at cumulative_unpaid_billed_cents == 320000 (320000 >= 250000)"
            - "cascade link: Clinic.${clinic_id}.status == SUSPENDED without any direct write to the clinic"
            - "each close returned the CLOSED CommitmentPeriod with fulfilled_cents == 0 (no orders exist)"

      - name: proficiency_fail_cascade
        grounds:
          - state_machines.LabTestOrder.ORDERED_to_RESULT_RECORDED
          - state_machines.Analyzer.CURRENT_to_LAPSED
          - calculations.proficiency_verdict
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (RECORD_RESULT, not
          close-commitment-period): the FAIL verdict (link 1) lapses the
          analyzer's proficiency_standing, and the lapse (link 2) makes the
          system open a PROFICIENCY_REMEDIATION ServiceCase — after which
          PATIENT testing is rejected with ERR_PROFICIENCY_LAPSED.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE with connectivity ACTIVE and proficiency CURRENT (one PASS on record: expected 200.0, result 205.0)."
            - "A second PROFICIENCY order and a PATIENT order both ORDERED on the same analyzer."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_purchase
            - *pa_approve
            - *pa_activate
            - *mk_analyzer_snupt1
            - &analyzer_fully_online
              call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE", connectivity_status: "ACTIVE" }
              as: FieldServiceEngineer
            - &mk_proficiency_order
              call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PROFICIENCY", test_code: "PROF-CHEM", analyzer_id: "${an_id}", expected_result: 200.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_prof1: $.data.id }
            - call: "PATCH /api/lab-test-orders/${lto_prof1}"
              payload: { action: "RECORD_RESULT", result_value: 205.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PROFICIENCY", test_code: "PROF-CHEM", analyzer_id: "${an_id}", expected_result: 200.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_prof2: $.data.id }
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PATIENT", test_code: "CBC", analyzer_id: "${an_id}" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_patient: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_prof2}"
              payload: { action: "RECORD_RESULT", result_value: 230.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/lab-test-orders/${lto_prof2}/results"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { verdict2: "$.data[0].verdict" }
            - call: "GET /api/analyzers/${an_id}/service-cases"
              payload: {}
              as: FieldServiceEngineer
            - call: "PATCH /api/lab-test-orders/${lto_patient}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { patient_err: $.data.error_id }
          assert:
            - "LabResult verdict == FAIL (|230.0 - 200.0| = 30.0 > 0.05 * 200.0 = 10.0)"
            - "Analyzer.${an_id}.proficiency_standing == LAPSED (was CURRENT before the FAIL)"
            - "GET service-cases returns exactly 1 row with case_type == PROFICIENCY_REMEDIATION and status == OPEN — created by the cascade, not by an API call"
            - "downstream gate: the PATIENT RECORD_RESULT is rejected with 409 ERR_PROFICIENCY_LAPSED"
            - "LabTestOrder.${lto_patient}.status remains ORDERED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_waived_period_payment
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors.ERR_PERIOD_INVALID_STATE
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
        distinguishing_aspect: |
          Category pair state (p6) vs business_fiscal (p10): the payment hits
          a WAIVED period (state violation) AND a wrong amount (fiscal
          violation); the 409 ERR_PERIOD_INVALID_STATE must win over the 402
          ERR_PAYMENT_AMOUNT_MISMATCH because state outranks fiscal.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-02; clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c)."
            - "Period 2026-09 CLOSED with billed_cents 80000 (billing ISSUED); then waived: caseload raised to 1400, renegotiation requested (version 4) and resolved with accept=true, new_minimum_cents 120000, waive_period_ids covering the period (version 5)."
            - "The period's billing_status is now WAIVED."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1_id: "$.data[0].id" }
            - *clock_oct2
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
            - *clinic_caseload_1400
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { reneg_v: $.data.version }
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: true, new_minimum_cents: 120000, waive_period_ids: ["${cp1_id}"], expected_agreement_version: "${reneg_v}" }
              as: FinanceReviewer
          trigger:
            - call: "POST /api/commitment-periods/${cp1_id}/record-payment"
              payload: { amount_cents: 1 }
              as: FinanceReviewer
              captures: { pay_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PERIOD_INVALID_STATE (billing_status WAIVED fails the state check)"
            - "error_id != ERR_PAYMENT_AMOUNT_MISMATCH although amount_cents 1 != billed_cents 80000 — fiscal priority 10 loses to state priority 6"
            - "the period remains WAIVED and PlacementAgreement.${pa_id}.cumulative_unpaid_billed_cents == 0 (the waiver stands)"

      - name: referential_beats_temporal_on_gpa_create
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_UNKNOWN_SKU
          - errors.ERR_PRICING_AGREEMENT_WINDOW_OVERLAP
        distinguishing_aspect: |
          Category pair business_referential (p5) vs business_temporal (p8) —
          a different pair from state/fiscal: the create carries an unknown
          override sku AND a window overlapping an existing agreement for the
          same group key; 400 ERR_UNKNOWN_SKU must win over 409
          ERR_PRICING_AGREEMENT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "One ACTIVE CORPORATE GPA for group CORP-X with window [2026-09-01, 2027-03-01)."
          setup_api_calls:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-X", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { gpa1: $.data.id }
          trigger:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-X", effective_from: "2027-02-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z", discount_pct: 0.10, sku_overrides: [{ sku: "NOPE_SKU", unit_price_cents: 1 }] }
              as: PlatformAdmin
              captures: { gpa_err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_UNKNOWN_SKU (sku NOPE_SKU absent from PRICE_TABLE)"
            - "error_id != ERR_PRICING_AGREEMENT_WINDOW_OVERLAP although [2027-02-01, 2027-06-01) overlaps [2026-09-01, 2027-03-01) — referential priority 5 beats temporal priority 8"
            - "GET /api/group-pricing-agreements?group_code=CORP-X still returns exactly 1 row (nothing persisted)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: caseload_delta_exactly_thirty_percent
        grounds:
          - calculations.renegotiation_terms
          - state_machines.PlacementAgreement.ACTIVE_to_RENEGOTIATION
          - errors.ERR_RENEGOTIATION_CASELOAD_DELTA_INSUFFICIENT
        distinguishing_aspect: |
          Boundary on the caseload-ratio metric via request-renegotiation:
          delta exactly 0.30 of the 1000-test snapshot (current 1300) PASSES
          the gate because the comparison is >=, while 1299 (0.299) is
          rejected with 422.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic (baseline == current == 1000) with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c, snapshot 1000)."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 1299 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { gate_err: $.data.error_id }
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 1300 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_status: $.data.status }
          assert:
            - "at 1299 the response is 422 with error_id == ERR_RENEGOTIATION_CASELOAD_DELTA_INSUFFICIENT (abs(1299-1000)/1000 = 0.299 < 0.30)"
            - "the agreement stayed ACTIVE after the rejection"
            - "at exactly 1300 the request succeeds: status == RENEGOTIATION (0.30 boundary is inclusive)"
            - "proposed_minimum_cents == 130000 (round_half_up(100000 * 1.30))"

      - name: gpa_window_adjacency_half_open
        grounds:
          - calculations.term_and_window_intervals
          - errors.ERR_PRICING_AGREEMENT_WINDOW_OVERLAP
          - entities.GroupPricingAgreement.fields.effective_to
        distinguishing_aspect: |
          Boundary on a TIMESTAMP metric via POST /api/group-pricing-agreements
          (different metric and endpoint from the caseload ratio): a window
          starting one second before the incumbent's effective_to overlaps and
          is rejected, while effective_from == effective_to is legal adjacency
          under half-open semantics.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "One ACTIVE CORPORATE GPA for group CORP-B with window [2026-09-01T00:00:00Z, 2027-03-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-B", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z", discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { gpa_b1: $.data.id }
          trigger:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-B", effective_from: "2027-02-28T23:59:59Z", effective_to: "2027-06-01T00:00:00Z", discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { adj_err: $.data.error_id }
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-B", effective_from: "2027-03-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z", discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { gpa_b2: $.data.id, gpa_b2_status: $.data.status }
          assert:
            - "one second early: 409 ERR_PRICING_AGREEMENT_WINDOW_OVERLAP (2027-02-28T23:59:59Z < 2027-03-01T00:00:00Z intrudes into the incumbent window)"
            - "exactly at effective_to: 201 created — half-open adjacency is not an overlap"
            - "the adjacent agreement's status == DRAFT (effective_from 2027-03-01 is after the 2026-09-01 logical clock)"
            - "GET /api/group-pricing-agreements?group_code=CORP-B returns exactly 2 rows"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: record_result_requires_analyzer_readiness
        grounds:
          - state_machines.LabTestOrder.ORDERED_to_RESULT_RECORDED
          - validations[priority=7]
          - errors.ERR_CONNECTIVITY_NOT_ACTIVE
          - errors.ERR_PROFICIENCY_LAPSED
        distinguishing_aspect: |
          LabTestOrder transitions gated on a DIFFERENT entity (Analyzer):
          with the analyzer IN_SERVICE and connectivity ACTIVE but proficiency
          LAPSED (factory state), RECORD_RESULT fails 409
          ERR_PROFICIENCY_LAPSED; after connectivity drops to DEGRADED the
          same call fails earlier in the pinned gate order with
          ERR_CONNECTIVITY_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE with connectivity ACTIVE; proficiency_standing still LAPSED (no proficiency order has ever passed)."
            - "An IN_CLINIC PATIENT order is ORDERED on that analyzer."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_purchase
            - *pa_approve
            - *pa_activate
            - *mk_analyzer_snupt1
            - *analyzer_fully_online
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PATIENT", test_code: "CBC", analyzer_id: "${an_id}" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_id: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { err_prof: $.data.error_id }
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { connectivity_status: "DEGRADED" }
              as: FieldServiceEngineer
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { err_conn: $.data.error_id }
          assert:
            - "first attempt: 409 ERR_PROFICIENCY_LAPSED (analyzer IN_SERVICE and connectivity ACTIVE pass; proficiency gate fails)"
            - "second attempt: 409 ERR_CONNECTIVITY_NOT_ACTIVE (connectivity DEGRADED fails earlier in the pinned gate order: operational -> connectivity -> proficiency)"
            - "LabTestOrder.${lto_id}.status remains ORDERED and no LabResult exists (GET results returns 0 rows)"

      - name: activate_requires_clinic_active
        grounds:
          - state_machines.PlacementAgreement.APPROVED_to_ACTIVE
          - validations[priority=6]
          - errors.ERR_CLINIC_NOT_ACTIVE
        distinguishing_aspect: |
          PlacementAgreement activation gated on a DIFFERENT entity pair than
          record_result_requires_analyzer_readiness (agreement -> clinic
          instead of test-order -> analyzer): approving succeeds while the
          clinic is healthy, but after the clinic is SUSPENDED the activate
          call fails 409 ERR_CLINIC_NOT_ACTIVE and the agreement stays
          APPROVED.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic created ACTIVE; a REAGENT_COMMITMENT agreement drafted and APPROVED while the clinic was healthy; the clinic is then SUSPENDED by PlatformAdmin."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { act_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CLINIC_NOT_ACTIVE"
            - "PlacementAgreement.${pa_id}.status remains APPROVED and no CommitmentPeriods were created (GET commitment-periods returns 0 rows)"
            - "the approval (a different transition) was NOT blocked by the later clinic suspension — the dependency is checked at activation time"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: gpa_window_overlap_keyed_on_group_type
        grounds:
          - calculations.term_and_window_intervals
          - errors.ERR_PRICING_AGREEMENT_WINDOW_OVERLAP
          - entities.GroupPricingAgreement.fields.group_type
        distinguishing_aspect: |
          HALF-OPEN interval occupation on the (group_type, group_code)
          resource: an interior overlap on the same key is rejected, while the
          IDENTICAL window under the other group_type is accepted — the
          occupation is keyed on the pair, not the code alone.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "One ACTIVE BUYING GPA for group BUY-Z with window [2026-09-01T00:00:00Z, 2027-09-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "BUYING", group_code: "BUY-Z", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", discount_pct: 0.20 }
              as: PlatformAdmin
              captures: { gpa_z1: $.data.id }
          trigger:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "BUYING", group_code: "BUY-Z", effective_from: "2027-06-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", discount_pct: 0.25 }
              as: PlatformAdmin
              captures: { ovl_err: $.data.error_id }
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "BUY-Z", effective_from: "2027-06-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", discount_pct: 0.25 }
              as: PlatformAdmin
              captures: { gpa_z2: $.data.id }
          assert:
            - "same key, interior overlap: 409 ERR_PRICING_AGREEMENT_WINDOW_OVERLAP ([2027-06-01, 2028-01-01) intersects [2026-09-01, 2027-09-01))"
            - "same window but group_type CORPORATE: 201 created — the occupied resource is the (group_type, group_code) pair"
            - "GET /api/group-pricing-agreements?group_code=BUY-Z returns exactly 2 rows"

      - name: placement_term_overlap_closed_interval
        grounds:
          - calculations.term_and_window_intervals
          - errors.ERR_PLACEMENT_TERM_OVERLAP
          - state_machines.PlacementAgreement.APPROVED_to_ACTIVE
        distinguishing_aspect: |
          CLOSED-interval occupation on a different resource (clinic_id +
          model placement terms): a successor whose start_date equals the
          incumbent's end_date CONFLICTS (both endpoints inclusive) — the
          opposite boundary behavior from the GPA half-open window.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with an ACTIVE REAGENT_COMMITMENT agreement for model VETCHEM_300, term [2026-09-01, 2028-09-01] (24 months, both ends inclusive)."
            - "A second agreement for the same clinic + model with start_date 2028-09-01T00:00:00Z has been drafted and APPROVED."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2028-09-01T00:00:00Z", monthly_minimum_cents: 100000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa2_id: $.data.id }
            - call: "POST /api/placement-agreements/${pa2_id}/approve"
              payload: {}
              as: FinanceReviewer
          trigger:
            - call: "POST /api/placement-agreements/${pa2_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ovl_err: $.data.error_id }
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2030-09-02T00:00:00Z", monthly_minimum_cents: 100000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa3_id: $.data.id }
            - call: "POST /api/placement-agreements/${pa3_id}/approve"
              payload: {}
              as: FinanceReviewer
            - call: "POST /api/placement-agreements/${pa3_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { pa3_status: $.data.status }
          assert:
            - "touching endpoints conflict: activating [2028-09-01, 2030-09-01] against [2026-09-01, 2028-09-01] returns 409 ERR_PLACEMENT_TERM_OVERLAP (closed interval — start == existing end_date collides)"
            - "PlacementAgreement.${pa2_id}.status remains APPROVED after the rejected activation"
            - "the non-overlapping [2030-09-02, 2032-09-02] agreement activates: status == ACTIVE"
            - "PlacementAgreement.${pa_id}.status remains ACTIVE and its version is unchanged"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_conserves_commitment_fulfillment
        grounds:
          - state_machines.ReagentOrder.SUBMITTED_to_CANCELLED
          - calculations.commitment_fulfillment
          - entities.PlacementAgreement.fields.cumulative_billed_cents
        distinguishing_aspect: |
          Conserved quantity: the commitment fulfillment total. Creating and
          then cancelling a SUBMITTED order is a forward/compensating pair
          that must leave both the OPEN period's provisional_fulfilled_cents
          and the set of FULFILLED orders exactly as before (42000c from the
          one fulfilled order).
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c)."
            - "Order F (100 x VC300_CHEM_SLIDE = 42000c, order_month 2026-09) is FULFILLED; the OPEN 2026-09 period reads provisional_fulfilled_cents == 42000."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 100 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_f: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro_f}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { prov_before: "$.data[0].provisional_fulfilled_cents" }
          trigger:
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VH500_CBC_CART", quantity: 10 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_x: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro_x}"
              payload: { status: "CANCELLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { prov_after: "$.data[0].provisional_fulfilled_cents" }
            - call: "GET /api/reagent-orders"
              payload: { agreement_id: "${pa_id}", status: "FULFILLED" }
              as: FinanceReviewer
          assert:
            - "before create+cancel: provisional_fulfilled_cents == 42000"
            - "after create+cancel: provisional_fulfilled_cents == 42000 — the compensated pair left the commitment total unchanged (SUBMITTED never counted; CANCELLED never counts)"
            - "ReagentOrder.${ro_x}.status == CANCELLED and its 8900c never entered any attribution"
            - "GET /api/reagent-orders?status=FULFILLED returns exactly 1 row — ReagentOrder.${ro_f} with final_total_cents == 42000"

      - name: renegotiation_reject_conserves_terms_and_billing
        grounds:
          - state_machines.PlacementAgreement.RENEGOTIATION_to_ACTIVE
          - entities.PlacementAgreement.fields.monthly_minimum_cents
          - entities.PlacementAgreement.fields.cumulative_billed_cents
        distinguishing_aspect: |
          Conserved quantity: billed revenue plus contracted terms (different
          quantity from order_cancel_conserves_commitment_fulfillment). A
          request-then-reject round trip must leave monthly_minimum_cents ==
          100000, cumulative_billed_cents == 80000 and the ISSUED bill intact
          — only status and version move.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-02T00:00:00Z."
            - "Clinic (snapshot 1000, current 1400) with ACTIVE REAGENT_COMMITMENT agreement, minimum 100000c."
            - "Period 2026-09 CLOSED: billed_cents 80000, billing ISSUED; agreement cumulative_billed_cents == cumulative_unpaid_billed_cents == 80000; agreement version 4 after request-renegotiation."
          setup_api_calls:
            - *mk_clinic_plain
            - *mk_pa_rc100
            - *pa_approve
            - *pa_activate
            - *clock_oct2
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
            - *clinic_caseload_1400
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { reneg_v: $.data.version }
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: false, expected_agreement_version: "${reneg_v}" }
              as: FinanceReviewer
              captures: { pa_after: $.data.monthly_minimum_cents }
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1_billing: "$.data[0].billing_status", cp1_billed: "$.data[0].billed_cents" }
          assert:
            - "PlacementAgreement.${pa_id}.status == ACTIVE (reject restores the pre-request state)"
            - "monthly_minimum_cents == 100000 — unchanged by the rejected renegotiation"
            - "cumulative_billed_cents == 80000 and cumulative_unpaid_billed_cents == 80000 — billed revenue conserved"
            - "period 2026-09 still billing_status == ISSUED with billed_cents == 80000 (no waiver without waive_period_ids)"
            - "proposed_minimum_cents is null after the resolve"
