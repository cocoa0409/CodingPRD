            - call: "GET /plan-review/engagements/${eng_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { unresolved_after_reopen: $.data.unresolved_comment_count }
          assert:
            - "${unresolved_after_response} == 1 (OPEN -> ADDRESSED does not decrement; ADDRESSED is unresolved)"
            - "${unresolved_after_reopen} == 1 (ADDRESSED -> REOPENED conserves the count)"
            - "DeficiencyComment.${com1}.status == REOPENED — the pair response+reopen left the named quantity unchanged"
