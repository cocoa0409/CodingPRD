            - "Second trigger: HTTP 409 with error_id == ERR_DUPLICATE_HOURS_MONTH"
            - "GET /ale-reporting/hours-records?employee_id=${emp_id}&measurement_year=2026 still returns total_count == 12 and month 12 still reads hours_of_service 120, not 90"

      - name: attach_forms_cross_member_scope_mismatch_rejected
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/ale-reporting/transmittals/{transmittal_id}/attach-forms
          - validations.priority_6
          - errors.ERR_SCOPE_MISMATCH
