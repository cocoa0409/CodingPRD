            - "e_mr == ERR_MILL_RUN_NOT_FOUND; e_pr == ERR_PACKAGING_RUN_NOT_FOUND; e_bo == ERR_BYPRODUCT_ORDER_NOT_FOUND"
            - "e_fum == ERR_FUMIGATION_NOT_FOUND; e_hold == ERR_HOLD_NOT_FOUND; e_st == ERR_SETTLEMENT_NOT_FOUND"
            - "all responses HTTP 404 with the standard error envelope (meta + response_type error)"

      - name: error_state_vs_capacity_priority_covered
        claim_type: priority_ordering
        grounds: ["errors[ERR_SEASON_INTAKE_NOT_OPEN]", "errors[ERR_SPOT_CAP_REACHED]"]
        excluded_because:
          difficulty_instance: season_state_beats_spot_cap_constraint
          rationale: "Dual-failure priority between state (P6) and fiscal/capacity (P11) is asserted there."

      - name: error_hold_vs_variety_priority_covered
        claim_type: priority_ordering
        grounds: ["errors[ERR_ACTIVE_HOLD_BLOCKS_OPERATION]", "errors[ERR_BIN_VARIETY_MISMATCH]"]
        excluded_because:
          difficulty_instance: hold_safety_beats_variety_constraint
          rationale: "Safety-vs-constraint priority asserted there; pure variety mismatch asserted in corner variety_lock_mismatch_rejected."

      - name: error_bin_state_vs_window_priority_covered
        claim_type: priority_ordering
        grounds: ["errors[ERR_BIN_FUMIGATION_ACTIVE]", "errors[ERR_FUMIGATION_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: bin_state_beats_fumigation_window_overlap
          rationale: "State-vs-temporal priority asserted there; pure window overlap asserted in fumigation_half_open_adjacency_allowed."

      - name: error_boundaries_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_NOT_OPEN]", "errors[ERR_AERATION_INCOMPLETE]", "errors[ERR_BIN_CAPACITY_EXCEEDED]", "errors[ERR_SEASON_NOT_SETTLEMENT_REVIEW]"]
        excluded_because:
          difficulty_instance: contract_exactly_fulfilled_at_100_percent
          rationale: "Boundary-triggered error ids are asserted across the four boundary_precision_check instances (contract_exactly_fulfilled_at_100_percent, fumigation_clearance_at_exact_second, bin_exact_capacity_fit, settlement_approve_gated_by_season_review)."

