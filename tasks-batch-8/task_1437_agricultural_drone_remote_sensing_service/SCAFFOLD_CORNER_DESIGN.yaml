scaffold_corner_design:

  # ===========================================================================
  # Section: entities (Table 1) — creation, defaults, computed fields, FK integrity
  # ===========================================================================
  - section: entities
    instances:
      - name: grower_creation_sets_computed_defaults
        claim_type: computed_field_correctness
        grounds: [entities.Grower]
        distinguishing_aspect: "POST /growers initializes status=ACTIVE, acres_included_ytd=0, credit_balance_cents=0 regardless of any client-supplied values for those fields."
        test_recipe:
          setup: ["Plan P exists"]
          setup_api_calls:
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 100, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "D Farms", contact_email: "d@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id, st: $.data.status, acres: $.data.acres_included_ytd, bal: $.data.credit_balance_cents }
          assert:
            - "st == ACTIVE"
            - "acres == 0"
            - "bal == 0"

      - name: field_laanc_required_computed_from_airspace_class
        claim_type: computed_field_correctness
        grounds: [entities.Field.fields.laanc_required]
        distinguishing_aspect: "airspace_class=G -> laanc_required=false; airspace_class=B -> laanc_required=true. Computed at field creation and immutable."
        test_recipe:
          setup: ["Plan P; Grower G"]
          setup_api_calls:
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 100, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "L Farms", contact_email: "l@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
          trigger:
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "G-class", legal_acres: 50, airspace_class: "G", insurance_policy_no: "P1" }
              as: OpsAdmin
              captures: { g_laanc: $.data.laanc_required }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "B-class", legal_acres: 50, airspace_class: "B", insurance_policy_no: "P2" }
              as: OpsAdmin
              captures: { b_laanc: $.data.laanc_required }
          assert:
            - "g_laanc == false"
            - "b_laanc == true"

      - name: field_creation_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds:
          - "entities.Field"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required legal_acres returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Plan P; Grower G"]
          setup_api_calls:
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 100, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "M Farms", contact_email: "m@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
          trigger:
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "Bad", airspace_class: "G", insurance_policy_no: "PX" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: spray_record_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.SprayMissionRecord"
        distinguishing_aspect: "SprayMissionRecord has common_fields: false (no updated_at, no version), and §1.5 declares no POST/PUT/PATCH/DELETE endpoint targeting it; the only accessor is the GET sub-resource. The immutability claim is enforced by the absence of any write route in §1.5 — verified by inspection of the endpoint table, not by an executable HTTP call. This corner is therefore a design-time claim only and intentionally carries no test_recipe."
        excluded_because:
          difficulty_instance: compensating_invariant / grower_credit_balance_payout_vs_invoice_invariant
          rationale: "SprayMissionRecord's snapshot semantics are exercised indirectly by spray_mission_complete_creates_immutable_record; no write endpoint exists in §1.5 for SprayMissionRecord, so an executable 'reject update' trigger cannot be constructed without declaring a route that would not exist in the real system. The absence of a write route IS the testable claim."

  # ===========================================================================
  # Section: state_machines (Table 2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: mission_cancel_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.FlightMission"
          - "errors[ERR_MISSION_NOT_CANCELLABLE]"
        distinguishing_aspect: "Cancelling a COMPLETED mission must fail; COMPLETED is terminal."
        test_recipe:
          setup: ["Full mission run to COMPLETED"]
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "IC Farms", contact_email: "ic@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-IC" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot T", part107_certificate_no: "P107-T", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m_id}/capture"
              payload: { acres_flown: 50, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
          trigger:
            - call: "POST /ag-drone/missions/${m_id}/cancel"
              payload: {}
              as: FlightCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSION_NOT_CANCELLABLE or err == ERR_INVALID_STATE"

      - name: alert_review_by_non_claiming_agronomist_forbidden
        claim_type: invalid_transition
        grounds:
          - "state_machines.ScoutingAlert"
          - "errors[ERR_NOT_CLAIMING_AGRONOMIST]"
        distinguishing_aspect: "Alert claimed by agronomist A1; review attempted by a different agronomist A2 must fail ERR_NOT_CLAIMING_AGRONOMIST."
        test_recipe:
          setup: ["Alert claimed by pilot_ag1"]
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "NCA Farms", contact_email: "nca@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-NCA" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Fly Pilot", part107_certificate_no: "P107-FLY", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_fly_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Agr1", part107_certificate_no: "P107-A1", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_ag1_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Agr2", part107_certificate_no: "P107-A2", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_ag2_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_fly_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 100 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_fly_id}"
            - call: "POST /ag-drone/missions/${m_id}/capture"
              payload: { acres_flown: 100, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_fly_id}"
            - call: "POST /ag-drone/missions/${m_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            - call: "GET /ag-drone/missions/${m_id}/deliverables"
              payload: {}
              as: ProcessingEngine
              captures: { d_id: "$.data[0].id" }
            - call: "POST /ag-drone/deliverables/${d_id}/process"
              payload: { ndvi_mean: 0.500, cells_below_threshold: 1000 }
              as: ProcessingEngine
            - call: "GET /ag-drone/fields/${field_id}/alerts"
              payload: {}
              as: Agronomist
              captures: { alert_id: "$.data[0].id" }
            - call: "POST /ag-drone/alerts/${alert_id}/claim"
              payload: {}
              as: Agronomist
              as_user_id: "${pilot_ag1_id}"
          trigger:
            - call: "POST /ag-drone/alerts/${alert_id}/review"
              payload: { review_outcome: "CONFIRMED", review_notes: "fraud attempt" }
              as: Agronomist
              as_user_id: "${pilot_ag2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_CLAIMING_AGRONOMIST"

      - name: terminal_claim_cannot_be_reopened
        claim_type: terminal_state_lockdown
        grounds: [state_machines.InsuranceClaim]
        distinguishing_aspect: "A DENIED claim is terminal; open-review on it must fail."
        test_recipe:
          setup: ["Claim C in DENIED"]
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 0, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "TC Farms", contact_email: "tc@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-TC" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot U", part107_certificate_no: "P107-U", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 10 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m_id}/capture"
              payload: { acres_flown: 10, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            - call: "POST /ag-drone/growers/${grower_id}/claims"
              payload: { mission_id: "${m_id}", claim_amount_cents: 1000 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { c_id: $.data.id }
            - call: "POST /ag-drone/claims/${c_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /ag-drone/claims/${c_id}/deny"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /ag-drone/claims/${c_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_NOT_SUBMITTED or err == ERR_INVALID_STATE"

      - name: grower_terminate_with_in_flight_mission_blocked
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Grower.SUSPENDED_to_TERMINATED"
          - "errors[ERR_MISSION_IN_FLIGHT]"
        distinguishing_aspect: "Terminate blocked while any of grower's missions is IN_FLIGHT."
        test_recipe:
          setup: ["Grower G SUSPENDED; but one mission IN_FLIGHT (created before suspension)"]
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 100, base_fee_cents: 0, overage_rate_cents_per_acre: 100, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 30 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "TermFarms", contact_email: "t@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-T" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot V", part107_certificate_no: "P107-V", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 10 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            # Suspend while IN_FLIGHT (suspend does not cancel IN_FLIGHT per state machine)
            - call: "POST /ag-drone/growers/${grower_id}/suspend"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /ag-drone/growers/${grower_id}/terminate"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSION_IN_FLIGHT"

  # ===========================================================================
  # Section: calculations (Table 3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: severity_threshold_medium_at_exactly_10
        claim_type: threshold_boundary
        grounds: [calculations.anomaly_scoring]
        distinguishing_aspect: "Severity ladder is inclusive at lower bound: anomaly_count=10 -> MEDIUM (not LOW); anomaly_count=9 -> LOW."
        test_recipe:
          setup: ["Two missions produce anomaly_count 9 and 10 respectively"]
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "ThreshFarms", contact_email: "th@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-TH" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot W", part107_certificate_no: "P107-W", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            # M9: acres_flown=10, cells_below=900 -> anomaly_count = round_half_up(900*10/1000) = 9
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 10 }
              as: FlightCoordinator
              captures: { m9_id: $.data.id }
            - call: "POST /ag-drone/missions/${m9_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m9_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m9_id}/capture"
              payload: { acres_flown: 10, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m9_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            - call: "GET /ag-drone/missions/${m9_id}/deliverables"
              payload: {}
              as: ProcessingEngine
              captures: { d9_id: "$.data[0].id" }
            - call: "POST /ag-drone/deliverables/${d9_id}/process"
              payload: { ndvi_mean: 0.500, cells_below_threshold: 900 }
              as: ProcessingEngine
            # M10: acres_flown=10, cells_below=1000 -> anomaly_count = 10
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", scheduled_start: "2026-06-03T08:00:00Z", scheduled_end: "2026-06-03T10:00:00Z", acres_planned: 10 }
              as: FlightCoordinator
              captures: { m10_id: $.data.id }
            - call: "POST /ag-drone/missions/${m10_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m10_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m10_id}/capture"
              payload: { acres_flown: 10, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_id}"
            - call: "POST /ag-drone/missions/${m10_id}/complete"
              payload: { deliverable_kinds: ["NDVI"] }
              as: FlightCoordinator
            - call: "GET /ag-drone/missions/${m10_id}/deliverables"
