  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- #1: premium money conservation across bind→cancel(refund) ----------
      - name: premium_money_conserved_bind_charge_minus_refund
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - state_machines.Policy.BOUND_to_CANCELLED
          - entities.PremiumLedgerEntry.fields.amount_cents
          - calculations.cancellation_refund
        distinguishing_aspect: "Conserved quantity #1 = carrier net premium balance (cents). Invariant: sum of PremiumLedgerEntry.amount_cents over the policy == Policy.premium_earned_cents after a free-look cancel; full-refund free-look leaves net 0 (PREMIUM_CHARGE +128000 then REFUND -128000)."
        test_recipe:
          setup:
            - "Bound paid policy total_premium_cents=128000 (CANC+LIAB+RINGS); clock day 9 (free-look); ledger holds one PREMIUM_CHARGE of +128000."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "CANCELLATION", tier: "STANDARD", base_premium_cents: 20000, per_guest_premium_cents: 300, coverage_limit_cents: 5000000, deposit_sublimit_pct: 0.5 }
              as: PlatformAdmin
              captures: { canc_prod_id: $.data.id }
            - call: "POST /coverage-products"
              payload: { coverage_type: "LIABILITY", tier: "STANDARD", base_premium_cents: 15000, per_guest_premium_cents: 200, coverage_limit_cents: 2000000, deposit_sublimit_pct: 1.0 }
              as: PlatformAdmin
              captures: { liab_prod_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Grand Hall", category: "VENUE", deposit_paid_cents: 800000 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false, free_look_days: 15 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/event-profiles"
              payload: { event_name: "Smith Wedding", venue_vendor_id: "${venue_id}", expected_attendance: 150, event_start_at: "2026-08-01T18:00:00Z", event_end_at: "2026-08-01T23:00:00Z" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${liab_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/riders"
              payload: { rider_type: "RINGS", scheduled_value_cents: 1200000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 128000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /policies/${policy_id}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "ph-1"
          assert:
            - "sum(PremiumLedgerEntry.amount_cents where policy_id==${policy_id}) == 0"
            - "Policy.${policy_id}.premium_earned_cents == 0"
            - "Policy.${policy_id}.refund_due_cents == 128000"

      # --- #2: coverage-limit conservation across approve→pay -----------------
      - name: coverage_limit_conserved_remaining_plus_consumed_plus_payout
        grounds:
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - state_machines.Claim.APPROVED_to_PAID
          - calculations.claim_indemnity
          - entities.Coverage.fields.consumed_limit_cents
        distinguishing_aspect: "Conserved quantity #2 = coverage indemnity capacity (different conserved quantity than carrier money): after approve+pay, Coverage.consumed_limit_cents (2000000) + remaining (0) == product.coverage_limit_cents (2000000), and the INDEMNITY_PAYOUT ledger entry equals -consumed (-2000000)."
        test_recipe:
          setup:
            - "In-force policy with ACTIVE LIABILITY coverage (limit 2000000); a PROPERTY claim claimed 2000000 SUBMITTED with a document, then APPROVED."
          setup_api_calls:
