# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Natural Gas Meter Set & Service Line Installation
# 9 rules × ≥2 instances = 21 instances total (R3/R6/R7 carry 3 each)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ciac_provisional_vs_final_trueup_diverge
        grounds:
          - calculations.ciac_provisional
          - calculations.ciac_final_true_up
          - state_machines.MainExtension.AS_BUILT_RECORDED_to_FINALIZED
          - entities.MainExtension.fields.ciac_delta_cents
        distinguishing_aspect: |
          FISCAL domain (MainExtension/CIACInvoice): identical application, but the provisional
          variant (design footage 200 ft @ standard 4500¢, expected rock=false) yields
          total_due 322785¢ while the final variant (as-built 220 ft @ actual 4750¢, rock=true,
          3 crossings) yields 1082278¢ — a delta of +759493¢ that reopens the PAID invoice to ISSUED.
        test_recipe:
          setup:
            - "clock at 2026-08-01T09:00:00Z; builder ACTIVE; application with 2 loads (FURNACE 80000, WATER_HEATER 40000) at CIAC_PENDING"
            - "MainExtension ACCEPTED with design_footage_ft=200, 2 ASPHALT crossings, rock=false: provisional_net_ciac_cents=255000, provisional_gross_up_cents=67785, provisional_total_due_cents=322785"
            - "CIACInvoice PAID with payments_applied_cents=322785 (clerk-b); crew booking COMPLETED so application is SERVICE_INSTALLED and extension CONSTRUCTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", pressure_class_requested: "LOW", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: WATER_HEATER, quantity: 1, btuh_input_rating: 40000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }, { surface_type: ASPHALT, length_ft: 8.0, width_ft: 3.0 }], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "GET /ciac-invoices?main_extension_id=${me_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-b"
              captures: { ci_id: "$.data[0].id" }
            - { call: "POST /main-extensions/${me_id}/accept-quote", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /ciac-invoices/${ci_id}/payments", payload: { amount_cents: 322785, method: "ACH" }, as: BillingClerk, as_user_id: "clerk-b" }
            - call: "POST /permits"
              payload: { service_application_id: "${app_id}", permit_type: ROAD_CUT, jurisdiction: "City of Springfield", crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }] }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { p_id: $.data.id }
            - { call: "POST /permits/${p_id}/file", payload: {}, as: PermitCoordinator, as_user_id: "perm-1" }
            - { call: "POST /permits/${p_id}/record-decision", payload: { decision: APPROVED, expires_at: "2026-12-31" }, as: PermitCoordinator, as_user_id: "perm-1" }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: MAIN_EXTENSION, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 1020, scope: MAIN_CONSTRUCTION }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_id: $.data.id }
            - { call: "POST /crew-bookings/${bk_id}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /service-applications/${app_id}/schedule-construction", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /crew-bookings/${bk_id}/complete", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /main-extensions/${me_id}/record-as-built"
              payload: { actual_footage_ft: 220, actual_unit_cost_cents: 4750, actual_rock_excavation: true, actual_crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }, { surface_type: ASPHALT, length_ft: 8.0, width_ft: 3.0 }, { surface_type: CONCRETE, length_ft: 5.0, width_ft: 3.0 }] }
              as: FieldSupervisor
              as_user_id: "sup-1"
          trigger:
            - { call: "POST /main-extensions/${me_id}/finalize", payload: {}, as: BillingClerk, as_user_id: "clerk-b" }
            - call: "GET /ciac-invoices/${ci_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-b"
              captures: { inv_status: $.data.status }
          assert:
            - "MainExtension.${me_id}.status == FINALIZED"
            - "MainExtension.${me_id}.provisional_total_due_cents == 322785 (variant 1: design-based)"
            - "MainExtension.${me_id}.final_net_ciac_cents == 855000 (variant 2: as-built 220×4750 + 3×15000 + 220×2000 − 675000)"
            - "MainExtension.${me_id}.final_gross_up_cents == 227278"
            - "MainExtension.${me_id}.final_total_due_cents == 1082278"
            - "MainExtension.${me_id}.ciac_delta_cents == 759493 (provisional != final for the same application)"
            - "CIACInvoice.${ci_id}.status == ISSUED (delta > 0 reopens the PAID invoice)"
            - "CIACInvoice.${ci_id}.amount_due_cents == 1082278"
            - "CIACInvoice.${ci_id}.balance_due_cents == 759493"
            - "CIACInvoice.${ci_id}.payments_applied_cents == 322785 (unchanged by true-up)"

      - name: commitment_dual_date_variants
        grounds:
          - calculations.commitment_dates
          - entities.TimelineCommitment.fields.optimistic_completion_date
          - entities.TimelineCommitment.fields.conservative_completion_date
          - state_machines.MainExtension.DESIGN_SUBMITTED_to_QUOTED
        distinguishing_aspect: |
          TEMPORAL domain (TimelineCommitment): one approve-design produces two valid completion
          dates from the same footage — optimistic 2026-08-18 (10-day permit minimum, 150 ft/day,
          no buffer) vs conservative 2026-09-02 (20-day median, 100 ft/day, +5 buffer); committed
          follows the conservative variant. Distinct entity domain from the CIAC fiscal pair.
        test_recipe:
          setup:
            - "clock at 2026-08-01T09:00:00Z; application LOAD_CONFIRMED...DESIGN with MainExtension DESIGN_SUBMITTED, design_footage_ft=200, crossings_count=2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", pressure_class_requested: "LOW", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }, { surface_type: ASPHALT, length_ft: 8.0, width_ft: 3.0 }], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "GET /timeline-commitments?service_application_id=${app_id}"
              payload: {}
              as: NewBusinessRep
              as_user_id: "rep-1"
              captures: { tc_id: "$.data[0].id" }
          assert:
            - "TimelineCommitment.${tc_id}.base_date == \"2026-08-01\""
            - "TimelineCommitment.${tc_id}.optimistic_completion_date == \"2026-08-18\" (10 + ceil(200/150) + 5 = 17 days)"
            - "TimelineCommitment.${tc_id}.conservative_completion_date == \"2026-09-02\" (20 + ceil(200/100) + 5 + 5 = 32 days)"
            - "TimelineCommitment.${tc_id}.committed_completion_date == \"2026-09-02\" (committed follows conservative variant)"
            - "TimelineCommitment.${tc_id}.status == PROPOSED"
            - "optimistic_completion_date != conservative_completion_date — same inputs, two valid algorithms, different dates"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: ciac_gross_up_evaluation_order
        grounds:
          - calculations.ciac_provisional
          - entities.MainExtension.fields.provisional_gross_up_cents
          - entities.CIACInvoice.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the 21/79 tax gross-up applies to the NET
          contribution AFTER the tariff allowance offsets the construction cost; applying the
          gross-up to the gross cost (930000×21/79 = 247152¢) or skipping the allowance first
          yields different money. Pinned order gives net 255000¢, gross-up 67785¢, total 322785¢.
        test_recipe:
          setup:
            - "clock 2026-08-01; application with 2 appliance rows (allowance = 100 + 25×2 = 150 ft); MainExtension approved with design_footage_ft=200, 2 crossings, rock=false"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: RANGE, quantity: 1, btuh_input_rating: 65000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }, { surface_type: ASPHALT, length_ft: 8.0, width_ft: 3.0 }], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "GET /ciac-invoices?main_extension_id=${me_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-b"
              captures: { ci_due: "$.data[0].amount_due_cents" }
          assert:
            - "MainExtension.${me_id}.allowance_ft == 150"
            - "MainExtension.${me_id}.provisional_base_cost_cents == 900000"
            - "MainExtension.${me_id}.provisional_surcharges_cents == 30000"
            - "MainExtension.${me_id}.provisional_net_ciac_cents == 255000 (930000 − 150×4500)"
            - "MainExtension.${me_id}.provisional_gross_up_cents == 67785 (round_half_up(255000×21/79); NOT 247152 from grossing up the un-offset cost)"
            - "MainExtension.${me_id}.provisional_total_due_cents == 322785"
            - "CIACInvoice amount_due_cents == 322785 (invoice mirrors the pinned-order total)"

      - name: permit_fee_segment_rounding_pinned
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.permit_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: three CONCRETE segments of 1.5 sqft each cost 787.5¢ raw.
          Pinned order rounds each segment first (788×3 = 2364) then adds the 7500¢ filing fee →
          9864¢; the alternative sum-then-round order gives 9863¢. Different mode from the CIAC
          evaluation-order instance.
        test_recipe:
          setup:
            - "clock 2026-08-01; builder + application exist (no loads needed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "9 Oak Ave", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { service_application_id: "${app_id}", permit_type: ROAD_CUT, jurisdiction: "City of Springfield", crossings: [{ surface_type: CONCRETE, length_ft: 1.5, width_ft: 1.0 }, { surface_type: CONCRETE, length_ft: 1.5, width_ft: 1.0 }, { surface_type: CONCRETE, length_ft: 1.5, width_ft: 1.0 }] }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { p_id: $.data.id, p_fee: $.data.permit_fee_cents }
          assert:
            - "Permit.${p_id}.permit_fee_cents == 9864 (3×788 + 7500; per-segment rounding pinned)"
            - "permit_fee_cents != 9863 — the sum-then-round alternative is explicitly not the contract"
            - "Permit.${p_id}.status == DRAFT"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_reject_amend_refile_cycle
        grounds:
          - state_machines.Permit.FILED_to_REJECTED
          - state_machines.Permit.REJECTED_to_DRAFT
          - calculations.permit_fee
        distinguishing_aspect: |
          CYCLIC machine on Permit: FILED→REJECTED→DRAFT→FILED→APPROVED loops back through DRAFT
          (not a one-way pipeline), and the amend hop recomputes the fee from changed crossings
          (13800¢ → 20100¢), proving the cycle re-enters with fresh computed state.
        test_recipe:
          setup:
            - "clock 2026-08-01; builder + DRAFT application; one ROAD_CUT permit in FILED with fee 13800¢ (1 CONCRETE segment 4.0×3.0 → 6300 + 7500)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "9 Oak Ave", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permits"
              payload: { service_application_id: "${app_id}", permit_type: ROAD_CUT, jurisdiction: "City of Springfield", crossings: [{ surface_type: CONCRETE, length_ft: 4.0, width_ft: 3.0 }] }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { p_id: $.data.id, fee0: $.data.permit_fee_cents }
            - { call: "POST /permits/${p_id}/file", payload: {}, as: PermitCoordinator, as_user_id: "perm-1" }
          trigger:
            - { call: "POST /permits/${p_id}/record-decision", payload: { decision: REJECTED, decision_note: "traffic plan missing" }, as: PermitCoordinator, as_user_id: "perm-1" }
            - call: "POST /permits/${p_id}/amend"
              payload: { crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }] }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { fee1: $.data.permit_fee_cents }
            - { call: "POST /permits/${p_id}/file", payload: {}, as: PermitCoordinator, as_user_id: "perm-1" }
            - { call: "POST /permits/${p_id}/record-decision", payload: { decision: APPROVED, expires_at: "2026-12-31" }, as: PermitCoordinator, as_user_id: "perm-1" }
          assert:
            - "Permit.${p_id} visited REJECTED then DRAFT then FILED then APPROVED — the FILED→REJECTED→DRAFT loop closed"
            - "fee after amend == 20100 (1 ASPHALT segment 12×3=36 sqft × 350 = 12600 + 7500)"
            - "fee before amend == 13800"
            - "Permit.${p_id}.status == APPROVED and expires_at == \"2026-12-31\""

      - name: meter_set_fail_repair_retest_cycle
        grounds:
          - state_machines.MeterSet.TESTING_to_REPAIR
          - state_machines.MeterSet.REPAIR_to_INSTALLED
          - state_machines.MeterSet.TESTING_to_READY_FOR_TURN_ON
          - calculations.leak_test_acceptance
        distinguishing_aspect: |
          CYCLIC machine on MeterSet (different entity from Permit): TESTING→REPAIR→INSTALLED→
          TESTING→READY_FOR_TURN_ON — a certified FAIL (drop 0.301 > allowance 0.300) loops the
          asset back through repair, and only a second, passing test (drop == allowance) advances
          it; the application spine follows METER_WORK→TESTING→TURN_ON only after the PASS.
        test_recipe:
          setup:
            - "application SERVICE_INSTALLED; MeterSet ORDERED with serial M-9001; inspector with PRESSURE_TEST certification"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", pressure_class_requested: "LOW", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 100, crossings: [], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - { call: "POST /main-extensions/${me_id}/accept-quote", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: SERVICE_LINE, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 1020, scope: SERVICE_INSTALL }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_id: $.data.id }
            - { call: "POST /crew-bookings/${bk_id}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /service-applications/${app_id}/schedule-construction", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /crew-bookings/${bk_id}/complete", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /meter-sets"
              payload: { service_application_id: "${app_id}" }
              as: MeterTechnician
              as_user_id: "tech-1"
              captures: { ms_id: $.data.id }
            - { call: "POST /meter-sets/${ms_id}/size", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /meter-sets/${ms_id}/mark-ordered", payload: { serial_number: "M-9001" }, as: MeterTechnician, as_user_id: "tech-1" }
            - { call: "POST /meter-sets/${ms_id}/install", payload: {}, as: MeterTechnician, as_user_id: "tech-1" }
            - call: "POST /inspectors"
              payload: { full_name: "Insp Ray", certifications: [PRESSURE_TEST] }
              as: SystemAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /purge-leak-tests"
              payload: { meter_set_id: "${ms_id}", purge_duration_min: 10, test_pressure_psi: 15.0, test_duration_min: 60, observed_pressure_drop_psi: 0.301 }
              as: MeterTechnician
              as_user_id: "tech-1"
              captures: { plt_fail: $.data.id }
            - { call: "POST /purge-leak-tests/${plt_fail}/certify", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /meter-sets/${ms_id}/mark-repaired", payload: {}, as: MeterTechnician, as_user_id: "tech-1" }
            - call: "POST /purge-leak-tests"
              payload: { meter_set_id: "${ms_id}", purge_duration_min: 10, test_pressure_psi: 15.0, test_duration_min: 60, observed_pressure_drop_psi: 0.300 }
              as: MeterTechnician
              as_user_id: "tech-1"
              captures: { plt_pass: $.data.id }
            - { call: "POST /purge-leak-tests/${plt_fail}/certify", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /purge-leak-tests/${plt_pass}/certify", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
          assert:
            - "after certified FAIL: MeterSet.${ms_id} was REPAIR (loop exit from TESTING)"
            - "after mark-repaired: MeterSet.${ms_id}.status == INSTALLED (cycle closed, second pass begins)"
            - "PurgeLeakTest.${plt_pass}.result == PASS and max_allowed_drop_psi == 0.300 (equality passes)"
            - "after certified PASS: MeterSet.${ms_id}.status == READY_FOR_TURN_ON"
            - "ServiceApplication.${app_id}.status == TURN_ON (spine advanced only on the passing loop iteration)"
            - "PurgeLeakTest.${plt_fail}.status == CERTIFIED with result FAIL (historical record preserved)"

      - name: commitment_revision_roundtrip_cycle
        grounds:
          - state_machines.TimelineCommitment.ACCEPTED_to_REVISION_PENDING
          - state_machines.TimelineCommitment.REVISION_PENDING_to_ACCEPTED
          - concurrency_rules[commitment-revision-stale]
        distinguishing_aspect: |
          CYCLIC machine on TimelineCommitment (third distinct entity): ACCEPTED→REVISION_PENDING→
          ACCEPTED can repeat; an ACCEPT decision adopts the builder's date (2026-09-10), a REJECT
          decision round-trips back to ACCEPTED with the date unchanged — same target state, two
          divergent side-effect sets (branching within the cycle).
        test_recipe:
          setup:
            - "application QUOTED with TimelineCommitment PROPOSED (committed 2026-09-02); builder owns the application"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "GET /timeline-commitments?service_application_id=${app_id}"
              payload: {}
              as: Builder
              as_user_id: "${b_id}"
              captures: { tc_id: "$.data[0].id" }
          trigger:
            - call: "POST /timeline-commitments/${tc_id}/accept"
              payload: {}
              as: Builder
              as_user_id: "${b_id}"
              captures: { tc_v2: $.data.version }
            - call: "POST /timeline-commitments/${tc_id}/propose-revision"
              payload: { requested_completion_date: "2026-09-10", expected_commitment_version: "${tc_v2}" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { tc_v3: $.data.version }
            - { call: "POST /timeline-commitments/${tc_id}/respond-revision", payload: { decision: ACCEPT }, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /timeline-commitments/${tc_id}/propose-revision"
              payload: { requested_completion_date: "2026-09-20", expected_commitment_version: "${tc_v3}" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { tc_v5: $.data.version }
            - { call: "POST /timeline-commitments/${tc_id}/respond-revision", payload: { decision: REJECT }, as: NewBusinessRep, as_user_id: "rep-1" }
          assert:
            - "after first ACCEPT decision: committed_completion_date == \"2026-09-10\" (builder date adopted)"
            - "after REJECT decision: TimelineCommitment.${tc_id}.status == ACCEPTED and committed_completion_date still == \"2026-09-10\" (NOT 2026-09-20)"
            - "the cycle ran ACCEPTED→REVISION_PENDING→ACCEPTED→REVISION_PENDING→ACCEPTED — loop with branch-dependent side effects"

