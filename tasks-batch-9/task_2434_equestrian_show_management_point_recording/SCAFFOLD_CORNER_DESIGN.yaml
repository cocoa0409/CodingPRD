      - name: same_official_cannot_judge_and_steward_one_slot
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_31
          - validations.priority_32
          - calculations.official_load_ledger
          - state_machines.ShowClass.IN_PROGRESS_to_JUDGED
        distinguishing_aspect: |
          Holding both chairs on one slot is deliberately LEGAL at assignment time (the
          official is standing in that ring anyway, and the load ledger counts both
          chairs: 53 + 53 = 106 minutes), so the duties clash is caught only when the
          card is signed. The three cards separate the two authorisation rules: the
          double-hatted official is refused with ERR_SEGREGATION_OF_DUTIES (409), an
          official with no chair on the slot is refused with ERR_JUDGE_NOT_ASSIGNED
