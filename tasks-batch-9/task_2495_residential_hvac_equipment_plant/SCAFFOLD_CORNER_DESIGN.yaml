          - endpoints.GET_/plant/allocation-lines
          - entities.AllocationLine.fields.component_supply_id
        distinguishing_aspect: "One allocation writes two lines, one per component type, and the two read paths partition them differently: the compressor pool's sub-resource shows only its own COMPRESSOR line, while the flat list filtered by order shows both."
