      - name: adverse_condition_variant_diverges_from_systematic_random
        claim_type: variant_divergence
        grounds:
          - "calculations.area_water_quality_statistics"
          - "endpoints[GET /shellfish/growing-areas/{id}/classification-summary]"
          - "entities.WaterSample.fields.is_adverse_condition"
        excluded_because:
          difficulty_instance: area_stats_diverge_between_systematic_and_adverse_variants
          rationale: "The §1.8 dual_variant_calc instance already reads both variants over one 15-sample fixture and pins every statistic on each side (n 15 vs 5, geometric mean 8.8 vs 114.1, eligible RESTRICTED vs PROHIBITED), including the ADVERSE_WINDOW_HOURS membership rule."

      - name: royalty_tier_boundary_at_five_hundred_bushels
        claim_type: constants_applied
        grounds:
          - "calculations.lease_harvest_settlement"
          - "entities.HarvestLot.fields.royalty_rate_cents_per_bushel"
          - "entities.HarvestLot.fields.season_total_bushels_at_creation"
        excluded_because:
          difficulty_instance: royalty_tier_keyed_on_season_total_including_current_lot
          rationale: "The §1.8 combinatorial_formula instance already lands a 500-bushel lot at the inclusive TIER1_MAX boundary (rate 115) and then a single further bushel that re-tiers the whole next lot to 95, which subsumes any narrower boundary probe."

      - name: surcharge_is_rounded_once_per_lot
        claim_type: precision
        grounds:
          - "calculations.lease_harvest_settlement"
          - "entities.HarvestLot.fields.conservation_surcharge_cents"
          - "entities.Lease.fields.royalty_accrued_cents"
        excluded_because:
          difficulty_instance: surcharge_rounds_per_lot_before_accrual_sum
          rationale: "The §1.8 combinatorial_formula instance already uses lot values whose per-lot half-up rounding and whose round-the-summed-base alternative give different accruals, so it discriminates the rounding order that a single-lot precision probe cannot."

      - name: vessel_window_adjacency_is_not_an_overlap
        claim_type: input_set_filtering
        grounds:
          - "calculations.vessel_concurrent_authorization_load"
          - "validations[priority=70]"
          - "entities.HarvestVessel.fields.active_authorization_count"
        excluded_because:
          difficulty_instance: third_overlapping_authorization_on_vessel_at_capacity_rejected
          rationale: "The §1.8 resource_temporal_overlap instance already includes the adjacency leg — a window starting exactly at another window's exclusive end is accepted on a vessel already at capacity — alongside the rejected genuine overlap."
