          - entities.RawMaterial.fields.claim_status
          - entities.RawMaterial.fields.verified_claim_types
        distinguishing_aspect: "The certificate loop PENDING -> VERIFIED -> REVOKED -> VERIFIED drives RawMaterial.claim_status CLEAR -> RESTRICTED -> CLEAR and returns KOSHER to verified_claim_types, so the loop leaves no residue on the material."
        test_recipe:
