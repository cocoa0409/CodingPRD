              payload: {}
              as: ProgramDirector
          assert:
            - "setup calls 1 to 7: every one returns its declared success code (200 for the clock, 201 for each create) — the director's exclusive list is fully exercisable with no X-User-ID header at all"
            - "trigger 1: HTTP status == 201 — POST /intake-screenings is shared with the director, and screened_by_representative_id is null at this point"
            - "trigger 2: HTTP status == 200, status == 'SCREENED', screened_by_representative_id == '${atty_a_id}', legal_eligibility_verdict == 'ELIGIBLE', and Client.${client_id}.fpl_percent == 77.76"
            - "trigger 3: HTTP status == 200 and status == 'ACCEPTED' — NOT 403; the director opened the row in trigger 1 and closed it in trigger 3, a two-halves sequence that ERR_SEGREGATION_OF_DUTIES forbids for an entity-backed screener, because an opaque identity can never equal screened_by_representative_id"
            - "trigger 3: exactly one CaseMatter now exists with intake_id == ${intake_id}, representation_status 'UNSTAFFED' and filing_status 'PRE_FILING'"
            - "trigger 4: HTTP status == 201 with status == 'PENDING' — the director creates the accreditation but, being opaque, could never be recorded in approved_by_representative_id, so it structurally cannot self-approve; NOTE the §1.7/§1.3 discrepancy that §1.7 lists POST /accreditations/{accreditation_id}/transition among the director's exclusive operations while §1.3 declares the APPROVE actor to be a SupervisingAttorney whose X-User-ID is stored"
            - "trigger 5: HTTP status == 200 and weekly_capacity_hours == 20"
            - "trigger 6: HTTP status == 200 and posture_override_until_utc == '2026-08-31T00:00:00.000Z'"
            - "trigger 7: HTTP status == 200, checkpoint_epoch == 1 and last_checkpoint_utc == '2026-08-03T09:00:00.000Z'"

  # ===========================================================================
  # complexity_layers declared in §1.0: optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, selector_policy. The first
  # three are rows of the extraction guide's layer table and get instances below;
  # selector_policy has no row in the guide, and its substance
  # (calculations.supervisor_auto_selection ranking and
  # calculations.capacity_slot_waterfall ordering) is covered under
  # section: calculations, so no separate layer instance is emitted for it.
  # All three §1.2.1 concurrency_rules entries are covered: the two
  # expected_matter_version rules here, and accreditation-renew-stale-recognition
  # by errors / err_stale_recognition_version_on_renew_is_a_separate_412_from_the_matter_occ_token.
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_case_assignment_create_rejects_a_stale_matter_token_and_version_moves_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-assignment-create-stale-matter]
          - errors[ERR_STALE_MATTER_VERSION]
          - endpoints[POST /case-assignments]
          - endpoints[POST /evidence-items]
        distinguishing_aspect: "The token is a CaseMatter version, but almost every child write bumps it — an evidence create, a LEAD activation, a declaration certification — so a token read before ANY of those goes stale even though nothing about staffing changed. This is the concrete race the rule protects: a stale writer would otherwise activate a LEAD that releases an incumbent it never saw. The 412 is checked last (priority 38), so a request that is both stale AND role-denied reports the role denial, and a rejected create leaves version untouched so the retry with a refreshed token succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives matter ${matter_id} with Ada Ortiz as ACTIVE LEAD; ${matter_v1} is the version observed at creation, before the assignment chain ran."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_after_lead: "$.data.version" }
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_b_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${matter_v1}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_b_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${v_after_lead}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { cc_id: "$.data.id" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${screener_id}", role_on_case: "INTERPRETER_COORDINATOR", expected_matter_version: "${v_after_lead}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_after_cc: "$.data.version" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 20, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${screener_id}", role_on_case: "INTERPRETER_COORDINATOR", expected_matter_version: "${v_after_cc}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${screener_id}", role_on_case: "INTERPRETER_COORDINATOR", expected_matter_version: "${v_after_cc}" }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { v_now: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${screener_id}", role_on_case: "INTERPRETER_COORDINATOR", expected_matter_version: "${v_now}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup: ${v_after_lead} == ${matter_v1} + 2 — the LEAD create bumped the matter once and the ACTIVATE bumped it again, so the token captured at intake acceptance is already two generations behind"
            - "trigger 1: HTTP status == 412 and error_id == 'ERR_STALE_MATTER_VERSION'; no CaseAssignment row was created and CaseMatter.version is still ${v_after_lead}"
            - "trigger 2: HTTP status == 201 — the refreshed token is accepted for the identical payload"
            - "trigger 3: HTTP status == 412 and error_id == 'ERR_STALE_MATTER_VERSION' — the token that just worked in trigger 2 is dead because trigger 2's own success bumped the version; a token is single-use in practice"
            - "trigger 4: ${v_after_cc} == ${v_after_lead} + 1"
            - "trigger 5: HTTP status == 201 — an evidence create, which has no OCC field of its own"
            - "trigger 6: HTTP status == 412 and error_id == 'ERR_STALE_MATTER_VERSION' — an unrelated CHILD write invalidated a staffing token; this is the precise reason the rule exists"
            - "trigger 7: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED', not 412 — priority 2 precedes priority 38, so a stale caller with the wrong role never learns its token was stale"
            - "trigger 9: HTTP status == 201 with role_on_case 'INTERPRETER_COORDINATOR' — version increased monotonically at every successful write and never once at a rejected one"

      - name: occ_informed_decision_create_rejects_a_stale_matter_token_before_it_supersedes_prior_counseling
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[informed-decision-create-stale-matter]
          - errors[ERR_STALE_MATTER_VERSION]
          - endpoints[POST /informed-decisions]
          - state_machines.InformedDecision
        distinguishing_aspect: "The second expected_matter_version rule guards a supersede, not a create: a new DOCUMENTED decision of the same decision_type retires the previous one, so a stale writer would silently overwrite counselling it never read. The distinguishing detail is that the 412 must be raised BEFORE the supersede — the prior decision stays DOCUMENTED and its superseded_by_decision_id stays null — and that the token is invalidated by the ACKNOWLEDGE of the prior decision itself, which is performed by a completely different role."
        test_recipe:
          setup:
            - "TEMPLATE B gives a matter for Rosa Mena with a CERTIFIED 'es' declaration, Ada Ortiz as ACTIVE LEAD and Ben Cole as ACTIVE CO_COUNSEL."
          setup_api_calls:
            - call: "TEMPLATE B"
              payload: {}
              as: ProgramDirector
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { v0: "$.data.version" }
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${v0}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { dec1_id: "$.data.id" }
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { v1: "$.data.version" }
          trigger:
            - call: "POST /informed-decisions/${dec1_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: ClientPortalUser
              as_user_id: "${client_id}"
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${cocounsel_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK", "DELAY_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${v1}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { v2: "$.data.version" }
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${cocounsel_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK", "DELAY_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${v2}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { dec2_id: "$.data.id" }
            - call: "GET /informed-decisions"
              payload: { matter_id: "${matter_id}" }
              as: ProgramDirector
          assert:
            - "setup: ${v1} == ${v0} + 1 and InformedDecision.${dec1_id}.status == 'PENDING'"
            - "trigger 1: HTTP status == 200 and InformedDecision.${dec1_id}.status == 'DOCUMENTED' — the acknowledgement is what makes it supersedable"
            - "trigger 2: HTTP status == 412 and error_id == 'ERR_STALE_MATTER_VERSION' — the ClientPortalUser's acknowledgement bumped the matter version, so a representative's token went stale through an action taken by the client"
            - "trigger 2: InformedDecision.${dec1_id}.status is still 'DOCUMENTED' and superseded_by_decision_id is still null — the 412 preceded the supersede, so no counselling record was retired by a rejected request"
            - "trigger 4: HTTP status == 201 with status == 'PENDING', and InformedDecision.${dec1_id}.superseded_by_decision_id == '${dec2_id}' with status 'SUPERSEDED'"
            - "trigger 5: exactly 2 rows — the supersede rewrites the prior row rather than deleting it"

      - name: cascading_side_effects_recognition_lapse_is_verified_hop_by_hop_and_is_ordering_sensitive
        claim_type: cascading_side_effects
        grounds:
          - state_machines.OrganizationRecognition
          - state_machines.Accreditation
          - state_machines.CaseAssignment
          - state_machines.Declaration
          - calculations.representative_authorization_status
        distinguishing_aspect: "A single LAPSE drives a five-target chain whose hops must run in the declared order, because each hop reads state the previous one wrote: accreditations must be SUSPENDED_BY_RECOGNITION before authorization_status can be re-derived to AUTHORIZATION_SUSPENDED, which must happen before ACTIVE assignments are suspended, which must happen before the matter can be pushed to COVERAGE_GAP. The cascade is also CONDITIONAL at every hop — a REVOKED accreditation, a RELEASED assignment and a CERTIFIED declaration are all left untouched — so a cascade that indiscriminately rewrites children is detectable by the rows that must NOT move."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives cycle FY26-H2, Ada Ortiz, Ben Cole, Sara Ruiz, Rosa Mena and matter M1 with Ada as ACTIVE LEAD. Recognition REC-2026-001 with all four forums."
            - "Nadia Rey (ACCREDITED_REP) has an APPROVED FULL accreditation and an ACTIVE CO_COUNSEL assignment on M1. Omar Vale (ACCREDITED_REP) has an accreditation that was REVOKED before the lapse, and a RELEASED assignment on M1."
            - "A second matter M2 for Bea Rios is accepted and immediately withdrawn through its intake, so it is WITHDRAWN_FROM."
            - "Two declarations exist on M1: one IN_REVIEW prepared by Ada, and one CERTIFIED. One SCHEDULED BIOMETRICS event sits 5 days out (2026-08-08) and one sits 30 days out (2026-09-02)."
          setup_api_calls:
            - call: "TEMPLATE A, then the recognition, Nadia Rey and Omar Vale creates, a FULL accreditation for each, APPROVE for each as SupervisingAttorney ${atty_b_id}, then REVOKE Omar's"
              payload: {}
              as: ProgramDirector
              captures: { rec_id: "$.data.id", nadia_id: "$.data.id", omar_id: "$.data.id", nadia_acc_id: "$.data.id", omar_acc_id: "$.data.id" }
            - call: "create and ACTIVATE a SUPERVISOR assignment for Ben Cole on ${matter_id}, then create and ACTIVATE a CO_COUNSEL assignment for Nadia Rey, then create a CO_COUNSEL assignment for Omar Vale and RELEASE it, each create preceded by a fresh GET /case-matters/${matter_id}"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { ben_sup_id: "$.data.id", nadia_cc_id: "$.data.id", omar_cc_id: "$.data.id" }
            - call: "POST /declarations then SUBMIT_FOR_REVIEW for an 'es' declaration prepared by Ada on ${lead_id}, leaving it IN_REVIEW"
              payload: {}
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { decl_open_id: "$.data.id" }
            - call: "POST /declarations then SUBMIT_FOR_REVIEW then CERTIFY (reviewer ${ben_sup_id}) for a second 'es' declaration prepared by Ada, leaving it CERTIFIED"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { decl_done_id: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-08-08T14:00:00.000Z", ends_at_utc: "2026-08-08T15:00:00.000Z", location_code: "ELP-ASC" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { evt_near_id: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-02T14:00:00.000Z", ends_at_utc: "2026-09-02T15:00:00.000Z", location_code: "ELP-ASC" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { evt_far_id: "$.data.id" }
            - call: "POST /clients then ACCEPT_INTAKE(client=Bea Rios, case_type=U_VISA, detained=false) giving M2, then POST /intake-screenings/{that intake}/withdraw"
              payload: {}
              as: ProgramDirector
              captures: { m2_id: "$.data[0].id" }
          trigger:
            - call: "POST /organization-recognitions/${rec_id}/transition"
              payload: { action: "LAPSE" }
              as: ProgramDirector
          assert:
            - "HTTP status == 200; hop 0: OrganizationRecognition.${rec_id}.status == 'LAPSED', lapsed_at_utc == '2026-08-03T09:00:00.000Z', suspended_accreditation_count == 1"
            - "hop 1: Accreditation.${nadia_acc_id}.status == 'SUSPENDED_BY_RECOGNITION' with suspension_reason_code 'RECOGNITION_LAPSE'; Accreditation.${omar_acc_id}.status is STILL 'REVOKED' — the hop is conditional on APPROVED, EXPIRING or RENEWAL_PENDING, and suspended_accreditation_count == 1 proves only one row was counted"
            - "hop 2: Representative.${nadia_id}.authorization_status == 'AUTHORIZATION_SUSPENDED', which is only derivable AFTER hop 1 wrote the accreditation status — an implementation that re-derives before suspending would leave 'AUTHORIZED_ACCREDITED'"
            - "hop 2: Representative.${atty_a_id}.authorization_status is still 'AUTHORIZED_ATTORNEY' and Representative.${atty_b_id} likewise — a staff attorney's authorization does not depend on the recognition"
            - "hop 3: CaseAssignment.${nadia_cc_id}.status == 'SUSPENDED' with suspension_reason_code 'RECOGNITION_LAPSE'; CaseAssignment.${omar_cc_id}.status is STILL 'RELEASED' and CaseAssignment.${lead_id} and ${ben_sup_id} are STILL 'ACTIVE'"
            - "hop 3: Representative.${nadia_id}.active_case_load == 0, decremented exactly once"
            - "hop 4: CaseMatter.${matter_id}.representation_status == 'COVERAGE_GAP' and coverage_gap_flag == true; CaseMatter.${m2_id}.representation_status is STILL 'WITHDRAWN_FROM' — the terminal dimension value is excluded from the cascade"
            - "hop 4: Declaration.${decl_open_id}.status == 'REVISION_REQUESTED' with revision_reason_code 'SUPERVISION_REQUIRED' and revision_round == 1; Declaration.${decl_done_id}.status is STILL 'CERTIFIED' with certified_at_utc unchanged"
            - "hop 4: CalendarEvent.${evt_near_id}.coverage_gap_flag == true (2026-08-08 is inside COVERAGE_GAP_LOOKAHEAD_DAYS 14) and CalendarEvent.${evt_far_id}.coverage_gap_flag == false (2026-09-02 is 30 days out); both remain 'SCHEDULED'"
            - "the whole chain landed in ONE response: a re-read of every entity above immediately after the 200 shows the final values, with no second call and no lag"

      - name: dual_variant_urgency_is_frozen_at_screen_time_while_the_readiness_gate_variant_re_selects_on_every_read
        claim_type: dual_variant_calculation
        grounds:
          - calculations.intake_urgency_score
          - calculations.matter_readiness_index
          - endpoints[POST /case-matters/{matter_id}/set-facility]
        distinguishing_aspect: "Both variant-bearing calculations key on `detained`, but they behave oppositely under a later change of that flag, and that asymmetry is the whole claim: the urgency variant is recorded once at screen time (urgency_variant_applied, urgency_anchor_date) and is NEVER re-derived when set-facility later releases the client, whereas the readiness gate variant is re-selected on every recomputation, so readiness_gate_applied flips and the SAME evidence set changes which error id blocks READY_TO_FILE. An implementation that re-scores urgency on set-facility, or that latches the gate at acceptance, fails in opposite directions."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Facility EL-PASO-SPC in TX-ELP with expedited_filing_days 21 and visit_lead_time_hours 48. Cycle FY26-H2 with 10 slots and 2 reserved detained."
            - "Rosa Mena's ASYLUM_DEFENSIVE intake is DETAINED at EL-PASO-SPC with statutory_deadline_date 2026-09-30, no prior removal, no one-year bar and not a minor. Base points ASYLUM_DEFENSIVE 40 plus DETAINED 25 = 65, plus horizon_points 9.29 for the 58 whole days from 2026-08-03 to 2026-09-30, giving 74.29."
            - "After acceptance the matter is staffed with Ada Ortiz as ACTIVE LEAD, given a CERTIFIED 'es' declaration, and given evidence worth 40 of 55 counted points with one RECEIVED REQUIRED item outstanding — index 0.7273 and required_open 1."
          setup_api_calls:
            - call: "TEMPLATE A, but with the EL-PASO-SPC facility created first and ACCEPT_INTAKE(client=Rosa Mena, case_type=ASYLUM_DEFENSIVE, detained=true) against that facility with statutory_deadline_date 2026-09-30"
              payload: {}
              as: ProgramDirector
              captures: { fac_id: "$.data.id" }
            - call: "GET /intake-screenings/${intake_id}"
              payload: {}
              as: ProgramDirector
            - call: "TEMPLATE B steps 13 to 20 on ${matter_id} to reach a CERTIFIED 'es' declaration"
              payload: {}
              as: ProgramDirector
            - call: "POST /evidence-items x3 (REQUIRED 20, REQUIRED 20, REQUIRED 15), RECEIVE all three, VERIFY only the first two"
              payload: {}
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "EVIDENCE_GATHERING" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          trigger:
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/set-facility"
              payload: { detained: false }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /intake-screenings/${intake_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/${matter_id}/set-facility"
              payload: { detained: true, facility_id: "${fac_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "setup call 2: urgency_variant_applied == 'CALENDAR_INCLUSIVE' (selected because detained is true), urgency_anchor_date == '2026-09-30' with no calendar event yet to beat it, urgency_score == 74.29 and urgency_tier == 'URGENT' — base ASYLUM_DEFENSIVE 40 plus DETAINED 25 plus horizon_points round_half_up(30 * (1 - 58/84), 2) == 9.29, and 74.29 clears the inclusive TIER_URGENT_MIN 65.00"
            - "trigger 1: HTTP status == 422 and error_id == 'ERR_MATTER_NOT_READY'; readiness_gate_applied == 'EVIDENCE_WEIGHTED_GATE' and readiness_index_weighted == 0.7273"
            - "trigger 2: HTTP status == 200, detained == false, facility_id == null, expedited_deadline_date == null"
            - "trigger 3: urgency_variant_applied is STILL 'CALENDAR_INCLUSIVE', urgency_anchor_date is STILL '2026-09-30' and urgency_score is STILL 74.29 — releasing the client did not re-score the intake, so the variant selection is frozen at screen time and the DETAINED 25 points are not clawed back"
            - "trigger 4: HTTP status == 422 and error_id == 'ERR_BLOCKING_EVIDENCE_OUTSTANDING' with readiness_gate_applied == 'CHECKLIST_STRICT_GATE' — the same 0.7273 index and the same one open REQUIRED item now fail under the other variant, so the gate variant re-selected while urgency did not"
            - "trigger 6: HTTP status == 422 and error_id == 'ERR_MATTER_NOT_READY' with readiness_gate_applied back to 'EVIDENCE_WEIGHTED_GATE' — the gate variant is a pure function of the CURRENT detained flag and flips back and forth without limit"
            - "readiness_index_weighted stayed 0.7273 across triggers 1 to 6 — the variant chooses the gate, never the arithmetic"

  # ===========================================================================
  # consistency_model: immediate. There is no eventual or saga branch in this
  # scaffold, so the only claims are that every derived value is final inside the
  # writing response and that a rejected write leaves nothing half-applied.
  - section: consistency_model
    instances:

      - name: immediate_consistency_every_derived_field_is_final_inside_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.indigency_fpl_percent
          - calculations.intake_urgency_score
          - calculations.matter_readiness_index
          - calculations.interpretation_cost_rollup
        distinguishing_aspect: "Every write returns its own consequences already computed: the client create returns fpl_percent, the screen returns the verdict and both urgency figures, the evidence verify returns nothing but the immediately following matter read shows the new index with no intervening call, and the session COMPLETE returns billable_cents while the matter's interpretation_cost_cents has already moved. The falsifier is a byte-comparison between the write response and an immediate re-read: under immediate consistency they must agree field for field, with no second call, no sweep and no clock advance in between."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives cycle FY26-H2, three representatives and an accepted U_VISA matter for Rosa Mena (household 3, income 2000000) with Ada Ortiz as ACTIVE LEAD."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Bea Rios", preferred_language_code: "ht", country_of_birth_code: "HT", date_of_birth: "1988-02-19", household_size: 1, annual_household_income_cents: 3016000 }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_id: "$.data.id" }
            - call: "GET /clients/${bea_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${bea_id}", cycle_id: "${cycle_id}", case_type: "BOND_HEARING", detained: false, statutory_deadline_date: "2026-09-30" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_intake_id: "$.data.id" }
            - call: "POST /intake-screenings/${bea_intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /intake-screenings/${bea_intake_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 20, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { ev_id: "$.data.id" }
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /evidence-items/${ev_id}/transition"
              payload: { action: "RECEIVE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${ev_id}/transition"
              payload: { action: "VERIFY" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "es", interpreter_source: "CONTRACT", purpose: "HEARING_PREP", scheduled_start_utc: "2026-08-03T11:00:00.000Z", scheduled_end_utc: "2026-08-03T12:00:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /interpretation-sessions/${s1_id}/transition"
              payload: { action: "COMPLETE", actual_minutes: 45 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "trigger 1: the 201 response itself carries fpl_percent == 200.00 — computed inside the create, not on a later read — plus interpreter_required == true defaulted from preferred_language_code 'ht' != 'en' and confidentiality_consent_scope == 'PROGRAM_ONLY'"
            - "trigger 2: every field of trigger 1's data block is identical, fpl_percent included"
            - "trigger 3: the 201 response has legal_eligibility_verdict == null, urgency_score == null and urgency_tier == null — nothing is computed at open time, so the later values cannot be attributed to a background job"
            - "trigger 4: the 200 response itself carries legal_eligibility_verdict == 'ELIGIBLE', urgency_score == 51.29, urgency_tier == 'ELEVATED' — BOND_HEARING 42 plus horizon_points 9.29 for the 58 days to 2026-09-30, clearing the inclusive TIER_ELEVATED_MIN 45.00, urgency_variant_applied == 'STRICT_STATUTORY' and urgency_anchor_date == '2026-09-30'"
            - "trigger 5: byte-identical to trigger 4's data block"
            - "trigger 7: readiness_index_weighted == 0.0000 with one REQUESTED REQUIRED item — numerator 0 over denominator 20 — readiness_ready_strict == false and evidence_blocking_count == 1"
            - "trigger 10: readiness_index_weighted == 1.0000, readiness_ready_strict == true and evidence_blocking_count == 0, on the very next call after VERIFY with no sweep, no clock move and no re-save of the matter"
            - "trigger 12: the COMPLETE response carries billed_minutes == 45 and billable_cents == 7125"
            - "trigger 13: CaseMatter.interpretation_cost_cents == 7125 immediately — the parent rollup landed inside the child's transaction"

      - name: immediate_consistency_a_rejected_write_leaves_no_partially_applied_counter
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.capacity_slot_waterfall
          - calculations.cycle_capacity_posture
          - errors[ERR_NO_SLOT_AVAILABLE]
        distinguishing_aspect: "The other half of immediate consistency: a rejected write must leave every denormalized counter exactly where it was, in the same response, with no compensating sweep needed. The sharp case is an ACCEPT that fails on the reserved-block boundary — general_slots_consumed, detained_slots_consumed, waitlisted_count, utilization_ratio, capacity_posture, Client.open_matter_count and Representative.active_case_load must all be byte-identical before and after, and the intake must remain SCREENED rather than landing in a half-accepted state."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2 with total_case_slots 5 and reserved_detained_slots 2, so the general pool free count is 3 and EXCLUDES the reserved block."
            - "Three non-detained U_VISA matters are accepted, exhausting the general pool while 2 reserved detained slots remain unused."
            - "A fourth non-detained intake for Bea Rios is SCREENED and left undecided."
          setup_api_calls:
            - call: "TEMPLATE A, with total_case_slots 5 and reserved_detained_slots 2"
              payload: {}
              as: ProgramDirector
            - call: "2 repetitions of: POST /clients then ACCEPT_INTAKE(client=<new>, case_type=U_VISA, detained=false) — reaching 3 of the 3 general slots"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /clients"
              payload: { full_name: "Bea Rios", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1988-02-19", household_size: 1, annual_household_income_cents: 1000000 }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_id: "$.data.id" }
            - call: "POST /intake-screenings"
              payload: { client_id: "${bea_id}", cycle_id: "${cycle_id}", case_type: "U_VISA", detained: false, statutory_deadline_date: "2026-12-01" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_intake_id: "$.data.id" }
            - call: "POST /intake-screenings/${bea_intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /clients/${bea_id}"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /intake-screenings/${bea_intake_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /clients/${bea_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /intake-screenings/${bea_intake_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /case-matters"
              payload: { client_id: "${bea_id}" }
              as: ProgramDirector
          assert:
            - "setup call 6: general_slots_consumed == 3, detained_slots_consumed == 0, available_slot_count == 2, waitlisted_count == 0, utilization_ratio == 0.6000 and capacity_posture == 'OPEN'"
            - "trigger 1: HTTP status == 409 and error_id == 'ERR_NO_SLOT_AVAILABLE' — available_slot_count is 2 and yet the request is refused, because the free slots are inside the reserved detained block and a non-detained applicant may not draw on it"
            - "trigger 2: general_slots_consumed == 3, detained_slots_consumed == 0, available_slot_count == 2, waitlisted_count == 0, utilization_ratio == 0.6000, capacity_posture == 'OPEN' and ProgramCapacityCycle.version unchanged from setup call 6 — every counter byte-identical, so nothing was reserved and released"
            - "trigger 3: Client.${bea_id}.open_matter_count == 0 and version unchanged from setup call 7"
            - "trigger 4: IntakeScreening.${bea_intake_id}.status is still 'SCREENED' — NOT 'WAITLISTED' and NOT 'ACCEPTED'; decided_by_representative_id and decided_at_utc are both still null"
            - "trigger 5: exactly 0 rows — no CaseMatter was minted and then rolled back into visibility"
            - "no compensating action, sweep or checkpoint was needed between trigger 1 and trigger 2 for the counters to be correct"
