  - name: rebate_tier_evaluation_order_pinned
    grounds:
    - calculations.rebate_tier_evaluation
    - entities.Customer.fields.trailing_billed_cents
    - entities.PressOrder.fields.discount_pct_snapshot
    distinguishing_aspect: 'Mode (c) circular-looking dependency pinned: invoice must use the

      5% GOLD snapshot even though the customer is revised to STANDARD

      before invoicing; trailing_billed_cents posts only AFTER issuance;

      a later quote uses the new 0% tier with no retroactive re-rate.

      '
    test_recipe:
      setup:
      - GOLD customer order qty 1000 BLACK 180g quoted (snapshot 5%) and completed (accepted 970); customer then revised to STANDARD; invoice
