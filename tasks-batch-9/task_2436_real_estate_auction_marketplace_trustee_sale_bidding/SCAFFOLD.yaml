# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth -------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a role declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor targets a resource owned by a different Seller or Bidder id"
  # --- existence --------------------------------------------------------------
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "seller_id does not resolve to a Seller"
  - id: ERR_ASSET_LISTING_NOT_FOUND
    http: 404
    condition: "asset_listing_id does not resolve to an AssetListing"
  - id: ERR_TRUSTEE_SALE_NOT_FOUND
    http: 404
    condition: "trustee_sale_id does not resolve to a TrusteeSale"
  - id: ERR_AUCTION_EVENT_NOT_FOUND
    http: 404
    condition: "the auction event id in the path does not resolve to an AuctionEvent"
  - id: ERR_AUCTION_LOT_NOT_FOUND
    http: 404
    condition: "the auction lot id in the path or body does not resolve to an AuctionLot"
  - id: ERR_BIDDER_NOT_FOUND
    http: 404
    condition: "bidder_id does not resolve to a Bidder"
  - id: ERR_EXCLUSION_NOT_FOUND
    http: 404
    condition: "the exclusion id in the path does not resolve to an EligibilityExclusion"
  - id: ERR_SALE_CONTRACT_NOT_FOUND
    http: 404
    condition: "the contract id in the path does not resolve to a SaleContract"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "the offer id in the path does not resolve to a SecondChanceOffer"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "the bid id in the path does not resolve to a Bid"
  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, unknown enum member, non-positive amount, malformed datetime, ends_at <= starts_at, or pagination parameter out of range"
  - id: ERR_DUPLICATE_LOT_NUMBER
    http: 409
    condition: "another AuctionLot of the same event already uses this lot_number"
  - id: ERR_AUDIT_MODE_REQUIRES_LOT
    http: 422
    condition: "eligibility assessment requested with mode=AUDIT but no auction_lot_id"
  # --- listing / title state --------------------------------------------------
  - id: ERR_LISTING_NOT_IN_INTAKE
    http: 409
    condition: "disclosures filed on an AssetListing whose listing_status is not INTAKE"
  - id: ERR_TITLE_CLEARANCE_ALREADY_SET
    http: 409
    condition: "title clearance recorded on an AssetListing whose title_clearance_status is not PENDING"
  - id: ERR_LISTING_NOT_RELISTABLE
    http: 409
    condition: "relist attempted on an AssetListing outside {RELIST_PENDING, UNSOLD}"
  - id: ERR_LISTING_NOT_LISTABLE
    http: 409
    condition: "the asset added as a lot is not in {DISCLOSURE_READY, LISTED} — disclosures are still outstanding or the asset is already sold"
  - id: ERR_TITLE_CLEARANCE_PENDING
    http: 409
    condition: "contract execution attempted while the asset's title_clearance_status is still PENDING"
  - id: ERR_TITLE_DEFECTIVE
    http: 409
    condition: "the asset's title_clearance_status is DEFECTIVE, which permanently bars listing, relisting and contract execution"
  # --- trustee sale state -----------------------------------------------------
  - id: ERR_TRUSTEE_SALE_NOT_ACTIONABLE
    http: 409
    condition: "confirm, postpone or cancel invoked from a TrusteeSale status that the transition does not accept (e.g. HELD or CANCELLED)"
  - id: ERR_TRUSTEE_SALE_NOT_CONFIRMED
    http: 409
    condition: "an event bound to a trustee sale is opened while that sale's status is not CONFIRMED"
  - id: ERR_SALE_DATE_NOT_FUTURE
    http: 422
    condition: "sale_scheduled_at or new_sale_at is not strictly after the logical clock"
  - id: ERR_POSTPONEMENT_LIMIT_EXCEEDED
    http: 409
    condition: "postponement would push postponement_count past statutory_max_postponements"
  # --- event state ------------------------------------------------------------
  - id: ERR_EVENT_NOT_SCHEDULED
    http: 409
    condition: "lot addition or open invoked on an AuctionEvent whose event_status is not SCHEDULED"
  - id: ERR_EVENT_NOT_POSTPONED
    http: 409
    condition: "reschedule invoked on an AuctionEvent whose event_status is not POSTPONED"
  - id: ERR_EVENT_NOT_LIVE
    http: 409
    condition: "bidding or lot close attempted while the parent AuctionEvent is not LIVE"
  - id: ERR_EVENT_HAS_NO_LOTS
    http: 409
    condition: "open invoked on an AuctionEvent with lot_count 0"
  - id: ERR_EVENT_NOT_STARTED
    http: 409
    condition: "open invoked before the logical clock reaches the event's starts_at"
  - id: ERR_COUNTY_SLOT_CONFLICT
    http: 409
    condition: "the requested event window, widened by the 30-minute county buffer, touches another non-cancelled event in the same county"
  # --- lot state --------------------------------------------------------------
  - id: ERR_LOT_NOT_OPEN
    http: 409
    condition: "bid or close attempted on an AuctionLot whose lot_status is not OPEN or EXTENDED"
  - id: ERR_LOT_NOT_CLOSED_SOLD
    http: 409
    condition: "contract execution or a second-chance offer attempted on an AuctionLot that is not CLOSED_SOLD"
  - id: ERR_LOT_HAS_BIDS
    http: 409
    condition: "reserve price revision attempted after a bid already stands on the lot"
  - id: ERR_LOT_WINDOW_CONFLICT
    http: 409
    condition: "the requested lot window overlaps another non-terminal lot of the same asset (half-open comparison, so touching windows are allowed)"
  - id: ERR_LOT_WINDOW_OUTSIDE_EVENT
    http: 422
    condition: "the lot window is not fully contained in its event's starts_at..ends_at window"
  - id: ERR_BID_WINDOW_CLOSED
    http: 409
    condition: "the logical clock has reached or passed the lot's bid_close_at"
  - id: ERR_LOT_WINDOW_STILL_OPEN
    http: 409
    condition: "close attempted while the logical clock is still before the lot's bid_close_at, including after a late-bid extension pushed it out"
  - id: ERR_BID_BELOW_MINIMUM
    http: 422
    condition: "amount_cents is below opening_bid_cents on a bid-free lot, or below current_high_bid_cents + min_increment_cents"
  - id: ERR_RESERVE_BELOW_OPENING
    http: 422
    condition: "reserve_price_cents is below opening_bid_cents"
  # --- bidder & compliance ----------------------------------------------------
  - id: ERR_BIDDER_NOT_REGISTERED
    http: 409
    condition: "the bidder's registration_status is SUSPENDED when bidding or accepting an offer, or identity verification is recorded twice"
  - id: ERR_IDENTITY_UNVERIFIED
    http: 409
    condition: "the bidder's identity_verification_status is not VERIFIED"
  - id: ERR_BIDDER_BARRED
    http: 403
    condition: "the bidder's registration_status is BARRED after repeated fallout"
  - id: ERR_BIDDER_EXCLUDED
    http: 403
    condition: "an EligibilityExclusion that is ACTIVE, already effective at the logical clock and scoped to ALL or the event's county covers this bidder"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "deposit_available_cents is below the lot's required_deposit_cents and the bidder holds no live hold on the lot"
  # --- contract, settlement, fallout, second chance ---------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the operator executing the contract is the same X-User-ID that closed the lot"
  - id: ERR_CONTRACT_NOT_EXECUTED
    http: 409
    condition: "close or fallout invoked on a SaleContract whose contract_status is not EXECUTED"
  - id: ERR_CLOSING_DEADLINE_PASSED
    http: 409
    condition: "escrow closing attempted after closing_deadline_at"
  - id: ERR_NO_BACKUP_BIDDER
    http: 409
    condition: "no reserve-clearing backup bid remains from an eligible bidder other than the defaulting buyer"
  - id: ERR_DUPLICATE_ACTIVE_OFFER
    http: 409
    condition: "an OUTSTANDING SecondChanceOffer already exists for the lot"
  - id: ERR_OFFER_NOT_OUTSTANDING
    http: 409
    condition: "respond invoked on a SecondChanceOffer whose status is not OUTSTANDING"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "respond invoked after the offer's expires_at; the offer is lazily moved to EXPIRED and the response rejected"
  - id: ERR_COUNTY_MISMATCH
    http: 422
    condition: "the trustee sale's county_code differs from the asset listing's county_code"
  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_auction_event_version does not equal the AuctionEvent's current version"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_auction_lot_version does not equal the AuctionLot's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties — AuctionOps is a single role, but the same
# X-User-ID may not both hammer a lot down and execute its purchase contract
# (validation priority 37 / ERR_SEGREGATION_OF_DUTIES). TitleOfficer, Trustee and
# ComplianceOfficer are peer control roles: none of them can perform another's
# exclusive operation, and none of them can move the auction or contract forward.
roles:
  - name: PlatformAdmin
    description: "Marketplace operator: onboards sellers, drives the logical clock, reads everything."
    identity: "opaque"
    exclusive_operations:
      - "POST /sellers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
  - name: Seller
    description: "Servicer, bank, GSE or private seller. Owns its own asset listings and disclosures."
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /asset-listings"
      - "POST /asset-listings/{id}/disclosures"
      - "POST /asset-listings/{id}/relist"
    shared_operations:
      - "GET /sellers/{id}"
      - "GET /sellers/{id}/asset-listings"
      - "GET /asset-listings"
      - "GET /asset-listings/{id}"
      - "GET /asset-listings/{id}/trustee-sales"
      - "GET /trustee-sales/{id}"
      - "GET /auction-events/{id}"
      - "GET /auction-lots"
      - "GET /auction-lots/{id}"
      - "GET /auction-lots/{id}/sale-contracts"
      - "GET /auction-lots/{id}/settlement-preview"
      - "GET /bids"
      - "GET /sale-contracts/{id}"
  - name: Trustee
    description: "Foreclosure trustee for the county sale leg: notices, confirms, postpones and cancels statutory sales."
    identity: "opaque"
    exclusive_operations:
      - "POST /trustee-sales"
      - "POST /trustee-sales/{id}/confirm"
      - "POST /trustee-sales/{id}/postpone"
      - "POST /trustee-sales/{id}/cancel"
    shared_operations:
      - "GET /asset-listings/{id}"
      - "GET /asset-listings/{id}/trustee-sales"
      - "GET /trustee-sales/{id}"
      - "GET /trustee-sales/{id}/auction-events"
      - "GET /auction-events"
      - "GET /auction-events/{id}"
      - "GET /auction-lots"
      - "GET /auction-lots/{id}"
      - "GET /bids"
  - name: TitleOfficer
    description: "Title company officer: records the title search outcome that gates contract execution."
    identity: "opaque"
    exclusive_operations:
      - "POST /asset-listings/{id}/title-clearance"
    shared_operations:
      - "GET /asset-listings/{id}"
  - name: ComplianceOfficer
    description: "KYC and eligibility control: verifies identity, records and lifts exclusions."
    identity: "opaque"
    exclusive_operations:
      - "POST /bidders/{id}/identity-verification"
      - "POST /eligibility-exclusions"
      - "POST /eligibility-exclusions/{id}/lift"
    shared_operations:
      - "GET /bidders/{id}"
      - "GET /bidders/{id}/eligibility-exclusions"
      - "GET /bidders/{id}/eligibility-assessment"
      - "GET /deposit-holds"
      - "GET /deposit-holds/{id}"
  - name: AuctionOps
    description: "Auction operations: schedules events, builds lots, revises reserves, opens and closes bidding, executes contracts, records fallout and second-chance offers."
    identity: "opaque"
    exclusive_operations:
      - "POST /auction-events"
      - "POST /auction-events/{id}/lots"
      - "PATCH /auction-lots/{id}/reserve-price"
      - "POST /auction-events/{id}/open"
      - "POST /auction-events/{id}/reschedule"
      - "POST /auction-lots/{id}/close"
      - "POST /auction-lots/{id}/sale-contract"
      - "POST /sale-contracts/{id}/close"
      - "POST /sale-contracts/{id}/fallout"
      - "POST /auction-lots/{id}/second-chance-offers"
    shared_operations:
      - "all GET reads except GET /bidders/{id}/eligibility-assessment is shared only with PlatformAdmin, ComplianceOfficer and the Bidder itself"
  - name: Bidder
    description: "Registered buyer: funds deposits, bids on lots and responds to second-chance offers. Acts only on its own bidder id."
    identity: "entity_backed:Bidder"
    exclusive_operations:
      - "POST /bidders/{id}/deposits"
      - "POST /auction-lots/{id}/bids"
      - "POST /second-chance-offers/{id}/respond"
    shared_operations:
      - "GET /asset-listings/{id}"
      - "GET /auction-events"
      - "GET /auction-events/{id}"
      - "GET /auction-lots"
      - "GET /auction-lots/{id}"
      - "GET /auction-lots/{id}/sale-contracts"
      - "GET /bidders/{id}"
      - "GET /bidders/{id}/eligibility-assessment"
      - "GET /bids"
      - "GET /bids/{id}"
      - "GET /deposit-holds"
      - "GET /deposit-holds/{id}"
      - "GET /sale-contracts/{id}"
      - "GET /second-chance-offers"
      - "GET /second-chance-offers/{id}"
  - name: Anonymous
    description: "Unauthenticated public visitor. X-User-ID is an arbitrary opaque visitor token tied to no entity. May register as a bidder and read the public auction catalogue with its title and eviction risk disclosures."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /bidders"
      - "GET /asset-listings/{id}"
      - "GET /auction-events"
      - "GET /auction-events/{id}"
      - "GET /auction-lots"
      - "GET /auction-lots/{id}"

