      - name: withdraw_promotion_conserves_offering_seat_count
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - calculations.reconcile_offering_counts
          - entities.WeeklyOffering.fields.enrolled_count
        distinguishing_aspect: |
          Different conserved quantity = headcount (enrolled_count) on a capacity-1 offering: a
          withdraw-then-auto-promotion leaves enrolled_count exactly 1 (one out, one in), so the
          seat count is conserved at capacity even though the occupant changed — drift here would
          either double-fill or empty the week.
        test_recipe:
          setup:
            - "OPEN CAMP weekly_capacity=1 offering; Child A CONFIRMED, Child B WAITLISTED rank 1; enrolled_count=1."
