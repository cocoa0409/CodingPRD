          - validations[priority=29].ERR_INVALID_CASE_QUANTITY
          - endpoints["POST /purchase-lines"]
        distinguishing_aspect: |
          Pair = priority 12 (business_state, 409) against priority 29
          (business_constraint, 422) on POST /purchase-lines. Both are violated by
          one request: the cited member is still PENDING and cases_shipped is 0.
          The state error must win, so the response is ERR_MEMBER_NOT_ENROLLED
          with HTTP 409 — not the 422 range error, and not the priority-7
          ERR_INVALID_REQUEST either, since 0 is a well-typed integer whose
          range is owned by priority 29.
        test_recipe:
          setup:
            - "ProgramTier ELITE and Distributor METRO-01 ACTIVE."
            - "Member Cove Diner has a countersigned ACTIVE PURCHASE_DATA_AND_PRICING letter for METRO-01 but has never been activated, so its enrollment_status is PENDING while active_letter_count is 1 — this keeps the priority-15 ERR_LOA_NOT_ACTIVE rule satisfied so the pair under test is isolated."
            - "A fresh June batch exists in normalization_status RECEIVED, so the priority-11 state rule is satisfied too."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
