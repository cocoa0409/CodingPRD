              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/set-supply-status"
              payload: { supply_status: "MAKE_TO_ORDER" }
              as: ProductionPlanner
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-M", name: "Mu Machining", tier: "STANDARD", regrind_credit_cents: 0 }
              as: ProductionPlanner
              captures: { cu_m: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-O", name: "Omicron Machining", tier: "STANDARD", regrind_credit_cents: 0 }
              as: ProductionPlanner
              captures: { cu_o: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver1: $.data.version }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${cu_o}", product_id: "${product_id}", order_code: "SO-OTHER", quantity: 25, expected_product_version: "${p_ver1}" }
              as: ApplicationEngineer
              captures: { other_order: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver2: $.data.version }
          trigger:
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${cu_o}", product_id: "${product_id}", order_code: "SO-SPOOF", quantity: 25, expected_product_version: "${p_ver2}" }
              as: Customer
              as_user_id: "${cu_m}"
              captures: { err_spoof: $.data.error_id }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${cu_o}", product_id: "${product_id}", order_code: "SO-SPOOF2", quantity: 25, expected_product_version: "${p_ver1}" }
              as: Customer
              as_user_id: "${cu_m}"
              captures: { err_spoof_stale: $.data.error_id }
            - call: "GET /tooling/tool-orders/${other_order}"
              as: Customer
              as_user_id: "${cu_m}"
              captures: { err_read: $.data.error_id }
            - call: "GET /tooling/customers/${cu_o}"
              as: Customer
              as_user_id: "${cu_m}"
              captures: { err_row: $.data.error_id }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${cu_m}", product_id: "${product_id}", order_code: "SO-MINE", quantity: 25, expected_product_version: "${p_ver2}" }
              as: Customer
              as_user_id: "${cu_m}"
              captures: { own_order: $.data.id }
            - call: "GET /tooling/tool-orders"
              payload: { customer_id: "${cu_m}" }
              as: Customer
              as_user_id: "${cu_m}"
              captures: { my_order_code: "$.data[0].order_code" }
          assert:
            - "${err_spoof} == ERR_CUSTOMER_SCOPE_VIOLATION with HTTP status 403"
            - "${err_spoof_stale} == ERR_CUSTOMER_SCOPE_VIOLATION as well, not ERR_STALE_PRODUCT_VERSION, because priority 9 precedes priority 10"
            - "${err_read} == ERR_CUSTOMER_SCOPE_VIOLATION (403), not ERR_ORDER_NOT_FOUND"
            - "${err_row} == ERR_CUSTOMER_SCOPE_VIOLATION for the foreign customer row"
            - "ToolOrder.${own_order} is created 201 for CU-M, and the customer-scoped list returns total_count 1 with ${my_order_code} == SO-MINE (CU-O's order is invisible)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: order_create_pins_the_quoted_product_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.order-create-stale-product
          - errors.ERR_STALE_PRODUCT_VERSION
          - validations[priority=10]
          - endpoints[POST /tooling/tool-orders]
        distinguishing_aspect: "The OCC field is checked against the live product row, and the create itself bumps that row: the same expected_product_version that just worked is stale for the very next order, and a stale token pre-empts the not-orderable check at priority 17 so the client learns its quote is out of date before it learns the product was pulled."
        test_recipe:
          setup:
            - "Product CAT-INS-1 in DEVELOPMENT with supply_status MAKE_TO_ORDER, customer CU-C"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/set-supply-status"
              payload: { supply_status: "MAKE_TO_ORDER" }
              as: ProductionPlanner
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-C", name: "Nu Machining", tier: "STANDARD", regrind_credit_cents: 0 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver_a: $.data.version }
          trigger:
            - call: "POST /tooling/tool-products/${product_id}/set-supply-status"
              payload: { supply_status: "STOCKED" }
              as: ProductionPlanner
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-1", quantity: 25, expected_product_version: "${p_ver_a}" }
              as: ApplicationEngineer
              captures: { err_stale1: $.data.error_id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver_b: $.data.version }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-1", quantity: 25, expected_product_version: "${p_ver_b}" }
              as: ApplicationEngineer
              captures: { order1: $.data.id }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-2", quantity: 25, expected_product_version: "${p_ver_b}" }
              as: ApplicationEngineer
              captures: { err_stale2: $.data.error_id }
            - call: "POST /tooling/tool-products/${product_id}/set-supply-status"
              payload: { supply_status: "UNAVAILABLE" }
              as: ProductionPlanner
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-3", quantity: 25, expected_product_version: "${p_ver_b}" }
              as: ApplicationEngineer
              captures: { err_stale3: $.data.error_id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver_c: $.data.version }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-3", quantity: 25, expected_product_version: "${p_ver_c}" }
              as: ApplicationEngineer
              captures: { err_not_orderable: $.data.error_id }
          assert:
            - "${err_stale1} == ERR_STALE_PRODUCT_VERSION with HTTP status 412 and no SO-1 row"
            - "ToolOrder.${order1} is created 201 with ${p_ver_b}, and its creation bumps ToolProduct.${product_id}.version once"
            - "${err_stale2} == ERR_STALE_PRODUCT_VERSION: the token that just succeeded is already stale"
            - "${err_stale3} == ERR_STALE_PRODUCT_VERSION, not ERR_PRODUCT_NOT_ORDERABLE, because priority 10 precedes priority 17"
            - "${err_not_orderable} == ERR_PRODUCT_NOT_ORDERABLE once the version token is fresh, and exactly one ToolOrder row exists at the end"

      - name: job_create_pins_the_customer_ledger_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.job-create-stale-customer
          - errors.ERR_STALE_CUSTOMER_VERSION
          - validations[priority=10]
          - endpoints[POST /tooling/recondition-jobs]
        distinguishing_aspect: "Intake reserves credit out of the balance the client observed, so any credit adjustment - and the reservation written by a previous intake - invalidates the token; a stale token also pre-empts the credit-hold gate at priority 42, so version staleness is reported before insolvency."
        test_recipe:
          setup:
            - "Regrindable product EM-10-1, customer CU-D ACTIVE with 50000 credit"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-D", name: "Xi Regrind", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver_a: $.data.version }
          trigger:
            - call: "POST /tooling/customers/${customer_id}/credit-adjustments"
              payload: { delta_cents: 10000, reason: "Prepaid regrind block top-up" }
              as: ProductionPlanner
              captures: { credit_after_topup: $.data.regrind_credit_cents }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-1", units_received: 10, expected_customer_version: "${c_ver_a}" }
              as: ProductionPlanner
              captures: { err_stale1: $.data.error_id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver_b: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-1", units_received: 10, expected_customer_version: "${c_ver_b}" }
              as: ProductionPlanner
              captures: { job1: $.data.id, reserved1: $.data.reserved_credit_cents }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-2", units_received: 10, expected_customer_version: "${c_ver_b}" }
              as: ProductionPlanner
              captures: { err_stale2: $.data.error_id }
            - call: "POST /tooling/customers/${customer_id}/credit-adjustments"
              payload: { delta_cents: -60000, reason: "Unpaid invoice recovered from the prepaid block" }
              as: ProductionPlanner
              captures: { acct: $.data.account_status }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-3", units_received: 10, expected_customer_version: "${c_ver_b}" }
              as: ProductionPlanner
              captures: { err_stale3: $.data.error_id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver_c: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-3", units_received: 10, expected_customer_version: "${c_ver_c}" }
              as: ProductionPlanner
              captures: { err_hold: $.data.error_id }
          assert:
            - "${credit_after_topup} == 60000 and the adjustment bumped Customer.version"
            - "${err_stale1} == ERR_STALE_CUSTOMER_VERSION with HTTP status 412"
            - "ReconditionJob.${job1} is created with ${reserved1} == 18500 and Customer.regrind_credit_cents == 41500"
            - "${err_stale2} == ERR_STALE_CUSTOMER_VERSION because the intake itself bumped the customer row"
            - "${acct} == CREDIT_HOLD (41500 - 60000 = -18500) and ${err_stale3} == ERR_STALE_CUSTOMER_VERSION, not ERR_CUSTOMER_CREDIT_HOLD, because priority 10 precedes priority 42"
            - "${err_hold} == ERR_CUSTOMER_CREDIT_HOLD with HTTP status 402 once the token is fresh, and exactly one ReconditionJob row exists"

      - name: product_pins_are_refreshed_only_by_an_explicit_repin
        claim_type: version_pinning_on_approval
        grounds:
          - endpoints[POST /tooling/tool-products/{productId}/repin]
          - validations[priority=21]
          - errors.ERR_PINNED_REVISION_STALE
          - entities.ToolProduct.fields.pinned_geometry_revision
        distinguishing_aspect: "Approval pins the exact revisions that were qualified, and nothing re-pins them implicitly: after the geometry is revised and re-released the product still carries the old pin, so release is refused until an explicit repin, which is the only call that moves the pin forward."
        test_recipe:
          setup:
            - "Dossier DOS-1 APPROVED by qa-3 over two PASS trials, so CAT-INS-1 sits in QUALIFICATION with tool_life_index 21.7 and pinned_geometry_revision 1"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              as_user_id: "ae-7"
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial1: $.data.id }
            - call: "POST /tooling/machining-trials/${trial1}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 } ], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-2", workpiece_material_code: "SS316L", workpiece_group: "M", units_consumed: 20, cutting_speed_vc: 180.0, feed_fz: 0.20, depth_ap: 2.0, coolant: "THROUGH_TOOL" }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { trial2: $.data.id }
            - call: "POST /tooling/machining-trials/${trial2}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 8, vb_um: 160 }, { minutes: 16, vb_um: 250 }, { minutes: 24, vb_um: 305 }, { minutes: 32, vb_um: 330 } ], measured_surface_ra_um: 1.50 }
              as: ApplicationEngineer
              as_user_id: "op-2"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/submit"
              as: ApplicationEngineer
              as_user_id: "ae-7"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/approve"
              payload: { decision_note: "Two-group coverage accepted" }
              as: QualityApprover
              as_user_id: "qa-3"
              captures: { tli: $.data.id }
          trigger:
            - call: "GET /tooling/tool-products/${product_id}"
              as: QualityApprover
              captures: { pin_before: $.data.pinned_geometry_revision, index: $.data.tool_life_index, groups: $.data.qualified_workpiece_groups }
            - call: "POST /tooling/insert-geometries/${geometry_id}/revise"
              payload: { chipbreaker_code: "MM", rake_angle_deg: 14.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED", revision_note: "Rake opened by two degrees after the field trial" }
              as: GeometryEngineer
              captures: { geo_rev: $.data.revision }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              captures: { err_pin: $.data.error_id }
            - call: "POST /tooling/tool-products/${product_id}/repin"
              as: ApplicationEngineer
              captures: { pin_after: $.data.pinned_geometry_revision }
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              captures: { rel: $.data.release_status, sup: $.data.supply_status }
          assert:
            - "${pin_before} == 1, ${index} == 21.7 ((20.0 + 23.3) / 2) and ${groups} == [M, P] sorted ascending"
            - "${geo_rev} == 2 while the product's pin is still 1: no implicit refresh reaches the product"
            - "${err_pin} == ERR_PINNED_REVISION_STALE with HTTP status 409"
            - "${pin_after} == 2 and the repin leaves release_status QUALIFICATION"
            - "${rel} == RELEASED and ${sup} == STOCKED on the second attempt, and tool_life_index is still 21.7 (repin does not re-run the index)"

      - name: cascading_side_effect_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - calculations.engineering_lead_time_days
        excluded_because:
          difficulty_instance: grade_revision_four_hop_cascade
          rationale: "The four-hop chain from a grade revision through the product, its lead time and its open orders, with ordering sensitivity, is exactly that transitive_cascade instance."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.trial_tool_life_rating
        excluded_because:
          difficulty_instance: trial_life_rating_variant_divergence
          rationale: "MEASURED_INTERPOLATED versus PROJECTED_TAYLOR divergence on identical wear data, and the delta between them, is the subject of that dual_variant_calc instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.sinter_qc_evaluation
          - calculations.dossier_composite_score
          - calculations.product_tool_life_index
        distinguishing_aspect: "The model is immediate, so no read-after-write lag is tolerated anywhere: the sinter response itself already carries yield_pct 90.00, qc_status PASSED and remaining_units 180, the trial completion response carries its rating and the dossier's recomputed composite score, and the approve response is followed by a GET with no delay that already shows the product index and the promoted grade."
        test_recipe:
          setup:
            - "Grade WC-P25 with batch BLD-1 and product CAT-INS-1 heading into qualification"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
          trigger:
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
              captures: { s_yield: $.data.yield_pct, s_qc: $.data.qc_status, s_stage: $.data.stage, s_remaining: $.data.remaining_units }
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
              captures: { g_status: $.data.status }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id, p_lead: $.data.engineering_lead_time_days }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              as_user_id: "ae-7"
              captures: { dossier_id: $.data.id, d_composite: $.data.composite_score }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial1: $.data.id }
            - call: "POST /tooling/machining-trials/${trial1}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 } ], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { t1_rated: $.data.rated_life_min, t1_verdict: $.data.verdict }
            - call: "GET /tooling/qualification-dossiers/${dossier_id}"
              as: ApplicationEngineer
              captures: { d_after_one: $.data.composite_score }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-2", workpiece_material_code: "SS316L", workpiece_group: "M", units_consumed: 20, cutting_speed_vc: 180.0, feed_fz: 0.20, depth_ap: 2.0, coolant: "THROUGH_TOOL" }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { trial2: $.data.id }
            - call: "POST /tooling/machining-trials/${trial2}/complete"
              payload: { wear_measurements: [ { minutes: 0, vb_um: 0 }, { minutes: 8, vb_um: 160 }, { minutes: 16, vb_um: 250 }, { minutes: 24, vb_um: 305 }, { minutes: 32, vb_um: 330 } ], measured_surface_ra_um: 1.50 }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { t2_rated: $.data.rated_life_min }
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/submit"
              as: ApplicationEngineer
              as_user_id: "ae-7"
              captures: { d_submitted: $.data.composite_score }
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/approve"
              payload: { decision_note: "Immediate consistency check" }
              as: QualityApprover
              as_user_id: "qa-3"
            - call: "GET /tooling/tool-products/${product_id}"
              as: QualityApprover
              captures: { p_index: $.data.tool_life_index, p_groups: $.data.qualified_workpiece_groups }
            - call: "GET /tooling/carbide-grades/${grade_id}"
              as: MetallurgyEngineer
              captures: { g_after: $.data.status, g_count: $.data.qualified_product_count }
          assert:
            - "${s_yield} == 90.00, ${s_qc} == PASSED, ${s_stage} == SINTERED and ${s_remaining} == 180 in the sinter response itself, with no follow-up GET needed"
            - "${g_status} == PILOT and ${p_lead} == 8 (raw 5 + 6 = 11 is expedite-eligible, so the 3-day shave applies at create time)"
            - "${d_composite} == null on an empty dossier, ${d_after_one} == 1.20 immediately after the first completion, and ${d_submitted} == 1.20 for the two-trial mean"
            - "${t1_rated} == 20.0 with ${t1_verdict} == PASS and ${t2_rated} == 23.3, each returned by the completing call"
            - "${p_index} == 21.7 and ${p_groups} == [M, P] on a GET issued immediately after the approve, and ${g_after} == QUALIFIED with ${g_count} == 0 (the product is qualified but not yet released)"
