            - "after trigger call 2: TourStop.${stop_atl}.pit_party_sold_count == 12, addon_revenue_cents == 40800, tickets_sold_count == 12, gross_ticket_revenue_cents == 38400"
            - "trigger call 4 returns HTTP 409 with ${err_cap} == ERR_PIT_PARTY_CAPACITY_EXCEEDED because 12 + 9 == 21 exceeds the capacity of 20, even though 9 heads alone would be fine"
            - "trigger call 5 returns HTTP 409 with ${err_ratio} == ERR_PIT_PARTY_CAPACITY_EXCEEDED for the per-order rule: 4 heads on 3 seats, although 12 + 4 == 16 leaves aggregate room"
