  # ===========================================================================
  # excluded_because stubs — corners already covered by §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: membership_freeze_unfreeze_cycle_stub
        claim_type: valid_transition
        grounds: [state_machines.Membership.ACTIVE_to_FROZEN, state_machines.Membership.FROZEN_to_ACTIVE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_active_freeze_unfreeze_cycle
          rationale: "The freeze/unfreeze cycle and credit park/restore is fully exercised by the named §1.8 instance."

      - name: reservation_parallel_axes_stub
        claim_type: valid_transition
        grounds: [state_machines.Reservation.BOOKED_to_CHECKED_IN, state_machines.Reservation.UNSETTLED_to_CREDIT_HELD]
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_parallel_booking_and_settlement_axes
          rationale: "Independent booking vs settlement axis evolution is asserted by the named §1.8 instance."

  - section: calculations
    instances:
      - name: retail_net_rounding_order_stub
        claim_type: precision
        grounds: [calculations.retail_net]
        excluded_because:
          difficulty_instance: combinatorial_formula / retail_net_round_per_unit_then_sum
          rationale: "Round-per-unit-then-sum precision pinned and asserted by the named §1.8 instance."

      - name: deposit_gate_combinatorial_stub
        claim_type: correct_result
        grounds: [calculations.bookable_credit_check]
        excluded_because:
          difficulty_instance: combinatorial_formula / deposit_gate_combinatorial_three_inputs
          rationale: "The three-input deposit gate is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: deposit_required_threshold_stub
        claim_type: conditional_validation
        grounds: ["validations[priority=11]", "errors[ERR_DEPOSIT_REQUIRED]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / deposit_gate_combinatorial_three_inputs
          rationale: "ERR_DEPOSIT_REQUIRED at the 2-strike threshold is the failure path of the named §1.8 instance."

      - name: membership_not_active_credit_stub
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_MEMBERSHIP_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / credit_booking_requires_membership_active
          rationale: "ERR_MEMBERSHIP_NOT_ACTIVE on FROZEN membership is asserted by the named §1.8 instance."

      - name: insufficient_credits_stub
        claim_type: aggregate_validation
        grounds: ["validations[priority=14]", "errors[ERR_INSUFFICIENT_CREDITS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / insufficient_credits_zero_balance_empty_pool
          rationale: "ERR_INSUFFICIENT_CREDITS at zero balance is asserted by the named §1.8 instance."

      - name: tech_double_booked_stub
        claim_type: temporal_validation
        grounds: ["validations[priority=12]", "errors[ERR_TECH_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / technician_overlap_no_buffer_closed_open
          rationale: "ERR_TECH_DOUBLE_BOOKED on overlapping slot is asserted by the named §1.8 instance."

      - name: room_double_booked_stub
        claim_type: temporal_validation
        grounds: ["validations[priority=13]", "errors[ERR_ROOM_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / room_overlap_buffer_inclusive_adjacency_blocked
          rationale: "ERR_ROOM_DOUBLE_BOOKED on buffered adjacency is asserted by the named §1.8 instance."

  - section: errors
    instances:
      - name: err_invalid_state_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_before_fiscal_credit_conflict
          rationale: "ERR_INVALID_STATE triggering is asserted by the named §1.8 priority-conflict instance (and several §1.9 invalid_transition corners)."

      - name: err_not_found_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / existence_before_referential_book_conflict
          rationale: "ERR_NOT_FOUND triggering is asserted by the named §1.8 instance (and the get_member_not_found §1.9 corner)."
