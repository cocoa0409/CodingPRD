              as: Scheduler
              captures: { rt_k: $.data.id, rtk_v1: $.data.version }
            - call: "POST /routes/${rt_k}/stops"
              payload: { clinic_id: "${cl_k}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 20, stop_priority: "ROUTINE", expected_route_version: "${rtk_v1}" }
              as: Scheduler
              captures: { st_k: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_k}", patient_name: "Otis", species: "CANINE", study_kind: "MOBILE", requested_modality: "ULTRASOUND", priority: "ROUTINE", clinical_history: "abdominal distension" }
              as: ClinicUser
              as_user_id: "${cl_k}"
              captures: { rf_k: $.data.id }
            - call: "POST /referrals/${rf_k}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_k}", route_stop_id: "${st_k}" }
              as: Scheduler
              captures: { ap_k: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_k}", modality: "ULTRASOUND", body_region: "ABDOMEN" }
              as: ClinicUser
              as_user_id: "${cl_k}"
              captures: { s_k: $.data.id }
            - call: "POST /routes/${rt_k}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /routes/${rt_k}/dispatch"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_k}"
            - call: "POST /route-stops/${st_k}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_k}"
            - call: "POST /qc-checks"
              payload: { equipment_id: "${eq_r}", performed_by_technician_id: "${tc_k}", result: "FAIL", note: "grid line artefact" }
              as: FieldTech
              as_user_id: "${tc_k}"
              captures: { qc_k: $.data.id, aff_k: $.data.affected_study_count }
          trigger:
            - call: "POST /studies/${s_k}/acquire"
              payload: { equipment_id: "${eq_r}", technician_id: "${tc_k}", image_count: 5 }
              as: FieldTech
              as_user_id: "${tc_k}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${aff_k} == 0"
            - "${err_id} == ERR_EQUIPMENT_QUARANTINED"
            - "HTTP status == 409"
            - "Study.${s_k}.workflow_status == ORDERED"
            - "Study.${s_k}.acquired_at == null"
            - "Equipment.${eq_r}.usage_count_since_qc == 0"

  - rule_id: boundary_precision_check
    instances:
      - name: tat_breach_is_strictly_greater_than_at_240_business_minutes
        grounds:
          - calculations.tat_breach_evaluation
          - calculations.tat_elapsed_minutes
          - calculations.business_minutes_between
          - entities.Study.fields.tat_accrued_minutes
          - state_machines.Study.tat.ACCRUING_to_BREACHED
        distinguishing_aspect: |
          Numeric-threshold boundary on the turnaround metric, observed through
          GET /studies/{study_id}: at exactly 240 accrued business minutes the
          study is still ACCRUING, and one further business minute flips it to
          BREACHED. The comparator is > and never >=.
        test_recipe:
          setup:
            - "one TELERAD ROUTINE study created at 2026-05-04T09:00:00Z, a Monday, under a clinic on the default 08:00-17:00 Mon-Fri calendar"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Clockwatch Vet", address_zone: "Z12" }
              as: PlatformAdmin
              captures: { cl_w: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_w}", patient_name: "Juno", species: "CANINE", study_kind: "TELERAD", requested_modality: "RADIOGRAPHY", priority: "ROUTINE", clinical_history: "post-op check" }
              as: ClinicUser
              as_user_id: "${cl_w}"
              captures: { rf_w: $.data.id }
            - call: "POST /referrals/${rf_w}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_w}" }
              as: Scheduler
              captures: { ap_w: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_w}", modality: "RADIOGRAPHY", body_region: "STIFLE" }
              as: ClinicUser
              as_user_id: "${cl_w}"
              captures: { s_w: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T13:00:00Z" }
              as: PlatformAdmin
            - call: "GET /studies/${s_w}"
              payload: {}
              as: ClinicUser
              as_user_id: "${cl_w}"
              captures: { acc_at_240: $.data.tat_accrued_minutes, stat_at_240: $.data.tat_status, tgt: $.data.tat_target_minutes }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T13:01:00Z" }
              as: PlatformAdmin
            - call: "GET /studies/${s_w}"
              payload: {}
              as: ClinicUser
              as_user_id: "${cl_w}"
              captures: { acc_at_241: $.data.tat_accrued_minutes, stat_at_241: $.data.tat_status }
          assert:
            - "${tgt} == 240"
            - "${acc_at_240} == 240"
            - "${stat_at_240} == ACCRUING"
            - "${acc_at_241} == 241"
            - "${stat_at_241} == BREACHED"
            - "GET /notifications?study_id=${s_w}&kind=TAT_BREACHED returns exactly 1 row"

