  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  #   instance 1 = state (priority 5) vs business_safety (priority 7)
  #   instance 2 = business_safety (priority 9) vs business_fiscal (priority 23)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: grant_approve_invalid_state_beats_segregation_of_duties
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.GrantRecommendation.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_safety (priority 7,
          ERR_SEGREGATION_OF_DUTIES). Approving an already-APPROVED grant by the same user who
          recommended it violates BOTH; the lower-priority-number state check wins, so the
          response is ERR_INVALID_STATE (409), never ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE DonorAccount funded 1000000 cash; one grant already APPROVED (recommended by adv-8, approved by officer-4)."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Pri5 Sponsor", ein: "99-9999990" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Arts Org", ein: "99-9000001", ntee_code: "A20", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Pri5 Fund", primary_advisor_user_id: "adv-8" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-8"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-8"
              captures: { ver1: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-8"
              captures: { grant_id: $.data.id }
            - call: "POST /daf/grants/${grant_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-4"
          trigger:
            - call: "POST /daf/grants/${grant_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "adv-8"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE (state precedence over ERR_SEGREGATION_OF_DUTIES)"

      - name: grant_pay_charity_not_vetted_beats_insufficient_grantable
        grounds:
          - validations[priority=9]
          - validations[priority=23]
          - state_machines.GrantRecommendation.SCHEDULED_to_PAID
        distinguishing_aspect: |
          Category pair business_safety (priority 9, ERR_CHARITY_NOT_VETTED) vs business_fiscal
          (priority 23, ERR_INSUFFICIENT_GRANTABLE_BALANCE). A SCHEDULED grant whose charity was
          WATCHLISTED after scheduling AND whose account no longer has enough grantable balance
          violates both on pay; the lower-priority-number charity-vetting check wins, returning
          ERR_CHARITY_NOT_VETTED, never ERR_INSUFFICIENT_GRANTABLE_BALANCE.
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE DonorAccount funded so a 100000-cent grant could schedule, then the charity is WATCHLISTED and the account is drained below the grant amount via a second smaller grant payout — leaving the SCHEDULED grant doubly invalid at pay time."
