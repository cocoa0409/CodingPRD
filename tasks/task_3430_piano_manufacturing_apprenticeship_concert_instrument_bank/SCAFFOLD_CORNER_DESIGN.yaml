  - section: endpoints
    instances:
      - name: apprentice_supervised_advance_credits_endorsement
        claim_type: side_effect_execution
        grounds: ["state_machines.BuildOrder.COMMISSIONED_to_RIM_BENT", entities.BuildStageLog]
        distinguishing_aspect: "Ledger sync: an IN_TRAINING apprentice advancing RIM_BENT under a specialty-matched supervisor appends a BuildStageLog AND credits the endorsement (10 + 120 = 130 effective hours)."
        test_recipe:
          setup: ["MODEL_O build COMMISSIONED (version 1); apprentice with IN_TRAINING RIM_BENDING endorsement holding 10 matched hours"]
          setup_api_calls:
            - { call: "POST /piano-works/wood-batches", payload: { species: MAPLE, moisture_content_pct: 12.0 }, as: WorkshopManager, captures: { wb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-29T00:00:00Z" }, as: WorkshopManager }
            - { call: "POST /piano-works/wood-batches/${wb1}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WorkshopManager }
            - { call: "POST /piano-works/craftsmen", payload: { name: "Rim Master", specialty: RIM_BENDING }, as: WorkshopManager, captures: { cr_rim: $.data.id } }
            - { call: "POST /piano-works/apprentices", payload: { name: "Apr L" }, as: WorkshopManager, captures: { apr: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements", payload: { apprentice_id: "${apr}", operation_type: RIM_BENDING }, as: WorkshopManager, captures: { en: $.data.id } }
            - { call: "POST /piano-works/skill-endorsements/${en}/log-hours", payload: { hours: 10, supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr}" }
            - { call: "POST /piano-works/build-orders", payload: { model: MODEL_O, wood_batch_id: "${wb1}" }, as: WorkshopManager, captures: { b_id: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "POST /piano-works/build-orders/${b_id}/advance", payload: { to_stage: RIM_BENT, hours_applied: 120, expected_build_order_version: "${bv}", supervising_craftsman_id: "${cr_rim}" }, as: Apprentice, as_user_id: "${apr}", captures: { st: $.data.status } }
            - { call: "GET /piano-works/skill-endorsements/${en}", as: WorkshopManager, captures: { eff: $.data.effective_hours, raw: $.data.logged_hours } }
            - { call: "GET /piano-works/build-orders/${b_id}/stage-logs", as: WorkshopManager, captures: { log_actor: "$.data[0].actor_role", log_sup: "$.data[0].supervising_craftsman_id", log_op: "$.data[0].operation_type" } }
          assert:
            - "advance succeeded: captured ${st} == RIM_BENT"
            - "captured effective_hours ${eff} == 130 and logged_hours ${raw} == 130 (120h credited at ratio 1.0, specialty matched)"
            - "stage log: actor_role ${log_actor} == Apprentice, supervising_craftsman_id ${log_sup} == ${cr_rim}, operation_type ${log_op} == RIM_BENDING"

      - name: apprentice_endorsed_advances_unsupervised
