      - name: cert_failed_reinspection_cycle_with_critical_gate
        claim_type: cyclic
        grounds: [state_machines.UnitCertification.FAILED_to_IN_PROGRESS, "errors[ERR_OPEN_WORK_ORDERS_REMAIN]"]
        distinguishing_aspect: "FAILED -> IN_PROGRESS re-inspection is blocked while a CRITICAL work order is open on the unit, and allowed after that work order is cancelled; the cycle then completes FAILED -> IN_PROGRESS -> PASSED."
        test_recipe:
          setup: ["site OPEN-able; unit REGISTERED with cert FAILED; one CRITICAL work order open on the unit"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "FAILED", deficiency_count: 3 }, as: ComplianceInspector, captures: { st_fail: $.data.status } }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "ELECTRICAL", severity: "CRITICAL", description: "exposed wiring" }, as: MaintenanceLead, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector, captures: { err: $.data.error_id } }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "CANCELLED" }, as: MaintenanceLead }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector, captures: { st_insp: $.data.status } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector, captures: { st_pass: $.data.status } }
            - { call: "GET /housing-units/${u_id}", as: OperatorAdmin, captures: { u_st: $.data.status } }
          assert:
            - "st_fail == FAILED"
            - "err == ERR_OPEN_WORK_ORDERS_REMAIN — the FAILED -> IN_PROGRESS loop is gated on zero non-terminal CRITICAL work orders"
            - "st_insp == IN_PROGRESS and st_pass == PASSED after the CRITICAL work order is CANCELLED"
            - "u_st == CERTIFIED — the cyclic re-inspection restored certifiability"

