          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_ENGAGEMENT_INTERVAL\"."
            - "GET /save-plays?account_id=${acct_id} returns 0 items."
            - "Account.${acct_id}.open_save_play_count == 0."

      - name: reconciling_a_draft_forecast_returns_forecast_not_submitted
        claim_type: error_triggerability
        grounds:
          - errors.ERR_FORECAST_NOT_SUBMITTED
          - validations[priority=16]
          - endpoints[id=E47]
        distinguishing_aspect: "The finance axis cannot move while the CS axis is still DRAFT: RECONCILE on an unsubmitted forecast returns ERR_FORECAST_NOT_SUBMITTED (409) and finance_state stays PENDING."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with coverage_posture RESTRICTED."
            - "One RenewalForecast for 2026Q4 left in cs_state DRAFT / finance_state PENDING."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
