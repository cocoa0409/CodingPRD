  - section: cross_cutting_layers
    instances:

      - name: closure_estimate_create_with_a_stale_landfill_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[closure-estimate-create-stale-landfill]
          - validations[priority=8]
          - errors[ERR_STALE_LANDFILL_VERSION]
          - endpoints[POST /closure-cost-estimates]
        distinguishing_aspect: "The OCC rung sits at priority 8, ABOVE the duplicate-estimate-year rung at priority 20, so a stale version wins even when the request would also have been a duplicate filing; and because the successful create itself bumps Landfill.version, the version a client just used is stale for its very next call."
        test_recipe:
          setup:
            - "Landfill LF is registered (version 1) and its version is read BEFORE any cell is certified."
            - "Cell C-1 (design_area_sf 120001) is then driven to QA_CERTIFIED, whose cascade link 2 recomputes the airspace ledger and increments Landfill.version to 2 — exactly the change OCC exists to catch, because certified airspace is the closure-cost basis."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
