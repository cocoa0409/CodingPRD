            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-6002", full_name: "BG One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
