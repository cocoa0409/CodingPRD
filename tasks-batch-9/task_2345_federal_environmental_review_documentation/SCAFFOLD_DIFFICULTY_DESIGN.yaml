  - rule_id: transitive_cascade
    instances:
      - name: ec_trigger_escalates_classification_and_supersedes_ce_memorandum
        grounds:
          - state_machines.ExtraordinaryCircumstanceScreen.SUBMITTED_to_TRIGGERED
          - state_machines.ProposedAction.CLASSIFIED_to_CLASSIFIED
          - state_machines.NepaDocument.publication_status_to_SUPERSEDED
          - calculations.action_classification
          - entities.ProposedAction.fields.extraordinary_circumstance_flag
        distinguishing_aspect: |
          A three-hop chain whose head is an extraordinary-circumstances adjudication: HOP 1 sets
          extraordinary_circumstance_flag true, which is the sole cause of HOP 2 (classification
          escalates CATEGORICAL_EXCLUSION -> ENVIRONMENTAL_ASSESSMENT and review_stage reverts to
          CLASSIFIED), which is the sole cause of HOP 3 (the CE_MEMORANDUM document becomes
          SUPERSEDED). Removing HOP 2 leaves the memorandum untouched.
        test_recipe:
          setup:
            - "ReviewOffice ERO-1 exists with ce_threshold_disturbance_hectares 5.0 and ec_severity_trigger_threshold 3."
            - "ProposedAction 'Trailhead Vault Toilet Replacement' has disturbance_hectares 2.0 and all four sensitivity flags false, so its first classification is CATEGORICAL_EXCLUSION."
            - "A first screen was adjudicated CLEARED, the action is CLASSIFIED, and a DRAFT CE_MEMORANDUM document exists."
            - "A second screen is SUBMITTED with EC_WETLAND present at severity 4, so triggered_codes is [EC_WETLAND]."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - &c_action_ce
              call: "POST /proposed-actions"
              payload: { office_id: "${off_id}", title: "Trailhead Vault Toilet Replacement", disturbance_hectares: 2.0, reference_cost_cents: 400000, in_critical_habitat: false, affects_historic_property: false, tribal_interest: false, floodplain_or_wetland: false }
              as: NepaCoordinator
              captures: { act_ce_id: $.data.id }
            - &c_screen_ce1
              call: "POST /proposed-actions/${act_ce_id}/ec-screens"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "No historic properties" }
                  - { code: "EC_ENDANGERED_SPECIES", present: false, severity: 0, narrative: "No listed species" }
                  - { code: "EC_WETLAND", present: false, severity: 0, narrative: "Desktop review found no wetlands" }
              as: NepaCoordinator
              captures: { scr_ce1_id: $.data.id }
            - &c_adj_ce_cleared
              call: "POST /ec-screens/${scr_ce1_id}/adjudicate"
              payload: { disposition: "CLEARED", adjudicator_note: "Desktop review accepted" }
              as: ReviewingOfficial
            - &c_classify_ce
              call: "POST /proposed-actions/${act_ce_id}/classify"
              payload: {}
              as: NepaCoordinator
            - &c_doc_ce
              call: "POST /proposed-actions/${act_ce_id}/documents"
              payload: { document_type: "CE_MEMORANDUM", title: "Trailhead Vault Toilet Categorical Exclusion Memorandum" }
              as: NepaCoordinator
              captures: { doc_ce_id: $.data.id }
            - &c_screen_ce2
              call: "POST /proposed-actions/${act_ce_id}/ec-screens"
              payload:
                findings:
                  - { code: "EC_HISTORIC", present: false, severity: 0, narrative: "No historic properties" }
                  - { code: "EC_ENDANGERED_SPECIES", present: false, severity: 0, narrative: "No listed species" }
                  - { code: "EC_WETLAND", present: true, severity: 4, narrative: "Field delineation found 0.9 ha of emergent wetland under the vault footprint" }
              as: NepaCoordinator
              captures: { scr_ce2_id: $.data.id }
          trigger:
            - call: "POST /ec-screens/${scr_ce2_id}/adjudicate"
              payload: { disposition: "TRIGGERED", adjudicator_note: "Wetland impact is an extraordinary circumstance" }
              as: ReviewingOfficial
          assert:
            - "Before the trigger: ProposedAction.${act_ce_id}.classification == CATEGORICAL_EXCLUSION and NepaDocument.${doc_ce_id}.publication_status == DRAFT"
            - "HOP 1: ExtraordinaryCircumstanceScreen.${scr_ce2_id}.status == TRIGGERED, triggered_codes == [EC_WETLAND], max_severity == 4"
            - "HOP 1: ProposedAction.${act_ce_id}.ec_screen_outcome == TRIGGERED and extraordinary_circumstance_flag == true"
            - "HOP 2: ProposedAction.${act_ce_id}.classification == ENVIRONMENTAL_ASSESSMENT and review_stage == CLASSIFIED"
            - "HOP 3: NepaDocument.${doc_ce_id}.publication_status == SUPERSEDED and comment_status == CLOSED"
            - "GET /proposed-actions/${act_ce_id}/record-entries contains entry_code values EC_SCREEN_ADJUDICATED, CLASSIFICATION_ESCALATED and DOCUMENT_SUPERSEDED with strictly increasing sequence_no"

      - name: objection_remand_vacates_decision_releases_commitments_and_reverts_document
        grounds:
          - state_machines.Objection.FILED_to_REMANDED
          - state_machines.DecisionDocument.SIGNED_to_VACATED
          - state_machines.MitigationCommitment.BINDING_to_RELEASED
