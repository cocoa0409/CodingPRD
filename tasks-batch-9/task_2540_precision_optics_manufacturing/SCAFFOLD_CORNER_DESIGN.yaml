      - name: second_strip_beyond_the_cycle_limit_scraps_the_run_and_the_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.CoatingRun.VERIFIED_FAIL_to_SCRAPPED
          - state_machines.WorkOrder.COATING_to_SCRAPPED
          - calculations.spectral_performance_verification
          - calculations.blank_conservation_ledger
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          The strip-and-recoat loop is bounded by MAX_STRIP_CYCLES 1: the first strip returns the run to
          LOADED, the second — whose incremented strip_count is 2 — instead sets the run to SCRAPPED and
          fires the WorkOrder COATING -> SCRAPPED cascade with scrap_reason COATING_STRIP_LIMIT, writing
          the reservation off to scrapped (ledger 17/0/0/3); a third strip is then a terminal-state 409.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, tolerance_verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
            - "One work order WO-2540-1 with element_count 2, so spare_blank_count 1 and reserved_blank_count 3 (lot ledger 17/3/0/0)."
            - "One interferometer IF-2540-1 calibrated at 2026-08-01T00:00:00Z with base_uncertainty_waves 0.0010, so capability_ratio 4 * 0.001000 / 0.0800 == 0.0500 and instrument_status CALIBRATED."
            - "The order was ground, polished and figured to FIGURE_ACCEPTED (cumulative_removal_nm 1200.0, remaining 6198.8000)."
            - "A coating run on chamber CH-2540-1 (slot_capacity 2) was booked 2026-08-02T08:00-12:00, deposited, and verified with the spike sample set {450:0.2000, 500:0.1800, 600:0.2200, 650:0.2500, 700:1.3500}: band average 0.4400 passes but worst point 1.3500 exceeds 1.2000, so spectral_verdict FAIL and coating_status VERIFIED_FAIL."
            - "The run was stripped once (strip_count 1, back to LOADED), re-deposited and verified with the same spike set, so it is VERIFIED_FAIL again with strip_count 1."
