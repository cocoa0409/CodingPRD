        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.MisconductCase.HEARING_to_ADJUDICATED, entities.MisconductCase.fields.investigator_user_id]
