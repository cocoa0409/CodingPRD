            - "TradingDesk.${desk_id}.open_bushel_commitment == 0.00"

      - name: dual_variant_divergence_of_delivery_settlement
        claim_type: Variant Divergence
        grounds:
          - calculations.delivery_net_bushels
          - calculations.quality_discount_total
        excluded_because:
          difficulty_instance: dual_variant_calc / delivery_settlement_shrink_first_vs_gross_grade
          rationale: "Both variants are graded from identical readings and both result sets are asserted as literals by the named §1.8 instance."

      - name: dual_variant_divergence_of_cancellation_damages
        claim_type: Variant Divergence
        grounds:
          - calculations.cancellation_damages
        excluded_because:
          difficulty_instance: dual_variant_calc / cancellation_damages_market_loss_vs_replacement_cost
          rationale: "MARKET_LOSS and REPLACEMENT_COST are both driven on identical contracts and both damages figures are asserted as literals by the named §1.8 instance."

  - section: validations
    instances:
      - name: activating_a_bid_at_its_expiry_instant_returns_bid_expired
        claim_type: Temporal validation
        grounds:
          - validations[priority=18]
          - errors[ERR_BID_EXPIRED]
        distinguishing_aspect: "The activation guard is a strict `now < expires_at`, so activating at exactly 2026-08-10T00:00:00Z — the declared expires_at — fails with ERR_BID_EXPIRED while the bid remains DRAFT (DRAFT bids are never auto-expired by the clock)."
        test_recipe:
          setup:
            - "One desk, one elevator and one DRAFT CORN bid whose expires_at is 2026-08-10T00:00:00Z."
            - "Logical clock advanced to exactly 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD25", name: "Corner Desk 25", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 100000, expires_at: "2026-08-10T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DeskAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /grain/bids/${bid_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BID_EXPIRED"
            - "the response status is 422"
            - "Bid.${bid_id}.status == DRAFT"

      - name: activating_a_colliding_bid_returns_duplicate_bid
        claim_type: Violation to Error
        grounds:
          - validations[priority=26]
          - errors[ERR_DUPLICATE_BID]
        distinguishing_aspect: "Two DRAFT bids sharing (location_id, commodity_code, futures_month, delivery_period_start) can coexist; the collision is only enforced at activation, so the second activate returns ERR_DUPLICATE_BID and leaves that bid in DRAFT."
        test_recipe:
          setup:
            - "One desk, one elevator, and two DRAFT CORN bids sharing the same location, commodity, futures month and delivery_period_start; the first has been activated."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD26", name: "Corner Desk 26", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 100000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
