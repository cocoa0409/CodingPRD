        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "One SCREENING exam interpreted BI-RADS 1 with density C on 2026-08-01, so notification_status is PENDING and follow_up_status is NOT_REQUIRED."
            - "A notification letter is generated and sent on 2026-08-01."
            - "The clock is moved to 2026-08-20T00:00:00Z and a compliance run marks the letter DELIVERED_ASSUMED, so notification_status is COMPLETE and Facility.open_notice_obligations is 0."
          setup_api_calls:
