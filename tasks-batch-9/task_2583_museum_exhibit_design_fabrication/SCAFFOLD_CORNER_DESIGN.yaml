              captures: { d8: $.data.id, d8st: $.data.status, d8v: $.data.version, d8act: $.data.actual_cost_cents }
            - call: "POST /shop-drawings/${d8}/start-review"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { d8st2: $.data.status, d8v2: $.data.version, d8act2: $.data.actual_cost_cents, d8est2: $.data.estimate_total_cents }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { com2: $.data.committed_fabrication_cents, unc2: $.data.uncommitted_cents }
            - call: "GET /interactives/${int1}"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
              captures: { i1st: $.data.status, i1idx: $.data.durability_index_verified, i1tier: $.data.maintenance_tier, i1it: $.data.prototype_iteration }
            - call: "POST /interactives/${int1}/mark-fabricated"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
              captures: { i1st2: $.data.status, i1idx2: $.data.durability_index_verified, i1tier2: $.data.maintenance_tier, i1it2: $.data.prototype_iteration }
          assert:
            - "${m1st} == SUBMITTED with ${m1v} == 1, ${pmc0} == 1 and ${pp0} == RESTRICTED - the spec is pending from the instant it is created"
            - "${m1st2} == CONSERVATOR_REVIEW with ${m1v2} == 2 and ${m1verd} == CONSERVATION_SAFE - HTTP 200 on an empty body, one field moved, one version bumped, and the verdict computed at creation is not recomputed"
            - "${pmc1} == 1 and ${pp1} == RESTRICTED - the counter covers SUBMITTED and CONSERVATOR_REVIEW alike, so this action is invisible to the parent counters"
            - "${m1st3} == APPROVED - the ProjectManager submitted and the Conservator decided, exercising both role lists"
            - "${d8st} == SUBMITTED with ${d8v} == 1 and ${d8act} == null - a new sheet carries estimates only"
            - "${d8st2} == UNDER_REVIEW with ${d8v2} == 2, ${d8act2} == null and ${d8est2} == 87400 == round_half_up(8.0 * 9500 * 1.15) + round_half_up(0.5 * 47500 * 1.2) == 87400 - opening a review computes nothing new"
            - "${com2} == ${com0} == 0 and ${unc2} == 9000000 - start-review moves no money"
            - "${i1st} == PROTOTYPE_APPROVED and ${i1st2} == FABRICATED with ${i1idx2} == ${i1idx} == 87.58, ${i1tier2} == ${i1tier} == LOW and ${i1it2} == ${i1it} == 1 - mark-fabricated advances the lifecycle without re-deriving the index, the tier or the iteration counter"

