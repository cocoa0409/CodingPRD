              as: SalesManager
              captures: { cgood_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C NoLic", email: "cnolic@x.com", monthly_income_cents: 1000000, credit_tier: "TIER_C", drivers_license_valid: false }
              as: SalesManager
              captures: { cbad_id: $.data.id }
            - call: "POST /test-drives"
              payload: { vehicle_id: "${vt_id}", customer_id: "${cgood_id}", start_at: "2026-06-10T10:00:00.000Z", end_at: "2026-06-10T10:30:00.000Z" }
              as: SalesManager
          trigger:
            - call: "POST /test-drives"
              payload: { vehicle_id: "${vt_id}", customer_id: "${cbad_id}", start_at: "2026-06-10T10:15:00.000Z", end_at: "2026-06-10T10:45:00.000Z" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_TESTDRIVE_OVERLAP (priority 11, beats ERR_LICENSE_INVALID priority 13)"

