            - "Sku.${sid}.on_hand_qty == 14"

      - name: replen_not_needed_above_min
        claim_type: Input Set Filtering
        grounds:
          - "calculations.replen_qty"
          - "validations[priority=12]"
          - "errors[ERR_REPLEN_NOT_NEEDED]"
        distinguishing_aspect: "Requesting replenishment while pick-face on-hand (21) is strictly above min_qty (20) returns ERR_REPLEN_NOT_NEEDED — the boundary is <=, so 21 is one each past eligibility."
        test_recipe:
