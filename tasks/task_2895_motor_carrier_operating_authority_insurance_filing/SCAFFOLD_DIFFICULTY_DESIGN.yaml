  - rule_id: non_linear_state_machine
    instances:
      - name: application_return_resubmit_cycle_charges_the_fee_once
        grounds:
          - state_machines.AuthorityApplication.DRAFT_to_SUBMITTED
          - state_machines.AuthorityApplication.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.AuthorityApplication.RETURNED_FOR_CORRECTION_to_SUBMITTED
          - entities.AuthorityApplication.fields.submission_count
          - calculations.filing_fee_conservation_invariant
        distinguishing_aspect: |
          Non-linearity by CYCLE plus a BRANCH: SUBMITTED forks three ways and the
          RETURN branch loops back to SUBMITTED without bound, and the loop is not
          idempotent in a naive way — submission_count advances to 2 while the
          FILING_FEE_DEBIT is appended exactly once, so a second traversal of the
          same edge must not re-charge.
        test_recipe:
          setup:
            - "one carrier domiciled in TX with a DRAFT FOR_HIRE_PROPERTY application for TX/OK/NM"
            - "the carrier's fee ledger is empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Brazos Valley Trucking LLC", domicile_state: "TX", self_reported_vehicle_count: 40, self_reported_driver_count: 60, self_reported_oos_rate_pct: 12.5 }
              as: RegistryAdmin
              captures: { carrier6_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${carrier6_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${carrier6_id}"
              captures: { app6_id: $.data.id }
          trigger:
            - call: "POST /authority-applications/${app6_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier6_id}"
            - call: "POST /authority-applications/${app6_id}/vetting-review"
              payload: { disposition: "RETURN", findings: "process agent list incomplete; correct and resubmit" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "POST /authority-applications/${app6_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier6_id}"
          assert:
            - "AuthorityApplication.${app6_id}.status == SUBMITTED"
            - "AuthorityApplication.${app6_id}.submission_count == 2"
            - "AuthorityApplication.${app6_id}.vetting_findings == 'process agent list incomplete; correct and resubmit'"
            - "exactly one FeeLedgerEntry exists for ${carrier6_id}, with entry_type == FILING_FEE_DEBIT and amount_cents == 64791"
            - "Carrier.${carrier6_id}.fees_assessed_total_cents == 64791"
            - "Carrier.${carrier6_id}.fees_reversed_total_cents == 0"
            - "Carrier.${carrier6_id}.fee_balance_cents == 64791"
            - "no OperatingAuthority exists for carrier_id ${carrier6_id}"

      - name: authority_status_and_insurance_status_dimensions_advance_independently
        grounds:
          - state_machines.OperatingAuthority.NOT_FILED_to_PARTIAL
          - state_machines.OperatingAuthority.PARTIAL_to_FILED
          - entities.OperatingAuthority.fields.authority_status
          - entities.OperatingAuthority.fields.insurance_status
          - calculations.required_insurance_minimums
        distinguishing_aspect: |
          Non-linearity by PARALLEL DIMENSIONS on one entity: a household-goods
          authority needs two filing types, so insurance_status walks
          NOT_FILED -> PARTIAL -> FILED across two filings while authority_status
          stays pinned at PENDING throughout — neither dimension's transition is
          a precondition of the other's, and the combined state (PENDING, FILED)
          is a legal resting state.
