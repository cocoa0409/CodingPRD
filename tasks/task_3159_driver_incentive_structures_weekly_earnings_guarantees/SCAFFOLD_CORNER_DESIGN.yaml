              payload: { market_code: "SFB", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Flagged Fay" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 5000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /fraud-flags"
              payload: { driver_id: "${drv}", ride_id: "${ride1}", signal_type: "LOCATION_SPOOF", severity: 3 }
              as: FraudAnalyst
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /fraud-flags/${f1}/confirm"
              payload: {}
              as: PaymentsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED with http 403"
            - "FraudFlag.${f1}.status remains OPEN"

      - name: appeal_provide_info_identity_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - roles[Driver]
          - errors[ERR_APPEAL_IDENTITY_MISMATCH]
        distinguishing_aspect: "A different driver (role-permitted) cannot provide info on another driver's appeal — the entity-backed identity check fires 403 ERR_APPEAL_IDENTITY_MISMATCH."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market PFN; drivers A and B; A's ELIGIBILITY appeal in MORE_INFO."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "PFN", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Owner Owen" }
              as: IncentiveOps
              captures: { drv_a: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Intruder Ingrid" }
              as: IncentiveOps
              captures: { drv_b: $.data.id }
            - call: "POST /appeals"
              payload: { driver_id: "${drv_a}", subject_type: "ELIGIBILITY", reason: "rates" }
              as: Driver
              as_user_id: "${drv_a}"
              captures: { apl: $.data.id }
            - call: "POST /appeals/${apl}/start-review"
              payload: {}
              as: PaymentsOfficer
            - call: "POST /appeals/${apl}/request-info"
              payload: {}
              as: PaymentsOfficer
          trigger:
            - call: "POST /appeals/${apl}/provide-info"
              payload: {}
              as: Driver
              as_user_id: "${drv_b}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPEAL_IDENTITY_MISMATCH with http 403"
            - "Appeal.${apl}.status remains MORE_INFO and round_count == 0"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: optimistic_concurrency_covered_by_endpoint_instances
        claim_type: derived_field_reconciliation
        grounds:
          - concurrency_rules[forecast-approve-stale-program]
          - concurrency_rules[market-budget-update-stale]
        excluded_because:
          difficulty_instance: endpoints / forecast_approve_with_stale_program_version_rejected
          rationale: "Both OCC rules are exercised by the two stale-version corner instances in the endpoints section."

      - name: derived_budget_fields_recomputed_on_program_pause
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Market.fields.budget_available_cents
        excluded_because:
          difficulty_instance: compensating_invariant / market_budget_conservation_across_activate_payout_pause
          rationale: "The invariant instance asserts available/spent/reserved across activate, payout, and pause."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: settlement_pay_immediately_visible_in_statement_and_market
        claim_type: Correct Result
        grounds:
          - complexity_profile.consistency_model
          - state_machines.GuaranteeSettlement.FINALIZED_to_PAID
        distinguishing_aspect: "Immediate consistency: the same POST /settlements/{id}/pay response plus immediate re-reads show market.budget_spent_cents += make_up and the DRAFT statement recomputed — no delay, no staleness."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market EVV budget 10000000; GUARANTEE ACTIVE (500000 / min 1); driver enrolled; one COMPLETED 100000 ride; settlement FINALIZED (make_up 400000); statement computed DRAFT."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "EVV", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Immediate Ida" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "GUARANTEE", title: "G", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], guaranteed_weekly_cents: 500000, guaranteed_min_rides: 1 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /incentive-programs/${prog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${prog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 100000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /settlements/compute"
              payload: { driver_id: "${drv}", program_id: "${prog}", week_start_utc: "2026-09-07T00:00:00Z" }
              as: PaymentsOfficer
              captures: { stl: $.data.id }
            - call: "POST /settlements/${stl}/finalize"
              payload: {}
              as: PaymentsOfficer
            - call: "POST /statements/compute"
              payload: { driver_id: "${drv}", week_start_utc: "2026-09-07T00:00:00Z" }
              as: PaymentsOfficer
              captures: { stmt: $.data.id }
          trigger:
            - call: "POST /settlements/${stl}/pay"
              payload: {}
              as: PaymentsOfficer
            - call: "GET /markets/${mkt}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /statements/${stmt}"
              payload: {}
              as: PaymentsOfficer
          assert:
            - "GuaranteeSettlement.${stl}.status == PAID and paid_at_utc non-null in the pay response itself"
            - "Market.${mkt}.budget_spent_cents == 400000 immediately after pay"
            - "EarningsStatement.${stmt}.make_up_total_cents == 400000 and total_cents == 500000 immediately after pay"
