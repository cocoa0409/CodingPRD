            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /royalty-statements/${stmt}/issue"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_NO_SALES_IN_PERIOD"
            - "RoyaltyStatement.${stmt}.status == ACCRUING (unchanged)"

