        distinguishing_aspect: "A report of CA/94601 against a registration already at CA/94601 is SAME_LOCATION: only reported_state_code, reported_postal_code and last_network_report_at change, while verification_status stays VERIFIED, registration_status stays REGISTERED and the posture stays COMPLIANT."
