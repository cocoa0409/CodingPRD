            - { call: "POST /api/programs/${prog_id}/aircraft-units", payload: { customer_id: "${cust_id}", line_number: 1019, configuration_code: "CFG-A", ordered_configuration_code: "CFG-A", contract_price_cents: 5000000000, contracted_delivery_date: "2026-10-01" }, as: ProductionPlanner, captures: { ac_id: "$.data.id" } }
