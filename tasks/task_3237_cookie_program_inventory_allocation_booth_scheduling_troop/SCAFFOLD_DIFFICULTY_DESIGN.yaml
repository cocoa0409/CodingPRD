      - name: troop_account_money_conservation_payment_refund
        grounds:
          - state_machines.DigitalOrder
          - entities.TroopAccount.fields.balance_cents
          - entities.TroopAccount.fields.proceeds_accrued_cents
        distinguishing_aspect: |
          Conserved quantity = TroopAccount money (a DIFFERENT conserved
          quantity than the season commitment ledger above): record-payment
          (+total charge, +proceeds) paired with refund (-total credit,
          -proceeds clawback) before delivery leaves balance_cents and
          proceeds_accrued_cents EXACTLY at their pre-payment values.
        test_recipe:
          setup:
            - "Season SELLING; troop T1 account at balance 48000/proceeds 8000 from a confirmed order; digital order 12 TM (total 7200, proceeds 1200) created, paid, then refunded (never delivered)"
          setup_api_calls:
