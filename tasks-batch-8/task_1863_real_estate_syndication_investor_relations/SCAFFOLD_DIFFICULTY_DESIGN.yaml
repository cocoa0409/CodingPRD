            - call: "POST /syndications/${syn_id}/properties/${p2_id}/capital-events/${ev2_id}/execute"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${p1_id}", offering_name: "OffA", target_raise_cents: 10000000, min_subscription_cents: 1000000, max_non_accredited_count: 35 }
              as: SponsorOperator
