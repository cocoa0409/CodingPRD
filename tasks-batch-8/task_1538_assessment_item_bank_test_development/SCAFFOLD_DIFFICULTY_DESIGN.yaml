scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: item_p_value_provisional_vs_final_filtering
        grounds:
          - calculations.item_p_value_provisional
          - calculations.item_p_value_final
          - entities.ItemStatistic.fields.p_value
          - entities.ItemStatistic.fields.stats_kind
        distinguishing_aspect: |
          ItemStatistic p_value has two valid algorithms on the SAME entity
          domain (ItemStatistic/Item): PROVISIONAL uses all non-excluded
          responses, FINAL additionally filters by closed-interval timestamp
          AND attempt_duration_seconds >= 30. With 5 responses (one
          short-duration, one outside window), provisional includes them
          but final does not, yielding different p_value numbers.
        test_recipe:
          setup:
            - "Program P1 created (clock starts at 2026-08-01T00:00:00Z)"
            - "ContentStandard CS1 ACTIVE with depth_of_knowledge=2"
            - "Item I1 authored, content-reviewed (ACCEPT), bias-reviewed (ACCEPT), reaches FIELD_TEST_ELIGIBLE with security_posture=SECURED"
            - "FieldTestWindow W1 [2026-08-05T00:00:00Z, 2026-08-10T23:59:59Z], target_sample_size=2"
            - "Clock advanced to 2026-08-06T00:00:00Z (inside window); W1 opened"
            - "5 ItemResponses ingested for I1 in W1: 3 valid (in-window, duration 60s, scores 1,1,0), 1 short-duration (in-window, duration 10s, score 1), 1 out-of-window (timestamp 2026-08-11, score 0)"
            - "Clock advanced past end_utc; W1 closed"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G8", subject: "MATH", grade_level: 8, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CCSS.8.EE.B.5", strand: "EE", description: "Graph proportional relationships", depth_of_knowledge: 2 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "IT-A", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>Solve</p>", options_json: { "A": "1", "B": "2", "correct": "A" }, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, item_v0: $.data.version }
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v0}" }
              as: ItemWriter
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "CONTENT", name: "CC", quorum_size: 2 }
              as: ProgramDirector
              captures: { cc: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${cc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess_c: $.data.id }
            - call: "POST /api/review-sessions/${sess_c}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-sessions/${sess_c}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: ContentReviewer
            - call: "POST /api/review-sessions/${sess_c}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: ContentReviewer
            - call: "POST /api/review-sessions/${sess_c}/close"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "BIAS_SENSITIVITY", name: "BC", quorum_size: 2 }
              as: ProgramDirector
              captures: { bc: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${bc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess_b: $.data.id }
            - call: "POST /api/review-sessions/${sess_b}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-sessions/${sess_b}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: BiasSensitivityReviewer
            - call: "POST /api/review-sessions/${sess_b}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: BiasSensitivityReviewer
            - call: "POST /api/review-sessions/${sess_b}/close"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/field-test-windows"
              payload: { program_id: "${prog}", window_label: "FT1", start_utc: "2026-08-05T00:00:00Z", end_utc: "2026-08-10T23:59:59Z", target_sample_size: 2 }
              as: ProgramDirector
              captures: { win: $.data.id }
            - call: "POST /api/assessment-programs/${prog}/clock/advance"
              payload: { by_seconds: 432000 }
              as: ProgramDirector
            - call: "POST /api/field-test-windows/${win}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/field-test-windows/${win}/responses"
              payload: { item_id: "${item}", student_anon_id: "s1", response_timestamp: "2026-08-06T01:00:00Z", attempt_duration_seconds: 60, raw_score: 1 }
              as: Psychometrician
            - call: "POST /api/field-test-windows/${win}/responses"
              payload: { item_id: "${item}", student_anon_id: "s2", response_timestamp: "2026-08-06T02:00:00Z", attempt_duration_seconds: 60, raw_score: 1 }
              as: Psychometrician
            - call: "POST /api/field-test-windows/${win}/responses"
              payload: { item_id: "${item}", student_anon_id: "s3", response_timestamp: "2026-08-06T03:00:00Z", attempt_duration_seconds: 60, raw_score: 0 }
              as: Psychometrician
            - call: "POST /api/field-test-windows/${win}/responses"
              payload: { item_id: "${item}", student_anon_id: "s4", response_timestamp: "2026-08-06T04:00:00Z", attempt_duration_seconds: 10, raw_score: 1 }
              as: Psychometrician
            - call: "POST /api/field-test-windows/${win}/responses"
              payload: { item_id: "${item}", student_anon_id: "s5", response_timestamp: "2026-08-11T00:00:00Z", attempt_duration_seconds: 60, raw_score: 0 }
              as: Psychometrician
            - call: "POST /api/assessment-programs/${prog}/clock/advance"
              payload: { by_seconds: 500000 }
              as: ProgramDirector
            - call: "POST /api/field-test-windows/${win}/close"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "GET /api/item-statistics"
              payload: { item_id: "${item}", window_id: "${win}" }
              as: Psychometrician
          assert:
            - "Two ItemStatistic rows exist for (item, window): one stats_kind=PROVISIONAL, one stats_kind=FINAL"
            - "PROVISIONAL row p_value == 0.6000 (3 of 5 non-excluded responses scored 1, denominator 5*1)"
            - "FINAL row p_value == 0.6667 (2 of 3 valid responses scored 1, denominator 3*1)"
            - "Item.p_value_provisional == 0.6000 AND Item.p_value_final == 0.6667"
            - "0.6000 != 0.6667 — the two variants produce different observable results for the same item"

      - name: equating_slope_mean_sigma_vs_mean_mean_divergence
        grounds:
          - calculations.equating_scaling_coefficients
          - entities.EquatingLink.fields.scaling_slope
        distinguishing_aspect: |
          EquatingLink is a different entity domain than ItemStatistic. The
          declared mean/sigma slope uses population SD ratio; the alternate
          mean/mean method (industry standard alternative) uses raw mean
          ratio. With anchor items whose p_value_final spreads differ across
          forms, the two methods yield materially different slopes (e.g.,
          1.528 vs 1.139), demonstrating dual-variant behavior on the
          EquatingLink domain.
        test_recipe:
          setup:
            - "Program P2"
            - "3 OPERATIONAL anchor items I1, I2, I3"
            - "Anchor items appear as is_anchor=true FormItemSlots on both F_src (ASSEMBLED) and F_tgt (ASSEMBLED)"
            - "Anchor items have FINAL p_value under source window: 0.5, 0.6, 0.7 (mean=0.6, pop_sd=0.0816)"
            - "Anchor items have FINAL p_value under target window: 0.55, 0.65, 0.85 (mean=0.6833, pop_sd=0.1247)"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G7", subject: "ELA", grade_level: 7, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CCSS.ELA.RL.7.1", strand: "RL", description: "Cite textual evidence", depth_of_knowledge: 2 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-SRC", sections: [{ strand: "RL", item_count: 3, dok_min: 6, dok_max: 6 }] }
              as: TestAssembler
              captures: { bp_src: $.data.id }
            - call: "POST /api/test-blueprints/${bp_src}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp_src}", form_code: "F-SRC", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f_src: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-TGT", sections: [{ strand: "RL", item_count: 3, dok_min: 6, dok_max: 6 }] }
              as: TestAssembler
              captures: { bp_tgt: $.data.id }
            - call: "POST /api/test-blueprints/${bp_tgt}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp_tgt}", form_code: "F-TGT", intended_admin_date: "2026-10-01T00:00:00Z" }
              as: TestAssembler
              captures: { f_tgt: $.data.id }
          trigger:
            - call: "POST /api/equating-links"
              payload: { program_id: "${prog}", source_form_id: "${f_src}", target_form_id: "${f_tgt}", anchor_item_ids: [] }
              as: Psychometrician
          assert:
            - "Declined — full setup would require the entire item pipeline per anchor; this instance stands as documentation that mean/sigma (declared) vs mean/mean (alternative) produces different slope values when variances differ. The unit-test-generator may either reduce this to a numerical computation assertion or extend the chain."
            - "mean/sigma slope = sd_tgt / sd_src = 0.1247 / 0.0816 = 1.528200"
            - "mean/mean slope would be mean_tgt / mean_src = 0.6833 / 0.6 = 1.138833"
            - "1.528200 != 1.138833 — the two variants produce materially different scaling_slope values"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: item_pass_flag_multi_threshold_branching
        grounds:
          - calculations.item_pass_flag
          - entities.ItemStatistic.fields.pass_flag
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          pass_flag depends on point_biserial (two thresholds, strict <) AND
          p_value (two thresholds, inclusive on both ends for PASS). The
          branching structure produces three distinct outputs (FAIL_SEVERE,
          FAIL_BORDERLINE, PASS) based on which combination fires first.
        test_recipe:
          setup:
            - "Program P3 with three items I-X, I-Y, I-Z, each with FINAL ItemStatistic:"
            - "I-X: p_value=0.5 (in [0.30,0.85]) and point_biserial=0.05 (< 0.10 strict)"
            - "I-Y: p_value=0.20 (< 0.30) and point_biserial=0.25 (>= 0.20)"
            - "I-Z: p_value=0.30 (== P_LOW boundary, inclusive) and point_biserial=0.20 (== PB_MIN boundary, inclusive)"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SCI-G5", subject: "SCIENCE", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/item-statistics"
              payload: { stats_kind: "FINAL" }
              as: Psychometrician
          assert:
            - "Item I-X FINAL row: pass_flag == FAIL_SEVERE (point_biserial < 0.10 dominates; p_value irrelevant)"
            - "Item I-Y FINAL row: pass_flag == FAIL_BORDERLINE (p_value < 0.30 fires, point_biserial >= 0.20 so not SEVERE)"
            - "Item I-Z FINAL row: pass_flag == PASS (both at boundary, inclusive semantics on both P_LOW and PB_MIN)"

      - name: equating_nested_rounding_order_matters
        grounds:
          - calculations.equating_scaling_coefficients
          - calculations.item_p_value_final
        distinguishing_aspect: |
          Mode (b) — nested rounding: each anchor item's p_value_final is
          rounded to 4 decimals at stats-write time; then mean and population
          SD are computed over the ROUNDED values; finally scaling_slope and
          scaling_intercept are rounded to 6 decimals. Computing SD from
          unrounded p_values then rounding slope would produce different
          5th-6th decimal results than the declared pipeline. The scaffold
          pins: round p_value first, then derive slope.
        test_recipe:
          setup:
            - "Anchor items with raw p_values that, when rounded to 4 decimals, produce a different SD than the unrounded stream"
            - "For example, raw p_values 0.65432 and 0.65438 both round to 0.6543, collapsing SD from ~3e-5 to 0 — which would trigger ERR_ANCHOR_SET_TOO_HOMOGENEOUS if computed from rounded, but not from unrounded"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G6", subject: "MATH", grade_level: 6, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/assessment-programs/${prog}"
              payload: {}
              as: ProgramDirector
          assert:
            - "Equating slope computed from rounded p_value_final values differs from a slope computed off unrounded intermediates in the 5th-6th decimal place"
            - "The scaffold pins the rounding order: p_value_final first rounded to 4 decimals at write time, THEN used as input to mean/SD, THEN slope rounded to 6 decimals"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: item_parallel_dimensions_status_x_security_posture
        grounds:
          - state_machines.Item
          - entities.Item.fields.status
          - entities.Item.fields.security_posture
        distinguishing_aspect: |
          Item carries TWO independent state dimensions that evolve
          concurrently: `status` (lifecycle: DRAFT→SUBMITTED→CONTENT_REVIEW→
          BIAS_REVIEW→FIELD_TEST_ELIGIBLE→FIELD_TESTING→STATS_REVIEW→
          OPERATIONAL→RETIRED) and `security_posture` (UNSECURED→SECURED→
          EXPOSED→COMPROMISED). The same Item row transitions on one axis
          while the other remains unchanged (e.g., status OPERATIONAL while
          posture transitions SECURED→EXPOSED on first slot creation).
        test_recipe:
          setup:
            - "Item I-M is OPERATIONAL, security_posture=SECURED"
            - "Blueprint BP LOCKED with sections[0].item_count=1, dok range covers I-M"
            - "Form F under BP, ASSEMBLING"
            - "Slot on F references I-M"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SS-G11", subject: "SOCIAL_STUDIES", grade_level: 11, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS-H", strand: "H", description: "History standard", depth_of_knowledge: 2 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-1", sections: [{ strand: "H", item_count: 1, dok_min: 1, dok_max: 4 }] }
              as: TestAssembler
              captures: { bp: $.data.id }
            - call: "POST /api/test-blueprints/${bp}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp}", form_code: "F-1", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /api/test-forms/${f}/assemble"
              payload: { expected_form_version: "${f_v}" }
              as: TestAssembler
          assert:
            - "After assemble succeeds: Item I-M.status remains OPERATIONAL (unchanged)"
            - "After assemble succeeds: Item I-M.security_posture transitions SECURED -> EXPOSED"
            - "The two dimensions move independently: status stays put while posture advances"
            - "I-M.operational_exposure_count incremented by 1"

      - name: testform_forced_rework_cycle
        grounds:
          - state_machines.TestForm.ASSEMBLED_to_ASSEMBLING
          - state_machines.TestForm.EQUATED_to_ASSEMBLING
        distinguishing_aspect: |
          TestForm has a non-linear cycle ASSEMBLED -> ASSEMBLING (forced
          rework) and EQUATED -> ASSEMBLING (forced rework), unlike a linear
          pipeline. The cycle can repeat indefinitely as items become
          COMPROMISED — ASSEMBLING → ASSEMBLED → ASSEMBLING → ASSEMBLED
          is a true cycle, not a one-shot revert.
        test_recipe:
          setup:
            - "Item I-N OPERATIONAL, EXPOSED"
            - "Form F in ASSEMBLED status with slot referencing I-N"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G4", subject: "ELA", grade_level: 4, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/items/placeholder_item_n/mark-compromised"
              payload: {}
              as: SecurityOfficer
          assert:
            - "F transitions ASSEMBLED -> ASSEMBLING"
            - "The slot referencing I-N is deleted"
            - "F can be re-assembled after new slots added — completing the cycle ASSEMBLING -> ASSEMBLED -> ASSEMBLING"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: mark_compromised_full_cascade
        grounds:
          - state_machines.Item.EXPOSED_to_COMPROMISED
          - state_machines.TestForm.ASSEMBLED_to_ASSEMBLING
          - state_machines.TestForm.EQUATED_to_ASSEMBLING
        distinguishing_aspect: |
          Depth-4 cascade originating from POST mark-compromised:
          Item.security_posture EXPOSED->COMPROMISED →
          all FormItemSlots referencing item deleted →
          affected TestForms revert ASSEMBLED->ASSEMBLING (and EQUATED->ASSEMBLING) →
          EquatingLinks with target_form_id = affected form deleted →
          each still-slotted Item on the reworked form has operational_exposure_count decremented.
          Each link is CAUSED by the previous link, not by the original action.
        test_recipe:
          setup:
            - "Item I-C is OPERATIONAL, EXPOSED, operational_exposure_count=2"
            - "Form F1 (ASSEMBLED) has slot for I-C"
            - "Form F2 (EQUATED) has slot for I-C and an EquatingLink L targeting F2"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G3", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/items/placeholder_ic/mark-compromised"
              payload: {}
              as: SecurityOfficer
          assert:
            - "I-C.security_posture == COMPROMISED"
            - "I-C.operational_exposure_count == 0"
            - "F1.status == ASSEMBLING (was ASSEMBLED)"
            - "F2.status == ASSEMBLING (was EQUATED)"
            - "EquatingLink L no longer exists (GET returns 404)"
            - "Other items still slotted on F1 had operational_exposure_count decremented by 1 (compensation)"

      - name: window_close_cascade_to_item_stats
        grounds:
          - state_machines.FieldTestWindow.OPEN_to_CLOSED
          - state_machines.Item.FIELD_TESTING_to_STATS_REVIEW
          - calculations.item_p_value_provisional
          - calculations.item_p_value_final
        distinguishing_aspect: |
          Depth-2 cascade originating from POST window close:
          FieldTestWindow OPEN->CLOSED →
          for every (item, window) pair with responses, ItemStatistic row is created (PROVISIONAL always, FINAL if sample size met) AND Item.status FIELD_TESTING->STATS_REVIEW.
          The item transition is CAUSED by the statistic-row write (the window close directly causes the stats computation, which in turn drives the item status).
        test_recipe:
          setup:
            - "Window W is OPEN with 2 items I-P, I-Q both FIELD_TESTING, each with responses"
            - "I-P has 3 responses (>= target 2); I-Q has 1 response (< target 2)"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SCI-G8", subject: "SCIENCE", grade_level: 8, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/field-test-windows/placeholder_w/close"
              payload: {}
              as: ProgramDirector
          assert:
            - "W.status == CLOSED"
            - "I-P.status == STATS_REVIEW AND I-P has both PROVISIONAL and FINAL ItemStatistic rows"
            - "I-Q.status == STATS_REVIEW AND I-Q has only PROVISIONAL row (no FINAL because sample too small)"
            - "I-P.p_value_final is populated; I-Q.p_value_final is null"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_vs_blueprint_mismatch_priority
        grounds:
          - validations[priority=3.5]
          - validations[priority=4]
          - concurrency_rules[form-assemble-stale-form]
        distinguishing_aspect: |
          Error-category pair: state/OCC (priority 3.5) vs business_constraint
          (priority 4+ / blueprint_mismatch). When a form-assemble request
          carries a stale expected_form_version AND the slot count doesn't
          match the blueprint, the OCC 412 must win because priority 3.5
          precedes priority 4 and beyond.
        test_recipe:
          setup:
            - "Program P5"
            - "Blueprint BP LOCKED with sections[0].item_count=2"
            - "Form F under BP, ASSEMBLING, currently version=4"
            - "Only 1 slot added to F (mismatch: needs 2)"
            - "Client captured form.version=3 before another slot was deleted, so client sends expected_form_version=3 but server has 4"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G7", subject: "MATH", grade_level: 7, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS-A", strand: "S", description: "D", depth_of_knowledge: 2 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-P", sections: [{ strand: "S", item_count: 2, dok_min: 1, dok_max: 8 }] }
              as: TestAssembler
              captures: { bp: $.data.id }
            - call: "POST /api/test-blueprints/${bp}/lock"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp}", form_code: "F-P", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f: $.data.id, f_v0: $.data.version }
            - call: "GET /api/test-forms/${f}"
              payload: {}
              as: TestAssembler
              captures: { f_v_now: $.data.version }
          trigger:
            - call: "POST /api/test-forms/${f}/assemble"
              payload: { expected_form_version: "${f_v0} - 1" }
              as: TestAssembler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (HTTP 412)"
            - "err != ERR_BLUEPRINT_MISMATCH — priority 3.5 wins over priority 4+"

      - name: sod_conflict_vs_rationale_missing_priority
        grounds:
          - validations[priority=6]
          - validations[priority=16]
        distinguishing_aspect: |
          Error-category pair: business_safety (SOD segregation-of-duties,
          priority 6) vs business_constraint (rationale length, priority 16).
          A reviewer who already cast a verdict in a CONTENT session on item
          I attempts to cast a REJECT verdict (without rationale) in a
          BIAS_SENSITIVITY session on the same item — BOTH violations present.
          SOD (priority 6) wins over rationale (priority 16).
        test_recipe:
          setup:
            - "User U1 (as ContentReviewer) cast ACCEPT on item I in CONTENT session"
            - "Item I advanced to BIAS_REVIEW"
            - "Same user U1 (now acting as BiasSensitivityReviewer) attempts to cast REJECT verdict WITHOUT rationale in a BIAS_SENSITIVITY session"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G9", subject: "ELA", grade_level: 9, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS-B", strand: "S", description: "D", depth_of_knowledge: 2 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-SOD", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, item_v: $.data.version }
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v}" }
              as: ItemWriter
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "CONTENT", name: "CC", quorum_size: 2 }
              as: ProgramDirector
              captures: { cc: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${cc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess_c: $.data.id }
            - call: "POST /api/review-sessions/${sess_c}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-sessions/${sess_c}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: ContentReviewer
              as_user_id: "user-u1"
            - call: "POST /api/review-sessions/${sess_c}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: ContentReviewer
              as_user_id: "user-u2"
            - call: "POST /api/review-sessions/${sess_c}/close"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "BIAS_SENSITIVITY", name: "BC", quorum_size: 2 }
              as: ProgramDirector
              captures: { bc: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${bc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess_b: $.data.id }
            - call: "POST /api/review-sessions/${sess_b}/open"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /api/review-sessions/${sess_b}/verdicts"
              payload: { item_id: "${item}", verdict: "REJECT" }
              as: BiasSensitivityReviewer
              as_user_id: "user-u1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_REVIEWER_CONFLICT (HTTP 403)"
            - "err != ERR_RATIONALE_REQUIRED — safety (priority 6) outranks constraint (priority 16)"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: p_value_exactly_at_p_low_boundary_passes
        grounds:
          - calculations.item_pass_flag
          - entities.ItemStatistic.fields.pass_flag
        distinguishing_aspect: |
          Metric: p_value at exactly P_LOW=0.30. The pass_flag formula uses
          strict `<` for the FAIL check; p_value == 0.30 exactly counts as
          PASS on the p_value axis. Tested via the GET /api/item-statistics
          endpoint after a carefully constructed response set yields
          p_value=0.3000 exactly.
        test_recipe:
          setup:
            - "Item I-B1 with max_score_points=1, 10 non-excluded FINAL-eligible responses: exactly 3 with raw_score=1, 7 with raw_score=0"
            - "p_value_final = 3/10 = 0.3000 (exactly at boundary)"
            - "point_biserial = 0.50 (well above 0.20)"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G4", subject: "MATH", grade_level: 4, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/item-statistics"
              payload: { item_id: "placeholder_i_b1", stats_kind: "FINAL" }
              as: Psychometrician
          assert:
            - "FINAL row p_value == 0.3000"
            - "FINAL row pass_flag == PASS (not FAIL_BORDERLINE) — boundary semantics use strict <"

      - name: exposure_cap_exactly_at_limit_succeeds_then_blocks
        grounds:
          - calculations.operational_exposure_count
          - entities.Item.fields.exposure_cap
          - state_machines.TestForm.ASSEMBLING_to_ASSEMBLED
        distinguishing_aspect: |
          Metric: operational_exposure_count vs exposure_cap on the assemble
          endpoint. Rule: assemble succeeds iff for every slot item,
          (current_count + 1) <= exposure_cap — i.e., count+1 == cap passes,
          count+1 == cap+1 rejects with ERR_WOULD_OVER_EXPOSE. Distinct
          metric from p_value; distinct endpoint from statistics GET.
        test_recipe:
          setup:
            - "Item I-B2 OPERATIONAL with exposure_cap=3, current operational_exposure_count=2"
            - "Blueprint BP LOCKED with sections[0].item_count=1"
            - "Form F1 has 1 slot referencing I-B2"
            - "I-B2's (count + 1) = 3 == cap: assemble SUCCEEDS"
            - "After assemble, I-B2 auto-retires (count >= cap)"
            - "A SECOND form F2 with I-B2 slotted would fail because I-B2 is now RETIRED (not OPERATIONAL)"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G6", subject: "ELA", grade_level: 6, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/test-forms/placeholder_f1/assemble"
              payload: { expected_form_version: "${placeholder_f1_v}" }
              as: TestAssembler
          assert:
            - "First assemble (count+1 == cap): HTTP 200, F1 ASSEMBLED, I-B2 auto-retires to RETIRED with retirement_reason=OVER_EXPOSED"
            - "Second assemble attempt with same item on a new form: HTTP 409 with ERR_SLOT_ITEM_NOT_OPERATIONAL (because item is now RETIRED)"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: form_assemble_gated_by_blueprint_lock
        grounds:
          - state_machines.TestForm.ASSEMBLING_to_ASSEMBLED
          - state_machines.TestBlueprint.DRAFT_to_LOCKED
        distinguishing_aspect: |
          Pair: TestForm depends on TestBlueprint. ASSEMBLING->ASSEMBLED on
          the form requires the parent blueprint.status == LOCKED. A form
          under a DRAFT blueprint cannot assemble, even if all slot counts
          match the blueprint spec.
        test_recipe:
          setup:
            - "Blueprint BP in DRAFT status"
            - "Form F under BP in ASSEMBLING"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SCI-G7", subject: "SCIENCE", grade_level: 7, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/test-blueprints"
              payload: { program_id: "${prog}", blueprint_code: "BP-D", sections: [{ strand: "S", item_count: 1, dok_min: 1, dok_max: 4 }] }
              as: TestAssembler
              captures: { bp: $.data.id }
            - call: "POST /api/test-forms"
              payload: { blueprint_id: "${bp}", form_code: "F-D", intended_admin_date: "2026-09-01T00:00:00Z" }
              as: TestAssembler
              captures: { f: $.data.id, f_v: $.data.version }
          trigger:
            - call: "POST /api/test-forms/${f}/assemble"
              payload: { expected_form_version: "${f_v}" }
              as: TestAssembler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BLUEPRINT_NOT_LOCKED (HTTP 409)"
            - "Form status remains ASSEMBLING"

      - name: variant_approval_gated_by_item_state
        grounds:
          - state_machines.ItemVariant.DRAFT_to_APPROVED
        distinguishing_aspect: |
          Pair: ItemVariant depends on Item. DRAFT->APPROVED on a variant
          requires the source Item.status in {OPERATIONAL, FIELD_TESTING,
          STATS_REVIEW}. A variant of a DRAFT item cannot be approved.
        test_recipe:
          setup:
            - "Item I in DRAFT"
            - "ItemVariant V of I in DRAFT"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G5", subject: "MATH", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS-C", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-V", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id }
            - call: "POST /api/item-variants"
              payload: { item_id: "${item}", variant_kind: "TRANSLATION", language_code: "es", stimulus_html: "<p>y</p>", options_json: {} }
              as: TranslationSpecialist
              captures: { var: $.data.id }
          trigger:
            - call: "POST /api/item-variants/${var}/approve"
              payload: {}
              as: ContentReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VARIANT_SOURCE_NOT_READY (HTTP 409)"
            - "Variant remains DRAFT"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: access_grant_full_overlap_rejection_closed_interval
        grounds:
          - validations[priority=17]
          - entities.AccessGrant
        distinguishing_aspect: |
          Resource: AccessGrant. Interval semantics: closed [valid_from,
          valid_until] full-overlap detection. Rule: a new grant is rejected
          iff its interval fully overlaps an existing active grant for same
          (grantee, scope). Adjacent grants (end == start) DO NOT overlap.
        test_recipe:
          setup:
            - "AccessGrant G1 for user U, scope=ITEM_READ, [2026-01-01, 2026-12-31], active"
            - "Attempt to create G2 for same U, same scope, [2026-06-01, 2026-08-31] (fully contained in G1) — must FAIL"
            - "Attempt to create G3 for same U, same scope, [2027-01-01, 2027-12-31] (adjacent, no overlap) — must SUCCEED"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G3", subject: "ELA", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/access-grants"
              payload: { program_id: "${prog}", grantee_user_id: "user-u", grant_scope: "ITEM_READ", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /api/access-grants"
              payload: { program_id: "${prog}", grantee_user_id: "user-u", grant_scope: "ITEM_READ", valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-08-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { err2: $.data.error_id }
            - call: "POST /api/access-grants"
              payload: { program_id: "${prog}", grantee_user_id: "user-u", grant_scope: "ITEM_READ", valid_from: "2027-01-01T00:00:00Z", valid_until: "2027-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { g3: $.data.id }
          assert:
            - "G2 attempt: err2 == ERR_GRANT_OVERLAP (HTTP 409)"
            - "G3 attempt: success (HTTP 201), grant created — adjacency is not overlap"

      - name: response_timestamp_closed_interval_membership
        grounds:
          - calculations.item_p_value_final
          - entities.ItemResponse.fields.response_timestamp
        distinguishing_aspect: |
          Resource: FieldTestWindow. Interval semantics: CLOSED-interval
          membership — a response is included in FINAL iff start_utc <=
          response_timestamp <= end_utc (BOTH endpoints inclusive). A
          response at exactly start_utc is IN; at exactly end_utc is IN;
          at end_utc + 1s is OUT. Different semantic from grant-overlap
          (which detects interval-interval overlap rather than point-in-interval).
        test_recipe:
          setup:
            - "Window [2026-08-05T00:00:00Z, 2026-08-10T23:59:59Z]"
            - "Response R1 at exactly 2026-08-05T00:00:00Z (start, inclusive)"
            - "Response R2 at exactly 2026-08-10T23:59:59Z (end, inclusive)"
            - "Response R3 at 2026-08-11T00:00:00Z (1 sec past end)"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "SCI-G4", subject: "SCIENCE", grade_level: 4, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/field-test-windows/placeholder_w/close"
              payload: {}
              as: ProgramDirector
          assert:
            - "R1 included in FINAL (membership is closed at start)"
            - "R2 included in FINAL (membership is closed at end)"
            - "R3 excluded from FINAL (1 second past end)"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: exposure_count_invariant_on_forced_rework
        grounds:
          - calculations.operational_exposure_count
          - state_machines.TestForm.ASSEMBLED_to_ASSEMBLING
        distinguishing_aspect: |
          Conserved quantity: sum of operational_exposure_count across all
          items. Forward action: FormItemSlot creation + form assemble →
          count += 1 per slot. Compensating action: forced rework
          (mark-compromised) deletes all slots for the compromised item AND
          decrements exposure_count for every OTHER still-slotted item on
          the affected form. Invariant: count_before + count_added ==
          count_after + count_deleted_for_compromised.
        test_recipe:
          setup:
            - "Form F ASSEMBLED with slots for items I-A, I-B, I-C"
            - "I-A.operational_exposure_count = 5, I-B = 3, I-C = 2"
            - "I-B is marked COMPROMISED"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "MATH-G9", subject: "MATH", grade_level: 9, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/items/placeholder_ib/mark-compromised"
              payload: {}
              as: SecurityOfficer
          assert:
            - "I-B.operational_exposure_count == 0 (reset by mark-compromised)"
            - "I-A.operational_exposure_count == 4 (was 5, decremented because F reverted to ASSEMBLING)"
            - "I-C.operational_exposure_count == 1 (was 2, decremented)"
            - "Total before compromise: 5+3+2 = 10; after: 4+0+1 = 5; difference of 5 = (3 reset for I-B) + (1 dec for I-A) + (1 dec for I-C)"

      - name: quorum_tally_verdict_conservation_across_session_cancel
        grounds:
          - calculations.session_quorum_tally
          - state_machines.ReviewSession.OPEN_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: total ReviewVerdicts counted toward an item's
          quorum across all CLOSED sessions. Forward action: verdicts added
          to session, session closes, verdicts count. Compensating action:
          session CANCELLED soft-deletes all its verdicts — they MUST NOT
          contribute to any future quorum tally. Invariant: a re-opened
          session with the same agenda starts with 0 counted verdicts, not
          the pre-cancel count.
        test_recipe:
          setup:
            - "Session S1 (CONTENT) OPEN with 2 ACCEPT verdicts on item I (quorum_size=2)"
            - "S1 cancelled (not closed) — both verdicts soft-deleted"
            - "Session S2 (CONTENT) created with same item I on agenda, opened"
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "ELA-G5", subject: "ELA", grade_level: 5, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS-Q", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-Q", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, item_v: $.data.version }
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v}" }
              as: ItemWriter
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "CONTENT", name: "CC", quorum_size: 2 }
              as: ProgramDirector
              captures: { cc: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${cc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess1: $.data.id }
            - call: "POST /api/review-sessions/${sess1}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-sessions/${sess1}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: ContentReviewer
              as_user_id: "u-alpha"
            - call: "POST /api/review-sessions/${sess1}/verdicts"
              payload: { item_id: "${item}", verdict: "ACCEPT" }
              as: ContentReviewer
              as_user_id: "u-beta"
            - call: "POST /api/review-sessions/${sess1}/cancel"
              payload: {}
              as: ProgramDirector
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${cc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess2: $.data.id }
            - call: "POST /api/review-sessions/${sess2}/open"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /api/review-sessions/${sess2}/close"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCOMPLETE_AGENDA (HTTP 409) — S2 close fails because no verdicts in S2"
            - "Conserved quantity: active_verdict_count(I, CONTENT) == 0 after S1 cancel, even though 2 verdicts were historically submitted"
            - "Item.status remains CONTENT_REVIEW (no quorum-driven transition fires)"
