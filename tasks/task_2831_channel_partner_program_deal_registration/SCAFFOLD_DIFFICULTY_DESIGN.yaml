            - "pre-trigger - Partner.${p1_id}.trailing_revenue_cents == 18310000 (8650000 + 9660000)"
            - "post-trigger - OrderInvoice.${inv_ds_id}.status == CREDITED, credit_memo_cents == 500000, invoice_amount_cents == 9160000, margin_value_cents == 2840000, margin_pct == 0.2367"
