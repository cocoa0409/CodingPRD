              as: Controller
              captures: { ph_exact: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "03-CD", fee_basis: "LUMP_SUM", lump_sum_fee: 80000.00, budget_labor_cost: 229.69, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_over: $.data.id }
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
              as: Controller
            - call: "GET /projects/${p_id}"
              payload: {}
              as: Controller
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_zero}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 7.35 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_zero: $.data.id }
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_exact}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 7.35 }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { te_exact: $.data.id }
            - call: "POST /time-entries"
              payload: { project_id: "${p_id}", phase_id: "${ph_over}", role_code: "PROJECT_ARCHITECT", work_date: "2026-05-11", hours: 7.35 }
              as: ProjectAccountant
