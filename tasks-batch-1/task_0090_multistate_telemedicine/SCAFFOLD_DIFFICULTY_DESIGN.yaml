  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_dea_safety_on_prescription
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DEA_EXAM_REQUIRED]
        distinguishing_aspect: |
          Error-category pair STATE (priority 9) vs BUSINESS_SAFETY (priority 10). A schedule-II
          controlled-rx (no prior exam, would fail DEA recency) is authored on a Visit still in
          REQUESTED (not cleared/approved). Both checks fail; the lower-priority state check wins ->
          ERR_INVALID_STATE, NOT ERR_DEA_EXAM_REQUIRED.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician dea_number set, licensed CA controlled authority."
            - "Visit created but NOT run-compliance (status REQUESTED). No prior completed visit exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", dea_number: "BV1234567", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", controlled_substance_authority: true, effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/prescriptions"
              payload: { drug_name: "Adderall", dea_schedule: "II", days_supply: 30 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: modality_safety_beats_license_referential_on_run_compliance
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_MODALITY_NOT_PERMITTED]
          - errors[ERR_NO_LICENSE_IN_STATE]
        distinguishing_aspect: |
          Error-category pair BUSINESS_SAFETY (priority 12, modality) vs BUSINESS_REFERENTIAL
          (priority 13, license). An AUDIO_ONLY visit in a state the physician is NOT licensed in
          fails both; the lower-priority modality check wins -> ERR_MODALITY_NOT_PERMITTED, NOT
          ERR_NO_LICENSE_IN_STATE. A different category pair than the state/safety conflict above.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed only in CA. AUDIO_ONLY visit with determined_state_code TX (no TX license)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "TX" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "AUDIO_ONLY", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "TX", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_MODALITY_NOT_PERMITTED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dea_recency_window_exact_180_days_passes
        grounds:
          - calculations.dea_exam_recency
          - validations[priority=10]
          - entities.Prescription.fields.dea_schedule
        distinguishing_aspect: |
          NUMERIC threshold on POST /visits/{id}/prescriptions: a schedule-II rx (rule = recency AND
          video) on a VIDEO visit passes ONLY because the prior completed exam is exactly 180 days old
          (delta == DEA_EXAM_RECENCY_DAYS satisfies <=) — video alone never satisfies schedule II, so
          recency is the deciding metric. At 181 days it would fail. Numeric day-count metric.
        test_recipe:
          setup:
            - "Physician dea_number, CA controlled authority (license effective 2025-06-01..2027-01-01). Prior VIDEO visit COMPLETED at clock 2026-01-01 (the exam anchor)."
            - "Clock advanced to exactly 2026-06-30 (= prior completion + 180 days). New VIDEO visit cleared in CA with the controlled-authority CA license as the governing license."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: Anonymous
