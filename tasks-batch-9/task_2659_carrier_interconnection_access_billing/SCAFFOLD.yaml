scenario: |
  Generate task harder than expert level!

  2659. Carrier Interconnection & Access Billing (competitive local exchange carrier): interconnection agreement negotiation with reciprocal compensation, trunking and point of interconnection terms, trunk group provisioning and forecasting with blocking thresholds and augment ordering, call detail record collection with jurisdiction determination for interstate, intrastate and local traffic, access charge billing at tariffed rates with billing dispute intake and resolution timelines, traffic factor negotiation and audits when jurisdiction cannot be determined from signaling, mutual exchange of billing records with reconciliation of usage differences, regulatory tariff filing, rate changes and compliance with access charge reform rules, uncollectible and disputed revenue reserve management

domain_name: carrier-interconnection-access-billing
api_prefix: /interconnection

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint

  entity_topology: graph
  # Graph: UsageBatch points at both Carrier and TrafficFactorFiling; AccessInvoice
  # points at Carrier, UsageBatch and TariffFiling; TariffFiling points at itself
  # (supersession chain); ReserveLedgerEntry points at Carrier and AccessInvoice.
  # There is no single ownership tree — the billing side and the network side of the
  # graph meet only through Carrier and InterconnectionAgreement.

  state_machine_shape: cyclic
  # InterconnectionAgreement cycles PROPOSED -> COUNTERED -> PROPOSED across negotiation
  # rounds; BillingDispute cycles RESOLVED_DENIED -> ESCALATED -> UNDER_REVIEW;
  # TrafficFactorFiling cycles AUDITED -> DISPUTED -> AUDITED; TrunkGroup and
  # AccessInvoice each carry independent parallel status dimensions on one row.

  relationship_patterns:
    - one_to_many          # Carrier -> InterconnectionAgreement, UsageBatch, AccessInvoice
    - cross_aggregate      # UsageBatch -> TrafficFactorFiling, AccessInvoice -> TariffFiling
    - self_referential     # TariffFiling.superseded_by_filing_id -> TariffFiling.id
    - polymorphic          # ReserveLedgerEntry.invoice_id is nullable: carrier-level or invoice-level

  role_model: segregation_of_duties
  # The user who issued an AccessInvoice (X-User-ID stamped as issued_by_user_id) may
  # neither resolve a BillingDispute against it nor write it off, even when holding the
  # DisputeResolutionOfficer / RevenueAssuranceController role.

  consistency_model: immediate

entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: carrier_name
        type: string
        source: input
        description: Legal name of the interconnecting carrier.
        constraints: non-empty, max 120 chars
      - name: ocn
        type: string
        source: input
        description: Operating Company Number identifying the carrier in industry databases.
        constraints: exactly 4 characters, alphanumeric uppercase, globally unique
      - name: carrier_type
        type: enum
        source: input
        description: Regulatory classification driving which rate elements may be billed.
        constraints: "one of {ILEC, CLEC, IXC, CMRS}"
      - name: uncollectible_reserve_balance_usd
        type: number
        source: computed
        description: Reserve held against non-disputed receivables, recomputed by calculations.reserve_provision on every event that changes this carrier's receivable or dispute position.
        default: 0.00
        constraints: 2 decimals, >= 0.00
      - name: disputed_reserve_balance_usd
        type: number
        source: computed
        description: Reserve held against open disputed revenue; persists the regulatory_basis variant of calculations.reserve_provision.
        default: 0.00
        constraints: 2 decimals, >= 0.00
      - name: open_receivable_usd
        type: number
        source: computed
        description: Sum of (billed_amount_usd - credited_amount_usd - paid_amount_usd) over this carrier's AccessInvoice rows whose payment_status IN {UNPAID, PARTIALLY_PAID}.
        default: 0.00
        constraints: 2 decimals
      - name: disputed_receivable_usd
        type: number
        source: computed
        description: Sum of AccessInvoice.disputed_amount_usd over this carrier's AccessInvoice rows whose lifecycle_status == ISSUED; the exposure base of the disputed reserve.
        default: 0.00
        constraints: 2 decimals
      - name: net_receivable_usd
        type: number
        source: computed
        description: open_receivable_usd - disputed_receivable_usd; the tier selector of calculations.reserve_provision.
        default: 0.00
        constraints: 2 decimals

  - name: InterconnectionAgreement
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the counterparty carrier this agreement is negotiated with.
      - name: agreement_label
        type: string
        source: input
        description: Human-readable docket label for the agreement.
        constraints: non-empty, unique per carrier_id
      - name: status
        type: enum
        source: system
        description: Negotiation and lifecycle state; see state_machines.InterconnectionAgreement.
        default: DRAFT
        constraints: "one of {DRAFT, PROPOSED, COUNTERED, EXECUTED, EFFECTIVE, TERMINATED, WITHDRAWN}"
      - name: proposed_reciprocal_rate_per_mou_usd
        type: number
        source: input
        description: Reciprocal compensation rate per minute of use the CLEC opens negotiation with.
        constraints: 6 decimals, > 0
      - name: proposed_term_months
        type: integer
        source: input
        description: Agreement term the CLEC opens negotiation with.
        constraints: ">= 12 and <= 60"
      - name: transit_traffic_allowed
        type: boolean
        source: input
        description: Whether third-party transit traffic may ride the interconnection trunks.
        default: false
      - name: effective_date
        type: datetime
        source: input
        description: Requested commercial effective date; activation is blocked until the logical clock reaches it.
        constraints: ISO 8601 UTC with three fractional digits
      - name: reciprocal_rate_per_mou_usd
        type: number
        source: computed
        description: Reciprocal compensation rate pinned from the accepted NegotiationOffer; null until status reaches EXECUTED.
        constraints: 6 decimals, null before EXECUTED
      - name: term_months
        type: integer
        source: computed
        description: Term pinned from the accepted NegotiationOffer; null until status reaches EXECUTED.
      - name: poi_financial_responsibility
        type: enum
        source: computed
        description: Cost-allocation term pinned from the accepted NegotiationOffer; null until status reaches EXECUTED.
        constraints: "one of {ORIGINATOR_PAYS, SHARED, TERMINATOR_PAYS}, null before EXECUTED"
      - name: poi_facility_capacity_trunks
        type: integer
        source: input
        description: Maximum number of trunks the shared facility at any one poi_clli_code can carry; enforced as an aggregate ceiling across this agreement's TrunkGroup rows.
        constraints: ">= 24, multiple of 24"
      - name: negotiation_round
        type: integer
        source: system
        description: Count of NegotiationOffer rows created against this agreement; gates MAX_NEGOTIATION_ROUNDS.
        default: 0
      - name: capacity_posture
        type: enum
        source: computed
        description: Derived network posture; CONSTRAINED whenever poi_augment_pending_count > 0, BLOCKED whenever any child TrunkGroup has augment_status == AUGMENT_BLOCKED, otherwise NORMAL. BLOCKED wins over CONSTRAINED.
        default: NORMAL
        constraints: "one of {NORMAL, CONSTRAINED, BLOCKED}"
      - name: poi_augment_pending_count
        type: integer
        source: computed
        description: Number of child TrunkAugmentOrder rows whose status IN {PENDING, ACCEPTED}.
        default: 0
      - name: total_in_service_trunks
        type: integer
        source: computed
        description: Sum of TrunkGroup.provisioned_trunks over child trunk groups whose service_status == IN_SERVICE.
        default: 0
      - name: executed_at
        type: datetime
        source: computed
        description: Logical-clock instant the accepted offer executed the agreement; null before EXECUTED.
      - name: terminated_at
        type: datetime
        source: computed
        description: Logical-clock instant of termination; null unless status == TERMINATED.

  - name: NegotiationOffer
    parent: InterconnectionAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> InterconnectionAgreement.id; the agreement under negotiation.
      - name: round_number
        type: integer
        source: system
        description: InterconnectionAgreement.negotiation_round after this offer was appended (1-based).
      - name: offering_party
        type: enum
        source: system
        description: Derived from X-User-Role at creation - CLEC_SIDE for InterconnectionManager, COUNTERPARTY_SIDE for CarrierRepresentative.
        constraints: "one of {CLEC_SIDE, COUNTERPARTY_SIDE}"
      - name: offer_type
        type: enum
        source: input
        description: PROPOSAL opens negotiation from DRAFT; COUNTER responds to the standing offer.
        constraints: "one of {PROPOSAL, COUNTER}"
      - name: reciprocal_rate_per_mou_usd
        type: number
        source: input
        description: Reciprocal compensation rate per minute of use offered in this round; capped by RECIPROCAL_RATE_CAP_PER_MOU_USD.
        constraints: 6 decimals, > 0 (the RECIPROCAL_RATE_CAP_PER_MOU_USD ceiling is enforced by validations priority 20 -> ERR_RECIPROCAL_RATE_CAP_EXCEEDED, not by this field's range check)
      - name: term_months
        type: integer
        source: input
        description: Agreement term offered in this round.
        constraints: ">= 12 and <= 60"
      - name: poi_financial_responsibility
        type: enum
        source: input
        description: Point-of-interconnection cost allocation offered in this round.
        constraints: "one of {ORIGINATOR_PAYS, SHARED, TERMINATOR_PAYS}"
      - name: transit_traffic_allowed
        type: boolean
        source: input
        description: Transit-traffic term offered in this round.
      - name: status
        type: enum
        source: system
        description: OPEN while it is the standing offer; SUPERSEDED when a later offer is appended; ACCEPTED when the opposing party accepts it; WITHDRAWN when the agreement is withdrawn.
        default: OPEN
        constraints: "one of {OPEN, SUPERSEDED, ACCEPTED, WITHDRAWN}"
      - name: responded_at
        type: datetime
        source: computed
        description: Logical-clock instant this offer left OPEN; null while OPEN.

  - name: TrunkGroup
    parent: InterconnectionAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> InterconnectionAgreement.id; the agreement whose interconnection terms govern this trunk group.
      - name: trunk_group_serial
        type: string
        source: input
        description: Two-six-code trunk group serial number.
        constraints: non-empty, unique per agreement_id
      - name: poi_clli_code
        type: string
        source: input
        description: CLLI code of the point of interconnection this trunk group lands on; the aggregate-capacity ceiling is enforced per (agreement_id, poi_clli_code).
        constraints: exactly 11 characters, uppercase
      - name: lata_code
        type: string
        source: input
        description: Three-digit LATA in which the point of interconnection sits.
        constraints: exactly 3 digits
      - name: poi_type
        type: enum
        source: input
        description: Physical arrangement at the point of interconnection.
        constraints: "one of {MEET_POINT, COLLOCATION, LEASED_FACILITY}"
      - name: direction
        type: enum
        source: input
        description: Trunk directionality; selects CCS_PER_TRUNK_TWO_WAY vs CCS_PER_TRUNK_ONE_WAY in calculations.trunk_sizing_and_blocking.
        constraints: "one of {ONE_WAY_OUTBOUND, ONE_WAY_INBOUND, TWO_WAY}"
      - name: traffic_type
        type: enum
        source: input
        description: Traffic class the trunk group carries.
        constraints: "one of {LOCAL_INTERCONNECTION, ACCESS_TANDEM, TRANSIT}"
      - name: service_status
        type: enum
        source: system
        description: Provisioning dimension of the trunk group; evolves independently of augment_status.
        default: REQUESTED
        constraints: "one of {REQUESTED, PROVISIONED, IN_SERVICE, DISCONNECT_PENDING, DISCONNECTED}"
      - name: augment_status
        type: enum
        source: system
        description: Capacity dimension of the trunk group; evolves independently of service_status.
        default: NONE
        constraints: "one of {NONE, AUGMENT_ORDERED, GROOMING_REVIEW, AUGMENT_BLOCKED}"
      - name: provisioned_trunks
        type: integer
        source: computed
        description: Trunks currently physically provisioned; set by provisioning and moved by augment completion and reversal.
        default: 0
      - name: forecast_busy_hour_ccs
        type: number
        source: input
        description: Forecast busy-hour hundred-call-seconds the counterparty has committed to for the forecast horizon.
        constraints: 2 decimals, > 0
      - name: forecast_horizon_quarters
        type: integer
        source: input
        description: Number of quarters the forecast covers.
        constraints: ">= 1 and <= 8"
      - name: latest_blocking_pct
        type: number
        source: computed
        description: blocking_pct of the most recently created TrafficMeasurement for this trunk group, ordered by created_at ASC with the last row winning.
        default: 0.00
        constraints: 2 decimals
      - name: required_trunks
        type: integer
        source: computed
        description: Output of calculations.trunk_sizing_and_blocking for the most recent TrafficMeasurement.
        default: 0
      - name: open_augment_order_count
        type: integer
        source: computed
        description: Number of child TrunkAugmentOrder rows whose status IN {PENDING, ACCEPTED}.
        default: 0
      - name: in_service_at
        type: datetime
        source: computed
        description: Logical-clock instant service_status became IN_SERVICE; null before that.

  - name: TrafficMeasurement
    parent: TrunkGroup
    common_fields: false
    fields:
      - name: trunk_group_id
        type: string
        source: input
        description: FK -> TrunkGroup.id; the measured trunk group.
      - name: measurement_period_start
        type: datetime
        source: input
        description: Inclusive start of the measured study period.
        constraints: ISO 8601 UTC with three fractional digits
      - name: measurement_period_end
        type: datetime
        source: input
        description: Inclusive end of the measured study period; must be strictly after measurement_period_start.
        constraints: ISO 8601 UTC with three fractional digits
      - name: offered_calls
        type: integer
        source: input
        description: Calls offered to the trunk group during the study period.
        constraints: ">= 0"
      - name: blocked_calls
        type: integer
        source: input
        description: Calls blocked by the trunk group during the study period; must be <= offered_calls.
        constraints: ">= 0"
      - name: busy_hour_ccs
        type: number
        source: input
        description: Measured busy-hour hundred-call-seconds carried by the trunk group.
        constraints: 2 decimals, >= 0
      - name: blocking_pct
        type: number
        source: computed
        description: Output of calculations.trunk_sizing_and_blocking blocking step for this measurement.
        constraints: 2 decimals
      - name: required_trunks_at_measurement
        type: integer
        source: computed
        description: required_trunks computed from this measurement, snapshotted so later measurements do not rewrite history.
      - name: augment_triggered
        type: boolean
        source: computed
        description: True when this measurement created a TrunkAugmentOrder or moved augment_status away from NONE.

  - name: TrunkAugmentOrder
    parent: TrunkGroup
    common_fields: true
    fields:
      - name: trunk_group_id
        type: string
        source: computed
        description: FK -> TrunkGroup.id; the trunk group being augmented.
      - name: triggering_measurement_id
        type: string
        source: computed
        description: FK -> TrafficMeasurement.id; the measurement whose blocking breach created this order.
      - name: requested_additional_trunks
        type: integer
        source: computed
        description: DS1-rounded trunk quantity ordered, from calculations.trunk_sizing_and_blocking.
      - name: required_trunks_target
        type: integer
        source: computed
        description: required_trunks the order is sized to reach.
      - name: status
        type: enum
        source: system
        description: Order lifecycle; see state_machines.TrunkAugmentOrder.
        default: PENDING
        constraints: "one of {PENDING, ACCEPTED, REJECTED, COMPLETED, REVERSED}"
      - name: committed_due_date
        type: datetime
        source: input
        description: Due date the counterparty commits to on acceptance; null while PENDING.
        constraints: ISO 8601 UTC with three fractional digits
      - name: install_window_start
        type: datetime
        source: computed
        description: committed_due_date minus INSTALL_WINDOW_DAYS; the closed installation window starts here.
      - name: install_window_end
        type: datetime
        source: computed
        description: Equal to committed_due_date; the closed installation window ends here.
      - name: installed_trunks
        type: integer
        source: input
        description: Trunks actually installed at completion; null before COMPLETED.
        constraints: ">= 1"
      - name: rejection_reason
        type: string
        source: input
        description: Counterparty's stated reason for refusing the augment; null unless status == REJECTED.
      - name: reversed_at
        type: datetime
        source: computed
        description: Logical-clock instant the completion was backed out; null unless status == REVERSED.

  - name: TariffFiling
    parent: null
    common_fields: true
    fields:
      - name: filing_docket
        type: string
        source: input
        description: Regulatory docket number under which the rate is filed.
        constraints: non-empty, globally unique
      - name: rate_element
        type: enum
        source: input
        description: Which tariffed rate element this filing sets.
        constraints: "one of {INTERSTATE_SWITCHED_ACCESS, INTRASTATE_SWITCHED_ACCESS, LOCAL_RECIPROCAL_COMP}"
      - name: rate_per_mou_usd
        type: number
        source: input
        description: Tariffed rate per minute of use for this rate element.
        constraints: 6 decimals, > 0
      - name: benchmark_interstate_rate_per_mou_usd
        type: number
        source: input
        description: The carrier's own interstate switched access benchmark rate, used by validations to enforce the access charge reform parity cap.
        constraints: 6 decimals, > 0
      - name: effective_date
        type: datetime
        source: input
        description: Inclusive start of the rate's effective window.
        constraints: ISO 8601 UTC with three fractional digits
      - name: expiry_date
        type: datetime
        source: input
        description: Exclusive end of the rate's effective window; the window is half-open [effective_date, expiry_date).
        constraints: ISO 8601 UTC with three fractional digits, strictly after effective_date
      - name: status
        type: enum
        source: system
        description: Filing lifecycle; see state_machines.TariffFiling.
        default: FILED
        constraints: "one of {FILED, EFFECTIVE, SUPERSEDED, WITHDRAWN}"
      - name: superseded_by_filing_id
        type: string
        source: computed
        description: FK -> TariffFiling.id; the later filing whose approval truncated this one; null unless status == SUPERSEDED.
      - name: superseded_at
        type: datetime
        source: computed
        description: Logical-clock instant this filing was superseded; null unless status == SUPERSEDED.
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant this filing became EFFECTIVE; null before approval.

  - name: TrafficFactorFiling
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier whose traffic factors these are.
      - name: quarter
        type: string
        source: input
        description: Calendar quarter the factors apply to, formatted YYYYQn.
        constraints: matches ^20[0-9]{2}Q[1-4]$
      - name: reported_piu_pct
        type: number
        source: input
        description: Percent Interstate Usage as reported by the carrier.
        constraints: 2 decimals, >= 0.00 and <= 100.00
      - name: reported_plu_pct
        type: number
        source: input
        description: Percent Local Usage as reported by the carrier.
        constraints: 2 decimals, >= 0.00 and <= 100.00 (the pairwise sum ceiling is enforced by validations priority 20 -> ERR_FACTOR_SUM_EXCEEDS_TOTAL, not by this field's range check)
      - name: audited_piu_pct
        type: number
        source: input
        description: Percent Interstate Usage substituted by audit; null unless status == AUDITED.
        constraints: 2 decimals, >= 0.00 and <= 100.00
      - name: audited_plu_pct
        type: number
        source: input
        description: Percent Local Usage substituted by audit; null unless status == AUDITED.
        constraints: 2 decimals, >= 0.00 and <= 100.00 (the pairwise sum ceiling is enforced by validations priority 20 -> ERR_FACTOR_SUM_EXCEEDS_TOTAL, not by this field's range check)
      - name: effective_piu_pct
        type: number
        source: computed
        description: audited_piu_pct when status == AUDITED, otherwise reported_piu_pct.
        constraints: 2 decimals
      - name: effective_plu_pct
        type: number
        source: computed
        description: audited_plu_pct when status == AUDITED, otherwise reported_plu_pct.
        constraints: 2 decimals
      - name: status
        type: enum
        source: system
        description: Factor negotiation lifecycle; see state_machines.TrafficFactorFiling.
        default: REPORTED
        constraints: "one of {REPORTED, ACCEPTED, DISPUTED, AUDITED, SUPERSEDED}"
      - name: dispute_reason
        type: string
        source: input
        description: Reason the CLEC challenged the reported factors; null unless the filing has been disputed at least once.
      - name: audit_completed_at
        type: datetime
        source: computed
        description: Logical-clock instant the audit substituted factors; null unless the filing has reached AUDITED.
      - name: superseded_at
        type: datetime
        source: computed
        description: Logical-clock instant a newer filing for the same (carrier_id, quarter) displaced this one; null unless status == SUPERSEDED.

  - name: UsageBatch
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier whose exchanged usage this batch holds.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the usage period; the period is the closed interval [period_start, period_end].
        constraints: ISO 8601 UTC with three fractional digits
      - name: period_end
        type: datetime
        source: input
        description: Inclusive end of the usage period; must be strictly after period_start and must be strictly before the logical clock.
        constraints: ISO 8601 UTC with three fractional digits
      - name: direction
        type: enum
        source: input
        description: TERMINATING_TO_US is traffic the counterparty handed us to terminate; ORIGINATING_FROM_US is traffic we handed the counterparty.
        constraints: "one of {TERMINATING_TO_US, ORIGINATING_FROM_US}"
      - name: exchange_reference
        type: string
        source: input
        description: Counterparty's record-exchange reference for this batch.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Batch pipeline state; see state_machines.UsageBatch.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, JURISDICTIONALIZED, RATED, INVOICED}"
      - name: record_count
        type: integer
        source: computed
        description: Number of accepted CallDetailRecord rows in this batch.
        default: 0
      - name: total_billable_minutes
        type: number
        source: computed
        description: Sum of CallDetailRecord.billable_minutes over accepted records in this batch.
        default: 0
        constraints: 4 decimals
      - name: signaling_determined_minutes
        type: number
        source: computed
        description: Sum of billable_minutes over records whose jurisdiction_source == SIGNALING.
        default: 0
        constraints: 4 decimals
      - name: indeterminate_minutes
        type: number
        source: computed
        description: Sum of billable_minutes over records whose jurisdiction == INDETERMINATE.
        default: 0
        constraints: 4 decimals
      - name: interstate_minutes
        type: number
        source: computed
        description: Signaling-derived interstate minutes plus the interstate share of indeterminate_minutes.
        default: 0
        constraints: 4 decimals
      - name: intrastate_minutes
        type: number
        source: computed
        description: Signaling-derived intrastate minutes plus the residual intrastate share of indeterminate_minutes.
        default: 0
        constraints: 4 decimals
      - name: local_minutes
        type: number
        source: computed
        description: Signaling-derived local minutes plus the local share of indeterminate_minutes.
        default: 0
        constraints: 4 decimals
      - name: traffic_factor_filing_id
        type: string
        source: computed
        description: FK -> TrafficFactorFiling.id; the factor filing pinned at jurisdictionalization; null when factor_source == DEFAULT_TARIFF or SIGNALING_ONLY.
      - name: factor_source
        type: enum
        source: computed
        description: Which factor basis allocated the indeterminate minutes; null before jurisdictionalization.
        constraints: "one of {SIGNALING_ONLY, CARRIER_REPORTED, AUDITED, DEFAULT_TARIFF}"
      - name: interstate_amount_usd
        type: number
        source: computed
        description: Interstate jurisdiction subtotal from calculations.access_charge_rating.
        default: 0.00
        constraints: 2 decimals
      - name: intrastate_amount_usd
        type: number
        source: computed
        description: Intrastate jurisdiction subtotal from calculations.access_charge_rating.
        default: 0.00
        constraints: 2 decimals
      - name: local_amount_usd
        type: number
        source: computed
        description: Local reciprocal compensation subtotal from calculations.access_charge_rating.
        default: 0.00
        constraints: 2 decimals
      - name: rated_amount_usd
        type: number
        source: computed
        description: Sum of the three jurisdiction subtotals.
        default: 0.00
        constraints: 2 decimals
      - name: rating_variant
        type: enum
        source: computed
        description: PRELIMINARY when the pinned factor filing was not AUDITED at rating time, FINAL when it was; null before rating.
        constraints: "one of {PRELIMINARY, FINAL}"
      - name: rerate_count
        type: integer
        source: computed
        description: Number of times an audit cascade re-rated this batch.
        default: 0
      - name: jurisdictionalized_at
        type: datetime
        source: computed
        description: Logical-clock instant jurisdiction determination ran; null before that.
      - name: rated_at
        type: datetime
        source: computed
        description: Logical-clock instant rating last ran; refreshed on re-rate.

  - name: CallDetailRecord
    parent: UsageBatch
    common_fields: false
    fields:
      - name: usage_batch_id
        type: string
        source: input
        description: FK -> UsageBatch.id; the batch this record was appended to.
      - name: originating_npanxx
        type: string
        source: input
        description: Six-digit NPA-NXX of the calling party.
        constraints: exactly 6 digits
      - name: terminating_npanxx
        type: string
        source: input
        description: Six-digit NPA-NXX of the called party.
        constraints: exactly 6 digits
      - name: duration_seconds
        type: integer
        source: input
        description: Conversation seconds for the call.
        constraints: ">= 1"
      - name: signaling_cpn_present
        type: boolean
        source: input
        description: Whether Calling Party Number was populated in the SS7 signaling for this call.
      - name: jip_state_code
        type: string
        source: input
        description: Two-letter state code of the Jurisdiction Information Parameter, when signaled; null when absent.
        constraints: exactly 2 uppercase letters or null
      - name: originating_state_code
        type: string
        source: input
        description: Two-letter state code derived from originating_npanxx; null when the NPA-NXX is not in the reference table.
        constraints: exactly 2 uppercase letters or null
      - name: terminating_state_code
        type: string
        source: input
        description: Two-letter state code derived from terminating_npanxx; a record with null here is rejected at ingest as unrateable.
        constraints: exactly 2 uppercase letters or null
      - name: same_local_calling_area
        type: boolean
        source: input
        description: Whether the originating and terminating rate centers share a local calling area per the exchange boundary table.
      - name: billable_minutes
        type: integer
        source: computed
        description: ceil(duration_seconds / 60), computed at ingest.
      - name: jurisdiction
        type: enum
        source: computed
        description: Output of calculations.jurisdiction_determination; null before jurisdictionalization.
        constraints: "one of {LOCAL, INTRASTATE, INTERSTATE, INDETERMINATE}"
      - name: jurisdiction_source
        type: enum
        source: computed
        description: SIGNALING when the record's own signaling settled the jurisdiction, FACTOR_ALLOCATED when its minutes fell into the indeterminate pool; null before jurisdictionalization.
        constraints: "one of {SIGNALING, FACTOR_ALLOCATED}"
      - name: rated_amount_usd
        type: number
        source: computed
        description: Per-record charge rounded to 6 decimals; null for records whose jurisdiction_source == FACTOR_ALLOCATED because their charge is only defined at the batch bucket level.
        constraints: 6 decimals or null

  - name: AccessInvoice
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: computed
        description: FK -> Carrier.id; copied from the source batch at creation.
      - name: usage_batch_id
        type: string
        source: input
        description: FK -> UsageBatch.id; the RATED batch this invoice bills.
      - name: rate_authority_filing_id
        type: string
        source: computed
        description: "FK -> TariffFiling.id; the EFFECTIVE filing that governed the largest jurisdiction subtotal at rating, ranked by subtotal amount DESC with ties broken by rate_element ascending alphabetically."
      - name: lifecycle_status
        type: enum
        source: system
        description: Document dimension of the invoice; evolves independently of payment_status and dispute_status.
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, CLOSED}"
      - name: payment_status
        type: enum
        source: system
        description: Settlement dimension of the invoice; evolves independently of lifecycle_status and dispute_status.
        default: UNPAID
        constraints: "one of {UNPAID, PARTIALLY_PAID, PAID, WRITTEN_OFF}"
      - name: dispute_status
        type: enum
        source: system
        description: Dispute dimension of the invoice; evolves independently of lifecycle_status and payment_status.
        default: NONE
        constraints: "one of {NONE, DISPUTED, RESOLVED}"
      - name: billed_amount_usd
        type: number
        source: computed
        description: UsageBatch.rated_amount_usd snapshotted at creation and refreshed by audit re-rate cascades while lifecycle_status == ISSUED.
        constraints: 2 decimals
      - name: credited_amount_usd
        type: number
        source: computed
        description: Cumulative credits from sustained or deemed-allowed disputes and reconciliation adjustments.
        default: 0.00
        constraints: 2 decimals
      - name: paid_amount_usd
        type: number
        source: computed
        description: Cumulative cash applied by the counterparty.
        default: 0.00
        constraints: 2 decimals
      - name: open_balance_usd
        type: number
        source: computed
        description: billed_amount_usd - credited_amount_usd - paid_amount_usd.
        constraints: 2 decimals
      - name: disputed_amount_usd
        type: number
        source: computed
        description: Sum of disputed_amount_usd over child BillingDispute rows whose status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}.
        default: 0.00
        constraints: 2 decimals
      - name: due_date
        type: datetime
        source: input
        description: Payment due date printed on the invoice.
        constraints: ISO 8601 UTC with three fractional digits
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant the invoice was issued; null while DRAFT.
      - name: dispute_deadline_at
        type: datetime
        source: computed
        description: issued_at plus DISPUTE_FILING_WINDOW_DAYS; disputes filed at exactly this instant are still accepted.
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the AccessBillingAnalyst who issued the invoice; the segregation-of-duties checks compare it against the acting user on dispute resolution and write-off.
      - name: interstate_amount_usd
        type: number
        source: computed
        description: Interstate subtotal snapshotted from the batch at creation and on re-rate.
        default: 0.00
        constraints: 2 decimals
      - name: intrastate_amount_usd
        type: number
        source: computed
        description: Intrastate subtotal snapshotted from the batch at creation and on re-rate.
        default: 0.00
        constraints: 2 decimals
      - name: local_amount_usd
        type: number
        source: computed
        description: Local reciprocal compensation subtotal snapshotted from the batch at creation and on re-rate.
        default: 0.00
        constraints: 2 decimals
      - name: rating_variant
        type: enum
        source: computed
        description: Mirrors UsageBatch.rating_variant at the time the amounts were snapshotted.
        constraints: "one of {PRELIMINARY, FINAL}"
      - name: adjustment_count
        type: integer
        source: computed
        description: Number of times billed_amount_usd or credited_amount_usd changed after issuance.
        default: 0
      - name: written_off_at
        type: datetime
        source: computed
        description: Logical-clock instant the balance was written off; null unless payment_status == WRITTEN_OFF.

  - name: BillingDispute
    parent: AccessInvoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> AccessInvoice.id; the invoice being disputed.
      - name: disputed_amount_usd
        type: number
        source: input
        description: Amount of the invoice the counterparty refuses to pay pending resolution.
        constraints: 2 decimals, > 0.00
      - name: reason_code
        type: enum
        source: input
        description: Dispute basis; selects the resolution SLA in calculations.dispute_sla_and_deemed_allowed.
        constraints: "one of {RATE_APPLICATION, JURISDICTION_FACTOR, USAGE_DISCREPANCY}"
      - name: supporting_detail
        type: string
        source: input
        description: Narrative and record references supporting the dispute.
        constraints: non-empty, max 500 chars
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle; see state_machines.BillingDispute.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, ESCALATED, RESOLVED_SUSTAINED, RESOLVED_DENIED, RESOLVED_DEEMED_ALLOWED, WITHDRAWN}"
      - name: sla_days
        type: integer
        source: computed
        description: Resolution SLA in calendar days selected from reason_code.
      - name: filed_at
        type: datetime
        source: computed
        description: Logical-clock instant the dispute was submitted.
      - name: resolution_due_at
        type: datetime
        source: computed
        description: filed_at plus sla_days, extended by ESCALATION_EXTENSION_DAYS on each escalation.
      - name: escalation_round
        type: integer
        source: computed
        description: Number of times the dispute has been escalated; capped by ESCALATION_LIMIT.
        default: 0
      - name: credited_amount_usd
        type: number
        source: input
        description: Credit granted at resolution; 0.00 for denied disputes and equal to disputed_amount_usd for deemed-allowed disputes.
        default: 0.00
        constraints: 2 decimals, >= 0.00 (the decision-dependent ceiling is enforced by validations priority 28 -> ERR_INVALID_CREDIT_AMOUNT, not by this field's range check)
      - name: resolution_note
        type: string
        source: input
        description: Resolution narrative; null until resolved.
      - name: resolved_at
        type: datetime
        source: computed
        description: Logical-clock instant the dispute left the open set; null while open.
      - name: resolved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the resolver, or the literal SYSTEM_SWEEP for deemed-allowed outcomes.

  - name: ReconciliationCase
    parent: UsageBatch
    common_fields: true
    fields:
      - name: usage_batch_id
        type: string
        source: input
        description: FK -> UsageBatch.id; our side of the mutual record exchange.
      - name: counterparty_reported_minutes
        type: number
        source: input
        description: Billable minutes the counterparty reported for the same period and direction.
        constraints: 4 decimals, >= 0
      - name: counterparty_reported_amount_usd
        type: number
        source: input
        description: Amount the counterparty computed for the same period and direction.
        constraints: 2 decimals, >= 0.00
      - name: exchange_reference
        type: string
        source: input
        description: Reference of the counterparty record-exchange file being reconciled.
        constraints: non-empty
      - name: our_minutes
        type: number
        source: computed
        description: UsageBatch.total_billable_minutes snapshotted at creation.
        constraints: 4 decimals
      - name: our_amount_usd
        type: number
        source: computed
        description: UsageBatch.rated_amount_usd snapshotted at creation.
        constraints: 2 decimals
      - name: minute_variance_pct
        type: number
        source: computed
        description: Output of calculations.record_exchange_reconciliation.
        constraints: 2 decimals
      - name: amount_variance_usd
        type: number
        source: computed
        description: our_amount_usd - counterparty_reported_amount_usd.
        constraints: 2 decimals
      - name: status
        type: enum
        source: system
        description: Reconciliation lifecycle; see state_machines.ReconciliationCase.
        default: OPEN
        constraints: "one of {OPEN, VARIANCE_IDENTIFIED, ADJUSTED, ACCEPTED}"
      - name: agreed_minutes
        type: number
        source: input
        description: Minutes both carriers settled on at adjustment; null unless status == ADJUSTED.
        constraints: 4 decimals, >= 0
      - name: adjustment_amount_usd
        type: number
        source: computed
        description: Credit posted to the invoice at adjustment; null unless status == ADJUSTED.
        constraints: 2 decimals
      - name: adjusted_at
        type: datetime
        source: computed
        description: Logical-clock instant of adjustment; null unless status == ADJUSTED.

  - name: ReserveLedgerEntry
    parent: Carrier
    common_fields: false
    fields:
      - name: carrier_id
        type: string
        source: computed
        description: FK -> Carrier.id; the carrier whose reserve bucket moved.
      - name: invoice_id
        type: string
        source: computed
        description: FK -> AccessInvoice.id; the invoice that caused the movement, or null for carrier-level reserve re-measurement.
      - name: reserve_bucket
        type: enum
        source: computed
        description: Which reserve balance this entry moves.
        constraints: "one of {DISPUTED_REVENUE, UNCOLLECTIBLE}"
      - name: entry_type
        type: enum
        source: computed
        description: Event class that produced the entry.
        constraints: "one of {DISPUTE_PROVISION, DISPUTE_RELEASE, UNCOLLECTIBLE_ADJUSTMENT, WRITE_OFF, RECONCILIATION_ADJUSTMENT}"
      - name: amount_usd
        type: number
        source: computed
        description: Signed movement applied to the bucket; positive increases the reserve, negative releases it.
        constraints: 2 decimals
      - name: balance_after_usd
        type: number
        source: computed
        description: Bucket balance after this entry was appended.
        constraints: 2 decimals
      - name: source_event
        type: string
        source: computed
        description: "Stable event tag: one of BILLING_DISPUTE_SUBMITTED, BILLING_DISPUTE_ESCALATED, BILLING_DISPUTE_WITHDRAWN, BILLING_DISPUTE_RESOLVED, DISPUTE_DEADLINE_SWEEP, INVOICE_CREATED, INVOICE_PAYMENT_APPLIED, INVOICE_WRITTEN_OFF, RECONCILIATION_ADJUSTED, FACTOR_AUDIT_RERATE."

state_machines:
  - entity: InterconnectionAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /interconnection/agreements/{agreement_id}/offers with offer_type PROPOSAL"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status == DRAFT"
          - "agreement.negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "payload.expected_agreement_version == agreement.version"
        side_effects:
          - "NegotiationOffer row appended with status OPEN, offering_party CLEC_SIDE, round_number = agreement.negotiation_round + 1"
          - "agreement.negotiation_round increments by 1"
          - "increments InterconnectionAgreement.version by 1"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /interconnection/agreements/{agreement_id}/offers with offer_type COUNTER submitted by the counterparty"
        actor: CarrierRepresentative
        preconditions:
          - "agreement.status == PROPOSED"
          - "the standing NegotiationOffer (status == OPEN) has offering_party == CLEC_SIDE"
          - "agreement.negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "payload.expected_agreement_version == agreement.version"
        side_effects:
          - "the standing NegotiationOffer moves OPEN -> SUPERSEDED and its responded_at is stamped with the logical clock"
          - "new NegotiationOffer row appended with status OPEN, offering_party COUNTERPARTY_SIDE"
          - "agreement.negotiation_round increments by 1"
          - "increments InterconnectionAgreement.version by 1"
        note: "Cycle edge: the counterparty's counter moves the agreement to COUNTERED, from which the CLEC may counter back to PROPOSED."
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /interconnection/agreements/{agreement_id}/offers with offer_type COUNTER submitted by the CLEC"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status == COUNTERED"
          - "the standing NegotiationOffer (status == OPEN) has offering_party == COUNTERPARTY_SIDE"
          - "agreement.negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "payload.expected_agreement_version == agreement.version"
        side_effects:
          - "the standing NegotiationOffer moves OPEN -> SUPERSEDED and its responded_at is stamped with the logical clock"
          - "new NegotiationOffer row appended with status OPEN, offering_party CLEC_SIDE"
          - "agreement.negotiation_round increments by 1"
          - "increments InterconnectionAgreement.version by 1"
        note: "Closes the PROPOSED -> COUNTERED -> PROPOSED negotiation cycle; termination is enforced by MAX_NEGOTIATION_ROUNDS."
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /interconnection/negotiation-offers/{offer_id}/accept"
        actor: CarrierRepresentative
        preconditions:
          - "agreement.status == PROPOSED"
          - "offer.agreement_id == agreement.id"
          - "offer.status == OPEN"
          - "offer.offering_party == CLEC_SIDE (the acting party is not the offeror)"
        side_effects:
          - "offer moves OPEN -> ACCEPTED with responded_at stamped"
          - "agreement.reciprocal_rate_per_mou_usd, term_months, poi_financial_responsibility and transit_traffic_allowed are pinned from the accepted offer"
          - "agreement.executed_at stamped with the logical clock"
          - "increments InterconnectionAgreement.version by 1"
      - from: COUNTERED
        to: EXECUTED
        trigger: "POST /interconnection/negotiation-offers/{offer_id}/accept"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status == COUNTERED"
          - "offer.agreement_id == agreement.id"
          - "offer.status == OPEN"
          - "offer.offering_party == COUNTERPARTY_SIDE (the acting party is not the offeror)"
        side_effects:
          - "offer moves OPEN -> ACCEPTED with responded_at stamped"
          - "agreement.reciprocal_rate_per_mou_usd, term_months, poi_financial_responsibility and transit_traffic_allowed are pinned from the accepted offer"
          - "agreement.executed_at stamped with the logical clock"
          - "increments InterconnectionAgreement.version by 1"
      - from: EXECUTED
        to: EFFECTIVE
        trigger: "POST /interconnection/agreements/{agreement_id}/activate"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status == EXECUTED"
          - "logical clock >= agreement.effective_date"
          - "a TariffFiling with rate_element == LOCAL_RECIPROCAL_COMP and status == EFFECTIVE covers agreement.effective_date in its half-open window [effective_date, expiry_date)"
        side_effects:
          - "agreement.capacity_posture recomputed (NORMAL when no child augment orders are open)"
          - "increments InterconnectionAgreement.version by 1"
        note: "Cross-entity gate: the reciprocal compensation rate element must be on file and effective before interconnection goes live."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /interconnection/agreements/{agreement_id}/withdraw"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status IN {PROPOSED, COUNTERED}"
        side_effects:
          - "the standing NegotiationOffer moves OPEN -> WITHDRAWN with responded_at stamped"
          - "increments InterconnectionAgreement.version by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /interconnection/agreements/{agreement_id}/withdraw"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status IN {PROPOSED, COUNTERED}"
        side_effects:
          - "the standing NegotiationOffer moves OPEN -> WITHDRAWN with responded_at stamped"
          - "increments InterconnectionAgreement.version by 1"
      - from: EFFECTIVE
        to: TERMINATED
        trigger: "POST /interconnection/agreements/{agreement_id}/terminate"
        actor: InterconnectionManager
        preconditions:
          - "agreement.status == EFFECTIVE"
          - "no child UsageBatch of agreement.carrier_id has status IN {SUBMITTED, JURISDICTIONALIZED}"
        side_effects:
          - "agreement.terminated_at stamped with the logical clock"
          - "every child TrunkGroup whose service_status IN {REQUESTED, PROVISIONED, IN_SERVICE} moves to DISCONNECT_PENDING, processed in created_at ASC order"
          - "each TrunkGroup that moved to DISCONNECT_PENDING cancels its own open augment orders: every child TrunkAugmentOrder whose status IN {PENDING, ACCEPTED} moves to REJECTED with rejection_reason AGREEMENT_TERMINATED"
          - "each cancelled TrunkAugmentOrder decrements agreement.poi_augment_pending_count by 1; agreement.capacity_posture recomputed once all decrements are applied"
          - "agreement.total_in_service_trunks recomputed to 0 because no child TrunkGroup remains IN_SERVICE"
          - "increments InterconnectionAgreement.version by 1"
        note: "Conditional cascade down: only non-terminal children are touched; DISCONNECTED trunk groups and REJECTED/COMPLETED/REVERSED augment orders are left alone."

  - entity: NegotiationOffer
    initial_state: OPEN
    terminal_states: [SUPERSEDED, ACCEPTED, WITHDRAWN]
    shape: branching
    transitions:
      - from: OPEN
        to: SUPERSEDED
        trigger: "system event: a later NegotiationOffer is appended to the same agreement"
        actor: system
        preconditions:
          - "offer.status == OPEN"
        side_effects:
          - "offer.responded_at stamped with the logical clock"
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /interconnection/negotiation-offers/{offer_id}/accept"
        actor: InterconnectionManager | CarrierRepresentative
        preconditions:
          - "offer.status == OPEN"
          - "the acting party is not the offer's offering_party"
        side_effects:
          - "offer.responded_at stamped with the logical clock"
          - "agreement moves PROPOSED|COUNTERED -> EXECUTED"
      - from: OPEN
        to: WITHDRAWN
        trigger: "system event: the parent agreement is withdrawn"
        actor: system
        preconditions:
          - "offer.status == OPEN"
        side_effects:
          - "offer.responded_at stamped with the logical clock"

  - entity: TrunkGroup
    dimension: service_status
    initial_state: REQUESTED
    terminal_states: [DISCONNECTED]
    shape: linear_with_guarded_edges
    transitions:
      - from: REQUESTED
        to: PROVISIONED
        trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/provision"
        actor: NetworkPlanner
        preconditions:
          - "trunk_group.service_status == REQUESTED"
          - "payload.provisioned_trunks is a positive multiple of DS1_TRUNKS"
          - "the sum of provisioned_trunks over sibling TrunkGroup rows sharing (agreement_id, poi_clli_code) whose service_status IN {PROVISIONED, IN_SERVICE}, plus payload.provisioned_trunks, is <= agreement.poi_facility_capacity_trunks"
        side_effects:
          - "trunk_group.provisioned_trunks set to payload.provisioned_trunks"
          - "increments TrunkGroup.version by 1"
      - from: PROVISIONED
        to: IN_SERVICE
        trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/activate"
        actor: NetworkPlanner
        preconditions:
          - "trunk_group.service_status == PROVISIONED"
          - "the parent InterconnectionAgreement.status == EFFECTIVE"
        side_effects:
          - "trunk_group.in_service_at stamped with the logical clock"
          - "agreement.total_in_service_trunks increases by trunk_group.provisioned_trunks"
          - "increments TrunkGroup.version by 1"
        note: "Cross-entity guard: TrunkGroup cannot carry traffic until its agreement is EFFECTIVE."
      - from: IN_SERVICE
        to: DISCONNECT_PENDING
        trigger: "system event: the parent InterconnectionAgreement is terminated"
        actor: system
        preconditions:
          - "trunk_group.service_status IN {REQUESTED, PROVISIONED, IN_SERVICE}"
        side_effects:
          - "agreement.total_in_service_trunks decreases by trunk_group.provisioned_trunks"
          - "open child TrunkAugmentOrder rows are rejected (see InterconnectionAgreement EFFECTIVE -> TERMINATED)"
          - "increments TrunkGroup.version by 1"
      - from: REQUESTED
        to: DISCONNECT_PENDING
        trigger: "system event: the parent InterconnectionAgreement is terminated"
        actor: system
        preconditions:
          - "trunk_group.service_status IN {REQUESTED, PROVISIONED, IN_SERVICE}"
        side_effects:
          - "increments TrunkGroup.version by 1"
      - from: PROVISIONED
        to: DISCONNECT_PENDING
        trigger: "system event: the parent InterconnectionAgreement is terminated"
        actor: system
        preconditions:
          - "trunk_group.service_status IN {REQUESTED, PROVISIONED, IN_SERVICE}"
        side_effects:
          - "increments TrunkGroup.version by 1"
      - from: DISCONNECT_PENDING
        to: DISCONNECTED
        trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/disconnect"
        actor: NetworkPlanner
        preconditions:
          - "trunk_group.service_status == DISCONNECT_PENDING"
          - "trunk_group.open_augment_order_count == 0"
        side_effects:
          - "trunk_group.provisioned_trunks set to 0"
          - "increments TrunkGroup.version by 1"

  - entity: TrunkGroup
    dimension: augment_status
    initial_state: NONE
    terminal_states: []
    shape: parallel
    transitions:
      - from: NONE
        to: AUGMENT_ORDERED
        trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements whose blocking_pct >= BLOCKING_THRESHOLD_PCT and whose requested_additional_trunks > 0 and whose augment fits the POI facility ceiling"
        actor: NetworkPlanner | CarrierRepresentative
        preconditions:
          - "trunk_group.service_status == IN_SERVICE"
          - "trunk_group.augment_status IN {NONE, GROOMING_REVIEW}"
        side_effects:
          - "hop 1: the new TrafficMeasurement row sets trunk_group.latest_blocking_pct and trunk_group.required_trunks from calculations.trunk_sizing_and_blocking, and moves trunk_group.augment_status to AUGMENT_ORDERED"
          - "hop 2: because trunk_group.augment_status became AUGMENT_ORDERED, a TrunkAugmentOrder row is created with status PENDING, requested_additional_trunks and required_trunks_target from the same calculation, and triggering_measurement_id set to the new measurement; trunk_group.open_augment_order_count increments by 1"
          - "hop 3: because a PENDING TrunkAugmentOrder now exists, agreement.poi_augment_pending_count increments by 1 and agreement.capacity_posture is recomputed to CONSTRAINED"
          - "increments TrunkGroup.version by 1"
        note: "Transitive cascade of depth 3: measurement -> trunk group -> augment order -> agreement posture. Each hop is caused by the previous hop's mutation, not by the original request."
      - from: NONE
        to: GROOMING_REVIEW
        trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements whose blocking_pct >= BLOCKING_THRESHOLD_PCT but whose requested_additional_trunks == 0"
        actor: NetworkPlanner | CarrierRepresentative
        preconditions:
          - "trunk_group.service_status == IN_SERVICE"
          - "trunk_group.augment_status IN {NONE, GROOMING_REVIEW}"
        side_effects:
          - "trunk_group.latest_blocking_pct and trunk_group.required_trunks updated; no TrunkAugmentOrder is created and agreement.poi_augment_pending_count is unchanged"
          - "increments TrunkGroup.version by 1"
        note: "Blocking is high but the sized demand is already met by provisioned trunks, so the breach is a grooming problem rather than a capacity problem."
      - from: NONE
        to: AUGMENT_BLOCKED
        trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements whose blocking_pct >= BLOCKING_THRESHOLD_PCT and whose requested_additional_trunks would push the POI aggregate above agreement.poi_facility_capacity_trunks"
        actor: NetworkPlanner | CarrierRepresentative
        preconditions:
          - "trunk_group.service_status == IN_SERVICE"
          - "trunk_group.augment_status IN {NONE, GROOMING_REVIEW}"
        side_effects:
          - "trunk_group.latest_blocking_pct and trunk_group.required_trunks updated; no TrunkAugmentOrder is created"
          - "agreement.capacity_posture recomputed to BLOCKED"
          - "increments TrunkGroup.version by 1"
      - from: AUGMENT_ORDERED
        to: AUGMENT_BLOCKED
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/reject"
        actor: CarrierRepresentative
        preconditions:
          - "the rejected order's trunk_group.augment_status == AUGMENT_ORDERED"
        side_effects:
          - "trunk_group.open_augment_order_count decrements by 1"
          - "agreement.poi_augment_pending_count decrements by 1 and agreement.capacity_posture recomputed to BLOCKED"
          - "increments TrunkGroup.version by 1"
      - from: AUGMENT_ORDERED
        to: NONE
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/complete"
        actor: NetworkPlanner
        preconditions:
          - "the completed order's trunk_group.augment_status == AUGMENT_ORDERED"
        side_effects:
          - "trunk_group.provisioned_trunks increases by order.installed_trunks"
          - "trunk_group.open_augment_order_count decrements by 1"
          - "agreement.total_in_service_trunks increases by order.installed_trunks and agreement.poi_augment_pending_count decrements by 1; agreement.capacity_posture recomputed"
          - "increments TrunkGroup.version by 1"
      - from: NONE
        to: GROOMING_REVIEW
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/reverse"
        actor: NetworkPlanner
        preconditions:
          - "the reversed order's status == COMPLETED"
          - "the order's trunk_group.augment_status == NONE"
        side_effects:
          - "trunk_group.provisioned_trunks decreases by order.installed_trunks (compensating the completion)"
          - "trunk_group.open_augment_order_count is unchanged because a REVERSED order is not open"
          - "agreement.total_in_service_trunks decreases by order.installed_trunks"
          - "increments TrunkGroup.version by 1"
        note: "Compensating action: reversal restores agreement.total_in_service_trunks to its pre-completion value exactly, and parks the trunk group in GROOMING_REVIEW so the re-opened capacity gap is not silently lost."

  - entity: TrunkAugmentOrder
    initial_state: PENDING
    terminal_states: [REJECTED, REVERSED]
    shape: branching
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/accept"
        actor: CarrierRepresentative
        preconditions:
          - "order.status == PENDING"
          - "the acting CarrierRepresentative's X-User-ID equals the agreement's carrier_id"
          - "payload.committed_due_date is strictly after the logical clock"
          - "the buffered installation window [committed_due_date - INSTALL_WINDOW_DAYS - AUGMENT_BUFFER_HOURS, committed_due_date + AUGMENT_BUFFER_HOURS] does not intersect the buffered window of any other TrunkAugmentOrder with status IN {ACCEPTED} whose trunk group shares (agreement_id, poi_clli_code)"
        side_effects:
          - "order.install_window_start set to committed_due_date - INSTALL_WINDOW_DAYS and order.install_window_end set to committed_due_date"
          - "increments TrunkAugmentOrder.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/reject"
        actor: CarrierRepresentative
        preconditions:
          - "order.status == PENDING"
          - "the acting CarrierRepresentative's X-User-ID equals the agreement's carrier_id"
        side_effects:
          - "trunk_group.augment_status moves AUGMENT_ORDERED -> AUGMENT_BLOCKED and trunk_group.open_augment_order_count decrements by 1"
          - "agreement.poi_augment_pending_count decrements by 1 and agreement.capacity_posture recomputed to BLOCKED"
          - "increments TrunkAugmentOrder.version by 1"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/complete"
        actor: NetworkPlanner
        preconditions:
          - "order.status == ACCEPTED"
          - "payload.installed_trunks is a positive multiple of DS1_TRUNKS"
          - "the sum of provisioned_trunks over TrunkGroup rows sharing (agreement_id, poi_clli_code) whose service_status IN {PROVISIONED, IN_SERVICE}, plus payload.installed_trunks, is <= agreement.poi_facility_capacity_trunks"
        side_effects:
          - "trunk_group.provisioned_trunks increases by installed_trunks; trunk_group.augment_status moves AUGMENT_ORDERED -> NONE; trunk_group.open_augment_order_count decrements by 1"
          - "agreement.total_in_service_trunks increases by installed_trunks; agreement.poi_augment_pending_count decrements by 1; agreement.capacity_posture recomputed"
          - "increments TrunkAugmentOrder.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "system event: the parent InterconnectionAgreement is terminated"
        actor: system
        preconditions:
          - "order.status IN {PENDING, ACCEPTED}"
        side_effects:
          - "order.rejection_reason set to AGREEMENT_TERMINATED"
          - "agreement.poi_augment_pending_count decrements by 1"
          - "increments TrunkAugmentOrder.version by 1"
      - from: ACCEPTED
        to: REJECTED
        trigger: "system event: the parent InterconnectionAgreement is terminated"
        actor: system
        preconditions:
          - "order.status IN {PENDING, ACCEPTED}"
        side_effects:
          - "order.rejection_reason set to AGREEMENT_TERMINATED"
          - "agreement.poi_augment_pending_count decrements by 1"
          - "increments TrunkAugmentOrder.version by 1"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /interconnection/trunk-augment-orders/{order_id}/reverse"
        actor: NetworkPlanner
        preconditions:
          - "order.status == COMPLETED"
          - "order.trunk_group.service_status IN {PROVISIONED, IN_SERVICE}"
        side_effects:
          - "order.reversed_at stamped with the logical clock"
          - "trunk_group.provisioned_trunks decreases by order.installed_trunks and trunk_group.augment_status moves NONE -> GROOMING_REVIEW"
          - "agreement.total_in_service_trunks decreases by order.installed_trunks"
          - "increments TrunkAugmentOrder.version by 1"
        note: "Compensating action for COMPLETED: the conserved quantity agreement.total_in_service_trunks returns to its exact pre-completion value."

  - entity: TariffFiling
    initial_state: FILED
    terminal_states: [SUPERSEDED, WITHDRAWN]
    shape: branching
    transitions:
      - from: FILED
        to: EFFECTIVE
        trigger: "POST /interconnection/tariff-filings/{filing_id}/approve"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "filing.status == FILED"
          - "logical clock >= filing.effective_date"
          - "no other TariffFiling with the same rate_element and status == EFFECTIVE has a half-open window [effective_date, expiry_date) intersecting this filing's window, unless payload.supersede_filing_id names exactly that filing"
        side_effects:
          - "filing.approved_at stamped with the logical clock"
          - "when payload.supersede_filing_id is present, the named filing's expiry_date is truncated to this filing's effective_date, its status moves EFFECTIVE -> SUPERSEDED, its superseded_by_filing_id is set to this filing's id and its superseded_at is stamped"
          - "increments TariffFiling.version by 1"
        note: "Adjacency is not overlap: a filing whose effective_date equals a prior filing's expiry_date is approved without any supersede_filing_id because the prior window is half-open."
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system event: a later TariffFiling for the same rate_element is approved naming this filing in supersede_filing_id"
        actor: system
        preconditions:
          - "filing.status == EFFECTIVE"
          - "the approving filing's effective_date is strictly inside this filing's half-open window"
        side_effects:
          - "filing.expiry_date truncated to the approving filing's effective_date"
          - "filing.superseded_by_filing_id and filing.superseded_at set"
          - "increments TariffFiling.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /interconnection/tariff-filings/{filing_id}/withdraw"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "filing.status == FILED"
        side_effects:
          - "increments TariffFiling.version by 1"

  - entity: TrafficFactorFiling
    initial_state: REPORTED
    terminal_states: [SUPERSEDED]
    shape: cyclic
    transitions:
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /interconnection/traffic-factor-filings/{filing_id}/review with decision ACCEPT"
        actor: AccessBillingAnalyst
        preconditions:
          - "filing.status IN {REPORTED, AUDITED}"
        side_effects:
          - "filing.effective_piu_pct and effective_plu_pct resolve to the reported values"
          - "increments TrafficFactorFiling.version by 1"
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /interconnection/traffic-factor-filings/{filing_id}/review with decision DISPUTE"
        actor: AccessBillingAnalyst
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, AUDITED}"
          - "payload.dispute_reason is present and non-empty"
        side_effects:
          - "filing.dispute_reason stored"
          - "increments TrafficFactorFiling.version by 1"
      - from: ACCEPTED
        to: DISPUTED
        trigger: "POST /interconnection/traffic-factor-filings/{filing_id}/review with decision DISPUTE"
        actor: AccessBillingAnalyst
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, AUDITED}"
          - "payload.dispute_reason is present and non-empty"
        side_effects:
          - "filing.dispute_reason stored"
          - "increments TrafficFactorFiling.version by 1"
      - from: AUDITED
        to: DISPUTED
        trigger: "POST /interconnection/traffic-factor-filings/{filing_id}/review with decision DISPUTE"
        actor: AccessBillingAnalyst
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, AUDITED}"
          - "payload.dispute_reason is present and non-empty"
        side_effects:
          - "filing.dispute_reason stored; audited_piu_pct and audited_plu_pct are retained but effective_piu_pct and effective_plu_pct revert to the reported values while the filing sits in DISPUTED"
          - "increments TrafficFactorFiling.version by 1"
        note: "Cycle edge: AUDITED -> DISPUTED -> AUDITED lets a second audit round replace the first audit's substituted factors."
      - from: DISPUTED
        to: AUDITED
        trigger: "POST /interconnection/traffic-factor-filings/{filing_id}/audit"
        actor: RevenueAssuranceController
        preconditions:
          - "filing.status == DISPUTED"
          - "payload.audited_piu_pct + payload.audited_plu_pct <= 100.00"
        side_effects:
          - "filing.audited_piu_pct and audited_plu_pct stored; effective_piu_pct and effective_plu_pct resolve to the audited values; audit_completed_at stamped"
          - "hop 1: every UsageBatch whose traffic_factor_filing_id == filing.id and whose status IN {RATED, INVOICED} is re-jurisdictionalized and re-rated with the audited factors, processed in created_at ASC order; each batch's minute buckets, jurisdiction subtotals, rated_amount_usd and rating_variant (now FINAL) are rewritten and rerate_count increments by 1"
          - "hop 2: because each re-rated batch's rated_amount_usd changed, its AccessInvoice (if any, and only while lifecycle_status == ISSUED) has billed_amount_usd, the three jurisdiction subtotals and rating_variant refreshed, open_balance_usd recomputed and adjustment_count incremented by 1"
          - "hop 3: because each invoice's open_balance_usd changed, calculations.reserve_provision re-runs for the carrier and Carrier.open_receivable_usd, Carrier.uncollectible_reserve_balance_usd and Carrier.disputed_reserve_balance_usd are recomputed"
          - "hop 4: because Carrier.uncollectible_reserve_balance_usd changed, a ReserveLedgerEntry with reserve_bucket UNCOLLECTIBLE, entry_type UNCOLLECTIBLE_ADJUSTMENT and source_event FACTOR_AUDIT_RERATE is appended carrying the signed delta"
          - "increments TrafficFactorFiling.version by 1"
        note: "Transitive cascade of depth 4 originating from the audit transition: factor filing -> usage batch -> access invoice -> carrier reserve -> reserve ledger."
      - from: REPORTED
        to: SUPERSEDED
        trigger: "system event: a newer TrafficFactorFiling for the same (carrier_id, quarter) is created"
        actor: system
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, DISPUTED, AUDITED}"
        side_effects:
          - "filing.superseded_at stamped with the logical clock"
          - "increments TrafficFactorFiling.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system event: a newer TrafficFactorFiling for the same (carrier_id, quarter) is created"
        actor: system
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, DISPUTED, AUDITED}"
        side_effects:
          - "filing.superseded_at stamped with the logical clock"
          - "increments TrafficFactorFiling.version by 1"
      - from: AUDITED
        to: SUPERSEDED
        trigger: "system event: a newer TrafficFactorFiling for the same (carrier_id, quarter) is created"
        actor: system
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, DISPUTED, AUDITED}"
        side_effects:
          - "filing.superseded_at stamped with the logical clock"
          - "increments TrafficFactorFiling.version by 1"
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system event: a newer TrafficFactorFiling for the same (carrier_id, quarter) is created"
        actor: system
        preconditions:
          - "filing.status IN {REPORTED, ACCEPTED, DISPUTED, AUDITED}"
        side_effects:
          - "filing.superseded_at stamped with the logical clock"
          - "increments TrafficFactorFiling.version by 1"

  - entity: UsageBatch
    initial_state: SUBMITTED
    terminal_states: [INVOICED]
    shape: linear_with_self_loop
    transitions:
      - from: SUBMITTED
        to: JURISDICTIONALIZED
        trigger: "POST /interconnection/usage-batches/{batch_id}/jurisdictionalize"
        actor: AccessBillingAnalyst
        preconditions:
          - "batch.status == SUBMITTED"
          - "batch.record_count >= 1"
        side_effects:
          - "every child CallDetailRecord gets jurisdiction and jurisdiction_source from calculations.jurisdiction_determination"
          - "batch.signaling_determined_minutes, indeterminate_minutes and the three jurisdiction minute buckets are written"
          - "batch.traffic_factor_filing_id and batch.factor_source are pinned by the factor selector in calculations.jurisdiction_determination"
          - "batch.jurisdictionalized_at stamped with the logical clock"
          - "increments UsageBatch.version by 1"
      - from: JURISDICTIONALIZED
        to: RATED
        trigger: "POST /interconnection/usage-batches/{batch_id}/rate"
        actor: AccessBillingAnalyst
        preconditions:
          - "batch.status == JURISDICTIONALIZED"
          - "for every jurisdiction whose minute bucket is > 0, a TariffFiling with the mapped rate_element and status == EFFECTIVE covers batch.period_start in its half-open window"
        side_effects:
          - "each CallDetailRecord whose jurisdiction_source == SIGNALING gets rated_amount_usd at 6 decimals; FACTOR_ALLOCATED records keep rated_amount_usd null"
          - "batch.interstate_amount_usd, intrastate_amount_usd, local_amount_usd and rated_amount_usd written by calculations.access_charge_rating"
          - "batch.rating_variant set to FINAL when the pinned factor filing's status == AUDITED, otherwise PRELIMINARY"
          - "batch.rated_at stamped with the logical clock"
          - "increments UsageBatch.version by 1"
      - from: RATED
        to: RATED
        trigger: "system event: a TrafficFactorFiling this batch pinned completes an audit"
        actor: system
        preconditions:
          - "batch.status IN {RATED, INVOICED}"
          - "batch.traffic_factor_filing_id == the audited filing's id"
        side_effects:
          - "minute buckets re-allocated with the audited factors and all jurisdiction subtotals re-rated"
          - "batch.rating_variant set to FINAL; batch.rerate_count increments by 1; batch.rated_at refreshed"
          - "increments UsageBatch.version by 1"
        note: "Self-loop: re-rating does not change status, so an INVOICED batch also stays INVOICED while its amounts move."
      - from: RATED
        to: INVOICED
        trigger: "POST /interconnection/access-invoices"
        actor: AccessBillingAnalyst
        preconditions:
          - "batch.status == RATED"
          - "no AccessInvoice already references this batch"
        side_effects:
          - "an AccessInvoice row is created in lifecycle_status DRAFT with the batch's amounts snapshotted"
          - "increments UsageBatch.version by 1"
      - from: INVOICED
        to: INVOICED
        trigger: "system event: a TrafficFactorFiling this batch pinned completes an audit"
        actor: system
        preconditions:
          - "batch.status IN {RATED, INVOICED}"
        side_effects:
          - "same re-rate side effects as the RATED self-loop, plus the AccessInvoice refresh cascade"
          - "increments UsageBatch.version by 1"

  - entity: AccessInvoice
    dimension: lifecycle_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: compound
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /interconnection/access-invoices/{invoice_id}/issue"
        actor: AccessBillingAnalyst
        preconditions:
          - "invoice.lifecycle_status == DRAFT"
          - "invoice.billed_amount_usd > 0.00"
        side_effects:
          - "invoice.issued_at stamped with the logical clock and invoice.dispute_deadline_at set to issued_at + DISPUTE_FILING_WINDOW_DAYS"
          - "invoice.issued_by_user_id set to the acting X-User-ID"
          - "increments AccessInvoice.version by 1"
      - from: ISSUED
        to: CLOSED
        trigger: "system event: payment_status reaches PAID or WRITTEN_OFF while dispute_status IN {NONE, RESOLVED}"
        actor: system
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.payment_status IN {PAID, WRITTEN_OFF}"
          - "invoice.dispute_status IN {NONE, RESOLVED}"
        side_effects:
          - "increments AccessInvoice.version by 1"
        note: "Compound derivation: lifecycle_status is a function of the other two dimensions once the invoice is ISSUED."

  - entity: AccessInvoice
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: [PAID, WRITTEN_OFF]
    shape: parallel
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /interconnection/access-invoices/{invoice_id}/payments with amount_usd < open_balance_usd"
        actor: CarrierRepresentative
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.payment_status IN {UNPAID, PARTIALLY_PAID}"
          - "payload.amount_usd <= invoice.open_balance_usd"
        side_effects:
          - "hop 1: invoice.paid_amount_usd increases and open_balance_usd is recomputed"
          - "hop 2: because open_balance_usd changed, calculations.reserve_provision re-runs and Carrier.open_receivable_usd plus Carrier.uncollectible_reserve_balance_usd are recomputed"
          - "hop 3: because Carrier.uncollectible_reserve_balance_usd changed, a ReserveLedgerEntry (bucket UNCOLLECTIBLE, entry_type UNCOLLECTIBLE_ADJUSTMENT, source_event INVOICE_PAYMENT_APPLIED) is appended with the signed delta"
          - "increments AccessInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /interconnection/access-invoices/{invoice_id}/payments with amount_usd == open_balance_usd"
        actor: CarrierRepresentative
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.payment_status IN {UNPAID, PARTIALLY_PAID}"
          - "payload.amount_usd == invoice.open_balance_usd"
        side_effects:
          - "invoice.open_balance_usd becomes 0.00 and the invoice leaves the receivable input set, so Carrier.open_receivable_usd and both reserve balances are recomputed and a ReserveLedgerEntry is appended"
          - "lifecycle_status auto-transitions to CLOSED when dispute_status IN {NONE, RESOLVED}"
          - "increments AccessInvoice.version by 1"
      - from: UNPAID
        to: PAID
        trigger: "POST /interconnection/access-invoices/{invoice_id}/payments with amount_usd == open_balance_usd"
        actor: CarrierRepresentative
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.payment_status == UNPAID"
          - "payload.amount_usd == invoice.open_balance_usd"
        side_effects:
          - "same reserve cascade as PARTIALLY_PAID -> PAID"
          - "increments AccessInvoice.version by 1"
      - from: UNPAID
        to: WRITTEN_OFF
        trigger: "POST /interconnection/access-invoices/{invoice_id}/write-off"
        actor: RevenueAssuranceController
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.payment_status IN {UNPAID, PARTIALLY_PAID}"
          - "invoice.dispute_status != DISPUTED"
          - "the acting X-User-ID != invoice.issued_by_user_id"
          - "logical clock >= invoice.due_date"
        side_effects:
          - "invoice.written_off_at stamped; the remaining open_balance_usd is removed from the receivable set"
          - "a ReserveLedgerEntry (bucket UNCOLLECTIBLE, entry_type WRITE_OFF, source_event INVOICE_WRITTEN_OFF) is appended for the written-off balance, followed by an UNCOLLECTIBLE_ADJUSTMENT entry for the recomputed reserve delta"
          - "lifecycle_status auto-transitions to CLOSED when dispute_status IN {NONE, RESOLVED}"
          - "increments AccessInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /interconnection/access-invoices/{invoice_id}/write-off"
        actor: RevenueAssuranceController
        preconditions:
          - "same preconditions as UNPAID -> WRITTEN_OFF"
        side_effects:
          - "same side effects as UNPAID -> WRITTEN_OFF"
          - "increments AccessInvoice.version by 1"

  - entity: AccessInvoice
    dimension: dispute_status
    initial_state: NONE
    terminal_states: []
    shape: parallel
    transitions:
      - from: NONE
        to: DISPUTED
        trigger: "POST /interconnection/billing-disputes"
        actor: CarrierRepresentative
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.dispute_status == NONE"
        side_effects:
          - "invoice.disputed_amount_usd increases by the new dispute's disputed_amount_usd"
          - "the reserve cascade described on BillingDispute (none) -> SUBMITTED runs"
          - "increments AccessInvoice.version by 1"
      - from: DISPUTED
        to: RESOLVED
        trigger: "system event: the invoice's only open BillingDispute leaves the open set (resolved, deemed allowed or withdrawn)"
        actor: system
        preconditions:
          - "invoice.dispute_status == DISPUTED"
          - "no child BillingDispute remains with status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
        side_effects:
          - "invoice.disputed_amount_usd recomputed to 0.00"
          - "lifecycle_status auto-transitions to CLOSED when payment_status IN {PAID, WRITTEN_OFF}"
          - "increments AccessInvoice.version by 1"
      - from: RESOLVED
        to: DISPUTED
        trigger: "POST /interconnection/billing-disputes for a second dispute filed inside the filing window"
        actor: CarrierRepresentative
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.dispute_status == RESOLVED"
          - "logical clock <= invoice.dispute_deadline_at"
        side_effects:
          - "invoice.disputed_amount_usd increases by the new dispute's disputed_amount_usd and the reserve cascade runs again"
          - "increments AccessInvoice.version by 1"
        note: "Parallel dimension detail: a re-dispute after a resolution moves only the dispute dimension; payment_status and any partial payments already applied are untouched."

  - entity: BillingDispute
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_SUSTAINED, RESOLVED_DEEMED_ALLOWED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: "(creation)"
        to: SUBMITTED
        trigger: "POST /interconnection/billing-disputes"
        actor: CarrierRepresentative
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "invoice.payment_status != WRITTEN_OFF"
          - "logical clock <= invoice.dispute_deadline_at"
          - "payload.disputed_amount_usd <= invoice.open_balance_usd - invoice.disputed_amount_usd"
        side_effects:
          - "hop 1: dispute.filed_at, sla_days and resolution_due_at written by calculations.dispute_sla_and_deemed_allowed"
          - "hop 2: invoice.disputed_amount_usd increases by disputed_amount_usd and invoice.dispute_status moves NONE|RESOLVED -> DISPUTED"
          - "hop 3: because the invoice's disputed amount changed, calculations.reserve_provision re-runs and Carrier.disputed_receivable_usd, Carrier.net_receivable_usd, Carrier.disputed_reserve_balance_usd and Carrier.uncollectible_reserve_balance_usd (re-tiered from the lowered net receivable) are recomputed"
          - "hop 4: a ReserveLedgerEntry (bucket DISPUTED_REVENUE, entry_type DISPUTE_PROVISION, source_event BILLING_DISPUTE_SUBMITTED) is appended with the signed delta, followed by a second entry (bucket UNCOLLECTIBLE, entry_type UNCOLLECTIBLE_ADJUSTMENT, same source_event) whenever the re-tier moved the uncollectible balance"
          - "increments AccessInvoice.version and Carrier.version by 1 each"
        note: "Transitive cascade of depth 3 originating from dispute submission: billing dispute -> access invoice -> carrier reserve -> reserve ledger."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/acknowledge"
        actor: DisputeResolutionOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, ESCALATED}"
          - "logical clock < dispute.resolution_due_at"
        side_effects:
          - "dispute.acknowledged flag is implied by the status change; resolution_due_at is not moved"
          - "increments BillingDispute.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_SUSTAINED
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/resolve with decision == SUSTAINED"
        actor: DisputeResolutionOfficer
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "the acting X-User-ID != invoice.issued_by_user_id"
          - "logical clock < dispute.resolution_due_at"
          - "0.00 < payload.credited_amount_usd <= dispute.disputed_amount_usd"
        side_effects:
          - "dispute.resolved_at and resolved_by_user_id stamped"
          - "invoice.credited_amount_usd increases by credited_amount_usd and open_balance_usd is reduced by the same amount"
          - "invoice.disputed_amount_usd is reduced by dispute.disputed_amount_usd; invoice.dispute_status moves DISPUTED -> RESOLVED once no open dispute remains"
          - "calculations.reserve_provision re-runs; a DISPUTE_RELEASE ReserveLedgerEntry and an UNCOLLECTIBLE_ADJUSTMENT ReserveLedgerEntry are appended"
          - "invoice.payment_status auto-moves to PAID when the credit drives open_balance_usd to 0.00"
          - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/resolve with decision == DENIED"
        actor: DisputeResolutionOfficer
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "the acting X-User-ID != invoice.issued_by_user_id"
          - "logical clock < dispute.resolution_due_at"
          - "payload.credited_amount_usd == 0.00"
        side_effects:
          - "dispute.resolved_at and resolved_by_user_id stamped; no credit is posted"
          - "invoice.disputed_amount_usd is reduced by dispute.disputed_amount_usd and dispute_status moves DISPUTED -> RESOLVED"
          - "a DISPUTE_RELEASE ReserveLedgerEntry is appended for the released provision"
          - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
      - from: RESOLVED_DENIED
        to: ESCALATED
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/escalate"
        actor: CarrierRepresentative
        preconditions:
          - "dispute.status == RESOLVED_DENIED"
          - "dispute.escalation_round < ESCALATION_LIMIT"
        side_effects:
          - "dispute.escalation_round increments by 1 and resolution_due_at is extended by ESCALATION_EXTENSION_DAYS from the previous due instant"
          - "invoice.disputed_amount_usd increases again by dispute.disputed_amount_usd and dispute_status moves RESOLVED -> DISPUTED"
          - "a DISPUTE_PROVISION ReserveLedgerEntry is appended with source_event BILLING_DISPUTE_ESCALATED"
          - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
        note: "Cycle re-entry: a denied dispute returns to the open set, so the same provision is booked, released and re-booked across the loop."
      - from: ESCALATED
        to: UNDER_REVIEW
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/acknowledge"
        actor: DisputeResolutionOfficer
        preconditions:
          - "dispute.status IN {SUBMITTED, ESCALATED}"
          - "logical clock < dispute.resolution_due_at"
        side_effects:
          - "increments BillingDispute.version by 1"
        note: "Closes the cycle RESOLVED_DENIED -> ESCALATED -> UNDER_REVIEW -> RESOLVED_DENIED; ESCALATION_LIMIT terminates the loop."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/withdraw"
        actor: CarrierRepresentative
        preconditions:
          - "dispute.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
        side_effects:
          - "dispute.resolved_at and resolved_by_user_id stamped; credited_amount_usd stays 0.00"
          - "invoice.disputed_amount_usd is reduced by dispute.disputed_amount_usd and dispute_status moves DISPUTED -> RESOLVED"
          - "a DISPUTE_RELEASE ReserveLedgerEntry (source_event BILLING_DISPUTE_WITHDRAWN) is appended that exactly offsets every DISPUTE_PROVISION entry booked for this dispute, plus an UNCOLLECTIBLE_ADJUSTMENT entry restoring the pre-dispute uncollectible balance"
          - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
        note: "Compensating path: after withdrawal Carrier.disputed_reserve_balance_usd returns to its pre-dispute value with no drift."
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/withdraw"
        actor: CarrierRepresentative
        preconditions:
          - "dispute.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
        side_effects:
          - "same side effects as SUBMITTED -> WITHDRAWN"
          - "increments BillingDispute.version by 1"
      - from: ESCALATED
        to: WITHDRAWN
        trigger: "POST /interconnection/billing-disputes/{dispute_id}/withdraw"
        actor: CarrierRepresentative
        preconditions:
          - "dispute.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
        side_effects:
          - "same side effects as SUBMITTED -> WITHDRAWN, including release of the escalation provision"
          - "increments BillingDispute.version by 1"
      - from: SUBMITTED
        to: RESOLVED_DEEMED_ALLOWED
        trigger: "POST /interconnection/dispute-deadline-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
          - "logical clock >= dispute.resolution_due_at"
        side_effects:
          - "dispute.credited_amount_usd is set to dispute.disputed_amount_usd, resolved_at stamped and resolved_by_user_id set to SYSTEM_SWEEP"
          - "invoice.credited_amount_usd increases by the full disputed amount, open_balance_usd is reduced and dispute_status moves DISPUTED -> RESOLVED"
          - "calculations.reserve_provision re-runs and DISPUTE_RELEASE plus UNCOLLECTIBLE_ADJUSTMENT ReserveLedgerEntry rows are appended"
          - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
        note: "Missing the SLA deems the dispute allowed in the counterparty's favour, which is why the due instant is an inclusive boundary."
      - from: UNDER_REVIEW
        to: RESOLVED_DEEMED_ALLOWED
        trigger: "POST /interconnection/dispute-deadline-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
          - "logical clock >= dispute.resolution_due_at"
        side_effects:
          - "same side effects as SUBMITTED -> RESOLVED_DEEMED_ALLOWED"
          - "increments BillingDispute.version by 1"
      - from: ESCALATED
        to: RESOLVED_DEEMED_ALLOWED
        trigger: "POST /interconnection/dispute-deadline-sweeps"
        actor: PlatformAdmin
        preconditions:
          - "dispute.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}"
          - "logical clock >= dispute.resolution_due_at"
        side_effects:
          - "same side effects as SUBMITTED -> RESOLVED_DEEMED_ALLOWED, measured against the extended resolution_due_at"
          - "increments BillingDispute.version by 1"

  - entity: ReconciliationCase
    initial_state: OPEN
    terminal_states: [ADJUSTED, ACCEPTED]
    shape: branching
    transitions:
      - from: OPEN
        to: VARIANCE_IDENTIFIED
        trigger: "POST /interconnection/reconciliation-cases/{case_id}/evaluate"
        actor: RevenueAssuranceController
        preconditions:
          - "case.status == OPEN"
          - "the absolute value of calculations.record_exchange_reconciliation.minute_variance_pct > VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "case.minute_variance_pct and amount_variance_usd are written"
          - "increments ReconciliationCase.version by 1"
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /interconnection/reconciliation-cases/{case_id}/evaluate"
        actor: RevenueAssuranceController
        preconditions:
          - "case.status == OPEN"
          - "the absolute value of calculations.record_exchange_reconciliation.minute_variance_pct <= VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "case.minute_variance_pct and amount_variance_usd are written; no adjustment is posted"
          - "increments ReconciliationCase.version by 1"
        note: "Branch point: the tolerance comparison at exactly VARIANCE_TOLERANCE_PCT resolves to ACCEPTED, not VARIANCE_IDENTIFIED."
      - from: VARIANCE_IDENTIFIED
        to: ADJUSTED
        trigger: "POST /interconnection/reconciliation-cases/{case_id}/adjust"
        actor: RevenueAssuranceController
        preconditions:
          - "case.status == VARIANCE_IDENTIFIED"
          - "payload.agreed_minutes is between the smaller and the larger of case.our_minutes and case.counterparty_reported_minutes, inclusive"
          - "the batch's AccessInvoice exists with lifecycle_status == ISSUED and payment_status != WRITTEN_OFF"
        side_effects:
          - "case.adjustment_amount_usd computed from the agreed minutes at the invoice's blended effective rate and case.adjusted_at stamped"
          - "invoice.credited_amount_usd increases by adjustment_amount_usd and open_balance_usd is reduced"
          - "calculations.reserve_provision re-runs for the carrier and an UNCOLLECTIBLE_ADJUSTMENT ReserveLedgerEntry is appended"
          - "increments ReconciliationCase.version, AccessInvoice.version and Carrier.version by 1 each"
      - from: VARIANCE_IDENTIFIED
        to: ACCEPTED
        trigger: "POST /interconnection/reconciliation-cases/{case_id}/accept"
        actor: RevenueAssuranceController
        preconditions:
          - "case.status == VARIANCE_IDENTIFIED"
        side_effects:
          - "the variance is retained as documented but no credit is posted; adjustment_amount_usd stays null"
          - "increments ReconciliationCase.version by 1"

concurrency_rules:
  - rule_id: offer-create-stale-agreement
    parent_entity: InterconnectionAgreement
    write_endpoint: "POST /interconnection/agreements/{agreement_id}/offers"
    occ_field: "expected_agreement_version"
    description: |
      Appending a NegotiationOffer to an InterconnectionAgreement whose version has
      advanced past the version the client last observed is rejected. A new offer
      legitimately supersedes the standing OPEN offer, so a writer working from a stale
      view would silently discard terms it never saw; the stale-version check forces the
      writer to re-read the agreement and its standing offer first.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: factor-filing-create-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /interconnection/traffic-factor-filings"
    occ_field: "expected_carrier_version"
    description: |
      Creating a TrafficFactorFiling for a Carrier whose version has advanced past the
      version the client last observed is rejected. A new filing for the same
      (carrier_id, quarter) legitimately supersedes the prior filing and changes which
      factors future jurisdictionalization pins, so a writer holding a stale carrier view
      must re-read before displacing the standing factors.
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

calculations:
  - name: jurisdiction_determination
    trigger: "POST /interconnection/usage-batches/{batch_id}/jurisdictionalize, and again on every factor-audit re-rate cascade"
    algorithm: projection
    formula: |
      # --- per-record signaling pass (records processed in created_at ASC order) ---
      for each CallDetailRecord r in batch:
        if r.signaling_cpn_present == false or r.originating_state_code is null:
          r.jurisdiction = INDETERMINATE
          r.jurisdiction_source = FACTOR_ALLOCATED
        else:
          effective_origin_state = r.jip_state_code if r.jip_state_code is not null
                                                    else r.originating_state_code
          if effective_origin_state != r.terminating_state_code:
            r.jurisdiction = INTERSTATE
          elif r.same_local_calling_area == true:
            r.jurisdiction = LOCAL
          else:
            r.jurisdiction = INTRASTATE
          r.jurisdiction_source = SIGNALING

      batch.signaling_determined_minutes = sum(r.billable_minutes where source == SIGNALING)
      batch.indeterminate_minutes        = sum(r.billable_minutes where jurisdiction == INDETERMINATE)

      # --- factor selection for the indeterminate pool ---
      if batch.indeterminate_minutes == 0:
        batch.factor_source = SIGNALING_ONLY
        batch.traffic_factor_filing_id = null
        piu = 0.00 ; plu = 0.00
      else:
        quarter = calendar quarter of batch.period_start formatted YYYYQn
        candidates = TrafficFactorFiling rows where carrier_id == batch.carrier_id
                     and quarter == quarter and status != SUPERSEDED
        if candidates is empty:
          batch.factor_source = DEFAULT_TARIFF
          batch.traffic_factor_filing_id = null
          piu = DEFAULT_PIU_PCT ; plu = DEFAULT_PLU_PCT
        else:
          f = the candidate with the latest created_at
          batch.traffic_factor_filing_id = f.id
          batch.factor_source = AUDITED if f.status == AUDITED else CARRIER_REPORTED
          piu = f.effective_piu_pct ; plu = f.effective_plu_pct

      # --- allocation of the indeterminate pool (interstate and local carved, intrastate residual) ---
      allocated_interstate = round(batch.indeterminate_minutes * piu / 100, 4)
      allocated_local      = round(batch.indeterminate_minutes * plu / 100, 4)
      allocated_intrastate = batch.indeterminate_minutes - allocated_interstate - allocated_local

      batch.interstate_minutes = sum(SIGNALING minutes where jurisdiction == INTERSTATE) + allocated_interstate
      batch.intrastate_minutes = sum(SIGNALING minutes where jurisdiction == INTRASTATE) + allocated_intrastate
      batch.local_minutes      = sum(SIGNALING minutes where jurisdiction == LOCAL)      + allocated_local
      # conservation invariant: the three buckets always re-sum to batch.total_billable_minutes
    input_set: "All CallDetailRecord rows of the batch (ingest already rejected records with a null terminating_state_code); factor candidates exclude TrafficFactorFiling rows in status SUPERSEDED."
    constants:
      DEFAULT_PIU_PCT: 50.00
      DEFAULT_PLU_PCT: 20.00
    precision: "minutes at 4 decimal places, round_half_up; intrastate is the residual so no rounding remainder is lost"

  - name: access_charge_rating
    trigger: "POST /interconnection/usage-batches/{batch_id}/rate, and again on every factor-audit re-rate cascade"
    algorithm: tiered_pricing
    formula: |
      rate(jurisdiction) = rate_per_mou_usd of the TariffFiling with status == EFFECTIVE,
        rate_element == RATE_ELEMENT_BY_JURISDICTION[jurisdiction], and
        effective_date <= batch.period_start < expiry_date   # half-open window
      # If two EFFECTIVE filings could cover the same instant for one rate_element the
      # supersession rule in state_machines.TariffFiling has already truncated the older
      # one, so the covering filing is unique.

      # --- step 1: per-record charges for signaling-determined records, 6 decimals ---
      for each CallDetailRecord r where r.jurisdiction_source == SIGNALING:
        r.rated_amount_usd = round(r.billable_minutes * rate(r.jurisdiction), 6)
      for each CallDetailRecord r where r.jurisdiction_source == FACTOR_ALLOCATED:
        r.rated_amount_usd = null

      # --- step 2: per-jurisdiction subtotals; the signaling leg and the factor leg are
      #             rounded to 2 decimals SEPARATELY, then added ---
      for j in [INTERSTATE, INTRASTATE, LOCAL]:
        signaling_leg = round(sum(r.rated_amount_usd for SIGNALING records with jurisdiction j), 2)
        factor_leg    = round(allocated_minutes[j] * rate(j), 2)
        subtotal[j]   = signaling_leg + factor_leg

      batch.interstate_amount_usd = subtotal[INTERSTATE]
      batch.intrastate_amount_usd = subtotal[INTRASTATE]
      batch.local_amount_usd      = subtotal[LOCAL]

      # --- step 3: batch total ---
      batch.rated_amount_usd = batch.interstate_amount_usd
                             + batch.intrastate_amount_usd
                             + batch.local_amount_usd

      batch.rating_variant = FINAL if batch.factor_source == AUDITED else PRELIMINARY
    input_set: "The batch's CallDetailRecord rows plus the three allocated minute buckets written by jurisdiction_determination; only TariffFiling rows in status EFFECTIVE whose half-open window covers batch.period_start supply rates."
    constants:
      RATE_ELEMENT_BY_JURISDICTION: "{INTERSTATE: INTERSTATE_SWITCHED_ACCESS, INTRASTATE: INTRASTATE_SWITCHED_ACCESS, LOCAL: LOCAL_RECIPROCAL_COMP}"
    precision: "per-record charges at 6 decimal places, round_half_up; each jurisdiction leg rounded to 2 decimal places, round_half_up, BEFORE the legs are added; the batch total is an exact sum of the three 2-decimal subtotals and is never re-rounded"
    variants:
      - name: PRELIMINARY
        when: "The pinned TrafficFactorFiling is in status REPORTED, ACCEPTED or DISPUTED, or no filing exists and DEFAULT_TARIFF factors were used"
        difference: "Indeterminate minutes are allocated with reported (or default) PIU/PLU, so the interstate bucket is understated whenever an audit later raises PIU; the batch keeps rating_variant PRELIMINARY and remains eligible for the re-rate cascade."
      - name: FINAL
        when: "The pinned TrafficFactorFiling is in status AUDITED"
        difference: "Indeterminate minutes are allocated with audited PIU/PLU; identical CallDetailRecord data therefore produces a different rated_amount_usd, and the delta between the two variants is posted to the invoice by the audit cascade."

  - name: reciprocal_compensation_settlement
    trigger: "GET /interconnection/agreements/{agreement_id}/reciprocal-settlement"
    algorithm: aggregation
    formula: |
      inbound_minutes  = sum(b.total_billable_minutes) over UsageBatch rows b where
                         b.carrier_id == agreement.carrier_id
                         and b.direction == TERMINATING_TO_US
                         and b.status IN {RATED, INVOICED}
      outbound_minutes = same aggregate with b.direction == ORIGINATING_FROM_US

      if outbound_minutes == 0:
        traffic_balance_ratio = null
        settlement_mode = UNDETERMINED
        net_settlement_usd = 0.00
      else:
        traffic_balance_ratio = round(inbound_minutes / outbound_minutes, 4)
        if BILL_AND_KEEP_BAND_LOW <= traffic_balance_ratio <= BILL_AND_KEEP_BAND_HIGH:
          settlement_mode = BILL_AND_KEEP
          net_settlement_usd = 0.00
        else:
          settlement_mode = METERED
          net_settlement_usd = round((inbound_minutes - outbound_minutes)
                                     * agreement.reciprocal_rate_per_mou_usd, 2)
      # Sign convention: positive means the counterparty owes us, negative means we owe them.
    input_set: "UsageBatch rows for the agreement's carrier whose status IN {RATED, INVOICED}; SUBMITTED and JURISDICTIONALIZED batches are excluded because their minutes are not yet settled."
    constants:
      BILL_AND_KEEP_BAND_LOW: 0.9500
      BILL_AND_KEEP_BAND_HIGH: 1.0500
    precision: "ratio at 4 decimal places, round_half_up; net settlement at 2 decimal places, round_half_up; both band edges are inclusive"

  - name: trunk_sizing_and_blocking
    trigger: "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements"
    algorithm: threshold
    formula: |
      # --- blocking ---
      if measurement.offered_calls == 0:
        blocking_pct = 0.00
      else:
        blocking_pct = round(measurement.blocked_calls * 100 / measurement.offered_calls, 2)

      # --- sizing: the larger of measured load and growth-loaded forecast ---
      ccs_per_trunk = CCS_PER_TRUNK_TWO_WAY if trunk_group.direction == TWO_WAY
                                            else CCS_PER_TRUNK_ONE_WAY
      sizing_ccs      = max(measurement.busy_hour_ccs,
                            round(trunk_group.forecast_busy_hour_ccs * GROWTH_FACTOR, 2))
      required_trunks = ceil(sizing_ccs / ccs_per_trunk)
      shortfall       = required_trunks - trunk_group.provisioned_trunks

      # --- augment decision ---
      if blocking_pct < BLOCKING_THRESHOLD_PCT:
        outcome = NO_ACTION ; requested_additional_trunks = 0
      elif shortfall <= 0:
        outcome = GROOMING_REVIEW ; requested_additional_trunks = 0
      else:
        requested_additional_trunks = ceil(shortfall / DS1_TRUNKS) * DS1_TRUNKS
        poi_committed = sum(g.provisioned_trunks) over sibling TrunkGroup rows g sharing
                        (agreement_id, poi_clli_code) whose service_status IN
                        {PROVISIONED, IN_SERVICE}
                      + sum(o.requested_additional_trunks) over TrunkAugmentOrder rows o
                        of those trunk groups whose status IN {PENDING, ACCEPTED}
        if poi_committed + requested_additional_trunks > agreement.poi_facility_capacity_trunks:
          outcome = AUGMENT_BLOCKED ; requested_additional_trunks = 0
        else:
          outcome = AUGMENT_ORDERED
    input_set: "The new TrafficMeasurement, its TrunkGroup, and the sibling trunk groups plus open augment orders sharing the same (agreement_id, poi_clli_code)."
    constants:
      CCS_PER_TRUNK_TWO_WAY: 31
      CCS_PER_TRUNK_ONE_WAY: 27
      GROWTH_FACTOR: 1.15
      DS1_TRUNKS: 24
      BLOCKING_THRESHOLD_PCT: 3.00
      INSTALL_WINDOW_DAYS: 5
      AUGMENT_BUFFER_HOURS: 24
    precision: "blocking_pct at 2 decimal places, round_half_up; the threshold comparison is >= so exactly 3.00 triggers; trunk counts are integers and every division rounds UP (ceil), never to nearest"

  - name: augment_install_window
    trigger: "POST /interconnection/trunk-augment-orders/{order_id}/accept"
    algorithm: interval_merge
    formula: |
      order.install_window_start = order.committed_due_date - INSTALL_WINDOW_DAYS days
      order.install_window_end   = order.committed_due_date
      # The installation window is a CLOSED interval [start, end]: work may land on either edge.

      # Collision test against the other open orders at the SAME point of interconnection
      # (one installation crew per POI), each padded by AUGMENT_BUFFER_HOURS on BOTH edges
      # so two crews never share a buffered instant.
      buffered(o) = [o.install_window_start - AUGMENT_BUFFER_HOURS hours,
                     o.install_window_end   + AUGMENT_BUFFER_HOURS hours]
      poi_peers = TrunkAugmentOrder rows o whose TrunkGroup shares
                  (agreement_id, poi_clli_code) with this order's TrunkGroup
      collides = any o in poi_peers with
                 o.status == ACCEPTED and o.id != order.id and
                 buffered(o).start <= buffered(order).end and
                 buffered(order).start <= buffered(o).end
      # Both comparisons are <=, so buffered windows that merely TOUCH at one instant collide.
    input_set: "TrunkAugmentOrder rows whose trunk group shares (agreement_id, poi_clli_code) with this order's trunk group and whose status == ACCEPTED; PENDING, REJECTED, COMPLETED and REVERSED orders hold no crew slot."
    constants:
      INSTALL_WINDOW_DAYS: 5
      AUGMENT_BUFFER_HOURS: 24
    precision: "whole days and whole hours added to the instant; the raw window is closed at both edges and the buffered comparison treats a single shared instant as a collision"

  - name: negotiation_term_pinning
    trigger: "POST /interconnection/agreements/{agreement_id}/offers and POST /interconnection/negotiation-offers/{offer_id}/accept"
    algorithm: projection
    formula: |
      # --- append an offer ---
      round_number = agreement.negotiation_round + 1
      # rejected once round_number > MAX_NEGOTIATION_ROUNDS
      offering_party = CLEC_SIDE if X-User-Role == InterconnectionManager else COUNTERPARTY_SIDE
      # rejected when offering_party equals the standing OPEN offer's offering_party
      # rejected when offer.reciprocal_rate_per_mou_usd > RECIPROCAL_RATE_CAP_PER_MOU_USD
      the standing OPEN offer (if any) moves to SUPERSEDED with responded_at = logical clock

      # --- accept the standing offer ---
      agreement.reciprocal_rate_per_mou_usd  = offer.reciprocal_rate_per_mou_usd
      agreement.term_months                  = offer.term_months
      agreement.poi_financial_responsibility = offer.poi_financial_responsibility
      agreement.transit_traffic_allowed      = offer.transit_traffic_allowed
      agreement.executed_at                  = logical clock
      # The agreement's proposed_* fields are the opening ask and are NEVER overwritten,
      # so the pinned terms and the opening ask can be compared after execution.
    input_set: "The agreement's NegotiationOffer rows; only the single offer in status OPEN can be accepted or superseded."
    constants:
      MAX_NEGOTIATION_ROUNDS: 6
      RECIPROCAL_RATE_CAP_PER_MOU_USD: 0.100000
    precision: "rates pinned verbatim at 6 decimal places with no re-rounding; term_months is an integer"

  - name: dispute_sla_and_deemed_allowed
    trigger: "POST /interconnection/billing-disputes, POST /interconnection/billing-disputes/{dispute_id}/escalate, and POST /interconnection/dispute-deadline-sweeps"
    algorithm: chronological
    formula: |
      # --- at filing ---
      dispute.filed_at  = logical clock
      dispute.sla_days  = SLA_DAYS_BY_REASON[dispute.reason_code]
      dispute.resolution_due_at = dispute.filed_at + dispute.sla_days days
      dispute.escalation_round  = 0

      # --- at each escalation (extends from the PREVIOUS due instant, not from now) ---
      dispute.escalation_round += 1
      dispute.resolution_due_at = dispute.resolution_due_at + ESCALATION_EXTENSION_DAYS days
      # rejected once dispute.escalation_round would exceed ESCALATION_LIMIT

      # --- filing window on the invoice ---
      invoice.dispute_deadline_at = invoice.issued_at + DISPUTE_FILING_WINDOW_DAYS days
      # a dispute filed at exactly invoice.dispute_deadline_at is accepted; one instant later is not

      # --- sweep, processing candidates in filed_at ASC order (created_at ASC breaks ties) ---
      for each BillingDispute d where d.status IN {SUBMITTED, UNDER_REVIEW, ESCALATED}
                                  and logical clock >= d.resolution_due_at:
        d.status = RESOLVED_DEEMED_ALLOWED
        d.credited_amount_usd = d.disputed_amount_usd     # full credit against us
        d.resolved_by_user_id = "SYSTEM_SWEEP"
      swept_count = number of disputes moved by this sweep
    input_set: "BillingDispute rows whose status is in the open set {SUBMITTED, UNDER_REVIEW, ESCALATED}; already resolved, deemed-allowed and withdrawn disputes are never re-swept."
    constants:
      SLA_DAYS_BY_REASON: "{RATE_APPLICATION: 30, JURISDICTION_FACTOR: 60, USAGE_DISCREPANCY: 45}"
      ESCALATION_EXTENSION_DAYS: 15
      ESCALATION_LIMIT: 2
      DISPUTE_FILING_WINDOW_DAYS: 90
    precision: "whole calendar days added to the instant; the deemed-allowed comparison is >= so a sweep at exactly resolution_due_at deems the dispute allowed, while the resolve endpoint requires a strictly earlier clock"

  - name: reserve_provision
    trigger: "Every event that changes a carrier's receivable or dispute position: invoice issue, payment application, write-off, dispute submit/escalate/withdraw/resolve, deemed-allowed sweep, reconciliation adjustment and factor-audit re-rate"
    algorithm: threshold
    formula: |
      # --- step 1: exposure bases, recomputed from scratch (never incrementally) ---
      open_receivable_usd     = sum(i.open_balance_usd) over AccessInvoice rows i where
                                i.carrier_id == carrier.id
                                and i.lifecycle_status == ISSUED
                                and i.payment_status IN {UNPAID, PARTIALLY_PAID}
      disputed_receivable_usd = sum(i.disputed_amount_usd) over AccessInvoice rows i where
                                i.carrier_id == carrier.id and i.lifecycle_status == ISSUED

      # --- step 2: tier selector ---
      net_receivable_usd = open_receivable_usd - disputed_receivable_usd
      if net_receivable_usd <= 0.00:
        tier_pct = 0.00
      elif net_receivable_usd < TIER_2_FLOOR_USD:
        tier_pct = TIER_1_PCT
      elif net_receivable_usd < TIER_3_FLOOR_USD:
        tier_pct = TIER_2_PCT
      else:
        tier_pct = TIER_3_PCT

      # --- step 3: reserve balances ---
      uncollectible_reserve_balance_usd = round(max(net_receivable_usd, 0.00) * tier_pct / 100, 2)
      disputed_reserve_balance_usd      = <variant-specific, see variants>

      # --- step 4: ledger, appended AFTER both balances are known ---
      for each bucket whose balance moved:
        append ReserveLedgerEntry with amount_usd = new_balance - old_balance
                                  and balance_after_usd = new_balance
      # Evaluation order is fixed and non-circular: the reserve balances are outputs only.
      # They never re-enter open_receivable_usd or net_receivable_usd, so one pass reaches
      # the fixed point and re-running the calculation on unchanged inputs is a no-op.
    input_set: "AccessInvoice rows of the carrier with lifecycle_status == ISSUED; DRAFT invoices carry no exposure and CLOSED invoices have left the receivable set."
    constants:
      TIER_1_PCT: 2.00
      TIER_2_PCT: 5.00
      TIER_3_PCT: 8.50
      TIER_2_FLOOR_USD: 25.00
      TIER_3_FLOOR_USD: 250.00
      DISPUTE_LOSS_PROBABILITY_PCT: 60.00
    precision: "2 decimal places, round_half_up; tier floors are inclusive at the lower edge (a net receivable of exactly 25.00 sits in tier 2, and 24.99 sits in tier 1)"
    variants:
      - name: regulatory_basis
        when: "The persisted Carrier.disputed_reserve_balance_usd and every ReserveLedgerEntry in bucket DISPUTED_REVENUE"
        difference: "Reserves the FULL disputed_receivable_usd, because the regulator requires disputed access revenue to be held at 100% until the dispute closes: disputed_reserve_balance_usd = disputed_receivable_usd."
      - name: gaap_basis
        when: "The gaap_disputed_reserve_usd field returned by GET /interconnection/carriers/{carrier_id}/reserve-summary"
        difference: "Reserves only the probable loss: round(disputed_receivable_usd * DISPUTE_LOSS_PROBABILITY_PCT / 100, 2). Identical invoice and dispute data therefore yields two different disputed-reserve figures, and the reserve-summary response reports both plus their delta."

  - name: record_exchange_reconciliation
    trigger: "POST /interconnection/reconciliation-cases/{case_id}/evaluate and POST /interconnection/reconciliation-cases/{case_id}/adjust"
    algorithm: aggregation
    formula: |
      # --- evaluate ---
      if case.counterparty_reported_minutes == 0:
        minute_variance_pct = 100.00 if case.our_minutes > 0 else 0.00
      else:
        minute_variance_pct = round((case.our_minutes - case.counterparty_reported_minutes)
                                    * 100 / case.counterparty_reported_minutes, 2)
      amount_variance_usd = round(case.our_amount_usd - case.counterparty_reported_amount_usd, 2)

      if abs(minute_variance_pct) > VARIANCE_TOLERANCE_PCT:
        case.status = VARIANCE_IDENTIFIED
      else:
        case.status = ACCEPTED

      # --- adjust ---
      blended_rate_per_mou_usd  = round(case.our_amount_usd / case.our_minutes, 6)
      case.adjustment_amount_usd = round((case.our_minutes - payload.agreed_minutes)
                                         * blended_rate_per_mou_usd, 2)
      # A negative adjustment (agreed minutes above ours) is rejected by validations;
      # agreed_minutes must lie inside the closed interval spanned by the two sides.
    input_set: "The ReconciliationCase, the snapshotted UsageBatch figures taken at case creation, and the batch's AccessInvoice for the credit posting."
    constants:
      VARIANCE_TOLERANCE_PCT: 2.00
    precision: "variance percent at 2 decimal places, round_half_up; the tolerance comparison is strictly greater-than, so a variance of exactly 2.00 is ACCEPTED; blended rate at 6 decimals and the adjustment at 2 decimals, both round_half_up"

validations:
  # ---------- 1. authentication ----------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # ---------- 2. authorization ----------
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed on the endpoint being called"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---------- 3. path existence, validated left to right ----------
  - priority: 3
    category: existence
    check: "{carrier_id} in the path resolves to a Carrier"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /interconnection/carriers/{carrier_id}, GET /interconnection/carriers/{carrier_id}/reserve-summary, GET /interconnection/carriers/{carrier_id}/agreements, GET /interconnection/carriers/{carrier_id}/traffic-factor-filings"
  - priority: 3
    category: existence
    check: "{agreement_id} in the path resolves to an InterconnectionAgreement"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/agreements/{agreement_id}... endpoints"
  - priority: 3
    category: existence
    check: "{offer_id} in the path resolves to a NegotiationOffer"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "POST /interconnection/negotiation-offers/{offer_id}/accept, GET /interconnection/negotiation-offers/{offer_id}"
  - priority: 3
    category: existence
    check: "{trunk_group_id} in the path resolves to a TrunkGroup"
    error_id: ERR_TRUNK_GROUP_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/trunk-groups/{trunk_group_id}... endpoints"
  - priority: 3
    category: existence
    check: "{measurement_id} in the path resolves to a TrafficMeasurement"
    error_id: ERR_MEASUREMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /interconnection/traffic-measurements/{measurement_id}"
  - priority: 3
    category: existence
    check: "{cdr_id} in the path resolves to a CallDetailRecord"
    error_id: ERR_CDR_NOT_FOUND
    http_status: 404
    applies_to: "GET /interconnection/call-detail-records/{cdr_id}"
  - priority: 3
    category: existence
    check: "{order_id} in the path resolves to a TrunkAugmentOrder"
    error_id: ERR_AUGMENT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/trunk-augment-orders/{order_id}... endpoints"
  - priority: 3
    category: existence
    check: "{filing_id} in the path resolves to a TariffFiling"
    error_id: ERR_TARIFF_FILING_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/tariff-filings/{filing_id}... endpoints"
  - priority: 3
    category: existence
    check: "{factor_filing_id} in the path resolves to a TrafficFactorFiling"
    error_id: ERR_FACTOR_FILING_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/traffic-factor-filings/{factor_filing_id}... endpoints"
  - priority: 3
    category: existence
    check: "{batch_id} in the path resolves to a UsageBatch"
    error_id: ERR_USAGE_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/usage-batches/{batch_id}... endpoints"
  - priority: 3
    category: existence
    check: "{invoice_id} in the path resolves to an AccessInvoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/access-invoices/{invoice_id}... endpoints"
  - priority: 3
    category: existence
    check: "{dispute_id} in the path resolves to a BillingDispute"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/billing-disputes/{dispute_id}... endpoints"
  - priority: 3
    category: existence
    check: "{case_id} in the path resolves to a ReconciliationCase"
    error_id: ERR_RECONCILIATION_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /interconnection/reconciliation-cases/{case_id}... endpoints"

  # ---------- 4. request schema ----------
  - priority: 4
    category: existence
    check: "Every required body field is present; types, enum members, decimal scales, string patterns (OCN, CLLI, LATA, NPA-NXX, YYYYQn), numeric ranges and pagination limit/offset bounds all satisfy the §1.1 constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  # ---------- 5. body-reference existence, validated in payload field order ----------
  - priority: 5
    category: existence
    check: "carrier_id in the request body resolves to a Carrier"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "POST /interconnection/agreements, POST /interconnection/traffic-factor-filings, POST /interconnection/usage-batches"
  - priority: 5
    category: existence
    check: "agreement_id in the request body resolves to an InterconnectionAgreement"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /interconnection/trunk-groups"
  - priority: 5
    category: existence
    check: "usage_batch_id in the request body resolves to a UsageBatch"
    error_id: ERR_USAGE_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "POST /interconnection/access-invoices, POST /interconnection/reconciliation-cases"
  - priority: 5
    category: existence
    check: "invoice_id in the request body resolves to an AccessInvoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /interconnection/billing-disputes"
  - priority: 5
    category: existence
    check: "supersede_filing_id in the body, when present, resolves to a TariffFiling"
    error_id: ERR_TARIFF_FILING_NOT_FOUND
    http_status: 404
    applies_to: "POST /interconnection/tariff-filings/{filing_id}/approve"

  # ---------- 6. carrier scope ----------
  - priority: 6
    category: auth
    check: "When X-User-Role == CarrierRepresentative, X-User-ID equals the Carrier.id the target resource belongs to (directly, or through its agreement, trunk group, batch or invoice)"
    error_id: ERR_CARRIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint that lists CarrierRepresentative in roles"

  # ---------- 7. segregation of duties ----------
  - priority: 7
    category: auth
    check: "The acting X-User-ID differs from AccessInvoice.issued_by_user_id of the invoice under dispute resolution or write-off"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /interconnection/billing-disputes/{dispute_id}/resolve, POST /interconnection/access-invoices/{invoice_id}/write-off"

  # ---------- 8. optimistic concurrency ----------
  - priority: 8
    category: state
    check: "expected_agreement_version equals InterconnectionAgreement.version (see concurrency_rules.offer-create-stale-agreement)"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /interconnection/agreements/{agreement_id}/offers"
  - priority: 8
    category: state
    check: "expected_carrier_version equals Carrier.version (see concurrency_rules.factor-filing-create-stale-carrier)"
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412
    applies_to: "POST /interconnection/traffic-factor-filings"

  # ---------- 9. state preconditions ----------
  - priority: 9
    category: state
    check: "The InterconnectionAgreement is in a status from which the requested transition exists"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /interconnection/agreements/{agreement_id}/offers, POST /interconnection/agreements/{agreement_id}/activate, POST /interconnection/agreements/{agreement_id}/terminate, POST /interconnection/agreements/{agreement_id}/withdraw"
  - priority: 9
    category: state
    check: "The NegotiationOffer being accepted is in status OPEN"
    error_id: ERR_INVALID_OFFER_STATE
    http_status: 409
    applies_to: "POST /interconnection/negotiation-offers/{offer_id}/accept"
  - priority: 9
    category: state
    check: "The TrunkGroup service_status and augment_status permit the requested transition (provision from REQUESTED, activate from PROVISIONED, disconnect from DISCONNECT_PENDING, measurements only while IN_SERVICE)"
    error_id: ERR_INVALID_TRUNK_GROUP_STATE
    http_status: 409
    applies_to: "POST /interconnection/trunk-groups/{trunk_group_id}/provision, POST /interconnection/trunk-groups/{trunk_group_id}/activate, POST /interconnection/trunk-groups/{trunk_group_id}/disconnect, POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements"
  - priority: 9
    category: state
    check: "The TrunkAugmentOrder is in a status from which the requested transition exists (accept/reject from PENDING, complete from ACCEPTED, reverse from COMPLETED)"
    error_id: ERR_INVALID_AUGMENT_ORDER_STATE
    http_status: 409
    applies_to: "POST /interconnection/trunk-augment-orders/{order_id}/accept, POST /interconnection/trunk-augment-orders/{order_id}/reject, POST /interconnection/trunk-augment-orders/{order_id}/complete, POST /interconnection/trunk-augment-orders/{order_id}/reverse"
  - priority: 9
    category: state
    check: "The TariffFiling is in status FILED for both approval and withdrawal"
    error_id: ERR_INVALID_TARIFF_FILING_STATE
    http_status: 409
    applies_to: "POST /interconnection/tariff-filings/{filing_id}/approve, POST /interconnection/tariff-filings/{filing_id}/withdraw"
  - priority: 9
    category: state
    check: "The TrafficFactorFiling is in a status from which the requested review or audit transition exists"
    error_id: ERR_INVALID_FACTOR_FILING_STATE
    http_status: 409
    applies_to: "POST /interconnection/traffic-factor-filings/{factor_filing_id}/review, POST /interconnection/traffic-factor-filings/{factor_filing_id}/audit"
  - priority: 9
    category: state
    check: "The UsageBatch is in the required pipeline state (records appended only while SUBMITTED, jurisdictionalize from SUBMITTED, rate from JURISDICTIONALIZED, invoice from RATED)"
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409
    applies_to: "POST /interconnection/usage-batches/{batch_id}/call-detail-records, POST /interconnection/usage-batches/{batch_id}/jurisdictionalize, POST /interconnection/usage-batches/{batch_id}/rate, POST /interconnection/access-invoices"
  - priority: 9
    category: state
    check: "The AccessInvoice dimensions permit the operation (issue only from DRAFT; payments, disputes and write-off only while lifecycle_status == ISSUED; no payment once payment_status IN {PAID, WRITTEN_OFF})"
    error_id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    applies_to: "POST /interconnection/access-invoices/{invoice_id}/issue, POST /interconnection/access-invoices/{invoice_id}/payments, POST /interconnection/access-invoices/{invoice_id}/write-off, POST /interconnection/billing-disputes"
  - priority: 9
    category: state
    check: "An invoice whose payment_status == WRITTEN_OFF accepts no new dispute and no write-off"
    error_id: ERR_INVOICE_ALREADY_WRITTEN_OFF
    http_status: 409
    applies_to: "POST /interconnection/billing-disputes, POST /interconnection/access-invoices/{invoice_id}/write-off"
  - priority: 9
    category: state
    check: "The BillingDispute is in a status from which the requested transition exists (acknowledge from SUBMITTED or ESCALATED, resolve from UNDER_REVIEW, escalate from RESOLVED_DENIED, withdraw from the open set)"
    error_id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /interconnection/billing-disputes/{dispute_id}/acknowledge, POST /interconnection/billing-disputes/{dispute_id}/resolve, POST /interconnection/billing-disputes/{dispute_id}/escalate, POST /interconnection/billing-disputes/{dispute_id}/withdraw"
  - priority: 9
    category: state
    check: "The ReconciliationCase is in status OPEN for evaluate and VARIANCE_IDENTIFIED for adjust or accept"
    error_id: ERR_INVALID_RECONCILIATION_STATE
    http_status: 409
    applies_to: "POST /interconnection/reconciliation-cases/{case_id}/evaluate, POST /interconnection/reconciliation-cases/{case_id}/adjust, POST /interconnection/reconciliation-cases/{case_id}/accept"

  # ---------- 20-21. business_safety: regulatory and compliance caps ----------
  - priority: 20
    category: business_safety
    check: "Access charge reform parity: a filing whose rate_element == INTRASTATE_SWITCHED_ACCESS must have rate_per_mou_usd <= benchmark_interstate_rate_per_mou_usd (equality is compliant)"
    error_id: ERR_ACCESS_REFORM_RATE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /interconnection/tariff-filings"
  - priority: 20
    category: business_safety
    check: "The offered reciprocal compensation rate is <= RECIPROCAL_RATE_CAP_PER_MOU_USD"
    error_id: ERR_RECIPROCAL_RATE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /interconnection/agreements/{agreement_id}/offers"
  - priority: 20
    category: business_safety
    check: "reported_piu_pct + reported_plu_pct <= 100.00, and at audit audited_piu_pct + audited_plu_pct <= 100.00"
    error_id: ERR_FACTOR_SUM_EXCEEDS_TOTAL
    http_status: 422
    applies_to: "POST /interconnection/traffic-factor-filings, POST /interconnection/traffic-factor-filings/{factor_filing_id}/audit"
  - priority: 21
    category: business_safety
    check: "A TrunkGroup with traffic_type == TRANSIT may only be created under an agreement whose transit_traffic_allowed == true"
    error_id: ERR_TRANSIT_TRAFFIC_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /interconnection/trunk-groups"
  - priority: 21
    category: business_safety
    check: "A CallDetailRecord with a null terminating_state_code is unrateable and is refused at ingest"
    error_id: ERR_CDR_UNRATEABLE
    http_status: 422
    applies_to: "POST /interconnection/usage-batches/{batch_id}/call-detail-records"

  # ---------- 22-23. business_constraint: uniqueness, overlap, capacity, round limits ----------
  - priority: 22
    category: business_constraint
    check: "Carrier.ocn is globally unique"
    error_id: ERR_DUPLICATE_OCN
    http_status: 409
    applies_to: "POST /interconnection/carriers"
  - priority: 22
    category: business_constraint
    check: "InterconnectionAgreement.agreement_label is unique per carrier_id"
    error_id: ERR_DUPLICATE_AGREEMENT_LABEL
    http_status: 409
    applies_to: "POST /interconnection/agreements"
  - priority: 22
    category: business_constraint
    check: "TrunkGroup.trunk_group_serial is unique per agreement_id"
    error_id: ERR_DUPLICATE_TRUNK_GROUP_SERIAL
    http_status: 409
    applies_to: "POST /interconnection/trunk-groups"
  - priority: 22
    category: business_constraint
    check: "TariffFiling.filing_docket is globally unique"
    error_id: ERR_DUPLICATE_FILING_DOCKET
    http_status: 409
    applies_to: "POST /interconnection/tariff-filings"
  - priority: 22
    category: business_constraint
    check: "The half-open window [effective_date, expiry_date) of a new filing must not overlap the window of an existing filing for the same rate_element whose status IN {FILED, EFFECTIVE}; windows that merely touch (one filing's expiry_date equals the next filing's effective_date) are allowed"
    error_id: ERR_TARIFF_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /interconnection/tariff-filings"
  - priority: 22
    category: business_constraint
    check: "The closed period [period_start, period_end] of a new UsageBatch must not overlap AND must not touch the period of an existing batch for the same (carrier_id, direction); a new period_start equal to an existing period_end is rejected"
    error_id: ERR_BATCH_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /interconnection/usage-batches"
  - priority: 22
    category: business_constraint
    check: "The accepted order's install window, padded by AUGMENT_BUFFER_HOURS on both edges, must not intersect the buffered window of another ACCEPTED order whose trunk group shares (agreement_id, poi_clli_code) with this order's trunk group; buffered windows that share a single instant collide (see calculations.augment_install_window)"
    error_id: ERR_AUGMENT_WINDOW_COLLISION
    http_status: 409
    applies_to: "POST /interconnection/trunk-augment-orders/{order_id}/accept"
  - priority: 22
    category: business_constraint
    check: "Provisioned trunks summed over the trunk groups sharing (agreement_id, poi_clli_code) whose service_status IN {PROVISIONED, IN_SERVICE}, plus the requested quantity, must not exceed agreement.poi_facility_capacity_trunks"
    error_id: ERR_POI_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /interconnection/trunk-groups/{trunk_group_id}/provision"
  - priority: 22
    category: business_constraint
    check: "agreement.negotiation_round + 1 must be <= MAX_NEGOTIATION_ROUNDS"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /interconnection/agreements/{agreement_id}/offers"
  - priority: 22
    category: business_constraint
    check: "A COUNTER offer must come from the party that did not author the standing OPEN offer, and the first offer on a DRAFT agreement must have offer_type == PROPOSAL"
    error_id: ERR_OFFER_PARTY_SEQUENCE
    http_status: 409
    applies_to: "POST /interconnection/agreements/{agreement_id}/offers"
  - priority: 22
    category: business_constraint
    check: "dispute.escalation_round + 1 must be <= ESCALATION_LIMIT"
    error_id: ERR_ESCALATION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /interconnection/billing-disputes/{dispute_id}/escalate"
  - priority: 22
    category: business_constraint
    check: "At most one AccessInvoice may reference a given UsageBatch"
    error_id: ERR_BATCH_ALREADY_INVOICED
    http_status: 409
    applies_to: "POST /interconnection/access-invoices"
  - priority: 22
    category: business_constraint
    check: "At most one ReconciliationCase may exist per (usage_batch_id, exchange_reference)"
    error_id: ERR_DUPLICATE_RECONCILIATION_CASE
    http_status: 409
    applies_to: "POST /interconnection/reconciliation-cases"
  - priority: 22
    category: business_constraint
    check: "A TrafficFactorFiling for a (carrier_id, quarter) that already has a filing in status DISPUTED is refused; the standing dispute must be audited or accepted first"
    error_id: ERR_FACTOR_FILING_DISPUTE_OPEN
    http_status: 409
    applies_to: "POST /interconnection/traffic-factor-filings"
  - priority: 23
    category: business_constraint
    check: "installed_trunks must be a positive multiple of DS1_TRUNKS and must not exceed order.requested_additional_trunks"
    error_id: ERR_INSTALLED_TRUNKS_INVALID
    http_status: 422
    applies_to: "POST /interconnection/trunk-augment-orders/{order_id}/complete"
  - priority: 23
    category: business_constraint
    check: "agreed_minutes must lie inside the closed interval spanned by case.our_minutes and case.counterparty_reported_minutes"
    error_id: ERR_AGREED_MINUTES_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /interconnection/reconciliation-cases/{case_id}/adjust"
  - priority: 23
    category: business_constraint
    check: "target_utc must be greater than or equal to the current logical clock; the clock never moves backwards"
    error_id: ERR_CLOCK_MUST_ADVANCE
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  # ---------- 24-25. business_temporal: windows and deadlines ----------
  - priority: 24
    category: business_temporal
    check: "expiry_date must be strictly after effective_date"
    error_id: ERR_INVALID_TARIFF_WINDOW
    http_status: 422
    applies_to: "POST /interconnection/tariff-filings"
  - priority: 24
    category: business_temporal
    check: "measurement_period_end must be strictly after measurement_period_start"
    error_id: ERR_INVALID_MEASUREMENT_PERIOD
    http_status: 422
    applies_to: "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements"
  - priority: 24
    category: business_temporal
    check: "period_end must be strictly after period_start and strictly before the logical clock; a period that has not closed yet cannot be exchanged"
    error_id: ERR_INVALID_USAGE_PERIOD
    http_status: 422
    applies_to: "POST /interconnection/usage-batches"
  - priority: 24
    category: business_temporal
    check: "The logical clock must be at or before invoice.dispute_deadline_at; a dispute filed at exactly the deadline instant is accepted"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /interconnection/billing-disputes"
  - priority: 24
    category: business_temporal
    check: "committed_due_date must be strictly after the logical clock"
    error_id: ERR_INVALID_COMMITTED_DUE_DATE
    http_status: 422
    applies_to: "POST /interconnection/trunk-augment-orders/{order_id}/accept"
  - priority: 25
    category: business_temporal
    check: "The logical clock must have reached agreement.effective_date"
    error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /interconnection/agreements/{agreement_id}/activate"
  - priority: 25
    category: business_temporal
    check: "The logical clock must be strictly before dispute.resolution_due_at; once the due instant is reached the dispute can only be deemed allowed by the sweep"
    error_id: ERR_DISPUTE_SLA_EXPIRED
    http_status: 409
    applies_to: "POST /interconnection/billing-disputes/{dispute_id}/acknowledge, POST /interconnection/billing-disputes/{dispute_id}/resolve"
  - priority: 25
    category: business_temporal
    check: "The logical clock must have reached invoice.due_date before a balance may be written off"
    error_id: ERR_INVOICE_NOT_YET_DUE
    http_status: 409
    applies_to: "POST /interconnection/access-invoices/{invoice_id}/write-off"

  # ---------- 26-27. business_referential: cross-entity readiness ----------
  - priority: 26
    category: business_referential
    check: "The parent InterconnectionAgreement.status must be EFFECTIVE"
    error_id: ERR_AGREEMENT_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /interconnection/trunk-groups/{trunk_group_id}/activate"
  - priority: 26
    category: business_referential
    check: "For every jurisdiction whose allocated minutes are greater than 0, a TariffFiling with the mapped rate_element, status EFFECTIVE and a half-open window covering batch.period_start must exist"
    error_id: ERR_NO_EFFECTIVE_TARIFF_RATE
    http_status: 409
    applies_to: "POST /interconnection/usage-batches/{batch_id}/rate"
  - priority: 26
    category: business_referential
    check: "An agreement may only be activated when it has an EFFECTIVE LOCAL_RECIPROCAL_COMP TariffFiling whose half-open window covers the agreement's effective_date"
    error_id: ERR_NO_EFFECTIVE_RECIPROCAL_RATE
    http_status: 409
    applies_to: "POST /interconnection/agreements/{agreement_id}/activate"
  - priority: 27
    category: business_referential
    check: "The reconciliation case's UsageBatch must have an AccessInvoice whose lifecycle_status == ISSUED before an adjustment credit can be posted"
    error_id: ERR_INVOICE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /interconnection/reconciliation-cases/{case_id}/adjust"

  # ---------- 28. business_fiscal: amounts, last ----------
  - priority: 28
    category: business_fiscal
    check: "billed_amount_usd must be greater than 0.00 before an invoice can be issued"
    error_id: ERR_EMPTY_INVOICE
    http_status: 409
    applies_to: "POST /interconnection/access-invoices/{invoice_id}/issue"
  - priority: 28
    category: business_fiscal
    check: "amount_usd must be <= invoice.open_balance_usd; overpayment is refused rather than credited"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /interconnection/access-invoices/{invoice_id}/payments"
  - priority: 28
    category: business_fiscal
    check: "disputed_amount_usd must be <= invoice.open_balance_usd - invoice.disputed_amount_usd"
    error_id: ERR_DISPUTE_AMOUNT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /interconnection/billing-disputes"
  - priority: 28
    category: business_fiscal
    check: "credited_amount_usd must be > 0.00 and <= dispute.disputed_amount_usd when decision == SUSTAINED, and exactly 0.00 when decision == DENIED"
    error_id: ERR_INVALID_CREDIT_AMOUNT
    http_status: 422
    applies_to: "POST /interconnection/billing-disputes/{dispute_id}/resolve"

endpoints:
  # ================= carriers =================
  - method: POST
    path: "/interconnection/carriers"
    description: "Register an interconnecting carrier."
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_name, ocn, carrier_type]
    output: Carrier
    side_effects: ["all three reserve/receivable balances initialise to 0.00"]
  - method: GET
    path: "/interconnection/carriers/{carrier_id}"
    description: "Read one carrier including its live receivable and reserve balances."
    roles: [PlatformAdmin, InterconnectionManager, AccessBillingAnalyst, RevenueAssuranceController, DisputeResolutionOfficer, CarrierRepresentative]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: GET
    path: "/interconnection/carriers"
    description: "Paginated list of carriers, optionally filtered by carrier_type."
    roles: [PlatformAdmin, InterconnectionManager, AccessBillingAnalyst, RevenueAssuranceController]
    code: 200
    input: ["carrier_type?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []
  - method: GET
    path: "/interconnection/carriers/{carrier_id}/reserve-summary"
    description: "Computed read of calculations.reserve_provision for one carrier, reporting BOTH disputed-reserve variants and their delta."
    roles: [RevenueAssuranceController, AccessBillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: { open_receivable_usd: number, disputed_receivable_usd: number, net_receivable_usd: number, tier_pct: number, uncollectible_reserve_balance_usd: number, regulatory_disputed_reserve_usd: number, gaap_disputed_reserve_usd: number, disputed_reserve_basis_delta_usd: number }
    side_effects: []
  - method: GET
    path: "/interconnection/carriers/{carrier_id}/agreements"
    description: "Interconnection agreements negotiated with this carrier."
    roles: [PlatformAdmin, InterconnectionManager, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterconnectionAgreement[]
    side_effects: []
  - method: GET
    path: "/interconnection/carriers/{carrier_id}/traffic-factor-filings"
    description: "Traffic factor filings on record for this carrier."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["quarter?", "status?", "limit?", "offset?"]
    output: TrafficFactorFiling[]
    side_effects: []

  # ================= agreements and negotiation =================
  - method: POST
    path: "/interconnection/agreements"
    description: "Open an interconnection agreement negotiation in DRAFT."
    roles: [InterconnectionManager]
    code: 201
    input: [carrier_id, agreement_label, proposed_reciprocal_rate_per_mou_usd, proposed_term_months, "transit_traffic_allowed?", effective_date, poi_facility_capacity_trunks]
    output: InterconnectionAgreement
    side_effects: ["negotiation_round initialises to 0 and capacity_posture to NORMAL"]
  - method: GET
    path: "/interconnection/agreements/{agreement_id}"
    description: "Read one agreement including pinned terms, capacity posture and trunk totals."
    roles: [PlatformAdmin, InterconnectionManager, NetworkPlanner, AccessBillingAnalyst, CarrierRepresentative]
    code: 200
    input: []
    output: InterconnectionAgreement
    side_effects: []
  - method: GET
    path: "/interconnection/agreements"
    description: "Filtered list of interconnection agreements across carriers, created_at ASC."
    roles: [PlatformAdmin, InterconnectionManager, NetworkPlanner, AccessBillingAnalyst, RevenueAssuranceController]
    code: 200
    input: ["carrier_id?", "status?", "capacity_posture?", "limit?", "offset?"]
    output: InterconnectionAgreement[]
    side_effects: []
  - method: POST
    path: "/interconnection/agreements/{agreement_id}/offers"
    description: "Append a PROPOSAL or COUNTER offer, superseding the standing OPEN offer. Guarded by OCC on the agreement (concurrency_rules.offer-create-stale-agreement)."
    roles: [InterconnectionManager, CarrierRepresentative]
    code: 201
    input: [expected_agreement_version, offer_type, reciprocal_rate_per_mou_usd, term_months, poi_financial_responsibility, transit_traffic_allowed]
    output: NegotiationOffer
    side_effects:
      - "the standing OPEN offer moves to SUPERSEDED with responded_at stamped"
      - "agreement.negotiation_round increments by 1 and agreement.status moves DRAFT -> PROPOSED or PROPOSED <-> COUNTERED"
      - "increments InterconnectionAgreement.version by 1"
  - method: GET
    path: "/interconnection/agreements/{agreement_id}/offers"
    description: "Negotiation history of the agreement in created_at ASC order."
    roles: [PlatformAdmin, InterconnectionManager, CarrierRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: NegotiationOffer[]
    side_effects: []
  - method: GET
    path: "/interconnection/negotiation-offers/{offer_id}"
    description: "Read one negotiation offer."
    roles: [PlatformAdmin, InterconnectionManager, CarrierRepresentative]
    code: 200
    input: []
    output: NegotiationOffer
    side_effects: []
  - method: GET
    path: "/interconnection/negotiation-offers"
    description: "Filtered list of negotiation offers across agreements, created_at ASC."
    roles: [PlatformAdmin, InterconnectionManager, CarrierRepresentative]
    code: 200
    input: ["agreement_id?", "offering_party?", "status?", "limit?", "offset?"]
    output: NegotiationOffer[]
    side_effects: []
  - method: POST
    path: "/interconnection/negotiation-offers/{offer_id}/accept"
    description: "Accept the standing OPEN offer, executing the agreement and pinning its commercial terms."
    roles: [InterconnectionManager, CarrierRepresentative]
    code: 200
    input: []
    output: InterconnectionAgreement
    side_effects:
      - "offer.status becomes ACCEPTED with responded_at stamped"
      - "agreement terms pinned per calculations.negotiation_term_pinning; agreement.status becomes EXECUTED and executed_at stamped"
      - "increments InterconnectionAgreement.version by 1"
  - method: POST
    path: "/interconnection/agreements/{agreement_id}/activate"
    description: "Move an EXECUTED agreement to EFFECTIVE once its commercial date has arrived and a reciprocal compensation rate is on file."
    roles: [InterconnectionManager]
    code: 200
    input: []
    output: InterconnectionAgreement
    side_effects: ["increments InterconnectionAgreement.version by 1"]
  - method: POST
    path: "/interconnection/agreements/{agreement_id}/terminate"
    description: "Terminate an EFFECTIVE agreement, cascading to its trunk groups and open augment orders."
    roles: [InterconnectionManager]
    code: 200
    input: [termination_reason]
    output: InterconnectionAgreement
    side_effects:
      - "every non-terminal child TrunkGroup moves to DISCONNECT_PENDING and agreement.total_in_service_trunks becomes 0"
      - "every PENDING or ACCEPTED child TrunkAugmentOrder moves to REJECTED and poi_augment_pending_count becomes 0"
      - "capacity_posture recomputed and terminated_at stamped"
      - "increments InterconnectionAgreement.version by 1"
  - method: POST
    path: "/interconnection/agreements/{agreement_id}/withdraw"
    description: "Withdraw an agreement that is still in negotiation."
    roles: [InterconnectionManager]
    code: 200
    input: [withdrawal_reason]
    output: InterconnectionAgreement
    side_effects:
      - "every non-terminal child NegotiationOffer moves to WITHDRAWN"
      - "increments InterconnectionAgreement.version by 1"
  - method: GET
    path: "/interconnection/agreements/{agreement_id}/reciprocal-settlement"
    description: "Computed read of calculations.reciprocal_compensation_settlement for the agreement's carrier."
    roles: [InterconnectionManager, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: []
    output: { inbound_minutes: number, outbound_minutes: number, traffic_balance_ratio: number, settlement_mode: string, net_settlement_usd: number, reciprocal_rate_per_mou_usd: number }
    side_effects: []

  # ================= trunk groups, measurements, augments =================
  - method: POST
    path: "/interconnection/trunk-groups"
    description: "Request a trunk group at a point of interconnection under an agreement."
    roles: [NetworkPlanner]
    code: 201
    input: [agreement_id, trunk_group_serial, poi_clli_code, lata_code, poi_type, direction, traffic_type, forecast_busy_hour_ccs, forecast_horizon_quarters]
    output: TrunkGroup
    side_effects: ["service_status initialises to REQUESTED and augment_status to NONE"]
  - method: GET
    path: "/interconnection/trunk-groups/{trunk_group_id}"
    description: "Read one trunk group including both status dimensions and the latest sizing figures."
    roles: [PlatformAdmin, NetworkPlanner, InterconnectionManager, CarrierRepresentative]
    code: 200
    input: []
    output: TrunkGroup
    side_effects: []
  - method: GET
    path: "/interconnection/trunk-groups"
    description: "Filtered list of trunk groups across agreements and points of interconnection."
    roles: [PlatformAdmin, NetworkPlanner, InterconnectionManager, CarrierRepresentative]
    code: 200
    input: ["agreement_id?", "poi_clli_code?", "service_status?", "augment_status?", "limit?", "offset?"]
    output: TrunkGroup[]
    side_effects: []
  - method: GET
    path: "/interconnection/agreements/{agreement_id}/trunk-groups"
    description: "Trunk groups provisioned under the agreement."
    roles: [PlatformAdmin, NetworkPlanner, InterconnectionManager, CarrierRepresentative]
    code: 200
    input: ["service_status?", "augment_status?", "poi_clli_code?", "limit?", "offset?"]
    output: TrunkGroup[]
    side_effects: []
  - method: POST
    path: "/interconnection/trunk-groups/{trunk_group_id}/provision"
    description: "Provision physical trunks on a requested trunk group, subject to the POI facility ceiling."
    roles: [NetworkPlanner]
    code: 200
    input: [provisioned_trunks]
    output: TrunkGroup
    side_effects: ["increments TrunkGroup.version by 1"]
  - method: POST
    path: "/interconnection/trunk-groups/{trunk_group_id}/activate"
    description: "Place a provisioned trunk group in service; requires the parent agreement to be EFFECTIVE."
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: TrunkGroup
    side_effects:
      - "in_service_at stamped and agreement.total_in_service_trunks increases by provisioned_trunks"
      - "increments TrunkGroup.version and InterconnectionAgreement.version by 1 each"
  - method: POST
    path: "/interconnection/trunk-groups/{trunk_group_id}/disconnect"
    description: "Complete disconnection of a trunk group awaiting teardown."
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: TrunkGroup
    side_effects: ["provisioned_trunks set to 0", "increments TrunkGroup.version by 1"]
  - method: POST
    path: "/interconnection/trunk-groups/{trunk_group_id}/traffic-measurements"
    description: "Record a busy-hour traffic study, running calculations.trunk_sizing_and_blocking and the augment cascade."
    roles: [NetworkPlanner, CarrierRepresentative]
    code: 201
    input: [measurement_period_start, measurement_period_end, offered_calls, blocked_calls, busy_hour_ccs]
    output: TrafficMeasurement
    side_effects:
      - "trunk_group.latest_blocking_pct, required_trunks and augment_status updated"
      - "a PENDING TrunkAugmentOrder is created when the blocking breach needs capacity that fits the POI ceiling"
      - "agreement.poi_augment_pending_count and capacity_posture recomputed"
      - "increments TrunkGroup.version by 1 and InterconnectionAgreement.version by 1 when the posture changed"
  - method: GET
    path: "/interconnection/trunk-groups/{trunk_group_id}/traffic-measurements"
    description: "Traffic studies recorded for the trunk group in created_at ASC order."
    roles: [PlatformAdmin, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: ["limit?", "offset?"]
    output: TrafficMeasurement[]
    side_effects: []
  - method: GET
    path: "/interconnection/traffic-measurements/{measurement_id}"
    description: "Read one traffic study including the blocking percentage it produced."
    roles: [PlatformAdmin, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: []
    output: TrafficMeasurement
    side_effects: []
  - method: GET
    path: "/interconnection/traffic-measurements"
    description: "Filtered list of traffic studies across trunk groups, created_at ASC."
    roles: [PlatformAdmin, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: ["trunk_group_id?", "augment_triggered?", "limit?", "offset?"]
    output: TrafficMeasurement[]
    side_effects: []
  - method: GET
    path: "/interconnection/trunk-groups/{trunk_group_id}/augment-orders"
    description: "Augment orders raised for the trunk group."
    roles: [PlatformAdmin, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TrunkAugmentOrder[]
    side_effects: []
  - method: GET
    path: "/interconnection/trunk-augment-orders/{order_id}"
    description: "Read one augment order including its computed installation window."
    roles: [PlatformAdmin, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: []
    output: TrunkAugmentOrder
    side_effects: []
  - method: GET
    path: "/interconnection/trunk-augment-orders"
    description: "Filtered list of augment orders across trunk groups."
    roles: [PlatformAdmin, NetworkPlanner, CarrierRepresentative]
    code: 200
    input: ["trunk_group_id?", "triggering_measurement_id?", "status?", "limit?", "offset?"]
    output: TrunkAugmentOrder[]
    side_effects: []
  - method: POST
    path: "/interconnection/trunk-augment-orders/{order_id}/accept"
    description: "Counterparty commits to a due date, fixing the installation window (calculations.augment_install_window)."
    roles: [CarrierRepresentative]
    code: 200
    input: [committed_due_date]
    output: TrunkAugmentOrder
    side_effects: ["install_window_start and install_window_end computed", "increments TrunkAugmentOrder.version by 1"]
  - method: POST
    path: "/interconnection/trunk-augment-orders/{order_id}/reject"
    description: "Counterparty refuses the augment, driving the trunk group to AUGMENT_BLOCKED."
    roles: [CarrierRepresentative]
    code: 200
    input: [rejection_reason]
    output: TrunkAugmentOrder
    side_effects:
      - "trunk_group.augment_status becomes AUGMENT_BLOCKED and open_augment_order_count decrements by 1"
      - "agreement.poi_augment_pending_count decrements by 1 and capacity_posture becomes BLOCKED"
      - "increments TrunkAugmentOrder.version, TrunkGroup.version and InterconnectionAgreement.version by 1 each"
  - method: POST
    path: "/interconnection/trunk-augment-orders/{order_id}/complete"
    description: "Record installed trunks, growing the trunk group and the agreement's in-service total."
    roles: [NetworkPlanner]
    code: 200
    input: [installed_trunks]
    output: TrunkAugmentOrder
    side_effects:
      - "trunk_group.provisioned_trunks and agreement.total_in_service_trunks increase by installed_trunks"
      - "trunk_group.augment_status returns to NONE and open_augment_order_count decrements by 1"
      - "increments TrunkAugmentOrder.version, TrunkGroup.version and InterconnectionAgreement.version by 1 each"
  - method: POST
    path: "/interconnection/trunk-augment-orders/{order_id}/reverse"
    description: "Back out a completed augment (bad acceptance test), compensating every field the completion moved."
    roles: [NetworkPlanner]
    code: 200
    input: [reversal_reason]
    output: TrunkAugmentOrder
    side_effects:
      - "trunk_group.provisioned_trunks and agreement.total_in_service_trunks decrease by installed_trunks"
      - "trunk_group.augment_status becomes GROOMING_REVIEW and reversed_at is stamped"
      - "increments TrunkAugmentOrder.version, TrunkGroup.version and InterconnectionAgreement.version by 1 each"

  # ================= tariff filings =================
  - method: POST
    path: "/interconnection/tariff-filings"
    description: "File a tariffed rate element for a half-open effective window, subject to the access charge reform parity cap."
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [filing_docket, rate_element, rate_per_mou_usd, benchmark_interstate_rate_per_mou_usd, effective_date, expiry_date]
    output: TariffFiling
    side_effects: ["status initialises to FILED"]
  - method: GET
    path: "/interconnection/tariff-filings/{filing_id}"
    description: "Read one tariff filing including its supersession pointer."
    roles: [PlatformAdmin, RegulatoryAffairsSpecialist, AccessBillingAnalyst, RevenueAssuranceController]
    code: 200
    input: []
    output: TariffFiling
    side_effects: []
  - method: GET
    path: "/interconnection/tariff-filings"
    description: "Filtered list of tariff filings; superseded_by_filing_id finds the filings a given filing displaced."
    roles: [PlatformAdmin, RegulatoryAffairsSpecialist, AccessBillingAnalyst, RevenueAssuranceController]
    code: 200
    input: ["rate_element?", "status?", "superseded_by_filing_id?", "limit?", "offset?"]
    output: TariffFiling[]
    side_effects: []
  - method: POST
    path: "/interconnection/tariff-filings/{filing_id}/approve"
    description: "Approve a filed rate, making it EFFECTIVE; naming supersede_filing_id truncates the earlier EFFECTIVE filing for the same rate element."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["supersede_filing_id?"]
    output: TariffFiling
    side_effects:
      - "approved_at stamped"
      - "an earlier EFFECTIVE filing for the same rate_element whose window is displaced moves to SUPERSEDED with superseded_by_filing_id set to this filing"
      - "increments TariffFiling.version by 1 on both filings"
  - method: POST
    path: "/interconnection/tariff-filings/{filing_id}/withdraw"
    description: "Withdraw a filed or effective rate."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: [withdrawal_reason]
    output: TariffFiling
    side_effects: ["increments TariffFiling.version by 1"]

  # ================= traffic factors =================
  - method: POST
    path: "/interconnection/traffic-factor-filings"
    description: "File quarterly PIU/PLU traffic factors for a carrier, superseding the prior filing for that quarter. Guarded by OCC on the carrier (concurrency_rules.factor-filing-create-stale-carrier)."
    roles: [CarrierRepresentative, AccessBillingAnalyst]
    code: 201
    input: [carrier_id, expected_carrier_version, quarter, reported_piu_pct, reported_plu_pct]
    output: TrafficFactorFiling
    side_effects:
      - "a prior non-terminal filing for the same (carrier_id, quarter) moves to SUPERSEDED with superseded_at stamped"
      - "effective_piu_pct and effective_plu_pct mirror the reported values while status == REPORTED"
      - "increments Carrier.version by 1"
  - method: GET
    path: "/interconnection/traffic-factor-filings/{factor_filing_id}"
    description: "Read one traffic factor filing including its effective factors."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: []
    output: TrafficFactorFiling
    side_effects: []
  - method: GET
    path: "/interconnection/traffic-factor-filings"
    description: "Filtered list of traffic factor filings across carriers and quarters."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["carrier_id?", "quarter?", "status?", "limit?", "offset?"]
    output: TrafficFactorFiling[]
    side_effects: []
  - method: POST
    path: "/interconnection/traffic-factor-filings/{factor_filing_id}/review"
    description: "Accept the reported factors or open a dispute against them."
    roles: [AccessBillingAnalyst]
    code: 200
    input: [decision, "dispute_reason?"]
    output: TrafficFactorFiling
    side_effects: ["status becomes ACCEPTED or DISPUTED", "increments TrafficFactorFiling.version by 1"]
  - method: POST
    path: "/interconnection/traffic-factor-filings/{factor_filing_id}/audit"
    description: "Substitute audited factors, cascading a re-rate through every batch that pinned this filing."
    roles: [RevenueAssuranceController]
    code: 200
    input: [audited_piu_pct, audited_plu_pct]
    output: TrafficFactorFiling
    side_effects:
      - "status becomes AUDITED, audit_completed_at stamped and the effective factors switch to the audited values"
      - "every UsageBatch whose traffic_factor_filing_id is this filing is re-allocated and re-rated to rating_variant FINAL with rerate_count incremented"
      - "each affected AccessInvoice refreshes its amount snapshots and adjustment_count"
      - "Carrier receivable and reserve balances are recomputed and ReserveLedgerEntry rows with source_event FACTOR_AUDIT_RERATE are appended"
      - "increments TrafficFactorFiling.version, UsageBatch.version, AccessInvoice.version and Carrier.version by 1 each"

  # ================= usage, records, rating =================
  - method: POST
    path: "/interconnection/usage-batches"
    description: "Open a usage batch for a closed exchange period and direction."
    roles: [AccessBillingAnalyst]
    code: 201
    input: [carrier_id, period_start, period_end, direction, exchange_reference]
    output: UsageBatch
    side_effects: ["status initialises to SUBMITTED with all minute and amount aggregates at 0"]
  - method: GET
    path: "/interconnection/usage-batches/{batch_id}"
    description: "Read one usage batch including minute buckets, factor pinning and rated amounts."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: []
    output: UsageBatch
    side_effects: []
  - method: GET
    path: "/interconnection/usage-batches"
    description: "Filtered list of usage batches; traffic_factor_filing_id finds every batch a factor filing governs."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["carrier_id?", "traffic_factor_filing_id?", "direction?", "status?", "limit?", "offset?"]
    output: UsageBatch[]
    side_effects: []
  - method: POST
    path: "/interconnection/usage-batches/{batch_id}/call-detail-records"
    description: "Append one call detail record to an open batch."
    roles: [AccessBillingAnalyst, CarrierRepresentative]
    code: 201
    input: [originating_npanxx, terminating_npanxx, duration_seconds, signaling_cpn_present, "jip_state_code?", "originating_state_code?", terminating_state_code, same_local_calling_area]
    output: CallDetailRecord
    side_effects:
      - "billable_minutes computed as ceil(duration_seconds / 60)"
      - "batch.record_count and batch.total_billable_minutes increase"
      - "increments UsageBatch.version by 1"
  - method: GET
    path: "/interconnection/usage-batches/{batch_id}/call-detail-records"
    description: "Call detail records of the batch in created_at ASC order."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["jurisdiction?", "jurisdiction_source?", "limit?", "offset?"]
    output: CallDetailRecord[]
    side_effects: []
  - method: GET
    path: "/interconnection/call-detail-records/{cdr_id}"
    description: "Read one call detail record including its jurisdiction and rated amount."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: []
    output: CallDetailRecord
    side_effects: []
  - method: GET
    path: "/interconnection/call-detail-records"
    description: "Filtered list of call detail records across usage batches, created_at ASC."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["usage_batch_id?", "jurisdiction?", "jurisdiction_source?", "limit?", "offset?"]
    output: CallDetailRecord[]
    side_effects: []
  - method: POST
    path: "/interconnection/usage-batches/{batch_id}/jurisdictionalize"
    description: "Determine jurisdiction per record and allocate the indeterminate pool with the pinned traffic factors."
    roles: [AccessBillingAnalyst]
    code: 200
    input: []
    output: UsageBatch
    side_effects:
      - "every CallDetailRecord gets jurisdiction and jurisdiction_source"
      - "the three minute buckets, factor_source and traffic_factor_filing_id are written and jurisdictionalized_at stamped"
      - "increments UsageBatch.version by 1"
  - method: POST
    path: "/interconnection/usage-batches/{batch_id}/rate"
    description: "Rate the batch at the EFFECTIVE tariffed rates covering the period start."
    roles: [AccessBillingAnalyst]
    code: 200
    input: []
    output: UsageBatch
    side_effects:
      - "per-record rated_amount_usd written for signaling-determined records"
      - "the three jurisdiction subtotals, rated_amount_usd, rating_variant and rated_at written"
      - "increments UsageBatch.version by 1"

  # ================= invoicing, payment, write-off =================
  - method: POST
    path: "/interconnection/access-invoices"
    description: "Create a draft access invoice from a RATED usage batch."
    roles: [AccessBillingAnalyst]
    code: 201
    input: [usage_batch_id, due_date]
    output: AccessInvoice
    side_effects:
      - "amounts, jurisdiction subtotals, rating_variant and rate_authority_filing_id snapshotted from the batch"
      - "batch.status becomes INVOICED"
      - "increments UsageBatch.version by 1"
  - method: GET
    path: "/interconnection/access-invoices/{invoice_id}"
    description: "Read one access invoice including all three status dimensions and its balances."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, DisputeResolutionOfficer, CarrierRepresentative]
    code: 200
    input: []
    output: AccessInvoice
    side_effects: []
  - method: GET
    path: "/interconnection/access-invoices"
    description: "Filtered list of access invoices; rate_authority_filing_id finds every invoice a tariff filing priced."
    roles: [PlatformAdmin, AccessBillingAnalyst, RevenueAssuranceController, DisputeResolutionOfficer, CarrierRepresentative]
    code: 200
    input: ["carrier_id?", "usage_batch_id?", "rate_authority_filing_id?", "lifecycle_status?", "payment_status?", "dispute_status?", "limit?", "offset?"]
    output: AccessInvoice[]
    side_effects: []
  - method: POST
    path: "/interconnection/access-invoices/{invoice_id}/issue"
    description: "Issue the invoice to the counterparty, opening the dispute filing window and stamping the issuing user for segregation of duties."
    roles: [AccessBillingAnalyst]
    code: 200
    input: []
    output: AccessInvoice
    side_effects:
      - "issued_at, dispute_deadline_at and issued_by_user_id written"
      - "carrier receivable and reserve balances recomputed and a ReserveLedgerEntry with source_event INVOICE_CREATED is appended"
      - "increments AccessInvoice.version and Carrier.version by 1 each"
  - method: POST
    path: "/interconnection/access-invoices/{invoice_id}/payments"
    description: "Apply a cash payment against the invoice's open balance."
    roles: [CarrierRepresentative, AccessBillingAnalyst]
    code: 200
    input: [amount_usd, remittance_reference]
    output: AccessInvoice
    side_effects:
      - "paid_amount_usd and open_balance_usd updated and payment_status advanced"
      - "lifecycle_status auto-moves to CLOSED when the invoice is fully settled and undisputed"
      - "carrier balances recomputed and a ReserveLedgerEntry with source_event INVOICE_PAYMENT_APPLIED is appended"
      - "increments AccessInvoice.version and Carrier.version by 1 each"
  - method: POST
    path: "/interconnection/access-invoices/{invoice_id}/write-off"
    description: "Write off an overdue, undisputed balance as uncollectible; the issuing user may not perform it."
    roles: [RevenueAssuranceController]
    code: 200
    input: [write_off_reason]
    output: AccessInvoice
    side_effects:
      - "payment_status becomes WRITTEN_OFF and written_off_at stamped"
      - "a WRITE_OFF ReserveLedgerEntry and an UNCOLLECTIBLE_ADJUSTMENT ReserveLedgerEntry are appended"
      - "increments AccessInvoice.version and Carrier.version by 1 each"

  # ================= disputes =================
  - method: POST
    path: "/interconnection/billing-disputes"
    description: "File a billing dispute against an issued invoice inside the filing window."
    roles: [CarrierRepresentative]
    code: 201
    input: [invoice_id, disputed_amount_usd, reason_code, supporting_detail]
    output: BillingDispute
    side_effects:
      - "sla_days, filed_at and resolution_due_at computed"
      - "invoice.disputed_amount_usd increased and dispute_status becomes DISPUTED"
      - "carrier disputed exposure and reserve recomputed; a DISPUTE_PROVISION ReserveLedgerEntry is appended, followed by an UNCOLLECTIBLE_ADJUSTMENT entry when the lowered net receivable re-tiers the uncollectible reserve"
      - "increments AccessInvoice.version and Carrier.version by 1 each"
  - method: GET
    path: "/interconnection/billing-disputes/{dispute_id}"
    description: "Read one billing dispute including its SLA clock."
    roles: [PlatformAdmin, DisputeResolutionOfficer, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: []
    output: BillingDispute
    side_effects: []
  - method: GET
    path: "/interconnection/access-invoices/{invoice_id}/disputes"
    description: "Disputes filed against the invoice in created_at ASC order."
    roles: [PlatformAdmin, DisputeResolutionOfficer, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingDispute[]
    side_effects: []
  - method: GET
    path: "/interconnection/billing-disputes"
    description: "Filtered list of billing disputes across invoices, created_at ASC."
    roles: [PlatformAdmin, DisputeResolutionOfficer, AccessBillingAnalyst, RevenueAssuranceController, CarrierRepresentative]
    code: 200
    input: ["invoice_id?", "reason_code?", "status?", "limit?", "offset?"]
    output: BillingDispute[]
    side_effects: []
  - method: POST
    path: "/interconnection/billing-disputes/{dispute_id}/acknowledge"
    description: "Take a submitted or escalated dispute under review."
    roles: [DisputeResolutionOfficer]
    code: 200
    input: []
    output: BillingDispute
    side_effects: ["increments BillingDispute.version by 1"]
  - method: POST
    path: "/interconnection/billing-disputes/{dispute_id}/resolve"
    description: "Sustain or deny a dispute under review; the user who issued the invoice may not resolve it."
    roles: [DisputeResolutionOfficer]
    code: 200
    input: [decision, credited_amount_usd, resolution_note]
    output: BillingDispute
    side_effects:
      - "resolved_at and resolved_by_user_id stamped"
      - "invoice credit, open balance, disputed amount and dispute_status updated; lifecycle_status may auto-move to CLOSED"
      - "carrier balances recomputed and DISPUTE_RELEASE plus UNCOLLECTIBLE_ADJUSTMENT ReserveLedgerEntry rows appended"
      - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
  - method: POST
    path: "/interconnection/billing-disputes/{dispute_id}/escalate"
    description: "Escalate a denied dispute, extending the SLA from its previous due instant."
    roles: [CarrierRepresentative]
    code: 200
    input: [escalation_note]
    output: BillingDispute
    side_effects:
      - "escalation_round increments by 1 and resolution_due_at extended by ESCALATION_EXTENSION_DAYS"
      - "invoice.disputed_amount_usd and dispute_status return to the disputed position and a DISPUTE_PROVISION ReserveLedgerEntry is appended"
      - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
  - method: POST
    path: "/interconnection/billing-disputes/{dispute_id}/withdraw"
    description: "Withdraw an open dispute, compensating every reserve movement it caused."
    roles: [CarrierRepresentative]
    code: 200
    input: [withdrawal_reason]
    output: BillingDispute
    side_effects:
      - "invoice.disputed_amount_usd reduced and dispute_status becomes RESOLVED"
      - "a DISPUTE_RELEASE ReserveLedgerEntry that exactly offsets this dispute's provisions is appended"
      - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each"
  - method: POST
    path: "/interconnection/dispute-deadline-sweeps"
    description: "Operations checkpoint: deem every open dispute whose resolution SLA has been reached allowed in the counterparty's favour."
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: { swept_count: integer, total_credited_usd: number }
    side_effects:
      - "each swept dispute becomes RESOLVED_DEEMED_ALLOWED with a full credit and resolved_by_user_id SYSTEM_SWEEP"
      - "each affected invoice's credit, open balance and dispute_status update and lifecycle_status may auto-move to CLOSED"
      - "carrier balances recomputed and ReserveLedgerEntry rows with source_event DISPUTE_DEADLINE_SWEEP appended"
      - "increments BillingDispute.version, AccessInvoice.version and Carrier.version by 1 each for every swept dispute"

  # ================= reconciliation =================
  - method: POST
    path: "/interconnection/reconciliation-cases"
    description: "Open a mutual record-exchange reconciliation against a rated batch."
    roles: [RevenueAssuranceController, AccessBillingAnalyst]
    code: 201
    input: [usage_batch_id, counterparty_reported_minutes, counterparty_reported_amount_usd, exchange_reference]
    output: ReconciliationCase
    side_effects: ["our_minutes and our_amount_usd snapshotted from the batch; status initialises to OPEN"]
  - method: GET
    path: "/interconnection/reconciliation-cases/{case_id}"
    description: "Read one reconciliation case including both variance figures."
    roles: [PlatformAdmin, RevenueAssuranceController, AccessBillingAnalyst, CarrierRepresentative]
    code: 200
    input: []
    output: ReconciliationCase
    side_effects: []
  - method: GET
    path: "/interconnection/usage-batches/{batch_id}/reconciliation-cases"
    description: "Reconciliation cases opened against the batch."
    roles: [PlatformAdmin, RevenueAssuranceController, AccessBillingAnalyst, CarrierRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReconciliationCase[]
    side_effects: []
  - method: GET
    path: "/interconnection/reconciliation-cases"
    description: "Filtered list of record exchange reconciliation cases across usage batches."
    roles: [PlatformAdmin, RevenueAssuranceController, AccessBillingAnalyst, CarrierRepresentative]
    code: 200
    input: ["usage_batch_id?", "status?", "limit?", "offset?"]
    output: ReconciliationCase[]
    side_effects: []
  - method: POST
    path: "/interconnection/reconciliation-cases/{case_id}/evaluate"
    description: "Run calculations.record_exchange_reconciliation and branch on the variance tolerance."
    roles: [RevenueAssuranceController]
    code: 200
    input: []
    output: ReconciliationCase
    side_effects: ["minute_variance_pct and amount_variance_usd written; status becomes VARIANCE_IDENTIFIED or ACCEPTED", "increments ReconciliationCase.version by 1"]
  - method: POST
    path: "/interconnection/reconciliation-cases/{case_id}/adjust"
    description: "Settle on agreed minutes and post the resulting credit to the batch's issued invoice."
    roles: [RevenueAssuranceController]
    code: 200
    input: [agreed_minutes]
    output: ReconciliationCase
    side_effects:
      - "adjustment_amount_usd and adjusted_at written"
      - "invoice credit and open balance updated and payment_status may advance"
      - "carrier balances recomputed and a RECONCILIATION_ADJUSTMENT ReserveLedgerEntry is appended"
      - "increments ReconciliationCase.version, AccessInvoice.version and Carrier.version by 1 each"
  - method: POST
    path: "/interconnection/reconciliation-cases/{case_id}/accept"
    description: "Accept the variance as documented without posting a credit."
    roles: [RevenueAssuranceController]
    code: 200
    input: [acceptance_note]
    output: ReconciliationCase
    side_effects: ["increments ReconciliationCase.version by 1"]

  # ================= reserve ledger =================
  - method: GET
    path: "/interconnection/reserve-ledger-entries/{entry_id}"
    description: "Read one reserve ledger entry."
    roles: [PlatformAdmin, RevenueAssuranceController, AccessBillingAnalyst]
    code: 200
    input: []
    output: ReserveLedgerEntry
    side_effects: []
  - method: GET
    path: "/interconnection/reserve-ledger-entries"
    description: "Filtered, append-only reserve ledger in created_at ASC order; carrier_id gives a carrier's full reserve history and invoice_id narrows it to one invoice."
    roles: [PlatformAdmin, RevenueAssuranceController, AccessBillingAnalyst]
    code: 200
    input: ["carrier_id?", "invoice_id?", "reserve_bucket?", "entry_type?", "limit?", "offset?"]
    output: ReserveLedgerEntry[]
    side_effects: []

  # ================= test-driving surface =================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and expiry rule reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it never falls back to real wall-clock time and never moves backwards."
    roles: [PlatformAdmin]
    code: 200
    input: [target_utc]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; subsequent requests observe the new logical clock"]

errors:
  # ---- authentication and authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not listed on the endpoint"
  - id: ERR_CARRIER_SCOPE_VIOLATION
    http: 403
    condition: "A CarrierRepresentative acts on a resource belonging to a different Carrier than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same user who issued the invoice being resolved or written off"

  # ---- not found ----
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier_id in the path or body does not resolve to a Carrier"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id in the path or body does not resolve to an InterconnectionAgreement"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "offer_id does not resolve to a NegotiationOffer"
  - id: ERR_TRUNK_GROUP_NOT_FOUND
    http: 404
    condition: "trunk_group_id does not resolve to a TrunkGroup"
  - id: ERR_MEASUREMENT_NOT_FOUND
    http: 404
    condition: "measurement_id does not resolve to a TrafficMeasurement"
  - id: ERR_CDR_NOT_FOUND
    http: 404
    condition: "cdr_id does not resolve to a CallDetailRecord"
  - id: ERR_AUGMENT_ORDER_NOT_FOUND
    http: 404
    condition: "order_id does not resolve to a TrunkAugmentOrder"
  - id: ERR_TARIFF_FILING_NOT_FOUND
    http: 404
    condition: "filing_id does not resolve to a TariffFiling"
  - id: ERR_FACTOR_FILING_NOT_FOUND
    http: 404
    condition: "factor_filing_id does not resolve to a TrafficFactorFiling"
  - id: ERR_USAGE_BATCH_NOT_FOUND
    http: 404
    condition: "batch_id or usage_batch_id does not resolve to a UsageBatch"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id does not resolve to an AccessInvoice"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id does not resolve to a BillingDispute"
  - id: ERR_RECONCILIATION_CASE_NOT_FOUND
    http: 404
    condition: "case_id does not resolve to a ReconciliationCase"

  # ---- request schema ----
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, unknown enum member, bad decimal scale, malformed OCN/CLLI/LATA/NPA-NXX/quarter pattern, out-of-range number, or pagination limit/offset outside bounds"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not match InterconnectionAgreement.version"
  - id: ERR_STALE_CARRIER_VERSION
    http: 412
    condition: "expected_carrier_version does not match Carrier.version"

  # ---- state preconditions ----
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "The agreement's status has no transition for the requested operation"
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "The negotiation offer being accepted is not in status OPEN"
  - id: ERR_INVALID_TRUNK_GROUP_STATE
    http: 409
    condition: "The trunk group's service_status or augment_status has no transition for the requested operation"
  - id: ERR_INVALID_AUGMENT_ORDER_STATE
    http: 409
    condition: "The augment order's status has no transition for the requested operation"
  - id: ERR_INVALID_TARIFF_FILING_STATE
    http: 409
    condition: "The tariff filing is not in status FILED, so it can be neither approved nor withdrawn"
  - id: ERR_INVALID_FACTOR_FILING_STATE
    http: 409
    condition: "The traffic factor filing is not in a status that permits review or audit"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The usage batch is not in the pipeline state the operation requires"
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "The invoice's lifecycle, payment or dispute dimension forbids the operation"
  - id: ERR_INVOICE_ALREADY_WRITTEN_OFF
    http: 409
    condition: "The invoice's payment_status is WRITTEN_OFF, so it accepts no new dispute and no second write-off"
  - id: ERR_INVALID_DISPUTE_STATE
    http: 409
    condition: "The dispute's status has no transition for the requested operation"
  - id: ERR_INVALID_RECONCILIATION_STATE
    http: 409
    condition: "The reconciliation case is not in status OPEN for evaluate or VARIANCE_IDENTIFIED for adjust/accept"

  # ---- business_safety: regulatory ----
  - id: ERR_ACCESS_REFORM_RATE_CAP_EXCEEDED
    http: 422
    condition: "An intrastate switched access filing prices above the carrier's benchmark interstate rate"
  - id: ERR_RECIPROCAL_RATE_CAP_EXCEEDED
    http: 422
    condition: "An offered reciprocal compensation rate exceeds RECIPROCAL_RATE_CAP_PER_MOU_USD"
  - id: ERR_FACTOR_SUM_EXCEEDS_TOTAL
    http: 422
    condition: "Reported or audited PIU plus PLU exceeds 100.00 percent"
  - id: ERR_TRANSIT_TRAFFIC_NOT_PERMITTED
    http: 422
    condition: "A TRANSIT trunk group is requested under an agreement whose transit_traffic_allowed is false"
  - id: ERR_CDR_UNRATEABLE
    http: 422
    condition: "A call detail record is submitted without a terminating_state_code"

  # ---- business_constraint: uniqueness, overlap, capacity, limits ----
  - id: ERR_DUPLICATE_OCN
    http: 409
    condition: "A carrier already exists with the same OCN"
  - id: ERR_DUPLICATE_AGREEMENT_LABEL
    http: 409
    condition: "The carrier already has an agreement with this label"
  - id: ERR_DUPLICATE_TRUNK_GROUP_SERIAL
    http: 409
    condition: "The agreement already has a trunk group with this serial"
  - id: ERR_DUPLICATE_FILING_DOCKET
    http: 409
    condition: "A tariff filing already exists with this docket number"
  - id: ERR_TARIFF_WINDOW_OVERLAP
    http: 409
    condition: "The new half-open rate window overlaps a FILED or EFFECTIVE filing for the same rate element (touching windows are allowed)"
  - id: ERR_BATCH_PERIOD_OVERLAP
    http: 409
    condition: "The new closed usage period overlaps or touches an existing batch period for the same carrier and direction"
  - id: ERR_AUGMENT_WINDOW_COLLISION
    http: 409
    condition: "The buffered installation window intersects (or touches) the buffered window of another ACCEPTED augment order at the same point of interconnection"
  - id: ERR_POI_CAPACITY_EXCEEDED
    http: 409
    condition: "Provisioning would push the trunks committed at the point of interconnection above the agreement's facility ceiling"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 409
    condition: "The agreement has already used MAX_NEGOTIATION_ROUNDS rounds"
  - id: ERR_OFFER_PARTY_SEQUENCE
    http: 409
    condition: "The same party tried to counter its own standing offer, or the first offer on a DRAFT agreement was not a PROPOSAL"
  - id: ERR_ESCALATION_LIMIT_REACHED
    http: 409
    condition: "The dispute has already used ESCALATION_LIMIT escalations"
  - id: ERR_BATCH_ALREADY_INVOICED
    http: 409
    condition: "An access invoice already references this usage batch"
  - id: ERR_DUPLICATE_RECONCILIATION_CASE
    http: 409
    condition: "A reconciliation case already exists for this batch and exchange reference"
  - id: ERR_FACTOR_FILING_DISPUTE_OPEN
    http: 409
    condition: "A filing for the same carrier and quarter is currently DISPUTED"
  - id: ERR_INSTALLED_TRUNKS_INVALID
    http: 422
    condition: "installed_trunks is not a positive multiple of DS1_TRUNKS or exceeds the quantity ordered"
  - id: ERR_AGREED_MINUTES_OUT_OF_RANGE
    http: 422
    condition: "agreed_minutes falls outside the closed interval spanned by our minutes and the counterparty's minutes"
  - id: ERR_CLOCK_MUST_ADVANCE
    http: 422
    condition: "target_utc is earlier than the current logical clock"

  # ---- business_temporal ----
  - id: ERR_INVALID_TARIFF_WINDOW
    http: 422
    condition: "expiry_date is not strictly after effective_date"
  - id: ERR_INVALID_MEASUREMENT_PERIOD
    http: 422
    condition: "measurement_period_end is not strictly after measurement_period_start"
  - id: ERR_INVALID_USAGE_PERIOD
    http: 422
    condition: "period_end is not strictly after period_start, or the period has not closed before the logical clock"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is past invoice.dispute_deadline_at"
  - id: ERR_INVALID_COMMITTED_DUE_DATE
    http: 422
    condition: "committed_due_date is not strictly after the logical clock"
  - id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http: 409
    condition: "The logical clock has not reached the agreement's effective_date"
  - id: ERR_DISPUTE_SLA_EXPIRED
    http: 409
    condition: "The logical clock has reached dispute.resolution_due_at, so only the sweep may close the dispute"
  - id: ERR_INVOICE_NOT_YET_DUE
    http: 409
    condition: "The logical clock has not reached invoice.due_date"

  # ---- business_referential ----
  - id: ERR_AGREEMENT_NOT_EFFECTIVE
    http: 409
    condition: "The parent interconnection agreement is not EFFECTIVE"
  - id: ERR_NO_EFFECTIVE_TARIFF_RATE
    http: 409
    condition: "No EFFECTIVE tariff filing covers the batch period for a jurisdiction carrying minutes"
  - id: ERR_NO_EFFECTIVE_RECIPROCAL_RATE
    http: 409
    condition: "No EFFECTIVE LOCAL_RECIPROCAL_COMP filing covers the agreement's effective_date"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "The batch has no issued access invoice to carry the reconciliation credit"

  # ---- business_fiscal ----
  - id: ERR_EMPTY_INVOICE
    http: 409
    condition: "The invoice's billed amount is 0.00, so there is nothing to issue"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "The payment amount exceeds the invoice's open balance"
  - id: ERR_DISPUTE_AMOUNT_EXCEEDS_BALANCE
    http: 422
    condition: "The disputed amount exceeds the invoice's undisputed open balance"
  - id: ERR_INVALID_CREDIT_AMOUNT
    http: 422
    condition: "credited_amount_usd does not match the resolution decision (positive and within the dispute for SUSTAINED, exactly 0.00 for DENIED)"

roles:
  - name: PlatformAdmin
    description: "Operator of the interconnection platform; registers carriers, drives the logical clock and runs the dispute deadline sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/carriers"
      - "POST /interconnection/dispute-deadline-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read-only access to every carrier, agreement, trunk, filing, batch, invoice, dispute, reconciliation case and reserve ledger entry"

  - name: InterconnectionManager
    description: "CLEC-side negotiator who opens agreements, exchanges offers and manages the agreement lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/agreements"
      - "POST /interconnection/agreements/{agreement_id}/activate"
      - "POST /interconnection/agreements/{agreement_id}/terminate"
      - "POST /interconnection/agreements/{agreement_id}/withdraw"
    shared_operations:
      - "POST /interconnection/agreements/{agreement_id}/offers (shared with CarrierRepresentative)"
      - "POST /interconnection/negotiation-offers/{offer_id}/accept (shared with CarrierRepresentative)"
      - "GET on carriers, agreements, offers, trunk groups and the reciprocal settlement read"

  - name: NetworkPlanner
    description: "Engineer who requests, provisions and grooms trunk groups and completes augment work."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/trunk-groups"
      - "POST /interconnection/trunk-groups/{trunk_group_id}/provision"
      - "POST /interconnection/trunk-groups/{trunk_group_id}/activate"
      - "POST /interconnection/trunk-groups/{trunk_group_id}/disconnect"
      - "POST /interconnection/trunk-augment-orders/{order_id}/complete"
      - "POST /interconnection/trunk-augment-orders/{order_id}/reverse"
    shared_operations:
      - "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements (shared with CarrierRepresentative)"
      - "GET on agreements, trunk groups, measurements and augment orders"

  - name: AccessBillingAnalyst
    description: "Biller who collects exchanged usage, jurisdictionalises and rates it, and issues access invoices."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/usage-batches"
      - "POST /interconnection/usage-batches/{batch_id}/jurisdictionalize"
      - "POST /interconnection/usage-batches/{batch_id}/rate"
      - "POST /interconnection/access-invoices"
      - "POST /interconnection/access-invoices/{invoice_id}/issue"
      - "POST /interconnection/traffic-factor-filings/{factor_filing_id}/review"
    shared_operations:
      - "POST /interconnection/traffic-factor-filings (shared with CarrierRepresentative)"
      - "POST /interconnection/usage-batches/{batch_id}/call-detail-records (shared with CarrierRepresentative)"
      - "POST /interconnection/access-invoices/{invoice_id}/payments (shared with CarrierRepresentative)"
      - "POST /interconnection/reconciliation-cases (shared with RevenueAssuranceController)"
      - "GET on carriers, factor filings, batches, records, invoices, disputes, reconciliation cases and the reserve ledger"

  - name: DisputeResolutionOfficer
    description: "Adjudicator who takes billing disputes under review and sustains or denies them within the SLA."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/billing-disputes/{dispute_id}/acknowledge"
      - "POST /interconnection/billing-disputes/{dispute_id}/resolve"
    shared_operations:
      - "GET on invoices and disputes"

  - name: RegulatoryAffairsSpecialist
    description: "Files tariffed rate elements, shepherds rate changes through approval and withdraws filings."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/tariff-filings"
      - "POST /interconnection/tariff-filings/{filing_id}/approve"
      - "POST /interconnection/tariff-filings/{filing_id}/withdraw"
    shared_operations:
      - "GET on tariff filings"

  - name: RevenueAssuranceController
    description: "Owns traffic factor audits, record-exchange reconciliation, write-offs and the uncollectible and disputed revenue reserves."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/traffic-factor-filings/{factor_filing_id}/audit"
      - "POST /interconnection/access-invoices/{invoice_id}/write-off"
      - "POST /interconnection/reconciliation-cases/{case_id}/evaluate"
      - "POST /interconnection/reconciliation-cases/{case_id}/adjust"
      - "POST /interconnection/reconciliation-cases/{case_id}/accept"
    shared_operations:
      - "POST /interconnection/reconciliation-cases (shared with AccessBillingAnalyst)"
      - "GET on carriers, the reserve summary, factor filings, batches, invoices, disputes, reconciliation cases and the reserve ledger"

  - name: CarrierRepresentative
    description: "Counterparty carrier's representative; counters offers, commits to augment due dates, files traffic factors, pays invoices and files billing disputes. X-User-ID is the Carrier.id it acts for and every access is scoped to that carrier."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /interconnection/trunk-augment-orders/{order_id}/accept"
      - "POST /interconnection/trunk-augment-orders/{order_id}/reject"
      - "POST /interconnection/billing-disputes"
      - "POST /interconnection/billing-disputes/{dispute_id}/escalate"
      - "POST /interconnection/billing-disputes/{dispute_id}/withdraw"
    shared_operations:
      - "POST /interconnection/agreements/{agreement_id}/offers (shared with InterconnectionManager)"
      - "POST /interconnection/negotiation-offers/{offer_id}/accept (shared with InterconnectionManager)"
      - "POST /interconnection/trunk-groups/{trunk_group_id}/traffic-measurements (shared with NetworkPlanner)"
      - "POST /interconnection/traffic-factor-filings (shared with AccessBillingAnalyst)"
      - "POST /interconnection/usage-batches/{batch_id}/call-detail-records (shared with AccessBillingAnalyst)"
      - "POST /interconnection/access-invoices/{invoice_id}/payments (shared with AccessBillingAnalyst)"
      - "GET on its own carrier, agreements, offers, trunk groups, measurements, augment orders, factor filings, batches, records, invoices, disputes and reconciliation cases"
