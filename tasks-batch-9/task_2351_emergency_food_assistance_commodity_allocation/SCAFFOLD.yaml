  # ---- Recall --------------------------------------------------------------
  - method: POST
    path: "/efap/recalls"
    description: "Raises a recall on a lot, holding the covered lots and creating one RecallAction per downstream agency that already received cases from them. Always starts in INITIATED; a recall with no exposed downstream agency carries action_count == 0 and may be closed straight from INITIATED."
    roles: [StateAdmin]
    code: 201
    input: [source_lot_id, recall_class, hold_scope, reason]
    output: Recall
    side_effects: ["covered lots AVAILABLE/WATCH -> HOLD with hold_recall_id set; held_lot_count written", "cascade: SCHEDULED DeliveryAppointments drawing on held lots -> BLOCKED, then their orders APPROVED/SCHEDULED -> HELD", "creates RecallAction rows in PENDING_NOTICE with exposed_cases (discoverable only via the recall action list endpoints)", "increments the version of every held InventoryLot by 1"]

  - method: GET
    path: "/efap/recalls"
    description: "Lists recalls, filterable by source lot, class and status."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["source_lot_id?", "recall_class?", "status?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []

  - method: GET
    path: "/efap/recalls/{recall_id}"
    description: "Reads one recall, including held_lot_count and the acknowledgement and disposition counters."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: POST
    path: "/efap/recalls/{recall_id}/dispatch-notices"
    description: "Dispatches recall notices: recall INITIATED -> NOTIFYING and every PENDING_NOTICE action -> NOTIFIED."
    roles: [StateAdmin]
    code: 200
    input: []
    output: Recall
    side_effects: ["notices_dispatched_at = current_utc", "increments Recall.version by 1"]

  - method: POST
    path: "/efap/recalls/{recall_id}/expand"
    description: "Adds a newly discovered downstream agency to a MONITORING recall, creating a PENDING_NOTICE action with exposed_cases computed from that agency's receipts and returning the recall to NOTIFYING."
    roles: [StateAdmin]
    code: 201
    input: [agency_id]
    output: RecallAction
    side_effects: ["recall MONITORING -> NOTIFYING; action_count += 1", "increments Recall.version by 1"]

  - method: POST
    path: "/efap/recalls/{recall_id}/close"
    description: "Closes a MONITORING recall once every action is dispositioned, or an INITIATED recall that has no action at all (zero downstream exposure); releases held lots to AVAILABLE, or disposes them when any disposition was DESTROYED. May not be closed by the StateAdmin who raised it."
    roles: [StateAdmin]
    code: 200
    input: []
    output: Recall
    side_effects: ["held lots -> AVAILABLE (hold_recall_id cleared) or -> DISPOSED", "release cascade: BLOCKED appointments -> SCHEDULED and HELD orders -> APPROVED; disposal cascade: those appointments and orders -> CANCELLED with commitment compensation", "increments Recall.version by 1"]

  - method: GET
    path: "/efap/recalls/{recall_id}/actions"
    description: "Lists the per-agency actions of a recall."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: RecallAction[]
    side_effects: []

  - method: GET
    path: "/efap/recall-actions"
    description: "Lists recall actions across recalls, filterable by recall, agency and status."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["recall_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: RecallAction[]
    side_effects: []

  - method: GET
    path: "/efap/recall-actions/{recall_action_id}"
    description: "Reads one recall action, including exposed_cases and the reported disposition."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: RecallAction
    side_effects: []

  - method: POST
    path: "/efap/recall-actions/{recall_action_id}/acknowledge"
    description: "Downstream agency acknowledges a NOTIFIED action; when the last action is acknowledged the recall bubbles NOTIFYING -> MONITORING."
    roles: [AgencyCoordinator]
    code: 200
    input: []
    output: RecallAction
    side_effects: ["acknowledged_at = current_utc; recall.acknowledged_count += 1", "bubble up: recall -> MONITORING when acknowledged_count == action_count", "increments RecallAction.version by 1"]

  - method: POST
    path: "/efap/recall-actions/{recall_action_id}/report-disposition"
    description: "Downstream agency reports what happened to its exposed cases; RETURNED_TO_STATE moves cases back from the agency to the source lot."
    roles: [AgencyCoordinator]
    code: 200
    input: [disposition, cases_accounted]
    output: RecallAction
    side_effects: ["recall.dispositioned_count += 1; recall.accounted_cases += cases_accounted", "RETURNED_TO_STATE: Agency.agency_cases_on_hand decreased and source lot.cases_on_hand increased", "increments RecallAction.version by 1"]

  # ---- HouseholdDistribution ----------------------------------------------
  - method: POST
    path: "/efap/household-distributions"
    description: "Records a household distribution against the self-declaration income test, debiting the agency's on-hand cases and updating the recordkeeping compliance figures that drive administrative funds."
    roles: [AgencyCoordinator]
    code: 201
    input: [agency_id, cycle_id, commodity_id, household_size, declared_monthly_income_cents, "participates_in_snap?", self_declaration_signed, cases_distributed, distribution_date]
    output: HouseholdDistribution
    side_effects: ["income_limit_cents, eligibility_determination and pounds_distributed computed", "Agency.agency_cases_on_hand -= cases_distributed", "AgencyAllocation.distributed_pounds / distribution_record_count / record_compliance_pct recomputed"]

  - method: GET
    path: "/efap/household-distributions"
    description: "Lists distribution records, filterable by agency, cycle, commodity and status."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["agency_id?", "cycle_id?", "commodity_id?", "status?", "limit?", "offset?"]
    output: HouseholdDistribution[]
    side_effects: []

  - method: GET
    path: "/efap/household-distributions/{distribution_id}"
    description: "Reads one distribution record, including its income limit and eligibility determination."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: HouseholdDistribution
    side_effects: []

  - method: POST
    path: "/efap/household-distributions/{distribution_id}/void"
    description: "Voids a RECORDED distribution, reversing every aggregate it contributed to."
    roles: [AgencyCoordinator]
    code: 200
    input: [void_reason]
    output: HouseholdDistribution
    side_effects: ["compensation: AgencyAllocation.distributed_pounds / distribution_record_count / record_compliance_pct restored; Agency.agency_cases_on_hand += cases_distributed", "increments HouseholdDistribution.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (every code is reachable from an empty database using
#      only §1.5 endpoints)
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
    applies_to: ["all endpoints except GET /efap/_clock/current"]

  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "X-User-Role is not one of the four declared roles, or that role is not listed in the endpoint's roles"
    applies_to: ["all endpoints"]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "An AgencyCoordinator addresses a row whose agency_id differs from X-User-ID, or a StateWarehouseOperator confirms an appointment whose warehouse_id differs from X-User-ID"
    applies_to: ["POST /efap/commodity-orders", "POST /efap/commodity-orders/{order_id}/lines", "POST /efap/commodity-orders/{order_id}/submit", "POST /efap/commodity-orders/{order_id}/cancel", "POST /efap/inventory-transfers/{transfer_id}/accept", "POST /efap/inventory-transfers/{transfer_id}/decline", "POST /efap/recall-actions/{recall_action_id}/acknowledge", "POST /efap/recall-actions/{recall_action_id}/report-disposition", "POST /efap/household-distributions", "POST /efap/household-distributions/{distribution_id}/void", "POST /efap/delivery-appointments/{appointment_id}/confirm-delivery"]

  - id: ERR_SEGREGATION_OF_DUTIES
