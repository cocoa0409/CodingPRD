      - name: close_day_shortfall_records_unmet_demand
        claim_type: ops_run_checkpoint
        grounds: [entities.FeedDayClose, calculations.feed_supply_projection]
        distinguishing_aspect: "When usable stock (5 lbs) is below rounded demand (7.88 lbs), the close consumes exactly 5.00, records shortfall_lbs 2.88, and zeroes the lot — partial drawdown, not an error."
        test_recipe:
          setup: ["Horse A (1000 lbs BCS 3, sole resident: grass demand 8.75, August effective 7.88); one GRASS_HAY lot of 5 lbs"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "A", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 3, training_level: GREEN }, as: IntakeCoordinator, captures: { ha: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders", payload: { feed_type: GRASS_HAY, quantity_lbs: 5, unit_cents_per_lb: 10 }, as: BarnManager, captures: { po: $.data.id } }
            - { call: "POST /rescue-ops/purchase-orders/${po}/mark-ordered", payload: {}, as: BarnManager }
            - { call: "POST /rescue-ops/purchase-orders/${po}/receive", payload: { quantity_received_lbs: 5, expiry_date: "2026-09-01T00:00:00Z" }, as: BarnManager }
          trigger:
            - { call: "POST /rescue-ops/feed-inventory/close-day", payload: { close_date: "2026-08-19T00:00:00Z" }, as: BarnManager, captures: { consumed: $.data.consumed_lbs } }
            - { call: "GET /rescue-ops/feed-day-closes?feed_type=GRASS_HAY", as: BarnManager, captures: { dc_consumed: "$.data[0].consumed_lbs", dc_short: "$.data[0].shortfall_lbs" } }
            - { call: "GET /rescue-ops/feed-lots?feed_type=GRASS_HAY", as: BarnManager, captures: { lot_qty: "$.data[0].quantity_lbs" } }
          assert:
            - "dc_consumed == 5.00 (min(7.88 demand, 5 usable))"
            - "dc_short == 2.88 (7.88 - 5.00)"
            - "lot_qty == 0.00"

