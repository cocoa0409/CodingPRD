              payload: { certification_id: "${c1}", channel: "OEM_SITE", price_cents: 2499000, disclosure_fields: ["CERTIFIED_BADGE", "WARRANTY_END_DATE", "INSPECTION_DATE", "CERTIFICATION_NUMBER"] }
