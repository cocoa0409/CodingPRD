        excluded_because:
          difficulty_instance: dual_variant_calc / loss_reserve_migration_versus_static_pool_divergence
          rationale: "A multi-loan book spanning CURRENT, D30, D60 and D90 is re-bucketed and re-reserved by a single run there, which is the bulk semantics of this endpoint."
      - name: flat_reverse_lookup_lists_and_single_reads_resolve_every_child_by_parent
        claim_type: standard_crud
        grounds:
          - endpoints[GET /cdfi/target-markets]
