scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: birth_event_creation_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.VitalEvent.fields.status
          - entities.VitalEvent.fields.certification_required
        distinguishing_aspect: "POST /vital-events with all required fields returns 201, status DRAFT, certification_required false for BIRTH, and server-minted id/created_at/version=1."
        test_recipe:
          setup:
            - "A HOSPITAL facility in CTY-30."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H30", facility_type: "HOSPITAL", jurisdiction_code: "CTY-30", npi: "NPI-030" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
          trigger:
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "New", subject_first_name: "Born", sex: "MALE", jurisdiction_code: "CTY-30", facility_id: "${fac}", place_of_event: "H30" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id", st: "$.data.status", cr: "$.data.certification_required", v: "$.data.version" }
          assert:
            - "VitalEvent.${ev}.status == DRAFT"
            - "VitalEvent.${ev}.certification_required == false"
            - "VitalEvent.${ev}.version == 1"

      - name: vital_event_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_VITAL_EVENT_NOT_FOUND]
        distinguishing_aspect: "GET /vital-events/{unknown uuid} returns ERR_VITAL_EVENT_NOT_FOUND with http 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /vital-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_VITAL_EVENT_NOT_FOUND"

      - name: copy_request_missing_relationship_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.CertifiedCopyRequest.fields.requester_relationship
        distinguishing_aspect: "POST /certified-copy-requests omitting the required requester_relationship field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A HOSPITAL facility and a DRAFT BIRTH event in CTY-31."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H31", facility_type: "HOSPITAL", jurisdiction_code: "CTY-31", npi: "NPI-031" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Miss", subject_first_name: "Ing", sex: "FEMALE", jurisdiction_code: "CTY-31", facility_id: "${fac}", place_of_event: "H31" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
          trigger:
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "No Rel", id_document_type: "STATE_ID", copy_count: 1 }
              as: Applicant
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: vital_event_foreign_born_defaults_false
        claim_type: Defaults
        grounds:
          - entities.VitalEvent.fields.foreign_born
        distinguishing_aspect: "Omitting foreign_born on create yields foreign_born == false."
        test_recipe:
          setup:
            - "A HOSPITAL facility in CTY-32."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H32", facility_type: "HOSPITAL", jurisdiction_code: "CTY-32", npi: "NPI-032" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
          trigger:
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Def", subject_first_name: "Ault", sex: "MALE", jurisdiction_code: "CTY-32", facility_id: "${fac}", place_of_event: "H32" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id", fb: "$.data.foreign_born" }
          assert:
            - "VitalEvent.${ev}.foreign_born == false"

      - name: new_facility_registered_count_defaults_zero
        claim_type: Computed Fields
        grounds:
          - entities.Facility.fields.registered_count
        distinguishing_aspect: "A newly created Facility has registered_count == 0 (no registered events yet)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "H33", facility_type: "BIRTHING_CENTER", jurisdiction_code: "CTY-33", npi: "NPI-033" }
              as: StateRegistrar
              captures: { fac: "$.data.id", rc: "$.data.registered_count" }
          assert:
            - "Facility.${fac}.registered_count == 0"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: register_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.VitalEvent.FILED_to_REGISTERED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Register on a DRAFT (never filed) event has no defined FILED precondition -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DRAFT BIRTH event in CTY-34 (not filed)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H34", facility_type: "HOSPITAL", jurisdiction_code: "CTY-34", npi: "NPI-034" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Dra", subject_first_name: "Ft", sex: "MALE", jurisdiction_code: "CTY-34", facility_id: "${fac}", place_of_event: "H34" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
          trigger:
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: certify_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.MedicalCertification.PENDING_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second certify on an already CERTIFIED certification is undefined from CERTIFIED -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DEATH event with a CERTIFIED MedicalCertification in CTY-35."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FH35", facility_type: "FUNERAL_HOME", jurisdiction_code: "CTY-35", npi: "NPI-035" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /certifiers"
              payload: { name: "Dr A", certifier_type: "PHYSICIAN", license_number: "LIC-35", jurisdiction_code: "CTY-35" }
              as: StateRegistrar
              captures: { cer: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "DEATH", event_date: "2026-03-01T00:00:00Z", subject_last_name: "Dd", subject_first_name: "Ee", sex: "MALE", jurisdiction_code: "CTY-35", facility_id: "${fac}", place_of_event: "FH35" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /certifications"
              payload: { vital_event_id: "${ev}", certifier_id: "${cer}", cause_of_death: "X", manner_of_death: "NATURAL" }
              as: MedicalCertifier
              as_user_id: "${cer}"
              captures: { mc: "$.data.id" }
            - call: "POST /certifications/${mc}/certify"
              payload: {}
              as: MedicalCertifier
              as_user_id: "${cer}"
          trigger:
            - call: "POST /certifications/${mc}/certify"
              payload: {}
              as: MedicalCertifier
              as_user_id: "${cer}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_already_voided_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.VitalEvent.REGISTERED_to_VOIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VOIDED is terminal; a second void has no defined transition -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A VOIDED BIRTH event in CTY-36 (registered then voided)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H36", facility_type: "HOSPITAL", jurisdiction_code: "CTY-36", npi: "NPI-036" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Vo", subject_first_name: "Id", sex: "FEMALE", jurisdiction_code: "CTY-36", facility_id: "${fac}", place_of_event: "H36" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /vital-events/${ev}/void"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "POST /vital-events/${ev}/void"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: copy_issue_before_verify_returns_id_not_verified
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CertifiedCopyRequest.ID_VERIFIED_to_ISSUED
          - errors[ERR_ID_NOT_VERIFIED]
        distinguishing_aspect: "Issue while the copy request is still SUBMITTED (id not verified) -> ERR_ID_NOT_VERIFIED."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-37 with a SUBMITTED (not verified) copy request."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H37", facility_type: "HOSPITAL", jurisdiction_code: "CTY-37", npi: "NPI-037" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Un", subject_first_name: "Ver", sex: "MALE", jurisdiction_code: "CTY-37", facility_id: "${fac}", place_of_event: "H37" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Ver Un", requester_relationship: "SELF", id_document_type: "STATE_ID", copy_count: 1 }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
          trigger:
            - call: "POST /certified-copy-requests/${cc}/issue"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_ID_NOT_VERIFIED"

      - name: returned_event_reopens_to_draft_and_refiles
        claim_type: Valid Transition
        grounds:
          - state_machines.VitalEvent.FILED_to_RETURNED
          - state_machines.VitalEvent.RETURNED_to_DRAFT
          - state_machines.VitalEvent.DRAFT_to_FILED
        distinguishing_aspect: "A FILED event returned by the registrar re-opens (RETURNED->DRAFT) and can be re-filed (DRAFT->FILED), reaching FILED again."
        test_recipe:
          setup:
            - "A FILED BIRTH event in CTY-38."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H38", facility_type: "HOSPITAL", jurisdiction_code: "CTY-38", npi: "NPI-038" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Re", subject_first_name: "Turn", sex: "FEMALE", jurisdiction_code: "CTY-38", facility_id: "${fac}", place_of_event: "H38" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/return"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { st: "$.data.status" }
          assert:
            - "VitalEvent.${ev}.status == FILED"

      - name: paternity_finalize_before_window_returns_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PaternityAcknowledgment.ACKNOWLEDGED_to_FINALIZED
          - errors[ERR_RESCISSION_WINDOW_OPEN]
        distinguishing_aspect: "Finalize while clock now <= rescission_deadline (window still open) -> ERR_RESCISSION_WINDOW_OPEN."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-39; a PaternityAcknowledgment ACKNOWLEDGED at clock 2026-03-01 (deadline 2026-04-30); clock still 2026-03-01."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H39", facility_type: "HOSPITAL", jurisdiction_code: "CTY-39", npi: "NPI-039" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Fin", subject_first_name: "Al", sex: "MALE", jurisdiction_code: "CTY-39", facility_id: "${fac}", place_of_event: "H39" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /paternity-acknowledgments"
              payload: { vital_event_id: "${ev}", father_last_name: "Fin", father_first_name: "Pa", mother_consent: true }
              as: Applicant
              captures: { pa: "$.data.id" }
            - call: "POST /paternity-acknowledgments/${pa}/acknowledge"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "POST /paternity-acknowledgments/${pa}/finalize"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_RESCISSION_WINDOW_OPEN"

      - name: paternity_rescind_after_deadline_returns_closed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PaternityAcknowledgment.ACKNOWLEDGED_to_RESCINDED
          - errors[ERR_RESCISSION_WINDOW_CLOSED]
          - entities.PaternityAcknowledgment.fields.rescission_deadline
        distinguishing_aspect: "Rescind one second past the 60-day deadline (clock 2026-04-30T00:00:01Z > deadline 2026-04-30T00:00:00Z) -> ERR_RESCISSION_WINDOW_CLOSED (window boundary is inclusive <=)."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-40; a PaternityAcknowledgment ACKNOWLEDGED at clock 2026-03-01 (deadline 2026-04-30T00:00:00Z); clock advanced to 2026-04-30T00:00:01Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H40", facility_type: "HOSPITAL", jurisdiction_code: "CTY-40", npi: "NPI-040" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Late", subject_first_name: "Rz", sex: "MALE", jurisdiction_code: "CTY-40", facility_id: "${fac}", place_of_event: "H40" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /paternity-acknowledgments"
              payload: { vital_event_id: "${ev}", father_last_name: "Late", father_first_name: "Pa", mother_consent: true }
              as: Applicant
              captures: { pa: "$.data.id" }
            - call: "POST /paternity-acknowledgments/${pa}/acknowledge"
              payload: {}
              as: StateRegistrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:01Z" }
              as: StateRegistrar
          trigger:
            - call: "POST /paternity-acknowledgments/${pa}/rescind"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_RESCISSION_WINDOW_CLOSED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: copy_fee_veteran_waived_to_zero
        claim_type: Variant Selection
        grounds:
          - calculations.certified_copy_fee
          - entities.CertifiedCopyRequest.fields.requester_category
        distinguishing_aspect: "A VETERAN certified copy is waived: fee_total_cents == 0 regardless of copy_count."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-41; ID_VERIFIED copy request SELF VETERAN copy_count=2, clock recent (confidential -> CERTIFIED)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H41", facility_type: "HOSPITAL", jurisdiction_code: "CTY-41", npi: "NPI-041" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Vet", subject_first_name: "Er", sex: "MALE", jurisdiction_code: "CTY-41", facility_id: "${fac}", place_of_event: "H41" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Er Vet", requester_relationship: "SELF", requester_category: "VETERAN", id_document_type: "MILITARY_ID", copy_count: 2 }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "POST /certified-copy-requests/${cc}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
          trigger:
            - call: "POST /certified-copy-requests/${cc}/issue"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
              captures: { fee: "$.data.fee_total_cents", cls: "$.data.copy_class" }
          assert:
            - "CertifiedCopyRequest.${cc}.copy_class == CERTIFIED"
            - "CertifiedCopyRequest.${cc}.fee_total_cents == 0"

      - name: copy_eligibility_public_at_seventy_five_years_boundary
        claim_type: Correct Result
        grounds:
          - calculations.copy_eligibility
          - entities.CertifiedCopyRequest.fields.copy_class
        distinguishing_aspect: "A BIRTH record exactly 75 years old (event_date 2026-02-20, clock 2101-02-02 = 27375 days) is PUBLIC: copy_class == INFORMATIONAL at the >= threshold, fee 1000c/copy for copy_count=2 expedite=true -> 3900c."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event (event_date 2026-02-20) in CTY-42; clock advanced to 2101-02-02; ID_VERIFIED copy request SELF STANDARD copy_count=2 expedite=true."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H42", facility_type: "HOSPITAL", jurisdiction_code: "CTY-42", npi: "NPI-042" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-20T00:00:00Z", subject_last_name: "Old", subject_first_name: "Rec", sex: "FEMALE", jurisdiction_code: "CTY-42", facility_id: "${fac}", place_of_event: "H42" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Rec Old", requester_relationship: "SELF", requester_category: "STANDARD", id_document_type: "PASSPORT", copy_count: 2, expedite: true }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "POST /certified-copy-requests/${cc}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2101-02-02T00:00:00Z" }
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
          trigger:
            - call: "POST /certified-copy-requests/${cc}/issue"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
              captures: { cls: "$.data.copy_class", fee: "$.data.fee_total_cents" }
          assert:
            - "CertifiedCopyRequest.${cc}.copy_class == INFORMATIONAL"
            - "CertifiedCopyRequest.${cc}.fee_total_cents == 3900"

      - name: registration_delay_fee_surcharge_capped
        claim_type: Constants Applied
        grounds:
          - calculations.registration_delay_fee
          - entities.VitalEvent.fields.delayed_fee_cents
        distinguishing_aspect: "A DEATH event filed 61 days late (overage 56 days) caps the per-day surcharge at MAX 5000c: delayed_fee_cents == 2000 + 5000 == 7000."
        test_recipe:
          setup:
