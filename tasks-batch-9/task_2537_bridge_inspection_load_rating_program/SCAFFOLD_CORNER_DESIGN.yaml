      - name: permit_decide_allowed_only_when_it_matches_the_recommendation
        claim_type: conditional_action
        grounds:
          - endpoints.POST_permit_applications_id_decide
          - validations.priority_30
          - errors.ERR_PERMIT_DECISION_MISMATCH
        distinguishing_aspect: "Decide is a conditional action gated on the analysis outcome: with recommended_decision DENY, an APPROVE is refused with 422 ERR_PERMIT_DECISION_MISMATCH and the application stays ANALYZED, while the matching DENY succeeds and stamps decided_at."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one un-rated bridge, so the analysis can only return DENIED / NO_APPROVED_RATING and the recommendation is DENY."
            - "One permit routed over that bridge, already ANALYZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /permit-applications"
              payload: { permit_number: "OW-2026-0014", carrier_name: "Northline Heavy Haul", axle_loads_tons: [10.0, 10.0, 10.0, 6.0], route_bridge_ids: ["${br_id}"], speed_category: "NORMAL" }
              as: PermitOfficer
              captures: { pa_id: $.data.id }
            - call: "POST /permit-applications/${pa_id}/analyze"
              payload: {}
              as: PermitOfficer
              captures: { rec: $.data.recommended_decision }
          trigger:
            - call: "POST /permit-applications/${pa_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Carrier has an escort plan" }
              as: PermitOfficer
              captures: { err: $.data.error_id }
            - call: "POST /permit-applications/${pa_id}/decide"
              payload: { decision: "DENY", decision_note: "No approved load rating on the route" }
              as: PermitOfficer
              captures: { final_status: $.data.status }
          assert:
            - "PermitApplication.${pa_id}.recommended_decision == DENY after the analyze"
            - "The APPROVE attempt returns 422 with data.error_id == ERR_PERMIT_DECISION_MISMATCH"
            - "After the refusal PermitApplication.${pa_id}.status is still ANALYZED with decided_at == null and decision_note == null"
            - "The DENY attempt returns 200 with status == DENIED and decided_at == 2026-09-01T00:00:00Z"
            - "A further POST /permit-applications/${pa_id}/decide with DENY returns 409 ERR_PERMIT_STATE_INVALID - DENIED is terminal"

