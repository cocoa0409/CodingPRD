      - name: capacity_variant_divergence_between_state_and_district_method
        claim_type: variant_divergence
        grounds: [calculations.program_capacity_seats.variants, calculations.utilization_and_portable_need.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_variant_state_loading_vs_district_policy
          rationale: "That instance runs both methods over one identical room and projection set and asserts the full divergence in seats, utilization, deficit and portable count."

      - name: utilization_threshold_boundary_behaviour
        claim_type: threshold
        grounds: [calculations.utilization_and_portable_need.constants]
        excluded_because:
          difficulty_instance: boundary_precision_check / utilization_exactly_at_portable_trigger_percent
          rationale: "That instance tests 94.0, 95.0 and 96.0 against the 95.0 trigger on three otherwise identical campuses."

      - name: budget_aggregation_after_add_and_reversal
        claim_type: aggregation
        grounds: [calculations.budget_partition]
        excluded_because:
          difficulty_instance: compensating_invariant / capital_budget_partition_restored_on_withdrawal
          rationale: "That instance asserts the running partition after the encumbrance is added and after it is reversed, including the no-double-release case."

      - name: soft_cost_tier_boundaries
        claim_type: tiered_pricing
        grounds: [calculations.alternative_cost_comparison.constants]
        excluded_because:
          difficulty_instance: combinatorial_formula / soft_cost_tier_keyed_to_direct_not_total
          rationale: "That instance pins the tier lookup to the direct cost and contrasts the 9 percent result against the total-keyed alternative."

      - name: salvage_decay_by_age_and_grade
        claim_type: decay_function
        grounds: [calculations.unit_salvage_value]
        excluded_because:
          difficulty_instance: dual_variant_calc / salvage_variant_straight_line_vs_condition_adjusted
          rationale: "That instance walks the straight-line and condition-adjusted curves on four identical units, including the floor and the sale-recovery gate."

      - name: program_option_waterfall_between_relocate_boundary_and_addition
        claim_type: waterfall_allocation
        grounds: [calculations.alternative_cost_comparison]
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_basis_variant_lifecycle_vs_immediate_capital
          rationale: "That instance compares all three programme options under both bases and shows the recommendation flipping on identical data."

      - name: eligible_unit_selection_processing_order
        claim_type: chronological
        grounds: [calculations.eligible_unit_selection]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_eligible_unit_pool_at_auto_assign
          rationale: "That instance covers the empty pool, the single-candidate pool and the cost-then-grade-then-created_at ranking."

      - name: reliance_share_weighting_and_rounding
        claim_type: weighted_scoring
        grounds: [calculations.reliance_metrics]
        excluded_because:
          difficulty_instance: combinatorial_formula / reliance_share_rounded_per_school_then_averaged
          rationale: "That instance pins the per-campus-then-average order and rejects the pooled alternative."

      - name: estimate_to_encumbrance_reconciliation
        claim_type: reconciliation
        grounds: [entities.PlacementRequest.encumbered_cost_cents, calculations.budget_partition]
        excluded_because:
          difficulty_instance: compensating_invariant / capital_budget_partition_restored_on_withdrawal
          rationale: "That instance asserts the stored encumbrance is what is released, not a recomputed estimate, so the reconciliation delta is zero."

