scaffold_corner_design:
- section: entities
  instances:
  - name: program_creation_returns_full_row_with_seeded_derived_fields
    claim_type: creation
    grounds:
    - §1.1 Program (all fields, source column)
    - §1.5 POST /programs
    - §1.2 Program.status initial_state DESIGN
    - §1.0 response_envelope.success
    distinguishing_aspect: |-
      A POST /programs carrying only the six required inputs must return HTTP 201 with the six echoed values, a system id / created_at / updated_at / version 1, status DESIGN, and every derived money and count field seeded to its zero value rather than left absent or null.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      setup_api_calls: []
      trigger:
      - 'POST /programs {"name": "FY26 Presidents Circle", "fiscal_year": 2026, "qualification_metric":
        "NET_REVENUE_CENTS", "sales_period_start": "2026-01-01T00:00:00Z", "sales_period_end": "2026-06-30T00:00:00Z",
        "budget_total_cents": 5000000} as ProgramDirector pd-01.'
      assert:
      - HTTP 201 with response_type "object" and a meta block carrying api_request_id and api_request_timestamp.
      - the six supplied fields are echoed verbatim, including budget_total_cents 5000000.
      - status == "DESIGN" (the declared initial_state) and version == 1.
      - created_at == updated_at == "2026-08-01T00:00:00Z" from the logical clock.
      - gross_up_policy == "NONE" and gross_up_policy_locked == false.
      - per_person_cost_basis_cents == 0, committed_budget_cents == 0, budget_headroom_cents == 5000000,
        budget_posture == "OK".
      - cancellation_exposure_cents == 0, reported_award_total_cents == 0, qualified_count == 0, travelled_count
        == 0.
      - sales_lift_pct == null, satisfaction_index == null and cancellation_reason == null.
  - name: stored_rows_round_trip_through_their_single_get
    claim_type: retrieval
    grounds:
    - §1.5 GET /programs/{program_id}, GET /award-tiers/{tier_id}, GET /destinations/{destination_id},
      GET /qualifiers/{qualifier_id}
    - §1.1 Program, AwardTier, Destination, Qualifier
    distinguishing_aspect: |-
      Every entity created in the sourcing chain must be readable byte-identically through its own GET /{id} endpoint — the AwardTier ladder, the inspected Destination and both reviewed Qualifiers — with no field dropped and no derived field recomputed differently on read than it was on write.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - A program in SOURCING with two tiers, two destinations (Lisbon inspected and SHORTLISTED, Seville
        still CANDIDATE) and two reviewed qualifiers.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 20000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Lisbon
          country_code: PT
          per_person_cost_cents: 431757
          risk_score: 35
          air_gateway_code: LIS
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d1_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Seville
          country_code: ES
          per_person_cost_cents: 388000
          risk_score: 28
          air_gateway_code: SVQ
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d2_id: $.data.id
      - call: POST /destinations/${d1_id}/site-inspection
        payload:
          inspection_score: 82
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /destinations/${d1_id}/shortlist
        payload: {}
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-1001
          full_name: Ana Reyes
          baseline_metric: 180000000
          actual_metric: 260000000
          guest_count: 1
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qa_id: $.data.id
      - call: POST /qualifiers/${qa_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-2001
          full_name: Ben Ortiz
          baseline_metric: 120000000
          actual_metric: 155000000
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qb_id: $.data.id
      - call: POST /qualifiers/${qb_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /programs/${p_id}/advance
        payload:
          to_status: SOURCING
        as: ProgramDirector
        as_user_id: pd-01
      trigger:
      - GET /programs/${p_id} as ProgramDirector pd-01.
      - GET /award-tiers/${t1_id} and GET /award-tiers/${t2_id} as ProgramDirector pd-01.
      - GET /destinations/${d1_id} and GET /destinations/${d2_id} as SourcingManager sm-01.
      - GET /qualifiers/${qa_id} and GET /qualifiers/${qb_id} as SalesOpsAnalyst so-01.
      assert:
      - GET /programs/${p_id} returns status "SOURCING", qualified_count 2 and committed_budget_cents
        190000 (150000 + 40000 while per_person_cost_basis_cents is still 0).
      - GET /award-tiers/${t1_id} returns tier_code "PLATINUM", tier_rank 1, qualification_threshold 250000000,
        service_load_bp 1275, upgrade_allowance_cents 150000.
      - GET /destinations/${d1_id} returns status "SHORTLISTED", inspection_status "INSPECTED", inspection_score
        82, inspected_by_user_id "sm-01", inspected_at "2026-08-01T00:00:00Z".
      - GET /destinations/${d2_id} returns status "CANDIDATE" and inspection_status "NOT_INSPECTED" with
        inspection_score null.
      - GET /qualifiers/${qa_id} returns assigned_tier_id "${t1_id}", award_status "QUALIFIED", committed_cost_cents
        150000.
      - GET /qualifiers/${qb_id} returns assigned_tier_id "${t2_id}", award_status "QUALIFIED", committed_cost_cents
        40000.
      - every response carries the same version value that the corresponding write returned.
  - name: qualifier_listing_paginates_and_filters_independently
    claim_type: listing
    grounds:
    - §1.5 GET /qualifiers (program_id?, assigned_tier_id?, award_status?, tax_status?, employee_code?,
      limit?, offset?)
    - §1.0 response_envelope.pagination_fields and pagination_defaults
    - §1.4 priority 8 ERR_INVALID_REQUEST for malformed pagination
    distinguishing_aspect: |-
      GET /qualifiers must return the pagination envelope (limit, offset, total_count, has_more) with limit defaulting to 10, must intersect filters rather than union them (award_status DISQUALIFIED yields exactly the one disqualified row out of three), and must reject limit 0 and limit 101 with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - 'A program in DESIGN with the PLATINUM/GOLD ladder and three reviewed qualifiers: two QUALIFIED
        (one PLATINUM, one GOLD) and one DISQUALIFIED.'
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 20000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-1001
          full_name: Ana Reyes
          baseline_metric: 180000000
          actual_metric: 260000000
          guest_count: 1
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qa_id: $.data.id
      - call: POST /qualifiers/${qa_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-2001
          full_name: Ben Ortiz
          baseline_metric: 120000000
          actual_metric: 155000000
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qb_id: $.data.id
      - call: POST /qualifiers/${qb_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-5003
          full_name: Zane Holt
          baseline_metric: 100000000
          actual_metric: 149999999
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qz_id: $.data.id
      - call: POST /qualifiers/${qz_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      trigger:
      - GET /qualifiers?program_id=${p_id} as SalesOpsAnalyst so-01 — no pagination params.
      - GET /qualifiers?program_id=${p_id}&limit=2&offset=0 then &offset=2 as SalesOpsAnalyst so-01.
      - GET /qualifiers?program_id=${p_id}&award_status=DISQUALIFIED as SalesOpsAnalyst so-01.
      - GET /qualifiers?program_id=${p_id}&assigned_tier_id=${t2_id}&award_status=QUALIFIED as SalesOpsAnalyst
        so-01.
      - GET /qualifiers?program_id=${p_id}&limit=0 and GET /qualifiers?program_id=${p_id}&limit=101 as
        SalesOpsAnalyst so-01.
      assert:
      - the unparameterised list returns response_type "array" with limit 10, offset 0, total_count 3,
        has_more false.
      - limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with
        has_more false.
      - the two pages together cover all three rows exactly once, with no row repeated across pages.
      - award_status=DISQUALIFIED returns total_count 1 and only ${qz_id}.
      - the two-filter query returns total_count 1 and only ${qb_id} — the filters intersect, they do
        not union.
      - limit=0 and limit=101 both return error_id "ERR_INVALID_REQUEST" with HTTP 400.
  - name: missing_path_ids_and_missing_body_foreign_keys_return_distinct_404s
    claim_type: not_found
    grounds:
    - §1.4 priority 4 (templated path ids, validated left-to-right)
    - §1.4 priority 5 (body foreign keys, validated in input order)
    - §1.6 ERR_PROGRAM_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_QUALIFIER_NOT_FOUND, ERR_DESTINATION_NOT_FOUND,
      ERR_CONTRACT_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND, ERR_ACTIVITY_NOT_FOUND,
      ERR_SIGNUP_NOT_FOUND, ERR_TAX_REPORT_NOT_FOUND
    distinguishing_aspect: |-
      Each entity family must return its own 404 error_id — a missing path id and a missing body foreign key are both 404 but are resolved by different rules, and a body FK that names a non-existent destination must yield ERR_DESTINATION_NOT_FOUND rather than the generic ERR_PROGRAM_NOT_FOUND of its sibling field.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - A program in SOURCING with the usual ladder, destinations and qualifiers so that valid ids exist
        alongside the invented ones.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 20000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Lisbon
          country_code: PT
          per_person_cost_cents: 431757
          risk_score: 35
          air_gateway_code: LIS
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d1_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Seville
          country_code: ES
          per_person_cost_cents: 388000
          risk_score: 28
          air_gateway_code: SVQ
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d2_id: $.data.id
      - call: POST /destinations/${d1_id}/site-inspection
        payload:
          inspection_score: 82
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /destinations/${d1_id}/shortlist
        payload: {}
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-1001
          full_name: Ana Reyes
          baseline_metric: 180000000
          actual_metric: 260000000
          guest_count: 1
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qa_id: $.data.id
      - call: POST /qualifiers/${qa_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-2001
          full_name: Ben Ortiz
          baseline_metric: 120000000
          actual_metric: 155000000
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qb_id: $.data.id
      - call: POST /qualifiers/${qb_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /programs/${p_id}/advance
        payload:
          to_status: SOURCING
        as: ProgramDirector
        as_user_id: pd-01
      trigger:
      - GET /programs/00000000-0000-4000-8000-000000000001 as ProgramDirector pd-01.
      - GET /qualifiers/00000000-0000-4000-8000-000000000002 as SalesOpsAnalyst so-01.
      - GET /supplier-contracts/00000000-0000-4000-8000-000000000003 as SourcingManager sm-01.
      - POST /supplier-contracts with program_id "${p_id}" but destination_id "00000000-0000-4000-8000-000000000004"
        as SourcingManager sm-01.
      - POST /award-tiers with program_id "00000000-0000-4000-8000-000000000005" as ProgramDirector pd-01.
      assert:
      - the program GET returns error_id "ERR_PROGRAM_NOT_FOUND" with HTTP 404.
      - the qualifier GET returns "ERR_QUALIFIER_NOT_FOUND" and the contract GET returns "ERR_CONTRACT_NOT_FOUND",
        both HTTP 404.
      - the contract POST returns "ERR_DESTINATION_NOT_FOUND" with HTTP 404 — the second FK in the input
        order is the one that fails.
      - the award-tier POST returns "ERR_PROGRAM_NOT_FOUND" with HTTP 404.
      - 'no row is created by either failing POST: GET /supplier-contracts?program_id=${p_id} and GET
        /award-tiers?program_id=${p_id} return total_count 0 and 2 respectively.'
      - 'every 404 body follows the error envelope: response_type "error" with data.error_id and data.message.'
  - name: missing_required_fields_and_malformed_bodies_return_invalid_request
    claim_type: required_fields
    grounds:
    - §1.4 priority 7 ERR_INVALID_REQUEST (required present, correct types, enums inside declared sets,
      integer ranges)
    - §1.5 POST /programs, POST /award-tiers, POST /destinations, POST /supplier-contracts input.required
    - §1.1 field types
    distinguishing_aspect: |-
      Every field listed under an endpoint's input.required must be genuinely required: omitting budget_total_cents from POST /programs, tier_rank from POST /award-tiers, or attrition_allowance_bp from POST /supplier-contracts each returns ERR_INVALID_REQUEST with HTTP 400 and creates nothing, and so does supplying a string where an integer is declared.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - One valid program exists so that the award-tier and destination probes fail on their own body
        rather than on a missing parent.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 5000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      trigger:
      - POST /programs omitting budget_total_cents as ProgramDirector pd-01.
      - 'POST /award-tiers {"program_id": "${p_id}", "tier_code": "PLATINUM", "qualification_threshold":
        250000000, "budget_per_qualifier_cents": 2500000, "air_cabin_class": "BUSINESS"} — tier_rank omitted
        — as ProgramDirector pd-01.'
      - 'POST /destinations {"program_id": "${p_id}", "city": "Lisbon", "country_code": "PT", "per_person_cost_cents":
        "431757", "risk_score": 35, "air_gateway_code": "LIS"} — per_person_cost_cents as a string — as
        SourcingManager sm-01.'
      - 'POST /qualifiers {"program_id": "${p_id}", "employee_code": "S-1001", "full_name": "Ana Reyes",
        "baseline_metric": 180000000} — actual_metric omitted — as SalesOpsAnalyst so-01.'
      assert:
      - all four calls return error_id "ERR_INVALID_REQUEST" with HTTP 400.
      - the schema failures are reported before any state, fiscal or referential rule runs — no ERR_PROGRAM_STATE_INVALID
        appears.
      - GET /programs returns total_count 1 — the second program was never created.
      - GET /award-tiers?program_id=${p_id}, GET /destinations?program_id=${p_id} and GET /qualifiers?program_id=${p_id}
        all return total_count 0.
      - Program.${p_id}.version is still 1 — a rejected child write never bumps the parent.
  - name: omitted_optional_fields_take_their_declared_defaults
    claim_type: defaults
    grounds:
    - §1.1 AwardTier.guest_allowance, upgrade_allowance_cents, service_load_bp (defaults)
    - §1.1 Qualifier.guest_count (default) and Registration.rooms (default)
    - §1.5 POST /award-tiers, POST /qualifiers, POST /registrations input.optional
    distinguishing_aspect: |-
      Omitting guest_allowance, upgrade_allowance_cents and service_load_bp from POST /award-tiers must produce a tier whose committed-cost contribution is exactly the base per-person cost plus gratuity with no allowance and no service load (521409 becomes 447019 for a 1-room default registration), and omitting rooms from POST /registrations must default it to 1 rather than to 0 or null.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - A program in DESIGN on budget 20000000 with one SILVER tier created with only its five required
        fields supplied.
      - One qualifier created without guest_count.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Defaults Probe
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 20000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: SILVER
          tier_rank: 1
          qualification_threshold: 100000000
          budget_per_qualifier_cents: 1600000
          air_cabin_class: ECONOMY
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-6001
          full_name: Nia Fell
          baseline_metric: 100000000
          actual_metric: 150000000
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qn_id: $.data.id
      trigger:
      - GET /award-tiers/${t1_id} as ProgramDirector pd-01.
      - GET /qualifiers/${qn_id} as SalesOpsAnalyst so-01.
      - POST /qualifiers/${qn_id}/review {} as SalesOpsAnalyst so-01.
      assert:
      - AwardTier.${t1_id}.guest_allowance == 0, upgrade_allowance_cents == 0 and service_load_bp == 0
        — the declared defaults, not null.
      - Qualifier.${qn_id}.guest_count == 0 by default.
      - 'after review: award_status "QUALIFIED", assigned_tier_id "${t1_id}" and committed_cost_cents
        == 0 (base 0 plus a zero allowance).'
      - Program.committed_budget_cents == 0 and budget_posture == "OK" (utilization_bp 0).
      - the defaulted tier still satisfies priority 20 because guest_count 0 <= guest_allowance 0.
  - name: computed_and_system_fields_are_derived_not_accepted_from_input
    claim_type: computed_fields
    grounds:
    - §1.1 Registration.program_id, room_nights, cost_cents, air_* (source computed)
    - §1.1 Qualifier.committed_cost_cents, taxable_award_cents (source computed)
    - §1.1 common_fields id, created_at, updated_at, version (source system)
    - §1.5 POST /registrations input (program_id is absent from the input schema)
    distinguishing_aspect: |-
      Registration.program_id, room_nights and cost_cents are never accepted from the request body — program_id is derived from the referenced qualifier, room_nights stays 0 until confirmation stamps rooms * nights, and cost_cents stays 0 until an air action recomputes it — while id, created_at, updated_at and version are stamped by the system on every row.
    test_recipe:
      setup:
