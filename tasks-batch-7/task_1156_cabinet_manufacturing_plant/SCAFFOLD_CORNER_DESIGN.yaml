      - name: claim_warranty_window_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CLAIM_WARRANTY_EXPIRED]", calculations.claim_credit]
        distinguishing_aspect: "Temporal boundary pinned inclusive: at exactly day 90 after shipped_at the freight claim APPROVE succeeds (APPROVED_NO_CHARGE); at day 91 the identical APPROVE fails with ERR_CLAIM_WARRANTY_EXPIRED."
        test_recipe:
          setup:
            - "Dealer L4; style; finish; door order with lines L1/L2 (qty 2 each, unit 30,000) shipped at default clock 2026-05-01"
            - "claim1 on L1 qty 1; claim2 on L2 qty 1 (both FREIGHT_DAMAGE, created at default clock)"
