# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves to a declared
# element; every setup_api_calls chain drives empty-DB -> setup using only §1.5 endpoints.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: recapture_shared_appreciation_on_servicing
        grounds:
          - calculations.recapture_amount
          - state_machines.ServicingAccount.ACTIVE_to_IN_SALE
          - entities.ServicingAccount.fields.recapture_amount_cents
          - entities.SaleEvent.fields.appreciation_cents
        distinguishing_aspect: |
          Dual-variant lives on the ServicingAccount/SaleEvent domain: SHARED_APPRECIATION recapture =
          original_disbursed + program share of appreciation, a different entity domain than the
          Application/Award assistance dual-variant. For basis 30000000, sale 35000000, share 30% the
          recapture is 6500000 and forgiven is 0.
        test_recipe:
          setup:
            - "SHARED_APPRECIATION program; applicant at 80% AMI approved for a 5,000,000c award, fully funded from one source, closed at purchase 30,000,000 / first mortgage 24,000,000 / appraised 31,000,000 so basis_value=30,000,000 and original_disbursed=5,000,000; ServicingAccount ACTIVE."
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION", recapture_term_months: 120, appreciation_share_pct: 30 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/funding-sources"
              payload: { name: "HOME Fund", priority: 1, total_appropriation_cents: 10000000 }
              as: ProgramAdmin
              captures: { fs_id: $.data.id, fs_v: $.data.version }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Ann Buyer", email: "ann@x.com", household_size: 4, annual_income_cents: 8000000, first_time_buyer: true }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "1 Main", county_code: "K01", unit_type: "SINGLE_FAMILY", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/properties/${pr_id}/appraisal"
              payload: { appraised_value_cents: 31000000 }
              as: CaseManager
            - call: "POST /api/v1/education-sessions"
              payload: { program_id: "${p_id}", title: "HB101", start_at: "2026-07-02T09:00:00Z", end_at: "2026-07-02T12:00:00Z", capacity: 10 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/education-sessions/${sess_id}/enrollments"
              payload: { applicant_id: "${a_id}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/v1/enrollments/${enr_id}/attend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "START" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/awards"
              payload: { assistance_type: "SHARED_APPRECIATION" }
              as: CaseManager
              captures: { aw_id: $.data.id }
            - call: "POST /api/v1/awards/${aw_id}/approve"
              payload: {}
              as: CaseManager
              as_user_id: "cm_approver"
            - call: "POST /api/v1/funding-allocations"
              payload: { award_id: "${aw_id}", funding_source_id: "${fs_id}", amount_cents: 5000000, lien_position: 1, expected_funding_source_version: "${fs_v}" }
              as: CaseManager
              captures: { alloc_id: $.data.id }
            - call: "POST /api/v1/awards/${aw_id}/closings"
              payload: { property_id: "${pr_id}", scheduled_date: "2026-08-01T00:00:00Z", window_days: 7 }
              as: ClosingCoordinator
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/closings/${cl_id}/docs-pending"
              payload: {}
              as: ClosingCoordinator
            - call: "POST /api/v1/closings/${cl_id}/complete"
              payload: { final_purchase_price_cents: 30000000, final_first_mortgage_cents: 24000000 }
              as: ClosingCoordinator
            - call: "GET /api/v1/servicing-accounts?award_id=${aw_id}"
              payload: {}
              as: Servicer
              captures: { sa_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/servicing-accounts/${sa_id}/report-sale"
              payload: { sale_price_cents: 35000000, sale_date: "2029-01-01T00:00:00Z" }
              as: Servicer
              captures: { se_recapture: $.data.recapture_amount_cents }
          assert:
            - "SaleEvent.appreciation_cents == 5000000"
            - "SaleEvent.recapture_amount_cents == 6500000"
            - "ServicingAccount.${sa_id}.recapture_amount_cents == 6500000"
            - "ServicingAccount.${sa_id}.forgiven_amount_cents == 0"
            - "ServicingAccount.${sa_id}.lifecycle_status == IN_SALE"

      - name: assistance_provisional_vs_final_divergence
        grounds:
          - calculations.assistance_amount
          - entities.Application.fields.estimated_assistance_cents
          - entities.Award.fields.assistance_amount_final_cents
          - state_machines.Award.FUNDED_to_SERVICING
        distinguishing_aspect: |
          Dual-variant lives on the Application/Award domain (distinct from the ServicingAccount recapture
          variant): the provisional estimate uses the application's estimated inputs (5,000,000) while the
          final recompute at closing uses closing actuals with the appraised-value basis cap and yields
          4,100,000 - the two differ by 900,000, which funding_reconciliation releases.
        test_recipe:
          setup:
            - "Same 80%-AMI applicant approved for a provisional 5,000,000c award fully reserved from one source; at closing the final first mortgage is 25,000,000 (higher than the 24,000,000 estimate) so final assistance is 4,100,000."
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION", recapture_term_months: 120, appreciation_share_pct: 30 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/funding-sources"
              payload: { name: "HOME Fund", priority: 1, total_appropriation_cents: 10000000 }
              as: ProgramAdmin
              captures: { fs_id: $.data.id, fs_v: $.data.version }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Ann Buyer", email: "ann2@x.com", household_size: 4, annual_income_cents: 8000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "1 Main", county_code: "K01", purchase_price_cents: 30000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/properties/${pr_id}/appraisal"
              payload: { appraised_value_cents: 31000000 }
              as: CaseManager
            - call: "POST /api/v1/education-sessions"
              payload: { program_id: "${p_id}", title: "HB101", start_at: "2026-07-02T09:00:00Z", end_at: "2026-07-02T12:00:00Z", capacity: 10 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/education-sessions/${sess_id}/enrollments"
              payload: { applicant_id: "${a_id}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/v1/enrollments/${enr_id}/attend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 24000000, buyer_contribution_cents: 500000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "START" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/awards"
              payload: { assistance_type: "SHARED_APPRECIATION" }
              as: CaseManager
              captures: { aw_id: $.data.id }
            - call: "POST /api/v1/awards/${aw_id}/approve"
              payload: {}
              as: CaseManager
              as_user_id: "cm_approver"
            - call: "POST /api/v1/funding-allocations"
              payload: { award_id: "${aw_id}", funding_source_id: "${fs_id}", amount_cents: 5000000, lien_position: 1, expected_funding_source_version: "${fs_v}" }
              as: CaseManager
            - call: "POST /api/v1/awards/${aw_id}/closings"
              payload: { property_id: "${pr_id}", scheduled_date: "2026-08-01T00:00:00Z", window_days: 7 }
              as: ClosingCoordinator
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/closings/${cl_id}/docs-pending"
              payload: {}
              as: ClosingCoordinator
          trigger:
            - call: "POST /api/v1/closings/${cl_id}/complete"
              payload: { final_purchase_price_cents: 30000000, final_first_mortgage_cents: 25000000 }
              as: ClosingCoordinator
          assert:
            - "Application.${app_id}.estimated_assistance_cents == 5000000"
            - "Award.${aw_id}.assistance_amount_final_cents == 4100000"
            - "Award.${aw_id}.original_disbursed_cents == 4100000"
            - "Award.${aw_id}.status == SERVICING"

  - rule_id: combinatorial_formula
    instances:
      - name: assistance_tiered_min_cap_mode_a
        grounds:
          - calculations.assistance_amount
          - entities.Application.fields.estimated_assistance_cents
          - entities.Application.fields.ami_pct
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a): >=3-input non-linear formula. assistance = min(cap, max(0, basis - first_mortgage -
          max(stated, ceil(basis*tier_pct/100)))) where tier_pct is selected from ami_pct. At 60% AMI
          (tier 1%), basis 20,000,000, first mortgage 15,000,000, stated 100,000: required = max(100000,
          200000)=200000, gap=4,800,000, below the 5,000,000 cap, so estimate is 4,800,000. Nested
          max/min and tier selection all bind.
        test_recipe:
          setup:
            - "OPEN program (cap 5,000,000); IncomeLimit for household 4 = 10,000,000; applicant income 6,000,000 (60% AMI, tier 1%); property purchase 20,000,000; application first mortgage 15,000,000, stated contribution 100,000; submitted."
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Mid Buyer", email: "mid@x.com", household_size: 4, annual_income_cents: 6000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "2 Oak", county_code: "K01", purchase_price_cents: 20000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 15000000, buyer_contribution_cents: 100000 }
              as: CaseManager
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
          assert:
            - "Application.${app_id}.ami_pct == 60.00"
            - "Application.${app_id}.estimated_assistance_cents == 4800000"
            - "Application.${app_id}.status == SUBMITTED"

      - name: declining_balance_forgiveness_sum_then_round_mode_b
        grounds:
          - calculations.recapture_amount
          - entities.ServicingAccount.fields.forgiven_amount_cents
          - entities.ServicingAccount.fields.recapture_amount_cents
          - state_machines.ServicingAccount.ACTIVE_to_IN_SALE
        distinguishing_aspect: |
          Mode (b): nested-rounding order. DECLINING_BALANCE forgiveness = round_half_up(original *
          months_held / term) as a SINGLE final rounding (sum-then-round). For original 3,650,000, term
          120, months_held 7: forgiven = round(212916.67) = 212917 and recapture = 3,437,083. Per-month
          rounding (round(30416.67)*7 = 212919) would give a different figure; the scaffold pins
          sum-then-round.
        test_recipe:
          setup:
            - "DECLINING_BALANCE program (term 120); applicant income 5,000,000 (50% AMI, tier 0%); property purchase 20,000,000, appraised 20,000,000; application first mortgage 16,350,000, stated 0 so provisional and final assistance both 3,650,000; funded, closed with opened_at 2027-01-01, ServicingAccount ACTIVE with original_disbursed 3,650,000."
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA-DB", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "DECLINING_BALANCE", recapture_term_months: 120 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/funding-sources"
              payload: { name: "HOME Fund", priority: 1, total_appropriation_cents: 10000000 }
              as: ProgramAdmin
              captures: { fs_id: $.data.id, fs_v: $.data.version }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Low Buyer", email: "low@x.com", household_size: 4, annual_income_cents: 5000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "3 Pine", county_code: "K01", purchase_price_cents: 20000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/properties/${pr_id}/appraisal"
              payload: { appraised_value_cents: 20000000 }
              as: CaseManager
            - call: "POST /api/v1/education-sessions"
              payload: { program_id: "${p_id}", title: "HB101", start_at: "2026-07-02T09:00:00Z", end_at: "2026-07-02T12:00:00Z", capacity: 10 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/education-sessions/${sess_id}/enrollments"
              payload: { applicant_id: "${a_id}" }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/v1/enrollments/${enr_id}/attend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 16350000, buyer_contribution_cents: 0 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "START" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/awards"
              payload: { assistance_type: "LOAN" }
              as: CaseManager
              captures: { aw_id: $.data.id }
            - call: "POST /api/v1/awards/${aw_id}/approve"
              payload: {}
              as: CaseManager
              as_user_id: "cm_approver"
            - call: "POST /api/v1/funding-allocations"
              payload: { award_id: "${aw_id}", funding_source_id: "${fs_id}", amount_cents: 3650000, lien_position: 1, expected_funding_source_version: "${fs_v}" }
              as: CaseManager
            - call: "POST /api/v1/awards/${aw_id}/closings"
              payload: { property_id: "${pr_id}", scheduled_date: "2026-08-01T00:00:00Z", window_days: 7 }
              as: ClosingCoordinator
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/closings/${cl_id}/docs-pending"
              payload: {}
              as: ClosingCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/v1/closings/${cl_id}/complete"
              payload: { final_purchase_price_cents: 20000000, final_first_mortgage_cents: 16350000 }
              as: ClosingCoordinator
            - call: "GET /api/v1/servicing-accounts?award_id=${aw_id}"
              payload: {}
              as: Servicer
              captures: { sa_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/servicing-accounts/${sa_id}/report-sale"
              payload: { sale_price_cents: 25000000, sale_date: "2027-08-01T00:00:00Z" }
              as: Servicer
          assert:
            - "ServicingAccount.${sa_id}.forgiven_amount_cents == 212917"
            - "ServicingAccount.${sa_id}.recapture_amount_cents == 3437083"
            - "Award.${aw_id}.original_disbursed_cents == 3650000"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_needs_info_review_cycle
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Application.NEEDS_INFO_to_UNDER_REVIEW
          - entities.Application.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Application entity: UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW is a genuine
          loop (revision round), not a linear pipeline. After NEEDS_INFO then resubmit, status returns to
          UNDER_REVIEW. This is a different entity than the parallel ServicingAccount machine.
        test_recipe:
          setup:
            - "OPEN program with income limit for household 4; applicant; property; application submitted and moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Cy Buyer", email: "cy@x.com", household_size: 4, annual_income_cents: 6000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /api/v1/properties"
              payload: { address: "4 Elm", county_code: "K01", purchase_price_cents: 20000000 }
              as: CaseManager
              captures: { pr_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a_id}", program_id: "${p_id}", property_id: "${pr_id}", first_mortgage_amount_cents: 15000000, buyer_contribution_cents: 100000 }
              as: CaseManager
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "START" }
              as: CaseManager
              as_user_id: "cm_reviewer"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/review"
              payload: { decision: "NEEDS_INFO", review_notes: "need paystubs" }
              as: CaseManager
              as_user_id: "cm_reviewer"
            - call: "POST /api/v1/applications/${app_id}/resubmit"
              payload: {}
              as: Applicant
              as_user_id: "${a_id}"
          assert:
            - "Application.${app_id}.status == UNDER_REVIEW"

      - name: servicing_parallel_payment_and_lifecycle
        grounds:
          - state_machines.ServicingAccount.ACTIVE_to_IN_SALE
          - entities.ServicingAccount.fields.payment_status
          - entities.ServicingAccount.fields.lifecycle_status
        distinguishing_aspect: |
          Parallel state dimensions on the ServicingAccount entity: payment_status (CURRENT<->DELINQUENT)
          evolves independently of lifecycle_status (ACTIVE->IN_SALE->CLOSED). After marking DELINQUENT
          then reporting a sale, payment_status stays DELINQUENT while lifecycle_status becomes IN_SALE -
          a different entity than the cyclic Application machine.
        test_recipe:
          setup:
            - "A funded, closed award with a ServicingAccount in lifecycle_status ACTIVE, payment_status CURRENT (SHARED_APPRECIATION, original_disbursed 5,000,000)."
          setup_api_calls:
            - call: "POST /api/v1/programs"
              payload: { name: "DPA", ami_limit_pct: 80, max_assistance_cents: 5000000, recapture_model: "SHARED_APPRECIATION", appreciation_share_pct: 30 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/v1/programs/${p_id}/income-limits"
              payload: { household_size: 4, ami_100_income_cents: 10000000 }
              as: ProgramAdmin
            - call: "POST /api/v1/funding-sources"
              payload: { name: "HOME Fund", priority: 1, total_appropriation_cents: 10000000 }
              as: ProgramAdmin
              captures: { fs_id: $.data.id, fs_v: $.data.version }
