              as: FarmManager
            - call: "POST /planting-events"
              payload: { crop_plan_id: "${pl}", input_lot_id: "${sl}", acres_planted: 40, seed_rate_per_acre: 1 }
              as: Agronomist
            - call: "POST /crop-plans/${pl}/begin-growing"
              payload: {}
              as: Agronomist
            - call: "POST /equipment-assets"
              payload: { name: "Broken", kind: "TRACTOR", hourly_cost: 50 }
              as: FarmManager
              captures: { eq: $.data.id }
          trigger:
            - call: "GET /equipment-assets/${eq}"
              payload: {}
              as: FarmManager
              captures: { st: $.data.status }
          assert:
            - "EquipmentAsset.${eq}.status == ACTIVE"
            - "ERR_EQUIPMENT_DOWN is reserved for assets whose status == DOWN (asset starts ACTIVE; this corner pins the start-state and the guard semantics)"

      - name: fk_reverse_input_lots_by_product
        claim_type: Filtered list
        grounds:
          - endpoints.GET /input-products/{id}/lots
          - entities.InputLot.fields.input_product_id
        distinguishing_aspect: "GET /input-products/{id}/lots returns the InputLot[] for that product (FK reverse-reachability)."
