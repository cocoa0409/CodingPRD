# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2426 — Federally Qualified Health Center Sliding Fee & Section 330 Compliance
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Setup chains reuse YAML
# anchors so the same empty-DB bootstrap is replayed identically everywhere:
#   BOOT_FS  = [*s_pg25, *s_pg26, *s_hc, *s_site, *s_svc, *s_chair, *s_fs,
#               *s_t1..*s_t5, *s_hcv, *s_adopt]
#   BOOT_GOV = BOOT_FS + [*s_p1, *s_iv1, *s_iv1v, *s_enc1, *s_p2, *s_iv2,
#                         *s_iv2v, *s_enc2, *s_seat2, *s_seat3]
# The logical clock default is 2026-08-01T00:00:00Z; chains only set it when a
# different instant is required.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fpg_percent_schedule_year_vs_intake_year_divergence
        grounds:
          - calculations.fpg_percent
          - calculations.discount_tier_assignment
          - entities.IncomeVerification.fields.fpg_percent
          - entities.IncomeVerification.fields.uds_fpg_percent
          - entities.IncomeVerification.fields.guideline_year_used
          - entities.IncomeVerification.fields.uds_guideline_year_used
          - entities.FeeSchedule.fields.fpg_year
          - state_machines.IncomeVerification.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Variant SCHEDULE_YEAR reads the PovertyGuideline of FeeSchedule.fpg_year (2025) while
          variant INTAKE_YEAR reads the PovertyGuideline of the calendar year of effective_date
          (2026); on the identical IncomeVerification row (income 2150000, household 2) they land on
          opposite sides of the 100 %% breakpoint — 101.90 vs 98.17 — so the sliding-fee tier says
          "partial discount" while the UDS report counts the patient at or below 100 %% of poverty.
          This instance's subject domain is patient income eligibility, not billing.
        test_recipe:
          setup:
            - "PovertyGuideline rows for 2025 (base 1560000, increment 550000) and 2026 (base 1620000, increment 570000) are published"
            - "Grantee 'Lakeside Family Health' has one IN_SCOPE SERVICE_DELIVERY site and one IN_SCOPE REQUIRED_PRIMARY service from the Notice-of-Award baseline"
            - "One NON_PATIENT board seat is SEATED so a BoardChair can adopt"
            - "An ADOPTED FeeSchedule with fpg_year 2025 covers [2026-01-01, 2027-01-01) with nominal_fee_cents 2500 and the five-band ladder 0/100/138/175/200"
            - "Patient 'Cora Diaz' (household_size 2) has a SUBMITTED IncomeVerification with declared_annual_income_cents 2150000, household_size 2, effective_date 2026-03-01"
            - "The logical clock is at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - &s_pg25
              call: "POST /poverty-guidelines"
              payload: { guideline_year: 2025, base_amount_cents: 1560000, increment_cents: 550000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - &s_pg26
              call: "POST /poverty-guidelines"
              payload: { guideline_year: 2026, base_amount_cents: 1620000, increment_cents: 570000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /health-centers"
              payload: { legal_name: "Lakeside Family Health", grant_number: "H80CS00427", pps_base_rate_cents: 18000, medicare_upper_limit_cents: 15000, nominal_fee_cap_cents: 2500 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { lhc_id: $.data.id }
            - call: "POST /health-centers/${lhc_id}/service-sites"
              payload: { site_name: "Lakeside Main", site_type: "SERVICE_DELIVERY", address_line: "40 Lake St", weekly_service_hours: 40, in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { lsite_id: $.data.id }
            - call: "POST /health-centers/${lhc_id}/service-definitions"
              payload: { service_code: "GEN_PRIMARY_CARE", service_category: "REQUIRED_PRIMARY", delivery_method: "COLUMN_I_DIRECT", in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { lsvc_id: $.data.id }
            - call: "POST /health-centers/${lhc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "FINANCE", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lchair_id: $.data.id }
            - call: "POST /health-centers/${lhc_id}/fee-schedules"
              payload: { fpg_year: 2025, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lfs_id: $.data.id }
            - call: "POST /fee-schedules/${lfs_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lt1_id: $.data.id }
            - call: "POST /fee-schedules/${lfs_id}/discount-tiers"
              payload: { tier_label: "PARTIAL_A", fpg_min_pct: 100, fpg_max_pct: 138, discount_kind: "PERCENT_DISCOUNT", discount_pct: 0.80, sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lt2_id: $.data.id }
            - call: "POST /fee-schedules/${lfs_id}/discount-tiers"
              payload: { tier_label: "PARTIAL_B", fpg_min_pct: 138, fpg_max_pct: 175, discount_kind: "PERCENT_DISCOUNT", discount_pct: 0.60, sort_order: 3 }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lt3_id: $.data.id }
            - call: "POST /fee-schedules/${lfs_id}/discount-tiers"
              payload: { tier_label: "PARTIAL_C", fpg_min_pct: 175, fpg_max_pct: 200, discount_kind: "PERCENT_DISCOUNT", discount_pct: 0.40, sort_order: 4 }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lt4_id: $.data.id }
            - call: "POST /fee-schedules/${lfs_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 200, discount_kind: "NONE", sort_order: 5 }
              as: ComplianceOfficer
              as_user_id: "co-lake"
              captures: { lt5_id: $.data.id }
            - call: "GET /health-centers/${lhc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${lchair_id}"
              captures: { lhc_v: $.data.version }
            - call: "POST /fee-schedules/${lfs_id}/adopt"
              payload: { expected_health_center_version: "${lhc_v}" }
              as: BoardChair
              as_user_id: "${lchair_id}"
            - call: "POST /patients"
              payload: { mrn: "MRN-101", full_name: "Cora Diaz", household_size: 2 }
              as: PatientServicesRep
              as_user_id: "psr-lake"
              captures: { lp_id: $.data.id, lp_v: $.data.version }
            - call: "POST /patients/${lp_id}/income-verifications"
              payload: { declared_annual_income_cents: 2150000, household_size: 2, documentation_type: "TAX_RETURN", effective_date: "2026-03-01T00:00:00Z", expected_patient_version: "${lp_v}" }
              as: PatientServicesRep
              as_user_id: "psr-lake"
              captures: { liv_id: $.data.id }
          trigger:
            - call: "POST /income-verifications/${liv_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-lake"
              captures: { liv_pct: $.data.fpg_percent, liv_uds_pct: $.data.uds_fpg_percent }
          assert:
            - "response status == 200 and data.status == VERIFIED"
            - "IncomeVerification.${liv_id}.guideline_year_used == 2025"
            - "IncomeVerification.${liv_id}.fpg_percent == 101.90"
            - "IncomeVerification.${liv_id}.uds_guideline_year_used == 2026"
            - "IncomeVerification.${liv_id}.uds_fpg_percent == 98.17"
            - "IncomeVerification.${liv_id}.assigned_discount_tier_id == ${lt2_id}"
            - "IncomeVerification.${liv_id}.assigned_tier_label == PARTIAL_A"
            - "${liv_pct} > 100.00 AND ${liv_uds_pct} < 100.00 — the two variants straddle the breakpoint on identical inputs"

      - name: patient_charge_provisional_vs_final_on_retroactive_verification
        grounds:
          - calculations.patient_charge_cents
          - calculations.patient_balance_invariant
          - entities.Encounter.fields.charge_basis
          - entities.Encounter.fields.charge_adjustment_cents
          - entities.Encounter.fields.pinned_discount_tier_id
          - state_machines.Encounter.BILLED_to_PENDING_ADJUSTMENT
          - state_machines.IncomeVerification.SUBMITTED_to_VERIFIED
          - concurrency_rules[income-verification-create-stale-patient]
        distinguishing_aspect: |
          The PROVISIONAL variant runs the income-verification selector at intake and finds nothing,
          charging the full gross 12000 with charge_basis FULL_CHARGE_UNVERIFIED; the FINAL variant
          re-runs the same selector after a retroactive verification exists and charges 2500, writing
          charge_adjustment_cents == -9500. Same Encounter row, same gross_charge_cents, two
          different results — and the subject domain is encounter billing, not income eligibility.
        test_recipe:
          setup:
            - "BOOT_FS: guidelines 2025+2026, grantee 'Riverbend Community Health' (pps_base_rate_cents 18000, medicare_upper_limit_cents 15000, nominal_fee_cap_cents 2500), one IN_SCOPE SERVICE_DELIVERY site, one IN_SCOPE REQUIRED_PRIMARY service, one SEATED NON_PATIENT board seat, and an ADOPTED FeeSchedule with fpg_year 2026 covering [2026-01-01, 2027-01-01), nominal_fee_cents 2500, five bands 0/100/138/175/200"
            - "Patient 'Dara Kim' (household_size 2) has NO IncomeVerification"
            - "One SELF_PAY Encounter dated 2026-03-01 with gross_charge_cents 12000 exists and has been BILLED with claim_reference CLM-3001"
            - "Patient.patient_balance_cents is 12000 and Encounter.charge_basis is FULL_CHARGE_UNVERIFIED"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - &s_hc
              call: "POST /health-centers"
              payload: { legal_name: "Riverbend Community Health", grant_number: "H80CS00426", pps_base_rate_cents: 18000, medicare_upper_limit_cents: 15000, nominal_fee_cap_cents: 2500 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - &s_site
              call: "POST /health-centers/${hc_id}/service-sites"
              payload: { site_name: "Main Clinic", site_type: "SERVICE_DELIVERY", address_line: "12 River Rd", weekly_service_hours: 40, in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - &s_svc
              call: "POST /health-centers/${hc_id}/service-definitions"
              payload: { service_code: "GEN_PRIMARY_CARE", service_category: "REQUIRED_PRIMARY", delivery_method: "COLUMN_I_DIRECT", in_initial_scope: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { svc_id: $.data.id }
            - &s_chair
              call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "FINANCE", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { chair_id: $.data.id }
            - &s_fs
              call: "POST /health-centers/${hc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fs_id: $.data.id }
            - &s_t1
              call: "POST /fee-schedules/${fs_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { t1_id: $.data.id }
            - &s_t2
              call: "POST /fee-schedules/${fs_id}/discount-tiers"
              payload: { tier_label: "PARTIAL_A", fpg_min_pct: 100, fpg_max_pct: 138, discount_kind: "PERCENT_DISCOUNT", discount_pct: 0.80, sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { t2_id: $.data.id }
            - &s_t3
              call: "POST /fee-schedules/${fs_id}/discount-tiers"
              payload: { tier_label: "PARTIAL_B", fpg_min_pct: 138, fpg_max_pct: 175, discount_kind: "PERCENT_DISCOUNT", discount_pct: 0.60, sort_order: 3 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { t3_id: $.data.id }
            - &s_t4
              call: "POST /fee-schedules/${fs_id}/discount-tiers"
              payload: { tier_label: "PARTIAL_C", fpg_min_pct: 175, fpg_max_pct: 200, discount_kind: "PERCENT_DISCOUNT", discount_pct: 0.40, sort_order: 4 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { t4_id: $.data.id }
            - &s_t5
              call: "POST /fee-schedules/${fs_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 200, discount_kind: "NONE", sort_order: 5 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { t5_id: $.data.id }
            - &s_hcv
              call: "GET /health-centers/${hc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { hc_v: $.data.version }
            - &s_adopt
              call: "POST /fee-schedules/${fs_id}/adopt"
              payload: { expected_health_center_version: "${hc_v}" }
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /patients"
              payload: { mrn: "MRN-003", full_name: "Dara Kim", household_size: 2 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { p3_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${p3_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 12000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc3_id: $.data.id, enc3_provisional_charge: $.data.patient_charge_cents, enc3_provisional_basis: $.data.charge_basis }
            - call: "POST /encounters/${enc3_id}/bill"
              payload: { claim_reference: "CLM-3001" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "GET /patients/${p3_id}"
              payload: {}
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { p3_v: $.data.version }
          trigger:
            - call: "POST /patients/${p3_id}/income-verifications"
              payload: { declared_annual_income_cents: 2190000, household_size: 2, documentation_type: "TAX_RETURN", effective_date: "2026-02-01T00:00:00Z", expected_patient_version: "${p3_v}" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { iv3_id: $.data.id }
            - call: "POST /income-verifications/${iv3_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
          assert:
            - "${enc3_provisional_charge} == 12000 and ${enc3_provisional_basis} == FULL_CHARGE_UNVERIFIED"
            - "IncomeVerification.${iv3_id}.fpg_percent == 100.00"
            - "Encounter.${enc3_id}.patient_charge_cents == 2500"
            - "Encounter.${enc3_id}.charge_basis == SLIDING_FEE_TIER"
            - "Encounter.${enc3_id}.charge_adjustment_cents == -9500"
            - "Encounter.${enc3_id}.pinned_discount_tier_id == ${t2_id}"
            - "Encounter.${enc3_id}.income_verification_id == ${iv3_id}"
            - "Encounter.${enc3_id}.pps_claim_status == PENDING_ADJUSTMENT"
            - "Patient.${p3_id}.patient_balance_cents == 2500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: patient_charge_nominal_floor_beats_percent_discount_mode_a
        grounds:
          - calculations.patient_charge_cents
          - entities.DiscountTier.fields.discount_kind
          - entities.DiscountTier.fields.discount_pct
          - entities.FeeSchedule.fields.nominal_fee_cents
          - entities.Encounter.fields.gross_charge_cents
          - entities.Encounter.fields.charge_basis
        distinguishing_aspect: |
          MODE (a): patient_charge_cents combines four inputs — payer_type branch, gross_charge_cents,
          the tier's discount_kind/discount_pct, and the schedule's nominal_fee_cents — through nested
          clamps min(max) at S5/S6/S7. At gross 12000 the 80 %% discount yields 2400, which the
          nominal FLOOR at S6 raises to 2500; at gross 20000 the same tier yields 4000 and the floor
          does not engage. One formula, two non-linear regimes selected by a fourth input.
        test_recipe:
          setup:
            - "BOOT_FS as in instance patient_charge_provisional_vs_final_on_retroactive_verification"
            - "Patient 'Ada Rivera' (household_size 2) has a VERIFIED IncomeVerification with declared_annual_income_cents 2190000, effective_date 2026-02-01, fpg_percent 100.00 and assigned tier PARTIAL_A (80 % discount)"
            - "The logical clock is at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - &s_p1
              call: "POST /patients"
              payload: { mrn: "MRN-001", full_name: "Ada Rivera", household_size: 2 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - &s_iv1
              call: "POST /patients/${p1_id}/income-verifications"
              payload: { declared_annual_income_cents: 2190000, household_size: 2, documentation_type: "TAX_RETURN", effective_date: "2026-02-01T00:00:00Z", expected_patient_version: "${p1_v}" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { iv1_id: $.data.id }
            - &s_iv1v
              call: "POST /income-verifications/${iv1_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${p1_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 12000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { encA_id: $.data.id, encA_charge: $.data.patient_charge_cents }
            - call: "POST /encounters"
              payload: { patient_id: "${p1_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-02T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 20000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { encB_id: $.data.id, encB_charge: $.data.patient_charge_cents }
          assert:
            - "IncomeVerification.${iv1_id}.fpg_percent == 100.00 and assigned_tier_label == PARTIAL_A"
            - "${encA_charge} == 2500  # 12000*0.20 = 2400 raised to the 2500 nominal floor at S6"
            - "Encounter.${encA_id}.charge_basis == SLIDING_FEE_TIER"
            - "Encounter.${encA_id}.pinned_discount_tier_id == ${t2_id}"
            - "${encB_charge} == 4000  # 20000*0.20 = 4000, above the nominal floor, no clamp"
            - "Encounter.${encB_id}.pps_encounter_rate_cents == 18000"
            - "Patient.${p1_id}.patient_balance_cents == 6500"

      - name: uds_composite_round_per_measure_then_average_mode_b
        grounds:
          - calculations.uds_composite_quality_rate_pct
          - calculations.uds_income_distribution
          - entities.QualityMeasureResult.fields.rate_pct
          - entities.QualityMeasureResult.fields.inclusion_status
          - entities.QualityMeasureResult.fields.meets_benchmark
          - entities.UDSReport.fields.composite_quality_rate_pct
          - entities.UDSReport.fields.included_measure_count
        distinguishing_aspect: |
          MODE (b): the scaffold pins ROUND-PER-MEASURE-THEN-AVERAGE. Measures 7/9 and 1/3 round to
          77.8 and 33.3, whose mean 55.55 rounds half-up to 55.6. The rejected pooled order
          (8/12 = 66.7) differs by 11.1 points on identical data, and the zero-denominator measure is
          excluded from the divisor rather than counted as 0.
        test_recipe:
          setup:
            - "BOOT_FS plus patient 'Ada Rivera' VERIFIED at fpg_percent 100.00 / uds_fpg_percent 100.00 and one SELF_PAY Encounter dated 2026-03-01 with gross 12000"
            - "A DRAFT UDSReport for reporting_year 2026 carries three QualityMeasureResult rows created in this order: DIABETES_A1C 7/9 benchmark 77.8, HYPERTENSION 1/3 benchmark 40.0, DENTAL_SEALANT 0/0 benchmark 50.0"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - *s_p1
            - *s_iv1
            - *s_iv1v
            - &s_enc1
              call: "POST /encounters"
              payload: { patient_id: "${p1_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 12000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc1_id: $.data.id }
            - call: "POST /health-centers/${hc_id}/uds-reports"
              payload: { reporting_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { uds_id: $.data.id }
            - call: "POST /uds-reports/${uds_id}/quality-measure-results"
              payload: { measure_code: "DIABETES_A1C", numerator: 7, denominator: 9, benchmark_pct: 77.8 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { qm1_id: $.data.id }
            - call: "POST /uds-reports/${uds_id}/quality-measure-results"
              payload: { measure_code: "HYPERTENSION", numerator: 1, denominator: 3, benchmark_pct: 40.0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { qm2_id: $.data.id }
            - call: "POST /uds-reports/${uds_id}/quality-measure-results"
              payload: { measure_code: "DENTAL_SEALANT", numerator: 0, denominator: 0, benchmark_pct: 50.0 }
