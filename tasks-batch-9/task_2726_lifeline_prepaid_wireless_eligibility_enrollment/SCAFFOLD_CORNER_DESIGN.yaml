      - name: all_samples_compliant_bubbles_claim_up_to_audit_passed
        claim_type: bubble_up
        grounds:
          - state_machines.ReimbursementClaim.status.UNDER_AUDIT_to_AUDIT_PASSED
          - state_machines.AuditSample.status.DRAWN_to_ADJUDICATED_PASS
          - calculations.audit_recoupment_amount
          - calculations.provider_ledger_reconciliation
        distinguishing_aspect: |
          The join arm bubbles UP from child to parent: the claim only reaches AUDIT_PASSED
          once no DRAWN sample is left and failed_sample_count is 0, and the pass path pays
          the full 925 with recoupment and penalty both 0 - the mirror image of the
          fail-fast arm.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-06-01T00:00:00Z."
            - "One ACTIVE provider licensed in TX with cap 50 and one non-tribal VOICE enrollment starting 2026-06-01, so the June line is round_half_up(925*30/30) = 925."
            - "Clock moved to 2026-07-02T00:00:00Z; the 2026-06 claim is drafted and filed at final_amount_cents 925."
            - "Auditor AUD-1 draws a sample of 1 - the whole pool."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143122", study_area_code: "489122", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-N6" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { prov_ver: $.data.version }
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_id}", service_month: "2026-06", expected_provider_version: "${prov_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-7" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { final_amt: $.data.final_amount_cents, covered: $.data.covered_enrollment_count }
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/audit-draw"
              payload: { sample_size: 1 }
              as: ComplianceAuditor
              as_user_id: "AUD-1"
              captures: { samp_id: "$.data[0].id", samp_rank: "$.data[0].selection_rank", samp_line: "$.data[0].claimed_line_cents" }
          trigger:
            - call: "POST /lifeline/audit-samples/${samp_id}/adjudicate"
