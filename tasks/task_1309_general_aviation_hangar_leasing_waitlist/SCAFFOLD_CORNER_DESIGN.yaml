      - name: error_open_offer_exists_and_no_active_rate_schedule
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_OFFER_EXISTS]
          - errors[ERR_NO_ACTIVE_RATE_SCHEDULE]
        distinguishing_aspect: "Two residual catalog errors are triggerable: (1) decommissioning a hangar with an OPEN offer fails ERR_OPEN_OFFER_EXISTS; (2) creating an offer for a size class with no covering ACTIVE schedule fails ERR_NO_ACTIVE_RATE_SCHEDULE."
        test_recipe:
          setup: ["Airport ACTIVE with T_HANGAR schedule; hangar H1 (T_HANGAR) with OPEN offer; hangar H2 (EXECUTIVE, no schedule) AVAILABLE with EXECUTIVE application QUEUED"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KERR", name: "Error Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_er: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_er}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_er}", hangar_code: "T-300", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_er1: $.data.id }
            - call: "POST /hangars"
              payload: { airport_id: "${ap_er}", hangar_code: "E-300", size_class: "EXECUTIVE", door_type: "HYDRAULIC"  }
              as: AirportManager
              captures: { h_er2: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_er}", applicant_name: "Er One", applicant_contact: "er1@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N450ER", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_er1: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_er}", applicant_name: "Er Two", applicant_contact: "er2@x.com", size_class_requested: "EXECUTIVE", aircraft_n_number: "N451ER", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_er2: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_er}", hangar_id: "${h_er1}", application_id: "${app_er1}"  }
              as: AirportManager
              captures: { off_er1: $.data.id }
          trigger:
            - call: "POST /hangars/${h_er1}/decommission"
              payload: {}
              as: AirportManager
              captures: { err_er1: $.data.error_id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_er}", hangar_id: "${h_er2}", application_id: "${app_er2}"  }
              as: AirportManager
              captures: { err_er2: $.data.error_id }
          assert:
            - "decommission error_id == ERR_OPEN_OFFER_EXISTS"
            - "offer without schedule error_id == ERR_NO_ACTIVE_RATE_SCHEDULE"
            - "Hangar.${h_er1}.status == OPERATIONAL"

      - name: error_delinquency_threshold_and_lease_not_delinquent
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DELINQUENCY_THRESHOLD_NOT_MET]
          - errors[ERR_LEASE_NOT_DELINQUENT]
        distinguishing_aspect: "Delinquency-eviction guards: filing while lease merely ACTIVE fails ERR_LEASE_NOT_DELINQUENT; filing while DELINQUENT but days_delinquent (4) below the threshold 30 fails ERR_DELINQUENCY_THRESHOLD_NOT_MET."
        test_recipe:
          setup:
            - "Airport ACTIVE; lease L started 2026-08-01 rate 100000"
            - "Attempt 1 at 2026-08-10: lease is DELINQUENT? At 08-10 grace ended 08-06 → 4 days overdue → DELINQUENT but days_delinquent=4 < 30 → ERR_DELINQUENCY_THRESHOLD_NOT_MET"
            - "Attempt 0 (before any overdue): lease ACTIVE → ERR_LEASE_NOT_DELINQUENT"
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KDTH", name: "Delinq Threshold Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_dt: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_dt}", size_class: "T_HANGAR", monthly_rate_cents: 100000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_dt}", hangar_code: "T-310", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_dt: $.data.id, h_dt_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_dt}", applicant_name: "Dee Thresh", applicant_contact: "dt@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N460DT", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_dt: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_dt}", hangar_id: "${h_dt}", application_id: "${app_dt}"  }
              as: AirportManager
              captures: { off_dt: $.data.id }
            - call: "POST /offers/${off_dt}/accept"
              payload: { expected_hangar_version: "${h_dt_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-DT", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N460DT", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_dt}"
              captures: { lease_dt: $.data.id }
          trigger:
            - call: "POST /leases/${lease_dt}/eviction-cases"
              payload: { reason: "DELINQUENCY" }
              as: AirportManager
              captures: { err_dt1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AirportManager
            - call: "POST /leases/${lease_dt}/eviction-cases"
              payload: { reason: "DELINQUENCY" }
              as: AirportManager
              captures: { err_dt2: $.data.error_id }
            - call: "GET /leases/${lease_dt}"
              as: AirportManager
              captures: { dt_status: $.data.status, dt_days: $.data.days_delinquent }
          assert:
            - "filing while ACTIVE error_id == ERR_LEASE_NOT_DELINQUENT"
            - "filing while DELINQUENT with days_delinquent == 4 error_id == ERR_DELINQUENCY_THRESHOLD_NOT_MET"
            - "Lease.${lease_dt}.status == DELINQUENT"
            - "Lease.${lease_dt}.days_delinquent == 4"

