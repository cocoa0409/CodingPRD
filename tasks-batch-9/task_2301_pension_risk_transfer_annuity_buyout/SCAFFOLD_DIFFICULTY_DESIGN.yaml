  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: participant_three_dimensions_advance_independently
        grounds:
          - state_machines.ParticipantRecord.participant_status
          - state_machines.ParticipantRecord.mortality_status
          - state_machines.ParticipantRecord.address_status
          - calculations.data_confidence_score
          - entities.ParticipantRecord.fields.data_status
        distinguishing_aspect: |
          One ParticipantRecord row carries three orthogonal state fields; this
          instance drives the mortality dimension around its full cycle
          (UNVERIFIED -> ALIVE_CONFIRMED -> DECEASED_CONFIRMED -> DEATH_DISPUTED ->
          ALIVE_CONFIRMED) while address_status stays pinned at terminal CONFIRMED
          and participant_status stays pinned at ASSIGNED, and it observes the
          combined data_confidence_score walking 25 -> 65 -> 85 -> 100 -> 100 ->
          80 -> 100. The DECEASED_CONFIRMED step is the interesting one: it zeroes
          both liabilities and hard-sets tranche.data_readiness_flag = BLOCKED yet
          leaves the score at 100, because DECEASED_CONFIRMED is a resolved
          mortality outcome and carries no deduction — proving the readiness gate
          and the confidence score are separate predicates.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PensionPlan authorized for BUYOUT_ONLY settlement"
            - "one DEFERRED_VESTED participant created fresh (participant_status IN_PLAN, mortality_status UNVERIFIED, address_status UNCONFIRMED, benefit_audit_status NOT_AUDITED)"
            - "one DRAFT BuyoutTranche of target_cohort DEFERRED_VESTED to hold the participant so tranche.data_readiness_flag can be observed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Norwalk Bearing Corp", plan_name: "Norwalk Hourly Plan", plan_ein: "364992017", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "N-0001", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1966-02-19" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id, score_at_creation: $.data.data_confidence_score }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "58 Pearl Street", confirmed_postal_code: "06850" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_after_address: $.data.data_confidence_score }
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v_alive: $.data.version, score_after_alive: $.data.data_confidence_score }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v_alive}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a1_id: $.data.id }
            - call: "POST /prt/benefit-audits/${a1_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans/${plan_id}/strategies"
              payload: { strategy_name: "Norwalk Deferred Buyout", strategy_type: "HYBRID_WINDOW_AND_BUYOUT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/strategies/${strategy_id}/decision"
              payload: { decision: "APPROVE", decision_rationale: "Hybrid program approved." }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/plans/${plan_id}/settlement-amendment"
              payload: { amendment_action: "ADOPT", amendment_scope: "BOTH", amendment_effective_date: "2026-09-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans/${plan_id}/tranches"
              payload: { tranche_name: "Norwalk Deferred Tranche", target_cohort: "DEFERRED_VESTED" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { t1_id: $.data.id }
            - call: "POST /prt/tranches/${t1_id}/participant-assignments"
              payload: { participant_id: "${p1_id}" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { readiness_ready: $.data.data_readiness_flag }
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_after_assignment: $.data.data_confidence_score, status_after_assignment: $.data.participant_status }
          trigger:
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "DEATH_MATCH", date_of_death: "2026-07-14" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_deceased: $.data.data_confidence_score, status_deceased: $.data.participant_status, addr_deceased: $.data.address_status }
            - call: "GET /prt/tranches/${t1_id}"
              payload: {}
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
              captures: { readiness_deceased: $.data.data_readiness_flag, tranche_acc_deceased: $.data.accounting_liability_cents }
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "DISPUTE_FILED", dispute_reason: "Surviving spouse produced a notarised affidavit contesting the SSA match." }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_disputed: $.data.data_confidence_score, status_disputed: $.data.participant_status, addr_disputed: $.data.address_status }
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "DISPUTE_RESOLVED_ALIVE" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { score_restored: $.data.data_confidence_score, status_restored: $.data.participant_status, addr_restored: $.data.address_status }
          assert:
            - "at creation ParticipantRecord.${p1_id}.data_confidence_score == 25 and data_status == NEEDS_REVIEW (100 - 40 address - 20 mortality - 15 audit)"
            - "after the address search data_confidence_score == 65 and data_status == NEEDS_REVIEW"
            - "after the NO_MATCH check data_confidence_score == 85 and data_status == CLEAN (85 >= 80), with only the 15-point open-audit deduction outstanding"
            - "after ACCEPT_AS_IS resolution ParticipantRecord.${p1_id}.data_confidence_score == 100 and data_status == CLEAN"
            - "after DEATH_MATCH ParticipantRecord.${p1_id}.mortality_status == DECEASED_CONFIRMED, data_confidence_score == 100 and data_status == CLEAN"
            - "after DEATH_MATCH ParticipantRecord.${p1_id}.accounting_liability_cents == 0 and settlement_liability_cents == 0"
            - "after DEATH_MATCH BuyoutTranche.${t1_id}.data_readiness_flag == BLOCKED and BuyoutTranche.${t1_id}.accounting_liability_cents == 0, i.e. readiness is BLOCKED while the score is a perfect 100"
