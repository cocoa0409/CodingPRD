            - "Gap exactly 600: HTTP 201 and CrewCall.${call_b_id}.turnaround_minutes_before_call == 600"
            - "Third call at 2026-08-16T16:00:00Z while call B stands: HTTP 422 with error_id == ERR_CREW_TURNAROUND_VIOLATION (the reference is B's 2026-08-16T10:00:00Z release, gap 360, not A's 20-hour-old release)"
            - "CrewCall.${call_b_id}.status == CANCELLED after the cancel"
            - "The same third call retried after the cancellation: HTTP 201 and CrewCall.${call_c_id}.turnaround_minutes_before_call == 1200 (measured from A's release again)"
            - "Production.${prod_b_id}.labor_committed_cents == 0 after the cancellation and Production.${prod_c_id}.labor_committed_cents == 36000"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: crew_call_cancellation_restores_labor_budget_exactly
        grounds:
          - calculations.production_labor_commitment
          - entities.Production.fields.labor_committed_cents
          - entities.Production.fields.labor_available_cents
          - endpoints[POST /broadcast-ops/crew-calls/{id}/cancel].side_effects
        distinguishing_aspect: |
          Conserved quantity: money - labor_budget_total_cents == labor_committed_cents +
          labor_available_cents must hold before, during and after the compensating cancellation, with
          the committed figure returning to exactly 0 (not 0-ish, and not left at 104000 with a
          separate "cancelled" bucket). The provisional total stays on the cancelled row as a record,
          which is what makes double-counting tempting.
        test_recipe:
          setup:
            - "One TIER_3 production with labor_budget_total_cents = 2000000."
            - "One STAFF member at 9000 cents/h; one 600-minute call (16:00 -> 02:00) provisional 104000, ACCEPTED."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version, committed0: $.data.labor_committed_cents, available0: $.data.labor_available_cents }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T16:00:00Z", scheduled_release_utc: "2026-08-16T02:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id, prov1: $.data.provisional_total_cents }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { committed1: $.data.labor_committed_cents, available1: $.data.labor_available_cents }
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/cancel"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call_status: $.data.status }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { committed2: $.data.labor_committed_cents, available2: $.data.labor_available_cents }
          assert:
            - "At creation: labor_committed_cents == 0 and labor_available_cents == 2000000"
            - "After the accepted call: labor_committed_cents == 104000 and labor_available_cents == 1896000 (sum == 2000000)"
            - "After the cancellation: labor_committed_cents == 0 and labor_available_cents == 2000000 (sum == 2000000, no residue)"
            - "CrewCall.${call1_id}.status == CANCELLED with provisional_total_cents still 104000 and settled_total_cents == null"
            - "CrewMember.${cm1_id}.lifetime_meal_penalty_units == 0 (only RELEASED calls accrue)"
            - "Production.${prod_id}.labor_variance_cents == 0 (nothing has settled)"

      - name: path_booking_release_restores_committed_bandwidth_exactly
        grounds:
          - calculations.path_committed_mbps_total
          - entities.TransmissionPath.fields.committed_mbps_total
          - entities.TransmissionPath.fields.active_booking_count
          - endpoints[POST /broadcast-ops/path-bookings/{id}/release].side_effects
        distinguishing_aspect: |
          A different conserved quantity on a different entity: bandwidth on a FIBER path. Two
          bookings of 120 and 80 Mbps put committed_mbps_total at exactly 200; releasing the 120 one
          returns it to exactly 80 (not 0, and not left at 200), releasing the second returns it to 0
          with active_booking_count 0, and the capacity freed is immediately re-bookable at the full
          300 Mbps - proving the decrement is a real reversal rather than a soft flag.
        test_recipe:
          setup:
            - "One FIBER path FIB-A: capacity_mbps 300, PRIMARY_ELIGIBLE."
            - "Two TIER_3 productions A and B, each PLANNED."
            - "Booking A: 120 Mbps over 2026-08-15T16:00:00Z .. 23:00:00Z (PRIMARY). Booking B: 80 Mbps over the same window (PRIMARY on its own production)."
          setup_api_calls:
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-A", path_type: "FIBER", carrier_code: "CARR1", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_a_id: $.data.id, committed0: $.data.committed_mbps_total, count0: $.data.active_booking_count }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a_id: $.data.id, pva: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbour Dome", venue_power_capacity_amps: 400, venue_roof_type: "FIXED", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b_id: $.data.id, pvb: $.data.version }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_a_id}", path_id: "${path_a_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T16:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 120, expected_production_version: "${pva}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_a_id: $.data.id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_b_id}", path_id: "${path_a_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T16:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 80, expected_production_version: "${pvb}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_b_id: $.data.id }
            - call: "GET /broadcast-ops/transmission-paths/${path_a_id}"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { committed1: $.data.committed_mbps_total, count1: $.data.active_booking_count }
          trigger:
            - call: "POST /broadcast-ops/path-bookings/${booking_a_id}/release"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { a_status: $.data.status }
            - call: "GET /broadcast-ops/transmission-paths/${path_a_id}"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { committed2: $.data.committed_mbps_total, count2: $.data.active_booking_count }
            - call: "POST /broadcast-ops/path-bookings/${booking_b_id}/release"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { b_status: $.data.status }
            - call: "GET /broadcast-ops/transmission-paths/${path_a_id}"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { committed3: $.data.committed_mbps_total, count3: $.data.active_booking_count }
          assert:
            - "At creation: committed_mbps_total == 0 and active_booking_count == 0"
            - "After both bookings: committed_mbps_total == 200 and active_booking_count == 2"
            - "After releasing the 120 Mbps booking: committed_mbps_total == 80 and active_booking_count == 1"
            - "PathBooking.${booking_a_id}.status == RELEASED and PathBooking.${booking_b_id}.status == RESERVED"
            - "After releasing the 80 Mbps booking: committed_mbps_total == 0 and active_booking_count == 0"
            - "TransmissionPath.${path_a_id}.capacity_mbps is still 300 (capacity is contractual and never mutated by bookings)"
