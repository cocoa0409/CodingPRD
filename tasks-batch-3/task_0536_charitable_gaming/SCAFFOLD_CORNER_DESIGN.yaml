# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Charitable Gaming License — breadth probe over §1.1-§1.7
# Clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: organization_create_returns_computed_eligibility
        claim_type: Computed Fields
        grounds: [calculations.eligibility_status, calculations.months_active, entities.Organization.fields.eligibility_status]
        distinguishing_aspect: "A 501C3 org incorporated 2020-01-01 read at clock 2026-05-01 has months_active == 76 and eligibility_status == ELIGIBLE, computed server-side."
        test_recipe:
          setup: ["Empty DB, clock at default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Alpha", ein: "20-2020201", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
          trigger:
            - { call: "GET /organizations/${org_id}", payload: {}, as: Regulator }
          assert:
            - "Organization.${org_id}.months_active == 76"
            - "Organization.${org_id}.eligibility_status == ELIGIBLE"

      - name: organization_recent_incorporation_ineligible
        claim_type: Computed Fields
        grounds: [calculations.eligibility_status, entities.Organization.fields.months_active]
        distinguishing_aspect: "A 501C3 org incorporated 2025-01-01 read at clock 2026-05-01 has months_active == 16 (< 36) and eligibility_status == INELIGIBLE."
        test_recipe:
          setup: ["Empty DB, clock at default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Beta", ein: "21-2121212", nonprofit_type: "501C3", incorporation_date: "2025-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
          trigger:
            - { call: "GET /organizations/${org_id}", payload: {}, as: Regulator }
          assert:
            - "Organization.${org_id}.months_active == 16"
            - "Organization.${org_id}.eligibility_status == INELIGIBLE"

      - name: organization_default_good_standing_applied
        claim_type: Defaults
        grounds: [entities.Organization.fields.good_standing]
        distinguishing_aspect: "Omitting good_standing defaults it to true, so a qualifying long-lived 501C3 is ELIGIBLE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Gamma", ein: "22-2222223", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
          trigger:
            - { call: "GET /organizations/${org_id}", payload: {}, as: Regulator }
          assert:
            - "Organization.${org_id}.good_standing == true"
            - "Organization.${org_id}.eligibility_status == ELIGIBLE"

      - name: months_active_recomputed_after_clock_advance
        claim_type: Computed Fields
        grounds: [calculations.months_active]
        distinguishing_aspect: "After advancing the clock to 2027-01-01, GET on an org incorporated 2020-01-01 reports months_active == 84 (recomputed against the clock, not frozen at create time)."
        test_recipe:
          setup: ["Org incorporated 2020-01-01 created at default clock"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Delta", ein: "23-2323232", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: Regulator }
          trigger:
            - { call: "GET /organizations/${org_id}", payload: {}, as: Regulator }
          assert:
            - "Organization.${org_id}.months_active == 84"

      - name: org_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Organization.fields.ein, "validations[priority=5]"]
        distinguishing_aspect: "Creating an organization without the required ein field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /organizations", payload: { legal_name: "NoEin", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", state_code: "CA" }, as: Regulator, captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_VALIDATION"

      - name: license_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.License.fields.license_type, "validations[priority=5]"]
        distinguishing_aspect: "POST /licenses with license_type 'POKER' (not in {BINGO,RAFFLE,COMBINED}) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Eligible org exists"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Epsilon", ein: "24-2424242", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
          trigger:
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "POKER", contact_email: "z@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_VALIDATION"

  - section: calculations
    instances:
      - name: annual_prize_limit_by_type_raffle
        claim_type: Constants Applied
        grounds: [calculations.annual_prize_limit, entities.License.fields.annual_prize_limit_cents]
        distinguishing_aspect: "An ACTIVE RAFFLE license has annual_prize_limit_cents == 2000000 and prize_allowance_remaining_cents == 2000000 (ANNUAL_PRIZE_LIMIT_CENTS[RAFFLE])."
        test_recipe:
          setup: ["Eligible org with a RAFFLE license created, submitted and approved"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Zeta", ein: "25-2525252", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "RAFFLE", contact_email: "aa@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
          trigger:
            - { call: "GET /licenses/${lic_id}", payload: {}, as: Regulator }
          assert:
            - "License.${lic_id}.annual_prize_limit_cents == 2000000"
            - "License.${lic_id}.prize_allowance_remaining_cents == 2000000"

      - name: charitable_use_ratio_computed
        claim_type: Correct Result
        grounds: [calculations.proceeds_distribution, entities.FinancialReport.fields.charitable_use_ratio]
        distinguishing_aspect: "For net_proceeds 600000 and charitable_use 480000, charitable_use_ratio == 0.8 (4 dp)."
        test_recipe:
          setup: ["ACTIVE BINGO license; occasion REPORTED gross 1000000/prizes 300000/expenses 100000 (net 600000)"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Eta", ein: "26-2626262", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "bb@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-05T18:00:00Z", scheduled_end: "2026-06-05T22:00:00Z", venue_name: "Hall", planned_gross_cents: 1000000, planned_prize_pool_cents: 300000, planned_expenses_cents: 100000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 1000000, prizes_paid_cents: 300000, expenses_cents: 100000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /financial-reports", payload: { license_id: "${lic_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", charitable_use_cents: 480000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { fr_id: "$.data.id" } }
          assert:
            - "FinancialReport.${fr_id}.net_proceeds_cents == 600000"
            - "FinancialReport.${fr_id}.charitable_use_ratio == 0.8"

      - name: financial_report_empty_period_zero_net
        claim_type: Correct Result
        grounds: [calculations.proceeds_distribution, entities.FinancialReport.fields.net_proceeds_cents]
        distinguishing_aspect: "A financial report over a period with zero REPORTED occasions has net_proceeds_cents == 0, charitable_minimum_cents == 0, charitable_use_ratio == 0 (empty-set edge)."
        test_recipe:
          setup: ["ACTIVE BINGO license with no reported occasions"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Theta", ein: "27-2727272", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "cc@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
          trigger:
            - { call: "POST /financial-reports", payload: { license_id: "${lic_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z", charitable_use_cents: 0 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { fr_id: "$.data.id" } }
          assert:
            - "FinancialReport.${fr_id}.net_proceeds_cents == 0"
            - "FinancialReport.${fr_id}.charitable_minimum_cents == 0"
            - "FinancialReport.${fr_id}.charitable_use_ratio == 0"

  - section: state_machines
    instances:
      - name: hold_already_held_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Occasion.SCHEDULED_to_HELD]
        distinguishing_aspect: "Holding an occasion that is already HELD returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["ACTIVE BINGO license; one occasion HELD"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Iota", ein: "28-2828282", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "dd@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 100000, planned_prize_pool_cents: 20000, planned_expenses_cents: 5000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Occasion.${occ_id}.status == HELD"

      - name: cancel_reported_occasion_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Occasion.HELD_to_REPORTED, state_machines.Occasion.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a REPORTED (terminal) occasion returns ERR_INVALID_STATE (409); cancel is defined only from SCHEDULED."
        test_recipe:
          setup: ["ACTIVE BINGO license; occasion HELD then REPORTED"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Kappa", ein: "29-2929292", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "ee@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 100000, planned_prize_pool_cents: 20000, planned_expenses_cents: 5000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
            - { call: "POST /occasions/${occ_id}/hold", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /occasions/${occ_id}/report", payload: { gross_receipts_cents: 90000, prizes_paid_cents: 20000, expenses_cents: 5000 }, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /occasions/${occ_id}/cancel", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Occasion.${occ_id}.status == REPORTED"

      - name: approve_draft_license_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.License.DRAFT_to_SUBMITTED, state_machines.License.SUBMITTED_to_ACTIVE]
        distinguishing_aspect: "Approving a DRAFT (never submitted) license returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Eligible org; license created but left in DRAFT"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Lambda", ein: "30-3030303", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "ff@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
          trigger:
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator, captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
            - "License.${lic_id}.status == DRAFT"

      - name: submit_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.License.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting a license that is already SUBMITTED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Eligible org; license SUBMITTED"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Mu", ein: "31-3131313", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "gg@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
          trigger:
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"

      - name: clock_advance_expires_active_license_and_cancels_occasion
        claim_type: Valid Transition
        grounds: [state_machines.License.ACTIVE_to_EXPIRED, state_machines.Occasion.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Advancing the clock to 2027-06-01 (past expiration 2027-05-01) transitions the ACTIVE license to EXPIRED and cascades its SCHEDULED occasion to CANCELLED."
        test_recipe:
          setup: ["ACTIVE BINGO license approved at default clock (expiration 2027-05-01); one SCHEDULED occasion"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Nu", ein: "32-3232323", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "hh@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T18:00:00Z", scheduled_end: "2026-06-01T22:00:00Z", venue_name: "Hall", planned_gross_cents: 100000, planned_prize_pool_cents: 20000, planned_expenses_cents: 5000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { occ_id: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: Regulator }
          assert:
            - "License.${lic_id}.status == EXPIRED"
            - "Occasion.${occ_id}.status == CANCELLED"

      - name: renewal_approve_reactivates_expired_license
        claim_type: Valid Transition
        grounds: [state_machines.Renewal.REQUESTED_to_APPROVED, state_machines.License.EXPIRED_to_ACTIVE]
        distinguishing_aspect: "Approving a REQUESTED renewal on an EXPIRED license sets Renewal.status == APPROVED and License.status back to ACTIVE."
        test_recipe:
          setup: ["ACTIVE BINGO license, expired via clock to 2027-06-01, then a REQUESTED renewal created"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Xi", ein: "33-3434343", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "ii@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: Regulator }
            - { call: "GET /licenses/${lic_id}", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_v: "$.data.version" } }
            - { call: "POST /renewals", payload: { license_id: "${lic_id}", requested_term_months: 12, expected_license_version: "${lic_v}" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { ren_id: "$.data.id" } }
          trigger:
            - { call: "POST /renewals/${ren_id}/approve", payload: {}, as: Regulator }
          assert:
            - "Renewal.${ren_id}.status == APPROVED"
            - "License.${lic_id}.status == ACTIVE"

  - section: validations
    instances:
      - name: occasion_end_before_start_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_OCCASION_TIME_INVALID]"]
        distinguishing_aspect: "POST /occasions with scheduled_end <= scheduled_start returns ERR_OCCASION_TIME_INVALID (422)."
        test_recipe:
          setup: ["ACTIVE BINGO license"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Omicron", ein: "34-3535353", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "jj@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
          trigger:
            - { call: "POST /occasions", payload: { license_id: "${lic_id}", occasion_type: "BINGO", scheduled_start: "2026-06-01T22:00:00Z", scheduled_end: "2026-06-01T18:00:00Z", venue_name: "Hall", planned_gross_cents: 100000, planned_prize_pool_cents: 20000, planned_expenses_cents: 5000 }, as: OrgOfficer, as_user_id: "${org_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "$.data.error_id == ERR_OCCASION_TIME_INVALID"

      - name: report_period_end_before_start_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_REPORT_PERIOD_INVALID]"]
        distinguishing_aspect: "POST /financial-reports with period_end <= period_start returns ERR_REPORT_PERIOD_INVALID (422)."
        test_recipe:
          setup: ["ACTIVE BINGO license"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Pi", ein: "35-3636363", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
