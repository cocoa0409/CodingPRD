            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager, captures: { avail: $.data.available_lbs, tot: $.data.contracted_total_lbs } }
            - { call: "GET /api/allocations?contract_id=${c1}", payload: {}, as: ContractManager, captures: { a1: "$.data[0].allocated_lbs", s1: "$.data[0].shortfall_lbs" } }
