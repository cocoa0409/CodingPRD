            - call: "POST /blinds/sample-checkouts"
              payload: { sample_kit_id: "${kc}", consultation_id: "${ca}", hold_start_at: "2026-08-01T12:00:00.000Z", hold_end_at: "2026-08-12T12:00:00.000Z" }
