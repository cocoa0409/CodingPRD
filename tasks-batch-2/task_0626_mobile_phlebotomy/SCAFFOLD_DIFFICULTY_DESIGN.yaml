          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingAgent
          assert:
            - "Invoice.${inv_id}.lab_fee_cents == 5500"
            - "Invoice.${inv_id}.convenience_fee_cents == 4500"
            - "Invoice.${inv_id}.redraw_waiver_cents == 1000"
            - "Invoice.${inv_id}.total_cents == 9000"

      - name: redraw_waiver_eval_order_pin_mode_c
        grounds:
          - calculations.invoice_insurance_total
          - entities.Invoice.fields.redraw_waiver_cents
          - entities.Invoice.fields.convenience_fee_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency with pinned evaluation order — redraw_waiver_cents =
          min(convenience_fee_cents, redraw_count*2500) is capped by the convenience fee it is then
          subtracted from. With one redraw the waiver is min(2500,2500)=2500 and total_cents floors to 0;
          computing the waiver before the convenience fee, or before the cap, yields a different number.
        test_recipe:
          setup:
            - "Panel CMP14 (3 tubes, base 4000), partner Quest (stat_surcharge 1500)"
            - "STAT INSURANCE order: first draw fully QNS-rejected (redraw_count 1), re-drawn and RESULTED"
