  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Instance 1 pairs ProcedureBooking with EndoscopeAsset: the same start call is
  # rejected from three different scope states and accepted from the fourth,
  # with the booking itself never changing. Instance 2 pairs DeviceDispense with
  # DiagnosticStudy: the dispense depends both on the study's lifecycle state and
  # on the recommendation that state produced. Different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_start_gated_by_endoscope_readiness
        grounds:
          - state_machines.EndoscopeAsset
          - state_machines.ProcedureBooking.SCHEDULED_to_IN_PROGRESS
          - errors.ERR_SCOPE_NOT_READY
          - segregation_of_duties.reprocessing_run_continuity
          - endpoints[POST /procedure-bookings/{bookingId}/start]
        distinguishing_aspect: |
          Entity pair (ProcedureBooking, EndoscopeAsset). The gate is not a property of the
          booking at all: booking B2 sits in SCHEDULED with every one of its own preconditions
          satisfied for the whole test, and the identical start call flips between 409 and 200
          purely as the referenced scope walks READY -> IN_USE -> SOILED -> REPROCESSING ->
          READY. Three distinct rejecting scope states are probed, which no single-state test
          would separate. Distinct from the sibling instance's (DeviceDispense,
          DiagnosticStudy) pair.
        test_recipe:
          setup:
            - "PayerPolicy CROSS-2999 and one adult Patient, so supervision_tier is STANDARD and requires_physician_presence is false on both bookings."
            - "One EndoscopeAsset SC-0004 registered READY with cycle_count 0, last_reprocessed_at null and hld_expires_at null, so the shelf-life rule never fires."
            - "Two SCHEDULED DIAGNOSTIC_ENDOSCOPY bookings on that scope: B1 2026-08-03T09:00:00Z..10:00:00Z and B2 2026-08-03T11:00:00Z..12:00:00Z. B2's start is 60 minutes after B1's end, clearing both the inclusive-endpoint rule and the 45-minute turnaround buffer, so B2 is creatable and its only obstacle is scope state."
            - "Both bookings name physician_user_id u_ent_1 and every start call is issued as u_ent_1, so ERR_PHYSICIAN_MISMATCH never fires."
            - "Clock stays at its default 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Crosslink Health", plan_code: "CROSS-2999", requires_prior_auth: true }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10131", full_name: "Endoscopy Patient", date_of_birth: "1968-12-11" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /endoscopes"
              payload: { serial_number: "SC-0004", model: "ENF-V4 rhinolaryngoscope" }
              as: PracticeAdmin
              captures: { scope_id: $.data.id, scope_status_0: $.data.status }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T10:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { b1: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T12:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /procedure-bookings/${b1}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { b1_status: $.data.status }
            - call: "POST /procedure-bookings/${b2}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings/${b1}/complete"
              payload: { devices_used_count: 0 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings/${b2}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /endoscopes/${scope_id}/reprocessing-start"
              payload: {}
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
            - call: "POST /procedure-bookings/${b2}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /endoscopes/${scope_id}/reprocessing-completion"
              payload: { leak_test_passed: true }
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
              captures: { scope_status_r: $.data.status, cycles: $.data.cycle_count, mec_due: $.data.mec_test_due }
            - call: "POST /procedure-bookings/${b2}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { b2_status: $.data.status }
          assert:
            - "Start of B1 succeeds: ProcedureBooking.${b1}.status == \"IN_PROGRESS\", EndoscopeAsset.${scope_id}.status == \"IN_USE\" and last_used_by_user_id == \"u_ent_1\""
            - "Scope IN_USE — start of B2 returns HTTP 409 with error.id == \"ERR_SCOPE_NOT_READY\""
            - "After completing B1: EndoscopeAsset.${scope_id}.status == \"SOILED\" and hld_expires_at == null"
            - "Scope SOILED — the identical start of B2 returns HTTP 409 with error.id == \"ERR_SCOPE_NOT_READY\""
            - "Scope REPROCESSING (after reprocessing-start) — the identical start of B2 returns HTTP 409 with error.id == \"ERR_SCOPE_NOT_READY\" for the third time"
            - "After reprocessing-completion by the same tech u_tech_1: EndoscopeAsset.${scope_id}.status == \"READY\", cycle_count == 1, last_reprocessed_at == \"2026-08-01T00:00:00Z\", hld_expires_at == \"2026-08-08T00:00:00Z\", mec_test_due == false ((1 + 1) mod 10 != 0), consecutive_mec_failures == 0"
            - "Scope READY — the identical start of B2 now succeeds: ProcedureBooking.${b2}.status == \"IN_PROGRESS\" and EndoscopeAsset.${scope_id}.status == \"IN_USE\""
            - "ProcedureBooking.${b2}.status was \"SCHEDULED\" before every one of the three rejections and its version never incremented across them — the booking row itself was never the obstacle"

      - name: dispense_gated_by_study_state_then_recommendation
        grounds:
          - state_machines.DiagnosticStudy
          - calculations.study_recommendation
          - errors.ERR_STUDY_STATE_INVALID
          - errors.ERR_DEVICE_TYPE_NOT_RECOMMENDED
          - segregation_of_duties.study_performer_is_not_interpreter
          - endpoints[POST /device-dispenses]
        distinguishing_aspect: |
          Entity pair (DeviceDispense, DiagnosticStudy) — different from the sibling instance's
          (ProcedureBooking, EndoscopeAsset). The dependency has two layers on one referenced
          row: first the study's lifecycle state (a dispense against an ORDERED study is a
          priority-7 rejection), then the *content* the INTERPRETED state produced (a
          HEARING_AID against an OBSERVATION recommendation is a priority-12 rejection). The
          same request body succeeds only against a second study whose pta_db_hl crossed the
          40 dB line. Every attempt carries a freshly read expected_study_version, so the
          412 OCC rule never masks the state rule.
        test_recipe:
          setup:
            - "PayerPolicy AUDX-2999 with device_trial_days 30, restock_fee_bps 1500 and restock_fee_floor_cents 12500; one adult Patient on that plan."
            - "One HEARING_AID SupplyLot with quantity_received 5, so inventory never binds."
            - "Study A: AUDIOMETRY in status ORDERED with version 1 — no results, no recommendation."
            - "Study B: a second AUDIOMETRY for the same patient, taken to INTERPRETED with pta_db_hl 55.0, so recommendation is HEARING_AID (55 >= PTA_HEARING_AID_DB 40)."
            - "Results are recorded by u_aud_1 and interpretations by u_aud_2, satisfying study_performer_is_not_interpreter."
            - "Clock stays at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Audio Mutual", plan_code: "AUDX-2999", requires_prior_auth: true, device_trial_days: 30, restock_fee_bps: 1500, restock_fee_floor_cents: 12500 }
