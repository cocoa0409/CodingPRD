              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${vC}", inspection_id: "${iC}", expected_vehicle_version: "${vC_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-C" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-C" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-C" }, { doc_type: "RECONDITIONING_INVOICE", reference: "RI-C" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${vC}", inspection_id: "${iC}", expected_vehicle_version: "${vC_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-C" }, { doc_type: "TITLE_HISTORY_REPORT", reference: "THR-C2" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-C" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-C" }] }
