  # ===========================================================================
  # SECTION 6 - ERRORS
  # ===========================================================================
  - section: errors
    instances:

      - name: every_error_response_carries_a_uniform_envelope
        claim_type: error_triggerability
        grounds:
          - section 1.0 response envelope contract
          - errors[ERR_INVALID_REQUEST], errors[ERR_ISSUER_NOT_FOUND], errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Errors raised at three different ladder priorities - role (2), path existence (4) and
          schema (5) - must all come back in the same shape: success false, a non-empty
          data.error_id string and a non-empty data.message, with the documented HTTP status.
          An implementation that returns a bare 500, or that puts the code at the top level
          instead of under data, fails uniformly across the catalogue.
        test_recipe:
          setup:
            - "No fixtures are required beyond an empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: MunicipalAdvisor
              as_user_id: any_firm
              captures: { role_error: $.data.error_id }
            - call: "GET /bond-offerings/issuers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { notfound_error: $.data.error_id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH" }
              as: ComplianceOfficer
              captures: { schema_error: $.data.error_id }
          assert:
            - "first call: HTTP 403, success false, data.error_id == 'ERR_UNAUTHORIZED', data.message non-empty"
            - "second call: HTTP 404, success false, data.error_id == 'ERR_ISSUER_NOT_FOUND', data.message non-empty"
            - "third call: HTTP 422, success false, data.error_id == 'ERR_INVALID_REQUEST', data.message non-empty"
            - "no response body carries a top-level error_id or a stack trace"

      - name: path_existence_error_precedes_the_body_schema_error
        claim_type: error_triggerability
        grounds:
          - validations[path-resource-exists] (priority 4) and validations[request-shape-valid] (priority 5)
          - errors[ERR_DEAL_NOT_FOUND], errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A request that is wrong in BOTH dimensions - unknown deal in the path AND a garbage
          body - must report the 404 ERR_DEAL_NOT_FOUND, because path existence sits at priority
          4 and schema validation at priority 5. An implementation that validates the body first
          answers 422 and hides the missing parent.
        test_recipe:
          setup:
            - "One real DRAFT deal exists so the same malformed body can be shown to produce the 422 on a resolvable path."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/00000000-0000-4000-8000-000000000000/maturity-tranches"
              payload: { sequence_number: 0 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { first_error: $.data.error_id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 0 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { second_error: $.data.error_id }
          assert:
            - "first call: HTTP 404 with data.error_id == 'ERR_DEAL_NOT_FOUND' despite the body being invalid too"
            - "second call: HTTP 422 with data.error_id == 'ERR_INVALID_REQUEST', confirming the very same body IS schema-invalid"
            - "GET /bond-offerings/deals/${deal_id}/maturity-tranches returns 0 rows"

  # ===========================================================================
  # SECTION 7 - RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: missing_auth_header_is_rejected_before_the_role_check
        claim_type: exclusive_operations
        grounds:
          - validations[auth-header-present] (priority 1) and validations[auth-role-permits-operation] (priority 2)
          - errors[ERR_UNAUTHENTICATED], errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          A request with NO X-User-Role at all is 401 ERR_UNAUTHENTICATED, whereas a request that
          presents a real but wrong role is 403 ERR_UNAUTHORIZED, and a request presenting an
          unknown role string is also 401 - the ladder's priority 1 sits strictly above priority 2
          so an unauthenticated call to a ComplianceOfficer-only endpoint must never come back as
          403.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: "(no X-User-Role or X-User-Id header sent)"
              captures: { unauth_error: $.data.error_id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: "(X-User-Role: BondTrustee, a role that does not exist in section 1.7)"
              captures: { unknown_role_error: $.data.error_id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: BondCounsel
              as_user_id: bc_drafter
              captures: { role_error: $.data.error_id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { firm_id: $.data.id }
          assert:
            - "first call: HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED'"
            - "second call: HTTP 401 with data.error_id == 'ERR_UNAUTHENTICATED', not 403"
            - "third call: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "fourth call: HTTP 201 and Firm.${firm_id}.msrb_registration_id == 'AU0001', so exactly one firm exists at the end"

      - name: firm_registration_is_exclusive_to_the_compliance_officer
