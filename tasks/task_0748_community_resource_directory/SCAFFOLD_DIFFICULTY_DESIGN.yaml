              as: PlatformAdmin
              captures: { prog7_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "G", date_of_birth: "1996-01-15", monthly_income_cents: 400000, home_lat: 40.00, home_lng: -74.00, preferred_language: "EN", accessibility_needs: [] }
              as: Caseworker
              captures: { c7_id: $.data.id }
            - call: "POST /clients/${c7_id}/intakes"
              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i7_id: $.data.id }
            - call: "POST /intakes/${i7_id}/screen"
              payload: {}
              as: Caseworker
