        distinguishing_aspect: "Trips running 420..468 and 440..470 genuinely intersect, so assigning both to one driver returns 409 ERR_DRIVER_BLOCK_CONFLICT even though the second trip uses a different vehicle with no block conflict of its own."
        test_recipe:
