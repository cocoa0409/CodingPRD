      - name: peer_roles_screening_writers_are_scoped_to_the_types_they_own
        claim_type: peer_roles
        grounds:
          - roles.BackgroundInvestigator
          - roles.MedicalExaminer
          - roles.TrainingCoordinator
          - validations[priority 3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /screening-records/{screeningRecordId}/findings]
          - endpoints[POST /screening-records/{screeningRecordId}/adjudicate]
        distinguishing_aspect: "All three roles appear in the SAME roles list on both screening endpoints, so a naive membership check lets any of them write any screening. Priority 3 additionally scopes the operation by the record's screening_type: BACKGROUND belongs to the investigator, MEDICAL and PSYCHOLOGICAL to the examiner, PHYSICAL_FITNESS to the coordinator. The examiner owning TWO types is the part a per-role-single-type implementation gets wrong."
