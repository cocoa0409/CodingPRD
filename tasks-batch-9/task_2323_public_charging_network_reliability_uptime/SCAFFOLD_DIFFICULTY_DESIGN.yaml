  # ===========================================================================
  # RULE 3 — Non-linear state-machine shape on DIFFERENT entities
  #   instance 1: Station.status cycle (OPERATIONAL <-> SUSPENDED), two sources
  #   instance 2: ChargingPort parallel dimensions (service_state x maintenance_state)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: station_status_cycles_operational_suspended_operational_with_distinct_sources
        grounds:
          - state_machines.Station.transitions.OPERATIONAL_to_SUSPENDED
          - state_machines.Station.transitions.SUSPENDED_to_OPERATIONAL
          - entities.Station.fields.suspension_source
          - entities.Station.fields.out_of_service_port_count
          - endpoints[POST /stations/{station_id}/status-transitions]
          - endpoints[POST /maintenance-dispatches/{dispatch_id}/complete]
        distinguishing_aspect: |
          Station.status is CYCLIC: it traverses OPERATIONAL -> SUSPENDED -> OPERATIONAL
          twice in one test, once driven automatically by a CRITICAL fault
          (suspension_source AUTOMATIC, resumed only by the port returning to service) and
          once driven manually by the operator (suspension_source MANUAL, resumable only by
          an explicit status-transition). The two legs are distinguishable by
          suspension_source, so an automatic resume can never silently undo an operator
          suspension. The non-linearity lives on the Station entity — a different entity
          from the ChargingPort parallel-dimension instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-12T08:00:00Z."
            - "HostSite HS-CY-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-CY-1 (DCFC_150, declared_port_count 1) in status OPERATIONAL, suspension_source NONE, out_of_service_port_count 0."
            - "ChargingPort DS-CY-1 CERTIFIED, service_state IN_SERVICE, maintenance_state NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-12T08:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-CY-1", host_org_name: "Harbor Point Realty", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-CY-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-CY-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-CRIT-02", fault_class: "CRITICAL", detected_at: "2026-06-12T08:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "CRITICAL" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-12T09:00:00Z", window_end_at: "2026-06-12T15:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "EN_ROUTE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /maintenance-dispatches/${d_id}/progress"
              payload: { event: "ARRIVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-12T14:00:00Z" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches/${d_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "SUSPENDED" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "OPERATIONAL" }
              as: NetworkOperator
          assert:
            - "after the CRITICAL outage was created: Station.${st_id}.status == SUSPENDED and Station.${st_id}.suspension_source == AUTOMATIC and Station.${st_id}.out_of_service_port_count == 1"
            - "after complete: Station.${st_id}.status == OPERATIONAL and Station.${st_id}.suspension_source == NONE and Station.${st_id}.out_of_service_port_count == 0"
            - "after the manual SUSPENDED transition: Station.${st_id}.status == SUSPENDED and Station.${st_id}.suspension_source == MANUAL and Station.${st_id}.out_of_service_port_count == 0"
            - "after the manual OPERATIONAL transition: Station.${st_id}.status == OPERATIONAL and Station.${st_id}.suspension_source == NONE"
            - "Station.${st_id}.status visited OPERATIONAL twice and SUSPENDED twice, proving the cycle is re-enterable"
            - "Station.${st_id}.gross_downtime_minutes_lifetime == 360"
            - "Station.${st_id}.billable_downtime_minutes_lifetime == 360"

      - name: charging_port_service_and_maintenance_dimensions_advance_independently
        grounds:
          - state_machines.ChargingPort.transitions.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ChargingPort.transitions.NONE_to_DISPATCH_PENDING
          - state_machines.ChargingPort.transitions.DISPATCH_PENDING_to_UNDER_REPAIR
          - state_machines.ChargingPort.transitions.UNDER_REPAIR_to_AWAITING_PARTS
          - state_machines.ChargingPort.transitions.AWAITING_PARTS_to_UNDER_REPAIR
          - entities.ChargingPort.fields.service_state
          - entities.ChargingPort.fields.maintenance_state
        distinguishing_aspect: |
          ChargingPort carries two PARALLEL state dimensions on one row: service_state stays
          pinned at OUT_OF_SERVICE across four consecutive maintenance_state moves
          (NONE -> DISPATCH_PENDING -> UNDER_REPAIR -> AWAITING_PARTS -> UNDER_REPAIR), and
          the maintenance dimension additionally contains its own UNDER_REPAIR <->
          AWAITING_PARTS cycle. The non-linearity lives on ChargingPort — a different entity
          from the Station cyclic instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-14T08:00:00Z."
            - "HostSite HS-PD-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
