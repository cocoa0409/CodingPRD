scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_provisional_vs_final_amount
        grounds:
          - calculations.claim_amount
          - entities.BillingClaim.fields.provisional_amount_cents
          - entities.BillingClaim.fields.final_amount_cents
        distinguishing_aspect: |
          On BillingClaim (billing domain), the provisional variant counts visits in
          {SCHEDULED,COMPLETED} while the final variant counts only {COMPLETED}, so the
          same claim yields provisional 103000 != final 88000 cents.
        test_recipe:
          setup:
            - "Program P1: per_visit_rate 15000, per_telehealth_rate 8000, diversion_bonus 50000, target_max_ed 1, budget 1000000."
            - "Enrollment E with ACTIVE CarePlan; 3 home visits scheduled (2 completed, 1 left SCHEDULED); 1 telehealth completed; no ED events."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P1", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000001" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1000000002" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Para", provider_type: "PARAMEDIC", npi: "1000000003" }
              as: ProgramAdmin
              captures: { para_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Bill", provider_type: "BILLER", npi: "1000000004" }
              as: ProgramAdmin
              captures: { biller_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat A", date_of_birth: "1959-05-05", baseline_ed_visits_12mo: 8, chronic_conditions_count: 3, consent_on_file: true }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "MODERATE", authoring_clinician_id: "${clin_id}", goals: "reduce ED", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /mih/home-visits"
              payload: { enrollment_id: "${enr_id}", care_plan_id: "${cp_id}", provider_id: "${para_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { hv1_id: $.data.id }
            - call: "POST /mih/home-visits"
              payload: { enrollment_id: "${enr_id}", care_plan_id: "${cp_id}", provider_id: "${para_id}", scheduled_start: "2026-03-03T10:00:00Z", scheduled_end: "2026-03-03T11:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { hv2_id: $.data.id }
            - call: "POST /mih/home-visits"
              payload: { enrollment_id: "${enr_id}", care_plan_id: "${cp_id}", provider_id: "${para_id}", scheduled_start: "2026-03-04T10:00:00Z", scheduled_end: "2026-03-04T11:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { hv3_id: $.data.id }
            - call: "POST /mih/home-visits/${hv1_id}/complete"
              payload: { systolic_bp: 130, diastolic_bp: 80, heart_rate: 72 }
              as: Paramedic
              as_user_id: "${para_id}"
            - call: "POST /mih/home-visits/${hv2_id}/complete"
              payload: { systolic_bp: 128, diastolic_bp: 78, heart_rate: 70 }
              as: Paramedic
              as_user_id: "${para_id}"
            - call: "POST /mih/telehealth-sessions"
              payload: { enrollment_id: "${enr_id}", patient_id: "${pat_id}", provider_id: "${clin_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T09:30:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ts_id: $.data.id }
            - call: "POST /mih/telehealth-sessions/${ts_id}/complete"
              payload: { systolic_bp: 120, diastolic_bp: 75, heart_rate: 68 }
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /mih/billing-claims"
              payload: { enrollment_id: "${enr_id}", program_id: "${prog_id}", payer_id: "${payer_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: BillingSpecialist
              as_user_id: "${biller_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /mih/billing-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              as_user_id: "${biller_id}"
          assert:
            - "BillingClaim.${claim_id}.provisional_amount_cents == 103000"
            - "BillingClaim.${claim_id}.final_amount_cents == 88000"
            - "provisional_amount_cents != final_amount_cents (103000 != 88000)"

      - name: outcome_projected_vs_actual_savings
        grounds:
          - calculations.outcome_net_savings
          - entities.Patient.fields.baseline_ed_visits_12mo
          - entities.PilotProgram.fields.avg_ed_cost_cents
        distinguishing_aspect: |
          On the Enrollment cost-outcome (population-health domain), the forward-looking
          variant uses expected baseline visits (8) giving projected 852952, while the
          chronological variant uses actual averted visits (6) giving actual 639714 cents.
        test_recipe:
          setup:
            - "Patient baseline_ed_visits_12mo=8; program avg_ed_cost 124700, diversion_credit_pct 0.855."
            - "Enrollment accepted at clock 2026-03-01; clock advanced to 2027-03-01 (365 days); 2 ED_VISIT events recorded in the period."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P2", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000011" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat B", date_of_birth: "1955-01-01", baseline_ed_visits_12mo: 8, chronic_conditions_count: 2, consent_on_file: true }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "HOSPITAL" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /mih/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mih/ed-events"
              payload: { patient_id: "${pat_id}", event_type: "ED_VISIT", event_date: "2026-06-01T00:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/ed-events"
              payload: { patient_id: "${pat_id}", event_type: "ED_VISIT", event_date: "2026-09-01T00:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /mih/enrollments/${enr_id}/cost-outcome"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
          assert:
            - "cost-outcome.expected_ed_visits == 8"
            - "cost-outcome.actual_ed_visits == 2"
            - "cost-outcome.averted_ed_visits == 6"
            - "cost-outcome.projected_savings_cents == 852952"
            - "cost-outcome.actual_savings_cents == 639714"
            - "projected_savings_cents != actual_savings_cents (852952 != 639714)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_amount_nonlinear_min_bonus_penalty
        grounds:
          - calculations.claim_amount
          - entities.PilotProgram.fields.diversion_bonus_cents
          - entities.PilotProgram.fields.available_budget_cents
        distinguishing_aspect: |
          Mode (a): claim_amount interacts >=3 inputs non-linearly — base (visit*rate +
          teleh*rate), a conditional diversion_bonus branch, a conditional readmission_penalty
          branch, and a max(0,..) floor — producing final 88000 = max(0, 2*15000 + 8000 + 50000 - 0).
        test_recipe:
          setup:
            - "Same program/enrollment as claim_provisional_vs_final_amount; 2 completed visits + 1 completed telehealth; diversion achieved (0 ED visits <= target 1)."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P3", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000021" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1000000022" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Para", provider_type: "PARAMEDIC", npi: "1000000023" }
              as: ProgramAdmin
              captures: { para_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Bill", provider_type: "BILLER", npi: "1000000024" }
              as: ProgramAdmin
              captures: { biller_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat C", date_of_birth: "1960-02-02", baseline_ed_visits_12mo: 6, chronic_conditions_count: 2, consent_on_file: true }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "PCP" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "MODERATE", authoring_clinician_id: "${clin_id}", goals: "reduce ED", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /mih/home-visits"
              payload: { enrollment_id: "${enr_id}", care_plan_id: "${cp_id}", provider_id: "${para_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { hv1_id: $.data.id }
            - call: "POST /mih/home-visits"
              payload: { enrollment_id: "${enr_id}", care_plan_id: "${cp_id}", provider_id: "${para_id}", scheduled_start: "2026-03-03T10:00:00Z", scheduled_end: "2026-03-03T11:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { hv2_id: $.data.id }
            - call: "POST /mih/home-visits/${hv1_id}/complete"
              payload: { systolic_bp: 130, diastolic_bp: 80, heart_rate: 72 }
              as: Paramedic
              as_user_id: "${para_id}"
            - call: "POST /mih/home-visits/${hv2_id}/complete"
              payload: { systolic_bp: 126, diastolic_bp: 78, heart_rate: 70 }
              as: Paramedic
              as_user_id: "${para_id}"
            - call: "POST /mih/telehealth-sessions"
              payload: { enrollment_id: "${enr_id}", patient_id: "${pat_id}", provider_id: "${clin_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T09:30:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ts_id: $.data.id }
            - call: "POST /mih/telehealth-sessions/${ts_id}/complete"
              payload: { systolic_bp: 120, diastolic_bp: 75, heart_rate: 68 }
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /mih/billing-claims"
              payload: { enrollment_id: "${enr_id}", program_id: "${prog_id}", payer_id: "${payer_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: BillingSpecialist
              as_user_id: "${biller_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /mih/billing-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              as_user_id: "${biller_id}"
          assert:
            - "BillingClaim.${claim_id}.final_amount_cents == 88000"
            - "BillingClaim.${claim_id}.billable_visit_count == 2"
            - "BillingClaim.${claim_id}.billable_telehealth_count == 1"

      - name: outcome_savings_round_per_visit_then_sum
        grounds:
          - calculations.outcome_net_savings
          - entities.PilotProgram.fields.diversion_credit_pct
        distinguishing_aspect: |
          Mode (b): rounding order is pinned round-per-visit-then-sum, so 6 * round(124700*0.855)
          = 6*106619 = 639714, NOT round(6*106618.5) = 639711.
        test_recipe:
          setup:
            - "Same shape as outcome_projected_vs_actual_savings: baseline 8, avg_ed_cost 124700, pct 0.855, 2 actual ED_VISITs, enrollment_days 365 (averted 6)."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P4", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000031" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat D", date_of_birth: "1954-04-04", baseline_ed_visits_12mo: 8, chronic_conditions_count: 1, consent_on_file: true }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /mih/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mih/ed-events"
              payload: { patient_id: "${pat_id}", event_type: "ED_VISIT", event_date: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/ed-events"
              payload: { patient_id: "${pat_id}", event_type: "ED_VISIT", event_date: "2026-08-01T00:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /mih/enrollments/${enr_id}/cost-outcome"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
          assert:
            - "cost-outcome.per_averted_saving_cents == 106619"
            - "cost-outcome.averted_ed_visits == 6"
            - "cost-outcome.actual_savings_cents == 639714"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: care_plan_active_revision_cycle
        grounds:
          - state_machines.CarePlan.ACTIVE_to_UNDER_REVISION
          - state_machines.CarePlan.UNDER_REVISION_to_ACTIVE
        distinguishing_aspect: |
          CarePlan cycles ACTIVE -> UNDER_REVISION -> ACTIVE (revision loop), returning to
          ACTIVE with Enrollment.revision_count incremented to 1.
        test_recipe:
          setup:
            - "Enrollment E with a MODERATE CarePlan activated to ACTIVE."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P5", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000041" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1000000042" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat E", date_of_birth: "1961-03-03", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "PCP" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "MODERATE", authoring_clinician_id: "${clin_id}", goals: "stabilize", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /mih/care-plans/${cp_id}/revise"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
