              as: CustomsAuditor
              as_user_id: "user-audit-02"
            - call: "POST /sealed-bags/${bag_144}/verify"
              payload: { outcome: "TAMPERED" }
              as: SalesAssociate
          assert:
            - "the request-info on the DRAFT audit returns HTTP 409 with error_id ERR_AUDIT_NOT_SUBMITTED"
            - "the close on the DRAFT audit returns HTTP 409 with error_id ERR_AUDIT_NOT_SUBMITTED, not ERR_AUDIT_PERIOD_NOT_CLOSED"
            - "CustomsAudit.${au_144}.status == DRAFT and round_count == 0 and info_request_note == null"
            - "CustomsAudit.${au_144}.counted_qty == null and expected_qty == null"
            - "the second verify returns HTTP 409 with error_id ERR_BAG_NOT_ISSUED"
            - "SealedBag.${bag_144}.status == INTACT_VERIFIED and verified_at == 2026-08-01T00:00:00Z"
            - "Sale.${sale_144}.duty_status == SUSPENDED - the refused TAMPERED verify did not run the duty cascade"

  # =====================================================================
  # SECTION 7 - From Table 7 (RBAC): five peer roles under a
  # segregation_of_duties role model, one of them entity_backed.
  # =====================================================================
  - section: rbac
    instances:
      - name: each_role_executes_its_own_exclusive_operations_end_to_end
        claim_type: role_can_perform_exclusive_operations
        grounds:
          - roles.TerminalAdmin.exclusive_operations
          - roles.SalesAssociate.exclusive_operations
          - roles.StockController.exclusive_operations
          - roles.CustomsAuditor.exclusive_operations
          - roles.Passenger.exclusive_operations
        distinguishing_aspect: |
          One pass in which all five roles each drive their own exclusive surface to completion:
          TerminalAdmin builds the estate and settles the period, StockController runs the bonded
          ledger and converts a reservation, SalesAssociate handles the till, Passenger places its
          own pre-order, CustomsAuditor adjudicates the count. Every call MUST return 2xx - no role
          may need a second role's header to finish its own job.
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "LIQUOR", allowance_units: 10, advisory_text: "Australia: 2.25 L of alcohol per adult traveller." }
              as: TerminalAdmin
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_aurora}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "TERMINAL_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: TerminalAdmin
              captures: { g_aurora: $.data.id }
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_sin: $.data.id }
            - call: "POST /concession-agreements/${ag_sin}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 20 }
              as: StockController
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0150", nationality_code: "CN", boarding_pass_barcode: "BP-0150", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_150: $.data.id }
            - call: "POST /itineraries/${it_150}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0150" }
              as: SalesAssociate
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: Passenger
              as_user_id: "${it_150}"
              captures: { si_whisky_v: $.data.version }
          trigger:
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_150}", stock_item_id: "${si_whisky}", qty: 2, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-02T00:00:00Z", reservation_window_end: "2026-08-20T09:00:00Z", expected_stock_item_version: "${si_whisky_v}" }
              as: Passenger
              as_user_id: "${it_150}"
              captures: { po_150: $.data.id }
            - call: "POST /pre-orders/${po_150}/convert"
              payload: {}
              as: StockController
              captures: { sale_150: $.data.converted_sale_id }
            - call: "POST /sales/${sale_150}/clear-eligibility"
              payload: {}
              as: SalesAssociate
            - call: "POST /sales/${sale_150}/pickup"
              payload: {}
              as: SalesAssociate
            - call: "GET /concession-agreements/${ag_sin}/rent-projection"
              as: TerminalAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /concession-agreements/${ag_sin}/close-period"
              payload: {}
              as: TerminalAdmin
            - call: "POST /customs-audits"
              payload: { terminal_id: "${t_sin}", stock_item_id: "${si_whisky}", period_code: "2026-08" }
              as: StockController
              as_user_id: "user-stock-03"
              captures: { au_150: $.data.id }
