# =============================================================================
# §1.9 Scaffold Corner Design — Military Household Goods Move & PCS Entitlement
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; nothing invented.
# Every numeric assert was produced by executing the §1.3 formula with its declared constants.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# Canonical fixture (used unless an instance states otherwise): E6 member with 2 dependents and
# a spouse -> base_weight_allowance_lbs 11000; PCS_CONUS orders, 1200 miles, market MKT-BWI;
# survey rooms [143.5, 268.25, 210.5, 96.75] cu ft -> estimated_gross_lbs 5286;
# certified weights 6200 / 1500 -> net_actual_lbs 4700.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: service_member_created_with_system_and_computed_fields_returns_201
        claim_type: creation
        grounds:
          - endpoints.POST_/hhg/service-members
          - entities.ServiceMember
          - response_envelope
        distinguishing_aspect: >-
          A ServiceMember created with every input field returns 201 with the §1.0 envelope, a
          system id/created_at/version and the computed active_shipment_count seeded at 0.
        test_recipe:
          setup:
            - "Empty database; logical clock moved to 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000001", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
          assert:
            - "HTTP 201 and the body carries data, error_id == null and message == null (§1.0 envelope)"
            - "ServiceMember.${m_id}.dod_id == 7000000001 and rank_code == E6 and branch == ARMY"
            - "ServiceMember.${m_id}.dependents_count == 2 and spouse_present == true"
            - "ServiceMember.${m_id}.active_shipment_count == 0"
            - "ServiceMember.${m_id}.id, created_at, updated_at and version are present; version == 1"

      - name: member_and_order_reads_return_the_stored_and_snapshotted_values
        claim_type: retrieval
        grounds:
          - endpoints.GET_/hhg/service-members/{id}
          - endpoints.GET_/hhg/orders/{id}
          - entities.PcsOrder.fields.dependents_count_at_issue
        distinguishing_aspect: >-
          GET on member and order returns exactly what was stored, including the order's
          dependents_count_at_issue snapshot (2) and its system status/counter defaults.
        test_recipe:
          setup:
            - "One E6 member with 2 dependents and one PCS_CONUS order at 1200 miles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000002", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-02", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /hhg/service-members/${m_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/orders/${o_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
          assert:
            - "both reads return HTTP 200"
            - "ServiceMember.${m_id}.full_name == 'Dana Reyes' and email == 'dana.reyes@example.mil'"
            - "PcsOrder.${o_id}.service_member_id == ${m_id} and order_number == 'ORD-C-02'"
            - "PcsOrder.${o_id}.dependents_count_at_issue == 2 and is_dependent_restricted == false"
            - "PcsOrder.${o_id}.status == ISSUED and amendment_count == 0 and last_amendment_reason == null"

      - name: shipment_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/hhg/shipments
          - complexity_profile.pagination
        distinguishing_aspect: >-
          With two shipments stored, limit=1/offset=0 returns exactly 1 row with total_count 2 and
          has_more true, and limit=1/offset=1 returns the remaining row with has_more false.
        test_recipe:
          setup:
            - "Authorized entitlement with two HHG shipments booked (no survey needed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000003", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-03", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-C03A", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s1_id: $.data.id }
            - call: "GET /hhg/entitlements/${ent_id}"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v2: $.data.version }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-C03B", shipment_method: "UB", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-18T00:00:00Z", requested_delivery_date: "2026-08-25T00:00:00Z", expected_entitlement_version: "${ent_v2}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "GET /hhg/shipments"
              payload: { limit: 1, offset: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/shipments"
              payload: { limit: 1, offset: 1 }
              as: MoveCounselor
              as_user_id: "counselor-01"
          assert:
            - "the first call returns HTTP 200 with exactly 1 element in data, total_count == 2, limit == 1, offset == 0 and has_more == true"
            - "the second call returns exactly 1 element, total_count == 2, offset == 1 and has_more == false"
            - "the two calls return different Shipment ids, together covering {${s1_id}, ${s2_id}}"
            - "ServiceMember.${m_id}.active_shipment_count == 2"

      - name: unknown_ids_on_every_read_path_return_their_entity_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_SERVICE_MEMBER_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_COUNSELING_SESSION_NOT_FOUND]
          - errors[ERR_ENTITLEMENT_NOT_FOUND]
          - errors[ERR_TSP_NOT_FOUND]
          - errors[ERR_CAPACITY_BLOCK_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_PRO_GEAR_DECLARATION_NOT_FOUND]
          - errors[ERR_SIT_AUTHORIZATION_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_CLAIM_ITEM_NOT_FOUND]
          - errors[ERR_PPM_SUBMISSION_NOT_FOUND]
          - errors[ERR_NOTIFICATION_NOT_FOUND]
        distinguishing_aspect: >-
          Each of the thirteen entity read paths resolves its own 404 code for the same
          non-existent UUID — no shared generic ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database; no entity of any type exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /hhg/service-members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e1: $.data.error_id }
            - call: "GET /hhg/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e2: $.data.error_id }
            - call: "GET /hhg/counseling-sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e3: $.data.error_id }
            - call: "GET /hhg/entitlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e4: $.data.error_id }
            - call: "GET /hhg/tsps/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e5: $.data.error_id }
            - call: "GET /hhg/capacity-blocks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e6: $.data.error_id }
            - call: "GET /hhg/shipments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e7: $.data.error_id }
            - call: "GET /hhg/pro-gear-declarations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e8: $.data.error_id }
            - call: "GET /hhg/sit-authorizations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e9: $.data.error_id }
            - call: "GET /hhg/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e10: $.data.error_id }
            - call: "GET /hhg/claim-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e11: $.data.error_id }
            - call: "GET /hhg/ppm-submissions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e12: $.data.error_id }
            - call: "GET /hhg/notifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { e13: $.data.error_id }
          assert:
            - "every one of the thirteen calls returns HTTP 404 with data == null"
            - "${e1} == ERR_SERVICE_MEMBER_NOT_FOUND and ${e2} == ERR_ORDER_NOT_FOUND and ${e3} == ERR_COUNSELING_SESSION_NOT_FOUND"
            - "${e4} == ERR_ENTITLEMENT_NOT_FOUND and ${e5} == ERR_TSP_NOT_FOUND and ${e6} == ERR_CAPACITY_BLOCK_NOT_FOUND"
            - "${e7} == ERR_SHIPMENT_NOT_FOUND and ${e8} == ERR_PRO_GEAR_DECLARATION_NOT_FOUND and ${e9} == ERR_SIT_AUTHORIZATION_NOT_FOUND"
            - "${e10} == ERR_CLAIM_NOT_FOUND and ${e11} == ERR_CLAIM_ITEM_NOT_FOUND and ${e12} == ERR_PPM_SUBMISSION_NOT_FOUND and ${e13} == ERR_NOTIFICATION_NOT_FOUND"

      - name: order_create_with_unknown_service_member_id_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_SERVICE_MEMBER_NOT_FOUND]
          - entities.PcsOrder.fields.service_member_id
        distinguishing_aspect: >-
          The body foreign key service_member_id is resolved too (not just path ids): an order
          naming an unknown member is refused 404 and no PcsOrder row is created.
        test_recipe:
          setup:
            - "One real member exists, so the failure cannot be blamed on an empty table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000005", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /hhg/orders"
              payload: { service_member_id: "00000000-0000-4000-8000-000000000000", order_number: "ORD-C-05", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ${err} == ERR_SERVICE_MEMBER_NOT_FOUND"
            - "GET /hhg/service-members/${m_id}/orders returns total_count == 0 (nothing was created)"

      - name: order_create_missing_required_distance_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.PcsOrder.fields.distance_miles
        distinguishing_aspect: >-
          distance_miles has source input and no default, so omitting it fails at priority 3
          before any existence check runs — the response is 400, not 404.
        test_recipe:
          setup:
            - "One real member exists and is referenced correctly by the failing call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000006", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-06", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with ${err} == ERR_INVALID_REQUEST and data == null"
            - "GET /hhg/service-members/${m_id}/orders returns total_count == 0"

      - name: omitted_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ServiceMember.fields.dependents_count
          - entities.ServiceMember.fields.spouse_present
          - entities.PcsOrder.fields.is_dependent_restricted
          - entities.CapacityBlock.fields.short_notice_reserve_pct
          - calculations.capacity_pool_allocation
        distinguishing_aspect: >-
          Three different default declarations are honoured in one pass: member 0/false, order
          is_dependent_restricted false, and CapacityBlock.short_notice_reserve_pct 0.15, which
          then drives general_pool_lbs 8500 / short_notice_pool_lbs 1500 on a 10000 lb week.
        test_recipe:
          setup:
            - "Clock at 2026-10-26T00:00:00Z so the capacity week 2026-11-02 is outside peak season."
            - "One TSP serving MKT-BWI."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-26T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
          trigger:
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000007", full_name: "Lee Park", rank_code: "E5", branch: "NAVY", email: "lee.park@example.mil" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-07", move_type: "PCS_CONUS", issue_date: "2026-10-01T00:00:00Z", report_no_later_than_date: "2026-12-01T00:00:00Z", origin_duty_station: "NAS OCEANA VA", destination_duty_station: "NAS LEMOORE CA", origin_market_code: "MKT-BWI", distance_miles: 2600 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-11-02T00:00:00Z", total_capacity_lbs: 10000 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_id: $.data.id }
          assert:
            - "ServiceMember.${m_id}.dependents_count == 0 and spouse_present == false"
            - "PcsOrder.${o_id}.is_dependent_restricted == false and dependents_count_at_issue == 0"
            - "CapacityBlock.${cb_id}.short_notice_reserve_pct == 0.15 and effective_reserve_pct == 0.15"
            - "CapacityBlock.${cb_id}.peak_season == false and general_pool_lbs == 8500 and short_notice_pool_lbs == 1500"
            - "CapacityBlock.${cb_id}.committed_general_lbs == 0 and committed_short_notice_lbs == 0 and committed_lbs == 0 and status == OPEN"
            - "CapacityBlock.${cb_id}.week_end_date == 2026-11-09T00:00:00Z (half-open week end)"

      - name: counseling_deadline_is_computed_from_the_report_date
        claim_type: computed_fields
        grounds:
          - entities.CounselingSession.fields.counseling_deadline_at
          - entities.CounselingSession.fields.is_late_counseling
          - state_machines.CounselingSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: >-
          counseling_deadline_at is derived as report_no_later_than_date minus 14 days
          (2026-10-01 -> 2026-09-17) and is_late_counseling stays false because completion is
          stamped from the logical clock 2026-08-03, well inside the deadline.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; order with report_no_later_than_date 2026-10-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /hhg/service-members"
              payload: { dod_id: "7000000008", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-C-08", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "VIRTUAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
          assert:
            - "CounselingSession.${cs_id}.counseling_deadline_at == 2026-09-17T00:00:00Z"
            - "at creation CounselingSession.${cs_id}.status == SCHEDULED and completed_at == null and is_late_counseling == false"
            - "after completion CounselingSession.${cs_id}.completed_at == 2026-08-03T00:00:00Z and counselor_user_id == 'counselor-01'"
