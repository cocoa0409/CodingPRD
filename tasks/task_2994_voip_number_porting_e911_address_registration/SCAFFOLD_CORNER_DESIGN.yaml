  - section: endpoints
    instances:
      - name: number_block_and_phone_number_crud_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /voip/number-blocks]
          - endpoints[GET /voip/number-blocks/{id}]
          - endpoints[GET /voip/number-blocks]
          - endpoints[POST /voip/number-blocks/{id}/phone-numbers]
          - endpoints[GET /voip/phone-numbers]
        distinguishing_aspect: "The write is readable through three different routes - by id, in the jurisdiction-filtered list, and through the child phone-number list filtered by block_id - and each route reports the same census, so the block is genuinely persisted rather than echoed."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one jurisdiction"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415618", total_capacity: 4, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "3401" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
            - call: "GET /voip/number-blocks?jurisdiction_id=${jur_id}&limit=10&offset=0"
              payload: { jurisdiction_id: "${jur_id}", limit: 10, offset: 0 }
              as: NumberingAdmin
            - call: "GET /voip/phone-numbers?block_id=${blk_id}&limit=10&offset=0"
              payload: { block_id: "${blk_id}", limit: 10, offset: 0 }
