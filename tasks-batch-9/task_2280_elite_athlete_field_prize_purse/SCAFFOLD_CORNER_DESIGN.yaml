            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Standard Miss Reps", license_code: "AGT-SM-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Missing Standard Fay", country_code: USA, gender: FEMALE, birth_date: "1997-05-01" }
              as: ElitesDirector
              captures: { athF_id: "$.data.id" }
            - call: POST /athletes
