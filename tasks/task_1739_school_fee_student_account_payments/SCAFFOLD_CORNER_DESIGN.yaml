# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1739_school_fee_student_account_payments
# §1.9 Coverage Index for Non-Difficulty Tests: enumerative breadth across the
# claim-extraction-guide taxonomy. Instances already exercised by §1.8 are
# emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section 1 — Entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: school_year_creation_defaults_and_echo
        claim_type: creation
        grounds: [entities.SchoolYear, state_machines.SchoolYear]
        distinguishing_aspect: "POST with all required config fields returns 201 with status DRAFT, version 1, and every config field echoed."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id, y_status: $.data.status, y_version: $.data.version }
          assert:
            - "${y_status} == DRAFT (initial state)"
            - "${y_version} == 1"
            - "Response echoes refund_full_days == 2 and payment_plan_max_installments == 6"
      - name: student_account_initial_aggregates_zero
        claim_type: defaults
        grounds: [entities.StudentAccount.fields.posture, entities.StudentAccount.fields.balance_cents]
        distinguishing_aspect: "A freshly opened account starts with all aggregates 0 and posture CLEAR."
        test_recipe:
          setup: ["OPEN year with one department; one registered student"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id, assessed: $.data.assessed_cents, paid: $.data.paid_cents, bal: $.data.balance_cents, posture: $.data.posture }
          assert:
            - "${assessed} == 0 and ${paid} == 0 and ${bal} == 0"
            - "${posture} == CLEAR"
      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404)"
      - name: common_fields_system_minted
        claim_type: system_fields
        grounds: [entities.Student]
        distinguishing_aspect: "Server mints id/created_at/updated_at/version; created_at matches the logical clock default 2026-08-01T00:00:00Z, not wall-clock."
        test_recipe:
          setup: ["empty database; clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id, s_created: $.data.created_at, s_version: $.data.version }
          assert:
            - "${s_id} is a server-minted UUID"
            - "${s_created} == 2026-08-01T00:00:00Z (logical clock default, three fractional digits permitted)"
            - "${s_version} == 1"
      - name: purchase_sold_count_computed_and_reversed
        claim_type: computed_fields
        grounds: [entities.OptionalPurchaseItem.fields.sold_count, state_machines.Purchase.COMPLETED_to_REFUNDED]
        distinguishing_aspect: "sold_count increments to 1 on purchase completion and decrements back to 0 when the withdrawal-spawned purchase refund executes."
        test_recipe:
          setup: ["OPEN year; refundable purchase item (1000 cents, cap 5); student with account"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/optional-purchase-items"
              payload: { name: "Yearbook", amount_cents: 1000, department_id: "${d_id}", refundable: true, inventory_cap: 5 }
              as: Bookkeeper
              captures: { item_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/purchases"
              payload: { item_id: "${item_id}", method: "CARD" }
              as: FamilyMember
              captures: { pur_id: $.data.id, pur_status: $.data.status }
            - call: "GET /school-years/${y_id}/optional-purchase-items/${item_id}"
              as: Bookkeeper
              captures: { sold_mid: $.data.sold_count }
          trigger:
            - call: "POST /students/${s_id}/withdraw"
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}/refunds"
              as: Bookkeeper
              captures: { r_id: "$.data[0].id" }
            - call: "POST /student-accounts/${a_id}/refunds/${r_id}/execute"
              as: Bookkeeper
            - call: "GET /school-years/${y_id}/optional-purchase-items/${item_id}"
              as: Bookkeeper
              captures: { sold_end: $.data.sold_count }
          assert:
            - "${pur_status} == COMPLETED at creation (atomic charge)"
            - "${sold_mid} == 1 after purchase"
            - "${sold_end} == 0 after the withdrawal refund executes"

  # ---------------------------------------------------------------------------
  # Section 2 — State Machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: offering_lazy_in_session_transition
        claim_type: valid_transition
        grounds: [state_machines.Offering.SCHEDULED_to_IN_SESSION]
        distinguishing_aspect: "An offering whose start_date equals the logical clock date transitions to IN_SESSION on read (boundary: date >= start_date is inclusive)."
        test_recipe:
          setup: ["OPEN year; offering with start_date 2026-08-01 (== default clock date)"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-08-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /school-years/${y_id}/offerings/${o_id}"
              as: Bookkeeper
              captures: { o_status: $.data.status }
          assert:
            - "${o_status} == IN_SESSION (lazy transition fires at the inclusive start_date boundary)"
      - name: offering_complete_cascades_enrollment_completed
        claim_type: side_effect_execution
        grounds: [state_machines.Offering.IN_SESSION_to_COMPLETED, state_machines.Enrollment.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "Completing an IN_SESSION offering cascades its ACTIVE enrollments to COMPLETED."
        test_recipe:
          setup: ["OPEN year; offering start 2026-09-01 with one ACTIVE enrollment; clock advanced to 2026-09-02 and offering observed IN_SESSION"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o_id}" }
              as: Bookkeeper
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Bookkeeper
            - call: "GET /school-years/${y_id}/offerings/${o_id}"
              as: Bookkeeper
          trigger:
            - call: "POST /school-years/${y_id}/offerings/${o_id}/complete"
              as: Bookkeeper
              captures: { o_status: $.data.status }
            - call: "GET /student-accounts/${a_id}/enrollments/${e_id}"
              as: Bookkeeper
              captures: { e_status: $.data.status }
          assert:
            - "${o_status} == COMPLETED"
            - "${e_status} == COMPLETED (cascade side effect)"
      - name: offering_cancel_from_completed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Offering
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is unreachable from the terminal COMPLETED state; the cancel attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN year; offering already COMPLETED (start 2026-09-01, clock 2026-09-02)"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Bookkeeper
            - call: "GET /school-years/${y_id}/offerings/${o_id}"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/offerings/${o_id}/complete"
              as: Bookkeeper
          trigger:
            - call: "POST /school-years/${y_id}/offerings/${o_id}/cancel"
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (HTTP 409) — no transition out of terminal COMPLETED"
      - name: student_withdraw_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Student
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN is terminal; a second withdraw is rejected and no additional refunds are spawned."
        test_recipe:
          setup: ["OPEN year; student with an empty account (no enrollments — cascade is a no-op)"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
            - call: "POST /students/${s_id}/withdraw"
              as: Bookkeeper
              captures: { s_status: $.data.status }
          trigger:
            - call: "POST /students/${s_id}/withdraw"
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "${s_status} == WITHDRAWN after the first call"
            - "Second withdraw: ${err} == ERR_INVALID_STATE (HTTP 409)"
      - name: fee_item_retire_in_use_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FeeCatalogItem.ACTIVE_to_RETIRED
          - errors[ERR_FEE_ITEM_IN_USE]
        distinguishing_aspect: "A fee item referenced by a non-terminal assessment cannot be retired."
        test_recipe:
          setup: ["OPEN year; fee item F1 with one ASSESSED enrollment-driven assessment against it"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o_id}" }
              as: Bookkeeper
          trigger:
            - call: "POST /school-years/${y_id}/fee-catalog-items/${f_id}/retire"
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FEE_ITEM_IN_USE (HTTP 409)"
            - "FeeCatalogItem.${f_id}.status remains ACTIVE"
      - name: fee_item_retire_success_then_assessment_blocked
        claim_type: valid_transition
        grounds:
          - state_machines.FeeCatalogItem.ACTIVE_to_RETIRED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An unreferenced fee item retires cleanly, and a subsequent ad-hoc assessment against the RETIRED item is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN year; fee item F1 with no assessments; one student account"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /school-years/${y_id}/fee-catalog-items/${f_id}/retire"
              as: Bookkeeper
              captures: { f_status: $.data.status }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 1000 }
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "${f_status} == RETIRED"
            - "Assessment against retired item: ${err} == ERR_INVALID_STATE (HTTP 409)"
      - name: assessment_void_success_then_activity_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FeeAssessment.ASSESSED_to_VOID
          - errors[ERR_ASSESSMENT_HAS_ACTIVITY]
        distinguishing_aspect: "The 1500-cent waterfall settles against A1 (oldest created_at first), so voiding A1 is rejected with ERR_ASSESSMENT_HAS_ACTIVITY while voiding the untouched A2 succeeds and drops assessed_cents from 6500 to 2500."
        test_recipe:
          setup: ["OPEN year; account with ad-hoc assessment A1 (2500, created first) and A2 (4000); a 1500-cent payment settled (waterfall OLDEST_OUTSTANDING allocates all 1500 to A1)"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 2500 }
              as: Bookkeeper
              captures: { a1_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 4000 }
              as: Bookkeeper
              captures: { a2_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/payments"
              payload: { amount_cents: 1500, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { p_id: $.data.id }
