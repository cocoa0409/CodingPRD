              captures: { lot16: "$.data[0].id", lot16_v: "$.data[0].version", lot16_avail_before: "$.data[0].tons_available" }
          trigger:
            - call: "POST /salt/allocations"
              payload: { delivery_order_id: "${o16_id}", stockpile_lot_id: "${lot16}", tons: 1200, expected_stockpile_lot_version: "${lot16_v}" }
              as: LogisticsPlanner
              captures: { alloc16: $.data.id, alloc16_origin: $.data.origin, alloc16_rank: $.data.rank_position }
            - call: "GET /salt/stockpile-lots/${lot16}"
              payload: {}
              as: LogisticsPlanner
              captures: { mid_avail: $.data.tons_available, mid_reserved: $.data.tons_reserved, mid_on_hand: $.data.tons_on_hand }
            - call: "POST /salt/allocations/${alloc16}/release"
              payload: { reason: "customer deferred the pull" }
              as: LogisticsPlanner
              captures: { alloc16_state: $.data.state }
            - call: "GET /salt/stockpile-lots/${lot16}"
              payload: {}
              as: LogisticsPlanner
              captures: { post_avail: $.data.tons_available, post_reserved: $.data.tons_reserved, post_on_hand: $.data.tons_on_hand }
          assert:
            - "${lot16_avail_before} == 5527.20"
            - "${alloc16_origin} == MANUAL and ${alloc16_rank} == 1 and Allocation.${alloc16}.state == RESERVED with version 1"
            - "forward — ${mid_avail} == 4327.20, ${mid_reserved} == 1200.00, ${mid_on_hand} == 5527.20; the invariant 4327.20 == 5527.20 - 1200.00 holds exactly"
            - "DeliveryOrder.${o16_id}.allocated_tons == 1200.00 and status is still REQUESTED — a partial MANUAL reservation does not promote the order to ALLOCATED and does not create a shortfall"
            - "${alloc16_state} == RELEASED"
            - "compensation — ${post_avail} == 5527.20, ${post_reserved} == 0.00, ${post_on_hand} == 5527.20: byte-identical to the pre-reservation state at 2 decimals, with DRIFT_TOLERANCE 0.00 respected"
            - "DeliveryOrder.${o16_id}.allocated_tons == 0.00 and status REQUESTED after the release"
            - "StockpileLot.${lot16}.lot_state == AVAILABLE (never DEPLETED) and its version incremented exactly twice — once per tonnage movement"
            - "GET /salt/allocations?stockpile_lot_id=${lot16}&state=RESERVED returns 0 rows, so sum(RESERVED) == 0 matches tons_reserved 0.00"

      - name: penalty_accrual_then_waiver_restores_contract_ledger_without_refilling_tons
        grounds:
          - calculations.penalty_ledger_conservation
          - calculations.supply_reliability_score
          - endpoints[POST /salt/delivery-orders/{id}/waive-penalty]
          - validations[priority=21]
          - entities.DeliveryOrder.fields.penalty_state
          - entities.BidContract.fields.breach_watch
        distinguishing_aspect: |
          Conserved quantity #2, USD, compensated on a DIFFERENT axis than the tonnage invariant: the
          waiver returns BidContract.penalty_accrued_usd from 20565.00 to 0.00, re-clears breach_watch
          and lifts supply_reliability_score back to 100.00, yet the order KEEPS shortfall_penalty_usd
          20565.00 for audit, stays SHORTED, and its 900 t reservation is untouched — money is
          reversible here while tonnage is not.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Depot A (NY, OPEN) holds a 900.00 t HIGHWAY_DEICING lot; Depot B (NY) holds a 5527.20 t lot and is posted SURGE so it covers activation but is invisible to a ROUTINE waterfall."
            - "ACTIVE contract for 5000 t at 68.55/t (contract_value_usd 342750.00, penalty 22.00/t, min_take 80)."
            - "One ROUTINE order for 2000 t at Depot A has been allocated and shorted: allocated 900.00, shorted 1100.00, penalty_state ACCRUED, shortfall_penalty_usd 20565.00, contract penalty_accrued_usd 20565.00, breach_watch true, supply_reliability_score 78.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m17_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m17_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p17_id: $.data.id }
            - call: "POST /salt/panels/${p17_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p17_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m17_id}"
              payload: {}
              as: MinePlanner
              captures: { m17_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m17_id}", panel_id: "${p17_id}", planned_tons: 7000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T08:00:00Z", expected_mine_version: "${m17_v}" }
              as: MinePlanner
              captures: { r17_id: $.data.id }
            - call: "POST /salt/production-runs/${r17_id}/hoist"
              payload: { hoisted_tons: 7000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d17a: $.data.id }
            - call: "POST /salt/depots"
              payload: { name: "Depot B", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d17b: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r17_id}", depot_id: "${d17a}", product_line: "HIGHWAY_DEICING", screen_spec: "MEDIUM", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 1000, moisture_pct: 0.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b17a: $.data.id }
            - call: "POST /salt/treatment-batches/${b17a}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r17_id}", depot_id: "${d17b}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 6000, moisture_pct: 2.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b17b: $.data.id }
            - call: "POST /salt/treatment-batches/${b17b}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "POST /salt/depots/${d17b}/posture"
              payload: { depot_state: "SURGE", reason: "storm staging" }
              as: LogisticsPlanner
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NORTHEAST", normal_season_tons: 200000, severity_index: 60, prior_season_1_actual_tons: 240000, prior_season_2_actual_tons: 180000, prior_season_3_actual_tons: 150000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc17_id: $.data.id }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc17_id}", customer_name: "City of Buffalo", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 5000, guaranteed_price_per_ton: 68.55, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 22.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              captures: { c17_id: $.data.id }
            - call: "POST /salt/bid-contracts/${c17_id}/submit"
              payload: {}
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${c17_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${c17_id}/activate"
              payload: {}
              as: ContractAdministrator
            - call: "GET /salt/bid-contracts/${c17_id}"
              payload: {}
              as: ContractAdministrator
              captures: { c17_v: $.data.version }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c17_id}", depot_id: "${d17a}", requested_tons: 2000, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 70.00, storm_priority: "ROUTINE", expected_bid_contract_version: "${c17_v}" }
              as: ContractAdministrator
              captures: { o17_id: $.data.id }
            - call: "POST /salt/delivery-orders/${o17_id}/allocate"
              payload: {}
              as: LogisticsPlanner
              captures: { o17_status: $.data.status, o17_penalty: $.data.shortfall_penalty_usd }
            - call: "GET /salt/bid-contracts/${c17_id}"
              payload: {}
              as: ContractAdministrator
              captures: { accrued_before: $.data.penalty_accrued_usd, breach_before: $.data.breach_watch, score_before: $.data.supply_reliability_score }
          trigger:
            - call: "POST /salt/delivery-orders/${o17_id}/waive-penalty"
              payload: { waiver_reason: "force majeure: rail embargo during the December storm" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { o17_penalty_state: $.data.penalty_state, o17_penalty_after: $.data.shortfall_penalty_usd, o17_status_after: $.data.status }
            - call: "GET /salt/bid-contracts/${c17_id}"
              payload: {}
              as: ContractAdministrator
              captures: { accrued_after: $.data.penalty_accrued_usd, breach_after: $.data.breach_watch, score_after: $.data.supply_reliability_score }
          assert:
            - "forward — ${o17_status} == SHORTED, ${o17_penalty} == 20565.00, ${accrued_before} == 20565.00, ${breach_before} == true, ${score_before} == 78.00"
            - "compensation — ${accrued_after} == 0.00 exactly (DRIFT_TOLERANCE 0.00): the contract ledger is the sum over orders whose penalty_state is still ACCRUED, and there are none left"
            - "${breach_after} == false — 0.00 is below the 17137.50 breach threshold (5 pct of 342750.00)"
            - "${score_after} == 100.00 — cumulative_shorted_tons also counts ACCRUED orders only, so the 22.00 haircut disappears with the waiver"
            - "audit — ${o17_penalty_after} == 20565.00 and ${o17_penalty_state} == WAIVED: the order keeps the amount it was charged; the money is removed from the ledger, not from history"
            - "${o17_status_after} == SHORTED and DeliveryOrder.${o17_id}.shorted_tons == 1100.00 — waiving money never re-fills tonnage"
            - "GET /salt/allocations?delivery_order_id=${o17_id} still returns 1 RESERVED row for 900.00 t and the lot still shows tons_reserved 900.00 — the tonnage side of the world is unmoved"
            - "a second POST /salt/delivery-orders/${o17_id}/waive-penalty returns ERR_PENALTY_NOT_ACCRUED (validations priority 21), so the compensation is not double-appliable"
