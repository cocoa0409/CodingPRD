        distinguishing_aspect: "A request without auth headers to a nonexistent id yields 401 (priority 1), while the same id with valid headers yields 404 (priority 4) — auth strictly precedes existence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/machines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err_auth: $.data.error_id } }
            - { call: "GET /api/machines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err_nf: $.data.error_id } }
          assert:
            - "missing_auth_headers variant: rejected with ERR_MISSING_HEADERS (401)"
            - "with valid headers: rejected with ERR_NOT_FOUND (404)"

