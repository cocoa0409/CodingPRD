# =============================================================================
# Task 1814 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Instance names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # =========================================================== entities
  - section: entities
    instances:
      - name: tenancy_creation_defaults_and_envelope
        claim_type: creation
        grounds:
          - entities.Tenancy
          - state_machines.Tenancy
          - response_envelope
        distinguishing_aspect: "POST /pm/tenancies returns 201 with status PENDING_MOVE_IN, keys_returned/fobs_returned 0, all money counters 0, version 1, balance_remaining_cents == deposit_cents, and the success envelope carries meta.api_request_id."
        test_recipe:
          setup: ["Jurisdiction, property, unit exist"]
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2026-09-01", lease_end_on: "2027-09-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
          assert:
            - "Tenancy.${ten}.status == PENDING_MOVE_IN, keys_returned == 0, fobs_returned == 0, version == 1"
            - "interest_accrued_cents == 0, pending_deductions_cents == 0, total_deductions_cents == 0, refund_paid_cents == 0, escheated_cents == 0, reserved_cents == 0"
            - "balance_remaining_cents == 200000"
            - "Response envelope has meta.api_request_id and response_type == object"

      - name: jurisdiction_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.JurisdictionProfile, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field code yields ERR_INVALID_REQUEST (400); every other required field present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: get_unknown_tenancy_returns_404
        claim_type: not_found
        grounds: [entities.Tenancy, "errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent tenancy id yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pm/tenancies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ManagerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND and HTTP status == 404"

      - name: tenancy_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Tenancy]
        distinguishing_aspect: "Client-supplied id/version/created_at in the create body are ignored; the server mints its own id and version 1."
        test_recipe:
          setup: ["Jurisdiction, property, unit exist"]
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /pm/tenancies"
              payload: { id: "11111111-1111-1111-1111-111111111111", version: 99, unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2026-09-01", lease_end_on: "2027-09-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
          assert:
            - "201 created; Tenancy.${ten}.id != 11111111-1111-1111-1111-111111111111 and version == 1"

      - name: unit_occupancy_status_derived_through_lifecycle
        claim_type: computed_fields
        grounds: [calculations.unit_occupancy_derivation, entities.Unit.fields.occupancy_status]
        distinguishing_aspect: "occupancy_status is recomputed from child tenancies: AVAILABLE at creation, RESERVED with a PENDING_MOVE_IN tenancy, OCCUPIED after move-in completion, RESERVED after notice, AVAILABLE after move-out completion."
        test_recipe:
          setup: ["Canonical tenancy driven to VACATED with no damage and all keys returned"]
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
          trigger:
            - call: "GET /pm/units/${unit}"
              as: PropertyManager
              captures: { st0: $.data.occupancy_status }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
            - call: "GET /pm/units/${unit}"
              as: PropertyManager
              captures: { st1: $.data.occupancy_status }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten}/record_key_return", payload: { keys_returned: 2, fobs_returned: 1 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
            - { call: "POST /pm/inspections/${mo}/complete", payload: {}, as: Inspector }
            - call: "GET /pm/units/${unit}"
              as: PropertyManager
              captures: { st2: $.data.occupancy_status }
          assert:
            - "${st0} == AVAILABLE (before any tenancy)"
            - "After tenancy creation occupancy was RESERVED; after move-in completion ${st1} == OCCUPIED"
            - "After move-out completion ${st2} == AVAILABLE"

      - name: forwarding_address_default_null
        claim_type: defaults
        grounds: [entities.Tenancy.fields.forwarding_address]
        distinguishing_aspect: "Omitting optional forwarding_address yields null, not an error or empty string."
        test_recipe:
          setup: ["Jurisdiction, property, unit exist"]
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2026-09-01", lease_end_on: "2027-09-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
          assert:
            - "Tenancy.${ten}.forwarding_address is null"

      - name: inspection_item_determination_default_unassessed
        claim_type: defaults
        grounds: [entities.InspectionItem.fields.determination]
        distinguishing_aspect: "An item created without determination defaults to UNASSESSED."
        test_recipe:
          setup: ["Tenancy in PENDING_MOVE_IN with a DRAFT MOVE_IN inspection"]
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2026-09-01", lease_end_on: "2027-09-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2026-09-01T09:00:00Z", scheduled_end_at: "2026-09-01T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
          trigger:
            - call: "POST /pm/inspections/${mi}/items"
              payload: { area_name: "kitchen_floor", category: "OTHER", condition: "GOOD", photo_count: 1 }
              as: Inspector
              captures: { item: $.data.id }
          assert:
            - "InspectionItem.${item}.determination == UNASSESSED"

  # =========================================================== state_machines
  - section: state_machines
    instances:
      - name: give_notice_before_occupied_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Tenancy, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "give_notice from PENDING_MOVE_IN has no transition => ERR_INVALID_STATE_TRANSITION; tenancy state unchanged."
        test_recipe:
          setup: ["Tenancy created, move-in inspection NOT completed"]
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2026-09-01", lease_end_on: "2027-09-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
          trigger:
            - call: "POST /pm/tenancies/${ten}/give_notice"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION and HTTP status == 409"
            - "Tenancy.${ten}.status still == PENDING_MOVE_IN"

      - name: complete_already_completed_inspection_rejected
        claim_type: idempotency
        grounds: [state_machines.Inspection.DRAFT_to_COMPLETED]
        distinguishing_aspect: "Completing an already-COMPLETED inspection fails with ERR_INVALID_STATE_TRANSITION; no duplicate deduction lines are created."
        test_recipe:
          setup: ["Canonical tenancy OCCUPIED via a completed MOVE_IN inspection"]
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "POST /pm/inspections/${mi}/complete"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION and HTTP status == 409"
            - "Tenancy.${ten}.status still OCCUPIED; move_in_on unchanged == 2025-01-10"

      - name: key_return_after_vacated_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Tenancy, 'endpoints["POST /pm/tenancies/{id}/record_key_return"]']
        distinguishing_aspect: "Key/fob counts freeze at move-out completion: record_key_return in VACATED fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Canonical tenancy VACATED (no damage, 1 key and 0 fobs returned before completion)"]
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten}/record_key_return", payload: { keys_returned: 1, fobs_returned: 0 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
            - { call: "POST /pm/inspections/${mo}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "POST /pm/tenancies/${ten}/record_key_return"
              payload: { keys_returned: 2, fobs_returned: 1 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION and HTTP status == 409"
            - "Tenancy.${ten}.keys_returned still == 1 and fobs_returned still == 0"

      - name: disbursement_terminal_reversed_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Disbursement]
        distinguishing_aspect: "REVERSED is terminal: mark_cashed on a reversed disbursement fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Canonical issued statement (refund_due 149,337c) with a REFUND disbursement 149,337c that was cashed then reversed"]
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
