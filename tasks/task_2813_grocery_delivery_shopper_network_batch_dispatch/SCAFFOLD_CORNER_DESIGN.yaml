      - name: headerless_and_undeclared_role_requests_are_rejected_first
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "The priority-1 authentication gate answers ERR_UNAUTHENTICATED (401) before role, existence or body checks run: a headerless read, a request whose X-User-Role is an undeclared role, and a request that is simultaneously headerless and malformed all return ERR_UNAUTHENTICATED rather than ERR_UNAUTHORIZED_ROLE, ERR_BATCH_NOT_FOUND or ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Only the logical clock is set; no headers are attached to any trigger call except where noted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "GET /orders"
              payload: {}
              as: "(both X-User-Role and X-User-ID headers omitted)"
              captures: { e1: $.data.error_id }
            - call: "GET /batches/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: "GroceryOps (an undeclared role, X-User-ID present)"
              captures: { e2: $.data.error_id }
            - call: "POST /batches"
              payload: { service_area_code: "SF-42", shop_window_start: "2026-08-01T11:00:00Z", shop_window_end: "2026-08-01T08:00:00Z" }
              as: "(X-User-Role header omitted)"
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 - the missing X-User-ID is enough even though GET /orders lists no owner scope"
            - "${e2} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_UNAUTHORIZED_ROLE and NOT ERR_BATCH_NOT_FOUND: an unrecognised role never reaches the priority-2 or priority-3 gates"
            - "${e3} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_INVALID_REQUEST, even though shop_window_end precedes shop_window_start"
