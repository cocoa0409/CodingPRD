          assert:
            - "setup left ${en1} REVOKED (captured ${st})"
            - "new track ${en2} created with status IN_TRAINING, logged_hours == 0, id != ${en1}"
            - "GET /piano-works/skill-endorsements?apprentice_id=${apr} returns total_count == 2"

