# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2718 — Customer Data Platform & Identity Resolution
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every instance grounds only in elements
# already declared in SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain starts from an
# empty DB, uses only §1.5 endpoints, and binds every ${var} from an earlier captures block.
# Every numeric assert is a literal computed against the §1.3 formula and its constants.
#
# Recurring actor ids (X-User-ID): u_admin (DataPlatformAdmin), u_eng (DataEngineer),
# u_steward (IdentitySteward), u_privacy (PrivacyOfficer), u_analyst / u_analyst_2
# (SegmentAnalyst), u_gov (DataGovernanceOfficer). DestinationPlatform is entity_backed, so
# its as_user_id is always the Destination id captured earlier in the same instance.

scaffold_difficulty_design:

  # =============================================================================
  # RULE 1 — dual_variant_calc
  # Differentiation required by §0.5: the two instances must live in DIFFERENT entity
  # domains. Instance 1 is the identity-graph domain (IdentityLink / MatchRule);
  # instance 2 is the activation-delivery domain (Activation / Destination).
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: confidence_strict_zero_vs_renormalize_forks_link_state
        grounds:
          - calculations.identity_match_confidence
          - entities.MatchRule.fields.missing_identifier_policy
          - entities.IdentityLink.fields.confidence
          - state_machines.IdentityLink.PROPOSED_to_CONFIRMED
          - endpoints[POST /cdp/identity-links]
        distinguishing_aspect: |
          Entity domain: the identity graph. Byte-identical evidence
          {email 1.0, phone 1.0, name 1.0, address null} scored under two MatchRules that differ
          only in missing_identifier_policy yields confidence 0.8500 (STRICT_ZERO, link stays
          PROPOSED) versus 1.0000 (RENORMALIZE, link is auto-CONFIRMED and a merge runs), a delta
          of exactly 0.1500 and two different IdentityLink states.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem POS_TXN, trust_tier 3, dq_scoring_mode WEIGHTED_COMPONENTS, pii_completeness_floor 0.70, status ACTIVE after the promote."
            - "One PROMOTED IngestBatch of four fully valid records (record_score 1.00 each, dq_score 1.00) that minted four RESOLVED Profiles with no links, because no MatchRule existed at promote time."
            - "Two PROBABILISTIC MatchRules created AFTER the promote with identical thresholds (review_floor 0.65, auto_merge_threshold 0.92, min_precision 0.40) and opposite missing_identifier_policy."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "POS_TXN"
                display_name: "POS Transactions"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
                dq_scoring_mode: "WEIGHTED_COMPONENTS"
                pii_completeness_floor: 0.70
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Four Clean Records"
                records:
                  - external_id: "R1"
                    email_raw: "r1@example.com"
                    phone_raw: "+1 (555) 010-0001"
                    loyalty_number: "LY00000001"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T10:00:00Z"
                    consent_signals: []
                  - external_id: "R2"
                    email_raw: "r2@example.com"
                    phone_raw: "+1 (555) 010-0002"
                    loyalty_number: "LY00000002"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T11:00:00Z"
                    consent_signals: []
                  - external_id: "R3"
                    email_raw: "r3@example.com"
                    phone_raw: "+1 (555) 010-0003"
                    loyalty_number: "LY00000003"
                    first_name: "Cleo"
                    last_name: "Charlie"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T12:00:00Z"
                    consent_signals: []
                  - external_id: "R4"
                    email_raw: "r4@example.com"
                    phone_raw: "+1 (555) 010-0004"
                    loyalty_number: "LY00000004"
                    first_name: "Dee"
                    last_name: "Delta"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T13:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}" }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures:
                p1_id: "$.data[0].id"
                p2_id: "$.data[1].id"
                p3_id: "$.data[2].id"
                p4_id: "$.data[3].id"
            - call: "POST /cdp/match-rules"
              payload:
                code: "PROB_STRICT"
                rule_kind: "PROBABILISTIC"
                deterministic_key: null
                missing_identifier_policy: "STRICT_ZERO"
                auto_merge_threshold: 0.92
                review_floor: 0.65
                min_precision: 0.40
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { rule_strict_id: "$.data.id" }
            - call: "POST /cdp/match-rules"
              payload:
                code: "PROB_RENORM"
                rule_kind: "PROBABILISTIC"
                deterministic_key: null
                missing_identifier_policy: "RENORMALIZE"
                auto_merge_threshold: 0.92
                review_floor: 0.65
                min_precision: 0.40
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { rule_renorm_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/identity-links"
              payload:
                left_profile_id: "${p1_id}"
                right_profile_id: "${p2_id}"
                match_rule_id: "${rule_strict_id}"
                evidence: { email_similarity: 1.0, phone_similarity: 1.0, name_similarity: 1.0, address_similarity: null }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures: { link_strict_id: "$.data.id" }
            - call: "POST /cdp/identity-links"
              payload:
                left_profile_id: "${p3_id}"
                right_profile_id: "${p4_id}"
                match_rule_id: "${rule_renorm_id}"
                evidence: { email_similarity: 1.0, phone_similarity: 1.0, name_similarity: 1.0, address_similarity: null }
              as: IdentitySteward
              as_user_id: "u_steward"
              captures: { link_renorm_id: "$.data.id" }
          assert:
            - "IdentityLink.${link_strict_id}.confidence == 0.8500"
            - "IdentityLink.${link_strict_id}.status == PROPOSED"
            - "IdentityLink.${link_strict_id}.survivor_profile_id == null"
            - "IdentityLink.${link_renorm_id}.confidence == 1.0000"
            - "IdentityLink.${link_renorm_id}.status == CONFIRMED"
            - "IdentityLink.${link_renorm_id}.decided_by_user_id == \"system\""
            - "IdentityLink.${link_renorm_id}.survivor_profile_id == ${p3_id}"
            - "IdentityLink.${link_renorm_id}.confidence - IdentityLink.${link_strict_id}.confidence == 0.1500"
            - "Profile.${p1_id}.resolution_status == RESOLVED"
            - "Profile.${p2_id}.resolution_status == RESOLVED"
            - "Profile.${p3_id}.resolution_status == RESOLVED"
            - "Profile.${p3_id}.source_record_count == 2"
            - "Profile.${p4_id}.resolution_status == MERGED_AWAY"
            - "Profile.${p4_id}.merged_into_profile_id == ${p3_id}"
            - "MatchRule.${rule_strict_id}.confirmed_count == 0"
            - "MatchRule.${rule_renorm_id}.confirmed_count == 1"
            - "MatchRule.${rule_renorm_id}.precision_estimate == 1.0"

      - name: match_rate_gross_vs_net_forks_activation_state
        grounds:
          - calculations.activation_match_rate
          - entities.Destination.fields.match_rate_basis
          - entities.Activation.fields.effective_match_rate
          - state_machines.Activation.DISPATCHED_to_ACTIVE
          - state_machines.Activation.DISPATCHED_to_UNDERPERFORMING
          - endpoints[POST /cdp/activations/{activationId}/match-report]
        distinguishing_aspect: |
          Entity domain: activation delivery and measurement — a different domain from the
          identity graph of the sibling instance. One identical report
          (dispatched_hash_count 3, vendor_matched_count 2, unusable_hash_count 1) yields
          gross_match_rate 0.6667 and net_match_rate 1.0000 on BOTH activations, but the
          GROSS destination lands UNDERPERFORMING while the NET destination lands ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem LOYALTY_A, trust_tier 4, default WEIGHTED_COMPONENTS scoring."
            - "One PROMOTED batch of three fully valid records, each carrying an EMAIL/MARKETING OPT_IN consent signal, so all three Profiles have activatable_channels containing EMAIL and a non-null email_norm."
            - "Two Destinations on channel EMAIL with hashing SHA256_EMAIL_LOWER, min_match_rate 0.70, min_audience_size 3, daily_hash_quota 100: ESP_GROSS with match_rate_basis GROSS and ESP_NET with match_rate_basis NET."
            - "One APPROVED Segment on postal_code EQ 10001 with member_count 3, and one DISPATCHED Activation on each destination with dispatched_hash_count 3."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "LOYALTY_A"
                display_name: "Loyalty A"
                channel_type: "LOYALTY"
                trust_tier: 4
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Opted In Trio"
                records:
                  - external_id: "T1"
                    email_raw: "t1@example.com"
                    phone_raw: "+1 (555) 020-0001"
                    loyalty_number: "LY00000101"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T10:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
                  - external_id: "T2"
                    email_raw: "t2@example.com"
                    phone_raw: "+1 (555) 020-0002"
                    loyalty_number: "LY00000102"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T11:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
                  - external_id: "T3"
                    email_raw: "t3@example.com"
                    phone_raw: "+1 (555) 020-0003"
                    loyalty_number: "LY00000103"
                    first_name: "Cleo"
                    last_name: "Charlie"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-01T12:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/destinations"
              payload:
                code: "ESP_GROSS"
                platform_kind: "MESSAGING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 100
                match_rate_basis: "GROSS"
                min_match_rate: 0.70
                min_audience_size: 3
                cooldown_minutes: 60
                max_concurrent_activations: 2
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { d_gross_id: "$.data.id" }
            - call: "POST /cdp/destinations"
              payload:
                code: "ESP_NET"
                platform_kind: "MESSAGING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 100
                match_rate_basis: "NET"
                min_match_rate: 0.70
                min_audience_size: 3
                cooldown_minutes: 60
                max_concurrent_activations: 2
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { d_net_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Zip 10001 Base"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v_after_approve: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${d_gross_id}"
                window_start_at: "2026-08-02T00:00:00Z"
                window_end_at: "2026-08-02T02:00:00Z"
                expected_segment_version: "${seg_v_after_approve}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_gross_id: "$.data.id" }
            - call: "GET /cdp/segments/${seg_id}"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_v_after_first_activation: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${d_net_id}"
                window_start_at: "2026-08-02T00:00:00Z"
                window_end_at: "2026-08-02T02:00:00Z"
                expected_segment_version: "${seg_v_after_first_activation}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_net_id: "$.data.id" }
            - call: "POST /cdp/activations/${act_gross_id}/dispatch"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/activations/${act_net_id}/dispatch"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          trigger:
            - call: "POST /cdp/activations/${act_gross_id}/match-report"
              payload: { vendor_matched_count: 2, unusable_hash_count: 1 }
              as: DestinationPlatform
              as_user_id: "${d_gross_id}"
            - call: "POST /cdp/activations/${act_net_id}/match-report"
              payload: { vendor_matched_count: 2, unusable_hash_count: 1 }
              as: DestinationPlatform
              as_user_id: "${d_net_id}"
          assert:
            - "Activation.${act_gross_id}.dispatched_hash_count == 3"
            - "Activation.${act_gross_id}.gross_match_rate == 0.6667"
            - "Activation.${act_gross_id}.net_match_rate == 1.0000"
            - "Activation.${act_gross_id}.effective_match_rate == 0.6667"
            - "Activation.${act_gross_id}.status == UNDERPERFORMING"
            - "Activation.${act_net_id}.gross_match_rate == 0.6667"
            - "Activation.${act_net_id}.net_match_rate == 1.0000"
            - "Activation.${act_net_id}.effective_match_rate == 1.0000"
            - "Activation.${act_net_id}.status == ACTIVE"
            - "Destination.${d_gross_id}.underperforming_activation_count == 1"
            - "Destination.${d_net_id}.underperforming_activation_count == 0"
            - "Segment.${seg_id}.member_count == 3"

  # =============================================================================
  # RULE 2 — combinatorial_formula
  # Differentiation required by §0.5: the two instances must occupy DIFFERENT modes.
  # Instance 1 is mode (a): >= 3 inputs combined non-linearly with conditional branches
  # (five weighted components x a three-way mode switch x a FAIL-only penalty x a floor at 0).
  # Instance 2 is mode (b): a nested rounding order where rounding early vs late changes the
  # answer, and the scaffold pins the order.
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dq_score_penalized_weighted_branches_on_fail_vs_absent
        grounds:
          - calculations.batch_data_quality_score
          - calculations.source_system_dq_pass_rate
          - entities.SourceSystem.fields.dq_scoring_mode
          - entities.IngestBatch.fields.dq_failure_breakdown
          - state_machines.IngestBatch.RECEIVED_to_VALIDATED
          - state_machines.IngestBatch.RECEIVED_to_QUARANTINED
        distinguishing_aspect: |
          Mode (a): three or more inputs combined non-linearly. record_score folds five weighted
          components through a three-way mode switch, and PENALIZED_WEIGHTED alone subtracts
          MALFORMED_PENALTY per FAIL component and floors the result at 0.00 — so the SAME three
          records score dq_score 0.68 under PENALIZED_WEIGHTED and 0.72 under
          WEIGHTED_COMPONENTS, which straddles the 0.70 floor and sends one batch to QUARANTINED
          and the other to VALIDATED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two SourceSystems with identical pii_completeness_floor 0.70 and different dq_scoring_mode: SRC_PEN is PENALIZED_WEIGHTED, SRC_WGT is WEIGHTED_COMPONENTS."
            - "Each source receives one RECEIVED IngestBatch holding the same three records: R1 all five components PASS; R2 email/name/postal PASS, phone present but malformed (FAIL), loyalty_number null (ABSENT); R3 phone/loyalty/name PASS, email null and postal null (both ABSENT)."
            - "Neither source has reached DQ_MIN_SAMPLE (5) submitted records, so no source-level quarantine can fire."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "SRC_PEN"
                display_name: "Support Feed Penalized"
                channel_type: "SUPPORT"
                trust_tier: 3
                dq_scoring_mode: "PENALIZED_WEIGHTED"
                pii_completeness_floor: 0.70
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_pen_id: "$.data.id" }
            - call: "POST /cdp/source-systems"
              payload:
                code: "SRC_WGT"
                display_name: "Support Feed Weighted"
                channel_type: "SUPPORT"
                trust_tier: 3
                dq_scoring_mode: "WEIGHTED_COMPONENTS"
                pii_completeness_floor: 0.70
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_wgt_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_pen_id}"
                batch_label: "Mixed Quality Penalized"
                records:
                  - external_id: "M1"
                    email_raw: "m1@example.com"
                    phone_raw: "+1 (555) 030-0001"
                    loyalty_number: "LY00000201"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-02T10:00:00Z"
                    consent_signals: []
                  - external_id: "M2"
                    email_raw: "m2@example.com"
                    phone_raw: "555-01"
                    loyalty_number: null
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10002"
                    address_line: null
                    event_timestamp: "2026-07-02T11:00:00Z"
                    consent_signals: []
                  - external_id: "M3"
                    email_raw: null
                    phone_raw: "+1 (555) 030-0003"
                    loyalty_number: "LY00000203"
                    first_name: "Cleo"
                    last_name: "Charlie"
                    postal_code: null
                    address_line: null
                    event_timestamp: "2026-07-02T12:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_pen_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_wgt_id}"
                batch_label: "Mixed Quality Weighted"
                records:
                  - external_id: "M1"
                    email_raw: "w1@example.com"
                    phone_raw: "+1 (555) 040-0001"
                    loyalty_number: "LY00000301"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-02T10:00:00Z"
                    consent_signals: []
                  - external_id: "M2"
                    email_raw: "w2@example.com"
                    phone_raw: "555-01"
                    loyalty_number: null
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10002"
                    address_line: null
                    event_timestamp: "2026-07-02T11:00:00Z"
                    consent_signals: []
                  - external_id: "M3"
                    email_raw: null
                    phone_raw: "+1 (555) 040-0003"
                    loyalty_number: "LY00000303"
                    first_name: "Cleo"
                    last_name: "Charlie"
                    postal_code: null
                    address_line: null
                    event_timestamp: "2026-07-02T12:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_wgt_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/ingest-batches/${batch_pen_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_wgt_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
          assert:
            - "IngestBatch.${batch_pen_id}.dq_score == 0.68"
            - "IngestBatch.${batch_pen_id}.valid_record_count == 1"
            - "IngestBatch.${batch_pen_id}.invalid_record_count == 2"
            - "IngestBatch.${batch_pen_id}.dq_failure_breakdown == { \"phone_norm\": 1 }"
            - "IngestBatch.${batch_pen_id}.status == QUARANTINED"
            - "IngestBatch.${batch_wgt_id}.dq_score == 0.72"
            - "IngestBatch.${batch_wgt_id}.valid_record_count == 2"
            - "IngestBatch.${batch_wgt_id}.invalid_record_count == 1"
            - "IngestBatch.${batch_wgt_id}.dq_failure_breakdown == { \"phone_norm\": 1 }"
            - "IngestBatch.${batch_wgt_id}.status == VALIDATED"
