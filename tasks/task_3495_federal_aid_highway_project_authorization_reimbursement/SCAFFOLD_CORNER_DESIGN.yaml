# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3495_federal_aid_highway_project_authorization_reimbursement
# Breadth probe across the claim-extraction-guide taxonomy. Claims already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: funding_program_create_computes_base_share_from_code
        claim_type: creation
        grounds:
          - entities.FundingProgram.fields.base_federal_share_pct
          - endpoints.POST_/federal-aid/funding-programs
        distinguishing_aspect: "HSIP maps to base 0.90 and TAP to 0.80 from CONST.BASE_SHARE_*; the computed field is server-derived and the 201 response carries version 1 plus system id/created_at/updated_at."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "HSIP", name: "Safety", eligible_activity_codes: ["SIGNAGE_LIGHTING"] }
              as: PlatformAdmin
              captures: { hsip_id: $.data.id, hsip_share: $.data.base_federal_share_pct, hsip_v: $.data.version }
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "TAP", name: "Alternatives", eligible_activity_codes: ["PEDESTRIAN_CROSSING"] }
              as: PlatformAdmin
              captures: { tap_share: $.data.base_federal_share_pct }
          assert:
            - "FundingProgram.${hsip_id}.base_federal_share_pct == 0.90 and version == 1"
            - "the TAP program's base_federal_share_pct == 0.80"
            - "both responses are 201 with response_type object and meta.api_request_id present"

      - name: apportionment_create_initializes_available_to_apportioned
        claim_type: creation
        grounds:
          - entities.Apportionment.fields.available_cents
          - endpoints.POST_/federal-aid/apportionments
        distinguishing_aspect: "A fresh apportionment starts with obligated_cents 0 and available_cents equal to apportioned_cents exactly."
        test_recipe:
          setup: ["NHPP program registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "OR", federal_fiscal_year: 2027, apportioned_cents: 750000 }
              as: FHWADivisionAdmin
              captures: { ap_id: $.data.id, avail: $.data.available_cents, oblig: $.data.obligated_cents }
          assert:
            - "Apportionment.${ap_id}.obligated_cents == 0 and available_cents == 750000"

      - name: duplicate_apportionment_cell_rejected
        claim_type: type_constraints
        grounds:
          - entities.Apportionment.fields.uniqueness
          - errors.ERR_DUPLICATE_APPORTIONMENT
        distinguishing_aspect: "A second row for the same (funding_program_id, state_code, federal_fiscal_year) is rejected with 409 ERR_DUPLICATE_APPORTIONMENT, while the same program in a different FFY is accepted."
        test_recipe:
          setup: ["NHPP program; one OR FFY-2027 apportionment exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "OR", federal_fiscal_year: 2027, apportioned_cents: 750000 }
              as: FHWADivisionAdmin
          trigger:
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "OR", federal_fiscal_year: 2027, apportioned_cents: 100 }
              as: FHWADivisionAdmin
              captures: { err: $.data.error_id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "OR", federal_fiscal_year: 2028, apportioned_cents: 100 }
              as: FHWADivisionAdmin
              captures: { ok_id: $.data.id }
          assert:
            - "the duplicate cell fails with ERR_DUPLICATE_APPORTIONMENT"
            - "the FFY-2028 row succeeds with 201"

      - name: stip_create_derives_window_end_year_and_initial_status
        claim_type: defaults
        grounds:
          - entities.StateProgram.fields.end_federal_fiscal_year
          - entities.StateProgram.fields.comment_period_opened_at
          - state_machines.StateProgram
        distinguishing_aspect: "A STIP created at clock 2026-09-01T00:00:00Z starts PUBLIC_INVOLVEMENT with comment_period_opened_at equal to the creation clock, end_federal_fiscal_year == start + 3, amendment_count 0, total_programmed_federal_cents 0."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.42, start_federal_fiscal_year: 2028, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id, st: $.data.status, opened: $.data.comment_period_opened_at, end_fy: $.data.end_federal_fiscal_year, amend: $.data.amendment_count }
          assert:
            - "StateProgram.${stip_id}.status == PUBLIC_INVOLVEMENT"
            - "comment_period_opened_at == 2026-09-01T00:00:00Z (the logical clock at creation)"
            - "end_federal_fiscal_year == 2031 and amendment_count == 0 and total_programmed_federal_cents == 0"

      - name: public_comment_response_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.PublicComment
          - endpoints.POST_/federal-aid/stips/{id}/comments
        distinguishing_aspect: "PublicComment carries common_fields false: the 201 response exposes id and created_at but no version and no updated_at, and no update or delete endpoint exists for it."
        test_recipe:
          setup: ["A STIP in PUBLIC_INVOLVEMENT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "Resident", comment_text: "Supportive." }
              as: StateDOTPlanner
              captures: { c_id: $.data.id }
          assert:
            - "the 201 response data contains non-null id and created_at"
            - "the response data has no version key and no updated_at key"
            - "GET /federal-aid/stips/${stip_id}/comments returns the comment as the sole row"

      - name: project_create_computes_provisional_from_program_base
        claim_type: computed_fields
        grounds:
          - entities.Project.fields.provisional_federal_share_pct
          - entities.Project.fields.provisional_federal_estimate_cents
        distinguishing_aspect: "For a CMAQ project costing 5,000,001 cents the provisional share is the flat base 0.80 and the estimate is round_half_up(5,000,001 x 0.80) == 4,000,001 (half-cent rounds up), with status NOMINATED."
        test_recipe:
          setup: ["CMAQ program; STIP in PUBLIC_INVOLVEMENT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "CMAQ", name: "CMAQ", eligible_activity_codes: ["TRANSIT_EXPANSION", "ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "AZ-51", description: "Transit", activity_code: "TRANSIT_EXPANSION", is_interstate_system: false, dbe_goal_pct: 0.12, total_estimated_cost_cents: 5000001 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id, share: $.data.provisional_federal_share_pct, est: $.data.provisional_federal_estimate_cents, st: $.data.status }
          assert:
            - "Project.${p_id}.provisional_federal_share_pct == 0.80"
            - "Project.${p_id}.provisional_federal_estimate_cents == 4000001"
            - "Project.${p_id}.status == NOMINATED and determined_federal_share_pct is null"

      - name: project_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/federal-aid/projects/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated project id yields 404 ERR_NOT_FOUND with the standard error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /federal-aid/projects/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: FHWAReviewer
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with data.error_id == ERR_NOT_FOUND"

      - name: project_create_missing_required_activity_code_returns_400
        claim_type: required_fields
        grounds:
          - entities.Project.fields.activity_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required activity_code from project creation yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["Program and STIP exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "AZ-51", description: "No activity", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000 }
              as: StateDOTPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /federal-aid/projects?stip_id=${stip_id} returns an empty array with total_count 0"

      - name: project_create_invalid_enum_activity_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.Project.fields.activity_code
          - constants.ACTIVITY_CODES
        distinguishing_aspect: "An activity_code outside CONST.ACTIVITY_CODES is a 400 ERR_INVALID_REQUEST even though the string is well-formed."
        test_recipe:
          setup: ["Program and STIP exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "AZ-51", description: "Bad activity", activity_code: "SKYSCRAPER", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000 }
              as: StateDOTPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: projects_list_filters_by_stip_and_status_with_pagination
        claim_type: listing
        grounds:
          - endpoints.GET_/federal-aid/projects
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three projects under one STIP, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; status=NOMINATED matches all three."
        test_recipe:
          setup: ["One STIP holding three NOMINATED projects."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R1", description: "P1", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000 }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R2", description: "P2", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 2000 }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R3", description: "P3", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 3000 }
              as: StateDOTPlanner
          trigger:
            - call: "GET /federal-aid/projects"
              payload: { stip_id: "${stip_id}", limit: 2, offset: 0 }
              as: FHWAReviewer
            - call: "GET /federal-aid/projects"
              payload: { stip_id: "${stip_id}", limit: 2, offset: 2 }
              as: FHWAReviewer
            - call: "GET /federal-aid/projects"
              payload: { stip_id: "${stip_id}", status: "NOMINATED" }
              as: FHWAReviewer
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "the status=NOMINATED filter returns 3 rows"
            - "GET /federal-aid/projects?stip_id=${stip_id}&status=ELIGIBLE returns 0 rows"

      - name: clearance_create_row_kind_with_nepa_class_rejected
        claim_type: type_constraints
        grounds:
          - entities.ProjectClearance.fields.nepa_class
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Conditional field rule: kind RIGHT_OF_WAY with a non-null nepa_class is a 400 ERR_INVALID_REQUEST, while kind ENVIRONMENTAL without nepa_class is likewise a 400."
        test_recipe:
          setup: ["An ELIGIBLE project exists (STIP approved, determination done)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "C", comment_text: "Ok." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R1", description: "P1", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects/${p_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
          trigger:
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "RIGHT_OF_WAY", nepa_class: "CE" }
              as: StateDOTEngineer
              captures: { err1: $.data.error_id }
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "ENVIRONMENTAL" }
              as: StateDOTEngineer
              captures: { err2: $.data.error_id }
          assert:
            - "RIGHT_OF_WAY with nepa_class set fails with ERR_INVALID_REQUEST"
            - "ENVIRONMENTAL without nepa_class fails with ERR_INVALID_REQUEST"
            - "GET /federal-aid/projects/${p_id}/clearances returns an empty array"

      - name: voucher_create_with_empty_line_items_rejected
        claim_type: type_constraints
        grounds:
          - entities.Voucher.fields.line_items
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "line_items must be a non-empty array; an empty array is a 400 ERR_INVALID_REQUEST before any state or fiscal check runs."
        test_recipe:
          setup: ["An UNDER_CONSTRUCTION project with an OBLIGATED authorization (full standard chain)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "AZ", federal_fiscal_year: 2027, apportioned_cents: 1000000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "C", comment_text: "Ok." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R1", description: "P1", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 100000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects/${p_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "ENVIRONMENTAL", nepa_class: "CE" }
              as: StateDOTEngineer
              captures: { c_env: $.data.id }
            - call: "POST /federal-aid/clearances/${c_env}/decide"
              payload: { decision: "CLEARED" }
              as: FHWAReviewer
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "RIGHT_OF_WAY" }
              as: StateDOTEngineer
              captures: { c_row: $.data.id }
            - call: "POST /federal-aid/clearances/${c_row}/decide"
              payload: { decision: "CLEARED", row_cert_level: "LEVEL_1_FULL" }
              as: FHWAReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/authorizations"
              payload: { project_id: "${p_id}", agreement_number: "FA-VE", initial_obligated_cents: 80000 }
              as: FHWADivisionAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /federal-aid/projects/${p_id}/advertise"
              payload: {}
              as: StateDOTEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/projects/${p_id}/open-bids"
              payload: { bids: [{ contractor_name: "Low", bid_amount_cents: 90000, is_responsive: true }] }
              as: StateDOTEngineer
            - call: "GET /federal-aid/projects/${p_id}/bids"
              payload: {}
              as: FHWAReviewer
              captures: { bid0: "$.data[0].id" }
            - call: "POST /federal-aid/projects/${p_id}/award"
              payload: { bid_id: "${bid0}", dbe_commitment_pct: 0.10 }
              as: FHWAReviewer
          trigger:
            - call: "POST /federal-aid/vouchers"
              payload: { authorization_id: "${auth_id}", period_start_date: "2027-01-01T00:00:00Z", period_end_date: "2027-02-01T00:00:00Z", line_items: [], documentation_complete: true, is_final: false }
              as: StateDOTEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 ERR_INVALID_REQUEST and no voucher is created"

      - name: project_create_client_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Project
          - endpoints.POST_/federal-aid/projects
        distinguishing_aspect: "A client-supplied id (and created_at) in the create payload is ignored: the server mints its own UUID id and stamps created_at from the logical clock."
        test_recipe:
          setup: ["Program and STIP exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/projects"
              payload: { id: "99999999-9999-4999-8999-999999999999", created_at: "1999-01-01T00:00:00Z", stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R1", description: "P1", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 1000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id, p_created: $.data.created_at }
          assert:
            - "the response is 201 and the returned id differs from 99999999-9999-4999-8999-999999999999"
            - "created_at == 2026-09-01T00:00:00.000Z (logical clock), not the client-supplied 1999 value"

