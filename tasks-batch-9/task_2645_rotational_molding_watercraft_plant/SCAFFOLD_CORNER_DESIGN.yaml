          - state_machines.Mold.AVAILABLE_to_RETIRED
        distinguishing_aspect: "replaces_mold_id is the scaffold's only self-referential FK, and it is the one FK whose target must satisfy a STATE condition as well as existence: an unresolvable target gives ERR_MOLD_NOT_FOUND while a target that exists but is still AVAILABLE, or is RETIRED under a different hull model, gives ERR_INVALID_MOLD_REPLACEMENT."
