  - section: calculations
    instances:
      - name: charge_chain_walks_all_twelve_steps_for_a_mixed_format_order
        claim_type: correct_result
        grounds:
          - calculations.order_charge_evaluation_chain
          - calculations.order_excise_tax_cents
          - calculations.order_sales_tax_cents
          - entities.Order.fields.total_cents
          - entities.OrderLine.fields.line_taxable_cents
          - endpoints.POST_/dtc/orders
        distinguishing_aspect: |
          Every one of the twelve pinned steps has its own stored field, so the whole chain is asserted
          field by field on a single order rather than through total_cents alone: an implementation that gets
          the right total by a wrong route still fails. The order mixes a 3000 ml magnum line with a 750 ml
          line, so the large-format surcharge covers only 6.000 of the 7.500 liters, and two of the round_half_up
          steps land on a true half (412.5 -> 413) and on 79.95 -> 80.
