  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_window_overlap_half_open
        grounds:
          - validations[priority=12]
          - entities.Route.fields.scheduled_start
          - entities.Route.fields.scheduled_end
          - errors[ERR_DRIVER_SCHEDULE_CONFLICT]
        distinguishing_aspect: "Driver resource, pure half-open interval arithmetic: route1 [09:00,11:00) and route2 [10:00,12:00) overlap so the second driver assignment fails ERR_DRIVER_SCHEDULE_CONFLICT; adjacency (end==start) would NOT conflict."
        test_recipe:
          setup:
            - "Driver assigned to route1 [09:00,11:00); route2 [10:00,12:00) overlaps and uses a distinct AVAILABLE vehicle"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh1: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V2", has_refrigeration: true }, as: Dispatcher, captures: { veh2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt1}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh1}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T10:00:00Z", scheduled_end: "2026-05-05T12:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt2: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt2}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh2}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DRIVER_SCHEDULE_CONFLICT"

      - name: vehicle_sanitation_buffer_gap
        grounds:
          - validations[priority=13]
          - entities.Vehicle.fields.sanitation_buffer_minutes
          - entities.Vehicle.fields.last_released_at
          - errors[ERR_VEHICLE_BUFFER_CONFLICT]
        distinguishing_aspect: "Vehicle resource, buffered-interval arithmetic (NOT pure overlap): after route1 completes at 12:00 releasing the vehicle, route2 whose scheduled_start 12:15 falls inside the 30-min sanitation buffer (12:00+30=12:30) fails ERR_VEHICLE_BUFFER_CONFLICT."
        test_recipe:
          setup:
            - "Vehicle buffer 30 min; route1 (1 stop) assigned+dispatched, its stop missed, then completed at clock 12:00 -> vehicle AVAILABLE, last_released_at 12:00"
            - "route2 scheduled_start 12:15 (< 12:30) assigned with a distinct driver reusing the vehicle"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "D1", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { d1: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "D2", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { d2: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true, sanitation_buffer_minutes: 30 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt1}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt1}/assign", payload: { driver_id: "${d1}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt1}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/miss", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt1}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T12:15:00Z", scheduled_end: "2026-05-05T14:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt2: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt2}/assign", payload: { driver_id: "${d2}", vehicle_id: "${veh}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VEHICLE_BUFFER_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: billing_issue_void_conserves_lab_money
        grounds:
          - state_machines.RunBilling.DRAFT_to_ISSUED
          - state_machines.RunBilling.ISSUED_to_VOIDED
          - calculations.lab_billed_balance
          - entities.LabClient.fields.billed_balance_cents
        distinguishing_aspect: "Conserved quantity = money: issuing a billing debits lab.billed_balance_cents by net (2599) and voiding credits exactly the same amount back, leaving billed_balance_cents == 0 == sum(ISSUED net) — no monetary drift."
        test_recipe:
          setup:
            - "A completed SCHEDULED route with final_charge 2599; billing generated (net 2599) and issued, then voided"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 5.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/routes/${rt}/complete", payload: {}, as: Dispatcher, captures: { rv: $.data.version } }
            - { call: "POST /med-courier/routes/${rt}/billing", payload: { expected_route_version: "${rv}" }, as: Dispatcher, captures: { bill: $.data.id } }
            - { call: "POST /med-courier/billings/${bill}/issue", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/billings/${bill}/void", payload: {}, as: Dispatcher }
          assert:
            - "RunBilling.${bill}.net_charge_cents == 2599"
            - "LabClient.${lab}.billed_balance_cents == 0"
            - "RunBilling.${bill}.status == VOIDED"

      - name: specimen_custody_count_conserved
        grounds:
          - state_machines.Specimen.AWAITING_PICKUP_to_IN_TRANSIT
          - state_machines.Specimen.AWAITING_PICKUP_to_EXCEPTION
          - entities.Specimen.fields.custody_status
        distinguishing_aspect: "Conserved quantity = specimen count: after the forward pickup (spec1 -> IN_TRANSIT) and the compensating miss (spec2 -> EXCEPTION), count(AWAITING)+count(IN_TRANSIT)+count(DELIVERED)+count(EXCEPTION) == 2 (total registered) — the custody-bucket sum never drifts."
        test_recipe:
          setup:
            - "Dispatched route with 3 stops (PICKUP s1, PICKUP s2, DROPOFF s3); spec1 pickup@s1, spec2 pickup@s2, both dropoff@s3"
            - "spec1 picked up at s1 (IN_TRANSIT); stop s2 missed so spec2 -> EXCEPTION"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.0 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "PICKUP", planned_leg_miles: 2.0 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 3, address: "C", stop_kind: "DROPOFF", planned_leg_miles: 2.0 }, as: Dispatcher, captures: { s3: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s3}", specimen_type: "BLOOD", temp_requirement: "AMBIENT", required_temp_min_c: 15, required_temp_max_c: 25 }, as: Dispatcher, captures: { sp1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s2}", dropoff_stop_id: "${s3}", specimen_type: "URINE", temp_requirement: "AMBIENT", required_temp_min_c: 15, required_temp_max_c: 25 }, as: Dispatcher, captures: { sp2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${sp1}", scan_type: "PICKUP", temp_reading_c: 20.0, leg_miles: 2.0 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /med-courier/stops/${s2}/miss", payload: {}, as: Dispatcher }
          assert:
            - "Specimen.${sp1}.custody_status == IN_TRANSIT"
            - "Specimen.${sp2}.custody_status == EXCEPTION"
            - "GET /med-courier/specimens?route_id=${rt} returns exactly 2 specimens (1 IN_TRANSIT + 1 EXCEPTION == 2 total registered; invariant holds)"
