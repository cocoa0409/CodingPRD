# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3040_storm_ready_limited_menu_activation_continuous_operations
# Nine Difficulty Rules x 2 instances = 18 instances.
# Every chain drives empty-DB -> precondition state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: relief_reimbursement_conservative_vs_actual
        grounds:
          - calculations.relief_reimbursement
          - calculations.relief_reimbursement_final
          - state_machines.ReliefPledge.PLEDGED_to_CONFIRMED
        distinguishing_aspect: |
          Same pledge inputs (meal_count=16, served_count=20) produce two
          different payer-owed amounts on the ReliefPledge entity domain: the
          conservative variant caps eligible meals at meal_count
          (reimbursement_cents == 4630) while the actual variant posted by
          run-report pays the served overage (final_reimbursement_cents ==
          5556) — a dual-variant split on relief liability accounting.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T08:00:00Z."
            - "Storm WATCH; unit U with power DOWN (menu_tier TIER1_NO_POWER)."
            - "ReliefOrg R ACTIVE; pledge of 16 meals for service_date 2026-09-10 (the current day, so the service day has begun)."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-101", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/relief-orgs"
              payload: { name: "Red Shield Relief", contact_email: "ops@redshield.example" }
              as: ReliefCoordinator
              captures: { org: $.data.id }
            - call: "POST /ops/units/${u}/relief-pledges"
              payload: { relief_org_id: "${org}", meal_count: 16, service_date: "2026-09-10" }
              as: ReliefCoordinator
              captures: { pledge: $.data.id }
            - call: "POST /ops/units/${u}/relief-pledges/${pledge}/confirm"
              payload: { served_count: 20 }
              as: ReliefCoordinator
              captures: { cons_amt: $.data.reimbursement_cents }
          trigger:
            - call: "POST /ops/run-report"
              payload: {}
              as: CommandCenterAdmin
              captures: { finalized: $.data.pledges_finalized }
            - call: "GET /ops/units/${u}/relief-pledges"
              payload: {}
              as: ReliefCoordinator
              captures: { final_amt: "$.data[0].final_reimbursement_cents" }
          assert:
            - "ReliefPledge.${pledge}.overage_meals == 4 and shortfall_meals == 0"
            - "conservative variant: eligible 16 meals, gross 4000 (tier 2), liability 4000+1000=5000, tax floor(5000*800/10800)=370 -> ReliefPledge.${pledge}.reimbursement_cents == 4630"
            - "run-report response pledges_finalized == 1"
            - "actual variant: eligible 20 meals, gross 5000 (tier 2), liability 5000+1000=6000, tax floor(6000*800/10800)=444 -> ReliefPledge.${pledge}.final_reimbursement_cents == 5556"
            - "ReliefPledge.${pledge}.final_reimbursement_cents != ReliefPledge.${pledge}.reimbursement_cents"

      - name: menu_tier_priority_vs_cash_only_axis
        grounds:
          - calculations.menu_tier_derivation
          - entities.Unit.fields.menu_tier
          - entities.Unit.fields.cash_only_flag
        distinguishing_aspect: |
          Two derivations read the same ConditionReport on the Unit entity
          domain (a different domain from ReliefPledge): menu_tier applies
          strict axis priority (power DOWN dominates water and gas DOWN, so a
          triple-outage yields TIER1_NO_POWER), while cash_only_flag reads the
          independent payment axis — one report sets menu_tier ==
          TIER1_NO_POWER AND cash_only_flag == true in the same report application.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T08:00:00Z. Storm WATCH with unit U, all axes UP (menu_tier FULL, cash_only_flag false)."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-101", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id, u_tier0: $.data.menu_tier }
          trigger:
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "DOWN", gas: "DOWN", payment_network: "DOWN" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { u_tier: $.data.menu_tier, u_cash: $.data.cash_only_flag }
          assert:
            - "Unit.${u}.menu_tier == TIER1_NO_POWER (power dominates water and gas)"
            - "Unit.${u}.cash_only_flag == true (payment axis independent of menu derivation)"
            - "Unit.${u}.resource_status.power == DOWN and .water == DOWN and .gas == DOWN and .payment_network == DOWN"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: relief_tiered_bonus_with_tax_extraction
        grounds:
          - calculations.relief_reimbursement
          - calculations.relief_reimbursement.constants
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs (served_count, meal_count,
          tier-selected bonus) and non-linear interaction — the tier is keyed
          on gross liability, the bonus is added before the shortfall penalty
          is subtracted, and the tax-inclusive floor extraction is applied
          last. meal_count=12, served_count=12 lands gross exactly on the
          3000-cent tier boundary (>= selects tier 2).
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH, unit U with gas DOWN only (TIER3_NO_GAS). ReliefOrg ACTIVE. Pledge of 12 meals for 2026-09-10."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-202", address: "5 Ridge Rd" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/relief-orgs"
              payload: { name: "Red Shield Relief", contact_email: "ops@redshield.example" }
              as: ReliefCoordinator
              captures: { org: $.data.id }
            - call: "POST /ops/units/${u}/relief-pledges"
              payload: { relief_org_id: "${org}", meal_count: 12, service_date: "2026-09-10" }
              as: ReliefCoordinator
              captures: { pledge: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/relief-pledges/${pledge}/confirm"
              payload: { served_count: 12 }
              as: ReliefCoordinator
              captures: { p_net: $.data.reimbursement_cents, p_short: $.data.shortfall_meals, p_pen: $.data.shortfall_penalty_cents }
          assert:
            - "ReliefPledge.${pledge}.shortfall_meals == 0 and overage_meals == 0"
            - "ReliefPledge.${pledge}.shortfall_penalty_cents == 0"
            - "gross = 12*250 = 3000 exactly at the tier-2 boundary (>= 3000), liability 3000+1000 = 4000, tax floor(4000*800/10800) = 296 -> ReliefPledge.${pledge}.reimbursement_cents == 3704"

      - name: cold_hold_deadline_evaluation_order
        grounds:
          - calculations.cold_hold_discard_deadline
          - state_machines.ChecklistRun.IN_PROGRESS_to_SUBMITTED
          - validations[priority=6]
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency — reopen eligibility depends
          on the LATEST report (step 1), whose all-clear status feeds the 4h
          deadline (steps 2-4); the pinned evaluation order means an all-clear
          report at 10:00 with the clock at 14:00:01 rejects the submit with
          ERR_COLD_HOLD_EXPIRED even though every checklist item is PASS and
          all axes are UP.
        test_recipe:
          setup:
            - "Storm ACTIVE. Unit U: power-DOWN report at 09:00 (TIER1 menu activated), all-clear report at 2026-09-10T10:00:00Z. Checklist run opened with all five items PASS. Clock advanced to 14:00:01 — one second past the cold-hold deadline."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-303", address: "9 Coast Hwy" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/menu-activations"
              payload: { tier: "TIER1_NO_POWER" }
              as: UnitManager
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists"
              payload: {}
              as: UnitManager
              captures: { run: $.data.id }
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "POWER_RESTORED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "WATER_POTABLE", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "FOOD_DISCARD_LOGGED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "CASH_DRAWER_COUNTED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T14:00:01Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/units/${u}/checklists/${run}/submit"
              payload: {}
              as: UnitManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_COLD_HOLD_EXPIRED (all-clear at 10:00, deadline 14:00, submit at 14:00:01 is strictly past)"
            - "ChecklistRun.${run}.status == IN_PROGRESS (submit rejected; no state change)"
            - "ChecklistRun.${run}.submitted_at == null"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: storm_event_watch_warning_cycle
        grounds:
          - state_machines.StormEvent.WATCH_to_WARNING
          - state_machines.StormEvent.WARNING_to_WATCH
          - entities.StormEvent.fields.warning_count
        distinguishing_aspect: |
          Cyclic machine on StormEvent: WATCH -> WARNING -> WATCH -> WARNING
          loops freely and warning_count increments on each re-entry (== 2
          after the second escalation) — non-linear shape on StormEvent.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm created (WATCH, version 1)."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
          trigger:
            - call: "POST /ops/storm-events/${se}/escalate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
              captures: { se_v2: $.data.version }
            - call: "POST /ops/storm-events/${se}/deescalate"
              payload: { expected_storm_event_version: "${se_v2}" }
              as: CommandCenterAdmin
              captures: { se_v3: $.data.version }
            - call: "POST /ops/storm-events/${se}/escalate"
              payload: { expected_storm_event_version: "${se_v3}" }
              as: CommandCenterAdmin
              captures: { se_v4: $.data.version, se_wc: $.data.warning_count, se_status: $.data.status }
          assert:
            - "StormEvent.${se}.status == WARNING after the loop WATCH->WARNING->WATCH->WARNING"
            - "StormEvent.${se}.warning_count == 2"
            - "StormEvent.${se}.version == 4"

      - name: unit_resource_parallel_axes
        grounds:
          - state_machines.Resource
          - entities.Unit.fields.resource_status
          - calculations.menu_tier_derivation
        distinguishing_aspect: |
          Parallel state dimensions on the Unit entity (different entity from
          StormEvent): the four resource axes evolve independently — flipping
          only water DOWN moves menu_tier FULL -> TIER2_NO_WATER while power
          and gas stay UP, then restoring only water returns menu_tier to FULL
          without touching the other axes.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U all axes UP."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-404", address: "12 Bay St" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "DOWN", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { t1: $.data.menu_tier }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { t2: $.data.menu_tier, rs: $.data.resource_status }
          assert:
            - "after the water-only outage Unit.${u}.menu_tier == TIER2_NO_WATER"
            - "after the water-only restoration Unit.${u}.menu_tier == FULL"
            - "Unit.${u}.resource_status.power == UP and Unit.${u}.resource_status.gas == UP throughout (axes independent)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: checklist_approval_cascades_to_menu_and_storm_close
        grounds:
          - state_machines.ChecklistRun.SUBMITTED_to_APPROVED
          - state_machines.MenuActivation.ACTIVE_to_ENDED
          - state_machines.StormEvent.RECOVERY_to_CLOSED
        distinguishing_aspect: |
          Depth-3 chain originating at checklist approve (trigger 1):
          approve -> Unit.menu_tier forced FULL and the open checklist cleared
          (link 1) -> with every unit at FULL and no open checklist, the storm
          close precondition — previously failing with ERR_OPEN_CHECKLISTS —
          is satisfied (link 2) -> the same storm close call that would have
          been rejected before the approve now moves RECOVERY -> CLOSED
          (link 3). Distinct trigger from the condition-report cascade of the
          sibling instance.
        test_recipe:
          setup:
            - "Storm escalated WARNING -> activated ACTIVE -> deescalated RECOVERY (version 4). Unit U: 09:00 power-DOWN report with TIER1 activation A1; 10:00 all-clear report (recomputed FULL mismatches A1's tier, so A1 auto-ENDED). Checklist run opened, five PASS items, submitted by UnitManager um-1 at 12:00 — inside the 4h cold-hold window of the 10:00 all-clear report."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-505", address: "21 Palmetto Ave" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/escalate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
              captures: { se_v2: $.data.version }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v2}" }
              as: CommandCenterAdmin
              captures: { se_v3: $.data.version }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/menu-activations"
              payload: { tier: "TIER1_NO_POWER" }
              as: UnitManager
              captures: { ma: $.data.id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/storm-events/${se}/deescalate"
              payload: { expected_storm_event_version: "${se_v3}" }
              as: CommandCenterAdmin
              captures: { se_v4: $.data.version }
            - call: "POST /ops/units/${u}/checklists"
              payload: {}
              as: UnitManager
              captures: { run: $.data.id }
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "POWER_RESTORED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "WATER_POTABLE", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "FOOD_DISCARD_LOGGED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "CASH_DRAWER_COUNTED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/checklists/${run}/submit"
              payload: {}
              as: UnitManager
              as_user_id: "um-1"
          trigger:
            - call: "POST /ops/units/${u}/checklists/${run}/approve"
              payload: {}
              as: CommandCenterAdmin
              as_user_id: "cc-9"
            - call: "GET /ops/units/${u}/menu-activations"
              payload: {}
              as: UnitManager
              captures: { ma_status: "$.data[0].status" }
            - call: "POST /ops/storm-events/${se}/close"
              payload: { expected_storm_event_version: "${se_v4}" }
              as: CommandCenterAdmin
              captures: { se_status: $.data.status }
          assert:
            - "ChecklistRun.${run}.status == APPROVED"
            - "Unit.${u}.menu_tier == FULL after approval (link 1)"
            - "MenuActivation.${ma}.status == ENDED (already ended by the 10:00 all-clear report — tier mismatch with recomputed FULL)"
            - "StormEvent.${se}.status == CLOSED and StormEvent.${se}.closed_at != null (links 2+3 — the storm close gate is unlocked only because the approve cleared the last open checklist while every unit sits at FULL)"

      - name: condition_report_cascade_ends_activation_and_sets_cash_only
        grounds:
          - state_machines.Unit
          - state_machines.MenuActivation.ACTIVE_to_ENDED
          - state_machines.Resource
        distinguishing_aspect: |
          Depth-2 chain originating at the condition-report trigger (trigger
          2, distinct from checklist approve): a report adding water DOWN on
          top of gas DOWN -> Unit resource_status and menu_tier recompute from
          TIER3_NO_GAS to TIER2_NO_WATER (link 1) -> the unit's ACTIVE
          TIER3_NO_GAS MenuActivation transitions to ENDED (link 2, caused by
          the tier mismatch the report created, not by any direct request on
          the activation).
        test_recipe:
          setup:
            - "Clock 2026-09-10T09:00:00Z. Storm WATCH; unit U with gas DOWN (TIER3) and an ACTIVE TIER3_NO_GAS menu activation; payment UP."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-606", address: "33 Depot Rd" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u}/menu-activations"
              payload: { tier: "TIER3_NO_GAS" }
              as: UnitManager
              captures: { ma: $.data.id }
          trigger:
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "DOWN", gas: "DOWN", payment_network: "UP" }
              as: UnitManager
            - call: "GET /ops/units/${u}/menu-activations"
              payload: {}
              as: UnitManager
              captures: { ma_status: "$.data[0].status" }
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { tier: $.data.menu_tier }
          assert:
            - "MenuActivation.${ma}.status == ENDED (link 2 — the recomputed TIER2_NO_WATER mismatches the activation's TIER3_NO_GAS tier)"
            - "Unit.${u}.menu_tier == TIER2_NO_WATER (link 1 — water outranks gas)"
            - "Unit.${u}.cash_only_flag == false (payment axis untouched)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: close_open_checklists_beats_stale_version
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_OPEN_CHECKLISTS]
        distinguishing_aspect: |
          Error-category pair business_fiscal (priority 11) vs state/OCC
          (priority 12): a close request on a storm with a REJECTED (open)
          checklist AND a deliberately stale expected_storm_event_version
          returns 409 ERR_OPEN_CHECKLISTS, not 412 ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "Storm activated then deescalated to RECOVERY (version 3). Unit U: power outage at 09:00, all-clear report at 10:00, checklist run submitted by um-1 then rejected by cc-9 (run now REJECTED, still open). No storm mutation after deescalate, so the stale version in the trigger is a genuine OCC mismatch."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-707", address: "40 Pine St" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
              captures: { se_v2: $.data.version }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/storm-events/${se}/deescalate"
              payload: { expected_storm_event_version: "${se_v2}" }
              as: CommandCenterAdmin
              captures: { se_v3: $.data.version }
            - call: "POST /ops/units/${u}/checklists"
              payload: {}
              as: UnitManager
              captures: { run: $.data.id }
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "POWER_RESTORED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "WATER_POTABLE", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "GAS_LEAK_CHECK", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "FOOD_DISCARD_LOGGED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/items"
              payload: { key: "CASH_DRAWER_COUNTED", result: "PASS" }
              as: UnitManager
            - call: "POST /ops/units/${u}/checklists/${run}/submit"
              payload: {}
              as: UnitManager
              as_user_id: "um-1"
            - call: "POST /ops/units/${u}/checklists/${run}/reject"
              payload: {}
              as: CommandCenterAdmin
              as_user_id: "cc-9"
          trigger:
            - call: "POST /ops/storm-events/${se}/close"
              payload: { expected_storm_event_version: "${se_v3} - 1" }
              as: CommandCenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_OPEN_CHECKLISTS with http 409 (business_fiscal priority 11 beats OCC priority 12)"
            - "StormEvent.${se}.status == RECOVERY (unchanged)"

      - name: asset_not_idle_beats_preposition_window_expired
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_ASSET_NOT_IDLE]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 7) vs
          business_temporal (priority 8) — a different pair from the sibling
          instance: allocating an asset that is already ALLOCATED while ALSO
          past the 48h pre-positioning window returns ERR_ASSET_NOT_IDLE
          (priority 7), not ERR_PREPOSITION_WINDOW_EXPIRED (priority 8).
        test_recipe:
          setup:
            - "Storm WATCH since 2026-09-10T08:00:00Z (watch_started_at). Unit U power DOWN. GENERATOR asset G already allocated to U (status ALLOCATED). Clock advanced to 2026-09-13T08:01:00Z — past watch_started_at + 48h, storm still WATCH."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-808", address: "7 Marsh Ln" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/assets"
              payload: { kind: "GENERATOR", home_unit_id: "${u}" }
              as: LogisticsPlanner
              captures: { g: $.data.id }
            - call: "POST /ops/allocations"
              payload: { asset_id: "${g}", unit_id: "${u}" }
              as: LogisticsPlanner
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T08:01:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/allocations"
              payload: { asset_id: "${g}", unit_id: "${u}" }
              as: LogisticsPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ASSET_NOT_IDLE (priority 7 referential beats priority 8 temporal)"
            - "Asset.${g}.status == ALLOCATED (unchanged)"
            - "GET /allocations?asset_id=${g} total_count == 1 (no second allocation created)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: assignment_start_before_window_rejected
        grounds:
          - calculations.crew_assignment_overlap
          - state_machines.CrewAssignment.SCHEDULED_to_ACTIVE
          - errors[ERR_ASSIGNMENT_WINDOW]
        distinguishing_aspect: |
          Boundary on the assigned_from time metric via
          POST /ops/assignments/{id}/start: starting one second before
          assigned_from is rejected with ERR_ASSIGNMENT_WINDOW, while starting
          exactly at assigned_from (>= semantics) succeeds.
        test_recipe:
          setup:
            - "Storm ACTIVE. Unit U with power DOWN (TIER1). Jump-team crew member M with assignment window [2026-09-10T12:00:00Z, 2026-09-12T12:00:00Z). Clock first set to 11:59:59 (start rejected), then to exactly 12:00:00."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-909", address: "2 Shell Rd" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T12:00:00Z", assigned_until: "2026-09-12T12:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a: $.data.id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T11:59:59Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/assignments/${a}/start"
              payload: {}
              as: FieldCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/assignments/${a}/start"
              payload: {}
              as: FieldCoordinator
              captures: { a_status: $.data.status }
          assert:
            - "the 11:59:59 start returned error_id == ERR_ASSIGNMENT_WINDOW (409)"
            - "trigger at exactly 12:00:00 succeeds: CrewAssignment.${a}.status == ACTIVE (boundary is >= assigned_from)"

      - name: shift_change_threshold_exactly_twelve_hours
        grounds:
          - calculations.shift_change_clock
          - calculations.shift_change_clock.constants
          - state_machines.CrewAssignment.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          Boundary on the hours_since_shift_change metric (a different metric
          from the sibling's assigned_from) via the same start endpoint at a
          later hop: the first jump-team start stamps last_shift_change_at;
          a completion at 11:59 elapsed does NOT restamp, while a start at
          exactly 12:00 elapsed (>= 12) restamps and resets the counter to 0.
        test_recipe:
          setup:
            - "Storm ACTIVE. Unit U power DOWN. Jump-team member M; assignment A1 [2026-09-10T00:00:00Z, 2026-09-11T00:00:00Z) started at exactly 00:00 (first start stamps last_shift_change_at = 00:00). A1 completed at 11:59 elapsed (no restamp). Second assignment A2 [2026-09-10T12:00:00Z, 2026-09-11T00:00:00Z) started at exactly 12:00 elapsed."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T20:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-910", address: "4 Shell Rd" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T00:00:00Z", assigned_until: "2026-09-11T00:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a1: $.data.id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/assignments/${a1}/start"
              payload: {}
              as: FieldCoordinator
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T11:59:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/assignments/${a1}/complete"
              payload: {}
              as: FieldCoordinator
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { ls1: $.data.last_shift_change_at, hs1: $.data.hours_since_shift_change }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T12:00:00Z", assigned_until: "2026-09-11T00:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a2: $.data.id }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: CommandCenterAdmin
          trigger:
            - call: "POST /ops/assignments/${a2}/start"
              payload: {}
              as: FieldCoordinator
            - call: "GET /ops/units/${u}"
              as: CommandCenterAdmin
              captures: { ls2: $.data.last_shift_change_at, hs2: $.data.hours_since_shift_change }
          assert:
            - "first start stamped Unit.${u}.last_shift_change_at == 2026-09-10T00:00:00.000Z (null last_shift_change_at is always due)"
            - "completion at 11:59 elapsed did NOT restamp: last_shift_change_at still 2026-09-10T00:00:00.000Z and hours_since_shift_change == 11"
            - "start at exactly 12:00 elapsed (>= 12) restamps: last_shift_change_at == 2026-09-10T12:00:00.000Z and hours_since_shift_change == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_start_requires_storm_active_and_tiered_unit
        grounds:
          - state_machines.CrewAssignment.SCHEDULED_to_ACTIVE
          - errors[ERR_STORM_NOT_ACTIVE]
          - errors[ERR_UNIT_NOT_IN_STORM_TIER]
        distinguishing_aspect: |
          Entity pair CrewAssignment -> StormEvent / Unit: starting an
          assignment while the unit's storm is WATCH fails with
          ERR_STORM_NOT_ACTIVE, and starting one to a storm-ACTIVE unit whose
          menu_tier is FULL fails with ERR_UNIT_NOT_IN_STORM_TIER — the valid
          transition depends on state of two entities outside the assignment.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm1 WATCH with unit U1 power DOWN (TIER1); jump member M1 assigned to U1, window begun. Storm2 ACTIVE with unit U2 all axes UP (FULL menu); jump member M2 assigned to U2, window begun."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
