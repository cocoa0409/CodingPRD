      - name: every_entity_has_its_own_not_found_code_on_the_path
        claim_type: triggerable
        grounds:
          - errors[ERR_SAILING_INVENTORY_NOT_FOUND]
          - errors[ERR_FARE_RULE_NOT_FOUND]
          - errors[ERR_PROMOTION_NOT_FOUND]
          - errors[ERR_GROUP_BLOCK_NOT_FOUND]
          - errors[ERR_UPGRADE_BID_NOT_FOUND]
          - errors[ERR_ITINERARY_CHANGE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          The six entities that are only ever addressed by a path id each need their own 404 code,
          on read endpoints and on action endpoints alike. The sharp part is the interaction with the
          concurrency check: a PATCH carrying a perfectly valid expected_inventory_version against
          an id that does not exist is a 404 and never a 412, because existence at priority 5 is
          settled long before optimistic concurrency at priority 9.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; category IA and sailing NFD-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) exist with one real IA allotment whose version is captured, so a genuine version value is available for the PATCH."
            - "No promotion, group block, upgrade bid or itinerary change has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "NFD-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_nf: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_nf}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_nf: $.data.id, nfv: $.data.version }
          trigger:
            - call: "GET /sailing-inventories/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: RevenueManager
              captures: { e1: $.data.error_id }
            - call: "PATCH /sailing-inventories/00000000-0000-4000-8000-000000000101"
              payload: { oversell_allowance: 2, expected_inventory_version: "${nfv}" }
              as: RevenueManager
              captures: { e2: $.data.error_id }
            - call: "GET /fare-rules/00000000-0000-4000-8000-000000000102"
              payload: {}
              as: RevenueManager
              captures: { e3: $.data.error_id }
            - call: "GET /promotions/00000000-0000-4000-8000-000000000103"
              payload: {}
              as: RevenueManager
              captures: { e4: $.data.error_id }
            - call: "POST /promotions/00000000-0000-4000-8000-000000000103/activate"
              payload: {}
              as: RevenueManager
              captures: { e5: $.data.error_id }
            - call: "GET /group-blocks/00000000-0000-4000-8000-000000000104"
              payload: {}
              as: GroupSalesAgent
              captures: { e6: $.data.error_id }
            - call: "GET /upgrade-bids/00000000-0000-4000-8000-000000000105"
              payload: {}
              as: RevenueManager
              captures: { e7: $.data.error_id }
            - call: "POST /upgrade-bids/00000000-0000-4000-8000-000000000105/counter"
              payload: {}
              as: RevenueManager
              captures: { e8: $.data.error_id }
            - call: "GET /itinerary-changes/00000000-0000-4000-8000-000000000106"
              payload: {}
              as: PortOpsCoordinator
              captures: { e9: $.data.error_id }
          assert:
            - "the unknown allotment read returns HTTP 404 with data.error_id == ERR_SAILING_INVENTORY_NOT_FOUND"
            - "the unknown allotment PATCH returns HTTP 404 with data.error_id == ERR_SAILING_INVENTORY_NOT_FOUND, not HTTP 412 - priority 5 precedes priority 9 even though the version supplied is a real one"
            - "SailingInventory.${inv_nf}.oversell_allowance is still 4 and its version is still ${nfv} - the misaddressed PATCH touched nothing"
            - "the unknown fare rule returns HTTP 404 with data.error_id == ERR_FARE_RULE_NOT_FOUND"
            - "both the unknown promotion read and the unknown promotion activate return HTTP 404 with data.error_id == ERR_PROMOTION_NOT_FOUND - the action endpoint does not degrade into a 409"
            - "the unknown group block returns HTTP 404 with data.error_id == ERR_GROUP_BLOCK_NOT_FOUND"
            - "both the unknown bid read and the unknown bid counter return HTTP 404 with data.error_id == ERR_UPGRADE_BID_NOT_FOUND"
            - "the unknown itinerary change returns HTTP 404 with data.error_id == ERR_ITINERARY_CHANGE_NOT_FOUND"
            - "no response reuses a neighbouring entity's code and none is a bare 400 - each of the six ids resolves to its own catalogue entry"

      - name: payment_amount_gates_reject_short_deposits_short_finals_and_overpayments
        claim_type: triggerable
        grounds:
          - errors[ERR_DEPOSIT_BELOW_MINIMUM]
          - errors[ERR_FINAL_PAYMENT_SHORT]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
          - validations[priority=20]
          - endpoints[POST /bookings/{id}/payments]
        distinguishing_aspect: |
          Three fiscal gates guard one endpoint and they are ordered inside priority 20: a DEPOSIT
          one cent short of deposit_due_cents is the minimum error, a DEPOSIT above the whole
          balance is the overpayment error, and a FINAL_PAYMENT one cent short is its own error
          because the shortfall has a legal home - the PARTIAL kind, which is accepted for the very
          same amount. Each refusal must leave the ledger empty of the attempted event.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PAY-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 10/0 and a 730..0 fare window at base 50000."
            - "One booking of two adults exists: net_ticket_cents 100000, balance_due_cents 100000, deposit_due_cents 50000 (the 20 percent rule beats the 25000 per-guest floor), payment_terms STANDARD and final_payment_due_date 2026-10-27T17:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "PAY-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_p: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_p}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_ada: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 49999 }
              as: ReservationAgent
              captures: { e1: $.data.error_id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 100001 }
              as: ReservationAgent
              captures: { e2: $.data.error_id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 50000 }
              as: ReservationAgent
              captures: { pe_dep: $.data.id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "FINAL_PAYMENT", amount_cents: 49999 }
              as: ReservationAgent
              captures: { e3: $.data.error_id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "PARTIAL", amount_cents: 49999 }
              as: ReservationAgent
              captures: { pe_part: $.data.id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "PARTIAL", amount_cents: 2 }
              as: ReservationAgent
              captures: { e4: $.data.error_id }
            - call: "POST /bookings/${bk_ada}/payments"
              payload: { kind: "FINAL_PAYMENT", amount_cents: 1 }
              as: ReservationAgent
              captures: { pe_final: $.data.id }
          assert:
            - "the 49999 deposit returns HTTP 422 with data.error_id == ERR_DEPOSIT_BELOW_MINIMUM"
            - "the 100001 deposit returns HTTP 422 with data.error_id == ERR_PAYMENT_EXCEEDS_BALANCE - it clears the minimum, so the second gate is the one that bites"
            - "after both refusals Booking.${bk_ada}.payment_status == AWAITING_DEPOSIT, amount_paid_cents == 0 and GET /bookings/${bk_ada}/payment-events returns total_count == 0"
            - "the 50000 deposit returns HTTP 201, moves payment_status to DEPOSIT_PAID and leaves amount_paid_cents == 50000, balance_due_cents == 50000"
            - "the 49999 FINAL_PAYMENT returns HTTP 422 with data.error_id == ERR_FINAL_PAYMENT_SHORT - a final payment must equal the balance exactly"
            - "the identical 49999 as kind PARTIAL returns HTTP 201, keeps payment_status == DEPOSIT_PAID and leaves amount_paid_cents == 99999, balance_due_cents == 1"
            - "the 2 cent PARTIAL returns HTTP 422 with data.error_id == ERR_PAYMENT_EXCEEDS_BALANCE against a balance of 1"
            - "the 1 cent FINAL_PAYMENT returns HTTP 201 and moves payment_status to PAID_IN_FULL with amount_paid_cents == 100000 and balance_due_cents == 0"
            - "GET /bookings/${bk_ada}/payment-events returns total_count == 3 in posted_at order with kinds DEPOSIT, PARTIAL, FINAL_PAYMENT - none of the four refusals left a row"
            - "Sailing.${sail_p}.paid_in_full_bookings_count == 1 and confirmed_bookings_count == 0, so final_payment_risk_flag == false"

      - name: confirm_and_payment_state_conflicts_are_told_apart
        claim_type: triggerable
        grounds:
          - errors[ERR_DEPOSIT_NOT_PAID]
          - errors[ERR_BOOKING_NOT_IN_OPTION]
          - errors[ERR_PAYMENT_STATE_INVALID]
          - validations[priority=10]
          - state_machines.Booking.payment_status
        distinguishing_aspect: |
          Three 409s over the same two endpoints, each keyed to a different dimension: confirm
          refused for the payment dimension is ERR_DEPOSIT_NOT_PAID, confirm refused for the
          booking dimension is ERR_BOOKING_NOT_IN_OPTION, and a payment kind with no declared edge
          out of the current payment_status is ERR_PAYMENT_STATE_INVALID. The last one also proves
          the state gate outranks the fiscal one: a second DEPOSIT of only 25000 is a 409 on the
          missing transition, not a 422 on the deposit minimum it also violates.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing CNF-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 10/0 and a 730..0 fare window at base 50000."
            - "Two bookings of two adults exist, each with net_ticket_cents 100000 and deposit_due_cents 50000: Ada's is left AWAITING_DEPOSIT and Bo's will be advanced."
