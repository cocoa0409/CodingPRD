            - call: "GET /api/utilization-cases/${case_id}/escalation-cases"
              as: CaseManager
              captures: { esc_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/escalation-cases/${esc_id}/acknowledge"
              payload: {}
              as: CaseManager
            - call: "POST /api/escalation-cases/${esc_id}/resolve"
              payload: { resolution_note: "SNF bed secured for 2026-08-04" }
              as: CaseManager
          assert:
            - "After acknowledge: status == ACKNOWLEDGED; after resolve: status == RESOLVED and resolution_note == 'SNF bed secured for 2026-08-04'"
      - name: cc44_rescind_requires_approved_state
        claim_type: invalid_transition
        grounds: [state_machines.ConditionCode44Request.APPROVED_to_RESCINDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rescinding a CC44 that never reached APPROVED (still CONCURRENCE_PENDING) is an invalid from-state."
        test_recipe:
