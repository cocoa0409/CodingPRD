  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_submit_requires_program_accepted
        grounds:
          - state_machines.GrantApplication.DRAFT_to_UNDER_REVIEW
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair GrantApplication -> CapitalProgram: submit is rejected with
          ERR_PROGRAM_NOT_ACCEPTED while the referenced program is merely SUBMITTED, and succeeds
          after the program's own ACCEPT transition — the application's valid transition set depends
          on the program's state.
        test_recipe:
          setup:
            - "Program SUBMITTED (not yet accepted) with one PROPOSED project; application over that project with all 6 assurances certified; clock before deadline"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FAAManager }
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
