              payload: { contractor_id: "${cr_id}" }
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyr_id}/return"
              payload: { returned_weight_lbs: 45.00 }
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyr_id}/refill"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyr_id}/issue"
              payload: { contractor_id: "${cr_id}" }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/refrigerant-cylinders/${cyr_id}/return"
