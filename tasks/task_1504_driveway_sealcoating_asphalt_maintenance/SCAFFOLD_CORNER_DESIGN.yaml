# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Driveway Sealcoating & Asphalt Maintenance Service
# Breadth probe across the claim-extraction-guide taxonomy. Corners already
# exercised by a §1.8 instance appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_retrieval_and_envelope
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST echoes all inputs with system fields (id, created_at, version 1) inside the fixed response envelope."
        test_recipe:
          setup: ["Empty database; clock at default 2026-08-01T00:00:00Z (no set call needed)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id", c_ver: "$.data.version" } }
            - { call: "GET /api/customers/${c_id}", payload: {}, as: OfficeAdmin, captures: { c_name: "$.data.name" } }
          assert:
            - "POST returns 201 with envelope keys meta.api_request_id, meta.api_request_timestamp, response_type == 'object', data.id a prefix-less UUID"
            - "data.version == 1 and data.created_at has ISO8601 UTC form with millisecond precision"
            - "GET returns name == 'Dana Homeowner', customer_type == RESIDENTIAL"

      - name: customer_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Customer, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field `name` yields ERR_INVALID_REQUEST (400); nothing is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { customer_type: "RESIDENTIAL", email: "x@example.com", phone: "555-1" }, as: OfficeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"
            - "GET /api/customers afterwards lists 0 records"

      - name: property_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Property.fields.lot_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "lot_kind outside {RESIDENTIAL_DRIVEWAY, COMMERCIAL_LOT} is rejected at input validation."
        test_recipe:
          setup: ["One customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "PARKING" }, as: OfficeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: route_sheet_capacity_defaults_to_crew_capacity
        claim_type: defaults
        grounds: [entities.RouteSheet.fields.capacity_sqft]
        distinguishing_aspect: "Omitting capacity_sqft at creation copies crew.daily_capacity_sqft (8000); supplying 6000 overrides it."
        test_recipe:
          setup: ["Crew with daily_capacity_sqft 8000"]
          setup_api_calls:
            - { call: "POST /api/crews", payload: { crew_name: "Crew Alpha", home_zone: "North", daily_capacity_sqft: 8000 }, as: OfficeAdmin, captures: { crew_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-10" }, as: Dispatcher, captures: { s1_cap: "$.data.capacity_sqft" } }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-11", capacity_sqft: 6000 }, as: Dispatcher, captures: { s2_cap: "$.data.capacity_sqft" } }
          assert:
            - "Sheet without capacity_sqft: capacity_sqft == 8000 (crew default)"
            - "Sheet with capacity_sqft 6000: capacity_sqft == 6000"

      - name: property_computed_area_and_assessment_supersede
        claim_type: computed_fields
        grounds: [entities.Property.fields.current_area_sqft, state_machines.SiteAssessment.SUBMITTED_to_SUPERSEDED]
        distinguishing_aspect: "Property.current_area_sqft tracks the latest SUBMITTED assessment: 1000 after first submit, 1500 after second, and the first assessment reads SUPERSEDED."
        test_recipe:
          setup: ["Customer + property; two DRAFT assessments 1000 and 1500 sqft"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 1000, crack_linear_ft: 10, pothole_count: 0, pothole_area_sqft: 0, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a1: "$.data.id" } }
            - { call: "POST /api/assessments/${a1}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 1500, crack_linear_ft: 5, pothole_count: 0, pothole_area_sqft: 0, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a2: "$.data.id" } }
          trigger:
            - { call: "POST /api/assessments/${a2}/submit", payload: {}, as: Estimator }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { area: "$.data.current_area_sqft" } }
            - { call: "GET /api/assessments/${a1}", payload: {}, as: Estimator, captures: { a1_status: "$.data.status" } }
          assert:
            - "Property.current_area_sqft == 1500 after second submit (was 1000)"
            - "Assessment ${a1}.status == SUPERSEDED; ${a2}.status == SUBMITTED"
            - "Property.version incremented on each submit (started 1, now 3)"

      - name: weather_snapshot_immutable_event_entity
        claim_type: immutability
        grounds: [entities.WeatherSnapshot]
        distinguishing_aspect: "WeatherSnapshot carries common_fields: false — response exposes id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 65, max_temp_f: 82, precip_probability_pct: 10, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher, captures: { snap_id: "$.data.id" } }
            - { call: "GET /api/weather-snapshots?target_date=2026-08-10", payload: {}, as: Dispatcher }
          assert:
            - "Snapshot response has id and created_at but no version or updated_at field"
            - "§1.5 declares no PUT/PATCH endpoint for weather-snapshots (append-only)"

      - name: material_lot_record_waste_to_depleted
        claim_type: computed_fields
        grounds: [entities.MaterialLot.fields.on_hand_gallons, state_machines.MaterialLot.RECEIVED_to_DEPLETED, "errors[ERR_MATERIAL_LOT_UNAVAILABLE]"]
        distinguishing_aspect: "Recording waste equal to on_hand drives on_hand_gallons to exactly 0 and auto-transitions the lot to DEPLETED."
        test_recipe:
          setup: ["Material + lot delivered 50 gal, no reservations"]
          setup_api_calls:
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "POST /api/material-lots", payload: { material_id: "${mat_id}", delivered_gallons: 50, unit_cost_cents: 1500, received_on: "2026-07-15", reorder_threshold_gallons: 5 }, as: OfficeAdmin, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/material-lots/${lot_id}/record-waste", payload: { wasted_gallons: 50 }, as: OfficeAdmin, captures: { on_hand: "$.data.on_hand_gallons", lot_status: "$.data.status" } }
          assert:
            - "on_hand_gallons == 0 (50 - 0 - 0 - 50)"
            - "status == DEPLETED"

      - name: not_found_on_unknown_work_order_id
        claim_type: not_found
        grounds: ["errors[ERR_WORK_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_WORK_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/work-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WORK_ORDER_NOT_FOUND and http status 404"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: assessment_double_submit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SiteAssessment.DRAFT_to_SUBMITTED, "errors[ERR_ASSESSMENT_NOT_SUBMITTABLE]"]
        distinguishing_aspect: "Second submit on a SUBMITTED assessment fails with ERR_ASSESSMENT_NOT_SUBMITTABLE; no state change."
        test_recipe:
          setup: ["Property with one SUBMITTED assessment"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator }
          trigger:
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ASSESSMENT_NOT_SUBMITTABLE (409)"
            - "Assessment remains SUBMITTED with original submitted_at"

      - name: quote_decline_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Quote, "errors[ERR_QUOTE_NOT_ACCEPTABLE]"]
        distinguishing_aspect: "From DECLINED (terminal), accept/decline/request-revision all fail with ERR_QUOTE_NOT_ACCEPTABLE."
        test_recipe:
          setup: ["SENT quote on a residential property"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${p_id}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${p_v}" }, as: Estimator, captures: { q_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q_id}/send", payload: {}, as: Estimator }
            - { call: "POST /api/quotes/${q_id}/decline", payload: {}, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /api/quotes/${q_id}/accept", payload: {}, as: Customer, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_QUOTE_NOT_ACCEPTABLE; quote stays DECLINED; no WorkOrder created (GET /api/work-orders?quote_id= returns [])"

      - name: quote_expiry_lazy_transition_on_accept
        claim_type: valid_transition
        grounds: [state_machines.Quote.SENT_to_EXPIRED, "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "Quote sent 2026-08-01 expires_on 2026-08-15; accept with clock 2026-08-16 flips it to EXPIRED and fails with ERR_QUOTE_EXPIRED."
        test_recipe:
          setup: ["SENT quote; clock advanced past expiry"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${p_id}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${p_v}" }, as: Estimator, captures: { q_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q_id}/send", payload: {}, as: Estimator, captures: { exp: "$.data.expires_on" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: OfficeAdmin }
          trigger:
            - { call: "POST /api/quotes/${q_id}/accept", payload: {}, as: Customer, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "expires_on == 2026-08-15 (sent date + 14 days)"
            - "accept after expiry: error_id == ERR_QUOTE_EXPIRED (409)"
            - "Quote.status == EXPIRED afterwards (lazy transition persisted)"

      - name: work_order_cancel_from_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder, "errors[ERR_WORK_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel is only allowed from PENDING/SCHEDULED/WEATHER_HOLD; from IN_PROGRESS it fails with ERR_WORK_ORDER_NOT_CANCELLABLE and the job is untouched."
        test_recipe:
          setup: ["Work order IN_PROGRESS on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "POST /api/material-lots", payload: { material_id: "${mat_id}", delivered_gallons: 100, unit_cost_cents: 1500, received_on: "2026-07-15", reorder_threshold_gallons: 15 }, as: OfficeAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/crews", payload: { crew_name: "Crew Alpha", home_zone: "North", daily_capacity_sqft: 8000 }, as: OfficeAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-10" }, as: Dispatcher, captures: { sheet_id: "$.data.id" } }
            - { call: "POST /api/route-sheets/${sheet_id}/publish", payload: {}, as: Dispatcher }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 65, max_temp_f: 82, precip_probability_pct: 10, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /api/quotes", payload: { property_id: "${p_id}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${p_v}" }, as: Estimator, captures: { q_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q_id}/send", payload: {}, as: Estimator }
            - { call: "POST /api/quotes/${q_id}/accept", payload: {}, as: Customer, as_user_id: "${c_id}" }
            - { call: "GET /api/work-orders?quote_id=${q_id}", payload: {}, as: Dispatcher, captures: { wo_id: "$.data[0].id" } }
            - { call: "POST /api/work-orders/${wo_id}/schedule", payload: { route_sheet_id: "${sheet_id}", material_lot_id: "${lot_id}", scheduled_date: "2026-08-10", window_start_hour: 7, window_end_hour: 10, drive_minutes_est: 15, vehicles_to_move: 1 }, as: Dispatcher }
            - { call: "GET /api/displacement-plans?work_order_id=${wo_id}", payload: {}, as: Dispatcher, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /api/displacement-plans/${plan_id}/send-notice", payload: {}, as: Dispatcher }
            - { call: "POST /api/displacement-plans/${plan_id}/confirm-cleared", payload: {}, as: Dispatcher }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/work-orders/${wo_id}/start", payload: {}, as: CrewLead }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/cancel", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WORK_ORDER_NOT_CANCELLABLE (409)"
            - "WorkOrder stays IN_PROGRESS; lot reservation (13 gal for 900 sqft: ceil(900*1*1.1/80)=13) still held"

      - name: route_sheet_republish_keeps_jobs_held
        claim_type: side_effect_execution
        grounds: [state_machines.RouteSheet.WEATHER_HOLD_to_PUBLISHED]
        distinguishing_aspect: "Re-publishing a WEATHER_HOLD sheet returns the sheet to PUBLISHED but its work orders remain WEATHER_HOLD (no auto-release)."
        test_recipe:
          setup: ["Sheet held by failing weather snapshot with one SCHEDULED work order on it"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p_id}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
            - { call: "POST /api/assessments/${a_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /api/materials", payload: { product_name: "SealMaster Standard", grade: "STANDARD", coverage_sqft_per_gallon: 80, min_apply_temp_f: 50, max_precip_probability_pct: 40, cure_hours_vehicle: 48, reapplication_months: 24, warranty_months: 12, price_per_gallon_cents: 900 }, as: OfficeAdmin, captures: { mat_id: "$.data.id" } }
            - { call: "POST /api/material-lots", payload: { material_id: "${mat_id}", delivered_gallons: 100, unit_cost_cents: 1500, received_on: "2026-07-15", reorder_threshold_gallons: 15 }, as: OfficeAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/crews", payload: { crew_name: "Crew Alpha", home_zone: "North", daily_capacity_sqft: 8000 }, as: OfficeAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /api/route-sheets", payload: { crew_id: "${crew_id}", service_date: "2026-08-10" }, as: Dispatcher, captures: { sheet_id: "$.data.id" } }
            - { call: "POST /api/route-sheets/${sheet_id}/publish", payload: {}, as: Dispatcher }
            - { call: "POST /api/weather-snapshots", payload: { target_date: "2026-08-10", min_temp_f: 65, max_temp_f: 82, precip_probability_pct: 10, precipitation_mm: 0, source: "FORECAST" }, as: Dispatcher }
            - { call: "GET /api/properties/${p_id}", payload: {}, as: OfficeAdmin, captures: { p_v: "$.data.version" } }
