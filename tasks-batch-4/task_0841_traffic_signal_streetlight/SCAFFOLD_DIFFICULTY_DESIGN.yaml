# =============================================================================
# Task 0841 — Traffic Signal & Streetlight Maintenance
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: work_order_provisional_vs_final_cost
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.provisional_cost
          - entities.WorkOrder.fields.final_cost
          - state_machines.WorkOrder.DISPATCHED_to_COMPLETED
        distinguishing_aspect: "On WorkOrder, the provisional variant (estimated inputs, at creation) and the final variant (actual inputs, at completion) yield different dollar totals for the same work order."
        test_recipe:
          setup:
            - "One intersection, one IN_SERVICE device, one crew with 8h capacity."
            - "A REPAIR work order created with estimated 2.0h and estimated_parts [{qty:3,unit_price:12.00}] -> provisional_cost 259.90."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Main & 1st", district: "D1", latitude: 40.0, longitude: -80.0 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M1", installed_at: "2025-06-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew A", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "signal dark" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 2.0, estimated_parts: [{ qty: 3, unit_price: 12.00 }], ticket_id: "${tk_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 2.5, actual_parts: [{ qty: 3, unit_price: 12.333 }, { qty: 2, unit_price: 5.005 }] }
              as: FieldTech
              as_user_id: "${crew_id}"
          assert:
            - "WorkOrder.${wo_id}.provisional_cost == 259.90"
            - "WorkOrder.${wo_id}.final_cost == 327.19"
            - "WorkOrder.${wo_id}.provisional_cost != WorkOrder.${wo_id}.final_cost"

      - name: warranty_full_vs_prorated_payout
        grounds:
          - calculations.warranty_payout
          - entities.WarrantyClaim.fields.coverage_variant
          - entities.WarrantyClaim.fields.payout_amount
          - entities.Device.fields.installed_at
        distinguishing_aspect: "On WarrantyClaim/Device (a different entity domain than WorkOrder cost), the FULL variant pays replacement_cost while the PRORATED variant pays a depreciated value for the same replacement_cost, differing purely by device age."
        test_recipe:
          setup:
            - "Clock at default 2026-03-01T00:00:00Z."
            - "Device A installed 2025-03-01 (age 12mo, FULL), Device B installed 2023-09-01 (age 30mo, PRORATED); both replacement_cost 1000.00."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Elm & 2nd", district: "D2", latitude: 40.1, longitude: -80.1 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "STREETLIGHT", criticality: "LOW", model: "LEDX", installed_at: "2025-03-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { devA: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "STREETLIGHT", criticality: "LOW", model: "LEDX", installed_at: "2023-09-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { devB: $.data.id }
          trigger:
            - call: "POST /warranty-claims"
              payload: { device_id: "${devA}", defect_description: "LED flicker" }
              as: UtilityCoordinator
              captures: { wcA: $.data.id }
            - call: "POST /warranty-claims"
              payload: { device_id: "${devB}", defect_description: "LED flicker" }
              as: UtilityCoordinator
              captures: { wcB: $.data.id }
          assert:
            - "WarrantyClaim.${wcA}.coverage_variant == FULL"
            - "WarrantyClaim.${wcA}.payout_amount == 1000.00"
            - "WarrantyClaim.${wcB}.coverage_variant == PRORATED"
            - "WarrantyClaim.${wcB}.payout_amount == 500.00"

  - rule_id: combinatorial_formula
    instances:
      - name: ticket_priority_score_capped_tiered_hazard_override
        grounds:
          - calculations.ticket_priority_score
          - entities.Ticket.fields.priority_score
          - entities.Ticket.fields.priority_band
          - entities.Device.fields.criticality
        distinguishing_aspect: "Mode (a): priority_score combines 4 inputs (source, criticality, severity, hazard) with a min() cap and a tiered band selection that a hazard+CRITICAL override can force to P1 — non-linear interaction."
        test_recipe:
          setup:
            - "CRITICAL device; SRC_311 ticket severity 4 hazard true -> raw 10+40+32+25=107 capped to 100 -> band P1."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Oak & 3rd", district: "D1", latitude: 40.2, longitude: -80.2 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_CONTROLLER", criticality: "CRITICAL", model: "C1", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 5000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 4, description: "dark signal", hazard_flag: true }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
          assert:
            - "Ticket.${tk_id}.priority_score == 100"
            - "Ticket.${tk_id}.priority_band == P1"

      - name: work_order_cost_per_line_rounding_order
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.final_cost
          - entities.WorkOrder.fields.actual_parts
        distinguishing_aspect: "Mode (b): work_order_cost pins the rounding order — each parts line is rounded to cents THEN summed (37.00 + 10.01 = 47.01), not summed-then-rounded; overhead rounds on the rounded subtotal."
        test_recipe:
          setup:
            - "IN_SERVICE device, crew 8h, standalone LED_REPLACEMENT work order (no ticket)."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Pine & 4th", district: "D3", latitude: 40.3, longitude: -80.3 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "STREETLIGHT", criticality: "LOW", model: "L1", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 800.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew L", specialty: "LIGHTING", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "LED_REPLACEMENT", estimated_labor_hours: 2.0, estimated_parts: [{ qty: 1, unit_price: 1.00 }] }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 2.5, actual_parts: [{ qty: 3, unit_price: 12.333 }, { qty: 2, unit_price: 5.005 }] }
              as: FieldTech
              as_user_id: "${crew_id}"
          assert:
            - "WorkOrder.${wo_id}.final_cost == 327.19"
            - "Per-line rounding: round(3*12.333,2)==37.00 and round(2*5.005,2)==10.01, parts_cost==47.01; labor 237.50; overhead round(284.51*0.15,2)==42.68"

  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_resolved_to_triaged_reopen_cycle
        grounds:
          - state_machines.Ticket.RESOLVED_to_TRIAGED
          - entities.Ticket.fields.reopen_count
          - entities.Ticket.fields.resolved_at
        distinguishing_aspect: "Ticket has a cyclic back-edge RESOLVED->TRIAGED (reopen), a loop absent from any linear pipeline."
        test_recipe:
          setup:
            - "Ticket triaged, its work order completed, ticket resolved; clock at default so reopen is within the 72h window."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Ash & 5th", district: "D1", latitude: 40.4, longitude: -80.4 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M2", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew B", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 3, description: "flashing" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0, ticket_id: "${tk_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 1.0 }
              as: FieldTech
              as_user_id: "${crew_id}"
            - call: "POST /tickets/${tk_id}/resolve"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /tickets/${tk_id}/reopen"
              payload: {}
              as: Dispatcher
          assert:
            - "Ticket.${tk_id}.status == TRIAGED"
            - "Ticket.${tk_id}.reopen_count == 1"
            - "Ticket.${tk_id}.resolved_at == null"

      - name: timing_change_fork_and_revision_loop
        grounds:
          - state_machines.TimingPlanChangeRequest.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.TimingPlanChangeRequest.CHANGES_REQUESTED_to_SUBMITTED
          - entities.TimingPlanChangeRequest.fields.revision_count
        distinguishing_aspect: "TimingPlanChangeRequest forks UNDER_REVIEW->{APPROVED,REJECTED,CHANGES_REQUESTED} and loops CHANGES_REQUESTED->SUBMITTED — branching plus a cycle on a different entity than Ticket."
        test_recipe:
          setup:
            - "A submitted timing change request, moved to UNDER_REVIEW, then CHANGES_REQUESTED."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Birch & 6th", district: "D2", latitude: 40.5, longitude: -80.5 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /timing-change-requests"
              payload: { intersection_id: "${int_id}", proposed_cycle_length_sec: 90, proposed_offset_sec: 10, rationale: "peak tuning" }
              as: Dispatcher
              captures: { tcr_id: $.data.id }
            - call: "POST /timing-change-requests/${tcr_id}/start-review"
              payload: {}
              as: TrafficEngineer
            - call: "POST /timing-change-requests/${tcr_id}/request-changes"
              payload: {}
              as: TrafficEngineer
          trigger:
            - call: "POST /timing-change-requests/${tcr_id}/resubmit"
              payload: { proposed_cycle_length_sec: 100 }
              as: Dispatcher
          assert:
            - "TimingPlanChangeRequest.${tcr_id}.status == SUBMITTED"
            - "TimingPlanChangeRequest.${tcr_id}.revision_count == 1"
            - "TimingPlanChangeRequest.${tcr_id}.proposed_cycle_length_sec == 100"

  - rule_id: transitive_cascade
    instances:
      - name: knockdown_cascade_device_to_intersection_to_tcr
        grounds:
          - state_machines.Ticket.OPEN_to_TRIAGED
          - state_machines.Device.IN_SERVICE_to_KNOCKED_DOWN
          - calculations.intersection_posture
          - state_machines.TimingPlanChangeRequest.SUBMITTED_to_SUSPENDED
        distinguishing_aspect: "Depth-3 causal spine: triage of a KNOCKDOWN ticket sets Device KNOCKED_DOWN; that device state forces Intersection EMERGENCY; that intersection state forces its SUBMITTED TimingPlanChangeRequest to SUSPENDED."
        test_recipe:
          setup:
            - "Intersection with a pole-mounted CRITICAL device and a SUBMITTED timing change request; a KNOCKDOWN ticket (struck_pole true) opened for the device."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Cedar & 7th", district: "D1", latitude: 40.6, longitude: -80.6 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /poles"
              payload: { label: "P7", latitude: 40.6, longitude: -80.6, load_capacity_units: 100, intersection_id: "${int_id}" }
              as: Admin
              captures: { pole_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", pole_id: "${pole_id}", device_type: "SIGNAL_CONTROLLER", criticality: "CRITICAL", model: "C2", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 5000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /timing-change-requests"
              payload: { intersection_id: "${int_id}", proposed_cycle_length_sec: 90, proposed_offset_sec: 5, rationale: "coordination" }
              as: Dispatcher
              captures: { tcr_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "KNOCKDOWN", reported_severity: 5, description: "vehicle knockdown", hazard_flag: true, struck_pole: true }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
          assert:
            - "Device.${dev_id}.status == KNOCKED_DOWN"
            - "Pole.${pole_id}.status == DOWN"
            - "Intersection.${int_id}.operational_posture == EMERGENCY"
            - "TimingPlanChangeRequest.${tcr_id}.status == SUSPENDED"
            - "GET /work-orders?ticket_id=${tk_id} returns one WorkOrder with work_type==EMERGENCY in status DRAFT"

      - name: complete_restores_device_then_intersection_posture
        grounds:
          - state_machines.WorkOrder.DISPATCHED_to_COMPLETED
          - state_machines.Device.UNDER_MAINTENANCE_to_IN_SERVICE
          - calculations.intersection_posture
        distinguishing_aspect: "Depth-2 causal spine from a different trigger (work-order completion): complete sets Device IN_SERVICE, and that device state recomputes Intersection posture back to NORMAL."
        test_recipe:
          setup:
            - "Ticket triaged (device OUT_OF_SERVICE, intersection DEGRADED), work order scheduled and dispatched (device UNDER_MAINTENANCE)."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Fir & 8th", district: "D2", latitude: 40.7, longitude: -80.7 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M3", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew C", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 2, description: "out" }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0, ticket_id: "${tk_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 1.0 }
              as: FieldTech
              as_user_id: "${crew_id}"
          assert:
            - "Device.${dev_id}.status == IN_SERVICE"
            - "Intersection.${int_id}.operational_posture == NORMAL"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_beats_referential
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.WorkOrder.SCHEDULED_to_DISPATCHED
        distinguishing_aspect: "A DRAFT work order whose device is DECOMMISSIONED, dispatched: the state check (priority 5, ERR_INVALID_STATE) outranks the business_referential check (priority 7, ERR_DEVICE_DECOMMISSIONED)."
        test_recipe:
          setup:
            - "Device decommissioned BEFORE any work order exists; then a DRAFT work order created for that device (create has no device-status precondition)."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Gum & 9th", district: "D1", latitude: 40.8, longitude: -80.8 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M4", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /devices/${dev_id}/decommission"
              payload: {}
              as: Admin
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response error_id != ERR_DEVICE_DECOMMISSIONED"
            - "WorkOrder.${wo_id}.status == DRAFT"

      - name: excavation_schedule_safety_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
        distinguishing_aspect: "An EXCAVATION work order with an un-CLEARED locate AND estimated hours exceeding crew capacity: the business_safety check (priority 6, ERR_LOCATE_NOT_CLEARED) outranks the business_fiscal check (priority 10, ERR_CREW_CAPACITY_EXCEEDED)."
        test_recipe:
          setup:
            - "Crew with 1.0h capacity; OPEN (un-cleared) locate; EXCAVATION work order estimated 5.0h referencing that locate."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Holly & 10th", district: "D3", latitude: 40.9, longitude: -80.9 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "DETECTOR", criticality: "STANDARD", model: "D1", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 400.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Tiny", specialty: "LOCATE", labor_capacity_hours: 1.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /locate-requests"
              payload: { intersection_id: "${int_id}", requested_by: "UtilCo" }
              as: UtilityCoordinator
              captures: { loc_id: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "EXCAVATION", estimated_labor_hours: 5.0, locate_request_id: "${loc_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T13:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOCATE_NOT_CLEARED"
            - "response error_id != ERR_CREW_CAPACITY_EXCEEDED"
            - "WorkOrder.${wo_id}.status == DRAFT"

  - rule_id: boundary_precision_check
    instances:
      - name: sla_response_breached_at_exact_due
        grounds:
          - calculations.ticket_sla_windows
          - entities.Ticket.fields.sla_response_status
          - entities.Ticket.fields.response_due
        distinguishing_aspect: "Metric = elapsed minutes on GET /tickets/{id}: at exactly response_due (elapsed == 60 == P1 SLA) the inclusive '>=' rule yields BREACHED."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; CRITICAL device; hazard SRC_311 severity-4 ticket -> band P1 -> response SLA 60 min -> response_due 2026-03-01T01:00:00Z; then advance clock to exactly 01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Admin
            - call: "POST /intersections"
              payload: { name: "Iris & 11th", district: "D1", latitude: 41.0, longitude: -81.0 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_CONTROLLER", criticality: "CRITICAL", model: "C3", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 5000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "SRC_311", reported_severity: 4, description: "signal conflict", hazard_flag: true }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T01:00:00Z" }
              as: Admin
          trigger:
            - call: "GET /tickets/${tk_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "Ticket.${tk_id}.priority_band == P1"
            - "Ticket.${tk_id}.response_due == 2026-03-01T01:00:00Z"
            - "Ticket.${tk_id}.sla_response_status == BREACHED"

      - name: pole_load_exact_fill_allowed
        grounds:
          - calculations.pole_load_ledger
          - validations[priority=9]
          - entities.Pole.fields.available_load_units
        distinguishing_aspect: "Metric = load units on POST /pole-attachments/{id}/approve: committed_load_units + load_units == load_capacity_units (100) is allowed; only strictly greater is rejected."
        test_recipe:
          setup:
            - "Pole capacity 100; one APPROVED attachment of 60 (LOW zone); a second REQUESTED attachment of 40 (MID zone) created against the pole's fresh version."
          setup_api_calls:
            - call: "POST /poles"
              payload: { label: "P11", latitude: 41.0, longitude: -81.0, load_capacity_units: 100 }
              as: Admin
              captures: { pole_id: $.data.id, pole_v0: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "ISP1", mount_zone: "LOW", load_units: 60, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v0}" }
              as: UtilityCoordinator
              captures: { att1: $.data.id }
            - call: "POST /pole-attachments/${att1}/approve"
              payload: {}
              as: UtilityCoordinator
            - call: "GET /poles/${pole_id}"
              payload: {}
              as: UtilityCoordinator
              captures: { pole_v1: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "ISP2", mount_zone: "MID", load_units: 40, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v1}" }
              as: UtilityCoordinator
              captures: { att2: $.data.id }
          trigger:
            - call: "POST /pole-attachments/${att2}/approve"
              payload: {}
              as: UtilityCoordinator
          assert:
            - "PoleAttachment.${att2}.status == APPROVED"
            - "Pole.${pole_id}.committed_load_units == 100"
            - "Pole.${pole_id}.available_load_units == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: excavation_schedule_requires_cleared_locate
        grounds:
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
          - state_machines.LocateRequest.MARKED_to_CLEARED
          - validations[priority=6]
        distinguishing_aspect: "WorkOrder's DRAFT->SCHEDULED transition depends on the LocateRequest's status being CLEARED (entity pair WorkOrder x LocateRequest)."
        test_recipe:
          setup:
            - "Crew 8h; an OPEN locate; EXCAVATION work order referencing that locate."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Juno & 12th", district: "D2", latitude: 41.1, longitude: -81.1 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "DETECTOR", criticality: "STANDARD", model: "D2", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 400.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D", specialty: "LOCATE", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /locate-requests"
              payload: { intersection_id: "${int_id}", requested_by: "UtilCo" }
              as: UtilityCoordinator
              captures: { loc_id: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "EXCAVATION", estimated_labor_hours: 2.0, locate_request_id: "${loc_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOCATE_NOT_CLEARED"
            - "WorkOrder.${wo_id}.status == DRAFT"

      - name: timing_review_blocked_when_intersection_emergency
        grounds:
          - state_machines.TimingPlanChangeRequest.SUBMITTED_to_UNDER_REVIEW
          - calculations.intersection_posture
          - validations[priority=6]
        distinguishing_aspect: "TimingPlanChangeRequest's SUBMITTED->UNDER_REVIEW transition depends on the Intersection's operational_posture not being EMERGENCY (entity pair TimingPlanChangeRequest x Intersection)."
        test_recipe:
          setup:
            - "Intersection driven to EMERGENCY by a knockdown; a timing change request created AFTER the emergency (so it is SUBMITTED, not auto-suspended)."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Kite & 13th", district: "D1", latitude: 41.2, longitude: -81.2 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /poles"
              payload: { label: "P13", latitude: 41.2, longitude: -81.2, load_capacity_units: 100, intersection_id: "${int_id}" }
              as: Admin
              captures: { pole_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", pole_id: "${pole_id}", device_type: "SIGNAL_CONTROLLER", criticality: "CRITICAL", model: "C4", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 5000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /tickets"
              payload: { device_id: "${dev_id}", source: "KNOCKDOWN", reported_severity: 5, description: "down", hazard_flag: true, struck_pole: true }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tickets/${tk_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /timing-change-requests"
              payload: { intersection_id: "${int_id}", proposed_cycle_length_sec: 90, proposed_offset_sec: 5, rationale: "x" }
              as: Dispatcher
              captures: { tcr_id: $.data.id }
          trigger:
            - call: "POST /timing-change-requests/${tcr_id}/start-review"
              payload: {}
              as: TrafficEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INTERSECTION_EMERGENCY"
            - "TimingPlanChangeRequest.${tcr_id}.status == SUBMITTED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_schedule_half_open_overlap
        grounds:
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
          - validations[priority=8]
          - entities.WorkOrder.fields.scheduled_start
        distinguishing_aspect: "Crew occupancy uses half-open [scheduled_start, scheduled_end): [09:00,11:00) overlaps an existing [08:00,10:00) and is rejected, whereas a touching [10:00,12:00) would be allowed."
        test_recipe:
          setup:
            - "One crew (8h); two REPAIR work orders; the first scheduled 08:00-10:00 on 2026-03-02."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Lark & 14th", district: "D2", latitude: 41.3, longitude: -81.3 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M5", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew E", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0 }
              as: Dispatcher
              captures: { wo1: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 1.0 }
              as: Dispatcher
              captures: { wo2: $.data.id }
            - call: "POST /work-orders/${wo1}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo2}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREW_SCHEDULE_CONFLICT"
            - "WorkOrder.${wo2}.status == DRAFT"

      - name: attachment_window_buffer_conflict
        grounds:
          - state_machines.PoleAttachment.REQUESTED_to_APPROVED
          - validations[priority=8]
          - entities.PoleAttachment.fields.effective_from
        distinguishing_aspect: "Pole attachment occupancy on (pole_id, mount_zone) uses a closed window plus a 7-day buffer: a non-overlapping window only 2 days after an APPROVED one is still rejected — different interval semantics (buffered) than the crew's touch-allowed half-open."
        test_recipe:
          setup:
            - "Pole capacity 100; an APPROVED HIGH-zone attachment for 2026-04-01..2026-05-01; a REQUESTED HIGH-zone attachment for 2026-05-03..2026-06-01 (2-day gap < 7)."
          setup_api_calls:
            - call: "POST /poles"
              payload: { label: "P14", latitude: 41.3, longitude: -81.3, load_capacity_units: 100 }
              as: Admin
              captures: { pole_id: $.data.id, pole_v0: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "A", mount_zone: "HIGH", load_units: 10, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v0}" }
              as: UtilityCoordinator
              captures: { attA: $.data.id }
            - call: "POST /pole-attachments/${attA}/approve"
              payload: {}
              as: UtilityCoordinator
            - call: "GET /poles/${pole_id}"
              payload: {}
              as: UtilityCoordinator
              captures: { pole_v1: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "B", mount_zone: "HIGH", load_units: 10, effective_from: "2026-05-03T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", expected_pole_version: "${pole_v1}" }
              as: UtilityCoordinator
              captures: { attB: $.data.id }
          trigger:
            - call: "POST /pole-attachments/${attB}/approve"
              payload: {}
              as: UtilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ATTACHMENT_WINDOW_CONFLICT"
            - "PoleAttachment.${attB}.status == REQUESTED"

  - rule_id: compensating_invariant
    instances:
      - name: crew_labor_hours_conserved_on_cancel
        grounds:
          - calculations.crew_labor_ledger
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.Crew.fields.available_labor_hours
        distinguishing_aspect: "Conserved quantity = crew labor-hour pool: committed_labor_hours + available_labor_hours == labor_capacity_hours (8.0); schedule debits and cancel credits leave the pool identical."
        test_recipe:
          setup:
            - "Crew 8h; a REPAIR work order estimated 3.0h scheduled to the crew (committed 3.0, available 5.0)."
          setup_api_calls:
            - call: "POST /intersections"
              payload: { name: "Moss & 15th", district: "D1", latitude: 41.4, longitude: -81.4 }
              as: Admin
              captures: { int_id: $.data.id }
            - call: "POST /devices"
              payload: { intersection_id: "${int_id}", device_type: "SIGNAL_HEAD", criticality: "STANDARD", model: "M6", installed_at: "2025-01-01T00:00:00Z", replacement_cost: 1000.00, warranty_provider: "Acme" }
              as: Admin
              captures: { dev_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew F", specialty: "SIGNAL", labor_capacity_hours: 8.0 }
              as: Admin
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { device_id: "${dev_id}", work_type: "REPAIR", estimated_labor_hours: 3.0 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "Crew.${crew_id}.committed_labor_hours == 0"
            - "Crew.${crew_id}.available_labor_hours == 8.0"
            - "WorkOrder.${wo_id}.status == CANCELLED"

      - name: pole_load_units_conserved_on_revoke
        grounds:
          - calculations.pole_load_ledger
          - state_machines.PoleAttachment.APPROVED_to_REVOKED
          - entities.Pole.fields.available_load_units
        distinguishing_aspect: "Conserved quantity = pole load units: committed_load_units + available_load_units == load_capacity_units (100); approve debits and revoke credits leave the pole identical — a different conserved quantity than crew hours."
        test_recipe:
          setup:
            - "Pole capacity 100; one attachment of 30 units approved (committed 30, available 70)."
          setup_api_calls:
            - call: "POST /poles"
              payload: { label: "P15", latitude: 41.4, longitude: -81.4, load_capacity_units: 100 }
              as: Admin
              captures: { pole_id: $.data.id, pole_v0: $.data.version }
            - call: "POST /pole-attachments"
              payload: { pole_id: "${pole_id}", attacher_name: "A", mount_zone: "LOW", load_units: 30, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-05-01T00:00:00Z", expected_pole_version: "${pole_v0}" }
              as: UtilityCoordinator
              captures: { attA: $.data.id }
            - call: "POST /pole-attachments/${attA}/approve"
              payload: {}
              as: UtilityCoordinator
          trigger:
            - call: "POST /pole-attachments/${attA}/revoke"
              payload: {}
              as: UtilityCoordinator
          assert:
            - "Pole.${pole_id}.committed_load_units == 0"
            - "Pole.${pole_id}.available_load_units == 100"
            - "PoleAttachment.${attA}.status == REVOKED"
