              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", purchase_order_id: "${po_id}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /library/rental-orders/${o1}/reserve"
