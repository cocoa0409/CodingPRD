              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Real Kid", candidate_grade: "1", candidate_homeroom: "A" }
