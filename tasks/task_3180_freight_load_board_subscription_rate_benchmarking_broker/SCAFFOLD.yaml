# =============================================================================
# Task 3180 — Freight Load Board Subscription, Rate Benchmarking & Broker Credit
# (DAT Freight & Analytics style)
# =============================================================================

scenario: |
  Freight Load Board Subscription, Rate Benchmarking & Broker Credit (DAT Freight & Analytics): load and truck posting with lane, equipment and date search across a subscriber base, subscription tiering by posting volume, search access and analytics depth, rate benchmarking from transacted spot and contract data with lane-level percentiles and fuel adjustment, broker credit scores and days-to-pay reporting sourced from carrier payment experiences, authority and insurance verification integrated into the search results, fraud monitoring for double brokering, identity spoofing and cargo theft schemes with account suspension, dispute handling on credit reports and posting accuracy, data contribution requirements for certain analytics access

domain_name: freight-load-board
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BrokerOrg
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Broker legal name" }
      - { name: mc_number, type: string, source: input, description: "FMCSA MC number; unique across all broker orgs", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEACTIVATED", default: ACTIVE }
      - { name: credit_score, type: integer, source: computed, description: "0-100 broker credit score; see broker_credit_score" }
      - { name: credit_badge, type: enum, source: computed, description: "GOLD (>=80) | STANDARD (>=60) | WATCH (>=40) | CRITICAL (<40)" }
      - { name: days_to_pay_simple, type: number, source: computed, description: "Simple mean days_to_pay over included credit events" }
      - { name: days_to_pay_weighted, type: number, source: computed, description: "Invoice-amount-weighted mean days_to_pay over included credit events" }
      - { name: credit_event_count, type: integer, source: computed, description: "Count of CreditReportEvent with status PUBLISHED or UNDER_DISPUTE" }
      - { name: included_amount_cents, type: integer, source: computed, description: "Sum of invoice_amount_cents over events with status PUBLISHED" }
      - { name: under_dispute_amount_cents, type: integer, source: computed, description: "Sum of invoice_amount_cents over events with status UNDER_DISPUTE" }
      - { name: removed_amount_cents, type: integer, source: computed, description: "Sum of invoice_amount_cents over events with status REMOVED" }
      - { name: data_contribution_flag, type: boolean, source: computed, description: "True when >=10 ACCEPTED RateTransactions reported by this org in trailing 30 days" }

  - name: CarrierOrg
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: dot_number, type: string, source: input, description: "USDOT number; unique across all carrier orgs", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEACTIVATED", default: ACTIVE }
      - { name: data_contribution_flag, type: boolean, source: computed, description: "True when >=10 ACCEPTED RateTransactions reported by this org in trailing 30 days" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "BASIC | PRO | ENTERPRISE", constraints: "unique" }
      - { name: monthly_posting_allowance, type: integer, source: input, description: "Posts included in base fee before overage billing" }
      - { name: overage_tier1_limit, type: integer, source: input, description: "Overage posts billed at tier-1 rate before tier-2 rate applies" }
      - { name: overage_hard_cap, type: integer, source: input, description: "Max overage posts above allowance; further posts rejected" }
      - { name: search_daily_limit, type: integer, source: input, description: "Max load-board searches per logical-clock day" }
      - { name: analytics_depth, type: enum, source: input, description: "NONE | LANE_LEVEL | FULL" }
      - { name: requires_data_contribution, type: boolean, source: input, description: "True when FULL analytics requires data_contribution_flag on caller org" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id" }
      - { name: broker_org_id, type: string, source: input, description: "FK -> BrokerOrg.id; nullable; exactly one of broker_org_id/carrier_org_id required", constraints: "nullable" }
      - { name: carrier_org_id, type: string, source: input, description: "FK -> CarrierOrg.id; nullable; exactly one of broker_org_id/carrier_org_id required", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAST_DUE | SUSPENDED | CANCELLED", default: ACTIVE }
      - { name: period_start, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: period_end, type: datetime, source: system, description: "period_start + 30 days" }
      - { name: posts_used, type: integer, source: computed, description: "Posts created this period minus within-24h withdrawal refunds" }
      - { name: searches_used_today, type: integer, source: computed, description: "Searches by this subscription's org on the current logical-clock day" }
      - { name: period_price_cents, type: integer, source: computed, description: "See subscription_period_price_cents" }

  - name: LoadPost
    parent: null
    common_fields: true
    fields:
      - { name: broker_org_id, type: string, source: system, description: "FK -> BrokerOrg.id; set from acting BrokerAdmin" }
      - { name: origin, type: string, source: input, description: "Origin market code" }
      - { name: destination, type: string, source: input, description: "Destination market code" }
      - { name: equipment_type, type: enum, source: input, description: "DRY_VAN | REEFER | FLATBED" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Pickup window open (inclusive)" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Pickup window close (exclusive)" }
      - { name: rate_offer_cents, type: integer, source: input, description: "Offered all-in rate" }
      - { name: status, type: enum, source: system, description: "OPEN | BOOKED | COMPLETED | WITHDRAWN | EXPIRED", default: OPEN }
      - { name: visibility, type: enum, source: system, description: "LISTED | DELISTED; independent parallel dimension", default: LISTED }
      - { name: broker_credit_badge, type: enum, source: computed, description: "Join: posting broker's current credit_badge, surfaced in search results" }
      - { name: broker_authority_status, type: enum, source: computed, description: "Join: posting broker's current AuthorityVerification status, surfaced in search results" }

  - name: TruckPost
    parent: null
    common_fields: true
    fields:
      - { name: carrier_org_id, type: string, source: system, description: "FK -> CarrierOrg.id; set from acting CarrierAdmin" }
      - { name: origin, type: string, source: input, description: "Origin market code" }
      - { name: destination, type: string, source: input, description: "Destination market code" }
      - { name: equipment_type, type: enum, source: input, description: "DRY_VAN | REEFER | FLATBED" }
      - { name: available_from, type: datetime, source: input, description: "Availability window open (inclusive, half-open semantics)" }
      - { name: available_until, type: datetime, source: input, description: "Availability window close (exclusive, half-open semantics)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | BOOKED | COMPLETED | WITHDRAWN | EXPIRED", default: AVAILABLE }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: load_post_id, type: string, source: input, description: "FK -> LoadPost.id" }
      - { name: truck_post_id, type: string, source: input, description: "FK -> TruckPost.id" }
      - { name: agreed_rate_cents, type: integer, source: input, description: "Negotiated all-in rate" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED", default: BOOKED }
      - { name: rate_transaction_id, type: string, source: system, description: "FK -> RateTransaction.id; nullable; set on completion", constraints: "nullable" }

  - name: RateTransaction
    parent: null
    common_fields: true
    fields:
      - { name: source, type: enum, source: system, description: "BOOKING | CONTRIBUTED" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; nullable; set when source=BOOKING", constraints: "nullable" }
      - { name: reporter_broker_org_id, type: string, source: system, description: "FK -> BrokerOrg.id; nullable; exactly one reporter set", constraints: "nullable" }
      - { name: reporter_carrier_org_id, type: string, source: system, description: "FK -> CarrierOrg.id; nullable; exactly one reporter set", constraints: "nullable" }
      - { name: origin, type: string, source: input, description: "Origin market code" }
      - { name: destination, type: string, source: input, description: "Destination market code" }
      - { name: equipment_type, type: enum, source: input, description: "DRY_VAN | REEFER | FLATBED" }
      - { name: rate_kind, type: enum, source: input, description: "SPOT | CONTRACT" }
      - { name: rate_cents, type: integer, source: input, description: "All-in transacted rate" }
      - { name: fuel_price_cents, type: integer, source: input, description: "Diesel price per gallon in cents on transaction_date" }
      - { name: transaction_date, type: datetime, source: input, description: "When the transaction occurred" }
      - { name: status, type: enum, source: system, description: "ACCEPTED | EXCLUDED", default: ACCEPTED }

  - name: CreditReportEvent
    parent: null
    common_fields: true
    fields:
      - { name: broker_org_id, type: string, source: input, description: "FK -> BrokerOrg.id; broker being reported on" }
      - { name: carrier_org_id, type: string, source: system, description: "FK -> CarrierOrg.id; reporting carrier, set from acting CarrierAdmin" }
      - { name: invoice_amount_cents, type: integer, source: input, description: "Invoice amount paid late/on time" }
      - { name: days_to_pay, type: integer, source: input, description: "Days from invoice to payment" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | UNDER_DISPUTE | REMOVED", default: PUBLISHED }

  - name: CreditDispute
    parent: null
    common_fields: true
    fields:
      - { name: credit_report_event_id, type: string, source: input, description: "FK -> CreditReportEvent.id" }
      - { name: reason, type: string, source: input, description: "Broker's dispute rationale" }
      - { name: rebuttal_count, type: integer, source: system, description: "Number of broker rebuttals submitted", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | REBUTTED | RESOLVED_SUSTAIN | RESOLVED_REMOVE", default: FILED }

  - name: FraudAlert
    parent: null
    common_fields: true
    fields:
      - { name: alert_type, type: enum, source: input, description: "DOUBLE_BROKERING | IDENTITY_SPOOFING | CARGO_THEFT" }
      - { name: target_broker_org_id, type: string, source: input, description: "FK -> BrokerOrg.id; nullable; at least one target required", constraints: "nullable" }
      - { name: target_carrier_org_id, type: string, source: input, description: "FK -> CarrierOrg.id; nullable; at least one target required", constraints: "nullable" }
      - { name: evidence_note, type: string, source: input, description: "Analyst evidence summary" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED", default: OPEN }

  - name: AuthorityVerification
    parent: null
    common_fields: true
    fields:
      - { name: broker_org_id, type: string, source: input, description: "FK -> BrokerOrg.id; nullable; exactly one of broker_org_id/carrier_org_id required", constraints: "nullable" }
      - { name: carrier_org_id, type: string, source: input, description: "FK -> CarrierOrg.id; nullable; exactly one of broker_org_id/carrier_org_id required", constraints: "nullable" }
      - { name: authority_reference, type: string, source: input, description: "Operating authority docket reference" }
      - { name: insurance_windows, type: array, source: input, description: "Array of {effective_from, effective_to} half-open insurance policy windows" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | EXPIRED | REVOKED", default: PENDING }
      - { name: insurance_ok, type: boolean, source: computed, description: "See insurance_coverage: no gap and clock covered" }
      - { name: covered_until, type: datetime, source: computed, description: "Max effective_to across merged contiguous windows; null when no windows", constraints: "nullable" }
      - { name: coverage_gap_detected, type: boolean, source: computed, description: "True when sorted windows contain a gap" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BrokerOrg
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /broker-orgs/{id}/suspend (administrative suspension)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Every LoadPost of this broker with status==OPEN: status -> WITHDRAWN and visibility -> DELISTED"
          - "Every LoadPost of this broker with status==BOOKED: visibility -> DELISTED (lifecycle status unchanged; bookings untouched)"
          - "Subscription with broker_org_id==this org and status==ACTIVE: status -> SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (FraudAlert targeting this broker transitions OPEN -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "Administrative cascade above, PLUS:"
          - "Every Booking on a LoadPost of this broker with status==BOOKED: status -> CANCELLED; that Booking's TruckPost (if status==BOOKED): status -> AVAILABLE"
          - "Every RateTransaction with reporter_broker_org_id==this org and status==ACCEPTED: status -> EXCLUDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (credit_score recomputed < 40 on a dispute-resolution recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "Administrative cascade above, PLUS booking cancellation exactly as the fraud cascade (RateTransactions are NOT excluded by the credit cascade)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /broker-orgs/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: ["No FraudAlert targeting this broker with status==CONFIRMED"]
        side_effects:
          - "Every LoadPost of this broker with visibility==DELISTED and status==BOOKED: visibility -> LISTED"
          - "Subscription with broker_org_id==this org and status==SUSPENDED: status -> ACTIVE"
      - from: [ACTIVE, SUSPENDED]
        to: DEACTIVATED
        trigger: "POST /broker-orgs/{id}/deactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Terminal: org can no longer post, search, or be reinstated"]

  - entity: CarrierOrg
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /carrier-orgs/{id}/suspend (administrative suspension)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Every TruckPost of this carrier with status==AVAILABLE: status -> WITHDRAWN"
          - "Subscription with carrier_org_id==this org and status==ACTIVE: status -> SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (FraudAlert targeting this carrier transitions OPEN -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "Administrative cascade above, PLUS:"
          - "Every Booking on a TruckPost of this carrier with status==BOOKED: status -> CANCELLED; that Booking's LoadPost (if status==BOOKED): status -> OPEN and visibility -> LISTED"
          - "Every RateTransaction with reporter_carrier_org_id==this org and status==ACCEPTED: status -> EXCLUDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /carrier-orgs/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: ["No FraudAlert targeting this carrier with status==CONFIRMED"]
        side_effects:
          - "Subscription with carrier_org_id==this org and status==SUSPENDED: status -> ACTIVE"
      - from: [ACTIVE, SUSPENDED]
        to: DEACTIVATED
        trigger: "POST /carrier-orgs/{id}/deactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/mark-past-due"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Increments version by 1"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/record-payment"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Increments version by 1"]
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "system (logical clock >= period_end + 7 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/record-payment"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [ACTIVE, PAST_DUE, SUSPENDED]
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: LoadPost
    initial_state: "status=OPEN, visibility=LISTED"
    terminal_states: ["status in (COMPLETED, WITHDRAWN, EXPIRED)"]
    transitions:
      - from: "status=OPEN"
        to: "status=BOOKED"
        trigger: "system (Booking created referencing this load)"
        actor: system
        preconditions: ["visibility==LISTED"]
        side_effects: []
      - from: "status=BOOKED"
        to: "status=COMPLETED"
        trigger: "system (Booking completed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "status=BOOKED"
        to: "status=OPEN"
        trigger: "system (Booking cancelled by either party)"
        actor: system
        preconditions: []
        side_effects: ["visibility -> LISTED"]
      - from: "status=OPEN"
        to: "status=WITHDRAWN"
        trigger: "POST /load-posts/{id}/withdraw"
        actor: BrokerAdmin
        preconditions: ["Acting BrokerAdmin owns this load (broker_org_id == X-User-ID)"]
        side_effects:
          - "If logical clock - created_at <= 24h: owning Subscription.posts_used -= 1 (refund)"
      - from: "status=OPEN"
        to: "status=EXPIRED"
        trigger: "system (logical clock >= pickup_window_end; applied eagerly on clock set and lazily on read)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "visibility=LISTED"
        to: "visibility=DELISTED"
        trigger: "system (broker suspended)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "visibility=DELISTED"
        to: "visibility=LISTED"
        trigger: "system (broker reinstated, only when status==BOOKED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TruckPost
    initial_state: AVAILABLE
    terminal_states: [COMPLETED, WITHDRAWN, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: BOOKED
        trigger: "system (Booking created referencing this truck)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: COMPLETED
        trigger: "system (Booking completed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: AVAILABLE
        trigger: "system (Booking cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "POST /truck-posts/{id}/withdraw"
        actor: CarrierAdmin
        preconditions: ["Acting CarrierAdmin owns this truck (carrier_org_id == X-User-ID)"]
        side_effects:
          - "If logical clock - created_at <= 24h: owning Subscription.posts_used -= 1 (refund)"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (logical clock >= available_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Booking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: CarrierAdmin
        preconditions: ["Acting CarrierAdmin owns the TruckPost on this booking"]
        side_effects:
          - "LoadPost.status -> COMPLETED; TruckPost.status -> COMPLETED"
          - "Create RateTransaction: source=BOOKING, rate_kind=SPOT, reporter_carrier_org_id=booking carrier, rate_cents=agreed_rate_cents, transaction_date=logical clock; Booking.rate_transaction_id set"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: "CarrierAdmin or BrokerAdmin"
        preconditions: ["Acting org owns the TruckPost (CarrierAdmin) or the LoadPost (BrokerAdmin)"]
        side_effects:
          - "LoadPost.status -> OPEN, visibility -> LISTED; TruckPost.status -> AVAILABLE"

  - entity: CreditReportEvent
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: UNDER_DISPUTE
        trigger: "system (CreditDispute filed on this event)"
        actor: system
        preconditions: []
        side_effects:
          - "BrokerOrg credit fields recomputed excluding UNDER_DISPUTE events (no auto-suspension)"
      - from: UNDER_DISPUTE
        to: PUBLISHED
        trigger: "system (CreditDispute resolved with outcome=SUSTAIN)"
        actor: system
        preconditions: []
        side_effects:
          - "BrokerOrg credit fields recomputed including this event"
      - from: UNDER_DISPUTE
        to: REMOVED
        trigger: "system (CreditDispute resolved with outcome=REMOVE)"
        actor: system
        preconditions: []
        side_effects:
          - "BrokerOrg credit fields recomputed permanently excluding this event"
          - "If recomputed credit_score < 40: BrokerOrg -> SUSPENDED (full suspension cascade fires)"

  - entity: CreditDispute
    initial_state: FILED
    terminal_states: [RESOLVED_SUSTAIN, RESOLVED_REMOVE]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /credit-disputes/{id}/start-review"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REBUTTED
        trigger: "POST /credit-disputes/{id}/rebut"
        actor: BrokerAdmin
        preconditions: ["rebuttal_count < 2", "Acting BrokerAdmin is the broker named on the disputed event"]
        side_effects: ["rebuttal_count += 1"]
      - from: REBUTTED
        to: UNDER_REVIEW
        trigger: "POST /credit-disputes/{id}/start-review"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects: []
      - from: [FILED, UNDER_REVIEW, REBUTTED]
        to: RESOLVED_SUSTAIN
        trigger: "POST /credit-disputes/{id}/resolve with outcome=SUSTAIN"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects: ["CreditReportEvent -> PUBLISHED; broker credit fields recomputed"]
      - from: [FILED, UNDER_REVIEW, REBUTTED]
        to: RESOLVED_REMOVE
        trigger: "POST /credit-disputes/{id}/resolve with outcome=REMOVE"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects: ["CreditReportEvent -> REMOVED; broker credit fields recomputed; score<40 cascade evaluated"]

  - entity: FraudAlert
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /fraud-alerts/{id}/confirm"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects:
          - "Target org -> SUSPENDED (full cascade: posts withdrawn/delisted, bookings cancelled, trucks released, subscription suspended, reported RateTransactions EXCLUDED)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /fraud-alerts/{id}/dismiss"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects: []

  - entity: AuthorityVerification
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /authority-verifications/{id}/verify"
        actor: ComplianceAnalyst
        preconditions: ["insurance_coverage: no gap and logical clock within merged coverage", "authority_reference non-empty"]
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (logical clock >= covered_until; applied eagerly on clock set and lazily on read)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /authority-verifications/{id}/verify after insurance_windows updated to restore coverage"
        actor: ComplianceAnalyst
        preconditions: ["insurance_coverage satisfied against current clock"]
        side_effects: []
      - from: [PENDING, VERIFIED, EXPIRED]
        to: REVOKED
        trigger: "POST /authority-verifications/{id}/revoke"
        actor: ComplianceAnalyst
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-change-plan-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing a Subscription's plan requires the client to present the
      Subscription.version it last observed. If any intervening mutation
      (mark-past-due, record-payment, a prior change-plan, or a cascade)
      advanced Subscription.version, the request is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: subscription_period_price_cents
    trigger: "on Subscription read; recomputed whenever posts_used or plan changes"
    algorithm: tiered_pricing
    formula: |
      base = PLAN_BASE_CENTS[plan.code]
      overage = max(0, posts_used - plan.monthly_posting_allowance)
      tier1_posts = min(overage, plan.overage_tier1_limit)
      tier2_posts = max(0, overage - plan.overage_tier1_limit)
      addon = ANALYTICS_ADDON_CENTS[plan.analytics_depth]
      period_price_cents = base + tier1_posts*OVERAGE_TIER1_RATE_CENTS + tier2_posts*OVERAGE_TIER2_RATE_CENTS + addon
    input_set: "The subscription's plan plus its computed posts_used for the current period"
    constants:
      PLAN_BASE_CENTS: {BASIC: 9900, PRO: 24900, ENTERPRISE: 49900}
      OVERAGE_TIER1_RATE_CENTS: 150
      OVERAGE_TIER2_RATE_CENTS: 300
      ANALYTICS_ADDON_CENTS: {NONE: 0, LANE_LEVEL: 2000, FULL: 5000}
    precision: "integer cents; no rounding needed"

  - name: posting_quota_check
    trigger: "POST /load-posts and POST /truck-posts"
    algorithm: threshold
    formula: |
      hard_cap = plan.monthly_posting_allowance + plan.overage_hard_cap
      create allowed iff subscription.posts_used < hard_cap
      (posts_used == hard_cap is rejected; boundary is inclusive-reject)
    input_set: "Acting org's Subscription (must be ACTIVE) and its plan"
    precision: "integer counts"

  - name: data_contribution_flag
    trigger: "recomputed on every RateTransaction create/exclude and on read of org"
    algorithm: threshold
    formula: |
      count = number of RateTransactions reported by this org with status==ACCEPTED
              and transaction_date within [clock - 30 days, clock] inclusive
      data_contribution_flag = (count >= 10)   # exactly 10 qualifies
    input_set: "ACCEPTED transactions only; EXCLUDED never count"
    constants:
      CONTRIBUTION_MIN: 10
      CONTRIBUTION_WINDOW_DAYS: 30
    precision: "integer counts"

  - name: fuel_surcharge_pct
    trigger: "inside lane_rate_benchmark, per transaction"
    algorithm: threshold
    formula: |
      steps = max(0, floor((fuel_price_cents - BASE_FUEL_CENTS) / STEP_CENTS))
      fsc_pct = min(steps * STEP_PCT, MAX_FSC_PCT)
    constants:
      BASE_FUEL_CENTS: 300
      STEP_CENTS: 25
      STEP_PCT: 0.01
      MAX_FSC_PCT: 0.20
    precision: "4 decimal places"

  - name: lane_rate_benchmark
    trigger: "GET /lane-rate-benchmarks"
    algorithm: aggregation
    formula: |
      Candidates: RateTransaction with matching origin, destination, equipment_type,
        status==ACCEPTED, transaction_date within [clock - 30 days, clock] inclusive.
      Variant SPOT_ONLY: keep only rate_kind==SPOT.
      Variant BLENDED: keep all; for CONTRACT rows use effective_rate_cents = round_half_up(rate_cents * 0.95);
        for SPOT rows effective_rate_cents = rate_cents.
      If count < 5: reject with ERR_INSUFFICIENT_BENCHMARK_DATA (422).
      ROUNDING ORDER (pinned, must not be reordered):
        1. per-transaction: surcharge_cents = round_half_up(effective_rate_cents * fsc_pct(txn.fuel_price_cents));
           linehaul_cents = effective_rate_cents - surcharge_cents
        2. sort linehaul_cents ASC; nearest-rank percentile: p_k = element at 1-indexed position ceil(k/100 * N)
        3. fuel_adjusted_p50_cents = p50_linehaul_cents + round_half_up(p50_linehaul_cents * fsc_pct(median fuel_price_cents of the sample set))
           (median fuel price = element at position ceil(N/2) of fuel prices sorted ASC)
    input_set: "See formula; EXCLUDED transactions and out-of-window dates are omitted"
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: SPOT_ONLY
        when: "requested variant=SPOT_ONLY; the only variant available to LANE_LEVEL analytics depth"
        difference: "CONTRACT transactions excluded entirely"
      - name: BLENDED
        when: "requested variant=BLENDED; requires FULL analytics depth (and data contribution when the plan demands it)"
        difference: "CONTRACT transactions included at 95% effective rate, shifting all percentiles"

  - name: broker_credit_score
    trigger: "on CreditReportEvent create; on dispute file/resolve; on read of BrokerOrg"
    algorithm: weighted_scoring
    formula: |
      Included events: CreditReportEvent for this broker with status==PUBLISHED
        (UNDER_DISPUTE and REMOVED are excluded), reported_at within [clock - 365 days, clock].
      days_to_pay_simple = mean(days_to_pay) over included (null when 0 events)
      days_to_pay_weighted = sum(days_to_pay * invoice_amount_cents) / sum(invoice_amount_cents)
      Variant selection: if count(included) >= 5 use days_to_pay_weighted else days_to_pay_simple.
      With 0 included events: credit_score = 70, badge = STANDARD.
      avg = selected days-to-pay
      raw = 100 - max(0, avg - 30) * 2
      confidence = min(1, count(included) / 10)
      credit_score = clamp(round_half_up(70 + (raw - 70) * confidence), 0, 100)
      credit_badge = GOLD if score>=80; STANDARD if >=60; WATCH if >=40; else CRITICAL
      Auto-suspension at score < 40 is evaluated ONLY on dispute-resolution recomputes
      and FraudAlert confirmation — never on event creation.
    input_set: "PUBLISHED events only"
    precision: "score integer; averages 4 decimal places, round_half_up"
    variants:
      - name: SIMPLE
        when: "fewer than 5 included events"
        difference: "unweighted mean days_to_pay"
      - name: AMOUNT_WEIGHTED
        when: "5 or more included events"
        difference: "invoice-amount-weighted mean; identical event list yields a different score whenever amounts are unequal"

  - name: insurance_coverage
    trigger: "AuthorityVerification create/verify; recomputed on read and on clock set"
    algorithm: interval_merge
    formula: |
      Sort insurance_windows by effective_from ASC, tie-break effective_to ASC.
      Merge with half-open semantics: window W extends coverage iff W.effective_from <= covered_until;
      adjacency (W.effective_from == covered_until) counts as contiguous.
      coverage_gap_detected = true iff some window's effective_from > covered_until at its turn.
      covered_until = max effective_to over merged contiguous prefix.
      insurance_ok = (not coverage_gap_detected) and (covered_until is not null)
                     and (first_effective_from <= clock < covered_until)
      AuthorityVerification status EXPIRED when clock >= covered_until (and not REVOKED).
    input_set: "The verification's insurance_windows array"
    precision: "datetime comparison, half-open [from, to)"

  - name: truck_window_overlap
    trigger: "POST /truck-posts"
    algorithm: interval_merge
    formula: |
      For same carrier_org_id among TruckPosts with status==AVAILABLE:
      overlap iff new.available_from < existing.available_until AND new.available_until > existing.available_from
      Adjacency (new.available_from == existing.available_until or new.available_until == existing.available_from)
      is NOT overlap and is allowed.
    input_set: "AVAILABLE truck posts of the acting carrier only"
    precision: "datetime comparison, half-open [from, until)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.7", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK ids exist, validated left-to-right in the order declared by the endpoint's input list", error_id: "ERR_ORG_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_LOAD_POST_NOT_FOUND / ERR_TRUCK_POST_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_RATE_TRANSACTION_NOT_FOUND / ERR_CREDIT_EVENT_NOT_FOUND / ERR_DISPUTE_NOT_FOUND / ERR_FRAUD_ALERT_NOT_FOUND / ERR_AUTHORITY_VERIFICATION_NOT_FOUND", http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Org status==ACTIVE; Subscription status==ACTIVE; entity in a state that permits the transition (incl. ERR_LOAD_POST_NOT_OPEN, ERR_TRUCK_POST_NOT_AVAILABLE, ERR_BOOKING_NOT_ACTIVE, ERR_CREDIT_EVENT_NOT_PUBLISHED, ERR_DISPUTE_INVALID_STATE, ERR_ORG_NOT_ACTIVE, ERR_SUBSCRIPTION_NOT_ACTIVE)", error_id: "state-specific 409 codes", http_status: 409, applies_to: "state-dependent operations" }
  - { priority: 5, category: business_safety, check: "Authority VERIFIED and insurance_ok for the acting org; no CONFIRMED FraudAlert targets the acting org", error_id: "ERR_AUTHORITY_NOT_VERIFIED / ERR_INSURANCE_NOT_VERIFIED / ERR_ORG_HAS_CONFIRMED_FRAUD", http_status: 409, applies_to: "posting and booking operations" }
  - { priority: 6, category: business_referential, check: "Ownership: acting entity-backed org owns the target resource (load post, truck post, booking side, disputed event)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "ownership-scoped operations" }
  - { priority: 7, category: business_temporal, check: "Truck availability window overlap; pickup window start < end; dispute filed within 90 days of reported_at", error_id: "ERR_TRUCK_WINDOW_OVERLAP / ERR_INVALID_REQUEST / ERR_DISPUTE_WINDOW_EXPIRED", http_status: "409 or 422", applies_to: "temporal operations" }
  - { priority: 8, category: business_constraint, check: "Enum membership, unique mc_number/dot_number, XOR org fields, positive amounts, rebuttal_count < 2, OCC version match", error_id: "ERR_INVALID_REQUEST / ERR_DUPLICATE_MC_NUMBER / ERR_DUPLICATE_DOT_NUMBER / ERR_REBUTTAL_LIMIT_EXCEEDED / ERR_STALE_VERSION", http_status: "400/409/412", applies_to: "write operations" }
  - { priority: 9, category: business_fiscal, check: "Posting hard cap and daily search limit", error_id: "ERR_POSTING_QUOTA_EXCEEDED / ERR_SEARCH_LIMIT_EXCEEDED", http_status: 402, applies_to: "posting and search operations" }

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z before any call; the server never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Apply eager EXPIRED transitions for LoadPost/TruckPost/AuthorityVerification rows whose windows the clock passed"] }

  - { method: POST, path: "/broker-orgs", description: "Create broker org", roles: [PlatformAdmin], code: 201, input: [legal_name, mc_number], output: BrokerOrg, side_effects: ["status=ACTIVE, credit_score=70, credit_badge=STANDARD"] }
  - { method: GET, path: "/broker-orgs", description: "List broker orgs", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "BrokerOrg[]", side_effects: [] }
  - { method: GET, path: "/broker-orgs/{id}", description: "Get broker org", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: BrokerOrg, side_effects: ["Recompute credit fields lazily"] }
  - { method: POST, path: "/broker-orgs/{id}/suspend", description: "Suspend broker org", roles: [PlatformAdmin], code: 200, input: [], output: BrokerOrg, side_effects: ["Administrative suspension cascade (see BrokerOrg state machine)"] }
  - { method: POST, path: "/broker-orgs/{id}/reinstate", description: "Reinstate broker org", roles: [PlatformAdmin], code: 200, input: [], output: BrokerOrg, side_effects: ["Re-list BOOKED loads; reactivate subscription"] }
  - { method: POST, path: "/broker-orgs/{id}/deactivate", description: "Deactivate broker org (terminal)", roles: [PlatformAdmin], code: 200, input: [], output: BrokerOrg, side_effects: [] }

  - { method: POST, path: "/carrier-orgs", description: "Create carrier org", roles: [PlatformAdmin], code: 201, input: [legal_name, dot_number], output: CarrierOrg, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/carrier-orgs", description: "List carrier orgs", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "CarrierOrg[]", side_effects: [] }
  - { method: GET, path: "/carrier-orgs/{id}", description: "Get carrier org", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: CarrierOrg, side_effects: [] }
  - { method: POST, path: "/carrier-orgs/{id}/suspend", description: "Suspend carrier org", roles: [PlatformAdmin], code: 200, input: [], output: CarrierOrg, side_effects: ["Administrative suspension cascade (see CarrierOrg state machine)"] }
  - { method: POST, path: "/carrier-orgs/{id}/reinstate", description: "Reinstate carrier org", roles: [PlatformAdmin], code: 200, input: [], output: CarrierOrg, side_effects: ["Reactivate subscription"] }

  - { method: POST, path: "/subscription-plans", description: "Create subscription plan", roles: [PlatformAdmin], code: 201, input: [code, monthly_posting_allowance, overage_tier1_limit, overage_hard_cap, search_daily_limit, analytics_depth, requires_data_contribution], output: SubscriptionPlan, side_effects: [] }
  - { method: GET, path: "/subscription-plans", description: "List subscription plans", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: "SubscriptionPlan[]", side_effects: [] }

  - { method: POST, path: "/subscriptions", description: "Create subscription for exactly one org (XOR broker_org_id/carrier_org_id)", roles: [PlatformAdmin], code: 201, input: [plan_id, "broker_org_id?", "carrier_org_id?"], output: Subscription, side_effects: ["period_start=clock, period_end=clock+30d, status=ACTIVE"] }
  - { method: GET, path: "/subscriptions", description: "List/filter subscriptions", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["plan_id?", "broker_org_id?", "carrier_org_id?", "status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/subscriptions/{id}", description: "Get subscription (period_price_cents recomputed)", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/subscriptions/{id}/change-plan", description: "Change plan under OCC", roles: [PlatformAdmin], code: 200, input: [plan_id, expected_subscription_version], output: Subscription, side_effects: ["Increments Subscription.version by 1; period_price_cents recomputed"] }
  - { method: POST, path: "/subscriptions/{id}/mark-past-due", description: "ACTIVE -> PAST_DUE", roles: [PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["Increments Subscription.version by 1"] }
  - { method: POST, path: "/subscriptions/{id}/record-payment", description: "PAST_DUE/SUSPENDED -> ACTIVE", roles: [PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["Increments Subscription.version by 1"] }
  - { method: POST, path: "/subscriptions/{id}/cancel", description: "Cancel subscription (terminal)", roles: [PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: ["Increments Subscription.version by 1"] }

  - { method: POST, path: "/load-posts", description: "Post a load (BrokerAdmin; consumes posting quota)", roles: [BrokerAdmin], code: 201, input: [origin, destination, equipment_type, pickup_window_start, pickup_window_end, rate_offer_cents], output: LoadPost, side_effects: ["posts_used += 1 on acting broker's ACTIVE subscription"] }
  - { method: GET, path: "/load-posts", description: "Search loads by lane/equipment/date; CarrierAdmin searches consume daily search limit; rows include broker_credit_badge and broker_authority_status", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["origin?", "destination?", "equipment_type?", "pickup_on?", "status?", "broker_org_id?", "limit?", "offset?"], output: "LoadPost[]", side_effects: ["searches_used_today += 1 for CarrierAdmin callers"] }
  - { method: GET, path: "/load-posts/{id}", description: "Get load post", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: LoadPost, side_effects: ["Lazy EXPIRED check"] }
  - { method: POST, path: "/load-posts/{id}/withdraw", description: "Withdraw an OPEN load (owner broker)", roles: [BrokerAdmin], code: 200, input: [], output: LoadPost, side_effects: ["status -> WITHDRAWN; 24h refund rule on posts_used"] }

  - { method: POST, path: "/truck-posts", description: "Post a truck (CarrierAdmin; consumes posting quota; overlap-checked)", roles: [CarrierAdmin], code: 201, input: [origin, destination, equipment_type, available_from, available_until], output: TruckPost, side_effects: ["posts_used += 1 on acting carrier's ACTIVE subscription"] }
  - { method: GET, path: "/truck-posts", description: "List/filter truck posts", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["carrier_org_id?", "origin?", "destination?", "equipment_type?", "status?", "limit?", "offset?"], output: "TruckPost[]", side_effects: [] }
  - { method: GET, path: "/truck-posts/{id}", description: "Get truck post", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: TruckPost, side_effects: ["Lazy EXPIRED check"] }
  - { method: POST, path: "/truck-posts/{id}/withdraw", description: "Withdraw an AVAILABLE truck (owner carrier)", roles: [CarrierAdmin], code: 200, input: [], output: TruckPost, side_effects: ["status -> WITHDRAWN; 24h refund rule on posts_used"] }

  - { method: POST, path: "/bookings", description: "Carrier books a load", roles: [CarrierAdmin], code: 201, input: [load_post_id, truck_post_id, agreed_rate_cents], output: Booking, side_effects: ["LoadPost -> BOOKED; TruckPost -> BOOKED"] }
  - { method: GET, path: "/bookings", description: "List/filter bookings", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["load_post_id?", "truck_post_id?", "rate_transaction_id?", "status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/bookings/{id}", description: "Get booking", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/bookings/{id}/complete", description: "Complete booking; emits BOOKING RateTransaction", roles: [CarrierAdmin], code: 200, input: [], output: Booking, side_effects: ["RateTransaction created; load and truck -> COMPLETED"] }
  - { method: POST, path: "/bookings/{id}/cancel", description: "Cancel booking (either party)", roles: [CarrierAdmin, BrokerAdmin], code: 200, input: [], output: Booking, side_effects: ["LoadPost -> OPEN+LISTED; TruckPost -> AVAILABLE"] }

  - { method: POST, path: "/rate-transactions", description: "Contribute a transacted rate (source=CONTRIBUTED)", roles: [BrokerAdmin, CarrierAdmin], code: 201, input: [origin, destination, equipment_type, rate_kind, rate_cents, fuel_price_cents, transaction_date], output: RateTransaction, side_effects: ["reporter org's data_contribution_flag recomputed"] }
  - { method: GET, path: "/rate-transactions", description: "List/filter rate transactions", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["booking_id?", "reporter_broker_org_id?", "reporter_carrier_org_id?", "origin?", "destination?", "equipment_type?", "rate_kind?", "status?", "limit?", "offset?"], output: "RateTransaction[]", side_effects: [] }
  - { method: GET, path: "/rate-transactions/{id}", description: "Get rate transaction", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: RateTransaction, side_effects: [] }
  - { method: POST, path: "/rate-transactions/{id}/exclude", description: "Exclude a transaction from benchmarks", roles: [DataOps], code: 200, input: [], output: RateTransaction, side_effects: ["status -> EXCLUDED"] }

  - { method: GET, path: "/lane-rate-benchmarks", description: "Computed lane benchmark. variant=SPOT_ONLY needs LANE_LEVEL depth; variant=BLENDED needs FULL depth and, when the plan requires it, data_contribution_flag on the caller's org.", roles: [BrokerAdmin, CarrierAdmin], code: 200, input: [origin, destination, equipment_type, variant], output: { lane_key: string, sample_count: integer, p25_linehaul_cents: integer, p50_linehaul_cents: integer, p75_linehaul_cents: integer, fuel_adjusted_p50_cents: integer, variant: string }, side_effects: [] }

  - { method: POST, path: "/credit-report-events", description: "Carrier reports a payment experience on a broker", roles: [CarrierAdmin], code: 201, input: [broker_org_id, invoice_amount_cents, days_to_pay], output: CreditReportEvent, side_effects: ["BrokerOrg credit fields recomputed (no auto-suspension on create)"] }
  - { method: GET, path: "/credit-report-events", description: "List/filter credit report events", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["broker_org_id?", "carrier_org_id?", "status?", "limit?", "offset?"], output: "CreditReportEvent[]", side_effects: [] }
  - { method: GET, path: "/credit-report-events/{id}", description: "Get credit report event", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: CreditReportEvent, side_effects: [] }

  - { method: POST, path: "/credit-report-events/{id}/disputes", description: "Broker disputes a credit report event", roles: [BrokerAdmin], code: 201, input: [reason], output: CreditDispute, side_effects: ["CreditReportEvent -> UNDER_DISPUTE; broker credit recomputed excluding it"] }
  - { method: GET, path: "/credit-disputes", description: "List/filter credit disputes", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["credit_report_event_id?", "status?", "limit?", "offset?"], output: "CreditDispute[]", side_effects: [] }
  - { method: GET, path: "/credit-disputes/{id}", description: "Get credit dispute", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: CreditDispute, side_effects: [] }
  - { method: POST, path: "/credit-disputes/{id}/start-review", description: "FILED/REBUTTED -> UNDER_REVIEW", roles: [ComplianceAnalyst], code: 200, input: [], output: CreditDispute, side_effects: [] }
  - { method: POST, path: "/credit-disputes/{id}/rebut", description: "UNDER_REVIEW -> REBUTTED (max 2 rebuttals)", roles: [BrokerAdmin], code: 200, input: [rebuttal_note], output: CreditDispute, side_effects: ["rebuttal_count += 1"] }
  - { method: POST, path: "/credit-disputes/{id}/resolve", description: "Resolve dispute SUSTAIN|REMOVE", roles: [ComplianceAnalyst], code: 200, input: [outcome], output: CreditDispute, side_effects: ["Event -> PUBLISHED or REMOVED; broker recompute; score<40 cascade on REMOVE"] }

  - { method: POST, path: "/authority-verifications", description: "Submit authority + insurance windows for an org", roles: [BrokerAdmin, CarrierAdmin], code: 201, input: ["broker_org_id?", "carrier_org_id?", authority_reference, insurance_windows], output: AuthorityVerification, side_effects: ["insurance_ok/covered_until/coverage_gap_detected computed"] }
  - { method: GET, path: "/authority-verifications/{id}", description: "Get authority verification", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: [], output: AuthorityVerification, side_effects: ["Lazy EXPIRED check"] }
  - { method: GET, path: "/broker-orgs/{id}/authority-verifications", description: "Authority verifications for a broker", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["limit?", "offset?"], output: "AuthorityVerification[]", side_effects: [] }
  - { method: GET, path: "/carrier-orgs/{id}/authority-verifications", description: "Authority verifications for a carrier", roles: [PlatformAdmin, ComplianceAnalyst, DataOps, BrokerAdmin, CarrierAdmin], code: 200, input: ["limit?", "offset?"], output: "AuthorityVerification[]", side_effects: [] }
  - { method: POST, path: "/authority-verifications/{id}/verify", description: "Verify authority (PENDING/EXPIRED -> VERIFIED)", roles: [ComplianceAnalyst], code: 200, input: [], output: AuthorityVerification, side_effects: [] }
  - { method: POST, path: "/authority-verifications/{id}/revoke", description: "Revoke authority (terminal)", roles: [ComplianceAnalyst], code: 200, input: [], output: AuthorityVerification, side_effects: [] }

  - { method: POST, path: "/fraud-alerts", description: "Open a fraud alert against a broker and/or carrier", roles: [ComplianceAnalyst], code: 201, input: [alert_type, "target_broker_org_id?", "target_carrier_org_id?", evidence_note], output: FraudAlert, side_effects: [] }
  - { method: GET, path: "/fraud-alerts", description: "List/filter fraud alerts", roles: [PlatformAdmin, ComplianceAnalyst, DataOps], code: 200, input: ["target_broker_org_id?", "target_carrier_org_id?", "status?", "limit?", "offset?"], output: "FraudAlert[]", side_effects: [] }
  - { method: GET, path: "/fraud-alerts/{id}", description: "Get fraud alert", roles: [PlatformAdmin, ComplianceAnalyst, DataOps], code: 200, input: [], output: FraudAlert, side_effects: [] }
  - { method: POST, path: "/fraud-alerts/{id}/confirm", description: "Confirm alert; full suspension cascade on target orgs", roles: [ComplianceAnalyst], code: 200, input: [], output: FraudAlert, side_effects: ["BrokerOrg/CarrierOrg suspension cascade incl. RateTransaction EXCLUDED"] }
  - { method: POST, path: "/fraud-alerts/{id}/dismiss", description: "Dismiss alert", roles: [ComplianceAnalyst], code: 200, input: [], output: FraudAlert, side_effects: [] }

