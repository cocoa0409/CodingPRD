              as: LoanOfficer
            - call: "POST /lending/borrowers/${b1}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
            - call: "POST /lending/properties"
              payload: { address_line: "18 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-08-20" }
              as: LoanOfficer
              captures: { p1: $.data.id }
            - call: "POST /lending/contractors"
              payload: { business_name: "Vega Roofing", license_number: "LIC-4471", license_expires_on: "2027-12-31", w9_on_file: true, joint_check_required: false }
              as: LoanOfficer
              captures: { c1: $.data.id }
            - call: "POST /lending/contractors"
