# =============================================================================
# 1.9 Scaffold Corner Design - Repertory Cinema Programming & Rights Clearance
# Breadth probe: every testable claim the scaffold's 1.1-1.7 surface declares
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml (1.8) does not already assert.
# Sections and claim_type values are taken from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: venue_creation_returns_envelope_and_every_declared_field
        claim_type: creation
        grounds:
          - entities.Venue
          - endpoints[POST /venues]
          - response_envelope.success
          - roles.ExecutiveDirector
        distinguishing_aspect: |
          Nothing exists yet, so this is the one call that proves the success envelope and the four
          common_fields on a brand-new row. It fails if the envelope is flattened, if version does not start at
          1, or if id carries a type prefix instead of a bare UUID.
        test_recipe:
          setup:
            - "Empty database. No prior call is needed because Venue has no foreign key."
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
          assert:
            - "The response status is 201 and response_type == object."
            - "meta.api_request_id and meta.api_request_timestamp are both present on the envelope."
            - "Venue.${v_id}.id is a bare UUID with no type prefix, and version == 1."
            - "created_at and updated_at are ISO 8601 UTC with exactly three fractional digits."
            - "The echoed fields match the request exactly: seat_capacity == 12, house_hold_seats == 4, trailer_reel_minutes == 12, turnaround_minutes == 25, dcp_ingest_lane_count == 2, max_first_run_share == 0.60, weekly_repertory_target == 3, base_house_nut_weekly_cents == 200000."
            - "supported_formats == ['DCP_2K', 'DCP_4K'] preserves both members and their order."

      - name: title_retrieval_returns_the_stored_row_to_an_anonymous_caller
        claim_type: retrieval
        grounds:
          - entities.Title
          - endpoints[GET /titles/{id}]
          - roles.Anonymous
        distinguishing_aspect: |
          GET /titles/{id} admits Anonymous, so the read path is provable without any role header beyond
          Anonymous. The claim fails if the public catalogue read is gated behind a staff role or if any stored
          field is dropped from the single-row projection.
        test_recipe:
          setup:
            - "One distributor and one title exist. No booking, clearance or showtime is involved."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
          trigger:
            - call: "GET /titles/${t1_id}"
              payload: {}
              as: Anonymous
          assert:
            - "The response status is 200 and response_type == object."
            - "Title.${t1_id}.title_name == 'La Jetee Redux', release_year == 1962, runtime_minutes == 104."
            - "is_first_run == false and native_format == DCP_2K."
            - "rights_holder_distributor_id == ${d_id}."
            - "version == 1 - a pure read never bumps the version."

      - name: titles_listing_pages_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /titles]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three rows and a page size of two force has_more to be true on the first page and false on the
          second, while total_count stays at the unpaged cardinality. It fails if total_count reports the page
          length, or if has_more is computed from the page being full rather than from offset + returned <
          total_count.
        test_recipe:
          setup:
            - "One distributor and exactly three titles exist, created in order: La Jetee Redux, Sans Soleil Again, Nouvelle Vague Now."
            - "No filter is applied, so the unpaged result set is exactly 3 rows."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "Sans Soleil Again", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t2_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "Nouvelle Vague Now", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t3_id: $.data.id }
          trigger:
            - call: "GET /titles"
              payload: { limit: 2, offset: 0 }
              as: Programmer
            - call: "GET /titles"
              payload: { limit: 2, offset: 2 }
              as: Programmer
          assert:
            - "The first call returns 200 with response_type == array, exactly 2 rows, total_count == 3 and has_more == true."
            - "The second call returns exactly 1 row, total_count == 3 and has_more == false."
            - "limit and offset are echoed as 2 / 0 and 2 / 2 respectively."
            - "The union of both pages is exactly {${t1_id}, ${t2_id}, ${t3_id}} with no row repeated across pages."

      - name: showtime_read_with_unknown_id_returns_showtime_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SHOWTIME_NOT_FOUND]
          - endpoints[GET /showtimes/{id}]
          - validations[priority=4]
        distinguishing_aspect: |
          The id is a syntactically valid UUID that no row holds, so the 404 must come from existence
          checking rather than from schema rejection. It fails if a well-formed but unknown id yields 400, or
          if the entity-specific error id is collapsed into a generic not-found code.
        test_recipe:
          setup:
            - "A venue exists so the database is not empty, but no Showtime has ever been created."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /showtimes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Programmer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 404 and $.data.error_id == ERR_SHOWTIME_NOT_FOUND, not ERR_INVALID_REQUEST."
            - "$.data.message is a non-empty string."
            - "response_type == error and the meta block is still present on the failure envelope."

      - name: booking_creation_without_min_run_days_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
          - entities.Booking.min_run_days
          - endpoints[POST /bookings]
        distinguishing_aspect: |
          min_run_days has source input and no default, so omitting it must be a 400 rather than a silent
          zero - and the schema check at priority 3 must fire before the existence checks at priority 4 even
          though every id in the payload is valid. It fails if the field is defaulted or if the request is
          accepted and the min-run machinery later divides by zero.
        test_recipe:
          setup:
            - "A venue, distributor and title all exist, so every foreign key in the payload resolves."
            - "The payload is complete except that min_run_days is absent."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 400 and $.data.error_id == ERR_INVALID_REQUEST."
            - "GET /bookings?venue_id=${v_id} returns 0 rows - nothing was persisted."
            - "No BookingOffer was created either, so the creation side effects did not run partially."

      - name: venue_defaults_applied_when_optional_fields_are_omitted
        claim_type: defaults
        grounds:
          - entities.Venue.house_hold_seats
          - entities.Venue.min_useful_gap_minutes
          - entities.Venue.utc_offset_minutes
          - entities.Venue.max_first_run_share
          - entities.Venue.weekly_repertory_target
          - entities.Venue.base_house_nut_weekly_cents
        distinguishing_aspect: |
          Six Venue fields declare defaults, and every one of them feeds a downstream rule (seat
          conservation, slot scoring, local-time derivation, the ISO-week ceiling, the house-nut cap). Omitting
          all six at once proves each default is materialised on the row rather than substituted ad hoc at
          read time. It fails if any omitted field comes back null.
        test_recipe:
          setup:
            - "Empty database."
            - "Only the fields with no declared default are supplied: name, seat_capacity, trailer_reel_minutes, turnaround_minutes, dcp_ingest_lane_count, open_local_time, last_start_local_time and supported_formats."
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Bare Minimum Cinema", seat_capacity: 60, trailer_reel_minutes: 8, turnaround_minutes: 15, dcp_ingest_lane_count: 1, open_local_time: "13:00", last_start_local_time: "23:00", supported_formats: ["DCP_2K"] }
              as: ExecutiveDirector
              captures: { vd_id: $.data.id }
          assert:
            - "The response status is 201."
            - "Venue.${vd_id}.house_hold_seats == 0."
            - "Venue.${vd_id}.min_useful_gap_minutes == 45."
            - "Venue.${vd_id}.utc_offset_minutes == 0."
            - "Venue.${vd_id}.max_first_run_share == 0.6."
            - "Venue.${vd_id}.weekly_repertory_target == 6."
            - "Venue.${vd_id}.base_house_nut_weekly_cents == 480000."
            - "None of the six fields is null in the creation response."

      - name: showtime_computed_fields_are_derived_from_the_geometry_formula
        claim_type: computed_fields
        grounds:
          - entities.Showtime.end_at
          - entities.Showtime.blocked_until
          - entities.Showtime.slot_score
          - entities.Showtime.seats_available
          - calculations.screen_slot_block
        distinguishing_aspect: |
          Six Showtime fields carry source computed and none of them is in the endpoint's input list, so
          their values can only come from screen_slot_block and showtime_box_office_rollup. slot_score is the
          discriminator: it must be null on a manual create and is set only by auto-schedule, so a
          implementation that scores every showtime fails here.
        test_recipe:
          setup:
            - "Canonical venue (12-minute trailer reel, 25-minute turnaround, seat_capacity 12, house_hold_seats 4) / distributor / 104-minute title / CONFIRMED booking / CLEARED clearance / non-encrypted DCP asset."
            - "No special event is attached, so extra_minutes and surcharge_cents must both be zero."
            - "The showtime is created manually at POST /showtimes, not through auto-schedule."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { sa_id: $.data.id }
          assert:
            - "The response status is 201."
            - "Showtime.${sa_id}.end_at == 2026-08-14T13:56:00.000Z (12 trailer minutes + 104 runtime minutes + 0 extra minutes)."
            - "Showtime.${sa_id}.blocked_until == 2026-08-14T14:21:00.000Z (end_at + 25 turnaround minutes)."
            - "Showtime.${sa_id}.extra_minutes == 0 and surcharge_cents == 0."
            - "Showtime.${sa_id}.slot_score is null because the showtime was created manually."
            - "Showtime.${sa_id}.seats_sold == 0, seats_available == 8, gross_cents == 0 and admissions_count == 0."
            - "Showtime.${sa_id}.status == SCHEDULED, sale_status == DRAFT and playback_status == UNVERIFIED."

      - name: member_system_fields_are_minted_by_the_server
        claim_type: system_fields
        grounds:
          - entities.Member.status
          - entities.Member.donations
          - entities.Member.credit_balance_cents
          - entities.Member.effective_tier
          - endpoints[POST /members]
        distinguishing_aspect: |
          Member is created from three input fields only; status, donations and every standing figure are
          server-minted. The row must land in PENDING with an empty donation log and a zeroed ledger, because
          member_standing has had nothing to consume yet. It fails if a new member is born ACTIVE or if any
          standing field is null rather than its declared default.
        test_recipe:
          setup:
            - "Empty database apart from nothing at all: Member has no foreign key."
            - "Only full_name, email and join_date are supplied."
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m_id: $.data.id }
          assert:
            - "The response status is 201 and Member.${m_id}.id is a bare UUID with version == 1."
            - "Member.${m_id}.status == PENDING - the initial state, not ACTIVE."
            - "Member.${m_id}.donations == [] and expires_at is null."
            - "Member.${m_id}.rolling_donation_cents == 0, fiscal_ytd_donation_cents == 0, rolling_tier == PROSPECT, fiscal_tier == PROSPECT and effective_tier == PROSPECT."
            - "Member.${m_id}.discount_pct == 0.0, advance_access_hours == 0, comp_tickets_granted == 0, comp_tickets_remaining == 0 and credit_balance_cents == 0."

      - name: showtime_strand_rejects_an_undeclared_enum_member
        claim_type: type_constraints
        grounds:
          - entities.Showtime.strand
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: |
          strand is constrained to four members and MIDNIGHT_CULT is none of them, so the schema check at
          priority 3 must reject the request before the clearance, geometry and balance rules ever run. It
          fails if the value is stored verbatim, coerced to a default, or if the request is refused with a
          business error id instead of ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking / CLEARED clearance / DCP asset - every business precondition for a legal showtime is already satisfied."
            - "The clearance version is fresh, so the OCC check would also pass."
            - "The only defect in the payload is the strand value."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "MIDNIGHT_CULT", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 400 and $.data.error_id == ERR_INVALID_REQUEST."
            - "GET /showtimes?venue_id=${v_id} returns 0 rows."
            - "RightsClearance.${c_id}.screenings_used == 0 and screenings_remaining == 6 - the allowance was never touched."
            - "RightsClearance.${c_id}.version is still ${c_v1}, proving the rejection wrote nothing."

      - name: clearance_creation_against_an_unknown_booking_returns_booking_not_found
        claim_type: parent_relationships
        grounds:
          - entities.RightsClearance.booking_id
          - errors[ERR_BOOKING_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          RightsClearance.booking_id is a declared FK, so a syntactically valid but unknown booking id must
          be refused at priority 4 with the BOOKING-specific not-found code, even though the title_id in the
          same payload does resolve. It fails if the FK is stored unchecked or if the error names the wrong
          entity.
        test_recipe:
          setup:
            - "A venue, distributor and title exist. No Booking has ever been created."
            - "The payload's title_id resolves; only booking_id does not."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "00000000-0000-4000-8000-000000000000", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 404 and $.data.error_id == ERR_BOOKING_NOT_FOUND, not ERR_TITLE_NOT_FOUND and not ERR_INVALID_REQUEST."
            - "GET /clearances?title_id=${t1_id} returns 0 rows."

      - name: showtime_referencing_a_dcp_asset_from_another_venue_is_refused
        claim_type: cross_reference_integrity
        grounds:
          - errors[ERR_REFERENCE_MISMATCH]
          - validations[priority=24]
          - entities.DcpAsset.venue_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so integrity cannot be inferred from nesting - every pair of foreign keys
          in one payload must be cross-checked. Both ids exist and both are individually legal; the defect is
          only visible when dcp_asset.venue_id is compared with the posted venue_id. It fails if each FK is
          validated in isolation.
        test_recipe:
          setup:
            - "Two venues exist: the canonical Reel Repertory and a second Annex Screen, both supporting DCP_2K."
            - "Distributor, title, CONFIRMED booking and CLEARED clearance all belong to the first venue."
            - "The DCP asset was ingest-booked against the SECOND venue, so its venue_id differs from the booking's venue_id."
            - "Format, clearance state, allowance, window and screen occupancy are all satisfied, so priority 24 is the first rule with anything to complain about."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /venues"
