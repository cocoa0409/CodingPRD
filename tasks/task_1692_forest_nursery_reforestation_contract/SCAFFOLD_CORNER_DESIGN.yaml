        payload:
          source_zone_id: ${z_src}
          species: DOUGLAS_FIR
          collected_on: '2026-07-15'
          quantity_grams: 500
          germination_pct: 0.85
        as: NurseryManager
        captures:
          lot_id: $.data.id
          lot_v: $.data.version
      trigger:
