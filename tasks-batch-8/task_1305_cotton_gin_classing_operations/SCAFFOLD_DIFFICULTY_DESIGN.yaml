              as: CoopAdmin
              captures: { w1: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-K" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gw}", season: "2026", ticket_number: "T-1", module_tag: "MT-C", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-C1", net_weight_lbs: 400}, {bale_tag: "B-C2", net_weight_lbs: 400} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: WarehouseManager
              captures: { b1: "$.data[0].id", b2: "$.data[1].id" }
          trigger:
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${w1}" }
              as: WarehouseManager
              as_user_id: "wm-1"
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b2}", warehouse_id: "${w1}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { err: $.data.error_id }
            - call: "GET /gin-ops/warehouses/${w1}"
              as: WarehouseManager
          assert:
            - "first receipt at stored_bale_count 0 (== capacity - 1): 201, Warehouse.${w1}.stored_bale_count == 1"
            - "second receipt at stored_bale_count == capacity: error_id == ERR_WAREHOUSE_AT_CAPACITY, http 422"
            - "Bale.${b2}.custody_status stays ON_GIN_FLOOR; GET /gin-ops/warehouse-receipts?bale_id=${b2} returns an empty array"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pledge_gated_by_receipt_state
        grounds:
          - state_machines.WarehouseReceipt.ACTIVE_to_PLEDGED
          - errors[ERR_RECEIPT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair LoanPledge -> WarehouseReceipt: pledge creation is valid
          only while the receipt is ACTIVE or RELEASED; a CANCELLED receipt
          blocks the pledge even though the bale itself is classed and back on
          the gin floor.
        test_recipe:
          setup:
            - "Grade schedule 31-3 covering 2026; grower GD with classed 500-lb bale; receipt R issued then cancelled"
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-800", legal_name: "Gate Farm" }
              as: CoopAdmin
              captures: { gd: $.data.id }
            - call: "POST /gin-ops/warehouses"
              payload: { name: "WH-G", capacity_bales: 5, dock_count: 1 }
              as: CoopAdmin
              captures: { wh: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-L" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gd}", season: "2026", ticket_number: "T-1", module_tag: "MT-G", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-G1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: ClassingClerk
              captures: { b1: "$.data[0].id", b1v: "$.data[0].version" }
            - call: "POST /gin-ops/bales/${b1}/classing-results"
              payload: { grade_code: "31-3", micronaire: 4.0, strength_gpt: 28.0, staple_32nds: 36, classing_office: "USDA-MEMPHIS", result_date: "2026-03-10T00:00:00Z", expected_bale_version: "${b1v}" }
              as: ClassingClerk
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${wh}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r1: $.data.id }
            - call: "POST /gin-ops/warehouse-receipts/${r1}/cancel"
              as: WarehouseManager
          trigger:
            - call: "POST /gin-ops/loan-pledges"
              payload: { warehouse_receipt_id: "${r1}" }
              as: CoopAccountant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECEIPT_NOT_ACTIVE, http 409 (receipt CANCELLED, not in {ACTIVE, RELEASED})"
            - "no LoanPledge rows exist for ${r1}: GET /gin-ops/warehouse-receipts/${r1}/loan-pledges returns []"

      - name: settlement_finalize_gated_by_module_states
        grounds:
          - state_machines.Settlement.DRAFT_to_FINAL
          - errors[ERR_UNGINNED_MODULES_EXIST]
        distinguishing_aspect: |
          Entity pair Settlement -> ModuleReceipt: finalize is valid only when
          every season module of the grower is GINNED or REJECTED; one QUEUED
          module blocks finalization regardless of the settlement's own state.
        test_recipe:
          setup:
            - "Grower GF with module M1 GINNED (bale 500 lbs) and module M2 QUEUED (never ginned) in season 2026; DRAFT settlement S exists"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-801", legal_name: "Pending Farm" }
              as: CoopAdmin
              captures: { gf: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-M" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gf}", season: "2026", ticket_number: "T-1", module_tag: "MT-F1", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gf}", season: "2026", ticket_number: "T-2", module_tag: "MT-F2", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m2: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-F1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "POST /gin-ops/modules/${m2}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "GET /gin-ops/growers/${gf}"
              as: CoopAccountant
              captures: { gfv: $.data.version }
            - call: "POST /gin-ops/growers/${gf}/settlements"
              payload: { season: "2026", expected_grower_version: "${gfv}" }
              as: CoopAccountant
              captures: { st: $.data.id }
          trigger:
            - call: "POST /gin-ops/settlements/${st}/finalize"
              as: CoopAccountant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNGINNED_MODULES_EXIST, http 409 (module ${m2} is QUEUED)"
            - "Settlement.${st}.status stays DRAFT and computation_variant stays PROVISIONAL"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: grade_schedule_halfopen_window_adjacency
        grounds:
          - validations[priority=7]
          - entities.GradeSchedule.fields.effective_from
          - entities.GradeSchedule.fields.effective_to
        distinguishing_aspect: |
          Half-open interval semantics on the GradeSchedule resource (per
          grade_code): [2026-01-01, 2026-07-01) and [2026-07-01, 2027-01-01)
          touch without conflict, while [2026-06-30, 2026-12-01) overlaps and
          is rejected — pure adjacency is allowed, any interior intersection is not.
        test_recipe:
          setup: ["empty catalog"]
          setup_api_calls:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "41-4", premium_discount_points: -110, loan_rate_points: 5200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: CoopAdmin
              captures: { gs1: $.data.id }
          trigger:
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "41-4", premium_discount_points: -100, loan_rate_points: 5225, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: CoopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "41-4", premium_discount_points: -95, loan_rate_points: 5250, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CoopAdmin
              captures: { gs2: $.data.id }
            - call: "POST /gin-ops/grade-schedules"
              payload: { grade_code: "31-3", premium_discount_points: 265, loan_rate_points: 5450, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
              captures: { gs3: $.data.id }
          assert:
            - "overlap attempt: error_id == ERR_GRADE_WINDOW_OVERLAP, http 409"
            - "adjacent window (start == prior end): 201 created (${gs2}) — half-open boundary permits touching"
            - "same dates on a different grade_code: 201 created (${gs3}) — the overlap resource is (grade_code, window)"

      - name: dock_window_turnaround_buffer_conflict
        grounds:
          - validations[priority=7]
          - entities.ShippingOrder.fields.load_start
          - entities.ShippingOrder.fields.load_end
          - entities.Warehouse.fields.dock_count
        distinguishing_aspect: |
          Buffered-gap interval semantics on the Warehouse dock resource: two
          non-cancelled orders on the same dock must keep a >= 30 minute gap, so
          12:20 start conflicts with a 10:00-12:00 window but 12:30 start is
          legal — unlike the grade schedule's pure half-open adjacency, touching
          is NOT enough here; the buffer must clear.
        test_recipe:
          setup:
            - "Warehouse WD with dock_count 2; grower GO with two receipted 500-lb bales at WD (order O1 dock 1 2026-08-10T10:00-12:00Z already DRAFT)"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-900", legal_name: "Dock Farm" }
              as: CoopAdmin
              captures: { go: $.data.id }
            - call: "POST /gin-ops/warehouses"
              payload: { name: "WH-D", capacity_bales: 10, dock_count: 2 }
              as: CoopAdmin
              captures: { wd: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-N" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${go}", season: "2026", ticket_number: "T-1", module_tag: "MT-D", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-D1", net_weight_lbs: 500}, {bale_tag: "B-D2", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: WarehouseManager
              captures: { b1: "$.data[0].id", b2: "$.data[1].id" }
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${wd}" }
              as: WarehouseManager
              as_user_id: "wm-1"
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b2}", warehouse_id: "${wd}" }
              as: WarehouseManager
              as_user_id: "wm-1"
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${wd}", grower_id: "${go}", bale_ids: ["${b1}"], dock_number: 1, load_start: "2026-08-10T10:00:00Z", load_end: "2026-08-10T12:00:00Z" }
              as: WarehouseManager
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${wd}", grower_id: "${go}", bale_ids: ["${b2}"], dock_number: 1, load_start: "2026-08-10T12:20:00Z", load_end: "2026-08-10T13:00:00Z" }
              as: WarehouseManager
              captures: { err: $.data.error_id }
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${wd}", grower_id: "${go}", bale_ids: ["${b2}"], dock_number: 1, load_start: "2026-08-10T12:30:00Z", load_end: "2026-08-10T13:00:00Z" }
              as: WarehouseManager
              captures: { o2: $.data.id }
            - call: "POST /gin-ops/shipping-orders"
              payload: { warehouse_id: "${wd}", grower_id: "${go}", bale_ids: ["${b2}"], dock_number: 2, load_start: "2026-08-10T10:30:00Z", load_end: "2026-08-10T11:30:00Z" }
              as: WarehouseManager
              captures: { o3: $.data.id }
          assert:
            - "12:20 start (gap 20 min < 30): error_id == ERR_DOCK_WINDOW_CONFLICT, http 409"
            - "12:30 start (gap exactly 30 min): 201 created (${o2}) — the buffer is inclusive at exactly 30"
            - "10:30-11:30 on dock 2 (full overlap with O1): 201 created (${o3}) — the conflict resource is (warehouse, dock)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: receipt_issue_cancel_conserve_stored_count
        grounds:
          - state_machines.WarehouseReceipt.ACTIVE_to_CANCELLED
          - state_machines.Bale."custody WAREHOUSED_to_ON_GIN_FLOOR"
          - entities.Warehouse.fields.stored_bale_count
        distinguishing_aspect: |
          Conserved quantity = bale count: Warehouse.stored_bale_count ==
          COUNT(receipts with status IN {ACTIVE, PLEDGED, RELEASED}) — issue
          (+1) paired with cancel (-1) leaves the warehouse count and the bale's
          custody exactly as before the pair.
        test_recipe:
          setup:
            - "Warehouse WI (capacity 10, stored 0); grower GI with one 500-lb bale on the gin floor"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-910", legal_name: "Conserve Farm" }
              as: CoopAdmin
              captures: { gi: $.data.id }
            - call: "POST /gin-ops/warehouses"
              payload: { name: "WH-I", capacity_bales: 10, dock_count: 1 }
              as: CoopAdmin
              captures: { wi: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-O" }
              as: GinOperator
              captures: { s1: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${gi}", season: "2026", ticket_number: "T-1", module_tag: "MT-I", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m1: $.data.id }
            - call: "POST /gin-ops/modules/${m1}/queue"
              payload: { gin_shift_id: "${s1}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/start-ginning"
              as: GinOperator
            - call: "POST /gin-ops/modules/${m1}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-I1", net_weight_lbs: 500} ] }
              as: GinOperator
              as_user_id: "gin-op-1"
            - call: "GET /gin-ops/modules/${m1}/bales"
              as: WarehouseManager
              captures: { b1: "$.data[0].id" }
          trigger:
            - call: "POST /gin-ops/warehouse-receipts"
              payload: { bale_id: "${b1}", warehouse_id: "${wi}" }
              as: WarehouseManager
              as_user_id: "wm-1"
              captures: { r1: $.data.id }
            - call: "GET /gin-ops/warehouses/${wi}"
              as: WarehouseManager
            - call: "POST /gin-ops/warehouse-receipts/${r1}/cancel"
              as: WarehouseManager
            - call: "GET /gin-ops/warehouses/${wi}"
              as: WarehouseManager
            - call: "GET /gin-ops/bales/${b1}"
              as: WarehouseManager
          assert:
            - "after issue: Warehouse.${wi}.stored_bale_count == 1 and Bale custody == WAREHOUSED"
            - "after cancel (compensating action): stored_bale_count == 0 — identical to the pre-issue value, and == COUNT(non-terminal receipts) == 0"
            - "Bale.${b1}.custody_status == ON_GIN_FLOOR (restored); WarehouseReceipt.${r1}.status == CANCELLED"

      - name: ledger_adjustment_reversal_conserves_grower_balance
        grounds:
          - entities.Grower.fields.credit_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = cents: Grower.credit_balance_cents ==
          SUM(LedgerEntry.amount_cents) for that grower — a +1000 ADJUSTMENT
          paired with its -1000 reversal leaves the balance provably unchanged
          (0), and the invariant holds at every intermediate step.
        test_recipe:
          setup:
            - "Grower GA freshly created (credit_balance_cents 0)"
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-911", legal_name: "Adjust Farm" }
              as: CoopAdmin
              captures: { ga: $.data.id }
          trigger:
            - call: "POST /gin-ops/growers/${ga}/ledger-adjustments"
              payload: { season: "2026", amount_cents: 1000, memo: "correct ticket weight" }
              as: CoopAccountant
              captures: { e1: $.data.id }
            - call: "GET /gin-ops/growers/${ga}"
              as: CoopAccountant
            - call: "POST /gin-ops/growers/${ga}/ledger-adjustments"
              payload: { season: "2026", amount_cents: -1000, memo: "reverse ticket weight correction" }
              as: CoopAccountant
              captures: { e2: $.data.id }
            - call: "GET /gin-ops/growers/${ga}"
              as: CoopAccountant
            - call: "GET /gin-ops/ledger-entries"
              payload: { grower_id: "${ga}" }
              as: CoopAccountant
          assert:
            - "after +1000: Grower.${ga}.credit_balance_cents == 1000 == SUM(entries)"
            - "after the -1000 reversal: credit_balance_cents == 0 — exactly the pre-pair value (no drift)"
            - "both entries persist (append-only): LedgerEntry.${e1}.amount_cents == 1000 and LedgerEntry.${e2}.amount_cents == -1000, entry_type ADJUSTMENT"
