          - validations[priority:46]
          - calculations.pt_event_outcome
        distinguishing_aspect: |
          The first FAIL leaves the enrollment ENROLLED (only the event opens an
          investigation), so a second shipment can still be registered; it is the
          SECOND fail within the three-event window that flips the enrollment to
          UNSUCCESSFUL_PARTICIPATION and closes the endpoint.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One site enrolled for GLUCOSE / 2026 with two PENDING shipments S-01 and S-02 registered up front."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
