              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/hearings"
              payload: { representative_id: "${an2_id}", docket_room: "R1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { h_id: $.data.id }
            - call: "POST /api/hearings/${h_id}/hold"
              payload: {}
              as: Analyst
              as_user_id: "${an2_id}"
          trigger:
            - call: "POST /api/appeals/${ap_id}/record-decision"
              payload: { decision_value_cents: 27000000 }
              as: Analyst
              as_user_id: "${an_id}"
          assert:
            - "Appeal.${ap_id}.realized_savings_cents == 75000"
            - "Invoice(appeal_id=${ap_id}).fee_amount_cents == 28250"

      - name: ci_valuation_percomp_round_before_median
        grounds:
          - calculations.opinion_of_value
          - calculations.comp_adjusted_sale_value
          - entities.Evidence.fields.adjusted_sale_value_cents
          - entities.Appeal.fields.requested_value_cents
        distinguishing_aspect: |
          MODE (b) nested-rounding order: two comps adjust to 101 and 102 cents (each rounded
          per-comp BEFORE aggregation); the even-count median = round_half_up((101+102)/2) = 102.
          Rounding the raw values first (100.5, 101.5) then taking the median would give 101 — the
          scaffold pins per-comp-round-then-median, so requested_value_cents == 102.
        test_recipe:
          setup:
            - "Appeal SALES_COMPARISON with exactly 2 included comps whose per-comp rounding creates a half-cent median split."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "a4@f.test", license_number: "L6" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
