# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7)
# Walks the claim-extraction-guide taxonomy against this scaffold. §1.8 depth
# instances are cited as excluded_because stubs. All chains use only §1.5.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_local_area_initializes_budget_ledger
        claim_type: Creation
        grounds:
          - entities.LocalArea.fields.ita_budget_available_cents
          - entities.LocalArea.fields.ita_budget_total_cents
        distinguishing_aspect: "POST /wioa/local-areas returns 201 with ita_budget_available_cents == ita_budget_total_cents (5,000,000) and obligated/expended == 0; version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
          assert:
            - "LocalArea.${la_id}.ita_budget_available_cents == 5000000"
            - "LocalArea.${la_id}.ita_budget_obligated_cents == 0"
            - "LocalArea.${la_id}.version == 1"

      - name: intake_computes_priority_of_service_veteran
        claim_type: Computed Fields
        grounds:
          - calculations.priority_of_service
          - entities.Participant.fields.priority_of_service
        distinguishing_aspect: "An ADULT participant with veteran=true is computed priority_of_service == PRIORITY; the input value cannot be supplied by the client."
        test_recipe:
          setup: ["A LocalArea exists."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "Vet P", funding_stream: "ADULT", veteran: true }
              as: CaseManager
              captures: { p_id: $.data.id, pos: $.data.priority_of_service }
          assert:
            - "response.data.priority_of_service == \"PRIORITY\""
            - "Participant.${p_id}.supportive_available_cents == 200000"

      - name: participant_supportive_ledger_seeded_from_area_cap
        claim_type: System Fields
        grounds:
          - entities.Participant.fields.supportive_available_cents
          - entities.LocalArea.fields.supportive_annual_cap_cents
        distinguishing_aspect: "On intake supportive_available_cents is seeded to the LocalArea.supportive_annual_cap_cents (200000) with obligated/expended == 0."
        test_recipe:
          setup: ["A LocalArea exists."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
          assert:
            - "Participant.${p_id}.supportive_available_cents == 200000"
            - "Participant.${p_id}.supportive_obligated_cents == 0"
            - "Participant.${p_id}.supportive_expended_cents == 0"

      - name: participant_intake_missing_funding_stream_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST intake without funding_stream is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A LocalArea exists."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_INVALID_REQUEST\""

      - name: get_participant_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET a non-existent participant id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /wioa/participants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_NOT_FOUND\""

      - name: create_voucher_nonexistent_program_returns_not_found
        claim_type: Parent Relationships
        grounds: ["entities.ITAVoucher.fields.program_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a voucher whose program_id does not exist returns ERR_NOT_FOUND (404) — FK existence enforced."
        test_recipe:
          setup: ["Participant with an ACTIVE plan exists."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "00000000-0000-0000-0000-000000000000", career_plan_id: "${cp_id}", authorized_cost_cents: 100000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_NOT_FOUND\""

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_completed_voucher_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ITAVoucher.OBLIGATED_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) voucher returns ERR_INVALID_STATE; no fund movement."
        test_recipe:
          setup: ["A voucher OBLIGATED (authorized 100000) then COMPLETED."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp_id}", authorized_cost_cents: 100000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v_id: $.data.id }
            - call: "POST /wioa/ita-vouchers/${v_id}/obligate"
              payload: { expected_local_area_version: "${la_v}" }
              as: CaseManager
            - call: "POST /wioa/ita-vouchers/${v_id}/complete"
              payload: { credential_earned: false }
              as: CaseManager
          trigger:
            - call: "POST /wioa/ita-vouchers/${v_id}/cancel"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: approve_revision_on_active_plan_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.CareerPlan.UNDER_REVISION_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve-revision on an ACTIVE (not UNDER_REVISION) plan returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE career plan (never sent to revision)."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /wioa/career-plans/${cp_id}/approve-revision"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: reject_placed_referral_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.JobReferral.REFERRED_to_PLACED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rejecting a PLACED (terminal) referral returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PLACED job referral for an enrolled participant."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/employers"
              payload: { name: "Acme", size: "SMALL", max_concurrent_ojt_slots: 5 }
              as: BusinessServicesRep
              captures: { emp_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/job-referrals"
              payload: { employer_id: "${emp_id}", job_title: "Welder I" }
              as: BusinessServicesRep
              captures: { jr_id: $.data.id }
            - call: "POST /wioa/job-referrals/${jr_id}/place"
              payload: { placement_wage_cents_per_hour: 2500 }
              as: BusinessServicesRep
          trigger:
            - call: "POST /wioa/job-referrals/${jr_id}/reject"
              payload: {}
              as: BusinessServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: enroll_before_eligible_returns_not_eligible
        claim_type: guarded_transition
        grounds: ["state_machines.Participant.NOT_ENROLLED_to_ENROLLED", "errors[ERR_PARTICIPANT_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Enrolling a PENDING participant (eligibility not yet ELIGIBLE) returns ERR_PARTICIPANT_NOT_ELIGIBLE — the cross-dimension guard."
        test_recipe:
          setup: ["A freshly intaken PENDING participant."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_PARTICIPANT_NOT_ELIGIBLE\""

      - name: place_not_enrolled_participant_returns_not_enrolled
        claim_type: guarded_transition
        grounds: ["state_machines.JobReferral.REFERRED_to_PLACED", "errors[ERR_PARTICIPANT_NOT_ENROLLED]"]
        distinguishing_aspect: "Placing a referral whose participant is NOT_ENROLLED returns ERR_PARTICIPANT_NOT_ENROLLED (place requires enrollment IN {ENROLLED, EXITED})."
        test_recipe:
          setup: ["A REFERRED referral for a NOT_ENROLLED participant."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/employers"
              payload: { name: "Acme", size: "SMALL", max_concurrent_ojt_slots: 5 }
              as: BusinessServicesRep
              captures: { emp_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/job-referrals"
              payload: { employer_id: "${emp_id}", job_title: "Welder I" }
              as: CaseManager
              captures: { jr_id: $.data.id }
          trigger:
            - call: "POST /wioa/job-referrals/${jr_id}/place"
              payload: {}
              as: BusinessServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_PARTICIPANT_NOT_ENROLLED\""

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: priority_of_service_plain_adult_non_priority
        claim_type: Correct Result
        grounds: [calculations.priority_of_service, entities.Participant.fields.priority_of_service]
        distinguishing_aspect: "An ADULT participant with no veteran/low_income/basic_skills flags is computed priority_of_service == NON_PRIORITY."
        test_recipe:
          setup: ["A LocalArea exists."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "Plain P", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id, pos: $.data.priority_of_service }
          assert:
            - "response.data.priority_of_service == \"NON_PRIORITY\""

      - name: supportive_amount_non_mileage_equals_amount_cents
        claim_type: Correct Result
        grounds: [calculations.supportive_amount, entities.SupportiveServicePayment.fields.computed_amount_cents]
        distinguishing_aspect: "A CHILDCARE request with amount_cents 50000 yields computed_amount_cents == 50000 (no mileage rounding)."
        test_recipe:
          setup: ["A participant exists."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /wioa/participants/${p_id}/supportive-services"
              payload: { service_type: "CHILDCARE", amount_cents: 50000 }
              as: CaseManager
              captures: { ss_id: $.data.id, amt: $.data.computed_amount_cents }
          assert:
            - "response.data.computed_amount_cents == 50000"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: obligate_over_budget_returns_budget_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ITA_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "authorized_cost 200000 <= individual cap 800000 but > ita_budget_available 100000 obligates to ERR_ITA_BUDGET_EXCEEDED (budget check distinct from cap check)."
        test_recipe:
          setup: ["LocalArea with total budget 100000 (cap 800000); participant ELIGIBLE+ENROLLED, ACTIVE plan, ETPL program (cost 1,000,000); DRAFT voucher authorized 200000."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 100000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
              payload: { program_id: "${prog_id}", career_plan_id: "${cp_id}", authorized_cost_cents: 200000, planned_start_date: "2026-06-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: CaseManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /wioa/ita-vouchers/${v_id}/obligate"
              payload: { expected_local_area_version: "${la_v}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == \"ERR_ITA_BUDGET_EXCEEDED\""

      - name: disburse_over_obligation_returns_exceeds_obligation
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DISBURSEMENT_EXCEEDS_OBLIGATION]"]
        distinguishing_aspect: "Disbursing 150000 against a voucher whose unexpended obligation is 100000 returns ERR_DISBURSEMENT_EXCEEDS_OBLIGATION."
        test_recipe:
          setup: ["A voucher OBLIGATED at authorized 100000, nothing disbursed."]
          setup_api_calls:
            - call: "POST /wioa/local-areas"
              payload: { name: "Area A", program_year: 2026, ita_budget_total_cents: 5000000, ita_individual_cap_cents: 800000, supportive_annual_cap_cents: 200000 }
              as: StateAdmin
              captures: { la_id: $.data.id, la_v: $.data.version }
            - call: "POST /wioa/local-areas/${la_id}/participants"
              payload: { full_name: "P One", funding_stream: "ADULT" }
              as: CaseManager
              captures: { p_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/determine-eligibility"
              payload: { decision: "ELIGIBLE" }
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/enroll"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/participants/${p_id}/career-plans"
              payload: { goal_occupation: "Welder", service_track: "TRAINING" }
              as: CaseManager
              captures: { cp_id: $.data.id }
            - call: "POST /wioa/career-plans/${cp_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /wioa/local-areas/${la_id}/training-providers"
              payload: { name: "Prov A" }
              as: StateAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /wioa/training-providers/${prov_id}/approve"
              payload: {}
              as: StateAdmin
            - call: "POST /wioa/training-providers/${prov_id}/programs"
              payload: { name: "Weld 101", cip_code: "48.0508", total_cost_cents: 1000000, credential_type: "CERTIFICATE" }
              as: StateAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wioa/participants/${p_id}/ita-vouchers"
