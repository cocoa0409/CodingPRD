              captures: { err: $.data.error_id }
          assert:
            - "Schedule rejected with error_id ERR_CROSS_REFERENCE_MISMATCH (http 409), NOT ERR_PERMIT_WINDOW_MISMATCH, though the permit window also fails to cover 2026-09-01"
            - "RestorationJob.${rjA}.restoration_status remains PENDING"

  - rule_id: boundary_precision_check
    instances:
      - name: advisory_threshold_499_vs_500
        grounds:
