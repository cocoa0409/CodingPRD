  - rule_id: non_linear_state_machine
    instances:
      - name: conditional_prequalification_reenters_under_review_and_regrades_approved_after_variance
        grounds:
          - state_machines.Prequalification.UNDER_REVIEW_to_CONDITIONAL
          - state_machines.Prequalification.CONDITIONAL_to_UNDER_REVIEW
          - state_machines.ImprovementPlan.SUBMITTED_to_ACCEPTED
          - state_machines.Variance.REQUESTED_to_APPROVED
          - calculations.effective_client_threshold_resolution
          - calculations.grading_decision
        distinguishing_aspect: |
          The Prequalification lifecycle is genuinely cyclic, not a linear ladder: UNDER_REVIEW ->
          CONDITIONAL -> UNDER_REVIEW -> APPROVED is traversed with the SAME governing statistic,
          and the second pass through the identical grading endpoint yields a different outcome
          (77.89 / CONDITIONAL / [EMR] then 78.49 / APPROVED / []) because an APPROVED variance now
          raises the EMR threshold from 1.0000 to 1.0500 at step 4 of threshold resolution.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Client Northwind on defaults (BALANCED, conditional_band_pct 20)."
            - "Contractor Acme hazard_profile [GENERAL], GL 1000000/2000000 and WC 500000/1000000 VERIFIED."
            - "One VERIFIED 2025 statistic: hours 500000, recordable 2, DART 1, EMR 1.01, citation_points 1 - EMR is a soft breach (1.01 > 1.0000 but <= the 1.2000 conditional ceiling)."
            - "First grading produced CONDITIONAL at 77.89 with deficiency_codes [EMR], conditional_expires_at 2026-10-30T00:00:00Z and Contractor.open_deficiency_count 1."
            - "An EMR variance for 1.05 was then APPROVED with expires_at 2027-01-01T00:00:00Z, and an improvement plan was created, submitted and ACCEPTED, returning the row to UNDER_REVIEW with all grade fields cleared."
