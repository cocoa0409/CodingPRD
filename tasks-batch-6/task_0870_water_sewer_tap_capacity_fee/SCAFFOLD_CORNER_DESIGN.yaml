            - "data.error_id == ERR_STALE_VERSION"

      - name: latecomer_occ_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[latecomer-assess-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one latecomer assessment bumps the project version, a second create still carrying the pre-assessment expected_main_extension_project_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACCEPTED project (version captured at accept); one benefiting app assessed, a second benefiting app to assess with the stale version."]
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-OL", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
