scenario: "669. Snowmobile / Powersport Rental & Guided Tour: unit/sled inventory & class, reservation & route/tour booking, waiver & training/age, gear (helmet/suit) & deposit, guide-to-rider ratio, weather/trail-condition closure, damage/fuel & late, season/membership"
domain_name: "snowmobile-powersport-rental-tour"
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"          # finite sleds + guides competed for across overlapping tour windows
  secondary_archetype: "Temporal windowing"        # reservation intervals on units; trail-condition closure windows
  complexity_layers:
    - "Optimistic concurrency"                      # OCC on TourDeparture.version for join-departure races
    - "Cascading side effects"                      # trail closure -> departure cancel -> reservation cancel -> unit/gear release + deposit refund
    - "Dual-variant calculation"                    # estimated quote at booking vs final settlement at return
    - "Rate / threshold triggers"                   # guide-to-rider ratio breakpoints; late-return per-period fee

  entity_topology: flat
  # Peer resource entities (Trail, Unit, GearItem, Member, TourDeparture, Reservation, Guide, Settlement, ClosureEvent)
  # linked by foreign keys; URLs are flat collections (/trails, /units, /tour-departures, /reservations, ...),
  # not nested ownership paths.

  state_machine_shape: parallel
  # Reservation carries two independent dimensions: reservation_status (lifecycle) x settlement_status
  # (return/billing); Trail and TourDeparture add branching-with-revert and compound shapes.

  relationship_patterns:
    - one_to_many        # TourDeparture has many Reservations; Trail has many TourDepartures; Member has many Reservations
    - many_to_many       # Reservation <-> GearItem via assignment; TourDeparture <-> Guide via assignment
    - cross_aggregate    # Reservation depends on Member (waiver/age/training) and on Unit (class match) and on TourDeparture (trail state)

  role_model: peer_roles
  # Member owns own Reservations; Guide leads departures; DispatchOperator manages inventory/closures/settlements;
  # plus opaque PlatformAdmin for configuration & test-driving endpoints.

  consistency_model: immediate
  # All cascades resolve atomically within the triggering request.

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Rider's legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique among members."
        constraints: "unique (case-insensitive)"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD). Used to derive age at a departure's start instant."
      - name: membership_tier
        type: enum
        source: input
        description: "Pricing/benefit tier."
        default: "NONE"
        constraints: "one of {NONE, SEASON, PREMIER}"
      - name: membership_expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; when SEASON/PREMIER benefits lapse. Null for NONE."
        default: null
      - name: waiver_status
        type: enum
        source: computed
        description: "Liability-waiver state, advanced by the waiver state machine."
        default: "UNSIGNED"
        constraints: "one of {UNSIGNED, SIGNED, EXPIRED}"
      - name: waiver_signed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC stamp when the current waiver was signed; null when UNSIGNED/EXPIRED."
        default: null
      - name: training_level
        type: enum
        source: computed
        description: "Highest certified competency, advanced by the training state machine. Gates MOUNTAIN-class units."
        default: "NONE"
        constraints: "one of {NONE, BASIC, ADVANCED}"
      - name: deposit_hold_cents
        type: integer
        source: computed
        description: "Sum of active security-deposit holds across this member's reservations in HELD state. Recomputed on hold/release."
        default: 0
      - name: lifetime_damage_strikes
        type: integer
        source: computed
        description: "Count of settlements for this member with damage_assessed_cents > 0. Drives premier-deposit waiver eligibility."
        default: 0

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Guide's name."
      - name: max_class
        type: enum
        source: input
        description: "Highest unit class this guide is certified to lead."
        constraints: "one of {TRAIL, UTILITY, MOUNTAIN}; ordering TRAIL < UTILITY < MOUNTAIN"
      - name: status
        type: enum
        source: computed
        description: "Availability state advanced by the guide state machine."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, OFF_DUTY}"

  - name: Trail
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trail/route name."
      - name: required_class
        type: enum
        source: input
        description: "Minimum unit class permitted on this trail."
        constraints: "one of {TRAIL, UTILITY, MOUNTAIN}; ordering TRAIL < UTILITY < MOUNTAIN"
      - name: max_riders
        type: integer
        source: input
        description: "Maximum total riders allowed on any single departure of this trail."
        constraints: ">= 1"
      - name: condition
        type: enum
        source: computed
        description: "Operating posture advanced by the trail state machine; CLOSED gates departure lock/depart (not scheduling) and cascades cancellation when entered."
        default: "OPEN"
        constraints: "one of {OPEN, CAUTION, CLOSED}"

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: vin_tag
        type: string
        source: input
        description: "Asset tag / VIN; unique among units."
        constraints: "unique"
      - name: unit_class
        type: enum
        source: input
        description: "Capability class of this sled."
        constraints: "one of {TRAIL, UTILITY, MOUNTAIN}; ordering TRAIL < UTILITY < MOUNTAIN"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Base rental rate per departure-day for this unit."
        constraints: ">= 0"
      - name: deposit_cents
        type: integer
        source: input
        description: "Security-deposit amount held while this unit is on an active reservation."
        constraints: ">= 0"
      - name: tank_capacity_liters
        type: number
        source: input
        description: "Fuel-tank capacity; used to convert a fuel-level shortfall to liters for the fuel charge."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Inventory lifecycle advanced by the unit state machine."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, RESERVED, OUT, MAINTENANCE}"

  - name: GearItem
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: "Gear category."
        constraints: "one of {HELMET, SUIT}"
      - name: size_code
        type: string
        source: input
        description: "Size label (e.g., S/M/L/XL)."
      - name: replacement_cost_cents
        type: integer
        source: input
        description: "Charged on settlement when this gear item is flagged unreturned/damaged."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Gear lifecycle advanced by the gear state machine."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, ASSIGNED, OUT, RETIRED}"

  - name: TourDeparture
    parent: null
    common_fields: true
    fields:
      - name: trail_id
        type: string
        source: input
        description: "FK -> Trail.id; the route this departure runs."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC departure start instant (also the booking cutoff anchor)."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled return instant; starts_at < ends_at."
      - name: required_guide_class
        type: enum
        source: input
        description: "Minimum guide max_class required to lead this departure."
        constraints: "one of {TRAIL, UTILITY, MOUNTAIN}"
      - name: capacity_riders
        type: integer
        source: input
        description: "Rider cap for this departure; effective cap = min(capacity_riders, Trail.max_riders)."
        constraints: ">= 1"
      - name: rider_count
        type: integer
        source: computed
        description: "Count of this departure's Reservations in {CONFIRMED, CHECKED_OUT, RETURNED}. Incremented on confirm, decremented on cancel/no-show."
        default: 0
      - name: guide_count
        type: integer
        source: computed
        description: "Count of Guides assigned to this departure. Drives the guide-to-rider ratio gate."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Departure lifecycle advanced by the departure state machine."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, LOCKED, DEPARTED, COMPLETED, CANCELLED}"

  - name: GuideAssignment
    parent: null
    common_fields: false
    fields:
      - name: tour_departure_id
        type: string
        source: input
        description: "FK -> TourDeparture.id; the departure this guide is assigned to."
      - name: guide_id
        type: string
        source: input
        description: "FK -> Guide.id; the assigned guide."
      - name: active
        type: boolean
        source: computed
        description: "True while the assignment counts toward guide_count; set false when unassigned or departure cancelled."
        default: true

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the rider holding this reservation."
      - name: tour_departure_id
        type: string
        source: input
        description: "FK -> TourDeparture.id; the departure booked."
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the sled allocated to this rider for the departure window."
      - name: helmet_gear_id
        type: string
        source: input
        description: "FK -> GearItem.id; assigned HELMET (kind must be HELMET)."
        default: null
      - name: suit_gear_id
        type: string
        source: input
        description: "FK -> GearItem.id; assigned SUIT (kind must be SUIT)."
        default: null
      - name: reservation_status
        type: enum
        source: computed
        description: "Lifecycle dimension advanced by the reservation lifecycle machine (independent of settlement_status)."
        default: "PENDING"
        constraints: "one of {PENDING, CONFIRMED, CHECKED_OUT, RETURNED, CANCELLED, NO_SHOW}"
      - name: settlement_status
        type: enum
        source: computed
        description: "Billing dimension advanced by the settlement machine, independent of reservation_status."
        default: "NONE"
        constraints: "one of {NONE, HELD, SETTLED, REFUNDED}"
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "Provisional charge quoted at confirmation (rental + tour, membership discount, est. fuel). See calc estimate_reservation_quote."
        default: 0
      - name: deposit_hold_cents
        type: integer
        source: computed
        description: "Security deposit placed on confirmation; equals Unit.deposit_cents unless waived by premier benefit. Released/forfeited at settlement."
        default: 0
      - name: checked_out_at
        type: datetime
        source: system
        description: "ISO 8601 UTC stamp when the rider checked out (CONFIRMED -> CHECKED_OUT)."
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: "ISO 8601 UTC stamp when the unit was returned; compared with TourDeparture.ends_at to derive late periods."
        default: null
      - name: fuel_return_fraction
        type: number
        source: input
        description: "Fuel level at return as a fraction in [0,1] (1.0 = full); supplied to the return endpoint."
        default: null
        constraints: "0 <= fuel_return_fraction <= 1"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation being settled (one settlement per reservation)."
        constraints: "unique"
      - name: rental_charge_cents
        type: integer
        source: computed
        description: "Final rental+tour line carried over from estimated_total_cents at return."
        default: 0
      - name: fuel_charge_cents
        type: integer
        source: computed
        description: "Final fuel shortfall charge. See calc final_settlement."
        default: 0
      - name: late_charge_cents
        type: integer
        source: computed
        description: "Late-return fee from grace + per-period rule. See calc late_fee."
        default: 0
      - name: damage_assessed_cents
        type: integer
        source: input
        description: "Damage charge entered by the operator at settlement (0 if none)."
        default: 0
        constraints: ">= 0"
      - name: gear_loss_cents
        type: integer
        source: computed
        description: "Sum of replacement_cost_cents for gear items flagged unreturned at settlement."
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: "Portion of the held deposit consumed by charges (capped at the hold). See calc final_settlement."
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Deposit returned to member = deposit_hold - deposit_applied. See calc final_settlement."
        default: 0
      - name: net_charge_cents
        type: integer
        source: computed
        description: "Amount charged beyond the deposit = max(0, total_charges - deposit_hold). See calc final_settlement."
        default: 0

  - name: ClosureEvent
    parent: null
    common_fields: false
    fields:
      - name: trail_id
        type: string
        source: input
        description: "FK -> Trail.id; the trail this closure acted on."
      - name: new_condition
        type: enum
        source: input
        description: "Condition the trail was moved to by this event."
        constraints: "one of {OPEN, CAUTION, CLOSED}"
      - name: reason
        type: string
        source: input
        description: "Free-text weather/trail-condition reason."
      - name: cancelled_departure_count
        type: integer
        source: computed
        description: "Number of SCHEDULED/LOCKED departures cancelled by this closure (0 unless new_condition == CLOSED)."
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- Member.waiver_status (branching with revert: SIGNED can expire back to a re-signable state) ----
  - entity: Member
    dimension: waiver_status
    initial_state: UNSIGNED
    terminal_states: []
    transitions:
      - from: UNSIGNED
        to: SIGNED
        trigger: "POST /members/{id}/sign-waiver"
        actor: Member
        preconditions:
          - "Member age at the signing instant (clock now) >= 18 OR a guardian_ack=true field is supplied"
        side_effects:
          - "set waiver_signed_at = clock now"
        note: "Age derived from date_of_birth vs the logical clock."
      - from: EXPIRED
        to: SIGNED
        trigger: "POST /members/{id}/sign-waiver"
        actor: Member
        preconditions:
          - "Member age at signing instant >= 18 OR guardian_ack=true"
        side_effects:
          - "set waiver_signed_at = clock now"
      - from: SIGNED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system re-evaluation) or POST /members/{id}/expire-waiver"
        actor: system
        preconditions:
          - "clock now > waiver_signed_at + WAIVER_VALIDITY_DAYS"
        side_effects:
          - "clear waiver_signed_at"
        note: "Waiver validity window pinned by calc constant; re-evaluated on demand via the expire endpoint."

  # ---- Member.training_level (linear: NONE -> BASIC -> ADVANCED) ----
  - entity: Member
    dimension: training_level
    initial_state: NONE
    terminal_states: [ADVANCED]
    transitions:
      - from: NONE
        to: BASIC
        trigger: "POST /members/{id}/complete-training"
        actor: DispatchOperator
        preconditions:
          - "request level == BASIC"
          - "Member.waiver_status == SIGNED"
        side_effects: []
      - from: BASIC
        to: ADVANCED
        trigger: "POST /members/{id}/complete-training"
        actor: DispatchOperator
        preconditions:
          - "request level == ADVANCED"
        side_effects: []
        note: "ADVANCED is prerequisite to riding a MOUNTAIN-class unit."

  # ---- Trail.condition (branching with revert + cascade on CLOSED) ----
  - entity: Trail
    dimension: condition
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CAUTION
        trigger: "POST /trails/{id}/closure (new_condition=CAUTION)"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "create ClosureEvent(new_condition=CAUTION, cancelled_departure_count=0)"
      - from: CAUTION
        to: OPEN
        trigger: "POST /trails/{id}/closure (new_condition=OPEN)"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "create ClosureEvent(new_condition=OPEN, cancelled_departure_count=0)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /trails/{id}/closure (new_condition=CLOSED)"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "for each TourDeparture on this trail with status IN {SCHEDULED, LOCKED}: transition that departure SCHEDULED|LOCKED -> CANCELLED (cascade); count them into ClosureEvent.cancelled_departure_count"
          - "create ClosureEvent(new_condition=CLOSED, cancelled_departure_count=N)"
        note: "Depth-1 hop of the closure cascade; the departure CANCELLED transition fires its own reservation cascade (depth 2 and 3)."
      - from: CAUTION
        to: CLOSED
        trigger: "POST /trails/{id}/closure (new_condition=CLOSED)"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "for each TourDeparture on this trail with status IN {SCHEDULED, LOCKED}: transition that departure -> CANCELLED (cascade); count into ClosureEvent.cancelled_departure_count"
          - "create ClosureEvent(new_condition=CLOSED, cancelled_departure_count=N)"
      - from: CLOSED
        to: OPEN
        trigger: "POST /trails/{id}/closure (new_condition=OPEN)"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "create ClosureEvent(new_condition=OPEN, cancelled_departure_count=0)"

  # ---- TourDeparture.status (branching: LOCKED gate, DEPARTED, COMPLETED, CANCELLED with cascade) ----
  - entity: TourDeparture
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOCKED
        trigger: "POST /tour-departures/{id}/lock"
        actor: DispatchOperator
        preconditions:
          - "Trail.condition != CLOSED (cross-entity: Trail must not be CLOSED)"
          - "guide_count >= ceil(rider_count / GUIDE_RIDER_RATIO) AND guide_count >= 1"
          - "rider_count >= 1"
        side_effects:
          - "no further Reservation creation/confirmation permitted on this departure"
      - from: LOCKED
        to: DEPARTED
        trigger: "POST /tour-departures/{id}/depart"
        actor: Guide
        preconditions:
          - "Trail.condition != CLOSED"
          - "clock now >= starts_at"
        side_effects:
          - "for each Reservation on this departure in CONFIRMED: transition CONFIRMED -> CHECKED_OUT (cascade); set checked_out_at = clock now; set its Unit RESERVED -> OUT; set its assigned gear ASSIGNED -> OUT"
          - "for each Reservation on this departure still in PENDING: transition PENDING -> CANCELLED (cascade), releasing its unit/gear/deposit"
      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /tour-departures/{id}/complete"
        actor: Guide
        preconditions:
          - "every Reservation on this departure in CHECKED_OUT has been returned (reservation_status == RETURNED) OR marked NO_SHOW"
        side_effects:
          - "release all GuideAssignment.active -> false; set guide_count = 0"
          - "set each assigned Guide OFF_DUTY -> AVAILABLE if no other active assignment"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tour-departures/{id}/cancel OR cascade from Trail CLOSED"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "for each Reservation on this departure in {PENDING, CONFIRMED}: transition -> CANCELLED (cascade); release Unit RESERVED -> AVAILABLE; release gear ASSIGNED -> AVAILABLE; if settlement_status == HELD then transition HELD -> REFUNDED (refund full deposit_hold_cents)"
          - "set guide_count = 0; deactivate GuideAssignments"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /tour-departures/{id}/cancel OR cascade from Trail CLOSED"
        actor: DispatchOperator
        preconditions: []
        side_effects:
          - "for each Reservation on this departure in {PENDING, CONFIRMED}: transition -> CANCELLED (cascade); release unit/gear; refund any HELD deposit (HELD -> REFUNDED)"
          - "set guide_count = 0; deactivate GuideAssignments"

  # ---- Reservation.reservation_status (parallel dimension 1: lifecycle) ----
  - entity: Reservation
    dimension: reservation_status
    initial_state: PENDING
    terminal_states: [RETURNED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Member
        preconditions:
          - "Member.waiver_status == SIGNED"
          - "Member age at TourDeparture.starts_at >= MIN_RIDER_AGE"
          - "if Unit.unit_class == MOUNTAIN then Member.training_level == ADVANCED"
          - "Unit.unit_class >= Trail.required_class (class ordering)"
          - "TourDeparture.status == SCHEDULED (cross-entity: departure not yet LOCKED/cancelled)"
          - "TourDeparture.rider_count < min(capacity_riders, Trail.max_riders) (capacity not full)"
          - "expected_tour_departure_version matches TourDeparture.version (OCC)"
        side_effects:
          - "set settlement_status NONE -> HELD; set deposit_hold_cents (calc deposit_hold); place hold on Unit (AVAILABLE -> RESERVED) and gear (AVAILABLE -> ASSIGNED)"
          - "compute estimated_total_cents (calc estimate_reservation_quote)"
          - "increment TourDeparture.rider_count by 1; increment TourDeparture.version by 1"
          - "recompute Member.deposit_hold_cents"
      - from: CONFIRMED
        to: CHECKED_OUT
        trigger: "POST /tour-departures/{id}/depart (cascade) OR POST /reservations/{id}/check-out"
        actor: Guide
        preconditions:
          - "TourDeparture.status IN {LOCKED, DEPARTED}"
          - "clock now >= TourDeparture.starts_at"
        side_effects:
          - "set checked_out_at = clock now; set Unit RESERVED -> OUT; set gear ASSIGNED -> OUT"
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /reservations/{id}/return"
        actor: DispatchOperator
        preconditions:
          - "fuel_return_fraction supplied in [0,1]"
        side_effects:
          - "set returned_at = clock now; set Unit OUT -> AVAILABLE; set gear OUT -> AVAILABLE (gear not flagged lost)"
          - "create Settlement; run calc final_settlement (rental + fuel + late + damage + gear_loss vs deposit)"
          - "transition settlement_status HELD -> SETTLED"
          - "if damage_assessed_cents > 0 then increment Member.lifetime_damage_strikes by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reservations/{id}/no-show OR cascade from TourDeparture DEPARTED with rider absent"
        actor: DispatchOperator
        preconditions:
          - "TourDeparture.status IN {LOCKED, DEPARTED}"
        side_effects:
          - "set Unit RESERVED -> AVAILABLE; gear ASSIGNED -> AVAILABLE; decrement TourDeparture.rider_count by 1"
          - "create Settlement with rental_charge_cents = NO_SHOW_FEE_CENTS, deposit fully refunded; settlement_status HELD -> SETTLED then deposit REFUNDED portion as refund_cents"
        note: "No-show forfeits a fixed fee from the rental line but refunds the deposit hold."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel OR cascade from TourDeparture/Trail"
        actor: Member
        preconditions: []
        side_effects:
          - "if Unit held (RESERVED) release -> AVAILABLE; if gear ASSIGNED release -> AVAILABLE"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel OR cascade from TourDeparture/Trail"
        actor: Member
        preconditions:
          - "TourDeparture.status != DEPARTED (cannot cancel after the tour has departed)"
        side_effects:
          - "release Unit RESERVED -> AVAILABLE; release gear ASSIGNED -> AVAILABLE; decrement TourDeparture.rider_count by 1"
          - "transition settlement_status HELD -> REFUNDED (refund full deposit_hold_cents); recompute Member.deposit_hold_cents"

  # ---- Reservation.settlement_status (parallel dimension 2: billing) ----
  - entity: Reservation
    dimension: settlement_status
    initial_state: NONE
    terminal_states: [SETTLED, REFUNDED]
    transitions:
      - from: NONE
        to: HELD
        trigger: "side effect of reservation_status PENDING -> CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "deposit_hold_cents set; Member.deposit_hold_cents recomputed"
      - from: HELD
        to: SETTLED
        trigger: "side effect of reservation_status CHECKED_OUT -> RETURNED (or CONFIRMED -> NO_SHOW)"
        actor: system
        preconditions: []
        side_effects:
          - "Settlement created; deposit_applied/refund/net computed; Member.deposit_hold_cents recomputed (this hold removed)"
      - from: HELD
        to: REFUNDED
        trigger: "side effect of reservation cancel (CONFIRMED -> CANCELLED) or departure/trail cancel cascade"
        actor: system
        preconditions: []
        side_effects:
          - "full deposit_hold_cents released; Member.deposit_hold_cents recomputed"

  # ---- Unit.status (lifecycle with maintenance branch) ----
  - entity: Unit
    dimension: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "side effect of Reservation confirm"
        actor: system
        preconditions:
          - "no overlapping reservation on this unit (see validation resource_temporal_overlap on units)"
        side_effects: []
      - from: RESERVED
        to: OUT
        trigger: "side effect of Reservation check-out"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT
        to: AVAILABLE
        trigger: "side effect of Reservation return"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: AVAILABLE
        trigger: "side effect of Reservation cancel/no-show"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /units/{id}/maintenance"
        actor: DispatchOperator
        preconditions:
          - "Unit.status == AVAILABLE (no active reservation hold)"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /units/{id}/maintenance (return_to_service=true)"
        actor: DispatchOperator
        preconditions: []
        side_effects: []

  # ---- GearItem.status ----
  - entity: GearItem
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "side effect of Reservation confirm"
        actor: system
        preconditions:
          - "no overlapping assignment on this gear item (see validation resource_temporal_overlap on gear)"
        side_effects: []
      - from: ASSIGNED
        to: OUT
        trigger: "side effect of Reservation check-out"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT
        to: AVAILABLE
        trigger: "side effect of Reservation return (gear not flagged lost)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "side effect of Reservation cancel/no-show"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT
        to: RETIRED
        trigger: "side effect of Reservation return with gear flagged lost at settlement"
        actor: system
        preconditions: []
        side_effects:
          - "GearItem permanently retired; gear_loss_cents on Settlement includes its replacement_cost_cents"

  # ---- Guide.status ----
  - entity: Guide
    dimension: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "side effect of POST /tour-departures/{id}/assign-guide"
        actor: system
        preconditions:
          - "guide.max_class >= TourDeparture.required_guide_class"
          - "no overlapping assigned departure for this guide (see validation resource_temporal_overlap on guides)"
        side_effects:
          - "create GuideAssignment(active=true); increment TourDeparture.guide_count"
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "side effect of departure COMPLETED/CANCELLED or POST /tour-departures/{id}/unassign-guide"
        actor: system
        preconditions: []
        side_effects:
          - "set GuideAssignment.active=false; decrement TourDeparture.guide_count (floor 0)"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: confirm-stale-departure
    parent_entity: TourDeparture
    write_endpoint: "POST /reservations/{id}/confirm"
    occ_field: "expected_tour_departure_version"
    description: |
      Confirming a PENDING Reservation against a TourDeparture whose version has
      advanced since the client last read it is rejected. This captures the case
      where another rider has already confirmed onto the same departure (which
      legitimately increments rider_count and the departure version under the
      capacity rule), so the current client's view of remaining capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: estimate_reservation_quote
    trigger: "reservation_status PENDING -> CONFIRMED (POST /reservations/{id}/confirm)"
    algorithm: "tiered_pricing + forward_looking"
    formula: |
      # Estimate at confirmation. Departure-days = ceil((ends_at - starts_at) / 1 day),
      # minimum 1.
      days = max(1, ceil_to_days(TourDeparture.ends_at - TourDeparture.starts_at))
      rental_base = Unit.daily_rate_cents * days
      tour_base   = TRAIL_TOUR_FEE_CENTS[Trail.required_class]   # tiered by trail class
      # Gear surcharge: a flat per-assigned-gear-item fee (helmet and/or suit slots set).
      gear_surcharge = GEAR_SURCHARGE_CENTS * (count of assigned gear ids on this reservation)
      gross = rental_base + tour_base + gear_surcharge
      # Membership discount applies ONLY when membership is active at confirmation instant:
      #   active iff membership_tier IN {SEASON, PREMIER} AND
      #            (membership_expires_at is null OR membership_expires_at > clock now)
      if membership_active:
        disc_pct = MEMBER_DISCOUNT_PCT[membership_tier]    # SEASON 0.10, PREMIER 0.20
      else:
        disc_pct = 0.0
      # ROUNDING ORDER IS PINNED (mode (b) — order matters): the discount is rounded
      # ONCE on the COMBINED gross (round_half_up to whole cents), THEN subtracted.
      # Discounting each of {rental_base, tour_base, gear_surcharge} separately, rounding
      # each, then summing can produce a DIFFERENT total by a cent — that variant is WRONG.
      discount = round_half_up(gross * disc_pct)
      est_fuel = 0          # estimate assumes full-tank return
      estimated_total_cents = gross - discount + est_fuel
    input_set: "Single reservation at confirmation; reads Unit, Trail (via TourDeparture), Member; counts assigned gear ids."
    constants:
      TRAIL_TOUR_FEE_CENTS: { TRAIL: 4000, UTILITY: 6000, MOUNTAIN: 9000 }
      MEMBER_DISCOUNT_PCT: { NONE: 0.0, SEASON: 0.10, PREMIER: 0.20 }
      GEAR_SURCHARGE_CENTS: 1525
    precision: "Whole cents; round_half_up applied ONCE to the combined-gross discount (NOT per line)."
    variants:
      - name: estimate
        when: "At confirmation; fuel assumed full (est_fuel=0), late=0, damage=0."
        difference: "Excludes fuel/late/damage; uses estimated days only."

  - name: final_settlement
    trigger: "reservation_status CHECKED_OUT -> RETURNED (POST /reservations/{id}/return)"
    algorithm: "aggregation + waterfall_allocation"
    formula: |
      # Rental line carried from the confirmed estimate (NOT recomputed against
      # actual return time; late time is billed separately by late_charge).
      rental_charge_cents = Reservation.estimated_total_cents
      fuel_charge_cents   = compute_fuel_charge(...)           # see calc fuel_charge
      late_charge_cents   = compute_late_charge(...)           # see calc late_fee
      gear_loss_cents     = sum(GearItem.replacement_cost_cents
                                for gear flagged lost at settlement)
      damage_assessed_cents = input (operator-entered, default 0)
      total_charges = rental_charge_cents + fuel_charge_cents
                    + late_charge_cents + damage_assessed_cents + gear_loss_cents
      # WATERFALL against the held deposit, in this fixed bucket order:
      #   1 rental, 2 fuel, 3 late, 4 damage, 5 gear_loss.
      # deposit_applied is the deposit consumed, capped at the hold.
      deposit_applied_cents = min(Reservation.deposit_hold_cents, total_charges)
      refund_cents          = Reservation.deposit_hold_cents - deposit_applied_cents
      net_charge_cents      = max(0, total_charges - Reservation.deposit_hold_cents)
    input_set: "Single reservation at return; one Settlement row created."
    constants:
      WATERFALL_ORDER: [rental, fuel, late, damage, gear_loss]
    precision: "Whole cents."
    variants:
      - name: final
        when: "At return; includes actual fuel shortfall, late periods, damage, gear loss."
        difference: "Diverges from estimate by added fuel/late/damage/gear_loss; same rental base."

  - name: fuel_charge
    trigger: "computed inside final_settlement at return"
    algorithm: "threshold"
    formula: |
      # No charge if returned at or above the full-tank threshold (>= FUEL_OK_FRACTION).
      # BOUNDARY IS PINNED: shortfall billed only when fuel_return_fraction < FUEL_OK_FRACTION.
      if fuel_return_fraction >= FUEL_OK_FRACTION:
        fuel_charge_cents = 0
      else:
        shortfall_liters = (FUEL_OK_FRACTION - fuel_return_fraction) * Unit.tank_capacity_liters
        fuel_charge_cents = round_half_up(shortfall_liters * FUEL_PRICE_CENTS_PER_LITER)
    input_set: "Single reservation; reads fuel_return_fraction and Unit.tank_capacity_liters."
    constants:
      FUEL_OK_FRACTION: 0.95
      FUEL_PRICE_CENTS_PER_LITER: 180
    precision: "Whole cents; round_half_up after multiplying liters by price."

  - name: late_fee
    trigger: "computed inside final_settlement at return"
    algorithm: "threshold"
    formula: |
      # Late minutes beyond a grace window, billed per started block.
      late_minutes = max(0, minutes(Reservation.returned_at - TourDeparture.ends_at))
      # BOUNDARY IS PINNED: grace is inclusive — late_minutes <= LATE_GRACE_MINUTES is free.
      if late_minutes <= LATE_GRACE_MINUTES:
        late_charge_cents = 0
      else:
        billable = late_minutes - LATE_GRACE_MINUTES
        blocks = ceil(billable / LATE_BLOCK_MINUTES)        # each STARTED block bills fully
        late_charge_cents = blocks * LATE_FEE_PER_BLOCK_CENTS
    input_set: "Single reservation; reads returned_at and TourDeparture.ends_at."
    constants:
      LATE_GRACE_MINUTES: 30
      LATE_BLOCK_MINUTES: 60
      LATE_FEE_PER_BLOCK_CENTS: 2500
    precision: "Whole cents; ceil on blocks."

  - name: deposit_hold
    trigger: "reservation_status PENDING -> CONFIRMED"
    algorithm: "threshold"
    formula: |
      # Deposit equals the unit's deposit unless the member earns a premier waiver.
      # PREMIER members with zero lifetime_damage_strikes get the deposit waived to 0.
      if Member.membership_tier == PREMIER
         and membership_active
         and Member.lifetime_damage_strikes == 0:
        deposit_hold_cents = 0
      else:
        deposit_hold_cents = Unit.deposit_cents
    input_set: "Single reservation at confirmation; reads Unit.deposit_cents and Member."
    constants: {}
    precision: "Whole cents."
    variants:
      - name: standard
        when: "Non-premier or premier with >=1 damage strike."
        difference: "Holds full Unit.deposit_cents."
      - name: premier_waived
        when: "PREMIER, active, zero damage strikes."
        difference: "Holds 0; member carries deposit risk personally."

  - name: guide_ratio_requirement
    trigger: "TourDeparture SCHEDULED -> LOCKED precondition; recomputed on assign/confirm"
    algorithm: "threshold"
    formula: |
      # Minimum guides required for the current rider_count. Each STARTED group of
      # GUIDE_RIDER_RATIO riders needs one guide; at least one guide always required
      # once rider_count >= 1.
      if rider_count == 0:
        required_guides = 0
      else:
        required_guides = max(1, ceil(rider_count / GUIDE_RIDER_RATIO))
      lock_allowed = (guide_count >= required_guides)
    input_set: "Single departure; reads rider_count and guide_count."
    constants:
      GUIDE_RIDER_RATIO: 6
    precision: "Integer; ceil on the ratio."

  - name: no_show_settlement
    trigger: "reservation_status CONFIRMED -> NO_SHOW (POST /reservations/{id}/no-show)"
    algorithm: "aggregation"
    formula: |
      # No-show forfeits a flat fee but refunds the full deposit hold.
      rental_charge_cents   = NO_SHOW_FEE_CENTS
      fuel_charge_cents     = 0
      late_charge_cents     = 0
      damage_assessed_cents = 0
      gear_loss_cents       = 0
      total_charges         = NO_SHOW_FEE_CENTS
      # Deposit is NOT consumed by the no-show fee; the fee is billed as net.
      deposit_applied_cents = 0
      refund_cents          = Reservation.deposit_hold_cents
      net_charge_cents      = NO_SHOW_FEE_CENTS
    input_set: "Single reservation at no-show; one Settlement row created."
    constants:
      NO_SHOW_FEE_CENTS: 5000
    precision: "Whole cents."

  # Eligibility/timing constants surfaced as scaffold-wide constants for §1.4/§1.2 rules.
  - name: eligibility_constants
    trigger: "referenced by confirm/sign-waiver/expire-waiver validations and the gear-overlap rule"
    algorithm: "constant_propagation"
    formula: |
      MIN_RIDER_AGE        = 16   # years; age at TourDeparture.starts_at (confirm gate)
      WAIVER_ADULT_AGE     = 18   # years; age at sign instant; below requires guardian_ack=true
      WAIVER_VALIDITY_DAYS = 365  # waiver lapses SIGNED -> EXPIRED after this many days
      GEAR_BUFFER_MINUTES  = 60   # turnaround buffer added each side of a gear interval
    input_set: "Whole-system constants; no entity reads."
    constants:
      MIN_RIDER_AGE: 16
      WAIVER_ADULT_AGE: 18
      WAIVER_VALIDITY_DAYS: 365
      GEAR_BUFFER_MINUTES: 60
    precision: "Integer years/days/minutes."

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members/register"

  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per §1.7 RBAC matrix."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed Member/Guide roles, X-User-ID matches the owning FK of the target resource (Member owns its Reservation; Guide is assigned to the departure)."
    error_id: ERR_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /reservations/{id}/confirm, POST /reservations/{id}/cancel, POST /tour-departures/{id}/depart, POST /tour-departures/{id}/complete"

  - priority: 4
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right: member, trail, unit, gear, departure, reservation)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource-targeting endpoints"

  - priority: 5
    category: business_constraint
    check: "Request body has all required fields with correct types/enums; numeric ranges respected."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5.1
    category: business_constraint
    check: "Gear kind matches slot: helmet_gear_id references a GearItem with kind==HELMET; suit_gear_id references kind==SUIT."
    error_id: ERR_GEAR_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 5.2
    category: business_constraint
    check: "POST /reservations/{id}/return body includes fuel_return_fraction within [0,1]."
    error_id: ERR_FUEL_FRACTION_REQUIRED
    http_status: 422
    applies_to: "POST /reservations/{id}/return"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined in §1.2; else reject."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity reference precondition: on confirm, TourDeparture.status == SCHEDULED (not LOCKED/DEPARTED/CANCELLED/COMPLETED)."
    error_id: ERR_DEPARTURE_NOT_OPEN
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 8
    category: business_safety
    check: "On confirm, Member.waiver_status == SIGNED."
    error_id: ERR_WAIVER_NOT_SIGNED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 9
    category: business_safety
    check: "On confirm, Member age at TourDeparture.starts_at >= MIN_RIDER_AGE."
    error_id: ERR_RIDER_UNDERAGE
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 10
    category: business_safety
    check: "On confirm, if Unit.unit_class == MOUNTAIN then Member.training_level == ADVANCED."
    error_id: ERR_TRAINING_REQUIRED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 11
    category: business_safety
    check: "On confirm, Unit.unit_class rank >= Trail.required_class rank (sled capable for the route)."
    error_id: ERR_UNIT_CLASS_TOO_LOW
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "On confirm, the chosen Unit has no other reservation in {CONFIRMED, CHECKED_OUT} whose [starts_at, ends_at) half-open window overlaps this departure's window."
    error_id: ERR_UNIT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "On confirm, each chosen GearItem has no other reservation in {CONFIRMED, CHECKED_OUT} whose CLOSED interval [starts_at, ends_at] (turnaround-buffered by GEAR_BUFFER_MINUTES on each side) overlaps this departure's window."
    error_id: ERR_GEAR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 14
    category: business_temporal
    check: "On assign-guide, the Guide has no other active GuideAssignment whose departure window [starts_at, ends_at) overlaps this departure's window."
    error_id: ERR_GUIDE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tour-departures/{id}/assign-guide"

  - priority: 15
    category: business_constraint
    check: "On assign-guide, Guide.max_class rank >= TourDeparture.required_guide_class rank."
    error_id: ERR_GUIDE_CLASS_TOO_LOW
    http_status: 409
    applies_to: "POST /tour-departures/{id}/assign-guide"

  - priority: 16
    category: business_constraint
    check: "On lock, guide_count >= required_guides (calc guide_ratio_requirement) and rider_count >= 1."
    error_id: ERR_GUIDE_RATIO_UNMET
    http_status: 409
    applies_to: "POST /tour-departures/{id}/lock"

  - priority: 17
    category: business_referential
    check: "On lock/depart, the departure's Trail.condition != CLOSED."
    error_id: ERR_TRAIL_CLOSED
    http_status: 409
    applies_to: "POST /tour-departures/{id}/lock, POST /tour-departures/{id}/depart"

  - priority: 18
    category: business_fiscal
    check: "On confirm, TourDeparture.rider_count < min(capacity_riders, Trail.max_riders) (capacity available)."
    error_id: ERR_DEPARTURE_FULL
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_tour_departure_version equals current TourDeparture.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 20
    category: business_constraint
    check: "Uniqueness: Member.email unique; Unit.vin_tag unique; one Settlement per Reservation."
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /members/register, POST /units, POST /reservations/{id}/return"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ----- Members -----
  - method: POST
    path: "/members/register"
    description: "Create a member; waiver_status starts UNSIGNED, training_level NONE."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, date_of_birth, "membership_tier?", "membership_expires_at?"]
    output: Member
    side_effects: ["create Member"]

  - method: GET
    path: "/members/{id}"
    description: "Fetch a member."
    roles: [Member, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/sign-waiver"
    description: "Sign liability waiver (UNSIGNED|EXPIRED -> SIGNED)."
    roles: [Member]
    code: 200
    input: ["guardian_ack?"]
    output: Member
    side_effects: ["waiver_status -> SIGNED; set waiver_signed_at = clock now"]

  - method: POST
    path: "/members/{id}/expire-waiver"
    description: "Re-evaluate waiver validity; if past WAIVER_VALIDITY_DAYS move SIGNED -> EXPIRED."
    roles: [DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["if expired: waiver_status -> EXPIRED; clear waiver_signed_at"]

  - method: POST
    path: "/members/{id}/complete-training"
    description: "Advance training_level (NONE->BASIC->ADVANCED)."
    roles: [DispatchOperator]
    code: 200
    input: [level]
    output: Member
    side_effects: ["training_level advanced"]

  - method: GET
    path: "/members/{id}/reservations"
    description: "List reservations for a member (FK reverse-reachability for Reservation.member_id)."
    roles: [Member, DispatchOperator, PlatformAdmin]
    code: 200
    input: ["reservation_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  # ----- Guides -----
  - method: POST
    path: "/guides"
    description: "Create a guide."
    roles: [DispatchOperator, PlatformAdmin]
    code: 201
    input: [full_name, max_class]
    output: Guide
    side_effects: ["create Guide (status AVAILABLE)"]

  - method: GET
    path: "/guides/{id}"
    description: "Fetch a guide."
    roles: [Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Guide
    side_effects: []

  - method: GET
    path: "/guides/{id}/assignments"
    description: "List GuideAssignments for a guide (FK reverse-reachability for GuideAssignment.guide_id)."
    roles: [Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: GuideAssignment[]
    side_effects: []

  # ----- Trails -----
  - method: POST
    path: "/trails"
    description: "Create a trail (condition starts OPEN)."
    roles: [DispatchOperator, PlatformAdmin]
    code: 201
    input: [name, required_class, max_riders]
    output: Trail
    side_effects: ["create Trail"]

  - method: GET
    path: "/trails/{id}"
    description: "Fetch a trail."
    roles: [Member, Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Trail
    side_effects: []

  - method: POST
    path: "/trails/{id}/closure"
    description: "Change trail condition (OPEN/CAUTION/CLOSED). CLOSED cascades departure + reservation cancellation."
    roles: [DispatchOperator]
    code: 201
    input: [new_condition, reason]
    output: ClosureEvent
    side_effects:
      - "Trail.condition -> new_condition"
      - "if CLOSED: cancel SCHEDULED/LOCKED departures on this trail (cascade), each cancelling its PENDING/CONFIRMED reservations and refunding HELD deposits"
      - "create ClosureEvent with cancelled_departure_count"

  - method: GET
    path: "/trails/{id}/closures"
    description: "List ClosureEvents for a trail (FK reverse-reachability for ClosureEvent.trail_id)."
    roles: [DispatchOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ClosureEvent[]
    side_effects: []

  - method: GET
    path: "/trails/{id}/tour-departures"
    description: "List departures on a trail (FK reverse-reachability for TourDeparture.trail_id)."
    roles: [Member, Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TourDeparture[]
    side_effects: []

  # ----- Units -----
  - method: POST
    path: "/units"
    description: "Create a sled unit (status AVAILABLE)."
    roles: [DispatchOperator, PlatformAdmin]
    code: 201
    input: [vin_tag, unit_class, daily_rate_cents, deposit_cents, tank_capacity_liters]
    output: Unit
    side_effects: ["create Unit"]

  - method: GET
    path: "/units/{id}"
    description: "Fetch a unit."
    roles: [Member, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/units/{id}/maintenance"
    description: "Toggle maintenance (AVAILABLE->MAINTENANCE; or MAINTENANCE->AVAILABLE when return_to_service=true)."
    roles: [DispatchOperator]
    code: 200
    input: ["return_to_service?"]
    output: Unit
    side_effects: ["Unit.status toggled"]

  # ----- Gear -----
  - method: POST
    path: "/gear-items"
    description: "Create a gear item (HELMET or SUIT)."
    roles: [DispatchOperator, PlatformAdmin]
    code: 201
    input: [kind, size_code, replacement_cost_cents]
    output: GearItem
    side_effects: ["create GearItem (status AVAILABLE)"]

  - method: GET
    path: "/gear-items/{id}"
    description: "Fetch a gear item."
    roles: [DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: GearItem
    side_effects: []

  # ----- Tour Departures -----
  - method: POST
    path: "/tour-departures"
    description: "Schedule a departure on a trail (status SCHEDULED)."
    roles: [DispatchOperator]
    code: 201
    input: [trail_id, starts_at, ends_at, required_guide_class, capacity_riders]
    output: TourDeparture
    side_effects: ["create TourDeparture; rider_count=0, guide_count=0"]

  - method: GET
    path: "/tour-departures/{id}"
    description: "Fetch a departure (rider_count, guide_count, status)."
    roles: [Member, Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: TourDeparture
    side_effects: []

  - method: GET
    path: "/tour-departures/{id}/reservations"
    description: "List reservations on a departure (FK reverse-reachability for Reservation.tour_departure_id)."
    roles: [Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: ["reservation_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/tour-departures/{id}/guide-assignments"
    description: "List GuideAssignments on a departure (FK reverse-reachability for GuideAssignment.tour_departure_id)."
    roles: [Guide, DispatchOperator, PlatformAdmin]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: GuideAssignment[]
    side_effects: []

  - method: POST
    path: "/tour-departures/{id}/assign-guide"
    description: "Assign a guide to a departure (creates GuideAssignment; Guide -> OFF_DUTY; guide_count++)."
    roles: [DispatchOperator]
    code: 201
    input: [guide_id]
    output: GuideAssignment
    side_effects: ["create GuideAssignment(active=true); Guide AVAILABLE->OFF_DUTY; increment guide_count"]

  - method: POST
    path: "/tour-departures/{id}/unassign-guide"
    description: "Remove a guide from a departure (GuideAssignment.active=false; guide_count--; Guide may return AVAILABLE)."
    roles: [DispatchOperator]
    code: 200
    input: [guide_id]
    output: TourDeparture
    side_effects: ["GuideAssignment.active=false; decrement guide_count; Guide OFF_DUTY->AVAILABLE if no other active assignment"]

  - method: POST
    path: "/tour-departures/{id}/lock"
    description: "Lock the departure once guide ratio is met (SCHEDULED -> LOCKED)."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: TourDeparture
    side_effects: ["status -> LOCKED"]

  - method: POST
    path: "/tour-departures/{id}/depart"
    description: "Start the tour (LOCKED -> DEPARTED); checks out CONFIRMED reservations, cancels remaining PENDING."
    roles: [Guide]
    code: 200
    input: []
    output: TourDeparture
    side_effects: ["status -> DEPARTED; cascade CONFIRMED->CHECKED_OUT and PENDING->CANCELLED"]

  - method: POST
    path: "/tour-departures/{id}/complete"
    description: "Complete the tour (DEPARTED -> COMPLETED) once all riders returned/no-show; releases guides."
    roles: [Guide]
    code: 200
    input: []
    output: TourDeparture
    side_effects: ["status -> COMPLETED; release GuideAssignments; guides -> AVAILABLE"]

  - method: POST
    path: "/tour-departures/{id}/cancel"
    description: "Cancel a SCHEDULED/LOCKED departure; cascade reservation cancellation + deposit refunds."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: TourDeparture
    side_effects: ["status -> CANCELLED; cascade reservations -> CANCELLED; refund HELD deposits; release guides"]

  # ----- Reservations -----
  - method: POST
    path: "/reservations"
    description: "Create a PENDING reservation (no holds placed yet) for a member on a departure with a chosen unit + gear."
    roles: [Member, DispatchOperator]
    code: 201
    input: [member_id, tour_departure_id, unit_id, "helmet_gear_id?", "suit_gear_id?"]
    output: Reservation
    side_effects: ["create Reservation (reservation_status PENDING, settlement_status NONE)"]

  - method: GET
    path: "/reservations/{id}"
    description: "Fetch a reservation (status, settlement_status, totals)."
    roles: [Member, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "Filtered list of reservations (FK reverse-reachability for Reservation.unit_id, helmet_gear_id, suit_gear_id, member_id, tour_departure_id)."
    roles: [DispatchOperator, PlatformAdmin]
    code: 200
    input: ["member_id?", "tour_departure_id?", "unit_id?", "helmet_gear_id?", "suit_gear_id?", "reservation_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Confirm a PENDING reservation: run all safety/capacity/OCC checks, place unit+gear+deposit holds, quote estimate."
    roles: [Member, DispatchOperator]
    code: 200
    input: [expected_tour_departure_version]
    output: Reservation
    side_effects:
      - "reservation_status PENDING -> CONFIRMED; settlement_status NONE -> HELD"
      - "Unit AVAILABLE->RESERVED; gear AVAILABLE->ASSIGNED; set deposit_hold_cents (calc deposit_hold)"
      - "compute estimated_total_cents (calc estimate_reservation_quote)"
      - "increment TourDeparture.rider_count; increment TourDeparture.version by 1; recompute Member.deposit_hold_cents"

  - method: POST
    path: "/reservations/{id}/check-out"
    description: "Check out a CONFIRMED reservation individually (CONFIRMED -> CHECKED_OUT) when departure LOCKED/DEPARTED."
    roles: [Guide, DispatchOperator]
    code: 200
    input: []
    output: Reservation
    side_effects: ["reservation_status -> CHECKED_OUT; set checked_out_at; Unit RESERVED->OUT; gear ASSIGNED->OUT"]

  - method: POST
    path: "/reservations/{id}/return"
    description: "Return a CHECKED_OUT reservation; create Settlement; compute fuel/late/damage/gear waterfall vs deposit."
    roles: [DispatchOperator]
    code: 200
    input: [fuel_return_fraction, "damage_assessed_cents?", "lost_gear_ids?"]
    output: Settlement
    side_effects:
      - "reservation_status -> RETURNED; settlement_status HELD->SETTLED; set returned_at"
      - "Unit OUT->AVAILABLE; gear OUT->AVAILABLE (or OUT->RETIRED if flagged lost)"
      - "create Settlement (calc final_settlement); if damage_assessed_cents>0 increment Member.lifetime_damage_strikes; recompute Member.deposit_hold_cents"

  - method: POST
    path: "/reservations/{id}/no-show"
    description: "Mark a CONFIRMED reservation NO_SHOW; release unit/gear, charge fixed no-show fee, refund deposit."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "reservation_status -> NO_SHOW; release Unit/gear; decrement rider_count"
      - "create Settlement (rental_charge_cents=NO_SHOW_FEE_CENTS, deposit refunded); settlement_status HELD->SETTLED"

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a PENDING/CONFIRMED reservation; release holds and refund any HELD deposit."
    roles: [Member, DispatchOperator]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "reservation_status -> CANCELLED; release Unit/gear; decrement rider_count if was CONFIRMED"
      - "if settlement_status==HELD then HELD->REFUNDED (full deposit refund); recompute Member.deposit_hold_cents"

  - method: GET
    path: "/settlements/{id}"
    description: "Fetch a settlement breakdown."
    roles: [Member, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/reservations/{id}/settlement"
    description: "Fetch the settlement for a reservation (FK reverse-reachability for Settlement.reservation_id)."
    roles: [Member, DispatchOperator, PlatformAdmin]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  # ----- Test-driving -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an absolute ISO 8601 UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Re-evaluates waiver expiry on set."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; system may move SIGNED waivers past validity to EXPIRED"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/malformed X-User-Role or X-User-ID header on a protected endpoint."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_OWNERSHIP_REQUIRED
    http: 403
    condition: "Entity-backed actor (Member/Guide) is not the owner/assignee of the target resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced member/guide/trail/unit/gear/departure/reservation/settlement does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type/enum, out-of-range value, or gear kind/slot mismatch."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the target resource's current state."
  - id: ERR_DEPARTURE_NOT_OPEN
    http: 409
    condition: "Confirming against a departure whose status is not SCHEDULED."
  - id: ERR_WAIVER_NOT_SIGNED
    http: 409
    condition: "Confirming when Member.waiver_status != SIGNED."
  - id: ERR_RIDER_UNDERAGE
    http: 409
    condition: "Member age at departure start < MIN_RIDER_AGE."
  - id: ERR_TRAINING_REQUIRED
    http: 409
    condition: "MOUNTAIN-class unit requested but Member.training_level != ADVANCED."
  - id: ERR_UNIT_CLASS_TOO_LOW
    http: 409
    condition: "Unit.unit_class rank < Trail.required_class rank."
  - id: ERR_UNIT_DOUBLE_BOOKED
    http: 409
    condition: "Chosen unit already reserved/out over an overlapping departure window (half-open interval overlap)."
  - id: ERR_GEAR_DOUBLE_BOOKED
    http: 409
    condition: "Chosen gear item already assigned/out over a buffered overlapping window (closed interval + turnaround buffer)."
  - id: ERR_GUIDE_DOUBLE_BOOKED
    http: 409
    condition: "Guide already assigned to an overlapping departure window."
  - id: ERR_GUIDE_CLASS_TOO_LOW
    http: 409
    condition: "Guide.max_class rank < departure.required_guide_class rank."
  - id: ERR_GUIDE_RATIO_UNMET
    http: 409
    condition: "Lock attempted with guide_count below required_guides or rider_count < 1."
  - id: ERR_TRAIL_CLOSED
    http: 409
    condition: "Lock/depart attempted while the trail condition is CLOSED."
  - id: ERR_DEPARTURE_FULL
    http: 409
    condition: "Confirm attempted when rider_count is already at effective capacity."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_tour_departure_version does not match the current TourDeparture.version."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Duplicate email/vin_tag, or a second settlement on a reservation already settled."
  - id: ERR_GEAR_KIND_MISMATCH
    http: 422
    condition: "helmet_gear_id references a non-HELMET item or suit_gear_id references a non-SUIT item."
  - id: ERR_FUEL_FRACTION_REQUIRED
    http: 422
    condition: "Return called without a fuel_return_fraction in [0,1]."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a member."
    identity: "opaque"
    exclusive_operations:
      - "POST /members/register"
    shared_operations: []

  - name: Member
    description: "A rider; owns own reservations and waiver/training profile reads."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/sign-waiver"
    shared_operations:
      - "GET /members/{id}"
      - "GET /members/{id}/reservations"
      - "POST /reservations"
      - "GET /reservations/{id}"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/cancel"
      - "GET /reservations/{id}/settlement"
      - "GET /settlements/{id}"
      - "GET /trails/{id}"
      - "GET /units/{id}"
      - "GET /tour-departures/{id}"

  - name: Guide
    description: "Leads departures; departs/completes tours and checks out riders."
    identity: "entity_backed:Guide"
    exclusive_operations:
      - "POST /tour-departures/{id}/depart"
      - "POST /tour-departures/{id}/complete"
    shared_operations:
      - "GET /guides/{id}"
      - "GET /guides/{id}/assignments"
      - "GET /tour-departures/{id}"
      - "GET /tour-departures/{id}/reservations"
      - "GET /tour-departures/{id}/guide-assignments"
      - "GET /trails/{id}"
      - "POST /reservations/{id}/check-out"

  - name: DispatchOperator
    description: "Operations staff; manages inventory, guides, trails/closures, departures, returns, settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /trails/{id}/closure"
      - "POST /units/{id}/maintenance"
      - "POST /tour-departures"
      - "POST /tour-departures/{id}/assign-guide"
      - "POST /tour-departures/{id}/unassign-guide"
      - "POST /tour-departures/{id}/lock"
      - "POST /tour-departures/{id}/cancel"
      - "POST /reservations/{id}/return"
      - "POST /reservations/{id}/no-show"
      - "POST /members/{id}/complete-training"
      - "POST /members/{id}/expire-waiver"
    shared_operations:
      - "POST /guides"
      - "POST /trails"
      - "POST /units"
      - "POST /gear-items"
      - "POST /reservations"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/cancel"
      - "POST /reservations/{id}/check-out"
      - "GET /members/{id}"
      - "GET /members/{id}/reservations"
      - "GET /guides/{id}"
      - "GET /guides/{id}/assignments"
      - "GET /trails/{id}"
      - "GET /trails/{id}/closures"
      - "GET /trails/{id}/tour-departures"
      - "GET /units/{id}"
      - "GET /gear-items/{id}"
      - "GET /tour-departures/{id}"
      - "GET /tour-departures/{id}/reservations"
      - "GET /tour-departures/{id}/guide-assignments"
      - "GET /reservations"
      - "GET /reservations/{id}"
      - "GET /reservations/{id}/settlement"
      - "GET /settlements/{id}"

  - name: PlatformAdmin
    description: "Operator/superuser for configuration, read access, and test-driving (clock)."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /guides"
      - "POST /trails"
      - "POST /units"
      - "POST /gear-items"
      - "POST /members/{id}/expire-waiver"
      - "GET /members/{id}"
      - "GET /members/{id}/reservations"
      - "GET /guides/{id}"
      - "GET /guides/{id}/assignments"
      - "GET /trails/{id}"
      - "GET /trails/{id}/closures"
      - "GET /trails/{id}/tour-departures"
      - "GET /units/{id}"
      - "GET /gear-items/{id}"
      - "GET /tour-departures/{id}"
      - "GET /tour-departures/{id}/reservations"
      - "GET /tour-departures/{id}/guide-assignments"
      - "GET /reservations"
      - "GET /reservations/{id}"
      - "GET /reservations/{id}/settlement"
      - "GET /settlements/{id}"
