            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /alerts/${a1}", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { pc_before: "$.data.pending_count" } }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { n1: "$.data[0].id" } }
          trigger:
