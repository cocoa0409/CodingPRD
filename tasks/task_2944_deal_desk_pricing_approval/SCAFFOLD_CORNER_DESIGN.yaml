            - "${ok_line_net} == 165000"
            - "${ok_line_stack} == 0.450000"
            - "Quote.${q_id}.final_net_total_cents == 165000"

      - name: exception_acceptance_exhausting_the_account_allowance_is_rejected
        claim_type: aggregate_validation
        grounds:
