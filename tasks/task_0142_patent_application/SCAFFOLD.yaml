scenario: |
  Patent Application Filing: application types (Utility/Design/Provisional), USPTO fees
  (Small/Micro Entity), Office Action response, Continuation/CIP, maintenance fees,
  PCT international phase.

domain_name: "patent-application-filing"
api_prefix: "/applications"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - scheduled_deferred_actions
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the applicant (individual or organization)."
      - name: entity_size
        type: enum
        source: input
        description: "USPTO entity size classification."
        constraints: "enum {LARGE, SMALL, MICRO}"
      - name: gross_income_cents
        type: integer
        source: input
        description: "Gross income in USD cents (used to validate MICRO eligibility)."
        constraints: "non-negative; required when entity_size == MICRO"
      - name: prior_filings_count
        type: integer
        source: input
        description: "Number of prior non-provisional US filings by this applicant (used to validate MICRO eligibility)."
        constraints: "non-negative; required when entity_size == MICRO"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status."
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED}"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK to Applicant.id (owning applicant)."
      - name: application_type
        type: enum
        source: input
        description: "USPTO application type."
        constraints: "enum {UTILITY, DESIGN, PROVISIONAL}"
      - name: title
        type: string
        source: input
        description: "Title of the invention."
      - name: claim_count
        type: integer
        source: input
        description: "Total claims declared in the application."
        constraints: "must be >= 1 for UTILITY and DESIGN; must equal 0 for PROVISIONAL"
      - name: independent_claim_count
        type: integer
        source: input
        description: "Number of independent claims declared."
        constraints: "must be <= claim_count; must be >= 1 for UTILITY and DESIGN; must equal 0 for PROVISIONAL"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status of the application."
        default: DRAFT
        constraints: "enum {DRAFT, FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING, ALLOWED, GRANTED, ABANDONED, EXPIRED}"
      - name: filed_at
        type: datetime
        source: computed
        description: "Timestamp when application transitioned DRAFT -> FILED (set once)."
        default: null
      - name: granted_at
        type: datetime
        source: computed
        description: "Timestamp when application transitioned ALLOWED -> GRANTED."
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "Computed expiration date. For PROVISIONAL: filed_at + 365 days. For GRANTED UTILITY/DESIGN: granted_at + patent_term."
        default: null
      - name: parent_application_id
        type: string
        source: input
        description: "Self-referential FK to Application.id; set when this application is a continuation or CIP. Null for original filings."
        default: null
      - name: continuation_type
        type: enum
        source: input
        description: "Type of continuation relationship."
        default: null
        constraints: "enum {NONE, CONTINUATION, CIP}; must be NONE iff parent_application_id is null"
      - name: total_fees_paid_cents
        type: integer
        source: computed
        description: "Sum of FeeTransaction.amount_cents for this application across all categories (denormalized aggregate)."
        default: 0

  - name: OfficeAction
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK to Application.id."
      - name: action_number
        type: integer
        source: system
        description: "Sequential number per application starting at 1."
      - name: action_type
        type: enum
        source: input
        description: "Severity of the office action."
        constraints: "enum {NON_FINAL, FINAL}"
      - name: issued_at
        type: datetime
        source: system
        description: "Timestamp when the office action was issued."
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "issued_at + 90 days (3-month statutory shortened period)."
      - name: extended_deadline_at
        type: datetime
        source: computed
        description: "issued_at + 180 days (6-month maximum with extensions)."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of this office action."
        default: PENDING
        constraints: "enum {PENDING, RESPONDED, ABANDONED_BY_DEFAULT}"

  - name: Response
    parent: OfficeAction
    common_fields: true
    fields:
      - name: office_action_id
        type: string
        source: input
        description: "FK to OfficeAction.id."
      - name: application_id
        type: string
        source: system
        description: "FK to Application.id, copied from OfficeAction at creation."
      - name: filed_at
        type: datetime
        source: system
        description: "Timestamp the response was filed."
      - name: months_extension
        type: integer
        source: computed
        description: "Number of months past the response_deadline_at, rounded up; 0 if on or before deadline."
        constraints: "0..3 inclusive"
      - name: extension_fee_cents
        type: integer
        source: computed
        description: "Extension fee computed from months_extension and applicant entity_size."

  - name: FeeTransaction
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK to Application.id."
      - name: fee_category
        type: enum
        source: input
        description: "Type of fee being paid."
        constraints: "enum {FILING, EXCESS_CLAIM, EXAMINATION, ISSUE, MAINTENANCE, EXTENSION, PCT_TRANSMITTAL, PCT_NATIONAL}"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount paid in USD cents."
        constraints: "must equal scaffold-computed fee for the applicant entity_size and fee_category"
      - name: paid_at
        type: datetime
        source: system
        description: "Timestamp of payment."
      - name: maintenance_fee_id
        type: string
        source: input
        description: "FK to MaintenanceFee.id when fee_category == MAINTENANCE; null otherwise."
        default: null
      - name: office_action_id
        type: string
        source: input
        description: "FK to OfficeAction.id when fee_category == EXTENSION; null otherwise."
        default: null

  - name: MaintenanceFee
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK to Application.id (must be a GRANTED UTILITY application)."
      - name: stage
        type: enum
        source: input
        description: "Which maintenance stage."
        constraints: "enum {STAGE_3_5, STAGE_7_5, STAGE_11_5}"
      - name: window_open_at
        type: datetime
        source: computed
        description: "granted_at + (stage_anchor_years - 0.5) years (start of grace window)."
      - name: due_at
        type: datetime
        source: computed
        description: "granted_at + stage_anchor_years (exact due date; 3.5, 7.5, or 11.5 years)."
      - name: grace_period_end_at
        type: datetime
        source: computed
        description: "due_at + 180 days (end of grace period)."
      - name: status
        type: enum
        source: computed
        description: "Status of this maintenance window."
        default: SCHEDULED
        constraints: "enum {SCHEDULED, PAID, LAPSED}"
      - name: required_fee_cents
        type: integer
        source: computed
        description: "Base maintenance fee at the time of payment (entity-size adjusted, surcharge included if applicable)."

  - name: PCTPhase
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK to Application.id (the US application that originated the PCT)."
      - name: pct_filed_at
        type: datetime
        source: system
        description: "Timestamp PCT was initiated."
      - name: priority_date
        type: datetime
        source: computed
        description: "Equal to Application.filed_at at the moment of PCT initiation."
      - name: national_phase_deadline_at
        type: datetime
        source: computed
        description: "priority_date + 30 months."
      - name: status
        type: enum
        source: computed
        description: "Phase state."
        default: INTERNATIONAL
        constraints: "enum {INTERNATIONAL, NATIONAL_ENTERED, LAPSED}"
      - name: national_entered_at
        type: datetime
        source: computed
        description: "Timestamp the national phase was entered."
        default: null

  - name: AuditEvent
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK to Application.id."
      - name: actor_role
        type: string
        source: system
        description: "Role of the actor that performed the action."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID from the request."
      - name: action
        type: string
        source: system
        description: "Symbolic action name (e.g., APPLICATION_FILED, OFFICE_ACTION_ISSUED)."
      - name: details
        type: object
        source: system
        description: "Structured payload describing the change."

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: "Server-controlled wall clock used to evaluate deadlines and maintenance windows."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [EXPIRED, ABANDONED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /applications/{id}/file"
        actor: Applicant
        preconditions:
          - "Application.application_type is set"
          - "Application.claim_count and Application.independent_claim_count satisfy type-specific constraints"
          - "A FeeTransaction with fee_category == FILING exists for this application with amount_cents == filing_fee per §1.3 filing_fee_table"
          - "If application_type == UTILITY or DESIGN and claim_count > 20 OR independent_claim_count > 3, a FeeTransaction with fee_category == EXCESS_CLAIM exists matching §1.3 excess_claim_fee"
        side_effects:
          - "Application.filed_at = SystemClock.now"
          - "Application.total_fees_paid_cents = sum(FeeTransaction.amount_cents WHERE application_id == this.id)"
          - "If application_type == PROVISIONAL: Application.expires_at = filed_at + 365 days"
          - "AuditEvent created with action=APPLICATION_FILED"

      - from: FILED
        to: UNDER_EXAMINATION
        trigger: "POST /applications/{id}/begin-examination"
        actor: Examiner
        preconditions:
          - "Application.application_type IN {UTILITY, DESIGN}"
          - "A FeeTransaction with fee_category == EXAMINATION exists for this application matching §1.3 examination_fee"
        side_effects:
          - "AuditEvent created with action=EXAMINATION_BEGUN"

      - from: UNDER_EXAMINATION
        to: OFFICE_ACTION_PENDING
        trigger: "POST /applications/{id}/office-actions"
        actor: Examiner
        preconditions:
          - "Application.status == UNDER_EXAMINATION"
        side_effects:
          - "OfficeAction created with action_number = (max existing action_number for this application) + 1"
          - "OfficeAction.issued_at = SystemClock.now"
          - "OfficeAction.response_deadline_at = issued_at + 90 days"
          - "OfficeAction.extended_deadline_at = issued_at + 180 days"
          - "AuditEvent created with action=OFFICE_ACTION_ISSUED"

      - from: OFFICE_ACTION_PENDING
        to: UNDER_EXAMINATION
        trigger: "POST /office-actions/{id}/responses"
        actor: Applicant
        preconditions:
          - "OfficeAction.status == PENDING"
          - "SystemClock.now <= OfficeAction.extended_deadline_at"
          - "If SystemClock.now > OfficeAction.response_deadline_at: a FeeTransaction with fee_category == EXTENSION, office_action_id == this OfficeAction.id, amount_cents == extension_fee per §1.3 exists"
        side_effects:
          - "OfficeAction.status = RESPONDED"
          - "Response created with filed_at = SystemClock.now"
          - "Response.months_extension = ceil(max(0, days(SystemClock.now - response_deadline_at)) / 30)"
          - "Application.total_fees_paid_cents recomputed"
          - "AuditEvent created with action=OFFICE_ACTION_RESPONDED"

      - from: OFFICE_ACTION_PENDING
        to: ABANDONED
        trigger: "POST /_clock/advance (deadline crossed without response)"
        actor: system
        preconditions:
          - "OfficeAction.status == PENDING"
          - "SystemClock.now > OfficeAction.extended_deadline_at"
        side_effects:
          - "OfficeAction.status = ABANDONED_BY_DEFAULT"
          - "Application.status = ABANDONED"
          - "AuditEvent created with action=APPLICATION_ABANDONED_DEADLINE"

      - from: UNDER_EXAMINATION
        to: ALLOWED
        trigger: "POST /applications/{id}/allow"
        actor: Examiner
        preconditions:
          - "No OfficeAction with status == PENDING for this application"
        side_effects:
          - "AuditEvent created with action=APPLICATION_ALLOWED"

      - from: ALLOWED
        to: GRANTED
        trigger: "POST /applications/{id}/grant"
        actor: Examiner
        preconditions:
          - "A FeeTransaction with fee_category == ISSUE exists matching §1.3 issue_fee"
          - "Application.application_type IN {UTILITY, DESIGN}"
        side_effects:
          - "Application.granted_at = SystemClock.now"
          - "Application.expires_at = granted_at + (20y for UTILITY | 15y for DESIGN)"
          - "If application_type == UTILITY: three MaintenanceFee rows created with stages STAGE_3_5, STAGE_7_5, STAGE_11_5; each row's window_open_at = granted_at + (stage_anchor_years - 0.5) years; due_at = granted_at + stage_anchor_years years; grace_period_end_at = due_at + 180 days; status=SCHEDULED"
          - "AuditEvent created with action=APPLICATION_GRANTED"

      - from: GRANTED
        to: EXPIRED
        trigger: "POST /_clock/advance (term reached or maintenance fee lapsed)"
        actor: system
        preconditions:
          - "SystemClock.now >= Application.expires_at OR any MaintenanceFee with status == LAPSED for this application"
        side_effects:
          - "Application.status = EXPIRED"
          - "Any PCTPhase with status == INTERNATIONAL for this application also LAPSES if SystemClock.now > national_phase_deadline_at"
          - "AuditEvent created with action=APPLICATION_EXPIRED"

      - from: FILED
        to: ABANDONED
        trigger: "POST /applications/{id}/abandon"
        actor: Applicant
        preconditions:
          - "Application.status IN {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING, ALLOWED}"
        side_effects:
          - "All PENDING OfficeActions for this application transition to ABANDONED_BY_DEFAULT"
          - "All SCHEDULED MaintenanceFees for this application are deleted"
          - "AuditEvent created with action=APPLICATION_ABANDONED_VOLUNTARY"

  - entity: MaintenanceFee
    initial_state: SCHEDULED
    terminal_states: [PAID, LAPSED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /maintenance-fees/{id}/pay"
        actor: Applicant
        preconditions:
          - "SystemClock.now >= MaintenanceFee.window_open_at"
          - "SystemClock.now <= MaintenanceFee.grace_period_end_at"
          - "Application.status == GRANTED"
          - "A FeeTransaction with fee_category == MAINTENANCE, maintenance_fee_id == this.id exists with amount_cents == MaintenanceFee.required_fee_cents per §1.3 maintenance_fee_table"
        side_effects:
          - "MaintenanceFee.required_fee_cents recorded from §1.3 maintenance_fee_table"
          - "Application.total_fees_paid_cents recomputed"
          - "AuditEvent created with action=MAINTENANCE_FEE_PAID"

      - from: SCHEDULED
        to: LAPSED
        trigger: "POST /_clock/advance (grace period crossed)"
        actor: system
        preconditions:
          - "SystemClock.now > MaintenanceFee.grace_period_end_at"
          - "No FeeTransaction with fee_category == MAINTENANCE and maintenance_fee_id == this.id exists"
        side_effects:
          - "Application.status set to EXPIRED via the GRANTED -> EXPIRED transition"
          - "AuditEvent created with action=MAINTENANCE_FEE_LAPSED"

  - entity: PCTPhase
    initial_state: INTERNATIONAL
    terminal_states: [NATIONAL_ENTERED, LAPSED]
    transitions:
      - from: INTERNATIONAL
        to: NATIONAL_ENTERED
        trigger: "POST /pct-phases/{id}/enter-national"
        actor: Applicant
        preconditions:
          - "SystemClock.now <= PCTPhase.national_phase_deadline_at"
          - "A FeeTransaction with fee_category == PCT_NATIONAL exists matching §1.3 pct_national_fee"
        side_effects:
          - "PCTPhase.national_entered_at = SystemClock.now"
          - "AuditEvent created with action=PCT_NATIONAL_ENTERED"

      - from: INTERNATIONAL
        to: LAPSED
        trigger: "POST /_clock/advance"
        actor: system
        preconditions:
          - "SystemClock.now > PCTPhase.national_phase_deadline_at"
        side_effects:
          - "AuditEvent created with action=PCT_LAPSED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two examiners simultaneously call begin-examination on the same FILED application"
    guarantee: "At most one transition to UNDER_EXAMINATION succeeds; second receives ERR_INVALID_STATE because Application.status is no longer FILED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status (version-checked)"

  - scenario: "Applicant pays MAINTENANCE fee and clock-advance sweep evaluates the same MaintenanceFee at the grace boundary"
    guarantee: "Exactly one of {SCHEDULED->PAID, SCHEDULED->LAPSED} occurs; if PAY arrives at SystemClock.now <= grace_period_end_at it wins, otherwise the sweep wins and PAY is rejected"
    error_id: ERR_MAINTENANCE_WINDOW_CLOSED
    http_status: 409
    serialization: "First-writer-wins on MaintenanceFee.status; PAY rejected if status != SCHEDULED at commit"

  - scenario: "Applicant files Office Action response while sweep is evaluating the extended_deadline"
    guarantee: "If SystemClock.now <= extended_deadline_at the response wins and OfficeAction.status becomes RESPONDED; otherwise the sweep wins and the response is rejected"
    error_id: ERR_OFFICE_ACTION_DEADLINE_PASSED
    http_status: 409
    serialization: "First-writer-wins on OfficeAction.status"

  - scenario: "Two simultaneous continuation/CIP filings reference the same non-PROVISIONAL parent that just got ABANDONED"
    guarantee: "Both continuation creations must observe parent.status when the FILE transition commits; loser receives ERR_PARENT_NOT_PENDING since parent is no longer in {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING, ALLOWED, GRANTED}"
    error_id: ERR_PARENT_NOT_PENDING
    http_status: 409
    serialization: "Read-validate-write on parent_application.status at FILE commit"

  - scenario: "Two grant calls race on the same ALLOWED application after issue fee paid"
    guarantee: "At most one transition to GRANTED succeeds; loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status and Application.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_fee
    trigger: "Computed on Application FILE transition validation"
    algorithm: tiered_pricing
    formula: |
      base = filing_fee_table[application_type]
      multiplier = entity_multiplier[applicant.entity_size]
      result_cents = round_half_up(base * multiplier)  # multiplier applied first; integer cents
    input_set: "Application.application_type and the owning Applicant.entity_size at the moment of FILE"
    constants:
      filing_fee_table_cents: { UTILITY: 32000, DESIGN: 22000, PROVISIONAL: 30000 }
      entity_multiplier: { LARGE: 1.00, SMALL: 0.50, MICRO: 0.25 }
    precision: "integer cents, round_half_up"
    variants:
      - name: small_entity_filing
        when: "applicant.entity_size == SMALL"
        difference: "50% reduction applied multiplicatively before rounding"
      - name: micro_entity_filing
        when: "applicant.entity_size == MICRO"
        difference: "75% reduction applied multiplicatively before rounding; ALSO requires gross_income_cents <= MICRO_INCOME_CAP_CENTS and prior_filings_count <= MICRO_PRIOR_FILINGS_MAX"

  - name: excess_claim_fee
    trigger: "Computed on Application FILE transition when claim_count > 20 OR independent_claim_count > 3"
    algorithm: aggregation
    formula: |
      excess_total = max(0, claim_count - 20)
      excess_indep = max(0, independent_claim_count - 3)
      base = excess_total * EXCESS_TOTAL_CLAIM_UNIT_CENTS + excess_indep * EXCESS_INDEP_CLAIM_UNIT_CENTS
      multiplier = entity_multiplier[applicant.entity_size]
      # Per-component multiplier-then-round; sum integer cents (multiplier applied per component, rounded per component, then summed)
      excess_total_part = round_half_up(excess_total * EXCESS_TOTAL_CLAIM_UNIT_CENTS * multiplier)
      excess_indep_part = round_half_up(excess_indep * EXCESS_INDEP_CLAIM_UNIT_CENTS * multiplier)
      result_cents = excess_total_part + excess_indep_part
    input_set: "Application.claim_count, Application.independent_claim_count, Applicant.entity_size"
    constants:
      EXCESS_TOTAL_CLAIM_UNIT_CENTS: 10001
      EXCESS_INDEP_CLAIM_UNIT_CENTS: 48003
      entity_multiplier: { LARGE: 1.00, SMALL: 0.50, MICRO: 0.25 }
    precision: "round per-component then sum; integer cents, round_half_up"
    variants:
      - name: per_component_rounding
        when: "Always — pinned order"
        difference: "Rounding happens per component (excess_total_part and excess_indep_part) BEFORE summation. Computing sum first then rounding (`round(sum * multiplier)`) is NOT permitted and will give different cents at odd counts."

  - name: extension_fee
    trigger: "Computed when a Response is filed past response_deadline_at"
    algorithm: threshold
    formula: |
      days_late = max(0, days_between(SystemClock.now, response_deadline_at))
      if days_late == 0: result_cents = 0
      else:
        months = ceil(days_late / 30)
        if months > 3: ERROR (deadline passed — handled by separate validation)
        base = extension_fee_table[months]   # months in {1,2,3}
        multiplier = entity_multiplier[applicant.entity_size]
        result_cents = round_half_up(base * multiplier)
    input_set: "OfficeAction.response_deadline_at, SystemClock.now, Applicant.entity_size"
    constants:
      extension_fee_table_cents: { 1: 22000, 2: 64000, 3: 148000 }
      entity_multiplier: { LARGE: 1.00, SMALL: 0.50, MICRO: 0.25 }
    precision: "integer cents, round_half_up; months computed by ceil(days_late/30)"
    variants:
      - name: on_or_before_deadline
        when: "SystemClock.now <= response_deadline_at"
        difference: "No extension fee required (months=0)."
      - name: tier_1
        when: "1 <= ceil(days_late/30) <= 1"
        difference: "Use first tier of the extension fee table."

  - name: maintenance_fee
    trigger: "Computed on MaintenanceFee SCHEDULED -> PAID transition"
    algorithm: threshold
    formula: |
      base = maintenance_fee_table[stage]
      if SystemClock.now > due_at and SystemClock.now <= grace_period_end_at:
        surcharge = SURCHARGE_CENTS
      else:
        surcharge = 0
      multiplier = entity_multiplier[applicant.entity_size]
      # Pinned order: apply entity multiplier to base ONLY (not surcharge), round, then ADD flat surcharge.
      result_cents = round_half_up(base * multiplier) + surcharge
    input_set: "MaintenanceFee.stage, MaintenanceFee.due_at, MaintenanceFee.grace_period_end_at, SystemClock.now, Applicant.entity_size"
    constants:
      maintenance_fee_table_cents: { STAGE_3_5: 160000, STAGE_7_5: 360000, STAGE_11_5: 740000 }
      SURCHARGE_CENTS: 16000
      entity_multiplier: { LARGE: 1.00, SMALL: 0.50, MICRO: 0.25 }
    precision: "integer cents, round_half_up; surcharge is flat and applied AFTER rounding the entity-adjusted base"
    variants:
      - name: timely
        when: "window_open_at <= SystemClock.now <= due_at"
        difference: "No surcharge."
      - name: grace
        when: "due_at < SystemClock.now <= grace_period_end_at"
        difference: "Flat SURCHARGE_CENTS added after rounding."

  - name: total_fees_paid
    trigger: "Recomputed on every FeeTransaction insertion"
    algorithm: aggregation
    formula: |
      result_cents = sum(FeeTransaction.amount_cents
                        WHERE application_id == application.id)
      # ordered by paid_at ASC, ties broken by FeeTransaction.id ASC
    input_set: "All FeeTransaction rows for the application (no status filter; FeeTransaction is append-only and immutable)"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: application_expiration
    trigger: "Computed on Application transition to GRANTED, and on every relevant clock sweep"
    algorithm: forward_looking
    formula: |
      if application_type == PROVISIONAL:
        expires_at = filed_at + 365 days
      else if application_type == UTILITY:
        expires_at = granted_at + 20 years
      else if application_type == DESIGN:
        expires_at = granted_at + 15 years
      # Earliest lapse: if any MaintenanceFee.status == LAPSED, the effective_expires_at is the
      # earliest MaintenanceFee.grace_period_end_at among LAPSED stages; otherwise expires_at as above.
      effective_expires_at = min(expires_at, earliest_lapsed_grace_period_end_at_or_infinity)
    input_set: "Application.application_type, filed_at, granted_at, and all MaintenanceFee rows for this application"
    constants:
      PROVISIONAL_TERM_DAYS: 365
      UTILITY_TERM_YEARS: 20
      DESIGN_TERM_YEARS: 15
    precision: "datetime, second precision"
    variants:
      - name: forward_looking_term
        when: "No MaintenanceFee with status == LAPSED exists"
        difference: "expires_at is computed forward from granted_at using statutory term."
      - name: lapse_truncated
        when: "At least one MaintenanceFee has status == LAPSED"
        difference: "effective_expires_at is the earliest LAPSED grace_period_end_at; produces a different (earlier) expiration than the statutory term."

  - name: pct_national_fee
    trigger: "Computed when entering national phase"
    algorithm: tiered_pricing
    formula: |
      base = PCT_NATIONAL_BASE_CENTS
      multiplier = entity_multiplier[applicant.entity_size]
      result_cents = round_half_up(base * multiplier)
    input_set: "PCTPhase parent Application's Applicant.entity_size at the moment of NATIONAL entry"
    constants:
      PCT_NATIONAL_BASE_CENTS: 51000
      entity_multiplier: { LARGE: 1.00, SMALL: 0.50, MICRO: 0.25 }
    precision: "integer cents, round_half_up"
    variants: []

  - name: applicant_risk_score
    trigger: "Computed on Applicant read (GET /applicants/{id}) and on Applicant status flip"
    algorithm: weighted_scoring
    formula: |
      # Risk score in [0, 100]; higher = more likely to lapse maintenance
      lapsed_count   = count(MaintenanceFee WHERE owning Application.applicant_id == this.id AND status == LAPSED)
      abandoned_count = count(Application WHERE applicant_id == this.id AND status == ABANDONED)
      pending_oa_count = count(OfficeAction WHERE owning Application.applicant_id == this.id AND status == PENDING)
      score = min(100, round_half_up(
              LAPSED_WEIGHT  * lapsed_count
            + ABANDONED_WEIGHT * abandoned_count
            + PENDING_WEIGHT  * pending_oa_count))
      if score >= SUSPEND_THRESHOLD: Applicant.status -> SUSPENDED (auto)
    input_set: "All MaintenanceFee/Application/OfficeAction rows joined by applicant ownership; no status filter beyond those named"
    constants:
      LAPSED_WEIGHT: 25
      ABANDONED_WEIGHT: 15
      PENDING_WEIGHT: 5
      SUSPEND_THRESHOLD: 75
    precision: "integer, round_half_up; clamped to [0, 100]"
    variants:
      - name: standard_scoring
        when: "Always"
        difference: "Weighted sum as defined."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET /_clock"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Applicant, Examiner, USPTOAdmin}"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted for the requested operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All path resources exist (Applicant, Application, OfficeAction, MaintenanceFee, PCTPhase), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all paths with {id}"

  - priority: 5
    category: auth
    check: "Ownership: when X-User-Role == Applicant, the target Application/OfficeAction/MaintenanceFee/PCTPhase MUST belong to the Applicant whose id equals X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all applicant-scoped endpoints"

  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is permitted (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: business_referential
    check: "Continuation/CIP filing: parent_application_id (if provided) refers to a non-PROVISIONAL Application whose status IN {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING, ALLOWED, GRANTED} AND continuation_type IN {CONTINUATION, CIP}"
    error_id: ERR_PARENT_NOT_PENDING
    http_status: 422
    applies_to: "POST /applications, POST /applications/{id}/file"

  - priority: 8
    category: business_safety
    check: "Micro-entity eligibility: when Applicant.entity_size == MICRO, gross_income_cents <= MICRO_INCOME_CAP_CENTS and prior_filings_count <= MICRO_PRIOR_FILINGS_MAX"
    error_id: ERR_MICRO_INELIGIBLE
    http_status: 422
    applies_to: "POST /applicants, PATCH /applicants/{id}"

  - priority: 9
    category: business_constraint
    check: "Claim shape: for UTILITY/DESIGN, claim_count >= 1 AND 1 <= independent_claim_count <= claim_count; for PROVISIONAL, claim_count == 0 AND independent_claim_count == 0"
    error_id: ERR_CLAIM_SHAPE_INVALID
    http_status: 422
    applies_to: "POST /applications, PATCH /applications/{id}"

  - priority: 10
    category: business_temporal
    check: "Office Action response: SystemClock.now <= OfficeAction.extended_deadline_at"
    error_id: ERR_OFFICE_ACTION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /office-actions/{id}/responses"

  - priority: 11
    category: business_temporal
    check: "Maintenance fee payment: SystemClock.now >= MaintenanceFee.window_open_at AND SystemClock.now <= MaintenanceFee.grace_period_end_at"
    error_id: ERR_MAINTENANCE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /maintenance-fees/{id}/pay"

  - priority: 12
    category: business_temporal
    check: "PCT national entry: SystemClock.now <= PCTPhase.national_phase_deadline_at"
    error_id: ERR_PCT_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /pct-phases/{id}/enter-national"

  - priority: 13
    category: business_fiscal
    check: "Fee amount matches scaffold-computed amount (filing/excess_claim/examination/issue/extension/maintenance/pct_national) for applicant entity_size; for FILING also requires the EXCESS_CLAIM fee when applicable"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /applications/{id}/file, POST /applications/{id}/begin-examination, POST /applications/{id}/grant, POST /office-actions/{id}/responses, POST /maintenance-fees/{id}/pay, POST /pct-phases/{id}/enter-national"

  - priority: 14
    category: business_fiscal
    check: "Fee category appropriate for the operation (e.g., MAINTENANCE only on /maintenance-fees/{id}/pay, EXTENSION only on /office-actions/{id}/responses, etc.)"
    error_id: ERR_FEE_CATEGORY_INVALID
    http_status: 422
    applies_to: "POST /applications/{id}/fees and all fee-consuming transitions"

  - priority: 15
    category: business_constraint
    check: "Applicant.status == ACTIVE for any write operation by the applicant; SUSPENDED applicants may only read"
    error_id: ERR_APPLICANT_SUSPENDED
    http_status: 403
    applies_to: "all Applicant-actor write endpoints"

  - priority: 16
    category: business_referential
    check: "PCT initiation: parent Application.application_type IN {UTILITY} AND Application.status IN {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING}"
    error_id: ERR_PCT_INELIGIBLE
    http_status: 422
    applies_to: "POST /applications/{id}/pct-phases"

  - priority: 17
    category: business_constraint
    check: "Maintenance fee only for GRANTED UTILITY applications (DESIGN and PROVISIONAL have no maintenance)"
    error_id: ERR_MAINTENANCE_NOT_APPLICABLE
    http_status: 422
    applies_to: "GET /applications/{id}/maintenance-fees, POST /maintenance-fees/{id}/pay"

  - priority: 18
    category: business_constraint
    check: "Idempotency: when X-Idempotency-Key supplied, replay returns the original response for the same (route, key, applicant_id) within 24 hours"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /applications/{id}/fees, POST /applications/{id}/file"

  - priority: 19
    category: business_constraint
    check: "Optimistic concurrency: when 'version' provided in request body for a mutation, it must equal the current entity.version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /applicants/{id}, PATCH /applications/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Applicants ---
  - method: POST
    path: "/applicants"
    description: "Create a new applicant"
    roles: [USPTOAdmin]
    code: 201
    input: ['name', 'entity_size', 'gross_income_cents?', 'prior_filings_count?']
    output: Applicant
    side_effects:
      - "Applicant.status = ACTIVE"

  - method: GET
    path: "/applicants/{id}"
    description: "Get an applicant including computed applicant_risk_score"
    roles: [USPTOAdmin, Applicant, Examiner]
    code: 200
    input: []
    output: Applicant
    side_effects:
      - "applicant_risk_score recomputed; if score >= SUSPEND_THRESHOLD then Applicant.status -> SUSPENDED"

  - method: PATCH
    path: "/applicants/{id}"
    description: "Update applicant fields (name, entity_size, gross_income_cents, prior_filings_count)"
    roles: [USPTOAdmin]
    code: 200
    input: ['name?', 'entity_size?', 'gross_income_cents?', 'prior_filings_count?', 'version']
    output: Applicant
    side_effects:
      - "ERR_MICRO_INELIGIBLE if MICRO criteria not met"

  - method: GET
    path: "/applicants"
    description: "List applicants with filtering"
    roles: [USPTOAdmin, Examiner]
    code: 200
    input: ['limit?', 'offset?', 'entity_size?', 'status?']
    output: Applicant[]
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/applications"
    description: "Create an application in DRAFT state"
    roles: [Applicant]
    code: 201
    input: ['applicant_id', 'application_type', 'title', 'claim_count', 'independent_claim_count', 'parent_application_id?', 'continuation_type?']
    output: Application
    side_effects:
      - "Application.status = DRAFT"
      - "AuditEvent action=APPLICATION_DRAFTED"

  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: PATCH
    path: "/applications/{id}"
    description: "Update application fields while in DRAFT"
    roles: [Applicant]
    code: 200
    input: ['title?', 'claim_count?', 'independent_claim_count?', 'version']
    output: Application
    side_effects:
      - "Only permitted while status == DRAFT"

  - method: GET
    path: "/applications"
    description: "List applications with filtering"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: ['limit?', 'offset?', 'applicant_id?', 'application_type?', 'status?']
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/fees"
    description: "Record a FeeTransaction for an application"
    roles: [Applicant]
    code: 201
    input: ['fee_category', 'amount_cents', 'maintenance_fee_id?', 'office_action_id?']
    output: FeeTransaction
    side_effects:
      - "Application.total_fees_paid_cents recomputed"
      - "ERR_FEE_AMOUNT_MISMATCH if amount_cents != scaffold-computed amount per §1.3"

  - method: GET
    path: "/applications/{id}/fees"
    description: "List FeeTransactions for an application"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: ['limit?', 'offset?', 'fee_category?']
    output: FeeTransaction[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/file"
    description: "Transition DRAFT -> FILED"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Per §1.2 Application DRAFT->FILED transition"

  - method: POST
    path: "/applications/{id}/begin-examination"
    description: "Transition FILED -> UNDER_EXAMINATION"
    roles: [Examiner]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Per §1.2 Application FILED->UNDER_EXAMINATION transition"

  - method: POST
    path: "/applications/{id}/office-actions"
    description: "Issue a new Office Action (NON_FINAL or FINAL); transitions UNDER_EXAMINATION -> OFFICE_ACTION_PENDING"
    roles: [Examiner]
    code: 201
    input: ['action_type']
    output: OfficeAction
    side_effects:
      - "Per §1.2 transition; OfficeAction.action_number assigned"

  - method: GET
    path: "/applications/{id}/office-actions"
    description: "List Office Actions for an application"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: ['limit?', 'offset?', 'status?']
    output: OfficeAction[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/allow"
    description: "Transition UNDER_EXAMINATION -> ALLOWED"
    roles: [Examiner]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Per §1.2 transition"

  - method: POST
    path: "/applications/{id}/grant"
    description: "Transition ALLOWED -> GRANTED"
    roles: [Examiner]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Per §1.2 transition; MaintenanceFee rows created for UTILITY applications"

  - method: POST
    path: "/applications/{id}/abandon"
    description: "Applicant voluntarily abandons the application"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Per §1.2 transition; PENDING OfficeActions become ABANDONED_BY_DEFAULT; SCHEDULED MaintenanceFees deleted"

  - method: POST
    path: "/applications/{id}/pct-phases"
    description: "Initiate PCT international phase"
    roles: [Applicant]
    code: 201
    input: []
    output: PCTPhase
    side_effects:
      - "Per §1.2 PCTPhase initial_state INTERNATIONAL"

  # --- Office Actions ---
  - method: GET
    path: "/office-actions/{id}"
    description: "Get an Office Action"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: []
    output: OfficeAction
    side_effects: []

  - method: POST
    path: "/office-actions/{id}/responses"
    description: "File a response to an Office Action"
    roles: [Applicant]
    code: 201
    input: []
    output: Response
    side_effects:
      - "Per §1.2 OFFICE_ACTION_PENDING -> UNDER_EXAMINATION transition; computes extension_fee per §1.3 if late"

  # --- Maintenance Fees ---
  - method: GET
    path: "/applications/{id}/maintenance-fees"
    description: "List maintenance fees for a granted UTILITY application"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: ['limit?', 'offset?', 'status?']
    output: MaintenanceFee[]
    side_effects: []

  - method: GET
    path: "/maintenance-fees/{id}"
    description: "Get a MaintenanceFee"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: []
    output: MaintenanceFee
    side_effects: []

  - method: POST
    path: "/maintenance-fees/{id}/pay"
    description: "Pay a maintenance fee (SCHEDULED -> PAID)"
    roles: [Applicant]
    code: 200
    input: []
    output: MaintenanceFee
    side_effects:
      - "Per §1.2 transition"

  # --- PCT ---
  - method: GET
    path: "/pct-phases/{id}"
    description: "Get a PCTPhase"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: []
    output: PCTPhase
    side_effects: []

  - method: POST
    path: "/pct-phases/{id}/enter-national"
    description: "Transition PCT INTERNATIONAL -> NATIONAL_ENTERED"
    roles: [Applicant]
    code: 200
    input: []
    output: PCTPhase
    side_effects:
      - "Per §1.2 transition"

  # --- Audit ---
  - method: GET
    path: "/applications/{id}/audit-events"
    description: "List AuditEvent rows for an application (immutable, append-only)"
    roles: [USPTOAdmin, Examiner, Applicant]
    code: 200
    input: ['limit?', 'offset?']
    output: AuditEvent[]
    side_effects: []

  # --- Clock (test-driving endpoints) ---
  - method: GET
    path: "/_clock"
    description: "Get current SystemClock.now"
    roles: [Applicant, Examiner, USPTOAdmin]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

  - method: POST
    path: "/_clock/advance"
    description: "Advance SystemClock.now and run sweep: lapse Office Actions past extended_deadline_at; lapse MaintenanceFees past grace_period_end_at; lapse PCTPhases past national_phase_deadline_at; expire Applications by term"
    roles: [USPTOAdmin]
    code: 200
    input: ['to']
    output: SystemClock
    side_effects:
      - "SystemClock.now = to"
      - "All time-gated automatic transitions in §1.2 are evaluated and applied"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the requested operation, or ownership check fails"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist (validated left-to-right)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is permitted"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: supplied version does not match current entity.version"

  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "Idempotency-Key reused with a different request payload within 24h"

  - id: ERR_PARENT_NOT_PENDING
    http: 422
    condition: "Continuation/CIP filing references a parent that is not in {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING, ALLOWED, GRANTED} or is PROVISIONAL"

  - id: ERR_CLAIM_SHAPE_INVALID
    http: 422
    condition: "Claim counts violate type-specific constraints"

  - id: ERR_MICRO_INELIGIBLE
    http: 422
    condition: "Applicant declared MICRO but does not meet income / prior-filings caps"

  - id: ERR_OFFICE_ACTION_DEADLINE_PASSED
    http: 409
    condition: "Office Action response filed after extended_deadline_at"

  - id: ERR_MAINTENANCE_WINDOW_CLOSED
    http: 409
    condition: "Maintenance fee payment outside [window_open_at, grace_period_end_at]"

  - id: ERR_MAINTENANCE_NOT_APPLICABLE
    http: 422
    condition: "Maintenance fee accessed for a non-UTILITY or non-GRANTED application"

  - id: ERR_PCT_INELIGIBLE
    http: 422
    condition: "PCT initiated on an application that is not UTILITY in {FILED, UNDER_EXAMINATION, OFFICE_ACTION_PENDING}"

  - id: ERR_PCT_DEADLINE_PASSED
    http: 409
    condition: "National phase entry attempted after national_phase_deadline_at"

  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "Provided fee amount_cents != scaffold-computed amount for this fee_category and entity_size"

  - id: ERR_FEE_CATEGORY_INVALID
    http: 422
    condition: "fee_category not appropriate for the endpoint or context (e.g., MAINTENANCE submitted via /applications/{id}/fees)"

  - id: ERR_APPLICANT_SUSPENDED
    http: 403
    condition: "Applicant.status == SUSPENDED and attempted a write operation"

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input validation failure (missing/invalid field shape or enum value)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "End-user inventor or organization filing patent applications. Cannot perform examination steps."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications (own applicant_id only)"
      - "PATCH /applications/{id} (own, while DRAFT)"
      - "POST /applications/{id}/fees (own)"
      - "POST /applications/{id}/file (own)"
      - "POST /applications/{id}/abandon (own)"
      - "POST /applications/{id}/pct-phases (own)"
      - "POST /office-actions/{id}/responses (own)"
      - "POST /maintenance-fees/{id}/pay (own)"
      - "POST /pct-phases/{id}/enter-national (own)"
    shared_operations:
      - "GET own resources across all entity types"

  - name: Examiner
    description: "USPTO examiner. Performs examination steps but CANNOT pay fees or file/abandon on behalf of applicant (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/begin-examination"
      - "POST /applications/{id}/office-actions"
      - "POST /applications/{id}/allow"
      - "POST /applications/{id}/grant"
    shared_operations:
      - "GET resources across applicants"

  - name: USPTOAdmin
    description: "Platform admin. Owns Applicant CRUD and clock advancement; cannot perform Applicant or Examiner actions on applications (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /applicants"
      - "PATCH /applicants/{id}"
      - "POST /_clock/advance"
    shared_operations:
      - "GET resources across applicants"
