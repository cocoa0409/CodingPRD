      - name: delinquency_threshold_exact_boundary_on_tenant_payment
        metric: "Tenant.outstanding_balance_cents against DELINQUENCY_THRESHOLD_CENTS (5000000), compared with >= so that exactly 5000000 is DELINQUENT"
        endpoint: "POST /tower-colo/tenants/{id}/payments"
        grounds:
          - calculations.tenant_credit_status
          - entities.Tenant.fields.credit_status
          - entities.MasterLeaseAgreement.fields.application_privilege
        distinguishing_aspect: |
          A different metric (an integer-cent ledger balance, not a rounded percentage) on a
          different endpoint. Executing an amendment whose restoration deposit is exactly the
          threshold lands the balance ON the boundary, where >= makes the tenant DELINQUENT and
          suspends the master lease; a single cent of payment steps to 4999999 and restores the
          privilege. An implementation using > at the threshold never suspends and therefore never
          restores, so the privilege assertion fails.
        test_recipe:
          setup:
            - "Tower T1 with an ACTIVE ground lease to 2031-05-31."
            - "Tenant KKK's app_k (1815 load units) is APPROVED after a PASS analysis."
            - "Amendment am_k carries restoration_deposit_cents exactly 5000000; executing it charges the deposit, putting the balance on the boundary, flipping credit_status to DELINQUENT and suspending the master lease."
