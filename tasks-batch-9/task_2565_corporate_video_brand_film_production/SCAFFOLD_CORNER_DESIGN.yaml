            - "The unfiltered list is refused as well, so a crew member can never enumerate the whole booking table"
            - "The fourth call returns HTTP 200 with total_count == 1 containing only ${bk_a}"
            - "GET /shoot-days/${day1} and GET /crew-members/${crew_a} both succeed for the same crew member"

      - name: the_uploader_of_a_cut_cannot_record_its_review_decision
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=28]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.DeliverableVersion.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Segregation is keyed on X-User-ID, not on role: the same human acting as ClientApprover but carrying the post supervisor's user id is refused with 403 ERR_SEGREGATION_OF_DUTIES, and a different approver id then succeeds."
        test_recipe:
          setup:
            - "An IN_PRODUCTION project whose single cut was submitted by user \"post-1\""
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Oakhurst Wine", campaign_title: "Same Hand", creative_brief_summary: "Brand film where the uploader tries to approve his own cut.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Same Hand 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id, dlv_v: $.data.version }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST_PRODUCTION", description: "Edit and finish", quantity: 1, unit_rate_cents: 2000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v}", cut_label: "v1", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.0 }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver_1: $.data.id }
            - call: "POST /deliverable-versions/${ver_1}/qc"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver_1}/submit"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
          trigger:
            - call: "POST /deliverable-versions/${ver_1}/review-decision"
              payload: { decision: "APPROVE", review_note: "Approving my own cut." }
              as: ClientApprover
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver_1}/review-decision"
              payload: { decision: "APPROVE", review_note: "Approved by the client." }
              as: ClientApprover
              as_user_id: "client-1"
          assert:
            - "The first decision returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "After that refusal DeliverableVersion.${ver_1}.review_status is still SUBMITTED with reviewed_by_user_id null"
            - "The second decision returns HTTP 200 with review_status == APPROVED and reviewed_by_user_id == \"client-1\""
            - "Deliverable.${dlv}.status == APPROVED and Project.${proj}.status == DELIVERED"

  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_deliverable_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[version-create-stale-deliverable]
          - errors[ERR_STALE_DELIVERABLE_VERSION]
          - validations[priority=16]
        distinguishing_aspect: "The first cut consumes the deliverable's version, so replaying the same expected_deliverable_version for a second cut is 412 ERR_STALE_DELIVERABLE_VERSION — a stale-read comparison rather than a timing race, and it fires before any QC or state work."
        test_recipe:
          setup:
            - "An IN_PRODUCTION project with one deliverable read at version 1, and one cut already created against that version"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Redmarsh Bank", campaign_title: "Stale Read", creative_brief_summary: "Brand film uploaded twice from one stale read.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Stale Read 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id, dlv_v1: $.data.version }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST_PRODUCTION", description: "Edit and finish", quantity: 1, unit_rate_cents: 2000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v1}", cut_label: "v1", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.0 }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver_1: $.data.id }
          trigger:
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v1}", cut_label: "v2 from a stale read", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.2 }
              as: PostSupervisor
              as_user_id: "post-1"
          assert:
            - "The response is HTTP 412 with data.error_id == ERR_STALE_DELIVERABLE_VERSION"
            - "Deliverable.${dlv}.version_count is still 1 and GET /deliverable-versions filtered by deliverable_id ${dlv} returns total_count == 1"
            - "DeliverableVersion.${ver_1} is untouched and still in review_status DRAFT, technical_status PENDING_QC"
            - "Deliverable.${dlv}.status is still PENDING"

      - name: a_fresh_expected_deliverable_version_succeeds_and_bumps_the_parent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[version-create-stale-deliverable]
          - entities.Deliverable.fields.version
        distinguishing_aspect: "Re-reading the parent yields the advanced version, and the retry with that number is accepted: Deliverable.version increments on every accepted write, so the second cut lands with version_count 2 and the superseded first cut moves to SUPERSEDED."
        test_recipe:
          setup:
            - "The same project as the stale-read corner, with one DRAFT cut already created and the parent re-read"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Redmarsh Bank", campaign_title: "Fresh Read", creative_brief_summary: "Brand film uploaded twice with a re-read in between.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Fresh Read 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id, dlv_v1: $.data.version }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST_PRODUCTION", description: "Edit and finish", quantity: 1, unit_rate_cents: 2000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v1}", cut_label: "v1", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.0 }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver_1: $.data.id }
            - call: "GET /deliverables/${dlv}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_v2: $.data.version }
          trigger:
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v2}", cut_label: "v2 from a fresh read", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.2, supersedes_version_id: "${ver_1}" }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver_2: $.data.id }
          assert:
            - "${dlv_v2} is exactly one greater than ${dlv_v1}"
            - "The response is HTTP 201 with DeliverableVersion.${ver_2}.review_status == DRAFT and technical_status == PENDING_QC"
            - "DeliverableVersion.${ver_1}.review_status == SUPERSEDED and its own version incremented by 1"
            - "Deliverable.${dlv}.version_count == 2 and Deliverable.${dlv}.version is one greater than ${dlv_v2}"

      - name: derived_shoot_day_count_reconciles_after_create_and_after_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Location.fields.scheduled_shoot_day_count
          - entities.Location.fields.scouting_status
          - state_machines.ShootDay.PLANNED_to_CANCELLED
        distinguishing_aspect: "Location.scheduled_shoot_day_count counts only PLANNED and CONFIRMED days, so it reads 0, then 2 after two creates, then 1 after one day is cancelled — and scouting_status falls back to SCOUTED only when the count returns to 0."
        test_recipe:
          setup:
            - "A SCOPED project and a location with stage_count 2, initially unscheduled"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Vantry Motors", campaign_title: "Two Days", creative_brief_summary: "Brand film shot over two days on one stage.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
