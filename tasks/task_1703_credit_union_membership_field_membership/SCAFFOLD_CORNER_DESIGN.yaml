          assert:
            - "err == ERR_SEGMENT_NOT_ACTIVE (409): the segment retired between filing and decision"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_envelope_and_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List responses carry the fixed envelope (meta.api_request_id, response_type array) and default pagination (limit 10, offset 0, has_more false for a single row)."
        test_recipe:
          setup: ["one application on file"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Page Pam", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID"] }, as: MembershipOfficer, as_user_id: "officer-1" }
          trigger:
