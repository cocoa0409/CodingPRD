            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_id}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/releases", payload: { project_id: "${proj_id}", title: "R-X2", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_id}"] }, as: AnRManager, captures: { rel_id: $.data.id } }
            - { call: "POST /api/releases/${rel_id}/promo-campaigns", payload: { channel: "PLAYLIST", start_date: "2026-08-05", end_date: "2026-08-10", spend_cap_cents: 50000 }, as: MarketingManager, captures: { camp_id: $.data.id } }
          trigger:
            - { call: "POST /api/promo-campaigns/${camp_id}/activate", payload: {}, as: MarketingManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/releases/${rel_id}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_id}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/promo-campaigns/${camp_id}/activate", payload: {}, as: MarketingManager, captures: { camp_status: $.data.status } }
          assert:
            - "First activate: error_id == ERR_INVALID_STATE (release PLANNED not in {SCHEDULED, DELIVERED, LIVE}); campaign stays DRAFT"
            - "After schedule: PromoCampaign.${camp_id}.status == ACTIVE"

      - name: option_exercise_blocked_by_open_memo
        grounds:
          - state_machines.Contract.OPTION_WINDOW_to_EXTENDED
          - validations[priority=21]
          - errors[ERR_RENEGOTIATION_IN_PROGRESS]
        distinguishing_aspect: |
          Entity pair Contract -> DealMemo (different from the other two pairs):
          a contract inside its option window cannot exercise while ANY memo of
          the same artist is open; rejecting the memo unblocks the exercise.
        test_recipe:
          setup:
            - "Label defaults; contract ACTIVE (executed at default clock 2026-08-01, term 12m, options_total 1, escalation 150); clock advanced to 2027-05-15; sweep moves contract to OPTION_WINDOW"
            - "A new renegotiation memo exists for the same (SIGNED) artist in DRAFT"
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label X3" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist X3", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 1800, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 1, option_term_months: 12, option_escalation_bps: 150, term_months: 12, valid_until_date: "2028-06-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-05-15T00:00:00Z" }, as: LabelAdmin }
            - { call: "POST /api/labels/${label_id}/ops/sweep", payload: {}, as: LabelAdmin }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 24, valid_until_date: "2028-06-01" }, as: AnRManager, captures: { memo2: $.data.id } }
          trigger:
            - { call: "POST /api/contracts/${contract_id}/exercise-option", payload: {}, as: LabelAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/deal-memos/${memo2}/reject", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_id}/exercise-option", payload: {}, as: LabelAdmin, captures: { c_status: $.data.status, c_opts: $.data.options_exercised, c_end: $.data.current_term_end_date, c_rate: $.data.effective_base_rate_bps } }
          assert:
            - "First exercise: error_id == ERR_RENEGOTIATION_IN_PROGRESS; contract stays OPTION_WINDOW"
            - "After memo rejected: exercise succeeds — status EXTENDED, options_exercised == 1, current_term_end_date == 2028-08-01, effective_base_rate_bps == 1950"

  - rule_id: resource_temporal_overlap
    instances:
      - name: beat_overlap_half_open_rejected
        grounds:
          - calculations.beat_window_overlap
          - validations[priority=29]
          - errors[ERR_BEAT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource (Release, channel) with HALF-OPEN interval semantics on
          MarketingBeat: [2026-08-01, 2026-08-08) vs [2026-08-07, 2026-08-14)
          overlap by one day and are rejected, while different channels never
          conflict.
