              payload: { priority_class: "INSURED_SUBROGATION", declared_rate_bps: 1000, expected_institution_version: "${sub_inst_ver}" }
              as: ReceivershipTrustee
              captures: { sub_round_id: $.data.id }
          trigger:
            - call: "POST /dividend-distributions/${sub_round_id}/settle"
              as: ReceivershipTrustee
            - call: "GET /receivership-certificates/${sub_cert_id}"
              as: ReceivershipTrustee
            - call: "GET /institutions/${sub_inst_id}/insurance-summary"
              as: ReceivershipTrustee
          assert:
            - "trigger[0]: status == 'SETTLED', total_distributed_cents == 2500000, certificate_count == 0 — the base was institution.aggregate_insured_cents 25000000, not any certificate face"
            - "trigger[1]: status == 'ISSUED', cumulative_dividends_cents == 0, last_dividend_amount_cents == 0, last_dividend_round == 0 — an INSURED_SUBROGATION round never touches a depositor certificate"
            - "trigger[2]: receivership_cash_cents == 7500000, dividends_paid_cents == 2500000, cash_conservation_delta_cents == 0"

      - name: dividend_payable_capped_at_remaining_face_then_paid_certificate_excluded
        claim_type: correct_result
        grounds:
          - calculations.dividend_waterfall_allocation.formula
          - calculations.dividend_waterfall_allocation.input_set
          - entities.ReceivershipCertificate.fields.status
        distinguishing_aspect: "Three GENERAL_UNSECURED rounds on one 5000000 certificate exercise the waterfall in sequence: 6000 bps pays the full 3000000 and leaves PARTIALLY_PAID, 8000 bps computes 4000000 but is capped at the remaining 2000000 and flips the certificate to PAID, and a third round at 1000 bps finds an empty claim set (total 0, certificate_count 0) because PAID certificates leave the input set."
        test_recipe:
          setup:
            - "Institution 61039 (book 40000000, estimated recovery 15000000) is CLOSED_IN_RECEIVERSHIP with Hosea (SINGLE 30000000, CERTIFIED): certificate face 5000000, cumulative 0, ISSUED; receivership_cash_cents 10000000 from one proceeds row of 10000000 with no expense."
            - "round 1 at 6000 bps: gross round_half_up(5000000 * 6000 / 10000) = 3000000; remaining face 5000000 so payable 3000000; cumulative 3000000 < 5000000 -> PARTIALLY_PAID; cash 10000000 - 3000000 = 7000000."
            - "round 2 at 8000 bps: gross round_half_up(5000000 * 8000 / 10000) = 4000000; remaining face 5000000 - 3000000 = 2000000 so payable min(4000000, 2000000) = 2000000; cumulative 5000000 -> PAID; cash 5000000."
            - "round 3 at 1000 bps: the only certificate is PAID, so the claim set is empty; total_distributed_cents 0, certificate_count 0, cash unchanged at 5000000 and the certificate's last_dividend_round stays 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61039", legal_name: "Waterfall Cap Bank", charter_state: "IA", book_asset_value_cents: 40000000, estimated_liquidation_recovery_cents: 15000000 }
              as: ClosingManager
              captures: { wf_inst_id: $.data.id }
            - call: "POST /institutions/${wf_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-WF-1", legal_name: "Hosea Bright", depositor_type: "NATURAL_PERSON", contact_email: "hosea@example.com" }
              as: ClaimsAgent
              captures: { wf_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${wf_inst_id}", primary_depositor_id: "${wf_dep_id}", account_number: "WF-0001", ownership_category: "SINGLE", balance_cents: 30000000, accrued_interest_cents: 0, opened_at: "2023-09-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { wf_acct_id: $.data.id }
            - call: "POST /institutions/${wf_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 30000000 }
              as: ClosingManager
              captures: { wf_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${wf_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${wf_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${wf_dep_id}"
              as: ClaimsAgent
              captures: { wf_dep_ver: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${wf_dep_id}", expected_depositor_record_version: "${wf_dep_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-M"
              captures: { wf_det_id: $.data.id }
            - call: "POST /insurance-determinations/${wf_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-M"
            - call: "POST /insurance-determinations/${wf_det_id}/submit-review"
              as: ClaimsAgent
              as_user_id: "U-AGENT-M"
            - call: "POST /insurance-determinations/${wf_det_id}/certify"
              as: ClaimsCertifier
              as_user_id: "U-CERT-M"
            - call: "GET /receivership-certificates"
              payload: { depositor_record_id: "${wf_dep_id}" }
              as: ReceivershipTrustee
              captures: { wf_cert_id: "$.data[0].id" }
            - call: "POST /institutions/${wf_inst_id}/receivership-proceeds"
              payload: { asset_pool_code: "POOL-WF-A", gross_proceeds_cents: 10000000, disposition_expense_cents: 0 }
              as: ReceivershipTrustee
          trigger:
            - call: "GET /institutions/${wf_inst_id}"
              as: ReceivershipTrustee
              captures: { wf_ver_1: $.data.version }
            - call: "POST /institutions/${wf_inst_id}/dividend-distributions"
              payload: { priority_class: "GENERAL_UNSECURED", declared_rate_bps: 6000, expected_institution_version: "${wf_ver_1}" }
              as: ReceivershipTrustee
              captures: { wf_round1_id: $.data.id }
            - call: "POST /dividend-distributions/${wf_round1_id}/settle"
              as: ReceivershipTrustee
            - call: "GET /receivership-certificates/${wf_cert_id}"
              as: ReceivershipTrustee
            - call: "GET /institutions/${wf_inst_id}"
              as: ReceivershipTrustee
              captures: { wf_ver_2: $.data.version }
            - call: "POST /institutions/${wf_inst_id}/dividend-distributions"
              payload: { priority_class: "GENERAL_UNSECURED", declared_rate_bps: 8000, expected_institution_version: "${wf_ver_2}" }
              as: ReceivershipTrustee
              captures: { wf_round2_id: $.data.id }
            - call: "POST /dividend-distributions/${wf_round2_id}/settle"
              as: ReceivershipTrustee
            - call: "GET /receivership-certificates/${wf_cert_id}"
              as: ReceivershipTrustee
            - call: "GET /institutions/${wf_inst_id}"
              as: ReceivershipTrustee
              captures: { wf_ver_3: $.data.version }
            - call: "POST /institutions/${wf_inst_id}/dividend-distributions"
              payload: { priority_class: "GENERAL_UNSECURED", declared_rate_bps: 1000, expected_institution_version: "${wf_ver_3}" }
              as: ReceivershipTrustee
              captures: { wf_round3_id: $.data.id }
            - call: "POST /dividend-distributions/${wf_round3_id}/settle"
              as: ReceivershipTrustee
            - call: "GET /receivership-certificates/${wf_cert_id}"
              as: ReceivershipTrustee
            - call: "GET /institutions/${wf_inst_id}/insurance-summary"
              as: ReceivershipTrustee
          assert:
            - "trigger[1]: status == 'DECLARED', distribution_round == 1, declared_rate_bps == 6000"
            - "trigger[2]: status == 'SETTLED', total_distributed_cents == 3000000, certificate_count == 1"
            - "trigger[3]: status == 'PARTIALLY_PAID', cumulative_dividends_cents == 3000000, last_dividend_round == 1, last_dividend_amount_cents == 3000000"
            - "trigger[5]: distribution_round == 2"
            - "trigger[6]: total_distributed_cents == 2000000, certificate_count == 1 — the 4000000 gross was capped at the 2000000 of unpaid face"
            - "trigger[7]: status == 'PAID', cumulative_dividends_cents == 5000000, last_dividend_round == 2, last_dividend_amount_cents == 2000000"
            - "trigger[9]: distribution_round == 3 — dividend_round_count counted both SETTLED rounds"
            - "trigger[10]: status == 'SETTLED', total_distributed_cents == 0, certificate_count == 0 — the PAID certificate has left the claim set"
            - "trigger[11]: status == 'PAID', cumulative_dividends_cents == 5000000, last_dividend_round == 2 — round 3 did not touch the PAID certificate"
            - "trigger[12]: receivership_cash_cents == 5000000, dividends_paid_cents == 5000000, cash_conservation_delta_cents == 0"

      - name: receivership_proceeds_accumulate_into_cash_conservation
        claim_type: correct_result
        grounds:
          - calculations.institution_aggregate_reconciliation.formula
          - entities.Institution.fields.receivership_cash_cents
          - endpoints[POST /institutions/{id}/receivership-proceeds]
        distinguishing_aspect: "Two proceeds rows from different asset pools accumulate rather than overwrite: gross 10000000 + 4000000 = 14000000 and expense 1200000 + 0 = 1200000 give receivership_cash_cents 12800000, and cash_conservation_delta_cents stays 0 because no dividend has been paid yet."
        test_recipe:
          setup:
            - "Institution 61040 (book 20000000, estimated recovery 8000000) is CLOSED_IN_RECEIVERSHIP with a single 6000000 SINGLE account and no determination prepared."
            - "first proceeds row POOL-A: gross 10000000, expense 1200000 -> net 8800000, so receivership_cash_cents 8800000."
            - "second proceeds row POOL-B: gross 4000000, expense 0 -> net 4000000, so receivership_cash_cents 8800000 + 4000000 = 12800000."
            - "summary identity: gross_disposition_proceeds_cents 14000000 - disposition_expense_total_cents 1200000 - dividends_paid_cents 0 - receivership_cash_cents 12800000 = 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61040", legal_name: "Proceeds Accumulation Bank", charter_state: "NE", book_asset_value_cents: 20000000, estimated_liquidation_recovery_cents: 8000000 }
              as: ClosingManager
              captures: { pa_inst_id: $.data.id }
            - call: "POST /institutions/${pa_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-PA-1", legal_name: "Ines Correa", depositor_type: "NATURAL_PERSON", contact_email: "ines@example.com" }
              as: ClaimsAgent
              captures: { pa_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${pa_inst_id}", primary_depositor_id: "${pa_dep_id}", account_number: "PA-0001", ownership_category: "SINGLE", balance_cents: 6000000, accrued_interest_cents: 0, opened_at: "2024-01-15T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${pa_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 6000000 }
              as: ClosingManager
              captures: { pa_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${pa_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${pa_inst_id}/close"
              as: ClosingManager
          trigger:
            - call: "POST /institutions/${pa_inst_id}/receivership-proceeds"
              payload: { asset_pool_code: "POOL-A", gross_proceeds_cents: 10000000, disposition_expense_cents: 1200000 }
              as: ReceivershipTrustee
            - call: "GET /institutions/${pa_inst_id}"
              as: ReceivershipTrustee
            - call: "POST /institutions/${pa_inst_id}/receivership-proceeds"
              payload: { asset_pool_code: "POOL-B", gross_proceeds_cents: 4000000, disposition_expense_cents: 0 }
              as: ReceivershipTrustee
            - call: "GET /institutions/${pa_inst_id}/insurance-summary"
              as: ReceivershipTrustee
          assert:
            - "trigger[0]: gross_disposition_proceeds_cents == 10000000, disposition_expense_total_cents == 1200000, receivership_cash_cents == 8800000 — the endpoint returns the updated Institution"
            - "trigger[1]: receivership_cash_cents == 8800000"
            - "trigger[2]: gross_disposition_proceeds_cents == 14000000, disposition_expense_total_cents == 1200000, receivership_cash_cents == 12800000 — the second pool accumulated rather than overwrote"
            - "trigger[3]: gross_disposition_proceeds_cents == 14000000, disposition_expense_total_cents == 1200000, dividends_paid_cents == 0, receivership_cash_cents == 12800000, cash_conservation_delta_cents == 0"

      - name: insured_amount_variant_divergence_pooled_versus_per_account
        claim_type: variant_divergence
        grounds:
          - calculations.depositor_insurance_determination.variants
          - entities.InsuranceDetermination.fields.method_variant
        excluded_because:
          difficulty_instance: alice_category_pooled_vs_per_account_insured_divergence
          rationale: "§1.8 already runs the same depositor through both method_variant values of calculations.depositor_insurance_determination and asserts the divergent insured/uninsured pair plus the exact delta, which is the whole content of the variant-divergence claim for this calculation."

      - name: smdia_threshold_boundary_below_at_and_above
        claim_type: threshold
        grounds:
          - calculations.depositor_insurance_determination.constants
          - calculations.depositor_insurance_determination.formula
        excluded_because:
          difficulty_instance: smdia_cap_boundary_below_at_and_above_on_certify
          rationale: "§1.8 certifies three depositors at 24999999, 25000000 and 25000001 cents and asserts the insured/uninsured split plus hold and certificate creation at each point, covering the threshold-1 / threshold / threshold+1 boundary triad for SMDIA_CENTS."

      - name: loss_share_fee_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.bid_evaluated_cost.constants
          - calculations.bid_evaluated_cost.formula
        excluded_because:
          difficulty_instance: loss_share_fee_tier_keyed_on_pre_fee_cost_mode_c
          rationale: "§1.8 straddles the tier A/B/C boundaries of loss_share_fee_cents by holding the bid terms fixed and moving pre_fee_cost_cents across 5000000 and 20000000, asserting the marginal tier rate selected at each boundary."

      - name: dividend_waterfall_per_certificate_allocation
        claim_type: waterfall_allocation
        grounds:
          - calculations.dividend_waterfall_allocation.formula
          - calculations.dividend_waterfall_allocation.input_set
        excluded_because:
          difficulty_instance: dividend_rounds_per_certificate_before_summation_mode_b
          rationale: "§1.8 drives a multi-certificate round where per-certificate capping happens before summation, so the first-bucket-fills-before-second and remainder-allocation aspects of the waterfall are already asserted there."

  - section: validations
    instances:
      - name: clock_cannot_move_backwards_and_equal_reset_is_accepted
        claim_type: temporal_validation
        grounds:
          - validations[priority=24]
          - errors[ERR_CLOCK_MONOTONICITY]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The logical clock is monotone non-decreasing, not strictly increasing: a jump back to 2026-08-02T09:00:00Z is rejected with ERR_CLOCK_MONOTONICITY (422) while re-setting the clock to the value it already holds is accepted, which also proves the rejected call left the clock at 2026-08-03T09:00:00Z."
        test_recipe:
          setup:
            - "the logical clock starts at its process default 2026-08-01T00:00:00Z and is advanced once to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: ClosingManager
              captures: { clk_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 422, response_type == 'error', data.error_id == 'ERR_CLOCK_MONOTONICITY'"
            - "trigger[1]: HTTP 200, data.current_utc == '2026-08-03T09:00:00.000Z' — the equal-value set is legal and the backward attempt did not move the clock"

      - name: malformed_record_count_above_record_count_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_REQUEST]
          - entities.ReadinessSubmission.fields.malformed_record_count
        distinguishing_aspect: "malformed_record_count is bounded by record_count rather than by an absolute constant, so 4 malformed out of 3 records is ERR_INVALID_REQUEST (400) at shape-check time and the institution is left in PRE_FAILURE_MONITORING at version 1 — no submission row and no status flip to READINESS_COLLECTION."
        test_recipe:
          setup:
            - "Institution 61041 exists in status PRE_FAILURE_MONITORING at version 1 with no readiness submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61041", legal_name: "Malformed Count Bank", charter_state: "OH", book_asset_value_cents: 5000000, estimated_liquidation_recovery_cents: 2000000 }
              as: ClosingManager
              captures: { mc_inst_id: $.data.id }
          trigger:
            - call: "POST /institutions/${mc_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 3, malformed_record_count: 4, reported_deposit_total_cents: 1000 }
              as: ClosingManager
              captures: { mc_err: $.data.error_id }
            - call: "GET /institutions/${mc_inst_id}"
              as: ClosingManager
            - call: "GET /institutions/${mc_inst_id}/readiness-submissions"
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 400, data.error_id == 'ERR_INVALID_REQUEST'"
            - "trigger[1]: status == 'PRE_FAILURE_MONITORING', version == 1 — the rejected submission produced no institution side effect"
            - "trigger[2]: total_count == 0, has_more == false"

      - name: broker_fields_rejected_on_single_account_and_required_together_on_pass_through
        claim_type: conditional_validation
        grounds:
          - validations[priority=22]
          - entities.DepositAccount.fields.broker_name
          - entities.DepositAccount.fields.recordkeeping_status
        distinguishing_aspect: "broker_name and recordkeeping_status are conditionally required rather than plain optional: supplying broker_name on a SINGLE account is ERR_INVALID_REQUEST (400), while the identical pair on a BROKERED_PASS_THROUGH account is accepted and stored, so the same two keys flip from forbidden to mandatory purely on ownership_category."
        test_recipe:
          setup:
            - "Institution 61042 in status PRE_FAILURE_MONITORING with two depositor records: Jonas (NATURAL_PERSON) and Keystone Brokerage (BROKER)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61042", legal_name: "Conditional Broker Bank", charter_state: "CO", book_asset_value_cents: 9000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { cb_inst_id: $.data.id }
            - call: "POST /institutions/${cb_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-CB-1", legal_name: "Jonas Ekwueme", depositor_type: "NATURAL_PERSON", contact_email: "jonas@example.com" }
              as: ClaimsAgent
              captures: { cb_person_id: $.data.id }
            - call: "POST /institutions/${cb_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-CB-2", legal_name: "Keystone Brokerage", depositor_type: "BROKER", contact_email: "ops@keystone.example.com" }
              as: ClaimsAgent
              captures: { cb_broker_id: $.data.id }
          trigger:
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cb_inst_id}", primary_depositor_id: "${cb_person_id}", account_number: "CB-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-05-01T00:00:00Z", broker_name: "Keystone Brokerage", recordkeeping_status: "COMPLETE" }
              as: ClaimsAgent
              captures: { cb_err: $.data.error_id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${cb_inst_id}", primary_depositor_id: "${cb_broker_id}", account_number: "CB-0002", ownership_category: "BROKERED_PASS_THROUGH", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-05-01T00:00:00Z", broker_name: "Keystone Brokerage", recordkeeping_status: "COMPLETE" }
              as: ClaimsAgent
              captures: { cb_acct_id: $.data.id }
            - call: "GET /deposit-accounts"
              payload: { institution_id: "${cb_inst_id}" }
              as: ClaimsAgent
          assert:
            - "trigger[0]: HTTP 400, data.error_id == 'ERR_INVALID_REQUEST' — broker_name is forbidden unless ownership_category == BROKERED_PASS_THROUGH"
            - "trigger[1]: HTTP 201, ownership_category == 'BROKERED_PASS_THROUGH', broker_name == 'Keystone Brokerage', recordkeeping_status == 'COMPLETE', insurance_status == 'PENDING'"
            - "trigger[2]: total_count == 1 — only the pass-through account was created"

      - name: designated_share_bps_outside_one_to_ten_thousand_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - entities.OwnershipInterest.fields.designated_share_bps
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "designated_share_bps is a 1..10000 closed range, so both 0 (a zero-share interest) and 10001 (over 100%) are ERR_INVALID_REQUEST (400) and the account keeps zero ownership-interest rows and its version does not move."
        test_recipe:
          setup:
            - "Institution 61043 in PRE_FAILURE_MONITORING with depositor Lidia and one JOINT account JT-0001 at version 1 carrying no ownership interests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
