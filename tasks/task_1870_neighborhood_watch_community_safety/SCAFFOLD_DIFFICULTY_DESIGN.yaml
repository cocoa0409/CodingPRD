              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Gate M", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B120", full_name: "Officer G", precinct_code: "PCT12" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/community-events"
              payload: { watch_group_id: "${wg}", event_kind: "NATIONAL_NIGHT_OUT", street_closure_start: "2026-08-20T18:00:00Z", street_closure_end: "2026-08-20T21:00:00Z", estimated_attendance: 50 }
              as: ProgramCoordinator
              captures: { e1: $.data.id }
            - call: "POST /watch/community-events"
              payload: { watch_group_id: "${wg}", event_kind: "BLOCK_PARTY", street_closure_start: "2026-08-22T10:00:00Z", street_closure_end: "2026-08-22T12:00:00Z", estimated_attendance: 100 }
              as: ProgramCoordinator
              captures: { e2: $.data.id }
            - call: "POST /watch/community-events"
              payload: { watch_group_id: "${wg}", event_kind: "BLOCK_PARTY", street_closure_start: "2026-08-24T10:00:00Z", street_closure_end: "2026-08-24T12:00:00Z", estimated_attendance: 99 }
              as: ProgramCoordinator
              captures: { e3: $.data.id }
          trigger:
            - call: "POST /watch/community-events/${e1}/approve"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { err1: $.data.error_id }
            - call: "POST /watch/community-events/${e2}/approve"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { err2: $.data.error_id }
            - call: "POST /watch/community-events/${e3}/approve"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_CERTIFICATION_REQUIRED (NNO requires CERTIFIED; p15 data-share rule silent because 50 < 100)"
            - "err2 == ERR_DATA_SHARE_REQUIRED (attendance exactly 100 >= PERMIT_TIER_THRESHOLD — the >= boundary is inclusive — and no ACTIVE agreement exists; p15 fires before p16)"
            - "err3 == ERR_CERTIFICATION_REQUIRED (99 is below the tier so p15 is silent; p16 certification gate fires)"
            - "all three events remain PROPOSED"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: corroborate_requires_active_data_share_agreement
        grounds:
          - state_machines.IncidentReport.UNDER_REVIEW_to_CORROBORATED
          - entities.DataShareAgreement.fields.agreement_status
          - validations[priority=15]
        distinguishing_aspect: |
          Entity pair IncidentReport -> DataShareAgreement: corroborate on an
          UNDER_REVIEW report succeeds while the group's agreement is ACTIVE and
          fails with ERR_DATA_SHARE_REQUIRED after the same agreement is REVOKED
          — the report's own fields are unchanged between the two attempts.
        test_recipe:
          setup:
            - "Group with 1 REGISTERED block, 1 ACTIVE member; officer with agreement initially PENDING."
            - "Report R1 in UNDER_REVIEW (agreement never activated -> corroborate must fail)."
            - "Then agreement activated; report R2 in UNDER_REVIEW (corroborate must succeed)."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "XDep Watch", precinct_code: "PCT13" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
