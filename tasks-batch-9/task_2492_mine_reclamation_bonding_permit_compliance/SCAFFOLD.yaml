# =============================================================================
# task_2492 — Mine Reclamation Bonding & Permit Compliance
# State mining regulatory program (permits, bonds, releases, enforcement,
# forfeiture, legacy reclamation funding)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2492. Mine Reclamation Bonding & Permit Compliance (state mining regulatory program): permit application with mining plan, reclamation plan and post-mining land use designation, bond amount calculation from third-party reclamation cost estimates with periodic recalculation, bond instrument acceptance across surety, cash, collateral and self-bonding where allowed with financial tests, incremental bond release tied to reclamation phases with public notice and inspection, inspection program with violation notices, cessation orders and penalty assessment, permit revisions for expansion, sequence changes and post-mining land use modification, forfeiture proceedings with state-conducted reclamation when operators default, abandoned site inventory and prioritization for legacy reclamation funding

domain_name: mine-reclamation-bonding
api_prefix: /mining

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every business resource is a peer collection directly under /mining with
  # explicit FK fields in request bodies; no resource is addressed through a
  # parent-nested id path (parent-scoped GETs exist for reverse discovery only).

  state_machine_shape: parallel
  # Permit carries two independent dimensions (status x compliance_posture) and
  # ViolationNotice carries two (notice_status x penalty_status). The scaffold
  # also contains a cyclic machine (PermitRevision SUBMITTED -> INFO_REQUESTED
  # -> SUBMITTED) and a cyclic+branching machine (BondReleaseApplication
  # SUBMITTED -> PUBLIC_NOTICE -> SUSPENDED -> SUBMITTED, PUBLIC_NOTICE ->
  # {APPROVED, DENIED} with divergent side-effect sets).

  relationship_patterns:
    - one_to_many          # Permit -> estimates / instruments / release apps / inspections / revisions
    - self_referential     # BondInstrument.replaces_instrument_id -> BondInstrument.id
    - cross_aggregate      # ViolationNotice -> Operator ledgers; ForfeitureProceeding -> MineSite legacy inventory

  role_model: segregation_of_duties
  # The BondSpecialist user id that accepted a bond instrument on a permit is
  # barred from deciding a bond release on that same permit.

  consistency_model: immediate

difficulty_level: expert_plus
# 11 entities / 74 endpoints / 58 error codes / 9 calculations / 12 state
# machines. Deliberately above the Expert band (§0.4) because the prompt asks
# for a task harder than expert level; the read surface is inflated by the
# mandatory FK reverse-reachability GETs (§1.5).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the mining company" }
      - { name: tangible_net_worth, type: number, source: input, description: "Audited tangible net worth in USD", constraints: ">= 0" }
      - { name: fixed_assets_in_state, type: number, source: input, description: "Book value of fixed assets located in the state, USD", constraints: ">= 0" }
      - { name: total_liabilities, type: number, source: input, description: "Total liabilities in USD", constraints: ">= 0" }
      - { name: net_income_prior_year, type: number, source: input, description: "Net income for the prior fiscal year, USD (may be negative)" }
      - { name: elected_financial_test, type: enum, source: input, description: "Which self-bonding financial test the operator elects", constraints: "NET_WORTH_TEST | FIXED_ASSET_TEST" }
      - { name: registry_status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | DISQUALIFIED — DISQUALIFIED is written by the forfeiture-finalize cascade" }
      - { name: self_bond_status, type: enum, source: computed, default: UNTESTED, description: "UNTESTED | QUALIFIED | FAILED | DISQUALIFIED — set by POST /operators/{id}/financial-test; reset to UNTESTED by PATCH /operators/{id}/financials; set to DISQUALIFIED by the forfeiture-finalize cascade" }
      - { name: self_bond_capacity_amount, type: number, source: computed, default: 0, description: "Result of calculations.operator_self_bond_capacity for the elected test; 0 when the test fails" }
      - { name: self_bond_exposure_amount, type: number, source: computed, default: 0, description: "Sum of BondInstrument.credited_amount where instrument_type == SELF_BOND AND status == ACCEPTED across every Permit whose operator_id == this operator" }
      - { name: violation_points_total, type: integer, source: computed, default: 0, description: "Sum of ViolationNotice.total_points over notices whose permit.operator_id == this operator AND notice_status IN {ISSUED, CESSATION_ORDERED}" }
      - { name: outstanding_penalty_balance, type: number, source: computed, default: 0, description: "Sum of ViolationNotice.penalty_amount over notices whose permit.operator_id == this operator AND penalty_status == ASSESSED" }
      - { name: forfeiture_count, type: integer, source: computed, default: 0, description: "Number of ForfeitureProceeding rows on this operator's permits that reached status FINAL" }
      - { name: refund_due_amount, type: number, source: computed, default: 0, description: "Cumulative surplus returned to the operator by completed state-conducted reclamation" }

  - name: MineSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: county, type: string, source: input, description: "County of record" }
      - { name: total_acres, type: number, source: input, description: "Total site acreage", constraints: "> 0" }
      - { name: site_class, type: enum, source: input, default: ACTIVE_PERMITTED, description: "ACTIVE_PERMITTED | ABANDONED_LEGACY — also set to ABANDONED_LEGACY by the state-reclamation-completion cascade when a deficiency remains" }
      - { name: hazard_class, type: enum, source: input, default: H3_MODERATE, description: "H1_EXTREME | H2_HIGH | H3_MODERATE — legacy hazard band" }
      - { name: public_safety_score, type: integer, source: input, default: 0, description: "Public-safety exposure score", constraints: "0..100" }
      - { name: water_quality_score, type: integer, source: input, default: 0, description: "Water-quality impact score", constraints: "0..100" }
      - { name: acres_affected, type: number, source: input, default: 0, description: "Unreclaimed acreage used by calculations.legacy_priority_score", constraints: ">= 0" }
      - { name: legacy_priority_score, type: number, source: computed, default: 0, description: "Result of calculations.legacy_priority_score; recomputed on nominate-legacy and on the state-reclamation-completion cascade" }
      - { name: funding_status, type: enum, source: computed, default: NOT_APPLICABLE, description: "NOT_APPLICABLE | NOMINATED | FUNDED" }
      - { name: awarded_funding_amount, type: number, source: computed, default: 0, description: "Legacy reclamation funding awarded to this site" }
      - { name: unfunded_reclamation_need, type: number, source: computed, default: 0, description: "Reclamation cost still unfunded; seeded by nominate-legacy or by the forfeiture deficiency cascade" }

