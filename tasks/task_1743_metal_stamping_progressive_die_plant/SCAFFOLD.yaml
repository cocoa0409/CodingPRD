scenario: "Metal Stamping & Progressive Die Plant (auto-tier stamping plant): part/die pairing & press assignment, coil steel receiving & heat-lot traceability, strip layout & scrap-rate standard, die change & SMED scheduling, PPAP/control-plan & layered audit, in-die sensing & reject counting, secondary ops & outside processing, price adjustment on steel index"
domain_name: metal-stamping-progressive-die-plant
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Customer legal name
      - name: customer_code
        type: string
        source: input
        description: Unique customer code
        constraints: unique across all customers
      - name: steel_index_basis
        type: enum
        source: input
        description: Which published steel index the customer's price adjustments track
        constraints: one of {CRU_HRC, CRU_CRC, LME_STEEL_SCRAP}
      - name: base_index_value
        type: number
        source: input
        description: Steel index value (USD per metric ton) pinned at contract signing; price adjustments are computed as deltas from this basis
      - name: pass_through_pct
        type: number
        source: input
        description: Fraction of steel-index movement passed through to piece price (0..1 inclusive)
        constraints: 0 <= value <= 1
      - name: active
        type: boolean
        source: input
        description: Whether the customer account is active; inactive customers cannot receive new production orders
        default: true

  - name: Part
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; owning customer
      - name: part_number
        type: string
        source: input
        description: Customer part number
        constraints: unique per customer
      - name: material_spec
        type: string
        source: input
        description: Steel grade / spec (e.g. HSLA 340)
      - name: thickness_mm
        type: number
        source: input
        description: Material thickness in millimeters
      - name: net_weight_kg
        type: number
        source: input
        description: Finished part net weight in kg (engineering definition)
      - name: base_piece_price_cents
        type: integer
        source: input
        description: Contractual piece price in cents before steel-index adjustment
      - name: ppap_required_level
        type: integer
        source: input
        description: PPAP submission level required for this part (1..5)
        constraints: 1 <= value <= 5
      - name: steel_content_kg
        type: number
        source: computed
        description: Steel kilograms consumed per good part, derived from the APPROVED StripLayout gross weight per part; 0 until a StripLayout is APPROVED

  - name: Die
    parent: null
    common_fields: true
    fields:
      - name: die_code
        type: string
        source: input
        description: Unique die identifier
        constraints: unique across all dies
      - name: die_type
        type: enum
        source: input
        description: Progressive or transfer die
        constraints: one of {PROGRESSIVE, TRANSFER}
      - name: total_stations
        type: integer
        source: input
        description: Number of stations in the die
        constraints: ">= 1"
      - name: rated_tonnage
        type: integer
        source: input
        description: Minimum press tonnage required to run this die
      - name: min_bed_width_mm
        type: integer
        source: input
        description: Minimum press bed width in mm required for this die
      - name: status
        type: enum
        source: system
        description: Die lifecycle state
        constraints: one of {AVAILABLE, ASSIGNED, IN_REPAIR, RETIRED}
        default: AVAILABLE
      - name: total_shots_lifetime
        type: integer
        source: computed
        description: Cumulative shots across all ProductionRuns on this die
        default: 0
      - name: shots_since_repair
        type: integer
        source: computed
        description: Shots since last completed repair; reset to 0 when a repair completes
        default: 0
      - name: repair_threshold_shots
        type: integer
        source: input
        description: When shots_since_repair reaches this value the die must be sent to repair before being scheduled again

  - name: Press
    parent: null
    common_fields: true
    fields:
      - name: press_code
        type: string
        source: input
        description: Unique press identifier
        constraints: unique across all presses
      - name: tonnage
        type: integer
        source: input
        description: Press capacity in tons
      - name: bed_width_mm
        type: integer
        source: input
        description: Press bed width in mm
      - name: strokes_per_min
        type: integer
        source: input
        description: Rated strokes per minute
      - name: status
        type: enum
        source: system
        description: Press availability state
        constraints: one of {IDLE, IN_SETUP, RUNNING}
        default: IDLE

  - name: PartDieAssignment
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id; part being paired
      - name: die_id
        type: string
        source: input
        description: FK -> Die.id; die paired to the part
      - name: qualified
        type: boolean
        source: system
        description: True only after PPAP approval for this part (PPAP gate)
        default: false

  - name: SteelCoil
    parent: null
    common_fields: true
    fields:
      - name: coil_number
        type: string
        source: input
        description: Mill coil number
        constraints: unique across all coils
      - name: heat_lot_number
        type: string
        source: input
        description: Mill heat lot for traceability cascade
      - name: material_spec
        type: string
        source: input
        description: Steel grade; must match Part.material_spec for consumption
      - name: thickness_mm
        type: number
        source: input
        description: Coil thickness in mm; must match Part.thickness_mm for consumption
      - name: received_weight_kg
        type: number
        source: input
        description: Coil weight as received
      - name: remaining_weight_kg
        type: number
        source: computed
        description: Weight not yet consumed by ProductionRuns; starts equal to received_weight_kg
      - name: status
        type: enum
        source: system
        description: Coil disposition state
        constraints: one of {RECEIVED, APPROVED, ON_HOLD, REJECTED, DEPLETED, QUARANTINED}
        default: RECEIVED

  - name: StripLayout
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id; part the layout belongs to
      - name: revision
        type: string
        source: input
        description: Layout revision code
      - name: strip_width_mm
        type: number
        source: input
        description: Coil strip width consumed
      - name: pitch_mm
        type: number
        source: input
        description: Progression pitch per stroke
      - name: parts_per_strip_segment
        type: integer
        source: input
        description: Parts produced per pitch advance
      - name: gross_weight_per_part_kg
        type: number
        source: input
        description: Gross steel consumed per part including skeleton scrap
      - name: status
        type: enum
        source: system
        description: Layout approval lifecycle
        constraints: one of {DRAFT, APPROVED, SUPERSEDED}
        default: DRAFT

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id; part to stamp
      - name: quantity_ordered
        type: integer
        source: input
        description: Good parts ordered
        constraints: ">= 1"
      - name: due_date
        type: datetime
        source: input
        description: Contractual due date (ISO 8601)
      - name: status
        type: enum
        source: system
        description: Order lifecycle
        constraints: one of {OPEN, RELEASED, IN_PROGRESS, COMPLETED, CLOSED, CANCELLED}
        default: OPEN
      - name: quantity_produced_good
        type: integer
        source: computed
        description: Good parts produced across all runs for this order
        default: 0
      - name: quantity_scrapped
        type: integer
        source: computed
        description: Scrapped parts across all runs for this order
        default: 0
      - name: steel_index_at_release
        type: number
        source: system
        description: Published steel index value captured when the order is RELEASED; used by the index-linked price adjustment
      - name: pricing_variant
        type: enum
        source: system
        description: Which price-adjustment variant governs this order
        constraints: one of {RELEASE_LOCKED, SHIPMENT_SPOT}
        default: RELEASE_LOCKED

  - name: DieChangeEvent
    parent: null
    common_fields: true
    fields:
      - name: press_id
        type: string
        source: input
        description: FK -> Press.id; press undergoing the changeover
      - name: from_die_id
        type: string
        source: input
        description: FK -> Die.id; die being removed; null for initial setup
      - name: to_die_id
        type: string
        source: input
        description: FK -> Die.id; die being installed
      - name: planned_start
        type: datetime
        source: input
        description: Planned changeover start (ISO 8601)
      - name: planned_end
        type: datetime
        source: input
        description: Planned changeover end (ISO 8601); must be after planned_start
      - name: actual_start
        type: datetime
        source: system
        description: Recorded when changeover begins
      - name: actual_end
        type: datetime
        source: system
        description: Recorded when changeover completes
      - name: smed_target_minutes
        type: integer
        source: input
        description: SMED target for this changeover in minutes
      - name: status
        type: enum
        source: system
        description: Changeover lifecycle
        constraints: one of {PLANNED, IN_PROGRESS, COMPLETED, CANCELLED}
        default: PLANNED
      - name: variance_minutes
        type: integer
        source: computed
        description: actual duration in minutes minus smed_target_minutes; computed at completion

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: production_order_id
        type: string
        source: input
        description: FK -> ProductionOrder.id; order the run serves
      - name: press_id
        type: string
        source: input
        description: FK -> Press.id; press used
      - name: die_id
        type: string
        source: input
        description: FK -> Die.id; die used
      - name: coil_id
        type: string
        source: input
        description: FK -> SteelCoil.id; coil consumed (heat-lot link)
      - name: scheduled_start
        type: datetime
        source: input
        description: Planned run start
      - name: scheduled_end
        type: datetime
        source: input
        description: Planned run end; must be after scheduled_start
      - name: status
        type: enum
        source: system
        description: Run lifecycle
        constraints: one of {SCHEDULED, RUNNING, COMPLETED, ABORTED}
        default: SCHEDULED
      - name: shots_recorded
        type: integer
        source: system
        description: Total press strokes recorded for the run
        default: 0
      - name: good_count
        type: integer
        source: system
        description: Good parts counted at run end (shots minus rejects minus strip-edge losses)
        default: 0
      - name: reject_count
        type: integer
        source: system
        description: Rejects counted by in-die sensing during the run
        default: 0
      - name: steel_consumed_kg
        type: number
        source: computed
        description: Steel kilograms consumed from the coil by this run

  - name: RejectEvent
    parent: null
    common_fields: false
    fields:
      - name: production_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; run the reject was sensed on
      - name: station_number
        type: integer
        source: input
        description: Die station where the reject was sensed
      - name: sensor_code
        type: enum
        source: input
        description: In-die sensor that fired
        constraints: one of {MISFEED, SHORT_FEED, PART_EJECT_FAIL, DOUBLE_BLANK, SLUG_DETECT}
      - name: quantity
        type: integer
        source: input
        description: Number of rejected parts in this event
        constraints: ">= 1"
      - name: sensed_at
        type: datetime
        source: input
        description: Timestamp the sensor fired (ISO 8601)

  - name: OutsideProcessingOrder
    parent: null
    common_fields: true
    fields:
      - name: production_order_id
        type: string
        source: input
        description: FK -> ProductionOrder.id; stamping order whose parts go out
      - name: operation_type
        type: enum
        source: input
        description: Secondary operation performed by the outside processor
        constraints: one of {PLATING, HEAT_TREAT, E_COAT, DEBURR}
      - name: quantity_sent
        type: integer
        source: input
        description: Good parts shipped to the processor
        constraints: ">= 1"
      - name: quantity_returned_good
        type: integer
        source: system
        description: Good parts returned
        default: 0
      - name: quantity_returned_scrap
        type: integer
        source: system
        description: Parts scrapped by the outside processor
        default: 0
      - name: status
        type: enum
        source: system
        description: Outside processing lifecycle
        constraints: one of {SENT, PARTIAL_RETURN, CLOSED}
        default: SENT

  - name: PPAPSubmission
    parent: null
    common_fields: true
    fields:
      - name: part_id
        type: string
        source: input
        description: FK -> Part.id; part under submission
      - name: level
        type: integer
        source: input
        description: PPAP level submitted; must equal Part.ppap_required_level
      - name: submission_revision
        type: integer
        source: system
        description: Monotonic resubmission counter starting at 1
        default: 1
      - name: control_plan_attached
        type: boolean
        source: input
        description: Whether a control plan document is attached (required for level >= 2)
      - name: status
        type: enum
        source: system
        description: PPAP review lifecycle
        constraints: one of {SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED}
        default: SUBMITTED
      - name: rejection_reason
        type: string
        source: system
        description: Reason recorded on rejection

  - name: LayeredAudit
    parent: null
    common_fields: true
    fields:
      - name: press_id
        type: string
        source: input
        description: FK -> Press.id; audited press
      - name: audit_tier
        type: integer
        source: input
        description: "Layered audit tier: 1 = shift supervisor, 2 = plant manager, 3 = corporate quality"
        constraints: one of {1, 2, 3}
      - name: scheduled_date
        type: datetime
        source: input
        description: Date the audit is due
      - name: executed_at
        type: datetime
        source: system
        description: Timestamp the audit result was recorded
      - name: result
        type: enum
        source: system
        description: Audit outcome
        constraints: one of {PENDING, PASS, FAIL}
        default: PENDING
      - name: findings_count
        type: integer
        source: system
        description: Findings recorded
        default: 0
      - name: escalated_from_id
        type: string
        source: system
        description: FK -> LayeredAudit.id; the lower-tier audit whose FAIL spawned this audit, or null for scheduled audits

  - name: IndexPublication
    parent: null
    common_fields: false
    fields:
      - name: index_code
        type: enum
        source: input
        description: Published steel index identifier
        constraints: one of {CRU_HRC, CRU_CRC, LME_STEEL_SCRAP}
      - name: published_at
        type: datetime
        source: input
        description: Publication timestamp (ISO 8601)
      - name: value_usd_per_ton
        type: number
        source: input
        description: Published index value in USD per metric ton

  - name: PriceAdjustment
    parent: null
    common_fields: false
    fields:
      - name: production_order_id
        type: string
        source: system
        description: FK -> ProductionOrder.id; order being repriced
      - name: variant_applied
        type: enum
        source: system
        description: Which variant produced this adjustment
        constraints: one of {RELEASE_LOCKED, SHIPMENT_SPOT}
      - name: base_index_value
        type: number
        source: system
        description: Customer.base_index_value snapshot
      - name: applied_index_value
        type: number
        source: system
        description: Index value used by the variant (at release, or latest at close)
      - name: adjusted_piece_price_cents
        type: integer
        source: computed
        description: Resulting piece price in cents after the index pass-through formula

state_machines:
  - entity: Die
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /api/die-change-events with to_die_id = die (changeover starts on the press)"
        actor: SetupLead
        preconditions:
          - die.status == AVAILABLE
          - die.shots_since_repair < die.repair_threshold_shots
        side_effects:
          - die.updated_at refreshed; die.version incremented
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /api/die-change-events with from_die_id = die (die removed from press at changeover completion)"
        actor: SetupLead
        preconditions:
          - die.status == ASSIGNED
        side_effects:
          - die.updated_at refreshed; die.version incremented
      - from: ASSIGNED
        to: IN_REPAIR
        trigger: "POST /api/dies/{id}/send-to-repair"
        actor: ToolroomManager
        preconditions:
          - die.status == ASSIGNED or die.status == AVAILABLE
          - die.shots_since_repair >= die.repair_threshold_shots
        side_effects:
          - any SCHEDULED ProductionRun referencing this die is ABORTED (conditional cascade)
      - from: AVAILABLE
        to: IN_REPAIR
        trigger: "POST /api/dies/{id}/send-to-repair"
        actor: ToolroomManager
        preconditions:
          - die.shots_since_repair >= die.repair_threshold_shots
        side_effects:
          - any SCHEDULED ProductionRun referencing this die is ABORTED
      - from: IN_REPAIR
        to: AVAILABLE
        trigger: "POST /api/dies/{id}/complete-repair"
        actor: ToolroomManager
        preconditions:
          - die.status == IN_REPAIR
        side_effects:
          - die.shots_since_repair reset to 0
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/dies/{id}/retire"
        actor: ToolroomManager
        preconditions:
          - die.status == AVAILABLE
          - no ProductionRun in SCHEDULED or RUNNING references this die
        side_effects:
          - all PartDieAssignment rows referencing this die are deleted

  - entity: SteelCoil
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /api/steel-coils/{id}/approve"
        actor: QualityEngineer
        preconditions:
          - coil.status == RECEIVED
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /api/steel-coils/{id}/reject"
        actor: QualityEngineer
        preconditions:
          - coil.status == RECEIVED
        side_effects: []
      - from: APPROVED
        to: ON_HOLD
        trigger: "POST /api/steel-coils/{id}/hold"
        actor: QualityEngineer
        preconditions:
          - coil.status == APPROVED
        side_effects:
          - SCHEDULED ProductionRuns referencing this coil are NOT auto-aborted but cannot be started while ON_HOLD (guarded at start)
      - from: ON_HOLD
        to: APPROVED
        trigger: "POST /api/steel-coils/{id}/release-hold"
        actor: QualityEngineer
        preconditions:
          - coil.status == ON_HOLD
        side_effects: []
      - from: APPROVED
        to: QUARANTINED
        trigger: "System cascade: a heat-lot defect escalation (LayeredAudit tier-3 FAIL referencing a press whose runs consumed this heat_lot_number)"
        actor: system
        preconditions:
          - coil.status == APPROVED
          - coil.heat_lot_number matches the implicated heat lot
        side_effects:
          - every SteelCoil sharing the heat_lot_number with status APPROVED becomes QUARANTINED (heat-lot traceability cascade)
          - every SCHEDULED ProductionRun referencing a QUARANTINED coil is ABORTED
          - every RUNNING ProductionRun referencing a QUARANTINED coil is ABORTED with good_count preserved
          - parent ProductionOrder of each aborted run with status IN_PROGRESS reverts to RELEASED
      - from: APPROVED
        to: DEPLETED
        trigger: "System auto-transition when remaining_weight_kg reaches 0 after a ProductionRun completion"
        actor: system
        preconditions:
          - coil.remaining_weight_kg == 0
        side_effects: []

  - entity: StripLayout
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/strip-layouts/{id}/approve"
        actor: ProcessEngineer
        preconditions:
          - layout.status == DRAFT
          - no other StripLayout for the same part_id is currently APPROVED unless the request carries expected_part_version (OCC-gated supersede)
        side_effects:
          - Part.steel_content_kg := layout.gross_weight_per_part_kg (derived-field sync)
          - if superseding: previous APPROVED layout for the part becomes SUPERSEDED
          - part.version incremented
      - from: APPROVED
        to: SUPERSEDED
        trigger: "Side effect of a newer StripLayout for the same part reaching APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - layout.updated_at refreshed

  - entity: ProductionOrder
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "POST /api/production-orders/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - order.status == OPEN
          - part.customer.active == true
          - at least one PartDieAssignment exists for the part with qualified == true
          - an APPROVED StripLayout exists for the part
          - a PPAPSubmission for the part has status == APPROVED
        side_effects:
          - "order.steel_index_at_release := latest IndexPublication.value_usd_per_ton for the customer's steel_index_basis with published_at <= now (selector: latest published_at; tie-break: earliest created_at ASC)"
      - from: RELEASED
        to: IN_PROGRESS
        trigger: "POST /api/production-runs (first run for the order starts)"
        actor: PressOperator
        preconditions:
          - order.status == RELEASED
        side_effects:
          - order.updated_at refreshed; order.version incremented
      - from: IN_PROGRESS
        to: RELEASED
        trigger: "System revert when all RUNNING/SCHEDULED runs for the order are ABORTED (e.g. heat-lot quarantine cascade) and no run remains active"
        actor: system
        preconditions:
          - order.status == IN_PROGRESS
          - no ProductionRun for this order in SCHEDULED or RUNNING
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/production-orders/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - order.status == IN_PROGRESS
          - order.quantity_produced_good >= order.quantity_ordered
          - no ProductionRun for this order in RUNNING
        side_effects: []
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /api/production-orders/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - order.status == COMPLETED
          - every OutsideProcessingOrder for this order has status == CLOSED
        side_effects:
          - a PriceAdjustment record is written applying the order's pricing_variant (cascading side effect)
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/production-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - order.status in {OPEN, RELEASED}
          - no ProductionRun for this order in RUNNING
        side_effects:
          - SCHEDULED ProductionRuns for this order are ABORTED
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /api/production-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - no ProductionRun for this order in RUNNING
        side_effects:
          - SCHEDULED ProductionRuns for this order are ABORTED

  - entity: DieChangeEvent
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /api/die-change-events/{id}/start"
        actor: SetupLead
        preconditions:
          - event.status == PLANNED
          - press.status in {IDLE, RUNNING}
          - no other DieChangeEvent for the same press in IN_PROGRESS
          - to_die.status == AVAILABLE and to_die.shots_since_repair < to_die.repair_threshold_shots
          - press.tonnage >= to_die.rated_tonnage and press.bed_width_mm >= to_die.min_bed_width_mm
        side_effects:
          - press.status := IN_SETUP
          - to_die.status := ASSIGNED
          - actual_start := now
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/die-change-events/{id}/complete"
        actor: SetupLead
        preconditions:
          - event.status == IN_PROGRESS
        side_effects:
          - press.status := IDLE
          - from_die (if not null).status := AVAILABLE
          - actual_end := now
          - variance_minutes := (actual_end - actual_start) in whole minutes (floor) - smed_target_minutes
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/die-change-events/{id}/cancel"
        actor: SetupLead
        preconditions:
          - event.status == PLANNED
        side_effects: []

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /api/production-runs/{id}/start"
        actor: PressOperator
        preconditions:
          - run.status == SCHEDULED
          - production_order.status in {RELEASED, IN_PROGRESS}
          - press.status == IDLE
          - die.status == ASSIGNED (die must be installed on this press via a completed DieChangeEvent)
          - coil.status == APPROVED
          - coil.material_spec == part.material_spec and coil.thickness_mm == part.thickness_mm
          - coil.remaining_weight_kg >= estimated steel consumption for the run
        side_effects:
          - press.status := RUNNING
          - production_order.status := IN_PROGRESS if it was RELEASED
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /api/production-runs/{id}/complete"
        actor: PressOperator
        preconditions:
          - run.status == RUNNING
        side_effects:
          - press.status := IDLE
          - good_count := shots_recorded - reject_count (reject_count is the sum of RejectEvent.quantity for the run)
          - steel_consumed_kg := good_count * Part.steel_content_kg (approved strip layout gross weight), precision 3 decimals round_half_up
          - coil.remaining_weight_kg decremented by steel_consumed_kg (3 decimals round_half_up); if that reaches exactly 0 the coil auto-transitions APPROVED -> DEPLETED
          - order.quantity_produced_good += good_count; order.quantity_scrapped += reject_count
          - die.total_shots_lifetime += shots_recorded; die.shots_since_repair += shots_recorded
      - from: RUNNING
        to: ABORTED
        trigger: "POST /api/production-runs/{id}/abort or system cascade (die repair pull, coil quarantine)"
        actor: PressOperator
        preconditions:
          - run.status == RUNNING
        side_effects:
          - press.status := IDLE
          - good_count preserved as counted so far; steel consumed so far is NOT decremented from the coil (scrap-in-place)
          - if no other run for the order remains in SCHEDULED or RUNNING, order reverts IN_PROGRESS -> RELEASED
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /api/production-runs/{id}/abort or system cascade"
        actor: PressOperator
        preconditions:
          - run.status == SCHEDULED
        side_effects:
          - no press or coil side effects (run never started)

  - entity: OutsideProcessingOrder
    initial_state: SENT
    terminal_states: [CLOSED]
    transitions:
      - from: SENT
        to: PARTIAL_RETURN
        trigger: "POST /api/outside-processing-orders/{id}/receive-return with quantity_returned_good + quantity_returned_scrap < quantity_sent"
        actor: ShippingClerk
        preconditions:
          - op.status in {SENT, PARTIAL_RETURN}
          - cumulative returns after this receipt <= quantity_sent
        side_effects:
          - quantity_returned_good and quantity_returned_scrap accumulate
      - from: PARTIAL_RETURN
        to: PARTIAL_RETURN
        trigger: "POST /api/outside-processing-orders/{id}/receive-return (partial again)"
        actor: ShippingClerk
        preconditions:
          - cumulative returns after this receipt <= quantity_sent
        side_effects:
          - quantity_returned_good and quantity_returned_scrap accumulate
      - from: SENT
        to: CLOSED
        trigger: "POST /api/outside-processing-orders/{id}/receive-return with cumulative returns == quantity_sent, or POST /api/outside-processing-orders/{id}/close-short"
        actor: ShippingClerk
        preconditions:
          - for close-short: order.status == COMPLETED and a written shortage acknowledgment is attached
        side_effects:
          - parent ProductionOrder.quantity_scrapped += (quantity_sent - quantity_returned_good - quantity_returned_scrap) on close-short

  - entity: PPAPSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/ppap-submissions/{id}/begin-review"
        actor: QualityEngineer
        preconditions:
          - submission.status == SUBMITTED
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/ppap-submissions/{id}/approve"
        actor: QualityEngineer
        preconditions:
          - submission.status == UNDER_REVIEW
          - the acting QualityEngineer is NOT the same user who created the submission (segregation of duties)
        side_effects:
          - every PartDieAssignment for the part has qualified := true
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/ppap-submissions/{id}/reject"
        actor: QualityEngineer
        preconditions:
          - submission.status == UNDER_REVIEW
          - rejection_reason provided
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/ppap-submissions (new submission for the same part increments submission_revision) — cycle for resubmission"
        actor: ProcessEngineer
        preconditions:
          - the previous submission for the part is in REJECTED
        side_effects:
          - submission_revision := previous max revision + 1

  - entity: LayeredAudit
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /api/layered-audits/{id}/record with result PASS"
        actor: QualityEngineer
        preconditions:
          - audit.status == PENDING
          - the recording user did not create the audit (segregation of duties)
        side_effects: []
      - from: PENDING
        to: FAIL
        trigger: "POST /api/layered-audits/{id}/record with result FAIL"
        actor: QualityEngineer
        preconditions:
          - audit.status == PENDING
          - the recording user did not create the audit
          - findings_count >= 1 when result == FAIL
        side_effects:
          - a new LayeredAudit at tier (audit_tier + 1) is auto-created for the same press with escalated_from_id := this audit id, unless audit_tier == 3
          - when a tier-3 audit FAILs: every SteelCoil whose heat_lot_number was consumed by runs on this press (runs with status in {COMPLETED, RUNNING} within the audit window) transitions APPROVED -> QUARANTINED, cascading to run abortion and order reversion (heat-lot traceability cascade)

concurrency_rules:
  - rule_id: strip-layout-approve-stale-part
    parent_entity: Part
    write_endpoint: "POST /api/strip-layouts/{id}/approve"
    occ_field: "expected_part_version"
    description: |
      Approving a StripLayout against a Part whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just approved a competing layout revision for the
      same part (which legitimately supersedes the prior APPROVED layout) and
      the current writer's view of the part is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-complete-stale-coil
    parent_entity: SteelCoil
    write_endpoint: "POST /api/production-runs/{id}/complete"
    occ_field: "expected_coil_version"
    description: |
      Completing a ProductionRun against a SteelCoil whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just completed a different run on the same coil
      (which legitimately decremented remaining_weight_kg and advanced the coil
      version) and the current writer's consumption decision is therefore based
      on a stale view of the coil ledger. The completing run's own state is
      validly RUNNING — only the coil version check rejects the write.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: scrap_rate_actual_vs_standard
    trigger: "on ProductionRun completion (for the run) and on ProductionOrder completion (aggregate)"
    algorithm: aggregation
    formula: |
      standard_scrap_rate = (gross_weight_per_part_kg - part.net_weight_kg) / gross_weight_per_part_kg
        using the APPROVED StripLayout for the part at run start
      actual_scrap_rate = reject_count / shots_recorded
        where reject_count = sum of RejectEvent.quantity for the run
      scrap_variance = actual_scrap_rate - standard_scrap_rate
      if shots_recorded == 0: actual_scrap_rate is undefined -> completion is rejected with ERR_NO_SHOTS_RECORDED
    input_set: "RejectEvent rows for the run; APPROVED StripLayout for the part (status == APPROVED at run start); Part.net_weight_kg"
    precision: "6 decimal places, round_half_up, computed as exact rational then rounded once at the end"
    variants:
      - name: engineering_standard
        when: "baseline from the strip layout's geometry"
        difference: "uses gross vs net weight; independent of sensed rejects"
      - name: sensed_actual
        when: "measured from in-die sensors"
        difference: "uses reject_count / shots_recorded; depends on RejectEvent rows"

  - name: smed_variance
    trigger: "on DieChangeEvent completion"
    algorithm: aggregation
    formula: |
      actual_minutes = floor((actual_end - actual_start) / 60)   # whole minutes, truncated
      variance_minutes = actual_minutes - smed_target_minutes
    input_set: "the DieChangeEvent being completed"
    precision: "integer minutes; floor truncation of seconds"
    variants:
      - name: per_event_variance
        when: "single changeover"
        difference: "integer minute truncation per event"
      - name: rolling_average_variance
        when: "GET /api/presses/{id}/smed-performance computed read"
        difference: "arithmetic mean of per-event variance_minutes over the last N COMPLETED events (N = min(10, count)) ordered by actual_end DESC, tie-break created_at ASC; rounded to 2 decimals round_half_up — averaging truncated integers differs from truncating the average interval"

  - name: steel_index_price_adjustment
    trigger: "on ProductionOrder close (writes PriceAdjustment)"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is pinned: index_delta -> pass_through -> material_term -> price -> rounding
      index_delta = applied_index_value - customer.base_index_value           # USD per ton
      pass_through_usd_per_ton = index_delta * customer.pass_through_pct      # may be negative
      material_term_cents = pass_through_usd_per_ton * part.steel_content_kg * 100 / 1000
      # round the material term FIRST (per-part rounding), then add to base price
      material_term_cents_rounded = round_half_up(material_term_cents, 0)
      adjusted_piece_price_cents = part.base_piece_price_cents + material_term_cents_rounded
      floor: adjusted_piece_price_cents >= 1 (ERR_PRICE_FLOOR_BREACH otherwise)
      applied_index_value selection:
        variant RELEASE_LOCKED: production_order.steel_index_at_release
        variant SHIPMENT_SPOT: latest IndexPublication.value_usd_per_ton for the customer's
          steel_index_basis with published_at <= close timestamp
          (selector: max published_at; tie-break: earliest created_at ASC)
    input_set: "ProductionOrder, its Part, the Customer, IndexPublication rows for customer.steel_index_basis"
    constants:
      FLOOR_PIECE_PRICE_CENTS: 1
    precision: "material term rounded to whole cents (0 decimals) round_half_up BEFORE addition; final price is integer cents"
    variants:
      - name: release_locked
        when: "order.pricing_variant == RELEASE_LOCKED (default)"
        difference: "index pinned at release time; spot movement after release has no effect"
      - name: shipment_spot
        when: "order.pricing_variant == SHIPMENT_SPOT"
        difference: "index read at close time; identical order data yields a different adjusted price whenever the index moved between release and close"

  - name: coil_consumption_reconciliation
    trigger: "on ProductionRun completion"
    algorithm: waterfall_allocation
    formula: |
      # coil.remaining_weight_kg is a conserved ledger quantity
      steel_consumed_kg = good_count * part.steel_content_kg
      coil.remaining_weight_kg_new = coil.remaining_weight_kg - steel_consumed_kg
      if coil.remaining_weight_kg_new < 0: reject completion with ERR_COIL_WEIGHT_EXCEEDED
      if coil.remaining_weight_kg_new == 0: coil transitions APPROVED -> DEPLETED
    input_set: "the completing run, its coil, the part's steel_content_kg"
    precision: "3 decimal places, round_half_up"

  - name: heat_lot_exposure_rollup
    trigger: "on tier-3 LayeredAudit FAIL (quarantine cascade) and for GET /api/heat-lots/{heat_lot_number}/exposure computed read"
    algorithm: aggregation
    formula: |
      exposure_kg = sum over SteelCoil c where c.heat_lot_number == :heat_lot
                    and c.status in {APPROVED, ON_HOLD, QUARANTINED}
                    of c.remaining_weight_kg
      affected_orders = distinct ProductionRun.production_order_id where
                    run.coil_id in (coils of that heat_lot) and run.status in {SCHEDULED, RUNNING, COMPLETED}
    input_set: "SteelCoil rows filtered by heat_lot_number and status in {APPROVED, ON_HOLD, QUARANTINED}; ProductionRun rows referencing those coils"
    precision: "3 decimal places, round_half_up"

  - name: reject_count_aggregation
    trigger: "continuously during a RUNNING ProductionRun; finalized at completion"
    algorithm: aggregation
    formula: |
      reject_count = sum of RejectEvent.quantity for production_run_id == run.id
      good_count = shots_recorded - reject_count
      invariant: good_count >= 0, else completion rejected with ERR_REJECT_COUNT_EXCEEDS_SHOTS
    input_set: "RejectEvent rows for the run only (no cross-run leakage)"
    precision: "integer"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for all non-Anonymous calls"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /api/_clock/set_current_utc when called without a session is still denied — every endpoint requires headers"
  - priority: 2
    category: auth
    check: "Role permitted for the target endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (customer, part, die, press, coil, order, run, event, audit, layout, submission, outside-processing order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource state-machine precondition for the requested action holds (e.g. run must be RUNNING to complete, coil must be APPROVED to start a run)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Quality/compliance gates: coil quarantined (heat-lot defect) blocks any run start; die over repair threshold blocks scheduling; segregation-of-duties on PPAP approval and audit recording"
    error_id: ERR_QUALITY_HOLD
    http_status: 422
    applies_to: "run start, die-change start, die scheduling, PPAP approve, audit record"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the acting user must not be the creator of the PPAP submission / layered audit being dispositioned"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /api/ppap-submissions/{id}/approve, POST /api/ppap-submissions/{id}/reject, POST /api/layered-audits/{id}/record"
  - priority: 7
    category: business_constraint
    check: "Physical fit: press.tonnage >= die.rated_tonnage and press.bed_width_mm >= die.min_bed_width_mm at die-change start and at run start"
    error_id: ERR_PRESS_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/die-change-events/{id}/start, POST /api/production-runs"
  - priority: 8
    category: business_constraint
    check: "Material compatibility: coil.material_spec == part.material_spec and coil.thickness_mm == part.thickness_mm"
    error_id: ERR_MATERIAL_MISMATCH
    http_status: 422
    applies_to: "POST /api/production-runs, POST /api/production-runs/{id}/start"
  - priority: 9
    category: business_temporal
    check: "No temporal overlap on a press: a new ProductionRun's [scheduled_start, scheduled_end) must not overlap any existing SCHEDULED or RUNNING run on the same press (half-open: back-to-back allowed)"
    error_id: ERR_PRESS_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /api/production-runs"
  - priority: 10
    category: business_temporal
    check: "No temporal overlap on a press for changeovers INCLUDING a 30-minute teardown buffer: a new DieChangeEvent's [planned_start, planned_end + 30min) must not overlap any PLANNED or IN_PROGRESS changeover on the same press, nor any SCHEDULED/RUNNING ProductionRun window on that press"
    error_id: ERR_CHANGEOVER_CONFLICT
    http_status: 409
    applies_to: "POST /api/die-change-events"
  - priority: 11
    category: business_constraint
    check: "PPAP level match: submission.level == part.ppap_required_level; control_plan_attached required when level >= 2"
    error_id: ERR_PPAP_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /api/ppap-submissions"
  - priority: 12
    category: business_referential
    check: "Order release gates: qualified PartDieAssignment exists, APPROVED StripLayout exists, APPROVED PPAPSubmission exists, customer active"
    error_id: ERR_RELEASE_GATE_UNMET
    http_status: 422
    applies_to: "POST /api/production-orders/{id}/release"
  - priority: 13
    category: business_fiscal
    check: "Coil weight sufficiency: coil.remaining_weight_kg >= estimated consumption (quantity planned * steel_content_kg) at run creation and start"
    error_id: ERR_COIL_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/production-runs, POST /api/production-runs/{id}/complete"
  - priority: 14
    category: business_fiscal
    check: "Adjusted piece price floor: adjusted_piece_price_cents >= 1 at order close"
    error_id: ERR_PRICE_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /api/production-orders/{id}/close"
  - priority: 15
    category: business_constraint
    check: "Uniqueness: customer_code, die_code, press_code, coil_number, (customer_id, part_number) unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 16
    category: business_constraint
    check: "Field shape: required fields present, enums valid, datetimes ISO 8601, numerics positive where declared, planned_end > planned_start, scheduled_end > scheduled_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server's logical UTC time. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced"]

  - method: POST
    path: "/api/index-publications"
    description: "Publish a steel index value"
    roles: [PlantAdmin]
    code: 201
    input: [index_code, published_at, value_usd_per_ton]
    output: IndexPublication
    side_effects: []
  - method: GET
    path: "/api/index-publications"
    description: "List index publications"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst]
    code: 200
    input: ["index_code?", "limit?", "offset?"]
    output: IndexPublication[]
    side_effects: []

  - method: POST
    path: "/api/customers"
    description: "Create customer"
    roles: [PlantAdmin]
    code: 201
    input: [name, customer_code, steel_index_basis, base_index_value, pass_through_pct, "active?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers"
    description: "List customers"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: GET
    path: "/api/customers/{id}"
    description: "Get customer"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers/{id}/parts"
    description: "List parts of a customer (FK reverse reachability)"
    roles: [PlantAdmin, ProductionPlanner, CostAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Part[]
    side_effects: []

  - method: POST
    path: "/api/parts"
    description: "Create part"
    roles: [ProcessEngineer]
    code: 201
    input: [customer_id, part_number, material_spec, thickness_mm, net_weight_kg, base_piece_price_cents, ppap_required_level]
    output: Part
    side_effects: []
  - method: GET
    path: "/api/parts"
    description: "List parts"
    roles: [PlantAdmin, ProcessEngineer, ProductionPlanner, QualityEngineer, CostAnalyst]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Part[]
    side_effects: []
  - method: GET
    path: "/api/parts/{id}"
    description: "Get part"
    roles: [PlantAdmin, ProcessEngineer, ProductionPlanner, QualityEngineer, CostAnalyst]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: GET
    path: "/api/parts/{id}/strip-layouts"
    description: "List strip layouts for a part"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StripLayout[]
    side_effects: []
  - method: GET
    path: "/api/parts/{id}/ppap-submissions"
    description: "List PPAP submissions for a part"
    roles: [PlantAdmin, ProcessEngineer, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: PPAPSubmission[]
    side_effects: []
  - method: GET
    path: "/api/parts/{id}/die-assignments"
    description: "List die assignments for a part"
    roles: [PlantAdmin, ProcessEngineer, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: PartDieAssignment[]
    side_effects: []

  - method: POST
    path: "/api/dies"
    description: "Create die"
    roles: [ToolroomManager]
    code: 201
    input: [die_code, die_type, total_stations, rated_tonnage, min_bed_width_mm, repair_threshold_shots]
    output: Die
    side_effects: []
  - method: GET
    path: "/api/dies"
    description: "List dies"
    roles: [PlantAdmin, ToolroomManager, SetupLead, ProductionPlanner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Die[]
    side_effects: []
  - method: GET
    path: "/api/dies/{id}"
    description: "Get die"
    roles: [PlantAdmin, ToolroomManager, SetupLead, ProductionPlanner]
