            - "Personnel.${tech_id}.qualification_status == QUALIFIED"
            - "Personnel.${tech_id}.last_qualification_review_at == \"2026-08-01T00:00:00Z\""
            - "GET /personnel/${tech_id}/credits returns total_count == 3"

      - name: waiver_threshold_alone_decides_between_a_waived_and_a_billed_share
        claim_type: correct_result
        grounds:
          - calculations.supplemental_coverage_determination
          - entities.SupplementalScreeningOrder.fields.coverage_tier
        distinguishing_aspect: "Two ULTRASOUND orders produce byte-identical arithmetic — allowed 31500, TIER_1, computed cover 19373, residual 12127 — and diverge only at step 9: under MA's 5000-cent waiver the residual survives as COVERED_WITH_COST_SHARE, under RI's 15000-cent waiver it is absorbed and the order becomes COVERED_NO_COST_SHARE while still carrying coverage_tier TIER_1, which proves the tier is chosen before the mandate is applied."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT (home), MA and RI policies exist; one facility; one DBT_3D unit; qualified staff."
            - "Two SCREENING exams interpreted BI-RADS 1 with density C, one for an MA patient and one for an RI patient, each with a RECOMMENDED ULTRASOUND supplemental order."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_pol_ma
            - call: "POST /state-policies"
              payload: { state_code: "RI", density_notice_rule: "STATE_DENSE_ONLY", lay_summary_max_reading_grade: 6, lay_summary_deadline_days: 14, supplemental_coverage_mandate: "COVERAGE_WITH_COST_SHARING", required_notice_codes: ["RI-DENSE-NOTICE"], supplemental_cost_share_waiver_threshold_cents: 15000, followup_grace_days: 60, report_turnaround_days: 30, urgent_report_turnaround_days: 7, ce_grace_days: 90 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { pol_ri_id: $.data.id }
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-WV-MA", patient_state_code: "MA", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { wv_ma_exam_id: $.data.id }
            - call: "POST /exams/${wv_ma_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${wv_ma_exam_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense tissue, MA patient" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { wv_ma_order_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-WV-RI", patient_state_code: "RI", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { wv_ri_exam_id: $.data.id }
            - call: "POST /exams/${wv_ri_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${wv_ri_exam_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense tissue, RI patient" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { wv_ri_order_id: $.data.id }
          trigger:
            - call: "POST /supplemental-orders/${wv_ma_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${wv_ri_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "MA order — coverage_outcome == COVERED_WITH_COST_SHARE, allowed_amount_cents == 31500, covered_amount_cents == 19373, patient_responsibility_cents == 12127, coverage_tier == TIER_1, governing_state_code == \"MA\""
            - "RI order — coverage_outcome == COVERED_NO_COST_SHARE, allowed_amount_cents == 31500, covered_amount_cents == 31500, patient_responsibility_cents == 0, coverage_tier == TIER_1, governing_state_code == \"RI\""
            - "Both orders — allowed_amount_cents == 28500 + 3000, and 31500 <= TIER_1_MAX_CENTS shows the ceiling is inclusive"
            - "Both orders — covered_amount_cents + patient_responsibility_cents == allowed_amount_cents"
            - "Both orders — status == COVERAGE_DETERMINED and version incremented from 1 to 2"
            - "round_half_up(31500 * 0.615) == round_half_up(19372.5) == 19373, not 19372 — half-up, not half-even"

      - name: non_dense_and_no_mandate_determinations_skip_the_admin_fee_and_the_tier
        claim_type: correct_result
        grounds:
          - calculations.supplemental_coverage_determination
        distinguishing_aspect: "The two early exits of the ten-step ladder return the bare fee-schedule amount with no ADMIN_FEE_CENTS and coverage_tier null: a NONE-mandate state exits at step 3 as PATIENT_RESPONSIBILITY even though the breast is dense, and a non-dense patient in a no-cost-sharing state exits at step 4 as DENIED even though her state mandates coverage — so neither the 3000-cent admin fee nor a tier is ever recorded."
