      - name: volunteer_slots_required_zero_closes_roster_as_staffed_empty_set
        grounds:
          - state_machines[Meet].SCHEDULED_to_STAFFED
          - state_machines[Meet].SCHEDULED_to_UNDERSTAFFED
          - calculations.volunteer_credit_balance
          - entities.Meet.fields.understaffed_penalty_cents
          - endpoints[POST /swim-club/meets/{id}/close-roster]
        distinguishing_aspect: |
          The metric is VOLUNTEER CREDITS filled against volunteer_slots_required, and the
          boundary is the inclusive >= comparison at the degenerate end of the scale: required 0
          with an empty assignment set is STAFFED (0 >= 0), required 1 with exactly 1 credit is
          also STAFFED (equality is sufficient), and required 1 with 0 credits is UNDERSTAFFED
          with a 7500-cent penalty. The endpoint under test is
          POST /swim-club/meets/{id}/close-roster. Both the metric and the endpoint differ from
          guard_ratio_boundary_50_vs_51_bathers, which probes a bather-load ratio through a
          computed GET.
