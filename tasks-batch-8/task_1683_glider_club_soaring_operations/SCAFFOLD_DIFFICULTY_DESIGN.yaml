# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Glider Club & Soaring Operations
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tow_fee_provisional_vs_final_divergence
        grounds:
          - calculations.tow_fee_calculation
          - state_machines.Flight.IN_FLIGHT_to_LANDED
        distinguishing_aspect: |
          Dual-variant on the Flight entity domain: the provisional variant at
          posting ignores the included-tow quota and the soaring surcharge, so
          for identical flight data provisional_fee_cents and final_fee_cents
          differ by exactly the non-discounted surcharge (800 cents for a
          95-minute flight at 2500 ft on a 10%-discount tier).
        test_recipe:
          setup:
            - "STANDARD tier: dues 6000, tow_fee_discount_pct 0.10, included_tows_per_month 0, student_tier false"
            - "Member M (ACTIVE) on STANDARD; glider G AIRWORTHY; tow plane T AIRWORTHY; tow pilot TP; TowSlot SCHEDULED covering the takeoff instant with capacity 4"
            - "Reservation R (member M, glider G) CHECKED_OUT; logical clock at 2026-08-10T14:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "STANDARD", monthly_dues_cents: 6000, tow_fee_discount_pct: 0.10, included_tows_per_month: 0, student_tier: false }
              as: ClubAdmin
              captures: { tier_std: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Pilot One", tier_id: "${tier_std}" }
              as: ClubAdmin
              captures: { m_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Tow Pilot", tier_id: "${tier_std}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tp_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N100G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { g_id: $.data.id, g_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N200T", kind: "TOW_PLANE", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { t_id: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${t_id}", tow_pilot_id: "${tp_id}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T18:00:00Z", capacity: 4 }
              as: ClubAdmin
              captures: { slot_id: $.data.id, slot_ver: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${g_id}", member_id: "${m_id}", start_at: "2026-08-10T13:30:00Z", end_at: "2026-08-10T16:00:00Z", expected_aircraft_version: "${g_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${res_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${res_id}", tow_slot_id: "${slot_id}", release_altitude_ft: 2500, takeoff_at: "2026-08-10T14:05:00Z", expected_tow_slot_version: "${slot_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { fl_id: $.data.id }
            - call: "POST /soaring/flights/${fl_id}/land"
              payload: { landed_at: "2026-08-10T15:40:00Z" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Flight.${fl_id}.provisional_fee_cents == 3420  (round_half_up(3800 * 0.9))"
            - "Flight.${fl_id}.flight_minutes == 95"
            - "Flight.${fl_id}.final_fee_cents == 4220  (round_half_up(3800 * 0.9) = 3420, plus surcharge ceil((95-60)/30) = 2 blocks * 400 = 800)"
            - "Member.${m_id}.account_balance_cents == 4220  (provisional 3420 replaced by final 4220; net delta +800 after land)"

      - name: dues_forward_vs_prorated_divergence
        grounds:
          - calculations.monthly_dues_posting
          - entities.Member.fields.pending_dues_cents
        distinguishing_aspect: |
          Dual-variant on the Member account domain (different entity domain
          from the tow-fee instance): the forward variant posts full monthly
          dues, while the prorated variant blends old/new tier dues by day
          with asymmetric rounding (floor on the old-tier half, round_half_up
          on the new-tier half, change-day billed to the new tier). Moving
          from 5000-cent to 8000-cent tier on Aug 10 of a 31-day month yields
          7128 cents, not 8000 (forward) and not 7071 (naive even split).
        test_recipe:
          setup:
            - "BASIC tier dues 5000 cents; PREMIUM tier dues 8000 cents"
            - "Member M2 ACTIVE on BASIC; logical clock at 2026-08-10T09:00:00Z (day-of-month 10)"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "BASIC", monthly_dues_cents: 5000, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_basic: $.data.id }
            - call: "POST /soaring/tiers"
              payload: { tier_code: "PREMIUM", monthly_dues_cents: 8000, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_prem: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Switcher", tier_id: "${tier_basic}" }
              as: ClubAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/members/${m2_id}/tier"
              payload: { tier_id: "${tier_prem}" }
              as: ClubAdmin
            - call: "POST /soaring/ops-day/close"
              payload: {}
              as: ClubAdmin
          assert:
            - "immediately after tier change: Member.${m2_id}.pending_dues_cents == 7128  (floor(5000*9/31) = 1451 + round_half_up(8000*22/31) = 5677)"
            - "after ops-day close: Member.${m2_id}.account_balance_cents == 7128  (prorated pending swept INSTEAD of forward 8000)"
            - "after ops-day close: Member.${m2_id}.pending_dues_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tow_fee_final_tiered_quota_surcharge_composition
        grounds:
          - calculations.tow_fee_calculation
          - state_machines.Flight.IN_FLIGHT_to_LANDED
        distinguishing_aspect: |
          Mode (a) — formula with >= 3 inputs and non-linear interaction:
          altitude tier selection (4 branches), monthly included-tow quota
          gated on the flight's chronological position, tier discount, and a
          commenced-block surcharge that is deliberately NOT discounted.
          Instance: member's 3rd tow of the month on a tier with
          included_tows_per_month=2 and 25% discount, 4200 ft release,
          121-minute flight -> 4650 cents.
        test_recipe:
          setup:
            - "CLUB tier: dues 6000, discount 0.25, included_tows_per_month 2"
            - "Member M3 ACTIVE on CLUB with exactly 2 RECONCILED flights in August 2026 (quota exhausted by first two)"
            - "Third reservation CHECKED_OUT; tow slot capacity 6; clock 2026-08-20T15:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "CLUB", monthly_dues_cents: 6000, tow_fee_discount_pct: 0.25, included_tows_per_month: 2 }
              as: ClubAdmin
              captures: { tier_club: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Quota Pilot", tier_id: "${tier_club}" }
              as: ClubAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Tow Pilot", tier_id: "${tier_club}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tp3_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N300G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { g3_id: $.data.id, g3_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N301T", kind: "TOW_PLANE", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { t3_id: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${t3_id}", tow_pilot_id: "${tp3_id}", start_at: "2026-08-20T12:00:00Z", end_at: "2026-08-20T19:00:00Z", capacity: 6 }
              as: ClubAdmin
              captures: { slot3_id: $.data.id, slot3_v0: $.data.version }
            # --- burn the 2 included tows (flights 1 and 2, fully reconciled) ---
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${g3_id}", member_id: "${m3_id}", start_at: "2026-08-20T12:00:00Z", end_at: "2026-08-20T13:00:00Z", expected_aircraft_version: "${g3_ver}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { r31: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:05:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${r31}/checkout"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${r31}", tow_slot_id: "${slot3_id}", release_altitude_ft: 3000, takeoff_at: "2026-08-20T12:10:00Z", expected_tow_slot_version: "${slot3_v0}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { f31: $.data.id }
            - call: "POST /soaring/flights/${f31}/land"
              payload: { landed_at: "2026-08-20T12:40:00Z" }
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /soaring/flights/${f31}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tp3_id}"
            - call: "GET /soaring/aircraft/${g3_id}"
              as: ClubAdmin
              captures: { g3_ver2: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${g3_id}", member_id: "${m3_id}", start_at: "2026-08-20T13:00:00Z", end_at: "2026-08-20T14:00:00Z", expected_aircraft_version: "${g3_ver2}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { r32: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T13:05:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${r32}/checkout"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "GET /soaring/tow-slots/${slot3_id}"
              as: ClubAdmin
              captures: { slot3_v1: $.data.version }
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${r32}", tow_slot_id: "${slot3_id}", release_altitude_ft: 3000, takeoff_at: "2026-08-20T13:10:00Z", expected_tow_slot_version: "${slot3_v1}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { f32: $.data.id }
            - call: "POST /soaring/flights/${f32}/land"
              payload: { landed_at: "2026-08-20T13:40:00Z" }
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /soaring/flights/${f32}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tp3_id}"
            # --- third reservation for the measured flight ---
            - call: "GET /soaring/aircraft/${g3_id}"
              as: ClubAdmin
              captures: { g3_ver3: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${g3_id}", member_id: "${m3_id}", start_at: "2026-08-20T15:00:00Z", end_at: "2026-08-20T18:00:00Z", expected_aircraft_version: "${g3_ver3}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { r33: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T15:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${r33}/checkout"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "GET /soaring/tow-slots/${slot3_id}"
              as: ClubAdmin
              captures: { slot3_v2: $.data.version }
          trigger:
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${r33}", tow_slot_id: "${slot3_id}", release_altitude_ft: 4200, takeoff_at: "2026-08-20T15:10:00Z", expected_tow_slot_version: "${slot3_v2}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { f33: $.data.id }
            - call: "POST /soaring/flights/${f33}/land"
              payload: { landed_at: "2026-08-20T17:11:00Z" }
              as: Member
              as_user_id: "${m3_id}"
          assert:
            - "Flight.${f33}.flight_minutes == 121"
            - "Flight.${f33}.provisional_fee_cents == 3450  (round_half_up(4600 * 0.75); provisional ignores quota and surcharge)"
            - "Flight.${f31}.final_fee_cents == 0 and Flight.${f32}.final_fee_cents == 0  (tows 1-2 within included_tows_per_month = 2)"
            - "Flight.${f33}.final_fee_cents == 4650  (3rd tow > included 2 -> gross 4600; round_half_up(4600*0.75) = 3450; surcharge ceil((121-60)/30) = 3 blocks * 400 = 1200; 3450 + 1200 = 4650)"

      - name: retrieve_cost_split_rounding_order
        grounds:
          - calculations.retrieve_cost_split
          - entities.RetrieveRequest.fields.pilot_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different mode from
          the tow-fee instance): total cost is allocated to distance bands
          proportionally with round_half_up PER BAND first, then the pilot
          share applies round_half_up(0.5 * band2_cost), and the club share is
          the residual. At 75 km: total 14000, band1 9333, band2 4667, pilot
          9333 + 2334 = 11667, club 2333 — a sum-then-round pipeline yields a
          different cent for the pilot share.
        test_recipe:
          setup:
            - "Flight F4 RECONCILED for member M4 (PLAIN tier, no discount) — the cross-country flight that landed out"
            - "clock 2026-08-15T18:00:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "PLAIN", monthly_dues_cents: 5000, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_plain: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "XC Pilot", tier_id: "${tier_plain}" }
              as: ClubAdmin
              captures: { m4_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Tow Pilot", tier_id: "${tier_plain}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tp4_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N400G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { g4_id: $.data.id, g4_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N401T", kind: "TOW_PLANE", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { t4_id: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${t4_id}", tow_pilot_id: "${tp4_id}", start_at: "2026-08-15T12:00:00Z", end_at: "2026-08-15T18:00:00Z", capacity: 3 }
              as: ClubAdmin
              captures: { slot4_id: $.data.id, slot4_ver: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${g4_id}", member_id: "${m4_id}", start_at: "2026-08-15T12:30:00Z", end_at: "2026-08-15T17:00:00Z", expected_aircraft_version: "${g4_ver}" }
              as: Member
              as_user_id: "${m4_id}"
              captures: { r4: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:35:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${r4}/checkout"
              payload: {}
              as: Member
              as_user_id: "${m4_id}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${r4}", tow_slot_id: "${slot4_id}", release_altitude_ft: 2000, takeoff_at: "2026-08-15T12:40:00Z", expected_tow_slot_version: "${slot4_ver}" }
              as: Member
              as_user_id: "${m4_id}"
              captures: { f4: $.data.id }
            - call: "POST /soaring/flights/${f4}/land"
              payload: { landed_at: "2026-08-15T15:40:00Z" }
              as: Member
              as_user_id: "${m4_id}"
            - call: "POST /soaring/flights/${f4}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tp4_id}"
          trigger:
            - call: "POST /soaring/retrieves"
              payload: { flight_id: "${f4}", distance_km: 75 }
              as: Member
              as_user_id: "${m4_id}"
              captures: { ret4: $.data.id }
          assert:
            - "RetrieveRequest.${ret4}.pilot_share_cents == 11667  (total 5000 + 75*120 = 14000; band1 round_half_up(14000*50/75) = 9333; band2 round_half_up(14000*25/75) = 4667; pilot = 9333 + round_half_up(4667*0.5) = 9333 + 2334)"
            - "RetrieveRequest.${ret4}.club_share_cents == 2333  (14000 - 11667 residual conservation)"
            - "RetrieveRequest.${ret4}.pilot_share_cents + RetrieveRequest.${ret4}.club_share_cents == 14000"
            - "Flight.${f4}.retrieve_id == ${ret4}"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: student_progress_rework_cycle
        grounds:
          - state_machines.StudentProgress.PENDING_to_SIGNED_OFF
          - state_machines.StudentProgress.SIGNED_OFF_to_PENDING
          - state_machines.StudentProgress.SIGNED_OFF_to_VERIFIED
        distinguishing_aspect: |
          Cyclic machine on StudentProgress: PENDING -> SIGNED_OFF -> PENDING
          (return-for-rework) -> SIGNED_OFF -> VERIFIED; the loop is legal and
          signed_off_at must be cleared by the rework edge and restamped by
          the second signoff. Different entity from the DutyRosterSlot
          instance.
        test_recipe:
          setup:
            - "STUDENT tier (student_tier true); student STU ACTIVE; instructor INS ACTIVE is_instructor"
            - "StudentProgress record kind BADGE_A in PENDING"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "STUDENT", monthly_dues_cents: 3000, tow_fee_discount_pct: 0.0, included_tows_per_month: 0, student_tier: true }
              as: ClubAdmin
              captures: { tier_stu: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Student Pilot", tier_id: "${tier_stu}" }
              as: ClubAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "CFI-G", tier_id: "${tier_stu}", is_instructor: true }
              as: ClubAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /soaring/student-progress"
              payload: { student_id: "${stu_id}", instructor_id: "${ins_id}", kind: "BADGE_A" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /soaring/student-progress/${sp_id}/signoff"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /soaring/student-progress/${sp_id}/return-for-rework"
              payload: {}
              as: ClubAdmin
            - call: "POST /soaring/student-progress/${sp_id}/signoff"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /soaring/student-progress/${sp_id}/verify"
              payload: {}
              as: ClubAdmin
          assert:
            - "after rework: StudentProgress.${sp_id}.status == PENDING and signed_off_at == null"
            - "after second signoff: status == SIGNED_OFF and signed_off_at != null (re-stamped)"
            - "after verify: status == VERIFIED and Member.${stu_id}.badge_level == A"

      - name: duty_roster_swap_cycle_and_auto_terminal
        grounds:
          - state_machines.DutyRosterSlot.ASSIGNED_to_SWAP_PENDING
          - state_machines.DutyRosterSlot.SWAP_PENDING_to_ASSIGNED
          - state_machines.DutyRosterSlot.CONFIRMED_to_COMPLETED
          - state_machines.DutyRosterSlot.ASSIGNED_to_NO_SHOW
        distinguishing_aspect: |
          Branching-with-revert cycle on DutyRosterSlot (different entity from
          StudentProgress): ASSIGNED -> SWAP_PENDING -> ASSIGNED via decline is
          a no-exchange revert, while the accept branch exchanges member_ids
          on BOTH slots and returns both to ASSIGNED — divergent side-effect
          sets per branch; CONFIRMED -> COMPLETED fires only at the ops-day
          close epoch, while an unconfirmed past-date slot degrades to NO_SHOW
          with a fee.
        test_recipe:
          setup:
            - "members DA and DB ACTIVE on a zero-dues tier; slot S1 (duty 2026-08-12, member DA), slot S2 (duty 2026-08-13, member DB), both ASSIGNED"
            - "clock 2026-08-05T00:00:00Z (both dates in the future)"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "ZERODUES", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tier_d: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Duty A", tier_id: "${tier_d}" }
              as: ClubAdmin
              captures: { da_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Duty B", tier_id: "${tier_d}" }
              as: ClubAdmin
              captures: { db_id: $.data.id }
            - call: "POST /soaring/duty-roster"
              payload: { duty_date: "2026-08-12T00:00:00Z", member_id: "${da_id}" }
              as: ClubAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /soaring/duty-roster"
              payload: { duty_date: "2026-08-13T00:00:00Z", member_id: "${db_id}" }
              as: ClubAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /soaring/duty-roster/${s1_id}/propose-swap"
