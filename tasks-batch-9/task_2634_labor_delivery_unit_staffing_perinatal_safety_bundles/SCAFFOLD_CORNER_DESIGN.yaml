      - name: sod_5_and_sod_6_refuse_the_mobilized_surgeon_the_case_close_and_the_review_facilitator_the_certification
        claim_type: Segregation of duties
        grounds:
          - roles[ObstetricianAttending].segregation_of_duties[SOD-5 first step]
          - roles[PerinatalSafetyOfficer].segregation_of_duties[SOD-5 second step]
          - roles[PerinatalSafetyOfficer].segregation_of_duties[SOD-6 second step]
          - validations[priority=10]
          - validations[priority=16]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - errors[ERR_EMPTY_MEASURE_DENOMINATOR]
          - endpoints[POST /emergency-cesareans/{eventId}/close]
          - endpoints[POST /quality-measure-snapshots/{snapshotId}/certify]
          - endpoints[POST /obstetric-units/{unitId}/quality-measure-snapshots]
          - state_machines.EmergencyCesareanEvent
          - calculations.quality_measure_rates
        distinguishing_aspect: |
          These are the two SoD pairs whose disqualifying fact lives on a DIFFERENT row from the endpoint
          being called. SOD-5 reads mobilized_staff_ids, an array stamped in payload order two transitions
          earlier, so the check must scan a list and not compare a single actor column. SOD-6 is the only
          pair in the scaffold whose predicate is a JOIN: the certifier is disqualified by having
          facilitated a review whose ENCOUNTER delivered inside the snapshot's reporting window, so an
          implementation must walk snapshot -> cohort -> review -> facilitator. Both are proved to sit
          BELOW the priority-8 state guard and ABOVE the priority-16 reporting family: the case close only
          exposes the 403 once the newborn review is CLOSED (otherwise ERR_NEWBORN_REVIEW_OPEN answers
          first), and the certify probe answers 403 while the snapshot ALSO has an empty episiotomy
          denominator and an unclosed period, which is only visible because 10 precedes 16 — the follow-up
          call from a clean identity collects the 409 that was waiting underneath.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit, two LDR beds and one OR room. Four staff on ACTIVE
            shifts: rn_charge (RN, ADVANCED) on a CHARGE shift — the assessment interpreter, attached to
            the case by priority 12 — plus anes (ANESTHESIOLOGIST, or_circulating_qualified),
            tech (SURGICAL_TECH, or_circulating_qualified) and neo (NEONATAL_RESUSCITATOR) on TRIAGE
            shifts, which satisfies mobilize-team's composition rule without needing OR_STANDBY slots that
            priority 11.2 would refuse to activate on a drill-less unit. One NTSV encounter (parity 0,
            39 weeks, singleton vertex, no prior cesarean) holds LDR-01. A CATEGORY_III strip drives a
            CATEGORY_1_CRASH cesarean — the urgency class that bypasses the readiness gate — mobilized
            with [anes, tech, neo], incised 06:05 and delivered 06:08 with the clock at 06:10, so the
            event lands in REVIEW_PENDING and the encounter carries delivery_mode CESAREAN_PRIMARY with
            delivery_recorded_at 2026-08-01T06:08:00Z. A NewbornComplicationReview facilitated by fac
            (who has never held a CareAssignment anywhere) is then opened, scheduled, submitted and CLOSED
            by the bootstrap officer, which is what clears the priority-8 rung on the case close. No
            CareAssignment exists on the encounter at any point, so nothing but SoD can explain a refusal.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Cinderfell Point Womens Hospital LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
