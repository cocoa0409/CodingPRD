      - name: non_returnable_item_rejected_from_returns
        claim_type: violation_to_error
        grounds: ["errors[ERR_ITEM_NOT_RETURNABLE]", entities.Item.fields.item_class]
        distinguishing_aspect: "A fulfilled line of item_class NON_RETURNABLE cannot enter a return: creation fails with ERR_ITEM_NOT_RETURNABLE."
        test_recipe:
