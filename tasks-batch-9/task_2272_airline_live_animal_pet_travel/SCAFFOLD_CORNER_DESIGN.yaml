      - name: suspended_station_blocks_kennel_allocation_rejected
        claim_type: state_precondition
        grounds:
          - validations.priority_29
          - errors.ERR_STATION_SUSPENDED
        distinguishing_aspect: "Station suspension bars kennel provisioning as well as booking: the allocation is refused with 422 ERR_STATION_SUSPENDED even though the requested 2 bays sit well inside kennel_bay_count 4 and the optimistic-concurrency token is current."
