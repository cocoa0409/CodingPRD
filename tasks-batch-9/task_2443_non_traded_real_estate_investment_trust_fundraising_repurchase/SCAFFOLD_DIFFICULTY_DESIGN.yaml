              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Avery Nolan", email: "avery.nolan@example.com", state_code: "TX", net_worth_cents: 2000000000, annual_income_cents: 400000000 }
              as: SponsorOperator
              captures: { inv_a_id: $.data.id }
            - call: "POST /investors/${inv_a_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-A-2026-08" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Blake Ortiz", email: "blake.ortiz@example.com", state_code: "TX", net_worth_cents: 2000000000, annual_income_cents: 400000000 }
              as: SponsorOperator
              captures: { inv_b_id: $.data.id }
            - call: "POST /investors/${inv_b_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-B-2026-08" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Casey Rivera", email: "casey.rivera@example.com", state_code: "TX", net_worth_cents: 2000000000, annual_income_cents: 400000000 }
              as: SponsorOperator
              captures: { inv_c_id: $.data.id }
            - call: "POST /investors/${inv_c_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-C-2026-08" }
