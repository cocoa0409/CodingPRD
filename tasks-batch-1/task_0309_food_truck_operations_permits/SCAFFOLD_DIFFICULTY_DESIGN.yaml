  - rule_id: resource_temporal_overlap
    instances:
      - name: spot_capacity_overlap_with_buffer
        grounds:
          - validations[priority=11]
          - entities.Spot.fields.concurrent_capacity
          - entities.Spot.fields.buffer_minutes
          - errors[ERR_SPOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Spot interval semantics: buffer_minutes pads BOTH ends and aggregate capacity counts concurrent occupants; capacity 1 with 30-min buffer means a second booking whose raw window starts 20 min after the first's raw end still overlaps (within buffer) and is rejected — buffer-padded aggregate overlap."
        test_recipe:
          setup:
            - "A spot with concurrent_capacity=1 and buffer_minutes=30; two trucks each with an ACTIVE permit; truck A already holds a RESERVED booking 18:00-19:00."
          setup_api_calls:
