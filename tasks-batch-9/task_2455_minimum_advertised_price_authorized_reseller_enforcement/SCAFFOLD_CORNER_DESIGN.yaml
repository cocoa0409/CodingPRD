            - "Violation.${vio}.status == NOTICED"
            - "Violation.${vio}.assessed_floor_cents == 15000"
            - "Violation.${vio}.assessed_points == 3"
            - "Violation.${vio}.cure_deadline_at == '2026-08-30T00:00:00.000Z'"
            - "Reseller.${res}.violation_points_total == 3"

      - name: violation_noticed_to_cured_retains_points_and_satisfies_notice
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.NOTICED_to_CURED"]
        distinguishing_aspect: "A cure inside the window sets resolution_reason CURE_ACCEPTED and closes the notice as SATISFIED, but deliberately LEAVES the 3 assessed points in the reseller ledger."
        test_recipe:
          setup: ["Violation V1 NOTICED with cure_deadline_at 2026-08-30; clock still 2026-08-20T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
