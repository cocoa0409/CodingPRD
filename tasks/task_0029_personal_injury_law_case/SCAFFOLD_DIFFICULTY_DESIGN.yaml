  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval
  #          semantics on different resource entities
  #
  # Instance 1: CourtEvent overlap with 24-hour BUFFER, closed-on-both-ends.
  # Instance 2: MedicalRecordsRequest duplicate — UNBUFFERED identity overlap
  #             on (case_id, provider_id) when prior request is in
  #             {REQUESTED, RECEIVED}.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: court_event_hearing_within_24h_buffer_conflict
        grounds:
          - validations[priority=13]
          - errors[ERR_COURT_EVENT_CONFLICT]
          - entities.CourtEvent.fields.scheduled_at
          - entities.CourtEvent.fields.duration_minutes
        distinguishing_aspect: |
          CourtEvent uses BUFFERED-INTERVAL geometry: a new HEARING/TRIAL/MEDIATION on
          a case is rejected when [new.scheduled_at − 24h, new.scheduled_at +
          new.duration_minutes + 24h] intersects [existing.scheduled_at,
          existing.scheduled_at + existing.duration_minutes] (closed on both ends).
          Two HEARINGs scheduled 12 hours apart (well inside the 24h buffer) collide
          even though their raw [start,end] intervals are disjoint — buffer is the
          discriminator.
        test_recipe:
          setup:
            - "Active CA Case with one SCHEDULED HEARING on 2026-08-01T14:00:00Z (60 min)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Court Client", email: "court@example.com", phone: "555-1400" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /court-events"
              payload: { case_id: "${case_id}", event_type: "HEARING", scheduled_at: "2026-08-01T14:00:00Z", duration_minutes: 60 }
              as: Attorney
              captures: { event1_id: $.data.id }
          trigger:
            - call: "POST /court-events"
              payload: { case_id: "${case_id}", event_type: "HEARING", scheduled_at: "2026-08-02T02:00:00Z", duration_minutes: 60 }
              as: Attorney
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_COURT_EVENT_CONFLICT'"

      - name: duplicate_active_records_request_conflict
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_RECORDS_REQUEST]
          - entities.MedicalRecordsRequest.fields.status
        distinguishing_aspect: |
          MedicalRecordsRequest uses UNBUFFERED IDENTITY overlap geometry: a second
          request with the same (case_id, provider_id) is rejected as long as the
          existing request's status is in {REQUESTED, RECEIVED}, regardless of any
          time component (no `scheduled_at`, no buffer math). This is a different
          interval semantics — point overlap on identity tuple, not on a time
          interval — on a different resource entity from instance 1.
        test_recipe:
          setup:
            - "Active CA Case with one MedicalRecordsRequest on (case_id, provider_id) currently in REQUESTED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "MRR Dup", email: "mrrdup@example.com", phone: "555-1500" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Dup Hospital", contact: "dup@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr1_id: $.data.id }
          trigger:
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_DUPLICATE_RECORDS_REQUEST'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  #
  # Instance 1: settlement-money conservation (gross = fee + liens + net).
  # Instance 2: damages-aggregation consistency
  #             (Case.included_damages_total_cents reconciles before/after a
  #              PROPOSED→INCLUDED→EXCLUDED round-trip on a DamagesItem).
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: settlement_money_conservation_gross_equals_fee_plus_liens_plus_net
        grounds:
          - calculations.contingency_fee
          - calculations.net_to_client
          - calculations.lien_proportional_cap
          - entities.Case.fields.gross_settlement_cents
          - entities.Disbursement.fields.contingency_fee_cents
          - entities.Disbursement.fields.total_lien_payout_cents
          - entities.Disbursement.fields.net_to_client_cents
        distinguishing_aspect: |
          At Disbursement creation (caused by Case SETTLED), the invariant
          Case.gross_settlement_cents == Disbursement.contingency_fee_cents +
          Disbursement.total_lien_payout_cents + Disbursement.net_to_client_cents
          MUST hold exactly (integer cents, no drift). Even though there is no
          single "undo" endpoint, the forward action (accept settlement) and the
          conservation requirement together pin the money quantity. Conserved
          quantity: total settlement dollars in cents.
        test_recipe:
          setup:
            - "Same setup as Rule 2 instance 2 (net_to_client_evaluation_order_pinned): gross=6_000_000, pre-suit, lien=1_500_000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Inv1 Client", email: "inv1@example.com", phone: "555-1600" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Inv1 Hospital", contact: "i1@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 1000000 }
              as: Paralegal
              captures: { di_id: $.data.id }
            - call: "POST /damages-items/${di_id}/include"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_inv1"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_inv1"
            - call: "POST /medical-liens"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}", asserted_amount_cents: 1500000 }
              as: Paralegal
              captures: { lien_id: $.data.id }
            - call: "POST /settlement-offers"
              payload: { case_id: "${case_id}", offer_amount_cents: 6000000, by_party: "CARRIER" }
              as: Attorney
              captures: { offer_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Attorney
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /settlement-offers/${offer_id}/accept"
              payload: { expected_case_version: "${case_v}" }
              as: ManagingPartner
          assert:
            - "Case.${case_id}.gross_settlement_cents == 6000000"
            - "Disbursement for case ${case_id}.contingency_fee_cents == 1999800"
            - "Disbursement for case ${case_id}.total_lien_payout_cents == 1500000"
            - "Disbursement for case ${case_id}.net_to_client_cents == 2500200"
            - "Disbursement.contingency_fee_cents + Disbursement.total_lien_payout_cents + Disbursement.net_to_client_cents == Case.gross_settlement_cents (6000000)"

      - name: damages_total_round_trip_proposed_included_excluded_zero_drift
        grounds:
          - calculations.gross_damages_model
          - entities.Case.fields.included_damages_total_cents
          - state_machines.DamagesItem.PROPOSED_to_INCLUDED
          - state_machines.DamagesItem.INCLUDED_to_EXCLUDED
        distinguishing_aspect: |
          Case.included_damages_total_cents is a denormalized sum over DamagesItem
          rows in status==INCLUDED. The compensating-invariant requirement is that
          a forward action (PROPOSED→INCLUDED) followed by its compensating action
          (INCLUDED→EXCLUDED) leaves Case.included_damages_total_cents at its
          pre-include value — zero drift. Distinct conserved quantity from instance 1
          (denormalized damages aggregate vs settlement money distribution).
          Pre-state: total = 500_000 (one previously included item). Round-trip an
          additional 300_000 item PROPOSED→INCLUDED→EXCLUDED; final total still
          500_000.
        test_recipe:
          setup:
            - "Active CA Case with one REVIEWED MedicalRecordsRequest; one INCLUDED DamagesItem MEDICAL_BILLS=500_000 already on the case so Case.included_damages_total_cents==500_000."
