            - "the rejected attempt fires no cascade: MapPanel.${p1_id}.revision_status == EFFECTIVE with .superseded_at == null"
            - "at clock 2027-04-28 the identical call returns 200 with MapPanel.${p2_id}.revision_status == EFFECTIVE and MapPanel.${p1_id}.superseded_at == 2027-04-28T00:00:00Z"

