              as: PlatformAdmin
            - call: "POST /interpreters"
              payload: { full_name: "Ana ASL", modalities_offered: ["ASL_ONSITE"], home_zip: "02139" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - call: "POST /interpreters/${i1}/certifications"
              payload: { credential: "RID_NIC", level: "CERTIFIED", issued_on: "2024-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cert1: $.data.id }
            - { call: "POST /interpreters/${i1}/certifications/${cert1}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /interpreters/${i1}/activate", payload: {}, as: PlatformAdmin }
            - call: "POST /interpreters/${i1}/availability-windows"
              payload: { start_at: "2026-06-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", modalities: ["ASL_ONSITE"] }
              as: Interpreter
              as_user_id: "${i1}"
            - call: "POST /requests"
              payload: { org_id: "${org1}", consumer_name: "Pat Patient", modality: "ASL_ONSITE", ada_context: "MEDICAL", scheduled_start: "2026-06-10T14:00:00Z", scheduled_end: "2026-06-10T16:30:00Z", onsite_address: "1 Main St", estimated_mileage: 10 }
