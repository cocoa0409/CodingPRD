              captures: { b_id: "$.data.id" }
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${a_id}", occurred_at: "2026-08-01T10:00:00.000Z", injury_severity: "MINOR", guest_count_affected: 1, narrative: "Guest reported a scraped knee at the exit ramp." }
              as: SafetyOfficer
