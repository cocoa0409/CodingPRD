            - "AlarmSite.${site_id}.outstanding_balance_cents is still 5500 and credit_balance_cents is still 0"
            - "a REDUCE of exactly 5500 is accepted, so the boundary is inclusive on the outstanding amount"

      - name: explicit_allocation_sum_below_the_payment_amount_is_rejected
