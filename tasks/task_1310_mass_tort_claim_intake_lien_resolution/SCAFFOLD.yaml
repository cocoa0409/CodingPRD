# =============================================================================
# Mass Tort Claim Intake & Lien Resolution — Scaffold Seed Tables
# =============================================================================

scenario: |
  Mass Tort Claim Intake & Lien Resolution (mass tort claims administrator):
  claimant intake & eligibility screening against criteria, medical record
  retrieval & injury verification, tier/matrix assignment for compensation,
  lien identification (Medicare/Medicaid/private) & holder notification,
  lien negotiation & final demand resolution, settlement allocation &
  disbursement with QSF, appeals & disputed tier decisions, closing
  statement & audit.

domain_name: mass-tort-claims
api_prefix: /settlement-programs

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on Claim.version for superseding tier/lien writes
    - cascading_side_effects        # appeal uphold → re-tier → recompute allocation → disbursement delta
    - dual_variant_calculation      # provisional vs final lien demand; per-line-then-sum vs sum-then-round attorney fee
    - derived_field_reconciliation  # claim.net_award_cents, qsf.remaining_balance_cents must reconcile after every lien/appeal event
    - scheduled_deferred_actions    # lien-holder response windows driven by logical clock
  entity_topology: hierarchical
  state_machine_shape: branching    # appeal cycle + linear pipeline + parallel dims on Claim
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # Appeal references both Claim and prior TierAssignment
  role_model: segregation_of_duties # IntakeSpecialist / RecordsAnalyst / LienAnalyst / DisbursementApprover / ProgramAdministrator
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SettlementProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code (e.g. MT-GLYPH-2026)" }
      - { name: tort_name, type: string, source: input, description: "Human-readable tort name" }
      - { name: current_utc, type: datetime, source: system, description: "Logical clock for this program; default 2026-08-01T00:00:00Z until advanced" }
      - { name: qsf_principal_cents, type: integer, source: input, description: "Total Qualified Settlement Fund principal (cents)" }
      - { name: qsf_remaining_cents, type: integer, source: computed, description: "= qsf_principal_cents - sum(disbursed_cents over Disbursement in state RELEASED)" }
      - { name: matrix_published, type: boolean, source: computed, default: false, description: "True once at least one TierMatrix row exists in state PUBLISHED" }

  - name: Claimant
    parent: SettlementProgram
    common_fields: true
    fields:
      - { name: settlement_program_id, type: string, source: system, description: "FK -> SettlementProgram.id; owning program" }
      - { name: full_name, type: string, source: input, description: "Claimant full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 digits of SSN; exactly 4 numeric chars" }
      - { name: date_of_exposure_start, type: string, source: input, description: "ISO 8601 date of first exposure" }
      - { name: date_of_exposure_end, type: string, source: input, description: "ISO 8601 date of last exposure" }
      - { name: date_of_diagnosis, type: string, source: input, description: "ISO 8601 date of qualifying injury diagnosis" }
      - { name: injury_category, type: enum, source: input, description: "QUALIFYING_CAT_A | QUALIFYING_CAT_B | NON_QUALIFYING" }
      - { name: represented_by_counsel, type: boolean, source: input, description: "True if claimant has counsel; affects attorney fee calc" }
      - { name: duplicate_of_claimant_id, type: string, source: system, description: "FK -> Claimant.id; set when marked duplicate, else null", default: null }

  - name: Claim
    parent: SettlementProgram
    common_fields: true
    fields:
      - { name: settlement_program_id, type: string, source: system, description: "FK -> SettlementProgram.id; owning program" }
      - { name: claimant_id, type: string, source: system, description: "FK -> Claimant.id; the claimant this claim belongs to" }
      - { name: claim_number, type: string, source: system, description: "Server-minted human-readable claim number CLM-####" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ELIGIBILITY_PASSED | RECORDS_PENDING | INJURY_VERIFIED | TIER_ASSIGNED | LIENS_PENDING | LIENS_RESOLVED | READY_FOR_DISBURSEMENT | DISBURSED | CLOSED | DENIED | WITHDRAWN" }
      - { name: eligibility_status, type: enum, source: system, description: "PENDING | PASSED | FAILED" , default: "PENDING"}
      - { name: injury_verification_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED", default: "PENDING" }
      - { name: lien_posture, type: enum, source: system, description: "NOT_STARTED | IDENTIFYING | NEGOTIATING | ALL_RESOLVED", default: "NOT_STARTED" }
      - { name: denied_reason, type: string, source: system, description: "Populated on DENIED transition", default: null }
      - { name: gross_award_cents, type: integer, source: computed, default: 0, description: "Set by tier_assignment calculation when TIER_ASSIGNED" }
      - { name: total_lien_cents, type: integer, source: computed, default: 0, description: "Sum of Lien.final_demand_cents for liens in state RESOLVED" }
      - { name: attorney_fee_cents, type: integer, source: computed, default: 0, description: "Computed by attorney_fee calculation" }
      - { name: net_award_cents, type: integer, source: computed, default: 0, description: "= gross_award_cents - total_lien_cents - attorney_fee_cents; floor 0" }
      - { name: qsf_reservation_cents, type: integer, source: computed, default: 0, description: "Amount reserved from QSF when claim transitions to READY_FOR_DISBURSEMENT; equals net_award_cents at reservation time" }
      - { name: active_appeal_id, type: string, source: system, description: "FK -> Appeal.id; non-null while an appeal is open", default: null }

  - name: TierMatrix
    parent: SettlementProgram
    common_fields: true
    fields:
      - { name: settlement_program_id, type: string, source: system, description: "FK -> SettlementProgram.id; owning program" }
      - { name: injury_category, type: enum, source: input, description: "QUALIFYING_CAT_A | QUALIFYING_CAT_B" }
      - { name: severity_score_min, type: integer, source: input, description: "Inclusive lower bound of severity_score" }
      - { name: severity_score_max, type: integer, source: input, description: "Inclusive upper bound of severity_score" }
      - { name: base_award_cents, type: integer, source: input, description: "Gross award when claim lands in this matrix cell" }
      - { name: matrix_state, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", default: "DRAFT" }

  - name: MedicalRecord
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: provider_name, type: string, source: input, description: "Treating provider" }
      - { name: record_type, type: enum, source: input, description: "DIAGNOSTIC | TREATMENT | PHARMACY | HOSPITALIZATION" }
      - { name: received_at, type: datetime, source: system, description: "Server-stamped time record was uploaded" }
      - { name: severity_score, type: integer, source: input, description: "0..100 severity score from reviewer" }
      - { name: confirms_qualifying_injury, type: boolean, source: input, description: "Reviewer assertion" }
      - { name: review_state, type: enum, source: system, description: "PENDING_REVIEW | ACCEPTED | REJECTED", default: "PENDING_REVIEW" }

  - name: Lien
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: lien_type, type: enum, source: input, description: "MEDICARE | MEDICAID | PRIVATE_INSURER | MEDICAL_PROVIDER | VA_TRICARE" }
      - { name: holder_name, type: string, source: input, description: "Lien holder organization" }
      - { name: asserted_amount_cents, type: integer, source: input, description: "Initial amount asserted by holder" }
      - { name: provisional_demand_cents, type: integer, source: computed, description: "Computed from provisional formula at NOTIFIED transition" }
      - { name: final_demand_cents, type: integer, source: computed, description: "Final negotiated demand, written at RESOLVED transition" }
      - { name: holder_response_due_at, type: datetime, source: computed, description: "Program.current_utc + 30 days, set when state -> NOTIFIED" }
      - { name: resolution_notes, type: string, source: input, description: "Analyst notes on negotiation", default: null }
      - { name: state, type: enum, source: system, description: "IDENTIFIED | NOTIFIED | IN_NEGOTIATION | RESOLVED | WAIVED | DISPUTED" }

  - name: Appeal
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: appealed_tier_matrix_id, type: string, source: input, description: "FK -> TierMatrix.id; the matrix row claimant is disputing" }
      - { name: requested_tier_matrix_id, type: string, source: input, description: "FK -> TierMatrix.id; the matrix row claimant wants" }
      - { name: grounds, type: string, source: input, description: "Free-text grounds, min 20 chars" }
      - { name: state, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | DENIED | WITHDRAWN" }
      - { name: resolution_rationale, type: string, source: system, description: "Written on UPHELD/DENIED", default: null }

  - name: Disbursement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: payee_name, type: string, source: input, description: "Who the check is made out to" }
      - { name: payee_role, type: enum, source: input, description: "CLAIMANT | ATTORNEY | LIEN_HOLDER" }
      - { name: amount_cents, type: integer, source: computed, description: "Per allocation waterfall; never edited by hand" }
      - { name: state, type: enum, source: system, description: "PENDING | APPROVED | RELEASED | VOIDED" }
      - { name: released_at, type: datetime, source: system, description: "Server-stamped on RELEASED", default: null }

  - name: ClosingStatement
    parent: Claim
    common_fields: false   # append-only artifact, no version/updated_at
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; owning claim" }
      - { name: gross_award_cents, type: integer, source: system, description: "Snapshot at closing" }
      - { name: total_lien_cents, type: integer, source: system, description: "Snapshot at closing" }
      - { name: attorney_fee_cents, type: integer, source: system, description: "Snapshot at closing" }
      - { name: net_award_cents, type: integer, source: system, description: "Snapshot at closing" }
      - { name: statement_body, type: string, source: system, description: "Rendered audit text" }
      - { name: sealed_at, type: datetime, source: system, description: "Server-stamped at sealing" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [CLOSED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ELIGIBILITY_PASSED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/screen-eligibility
        actor: IntakeSpecialist
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
          - "Claimant.date_of_exposure_start <= Claimant.date_of_diagnosis <= Claimant.date_of_exposure_end (ERR_ELIGIBILITY_DATE_ORDER)"
          - "Claimant.injury_category != NON_QUALIFYING (ERR_INELIGIBLE_INJURY)"
          - "No other Claim for same claimant_id with status not in {DENIED, WITHDRAWN, CLOSED} (ERR_DUPLICATE_ACTIVE_CLAIM)"
        side_effects:
          - "eligibility_status = PASSED"

      - from: SUBMITTED
        to: DENIED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/deny
        actor: IntakeSpecialist
        preconditions:
          - "Claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
          - "denied_reason must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "eligibility_status = FAILED"

      - from: ELIGIBILITY_PASSED
        to: RECORDS_PENDING
        trigger: POST /settlement-programs/{pid}/claims/{cid}/medical-records (first upload)
        actor: RecordsAnalyst
        preconditions:
          - "Claim.status == ELIGIBILITY_PASSED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "Creates MedicalRecord in PENDING_REVIEW"
          - "Claim.status -> RECORDS_PENDING"

      - from: RECORDS_PENDING
        to: INJURY_VERIFIED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/verify-injury
        actor: RecordsAnalyst
        preconditions:
          - "Claim.status == RECORDS_PENDING (ERR_CLAIM_INVALID_STATE)"
          - "At least 2 MedicalRecord rows with review_state == ACCEPTED (ERR_INSUFFICIENT_MEDICAL_RECORDS)"
          - "At least 1 ACCEPTED record with confirms_qualifying_injury == true (ERR_NO_QUALIFYING_RECORD)"
        side_effects:
          - "injury_verification_status = VERIFIED"

      - from: INJURY_VERIFIED
        to: TIER_ASSIGNED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/assign-tier
        actor: ProgramAdministrator
        preconditions:
          - "Claim.status == INJURY_VERIFIED (ERR_CLAIM_INVALID_STATE)"
          - "Program has at least one TierMatrix row in PUBLISHED state (ERR_NO_PUBLISHED_MATRIX)"
          - "Provided tier_matrix_id is in PUBLISHED state and belongs to this program (ERR_MATRIX_NOT_PUBLISHED)"
          - "Claimant.injury_category matches matrix.injury_category (ERR_MATRIX_CATEGORY_MISMATCH)"
          - "Selected severity_score (max severity_score across ACCEPTED records) falls inside [severity_score_min, severity_score_max] inclusive (ERR_SEVERITY_OUT_OF_RANGE)"
        side_effects:
          - "Run tier_assignment calculation -> sets gross_award_cents"
          - "Run attorney_fee calculation -> sets attorney_fee_cents"
          - "Recompute net_award_cents"
          - "Claim.lien_posture = IDENTIFYING"

      - from: TIER_ASSIGNED
        to: LIENS_PENDING
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens (first lien identified)
        actor: LienAnalyst
        preconditions:
          - "Claim.status == TIER_ASSIGNED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "Creates Lien in IDENTIFIED"
          - "Claim.status -> LIENS_PENDING"

      - from: LIENS_PENDING
        to: LIENS_RESOLVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/finalize-liens
        actor: LienAnalyst
        preconditions:
          - "Claim.status == LIENS_PENDING (ERR_CLAIM_INVALID_STATE)"
          - "Every Lien for this claim is in state RESOLVED or WAIVED (ERR_UNRESOLVED_LIENS_EXIST)"
          - "No open Appeal (active_appeal_id == null) (ERR_OPEN_APPEAL_BLOCKS_FINALIZE)"
        side_effects:
          - "Claim.lien_posture = ALL_RESOLVED"
          - "Recompute total_lien_cents from liens in state RESOLVED"
          - "Recompute net_award_cents"

      - from: LIENS_RESOLVED
        to: READY_FOR_DISBURSEMENT
        trigger: POST /settlement-programs/{pid}/claims/{cid}/prepare-disbursement
        actor: DisbursementApprover
        preconditions:
          - "Claim.status == LIENS_RESOLVED (ERR_CLAIM_INVALID_STATE)"
          - "net_award_cents >= 0 (ERR_NEGATIVE_NET_AWARD)"
          - "Program.qsf_remaining_cents >= net_award_cents (ERR_QSF_INSUFFICIENT_FUNDS)"
        side_effects:
          - "qsf_reservation_cents = net_award_cents"
          - "Run disbursement_allocation calculation -> create 1..3 Disbursement rows in PENDING (CLAIMANT always, plus ATTORNEY if represented_by_counsel, plus one per LIEN_HOLDER bucket grouped by payee)"
          - "Decrement program.qsf_remaining_cents by net_award_cents"

      - from: READY_FOR_DISBURSEMENT
        to: DISBURSED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/disbursements/{did}/release (last PENDING/APPROVED Disbursement released)
        actor: DisbursementApprover
        preconditions:
          - "All sibling Disbursements for this claim are in state RELEASED or VOIDED (ERR_DISBURSEMENTS_PENDING)"
        side_effects:
          - "Set released_at = program.current_utc on each RELEASED disbursement"

      - from: DISBURSED
        to: CLOSED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/close
        actor: ProgramAdministrator
        preconditions:
          - "Claim.status == DISBURSED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "Create ClosingStatement snapshot (immutable)"

      - from: TIER_ASSIGNED
        to: TIER_ASSIGNED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/appeals (appeal FILED -> re-tier review cycle)
        actor: ClaimantRole
        preconditions:
          - "Claim.status == TIER_ASSIGNED (ERR_CLAIM_INVALID_STATE)"
          - "active_appeal_id == null (ERR_APPEAL_ALREADY_OPEN)"
        side_effects:
          - "Creates Appeal in FILED"
          - "Claim.active_appeal_id = new appeal id"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /settlement-programs/{pid}/claims/{cid}/withdraw
        actor: ClaimantRole
        preconditions:
          - "Claim.status in {SUBMITTED, ELIGIBILITY_PASSED, RECORDS_PENDING, INJURY_VERIFIED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: ELIGIBILITY_PASSED
        to: WITHDRAWN
        trigger: POST /settlement-programs/{pid}/claims/{cid}/withdraw
        actor: ClaimantRole
        preconditions:
          - "Claim.status in {SUBMITTED, ELIGIBILITY_PASSED, RECORDS_PENDING, INJURY_VERIFIED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: RECORDS_PENDING
        to: WITHDRAWN
        trigger: POST /settlement-programs/{pid}/claims/{cid}/withdraw
        actor: ClaimantRole
        preconditions:
          - "Claim.status in {SUBMITTED, ELIGIBILITY_PASSED, RECORDS_PENDING, INJURY_VERIFIED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects: []

      - from: INJURY_VERIFIED
        to: WITHDRAWN
        trigger: POST /settlement-programs/{pid}/claims/{cid}/withdraw
        actor: ClaimantRole
        preconditions:
          - "Claim.status in {SUBMITTED, ELIGIBILITY_PASSED, RECORDS_PENDING, INJURY_VERIFIED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects: []

  - entity: MedicalRecord
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/medical-records/{rid}/accept
        actor: RecordsAnalyst
        preconditions:
          - "Claim.status == RECORDS_PENDING (ERR_CLAIM_INVALID_STATE)"
          - "MedicalRecord.review_state == PENDING_REVIEW (ERR_RECORD_ALREADY_REVIEWED)"
        side_effects: []

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/medical-records/{rid}/reject
        actor: RecordsAnalyst
        preconditions:
          - "Claim.status == RECORDS_PENDING (ERR_CLAIM_INVALID_STATE)"
          - "MedicalRecord.review_state == PENDING_REVIEW (ERR_RECORD_ALREADY_REVIEWED)"
        side_effects: []

  - entity: Lien
    initial_state: IDENTIFIED
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: IDENTIFIED
        to: NOTIFIED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/notify
        actor: LienAnalyst
        preconditions:
          - "Lien.state == IDENTIFIED (ERR_LIEN_INVALID_STATE)"
          - "Claim.status == LIENS_PENDING (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "Compute provisional_demand_cents (provisional formula)"
          - "holder_response_due_at = program.current_utc + 30 days"

      - from: NOTIFIED
        to: IN_NEGOTIATION
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/begin-negotiation
        actor: LienAnalyst
        preconditions:
          - "Lien.state == NOTIFIED (ERR_LIEN_INVALID_STATE)"
        side_effects: []

      - from: NOTIFIED
        to: RESOLVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/resolve (holder silent path)
        actor: LienAnalyst
        preconditions:
          - "Lien.state == NOTIFIED (ERR_LIEN_INVALID_STATE)"
          - "program.current_utc > holder_response_due_at (ERR_HOLDER_WINDOW_OPEN) — holder silence path"
          - "final_demand_cents == asserted_amount_cents (server sets; no client override on this path)"
        side_effects:
          - "Set final_demand_cents = asserted_amount_cents"
          - "Recompute claim.total_lien_cents and claim.net_award_cents"

      - from: IN_NEGOTIATION
        to: RESOLVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/resolve (negotiated path)
        actor: LienAnalyst
        preconditions:
          - "Lien.state == IN_NEGOTIATION (ERR_LIEN_INVALID_STATE)"
          - "0 <= final_demand_cents <= asserted_amount_cents (ERR_FINAL_EXCEEDS_ASSERTED)"
        side_effects:
          - "Set final_demand_cents from input"
          - "Recompute claim.total_lien_cents and claim.net_award_cents"

      - from: IDENTIFIED
        to: WAIVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/waive
        actor: LienAnalyst
        preconditions:
          - "Lien.state in {IDENTIFIED, NOTIFIED, IN_NEGOTIATION} (ERR_LIEN_INVALID_STATE)"
          - "resolution_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "final_demand_cents = 0"
          - "Recompute claim.total_lien_cents and claim.net_award_cents"

      - from: NOTIFIED
        to: WAIVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/waive
        actor: LienAnalyst
        preconditions:
          - "Lien.state in {IDENTIFIED, NOTIFIED, IN_NEGOTIATION} (ERR_LIEN_INVALID_STATE)"
          - "resolution_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "final_demand_cents = 0"
          - "Recompute claim.total_lien_cents and claim.net_award_cents"

      - from: IN_NEGOTIATION
        to: WAIVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/waive
        actor: LienAnalyst
        preconditions:
          - "Lien.state in {IDENTIFIED, NOTIFIED, IN_NEGOTIATION} (ERR_LIEN_INVALID_STATE)"
          - "resolution_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "final_demand_cents = 0"
          - "Recompute claim.total_lien_cents and claim.net_award_cents"

      - from: IN_NEGOTIATION
        to: DISPUTED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/dispute
        actor: ClaimantRole
        preconditions:
          - "Lien.state == IN_NEGOTIATION (ERR_LIEN_INVALID_STATE)"
        side_effects: []

      - from: DISPUTED
        to: IN_NEGOTIATION
        trigger: POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/begin-negotiation
        actor: LienAnalyst
        preconditions:
          - "Lien.state in {NOTIFIED, DISPUTED} (ERR_LIEN_INVALID_STATE)"
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: POST /settlement-programs/{pid}/claims/{cid}/appeals/{aid}/begin-review
        actor: ProgramAdministrator
        preconditions:
          - "Appeal.state == FILED (ERR_APPEAL_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: POST /settlement-programs/{pid}/claims/{cid}/appeals/{aid}/uphold
        actor: ProgramAdministrator
        preconditions:
          - "Appeal.state == UNDER_REVIEW (ERR_APPEAL_INVALID_STATE)"
          - "resolution_rationale >= 20 chars (ERR_INVALID_REQUEST)"
          - "requested_tier_matrix_id is PUBLISHED (ERR_MATRIX_NOT_PUBLISHED)"
        side_effects:
          - "Re-run tier_assignment with requested_tier_matrix_id -> update gross_award_cents"
          - "Re-run attorney_fee calculation -> update attorney_fee_cents"
          - "Recompute claim.net_award_cents"
          - "Clear claim.active_appeal_id = null"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/appeals/{aid}/deny
        actor: ProgramAdministrator
        preconditions:
          - "Appeal.state == UNDER_REVIEW (ERR_APPEAL_INVALID_STATE)"
          - "resolution_rationale >= 20 chars (ERR_INVALID_REQUEST)"
        side_effects:
          - "Clear claim.active_appeal_id = null"

      - from: FILED
        to: WITHDRAWN
        trigger: POST /settlement-programs/{pid}/claims/{cid}/appeals/{aid}/withdraw
        actor: ClaimantRole
        preconditions:
          - "Appeal.state == FILED (ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "Clear claim.active_appeal_id = null"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/disbursements/{did}/approve
        actor: DisbursementApprover
        preconditions:
          - "Disbursement.state == PENDING (ERR_DISBURSEMENT_INVALID_STATE)"
          - "Segregation of duties: approver X-User-ID must differ from the user who called prepare-disbursement on this claim (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects: []

      - from: APPROVED
        to: RELEASED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/disbursements/{did}/release
        actor: DisbursementApprover
        preconditions:
          - "Disbursement.state == APPROVED (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects:
          - "released_at = program.current_utc"
          - "If all sibling disbursements RELEASED or VOIDED: Claim.status -> DISBURSED"

      - from: PENDING
        to: VOIDED
        trigger: POST /settlement-programs/{pid}/claims/{cid}/disbursements/{did}/void
        actor: DisbursementApprover
        preconditions:
          - "Disbursement.state == PENDING (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects:
          - "Refund amount_cents back to program.qsf_remaining_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: assign-tier-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /settlement-programs/{pid}/claims/{cid}/assign-tier"
    occ_field: "expected_claim_version"
    description: |
      Assigning a tier against a Claim whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just filed an appeal (which mutates the claim and bumps its
      version) and the current writer's view of the claim is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: resolve-lien-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/resolve"
    occ_field: "expected_claim_version"
    description: |
      Resolving a lien against a Claim whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just filed an appeal (which sets active_appeal_id and bumps
      claim.version) or finalized liens, leaving the current writer's view
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: tier_assignment
    trigger: "claim transitions INJURY_VERIFIED -> TIER_ASSIGNED, or appeal UPHELD re-tier"
    algorithm: threshold
    formula: |
      severity_score = max(severity_score over MedicalRecord where claim_id = claim.id
                           AND review_state == ACCEPTED)
      matrix_row = TierMatrix where id == requested tier_matrix_id
      gross_award_cents = matrix_row.base_award_cents
    input_set: "ACCEPTED medical records on this claim only; requested matrix row only"
    precision: "integer cents"

  - name: attorney_fee
    trigger: "claim transitions to TIER_ASSIGNED; re-run on appeal UPHELD"
    algorithm: tiered_pricing
    formula: |
      # Mode (b): nested rounding — order matters.
      # Round each lien's pro-rata fee share first (round_half_up to cents),
      # then sum, then compute claimant's fee remainder.
      # Diverges from sum-then-round alternative by up to N-1 cents.
      if not claimant.represented_by_counsel:
        attorney_fee_cents = 0
      else:
        gross = claim.gross_award_cents
        lien_share_total = 0
        for each Lien in state RESOLVED on this claim:
          # per-lien fee share: fee_tier applied to lien's final_demand
          share = round_half_up(lien.final_demand_cents * FEE_RATE)
          lien_share_total += share
        attorney_fee_cents = round_half_up((gross - claim.total_lien_cents) * FEE_RATE) \
                              - lien_share_total
        # floor at zero
        if attorney_fee_cents < 0: attorney_fee_cents = 0
    constants:
      FEE_RATE: 0.40     # 40% contingency
    precision: "round_half_up to integer cents at each lien line, then sum"
    variants:
      - name: per_line_then_sum
        when: "canonical rounding order used by the system"
        difference: "Per-lien shares rounded first, then summed. Final cents differ from sum-then-round."
      - name: sum_then_round
        when: "alternative interpretation NOT used; documented for tests that distinguish"
        difference: "Sum unrounded shares then round once. Kept here as the rejected variant; tests assert canonical value only."

  - name: provisional_lien_demand
    trigger: "Lien transition IDENTIFIED -> NOTIFIED"
    algorithm: threshold
    formula: |
      # Mode (a): tiered/conditional formula over multiple inputs.
      # Provisional demand = discount against asserted_amount based on holder type.
      if lien.lien_type == MEDICARE:
        provisional = round_half_up(asserted_amount_cents * 0.60)
      elif lien.lien_type == MEDICAID:
        provisional = round_half_up(asserted_amount_cents * 0.50)
      elif lien.lien_type == VA_TRICARE:
        provisional = round_half_up(asserted_amount_cents * 0.70)
      elif lien.lien_type == MEDICAL_PROVIDER:
        # Medical provider liens get a hardship discount that depends on
        # claimant net award projection: if claim.gross_award_cents < HARDSHIP_FLOOR,
        # use 0.40, else 0.80 — conditional branch on claim state.
        if claim.gross_award_cents < HARDSHIP_FLOOR_CENTS:
          provisional = round_half_up(asserted_amount_cents * 0.40)
        else:
          provisional = round_half_up(asserted_amount_cents * 0.80)
      else:  # PRIVATE_INSURER
        provisional = round_half_up(asserted_amount_cents * 0.75)
    constants:
      HARDSHIP_FLOOR_CENTS: 5000000   # $50,000 gross award threshold
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "holder_response_due_at not yet reached; used for claimant planning"
        difference: "Discount rates per lien_type above; never exceeds asserted_amount"
      - name: final
        when: "holder silent past holder_response_due_at OR negotiated"
        difference: "Silent path: final == asserted (no discount). Negotiated path: analyst input, must be <= asserted."

  - name: disbursement_allocation
    trigger: "claim transitions LIENS_RESOLVED -> READY_FOR_DISBURSEMENT"
    algorithm: waterfall_allocation
    formula: |
      # Mode (c): circular-looking ordering pinned explicit.
      # Waterfall: (1) LIEN_HOLDER buckets first, (2) ATTORNEY, (3) CLAIMANT remainder.
      # Order matters because bucket 3 is the residual.
      remaining = claim.net_award_cents
      # bucket 1: lien holders — one Disbursement per distinct holder_name
      # among liens in state RESOLVED, ordered by (lien.created_at ASC, lien.id never used).
      # Each bucket amount = sum of final_demand_cents for that holder.
      for holder_name in distinct holder_names ordered by earliest lien.created_at ASC:
        amt = sum(final_demand_cents for that holder)
        create Disbursement(payee_role=LIEN_HOLDER, payee_name=holder_name, amount_cents=amt)
        remaining -= amt
      # bucket 2: attorney
      if claimant.represented_by_counsel:
        create Disbursement(payee_role=ATTORNEY, payee_name="Counsel of Record", amount_cents=claim.attorney_fee_cents)
        remaining -= claim.attorney_fee_cents
      # bucket 3: claimant residual
      create Disbursement(payee_role=CLAIMANT, payee_name=claimant.full_name, amount_cents=remaining)
    input_set: "liens in RESOLVED on this claim; claimant row"
    precision: "integer cents"
    note: "Sum of all Disbursement.amount_cents for a claim == claim.net_award_cents (conservation)."

  - name: qsf_reconciliation
    trigger: "any Disbursement state change to RELEASED or VOIDED; claim prepare-disbursement"
    algorithm: aggregation
    formula: |
      program.qsf_remaining_cents = program.qsf_principal_cents
                                    - sum(disbursement.amount_cents
                                          for disbursement where disbursement.state == RELEASED
                                          and disbursement.claim.program == program)
                                    - sum(claim.qsf_reservation_cents
                                          for claim where claim.status == READY_FOR_DISBURSEMENT
                                          and claim.program == program)
    input_set: "all RELEASED disbursements across program; all READY_FOR_DISBURSEMENT claims"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids (program, claim, record, lien, appeal, disbursement, matrix) exist and are nested correctly"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: state
    check: "OCC expected_claim_version matches claim.version (when endpoint requires it)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST assign-tier, POST liens/{lid}/resolve"
    note: "OCC check happens BEFORE any business-state validation below"

  - priority: 5
    category: state
    check: "Claim (or child entity) in the required from-state for this transition"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: disbursement approver != prepare-disbursement caller"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST disbursements/{did}/approve"

  - priority: 7
    category: business_referential
    check: "TierMatrix row belongs to this program and is PUBLISHED"
    error_id: ERR_MATRIX_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST assign-tier, POST appeals"

  - priority: 8
    category: business_referential
    check: "Claimant injury_category matches matrix injury_category"
    error_id: ERR_MATRIX_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST assign-tier"

  - priority: 9
    category: business_constraint
    check: "Severity score from ACCEPTED records falls inside matrix range [min,max] inclusive"
    error_id: ERR_SEVERITY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST assign-tier"

  - priority: 10
    category: business_temporal
    check: "Exposure/diagnosis date order: start <= diagnosis <= end"
    error_id: ERR_ELIGIBILITY_DATE_ORDER
    http_status: 422
    applies_to: "POST screen-eligibility"

  - priority: 11
    category: business_constraint
    check: "No other active claim for this claimant"
    error_id: ERR_DUPLICATE_ACTIVE_CLAIM
    http_status: 409
    applies_to: "POST screen-eligibility"

  - priority: 12
    category: business_constraint
    check: "At least 2 ACCEPTED records before verify-injury"
    error_id: ERR_INSUFFICIENT_MEDICAL_RECORDS
    http_status: 409
    applies_to: "POST verify-injury"

  - priority: 13
    category: business_safety
    check: "At least 1 ACCEPTED record has confirms_qualifying_injury=true"
    error_id: ERR_NO_QUALIFYING_RECORD
    http_status: 422
    applies_to: "POST verify-injury"

  - priority: 14
    category: business_constraint
    check: "All liens in RESOLVED or WAIVED before finalize-liens"
    error_id: ERR_UNRESOLVED_LIENS_EXIST
    http_status: 409
    applies_to: "POST finalize-liens"

  - priority: 15
    category: business_constraint
    check: "No open appeal blocks finalize-liens"
    error_id: ERR_OPEN_APPEAL_BLOCKS_FINALIZE
    http_status: 409
    applies_to: "POST finalize-liens"

  - priority: 16
    category: business_temporal
    check: "Holder response window must have closed for silent-path lien resolution (current_utc > holder_response_due_at)"
    error_id: ERR_HOLDER_WINDOW_OPEN
    http_status: 422
    applies_to: "POST liens/{lid}/resolve (silent path, lien.state == NOTIFIED)"

  - priority: 17
    category: business_fiscal
    check: "final_demand_cents <= asserted_amount_cents on negotiated resolution"
    error_id: ERR_FINAL_EXCEEDS_ASSERTED
    http_status: 422
    applies_to: "POST liens/{lid}/resolve (negotiated path)"

  - priority: 18
    category: business_fiscal
    check: "QSF has sufficient funds for net award"
    error_id: ERR_QSF_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST prepare-disbursement"

  - priority: 19
    category: business_fiscal
    check: "net_award_cents >= 0"
    error_id: ERR_NEGATIVE_NET_AWARD
    http_status: 422
    applies_to: "POST prepare-disbursement"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs ---
  - method: POST
    path: "/settlement-programs"
    description: "Create a settlement program"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_code, tort_name, qsf_principal_cents]
    output: SettlementProgram
    side_effects: ["current_utc initialized to 2026-08-01T00:00:00Z"]

  - method: GET
    path: "/settlement-programs"
    description: "List settlement programs"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["limit?", "offset?"]
    output: "SettlementProgram[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}"
    description: "Get a settlement program"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: SettlementProgram
    side_effects: []

  # --- Logical clock ---
  - method: POST
    path: "/settlement-programs/{pid}/_clock/set_current_utc"
    description: "Advance the program's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: SettlementProgram
    side_effects: ["program.current_utc = to_iso8601 (must be > current value)"]

  # --- Tier Matrices ---
  - method: POST
    path: "/settlement-programs/{pid}/tier-matrices"
    description: "Create a tier matrix row"
    roles: [ProgramAdministrator]
    code: 201
    input: [injury_category, severity_score_min, severity_score_max, base_award_cents]
    output: TierMatrix
    side_effects: ["matrix_state = DRAFT"]

  - method: GET
    path: "/settlement-programs/{pid}/tier-matrices"
    description: "List tier matrix rows (optionally filter by settlement_program_id)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: ["matrix_state?", "settlement_program_id?", "limit?", "offset?"]
    output: "TierMatrix[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/tier-matrices/{tmid}"
    description: "Get a tier matrix row"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: []
    output: TierMatrix
    side_effects: []

  - method: POST
    path: "/settlement-programs/{pid}/tier-matrices/{tmid}/publish"
    description: "Publish a matrix row (makes it assignable)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TierMatrix
    side_effects: ["matrix_state DRAFT -> PUBLISHED; supersedes any prior PUBLISHED row with same injury_category overlapping severity range"]

  # --- Claimants ---
  - method: POST
    path: "/settlement-programs/{pid}/claimants"
    description: "Register a claimant"
    roles: [IntakeSpecialist]
    code: 201
    input: [full_name, date_of_birth, ssn_last4, date_of_exposure_start, date_of_exposure_end, date_of_diagnosis, injury_category, represented_by_counsel]
    output: Claimant
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claimants"
    description: "List claimants (optionally filter by settlement_program_id or duplicate_of_claimant_id for reverse-reachability)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: ["settlement_program_id?", "duplicate_of_claimant_id?", "limit?", "offset?"]
    output: "Claimant[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claimants/{clid}"
    description: "Get a claimant"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Claimant
    side_effects: []

  # --- Claims ---
  - method: POST
    path: "/settlement-programs/{pid}/claims"
    description: "File a new claim"
    roles: [IntakeSpecialist]
    code: 201
    input: [claimant_id]
    output: Claim
    side_effects: ["status = SUBMITTED; claim_number minted; eligibility_status=PENDING; injury_verification_status=PENDING; lien_posture=NOT_STARTED"]

  - method: GET
    path: "/settlement-programs/{pid}/claims"
    description: "List claims (optionally filter by settlement_program_id, claimant_id, or active_appeal_id for reverse-reachability)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: ["status?", "settlement_program_id?", "claimant_id?", "active_appeal_id?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}"
    description: "Get a claim"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/screen-eligibility"
    description: "Screen claim eligibility against program criteria"
    roles: [IntakeSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED -> ELIGIBILITY_PASSED; eligibility_status=PASSED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/deny"
    description: "Deny a claim at intake"
    roles: [IntakeSpecialist]
    code: 200
    input: [denied_reason]
    output: Claim
    side_effects: ["status SUBMITTED -> DENIED; eligibility_status=FAILED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/withdraw"
    description: "Withdraw a claim"
    roles: [ClaimantRole]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> WITHDRAWN (from SUBMITTED, ELIGIBILITY_PASSED, RECORDS_PENDING, INJURY_VERIFIED)"]

  # --- Medical Records ---
  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/medical-records"
    description: "Upload a medical record"
    roles: [RecordsAnalyst]
    code: 201
    input: [provider_name, record_type, severity_score, confirms_qualifying_injury]
    output: MedicalRecord
    side_effects: ["review_state=PENDING_REVIEW; if claim.status==ELIGIBILITY_PASSED: claim.status -> RECORDS_PENDING"]

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/medical-records"
    description: "List medical records for a claim (claim_id filter provided for reverse-reachability)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst]
    code: 200
    input: ["review_state?", "claim_id?", "limit?", "offset?"]
    output: "MedicalRecord[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/medical-records/{rid}"
    description: "Get a medical record"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: []

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/medical-records/{rid}/accept"
    description: "Accept a medical record"
    roles: [RecordsAnalyst]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: ["review_state PENDING_REVIEW -> ACCEPTED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/medical-records/{rid}/reject"
    description: "Reject a medical record"
    roles: [RecordsAnalyst]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: ["review_state PENDING_REVIEW -> REJECTED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/verify-injury"
    description: "Verify the qualifying injury"
    roles: [RecordsAnalyst]
    code: 200
    input: []
    output: Claim
    side_effects: ["status RECORDS_PENDING -> INJURY_VERIFIED; injury_verification_status=VERIFIED"]

  # --- Tier assignment ---
  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/assign-tier"
    description: "Assign tier via a published matrix row"
    roles: [ProgramAdministrator]
    code: 200
    input: [tier_matrix_id, expected_claim_version]
    output: Claim
    side_effects:
      - "status INJURY_VERIFIED -> TIER_ASSIGNED"
      - "Run tier_assignment -> gross_award_cents"
      - "Run attorney_fee -> attorney_fee_cents"
      - "Recompute net_award_cents"
      - "lien_posture=IDENTIFYING"
      - "increments Claim.version by 1"

  # --- Appeals ---
  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/appeals"
    description: "File an appeal disputing the assigned tier"
    roles: [ClaimantRole]
    code: 201
    input: [appealed_tier_matrix_id, requested_tier_matrix_id, grounds]
    output: Appeal
    side_effects:
      - "Appeal.state=FILED"
      - "Claim.active_appeal_id set; increments Claim.version by 1"

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/appeals"
    description: "List appeals on a claim (claim_id, appealed_tier_matrix_id, requested_tier_matrix_id filters for reverse-reachability)"
    roles: [ProgramAdministrator, IntakeSpecialist, LienAnalyst, ClaimantRole]
    code: 200
    input: ["state?", "claim_id?", "appealed_tier_matrix_id?", "requested_tier_matrix_id?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/appeals/{aid}"
    description: "Get an appeal"
    roles: [ProgramAdministrator, IntakeSpecialist, LienAnalyst, ClaimantRole]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/appeals/{aid}/begin-review"
    description: "Move appeal to UNDER_REVIEW"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Appeal
    side_effects: ["Appeal.state FILED -> UNDER_REVIEW"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/appeals/{aid}/uphold"
    description: "Uphold appeal; re-tier claim"
    roles: [ProgramAdministrator]
    code: 200
    input: [resolution_rationale]
    output: Appeal
    side_effects:
      - "Appeal.state UNDER_REVIEW -> UPHELD"
      - "Re-run tier_assignment with requested_tier_matrix_id"
      - "Recompute attorney_fee, total_lien_cents unchanged, net_award_cents"
      - "Clear claim.active_appeal_id; increments Claim.version by 1"

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/appeals/{aid}/deny"
    description: "Deny appeal"
    roles: [ProgramAdministrator]
    code: 200
    input: [resolution_rationale]
    output: Appeal
    side_effects: ["Appeal.state UNDER_REVIEW -> DENIED", "Clear claim.active_appeal_id; increments Claim.version by 1"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/appeals/{aid}/withdraw"
    description: "Withdraw an appeal"
    roles: [ClaimantRole]
    code: 200
    input: []
    output: Appeal
    side_effects: ["Appeal.state FILED -> WITHDRAWN", "Clear claim.active_appeal_id; increments Claim.version by 1"]

  # --- Liens ---
  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/liens"
    description: "Identify a lien"
    roles: [LienAnalyst]
    code: 201
    input: [lien_type, holder_name, asserted_amount_cents]
    output: Lien
    side_effects:
      - "Lien.state = IDENTIFIED"
      - "If claim.status == TIER_ASSIGNED: claim.status -> LIENS_PENDING"

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/liens"
    description: "List liens on a claim (claim_id filter for reverse-reachability)"
    roles: [ProgramAdministrator, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["state?", "lien_type?", "claim_id?", "limit?", "offset?"]
    output: "Lien[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/liens/{lid}"
    description: "Get a lien"
    roles: [ProgramAdministrator, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Lien
    side_effects: []

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/liens/{lid}/notify"
    description: "Notify holder; computes provisional demand"
    roles: [LienAnalyst]
    code: 200
    input: []
    output: Lien
    side_effects: ["Lien.state IDENTIFIED -> NOTIFIED; compute provisional_demand_cents; set holder_response_due_at = program.current_utc + 30 days"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/liens/{lid}/begin-negotiation"
    description: "Begin negotiation"
    roles: [LienAnalyst]
    code: 200
    input: []
    output: Lien
    side_effects: ["Lien.state NOTIFIED|DISPUTED -> IN_NEGOTIATION"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/liens/{lid}/dispute"
    description: "Claimant disputes an in-negotiation lien"
    roles: [ClaimantRole]
    code: 200
    input: []
    output: Lien
    side_effects: ["Lien.state IN_NEGOTIATION -> DISPUTED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/liens/{lid}/resolve"
    description: "Resolve a lien — negotiated path (IN_NEGOTIATION with explicit final_demand_cents) or silent path (NOTIFIED past holder_response_due_at)"
    roles: [LienAnalyst]
    code: 200
    input: [expected_claim_version, "final_demand_cents?", "resolution_notes?"]
    output: Lien
    side_effects:
      - "Lien.state -> RESOLVED"
      - "Sets final_demand_cents (negotiated input OR asserted_amount on silent path)"
      - "Recompute claim.total_lien_cents and net_award_cents"
      - "increments Claim.version by 1"

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/liens/{lid}/waive"
    description: "Waive a lien"
    roles: [LienAnalyst]
    code: 200
    input: [resolution_notes]
    output: Lien
    side_effects: ["Lien.state -> WAIVED; final_demand_cents=0; recompute claim totals"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/finalize-liens"
    description: "Mark liens resolved; precompute totals"
    roles: [LienAnalyst]
    code: 200
    input: []
    output: Claim
    side_effects: ["status LIENS_PENDING -> LIENS_RESOLVED; lien_posture=ALL_RESOLVED"]

  # --- Disbursements ---
  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/prepare-disbursement"
    description: "Reserve QSF and spawn Disbursement rows"
    roles: [DisbursementApprover]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "status LIENS_RESOLVED -> READY_FOR_DISBURSEMENT"
      - "qsf_reservation_cents = net_award_cents"
      - "Run disbursement_allocation -> create Disbursement rows in PENDING"
      - "Decrement program.qsf_remaining_cents"
      - "increments Claim.version by 1"

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/disbursements"
    description: "List disbursements for a claim (claim_id filter for reverse-reachability)"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["state?", "claim_id?", "limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/disbursements/{did}"
    description: "Get a disbursement"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/disbursements/{did}/approve"
    description: "Approve a pending disbursement (segregated from prepare caller)"
    roles: [DisbursementApprover]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Disbursement.state PENDING -> APPROVED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/disbursements/{did}/release"
    description: "Release an approved disbursement"
    roles: [DisbursementApprover]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Disbursement.state APPROVED -> RELEASED; released_at=program.current_utc; if all siblings RELEASED or VOIDED: claim.status -> DISBURSED"]

  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/disbursements/{did}/void"
    description: "Void a pending disbursement and refund QSF"
    roles: [DisbursementApprover]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Disbursement.state PENDING -> VOIDED; refund amount_cents to program.qsf_remaining_cents"]

  # --- Closing ---
  - method: POST
    path: "/settlement-programs/{pid}/claims/{cid}/close"
    description: "Close a disbursed claim and seal a ClosingStatement"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DISBURSED -> CLOSED; create ClosingStatement snapshot"]

  - method: GET
    path: "/settlement-programs/{pid}/claims/{cid}/closing-statements"
    description: "List closing statements for a claim (claim_id filter for reverse-reachability)"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["claim_id?"]
    output: "ClosingStatement[]"
    side_effects: []

  # --- Flat collection aliases (reverse-reachability GETs required by FK lint) ---
  # These expose the same resources under a flat /<entity>/{id} shape so the
  # scaffold-lint heuristic can bind each entity to a canonical collection
  # segment and verify FK reverse-reachability. Functionally equivalent to
  # the nested forms above; both shapes MUST be supported by implementations.
  - method: GET
    path: "/settlement-programs/claimants/{id}"
    description: "Flat single-claimant read (alias of nested GET)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Claimant
    side_effects: []

  - method: GET
    path: "/settlement-programs/claims/{id}"
    description: "Flat single-claim read (alias of nested GET)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/settlement-programs/tier-matrices/{id}"
    description: "Flat single-tier-matrix read (alias of nested GET)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: []
    output: TierMatrix
    side_effects: []

  - method: GET
    path: "/settlement-programs/medical-records/{id}"
    description: "Flat single-medical-record read (alias of nested GET)"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: []

  - method: GET
    path: "/settlement-programs/liens/{id}"
    description: "Flat single-lien read (alias of nested GET)"
    roles: [ProgramAdministrator, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Lien
    side_effects: []

  - method: GET
    path: "/settlement-programs/appeals/{id}"
    description: "Flat single-appeal read (alias of nested GET)"
    roles: [ProgramAdministrator, IntakeSpecialist, LienAnalyst, ClaimantRole]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/settlement-programs/disbursements/{id}"
    description: "Flat single-disbursement read (alias of nested GET)"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/settlement-programs/closing-statements/{id}"
    description: "Flat single-closing-statement read (alias of nested GET)"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: []

  # --- Flat list aliases with FK filters (reverse-reachability GETs) ---
  - method: GET
    path: "/settlement-programs/claimants"
    description: "Flat list claimants; FK filters for reverse reachability"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: ["settlement_program_id?", "duplicate_of_claimant_id?", "limit?", "offset?"]
    output: "Claimant[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/claims"
    description: "Flat list claims; FK filters for reverse reachability"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: ["settlement_program_id?", "claimant_id?", "active_appeal_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/tier-matrices"
    description: "Flat list tier matrices; FK filters for reverse reachability"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst, DisbursementApprover]
    code: 200
    input: ["settlement_program_id?", "matrix_state?", "limit?", "offset?"]
    output: "TierMatrix[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/medical-records"
    description: "Flat list medical records; FK filters for reverse reachability"
    roles: [ProgramAdministrator, IntakeSpecialist, RecordsAnalyst, LienAnalyst]
    code: 200
    input: ["claim_id?", "review_state?", "limit?", "offset?"]
    output: "MedicalRecord[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/liens"
    description: "Flat list liens; FK filters for reverse reachability"
    roles: [ProgramAdministrator, LienAnalyst, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["claim_id?", "state?", "lien_type?", "limit?", "offset?"]
    output: "Lien[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/appeals"
    description: "Flat list appeals; FK filters for reverse reachability"
    roles: [ProgramAdministrator, IntakeSpecialist, LienAnalyst, ClaimantRole]
    code: 200
    input: ["claim_id?", "appealed_tier_matrix_id?", "requested_tier_matrix_id?", "state?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/disbursements"
    description: "Flat list disbursements; FK filters for reverse reachability"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["claim_id?", "state?", "limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []

  - method: GET
    path: "/settlement-programs/closing-statements"
    description: "Flat list closing statements; FK filters for reverse reachability"
    roles: [ProgramAdministrator, DisbursementApprover, ClaimantRole]
    code: 200
    input: ["claim_id?", "limit?", "offset?"]
    output: "ClosingStatement[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted to invoke this endpoint" }

  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-parameterized resource does not exist or is not nested under parent" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_claim_version does not match claim.version" }

  # --- input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, enum out of range, or string min-length violated" }

  # --- claim state ---
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim not in the required from-state for this transition" }
  - { id: ERR_CLAIM_NOT_WITHDRAWABLE, http: 409, condition: "Claim has progressed past INJURY_VERIFIED and cannot be withdrawn" }
  - { id: ERR_DUPLICATE_ACTIVE_CLAIM, http: 409, condition: "Another claim for same claimant is in a non-terminal state" }

  # --- eligibility ---
  - { id: ERR_ELIGIBILITY_DATE_ORDER, http: 422, condition: "date_of_exposure_start <= date_of_diagnosis <= date_of_exposure_end violated" }
  - { id: ERR_INELIGIBLE_INJURY, http: 422, condition: "injury_category == NON_QUALIFYING" }

  # --- records ---
  - { id: ERR_RECORD_ALREADY_REVIEWED, http: 409, condition: "MedicalRecord.review_state is not PENDING_REVIEW" }
  - { id: ERR_INSUFFICIENT_MEDICAL_RECORDS, http: 409, condition: "Fewer than 2 ACCEPTED medical records" }
  - { id: ERR_NO_QUALIFYING_RECORD, http: 422, condition: "No ACCEPTED record with confirms_qualifying_injury=true" }

  # --- tier / matrix ---
  - { id: ERR_NO_PUBLISHED_MATRIX, http: 409, condition: "Program has no TierMatrix row in PUBLISHED state" }
  - { id: ERR_MATRIX_NOT_PUBLISHED, http: 409, condition: "Provided tier_matrix_id is not in PUBLISHED state" }
  - { id: ERR_MATRIX_CATEGORY_MISMATCH, http: 422, condition: "Claimant injury_category != matrix injury_category" }
  - { id: ERR_SEVERITY_OUT_OF_RANGE, http: 422, condition: "Computed severity_score outside matrix [min,max] inclusive" }

  # --- appeal ---
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "claim.active_appeal_id is non-null" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Appeal not in the required from-state" }

  # --- lien ---
  - { id: ERR_LIEN_INVALID_STATE, http: 409, condition: "Lien not in the required from-state" }
  - { id: ERR_UNRESOLVED_LIENS_EXIST, http: 409, condition: "One or more liens still in IDENTIFIED/NOTIFIED/IN_NEGOTIATION/DISPUTED" }
  - { id: ERR_OPEN_APPEAL_BLOCKS_FINALIZE, http: 409, condition: "finalize-liens called while an appeal is open" }
  - { id: ERR_HOLDER_WINDOW_OPEN, http: 422, condition: "Silent-path resolve attempted before holder_response_due_at" }
  - { id: ERR_FINAL_EXCEEDS_ASSERTED, http: 422, condition: "final_demand_cents > asserted_amount_cents on negotiated resolve" }

  # --- disbursement ---
  - { id: ERR_DISBURSEMENT_INVALID_STATE, http: 409, condition: "Disbursement not in the required from-state" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Approver X-User-ID equals the prepare-disbursement caller" }
  - { id: ERR_DISBURSEMENTS_PENDING, http: 409, condition: "Claim transition to DISBURSED blocked by disbursements still in PENDING/APPROVED" }

  # --- fiscal ---
  - { id: ERR_NEGATIVE_NET_AWARD, http: 422, condition: "net_award_cents < 0 at prepare-disbursement time" }
  - { id: ERR_QSF_INSUFFICIENT_FUNDS, http: 402, condition: "program.qsf_remaining_cents < claim.net_award_cents at prepare-disbursement" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Owns program configuration, tier matrix publication, tier assignment, appeal adjudication, claim closure"
    identity: opaque
    exclusive_operations:
      - "POST /settlement-programs"
      - "POST /settlement-programs/{pid}/_clock/set_current_utc"
      - "POST /settlement-programs/{pid}/tier-matrices (and /publish)"
      - "POST /settlement-programs/{pid}/claims/{cid}/assign-tier"
      - "POST /settlement-programs/{pid}/claims/{cid}/appeals/{aid}/begin-review|uphold|deny"
      - "POST /settlement-programs/{pid}/claims/{cid}/close"
    shared_operations:
      - "GET endpoints across program, claimants, claims, matrices, records, liens, appeals, disbursements, closing-statements"

  - name: IntakeSpecialist
    description: "Registers claimants, files claims, screens eligibility, denies at intake"
    identity: opaque
    exclusive_operations:
      - "POST /settlement-programs/{pid}/claimants"
      - "POST /settlement-programs/{pid}/claims"
      - "POST /settlement-programs/{pid}/claims/{cid}/screen-eligibility"
      - "POST /settlement-programs/{pid}/claims/{cid}/deny"
    shared_operations:
      - "GET endpoints"

  - name: RecordsAnalyst
    description: "Uploads and reviews medical records; verifies injury"
    identity: opaque
    exclusive_operations:
      - "POST /settlement-programs/{pid}/claims/{cid}/medical-records"
      - "POST /settlement-programs/{pid}/claims/{cid}/medical-records/{rid}/accept|reject"
      - "POST /settlement-programs/{pid}/claims/{cid}/verify-injury"
    shared_operations:
      - "GET endpoints"

  - name: LienAnalyst
    description: "Identifies, notifies, negotiates, resolves, and waives liens; finalizes liens"
    identity: opaque
    exclusive_operations:
      - "POST /settlement-programs/{pid}/claims/{cid}/liens"
      - "POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/notify|begin-negotiation|resolve|waive"
      - "POST /settlement-programs/{pid}/claims/{cid}/finalize-liens"
    shared_operations:
      - "GET endpoints"

  - name: DisbursementApprover
    description: "Prepares, approves, releases, and voids disbursements; segregation of duties enforced between prepare and approve callers"
    identity: opaque
    exclusive_operations:
      - "POST /settlement-programs/{pid}/claims/{cid}/prepare-disbursement"
      - "POST /settlement-programs/{pid}/claims/{cid}/disbursements/{did}/approve|release|void"
    shared_operations:
      - "GET endpoints"

  - name: ClaimantRole
    description: "Represents the claimant; can withdraw own claim, file/withdraw appeal, dispute a lien"
    identity: "entity_backed:Claimant"
    exclusive_operations:
      - "POST /settlement-programs/{pid}/claims/{cid}/withdraw"
      - "POST /settlement-programs/{pid}/claims/{cid}/appeals"
      - "POST /settlement-programs/{pid}/claims/{cid}/appeals/{aid}/withdraw"
      - "POST /settlement-programs/{pid}/claims/{cid}/liens/{lid}/dispute"
    shared_operations:
      - "GET own claimant record, claims, appeals, liens, disbursements, closing-statements"
