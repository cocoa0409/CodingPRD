              as: EmployeeHealthNurse
              captures: { ix_id: $.data.id }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CL4C", full_name: "Pert Ctc", job_category: "TECH", department: "PED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
