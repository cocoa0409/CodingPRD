scenario: "1060. Fundraising Gala & Auction Platform (nonprofit): event & ticket/table, sponsor & program-ad, silent/live auction & mobile bidding, paddle-raise & pledge, checkout & payment, donation & receipt, revenue reconciliation, reporting"
domain_name: "fundraising-gala-auction"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Optimistic concurrency"
    - "Rate / threshold triggers"

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: Expert
  notes: |
    Gala night money flows through five independent revenue channels (tickets/tables,
    sponsorship + program ads, silent/live auction lots, paddle-raise appeal, multi-
    installment pledges) that all funnel into one per-bidder CheckoutInvoice and then
    into an event-level ReconciliationRun. The same underlying data yields different
    numbers depending on which of two documented interpretations is applied — proxy
    settlement vs placed amount on an auction lot, and accrual (BOOKED) vs cash
    (CASH_BASIS) on pledges — so the reconciliation total is only well-defined once the
    scaffold pins the basis. Event posture (OPEN / RESTRICTED / FROZEN) is derived from
    the event's own lifecycle plus the existence of a FINALIZED reconciliation run, and
    gates every child mutation.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: GalaEvent
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Public name of the gala."
      - name: event_start_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the gala begins; anchors the early-bird window."
      - name: event_end_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the gala ends."
      - name: match_cap_cents
        type: integer
        source: input
        default: 0
        description: "Maximum total matching-gift dollars the challenge donor will fund for paddle raises."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Event lifecycle state."
        constraints: "one of DRAFT, PUBLISHED, LIVE, SETTLING, CLOSED"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over all child mutations; see calculations.event_posture."
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: match_awarded_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of PaddleRaise.match_cents across all paddle raises of this event."
      - name: gross_collected_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of PaymentTransaction.amount_cents with status CAPTURED across all CheckoutInvoices of this event."
      - name: open_lot_count
        type: integer
        source: computed
        default: 0
        description: "Count of AuctionItem rows of this event with listing_status == OPEN."
      - name: unpaid_invoice_count
        type: integer
        source: computed
        default: 0
        description: "Count of CheckoutInvoice rows of this event with status IN {PENDING_PAYMENT, PARTIALLY_PAID}."

  - name: TicketTable
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala this table belongs to."
      - name: table_name
        type: string
        source: input
        description: "Placard name of the table, unique within the event."
      - name: seat_count
        type: integer
        source: input
        description: "Number of seats physically at the table."
        constraints: ">= 1"
      - name: table_price_cents
        type: integer
        source: input
        description: "List price to buy the whole table."
        constraints: ">= 0"
      - name: seat_price_cents
        type: integer
        source: input
        description: "List price of a single seat at this table."
        constraints: ">= 0"
      - name: seats_reserved
        type: integer
        source: computed
        default: 0
        description: "Seats consumed by TicketOrder rows of this table whose payment_status != REFUNDED and seating_status != RELEASED."
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: "AVAILABLE while seats_reserved < seat_count; SOLD_OUT once seats_reserved == seat_count."
        constraints: "one of AVAILABLE, SOLD_OUT"

  - name: TableHold
    parent: TicketTable
    common_fields: true
    fields:
      - name: table_id
        type: string
        source: input
        description: "FK -> TicketTable.id; the table this hold occupies."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the guest the hold is placed for."
      - name: hold_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the closed occupation interval on the table."
      - name: hold_end_utc
        type: datetime
        source: input
        description: "Inclusive end of the closed occupation interval on the table."
        constraints: "must be strictly after hold_start_utc"
      - name: status
        type: enum
        source: system
        default: HELD
        description: "Hold lifecycle state."
        constraints: "one of HELD, CONSUMED, RELEASED"

  - name: TicketOrder
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala being attended."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the purchasing guest."
      - name: table_id
        type: string
        source: input
        description: "FK -> TicketTable.id; the table priced against (required for both TABLE and SEAT orders)."
      - name: invoice_id
        type: string
        source: system
        default: null
        description: "FK -> CheckoutInvoice.id; set when this order is attached to an invoice line, null before that."
      - name: order_type
        type: enum
        source: input
        description: "TABLE buys the whole table; SEAT buys seat_count individual seats."
        constraints: "one of TABLE, SEAT"
      - name: seat_count
        type: integer
        source: input
        description: "Seats bought; MUST equal TicketTable.seat_count when order_type == TABLE."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Rounded per-unit price after any early-bird discount; see calculations.ticket_order_total."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "unit_price_cents * units; see calculations.ticket_order_total."
      - name: benefit_value_cents
        type: integer
        source: computed
        description: "TICKET_BENEFIT_PER_SEAT_CENTS * seat_count; the non-deductible dinner benefit."
      - name: early_bird_applied
        type: boolean
        source: computed
        default: false
        description: "True when the order was priced inside the early-bird window."
      - name: payment_status
        type: enum
        source: system
        default: UNBILLED
        description: "Billing dimension of this order (independent of seating_status)."
        constraints: "one of UNBILLED, INVOICED, PAID, REFUNDED"
      - name: seating_status
        type: enum
        source: system
        default: UNSEATED
        description: "Seating dimension of this order (independent of payment_status)."
        constraints: "one of UNSEATED, SEATED, RELEASED"

  - name: Bidder
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala this bidder is registered for."
      - name: display_name
        type: string
        source: input
        description: "Guest name shown on the bid sheet."
      - name: email
        type: string
        source: input
        description: "Contact email for receipts."
      - name: paddle_number
        type: integer
        source: input
        description: "Paddle number, unique within the event."
        constraints: ">= 1"
      - name: payment_method_on_file
        type: boolean
        source: input
        default: false
        description: "Whether a card is stored; required before bidding or paddle-raising."
      - name: outstanding_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of CheckoutInvoice.balance_due_cents for this bidder's invoices with status IN {OPEN, PENDING_PAYMENT, PARTIALLY_PAID}."

  - name: Sponsor
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala being sponsored."
      - name: org_name
        type: string
        source: input
        description: "Sponsoring organization name."
      - name: tier
        type: enum
        source: input
        description: "Sponsorship tier."
        constraints: "one of GOLD, SILVER, BRONZE"
      - name: commitment_cents
        type: integer
        source: input
        description: "Amount pledged in the sponsorship agreement."
        constraints: ">= 1"
      - name: paid_amount_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative sponsorship cash recorded via the confirm endpoint."
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Sponsorship lifecycle state."
        constraints: "one of PENDING, CONFIRMED, WITHDRAWN"
      - name: placed_ad_count
        type: integer
        source: computed
        default: 0
        description: "Count of this sponsor's ProgramAd rows with status == PLACED."

  - name: ProgramAd
    parent: Sponsor
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: "FK -> Sponsor.id; the sponsor whose ad this is."
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala whose printed program carries the ad."
      - name: ad_size
        type: enum
        source: input
        description: "Printed size of the ad."
        constraints: "one of FULL_PAGE, HALF_PAGE, QUARTER_PAGE"
      - name: artwork_ref
        type: string
        source: input
        description: "Opaque reference to the uploaded artwork asset."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Ad review lifecycle state; CHANGES_REQUESTED can cycle back to SUBMITTED."
        constraints: "one of SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED, PLACED"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: "Number of completed resubmissions; capped by MAX_AD_REVISIONS."
      - name: page_number
        type: integer
        source: system
        default: null
        description: "Program page the ad was placed on; null until PLACED."
      - name: review_notes
        type: string
        source: system
        default: null
        description: "Reviewer notes recorded on the most recent review decision."

  - name: AuctionItem
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala this lot belongs to."
      - name: title
        type: string
        source: input
        description: "Lot title."
      - name: item_type
        type: enum
        source: input
        description: "SILENT lots run on mobile bidding; LIVE lots run from the stage."
        constraints: "one of SILENT, LIVE"
      - name: starting_bid_cents
        type: integer
        source: input
        description: "Opening bid; the first accepted bid must be >= this value."
        constraints: ">= 0"
      - name: min_increment_cents
        type: integer
        source: input
        description: "Minimum step above the current leading amount for a subsequent bid."
        constraints: ">= 1"
      - name: estimated_fmv_cents
        type: integer
        source: input
        description: "Fair market value of the goods, subtracted from the hammer price when computing the deductible amount."
        constraints: ">= 0"
      - name: open_at_utc
        type: datetime
        source: input
        description: "Inclusive start of the lot's bidding window."
      - name: close_at_utc
        type: datetime
        source: input
        description: "Exclusive end of the lot's bidding window."
        constraints: "must be strictly after open_at_utc"
      - name: live_lot_sequence
        type: integer
        source: input
        default: null
        description: "Stage channel slot number; two lots sharing a non-null live_lot_sequence on one event may not have overlapping windows while OPEN."
      - name: listing_status
        type: enum
        source: system
        default: DRAFT
        description: "Bidding dimension of the lot (independent of settlement_status)."
        constraints: "one of DRAFT, OPEN, AWARDED, PASSED"
      - name: settlement_status
        type: enum
        source: system
        default: UNSETTLED
        description: "Money dimension of the lot (independent of listing_status)."
        constraints: "one of UNSETTLED, INVOICED, PAID"
      - name: current_leading_amount_cents
        type: integer
        source: computed
        default: 0
        description: "PROXY_SETTLED valuation over the lot's ACTIVE bids; recomputed on every accepted or retracted bid."
      - name: winning_bid_id
        type: string
        source: system
        default: null
        description: "FK -> Bid.id; the bid awarded at close, null until AWARDED."
      - name: hammer_price_cents
        type: integer
        source: computed
        default: null
        description: "PROXY_SETTLED amount frozen at close; null unless listing_status == AWARDED."
      - name: invoice_id
        type: string
        source: system
        default: null
        description: "FK -> CheckoutInvoice.id; the invoice carrying this lot's line, null until awarded."

  - name: Bid
    parent: AuctionItem
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> AuctionItem.id; the lot bid on."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the guest placing the bid."
      - name: amount_cents
        type: integer
        source: input
        description: "The placed amount."
        constraints: ">= 1"
      - name: proxy_max_cents
        type: integer
        source: input
        default: 0
        description: "Ceiling the mobile-bidding agent may auto-bid to; 0 means no proxy."
        constraints: ">= 0"
      - name: effective_max_cents
        type: integer
        source: computed
        description: "max(amount_cents, proxy_max_cents); the sort key for leading-bid selection."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Bid lifecycle state."
        constraints: "one of ACTIVE, WON, LOST, RETRACTED"

  - name: PaddleRaise
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala whose appeal this gift answers."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the donor raising the paddle."
      - name: invoice_id
        type: string
        source: system
        default: null
        description: "FK -> CheckoutInvoice.id; the invoice carrying this gift's line, null before invoicing."
      - name: level_cents
        type: integer
        source: input
        description: "Appeal level called from the stage."
        constraints: ">= 1"
      - name: match_cents
        type: integer
        source: computed
        default: 0
        description: "Challenge-match dollars unlocked by this gift; see calculations.paddle_raise_match."
      - name: settlement_status
        type: enum
        source: system
        default: UNSETTLED
        description: "Money dimension of the gift."
        constraints: "one of UNSETTLED, INVOICED, PAID"

  - name: Pledge
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala the pledge was made at."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the pledging donor."
      - name: total_amount_cents
        type: integer
        source: input
        description: "Full promised amount across all installments."
        constraints: ">= 1"
      - name: installment_count
        type: integer
        source: input
        description: "Number of installments promised."
        constraints: ">= 1"
      - name: first_due_utc
        type: datetime
        source: input
        description: "Due date of the first installment; anchors the lapse grace window."
      - name: received_amount_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative cash received against this pledge."
      - name: status
        type: enum
        source: system
        default: PROMISED
        description: "Pledge lifecycle state."
        constraints: "one of PROMISED, PARTIALLY_FULFILLED, FULFILLED, LAPSED"

  - name: CheckoutInvoice
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala being checked out."
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the guest being billed."
      - name: cover_processing_fee
        type: boolean
        source: input
        default: false
        description: "When true the guest elects to absorb the processing fee, which is added on top of the line subtotal."
      - name: line_items
        type: array
        source: computed
        description: "Objects { line_type, source_id, amount_cents }; line_type one of AUCTION_ITEM, TICKET, PADDLE_RAISE, PROCESSING_FEE."
      - name: line_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of line_items amounts excluding the PROCESSING_FEE line."
      - name: processing_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Tiered fee computed once from line_subtotal_cents; see calculations.invoice_totals."
      - name: total_due_cents
        type: integer
        source: computed
        default: 0
        description: "line_subtotal_cents plus processing_fee_cents when cover_processing_fee is true, otherwise line_subtotal_cents."
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of PaymentTransaction.amount_cents with status CAPTURED against this invoice."
      - name: balance_due_cents
        type: integer
        source: computed
        default: 0
        description: "total_due_cents - amount_paid_cents."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Invoice lifecycle state."
        constraints: "one of OPEN, PENDING_PAYMENT, PARTIALLY_PAID, PAID, VOID"

  - name: PaymentTransaction
    parent: CheckoutInvoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> CheckoutInvoice.id; the invoice being paid."
      - name: amount_cents
        type: integer
        source: input
        description: "Amount tendered."
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: "Tender type."
        constraints: "one of CARD, CASH, CHECK"
      - name: status
        type: enum
        source: system
        default: CAPTURED
        description: "Payment lifecycle state."
        constraints: "one of CAPTURED, VOIDED"
      - name: captured_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who captured the payment."
      - name: voided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the FinanceOfficer who voided the payment; must differ from captured_by_user_id."
      - name: void_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the payment was voided."

  - name: Receipt
    parent: CheckoutInvoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> CheckoutInvoice.id; the fully paid invoice being receipted."
      - name: bidder_id
        type: string
        source: system
        description: "FK -> Bidder.id; copied from the invoice at issue time."
      - name: total_paid_cents
        type: integer
        source: computed
        description: "CheckoutInvoice.amount_paid_cents at issue time."
      - name: benefit_value_cents
        type: integer
        source: computed
        description: "Total non-deductible benefit across the invoice's lines."
      - name: tax_deductible_cents
        type: integer
        source: computed
        description: "See calculations.receipt_tax_deductible."
      - name: issued_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the receipt was issued."

  - name: ReconciliationRun
    parent: GalaEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> GalaEvent.id; the gala being reconciled."
      - name: revenue_basis
        type: enum
        source: input
        description: "Which pledge-recognition variant the run applies."
        constraints: "one of BOOKED, CASH_BASIS"
      - name: expected_total_cents
        type: integer
        source: computed
        description: "Sum of channel expected amounts under revenue_basis; see calculations.event_reconciliation."
      - name: collected_total_cents
        type: integer
        source: computed
        description: "GalaEvent.gross_collected_cents at run time."
      - name: variance_cents
        type: integer
        source: computed
        description: "expected_total_cents - collected_total_cents."
      - name: is_material_variance
        type: boolean
        source: computed
        description: "abs(variance_cents) >= MATERIAL_VARIANCE_THRESHOLD_CENTS."
      - name: channel_breakdown
        type: array
        source: computed
        description: "Objects { channel, expected_cents } for channels TICKETS, AUCTION, PADDLE, PLEDGE, SPONSORSHIP, in that fixed order."
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who created the run."
      - name: finalized_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the FinanceOfficer who finalized the run; must differ from prepared_by_user_id."
      - name: status
        type: enum
        source: system
        default: PREPARED
        description: "Run lifecycle state."
        constraints: "one of PREPARED, FINALIZED, SUPERSEDED"

state_machines:
  - entity: GalaEvent
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/events/{id}/publish"
        actor: EventOrganizer
        preconditions:
          - "event.status == DRAFT"
          - "at least one TicketTable exists with TicketTable.event_id == event.id"
        side_effects:
          - "recompute GalaEvent.posture (becomes OPEN)"
          - "increments GalaEvent.version by 1"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /api/events/{id}/unpublish"
        actor: EventOrganizer
        preconditions:
          - "event.status == PUBLISHED"
          - "no TicketOrder of this event has payment_status IN {INVOICED, PAID}"
        side_effects:
          - "every TableHold whose table belongs to this event and whose status == HELD transitions to RELEASED"
          - "each released hold's TicketTable recomputes seats_reserved and status"
          - "increments GalaEvent.version by 1"
        note: "Revert edge; makes the GalaEvent machine branching rather than linear."
      - from: PUBLISHED
        to: LIVE
        trigger: "POST /api/events/{id}/go-live"
        actor: EventOrganizer
        preconditions:
          - "event.status == PUBLISHED"
          - "logical clock < event.event_end_utc"
        side_effects:
          - "every AuctionItem of this event with listing_status == DRAFT and open_at_utc <= clock < close_at_utc transitions to OPEN (cascade down)"
          - "recompute GalaEvent.open_lot_count"
          - "recompute GalaEvent.posture (stays OPEN)"
          - "increments GalaEvent.version by 1"
      - from: LIVE
        to: SETTLING
        trigger: "POST /api/events/{id}/start-settlement"
        actor: EventOrganizer
        preconditions:
          - "event.status == LIVE"
          - "event.open_lot_count == 0 else ERR_OPEN_LOTS_REMAIN"
        side_effects:
          - "recompute GalaEvent.posture (becomes RESTRICTED)"
          - "increments GalaEvent.version by 1"
      - from: SETTLING
        to: CLOSED
        trigger: "POST /api/events/{id}/close"
        actor: EventOrganizer
        preconditions:
          - "event.status == SETTLING"
          - "event.unpaid_invoice_count == 0 else ERR_OPEN_INVOICES_REMAIN"
          - "at least one ReconciliationRun of this event has status == FINALIZED else ERR_NO_FINALIZED_RUN"
        side_effects:
          - "every Pledge of this event with status == PROMISED and clock > first_due_utc + PLEDGE_LAPSE_GRACE_DAYS transitions to LAPSED"
          - "recompute GalaEvent.posture (becomes FROZEN)"
          - "increments GalaEvent.version by 1"

  - entity: TableHold
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /api/ticket-orders (system, when the ordering bidder holds this table)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "hold.bidder_id == the new TicketOrder.bidder_id and hold.table_id == the new TicketOrder.table_id"
        side_effects:
          - "increments TableHold.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /api/table-holds/{id}/release"
        actor: EventOrganizer
        preconditions:
          - "hold.status == HELD"
        side_effects:
          - "the hold's TicketTable recomputes status"
          - "increments TableHold.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /api/events/{id}/unpublish (system cascade)"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "the hold's TicketTable.event_id == the unpublished event.id"
        side_effects:
          - "the hold's TicketTable recomputes status"
          - "increments TableHold.version by 1"

  - entity: TicketOrder
    initial_state: UNBILLED
    terminal_states: [REFUNDED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /api/invoices/{id}/finalize (system cascade over the bidder's UNBILLED ticket orders)"
        actor: system
        preconditions:
          - "order.payment_status == UNBILLED"
          - "order.event_id == invoice.event_id and order.bidder_id == invoice.bidder_id"
        side_effects:
          - "sets TicketOrder.invoice_id to the invoice id"
          - "increments TicketOrder.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /api/payments (system cascade when the invoice reaches PAID)"
        actor: system
        preconditions:
          - "order.payment_status == INVOICED"
          - "the order's CheckoutInvoice.status == PAID"
        side_effects:
          - "increments TicketOrder.version by 1"
      - from: INVOICED
        to: UNBILLED
        trigger: "POST /api/invoices/{id}/void (system cascade)"
        actor: system
        preconditions:
          - "order.payment_status == INVOICED"
        side_effects:
          - "clears TicketOrder.invoice_id to null"
          - "increments TicketOrder.version by 1"
      - from: UNBILLED
        to: REFUNDED
        trigger: "POST /api/ticket-orders/{id}/cancel"
        actor: EventOrganizer
        preconditions:
          - "order.payment_status IN {UNBILLED, PAID}"
        side_effects:
          - "sets TicketOrder.seating_status to RELEASED"
          - "the order's TicketTable recomputes seats_reserved (decreases by order.seat_count) and status"
          - "increments TicketOrder.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /api/ticket-orders/{id}/cancel"
        actor: EventOrganizer
        preconditions:
          - "order.payment_status == PAID"
        side_effects:
          - "sets TicketOrder.seating_status to RELEASED"
          - "the order's TicketTable recomputes seats_reserved and status"
          - "increments TicketOrder.version by 1"
    note: |
      Parallel dimensions on one row: payment_status (UNBILLED -> INVOICED -> PAID -> REFUNDED)
      evolves independently of seating_status (UNSEATED -> SEATED -> RELEASED). The seating
      axis is driven only by POST /api/ticket-orders/{id}/assign-seats (UNSEATED -> SEATED)
      and by cancel (any -> RELEASED); the billing axis never changes seating_status except
      on cancel.

  - entity: Sponsor
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /api/sponsors/{id}/confirm"
        actor: FinanceOfficer
        preconditions:
          - "sponsor.status == PENDING"
          - "sponsor.paid_amount_cents + paid_amount_cents >= sponsor.commitment_cents"
        side_effects:
          - "increases Sponsor.paid_amount_cents by paid_amount_cents"
          - "increments Sponsor.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /api/sponsors/{id}/withdraw"
        actor: EventOrganizer
        preconditions:
          - "sponsor.status == PENDING"
          - "no ProgramAd of this sponsor has status == PLACED"
        side_effects:
          - "every ProgramAd of this sponsor with status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED} transitions to REJECTED"
          - "increments Sponsor.version by 1"

  - entity: ProgramAd
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PLACED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /api/program-ads/{id}/review with decision BEGIN_REVIEW"
        actor: EventOrganizer
        preconditions:
          - "ad.status == SUBMITTED"
        side_effects:
          - "increments ProgramAd.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /api/program-ads/{id}/review with decision REQUEST_CHANGES"
        actor: EventOrganizer
        preconditions:
          - "ad.status == IN_REVIEW"
          - "notes is present and non-empty"
        side_effects:
          - "sets ProgramAd.review_notes to notes"
          - "increments ProgramAd.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/program-ads/{id}/resubmit"
        actor: Sponsor
        preconditions:
          - "ad.status == CHANGES_REQUESTED"
          - "ad.revision_count < MAX_AD_REVISIONS else ERR_AD_REVISION_LIMIT"
        side_effects:
          - "increments ProgramAd.revision_count by 1"
          - "replaces ProgramAd.artwork_ref with the submitted artwork_ref"
          - "increments ProgramAd.version by 1"
        note: "Cycle edge: CHANGES_REQUESTED -> SUBMITTED -> IN_REVIEW -> CHANGES_REQUESTED."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/program-ads/{id}/review with decision APPROVE"
        actor: EventOrganizer
        preconditions:
          - "ad.status == IN_REVIEW"
          - "the ad's Sponsor (ProgramAd.sponsor_id -> Sponsor.id) has status == CONFIRMED else ERR_SPONSOR_NOT_CONFIRMED"
        side_effects:
          - "increments ProgramAd.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /api/program-ads/{id}/review with decision REJECT"
        actor: EventOrganizer
        preconditions:
          - "ad.status == IN_REVIEW"
        side_effects:
          - "sets ProgramAd.review_notes to notes when notes is present"
          - "increments ProgramAd.version by 1"
      - from: APPROVED
        to: PLACED
        trigger: "POST /api/program-ads/{id}/place"
        actor: EventOrganizer
        preconditions:
          - "ad.status == APPROVED"
          - "the ad's GalaEvent.status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "sets ProgramAd.page_number to the submitted page_number"
          - "the ad's Sponsor recomputes placed_ad_count (increases by 1)"
          - "increments ProgramAd.version by 1"

  - entity: AuctionItem
    initial_state: DRAFT
    terminal_states: [AWARDED, PASSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/auction-items/{id}/open"
        actor: AuctionManager
        preconditions:
          - "item.listing_status == DRAFT"
          - "the item's GalaEvent.status IN {PUBLISHED, LIVE} else ERR_INVALID_STATE"
          - "the item's GalaEvent.posture == OPEN else ERR_EVENT_RESTRICTED / ERR_EVENT_FROZEN"
          - "item.open_at_utc <= clock < item.close_at_utc else ERR_LOT_WINDOW_CLOSED"
          - "when item.live_lot_sequence is not null, no other AuctionItem of the same event with the same live_lot_sequence and listing_status == OPEN has a window overlapping [open_at_utc, close_at_utc) else ERR_LOT_WINDOW_CONFLICT"
        side_effects:
          - "the item's GalaEvent recomputes open_lot_count (increases by 1)"
          - "increments AuctionItem.version by 1"
      - from: OPEN
        to: AWARDED
        trigger: "POST /api/auction-items/{id}/close"
        actor: AuctionManager
        preconditions:
          - "item.listing_status == OPEN"
          - "at least one Bid of this item has status == ACTIVE"
        side_effects:
          - "sets AuctionItem.hammer_price_cents to the PROXY_SETTLED variant of calculations.auction_item_valuation"
          - "sets AuctionItem.winning_bid_id to the leading Bid.id"
          - "the leading Bid transitions ACTIVE -> WON; every other ACTIVE Bid of this item transitions ACTIVE -> LOST"
          - "hop 2: the winner's OPEN CheckoutInvoice for this event is located (created if none exists) and an AUCTION_ITEM line of hammer_price_cents is appended; AuctionItem.invoice_id and settlement_status := INVOICED are set"
          - "hop 3: that invoice recomputes line_subtotal_cents, processing_fee_cents, total_due_cents and balance_due_cents"
          - "hop 4: the invoice's Bidder recomputes outstanding_balance_cents from its PENDING_PAYMENT / PARTIALLY_PAID invoices"
          - "the item's GalaEvent recomputes open_lot_count (decreases by 1)"
          - "increments AuctionItem.version by 1"
        note: "Depth-4 transitive cascade: close -> invoice line -> invoice totals -> bidder balance."
      - from: OPEN
        to: PASSED
        trigger: "POST /api/auction-items/{id}/close"
        actor: AuctionManager
        preconditions:
          - "item.listing_status == OPEN"
          - "zero Bids of this item have status == ACTIVE"
        side_effects:
          - "AuctionItem.hammer_price_cents stays null and settlement_status stays UNSETTLED"
          - "no CheckoutInvoice is created or modified"
          - "the item's GalaEvent recomputes open_lot_count (decreases by 1)"
          - "increments AuctionItem.version by 1"
        note: "Empty-set branch of the fork; divergent side-effect set from the AWARDED branch."
      - from: UNSETTLED
        to: INVOICED
        trigger: "POST /api/auction-items/{id}/close (settlement dimension, system)"
        actor: system
        preconditions:
          - "item.settlement_status == UNSETTLED"
          - "item.listing_status becomes AWARDED in the same request"
        side_effects:
          - "increments AuctionItem.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /api/payments (settlement dimension, system, when the invoice reaches PAID)"
        actor: system
        preconditions:
          - "item.settlement_status == INVOICED"
          - "the item's CheckoutInvoice.status == PAID"
        side_effects:
          - "increments AuctionItem.version by 1"
      - from: INVOICED
        to: UNSETTLED
        trigger: "POST /api/invoices/{id}/void (settlement dimension, system)"
        actor: system
        preconditions:
          - "item.settlement_status == INVOICED"
        side_effects:
          - "clears AuctionItem.invoice_id to null"
          - "increments AuctionItem.version by 1"
    note: |
      Parallel dimensions on one row: listing_status (DRAFT -> OPEN -> {AWARDED | PASSED})
      and settlement_status (UNSETTLED -> INVOICED -> PAID, with INVOICED -> UNSETTLED as
      the compensating edge) evolve independently.

  - entity: Bid
    initial_state: ACTIVE
    terminal_states: [WON, LOST, RETRACTED]
    transitions:
      - from: ACTIVE
        to: WON
        trigger: "POST /api/auction-items/{id}/close (system)"
        actor: system
        preconditions:
          - "bid.status == ACTIVE"
          - "bid is the leading bid of the item under the PROXY_SETTLED ranking"
        side_effects:
          - "increments Bid.version by 1"
      - from: ACTIVE
        to: LOST
        trigger: "POST /api/auction-items/{id}/close (system)"
        actor: system
        preconditions:
          - "bid.status == ACTIVE"
          - "bid is not the leading bid of the item"
        side_effects:
          - "increments Bid.version by 1"
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /api/bids/{id}/retract"
        actor: AuctionManager
        preconditions:
          - "bid.status == ACTIVE"
          - "the bid's AuctionItem.listing_status == OPEN else ERR_ITEM_NOT_OPEN"
        side_effects:
          - "the bid's AuctionItem recomputes current_leading_amount_cents over its remaining ACTIVE bids"
          - "increments Bid.version by 1"

  - entity: CheckoutInvoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PENDING_PAYMENT
        trigger: "POST /api/invoices/{id}/finalize"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == OPEN"
          - "invoice.line_subtotal_cents > 0 else ERR_INVALID_STATE"
        side_effects:
          - "every UNBILLED TicketOrder of this event and bidder transitions to INVOICED and gains a TICKET line"
          - "every UNSETTLED PaddleRaise of this event and bidder transitions to INVOICED and gains a PADDLE_RAISE line"
          - "recompute invoice totals per calculations.invoice_totals"
          - "the invoice's Bidder recomputes outstanding_balance_cents"
          - "the invoice's GalaEvent recomputes unpaid_invoice_count"
          - "increments CheckoutInvoice.version by 1"
      - from: PENDING_PAYMENT
        to: PARTIALLY_PAID
        trigger: "POST /api/payments (system, capture leaves balance_due_cents > 0)"
        actor: system
        preconditions:
          - "invoice.status == PENDING_PAYMENT"
          - "amount_paid_cents > 0 and balance_due_cents > 0 after the capture"
        side_effects:
          - "recompute amount_paid_cents and balance_due_cents"
          - "the invoice's Bidder recomputes outstanding_balance_cents"
          - "increments CheckoutInvoice.version by 1"
      - from: PENDING_PAYMENT
        to: PAID
        trigger: "POST /api/payments (system, capture clears the balance)"
        actor: system
        preconditions:
          - "invoice.status == PENDING_PAYMENT"
          - "balance_due_cents == 0 after the capture"
        side_effects:
          - "hop 2: every AuctionItem with invoice_id == invoice.id moves settlement_status INVOICED -> PAID; every PaddleRaise likewise; every TicketOrder moves payment_status INVOICED -> PAID"
          - "hop 3: the invoice's GalaEvent recomputes gross_collected_cents and unpaid_invoice_count, then recomputes posture"
          - "the invoice's Bidder recomputes outstanding_balance_cents"
          - "increments CheckoutInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /api/payments (system, later capture clears the balance)"
        actor: system
        preconditions:
          - "invoice.status == PARTIALLY_PAID"
          - "balance_due_cents == 0 after the capture"
        side_effects:
          - "same cascade as PENDING_PAYMENT -> PAID"
          - "increments CheckoutInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PENDING_PAYMENT
        trigger: "POST /api/payments/{id}/void (system, void leaves amount_paid_cents == 0)"
        actor: system
        preconditions:
          - "invoice.status == PARTIALLY_PAID"
          - "amount_paid_cents == 0 after the void"
        side_effects:
          - "recompute amount_paid_cents and balance_due_cents"
          - "the invoice's Bidder recomputes outstanding_balance_cents"
          - "increments CheckoutInvoice.version by 1"
        note: "Cycle edge: PENDING_PAYMENT -> PARTIALLY_PAID -> PENDING_PAYMENT."
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /api/payments/{id}/void (system, void leaves amount_paid_cents > 0)"
        actor: system
        preconditions:
          - "invoice.status == PAID"
          - "no Receipt exists with invoice_id == invoice.id else ERR_RECEIPT_ALREADY_ISSUED"
          - "amount_paid_cents > 0 after the void"
        side_effects:
          - "every AuctionItem / PaddleRaise with invoice_id == invoice.id moves settlement_status PAID -> INVOICED; every TicketOrder moves payment_status PAID -> INVOICED"
          - "the invoice's GalaEvent recomputes gross_collected_cents and unpaid_invoice_count"
          - "increments CheckoutInvoice.version by 1"
      - from: PAID
        to: PENDING_PAYMENT
        trigger: "POST /api/payments/{id}/void (system, void leaves amount_paid_cents == 0)"
        actor: system
        preconditions:
          - "invoice.status == PAID"
          - "no Receipt exists with invoice_id == invoice.id else ERR_RECEIPT_ALREADY_ISSUED"
          - "amount_paid_cents == 0 after the void"
        side_effects:
          - "hop 2: every AuctionItem / PaddleRaise with invoice_id == invoice.id moves settlement_status PAID -> INVOICED; every TicketOrder moves payment_status PAID -> INVOICED"
          - "hop 3: the invoice's GalaEvent recomputes gross_collected_cents (decreases by the voided amount) and unpaid_invoice_count"
          - "hop 4: the invoice's Bidder recomputes outstanding_balance_cents"
          - "increments CheckoutInvoice.version by 1"
        note: "Compensating cascade for the capture path; conserves the money invariant."
      - from: OPEN
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == OPEN"
        side_effects:
          - "every AuctionItem with invoice_id == invoice.id moves settlement_status INVOICED -> UNSETTLED and clears invoice_id"
          - "increments CheckoutInvoice.version by 1"
      - from: PENDING_PAYMENT
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "invoice.status == PENDING_PAYMENT"
          - "invoice.amount_paid_cents == 0 else ERR_INVOICE_NOT_PAYABLE"
        side_effects:
          - "every AuctionItem / PaddleRaise with invoice_id == invoice.id reverts settlement_status to UNSETTLED and clears invoice_id; every TicketOrder reverts payment_status to UNBILLED and clears invoice_id"
          - "the invoice's GalaEvent recomputes unpaid_invoice_count"
          - "the invoice's Bidder recomputes outstanding_balance_cents"
          - "increments CheckoutInvoice.version by 1"

  - entity: PaymentTransaction
    initial_state: CAPTURED
    terminal_states: [VOIDED]
    transitions:
      - from: CAPTURED
        to: VOIDED
        trigger: "POST /api/payments/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "payment.status == CAPTURED"
          - "the acting X-User-ID != payment.captured_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "no Receipt exists for payment.invoice_id else ERR_RECEIPT_ALREADY_ISSUED"
        side_effects:
          - "sets voided_by_user_id and void_reason"
          - "the payment's CheckoutInvoice recomputes amount_paid_cents / balance_due_cents and transitions per the CheckoutInvoice machine"
          - "increments PaymentTransaction.version by 1"

  - entity: Pledge
    initial_state: PROMISED
    terminal_states: [FULFILLED, LAPSED]
    transitions:
      - from: PROMISED
        to: PARTIALLY_FULFILLED
        trigger: "POST /api/pledges/{id}/installments"
        actor: FinanceOfficer
        preconditions:
          - "pledge.status == PROMISED"
          - "pledge.received_amount_cents + amount_cents < pledge.total_amount_cents"
        side_effects:
          - "increases Pledge.received_amount_cents by amount_cents"
          - "increments Pledge.version by 1"
      - from: PARTIALLY_FULFILLED
        to: PARTIALLY_FULFILLED
        trigger: "POST /api/pledges/{id}/installments"
        actor: FinanceOfficer
        preconditions:
          - "pledge.status == PARTIALLY_FULFILLED"
          - "pledge.received_amount_cents + amount_cents < pledge.total_amount_cents"
        side_effects:
          - "increases Pledge.received_amount_cents by amount_cents"
          - "increments Pledge.version by 1"
        note: "Self-loop; the pledge machine is cyclic on PARTIALLY_FULFILLED."
      - from: PROMISED
        to: FULFILLED
        trigger: "POST /api/pledges/{id}/installments"
        actor: FinanceOfficer
        preconditions:
          - "pledge.status == PROMISED"
          - "pledge.received_amount_cents + amount_cents >= pledge.total_amount_cents"
        side_effects:
          - "increases Pledge.received_amount_cents by amount_cents"
          - "increments Pledge.version by 1"
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "POST /api/pledges/{id}/installments"
        actor: FinanceOfficer
        preconditions:
          - "pledge.status == PARTIALLY_FULFILLED"
          - "pledge.received_amount_cents + amount_cents >= pledge.total_amount_cents"
        side_effects:
          - "increases Pledge.received_amount_cents by amount_cents"
          - "increments Pledge.version by 1"
      - from: PROMISED
        to: LAPSED
        trigger: "POST /api/pledges/{id}/lapse"
        actor: FinanceOfficer
        preconditions:
          - "pledge.status IN {PROMISED, PARTIALLY_FULFILLED}"
          - "clock > pledge.first_due_utc + PLEDGE_LAPSE_GRACE_DAYS else ERR_INVALID_STATE"
        side_effects:
          - "increments Pledge.version by 1"
      - from: PARTIALLY_FULFILLED
        to: LAPSED
        trigger: "POST /api/pledges/{id}/lapse"
        actor: FinanceOfficer
        preconditions:
          - "pledge.status == PARTIALLY_FULFILLED"
          - "clock > pledge.first_due_utc + PLEDGE_LAPSE_GRACE_DAYS else ERR_INVALID_STATE"
        side_effects:
          - "increments Pledge.version by 1"
      - from: PROMISED
        to: LAPSED
        trigger: "POST /api/events/{id}/close (system cascade)"
        actor: system
        preconditions:
          - "pledge.status == PROMISED"
          - "clock > pledge.first_due_utc + PLEDGE_LAPSE_GRACE_DAYS"
        side_effects:
          - "increments Pledge.version by 1"

  - entity: ReconciliationRun
    initial_state: PREPARED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PREPARED
        to: FINALIZED
        trigger: "POST /api/reconciliation-runs/{id}/finalize"
        actor: FinanceOfficer
        preconditions:
          - "run.status == PREPARED"
          - "the acting X-User-ID != run.prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "run.is_material_variance == false OR variance_override_note is present and non-empty else ERR_MATERIAL_VARIANCE"
          - "the run's GalaEvent.unpaid_invoice_count == 0 else ERR_OPEN_INVOICES_REMAIN"
        side_effects:
          - "sets ReconciliationRun.finalized_by_user_id to the acting X-User-ID"
          - "the run's GalaEvent recomputes posture (becomes FROZEN)"
          - "increments ReconciliationRun.version by 1"
      - from: FINALIZED
        to: PREPARED
        trigger: "POST /api/reconciliation-runs/{id}/reopen"
        actor: FinanceOfficer
        preconditions:
          - "run.status == FINALIZED"
          - "the run's GalaEvent.status != CLOSED else ERR_INVALID_STATE"
        side_effects:
          - "clears finalized_by_user_id to null"
          - "recomputes expected_total_cents, collected_total_cents, variance_cents, is_material_variance and channel_breakdown"
          - "the run's GalaEvent recomputes posture (the FINALIZED-run FROZEN gate is lifted; posture becomes RESTRICTED when event.status == SETTLING, otherwise OPEN)"
          - "increments ReconciliationRun.version by 1"
        note: "Cycle edge: PREPARED -> FINALIZED -> PREPARED."
      - from: PREPARED
        to: SUPERSEDED
        trigger: "POST /api/events/{id}/reconciliation-runs (system, a newer run is created)"
        actor: system
        preconditions:
          - "run.status == PREPARED"
          - "a new ReconciliationRun for the same event is being created"
        side_effects:
          - "increments ReconciliationRun.version by 1"

concurrency_rules:
  - rule_id: recon-run-create-stale-event
    parent_entity: GalaEvent
    write_endpoint: "POST /api/events/{id}/reconciliation-runs"
    occ_field: "expected_event_version"
    description: |
      Creating a ReconciliationRun against a GalaEvent whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A newly created run legitimately supersedes any existing PREPARED run for
      the event, so the second create is not blocked by any state precondition;
      OCC on GalaEvent.version is what makes the outcome deterministic.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

calculations:
  - name: event_posture
    trigger: "recomputed on every GalaEvent transition, on ReconciliationRun finalize/reopen, and read on every child mutation"
    algorithm: threshold
    formula: |
      if event.status == 'CLOSED':
          posture = 'FROZEN'
      elif exists ReconciliationRun r where r.event_id == event.id and r.status == 'FINALIZED':
          posture = 'FROZEN'
      elif event.status == 'SETTLING':
          posture = 'RESTRICTED'
      else:
          posture = 'OPEN'
    input_set: "The event row itself plus its ReconciliationRun children with status == FINALIZED (SUPERSEDED and PREPARED runs are ignored)."
    constants: {}
    precision: "enum value, no rounding"
    gating: |
      posture == 'FROZEN'      -> every mutating endpoint on a child of the event is rejected
                                  with ERR_EVENT_FROZEN, EXCEPT the five GalaEvent lifecycle
                                  endpoints and the three ReconciliationRun endpoints
                                  (create / finalize / reopen).
      posture == 'RESTRICTED'  -> POST /api/table-holds, POST /api/ticket-orders,
                                  POST /api/auction-items, POST /api/auction-items/{id}/open,
                                  POST /api/auction-items/{id}/bids and POST /api/paddle-raises
                                  are rejected with ERR_EVENT_RESTRICTED; invoices, payments,
                                  receipts, pledges and reconciliation remain permitted.
      posture == 'OPEN'        -> no posture gate applies.

  - name: ticket_order_total
    trigger: "POST /api/ticket-orders (sets TicketOrder.unit_price_cents, subtotal_cents, benefit_value_cents, early_bird_applied)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - early-bird eligibility (boundary is inclusive on the cutoff instant)
      cutoff = event.event_start_utc - EARLY_BIRD_DAYS_BEFORE_EVENT days
      early_bird_applied = (clock <= cutoff)

      # Step 2 - base price and unit count by order_type
      if order.order_type == 'TABLE':
          base_cents = table.table_price_cents
          units      = 1
      else:  # 'SEAT'
          base_cents = table.seat_price_cents
          units      = order.seat_count

      # Step 3 - discount rate
      if not early_bird_applied:
          rate = 0.00
      elif order.order_type == 'TABLE':
          rate = EARLY_BIRD_TABLE_DISCOUNT_RATE
      else:
          rate = EARLY_BIRD_SEAT_DISCOUNT_RATE

      # Step 4 - PINNED ROUNDING ORDER: round the PER-UNIT price first, then multiply.
      #   unit_price_cents = round_half_up(base_cents * (1 - rate))
      #   subtotal_cents   = unit_price_cents * units
      # The alternative order (round_half_up(base_cents * units * (1 - rate))) is NOT used
      # and yields a different number whenever base_cents * rate has a fractional cent.
      unit_price_cents = round_half_up(base_cents * (1 - rate))
      subtotal_cents   = unit_price_cents * units

      # Step 5 - non-deductible dinner benefit
      benefit_value_cents = TICKET_BENEFIT_PER_SEAT_CENTS * order.seat_count
    input_set: "The single TicketOrder being created and its TicketTable; no other orders participate."
    constants:
      EARLY_BIRD_DAYS_BEFORE_EVENT: 30
      EARLY_BIRD_TABLE_DISCOUNT_RATE: 0.15
      EARLY_BIRD_SEAT_DISCOUNT_RATE: 0.10
      TICKET_BENEFIT_PER_SEAT_CENTS: 7500
    precision: "integer cents, round_half_up applied exactly once, at the per-unit step"

  - name: auction_item_valuation
    trigger: "recomputed on POST /api/auction-items/{id}/bids and POST /api/bids/{id}/retract (writes AuctionItem.current_leading_amount_cents); frozen into AuctionItem.hammer_price_cents on POST /api/auction-items/{id}/close; both variants readable via GET /api/auction-items/{id}/valuation"
    algorithm: forward_looking
    formula: |
      active = [b for b in Bids where b.item_id == item.id and b.status == 'ACTIVE']
      if len(active) == 0:
          amount_cents = 0 ; source_bid_id = null
      else:
          # ranking: effective_max_cents DESC, then created_at ASC (earliest bid wins ties)
          active.sort(key=(-b.effective_max_cents, b.created_at))
          top = active[0]
          if len(active) == 1:
              runner_effective = null
          else:
              runner_effective = active[1].effective_max_cents
          source_bid_id = top.id
          # variant selection - see variants below
    input_set: "Bids of this item with status == ACTIVE only; RETRACTED, WON and LOST bids are excluded."
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: PROXY_SETTLED
        when: "Used for AuctionItem.current_leading_amount_cents, for the bid-increment check, and frozen into hammer_price_cents at close."
        difference: |
          amount_cents = top.amount_cents                     if runner_effective is null
          amount_cents = min(top.effective_max_cents,
                             runner_effective + item.min_increment_cents)  otherwise
          The proxy agent lifts the leader only as far as one increment above the
          runner-up's ceiling, capped by the leader's own ceiling.
      - name: PLACED_AMOUNT
        when: "Reported by GET /api/auction-items/{id}/valuation?variant=PLACED_AMOUNT for the paper bid-sheet reconciliation."
        difference: |
          amount_cents = top.amount_cents, always - the literal amount the leading
          bidder typed, ignoring proxy_max_cents entirely. Produces a strictly smaller
          number than PROXY_SETTLED whenever the leader is leading on proxy ceiling
          rather than on placed amount.

  - name: paddle_raise_match
    trigger: "POST /api/paddle-raises (sets PaddleRaise.match_cents and bumps GalaEvent.match_awarded_cents)"
    algorithm: waterfall_allocation
    formula: |
      remaining_cap = max(0, event.match_cap_cents - event.match_awarded_cents)
      raw_match     = round_half_up(gift.level_cents * MATCH_RATIO)
      match_cents   = min(raw_match, remaining_cap)
      event.match_awarded_cents += match_cents
    input_set: "The gift being created plus the event's running match_awarded_cents; paddle raises are consumed in created_at ASC order, so the cap drains chronologically."
    constants:
      MATCH_RATIO: 1.0
    precision: "integer cents, round_half_up"

  - name: invoice_totals
    trigger: "recomputed whenever a line is appended (auction close, invoice finalize) or a PaymentTransaction is captured or voided"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER - the fee looks circular (the guest may elect to pay the
      # fee, which raises the amount charged, which could cross a fee tier). It does not:
      # the tier and the fee are resolved ONCE from the pre-fee subtotal and are never
      # recomputed against the grossed-up total.
      # 1
      line_subtotal_cents = sum(l.amount_cents for l in invoice.line_items
                                if l.line_type != 'PROCESSING_FEE')
      # 2  tier selection on the PRE-FEE subtotal
      if   line_subtotal_cents <  FEE_TIER_1_CEILING_CENTS: rate = FEE_RATE_TIER_1
      elif line_subtotal_cents <  FEE_TIER_2_CEILING_CENTS: rate = FEE_RATE_TIER_2
      else:                                                 rate = FEE_RATE_TIER_3
      # 3
      processing_fee_cents = round_half_up(line_subtotal_cents * rate) + PROCESSING_FEE_FLAT_CENTS
      # 4  the fee becomes a real charge only when the guest elected to cover it
      if invoice.cover_processing_fee:
          total_due_cents = line_subtotal_cents + processing_fee_cents
          # a PROCESSING_FEE line of processing_fee_cents is present in line_items
      else:
          total_due_cents = line_subtotal_cents
      # 5
      amount_paid_cents = sum(p.amount_cents for p in PaymentTransactions
                              where p.invoice_id == invoice.id and p.status == 'CAPTURED')
      balance_due_cents = total_due_cents - amount_paid_cents
    input_set: "All non-PROCESSING_FEE lines of this invoice, plus its CAPTURED payments; VOIDED payments are excluded."
    constants:
      FEE_TIER_1_CEILING_CENTS: 50000
      FEE_TIER_2_CEILING_CENTS: 500000
      FEE_RATE_TIER_1: 0.029
      FEE_RATE_TIER_2: 0.024
      FEE_RATE_TIER_3: 0.019
      PROCESSING_FEE_FLAT_CENTS: 30
    precision: "integer cents; round_half_up applied exactly once, to the percentage component, before the flat component is added"

  - name: receipt_tax_deductible
    trigger: "POST /api/receipts (sets Receipt.total_paid_cents, benefit_value_cents, tax_deductible_cents)"
    algorithm: aggregation
    formula: |
      benefit_value_cents = 0
      deductible = 0
      for line in invoice.line_items:
          if line.line_type == 'AUCTION_ITEM':
              item = AuctionItem where id == line.source_id
              benefit_value_cents += item.estimated_fmv_cents
              deductible += max(0, line.amount_cents - item.estimated_fmv_cents)
          elif line.line_type == 'TICKET':
              order = TicketOrder where id == line.source_id
              benefit_value_cents += order.benefit_value_cents
              deductible += max(0, line.amount_cents - order.benefit_value_cents)
          elif line.line_type == 'PADDLE_RAISE':
              deductible += line.amount_cents
          elif line.line_type == 'PROCESSING_FEE':
              deductible += line.amount_cents
      # de-minimis override: a token benefit is disregarded entirely
      if benefit_value_cents < FMV_DE_MINIMIS_CENTS:
          benefit_value_cents = 0
          deductible = invoice.total_due_cents
      total_paid_cents = invoice.amount_paid_cents
      tax_deductible_cents = deductible
    input_set: "Every line of the receipted invoice; the invoice must be in status PAID, so amount_paid_cents == total_due_cents."
    constants:
      FMV_DE_MINIMIS_CENTS: 1500
    precision: "integer cents, no rounding (all inputs are already whole cents)"

  - name: pledge_expected_revenue
    trigger: "POST /api/events/{id}/reconciliation-runs and POST /api/reconciliation-runs/{id}/reopen (feeds the PLEDGE channel of channel_breakdown)"
    algorithm: aggregation
    formula: |
      candidates = [p for p in Pledges where p.event_id == event.id]
      # variant selection - see variants below
    input_set: "All Pledge rows of the event; the two variants differ only in which rows and which amounts they admit."
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: BOOKED
        when: "ReconciliationRun.revenue_basis == 'BOOKED' (accrual view used by the board report)."
        difference: |
          pledge_expected_cents = sum(p.total_amount_cents for p in candidates
                                      if p.status IN {'PROMISED','PARTIALLY_FULFILLED','FULFILLED'})
          LAPSED pledges are excluded; the full promised amount is recognised the night it
          is promised, regardless of cash received.
      - name: CASH_BASIS
        when: "ReconciliationRun.revenue_basis == 'CASH_BASIS' (treasurer's bank-tie-out view)."
        difference: |
          pledge_expected_cents = sum(p.received_amount_cents for p in candidates
                                      if p.status IN {'PROMISED','PARTIALLY_FULFILLED','FULFILLED','LAPSED'})
          Every pledge including LAPSED contributes, but only cash actually received counts.

  - name: event_reconciliation
    trigger: "POST /api/events/{id}/reconciliation-runs and POST /api/reconciliation-runs/{id}/reopen"
    algorithm: aggregation
    formula: |
      # channel_breakdown is emitted in this exact fixed order
      tickets_cents     = sum(o.subtotal_cents for o in TicketOrders of the event
                              where o.payment_status IN {'INVOICED','PAID'})
      auction_cents     = sum(i.hammer_price_cents for i in AuctionItems of the event
                              where i.listing_status == 'AWARDED')
      paddle_cents      = sum(g.level_cents for g in PaddleRaises of the event
                              where g.settlement_status IN {'INVOICED','PAID'})
      pledge_cents      = calculations.pledge_expected_revenue under run.revenue_basis
      sponsorship_cents = sum(s.paid_amount_cents for s in Sponsors of the event
                              where s.status == 'CONFIRMED')

      expected_total_cents  = tickets_cents + auction_cents + paddle_cents
                              + pledge_cents + sponsorship_cents
      collected_total_cents = event.gross_collected_cents
      variance_cents        = expected_total_cents - collected_total_cents
      is_material_variance  = abs(variance_cents) >= MATERIAL_VARIANCE_THRESHOLD_CENTS
    input_set: "Each channel filters on the explicit status set shown; UNBILLED tickets, PASSED lots, UNSETTLED paddle raises, PENDING and WITHDRAWN sponsors and (under BOOKED) LAPSED pledges are excluded. Matching-gift dollars are reported on GalaEvent.match_awarded_cents and are NOT part of expected_total_cents."
    constants:
      MATERIAL_VARIANCE_THRESHOLD_CENTS: 5000
    precision: "integer cents, no rounding; the >= comparison against the threshold is inclusive"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body/query shape: required fields present, enum members valid, integers non-negative where constrained, limit within [1,100], offset >= 0, hold_end_utc > hold_start_utc, close_at_utc > open_at_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every referenced resource exists, validated left-to-right: path ids first, then body foreign keys in the order they appear in the endpoint's input list"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "for entity_backed roles, X-User-ID equals the resource's owning foreign key (Bidder.id for bidder-owned resources, Sponsor.id for sponsor-owned resources)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /api/auction-items/{id}/bids, POST /api/table-holds, POST /api/table-holds/{id}/release, POST /api/ticket-orders, POST /api/payments, POST /api/bidders/{id}/payment-method, POST /api/program-ads, POST /api/program-ads/{id}/resubmit"
  - priority: 6
    category: state
    check: "the owning GalaEvent.posture != FROZEN"
    error_id: ERR_EVENT_FROZEN
    http_status: 409
    applies_to: "every mutating endpoint on a child of a GalaEvent except the ReconciliationRun endpoints and the GalaEvent lifecycle endpoints"
  - priority: 7
    category: state
    check: "the owning GalaEvent.posture != RESTRICTED"
    error_id: ERR_EVENT_RESTRICTED
    http_status: 409
    applies_to: "POST /api/table-holds, POST /api/ticket-orders, POST /api/auction-items, POST /api/auction-items/{id}/open, POST /api/auction-items/{id}/bids, POST /api/paddle-raises"
  - priority: 8
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "the bid's AuctionItem.listing_status == OPEN and open_at_utc <= clock < close_at_utc"
    error_id: ERR_ITEM_NOT_OPEN
    http_status: 409
    applies_to: "POST /api/auction-items/{id}/bids, POST /api/bids/{id}/retract"
  - priority: 10
    category: state
    check: "the invoice is in a payable state (PENDING_PAYMENT or PARTIALLY_PAID) for capture; for void, amount_paid_cents == 0"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /api/payments, POST /api/invoices/{id}/void"
  - priority: 11
    category: state
    check: "the target ReconciliationRun is not already FINALIZED, and no FINALIZED run exists for the event when creating a new run"
    error_id: ERR_RUN_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /api/events/{id}/reconciliation-runs, POST /api/reconciliation-runs/{id}/finalize"
  - priority: 12
    category: state
    check: "the target Pledge is not in a terminal state (FULFILLED or LAPSED)"
    error_id: ERR_PLEDGE_TERMINAL
    http_status: 409
    applies_to: "POST /api/pledges/{id}/installments, POST /api/pledges/{id}/lapse"
  - priority: 13
    category: state
    check: "no Receipt has already been issued for this invoice"
    error_id: ERR_RECEIPT_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /api/receipts, POST /api/payments/{id}/void"
  - priority: 14
    category: state
    check: "expected_event_version equals the current GalaEvent.version"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /api/events/{id}/reconciliation-runs"
  - priority: 15
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from the user who performed the paired earlier step (ReconciliationRun.prepared_by_user_id on finalize; PaymentTransaction.captured_by_user_id on void)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/reconciliation-runs/{id}/finalize, POST /api/payments/{id}/void"
  - priority: 16
    category: business_referential
    check: "the ad's Sponsor (ProgramAd.sponsor_id -> Sponsor.id) has status == CONFIRMED"
    error_id: ERR_SPONSOR_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /api/program-ads/{id}/review with decision APPROVE"
  - priority: 17
    category: business_referential
    check: "the event has no CheckoutInvoice in status PENDING_PAYMENT or PARTIALLY_PAID (event.unpaid_invoice_count == 0)"
    error_id: ERR_OPEN_INVOICES_REMAIN
    http_status: 409
    applies_to: "POST /api/events/{id}/close, POST /api/reconciliation-runs/{id}/finalize"
  - priority: 18
    category: business_referential
    check: "at least one ReconciliationRun of the event has status == FINALIZED"
    error_id: ERR_NO_FINALIZED_RUN
    http_status: 409
    applies_to: "POST /api/events/{id}/close"
  - priority: 19
    category: business_referential
    check: "the event has no AuctionItem with listing_status == OPEN (event.open_lot_count == 0)"
    error_id: ERR_OPEN_LOTS_REMAIN
    http_status: 409
    applies_to: "POST /api/events/{id}/start-settlement"
  - priority: 20
    category: business_referential
    check: "the event has no TicketOrder with payment_status IN {INVOICED, PAID}"
    error_id: ERR_TICKET_ORDERS_EXIST
    http_status: 409
    applies_to: "POST /api/events/{id}/unpublish"
  - priority: 21
    category: business_temporal
    check: "the logical clock lies inside the lot's bidding window: open_at_utc <= clock < close_at_utc (half-open)"
    error_id: ERR_LOT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /api/auction-items/{id}/open"
  - priority: 22
    category: business_temporal
    check: "no other AuctionItem of the same event sharing the same non-null live_lot_sequence and listing_status == OPEN has a window overlapping [open_at_utc, close_at_utc); overlap uses half-open arithmetic, so a lot starting exactly when another ends does NOT conflict"
    error_id: ERR_LOT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/auction-items/{id}/open"
  - priority: 23
    category: business_temporal
    check: "no other TableHold on the same TicketTable with status == HELD sits within TABLE_TURNOVER_BUFFER_MINUTES of the requested closed interval; reject exactly when new.hold_start_utc < existing.hold_end_utc + 15 minutes AND existing.hold_start_utc < new.hold_end_utc + 15 minutes, so a gap of exactly 15 minutes is ACCEPTED"
    error_id: ERR_TABLE_HOLD_CONFLICT
    http_status: 409
    applies_to: "POST /api/table-holds"
  - priority: 24
    category: business_constraint
    check: "the bid clears the increment floor: with zero ACTIVE bids, amount_cents >= item.starting_bid_cents; otherwise amount_cents >= item.current_leading_amount_cents + item.min_increment_cents (>= is inclusive, so an exactly-on-the-floor bid is accepted)"
    error_id: ERR_BID_TOO_LOW
    http_status: 422
    applies_to: "POST /api/auction-items/{id}/bids"
  - priority: 25
    category: business_constraint
    check: "the ad has not exhausted its revision budget: revision_count < MAX_AD_REVISIONS (2)"
    error_id: ERR_AD_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /api/program-ads/{id}/resubmit"
  - priority: 26
    category: business_constraint
    check: "table capacity: table.seats_reserved + order.seat_count <= table.seat_count, and seat_count == table.seat_count when order_type == TABLE"
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/ticket-orders, POST /api/ticket-orders/{id}/assign-seats"
  - priority: 27
    category: business_constraint
    check: "paddle_number is unique within the event"
    error_id: ERR_DUPLICATE_PADDLE_NUMBER
    http_status: 409
    applies_to: "POST /api/bidders"
  - priority: 28
    category: business_fiscal
    check: "the acting Bidder has payment_method_on_file == true"
    error_id: ERR_NO_PAYMENT_METHOD
    http_status: 402
    applies_to: "POST /api/auction-items/{id}/bids, POST /api/paddle-raises"
  - priority: 29
    category: business_fiscal
    check: "the captured amount does not exceed the invoice's outstanding balance: amount_cents <= invoice.balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /api/payments"
  - priority: 30
    category: business_fiscal
    check: "a run with is_material_variance == true may only be finalized when variance_override_note is present and non-empty"
    error_id: ERR_MATERIAL_VARIANCE
    http_status: 409
    applies_to: "POST /api/reconciliation-runs/{id}/finalize"
  - priority: 31
    category: business_fiscal
    check: "the sponsorship payment brings paid_amount_cents to at least commitment_cents"
    error_id: ERR_SPONSOR_UNDERFUNDED
    http_status: 422
    applies_to: "POST /api/sponsors/{id}/confirm"

endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-07-01T00:00:00Z; before any call to this endpoint the server reads that instant and never falls back to real wall-clock time."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent window, early-bird and lapse evaluations use the new instant"]

  # ---- GalaEvent ----
  - method: POST
    path: "/api/events"
    description: "Create a gala event in DRAFT."
    roles: [EventOrganizer]
    code: 201
    input: [name, event_start_utc, event_end_utc, "match_cap_cents?"]
    output: GalaEvent
    side_effects: ["posture computed as OPEN"]
  - method: GET
    path: "/api/events/{id}"
    description: "Read one gala event including its computed posture and rollups."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: GalaEvent
    side_effects: []
  - method: GET
    path: "/api/events"
    description: "List gala events."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GalaEvent[]
    side_effects: []
  - method: POST
    path: "/api/events/{id}/publish"
    description: "DRAFT -> PUBLISHED."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: GalaEvent
    side_effects: ["increments GalaEvent.version by 1", "recompute posture"]
  - method: POST
    path: "/api/events/{id}/unpublish"
    description: "PUBLISHED -> DRAFT; releases every HELD table hold of the event."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: GalaEvent
    side_effects: ["cascade: HELD TableHolds -> RELEASED", "TicketTable rollups recomputed", "increments GalaEvent.version by 1"]
  - method: POST
    path: "/api/events/{id}/go-live"
    description: "PUBLISHED -> LIVE; auto-opens every DRAFT lot whose window contains the clock."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: GalaEvent
    side_effects: ["cascade: eligible DRAFT AuctionItems -> OPEN", "recompute open_lot_count", "increments GalaEvent.version by 1"]
  - method: POST
    path: "/api/events/{id}/start-settlement"
    description: "LIVE -> SETTLING; posture becomes RESTRICTED."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: GalaEvent
    side_effects: ["recompute posture (RESTRICTED)", "increments GalaEvent.version by 1"]
  - method: POST
    path: "/api/events/{id}/close"
    description: "SETTLING -> CLOSED; lapses overdue PROMISED pledges; posture becomes FROZEN."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: GalaEvent
    side_effects: ["cascade: overdue PROMISED Pledges -> LAPSED", "recompute posture (FROZEN)", "increments GalaEvent.version by 1"]
  - method: GET
    path: "/api/events/{id}/revenue-summary"
    description: "Computed read: per-channel revenue snapshot of the event under both pledge variants."
    roles: [EventOrganizer, FinanceOfficer]
    code: 200
    input: []
    output: "{ tickets_cents: integer, auction_cents: integer, paddle_cents: integer, pledge_booked_cents: integer, pledge_cash_cents: integer, sponsorship_cents: integer, gross_collected_cents: integer, match_awarded_cents: integer }"
    side_effects: []

  # ---- TicketTable ----
  - method: POST
    path: "/api/events/{id}/tables"
    description: "Add a table to the event."
    roles: [EventOrganizer]
    code: 201
    input: [table_name, seat_count, table_price_cents, seat_price_cents]
    output: TicketTable
    side_effects: []
  - method: GET
    path: "/api/tables/{id}"
    description: "Read one table."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: TicketTable
    side_effects: []
  - method: GET
    path: "/api/tables"
    description: "List tables, optionally filtered by event."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "status?", "limit?", "offset?"]
    output: TicketTable[]
    side_effects: []

  # ---- TableHold ----
  - method: POST
    path: "/api/table-holds"
    description: "Place a closed-interval hold on a table for a guest."
    roles: [EventOrganizer, Bidder]
    code: 201
    input: [table_id, bidder_id, hold_start_utc, hold_end_utc]
    output: TableHold
    side_effects: ["buffer-overlap check against HELD holds on the same table"]
  - method: GET
    path: "/api/table-holds/{id}"
    description: "Read one hold."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: TableHold
    side_effects: []
  - method: GET
    path: "/api/table-holds"
    description: "List holds, optionally filtered by table or bidder."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["table_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: TableHold[]
    side_effects: []
  - method: POST
    path: "/api/table-holds/{id}/release"
    description: "HELD -> RELEASED."
    roles: [EventOrganizer, Bidder]
    code: 200
    input: []
    output: TableHold
    side_effects: ["TicketTable rollups recomputed", "increments TableHold.version by 1"]

  # ---- Bidder ----
  - method: POST
    path: "/api/bidders"
    description: "Register a guest / bidder for the event."
    roles: [EventOrganizer]
    code: 201
    input: [event_id, display_name, email, paddle_number, "payment_method_on_file?"]
    output: Bidder
    side_effects: ["paddle_number uniqueness enforced within the event"]
  - method: GET
    path: "/api/bidders/{id}"
    description: "Read one bidder including outstanding_balance_cents."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: Bidder
    side_effects: []
  - method: GET
    path: "/api/bidders"
    description: "List bidders, optionally filtered by event."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: Bidder[]
    side_effects: []
  - method: POST
    path: "/api/bidders/{id}/payment-method"
    description: "Attach or detach a stored payment method."
    roles: [EventOrganizer, Bidder]
    code: 200
    input: [payment_method_on_file]
    output: Bidder
    side_effects: ["increments Bidder.version by 1"]

  # ---- Sponsor ----
  - method: POST
    path: "/api/sponsors"
    description: "Record a sponsorship commitment in PENDING."
    roles: [EventOrganizer]
    code: 201
    input: [event_id, org_name, tier, commitment_cents]
    output: Sponsor
    side_effects: []
  - method: GET
    path: "/api/sponsors/{id}"
    description: "Read one sponsor."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: Sponsor
    side_effects: []
  - method: GET
    path: "/api/sponsors"
    description: "List sponsors, optionally filtered by event."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "status?", "limit?", "offset?"]
    output: Sponsor[]
    side_effects: []
  - method: POST
    path: "/api/sponsors/{id}/confirm"
    description: "Record sponsorship cash; PENDING -> CONFIRMED when the commitment is fully funded."
    roles: [FinanceOfficer]
    code: 200
    input: [paid_amount_cents]
    output: Sponsor
    side_effects: ["increases Sponsor.paid_amount_cents", "increments Sponsor.version by 1"]
  - method: POST
    path: "/api/sponsors/{id}/withdraw"
    description: "PENDING -> WITHDRAWN; rejects the sponsor's non-placed ads."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: Sponsor
    side_effects: ["cascade: open ProgramAds -> REJECTED", "increments Sponsor.version by 1"]

  # ---- ProgramAd ----
  - method: POST
    path: "/api/program-ads"
    description: "Submit a program ad for review."
    roles: [Sponsor, EventOrganizer]
    code: 201
    input: [sponsor_id, event_id, ad_size, artwork_ref]
    output: ProgramAd
    side_effects: []
  - method: GET
    path: "/api/program-ads/{id}"
    description: "Read one program ad."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: ProgramAd
    side_effects: []
  - method: GET
    path: "/api/program-ads"
    description: "List program ads, optionally filtered by sponsor or event."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["sponsor_id?", "event_id?", "status?", "limit?", "offset?"]
    output: ProgramAd[]
    side_effects: []
  - method: POST
    path: "/api/program-ads/{id}/review"
    description: "Advance the review cycle: decision one of BEGIN_REVIEW, REQUEST_CHANGES, APPROVE, REJECT."
    roles: [EventOrganizer]
    code: 200
    input: [decision, "notes?"]
    output: ProgramAd
    side_effects: ["sets review_notes", "increments ProgramAd.version by 1"]
  - method: POST
    path: "/api/program-ads/{id}/resubmit"
    description: "CHANGES_REQUESTED -> SUBMITTED with fresh artwork; increments revision_count."
    roles: [Sponsor]
    code: 200
    input: [artwork_ref]
    output: ProgramAd
    side_effects: ["increments revision_count by 1", "increments ProgramAd.version by 1"]
  - method: POST
    path: "/api/program-ads/{id}/place"
    description: "APPROVED -> PLACED on a program page."
    roles: [EventOrganizer]
    code: 200
    input: [page_number]
    output: ProgramAd
    side_effects: ["Sponsor.placed_ad_count recomputed", "increments ProgramAd.version by 1"]

  # ---- TicketOrder ----
  - method: POST
    path: "/api/ticket-orders"
    description: "Buy a whole table or individual seats; prices the order via calculations.ticket_order_total."
    roles: [EventOrganizer, Bidder]
    code: 201
    input: [event_id, bidder_id, table_id, order_type, seat_count]
    output: TicketOrder
    side_effects: ["TicketTable.seats_reserved / status recomputed", "any HELD TableHold of this bidder on this table -> CONSUMED"]
  - method: GET
    path: "/api/ticket-orders/{id}"
    description: "Read one ticket order."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: TicketOrder
    side_effects: []
  - method: GET
    path: "/api/ticket-orders"
    description: "List ticket orders with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "bidder_id?", "table_id?", "invoice_id?", "payment_status?", "limit?", "offset?"]
    output: TicketOrder[]
    side_effects: []
  - method: POST
    path: "/api/ticket-orders/{id}/assign-seats"
    description: "Seating dimension only: UNSEATED -> SEATED at the order's table."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: TicketOrder
    side_effects: ["increments TicketOrder.version by 1; payment_status untouched"]
  - method: POST
    path: "/api/ticket-orders/{id}/cancel"
    description: "Cancel an order: payment_status -> REFUNDED and seating_status -> RELEASED."
    roles: [EventOrganizer]
    code: 200
    input: []
    output: TicketOrder
    side_effects: ["TicketTable.seats_reserved decreases by seat_count", "increments TicketOrder.version by 1"]

  # ---- AuctionItem ----
  - method: POST
    path: "/api/auction-items"
    description: "Create a silent or live lot in DRAFT."
    roles: [AuctionManager]
    code: 201
    input: [event_id, title, item_type, starting_bid_cents, min_increment_cents, estimated_fmv_cents, open_at_utc, close_at_utc, "live_lot_sequence?"]
    output: AuctionItem
    side_effects: []
  - method: GET
    path: "/api/auction-items/{id}"
    description: "Read one lot including both status dimensions and current_leading_amount_cents."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: AuctionItem
    side_effects: []
  - method: GET
    path: "/api/auction-items"
    description: "List lots with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "listing_status?", "settlement_status?", "winning_bid_id?", "invoice_id?", "limit?", "offset?"]
    output: AuctionItem[]
    side_effects: []
  - method: POST
    path: "/api/auction-items/{id}/open"
    description: "DRAFT -> OPEN; enforces the half-open live-channel window conflict check."
    roles: [AuctionManager]
    code: 200
    input: []
    output: AuctionItem
    side_effects: ["GalaEvent.open_lot_count recomputed", "increments AuctionItem.version by 1"]
  - method: POST
    path: "/api/auction-items/{id}/close"
    description: "OPEN -> AWARDED when an ACTIVE bid exists, otherwise OPEN -> PASSED."
    roles: [AuctionManager]
    code: 200
    input: []
    output: AuctionItem
    side_effects: ["AWARDED branch: hammer_price_cents frozen, winning bid -> WON and losers -> LOST, invoice line appended, invoice totals recomputed, bidder balance recomputed", "PASSED branch: no invoice touched", "GalaEvent.open_lot_count recomputed", "increments AuctionItem.version by 1"]
  - method: GET
    path: "/api/auction-items/{id}/valuation"
    description: "Computed read of either valuation variant of the lot."
    roles: [AuctionManager, FinanceOfficer, EventOrganizer]
    code: 200
    input: [variant]
    output: "{ variant: string, amount_cents: integer, active_bid_count: integer, source_bid_id: string }"
    side_effects: []

  # ---- Bid ----
  - method: POST
    path: "/api/auction-items/{id}/bids"
    description: "Place a mobile bid, optionally with a proxy ceiling."
    roles: [Bidder, AuctionManager]
    code: 201
    input: [bidder_id, amount_cents, "proxy_max_cents?"]
    output: Bid
    side_effects: ["AuctionItem.current_leading_amount_cents recomputed under the PROXY_SETTLED variant"]
  - method: GET
    path: "/api/bids/{id}"
    description: "Read one bid."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/api/bids"
    description: "List bids with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["item_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: POST
    path: "/api/bids/{id}/retract"
    description: "ACTIVE -> RETRACTED on an OPEN lot."
    roles: [AuctionManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["AuctionItem.current_leading_amount_cents recomputed", "increments Bid.version by 1"]

  # ---- PaddleRaise ----
  - method: POST
    path: "/api/paddle-raises"
    description: "Record an appeal gift from the stage and allocate challenge-match dollars."
    roles: [AuctionManager, EventOrganizer]
    code: 201
    input: [event_id, bidder_id, level_cents]
    output: PaddleRaise
    side_effects: ["match_cents allocated from the event's remaining cap", "GalaEvent.match_awarded_cents increases"]
  - method: GET
    path: "/api/paddle-raises/{id}"
    description: "Read one paddle-raise gift."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: PaddleRaise
    side_effects: []
  - method: GET
    path: "/api/paddle-raises"
    description: "List paddle-raise gifts with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "bidder_id?", "invoice_id?", "limit?", "offset?"]
    output: PaddleRaise[]
    side_effects: []

  # ---- Pledge ----
  - method: POST
    path: "/api/pledges"
    description: "Record a multi-installment pledge in PROMISED."
    roles: [FinanceOfficer, EventOrganizer]
    code: 201
    input: [event_id, bidder_id, total_amount_cents, installment_count, first_due_utc]
    output: Pledge
    side_effects: []
  - method: GET
    path: "/api/pledges/{id}"
    description: "Read one pledge."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: Pledge
    side_effects: []
  - method: GET
    path: "/api/pledges"
    description: "List pledges with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []
  - method: POST
    path: "/api/pledges/{id}/installments"
    description: "Record received cash against the pledge; advances the pledge state machine."
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents]
    output: Pledge
    side_effects: ["increases received_amount_cents", "increments Pledge.version by 1"]
  - method: POST
    path: "/api/pledges/{id}/lapse"
    description: "Mark an overdue pledge LAPSED."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Pledge
    side_effects: ["increments Pledge.version by 1"]

  # ---- CheckoutInvoice ----
  - method: POST
    path: "/api/invoices"
    description: "Open a checkout invoice for a guest."
    roles: [FinanceOfficer, EventOrganizer]
    code: 201
    input: [event_id, bidder_id, "cover_processing_fee?"]
    output: CheckoutInvoice
    side_effects: []
  - method: GET
    path: "/api/invoices/{id}"
    description: "Read one invoice with its lines and totals."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: CheckoutInvoice
    side_effects: []
  - method: GET
    path: "/api/invoices"
    description: "List invoices with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["event_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: CheckoutInvoice[]
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/finalize"
    description: "OPEN -> PENDING_PAYMENT; sweeps the guest's UNBILLED ticket orders and UNSETTLED paddle raises onto the invoice."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CheckoutInvoice
    side_effects: ["TICKET and PADDLE_RAISE lines appended", "totals recomputed", "Bidder.outstanding_balance_cents and GalaEvent.unpaid_invoice_count recomputed", "increments CheckoutInvoice.version by 1"]
  - method: POST
    path: "/api/invoices/{id}/void"
    description: "Void an unpaid invoice and detach its lines."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CheckoutInvoice
    side_effects: ["lines detached, sources reverted to UNSETTLED/UNBILLED", "rollups recomputed", "increments CheckoutInvoice.version by 1"]

  # ---- PaymentTransaction ----
  - method: POST
    path: "/api/payments"
    description: "Capture a payment against a payable invoice."
    roles: [FinanceOfficer, Bidder]
    code: 201
    input: [invoice_id, amount_cents, method]
    output: PaymentTransaction
    side_effects: ["invoice totals and status recomputed", "on full payment: lot/ticket/paddle settlement cascade, GalaEvent.gross_collected_cents and unpaid_invoice_count recomputed, Bidder balance recomputed"]
  - method: GET
    path: "/api/payments/{id}"
    description: "Read one payment."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: []
  - method: GET
    path: "/api/payments"
    description: "List payments with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["invoice_id?", "status?", "limit?", "offset?"]
    output: PaymentTransaction[]
    side_effects: []
  - method: POST
    path: "/api/payments/{id}/void"
    description: "CAPTURED -> VOIDED; reverses the capture cascade. Segregation of duties: the voiding user must differ from captured_by_user_id."
    roles: [FinanceOfficer]
    code: 200
    input: [reason]
    output: PaymentTransaction
    side_effects: ["invoice totals/status reverted", "settlement cascade reversed", "GalaEvent.gross_collected_cents decreases by the voided amount", "increments PaymentTransaction.version by 1"]

  # ---- Receipt ----
  - method: POST
    path: "/api/receipts"
    description: "Issue the donor tax receipt for a fully PAID invoice."
    roles: [FinanceOfficer]
    code: 201
    input: [invoice_id]
    output: Receipt
    side_effects: ["tax_deductible_cents computed from the invoice's lines"]
  - method: GET
    path: "/api/receipts/{id}"
    description: "Read one receipt."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: []
    output: Receipt
    side_effects: []
  - method: GET
    path: "/api/receipts"
    description: "List receipts with filters."
    roles: [EventOrganizer, AuctionManager, FinanceOfficer, Bidder, Sponsor]
    code: 200
    input: ["invoice_id?", "bidder_id?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []

  # ---- ReconciliationRun ----
  - method: POST
    path: "/api/events/{id}/reconciliation-runs"
    description: "Prepare a reconciliation run for the event under a chosen revenue basis; supersedes any existing PREPARED run. Requires the caller's last-observed GalaEvent.version."
    roles: [FinanceOfficer]
    code: 201
    input: [expected_event_version, revenue_basis]
    output: ReconciliationRun
    side_effects: ["any existing PREPARED run -> SUPERSEDED", "channel_breakdown and variance computed", "increments GalaEvent.version by 1"]
  - method: GET
    path: "/api/reconciliation-runs/{id}"
    description: "Read one reconciliation run."
    roles: [EventOrganizer, FinanceOfficer]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: GET
    path: "/api/events/{id}/reconciliation-runs"
    description: "List the event's reconciliation runs."
    roles: [EventOrganizer, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []
  - method: POST
    path: "/api/reconciliation-runs/{id}/finalize"
    description: "PREPARED -> FINALIZED; freezes the event. The finalizing user must differ from prepared_by_user_id."
    roles: [FinanceOfficer]
    code: 200
    input: ["variance_override_note?"]
    output: ReconciliationRun
    side_effects: ["GalaEvent.posture becomes FROZEN", "increments ReconciliationRun.version by 1"]
  - method: POST
    path: "/api/reconciliation-runs/{id}/reopen"
    description: "FINALIZED -> PREPARED; recomputes the run and un-freezes the event."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: ["totals recomputed", "GalaEvent.posture returns to RESTRICTED", "increments ReconciliationRun.version by 1"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed on the endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role (Bidder or Sponsor) acts on a resource whose owning foreign key is not the caller's X-User-ID."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, negative amount, limit outside [1,100], offset < 0, or an interval whose end is not strictly after its start."
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No GalaEvent with the given id."
  - id: ERR_TABLE_NOT_FOUND
    http: 404
    condition: "No TicketTable with the given id."
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "No TableHold with the given id."
  - id: ERR_TICKET_ORDER_NOT_FOUND
    http: 404
    condition: "No TicketOrder with the given id."
  - id: ERR_BIDDER_NOT_FOUND
    http: 404
    condition: "No Bidder with the given id."
  - id: ERR_SPONSOR_NOT_FOUND
    http: 404
    condition: "No Sponsor with the given id."
  - id: ERR_AD_NOT_FOUND
    http: 404
    condition: "No ProgramAd with the given id."
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "No AuctionItem with the given id."
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "No Bid with the given id."
  - id: ERR_PADDLE_RAISE_NOT_FOUND
    http: 404
    condition: "No PaddleRaise with the given id."
  - id: ERR_PLEDGE_NOT_FOUND
    http: 404
    condition: "No Pledge with the given id."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "No CheckoutInvoice with the given id."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No PaymentTransaction with the given id."
  - id: ERR_RECEIPT_NOT_FOUND
    http: 404
    condition: "No Receipt with the given id."
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "No ReconciliationRun with the given id."
  - id: ERR_EVENT_FROZEN
    http: 409
    condition: "The owning GalaEvent.posture == FROZEN and the endpoint mutates a child of the event."
  - id: ERR_EVENT_RESTRICTED
    http: 409
    condition: "The owning GalaEvent.posture == RESTRICTED and the endpoint creates new bidding, ticketing or appeal activity."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared."
  - id: ERR_ITEM_NOT_OPEN
    http: 409
    condition: "A bid or retraction targets a lot whose listing_status != OPEN or whose bidding window does not contain the clock."
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "Payment capture against an invoice not in PENDING_PAYMENT or PARTIALLY_PAID, or void of an invoice that already has captured money."
  - id: ERR_RUN_ALREADY_FINALIZED
    http: 409
    condition: "Finalizing a run that is not PREPARED, or creating a new run for an event that already has a FINALIZED run."
  - id: ERR_PLEDGE_TERMINAL
    http: 409
    condition: "An installment or lapse targets a Pledge already in FULFILLED or LAPSED."
  - id: ERR_RECEIPT_ALREADY_ISSUED
    http: 409
    condition: "A receipt already exists for the invoice (blocks a duplicate receipt and blocks voiding its payments)."
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not equal the current GalaEvent.version on reconciliation-run creation."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the user who performed the paired earlier step (run preparation, or payment capture)."
  - id: ERR_SPONSOR_NOT_CONFIRMED
    http: 409
    condition: "Approving a program ad whose Sponsor.status != CONFIRMED."
  - id: ERR_OPEN_INVOICES_REMAIN
    http: 409
    condition: "Closing an event or finalizing a run while the event has invoices in PENDING_PAYMENT or PARTIALLY_PAID."
  - id: ERR_NO_FINALIZED_RUN
    http: 409
    condition: "Closing an event that has no FINALIZED ReconciliationRun."
  - id: ERR_OPEN_LOTS_REMAIN
    http: 409
    condition: "Starting settlement while at least one lot is still OPEN."
  - id: ERR_TICKET_ORDERS_EXIST
    http: 409
    condition: "Unpublishing an event that already has INVOICED or PAID ticket orders."
  - id: ERR_LOT_WINDOW_CLOSED
    http: 409
    condition: "Opening a lot when the clock is outside [open_at_utc, close_at_utc)."
  - id: ERR_LOT_WINDOW_CONFLICT
    http: 409
    condition: "Opening a lot whose window overlaps another OPEN lot sharing the same live_lot_sequence on the same event."
  - id: ERR_TABLE_HOLD_CONFLICT
    http: 409
    condition: "A new table hold sits closer than TABLE_TURNOVER_BUFFER_MINUTES to an existing HELD hold on the same table."
  - id: ERR_BID_TOO_LOW
    http: 422
    condition: "The bid does not reach the starting bid (first bid) or the leading amount plus the minimum increment."
  - id: ERR_AD_REVISION_LIMIT
    http: 409
    condition: "Resubmitting an ad whose revision_count has reached MAX_AD_REVISIONS."
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "The order would push TicketTable.seats_reserved above seat_count, or a TABLE order requests a seat_count != table.seat_count."
  - id: ERR_DUPLICATE_PADDLE_NUMBER
    http: 409
    condition: "A bidder with the same paddle_number is already registered for the event."
  - id: ERR_NO_PAYMENT_METHOD
    http: 402
    condition: "Bidding or paddle-raising for a Bidder whose payment_method_on_file is false."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "The captured amount exceeds the invoice's balance_due_cents."
  - id: ERR_MATERIAL_VARIANCE
    http: 409
    condition: "Finalizing a run with is_material_variance == true and no variance_override_note."
  - id: ERR_SPONSOR_UNDERFUNDED
    http: 422
    condition: "The recorded sponsorship cash leaves paid_amount_cents below commitment_cents."

roles:
  - name: EventOrganizer
    description: "Runs the gala: event lifecycle, tables, bidder registration, sponsors, program-ad review and placement, ticket orders and seating."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/events"
      - "POST /api/events/{id}/publish"
      - "POST /api/events/{id}/unpublish"
      - "POST /api/events/{id}/go-live"
      - "POST /api/events/{id}/start-settlement"
      - "POST /api/events/{id}/close"
      - "POST /api/events/{id}/tables"
      - "POST /api/bidders"
      - "POST /api/sponsors"
      - "POST /api/sponsors/{id}/withdraw"
      - "POST /api/program-ads/{id}/review"
      - "POST /api/program-ads/{id}/place"
      - "POST /api/ticket-orders/{id}/assign-seats"
      - "POST /api/ticket-orders/{id}/cancel"
    shared_operations:
      - "POST /api/table-holds (with Bidder)"
      - "POST /api/table-holds/{id}/release (with Bidder)"
      - "POST /api/ticket-orders (with Bidder)"
      - "POST /api/bidders/{id}/payment-method (with Bidder)"
      - "POST /api/program-ads (with Sponsor)"
      - "POST /api/paddle-raises (with AuctionManager)"
      - "POST /api/pledges (with FinanceOfficer)"
      - "POST /api/invoices (with FinanceOfficer)"
      - "all GET endpoints"
  - name: AuctionManager
    description: "Runs the silent and live auction: lot creation, opening and closing lots, bid retraction, paddle-raise capture."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/auction-items"
      - "POST /api/auction-items/{id}/open"
      - "POST /api/auction-items/{id}/close"
      - "POST /api/bids/{id}/retract"
    shared_operations:
      - "POST /api/auction-items/{id}/bids (with Bidder, for paper-bid entry)"
      - "POST /api/paddle-raises (with EventOrganizer)"
      - "GET /api/auction-items/{id}/valuation (with FinanceOfficer, EventOrganizer)"
      - "all GET endpoints except the reconciliation-run reads"
  - name: FinanceOfficer
    description: "Owns the money surface: sponsor confirmation, invoices, payments, receipts, pledges and reconciliation. Segregation of duties applies within this role by X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/sponsors/{id}/confirm"
      - "POST /api/invoices/{id}/finalize"
      - "POST /api/invoices/{id}/void"
      - "POST /api/payments/{id}/void"
      - "POST /api/receipts"
      - "POST /api/pledges/{id}/installments"
      - "POST /api/pledges/{id}/lapse"
      - "POST /api/events/{id}/reconciliation-runs"
      - "POST /api/reconciliation-runs/{id}/finalize"
      - "POST /api/reconciliation-runs/{id}/reopen"
    shared_operations:
      - "POST /api/invoices (with EventOrganizer)"
      - "POST /api/pledges (with EventOrganizer)"
      - "POST /api/payments (with Bidder)"
      - "all GET endpoints"
    segregation_of_duties:
      - "The X-User-ID that created a ReconciliationRun (prepared_by_user_id) may not finalize it."
      - "The X-User-ID that captured a PaymentTransaction (captured_by_user_id) may not void it."
  - name: Bidder
    description: "A registered gala guest acting on their own resources: holds, ticket orders, bids and self-service payment."
    identity: "entity_backed:Bidder"
    exclusive_operations: []
    shared_operations:
      - "POST /api/auction-items/{id}/bids (with AuctionManager; bidder_id must equal X-User-ID)"
      - "POST /api/table-holds (with EventOrganizer; bidder_id must equal X-User-ID)"
      - "POST /api/table-holds/{id}/release (with EventOrganizer; must own the hold)"
      - "POST /api/ticket-orders (with EventOrganizer; bidder_id must equal X-User-ID)"
      - "POST /api/payments (with FinanceOfficer; the invoice's bidder_id must equal X-User-ID)"
      - "POST /api/bidders/{id}/payment-method (with EventOrganizer; must be self)"
      - "all GET endpoints except the reconciliation-run reads"
  - name: Sponsor
    description: "A sponsoring organization acting on its own program ads."
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /api/program-ads/{id}/resubmit"
    shared_operations:
      - "POST /api/program-ads (with EventOrganizer; sponsor_id must equal X-User-ID)"
      - "all GET endpoints except the reconciliation-run reads"

global_constants:
  DEFAULT_CLOCK_UTC: "2026-07-01T00:00:00Z"
  TABLE_TURNOVER_BUFFER_MINUTES: 15
  MAX_AD_REVISIONS: 2
  PLEDGE_LAPSE_GRACE_DAYS: 30
  EARLY_BIRD_DAYS_BEFORE_EVENT: 30
  EARLY_BIRD_TABLE_DISCOUNT_RATE: 0.15
  EARLY_BIRD_SEAT_DISCOUNT_RATE: 0.10
  TICKET_BENEFIT_PER_SEAT_CENTS: 7500
  MATCH_RATIO: 1.0
  FEE_TIER_1_CEILING_CENTS: 50000
  FEE_TIER_2_CEILING_CENTS: 500000
  FEE_RATE_TIER_1: 0.029
  FEE_RATE_TIER_2: 0.024
  FEE_RATE_TIER_3: 0.019
  PROCESSING_FEE_FLAT_CENTS: 30
  FMV_DE_MINIMIS_CENTS: 1500
  MATERIAL_VARIANCE_THRESHOLD_CENTS: 5000
