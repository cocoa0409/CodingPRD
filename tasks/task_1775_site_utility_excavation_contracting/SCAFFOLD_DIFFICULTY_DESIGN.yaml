  - rule_id: resource_temporal_overlap
    instances:
      - name: owner_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.ShutdownWindow.fields.window_start
          - entities.ShutdownWindow.fields.window_end
        distinguishing_aspect: |
          Resource = UtilityOwner, semantics = bare half-open [start, end):
          touching endpoints are allowed (W2 starting exactly at W1's end
          succeeds) while any strict overlap fails (W3 straddling W1's end is
          rejected). Resource entity and interval semantics both differ from
          the sibling instance (Project with a 120-minute buffer).
        test_recipe:
          setup:
            - "Projects P1 and P2 ACTIVE (version 1 each); one UtilityOwner O (min_notice_hours 24, max_shutdown_hours 12)"
            - "Segments S1 (on P1) and S2 (on P2), both referencing O; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P1-OV", contract_ref: "C-1500", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /site-utility/projects"
              payload: { name: "P2-OV", contract_ref: "C-1501", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 24, max_shutdown_hours: 12 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p1_id}", utility_owner_id: "${o_id}", segment_label: "WL-I-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
              as: Foreman
