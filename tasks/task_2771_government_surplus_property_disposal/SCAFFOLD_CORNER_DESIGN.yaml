      - name: val_duplicate_code_checks_respect_declared_case_rules
        claim_type: violation_returns_error
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
        distinguishing_aspect: "Three separate uniqueness checks with two different collation rules: agency_code is case-sensitive, so \"dot-01\" is a distinct key from \"DOT-01\" and is accepted, while bidder email is case-insensitive, so \"BIDS@Cedarridge.EXAMPLE\" collides with \"bids@cedarridge.example\". Each collision reports its own error code rather than a shared generic one."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one ACTIVE agency DOT-01, one ACTIVE venue AUS-01 and one PENDING bidder bids@cedarridge.example"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Austin Auction Yard", venue_code: "AUS-01", concurrent_lot_capacity: 2, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.id" }
            - call: "POST /bidders"
              payload: { legal_name: "Cedar Ridge Salvage LLC", email: "bids@cedarridge.example", bidder_type: "BUSINESS" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /agencies"
              payload: { name: "Different Department, Same Code", agency_code: "DOT-01", agency_type: "LOCAL_GOVERNMENT" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err_agency: "$.data.error_id" }
            - call: "POST /agencies"
              payload: { name: "Lowercase Code Department", agency_code: "dot-01", agency_type: "LOCAL_GOVERNMENT" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_lower: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Austin Overflow Yard", venue_code: "AUS-01", concurrent_lot_capacity: 1, buyer_premium_pct: 0.10, sales_tax_pct: 0.06 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err_venue: "$.data.error_id" }
            - call: "POST /bidders"
              payload: { legal_name: "Cedar Ridge Salvage LLC (second registration)", email: "BIDS@Cedarridge.EXAMPLE", bidder_type: "INDIVIDUAL" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err_bidder: "$.data.error_id" }
          assert:
            - "the DOT-01 repeat returns 409 with data.error_id == \"ERR_DUPLICATE_AGENCY_CODE\""
            - "the \"dot-01\" create returns 201 — agency_code uniqueness is case-sensitive, so the lowercase code is a different key"
            - "the AUS-01 repeat returns 409 with data.error_id == \"ERR_DUPLICATE_VENUE_CODE\""
            - "the mixed-case email returns 409 with data.error_id == \"ERR_DUPLICATE_BIDDER_EMAIL\" — email uniqueness is case-insensitive"
            - "GET /agencies returns total_count 2, GET /venues returns total_count 1, GET /bidders returns total_count 1"
            - "Bidder.${b1}.status == PENDING and deposit_paid_cents == 0 — the refused registration left the incumbent untouched"

