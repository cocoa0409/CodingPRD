  # ===========================================================================
  # §1.2 State machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_screening_starts_in_initiated_created_by_submit_for_compliance
        claim_type: initial_state
        grounds:
          - state_machines.ExportControlScreening.status.initial_state
          - state_machines.ExportOrder.fulfillment_status.transitions.DRAFT_to_COMPLIANCE_PENDING
          - endpoints.POST /export-orders/{export_order_id}/submit-for-compliance
        distinguishing_aspect: "The screening is never created by an explicit POST — it materialises as a side effect of submit-for-compliance with status INITIATED, ruleset_version 1, license_determination null and cleared_at null, while the order lands in COMPLIANCE_PENDING (not COMPLIANCE_CLEARED)."
        test_recipe:
          setup:
            - "A DRAFT order with one 25000.00 USD line for a clean buyer (restricted_party_flag false, sanctions_tier NONE)."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                quantity: 100.000
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
          assert:
            - "HTTP 200; data.fulfillment_status == \"COMPLIANCE_PENDING\"; data.ordered_goods_value_usd == 25000.00"
            - "GET /export-control-screenings?export_order_id=${order_id} returns total_count == 1"
            - "that screening row has status == \"INITIATED\", ruleset_version == 1, license_determination null, export_license_id null, cleared_at null, denied_party_hits == 0"
            - "data.settlement_status is still \"UNSECURED\" — the compliance step does not touch the money dimension"

      - name: corner_submit_for_compliance_precondition_no_shipment_lines
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ExportOrder.fulfillment_status.transitions.DRAFT_to_COMPLIANCE_PENDING
          - validations.priority_9
          - errors[ERR_NO_SHIPMENT_LINES]
        distinguishing_aspect: "An order with zero lines fails the empty-collection guard (ERR_NO_SHIPMENT_LINES, 409) and stays DRAFT — no screening row is created, so the failed transition leaves no orphan aggregate behind."
        test_recipe:
          setup:
            - "A DRAFT order with no shipment lines."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; data.error_id == \"ERR_NO_SHIPMENT_LINES\""
            - "GET /export-orders/${order_id} reports fulfillment_status == \"DRAFT\""
            - "GET /export-control-screenings?export_order_id=${order_id} returns total_count == 0"

      - name: corner_nlr_decision_clears_screening_and_order_in_one_write
        claim_type: side_effect_execution
        grounds:
          - state_machines.ExportControlScreening.status.transitions.INITIATED_to_CLEARED
          - state_machines.ExportOrder.fulfillment_status.transitions.COMPLIANCE_PENDING_to_COMPLIANCE_CLEARED
          - endpoints.POST /export-control-screenings/{screening_id}/decision
        distinguishing_aspect: "A single NLR decision writes across two aggregates: the screening becomes CLEARED with cleared_at stamped at the logical clock (2026-08-01T00:00:00Z, not wall-clock now) and the order is pulled COMPLIANCE_PENDING -> COMPLIANCE_CLEARED by the system, with no export_license_id involved."
        test_recipe:
          setup:
            - "An order in COMPLIANCE_PENDING with an INITIATED screening; the logical clock has never been moved."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Busan"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                line_no: 1
                goods_description: "Industrial valve assembly"
                hs_code: "848180"
                quantity: 100.000
                uom: "EA"
                unit_price_usd: 250.0000
                net_weight_kg: 1000.000
                gross_weight_kg: 1200.000
                package_count: 20
              captures: { line_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
            - call: "GET /export-control-screenings"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { export_order_id: "${order_id}", limit: 10, offset: 0 }
              captures: { screening_id: "$.data[0].id" }
          trigger:
            - call: "POST /export-control-screenings/${screening_id}/decision"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
          assert:
            - "HTTP 200; data.status == \"CLEARED\"; data.license_determination == \"NLR\"; data.decided_by_user_id == \"u_comp_carl\""
            - "data.cleared_at == \"2026-08-01T00:00:00Z\" (the logical clock, untouched since t0) and data.export_license_id is null"
            - "GET /export-orders/${order_id} reports fulfillment_status == \"COMPLIANCE_CLEARED\" and settlement_status \"UNSECURED\""
            - "GET /export-licenses?export_control_screening_id=${screening_id} returns total_count == 0"

      - name: corner_denied_party_hits_override_nlr_determination_to_blocked
        claim_type: valid_transition
        grounds:
          - state_machines.ExportControlScreening.status.transitions.INITIATED_to_BLOCKED
          - state_machines.ExportOrder.fulfillment_status.transitions.COMPLIANCE_PENDING_to_COMPLIANCE_BLOCKED
          - entities.ExportControlScreening.fields.denied_party_hits
        distinguishing_aspect: "denied_party_hits > 0 routes to BLOCKED even though license_determination says NLR — the hit count wins over the determination, and the order follows into COMPLIANCE_BLOCKED rather than COMPLIANCE_CLEARED."
        test_recipe:
          setup:
            - "An order in COMPLIANCE_PENDING with an INITIATED screening (identical chain to corner_nlr_decision_clears_screening_and_order_in_one_write)."
          setup_api_calls:
