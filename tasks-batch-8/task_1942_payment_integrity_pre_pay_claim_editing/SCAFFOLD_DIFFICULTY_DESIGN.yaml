  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: high_dollar_exact_threshold_flags
        grounds:
          - calculations.high_dollar_evaluation
          - entities.Claim.fields.high_dollar_flag
        distinguishing_aspect: |
          Metric: dollar amount at POST run-edits. Inclusive >= boundary:
          10000000 cents flags high-dollar (and auto-creates the IBR);
          9999999 cents does not.
        test_recipe:
          setup:
            - "Provider PB6; claim A billed exactly 10000000 (one line); claim B billed 9999999 (one line); no edit rules"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-B6", name: "Boundary Prov" }, as: PlanAdmin, captures: { pb6_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "B6A", provider_id: "${pb6_id}", member_id: "M-B6A", claim_type: PROFESSIONAL, total_billed_cents: 10000000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pb6_id}", captures: { cb6a_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cb6a_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000000 }, as: Provider, as_user_id: "${pb6_id}" }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "B6B", provider_id: "${pb6_id}", member_id: "M-B6B", claim_type: PROFESSIONAL, total_billed_cents: 9999999, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pb6_id}", captures: { cb6b_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cb6b_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 9999999 }, as: Provider, as_user_id: "${pb6_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${cb6a_id}/run-edits", payload: {}, as: PlanAdmin, captures: { flag_a: $.data.high_dollar_flag, status_a: $.data.status } }
            - { call: "POST /payment-integrity/claims/${cb6b_id}/run-edits", payload: {}, as: PlanAdmin, captures: { flag_b: $.data.high_dollar_flag, status_b: $.data.status } }
          assert:
            - "Claim.${cb6a_id}.high_dollar_flag == true at exactly 10000000 cents (>= semantics); status PENDED"
            - "ItemizedBillReview exists for ${cb6a_id} in REQUESTED"
            - "Claim.${cb6b_id}.high_dollar_flag == false at 9999999 cents; status READY_TO_PAY and no ItemizedBillReview exists for ${cb6b_id}"

      - name: fp_rate_exact_quarter_suspends
        grounds:
          - calculations.false_positive_rate
          - entities.EditVersion.fields.fp_rate
          - state_machines.EditVersion.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Metric: false-positive rate at POST dispute decide (different metric
          and endpoint than the dollar boundary). Inclusive >= boundary: after
          3 confirmations the version is ACTIVE (fp_rate 0); the fourth
          resolution being a false positive makes fp_rate exactly 0.2500 with
          sample 4, which suspends; 1/5 (0.2000) would not.
        test_recipe:
          setup:
            - "Provider PF6; edit EF (DENY, PROFESSIONAL) ACTIVE"
            - "Claims f1, f2, f3 (40000 each): hits upheld (3 CONFIRMED, fp_rate 0, version ACTIVE)"
            - "Claim f4 (40000): hit upheld -> claim DENIED; dispute opened and under review"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-F6", name: "FP Prov" }, as: PlanAdmin, captures: { pf6_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "FP-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rf6_id: $.data.id, rf6_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rf6_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evf6_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evf6_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evf6_id}/approve", payload: { expected_edit_rule_version: "${rf6_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F61", provider_id: "${pf6_id}", member_id: "M-F61", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pf6_id}", captures: { cf61_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf61_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pf6_id}" }
            - { call: "POST /payment-integrity/claims/${cf61_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cf61_id}" }, as: Any, captures: { tf61_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tf61_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tf61_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F62", provider_id: "${pf6_id}", member_id: "M-F62", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pf6_id}", captures: { cf62_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf62_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pf6_id}" }
            - { call: "POST /payment-integrity/claims/${cf62_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cf62_id}" }, as: Any, captures: { tf62_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tf62_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tf62_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F63", provider_id: "${pf6_id}", member_id: "M-F63", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pf6_id}", captures: { cf63_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf63_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pf6_id}" }
            - { call: "POST /payment-integrity/claims/${cf63_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cf63_id}" }, as: Any, captures: { tf63_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tf63_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tf63_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F64", provider_id: "${pf6_id}", member_id: "M-F64", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pf6_id}", captures: { cf64_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf64_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pf6_id}" }
            - { call: "POST /payment-integrity/claims/${cf64_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cf64_id}" }, as: Any, captures: { tf64_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tf64_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tf64_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/edit-versions/${evf6_id}", payload: {}, as: Any, captures: { st_before: $.data.status } }
            - { call: "GET /payment-integrity/claims/${cf64_id}", payload: {}, as: Any, captures: { cf64_v: $.data.version } }
