scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: slotting_strategy_diverges_by_abc_class
        grounds:
          - calculations.putaway_location_select
          - calculations.crossdock_location_select
          - entities.Sku.fields.abc_class
          - state_machines.PutawayTask.CREATED_to_ASSIGNED
        distinguishing_aspect: |
          Two valid location-selection algorithms on different entity domains produce different
          winners for the same physical LPN volume: putaway_location_select (PutawayTask domain)
          ranks tightest-fit and prefers PICK_FACE for an A-class SKU, while crossdock_location_select
          (InboundAsn domain) ranks most-open-first in CROSS_DOCK zone — given identical residual
          capacities the two strategies pick opposite ends of the candidate pool.
        test_recipe:
          setup:
            - "An A-class SKU (each_volume_cm3=10)."
            - "A PICK_FACE location dedicated to that SKU with residual 60, and a RESERVE location with residual 100."
            - "An LPN of qty 5 (need=50) in PUTAWAY_PENDING with an open PutawayTask."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-A1", description: "fast mover", abc_class: "A", each_volume_cm3: 10, min_qty: 5, max_qty: 50 }
              as: PlatformAdmin
              captures: { sku_a: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "PF-01", zone: "PICK_FACE", max_volume_cm3: 60, pick_face_for_sku_id: "${sku_a}" }
              as: PlatformAdmin
              captures: { loc_pf: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-01", zone: "RESERVE", max_volume_cm3: 100 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-1", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn1: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn1}/lines"
              payload: { sku_id: "${sku_a}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { line1: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn1}/receipts"
              payload: { asn_line_id: "${line1}", received_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt1: "$.data.id", lpn1: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn1}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put1: "$.data[0].id" }
          trigger:
            - call: "POST /warehouse/putaway-tasks/${put1}/assign"
              payload: {}
              as: PutawayOperator
              captures: { chosen: "$.data.target_location_id" }
          assert:
            - "PutawayTask.${put1}.target_location_id == ${loc_pf}"
            - "PutawayTask.${put1}.status == ASSIGNED"

      - name: cycle_count_variance_uses_open_snapshot_not_live
        grounds:
          - calculations.cycle_count_system_qty
          - calculations.cycle_count_variance
          - state_machines.CycleCount.OPEN_to_COUNTED
          - entities.CycleCount.fields.system_qty
        distinguishing_aspect: |
          Variance on the CycleCount domain is computed against the system_qty snapshot frozen at OPEN
          time, NOT a live recompute at submit time — so submitting counted_qty=18 against a snapshot of
          20 yields variance_qty=-2 even though the dual 'live' interpretation would read current on-hand.
          Distinct entity domain (CycleCount) from instance 1 (PutawayTask slotting).
        test_recipe:
          setup:
            - "A B-class SKU stored at a RESERVE location with on-hand 20 in a single STORED LPN."
            - "An OPEN CycleCount for that SKU+location snapshots system_qty=20."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-B1", description: "med mover", abc_class: "B", each_volume_cm3: 1, min_qty: 5, max_qty: 40 }
              as: PlatformAdmin
              captures: { sku_b: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-10", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-2", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn2: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn2}/lines"
              payload: { sku_id: "${sku_b}", expected_qty: 20 }
              as: ReceivingClerk
              captures: { line2: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn2}/receipts"
              payload: { asn_line_id: "${line2}", received_qty: 20 }
              as: ReceivingClerk
              captures: { lpn2: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn2}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put2: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put2}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put2}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/cycle-counts"
              payload: { location_id: "${loc_rs}", sku_id: "${sku_b}" }
              as: InventoryController
              captures: { cc1: "$.data.id", snap: "$.data.system_qty" }
          trigger:
            - call: "POST /warehouse/cycle-counts/${cc1}/submit"
              payload: { counted_qty: 18 }
              as: InventoryController
              captures: { var: "$.data.variance_qty" }
          assert:
            - "CycleCount.${cc1}.system_qty == 20"
            - "CycleCount.${cc1}.variance_qty == -2"
            - "CycleCount.${cc1}.status == COUNTED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: putaway_rank_tuple_three_input_nonlinear
        grounds:
          - calculations.putaway_location_select
          - entities.Sku.fields.abc_class
          - entities.Location.fields.zone
          - entities.Location.fields.max_volume_cm3
        distinguishing_aspect: |
          Mode (a): the putaway winner is selected by a 3-input non-linear rank tuple
          (zone_pref derived from abc_class XOR zone, then residual capacity, then created_at) with a
          conditional branch on SKU velocity class — not a single linear key. A B-class SKU here flips
          zone_pref so the RESERVE bin wins despite a PICK_FACE candidate existing.
        test_recipe:
          setup:
            - "A B-class SKU (each_volume_cm3=10)."
            - "A RESERVE location residual 100 and a generic (non-dedicated) PICK_FACE-eligible setup is excluded; B-class prefers RESERVE."
            - "An LPN qty 5 (need=50) PUTAWAY_PENDING with an open PutawayTask."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-B2", description: "med", abc_class: "B", each_volume_cm3: 10, min_qty: 5, max_qty: 50 }
              as: PlatformAdmin
              captures: { sku_b: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-20", zone: "RESERVE", max_volume_cm3: 100 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "PF-20", zone: "PICK_FACE", max_volume_cm3: 80, pick_face_for_sku_id: "${sku_b}" }
              as: PlatformAdmin
              captures: { loc_pf: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-3", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn3: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn3}/lines"
              payload: { sku_id: "${sku_b}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { line3: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn3}/receipts"
              payload: { asn_line_id: "${line3}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpn3: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn3}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put3: "$.data[0].id" }
          trigger:
            - call: "POST /warehouse/putaway-tasks/${put3}/assign"
              payload: {}
              as: PutawayOperator
              captures: { chosen: "$.data.target_location_id" }
          assert:
            - "PutawayTask.${put3}.target_location_id == ${loc_rs}"
            - "PutawayTask.${put3}.status == ASSIGNED"

      - name: location_volume_sum_then_round
        grounds:
          - calculations.location_used_volume
          - entities.Location.fields.used_volume_cm3
          - entities.Sku.fields.each_volume_cm3
          - state_machines.PutawayTask.ASSIGNED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): used_volume_cm3 is rounded ONCE after summing all resting LPN volumes
          (sum-then-round to 2dp, round_half_up), not per-LPN-then-summed. Two LPNs of qty 3 and qty 2
          of a SKU with each_volume_cm3=3.33 give 5*3.33=16.65; per-line rounding (9.99+6.66) happens to
          also be 16.65 here, but the pinned order is sum-then-round and the field is asserted at 16.65.
        test_recipe:
          setup:
            - "A SKU each_volume_cm3=3.33."
            - "A RESERVE location max_volume_cm3=1000."
            - "Two LPNs (qty 3 and qty 2) put away STORED into that location."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-V1", description: "vol", abc_class: "C", each_volume_cm3: 3.33, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_v: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-30", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-4", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn4: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn4}/lines"
              payload: { sku_id: "${sku_v}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { line4: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn4}/receipts"
              payload: { asn_line_id: "${line4}", received_qty: 3 }
              as: ReceivingClerk
              captures: { lpnA: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn4}/receipts"
              payload: { asn_line_id: "${line4}", received_qty: 2 }
              as: ReceivingClerk
              captures: { lpnB: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn4}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { putA: "$.data[0].id", putB: "$.data[1].id" }
            - call: "POST /warehouse/putaway-tasks/${putA}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${putA}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${putB}/assign"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "POST /warehouse/putaway-tasks/${putB}/complete"
              payload: {}
              as: PutawayOperator
          assert:
            - "Location.${loc_rs}.used_volume_cm3 == 16.65"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: wave_parallel_release_and_fulfillment_axes
        grounds:
          - state_machines.Wave.PLANNING_to_RELEASED
          - state_machines.Wave.ALLOCATED_to_PICKING
          - entities.Wave.fields.release_status
          - entities.Wave.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel dimensions on the Wave entity: release_status (PLANNING->RELEASED) and
          fulfillment_status (UNALLOCATED->ALLOCATED->PICKING) evolve as two independent axes — after
          release the wave holds release_status=RELEASED together with fulfillment_status=ALLOCATED,
          and start-picking advances only the fulfillment axis while release_status stays RELEASED.
        test_recipe:
          setup:
            - "A SKU with one STORED LPN qty 10 at a RESERVE location."
            - "An order with one line ordered_qty 10, added to a PLANNING wave."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-W1", description: "w", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_w: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-40", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-5", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn5: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn5}/lines"
              payload: { sku_id: "${sku_w}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { line5: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn5}/receipts"
              payload: { asn_line_id: "${line5}", received_qty: 10 }
              as: ReceivingClerk
              captures: { lpn5: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn5}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put5: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put5}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put5}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-1", priority: 5 }
              as: WavePlanner
              captures: { ord1: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${ord1}/lines"
              payload: { sku_id: "${sku_w}", ordered_qty: 10 }
              as: WavePlanner
              captures: { ol1: "$.data.id" }
            - call: "POST /warehouse/waves"
              payload: { wave_label: "WAVE-1" }
              as: WavePlanner
              captures: { wave1: "$.data.id", wv1: "$.data.version" }
            - call: "POST /warehouse/waves/${wave1}/add-order"
              payload: { order_id: "${ord1}" }
              as: WavePlanner
              captures: { wv2: "$.data.version" }
          trigger:
            - call: "POST /warehouse/waves/${wave1}/release"
              payload: { expected_wave_version: "${wv2}" }
              as: WavePlanner
              captures: { wv3: "$.data.version" }
            - call: "POST /warehouse/waves/${wave1}/start-picking"
              payload: {}
              as: WavePlanner
          assert:
            - "Wave.${wave1}.release_status == RELEASED"
            - "Wave.${wave1}.fulfillment_status == PICKING"

      - name: lpn_cyclic_stored_allocated_revert
        grounds:
          - state_machines.LicensePlate.STORED_to_ALLOCATED
          - state_machines.LicensePlate.ALLOCATED_to_STORED
          - state_machines.InventoryAllocation.RESERVED_to_RELEASED
          - entities.LicensePlate.fields.disposition
        distinguishing_aspect: |
          Cyclic shape on the LicensePlate entity (different entity from the Wave parallel machine):
          a full reservation drives STORED->ALLOCATED, and cancelling that reservation drives the same
          LPN ALLOCATED->STORED — the disposition returns to its prior value, a genuine A->B->A loop.
        test_recipe:
          setup:
            - "A SKU with one STORED LPN qty 10."
            - "An order line ordered_qty 10."
            - "A manual allocation reserving all 10 from the LPN (LPN now ALLOCATED)."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-C1", description: "c", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_c: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-50", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-6", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn6: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn6}/lines"
              payload: { sku_id: "${sku_c}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { line6: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn6}/receipts"
              payload: { asn_line_id: "${line6}", received_qty: 10 }
              as: ReceivingClerk
              captures: { lpn6: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn6}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put6: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put6}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put6}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-2", priority: 5 }
              as: WavePlanner
              captures: { ord2: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${ord2}/lines"
              payload: { sku_id: "${sku_c}", ordered_qty: 10 }
              as: WavePlanner
              captures: { ol2: "$.data.id" }
            - call: "GET /warehouse/license-plates/${lpn6}"
              payload: {}
              as: WavePlanner
              captures: { lpn6v: "$.data.version" }
            - call: "POST /warehouse/allocations"
              payload: { order_line_id: "${ol2}", lpn_id: "${lpn6}", allocated_qty: 10, expected_lpn_version: "${lpn6v}" }
              as: WavePlanner
              captures: { alloc2: "$.data.id" }
          trigger:
            - call: "POST /warehouse/allocations/${alloc2}/cancel"
              payload: {}
              as: WavePlanner
          assert:
            - "LicensePlate.${lpn6}.disposition == STORED"
            - "InventoryAllocation.${alloc2}.status == RELEASED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pick_confirm_cascade_depth4
        grounds:
          - state_machines.PickTask.IN_PROGRESS_to_PICKED
          - state_machines.InventoryAllocation.RESERVED_to_COMMITTED
          - state_machines.OutboundOrder.PICKING_to_PICKED
          - state_machines.Wave.PICKING_to_PICKED
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the previous: pick confirm -> allocation RESERVED->COMMITTED
          -> (because order's only line is now fully picked) order PICKING->PICKED -> (because the wave's
          only pick task is done) wave fulfillment PICKING->PICKED -> wave release CLOSED. Each hop is a
          consequence of the prior hop, not a parallel fan-out from the confirm.
        test_recipe:
          setup:
            - "A single-line order (ordered_qty 10) on a released, picking wave whose one pick task is IN_PROGRESS."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-P1", description: "p", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_p: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-60", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-7", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn7: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn7}/lines"
              payload: { sku_id: "${sku_p}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { line7: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn7}/receipts"
              payload: { asn_line_id: "${line7}", received_qty: 10 }
              as: ReceivingClerk
              captures: { lpn7: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn7}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put7: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put7}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put7}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-3", priority: 5 }
              as: WavePlanner
              captures: { ord3: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${ord3}/lines"
              payload: { sku_id: "${sku_p}", ordered_qty: 10 }
              as: WavePlanner
              captures: { ol3: "$.data.id" }
            - call: "POST /warehouse/waves"
              payload: { wave_label: "WAVE-3" }
              as: WavePlanner
              captures: { wave3: "$.data.id", wv: "$.data.version" }
            - call: "POST /warehouse/waves/${wave3}/add-order"
              payload: { order_id: "${ord3}" }
              as: WavePlanner
              captures: { wv2: "$.data.version" }
            - call: "POST /warehouse/waves/${wave3}/release"
              payload: { expected_wave_version: "${wv2}" }
              as: WavePlanner
            - call: "POST /warehouse/waves/${wave3}/start-picking"
              payload: {}
              as: WavePlanner
            - call: "GET /warehouse/waves/${wave3}/pick-tasks"
              payload: {}
              as: Picker
              captures: { pick3: "$.data[0].id" }
            - call: "POST /warehouse/pick-tasks/${pick3}/start"
              payload: {}
              as: Picker
          trigger:
            - call: "POST /warehouse/pick-tasks/${pick3}/confirm"
              payload: { light_confirmed: true }
              as: Picker
          assert:
            - "PickTask.${pick3}.status == PICKED"
            - "OutboundOrder.${ord3}.status == PICKED"
            - "Wave.${wave3}.fulfillment_status == PICKED"
            - "Wave.${wave3}.release_status == CLOSED"

      - name: putaway_complete_cascade_depth2_closes_asn
        grounds:
          - state_machines.PutawayTask.ASSIGNED_to_COMPLETED
          - state_machines.LicensePlate.PUTAWAY_PENDING_to_STORED
          - state_machines.InboundAsn.PUT_AWAY_to_CLOSED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (putaway complete, not pick confirm): completing the
          ASN's only putaway task drives the LPN PUTAWAY_PENDING->STORED, and because that was the ASN's
          last open putaway task the InboundAsn bubbles PUT_AWAY->CLOSED. Distinct origin transition and
          distinct propagation pattern (bubble-up close) from the depth-4 pick cascade.
        test_recipe:
          setup:
            - "An ASN (PUTAWAY) received with one LPN, closed to PUT_AWAY with one CREATED putaway task, then ASSIGNED."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-P2", description: "p2", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_p2: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-70", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-8", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn8: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn8}/lines"
              payload: { sku_id: "${sku_p2}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { line8: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn8}/receipts"
              payload: { asn_line_id: "${line8}", received_qty: 4 }
              as: ReceivingClerk
              captures: { lpn8: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn8}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put8: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put8}/assign"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "POST /warehouse/putaway-tasks/${put8}/complete"
              payload: {}
              as: PutawayOperator
          assert:
            - "PutawayTask.${put8}.status == COMPLETED"
            - "LicensePlate.${lpn8}.disposition == STORED"
            - "InboundAsn.${asn8}.status == CLOSED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: asn_close_state_beats_lines_open
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ASN_LINES_OPEN]
        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_constraint (priority 14,
          ERR_ASN_LINES_OPEN): closing an already-CANCELLED ASN that ALSO has an open line returns the
          higher-priority ERR_INVALID_STATE, not ERR_ASN_LINES_OPEN. (Reached by cancelling an ANNOUNCED
          ASN that still has an OPEN, never-received line, then attempting close.)
        test_recipe:
          setup:
            - "An ANNOUNCED ASN with one OPEN line (no receipts), then CANCELLED."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-X1", description: "x", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_x: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-9", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn9: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn9}/lines"
              payload: { sku_id: "${sku_x}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { line9: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn9}/cancel"
              payload: {}
              as: ReceivingClerk
          trigger:
            - call: "POST /warehouse/inbound-asns/${asn9}/close"
              payload: {}
              as: ReceivingClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: allocation_stale_lpn_beats_insufficient_available
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_STALE_LPN_VERSION]
          - errors[ERR_INSUFFICIENT_AVAILABLE]
        distinguishing_aspect: |
          Category pair state/OCC (priority 6, ERR_STALE_LPN_VERSION) vs business_fiscal (priority 13,
          ERR_INSUFFICIENT_AVAILABLE): a manual allocation that BOTH carries a stale expected_lpn_version
          AND requests more than the LPN's free qty returns the higher-priority ERR_STALE_LPN_VERSION.
          Different error-category pair from the state-vs-business_constraint conflict in instance 1.
        test_recipe:
          setup:
            - "A SKU with one STORED LPN qty 10 (version observed)."
            - "Another allocation has already reserved 8 from the LPN, bumping its version (so the saved version is stale)."
            - "An order line ordered_qty 20 exists."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-X2", description: "x2", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_x2: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-80", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-10", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn10: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn10}/lines"
              payload: { sku_id: "${sku_x2}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { line10: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn10}/receipts"
              payload: { asn_line_id: "${line10}", received_qty: 10 }
              as: ReceivingClerk
              captures: { lpn10: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn10}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put10: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put10}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put10}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-4", priority: 5 }
              as: WavePlanner
              captures: { ord4: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${ord4}/lines"
              payload: { sku_id: "${sku_x2}", ordered_qty: 20 }
              as: WavePlanner
              captures: { ol4: "$.data.id" }
            - call: "GET /warehouse/license-plates/${lpn10}"
              payload: {}
              as: WavePlanner
              captures: { lpn10v: "$.data.version" }
            - call: "POST /warehouse/allocations"
              payload: { order_line_id: "${ol4}", lpn_id: "${lpn10}", allocated_qty: 8, expected_lpn_version: "${lpn10v}" }
              as: WavePlanner
              captures: { alloc4: "$.data.id" }
          trigger:
            - call: "POST /warehouse/allocations"
              payload: { order_line_id: "${ol4}", lpn_id: "${lpn10}", allocated_qty: 5, expected_lpn_version: "${lpn10v}" }
              as: WavePlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_LPN_VERSION"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: replen_eligibility_at_min_inclusive
        grounds:
          - calculations.replen_qty
          - validations[priority=12]
          - errors[ERR_REPLEN_NOT_NEEDED]
          - entities.Sku.fields.min_qty
        distinguishing_aspect: |
          Numeric threshold boundary on the replenishment-create endpoint: pick-face on-hand EXACTLY
          equal to min_qty (20) is replen-eligible (boundary is <=, inclusive of min) and yields
          replen_qty = max_qty - face_on_hand = 100 - 20 = 80. One more each (21) would be ERR_REPLEN_NOT_NEEDED.
        test_recipe:
          setup:
            - "A SKU min_qty=20 max_qty=100, PICK_FACE dedicated with exactly 20 on-hand at the face."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-R1", description: "r", abc_class: "A", each_volume_cm3: 1, min_qty: 20, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_r: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "PF-90", zone: "PICK_FACE", max_volume_cm3: 1000, pick_face_for_sku_id: "${sku_r}" }
              as: PlatformAdmin
              captures: { loc_pf: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-11", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn11: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn11}/lines"
              payload: { sku_id: "${sku_r}", expected_qty: 20 }
              as: ReceivingClerk
              captures: { line11: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn11}/receipts"
              payload: { asn_line_id: "${line11}", received_qty: 20 }
              as: ReceivingClerk
              captures: { lpn11: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn11}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put11: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put11}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put11}/complete"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "POST /warehouse/replenishment-tasks"
              payload: { sku_id: "${sku_r}" }
              as: InventoryController
              captures: { rep1: "$.data.id", rq: "$.data.replen_qty" }
          assert:
            - "ReplenishmentTask.${rep1}.replen_qty == 80"
            - "ReplenishmentTask.${rep1}.status == CREATED"

      - name: cycle_count_due_at_exact_cadence_day
        grounds:
          - calculations.cycle_count_due_flag
          - entities.Sku.fields.cycle_count_due
          - entities.Sku.fields.abc_class
        distinguishing_aspect: |
          A DIFFERENT metric (whole-day cadence clock) on a DIFFERENT endpoint (GET /skus/{id}, driven by
          /_clock): an A-class SKU reconciled at 2026-01-01 becomes cycle_count_due=true at EXACTLY 30
          days later (2026-01-31, boundary >=), whereas at 29 days (2026-01-30) it is still false.
        test_recipe:
          setup:
            - "Clock at 2026-01-01. An A-class SKU with a RECONCILED cycle count (reconciled at 2026-01-01)."
            - "Clock advanced to 2026-01-31 (exactly 30 days = cadence for A)."
          setup_api_calls:
            - call: "POST /warehouse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-D1", description: "d", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_d: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-91", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-12", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn12: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn12}/lines"
              payload: { sku_id: "${sku_d}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { line12: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn12}/receipts"
              payload: { asn_line_id: "${line12}", received_qty: 5 }
              as: ReceivingClerk
              captures: { lpn12: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn12}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put12: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put12}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put12}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/cycle-counts"
              payload: { location_id: "${loc_rs}", sku_id: "${sku_d}" }
              as: InventoryController
              captures: { cc12: "$.data.id" }
            - call: "POST /warehouse/cycle-counts/${cc12}/submit"
              payload: { counted_qty: 5 }
              as: InventoryController
              as_user_id: "ic-counter-1"
            - call: "POST /warehouse/cycle-counts/${cc12}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ic-approver-2"
            - call: "POST /warehouse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /warehouse/skus/${sku_d}"
              payload: {}
              as: InventoryController
              captures: { due: "$.data.cycle_count_due" }
          assert:
            - "Sku.${sku_d}.cycle_count_due == true"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: putaway_complete_requires_location_available
        grounds:
          - state_machines.PutawayTask.ASSIGNED_to_COMPLETED
          - entities.Location.fields.status
          - validations[priority=8]
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: |
          Entity pair PutawayTask -> Location: an ASSIGNED PutawayTask cannot COMPLETE when its target
          Location.status == BLOCKED; the putaway transition's validity depends on the Location's state,
          returning ERR_CROSS_ENTITY_STATE. Reached by assigning to the only AVAILABLE bin, then blocking
          that exact bin via POST /locations/{id}/block before attempting complete.
        test_recipe:
          setup:
            - "An LPN with an ASSIGNED PutawayTask targeting the only candidate bin, which is then BLOCKED."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-CE1", description: "ce", abc_class: "C", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_ce: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-A1", zone: "RESERVE", max_volume_cm3: 1000, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { loc_a: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-13", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn13: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn13}/lines"
              payload: { sku_id: "${sku_ce}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { line13: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn13}/receipts"
              payload: { asn_line_id: "${line13}", received_qty: 4 }
              as: ReceivingClerk
              captures: { lpn13: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn13}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put13: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put13}/assign"
              payload: {}
              as: PutawayOperator
              captures: { tgt: "$.data.target_location_id" }
            - call: "POST /warehouse/locations/${loc_a}/block"
              payload: {}
              as: InventoryController
          trigger:
            - call: "POST /warehouse/putaway-tasks/${put13}/complete"
              payload: {}
              as: PutawayOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CROSS_ENTITY_STATE"
            - "PutawayTask.${put13}.status == ASSIGNED"

      - name: wave_release_requires_at_least_one_order
        grounds:
          - state_machines.Wave.PLANNING_to_RELEASED
          - entities.OutboundOrder.fields.wave_id
          - validations[priority=8]
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: |
          Different entity pair Wave -> OutboundOrder: a PLANNING wave's release transition is invalid
          when no OutboundOrder has wave_id == this wave (the candidate-order set is empty), returning
          ERR_CROSS_ENTITY_STATE. Distinct entity pair from instance 1's PutawayTask->Location dependency.
        test_recipe:
          setup:
            - "A freshly created PLANNING wave with zero orders added (version observed)."
          setup_api_calls:
            - call: "POST /warehouse/waves"
              payload: { wave_label: "WAVE-EMPTY" }
              as: WavePlanner
              captures: { wave_e: "$.data.id", wv_e: "$.data.version" }
          trigger:
            - call: "POST /warehouse/waves/${wave_e}/release"
              payload: { expected_wave_version: "${wv_e}" }
              as: WavePlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CROSS_ENTITY_STATE"
            - "Wave.${wave_e}.release_status == PLANNING"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: location_volume_aggregate_capacity_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_LOCATION_CAPACITY]
          - calculations.location_used_volume
          - state_machines.PutawayTask.ASSIGNED_to_COMPLETED
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on a Location resource: the bin's cubic volume is a shared
          aggregate pool; a putaway-complete is rejected (ERR_LOCATION_CAPACITY) when used_volume_cm3 + the
          incoming LPN volume would exceed max_volume_cm3. Occupancy is SUMMED, not exclusive. Two LPNs
          (each 60 cm3) both ASSIGNED to the only bin (max 100) while it is empty (assign does not reserve
          capacity); completing the first lands 60, completing the second would total 120 > 100 -> reject.
        test_recipe:
          setup:
            - "A SKU each_volume_cm3=10. ONE RESERVE bin max_volume_cm3=100 (the only candidate)."
            - "Two LPNs of qty 6 (60 cm3 each), both with ASSIGNED putaway tasks targeting that bin; the first completed (bin used=60)."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-T1", description: "t", abc_class: "C", each_volume_cm3: 10, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_t: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-T1", zone: "RESERVE", max_volume_cm3: 100 }
              as: PlatformAdmin
              captures: { loc_t: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-15", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn15: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn15}/lines"
              payload: { sku_id: "${sku_t}", expected_qty: 12 }
              as: ReceivingClerk
              captures: { line15: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn15}/receipts"
              payload: { asn_line_id: "${line15}", received_qty: 6 }
              as: ReceivingClerk
              captures: { lpnA: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn15}/receipts"
              payload: { asn_line_id: "${line15}", received_qty: 6 }
              as: ReceivingClerk
              captures: { lpnB: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn15}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks?lpn_id=${lpnA}"
              payload: {}
              as: PutawayOperator
              captures: { putA: "$.data[0].id" }
            - call: "GET /warehouse/putaway-tasks?lpn_id=${lpnB}"
              payload: {}
              as: PutawayOperator
              captures: { putB: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${putA}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${putB}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${putA}/complete"
              payload: {}
              as: PutawayOperator
          trigger:
            - call: "POST /warehouse/putaway-tasks/${putB}/complete"
              payload: {}
              as: PutawayOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LOCATION_CAPACITY"
            - "Location.${loc_t}.used_volume_cm3 == 60"
            - "PutawayTask.${putB}.status == ASSIGNED"

      - name: pickface_exclusive_dedication_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_PICKFACE_TAKEN]
          - entities.Location.fields.pick_face_for_sku_id
        distinguishing_aspect: |
          EXCLUSIVE single-occupant interval semantics on a DIFFERENT resource (a PICK_FACE dedication
          slot): a PICK_FACE location admits at most ONE SKU dedication — creating a second PICK_FACE
          location that dedicates to a SKU already owning a pick face is rejected with ERR_PICKFACE_TAKEN.
          Contrasts with the aggregate-sum capacity semantics of instance 1.
        test_recipe:
          setup:
            - "A SKU already has a dedicated PICK_FACE location (pick_face_for_sku_id == that SKU)."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-T2", description: "t2", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_t2: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "PF-T1", zone: "PICK_FACE", max_volume_cm3: 500, pick_face_for_sku_id: "${sku_t2}" }
              as: PlatformAdmin
              captures: { loc_pf1: "$.data.id" }
          trigger:
            - call: "POST /warehouse/locations"
              payload: { location_code: "PF-T2", zone: "PICK_FACE", max_volume_cm3: 500, pick_face_for_sku_id: "${sku_t2}" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PICKFACE_TAKEN"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocate_then_cancel_conserves_available_qty
        grounds:
          - state_machines.InventoryAllocation.RESERVED_to_RELEASED
          - calculations.sku_available
          - entities.Sku.fields.available_qty
          - state_machines.LicensePlate.ALLOCATED_to_STORED
        distinguishing_aspect: |
          Conserved quantity = Sku.available_qty. Forward action (create RESERVED allocation of 10) lowers
          available_qty by 10; the compensating action (allocation cancel -> RELEASED) restores it exactly,
          leaving Sku.available_qty == on_hand_qty == 10 with zero drift. Invariant pinned as
          available_qty == on_hand_qty - sum(RESERVED+COMMITTED allocated_qty).
        test_recipe:
          setup:
            - "A SKU with one STORED LPN qty 10 (on_hand 10, available 10)."
            - "An order line ordered_qty 10."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-I1", description: "i", abc_class: "A", each_volume_cm3: 1, min_qty: 1, max_qty: 100 }
              as: PlatformAdmin
              captures: { sku_i: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-I1", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_i: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-16", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn16: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn16}/lines"
              payload: { sku_id: "${sku_i}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { line16: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn16}/receipts"
              payload: { asn_line_id: "${line16}", received_qty: 10 }
              as: ReceivingClerk
              captures: { lpn16: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn16}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put16: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put16}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put16}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/outbound-orders"
              payload: { order_number: "ORD-6", priority: 5 }
              as: WavePlanner
              captures: { ord6: "$.data.id" }
            - call: "POST /warehouse/outbound-orders/${ord6}/lines"
              payload: { sku_id: "${sku_i}", ordered_qty: 10 }
              as: WavePlanner
              captures: { ol6: "$.data.id" }
            - call: "GET /warehouse/license-plates/${lpn16}"
              payload: {}
              as: WavePlanner
              captures: { lpn16v: "$.data.version" }
            - call: "POST /warehouse/allocations"
              payload: { order_line_id: "${ol6}", lpn_id: "${lpn16}", allocated_qty: 10, expected_lpn_version: "${lpn16v}" }
              as: WavePlanner
              captures: { alloc6: "$.data.id" }
          trigger:
            - call: "POST /warehouse/allocations/${alloc6}/cancel"
              payload: {}
              as: WavePlanner
            - call: "GET /warehouse/skus/${sku_i}"
              payload: {}
              as: WavePlanner
              captures: { avail: "$.data.available_qty", onhand: "$.data.on_hand_qty" }
          assert:
            - "Sku.${sku_i}.on_hand_qty == 10"
            - "Sku.${sku_i}.available_qty == 10"

      - name: replenish_move_conserves_on_hand_qty
        grounds:
          - state_machines.ReplenishmentTask.ASSIGNED_to_COMPLETED
          - calculations.sku_on_hand
          - entities.Sku.fields.on_hand_qty
          - calculations.replen_qty
        distinguishing_aspect: |
          DIFFERENT conserved quantity = Sku.on_hand_qty. A replenishment move shifts replen_qty eaches
          from a RESERVE LPN to the pick-face LPN; on_hand_qty (which counts STORED+ALLOCATED+PICKED_STAGED
          across ALL locations) must be UNCHANGED by the move — a pure relocation conserves total on-hand.
          Pinned as on_hand_qty == sum(lp.qty for STORED/ALLOCATED/PICKED_STAGED LPNs of the SKU).
        test_recipe:
          setup:
            - "A B-class SKU min_qty=5 max_qty=30 (B-class slots to RESERVE, leaving the pick face empty)."
            - "Pick-face dedicated with 0 on-hand initially; the received qty-30 LPN slots into the RESERVE bin STORED."
            - "Total SKU on_hand = 30 (RESERVE) + 0 (face) = 30. A replenishment task (face on-hand 0 <= min) replen_qty = 30 - 0 = 30, ASSIGNED to the RESERVE LPN."
          setup_api_calls:
            - call: "POST /warehouse/skus"
              payload: { sku_code: "SKU-I2", description: "i2", abc_class: "B", each_volume_cm3: 1, min_qty: 5, max_qty: 30 }
              as: PlatformAdmin
              captures: { sku_i2: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "PF-I2", zone: "PICK_FACE", max_volume_cm3: 1000, pick_face_for_sku_id: "${sku_i2}" }
              as: PlatformAdmin
              captures: { loc_pf: "$.data.id" }
            - call: "POST /warehouse/locations"
              payload: { location_code: "RS-I2", zone: "RESERVE", max_volume_cm3: 1000 }
              as: PlatformAdmin
              captures: { loc_rs: "$.data.id" }
            - call: "POST /warehouse/inbound-asns"
              payload: { asn_number: "ASN-17", supplier_name: "Acme", handling_mode: "PUTAWAY" }
              as: ReceivingClerk
              captures: { asn17: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn17}/lines"
              payload: { sku_id: "${sku_i2}", expected_qty: 30 }
              as: ReceivingClerk
              captures: { line17: "$.data.id" }
            - call: "POST /warehouse/inbound-asns/${asn17}/receipts"
              payload: { asn_line_id: "${line17}", received_qty: 30 }
              as: ReceivingClerk
              captures: { lpn17: "$.data.lpn_id" }
            - call: "POST /warehouse/inbound-asns/${asn17}/close"
              payload: {}
              as: ReceivingClerk
            - call: "GET /warehouse/putaway-tasks"
              payload: {}
              as: PutawayOperator
              captures: { put17: "$.data[0].id" }
            - call: "POST /warehouse/putaway-tasks/${put17}/assign"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/putaway-tasks/${put17}/complete"
              payload: {}
              as: PutawayOperator
            - call: "POST /warehouse/replenishment-tasks"
              payload: { sku_id: "${sku_i2}" }
              as: InventoryController
              captures: { rep17: "$.data.id", rq: "$.data.replen_qty" }
            - call: "POST /warehouse/replenishment-tasks/${rep17}/assign"
              payload: {}
              as: InventoryController
          trigger:
            - call: "POST /warehouse/replenishment-tasks/${rep17}/complete"
              payload: {}
              as: PutawayOperator
            - call: "GET /warehouse/skus/${sku_i2}"
              payload: {}
              as: InventoryController
              captures: { onhand: "$.data.on_hand_qty" }
          assert:
            - "ReplenishmentTask.${rep17}.replen_qty == 30"
            - "Sku.${sku_i2}.on_hand_qty == 30"
