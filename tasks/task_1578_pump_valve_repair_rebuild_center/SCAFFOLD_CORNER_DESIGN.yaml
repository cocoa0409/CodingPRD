        distinguishing_aspect: "Every FK is reverse-reachable: quotes by repair_order_id, test runs and certifications as sub-resources, pool units by reserved_for_ro_id, parts by superseded_by_id — all returning arrays."
        test_recipe:
          setup: ["full chain: customer, asset, window, RO, DRAFT report, quote q1; part P2 superseding P1 (P1 OBSOLETE with superseded_by_id P2)"]
