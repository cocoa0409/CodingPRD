            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler, captures: { f1: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-04T09:00:00Z", end_time: "2026-08-04T09:20:00Z", igrt_planned: true }, as: Scheduler, captures: { f2: $.data.id } }
            - { call: "POST /oncology/fraction-sessions/${f1}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
          trigger:
            - { call: "POST /oncology/fraction-sessions/${f2}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "GET /oncology/billing-claims/${clm}/charge-lines", payload: {}, as: BillingCoordinator, as_user_id: "bill_a" }
          assert:
            - "exactly one IGRT line (amount_cents 7500, event_ref_id ${f2}) exists; no IGRT line references ${f1}"
            - "exactly one FIRST_FRACTION_SETUP line (12000, event_ref_id ${f1}) exists"
            - "two FRACTION_DELIVERY lines of 32000 each exist"

      - name: provisional_noshow_exclusion_from_delivered_count
        claim_type: input_set_filtering
        grounds: [calculations.billing_provisional_total]
        distinguishing_aspect: "provisional projection subtracts only DELIVERED fractions from planned; a NO_SHOW session leaves `remaining` unchanged."
        excluded_because:
          difficulty_instance: billing_provisional_vs_final_settlement
          rationale: "The difficulty instance's setup includes a NO_SHOW session and asserts provisional_total_cents == 502000, which holds only when the no-show does not reduce the (5 - 3) projection."

      - name: simulator_daily_capacity_ninth_rejected
        claim_type: correct_result
        grounds: [calculations.simulator_slot_overlap, "validations[priority=13]"]
        distinguishing_aspect: "Aggregate-capacity boundary on a CT_SIMULATOR: 8 bookings on the same UTC date succeed; the 9th fails with ERR_SIMULATOR_DAILY_CAPACITY even though its 16:00 slot overlaps nothing."
        test_recipe:
          setup: ["course SIMULATION_SCHEDULED; CT-Sim-C5 OPERATIONAL with 8 non-overlapping appointments on 2026-08-03"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-C5", full_name: "Calc Five", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-C5", machine_type: "CT_SIMULATOR", room: "SIM5" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T08:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T10:00:00Z", end_time: "2026-08-03T10:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T11:00:00Z", end_time: "2026-08-03T11:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T12:00:00Z", end_time: "2026-08-03T12:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T13:00:00Z", end_time: "2026-08-03T13:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T14:00:00Z", end_time: "2026-08-03T14:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T15:00:00Z", end_time: "2026-08-03T15:30:00Z", immobilization_device: "NONE" }, as: Scheduler }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T16:00:00Z", end_time: "2026-08-03T16:30:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SIMULATOR_DAILY_CAPACITY (the 9th booking on 2026-08-03 exceeds SIM_DAILY_CAPACITY 8)"

      - name: fraction_count_limit_boundary
        claim_type: correct_result
        grounds: [calculations.fraction_dose_allocation, "validations[priority=13]"]
        distinguishing_aspect: "Booking is allowed while SCHEDULED + DELIVERED < plan.planned_fractions: for a 2-fraction plan the 2nd booking succeeds and the 3rd fails with ERR_FRACTION_COUNT_EXCEEDED."
        test_recipe:
          setup: ["THREE_DCRT course 400/2 TREATMENT_READY; two sessions already booked"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-C6", full_name: "Calc Six", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C18", intent: "PALLIATIVE", technique: "THREE_DCRT", prescribed_total_dose_cGy: 400, planned_fractions: 2 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-C6", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-C6", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 400, planned_fractions: 2, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Bowel", constraint_type: "MAX_DOSE", limit_cGy: 400, evaluated_value_cGy: 350 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-04T09:00:00Z", end_time: "2026-08-04T09:20:00Z" }, as: Scheduler }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T09:20:00Z" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FRACTION_COUNT_EXCEEDED (SCHEDULED 2 + DELIVERED 0 already equals plan.planned_fractions 2)"
  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: unknown_role_rejected_as_invalid_context
        claim_type: violation_to_error
        grounds: ["validations[priority=1]"]
        distinguishing_aspect: "An X-User-Role value outside the seven declared roles fails priority 1 (400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER), not the priority-2 role-permission check (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V1", full_name: "Val One", date_of_birth: "1980-01-01" }, as: "UnregisteredRole", captures: { err: $.data.error_id } }
          assert:
            - "the request with X-User-Role: UnregisteredRole yields err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), proving p1 fires before p2 ERR_FORBIDDEN_ROLE"

      - name: forbidden_role_precedes_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Authorization (p2) precedes existence (p3): a Scheduler creating a course under a non-existent patient id gets ERR_FORBIDDEN_ROLE, never ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /oncology/patients/00000000-0000-4000-8000-00000000dead/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (403) even though the patient id does not exist"

      - name: sbrt_immobilization_required
        claim_type: conditional_validation
        grounds: ["validations[priority=11]", entities.SimulationAppointment.fields.immobilization_device]
        distinguishing_aspect: "The immobilization rule is conditional on course.technique == SBRT: NONE and VACUUM_CRADLE are rejected with ERR_IMMOBILIZATION_REQUIRED while BODY_FRAME passes; the same devices are all legal for IMRT."
        test_recipe:
          setup: ["SBRT course CONSULT; CT simulator OPERATIONAL"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V3", full_name: "Val Three", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C34", intent: "CURATIVE", technique: "SBRT", prescribed_total_dose_cGy: 3000, planned_fractions: 5 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-V3", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:30:00Z", immobilization_device: "NONE" }, as: Scheduler, captures: { err1: $.data.error_id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:30:00Z", immobilization_device: "VACUUM_CRADLE" }, as: Scheduler, captures: { err2: $.data.error_id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:30:00Z", immobilization_device: "BODY_FRAME" }, as: Scheduler, captures: { ok_id: $.data.id } }
          assert:
            - "err1 == ERR_IMMOBILIZATION_REQUIRED and err2 == ERR_IMMOBILIZATION_REQUIRED"
            - "BODY_FRAME booking ${ok_id} succeeds with status SCHEDULED"

      - name: fraction_on_simulator_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", entities.FractionSession.fields.machine_id]
        distinguishing_aspect: "machine_type must match usage: booking a fraction on a CT_SIMULATOR fails with ERR_MACHINE_TYPE_MISMATCH."
        test_recipe:
          setup: ["IMRT course 2000/10 TREATMENT_READY with approved plan"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V4", full_name: "Val Four", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-V4", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 2000, evaluated_value_cGy: 1500 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${sim_m}", start_time: "2026-08-03T10:00:00Z", end_time: "2026-08-03T10:20:00Z" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MACHINE_TYPE_MISMATCH (fraction delivery requires a LINAC)"

      - name: adaptation_check_requires_on_treatment
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", state_machines.TreatmentCourse.ON_TREATMENT_to_ADAPTATION_REQUIRED]
        distinguishing_aspect: "adaptation-checks on a PLANNING course (never delivered a fraction) fails with ERR_COURSE_NOT_ON_TREATMENT; the weight-loss numbers are irrelevant until treatment starts."
        test_recipe:
          setup: ["course in PLANNING (contour approved, no plan submitted)"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V5", full_name: "Val Five", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-V5", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/adaptation-checks", payload: { current_weight_kg: 60.0 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_COURSE_NOT_ON_TREATMENT"
            - "TreatmentCourse.${crs}.status remains PLANNING"

      - name: plan_create_before_planning_state_wins_over_contour_check
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=10]"]
        distinguishing_aspect: "Course-state (p6) precedes referential (p10): creating a plan while the course is CONTOURING and the referenced contour is merely SUBMITTED yields ERR_COURSE_NOT_PLANNING, not ERR_CONTOUR_NOT_APPROVED."
        test_recipe:
          setup: ["course CONTOURING with a SUBMITTED (not approved) contour set"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V6", full_name: "Val Six", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-V6", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_COURSE_NOT_PLANNING (state p6 beats referential p10)"

      - name: adaptation_plan_requires_adapting_state
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", entities.TreatmentPlan.fields.supersedes_plan_id]
        distinguishing_aspect: "A plan carrying supersedes_plan_id while the course is ON_TREATMENT (no adaptation triggered) fails with ERR_COURSE_NOT_ADAPTING."
        test_recipe:
          setup: ["IMRT course 2000/10 ON_TREATMENT with plan A ACTIVE and 1 delivered fraction"]
