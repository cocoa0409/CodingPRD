scenario: |
  Generate task harder than expert level!

  2656. Seed Production & Conditioning Contract (seed production operations): production acreage
  contracting with growers including isolation distance requirements and field history restrictions,
  field inspection for varietal purity, weed and disease with rogueing requirements, harvest
  coordination with dedicated equipment cleanout to prevent varietal mixing, conditioning through
  cleaning, sizing, treating and bagging with lot identity preservation, germination and purity
  testing with certification agency sampling and tag issuance, carryover inventory management with
  retest requirements before the next season, grower payment based on clean seed units with dockage
  and quality adjustments, seed treatment regulatory compliance and labeling

domain_name: seed-production-conditioning
api_prefix: "/seed-ops"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # Lot lineage is self-referential (carryover successor -> parent lot), inspections/harvests/runs
  # attach to peer resource entities (HarvestEquipment, ConditioningLine) that are NOT ancestors of
  # the lot, and ProductionContract joins three independent parents (Grower, Variety,
  # ProductionField). No single ownership tree exists.

  state_machine_shape: cyclic
  # ProductionContract cycles PLANTED -> ROGUEING_REQUIRED -> PLANTED once per rogueing round.
  # SeedLot additionally carries two independent state axes (conditioning_status x
  # certification_status), and FieldInspection forks into three outcome branches with divergent
  # side-effect sets.

  relationship_patterns:
    - one_to_many          # ProductionContract -> SeedLot, SeedLot -> ConditioningRun
    - self_referential     # SeedLot.parent_seed_lot_id -> SeedLot.id (carryover generations)
    - cross_aggregate      # ConditioningRun spans SeedLot and ConditioningLine aggregates
    - polymorphic_absent   # explicitly not used

  role_model: segregation_of_duties
  # The FieldOfficer who recorded a failing inspection may not verify its rogueing; the
  # SettlementAccountant who computed a settlement may not approve it. Both are enforced on
  # X-User-ID, not on role alone.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Variety
    parent: null
    common_fields: false
    fields:
      - { name: crop_kind, type: enum, source: input, description: "Crop species of this variety", constraints: "one of WHEAT, TRITICALE, SOYBEAN, SUNFLOWER, ALFALFA, CANOLA" }
      - { name: variety_name, type: string, source: input, description: "Trade name of the variety" }
      - { name: max_seed_class, type: enum, source: input, description: "Highest certifiable class for this variety", constraints: "one of FOUNDATION, REGISTERED, CERTIFIED" }
      - { name: isolation_min_m, type: number, source: input, description: "Minimum required isolation distance in metres from an incompatible pollen source" }
      - { name: restricted_prior_crop_kinds, type: array, source: input, description: "Crop kinds that disqualify a field when grown recently; array of crop_kind enum values" }
      - { name: restricted_prior_crop_years, type: integer, source: input, description: "Look-back window in crop years for restricted prior crops", constraints: ">= 1" }
      - { name: germination_min_pct, type: number, source: input, description: "Minimum germination percentage for certification" }
      - { name: purity_min_pct, type: number, source: input, description: "Minimum pure-seed percentage for certification" }
      - { name: max_off_type_per_10000, type: number, source: input, description: "Maximum tolerated off-type plants per 10000 inspected plants" }
      - { name: max_restricted_weed_per_10000, type: number, source: input, description: "Maximum tolerated restricted weed plants per 10000 inspected plants" }
      - { name: max_disease_incidence_pct, type: number, source: input, description: "Maximum tolerated seed-borne disease incidence percentage" }
      - { name: max_rogueing_rounds, type: integer, source: input, description: "Maximum rogueing rounds a contract may consume before the field is rejected", default: 2 }
      - { name: estimated_conditioning_shrink_pct, type: number, source: input, description: "Book shrink percentage used by the PROVISIONAL_HARVEST_BASIS unit variant" }
      - { name: germ_validity_days, type: integer, source: input, description: "Days a germination result stays valid before a retest is required" }
      - { name: max_carryover_generations, type: integer, source: input, description: "Maximum carryover generations a lot lineage may reach", default: 2 }
      - { name: treatment_required, type: boolean, source: input, description: "Whether a TREATING conditioning stage is mandatory before bagging", default: false }

  - name: TreatmentProduct
    parent: null
    common_fields: false
    fields:
      - { name: product_code, type: string, source: input, description: "Registrant product code", constraints: "unique" }
      - { name: epa_registration_number, type: string, source: input, description: "Regulatory registration number printed on the treated-seed label" }
      - { name: allowed_crop_kinds, type: array, source: input, description: "Crop kinds this product is labeled for; array of crop_kind enum values" }
      - { name: max_rate_g_per_100kg, type: number, source: input, description: "Label maximum application rate in grams per 100 kg of seed" }
      - { name: requires_dye, type: boolean, source: input, description: "Whether treated seed must be dyed, forcing an explicit label_text on the TREATING run", default: false }
      - { name: restricted_use, type: boolean, source: input, description: "Whether the product is restricted-use, forcing signal-word disclosure in label_text", default: false }
      - { name: label_signal_word, type: enum, source: input, description: "Signal word that must appear in the run label text when restricted_use is true", constraints: "one of CAUTION, WARNING, DANGER" }

  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: grower_name, type: string, source: input, description: "Legal name of the seed grower" }
      - { name: region_code, type: string, source: input, description: "Production region code" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: computed, description: "Compliance standing derived from compliance_flag_count", default: "GOOD_STANDING", constraints: "one of GOOD_STANDING, WATCH, SUSPENDED" }
      - { name: compliance_flag_count, type: integer, source: computed, description: "Count of contracts of this grower that have entered ROGUEING_REQUIRED or REJECTED", default: 0 }

  - name: ProductionField
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; the grower that farms this field" }
      - { name: field_code, type: string, source: input, description: "Grower-scoped field identifier", constraints: "unique per grower_id" }
      - { name: acres, type: number, source: input, description: "Tillable acres of the field" }
      - { name: isolation_distance_m, type: number, source: input, description: "Surveyed distance in metres to the nearest incompatible pollen source" }
      - { name: last_assessed_risk_score, type: number, source: computed, description: "contamination_risk_score of the most recent eligibility assessment; null before the first assessment" }
      - { name: history_record_count, type: integer, source: computed, description: "Number of FieldHistoryRecord rows attached to this field", default: 0 }

  - name: FieldHistoryRecord
    parent: ProductionField
    common_fields: false
    fields:
      - { name: production_field_id, type: string, source: input, description: "FK -> ProductionField.id; the field this cropping year belongs to" }
      - { name: crop_kind, type: enum, source: input, description: "Crop grown on the field that year", constraints: "one of WHEAT, TRITICALE, SOYBEAN, SUNFLOWER, ALFALFA, CANOLA" }
      - { name: crop_year, type: integer, source: input, description: "Calendar crop year", constraints: "1990 <= crop_year <= 2100; unique per production_field_id" }
      - { name: source_note, type: string, source: input, description: "Provenance of the history claim", default: "GROWER_DECLARED" }

  - name: ProductionContract
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; contracted grower" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; variety under production" }
      - { name: production_field_id, type: string, source: input, description: "FK -> ProductionField.id; field dedicated to this contract" }
      - { name: season_year, type: integer, source: input, description: "Production season year", constraints: "2000 <= season_year <= 2100" }
      - { name: seed_class, type: enum, source: input, description: "Class being produced; selects the eligibility variant", constraints: "one of FOUNDATION, REGISTERED, CERTIFIED, COMMERCIAL_INCREASE" }
      - { name: contracted_acres, type: number, source: input, description: "Acres committed under the contract", constraints: "> 0 and <= ProductionField.acres" }
      - { name: base_price_per_unit_cents, type: integer, source: input, description: "Contract base price per clean seed unit in cents", constraints: "> 0" }
      - { name: conditioning_charge_per_unit_cents, type: integer, source: input, description: "Conditioning charge deducted per clean seed unit in cents", constraints: ">= 0" }
      - { name: advance_total_cents, type: integer, source: input, description: "Total pre-season cash advance extended to the grower", constraints: ">= 0" }
      - { name: advance_outstanding_cents, type: integer, source: computed, description: "Advance not yet recovered through an APPROVED or PAID settlement; initialised to advance_total_cents" }
      - { name: status, type: enum, source: computed, description: "Contract lifecycle state", default: "DRAFT", constraints: "one of DRAFT, OFFERED, PLANTED, ROGUEING_REQUIRED, INSPECTION_PASSED, HARVESTED, SETTLED, CLOSED, REJECTED, CANCELLED" }
      - { name: planted_on, type: string, source: input, description: "ISO 8601 date the field was planted; supplied at signing" }
      - { name: inspection_round, type: integer, source: computed, description: "Number of FieldInspection rows recorded against this contract", default: 0 }
      - { name: rogueing_rounds_used, type: integer, source: computed, description: "Number of times this contract has entered ROGUEING_REQUIRED", default: 0 }
      - { name: eligibility_variant_applied, type: enum, source: computed, description: "Eligibility variant used by the DRAFT->OFFERED gate; null before offer", constraints: "one of STRICT_HISTORY, DECAY_WEIGHTED" }
      - { name: eligibility_risk_score, type: number, source: computed, description: "contamination_risk_score recorded by the DRAFT->OFFERED gate; null before offer" }
      - { name: provisional_clean_units_total, type: number, source: computed, description: "Sum of HarvestEvent.provisional_clean_units over this contract's harvest events", default: 0 }
      - { name: certified_units_total, type: number, source: computed, description: "Sum of SeedLot.final_clean_units over this contract's lots whose certification_status == TAGGED", default: 0 }
      - { name: requires_field_officer_review, type: boolean, source: computed, description: "Set by the grower-standing cascade when the grower drops to WATCH while this contract is still DRAFT or OFFERED", default: false }
      - { name: cancel_reason, type: string, source: input, description: "Reason recorded on cancellation; null otherwise" }

  - name: FieldInspection
    parent: ProductionContract
    common_fields: true
    fields:
      - { name: production_contract_id, type: string, source: input, description: "FK -> ProductionContract.id; contract inspected" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the FieldOfficer that recorded the inspection" }
      - { name: inspection_round, type: integer, source: computed, description: "1-based round number; contract.inspection_round + 1 at creation" }
      - { name: inspected_on, type: string, source: input, description: "ISO 8601 date of the field walk" }
      - { name: sampled_plants, type: integer, source: input, description: "Number of plants counted in the sample", constraints: "> 0" }
      - { name: off_type_plants, type: integer, source: input, description: "Off-type (varietal impurity) plants counted", constraints: ">= 0" }
      - { name: restricted_weed_plants, type: integer, source: input, description: "Restricted noxious weed plants counted", constraints: ">= 0" }
      - { name: diseased_plants, type: integer, source: input, description: "Plants showing seed-borne disease", constraints: ">= 0" }
      - { name: isolation_verified_m, type: number, source: input, description: "Isolation distance re-measured during the walk, in metres" }
      - { name: off_type_rate_per_10000, type: number, source: computed, description: "off_type_plants / sampled_plants * 10000, round_half_up to 2 dp" }
      - { name: weed_rate_per_10000, type: number, source: computed, description: "restricted_weed_plants / sampled_plants * 10000, round_half_up to 2 dp" }
      - { name: disease_incidence_pct, type: number, source: computed, description: "diseased_plants / sampled_plants * 100, round_half_up to 2 dp" }
      - { name: outcome, type: enum, source: computed, description: "Branch selected by inspection_outcome_determination", constraints: "one of PASSED, ROGUEING_ORDERED, FAILED" }
      - { name: status, type: enum, source: computed, description: "Rogueing follow-up state", default: "RECORDED", constraints: "one of RECORDED, ROGUEING_DECLARED, ROGUEING_VERIFIED, CLOSED" }
      - { name: rogueing_plants_removed, type: integer, source: input, description: "Plants the grower reports having rogued out; null until declaration" }
      - { name: rogueing_declared_on, type: string, source: input, description: "ISO 8601 date the grower completed rogueing; null until declaration" }
      - { name: rogueing_verified_by_user_id, type: string, source: system, description: "X-User-ID of the FieldOfficer that verified rogueing; null until verification" }
      - { name: verified_remaining_off_type_plants, type: integer, source: input, description: "Off-type plants still standing at verification; null until verification" }

  - name: HarvestEquipment
    parent: null
    common_fields: true
    fields:
      - { name: equipment_code, type: string, source: input, description: "Asset code of the machine", constraints: "unique" }
      - { name: equipment_kind, type: enum, source: input, description: "Machine class", constraints: "one of COMBINE, TRUCK, AUGER" }
      - { name: cleanout_minutes_required, type: integer, source: input, description: "Documented minutes required for a full varietal cleanout", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "Cleanout posture of the machine", default: "DIRTY", constraints: "one of AVAILABLE, DIRTY, OUT_OF_SERVICE" }
      - { name: last_cleanout_at, type: datetime, source: computed, description: "Instant of the most recent certified cleanout; null when never cleaned" }
      - { name: last_cleanout_variety_id, type: string, source: computed, description: "FK -> Variety.id; variety the machine was most recently cleaned out for; null when never cleaned" }
      - { name: cleanout_certified, type: boolean, source: computed, description: "True only between a cleanout certification and the next harvest event that consumes it", default: false }

  - name: HarvestEvent
    parent: ProductionContract
    common_fields: false
    fields:
      - { name: production_contract_id, type: string, source: input, description: "FK -> ProductionContract.id; contract harvested" }
      - { name: harvest_equipment_id, type: string, source: input, description: "FK -> HarvestEquipment.id; machine that cut the field" }
      - { name: seed_lot_id, type: string, source: computed, description: "FK -> SeedLot.id; lot minted by this harvest event" }
      - { name: window_start, type: datetime, source: input, description: "Start of the machine occupation window (closed bound)" }
      - { name: window_end, type: datetime, source: input, description: "End of the machine occupation window (closed bound)" }
      - { name: gross_weight_kg, type: number, source: input, description: "Gross field weight delivered, kilograms", constraints: "> 0" }
      - { name: moisture_pct, type: number, source: input, description: "Moisture percentage measured at intake", constraints: "0 <= moisture_pct <= 40" }
      - { name: bag_size_kg, type: number, source: input, description: "Nominal bag size the resulting lot will be bagged into, kilograms", default: 25.0, constraints: "> 0" }
      - { name: moisture_dockage_pct, type: number, source: computed, description: "max(0, (moisture_pct - 12.0) * 1.5)" }
      - { name: provisional_clean_kg, type: number, source: computed, description: "PROVISIONAL_HARVEST_BASIS clean mass, 3 dp" }
      - { name: provisional_clean_units, type: number, source: computed, description: "PROVISIONAL_HARVEST_BASIS clean seed units, 2 dp" }

  - name: ConditioningLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Plant line identifier", constraints: "unique" }
      - { name: cleanout_minutes_required, type: integer, source: input, description: "Minutes of cleanout that must separate runs of different varieties on this line", constraints: ">= 0" }
      - { name: capacity_kg_per_hour, type: number, source: input, description: "Rated throughput, kilograms per hour", constraints: "> 0" }
      - { name: status, type: enum, source: input, description: "Line availability", default: "AVAILABLE", constraints: "one of AVAILABLE, OUT_OF_SERVICE" }
      - { name: last_cleanout_variety_id, type: string, source: computed, description: "FK -> Variety.id; variety of the most recently COMPLETED run on this line; null before the first completion" }
      - { name: last_run_end_utc, type: datetime, source: computed, description: "window_end of the most recently COMPLETED run on this line; null before the first completion" }

  - name: SeedLot
    parent: ProductionContract
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: system, description: "Deterministic identity-preserving lot code, L-{season_year}-{4-digit per-contract sequence}" }
      - { name: variety_id, type: string, source: computed, description: "FK -> Variety.id; copied from the originating contract, immutable for lot identity" }
      - { name: production_contract_id, type: string, source: computed, description: "FK -> ProductionContract.id; originating contract" }
      - { name: parent_seed_lot_id, type: string, source: computed, description: "FK -> SeedLot.id; predecessor lot when this lot is a carryover successor; null for harvest-minted lots" }
      - { name: season_year, type: integer, source: computed, description: "Season the lot is offered for sale in" }
      - { name: carryover_generation, type: integer, source: computed, description: "0 for harvest-minted lots; parent.carryover_generation + 1 for successors", default: 0 }
      - { name: gross_kg, type: number, source: computed, description: "Mass entering conditioning; harvest gross_weight_kg, or the parent's current_kg for a carryover successor" }
      - { name: current_kg, type: number, source: computed, description: "Mass presently held by the lot; mutated by every COMPLETED or REVERSED conditioning run" }
      - { name: cumulative_shrink_kg, type: number, source: computed, description: "Sum of (input_kg - output_kg) over COMPLETED runs on this lot", default: 0 }
      - { name: dockage_pct, type: number, source: computed, description: "cumulative_shrink_kg / gross_kg * 100, round_half_up to 2 dp" }
      - { name: bag_size_kg, type: number, source: computed, description: "Nominal bag size inherited from the harvest event or the parent lot" }
      - { name: bag_count, type: integer, source: computed, description: "floor(current_kg / bag_size_kg) after the BAGGING run completes; 0 before", default: 0 }
      - { name: tagged_bag_count, type: integer, source: computed, description: "Sum of CertificationTag.bag_count over ISSUED tags on this lot", default: 0 }
      - { name: intake_moisture_pct, type: number, source: computed, description: "Moisture at intake, inherited from the harvest event or the parent lot; drives the price moisture dockage" }
      - { name: provisional_clean_units, type: number, source: computed, description: "PROVISIONAL_HARVEST_BASIS units inherited from the harvest event" }
      - { name: final_clean_units, type: number, source: computed, description: "FINAL_BAGGED_BASIS units; null until the BAGGING run completes" }
      - { name: conditioning_status, type: enum, source: computed, description: "Conditioning axis of the lot", default: "RAW", constraints: "one of RAW, CLEANED, SIZED, TREATED, BAGGED" }
      - { name: certification_status, type: enum, source: computed, description: "Certification axis of the lot, independent of conditioning_status", default: "UNSAMPLED", constraints: "one of UNSAMPLED, SAMPLED, PASSED, FAILED, TAGGED, RETEST_DUE" }
      - { name: germination_pct, type: number, source: computed, description: "Germination from the most recent resulted LotSample; null until the first result" }
      - { name: purity_pct, type: number, source: computed, description: "Pure-seed percentage from the most recent resulted LotSample; null until the first result" }
      - { name: weed_seed_count_per_kg, type: integer, source: computed, description: "Weed seeds per kilogram from the most recent resulted LotSample; null until the first result" }
      - { name: germination_valid_until, type: datetime, source: computed, description: "tested_at + Variety.germ_validity_days of the most recent PASS sample; null until a PASS" }
      - { name: adjusted_price_per_unit_cents, type: integer, source: computed, description: "Quality-adjusted price per clean seed unit; null until a PASS result" }
      - { name: disposition, type: enum, source: computed, description: "Commercial disposition after a failing test", default: "NONE", constraints: "one of NONE, DOWNGRADE_TO_COMMERCIAL" }

  - name: ConditioningRun
    parent: SeedLot
    common_fields: true
    fields:
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; lot being conditioned" }
      - { name: conditioning_line_id, type: string, source: input, description: "FK -> ConditioningLine.id; line occupied by the run" }
      - { name: stage, type: enum, source: input, description: "Conditioning stage performed", constraints: "one of CLEANING, SIZING, TREATING, BAGGING" }
      - { name: window_start, type: datetime, source: input, description: "Start of the line occupation window (inclusive bound)" }
      - { name: window_end, type: datetime, source: input, description: "End of the line occupation window (exclusive bound)" }
      - { name: input_kg, type: number, source: input, description: "Mass fed into the run; must equal the lot's current_kg at creation", constraints: "> 0" }
      - { name: output_kg, type: number, source: input, description: "Mass leaving the run; supplied at completion, null while PLANNED" }
      - { name: shrink_kg, type: number, source: computed, description: "input_kg - output_kg; null while PLANNED" }
      - { name: bag_count, type: integer, source: computed, description: "floor(output_kg / SeedLot.bag_size_kg) for a COMPLETED BAGGING run; null otherwise" }
      - { name: status, type: enum, source: computed, description: "Run state", default: "PLANNED", constraints: "one of PLANNED, COMPLETED, ABORTED, REVERSED" }
      - { name: treatment_product_id, type: string, source: input, description: "FK -> TreatmentProduct.id; required on TREATING, forbidden otherwise" }
      - { name: treatment_rate_g_per_100kg, type: number, source: input, description: "Applied rate in grams per 100 kg; required on TREATING, forbidden otherwise" }
      - { name: label_text, type: string, source: input, description: "Treated-seed label text printed on the bag tag; required on TREATING, forbidden otherwise" }
      - { name: cleanout_buffer_applied_minutes, type: integer, source: computed, description: "Buffer minutes the line-overlap rule demanded at creation: 0 when the line's last_cleanout_variety_id equals this lot's variety_id, else ConditioningLine.cleanout_minutes_required" }
      - { name: reversal_reason, type: string, source: input, description: "Reason recorded on abort or reversal; null otherwise" }

  - name: LotSample
    parent: SeedLot
    common_fields: true
    fields:
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; lot sampled by the certification agency" }
      - { name: sample_kind, type: enum, source: input, description: "Whether this is the first test or a carryover retest", constraints: "one of INITIAL, RETEST" }
      - { name: sampled_on, type: string, source: input, description: "ISO 8601 date the agency drew the sample" }
      - { name: sampler_user_id, type: string, source: system, description: "X-User-ID of the CertificationAgency operator that drew the sample" }
      - { name: germination_pct, type: number, source: input, description: "Germination percentage; null until results are posted", constraints: "0 <= germination_pct <= 100" }
      - { name: purity_pct, type: number, source: input, description: "Pure-seed percentage; null until results are posted", constraints: "0 <= purity_pct <= 100" }
      - { name: inert_pct, type: number, source: input, description: "Inert matter percentage; null until results are posted", constraints: "0 <= inert_pct <= 100" }
      - { name: weed_seed_count_per_kg, type: integer, source: input, description: "Weed seeds per kilogram; null until results are posted", constraints: ">= 0" }
      - { name: tested_at, type: datetime, source: input, description: "Instant the laboratory finished the test; null until results are posted" }
      - { name: result, type: enum, source: computed, description: "Test verdict", default: "PENDING", constraints: "one of PENDING, PASS, FAIL" }
      - { name: germination_valid_until, type: datetime, source: computed, description: "tested_at + Variety.germ_validity_days on a PASS; null otherwise" }

  - name: CertificationTag
    parent: SeedLot
    common_fields: true
    fields:
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; lot the tags belong to" }
      - { name: lot_sample_id, type: string, source: input, description: "FK -> LotSample.id; PASS sample the tag certifies" }
      - { name: tag_serial, type: string, source: system, description: "Deterministic serial TAG-{season_year}-{6-digit issuance sequence}" }
      - { name: tag_class, type: enum, source: input, description: "Class printed on the tag", constraints: "one of FOUNDATION, REGISTERED, CERTIFIED; must not exceed Variety.max_seed_class" }
      - { name: bag_count, type: integer, source: input, description: "Number of bags this tag block covers", constraints: "> 0" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }
      - { name: status, type: enum, source: computed, description: "Tag validity", default: "ISSUED", constraints: "one of ISSUED, VOIDED" }
      - { name: void_reason, type: string, source: input, description: "Reason recorded on void; null while ISSUED" }

  - name: GrowerSettlement
    parent: ProductionContract
    common_fields: true
    fields:
      - { name: production_contract_id, type: string, source: input, description: "FK -> ProductionContract.id; contract being settled" }
      - { name: computed_by_user_id, type: string, source: system, description: "X-User-ID of the SettlementAccountant that computed the settlement" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the SettlementAccountant that approved it; null until approval" }
      - { name: line_count, type: integer, source: computed, description: "Number of TAGGED lots folded into the settlement" }
      - { name: settled_units_total, type: number, source: computed, description: "Sum of SeedLot.final_clean_units over the settled lines, 2 dp" }
      - { name: gross_payable_cents, type: integer, source: computed, description: "Sum of per-line rounded gross amounts" }
      - { name: conditioning_charges_cents, type: integer, source: computed, description: "Sum of per-line rounded conditioning charges" }
      - { name: provisional_net_cents, type: integer, source: computed, description: "gross_payable_cents - conditioning_charges_cents" }
      - { name: recovery_cap_pct, type: number, source: computed, description: "Advance recovery cap percentage selected from the tier keyed on provisional_net_cents" }
      - { name: advance_recovery_cents, type: integer, source: computed, description: "min(contract.advance_outstanding_cents, round_half_up(provisional_net_cents * recovery_cap_pct / 100))" }
      - { name: net_payable_cents, type: integer, source: computed, description: "provisional_net_cents - advance_recovery_cents" }
      - { name: status, type: enum, source: computed, description: "Settlement lifecycle state", default: "COMPUTED", constraints: "one of COMPUTED, APPROVED, PAID, DISPUTED, SUPERSEDED" }
      - { name: dispute_reason, type: string, source: input, description: "Grower's stated reason for dispute; null otherwise" }
      - { name: payment_reference, type: string, source: input, description: "Bank reference recorded at payment; null until PAID" }
      - { name: quality_hold, type: boolean, source: computed, description: "Set when a retest cascade invalidated the certified units this settlement was computed from", default: false }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProductionContract
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /seed-ops/production-contracts/{production_contract_id}/offer"
        actor: ProgramAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "Grower.status IN {GOOD_STANDING, WATCH} (SUSPENDED rejected with ERR_GROWER_SUSPENDED)"
          - "ProductionField.isolation_distance_m >= Variety.isolation_min_m"
          - "field_eligibility_assessment under the variant selected by contract.seed_class returns ELIGIBLE"
          - "no other ProductionContract with the same production_field_id and season_year exists in status IN {OFFERED, PLANTED, ROGUEING_REQUIRED, INSPECTION_PASSED, HARVESTED, SETTLED, CLOSED}"
        side_effects:
          - "sets contract.eligibility_variant_applied to STRICT_HISTORY when seed_class IN {FOUNDATION, REGISTERED, CERTIFIED}, else DECAY_WEIGHTED"
          - "sets contract.eligibility_risk_score to the contamination_risk_score produced by field_eligibility_assessment"
          - "sets ProductionField.last_assessed_risk_score to the same score and increments ProductionField.version by 1"
          - "increments ProductionContract.version by 1"
      - from: OFFERED
        to: PLANTED
        trigger: "POST /seed-ops/production-contracts/{production_contract_id}/sign"
        actor: Grower
        preconditions:
          - "contract.status == OFFERED"
          - "X-User-ID == contract.grower_id"
          - "planted_on <= current logical clock date"
        side_effects:
          - "stores contract.planted_on"
          - "increments ProductionContract.version by 1"
      - from: PLANTED
        to: INSPECTION_PASSED
        trigger: "POST /seed-ops/field-inspections (system transition when inspection_outcome_determination yields PASSED)"
        actor: system
        preconditions:
          - "contract.status == PLANTED"
          - "inspection.outcome == PASSED"
        side_effects:
          - "increments contract.inspection_round by 1"
          - "increments ProductionContract.version by 1"
      - from: PLANTED
        to: ROGUEING_REQUIRED
        trigger: "POST /seed-ops/field-inspections (system transition when inspection_outcome_determination yields ROGUEING_ORDERED)"
        actor: system
        preconditions:
          - "contract.status == PLANTED"
          - "inspection.outcome == ROGUEING_ORDERED"
        side_effects:
          - "increments contract.inspection_round by 1 and contract.rogueing_rounds_used by 1"
          - "CASCADE HOP 2 -> 3: because the contract entered ROGUEING_REQUIRED, Grower.compliance_flag_count increments by 1 and Grower.version increments by 1"
          - "CASCADE HOP 3 -> 4: because Grower.compliance_flag_count reached >= 2, Grower.status moves GOOD_STANDING -> WATCH (and >= 4 moves it to SUSPENDED)"
          - "CASCADE HOP 4 -> 5: because Grower.status became WATCH or SUSPENDED, every other ProductionContract of that grower whose status IN {DRAFT, OFFERED} gets requires_field_officer_review = true and its version incremented by 1, ordered by created_at ASC"
          - "increments ProductionContract.version by 1"
      - from: PLANTED
        to: REJECTED
        trigger: "POST /seed-ops/field-inspections (system transition when inspection_outcome_determination yields FAILED)"
        actor: system
        preconditions:
          - "contract.status == PLANTED"
          - "inspection.outcome == FAILED"
        side_effects:
          - "increments contract.inspection_round by 1"
          - "Grower.compliance_flag_count increments by 1, then the same standing cascade described on PLANTED -> ROGUEING_REQUIRED runs"
          - "increments ProductionContract.version by 1"
        note: "REJECTED is terminal; no harvest event may be recorded against the contract."
      - from: ROGUEING_REQUIRED
        to: PLANTED
        trigger: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
        actor: FieldOfficer
        preconditions:
          - "contract.status == ROGUEING_REQUIRED"
          - "inspection.status == ROGUEING_DECLARED"
          - "X-User-ID != inspection.inspector_user_id (segregation of duties)"
          - "verified_remaining_off_type_plants / inspection.sampled_plants * 10000 <= Variety.max_off_type_per_10000"
        side_effects:
          - "inspection.status -> ROGUEING_VERIFIED and inspection.rogueing_verified_by_user_id = X-User-ID"
          - "returns the contract to PLANTED so the next inspection round may be recorded"
          - "increments ProductionContract.version by 1"
        note: "This edge closes the PLANTED -> ROGUEING_REQUIRED -> PLANTED cycle."
      - from: ROGUEING_REQUIRED
        to: REJECTED
        trigger: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification (system branch)"
        actor: system
        preconditions:
          - "contract.status == ROGUEING_REQUIRED"
          - "inspection.status == ROGUEING_DECLARED"
          - "verified_remaining_off_type_plants / inspection.sampled_plants * 10000 > Variety.max_off_type_per_10000 OR contract.rogueing_rounds_used > Variety.max_rogueing_rounds"
        side_effects:
          - "inspection.status -> CLOSED"
          - "Grower.compliance_flag_count increments by 1, then the standing cascade runs"
          - "increments ProductionContract.version by 1"
      - from: INSPECTION_PASSED
        to: HARVESTED
        trigger: "POST /seed-ops/harvest-events"
        actor: ConditioningManager
        preconditions:
          - "contract.status == INSPECTION_PASSED"
          - "HarvestEquipment.status == AVAILABLE AND HarvestEquipment.cleanout_certified == true AND HarvestEquipment.last_cleanout_variety_id == contract.variety_id"
          - "window_end <= current logical clock instant"
        side_effects:
          - "mints a SeedLot in conditioning_status RAW and certification_status UNSAMPLED"
          - "adds HarvestEvent.provisional_clean_units to contract.provisional_clean_units_total"
          - "HarvestEquipment.status -> DIRTY and cleanout_certified -> false, version incremented by 1"
          - "increments ProductionContract.version by 1"
        note: "Subsequent harvest events on an already HARVESTED contract are allowed and re-run every side effect except the status change."
      - from: HARVESTED
        to: SETTLED
        trigger: "POST /seed-ops/settlements/{settlement_id}/approve"
        actor: SettlementAccountant
        preconditions:
          - "contract.status == HARVESTED"
          - "settlement.status == COMPUTED AND settlement.quality_hold == false"
          - "X-User-ID != settlement.computed_by_user_id (segregation of duties)"
        side_effects:
          - "decrements contract.advance_outstanding_cents by settlement.advance_recovery_cents"
          - "increments ProductionContract.version by 1"
      - from: SETTLED
        to: HARVESTED
        trigger: "POST /seed-ops/settlements/{settlement_id}/dispute"
        actor: Grower
        preconditions:
          - "contract.status == SETTLED"
          - "settlement.status == APPROVED"
          - "X-User-ID == contract.grower_id"
        side_effects:
          - "COMPENSATION: increments contract.advance_outstanding_cents by settlement.advance_recovery_cents, restoring the advance conservation invariant"
          - "settlement.status -> DISPUTED"
          - "increments ProductionContract.version by 1"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /seed-ops/settlements/{settlement_id}/pay"
        actor: SettlementAccountant
        preconditions:
          - "contract.status == SETTLED"
          - "settlement.status == APPROVED"
        side_effects:
          - "settlement.status -> PAID"
          - "increments ProductionContract.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /seed-ops/production-contracts/{production_contract_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["contract.status IN {DRAFT, OFFERED, PLANTED, ROGUEING_REQUIRED}"]
        side_effects:
          - "stores contract.cancel_reason"
          - "every FieldInspection of the contract whose status IN {RECORDED, ROGUEING_DECLARED} moves to CLOSED, ordered by created_at ASC"
          - "increments ProductionContract.version by 1"
        note: "Same edge exists from OFFERED, PLANTED and ROGUEING_REQUIRED with identical preconditions and side effects."
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /seed-ops/production-contracts/{production_contract_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["contract.status == OFFERED"]
        side_effects: ["stores contract.cancel_reason", "increments ProductionContract.version by 1"]
      - from: PLANTED
        to: CANCELLED
        trigger: "POST /seed-ops/production-contracts/{production_contract_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["contract.status == PLANTED"]
        side_effects:
          - "stores contract.cancel_reason"
          - "every FieldInspection of the contract whose status IN {RECORDED, ROGUEING_DECLARED} moves to CLOSED, ordered by created_at ASC"
          - "increments ProductionContract.version by 1"
      - from: ROGUEING_REQUIRED
        to: CANCELLED
        trigger: "POST /seed-ops/production-contracts/{production_contract_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["contract.status == ROGUEING_REQUIRED"]
        side_effects:
          - "stores contract.cancel_reason"
          - "every FieldInspection of the contract whose status IN {RECORDED, ROGUEING_DECLARED} moves to CLOSED, ordered by created_at ASC"
          - "increments ProductionContract.version by 1"

  - entity: FieldInspection
    initial_state: RECORDED
    terminal_states: [CLOSED]
    transitions:
      - from: RECORDED
        to: RECORDED
        trigger: "POST /seed-ops/field-inspections (creation; branch selected by inspection_outcome_determination)"
        actor: FieldOfficer
        preconditions:
          - "contract.status == PLANTED"
          - "count of FieldInspection rows whose inspector_user_id == X-User-ID and inspected_on == this inspected_on is <= 1 (aggregate day capacity 2)"
          - "inspected_on >= contract.planted_on AND inspected_on <= current logical clock date"
        side_effects:
          - "BRANCH PASSED: contract -> INSPECTION_PASSED; inspection.status stays RECORDED; no grower flag"
          - "BRANCH ROGUEING_ORDERED: contract -> ROGUEING_REQUIRED; grower standing cascade runs; inspection.status stays RECORDED awaiting a declaration"
          - "BRANCH FAILED: contract -> REJECTED; grower standing cascade runs; inspection.status -> CLOSED"
        note: "Fork-join: three outcome branches with disjoint side-effect sets, all reachable from the single creation call."
      - from: RECORDED
        to: ROGUEING_DECLARED
        trigger: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-declaration"
        actor: Grower
        preconditions:
          - "inspection.outcome == ROGUEING_ORDERED"
          - "inspection.status == RECORDED"
          - "X-User-ID == contract.grower_id"
          - "rogueing_declared_on <= current logical clock date"
        side_effects:
          - "stores rogueing_plants_removed and rogueing_declared_on"
          - "increments FieldInspection.version by 1"
      - from: ROGUEING_DECLARED
        to: ROGUEING_VERIFIED
        trigger: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
        actor: FieldOfficer
        preconditions:
          - "inspection.status == ROGUEING_DECLARED"
          - "X-User-ID != inspection.inspector_user_id"
          - "verified_remaining_off_type_plants / inspection.sampled_plants * 10000 <= Variety.max_off_type_per_10000"
        side_effects:
          - "contract ROGUEING_REQUIRED -> PLANTED"
          - "increments FieldInspection.version by 1"
      - from: ROGUEING_DECLARED
        to: CLOSED
        trigger: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification (failing branch)"
        actor: FieldOfficer
        preconditions:
          - "inspection.status == ROGUEING_DECLARED"
          - "X-User-ID != inspection.inspector_user_id"
          - "verified_remaining_off_type_plants / inspection.sampled_plants * 10000 > Variety.max_off_type_per_10000 OR contract.rogueing_rounds_used > Variety.max_rogueing_rounds"
        side_effects:
          - "contract ROGUEING_REQUIRED -> REJECTED and the grower standing cascade runs"
          - "increments FieldInspection.version by 1"

  - entity: SeedLot
    initial_state: "RAW x UNSAMPLED"
    terminal_states: []
    transitions:
      - from: "conditioning_status = RAW"
        to: "conditioning_status = CLEANED"
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete with run.stage == CLEANING"
        actor: ConditioningManager
        preconditions:
          - "lot.conditioning_status == RAW"
          - "run.status == PLANNED AND run.window_end <= current logical clock instant"
        side_effects:
          - "lot.current_kg = run.output_kg; lot.cumulative_shrink_kg += run.shrink_kg; lot.dockage_pct recomputed"
          - "ConditioningLine.last_cleanout_variety_id = lot.variety_id; ConditioningLine.last_run_end_utc = run.window_end; line version incremented by 1"
          - "increments SeedLot.version by 1"
        note: "Axis independence: certification_status is untouched by every conditioning transition."
      - from: "conditioning_status = CLEANED"
        to: "conditioning_status = SIZED"
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete with run.stage == SIZING"
        actor: ConditioningManager
        preconditions: ["lot.conditioning_status == CLEANED", "run.status == PLANNED AND run.window_end <= current logical clock instant"]
        side_effects:
          - "lot.current_kg = run.output_kg; lot.cumulative_shrink_kg += run.shrink_kg; lot.dockage_pct recomputed"
          - "ConditioningLine.last_cleanout_variety_id and last_run_end_utc updated; line version incremented by 1"
          - "increments SeedLot.version by 1"
      - from: "conditioning_status = SIZED"
        to: "conditioning_status = TREATED"
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete with run.stage == TREATING"
        actor: ConditioningManager
        preconditions: ["lot.conditioning_status == SIZED", "run.status == PLANNED AND run.window_end <= current logical clock instant"]
        side_effects:
          - "lot.current_kg = run.output_kg; lot.cumulative_shrink_kg += run.shrink_kg; lot.dockage_pct recomputed"
          - "ConditioningLine.last_cleanout_variety_id and last_run_end_utc updated; line version incremented by 1"
          - "increments SeedLot.version by 1"
      - from: "conditioning_status = SIZED"
        to: "conditioning_status = BAGGED"
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete with run.stage == BAGGING and Variety.treatment_required == false"
        actor: ConditioningManager
        preconditions:
          - "lot.conditioning_status == SIZED"
          - "Variety.treatment_required == false"
          - "run.status == PLANNED AND run.window_end <= current logical clock instant"
        side_effects:
          - "lot.current_kg = run.output_kg; lot.cumulative_shrink_kg += run.shrink_kg; lot.dockage_pct recomputed"
          - "lot.bag_count = floor(run.output_kg / lot.bag_size_kg); run.bag_count set to the same value"
          - "lot.final_clean_units = clean_seed_unit_accounting FINAL_BAGGED_BASIS"
          - "increments SeedLot.version by 1"
      - from: "conditioning_status = TREATED"
        to: "conditioning_status = BAGGED"
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete with run.stage == BAGGING"
        actor: ConditioningManager
        preconditions: ["lot.conditioning_status == TREATED", "run.status == PLANNED AND run.window_end <= current logical clock instant"]
        side_effects:
          - "lot.current_kg = run.output_kg; lot.cumulative_shrink_kg += run.shrink_kg; lot.dockage_pct recomputed"
          - "lot.bag_count = floor(run.output_kg / lot.bag_size_kg); run.bag_count set to the same value"
          - "lot.final_clean_units = clean_seed_unit_accounting FINAL_BAGGED_BASIS"
          - "increments SeedLot.version by 1"
      - from: "conditioning_status = X (any of CLEANED, SIZED, TREATED, BAGGED)"
        to: "conditioning_status = predecessor(X)"
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal on a COMPLETED run"
        actor: ConditioningManager
        preconditions:
          - "run.status == COMPLETED"
          - "run is the latest COMPLETED run on the lot ordered by (window_end DESC, created_at DESC)"
          - "lot.certification_status != TAGGED"
        side_effects:
          - "COMPENSATION: lot.current_kg = run.input_kg; lot.cumulative_shrink_kg -= run.shrink_kg; lot.dockage_pct recomputed, restoring gross_kg == current_kg + cumulative_shrink_kg with zero drift"
          - "when run.stage == BAGGING: lot.bag_count -> 0 and lot.final_clean_units -> null"
          - "run.status -> REVERSED"
          - "increments SeedLot.version by 1"
      - from: "certification_status IN {UNSAMPLED, RETEST_DUE, TAGGED}"
        to: "certification_status = SAMPLED"
        trigger: "POST /seed-ops/lot-samples"
        actor: CertificationAgency
        preconditions:
          - "lot.conditioning_status == BAGGED"
          - "lot.certification_status IN {UNSAMPLED, RETEST_DUE, TAGGED}"
          - "sample_kind == INITIAL requires lot.certification_status == UNSAMPLED; sample_kind == RETEST requires lot.certification_status IN {RETEST_DUE, TAGGED}"
        side_effects: ["increments SeedLot.version by 1"]
        note: "Axis independence: conditioning_status is untouched by every certification transition."
      - from: "certification_status = SAMPLED"
        to: "certification_status = PASSED"
        trigger: "POST /seed-ops/lot-samples/{lot_sample_id}/results (PASS branch)"
        actor: CertificationAgency
        preconditions:
          - "sample.result == PENDING"
          - "germination_pct >= Variety.germination_min_pct AND purity_pct >= Variety.purity_min_pct AND weed_seed_count_per_kg <= 30"
        side_effects:
          - "copies germination_pct, purity_pct, weed_seed_count_per_kg onto the lot"
          - "sets lot.germination_valid_until = tested_at + Variety.germ_validity_days"
          - "sets lot.adjusted_price_per_unit_cents from adjusted_price_per_unit"
          - "increments SeedLot.version by 1"
      - from: "certification_status IN {SAMPLED, TAGGED}"
        to: "certification_status = FAILED"
        trigger: "POST /seed-ops/lot-samples/{lot_sample_id}/results (FAIL branch)"
        actor: CertificationAgency
        preconditions:
          - "sample.result == PENDING"
          - "germination_pct < Variety.germination_min_pct OR purity_pct < Variety.purity_min_pct OR weed_seed_count_per_kg > 30"
        side_effects:
          - "CASCADE HOP 1 -> 2: sample.result = FAIL, therefore lot.certification_status -> FAILED and lot.disposition -> DOWNGRADE_TO_COMMERCIAL and lot.adjusted_price_per_unit_cents -> null"
          - "CASCADE HOP 2 -> 3: because lot.certification_status became FAILED, every CertificationTag on the lot whose status == ISSUED moves to VOIDED (ordered by created_at ASC) and lot.tagged_bag_count -> 0"
          - "CASCADE HOP 3 -> 4: because tagged_bag_count dropped, contract.certified_units_total is recomputed from the remaining TAGGED lots and ProductionContract.version increments by 1"
          - "CASCADE HOP 4 -> 5: because contract.certified_units_total changed, every GrowerSettlement of that contract whose status == COMPUTED gets quality_hold = true and status -> SUPERSEDED, ordered by created_at ASC"
          - "increments SeedLot.version by 1"
      - from: "certification_status = PASSED"
        to: "certification_status = TAGGED"
        trigger: "POST /seed-ops/certification-tags"
        actor: CertificationAgency
        preconditions:
          - "lot.conditioning_status == BAGGED AND lot.certification_status == PASSED"
          - "sample.result == PASS AND sample.seed_lot_id == lot.id"
          - "current logical clock instant <= lot.germination_valid_until"
          - "bag_count <= lot.bag_count - lot.tagged_bag_count"
        side_effects:
          - "lot.tagged_bag_count += tag.bag_count"
          - "contract.certified_units_total += lot.final_clean_units and ProductionContract.version increments by 1"
          - "increments SeedLot.version by 1"
      - from: "certification_status = TAGGED"
        to: "certification_status = PASSED"
        trigger: "POST /seed-ops/certification-tags/{certification_tag_id}/void"
        actor: CertificationAgency
        preconditions: ["tag.status == ISSUED", "lot.certification_status == TAGGED"]
        side_effects:
          - "COMPENSATION: lot.tagged_bag_count -= tag.bag_count, restoring tagged_bag_count == sum of ISSUED tag bag_counts"
          - "when lot.tagged_bag_count reaches 0 the lot returns to PASSED and contract.certified_units_total -= lot.final_clean_units"
          - "increments SeedLot.version by 1"
      - from: "certification_status = TAGGED"
        to: "certification_status = RETEST_DUE"
        trigger: "POST /seed-ops/seed-lots/{seed_lot_id}/carryover (applies to the newly minted successor lot; the parent lot is unchanged)"
        actor: ConditioningManager
        preconditions:
          - "parent lot.certification_status == TAGGED"
          - "current logical clock instant > parent lot.germination_valid_until"
          - "parent lot.carryover_generation + 1 <= Variety.max_carryover_generations"
        side_effects:
          - "mints a successor SeedLot with parent_seed_lot_id set, conditioning_status BAGGED, certification_status RETEST_DUE, gross_kg = parent.current_kg, carryover_generation = parent.carryover_generation + 1"
          - "increments the parent SeedLot.version by 1"

  - entity: ConditioningRun
    initial_state: PLANNED
    terminal_states: [ABORTED, REVERSED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete"
        actor: ConditioningManager
        preconditions:
          - "run.status == PLANNED"
          - "run.window_end <= current logical clock instant"
          - "0 <= output_kg <= run.input_kg"
        side_effects:
          - "sets shrink_kg = input_kg - output_kg and applies the SeedLot conditioning-axis transition for run.stage"
        note: "Branching: PLANNED forks to COMPLETED or ABORTED, and COMPLETED forks onward to REVERSED."
      - from: PLANNED
        to: ABORTED
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
        actor: ConditioningManager
        preconditions: ["run.status == PLANNED"]
        side_effects:
          - "stores reversal_reason; releases the line window so a later run may occupy it; the lot's mass fields are untouched"
      - from: COMPLETED
        to: REVERSED
        trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
        actor: ConditioningManager
        preconditions:
          - "run.status == COMPLETED"
          - "run is the latest COMPLETED run on the lot ordered by (window_end DESC, created_at DESC)"
          - "lot.certification_status != TAGGED"
        side_effects:
          - "stores reversal_reason and applies the SeedLot mass compensation described in the SeedLot machine"

  - entity: GrowerSettlement
    initial_state: COMPUTED
    terminal_states: [PAID, SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /seed-ops/settlements/{settlement_id}/approve"
        actor: SettlementAccountant
        preconditions:
          - "settlement.status == COMPUTED AND settlement.quality_hold == false"
          - "X-User-ID != settlement.computed_by_user_id"
          - "contract.status == HARVESTED"
        side_effects:
          - "sets approved_by_user_id; contract HARVESTED -> SETTLED; contract.advance_outstanding_cents -= advance_recovery_cents"
      - from: APPROVED
        to: PAID
        trigger: "POST /seed-ops/settlements/{settlement_id}/pay"
        actor: SettlementAccountant
        preconditions: ["settlement.status == APPROVED"]
        side_effects: ["stores payment_reference; contract SETTLED -> CLOSED"]
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /seed-ops/settlements/{settlement_id}/dispute"
        actor: Grower
        preconditions: ["settlement.status == APPROVED", "X-User-ID == contract.grower_id"]
        side_effects:
          - "COMPENSATION: contract.advance_outstanding_cents += advance_recovery_cents; contract SETTLED -> HARVESTED"
      - from: COMPUTED
        to: DISPUTED
        trigger: "POST /seed-ops/settlements/{settlement_id}/dispute"
        actor: Grower
        preconditions: ["settlement.status == COMPUTED", "X-User-ID == contract.grower_id"]
        side_effects: ["stores dispute_reason; no advance movement because none was applied"]
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "POST /seed-ops/settlements (a newer settlement for the same contract supersedes this one)"
        actor: SettlementAccountant
        preconditions: ["settlement.status IN {COMPUTED, DISPUTED}"]
        side_effects: ["no monetary movement; the superseding settlement carries the recomputed figures"]
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "POST /seed-ops/settlements (a newer settlement for the same contract supersedes this one)"
        actor: SettlementAccountant
        preconditions: ["settlement.status == DISPUTED"]
        side_effects: ["no monetary movement"]
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "POST /seed-ops/lot-samples/{lot_sample_id}/results (FAIL branch, cascade hop 5)"
        actor: system
        preconditions: ["settlement.status == COMPUTED", "the FAIL cascade changed contract.certified_units_total"]
        side_effects: ["sets quality_hold = true before moving to SUPERSEDED"]

  - entity: CertificationTag
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /seed-ops/certification-tags/{certification_tag_id}/void"
        actor: CertificationAgency
        preconditions: ["tag.status == ISSUED"]
        side_effects: ["stores void_reason and applies the SeedLot tagged_bag_count compensation"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /seed-ops/lot-samples/{lot_sample_id}/results (FAIL branch, cascade hop 3)"
        actor: system
        preconditions: ["tag.status == ISSUED", "the lot's certification_status just became FAILED"]
        side_effects: ["sets void_reason to 'RETEST_FAILURE' and applies the tagged_bag_count compensation"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-contract
    parent_entity: ProductionContract
    write_endpoint: "POST /seed-ops/settlements"
    occ_field: "expected_contract_version"
    description: |
      Computing a GrowerSettlement against a ProductionContract whose version has advanced since the
      accountant last read it is rejected. Creating a settlement legitimately supersedes any earlier
      COMPUTED or DISPUTED settlement for the same contract, so the second create is not blocked by
      any state precondition; the stale-version check is the only thing that keeps an accountant from
      superseding a settlement with figures computed from an out-of-date view of the contract.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: carryover-create-stale-lot
    parent_entity: SeedLot
    write_endpoint: "POST /seed-ops/seed-lots/{seed_lot_id}/carryover"
    occ_field: "expected_seed_lot_version"
    description: |
      Minting a carryover successor for a SeedLot whose version has advanced since the manager last
      read it is rejected. A parent lot may legitimately carry several successors across seasons, so
      a repeated carryover call passes every state precondition; the stale-version check is what
      stops a successor from being derived from an out-of-date mass and validity view of the parent.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: clean_seed_unit_accounting
    trigger: "PROVISIONAL_HARVEST_BASIS on POST /seed-ops/harvest-events; FINAL_BAGGED_BASIS on POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete when run.stage == BAGGING"
    algorithm: dual_variant_aggregation
    formula: |
      # shared moisture dockage
      moisture_dockage_pct = max(0, (HarvestEvent.moisture_pct - MOISTURE_BASE_PCT) * MOISTURE_SHRINK_FACTOR)

      # VARIANT A - PROVISIONAL_HARVEST_BASIS (book estimate, written on the HarvestEvent and the lot)
      provisional_clean_kg    = round_half_up(HarvestEvent.gross_weight_kg
                                             * (1 - moisture_dockage_pct / 100)
                                             * (1 - Variety.estimated_conditioning_shrink_pct / 100), 3)
      provisional_clean_units = round_half_up(provisional_clean_kg / UNIT_KG, 2)

      # VARIANT B - FINAL_BAGGED_BASIS (measured, written on the lot when BAGGING completes)
      final_clean_units       = round_half_up(ConditioningRun.output_kg / SeedLot.bag_size_kg
                                             * SeedLot.bag_size_kg / UNIT_KG, 2)
                              = round_half_up(ConditioningRun.output_kg / UNIT_KG, 2)
      bag_count               = floor(ConditioningRun.output_kg / SeedLot.bag_size_kg)
    input_set: |
      Variant A reads exactly one HarvestEvent plus its contract's Variety; it never reads
      ConditioningRun rows. Variant B reads exactly the single COMPLETED ConditioningRun whose
      stage == BAGGING on this lot; it never reads gross_weight_kg, moisture_pct or
      estimated_conditioning_shrink_pct. Neither variant reads ABORTED or REVERSED runs.
    constants:
      UNIT_KG: 25.0
      MOISTURE_BASE_PCT: 12.0
      MOISTURE_SHRINK_FACTOR: 1.5
    precision: "clean mass 3 decimal places round_half_up; units 2 decimal places round_half_up; bag_count truncated toward zero"
    variants:
      - name: PROVISIONAL_HARVEST_BASIS
        when: "At harvest intake, before any conditioning has run; drives contract.provisional_clean_units_total and the grower's harvest receipt"
        difference: "Deducts a book moisture dockage and the Variety's book conditioning shrink from the gross field weight; never sees actual plant performance"
      - name: FINAL_BAGGED_BASIS
        when: "When the BAGGING run completes; drives SeedLot.final_clean_units and therefore every settlement line"
        difference: "Reads the measured bagged mass only; plant performance better or worse than the book shrink makes it diverge from variant A for identical harvest inputs"

  - name: field_eligibility_assessment
    trigger: "POST /seed-ops/production-fields/{production_field_id}/eligibility-assessments, and as the DRAFT -> OFFERED gate on POST /seed-ops/production-contracts/{production_contract_id}/offer"
    algorithm: dual_variant_constraint_propagation
    formula: |
      restricted = [ h in FieldHistoryRecord where h.production_field_id == field.id
                     and h.crop_kind IN Variety.restricted_prior_crop_kinds
                     and h.crop_year > (season_year - Variety.restricted_prior_crop_years) ]
      isolation_shortfall_m = max(0, Variety.isolation_min_m - ProductionField.isolation_distance_m)

      # VARIANT A - STRICT_HISTORY
      strict_history_result = INELIGIBLE if len(restricted) > 0 else
                              (INELIGIBLE if isolation_shortfall_m > 0 else ELIGIBLE)
      strict blocking_error_id = ERR_FIELD_HISTORY_RESTRICTED when len(restricted) > 0,
                                 else ERR_ISOLATION_DISTANCE_INSUFFICIENT when isolation_shortfall_m > 0,
                                 else null   # history is checked BEFORE isolation

      # VARIANT B - DECAY_WEIGHTED
      history_component  = sum over h in restricted of
                             round_half_up(HISTORY_BASE_RISK * (DECAY_FACTOR ** (season_year - h.crop_year)), 2)
      isolation_component = round_half_up(isolation_shortfall_m * ISOLATION_RISK_PER_M, 2)
      contamination_risk_score = round_half_up(history_component + isolation_component, 2)
      decay_weighted_result = ELIGIBLE if contamination_risk_score <= DECAY_ELIGIBILITY_MAX_SCORE else INELIGIBLE
      decay blocking_error_id = ERR_FIELD_HISTORY_RESTRICTED when history_component > isolation_component,
                                 else ERR_ISOLATION_DISTANCE_INSUFFICIENT   # only when INELIGIBLE

      applied_variant = STRICT_HISTORY  if seed_class IN {FOUNDATION, REGISTERED, CERTIFIED}
                        DECAY_WEIGHTED  if seed_class == COMMERCIAL_INCREASE
    input_set: |
      Both variants read every FieldHistoryRecord of the field with no status filter (the entity is
      immutable and has no status). The look-back predicate is strictly `crop_year > season_year -
      restricted_prior_crop_years`, so with a 3-year window and season 2026 a 2023 crop is outside
      and a 2024 crop is inside. Records whose crop_kind is not in the variety's restricted list are
      excluded from both variants.
    constants:
      HISTORY_BASE_RISK: 100.0
      DECAY_FACTOR: 0.5
      ISOLATION_RISK_PER_M: 0.5
      DECAY_ELIGIBILITY_MAX_SCORE: 25.0
    precision: "risk components and score 2 decimal places round_half_up"
    variants:
      - name: STRICT_HISTORY
        when: "seed_class IN {FOUNDATION, REGISTERED, CERTIFIED}"
        difference: "Any single restricted record inside the look-back window disqualifies the field regardless of how long ago it was"
      - name: DECAY_WEIGHTED
        when: "seed_class == COMMERCIAL_INCREASE"
        difference: "Halves the risk contribution of a restricted record for each elapsed year and admits the field while the total score stays at or below 25.00, so the same field/variety/season data can be ELIGIBLE here and INELIGIBLE under STRICT_HISTORY"

  - name: inspection_outcome_determination
    trigger: "POST /seed-ops/field-inspections"
    algorithm: threshold
    formula: |
      off_type_rate_per_10000 = round_half_up(off_type_plants / sampled_plants * 10000, 2)
      weed_rate_per_10000     = round_half_up(restricted_weed_plants / sampled_plants * 10000, 2)
      disease_incidence_pct   = round_half_up(diseased_plants / sampled_plants * 100, 2)

      purity_breach = off_type_rate_per_10000 > Variety.max_off_type_per_10000
      weed_breach   = weed_rate_per_10000     > Variety.max_restricted_weed_per_10000
      # strictly greater-than: a rate exactly equal to the tolerance PASSES

      if purity_breach or weed_breach:
          worst_ratio = max(off_type_rate_per_10000 / Variety.max_off_type_per_10000,
                            weed_rate_per_10000     / Variety.max_restricted_weed_per_10000)
          if worst_ratio <= ROGUEABLE_MULTIPLE and contract.rogueing_rounds_used < Variety.max_rogueing_rounds:
              outcome = ROGUEING_ORDERED
          else:
              outcome = FAILED
      elif disease_incidence_pct > Variety.max_disease_incidence_pct:
          outcome = FAILED
      elif isolation_verified_m < Variety.isolation_min_m:
          outcome = FAILED
      else:
          outcome = PASSED
    input_set: "Exactly the counts on the FieldInspection row being created plus the contract's Variety tolerances and the contract's rogueing_rounds_used at request time; earlier inspections of the same contract are not re-read."
    constants:
      ROGUEABLE_MULTIPLE: 3.0
    precision: "rates 2 decimal places round_half_up; the tolerance comparison is strict >"

  - name: adjusted_price_per_unit
    trigger: "POST /seed-ops/lot-samples/{lot_sample_id}/results on the PASS branch"
    algorithm: tiered_pricing
    formula: |
      germ_adj_pct = +6.0 if germination_pct >= 95.0
                     +2.0 if germination_pct >= 90.0
                      0.0 if germination_pct >= Variety.germination_min_pct
      purity_adj_pct = +2.0 if purity_pct >= 99.5
                        0.0 if purity_pct >= 98.0
                       -4.0 if purity_pct >= Variety.purity_min_pct
      weed_penalty_pct =  0.0 if weed_seed_count_per_kg == 0
                         -3.0 if weed_seed_count_per_kg <= 10
                         -9.0 if weed_seed_count_per_kg <= 30
      moisture_dockage_pct = max(0, (SeedLot.intake_moisture_pct - MOISTURE_BASE_PCT) * MOISTURE_SHRINK_FACTOR)

      raw_adj_pct     = germ_adj_pct + purity_adj_pct + weed_penalty_pct - moisture_dockage_pct
      clamped_adj_pct = min(ADJ_CAP_PCT, max(ADJ_FLOOR_PCT, raw_adj_pct))
      adjusted_price_per_unit_cents = round_half_up(
            ProductionContract.base_price_per_unit_cents * (1 + clamped_adj_pct / 100), 0)
    input_set: |
      Reads the four quality inputs of the single sample being resulted, the lot's
      intake_moisture_pct (inherited from the originating harvest event and never re-derived from a
      later sample), and base_price_per_unit_cents from the lot's originating contract. Tier
      boundaries are inclusive lower bounds (>=). Cases below Variety.germination_min_pct,
      below Variety.purity_min_pct or above 30 weed seeds/kg never reach this calculation because
      the sample takes the FAIL branch instead.
    constants:
      MOISTURE_BASE_PCT: 12.0
      MOISTURE_SHRINK_FACTOR: 1.5
      ADJ_CAP_PCT: 8.0
      ADJ_FLOOR_PCT: -35.0
    precision: "percentages exact to 2 decimal places; final price round_half_up to whole cents"

  - name: settlement_line_rollup
    trigger: "POST /seed-ops/settlements"
    algorithm: aggregation
    formula: |
      lines = SeedLot rows where production_contract_id == contract.id
                              and certification_status == TAGGED
                              and final_clean_units is not null,
              ordered by created_at ASC, tie-break lot_code ASC

      # ROUNDING ORDER IS PINNED: round each line to whole cents FIRST, then sum the rounded lines.
      # Summing the exact products and rounding once at the end is WRONG and can differ by cents.
      for each line L:
          line_gross_cents  = round_half_up(L.final_clean_units * L.adjusted_price_per_unit_cents, 0)
          line_charge_cents = round_half_up(L.final_clean_units * contract.conditioning_charge_per_unit_cents, 0)

      line_count               = count(lines)
      settled_units_total      = round_half_up(sum(L.final_clean_units), 2)
      gross_payable_cents      = sum(line_gross_cents)        # sum of already-rounded line values
      conditioning_charges_cents = sum(line_charge_cents)     # sum of already-rounded line values
    input_set: "Only TAGGED lots of the contract with a non-null final_clean_units. Lots in UNSAMPLED, SAMPLED, PASSED, FAILED or RETEST_DUE are excluded, as are lots whose tags were all voided (they are back in PASSED). An empty line set is rejected with ERR_NO_SETTLEABLE_LOTS rather than settled at zero."
    constants: {}
    precision: "per-line amounts round_half_up to whole cents BEFORE summation; settled_units_total 2 decimal places"

  - name: settlement_net_payable
    trigger: "POST /seed-ops/settlements, immediately after settlement_line_rollup"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED because recovery_cap_pct is keyed on the very total that the
      # recovery then reduces. Steps run exactly once, in this order; no fixed-point iteration.
      # step 1  provisional_net_cents = gross_payable_cents - conditioning_charges_cents
      # step 2  recovery_cap_pct is selected from the tier table using provisional_net_cents
      #         (NOT net_payable_cents, NOT gross_payable_cents)
      # step 3  advance_recovery_cents = min(contract.advance_outstanding_cents,
      #                                     round_half_up(provisional_net_cents * recovery_cap_pct / 100, 0))
      # step 4  net_payable_cents = provisional_net_cents - advance_recovery_cents
      #
      # tier table on provisional_net_cents:
      #   >= 5000000 -> 100.0
      #   >= 2000000 ->  60.0
      #   >=  500000 ->  35.0
      #   otherwise  ->  15.0
      # tier bounds are inclusive lower bounds (>=)
      # provisional_net_cents < 0 is rejected with ERR_NET_PAYABLE_NEGATIVE
    input_set: "One settlement's own rolled-up line totals plus contract.advance_outstanding_cents read at request time (already net of any earlier APPROVED or PAID settlement's recovery)."
    constants:
      TIER_1_MIN_CENTS: 5000000
      TIER_1_CAP_PCT: 100.0
      TIER_2_MIN_CENTS: 2000000
      TIER_2_CAP_PCT: 60.0
      TIER_3_MIN_CENTS: 500000
      TIER_3_CAP_PCT: 35.0
      TIER_4_CAP_PCT: 15.0
    precision: "all cent values integers; the capped recovery is round_half_up to whole cents before the min()"

  - name: lot_mass_reconciliation
    trigger: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete and POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
    algorithm: constraint_propagation
    formula: |
      on COMPLETED: SeedLot.current_kg          = ConditioningRun.output_kg
                    SeedLot.cumulative_shrink_kg = SeedLot.cumulative_shrink_kg + (input_kg - output_kg)
      on REVERSED:  SeedLot.current_kg          = ConditioningRun.input_kg
                    SeedLot.cumulative_shrink_kg = SeedLot.cumulative_shrink_kg - (input_kg - output_kg)
      SeedLot.dockage_pct = round_half_up(SeedLot.cumulative_shrink_kg / SeedLot.gross_kg * 100, 2)

      CONSERVED QUANTITY (must hold after every one of these mutations):
        SeedLot.gross_kg == SeedLot.current_kg + SeedLot.cumulative_shrink_kg
    input_set: "COMPLETED runs of the lot only; PLANNED, ABORTED and REVERSED runs contribute nothing to cumulative_shrink_kg."
    constants: {}
    precision: "masses 2 decimal places exact (no rounding is applied to current_kg or cumulative_shrink_kg); dockage_pct round_half_up to 2 dp"

  - name: advance_recovery_conservation
    trigger: "POST /seed-ops/settlements/{settlement_id}/approve and POST /seed-ops/settlements/{settlement_id}/dispute"
    algorithm: aggregation
    formula: |
      on APPROVE:  contract.advance_outstanding_cents -= settlement.advance_recovery_cents
      on DISPUTE from APPROVED: contract.advance_outstanding_cents += settlement.advance_recovery_cents

      CONSERVED QUANTITY (must hold after either mutation):
        contract.advance_outstanding_cents
        + sum(settlement.advance_recovery_cents for settlements of the contract
              whose status IN {APPROVED, PAID}, ordered by created_at ASC)
        == contract.advance_total_cents
    input_set: "Settlements of the one contract whose status IN {APPROVED, PAID}; COMPUTED, DISPUTED and SUPERSEDED settlements contribute zero."
    constants: {}
    precision: "integer cents; no rounding"

  - name: tag_bag_accounting
    trigger: "POST /seed-ops/certification-tags, POST /seed-ops/certification-tags/{certification_tag_id}/void, and the FAIL-branch cascade on POST /seed-ops/lot-samples/{lot_sample_id}/results"
    algorithm: aggregation
    formula: |
      SeedLot.tagged_bag_count = sum(tag.bag_count for CertificationTag rows
                                     where seed_lot_id == lot.id and status == ISSUED,
                                     ordered by created_at ASC)
      untagged_bags            = SeedLot.bag_count - SeedLot.tagged_bag_count   # must stay >= 0

      CONSERVED QUANTITY (must hold after issuance, void, and cascade void):
        SeedLot.tagged_bag_count == sum of bag_count over ISSUED tags of the lot
    input_set: "ISSUED tags of the one lot; VOIDED tags contribute zero."
    constants: {}
    precision: "integer bag counts"

  - name: grower_standing_rollup
    trigger: "Every system transition that moves a ProductionContract into ROGUEING_REQUIRED or REJECTED"
    algorithm: threshold
    formula: |
      Grower.compliance_flag_count += 1
      Grower.status = SUSPENDED    if Grower.compliance_flag_count >= SUSPEND_AT_FLAGS
                      WATCH        if Grower.compliance_flag_count >= WATCH_AT_FLAGS
                      GOOD_STANDING otherwise
    input_set: "The single grower's own counter; contract rows are not re-scanned. The counter is monotonically increasing and is never decremented, so a rogueing round that is later verified does not clear the flag."
    constants:
      WATCH_AT_FLAGS: 2
      SUSPEND_AT_FLAGS: 4
    precision: "integer counter; both thresholds are inclusive (>=)"

  - name: carryover_retest_window
    trigger: "POST /seed-ops/seed-lots/{seed_lot_id}/carryover, and as a gate on POST /seed-ops/certification-tags"
    algorithm: decay_function
    formula: |
      SeedLot.germination_valid_until = LotSample.tested_at + Variety.germ_validity_days (whole days)

      tag issuance gate:   current_utc <= lot.germination_valid_until, else ERR_GERMINATION_VALIDITY_EXPIRED
      carryover gate:      current_utc >  lot.germination_valid_until, else ERR_RETEST_NOT_DUE
      # the two gates are exact complements at the boundary instant: at current_utc ==
      # germination_valid_until tagging is still allowed and carryover is not yet due
      successor.carryover_generation = parent.carryover_generation + 1
      reject with ERR_CARRYOVER_LIMIT_EXCEEDED when successor.carryover_generation > Variety.max_carryover_generations
    input_set: "The most recent LotSample of the lot whose result == PASS supplies tested_at; PENDING and FAIL samples never move germination_valid_until."
    constants: {}
    precision: "day arithmetic is exact calendar days on the UTC instant; comparisons are on the full ISO 8601 instant"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest priority number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request shape: every required input field present, JSON types correct, enum members valid, single-field numeric ranges honoured, pagination limit in 1..100 and offset >= 0. Cross-field arithmetic checks (component percentage sums, mass equality, bag totals) are NOT part of this rule and fire later at their own priorities."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every path-templated resource exists, validated left-to-right"
    error_id: "ERR_VARIETY_NOT_FOUND | ERR_TREATMENT_PRODUCT_NOT_FOUND | ERR_GROWER_NOT_FOUND | ERR_PRODUCTION_FIELD_NOT_FOUND | ERR_FIELD_HISTORY_RECORD_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_HARVEST_EVENT_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_SEED_LOT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_TAG_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: "ERR_GROWER_NOT_FOUND | ERR_VARIETY_NOT_FOUND | ERR_PRODUCTION_FIELD_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_SEED_LOT_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_TREATMENT_PRODUCT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /seed-ops/production-fields, POST /seed-ops/production-contracts, POST /seed-ops/field-inspections, POST /seed-ops/harvest-equipment/{harvest_equipment_id}/cleanout-certification, POST /seed-ops/harvest-events, POST /seed-ops/conditioning-runs, POST /seed-ops/lot-samples, POST /seed-ops/certification-tags, POST /seed-ops/settlements, POST /seed-ops/production-fields/{production_field_id}/eligibility-assessments"
  - priority: 6
    category: auth
    check: "For Grower-actor endpoints, X-User-ID equals the grower_id of the contract that owns the target resource"
    error_id: ERR_GROWER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/sign, POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-declaration, POST /seed-ops/settlements/{settlement_id}/dispute"
  - priority: 7
    category: state
    check: "The ProductionContract is in a status from which this operation is declared in 1.2"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/offer, .../sign, .../cancel, POST /seed-ops/field-inspections, POST /seed-ops/harvest-events, POST /seed-ops/settlements"
  - priority: 8
    category: state
    check: "The FieldInspection is inside the rogueing workflow for the step being attempted: for a declaration, status == RECORDED and outcome == ROGUEING_ORDERED; for a verification, outcome == ROGUEING_ORDERED and status != ROGUEING_VERIFIED. A verification attempted while status == RECORDED (no declaration filed yet) satisfies this rule and is left to priority 26 ERR_ROGUEING_NOT_DECLARED"
    error_id: ERR_INVALID_INSPECTION_STATE
    http_status: 409
    applies_to: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-declaration, POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
  - priority: 9
    category: state
    check: "The ConditioningRun status permits the operation: PLANNED for complete; PLANNED or COMPLETED for reversal"
    error_id: ERR_INVALID_RUN_STATE
    http_status: 409
    applies_to: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete, POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
  - priority: 10
    category: state
    check: "The GrowerSettlement status permits the operation: COMPUTED for approve; APPROVED for pay; COMPUTED or APPROVED for dispute"
    error_id: ERR_INVALID_SETTLEMENT_STATE
    http_status: 409
    applies_to: "POST /seed-ops/settlements/{settlement_id}/approve, .../pay, .../dispute"
  - priority: 11
    category: state
    check: "The LotSample has result == PENDING"
    error_id: ERR_SAMPLE_ALREADY_RESULTED
    http_status: 409
    applies_to: "POST /seed-ops/lot-samples/{lot_sample_id}/results"
  - priority: 12
    category: state
    check: "The CertificationTag has status == ISSUED"
    error_id: ERR_TAG_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /seed-ops/certification-tags/{certification_tag_id}/void"
  - priority: 13
    category: state
    check: "The SeedLot axes permit the operation: sampling requires conditioning_status == BAGGED and (certification_status == UNSAMPLED for sample_kind INITIAL, or certification_status IN {RETEST_DUE, TAGGED} for sample_kind RETEST); carryover requires certification_status == TAGGED; run creation requires the lot not to be in BAGGED already"
    error_id: ERR_INVALID_LOT_STATE
    http_status: 409
    applies_to: "POST /seed-ops/lot-samples, POST /seed-ops/seed-lots/{seed_lot_id}/carryover, POST /seed-ops/conditioning-runs"
  - priority: 14
    category: state
    check: "expected_contract_version equals the current ProductionContract.version (see concurrency_rules.settlement-create-stale-contract)"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /seed-ops/settlements"
  - priority: 15
    category: state
    check: "expected_seed_lot_version equals the current SeedLot.version (see concurrency_rules.carryover-create-stale-lot)"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /seed-ops/seed-lots/{seed_lot_id}/carryover"
  - priority: 16
    category: business_safety
    check: "The verifying FieldOfficer's X-User-ID differs from FieldInspection.inspector_user_id"
    error_id: ERR_SOD_ROGUEING_SELF_VERIFICATION
    http_status: 403
    applies_to: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
  - priority: 17
    category: business_safety
    check: "The approving SettlementAccountant's X-User-ID differs from GrowerSettlement.computed_by_user_id"
    error_id: ERR_SOD_SETTLEMENT_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /seed-ops/settlements/{settlement_id}/approve"
  - priority: 18
    category: business_safety
    check: "treatment_product_id, treatment_rate_g_per_100kg and label_text are all present when stage == TREATING and all absent for every other stage"
    error_id: ERR_TREATMENT_FIELDS_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 19
    category: business_safety
    check: "The lot's Variety.crop_kind appears in TreatmentProduct.allowed_crop_kinds"
    error_id: ERR_TREATMENT_CROP_NOT_LABELED
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 20
    category: business_safety
    check: "treatment_rate_g_per_100kg <= TreatmentProduct.max_rate_g_per_100kg"
    error_id: ERR_TREATMENT_RATE_EXCEEDS_LABEL
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 21
    category: business_safety
    check: "label_text contains TreatmentProduct.epa_registration_number; contains the literal 'DYED' when requires_dye is true; contains TreatmentProduct.label_signal_word when restricted_use is true"
    error_id: ERR_TREATMENT_LABEL_INCOMPLETE
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 22
    category: business_safety
    check: "HarvestEquipment.status == AVAILABLE and cleanout_certified == true and last_cleanout_variety_id == contract.variety_id"
    error_id: ERR_EQUIPMENT_CLEANOUT_REQUIRED
    http_status: 409
    applies_to: "POST /seed-ops/harvest-events"
  - priority: 23
    category: business_safety
    check: "field_eligibility_assessment under the contract's applied variant reports no restricted prior crop"
    error_id: ERR_FIELD_HISTORY_RESTRICTED
    http_status: 422
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/offer"
  - priority: 24
    category: business_safety
    check: "ProductionField.isolation_distance_m >= Variety.isolation_min_m"
    error_id: ERR_ISOLATION_DISTANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/offer"
  - priority: 25
    category: business_safety
    check: "Grower.status != SUSPENDED"
    error_id: ERR_GROWER_SUSPENDED
    http_status: 409
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/offer"
  - priority: 26
    category: business_referential
    check: "The inspection carries a rogueing declaration (status == ROGUEING_DECLARED) before verification is accepted"
    error_id: ERR_ROGUEING_NOT_DECLARED
    http_status: 409
    applies_to: "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
  - priority: 27
    category: business_referential
    check: "LotSample.seed_lot_id equals the seed_lot_id supplied on the tag request and LotSample.result == PASS"
    error_id: ERR_SAMPLE_LOT_MISMATCH
    http_status: 422
    applies_to: "POST /seed-ops/certification-tags"
  - priority: 28
    category: business_referential
    check: "The lot is tag-eligible: conditioning_status == BAGGED and certification_status == PASSED"
    error_id: ERR_LOT_NOT_TAG_ELIGIBLE
    http_status: 409
    applies_to: "POST /seed-ops/certification-tags"
  - priority: 29
    category: business_referential
    check: "settlement_line_rollup produced at least one line (the contract has at least one TAGGED lot with a non-null final_clean_units)"
    error_id: ERR_NO_SETTLEABLE_LOTS
    http_status: 422
    applies_to: "POST /seed-ops/settlements"
  - priority: 30
    category: business_constraint
    check: "stage is the immediate successor of the lot's conditioning_status: RAW->CLEANING, CLEANED->SIZING, SIZED->TREATING (or SIZED->BAGGING only when Variety.treatment_required == false), TREATED->BAGGING"
    error_id: ERR_STAGE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 31
    category: business_constraint
    check: "input_kg equals SeedLot.current_kg at request time, exact to 2 decimal places"
    error_id: ERR_INPUT_MASS_MISMATCH
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 32
    category: business_constraint
    check: "0 <= output_kg <= ConditioningRun.input_kg"
    error_id: ERR_OUTPUT_EXCEEDS_INPUT
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete"
  - priority: 33
    category: business_constraint
    check: "purity_pct + inert_pct + (weed fraction implied by the report) may not exceed 100; concretely purity_pct + inert_pct <= 100"
    error_id: ERR_COMPONENT_PCT_SUM_INVALID
    http_status: 422
    applies_to: "POST /seed-ops/lot-samples/{lot_sample_id}/results"
  - priority: 34
    category: business_constraint
    check: "bag_count <= SeedLot.bag_count - SeedLot.tagged_bag_count"
    error_id: ERR_TAG_BAG_COUNT_EXCEEDS_LOT
    http_status: 422
    applies_to: "POST /seed-ops/certification-tags"
  - priority: 35
    category: business_constraint
    check: "class_rank(tag_class) <= class_rank(Variety.max_seed_class) where class_rank is CERTIFIED=1, REGISTERED=2, FOUNDATION=3"
    error_id: ERR_TAG_CLASS_EXCEEDS_VARIETY
    http_status: 422
    applies_to: "POST /seed-ops/certification-tags"
  - priority: 36
    category: business_constraint
    check: "parent.carryover_generation + 1 <= Variety.max_carryover_generations"
    error_id: ERR_CARRYOVER_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /seed-ops/seed-lots/{seed_lot_id}/carryover"
  - priority: 37
    category: business_constraint
    check: "For a COMPLETED run, the run is the latest COMPLETED run on its lot ordered by (window_end DESC, created_at DESC)"
    error_id: ERR_RUN_NOT_LATEST
    http_status: 409
    applies_to: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
  - priority: 38
    category: business_constraint
    check: "SeedLot.certification_status != TAGGED when reversing a COMPLETED run or planning a new run on the lot"
    error_id: ERR_LOT_TAGGED_IMMUTABLE
    http_status: 409
    applies_to: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal, POST /seed-ops/conditioning-runs"
  - priority: 39
    category: business_constraint
    check: "contracted_acres <= ProductionField.acres"
    error_id: ERR_CONTRACTED_ACRES_EXCEED_FIELD
    http_status: 422
    applies_to: "POST /seed-ops/production-contracts"
  - priority: 40
    category: business_temporal
    check: "window_start < window_end"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /seed-ops/harvest-events, POST /seed-ops/conditioning-runs"
  - priority: 41
    category: business_temporal
    check: "Backward-looking date inputs are at or before the current logical clock instant: planted_on, inspected_on, rogueing_declared_on, cleaned_at, sampled_on, tested_at"
    error_id: ERR_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/sign, POST /seed-ops/field-inspections, POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-declaration, POST /seed-ops/harvest-equipment/{harvest_equipment_id}/cleanout-certification, POST /seed-ops/lot-samples, POST /seed-ops/lot-samples/{lot_sample_id}/results"
  - priority: 42
    category: business_temporal
    check: "CLOSED-INTERVAL SEMANTICS. The requested [window_start, window_end] must not intersect any existing HarvestEvent interval on the same harvest_equipment_id, where both endpoints are inclusive: a conflict exists whenever new.window_start <= other.window_end AND other.window_start <= new.window_end. Two windows that merely touch at an instant DO collide, and no buffer notion applies."
    error_id: ERR_EQUIPMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /seed-ops/harvest-events"
  - priority: 43
    category: business_temporal
    check: "HALF-OPEN INTERVAL SEMANTICS. The requested [window_start, window_end) must not intersect any ConditioningRun interval on the same conditioning_line_id whose status IN {PLANNED, COMPLETED}, where the end bound is exclusive: a conflict exists whenever new.window_start < other.window_end AND other.window_start < new.window_end. Back-to-back windows that touch at an instant do NOT collide."
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 44
    category: business_temporal
    check: "VARIETY-CONDITIONAL BUFFER SEMANTICS. When ConditioningLine.last_cleanout_variety_id is non-null and differs from the requested lot's variety_id, window_start must be at or after ConditioningLine.last_run_end_utc plus ConditioningLine.cleanout_minutes_required minutes. When the line's last variety equals the lot's variety, the required buffer is zero and a zero-gap window is accepted. cleanout_buffer_applied_minutes records the buffer the rule demanded."
    error_id: ERR_LINE_CLEANOUT_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /seed-ops/conditioning-runs"
  - priority: 45
    category: business_temporal
    check: "AGGREGATE DAY-CAPACITY SEMANTICS. At most INSPECTOR_DAILY_CAPACITY = 2 FieldInspection rows may share the same inspector_user_id and the same inspected_on calendar date; the rows may otherwise overlap freely because an inspection occupies a date rather than an instant."
    error_id: ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /seed-ops/field-inspections"
  - priority: 46
    category: business_temporal
    check: "SEASON-GRANULARITY EXCLUSIVITY. No other ProductionContract may already occupy the same production_field_id for the same season_year in status IN {OFFERED, PLANTED, ROGUEING_REQUIRED, INSPECTION_PASSED, HARVESTED, SETTLED, CLOSED}; DRAFT, CANCELLED and REJECTED contracts do not occupy the field."
    error_id: ERR_FIELD_SEASON_ALREADY_CONTRACTED
    http_status: 409
    applies_to: "POST /seed-ops/production-contracts/{production_contract_id}/offer"
  - priority: 47
    category: business_temporal
    check: "window_end <= current logical clock instant (a harvest event records work already performed)"
    error_id: ERR_HARVEST_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /seed-ops/harvest-events"
  - priority: 48
    category: business_temporal
    check: "ConditioningRun.window_end <= current logical clock instant"
    error_id: ERR_RUN_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete"
  - priority: 49
    category: business_temporal
    check: "current logical clock instant <= SeedLot.germination_valid_until"
    error_id: ERR_GERMINATION_VALIDITY_EXPIRED
    http_status: 409
    applies_to: "POST /seed-ops/certification-tags"
  - priority: 50
    category: business_temporal
    check: "current logical clock instant > SeedLot.germination_valid_until (a carryover successor may only be minted once the parent's germination result has lapsed)"
    error_id: ERR_RETEST_NOT_DUE
    http_status: 409
    applies_to: "POST /seed-ops/seed-lots/{seed_lot_id}/carryover"
  - priority: 51
    category: business_fiscal
    check: "settlement_net_payable step 1 produced provisional_net_cents >= 0"
    error_id: ERR_NET_PAYABLE_NEGATIVE
    http_status: 422
    applies_to: "POST /seed-ops/settlements"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- reference data -------------------------------------------------------
  - method: POST
    path: "/seed-ops/varieties"
    description: "Register a seed variety with its certification tolerances, isolation minimum, restricted prior-crop list and book conditioning shrink"
    roles: [ProgramAdmin]
    code: 201
    input: ["crop_kind", "variety_name", "max_seed_class", "isolation_min_m", "restricted_prior_crop_kinds", "restricted_prior_crop_years", "germination_min_pct", "purity_min_pct", "max_off_type_per_10000", "max_restricted_weed_per_10000", "max_disease_incidence_pct", "max_rogueing_rounds?", "estimated_conditioning_shrink_pct", "germ_validity_days", "max_carryover_generations?", "treatment_required?"]
    output: Variety
    side_effects: []
  - method: POST
    path: "/seed-ops/treatment-products"
    description: "Register a seed treatment product with its label constraints (allowed crops, maximum rate, dye and restricted-use flags)"
    roles: [ProgramAdmin]
    code: 201
    input: ["product_code", "epa_registration_number", "allowed_crop_kinds", "max_rate_g_per_100kg", "requires_dye?", "restricted_use?", "label_signal_word"]
    output: TreatmentProduct
    side_effects: []
  - method: POST
    path: "/seed-ops/growers"
    description: "Register a contract grower; standing starts at GOOD_STANDING with zero compliance flags"
    roles: [ProgramAdmin]
    code: 201
    input: [grower_name, region_code, contact_email]
    output: Grower
    side_effects: ["sets status to GOOD_STANDING and compliance_flag_count to 0"]
  - method: POST
    path: "/seed-ops/production-fields"
    description: "Register a production field owned by a grower, with acreage and measured isolation distance"
    roles: [ProgramAdmin, FieldOfficer]
    code: 201
    input: [grower_id, field_code, acres, isolation_distance_m]
    output: ProductionField
    side_effects: []
  - method: POST
    path: "/seed-ops/production-fields/{production_field_id}/history"
    description: "Append an immutable prior-crop history record to a field"
    roles: [ProgramAdmin, FieldOfficer]
    code: 201
    input: ["crop_kind", "crop_year", "source_note?"]
    output: FieldHistoryRecord
    side_effects: ["increments ProductionField.history_record_count by 1"]
  - method: POST
    path: "/seed-ops/production-fields/{production_field_id}/eligibility-assessments"
    description: "Computed read-through: evaluates field_eligibility_assessment for a candidate variety/season/class and returns BOTH variant results plus the variant that would actually be applied. Does not mutate contract state."
    roles: [ProgramAdmin, FieldOfficer]
    code: 200
    input: [variety_id, season_year, seed_class]
    output: "{ strict_history_result: string, decay_weighted_result: string, restricted_record_count: integer, history_component: number, isolation_component: number, contamination_risk_score: number, isolation_shortfall_m: number, applied_variant: string, applied_result: string, blocking_error_id: string }"
    side_effects: ["writes ProductionField.last_assessed_risk_score with contamination_risk_score"]

  # --- contracting ----------------------------------------------------------
  - method: POST
    path: "/seed-ops/production-contracts"
    description: "Draft a production contract binding a grower, variety and field for one season with pricing and an advance"
    roles: [ProgramAdmin]
    code: 201
    input: [grower_id, variety_id, production_field_id, season_year, seed_class, contracted_acres, base_price_per_unit_cents, conditioning_charge_per_unit_cents, advance_total_cents]
    output: ProductionContract
    side_effects: ["sets status to DRAFT", "sets advance_outstanding_cents to advance_total_cents"]
  - method: POST
    path: "/seed-ops/production-contracts/{production_contract_id}/offer"
    description: "Offer a drafted contract to the grower; runs the eligibility, isolation, history, grower-standing and field-season exclusivity gates"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProductionContract
    side_effects: ["DRAFT -> OFFERED", "sets eligibility_variant_applied and eligibility_risk_score", "increments version by 1"]
  - method: POST
    path: "/seed-ops/production-contracts/{production_contract_id}/sign"
    description: "Grower signs the offered contract and records the planting date"
    roles: [Grower]
    code: 200
    input: [planted_on]
    output: ProductionContract
    side_effects: ["OFFERED -> PLANTED", "increments version by 1"]
  - method: POST
    path: "/seed-ops/production-contracts/{production_contract_id}/cancel"
    description: "Cancel a contract that has not yet been harvested"
    roles: [ProgramAdmin]
    code: 200
    input: [cancel_reason]
    output: ProductionContract
    side_effects: ["DRAFT|OFFERED|PLANTED|ROGUEING_REQUIRED|INSPECTION_PASSED -> CANCELLED", "increments version by 1"]

  # --- field inspection and rogueing ---------------------------------------
  - method: POST
    path: "/seed-ops/field-inspections"
    description: "Record a field inspection count sheet; the outcome branch is computed by inspection_outcome_determination"
    roles: [FieldOfficer]
    code: 201
    input: [production_contract_id, inspected_on, sampled_plants, off_type_plants, restricted_weed_plants, diseased_plants, isolation_verified_m]
    output: FieldInspection
    side_effects: ["sets inspector_user_id from X-User-ID", "computes off_type_rate_per_10000, weed_rate_per_10000, disease_incidence_pct and outcome", "moves the contract to INSPECTION_PASSED, ROGUEING_REQUIRED or REJECTED per the outcome", "on ROGUEING_REQUIRED or REJECTED runs grower_standing_rollup", "increments contract.version by 1", "increments contract.inspection_round by 1"]
  - method: POST
    path: "/seed-ops/field-inspections/{field_inspection_id}/rogueing-declaration"
    description: "Grower declares the rogueing work performed after a ROGUEING_ORDERED inspection"
    roles: [Grower]
    code: 200
    input: [rogueing_plants_removed, rogueing_declared_on]
    output: FieldInspection
    side_effects: ["RECORDED -> ROGUEING_DECLARED", "increments version by 1"]
  - method: POST
    path: "/seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
    description: "A second field officer verifies the declared rogueing and re-counts the remaining off-types; segregation of duties forbids the original inspector"
    roles: [FieldOfficer]
    code: 200
    input: [verified_remaining_off_type_plants]
    output: FieldInspection
    side_effects: ["ROGUEING_DECLARED -> ROGUEING_VERIFIED then CLOSED", "sets rogueing_verified_by_user_id from X-User-ID", "returns the contract to PLANTED, or to REJECTED when rogueing_rounds_used would exceed Variety.max_rogueing_rounds", "increments contract.version by 1"]

  # --- harvest --------------------------------------------------------------
  - method: POST
    path: "/seed-ops/harvest-equipment"
    description: "Register a harvest machine with its required cleanout duration; status starts DIRTY"
    roles: [ProgramAdmin, ConditioningManager]
    code: 201
    input: [equipment_code, equipment_kind, cleanout_minutes_required]
    output: HarvestEquipment
    side_effects: ["sets status to DIRTY and cleanout_certified to false"]
  - method: POST
    path: "/seed-ops/harvest-equipment/{harvest_equipment_id}/cleanout-certification"
    description: "Certify that the machine has been cleaned out for a named variety, clearing it for that variety only"
    roles: [ConditioningManager, FieldOfficer]
    code: 200
    input: [variety_id, cleaned_at]
    output: HarvestEquipment
    side_effects: ["sets status to AVAILABLE, cleanout_certified to true, last_cleanout_variety_id to variety_id, last_cleanout_at to cleaned_at", "increments version by 1"]
  - method: POST
    path: "/seed-ops/harvest-events"
    description: "Record a completed harvest window, mint the RAW seed lot and book the provisional clean-seed units"
    roles: [FieldOfficer, ConditioningManager]
    code: 201
    input: ["production_contract_id", "harvest_equipment_id", "window_start", "window_end", "gross_weight_kg", "moisture_pct", "bag_size_kg?"]
    output: HarvestEvent
    side_effects: ["runs clean_seed_unit_accounting variant PROVISIONAL_HARVEST_BASIS", "creates a SeedLot in conditioning_status RAW / certification_status UNSAMPLED with a system lot_code and sets harvest_event.seed_lot_id", "adds provisional_clean_units to contract.provisional_clean_units_total", "contract INSPECTION_PASSED -> HARVESTED (a later harvest event on an already HARVESTED contract keeps the status and re-runs every other side effect)", "sets equipment status to DIRTY and cleanout_certified to false", "increments contract.version by 1", "increments equipment.version by 1"]

  # --- conditioning ---------------------------------------------------------
  - method: POST
    path: "/seed-ops/conditioning-lines"
    description: "Register a conditioning line with its hourly capacity and required inter-variety cleanout buffer"
    roles: [ProgramAdmin, ConditioningManager]
    code: 201
    input: ["line_code", "cleanout_minutes_required", "capacity_kg_per_hour", "status?"]
    output: ConditioningLine
    side_effects: []
  - method: POST
    path: "/seed-ops/conditioning-runs"
    description: "Plan one conditioning stage (CLEANING, SIZING, TREATING or BAGGING) for a lot on a line; enforces stage order, line window and cleanout buffer, and the treated-seed label rules"
    roles: [ConditioningManager]
    code: 201
    input: ["seed_lot_id", "conditioning_line_id", "stage", "window_start", "window_end", "input_kg", "treatment_product_id?", "treatment_rate_g_per_100kg?", "label_text?"]
    output: ConditioningRun
    side_effects: ["sets status to PLANNED", "records cleanout_buffer_applied_minutes"]
  - method: POST
    path: "/seed-ops/conditioning-runs/{conditioning_run_id}/complete"
    description: "Close out a planned run with the measured output mass, advancing the lot's conditioning axis and reconciling its mass ledger"
    roles: [ConditioningManager]
    code: 200
    input: [output_kg]
    output: ConditioningRun
    side_effects: ["PLANNED -> COMPLETED", "sets shrink_kg to input_kg - output_kg", "advances lot.conditioning_status one step (CLEANED, SIZED, TREATED or BAGGED)", "sets lot.current_kg to output_kg and adds shrink_kg to lot.cumulative_shrink_kg", "on stage BAGGING runs clean_seed_unit_accounting variant FINAL_BAGGED_BASIS, sets lot.final_clean_units, lot.bag_count and lot.dockage_pct", "sets line.last_cleanout_variety_id to the lot's variety_id and line.last_run_end_utc to window_end", "increments lot.version by 1", "increments line.version by 1"]
  - method: POST
    path: "/seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
    description: "Reverse the latest run on a lot, compensating every mass and derived-field side effect it applied"
    roles: [ConditioningManager]
    code: 200
    input: [reversal_reason]
    output: ConditioningRun
    side_effects: ["PLANNED -> ABORTED or COMPLETED -> REVERSED", "for a COMPLETED run restores lot.current_kg to input_kg, subtracts shrink_kg from lot.cumulative_shrink_kg and steps lot.conditioning_status back one stage", "for a reversed BAGGING run clears lot.final_clean_units, lot.bag_count and lot.dockage_pct", "increments lot.version by 1"]
  - method: POST
    path: "/seed-ops/seed-lots/{seed_lot_id}/carryover"
    description: "Mint a carryover successor lot from a tagged parent whose germination result has lapsed; requires the parent's expected version"
    roles: [ConditioningManager]
    code: 201
    input: [expected_seed_lot_version, next_season_year]
    output: SeedLot
    side_effects: ["creates a successor SeedLot with parent_seed_lot_id set, carryover_generation = parent + 1, conditioning_status BAGGED, certification_status RETEST_DUE and the parent's current_kg, bag_size_kg and bag_count", "sets parent.certification_status to RETEST_DUE", "voids every ISSUED CertificationTag on the parent and zeroes parent.tagged_bag_count", "increments parent SeedLot.version by 1"]

  # --- sampling, testing and tagging ---------------------------------------
  - method: POST
    path: "/seed-ops/lot-samples"
    description: "Certification agency draws an official sample from a bagged lot"
    roles: [CertificationAgency]
    code: 201
    input: [seed_lot_id, sample_kind, sampled_on]
    output: LotSample
    side_effects: ["sets sampler_user_id from X-User-ID", "sets result to PENDING", "sets lot.certification_status to SAMPLED", "increments lot.version by 1"]
  - method: POST
    path: "/seed-ops/lot-samples/{lot_sample_id}/results"
    description: "Post the laboratory germination and purity findings; the verdict cascades to the lot, its price and its tags"
    roles: [CertificationAgency]
    code: 200
    input: [germination_pct, purity_pct, inert_pct, weed_seed_count_per_kg, tested_at]
    output: LotSample
    side_effects: ["PENDING -> PASS or FAIL against Variety.germination_min_pct and purity_min_pct", "copies germination_pct, purity_pct and weed_seed_count_per_kg onto the lot", "on PASS sets lot.certification_status to PASSED, sets germination_valid_until per carryover_retest_window and runs adjusted_price_per_unit", "on FAIL sets lot.certification_status to FAILED, sets lot.disposition to DOWNGRADE_TO_COMMERCIAL, voids every ISSUED tag on the lot, supersedes any COMPUTED or APPROVED settlement of the lot's contract and sets that settlement's quality_hold", "increments lot.version by 1"]
  - method: POST
    path: "/seed-ops/certification-tags"
    description: "Issue certification tags for a number of bags of a passed lot"
    roles: [CertificationAgency]
    code: 201
    input: [seed_lot_id, lot_sample_id, tag_class, bag_count]
    output: CertificationTag
    side_effects: ["sets a system tag_serial and issued_at", "sets status to ISSUED", "adds bag_count to lot.tagged_bag_count", "sets lot.certification_status to TAGGED", "increments lot.version by 1"]
  - method: POST
    path: "/seed-ops/certification-tags/{certification_tag_id}/void"
    description: "Void an issued tag and return its bags to the untagged pool"
    roles: [CertificationAgency]
    code: 200
    input: [void_reason]
    output: CertificationTag
    side_effects: ["ISSUED -> VOIDED", "subtracts bag_count from lot.tagged_bag_count", "returns lot.certification_status to PASSED when tagged_bag_count reaches 0", "increments lot.version by 1", "increments version by 1"]

  # --- settlement -----------------------------------------------------------
  - method: POST
    path: "/seed-ops/settlements"
    description: "Compute a grower settlement over every tagged lot of the contract; requires the contract's expected version"
    roles: [SettlementAccountant]
    code: 201
    input: [production_contract_id, expected_contract_version]
    output: GrowerSettlement
    side_effects: ["runs settlement_line_rollup then settlement_net_payable", "sets computed_by_user_id from X-User-ID", "sets status to COMPUTED", "increments ProductionContract.version by 1"]
  - method: POST
    path: "/seed-ops/settlements/{settlement_id}/approve"
    description: "Second accountant approves a computed settlement and books the advance recovery"
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: GrowerSettlement
    side_effects: ["COMPUTED -> APPROVED", "sets approved_by_user_id from X-User-ID", "subtracts advance_recovery_cents from contract.advance_outstanding_cents", "contract HARVESTED -> SETTLED", "increments version by 1", "increments contract.version by 1"]
  - method: POST
    path: "/seed-ops/settlements/{settlement_id}/dispute"
    description: "Grower disputes a computed or approved settlement, reversing any booked advance recovery"
    roles: [Grower]
    code: 200
    input: [dispute_reason]
    output: GrowerSettlement
    side_effects: ["COMPUTED|APPROVED -> DISPUTED", "when the settlement was APPROVED adds advance_recovery_cents back to contract.advance_outstanding_cents (certified_units_total is a derived roll-up over TAGGED lots and is never touched by settlement money movements)", "returns the contract to HARVESTED when it was SETTLED", "increments version by 1", "increments contract.version by 1"]
  - method: POST
    path: "/seed-ops/settlements/{settlement_id}/pay"
    description: "Pay an approved settlement and close the contract"
    roles: [SettlementAccountant]
    code: 200
    input: [payment_reference]
    output: GrowerSettlement
    side_effects: ["APPROVED -> PAID", "contract SETTLED -> CLOSED", "increments version by 1", "increments contract.version by 1"]

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window-elapsed, germination-validity and retest rule reads. Before any call the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
