        claim_type: precision
        grounds: [calculations.admin_fee_on_receipt]
        distinguishing_aspect: "Flat-3% on 150 cents yields exactly 4.5 cents; round_half_up pins the result to 5 (half-even or truncation would give 4)."
        test_recipe:
