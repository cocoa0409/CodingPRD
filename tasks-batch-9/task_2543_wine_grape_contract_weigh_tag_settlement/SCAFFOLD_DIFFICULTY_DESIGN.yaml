  # ===========================================================================
  # RULE 3 — non-linear state machines (cyclic + parallel dimensions)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: grape_contract_cyclic_negotiation_with_independent_renewal_dimension
        grounds:
          - state_machines.GrapeContract.lifecycle_status
          - state_machines.GrapeContract.renewal_status
          - entities.GrapeContract.fields.offer_round
          - entities.GrapeContract.fields.countered_price_per_ton_cents
          - entities.GrapeContract.fields.renewal_window_opens_at
          - validations.priority_27
        distinguishing_aspect: |
          The non-linearity here is on GrapeContract and is BOTH cyclic and parallel: the
          lifecycle dimension loops OFFERED -> COUNTERED -> OFFERED three times (bounded by
          MAX_OFFER_ROUNDS = 3, the fourth offer refused) while the renewal dimension of the
          very same row never leaves NOT_DUE; only afterwards does the renewal dimension move
          to RENEWAL_WINDOW_OPEN on a pure clock advance with lifecycle_status frozen at ACTIVE.
          Two independent dimensions on one row, each advanced by a different trigger family.
        test_recipe:
          setup:
            - "One producer, one block, the reference QualitySpec."
            - "Contract GC-NEGO with term 2026-2027, termination_notice_days 90 and evergreen_flag false, so renewal_window_closes_at is 2027-11-01T00:00:00Z and renewal_window_opens_at is 2027-08-03T00:00:00Z."
            - "A second contract GC-STUCK on the same grower, used only to exhaust the negotiation cycle."
