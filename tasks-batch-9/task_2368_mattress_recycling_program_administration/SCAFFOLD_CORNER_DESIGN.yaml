          - errors[ERR_REMITTANCE_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "ExemptionClaim.remittance_id is set from the path, so posting a claim under an unused remittance UUID returns 404 ERR_REMITTANCE_NOT_FOUND and never creates an orphan claim."
        test_recipe:
