          setup:
            - "Terminal SIN in SG with sealed_bag_regime NONE"
            - "One LIQUOR product priced 8000 cents at 2400 bps, LISTED, 10 units in bonded stock"
            - "AU/LIQUOR arrival allowance of exactly 2 units"
            - "ConcessionAgreement 2026-08 at 1200 bps with a 10000-cent minimum guarantee, ACTIVE"
            - "Two scanned itineraries to AU departing 2026-08-25, one basket of qty 2 and one of qty 3"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
