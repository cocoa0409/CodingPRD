              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "VERBAL" }
              as: Patient
              as_user_id: "${pat}"
              captures: { cons: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
          trigger:
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/cancel"
              payload: { cancel_reason: "patient left AMA" }
              as: Physician
              as_user_id: "${phy}"
              captures: { es: "$.data.encounter_status" }
            - call: "GET /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { c_status: "$.data[0].status" }
            - call: "GET /ambient-clinical-documentation/audio-captures/${cap}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { a_status: "$.data.status", a_reason: "$.data.purge_reason" }
          assert:
            - "es == CANCELLED"
            - "cascade link 1: c_status == EXPIRED (consent expired by cancellation)"
            - "cascade link 2: a_status == PURGED and a_reason == CANCEL (in-flight audio destroyed by the consent expiry, not by the cancel directly)"

