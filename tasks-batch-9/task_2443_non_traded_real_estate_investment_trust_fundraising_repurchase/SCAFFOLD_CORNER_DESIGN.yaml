      - name: closed_registration_and_abandoned_event_reject_every_further_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Offering.terminal_states
          - state_machines.LiquidityEvent.terminal_states
          - state_machines.ShareClass.terminal_states
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Three terminal states are locked down at once, and the ShareClass case is
          the sharp one: the class is CLOSED_TO_NEW by cascade AND its offering is
          no longer EFFECTIVE, yet priority 7 outranks priority 8, so the answer
          must be ERR_INVALID_STATE_TRANSITION rather than
          ERR_OFFERING_NOT_EFFECTIVE.
        test_recipe:
          setup:
            - "Offering 'Lockdown REIT' driven DRAFT -> EFFECTIVE -> CLOSED with no pending subscriptions, which cascades its class to CLOSED_TO_NEW."
            - "A LiquidityEvent abandoned straight out of PROPOSED."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Lockdown REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
