scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_event_creation_returns_declared_defaults
        claim_type: Creation
        grounds: [entities.Event.fields.state, entities.Event.fields.registered_count]
        distinguishing_aspect: "POST /api/events with all required fields returns 201 with state DRAFT, version 1, registered_count 0, gross_collected_cents 0 and streamed_minutes_total 0."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-07-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /api/events"
              payload: { name: "Corner Event", timezone: "UTC", starts_at: "2026-10-01T09:00:00Z", ends_at: "2026-10-01T17:00:00Z", early_bird_ends_at: "2026-09-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id, ev_state: $.data.state, ev_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "${ev_state} == DRAFT"
            - "${ev_v} == 1"
            - "Event.${ev_id}.registered_count == 0"
            - "Event.${ev_id}.gross_collected_cents == 0"
            - "Event.${ev_id}.streamed_minutes_total == 0"
            - "Event.${ev_id}.published_recording_count == 0"

      - name: corner_event_read_returns_stored_values
        claim_type: Retrieval
        grounds: [entities.Event.fields.capacity, entities.Event.fields.timezone]
        distinguishing_aspect: "GET /api/events/{event_id} echoes the exact name, timezone and capacity supplied at creation."
        test_recipe:
          setup: ["One DRAFT event named 'Read Me' with capacity 25 in timezone UTC."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Read Me", timezone: "UTC", starts_at: "2026-10-02T09:00:00Z", ends_at: "2026-10-02T17:00:00Z", early_bird_ends_at: "2026-09-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { got_name: $.data.name, got_cap: $.data.capacity }
          assert:
            - "HTTP status == 200"
            - "${got_name} == Read Me"
            - "${got_cap} == 25"

      - name: corner_registrations_list_returns_pagination_envelope
        claim_type: Listing
        grounds: [entities.Registration.fields.event_id]
        distinguishing_aspect: "GET /api/registrations with event_id, limit 1 and offset 0 returns exactly one item while meta reports total_count 2 and has_more true."
        test_recipe:
          setup:
            - "Event 'Page Me' PUBLISHED with a GENERAL 20000-cent ticket (quota 10) and two registrations."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Page Me", timezone: "UTC", starts_at: "2026-10-03T09:00:00Z", ends_at: "2026-10-03T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "p1@example.com" }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "p2@example.com" }
              as: Organizer
              as_user_id: "org-1"
          trigger:
            - call: "GET /api/registrations"
              payload: { event_id: "${ev_id}", limit: 1, offset: 0 }
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "HTTP status == 200"
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"
            - "length(response.data) == 1"

      - name: corner_event_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/events/{event_id} with a well-formed but unknown UUID returns ERR_EVENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /api/events/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_EVENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: corner_registration_missing_required_field_returns_validation_error
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", "validations[priority=12]"]
        distinguishing_aspect: "POST /api/registrations without attendee_email returns ERR_VALIDATION with HTTP 400 and leaves TicketType.sold_count at 0."
        test_recipe:
          setup: ["Event 'Missing Field' PUBLISHED with one GENERAL ticket type."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Missing Field", timezone: "UTC", starts_at: "2026-10-04T09:00:00Z", ends_at: "2026-10-04T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}" }
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status == 400"
            - "TicketType.${tt_id}.sold_count == 0"

      - name: corner_registration_group_size_defaults_to_one
        claim_type: Defaults
        grounds: [entities.Registration.fields.group_size, entities.Registration.fields.group_code]
        distinguishing_aspect: "Omitting group_size stores group_size 1 and group_code null, so no group discount applies and amount_due_cents is 20600."
        test_recipe:
          setup: ["Event 'Defaults' PUBLISHED with a GENERAL 20000-cent ticket type and early_bird_ends_at in the past."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Defaults", timezone: "UTC", starts_at: "2026-10-05T09:00:00Z", ends_at: "2026-10-05T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "d1@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id }
          assert:
            - "Registration.${reg_id}.group_size == 1"
            - "Registration.${reg_id}.group_code == null"
            - "Registration.${reg_id}.amount_due_cents == 20600"
            - "Registration.${reg_id}.payment_status == UNPAID"
            - "Registration.${reg_id}.attendance_status == REGISTERED"

      - name: corner_ticket_type_computed_counters_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.TicketType.fields.sold_count, entities.TicketType.fields.availability_status]
        distinguishing_aspect: "sold_count and availability_status are server-computed: a freshly created ticket type reports sold_count 0 and availability_status AVAILABLE."
        test_recipe:
          setup: ["One DRAFT event."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Computed", timezone: "UTC", starts_at: "2026-10-06T09:00:00Z", ends_at: "2026-10-06T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 4, gating_level: "ON_DEMAND" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "TicketType.${tt_id}.sold_count == 0"
            - "TicketType.${tt_id}.availability_status == AVAILABLE"
            - "TicketType.${tt_id}.version == 1"

      - name: corner_ticket_type_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.TicketType.fields.tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "tier PLATINUM is outside the declared enum {GENERAL, VIP, SPONSOR, SPEAKER}, so the create is rejected with ERR_VALIDATION 400."
        test_recipe:
          setup: ["One DRAFT event."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Enum Guard", timezone: "UTC", starts_at: "2026-10-07T09:00:00Z", ends_at: "2026-10-07T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "Platinum", tier: "PLATINUM", price_cents: 20000, quota: 4, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: corner_session_speaker_junction_discoverable_from_speaker_side
        claim_type: Parent Relationships
        grounds: [entities.SessionSpeaker.fields.session_id, entities.SessionSpeaker.fields.speaker_id]
        distinguishing_aspect: "The many-to-many junction row is reachable from its speaker FK: GET /api/session-speakers with speaker_id returns exactly the one created row in state INVITED."
        test_recipe:
          setup: ["Event 'Graph' DRAFT with one track, one DRAFT session and one speaker invited to it."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Graph", timezone: "UTC", starts_at: "2026-10-08T09:00:00Z", ends_at: "2026-10-08T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Panel", starts_at: "2026-10-08T10:00:00Z", ends_at: "2026-10-08T11:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
              payload: { full_name: "Ada Poole", email: "ada@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { spk_id: $.data.id }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${ses_id}", speaker_id: "${spk_id}", speaking_role: "MODERATOR" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_id: $.data.id }
          trigger:
            - call: "GET /api/session-speakers"
              payload: { speaker_id: "${spk_id}" }
              as: Organizer
              as_user_id: "org-1"
              captures: { by_speaker: "$.data[0].id" }
          assert:
            - "${by_speaker} == ${ss_id}"
            - "response.meta.total_count == 1"
            - "SessionSpeaker.${ss_id}.state == INVITED"
            - "SessionSpeaker.${ss_id}.invite_round == 1"

  - section: state_machines
    instances:
      - name: corner_publish_without_ticket_type_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Event.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a DRAFT event that has zero ticket types violates the 'at least one TicketType exists' precondition and returns ERR_INVALID_STATE 409 with the event still DRAFT."
        test_recipe:
          setup: ["One DRAFT event with no ticket types."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "No Tickets", timezone: "UTC", starts_at: "2026-10-09T09:00:00Z", ends_at: "2026-10-09T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Event.${ev_id}.state == DRAFT"

      - name: corner_cancel_event_twice_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Event.DRAFT_to_CANCELLED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is a terminal Event state, so a second cancel returns ERR_ALREADY_TERMINAL 409 and no side effects fire."
        test_recipe:
          setup: ["One event already CANCELLED from DRAFT."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Twice Cancelled", timezone: "UTC", starts_at: "2026-10-10T09:00:00Z", ends_at: "2026-10-10T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/cancel"
              payload: { reason: "budget cut" }
              as: Organizer
              as_user_id: "org-1"
              captures: { v_after_first: $.data.version }
          trigger:
            - call: "POST /api/events/${ev_id}/cancel"
              payload: { reason: "budget cut again" }
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ALREADY_TERMINAL"
            - "HTTP status == 409"
            - "Event.${ev_id}.state == CANCELLED"
            - "Event.${ev_id}.version == ${v_after_first}"

      - name: corner_decline_from_accepted_session_speaker_is_invalid_transition
        claim_type: Invalid Transitions
        grounds: [state_machines.SessionSpeaker.INVITED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINE is only declared from INVITED; issuing it against an ACCEPTED junction row returns ERR_INVALID_STATE 409 and leaves accepted_session_count at 1."
        test_recipe:
          setup: ["Event 'Decline Guard' DRAFT with one DRAFT session and one speaker whose invitation is ACCEPTED."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Decline Guard", timezone: "UTC", starts_at: "2026-10-11T09:00:00Z", ends_at: "2026-10-11T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Talk", starts_at: "2026-10-11T10:00:00Z", ends_at: "2026-10-11T11:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
              payload: { full_name: "Yuki Sato", email: "yuki@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { spk_id: $.data.id }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${ses_id}", speaker_id: "${spk_id}", speaking_role: "HOST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_id: $.data.id }
            - call: "POST /api/session-speakers/${ss_id}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
          trigger:
            - call: "POST /api/session-speakers/${ss_id}/decline"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "SessionSpeaker.${ss_id}.state == ACCEPTED"
            - "Speaker.${spk_id}.accepted_session_count == 1"

      - name: corner_session_cancel_releases_track_slot_and_speakers
        claim_type: Side Effect Execution
        grounds: [state_machines.Session.DRAFT_SCHEDULED_LIVE_to_CANCELLED, entities.Track.fields.scheduled_session_count]
        distinguishing_aspect: "Cancelling a SCHEDULED session decrements Track.scheduled_session_count from 1 to 0 and moves its ACCEPTED SessionSpeaker row to RELEASED with the speaker back to UNASSIGNED."
        test_recipe:
          setup: ["Event 'Release' DRAFT with one track, one SCHEDULED session and one ACCEPTED speaker on it."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Release", timezone: "UTC", starts_at: "2026-10-12T09:00:00Z", ends_at: "2026-10-12T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Talk", starts_at: "2026-10-12T10:00:00Z", ends_at: "2026-10-12T11:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
              payload: { full_name: "Ivan Petrov", email: "ivan@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { spk_id: $.data.id }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${ses_id}", speaker_id: "${spk_id}", speaking_role: "HOST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_id: $.data.id }
            - call: "POST /api/session-speakers/${ss_id}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
            - call: "POST /api/sessions/${ses_id}/schedule"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
          trigger:
            - call: "POST /api/sessions/${ses_id}/cancel"
              payload: { reason: "speaker illness" }
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "Session.${ses_id}.state == CANCELLED"
            - "Track.${tr_id}.scheduled_session_count == 0"
            - "SessionSpeaker.${ss_id}.state == RELEASED"
            - "Speaker.${spk_id}.accepted_session_count == 0"
            - "Speaker.${spk_id}.engagement_status == UNASSIGNED"

      - name: corner_broadcast_end_computes_streamed_minutes_and_completes_session
        claim_type: Ledger sync
        grounds: [state_machines.Broadcast.LIVE_to_ENDED, entities.Broadcast.fields.streamed_minutes, entities.Event.fields.streamed_minutes_total]
        distinguishing_aspect: "Ending a broadcast 45 minutes after go-live writes Broadcast.streamed_minutes 45, adds the same 45 to Event.streamed_minutes_total, completes the session and advances the recording PENDING -> PROCESSING."
        test_recipe:
          setup:
            - "Event 'Ledger' LIVE with one SCHEDULED session, one ACCEPTED speaker and a LIVE broadcast started at 2026-07-01T00:00:00Z."
            - "The logical clock is then moved to 2026-07-01T00:45:00Z."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Ledger", timezone: "UTC", starts_at: "2026-10-13T09:00:00Z", ends_at: "2026-10-13T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Keynote", starts_at: "2026-10-13T10:00:00Z", ends_at: "2026-10-13T11:00:00Z", session_type: "LIVE", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
