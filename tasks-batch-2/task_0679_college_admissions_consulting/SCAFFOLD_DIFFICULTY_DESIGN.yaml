# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# College Admissions Consulting — Expert (FLAT topology)
# 9 rule_ids x >=2 instances = 18 instances
# Clock default before any set_current_utc: 2026-04-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ledger_actual_vs_projected_balance_diverge
        grounds:
          - calculations.retainer_ledger
          - calculations.projected_retainer_balance
          - entities.EngagementContract.fields.retainer_balance_cents
          - entities.EngagementContract.fields.projected_balance_cents
          - state_machines.ApplicationTask.OPEN_to_IN_PROGRESS
        distinguishing_aspect: |
          On the EngagementContract domain: with one pending billable task (OPEN,
          estimated_cost_cents=50000) the chronological actual retainer_balance_cents (200000) and the
          forward-looking projected_balance_cents (150000) differ on identical data, because the pending
          task is EXCLUDED from the actual ledger but INCLUDED in projection.
        test_recipe:
          setup:
            - "Counselor c1 owns student s1; s1 onboarded then has an ACTIVE PACKAGE contract with a 200000-cent retainer deposit"
            - "s1 has a SELECTED school, an Application in IN_PROGRESS, and one OPEN billable FEE task with estimated_cost_cents=50000"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C One", email: "c1@x.com", hourly_rate_cents: 20000, weekly_review_capacity: 10 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c1}", full_name: "S One", email: "s1@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1200 }
              as: Counselor
              as_user_id: "${c1}"
              captures: { s1: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s1}", title: "Robotics", category: "ACADEMIC", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${c1}"
            - call: "POST /students/${s1}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c1}"
              captures: { s1_v_onb: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${s1}", billing_model: "PACKAGE", package_fee_cents: 600000, package_milestones: 3, retainer_deposit_cents: 200000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c1}"
              captures: { k1: $.data.id }
            - call: "POST /contracts/${k1}/activate"
              payload: { expected_student_version: "${s1_v_onb}" }
              as: Counselor
              as_user_id: "${c1}"
            - call: "POST /school-list-items"
              payload: { student_id: "${s1}", school_name: "Safe U", admit_rate: 0.40, median_sat: 1300, round: "RD" }
              as: Counselor
              as_user_id: "${c1}"
              captures: { sli1: $.data.id }
            - call: "POST /school-list-items/${sli1}/select"
              payload: { expected_student_version: "${s1_v_onb}" }
              as: Counselor
              as_user_id: "${c1}"
            - call: "POST /applications"
              payload: { student_id: "${s1}", school_list_item_id: "${sli1}", round: "RD", deadline_utc: "2027-01-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c1}"
              captures: { app1: $.data.id }
            - call: "POST /applications/${app1}/start-prep"
              payload: {}
              as: Counselor
              as_user_id: "${c1}"
            - call: "POST /application-tasks"
              payload: { application_id: "${app1}", title: "Pay fee", task_type: "FEE", due_utc: "2026-12-01T00:00:00Z", estimated_cost_cents: 50000, blocks_submission: true }
              as: Counselor
              as_user_id: "${c1}"
              captures: { t1: $.data.id }
          trigger:
            - call: "GET /contracts/${k1}"
              payload: {}
              as: Counselor
              as_user_id: "${c1}"
          assert:
            - "EngagementContract.${k1}.retainer_balance_cents == 200000"
            - "EngagementContract.${k1}.projected_balance_cents == 150000"
            - "EngagementContract.${k1}.retainer_balance_cents != EngagementContract.${k1}.projected_balance_cents"

      - name: scholarship_gross_vs_net_coordination_diverge
        grounds:
          - calculations.net_aid_amount
          - entities.ScholarshipAward.fields.gross_amount_cents
          - entities.ScholarshipAward.fields.net_amount_cents
          - state_machines.ScholarshipAward.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          On the ScholarshipAward domain (different from the ledger domain): an ACCEPTED NEED award with
          gross_amount_cents=2000000 nets only 1500000 after a prior ACCEPTED MERIT award (2500000)
          consumes part of the 4000000 coordination cap — gross and net diverge for the same award.
        test_recipe:
          setup:
            - "s2 (active student of c2) has an Application that is SUBMITTED and ADMITTED"
            - "A MERIT award (gross 2500000) is ACCEPTED, then a NEED award (gross 2000000) is ACCEPTED"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C Two", email: "c2@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c2}", full_name: "S Two", email: "s2@x.com", grad_year: 2027, gpa: 3.9, sat_total: 1500 }
              as: Counselor
              as_user_id: "${c2}"
              captures: { s2: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s2}", title: "Debate", category: "LEADERSHIP", hours_per_week: 4, weeks_per_year: 30, tier: 1 }
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /students/${s2}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c2}"
              captures: { s2_v_onb: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${s2}", billing_model: "HOURLY", hourly_rate_cents: 25000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c2}"
              captures: { k2: $.data.id }
            - call: "POST /contracts/${k2}/activate"
              payload: { expected_student_version: "${s2_v_onb}" }
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /school-list-items"
              payload: { student_id: "${s2}", school_name: "Dream U", admit_rate: 0.30, median_sat: 1350 }
              as: Counselor
              as_user_id: "${c2}"
              captures: { sli2: $.data.id }
            - call: "POST /school-list-items/${sli2}/select"
              payload: { expected_student_version: "${s2_v_onb}" }
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /applications"
              payload: { student_id: "${s2}", school_list_item_id: "${sli2}", round: "RD", deadline_utc: "2027-01-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c2}"
              captures: { app2: $.data.id }
            - call: "POST /applications/${app2}/start-prep"
              payload: {}
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /applications/${app2}/mark-ready"
              payload: {}
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app2}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /applications/${app2}/record-decision"
              payload: { decision: "ADMITTED" }
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /scholarships"
              payload: { student_id: "${s2}", award_name: "Merit Grant", award_type: "MERIT", gross_amount_cents: 2500000, application_id: "${app2}" }
              as: Counselor
              as_user_id: "${c2}"
              captures: { aw_merit: $.data.id }
            - call: "POST /scholarships/${aw_merit}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Counselor
              as_user_id: "${c2}"
            - call: "POST /scholarships"
              payload: { student_id: "${s2}", award_name: "Need Grant", award_type: "NEED", gross_amount_cents: 2000000, application_id: "${app2}" }
              as: Counselor
              as_user_id: "${c2}"
              captures: { aw_need: $.data.id }
          trigger:
            - call: "POST /scholarships/${aw_need}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Counselor
              as_user_id: "${c2}"
              captures: { need_net: $.data.net_amount_cents }
          assert:
            - "ScholarshipAward.${aw_need}.gross_amount_cents == 2000000"
            - "ScholarshipAward.${aw_need}.net_amount_cents == 1500000"
            - "ScholarshipAward.${aw_merit}.net_amount_cents == 2500000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: admit_probability_nonlinear_three_inputs
        grounds:
          - calculations.admit_probability
          - entities.SchoolListItem.fields.admit_probability
          - entities.Student.fields.profile_strength
        distinguishing_aspect: |
          Mode (a): admit_probability combines >=3 inputs (admit_rate, sat_gap branch, profile_strength)
          with a non-linear conditional multiplier and an additive strength bonus; for admit_rate=0.40,
          median_sat=1300, sat_total=1400 (gap=+100 => mult 1.6), profile_strength=60.16
          (strength_bonus = (60.16-50)/100*0.3 = 0.03048) the result is exactly 0.6705 — not any single
          linear function of the inputs.
        test_recipe:
          setup:
            - "Student s3 of c3 onboarded with gpa=3.5, sat_total=1400, one tier-3 activity (2h x 20wk) => academics 60.0, resume 0.16, profile_strength 60.16"
            - "A school-list item with admit_rate=0.40, median_sat=1300; student sat_total=1400 => gap +100 => multiplier 1.6"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C Three", email: "c3@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c3}", full_name: "S Three", email: "s3@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1400 }
              as: Counselor
              as_user_id: "${c3}"
              captures: { s3: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s3}", title: "Choir", category: "ARTS", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${c3}"
            - call: "POST /students/${s3}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c3}"
              captures: { ps3: $.data.profile_strength }
          trigger:
            - call: "POST /school-list-items"
              payload: { student_id: "${s3}", school_name: "Match U", admit_rate: 0.40, median_sat: 1300 }
              as: Counselor
              as_user_id: "${c3}"
              captures: { sli3: $.data.id, p3: $.data.admit_probability }
          assert:
            - "Student.${s3}.profile_strength == 60.16"
            - "SchoolListItem.${sli3}.admit_probability == 0.6705"
            - "SchoolListItem.${sli3}.classification == SAFETY"

      - name: profile_strength_round_then_sum_order
        grounds:
          - calculations.student_profile_strength
          - entities.Student.fields.profile_strength
          - entities.ActivityEntry.fields.tier
        distinguishing_aspect: |
          Mode (b): student_profile_strength pins rounding ORDER — each component (academics, resume) is
          rounded to 2dp BEFORE summing. With gpa=3.8 (gpa_c 38.0), sat_total=1400 (sat_c 25.0, academics
          63.0) and two activities netting resume 5.05, the pinned round-then-sum yields exactly 68.05.
        test_recipe:
          setup:
            - "Student s4 of c4 with gpa=3.8, sat_total=1400; two activities: tier1 (10h x 40wk => 4.0) and tier2 (5h x 30wk => 1.05) => resume 5.05, academics 63.0"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C Four", email: "c4@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { c4: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c4}", full_name: "S Four", email: "s4@x.com", grad_year: 2027, gpa: 3.8, sat_total: 1400 }
              as: Counselor
              as_user_id: "${c4}"
              captures: { s4: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s4}", title: "Lab", category: "ACADEMIC", hours_per_week: 10, weeks_per_year: 40, tier: 1 }
              as: Counselor
              as_user_id: "${c4}"
            - call: "POST /activities"
              payload: { student_id: "${s4}", title: "Band", category: "ARTS", hours_per_week: 5, weeks_per_year: 30, tier: 2 }
              as: Counselor
              as_user_id: "${c4}"
          trigger:
            - call: "POST /students/${s4}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c4}"
              captures: { ps4: $.data.profile_strength }
          assert:
            - "Student.${s4}.profile_strength == 68.05"
            - "Student.${s4}.intake_status == ONBOARDED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: essay_revision_cycle_round_increments
        grounds:
          - state_machines.Essay.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.Essay.REVISION_REQUESTED_to_DRAFTING
          - state_machines.Essay.DRAFTING_to_IN_REVIEW
          - entities.Essay.fields.revision_round
        distinguishing_aspect: |
          Essay entity is CYCLIC: DRAFTING -> IN_REVIEW -> REVISION_REQUESTED -> DRAFTING. After one full
          loop and a second submit-version, status is IN_REVIEW again and revision_round == 1, proving the
          loop re-enters DRAFTING rather than advancing linearly.
        test_recipe:
          setup:
            - "Student s5 of c5 (weekly_review_capacity 10) has an essay in DRAFTING (word_limit 650)"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C Five", email: "c5@x.com", hourly_rate_cents: 18000, weekly_review_capacity: 10 }
              as: PlatformAdmin
              captures: { c5: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c5}", full_name: "S Five", email: "s5@x.com", grad_year: 2027, gpa: 3.6, sat_total: 1300 }
              as: Counselor
              as_user_id: "${c5}"
              captures: { s5: $.data.id }
            - call: "POST /essays"
              payload: { student_id: "${s5}", prompt: "Why us?", word_limit: 650 }
              as: Student
              as_user_id: "${s5}"
              captures: { e5: $.data.id }
            - call: "POST /essays/${e5}/submit-version"
              payload: { word_count: 600, body: "draft one" }
              as: Student
              as_user_id: "${s5}"
            - call: "POST /essays/${e5}/request-revision"
              payload: {}
              as: Counselor
              as_user_id: "${c5}"
            - call: "POST /essays/${e5}/resume-drafting"
              payload: {}
              as: Student
              as_user_id: "${s5}"
          trigger:
            - call: "POST /essays/${e5}/submit-version"
              payload: { word_count: 620, body: "draft two" }
              as: Student
              as_user_id: "${s5}"
              captures: { st5: $.data.status, rr5: $.data.revision_round, lv5: $.data.latest_version_no }
          assert:
            - "Essay.${e5}.status == IN_REVIEW"
            - "Essay.${e5}.revision_round == 1"
            - "Essay.${e5}.latest_version_no == 2"

      - name: application_parallel_prep_and_decision_dimensions
        grounds:
          - state_machines.Application.READY_to_SUBMITTED
          - state_machines.Application.PENDING_to_ADMITTED
          - entities.Application.fields.prep_status
          - entities.Application.fields.decision_status
        distinguishing_aspect: |
          Application carries TWO independent state dimensions: prep_status advances
          NOT_STARTED->IN_PROGRESS->READY->SUBMITTED while decision_status stays PENDING; only after
          prep_status==SUBMITTED can decision_status move PENDING->ADMITTED — proving the dimensions are
          parallel on the same row, not a single linear chain.
        test_recipe:
          setup:
            - "Student s6 of c6, school SELECTED, an Application in prep READY with no open tasks; clock at 2026-12-01"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C Six", email: "c6@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { c6: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c6}", full_name: "S Six", email: "s6@x.com", grad_year: 2027, gpa: 3.6, sat_total: 1300 }
              as: Counselor
              as_user_id: "${c6}"
              captures: { s6: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s6}", title: "Tutor", category: "SERVICE", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${c6}"
            - call: "POST /students/${s6}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c6}"
              captures: { s6_v_onb: $.data.version }
            - call: "POST /school-list-items"
              payload: { student_id: "${s6}", school_name: "State U", admit_rate: 0.50, median_sat: 1250, round: "RD" }
              as: Counselor
              as_user_id: "${c6}"
              captures: { sli6: $.data.id }
            - call: "POST /school-list-items/${sli6}/select"
              payload: { expected_student_version: "${s6_v_onb}" }
              as: Counselor
              as_user_id: "${c6}"
            - call: "POST /applications"
              payload: { student_id: "${s6}", school_list_item_id: "${sli6}", round: "RD", deadline_utc: "2027-01-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c6}"
              captures: { app6: $.data.id }
            - call: "POST /applications/${app6}/start-prep"
              payload: {}
              as: Counselor
              as_user_id: "${c6}"
            - call: "POST /applications/${app6}/mark-ready"
              payload: {}
              as: Counselor
              as_user_id: "${c6}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app6}/submit"
              payload: {}
              as: Counselor
              as_user_id: "${c6}"
          trigger:
            - call: "POST /applications/${app6}/record-decision"
              payload: { decision: "ADMITTED" }
              as: Counselor
              as_user_id: "${c6}"
              captures: { prep6: $.data.prep_status, dec6: $.data.decision_status }
          assert:
            - "Application.${app6}.prep_status == SUBMITTED"
            - "Application.${app6}.decision_status == ADMITTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: task_done_charges_ledger_then_projection_depth3
        grounds:
          - state_machines.ApplicationTask.IN_PROGRESS_to_DONE
          - calculations.retainer_ledger
          - calculations.projected_retainer_balance
          - entities.BillingEntry.fields.amount_cents
          - entities.EngagementContract.fields.retainer_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade from the task DONE transition: (1) ApplicationTask -> DONE; (2) that mutation
          appends a BillingEntry CHARGE of estimated_cost_cents=50000; (3) the new BillingEntry forces
          recompute of EngagementContract.retainer_balance_cents (200000 -> 150000) AND
          projected_balance_cents. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "s7 of c7, ACTIVE PACKAGE contract retainer 200000, Application IN_PROGRESS, one IN_PROGRESS billable FEE task est 50000"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C Seven", email: "c7@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { c7: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c7}", full_name: "S Seven", email: "s7@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1200 }
              as: Counselor
              as_user_id: "${c7}"
              captures: { s7: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s7}", title: "Club", category: "WORK", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /students/${s7}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { s7_v_onb: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${s7}", billing_model: "PACKAGE", package_fee_cents: 600000, package_milestones: 3, retainer_deposit_cents: 200000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { k7: $.data.id }
            - call: "POST /contracts/${k7}/activate"
              payload: { expected_student_version: "${s7_v_onb}" }
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /school-list-items"
              payload: { student_id: "${s7}", school_name: "Safe U", admit_rate: 0.40, median_sat: 1300, round: "RD" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { sli7: $.data.id }
            - call: "POST /school-list-items/${sli7}/select"
              payload: { expected_student_version: "${s7_v_onb}" }
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /applications"
              payload: { student_id: "${s7}", school_list_item_id: "${sli7}", round: "RD", deadline_utc: "2027-01-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { app7: $.data.id }
            - call: "POST /applications/${app7}/start-prep"
              payload: {}
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /application-tasks"
              payload: { application_id: "${app7}", title: "Pay fee", task_type: "FEE", due_utc: "2026-12-01T00:00:00Z", estimated_cost_cents: 50000, blocks_submission: true }
              as: Counselor
              as_user_id: "${c7}"
              captures: { t7: $.data.id }
            - call: "POST /application-tasks/${t7}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Counselor
              as_user_id: "${c7}"
          trigger:
            - call: "POST /application-tasks/${t7}/transition"
              payload: { to_status: "DONE" }
              as: Counselor
              as_user_id: "${c7}"
          assert:
            - "EngagementContract.${k7}.charged_cents == 50000"
            - "EngagementContract.${k7}.retainer_balance_cents == 150000"
            - "EngagementContract.${k7}.projected_balance_cents == 150000"

