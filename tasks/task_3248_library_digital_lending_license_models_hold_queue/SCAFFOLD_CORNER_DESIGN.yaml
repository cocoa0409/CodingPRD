              as: Patron
              as_user_id: "${pat1_id}"
              captures: { hold1_id: $.data.id }
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat2_id}"
              captures: { hold2_id: $.data.id }
            - call: "POST /lending/loans/${loan0_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /lending/_ops/run_epoch"
              payload: {}
              as: ConsortiumAdmin
            - call: "POST /lending/holds/${hold1_id}/claim"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "at exactly ready_until the epoch expires P1's hold: Hold.${hold1_id}.status == EXPIRED"
            - "Hold.${hold2_id}.status == READY with ready_since == 2026-09-04T00:00:00Z (released copy re-promoted)"
            - "claiming the expired hold fails 409 with error_id == ERR_HOLD_NOT_ACTIONABLE"

      - name: order_revise_recompute_then_reapprove_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.AcquisitionOrder.REJECTED_to_DRAFT
        distinguishing_aspect: "REJECTED -> DRAFT with a payload swap (OCOU copies 1 -> METERED_TIME) recomputes estimated_cost_cents from 5000 to 4000, and the order can be re-proposed and approved on the new estimate."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, title T (ocou 5000, metered_time 4000); order created as OCOU copies 1, proposed, rejected."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_title
            - *k_order
            - *k_propose
            - call: "POST /lending/acquisition-orders/${order_id}/reject"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          trigger:
            - call: "POST /lending/acquisition-orders/${order_id}/revise"
              payload: { model: "METERED_TIME" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${order_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${order_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "after revise: status == DRAFT, model == METERED_TIME, estimated_cost_cents == 4000 (recomputed)"
            - "after re-propose + approve: status == APPROVED and fund.committed_cents == 4000 (not the stale 5000)"

      - name: fund_close_blocked_with_open_commitments
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BudgetFund.OPEN_to_CLOSED
          - errors.ERR_FUND_HAS_OPEN_COMMITMENTS
        distinguishing_aspect: "A fund with one APPROVED order cannot close (409 ERR_FUND_HAS_OPEN_COMMITMENTS); after that order is cancelled, the same close succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, title T; order proposed and approved (commitment 5000)."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_title
            - *k_order
            - *k_propose
            - *k_approve
          trigger:
            - call: "POST /lending/budget-funds/${fund_id}/close"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lending/acquisition-orders/${order_id}/cancel"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/budget-funds/${fund_id}/close"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "the first close fails 409 with error_id == ERR_FUND_HAS_OPEN_COMMITMENTS"
            - "after cancelling the APPROVED order, the second close succeeds: BudgetFund.${fund_id}.status == CLOSED"

