            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_FRAY" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${p1_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/resume", as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_resume: "$.data.error_id" } }
            - { call: "POST /fleetcare/part-orders/${o1_id}/install", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/resume", as: FieldTechnician, as_user_id: "${t1_id}", captures: { back_on_site: "$.data.status" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${p1_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { o2_id: "$.data.id" } }
            - { call: "POST /fleetcare/part-orders/${o2_id}/install", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/resume", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${p1_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { o3_id: "$.data.id" } }
            - { call: "POST /fleetcare/part-orders/${o3_id}/install", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/resume", as: FieldTechnician, as_user_id: "${t1_id}", captures: { third_resume: "$.data.parts_hold_count" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${p1_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_limit: "$.data.error_id" } }
          assert:
            - "${err_resume} == 'ERR_UNRESOLVED_PART_ORDER' with HTTP 409 and the call still PARTS_HOLD"
            - "${back_on_site} == 'ON_SITE' once the first order is INSTALLED"
            - "${third_resume} == 3 and the call is ON_SITE after the third pass"
            - "${err_limit} == 'ERR_PARTS_HOLD_LIMIT' with HTTP 409 and parts_hold_count is still 3"
            - "no fourth PartOrder row exists for ${call_id}"
            - "PartCatalogEntry.${p1_id}.on_hand_qty == 7 and allocated_qty == 0 (three units consumed)"
            - "ServiceContract.${c_id}.parts_allowance_remaining_cents == 476000 (3 x 8000 drawn)"
            - "ServiceCall.${call_id}.arrived_at and response_minutes were never recomputed by a resume"

      - name: mark_missed_needs_the_window_to_have_closed_first
        claim_type: valid_transition
        grounds:
          - state_machines[PreventiveVisit].transitions[SCHEDULED->MISSED]
          - validations[priority=24]
          - calculations.pm_compliance_pct
          - calculations.technician_capacity_invariant
        distinguishing_aspect: "The temporal guard is inclusive at the boundary: at 09:00 the mark-missed is ERR_VISIT_INVALID_STATE, at exactly window_end 09:30 it succeeds, returning the technician's 90 minutes and dropping pm_compliance_pct to 0.00 (a miss counts, unlike a cancellation)."
        test_recipe:
          setup:
            - "Clock 2026-08-15T09:00:00Z; club NORTH, unit e1, ACTIVE GOLD/FULL contract, technician T1."
            - "A visit on e1 is SCHEDULED for T1 from 08:00 to 09:30 and was never started."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T07:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-MM-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-15T08:00:00Z", window_end: "2026-08-15T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "GET /fleetcare/technician-assignments", payload: { preventive_visit_id: "${v1_id}" }, as: ServiceCoordinator, captures: { a1_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/mark-missed", as: ServiceCoordinator, captures: { err_early: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/mark-missed", as: ServiceCoordinator, captures: { v_status: "$.data.visit_status" } }
          assert:
            - "${err_early} == 'ERR_VISIT_INVALID_STATE' with HTTP 409 and the visit still SCHEDULED with a RESERVED assignment"
            - "Technician.${t1_id}.committed_minutes == 90 while the rejection stands"
            - "${v_status} == 'MISSED' with HTTP 200 at exactly window_end"
            - "TechnicianAssignment.${a1_id}.status == 'RELEASED' with release_reason == 'VISIT_MISSED'"
            - "Technician.${t1_id}.committed_minutes == 0 after the miss"
            - "ServiceContract.${c_id}.pm_visits_missed_count == 1, pm_visits_completed_count == 0 and pm_compliance_pct == 0.00"

      - name: visit_start_is_guarded_by_the_units_lifecycle_state
        claim_type: guarded transitions
        grounds:
          - state_machines[PreventiveVisit].transitions[SCHEDULED->IN_PROGRESS].preconditions
          - validations[priority=31]
          - errors.ERR_SAFETY_LOCKOUT_OPEN
        excluded_because:
          difficulty_instance: visit_start_depends_on_equipment_lifecycle_not_on_the_visit_row
          rationale: "That §1.8 cross_entity_state_dependency instance already drives the SCHEDULED → IN_PROGRESS guard from the Equipment row: it starts a sibling visit successfully in the same fixture, proving the block comes from equipment.lifecycle_status == TAGGED_OUT and not from the visit's own state, and it also checks that the refused start left committed_minutes untouched."

      - name: requote_cycle_and_the_decline_fork_teardown
        claim_type: cyclic
        grounds:
          - state_machines[ServiceContract].transitions[RENEWAL_QUOTED->RENEWAL_QUOTED]
          - state_machines[ServiceContract].transitions[RENEWAL_QUOTED->EXPIRED]
          - state_machines[RenewalQuote].transitions[ISSUED->SUPERSEDED]
        excluded_because:
          difficulty_instance: contract_requote_self_cycle_then_decline_fork_tears_down_schedule
          rationale: "That §1.8 non_linear_state_machine instance already walks the RENEWAL_QUOTED self-cycle (first quote SUPERSEDED, second ISSUED, contract still RENEWAL_QUOTED) and then takes the DECLINE branch of the fork, asserting the schedule teardown that the ACCEPT branch does not perform."

      - name: safety_document_rejection_cycle_and_its_lockout_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines[PreventiveVisit].transitions[SUBMITTED->REJECTED].side_effects
          - state_machines[PreventiveVisit].transitions[PENDING->SUBMITTED]
          - entities.PreventiveVisit.fields.pm_credit_earned
        excluded_because:
          difficulty_instance: preventive_visit_doc_dimension_cycles_after_visit_is_terminal
          rationale: "That §1.8 non_linear_state_machine instance already runs SUBMITTED → REJECTED → SUBMITTED → CERTIFIED on a COMPLETED visit, covering the rejection cascade (unit TAGGED_OUT with SAFETY_DOC_REJECTED, pm_credit_earned forced false) and the REJECTED → SUBMITTED re-entry in one sequence."

      - name: visit_cancellation_returns_the_reserved_calendar_minutes
        claim_type: compensation
        grounds:
          - state_machines[PreventiveVisit].transitions[SCHEDULED->CANCELLED].side_effects
          - calculations.technician_capacity_invariant
        excluded_because:
          difficulty_instance: visit_cancel_returns_the_technician_capacity_minutes
          rationale: "That §1.8 compensating_invariant instance already asserts the full reversal — assignment RELEASED with VISIT_CANCELLED, committed_minutes restored, the freed slot immediately re-bookable and pm_compliance_pct unharmed."

      - name: part_order_cancellation_restores_money_and_stock
        claim_type: compensation
        grounds:
          - state_machines[PartOrder].transitions[ALLOCATED->CANCELLED].side_effects
          - calculations.part_inventory_invariant
          - calculations.parts_allowance_invariant
        excluded_because:
          difficulty_instance: part_order_cancel_restores_allowance_and_the_originating_bucket
          rationale: "That §1.8 compensating_invariant instance already proves the cancel credits the refurbished bucket rather than on_hand_qty, zeroes the draw, restores parts_allowance_remaining_cents exactly and lets the call resume."

      - name: resolve_cascade_reaches_the_contracts_fleet_risk
        claim_type: ledger_sync
        grounds:
          - state_machines[ServiceCall].transitions[ON_SITE->RESOLVED].side_effects
          - calculations.equipment_health_score
          - calculations.fleet_renewal_risk
        excluded_because:
          difficulty_instance: third_critical_resolve_cascades_five_hops_to_fleet_renewal_risk
          rationale: "That §1.8 transitive_cascade instance already verifies all five hops of the resolve cascade end-to-end (event closure → downtime and credit ledgers → health variant switch → replacement recommendation → contract candidate count and fleet_renewal_risk)."

      - name: obsolete_critical_spare_cascade_to_replacement_candidates
        claim_type: cascade_down
        grounds:
          - state_machines[PartCatalogEntry].transitions[ACTIVE->OBSOLETE].side_effects
          - entities.Equipment.fields.support_status
          - calculations.equipment_health_score
        excluded_because:
          difficulty_instance: obsolete_critical_spare_cascades_four_hops_to_replacement_candidates
          rationale: "That §1.8 transitive_cascade instance already drives the UNSUPPORTED branch four hops deep, including the relaxed 60.00 replacement threshold flipping only the unit whose health sits below it and the resulting obsolete_unit_count / fleet_renewal_risk update."

      - name: a_new_source_hold_is_refused_once_the_part_is_obsolete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[PartCatalogEntry].transitions[END_OF_SUPPORT_ANNOUNCED->OBSOLETE]
          - errors.ERR_PART_SOURCE_UNAVAILABLE
          - validations[priority 56 ERR_PART_SOURCE_UNAVAILABLE]
        excluded_because:
          difficulty_instance: new_part_sourcing_depends_on_part_catalog_lifecycle
          rationale: "The §1.8 cross_entity_state_dependency instance already proves that the NEW source is refused on an OBSOLETE part while REFURBISHED still succeeds, and that the gate reads the part catalogue row rather than the call or the order; repeating it here would duplicate that recipe exactly."

  - section: calculations
    instances:
      - name: usage_readings_round_pm_status_and_health_at_every_boundary
        claim_type: precision
        grounds:
          - calculations.pm_status_evaluation
          - calculations.equipment_health_score
          - endpoints[POST /fleetcare/equipment/{equipmentId}/usage-readings]
        distinguishing_aspect: "Four monotonic readings walk both edges of the threshold table on one unit: 249 hours since the last PM is OK, exactly 250 is DUE, 312.49 is still DUE and exactly 312.50 (1.25x) is OVERDUE — while the same responses pin the health score to two round_half_up decimals (92.26 from 92.255)."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH, model TM-900 (pm_interval_hours 250, expected_service_life_hours 20000), unit e1 installed 2024-03-01 with 500 initial usage hours, so usage_hours_at_last_pm is 500."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-PM-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/equipment/${e1_id}/usage-readings", payload: { usage_hours: 749 }, as: ServiceCoordinator, captures: { s1: "$.data.pm_status", h1: "$.data.health_score" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/usage-readings", payload: { usage_hours: 750 }, as: ServiceCoordinator, captures: { s2: "$.data.pm_status" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/usage-readings", payload: { usage_hours: 812.49 }, as: ServiceCoordinator, captures: { s3: "$.data.pm_status" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/usage-readings", payload: { usage_hours: 812.50 }, as: ServiceCoordinator, captures: { s4: "$.data.pm_status", h4: "$.data.health_score", v4: "$.data.health_score_variant" } }
          assert:
            - "${s1} == 'OK' (749 - 500 = 249 hours since PM, one hour short of the interval)"
            - "${h1} == 92.26 — raw 100 - 100*(749/20000) - 2*2 = 92.255 rounded half up to 2 decimals, not truncated to 92.25"
            - "${s2} == 'DUE' at exactly hours_since_pm == 250 (the DUE boundary is inclusive)"
            - "${s3} == 'DUE' (312.49 hours, just inside 1.25 x 250 = 312.50)"
            - "${s4} == 'OVERDUE' at exactly 312.50 hours since PM"
            - "${h4} == 91.94 (raw 100 - 4.0625 - 4 = 91.9375) and ${v4} == 'USAGE_BASED'"
            - "Equipment.${e1_id}.usage_hours == 812.50 and usage_hours_at_last_pm is still 500.00 — a reading never advances the PM baseline"
            - "Equipment.${e1_id}.replacement_recommended == false (91.94 is far above the 40.00 base threshold)"

      - name: sla_target_scales_the_pinned_tier_minutes_by_severity
        claim_type: constants_applied
        grounds:
          - calculations.sla_response_evaluation
          - entities.ServiceContract.fields.sla_response_minutes
          - entities.ServiceCall.fields.sla_target_minutes
        distinguishing_aspect: "Two live contracts read different rows of both constant tables at once: a GOLD contract pins 120 minutes and a CRITICAL call halves it to 60, while a SILVER contract pins 240 and a MINOR call doubles it to 480 — and the arrival comparison then lands on opposite sides (61 > 60 breaches, 479 <= 480 holds)."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; model TM-900 is shared by both clubs."
            - "Club A in region NORTH holds an ACTIVE GOLD/FULL contract; club B in region SOUTH holds an ACTIVE SILVER/WEAR_ONLY contract with 2 PM visits per year."
            - "Technician T1 serves NORTH, technician T2 serves SOUTH; unit eA sits in club A and unit eB in club B."
            - "Both calls are reported at 08:00 and dispatched at 08:00 so their reported_at values are identical."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_a: "$.data.id" } }
            - { call: "POST /fleetcare/clubs", payload: { name: "Southgate Fitness", region_code: "SOUTH" }, as: ContractAdministrator, captures: { club_b: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_a}", model_id: "${model_id}", serial_number: "SN-SLA-A", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { ea_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_b}", model_id: "${model_id}", serial_number: "SN-SLA-B", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { eb_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_a}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { ca_id: "$.data.id", ca_sla: "$.data.sla_response_minutes" } }
            - { call: "POST /fleetcare/contracts/${ca_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_b}", coverage_tier: "SILVER", parts_inclusion: "WEAR_ONLY", pm_visits_per_year: 2, annual_base_cents: 180000, initial_parts_allowance_cents: 200000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { cb_id: "$.data.id", cb_sla: "$.data.sla_response_minutes" } }
            - { call: "POST /fleetcare/contracts/${cb_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ravi Shah", region_code: "SOUTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${ca_id}", equipment_id: "${ea_id}", severity: "CRITICAL", symptom_code: "MOTOR_DEAD" }, as: ServiceCoordinator, captures: { call_a: "$.data.id", target_a: "$.data.sla_target_minutes" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${cb_id}", equipment_id: "${eb_id}", severity: "MINOR", symptom_code: "CONSOLE_DIM" }, as: ServiceCoordinator, captures: { call_b: "$.data.id", target_b: "$.data.sla_target_minutes" } }
            - { call: "POST /fleetcare/service-calls/${call_a}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_b}/dispatch", payload: { start_at: "2026-08-15T08:00:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:01:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_a}/arrive", as: FieldTechnician, as_user_id: "${t1_id}", captures: { resp_a: "$.data.response_minutes", met_a: "$.data.sla_met" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T15:59:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_b}/arrive", as: FieldTechnician, as_user_id: "${t2_id}", captures: { resp_b: "$.data.response_minutes", met_b: "$.data.sla_met" } }
          assert:
            - "${ca_sla} == 120 and ${cb_sla} == 240, pinned from SLA_RESPONSE_MINUTES_BY_TIER at contract creation"
            - "${target_a} == 60 (120 x 0.5 for CRITICAL) and ${target_b} == 480 (240 x 2.0 for MINOR)"
            - "${resp_a} == 61 and ${met_a} == false — one minute past a halved GOLD target"
            - "${resp_b} == 479 and ${met_b} == true — inside a doubled SILVER target"
            - "Equipment.${ea_id}.lifecycle_status == 'DOWN' and Equipment.${eb_id}.lifecycle_status == 'DOWN'"
            - "the assignment on ${call_a} reserved 180 planned minutes (CRITICAL) and the one on ${call_b} reserved 60 (MINOR)"

      - name: each_downtime_event_absorbs_its_own_grace_before_billing
        claim_type: correct_result
        grounds:
          - calculations.downtime_credit
          - calculations.equipment_health_score
          - entities.ServiceContract.fields.credit_provisional_cents
        distinguishing_aspect: "Three consecutive outages on one unit prove the grace window is per event and never pooled: 180 minutes yields exactly 0, 240 yields 1600, and 181 yields 27 cents (1/60 of 1600 rounded half up) — and the third resolution flips the health variant, whose FAILURE_BASED score consumes the pooled 601 downtime minutes the credits refused to pool."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH (open 05:00-23:00), unit e1 installed 2024-03-01 with 500 usage hours, ACTIVE GOLD/FULL contract (annual base 250000 → cap 37500, grace 180 minutes, rate 1600 cents/hour), technician T1."
            - "Each call is dispatched, arrives immediately and is resolved after a controlled span; no LOANER_SWAP is ever installed, so effective_end_at always equals ended_at."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
