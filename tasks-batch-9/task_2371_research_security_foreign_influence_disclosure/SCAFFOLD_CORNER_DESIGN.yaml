        distinguishing_aspect: "The test-driving clock endpoint returns no entity, yet the assignment's computed status flips from ASSIGNED to EXPIRED on the next read with completed_on, waived_on and version all unchanged — proving the status is derived at read time rather than stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; investigator INV with an INSIDER_THREAT assignment due 2026-08-15T00:00:00Z."
          setup_api_calls:
