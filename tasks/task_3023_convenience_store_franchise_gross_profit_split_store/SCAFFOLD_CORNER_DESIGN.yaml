  # ===========================================================================
  - section: calculations
    instances:

      - name: gross_profit_split_final_variant_matches_the_pinned_evaluation_order
        claim_type: Correct Result
        grounds:
          - calculations.gross_profit_split
          - entities.Settlement.fields.gross_profit_cents
          - entities.Settlement.fields.eligible_split_pct
          - entities.Settlement.fields.net_settlement_cents
        distinguishing_aspect: "The pinned evaluation order is observable: gross_profit_cents is the line gross profit PLUS the rebate credit rather than either alone, eligible_split_pct is min(0.75, split_pct + tier_bonus), and franchisor_share_cents is the base MINUS the franchisee split so the two legs reconcile to the cent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement at split_pct 0.55 and rebate_pass_pct 0.50."
            - "One settlement for [2026-09-01, 2026-09-08) with lines MERCHANDISE 5000000/3500000 and SERVICES 1000000/400000, and an overlapping POSTED recommended-vendor rebate of 2000000."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Allegheny Retail LLC", owner_name: "June Castellano", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frM_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frM_id}", store_number: "PA-7001", state_code: "PA", format: "SUBURBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stM_id: $.data.id, stM_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frM_id}", store_id: "${stM_id}", split_pct: 0.55, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 0.50, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agM_id: $.data.id }
            - call: "POST /franchise/agreements/${agM_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stM_id}", franchisee_id: "${frM_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stM_v}" }
              as: FranchisorAdmin
              captures: { setM_id: $.data.id, setM_v1: $.data.version }
            - call: "POST /franchise/settlements/${setM_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 5000000, cost_of_goods_cents: 3500000, expected_settlement_version: "${setM_v1}" }
              as: FranchisorAdmin
              captures: { setM_v2: $.data.version }
            - call: "POST /franchise/settlements/${setM_id}/revenue-lines"
              payload: { category: "SERVICES", gross_sales_cents: 1000000, cost_of_goods_cents: 400000, expected_settlement_version: "${setM_v2}" }
              as: FranchisorAdmin
            - call: "POST /franchise/rebates"
              payload: { store_id: "${stM_id}", vendor_name: "Keystone Snacks Co", vendor_code: "KSC-11", recommended_vendor: true, rebate_cents: 2000000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements/${setM_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements/${setM_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "Settlement.${setM_id}.gross_sales_cents == 6000000 and Settlement.${setM_id}.cost_of_goods_cents == 3900000"
            - "Settlement.${setM_id}.rebate_credit_cents == 1000000.00"
            - "Settlement.${setM_id}.gross_profit_cents == 3100000.00 — the line gross profit 2100000.00 plus the 1000000.00 rebate credit"
            - "Settlement.${setM_id}.eligible_split_pct == 0.55 because 3100000.00 is below the 10000000 mid threshold, so no tier bonus applies"
            - "Settlement.${setM_id}.franchisee_split_cents == 1705000.00"
            - "Settlement.${setM_id}.franchisor_share_cents == 1395000.00"
            - "Settlement.${setM_id}.franchisee_split_cents + Settlement.${setM_id}.franchisor_share_cents == Settlement.${setM_id}.gross_profit_cents"
            - "Settlement.${setM_id}.eligible_split_pct != 0.57 — the tier bonus was not awarded below the threshold"

      - name: shrink_overage_zero_charge_boundary_on_a_negative_shrink
        claim_type: threshold
        grounds:
          - calculations.shrink_charge_book_to_physical
          - entities.ShrinkAudit.fields.shrink_cents
          - entities.ShrinkAudit.fields.shrink_charge_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The zero-charge boundary sits at shrink_cents == 0: a physical count EQUAL to book yields shrink_cents 0 and charge 0, and a physical count ABOVE book yields a negative shrink_cents that is still charged 0 rather than a negative credit — the franchisee is never paid for an overage."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-20T00:00:00Z. One franchisee, one ACTIVE store and one ACTIVE agreement at shrink_responsibility_pct 0.60, plus three SCHEDULED audits with book_inventory_cents 4000000 each for three non-overlapping earlier periods."
