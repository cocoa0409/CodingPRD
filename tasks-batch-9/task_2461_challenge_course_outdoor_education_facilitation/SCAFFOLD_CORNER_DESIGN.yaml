# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2461 — Challenge Course & Outdoor Education Facilitation
#
# Walked row-by-row against references/claim-extraction-guide.md's nine
# sections. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear
# as `excluded_because:` stubs. Every recipe drives empty-DB -> precondition
# using only §1.5 endpoints; the default logical clock is 2026-08-01T00:00:00Z
# and each chain sets it explicitly.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_course_returns_declared_defaults_for_every_computed_field
        claim_type: creation
        grounds:
          - entities.Course
          - endpoints["POST /challenge-course/courses"]
        distinguishing_aspect: "A brand-new unstaffed course reads posture OPEN with posture_reason NONE, latest_air_temp_c 20, latest_wind_speed_kph 0, latest_lightning_distance_km null and every counter 0, because course creation is not one of calculations.course_posture's recompute triggers."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          assert:
            - "http_status == 201"
            - "Course.${course_id}.course_name == Pine Ridge Challenge Course"
            - "Course.${course_id}.ems_response_minutes == 18"
            - "Course.${course_id}.posture == OPEN"
            - "Course.${course_id}.posture_reason == NONE"
            - "Course.${course_id}.latest_wind_speed_kph == 0"
            - "Course.${course_id}.latest_air_temp_c == 20"
            - "Course.${course_id}.latest_lightning_distance_km == null"
            - "Course.${course_id}.lightning_hold_until == null"
            - "Course.${course_id}.restricted_element_count == 0"
            - "Course.${course_id}.out_of_service_element_count == 0"
            - "Course.${course_id}.quarantined_equipment_count == 0"
            - "Course.${course_id}.rescue_ready_facilitator_count == 0"
            - "Course.${course_id}.rescue_readiness_ok == false"
            - "Course.${course_id}.next_professional_inspection_due_on == null"
            - "Course.${course_id}.at_risk_booking_count == 0"
            - "Course.${course_id}.daily_open_index == 0"
            - "Course.${course_id}.last_daily_open_date == null"
            - "Course.${course_id}.version == 1"

      - name: get_element_returns_stored_and_computed_lifecycle_fields
        claim_type: retrieval
        grounds:
          - entities.Element
          - endpoints["GET /challenge-course/elements/{element_id}"]
          - calculations.element_retirement_forecast
        distinguishing_aspect: "A read-back of a zero-usage GROUND_INITIATIVE element installed 2024-08-10 returns cycle_life_limit 43800, design_life_years 20, calendar and retirement forecast dates both 2044-08-10, retirement_basis CALENDAR and required_belay_set_count 0 — the projection branch for zero usage falls back to the calendar date rather than to today."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; one GROUND_INITIATIVE element with no usage history."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Nitro Crossing", element_type: "GROUND_INITIATIVE", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /challenge-course/elements/${g_id}"
              payload: {}
              as: ProgramDirector
              captures: { read_status: $.data.status, read_basis: $.data.retirement_basis }
          assert:
            - "http_status == 200"
            - "${read_status} == SERVICEABLE"
            - "${read_basis} == CALENDAR"
            - "Element.${g_id}.element_name == Nitro Crossing"
            - "Element.${g_id}.design_life_years == 20"
            - "Element.${g_id}.cycle_life_limit == 43800"
            - "Element.${g_id}.cumulative_cycle_count == 0"
            - "Element.${g_id}.calendar_life_forecast_date == 2044-08-10"
            - "Element.${g_id}.usage_life_forecast_date == 2044-08-10"
            - "Element.${g_id}.retirement_forecast_date == 2044-08-10"
            - "Element.${g_id}.required_belay_set_count == 0"
            - "Element.${g_id}.belay_ready == true"
            - "Element.${g_id}.consecutive_conditional_count == 0"
            - "Element.${g_id}.restricting_log_id == null"

      - name: list_elements_filtered_by_course_and_status_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints["GET /challenge-course/elements"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three SERVICEABLE elements on the course and limit 2, the list returns exactly 2 rows with total_count 3 and has_more true, and the status filter combines with the course filter rather than replacing it."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with three elements (ground initiative, low element, high element), all SERVICEABLE; a LEVEL_3 safety officer to read as."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Nitro Crossing", element_type: "GROUND_INITIATIVE", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Whale Watch", element_type: "LOW_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Pamper Pole", element_type: "HIGH_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 27.0, max_participant_weight_kg: 113.0 }
              as: ProgramDirector
          trigger:
            - call: "GET /challenge-course/elements"
              payload: { course_id: "${course_id}", status: "SERVICEABLE", limit: 2, offset: 0 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
          assert:
            - "http_status == 200"
            - "response.response_type == array"
            - "len(response.data) == 2"
            - "response.total_count == 3"
            - "response.has_more == true"
            - "response.limit == 2"
            - "response.offset == 0"

      - name: get_booking_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints["GET /challenge-course/bookings/{booking_id}"]
          - validations[priority=5]
          - errors.ERR_BOOKING_NOT_FOUND
        distinguishing_aspect: "A well-formed UUID that matches no Booking row answers ERR_BOOKING_NOT_FOUND at 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course exists so the database is non-empty, but no bookings have been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
          trigger:
            - call: "GET /challenge-course/bookings/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "http_status == 404"
            - "${err} == ERR_BOOKING_NOT_FOUND"
            - "response.response_type == error"

      - name: create_element_missing_required_element_type_rejected
        claim_type: required_fields
        grounds:
          - endpoints["POST /challenge-course/elements"]
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting element_type — an input field with no declared default — answers ERR_INVALID_REQUEST at 400 and persists no Element row."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Whale Watch", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "http_status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "Course.${course_id}.next_professional_inspection_due_on == null"

      - name: participant_created_before_packet_defaults_to_missing_health_form
        claim_type: defaults
        grounds:
          - entities.Participant.fields.health_form_status
          - calculations.participant_screening_status
          - calculations.booking_roster_status
        distinguishing_aspect: "A participant created without a screening packet defaults to health_form_status MISSING with agreement_signed false, which the screening calculation turns into screening_status BLOCKED and the roster calculation turns into booking roster_status BLOCKED."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; a PARTNER client; a DRAFT booking for 2026-09-15 with no participants yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { b_id: $.data.id, b_v0: $.data.version }
          trigger:
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Ada Lin", birth_date: "2013-05-10", weight_kg: 45.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { p1_id: $.data.id }
          assert:
            - "http_status == 201"
            - "Participant.${p1_id}.health_form_status == MISSING"
            - "Participant.${p1_id}.agreement_signed == false"
            - "Participant.${p1_id}.guardian_signature_provided == false"
            - "Participant.${p1_id}.medical_clearance_granted == false"
            - "Participant.${p1_id}.health_flags == []"
            - "Participant.${p1_id}.age_years == 13"
            - "Participant.${p1_id}.is_minor == true"
            - "Participant.${p1_id}.screening_status == BLOCKED"
            - "Booking.${b_id}.roster_status == BLOCKED"
            - "Booking.${b_id}.required_chaperone_count == 1"

      - name: facilitator_supervision_capacity_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Facilitator.fields.supervision_capacity
          - calculations.block_supervision_requirement
        distinguishing_aspect: "supervision_capacity is derived from certification_level (LEVEL_2 -> 12), so a client-supplied supervision_capacity of 99 is ignored rather than stored or rejected."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true, supervision_capacity: 99 }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
          assert:
            - "http_status == 201"
            - "Facilitator.${f1_id}.supervision_capacity == 12"
            - "Facilitator.${f1_id}.cert_status == PROBATION"
            - "Facilitator.${f1_id}.refresher_hours_24mo == 0"
            - "Facilitator.${f1_id}.rescue_drill_last_passed_on == null"

      - name: group_client_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.GroupClient
          - endpoints["POST /challenge-course/group-clients"]
        distinguishing_aspect: "id, created_at and version are server-generated: a client-supplied id and version are ignored, the returned id is a fresh server UUID and version is 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; empty client table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER", id: "11111111-1111-4111-8111-111111111111", version: 47 }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
          assert:
            - "http_status == 201"
            - "${gc_id} != 11111111-1111-4111-8111-111111111111"
            - "GroupClient.${gc_id}.version == 1"
            - "GroupClient.${gc_id}.payments_received_cents == 0"
            - "GroupClient.${gc_id}.credit_balance_cents == 0"
            - "GroupClient.${gc_id}.late_cancellation_count == 0"
            - "GroupClient.${gc_id}.created_at != null"

      - name: create_element_with_unknown_element_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Element.fields.element_type
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "element_type is a closed enum of five members, so ROPES_COURSE is refused with ERR_INVALID_REQUEST at 400 before any FK or business check runs."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Whale Watch", element_type: "ROPES_COURSE", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "http_status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: operational_inspection_log_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.OperationalInspectionLog
          - endpoints["GET /challenge-course/operational-logs/{log_id}"]
        distinguishing_aspect: "OperationalInspectionLog declares common_fields false, so a stored CLEAR log exposes id and created_at but no version and no updated_at, and §1.5 offers no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with an ACTIVE staff facilitator and a SERVICEABLE low element."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Whale Watch", element_type: "LOW_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { l_id: $.data.id }
            - call: "POST /challenge-course/operational-logs"
              payload: { element_id: "${l_id}", facilitator_id: "${f1_id}", log_date: "2026-08-10", result: "CLEAR" }
              as: Facilitator
              as_user_id: "${f1_id}"
              captures: { log_id: $.data.id }
          trigger:
            - call: "GET /challenge-course/operational-logs/${log_id}"
              payload: {}
              as: ProgramDirector
              captures: { read_result: $.data.result }
          assert:
            - "http_status == 200"
            - "${read_result} == CLEAR"
            - "OperationalInspectionLog.${log_id}.caused_restriction == false"
            - "OperationalInspectionLog.${log_id}.defect_note == \"\""
            - "OperationalInspectionLog.${log_id} has no version field"
            - "OperationalInspectionLog.${log_id} has no updated_at field"
            - "Element.${l_id}.last_clear_log_date == 2026-08-10"
            - "Element.${l_id}.status == SERVICEABLE"

      - name: create_belay_equipment_with_unknown_course_id_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BelayEquipment.fields.course_id
          - validations[priority=6]
          - errors.ERR_COURSE_NOT_FOUND
        distinguishing_aspect: "A body FK pointing at a non-existent Course answers ERR_COURSE_NOT_FOUND at 404 and stores no equipment row, distinguishing body-FK existence (priority 6) from path existence (priority 5)."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one real course and one LEVEL_3 safety officer, so the acting identity resolves even though the referenced course id does not."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/belay-equipment"
              payload: { course_id: "00000000-0000-4000-8000-0000000000ff", equipment_kind: "ROPE", serial_number: "RP-404", manufactured_on: "2022-06-01", max_cycles: 40000 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http_status == 404"
            - "${err} == ERR_COURSE_NOT_FOUND"
            - "Course.${course_id}.quarantined_equipment_count == 0"

      - name: program_block_rigging_element_from_another_course_rejects
        claim_type: flat
        grounds:
          - validations[priority=27]
          - errors.ERR_ELEMENT_COURSE_MISMATCH
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat-topology cross-reference integrity: the element exists and its type matches the block phase, but it belongs to a different course than the booking, so the create answers ERR_ELEMENT_COURSE_MISMATCH at 422."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; two courses, each with its own LOW_ELEMENT element; a PARTNER client; a DRAFT booking on course A already carrying an icebreaker block at sequence 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_a: $.data.id }
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Cedar Hollow Challenge Course", ems_response_minutes: 18, ems_access_note: "Paved lane; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_b: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_b}", element_name: "Wild Woosey", element_type: "LOW_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { lb_id: $.data.id }
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_a}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { b_id: $.data.id }
            - call: "POST /challenge-course/program-blocks"
