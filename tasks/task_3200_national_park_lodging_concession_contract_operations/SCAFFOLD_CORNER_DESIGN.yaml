  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_set_endpoint_drives_system_transitions
        claim_type: Computed read
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.OperatingSeason
        distinguishing_aspect: "Advancing the logical clock past a season's open_date flips the season PLANNED -> OPEN with no direct client call on the season — the clock endpoint is the declared driver of all time-based transitions; default clock reads 2026-09-01T00:00:00Z before any set."
        test_recipe:
          setup:
            - "Contract with a PLANNED season (open 2027-06-01). No clock set yet beyond the default."
          setup_api_calls:
            - &ck_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-110", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id }
            - &ck_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id, s_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:01Z" }
              as: SystemTestHarness
            - call: "GET /contracts/${c_id}/seasons/${s_id}"
              payload: {}
              as: ConcessionerOpsManager
              captures: { s_after: $.data.status }
          assert:
            - "s_status == PLANNED at creation (default clock 2026-09-01 is before open_date)"
            - "s_after == OPEN after the clock crosses open_date"

      - name: designate_successor_and_finalize_transfer_assets
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/contracts/{id}/finalize-transition
          - state_machines.Contract.TRANSITION_PENDING_to_CLOSED
        distinguishing_aspect: "The full recompetition action chain: initiate (with zero live projects and zero open incidents), designate a DRAFT successor, finalize — the old contract CLOSES, its APPROVED project becomes EXPENDED and an identical PROPOSED project appears on the successor, and the old service lines TERMINATE while four fresh AUTHORIZED lines appear on the successor."
        test_recipe:
          setup:
            - "ACTIVE contract C1 with season, four lines, and one APPROVED capital project (no live ones). Successor contract C2 in DRAFT. No receipts reports or statements pending."
          setup_api_calls:
            - *en_clock
            - &tr_c1
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-111", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c1: $.data.id }
            - &tr_l1
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
            - &tr_l2
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &tr_l3
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &tr_l4
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &tr_season
              call: "POST /contracts/${c1}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
            - &tr_act
              call: "POST /contracts/${c1}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &tr_proj
              call: "POST /contracts/${c1}/capital-projects"
              payload: { title: "Water main", asset_ref: "UTIL-9", authorized_cost_cents: 800000 }
              as: ConcessionerMaintenanceChief
              captures: { p1: $.data.id }
            - &tr_authz
              call: "POST /contracts/${c1}/capital-projects/${p1}/authorize"
              payload: {}
              as: AgencyContractingOfficer
            - &tr_complete
              call: "POST /contracts/${c1}/capital-projects/${p1}/complete"
              payload: { actual_cost_cents: 780000, in_service_month_offset: 3 }
              as: ConcessionerMaintenanceChief
            - &tr_approve
              call: "POST /contracts/${c1}/capital-projects/${p1}/approve"
              payload: {}
              as: AgencyContractingOfficer
            - &tr_c2
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-111R", term_months: 120, start_date: "2037-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 120, lsi_annual_schedule_type: "DECLINING_BALANCE", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c2: $.data.id }
            - &tr_init
              call: "POST /contracts/${c1}/initiate-transition"
              payload: {}
              as: AgencyContractingOfficer
            - &tr_desig
              call: "POST /contracts/${c1}/designate-successor"
              payload: { successor_contract_id: "${c2}" }
              as: AgencyContractingOfficer
          trigger:
            - call: "POST /contracts/${c1}/finalize-transition"
              payload: {}
              as: AgencyContractingOfficer
            - call: "GET /contracts/${c2}/capital-projects"
              payload: {}
              as: AgencyContractingOfficer
            - call: "GET /contracts/${c2}/service-lines"
              payload: {}
              as: AgencyContractingOfficer
          assert:
            - "Contract.${c1}.status == CLOSED and successor_contract_id == ${c2}"
            - "CapitalProject.${p1}.status == EXPENDED"
            - "the successor contract has exactly 1 capital project titled 'Water main' in PROPOSED with authorized_cost_cents 800000 and actual_cost_cents 0"
            - "the successor contract has 4 service lines all AUTHORIZED"
            - "GET /contracts/${c1}/service-lines shows all four lines TERMINATED"

      - name: fee_statement_issue_requires_accepted_reports
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/contracts/{id}/fee-statements
          - errors.ERR_NO_ACCEPTED_REPORTS
        distinguishing_aspect: "Issuing a statement for a period with only SUBMITTED (never ACCEPTED) reports is rejected 409 ERR_NO_ACCEPTED_REPORTS — the action is conditional on the reports' aggregate state."
        test_recipe:
          setup:
            - "ACTIVE contract; one LODGING report for 2027-07 in SUBMITTED (not accepted)."
          setup_api_calls:
            - *en_clock
            - *sp_contract
            - *sp_l1
            - *sp_l2
            - *sp_l3
            - *sp_l4
            - *sp_season
            - *sp_act
            - *sp_getc
            - *sp_rep
            - *sp_sub
          trigger:
            - call: "POST /contracts/${c_id}/fee-statements"
              payload: { period_month: "2027-07" }
              as: ConcessionerAccountant
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_NO_ACCEPTED_REPORTS"
            - "GET /contracts/${c_id}/fee-statements returns 0 rows"

