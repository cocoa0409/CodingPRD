              captures: { b_east_id: "$.data.id" }
            - call: "POST /fleet/relocation-orders"
              payload:
                trailer_id: "${tr1_id}"
                destination_branch_id: "${b_east_id}"
                planned_depart_date: "2026-09-10"
                planned_arrive_date: "2026-09-12"
                planned_miles: 430
              as: BranchManager
              as_user_id: "${b_west_id}"
              captures: { ro1_id: "$.data.id" }
            - call: "POST /fleet/relocation-orders/${ro1_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "${b_east_id}"
          trigger:
            - call: "POST /fleet/relocation-orders/${ro1_id}/complete"
              payload:
                actual_miles: 520
                deadhead_miles: 45
                actual_arrive_date: "2026-09-13"
              as: BranchManager
              as_user_id: "${b_east_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_RELOCATION_NOT_IN_TRANSIT"
            - "RelocationOrder.${ro1_id}.status == APPROVED"
            - "RelocationOrder.${ro1_id}.actual_cost_cents == null"
            - "Trailer.${tr1_id}.current_branch_id == ${b_west_id}"
            - "Branch.${b_west_id}.on_hand_count == 1"
