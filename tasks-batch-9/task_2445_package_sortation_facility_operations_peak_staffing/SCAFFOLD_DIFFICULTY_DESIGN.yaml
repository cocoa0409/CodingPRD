      - name: no_show_cascade_flex_topup_returns_plan_to_approved
        grounds:
          - state_machines.StaffAssignment.ASSIGNED_to_NO_SHOW
          - state_machines.ShiftPlan.APPROVED_to_AT_RISK
          - state_machines.ShiftPlan.AT_RISK_to_APPROVED
          - calculations.staffing_commitment_and_gap
          - calculations.flex_pool_conservation_invariant
        distinguishing_aspect: |
          A different trigger and a different chain from the jam cascade: one no-show call runs
          L1 assignment -> L2 worker risk -> L3 plan commitment/gap -> L4 plan APPROVED -> AT_RISK ->
          L5 center flex pool top-up draw -> L6 plan AT_RISK -> APPROVED, so the plan visits and
          leaves AT_RISK inside a single request and the center's flex pool absorbs the shortfall.
        test_recipe:
          setup:
            - "Center SC1 with automation 70 and flex_pool_total 3 (a deliberately thin pool), one chute C1"
            - "ShiftPlan 2026-08-03 06:00-14:00, forecast_volume 4000, planned_core_headcount 4, planned_seasonal_headcount 0, labor_budget_cents 100000, approved with required_headcount 4 and flex_draw_count 0 (the core plan already covered the requirement)"
            - "One CORE worker hired 2026-08-01 (tenure_days 2), status CLEARED, with one StaffAssignment in status ASSIGNED on C1"
            - "Logical clock 2026-08-03T06:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 3 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Core Casey", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
            - call: "POST /sortation/workers/${w_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w_id}/onboarding-events"
              payload: { event_type: "BACKGROUND_CLEARED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${w_id}", line_chute_id: "${chute1_id}", role_on_line: "PRIMARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /sortation/staff-assignments/${sa_id}/no-show"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
          assert:
            - "L1: StaffAssignment.${sa_id}.status == NO_SHOW and Worker.${w_id}.no_show_count == 1"
            - "L2: Worker.${w_id}.attrition_risk_score == 0.4200 with attrition_risk_basis == COHORT_BASELINE and attrition_flagged == false (the no-show is recorded but the cohort variant ignores it)"
            - "L3: ShiftPlan.${plan_id}.committed_headcount == 4 and staffing_gap == 0 after the L5 top-up (it dipped to committed 3, gap 1 between L3 and L5)"
            - "L4 and L6: ShiftPlan.${plan_id}.status == APPROVED again at the end of the request, having passed through AT_RISK, with unfilled_gap == 0"
            - "L5: ShiftPlan.${plan_id}.flex_draw_count == 1 (topped up from 0) and SortCenter.${center_id}.flex_pool_available == 2, flex_pool_reserved == 1"
            - "flex_pool_total 3 == flex_pool_available 2 + flex_pool_reserved 1, and flex_pool_reserved equals the sum of flex_draw_count over the center's APPROVED plans"
            - "SortCenter.${center_id}.version is strictly greater after the trigger than the value captured before the approve"

  # =====================================================================
  # Rule 5 - priority conflicts between different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: load_state_beats_center_frozen_on_redispatch
        grounds:
          - validations.16_ERR_INVALID_LOAD_STATE
          - validations.22_ERR_CENTER_FROZEN
          - state_machines.SortCenter.OPEN_to_FROZEN
          - errors.ERR_INVALID_LOAD_STATE
        distinguishing_aspect: |
          Category pair state (priority 16) versus business_safety (priority 22): an already dispatched
          load at a center that a SERIOUS injury has frozen violates both rules, and the lower priority
          number must win, so the caller sees ERR_INVALID_LOAD_STATE (409) rather than
          ERR_CENTER_FROZEN (409) even though the frozen posture is the more dramatic condition.
        test_recipe:
          setup:
            - "Center SC1 (automation 70) with inbound door IN-1, outbound door OUT-1, chute C1 and lane L-WEST assigned to C1 for 06:00-14:00"
            - "A trailer with manifest_package_count 3000 unloaded, an outbound load scanned with 100 SMALL, closed, sealed and DISPATCHED at 06:00"
            - "A worker at SC1 and an OPEN InjuryReport with severity SERIOUS filed afterwards, so SortCenter.ops_posture == FROZEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute1_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute1_v}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane1_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 1000, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 100 }
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/close-load"
              payload: {}
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/seal"
              payload: { seal_code: "SEAL-A" }
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/dispatch"
              payload: {}
              as: OpsManager
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Core Casey", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
            - call: "POST /sortation/injury-reports"
              payload: { sort_center_id: "${center_id}", worker_id: "${w_id}", severity: "SERIOUS", body_part: "SHOULDER", occurred_at: "2026-08-03T06:00:00Z" }
              as: SortSupervisor
              captures: { injury_id: $.data.id }
          trigger:
            - call: "POST /sortation/outbound-loads/${load_id}/dispatch"
