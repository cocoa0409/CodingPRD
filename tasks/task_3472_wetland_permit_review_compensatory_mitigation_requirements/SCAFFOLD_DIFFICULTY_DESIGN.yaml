            - { call: "POST /wetland-permits/credit-transactions/${txn3}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { unit3: "$.data.price_per_credit_dollars", total3: "$.data.total_price_dollars" } }
          assert:
