# =============================================================================
# Commissary & Shared Production Kitchen — Scaffold seed tables (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Commissary & Shared Production Kitchen: shared-kitchen scheduling & member
  billing, recipe/BOM & batch production, prep list & food-cost, storage
  (dry/cold) assignment, health-code & temp log, ingredient ordering, allergen
  control, event packout.

domain_name: commissary-shared-production-kitchen
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (no deep URL nesting). Members,
  # Stations, StorageUnits, Ingredients are independent roots; Bookings,
  # StorageAssignments, Recipes, ProductionBatches, EventPackouts,
  # IngredientOrders, Invoices and TempLogs reference them by FK.

  state_machine_shape: branching
  # Booking has fork/revert (CONFIRMED → CANCELLED with refund branch);
  # ProductionBatch is branching (PLANNED → IN_PRODUCTION → {COMPLETED, SCRAPPED});
  # Recipe is cyclic (DRAFT ↔ PUBLISHED via revision loop creating a new version);
  # StorageUnit is compound/posture (compliance_status derived from TempLog stream).

  relationship_patterns:
    - one_to_many        # Member → Bookings, Recipe → RecipeComponents
    - many_to_many       # RecipeComponent junction between Recipe and Ingredient
    - cross_aggregate    # EventPackout references ProductionBatches across members

  role_model: peer_roles
  # MemberOperator owns its own Members/Bookings/Recipes/Batches/Packouts.
  # FacilityManager owns Stations, StorageUnits, Ingredients, Invoices and
  # health-code overrides. ComplianceOfficer owns TempLog certification and
  # quarantine release. Anonymous handles member registration only.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Registered food-business name" }
      - { name: email, type: string, source: input, description: "Login email; unique across Members" }
      - { name: plan_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | PREMIUM; PREMIUM unlocks PEAK booking access and 5% storage discount" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; starts ACTIVE on registration" }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Read-only prepaid balance in cents; starts at 0; debited by booking/production charges, credited by top-ups and refunds" }
      - { name: lifetime_loaded_cents, type: integer, source: computed, description: "Read-only running total of all top-up amounts ever loaded; conserved quantity anchor" }
      - { name: lifetime_charged_cents, type: integer, source: computed, description: "Read-only running total of all charges net of refunds; wallet_balance_cents == lifetime_loaded_cents - lifetime_charged_cents" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station label (e.g., Prep Table 3)" }
      - { name: station_class, type: enum, source: input, description: "PREP_TABLE | CONVECTION_OVEN | BLAST_CHILLER; selects hourly rate" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 30, description: "Cleaning buffer required between two members' bookings on this station" }
      - { name: status, type: enum, source: input, default: "OPEN", description: "OPEN | OUT_OF_SERVICE; OUT_OF_SERVICE blocks new bookings" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the renting member" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the reserved station" }
      - { name: start_utc, type: datetime, source: input, description: "Half-open interval start [start_utc, end_utc); ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Interval end (exclusive); must be > start_utc" }
      - { name: is_peak, type: boolean, source: computed, description: "Read-only; true when start_utc local hour is within PEAK window 06:00–10:00 inclusive-exclusive" }
      - { name: turnover_applied, type: boolean, source: computed, description: "Read-only; true when an adjacent booking on the same station sits within turnover_buffer_minutes, triggering cleaning surcharge" }
      - { name: fee_cents, type: integer, source: computed, description: "Read-only computed booking fee (see calc booking_fee); held against member wallet at confirmation" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CANCELLED | COMPLETED; CONFIRMED on create, CANCELLED refunds, COMPLETED is terminal post end_utc" }

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unit label (e.g., Walk-in Cooler A)" }
      - { name: temp_class, type: enum, source: input, description: "DRY | COLD | FROZEN; must match assignment temp_class" }
      - { name: total_slots, type: integer, source: input, description: "Total shelf slots; allocation capacity" }
      - { name: used_slots, type: integer, source: computed, description: "Read-only sum of requested_slots over ACTIVE StorageAssignments in this unit; conserved against assignments" }
      - { name: temp_min_c, type: number, source: input, description: "Health-code minimum safe temperature in Celsius (inclusive)" }
      - { name: temp_max_c, type: number, source: input, description: "Health-code maximum safe temperature in Celsius (inclusive)" }
      - { name: compliance_status, type: enum, source: computed, description: "Read-only COMPLIANT | EXCURSION | QUARANTINED derived from TempLog stream; starts COMPLIANT" }
      - { name: excursion_minutes, type: integer, source: computed, description: "Read-only cumulative minutes of the current consecutive out-of-range run; resets to 0 on an in-range reading" }

  - name: StorageAssignment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member renting storage" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; the unit primarily allocated (first unit in the waterfall plan)" }
      - { name: temp_class, type: enum, source: input, description: "DRY | COLD | FROZEN; must match candidate units' temp_class" }
      - { name: requested_slots, type: integer, source: input, description: "Number of shelf slots requested; must be >= 1" }
      - { name: allocation_plan, type: array, source: computed, description: "Read-only ordered list of {storage_unit_id, slots} produced by waterfall_allocation across same-class units by created_at ASC" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "Read-only monthly storage fee (see calc storage_fee); rolls into invoices" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | QUARANTINED; ACTIVE on create, RELEASED frees slots, QUARANTINED on unit excursion breach" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Ingredient name (e.g., Almond Flour)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Current cost per base unit in cents; updated by IngredientOrder receipt" }
      - { name: on_hand_qty, type: number, source: computed, description: "Read-only quantity in stock; increased by received orders, decreased by completed batches" }
      - { name: allergen_tags, type: array, source: input, default: [], description: "Allergen codes carried, e.g. [PEANUT, MILK, GLUTEN, SOY, EGG]" }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: name, type: string, source: input, description: "Recipe name" }
      - { name: version, type: integer, source: system, description: "Recipe revision number; a revision publishes a new version while DRAFT loops back (cyclic)" }
      - { name: batch_yield_units, type: integer, source: input, description: "Expected finished units produced per standard batch; must be >= 1" }
      - { name: allergen_tags, type: array, source: computed, description: "Read-only union of allergen_tags over all linked Ingredients via RecipeComponents" }
      - { name: estimated_food_cost_cents, type: integer, source: computed, description: "Read-only BOM cost at PUBLISH using planned quantities (see calc estimated_food_cost)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED; DRAFT on create, cyclic DRAFT↔PUBLISHED via revise/publish, RETIRED terminal" }

  - name: RecipeComponent
    parent: null
    common_fields: false
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; owning recipe" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; the BOM line ingredient" }
      - { name: planned_qty, type: number, source: input, description: "Planned quantity of this ingredient per batch in base units; must be > 0" }

  - name: ProductionBatch
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member running the batch" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; the recipe being produced (must be PUBLISHED)" }
      - { name: recipe_version_pinned, type: integer, source: system, description: "Recipe.version captured at batch start; locks the BOM against later recipe revisions" }
      - { name: planned_yield_units, type: integer, source: input, description: "Planned number of finished units; must be >= 1" }
      - { name: actual_yield_units, type: integer, source: computed, description: "Read-only actual finished units recorded at completion; null until COMPLETED" }
      - { name: estimated_food_cost_cents, type: integer, source: computed, description: "Read-only estimated total food cost captured at start from pinned BOM (round-per-line-then-sum)" }
      - { name: actual_food_cost_cents, type: integer, source: computed, description: "Read-only actual food cost at completion incl. spoilage (see calc actual_food_cost); null until COMPLETED" }
      - { name: production_fee_cents, type: integer, source: computed, description: "Read-only facility production fee charged to wallet at completion (see calc production_fee)" }
      - { name: actual_components, type: array, source: input, default: [], description: "At completion: list of {ingredient_id, actual_qty} consumed; defaults to planned if omitted" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_PRODUCTION | COMPLETED | SCRAPPED; branching at IN_PRODUCTION → {COMPLETED, SCRAPPED}" }

  - name: TempLog
    parent: null
    common_fields: false
    fields:
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; the logged unit" }
      - { name: reading_c, type: number, source: input, description: "Temperature reading in Celsius" }
      - { name: reading_utc, type: datetime, source: input, description: "ISO 8601 UTC timestamp of the reading; readings processed in chronological order" }
      - { name: in_range, type: boolean, source: computed, description: "Read-only true when temp_min_c <= reading_c <= temp_max_c (both inclusive)" }
      - { name: certified, type: boolean, source: computed, description: "Read-only true once a ComplianceOfficer certifies this reading; default false" }

  - name: IngredientOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the ordering member" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; ingredient being replenished" }
      - { name: order_qty, type: number, source: input, description: "Quantity ordered in base units; must be > 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Quoted cost per base unit for this order" }
      - { name: status, type: enum, source: system, description: "PLACED | RECEIVED | CANCELLED; RECEIVED updates Ingredient on_hand_qty and unit_cost_cents" }

  - name: EventPackout
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member packing the event" }
      - { name: event_name, type: string, source: input, description: "Catering event label" }
      - { name: batch_ids, type: array, source: input, description: "List of ProductionBatch ids (must be COMPLETED) to pack" }
      - { name: allergen_free_required, type: array, source: input, default: [], description: "Allergen codes the event must be free of; gate against packed recipes' allergen union" }
      - { name: combined_allergen_tags, type: array, source: computed, description: "Read-only union of allergen_tags over the packed batches' recipes" }
      - { name: packed_unit_count, type: integer, source: computed, description: "Read-only sum of actual_yield_units over packed COMPLETED batches" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED | SHIPPED; SEALED runs allergen gate, SHIPPED terminal" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; billed member" }
      - { name: period_start_utc, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end_utc, type: datetime, source: input, description: "Billing period end (exclusive); must be > period_start_utc" }
      - { name: booking_subtotal_cents, type: integer, source: computed, description: "Read-only sum of fee_cents over the member's COMPLETED bookings whose end_utc in [period_start_utc, period_end_utc)" }
      - { name: storage_subtotal_cents, type: integer, source: computed, description: "Read-only sum of monthly_fee_cents over the member's ACTIVE StorageAssignments at generation time" }
      - { name: production_subtotal_cents, type: integer, source: computed, description: "Read-only sum of production_fee_cents over the member's COMPLETED batches in the period" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only booking_subtotal + storage_subtotal + production_subtotal" }
      - { name: loyalty_discount_cents, type: integer, source: computed, description: "Read-only tiered discount keyed on subtotal tier (see calc invoice_total)" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Read-only 3% facility fee on subtotal (pre-discount)" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only subtotal - loyalty_discount + platform_fee" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID; ISSUED locks the figures, PAID debits wallet" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/suspend"
        actor: FacilityManager
        preconditions:
          - "Member.status == ACTIVE (else ERR_INVALID_STATE)"
          - "expected_member_version matches Member.version (else ERR_STALE_VERSION)"
        side_effects:
          - "increments Member.version by 1"
        note: "SUSPENDED members cannot create bookings, batches, or storage assignments (cross-entity gate)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate"
        actor: FacilityManager
        preconditions:
          - "Member.status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Member.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /members/{id}/close"
        actor: FacilityManager
        preconditions:
          - "Member has no ACTIVE StorageAssignments (else ERR_MEMBER_HAS_OPEN_OBLIGATIONS)"
          - "Member has no CONFIRMED future Bookings (else ERR_MEMBER_HAS_OPEN_OBLIGATIONS)"
        side_effects:
          - "increments Member.version by 1"

  - entity: Booking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: (none)
        to: CONFIRMED
        trigger: "POST /members/{id}/bookings"
        actor: MemberOperator
        preconditions:
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "Station.status == OPEN (else ERR_STATION_OUT_OF_SERVICE)"
          - "end_utc > start_utc (else ERR_INVALID_INTERVAL)"
          - "is_peak interval requires Member.plan_tier == PREMIUM (else ERR_PEAK_REQUIRES_PREMIUM)"
          - "No existing CONFIRMED/COMPLETED booking on the same station whose [start,end) plus turnover_buffer_minutes overlaps this one (else ERR_BOOKING_OVERLAP)"
          - "Member.wallet_balance_cents >= computed fee_cents (else ERR_INSUFFICIENT_WALLET)"
        side_effects:
          - "compute is_peak, turnover_applied, fee_cents"
          - "debit Member.wallet_balance_cents by fee_cents; increment Member.lifetime_charged_cents by fee_cents"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /members/{id}/bookings/{bid}/cancel"
        actor: MemberOperator
        preconditions:
          - "Booking.status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "credit Member.wallet_balance_cents by fee_cents; decrement Member.lifetime_charged_cents by fee_cents (compensating: wallet conservation invariant restored)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /members/{id}/bookings/{bid}/complete"
        actor: MemberOperator
        preconditions:
          - "Booking.status == CONFIRMED (else ERR_INVALID_STATE)"
        side_effects:
          - "fee_cents stays charged; booking becomes invoiceable"

  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /members/{id}/recipes/{rid}/publish"
        actor: MemberOperator
        preconditions:
          - "Recipe.status == DRAFT (else ERR_INVALID_STATE)"
          - "Recipe has >= 1 RecipeComponent (else ERR_RECIPE_EMPTY)"
        side_effects:
          - "compute allergen_tags = union of component ingredients' allergen_tags"
          - "compute estimated_food_cost_cents from planned quantities"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /members/{id}/recipes/{rid}/revise"
        actor: MemberOperator
        preconditions:
          - "Recipe.status == PUBLISHED (else ERR_INVALID_STATE)"
          - "No IN_PRODUCTION ProductionBatch pins this recipe_version (else ERR_RECIPE_IN_USE)"
        side_effects:
          - "increment Recipe.version by 1 (cyclic revision loop)"
        note: "Cyclic: a recipe may loop DRAFT→PUBLISHED→DRAFT repeatedly, each revise bumps version."
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /members/{id}/recipes/{rid}/retire"
        actor: MemberOperator
        preconditions:
          - "Recipe.status == PUBLISHED (else ERR_INVALID_STATE)"
          - "No PLANNED or IN_PRODUCTION ProductionBatch references this recipe (else ERR_RECIPE_IN_USE)"
        side_effects: []

  - entity: ProductionBatch
    initial_state: PLANNED
    terminal_states: [COMPLETED, SCRAPPED]
    transitions:
      - from: (none)
        to: PLANNED
        trigger: "POST /members/{id}/batches"
        actor: MemberOperator
        preconditions:
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "Recipe.status == PUBLISHED (else ERR_RECIPE_NOT_PUBLISHED)"
          - "planned_yield_units >= 1 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "pin recipe_version_pinned = Recipe.version"
          - "compute estimated_food_cost_cents from pinned BOM"
      - from: PLANNED
        to: IN_PRODUCTION
        trigger: "POST /members/{id}/batches/{bid}/start"
        actor: MemberOperator
        preconditions:
          - "ProductionBatch.status == PLANNED (else ERR_INVALID_STATE)"
          - "For each RecipeComponent, Ingredient.on_hand_qty >= planned_qty * (planned_yield_units / Recipe.batch_yield_units) (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "Recipe is now pinned-in-use, blocking revise of that version"
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /members/{id}/batches/{bid}/complete"
        actor: MemberOperator
        preconditions:
          - "ProductionBatch.status == IN_PRODUCTION (else ERR_INVALID_STATE)"
          - "actual_yield_units >= 1 (else ERR_INVALID_REQUEST)"
          - "Member.wallet_balance_cents >= computed production_fee_cents (else ERR_INSUFFICIENT_WALLET)"
        side_effects:
          - "compute actual_food_cost_cents from actual_components incl. spoilage"
          - "compute production_fee_cents; debit Member.wallet_balance_cents; increment Member.lifetime_charged_cents"
          - "decrement each Ingredient.on_hand_qty by consumed actual_qty (cascade across BOM ingredients)"
      - from: IN_PRODUCTION
        to: SCRAPPED
        trigger: "POST /members/{id}/batches/{bid}/scrap"
        actor: MemberOperator
        preconditions:
          - "ProductionBatch.status == IN_PRODUCTION (else ERR_INVALID_STATE)"
        side_effects:
          - "no wallet charge; no ingredient consumption; batch becomes terminal"
      - from: PLANNED
        to: SCRAPPED
        trigger: "POST /members/{id}/batches/{bid}/scrap"
        actor: MemberOperator
        preconditions:
          - "ProductionBatch.status == PLANNED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: StorageAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /members/{id}/storage-assignments"
        actor: MemberOperator
        preconditions:
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "requested_slots >= 1 (else ERR_INVALID_REQUEST)"
          - "Aggregate free slots across same temp_class units >= requested_slots (else ERR_STORAGE_CAPACITY_EXCEEDED)"
          - "No same-class unit is QUARANTINED among the units the waterfall plan would touch (else ERR_UNIT_QUARANTINED)"
        side_effects:
          - "compute allocation_plan via waterfall_allocation (units by created_at ASC)"
          - "increment each touched StorageUnit.used_slots by its allocated slots (cascade)"
          - "compute monthly_fee_cents"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /members/{id}/storage-assignments/{sid}/release"
        actor: MemberOperator
        preconditions:
          - "StorageAssignment.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "decrement each touched StorageUnit.used_slots by its allocated slots (compensating: slot conservation invariant restored)"
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system (cascade from StorageUnit excursion breach passing 120-minute threshold)"
        actor: system
        preconditions:
          - "A StorageUnit in this assignment's allocation_plan transitioned to QUARANTINED"
        side_effects:
          - "assignment marked QUARANTINED; slots remain held (not freed) pending compliance release"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /members/{id}/storage-assignments/{sid}/release-quarantine"
        actor: ComplianceOfficer
        preconditions:
          - "StorageAssignment.status == QUARANTINED (else ERR_INVALID_STATE)"
          - "The underlying StorageUnit.compliance_status == COMPLIANT (else ERR_UNIT_QUARANTINED)"
        side_effects:
          - "assignment returns to ACTIVE"

  - entity: StorageUnit
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: EXCURSION
        trigger: "system (first out-of-range TempLog reading recorded chronologically)"
        actor: system
        preconditions:
          - "An incoming TempLog reading has in_range == false"
        side_effects:
          - "start excursion_minutes accumulation from this reading"
      - from: EXCURSION
        to: COMPLIANT
        trigger: "system (an in-range TempLog reading recorded chronologically)"
        actor: system
        preconditions:
          - "An incoming TempLog reading has in_range == true and excursion_minutes <= 120"
        side_effects:
          - "reset excursion_minutes to 0"
      - from: EXCURSION
        to: QUARANTINED
        trigger: "system (cumulative excursion_minutes strictly exceeds 120 across consecutive out-of-range readings)"
        actor: system
        preconditions:
          - "excursion_minutes > 120 (strict)"
        side_effects:
          - "cascade: all ACTIVE StorageAssignments touching this unit → QUARANTINED"
      - from: QUARANTINED
        to: COMPLIANT
        trigger: "POST /storage-units/{id}/certify-compliant"
        actor: ComplianceOfficer
        preconditions:
          - "StorageUnit.compliance_status == QUARANTINED (else ERR_INVALID_STATE)"
          - "The latest TempLog reading for this unit has in_range == true (else ERR_UNIT_NOT_RECOVERED)"
        side_effects:
          - "reset excursion_minutes to 0; unit returns to COMPLIANT"

  - entity: IngredientOrder
    initial_state: PLACED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: (none)
        to: PLACED
        trigger: "POST /members/{id}/ingredient-orders"
        actor: MemberOperator
        preconditions:
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "order_qty > 0 (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: PLACED
        to: RECEIVED
        trigger: "POST /members/{id}/ingredient-orders/{oid}/receive"
        actor: MemberOperator
        preconditions:
          - "IngredientOrder.status == PLACED (else ERR_INVALID_STATE)"
        side_effects:
          - "increment Ingredient.on_hand_qty by order_qty (cross-entity)"
          - "set Ingredient.unit_cost_cents = order's unit_cost_cents"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /members/{id}/ingredient-orders/{oid}/cancel"
        actor: MemberOperator
        preconditions:
          - "IngredientOrder.status == PLACED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: EventPackout
    initial_state: DRAFT
    terminal_states: [SHIPPED]
    transitions:
      - from: (none)
        to: DRAFT
        trigger: "POST /members/{id}/packouts"
        actor: MemberOperator
        preconditions:
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "Every batch_id references a COMPLETED ProductionBatch owned by this member (else ERR_BATCH_NOT_COMPLETED)"
        side_effects:
          - "compute combined_allergen_tags and packed_unit_count over packed batches"
      - from: DRAFT
        to: SEALED
        trigger: "POST /members/{id}/packouts/{pid}/seal"
        actor: MemberOperator
        preconditions:
          - "EventPackout.status == DRAFT (else ERR_INVALID_STATE)"
          - "combined_allergen_tags ∩ allergen_free_required == ∅ (else ERR_ALLERGEN_CONFLICT)"
        side_effects:
          - "packout figures locked"
      - from: SEALED
        to: SHIPPED
        trigger: "POST /members/{id}/packouts/{pid}/ship"
        actor: MemberOperator
        preconditions:
          - "EventPackout.status == SEALED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: (none)
        to: DRAFT
        trigger: "POST /members/{id}/invoices"
        actor: FacilityManager
        preconditions:
          - "period_end_utc > period_start_utc (else ERR_INVALID_INTERVAL)"
        side_effects:
          - "compute booking_subtotal, storage_subtotal, production_subtotal, subtotal, loyalty_discount, platform_fee, total"
      - from: DRAFT
        to: ISSUED
        trigger: "POST /members/{id}/invoices/{iid}/issue"
        actor: FacilityManager
        preconditions:
          - "Invoice.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "figures locked (no recompute)"
      - from: ISSUED
        to: PAID
        trigger: "POST /members/{id}/invoices/{iid}/pay"
        actor: FacilityManager
        preconditions:
          - "Invoice.status == ISSUED (else ERR_INVALID_STATE)"
          - "Member.wallet_balance_cents >= total_cents (else ERR_INSUFFICIENT_WALLET)"
        side_effects:
          - "debit Member.wallet_balance_cents by total_cents; increment Member.lifetime_charged_cents by total_cents"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — narrow, per filter)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{id}/bookings"
    occ_field: "expected_member_version"
    description: |
      Creating a Booking against a Member whose version has advanced since the
      client last observed it is rejected. A booking debits the member wallet and
      bumps Member.version; a writer holding a stale member view (e.g. another
      booking or top-up already advanced it) is rejected so wallet debits cannot
      be computed against an out-of-date balance.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: storage-assign-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{id}/storage-assignments"
    occ_field: "expected_member_version"
    description: |
      Creating a StorageAssignment against a Member whose version is stale is
      rejected. Storage capacity claims commit slots against the member's standing
      obligations; a stale member view means an intervening close/suspend or other
      assignment may have changed eligibility, so the claim is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_fee
    trigger: "On POST /members/{id}/bookings (Booking → CONFIRMED)"
    algorithm: tiered_pricing
    formula: |
      rate = RATE_BY_CLASS[station.station_class]            # cents per hour
      mult = PEAK_MULT if booking.is_peak else OFFPEAK_MULT
      base = rate * (duration_minutes / 60) * mult
      base_cents = round_half_up(base)                       # round the scaled base to whole cents
      fee_cents = base_cents + (CLEANING_SURCHARGE if turnover_applied else 0)
      # is_peak: true iff start_utc local hour in [06, 10)
      # turnover_applied: true iff any CONFIRMED/COMPLETED booking on same station
      #   has [s,e) within turnover_buffer_minutes of this [start,end) (abutment buffer)
    input_set: "Single Booking being created; station_class and turnover_buffer_minutes from its Station; adjacency scan over CONFIRMED/COMPLETED bookings on that station."
    constants:
      RATE_BY_CLASS: { PREP_TABLE: 1200, CONVECTION_OVEN: 3000, BLAST_CHILLER: 2500 }
      PEAK_MULT: 1.5
      OFFPEAK_MULT: 1.0
      CLEANING_SURCHARGE: 800
      PEAK_WINDOW_LOCAL: "[06:00, 10:00)"
    precision: "Whole cents; round_half_up applied once to the scaled base before adding the flat surcharge."

  - name: estimated_food_cost
    trigger: "On POST /members/{id}/recipes/{rid}/publish AND captured onto ProductionBatch at POST /members/{id}/batches"
    algorithm: aggregation
    formula: |
      # ROUND-PER-LINE-THEN-SUM (pinned order — this is the canonical estimate)
      scale = batch.planned_yield_units / recipe.batch_yield_units   # 1.0 at recipe publish
      total = 0
      for comp in recipe.components (ordered by RecipeComponent.created insertion, irrelevant to sum):
        line_qty = comp.planned_qty * scale
        line_cents = round_half_up(line_qty * ingredient.unit_cost_cents)
        total += line_cents
      estimated_food_cost_cents = total
    input_set: "All RecipeComponents of the recipe; for ProductionBatch the scale factor applies; at recipe PUBLISH scale = 1."
    constants: {}
    precision: "Per-line round_half_up to whole cents, THEN sum. Order pinned: rounding before summation (sum-then-round would differ)."
    variants:
      - name: recipe_publish_estimate
        when: "At recipe PUBLISH"
        difference: "scale = 1.0; cost reflects one standard batch."
      - name: batch_plan_estimate
        when: "At ProductionBatch creation (PLANNED)"
        difference: "scale = planned_yield_units / recipe.batch_yield_units; uses pinned recipe version BOM."

  - name: actual_food_cost
    trigger: "On POST /members/{id}/batches/{bid}/complete (ProductionBatch → COMPLETED)"
    algorithm: aggregation
    formula: |
      # ROUND-PER-LINE-THEN-SUM on ACTUAL consumed quantities, then add spoilage
      base = 0
      for line in actual_components (defaulting omitted ingredients to scaled planned_qty):
        line_cents = round_half_up(line.actual_qty * ingredient.unit_cost_cents)
        base += line_cents
      spoilage_cents = round_half_up(base * SPOILAGE_PCT)
      actual_food_cost_cents = base + spoilage_cents
      cost_per_unit_cents = round_half_up(actual_food_cost_cents / actual_yield_units)
    input_set: "actual_components on the completing batch; ingredient unit_cost_cents at completion time (may differ from estimate if an order was received between PLAN and COMPLETE)."
    constants:
      SPOILAGE_PCT: 0.05
    precision: "Per-line round_half_up, sum, then spoilage round_half_up; cost_per_unit round_half_up."
    variants:
      - name: estimated_vs_actual_divergence
        when: "Compared against estimated_food_cost_cents captured at PLAN"
        difference: "Actual uses actual_qty and possibly updated unit_cost (post-order-receipt), plus a 5% spoilage adder absent from the estimate — same-entity dual figure for reconciliation, distinct from the production fee variant."

  - name: production_fee
    trigger: "On POST /members/{id}/batches/{bid}/complete (ProductionBatch → COMPLETED)"
    algorithm: threshold
    formula: |
      base_fee = actual_yield_units * FACILITY_FEE_PER_UNIT
      # volume rebate threshold: large runs get a flat rebate
      rebate = VOLUME_REBATE if actual_yield_units >= VOLUME_THRESHOLD else 0
      production_fee_cents = max(0, base_fee - rebate)
    input_set: "Single completing ProductionBatch."
    constants:
      FACILITY_FEE_PER_UNIT: 35
      VOLUME_THRESHOLD: 100
      VOLUME_REBATE: 500
    precision: "Whole cents; max() floors at 0."

  - name: storage_fee
    trigger: "On POST /members/{id}/storage-assignments (StorageAssignment → ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      rate = SLOT_RATE_BY_CLASS[assignment.temp_class]      # cents per slot per month
      gross = requested_slots * rate
      discount_pct = PREMIUM_STORAGE_DISCOUNT if member.plan_tier == PREMIUM else 0
      discount = round_half_up(gross * discount_pct)
      monthly_fee_cents = gross - discount
    input_set: "Single StorageAssignment; member.plan_tier for discount."
    constants:
      SLOT_RATE_BY_CLASS: { DRY: 400, COLD: 700, FROZEN: 900 }
      PREMIUM_STORAGE_DISCOUNT: 0.05
    precision: "Whole cents; discount round_half_up."

  - name: storage_allocation
    trigger: "On POST /members/{id}/storage-assignments (StorageAssignment → ACTIVE)"
    algorithm: waterfall_allocation
    formula: |
      candidates = StorageUnits where temp_class == assignment.temp_class
                   AND compliance_status != QUARANTINED, ordered by created_at ASC
      remaining = requested_slots
      plan = []
      for unit in candidates:
        avail = unit.total_slots - unit.used_slots
        take = min(avail, remaining)
        if take > 0:
          plan.append({storage_unit_id: unit.id, slots: take})
          remaining -= take
        if remaining == 0: break
      if remaining > 0: reject ERR_STORAGE_CAPACITY_EXCEEDED   # no partial allocation
      allocation_plan = plan
      storage_unit_id = plan[0].storage_unit_id               # primary unit
    input_set: "Same-class non-quarantined StorageUnits; tie-break/order strictly created_at ASC (never id)."
    constants: {}
    precision: "Integer slots; earliest-created unit fills first; remainder overflows to next."

  - name: invoice_total
    trigger: "On POST /members/{id}/invoices (Invoice → DRAFT)"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order resolves the circular-looking discount/fee dependency:
      booking_subtotal = sum(b.fee_cents for COMPLETED Booking b of member
                             where period_start <= b.end_utc < period_end)
      storage_subtotal = sum(a.monthly_fee_cents for ACTIVE StorageAssignment a of member at generation)
      production_subtotal = sum(p.production_fee_cents for COMPLETED ProductionBatch p of member
                               where period_start <= p.updated_at < period_end)
      subtotal = booking_subtotal + storage_subtotal + production_subtotal
      # discount keyed on the subtotal TIER (computed FIRST, on subtotal)
      if subtotal >= 50000: disc_pct = 0.10
      elif subtotal >= 20000: disc_pct = 0.05
      else: disc_pct = 0.0
      loyalty_discount = round_half_up(subtotal * disc_pct)
      # platform fee computed on subtotal BEFORE discount (order pinned)
      platform_fee = round_half_up(subtotal * PLATFORM_FEE_PCT)
      total = subtotal - loyalty_discount + platform_fee
    input_set: "Member's COMPLETED bookings/batches in the half-open period plus ACTIVE storage assignments; status filters explicit."
    constants:
      PLATFORM_FEE_PCT: 0.03
      DISCOUNT_TIER_HIGH: 50000
      DISCOUNT_TIER_MID: 20000
    precision: "Whole cents; round_half_up on discount and platform fee; evaluation order: subtotal → discount(subtotal tier) → platform_fee(subtotal) → total."
    variants:
      - name: invoice_vs_wallet_charge
        when: "Compared with the live wallet ledger"
        difference: "Invoice rolls historical period figures (forward-snapshot of COMPLETED items); the wallet ledger is the chronological running balance — same money, two algorithms (period rollup vs running accumulator) on different entity domains."

  - name: temp_excursion_accumulation
    trigger: "On POST /storage-units/{id}/temp-logs (TempLog recorded)"
    algorithm: chronological
    formula: |
      # Process readings strictly in reading_utc ASC order (tie-break created_at ASC).
      in_range = (unit.temp_min_c <= reading_c <= unit.temp_max_c)   # both inclusive
      if in_range:
        excursion_minutes = 0
        if compliance_status == EXCURSION: compliance_status = COMPLIANT
      else:
        if compliance_status == COMPLIANT:
          compliance_status = EXCURSION
          excursion_minutes = 0   # first breach reading starts the run at 0
        else:  # already EXCURSION
          gap = minutes_between(prev_out_of_range_reading_utc, reading_c.reading_utc)
          excursion_minutes += gap
        if excursion_minutes > 120:           # STRICT > (120 exactly is NOT a breach)
          compliance_status = QUARANTINED
          cascade: all ACTIVE StorageAssignments on this unit → QUARANTINED
    input_set: "All TempLogs for the unit in chronological order; the consecutive out-of-range run determines excursion_minutes."
    constants:
      EXCURSION_LIMIT_MINUTES: 120
    precision: "Integer minutes; strict > 120 triggers quarantine; reading exactly at temp_max_c is IN range (inclusive)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /members/register" }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: auth, check: "For entity_backed MemberOperator acting on a member-owned resource, X-User-ID equals the resource's member_id", error_id: ERR_FORBIDDEN_NOT_OWNER, http_status: 403, applies_to: "all member-scoped writes" }
  - { priority: 4, category: existence, check: "Path-referenced resources exist, validated left-to-right (member before booking before nested id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 5, category: existence, check: "FK body references (station_id, recipe_id, ingredient_id, storage_unit_id, batch_ids) resolve to existing entities", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creates referencing FKs" }
  - { priority: 6, category: business_referential, check: "Request body well-formed: required fields present, enums valid, numeric fields parse", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: all }
  - { priority: 7, category: state, check: "OCC: expected_member_version matches Member.version on guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /members/{id}/bookings, POST /members/{id}/storage-assignments" }
  - { priority: 8, category: state, check: "Target resource in correct state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 9, category: state, check: "Acting Member.status == ACTIVE for booking/batch/storage/order/packout creation", error_id: ERR_MEMBER_NOT_ACTIVE, http_status: 409, applies_to: "member-scoped creates" }
  - { priority: 10, category: business_safety, check: "Storage unit referenced by an assignment is not QUARANTINED", error_id: ERR_UNIT_QUARANTINED, http_status: 409, applies_to: "POST /members/{id}/storage-assignments, release-quarantine" }
  - { priority: 11, category: business_safety, check: "Packout allergen union disjoint from allergen_free_required at SEAL", error_id: ERR_ALLERGEN_CONFLICT, http_status: 409, applies_to: "POST /members/{id}/packouts/{pid}/seal" }
  - { priority: 12, category: business_temporal, check: "Booking interval end_utc > start_utc", error_id: ERR_INVALID_INTERVAL, http_status: 422, applies_to: "POST /members/{id}/bookings, POST /members/{id}/invoices" }
  - { priority: 13, category: business_constraint, check: "PEAK-window booking requires plan_tier == PREMIUM", error_id: ERR_PEAK_REQUIRES_PREMIUM, http_status: 409, applies_to: "POST /members/{id}/bookings" }
  - { priority: 14, category: business_temporal, check: "Booking does not overlap another CONFIRMED/COMPLETED booking on the station including turnover buffer", error_id: ERR_BOOKING_OVERLAP, http_status: 409, applies_to: "POST /members/{id}/bookings" }
  - { priority: 15, category: business_constraint, check: "Station.status == OPEN for new bookings", error_id: ERR_STATION_OUT_OF_SERVICE, http_status: 409, applies_to: "POST /members/{id}/bookings" }
  - { priority: 16, category: business_constraint, check: "Recipe PUBLISHED before a batch can be planned against it", error_id: ERR_RECIPE_NOT_PUBLISHED, http_status: 409, applies_to: "POST /members/{id}/batches" }
  - { priority: 17, category: business_constraint, check: "Ingredient on_hand_qty sufficient to start the batch (scaled BOM demand)", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /members/{id}/batches/{bid}/start" }
  - { priority: 18, category: business_constraint, check: "Batches packed in a packout are COMPLETED", error_id: ERR_BATCH_NOT_COMPLETED, http_status: 409, applies_to: "POST /members/{id}/packouts" }
  - { priority: 19, category: business_constraint, check: "Recipe not pinned by an active/planned batch when revising or retiring", error_id: ERR_RECIPE_IN_USE, http_status: 409, applies_to: "recipe revise/retire" }
  - { priority: 20, category: business_constraint, check: "Member has no open obligations (ACTIVE storage / future CONFIRMED bookings) at close", error_id: ERR_MEMBER_HAS_OPEN_OBLIGATIONS, http_status: 409, applies_to: "POST /members/{id}/close" }
  - { priority: 21, category: business_fiscal, check: "Aggregate free slots across same-class units >= requested_slots (no partial allocation)", error_id: ERR_STORAGE_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /members/{id}/storage-assignments" }
  - { priority: 22, category: business_fiscal, check: "Member.wallet_balance_cents covers the computed charge (booking fee / production fee / invoice total)", error_id: ERR_INSUFFICIENT_WALLET, http_status: 402, applies_to: "booking create, batch complete, invoice pay" }
  - { priority: 23, category: business_referential, check: "Pagination query params valid: limit in [1,100], offset >= 0 (request-shape check on list endpoints; relative position immaterial since list endpoints carry no business rules)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all list endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Member ----
  - { method: POST, path: "/members/register", description: "Register a new member (anonymous)", roles: [Anonymous], code: 201, input: [business_name, email, "plan_tier?"], output: Member, side_effects: ["status=ACTIVE", "wallet_balance_cents=0"] }
  - { method: GET, path: "/members", description: "List members", roles: [FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/members/{id}", description: "Get a member", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/members/{id}/wallet/top-ups", description: "Load prepaid funds onto a member wallet", roles: [MemberOperator, FacilityManager], code: 201, input: [amount_cents], output: Member, side_effects: ["credit wallet_balance_cents", "increment lifetime_loaded_cents", "increment Member.version"] }
  - { method: POST, path: "/members/{id}/suspend", description: "Suspend a member", roles: [FacilityManager], code: 200, input: [expected_member_version], output: Member, side_effects: ["status=SUSPENDED", "increment Member.version"] }
  - { method: POST, path: "/members/{id}/reinstate", description: "Reinstate a suspended member", roles: [FacilityManager], code: 200, input: [expected_member_version], output: Member, side_effects: ["status=ACTIVE", "increment Member.version"] }
  - { method: POST, path: "/members/{id}/close", description: "Close a member account", roles: [FacilityManager], code: 200, input: [expected_member_version], output: Member, side_effects: ["status=CLOSED", "increment Member.version"] }

  # ---- Station ----
  - { method: POST, path: "/stations", description: "Create a station", roles: [FacilityManager], code: 201, input: [name, station_class, "turnover_buffer_minutes?", "status?"], output: Station, side_effects: [] }
  - { method: GET, path: "/stations", description: "List stations", roles: [MemberOperator, FacilityManager], code: 200, input: ["station_class?", "status?", "limit?", "offset?"], output: "Station[]", side_effects: [] }
  - { method: GET, path: "/stations/{id}", description: "Get a station", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Station, side_effects: [] }
  - { method: PATCH, path: "/stations/{id}", description: "Update station status (e.g. take out of service)", roles: [FacilityManager], code: 200, input: ["status?", "turnover_buffer_minutes?"], output: Station, side_effects: [] }
  - { method: GET, path: "/stations/{id}/bookings", description: "List bookings on a station (reverse-reachability for Booking.station_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }

  # ---- Booking ----
  - { method: POST, path: "/members/{id}/bookings", description: "Create a station booking", roles: [MemberOperator], code: 201, input: [station_id, start_utc, end_utc, expected_member_version], output: Booking, side_effects: ["compute is_peak/turnover_applied/fee_cents", "debit wallet", "increment Member.version"] }
  - { method: GET, path: "/members/{id}/bookings", description: "List a member's bookings (reverse-reachability for Booking.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "station_id?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/bookings/{bid}", description: "Get a booking", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/members/{id}/bookings/{bid}/cancel", description: "Cancel a booking and refund the wallet", roles: [MemberOperator], code: 200, input: [], output: Booking, side_effects: ["status=CANCELLED", "credit wallet", "decrement lifetime_charged_cents"] }
  - { method: POST, path: "/members/{id}/bookings/{bid}/complete", description: "Mark a booking completed (invoiceable)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Booking, side_effects: ["status=COMPLETED"] }

  # ---- StorageUnit ----
  - { method: POST, path: "/storage-units", description: "Create a storage unit", roles: [FacilityManager], code: 201, input: [name, temp_class, total_slots, temp_min_c, temp_max_c], output: StorageUnit, side_effects: ["compliance_status=COMPLIANT", "used_slots=0"] }
  - { method: GET, path: "/storage-units", description: "List storage units", roles: [MemberOperator, FacilityManager, ComplianceOfficer], code: 200, input: ["temp_class?", "compliance_status?", "limit?", "offset?"], output: "StorageUnit[]", side_effects: [] }
  - { method: GET, path: "/storage-units/{id}", description: "Get a storage unit", roles: [MemberOperator, FacilityManager, ComplianceOfficer], code: 200, input: [], output: StorageUnit, side_effects: [] }
  - { method: POST, path: "/storage-units/{id}/temp-logs", description: "Record a temperature reading; drives excursion accumulation", roles: [ComplianceOfficer, FacilityManager], code: 201, input: [reading_c, reading_utc], output: TempLog, side_effects: ["compute in_range", "advance excursion_minutes/compliance_status", "possible cascade to QUARANTINED"] }
  - { method: GET, path: "/storage-units/{id}/temp-logs", description: "List temp readings for a unit (reverse-reachability for TempLog.storage_unit_id)", roles: [ComplianceOfficer, FacilityManager], code: 200, input: ["in_range?", "limit?", "offset?"], output: "TempLog[]", side_effects: [] }
  - { method: POST, path: "/storage-units/{id}/temp-logs/{logid}/certify", description: "Certify a temp reading (compliance audit mark)", roles: [ComplianceOfficer], code: 200, input: [], output: TempLog, side_effects: ["certified=true"] }
  - { method: POST, path: "/storage-units/{id}/certify-compliant", description: "Clear a quarantined unit back to COMPLIANT", roles: [ComplianceOfficer], code: 200, input: [], output: StorageUnit, side_effects: ["compliance_status=COMPLIANT", "excursion_minutes=0"] }

  # ---- StorageAssignment ----
  - { method: POST, path: "/members/{id}/storage-assignments", description: "Claim storage slots (waterfall allocation)", roles: [MemberOperator], code: 201, input: [temp_class, requested_slots, expected_member_version], output: StorageAssignment, side_effects: ["compute allocation_plan", "increment touched units' used_slots", "compute monthly_fee_cents", "increment Member.version"] }
  - { method: GET, path: "/members/{id}/storage-assignments", description: "List a member's storage assignments (reverse-reachability for StorageAssignment.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "StorageAssignment[]", side_effects: [] }
  - { method: GET, path: "/storage-units/{id}/storage-assignments", description: "List assignments touching a unit (reverse-reachability for StorageAssignment.storage_unit_id)", roles: [MemberOperator, FacilityManager, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "StorageAssignment[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/storage-assignments/{sid}", description: "Get a storage assignment", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: StorageAssignment, side_effects: [] }
  - { method: POST, path: "/members/{id}/storage-assignments/{sid}/release", description: "Release storage and free slots", roles: [MemberOperator], code: 200, input: [], output: StorageAssignment, side_effects: ["status=RELEASED", "decrement touched units' used_slots"] }
  - { method: POST, path: "/members/{id}/storage-assignments/{sid}/release-quarantine", description: "Return a quarantined assignment to ACTIVE after unit recovery", roles: [ComplianceOfficer], code: 200, input: [], output: StorageAssignment, side_effects: ["status=ACTIVE"] }

  # ---- Ingredient ----
  - { method: POST, path: "/ingredients", description: "Create an ingredient", roles: [FacilityManager], code: 201, input: [name, unit_cost_cents, "allergen_tags?"], output: Ingredient, side_effects: ["on_hand_qty=0"] }
  - { method: GET, path: "/ingredients", description: "List ingredients", roles: [MemberOperator, FacilityManager], code: 200, input: ["limit?", "offset?"], output: "Ingredient[]", side_effects: [] }
  - { method: GET, path: "/ingredients/{id}", description: "Get an ingredient", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Ingredient, side_effects: [] }

  # ---- Recipe + RecipeComponent ----
  - { method: POST, path: "/members/{id}/recipes", description: "Create a recipe (DRAFT)", roles: [MemberOperator], code: 201, input: [name, batch_yield_units], output: Recipe, side_effects: ["status=DRAFT", "version=1"] }
  - { method: GET, path: "/members/{id}/recipes", description: "List a member's recipes (reverse-reachability for Recipe.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Recipe[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/recipes/{rid}", description: "Get a recipe", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Recipe, side_effects: [] }
  - { method: POST, path: "/members/{id}/recipes/{rid}/components", description: "Add a BOM component to a DRAFT recipe", roles: [MemberOperator], code: 201, input: [ingredient_id, planned_qty], output: RecipeComponent, side_effects: [] }
  - { method: GET, path: "/members/{id}/recipes/{rid}/components", description: "List BOM components (reverse-reachability for RecipeComponent.recipe_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["limit?", "offset?"], output: "RecipeComponent[]", side_effects: [] }
  - { method: GET, path: "/ingredients/{id}/recipe-components", description: "List BOM lines using an ingredient (reverse-reachability for RecipeComponent.ingredient_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["limit?", "offset?"], output: "RecipeComponent[]", side_effects: [] }
  - { method: POST, path: "/members/{id}/recipes/{rid}/publish", description: "Publish a DRAFT recipe", roles: [MemberOperator], code: 200, input: [], output: Recipe, side_effects: ["status=PUBLISHED", "compute allergen_tags + estimated_food_cost_cents"] }
  - { method: POST, path: "/members/{id}/recipes/{rid}/revise", description: "Send a PUBLISHED recipe back to DRAFT (new version)", roles: [MemberOperator], code: 200, input: [], output: Recipe, side_effects: ["status=DRAFT", "increment version"] }
  - { method: POST, path: "/members/{id}/recipes/{rid}/retire", description: "Retire a recipe", roles: [MemberOperator], code: 200, input: [], output: Recipe, side_effects: ["status=RETIRED"] }

  # ---- ProductionBatch ----
  - { method: POST, path: "/members/{id}/batches", description: "Plan a production batch against a PUBLISHED recipe", roles: [MemberOperator], code: 201, input: [recipe_id, planned_yield_units], output: ProductionBatch, side_effects: ["status=PLANNED", "pin recipe_version", "compute estimated_food_cost_cents"] }
  - { method: GET, path: "/members/{id}/batches", description: "List a member's batches (reverse-reachability for ProductionBatch.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "recipe_id?", "limit?", "offset?"], output: "ProductionBatch[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/recipes/{rid}/batches", description: "List batches against a recipe (reverse-reachability for ProductionBatch.recipe_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "ProductionBatch[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/batches/{bid}", description: "Get a batch", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: ProductionBatch, side_effects: [] }
  - { method: POST, path: "/members/{id}/batches/{bid}/start", description: "Start production (consume-stock check)", roles: [MemberOperator], code: 200, input: [], output: ProductionBatch, side_effects: ["status=IN_PRODUCTION"] }
  - { method: POST, path: "/members/{id}/batches/{bid}/complete", description: "Complete production; record actuals", roles: [MemberOperator], code: 200, input: [actual_yield_units, "actual_components?"], output: ProductionBatch, side_effects: ["status=COMPLETED", "compute actual_food_cost + production_fee", "debit wallet", "decrement ingredient on_hand_qty"] }
  - { method: POST, path: "/members/{id}/batches/{bid}/scrap", description: "Scrap a batch (no charge)", roles: [MemberOperator], code: 200, input: [], output: ProductionBatch, side_effects: ["status=SCRAPPED"] }

  # ---- IngredientOrder ----
  - { method: POST, path: "/members/{id}/ingredient-orders", description: "Place a replenishment order", roles: [MemberOperator], code: 201, input: [ingredient_id, order_qty, unit_cost_cents], output: IngredientOrder, side_effects: ["status=PLACED"] }
  - { method: GET, path: "/members/{id}/ingredient-orders", description: "List a member's orders (reverse-reachability for IngredientOrder.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "ingredient_id?", "limit?", "offset?"], output: "IngredientOrder[]", side_effects: [] }
  - { method: GET, path: "/ingredients/{id}/ingredient-orders", description: "List orders for an ingredient (reverse-reachability for IngredientOrder.ingredient_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "IngredientOrder[]", side_effects: [] }
  - { method: POST, path: "/members/{id}/ingredient-orders/{oid}/receive", description: "Receive an order; updates stock and cost", roles: [MemberOperator], code: 200, input: [], output: IngredientOrder, side_effects: ["status=RECEIVED", "increment Ingredient.on_hand_qty", "set Ingredient.unit_cost_cents"] }
  - { method: POST, path: "/members/{id}/ingredient-orders/{oid}/cancel", description: "Cancel a placed order", roles: [MemberOperator], code: 200, input: [], output: IngredientOrder, side_effects: ["status=CANCELLED"] }

  # ---- EventPackout ----
  - { method: POST, path: "/members/{id}/packouts", description: "Create an event packout (DRAFT)", roles: [MemberOperator], code: 201, input: [event_name, batch_ids, "allergen_free_required?"], output: EventPackout, side_effects: ["compute combined_allergen_tags + packed_unit_count"] }
  - { method: GET, path: "/members/{id}/packouts", description: "List a member's packouts (reverse-reachability for EventPackout.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "EventPackout[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/packouts/{pid}", description: "Get a packout", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: EventPackout, side_effects: [] }
  - { method: POST, path: "/members/{id}/packouts/{pid}/seal", description: "Seal a packout (runs allergen gate)", roles: [MemberOperator], code: 200, input: [], output: EventPackout, side_effects: ["status=SEALED", "allergen gate"] }
  - { method: POST, path: "/members/{id}/packouts/{pid}/ship", description: "Ship a sealed packout", roles: [MemberOperator], code: 200, input: [], output: EventPackout, side_effects: ["status=SHIPPED"] }

  # ---- Invoice ----
  - { method: POST, path: "/members/{id}/invoices", description: "Generate a draft invoice for a period", roles: [FacilityManager], code: 201, input: [period_start_utc, period_end_utc], output: Invoice, side_effects: ["compute all subtotals + total"] }
  - { method: GET, path: "/members/{id}/invoices", description: "List a member's invoices (reverse-reachability for Invoice.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/invoices/{iid}", description: "Get an invoice", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/members/{id}/invoices/{iid}/issue", description: "Issue (lock) an invoice", roles: [FacilityManager], code: 200, input: [], output: Invoice, side_effects: ["status=ISSUED"] }
  - { method: POST, path: "/members/{id}/invoices/{iid}/pay", description: "Pay an issued invoice from wallet", roles: [FacilityManager], code: 200, input: [], output: Invoice, side_effects: ["status=PAID", "debit wallet", "increment lifetime_charged_cents"] }

  # ---- Flat top-level resource lookups (canonical single-resource GET + FK-filtered list) ----
  # These give every FK in §1.1 a reverse-reachability discovery channel and a stable
  # collection segment per entity. Filtered lists carry each FK as an optional query param.
  - { method: GET, path: "/bookings/{id}", description: "Get a booking by id (canonical single-resource read)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/bookings", description: "List/filter bookings (reverse-reachability for Booking.member_id and Booking.station_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["member_id?", "station_id?", "status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/storage-assignments/{id}", description: "Get a storage assignment by id", roles: [MemberOperator, FacilityManager, ComplianceOfficer], code: 200, input: [], output: StorageAssignment, side_effects: [] }
  - { method: GET, path: "/storage-assignments", description: "List/filter storage assignments (reverse-reachability for StorageAssignment.member_id and StorageAssignment.storage_unit_id)", roles: [MemberOperator, FacilityManager, ComplianceOfficer], code: 200, input: ["member_id?", "storage_unit_id?", "status?", "limit?", "offset?"], output: "StorageAssignment[]", side_effects: [] }
  - { method: GET, path: "/recipes/{id}", description: "Get a recipe by id (canonical single-resource read)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Recipe, side_effects: [] }
  - { method: GET, path: "/recipes", description: "List/filter recipes (reverse-reachability for Recipe.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "Recipe[]", side_effects: [] }
  - { method: GET, path: "/recipe-components/{id}", description: "Get a recipe component by id", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: RecipeComponent, side_effects: [] }
  - { method: GET, path: "/recipe-components", description: "List/filter recipe components (reverse-reachability for RecipeComponent.recipe_id and RecipeComponent.ingredient_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["recipe_id?", "ingredient_id?", "limit?", "offset?"], output: "RecipeComponent[]", side_effects: [] }
  - { method: GET, path: "/batches/{id}", description: "Get a production batch by id (canonical single-resource read)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: ProductionBatch, side_effects: [] }
  - { method: GET, path: "/batches", description: "List/filter batches (reverse-reachability for ProductionBatch.member_id and ProductionBatch.recipe_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["member_id?", "recipe_id?", "status?", "limit?", "offset?"], output: "ProductionBatch[]", side_effects: [] }
  - { method: GET, path: "/temp-logs/{id}", description: "Get a temp log by id", roles: [ComplianceOfficer, FacilityManager], code: 200, input: [], output: TempLog, side_effects: [] }
  - { method: GET, path: "/temp-logs", description: "List/filter temp logs (reverse-reachability for TempLog.storage_unit_id)", roles: [ComplianceOfficer, FacilityManager], code: 200, input: ["storage_unit_id?", "in_range?", "limit?", "offset?"], output: "TempLog[]", side_effects: [] }
  - { method: GET, path: "/ingredient-orders/{id}", description: "Get an ingredient order by id (canonical single-resource read)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: IngredientOrder, side_effects: [] }
  - { method: GET, path: "/ingredient-orders", description: "List/filter ingredient orders (reverse-reachability for IngredientOrder.member_id and IngredientOrder.ingredient_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["member_id?", "ingredient_id?", "status?", "limit?", "offset?"], output: "IngredientOrder[]", side_effects: [] }
  - { method: GET, path: "/packouts/{id}", description: "Get a packout by id (canonical single-resource read)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: EventPackout, side_effects: [] }
  - { method: GET, path: "/packouts", description: "List/filter packouts (reverse-reachability for EventPackout.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "EventPackout[]", side_effects: [] }
  - { method: GET, path: "/invoices/{id}", description: "Get an invoice by id (canonical single-resource read)", roles: [MemberOperator, FacilityManager], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/invoices", description: "List/filter invoices (reverse-reachability for Invoice.member_id)", roles: [MemberOperator, FacilityManager], code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "MemberOperator acting on a resource not owned by their X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive qty/yield" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end_utc <= start_utc (booking or invoice period)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version does not match Member.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Acting member is SUSPENDED or CLOSED" }
  - { id: ERR_MEMBER_HAS_OPEN_OBLIGATIONS, http: 409, condition: "Close attempted with ACTIVE storage or future CONFIRMED bookings" }
  - { id: ERR_STATION_OUT_OF_SERVICE, http: 409, condition: "Booking attempted on a station with status OUT_OF_SERVICE" }
  - { id: ERR_PEAK_REQUIRES_PREMIUM, http: 409, condition: "PEAK-window booking by a STANDARD-tier member" }
  - { id: ERR_BOOKING_OVERLAP, http: 409, condition: "Booking interval (incl. turnover buffer) overlaps an existing CONFIRMED/COMPLETED booking on the station" }
  - { id: ERR_RECIPE_EMPTY, http: 409, condition: "Publish attempted on a recipe with no components" }
  - { id: ERR_RECIPE_NOT_PUBLISHED, http: 409, condition: "Batch planned against a non-PUBLISHED recipe" }
  - { id: ERR_RECIPE_IN_USE, http: 409, condition: "Revise/retire blocked because a batch pins/references the recipe" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Ingredient on_hand_qty below scaled BOM demand at batch start" }
  - { id: ERR_BATCH_NOT_COMPLETED, http: 409, condition: "Packout references a batch that is not COMPLETED" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 409, condition: "Packed allergen union intersects allergen_free_required at SEAL" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 409, condition: "Requested storage slots exceed aggregate free slots in matching units" }
  - { id: ERR_UNIT_QUARANTINED, http: 409, condition: "Storage operation blocked by a QUARANTINED unit/assignment" }
  - { id: ERR_UNIT_NOT_RECOVERED, http: 409, condition: "Certify-compliant attempted while latest reading still out of range" }
  - { id: ERR_INSUFFICIENT_WALLET, http: 402, condition: "wallet_balance_cents below the computed charge" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic query/param validation failure (e.g. bad pagination limit)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a member."
    identity: "opaque"
    exclusive_operations:
      - "POST /members/register"
    shared_operations: []
  - name: MemberOperator
    description: "Acts as a single Member; owns that member's bookings, recipes, batches, storage assignments, orders, and packouts."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/bookings (+cancel/complete)"
      - "POST /members/{id}/recipes (+components/publish/revise/retire)"
      - "POST /members/{id}/batches (+start/complete/scrap)"
      - "POST /members/{id}/storage-assignments (+release)"
      - "POST /members/{id}/ingredient-orders (+receive/cancel)"
      - "POST /members/{id}/packouts (+seal/ship)"
    shared_operations:
      - "GET own member-scoped resources"
      - "POST /members/{id}/wallet/top-ups"
      - "GET /stations, /storage-units, /ingredients"
  - name: FacilityManager
    description: "Operator role managing shared facility resources, member lifecycle, and billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /stations, PATCH /stations/{id}"
      - "POST /storage-units"
      - "POST /ingredients"
      - "POST /members/{id}/suspend|reinstate|close"
      - "POST /members/{id}/invoices (+issue/pay)"
      - "GET /members (list)"
    shared_operations:
      - "GET all resources"
      - "POST /members/{id}/wallet/top-ups"
      - "POST /members/{id}/bookings/{bid}/complete"
  - name: ComplianceOfficer
    description: "Health-code role owning temperature logs, certification, and quarantine release."
    identity: "opaque"
    exclusive_operations:
      - "POST /storage-units/{id}/temp-logs/{logid}/certify"
      - "POST /storage-units/{id}/certify-compliant"
      - "POST /members/{id}/storage-assignments/{sid}/release-quarantine"
    shared_operations:
      - "POST /storage-units/{id}/temp-logs"
      - "GET /storage-units, /storage-units/{id}/temp-logs, storage-assignments"
