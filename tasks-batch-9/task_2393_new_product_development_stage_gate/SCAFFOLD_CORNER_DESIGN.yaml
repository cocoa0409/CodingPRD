              as: FunctionalReviewer
              as_user_id: "rev-fz"
            - call: "POST /innovation-projects/${fz_p_id}/gate-reviews"
              payload: { gate_id: "${fz_g2_id}", scheduled_at: "2026-08-10T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-fz"
              captures: { fz_gr_id: $.data.id }
            - call: "POST /gate-reviews/${fz_gr_id}/open"
              as: GateChair
              as_user_id: "chair-fz"
          trigger:
            - call: "GET /gate-reviews/${fz_gr_id}"
              as: PortfolioAdmin
            - call: "GET /innovation-projects/${fz_p_id}/launch-readiness"
              as: PortfolioAdmin
            - call: "POST /deliverables/${fz_d1_id}/submit"
              payload: { evidence_url: "https://npd.example/fz/sales" }
              as: SalesAccountManager
              as_user_id: "sub2-fz"
            - call: "POST /deliverables/${fz_d1_id}/decide"
              payload: { decision: "APPROVE", comment: "Sell-in plan accepted." }
              as: FunctionalReviewer
              as_user_id: "rev-fz"
            - call: "GET /gate-reviews/${fz_gr_id}"
              as: PortfolioAdmin
            - call: "GET /deliverables?project_id=${fz_p_id}&status=APPROVED"
              as: PortfolioAdmin
            - call: "GET /innovation-projects/${fz_p_id}/launch-readiness"
              as: PortfolioAdmin
            - call: "POST /gate-reviews/${fz_gr_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE", rationale: "Both packs are in." }
              as: FunctionalReviewer
              as_user_id: "rev-ops-fz"
            - call: "POST /gate-reviews/${fz_gr_id}/close"
              as: GateChair
              as_user_id: "chair-fz"
            - call: "GET /gate-reviews/${fz_gr_id}"
              as: PortfolioAdmin
          assert:
            - "the checklist rows arrive in the declared order, so ${fz_d0_id} is the MANUFACTURING_READINESS row with owner_function OPERATIONS and ${fz_d1_id} is the SALES_SELL_IN_PLAN row with owner_function SALES"
            - "the first review read reports deliverable_completeness_pct 50.00, the snapshot taken at open"
            - "the first launch-readiness read reports launch_readiness_pct 0.00 with blocking_deliverable_types empty, because no StageGate has stage_to LAUNCH_READY"
            - "after the second approval the review still reports 50.00 while GET /deliverables?status=APPROVED returns total_count 2, which is the intended disagreement"
            - "the second launch-readiness read still reports 0.00, since approving a readiness type on gate 2 cannot enlarge an empty denominator"
            - "the close answers 200 with deliverable_completeness_pct re-frozen to 100.00 and decision PASSED"
            - "InnovationProject.${fz_p_id}.dev_status is PILOT_QUALIFIED after the close, and a further launch-readiness read still reports 0.00"

      - name: cs_supersede_cascade_is_all_or_nothing
        claim_type: atomicity
        grounds:
          - concurrency_rules[formulation-create-stale-project]
        excluded_because:
          difficulty_instance: "transitive_cascade / formulation_supersede_four_level_lock_slip_cascade"
          rationale: |
            The §1.8 instance already runs the four level cascade on an accepted supersede and shows
            a stale expected_project_version leaving the prior formulation, its label approval and
            the launch lock untouched, which is exactly the all or nothing claim.

      - name: cs_counter_restored_after_a_withdrawn_presentation
        claim_type: atomicity
        grounds:
          - endpoints[POST /sell-in-presentations/{id}/withdraw]
        excluded_because:
          difficulty_instance: "compensating_invariant / reset_window_slot_counter_restored_after_withdraw"
          rationale: |
            The §1.8 instance fills a window, takes the capacity refusal, withdraws one presentation
            and shows the freed slot being reused, so a corner instance would only restate the
            counter bookkeeping it already pins.
