# =============================================================================
# SCAFFOLD — Laboratory Supply & Reagent Distribution with Cold Chain
# =============================================================================
scenario: |
  generate task hard than expert level! 1104. Laboratory Supply & Reagent Distribution with Cold Chain (Fisher Scientific): reagent lot reservation & sequential-lot request, dry-ice/gel-pack packaging & temperature excursion, controlled-temperature storage & inventory rotation, hazardous chemical shipping & quantity limits, standing order & consignment reagent, product recall & lot pull, custom kit assembly, freight cost vs product cost balance

domain_name: lab-reagent-coldchain
api_prefix: /lab

complexity_profile:
  primary_archetype: quota_allocation        # finite lot inventory reserved/committed/released
  secondary_archetype: compliance_audit      # hazmat limits, recall lot-pull, cold-chain excursion audit
  complexity_layers:
    - dual_variant_calculation               # provisional vs final freight; provisional vs final excursion credit
    - cascading_side_effects                 # recall -> lot -> reservation -> line -> order; excursion -> shipment -> order -> customer
    - optimistic_concurrency                 # OCC on ReagentLot / Order / CustomerAccount versions
    - selector_policy                        # FEFO/FIFO rotation and sequential-lot-run selection
  entity_topology: flat                      # peer entities joined by FK references, no nested collection paths
  state_machine_shape: cyclic                # Order BACKORDERED<->ALLOCATED; ReagentLot AVAILABLE<->QUARANTINED; Product LISTED<->UNDER_RECALL; Shipment IN_TRANSIT<->EXCURSION_HOLD; StandingOrder ACTIVE<->PAUSED; CustomerAccount ACTIVE<->SUSPENDED
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                     # each ops role owns a distinct resource family; Customer is entity-backed
  consistency_model: immediate               # every mutation is visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links are FK fields)
# =============================================================================
entities:
  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Warehouse display name" }
      - { name: region_code, type: string, source: input, description: "Freight region code, e.g. US-NE" }
      - { name: hazmat_certified, type: boolean, source: input, description: "True when warehouse may store and ship hazardous products" }
      - { name: status, type: enum, source: system, default: OPERATIONAL, description: "OPERATIONAL | SUSPENDED", constraints: "enum: OPERATIONAL, SUSPENDED" }

  - name: StorageZone
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; owning warehouse" }
      - { name: zone_class, type: enum, source: input, description: "AMBIENT | REFRIGERATED_2_8 | FROZEN_MINUS_20 | ULTRACOLD_MINUS_80", constraints: "enum: AMBIENT, REFRIGERATED_2_8, FROZEN_MINUS_20, ULTRACOLD_MINUS_80" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum total on-hand units storable; must be > 0" }
      - { name: rotation_policy, type: enum, source: input, default: FEFO, description: "FEFO (expiry_date ASC) | FIFO (received_at ASC) — drives allocation ranking", constraints: "enum: FEFO, FIFO" }
      - { name: occupied_units, type: integer, source: computed, default: 0, description: "Sum of quantity_on_hand over lots in this zone with status IN {AVAILABLE, QUARANTINED}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU; unique across all products", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: storage_requirement, type: enum, source: input, description: "Coldest acceptable zone_class the product requires: AMBIENT | REFRIGERATED_2_8 | FROZEN_MINUS_20 | ULTRACOLD_MINUS_80", constraints: "enum: AMBIENT, REFRIGERATED_2_8, FROZEN_MINUS_20, ULTRACOLD_MINUS_80" }
      - { name: hazard_class, type: enum, source: input, description: "NON_HAZARDOUS | FLAMMABLE | CORROSIVE | TOXIC | OXIDIZER", constraints: "enum: NON_HAZARDOUS, FLAMMABLE, CORROSIVE, TOXIC, OXIDIZER" }
      - { name: unit_haz_factor, type: integer, source: input, default: 1, description: "Hazmat load units contributed per product unit; must be >= 1; ignored when hazard_class == NON_HAZARDOUS" }
      - { name: max_qty_per_shipment, type: integer, source: input, description: "Per-product shipping cap: quantity of this product in one shipment must be <= this; must be > 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog unit price in cents; must be > 0" }
      - { name: requires_cold_chain, type: boolean, source: input, description: "True when product must ship with coolant and the customer must be cold_chain_certified" }
      - { name: shelf_life_days, type: integer, source: input, description: "Days from manufacture_date to lot expiry_date; must be > 0" }
      - { name: min_remaining_shelf_life_days, type: integer, source: input, default: 7, description: "Minimum days from order requested_ship_date to lot expiry_date for a lot to be allocatable" }
      - { name: status, type: enum, source: system, default: LISTED, description: "LISTED | UNDER_RECALL | DISCONTINUED", constraints: "enum: LISTED, UNDER_RECALL, DISCONTINUED" }

  - name: ReagentLot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; stocked product" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; stocking warehouse" }
      - { name: storage_zone_id, type: string, source: input, description: "FK -> StorageZone.id; putaway zone" }
      - { name: lot_sequence_number, type: integer, source: system, description: "Per-product monotonic receipt sequence: max(existing for product) + 1, starting at 1" }
      - { name: quantity_received, type: integer, source: input, description: "Initial receipt quantity; immutable; must be > 0" }
      - { name: quantity_on_hand, type: integer, source: computed, default: 0, description: "Unreserved physical units; starts equal to quantity_received" }
      - { name: quantity_reserved, type: integer, source: computed, default: 0, description: "Units held by reservations with status IN {HELD, COMMITTED}" }
      - { name: quantity_consumed, type: integer, source: computed, default: 0, description: "Units shipped out (reservations CONSUMED) or written off" }
      - { name: adjustment_total, type: integer, source: computed, default: 0, description: "Sum of all stock adjustment deltas (signed)" }
      - { name: manufacture_date, type: string, source: input, description: "ISO date YYYY-MM-DD of manufacture" }
      - { name: expiry_date, type: string, source: computed, description: "= manufacture_date + product.shelf_life_days (ISO date)" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of receipt" }
      - { name: recall_id, type: string, source: system, default: null, description: "FK -> RecallNotice.id; set when an ISSUED recall covers this lot, cleared when that recall CLOSES without pulling", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED | RECALLED | DEPLETED | EXPIRED", constraints: "enum: AVAILABLE, QUARANTINED, RECALLED, DEPLETED, EXPIRED" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Laboratory account name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted outstanding balance; must be > 0" }
      - { name: volume_discount_pct, type: number, source: input, default: 0, description: "Fractional per-line discount in [0, 0.5] applied at order submit" }
      - { name: hazmat_endorsement, type: enum, source: input, default: NONE, description: "NONE | LIMITED | FULL; LIMITED covers FLAMMABLE and CORROSIVE; FULL additionally covers TOXIC and OXIDIZER", constraints: "enum: NONE, LIMITED, FULL" }
      - { name: cold_chain_certified, type: boolean, source: input, default: false, description: "True when the account may receive requires_cold_chain products" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of dispatched invoice totals minus payments minus refund reversals minus consumption-record charges offset; see customer_outstanding_and_credit" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "enum: ACTIVE, SUSPENDED, CLOSED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; ordering account" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; fulfillment warehouse" }
      - { name: shipping_service, type: enum, source: input, description: "STANDARD | EXPRESS | PRIORITY_OVERNIGHT", constraints: "enum: STANDARD, EXPRESS, PRIORITY_OVERNIGHT" }
      - { name: requested_ship_date, type: string, source: input, description: "ISO date the customer wants shipment; drives shelf-life gate" }
      - { name: lines, type: array, source: input, description: "Creation-only array of {product_id, quantity, fulfillment_mode ANY|SEQUENTIAL}; materialized as OrderLine rows" }
      - { name: product_total_cents, type: integer, source: computed, default: null, description: "Sum of line_total_cents; null until first successful submit", constraints: "nullable" }
      - { name: submission_seq, type: integer, source: system, default: null, description: "Monotonic per-system integer assigned at successful submit; waitlist ordering key", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ALLOCATED | BACKORDERED | PACKED | SHIPPED | DELIVERED | CANCELLED | REFUNDED", constraints: "enum: DRAFT, ALLOCATED, BACKORDERED, PACKED, SHIPPED, DELIVERED, CANCELLED, REFUNDED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; requested product" }
      - { name: quantity, type: integer, source: input, description: "Requested units; must be > 0" }
      - { name: fulfillment_mode, type: enum, source: input, default: ANY, description: "ANY (FEFO/FIFO waterfall) | SEQUENTIAL (consecutive lot_sequence_number run)", constraints: "enum: ANY, SEQUENTIAL" }
      - { name: unit_price_cents, type: integer, source: system, default: null, description: "Product unit price snapshot taken at submit", constraints: "nullable" }
      - { name: line_total_cents, type: integer, source: computed, default: null, description: "round_half_up(quantity * unit_price_cents * (1 - volume_discount_pct)); null until submit", constraints: "nullable" }
      - { name: allocated_quantity, type: integer, source: computed, default: 0, description: "Sum of quantities of reservations with status IN {HELD, COMMITTED} on this line" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ALLOCATED | PARTIALLY_ALLOCATED | FULFILLED | CANCELLED", constraints: "enum: PENDING, ALLOCATED, PARTIALLY_ALLOCATED, FULFILLED, CANCELLED" }

  - name: LotReservation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; reserving line" }
      - { name: lot_id, type: string, source: system, description: "FK -> ReagentLot.id; reserved lot" }
      - { name: quantity, type: integer, source: system, description: "Reserved units; > 0" }
      - { name: status, type: enum, source: system, default: HELD, description: "HELD | COMMITTED | CONSUMED | RELEASED", constraints: "enum: HELD, COMMITTED, CONSUMED, RELEASED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; shipped order (exactly one Shipment per Order)" }
      - { name: coolant_type, type: enum, source: input, description: "NONE | GEL_PACK | DRY_ICE", constraints: "enum: NONE, GEL_PACK, DRY_ICE" }
      - { name: coolant_units, type: integer, source: input, default: 0, description: "Number of coolant units packed; must be >= 0; must be >= 1 when any line requires_cold_chain" }
      - { name: declared_weight_grams, type: integer, source: input, description: "Estimated gross weight at creation; must be > 0" }
      - { name: actual_weight_grams, type: integer, source: input, default: null, description: "Scale weight captured at dispatch", constraints: "nullable" }
      - { name: temp_min_celsius, type: number, source: computed, description: "max over order lines of the product storage band lower bound" }
      - { name: temp_max_celsius, type: number, source: computed, description: "min over order lines of the product storage band upper bound" }
      - { name: provisional_freight_cents, type: integer, source: computed, description: "freight_cost variant=provisional using declared_weight_grams at creation" }
      - { name: final_freight_cents, type: integer, source: computed, default: null, description: "freight_cost variant=final using actual_weight_grams at dispatch; null until dispatch", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: CREATED, description: "CREATED | PACKED | IN_TRANSIT | EXCURSION_HOLD | DELIVERED | RETURNED", constraints: "enum: CREATED, PACKED, IN_TRANSIT, EXCURSION_HOLD, DELIVERED, RETURNED" }

  - name: TemperatureExcursion
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; breached shipment" }
      - { name: peak_temp_celsius, type: number, source: system, description: "Out-of-band reading temperature that opened the excursion" }
      - { name: duration_minutes, type: integer, source: system, description: "Reported out-of-band duration" }
      - { name: deviation_degrees, type: number, source: computed, description: "peak above temp_max or below temp_min, in degrees" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL per excursion_severity", constraints: "enum: MINOR, MAJOR, CRITICAL" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "excursion_credit variant=provisional at OPEN" }
      - { name: final_credit_cents, type: integer, source: computed, default: null, description: "excursion_credit variant=final stamped at disposition; null until dispositioned", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACCEPTED | DESTROYED | RETURNED", constraints: "enum: OPEN, ACCEPTED, DESTROYED, RETURNED" }

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; subscribing account" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; subscribed product" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; fulfillment warehouse for generated orders" }
      - { name: quantity_per_run, type: integer, source: input, description: "Units per generated order; must be > 0" }
      - { name: interval_days, type: integer, source: input, description: "Days between runs; must be > 0" }
      - { name: effective_from, type: string, source: input, description: "ISO date the subscription window opens (inclusive)" }
      - { name: effective_until, type: string, source: input, description: "ISO date the subscription window closes (inclusive); must be >= effective_from" }
      - { name: next_run_date, type: string, source: computed, description: "Next generation date; initialized to effective_from" }
      - { name: generated_order_count, type: integer, source: computed, default: 0, description: "Cumulative orders generated by the clock sweep" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED | CANCELLED", constraints: "enum: ACTIVE, PAUSED, CANCELLED" }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; consignment customer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; consigned product" }
      - { name: ceiling_quantity, type: integer, source: input, description: "Maximum units ever stocked under this agreement; must be > 0" }
      - { name: stocked_quantity, type: integer, source: computed, default: 0, description: "Cumulative units delivered under the agreement" }
      - { name: consumed_quantity, type: integer, source: computed, default: 0, description: "Cumulative units reported consumed" }
      - { name: reorder_point, type: integer, source: input, description: "On-hand-at-customer at or below this triggers replenishment; must be >= 0" }
      - { name: contract_unit_price_cents, type: integer, source: input, description: "Billing price per consumed unit; must be > 0" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Fractional consumption-billing discount in [0, 0.5]" }
      - { name: replenishment_warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; warehouse that supplies auto-generated replenishment orders" }
      - { name: initial_stocked_quantity, type: integer, source: input, default: 0, description: "Units already at the customer site when the agreement opens; seeds stocked_quantity; must be >= 0 and <= ceiling_quantity" }
      - { name: effective_from, type: string, source: input, description: "ISO date window start (inclusive)" }
      - { name: effective_until, type: string, source: input, description: "ISO date window end (exclusive); must be > effective_from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "enum: ACTIVE, SUSPENDED, CLOSED" }

  - name: ConsumptionRecord
    parent: null
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ConsignmentAgreement.id; billed agreement" }
      - { name: quantity, type: integer, source: input, description: "Units consumed; must be > 0" }
      - { name: unit_price_cents, type: integer, source: system, description: "contract_unit_price_cents snapshot at record time" }
      - { name: charge_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_price_cents * (1 - discount_pct))" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of the record" }

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; recalled product" }
      - { name: scope_type, type: enum, source: input, description: "LOT_RANGE | PRODUCT_ALL", constraints: "enum: LOT_RANGE, PRODUCT_ALL" }
      - { name: scope_lot_seq_min, type: integer, source: input, default: null, description: "Lowest covered lot_sequence_number; required when scope_type == LOT_RANGE", constraints: "nullable" }
      - { name: scope_lot_seq_max, type: integer, source: input, default: null, description: "Highest covered lot_sequence_number (inclusive); required when scope_type == LOT_RANGE", constraints: "nullable" }
      - { name: severity_class, type: enum, source: input, description: "CLASS_I | CLASS_II | CLASS_III", constraints: "enum: CLASS_I, CLASS_II, CLASS_III" }
      - { name: reason, type: string, source: input, description: "Free-text recall rationale" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | CLOSED", constraints: "enum: DRAFT, ISSUED, CLOSED" }

  - name: KitDefinition
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning account (custom kits are account-specific)" }
      - { name: name, type: string, source: input, description: "Kit display name" }
      - { name: components, type: array, source: input, description: "Array of {product_id, quantity_per_kit}; quantity_per_kit must be > 0; duplicate product_id entries rejected" }
      - { name: kit_price_cents, type: integer, source: computed, default: null, description: "kit_price_rollup result, computed at activation; null while DRAFT", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED", constraints: "enum: DRAFT, ACTIVE, RETIRED" }

  - name: KitAssemblyJob
    parent: null
    common_fields: true
    fields:
      - { name: kit_id, type: string, source: input, description: "FK -> KitDefinition.id; kit to build" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; assembly warehouse supplying components" }
      - { name: quantity_to_build, type: integer, source: input, description: "Kits to assemble; must be > 0" }
      - { name: kits_built, type: integer, source: system, default: 0, description: "Kits actually assembled; equals quantity_to_build on COMPLETED" }
      - { name: consumption_summary, type: object, source: system, default: null, description: "Map of component product_id -> {lot_id, quantity}[] consumed at execute", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | COMPLETED | CANCELLED", constraints: "enum: PLANNED, COMPLETED, CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Warehouse
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "POST /lab/warehouses/{warehouseId}/suspend"
        actor: OpsAdmin
        preconditions:
          - "Warehouse.status == OPERATIONAL (ERR_WAREHOUSE_NOT_OPERATIONAL)"
        side_effects: ["increments Warehouse.version by 1"]
      - from: SUSPENDED
        to: OPERATIONAL
        trigger: "POST /lab/warehouses/{warehouseId}/resume"
        actor: OpsAdmin
        preconditions:
          - "Warehouse.status == SUSPENDED (ERR_WAREHOUSE_NOT_SUSPENDED)"
        side_effects: ["increments Warehouse.version by 1"]

  - entity: Product
    initial_state: LISTED
    terminal_states: [DISCONTINUED]
    transitions:
      - from: LISTED
        to: UNDER_RECALL
        trigger: "system (POST /lab/recalls/{recallId}/issue with scope_type == PRODUCT_ALL for this product)"
        actor: system
        preconditions: []
        side_effects: ["increments Product.version by 1"]
      - from: UNDER_RECALL
        to: LISTED
        trigger: "system (POST /lab/recalls/{recallId}/close on the ISSUED PRODUCT_ALL recall covering this product)"
        actor: system
        preconditions: []
        side_effects: ["increments Product.version by 1"]
      - from: LISTED
        to: DISCONTINUED
        trigger: "POST /lab/products/{productId}/discontinue"
        actor: CatalogManager
        preconditions:
          - "Product.status == LISTED (ERR_PRODUCT_NOT_LISTED)"
        side_effects: ["increments Product.version by 1"]
      - from: UNDER_RECALL
        to: DISCONTINUED
        trigger: "POST /lab/products/{productId}/discontinue"
        actor: CatalogManager
        preconditions:
          - "Product.status IN {LISTED, UNDER_RECALL} (ERR_PRODUCT_NOT_LISTED)"
        side_effects: ["increments Product.version by 1"]

  - entity: ReagentLot
    initial_state: AVAILABLE
    terminal_states: [RECALLED, DEPLETED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /lab/lots/{lotId}/quarantine OR system (recall issue cascade covers this lot)"
        actor: QualityManager | system
        preconditions:
          - "ReagentLot.status == AVAILABLE (ERR_LOT_NOT_AVAILABLE)"
        side_effects:
          - "Every LotReservation with lot_id == this lot and status == HELD transitions to RELEASED; for each: lot.quantity_reserved -= reservation.quantity and lot.quantity_on_hand += reservation.quantity (compensation)"
          - "Each released reservation's OrderLine recomputes allocated_quantity; when allocated_quantity < quantity the line demotes ALLOCATED -> PENDING or PARTIALLY_ALLOCATED -> PENDING"
          - "Each demoted line's Order demotes ALLOCATED -> BACKORDERED"
          - "increments ReagentLot.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /lab/lots/{lotId}/release-quarantine"
        actor: QualityManager
        preconditions:
          - "ReagentLot.status == QUARANTINED (ERR_LOT_NOT_QUARANTINED)"
          - "No RecallNotice with status == ISSUED covers this lot (ERR_RECALL_ACTIVE_FOR_LOT)"
        side_effects: ["increments ReagentLot.version by 1"]
      - from: QUARANTINED
        to: RECALLED
        trigger: "system (POST /lab/recalls/{recallId}/close on the ISSUED recall covering this lot — lot pull)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.quantity_consumed += lot.quantity_on_hand + lot.quantity_reserved (remaining units pulled and written off); quantity_on_hand and quantity_reserved set to 0"
          - "StorageZone.occupied_units of lot.storage_zone_id recomputed"
          - "increments ReagentLot.version by 1"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (any reservation/pack/adjustment that drives quantity_on_hand to exactly 0)"
        actor: system
        preconditions: []
        side_effects: ["increments ReagentLot.version by 1"]
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (POST /lab/_clock/set_current_utc moves the logical clock past expiry_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Every LotReservation with lot_id == this lot and status == HELD transitions to RELEASED with the same quantity compensation as the quarantine cascade"
          - "Affected OrderLines and Orders demote exactly as in the quarantine cascade"
          - "increments ReagentLot.version by 1"

  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lab/customers/{customerId}/suspend OR system (auto_suspension_check after an invoice posts outstanding_balance_cents > credit_limit_cents * 1.2)"
        actor: AccountManager | system
        preconditions:
          - "CustomerAccount.status == ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
        side_effects: ["increments CustomerAccount.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lab/customers/{customerId}/reactivate"
        actor: AccountManager
        preconditions:
          - "CustomerAccount.status == SUSPENDED (ERR_CUSTOMER_NOT_SUSPENDED)"
          - "outstanding_balance_cents <= credit_limit_cents (ERR_OUTSTANDING_ABOVE_LIMIT)"
        side_effects: ["increments CustomerAccount.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /lab/customers/{customerId}/close"
        actor: AccountManager
        preconditions:
          - "CustomerAccount.status IN {ACTIVE, SUSPENDED} (ERR_CUSTOMER_ALREADY_CLOSED)"
          - "No Order of this customer with status IN {DRAFT, ALLOCATED, BACKORDERED, PACKED, SHIPPED} (ERR_OPEN_ORDERS_EXIST)"
          - "No ConsignmentAgreement of this customer with status == ACTIVE (ERR_OPEN_AGREEMENTS_EXIST)"
          - "outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE_NONZERO)"
        side_effects: ["increments CustomerAccount.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /lab/customers/{customerId}/close"
        actor: AccountManager
        preconditions:
          - "CustomerAccount.status IN {ACTIVE, SUSPENDED} (ERR_CUSTOMER_ALREADY_CLOSED)"
          - "No Order of this customer with status IN {DRAFT, ALLOCATED, BACKORDERED, PACKED, SHIPPED} (ERR_OPEN_ORDERS_EXIST)"
          - "No ConsignmentAgreement of this customer with status == ACTIVE (ERR_OPEN_AGREEMENTS_EXIST)"
          - "outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE_NONZERO)"
        side_effects: ["increments CustomerAccount.version by 1"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED, REFUNDED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /lab/orders/{orderId}/submit"
        actor: Customer
        preconditions:
          - "Order.status == DRAFT (ERR_ORDER_NOT_SUBMITTABLE)"
          - "CustomerAccount.status == ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
          - "Order has >= 1 OrderLine (ERR_ORDER_HAS_NO_LINES)"
          - "Validation chain §1.4 passes (hazmat endorsement, cold-chain certification, product listing, credit pre-check)"
          - "Allocation run fully allocated every line"
        side_effects:
          - "unit_price_cents snapshotted and line_total_cents computed on every OrderLine; product_total_cents computed on the Order"
          - "For each line, allocation per fefo_allocation_selection or sequential_lot_run_selection creates LotReservation rows with status HELD; each touched lot moves quantity_on_hand -> quantity_reserved"
          - "A lot whose quantity_on_hand reaches exactly 0 transitions AVAILABLE -> DEPLETED"
          - "submission_seq assigned from the monotonic sequence"
          - "increments Order.version by 1"
      - from: DRAFT
        to: BACKORDERED
        trigger: "POST /lab/orders/{orderId}/submit (same validations; allocation run left at least one line short)"
        actor: Customer
        preconditions:
          - "Order.status == DRAFT (ERR_ORDER_NOT_SUBMITTABLE)"
          - "CustomerAccount.status == ACTIVE (ERR_CUSTOMER_NOT_ACTIVE)"
          - "Order has >= 1 OrderLine (ERR_ORDER_HAS_NO_LINES)"
          - "Validation chain §1.4 passes"
        side_effects:
          - "Same snapshot/pricing side effects as the ALLOCATED branch"
          - "Partial LotReservation rows (status HELD) persist for whatever quantity could be allocated; short lines stay PENDING or PARTIALLY_ALLOCATED"
          - "submission_seq assigned from the monotonic sequence"
          - "increments Order.version by 1"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "POST /lab/orders/{orderId}/reallocate (manual RESET re-plan) OR system top-up (POST /lab/lots receipt triggers waitlist retry over orders with status == BACKORDERED ordered by submission_seq ASC)"
        actor: Customer | system
        preconditions:
          - "Order.status IN {BACKORDERED, ALLOCATED} (ERR_ORDER_NOT_REALLOCATABLE)"
          - "expected_order_version matches Order.version when supplied via the manual endpoint (ERR_STALE_ORDER_VERSION)"
          - "After the retry allocation every line is fully allocated"
        side_effects:
          - "Manual reallocate: existing HELD reservations on the order are first RELEASED (quantity handed back to lots), then the full allocation re-runs from scratch"
          - "System waitlist retry: existing HELD reservations are KEPT and only each line's shortfall is allocated against newly available lots (top-up)"
          - "Same lot quantity movements and DEPLETED auto-transition as submit"
          - "increments Order.version by 1"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system (quarantine / expiry / recall cascade released a HELD reservation and left a line short)"
        actor: system
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: ALLOCATED
        to: PACKED
        trigger: "system (POST /lab/shipments/{shipmentId}/pack on this order's shipment)"
        actor: system
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: PACKED
        to: SHIPPED
        trigger: "system (POST /lab/shipments/{shipmentId}/dispatch on this order's shipment)"
        actor: system
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "system (POST /lab/shipments/{shipmentId}/deliver on this order's shipment)"
        actor: system
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: SHIPPED
        to: REFUNDED
        trigger: "system (POST /lab/excursions/{excursionId}/disposition with decision DESTROYED or RETURNED on this order's shipment's excursion)"
        actor: system
        preconditions: []
        side_effects:
          - "CustomerAccount.outstanding_balance_cents -= (Order.product_total_cents + Shipment.final_freight_cents) — full invoice reversal, freight waived"
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lab/orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "Order.status IN {DRAFT, BACKORDERED, ALLOCATED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Every HELD reservation on the order transitions to RELEASED with quantity compensation back to its lot"
          - "Every OrderLine transitions to CANCELLED"
          - "increments Order.version by 1"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /lab/orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "Order.status IN {DRAFT, BACKORDERED, ALLOCATED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Every HELD reservation on the order transitions to RELEASED with quantity compensation back to its lot"
          - "Every OrderLine transitions to CANCELLED"
          - "increments Order.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /lab/orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "Order.status IN {DRAFT, BACKORDERED, ALLOCATED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Every HELD reservation on the order transitions to RELEASED with quantity compensation back to its lot"
          - "Every OrderLine transitions to CANCELLED"
          - "increments Order.version by 1"

  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "system (allocation run covers the full line quantity)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: PENDING
        to: PARTIALLY_ALLOCATED
        trigger: "system (allocation run covers some but not all of the line quantity)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "system (waitlist retry / reallocate covers the remainder)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: ALLOCATED
        to: PENDING
        trigger: "system (quarantine / expiry / recall cascade released HELD reservations down to zero remaining on this line)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: PARTIALLY_ALLOCATED
        to: PENDING
        trigger: "system (cascade released the remaining HELD reservations on this line)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: ALLOCATED
        to: FULFILLED
        trigger: "system (POST /lab/shipments/{shipmentId}/pack commits this line's reservations)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (order cancelled)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "system (order cancelled)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "system (order cancelled)"
        actor: system
        preconditions: []
        side_effects: ["increments OrderLine.version by 1"]

  - entity: LotReservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "system (POST /lab/shipments/{shipmentId}/pack on the parent order's shipment)"
        actor: system
        preconditions: []
        side_effects: ["increments LotReservation.version by 1"]
      - from: COMMITTED
        to: CONSUMED
        trigger: "system (POST /lab/shipments/{shipmentId}/dispatch on the parent order's shipment)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.quantity_reserved -= quantity; lot.quantity_consumed += quantity"
          - "StorageZone.occupied_units of the lot's zone recomputed"
          - "increments LotReservation.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /lab/reservations/{reservationId}/release OR system (order cancel, reallocate reset, quarantine cascade, expiry cascade, recall cascade)"
        actor: Customer | InventoryClerk | system
        preconditions:
          - "LotReservation.status == HELD (ERR_RESERVATION_NOT_HELD)"
        side_effects:
          - "lot.quantity_reserved -= quantity; lot.quantity_on_hand += quantity"
          - "StorageZone.occupied_units of the lot's zone recomputed"
          - "increments LotReservation.version by 1"

  - entity: Shipment
    initial_state: CREATED
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: CREATED
        to: PACKED
        trigger: "POST /lab/shipments/{shipmentId}/pack"
        actor: InventoryClerk
        preconditions:
          - "Shipment.status == CREATED (ERR_SHIPMENT_NOT_PACKABLE)"
          - "Order.status == ALLOCATED (ERR_ORDER_NOT_ALLOCATED)"
        side_effects:
          - "Every HELD reservation of the order transitions to COMMITTED"
          - "Every OrderLine of the order transitions to FULFILLED; Order transitions ALLOCATED -> PACKED"
          - "increments Shipment.version by 1"
      - from: PACKED
        to: IN_TRANSIT
        trigger: "POST /lab/shipments/{shipmentId}/dispatch"
        actor: InventoryClerk
        preconditions:
          - "Shipment.status == PACKED (ERR_SHIPMENT_NOT_DISPATCHABLE)"
          - "Warehouse.status == OPERATIONAL for the order's warehouse (ERR_WAREHOUSE_NOT_OPERATIONAL)"
        side_effects:
          - "actual_weight_grams recorded; final_freight_cents computed per freight_cost variant=final"
          - "Every COMMITTED reservation transitions to CONSUMED (lot quantity_reserved -> quantity_consumed)"
          - "Order transitions PACKED -> SHIPPED"
          - "Invoice posts: CustomerAccount.outstanding_balance_cents += Order.product_total_cents + final_freight_cents"
          - "auto_suspension_check runs on the customer"
          - "For each ConsignmentAgreement with status == ACTIVE matching (order.customer_id, line.product_id): stocked_quantity += line.quantity; consignment_replenishment is NOT triggered here"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: EXCURSION_HOLD
        trigger: "system (POST /lab/shipments/{shipmentId}/record-temperature reported an out-of-band reading)"
        actor: system
        preconditions:
          - "Endpoint guard: Shipment.status IN {IN_TRANSIT, EXCURSION_HOLD} (ERR_SHIPMENT_NOT_IN_TRANSIT)"
          - "Endpoint guard: no TemperatureExcursion of this shipment with status == OPEN (ERR_EXCURSION_ALREADY_OPEN)"
        side_effects: ["TemperatureExcursion created with status OPEN and provisional_credit_cents; increments Shipment.version by 1"]
      - from: EXCURSION_HOLD
        to: IN_TRANSIT
        trigger: "POST /lab/shipments/{shipmentId}/resume-transit"
        actor: InventoryClerk
        preconditions:
          - "Shipment.status == EXCURSION_HOLD (ERR_SHIPMENT_NOT_ON_HOLD)"
          - "The shipment's excursion has status == ACCEPTED (ERR_EXCURSION_NOT_RESOLVED)"
        side_effects: ["increments Shipment.version by 1"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /lab/shipments/{shipmentId}/deliver"
        actor: InventoryClerk
        preconditions:
          - "Shipment.status == IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"
          - "No TemperatureExcursion of this shipment with status == OPEN (ERR_DELIVERY_BLOCKED_OPEN_EXCURSION)"
        side_effects:
          - "Order transitions SHIPPED -> DELIVERED"
          - "increments Shipment.version by 1"
      - from: EXCURSION_HOLD
        to: RETURNED
        trigger: "system (POST /lab/excursions/{excursionId}/disposition with decision DESTROYED or RETURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "Order transitions SHIPPED -> REFUNDED with the full invoice reversal"
          - "increments Shipment.version by 1"

  - entity: TemperatureExcursion
    initial_state: OPEN
    terminal_states: [ACCEPTED, DESTROYED, RETURNED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /lab/excursions/{excursionId}/disposition with decision == ACCEPTED"
        actor: QualityManager
        preconditions:
          - "TemperatureExcursion.status == OPEN (ERR_EXCURSION_NOT_OPEN)"
        side_effects:
          - "final_credit_cents = 0 per excursion_credit variant=final"
          - "increments TemperatureExcursion.version by 1"
      - from: OPEN
        to: DESTROYED
        trigger: "POST /lab/excursions/{excursionId}/disposition with decision == DESTROYED"
        actor: QualityManager
        preconditions:
          - "TemperatureExcursion.status == OPEN (ERR_EXCURSION_NOT_OPEN)"
        side_effects:
          - "final_credit_cents = affected cold-chain product value per excursion_credit variant=final"
          - "Cascade hop 1: Shipment EXCURSION_HOLD -> RETURNED"
          - "Cascade hop 2: Order SHIPPED -> REFUNDED"
          - "Cascade hop 3: CustomerAccount.outstanding_balance_cents -= (Order.product_total_cents + Shipment.final_freight_cents)"
          - "increments TemperatureExcursion.version by 1"
      - from: OPEN
        to: RETURNED
        trigger: "POST /lab/excursions/{excursionId}/disposition with decision == RETURNED"
        actor: QualityManager
        preconditions:
          - "TemperatureExcursion.status == OPEN (ERR_EXCURSION_NOT_OPEN)"
        side_effects:
          - "final_credit_cents = final freight + 25% of affected cold-chain product value per excursion_credit variant=final"
          - "Same shipment -> order -> customer cascade as DESTROYED"
          - "increments TemperatureExcursion.version by 1"

  - entity: StandingOrder
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /lab/standing-orders/{standingOrderId}/pause OR system (a generated run's submit-time validation failed — e.g. credit — leaving the generated order in DRAFT)"
        actor: Customer | system
        preconditions:
          - "StandingOrder.status == ACTIVE (ERR_STANDING_ORDER_NOT_ACTIVE)"
        side_effects: ["increments StandingOrder.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /lab/standing-orders/{standingOrderId}/resume"
        actor: Customer
        preconditions:
          - "StandingOrder.status == PAUSED (ERR_STANDING_ORDER_NOT_PAUSED)"
        side_effects: ["increments StandingOrder.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /lab/standing-orders/{standingOrderId}/cancel"
        actor: Customer
        preconditions:
          - "StandingOrder.status IN {ACTIVE, PAUSED} (ERR_STANDING_ORDER_TERMINAL)"
        side_effects: ["increments StandingOrder.version by 1"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /lab/standing-orders/{standingOrderId}/cancel"
        actor: Customer
        preconditions:
          - "StandingOrder.status IN {ACTIVE, PAUSED} (ERR_STANDING_ORDER_TERMINAL)"
        side_effects: ["increments StandingOrder.version by 1"]

  - entity: ConsignmentAgreement
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lab/consignment-agreements/{agreementId}/suspend"
        actor: AccountManager
        preconditions:
          - "ConsignmentAgreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: ["increments ConsignmentAgreement.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lab/consignment-agreements/{agreementId}/reactivate"
        actor: AccountManager
        preconditions:
          - "ConsignmentAgreement.status == SUSPENDED (ERR_AGREEMENT_NOT_SUSPENDED)"
        side_effects: ["increments ConsignmentAgreement.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /lab/consignment-agreements/{agreementId}/close"
        actor: AccountManager
        preconditions:
          - "ConsignmentAgreement.status IN {ACTIVE, SUSPENDED} (ERR_AGREEMENT_ALREADY_CLOSED)"
        side_effects: ["increments ConsignmentAgreement.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /lab/consignment-agreements/{agreementId}/close"
        actor: AccountManager
        preconditions:
          - "ConsignmentAgreement.status IN {ACTIVE, SUSPENDED} (ERR_AGREEMENT_ALREADY_CLOSED)"
        side_effects: ["increments ConsignmentAgreement.version by 1"]

  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /lab/recalls/{recallId}/issue"
        actor: QualityManager
        preconditions:
          - "RecallNotice.status == DRAFT (ERR_RECALL_NOT_DRAFT)"
        side_effects:
          - "Cascade hop 1: every ReagentLot of the product matching the scope (LOT_RANGE: scope_lot_seq_min <= lot_sequence_number <= scope_lot_seq_max; PRODUCT_ALL: all lots) with status IN {AVAILABLE, QUARANTINED} transitions to QUARANTINED (AVAILABLE lots) or stays QUARANTINED, and recall_id is set to this recall"
          - "Cascade hop 2: every LotReservation with status == HELD on those lots transitions to RELEASED with quantity compensation back to the lot"
          - "Cascade hop 3: each affected OrderLine recomputes allocated_quantity and demotes to PENDING when it reaches 0"
          - "Cascade hop 4: each affected Order with status == ALLOCATED demotes to BACKORDERED"
          - "When scope_type == PRODUCT_ALL: Product LISTED -> UNDER_RECALL"
          - "increments RecallNotice.version by 1"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /lab/recalls/{recallId}/close"
        actor: QualityManager
        preconditions:
          - "RecallNotice.status == ISSUED (ERR_RECALL_NOT_CLOSABLE)"
          - "Every covered ReagentLot has status == QUARANTINED with quantity_reserved == 0 (ERR_RECALL_LOTS_PENDING)"
        side_effects:
          - "Lot pull: every covered QUARANTINED lot transitions QUARANTINED -> RECALLED, its remaining quantity_on_hand written off into quantity_consumed, recall_id cleared"
          - "When scope_type == PRODUCT_ALL: Product UNDER_RECALL -> LISTED"
          - "increments RecallNotice.version by 1"

  - entity: KitDefinition
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /lab/kits/{kitId}/activate"
        actor: CatalogManager
        preconditions:
          - "KitDefinition.status == DRAFT (ERR_KIT_NOT_DRAFT)"
          - "components is non-empty (ERR_KIT_COMPONENTS_EMPTY)"
          - "Every component product has status == LISTED (ERR_PRODUCT_NOT_LISTED)"
          - "No component product is covered by an ISSUED recall (ERR_PRODUCT_UNDER_RECALL)"
          - "All component products share one identical storage_requirement (ERR_KIT_STORAGE_MIXED)"
        side_effects:
          - "kit_price_cents computed per kit_price_rollup"
          - "increments KitDefinition.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /lab/kits/{kitId}/retire"
        actor: CatalogManager
        preconditions:
          - "KitDefinition.status == ACTIVE (ERR_KIT_NOT_ACTIVE)"
        side_effects: ["increments KitDefinition.version by 1"]

  - entity: KitAssemblyJob
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /lab/kit-assembly-jobs/{jobId}/execute"
        actor: InventoryClerk
        preconditions:
          - "KitAssemblyJob.status == PLANNED (ERR_JOB_NOT_EXECUTABLE)"
          - "KitDefinition.status == ACTIVE (ERR_KIT_NOT_ACTIVE)"
          - "For every component, the FEFO waterfall over AVAILABLE lots of that product at the job's warehouse covers quantity_per_kit * quantity_to_build (ERR_KIT_COMPONENT_SHORTAGE)"
        side_effects:
          - "Per component, fefo_allocation_selection consumes quantity_per_kit * quantity_to_build units: lot.quantity_on_hand decremented and lot.quantity_consumed incremented per waterfall order"
          - "Lots driven to exactly 0 on_hand transition AVAILABLE -> DEPLETED"
          - "StorageZone.occupied_units recomputed per touched zone"
          - "kits_built = quantity_to_build; consumption_summary recorded"
          - "increments KitAssemblyJob.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /lab/kit-assembly-jobs/{jobId}/cancel"
        actor: InventoryClerk
        preconditions:
          - "KitAssemblyJob.status == PLANNED (ERR_JOB_NOT_CANCELLABLE)"
        side_effects: ["increments KitAssemblyJob.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: lot-adjust-stale-lot
    parent_entity: ReagentLot
    write_endpoint: "POST /lab/lots/{lotId}/adjustments"
    occ_field: "expected_lot_version"
    description: |
      A stock adjustment against a ReagentLot legitimately supersedes the lot's
      prior quantity state. When the client's expected_lot_version no longer
      matches the lot's current version — because an earlier adjustment, cascade,
      or reservation flow already advanced it — the adjustment is rejected so the
      client re-reads before correcting stock.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: order-reallocate-stale-order
    parent_entity: Order
    write_endpoint: "POST /lab/orders/{orderId}/reallocate"
    occ_field: "expected_order_version"
    description: |
      A manual reallocate re-plans the order's allocation and is valid from both
      BACKORDERED and ALLOCATED, so a second well-formed reallocate would
      otherwise succeed on a view of the order that an earlier submit, cascade,
      or reallocate already advanced. The expected_order_version check rejects
      the stale re-plan so allocations are never rebuilt from an outdated order.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: customer-update-stale-customer
    parent_entity: CustomerAccount
    write_endpoint: "PATCH /lab/customers/{customerId}"
    occ_field: "expected_customer_version"
    description: |
      A credit-limit or endorsement update legitimately overwrites the account's
      commercial terms. When expected_customer_version no longer matches the
      account's current version — because an invoice, payment, suspension, or an
      earlier update already advanced it — the update is rejected so commercial
      terms are never overwritten from a stale view.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_sequence_assignment
    trigger: "POST /lab/lots (lot receipt)"
    algorithm: aggregation
    formula: |
      lot_sequence_number = 1 + max(lot_sequence_number over all existing
      ReagentLot rows with the same product_id), or 1 when none exist.
    input_set: "All ReagentLot rows with matching product_id, regardless of status"
    precision: "integer"

  - name: expiry_date_derivation
    trigger: "POST /lab/lots (lot receipt)"
    algorithm: chronological
    formula: |
      expiry_date = manufacture_date + product.shelf_life_days (calendar days).
      A lot is expired when the logical clock's current date is strictly AFTER
      expiry_date; on the expiry_date itself the lot is still usable.
    input_set: "the new lot and its Product"
    precision: "whole ISO days"

  - name: storage_band_mapping
    trigger: "shipment creation (temp band) and record-temperature (breach test)"
    algorithm: threshold
    formula: |
      Band per storage_requirement:
        AMBIENT            -> [15, 25]
        REFRIGERATED_2_8   -> [2, 8]
        FROZEN_MINUS_20    -> [-25, -15]
        ULTRACOLD_MINUS_80 -> [-90, -70]
      Shipment.temp_min_celsius = max over order lines of band.min
      Shipment.temp_max_celsius = min over order lines of band.max
    input_set: "all OrderLine rows of the order, any status except CANCELLED"
    constants:
      BAND_AMBIENT: [15, 25]
      BAND_REFRIGERATED_2_8: [2, 8]
      BAND_FROZEN_MINUS_20: [-25, -15]
      BAND_ULTRACOLD_MINUS_80: [-90, -70]
    precision: "0.1 degree"

  - name: fefo_allocation_selection
    trigger: "order submit / reallocate / waitlist retry for lines with fulfillment_mode == ANY"
    algorithm: waterfall_allocation
    formula: |
      Eligibility filter: ReagentLot rows where status == AVAILABLE
        AND product_id == line.product_id
        AND warehouse_id == order.warehouse_id
        AND StorageZone(lot.storage_zone_id).zone_class is at-or-colder than
            product.storage_requirement per coldness ordering
            AMBIENT > REFRIGERATED_2_8 > FROZEN_MINUS_20 > ULTRACOLD_MINUS_80
            (a lot is eligible only when zone_class coldness >= requirement coldness)
        AND (lot.expiry_date - order.requested_ship_date) >= product.min_remaining_shelf_life_days
      Ranking: when the lot's zone rotation_policy == FEFO: expiry_date ASC,
        tie-break received_at ASC, tie-break lot_sequence_number ASC.
        When rotation_policy == FIFO: received_at ASC, tie-break lot_sequence_number ASC.
        (All lots of one product at one warehouse are assumed co-located under one
        rotation policy; if mixed, FEFO-ranked lots precede FIFO-ranked lots.)
      Waterfall: take min(remaining_need, lot.quantity_on_hand) from the first
      ranked lot, then proceed down the ranking until remaining_need == 0 or the
      candidate set is empty.
      Empty-pool fallback: whatever was gathered persists as partial HELD
      reservations; the line stays PENDING or PARTIALLY_ALLOCATED.
    input_set: "AVAILABLE lots for (product_id, warehouse_id) as filtered above"
    precision: "integer units"

  - name: sequential_lot_run_selection
    trigger: "order submit / reallocate / waitlist retry for lines with fulfillment_mode == SEQUENTIAL"
    algorithm: waterfall_allocation
    formula: |
      Eligibility filter: identical to fefo_allocation_selection.
      A candidate run is a set of eligible lots whose lot_sequence_number values
      are strictly consecutive (each exactly 1 greater than the previous).
      Ranking: among all runs whose summed quantity_on_hand >= line.quantity,
        prefer the run with the FEWEST lots;
        tie-break: lowest starting lot_sequence_number;
        tie-break: earliest expiry_date of the run's first lot.
      Waterfall inside the chosen run: consume from the lowest lot_sequence_number
      upward, taking min(remaining_need, lot.quantity_on_hand) per lot.
      Empty-pool fallback: no run satisfies the quantity -> the line receives NO
      reservations and stays PENDING (sequential lines never partially allocate).
    input_set: "AVAILABLE lots for (product_id, warehouse_id) as filtered above"
    precision: "integer units"

  - name: order_pricing
    trigger: "POST /lab/orders/{orderId}/submit (validation phase)"
    algorithm: aggregation
    formula: |
      For each OrderLine (rounding order is PINNED — per line first, then sum):
        unit_price_cents = Product.unit_price_cents at submit time (snapshot)
        line_total_cents = round_half_up(quantity * unit_price_cents
                           * (1 - CustomerAccount.volume_discount_pct))
      Order.product_total_cents = sum of line_total_cents over all lines.
      (Sum-then-round is FORBIDDEN: 2 lines of qty 1 at 105 cents with 10%
      discount yield 95 + 95 = 190, not round_half_up(189.0) = 189.)
    input_set: "all OrderLine rows of the order"
    precision: "integer cents, round_half_up per line"

  - name: freight_cost
    trigger: "shipment creation (provisional) and dispatch (final)"
    algorithm: tiered_pricing
    formula: |
      base_cents: STANDARD -> 800, EXPRESS -> 1500, PRIORITY_OVERNIGHT -> 2500
      weight: first 5000 g included in base; each additional started kilogram
        costs 120 cents: extra = max(0, ceil((weight_grams - 5000) / 1000)) * 120
      coolant_cents: NONE -> 0; GEL_PACK -> 150 per unit; DRY_ICE -> 400 per unit
      subtotal = base_cents + weight_extra + coolant_cents
      hazmat_surcharge = when any order line's product has hazard_class !=
        NON_HAZARDOUS: round_half_up(subtotal * 0.25); else 0
      total = subtotal + hazmat_surcharge
      total = max(total, MIN_FREIGHT_CENTS)
      Free freight: when Order.product_total_cents >= FREE_FREIGHT_THRESHOLD_CENTS
        the total is 0 (floor and surcharges skipped entirely).
    input_set: "the shipment, its order's lines, and the order's product_total_cents"
    constants:
      MIN_FREIGHT_CENTS: 500
      FREE_FREIGHT_THRESHOLD_CENTS: 250000
      HAZMAT_SURCHARGE_PCT: 0.25
      WEIGHT_INCLUDED_GRAMS: 5000
      WEIGHT_RATE_PER_STARTED_KG_CENTS: 120
      GEL_PACK_UNIT_CENTS: 150
      DRY_ICE_UNIT_CENTS: 400
    precision: "integer cents, round_half_up on the surcharge"
    variants:
      - name: provisional
        when: "at shipment creation"
        difference: "uses declared_weight_grams; result stored on provisional_freight_cents"
      - name: final
        when: "at dispatch"
        difference: "uses actual_weight_grams; result stored on final_freight_cents and is the invoiced freight"

  - name: hazmat_load_check
    trigger: "POST /lab/shipments (creation)"
    algorithm: constraint_propagation
    formula: |
      For each hazard class HC in {FLAMMABLE, CORROSIVE, TOXIC, OXIDIZER}:
        class_load[HC] = sum over order lines whose product.hazard_class == HC
                         of (line.quantity * product.unit_haz_factor)
        class_load[HC] must be <= HAZ_CLASS_CAP[HC]     -> ERR_HAZMAT_CLASS_LIMIT_EXCEEDED
      For each line whose product.hazard_class != NON_HAZARDOUS:
        line.quantity must be <= product.max_qty_per_shipment
                                                        -> ERR_HAZMAT_PRODUCT_LIMIT_EXCEEDED
      total_haz = sum of class_load over all four classes
      total_haz must be <= TOTAL_HAZ_CAP                 -> ERR_HAZMAT_TOTAL_LIMIT_EXCEEDED
      Dry ice is itself a dangerous good: when coolant_type == DRY_ICE,
        coolant_units must be <= DRY_ICE_CAP             -> ERR_DRY_ICE_LIMIT_EXCEEDED
    input_set: "all OrderLine rows of the shipment's order plus coolant declaration"
    constants:
      HAZ_CLASS_CAP: { FLAMMABLE: 30, CORROSIVE: 30, TOXIC: 10, OXIDIZER: 10 }
      TOTAL_HAZ_CAP: 50
      DRY_ICE_CAP: 20
    precision: "integer load units"

  - name: excursion_severity
    trigger: "POST /lab/shipments/{shipmentId}/record-temperature with an out-of-band reading"
    algorithm: threshold
    formula: |
      deviation_degrees = temp_celsius > temp_max ? temp_celsius - temp_max
                        : temp_celsius < temp_min ? temp_min - temp_celsius : 0
      A reading with deviation_degrees == 0 creates no excursion.
      severity = CRITICAL when deviation_degrees > 5.0 OR duration_minutes >= 240
               else MAJOR  when deviation_degrees > 2.0 OR duration_minutes >= 60
               else MINOR
    input_set: "the reading and the shipment's temp band"
    constants:
      CRITICAL_DEVIATION: 5.0
      CRITICAL_DURATION_MINUTES: 240
      MAJOR_DEVIATION: 2.0
      MAJOR_DURATION_MINUTES: 60
    precision: "0.1 degree; whole minutes"

  - name: excursion_credit
    trigger: "excursion creation (provisional) and disposition (final)"
    algorithm: aggregation
    formula: |
      affected_value_cents = sum of line_total_cents over the shipment's order
        lines whose product.requires_cold_chain == true.
      provisional (at OPEN): provisional_credit_cents =
        round_half_up(affected_value_cents * 0.5)
      final (at disposition):
        ACCEPTED  -> 0
        DESTROYED -> affected_value_cents
        RETURNED  -> Shipment.final_freight_cents + round_half_up(affected_value_cents * 0.25)
      final_credit_cents is the credit-memo record of the refund basis; the
      actual balance movement is the full invoice reversal on Order -> REFUNDED.
    input_set: "the shipment's order lines, shipment final freight, disposition decision"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "excursion opened"
        difference: "50% estimate stored on provisional_credit_cents before any review"
      - name: final
        when: "disposition recorded"
        difference: "decision-dependent exact credit stored on final_credit_cents"

  - name: customer_outstanding_and_credit
    trigger: "dispatch invoice, payment, refund reversal, consumption record"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
          sum over the customer's Orders with status IN {SHIPPED, DELIVERED}
            of (product_total_cents + shipment.final_freight_cents)
        + sum over ConsumptionRecord rows of the customer's agreements of charge_cents
        - sum over Payment rows (POST /lab/customers/{id}/payments) of amount_cents
      (REFUNDED orders contribute 0 — the reversal removes them from the set.)
      Credit pre-check at submit: outstanding_balance_cents
        + projected product_total_cents
        + projected freight estimate, defined as the base_cents of the order's
          own shipping_service with weight_grams = 0 and coolant NONE (no
          hazmat surcharge, floor applies, free-freight threshold applies to
          the projected product_total)
        must be <= credit_limit_cents, else ERR_CREDIT_LIMIT_EXCEEDED.
    input_set: "customer's shipped orders, consumption records, payments"
    precision: "integer cents"

  - name: auto_suspension_check
    trigger: "after a dispatch invoice posts"
    algorithm: threshold
    formula: |
      when outstanding_balance_cents > credit_limit_cents * 1.2
        CustomerAccount transitions ACTIVE -> SUSPENDED (system).
      Strictly greater: outstanding exactly equal to 1.2 * limit does NOT suspend.
    input_set: "the invoiced customer"
    constants:
      SUSPENSION_RATIO: 1.2
    precision: "integer cents (ratio applied as outstanding * 10 > credit_limit * 12)"

  - name: consignment_billing
    trigger: "POST /lab/consignment-agreements/{agreementId}/consumption"
    algorithm: aggregation
    formula: |
      charge_cents = round_half_up(quantity * contract_unit_price_cents
                     * (1 - discount_pct))
      CustomerAccount.outstanding_balance_cents += charge_cents
      ConsignmentAgreement.consumed_quantity += quantity
      Rounding is per record (never summed-then-rounded across records).
    input_set: "the agreement and the consumption quantity"
    precision: "integer cents, round_half_up per record"

  - name: consignment_replenishment
    trigger: "after a consumption record posts"
    algorithm: threshold
    formula: |
      on_hand_at_customer = stocked_quantity - consumed_quantity
      when on_hand_at_customer <= reorder_point AND agreement.status == ACTIVE:
        create a replenishment Order for the agreement's customer at the
        agreement's replenishment_warehouse_id with quantity =
        ceiling_quantity - on_hand_at_customer and auto-submit it
        (standing_order-style generated order, fulfillment mode ANY,
        shipping_service STANDARD, requested_ship_date = current
        logical date + 1 day).
      Boundary: on_hand exactly == reorder_point triggers.
    input_set: "the agreement after the consumption posting"
    precision: "integer units"

  - name: kit_price_rollup
    trigger: "POST /lab/kits/{kitId}/activate"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved):
        step 1: component_cost = sum over components of
                (quantity_per_kit * Product.unit_price_cents)
        step 2: assembly_fee = FEE_TIER keyed on component_cost BEFORE any fee
                is added: component_cost < 100000 -> 1500;
                100000 <= component_cost < 500000 -> 4000;
                component_cost >= 500000 -> 9000
        step 3: kit_price_cents = component_cost + assembly_fee
      The fee tier NEVER sees the fee-inclusive price — no iteration.
    input_set: "the kit's components and their products' current unit prices"
    constants:
      FEE_TIER_1_CAP: 100000
      FEE_TIER_1_CENTS: 1500
      FEE_TIER_2_CAP: 500000
      FEE_TIER_2_CENTS: 4000
      FEE_TIER_3_CENTS: 9000
    precision: "integer cents"

  - name: standing_order_run_generation
    trigger: "POST /lab/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      Process StandingOrder rows with status == ACTIVE in created_at ASC order
      (tie-break: the per-system creation counter on the row, ascending).
      For each: while next_run_date <= current logical date AND
      next_run_date <= effective_until:
        generate one Order (customer_id, product_id, the standing order's
        warehouse_id, quantity_per_run, fulfillment_mode ANY,
        shipping_service STANDARD,
        requested_ship_date = next_run_date) and auto-submit it;
        when submit-time validation fails, the generated order stays DRAFT and
        the standing order transitions ACTIVE -> PAUSED (no further runs);
        otherwise generated_order_count += 1 and next_run_date += interval_days.
      Catch-up generates at most one order per due run date, in date order.
    input_set: "StandingOrder rows with status == ACTIVE"
    precision: "whole ISO days"

  - name: zone_occupancy
    trigger: "lot receipt, lot quarantine/release, reservation movements, lot pull, kit consumption"
    algorithm: aggregation
    formula: |
      StorageZone.occupied_units = sum of quantity_on_hand over ReagentLot rows
      with storage_zone_id == zone AND status IN {AVAILABLE, QUARANTINED}.
      Putaway validation at receipt: occupied_units + new quantity must be
      <= capacity_units; equality is allowed (100 into capacity 100 fits).
    input_set: "lots of the zone with status IN {AVAILABLE, QUARANTINED}"
    precision: "integer units"

  - name: consignment_window_overlap
    trigger: "POST /lab/consignment-agreements"
    algorithm: interval_merge
    formula: |
      For the same (customer_id, product_id), consider existing agreements with
      status IN {ACTIVE, SUSPENDED}. The new window [effective_from,
      effective_until) is half-open: overlap exists when
      existing.effective_from < new.effective_until
      AND new.effective_from < existing.effective_until.
      Adjacency is allowed: new.effective_from == existing.effective_until is
      NOT an overlap. Overlap -> ERR_CONSIGNMENT_WINDOW_OVERLAP.
    input_set: "agreements of the same (customer, product) with status IN {ACTIVE, SUSPENDED}"
    precision: "whole ISO days, half-open [from, until)"

  - name: standing_order_window_buffer
    trigger: "POST /lab/standing-orders"
    algorithm: interval_merge
    formula: |
      For the same (customer_id, product_id), consider existing standing orders
      with status IN {ACTIVE, PAUSED}. Windows use INCLUSIVE end dates. The new
      window must clear every existing window by a buffer of >= 7 days:
      new.effective_from >= existing.effective_until + 7 days
        OR new.effective_until <= existing.effective_from - 7 days.
      A 6-day gap (or any overlap) -> ERR_STANDING_ORDER_WINDOW_CONFLICT;
      a gap of exactly 7 days passes.
    input_set: "standing orders of the same (customer, product) with status IN {ACTIVE, PAUSED}"
    constants:
      WINDOW_BUFFER_DAYS: 7
    precision: "whole ISO days, inclusive ends"

  - name: shelf_life_gate
    trigger: "allocation (inside fefo_allocation_selection / sequential_lot_run_selection eligibility)"
    algorithm: threshold
    formula: |
      A lot is allocatable for an order only when
      (lot.expiry_date - order.requested_ship_date) >= product.min_remaining_shelf_life_days.
      Equality is allocatable; one day less is not.
    input_set: "candidate lot, order.requested_ship_date, product"
    precision: "whole ISO days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role must appear in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: when the role is Customer, the X-User-ID must equal the customer_id of the resource being mutated or read-scoped (order submit/cancel/reallocate, reservation release, standing-order create/pause/resume/cancel, consignment consumption). When the target resource id does not exist, ownership is unevaluable and the existence check at priority 4 reports the 404"
    error_id: ERR_RESOURCE_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "Customer-role mutation endpoints"

  - priority: 4
    category: existence
    check: "Path template ids must exist, validated left-to-right; body-referenced ids must exist, in the endpoint's declared input order"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (per-resource 404)"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: existence
    check: "Request body well-formedness: required fields present, types match, enum members valid, integer fields positive where declared, ISO dates parseable, effective_until after effective_from where applicable, no unknown fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version on the three OCC endpoints"
    error_id: "ERR_STALE_LOT_VERSION | ERR_STALE_ORDER_VERSION | ERR_STALE_CUSTOMER_VERSION"
    http_status: 412
    applies_to: "POST /lab/lots/{lotId}/adjustments; POST /lab/orders/{orderId}/reallocate; PATCH /lab/customers/{customerId}"

  - priority: 7
    category: state
    check: "State-machine from-state validity for the attempted transition (per §1.2 preconditions)"
    error_id: "per-transition state error (e.g. ERR_ORDER_NOT_SUBMITTABLE, ERR_LOT_NOT_QUARANTINED)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: business_safety
    check: "Hazmat endorsement: order submit requires customer.hazmat_endorsement to cover every line product's hazard_class — NONE covers only NON_HAZARDOUS; LIMITED covers FLAMMABLE and CORROSIVE; FULL covers everything"
    error_id: ERR_HAZMAT_ENDORSEMENT_INSUFFICIENT
    http_status: 403
    applies_to: "POST /lab/orders/{orderId}/submit"

  - priority: 9
    category: business_safety
    check: "Cold-chain certification: order submit with any line whose product.requires_cold_chain == true requires customer.cold_chain_certified == true"
    error_id: ERR_COLD_CHAIN_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /lab/orders/{orderId}/submit"

  - priority: 10
    category: business_safety
    check: "Hazmat warehouse certification: shipment creation for an order containing any hazard_class != NON_HAZARDOUS line requires the order's warehouse hazmat_certified == true; lot receipt of a hazard_class != NON_HAZARDOUS product requires the warehouse hazmat_certified == true"
    error_id: ERR_HAZMAT_WAREHOUSE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /lab/shipments; POST /lab/lots"

  - priority: 11
    category: business_safety
    check: "Hazmat load limits per hazmat_load_check: per-product max_qty_per_shipment, per-class caps, total cap, dry-ice cap"
    error_id: "ERR_HAZMAT_PRODUCT_LIMIT_EXCEEDED | ERR_HAZMAT_CLASS_LIMIT_EXCEEDED | ERR_HAZMAT_TOTAL_LIMIT_EXCEEDED | ERR_DRY_ICE_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /lab/shipments"

  - priority: 12
    category: business_safety
    check: "Recall block: no order submit, kit activation, or consignment consumption may reference a product covered by an ISSUED recall (scope match); no lot release-quarantine while an ISSUED recall covers the lot"
    error_id: ERR_PRODUCT_UNDER_RECALL
    http_status: 409
    applies_to: "POST /lab/orders/{orderId}/submit; POST /lab/kits/{kitId}/activate; POST /lab/consignment-agreements/{agreementId}/consumption; POST /lab/lots/{lotId}/release-quarantine (as ERR_RECALL_ACTIVE_FOR_LOT)"

  - priority: 13
    category: business_temporal
    check: "Shelf-life gate at submit: for any line, when at least one AVAILABLE lot of the line's product exists at the order's warehouse with quantity_on_hand > 0 but every such lot fails shelf_life_gate, the submit is rejected outright (no silent backorder); otherwise gated lots are simply skipped by allocation"
    error_id: ERR_SHELF_LIFE_TOO_SHORT
    http_status: 409
    applies_to: "POST /lab/orders/{orderId}/submit"

  - priority: 14
    category: business_temporal
    check: "Standing-order window buffer per standing_order_window_buffer"
    error_id: ERR_STANDING_ORDER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lab/standing-orders"

  - priority: 15
    category: business_temporal
    check: "Consignment window overlap per consignment_window_overlap"
    error_id: ERR_CONSIGNMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /lab/consignment-agreements"

  - priority: 16
    category: business_constraint
    check: "Storage compatibility at lot receipt: the zone's zone_class must be at-or-colder than the product's storage_requirement"
    error_id: ERR_STORAGE_ZONE_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /lab/lots"

  - priority: 17
    category: business_constraint
    check: "Zone capacity at lot receipt per zone_occupancy: occupied_units + quantity <= capacity_units"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lab/lots"

  - priority: 18
    category: business_constraint
    check: "Zone belongs to the declared warehouse at lot receipt: StorageZone.warehouse_id must equal the body's warehouse_id"
    error_id: ERR_ZONE_WAREHOUSE_MISMATCH
    http_status: 409
    applies_to: "POST /lab/lots"

  - priority: 18.5
    category: business_constraint
    check: "Stock adjustment may not drive quantity_on_hand below zero"
    error_id: ERR_ADJUSTMENT_BELOW_ZERO
    http_status: 409
    applies_to: "POST /lab/lots/{lotId}/adjustments"

  - priority: 18.6
    category: state
    check: "record-temperature requires Shipment.status IN {IN_TRANSIT, EXCURSION_HOLD} (telemetry continues while held); a reading whose deviation_degrees > 0 while a TemperatureExcursion of this shipment has status == OPEN is rejected ERR_EXCURSION_ALREADY_OPEN; an in-band reading is accepted without creating an excursion"
    error_id: "ERR_SHIPMENT_NOT_IN_TRANSIT | ERR_EXCURSION_ALREADY_OPEN"
    http_status: 409
    applies_to: "POST /lab/shipments/{shipmentId}/record-temperature"

  - priority: 19
    category: business_constraint
    check: "Kit activation structural rules: components non-empty; no duplicate component product_id; all components share one storage_requirement"
    error_id: "ERR_KIT_COMPONENTS_EMPTY | ERR_KIT_DUPLICATE_COMPONENT | ERR_KIT_STORAGE_MIXED"
    http_status: 422
    applies_to: "POST /lab/kits (duplicate check), POST /lab/kits/{kitId}/activate (empty + mixed checks)"

  - priority: 20
    category: business_constraint
    check: "Shipment uniqueness: an order may have exactly one Shipment row over its lifetime"
    error_id: ERR_SHIPMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /lab/shipments"

  - priority: 21
    category: business_referential
    check: "Kit components must reference existing LISTED products at activation; order lines must reference existing LISTED products at submit"
    error_id: ERR_PRODUCT_NOT_LISTED
    http_status: 409
    applies_to: "POST /lab/kits/{kitId}/activate; POST /lab/orders/{orderId}/submit"

  - priority: 22
    category: business_fiscal
    check: "Consignment ceiling: a consumption record may not push consumed_quantity above ceiling_quantity (consumed + quantity <= ceiling)"
    error_id: ERR_CONSIGNMENT_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /lab/consignment-agreements/{agreementId}/consumption"

  - priority: 23
    category: business_fiscal
    check: "Consumption may not exceed on-hand at customer: quantity <= stocked_quantity - consumed_quantity"
    error_id: ERR_CONSUMPTION_EXCEEDS_STOCK
    http_status: 409
    applies_to: "POST /lab/consignment-agreements/{agreementId}/consumption"

  - priority: 24
    category: business_fiscal
    check: "Credit pre-check at order submit per customer_outstanding_and_credit"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /lab/orders/{orderId}/submit"

  - priority: 25
    category: business_fiscal
    check: "Kit assembly sufficiency per KitAssemblyJob COMPLETED precondition"
    error_id: ERR_KIT_COMPONENT_SHORTAGE
    http_status: 409
    applies_to: "POST /lab/kit-assembly-jobs/{jobId}/execute"

  - priority: 26
    category: business_fiscal
    check: "Customer close preconditions: no orders with status IN {DRAFT, ALLOCATED, BACKORDERED, PACKED, SHIPPED}, no agreements with status == ACTIVE, outstanding_balance_cents == 0"
    error_id: "ERR_OPEN_ORDERS_EXIST | ERR_OPEN_AGREEMENTS_EXIST | ERR_OUTSTANDING_BALANCE_NONZERO"
    http_status: 409
    applies_to: "POST /lab/customers/{customerId}/close"

# =============================================================================
# §1.5 API Endpoint Table
# GET endpoints list every role; Customer reads are scoped to rows whose
# customer_id == X-User-ID wherever such a field exists.
# =============================================================================
endpoints:
  # --- Warehouses ---
  - method: POST
    path: "/lab/warehouses"
    description: "Create a warehouse"
    roles: [OpsAdmin]
    code: 201
    input: [name, region_code, hazmat_certified]
    output: Warehouse
    side_effects: ["status = OPERATIONAL"]
  - method: GET
    path: "/lab/warehouses"
    description: "List warehouses (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Warehouse[]"
    side_effects: []
  - method: GET
    path: "/lab/warehouses/{warehouseId}"
    description: "Get one warehouse"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: Warehouse
    side_effects: []
  - method: POST
    path: "/lab/warehouses/{warehouseId}/suspend"
    description: "Suspend a warehouse (blocks dispatch)"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Warehouse
    side_effects: ["status OPERATIONAL -> SUSPENDED", "increments Warehouse.version by 1"]
  - method: POST
    path: "/lab/warehouses/{warehouseId}/resume"
    description: "Resume a suspended warehouse"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Warehouse
    side_effects: ["status SUSPENDED -> OPERATIONAL", "increments Warehouse.version by 1"]

  # --- Storage Zones ---
  - method: POST
    path: "/lab/storage-zones"
    description: "Create a storage zone in a warehouse"
    roles: [OpsAdmin]
    code: 201
    input: [warehouse_id, zone_class, capacity_units, "rotation_policy?"]
    output: StorageZone
    side_effects: ["occupied_units = 0"]
  - method: GET
    path: "/lab/storage-zones"
    description: "List storage zones (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["warehouse_id?", "zone_class?", "limit?", "offset?"]
    output: "StorageZone[]"
    side_effects: []
  - method: GET
    path: "/lab/storage-zones/{zoneId}"
    description: "Get one storage zone"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: StorageZone
    side_effects: []

  # --- Products ---
  - method: POST
    path: "/lab/products"
    description: "Create a catalog product"
    roles: [CatalogManager]
    code: 201
    input: [sku, name, storage_requirement, hazard_class, max_qty_per_shipment, unit_price_cents, requires_cold_chain, shelf_life_days, "unit_haz_factor?", "min_remaining_shelf_life_days?"]
    output: Product
    side_effects: ["status = LISTED"]
  - method: GET
    path: "/lab/products"
    description: "List products (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["status?", "hazard_class?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/lab/products/{productId}"
    description: "Get one product"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/lab/products/{productId}/discontinue"
    description: "Discontinue a product (terminal)"
    roles: [CatalogManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status -> DISCONTINUED", "increments Product.version by 1"]

  # --- Reagent Lots ---
  - method: POST
    path: "/lab/lots"
    description: "Receive a reagent lot into a zone; assigns lot_sequence_number and expiry_date; retries BACKORDERED orders in submission_seq ASC order after receipt"
    roles: [InventoryClerk]
    code: 201
    input: [product_id, warehouse_id, storage_zone_id, quantity_received, manufacture_date]
    output: ReagentLot
    side_effects:
      - "lot_sequence_assignment, expiry_date_derivation, zone_occupancy (capacity check first)"
      - "status = AVAILABLE unless receipt quantity drives on_hand to 0"
      - "system waitlist retry: BACKORDERED orders in submission_seq ASC order are re-allocated per fefo_allocation_selection / sequential_lot_run_selection"
  - method: GET
    path: "/lab/lots"
    description: "List lots (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["product_id?", "warehouse_id?", "storage_zone_id?", "recall_id?", "status?", "limit?", "offset?"]
    output: "ReagentLot[]"
    side_effects: []
  - method: GET
    path: "/lab/lots/{lotId}"
    description: "Get one lot"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: ReagentLot
    side_effects: []
  - method: POST
    path: "/lab/lots/{lotId}/adjustments"
    description: "Stock-count adjustment against a lot (OCC on expected_lot_version)"
    roles: [InventoryClerk]
    code: 201
    input: [delta, reason, expected_lot_version]
    output: ReagentLot
    side_effects:
      - "quantity_on_hand += delta; adjustment_total += delta; result must keep quantity_on_hand >= 0 (ERR_ADJUSTMENT_BELOW_ZERO)"
      - "quantity_on_hand reaching exactly 0 transitions AVAILABLE -> DEPLETED"
      - "zone_occupancy recomputed"
      - "increments ReagentLot.version by 1"
  - method: POST
    path: "/lab/lots/{lotId}/quarantine"
    description: "Manually quarantine an AVAILABLE lot"
    roles: [QualityManager]
    code: 200
    input: []
    output: ReagentLot
    side_effects: ["status AVAILABLE -> QUARANTINED with the reservation-release cascade", "increments ReagentLot.version by 1"]
  - method: POST
    path: "/lab/lots/{lotId}/release-quarantine"
    description: "Release a quarantined lot back to AVAILABLE (blocked while an ISSUED recall covers the lot)"
    roles: [QualityManager]
    code: 200
    input: []
    output: ReagentLot
    side_effects: ["status QUARANTINED -> AVAILABLE", "increments ReagentLot.version by 1"]

  # --- Customer Accounts ---
  - method: POST
    path: "/lab/customers"
    description: "Open a customer account"
    roles: [AccountManager]
    code: 201
    input: [name, credit_limit_cents, "volume_discount_pct?", "hazmat_endorsement?", "cold_chain_certified?"]
    output: CustomerAccount
    side_effects: ["status = ACTIVE", "outstanding_balance_cents = 0"]
  - method: GET
    path: "/lab/customers"
    description: "List customer accounts (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: GET
    path: "/lab/customers/{customerId}"
    description: "Get one customer account"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: PATCH
    path: "/lab/customers/{customerId}"
    description: "Update commercial terms (OCC on expected_customer_version)"
    roles: [AccountManager]
    code: 200
    input: ["credit_limit_cents?", "volume_discount_pct?", "hazmat_endorsement?", "cold_chain_certified?", expected_customer_version]
    output: CustomerAccount
    side_effects: ["applies provided fields", "increments CustomerAccount.version by 1"]
  - method: POST
    path: "/lab/customers/{customerId}/suspend"
    description: "Suspend an account"
    roles: [AccountManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status ACTIVE -> SUSPENDED", "increments CustomerAccount.version by 1"]
  - method: POST
    path: "/lab/customers/{customerId}/reactivate"
    description: "Reactivate a suspended account (requires outstanding <= credit limit)"
    roles: [AccountManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status SUSPENDED -> ACTIVE", "increments CustomerAccount.version by 1"]
  - method: POST
    path: "/lab/customers/{customerId}/close"
    description: "Close an account (terminal; requires no live orders, no ACTIVE agreements, zero balance)"
    roles: [AccountManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> CLOSED", "increments CustomerAccount.version by 1"]
  - method: POST
    path: "/lab/customers/{customerId}/payments"
    description: "Record a payment reducing outstanding balance"
    roles: [AccountManager]
    code: 201
    input: [amount_cents]
    output: CustomerAccount
    side_effects: ["outstanding_balance_cents -= amount_cents (floor 0 per customer_outstanding_and_credit)", "increments CustomerAccount.version by 1"]

  # --- Orders ---
  - method: POST
    path: "/lab/orders"
    description: "Create a DRAFT order with its lines materialized as OrderLine rows"
    roles: [Customer]
    code: 201
    input: [customer_id, warehouse_id, shipping_service, requested_ship_date, lines]
    output: Order
    side_effects: ["status = DRAFT", "OrderLine rows created with status PENDING"]
  - method: GET
    path: "/lab/orders"
    description: "List orders (paginated; Customer role sees only own)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["customer_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: GET
    path: "/lab/orders/{orderId}"
    description: "Get one order"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/lab/orders/{orderId}/submit"
    description: "Validate, price, and allocate an order; lands ALLOCATED or BACKORDERED"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["order_pricing snapshot", "allocation run creating HELD reservations", "DEPLETED auto-transition for emptied lots", "submission_seq assigned", "increments Order.version by 1"]
  - method: POST
    path: "/lab/orders/{orderId}/reallocate"
    description: "Release current reservations and re-run allocation (OCC on expected_order_version)"
    roles: [Customer]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["HELD reservations RELEASED with quantity compensation, then full allocation re-run", "increments Order.version by 1"]
  - method: POST
    path: "/lab/orders/{orderId}/cancel"
    description: "Cancel a pre-pack order, releasing all HELD reservations"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["reservations RELEASED with quantity compensation", "lines -> CANCELLED", "increments Order.version by 1"]
  - method: GET
    path: "/lab/orders/{orderId}/cost-summary"
    description: "Computed read: product_total_cents, provisional/final freight, freight-to-product ratio, projected credit impact"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: "{ product_total_cents: integer, provisional_freight_cents: integer, final_freight_cents: integer, freight_to_product_ratio: number, projected_outstanding_cents: integer }"
    side_effects: []

  # --- Order Lines (read-only surface; created with the order) ---
  - method: GET
    path: "/lab/order-lines"
    description: "List order lines (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["order_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/lab/order-lines/{orderLineId}"
    description: "Get one order line"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  # --- Lot Reservations ---
  - method: GET
    path: "/lab/reservations"
    description: "List lot reservations (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["order_line_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: "LotReservation[]"
    side_effects: []
  - method: GET
    path: "/lab/reservations/{reservationId}"
    description: "Get one reservation"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: LotReservation
    side_effects: []
  - method: POST
    path: "/lab/reservations/{reservationId}/release"
    description: "Manually release a HELD reservation back to the lot"
    roles: [Customer, InventoryClerk]
    code: 200
    input: []
    output: LotReservation
    side_effects: ["status HELD -> RELEASED with quantity compensation", "parent line/order allocation recompute and possible demotion", "increments LotReservation.version by 1"]

  # --- Shipments ---
  - method: POST
    path: "/lab/shipments"
    description: "Create a shipment for an ALLOCATED order; computes temp band, provisional freight, and runs the hazmat load check"
    roles: [InventoryClerk]
    code: 201
    input: [order_id, coolant_type, coolant_units, declared_weight_grams]
    output: Shipment
    side_effects:
      - "storage_band_mapping computes temp_min_celsius / temp_max_celsius"
      - "freight_cost variant=provisional -> provisional_freight_cents"
      - "hazmat_load_check runs before creation completes"
      - "status = CREATED"
  - method: GET
    path: "/lab/shipments"
    description: "List shipments (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/lab/shipments/{shipmentId}"
    description: "Get one shipment"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/lab/shipments/{shipmentId}/pack"
    description: "Pack the shipment: commits reservations, fulfills lines, moves order to PACKED"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["reservations HELD -> COMMITTED", "lines -> FULFILLED", "Order ALLOCATED -> PACKED", "increments Shipment.version by 1"]
  - method: POST
    path: "/lab/shipments/{shipmentId}/dispatch"
    description: "Dispatch: captures actual weight, computes final freight, consumes reservations, invoices the customer"
    roles: [InventoryClerk]
    code: 200
    input: [actual_weight_grams]
    output: Shipment
    side_effects: ["freight_cost variant=final -> final_freight_cents", "reservations COMMITTED -> CONSUMED", "Order PACKED -> SHIPPED", "invoice posts to outstanding_balance_cents", "auto_suspension_check", "consignment stocked_quantity increments", "increments Shipment.version by 1"]
  - method: POST
    path: "/lab/shipments/{shipmentId}/record-temperature"
    description: "Record a transit temperature reading; an out-of-band reading opens a TemperatureExcursion and moves the shipment to EXCURSION_HOLD"
    roles: [InventoryClerk]
    code: 201
    input: [temp_celsius, duration_minutes]
    output: "{ excursion_created: boolean, excursion_id: string, severity: string, shipment_status: string }"
    side_effects: ["excursion_severity classification", "on breach: TemperatureExcursion created (OPEN, provisional credit) and Shipment IN_TRANSIT -> EXCURSION_HOLD", "ERR_EXCURSION_ALREADY_OPEN when an excursion of this shipment is still OPEN"]
  - method: POST
    path: "/lab/shipments/{shipmentId}/resume-transit"
    description: "Resume transit after an ACCEPTED excursion disposition"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status EXCURSION_HOLD -> IN_TRANSIT", "increments Shipment.version by 1"]
  - method: POST
    path: "/lab/shipments/{shipmentId}/deliver"
    description: "Deliver an in-transit shipment (blocked while an excursion is OPEN)"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status IN_TRANSIT -> DELIVERED", "Order SHIPPED -> DELIVERED", "increments Shipment.version by 1"]

  # --- Temperature Excursions ---
  - method: GET
    path: "/lab/excursions"
    description: "List temperature excursions (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["shipment_id?", "status?", "severity?", "limit?", "offset?"]
    output: "TemperatureExcursion[]"
    side_effects: []
  - method: GET
    path: "/lab/excursions/{excursionId}"
    description: "Get one excursion"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: []
  - method: POST
    path: "/lab/excursions/{excursionId}/disposition"
    description: "Disposition an OPEN excursion; final credit and the shipment/order/customer cascade fire per decision"
    roles: [QualityManager]
    code: 200
    input: [decision]
    output: TemperatureExcursion
    side_effects: ["excursion_credit variant=final -> final_credit_cents", "ACCEPTED: no shipment movement; DESTROYED/RETURNED: Shipment -> RETURNED, Order -> REFUNDED, invoice reversal posts", "increments TemperatureExcursion.version by 1"]

  # --- Standing Orders ---
  - method: POST
    path: "/lab/standing-orders"
    description: "Create a standing order (window buffer rule applies)"
