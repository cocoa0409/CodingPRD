        distinguishing_aspect: "Submitting with fai_dimensional_pass false returns 422 ERR_FAI_NOT_PASSED, and so does a true verdict backed by only 29 sample shots, because MIN_FAI_SAMPLE_SHOTS is 30 and the gate is >=."
        test_recipe:
