  - rule_id: priority_pair_validation_conflict
    instances:
      - name: visit_state_check_precedes_grant_funds_check_on_installation
        grounds:
          - validations[priority 9 - state - ERR_INVALID_VISIT_STATE]
          - validations[priority 33 - business_fiscal - ERR_GRANT_FUNDS_EXHAUSTED]
          - errors.ERR_INVALID_VISIT_STATE
          - errors.ERR_GRANT_FUNDS_EXHAUSTED
        distinguishing_aspect: |
          Error-category pair state (409) vs business_fiscal (402): both rules are violated by one
          POST /crr/installations because the visit is already COMPLETED and the grant only has 1000
          cents against a 1850-cent lot. The 409 must win and no money or stock may move.
