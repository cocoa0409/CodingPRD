            - call: "POST /inspection-records/${rec_a}/screening"
              payload: { expected_watercraft_version: "${wc_a_version}", residual_water_present: true, standing_water_ml: 500 }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection-records/${rec_a}/disposition"
              payload: { disposition: "DECON" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_a_version: $.data.version }
            - call: "POST /decon-orders"
              payload: { inspection_record_id: "${rec_a}", expected_inspection_record_version: "${rec_a_version}" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { ord_a: $.data.id }
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_b}", arrived_at: "2026-08-05T09:30:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_b: $.data.id }
            - call: "POST /inspection-records/${rec_b}/screening"
              payload: { expected_watercraft_version: "${wc_b_version}", residual_water_present: true, standing_water_ml: 500 }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection-records/${rec_b}/disposition"
              payload: { disposition: "DECON" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_b_version: $.data.version }
            - call: "POST /decon-orders"
              payload: { inspection_record_id: "${rec_b}", expected_inspection_record_version: "${rec_b_version}" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { ord_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-31T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /decon-orders/${ord_a}/treatment"
              payload: { water_temp_f: 140, pressure_psi: 3000, dwell_seconds: 120 }
              as: DeconTechnician
              as_user_id: "${insp_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /decon-orders/${ord_b}/treatment"
              payload: { water_temp_f: 140, pressure_psi: 3000, dwell_seconds: 120 }
              as: DeconTechnician
              as_user_id: "${insp_b}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id ERR_INSPECTOR_NOT_ACTIVE, because logical_now >= insp_b.certification_expires_at moves the technician ACTIVE -> EXPIRED before any station or bay check runs"
            - "GET /decon-orders/${ord_b} still shows status == ORDERED, attempt_count == 0, treated_by_inspector_id == null and treated_at == null - the refused call left no trace"
            - "the last setup treatment (one second earlier) returned 200 with data.status == TREATED, data.treated_by_inspector_id == ${insp_b}, treatment_effectiveness_pct == 100.00, base_dry_hours == 72, required_dry_hours == 18 (credit floor(72 * 1.00 * 0.75) == 54) and dry_until == 2027-08-01T18:01:59Z, proving the same technician and the same payload were legal before the boundary"
            - "the clock call that crossed the boundary returned 200 with data.current_utc == 2027-08-01T00:00:00Z; it is the treatment attempt, not the clock call, that flips insp_b to EXPIRED"
            - "GET /inspectors/${insp_b} reports certification_expires_at == 2027-08-01T00:00:00Z and certification_level == DECON_CERTIFIED - expiry suspends the status, it does not erase the credited level"
            - "control: POST /inspectors/${insp_b}/status with target_status ACTIVE re-stamps certification_expires_at to 2028-07-31T00:00:00Z (logical_now + CERT_VALID_HOURS) and the same treatment on ${ord_b} then returns 200"

