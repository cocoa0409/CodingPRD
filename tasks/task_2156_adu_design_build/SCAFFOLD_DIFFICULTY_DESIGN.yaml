scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: feasibility_pathway_verdict_divergence
        grounds:
          - calculations.feasibility_screening
          - entities.FeasibilityScreening.fields.verdict
          - entities.FeasibilityScreening.fields.deficiency_codes
          - entities.FeasibilityScreening.fields.max_allowed_sqft
        distinguishing_aspect: |
          Dual variant on the ZONING/SITE-PLANNING domain (AduProject geometry against a
          Jurisdiction ordinance): one AduProject row screened twice returns verdict FAIL
          with four deficiency codes under LOCAL_ORDINANCE and verdict PASS_WITH_CONDITIONS
          with one deficiency code under STATUTORY_MINISTERIAL, from identical stored inputs.
        test_recipe:
          setup:
            - "Jurisdiction SNVL: local_max_detached_sqft 750, rear 10.0 ft, side 5.0 ft, height 14.0 ft."
            - "Property P1 in SNVL: existing_dwelling_sqft 1600, electrical_service_amps 200, water meter 0.75 in."
            - "AduProject A on P1: DETACHED_NEW, 800 sqft, 16.0 ft tall, rear 5.0 ft, side 4.0 ft, 2 bedrooms."
            - "No screening exists yet; the project is in INTAKE."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Sunnyvale", code: "SNVL", local_max_detached_sqft: 750, local_rear_setback_ft: 10.0, local_side_setback_ft: 5.0, local_max_height_ft: 14.0, plan_check_base_fee_cents: 185025, plan_check_rate_per_sqft_cents: 137, impact_fee_per_sqft_cents: 1250, utility_capacity_fee_cents: 415000, correction_response_days: 60, separate_meter_required: true, str_min_lease_days: 30, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_snvl_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_snvl_id}", address_line: "418 Alder Way", lot_sqft: 6000, existing_dwelling_sqft: 1600, electrical_service_amps: 200, existing_water_meter_size_in: 0.75, pre_adu_value_cents: 120000000, occupied: true, in_str_overlay: false, existing_mortgage_balance_cents: 45000000 }
              as: DesignLead
              captures: { prop_p1_id: $.data.id, prop_p1_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p1_id}", expected_property_version: "${prop_p1_v}", unit_type: "DETACHED_NEW", proposed_sqft: 800, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 4.0, bedrooms: 2, contract_base_price_cents: 28000000 }
              as: DesignLead
              captures: { proj_a_id: $.data.id }
          trigger:
            - call: "POST /adu-projects/${proj_a_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_local_id: $.data.id }
            - call: "POST /adu-projects/${proj_a_id}/feasibility-screenings"
              payload: { pathway: "STATUTORY_MINISTERIAL" }
              as: DesignLead
              captures: { scr_stat_id: $.data.id }
          assert:
            - "FeasibilityScreening.${scr_local_id}.verdict == 'FAIL'"
            - "FeasibilityScreening.${scr_local_id}.max_allowed_sqft == 750"
            - "FeasibilityScreening.${scr_local_id}.deficiency_codes == ['HEIGHT', 'SETBACK', 'UTILITY_CAPACITY', 'ZONING']"
            - "FeasibilityScreening.${scr_stat_id}.verdict == 'PASS_WITH_CONDITIONS'"
            - "FeasibilityScreening.${scr_stat_id}.max_allowed_sqft == 800"
            - "FeasibilityScreening.${scr_stat_id}.required_side_setback_ft == 4.0"
            - "FeasibilityScreening.${scr_stat_id}.required_height_ft == 16.0"
            - "FeasibilityScreening.${scr_stat_id}.deficiency_codes == ['UTILITY_CAPACITY']"
            - "AduProject.${proj_a_id}.status == 'INTAKE' and AduProject.${proj_a_id}.approved_pathway is null"

      - name: appraisal_approach_funding_gap_divergence
        grounds:
          - calculations.financing_capacity
          - entities.FinancingScenario.fields.as_completed_value_cents
          - entities.FinancingScenario.fields.funding_gap_cents
          - entities.FinancingScenario.fields.appraisal_shortfall
        distinguishing_aspect: |
          Dual variant on the LENDING/APPRAISAL domain (FinancingScenario against a Property's
          equity position) — a different entity domain from feasibility_pathway_verdict_divergence:
          the same project cost and the same parcel yield funding_gap_cents 16320465 with
          appraisal_shortfall true under SALES_COMPARISON and funding_gap_cents 0 with
          appraisal_shortfall false under INCOME_CAPITALIZATION.
        test_recipe:
          setup:
            - "Jurisdiction PLMD (permissive). Property P2 in PLMD: pre_adu_value_cents 80000000, existing_mortgage_balance_cents 60000000, existing_dwelling_sqft 1450, 400 A service, 1.0 in meter, unoccupied."
            - "AduProject B on P2: DETACHED_NEW, 767 sqft, contract_base_price_cents 24000000."
            - "One ELECTRIC UtilityConnection decided (score 25 -> SHARED, 220000 cents) and a PermitSubmittal created, so AduProject.total_permit_fee_cents is 0 until the permit is approved and 1120465 afterwards."
            - "The permit is approved, so AduProject.total_permit_fee_cents == 1120465 and contract_price_current_cents == 24000000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_plmd_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_plmd_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000, occupied: false, in_str_overlay: false, existing_mortgage_balance_cents: 60000000 }
              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_b_elec_id: $.data.id }
            - call: "POST /utility-connections/${uc_b_elec_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_b_id: $.data.id }
            - call: "POST /permit-submittals/${sub_b_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_b_id}/plan-check-result"
              payload: { outcome: "APPROVED" }
              as: PlanChecker
            - call: "GET /adu-projects/${proj_b_id}"
              payload: {}
              as: FinanceAdvisor
              captures: { proj_b_v_a: $.data.version }
          trigger:
            - call: "POST /adu-projects/${proj_b_id}/financing-scenarios"
              payload: { expected_adu_project_version: "${proj_b_v_a}", product_type: "HELOC", appraisal_approach: "SALES_COMPARISON", comparable_adjustment_cents: 9000000, projected_monthly_rent_cents: 250000 }
              as: FinanceAdvisor
              captures: { fin_sales_id: $.data.id }
            - call: "GET /adu-projects/${proj_b_id}"
              payload: {}
              as: FinanceAdvisor
              captures: { proj_b_v_b: $.data.version }
            - call: "POST /adu-projects/${proj_b_id}/financing-scenarios"
              payload: { expected_adu_project_version: "${proj_b_v_b}", product_type: "CONSTRUCTION_LOAN", appraisal_approach: "INCOME_CAPITALIZATION", comparable_adjustment_cents: 9000000, projected_monthly_rent_cents: 250000 }
              as: FinanceAdvisor
              captures: { fin_income_id: $.data.id }
          assert:
            - "AduProject.${proj_b_id}.total_permit_fee_cents == 1120465"
            - "FinancingScenario.${fin_sales_id}.as_completed_value_cents == 89000000"
            - "FinancingScenario.${fin_sales_id}.max_loan_cents == 71200000"
            - "FinancingScenario.${fin_sales_id}.available_cents == 11200000"
            - "FinancingScenario.${fin_sales_id}.required_funds_cents == 27520465"
            - "FinancingScenario.${fin_sales_id}.funding_gap_cents == 16320465"
            - "FinancingScenario.${fin_sales_id}.appraisal_shortfall == true"
            - "FinancingScenario.${fin_sales_id}.status == 'SUPERSEDED'"
            - "FinancingScenario.${fin_income_id}.as_completed_value_cents == 112618182"
            - "FinancingScenario.${fin_income_id}.max_loan_cents == 90094545"
            - "FinancingScenario.${fin_income_id}.available_cents == 30094545"
            - "FinancingScenario.${fin_income_id}.required_funds_cents == 27520465"
            - "FinancingScenario.${fin_income_id}.funding_gap_cents == 0"
            - "FinancingScenario.${fin_income_id}.appraisal_shortfall == false"
            - "AduProject.${proj_b_id}.financing_state == 'PRE_QUALIFIED'"

  # =====================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_component_rounding_order
        grounds:
          - calculations.permit_fee_schedule
          - entities.PermitSubmittal.fields.plan_check_component_cents
          - entities.PermitSubmittal.fields.impact_component_cents
          - entities.PermitSubmittal.fields.school_component_cents
          - entities.PermitSubmittal.fields.total_permit_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER changes the cents. At 767 sqft in PLMD
          against a 1450 sqft primary dwelling the three rate-driven components are
          203207.25, 324573.2414 and 372685.3 unrounded; rounding each to whole cents first
          and then summing yields 900465, while summing the reals and rounding once yields
          900466. The scaffold pins round-per-component-then-sum, so total_permit_fee_cents
          must be 1120465 (with the 220000 shared-meter utility component), never 1120466.
        test_recipe:
          setup:
            - "Jurisdiction PLMD: plan_check_base_fee_cents 120000, plan_check_rate_per_sqft_cents 90, impact_fee_per_sqft_cents 800."
            - "Property P2 in PLMD with existing_dwelling_sqft 1450, 400 A service, 1.0 in meter."
            - "AduProject B on P2 at 767 sqft with an ELECTRIC UtilityConnection already decided to SHARED (separation_cost_cents 220000)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_plmd_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_plmd_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000, occupied: false, in_str_overlay: false, existing_mortgage_balance_cents: 60000000 }
              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_b_elec_id: $.data.id }
            - call: "POST /utility-connections/${uc_b_elec_id}/decide"
              payload: {}
              as: DesignLead
          trigger:
            - call: "POST /adu-projects/${proj_b_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_b_id: $.data.id }
          assert:
            - "PermitSubmittal.${sub_b_id}.plan_check_component_cents == 203207"
            - "PermitSubmittal.${sub_b_id}.impact_component_cents == 324573"
            - "PermitSubmittal.${sub_b_id}.school_component_cents == 372685"
            - "PermitSubmittal.${sub_b_id}.utility_component_cents == 220000"
            - "PermitSubmittal.${sub_b_id}.total_permit_fee_cents == 1120465"
            - "PermitSubmittal.${sub_b_id}.total_permit_fee_cents != 1120466"
            - "PermitSubmittal.${sub_b_id}.status == 'PREPARED' and PermitSubmittal.${sub_b_id}.cycle_number == 0"

      - name: change_order_markup_tier_evaluation_order
        grounds:
          - calculations.change_order_price_reconciliation
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - entities.ChangeOrder.fields.builder_fee_cents
          - entities.ChangeOrder.fields.cumulative_change_pct_before
          - entities.AduProject.fields.contract_price_current_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order, a different
          axis from the rounding-order instance above. The markup tier is keyed on a cumulative
          change percentage that itself contains earlier markups, and the price contains the
          markup. Pinning the tier to the BEFORE percentage measured against
          contract_base_price_cents makes the second change order's fee exactly 150000
          (tier 2 at 15 percent of 1000000), not 100000 (tier 1) and not 200000 (tier 3).
        test_recipe:
          setup:
            - "AduProject B on Property P2 in PLMD, contract_base_price_cents 24000000, driven all the way to status PERMITTED."
            - "Change order CO1 for +1300000 cents already APPROVED: builder_fee_cents 130000, contract_price_current_cents 25430000, cumulative_change_pct_after 5.96."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_plmd_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_plmd_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000, occupied: false, in_str_overlay: false, existing_mortgage_balance_cents: 60000000 }
              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_b_elec_id: $.data.id }
            - call: "POST /utility-connections/${uc_b_elec_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_b_id: $.data.id }
            - call: "POST /permit-submittals/${sub_b_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_b_id}/plan-check-result"
              payload: { outcome: "APPROVED" }
              as: PlanChecker
            - call: "GET /adu-projects/${proj_b_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_p2_id}"
              captures: { proj_b_v1: $.data.version }
            - call: "POST /adu-projects/${proj_b_id}/change-orders"
              payload: { expected_adu_project_version: "${proj_b_v1}", title: "Upgrade to mini-split HVAC", scope_items: ["Remove wall heater", "Install ductless mini-split"], cost_delta_cents: 1300000, schedule_delta_days: 6 }
              as: Homeowner
              as_user_id: "${prop_p2_id}"
              captures: { co1_id: $.data.id }
            - call: "POST /change-orders/${co1_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_p2_id}"
            - call: "POST /change-orders/${co1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProjectManager
            - call: "GET /adu-projects/${proj_b_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_p2_id}"
              captures: { proj_b_v2: $.data.version }
            - call: "POST /adu-projects/${proj_b_id}/change-orders"
              payload: { expected_adu_project_version: "${proj_b_v2}", title: "Add covered porch", scope_items: ["Frame 6x10 porch", "Add porch roofing"], cost_delta_cents: 1000000, schedule_delta_days: 4 }
              as: Homeowner
              as_user_id: "${prop_p2_id}"
              captures: { co2_id: $.data.id }
            - call: "POST /change-orders/${co2_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_p2_id}"
          trigger:
            - call: "POST /change-orders/${co2_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProjectManager
          assert:
            - "ChangeOrder.${co1_id}.builder_fee_cents == 130000"
            - "ChangeOrder.${co1_id}.cumulative_change_pct_before == 0.0"
            - "ChangeOrder.${co1_id}.cumulative_change_pct_after == 5.96"
            - "ChangeOrder.${co2_id}.cumulative_change_pct_before == 5.96"
            - "ChangeOrder.${co2_id}.builder_fee_cents == 150000"
            - "ChangeOrder.${co2_id}.cumulative_change_pct_after == 10.75"
            - "AduProject.${proj_b_id}.contract_price_current_cents == 26580000"
            - "AduProject.${proj_b_id}.approved_change_days == 10"
            - "AduProject.${proj_b_id}.approved_change_order_count == 2"

      - name: utility_separation_score_nested_clamp
        grounds:
          - calculations.utility_separation_decision
          - entities.UtilityConnection.fields.separation_score
          - entities.UtilityConnection.fields.separation_cost_cents
          - state_machines.UtilityConnection.PENDING_DECISION_to_SEPARATE_APPROVED
        distinguishing_aspect: |
          Mode (a) — a five-input formula with a nested max(0, min(100, ...)) clamp and four
          conditional branches over Jurisdiction, Property and AduProject fields, a third
          distinct combinatorial axis. On Property P1 the raw score is 40+25+20+15-0 = 100,
          clamped to 100 and resolving to SEPARATE with separation_cost_cents
          415000 + 850000 = 1265000; on Property P2 the same formula yields 0+0+20+15-10 = 25
          and resolves to SHARED at 220000.
        test_recipe:
          setup:
            - "Jurisdiction SNVL with separate_meter_required true and utility_capacity_fee_cents 415000."
            - "Property P1 in SNVL: 200 A service, 0.75 in meter (no water headroom)."
            - "AduProject A on P1: DETACHED_NEW, 800 sqft, 2 bedrooms, so required_service_amps is 125 and headroom_amps is 200-125-100 = -25."
            - "AduProject A has a STATUTORY_MINISTERIAL pathway selected and one PENDING_DECISION ELECTRIC UtilityConnection."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Sunnyvale", code: "SNVL", local_max_detached_sqft: 750, local_rear_setback_ft: 10.0, local_side_setback_ft: 5.0, local_max_height_ft: 14.0, plan_check_base_fee_cents: 185025, plan_check_rate_per_sqft_cents: 137, impact_fee_per_sqft_cents: 1250, utility_capacity_fee_cents: 415000, correction_response_days: 60, separate_meter_required: true, str_min_lease_days: 30, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_snvl_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_snvl_id}", address_line: "418 Alder Way", lot_sqft: 6000, existing_dwelling_sqft: 1600, electrical_service_amps: 200, existing_water_meter_size_in: 0.75, pre_adu_value_cents: 120000000, occupied: true, in_str_overlay: false, existing_mortgage_balance_cents: 45000000 }
              as: DesignLead
              captures: { prop_p1_id: $.data.id, prop_p1_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p1_id}", expected_property_version: "${prop_p1_v}", unit_type: "DETACHED_NEW", proposed_sqft: 800, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 4.0, bedrooms: 2, contract_base_price_cents: 28000000 }
              as: DesignLead
              captures: { proj_a_id: $.data.id }
            - call: "POST /adu-projects/${proj_a_id}/feasibility-screenings"
              payload: { pathway: "STATUTORY_MINISTERIAL" }
              as: DesignLead
              captures: { scr_a_id: $.data.id }
            - call: "POST /adu-projects/${proj_a_id}/select-pathway"
              payload: { screening_id: "${scr_a_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_a_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_a_elec_id: $.data.id }
          trigger:
            - call: "POST /utility-connections/${uc_a_elec_id}/decide"
              payload: {}
              as: DesignLead
          assert:
            - "UtilityConnection.${uc_a_elec_id}.separation_score == 100"
            - "UtilityConnection.${uc_a_elec_id}.decision == 'SEPARATE'"
