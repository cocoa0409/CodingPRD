          - state_machines.Dispense.DISPENSED_to_VOIDED
          - state_machines.Prescription.FILLED_to_QUEUED
          - calculations.dispense_fee_allocation
          - entities.SubsidyProgram.fields.consumed_cents
          - entities.MilkLot.fields.dispensed_ml
        distinguishing_aspect: |
          A different conserved quantity: CENTS OF CHARITABLE SUBSIDY. The void must return
          SubsidyProgram.consumed_cents to exactly its pre-fill value (0), yet must NOT zero the
          Dispense's own gross_fee_cents / subsidy_cents / payer_due_cents, which are retained
          for audit — so the reversal conserves the ledger without erasing the priced row. The
          prescription's fill counters unwind in the same request (FILLED -> QUEUED,
          cumulative_dispensed_ml back to 0, waitlist_position re-granted), which a naive
          implementation that only flips Dispense.status leaves stranded.
