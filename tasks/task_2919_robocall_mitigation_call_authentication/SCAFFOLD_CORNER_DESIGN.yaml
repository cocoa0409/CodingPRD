          trigger:
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "SUSPEND", suspension_cause: "PROVIDER_REQUEST" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "HTTP 200 and Customer.${cust_id}.origination_state == SUSPENDED with suspension_cause == PROVIDER_REQUEST"
            - "Customer.${cust_id}.suspension_source_id == null (an operator suspension names no source artifact)"
            - "NumberAssignment.${asg_live_id}.status == SUSPENDED_BY_CUSTOMER"
            - "NumberAssignment.${asg_dead_id}.status == REVOKED (untouched by the cascade)"
            - "Provider.${prov_id}.active_assigned_number_count == 0"

      - name: customer_two_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Customer.kyc_state
          - state_machines.Customer.origination_state
        excluded_because:
          difficulty_instance: customer_kyc_and_origination_dimensions_move_independently
          rationale: "The §1.8 instance already drives kyc_state PENDING -> UNDER_REVIEW -> REJECTED while origination_state independently walks DISABLED -> ENABLED -> SUSPENDED -> ENABLED, and asserts the combined state at every step plus the invariant that neither dimension writes the other. A separate breadth probe would restate it with fewer assertions."

      - name: enforcement_fork_paths_each_reach_a_terminal_state
        claim_type: branching
        grounds:
          - state_machines.EnforcementAction.CONTESTED_to_SUSTAINED
          - state_machines.EnforcementAction.CONTESTED_to_DISMISSED
        excluded_because:
          difficulty_instance: enforcement_fork_join_dismiss_and_sustain_branches_diverge
          rationale: "Both fork branches (PROPOSED -> CONTESTED -> DISMISSED and PROPOSED -> CONTESTED -> SUSTAINED -> PAID) are already walked to their terminal states in one §1.8 instance, with the outstanding-forfeiture ledger asserted after each join."

      - name: restore_reverses_every_side_effect_of_the_suspension
        claim_type: compensation
        grounds:
          - state_machines.Customer.origination_state.SUSPENDED_to_ENABLED
          - state_machines.NumberAssignment.SUSPENDED_BY_CUSTOMER_to_ACTIVE
        excluded_because:
          difficulty_instance: active_number_inventory_conserved_across_risk_suspension_and_restore
          rationale: "The §1.8 instance already asserts that a RESTORE undoes the suspension's cascade with no drift — suspension_cause cleared, every SUSPENDED_BY_CUSTOMER assignment returned to ACTIVE, and the provider inventory count back to the value it held before the suspension."

      - name: dispute_reversal_adjusts_customer_and_provider_rows
        claim_type: cross_entity
        grounds:
          - state_machines.BlockingDispute.UNDER_REVIEW_to_REVERSED
          - state_machines.BlockingEvent.BLOCKED_to_REVERSED
        excluded_because:
          difficulty_instance: dispute_reversal_cascades_back_to_number_inventory
          rationale: "A REVERSE resolution's effect on the other four entities (BlockingEvent status, Customer origination_state and false_positive_count, NumberAssignment status, Provider counters and blocking_false_positive_rate) is already asserted end-to-end by the §1.8 instance."

      - name: signing_is_guarded_by_the_providers_posture
        claim_type: guarded_transitions
        grounds:
          - "validations[priority=23]"
          - calculations.provider_posture_recompute
        excluded_because:
          difficulty_instance: attestation_refused_by_provider_posture_not_by_its_own_fields
          rationale: "The cross-entity guard 'a CallAttestation may only be created when the Provider is not SIGNING_SUSPENDED' is exactly what the §1.8 instance establishes, including the valid case before the guard closes and the 409 after two expired notices push penalty_points to 10."

  - section: calculations
