              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 2, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e_short: $.data.error_id }
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 13, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e_long: $.data.error_id }
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1500.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e_acres: $.data.error_id }
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 0.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
