            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 100 }, { plot_number: 2, species: "PINE", volume_bf: 2000 }, { plot_number: 3, species: "PINE", volume_bf: 100 }, { plot_number: 4, species: "PINE", volume_bf: 2000 }, { plot_number: 5, species: "PINE", volume_bf: 100 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${cr_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5] }, as: Forester, as_user_id: "${f_id}", captures: { se: "$.data.sampling_error_pct" } }
          trigger:
            - { call: "POST /forestry/cruises/${cr_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${se} == 48.40"
            - "${err} == ERR_SAMPLING_ERROR_TOO_HIGH"

