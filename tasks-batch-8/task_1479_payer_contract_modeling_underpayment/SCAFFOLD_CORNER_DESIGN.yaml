              as: RevenueIntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_NO_MATCHING_TERM"
            - "Claim.${claim_id}.pricing_status still == UNPRICED"

      - name: err_contract_window_invalid_on_activate
        claim_type: triggerable
        grounds: ["errors[ERR_CONTRACT_WINDOW_INVALID]", "state_machines.PayerContract.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "Activating a contract whose expiration_date (2026-07-01) is not after today (2026-08-01) is rejected ERR_CONTRACT_WINDOW_INVALID."
        test_recipe:
          setup: ["payer P ACTIVE; contract C DRAFT 2026-01-01..2026-07-01"]
          setup_api_calls:
