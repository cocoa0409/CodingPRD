scenario: "Experience Retail Make-Your-Own Station & Party Booking (Build-A-Bear Workshop): guided workshop station sequencing from selection through stuffing, sound insert, bathing and dressing, birthday party reservation with per-guest package tiers and deposit rules, staffing to appointment blocks with walk-in capacity buffers, licensed character collection drops with per-guest purchase limits, gift card and stuffed-animal registry linkage, in-store production consumables tracking including stuffing weight and sound chips, online build-and-ship orders assembled at the store and handed to a carrier, birth-certificate personalization and lost-toy recovery service"
domain_name: experience-retail-workshop
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: party_room_count, type: integer, source: input, description: "Number of party rooms; each appointment block reserves one room for its full span", constraints: ">= 1" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique customer email", constraints: "unique across Customer" }
      - { name: full_name, type: string, source: input, description: "Customer legal/display name" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; home store of this staff member" }
      - { name: display_name, type: string, source: input, description: "Staff display name" }
      - { name: role_title, type: enum, source: input, description: "ASSOCIATE | PARTY_HOST | MANAGER" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store this station belongs to" }
      - { name: station_type, type: enum, source: input, description: "SELECT | STUFF | SOUND | BATHE | DRESS" }
      - { name: capacity, type: integer, source: input, description: "Maximum workshops this station may serve at once", constraints: ">= 1" }

  - name: PlushModel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Model display name, e.g. 'Celestial Dragon'" }
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit", constraints: "unique across PlushModel" }
      - { name: base_price_cents, type: integer, source: input, description: "Retail price of the unstuffed shell", constraints: ">= 0" }
      - { name: is_licensed, type: boolean, source: input, description: "True when this model belongs to a licensed collection" }
      - { name: required_stuffing_grams, type: integer, source: input, description: "Stuffing consumed per unit at STUFF advance", constraints: "> 0" }
      - { name: sound_chip_compatible, type: boolean, source: input, description: "True when the model accepts a sound insert at the SOUND station" }

  - name: Consumable
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose stock this ledger row tracks" }
      - { name: consumable_type, type: enum, source: input, description: "STUFFING_FIBER | SOUND_CHIP" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Current on-hand quantity (grams for STUFFING_FIBER, units for SOUND_CHIP); starts at initial_qty; decremented by workshop/production consumption, incremented by restock", constraints: ">= 0 at all times" }
      - { name: initial_qty, type: integer, source: input, description: "Opening quantity recorded at row creation", constraints: ">= 0" }

  - name: CollectionDrop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Licensed collection drop name" }
      - { name: plush_model_id, type: string, source: input, description: "FK -> PlushModel.id; the licensed model offered in this drop; referenced PlushModel.is_licensed must be true" }
      - { name: drop_start, type: datetime, source: input, description: "Inclusive start instant (ISO 8601 UTC) of the purchase window" }
      - { name: drop_end, type: datetime, source: input, description: "Exclusive end instant (ISO 8601 UTC) of the purchase window" }
      - { name: per_customer_limit, type: integer, source: input, description: "Maximum units of this drop's model one customer may select across all their workshops", constraints: ">= 1" }
      - { name: total_units, type: integer, source: input, description: "Total licensed units available for this drop", constraints: ">= 1" }
      - { name: units_claimed, type: integer, source: computed, description: "Running count of units claimed by workshops currently at stage >= SELECTED; starts at 0; decremented when a claiming workshop abandons before payment", constraints: "0 <= units_claimed <= total_units" }

  - name: WorkshopSession
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the build takes place" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the building customer" }
      - { name: plush_model_id, type: string, source: input, description: "FK -> PlushModel.id; selected shell model" }
      - { name: collection_drop_id, type: string, source: input, description: "FK -> CollectionDrop.id; required when the selected model is licensed, null otherwise" }
      - { name: origin_type, type: enum, source: input, description: "WALK_IN | PARTY | BUILD_SHIP" }
      - { name: party_reservation_id, type: string, source: input, description: "FK -> PartyReservation.id; required when origin_type is PARTY, null otherwise" }
      - { name: build_ship_order_id, type: string, source: input, description: "FK -> BuildShipOrder.id; required when origin_type is BUILD_SHIP, null otherwise" }
      - { name: assigned_station_id, type: string, source: computed, description: "FK -> Station.id; station selected by the advance-step selector for the current stage; null before SELECTED" }
      - { name: stuffed_animal_id, type: string, source: computed, description: "FK -> StuffedAnimal.id; minted at the first advance (SELECT -> SELECTED)" }
      - { name: stuffing_grams_used, type: integer, source: computed, description: "Recorded stuffing consumption for this session once STUFFED; 0 before", default: 0 }
      - { name: sound_chip_used, type: boolean, source: computed, description: "Whether a sound chip was installed (decided at SOUND advance)", default: false }
      - { name: total_price_cents, type: integer, source: computed, description: "Quoted at SELECT->SELECTED advance: PlushModel.base_price_cents + (SOUND_CHIP_PRICE_CENTS if a sound chip is later installed); finalized at payment" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp of session creation; the start of the session's station-occupancy interval for walkin_capacity_occupancy" }
      - { name: status, type: enum, source: system, description: "SELECT | SELECTED | STUFFED | SOUNDED | BATHED | DRESSED | PAID | ABANDONED" }

  - name: StuffedAnimal
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; copied from the originating WorkshopSession" }
      - { name: plush_model_id, type: string, source: computed, description: "FK -> PlushModel.id; copied from the originating WorkshopSession" }
      - { name: origin_workshop_session_id, type: string, source: computed, description: "FK -> WorkshopSession.id; the session that minted this animal" }
      - { name: birth_cert_name, type: string, source: input, description: "Personalized name printed on the birth certificate; set at personalization; immutable once PAID" }
      - { name: birth_cert_birth_date, type: string, source: input, description: "Birth date string (YYYY-MM-DD) printed on the certificate; immutable once PAID" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED | LOST_REPORTED | RECOVERED" }

  - name: PartyReservation
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store hosting the party" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; booking customer" }
      - { name: party_start, type: datetime, source: input, description: "Appointment block start (ISO 8601 UTC); must be a whole hour" }
      - { name: duration_minutes, type: integer, source: input, description: "Block length; must be exactly 120" }
      - { name: guest_count, type: integer, source: input, description: "Confirmed guest count at booking time", constraints: "6 <= guest_count <= 20" }
      - { name: package_tier, type: enum, source: input, description: "BASIC | CELEBRATION | ULTIMATE" }
      - { name: staffing_mode, type: enum, source: input, description: "STAFF_HOSTED | SELF_GUIDED" }
      - { name: deposit_amount_cents, type: integer, source: computed, description: "Deposit required per party_deposit_required calculation (guest_count mode at quote time)" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Cumulative payments applied (deposit then balance)" }
      - { name: final_amount_due_cents, type: integer, source: computed, description: "Computed at finalize per party_final_amount_due; 0 until finalized" }
      - { name: status, type: enum, source: system, description: "QUOTED | DEPOSIT_PAID | CONFIRMED | COMPLETED | CANCELLED" }

  - name: PartyGuest
    parent: null
    common_fields: true
    fields:
      - { name: party_reservation_id, type: string, source: input, description: "FK -> PartyReservation.id; reservation this guest belongs to" }
      - { name: guest_name, type: string, source: input, description: "Guest display name" }
      - { name: workshop_session_id, type: string, source: computed, description: "FK -> WorkshopSession.id; set when this guest's session is created at party start" }
      - { name: status, type: enum, source: system, description: "INVITED | CONFIRMED | ATTENDED | NO_SHOW | CANCELLED" }

  - name: AppointmentBlock
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose schedule this block occupies" }
      - { name: party_reservation_id, type: string, source: input, description: "FK -> PartyReservation.id; the booking holding this block" }
      - { name: block_start, type: datetime, source: computed, description: "Copied from PartyReservation.party_start at creation" }
      - { name: block_end, type: datetime, source: computed, description: "block_start + duration_minutes" }
      - { name: reserved_host_id, type: string, source: computed, description: "FK -> StaffMember.id; set by the host selector when staffing_mode is STAFF_HOSTED; null for SELF_GUIDED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }

  - name: BuildShipOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling store" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: plush_model_id, type: string, source: input, description: "FK -> PlushModel.id; model to assemble" }
      - { name: sound_chip_requested, type: boolean, source: input, description: "Whether the online order includes a sound insert" }
      - { name: recipient_name, type: string, source: input, description: "Ship-to recipient display name" }
      - { name: workshop_session_id, type: string, source: computed, description: "FK -> WorkshopSession.id; set when the store starts assembly" }
      - { name: carrier_code, type: string, source: computed, description: "Carrier identifier recorded at handoff" }
      - { name: tracking_number, type: string, source: computed, description: "Tracking reference recorded at handoff" }
      - { name: handed_over_at, type: datetime, source: computed, description: "Logical-clock timestamp of carrier handoff; used by consignment_settlement" }
      - { name: status, type: enum, source: system, description: "PLACED | IN_ASSEMBLY | READY_FOR_PICKUP | HANDED_TO_CARRIER | CANCELLED" }

  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique redemption code", constraints: "unique across GiftCard" }
      - { name: balance_cents, type: integer, source: computed, description: "Remaining balance; starts at initial_balance_cents; reduced only by successful redemptions", constraints: ">= 0" }
      - { name: initial_balance_cents, type: integer, source: input, description: "Issued balance", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | DISABLED" }

  - name: Registry
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; registry owner" }
      - { name: name, type: string, source: input, description: "Registry display name, e.g. 'Maya's Wish List'" }
      - { name: linked_animal_ids, type: array, source: computed, description: "StuffedAnimal ids currently linked; a COMPLETED animal may be linked to at most one registry" }
      - { name: linked_gift_card_ids, type: array, source: computed, description: "GiftCard ids linked to this registry; enables GIFT_CARD_LINKED tender for sessions of the registry owner" }
      - { name: linked_gift_card_ids, type: array, source: computed, description: "GiftCard ids linked to this registry; enables GIFT_CARD_LINKED tender for sessions of the registry owner" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WorkshopSession
    initial_state: SELECT
    terminal_states: [PAID, ABANDONED]
    transitions:
      - from: SELECT
        to: SELECTED
        trigger: "POST /workshops/{id}/advance-step (current station step SELECT)"
        actor: WorkshopAssociate
        preconditions:
          - "If PlushModel.is_licensed: the session's CollectionDrop window contains the current logical time (drop_start <= now < drop_end)"
          - "If licensed: the customer has selected fewer than CollectionDrop.per_customer_limit units of this drop's model across their non-terminal sessions"
          - "If licensed: CollectionDrop.units_claimed < CollectionDrop.total_units"
        side_effects:
          - "Mint StuffedAnimal (status IN_PROGRESS) and set stuffed_animal_id"
          - "Set total_price_cents = PlushModel.base_price_cents"
          - "If licensed: CollectionDrop.units_claimed += 1 (this bump triggers the drop-exhaustion check; when units_claimed reaches total_units, further SELECT advances for this drop fail)"
          - "increments WorkshopSession.version by 1"
      - from: SELECTED
        to: STUFFED
        trigger: "POST /workshops/{id}/advance-step (current step STUFF)"
        actor: WorkshopAssociate
        preconditions:
          - "Store's STUFFING_FIBER Consumable.on_hand_qty >= PlushModel.required_stuffing_grams"
        side_effects:
          - "Consumable.on_hand_qty -= PlushModel.required_stuffing_grams (this decrement triggers restock eligibility checks performed by ops staff via GET /stores/{store_id}/consumables)"
          - "stuffing_grams_used = PlushModel.required_stuffing_grams"
          - "Reassign assigned_station_id to the SOUND selector result"
          - "increments WorkshopSession.version by 1"
      - from: STUFFED
        to: SOUNDED
        trigger: "POST /workshops/{id}/advance-step (current step SOUND)"
        actor: WorkshopAssociate
        preconditions:
          - "If PlushModel.sound_chip_compatible is true: Store's SOUND_CHIP Consumable.on_hand_qty >= 1 (a chip is mandatory for compatible models)"
          - "If PlushModel.sound_chip_compatible is false: no precondition (the SOUND step is a no-op pass-through)"
        side_effects:
          - "If sound_chip_compatible: Consumable.on_hand_qty (SOUND_CHIP) -= 1; sound_chip_used = true; total_price_cents += SOUND_CHIP_PRICE_CENTS (1500)"
          - "If not sound_chip_compatible: sound_chip_used stays false and total_price_cents is unchanged"
          - "Reassign assigned_station_id to the BATHE selector result"
          - "increments WorkshopSession.version by 1"
      - from: SOUNDED
        to: BATHED
        trigger: "POST /workshops/{id}/advance-step (current step BATHE)"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "Reassign assigned_station_id to the DRESS selector result"
          - "increments WorkshopSession.version by 1"
      - from: BATHED
        to: DRESSED
        trigger: "POST /workshops/{id}/advance-step (current step DRESS)"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "assigned_station_id released (set to null; occupancy freed)"
          - "increments WorkshopSession.version by 1"
      - from: DRESSED
        to: PAID
        trigger: "POST /workshops/{id}/payment"
        actor: Customer
        preconditions:
          - "payment_amount_cents equals total_price_cents"
          - "If pay_tender is GIFT_CARD: referenced GiftCard.status == ACTIVE and GiftCard.balance_cents >= payment_amount_cents"
          - "If pay_tender is GIFT_CARD_LINKED: the supplied registry_id must have the gift card in its linked_gift_card_ids AND this session's StuffedAnimal in its linked_animal_ids, and GiftCard.balance_cents >= payment_amount_cents (full coverage; no split tender)"
        side_effects:
          - "StuffedAnimal.status -> COMPLETED (which enables registry linking; linking then enables GIFT_CARD_LINKED tender on future sessions)"
          - "If origin_type == PARTY: the linked PartyGuest.status -> ATTENDED (attendance bump feeds party_final_amount_due's honored-count input at finalize)"
          - "If origin_type == BUILD_SHIP: the linked BuildShipOrder.status -> READY_FOR_PICKUP (which is the handoff precondition; handoff stamps handed_over_at for consignment_settlement)"
          - "If pay_tender is GIFT_CARD or GIFT_CARD_LINKED: GiftCard.balance_cents -= payment_amount_cents; if balance reaches 0, GiftCard.status -> EXHAUSTED"
          - "increments WorkshopSession.version by 1"
      - from: SELECT
        to: ABANDONED
        trigger: "POST /workshops/{id}/abandon"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "assigned_station_id released"
          - "increments WorkshopSession.version by 1"
      - from: SELECTED
        to: ABANDONED
        trigger: "POST /workshops/{id}/abandon"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "If licensed: CollectionDrop.units_claimed -= 1 (release restores availability for other customers' SELECT advances)"
          - "assigned_station_id released"
          - "increments WorkshopSession.version by 1"
      - from: STUFFED
        to: ABANDONED
        trigger: "POST /workshops/{id}/abandon"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "If licensed: CollectionDrop.units_claimed -= 1"
          - "Consumable.on_hand_qty (STUFFING_FIBER) += stuffing_grams_used (compensating restock of consumed fiber)"
          - "assigned_station_id released"
          - "increments WorkshopSession.version by 1"
      - from: SOUNDED
        to: ABANDONED
        trigger: "POST /workshops/{id}/abandon"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "If licensed: CollectionDrop.units_claimed -= 1"
          - "Consumable.on_hand_qty (STUFFING_FIBER) += stuffing_grams_used; Consumable.on_hand_qty (SOUND_CHIP) += 1"
          - "assigned_station_id released"
          - "increments WorkshopSession.version by 1"
      - from: BATHED
        to: ABANDONED
        trigger: "POST /workshops/{id}/abandon"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "If licensed: CollectionDrop.units_claimed -= 1"
          - "Consumable.on_hand_qty (STUFFING_FIBER) += stuffing_grams_used; if sound_chip_used: SOUND_CHIP += 1"
          - "assigned_station_id released"
          - "increments WorkshopSession.version by 1"
      - from: DRESSED
        to: ABANDONED
        trigger: "POST /workshops/{id}/abandon"
        actor: WorkshopAssociate
        preconditions: []
        side_effects:
          - "If licensed: CollectionDrop.units_claimed -= 1"
          - "Consumable restock as in BATHED->ABANDONED"
          - "If origin_type == PARTY: linked PartyGuest.status -> NO_SHOW"
          - "If origin_type == BUILD_SHIP: linked BuildShipOrder.status -> CANCELLED"
          - "assigned_station_id released"
          - "increments WorkshopSession.version by 1"

  - entity: PartyReservation
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUOTED
        to: DEPOSIT_PAID
        trigger: "POST /parties/{id}/pay-deposit"
        actor: Customer
        preconditions:
          - "payment_amount_cents == deposit_amount_cents"
          - "party_start - now >= MIN_BOOKING_LEAD_HOURS (72)"
          - "AppointmentBlock room available for [party_start, party_start+120): count of ACTIVE blocks at the store overlapping this half-open interval < Store.party_room_count"
          - "If staffing_mode == STAFF_HOSTED: host selector must return a StaffMember (role_title == PARTY_HOST, same store, with no ACTIVE block whose [block_start, block_end) overlaps the new interval, where touching endpoints do NOT overlap); empty pool -> ERR_HOST_UNAVAILABLE"
        side_effects:
          - "paid_amount_cents += deposit_amount_cents"
          - "Create AppointmentBlock (status ACTIVE); if STAFF_HOSTED, reserved_host_id set to selector result (this reservation makes the host ineligible for overlapping blocks, which is what surfaces ERR_HOST_UNAVAILABLE on a later overlapping booking)"
          - "increments PartyReservation.version by 1"
      - from: DEPOSIT_PAID
        to: CONFIRMED
        trigger: "system auto-transition at party_start - 24h (evaluated when the logical clock crosses the threshold)"
        actor: system
        preconditions:
          - "now >= party_start - 24h"
        side_effects:
          - "For each PartyGuest of this reservation with status CONFIRMED: create their origin_type=PARTY WorkshopSession in SELECT and set PartyGuest.workshop_session_id (this session creation makes each guest's build subject to walk-in capacity and drop-limit rules at advance time)"
          - "increments PartyReservation.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /parties/{id}/finalize"
        actor: StoreManager
        preconditions:
          - "now >= party_start + duration_minutes"
          - "Every PartyGuest in status CONFIRMED has either ATTENDED (session PAID) or NO_SHOW (session ABANDONED or cancelled)"
        side_effects:
          - "Compute final_amount_due_cents per party_final_amount_due (uses per-guest tier price, service charge with per-line rounding, deposit credit; the honored guest count comes from the ATTENDED/NO_SHOW marks written by session payment/abandonment)"
          - "increments PartyReservation.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /parties/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Release AppointmentBlock if any (status -> RELEASED); released host becomes eligible again"
          - "increments PartyReservation.version by 1"
      - from: DEPOSIT_PAID
        to: CANCELLED
        trigger: "POST /parties/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Compute deposit refund per party_deposit_required cancel-refund mode: >= 72h before party_start refunds min(guest_count, honored_count) * PER_GUEST_DEPOSIT_CENTS where honored_count counts PartyGuests not in NO_SHOW; < 72h refunds 0; refund is recorded as a negative adjustment to paid_amount_cents"
          - "Release AppointmentBlock (status -> RELEASED); the released host eligibility is what lets an overlapping later booking succeed"
          - "increments PartyReservation.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /parties/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Deposit refund as in DEPOSIT_PAID->CANCELLED but with honored_count evaluated at cancel time"
          - "Release AppointmentBlock"
          - "Cancel all non-terminal origin_type=PARTY WorkshopSessions (-> ABANDONED), marking their PartyGuests NO_SHOW"
          - "increments PartyReservation.version by 1"

  - entity: BuildShipOrder
    initial_state: PLACED
    terminal_states: [HANDED_TO_CARRIER, CANCELLED]
    transitions:
      - from: PLACED
        to: IN_ASSEMBLY
        trigger: "POST /build-ship-orders/{id}/start-assembly"
        actor: WorkshopAssociate
        preconditions:
          - "Store's STUFFING_FIBER on_hand_qty >= PlushModel.required_stuffing_grams; if sound_chip_requested, SOUND_CHIP on_hand_qty >= 1"
        side_effects:
          - "Create origin_type=BUILD_SHIP WorkshopSession in SELECT and set workshop_session_id (the session's own advances will consume the store's consumables, driving the same on_hand ledger as walk-in builds)"
          - "increments BuildShipOrder.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /build-ship-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "increments BuildShipOrder.version by 1"
      - from: IN_ASSEMBLY
        to: CANCELLED
        trigger: "POST /build-ship-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "linked WorkshopSession.status must be before DRESSED (SELECT..BATHED)"
        side_effects:
          - "Cancel the linked WorkshopSession (-> ABANDONED), which restores its consumed consumables"
          - "increments BuildShipOrder.version by 1"
      - from: READY_FOR_PICKUP
        to: HANDED_TO_CARRIER
        trigger: "POST /build-ship-orders/{id}/handoff"
        actor: WorkshopAssociate
        preconditions:
          - "carrier_code and tracking_number supplied"
        side_effects:
          - "handed_over_at = current logical clock (this timestamp is the inclusion criterion for consignment_settlement)"
          - "increments BuildShipOrder.version by 1"
      - from: IN_ASSEMBLY
        to: READY_FOR_PICKUP
        trigger: "system (linked WorkshopSession reaches PAID via POST /workshops/{id}/payment)"
        actor: system
        preconditions:
          - "workshop_session_id session status == PAID"
        side_effects:
          - "increments BuildShipOrder.version by 1"

  - entity: StuffedAnimal
    initial_state: IN_PROGRESS
    terminal_states: [RECOVERED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (origin WorkshopSession DRESSED -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "increments StuffedAnimal.version by 1"
      - from: COMPLETED
        to: LOST_REPORTED
        trigger: "POST /animals/{id}/report-lost"
        actor: Customer
        preconditions:
          - "The acting Customer.id == StuffedAnimal.customer_id (ownership)"
        side_effects:
          - "increments StuffedAnimal.version by 1"
      - from: LOST_REPORTED
        to: RECOVERED
        trigger: "POST /animals/{id}/mark-recovered"
        actor: Customer
        preconditions:
          - "The acting Customer.id == StuffedAnimal.customer_id"
        side_effects:
          - "increments StuffedAnimal.version by 1"
      - from: LOST_REPORTED
        to: COMPLETED
        trigger: "POST /animals/{id}/mark-found-cancel"
        actor: Customer
        preconditions:
          - "The acting Customer.id == StuffedAnimal.customer_id"
        side_effects:
          - "increments StuffedAnimal.version by 1"

  - entity: PartyGuest
    initial_state: INVITED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /party-guests/{id}/confirm"
        actor: Customer
        preconditions:
          - "PartyReservation.status in {QUOTED, DEPOSIT_PAID}"
          - "count of CONFIRMED guests on the reservation < PartyReservation.guest_count"
        side_effects:
          - "increments PartyGuest.version by 1"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "system (guest's WorkshopSession DRESSED -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PartyGuest.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (guest's WorkshopSession abandoned, or party cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PartyGuest.version by 1"
      - from: INVITED
        to: CANCELLED
        trigger: "POST /party-guests/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "increments PartyGuest.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /party-guests/{id}/cancel"
        actor: Customer
        preconditions:
          - "PartyReservation.status in {QUOTED, DEPOSIT_PAID} (after CONFIRMED the guest may only become ATTENDED or NO_SHOW)"
        side_effects:
          - "increments PartyGuest.version by 1"

  - entity: GiftCard
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, DISABLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (redemption drives balance_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /gift-cards/{id}/disable"
        actor: StoreManager
        preconditions: []
        side_effects: []

  - entity: AppointmentBlock
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system (owning PartyReservation cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Frees the room capacity slot and host reservation consumed by overlap checks"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: party-reschedule-stale-version
    parent_entity: PartyReservation
    write_endpoint: "POST /parties/{id}/reschedule"
    occ_field: "expected_party_version"
    description: |
      Rescheduling a PartyReservation whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just rescheduled the same party (which legitimately re-books
      the appointment block under the overlap rules) and the current writer's
      view of the reservation is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: party_deposit_required
    trigger: "POST /parties (quote time, guest_count mode); POST /parties/{id}/cancel (cancel-refund mode)"
    algorithm: threshold
    formula: |
      guest_count mode (quote): deposit_amount_cents =
        if package_tier == ULTIMATE: max(guest_count * PER_GUEST_DEPOSIT_CENTS, ULTIMATE_DEPOSIT_FLOOR_CENTS)
        else: FIXED_DEPOSIT_CENTS
      cancel-refund mode: refund_cents =
        if now >= party_start - MIN_BOOKING_LEAD_HOURS hours: 0
        else: min(guest_count_at_booking, honored_count) * PER_GUEST_DEPOSIT_CENTS
        where honored_count = count of PartyGuests whose status != NO_SHOW at cancel time
        (package_tier does not affect the refund mode)
    input_set: "PartyReservation fields + its PartyGuests (all statuses at cancel time)"
    constants:
      PER_GUEST_DEPOSIT_CENTS: 1000
      FIXED_DEPOSIT_CENTS: 10000
      ULTIMATE_DEPOSIT_FLOOR_CENTS: 20000
      MIN_BOOKING_LEAD_HOURS: 72
    precision: "integer cents; no rounding"
    variants:
      - name: guest_count_mode
        when: "party creation (quote)"
        difference: "Tier-sensitive: ULTIMATE uses max(per-guest, floor); other tiers use the fixed deposit"
      - name: cancel_refund_mode
        when: "party cancellation"
        difference: "Tier-insensitive but attendance-sensitive: refund scales with min(booked, honored) guests and zeroes inside the 72h lead window"

  - name: party_final_amount_due
    trigger: "POST /parties/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      billable_guests = count of PartyGuests with status in {CONFIRMED, ATTENDED}
      per_guest_cents = PACKAGE_PRICES[package_tier]
      per_line rounding (PINNED ORDER): for each billable guest, line_cents =
        per_guest_cents + round_half_up(per_guest_cents * SERVICE_CHARGE_PCT / 100)
      subtotal_cents = sum of line_cents over billable guests   (round per guest, THEN sum)
      final_amount_due_cents = subtotal_cents - deposit_amount_cents
      final may be 0 or positive; a negative result is clamped to 0 and the
      excess deposit is NOT refunded (forfeited).
    input_set: "PartyGuests of this reservation with status in {CONFIRMED, ATTENDED}; PartyReservation.package_tier, deposit_amount_cents"
    constants:
      SERVICE_CHARGE_PCT: 15
      PACKAGE_PRICES: { BASIC: 1899, CELEBRATION: 4299, ULTIMATE: 7999 }
    precision: "integer cents; round_half_up applied per guest line BEFORE summation (summing first then rounding is the rejected alternative)"

  - name: walkin_capacity_occupancy
    trigger: "POST /workshops with origin_type=WALK_IN; and advance-step station selection"
    algorithm: interval_merge
    formula: |
      A new walk-in session starting at T occupies its station during the
      half-open interval [T - SETUP_BUFFER_MIN, T + duration + TEARDOWN_BUFFER_MIN).
      occupancy(T) at station s = count of sessions with assigned_station_id == s
      whose occupied interval covers T (start-inclusive, end-exclusive).
      Admission rule: rejected with ERR_STATION_AT_CAPACITY iff occupancy(T) >= s.capacity.
      Two intervals that merely touch (one ends exactly when the other begins)
      do NOT overlap.
    input_set: "Non-terminal WorkshopSessions (status not in {PAID, ABANDONED}) at the same store with a non-null assigned_station_id"
    constants:
      SETUP_BUFFER_MIN: 15
      TEARDOWN_BUFFER_MIN: 15
      DEFAULT_SESSION_DURATION_MIN: 45
    precision: "integer minutes"

  - name: consumables_on_hand
    trigger: "WorkshopSession SELECTED->STUFFED and STUFFED->SOUNDED advances; abandon compensation; POST /consumables/{id}/restock"
    algorithm: aggregation
    formula: |
      on_hand_qty(t) = initial_qty
        + sum(restock quantities, chronological by created_at)
        - sum(required_stuffing_grams of sessions at stage >= STUFFED that are not ABANDONED-after-restock)
        - sum(1 per session with sound_chip_used that is not ABANDONED-after-restock)
      Abandon from STUFFED or later restores the session's consumed amounts.
      Invariant (stuffing): initial + restocks - consumed + restored == on_hand_qty.
    input_set: "The Consumable row; all WorkshopSessions at the same store; all restock events on the row (chronological by created_at, ties broken by created_at ASC then request order)"
    precision: "integer grams / units"

  - name: consignment_settlement
    trigger: "POST /stores/{store_id}/consignments/run"
    algorithm: aggregation
    formula: |
      window = [window_start, window_end) supplied in the request
      eligible = BuildShipOrders at this store with status == HANDED_TO_CARRIER
        and window_start <= handed_over_at < window_end
      gmv_cents = sum of eligible orders' workshop total_price_cents
        (session totals are per-line rounded already; summation here adds no rounding)
      commission_cents = round_half_up(gmv_cents * COMMISSION_PCT / 100)
      store_bonus_cents = round_half_up(commission_cents / max(count(eligible), 1))
      Evaluation order PINNED: gmv -> commission -> bonus (bonus depends on
      commission, which depends on gmv; no reordering permitted).
    input_set: "BuildShipOrders with status == HANDED_TO_CARRIER whose handed_over_at falls inside the half-open window"
    constants:
      COMMISSION_PCT: 18
    precision: "integer cents; round_half_up"

  - name: station_selector
    trigger: "every POST /workshops/{id}/advance-step (selects the station for the NEXT stage)"
    algorithm: selector
    formula: |
      Candidates: Stations at the session's store whose station_type matches the
      next stage and whose current occupancy (walkin_capacity_occupancy at now)
      is strictly below capacity.
      Ranking: lowest current occupancy first.
      Tie-break: earliest created_at ASC. (Entity id MUST NOT be used.)
      Empty pool: the advance fails with ERR_STATION_AT_CAPACITY.
    input_set: "Stations of the session's store; non-terminal sessions' assignments"
    precision: "n/a"

  - name: party_host_selector
    trigger: "POST /parties/{id}/pay-deposit when staffing_mode == STAFF_HOSTED"
    algorithm: selector
    formula: |
      Candidates: StaffMembers with store_id == party.store_id,
      role_title == PARTY_HOST, and no ACTIVE AppointmentBlock whose
      [block_start, block_end) overlaps the new party interval
      (touching endpoints are NOT an overlap).
      Ranking: fewest ACTIVE reserved blocks ASC.
      Tie-break: earliest created_at ASC.
      Empty pool: ERR_HOST_UNAVAILABLE.
    input_set: "StaffMembers at the store; ACTIVE AppointmentBlocks"
    precision: "n/a"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path parameters reference existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: existence
    check: "Body-referenced resources exist (plush_model_id, store_id, customer_id, gift_card_id, registry_id, collection_drop_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "creation and action endpoints with FK inputs"
  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested action (transition exists from current state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (advance-step, payment, abandon, pay-deposit, finalize, cancel, start-assembly, handoff, report-lost, mark-recovered, confirm, disable, reschedule)"
  - priority: 6
    category: business_temporal
    check: "Temporal rules: party lead time (party_start - now >= 72h at deposit), collection drop window (drop_start <= now < drop_end), finalize only after party end, logical-clock ordering"
    error_id: ERR_OUTSIDE_TIME_WINDOW
    http_status: 409
    applies_to: "POST /parties, POST /parties/{id}/pay-deposit, POST /parties/{id}/cancel, POST /parties/{id}/finalize, POST /workshops (licensed), POST /workshops/{id}/advance-step (licensed SELECT advance)"
  - priority: 7
    category: business_safety
    check: "Licensed-drop safety rails: per-customer purchase limit and total_units exhaustion"
    error_id: ERR_DROP_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /workshops (licensed model), POST /workshops/{id}/advance-step (SELECT -> SELECTED of licensed model)"
  - priority: 8
    category: business_constraint
    check: "Capacity and scheduling constraints: station occupancy < capacity, party room overlap (half-open intervals, touching allowed), host double-booking"
    error_id: "ERR_STATION_AT_CAPACITY | ERR_HOST_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /workshops, POST /workshops/{id}/advance-step, POST /parties, POST /parties/{id}/pay-deposit, POST /parties/{id}/reschedule"
  - priority: 9
    category: business_referential
    check: "Cross-entity referential integrity: licensed model requires collection_drop_id matching its model; gift-card-linked tender requires registry linkage of BOTH the card and this session's animal; guest confirmation requires reservation capacity; birth-certificate fields immutable after PAID"
    error_id: "ERR_REFERENTIAL_INTEGRITY | ERR_GIFT_CARD_NOT_LINKED | ERR_PARTY_GUEST_LIMIT"
    http_status: 409
    applies_to: "POST /workshops, POST /workshops/{id}/payment, POST /animals/{id}/birth-certificate, POST /registries/{id}/link-animal, POST /registries/{id}/link-gift-card, POST /party-guests/{id}/confirm"
  - priority: 10
    category: business_fiscal
    check: "Funds and stock sufficiency: GiftCard.balance_cents >= payment amount; stuffing/sound-chip on_hand sufficient; deposit/payment amounts exact"
    error_id: "ERR_INSUFFICIENT_STOCK | ERR_GIFT_CARD_INSUFFICIENT | ERR_PAYMENT_AMOUNT_MISMATCH"
    http_status: 409
    applies_to: "POST /workshops/{id}/payment, POST /workshops/{id}/advance-step (STUFF, SOUND), POST /build-ship-orders/{id}/start-assembly, POST /parties/{id}/pay-deposit, POST /parties/{id}/pay-balance"
  - priority: 11
    category: business_constraint
    check: "Field-level request shape: enum membership, range bounds (guest_count in 6..20, duration exactly 120, capacities >= 1), unique code/sku/email"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all endpoints with input payloads"

