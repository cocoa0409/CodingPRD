  - section: errors
    instances:
      - name: unresolved_reviews_block_reinstate_and_uncured_resolve_fails
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNRESOLVED_COMPLIANCE_REVIEWS]", "errors[ERR_DRIFT_STILL_BREACHED]"]
        distinguishing_aspect: "Two error codes in one compliance arc: reinstate is blocked while any review is non-RESOLVED, and resolve is rejected while the unrounded weight is still outside the band; curing the drift (buying into the UNDERWEIGHT class) then allows resolve and reinstate."
        test_recipe:
          setup:
            - "ACTIVE trust funded 1,000,000.00; ACTIVE IPS (equity 60.00 +/- 5.00, fixed_income 0.00 +/- 5.00) - activation opened one STANDARD UNDERWEIGHT EQUITY review (all-cash)"
            - "Trust manually SUSPENDED by the executive"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Reinstate Arc", trust_type: "IRREVOCABLE", grantor_name: "G", governing_state: "DE", ein: "04-0000061", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 100000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/investment-policy-statements", payload: { trust_id: "${trust_id}", effective_from: "2026-08-01", effective_to: "2027-08-01", equity_target_pct: 60.00, equity_band_pct: 5.00, fixed_income_target_pct: 0.00, fixed_income_band_pct: 5.00, alternatives_allowed: false }, as: InvestmentManager, captures: { ips: $.data.id } }
            - { call: "POST /trusts/investment-policy-statements/${ips}/activate", as: InvestmentManager }
            - { call: "GET /trusts/compliance-reviews", payload: { trust_id: "${trust_id}" }, as: InvestmentManager, captures: { rev: "$.data[0].id" } }
            - { call: "POST /trusts/${trust_id}/suspend", payload: { reason: "manual hold" }, as: TrustExecutive }
          trigger:
            - { call: "POST /trusts/${trust_id}/reinstate", as: TrustExecutive, captures: { err1: $.data.error_id } }
            - { call: "POST /trusts/compliance-reviews/${rev}/resolve", as: InvestmentManager, captures: { err2: $.data.error_id } }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "BBB", units: 1000, unit_price_cents: 25000, expected_trust_account_version: "${tv2}" }, as: InvestmentManager }
            - { call: "GET /trusts/${trust_id}", as: InvestmentManager, captures: { tv3: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "CCC", units: 1000, unit_price_cents: 15000, expected_trust_account_version: "${tv3}" }, as: InvestmentManager }
            - { call: "POST /trusts/compliance-reviews/${rev}/resolve", as: InvestmentManager }
            - { call: "POST /trusts/${trust_id}/reinstate", as: TrustExecutive }
          assert:
            - "First reinstate fails: error_id == ERR_UNRESOLVED_COMPLIANCE_REVIEWS, http 409"
            - "Resolve while still breached (equity 0.00 < 0.55) fails: error_id == ERR_DRIFT_STILL_BREACHED, http 409"
            - "Buying INTO the underweight class is allowed (only OVERWEIGHT reviews block purchases); after buys equity weight == 0.65 exactly"
            - "Second resolve succeeds (0.65 within [0.55, 0.65] inclusive): ComplianceReview.${rev}.status == RESOLVED"
            - "Second reinstate succeeds: TrustAccount.${trust_id}.status == ACTIVE"

      - name: overweight_breach_blocks_class_purchase_only
        claim_type: violation_to_error
        grounds: ["errors[ERR_IPS_DRIFT_BREACH]", "calculations.ips_drift_measurement"]
        distinguishing_aspect: "Conditional validation: after an OVERWEIGHT EQUITY breach, further EQUITY purchases fail with ERR_IPS_DRIFT_BREACH while a FIXED_INCOME purchase still succeeds (that class has only an UNDERWEIGHT review, which never blocks buys)."
        test_recipe:
