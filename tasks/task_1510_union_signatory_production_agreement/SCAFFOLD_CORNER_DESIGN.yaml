      - name: already_reported_log_rejected_from_second_report
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
          - "errors[ERR_LOG_ALREADY_REPORTED]"
        distinguishing_aspect: "A log listed on an ACCEPTED report (period 1) cannot be listed again on a different period's report — ERR_LOG_ALREADY_REPORTED (referential exclusivity of the inclusion set)."
        test_recipe:
          setup: ["SIGNATORY company; ULB production IN_PRODUCTION; CAMERA ACTIVE; L1 SUBMITTED; report period 1 [L1] ACCEPTED"]
