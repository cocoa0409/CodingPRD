        test_recipe:
          setup: ["Project P; permit DP ACTIVE (max_flow 500, turbidity 50, volume 100000, effective 2026-08-01 -> 2026-09-01)"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-RDL", contract_ref: "C-502", soil_class_default: SOIL_A, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/discharge-permits"
              payload: { project_id: "${p_id}", permit_number: "DP-4", max_flow_gpm: 500, turbidity_limit_ntu: 50, daily_volume_limit_gal: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProjectManager
              captures: { dp_id: $.data.id }
            - call: "POST /site-utility/discharge-readings"
              payload: { discharge_permit_id: "${dp_id}", recorded_at: "2026-08-02T02:00:00Z", flow_gpm: 100, turbidity_ntu: 10, duration_min: 10 }
              as: Foreman
              captures: { r_norm: $.data.id }
            - call: "POST /site-utility/discharge-readings"
              payload: { discharge_permit_id: "${dp_id}", recorded_at: "2026-08-02T01:00:00Z", flow_gpm: 600, turbidity_ntu: 10, duration_min: 5 }
              as: Foreman
              captures: { r_flow: $.data.id }
          trigger:
            - call: "GET /site-utility/discharge-permits/${dp_id}/readings"
              payload: {}
              as: Inspector
            - call: "GET /site-utility/discharge-permits/${dp_id}/readings"
              payload: { classification: EXCEEDS_FLOW }
              as: Inspector
          assert:
            - "Unfiltered: total_count == 2, ordered by recorded_at ASC so ${r_flow} (01:00) precedes ${r_norm} (02:00) despite later creation"
            - "Filtered classification=EXCEEDS_FLOW: total_count == 1 containing only ${r_flow}"
            - "DischargePermit.${dp_id}.exceedance_count == 1 and status stays ACTIVE"

