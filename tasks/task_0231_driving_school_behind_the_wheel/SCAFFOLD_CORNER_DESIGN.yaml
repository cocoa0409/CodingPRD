          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "OWN_PKG", name: "Own Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 30, included_online_hours: 0, included_road_hours: 0, bundle_discount_cents: 0, active: true }
