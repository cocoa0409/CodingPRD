        distinguishing_aspect: "The polymorphic recipient must match recipient_kind exactly: SALE_BUYER carrying participant_id, EARN_A_BIKE_GRADUATE missing participant_id, and COMMUNITY missing recipient_name are all ERR_RECIPIENT_REFERENCE_MISMATCH."
