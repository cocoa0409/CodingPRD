            - { call: "POST /api/quotes", payload: { buyer_id: "${b6_id}", forage_type: "ALFALFA", quality_tier: "GOOD", tons: 10.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b6_id}", captures: { q6_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q6_id}/issue", payload: {}, as: Buyer, as_user_id: "${b6_id}", captures: { q6_v: "$.data.version" } }
            - { call: "POST /api/quotes/${q6_id}/accept", payload: { expected_quote_version: "${q6_v}" }, as: Buyer, as_user_id: "${b6_id}" }
            - { call: "GET /api/contracts?quote_id=${q6_id}", payload: {}, as: BrokerOps, captures: { ct6_id: "$.data[0].id" } }
            - { call: "POST /api/growers", payload: { name: "Grower Eight", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g8_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g8_id}", name: "Lake 4", acres: 55.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g8_id}", captures: { f8_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f8_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g8_id}", captures: { c8_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c8_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g8_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn G", region_code: "OR-WILLAMETTE", capacity_tons: 500.0 }, as: PlatformAdmin, captures: { s8_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c8_id}", storage_site_id: "${s8_id}", bale_type: "ROUND", bale_count: 20, harvested_tonnage: 10.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lot8_id: "$.data.id" } }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lot8_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { t8_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${t8_id}/submit", payload: { lab_reference: "LAB-F" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${t8_id}/record-result", payload: { rfv: 152.0, protein_pct: 16.0, moisture_pct: 14.5 }, as: LabTechnician, as_user_id: "tech-1" }
