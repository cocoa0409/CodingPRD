        claim_type: violation_to_error
        grounds:
          - validations[priority=56]
          - errors[ERR_OVERPAYMENT]
          - calculations.subscription_proration
        distinguishing_aspect: "An ISSUED invoice with amount_due_cents 19627 refuses a 19628-cent payment with 422 ERR_OVERPAYMENT and leaves amount_paid_cents at 0."
        test_recipe:
          setup:
            - "An Account on BLADE_BASIC whose MONTHLY subscription anchored 2026-06-01 was upgraded to WEEKLY, producing a DRAFT invoice of +18300 plus 1327 tax."
            - "That invoice issued, so amount_due_cents is 19627."
          setup_api_calls:
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 2, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
