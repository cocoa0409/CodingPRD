            - *c_tp_pre_front
            - *c_tp_pre_rear
            - *c_tp_pre_interior
            - *c_tp_pre_roof
            - *c_tp_pre_under
            - *c_bk_start
            - *c_read_mid
            - *c_read_post
            - *c_tp_post_front
            - *c_tp_post_rear
            - *c_tp_post_interior
            - *c_tp_post_roof
            - *c_tp_post_under
            - *c_bk_return
            - &c_claim
              call: "POST /rv-marketplace/damage-claims"
              payload:
                booking_id: "${booking_id}"
                cause_code: "COLLISION"
                damage_zone: "EXTERIOR_REAR"
                claimed_amount_cents: 220000
                description: "Rear cap cracked and tail light housing shattered."
              as: Owner
              as_user_id: "${owner_id}"
              captures: { claim_id: "$.data.id", claim_verdict: "$.data.comparison_verdict" }
            - &c_start_review
              call: "POST /rv-marketplace/damage-claims/${claim_id}/start-review"
              as: ClaimsAdjuster
            - &c_request_info
              call: "POST /rv-marketplace/damage-claims/${claim_id}/request-info"
              payload: { info_request_note: "Send the repair estimate from a certified shop." }
              as: ClaimsAdjuster
            - &c_respond
              call: "POST /rv-marketplace/damage-claims/${claim_id}/respond"
              payload: { response_note: "Estimate attached." }
              as: Owner
              as_user_id: "${owner_id}"
            - *c_request_info
            - *c_respond
          trigger:
            - call: "POST /rv-marketplace/damage-claims/${claim_id}/request-info"
              payload: { info_request_note: "Third request — one more photo of the seam." }
              as: ClaimsAdjuster
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response 422"
            - "data.error_id == 'ERR_INFO_ROUND_LIMIT_REACHED'"
            - "GET /rv-marketplace/damage-claims/${claim_id} shows data.status == 'UNDER_REVIEW' (unchanged by the rejected call) and data.info_rounds_used == 2"
            - "GET /rv-marketplace/bookings/${booking_id} shows data.info_round_count == 2 and data.settlement_status == 'DISPUTED'"
            - "the claim's frozen data.comparison_verdict == 'NEW_DAMAGE' with pre_photo_count 1 and post_photo_count 1"

      - name: delivery_assignment_forks_to_waitlisted_without_billing_or_slot
        grounds: >-
          §1.2 DeliveryAssignment REQUESTED -> SCHEDULED versus REQUESTED ->
          WAITLISTED: one trigger, two targets chosen by whether the
          (campground_id, dropoff_date) bucket still has capacity, with the note
          that SCHEDULED bills and consumes a slot while WAITLISTED does neither.
        distinguishing_aspect: >-
          The fork is what makes this instance non-linear rather than merely
          conditional: the SAME POST returns 201 in both branches, so only the
          side effects distinguish them. With daily_dropoff_capacity 1 the first
          assignment takes the slot (Campground.scheduled_assignment_count 1,
          its booking's delivery_fee_cents 15500 and quoted_total_cents 157643),
          and the second is WAITLISTED with promoted_from_waitlist false, its
          booking's delivery_fee_cents still 0 and quoted_total_cents still
          146063, and the campground count still 1. An implementation that
          returns 409 on the second create, or that bills the waitlisted row,
          fails. The windows are deliberately 4 hours apart so the priority-25
          conflict rule cannot be what produces the WAITLISTED outcome.
        test_recipe:
          setup: >-
            Canonical marketplace, a SECOND fully onboarded LISTED listing owned
            by the same owner, a capacity-1 campground, one CAMPGROUND_DROPOFF
            booking per listing both starting 2026-08-29, and a first
            DeliveryAssignment that takes the single slot for a 14:00-16:00
            window.
