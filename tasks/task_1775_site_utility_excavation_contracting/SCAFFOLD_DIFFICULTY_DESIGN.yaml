            - "UtilityOwner.${o_id}.committed_shutdown_minutes == 240 (120 + 120)"
            - "W3 rejected: err == ERR_OWNER_WINDOW_OVERLAP (http 409) — [11:30, 12:30) intersects [10:00, 12:00)"
            - "Project buffer rule did not interfere: the three windows span two projects"

      - name: project_window_buffer_clearance
        grounds:
          - validations[priority=8]
          - entities.ShutdownWindow.fields.status
        distinguishing_aspect: |
          Resource = Project, semantics = buffer-expanded intervals: any new
          window must keep >= 120 minutes clearance from the project's existing
          PROPOSED/CONFIRMED/ACTIVE windows — a 60-minute gap is rejected
          (ERR_PROJECT_WINDOW_BUFFER) while a gap of exactly 120 minutes is
          accepted. Different resource entity and different interval geometry
          (buffer expansion) than the sibling's bare half-open owner overlap.
        test_recipe:
          setup:
            - "Project P ACTIVE, version 1; owners O1 and O2 (min_notice_hours 24, max_shutdown_hours 12); segments S1 (owner O1) and S2 (owner O2); clock at default 2026-08-01T00:00:00Z"
