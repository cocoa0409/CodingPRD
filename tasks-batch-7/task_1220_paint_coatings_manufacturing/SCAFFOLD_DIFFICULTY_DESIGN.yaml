          trigger:
            - { call: "POST /coatings/batches", payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 10, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }, as: ProductionOperator, captures: { ba: $.data.id } }
            - { call: "POST /coatings/batches", payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 10, mill_window_start: "2026-06-10T12:00:00Z", mill_window_end: "2026-06-10T14:00:00Z" }, as: ProductionOperator, captures: { bb: $.data.id } }
