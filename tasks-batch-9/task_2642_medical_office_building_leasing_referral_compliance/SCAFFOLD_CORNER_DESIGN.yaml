            - "Suite.${m1_s_id}.occupancy_status == VACANT — none of these creations reserved the suite"

      - name: lease_lifecycle_draft_to_active_walks_every_declared_hop
        claim_type: valid_transition
        grounds:
          - state_machines[Lease].transitions
