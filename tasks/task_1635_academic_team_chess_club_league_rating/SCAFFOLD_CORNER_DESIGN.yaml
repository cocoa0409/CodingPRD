scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: season_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.Season.fields.provisional_game_threshold"
          - "entities.Season.fields.base_rating"
          - "entities.Season.fields.state_bid_slots_per_region"
        distinguishing_aspect: "Omitting the three optional season inputs applies defaults 20 / 800 / 2 and status REGISTRATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
          trigger:
            - { call: "GET /api/seasons/${sid}", as: FederationAdmin, captures: { t: $.data.provisional_game_threshold, b: $.data.base_rating, s: $.data.state_bid_slots_per_region, st: $.data.status, v: $.data.version } }
          assert:
            - "provisional_game_threshold == 20, base_rating == 800, state_bid_slots_per_region == 2 (${t}, ${b}, ${s})"
            - "status == REGISTRATION (${st}); version == 1 (${v}); id is a prefix-less UUID"

      - name: season_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /api/seasons without regular_due_cents is rejected ERR_INVALID_REQUEST (400) — each source:input field without a default is mandatory."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 — got ${err}"

      - name: coach_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Coach.fields.certification_level"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "certification_level outside {CLUB, CERTIFIED, SENIOR} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Season + club exist"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
          trigger:
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "X", email: "x@x.com", certification_level: "GRANDMASTER" }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400) — got ${err}"

      - name: player_get_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent player id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB is sufficient"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/players/00000000-0000-0000-0000-000000000000", as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404 — got ${err}"

      - name: player_create_body_fk_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=4]"
          - "entities.Player.fields.club_id"
        distinguishing_aspect: "Flat-topology FK integrity: POST /api/players with a nonexistent club_id is rejected ERR_NOT_FOUND (404), proving body FKs are resolved."
        test_recipe:
          setup: ["Empty DB is sufficient"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/players", payload: { club_id: "00000000-0000-0000-0000-000000000000", full_name: "Ghost", grade_level: 9 }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404 — got ${err}"

      - name: player_initial_defaults_and_system_fields
        claim_type: system_fields
        grounds:
          - "entities.Player.fields.rating"
          - "entities.Player.fields.is_provisional"
          - "entities.Player.fields.performance_points"
        distinguishing_aspect: "A player created without initial_rating starts at the season base (800), provisional, 0 points; id/created_at/version are server-stamped with version 1."
        test_recipe:
          setup: ["Season (base 800, threshold 4) ACTIVE; club A exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
          trigger:
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "Newbie", grade_level: 7 }, as: FederationAdmin, captures: { r: $.data.rating, prov: $.data.is_provisional, pts: $.data.performance_points, g: $.data.rated_games_played, v: $.data.version } }
          assert:
            - "rating == 800, is_provisional == true, performance_points == 0, rated_games_played == 0, version == 1 (${r}, ${prov}, ${pts}, ${g}, ${v})"

      - name: ledger_entry_immutability
        claim_type: immutability
        grounds:
          - "entities.LedgerEntry"
        distinguishing_aspect: "LedgerEntry is common_fields:false (no updated_at/version) and has no update/delete endpoint; correction happens only via a new REVERSAL row — the original amount never changes."
        test_recipe:
          setup: ["Season ACTIVE; club A with one ADJUSTMENT +1200 posted by treasurer-1"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 1200, memo: "seed", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1", captures: { le: $.data.id, le_created: $.data.created_at } }
            - { call: "POST /api/ledger-entries/${le}/reverse", payload: {}, as: Auditor, as_user_id: "auditor-1" }
          trigger:
            - { call: "GET /api/ledger-entries/${le}", as: Auditor, captures: { amt: $.data.amount_cents, rb: $.data.reversed_by_id } }
          assert:
            - "Original still amount_cents == 1200 with created_at unchanged (${amt}, ${le_created}); reversed_by_id now set (${rb})"
            - "No version/updated_at fields exist on the row (common_fields: false)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: meet_initial_state_draft
        claim_type: initial_state
        grounds:
          - "state_machines.Meet"
        distinguishing_aspect: "A newly created meet is DRAFT (not SCHEDULED) and occupies no date until /schedule."
        test_recipe:
          setup: ["Season ACTIVE; clubs A,B"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            # second meet on the same date must NOT conflict while meet 1 is DRAFT
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { m1: $.data.id, m1_status: $.data.status } }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_b}", away_club_id: "${club_a}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /api/meets/${m2}/schedule", payload: {}, as: FederationAdmin, captures: { m2_status: $.data.status } }
          assert:
            - "Meet.${m1}.status == DRAFT at creation (${m1_status})"
            - "Meet.${m2} schedules successfully on the same date (${m2_status} == SCHEDULED): DRAFT occupies no date"

      - name: pairing_confirm_before_report_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Pairing"
          - "errors[ERR_PAIRING_INVALID_STATE]"
        distinguishing_aspect: "Confirm on a SCHEDULED (never REPORTED) pairing fails with ERR_PAIRING_INVALID_STATE — transitions only from REPORTED."
        test_recipe:
          setup: ["Season ACTIVE; clubs A,B with players + WAIVED memberships; meet PAIRINGS_PUBLISHED (not started is fine — pairing state is checked first)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W", grade_level: 9 }, as: FederationAdmin, captures: { pw: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pw}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pw}", black_player_id: "${pb}", expected_meet_version: "${mv}" }, as: FederationAdmin, captures: { pair_id: $.data.id } }
          trigger:
            - { call: "POST /api/pairings/${pair_id}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAIRING_INVALID_STATE (409) — got ${err}; pairing stays SCHEDULED"

      - name: meet_cancel_when_completed_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Meet"
          - "errors[ERR_MEET_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is terminal: cancel on a COMPLETED meet fails ERR_MEET_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Season ACTIVE; full meet chain executed to COMPLETED (draw confirmed)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W", grade_level: 9 }, as: FederationAdmin, captures: { pw: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pw}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pw}", black_player_id: "${pb}", expected_meet_version: "${mv}" }, as: FederationAdmin, captures: { pair_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet_id}" }, as: FederationAdmin, captures: { asg: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet_id}/start", payload: {}, as: FederationAdmin }
            - { call: "POST /api/pairings/${pair_id}/report-result", payload: { result: "DRAW" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pair_id}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/meets/${meet_id}/complete", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/meets/${meet_id}/cancel", payload: {}, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEET_INVALID_STATE (409) — got ${err}; meet remains COMPLETED; proctor assignment remains COMPLETED"

      - name: membership_double_pay_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Membership.INVOICED_to_PAID"
          - "errors[ERR_MEMBERSHIP_NOT_PAYABLE]"
        distinguishing_aspect: "Paying the same membership twice: the second pay fails ERR_MEMBERSHIP_NOT_PAYABLE and posts no second debit."
        test_recipe:
          setup: ["Season ACTIVE (regular due 2500); club A funded 10000; player membership INVOICED"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 10000, memo: "fund", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { mem: $.data.id } }
            - { call: "POST /api/memberships/${mem}/pay", payload: {}, as: Treasurer, as_user_id: "treasurer-1" }
          trigger:
            - { call: "POST /api/memberships/${mem}/pay", payload: {}, as: Treasurer, as_user_id: "treasurer-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { bal: $.data.account_balance_cents } }
          assert:
            - "Second pay: error_id == ERR_MEMBERSHIP_NOT_PAYABLE (409) — got ${err}"
            - "Club balance == 7500 (exactly one 2500 debit posted) — got ${bal}"

      - name: club_auto_delinquent_on_negative_balance
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Club.GOOD_STANDING_to_DELINQUENT"
          - "calculations.club_account_balance"
        distinguishing_aspect: "The GOOD_STANDING -> DELINQUENT transition is system-automatic: a manual adjustment that drives the balance below zero flips standing in the same request."
        test_recipe:
          setup: ["Season ACTIVE; club A funded 500 then adjusted -800"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 500, memo: "seed", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1" }
          trigger:
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { cv2: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: -800, memo: "fine", expected_club_version: "${cv2}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { bal: $.data.account_balance_cents, st: $.data.status } }
          assert:
            - "account_balance_cents == -300 and status == DELINQUENT (auto-transition fired) — got ${bal} / ${st}"

      - name: tournament_complete_cascades_entries_and_proctors
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Tournament.RUNNING_to_COMPLETED"
          - "state_machines.TournamentEntry"
          - "state_machines.ProctorAssignment"
        distinguishing_aspect: "Completing a tournament flips REGISTERED and CHECKED_IN entries to FINISHED and CONFIRMED proctor assignments to COMPLETED in one cascade."
        test_recipe:
          setup: ["Season ACTIVE; fee-0 tournament RUNNING with two entries (one CHECKED_IN, one REGISTERED) and one CONFIRMED proctor"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P2", grade_level: 9 }, as: FederationAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p2}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
