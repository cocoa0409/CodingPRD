  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_participant_enrolled
        grounds:
          - state_machines.AttendanceDay.SCHEDULED_to_CHECKED_IN
          - entities.Participant.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair AttendanceDay→Participant: an AttendanceDay's SCHEDULED→CHECKED_IN is gated on the
          Participant being ENROLLED; for a non-enrolled (ELIGIBLE) participant the check-in is rejected
          ERR_PARTICIPANT_NOT_ENROLLED.
        test_recipe:
          setup:
            - "Participant who is ELIGIBLE (not yet enrolled) but has a SCHEDULED AttendanceDay."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center M", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Elig P", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/attendance-days"
              payload: { participant_id: "${p}", service_date: "2026-06-02" }
              as: NurseStaff
              captures: { d: $.data.id }
          trigger:
            - call: "POST /pace/attendance-days/${d}/check-in"
              payload: {}
              as: NurseStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PARTICIPANT_NOT_ENROLLED"

      - name: med_order_activate_requires_care_plan_active
        grounds:
          - state_machines.MedicationOrder.ORDERED_to_ACTIVE
          - entities.CarePlan.fields.status
          - validations[priority=13]
        distinguishing_aspect: |
          Entity pair MedicationOrder→CarePlan (different pair): a MedicationOrder's ORDERED→ACTIVE is gated on its
          referenced CarePlan being ACTIVE; an order whose care plan is still IN_REVIEW is rejected
          ERR_CARE_PLAN_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Participant with a care plan in IN_REVIEW (not yet ACTIVE) and an ORDERED medication order referencing it."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center N", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Med P", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/medication-orders"
              payload: { participant_id: "${p}", care_plan_id: "${cp}", drug_name: "Lisinopril", daily_doses: 1 }
              as: NurseStaff
              captures: { mo: $.data.id }
          trigger:
            - call: "POST /pace/medication-orders/${mo}/activate"
              payload: {}
              as: NurseStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CARE_PLAN_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: transport_leg_vehicle_halfopen_overlap
        grounds:
          - validations[priority=20]
          - entities.TransportLeg.fields.window_start_min
          - errors[ERR_TRANSPORT_OVERLAP]
        distinguishing_aspect: |
          Half-open minute-interval overlap on the TransportLeg/vehicle resource: a PLANNED leg [480,540) on
          vehicle VAN1 on 2026-06-02 blocks a new leg [530,560) (they overlap) but a touching leg [540,600) is
          allowed (half-open, touching endpoints permitted). The colliding insert returns ERR_TRANSPORT_OVERLAP.
        test_recipe:
          setup:
            - "An attendance day with one PLANNED transport leg on vehicle VAN1, window [480,540)."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center O", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Trans P", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/attendance-days"
              payload: { participant_id: "${p}", service_date: "2026-06-02" }
              as: NurseStaff
              captures: { d: $.data.id }
            - call: "POST /pace/transport-legs"
              payload: { attendance_day_id: "${d}", direction: "PICKUP", window_start_min: 480, window_end_min: 540, vehicle_id: "VAN1" }
              as: NurseStaff
              captures: { leg1: $.data.id }
          trigger:
            - call: "POST /pace/transport-legs"
              payload: { attendance_day_id: "${d}", direction: "PICKUP", window_start_min: 530, window_end_min: 560, vehicle_id: "VAN1" }
              as: NurseStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TRANSPORT_OVERLAP"

      - name: capitation_month_must_intersect_enrollment_window
        grounds:
          - validations[priority=24]
          - state_machines.CapitationPayment.DRAFT_to_FINALIZED
          - errors[ERR_NO_COVERAGE_FOR_MONTH]
        distinguishing_aspect: |
          Required-overlap (intersection) interval semantics on the CapitationPayment resource (different entity,
          inverse geometry): finalize requires the service_month day-interval to intersect the enrollment coverage
          interval; a service_month entirely before the enrollment_effective_date has an EMPTY intersection and is
          rejected ERR_NO_COVERAGE_FOR_MONTH — overlap-required, vs the overlap-forbidden transport rule.
        test_recipe:
          setup:
            - "Participant ENROLLED effective 2026-06-01; a DRAFT capitation payment for service_month 2026-04-01 (entirely before enrollment)."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center P", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Cov P", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
              captures: { p_ver: $.data.version }
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${p}", service_month: "2026-04-01", proration_mode: "FULL_MONTH" }
              as: BillingSpecialist
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /pace/capitation-payments/${pay}/finalize"
              payload: { expected_participant_version: "${p_ver}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_COVERAGE_FOR_MONTH"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: capitation_finalize_then_void_ledger_conserved
        grounds:
          - state_machines.CapitationPayment.DRAFT_to_FINALIZED
          - state_machines.CapitationPayment.FINALIZED_to_VOID
          - entities.Participant.fields.ledger_billed_cents
        distinguishing_aspect: |
          Conserved quantity = Participant.ledger_billed_cents. Finalizing a FULL_MONTH dual payment debits
          ledger_billed_cents by 630000; voiding that FINALIZED payment credits it back by total_billed_cents, so
          ledger_billed_cents returns to exactly 0 (pre-finalize value) — invariant pinned as
          ledger_billed_cents == sum(total_billed_cents over FINALIZED), which excludes the voided row.
        test_recipe:
          setup:
            - "Dual participant ENROLLED 2026-06-01; a FULL_MONTH capitation payment for 2026-06-01 is finalized (ledger 630000) then voided."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center Q", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Inv P", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
              captures: { p_ver: $.data.version }
            - call: "POST /pace/capitation-payments"
              payload: { participant_id: "${p}", service_month: "2026-06-01", proration_mode: "FULL_MONTH" }
              as: BillingSpecialist
              captures: { pay: $.data.id }
            - call: "POST /pace/capitation-payments/${pay}/finalize"
              payload: { expected_participant_version: "${p_ver}" }
              as: BillingSpecialist
          trigger:
            - call: "POST /pace/capitation-payments/${pay}/void"
              payload: {}
              as: BillingSpecialist
            - call: "GET /pace/participants/${p}"
              payload: {}
              as: BillingSpecialist
              captures: { final_ledger: $.data.ledger_billed_cents }
          assert:
            - "Participant.${p}.ledger_billed_cents == 0"
            - "CapitationPayment.${pay}.status == VOID"

      - name: disenroll_approve_then_withdraw_census_conserved
        grounds:
          - state_machines.Participant.ENROLLED_to_DISENROLLMENT_PENDING
          - state_machines.Participant.DISENROLLMENT_PENDING_to_ENROLLED
          - entities.Program.fields.enrolled_count
        distinguishing_aspect: |
          Conserved quantity = Program.enrolled_count (a different conserved quantity than the cents ledger):
          approving a voluntary request moves the participant ENROLLED→DISENROLLMENT_PENDING WITHOUT changing
          enrolled_count; withdrawing returns it to ENROLLED. The pair leaves enrolled_count == 1 (the
          forward+compensating actions conserve the count, which only decrements on finalize).
        test_recipe:
          setup:
            - "One ENROLLED participant (enrolled_count 1) with an APPROVED voluntary disenrollment request, then withdrawn."
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "Center R", state_code: "CA", daily_census_capacity: 50, max_roster: 10, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
