scaffold_corner_design:
  - section: entities
    instances:
      - name: venue_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Venue.fields.min_call_hours, entities.Venue.fields.ot1_threshold_hours, entities.Venue.fields.turnaround_min_hours]
        distinguishing_aspect: "Omitting every optional union-parameter field on venue creation yields the pinned defaults (4 / 8 / 12 / 8 / 48 / 72), not nulls."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Bare Venue", union_ruleset: NON_UNION, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
          trigger:
            - { call: "GET /api/venues/${v1}", as: ProductionManager, captures: { v_min: $.data.min_call_hours, v_ot1: $.data.ot1_threshold_hours, v_ot2: $.data.ot2_threshold_hours, v_turn: $.data.turnaround_min_hours, v_pub: $.data.crew_call_publish_lead_hours, v_eng: $.data.engineering_submission_lead_hours } }
          assert:
            - "min_call_hours == 4, ot1_threshold_hours == 8, ot2_threshold_hours == 12, turnaround_min_hours == 8, crew_call_publish_lead_hours == 48, engineering_submission_lead_hours == 72"

      - name: venue_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Venue.fields.union_ruleset, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A union_ruleset value outside {IATSE, TEAMSTERS, NON_UNION} is rejected with ERR_INVALID_REQUEST (400) and nothing is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/venues", payload: { name: "Bad", union_ruleset: "IBEW", max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_INVALID_REQUEST (HTTP 400)"
            - "GET /api/venues afterwards yields total_count == 0"

      - name: production_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "Reading a production by a well-formed but unknown UUID returns ERR_RESOURCE_NOT_FOUND (404), not an empty object or 500."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/productions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_RESOURCE_NOT_FOUND (HTTP 404)"

      - name: duplicate_unique_attribute_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=5]", entities.Technician.fields.union_card_no, entities.EquipmentAsset.fields.asset_tag, entities.Truck.fields.plate_no]
        distinguishing_aspect: "Unique attributes are enforced globally: a second technician with union_card_no U-1001, a second asset tagged ML-001, and a second truck plated T-1 each fail with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one technician (U-1001), one asset (ML-001), one truck (T-1) already exist"]
          setup_api_calls:
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 10000 }, as: WarehouseChief }
          trigger:
            - { call: "POST /api/technicians", payload: { full_name: "Lt Dup", union_card_no: "U-1001", classification: RIGGER, hourly_rate_cents: 9000 }, as: ProductionManager, captures: { e1: $.data.error_id } }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: CONSOLE, weight_kg: 50, daily_rate_cents: 8000, replacement_cost_cents: 200000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { e2: $.data.error_id } }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 8000 }, as: WarehouseChief, captures: { e3: $.data.error_id } }
          assert:
            - "all three duplicates return error_id ERR_INVALID_REQUEST (HTTP 400)"

      - name: production_window_ordering_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=5]", entities.Production.fields.load_in_at]
        distinguishing_aspect: "Production windows must satisfy load_in_at < show_at < load_out_at; a show_at equal to load_in_at is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["venue V1 exists"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "BadWindow", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-01T08:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_INVALID_REQUEST (HTTP 400)"

      - name: asset_status_input_ignored
        claim_type: computed_fields
        grounds: [entities.EquipmentAsset.fields.status]
        distinguishing_aspect: "status is system-owned: a create payload smuggling status=LOST is accepted but the asset is persisted AVAILABLE (the forged value is ignored, not honored)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/assets", payload: { asset_tag: "ML-009", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z", status: "LOST" }, as: WarehouseChief, captures: { a_status: $.data.status, a1: $.data.id } }
          assert:
            - "create succeeds (201) and EquipmentAsset.status == AVAILABLE, proving the client-supplied status was ignored"

      - name: common_system_fields_generated
        claim_type: system_fields
        grounds: [entities.Venue]
        distinguishing_aspect: "Server-minted common fields: created entity carries a UUID id with no type prefix, ISO-8601 created_at, and version starting at exactly 1; every mutation increments version by exactly 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/venues", payload: { name: "Arena", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id, v_ver: $.data.version, v_cat: $.data.created_at } }
          assert:
            - "id is a bare UUID (matches no 'venue_' style prefix), version == 1, created_at present in ISO8601 UTC with three fractional digits"

      - name: asset_list_pagination_and_filters
        claim_type: listing
        grounds: ["endpoints.GET /api/assets", response_envelope.pagination_fields]
        distinguishing_aspect: "List endpoint honors filter + pagination jointly: with 3 MOVING_LIGHT and 1 CONSOLE assets, ?asset_class=MOVING_LIGHT&limit=2 returns 2 items, total_count 3, has_more true; offset=2 returns the 3rd with has_more false."
        test_recipe:
          setup: ["four assets created: three MOVING_LIGHT, one CONSOLE"]
          setup_api_calls:
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-002", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-003", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/assets", payload: { asset_tag: "CS-001", asset_class: CONSOLE, weight_kg: 50, daily_rate_cents: 8000, replacement_cost_cents: 200000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief }
          trigger:
            - { call: "GET /api/assets?asset_class=MOVING_LIGHT&status=AVAILABLE&limit=2&offset=0", as: WarehouseChief }
            - { call: "GET /api/assets?asset_class=MOVING_LIGHT&status=AVAILABLE&limit=2&offset=2", as: WarehouseChief }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
            - "all returned items have asset_class == MOVING_LIGHT and status == AVAILABLE"

  - section: state_machines
    instances:
      - name: plot_approved_cannot_return_to_submitted
        claim_type: invalid_transition
        grounds: [state_machines.LightingPlot, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED is not a declared from-state for to=SUBMITTED; the attempt fails with ERR_INVALID_STATE (409) and the plot stays APPROVED."
        test_recipe:
          setup: ["IATSE venue; production PLANNING; plot APPROVED with one RESERVED point"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
          trigger:
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_INVALID_STATE (HTTP 409); plot remains APPROVED"

      - name: production_cancelled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Production, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: any further transition (here to=PLANNING) on a cancelled production fails with ERR_ALREADY_TERMINAL (409), distinct from a wrong-from-state ERR_INVALID_STATE."
        test_recipe:
          setup: ["IATSE venue; production P1 cancelled from PLANNING"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: CANCELLED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_ALREADY_TERMINAL (HTTP 409)"

      - name: pull_list_entry_initial_state
        claim_type: initial_state
        grounds: [state_machines.PullListEntry]
        distinguishing_aspect: "A newly created pull list entry starts in REQUESTED with null prep windows, null out_at/returned_at, null rental_charge_cents, null load_schedule_id."
        test_recipe:
          setup: ["IATSE venue; production PLANNING; asset AVAILABLE"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e_status: $.data.status, e_prep: $.data.prep_window_start, e_out: $.data.out_at, e_rental: $.data.rental_charge_cents, e_ls: $.data.load_schedule_id } }
          assert:
            - "status == REQUESTED; prep_window_start, out_at, returned_at, rental_charge_cents, load_schedule_id are all null"
            - "the referenced asset is still AVAILABLE (creation does not reserve)"

      - name: final_inspection_pass_certifies_production
        claim_type: side_effect_execution
        grounds: [state_machines.SafetyInspection.IN_PROGRESS_to_PASSED, state_machines.Production.LOAD_IN_to_SHOW_READY]
        distinguishing_aspect: "The FINAL inspection's PASSED transition fires the cross-entity side effect: production moves LOAD_IN -> SHOW_READY in the same request cycle, observable via the inspection response and a production re-read."
        test_recipe:
          setup: ["Production P1 in LOAD_IN with RIGGING and ELECTRICAL inspections PASSED; FINAL inspection IF1 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { as1: $.data.id } }
            - { call: "POST /api/crew-assignments/${as1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: READY_FOR_LOADIN }, as: ProductionManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: LOAD_IN }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: RIGGING }, as: ProductionManager, captures: { ir: $.data.id } }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: ELECTRICAL }, as: ProductionManager, captures: { ie: $.data.id } }
            - { call: "POST /api/inspections/${ie}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${ie}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: FINAL }, as: ProductionManager, captures: { ifn: $.data.id } }
            - { call: "POST /api/inspections/${ifn}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
          trigger:
            - { call: "POST /api/inspections/${ifn}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-1, captures: { fin: $.data.status } }
            - { call: "GET /api/productions/${p1}", as: ProductionManager, captures: { p_status: $.data.status } }
          assert:
            - "SafetyInspection.${ifn}.status == PASSED"
            - "Production.${p1}.status == SHOW_READY (side effect fired by the FINAL pass)"

      - name: sod_rigging_approver_is_submitter_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=3]", "errors[ERR_SOD_VIOLATION]", state_machines.RiggingPoint.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "Segregation of duties: the StructuralEngineer whose X-User-ID equals the point's submitted_by_user_id cannot approve it — ERR_SOD_VIOLATION (403); a different engineer approves successfully."
        test_recipe:
          setup: ["IATSE venue; production PLANNING; plot SUBMITTED; point RP1 UNDER_REVIEW submitted by rig-1"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
          trigger:
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: rig-1, captures: { sod_err: $.data.error_id } }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1, captures: { ap_ok: $.data.status } }
          assert:
            - "approval by user 'rig-1' (the submitter) returns error_id ERR_SOD_VIOLATION (HTTP 403)"
            - "approval by a different engineer 'eng-1' succeeds: status == APPROVED"

      - name: stale_plot_revision_blocks_point_approval
        claim_type: precondition_enforcement
        grounds: ["validations[priority=29]", "errors[ERR_STALE_PLOT_REVISION]", entities.RiggingPoint.fields.plot_version_at_submission]
