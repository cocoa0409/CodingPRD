  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_dispatch
        grounds:
          - validations[priority=4]
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PREPAYMENT_REQUIRED]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): a PREPAY account dispatching an order that is still
          DRAFT (state violation, priority 4) AND unpaid (fiscal violation, priority 15) MUST
          receive ERR_INVALID_STATE — the state check outranks the fiscal one.
        test_recipe:
          setup:
            - "PREPAY account; order created but never reserved (still DRAFT); no prepayment recorded"
          setup_api_calls:
            - call: "POST /library/publishers"
              payload: { name: "Pub Nine" }
              as: LibraryAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /library/works"
              payload: { publisher_id: "${pub_id}", title: "Airs", catalog_number: "P9-001", ensemble_tier: CHAMBER, base_rental_rate_cents: 10000, sale_price_cents: 2000, license_format: PRINT_ONLY }
              as: LibraryAdmin
