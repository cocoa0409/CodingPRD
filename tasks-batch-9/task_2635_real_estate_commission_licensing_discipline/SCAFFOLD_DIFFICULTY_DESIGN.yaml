      - name: auditor_window_capacity_two_is_an_aggregate_count_not_pairwise_exclusion
        grounds:
          - validations[priority=42]
          - errors.ERR_AUDITOR_WINDOW_CAPACITY
          - entities.TrustAudit.fields.auditor_user_id
          - entities.TrustAudit.fields.fieldwork_start_at
