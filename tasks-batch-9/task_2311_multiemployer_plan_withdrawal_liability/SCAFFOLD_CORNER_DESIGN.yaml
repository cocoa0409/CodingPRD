      - name: the_substantial_continuity_threshold_is_inclusive_at_exactly_zero_point_seven
        claim_type: Precision
        grounds:
          - "calculations.substantial_continuity_score"
          - "entities.AssetSaleTransaction.fields.successor_determination"
        distinguishing_aspect: |
          The weights are 0.50, 0.30 and 0.20 and the comparison is score >= 0.7000, so a
          sale landing exactly on the threshold must be SUCCESSOR_LIABLE. The paired sale
          differs by 0.10 on the lightest-weighted factor only, moving the score to 0.6800
          - close enough that a server rounding to two places or using a strict > answers
          differently on one of the two.
        test_recipe:
          setup:
            - "The seller employer with the 2023-2025 contribution history and a separate buyer controlled group. Two submitted sales: one with workforce 0.8, assets 0.6 and customers 0.6, the other identical except customers 0.5."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /controlled-groups"
              payload: { name: "Northgate Acquisition Group", common_control_basis: "COMBINED" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { buyer_cg_id: "$.data.id" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2023, plan_year_end: 2023, contribution_base_units: 20000, contribution_amount_cents: 20000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2024, plan_year_end: 2024, contribution_base_units: 25000, contribution_amount_cents: 25000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v3: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2025, plan_year_end: 2025, contribution_base_units: 30000, contribution_amount_cents: 30000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v3}" }
              as: FundAdministrator
              as_user_id: "fa-001"
            - call: "POST /asset-sale-transactions"
              payload: { seller_employer_id: "${emp_id}", buyer_controlled_group_id: "${buyer_cg_id}", closing_date: "2026-05-01T00:00:00Z", closing_plan_year: 2026, purchase_price_cents: 300000000, bond_amount_cents: 30000000, buyer_assumes_contribution_obligation: true, workforce_continuity_pct: 0.8, asset_continuity_pct: 0.6, customer_continuity_pct: 0.6 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { sale_at_id: "$.data.id" }
            - call: "POST /asset-sale-transactions"
              payload: { seller_employer_id: "${emp_id}", buyer_controlled_group_id: "${buyer_cg_id}", closing_date: "2026-05-01T00:00:00Z", closing_plan_year: 2026, purchase_price_cents: 300000000, bond_amount_cents: 30000000, buyer_assumes_contribution_obligation: true, workforce_continuity_pct: 0.8, asset_continuity_pct: 0.6, customer_continuity_pct: 0.5 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { sale_below_id: "$.data.id" }
          trigger:
            - call: "POST /asset-sale-transactions/${sale_at_id}/adjudicate"
              payload: { disposition: "DETERMINE_SUCCESSOR" }
              as: PlanTrustee
              as_user_id: "tr-001"
              captures: { score_at: "$.data.substantial_continuity_score", det_at: "$.data.successor_determination" }
            - call: "POST /asset-sale-transactions/${sale_below_id}/adjudicate"
              payload: { disposition: "DETERMINE_SUCCESSOR" }
              as: PlanTrustee
              as_user_id: "tr-001"
              captures: { score_below: "$.data.substantial_continuity_score", det_below: "$.data.successor_determination" }
          assert:
            - "At the threshold: HTTP 200 with score_at == 0.7000 (0.50*0.8 + 0.30*0.6 + 0.20*0.6) and det_at == \"SUCCESSOR_LIABLE\", with status == \"SUCCESSOR_DETERMINED\" and exemption_status == \"NOT_EXEMPT\"."
            - "Below the threshold: HTTP 200 with score_below == 0.6800 and det_below == \"NO_SUCCESSOR_LIABILITY\"."
            - "GET /controlled-groups/${buyer_cg_id} reports joint_exposure_cents == 0 and exposure_score == 0.0000, because the seller's outstanding_liability_cents is 0 - the SUCCESSOR_LIABLE branch moves the seller's balance, not the purchase price."
            - "Neither adjudication touches bond_posture, which stays \"UNBONDED\" on the buyer group."

      - name: the_dollar_versus_cbu_basis_divergence_is_covered_by_the_dual_variant_depth_probe
        claim_type: Variant Divergence
        grounds:
          - "calculations.allocation_fraction_and_gross_share"
        distinguishing_aspect: |
          Variant divergence needs one dataset run through both MODIFIED_PRESUMPTIVE and
          ROLLING_5 with the delta pinned, which is exactly the depth probe's shape.
        excluded_because:
          difficulty_instance: allocation_method_dollar_basis_versus_cbu_basis_divergence
          rationale: "The depth probe already runs identical contribution data under both bases and asserts the 55000000 delta plus the divergent amortization shapes; a breadth restatement would assert one of its two halves."

      - name: the_presumptive_per_pool_rounding_order_is_covered_by_the_rounding_mode_depth_probe
        claim_type: Precision
        grounds:
          - "calculations.allocation_fraction_and_gross_share"
        distinguishing_aspect: |
          The PRESUMPTIVE variant rounds once per decayed pool term, so a fixture whose
          sum-then-round answer differs by one cent is the only way to see it.
        excluded_because:
          difficulty_instance: presumptive_pool_terms_rounded_before_summing_mode_b
          rationale: "The depth probe pins all three pool terms and the one-cent divergence from sum-then-round; there is no independent breadth claim left."

      - name: the_twenty_year_cap_evaluation_order_is_covered_by_the_pinned_order_depth_probe
        claim_type: Correct Result
        grounds:
          - "calculations.amortization_and_twenty_year_cap"
        distinguishing_aspect: |
          The cap sits at the end of a fixed chain - gross, de minimis, credit, annual
          payment, n_req, forgiveness - and the interesting claim is the ORDER, not any
          single link.
        excluded_because:
          difficulty_instance: twenty_year_cap_pinned_evaluation_order_mode_c
          rationale: "The depth probe pins every intermediate of the chain in one assertion set; a breadth instance could only re-pin the final installment amounts."

      - name: the_de_minimis_phaseout_boundary_is_covered_by_the_inclusive_threshold_depth_probe
        claim_type: Constants Applied
        grounds:
          - "calculations.de_minimis_reduction"
        distinguishing_aspect: |
          The at-threshold and threshold-plus-one-cent pair is the whole claim for the
          phaseout start.
        excluded_because:
          difficulty_instance: de_minimis_phaseout_inclusive_at_exactly_ten_million_cents
          rationale: "The depth probe drives gross 10000000 and 10000001 side by side; the UVB-fraction branch of the same formula is covered here by the_de_minimis_base_is_capped_by_the_uvb_fraction_not_by_the_statutory_five_million."

      - name: the_seventy_percent_decline_boundary_is_covered_by_the_inclusive_ratio_depth_probe
        claim_type: Precision
        grounds:
          - "calculations.seventy_percent_decline_test"
        distinguishing_aspect: |
          The decline test turns on ratio <= 0.300000 at six decimal places, so the claim
          is the boundary pair, not the formula.
        excluded_because:
          difficulty_instance: seventy_percent_decline_inclusive_at_ratio_exactly_zero_point_three
          rationale: "The depth probe drives CBU 9000 and 9001 through base-year selection, testing average and ratio; a breadth instance would restate its first half."

      - name: the_anchor_valuation_certification_requirement_is_covered_by_the_lookback_depth_probe
        claim_type: Input Set Filtering
        grounds:
          - "calculations.anchor_valuation_selector"
        distinguishing_aspect: |
          The selector must reject a DRAFT anchor and must insist that every year of the
          ratio window is certified, which is a five-step walk.
        excluded_because:
          difficulty_instance: assessment_creation_requires_every_lookback_valuation_certified
          rationale: "The depth probe certifies the five lookback years one at a time and asserts the refusal at each stage, which strictly contains the single-anchor claim."

      - name: the_valuation_quiet_buffer_arithmetic_is_covered_by_the_interval_depth_probe
        claim_type: Constants Applied
        grounds:
          - "calculations.anchor_valuation_selector"
        distinguishing_aspect: |
          VALUATION_QUIET_BUFFER_DAYS only matters at the exact instant where a new
          half-open window starts 30 days after another window's end.
        excluded_because:
          difficulty_instance: valuation_measurement_windows_are_half_open_with_a_thirty_day_quiet_buffer
          rationale: "The depth probe drives the boundary from both sides on the same plan; restating it as a calculation claim would duplicate its setup and its assertions."

      - name: the_collection_status_projection_over_generations_is_covered_by_the_parallel_depth_probe
        claim_type: Input Set Filtering
        grounds:
          - "calculations.collection_status_projection"
        distinguishing_aspect: |
          The projection reads only the highest-generation non-terminal schedule, so the
          claim only bites once a SUPERSEDED generation exists alongside an ACTIVE one.
        excluded_because:
          difficulty_instance: assessment_review_and_collection_dimensions_advance_independently
          rationale: "The depth probe walks the projection across a regeneration boundary with a SUPERSEDED generation still on file, which is the only configuration where the filter is observable."

  # =======================================================================
  # SECTION: validations - the forty-four ordered checks across thirteen priority
  # tiers, including the tier conflicts that fix their order.
  # =======================================================================
  - section: validations
    instances:

      - name: the_review_window_is_inclusive_at_ninety_days_and_closed_one_second_later
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_REVIEW_WINDOW_CLOSED]"
          - "entities.LiabilityAssessment.fields.review_deadline_at"
        distinguishing_aspect: |
          REVIEW_WINDOW_DAYS is 90 and the comparison is 'at or before', so the last
          instant of the ninetieth day is still open. The pair also pins the units: an
          implementation that stores the deadline as a date and compares dates would accept
          the request one second late as well.
        test_recipe:
          setup:
            - "Two independent baselines, each with an assessment issued at 2026-08-01 so review_deadline_at is 2026-10-30T00:00:00Z. The first plan's clock is moved to exactly that instant, the second to one second later."
