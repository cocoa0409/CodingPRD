            - "after trigger call 1, CommissioningPackage.${pkg_l1_id}.witness_status == PENDING and witnessed_by_user_id == null"
            - "after trigger call 2, ContainmentZone.${zone2_id}.leakage_status == REMEDIATION with measured_leakage_pct == null and measured_static_pressure_pa == null"
