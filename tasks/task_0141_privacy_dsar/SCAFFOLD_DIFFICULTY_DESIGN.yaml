  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: deadline_window_inclusive_endpoint_request_clock
        grounds:
          - calculations.statutory_deadline
          - validations[priority=5]
          - entities.DsarRequest.fields.deadline_at
        distinguishing_aspect: |
          The DsarRequest deadline interval [received_at, deadline_at] is INCLUSIVE at its right edge:
          at clock == deadline_at the request occupies a still-open window so verify-identity is admitted,
          but at deadline_at + 1 second the window is closed and the request is swept to CLOSED_EXPIRED.
        test_recipe:
          setup:
            - "GDPR request PENDING_VERIFICATION with deadline 2026-02-04T09:00:00Z; advance clock one second past the deadline."
          setup_api_calls:
            - call: "POST /controllers"
              payload: { name: "C14", jurisdiction: "GDPR", dpo_email: "dpo@c14.example" }
              as: PrivacyOfficer
              captures: { ctrl_id: $.data.id }
