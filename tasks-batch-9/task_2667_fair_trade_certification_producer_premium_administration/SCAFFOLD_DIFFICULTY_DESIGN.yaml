  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: premium_proposal_suspension_outranks_insufficient_fund_balance
        grounds:
          - validations.priority_15_ERR_PREMIUM_USE_BLOCKED_BY_SUSPENSION
          - validations.priority_31_ERR_FUND_BALANCE_INSUFFICIENT
        distinguishing_aspect: |
          The conflicting pair is business_safety (priority 15) against business_fiscal
          (priority 31): a single create request violates both the suspension block and the
          balance ceiling, and the safety error must win even though the fiscal error is the
          more "obvious" arithmetic failure. Falsifiability is built in: the same request after
          reinstatement returns the fiscal error, so a wrong ordering is visible as a 402.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED, PHYSICAL cooperative node with certified_input_kg 50000, 5-member committee chaired by chair-1"
            - "one 15000 kg non-organic coffee trade VERIFIED and SETTLED, so total_accrued_cents and balance_cents are 1200000 and the committee is ACTIVE"
            - "the holder is then SUSPENDED manually with reason AUDIT_FINDING"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
            - call: "POST /fairtrade/premium-committees"
              payload: { holder_id: "${prod_id}", chair_user_id: "chair-1", member_count: 5, approved_use_categories: ["EDUCATION", "INFRASTRUCTURE"] }
              as: CertificationOfficer
              captures: { cmte_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 15000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t1_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/certificate-holders/${prod_id}/premium-funds"
              payload: {}
              as: CertificationOfficer
              captures: { fund_id: "$.data[0].id", fund_v1: "$.data[0].version" }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/suspend"
              payload: { reason: "AUDIT_FINDING" }
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/premium-use-proposals"
              payload: { committee_id: "${cmte_id}", title: "Village water point", use_category: "INFRASTRUCTURE", requested_amount_cents: 2000000, use_period_start: "2026-09-01", use_period_end: "2026-10-01", expected_fund_version: "${fund_v1}" }
              as: CommitteeChair
              as_user_id: "chair-1"
          assert:
            - "HTTP 409 with error_id == ERR_PREMIUM_USE_BLOCKED_BY_SUSPENSION, not 402 ERR_FUND_BALANCE_INSUFFICIENT"
            - "PremiumFund.${fund_id}.pending_proposal_count == 0 and balance_cents == 1200000, so the rejected request wrote nothing"
            - "PremiumCommittee.${cmte_id}.status == ACTIVE and open_proposal_count == 0"
            - "control on the same fixture: a 500000-cent request that satisfies rule 31 but not rule 15 still returns 409 ERR_PREMIUM_USE_BLOCKED_BY_SUSPENSION"
            - "control after POST /fairtrade/certificate-holders/${prod_id}/reinstate: the identical 2000000-cent request returns 402 ERR_FUND_BALANCE_INSUFFICIENT, proving rule 31 is live and was merely outranked"

      - name: unauthorized_role_outranks_missing_transaction_returns_403
        grounds:
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_4_ERR_TRANSACTION_NOT_FOUND
        distinguishing_aspect: |
          A different error-category pair from the instance above — auth (priority 2) against
          existence (priority 4) — and the resource in question does not exist at all, so the
          implementation must refuse on the role check before it ever probes storage. Leaking a
          404 here would tell an unauthorized caller whether a transaction id is real.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one CERTIFIED PRODUCER_ORG holder exists so the acting ProducerRepresentative is a real principal"
            - "no TradeTransaction with id 00000000-0000-4000-8000-000000000000 exists"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/trade-transactions/00000000-0000-4000-8000-000000000000/verify"
              payload: { outcome: "VERIFIED" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
          assert:
            - "HTTP 403 with error_id == ERR_UNAUTHORIZED, not 404 ERR_TRANSACTION_NOT_FOUND"
            - "the response body carries only error_id and message, disclosing nothing about the id"
            - "control: the same call with no X-User-ID header returns 401 ERR_UNAUTHENTICATED, since priority 1 outranks priority 2"
            - "control: the same nonexistent id called as Auditor with X-User-ID auditor-1 returns 404 ERR_TRANSACTION_NOT_FOUND, proving rule 4 is live"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: license_fee_tier_boundary_at_100000_kg_flips_tier_and_fee_by_one_cent
        grounds:
          - calculations.label_license_fee
          - entities.CertificateHolder.fields.license_tier
          - entities.CertificateHolder.fields.license_fee_cents
        distinguishing_aspect: |
          Metric is licensed_volume_kg against LICENSE_TIER_1_CAP_KG, and the endpoint is the
          <= breakpoint: exactly 100000 kg is still TIER_1 while 100000.625 kg is TIER_2. The
          precision hook is that the 0.625 kg spilled into tier 2 costs 0.5 cents, which
          round_half_up must turn into a whole cent, so the fee moves by exactly 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "two CERTIFIED BRAND holders, Nordic Roasters and Alpine Chocolate, neither holding a label license yet"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_a_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_a_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Alpine Chocolate", holder_type: "BRAND", country_code: "CH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { brand_b_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_b_id}/certify"
              payload: {}
              as: CertificationOfficer
          trigger:
            - call: "POST /fairtrade/certificate-holders/${brand_a_id}/label-license"
              payload: { license_year: 2026, licensed_volume_kg: 100000 }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${brand_b_id}/label-license"
              payload: { license_year: 2026, licensed_volume_kg: 100000.625 }
              as: CertificationOfficer
          assert:
            - "CertificateHolder.${brand_a_id}.license_tier == TIER_1 and license_fee_cents == 382950"
            - "CertificateHolder.${brand_b_id}.license_tier == TIER_2 and license_fee_cents == 382951"
            - "the 1-cent delta proves the marginal 0.625 kg was priced at LICENSE_TIER_2_RATE_CENTS_PER_KG and rounded half up from 0.5 to 1, not truncated to 0"
            - "both holders have label_license_status == ACTIVE, license_fee_paid_cents == 0 and license_fee_settled == false"
            - "control just below the endpoint: 99999 kg yields license_tier TIER_1 and license_fee_cents == 382949, one cent below the 100000 kg figure"

      - name: mass_balance_credit_gate_accepts_exact_equality_and_rejects_one_gram_more
        grounds:
          - calculations.mass_balance_credit_ledger
          - validations.priority_30_ERR_MASS_BALANCE_CREDIT_EXCEEDED
        distinguishing_aspect: |
          A different metric on a different endpoint: volume_kg against a MASS_BALANCE node's
          available_credit_kg, where the gate is strictly greater than, so the endpoint value
          itself is legal. The precision hook is the third decimal of a kilogram — 0.001 kg
          over a zero balance must be refused, which forces exact decimal arithmetic rather
          than a float comparison that would see 0.001 as noise.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder for COCOA, CERTIFIED, owning one MASS_BALANCE cooperative node"
            - "BRAND holder for COCOA, CERTIFIED, owning one MASS_BALANCE brand node downstream of that cooperative"
            - "a single harvest declaration of 1000 kg, so the cooperative has certified_input_kg 1000.000 and available_credit_kg 1000.000"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Cocoa Union", holder_type: "PRODUCER_ORG", country_code: "GH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Alpine Chocolate", holder_type: "BRAND", country_code: "CH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "MASS_BALANCE" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "MASS_BALANCE", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 1000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COCOA", quality_grade: "STANDARD", volume_kg: 1000, declared_unit_price_cents_per_kg: 400, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v2: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COCOA", quality_grade: "STANDARD", volume_kg: 0.001, declared_unit_price_cents_per_kg: 400, contract_date: "2026-08-01", expected_seller_node_version: "${node_v2}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
          assert:
            - "the first create returns 201: volume_kg exactly equal to available_credit_kg is accepted because the gate is strictly greater than"
            - "TradeTransaction.${t1_id}.premium_basis == MASS_BALANCE and premium_cents == 58350 and premium_volume_kg == 1000.000"
            - "SupplyChainNode.${sell_node_id}.reserved_output_kg == 1000.000 and available_credit_kg == 0.000"
            - "the second create returns 422 with error_id == ERR_MASS_BALANCE_CREDIT_EXCEEDED"
            - "after the rejection SupplyChainNode.${sell_node_id}.reserved_output_kg is still 1000.000 and version is unchanged from ${node_v2}"
            - "control: after one further harvest declaration of 0.001 kg on the same node the identical 0.001 kg create returns 201, so the refusal was the credit balance and not the sub-gram volume"

