scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: supplier_create_returns_declared_defaults_and_version_one
        claim_type: Creation
        grounds:
          - entities.Supplier
          - endpoints.POST_/opaque/suppliers
        distinguishing_aspect: "Creating a supplier without parity_protection_enabled defaults it to true; status starts ACTIVE, version 1, and system fields id/created_at/updated_at are server-generated."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Beacon Lodging Group", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.12 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Supplier.${sup_id}.parity_protection_enabled == true"
            - "Supplier.${sup_id}.status == ACTIVE and version == 1"
            - "id, created_at and updated_at are non-null"

      - name: opaque_bid_create_fixed_mode_ignores_bid_price_and_computes_price
        claim_type: Defaults
        grounds:
          - entities.OpaqueBid.fields.computed_price_cents
          - validations[priority=9]
        distinguishing_aspect: "In FIXED mode a supplied bid_price_cents is ignored per priority 9 mode semantics, and computed_price_cents is snapshotted from the candidate floor at creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB15 base: supplier (commission 0.15, min disc 0.10), property (star 4, published 20000), zone, window rate 15000 covering Oct 1-5 with rooms 5. Customer C."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB15", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB15", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc1@x.com", full_name: "Corner Cust One" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB15", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED", bid_price_cents: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          assert:
            - "the response status is 201"
            - "OpaqueBid.${bid_id}.computed_price_cents == 27000"
            - "OpaqueBid.${bid_id}.status == PENDING"
            - "the ignored bid_price_cents does not change computed_price_cents"

      - name: opaque_bid_create_missing_min_star_rating_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.OpaqueBid.fields.min_star_rating
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "min_star_rating is a required input with no default; omitting it produces 400 ERR_INVALID_REQUEST at the generic required-field layer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer C exists; zone NB16 exists."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/customers"
              payload: { email: "cc2@x.com", full_name: "Corner Cust Two" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB16", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB16", check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

      - name: customer_get_unknown_id_returns_customer_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/opaque/customers/{customerId}
          - errors.ERR_CUSTOMER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the customer path segment returns 404 ERR_CUSTOMER_NOT_FOUND — the entity-specific error, not a generic 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /opaque/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_CUSTOMER_NOT_FOUND"

      - name: rate_windows_list_filters_by_property_and_status_with_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/opaque/rate-windows
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /opaque/rate-windows honors property_id and status filters plus limit/offset pagination; total_count reflects the filtered set, has_more reflects the page position."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Supplier S, property P, and three windows on P; one of them closed."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB17", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
              captures: { w1: $.data.id, w1_v: $.data.version }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-06T00:00:00Z", check_out_date: "2026-10-10T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-11T00:00:00Z", check_out_date: "2026-10-15T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/rate-windows/${w1}/close"
              payload: { expected_rate_window_version: "${w1_v}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /opaque/rate-windows"
              payload: { property_id: "${prop_id}", status: "OPEN", limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /opaque/rate-windows?property_id=${prop_id}&status=OPEN&limit=1&offset=1 returns 1 row with has_more == false"
            - "GET /opaque/rate-windows?property_id=${prop_id} returns 3 rows"

      - name: winning_property_id_input_ignored_and_brand_never_leaks_on_bid
        claim_type: System Fields
        grounds:
          - entities.OpaqueBid.fields.winning_property_id
          - entities.Property.fields.brand_name
        distinguishing_aspect: "winning_property_id and winning_rate_window_id are system-sourced: a client that smuggles winning_property_id into the create payload is ignored, and the PENDING bid response contains no brand_name."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB18 base: supplier, property P (brand_name 'SecretBrand'), zone, window; customer C."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB18", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "SecretBrand", star_rating: 4, neighborhood_code: "NB18", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc3@x.com", full_name: "Corner Cust Three" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB18", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED", winning_property_id: "${prop_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          assert:
            - "the response status is 201 and OpaqueBid.${bid_id}.winning_property_id is null"
            - "the response body contains no brand_name field and no occurrence of 'SecretBrand'"

      - name: property_create_with_star_rating_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Property.fields.star_rating
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "star_rating is an integer constrained to 1..5 inclusive; 0 and 6 are both rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Supplier S exists."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P0", star_rating: 0, neighborhood_code: "NB19", amenity_codes: [], published_rate_cents: 10000 }
              as: PlatformAdmin
              captures: { err0: $.data.error_id }
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P6", star_rating: 6, neighborhood_code: "NB19", amenity_codes: [], published_rate_cents: 10000 }
              as: PlatformAdmin
              captures: { err6: $.data.error_id }
          assert:
            - "both responses are 400 with err0 == ERR_INVALID_REQUEST and err6 == ERR_INVALID_REQUEST"
            - "GET /opaque/properties?supplier_id=${sup_id} returns 0 rows"

      - name: opaque_bid_body_fk_customer_checked_before_neighborhood_zone
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/opaque/opaque-bids
          - errors.ERR_CUSTOMER_NOT_FOUND
        distinguishing_aspect: "Flat topology puts customer_id in the body; with an unknown customer_id and an unknown neighborhood_code the answer is ERR_CUSTOMER_NOT_FOUND because body FK existence runs before the zone-dependent disclosure check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", neighborhood_code: "NOSUCH", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_CUSTOMER_NOT_FOUND"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdraw_on_terminal_bid_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.OpaqueBid
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "WITHDRAWN is terminal: withdrawing the same bid twice must fail the second time with 409 ERR_INVALID_STATE and no further mutation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB20 base: supplier, property, zone, window; customer C with a PENDING FIXED bid already withdrawn once."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB20", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB20", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc4@x.com", full_name: "Corner Cust Four" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB20", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /opaque/opaque-bids/${bid_id}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "OpaqueBid.${bid_id}.status remains WITHDRAWN"

      - name: pending_bid_expires_when_clock_reaches_check_in
        claim_type: Valid Transition
        grounds:
          - state_machines.OpaqueBid.PENDING_to_EXPIRED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The clock-set endpoint re-evaluates PENDING bids: moving the logical clock to the bid's check_in_date auto-transitions it to EXPIRED with no API call against the bid itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB21 base; customer C with a PENDING bid checking in 2026-10-02."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB21", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB21", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc5@x.com", full_name: "Corner Cust Five" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB21", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "OpaqueBid.${bid_id}.status == EXPIRED"
            - "no Booking exists for customer ${cust_id}"

      - name: resolve_dissatisfied_reveal_with_full_refund_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ComplaintCase.UNDER_REVIEW_to_RESOLVED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Non-refundable terms pin a category→resolution constraint: DISSATISFIED_REVEAL may never resolve FULL_REFUND; the attempt is a 400 ERR_INVALID_REQUEST and the case stays UNDER_REVIEW."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB22 base; customer C with an accepted FIXED bid, booking, and a DISSATISFIED_REVEAL case in UNDER_REVIEW."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB22", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB22", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc6@x.com", full_name: "Corner Cust Six" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB22", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
            - call: "GET /opaque/bookings"
              payload: { customer_id: "${cust_id}" }
              as: PlatformAdmin
              captures: { booking_id: "$.data[0].id" }
            - call: "POST /opaque/complaint-cases"
              payload: { booking_id: "${booking_id}", category: "DISSATISFIED_REVEAL", description: "expected a nicer brand" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { case_id: $.data.id }
            - call: "POST /opaque/complaint-cases/${case_id}/start-review"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /opaque/complaint-cases/${case_id}/resolve"
              payload: { resolution: "FULL_REFUND" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "ComplaintCase.${case_id}.status remains UNDER_REVIEW and resolution == NONE"

      - name: settled_booking_is_locked_against_service_failure
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Booking.transitions
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once a booking's fulfillment dimension reaches SETTLED via batch approval, mark-service-failure is locked out with 409 ERR_INVALID_STATE even if a FULL_REFUND complaint resolves afterwards."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB23 base; customer C with an accepted bid; booking settled via an approved October batch; then a SERVICE_FAILURE complaint resolved FULL_REFUND."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB23", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB23", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "cc7@x.com", full_name: "Corner Cust Seven" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB23", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
