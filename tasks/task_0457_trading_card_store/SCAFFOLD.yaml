# =============================================================================
# Trading Card & Hobby Game Store — PRD Benchmark Scaffold (Expert tier)
# §1.0–§1.7 + preamble. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Trading Card & Hobby Game Store: inventory (singles/sealed) & condition,
  buylist & trade-in credit, tournament/event registration & pairings,
  organized-play (WPN) reporting, pre-order/release allocation,
  grading-submission intake, consignment case, loyalty/store credit

domain_name: trading-card-store
api_prefix: ""        # flat topology: peer collections at root (/customers, /events, ...)

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # peer entities linked by foreign keys; no nested ownership URLs.

  state_machine_shape: cyclic
  # Event runs cyclic pairing rounds; Registration carries parallel dimensions
  # (payment_status x checkin_status); GradingSubmission branches (GRADED|REJECTED).

  relationship_patterns:
    - one_to_many        # Customer -> Registration, BuylistSubmission -> BuylistLine
    - many_to_many       # Customer <-> Event via Registration; Pairing links two Registrations
    - cross_aggregate    # PreOrder references ReleaseProduct + Customer across aggregates

  role_model: peer_roles
  # Customer owns own registrations/buylists/pre-orders; StoreManager + JudgeStaff
  # are operational (opaque); StoreManager is an operational superset over store ops.

  consistency_model: immediate
  # all cascades resolve atomically within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Customer email; unique across customers" }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD — derived from lifetime_spend_cents thresholds", default: "BRONZE", constraints: "one of BRONZE, SILVER, GOLD" }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Cumulative cash + store-credit spend across paid registrations and fulfilled pre-orders", default: 0 }
      - { name: store_credit_balance_cents, type: integer, source: computed, description: "Available store credit in cents; equals the running sum of all StoreCreditLedger.delta_cents rows for this customer", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BANNED — banned customers cannot register or check in", default: "ACTIVE", constraints: "one of ACTIVE, BANNED" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Card or product name, e.g. 'Black Lotus'" }
      - { name: product_kind, type: enum, source: input, description: "SINGLE | SEALED", constraints: "one of SINGLE, SEALED" }
      - { name: condition, type: enum, source: input, description: "Card condition grade for SINGLE; defaults to MINT for SEALED", default: "NEAR_MINT", constraints: "one of MINT, NEAR_MINT, LIGHTLY_PLAYED, MODERATELY_PLAYED, DAMAGED" }
      - { name: market_price_cents, type: integer, source: input, description: "Reference market price per unit in cents", constraints: ">= 0" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Physical units currently owned by the store", default: 0, constraints: ">= 0" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Units committed to confirmed-but-undelivered orders/consignment holds", default: 0, constraints: ">= 0 and <= quantity_on_hand" }

  - name: BuylistSubmission
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the seller" }
      - { name: payout_method, type: enum, source: input, description: "STORE_CREDIT | CASH — fixes which valuation variant applies", constraints: "one of STORE_CREDIT, CASH" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | VOIDED", default: "DRAFT", constraints: "one of DRAFT, SUBMITTED, ACCEPTED, REJECTED, VOIDED" }
      - { name: offered_total_cents, type: integer, source: computed, description: "Sum of accepted-line payouts under buylist_payout valuation; pinned on ACCEPT", default: 0 }

  - name: BuylistLine
    parent: null
    common_fields: true
    fields:
      - { name: buylist_submission_id, type: string, source: input, description: "FK -> BuylistSubmission.id" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the catalog item this card maps to" }
      - { name: quantity, type: integer, source: input, description: "Number of copies offered on this line", constraints: ">= 1" }
      - { name: line_payout_cents, type: integer, source: computed, description: "Per-line payout under the submission's payout_method; pinned on ACCEPT", default: 0 }

  - name: ReleaseProduct
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Upcoming product name, e.g. 'Set XYZ Booster Box'" }
      - { name: street_date, type: datetime, source: input, description: "Public release date (ISO 8601 UTC)" }
      - { name: allocation_pool, type: integer, source: input, description: "Total units the store can allocate to pre-orders", constraints: ">= 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit at fulfillment", constraints: ">= 0" }
      - { name: deposit_required_cents, type: integer, source: input, description: "Non-refundable deposit per pre-order in cents", constraints: ">= 0" }
      - { name: quantity_allocated, type: integer, source: computed, description: "Units committed to ALLOCATED or FULFILLED pre-orders", default: 0, constraints: ">= 0 and <= allocation_pool" }
      - { name: status, type: enum, source: system, description: "PRE_ORDER_OPEN | RELEASED", default: "PRE_ORDER_OPEN", constraints: "one of PRE_ORDER_OPEN, RELEASED" }

  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer" }
      - { name: release_product_id, type: string, source: input, description: "FK -> ReleaseProduct.id; the product reserved" }
      - { name: requested_quantity, type: integer, source: input, description: "Units requested", constraints: ">= 1" }
      - { name: deposit_paid_cents, type: integer, source: input, description: "Deposit the customer pays up front in store credit", constraints: ">= 0" }
      - { name: priority_score, type: integer, source: computed, description: "Allocation ranking score from preorder_priority; higher allocates first", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | ALLOCATED | FULFILLED | CANCELLED | WAITLISTED", default: "REQUESTED", constraints: "one of REQUESTED, ALLOCATED, FULFILLED, CANCELLED, WAITLISTED" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Event name, e.g. 'Friday Night Magic'" }
      - { name: format, type: enum, source: input, description: "STANDARD | MODERN | COMMANDER | DRAFT", constraints: "one of STANDARD, MODERN, COMMANDER, DRAFT" }
      - { name: starts_at, type: datetime, source: input, description: "Event start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Event end (ISO 8601 UTC); must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum seated registrations", constraints: ">= 0" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Base entry fee in cents", constraints: ">= 0" }
      - { name: tables_required, type: integer, source: input, description: "Number of play tables this event occupies for venue-overlap checks", constraints: ">= 0" }
      - { name: seated_count, type: integer, source: computed, description: "Count of registrations whose checkin_status != WITHDRAWN", default: 0, constraints: ">= 0 and <= capacity" }
      - { name: current_round, type: integer, source: computed, description: "Index of the active pairing round; 0 before first round", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | IN_PROGRESS | COMPLETE | CANCELLED", default: "SCHEDULED", constraints: "one of SCHEDULED, OPEN, IN_PROGRESS, COMPLETE, CANCELLED" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED — parallel dimension, evolves independently of checkin_status", default: "UNPAID", constraints: "one of UNPAID, PAID, REFUNDED" }
      - { name: checkin_status, type: enum, source: system, description: "PENDING | CHECKED_IN | WITHDRAWN — parallel dimension, evolves independently of payment_status", default: "PENDING", constraints: "one of PENDING, CHECKED_IN, WITHDRAWN" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Provisional entry fee under registration_fee PROVISIONAL variant, pinned at registration time", default: 0 }
      - { name: charged_fee_cents, type: integer, source: computed, description: "Final entry fee under registration_fee FINAL variant, pinned at check-in", default: 0 }
      - { name: match_points, type: integer, source: computed, description: "WPN match points accumulated across reported rounds (3 win / 1 draw / 0 loss)", default: 0 }

  - name: Pairing
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: round_number, type: integer, source: system, description: "Round this pairing belongs to" }
      - { name: registration_a_id, type: string, source: input, description: "FK -> Registration.id; first seated player" }
      - { name: registration_b_id, type: string, source: input, description: "FK -> Registration.id; second seated player (null for a BYE)", constraints: "nullable for BYE" }
      - { name: result, type: enum, source: system, description: "PENDING | A_WINS | B_WINS | DRAW | BYE_A", default: "PENDING", constraints: "one of PENDING, A_WINS, B_WINS, DRAW, BYE_A" }

  - name: GradingSubmission
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the cards" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the raw single being graded" }
      - { name: declared_value_cents, type: integer, source: input, description: "Customer-declared value used to size the grading fee", constraints: ">= 0" }
      - { name: service_tier, type: enum, source: input, description: "ECONOMY | STANDARD | EXPRESS — sets fee multiplier and SLA", constraints: "one of ECONOMY, STANDARD, EXPRESS" }
      - { name: grading_fee_cents, type: integer, source: computed, description: "Fee charged at intake under grading_fee; pinned on AT_GRADER", default: 0 }
      - { name: assigned_grade, type: number, source: input, description: "Numeric grade 1-10 recorded when the grader returns a GRADED result", default: null, constraints: "1 <= assigned_grade <= 10" }
      - { name: status, type: enum, source: system, description: "INTAKE | AT_GRADER | GRADED | REJECTED | RETURNED", default: "INTAKE", constraints: "one of INTAKE, AT_GRADER, GRADED, REJECTED, RETURNED" }

  - name: ConsignmentCase
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the consignor" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; item placed for sale on consignment" }
      - { name: quantity, type: integer, source: input, description: "Units consigned", constraints: ">= 1" }
      - { name: ask_price_cents, type: integer, source: input, description: "Per-unit ask price in cents", constraints: ">= 0" }
      - { name: commission_rate_bps, type: integer, source: input, description: "Store commission in basis points (e.g., 1500 = 15%)", constraints: "0 <= commission_rate_bps <= 10000" }
      - { name: payout_total_cents, type: integer, source: computed, description: "Consignor payout net of commission under consignment_payout; pinned on SOLD", default: 0 }
      - { name: status, type: enum, source: system, description: "LISTED | SOLD | WITHDRAWN | SETTLED", default: "LISTED", constraints: "one of LISTED, SOLD, WITHDRAWN, SETTLED" }

  - name: StoreCreditLedger
    parent: null
    common_fields: false   # append-only event log: carries only id + created_at
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the credit holder" }
      - { name: delta_cents, type: integer, source: input, description: "Signed change to store credit (positive = credit, negative = debit)" }
      - { name: reason, type: enum, source: input, description: "BUYLIST_PAYOUT | EVENT_REFUND | CONSIGNMENT_PAYOUT | PREORDER_DEPOSIT | EVENT_CHARGE | PREORDER_FULFILL | MANUAL_ADJUSTMENT", constraints: "one of BUYLIST_PAYOUT, EVENT_REFUND, CONSIGNMENT_PAYOUT, PREORDER_DEPOSIT, EVENT_CHARGE, PREORDER_FULFILL, MANUAL_ADJUSTMENT" }
      - { name: source_entity_id, type: string, source: input, description: "Id of the entity that produced this ledger row (registration/buylist/etc.), audit only", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Event: cyclic pairing rounds (Rule 3 non-linear: cycle) -----
  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /events/{id}/open"
        actor: StoreManager
        preconditions:
          - "Event.capacity >= 1 (ERR_INVALID_EVENT_CAPACITY)"
          - "No other non-terminal Event whose play-table window overlaps this event's [starts_at - BUFFER_MINUTES, ends_at + BUFFER_MINUTES) would push concurrent tables_required over STORE_TABLE_COUNT (ERR_VENUE_OVERLAP)"
        side_effects: []
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /events/{id}/start"
        actor: JudgeStaff
        preconditions:
          - "Event.seated_count >= 1 (ERR_NO_SEATED_PLAYERS)"
        side_effects:
          - "Event.current_round set to 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /events/{id}/advance-round"
        actor: JudgeStaff
        preconditions:
          - "All Pairing rows for Event.current_round have result != PENDING (ERR_ROUND_NOT_COMPLETE)"
          - "Event.current_round < MAX_ROUNDS (ERR_MAX_ROUNDS_REACHED)"
        side_effects:
          - "Event.current_round incremented by 1 (cyclic self-loop: a new round opens for pairing)"
        note: "Cyclic self-transition: rounds repeat until COMPLETE."
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /events/{id}/complete"
        actor: JudgeStaff
        preconditions:
          - "All Pairing rows for Event.current_round have result != PENDING (ERR_ROUND_NOT_COMPLETE)"
        side_effects:
          - "Event becomes eligible for WPN reporting"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Cascade: every non-WITHDRAWN Registration -> checkin_status WITHDRAWN; if its payment_status == PAID it becomes REFUNDED (see Registration PAID->REFUNDED)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Cascade depth-3: Event CANCELLED -> each PAID Registration -> REFUNDED, which itself appends a StoreCreditLedger EVENT_REFUND row and recomputes Customer.store_credit_balance_cents"

  # ----- Registration: parallel dimensions (Rule 3 non-linear: parallel) -----
  - entity: Registration
    initial_state: "payment_status=UNPAID, checkin_status=PENDING"
    terminal_states: ["checkin_status=WITHDRAWN"]
    transitions:
      # payment dimension
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /registrations/{id}/pay"
        actor: Customer
        preconditions:
          - "Registration.checkin_status != WITHDRAWN (ERR_INVALID_STATE)"
          - "Customer.store_credit_balance_cents >= Registration.quoted_fee_cents (ERR_INSUFFICIENT_STORE_CREDIT)"
        side_effects:
          - "Append StoreCreditLedger EVENT_CHARGE row delta_cents = -quoted_fee_cents"
          - "Recompute Customer.store_credit_balance_cents and lifetime_spend_cents"
      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED"
        trigger: "Event cancel cascade OR POST /registrations/{id}/withdraw"
        actor: system
        preconditions:
          - "Registration.payment_status == PAID (ERR_INVALID_STATE)"
        side_effects:
          - "Append StoreCreditLedger EVENT_REFUND row delta_cents = +charged_fee_cents if checked in else +quoted_fee_cents"
          - "Recompute Customer.store_credit_balance_cents (compensating invariant: net store-credit delta of pay+refund == 0)"
      # check-in dimension (independent of payment)
      - from: "checkin_status=PENDING"
        to: "checkin_status=CHECKED_IN"
        trigger: "POST /registrations/{id}/check-in"
        actor: StoreManager
        preconditions:
          - "Registration.payment_status == PAID (ERR_REGISTRATION_NOT_PAID)"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_BANNED)"
          - "Parent Event.status == OPEN or IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Pin Registration.charged_fee_cents via registration_fee FINAL variant"
          - "Increment Event.seated_count"
      - from: "checkin_status=PENDING"
        to: "checkin_status=WITHDRAWN"
        trigger: "POST /registrations/{id}/withdraw"
        actor: Customer
        preconditions:
          - "Parent Event.status != COMPLETE (ERR_INVALID_STATE)"
        side_effects:
          - "If payment_status == PAID -> drive PAID->REFUNDED (cascade)"

  # ----- Pairing: result reporting (guarded by Event state) -----
  - entity: Pairing
    initial_state: PENDING
    terminal_states: [A_WINS, B_WINS, DRAW, BYE_A]
    transitions:
      - from: PENDING
        to: A_WINS
        trigger: "POST /pairings/{id}/report"
        actor: JudgeStaff
        preconditions:
          - "Parent Event.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "registration_b_id is not null (ERR_INVALID_STATE)"
        side_effects:
          - "registration_a.match_points += 3"
      - from: PENDING
        to: B_WINS
        trigger: "POST /pairings/{id}/report"
        actor: JudgeStaff
        preconditions:
          - "Parent Event.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "registration_b_id is not null (ERR_INVALID_STATE)"
        side_effects:
          - "registration_b.match_points += 3"
      - from: PENDING
        to: DRAW
        trigger: "POST /pairings/{id}/report"
        actor: JudgeStaff
        preconditions:
          - "Parent Event.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "registration_b_id is not null (ERR_INVALID_STATE)"
        side_effects:
          - "registration_a.match_points += 1 and registration_b.match_points += 1"
      - from: PENDING
        to: BYE_A
        trigger: "POST /pairings/{id}/report"
        actor: JudgeStaff
        preconditions:
          - "Parent Event.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "registration_b_id is null (ERR_INVALID_STATE)"
        side_effects:
          - "registration_a.match_points += 3 (bye awards a win)"

  # ----- BuylistSubmission: accept/reject + compensating void -----
  - entity: BuylistSubmission
    initial_state: DRAFT
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /buylist-submissions/{id}/submit"
        actor: Customer
        preconditions:
          - "At least one BuylistLine exists for this submission (ERR_EMPTY_BUYLIST)"
          - "Every BuylistLine.quantity >= 1 (ERR_INVALID_QUANTITY)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /buylist-submissions/{id}/accept"
        actor: StoreManager
        preconditions:
          - "BuylistSubmission.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "For each BuylistLine: pin line_payout_cents via buylist_payout variant for payout_method"
          - "Pin BuylistSubmission.offered_total_cents = sum of accepted line_payout_cents"
          - "Cascade depth-2: each BuylistLine accepted -> InventoryItem.quantity_on_hand += line.quantity"
          - "Cascade: append StoreCreditLedger BUYLIST_PAYOUT row delta_cents = +offered_total_cents only when payout_method == STORE_CREDIT; recompute Customer.store_credit_balance_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /buylist-submissions/{id}/reject"
        actor: StoreManager
        preconditions:
          - "BuylistSubmission.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /buylist-submissions/{id}/void"
        actor: StoreManager
        preconditions:
          - "BuylistSubmission.status == ACCEPTED (ERR_INVALID_STATE)"
          - "For each BuylistLine: InventoryItem.quantity_on_hand - line.quantity >= InventoryItem.quantity_reserved (ERR_INVENTORY_RESERVED)"
        side_effects:
          - "Compensation: each BuylistLine -> InventoryItem.quantity_on_hand -= line.quantity (inventory-units invariant restored)"
          - "Compensation: if payout_method == STORE_CREDIT, append StoreCreditLedger BUYLIST_PAYOUT row delta_cents = -offered_total_cents; recompute Customer.store_credit_balance_cents (store-credit invariant restored)"

  # ----- PreOrder: allocation lifecycle (guarded by ReleaseProduct) -----
  - entity: PreOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /pre-orders/{id}/allocate"
        actor: StoreManager
        preconditions:
          - "Parent ReleaseProduct.status == PRE_ORDER_OPEN (ERR_INVALID_STATE)"
          - "ReleaseProduct.quantity_allocated + PreOrder.requested_quantity <= ReleaseProduct.allocation_pool (ERR_ALLOCATION_EXCEEDED)"
          - "PreOrder carries expected_release_product_version matching ReleaseProduct.version (ERR_STALE_VERSION)"
        side_effects:
          - "ReleaseProduct.quantity_allocated += requested_quantity"
          - "Increment ReleaseProduct.version by 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /pre-orders/{id}/waitlist"
        actor: StoreManager
        preconditions:
          - "Parent ReleaseProduct.status == PRE_ORDER_OPEN (ERR_INVALID_STATE)"
        side_effects: []
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /pre-orders/{id}/fulfill"
        actor: StoreManager
        preconditions:
          - "Parent ReleaseProduct.status == RELEASED (ERR_RELEASE_NOT_LIVE)"
          - "Customer.store_credit_balance_cents >= (ReleaseProduct.unit_price_cents * requested_quantity) - deposit_paid_cents (ERR_INSUFFICIENT_STORE_CREDIT)"
        side_effects:
          - "Append StoreCreditLedger PREORDER_FULFILL row delta_cents = -((unit_price_cents * requested_quantity) - deposit_paid_cents)"
          - "Recompute Customer.store_credit_balance_cents and lifetime_spend_cents"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "ReleaseProduct.quantity_allocated -= requested_quantity (frees the allocation)"
          - "Increment ReleaseProduct.version by 1"

  # ----- GradingSubmission: branching fork-join (Rule 3 non-linear: branch) -----
  - entity: GradingSubmission
    initial_state: INTAKE
    terminal_states: [RETURNED]
    transitions:
      - from: INTAKE
        to: AT_GRADER
        trigger: "POST /grading-submissions/{id}/send"
        actor: StoreManager
        preconditions:
          - "GradingSubmission.status == INTAKE (ERR_INVALID_STATE)"
          - "InventoryItem.quantity_on_hand - 1 >= InventoryItem.quantity_reserved (ERR_INVENTORY_RESERVED)"
        side_effects:
          - "Pin grading_fee_cents via grading_fee"
          - "InventoryItem.quantity_reserved += 1 (the raw single is held by the grader)"
      - from: AT_GRADER
        to: GRADED
        trigger: "POST /grading-submissions/{id}/return-result"
        actor: StoreManager
        preconditions:
          - "GradingSubmission.status == AT_GRADER (ERR_INVALID_STATE)"
          - "Body provides assigned_grade in [1,10] (ERR_INVALID_GRADE)"
        side_effects:
          - "Branch GRADED: store assigned_grade"
        note: "Fork branch GRADED — divergent side effects from REJECTED."
      - from: AT_GRADER
        to: REJECTED
        trigger: "POST /grading-submissions/{id}/return-result"
        actor: StoreManager
        preconditions:
          - "GradingSubmission.status == AT_GRADER (ERR_INVALID_STATE)"
          - "Body omits assigned_grade (grader could not encapsulate)"
        side_effects:
          - "Branch REJECTED: assigned_grade stays null"
        note: "Fork branch REJECTED — divergent side effects from GRADED."
      - from: GRADED
        to: RETURNED
        trigger: "POST /grading-submissions/{id}/release"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Join: InventoryItem.quantity_reserved -= 1 (graded card returned to customer)"
      - from: REJECTED
        to: RETURNED
        trigger: "POST /grading-submissions/{id}/release"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "Join: InventoryItem.quantity_reserved -= 1 (raw card returned to customer)"

  # ----- ConsignmentCase: sale + settlement -----
  - entity: ConsignmentCase
    initial_state: LISTED
    terminal_states: [WITHDRAWN, SETTLED]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /consignment-cases/{id}/sell"
        actor: StoreManager
        preconditions:
          - "ConsignmentCase.status == LISTED (ERR_INVALID_STATE)"
        side_effects:
          - "Pin payout_total_cents via consignment_payout (round per-line then sum)"
      - from: SOLD
        to: SETTLED
        trigger: "POST /consignment-cases/{id}/settle"
        actor: StoreManager
        preconditions:
          - "ConsignmentCase.status == SOLD (ERR_INVALID_STATE)"
        side_effects:
          - "Append StoreCreditLedger CONSIGNMENT_PAYOUT row delta_cents = +payout_total_cents; recompute Customer.store_credit_balance_cents and lifetime_spend_cents is unchanged"
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /consignment-cases/{id}/withdraw"
        actor: Customer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: preorder-allocate-stale-release
    parent_entity: ReleaseProduct
    write_endpoint: "POST /pre-orders/{id}/allocate"
    occ_field: "expected_release_product_version"
    description: |
      Allocating a PreOrder against a ReleaseProduct whose version has advanced
      since the client last observed it is rejected. A prior allocation has
      already debited the allocation pool (legitimately superseding the prior
      pool view under the allocation rule), so the current writer's snapshot of
      remaining capacity is stale and must be refreshed before re-allocating.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ----- Rule 1 dual-variant (a): buylist valuation on BuylistSubmission -----
  - name: buylist_payout
    trigger: "BuylistSubmission SUBMITTED -> ACCEPTED"
    algorithm: tiered_pricing
    formula: |
      For each accepted BuylistLine:
        base = InventoryItem.market_price_cents * line.quantity
        rate = STORE_CREDIT_RATE if submission.payout_method == STORE_CREDIT else CASH_RATE
        line_payout_cents = round_half_up(base * rate)        # per-line rounding, pinned order
      offered_total_cents = sum(line_payout_cents over accepted lines)   # sum AFTER per-line round
    input_set: "BuylistLines whose parent submission is transitioning to ACCEPTED"
    constants:
      STORE_CREDIT_RATE: 0.70
      CASH_RATE: 0.50
    precision: "round_half_up to whole cents per line, then sum"
    variants:
      - name: STORE_CREDIT
        when: "payout_method == STORE_CREDIT"
        difference: "rate = 0.70; payout is appended to StoreCreditLedger"
      - name: CASH
        when: "payout_method == CASH"
        difference: "rate = 0.50; no ledger row is appended (cash handled out of band)"

  # ----- Rule 1 dual-variant (b): registration entry fee on Registration -----
  - name: registration_fee
    trigger: "Registration created (PROVISIONAL); Registration check-in (FINAL)"
    algorithm: threshold
    formula: |
      base = Event.entry_fee_cents
      tier_discount = LOYALTY_DISCOUNT_BPS[Customer.loyalty_tier] / 10000
      PROVISIONAL (at registration, before street/early window known):
        quoted_fee_cents = round_half_up(base * (1 - tier_discount))
      FINAL (at check-in, clock-aware early-bird):
        early = (clock_now <= Event.starts_at - EARLY_BIRD_LEAD_SECONDS)
        eff = tier_discount + (EARLY_BIRD_BPS/10000 if early else 0)
        eff = min(eff, MAX_DISCOUNT_BPS/10000)
        charged_fee_cents = round_half_up(base * (1 - eff))
    input_set: "single Event + acting Customer"
    constants:
      LOYALTY_DISCOUNT_BPS: { BRONZE: 0, SILVER: 500, GOLD: 1000 }
      EARLY_BIRD_BPS: 1000
      EARLY_BIRD_LEAD_SECONDS: 86400
      MAX_DISCOUNT_BPS: 2000
    precision: "round_half_up to whole cents"
    variants:
      - name: PROVISIONAL
        when: "computed at registration time"
        difference: "no early-bird component; loyalty discount only"
      - name: FINAL
        when: "computed at check-in time"
        difference: "adds clock-dependent early-bird discount, capped at MAX_DISCOUNT_BPS"

  # ----- Rule 2 combinatorial (a): >=3 inputs, non-linear -----
  - name: preorder_priority
    trigger: "PreOrder created; recomputed before allocation sweep"
    algorithm: weighted_scoring
    formula: |
      tier_pts   = TIER_POINTS[Customer.loyalty_tier]                 # 0 / 20 / 40
      deposit_pts = min(DEPOSIT_CAP_PTS, deposit_paid_cents // DEPOSIT_STEP_CENTS)
      recency_pts = max(0, RECENCY_BASE - (created_at_rank - 1) * RECENCY_DECAY)
      priority_score = tier_pts + deposit_pts + recency_pts
      # created_at_rank = 1 for the earliest REQUESTED pre-order on this release (created_at ASC),
      # 2 for the next, etc. — never uses id.
    input_set: "REQUESTED pre-orders on one ReleaseProduct"
    constants:
      TIER_POINTS: { BRONZE: 0, SILVER: 20, GOLD: 40 }
      DEPOSIT_STEP_CENTS: 500
      DEPOSIT_CAP_PTS: 30
      RECENCY_BASE: 25
      RECENCY_DECAY: 5
    precision: "integer points"

  # ----- Rule 2 combinatorial (b): nested rounding order -----
  - name: consignment_payout
    trigger: "ConsignmentCase LISTED -> SOLD"
    algorithm: aggregation
    formula: |
      gross_per_unit = ask_price_cents
      commission_per_unit = round_half_up(gross_per_unit * commission_rate_bps / 10000)  # round PER UNIT first
      net_per_unit = gross_per_unit - commission_per_unit
      payout_total_cents = net_per_unit * quantity                                       # then multiply
      # Pinned order: round commission per unit, THEN multiply by quantity. The alternative
      # (commission on gross*quantity, then round) yields a different cent total.
    input_set: "single ConsignmentCase"
    constants: {}
    precision: "round_half_up commission per unit, then multiply by quantity"

  # ----- grading fee (combinatorial-flavored but classified as threshold) -----
  - name: grading_fee
    trigger: "GradingSubmission INTAKE -> AT_GRADER"
    algorithm: threshold
    formula: |
      base = BASE_FEE_CENTS
      value_surcharge = round_half_up(declared_value_cents * VALUE_SURCHARGE_BPS / 10000)
      tier_mult = TIER_MULT[service_tier]                     # 1.0 / 1.5 / 2.5
      grading_fee_cents = round_half_up((base + value_surcharge) * tier_mult)
    input_set: "single GradingSubmission"
    constants:
      BASE_FEE_CENTS: 1500
      VALUE_SURCHARGE_BPS: 100
      TIER_MULT: { ECONOMY: 1.0, STANDARD: 1.5, EXPRESS: 2.5 }
    precision: "round_half_up to whole cents"

  # ----- store credit reconciliation (derived field) -----
  - name: store_credit_balance
    trigger: "any StoreCreditLedger row appended for the customer"
    algorithm: aggregation
    formula: |
      store_credit_balance_cents = sum(delta_cents for all StoreCreditLedger rows
                                       where customer_id == this customer)
      # Ledger is append-only; balance is a pure fold over its rows in created_at ASC order.
    input_set: "all StoreCreditLedger rows for one Customer"
    constants: {}
    precision: "integer cents"

  # ----- lifetime spend (aggregation over purchase ledger rows) -----
  - name: lifetime_spend
    trigger: "StoreCreditLedger EVENT_CHARGE or PREORDER_FULFILL row appended for the customer"
    algorithm: aggregation
    formula: |
      lifetime_spend_cents = sum(-delta_cents for StoreCreditLedger rows
                                 where customer_id == this customer
                                 and reason in {EVENT_CHARGE, PREORDER_FULFILL})
      # Only purchase debits count toward spend; deposits, refunds, payouts, and
      # manual adjustments do NOT move lifetime_spend_cents.
    input_set: "EVENT_CHARGE + PREORDER_FULFILL ledger rows for one Customer"
    constants: {}
    precision: "integer cents"

  # ----- loyalty tier (threshold) -----
  - name: loyalty_tier
    trigger: "Customer.lifetime_spend_cents changes"
    algorithm: threshold
    formula: |
      if lifetime_spend_cents >= GOLD_THRESHOLD_CENTS:   loyalty_tier = GOLD
      elif lifetime_spend_cents >= SILVER_THRESHOLD_CENTS: loyalty_tier = SILVER
      else: loyalty_tier = BRONZE
    input_set: "single Customer"
    constants:
      SILVER_THRESHOLD_CENTS: 50000
      GOLD_THRESHOLD_CENTS: 200000
    precision: "exact integer compare (>= boundary inclusive)"

  # ----- event seated_count (aggregation) -----
  - name: event_seated_count
    trigger: "any Registration checkin_status change on the event"
    algorithm: aggregation
    formula: |
      seated_count = count(Registration where event_id == event.id
                           and checkin_status != WITHDRAWN)
    input_set: "all Registrations under one Event"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed Customer must own the targeted resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: state
    check: "Check-in requires acting/target Customer.status == ACTIVE"
    error_id: ERR_CUSTOMER_BANNED
    http_status: 409
    applies_to: "POST /registrations/{id}/check-in"

  - priority: 6
    category: business_constraint
    check: "Required input fields present and well-typed (enums valid, quantities integer)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "Quantity fields >= their minimum (BuylistLine.quantity >= 1, requested_quantity >= 1)"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /buylist-lines, POST /pre-orders, POST /consignment-cases"

  - priority: 8
    category: business_constraint
    check: "assigned_grade, when provided on return-result, lies in [1,10]"
    error_id: ERR_INVALID_GRADE
    http_status: 422
    applies_to: "POST /grading-submissions/{id}/return-result"

  - priority: 9
    category: business_temporal
    check: "A Customer may not hold two non-WITHDRAWN registrations for Events whose [starts_at, ends_at) intervals overlap (half-open; adjacency at the shared endpoint is allowed)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 10
    category: business_temporal
    check: "Opening an Event must not cause concurrent play-table usage to exceed STORE_TABLE_COUNT over the event's [starts_at - BUFFER_MINUTES, ends_at + BUFFER_MINUTES) window (buffer-padded, adjacency within buffer NOT allowed)"
    error_id: ERR_VENUE_OVERLAP
    http_status: 409
    applies_to: "POST /events/{id}/open"

  - priority: 11
    category: business_referential
    check: "BuylistSubmission must have >= 1 BuylistLine before SUBMIT"
    error_id: ERR_EMPTY_BUYLIST
    http_status: 422
    applies_to: "POST /buylist-submissions/{id}/submit"

  - priority: 12
    category: business_referential
    check: "Voiding an accepted buylist must not drive any InventoryItem.quantity_on_hand below its quantity_reserved"
    error_id: ERR_INVENTORY_RESERVED
    http_status: 409
    applies_to: "POST /buylist-submissions/{id}/void, POST /grading-submissions/{id}/send"

  - priority: 13
    category: business_constraint
    check: "Allocating must not push ReleaseProduct.quantity_allocated past allocation_pool"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /pre-orders/{id}/allocate"

  - priority: 14
    category: business_constraint
    check: "Registering must not push seated/registered count past Event.capacity"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /registrations"

  - priority: 15
    category: state
    check: "OCC: expected_release_product_version must equal current ReleaseProduct.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pre-orders/{id}/allocate"

  - priority: 16
    category: business_fiscal
    check: "Acting/target Customer.store_credit_balance_cents must cover the charge (registration pay, pre-order fulfill)"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /registrations/{id}/pay, POST /pre-orders/{id}/fulfill"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Test-driving: logical clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock now reads to_iso8601 for all subsequent time-gated rules"]

  # ----- Customer -----
  - method: POST
    path: "/customers"
    description: "Register a new customer"
    roles: [StoreManager]
    code: 201
    input: [display_name, email]
    output: Customer
    side_effects: ["store_credit_balance_cents=0, lifetime_spend_cents=0, loyalty_tier=BRONZE, status=ACTIVE"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "List customers (paginated, optional email filter)"
    roles: [StoreManager, JudgeStaff]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: POST
    path: "/customers/{id}/ban"
    description: "Ban a customer (operational)"
    roles: [StoreManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status=BANNED"]
  - method: POST
    path: "/customers/{id}/credit-adjustments"
    description: "Operator adjusts a customer's store credit (appends a MANUAL_ADJUSTMENT ledger row); used to grant seed credit"
    roles: [StoreManager]
    code: 201
    input: [delta_cents]
    output: StoreCreditLedger
    side_effects: ["Append StoreCreditLedger MANUAL_ADJUSTMENT row; recompute store_credit_balance_cents"]
  - method: GET
    path: "/customers/{id}/ledger"
    description: "List a customer's store-credit ledger rows (reverse-reachability for StoreCreditLedger.customer_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: StoreCreditLedger[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/registrations"
    description: "List a customer's registrations (reverse-reachability for Registration.customer_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Registration[]
    side_effects: []

  # ----- InventoryItem -----
  - method: POST
    path: "/inventory-items"
    description: "Create an inventory catalog item"
    roles: [StoreManager]
    code: 201
    input: ["title", "product_kind", "condition?", "market_price_cents"]
    output: InventoryItem
    side_effects: ["quantity_on_hand=0, quantity_reserved=0"]
  - method: GET
    path: "/inventory-items/{id}"
    description: "Get an inventory item"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []
  - method: GET
    path: "/inventory-items"
    description: "List inventory items (paginated)"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: ["product_kind?", "limit?", "offset?"]
    output: InventoryItem[]
    side_effects: []

  # ----- BuylistSubmission + BuylistLine -----
  - method: POST
    path: "/buylist-submissions"
    description: "Create a draft buylist submission"
    roles: [Customer]
    code: 201
    input: [customer_id, payout_method]
    output: BuylistSubmission
    side_effects: ["status=DRAFT, offered_total_cents=0"]
  - method: GET
    path: "/buylist-submissions/{id}"
    description: "Get a buylist submission"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: BuylistSubmission
    side_effects: []
  - method: GET
    path: "/buylist-submissions"
    description: "List buylist submissions (filter by customer_id, reverse-reachability for BuylistSubmission.customer_id)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: BuylistSubmission[]
    side_effects: []
  - method: POST
    path: "/buylist-lines"
    description: "Add a line to a draft buylist submission"
    roles: [Customer]
    code: 201
    input: [buylist_submission_id, inventory_item_id, quantity]
    output: BuylistLine
    side_effects: ["line_payout_cents=0 until ACCEPT"]
  - method: GET
    path: "/buylist-lines/{id}"
    description: "Get a buylist line"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: BuylistLine
    side_effects: []
  - method: GET
    path: "/buylist-lines"
    description: "List buylist lines (filter by buylist_submission_id and/or inventory_item_id; reverse-reachability for both FKs)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["buylist_submission_id?", "inventory_item_id?", "limit?", "offset?"]
    output: BuylistLine[]
    side_effects: []
  - method: POST
    path: "/buylist-submissions/{id}/submit"
    description: "Submit a draft buylist for review"
    roles: [Customer]
    code: 200
    input: []
    output: BuylistSubmission
    side_effects: ["DRAFT->SUBMITTED"]
  - method: POST
    path: "/buylist-submissions/{id}/accept"
    description: "Accept a submitted buylist; values lines, adds inventory, pays store credit"
    roles: [StoreManager]
    code: 200
    input: []
    output: BuylistSubmission
    side_effects: ["SUBMITTED->ACCEPTED; pin line + total payouts; quantity_on_hand += line.quantity; ledger payout if STORE_CREDIT"]
  - method: POST
    path: "/buylist-submissions/{id}/reject"
    description: "Reject a submitted buylist"
    roles: [StoreManager]
    code: 200
    input: []
    output: BuylistSubmission
    side_effects: ["SUBMITTED->REJECTED"]
  - method: POST
    path: "/buylist-submissions/{id}/void"
    description: "Void an accepted buylist; reverses inventory and store-credit side effects"
    roles: [StoreManager]
    code: 200
    input: []
    output: BuylistSubmission
    side_effects: ["ACCEPTED->VOIDED; quantity_on_hand -= line.quantity; reverse ledger payout"]

  # ----- ReleaseProduct + PreOrder -----
  - method: POST
    path: "/release-products"
    description: "Create an upcoming release product with an allocation pool"
    roles: [StoreManager]
    code: 201
    input: [title, street_date, allocation_pool, unit_price_cents, deposit_required_cents]
    output: ReleaseProduct
    side_effects: ["quantity_allocated=0, status=PRE_ORDER_OPEN"]
  - method: GET
    path: "/release-products/{id}"
    description: "Get a release product"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: ReleaseProduct
    side_effects: []
  - method: GET
    path: "/release-products"
    description: "List release products (paginated)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReleaseProduct[]
    side_effects: []
  - method: POST
    path: "/release-products/{id}/release"
    description: "Mark a release product live (street date reached)"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReleaseProduct
    side_effects: ["PRE_ORDER_OPEN->RELEASED"]
  - method: POST
    path: "/pre-orders"
    description: "Create a pre-order request against a release product"
    roles: [Customer]
    code: 201
    input: [customer_id, release_product_id, requested_quantity, deposit_paid_cents]
    output: PreOrder
    side_effects: ["status=REQUESTED; compute priority_score; append PREORDER_DEPOSIT ledger row delta=-deposit_paid_cents; recompute store_credit_balance_cents"]
  - method: GET
    path: "/pre-orders/{id}"
    description: "Get a pre-order"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: PreOrder
    side_effects: []
  - method: GET
    path: "/pre-orders"
    description: "List pre-orders (filter by customer_id and/or release_product_id; reverse-reachability for both FKs)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["customer_id?", "release_product_id?", "status?", "limit?", "offset?"]
    output: PreOrder[]
    side_effects: []
  - method: POST
    path: "/pre-orders/{id}/allocate"
    description: "Allocate units to a pre-order; OCC-guarded on ReleaseProduct.version"
    roles: [StoreManager]
    code: 200
    input: [expected_release_product_version]
    output: PreOrder
    side_effects: ["REQUESTED->ALLOCATED; quantity_allocated += requested_quantity; increment ReleaseProduct.version by 1"]
  - method: POST
    path: "/pre-orders/{id}/waitlist"
    description: "Move a pre-order to the waitlist"
    roles: [StoreManager]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["REQUESTED->WAITLISTED"]
  - method: POST
    path: "/pre-orders/{id}/fulfill"
    description: "Fulfill an allocated pre-order after release"
    roles: [StoreManager]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["ALLOCATED->FULFILLED; charge remaining balance to store credit; recompute lifetime_spend_cents"]
  - method: POST
    path: "/pre-orders/{id}/cancel"
    description: "Cancel a pre-order; frees allocation if it was ALLOCATED"
    roles: [Customer]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["->CANCELLED; if was ALLOCATED, quantity_allocated -= requested_quantity and increment ReleaseProduct.version by 1"]

  # ----- Event + Registration + Pairing -----
  - method: POST
    path: "/events"
    description: "Create a tournament/event"
    roles: [StoreManager]
    code: 201
    input: [title, format, starts_at, ends_at, capacity, entry_fee_cents, tables_required]
    output: Event
    side_effects: ["status=SCHEDULED, seated_count=0, current_round=0"]
  - method: GET
    path: "/events/{id}"
    description: "Get an event"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/events"
    description: "List events (paginated)"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: ["status?", "format?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: GET
    path: "/events/{id}/registrations"
    description: "List registrations for an event (reverse-reachability for Registration.event_id)"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: GET
    path: "/events/{id}/pairings"
    description: "List pairings for an event (reverse-reachability for Pairing.event_id)"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: ["round_number?", "limit?", "offset?"]
    output: Pairing[]
    side_effects: []
  - method: GET
    path: "/events/{id}/wpn-report"
    description: "Computed WPN organized-play report: standings by match_points (created_at ASC tie-break)"
    roles: [StoreManager, JudgeStaff]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: POST
    path: "/events/{id}/open"
    description: "Open an event for registration; venue-overlap checked"
    roles: [StoreManager]
    code: 200
    input: []
    output: Event
    side_effects: ["SCHEDULED->OPEN"]
  - method: POST
    path: "/events/{id}/start"
    description: "Start the event (round 1)"
    roles: [JudgeStaff]
    code: 200
    input: []
    output: Event
    side_effects: ["OPEN->IN_PROGRESS; current_round=1"]
  - method: POST
    path: "/events/{id}/advance-round"
    description: "Advance to the next pairing round (cyclic)"
    roles: [JudgeStaff]
    code: 200
    input: []
    output: Event
    side_effects: ["IN_PROGRESS self-loop; current_round += 1"]
  - method: POST
    path: "/events/{id}/complete"
    description: "Complete the event"
    roles: [JudgeStaff]
    code: 200
    input: []
    output: Event
    side_effects: ["IN_PROGRESS->COMPLETE"]
  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel an event; cascades withdrawals and refunds"
    roles: [StoreManager]
    code: 200
    input: []
    output: Event
    side_effects: ["->CANCELLED; cascade Registrations WITHDRAWN; PAID->REFUNDED; ledger EVENT_REFUND rows"]
  - method: POST
    path: "/registrations"
    description: "Register a customer for an event"
    roles: [Customer]
    code: 201
    input: [event_id, customer_id]
    output: Registration
    side_effects: ["payment_status=UNPAID, checkin_status=PENDING; pin quoted_fee_cents (PROVISIONAL)"]
  - method: GET
    path: "/registrations/{id}"
    description: "Get a registration"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/registrations/{id}/pay"
    description: "Pay the registration fee with store credit"
    roles: [Customer]
    code: 200
    input: []
    output: Registration
    side_effects: ["UNPAID->PAID; ledger EVENT_CHARGE row; recompute balances"]
  - method: POST
    path: "/registrations/{id}/check-in"
    description: "Check a paid registration in at the event"
    roles: [StoreManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["checkin PENDING->CHECKED_IN; pin charged_fee_cents (FINAL); seated_count += 1"]
  - method: POST
    path: "/registrations/{id}/withdraw"
    description: "Withdraw a registration; refunds if paid"
    roles: [Customer]
    code: 200
    input: []
    output: Registration
    side_effects: ["checkin->WITHDRAWN; if PAID->REFUNDED with ledger EVENT_REFUND"]
  - method: POST
    path: "/pairings"
    description: "Create a pairing for the current round of an in-progress event"
    roles: [JudgeStaff]
    code: 201
    input: ["event_id", "registration_a_id", "registration_b_id?"]
    output: Pairing
    side_effects: ["result=PENDING; round_number=Event.current_round"]
  - method: GET
    path: "/pairings/{id}"
    description: "Get a pairing"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: []
    output: Pairing
    side_effects: []
  - method: GET
    path: "/pairings"
    description: "List pairings (filter by event_id, registration_a_id, and/or registration_b_id; reverse-reachability for the two Registration FKs)"
    roles: [Customer, StoreManager, JudgeStaff]
    code: 200
    input: ["event_id?", "registration_a_id?", "registration_b_id?", "round_number?", "limit?", "offset?"]
    output: Pairing[]
    side_effects: []
  - method: POST
    path: "/pairings/{id}/report"
    description: "Report a pairing result; updates match points"
    roles: [JudgeStaff]
    code: 200
    input: [result]
    output: Pairing
    side_effects: ["PENDING->{A_WINS,B_WINS,DRAW,BYE_A}; update match_points"]

  # ----- GradingSubmission -----
  - method: POST
    path: "/grading-submissions"
    description: "Intake a card for grading"
    roles: [StoreManager]
    code: 201
    input: [customer_id, inventory_item_id, declared_value_cents, service_tier]
    output: GradingSubmission
    side_effects: ["status=INTAKE, grading_fee_cents=0"]
  - method: GET
    path: "/grading-submissions/{id}"
    description: "Get a grading submission"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: GradingSubmission
    side_effects: []
  - method: GET
    path: "/grading-submissions"
    description: "List grading submissions (filter by customer_id and/or inventory_item_id; reverse-reachability for both FKs)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["customer_id?", "inventory_item_id?", "status?", "limit?", "offset?"]
    output: GradingSubmission[]
    side_effects: []
  - method: POST
    path: "/grading-submissions/{id}/send"
    description: "Send the card to the grader; pins the fee and reserves the unit"
    roles: [StoreManager]
    code: 200
    input: []
    output: GradingSubmission
    side_effects: ["INTAKE->AT_GRADER; pin grading_fee_cents; quantity_reserved += 1"]
  - method: POST
    path: "/grading-submissions/{id}/return-result"
    description: "Record the grader's result (GRADED with assigned_grade, or REJECTED without)"
    roles: [StoreManager]
    code: 200
    input: ["assigned_grade?"]
    output: GradingSubmission
    side_effects: ["AT_GRADER->GRADED (with grade) or REJECTED (without)"]
  - method: POST
    path: "/grading-submissions/{id}/release"
    description: "Return the card to the customer; frees the reservation"
    roles: [StoreManager]
    code: 200
    input: []
    output: GradingSubmission
    side_effects: ["GRADED|REJECTED->RETURNED; quantity_reserved -= 1"]

  # ----- ConsignmentCase -----
  - method: POST
    path: "/consignment-cases"
    description: "List an item on consignment"
    roles: [Customer]
    code: 201
    input: [customer_id, inventory_item_id, quantity, ask_price_cents, commission_rate_bps]
    output: ConsignmentCase
    side_effects: ["status=LISTED, payout_total_cents=0"]
  - method: GET
    path: "/consignment-cases/{id}"
    description: "Get a consignment case"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: ConsignmentCase
    side_effects: []
  - method: GET
    path: "/consignment-cases"
    description: "List consignment cases (filter by customer_id and/or inventory_item_id; reverse-reachability for both FKs)"
    roles: [Customer, StoreManager]
    code: 200
    input: ["customer_id?", "inventory_item_id?", "status?", "limit?", "offset?"]
    output: ConsignmentCase[]
    side_effects: []
  - method: POST
    path: "/consignment-cases/{id}/sell"
    description: "Mark a consigned case sold; pins payout"
    roles: [StoreManager]
    code: 200
    input: []
    output: ConsignmentCase
    side_effects: ["LISTED->SOLD; pin payout_total_cents"]
  - method: POST
    path: "/consignment-cases/{id}/settle"
    description: "Settle a sold case; credits the consignor"
    roles: [StoreManager]
    code: 200
    input: []
    output: ConsignmentCase
    side_effects: ["SOLD->SETTLED; ledger CONSIGNMENT_PAYOUT row; recompute store_credit_balance_cents"]
  - method: POST
    path: "/consignment-cases/{id}/withdraw"
    description: "Withdraw a listed consignment case"
    roles: [Customer]
    code: 200
    input: []
    output: ConsignmentCase
    side_effects: ["LISTED->WITHDRAWN"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Customer acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed body, or invalid enum value" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Quantity below minimum (line/preorder/consignment quantity < 1)" }
  - { id: ERR_INVALID_GRADE, http: 422, condition: "assigned_grade provided but outside [1,10]" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_CUSTOMER_BANNED, http: 409, condition: "Customer.status == BANNED blocks register/check-in" }
  - { id: ERR_INVALID_EVENT_CAPACITY, http: 422, condition: "Opening an event whose capacity < 1" }
  - { id: ERR_NO_SEATED_PLAYERS, http: 409, condition: "Starting an event with seated_count == 0" }
  - { id: ERR_ROUND_NOT_COMPLETE, http: 409, condition: "Advancing/completing while a current-round Pairing is still PENDING" }
  - { id: ERR_MAX_ROUNDS_REACHED, http: 409, condition: "advance-round called when current_round == MAX_ROUNDS" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Registering past Event.capacity" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Customer double-booked across overlapping event windows" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "Opening an event would exceed STORE_TABLE_COUNT over its buffer-padded window" }
  - { id: ERR_EMPTY_BUYLIST, http: 422, condition: "Submitting a buylist with zero lines" }
  - { id: ERR_INVENTORY_RESERVED, http: 409, condition: "Operation would drive quantity_on_hand below quantity_reserved" }
  - { id: ERR_ALLOCATION_EXCEEDED, http: 409, condition: "Allocating past ReleaseProduct.allocation_pool" }
  - { id: ERR_RELEASE_NOT_LIVE, http: 409, condition: "Fulfilling a pre-order whose ReleaseProduct is not RELEASED" }
  - { id: ERR_REGISTRATION_NOT_PAID, http: 409, condition: "Checking in a registration whose payment_status != PAID" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "Store credit balance cannot cover the charge" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_release_product_version != current ReleaseProduct.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A store patron acting on their own registrations, buylists, pre-orders, and consignments"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /buylist-submissions (own customer_id)"
      - "POST /buylist-lines (own submission)"
      - "POST /buylist-submissions/{id}/submit (own)"
      - "POST /registrations (own customer_id)"
      - "POST /registrations/{id}/pay (own)"
      - "POST /registrations/{id}/withdraw (own)"
      - "POST /pre-orders (own customer_id)"
      - "POST /pre-orders/{id}/cancel (own)"
      - "POST /consignment-cases (own customer_id)"
      - "POST /consignment-cases/{id}/withdraw (own)"
    shared_operations:
      - "GET on own customer, registrations, ledger, buylist, pre-orders, consignment; GET catalog (inventory, events, release-products)"

  - name: StoreManager
    description: "Store operations: catalog, buylist acceptance, allocation, grading, consignment settlement, event lifecycle, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers, POST /customers/{id}/ban, POST /customers/{id}/credit-adjustments"
      - "POST /inventory-items, POST /release-products, POST /release-products/{id}/release"
      - "POST /buylist-submissions/{id}/accept|reject|void"
      - "POST /pre-orders/{id}/allocate|waitlist|fulfill"
      - "POST /events, POST /events/{id}/open|cancel"
      - "POST /registrations/{id}/check-in"
      - "POST /grading-submissions and all grading lifecycle transitions"
      - "POST /consignment-cases/{id}/sell|settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources; GET /events/{id}/wpn-report"

  - name: JudgeStaff
    description: "Tournament floor staff: run pairings and rounds, report results, run WPN reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /events/{id}/start|advance-round|complete"
      - "POST /pairings, POST /pairings/{id}/report"
    shared_operations:
      - "GET on events, registrations, pairings, customers, inventory; GET /events/{id}/wpn-report"

# =============================================================================
# Domain constants referenced by §1.2 / §1.4 (venue + rounds)
# =============================================================================
domain_constants:
  STORE_TABLE_COUNT: 8        # total play tables in the store (venue-overlap capacity)
  BUFFER_MINUTES: 30          # cleanup buffer padded around each event window
  MAX_ROUNDS: 5               # cap on pairing rounds per event
