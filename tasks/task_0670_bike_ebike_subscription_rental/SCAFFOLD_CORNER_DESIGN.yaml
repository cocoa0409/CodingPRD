  - section: consistency_model
    instances:
      - name: reserve_response_immediately_reflects_pool_decrement
        claim_type: immediate
        grounds: ["entities.BikeModel.fields.available_count", "endpoints"]
        distinguishing_aspect: "immediate consistency: right after a reserve, GET /bike-models/{id} shows available_count decremented by 1 within the same request flow (no lag)."
        test_recipe:
          setup: ["Model with 2 bikes; available_count 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-2" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
          trigger:
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
