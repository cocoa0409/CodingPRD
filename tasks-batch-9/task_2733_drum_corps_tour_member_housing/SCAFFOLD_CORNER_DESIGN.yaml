        distinguishing_aspect: "A SiteBooking is a three-way link (stop, school, agreement) and all three must resolve before any business rule runs: an unknown facility_agreement_id must be ERR_FACILITY_AGREEMENT_NOT_FOUND even though the block times are also outside every agreement window, and the successful link must then be reachable from both the agreement filter and the school filter."
