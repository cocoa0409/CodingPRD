      - name: goodwill_credit_cap_clamps_at_annual_headroom
        claim_type: Precision
        grounds:
          - calculations.goodwill_credit_cap
          - calculations.goodwill_credit_cap.constants[ANNUAL_CAP_CENTS]
          - calculations.goodwill_credit_cap.constants[CS_GOODWILL_BASE_CENTS]
          - errors.ERR_GOODWILL_CAP_EXCEEDED
        distinguishing_aspect: "The goodwill figure is clamped to the customer's remaining annual headroom, so a 7000-cent clamp lands the balance exactly on the 50000-cent cap, and a further decision with zero headroom is refused with 409 ERR_GOODWILL_CAP_EXCEEDED instead of issuing a zero-cent ledger row."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. One customer C1 credited with 43000 cents of manual goodwill, so 7000 cents of headroom remain."
            - "A delivered order line of 4000 cents with an approved escalated return whose raw goodwill would be round_half_up(4000 * 0.50) + 500 == 2500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 43000, idempotency_key: "cap-seed-1", reason_code: "GOODWILL" }
              as: CustomerService
          trigger:
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 7001, idempotency_key: "cap-over-1", reason_code: "GOODWILL" }
              as: CustomerService
              captures: { over_error_id: $.data.error_id }
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 7000, idempotency_key: "cap-exact-1", reason_code: "GOODWILL" }
              as: CustomerService
              captures: { ledger_at_cap_id: $.data.id }
          assert:
            - "Customer.${customer_id}.lifetime_credit_issued_cents == 43000 and store_credit_balance_cents == 43000 after the seed credit"
            - "the remaining headroom is ANNUAL_CAP_CENTS - 43000 == 7000"
            - "the 7001-cent request is refused with 409 ERR_GOODWILL_CAP_EXCEEDED because it would take lifetime_credit_issued_cents to 50001"
            - "the 7000-cent request is admitted with 201 because it lands lifetime_credit_issued_cents on exactly 50000 — the cap is inclusive at the boundary"
            - "Customer.${customer_id}.lifetime_credit_issued_cents == 50000 and store_credit_balance_cents == 50000 after the admitted credit"
            - "a further 1-cent request is now refused with 409 ERR_GOODWILL_CAP_EXCEEDED rather than writing a zero-cent CreditLedger row, which the entity's non-zero constraint forbids"
            - "the refused request wrote nothing: GET /customers/${customer_id}/credit-ledger returns exactly 2 rows, the 43000 seed and the 7000 clamp"

      - name: cancellation_window_anchor_takes_the_earlier_of_grace_and_event_end
        claim_type: Correct Result
        grounds:
          - calculations.cancellation_window
          - calculations.cancellation_window.constants[GRACE_HOURS]
          - calculations.cancellation_window.variants[anchored_on_event_end]
          - entities.CustomerOrder.fields.cancellation_window_ends_at
        distinguishing_aspect: "The window's end is the minimum of the 30-hour grace anchor and the event's own ends_at, so a line placed two hours before its event closes loses 28 hours of grace and the order's window collapses onto the event end."
        test_recipe:
          setup:
            - "Clock 2026-09-01T21:00:00Z. Vendor V1, Shop S1 OPEN, Event E1 running from 2026-09-01T00:00:00Z to 2026-09-01T23:00:00Z with a 14-day quote, Listing L1 allocation 5 at 400 cents."
