        distinguishing_aspect: |
          Depth-2+ cascade from hold placement (a different trigger than a
          review CONFIRM): hold ACTIVE -> covered clips' retention_class flips
          to LITIGATION_HOLD -> purge attempts on those clips are now rejected
          with ERR_LITIGATION_HOLD_ACTIVE while retention_used_mb is unchanged.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one HARSH_BRAKE event with a 5MB FORWARD clip UPLOADED (retention STANDARD, fleet retention_used_mb 5)."
