              payload: { segment_code: "SEG-FL", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
