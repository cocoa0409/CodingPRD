  # ============================================================
  # Section: cross_cutting_layers — OCC, derived fields, scheduled actions
  # ============================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_member_withdraw_stale_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[member-close-stale-version]"
          - "errors[ERR_STALE_MEMBER_VERSION]"
        distinguishing_aspect: "POST /members/{id}/withdraw with expected_member_version < current version → 412 ERR_STALE_MEMBER_VERSION"
        test_recipe:
          setup: ["Member M-COR-20 ACTIVE with version=1; second read bumps to version=2 via a reactivation cycle"]
          setup_api_calls:
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-20", name: "Corner 20", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor20: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-20", legal_name: "OCC Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor20}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor20: $.data.id, m_cor20_v1: $.data.version }
            - call: "POST /coop/members/${m_cor20}/deactivate"
              payload: {}
              as: CoopRegistrar
            - call: "POST /coop/members/${m_cor20}/reactivate"
              payload: {}
              as: CoopRegistrar
              captures: { m_cor20_v2: $.data.version }
          trigger:
            - call: "POST /coop/members/${m_cor20}/withdraw"
              payload: { expected_member_version: "${m_cor20_v1}" }
              as: Member
              as_user_id: "${m_cor20}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_MEMBER_VERSION"
            - "Member.${m_cor20}.status == ACTIVE  # unchanged"

      - name: occ_member_withdraw_correct_version_succeeds
        claim_type: occ_correct_version
        grounds:
          - "concurrency_rules[member-close-stale-version]"
        distinguishing_aspect: "POST /members/{id}/withdraw with matching expected_member_version succeeds and increments version"
        test_recipe:
          setup: ["Member M-COR-21 ACTIVE at version=1"]
          setup_api_calls:
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-21", name: "Corner 21", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor21: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-21", legal_name: "OCC2 Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor21}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor21: $.data.id, m_cor21_v: $.data.version }
          trigger:
            - call: "POST /coop/members/${m_cor21}/withdraw"
              payload: { expected_member_version: "${m_cor21_v}" }
              as: Member
              as_user_id: "${m_cor21}"
          assert:
            - "Member.${m_cor21}.status == WITHDRAWN"
            - "Member.${m_cor21}.version == ${m_cor21_v} + 1"

      - name: delegate_term_computed_is_seated
        claim_type: derived_field
        grounds:
          - "entities.Delegate.fields.is_seated"
        distinguishing_aspect: "Delegate.is_seated is computed: true iff clock.now in [term_start, term_end) AND member.status == ACTIVE"
        test_recipe:
          setup: ["District DIST-COR-22, Member M-COR-22 ACTIVE, delegate with term 2025-01-01 to 2027-01-01; clock at 2026-06-01"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-22", name: "Corner 22", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor22: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-22", legal_name: "Seated Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor22}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor22: $.data.id }
          trigger:
            - call: "POST /coop/delegate_districts/${dist_cor22}/delegates"
              payload: { member_id: "${m_cor22}", term_start: "2025-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: CoopRegistrar
              captures: { del_cor22: $.data.id }
          assert:
            - "Delegate.${del_cor22}.is_seated == true"

  # ============================================================
  # Section: consistency_model — immediate
  # ============================================================
  - section: consistency_model
    instances:
      - name: certificate_balance_reflects_disburse_immediately
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.EquityCertificate.ACTIVE_to_PARTIALLY_REDEEMED"
        distinguishing_aspect: "After disburse returns 200, GET on the certificate reflects updated outstanding_cents in the same logical instant (immediate consistency, no eventual lag)"
        test_recipe:
          setup: ["Member M-COR-23 with APPROVED RedemptionRequest for 5000c against cert face 10000c"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-23", name: "Corner 23", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor23: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-23", legal_name: "Immediate Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor23}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor23: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.20 }
              as: CoopAccountant
              captures: { fy_cor23: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor23}", fiscal_year_id: "${fy_cor23}", commodity: "CORN", gross_bushels: 1000, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor23: $.data.id }
            - call: "POST /coop/deliveries/${d_cor23}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy_cor23}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "POST /coop/fiscal_years/${fy_cor23}/begin_audit"
              payload: {}
              as: ExternalAuditor
            - call: "GET /coop/fiscal_years/${fy_cor23}"
              payload: {}
              as: CoopAccountant
              captures: { fy_cor23_v: $.data.version }
            - call: "POST /coop/fiscal_years/${fy_cor23}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy_cor23_v}" }
              as: CoopAccountant
            - call: "GET /coop/members/${m_cor23}/certificates"
              payload: {}
              as: Member
              as_user_id: "${m_cor23}"
              captures: { cert_cor23: "$.data[0].id", cert_cor23_v: "$.data[0].version" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/redemption_requests"
              payload: { member_id: "${m_cor23}", kind: "RETIREMENT", certificate_ids: ["${cert_cor23}"], requested_amount_cents: 5000, appointment_at: "2031-10-01T10:00:00Z" }
              as: Member
              as_user_id: "${m_cor23}"
              captures: { req_cor23: $.data.id }
            - call: "POST /coop/redemption_requests/${req_cor23}/submit_for_review"
              payload: {}
              as: Member
              as_user_id: "${m_cor23}"
            - call: "POST /coop/board_resolutions"
              payload: { resolution_code: "RES-COR-23", kind: "APPROVE_RETIREMENT", subject_ref_id: "${req_cor23}", quorum_required: 1, voting_opens_at: "2031-09-01T00:00:00Z", voting_closes_at: "2031-09-02T00:00:00Z" }
              as: BoardSecretary
              captures: { res_cor23: $.data.id }
            - call: "POST /coop/delegate_districts/${dist_cor23}/delegates"
              payload: { member_id: "${m_cor23}", term_start: "2025-01-01T00:00:00Z", term_end: "2035-01-01T00:00:00Z" }
              as: CoopRegistrar
              captures: { del_cor23: $.data.id }
            - call: "POST /coop/board_resolutions/${res_cor23}/open_voting"
              payload: {}
              as: BoardSecretary
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-03T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/board_resolutions/${res_cor23}/record_vote"
              payload: { delegate_id: "${del_cor23}", vote: "FOR" }
              as: BoardSecretary
            - call: "POST /coop/redemption_requests/${req_cor23}/decide"
              payload: { decision: "APPROVE", resolution_id: "${res_cor23}" }
              as: BoardSecretary
            - call: "GET /coop/certificates/${cert_cor23}"
              payload: {}
              as: CoopTreasurer
              captures: { cert_cor23_v_pre_disb: $.data.version, cert_cor23_outstanding_pre: $.data.outstanding_cents }
          trigger:
            - call: "POST /coop/redemption_requests/${req_cor23}/disburse"
              payload: { expected_certificate_versions: ["${cert_cor23_v_pre_disb}"] }
              as: CoopTreasurer
            - call: "GET /coop/certificates/${cert_cor23}"
              payload: {}
              as: CoopTreasurer
          assert:
            - "EquityCertificate.${cert_cor23}.outstanding_cents == cert_cor23_outstanding_pre - 5000"
            - "EquityCertificate.${cert_cor23}.status == PARTIALLY_REDEEMED"
            - "Second GET (immediate) reflects the disbursed state without delay"
