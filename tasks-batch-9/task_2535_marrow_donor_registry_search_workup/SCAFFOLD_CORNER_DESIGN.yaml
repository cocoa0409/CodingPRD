      - name: typing_deadlines_apply_the_grace_and_priority_constants
        claim_type: Constants Applied
        grounds:
          - calculations.ct_deadline_and_expiry_sweep.constants
          - entities.Registry.fields.ct_response_deadline_hours
          - entities.ConfirmatoryTypingRequest.fields.deadline_at
          - endpoints.POST_registry_match_candidates_id_typing_requests
        distinguishing_aspect: |
          Three requests raised at the same instant 2026-08-01T00:00:00Z produce three different
          arithmetic paths through the same constants: 168 contractual hours (domestic), 120 + 48
          INTERNATIONAL_GRACE_HOURS (which lands on the SAME instant as the domestic one, so a wrong
          grace value cannot hide behind a coincidence), and 168 - 24 PRIORITY_DEADLINE_REDUCTION_HOURS.
          Two of them are raised on BACKUP candidates, which the candidate machine permits.
        test_recipe:
          setup:
            - "domestic registry with ct_response_deadline_hours 168 and international registry with 120"
            - "donors D1 (domestic), D5 (domestic), D2 (international); DOMESTIC_AND_INTERNATIONAL search so all three are candidates (D1 PRIMARY, D5 rank 2, D2 rank 3)"
            - "the logical clock is left at its default 2026-08-01T00:00:00Z for all three requests"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
