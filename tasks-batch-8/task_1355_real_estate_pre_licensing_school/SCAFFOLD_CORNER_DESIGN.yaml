            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 5, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
