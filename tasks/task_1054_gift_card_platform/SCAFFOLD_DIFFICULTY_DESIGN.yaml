          trigger:
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 999999 }, as: POSTerminal, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CARD_NOT_ACTIVE"
            - "GiftCard.${c_id}.balance_cents == 10000"

      - name: reload_referential_beats_constraint
        grounds:
          - "validations[priority=12]"
          - "validations[priority=14]"
        distinguishing_aspect: "A reload of 50000 onto a card at balance 90000 whose program is RETIRED violates both the referential rule (priority 12, ERR_PROGRAM_NOT_ACTIVE) and the max-balance constraint (priority 14, ERR_MAX_BALANCE_EXCEEDED); the referential error wins — category pair business_referential × business_constraint, distinct from state × fiscal."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; card ACTIVE loaded 90000; then the program is RETIRED (card stays ACTIVE)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
