            as: ProductionCoordinator
            captures: { c2_id: "$.data.id" }
          trigger:
          - call: "POST /cuts/${c_id}/derive"
            payload: { cut_code: "BROADCAST", loop_count: 350, runtime_seconds: 6800, expected_parent_cut_version: "${c_v1}" }
            as: ProductionCoordinator
            captures: { err_id: "$.data.error_id" }
          - call: "GET /cuts/${c_id}"
            payload: {}
            as: ProductionCoordinator
            captures: { c_v_fresh: "$.data.version" }
          - call: "POST /cuts/${c_id}/derive"
            payload: { cut_code: "BROADCAST", loop_count: 350, runtime_seconds: 6800, expected_parent_cut_version: "${c_v_fresh}" }
            as: ProductionCoordinator
            captures: { c3_id: "$.data.id" }
          assert:
