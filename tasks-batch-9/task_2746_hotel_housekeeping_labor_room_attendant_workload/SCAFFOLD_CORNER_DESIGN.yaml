            - "Room.${room101_id}.updated_at == 2026-08-03T07:00:00.000Z, taken from the logical clock"
            - "GET /housekeeping/rooms/${room101_id} returns the same values as the PATCH response"

      - name: ep_lost_found_store_stamps_the_retention_window
