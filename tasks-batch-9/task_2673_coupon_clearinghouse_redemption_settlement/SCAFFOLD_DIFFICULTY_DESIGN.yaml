  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: postmark_window_half_open_adjacency_allowed
        grounds:
          - validations[priority=17]
          - errors.ERR_POSTMARK_WINDOW_OVERLAP
          - entities.Submission.fields.postmark_window_start
          - entities.Submission.fields.postmark_window_end
        distinguishing_aspect: |
          The contended resource is the Retailer's mail-intake stream, and the
          interval is HALF-OPEN [start, end). Four probes pin the semantics: a
          one-day overlap is refused, a window starting exactly on the incumbent's
          exclusive end is accepted (adjacency is not overlap), a window fully
          contained inside the incumbent is refused, and once the incumbent
          submission reaches intake_status CLOSED its window stops contending, so
          a window that was previously refused becomes legal without any date
          changing. An implementation using closed intervals fails probe 2; one
          that ignores the CLOSED exemption fails probe 4.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default throughout"
            - "retailer with channel_capability BOTH holds submission S1 on [2026-07-01, 2026-07-16), verified 2, one lot of 2 accepted items still un-finalized so S1 is not CLOSED"
