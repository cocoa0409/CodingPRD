# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Lactation Consulting & Breastfeeding Support (IBCLC) — Expert
# Nine §0.5 rules, >= 2 instances each (>= 18 total).
# All formula-derived asserts are literals computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: consult_fee_self_pay_vs_package_redemption
        grounds:
          - calculations.sliding_scale_fee
          - entities.Consult.fields.fee_cents
          - entities.Consult.fields.package_credit_redeemed
          - entities.Client.fields.package_credits_consumed
        distinguishing_aspect: |
          Same consult subject, two valid pay_method variants on the CONSULT domain:
          SELF_PAY yields a discounted sliding-scale fee_cents=12000 while PACKAGE
          yields fee_cents=0 and commits one Client credit — distinct outputs from
          identical consultant rate.
        test_recipe:
          setup:
            - "Practice with standard consultant rate 20000; TIER_A ceiling 5000000 discount 40."
            - "One client at income 4800000 with a 3-visit package; one client at income 4800000 self-pay."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /sliding-scale-tiers"
              payload: { practice_id: "${prac_id}", name: "TIER_A", income_ceiling_cents: 5000000, discount_pct: 40 }
              as: PracticeAdmin
            - call: "POST /service-packages"
              payload: { practice_id: "${prac_id}", name: "THREE_VISIT", included_visits: 3, price_cents: 30000 }
              as: PracticeAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Pkg Parent", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 4800000, package_id: "${pkg_id}" }
              as: FrontDesk
              captures: { client_pkg_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "SelfPay Parent", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 4800000 }
              as: FrontDesk
              captures: { client_sp_id: $.data.id }
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_sp_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_sp_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_pkg_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T17:00:00Z", scheduled_end_utc: "2026-06-10T18:00:00Z", pay_method: "PACKAGE" }
              as: FrontDesk
              captures: { consult_pkg_id: $.data.id }
          assert:
            - "Consult.${consult_sp_id}.fee_cents == 12000"
            - "Consult.${consult_pkg_id}.fee_cents == 0"
            - "Consult.${consult_pkg_id}.package_credit_redeemed == false"

      - name: reimbursement_aca_preventive_vs_standard_cost_share
        grounds:
          - calculations.reimbursement_amount
          - entities.Superbill.fields.reimbursed_amount_cents
          - entities.Superbill.fields.patient_responsibility_cents
          - state_machines.Superbill.SUBMITTED_to_PAID
        distinguishing_aspect: |
          Different entity domain (SUPERBILL): ACA-preventive variant reimburses the
          full allowed 15000 with patient_responsibility 0, while standard cost-share
          on identical allowed amount reimburses 8800 with patient_responsibility 6200.
        test_recipe:
          setup:
            - "Two COMPLETED consults; one superbill billed ACA-preventive, one billed standard with deductible 4000 and coinsurance 20."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent B", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_b_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T17:00:00Z", scheduled_end_utc: "2026-06-10T18:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_b_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_b_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_b_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_b_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: true }
              as: BillingSpecialist
              captures: { sb_aca_id: $.data.id }
            - call: "POST /superbills"
              payload: { consult_id: "${consult_b_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: false, deductible_remaining_cents: 4000, coinsurance_pct: 20 }
              as: BillingSpecialist
              captures: { sb_std_id: $.data.id }
            - call: "POST /superbills/${sb_aca_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /superbills/${sb_std_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /superbills/${sb_aca_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
            - call: "POST /superbills/${sb_std_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
          assert:
            - "Superbill.${sb_aca_id}.reimbursed_amount_cents == 15000"
            - "Superbill.${sb_aca_id}.patient_responsibility_cents == 0"
            - "Superbill.${sb_std_id}.reimbursed_amount_cents == 8800"
            - "Superbill.${sb_std_id}.patient_responsibility_cents == 6200"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: reimbursement_three_input_nonlinear_clamp
        grounds:
          - calculations.reimbursement_amount
          - entities.Superbill.fields.deductible_remaining_cents
          - entities.Superbill.fields.coinsurance_pct
          - entities.Superbill.fields.reimbursed_amount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (allowed, deductible_remaining, coinsurance_pct) with a
          non-linear min() clamp — deductible 20000 > allowed 15000 clamps to 15000, so
          after_deductible=0, coinsurance contributes 0, reimbursed=0. Not a linear sum.
        test_recipe:
          setup:
            - "One COMPLETED consult; standard superbill allowed 15000, deductible_remaining 20000, coinsurance 20."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: false, deductible_remaining_cents: 20000, coinsurance_pct: 20 }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
            - call: "POST /superbills/${sb_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
          assert:
            - "Superbill.${sb_id}.reimbursed_amount_cents == 0"
            - "Superbill.${sb_id}.patient_responsibility_cents == 15000"

      - name: weighted_feed_sum_then_round_order
        grounds:
          - calculations.weighted_feed_rollup
          - entities.FollowUpPlan.fields.avg_transfer_grams
          - entities.FollowUpPlan.fields.total_transfer_grams
          - entities.WeightedFeed.fields.transfer_grams
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — three feeds transfer 50, 50, 51;
          sum-then-round gives avg = round_half_up(151/3) = round(50.333) = 50, distinct from
          any per-feed pre-rounding scheme. total_transfer_grams = 151.
        test_recipe:
          setup:
            - "OPEN follow-up plan off a COMPLETED consult; three weighted feeds with transfers 50, 50, 51."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /follow-up-plans"
              payload: { consult_id: "${consult_a_id}", target_daily_transfer_grams: 100 }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /weighted-feeds"
              payload: { follow_up_plan_id: "${plan_id}", pre_feed_weight_grams: 4000, post_feed_weight_grams: 4050 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /weighted-feeds"
              payload: { follow_up_plan_id: "${plan_id}", pre_feed_weight_grams: 4050, post_feed_weight_grams: 4100 }
              as: Consultant
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /weighted-feeds"
              payload: { follow_up_plan_id: "${plan_id}", pre_feed_weight_grams: 4100, post_feed_weight_grams: 4151 }
              as: Consultant
              as_user_id: "${cons_id}"
          assert:
            - "FollowUpPlan.${plan_id}.total_transfer_grams == 151"
            - "FollowUpPlan.${plan_id}.avg_transfer_grams == 50"
            - "FollowUpPlan.${plan_id}.meets_target == true"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: consult_reschedule_cycle_loop
        grounds:
          - state_machines.Consult.SCHEDULED_to_RESCHEDULED
          - state_machines.Consult.RESCHEDULED_to_SCHEDULED
          - entities.Consult.fields.reschedule_count
        distinguishing_aspect: |
          Cyclic shape on CONSULT: SCHEDULED -> RESCHEDULED -> SCHEDULED returns to the same
          state and may repeat; after two reschedules reschedule_count == 2 and status is
          still SCHEDULED — not a forward-only pipeline.
        test_recipe:
          setup:
            - "One SCHEDULED telehealth consult."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
          trigger:
            - call: "POST /consults/${consult_a_id}/reschedule"
              payload: { scheduled_start_utc: "2026-06-11T15:00:00Z", scheduled_end_utc: "2026-06-11T16:00:00Z" }
              as: FrontDesk
            - call: "POST /consults/${consult_a_id}/reschedule"
              payload: { scheduled_start_utc: "2026-06-12T15:00:00Z", scheduled_end_utc: "2026-06-12T16:00:00Z" }
              as: FrontDesk
          assert:
            - "Consult.${consult_a_id}.status == SCHEDULED"
            - "Consult.${consult_a_id}.reschedule_count == 2"

      - name: superbill_denied_resubmit_cycle
        grounds:
          - state_machines.Superbill.SUBMITTED_to_DENIED
          - state_machines.Superbill.DENIED_to_SUBMITTED
          - state_machines.Superbill.SUBMITTED_to_PAID
        distinguishing_aspect: |
          Cyclic shape on a DIFFERENT entity (SUPERBILL): SUBMITTED -> DENIED -> SUBMITTED loops
          back, then SUBMITTED -> PAID — a revisit of SUBMITTED that a linear pipeline forbids.
        test_recipe:
          setup:
            - "One COMPLETED consult with a DRAFT standard superbill, allowed 10000, deductible 0, coinsurance 0."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 20000, allowed_amount_cents: 10000, is_aca_preventive: false, deductible_remaining_cents: 0, coinsurance_pct: 0 }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
            - call: "POST /superbills/${sb_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { outcome: "DENIED" }
              as: BillingSpecialist
          trigger:
            - call: "POST /superbills/${sb_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
          assert:
            - "Superbill.${sb_id}.status == PAID"
            - "Superbill.${sb_id}.reimbursed_amount_cents == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: no_show_strike_suspend_autocancel_depth3
        grounds:
          - state_machines.Consult.SCHEDULED_to_NO_SHOW
          - state_machines.Consult.SCHEDULED_to_CANCELLED
          - entities.Client.fields.no_show_strikes
          - entities.Client.fields.status
          - calculations.no_show_suspension
        distinguishing_aspect: |
          Depth-3 cascade from one no-show: link1 no-show increments Client.no_show_strikes to 3;
          link2 the strike crossing threshold sets Client.status SUSPENDED (caused by link1);
          link3 the suspension auto-cancels the client's OTHER SCHEDULED consult (caused by link2).
        test_recipe:
          setup:
            - "Client with 2 prior no-show strikes (status still ACTIVE), one future SCHEDULED consult, and a third consult now past its start ready to be no-showed."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Bay Lactation", aca_preventive_enabled: true }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T10:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T09:00:00Z", scheduled_end_utc: "2026-06-10T09:30:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { ns1_id: $.data.id }
            - call: "POST /consults/${ns1_id}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T09:30:00Z", scheduled_end_utc: "2026-06-10T09:45:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { ns2_id: $.data.id }
            - call: "POST /consults/${ns2_id}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-12T15:00:00Z", scheduled_end_utc: "2026-06-12T16:00:00Z", pay_method: "SELF_PAY" }
