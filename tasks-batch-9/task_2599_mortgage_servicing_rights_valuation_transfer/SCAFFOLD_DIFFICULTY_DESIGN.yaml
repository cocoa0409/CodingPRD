              as: ComplianceOfficer
              as_user_id: co-002
              captures: { state2: "$.data.status", ret2: "$.data.holdback_retained_cents", rel2: "$.data.holdback_released_cents", app2: "$.data.holdback_applied_cents" }
          assert:
            - "${hb_total} == 28320 with ${ret0} == 28320, ${rel0} == 0, ${app0} == 0 — invariant 28320 == 28320 + 0 + 0"
            - "the release is a tier-1 full release: gross 28320, remediation total 0 so charge 0, net 28320"
            - "${state1} == HOLDBACK_RELEASED with ${ret1} == 0, ${rel1} == 28320, ${app1} == 0 — invariant 28320 == 0 + 28320 + 0"
            - "${state2} == SETTLED with ${ret2} == 28320, ${rel2} == 0, ${app2} == 0 — invariant restored to the opening split with no drift"
            - "holdback_cents itself is never rewritten by either call: it stays 28320 throughout"
            - "a partial clawback of 10000 is refused because the compensation must return the whole released balance, leaving the split untouched"
            - "a clawback of 28321 returns 422 ERR_CLAWBACK_EXCEEDS_RELEASED"
            - "after the rewind, re-filing the release with the refreshed expected_purchase_agreement_version reproduces exactly retained 0 / released 28320 / applied 0"
            - "re-filing it with the pre-clawback ${pa_v} returns 412 ERR_STALE_AGREEMENT_VERSION, so the compensation is visible to the OCC guard"
            - "a clawback attempt from the SETTLED state returns 409 ERR_AGREEMENT_INVALID_STATE"
