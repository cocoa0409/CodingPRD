            - { call: "POST /orders/${ord}/crew-assignments", payload: { service_end: "ORIGIN", service_date: "2026-06-10T00:00:00Z", start_hour: 8, end_hour: 12, crew_size: 3 }, as: OriginAgent, as_user_id: "${ag_o}", captures: { cr_b: $.data.id } }
            - { call: "POST /crew-assignments/${cr_a}/confirm", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
          trigger:
            - call: "POST /crew-assignments/${cr_b}/confirm"
              payload: {}
              as: OriginAgent
              as_user_id: "${ag_o}"
              captures: { err_blocked: $.data.error_id }
            - { call: "POST /crew-assignments/${cr_a}/cancel", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
            - { call: "POST /crew-assignments/${cr_b}/confirm", payload: {}, as: OriginAgent, as_user_id: "${ag_o}" }
          assert:
            - "err_blocked == ERR_CREW_SCHEDULE_CONFLICT while crew A holds the [8,12) slot (confirmed hours == 4)"
            - "CrewAssignment.${cr_a}.status == CANCELLED after the compensating cancel"
            - "CrewAssignment.${cr_b}.status == CONFIRMED after the cancel — the pool returned to baseline (cancelled hours do not count), so the identical interval now confirms"
            - "Total CONFIRMED labor_hours for (agent ag_o, 2026-06-10) == 4 after the roundtrip (crew B only), exactly the pre-chain baseline plus crew B's 4"
