scaffold_corner_design:
  - section: entities
    instances:
      - name: create_district_returns_the_created_row_with_declared_fields
        claim_type: creation
        grounds:
          - "entities.District"
          - "endpoints.POST /epp/districts"
          - "response_envelope.success"
        distinguishing_aspect: "A POST with every required field plus both optional flags returns 201 and echoes each stored field inside the success envelope's data object."
        test_recipe:
          setup:
            - "Set the logical clock to the mandatory default 2026-08-01T00:00:00Z; the database is otherwise empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
          assert:
            - "The trigger returns 201 with response_type == \"object\" and a meta object carrying api_request_id and api_request_timestamp."
            - "data.name == \"Ridgeview ISD\", data.district_code == \"D-RIDGE\", data.state_code == \"TX\", data.requires_district_fingerprint == true and data.travel_reimbursement_enabled == true."
            - "data.id is a non-empty string and data.version == 1."
      - name: get_candidate_returns_the_stored_row_with_initial_derived_fields
        claim_type: retrieval
        grounds:
          - "entities.Candidate"
          - "endpoints.GET /epp/candidates/{candidate_id}"
        distinguishing_aspect: "A freshly created candidate reads back with its input fields intact and every derived/system field at its declared initial value."
        test_recipe:
          setup:
            - "Create one candidate at clock 2026-08-01T00:00:00Z and read it back; no readiness items exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
          trigger:
            - call: "GET /epp/candidates/${c1}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The trigger returns 200 with data.candidate_code == \"C-1001\", data.full_name == \"Ana Diaz\", data.program_track == \"SECONDARY\", data.home_grid_x == 2 and data.home_grid_y == 4."
            - "data.readiness_score == 0, data.readiness_status == \"NOT_READY\" and data.readiness_variant_used == null."
            - "data.licensure_status == \"PENDING\", data.report_status == \"UNREPORTED\" and data.state_report_deadline == null."
      - name: list_readiness_items_filtered_by_candidate_is_paginated
        claim_type: listing
        grounds:
          - "entities.ReadinessItem"
          - "endpoints.GET /epp/readiness-items"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "A filtered list returns only the requested candidate's items and reports total_count and has_more against the filtered set, not the whole table."
        test_recipe:
          setup:
            - "Create one candidate with three readiness items (exam, clearance, coursework), all left PENDING_VERIFICATION."
            - "Request the first page with page_size 2, then the second page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "CONTENT_EXAM", "issued_on": "2026-01-15", "exam_score": 245, "expires_on": "2031-01-15"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "BACKGROUND_CLEARANCE", "issued_on": "2026-05-01", "clearance_scope": "DISTRICT_FINGERPRINT", "expires_on": "2027-05-01"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
          trigger:
            - call: "GET /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "page": 1, "page_size": 2}
              as: CredentialAnalyst
            - call: "GET /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "page": 2, "page_size": 2}
              as: CredentialAnalyst
          assert:
            - "The first trigger call returns 200 with response_type == \"array\", exactly 2 rows in data, total_count == 3 and has_more == true."
            - "The second trigger call returns exactly 1 row, total_count == 3 and has_more == false."
            - "Every returned row has candidate_id == \"${c1}\" and status == \"PENDING_VERIFICATION\"."
      - name: get_placement_with_an_unknown_id_returns_placement_not_found
        claim_type: not_found
        grounds:
          - "errors.ERR_PLACEMENT_NOT_FOUND"
          - "validations[priority=5]"
          - "endpoints.GET /epp/placements/{placement_id}"
        distinguishing_aspect: "An id that matches no Placement row returns that entity's own 404 code, not a generic not-found."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "GET /epp/placements/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlacementCoordinator
          assert:
            - "The trigger returns 404 with response_type == \"error\" and data.error_id == \"ERR_PLACEMENT_NOT_FOUND\"."
            - "data.message is a non-empty string."
      - name: create_placement_request_without_term_start_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=6]"
          - "errors.ERR_INVALID_REQUEST"
          - "endpoints.POST /epp/placement-requests"
          - "entities.PlacementRequest.term_start_date"
        distinguishing_aspect: "Omitting the required term_start_date is rejected with ERR_INVALID_REQUEST before any eligibility or readiness work runs, and no PlacementRequest row is created."
        test_recipe:
          setup:
            - "Build the base fixture so every other precondition of a routable request is satisfied."
            - "Post a placement request that omits term_start_date only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 1, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"]}
              as: ProgramAdmin
              captures: {"a1": "$.data.id"}
            - call: "POST /epp/partnership-agreements/${a1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Tina Ortiz", "site_name": "Ridgeview HS", "site_grid_x": 10, "site_grid_y": 10, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 9, "consecutive_terms_hosted": 2, "max_concurrent_candidates": 1}
              as: SupervisionLead
              captures: {"t1": "$.data.id"}
            - call: "POST /epp/cooperating-teachers/${t1}/training-completion"
              payload: {"training_completed_on": "2026-06-01"}
              as: SupervisionLead
            - call: "POST /epp/university-supervisors"
              payload: {"full_name": "Dr. Sam Reyes", "employment_type": "FULL_TIME", "primary_subject": "MATH", "covered_grade_bands": ["MG_5_9", "HS_9_12"], "home_grid_x": 0, "home_grid_y": 0, "max_travel_miles": 60}
              as: SupervisionLead
              captures: {"s1": "$.data.id"}
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "CONTENT_EXAM", "issued_on": "2026-01-15", "exam_score": 245, "expires_on": "2031-01-15"}
              as: CredentialAnalyst
              captures: {"ri_exam_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_exam_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "BACKGROUND_CLEARANCE", "issued_on": "2026-05-01", "clearance_scope": "DISTRICT_FINGERPRINT", "expires_on": "2027-05-01"}
              as: CredentialAnalyst
              captures: {"ri_clear_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_clear_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
              captures: {"ri_course_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_course_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
          trigger:
            - call: "POST /epp/placement-requests"
              payload: {"candidate_id": "${c1}", "term": "FALL_2026", "requested_subject": "MATH", "requested_grade_band": "HS_9_12", "weeks_scheduled": 14, "max_commute_miles": 30, "preferred_district_id": "${d1}"}
              as: PlacementCoordinator
          assert:
            - "The trigger returns 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "GET /epp/placement-requests with candidate_id == \"${c1}\" returns total_count == 0."
      - name: create_cooperating_teacher_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.CooperatingTeacher.consecutive_terms_hosted"
          - "entities.CooperatingTeacher.max_concurrent_candidates"
          - "entities.CooperatingTeacher.qualification_status"
          - "endpoints.POST /epp/cooperating-teachers"
        distinguishing_aspect: "Omitting consecutive_terms_hosted and max_concurrent_candidates applies the declared defaults 0 and 1, and the teacher starts PENDING_TRAINING with no training dates."
        test_recipe:
          setup:
            - "Create one district, then a teacher with only the required fields."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX"}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
          trigger:
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Tina Ortiz", "site_name": "Ridgeview HS", "site_grid_x": 10, "site_grid_y": 10, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 9}
              as: SupervisionLead
          assert:
            - "The trigger returns 201 with data.consecutive_terms_hosted == 0 and data.max_concurrent_candidates == 1."
            - "data.qualification_status == \"PENDING_TRAINING\", data.training_completed_on == null and data.training_expires_on == null."
            - "data.active_placement_count == 0."
            - "The district's own optional flags also defaulted: GET /epp/districts/${d1} returns data.requires_district_fingerprint == false and data.travel_reimbursement_enabled == false."
      - name: create_agreement_seat_counters_are_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.PartnershipAgreement.seats_reserved"
          - "entities.PartnershipAgreement.seats_committed"
          - "entities.PartnershipAgreement.stipend_committed_cents"
          - "calculations.agreement_ledger"
          - "endpoints.POST /epp/partnership-agreements"
        distinguishing_aspect: "Client-supplied values for the four ledger fields are ignored: a brand-new agreement always reports 0 seats, 0 committed cents and capacity_posture OPEN."
        test_recipe:
          setup:
            - "Create a district, then post an agreement whose body also carries seats_reserved, seats_committed, stipend_committed_cents and capacity_posture."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX"}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
          trigger:
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 3, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"], "seats_reserved": 7, "seats_committed": 7, "stipend_committed_cents": 999999, "capacity_posture": "CAP_REACHED", "status": "ACTIVE"}
              as: ProgramAdmin
          assert:
            - "The trigger returns 201 with data.seats_reserved == 0, data.seats_committed == 0 and data.stipend_committed_cents == 0."
            - "data.capacity_posture == \"OPEN\" and data.status == \"DRAFT\" - the supplied status was ignored too."
            - "data.placement_cap == 3 and data.stipend_rate_cents_per_week == 12345, the genuinely input-sourced fields."
      - name: create_district_system_fields_are_generated_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.District"
          - "endpoints.POST /epp/districts"
          - "response_envelope.success"
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server; values supplied in the body never appear in the response."
        test_recipe:
          setup:
            - "Post a district whose body also carries id, created_at, updated_at and version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "id": "11111111-1111-4111-8111-111111111111", "created_at": "2000-01-01T00:00:00Z", "updated_at": "2000-01-01T00:00:00Z", "version": 99}
              as: ProgramAdmin
          assert:
            - "The trigger returns 201 with data.id != \"11111111-1111-4111-8111-111111111111\"."
            - "data.created_at == \"2026-08-01T00:00:00Z\" and data.updated_at == \"2026-08-01T00:00:00Z\", both stamped from the logical clock rather than the body."
            - "data.version == 1, not 99."
      - name: create_candidate_with_an_undeclared_program_track_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Candidate.program_track"
          - "validations[priority=6]"
          - "errors.ERR_INVALID_REQUEST"
          - "endpoints.POST /epp/candidates"
        distinguishing_aspect: "program_track accepts only the three declared enum members; MIDDLE_GRADES is refused with ERR_INVALID_REQUEST and no row is created."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-9999", "full_name": "Ivy Stone", "program_track": "MIDDLE_GRADES", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-9998", "full_name": "Ivy Stone", "program_track": "SECONDARY", "home_grid_x": 900, "home_grid_y": 4}
              as: ProgramAdmin
          assert:
            - "The first trigger call returns 400 with data.error_id == \"ERR_INVALID_REQUEST\"."
            - "The second trigger call also returns 400 with data.error_id == \"ERR_INVALID_REQUEST\", because home_grid_x is constrained to -500..500 and 900 is outside it."
            - "GET /epp/candidates returns total_count == 0."
      - name: create_readiness_item_for_an_unknown_candidate_returns_candidate_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=7]"
          - "errors.ERR_CANDIDATE_NOT_FOUND"
          - "entities.ReadinessItem.candidate_id"
          - "endpoints.POST /epp/readiness-items"
        distinguishing_aspect: "A body foreign key that resolves to nothing is reported with the referenced entity's own 404 code before any field-shape work persists a row."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
          trigger:
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "11111111-1111-4111-8111-111111111111", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
          assert:
            - "The trigger returns 404 with data.error_id == \"ERR_CANDIDATE_NOT_FOUND\"."
            - "GET /epp/readiness-items returns total_count == 0."
      - name: list_placements_filtered_by_cooperating_teacher_id_resolves_the_foreign_key
        claim_type: foreign_key_integrity
        grounds:
          - "complexity_profile.entity_topology"
          - "entities.Placement.cooperating_teacher_id"
          - "endpoints.GET /epp/placements"
        distinguishing_aspect: "In a flat topology every FK is reverse-reachable: filtering the placement list by cooperating_teacher_id returns exactly the placements of that teacher and nothing else."
        test_recipe:
          setup:
            - "Build the base fixture, add a second teacher, and route one placement so exactly one placement exists on teacher 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: ProgramAdmin
            - call: "POST /epp/districts"
              payload: {"name": "Ridgeview ISD", "district_code": "D-RIDGE", "state_code": "TX", "requires_district_fingerprint": true, "travel_reimbursement_enabled": true}
              as: ProgramAdmin
              captures: {"d1": "$.data.id"}
            - call: "POST /epp/partnership-agreements"
              payload: {"district_id": "${d1}", "term": "FALL_2026", "window_start": "2026-08-01", "window_end": "2027-01-31", "placement_cap": 1, "stipend_rate_cents_per_week": 12345, "allowed_subjects": ["MATH", "ELA"], "allowed_grade_bands": ["MG_5_9", "HS_9_12"]}
              as: ProgramAdmin
              captures: {"a1": "$.data.id"}
            - call: "POST /epp/partnership-agreements/${a1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Tina Ortiz", "site_name": "Ridgeview HS", "site_grid_x": 10, "site_grid_y": 10, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 9, "consecutive_terms_hosted": 2, "max_concurrent_candidates": 1}
              as: SupervisionLead
              captures: {"t1": "$.data.id"}
            - call: "POST /epp/cooperating-teachers/${t1}/training-completion"
              payload: {"training_completed_on": "2026-06-01"}
              as: SupervisionLead
            - call: "POST /epp/university-supervisors"
              payload: {"full_name": "Dr. Sam Reyes", "employment_type": "FULL_TIME", "primary_subject": "MATH", "covered_grade_bands": ["MG_5_9", "HS_9_12"], "home_grid_x": 0, "home_grid_y": 0, "max_travel_miles": 60}
              as: SupervisionLead
              captures: {"s1": "$.data.id"}
            - call: "POST /epp/candidates"
              payload: {"candidate_code": "C-1001", "full_name": "Ana Diaz", "program_track": "SECONDARY", "home_grid_x": 2, "home_grid_y": 4}
              as: ProgramAdmin
              captures: {"c1": "$.data.id"}
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "CONTENT_EXAM", "issued_on": "2026-01-15", "exam_score": 245, "expires_on": "2031-01-15"}
              as: CredentialAnalyst
              captures: {"ri_exam_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_exam_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "BACKGROUND_CLEARANCE", "issued_on": "2026-05-01", "clearance_scope": "DISTRICT_FINGERPRINT", "expires_on": "2027-05-01"}
              as: CredentialAnalyst
              captures: {"ri_clear_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_clear_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/readiness-items"
              payload: {"candidate_id": "${c1}", "item_type": "COURSEWORK_BLOCK", "issued_on": "2026-05-15", "credits": 18}
              as: CredentialAnalyst
              captures: {"ri_course_c1": "$.data.id"}
            - call: "POST /epp/readiness-items/${ri_course_c1}/verify"
              payload: {"decision": "VERIFIED"}
              as: CredentialAnalyst
            - call: "POST /epp/cooperating-teachers"
              payload: {"district_id": "${d1}", "full_name": "Marcus Bell", "site_name": "Ridgeview Math Academy", "site_grid_x": 10, "site_grid_y": 11, "subject_endorsement": "MATH", "grade_band": "HS_9_12", "years_experience": 6, "consecutive_terms_hosted": 2, "max_concurrent_candidates": 1}
              as: SupervisionLead
              captures: {"t2": "$.data.id"}
            - call: "POST /epp/cooperating-teachers/${t2}/training-completion"
              payload: {"training_completed_on": "2026-06-01"}
              as: SupervisionLead
            - call: "POST /epp/placement-requests"
              payload: {"candidate_id": "${c1}", "term": "FALL_2026", "requested_subject": "MATH", "requested_grade_band": "HS_9_12", "term_start_date": "2026-09-01", "weeks_scheduled": 14, "max_commute_miles": 30, "preferred_district_id": "${d1}"}
              as: PlacementCoordinator
              captures: {"r1": "$.data.id"}
            - call: "POST /epp/placement-requests/${r1}/route"
              payload: {}
              as: PlacementCoordinator
              captures: {"p1": "$.data.id"}
          trigger:
            - call: "GET /epp/placements"
              payload: {"cooperating_teacher_id": "${t1}"}
              as: PlacementCoordinator
            - call: "GET /epp/placements"
              payload: {"cooperating_teacher_id": "${t2}"}
              as: PlacementCoordinator
