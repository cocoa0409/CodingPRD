        distinguishing_aspect: |
          On POST /clients/{A}/meal-plans a referential violation (assessment_id
          belongs to client B, category business_referential, priority 8) and a
          safety violation (THERAPEUTIC diet mismatch, category business_safety,
          priority 11) co-occur; ERR_ASSESSMENT_CLIENT_MISMATCH wins. Category
          pair: business_referential vs business_safety — different from the
