      - Order ORD-A carries one line of 1 unit; it is transmitted at 2026-08-03T10:00:00Z, acknowledged, and shipped
        at 2026-08-03T12:00:00Z, giving ship_hours 2.00 against a ship_deadline_at of 2026-08-06T22:00:00Z, so on_time
        is true.
      - Order ORD-B carries one line of 9 units; it is transmitted at 2026-08-03T10:00:00Z and then cancelled by
        the vendor.
      - 'Both lines therefore fall inside the period 2026-08-01..2026-08-31: transmitted_line_count 2, shipped_line_count
