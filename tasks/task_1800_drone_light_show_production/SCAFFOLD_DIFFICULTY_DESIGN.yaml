            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_a}", drone_count: 2, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_a: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_a}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_a}", as: ProductionPlanner, captures: { va: $.data.version } }
            - { call: "POST /api/show-designs/${design_a}/lock", payload: { expected_show_event_version: "${va}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_a}", as: ProductionPlanner, captures: { va2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_a}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${va2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_a: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_a}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_a}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_a: $.data.id } }
