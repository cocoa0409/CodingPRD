      - name: replacement_benchmark_supersedes_the_challenged_row_before_scoring
        claim_type: input_set_filtering
        grounds:
          - calculations.performance_test_evaluation.input_set
          - state_machines.MonthlyReportPackage.benchmark_status_==_CHALLENGED_to_benchmark_status_==_SUBMITTED
          - entities.MarketBenchmark.fields.superseded
        distinguishing_aspect: "After the owner challenges the 83.33 benchmark and the manager posts an 11000/12000 replacement, only the live row scores, so rpi_weighted is 91.67 and the RPI leg passes — had the superseded row counted, both legs would have failed."
        test_recipe:
          setup:
            - "One ACTIVE agreement with min_benchmark_months 1, test_periods_expected 1, consecutive_failure_limit 2, rpi_test_threshold 90.0 and gop_test_threshold_pct 0.85."
            - "An APPROVED FY2026 budget with budgeted_agop_cents 86500000 and a (2026, 9) package with agop 20220000."
            - "The first benchmark of 10000/12000 was challenged and replaced by 11000/12000, and both dimensions are now ACCEPTED."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Superseded Benchmark Hotel", owner_entity_name: "Benchmark Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0, gop_test_threshold_pct: 0.85, rpi_test_threshold: 90.0, min_benchmark_months: 1, test_periods_expected: 1, consecutive_failure_limit: 2 }
              as: PlatformAdmin
              captures: { sb_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sb_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sb_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${sb_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${sb_v2}" }
              as: HotelManagerOps
              captures: { sb_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${sb_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${sb_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${sb_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { sb_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${sb_pkg}/benchmarks"
              payload: { hotel_revpar_cents: 10000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT" }
              as: HotelManagerOps
              captures: { sb_bm1: $.data.id }
            - call: "POST /hotel-management/report-packages/${sb_pkg}/owner-review"
              payload: { dimension: "BENCHMARK", decision: "DISPUTE", note: "comp set membership questioned" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/report-packages/${sb_pkg}/benchmarks"
              payload: { hotel_revpar_cents: 11000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT" }
              as: HotelManagerOps
              captures: { sb_bm2: $.data.id }
            - call: "POST /hotel-management/report-packages/${sb_pkg}/owner-review"
              payload: { dimension: "BENCHMARK", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/report-packages/${sb_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${sb_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "POST /hotel-management/agreements/${sb_agr}/performance-tests"
              payload: { fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { sb_test: $.data.id }
            - call: "GET /hotel-management/report-packages/${sb_pkg}/benchmarks"
              payload: { superseded: true }
              as: AssetManager
          assert:
            - "MarketBenchmark.${sb_bm1}.rpi == 83.33 with superseded == true and MarketBenchmark.${sb_bm2}.rpi == 91.67 with superseded == false"
            - "the filtered benchmark read returns pagination.total_count == 1 and MonthlyReportPackage.${sb_pkg}.reported_rpi == 91.67"
            - "PerformanceTest.${sb_test}.str_month_count == 1, rpi_weighted == 91.67 and rpi_simple_average == 91.67"
            - "PerformanceTest.${sb_test}.prorated_budget_agop_cents == 86500000, actual_agop_cents == 20220000 and gop_achievement_pct == 0.2338"
            - "PerformanceTest.${sb_test}.status == PASSED with streak_after_test == 0 and cure_payment_due_cents == 0 — the RPI leg passed even though the AGOP leg failed"
            - "ManagementAgreement.${sb_agr}.status is still ACTIVE with performance_failure_streak == 0 and distribution_hold == false"

      - name: gross_negligence_selects_the_override_split_variant
        claim_type: variant_selection
        grounds:
          - calculations.employment_claim_liability_split.variants.negligence_override
          - entities.EmploymentClaim.fields.gross_negligence
        distinguishing_aspect: "gross_negligence true selects the override, so the manager bears the claim up to its 2000000 indemnity cap and the owner takes the 1000001 excess — not the 1500000/1500001 fifty-fifty split the GM position class would otherwise produce."
        test_recipe:
          setup:
            - "One ACTIVE agreement with employee_model MANAGER_EMPLOYEES, manager_indemnity_cap_cents 2000000, initial_working_capital_cents 5000000 and working_capital_floor_cents 0."
            - "One FILED EmploymentClaim for a GM of 3000001 with gross_negligence true."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Negligence Override Hotel", owner_entity_name: "Override Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, employee_model: "MANAGER_EMPLOYEES", manager_indemnity_cap_cents: 2000000, initial_working_capital_cents: 5000000, working_capital_floor_cents: 0 }
              as: PlatformAdmin
              captures: { ng_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${ng_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${ng_agr}/employment-claims"
              payload: { position_class: "GM", claim_amount_cents: 3000001, gross_negligence: true }
              as: HotelManagerOps
              captures: { ng_clm: $.data.id }
          trigger:
            - call: "POST /hotel-management/employment-claims/${ng_clm}/allocation"
              payload: { action: "ALLOCATE" }
              as: AssetManager
          assert:
            - "EmploymentClaim.${ng_clm}.manager_share_cents == 2000000 and owner_share_cents == 1000001, not the 1500000/1500001 default split"
            - "EmploymentClaim.${ng_clm}.owner_share_cents + manager_share_cents == 3000001 and status == ALLOCATED"
            - "ManagementAgreement.${ng_agr}.working_capital_balance_cents == 3998999 and manager_liability_accrued_cents == 2000000"
            - "GET /hotel-management/agreements/${ng_agr}/working-capital-calls returns pagination.total_count == 0 because the balance still meets the zero floor"

      - name: deadlock_carryforward_with_no_prior_year_leaves_the_amounts_unchanged
        claim_type: correct_result
        grounds:
          - calculations.deadlock_carryforward_amounts
          - state_machines.OperatingBudget.SUBMITTED_to_DEADLOCK_CARRYFORWARD
          - entities.OperatingBudget.fields.carryforward_applied
        distinguishing_aspect: "With max_revision_rounds 0 the first revision request deadlocks immediately, and because no prior fiscal year budget exists the empty-candidate fallback leaves the submitted amounts untouched with carryforward_applied false — the 1.03 factor is never applied."
        test_recipe:
          setup:
            - "One ACTIVE agreement with max_revision_rounds 0 and no FY2025 budget of any status."
            - "A SUBMITTED FY2026 budget of 300000000 revenue, 200000000 operating expenses, 4000000 FF&E and 2000000 brand capital."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Empty Fallback Hotel", owner_entity_name: "Fallback Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, max_revision_rounds: 0, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { ef_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${ef_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ef_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${ef_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, budgeted_capital_ffe_cents: 4000000, budgeted_capital_brand_cents: 2000000, expected_agreement_version: "${ef_v2}" }
              as: HotelManagerOps
              captures: { ef_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${ef_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /hotel-management/budgets/${ef_bud}/decision"
              payload: { decision: "REQUEST_REVISION", note: "owner rejects the plan outright" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "OperatingBudget.${ef_bud}.status == DEADLOCK_CARRYFORWARD and revision_round == 0"
            - "OperatingBudget.${ef_bud}.carryforward_applied == false — the candidate set was empty"
            - "budgeted_revenue_cents == 300000000, budgeted_operating_expenses_cents == 200000000, budgeted_capital_ffe_cents == 4000000, budgeted_capital_brand_cents == 2000000 — no 1.03 uplift, so revenue is not 309000000"
            - "OperatingBudget.${ef_bud}.budgeted_base_fee_cents == 9000000, budgeted_centralized_cents == 4500000 and budgeted_agop_cents == 86500000"
            - "OperatingBudget.${ef_bud}.decided_by_user_id == u-owner-1"
            - "a later POST /hotel-management/report-packages/{id}/submit for FY2026 is accepted because DEADLOCK_CARRYFORWARD counts as approved-equivalent"

      - name: centralized_allocation_deferral_versus_hard_cap
        claim_type: variant_divergence
        grounds:
          - calculations.centralized_services_allocation.variants
        excluded_because:
          difficulty_instance: boundary_precision_check / centralized_cap_exact_hit_versus_one_cent_over
          rationale: "The named §1.8 instance runs the same charge through both the hard_cap_rejection and deferral_truncation variants at the cap boundary."

      - name: provisional_monthly_versus_final_annual_incentive_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.annual_incentive_true_up
        excluded_because:
          difficulty_instance: dual_variant_calc / incentive_provisional_monthly_versus_final_annual_true_up
          rationale: "The named §1.8 instance reconciles the summed provisional accruals against the final annual figure and pins the signed delta."

  # =========================================================================
  # §1.4 Validations
  # =========================================================================
  - section: validations
    instances:
      - name: chargeback_with_deferral_but_no_supporting_detail_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors[ERR_CHARGEBACK_DETAIL_REQUIRED]
        distinguishing_aspect: "A charge posted with allow_deferral true but supporting_detail_provided false returns ERR_CHARGEBACK_DETAIL_REQUIRED with HTTP 422 and persists nothing; the identical body with the detail flag set is accepted."
        test_recipe:
          setup:
            - "One ACTIVE agreement with centralized_services_cap_pct 0.015 and an APPROVED FY2026 budget."
            - "One (2026, 9) package with gross revenue 26000000, so the period cap is 390000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Chargeback Detail Hotel", owner_entity_name: "Detail Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { cd_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${cd_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { cd_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${cd_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${cd_v2}" }
              as: HotelManagerOps
              captures: { cd_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${cd_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${cd_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${cd_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { cd_pkg: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/${cd_pkg}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 6000000, hotel_basis_share: 0.05, allow_deferral: true, supporting_detail_provided: false }
              as: HotelManagerOps
              captures: { cd_err: $.data.error_id }
            - call: "POST /hotel-management/report-packages/${cd_pkg}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 6000000, hotel_basis_share: 0.05, allow_deferral: true, supporting_detail_provided: true }
              as: HotelManagerOps
              captures: { cd_chg: $.data.id }
          assert:
            - "the first trigger returns HTTP 422 with error.error_id == ERR_CHARGEBACK_DETAIL_REQUIRED"
            - "the second trigger returns HTTP 201 and GET /hotel-management/report-packages/${cd_pkg}/centralized-charges reports pagination.total_count == 1"
            - "CentralizedServiceCharge.${cd_chg}.requested_amount_cents == 300000, allocated_amount_cents == 300000 and deferred_amount_cents == 0 — well inside the 390000 period cap"
            - "CentralizedServiceCharge.${cd_chg}.disclosure_status == DISCLOSED and MonthlyReportPackage.${cd_pkg}.allocated_centralized_cents == 300000"

      - name: working_capital_funding_must_match_the_call_amount_exactly
        claim_type: violation_to_error
        grounds:
          - validations[priority=47]
          - errors[ERR_FUNDING_AMOUNT_MISMATCH]
          - state_machines.WorkingCapitalCall.REQUESTED_to_FUNDED
        distinguishing_aspect: "Funding one cent under and one cent over both return ERR_FUNDING_AMOUNT_MISMATCH with HTTP 422; only the exact 500000 moves the call to FUNDED and credits the balance once."
        test_recipe:
          setup:
            - "One ACTIVE agreement with initial_working_capital_cents 0 and working_capital_floor_cents 0."
            - "One manager-raised FLOOR_RESTORATION WorkingCapitalCall of 500000 in status REQUESTED."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Exact Funding Hotel", owner_entity_name: "Funding Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, initial_working_capital_cents: 0, working_capital_floor_cents: 0, funding_due_days: 15 }
              as: PlatformAdmin
              captures: { fx_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${fx_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${fx_agr}/working-capital-calls"
              payload: { amount_cents: 500000, reason: "FLOOR_RESTORATION" }
              as: HotelManagerOps
              captures: { fx_call: $.data.id }
          trigger:
            - call: "POST /hotel-management/working-capital-calls/${fx_call}/fund"
              payload: { funded_amount_cents: 499999 }
              as: OwnerRep
              captures: { fx_err_low: $.data.error_id }
            - call: "POST /hotel-management/working-capital-calls/${fx_call}/fund"
              payload: { funded_amount_cents: 500001 }
              as: OwnerRep
              captures: { fx_err_high: $.data.error_id }
            - call: "POST /hotel-management/working-capital-calls/${fx_call}/fund"
              payload: { funded_amount_cents: 500000 }
              as: OwnerRep
          assert:
            - "both mismatching triggers return HTTP 422 with error.error_id == ERR_FUNDING_AMOUNT_MISMATCH"
            - "after the two rejections WorkingCapitalCall.${fx_call}.status is still REQUESTED with funded_amount_cents == 0 and ManagementAgreement.${fx_agr}.working_capital_balance_cents == 0"
            - "the exact funding returns HTTP 200 with WorkingCapitalCall.${fx_call}.status == FUNDED, funded_amount_cents == 500000 and late_funded == false"
            - "ManagementAgreement.${fx_agr}.working_capital_balance_cents == 500000 — credited exactly once"
            - "WorkingCapitalCall.${fx_call}.due_date_utc == 2026-08-16T00:00:00Z and auto_created == false"

      - name: charge_adjustment_above_the_allocated_amount_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=48]
          - errors[ERR_ADJUSTMENT_OUT_OF_RANGE]
          - state_machines.CentralizedServiceCharge.CONTESTED_to_ADJUSTED
        distinguishing_aspect: "An adjustment of 300001 against an allocated 300000 returns ERR_ADJUSTMENT_OUT_OF_RANGE with HTTP 422, while 250000 is inside the inclusive range and cascades into the package AGOP and the incentive accrual."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget, ffe_reserve_pct 0 and owner_priority_cents 12000000."
            - "One (2026, 9) package in financial_status SUBMITTED carrying a DISCLOSED 300000 RESERVATIONS charge, base_fee_cents 780000, agop_cents 19920000 and incentive_fee_provisional_cents 1892000."
            - "The owner side has contested the charge, so it is CONTESTED and its CENTRALIZED_SERVICES accrual is DISPUTED_HELD."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Adjust Range Hotel", owner_entity_name: "Adjust Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { ar_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${ar_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ar_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${ar_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${ar_v2}" }
              as: HotelManagerOps
              captures: { ar_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${ar_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${ar_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${ar_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { ar_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${ar_pkg}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 6000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { ar_chg: $.data.id }
            - call: "POST /hotel-management/report-packages/${ar_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/centralized-charges/${ar_chg}/review"
              payload: { action: "CONTEST", note: "reservation pool basis unexplained" }
              as: AssetManager
          trigger:
            - call: "POST /hotel-management/centralized-charges/${ar_chg}/review"
              payload: { action: "ADJUST", adjusted_amount_cents: 300001 }
              as: HotelManagerOps
              captures: { ar_err: $.data.error_id }
            - call: "POST /hotel-management/centralized-charges/${ar_chg}/review"
              payload: { action: "ADJUST", adjusted_amount_cents: 250000, note: "basis restated" }
              as: HotelManagerOps
          assert:
            - "the first trigger returns HTTP 422 with error.error_id == ERR_ADJUSTMENT_OUT_OF_RANGE and CentralizedServiceCharge.${ar_chg}.disclosure_status is still CONTESTED"
            - "the second trigger returns HTTP 200 with disclosure_status == ADJUSTED, allocated_amount_cents == 250000 and deferred_amount_cents == 50000"
            - "MonthlyReportPackage.${ar_pkg}.allocated_centralized_cents == 250000, agop_cents == 19970000 (was 19920000) and incentive_fee_provisional_cents == 1897000 (was 1892000)"
            - "the package's CENTRALIZED_SERVICES accrual is back in ACCRUED with amount_cents == 250000 and its INCENTIVE accrual amount_cents == 1897000"
            - "an adjustment of exactly 300000 would also be inside the inclusive range; only values above allocated_amount_cents or below 0 are refused"

      - name: reserve_funded_dispute_resolution_beyond_the_balance_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=46]
          - errors[ERR_INSUFFICIENT_RESERVE_BALANCE]
          - state_machines.BrandStandardDispute.MANAGER_RESPONDED_to_RESOLVED_OWNER_FUNDS
        distinguishing_aspect: "With an empty reserve, RESOLVE_OWNER_FUNDS against FFE_RESERVE returns ERR_INSUFFICIENT_RESERVE_BALANCE with HTTP 422, while the OWNER_CONTRIBUTION funding source raises a working capital call instead and leaves the ledger empty."
        test_recipe:
          setup:
            - "One ACTIVE agreement whose ffe_reserve_balance_cents is 0 because no distribution has executed."
            - "One BrandStandardDispute in MANAGER_RESPONDED with current_cost_estimate_cents 500000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Reserve Guard Hotel", owner_entity_name: "Reserve Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, funding_due_days: 15, max_dispute_rounds: 2, dispute_standstill_days: 45 }
              as: PlatformAdmin
              captures: { rg_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${rg_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${rg_agr}/brand-disputes"
              payload: { franchise_requirement_ref: "BRAND-STD-LOBBY-2026", estimated_cost_cents: 400000, remediation_start_utc: "2026-09-01T00:00:00Z", remediation_deadline_utc: "2026-12-01T00:00:00Z" }
              as: AssetManager
