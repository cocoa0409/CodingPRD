  # ===========================================================================
  # Rule 4: transitive_cascade — depth >= 3 and depth >= 2, different triggers.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: yes_vote_quorum_cascades_deal_approved
        grounds:
          - state_machines.ICMemo.UNDER_VOTE_to_APPROVED
          - state_machines.Deal.IC_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Depth-3 cascade: POST /vote creates ICVote -> ICMemo auto-transitions
          UNDER_VOTE -> APPROVED -> Deal auto-transitions IC_REVIEW ->
          APPROVED. Each link is caused by the previous link (vote triggers memo
          decision; memo decision triggers deal decision). Trigger is POST vote.
        test_recipe:
          setup:
            - "Deal D1 in IC_REVIEW with ICMemo M1 in UNDER_VOTE (reached via submit-underwriting, scenario compute, memo submit, submit-ic)"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-C1", deal_name: "Cascade", strategy: "CORE", target_purchase_price_cents: 500000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "5 Elm", market: "Denver", property_type: "OFFICE", units: 20, rentable_sqft: 50000, year_built: 2010 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 18, total_units: 20, gross_potential_rent_cents: 4000000, collected_rent_cents: 3600000, concessions_cents: 0, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 6000000 }
