  - rule_id: cross_entity_state_dependency
    instances:
      - name: document_approval_gated_by_child_adjusted_measure_state_through_two_distinct_errors
        grounds:
          - calculations.adjusted_measure_reconciliation
          - calculations.measure_gate_evaluation
          - state_machines.AdjustedMeasure.DRAFT_to_PROMINENCE_FAILED
          - state_machines.AdjustedMeasure.PROMINENCE_FAILED_to_RECONCILED
          - state_machines.DraftDocument.IN_REVIEW_to_APPROVED
          - validations[priority=25]
          - validations[priority=26]
        distinguishing_aspect: |
          The document's own fields never change, yet the same APPROVE request returns three different
          outcomes as a CHILD row walks its states: while the measure is DRAFT the gate reads
          BLOCKED_RECONCILIATION and APPROVE returns ERR_MEASURE_NOT_RECONCILED; after reconciliation
          with the non-GAAP figure presented ahead of the GAAP figure (adjusted_prominence_index 1 vs
          gaap_prominence_index 2) the measure lands PROMINENCE_FAILED, the gate reads
          BLOCKED_PROMINENCE and the same request returns ERR_MEASURE_PROMINENCE; only after the indices
          are swapped does the measure reach RECONCILED, the gate CLEARED and the approval succeed. The
          pinned precedence (reconciliation outranks prominence) is what separates the first two errors.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting FINANCE member and one ACTIVE voting LEGAL member."
            - "A ReportingCycle in CLOSE_OPEN with an EARNINGS_RELEASE DraftDocument authored by the FINANCE member, safe_harbor_present true, one MATCHED tie-out item so tie_out_status is PASSED, and no Q&A items."
            - "One AdjustedMeasure in DRAFT on that document: adjusted_value 890000.00, comparable_gaap_value 612000.00, reconciliation_items totalling 278000.00, adjusted_prominence_index 1, gaap_prominence_index 2."
            - "The document has been moved to IN_REVIEW."
