  # ===================================================================
  - rule_id: compensating_invariant
    instances:

      - name: grant_cents_conserved_across_allocation_commit_and_release
        grounds:
          - state_machines.FundingAllocation.COMMITTED_to_RELEASED
          - entities.GrantAward.fields.awarded_cents
          - entities.GrantAward.fields.committed_cents
          - entities.GrantAward.fields.spent_cents
          - entities.GrantAward.fields.available_cents
          - calculations.funding_allocation_amount
        distinguishing_aspect: |
          Conserved quantity: MONEY. The invariant
          awarded_cents == available_cents + committed_cents + spent_cents holds at
          500000 before the commitment, during it (488554 + 11446 + 0) and after the
          compensating release (500000 + 0 + 0), with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Hall A' with capacity 60."
            - "GrantAward with awarded_cents 500000, allowed_categories [REMEMBRANCE_EVENT], available_cents 500000, committed_cents 0, spent_cents 0, version 1."
            - "One PLANNED RemembranceEvent with direct_cost_cents 10220 -> program_cost_total_cents 11446."
            - "One COMMITTED FundingAllocation of 11446 cents against that event, leaving available_cents 488554 and committed_cents 11446."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Hall A", capacity: 60, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Hollis Foundation", award_reference: "HF-2026-INV", awarded_cents: 500000, allowed_categories: ["REMEMBRANCE_EVENT"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id, g_v1: $.data.version }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "Winter Remembrance", meeting_space_id: "${sp_id}", event_date: "2026-11-10", start_minute_utc: 600, duration_minutes: 60, expected_attendance: 20, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev_id: $.data.id }
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev_id}", expected_grant_award_version: "${g_v1}" }
              as: ProgramDirector
              captures: { alloc_id: $.data.id }
            - call: "GET /bereavement/grant-awards/${g_id}"
              payload: {}
              as: ProgramDirector
              captures: { avail_mid: $.data.available_cents, comm_mid: $.data.committed_cents }
          trigger:
            - call: "POST /bereavement/funding-allocations/${alloc_id}/release"
              payload: {}
              as: ProgramDirector
          assert:
            - "avail_mid == 488554"
            - "comm_mid == 11446"
            - "FundingAllocation.${alloc_id}.status == RELEASED"
            - "FundingAllocation.${alloc_id}.provisional_cents == 11446"
            - "FundingAllocation.${alloc_id}.settled_cents is null"
            - "GrantAward.${g_id}.awarded_cents == 500000"
            - "GrantAward.${g_id}.committed_cents == 0"
            - "GrantAward.${g_id}.spent_cents == 0"
            - "GrantAward.${g_id}.available_cents == 500000"
            - "GrantAward.${g_id}.awarded_cents == GrantAward.${g_id}.available_cents + GrantAward.${g_id}.committed_cents + GrantAward.${g_id}.spent_cents"

      - name: cohort_seat_pool_conserved_across_hold_confirm_and_withdraw
        grounds:
          - state_machines.Enrollment.HELD_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - entities.Cohort.fields.seats_total
          - entities.Cohort.fields.seats_open
          - entities.Cohort.fields.seats_held
          - entities.Cohort.fields.seats_filled
        distinguishing_aspect: |
          A different conserved quantity from the money invariant: SEATS. The identity
          seats_total == seats_open + seats_held + seats_filled holds at 4 before the
          hold (4+0+0), after the hold (3+1+0), after the confirmation (3+0+1) and
          after the compensating withdrawal (4+0+0).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20."
            - "Cohort with seats_total 4 and min_viable_enrollment 1, moved to OPEN_ENROLLMENT; seats_open 4, seats_held 0, seats_filled 0."
            - "One accepted Participant with a NEEDS Assessment."
            - "That Participant enrolled (seats_held 1, seats_open 3) and then CONFIRMED (seats_held 0, seats_filled 1, seats_open 3)."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Seat Conservation Group", loss_type: "PERINATAL", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id }
            - call: "POST /bereavement/cohorts/${c_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
              captures: { c_v_open: $.data.version }
            - call: "POST /bereavement/referrals"
              payload: { source_type: "HOSPICE", source_org_name: "Riverside Hospice", decedent_name: "Baby Nolan", date_of_death: "2026-07-01", relationship_to_deceased: "PARENT", loss_type: "PERINATAL", contact_name: "Ida Nolan", contact_email: "ida.nolan@example.org" }
              as: ReferralSource
              captures: { ref_s_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_s_id}/screen"
              payload: { eligibility_note: "in service area" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_s_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_s_id: $.data.id }
            - call: "POST /bereavement/participants/${p_s_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 20, isolation_index: 8, functional_impairment: 8, suicidality_flag: false }
              as: IntakeCoordinator
            - call: "POST /bereavement/enrollments"
              payload: { participant_id: "${p_s_id}", cohort_id: "${c_id}", expected_cohort_version: "${c_v_open}" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "GET /bereavement/cohorts/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { held_after_hold: $.data.seats_held, open_after_hold: $.data.seats_open }
            - call: "POST /bereavement/enrollments/${e_id}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /bereavement/cohorts/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { filled_after_confirm: $.data.seats_filled, open_after_confirm: $.data.seats_open }
          trigger:
            - call: "POST /bereavement/enrollments/${e_id}/withdraw"
              payload: { withdraw_reason: "PARTICIPANT_REQUEST" }
              as: IntakeCoordinator
          assert:
            - "held_after_hold == 1"
            - "open_after_hold == 3"
            - "filled_after_confirm == 1"
            - "open_after_confirm == 3"
            - "Enrollment.${e_id}.status == WITHDRAWN"
            - "Enrollment.${e_id}.withdraw_reason == PARTICIPANT_REQUEST"
            - "Cohort.${c_id}.seats_total == 4"
            - "Cohort.${c_id}.seats_open == 4"
            - "Cohort.${c_id}.seats_held == 0"
            - "Cohort.${c_id}.seats_filled == 0"
            - "Cohort.${c_id}.status == OPEN_ENROLLMENT"
