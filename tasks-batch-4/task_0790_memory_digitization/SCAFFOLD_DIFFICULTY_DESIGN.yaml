          - entities.Order.fields.refunded_total_cents
          - entities.DamageClaim.fields.payout_cents
        distinguishing_aspect: |
          Conserved quantity = CENTS. The claim payout is neither created nor destroyed: the amount
          credited to Customer.wallet_credit_cents equals the amount added to Order.refunded_total_cents
          equals payout_cents (4000). Formula: wallet_delta == refunded_delta == payout_cents.
