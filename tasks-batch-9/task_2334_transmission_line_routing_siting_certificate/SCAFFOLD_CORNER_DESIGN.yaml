  # ===========================================================================
  - section: rbac
    instances:

      - name: route_analyst_alone_runs_constraint_mapping
        claim_type: exclusive_operation_allowed
        grounds:
          - roles.RouteAnalyst.exclusive_operations
          - endpoints[POST /siting/routes/{routeId}/constraint-mapping].roles
        distinguishing_aspect: "Constraint mapping is exclusive to RouteAnalyst: the analyst's call succeeds and freezes both score variants on the route."
        test_recipe:
          setup:
            - "Route A DRAFT with three segments"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
          trigger:
            - call: "POST /siting/routes/${routeA}/constraint-mapping"
              payload: { mapping_note: "Corridor mapped by the analyst of record" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          assert:
            - "response.status == 201"
            - "Route.${routeA}.status == CONSTRAINT_MAPPED"
            - "Route.${routeA}.constraint_score_preliminary == 67.28"
            - "Route.${routeA}.constraint_score_certified == 69.58"

      - name: developer_running_constraint_mapping_unauthorized
        claim_type: unauthorized_operation_denied
        grounds:
          - roles.Developer.shared_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The Developer may create the route but not map it: the mapping call returns ERR_UNAUTHORIZED (403) at priority 2 and the route stays DRAFT with both score variants null."
        test_recipe:
          setup:
            - "Route A DRAFT with three segments"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
            - *c11
          trigger:
            - call: "POST /siting/routes/${routeA}/constraint-mapping"
              payload: { mapping_note: "Developer attempting the analyst step" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "Route.${routeA}.status == DRAFT"
            - "Route.${routeA}.constraint_score_preliminary == null"

      - name: compliance_monitor_alone_files_findings
        claim_type: exclusive_operation_allowed
        grounds:
          - roles.ComplianceMonitor.exclusive_operations
          - endpoints[POST /siting/nonconformances].roles
        distinguishing_aspect: "Filing findings belongs to the independent monitor alone: a MINOR finding on the weight-2 monitoring condition is accepted, deducts 4.80 and leaves the certificate ACTIVE at 95.20."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with three conditions"
          setup_api_calls: *cCERT
          trigger:
            - call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond2}", severity: "MINOR", observation: "Cultural monitor absent for one shift" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { ncr_ok: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Nonconformance.${ncr_ok}.status == OPEN"
            - "Nonconformance.${ncr_ok}.deduction_points == 4.80"
            - "CertificateCondition.${cond2}.status == VIOLATED"
            - "Certificate.${cert}.compliance_index_rolling == 95.20"
            - "Certificate.${cert}.posture == ACTIVE"

      - name: developer_filing_a_nonconformance_unauthorized
        claim_type: unauthorized_operation_denied
        grounds:
          - roles.ComplianceMonitor.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The certificate holder cannot self-report against itself: the Developer's filing is refused with ERR_UNAUTHORIZED (403) before any index math runs, so the condition stays ACTIVE at 100.00."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with three conditions"
          setup_api_calls: *cCERT
          trigger:
            - call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond2}", severity: "MINOR", observation: "Self-reported lapse" }
              as: Developer
              as_user_id: "dev-nora"
