  - rule_id: compensating_invariant
    instances:

      - name: reassign_conserves_district_wide_allocated_minutes
        grounds:
          - calculations.analyst_allocated_minutes
          - state_machines.DataPracticeReview.SCREENING_to_SCREENING
          - entities.PrivacyAnalyst.fields.allocated_review_minutes
          - endpoints[POST /data-practice-reviews/{reviewId}/reassign]
        distinguishing_aspect: |
          allocated_review_minutes is a conserved quantity: reassigning a review must
          move estimated_minutes off the outgoing analyst and onto the incoming one
          with the district-wide sum unchanged at 540. Because the rule mandates a
          FULL recompute over each analyst's non-terminal reviews rather than an
          incremental delta, an implementation that only adds to the target (or only
          subtracts from the source) breaks the invariant on this one call.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one vendor, one application, one teacher."
            - "Two analysts: AN1 (SENIOR, capacity 2400) and AN2 (LEAD, capacity 2400)."
            - "Two triaged requests on the same application."
            - "Review R1 (estimated_minutes 240) assigned to AN1 and review R2 (estimated_minutes 300) assigned to AN2, both in SCREENING. District-wide sum is 540."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Meridian Practice Labs", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Meridian Practice", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
