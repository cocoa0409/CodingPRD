            - "the very next call stores fu3 with 200 on the SAME warehouse version, at the same instant, for the same model: PO-CVM2 has no demand_bucket_id, so rungs 69 and 74 are skipped entirely — this is the with/without pair that makes the conditionality falsifiable"
            - "fu3 lands as the zone anchor with stored_footprint_cube_m3 1.0000, storage_zone_code Z-A and demand_bucket_id null; the bucket's build_ahead_committed_qty stays 0 because a bucket-less unit is never counted"
            - "at 2026-08-31T23:59:59Z the fu1 store still fails 409 ERR_BUILD_AHEAD_WINDOW_MISMATCH — one second before the window's inclusive first date is outside it, so the comparison is on the date and not on a fuzzy month"
            - "at 2026-09-01T00:00:00Z the byte-identical fu1 store returns 200: window_start_on is inclusive. fu1 nests behind fu3 at round(1.0000 * 0.5000, 4) == 0.5000 with is_zone_anchor false, and its demand_bucket_id is copied from PO-CVM1"
            - "the refused stores did not consume the warehouse version: ${wh_v2} was read before two attempts and is still accepted by the successful one, which proves no write occurred and that rung 69 precedes the OCC rung 82"
            - "the store of fu2 then fails 409 ERR_BUILD_AHEAD_CAP_EXCEEDED: inside the window the cap rung finally applies, and with build_ahead_committed_qty 1 against build_ahead_cap_qty floor(2 * 60.00 / 100) == 1 the test 1 + 1 <= 1 fails"
            - "the bucket closes at build_ahead_cap_qty 1 and build_ahead_committed_qty 1, counting fu1 only — the identical hull fu3 sitting in the same zone is invisible to it, which is the whole point of the conditional rung"

      # -----------------------------------------------------------------------
      # V16 — rung 27 applies only to HULL_DEFORMATION claims: 3.00 mm is
      # claimable, 2.99 is not, and other claim types are exempt.
      # -----------------------------------------------------------------------
      - name: val_conditional_deformation_threshold_applies_only_to_hull_deformation_claims
        claim_type: "Conditional validation"
        grounds:
          - validation_rules.priority_27
          - errors.ERR_DEFORMATION_BELOW_THRESHOLD
          - endpoints.POST_/warranty-claims
        distinguishing_aspect: "On the same delivered hull a HULL_DEFORMATION claim reporting 2.99 mm is refused 422 ERR_DEFORMATION_BELOW_THRESHOLD while 3.00 mm is accepted, and COSMETIC or HARDWARE claims are accepted with a smaller reading or with no reading at all — the rung is gated on claim_type, not on the presence of the field."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The PM-CVW base with site WH-CVA and customer CUS-CVW, who acknowledged the storage guidance at the delivery instant."
            - "Hulls fu1 and fu2 were produced, stored, shipped on SHP-CVW and DELIVERED at 2026-08-01T12:00:00Z."
            - "No warranty claim exists, so every claim_code below is free."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvW_pm
            - *cvW_mold
            - *cvW_oven
            - *cvW_bay
            - *cvA_wh
            - *cvW_cust
            - *cvW_lot
            - *cvW_po
            - *cvW_release
            - *cvW_cycle
            - *cvW_charge
            - *cvB_clk_0900
            - *cvW_start
            - *cvB_clk_1000
            - *cvW_cool
            - *cvB_clk_1035
            - *cvW_demold
            - *cvW_units
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_inspect2
            - *cvW_get_wh1
            - *cvW_store1
            - *cvW_get_wh2
            - *cvW_store2
            - *cvW_shp
            - *cvW_line1
            - *cvW_get_shp1
            - *cvW_line2
            - *cvW_clk_1100
            - *cvW_seal
            - *cvW_clk_1130
            - *cvW_depart
            - *cvW_clk_1200
            - *cvW_deliver
            - *cvW_ack
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T12:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-1", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 2.99, storage_description: "slight hull flat spot" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-2", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.00, storage_description: "hull flat spot measured at the threshold" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clm2: $.data.id }
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-3", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "COSMETIC", storage_description: "gelcoat chalking, no deformation measured" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clm3: $.data.id }
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-4", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "COSMETIC", reported_deformation_mm: 1.00, storage_description: "cosmetic claim that happens to report a reading" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clm4: $.data.id }
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-5", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "HARDWARE", reported_deformation_mm: 2.00, storage_description: "rudder fitting failure" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clm5: $.data.id }
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-6", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", storage_description: "deformation alleged but not measured" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVD-2", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 5.00, storage_description: "reusing an existing claim code" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /warranty-claims?customer_id=${cust}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
          assert:
            - "CLM-CVD-1 fails 422 ERR_DEFORMATION_BELOW_THRESHOLD at 2.99 mm and CLM-CVD-2 succeeds at 3.00 mm: the comparison is >= DEFORMATION_THRESHOLD_MM 3.00 with equality claimable, so one hundredth of a millimetre separates a claim from a refusal"
            - "CLM-CVD-3 (COSMETIC, reported_deformation_mm omitted entirely) returns 201 — the field is optional in the endpoint input and rung 27 does not apply to this claim type"
            - "CLM-CVD-4 (COSMETIC carrying reported_deformation_mm 1.00, far below the threshold) also returns 201: the rung is gated on claim_type, not on whether the field is present, so an implementation that checked the number whenever it was supplied would wrongly reject this claim"
            - "CLM-CVD-5 (HARDWARE at 2.00 mm) returns 201 for the same reason, which pins the exemption to more than one non-deformation claim type"
            - "CLM-CVD-6 (HULL_DEFORMATION with no reading at all) fails 422 ERR_DEFORMATION_BELOW_THRESHOLD: a claim of that type cannot satisfy 'reports reported_deformation_mm >= 3.00' when it reports nothing, so absence is a violation of rung 27 rather than a schema error"
            - "the replay of claim_code CLM-CVD-2 on the other hull fails 409 ERR_DUPLICATE_CODE (rung 26) even though its 5.00 mm reading clears rung 27 — the duplicate-code rung sits above the threshold rung and answers first"
            - "GET /warranty-claims?customer_id=${cust} returns total_count 4 — CLM-CVD-2, CLM-CVD-3, CLM-CVD-4 and CLM-CVD-5 — so the three refusals created nothing and CLM-CVD-1 and CLM-CVD-6 remain free codes"
            - "every accepted claim reads claim_status SUBMITTED, storage_review_status NOT_STARTED, months_in_service null and every money field null: rung 27 is evaluated at creation, long before any pricing"

