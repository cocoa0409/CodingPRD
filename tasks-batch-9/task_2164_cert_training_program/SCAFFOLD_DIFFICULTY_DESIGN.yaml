  - rule_id: non_linear_state_machine
    instances:
      - name: trainee_enrollment_and_currency_dimensions_advance_independently
        grounds:
          - state_machines.Trainee.enrollment_status.ENROLLED_to_GRADUATED
          - state_machines.Trainee.currency_status.CURRENT_to_LAPSED
          - state_machines.Credential.ACTIVE_to_SUSPENDED
          - state_machines.Credential.SUSPENDED_to_ACTIVE
          - state_machines.Trainee.enrollment_status.GRADUATED_to_WITHDRAWN
        distinguishing_aspect: |
          Non-linear shape #1 is PARALLEL STATE DIMENSIONS on the Trainee row: enrollment_status and
          currency_status are two independent axes. Suspending the credential moves currency_status
          CURRENT -> LAPSED while enrollment_status stays GRADUATED, and withdrawing the trainee moves
          enrollment_status GRADUATED -> WITHDRAWN while currency_status stays CURRENT.
        test_recipe:
          setup:
            - "Tara GRADUATED with an ACTIVE credential, so enrollment_status is GRADUATED and currency_status is CURRENT"
            - "No equipment on issue and no roster commitments, so the withdrawal preconditions hold"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
