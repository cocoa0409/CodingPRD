            - "the first call does NOT return error_id \"ERR_ROLE_SLOT_NOT_ELIGIBLE\""
            - "HTTP 422 on the third trigger call"
            - "the third trigger call returns error_id == \"ERR_ROLE_SLOT_NOT_ELIGIBLE\""
            - "enc_v == 1 and LaborEncounter.${enc_id}.version == 1 after both rejections"
            - "LaborEncounter.${enc_id}.staffing_state == \"UNASSIGNED\""
            - "ShiftAssignment.${shift_charge}.assigned_acuity_load_units == 0.0"

      - name: duplicate_patient_record_code_collides_only_while_the_first_encounter_is_non_terminal
        claim_type: Violation → Error
        grounds:
          - validations[priority=13.1]
          - errors[ERR_DUPLICATE_PATIENT_RECORD_CODE]
          - endpoints[POST /labor-encounters]
          - endpoints[POST /labor-encounters/{encounterId}/transfer-out]
          - entities.LaborEncounter.fields.patient_record_code
        distinguishing_aspect: |
          The uniqueness scope in §1.4 has two qualifiers that a database UNIQUE index cannot express:
          it is per unit_id, and it only ranges over encounters in NON-TERMINAL labor phases. An
          implementation that adds a plain unique constraint passes the collision half of this test
          and then permanently locks the record code out — a readmission of the same patient after a
          transfer-out becomes impossible. The trigger therefore checks both directions with the same
          literal code: collide while the first encounter is ANTEPARTUM, then succeed once that
          encounter is TRANSFERRED_OUT. A second unit reusing the code concurrently proves the
          per-unit scoping in the same pass.
        test_recipe:
          setup: |
            Two units, each with one AVAILABLE LDR bed and no encounters. The clock is pinned so the
            admitted_at stamps are deterministic.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_a: $.data.id }
            - call: POST /obstetric-units/${unit_a}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_a_1: $.data.id }
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center Annex", licensed_ldr_beds: 2, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_b: $.data.id }
            - call: POST /obstetric-units/${unit_b}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_b_1: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_a}", patient_record_code: "PRC-UNIQUE-1301", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_first: $.data.id }
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_a}", patient_record_code: "PRC-UNIQUE-1301", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { dup_err: $.data.error_id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_b}", patient_record_code: "PRC-UNIQUE-1301", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_other_unit: $.data.id }
            - call: POST /labor-encounters/${enc_first}/transfer-out
              payload: {}
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_a}", patient_record_code: "PRC-UNIQUE-1301", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_readmit: $.data.id }
          assert:
            - "HTTP 409 on the first trigger call"
            - "the first trigger call returns error_id == \"ERR_DUPLICATE_PATIENT_RECORD_CODE\""
            - "HTTP 201 on the second trigger call (same code, different unit)"
            - "HTTP 201 on the fourth trigger call (same code, same unit, predecessor terminal)"
            - "LaborEncounter.${enc_first}.labor_phase == \"TRANSFERRED_OUT\""
            - "LaborEncounter.${enc_first}.required_coverage_units == 0.0"
            - "LaborEncounter.${enc_readmit}.labor_phase == \"ANTEPARTUM\""
            - "LaborEncounter.${enc_readmit}.admitted_at == \"2026-08-01T06:00:00Z\""
            - "enc_readmit != enc_first and enc_other_unit != enc_first"

      - name: invalid_gestational_age_at_priority_5_outranks_the_past_booking_start_at_priority_14_2
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=14.2]
          - errors[ERR_INVALID_FIELD_VALUE]
          - errors[ERR_BOOKING_START_IN_PAST]
          - endpoints[POST /induction-bookings]
          - entities.InductionBooking.fields.expected_labor_minutes
          - calculations.induction_priority_class
        distinguishing_aspect: |
          Priority 5 is field-shape and 14.2 is business-temporal, and the gap between them is nine
          rungs — yet both are evaluated on the same body of the same request, so an implementation
          that folds "requested_start_utc must be in the future" into its field validator (the natural
          place for it, since it is a single-field predicate) will answer ERR_BOOKING_START_IN_PAST
          for a request whose gestational_age_weeks is also out of the declared 20..44 range. The
          second call then pins the strictness of the temporal comparison itself: requested_start_utc
          EXACTLY equal to clock_now is in the past for this rule (the constraint is > clock_now, not
          >=), while one second later is accepted. The accepted call also proves the 720-minute
          expected_labor_minutes default and that projected_occupancy_minutes stays null until a hold.
        test_recipe:
          setup: |
            One unit and nothing else — POST /induction-bookings runs priorities 1, 2, 4, 5 and 14.2
            only, so no beds, staff or posture are involved and no rung between 5 and 14.2 is armed.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
          trigger:
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-BOOK-1420", gestational_age_weeks: 19, indication_code: "ELECTIVE_NO_INDICATION", requested_start_utc: "2026-07-31T12:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { field_err: $.data.error_id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-BOOK-1420", gestational_age_weeks: 39, indication_code: "ELECTIVE_NO_INDICATION", requested_start_utc: "2026-08-01T06:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { temporal_err: $.data.error_id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-BOOK-1420", gestational_age_weeks: 39, indication_code: "ELECTIVE_NO_INDICATION", requested_start_utc: "2026-08-01T06:00:01Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_id: $.data.id }
          assert:
            - "HTTP 400 on the first trigger call"
            - "the first trigger call returns error_id == \"ERR_INVALID_FIELD_VALUE\""
            - "the first trigger call does NOT return error_id \"ERR_BOOKING_START_IN_PAST\""
            - "HTTP 422 on the second trigger call"
            - "the second trigger call returns error_id == \"ERR_BOOKING_START_IN_PAST\""
            - "HTTP 201 on the third trigger call"
            - "InductionBooking.${booking_id}.status == \"REQUESTED\""
            - "InductionBooking.${booking_id}.priority_class == \"ELECTIVE_39_WEEK\""
            - "InductionBooking.${booking_id}.expected_labor_minutes == 720"
            - "InductionBooking.${booking_id}.projected_occupancy_minutes == null"
            - "InductionBooking.${booking_id}.bump_count == 0"
            - "InductionBooking.${booking_id}.version == 1"

      - name: empty_measure_denominator_at_priority_16_outranks_the_still_open_reporting_period
        claim_type: Priority Ordering
        grounds:
          - validations[priority=16]
          - errors[ERR_EMPTY_MEASURE_DENOMINATOR]
          - errors[ERR_MEASURE_PERIOD_NOT_CLOSED]
          - endpoints[POST /obstetric-units/{unitId}/quality-measure-snapshots]
          - endpoints[POST /quality-measure-snapshots/{snapshotId}/certify]
          - entities.QualityMeasureSnapshot.fields.composite_quality_index
        distinguishing_aspect: |
          Priority 16 bundles three reporting-completeness checks behind one rung, and §1.4 fixes
          their internal order: denominators first, then the closed period, then non-terminal bundles.
          A window that is entirely in the future violates the first two simultaneously, and the
          cheap check for an implementer is the date comparison (period_end_utc <= clock_now) rather
          than counting a cohort — so answering ERR_MEASURE_PERIOD_NOT_CLOSED is the likely bug. The
          same call also pins §1.4's empty-collection boundary note: a DRAFT snapshot over an empty
          cohort is creatable and readable with both denominators 0, both rates null and a null
          composite, but is never certifiable. Certification is attempted by a DIFFERENT officer id
          than the one that created the snapshot so that the priority-10 segregation rung cannot fire
          ahead of 16 and mask the result.
        test_recipe:
          setup: |
            One unit with no beds, no staff and no encounters, and one DRAFT snapshot over the future
            window [2026-09-01, 2026-10-01) taken while the clock reads 2026-08-01T06:00Z — so the
            delivery cohort is empty AND the period is still open. The unit's version is read from the
            creation response for the OCC guard on the snapshot POST.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: POST /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z", expected_unit_version: "${unit_v}" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-01"
              captures: { snapshot_id: $.data.id }
          trigger:
            - call: POST /quality-measure-snapshots/${snapshot_id}/certify
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-02"
              captures: { reporting_err: $.data.error_id }
            - call: GET /quality-measure-snapshots/${snapshot_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-02"
          assert:
            - "HTTP 409 on the certify call"
            - "error_id == \"ERR_EMPTY_MEASURE_DENOMINATOR\""
            - "error_id != \"ERR_MEASURE_PERIOD_NOT_CLOSED\""
            - "error_id != \"ERR_SEGREGATION_OF_DUTIES_VIOLATION\""
            - "HTTP 200 on the GET (an uncertifiable DRAFT is still readable)"
            - "QualityMeasureSnapshot.${snapshot_id}.status == \"DRAFT\""
            - "QualityMeasureSnapshot.${snapshot_id}.attribution_basis == \"DELIVERY_COHORT\""
            - "QualityMeasureSnapshot.${snapshot_id}.ntsv_cesarean_numerator == 0"
            - "QualityMeasureSnapshot.${snapshot_id}.ntsv_cesarean_denominator == 0"
            - "QualityMeasureSnapshot.${snapshot_id}.episiotomy_numerator == 0"
            - "QualityMeasureSnapshot.${snapshot_id}.episiotomy_denominator == 0"
            - "QualityMeasureSnapshot.${snapshot_id}.ntsv_cesarean_rate_pct == null"
            - "QualityMeasureSnapshot.${snapshot_id}.episiotomy_rate_pct == null"
            - "QualityMeasureSnapshot.${snapshot_id}.shadow_ntsv_rate_pct == null"
            - "QualityMeasureSnapshot.${snapshot_id}.composite_quality_index == null"
            - "QualityMeasureSnapshot.${snapshot_id}.certified_at == null"
            - "QualityMeasureSnapshot.${snapshot_id}.certified_by_user_id == null"

      - name: discharge_blocker_order_returns_the_open_newborn_review_before_the_checked_in_pass
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8.04]
          - errors[ERR_NEWBORN_REVIEW_OPEN]
          - errors[ERR_SUPPORT_PASS_STILL_PRESENT]
          - errors[ERR_CARE_ASSIGNMENT_STILL_ACTIVE]
          - endpoints[POST /labor-encounters/{encounterId}/discharge]
          - state_machines.LaborEncounter.labor_phase
        distinguishing_aspect: |
          Priority 8.04 is a single rung that hides an ORDERED list of four sub-checks, and §1.5 states
          the order verbatim: open newborn reviews, then non-terminal bundles, then still-present
          support passes, then a staffing_state that is not RELEASED. Three of the four are armed here
          at once (an OPEN review, a CHECKED_IN partner pass, and an ACTIVE one-to-one assignment), so
          any implementation that iterates its blocking children in schema order, alphabetical order,
          or "cheapest query first" order will surface the wrong error_id while still correctly
          refusing the discharge. Only naming the expected id and the two suppressed ids distinguishes
          a correct implementation from a merely conservative one. The review's facilitator is the OB
          attending precisely because §1.1 forbids a facilitator who ever held a CareAssignment on the
          encounter, and the drill is validated by a third user id so the priority-10 rung stays quiet.
        test_recipe:
          setup: |
            One unit with two LDR beds. A DECISION_TO_INCISION drill is documented at a 10-minute
            decision-to-incision (inside the 30-minute pass ceiling) and VALIDATED, which lifts
            cesarean_readiness_state off NOT_READY to DEGRADED — there is no ACTIVE OR_STANDBY shift,
            and DEGRADED is enough for the SECOND_STAGE advance. One ADVANCED-cert nurse on a BEDSIDE
            shift covers the encounter ONE_TO_ONE (debit == capacity_units_effective == 4.0, so the
            staffing axis is ONE_TO_ONE_COVERED at every phase). The encounter is walked all the way to
            POSTPARTUM_RECOVERY on a SPONTANEOUS_VAGINAL delivery, which releases LDR-01 to TURNOVER
            and leaves LDR-02 as the spare AVAILABLE bed so the posture never reaches DIVERT. Finally a
            PARTNER pass is checked in and a newborn review is opened, leaving three of the four
            8.04 sub-checks violated simultaneously.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
