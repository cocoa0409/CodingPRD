      - name: transaction_in_future_rejected_temporal
        claim_type: Temporal validation
        grounds: ['validations[priority=10]', 'errors[ERR_TEMPORAL_OUT_OF_RANGE]']
        distinguishing_aspect: "A transaction with transacted_at after the server clock is rejected with ERR_TEMPORAL_OUT_OF_RANGE 422."
        test_recipe:
          setup: ["ACTIVE account; clock at 2026-07-05T00:00:00Z."]
