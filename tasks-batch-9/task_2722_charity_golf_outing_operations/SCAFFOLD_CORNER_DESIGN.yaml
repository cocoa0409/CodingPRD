      - name: course_handicap_clamps_at_zero_and_at_the_thirty_six_stroke_cap
        claim_type: Constants Applied
        grounds:
          - calculations.course_handicap_conversion.constants
          - calculations.course_handicap_conversion.precision
        distinguishing_aspect: "Both clamps of MAX_COURSE_HANDICAP 36 and the max(0, ...) floor in one fixture, on a deliberately extreme course (slope 155, rating 76.0, par 71): a 30.0 index converts to a raw 46.15 that is capped at 36, while a 0.0 index on the same card would go negative on a short course and is floored at 0."
        test_recipe:
          setup:
            - "An OPEN outing on a contract with slope_rating 155, course_rating 76.0 and par 71 - raw = index * (155/113) + 5.0."
            - "A second OPEN outing on a contract with slope_rating 113, course_rating 68.0 and par 72 - raw = index - 4.0."
            - "One CONFIRMED registration on each, one player each."
