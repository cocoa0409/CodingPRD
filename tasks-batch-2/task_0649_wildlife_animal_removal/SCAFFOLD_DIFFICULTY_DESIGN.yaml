scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_total_provisional_vs_final_cost_domain
        grounds:
          - calculations.quote_provisional_total
          - calculations.quote_final_total
          - entities.Quote.fields.provisional_total_cents
          - entities.Quote.fields.final_total_cents
          - state_machines.Quote.SENT_to_ACCEPTED
        distinguishing_aspect: |
          Cost-accounting domain on the Quote: provisional sums ALL line items at send
          (41000) while final sums only performed lines at close (30000); the two
          differ because TRAP2 was never set, so final < provisional by 11000.
        test_recipe:
          setup:
            - "A COMPLETED inspection with two entry points; a non-emergency quote with 2 TRAP lines + 1 EXCLUSION line, sent (provisional=41000) then accepted (work order open)."
            - "Only TRAP1 trap is SET-then-relocated and the EXCLUSION repair completed; TRAP2 is never set. Work order auto-closes; final=30000."
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "Acme", contact_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Raccoon", code: "RACCOON_A", is_regulated: false, relocation_min_miles: 5, relocation_max_miles: 25, base_trap_fee_cents: 4000, risk_weight: 2.0 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tess", license_tier: "CERTIFIED", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z", is_emergency: false }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "NE soffit", severity: "MAJOR", estimated_individuals: 4 }
              as: Dispatcher
              captures: { ep1_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "SW vent", severity: "MODERATE", estimated_individuals: 3 }
              as: Dispatcher
              captures: { ep2_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 3, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 2, unit_price_cents: 5500 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "EXCLUSION", quantity: 2, unit_price_cents: 9000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/trap-placements"
              payload: { species_id: "${sp_id}", technician_id: "${tech_id}", window_start: "2026-04-03T09:00:00Z", window_end: "2026-04-03T10:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { trap1_id: $.data.id }
            - call: "POST /trap-placements/${trap1_id}/captures"
              payload: { captured_at: "2026-04-03T12:00:00Z", release_latitude: 40.145, release_longitude: -75.0 }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/exclusion-repairs"
              payload: { entry_point_id: "${ep1_id}", sanitation_included: false }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/exclusion-repairs"
              payload: { entry_point_id: "${ep2_id}", sanitation_included: false }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { rep2_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/exclusion-repairs/${rep1_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/exclusion-repairs/${rep2_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
          assert:
            - "Quote.${quote_id}.provisional_total_cents == 41000"
            - "Quote.${quote_id}.final_total_cents == 30000"
            - "WorkOrder.${wo_id}.lifecycle == CLOSED"

      - name: infestation_risk_initial_vs_residual_risk_domain
        grounds:
          - calculations.infestation_risk_score
          - entities.WorkOrder.fields.initial_risk_score
          - entities.WorkOrder.fields.residual_risk_score
          - entities.EntryPoint.fields.seal_status
        distinguishing_aspect: |
          Risk-scoring domain on the WorkOrder (different entity from the cost domain):
          initial over ALL entry points = 48.0 at accept; residual over only OPEN entry
          points = 42.0 at close because EP2 (the +6.0 MODERATE contributor) is sealed.
        test_recipe:
          setup:
            - "Same accept-time state as the cost instance: EP1 (regulated species, individuals 4, MAJOR) and EP2 (non-regulated species, individuals 3, MODERATE); work order open."
            - "Only EP1 sealed? No — only EP2 sealed, EP1 left open; both traps resolved so removal CLEARED; EP2's repair completes to seal it, EP1's repair NOT completed so EP1 stays OPEN; force close via EP1 completion last."
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "Acme2", contact_email: "b@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Bat", code: "BAT_R", is_regulated: false, relocation_min_miles: 0, relocation_max_miles: 50, base_trap_fee_cents: 4000, risk_weight: 2.0 }
              as: ComplianceOfficer
              captures: { sp_reg_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Mouse", code: "MOUSE_N", is_regulated: false, relocation_min_miles: 0, relocation_max_miles: 50, base_trap_fee_cents: 4000, risk_weight: 1.0 }
              as: ComplianceOfficer
              captures: { sp_n_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tom", license_tier: "CERTIFIED", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z", is_emergency: false }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_reg_id}", location_label: "attic", severity: "MAJOR", estimated_individuals: 4 }
              as: Dispatcher
              captures: { ep1_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_n_id}", location_label: "garage", severity: "MODERATE", estimated_individuals: 3 }
              as: Dispatcher
              captures: { ep2_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_reg_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_reg_id}", line_type: "EXCLUSION", quantity: 1, unit_price_cents: 9000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id, risk_init: $.data.initial_risk_score }
            - call: "POST /work-orders/${wo_id}/trap-placements"
              payload: { species_id: "${sp_reg_id}", technician_id: "${tech_id}", window_start: "2026-04-03T09:00:00Z", window_end: "2026-04-03T10:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { trap1_id: $.data.id }
            - call: "POST /trap-placements/${trap1_id}/pull"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/exclusion-repairs"
              payload: { entry_point_id: "${ep2_id}", sanitation_included: false }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { rep2_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/exclusion-repairs/${rep2_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
          assert:
            - "WorkOrder.${wo_id}.initial_risk_score == 48.0"
            - "WorkOrder.${wo_id}.residual_risk_score == 42.0"
            - "WorkOrder.${wo_id}.lifecycle == CLOSED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_round_then_sum_emergency_order_pinned_mode_b
        grounds:
          - calculations.quote_provisional_total
          - entities.Quote.fields.emergency_flag
          - entities.Quote.fields.provisional_total_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: three identical emergency lines each raw
          126.50 cents. Round-then-sum (pinned) = 381; sum-then-round = 380. The
          pinned order yields 381, falsifiable against the 380 alternative.
        test_recipe:
          setup:
            - "An emergency COMPLETED inspection; a quote with three TRAP lines, each quantity 1 unit_price_cents 110, sent (surcharge 1.15 applies)."
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "Em", contact_email: "e@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Skunk", code: "SKUNK_E", is_regulated: false, relocation_min_miles: 0, relocation_max_miles: 50, base_trap_fee_cents: 110, risk_weight: 1.0 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T22:00:00Z", is_emergency: true }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "deck", severity: "MINOR", estimated_individuals: 1 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 110 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 110 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 110 }
              as: Dispatcher
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Quote.${quote_id}.emergency_flag == true"
            - "Quote.${quote_id}.provisional_total_cents == 381"

      - name: infestation_risk_weighted_nonlinear_mode_a
        grounds:
          - calculations.infestation_risk_score
          - entities.WorkOrder.fields.initial_risk_score
          - entities.SpeciesProfile.fields.is_regulated
          - entities.SpeciesProfile.fields.risk_weight
          - entities.EntryPoint.fields.severity
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: per-EP score = individuals * risk_weight
          * SEV[severity], with a x1.5 regulated branch and a global min() cap. Distinct
          from mode (b): EP1 = 4*2.0*3.5*1.5 = 42.0, EP2 = 3*1.0*2.0 = 6.0, total 48.0.
        test_recipe:
          setup:
            - "A COMPLETED inspection with EP1 (regulated species risk_weight 2.0, individuals 4, MAJOR) and EP2 (non-regulated risk_weight 1.0, individuals 3, MODERATE); quote sent then accepted, computing initial_risk_score."
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "RiskCo", contact_email: "r@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Fox", code: "FOX_R", is_regulated: true, relocation_min_miles: 5, relocation_max_miles: 25, base_trap_fee_cents: 4000, risk_weight: 2.0 }
              as: ComplianceOfficer
              captures: { sp_reg_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Rat", code: "RAT_N", is_regulated: false, relocation_min_miles: 0, relocation_max_miles: 50, base_trap_fee_cents: 4000, risk_weight: 1.0 }
              as: ComplianceOfficer
              captures: { sp_n_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Cara", license_tier: "CERTIFIED", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z", is_emergency: false }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_reg_id}", location_label: "attic", severity: "MAJOR", estimated_individuals: 4 }
              as: Dispatcher
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_n_id}", location_label: "shed", severity: "MODERATE", estimated_individuals: 3 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_reg_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id, risk_init: $.data.initial_risk_score }
          assert:
            - "WorkOrder.${wo_id}.initial_risk_score == 48.0"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_sent_back_to_draft
        grounds:
          - state_machines.Quote.SENT_to_REVISION_REQUESTED
          - state_machines.Quote.REVISION_REQUESTED_to_DRAFT
          - state_machines.Quote.DRAFT_to_SENT
        distinguishing_aspect: |
          Cyclic shape on Quote: DRAFT->SENT->REVISION_REQUESTED->DRAFT closes a loop;
          after reopen the quote is DRAFT again and re-sendable, proving the back-edge.
        test_recipe:
          setup:
            - "A COMPLETED inspection with a quote holding one TRAP line; quote sent to the owner."
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "Cyc", contact_email: "c@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Opossum", code: "OPOSSUM_C", is_regulated: false, relocation_min_miles: 0, relocation_max_miles: 50, base_trap_fee_cents: 4000, risk_weight: 1.0 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z", is_emergency: false }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "porch", severity: "MINOR", estimated_individuals: 1 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/request-revision"
              payload: {}
              as: PropertyOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /quotes/${quote_id}/reopen"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { st2: $.data.status }
          assert:
            - "Quote.${quote_id}.status == SENT"

      - name: work_order_parallel_removal_and_exclusion_dimensions
        grounds:
          - state_machines.WorkOrder.OPEN_to_OPEN
          - entities.WorkOrder.fields.removal_status
          - entities.WorkOrder.fields.exclusion_status
        distinguishing_aspect: |
          Parallel-dimensions shape on WorkOrder (different entity from Quote): removal_status
          (PENDING->TRAPPING->CLEARED) and exclusion_status (PENDING->SEALING->SEALED) advance
          independently — after a trap pull removal=CLEARED while exclusion still PENDING.
        test_recipe:
          setup:
            - "An OPEN work order (non-regulated species) with one entry point; one trap SET."
          setup_api_calls:
            - call: "POST /service-accounts"
              payload: { account_name: "Par", contact_email: "p@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct_id}", latitude: 40.0, longitude: -75.0 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /species-profiles"
              payload: { common_name: "Squirrel", code: "SQ_P", is_regulated: false, relocation_min_miles: 0, relocation_max_miles: 50, base_trap_fee_cents: 4000, risk_weight: 1.0 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Pat", license_tier: "BASIC", kit_trap_capacity: 5 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /properties/${prop_id}/inspections"
              payload: { scheduled_for: "2026-04-02T09:00:00Z", is_emergency: false }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/entry-points"
              payload: { species_id: "${sp_id}", location_label: "eave", severity: "MINOR", estimated_individuals: 1 }
              as: Dispatcher
            - call: "POST /properties/${prop_id}/inspections/${insp_id}/complete"
              payload: {}
              as: Dispatcher
              captures: { insp_v: $.data.version }
            - call: "POST /quotes"
              payload: { inspection_id: "${insp_id}", expected_inspection_version: "${insp_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { species_id: "${sp_id}", line_type: "TRAP", quantity: 1, unit_price_cents: 4000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: { assigned_technician_id: "${tech_id}" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/trap-placements"
              payload: { species_id: "${sp_id}", technician_id: "${tech_id}", window_start: "2026-04-03T09:00:00Z", window_end: "2026-04-03T10:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { trap1_id: $.data.id }
          trigger:
            - call: "POST /trap-placements/${trap1_id}/pull"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
          assert:
            - "WorkOrder.${wo_id}.removal_status == CLEARED"
            - "WorkOrder.${wo_id}.exclusion_status == PENDING"
            - "WorkOrder.${wo_id}.lifecycle == OPEN"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: quote_accept_cascade_to_workorder_permit_posture_depth4
        grounds:
          - state_machines.Quote.SENT_to_ACCEPTED
          - entities.WorkOrder.fields.initial_risk_score
          - entities.Permit.fields.status
          - entities.Property.fields.posture
        distinguishing_aspect: |
          Depth-4 chain from quote accept: ACCEPT -> creates WorkOrder (L1) -> WorkOrder
          creation triggers initial_risk_score compute (L2) -> regulated EP triggers a
          Permit(REQUESTED) creation (L3) -> Permit creation flips Property.posture to
          REGULATORY_HOLD (L4). Each link is caused by the previous, not by the accept.
        test_recipe:
          setup:
