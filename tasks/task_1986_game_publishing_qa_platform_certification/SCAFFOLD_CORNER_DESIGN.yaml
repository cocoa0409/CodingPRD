        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / release_window_half_open_adjacency
          rationale: "Asserted as the straddling-window leg of the named §1.8 instance."

      - name: err_vendor_capacity_trigger_covered
