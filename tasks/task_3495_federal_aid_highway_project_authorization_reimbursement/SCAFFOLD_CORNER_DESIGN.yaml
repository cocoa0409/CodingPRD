  # ===========================================================================
  - section: endpoints
    instances:
      - name: error_envelope_shape_on_failure
        claim_type: retrieval
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Every failure body carries response_type error with data.error_id and data.message, plus meta.api_request_id and meta.api_request_timestamp — verified on a 404."
        test_recipe:
          setup: ["Clock set; nothing else."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /federal-aid/stips/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: StateDOTPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with response_type == error"
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: success_envelope_carries_meta_and_object_type
        claim_type: retrieval
        grounds:
          - response_envelope.success
        distinguishing_aspect: "A single-resource GET returns response_type object with the entity under data and a populated meta block."
        test_recipe:
          setup: ["One STIP exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "GET /federal-aid/stips/${stip_id}"
              payload: {}
              as: StateDOTEngineer
              captures: { st: $.data.status }
          assert:
            - "the response is 200 with response_type == object"
            - "data.id == ${stip_id} and data.status == PUBLIC_INVOLVEMENT"
            - "meta.api_request_id and meta.api_request_timestamp are present"

