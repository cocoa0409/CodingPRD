      - name: campaign_budget_conserved_across_launch_and_cancellation
        grounds:
          - invariants.campaign_budget_conservation
          - state_machines.EducationCampaign.PLANNED_to_RUNNING
          - state_machines.EducationCampaign.RUNNING_to_CANCELLED
          - calculations.campaign_station_allocation_cents
          - entities.InspectionStation.fields.campaign_allocated_cents
        distinguishing_aspect: |
          Conserved quantity: allocated campaign money. The forward action splits
          100000 cents across three candidate stations as 33334 / 33333 / 33333 -
          the one-cent remainder going to the FIRST station in the pinned
          created_at order - and the compensating action debits each station by
          exactly the amount recorded in station_allocations, not by a recomputed
          share. Because the CLOSED station is excluded from the candidate filter
          and the PLANNED and SUSPENDED ones are included, a cancellation that
          recomputes instead of replaying the recorded allocations lands the odd
          cent somewhere else and leaves a station at -1 or +1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no InspectionRecord exists at all, so every candidate weight is 1 + 0 == 1 and total_weight is 3."
            - "WaterBody 'Tongue River' with four stations created in this order: S1 'Tongue A' moved to OPEN, S2 'Tongue B' left PLANNED, S3 'Tongue C' moved OPEN then SUSPENDED, S4 'Tongue D' moved PLANNED -> CLOSED (all four are WATERBODY_ACCESS stations on the same water body, so only status distinguishes them)."
            - "EducationCampaign 'Clean Drain Dry 2026' targeting that water body, window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), budget_cents 100000, launched to RUNNING so station_allocations reads S1 33334, S2 33333, S3 33333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Tongue River", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "MODERATE", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Tongue A", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { s1: $.data.id }
            - call: "POST /inspection-stations/${s1}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${s1}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspection-stations"
              payload: { name: "Tongue B", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { s2: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Tongue C", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { s3: $.data.id }
            - call: "POST /inspection-stations/${s3}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${s3}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${s3}/status"
              payload: { target_status: "SUSPENDED", reason: "staffing gap" }
              as: ProgramAdmin
            - call: "POST /inspection-stations"
              payload: { name: "Tongue D", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 0, hot_water_capable: false, seal_stock_initial_count: 0 }
              as: ProgramAdmin
              captures: { s4: $.data.id }
            - call: "POST /inspection-stations/${s4}/status"
              payload: { target_status: "CLOSED", reason: "corridor discontinued" }
              as: ProgramAdmin
            - call: "POST /education-campaigns"
              payload: { name: "Clean Drain Dry 2026", target_water_body_id: "${wb_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z", budget_cents: 100000, evaluation_method: "PRE_POST" }
              as: ProgramAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /education-campaigns/${camp_id}/status"
              payload: { target_status: "RUNNING" }
              as: ProgramAdmin
          trigger:
            - call: "POST /education-campaigns/${camp_id}/status"
              payload: { target_status: "CANCELLED", reason: "budget rescinded by the legislature" }
              as: ProgramAdmin
          assert:
            - "before the trigger EducationCampaign.${camp_id}.station_allocations == [{${s1}: 33334}, {${s2}: 33333}, {${s3}: 33333}] in the pinned created_at order, summing to exactly 100000"
            - "before the trigger InspectionStation campaign_allocated_cents read ${s1} 33334, ${s2} 33333, ${s3} 33333 and ${s4} 0 (the CLOSED station is not a candidate)"
            - "after the trigger EducationCampaign.${camp_id}.status == CANCELLED and station_allocations == []"
            - "after the trigger campaign_allocated_cents is 0 on all four stations, including the station that carried the extra cent"
            - "the invariant holds at both instants: the sum of campaign_allocated_cents over all stations equals the sum of budget_cents over campaigns in {RUNNING, EVALUATED} - 100000 before, 0 after"
            - "InspectionStation.${s2}.status == PLANNED and InspectionStation.${s3}.status == SUSPENDED are unchanged by allocation and de-allocation"

      - name: fee_ledger_conserved_when_an_abandonment_refunds_the_treatment_charge
        grounds:
          - invariants.fee_ledger_conservation
          - state_machines.DeconOrder.TREATED_to_ABANDONED
          - calculations.inspection_total_fee_cents
          - entities.InspectionStation.fields.collected_fees_cents
          - entities.InspectionStation.fields.refunded_fees_cents
        distinguishing_aspect: |
          Conserved quantity: the station fee ledger. The refund must reverse the
          treatment-attributable portion EXACTLY - decon_fee_cents 22050 plus
          surcharge_cents 1228, i.e. 23278 - leaving collected_fees_cents at the
          2500 inspection fee that would have stood had no treatment happened. The
          surcharge is the trap: it was created by the treatment (the subtotal
          crossed the 10000-cent tier), so refunding only decon_fee_cents leaves
          1228 cents of phantom revenue, while zeroing total_fee_cents instead of
          booking fee_refunded_cents breaks the second half of the invariant, which
          requires refunded_fees_cents to equal the sum of fee_refunded_cents.
        test_recipe:
          setup:
            - "Station 'Fresno B Access' OPEN, hot_water_capable, decon_bay_count 1, collected_fees_cents 0 and refunded_fees_cents 0."
            - "Inspector 'Ada Field' ACTIVE LEVEL_1; 'Bo Tech' ACTIVE DECON_CERTIFIED; 'Cy Verify' ACTIVE LEVEL_2."
            - "InspectionRecord screened at 65 (HIGH) and dispositioned DECON: total_fee_cents 2500 and station collected_fees_cents 2500."
            - "DeconOrder treated at 2026-08-05T09:00:00Z with 140 F / 3000 psi / 2940 s: decon_fee_cents 450 * ceil(2940/60) = 22050, subtotal 24550, surcharge 1228 at the 5 percent tier, total_fee_cents 25778, station collected_fees_cents 25778; treated_at 2026-08-05T09:49:00Z and status TREATED."
            - "Logical clock left at 2026-08-05T09:49:00Z, well before dry_until 2026-08-06T03:49:00Z, which outcome ABANDON is exempt from."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Fresno B", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "HIGH", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Fresno B Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Bo Tech", home_station_id: "${st_id}", decon_endorsement: true }
              as: ProgramAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /inspectors/${insp_b}/training-records"
              payload: { module_code: "AIS-DECON-200", hours: 40, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Cy Verify", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_c: $.data.id }
            - call: "POST /inspectors/${insp_c}/training-records"
              payload: { module_code: "AIS-QA-300", hours: 40, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-9900", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 20 }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T08:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_id: $.data.id }
            - call: "POST /inspection-records/${rec_id}/screening"
              payload: { expected_watercraft_version: "${wc_v}", residual_water_present: true, standing_water_ml: 500, prior_water_body_id: "${wb_id}" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection-records/${rec_id}/disposition"
              payload: { disposition: "DECON" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_v: $.data.version }
            - call: "POST /decon-orders"
              payload: { inspection_record_id: "${rec_id}", expected_inspection_record_version: "${rec_v}" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { do_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /decon-orders/${do_id}/treatment"
              payload: { water_temp_f: 140, pressure_psi: 3000, dwell_seconds: 2940 }
              as: DeconTechnician
              as_user_id: "${insp_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:49:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /decon-orders/${do_id}/dry-verification"
              payload: { outcome: "ABANDON", notes: "owner surrendered the vessel for disposal" }
              as: ReleaseVerifier
              as_user_id: "${insp_c}"
          assert:
            - "before the trigger InspectionRecord.${rec_id} reads decon_fee_cents 22050, surcharge_cents 1228, total_fee_cents 25778, fee_refunded_cents 0, and InspectionStation.${st_id} reads collected_fees_cents 25778 and refunded_fees_cents 0"
            - "DeconOrder.${do_id}.status == ABANDONED (the dry-time gate does not apply to ABANDON at 2026-08-05T09:49:00Z)"
            - "InspectionRecord.${rec_id}.fee_refunded_cents == 23278 (22050 + 1228)"
            - "InspectionRecord.${rec_id}.total_fee_cents == 25778, unchanged - the refund is booked, not erased"
            - "InspectionStation.${st_id}.collected_fees_cents == 2500 and refunded_fees_cents == 23278"
            - "the invariant holds: collected_fees_cents 2500 == total_fee_cents 25778 - fee_refunded_cents 23278, and refunded_fees_cents equals the sum of fee_refunded_cents over the station's records"
            - "InspectionRecord.${rec_id}.inspection_status == DECON_FAILED_ABANDONED"
            - "Watercraft.${wc_id}.mandatory_decon_flag == false and last_decon_verified_at == null (an abandonment is not a verification)"

      - name: compliance_strikes_conserved_when_a_referral_is_dismissed
        grounds:
          - invariants.compliance_strike_conservation
          - state_machines.InspectionRecord.REFERRED_to_DISMISSED
          - entities.Watercraft.fields.compliance_strikes
          - entities.Watercraft.fields.watchlist_status
          - entities.Watercraft.fields.mandatory_decon_flag
        distinguishing_aspect: |
          Conserved quantity: the strike count on a vessel, which must always equal
          the number of that vessel's records in {REFERRED, CITED}. The
          compensating action has to unwind a THREE-level derivation, not just a
          counter: strikes 2 -> 1, watchlist_status WATCHLISTED -> CLEAR because 1
          is below WATCHLIST_STRIKE_THRESHOLD, and mandatory_decon_flag true ->
          false because the vessel is no longer watchlisted. The surviving strike
          comes from a DIFFERENT record whose referral is untouched, so an
          implementation that zeroes the count or that leaves the flag latched
          fails while the two-record ledger still looks plausible.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T09:00:00Z."
            - "WaterBody 'Ackley' risk_tier LOW, infestation_status CLEAN; station 'Ackley Access' OPEN; Inspector 'Ada Field' ACTIVE LEVEL_1."
            - "Watercraft MT-9950 with record A screened at risk_score 5 (LOW) and dispositioned REFUSE, which cascades enforcement NONE -> REFERRED with referral_reason INSPECTION_REFUSAL: strike 1, watchlist_status CLEAR, mandatory_decon_flag false."
            - "Record B for the same vessel screened at risk_score 5 and then referred explicitly by the enforcement officer with referral_reason DECON_EVASION: strike 2, watchlist_status WATCHLISTED, mandatory_decon_flag true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Ackley Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "LOW", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Ackley Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-9950", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 14 }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_a: $.data.id }
            - call: "POST /inspection-records/${rec_a}/screening"
              payload: { expected_watercraft_version: "${wc_v0}", residual_water_present: false, standing_water_ml: 0, prior_water_body_id: "${wb_id}" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection-records/${rec_a}/disposition"
              payload: { disposition: "REFUSE" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "GET /watercraft/${wc_id}"
              payload: {}
              as: ProgramAdmin
              captures: { wc_v1: $.data.version }
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T11:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_b: $.data.id }
            - call: "POST /inspection-records/${rec_b}/screening"
              payload: { expected_watercraft_version: "${wc_v1}", residual_water_present: false, standing_water_ml: 0, prior_water_body_id: "${wb_id}" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /inspection-records/${rec_b}/enforcement"
              payload: { action: "REFER", referral_reason: "DECON_EVASION", agency_code: "MTFWP" }
              as: EnforcementOfficer
              as_user_id: "eo-1"
          trigger:
            - call: "POST /inspection-records/${rec_b}/enforcement"
              payload: { action: "DISMISS", notes: "hearing officer vacated the referral" }
              as: EnforcementOfficer
              as_user_id: "eo-1"
          assert:
            - "before the trigger Watercraft.${wc_id}.compliance_strikes == 2, watchlist_status == WATCHLISTED and mandatory_decon_flag == true, matching two records in {REFERRED, CITED}"
            - "InspectionRecord.${rec_b}.enforcement_status == DISMISSED and penalty_cents == 0"
            - "Watercraft.${wc_id}.compliance_strikes == 1"
            - "Watercraft.${wc_id}.watchlist_status == CLEAR (1 is below WATCHLIST_STRIKE_THRESHOLD 2)"
            - "Watercraft.${wc_id}.mandatory_decon_flag == false"
            - "InspectionRecord.${rec_a}.enforcement_status == REFERRED with referral_reason INSPECTION_REFUSAL, and its inspection_status is still REFUSED"
            - "the invariant holds: compliance_strikes 1 == the count of this vessel's records in {REFERRED, CITED}, which is exactly ${rec_a}"
            - "InspectionRecord.${rec_b}.inspection_status == SCREENED, untouched by the enforcement dimension"
