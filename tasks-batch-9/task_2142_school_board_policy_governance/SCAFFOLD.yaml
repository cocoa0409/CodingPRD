      - "calculations.manual_publication_snapshot writes pinned_entries, entry_count, compliance_gap_count and certification_state"
      - "status BUILDING -> PUBLISHED; published_at stamped"
      - "every other PUBLISHED edition transitions to SUPERSEDED with superseded_by_label set"

  # ---- Ops-run checkpoint --------------------------------------------------
  - method: POST
    path: "/governance/compliance-sweeps"
    description: "Run the governance compliance sweep against the current logical clock: mark overdue mandates, expire elapsed waivers, expire elapsed trustee terms, recompute every policy posture, and re-certify published manual editions."
    roles: [BoardClerk, LegalUpdateService]
    code: 200
    input: []
    output: { mandates_marked_overdue: integer, waivers_expired: integer, members_term_expired: integer, policies_recomputed: integer, publications_lapsed: integer }
    side_effects:
      - "LegalMandate rows past compliance_deadline transition OPEN/IN_PROGRESS -> OVERDUE"
      - "WaiverRequest rows past granted_end_date transition GRANTED -> EXPIRED and withdraw their live agenda items"
      - "BoardMember rows past term_end_date transition SEATED -> TERM_EXPIRED and lose their committee seats"
      - "calculations.policy_compliance_state runs sweep_scoped over every policy in code ASC order"
      - "PUBLISHED ManualPublication rows recompute compliance_gap_count and flip certification_state"
      - "counter semantics: mandates_marked_overdue counts mandates this sweep moved INTO OVERDUE; waivers_expired counts waivers this sweep moved INTO EXPIRED; members_term_expired counts trustees this sweep moved INTO TERM_EXPIRED; policies_recomputed counts every Policy whose phase-2 block ran (all of them); publications_lapsed counts PUBLISHED editions whose certification_state is LAPSED AFTER the sweep, whether or not this sweep flipped them"

  # ---- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at exactly 2026-08-01T00:00:00Z on server start and NEVER falls back to real wall-clock time; every deadline, notice-lead, window and expiry rule in this scaffold is evaluated against this logical clock alone."
    roles: [BoardClerk]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "no entity is mutated; the sweep must be invoked explicitly to act on the new clock position"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role outside the RBAC matrix."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: "An entity_backed role's X-User-ID does not match the trustee the operation acts for, or a BoardPresident caller is not the SEATED trustee holding office == PRESIDENT."

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum member, out-of-range number, malformed ISO 8601 instant, or a conditionally-required field supplied in the wrong combination."

  # --- existence ---
  - id: ERR_BOARD_MEMBER_NOT_FOUND
    http: 404
    condition: "A BoardMember id in the path or body does not resolve."
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "A Committee id in the path or body does not resolve."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "A CommitteeAssignment id in the path does not resolve."
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "A ConflictDisclosure id in the path does not resolve."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "A Policy id in the path or body does not resolve."
  - id: ERR_POLICY_VERSION_NOT_FOUND
    http: 404
    condition: "A PolicyVersion id in the path or body does not resolve."
  - id: ERR_MANDATE_NOT_FOUND
    http: 404
    condition: "A LegalMandate id in the path does not resolve."
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "A Meeting id in the path or body (including approving_meeting_id) does not resolve."
  - id: ERR_AGENDA_ITEM_NOT_FOUND
    http: 404
    condition: "An AgendaItem id in the path does not resolve."
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "A WaiverRequest id in the path or body does not resolve."
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "A SuperintendentEvaluation id in the path or body does not resolve."
  - id: ERR_PUBLICATION_NOT_FOUND
    http: 404
    condition: "A ManualPublication id in the path does not resolve."

  # --- optimistic concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_policy_version or expected_meeting_version does not equal the parent's current version field."

  # --- uniqueness ---
  - id: ERR_DUPLICATE_POLICY_CODE
    http: 409
    condition: "Another Policy already carries the submitted code."
  - id: ERR_DUPLICATE_NOTICE_CODE
    http: 409
    condition: "Another LegalMandate already carries the submitted notice_code."
  - id: ERR_DUPLICATE_PUBLICATION_LABEL
    http: 409
    condition: "Another ManualPublication already carries the submitted publication_label."
  - id: ERR_DUPLICATE_EVALUATION_CYCLE
    http: 409
    condition: "Another SuperintendentEvaluation already covers the submitted cycle_year."
  - id: ERR_DUPLICATE_SEAT_NUMBER
    http: 409
    condition: "Another SEATED BoardMember already occupies the submitted seat_number, or another SEATED trustee already holds office == PRESIDENT."
  - id: ERR_DUPLICATE_ASSIGNMENT
    http: 409
    condition: "The trustee already holds a CommitteeAssignment with status IN {ACTIVE, RECUSED} on this committee, or the committee already has an ACTIVE CHAIR."
  - id: ERR_DUPLICATE_RATING
    http: 409
    condition: "The trustee already submitted a rating for this (evaluation_id, domain, phase) triple."

  # --- state preconditions ---
  - id: ERR_INVALID_MEETING_STATE
    http: 409
    condition: "The meeting is not in the status this action requires (notice needs DRAFT, open needs NOTICED, adjourn needs OPEN)."
  - id: ERR_MEETING_NOT_OPEN
    http: 409
    condition: "A vote was recorded against an agenda item whose parent meeting is not OPEN."
  - id: ERR_INVALID_MINUTES_STATE
    http: 409
    condition: "action == DRAFT on minutes that are not NOT_DRAFTED, action == APPROVE on minutes that are not DRAFTED, or a DRAFT action on a meeting that has not adjourned."
  - id: ERR_AGENDA_ITEM_NOT_POSTED
    http: 409
    condition: "A vote was recorded against an agenda item whose status is not POSTED."
  - id: ERR_POLICY_VERSION_NOT_ELIGIBLE
    http: 409
    condition: "The linked PolicyVersion is not in the status the item type requires -- DRAFT for a first reading, FIRST_READING_PASSED for a second reading -- or a withdraw was attempted on a version that is already ADOPTED, SUPERSEDED or WITHDRAWN."
  - id: ERR_WAIVER_NOT_IN_REVIEW
    http: 409
    condition: "A committee recommendation was recorded on a waiver whose status is not SUBMITTED, a WAIVER_DECISION item was built on a waiver whose status is not SUBMITTED or BOARD_PENDING, a WAIVER_DECISION vote was recorded on a waiver whose status is not BOARD_PENDING, or a revoke was attempted on a waiver whose status is not GRANTED."
  - id: ERR_EVALUATION_STAGE_INVALID
    http: 409
    condition: "The requested advance action is not declared from the evaluation's current status."
  - id: ERR_PUBLICATION_ALREADY_PUBLISHED
    http: 409
    condition: "Publish was called on an edition whose status is not BUILDING."
  - id: ERR_MEMBER_NOT_SEATED
    http: 409
    condition: "The trustee's status is not SEATED where the operation requires a sitting trustee (resign, rating submission, attendance, reinstatement)."
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "RECUSE on a seat that is not ACTIVE, REINSTATE on a seat that is not RECUSED, or REMOVE on a seat that is already REMOVED."
  - id: ERR_DISCLOSURE_ALREADY_CLEARED
    http: 409
    condition: "Clear was called on a ConflictDisclosure whose status is already CLEARED."
  - id: ERR_COMMITTEE_INQUORATE
    http: 409
    condition: "The reviewing committee's status is INQUORATE, so it cannot record a recommendation."
  - id: ERR_PUBLIC_COMMENT_CLOSED
    http: 409
    condition: "A speaker card was filed against a meeting whose status is not DRAFT or NOTICED."

  # --- open-meeting safety ---
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "scheduled_start_utc minus the logical clock is strictly less than NOTICE_LEAD_HOURS for the meeting type."
  - id: ERR_RECUSED_MEMBER_VOTED
    http: 422
    condition: "A trustee holding a RECUSAL_REQUIRED disclosure on the item's policy appears in one of the three vote arrays."
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "Attendance at open, or votes cast plus recusals at the vote, is below Meeting.quorum_required."
  - id: ERR_MINUTES_NOT_APPROVED
    http: 422
    condition: "A second reading was attempted while the first-reading meeting's minutes_status is not APPROVED."
  - id: ERR_SECOND_READING_SAME_MEETING
    http: 422
    condition: "A second reading was attempted at the same meeting that held the first reading."
  - id: ERR_VOTER_NOT_IN_ATTENDANCE
    http: 422
    condition: "A trustee id in one of the vote arrays is absent from the meeting's frozen attending_member_ids."

  # --- temporal ---
  - id: ERR_AGENDA_LOCKED
    http: 422
    condition: "An item was added to a meeting whose agenda_locked_at is already set."
  - id: ERR_WAIVER_WINDOW_OVERLAP
    http: 409
    condition: "A live waiver for the same policy and school already covers part of the requested half-open window."
  - id: ERR_MEETING_SEPARATION_VIOLATION
    http: 409
    condition: "Another live meeting on the same calendar starts strictly within MEETING_SEPARATION_MINUTES of the requested start."
  - id: ERR_MEETING_NOT_YET_DUE
    http: 422
    condition: "Open was called before the meeting's scheduled_start_utc."
  - id: ERR_INVALID_APPROVING_MEETING
    http: 422
    condition: "approving_meeting_id names the same meeting, or a meeting that is not scheduled strictly later."

  # --- capacity / tally constraints ---
  - id: ERR_INVALID_WAIVER_WINDOW
    http: 422
    condition: "The requested waiver window is shorter than one whole day."
  - id: ERR_WAIVER_DURATION_EXCEEDS_CAP
    http: 422
    condition: "The requested waiver window is longer than WAIVER_MAX_DAYS for the policy's legal_requirement_level."
  - id: ERR_DUPLICATE_VOTER
    http: 422
    condition: "A trustee id appears more than once across the three vote arrays."
  - id: ERR_COMMITTEE_SEATS_FULL
    http: 409
    condition: "Committee.vacant_seat_count is zero."
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "The four evaluation rubric weights do not sum to exactly 1.00."

  # --- referential eligibility ---
  - id: ERR_VERSION_ON_LIVE_AGENDA
    http: 409
    condition: "Withdraw was attempted on a version still referenced by a PROPOSED or POSTED agenda item."
  - id: ERR_NO_ADOPTED_POLICIES
    http: 422
    condition: "Publish was attempted while no Policy has status == ADOPTED."
  - id: ERR_NO_RATINGS_SUBMITTED
    http: 422
    condition: "MIDYEAR or ADOPT was attempted with rating_count == 0, or ADOPT with eligible_rater_count == 0."

  # --- public comment ---
  - id: ERR_PUBLIC_COMMENT_NOT_PERMITTED
    http: 422
    condition: "The meeting's public_comment_minutes_budget is zero (EMERGENCY meetings), or the item's requires_public_comment is false."
  - id: ERR_SPEAKER_LIMIT_REACHED
    http: 422
    condition: "The agenda item already holds MAX_SPEAKERS_PER_ITEM (5) speaker cards in status REQUESTED or GRANTED."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:

  - name: BoardClerk
    description: "Secretary to the board. Builds the record: seats trustees, charters committees, schedules and notices meetings, builds agendas, adjourns, drafts and approves minutes, opens evaluation cycles and runs the compliance sweep. May never record a vote and may never draft policy text."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/board-members"
      - "POST /governance/board-members/{id}/resign"
      - "POST /governance/committees"
      - "POST /governance/committee-assignments"
      - "POST /governance/committee-assignments/{id}/status"
      - "POST /governance/meetings"
      - "POST /governance/meetings/{id}/notice"
      - "POST /governance/meetings/{id}/adjourn"
      - "POST /governance/meetings/{id}/minutes"
      - "POST /governance/agenda-items"
      - "POST /governance/superintendent-evaluations"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /governance/agenda-items/{id}/public-comments (shared with Public)"
      - "POST /governance/compliance-sweeps (shared with LegalUpdateService)"
      - "every GET in the governance surface"

  - name: BoardPresident
    description: "The SEATED trustee holding office == PRESIDENT. Presides: calls meetings to order, records roll-call votes, clears conflict disclosures and advances the superintendent evaluation cycle. Segregation of duties: the president may not build the agenda they will preside over, and may not draft the policy text they will call to a vote."
    identity: "entity_backed:BoardMember"
    exclusive_operations:
      - "POST /governance/meetings/{id}/open"
      - "POST /governance/agenda-items/{id}/record-vote"
      - "POST /governance/conflict-disclosures/{id}/clear"
      - "POST /governance/superintendent-evaluations/{id}/advance"
    shared_operations:
      - "POST /governance/waiver-requests/{id}/revoke (shared with Superintendent)"
      - "every GET in the governance surface"

  - name: BoardMember
    description: "A sitting trustee. Files their own conflict disclosures, submits their own rubric ratings, and -- when holding an ACTIVE CHAIR seat on the reviewing committee -- records that committee's waiver recommendation. Segregation of duties: a trustee whose disclosure on a policy is RECUSAL_REQUIRED cannot be counted in any vote on that policy."
    identity: "entity_backed:BoardMember"
    exclusive_operations:
      - "POST /governance/conflict-disclosures"
      - "POST /governance/evaluation-ratings"
      - "POST /governance/waiver-requests/{id}/committee-recommendation"
    shared_operations:
      - "every GET in the governance surface"

  - name: PolicyAnalyst
    description: "Staff drafter and manual editor. Registers policy shells, drafts versions, withdraws versions, and builds and publishes manual editions. Segregation of duties: never votes, never presides, never touches the meeting record."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/policies"
      - "POST /governance/policy-versions/{id}/withdraw"
      - "POST /governance/manual-publications"
      - "POST /governance/manual-publications/{id}/publish"
    shared_operations:
      - "POST /governance/policies/{id}/versions (shared with Superintendent)"
      - "every GET in the governance surface"

  - name: Superintendent
    description: "The chief executive the board evaluates. May propose policy text and revoke granted waivers. Segregation of duties: may never submit an EvaluationRating and may never advance their own evaluation cycle."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /governance/policies/{id}/versions (shared with PolicyAnalyst)"
      - "POST /governance/waiver-requests/{id}/revoke (shared with BoardPresident)"
      - "every GET in the governance surface except the public-only reads"

  - name: SchoolPrincipal
    description: "Site administrator who asks the board for policy exceptions on behalf of one school."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/waiver-requests"
    shared_operations:
      - "the public-record GETs: policies, policy versions, meetings, agenda items, public comments, waiver requests, conflict disclosures, manual publications"

  - name: LegalUpdateService
    description: "The subscription feed that files dated statutory mandates against tracked policies. Operational identity, not a person."
    identity: "opaque"
    exclusive_operations:
      - "POST /governance/legal-mandates"
    shared_operations:
      - "POST /governance/compliance-sweeps (shared with BoardClerk)"
      - "the legal-mandate reads and the public-record GETs"

  - name: Public
    description: "Any member of the community exercising open-meeting rights: reads the public record and files speaker cards."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /governance/agenda-items/{id}/public-comments (shared with BoardClerk)"
      - "the public-record GETs: policies, policy versions, meetings, agenda items, public comments, waiver requests, conflict disclosures, manual publications"
