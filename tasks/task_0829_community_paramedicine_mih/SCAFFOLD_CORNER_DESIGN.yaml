scaffold_corner_design:
  # ------------------------------------------------------------------ #
  # Entities                                                            #
  # ------------------------------------------------------------------ #
  - section: entities
    instances:
      - name: patient_create_computes_risk_tier_high
        claim_type: computed_fields
        grounds:
          - entities.Patient.fields.risk_score
          - entities.Patient.fields.risk_tier
          - calculations.patient_risk_score
        distinguishing_aspect: "baseline 8, chronic 3, 0 admissions -> risk_score = 8*2 + 3*3 = 25 -> risk_tier HIGH; client-supplied risk fields (if any) are ignored."
        test_recipe:
          setup: ["No fixtures; logical clock at default 2026-03-01."]
          setup_api_calls:
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000001" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /mih/patients"
              payload: { full_name: "Pat RiskHigh", date_of_birth: "1950-01-01", baseline_ed_visits_12mo: 8, chronic_conditions_count: 3 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
          assert:
            - "Patient.${pat_id}.risk_score == 25"
            - "Patient.${pat_id}.risk_tier == HIGH"

      - name: patient_consent_defaults_false
        claim_type: defaults
        grounds:
          - entities.Patient.fields.consent_on_file
        distinguishing_aspect: "Omitting consent_on_file applies the default false."
        test_recipe:
          setup: ["No fixtures."]
          setup_api_calls:
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000011" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /mih/patients"
              payload: { full_name: "Pat NoConsent", date_of_birth: "1951-01-01", baseline_ed_visits_12mo: 2, chronic_conditions_count: 0 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
          assert:
            - "Patient.${pat_id}.consent_on_file == false"

      - name: get_patient_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Patient
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent patient UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No fixtures."]
          setup_api_calls: []
          trigger:
            - call: "GET /mih/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CareCoordinator
              as_user_id: "op-coord"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_referral_missing_required_program_returns_400
        claim_type: required_fields
        grounds:
          - endpoints
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /mih/referrals without required program_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000021" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat X", date_of_birth: "1952-01-01", baseline_ed_visits_12mo: 2, chronic_conditions_count: 0 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "HTTP status == 400"

  # ------------------------------------------------------------------ #
  # State machines                                                      #
  # ------------------------------------------------------------------ #
  - section: state_machines
    instances:
      - name: screen_referral_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Referral.SUBMITTED_to_SCREENED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Screening a referral already in SCREENED is rejected with ERR_INVALID_STATE; no re-snapshot of risk tier."
        test_recipe:
          setup: ["A referral screened once (now SCREENED)."]
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "Pay", payer_type: "MEDICARE" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "C1", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000031" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat Y", date_of_birth: "1953-01-01", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: complete_home_visit_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.HomeVisit.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing an already-COMPLETED visit is rejected with ERR_INVALID_STATE; vitals not overwritten twice."
        test_recipe:
          setup: ["Enrollment ACTIVE, care plan ACTIVE, one visit already COMPLETED."]
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "Pay", payer_type: "MEDICARE" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "C2", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000041" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1200000042" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Para", provider_type: "PARAMEDIC", npi: "1200000043" }
              as: ProgramAdmin
              captures: { para_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat Z", date_of_birth: "1954-01-01", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "MODERATE", authoring_clinician_id: "${clin_id}", goals: "x", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /mih/home-visits"
              payload: { enrollment_id: "${enr_id}", care_plan_id: "${cp_id}", provider_id: "${para_id}", scheduled_start: "2026-03-20T10:00:00Z", scheduled_end: "2026-03-20T11:00:00Z" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { hv_id: $.data.id }
            - call: "POST /mih/home-visits/${hv_id}/complete"
              payload: { systolic_bp: 130, diastolic_bp: 80, heart_rate: 72 }
              as: Paramedic
              as_user_id: "${para_id}"
          trigger:
            - call: "POST /mih/home-visits/${hv_id}/complete"
              payload: { systolic_bp: 200, diastolic_bp: 120, heart_rate: 150 }
              as: Paramedic
              as_user_id: "${para_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # ------------------------------------------------------------------ #
  # Endpoints (OCC + pagination)                                        #
  # ------------------------------------------------------------------ #
  - section: endpoints
    instances:
      - name: careplan_create_stale_enrollment_version_occ
        claim_type: occ_conflict
        grounds:
          - concurrency_rules[careplan-create-stale-enrollment]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After plan A bumps Enrollment.version 1->2, creating plan B with the stale expected_enrollment_version (1) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Enrollment accepted (version 1). Plan A created with expected_enrollment_version 1 (advances version to 2)."]
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "Pay", payer_type: "MEDICARE" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "C3", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000051" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1200000052" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat OCC", date_of_birth: "1955-01-01", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "MODERATE", authoring_clinician_id: "${clin_id}", goals: "plan A", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_a_id: $.data.id }
          trigger:
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "MODERATE", authoring_clinician_id: "${clin_id}", goals: "plan B", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: list_enrollments_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "With two enrollments under a program and limit=1, GET /mih/enrollments returns total_count=2 and has_more=true."
        test_recipe:
          setup: ["Two ACTIVE enrollments under the same program."]
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "Pay", payer_type: "MEDICARE" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "C4", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000061" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat A1", date_of_birth: "1956-01-01", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat1_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /mih/referrals/${ref1_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref1_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/patients"
              payload: { full_name: "Pat A2", date_of_birth: "1957-01-01", baseline_ed_visits_12mo: 4, chronic_conditions_count: 1 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat2_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat2_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /mih/referrals/${ref2_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref2_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /mih/enrollments?program_id=${prog_id}&limit=1&offset=0"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
          assert:
            - "response.meta present; response_type == array"
            - "data length == 1; total_count == 2; has_more == true"

  # ------------------------------------------------------------------ #
  # Validations (business errors not covered by §1.8)                   #
  # ------------------------------------------------------------------ #
  - section: validations
    instances:
      - name: activate_high_plan_without_cosigner_returns_cosign_required
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_COSIGN_REQUIRED]
        distinguishing_aspect: "Activating a HIGH-risk care plan with no cosigner_clinician_id returns ERR_COSIGN_REQUIRED (422)."
        test_recipe:
          setup: ["Enrollment ACTIVE with a HIGH-risk DRAFT care plan lacking a cosigner."]
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "Pay", payer_type: "MEDICARE" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "C5", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000071" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1200000072" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat HI", date_of_birth: "1958-01-01", baseline_ed_visits_12mo: 9, chronic_conditions_count: 4 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "HIGH", authoring_clinician_id: "${clin_id}", goals: "complex", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COSIGN_REQUIRED"
            - "HTTP status == 422"

      - name: activate_high_plan_same_cosigner_returns_sod_error
        claim_type: conditional_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_COSIGN_SAME_CLINICIAN]
        distinguishing_aspect: "A HIGH-risk plan whose cosigner_clinician_id equals authoring_clinician_id fails activation with ERR_COSIGN_SAME_CLINICIAN (segregation of duties)."
        test_recipe:
          setup: ["HIGH-risk DRAFT care plan where cosigner == author."]
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "Pay", payer_type: "MEDICARE" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "C6", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1200000081" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/providers"
              payload: { full_name: "Clin", provider_type: "CLINICIAN", npi: "1200000082" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat HI2", date_of_birth: "1959-01-01", baseline_ed_visits_12mo: 9, chronic_conditions_count: 4 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/referrals"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", referring_source: "ED" }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /mih/referrals/${ref_id}/screen"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /mih/referrals/${ref_id}/accept"
              payload: {}
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /mih/enrollments/${enr_id}/care-plans"
              payload: { risk_level: "HIGH", authoring_clinician_id: "${clin_id}", cosigner_clinician_id: "${clin_id}", goals: "complex", expected_enrollment_version: "${enr_v}" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /mih/care-plans/${cp_id}/activate"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COSIGN_SAME_CLINICIAN"
