            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 150000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/invoices", payload: { order_id: "${o_id}" }, as: Dispatcher, captures: { inv_total: "$.data[0].total_cents", inv_status: "$.data[0].status" } }
            - { call: "GET /v1/customers/${c_id}", payload: {}, as: PlantManager }
          assert:
            - "Order.${o_id}.delivered_qty_yd3 == 8.0 and delivery_status == DELIVERED (link 1->2)"
            - "Invoice auto-created: status == DRAFT and total_cents == 159300 (link 2)"
            - "Customer.${c_id}.credit_exposure_cents == 159300 and credit_status == HOLD (link 3: 159300 >= 150000)"

      - name: water_addition_flips_cylinder_basis_chain
        grounds:
          - calculations.actual_wc_ratio
          - entities.Load.fields.over_watered
          - entities.CylinderSet.fields.acceptance_basis
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /v1/loads/{id}/water-additions):
          the addition recomputes Load.actual_wc_ratio and flips over_watered and
          strength_liability (link 1); that flip switches every non-terminal
          CylinderSet of the load to acceptance_basis AS_PLACED (link 2).
        test_recipe:
          setup:
            - "Standard catalog; order qty 8.0 pour 2026-08-15; one 8.0 yd3 load POURING with a 3-cylinder set already cast (CURING, DESIGN_BASIS)"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/cylinder-sets", payload: { num_cylinders: 3 }, as: QCTech, as_user_id: "qc-a", captures: { cs_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/loads/${l_id}/water-additions", payload: { gallons: 60, customer_authorized: true }, as: Driver, as_user_id: "drv-1" }
            - { call: "GET /v1/cylinder-sets/${cs_id}", payload: {}, as: QCTech }
          assert:
            - "Load.${l_id}.actual_wc_ratio == 0.561 ((2030 + 8.34*60) / 4512 rounded to 3 decimals)"
            - "Load.${l_id}.over_watered == true and strength_liability == CUSTOMER (link 1)"
            - "CylinderSet.${cs_id}.acceptance_basis == AS_PLACED (link 2: cascade from the load mutation, not the request)"

  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_reconfirm
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: re-confirming an already-CONFIRMED
          order while the customer is on credit HOLD returns ERR_INVALID_STATE
          (priority 4), never ERR_CREDIT_HOLD (priority 9).
        test_recipe:
          setup:
            - "Standard catalog; customer credit_limit_cents 100000; order A qty 8.0 confirmed while GOOD (provisional 145200 >= 100000 -> HOLD after credit-review)"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher }
            - { call: "POST /v1/customers/${c_id}/credit-review", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "Customer.${c_id}.credit_status == HOLD before the trigger (both violations armed)"
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 9 business_fiscal)"

      - name: safety_beats_temporal_on_batch
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_WC_RATIO_EXCEEDED]
          - errors[ERR_PLANT_BATCH_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: a batch request whose
          extra water breaches max_wc_ratio AND whose batch_time collides with an
          in-flight batch interval returns ERR_WC_RATIO_EXCEEDED (priority 5), never
          ERR_PLANT_BATCH_CONFLICT (priority 7).
        test_recipe:
          setup:
            - "Standard catalog; order qty 16.0 pour 2026-08-15; loads L1 (T1) and L2 (T2) scheduled; L1 batched at 10:00 occupying [10:00, 10:30)"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
