            - call: "GET /perfusion-devices"
              payload: { limit: 10, offset: 0 }
              as: Perfusionist
              as_user_id: "${p1}"
          assert:
            - "${e_perf_contract} == ERR_UNAUTHORIZED with HTTP 403 - Perfusionist is absent from POST /hospital-contracts' roles list, and priority 3 answers before the unresolvable X-User-ID could raise ERR_ACTOR_NOT_FOUND"
            - "${e_chief_clock} == ERR_UNAUTHORIZED with HTTP 403 - the clock is ContractAdmin-exclusive and a chief holds no override"
            - "${e_surgeon_service} == ERR_UNAUTHORIZED with HTTP 403 - service completions are BiomedTech-exclusive"
            - "${e_chief_surgeon} == ERR_UNAUTHORIZED with HTTP 403 - surgeon master data is ContractAdmin-exclusive"
            - "the logical clock is still 2026-08-01T00:00:00Z and GET /surgeons/${s1} still returns the only surgeon row - no denied call had an effect"
            - "the final call returns HTTP 200 with total_count == 1 - GET /perfusion-devices is a shared operation the Perfusionist role does hold"

      - name: card_ownership_and_case_assignment_are_enforced_against_the_actor_id
