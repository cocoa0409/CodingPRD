          assert:
            - "First reservation returns the unit whose udi_serial == SN-E1 (id == ${uE1_id})"
            - "Second reservation returns the unit whose udi_serial == SN-E2 (id == ${uE2_id})"
            - "DeviceUnit.${uL_id}.custody_state == AVAILABLE (the later-expiring lot is untouched)"
            - "DeviceUnit.${uE1_id}.reserved_case_id == ${case1_id} and DeviceUnit.${uE2_id}.reserved_case_id == ${case2_id}"
            - "CatalogItem.${cat_id}.on_hand_available_qty == 1"

      - name: fefo_empty_candidate_pool_returns_no_eligible_unit
