      - name: teacher_day_cap_boundary_third_booking_rejected
        grounds:
          - validations[priority=13]
          - errors[ERR_TEACHER_DAY_FULL]
          - endpoints[POST /conf/bookings]
        distinguishing_aspect: |
          Count metric on the bookings endpoint (different metric from the strike count and
          from the offer timestamp): with an effective daily cap of 2, the 1st and 2nd
          bookings succeed, the 3rd (cap + 1) is rejected — equality is allowed, overflow is not.
        test_recipe:
          setup:
            - "Window with teacher_daily_conf_cap 2, BOOKING_OPEN; teacher T1"
            - "Family F with students st1..st3 all homeroom-linked to T1"
