# =============================================================================
# Example: commercial-shipping benchmark seed tables (v1)
# =============================================================================

scenario: |
  Hazardous cargo logistics API. Manages planning, scheduling, and execution
  of stowage for hazardous and general cargo across maritime voyages. Enforces
  strict compliance rules, manages scheduling constraints with reshuffle
  delays, tracks voyage economics through provisional and final revenue
  calculations, and handles high-stress operations with compliance scoring.

domain_name: commercial-shipping
api_prefix: /voyage-manifests

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: VoyageManifest
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: voyage_name, type: string, source: input, description: "Name of the voyage" }
      - { name: total_revenue_potential, type: number, source: input, description: "Maximum revenue this voyage can generate (double-precision)" }
      - { name: revenue_balance, type: number, source: computed, description: "Read-only = total_revenue_potential - provisional_revenue - finalized_revenue" }
      - { name: compliance_risk_score, type: number, source: computed, default: 1000, description: "Read-only compliance score, starts at 1000, higher is better" }
      - { name: status, type: enum, source: system, description: "PLANNING → ACTIVE → FINAL_REVIEW_PENDING → COMPLETED" }

  - name: PortCall
    parent: VoyageManifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "Associated manifest ID" }
      - { name: name, type: string, source: input, description: "Port call name" }
      - { name: start_hour, type: integer, source: input, description: "Start hour of operational window" }
      - { name: end_hour, type: integer, source: input, description: "End hour of operational window (must be > start_hour)" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_STOWAGE → COMPLETED / CANCELLED" }

  - name: CargoContract
    parent: PortCall
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: system, description: "Associated port call ID" }
      - { name: manifest_id, type: string, source: system, description: "Associated manifest ID" }
      - { name: cargo_type, type: string, source: input, description: "Type of cargo" }
      - { name: cargo_class, type: enum, source: input, description: "GENERAL | HAZMAT | REEFER" }
      - { name: required_imdg_class_code, type: enum, source: input, default: "NONE", description: "IMDG_CLASS_1.1 | IMDG_CLASS_6.1 | NONE" }
      - { name: start_hour, type: integer, source: input, description: "Start hour of handling window" }
      - { name: end_hour, type: integer, source: input, description: "End hour of handling window" }
      - { name: duration_hours, type: integer, source: computed, description: "Read-only = end_hour - start_hour" }
      - { name: status, type: enum, source: system, description: "PENDING → STOWAGE_PROPOSED → ASSIGNED → COMPLETED / CANCELLED" }

  - name: StowageLocation
    parent: VoyageManifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "Associated manifest ID" }
      - { name: location_code, type: string, source: input, description: "Location code" }
      - { name: location_model, type: string, source: input, description: "Location model" }
      - { name: stowage_revenue_per_hour, type: number, source: input, description: "Base rate per hour for utilization" }
      - { name: location_certifications, type: array, source: system, description: "List of certifications with id, name, applied_date" }

  - name: StowagePlan
    parent: VoyageManifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: system, description: "Associated manifest ID" }
      - { name: contract_id, type: string, source: input, description: "Associated cargo contract ID" }
      - { name: location_id, type: string, source: input, description: "Associated stowage location ID" }
      - { name: provisional_revenue, type: number, source: computed, description: "Provisional revenue calculation" }
      - { name: final_revenue, type: number, source: computed, description: "Final revenue (populated at finalization)" }
      - { name: is_high_stress, type: boolean, source: computed, description: "Whether plan triggers high-stress operations" }
      - { name: used_special_permit, type: boolean, source: computed, description: "Whether special permit was invoked (immutable after creation)" }
      - { name: special_permit_penalty_applied, type: boolean, source: computed, description: "Whether additional 100-point penalty was applied" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL → COMPLIANCE_APPROVED → SCHEDULED → COMPLETED / REJECTED / CANCELLED" }

  - name: ProximityConflict
    parent: VoyageManifest
    common_fields: false  # immutable after creation
    fields:
      - { name: manifest_id, type: string, source: system, description: "Associated manifest ID" }
      - { name: location_id_1, type: string, source: input, description: "First conflicting location" }
      - { name: location_id_2, type: string, source: input, description: "Second conflicting location" }
      - { name: reason, type: string, source: input, required: false, description: "Optional reason for conflict" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: VoyageManifest
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: POST /voyage-manifests/{manifestId}/activate
        actor: LogisticsCoordinator
        preconditions:
          - "Manifest must be in PLANNING state (ERR_MANIFEST_NOT_IN_PLANNING)"
        side_effects: []

      - from: ACTIVE
        to: FINAL_REVIEW_PENDING
        trigger: POST /voyage-manifests/{manifestId}/initiate-final-review
        actor: LogisticsCoordinator
        preconditions:
          - "No stowage plans in PENDING_APPROVAL or COMPLIANCE_APPROVED (ERR_UNRESOLVED_PLANS_EXIST)"
        side_effects: []

      - from: FINAL_REVIEW_PENDING
        to: COMPLETED
        trigger: POST /voyage-manifests/{manifestId}/finalize-manifest
        actor: PortAuthority
        preconditions:
          - "Manifest must be in FINAL_REVIEW_PENDING (ERR_MANIFEST_NOT_READY_FOR_FINALIZATION)"
          - "Total final_revenue must not exceed total_revenue_potential (ERR_FINALIZATION_EXCEEDS_REVENUE_POTENTIAL)"
        side_effects:
          - "All SCHEDULED plans: compute final_revenue sequentially (by contract start_hour, then plan.created_at)"
          - "Recalculate is_high_stress for each plan based on cumulative hours"
          - "Adjust compliance_risk_score for stress status changes"
          - "Plans and contracts → COMPLETED"
          - "Port calls with all contracts COMPLETED/CANCELLED → COMPLETED"
          - "Revenue finalized (provisional zeroed, finalized set)"

  - entity: PortCall
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_STOWAGE
        trigger: PUT /voyage-manifests/{manifestId}/port-calls/{portCallId}
        actor: LogisticsCoordinator
        preconditions:
          - "All cargo contracts must be in ASSIGNED state (ERR_CONTRACTS_NOT_ASSIGNED)"
          - "Port call must contain at least one cargo contract"
        side_effects: []

      - from: READY_FOR_STOWAGE
        to: COMPLETED
        trigger: "system (automatic when all contracts are COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PLANNING
        to: COMPLETED
        trigger: "system (automatic when all contracts are COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /voyage-manifests/{manifestId}/port-calls/{portCallId}
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "All non-completed contracts → CANCELLED"
          - "All associated non-completed stowage plans → CANCELLED"
          - "Release provisional revenue for cancelled plans"
          - "Reverse compliance penalties for cancelled plans"

      - from: READY_FOR_STOWAGE
        to: CANCELLED
        trigger: PUT /voyage-manifests/{manifestId}/port-calls/{portCallId}
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "Same cascade as PLANNING → CANCELLED"

  - entity: CargoContract
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: STOWAGE_PROPOSED
        trigger: "system (automatic when stowage plan is proposed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: STOWAGE_PROPOSED
        to: ASSIGNED
        trigger: "system (automatic when stowage plan is scheduled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: STOWAGE_PROPOSED
        to: PENDING
        trigger: "system (automatic when stowage plan is rejected or cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: PENDING
        trigger: "system (automatic when stowage plan is cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (automatic when stowage plan is finalized/completed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: POST .../contracts/{contractId}/cancel
        actor: CargoPlanner
        preconditions:
          - "Contract must be in PENDING state (ERR_CONTRACT_NOT_PENDING_FOR_CANCEL)"
        side_effects: []

  - entity: StowagePlan
    initial_state: PENDING_APPROVAL
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_APPROVAL
        to: COMPLIANCE_APPROVED
        trigger: POST .../stowage-plans/{planId}/compliance-approve
        actor: LogisticsCoordinator
        preconditions:
          - "Plan must be in PENDING_APPROVAL (ERR_PLAN_NOT_PENDING_APPROVAL)"
        side_effects: []

      - from: COMPLIANCE_APPROVED
        to: SCHEDULED
        trigger: POST .../stowage-plans/{planId}/schedule
        actor: LogisticsCoordinator
        preconditions:
          - "Plan must be in COMPLIANCE_APPROVED (ERR_PLAN_NOT_COMPLIANCE_APPROVED)"
          - "Contract must be in STOWAGE_PROPOSED (ERR_CONTRACT_NOT_STOWAGE_PROPOSED)"
        side_effects:
          - "Re-evaluate scheduling conflicts (ERR_RESHUFFLE_TIME_VIOLATION)"
          - "Recalculate provisional_revenue and is_high_stress"
          - "Verify revenue_balance if cost increased (ERR_INSUFFICIENT_REVENUE_POTENTIAL)"
          - "Adjust compliance_risk_score if stress status changed"
          - "Contract → ASSIGNED"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: POST .../stowage-plans/{planId}/reject
        actor: LogisticsCoordinator
        preconditions:
          - "Plan must be in PENDING_APPROVAL"
        side_effects:
          - "Contract returns to PENDING"
          - "Refund provisional_revenue"
          - "Reverse compliance penalties"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: POST .../stowage-plans/{planId}/cancel
        actor: LogisticsCoordinator
        preconditions:
          - "Plan must be in PENDING_APPROVAL, COMPLIANCE_APPROVED, or SCHEDULED (ERR_PLAN_NOT_CANCELLABLE)"
        side_effects:
          - "Contract returns to PENDING"
          - "Refund provisional_revenue"
          - "Reverse compliance penalties"

      - from: COMPLIANCE_APPROVED
        to: CANCELLED
        trigger: POST .../stowage-plans/{planId}/cancel
        actor: LogisticsCoordinator
        preconditions:
          - "Plan must be in PENDING_APPROVAL, COMPLIANCE_APPROVED, or SCHEDULED"
        side_effects:
          - "Contract returns to PENDING"
          - "Refund provisional_revenue"
          - "Reverse compliance penalties"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST .../stowage-plans/{planId}/cancel
        actor: LogisticsCoordinator
        preconditions:
          - "Plan must be in PENDING_APPROVAL, COMPLIANCE_APPROVED, or SCHEDULED"
        side_effects:
          - "Contract returns to PENDING"
          - "Refund provisional_revenue"
          - "Reverse compliance penalties"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (automatic during finalize-manifest)"
        actor: system
        preconditions: []
        side_effects:
          - "Calculate final_revenue (chronological order)"
          - "Recalculate is_high_stress"
          - "Adjust compliance_risk_score if stress status changed"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_revenue
    trigger: "stowage plan proposal and scheduling"
    algorithm: tiered_rate
    formula: |
      1. Calculate total_usage = cumulative hours on this location from all
         relevant plans (PENDING_APPROVAL, COMPLIANCE_APPROVED, SCHEDULED states)
      2. At proposal: includes all relevant plans + new plan
         At scheduling: includes only COMPLIANCE_APPROVED and SCHEDULED plans
      3. If total_usage > THRESHOLD (100 hours):
           stress_hours = min(duration_hours, total_usage - THRESHOLD)
           normal_hours = duration_hours - stress_hours
           revenue = (normal_hours * rate) + (stress_hours * rate * MULTIPLIER)
         else:
           revenue = duration_hours * rate
    constants:
      THRESHOLD: 100  # hours
      MULTIPLIER: 2.0  # stress surcharge multiplier
    note: "Proposal and scheduling may produce different provisional_revenue"

  - name: is_high_stress
    trigger: "Calculated with provisional_revenue"
    algorithm: threshold
    formula: |
      If total cumulative usage on the location > THRESHOLD:
        is_high_stress = true
      else:
        is_high_stress = false
      (Re-evaluated at proposal, scheduling, and finalization)
    constants:
      THRESHOLD: 100

  - name: final_revenue
    trigger: "manifest finalization"
    algorithm: chronological
    formula: |
      1. Collect all SCHEDULED plans for each location
      2. Sort by contract start_hour ascending, plan.created_at as tie-breaker
      3. running_total = 0 per location
      4. For each plan in sequence:
           running_total += duration_hours
           Calculate revenue using same tiered formula as provisional
      5. final_revenue replaces provisional_revenue
    constants:
      THRESHOLD: 100
      MULTIPLIER: 2.0

  - name: compliance_risk_score_update
    trigger: "plan create/schedule/reject/cancel/finalize"
    algorithm: aggregation
    formula: |
      Initial: 1000 points
      High stress plan created/scheduled: compliance_risk_score -= 50 (IMDG penalty)
      Special permit used: compliance_risk_score -= 100 (additional)
      Plan rejected/cancelled (was high stress): compliance_risk_score += 50
      Plan cancelled (had special permit penalty): compliance_risk_score += 100
      Floor: compliance_risk_score >= 0
    constants:
      IMDG_VIOLATION_PENALTY: 50
      SPECIAL_PERMIT_PENALTY: 100
      COMPLIANCE_FLOOR: 500

  - name: reshuffle_delay_check
    trigger: "plan proposal and scheduling"
    algorithm: time_gap
    formula: |
      For same-location plans (PENDING_APPROVAL, COMPLIANCE_APPROVED, SCHEDULED, COMPLETED):
        If cargo classes differ AND neither is GENERAL:
          gap = later.start_hour - earlier.end_hour
          if gap < RESHUFFLE_DELAY:
            reject with ERR_RESHUFFLE_TIME_VIOLATION
    constants:
      RESHUFFLE_DELAY: 2  # hours

  - name: proximity_conflict_check
    trigger: "plan proposal"
    algorithm: pairing
    formula: |
      If two locations have a ProximityConflict, and one location already has
      a committed plan (PENDING_APPROVAL, COMPLIANCE_APPROVED, SCHEDULED, COMPLETED)
      in the same port call, the other location cannot accept a new plan
      for that port call.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Manifest must be in ACTIVE state for operational actions"
    error_id: ERR_MANIFEST_NOT_ACTIVE
    http_status: 409
    applies_to: "Create port calls, contracts, stowage plans, proximity conflicts"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for operation"
    error_id: "varies (ERR_CONTRACT_NOT_PENDING, ERR_PLAN_NOT_PENDING_APPROVAL, etc.)"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_safety
    check: "Location certification must match contract's required_imdg_class_code"
    error_id: ERR_CERTIFICATION_MISMATCH
    http_status: 400
    applies_to: "POST /stowage-plans (proposal)"

  - priority: 7
    category: business_safety
    check: "Same-location scheduling conflict: reshuffle delay must be respected"
    error_id: ERR_RESHUFFLE_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /stowage-plans (proposal) and /schedule"

  - priority: 8
    category: business_safety
    check: "Proximity conflict check (conflicting locations cannot both be in same port call)"
    error_id: ERR_PROXIMITY_CONFLICT
    http_status: 409
    applies_to: "POST /stowage-plans (proposal)"

  - priority: 9
    category: business_fiscal
    check: "Provisional revenue must not exceed revenue_balance"
    error_id: ERR_INSUFFICIENT_REVENUE_POTENTIAL
    http_status: 402
    applies_to: "POST /stowage-plans (proposal) and /schedule"

  - priority: 10
    category: business_compliance
    check: "High-stress penalty must not breach compliance floor (500) unless special permit used"
    error_id: ERR_COMPLIANCE_SCORE_FLOOR_BREACHED
    http_status: 403
    applies_to: "POST /stowage-plans (proposal)"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- VoyageManifest ---
  - method: POST
    path: "/voyage-manifests"
    description: "Create a new Voyage Manifest"
    roles: [LogisticsCoordinator]
    code: 201
    input: [voyage_name, total_revenue_potential]
    output: VoyageManifest
    side_effects:
      - "revenue_balance initialized to total_revenue_potential"
      - "compliance_risk_score initialized to 1000"
      - "status = PLANNING"

  - method: GET
    path: "/voyage-manifests"
    description: "List all Voyage Manifests"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "VoyageManifest[]"
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}"
    description: "Get a specific Voyage Manifest"
    roles: [Any]
    code: 200
    input: []
    output: VoyageManifest
    side_effects: []

  - method: POST
    path: "/voyage-manifests/{manifestId}/activate"
    description: "Activate a manifest"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: VoyageManifest
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/voyage-manifests/{manifestId}/initiate-final-review"
    description: "Move manifest to final review"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: VoyageManifest
    side_effects:
      - "status → FINAL_REVIEW_PENDING"
      - "Precondition: no unresolved plans (ERR_UNRESOLVED_PLANS_EXIST)"

  - method: POST
    path: "/voyage-manifests/{manifestId}/finalize-manifest"
    description: "Finalize manifest and realize revenue"
    roles: [PortAuthority]
    code: 200
    input: []
    output: VoyageManifest
    side_effects:
      - "status → COMPLETED"
      - "All SCHEDULED plans: compute final_revenue sequentially → COMPLETED"
      - "Contracts → COMPLETED"
      - "Port calls with all contracts terminal → COMPLETED"
      - "Revenue finalized"

  # --- PortCall ---
  - method: POST
    path: "/voyage-manifests/{manifestId}/port-calls"
    description: "Create a new Port Call"
    roles: [CargoPlanner]
    code: 201
    input: [name, start_hour, end_hour]
    output: PortCall
    side_effects: ["status = PLANNING"]

  - method: GET
    path: "/voyage-manifests/{manifestId}/port-calls"
    description: "List Port Calls for a Manifest"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "PortCall[]"
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}/port-calls/{portCallId}"
    description: "Get a specific Port Call"
    roles: [Any]
    code: 200
    input: []
    output: PortCall
    side_effects: []

  - method: PUT
    path: "/voyage-manifests/{manifestId}/port-calls/{portCallId}"
    description: "Update a Port Call's status"
    roles: [LogisticsCoordinator]
    code: 200
    input: [status]
    output: PortCall
    side_effects: ["State transition + possible cascade cancellation"]

  # --- CargoContract ---
  - method: POST
    path: "/voyage-manifests/{manifestId}/port-calls/{portCallId}/contracts"
    description: "Create a new Cargo Contract"
    roles: [CargoPlanner]
    code: 201
    input: ["cargo_type, cargo_class, required_imdg_class_code?, start_hour, end_hour"]
    output: CargoContract
    side_effects: ["duration_hours auto-calculated", "status = PENDING"]

  - method: GET
    path: "/voyage-manifests/{manifestId}/port-calls/{portCallId}/contracts"
    description: "List Cargo Contracts for a Port Call"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "CargoContract[]"
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}/port-calls/{portCallId}/contracts/{contractId}"
    description: "Get a specific Cargo Contract"
    roles: [Any]
    code: 200
    input: []
    output: CargoContract
    side_effects: []

  - method: POST
    path: "/voyage-manifests/{manifestId}/port-calls/{portCallId}/contracts/{contractId}/cancel"
    description: "Cancel a PENDING Cargo Contract"
    roles: [CargoPlanner]
    code: 200
    input: []
    output: CargoContract
    side_effects: ["status → CANCELLED (only from PENDING)"]

  # --- StowageLocation ---
  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-locations"
    description: "Create a Stowage Location"
    roles: [CargoPlanner]
    code: 201
    input: [location_code, location_model, stowage_revenue_per_hour]
    output: StowageLocation
    side_effects: ["location_certifications initialized to empty array"]

  - method: GET
    path: "/voyage-manifests/{manifestId}/stowage-locations"
    description: "List Stowage Locations"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "StowageLocation[]"
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}/stowage-locations/{locationId}"
    description: "Get a specific Stowage Location"
    roles: [Any]
    code: 200
    input: []
    output: StowageLocation
    side_effects: []

  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-locations/{locationId}/certifications"
    description: "Add a certification to a Stowage Location"
    roles: [CargoPlanner]
    code: 200
    input: ["name (IMDG_CLASS_1.1 | IMDG_CLASS_6.1), applied_date"]
    output: StowageLocation
    side_effects: ["Certification added to location_certifications array"]

  # --- ProximityConflict ---
  - method: POST
    path: "/voyage-manifests/{manifestId}/proximity-conflicts"
    description: "Create a Proximity Conflict"
    roles: [LogisticsCoordinator]
    code: 201
    input: ["location_id_1, location_id_2, reason?"]
    output: ProximityConflict
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}/proximity-conflicts"
    description: "List Proximity Conflicts"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ProximityConflict[]"
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}/proximity-conflicts/{conflictId}"
    description: "Get a specific Proximity Conflict"
    roles: [Any]
    code: 200
    input: []
    output: ProximityConflict
    side_effects: []

  # --- StowagePlan ---
  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-plans"
    description: "Propose a new Stowage Plan"
    roles: [CargoPlanner]
    code: 201
    input: ["contract_id, location_id, use_special_permit?"]
    output: StowagePlan
    side_effects:
      - "Calculate provisional_revenue"
      - "Debit revenue_balance"
      - "Determine is_high_stress"
      - "If high_stress: compliance_risk_score -= 50"
      - "If special permit used and floor breached: compliance_risk_score -= 100"
      - "Contract status → STOWAGE_PROPOSED"
      - "Trigger full validation chain"

  - method: GET
    path: "/voyage-manifests/{manifestId}/stowage-plans"
    description: "List all Stowage Plans"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "StowagePlan[]"
    side_effects: []

  - method: GET
    path: "/voyage-manifests/{manifestId}/stowage-plans/{planId}"
    description: "Get a specific Stowage Plan"
    roles: [Any]
    code: 200
    input: []
    output: StowagePlan
    side_effects: []

  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-plans/{planId}/compliance-approve"
    description: "Approve compliance of a plan"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: StowagePlan
    side_effects: ["status → COMPLIANCE_APPROVED"]

  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-plans/{planId}/schedule"
    description: "Schedule an approved plan"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: StowagePlan
    side_effects:
      - "status → SCHEDULED"
      - "Contract → ASSIGNED"
      - "Recalculate provisional_revenue and is_high_stress"
      - "Verify revenue_balance"
      - "Adjust compliance_risk_score if stress changed"
      - "Re-validate scheduling conflicts"

  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-plans/{planId}/reject"
    description: "Reject a proposed plan"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: StowagePlan
    side_effects:
      - "status → REJECTED"
      - "Contract returns to PENDING"
      - "Refund provisional_revenue"
      - "Reverse compliance penalties"

  - method: POST
    path: "/voyage-manifests/{manifestId}/stowage-plans/{planId}/cancel"
    description: "Cancel a plan"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: StowagePlan
    side_effects:
      - "status → CANCELLED"
      - "Contract returns to PENDING"
      - "Refund provisional_revenue"
      - "Reverse compliance penalties"

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Input Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error"

  - id: ERR_INVALID_PORT_CALL_HOURS
    http: 400
    condition: "Port call hours invalid (end_hour must be > start_hour)"

  - id: ERR_INVALID_CONTRACT_HOURS
    http: 400
    condition: "Contract hours invalid"

  - id: ERR_CERTIFICATION_MISMATCH
    http: 400
    condition: "Location does not have required IMDG certification"

  - id: ERR_SELF_CONFLICT
    http: 400
    condition: "Location cannot conflict with itself"

  # --- Resource Not Found ---
  - id: ERR_MANIFEST_NOT_FOUND
    http: 404
    condition: "Voyage manifest not found"

  - id: ERR_PORT_CALL_NOT_FOUND
    http: 404
    condition: "Port call not found"

  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Cargo contract not found"

  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "Stowage location not found"

  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "Stowage plan not found"

  - id: ERR_CONFLICT_NOT_FOUND
    http: 404
    condition: "Proximity conflict not found"

  # --- Financial ---
  - id: ERR_INSUFFICIENT_REVENUE_POTENTIAL
    http: 402
    condition: "Provisional revenue exceeds revenue_balance"

  - id: ERR_FINALIZATION_EXCEEDS_REVENUE_POTENTIAL
    http: 402
    condition: "Total final_revenue exceeds total_revenue_potential at finalization"

  # --- Compliance ---
  - id: ERR_COMPLIANCE_SCORE_FLOOR_BREACHED
    http: 403
    condition: "High-stress penalty would cause compliance score to drop to/below 500 (and no special permit used)"

  # --- State Constraints ---
  - id: ERR_MANIFEST_NOT_ACTIVE
    http: 409
    condition: "Operation requires manifest to be in ACTIVE state"

  - id: ERR_MANIFEST_NOT_IN_PLANNING
    http: 409
    condition: "Activation requires manifest in PLANNING state"

  - id: ERR_MANIFEST_NOT_READY_FOR_FINALIZATION
    http: 409
    condition: "Finalization requires manifest in FINAL_REVIEW_PENDING state"

  - id: ERR_CONTRACT_NOT_PENDING
    http: 409
    condition: "Stowage plan proposal requires contract in PENDING state"

  - id: ERR_CONTRACT_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "Contract cancellation requires PENDING state"

  - id: ERR_CONTRACT_NOT_STOWAGE_PROPOSED
    http: 409
    condition: "Scheduling requires contract in STOWAGE_PROPOSED state"

  - id: ERR_RESHUFFLE_TIME_VIOLATION
    http: 409
    condition: "Insufficient reshuffle delay between different cargo classes on same location"

  - id: ERR_PROXIMITY_CONFLICT
    http: 409
    condition: "Conflicting locations cannot both have committed plans in same port call"

  - id: ERR_PLAN_NOT_PENDING_APPROVAL
    http: 409
    condition: "Compliance approve requires plan in PENDING_APPROVAL state"

  - id: ERR_PLAN_NOT_COMPLIANCE_APPROVED
    http: 409
    condition: "Schedule requires plan in COMPLIANCE_APPROVED state"

  - id: ERR_PLAN_NOT_CANCELLABLE
    http: 409
    condition: "Cancel requires plan in PENDING_APPROVAL, COMPLIANCE_APPROVED, or SCHEDULED"

  - id: ERR_ILLEGAL_PORT_CALL_STATE_TRANSITION
    http: 409
    condition: "Invalid port call state transition"

  - id: ERR_CONTRACTS_NOT_ASSIGNED
    http: 409
    condition: "Not all contracts are ASSIGNED when transitioning port call to READY_FOR_STOWAGE"

  - id: ERR_UNRESOLVED_PLANS_EXIST
    http: 409
    condition: "Unresolved stowage plans exist when initiating final review"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: LogisticsCoordinator
    description: "Oversees voyage lifecycle, compliance approvals, and scheduling"
    exclusive_operations:
      - "POST /voyage-manifests — Create manifest"
      - "POST .../activate — Activate manifest"
      - "POST .../initiate-final-review — Initiate final review"
      - "PUT .../port-calls/{id} — Update port call status"
      - "POST .../stowage-plans/{id}/compliance-approve — Approve compliance"
      - "POST .../stowage-plans/{id}/schedule — Schedule plan"
      - "POST .../stowage-plans/{id}/reject — Reject plan"
      - "POST .../stowage-plans/{id}/cancel — Cancel plan"
      - "POST .../proximity-conflicts — Create proximity conflict"

  - name: CargoPlanner
    description: "Manages port calls, contracts, stowage locations, and proposes stowage plans"
    exclusive_operations:
      - "POST .../port-calls — Create port call"
      - "POST .../contracts — Create cargo contract"
      - "POST .../contracts/{id}/cancel — Cancel contract"
      - "POST .../stowage-locations — Create stowage location"
      - "POST .../stowage-locations/{id}/certifications — Add certification"
      - "POST .../stowage-plans — Propose stowage plan"

  - name: PortAuthority
    description: "Final authorization and voyage completion"
    exclusive_operations:
      - "POST .../finalize-manifest — Finalize manifest"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /voyage-manifests — List manifests"
      - "GET /voyage-manifests/{id} — Get manifest"
      - "GET .../port-calls — List port calls"
      - "GET .../port-calls/{id} — Get port call"
      - "GET .../contracts — List contracts"
      - "GET .../contracts/{id} — Get contract"
      - "GET .../stowage-locations — List locations"
      - "GET .../stowage-locations/{id} — Get location"
      - "GET .../stowage-plans — List plans"
      - "GET .../stowage-plans/{id} — Get plan"
      - "GET .../proximity-conflicts — List conflicts"
      - "GET .../proximity-conflicts/{id} — Get conflict"
