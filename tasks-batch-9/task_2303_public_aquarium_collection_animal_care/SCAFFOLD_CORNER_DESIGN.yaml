  - name: rbac_aquarist_owns_the_floor_but_not_the_collection_plan
    claim_type: Exclusive Operations
    grounds:
    - §1.7 AquaristTechnician exclusive_operations (water-quality readings, redundancy tests, placements, removals, POST /aquarium/interaction-sessions)
    - §1.7 ComplianceDirector exclusive_operations (POST /aquarium/collection-plan-entries/{id}/status-actions, PATCH /aquarium/exhibits/{id})
    - §1.6 ERR_UNAUTHORIZED (403)
    distinguishing_aspect: The technician may write a reading that CLOSES an exhibit yet may not suspend a plan line or re-capacitate the tank, and the director may not file the reading — each role's authority follows the artefact, not the consequence.
    test_recipe:
      setup:
      - One APPROVED plan line on a 100-unit exhibit served by a NORMAL plant. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      trigger:
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: SUSPEND, reason: tank refit}
        as: AquaristTechnician
        as_user_id: aquarist-1
        captures: {err: $.data.error_id}
      - call: PATCH /aquarium/exhibits/${ex_id}
        payload: {expected_exhibit_version: '${ex_v1}', bioload_capacity_units: 40}
        as: AquaristTechnician
        as_user_id: aquarist-1
        captures: {err2: $.data.error_id}
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: ComplianceDirector
        as_user_id: dir-1
        captures: {err3: $.data.error_id}
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/collection-plan-entries/${cpe_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'the technician''s SUSPEND: HTTP 403 and data.error_id == ERR_UNAUTHORIZED'
      - 'the technician''s PATCH: HTTP 403 and data.error_id == ERR_UNAUTHORIZED; Exhibit.version is still 1, so the OCC token was not consumed'
      - 'the director''s reading: HTTP 403 and data.error_id == ERR_UNAUTHORIZED'
      - 'the technician''s own reading: HTTP 201 with severity NORMAL'
      - CollectionPlanEntry.status == APPROVED and suspension_reason == null
  - name: rbac_transfer_decisions_are_split_by_action_value_between_two_roles
    claim_type: Shared Operations
    grounds:
    - §1.7 ComplianceDirector shared_operations (POST /aquarium/transfer-requests/{id}/decisions, APPROVE only)
    - §1.7 PartnerInstitutionLiaison exclusive_operations (the same endpoint, COUNTER and DECLINE only)
    - §1.6 ERR_UNAUTHORIZED (403, 'role not permitted ... for the requested action value')
    - §1.2 TransferRequest SUBMITTED -> COUNTERED / SUBMITTED -> APPROVED
    distinguishing_aspect: 'Both roles are listed on the SAME endpoint, so authorisation must be resolved from the `decision` VALUE: the director''s COUNTER and the liaison''s APPROVE are both 403, while the liaison''s COUNTER and the director''s APPROVE both succeed on the same request.'
