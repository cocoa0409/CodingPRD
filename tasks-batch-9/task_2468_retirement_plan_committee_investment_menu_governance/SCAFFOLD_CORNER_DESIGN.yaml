            - "hop 2 hit ONLY run A: FeeLevelizationRun.${run_a_id}.status == RECALC_REQUIRED because pool_fund_ids contains ${fund_lc_a_id}, while FeeLevelizationRun.${run_b_id}.status is still APPROVED — its pool holds only ${fund_bond_a_id}, which the mapping never touched"
            - "hop 3 flipped the plan-level flag: Plan.fee_disclosure_status COMPLIANT -> RESTATEMENT_REQUIRED"
            - "hop 4 tabled nothing this time: both FEE_LEVELIZATION motions were already CARRIED, not OPEN, so Motion.${motion_run_a_id}.status and Motion.${motion_run_b_id}.status are both still CARRIED — the cascade's hop-4 target set is empty and the hop must be a no-op rather than an error"
