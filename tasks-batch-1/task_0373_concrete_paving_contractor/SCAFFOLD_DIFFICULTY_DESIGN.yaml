        distinguishing_aspect: |
          On POST /projects/{id}/schedule a project in DRAFT (not APPROVED) AND with no ISSUED permit violates both
          P6 state and P7 business_referential; P6 wins so ERR_INVALID_STATE (409) is returned, not ERR_PRECONDITION_NOT_MET.
          Error-category pair: state vs business_referential.
        test_recipe:
          setup:
            - "A DRAFT project with one segment but no estimate/permit/material/crew (so it is both wrong-state and missing referential preconditions for schedule)."
