              captures: { s2_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${s1_id}", fiscal_year_id: "${fy_dec_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_s1_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${s2_id}", fiscal_year_id: "${fy_dec_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_s2_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_dec_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_10: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_dec_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_10}" }
              as: AirportFinance
              captures: { rs_dec_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_dec_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_dec_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_s1_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${s1_id}"
            - call: "POST /airport/airline_agreements/{ag_s2_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${s2_id}"
            - call: "POST /airport/fiscal_years/{fy_dec_id}/activity_records"
              payload: { airline_id: "${s1_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 600, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_dec_id}/activity_records"
              payload: { airline_id: "${s2_id}", activity_date: "2026-09-05T00:00:00Z", landed_weight_kg: 400, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_dec_id}/capital_projects"
              payload: { project_name: "Runway Rehab", cost_center: "AIRFIELD", budget_cents: 5000000, mii_threshold_pct: 60 }
              as: AirportFinance
              captures: { cp_dec_id: $.data.id }
            - call: "POST /airport/capital_projects/{cp_dec_id}/open-voting"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/capital_projects/{cp_dec_id}/mii_votes"
              payload: { airline_id: "${s1_id}", ballot: "APPROVE" }
