              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003", initial_custody_state: "QUARANTINED" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k3_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004", fill_count: 25, fills_at_last_pressure_test: 0 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k4_id: "$.data.id" }
            - call: "POST /pools/${p2_id}/kegs"
              payload: { asset_tag: "K-9001" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /kegs"
              payload: { pool_id: "${p1_id}", custody_state: "IN_FLOAT" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs"
              payload: { pool_id: "${p1_id}", service_state: "SERVICE_DUE" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs"
              payload: { pool_id: "${p1_id}", custody_state: "IN_FLOAT", service_state: "SERVICE_OK" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs"
              payload: { pool_id: "${p1_id}", service_state: "SERVICE_OVERDUE" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs"
              payload: { pool_id: "${p1_id}", dwell_flag: "WITHIN_LIMIT" }
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "the first read returns HTTP 200 with total_count == 2 and exactly the ids {${k1_id}, ${k4_id}} — the seeded IN_SERVICE and QUARANTINED kegs are excluded"
            - "the second read returns total_count == 1 with the single id ${k4_id} and service_state == SERVICE_DUE (25 - 0 >= 25 at import; custody_state on that row is still IN_FLOAT)"
            - "the third read returns total_count == 1 with the single id ${k1_id}: the two dimensions intersect, so IN_FLOAT alone (2) and SERVICE_OK alone (3) are both wrong answers"
            - "the fourth read returns total_count == 0: the certifications default to created_at, so nothing is older than 730 days and no sweep has run"
            - "the fifth read returns total_count == 4: dwell_flag defaults to WITHIN_LIMIT on every keg, including the two that are not in circulation"
            - "no page contains K-9001 of ${p2_id}, and every returned row has pool_id == ${p1_id}"

  # ==========================================================================
  # ERRORS — Table 6 declares no claim rows, only the obligation that every
  # declared error code be triggerable, so every instance here carries
  # claim_type: triggerable. The 67 codes of §1.6 are covered as follows:
  #   * 46 codes are triggered by instances in the other sections of this file
  #     or by §1.8 (the stubs at the end of this section name the §1.8 owners);
  #   * the 21 codes with no other home are triggered below, several of them in
  #     grouped sweeps because they differ only in which row was missing.
  # ==========================================================================
  - section: errors
    instances:
      - name: request_with_no_headers_is_unauthenticated_before_the_404
        claim_type: triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Priority 1 outranks the path-id lookup: all three shapes of a bad identity (no X-User-Role, blank X-User-ID, an X-User-Role that is not one of the five declared roles) return 401 ERR_UNAUTHENTICATED against a pool id that does not exist, where a role-aware implementation would have answered 404 or 403."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z. No other data is needed: the request never reaches a lookup."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /pools/p_does_not_exist"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "op-1"
              captures: { e1: "$.data.error_id" }
            - call: "GET /pools/p_does_not_exist"
              payload: {}
              as: PoolOperator
              as_user_id: "   "
              captures: { e2: "$.data.error_id" }
            - call: "GET /pools/p_does_not_exist"
              payload: {}
              as: "Auditor"
              as_user_id: "aud-1"
              captures: { e3: "$.data.error_id" }
          assert:
            - "the first call returns HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "the second call returns HTTP 401 ERR_UNAUTHENTICATED: a blank X-User-ID is treated as missing, not as an unknown actor (that is priority 3's 403)"
            - "the third call returns HTTP 401 ERR_UNAUTHENTICATED: Auditor is not one of the five roles in §1.7, so identity fails before authorisation"
            - "none of the three returns 404 ERR_POOL_NOT_FOUND even though p_does_not_exist is genuinely absent, and none returns 403"

      - name: every_path_id_lookup_has_its_own_not_found_code
        claim_type: triggerable
        grounds:
          - errors.ERR_BREWER_NOT_FOUND
          - errors.ERR_DISTRIBUTOR_NOT_FOUND
          - errors.ERR_SCAN_EVENT_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_SERVICE_CENTER_NOT_FOUND
          - errors.ERR_SERVICE_CYCLE_NOT_FOUND
          - errors.ERR_ASSESSMENT_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_ACCRUAL_NOT_FOUND
          - errors.ERR_INVESTIGATION_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "Eleven distinct 404 codes, one per entity, are proved distinguishable in a single sweep of read-by-id endpoints with a syntactically valid but absent identifier. A single generic ERR_NOT_FOUND, or reusing ERR_KEG_NOT_FOUND for sibling entities, fails here; ERR_POOL_NOT_FOUND and ERR_KEG_NOT_FOUND are already proved by other sections."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z. The store is intentionally empty of the eleven entities probed, so every lookup misses."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /brewers/br_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_brewer: "$.data.error_id" }
            - call: "GET /distributors/di_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_dist: "$.data.error_id" }
            - call: "GET /scan-events/se_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_scan: "$.data.error_id" }
            - call: "GET /float-agreements/fa_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_agr: "$.data.error_id" }
            - call: "GET /issuance-orders/io_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_order: "$.data.error_id" }
            - call: "GET /service-centers/sc_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_center: "$.data.error_id" }
            - call: "GET /service-cycles/cy_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_cycle: "$.data.error_id" }
            - call: "GET /loss-assessments/la_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_assess: "$.data.error_id" }
            - call: "GET /reconciliation-claims/rc_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_claim: "$.data.error_id" }
            - call: "GET /return-incentives/ac_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_accrual: "$.data.error_id" }
            - call: "GET /theft-investigations/ti_missing"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_inv: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 and each returns its own code: ERR_BREWER_NOT_FOUND, ERR_DISTRIBUTOR_NOT_FOUND, ERR_SCAN_EVENT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_SERVICE_CENTER_NOT_FOUND, ERR_SERVICE_CYCLE_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_ACCRUAL_NOT_FOUND, ERR_INVESTIGATION_NOT_FOUND"
            - "the eleven error_id values are pairwise distinct"
            - "each response carries the standard error envelope: response_type == error with data.error_id and data.message present"
            - "no call returns 200 with an empty body and none returns 400 (the identifiers are syntactically fine, they are simply absent)"

      - name: the_four_uniqueness_conflicts_are_reported_separately
        claim_type: triggerable
        grounds:
          - errors.ERR_DUPLICATE_BRAND_CODE
          - errors.ERR_DUPLICATE_POOL_CODE
          - errors.ERR_DUPLICATE_ASSET_TAG
          - errors.ERR_DUPLICATE_INDEX_DATE
          - validations[priority=38]
        distinguishing_aspect: "One priority, four codes. ERR_DUPLICATE_ASSET_TAG is the sharp one: the tag is unique GLOBALLY, so re-using K-0001 in a second pool is a conflict even though the pool differs, while a fresh tag in that same second pool succeeds. Each duplicate is also distinguished from ERR_INVALID_REQUEST: the payloads are all well formed."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; brewer RDG; index 2026-07-01; pool HB-50L holding K-0001; a second pool SK-20L."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "SK-20L", size_liters: 20, stainless_weight_kg: 7.5, replacement_cost_cents: 16000, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
          trigger:
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing of Denver", brand_code: "RDG", credit_limit_cents: 100000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_brand: "$.data.error_id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 24000, region_code: "WY" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_pool: "$.data.error_id" }
            - call: "POST /pools/${p2_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_tag: "$.data.error_id" }
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 500, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_index: "$.data.error_id" }
            - call: "POST /pools/${p2_id}/kegs"
              payload: { asset_tag: "K-9001" }
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "the brewer create returns HTTP 409 ERR_DUPLICATE_BRAND_CODE (the name differs; only brand_code collides) and no second Brewer row exists"
            - "the pool create returns HTTP 409 ERR_DUPLICATE_POOL_CODE even though size, cost and region all differ"
            - "the K-0001 create under ${p2_id} returns HTTP 409 ERR_DUPLICATE_ASSET_TAG: the tag is unique across every pool, so a different pool_id does not make it available"
            - "the index create returns HTTP 409 ERR_DUPLICATE_INDEX_DATE, and GET /commodity-index still reports total_count 1 with usd_cents_per_kg 480 (the 500 posting was not applied)"
            - "the control create of K-9001 under ${p2_id} returns HTTP 201, proving the second pool itself was never the problem"
            - "KegPool.${p1_id}.kegs_total == 1 and KegPool.${p2_id}.kegs_total == 1"

      - name: stale_expected_keg_version_on_assessment_create_returns_412
        claim_type: triggerable
        grounds:
          - errors.ERR_STALE_KEG_VERSION
          - concurrency_rules[assessment-create-stale-keg]
          - validations[priority=9]
        distinguishing_aspect: "The keg version read at import is invalidated by the allocate and the dispatch that follow it, so replaying it is 412 ERR_STALE_KEG_VERSION and not one of the four codes that would otherwise apply to this request. Re-reading the keg and replaying the identical body then succeeds, which proves the refusal was purely the version guard."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; brewer RDG; pool HB-50L, replacement_cost_cents 23500, three kegs."
            - "Agreement float_size_kegs 3 at 2200 activated 2026-08-01; K-0001's version is captured BEFORE the allocate, then the allocate and the dispatch each bump it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id", k1_v0: "$.data.version" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", fill_count: 5, fills_at_last_pressure_test: 5 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003", fill_count: 6, fills_at_last_pressure_test: 6 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 3, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "NOT_RETURNED_DWELL", expected_keg_version: "${k1_v0}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v2: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "NOT_RETURNED_DWELL", expected_keg_version: "${k1_v2}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la1_id: "$.data.id" }
          assert:
            - "the first create returns HTTP 412 with error_id == ERR_STALE_KEG_VERSION"
            - "it is not 422 ERR_NO_CHARGEABLE_PARTY (the dispatch set current_brewer_id), not 422 ERR_NO_COMMODITY_INDEX (an index exists) and not 409 ERR_ASSESSMENT_ALREADY_OPEN (there is no prior assessment): priority 9 outranks all of them"
            - "the refusal wrote nothing: Keg.${k1_id}.assessment_open == false, Keg.${k1_id}.version == ${k1_v2} and GET /loss-assessments with keg_id ${k1_id} returns total_count 0"
            - "${k1_v2} is strictly greater than ${k1_v0} — the allocate and the dispatch each bumped the keg exactly once"
            - "the replayed create with the re-read version returns HTTP 201 with assessment_status == PROPOSED and Keg.${k1_id}.assessment_open == true"
            - "the accepted create bumped the keg again, so Keg.${k1_id}.version is now greater than ${k1_v2}"

      - name: stale_expected_claim_version_on_respond_returns_412
        claim_type: triggerable
        grounds:
          - errors.ERR_STALE_CLAIM_VERSION
          - concurrency_rules[claim-respond-stale-claim]
