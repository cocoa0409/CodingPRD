            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_hv_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_hv_2026_id: $.data.id }
            - call: "POST /diligence-reviews/${rev_hv_2026_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /diligence-reviews/${rev_hv_2026_id}/approve"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /employees"
              payload: { full_name: "Lee Vargas", employee_number: "E-2001", annual_salary_usd: 900000.00 }
              as: BenefitsAnalyst
              captures: { emp_vargas_id: $.data.id }
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_vargas_id}", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-07-31T00:00:00Z", consent_form_reference: "CF-2001", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
              captures: { consent_vargas_id: $.data.id }
            - call: "POST /consent-records/${consent_vargas_id}/execute"
