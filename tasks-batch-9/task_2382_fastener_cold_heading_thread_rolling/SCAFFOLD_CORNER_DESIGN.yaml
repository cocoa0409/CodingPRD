            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_b}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 400.0 }
              as: ProcessEngineer
              captures: { wire_late: $.data.id }
          trigger:
            - call: "POST /wire-lots/${wire_bad}/release"
              payload: {}
