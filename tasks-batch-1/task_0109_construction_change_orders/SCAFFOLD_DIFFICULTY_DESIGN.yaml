scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payapp_current_payment_due_first_vs_subsequent
        grounds:
          - calculations.g702_current_payment_due
          - entities.PayApplication.fields.current_payment_due_cents
          - state_machines.PayApplication.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: >
          On the PayApplication domain, the first_application variant computes
          current_payment_due_cents with prior_certificates_cents == 0
          (405000), while the subsequent_application variant subtracts the
          running sum of prior CERTIFIED applications, yielding a different
          number (405000 again for app 2 only by construction — the delta is
          the 405000 less-previous-certificates subtraction itself, asserted
          via total_completed_and_stored 900000 minus retainage 90000 minus
          prior 405000).
        test_recipe:
          setup:
            - "Project P created (original 1000000, retainage 0.10), version 1."
            - "Two SOV lines: 001 sched 600000, 002 sched 400000."
            - "PayApplication 1 created/billed/submitted/CERTIFIED (cpd 405000); project version now 2; SOV ledgers updated (001 wctd 300000, 002 wctd 100000 + mats 50000)."
            - "PayApplication 2 created (ev 2), billed to cumulative 600000 / 300000, submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 100000, materials_stored_cents: 50000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { pv2: $.data.version }
            - call: "GET /projects/${proj}"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { pv_cur: $.data.version }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 2, period_from: "2026-01-31T00:00:00.000Z", period_to: "2026-02-28T00:00:00.000Z", expected_project_version: "${pv_cur}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app2: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app2}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app2}", sov_line_id: "${sov2}", work_completed_this_period_cents: 200000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app2}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { tcs2: $.data.total_completed_and_stored_cents, tr2: $.data.total_retainage_cents, cpd2: $.data.current_payment_due_cents }
          assert:
            - "PayApplication.${app1}.current_payment_due_cents == 405000  (first_application variant, prior_certificates 0)"
            - "PayApplication.${app2}.total_completed_and_stored_cents == 900000"
            - "PayApplication.${app2}.total_retainage_cents == 90000"
            - "PayApplication.${app2}.current_payment_due_cents == 405000  (subsequent variant: 900000 - 90000 - 405000)"

      - name: revised_contract_sum_additive_vs_deductive
        grounds:
          - calculations.revised_contract_sum
          - entities.Project.fields.revised_contract_sum_cents
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: >
          On the Project/ChangeOrder domain (a different entity domain from the
          PayApplication cpd calc), the additive variant raises
          revised_contract_sum_cents to 1150000 while the deductive variant on a
          negative change_order_amount_cents lowers it to 950000 — same formula,
          opposite-signed divergent results on a distinct subject.
        test_recipe:
          setup:
            - "Project R created (original 1000000, retainage 0.10), version 1."
            - "SOV 001 sched 600000, 002 sched 400000."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "R", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /change-orders"
              payload: { project_id: "${proj}", co_number: "CO-1", change_order_amount_cents: -50000, line_edits: [ { action: "ADJUST", item_no: "002", scheduled_value_delta_cents: -50000 } ] }
              as: Contractor
              as_user_id: "gc-1"
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
              captures: { pv_cur: $.data.version }
          trigger:
            - call: "POST /change-orders/${co1}/approve"
              payload: { expected_project_version: "${pv_cur}" }
              as: Owner
              as_user_id: "owner-1"
              captures: { co_status: $.data.status }
          assert:
            - "ChangeOrder.${co1}.status == APPROVED"
            - "Project.${proj}.revised_contract_sum_cents == 950000  (deductive variant: 1000000 + (-50000))"
            - "SovLine.${sov1}.scheduled_value_cents == 600000 and the adjusted 002 line scheduled_value_cents == 350000 (sum 950000 == revised, invariant holds)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: g703_retainage_round_per_line_then_sum_mode_b
        grounds:
          - calculations.g703_line_retainage
          - calculations.g702_current_payment_due
          - entities.PayAppLine.fields.line_retainage_cents
        distinguishing_aspect: >
          Mode (b) nested rounding where order matters: two lines each bill 125
          cents at 0.10 retainage. Round-per-line-then-sum yields 13 + 13 = 26;
          sum-then-round (0.10 * 250) would yield 25. The scaffold pins
          round-per-line, so total_retainage_cents == 26 and cpd == 224, not 25
          / 225.
        test_recipe:
          setup:
            - "Project Q created (original 1000, retainage 0.10), version 1."
            - "SOV 001 sched 600, 002 sched 400."
            - "PayApplication 1 created (ev 1) with two lines each billing 125 this period; submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Q", owner_user_id: "owner-1", original_contract_sum_cents: 1000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "A", scheduled_value_cents: 600 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "B", scheduled_value_cents: 400 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 125, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { line1: $.data.line_retainage_cents }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 125, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { tcs: $.data.total_completed_and_stored_cents, tr: $.data.total_retainage_cents, cpd: $.data.current_payment_due_cents }
          assert:
            - "PayApplication.${app1}.total_completed_and_stored_cents == 250"
            - "PayApplication.${app1}.total_retainage_cents == 26   (round-per-line 13+13, NOT sum-then-round 25)"
            - "PayApplication.${app1}.current_payment_due_cents == 224  (250 - 26 - 0)"

      - name: g702_cpd_three_input_nonlinear_mode_a
        grounds:
          - calculations.g702_current_payment_due
          - entities.PayApplication.fields.current_payment_due_cents
          - state_machines.PayApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: >
          Mode (a) formula with >=3 inputs and a conditional branch on entity
          state: current_payment_due_cents = total_completed_and_stored_cents
          (450000) - total_retainage_cents (45000) - prior_certificates_cents
          (sum over CERTIFIED-only apps, here 0), three independent inputs whose
          prior-certificates term is selected by a status filter (CERTIFIED, not
          REJECTED/DRAFT/SUBMITTED). Distinct mode from the mode (b) rounding
          instance above.
        test_recipe:
          setup:
            - "Project P2 created (original 1000000, retainage 0.10), version 1."
            - "SOV 001 sched 600000, 002 sched 400000."
            - "PayApplication 1 created (ev 1), lines 300000 and (100000 + 50000 mats), submitted; one prior app was REJECTED first to prove the filter ignores it."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P2", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { appR: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${appR}", sov_line_id: "${sov1}", work_completed_this_period_cents: 1, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${appR}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${appR}/reject"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { pv_cur: $.data.version }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv_cur}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 100000, materials_stored_cents: 50000 }
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { tcs: $.data.total_completed_and_stored_cents, tr: $.data.total_retainage_cents, cpd: $.data.current_payment_due_cents }
          assert:
            - "PayApplication.${app1}.total_completed_and_stored_cents == 450000"
            - "PayApplication.${app1}.total_retainage_cents == 45000"
            - "PayApplication.${app1}.current_payment_due_cents == 405000  (prior_certificates 0; the REJECTED app is excluded by the CERTIFIED-only filter)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: punch_item_cyclic_verified_reopened_ready
        grounds:
          - state_machines.PunchListItem.VERIFIED_to_REOPENED
          - state_machines.PunchListItem.REOPENED_to_READY_FOR_REVIEW
          - state_machines.PunchListItem.READY_FOR_REVIEW_to_VERIFIED
        distinguishing_aspect: >
          PunchListItem is cyclic: VERIFIED -> REOPENED -> READY_FOR_REVIEW ->
          VERIFIED visits READY_FOR_REVIEW and VERIFIED twice, proving the loop
          (a linear pipeline cannot return to an earlier state). Entity =
          PunchListItem.
        test_recipe:
          setup:
            - "Project created; one punch item created OPEN, marked READY, VERIFIED."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PunchProj", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /punch-items"
              payload: { project_id: "${proj}", location: "Lobby", description: "Paint chip", severity: "MINOR" }
              as: Architect
              as_user_id: "arch-1"
              captures: { pi: $.data.id }
            - call: "POST /punch-items/${pi}/ready"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /punch-items/${pi}/verify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
          trigger:
            - call: "POST /punch-items/${pi}/reopen"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { s1: $.data.status }
            - call: "POST /punch-items/${pi}/ready"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { s2: $.data.status }
            - call: "POST /punch-items/${pi}/verify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { s3: $.data.status }
          assert:
            - "After reopen: PunchListItem.${pi}.status == REOPENED"
            - "After ready: PunchListItem.${pi}.status == READY_FOR_REVIEW  (re-entered the same state)"
            - "After verify: PunchListItem.${pi}.status == VERIFIED  (loop closed)"

      - name: submittal_cyclic_revise_resubmit_revision_bump
        grounds:
          - state_machines.Submittal.PENDING_to_REVISE_AND_RESUBMIT
          - state_machines.Submittal.REVISE_AND_RESUBMIT_to_PENDING
          - entities.Submittal.fields.revision
        distinguishing_aspect: >
          Submittal is cyclic on a different entity: PENDING ->
          REVISE_AND_RESUBMIT -> PENDING returns to PENDING and the resubmit
          increments revision 0 -> 1, evidencing the loop count.
        test_recipe:
          setup:
            - "Project created; one submittal created PENDING (revision 0)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "SubProj", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /submittals"
              payload: { project_id: "${proj}", spec_section: "03 30 00", title: "Concrete mix" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sub: $.data.id }
            - call: "POST /submittals/${sub}/review"
              payload: { decision: "REVISE_AND_RESUBMIT" }
              as: Architect
              as_user_id: "arch-1"
              captures: { s1: $.data.status }
          trigger:
            - call: "POST /submittals/${sub}/resubmit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { s2: $.data.status, rev: $.data.revision }
          assert:
            - "After review: Submittal.${sub}.status == REVISE_AND_RESUBMIT"
            - "After resubmit: Submittal.${sub}.status == PENDING  (returned to PENDING — cyclic)"
            - "Submittal.${sub}.revision == 1  (incremented from 0)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payapp_certify_cascade_sovline_then_project_depth3
        grounds:
          - state_machines.PayApplication.SUBMITTED_to_CERTIFIED
          - entities.SovLine.fields.retainage_withheld_to_date_cents
          - entities.Project.fields.retainage_held_cents
        distinguishing_aspect: >
          Depth-3 chain from the certify trigger: certify (A=PayApplication)
          writes back each PayAppLine to its SovLine ledger (B=SovLine
          retainage_withheld_to_date_cents), and that SovLine mutation forces
          recompute of Project.retainage_held_cents (C=Project). Each hop is
          caused by the previous hop, not by the original certify directly.
        test_recipe:
          setup:
            - "Project created (retainage 0.10) version 1; SOV 001 600000, 002 400000."
            - "PayApplication 1 created (ev 1), lines (300000) and (100000 + 50000 mats), submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "CascP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 100000, materials_stored_cents: 50000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { pv_after: $.data.version }
          assert:
            - "SovLine.${sov1}.retainage_withheld_to_date_cents == 30000  (hop B from line retainage)"
            - "SovLine.${sov2}.retainage_withheld_to_date_cents == 15000  (hop B)"
            - "Project.${proj}.retainage_held_cents == 45000  (hop C, sum of SOV retainage)"
            - "Project.${proj}.total_completed_and_stored_cents == 450000"
            - "Project.${proj}.version == 2  (incremented by certify)"

      - name: change_order_approve_cascade_sovline_then_revised_sum_depth3
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - entities.SovLine.fields.scheduled_value_cents
          - entities.Project.fields.revised_contract_sum_cents
        distinguishing_aspect: >
          Depth-3 chain from a different trigger (CO approve): approve
          (A=ChangeOrder) applies line_edits mutating SovLine.scheduled_value
          (B), and that SovLine mutation forces recompute of
          Project.revised_contract_sum_cents (C). Different origin transition
          from the certify cascade.
        test_recipe:
          setup:
            - "Project created (original 1000000) version 1; SOV 001 600000, 002 400000."
            - "CO-1 (amount 150000, edits ADJUST 001 +100000 and ADD 003 +50000) submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "CoCascP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
