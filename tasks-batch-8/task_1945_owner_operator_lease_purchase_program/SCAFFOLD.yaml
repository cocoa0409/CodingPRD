# =============================================================================
# Task 1945 — Owner-Operator Lease-Purchase Program (truckload carrier)
# Scaffold seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  1945. Owner-Operator Lease-Purchase Program (truckload carrier lease program):
  truck lease terms & weekly payment escrow, settlement statement with deductions
  (fuel/insurance/maintenance), escrow account & refund at completion, minimum
  revenue guarantee & lane access, maintenance responsibility & warranty coverage,
  default/termination & truck return, independent-contractor classification
  compliance, buyout at term end

domain_name: owner-operator-lease-purchase
api_prefix: /lease-program

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional (reserve-accrual) vs final (actual-billed) settlement
    - cascading_side_effects        # finalize -> escrow credit -> cap flip -> lease flag
    - rate_threshold_triggers       # missed-payment default threshold, escrow cap, guarantee floor
    - optimistic_concurrency        # OCC on LeaseAgreement.version for buyout-quote supersede
  entity_topology: flat             # peer entities joined by foreign keys; no nested URL paths
  state_machine_shape: branching    # with explicit cycles (ACTIVE<->DEFAULTED, ISSUED<->DISPUTED, truck relist loop)
  relationship_patterns:
    - one_to_many                   # LeaseAgreement -> SettlementStatement / LaneAssignment / ...
    - cross_aggregate               # SettlementStatement reads EscrowAccount + LaneAssignment + WorkOrder
  role_model: peer_roles            # each operational role owns a different resource type; Driver is entity-backed
  consistency_model: immediate      # every mutation is visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OwnerOperator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the owner-operator (independent contractor)" }
      - { name: cdl_number, type: string, source: input, description: "Commercial driver's license number; unique across operators" }
      - { name: classification_status, type: enum, source: computed, default: PENDING_REVIEW, description: "IC classification posture: PENDING_REVIEW | VERIFIED | FLAGGED. Recomputed by the system whenever a ComplianceDocument of this operator is verified, rejected, or evaluated as expired. VERIFIED requires every doc_type in REQUIRED_DOC_TYPES to have a ComplianceDocument with status VERIFIED and expires_on strictly after the current logical clock; FLAGGED when any required doc is REJECTED or expired; otherwise PENDING_REVIEW." }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: odometer_current, type: integer, source: input, description: "Odometer miles at intake; raised by work-order completion when odometer_at_service is greater" }
      - { name: powertrain_warranty_expires_on, type: datetime, source: input, description: "Powertrain warranty expiry instant (ISO 8601 date or datetime)" }
      - { name: powertrain_warranty_mileage_limit, type: integer, source: input, description: "Powertrain warranty mileage limit in miles" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> LEASED -> IN_RETURN -> RETURNED -> AVAILABLE (relist) ; LEASED -> SOLD on buyout acceptance" }

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: owner_operator_id, type: string, source: input, description: "FK -> OwnerOperator.id; the contractor leasing the truck" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; truck must be AVAILABLE and have no other non-terminal lease" }
      - { name: start_date, type: datetime, source: input, description: "Lease start date (ISO 8601 date); term weeks count from this date" }
      - { name: term_weeks, type: integer, source: input, description: "Lease term in weeks; term end instant = start_date + term_weeks * 7 days" }
      - { name: weekly_payment_cents, type: integer, source: input, description: "Weekly truck lease payment deducted through the settlement waterfall" }
      - { name: escrow_weekly_contribution_cents, type: integer, source: input, description: "Weekly escrow contribution taken in the waterfall before the lease payment" }
      - { name: escrow_cap_cents, type: integer, source: input, description: "Maximum escrow balance; contributions truncate at the cap" }
      - { name: buyout_base_price_cents, type: integer, source: input, description: "Scheduled (term-end) buyout price before credits" }
      - { name: min_revenue_guarantee_weekly_cents, type: integer, source: input, description: "Weekly gross-revenue guarantee floor paid by the carrier when eligibility holds" }
      - { name: status, type: enum, source: system, description: "APPLICATION -> ACTIVE <-> DEFAULTED ; ACTIVE|DEFAULTED|APPLICATION -> TERMINATED ; ACTIVE -> COMPLETED" }
      - { name: missed_payment_count, type: integer, source: computed, default: 0, description: "Count of FINALIZED settlements whose lease payment was short; reset to 0 on cure" }
      - { name: arrears_cents, type: integer, source: computed, default: 0, description: "Accumulated lease-payment shortfall across FINALIZED settlements; cleared on cure" }
      - { name: total_payments_applied_cents, type: integer, source: computed, default: 0, description: "Sum of lease_payment_applied_cents over all FINALIZED settlements of this lease" }
      - { name: escrow_satisfied, type: boolean, source: computed, default: false, description: "Set true when the EscrowAccount flips to FULL; never reset" }

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> LeaseAgreement.id; one escrow account per lease, created with the lease" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Current escrow balance; credited on settlement finalize, debited on disburse/apply" }
      - { name: total_credited_cents, type: integer, source: computed, default: 0, description: "Lifetime escrow credits from finalized settlements" }
      - { name: total_refunded_cents, type: integer, source: computed, default: 0, description: "Lifetime refunds disbursed to the operator" }
      - { name: total_applied_cents, type: integer, source: computed, default: 0, description: "Lifetime escrow applied to arrears on termination or to buyout price on acceptance" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING -> FULL -> REFUND_PENDING -> REFUNDED ; ACCUMULATING|FULL -> REFUND_PENDING (complete) ; ACCUMULATING|FULL -> CLOSED (terminated with no remainder, or buyout)" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id" }
      - { name: week_start_date, type: datetime, source: input, description: "Monday-start date of the settlement week (ISO 8601 date); must lie within the lease term and be closed (current clock >= week_start_date + 7 days)" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Gross linehaul revenue earned in the week" }
      - { name: fuel_gallons, type: number, source: input, description: "Gallons of fuel charged to the operator (decimals allowed)" }
      - { name: fuel_price_cents_per_gallon, type: integer, source: input, description: "Fuel price in cents per gallon" }
      - { name: insurance_weekly_cents, type: integer, source: input, description: "Weekly insurance premium deduction" }
      - { name: miles_driven, type: integer, source: input, description: "Miles driven in the week (drives the provisional maintenance reserve)" }
      - { name: load_declined_flag, type: boolean, source: input, default: false, description: "True when the operator declined a dispatched load this week; voids the revenue guarantee" }
      - { name: fuel_deduction_cents, type: integer, source: computed, description: "round_half_up(fuel_gallons * fuel_price_cents_per_gallon) to whole cents" }
      - { name: maintenance_deduction_cents, type: integer, source: computed, description: "Provisional (DRAFT/ISSUED/DISPUTED): reserve accrual round_half_up(miles_driven * 12.5). Final (at FINALIZE): sum of actual_cost_cents of this lease's COMPLETED work orders billed_to OPERATOR whose completed_at falls in [week_start_date, week_start_date + 7 days)" }
      - { name: guarantee_top_up_cents, type: integer, source: computed, description: "max(0, min_revenue_guarantee_weekly_cents - gross_revenue_cents) when eligible, else 0 (see calculations.guarantee_top_up)" }
      - { name: escrow_contribution_cents, type: integer, source: computed, description: "Waterfall step: min(escrow_weekly_contribution_cents, cap room, funds remaining after fuel+insurance+maintenance)" }
      - { name: lease_payment_applied_cents, type: integer, source: computed, description: "Waterfall step: min(weekly_payment_cents, funds remaining after escrow)" }
      - { name: payment_short_flag, type: boolean, source: computed, description: "True when lease_payment_applied_cents < weekly_payment_cents at FINALIZE time" }
      - { name: net_pay_cents, type: integer, source: computed, description: "Funds remaining after all waterfall steps (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED <-> DISPUTED -> FINALIZED ; DRAFT|ISSUED|DISPUTED -> CANCELLED on lease termination" }

  - name: LaneAssignment
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id" }
      - { name: origin, type: string, source: input, description: "Origin city/terminal" }
      - { name: destination, type: string, source: input, description: "Destination city/terminal" }
      - { name: weekly_commitment_cents, type: integer, source: input, description: "Committed weekly revenue for the lane; must be >= 50000 at accept time" }
      - { name: start_date, type: datetime, source: input, description: "Lane window start date (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Lane window end date (exclusive); half-open [start_date, end_date) semantics" }
      - { name: status, type: enum, source: system, description: "OFFERED -> ACCEPTED -> COMPLETED | REVOKED ; OFFERED -> DECLINED" }

  - name: ServiceBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_code, type: string, source: input, description: "Unique bay identifier" }
      - { name: location, type: string, source: input, description: "Terminal/shop location" }

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id; lease must be ACTIVE or DEFAULTED" }
      - { name: service_bay_id, type: string, source: input, description: "FK -> ServiceBay.id; bay window must not conflict" }
      - { name: category, type: enum, source: input, description: "PREVENTIVE | REPAIR | RECALL" }
      - { name: description, type: string, source: input, description: "Free-text work description" }
      - { name: scheduled_start, type: datetime, source: input, description: "Bay booking start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Bay booking end (exclusive); must be > scheduled_start" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimate at booking" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual cost, supplied at completion" }
      - { name: odometer_at_service, type: integer, source: input, description: "Odometer reading at completion; feeds warranty determination" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock value stamped at completion; used for settlement-week attribution" }
      - { name: billed_to, type: enum, source: computed, description: "Computed at completion: RECALL -> CARRIER; PREVENTIVE -> OPERATOR; REPAIR -> WARRANTY when odometer_at_service <= truck.powertrain_warranty_mileage_limit AND scheduled_start <= truck.powertrain_warranty_expires_on, else OPERATOR" }
      - { name: status, type: enum, source: system, description: "OPEN -> COMPLETED ; OPEN -> CANCELLED" }

  - name: ComplianceDocument
    parent: null
    common_fields: true
    fields:
      - { name: owner_operator_id, type: string, source: input, description: "FK -> OwnerOperator.id" }
      - { name: doc_type, type: enum, source: input, description: "W9 | OPERATING_AUTHORITY | INSURANCE_CERTIFICATE | MEDICAL_CARD ; required set for VERIFIED classification = {W9, OPERATING_AUTHORITY, INSURANCE_CERTIFICATE}" }
      - { name: expires_on, type: datetime, source: input, description: "Document expiry date; doc evaluates to EXPIRED once current clock >= expires_on" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED | REJECTED ; VERIFIED -> EXPIRED (evaluated against logical clock on read and on classification checks)" }
      - { name: rejection_reason, type: string, source: input, description: "Optional reason recorded on reject" }

  - name: BuyoutQuote
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> LeaseAgreement.id" }
      - { name: quote_kind, type: enum, source: input, description: "SCHEDULED | EARLY ; SCHEDULED requires current clock >= start_date + term_weeks*7 days" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "SCHEDULED: buyout_base_price_cents. EARLY: buyout_base_price_cents + round_half_up(remaining_weeks * weekly_payment_cents * 0.10)" }
      - { name: escrow_credit_cents, type: integer, source: computed, description: "Escrow balance applied to the quote (min(balance, price + arrears))" }
      - { name: arrears_carried_cents, type: integer, source: computed, description: "Lease arrears added into the amount due" }
      - { name: amount_due_cents, type: integer, source: computed, description: "max(0, quoted_price_cents + arrears_carried_cents - escrow_credit_cents); evaluation order pinned in calculations.buyout_quote_pricing" }
      - { name: expires_on, type: datetime, source: system, description: "created_at + 7 days; ACCEPT after expiry rejected" }
      - { name: status, type: enum, source: system, description: "GENERATED -> ACCEPTED | DECLINED ; GENERATED -> SUPERSEDED when a newer quote is created for the same lease" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OwnerOperator
    initial_state: PENDING_REVIEW   # classification_status
    terminal_states: []             # VERIFIED/FLAGGED/PENDING_REVIEW are all recomputed, none terminal
    transitions:
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "system: recompute on ComplianceDocument verify (all required types VERIFIED and unexpired)"
        actor: system
        preconditions: ["Every doc_type in {W9, OPERATING_AUTHORITY, INSURANCE_CERTIFICATE} has a VERIFIED document with expires_on > current clock"]
        side_effects: ["OwnerOperator.version incremented"]
      - from: VERIFIED
        to: FLAGGED
        trigger: "system: a required VERIFIED document evaluates EXPIRED (clock >= expires_on) on read or classification check"
        actor: system
        preconditions: []
        side_effects: ["OwnerOperator.version incremented", "activation attempts now fail with ERR_COMPLIANCE_REQUIREMENTS_UNMET"]
      - from: PENDING_REVIEW
        to: FLAGGED
        trigger: "system: recompute after a required document is REJECTED"
        actor: system
        preconditions: []
        side_effects: ["OwnerOperator.version incremented"]
      - from: FLAGGED
        to: VERIFIED
        trigger: "system: recompute after a replacement required document is VERIFIED and unexpired"
        actor: system
        preconditions: ["All required types again satisfied"]
        side_effects: ["OwnerOperator.version incremented"]
    note: "classification_status is a derived posture; the cycle PENDING_REVIEW/VERIFIED/FLAGGED is driven entirely by ComplianceDocument events"

  - entity: Truck
    initial_state: AVAILABLE
    terminal_states: [SOLD]
    transitions:
      - from: AVAILABLE
        to: LEASED
        trigger: "POST /lease-program/lease-agreements/{id}/activate"
        actor: LeaseAdmin
        preconditions: ["Lease activation succeeds (see LeaseAgreement APPLICATION->ACTIVE)"]
        side_effects: ["Truck.version incremented"]
      - from: LEASED
        to: IN_RETURN
        trigger: "POST /lease-program/lease-agreements/{id}/terminate or POST /lease-program/lease-agreements/{id}/complete"
        actor: LeaseAdmin
        preconditions: []
        side_effects: ["Truck.version incremented"]
      - from: IN_RETURN
        to: RETURNED
        trigger: "POST /lease-program/trucks/{id}/confirm-return"
        actor: LeaseAdmin
        preconditions: ["Truck.status == IN_RETURN (ERR_TRUCK_NOT_IN_RETURN)"]
        side_effects: ["Truck.version incremented"]
      - from: RETURNED
        to: AVAILABLE
        trigger: "POST /lease-program/trucks/{id}/relist"
        actor: LeaseAdmin
        preconditions: ["Truck.status == RETURNED (ERR_TRUCK_NOT_RETURNED)"]
        side_effects: ["Truck.version incremented"]
      - from: LEASED
        to: SOLD
        trigger: "POST /lease-program/buyout-quotes/{id}/accept"
        actor: Driver
        preconditions: ["Buyout quote acceptance succeeds"]
        side_effects: ["Truck.version incremented"]

  - entity: LeaseAgreement
    initial_state: APPLICATION
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: APPLICATION
        to: ACTIVE
        trigger: "POST /lease-program/lease-agreements/{id}/activate"
        actor: LeaseAdmin
        preconditions:
          - "LeaseAgreement.status == APPLICATION (ERR_LEASE_NOT_IN_APPLICATION)"
          - "OwnerOperator.classification_status == VERIFIED (ERR_COMPLIANCE_REQUIREMENTS_UNMET)"
        side_effects:
          - "Truck AVAILABLE -> LEASED"
          - "LeaseAgreement.version incremented"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /lease-program/lease-agreements/{id}/declare-default"
        actor: LeaseAdmin
        preconditions:
          - "LeaseAgreement.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
          - "missed_payment_count >= 3 (ERR_LEASE_NOT_DEFAULT_ELIGIBLE)"
        side_effects:
          - "Cascade link 1: every LaneAssignment of this lease in ACCEPTED -> REVOKED"
          - "Cascade link 2 (caused by link 1): every SettlementStatement of this lease in DRAFT|ISSUED|DISPUTED is recomputed with guarantee eligibility removed (guarantee_top_up_cents = 0) and its waterfall + net_pay_cents recomputed"
          - "LeaseAgreement.version incremented"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /lease-program/lease-agreements/{id}/cure-default"
        actor: LeaseAdmin
        preconditions:
          - "LeaseAgreement.status == DEFAULTED (ERR_LEASE_NOT_DEFAULTED)"
          - "arrears_payment_cents >= arrears_cents (ERR_ARREARS_NOT_CLEARED)"
        side_effects:
          - "arrears_cents -> 0; missed_payment_count -> 0"
          - "Overpayment (arrears_payment_cents - arrears_cents) flows to escrow: EscrowAccount.balance_cents = min(escrow_cap_cents, balance + overpayment); total_credited_cents increases by the credited portion"
          - "LeaseAgreement.version incremented"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lease-program/lease-agreements/{id}/terminate"
        actor: LeaseAdmin
        preconditions: ["LeaseAgreement.status in {APPLICATION, ACTIVE, DEFAULTED} (ERR_LEASE_ALREADY_TERMINAL)"]
        side_effects:
          - "Truck LEASED -> IN_RETURN (when lease was ACTIVE|DEFAULTED)"
          - "Escrow arrears application: applied = min(balance_cents, arrears_cents); balance -= applied; total_applied_cents += applied; arrears_cents -= applied; remainder (if any) -> status REFUND_PENDING, else status CLOSED"
          - "All LaneAssignment in OFFERED|ACCEPTED -> REVOKED"
          - "All SettlementStatement in DRAFT|ISSUED|DISPUTED -> CANCELLED"
          - "LeaseAgreement.version incremented"
      - from: DEFAULTED
        to: TERMINATED
        trigger: "POST /lease-program/lease-agreements/{id}/terminate"
        actor: LeaseAdmin
        preconditions: ["LeaseAgreement.status in {APPLICATION, ACTIVE, DEFAULTED} (ERR_LEASE_ALREADY_TERMINAL)"]
        side_effects: ["Same cascade as ACTIVE -> TERMINATED"]
      - from: APPLICATION
        to: TERMINATED
        trigger: "POST /lease-program/lease-agreements/{id}/terminate"
        actor: LeaseAdmin
        preconditions: ["LeaseAgreement.status in {APPLICATION, ACTIVE, DEFAULTED} (ERR_LEASE_ALREADY_TERMINAL)"]
        side_effects: ["Escrow (balance 0) -> CLOSED; non-final settlements CANCELLED; OFFERED lanes REVOKED; truck untouched (never LEASED)"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /lease-program/lease-agreements/{id}/complete"
        actor: LeaseAdmin
        preconditions:
          - "LeaseAgreement.status == ACTIVE (ERR_LEASE_NOT_ACTIVE)"
          - "current clock >= start_date + term_weeks * 7 days (ERR_LEASE_TERM_NOT_REACHED)"
        side_effects:
          - "Truck LEASED -> IN_RETURN"
          - "EscrowAccount ACCUMULATING|FULL -> REFUND_PENDING (balance unchanged until disburse)"
          - "All LaneAssignment in ACCEPTED -> COMPLETED; OFFERED -> REVOKED"
          - "LeaseAgreement.version incremented"
      - from: DEFAULTED
        to: COMPLETED
        trigger: "POST /lease-program/buyout-quotes/{id}/accept"
        actor: Driver
        preconditions: ["Buyout acceptance succeeds"]
        side_effects: ["LeaseAgreement.version incremented"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /lease-program/buyout-quotes/{id}/accept"
        actor: Driver
        preconditions: ["Buyout acceptance succeeds"]
        side_effects:
          - "Truck LEASED -> SOLD"
          - "Escrow: applied = min(balance_cents, quoted_price_cents + arrears_cents); balance -= applied; total_applied_cents += applied; EscrowAccount -> CLOSED"
          - "All LaneAssignment in ACCEPTED -> COMPLETED; OFFERED -> REVOKED"
          - "LeaseAgreement.version incremented"

  - entity: EscrowAccount
    initial_state: ACCUMULATING
    terminal_states: [REFUNDED, CLOSED]
    transitions:
      - from: ACCUMULATING
        to: FULL
        trigger: "system: settlement finalize credit makes balance_cents >= lease.escrow_cap_cents"
        actor: system
        preconditions: []
        side_effects: ["LeaseAgreement.escrow_satisfied = true (cascade link 3 of the finalize chain)", "EscrowAccount.version incremented"]
      - from: ACCUMULATING
        to: REFUND_PENDING
        trigger: "POST /lease-program/lease-agreements/{id}/complete"
        actor: LeaseAdmin
        preconditions: []
        side_effects: ["EscrowAccount.version incremented"]
      - from: FULL
        to: REFUND_PENDING
        trigger: "POST /lease-program/lease-agreements/{id}/complete"
        actor: LeaseAdmin
        preconditions: []
        side_effects: ["EscrowAccount.version incremented"]
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "POST /lease-program/escrow-accounts/{id}/disburse"
        actor: SettlementClerk
        preconditions: ["EscrowAccount.status == REFUND_PENDING (ERR_ESCROW_NOT_REFUNDABLE)"]
        side_effects: ["total_refunded_cents += balance_cents; balance_cents -> 0", "EscrowAccount.version incremented"]
      - from: ACCUMULATING
        to: CLOSED
        trigger: "POST /lease-program/lease-agreements/{id}/terminate (no remainder) or POST /lease-program/buyout-quotes/{id}/accept"
        actor: LeaseAdmin
        preconditions: []
        side_effects: ["EscrowAccount.version incremented"]
      - from: FULL
        to: CLOSED
        trigger: "POST /lease-program/lease-agreements/{id}/terminate (no remainder) or POST /lease-program/buyout-quotes/{id}/accept"
        actor: LeaseAdmin
        preconditions: []
        side_effects: ["EscrowAccount.version incremented"]

  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /lease-program/settlement-statements/{id}/issue"
        actor: SettlementClerk
        preconditions:
          - "SettlementStatement.status == DRAFT (ERR_SETTLEMENT_NOT_DRAFT)"
          - "LeaseAgreement.status in {ACTIVE, DEFAULTED} (ERR_LEASE_NOT_ACTIVE)"
        side_effects: ["SettlementStatement.version incremented"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /lease-program/settlement-statements/{id}/dispute"
        actor: Driver
        preconditions:
          - "SettlementStatement.status == ISSUED (ERR_SETTLEMENT_NOT_ISSUED)"
          - "Acting Driver is the lease's owner_operator (ERR_RESOURCE_NOT_OWNED)"
        side_effects: ["SettlementStatement.version incremented"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /lease-program/settlement-statements/{id}/reissue"
        actor: SettlementClerk
        preconditions: ["SettlementStatement.status == DISPUTED (ERR_SETTLEMENT_NOT_DISPUTED)"]
        side_effects:
          - "maintenance_deduction_cents := maintenance_deduction_override_cents (clerk override)"
          - "Waterfall recomputed (escrow, lease payment, net pay, payment_short_flag) under the provisional basis"
          - "SettlementStatement.version incremented"
      - from: ISSUED
        to: FINALIZED
        trigger: "POST /lease-program/settlement-statements/{id}/finalize"
        actor: SettlementClerk
        preconditions:
          - "SettlementStatement.status == ISSUED (ERR_SETTLEMENT_NOT_FINALIZABLE)"
          - "LeaseAgreement.status in {ACTIVE, DEFAULTED} (ERR_LEASE_NOT_ACTIVE)"
        side_effects:
          - "Final variant: maintenance_deduction_cents recomputed from COMPLETED OPERATOR-billed work orders in the week; waterfall recomputed (final basis)"
          - "payment_short_flag computed; when short: LeaseAgreement.missed_payment_count += 1 and arrears_cents += (weekly_payment_cents - lease_payment_applied_cents); total_payments_applied_cents += lease_payment_applied_cents"
          - "Cascade link 1: EscrowAccount.balance_cents += escrow_contribution_cents; total_credited_cents += escrow_contribution_cents"
          - "Cascade link 2 (caused by link 1): if balance_cents >= escrow_cap_cents then EscrowAccount ACCUMULATING -> FULL"
          - "Cascade link 3 (caused by link 2): LeaseAgreement.escrow_satisfied = true"
          - "SettlementStatement.version incremented"
      - from: DRAFT
        to: CANCELLED
        trigger: "system: lease termination cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "system: lease termination cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: CANCELLED
        trigger: "system: lease termination cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LaneAssignment
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, REVOKED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /lease-program/lane-assignments/{id}/accept"
        actor: Driver
        preconditions:
          - "LaneAssignment.status == OFFERED (ERR_LANE_NOT_OFFERED)"
          - "Acting Driver owns the lease (ERR_RESOURCE_NOT_OWNED)"
          - "LeaseAgreement.status in {ACTIVE, DEFAULTED} (ERR_LEASE_NOT_ACTIVE)"
          - "No other ACCEPTED LaneAssignment of the same lease overlaps [start_date, end_date) under half-open semantics (ERR_LANE_WINDOW_OVERLAP)"
          - "weekly_commitment_cents >= 50000 (ERR_LANE_COMMITMENT_BELOW_MIN)"
        side_effects: ["LaneAssignment.version incremented"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /lease-program/lane-assignments/{id}/decline"
        actor: Driver
        preconditions:
          - "LaneAssignment.status == OFFERED (ERR_LANE_NOT_OFFERED)"
          - "Acting Driver owns the lease (ERR_RESOURCE_NOT_OWNED)"
        side_effects: ["LaneAssignment.version incremented"]
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /lease-program/lane-assignments/{id}/revoke or system cascade on declare-default/terminate"
        actor: LeaseAdmin
        preconditions: ["LaneAssignment.status == ACCEPTED (ERR_LANE_NOT_ACCEPTED)"]
        side_effects: ["LaneAssignment.version incremented"]
      - from: OFFERED
        to: REVOKED
        trigger: "system: lease termination cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system: lease completion / buyout-acceptance cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaintenanceWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /lease-program/maintenance-work-orders/{id}/complete"
        actor: MaintenanceCoordinator
        preconditions: ["MaintenanceWorkOrder.status == OPEN (ERR_WORK_ORDER_NOT_OPEN)"]
        side_effects:
          - "billed_to computed (warranty determination, see calculations.maintenance_billed_to)"
          - "completed_at := current logical clock"
          - "Truck.odometer_current := max(odometer_current, odometer_at_service)"
          - "MaintenanceWorkOrder.version incremented"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /lease-program/maintenance-work-orders/{id}/cancel"
        actor: MaintenanceCoordinator
        preconditions: ["MaintenanceWorkOrder.status == OPEN (ERR_WORK_ORDER_NOT_OPEN)"]
        side_effects: ["MaintenanceWorkOrder.version incremented"]

  - entity: ComplianceDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /lease-program/compliance-documents/{id}/verify"
        actor: ComplianceOfficer
        preconditions: ["ComplianceDocument.status == SUBMITTED (ERR_DOC_ALREADY_REVIEWED)"]
        side_effects: ["OwnerOperator.classification_status recomputed"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /lease-program/compliance-documents/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["ComplianceDocument.status == SUBMITTED (ERR_DOC_ALREADY_REVIEWED)"]
        side_effects: ["OwnerOperator.classification_status recomputed"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: evaluated when current logical clock >= expires_on (on read and on classification checks)"
        actor: system
        preconditions: []
        side_effects: ["OwnerOperator.classification_status recomputed (VERIFIED -> FLAGGED)"]

  - entity: BuyoutQuote
    initial_state: GENERATED
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: GENERATED
        to: SUPERSEDED
        trigger: "system: a new BuyoutQuote is created for the same lease"
        actor: system
        preconditions: []
        side_effects: []
      - from: GENERATED
        to: ACCEPTED
        trigger: "POST /lease-program/buyout-quotes/{id}/accept"
        actor: Driver
        preconditions:
          - "BuyoutQuote.status == GENERATED (ERR_QUOTE_NOT_GENERATED)"
          - "current logical clock < expires_on (ERR_QUOTE_EXPIRED)"
          - "Acting Driver owns the lease (ERR_RESOURCE_NOT_OWNED)"
          - "LeaseAgreement.status in {ACTIVE, DEFAULTED} (ERR_LEASE_NOT_ACTIVE)"
        side_effects:
          - "LeaseAgreement ACTIVE|DEFAULTED -> COMPLETED"
          - "Truck LEASED -> SOLD"
          - "Escrow applied per buyout (see LeaseAgreement buyout transition); EscrowAccount -> CLOSED"
          - "LaneAssignments ACCEPTED -> COMPLETED, OFFERED -> REVOKED"
      - from: GENERATED
        to: DECLINED
        trigger: "POST /lease-program/buyout-quotes/{id}/decline"
        actor: Driver
        preconditions:
          - "BuyoutQuote.status == GENERATED (ERR_QUOTE_NOT_GENERATED)"
          - "Acting Driver owns the lease (ERR_RESOURCE_NOT_OWNED)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: buyout-quote-create-stale-lease
    parent_entity: LeaseAgreement
    write_endpoint: "POST /lease-program/buyout-quotes"
    occ_field: expected_lease_version
    description: |
      Creating a BuyoutQuote against a LeaseAgreement whose version has advanced
      since the client last observed it is rejected. A successfully created quote
      supersedes the prior GENERATED quote and bumps the lease version, so a
      second create carrying the previously observed version is operating on a
      stale view of the lease.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deduction_line_amounts
    trigger: "settlement creation (provisional) and every waterfall recompute"
    algorithm: aggregation
    formula: |
      fuel_deduction_cents        = round_half_up(fuel_gallons * fuel_price_cents_per_gallon)   # to whole cents
      maintenance_deduction_cents = round_half_up(miles_driven * MAINT_CPM_CENTS)               # provisional basis
      ROUNDING ORDER (pinned): every deduction line is rounded to whole cents
      individually (round_half_up) BEFORE any summation. The waterfall then sums
      the already-rounded integer-cent lines. Sum-then-round is forbidden.
    input_set: "the settlement's own input fields"
    constants:
      MAINT_CPM_CENTS: 12.5
    precision: "integer cents; round_half_up per line, then sum"

  - name: settlement_waterfall
    trigger: "settlement create (provisional), reissue (provisional with override), finalize (final basis)"
    algorithm: waterfall_allocation
    formula: |
      funds = gross_revenue_cents + guarantee_top_up_cents
      Step 1 fuel:        deduct fuel_deduction_cents            (capped at funds)
      Step 2 insurance:   deduct insurance_weekly_cents          (capped at remaining)
      Step 3 maintenance: deduct maintenance_deduction_cents     (capped at remaining)
      Step 4 escrow:      escrow_contribution_cents = min(escrow_weekly_contribution_cents,
                                                          max(0, escrow_cap_cents - EscrowAccount.balance_cents),
                                                          remaining)
      Step 5 lease:       lease_payment_applied_cents = min(weekly_payment_cents, remaining)
      net_pay_cents = remaining after step 5 (>= 0)
      payment_short_flag = (lease_payment_applied_cents < weekly_payment_cents)
      EVALUATION ORDER (pinned): steps run in the order 1..5 above; escrow is
      senior to the lease payment. guarantee_top_up_cents is computed BEFORE the
      waterfall (see guarantee_top_up) so `funds` is well-defined.
    input_set: "settlement fields + LeaseAgreement terms + EscrowAccount current balance"
    constants:
      MAINT_CPM_CENTS: 12.5
    precision: "integer cents; all steps operate on pre-rounded line amounts"
    variants:
      - name: provisional_basis
        when: "status in {DRAFT, ISSUED, DISPUTED} (create, issue, dispute, reissue)"
        difference: "maintenance_deduction_cents = reserve accrual round_half_up(miles_driven * 12.5); reissue substitutes the clerk's maintenance_deduction_override_cents for this line"
      - name: final_basis
        when: "at the FINALIZE transition"
        difference: "maintenance_deduction_cents = sum of actual_cost_cents of this lease's COMPLETED work orders with billed_to == OPERATOR and completed_at in [week_start_date, week_start_date + 7 days); for identical inputs the two bases generally differ (reserve accrual vs actual billing)"

  - name: guarantee_top_up
    trigger: "computed with settlement_waterfall; recomputed when lane coverage or lease status changes (declare-default cascade)"
    algorithm: threshold
    formula: |
      eligible = (LeaseAgreement.status == ACTIVE)
                 AND (load_declined_flag == false)
                 AND exists LaneAssignment of this lease with status == ACCEPTED
                     and start_date <= week_start_date < end_date      # half-open coverage
      guarantee_top_up_cents = eligible ? max(0, min_revenue_guarantee_weekly_cents - gross_revenue_cents) : 0
      BOUNDARY (pinned): gross_revenue_cents == min_revenue_guarantee_weekly_cents -> top_up 0
    input_set: "settlement + lease + ACCEPTED LaneAssignments covering week_start_date"
    precision: "integer cents"

  - name: escrow_credit_on_finalize
    trigger: "SettlementStatement ISSUED -> FINALIZED"
    algorithm: threshold
    formula: |
      credit = settlement.escrow_contribution_cents   (final waterfall basis)
      balance_cents += credit ; total_credited_cents += credit
      if balance_cents >= lease.escrow_cap_cents: status ACCUMULATING -> FULL
      BOUNDARY (pinned): balance exactly == cap triggers FULL (>= semantics)
    input_set: "the finalizing settlement + its lease's EscrowAccount"
    precision: "integer cents"

  - name: buyout_quote_pricing
    trigger: "POST /lease-program/buyout-quotes"
    algorithm: tiered_pricing
    formula: |
      weeks_elapsed  = floor((current_clock - start_date) / 7 days)   # >= 0
      remaining_weeks = max(0, term_weeks - weeks_elapsed)
      EVALUATION ORDER (pinned — resolves the price/arrears/credit interdependency):
        (1) price:  SCHEDULED -> quoted_price_cents = buyout_base_price_cents
                    EARLY     -> quoted_price_cents = buyout_base_price_cents
                                 + round_half_up(remaining_weeks * weekly_payment_cents * EARLY_FEE_RATE)
        (2) arrears_carried_cents = LeaseAgreement.arrears_cents (snapshot)
        (3) escrow_credit_cents = min(EscrowAccount.balance_cents, quoted_price_cents + arrears_carried_cents)
        (4) amount_due_cents = max(0, quoted_price_cents + arrears_carried_cents - escrow_credit_cents)
      The escrow balance is read at step (3) and is NOT refunded separately when
      a buyout is accepted; acceptance applies it (steps 2-4 make the order total).
    input_set: "lease terms + logical clock + escrow balance + arrears"
    constants:
      EARLY_FEE_RATE: 0.10
      QUOTE_TTL_DAYS: 7
    precision: "integer cents; round_half_up on the early-fee product"
    variants:
      - name: scheduled_term_end
        when: "quote_kind == SCHEDULED (requires clock >= term end)"
        difference: "no early fee: quoted_price_cents == buyout_base_price_cents"
      - name: early_buyout
        when: "quote_kind == EARLY (lease ACTIVE, before term end)"
        difference: "adds round_half_up(remaining_weeks * weekly_payment_cents * 0.10); same lease prices differently than the scheduled variant"

  - name: maintenance_billed_to
    trigger: "MaintenanceWorkOrder OPEN -> COMPLETED"
    algorithm: threshold
    formula: |
      if category == RECALL:     billed_to = CARRIER
      elif category == PREVENTIVE: billed_to = OPERATOR      # preventive care is the operator's duty
      else (REPAIR):
        billed_to = WARRANTY iff odometer_at_service <= truck.powertrain_warranty_mileage_limit
                                 AND scheduled_start <= truck.powertrain_warranty_expires_on
        else OPERATOR
      BOUNDARIES (pinned): mileage equality (<=) stays in warranty; expiry equality (<=) stays in warranty
    input_set: "work order + its lease's truck"
    precision: "n/a (categorical)"

  - name: missed_payment_tracking
    trigger: "settlement finalize (increment/accumulate) and cure-default (reset)"
    algorithm: aggregation
    formula: |
      on FINALIZE with payment_short_flag == true:
        missed_payment_count += 1
        arrears_cents += (weekly_payment_cents - lease_payment_applied_cents)
      on FINALIZE always: total_payments_applied_cents += lease_payment_applied_cents
      on cure-default success: missed_payment_count = 0 ; arrears_cents = 0
      DEFAULT ELIGIBILITY (pinned): missed_payment_count >= DEFAULT_THRESHOLD (>= semantics)
    input_set: "finalizing settlements of the lease"
    constants:
      DEFAULT_THRESHOLD: 3
    precision: "integer cents / integer count"

  - name: bay_window_conflict_check
    trigger: "POST /lease-program/maintenance-work-orders"
    algorithm: interval_merge
    formula: |
      For the target ServiceBay, consider all existing work orders with status in {OPEN, COMPLETED}
      (CANCELLED excluded). A new booking [new_start, new_end) conflicts with an existing
      booking [s, e) unless there is a gap of at least BAY_BUFFER_HOURS between them:
        conflict  iff  NOT ( new_start >= e + BAY_BUFFER_HOURS  OR  new_end <= s - BAY_BUFFER_HOURS )
      BOUNDARY (pinned): gap exactly == BAY_BUFFER_HOURS is allowed (>= semantics)
    input_set: "non-CANCELLED work orders of the same bay"
    constants:
      BAY_BUFFER_HOURS: 2
    precision: "datetime comparison, minute precision"

  - name: lane_window_overlap_check
    trigger: "POST /lease-program/lane-assignments/{id}/accept"
    algorithm: interval_merge
    formula: |
      For the same lease, consider existing LaneAssignments with status == ACCEPTED.
      Windows are half-open [start_date, end_date):
        overlap iff  (new.start_date < existing.end_date) AND (existing.start_date < new.end_date)
      BOUNDARY (pinned): adjacency (new.start_date == existing.end_date) is allowed
    input_set: "ACCEPTED lane assignments of the same lease"
    precision: "date comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles; entity-backed ownership: Driver may act only on resources of the lease whose owner_operator_id == X-User-ID"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    note: "ownership failures return ERR_RESOURCE_NOT_OWNED (403) which shares this priority tier"
  - priority: 3
    category: existence
    check: "Path ids and body FK references exist (validated left-to-right: path first, then body)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target resource state permits the operation (per-endpoint state precondition)"
    error_id: "per-endpoint state error (e.g. ERR_LEASE_NOT_IN_APPLICATION, ERR_SETTLEMENT_NOT_ISSUED)"
    http_status: 409
    applies_to: all action endpoints
  - priority: 5
    category: business_safety
    check: "IC classification: activation requires OwnerOperator.classification_status == VERIFIED (all required docs VERIFIED and unexpired at current clock)"
    error_id: ERR_COMPLIANCE_REQUIREMENTS_UNMET
    http_status: 422
    applies_to: "POST /lease-program/lease-agreements/{id}/activate"
  - priority: 6
    category: business_temporal
    check: "Temporal rules: settlement week inside term (ERR_WEEK_OUT_OF_TERM), week closed (ERR_SETTLEMENT_WEEK_NOT_CLOSED), lane window valid & overlap-free (ERR_INVALID_DATE_RANGE, ERR_LANE_WINDOW_OVERLAP), buyout timing (ERR_BUYOUT_NOT_ELIGIBLE, ERR_QUOTE_EXPIRED), bay buffer (ERR_BAY_WINDOW_CONFLICT)"
    error_id: "temporal errors as listed"
    http_status: 422
    applies_to: "settlement create, lane create/accept, work-order create, buyout create/accept, lease complete"
    note: "ERR_LANE_WINDOW_OVERLAP and ERR_QUOTE_EXPIRED return http 409; the rest in this tier return 422"
  - priority: 7
    category: business_constraint
    check: "Uniqueness: one settlement per (lease_id, week_start_date); truck has at most one non-terminal lease; cdl_number unique; vin unique; bay_code unique"
    error_id: "ERR_DUPLICATE_WEEK_SETTLEMENT | ERR_TRUCK_NOT_AVAILABLE | ERR_DUPLICATE_VALUE"
    http_status: 409
    applies_to: "settlement create, lease create, operator create, truck create, bay create"
  - priority: 8
    category: business_referential
    check: "Cross-entity referential consistency beyond existence: lane lease matches acting driver, work-order lease ACTIVE|DEFAULTED"
    error_id: "ERR_RESOURCE_NOT_OWNED | ERR_LEASE_NOT_ACTIVE"
    http_status: 403
    applies_to: "lane accept/decline, dispute, buyout respond, work-order create"
    note: "ERR_LEASE_NOT_ACTIVE surfaces as 409"
  - priority: 9
    category: business_fiscal
    check: "Fiscal floors/caps: lane weekly_commitment_cents >= 50000; cure payment >= arrears"
    error_id: "ERR_LANE_COMMITMENT_BELOW_MIN | ERR_ARREARS_NOT_CLEARED"
    http_status: 422
    applies_to: "lane accept, cure-default"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- OwnerOperator ---
  - method: POST
    path: "/lease-program/owner-operators"
    description: "Register an owner-operator (independent contractor). classification_status starts PENDING_REVIEW. Unknown extra body fields are ignored."
    roles: [LeaseAdmin]
    code: 201
    input: [legal_name, cdl_number]
    output: OwnerOperator
    side_effects: ["classification_status = PENDING_REVIEW"]
  - method: GET
    path: "/lease-program/owner-operators/{id}"
    description: "Get one owner-operator; classification_status is re-evaluated for doc expiry against the logical clock on read"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: OwnerOperator
    side_effects: []
  # --- Truck ---
  - method: POST
    path: "/lease-program/trucks"
    description: "Add a truck to the fleet (status AVAILABLE). Unknown extra body fields are ignored."
    roles: [LeaseAdmin]
    code: 201
    input: [vin, year, make, model, odometer_current, powertrain_warranty_expires_on, powertrain_warranty_mileage_limit]
    output: Truck
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/lease-program/trucks/{id}"
    description: "Get one truck"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: POST
    path: "/lease-program/trucks/{id}/confirm-return"
    description: "Confirm physical truck return: IN_RETURN -> RETURNED"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: Truck
    side_effects: ["status RETURNED; version incremented"]
  - method: POST
    path: "/lease-program/trucks/{id}/relist"
    description: "Relist a returned truck: RETURNED -> AVAILABLE"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: Truck
    side_effects: ["status AVAILABLE; version incremented"]
  # --- LeaseAgreement ---
  - method: POST
    path: "/lease-program/lease-agreements"
    description: "Create a lease agreement (status APPLICATION) and its EscrowAccount (ACCUMULATING, balance 0). Truck must be AVAILABLE with no other non-terminal lease."
    roles: [LeaseAdmin]
    code: 201
    input: [owner_operator_id, truck_id, start_date, term_weeks, weekly_payment_cents, escrow_weekly_contribution_cents, escrow_cap_cents, buyout_base_price_cents, min_revenue_guarantee_weekly_cents]
    output: LeaseAgreement
    side_effects: ["EscrowAccount created (1:1)", "status = APPLICATION", "version = 1"]
  - method: GET
    path: "/lease-program/lease-agreements"
    description: "List lease agreements with optional filters; paginated per §1.0"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["owner_operator_id?", "truck_id?", "status?", "limit?", "offset?"]
    output: "LeaseAgreement[]"
    side_effects: []
  - method: GET
    path: "/lease-program/lease-agreements/{id}"
    description: "Get one lease agreement"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: []
  - method: POST
    path: "/lease-program/lease-agreements/{id}/activate"
    description: "Activate an APPLICATION lease; requires operator classification VERIFIED; flips truck to LEASED"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status ACTIVE", "Truck AVAILABLE -> LEASED", "version incremented"]
  - method: POST
    path: "/lease-program/lease-agreements/{id}/declare-default"
    description: "Declare default on an ACTIVE lease with missed_payment_count >= 3"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status DEFAULTED", "ACCEPTED lanes REVOKED", "non-final settlements recomputed with guarantee stripped", "version incremented"]
  - method: POST
    path: "/lease-program/lease-agreements/{id}/cure-default"
    description: "Cure a DEFAULTED lease by paying arrears (>= arrears_cents); overpayment flows to escrow (cap-respecting)"
    roles: [LeaseAdmin]
    code: 200
    input: [arrears_payment_cents]
    output: LeaseAgreement
    side_effects: ["status ACTIVE", "arrears 0, missed_payment_count 0", "escrow overpayment credit", "version incremented"]
  - method: POST
    path: "/lease-program/lease-agreements/{id}/terminate"
    description: "Terminate a non-terminal lease; truck to IN_RETURN (when it was LEASED), escrow applied to arrears then REFUND_PENDING/CLOSED, lanes revoked, non-final settlements CANCELLED"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status TERMINATED", "truck IN_RETURN when LEASED", "escrow arrears application", "version incremented"]
  - method: POST
    path: "/lease-program/lease-agreements/{id}/complete"
    description: "Complete an ACTIVE lease at/after term end (no buyout); truck to IN_RETURN, escrow to REFUND_PENDING"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: ["status COMPLETED", "truck IN_RETURN", "escrow REFUND_PENDING", "ACCEPTED lanes COMPLETED", "version incremented"]
  # --- SettlementStatement ---
  - method: POST
    path: "/lease-program/settlement-statements"
    description: "Create a weekly settlement in DRAFT with provisional computed lines (reserve-accrual maintenance). Lease must be ACTIVE or DEFAULTED; week inside term; week closed (clock >= week_start + 7d); unique per (lease, week_start)."
    roles: [SettlementClerk]
    code: 201
    input: [lease_id, week_start_date, gross_revenue_cents, fuel_gallons, fuel_price_cents_per_gallon, insurance_weekly_cents, miles_driven, "load_declined_flag?"]
    output: SettlementStatement
    side_effects: ["provisional waterfall computed", "status = DRAFT"]
  - method: GET
    path: "/lease-program/settlement-statements"
    description: "List settlements; lease_id filter is the FK reverse-lookup"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: "SettlementStatement[]"
    side_effects: []
  - method: GET
    path: "/lease-program/settlement-statements/{id}"
    description: "Get one settlement"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []
  - method: POST
    path: "/lease-program/settlement-statements/{id}/issue"
    description: "Issue a DRAFT settlement to the operator (lease must be ACTIVE or DEFAULTED)"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["status ISSUED", "version incremented"]
  - method: POST
    path: "/lease-program/settlement-statements/{id}/dispute"
    description: "Operator disputes an ISSUED settlement (own lease only)"
    roles: [Driver]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["status DISPUTED", "version incremented"]
  - method: POST
    path: "/lease-program/settlement-statements/{id}/reissue"
    description: "Clerk reissues a DISPUTED settlement with a maintenance deduction override; waterfall recomputed (provisional basis with override line)"
    roles: [SettlementClerk]
    code: 200
    input: [maintenance_deduction_override_cents, "reason?"]
    output: SettlementStatement
    side_effects: ["maintenance_deduction_cents := override", "waterfall recomputed", "status ISSUED", "version incremented"]
  - method: POST
    path: "/lease-program/settlement-statements/{id}/finalize"
    description: "Finalize an ISSUED settlement: final maintenance basis (actual OPERATOR-billed work orders in week), waterfall recompute, escrow credit cascade, missed-payment tracking"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["final-basis recompute", "escrow credit (+ possible FULL flip + lease escrow_satisfied)", "missed/arrears/total_payments updates", "status FINALIZED", "version incremented"]
  # --- EscrowAccount ---
  - method: GET
    path: "/lease-program/escrow-accounts"
    description: "List escrow accounts; lease_id filter is the FK reverse-lookup (1:1 -> array of 0..1)"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["lease_id?", "limit?", "offset?"]
    output: "EscrowAccount[]"
    side_effects: []
  - method: GET
    path: "/lease-program/escrow-accounts/{id}"
    description: "Get one escrow account"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: []
  - method: POST
    path: "/lease-program/escrow-accounts/{id}/disburse"
    description: "Disburse a REFUND_PENDING escrow to the operator: balance -> 0, total_refunded += balance"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: ["status REFUNDED", "total_refunded_cents += prior balance", "balance_cents = 0", "version incremented"]
  # --- LaneAssignment ---
  - method: POST
    path: "/lease-program/lane-assignments"
    description: "Offer a lane to a lease (status OFFERED); end_date must be > start_date"
    roles: [LeaseAdmin]
    code: 201
    input: [lease_id, origin, destination, weekly_commitment_cents, start_date, end_date]
    output: LaneAssignment
    side_effects: ["status = OFFERED"]
  - method: GET
    path: "/lease-program/lane-assignments"
    description: "List lane assignments; lease_id filter is the FK reverse-lookup"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: "LaneAssignment[]"
    side_effects: []
  - method: GET
    path: "/lease-program/lane-assignments/{id}"
    description: "Get one lane assignment"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: LaneAssignment
    side_effects: []
  - method: POST
    path: "/lease-program/lane-assignments/{id}/accept"
    description: "Operator accepts an offered lane: ownership, lease ACTIVE|DEFAULTED, half-open overlap check vs ACCEPTED lanes, commitment floor 50000"
    roles: [Driver]
    code: 200
    input: []
    output: LaneAssignment
    side_effects: ["status ACCEPTED", "version incremented"]
  - method: POST
    path: "/lease-program/lane-assignments/{id}/decline"
    description: "Operator declines an offered lane"
    roles: [Driver]
    code: 200
    input: []
    output: LaneAssignment
    side_effects: ["status DECLINED", "version incremented"]
  - method: POST
    path: "/lease-program/lane-assignments/{id}/revoke"
    description: "Carrier revokes an ACCEPTED lane"
    roles: [LeaseAdmin]
    code: 200
    input: []
    output: LaneAssignment
    side_effects: ["status REVOKED", "version incremented"]
  # --- ServiceBay ---
  - method: POST
    path: "/lease-program/service-bays"
    description: "Register a service bay"
    roles: [MaintenanceCoordinator]
    code: 201
    input: [bay_code, location]
    output: ServiceBay
    side_effects: []
  - method: GET
    path: "/lease-program/service-bays/{id}"
    description: "Get one service bay"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: ServiceBay
    side_effects: []
  # --- MaintenanceWorkOrder ---
  - method: POST
    path: "/lease-program/maintenance-work-orders"
    description: "Book a work order into a bay: lease ACTIVE|DEFAULTED, bay buffer conflict check (2h), scheduled_end > scheduled_start"
    roles: [MaintenanceCoordinator]
    code: 201
    input: [lease_id, service_bay_id, category, description, scheduled_start, scheduled_end, estimated_cost_cents]
    output: MaintenanceWorkOrder
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/lease-program/maintenance-work-orders"
    description: "List work orders; lease_id / service_bay_id filters are the FK reverse-lookups"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["lease_id?", "service_bay_id?", "status?", "limit?", "offset?"]
    output: "MaintenanceWorkOrder[]"
    side_effects: []
  - method: GET
    path: "/lease-program/maintenance-work-orders/{id}"
    description: "Get one work order"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: MaintenanceWorkOrder
    side_effects: []
  - method: POST
    path: "/lease-program/maintenance-work-orders/{id}/complete"
    description: "Complete an OPEN work order: computes billed_to (warranty determination), stamps completed_at = logical clock, raises truck odometer"
    roles: [MaintenanceCoordinator]
    code: 200
    input: [actual_cost_cents, odometer_at_service]
    output: MaintenanceWorkOrder
    side_effects: ["billed_to computed", "completed_at stamped", "Truck.odometer_current := max(prior, odometer_at_service)", "status COMPLETED", "version incremented"]
  - method: POST
    path: "/lease-program/maintenance-work-orders/{id}/cancel"
    description: "Cancel an OPEN work order (frees the bay window)"
    roles: [MaintenanceCoordinator]
    code: 200
    input: []
    output: MaintenanceWorkOrder
    side_effects: ["status CANCELLED", "version incremented"]
  # --- ComplianceDocument ---
  - method: POST
    path: "/lease-program/compliance-documents"
    description: "Submit a compliance document for an operator (status SUBMITTED)"
    roles: [ComplianceOfficer]
    code: 201
    input: [owner_operator_id, doc_type, expires_on]
    output: ComplianceDocument
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/lease-program/compliance-documents"
    description: "List compliance documents; owner_operator_id filter is the FK reverse-lookup. Read evaluates clock-based expiry (VERIFIED -> EXPIRED)."
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["owner_operator_id?", "status?", "limit?", "offset?"]
    output: "ComplianceDocument[]"
    side_effects: ["expiry evaluation against logical clock"]
  - method: GET
    path: "/lease-program/compliance-documents/{id}"
    description: "Get one compliance document (expiry evaluated against logical clock)"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: ["expiry evaluation against logical clock"]
  - method: POST
    path: "/lease-program/compliance-documents/{id}/verify"
    description: "Verify a SUBMITTED document; recomputes the operator's classification_status"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: ["status VERIFIED", "operator classification recomputed"]
  - method: POST
    path: "/lease-program/compliance-documents/{id}/reject"
    description: "Reject a SUBMITTED document; recomputes the operator's classification_status"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ComplianceDocument
    side_effects: ["status REJECTED", "operator classification recomputed"]
  # --- BuyoutQuote ---
  - method: POST
    path: "/lease-program/buyout-quotes"
    description: "Generate a buyout quote (SCHEDULED at/after term end, EARLY any time lease ACTIVE). OCC: expected_lease_version must match the lease's current version. Supersedes prior GENERATED quotes of the lease."
    roles: [LeaseAdmin]
    code: 201
    input: [lease_id, quote_kind, expected_lease_version]
    output: BuyoutQuote
    side_effects: ["prior GENERATED quotes -> SUPERSEDED", "increments LeaseAgreement.version by 1", "expires_on = created_at + 7 days"]
  - method: GET
    path: "/lease-program/buyout-quotes"
    description: "List buyout quotes; lease_id filter is the FK reverse-lookup"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: "BuyoutQuote[]"
    side_effects: []
  - method: GET
    path: "/lease-program/buyout-quotes/{id}"
    description: "Get one buyout quote"
    roles: [LeaseAdmin, SettlementClerk, ComplianceOfficer, MaintenanceCoordinator, Driver]
    code: 200
    input: []
    output: BuyoutQuote
    side_effects: []
  - method: POST
    path: "/lease-program/buyout-quotes/{id}/accept"
    description: "Operator accepts a GENERATED, unexpired quote: lease COMPLETED, truck SOLD, escrow applied and CLOSED, lanes wound down"
    roles: [Driver]
    code: 200
    input: []
    output: BuyoutQuote
    side_effects: ["quote ACCEPTED", "lease COMPLETED", "truck SOLD", "escrow applied -> CLOSED", "lanes COMPLETED/REVOKED"]
  - method: POST
    path: "/lease-program/buyout-quotes/{id}/decline"
    description: "Operator declines a GENERATED quote"
    roles: [Driver]
    code: 200
    input: []
    output: BuyoutQuote
    side_effects: ["quote DECLINED"]
  # --- Test-driving clock ---
  - method: POST
    path: "/lease-program/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default (before any set) is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All date comparisons (doc expiry, week-closed, term end, quote expiry) read this clock."
    roles: [LeaseAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Driver acts on a resource whose lease belongs to a different owner_operator" }
  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end_date <= start_date (lane) or scheduled_end <= scheduled_start (work order)" }
  # --- not found ---
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "OwnerOperator id does not exist" }
  - { id: ERR_TRUCK_NOT_FOUND, http: 404, condition: "Truck id does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "LeaseAgreement id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "SettlementStatement id does not exist" }
  - { id: ERR_ESCROW_NOT_FOUND, http: 404, condition: "EscrowAccount id does not exist" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "LaneAssignment id does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "ServiceBay id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "MaintenanceWorkOrder id does not exist" }
  - { id: ERR_DOC_NOT_FOUND, http: 404, condition: "ComplianceDocument id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "BuyoutQuote id does not exist" }
  # --- state ---
  - { id: ERR_LEASE_NOT_IN_APPLICATION, http: 409, condition: "activate requires status APPLICATION" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "operation requires lease ACTIVE (or ACTIVE|DEFAULTED where noted)" }
  - { id: ERR_LEASE_NOT_DEFAULTED, http: 409, condition: "cure-default requires status DEFAULTED" }
  - { id: ERR_LEASE_NOT_DEFAULT_ELIGIBLE, http: 409, condition: "declare-default requires missed_payment_count >= 3" }
  - { id: ERR_LEASE_ALREADY_TERMINAL, http: 409, condition: "terminate requires non-terminal lease" }
  - { id: ERR_LEASE_TERM_NOT_REACHED, http: 409, condition: "complete requires current clock >= term end" }
  - { id: ERR_TRUCK_NOT_AVAILABLE, http: 409, condition: "lease create requires truck AVAILABLE with no other non-terminal lease" }
  - { id: ERR_TRUCK_NOT_IN_RETURN, http: 409, condition: "confirm-return requires truck IN_RETURN" }
  - { id: ERR_TRUCK_NOT_RETURNED, http: 409, condition: "relist requires truck RETURNED" }
  - { id: ERR_SETTLEMENT_NOT_DRAFT, http: 409, condition: "issue requires settlement DRAFT" }
  - { id: ERR_SETTLEMENT_NOT_ISSUED, http: 409, condition: "dispute/finalize require settlement ISSUED" }
  - { id: ERR_SETTLEMENT_NOT_DISPUTED, http: 409, condition: "reissue requires settlement DISPUTED" }
  - { id: ERR_SETTLEMENT_NOT_FINALIZABLE, http: 409, condition: "finalize requires settlement ISSUED" }
  - { id: ERR_ESCROW_NOT_REFUNDABLE, http: 409, condition: "disburse requires escrow REFUND_PENDING" }
  - { id: ERR_LANE_NOT_OFFERED, http: 409, condition: "accept/decline require lane OFFERED" }
  - { id: ERR_LANE_NOT_ACCEPTED, http: 409, condition: "revoke requires lane ACCEPTED" }
  - { id: ERR_WORK_ORDER_NOT_OPEN, http: 409, condition: "complete/cancel require work order OPEN" }
  - { id: ERR_DOC_ALREADY_REVIEWED, http: 409, condition: "verify/reject require document SUBMITTED" }
  - { id: ERR_QUOTE_NOT_GENERATED, http: 409, condition: "accept/decline require quote GENERATED" }
  # --- temporal / business ---
  - { id: ERR_WEEK_OUT_OF_TERM, http: 422, condition: "week_start_date outside [start_date, start_date + term_weeks*7d)" }
  - { id: ERR_SETTLEMENT_WEEK_NOT_CLOSED, http: 422, condition: "current clock < week_start_date + 7 days" }
  - { id: ERR_DUPLICATE_WEEK_SETTLEMENT, http: 409, condition: "a settlement already exists for (lease_id, week_start_date)" }
  - { id: ERR_DUPLICATE_VALUE, http: 409, condition: "unique field collision (cdl_number, vin, bay_code)" }
  - { id: ERR_LANE_WINDOW_OVERLAP, http: 409, condition: "accept would overlap an ACCEPTED lane of the same lease (half-open windows)" }
  - { id: ERR_LANE_COMMITMENT_BELOW_MIN, http: 422, condition: "accept with weekly_commitment_cents < 50000" }
  - { id: ERR_BAY_WINDOW_CONFLICT, http: 409, condition: "bay booking violates the 2-hour buffer against a non-CANCELLED booking" }
  - { id: ERR_COMPLIANCE_REQUIREMENTS_UNMET, http: 422, condition: "activate requires operator classification VERIFIED" }
  - { id: ERR_ARREARS_NOT_CLEARED, http: 422, condition: "cure payment < arrears_cents" }
  - { id: ERR_BUYOUT_NOT_ELIGIBLE, http: 422, condition: "SCHEDULED quote before term end, or any quote for a non-ACTIVE/DEFAULTED lease" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "accept after quote expires_on" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lease_version does not match the lease's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeaseAdmin
    description: "Carrier lease-program administrator: owns operators, trucks, leases, lane offers, buyout quotes, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /lease-program/owner-operators"
      - "POST /lease-program/trucks (+ confirm-return, relist)"
      - "POST /lease-program/lease-agreements (+ activate, declare-default, cure-default, terminate, complete)"
      - "POST /lease-program/lane-assignments (+ revoke)"
      - "POST /lease-program/buyout-quotes"
      - "POST /lease-program/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SettlementClerk
    description: "Carrier settlement specialist: owns settlement lifecycle and escrow disbursement"
    identity: opaque
    exclusive_operations:
      - "POST /lease-program/settlement-statements (+ issue, reissue, finalize)"
      - "POST /lease-program/escrow-accounts/{id}/disburse"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "IC-classification compliance reviewer: owns compliance document intake and review"
    identity: opaque
    exclusive_operations:
      - "POST /lease-program/compliance-documents (+ verify, reject)"
    shared_operations: ["all GET endpoints"]
  - name: MaintenanceCoordinator
    description: "Shop coordinator: owns service bays and maintenance work orders"
    identity: opaque
    exclusive_operations:
      - "POST /lease-program/service-bays"
      - "POST /lease-program/maintenance-work-orders (+ complete, cancel)"
    shared_operations: ["all GET endpoints"]
  - name: Driver
    description: "The owner-operator acting on their own lease (X-User-ID == OwnerOperator.id)"
    identity: "entity_backed:OwnerOperator"
    exclusive_operations:
      - "POST /lease-program/lane-assignments/{id}/accept and /decline (own lease)"
      - "POST /lease-program/settlement-statements/{id}/dispute (own lease)"
      - "POST /lease-program/buyout-quotes/{id}/accept and /decline (own lease)"
    shared_operations: ["all GET endpoints"]
