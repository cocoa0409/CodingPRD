      - name: occ_version_token_discipline_spans_entity_families
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules[application-submit-stale-right]
          - entities.WaterRight.version
        distinguishing_aspect: >-
          A WaterRight token can be invalidated by a write that arrives through a
          completely different entity family: a bank deposit bumps the right's version,
          so a transfer submit holding a pre-deposit token is refused even though no
          other application touched the right. Reads never advance a version, so the
          only way to recover is to re-read.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's bank-enrolled right certified at 195.00 AF, an empty account ACC, and a DRAFT application APP for 50.00 AF."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_vc: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_vc}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 50.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acc: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acc}", as: WaterRightsAnalyst, captures: {acc_v0: "$.data.version"}}
          trigger:
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v0: "$.data.version"}}
            - {call: "GET /water-rights/${wr}", as: DecisionAuthority, captures: {wr_v0_again: "$.data.version"}}
            - {call: "POST /water-bank-accounts/${acc}/deposits", payload: {water_right_id: "${wr}", deposit_af: 20.00, expected_water_bank_account_version: "${acc_v0}"}, as: Claimant, as_user_id: "${cl_a}"}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v0}"}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
          assert:
            - "Two consecutive reads return the same version (${wr_v0} == ${wr_v0_again}) and differ in nothing else: GET never advances a version, and the role of the reader is irrelevant."
            - "The deposit succeeds (HTTP 200) and bumps BOTH WaterBankAccount.version and WaterRight.version, because it rewrites the right's encumbered/transferable buckets: transferable_af 175.00, encumbered_af 20.00."
            - "Submit holding the pre-deposit token: HTTP 412 ERR_STALE_RIGHT_VERSION, even though the token was read from the right, no other application exists, and 50.00 AF still fits inside the remaining 175.00 AF."
            - "After re-reading, the identical submit succeeds: HTTP 200 with escrowed_af 50.00, transferable_af 125.00, encumbered_af 70.00 (195.00 == 125.00 + 70.00 + 0.00)."
            - "Every successful write in this recipe advances its entity's version by exactly one step and each failed write advances nothing."

      - name: cascade_forfeiture_declaration_unwinds_four_families_in_one_call
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /water-rights/{id}/declare-forfeiture]
          - complexity_profile.complexity_layers.cascading_side_effects
          - calculations.right_volume_ledger
          - calculations.bank_credit_ledger
          - calculations.bank_posture
        distinguishing_aspect: >-
          One call unwinds four entity families at once and each link has a different
          shape: the right is zeroed (and becomes exempt from its own ledger identity),
          the pending application is DENIED with its escrow released, the RESERVED lease
          is CANCELLED through the settlement calculation, and the imposed mitigation
          condition is RELEASED with its OUTSTANDING fee REVERSED — which drives the
          holder's balance to exactly 0.00, repairs DELINQUENT standing and therefore
          flips the bank account's posture from RESTRICTED to OPEN. The already-terminal
          protest is deliberately untouched.
