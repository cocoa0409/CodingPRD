          trigger:
            - call: "POST /commissioning-packages/${pkg1_id}/witness"
              payload: { decision: "WITNESSED", witness_note: "Second run complete, sheet 3 signed." }
              as: WitnessAuthority
              as_user_id: "u-wa-1"
          assert:
            - "CommissioningPackage.${pkg1_id}.script_status == EXECUTED"
            - "CommissioningPackage.${pkg1_id}.witness_status == WITNESSED"
            - "CommissioningPackage.${pkg1_id}.package_state == CERTIFIED"
            - "CommissioningPackage.${pkg1_id}.executed_by_user_id == u-ca-1 and CommissioningPackage.${pkg1_id}.witnessed_by_user_id == u-wa-1"
            - "CommissioningPackage.${pkg1_id}.script_revision == 1 (the witness rejection never touched the approved script revision)"
            - "Hall.${hall_id}.status == COMMISSIONING (no L4 and no L5 package exists, so the LIVE evaluation does not fire)"
            - "GET /commissioning-packages?hall_id=${hall_id} returns exactly 1 package, whose package_state is CERTIFIED and whose level is L1 — the LIVE precondition demanding both L4 and L5 is unmet"

  - rule_id: transitive_cascade
    instances:

      - name: mop_execute_busway_isolation_cascade_depth_four
        grounds:
          - state_machines.MethodOfProcedure.SCHEDULED_to_IN_EXECUTION
          - state_machines.Busway.ENERGIZED_to_ISOLATED
          - state_machines.RackFeed.ENERGIZED_to_DERATED
          - state_machines.Rack.POWERED_to_AT_RISK
          - state_machines.Cage.SECURED_to_DEGRADED
          - calculations.rack_custody_partition
          - calculations.hall_release_posture
        distinguishing_aspect: |
          One write — POST /mops/{id}/execute — propagates through four further entity types without any
          additional call: Busway ENERGIZED -> ISOLATED (link 2), that busway's ENERGIZED RackFeed ->
          DERATED (link 3), the feed's Rack POWERED -> AT_RISK because energized_feed_count fell below
          required_feed_count (link 4), and that rack's Cage SECURED -> DEGRADED (link 5). The chain is
          depth 4 and every hop is conditional on the previous hop's post-state, so a shallower
          implementation that only isolates the busway leaves rack, cage and custody counters wrong.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Hall HI1 (SINGLE_TENANT, design_kw_capacity 400.00, cooling_redundancy N) has reached COMMISSIONING through the full fit-out chain; both PDUs carry measured_derate_factor 1.00 so each busway's COMMISSIONED usable_kw is 196.66."
            - "Rack R-1-1 (design_kw 15.00, required_feed_count 2, cage CG-1, tenant T1) is POWERED on a 7.50 kW ENERGIZED feed per side: FEED-A on BW-A1, FEED-B on BW-B1."
            - "Cage CG-1 (perimeter 40.0 m) is SECURED: camera CAM-1 covers 38.0 m (camera_coverage_pct 95.00 against the 95.00 default) and card readers RDR-N / RDR-S arm the two distinct zones Z-N and Z-S."
