            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/assets/${tx_id}/reject-basis"
              payload: { rejected_reason_code: "DELIVERING_FIRM_SENT_NO_BASIS" }
              as: CustodyOperationsOfficer
          assert:
            - "AssetTransfer.${tx_id}.transfer_status == REJECTED"
            - "AssetTransfer.${tx_id}.carryover_cents == 0 and cost_basis_complete == false"
            - "GET /ria/asset-transfers/${tx_id}/lots returns two rows whose basis_appraisal_cents are both null"
            - "Household.${h_id}.household_fee_basis_cents == 0"
            - "HouseholdAccount.${acct_id}.account_status is still OPEN and its last_listed_cents is null"

      - name: block_order_unallocated_revert_after_account_unfreeze
        claim_type: Cascade down
        grounds:
