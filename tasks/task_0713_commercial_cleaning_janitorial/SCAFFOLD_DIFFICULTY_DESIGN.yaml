          - state_machines.StartupPlan.READY_to_LIVE
          - state_machines.CleaningContract.STARTUP_to_SERVICING
          - entities.Account.fields.lifecycle_stage
          - entities.CleaningContract.fields.billing_status
        distinguishing_aspect: |
          Depth>=3 chain from go-live: StartupPlan READY->LIVE causes CleaningContract
          STARTUP->SERVICING, which itself causes Account PROSPECT->ACTIVE_CUSTOMER and
          billing PENDING->ACTIVE — each hop caused by the prior, not the original trigger.
        test_recipe:
          setup:
            - "A READY StartupPlan whose contract is in STARTUP, account PROSPECT, billing PENDING."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Cascade Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
