        distinguishing_aspect: |
          Entity pair (ReaderEvent, Reader) - a third distinct pair: the event body is
          valid and the event type is operator-writable, but the write is refused
          because the parent Reader's computed churn_risk_band is LOW (score 30.00),
          i.e. the gate is a derived state of the parent, not a field of the child.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One registered reader with 6 COMMENT_POST events occurring 2026-09-01 (6 x 5 x 1.0 = 30.00), so churn_risk_band is LOW (>= CHURN_MEDIUM_BELOW 30) and intervention_count_in_period is 0."
