              payload: { hardware_sku: "TREAD", zone: "RURAL", stair_flights: 4, has_elevator: false, assembly_required: true }
              as: ServiceTechnician
              captures: { q_delivery: $.data.delivery_fee_cents, q_stair: $.data.stair_carry_fee_cents, q_total: $.data.quote_total_cents }
          assert:
            - "the quote's delivery_fee_cents == 9000 (captured as ${q_delivery}), the RURAL 3-leg charge"
            - "the quote's stair_carry_fee_cents == 1087 (captured as ${q_stair}) == round_half_up(500 * 1.0825) + round_half_up(2 * 250 * 1.0825)"
            - "GET /fitness/hardware-orders and GET /fitness/delivery-appointments both still return 0 rows, so the quote wrote nothing"
            - "the same quote with has_elevator true reports 813 == round_half_up(500 * 1.0825) + round_half_up(1 * 250 * 1.0825)"

      - name: delivery_appointment_scheduling_is_conditional_on_state_and_window
        claim_type: Conditional action
        grounds:
          - state_machines.DeliveryAppointment.REQUESTED_to_SCHEDULED
          - errors[ERR_WINDOW_NOT_OPEN]
          - errors[ERR_TEMPORAL_OVERLAP]
        distinguishing_aspect: "Scheduling is conditional on state and window: a REQUESTED appointment schedules once, an already SCHEDULED one refuses a repeat, and a window before the clock cannot start a visit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T12:00:00Z. One delivered linked device with a REQUESTED appointment window from 2026-09-05T13:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
          trigger:
            - call: "POST /fitness/delivery-appointments/${a_id}/start"
              payload: {}
              as: ServiceTechnician
              captures: { err_early: $.data.error_id }
            - call: "POST /fitness/delivery-appointments/${a_id}/schedule"
              payload: { start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z" }
              as: ServiceTechnician
              captures: { sch_state: $.data.status }
            - call: "POST /fitness/delivery-appointments/${a_id}/schedule"
              payload: { start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z" }
