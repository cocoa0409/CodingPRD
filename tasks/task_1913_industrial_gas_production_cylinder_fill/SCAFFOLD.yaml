# =============================================================================
# Task 1913: Industrial Gas Production & Cylinder Fill (Airgas production plant)
# Scaffold seed tables (v1)
# =============================================================================

scenario: |
  1913. Industrial Gas Production & Cylinder Fill (Airgas production plant): plant
  production & liquid inventory telemetry, cylinder asset tracking & hydrostatic
  retest due, fill lot & purity analysis, customer rental/demurrage billing, hazmat
  delivery route & driver certification, bulk tank installation & telemetry
  replenishment, gas mixture custom blend, cylinder loss & retirement

domain_name: industrial-gas-cylinder-fill
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: quota / allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat            # peer resources joined by FK references; no nested write paths
  state_machine_shape: cyclic      # rework loops, recall loops, credit-hold loops; hydro_status is an independent derived dimension on CylinderAsset
  relationship_patterns:
    - one_to_many
    - polymorphic                  # TelemetryReading targets StorageTank XOR BulkInstallation; PurityAnalysis targets FillLot XOR BlendOrder
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: expert_plus
  entity_count: 14
  state_machine_count: 12
  calculation_count: 11
  endpoint_count: 72
  error_code_count: 31
  role_count: 7

# =============================================================================
# Table 1 (§1.1): Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: plant_name, type: string, source: input, description: "Display name of the production plant" }
      - { name: status, type: enum, source: system, description: "OPERATING | MAINTENANCE_SHUTDOWN; gates all production transitions (start-fill, complete-fill, start-blend, complete-blend)" }

  - name: StorageTank
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; owning plant" }
      - { name: product_code, type: enum, source: input, description: "O2 | N2 | AR | CO2 | H2 | HE; cryogenic product stored" }
      - { name: capacity_liters, type: integer, source: input, description: "Maximum liquid capacity in liters; must be > 0" }
      - { name: initial_level_liters, type: integer, source: input, description: "Level seeded as an INITIAL_LOAD TelemetryReading measured at creation clock time; 0 <= value <= capacity_liters" }
      - { name: reorder_point_liters, type: integer, source: input, description: "Informational low-level threshold; 0 <= value <= capacity_liters" }
      - { name: current_level_liters, type: number, source: computed, description: "Latest TelemetryReading by measured_at (tie-break: created_at later wins) minus drawn_liters; recomputed on every reading and every fill/blend draw; any new reading that becomes latest resets drawn_liters to 0" }
      - { name: reserved_liters, type: number, source: system, description: "Sum of draw_estimate_liters for lots currently in FILLING on this tank; incremented at start-fill, released at complete-fill or vent" }
      - { name: drawn_liters, type: number, source: system, default: 0, description: "Physical liquid drawn since the latest telemetry reading; incremented by complete-fill / complete-blend, decremented by vent after complete-fill, reset to 0 when a new latest reading arrives" }
      - { name: low_level_flag, type: boolean, source: computed, description: "true when current_level_liters <= reorder_point_liters; recomputed whenever current_level_liters changes" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | MAINTENANCE | QUARANTINED" }

  - name: TelemetryReading
    parent: null
    common_fields: false
    fields:
      - { name: tank_id, type: string, source: input, description: "FK -> StorageTank.id; exactly one of tank_id / installation_id must be present" , constraints: "nullable" }
      - { name: installation_id, type: string, source: input, description: "FK -> BulkInstallation.id; exactly one of tank_id / installation_id must be present", constraints: "nullable" }
      - { name: measured_level_liters, type: number, source: input, description: "Measured liquid level; 0 <= value <= owner capacity_liters" }
      - { name: measured_at, type: datetime, source: input, description: "When the measurement was taken; must not be later than the logical clock" }
      - { name: source, type: enum, source: input, description: "IOT_SENSOR | MANUAL_DIP | INITIAL_LOAD | SYSTEM_REPLENISHMENT" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the actor who posted the reading" }

  - name: CylinderAsset
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Globally unique cylinder serial; duplicates rejected with ERR_DUPLICATE_CYLINDER_SERIAL" }
      - { name: size_code, type: enum, source: input, description: "SMALL | STANDARD | LARGE; indexes SIZE_SPECS for water capacity and loss fee" }
      - { name: service_gas, type: enum, source: input, description: "O2 | N2 | AR | CO2 | H2 | HE; gas service the cylinder is dedicated to" }
      - { name: water_capacity_liters, type: integer, source: computed, description: "From SIZE_SPECS[size_code]: SMALL 10, STANDARD 50, LARGE 100; client input ignored" }
      - { name: last_hydro_date, type: string, source: input, description: "ISO date of last passed hydrostatic test" }
      - { name: hydro_due_date, type: string, source: computed, description: "last_hydro_date + HYDRO_INTERVAL_MONTHS[service_gas], day clamped to month end (CO2: 6 months; all others: 12 months)" }
      - { name: hydro_status, type: enum, source: computed, description: "Independent derived dimension vs the logical clock date: OVERDUE when today > hydro_due_date; DUE_SOON when 0 <= days_to_due <= 30; else COMPLIANT. Due exactly today is DUE_SOON and still fillable" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | RESERVED | FILLED | ON_RENT | QUARANTINED | LOST | RETIRED" }
      - { name: current_fill_lot_id, type: string, source: system, description: "FK -> FillLot.id; set while RESERVED into a lot, cleared at release/vent/unassign", constraints: "nullable" }
      - { name: last_fill_lot_id, type: string, source: system, description: "FK -> FillLot.id; provenance of the lot that most recently filled this cylinder; set at lot release and never cleared; drives recall targeting", constraints: "nullable" }

  - name: FillLot
    parent: null
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: input, description: "FK -> StorageTank.id; source tank for the fill" }
      - { name: product_code, type: enum, source: input, description: "O2 | N2 | AR | CO2 | H2 | HE; must equal the tank's product_code (else ERR_PRODUCT_SERVICE_MISMATCH)" }
      - { name: target_fill_pressure_bar, type: integer, source: input, description: "Target fill pressure; must be > 0" }
      - { name: draw_estimate_liters, type: number, source: computed, description: "PROVISIONAL variant of fill_draw_liters; recomputed on every cylinder assign/unassign using STANDARD_RESIDUAL_BAR = 5; 0 when no cylinders assigned" }
      - { name: draw_actual_liters, type: number, source: computed, description: "FINAL variant of fill_draw_liters from measured per-cylinder residual pressures; null until complete-fill", constraints: "nullable" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionOperator who ran complete-fill; segregation anchor", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | FILLING | AWAITING_ANALYSIS | RELEASED | ANALYSIS_FAILED | RECALLED | VENTED" }

  - name: PurityAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "FILL_LOT | BLEND_ORDER; selects which of fill_lot_id / blend_order_id must be present" }
      - { name: fill_lot_id, type: string, source: input, description: "FK -> FillLot.id; required when subject_type = FILL_LOT", constraints: "nullable" }
      - { name: blend_order_id, type: string, source: input, description: "FK -> BlendOrder.id; required when subject_type = BLEND_ORDER", constraints: "nullable" }
      - { name: readings, type: array, source: input, description: "FILL_LOT: [{analyte, reading_ppm}] graded against GRADE_LIMITS_PPM[lot.product_code]. BLEND_ORDER: [{product_code, actual_pct}] graded against blend component targets/tolerances" }
      - { name: result, type: enum, source: computed, description: "PASS | MARGINAL | FAIL | PASS_OVERRIDE; worst band across readings; PASS/PASS_OVERRIDE releases the subject, MARGINAL awaits override, FAIL fails the subject" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the LabAnalyst; must differ from the subject's completed_by/blended_by user" }
      - { name: overridden_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who overrode a MARGINAL result; must differ from recorded_by_user_id", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "RECORDED | OVERRIDDEN" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Customer display name" }
      - { name: billing_variant, type: enum, source: input, description: "CALENDAR_DAY | GRACE_PERIOD; selects the rental_final_charge variant" }
      - { name: free_days, type: integer, source: input, description: "Free rental days deducted under GRACE_PERIOD; >= 0; ignored under CALENDAR_DAY" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit limit; > 0. Rentals rejected when outstanding + estimated charge > limit (equality allowed)" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Posted charges minus payments; mutated by rental return/settle-loss, billing-run post, and payments" }
      - { name: recall_flag, type: boolean, source: system, default: false, description: "Set true when any rental of this account enters RECALL_HOLD; cleared only by billing-run post when no RECALL_HOLD rentals remain" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD" }

  - name: CylinderRental
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: cylinder_id, type: string, source: input, description: "FK -> CylinderAsset.id; must be FILLED and not hydro OVERDUE" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Daily rental rate; > 0" }
      - { name: planned_days, type: integer, source: input, description: "Planned rental length in whole days; > 0; due_date = out_date + planned_days" }
      - { name: out_date, type: string, source: system, description: "Logical clock date at creation" }
      - { name: due_date, type: string, source: computed, description: "out_date + planned_days days" }
      - { name: return_date, type: string, source: system, description: "Logical clock date at return; null while out", constraints: "nullable" }
      - { name: billed_through_date, type: string, source: system, description: "Demurrage billed through this date (exclusive start of next accrual); initialized to due_date" }
      - { name: demurrage_billed_cents, type: integer, source: system, default: 0, description: "Cumulative demurrage charged by billing runs for this rental" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Variant base charge + demurrage through return_date minus demurrage_billed_cents; set at return or settle-loss", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OVERDUE | RECALL_HOLD | RETURNED | LOST_SETTLED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: driver_name, type: string, source: input, description: "Driver display name" }
      - { name: cdl_class, type: enum, source: input, description: "A | B commercial license class" }
      - { name: hazmat_endorsements, type: array, source: input, description: "[{endorsement_class, expiry_date}]; endorsement_class in FLAMMABLE_GAS | NONFLAMMABLE_GAS | OXIDIZER | POISON_GAS | CRYOGENIC" }
      - { name: medical_card_expiry, type: string, source: input, description: "ISO date; driver is CERT_EXPIRED when the logical clock date is later" }
      - { name: status, type: enum, source: system, description: "QUALIFIED | SUSPENDED | CERT_EXPIRED" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_date, type: string, source: input, description: "ISO date the route runs" }
      - { name: window_start_hour, type: integer, source: input, description: "Route window start hour 0-23; half-open interval [window_start_hour, window_end_hour)" }
      - { name: window_end_hour, type: integer, source: input, description: "Route window end hour 1-24; must be > window_start_hour" }
      - { name: stops, type: array, source: input, description: "[{stop_name, hazmat_classes[]}] ordered stops; hazmat_classes drawn from the endorsement enum; at least one stop required" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; null until assign-driver; cleared when a driver-cert cascade unassigns", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PLANNED | DRIVER_ASSIGNED | DISPATCHED | COMPLETED | CANCELLED" }

  - name: BulkInstallation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning customer site" }
      - { name: product_code, type: enum, source: input, description: "O2 | N2 | AR | CO2 | H2 | HE" }
      - { name: capacity_liters, type: integer, source: input, description: "Tank capacity; > 0" }
      - { name: initial_level_liters, type: integer, source: input, description: "Level seeded as an INITIAL_LOAD TelemetryReading at creation; 0 <= value <= capacity_liters" }
      - { name: reorder_point_liters, type: integer, source: input, description: "Auto-replenishment trigger level; 0 <= value <= capacity_liters" }
      - { name: max_order_qty_liters, type: integer, source: input, description: "Customer cap per replenishment delivery; > 0" }
      - { name: current_level_liters, type: number, source: computed, description: "Latest TelemetryReading by measured_at (tie-break: created_at later wins)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | INSTALLED | ACTIVE | PAUSED | DECOMMISSIONED" }

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> BulkInstallation.id" }
      - { name: scheduled_delivery_at, type: datetime, source: input, description: "Planned delivery instant; must be >= the installation's last DELIVERED order's delivered_at + MIN_REPLENISHMENT_GAP_HOURS (24)" }
      - { name: requested_qty_liters, type: number, source: computed, description: "min(capacity - current_level, TRUCK_CAPACITY_LITERS = 20000, max_order_qty_liters) evaluated at creation; must be > 0" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical clock instant when marked DELIVERED", constraints: "nullable" }
      - { name: superseded_by_order_id, type: string, source: system, description: "Set when a newer PENDING order supersedes this one", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | DELIVERED | CANCELLED | SUPERSEDED" }

  - name: BlendOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: batch_qty_liters, type: integer, source: input, description: "Total blend batch size; > 0" }
      - { name: components, type: array, source: input, description: "[{product_code, target_pct, tolerance_pct, unit_cost_cents_per_liter}]; target_pct values rounded to 2dp must sum to exactly 100.00; server stamps selected_tank_id per component at start-blend" }
      - { name: component_cost_cents, type: integer, source: computed, description: "sum over components of round_half_up(target_pct/100 * batch_qty_liters * unit_cost_cents_per_liter, 0); computed at creation" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Fee tier keyed ONLY on component_cost_cents (never on total): < 100000 -> 15000 flat; 100000..499999 -> round_half_up(12% of component_cost_cents, 0); >= 500000 -> round_half_up(10% of component_cost_cents, 0)" }
      - { name: total_price_cents, type: integer, source: computed, description: "component_cost_cents + service_fee_cents; evaluation order pinned: cost first, fee from cost, total last" }
      - { name: blended_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionOperator who ran complete-blend; segregation anchor", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | BLENDING | AWAITING_ANALYSIS | RELEASED | REWORK" }

  - name: BillingRun
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "ISO date; must be <= period_end" }
      - { name: period_end, type: string, source: input, description: "ISO date; demurrage accrues through this date inclusive" }
      - { name: charge_lines, type: array, source: computed, description: "One line per rental accrued: [{rental_id, customer_id, overdue_days, demurrage_cents}] with demurrage_cents rounded per tier segment per line (round_half_up), never summed-then-rounded; populated at finalize" }
      - { name: total_charges_cents, type: integer, source: computed, description: "Sum of charge_lines[].demurrage_cents after per-line rounding" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | POSTED" }

# =============================================================================
# Table 2 (§1.2): State Machine Table
# =============================================================================
state_machines:
  - entity: Plant
    initial_state: OPERATING
    terminal_states: []
    transitions:
      - from: OPERATING
        to: MAINTENANCE_SHUTDOWN
        trigger: "POST /api/plants/{plantId}/set-status {target_status: MAINTENANCE_SHUTDOWN}"
        actor: PlantManager
        preconditions:
          - "Plant must be OPERATING (else ERR_PLANT_NOT_OPERATING is not raised; wrong-from-state yields ERR_INVALID_REQUEST against the machine)"
        side_effects:
          - "Blocks all subsequent start-fill / complete-fill / start-blend / complete-blend with ERR_PLANT_NOT_OPERATING"
          - "Increments Plant.version by 1"
      - from: MAINTENANCE_SHUTDOWN
        to: OPERATING
        trigger: "POST /api/plants/{plantId}/set-status {target_status: OPERATING}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "Re-enables production transitions"
          - "Increments Plant.version by 1"

  - entity: StorageTank
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: MAINTENANCE
        trigger: "POST /api/tanks/{tankId}/set-status {target_status: MAINTENANCE}"
        actor: PlantManager
        preconditions:
          - "No FillLot on this tank may be in FILLING or AWAITING_ANALYSIS (else ERR_FILL_LOT_INVALID_STATE)"
        side_effects:
          - "Blocks start-fill with ERR_TANK_NOT_IN_SERVICE while MAINTENANCE"
          - "Increments StorageTank.version by 1"
      - from: MAINTENANCE
        to: IN_SERVICE
        trigger: "POST /api/tanks/{tankId}/set-status {target_status: IN_SERVICE}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "Increments StorageTank.version by 1"
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /api/tanks/{tankId}/set-status {target_status: QUARANTINED}"
        actor: PlantManager
        preconditions:
          - "No FillLot on this tank may be in FILLING or AWAITING_ANALYSIS (else ERR_FILL_LOT_INVALID_STATE)"
        side_effects:
          - "Blocks start-fill with ERR_TANK_NOT_IN_SERVICE while QUARANTINED"
          - "Increments StorageTank.version by 1"
      - from: QUARANTINED
        to: IN_SERVICE
        trigger: "POST /api/tanks/{tankId}/set-status {target_status: IN_SERVICE}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "Increments StorageTank.version by 1"

  - entity: CylinderAsset
    initial_state: IN_STOCK
    terminal_states: [LOST, RETIRED]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "POST /api/fill-lots/{fillLotId}/cylinders"
        actor: ProductionOperator
        preconditions:
          - "FillLot must be PLANNED (else ERR_FILL_LOT_INVALID_STATE)"
          - "Cylinder must be IN_STOCK (else ERR_CYLINDER_NOT_AVAILABLE)"
          - "hydro_status must not be OVERDUE at the logical clock date (else ERR_HYDRO_RETEST_OVERDUE; due exactly today is allowed)"
          - "Cylinder service_gas must equal FillLot.product_code (else ERR_PRODUCT_SERVICE_MISMATCH)"
        side_effects:
          - "current_fill_lot_id = lot id"
          - "Recompute FillLot.draw_estimate_liters (PROVISIONAL variant) including LINE_LOSS_LITERS once at least one cylinder is assigned"
          - "Increments CylinderAsset.version and FillLot.version by 1"
      - from: RESERVED
        to: IN_STOCK
        trigger: "POST /api/fill-lots/{fillLotId}/vent (before complete-fill) or POST /api/fill-lots/{fillLotId}/rework is NOT this path; vent releases reservations"
        actor: ProductionOperator
        preconditions:
          - "Lot in PLANNED, FILLING, AWAITING_ANALYSIS, or ANALYSIS_FAILED"
        side_effects:
          - "current_fill_lot_id cleared; cylinder returns to IN_STOCK"
      - from: RESERVED
        to: FILLED
        trigger: "system (PurityAnalysis PASS or PASS_OVERRIDE recorded on the lot)"
        actor: system
        preconditions: []
        side_effects:
          - "current_fill_lot_id cleared; last_fill_lot_id = lot id (provenance, never cleared)"
      - from: RESERVED
        to: QUARANTINED
        trigger: "system (PurityAnalysis FAIL recorded on the lot)"
        actor: system
        preconditions: []
        side_effects:
          - "Cylinder remains linked (current_fill_lot_id kept) so rework can de-quarantine it"
      - from: QUARANTINED
        to: RESERVED
        trigger: "POST /api/fill-lots/{fillLotId}/rework on the failed lot"
        actor: ProductionOperator
        preconditions:
          - "Only cylinders whose current_fill_lot_id == the reworked lot"
        side_effects: []
      - from: QUARANTINED
        to: IN_STOCK
        trigger: "POST /api/cylinders/{cylinderId}/release-quarantine"
        actor: QualityManager
        preconditions:
          - "Cylinder must be QUARANTINED and its current_fill_lot_id must be null or reference a lot in VENTED/RECALLED state (else ERR_CYLINDER_NOT_AVAILABLE)"
        side_effects:
          - "current_fill_lot_id cleared"
      - from: FILLED
        to: ON_RENT
        trigger: "POST /api/rentals"
        actor: BillingClerk
        preconditions:
          - "Cylinder must be FILLED (else ERR_CYLINDER_NOT_AVAILABLE)"
          - "hydro_status must not be OVERDUE (else ERR_HYDRO_RETEST_OVERDUE)"
        side_effects: []
      - from: IN_STOCK
        to: QUARANTINED
        trigger: "POST /api/cylinders/{cylinderId}/hydro-retests with result FAIL"
        actor: ProductionOperator
        preconditions:
          - "Cylinder must be IN_STOCK or QUARANTINED (else ERR_CYLINDER_NOT_AVAILABLE)"
        side_effects:
          - "Increments CylinderAsset.version by 1"
      - from: FILLED
        to: QUARANTINED
        trigger: "system (POST /api/fill-lots/{fillLotId}/recall where last_fill_lot_id == lot)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_RENT
        to: IN_STOCK
        trigger: "POST /api/rentals/{rentalId}/return with return_condition OK"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: ON_RENT
        to: QUARANTINED
        trigger: "POST /api/rentals/{rentalId}/return with return_condition DAMAGED, OR return of a RECALL_HOLD rental, OR system recall of the cylinder's last fill lot"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: LOST
        trigger: "POST /api/cylinders/{cylinderId}/decommission {disposition: LOST}"
        actor: QualityManager
        preconditions:
          - "Cylinder must be IN_STOCK or QUARANTINED (else ERR_CYLINDER_NOT_AVAILABLE)"
        side_effects: []
      - from: QUARANTINED
        to: LOST
        trigger: "POST /api/cylinders/{cylinderId}/decommission {disposition: LOST}"
        actor: QualityManager
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: RETIRED
        trigger: "POST /api/cylinders/{cylinderId}/decommission {disposition: RETIRED}"
        actor: QualityManager
        preconditions:
          - "Cylinder must be IN_STOCK or QUARANTINED (else ERR_CYLINDER_NOT_AVAILABLE)"
        side_effects: []
      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /api/cylinders/{cylinderId}/decommission {disposition: RETIRED}"
        actor: QualityManager
        preconditions: []
        side_effects: []
      - from: ON_RENT
        to: LOST
        trigger: "POST /api/rentals/{rentalId}/settle-loss"
        actor: BillingClerk
        preconditions:
          - "Rental must be ACTIVE or OVERDUE (else ERR_RENTAL_NOT_ACTIVE)"
        side_effects:
          - "Loss fee and accrued charges posted per settle-loss; see CylinderRental"
    note: "hydro_status is a second, independent derived dimension (COMPLIANT/DUE_SOON/OVERDUE) evaluated against the logical clock; it never appears in status but gates IN_STOCK->RESERVED and FILLED->ON_RENT"

  - entity: FillLot
    initial_state: PLANNED
    terminal_states: [VENTED, RECALLED]
    transitions:
      - from: PLANNED
        to: FILLING
        trigger: "POST /api/fill-lots/{fillLotId}/start-fill"
        actor: ProductionOperator
        preconditions:
          - "Plant of the lot's tank must be OPERATING (else ERR_PLANT_NOT_OPERATING)"
          - "Tank must be IN_SERVICE (else ERR_TANK_NOT_IN_SERVICE)"
          - "At least one cylinder RESERVED into this lot (else ERR_LOT_HAS_NO_CYLINDERS)"
          - "current_level_liters - reserved_liters >= draw_estimate_liters + MIN_TANK_RESERVE_LITERS (100); equality allowed (else ERR_TANK_LEVEL_TOO_LOW)"
        side_effects:
          - "Tank.reserved_liters += draw_estimate_liters"
          - "Recompute tank low_level_flag"
          - "Increments FillLot.version and StorageTank.version by 1"
      - from: FILLING
        to: AWAITING_ANALYSIS
        trigger: "POST /api/fill-lots/{fillLotId}/complete-fill"
        actor: ProductionOperator
        preconditions:
          - "Plant must be OPERATING (else ERR_PLANT_NOT_OPERATING)"
          - "Lot must be FILLING (else ERR_FILL_LOT_INVALID_STATE)"
        side_effects:
          - "Compute draw_actual_liters (FINAL variant) from measured residual pressures"
          - "Tank.reserved_liters -= draw_estimate_liters; Tank.drawn_liters += draw_actual_liters"
          - "Recompute tank.current_level_liters and low_level_flag (derived-field reconciliation of the PROVISIONAL reservation to the FINAL actual)"
          - "completed_by_user_id = X-User-ID"
          - "Increments FillLot.version and StorageTank.version by 1"
      - from: AWAITING_ANALYSIS
        to: RELEASED
        trigger: "system (PurityAnalysis with result PASS, or PASS_OVERRIDE via override)"
        actor: system
        preconditions: []
        side_effects:
          - "All cylinders RESERVED into this lot: status FILLED, current_fill_lot_id cleared, last_fill_lot_id = lot id"
          - "Increments FillLot.version and each cylinder's version by 1"
      - from: AWAITING_ANALYSIS
        to: ANALYSIS_FAILED
        trigger: "system (PurityAnalysis with result FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: this transition is caused by the FAIL analysis"
          - "Cascade link 2: all cylinders RESERVED into this lot -> QUARANTINED (current_fill_lot_id kept)"
          - "Increments FillLot.version and each cylinder's version by 1"
      - from: ANALYSIS_FAILED
        to: FILLING
        trigger: "POST /api/fill-lots/{fillLotId}/rework"
        actor: ProductionOperator
        preconditions:
          - "Lot must be ANALYSIS_FAILED (else ERR_FILL_LOT_INVALID_STATE)"
          - "Plant must be OPERATING (else ERR_PLANT_NOT_OPERATING)"
        side_effects:
          - "All cylinders QUARANTINED with current_fill_lot_id == this lot -> RESERVED"
          - "No tank re-reservation: the failed fill's liquid stays drawn; rework re-pressurizes the same cylinders"
          - "Increments FillLot.version and each cylinder's version by 1"
      - from: PLANNED
        to: VENTED
        trigger: "POST /api/fill-lots/{fillLotId}/vent"
        actor: ProductionOperator
        preconditions:
          - "Lot must be PLANNED, FILLING, AWAITING_ANALYSIS, or ANALYSIS_FAILED (else ERR_FILL_LOT_INVALID_STATE)"
        side_effects:
          - "Releases any RESERVED cylinders to IN_STOCK (current_fill_lot_id cleared)"
          - "No tank adjustment (nothing reserved yet)"
      - from: FILLING
        to: VENTED
        trigger: "POST /api/fill-lots/{fillLotId}/vent"
        actor: ProductionOperator
        preconditions: []
        side_effects:
          - "Tank.reserved_liters -= draw_estimate_liters (reservation fully restored; compensating invariant I-VOLUME)"
          - "All cylinders RESERVED into this lot -> IN_STOCK, current_fill_lot_id cleared"
          - "Recompute tank low_level_flag"
      - from: AWAITING_ANALYSIS
        to: VENTED
        trigger: "POST /api/fill-lots/{fillLotId}/vent"
        actor: ProductionOperator
        preconditions: []
        side_effects:
          - "Tank.drawn_liters -= draw_actual_liters (physical draw reversed; compensating invariant I-VOLUME)"
          - "All cylinders RESERVED into this lot -> IN_STOCK, current_fill_lot_id cleared"
          - "Recompute tank.current_level_liters and low_level_flag"
      - from: ANALYSIS_FAILED
        to: VENTED
        trigger: "POST /api/fill-lots/{fillLotId}/vent"
        actor: ProductionOperator
        preconditions: []
        side_effects:
          - "Tank.drawn_liters -= draw_actual_liters"
          - "All cylinders QUARANTINED with current_fill_lot_id == this lot -> IN_STOCK, current_fill_lot_id cleared"
          - "Recompute tank.current_level_liters and low_level_flag"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /api/fill-lots/{fillLotId}/recall"
        actor: QualityManager
        preconditions:
          - "Lot must be RELEASED (else ERR_FILL_LOT_INVALID_STATE)"
        side_effects:
          - "Cascade link 2: every CylinderAsset with last_fill_lot_id == this lot and status FILLED or ON_RENT -> QUARANTINED"
          - "Cascade link 3: every CylinderRental in ACTIVE or OVERDUE whose cylinder_id was just quarantined -> RECALL_HOLD"
          - "Cascade link 4: every CustomerAccount owning a rental that just entered RECALL_HOLD: recall_flag = true"
          - "Increments FillLot.version and every touched cylinder/rental/customer version by 1"

  - entity: PurityAnalysis
    initial_state: RECORDED
    terminal_states: [OVERRIDDEN]
    transitions:
      - from: RECORDED
        to: OVERRIDDEN
        trigger: "POST /api/purity-analyses/{analysisId}/override"
        actor: QualityManager
        preconditions:
          - "Analysis must be RECORDED with result MARGINAL (else ERR_ANALYSIS_INVALID_STATE)"
          - "X-User-ID must differ from recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "result -> PASS_OVERRIDE; overridden_by_user_id = X-User-ID"
          - "Subject FillLot AWAITING_ANALYSIS -> RELEASED (cylinders FILLED) or BlendOrder AWAITING_ANALYSIS -> RELEASED"
          - "Increments PurityAnalysis.version and the subject's version by 1"

  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system (after any charge posting leaves outstanding_balance_cents > credit_limit_cents; strict >)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks POST /api/rentals and POST /api/blend-orders with ERR_ACCOUNT_NOT_ACTIVE"
          - "Cascade link 3 (billing-post trigger): all BulkInstallations of this customer in ACTIVE -> PAUSED"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system (POST /api/customers/{customerId}/payments leaves outstanding_balance_cents <= round_half_up(credit_limit_cents * 0.8, 0); <= boundary releases)"
        actor: system
        preconditions: []
        side_effects:
          - "Does NOT auto-resume PAUSED installations (operator must resume via set-status)"

  - entity: CylinderRental
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST_SETTLED]
    transitions:
      - from: ACTIVE
        to: OVERDUE
        trigger: "system (POST /api/billing-runs/{billingRunId}/finalize when due_date < logical clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "Ops-run checkpoint: only finalize sweeps ACTIVE rentals past due; no lazy transition on read"
      - from: ACTIVE
        to: RECALL_HOLD
        trigger: "system (fill-lot recall cascade link 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: RECALL_HOLD
        trigger: "system (fill-lot recall cascade link 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /api/rentals/{rentalId}/return"
        actor: BillingClerk
        preconditions:
          - "Rental must be ACTIVE, OVERDUE, or RECALL_HOLD (else ERR_RENTAL_NOT_ACTIVE)"
        side_effects:
          - "final_charge_cents = rental_final_charge (customer's billing_variant) + demurrage through return_date - demurrage_billed_cents"
          - "CustomerAccount.outstanding_balance_cents += final_charge_cents; evaluate credit_hold_evaluation"
          - "Cylinder: OK -> IN_STOCK; DAMAGED -> QUARANTINED; RECALL_HOLD return -> QUARANTINED regardless of condition"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /api/rentals/{rentalId}/return"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Same charging and cylinder side effects as ACTIVE -> RETURNED"
      - from: RECALL_HOLD
        to: RETURNED
        trigger: "POST /api/rentals/{rentalId}/return"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Same charging as ACTIVE -> RETURNED; cylinder always -> QUARANTINED"
      - from: ACTIVE
        to: LOST_SETTLED
        trigger: "POST /api/rentals/{rentalId}/settle-loss"
        actor: BillingClerk
        preconditions:
          - "Rental must be ACTIVE or OVERDUE (else ERR_RENTAL_NOT_ACTIVE)"
        side_effects:
          - "final_charge_cents = SIZE_LOSS_FEE[size_code] + variant base charge through today + demurrage through today - demurrage_billed_cents"
          - "CustomerAccount.outstanding_balance_cents += final_charge_cents; evaluate credit_hold_evaluation"
          - "Cylinder -> LOST"
      - from: OVERDUE
        to: LOST_SETTLED
        trigger: "POST /api/rentals/{rentalId}/settle-loss"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> LOST_SETTLED"

  - entity: Driver
    initial_state: QUALIFIED
    terminal_states: []
    transitions:
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /api/drivers/{driverId}/set-status {target_status: SUSPENDED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "Same route-unassignment cascade as CERT_EXPIRED: assigned routes -> PLANNED, driver_id cleared"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /api/drivers/{driverId}/set-status {target_status: QUALIFIED}"
        actor: LogisticsCoordinator
        preconditions:
          - "medical_card_expiry >= logical clock date and every endorsement expiry_date >= clock date (else ERR_DRIVER_CERT_EXPIRED)"
        side_effects: []
      - from: QUALIFIED
        to: CERT_EXPIRED
        trigger: "system (PATCH /api/drivers/{driverId} sets medical_card_expiry or any endorsement expiry_date earlier than the logical clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: every DeliveryRoute in DRIVER_ASSIGNED or DISPATCHED with this driver -> PLANNED, driver_id cleared"
          - "Increments Driver.version and every touched route's version by 1"
      - from: CERT_EXPIRED
        to: QUALIFIED
        trigger: "POST /api/drivers/{driverId}/set-status {target_status: QUALIFIED}"
        actor: LogisticsCoordinator
        preconditions:
          - "medical_card_expiry >= logical clock date and every endorsement expiry_date >= clock date (else ERR_DRIVER_CERT_EXPIRED)"
        side_effects: []

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DRIVER_ASSIGNED
        trigger: "POST /api/routes/{routeId}/assign-driver"
        actor: LogisticsCoordinator
        preconditions:
          - "Route must be PLANNED (else ERR_ROUTE_INVALID_STATE)"
          - "Driver must be QUALIFIED (else ERR_DRIVER_NOT_QUALIFIED)"
          - "Union of all stops' hazmat_classes must be covered by driver endorsements (missing class -> ERR_HAZMAT_ENDORSEMENT_MISSING)"
          - "Every covering endorsement and the medical card must have expiry_date >= route_date (else ERR_DRIVER_CERT_EXPIRED)"
          - "No other route of this driver in DRIVER_ASSIGNED or DISPATCHED with the same route_date and overlapping half-open window [window_start_hour, window_end_hour); touching endpoints (end == start) do NOT overlap (else ERR_DRIVER_ROUTE_OVERLAP)"
        side_effects:
          - "driver_id set; Increments DeliveryRoute.version by 1"
      - from: DRIVER_ASSIGNED
        to: DISPATCHED
        trigger: "POST /api/routes/{routeId}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "Route must be DRIVER_ASSIGNED (else ERR_ROUTE_INVALID_STATE)"
          - "Re-validates against the CURRENT logical clock: driver still QUALIFIED and medical_card_expiry >= today (else ERR_DRIVER_CERT_EXPIRED)"
        side_effects:
          - "Increments DeliveryRoute.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /api/routes/{routeId}/set-status {target_status: COMPLETED}"
        actor: "LogisticsCoordinator, or Driver whose X-User-ID == route.driver_id"
        preconditions:
          - "Route must be DISPATCHED (else ERR_ROUTE_INVALID_STATE)"
          - "If actor role is Driver, X-User-ID must equal route.driver_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/routes/{routeId}/set-status {target_status: CANCELLED}"
        actor: LogisticsCoordinator
        preconditions:
          - "Route must be PLANNED, DRIVER_ASSIGNED, or DISPATCHED (else ERR_ROUTE_INVALID_STATE); Driver role may never cancel (ERR_UNAUTHORIZED_ROLE)"
        side_effects: []
      - from: DRIVER_ASSIGNED
        to: CANCELLED
        trigger: "POST /api/routes/{routeId}/set-status {target_status: CANCELLED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /api/routes/{routeId}/set-status {target_status: CANCELLED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: DRIVER_ASSIGNED
        to: PLANNED
        trigger: "system (driver cert-expiry or suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "driver_id cleared to null"
      - from: DISPATCHED
        to: PLANNED
        trigger: "system (driver cert-expiry or suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "driver_id cleared to null"

  - entity: BulkInstallation
    initial_state: PROPOSED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROPOSED
        to: INSTALLED
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: INSTALLED}"
        actor: PlantManager
        preconditions:
          - "Installation must be PROPOSED (else ERR_INSTALLATION_INVALID_STATE)"
        side_effects: []
      - from: INSTALLED
        to: ACTIVE
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: ACTIVE}"
        actor: PlantManager
        preconditions:
          - "Installation must be INSTALLED or PAUSED (else ERR_INSTALLATION_INVALID_STATE)"
          - "When resuming from PAUSED: owning customer must be ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: ACTIVE}"
        actor: PlantManager
        preconditions:
          - "Owning customer must be ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: PAUSED}, or system (credit-hold cascade link 3)"
        actor: "PlantManager or system"
        preconditions: []
        side_effects:
          - "Blocks new replenishment orders with ERR_INSTALLATION_INVALID_STATE"
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: DECOMMISSIONED}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "All PENDING ReplenishmentOrders of this installation -> CANCELLED"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: DECOMMISSIONED}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "All PENDING ReplenishmentOrders of this installation -> CANCELLED"
      - from: PAUSED
        to: DECOMMISSIONED
        trigger: "POST /api/bulk-installations/{installationId}/set-status {target_status: DECOMMISSIONED}"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "All PENDING ReplenishmentOrders of this installation -> CANCELLED"

  - entity: ReplenishmentOrder
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (POST /api/replenishment-orders against the same installation supersedes any existing PENDING order)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_order_id = new order id"
      - from: PENDING
        to: DELIVERED
        trigger: "POST /api/replenishment-orders/{orderId}/set-status {target_status: DELIVERED}"
        actor: LogisticsCoordinator
        preconditions:
          - "Order must be PENDING (else ERR_REPLENISHMENT_INVALID_STATE)"
        side_effects:
          - "delivered_at = logical clock"
          - "System posts a TelemetryReading on the installation: source SYSTEM_REPLENISHMENT, measured_level_liters = installation.current_level_liters + requested_qty_liters (capped at capacity_liters), measured_at = delivered_at; installation.current_level_liters recomputes from it"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/replenishment-orders/{orderId}/set-status {target_status: CANCELLED}, or system (installation decommission cascade)"
        actor: "LogisticsCoordinator or system"
        preconditions: []
        side_effects: []

  - entity: BlendOrder
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/blend-orders/{blendOrderId}/approve"
        actor: QualityManager
        preconditions:
          - "Blend must be DRAFT (else ERR_BLEND_ORDER_INVALID_STATE)"
        side_effects:
          - "Increments BlendOrder.version by 1"
      - from: APPROVED
        to: BLENDING
        trigger: "POST /api/blend-orders/{blendOrderId}/start-blend"
        actor: ProductionOperator
        preconditions:
          - "Blend must be APPROVED or REWORK (else ERR_BLEND_ORDER_INVALID_STATE)"
          - "Plant must be OPERATING (else ERR_PLANT_NOT_OPERATING; plant resolved via the selected tanks' plant_id)"
          - "Tank selector per component: eligible = StorageTank with product_code == component.product_code, status IN_SERVICE, current_level_liters - reserved_liters >= required_qty + MIN_TANK_RESERVE_LITERS (100), where required_qty = round_half_up(target_pct/100 * batch_qty_liters, 2); rank by current_level_liters DESC, tie-break created_at ASC; empty pool -> ERR_TANK_LEVEL_TOO_LOW; ALL components must resolve before any state change"
        side_effects:
          - "Stamps selected_tank_id onto each component"
          - "Increments BlendOrder.version by 1"
      - from: REWORK
        to: BLENDING
        trigger: "POST /api/blend-orders/{blendOrderId}/start-blend"
        actor: ProductionOperator
        preconditions:
          - "Same as APPROVED -> BLENDING"
        side_effects:
          - "Same as APPROVED -> BLENDING (re-selects tanks)"
      - from: BLENDING
        to: AWAITING_ANALYSIS
        trigger: "POST /api/blend-orders/{blendOrderId}/complete-blend"
        actor: ProductionOperator
        preconditions:
          - "Blend must be BLENDING (else ERR_BLEND_ORDER_INVALID_STATE)"
          - "Plant must be OPERATING (else ERR_PLANT_NOT_OPERATING)"
        side_effects:
          - "For each component: selected tank.drawn_liters += required_qty; recompute current_level_liters and low_level_flag per tank"
          - "blended_by_user_id = X-User-ID"
          - "Increments BlendOrder.version and each selected tank's version by 1"
      - from: AWAITING_ANALYSIS
        to: RELEASED
        trigger: "system (PurityAnalysis PASS, or PASS_OVERRIDE via override)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments BlendOrder.version by 1"
      - from: AWAITING_ANALYSIS
        to: REWORK
        trigger: "system (PurityAnalysis FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Drawn component quantities are NOT returned (off-spec blend retained for re-blend)"
          - "Increments BlendOrder.version by 1"

  - entity: BillingRun
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/billing-runs/{billingRunId}/finalize"
        actor: BillingClerk
        preconditions:
          - "Run must be DRAFT (else ERR_BILLING_RUN_INVALID_STATE)"
        side_effects:
          - "Ops-run checkpoint: every CylinderRental ACTIVE with due_date < logical clock date -> OVERDUE"
          - "Compute charge_lines: every rental in ACTIVE or OVERDUE with due_date < period_end accrues demurrage for overdue day indices (billed_through_date - due_date + 1) .. (period_end - due_date), skipping non-positive windows; per tier segment round_half_up(tier_days * daily_rate_cents * tier_multiplier, 0), line = sum of tier segments; rental.billed_through_date = period_end and rental.demurrage_billed_cents += line"
          - "total_charges_cents = sum of charge_lines (per-line rounded values; never re-rounded)"
          - "Increments BillingRun.version and every swept rental's version by 1"
      - from: FINALIZED
        to: POSTED
        trigger: "POST /api/billing-runs/{billingRunId}/post"
        actor: BillingClerk
        preconditions:
          - "Run must be FINALIZED (else ERR_BILLING_RUN_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: per customer, outstanding_balance_cents += sum of that customer's charge lines"
          - "Cascade link 2: any customer whose outstanding_balance_cents now > credit_limit_cents -> CREDIT_HOLD"
          - "Cascade link 3: each customer newly in CREDIT_HOLD has all BulkInstallations in ACTIVE -> PAUSED"
          - "recall_flag cleared on customers with no remaining RECALL_HOLD rentals"
          - "Increments BillingRun.version and every touched customer/installation version by 1"

# =============================================================================
# §1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: tank-config-stale-version
    parent_entity: StorageTank
    write_endpoint: "PATCH /api/tanks/{tankId}"
    occ_field: expected_tank_version
    description: |
      Updating a StorageTank whose version has advanced past the caller's
      expected_tank_version is rejected. The caller's view of reorder_point
      and thresholds is stale, so the lost update is refused instead of
      silently overwriting another writer's configuration.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: customer-credit-stale-version
    parent_entity: CustomerAccount
    write_endpoint: "PATCH /api/customers/{customerId}"
    occ_field: expected_customer_version
    description: |
      Updating a CustomerAccount whose version has advanced past the caller's
      expected_customer_version is rejected. Credit terms observed by the
      caller no longer describe the account, so the update is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: replenishment-create-stale-installation
    parent_entity: BulkInstallation
    write_endpoint: "POST /api/replenishment-orders"
    occ_field: expected_installation_version
    description: |
      Creating a ReplenishmentOrder supersedes any PENDING order on the same
      installation; a create carrying an expected_installation_version older
      than the installation's current version is rejected because the caller
      cannot have seen the order it would supersede.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3 (§1.3): Calculation Rules Table
# =============================================================================
calculations:
  - name: telemetry_level_reconciliation
    trigger: "every POST /api/telemetry-readings, and every read of StorageTank.current_level_liters / BulkInstallation.current_level_liters"
    algorithm: projection
    formula: |
      owner_level = the measured_level_liters of the owner's TelemetryReading
        with the greatest measured_at; ties broken by created_at DESC
        (a later-recorded reading wins an equal measured_at).
      A late-arriving reading whose measured_at is earlier than the current
        latest does NOT change owner_level.
      StorageTank only: current_level_liters = owner_level - drawn_liters;
        whenever a new reading becomes the latest, drawn_liters resets to 0
        (the physical draw is now reflected in the measurement).
      BulkInstallation: current_level_liters = owner_level (no draws).
    input_set: "All TelemetryReading rows for the owner, any source"
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: fill_draw_liters
    trigger: "PROVISIONAL: fill-lot create and every cylinder assign/unassign (draw_estimate_liters). FINAL: complete-fill (draw_actual_liters)"
    algorithm: aggregation
    formula: |
      per_cylinder_liters = water_capacity_liters * (target_fill_pressure_bar - residual_bar) / CONVERSION_DIVISOR (100)
      draw = sum(per_cylinder_liters over cylinders RESERVED into the lot) + LINE_LOSS_LITERS (2) when at least one cylinder is assigned; 0 when none.
    input_set: "Cylinders with current_fill_lot_id == lot and status RESERVED"
    constants:
      CONVERSION_DIVISOR: 100
      LINE_LOSS_LITERS: 2
      STANDARD_RESIDUAL_BAR: 5
    precision: "2 decimal places, round_half_up (applied to the final sum only)"
    variants:
      - name: PROVISIONAL
        when: "Before complete-fill: every cylinder's residual is assumed STANDARD_RESIDUAL_BAR = 5"
        difference: "Uses the flat standard residual; produces a larger draw than FINAL whenever actual residuals exceed 5 bar"
      - name: FINAL
        when: "At complete-fill: uses the per-cylinder measured residual pressures supplied in the request"
        difference: "Identical inputs except residual_bar per cylinder; for residuals of 15 bar the same two-cylinder lot draws 187.0 vs the provisional 197.0"

  - name: rental_final_charge
    trigger: "POST /api/rentals/{rentalId}/return and /settle-loss; credit estimate at POST /api/rentals uses the same variant over planned_days"
    algorithm: tiered_pricing
    formula: |
      days_out = (end_date - out_date) in whole days, end exclusive;
        end_date = return_date (return) or logical clock date (settle-loss).
      overdue_days = max(0, (end_date - due_date) in whole days).
      base = variant_base(days_out); demurrage = demurrage_accrual(daily_rate_cents, overdue_days).
      final_charge_cents = base + demurrage - demurrage_billed_cents (floor 0).
    input_set: "The single rental being closed; customer's billing_variant and free_days"
    precision: "integer cents; tier segments round_half_up"
    variants:
      - name: CALENDAR_DAY
        when: "CustomerAccount.billing_variant == CALENDAR_DAY"
        difference: "base = daily_rate_cents * days_out (every out day bills)"
      - name: GRACE_PERIOD
        when: "CustomerAccount.billing_variant == GRACE_PERIOD"
        difference: "base = daily_rate_cents * max(0, days_out - free_days); for 9 days out with 3 free days the base is 6 days, not 9"

  - name: demurrage_accrual
    trigger: "billing-run finalize (accrual windows) and rental close-out (return / settle-loss)"
    algorithm: tiered_pricing
    formula: |
      Overdue day index i counts from 1 on the day after due_date.
      Tier 1: i in 1..7  -> 1.0 * daily_rate_cents
      Tier 2: i in 8..30 -> 1.5 * daily_rate_cents
      Tier 3: i >= 31    -> 2.0 * daily_rate_cents
      Per tier segment: segment_cents = round_half_up(days_in_segment * daily_rate_cents * multiplier, 0);
      total demurrage = sum of segment_cents (rounding pinned per segment, never on the sum).
    input_set: "Overdue day indices inside the accrual window"
    constants:
      TIER1_LAST_DAY: 7
      TIER2_LAST_DAY: 30
      TIER1_MULT: 1.0
      TIER2_MULT: 1.5
      TIER3_MULT: 2.0
    precision: "integer cents, round_half_up per tier segment"

  - name: billing_run_total
    trigger: "POST /api/billing-runs/{billingRunId}/finalize"
    algorithm: aggregation
    formula: |
      For each rental in scope, line_cents = demurrage_accrual over the rental's
      accrual window (already rounded per tier segment).
      total_charges_cents = sum(line_cents) with NO further rounding.
      Pin: round per tier segment per line, then sum lines. Sum-then-round is
      forbidden (two rentals at 333 cents/day for 8 overdue days: per-line
      2831 + 2831 = 5662, not 5661).
    input_set: "CylinderRentals in ACTIVE or OVERDUE with due_date < period_end and a positive accrual window"
    precision: "integer cents"

  - name: blend_price_quote
    trigger: "POST /api/blend-orders (computed once at creation)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned to break the apparent circle:
      1. component_cost_cents = sum over components of
         round_half_up(target_pct/100 * batch_qty_liters * unit_cost_cents_per_liter, 0)
      2. service_fee_cents keyed ONLY on component_cost_cents:
         cost < 100000            -> 15000
         100000 <= cost < 500000  -> round_half_up(0.12 * cost, 0)
         cost >= 500000           -> round_half_up(0.10 * cost, 0)
      3. total_price_cents = component_cost_cents + service_fee_cents
      The fee tier NEVER reads total_price_cents.
    input_set: "The blend's components array"
    constants:
      FEE_FLAT_CENTS: 15000
      FEE_TIER1_LIMIT: 100000
      FEE_TIER2_LIMIT: 500000
      FEE_TIER2_RATE: 0.12
      FEE_TIER3_RATE: 0.10
    precision: "integer cents, round_half_up"

  - name: blend_conformance_result
    trigger: "POST /api/purity-analyses with subject_type BLEND_ORDER"
    algorithm: threshold
    formula: |
      For each reading {product_code, actual_pct}: deviation = abs(actual_pct - component.target_pct).
      Component band: deviation <= tolerance_pct -> OK;
        tolerance_pct < deviation <= 2 * tolerance_pct -> MARGINAL;
        deviation > 2 * tolerance_pct -> FAIL.
      A reading whose product_code is not a component, or a component with no
      reading, is band FAIL. Result = worst band across all components.
      Equality at tolerance is OK; equality at 2*tolerance is MARGINAL.
    input_set: "The analysis readings and the blend's components"
    precision: "2 decimal places, round_half_up on deviation"

  - name: purity_result_determination
    trigger: "POST /api/purity-analyses with subject_type FILL_LOT"
    algorithm: threshold
    formula: |
      Per reading {analyte, reading_ppm}, limit = GRADE_LIMITS_PPM[lot.product_code][analyte]
      (unknown analyte for the grade -> ERR_INVALID_REQUEST).
      Band: reading <= limit -> OK; limit < reading <= limit * MARGINAL_FACTOR (1.5) -> MARGINAL;
        reading > limit * 1.5 -> FAIL. Result = worst band across readings.
      Equality at limit is OK; equality at limit * 1.5 is MARGINAL.
    input_set: "The analysis readings and the lot's product_code"
    constants:
      MARGINAL_FACTOR: 1.5
      GRADE_LIMITS_PPM: "{O2: {CO: 10, H2O: 20}, N2: {O2: 10, H2O: 10}, AR: {O2: 10, H2O: 10}, CO2: {H2O: 10, THC: 20}, H2: {O2: 5, H2O: 10}, HE: {O2: 5, H2O: 5}}"
    precision: "reading_ppm compared at 2 decimal places"

  - name: replenishment_order_qty
    trigger: "POST /api/replenishment-orders and system auto-creation on low telemetry"
    algorithm: aggregation
    formula: |
      requested_qty_liters = min(
        installation.capacity_liters - installation.current_level_liters,
        TRUCK_CAPACITY_LITERS,
        installation.max_order_qty_liters)
      evaluated once at creation; if the result is <= 0 the creation is rejected
      with ERR_INVALID_REQUEST.
    input_set: "The single installation"
    constants:
      TRUCK_CAPACITY_LITERS: 20000
      MIN_REPLENISHMENT_GAP_HOURS: 24

  - name: hydro_status_derivation
    trigger: "every read of CylinderAsset and every hydro-gated transition (assign, rental create)"
    algorithm: threshold
    formula: |
      hydro_due_date = add_months(last_hydro_date, HYDRO_INTERVAL_MONTHS[service_gas]),
        day clamped to the target month's last day.
      days_to_due = (hydro_due_date - logical clock date) in whole days.
      days_to_due < 0            -> OVERDUE
      0 <= days_to_due <= 30     -> DUE_SOON
      days_to_due > 30           -> COMPLIANT
      Due exactly today (days_to_due == 0) is DUE_SOON and REMAINS fillable/rentable;
      only OVERDUE (strictly past due) blocks.
    input_set: "The single cylinder and the logical clock"
    constants:
      HYDRO_INTERVAL_MONTHS: "{O2: 12, N2: 12, AR: 12, CO2: 6, H2: 12, HE: 12}"
      DUE_SOON_DAYS: 30
    precision: "whole days"

  - name: credit_hold_evaluation
    trigger: "after every posting to CustomerAccount.outstanding_balance_cents (return, settle-loss, billing post) and every payment"
    algorithm: threshold
    formula: |
      Hold:  status ACTIVE and outstanding_balance_cents > credit_limit_cents (strict) -> CREDIT_HOLD.
      Release: status CREDIT_HOLD and outstanding_balance_cents <= round_half_up(credit_limit_cents * 0.8, 0) -> ACTIVE.
      Hysteresis band: outstanding in (0.8 * limit, limit] leaves a CREDIT_HOLD account on hold
      and leaves an ACTIVE account active. Equality at the limit does NOT hold; equality at
      the 0.8 release point DOES release.
    input_set: "The single customer"
    constants:
      HOLD_RELEASE_RATIO: 0.8
    precision: "integer cents, round_half_up on the release threshold"

  - name: route_hazmat_coverage
    trigger: "POST /api/routes/{routeId}/assign-driver (and re-checked at dispatch for expiry)"
    algorithm: aggregation
    formula: |
      required = union of hazmat_classes over all stops (empty stops' classes -> empty set).
      covered = {e.endorsement_class for e in driver.hazmat_endorsements if e.expiry_date >= route.route_date}.
      Any class in required - covered with NO endorsement at all -> ERR_HAZMAT_ENDORSEMENT_MISSING.
      Any class whose only endorsement is expired at route_date -> ERR_DRIVER_CERT_EXPIRED.
      medical_card_expiry < route_date -> ERR_DRIVER_CERT_EXPIRED.
      Empty required set always passes coverage.
    input_set: "The route's stops and the candidate driver"
    precision: "date granularity"

# =============================================================================
# Table 4 (§1.4): Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role; for entity_backed role Driver, X-User-ID must be an existing Driver id"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed on the endpoint; role-scoped restrictions honored (Driver may only COMPLETE a route assigned to driver_id == X-User-ID and may never cancel)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, types correct, enum members valid, XOR fields (tank_id/installation_id, fill_lot_id/blend_order_id) exactly-one, reading levels within capacity, period_start <= period_end, window bounds (start 0-23, end 1-24, window_end_hour > window_start_hour)"
    error_id: "ERR_INVALID_REQUEST or ERR_INVALID_ENUM_VALUE"
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right (path first, then body fields in declaration order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "Target resource state permits the operation: plant OPERATING for production transitions; tank IN_SERVICE for start-fill; lot/blend/route/rental/analysis/billing-run in the machine-required from-state; account ACTIVE for rental/blend creation; cylinder FILLED (rental) or IN_STOCK (assign); installation ACTIVE for replenishment create"
    error_id: "ERR_PLANT_NOT_OPERATING | ERR_TANK_NOT_IN_SERVICE | ERR_FILL_LOT_INVALID_STATE | ERR_BLEND_ORDER_INVALID_STATE | ERR_ROUTE_INVALID_STATE | ERR_RENTAL_NOT_ACTIVE | ERR_ANALYSIS_INVALID_STATE | ERR_BILLING_RUN_INVALID_STATE | ERR_ACCOUNT_NOT_ACTIVE | ERR_CYLINDER_NOT_AVAILABLE | ERR_INSTALLATION_INVALID_STATE | ERR_DRIVER_NOT_QUALIFIED | ERR_REPLENISHMENT_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition and state-gated creation endpoints"
  - priority: 6
    category: business_safety
    check: "Cylinder hydro compliance: hydro_status != OVERDUE at assign and at rental create (due exactly today allowed)"
    error_id: ERR_HYDRO_RETEST_OVERDUE
    http_status: 422
    applies_to: "POST /api/fill-lots/{fillLotId}/cylinders, POST /api/rentals"
  - priority: 7
    category: business_safety
    check: "Cylinder service_gas equals FillLot.product_code; FillLot.product_code equals tank product_code"
    error_id: ERR_PRODUCT_SERVICE_MISMATCH
    http_status: 422
    applies_to: "POST /api/fill-lots/{fillLotId}/cylinders, POST /api/fill-lots"
  - priority: 8
    category: business_safety
    check: "Hazmat coverage: union of route stops' hazmat classes covered by unexpired driver endorsements; missing class vs expired endorsement distinguished; medical card valid at route_date"
    error_id: "ERR_HAZMAT_ENDORSEMENT_MISSING | ERR_DRIVER_CERT_EXPIRED"
    http_status: 422
    applies_to: "POST /api/routes/{routeId}/assign-driver, POST /api/routes/{routeId}/dispatch"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: analysis recorder != subject's completed_by/blended_by user; override actor != analysis recorder"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /api/purity-analyses, POST /api/purity-analyses/{analysisId}/override"
  - priority: 10
    category: business_temporal
    check: "Driver route windows: no two DRIVER_ASSIGNED/DISPATCHED routes for one driver on the same route_date with overlapping half-open [window_start_hour, window_end_hour); touching endpoints allowed"
    error_id: ERR_DRIVER_ROUTE_OVERLAP
    http_status: 409
    applies_to: "POST /api/routes/{routeId}/assign-driver"
  - priority: 11
    category: business_temporal
    check: "Telemetry measured_at must not be later than the logical clock"
    error_id: ERR_TELEMETRY_FUTURE_DATED
    http_status: 422
    applies_to: "POST /api/telemetry-readings"
  - priority: 12
    category: business_temporal
    check: "Replenishment spacing: scheduled_delivery_at >= last DELIVERED order's delivered_at + 24h for the same installation (no DELIVERED order -> no constraint)"
    error_id: ERR_REPLENISHMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/replenishment-orders"
  - priority: 13
    category: business_constraint
    check: "Tank capacity for fills: current_level_liters - reserved_liters >= draw_estimate_liters + MIN_TANK_RESERVE_LITERS (equality allowed); lot must have at least one RESERVED cylinder; blend tank selector pools non-empty for every component"
    error_id: "ERR_TANK_LEVEL_TOO_LOW | ERR_LOT_HAS_NO_CYLINDERS"
    http_status: 409
    applies_to: "POST /api/fill-lots/{fillLotId}/start-fill, POST /api/blend-orders/{blendOrderId}/start-blend"
  - priority: 14
    category: business_constraint
    check: "Uniqueness: cylinder serial_number globally unique across non-terminal and terminal cylinders alike"
    error_id: ERR_DUPLICATE_CYLINDER_SERIAL
    http_status: 409
    applies_to: "POST /api/cylinders"
  - priority: 15
    category: business_constraint
    check: "Blend composition: at least two components; target_pct values rounded to 2dp sum to exactly 100.00; each tolerance_pct > 0; each unit_cost_cents_per_liter >= 0"
    error_id: ERR_BLEND_COMPONENT_SUM_INVALID
    http_status: 422
    applies_to: "POST /api/blend-orders"
  - priority: 16
    category: business_fiscal
    check: "Credit: outstanding_balance_cents + estimated charge (variant base over planned_days) > credit_limit_cents rejects; equality allowed"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /api/rentals"

# =============================================================================
# §1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5 (§1.5): API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock used for all date arithmetic. Server startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "All clock-derived fields (hydro_status, cert expiry checks, overdue sweeps) evaluate against the new instant on next use"

  # --- Plant ---
  - method: POST
    path: "/api/plants"
    description: "Register a production plant"
    roles: [PlantManager]
    code: 201
    input: [plant_name]
    output: Plant
    side_effects: ["status = OPERATING"]
  - method: GET
    path: "/api/plants"
    description: "List plants"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Plant[]"
    side_effects: []
  - method: GET
    path: "/api/plants/{plantId}"
    description: "Get one plant"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: Plant
    side_effects: []
  - method: POST
    path: "/api/plants/{plantId}/set-status"
    description: "OPERATING <-> MAINTENANCE_SHUTDOWN"
    roles: [PlantManager]
    code: 200
    input: [target_status]
    output: Plant
    side_effects: ["Plant status transition per state machine; increments Plant.version by 1"]

  # --- StorageTank ---
  - method: POST
    path: "/api/tanks"
    description: "Register a cryogenic storage tank; seeds an INITIAL_LOAD telemetry reading at the creation clock time"
    roles: [PlantManager]
    code: 201
    input: [plant_id, product_code, capacity_liters, initial_level_liters, reorder_point_liters]
    output: StorageTank
    side_effects:
      - "Creates TelemetryReading(source INITIAL_LOAD, measured_level = initial_level_liters, measured_at = clock)"
      - "status = IN_SERVICE; reserved_liters = 0; drawn_liters = 0; low_level_flag computed"
  - method: GET
    path: "/api/tanks"
    description: "List tanks with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "plant_id?", "status?", "product_code?"]
    output: "StorageTank[]"
    side_effects: []
  - method: GET
    path: "/api/tanks/{tankId}"
    description: "Get one tank"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: StorageTank
    side_effects: []
  - method: PATCH
    path: "/api/tanks/{tankId}"
    description: "Update tank thresholds under OCC"
    roles: [PlantManager]
    code: 200
    input: ["reorder_point_liters?", expected_tank_version]
    output: StorageTank
    side_effects:
      - "OCC: expected_tank_version must equal current version (else ERR_STALE_VERSION 412)"
      - "Increments StorageTank.version by 1; recomputes low_level_flag"
  - method: POST
    path: "/api/tanks/{tankId}/set-status"
    description: "IN_SERVICE <-> MAINTENANCE / QUARANTINED transitions"
    roles: [PlantManager]
    code: 200
    input: [target_status]
    output: StorageTank
    side_effects: ["Tank status transition per state machine; increments StorageTank.version by 1"]

  # --- TelemetryReading ---
  - method: POST
    path: "/api/telemetry-readings"
    description: "Append a level reading for a tank XOR a bulk installation"
    roles: [ProductionOperator, LogisticsCoordinator]
    code: 201
    input: ["tank_id?", "installation_id?", measured_level_liters, measured_at, source]
    output: TelemetryReading
    side_effects:
      - "Recompute owner current_level_liters per telemetry_level_reconciliation (late readings reorder; new latest reading resets tank drawn_liters to 0)"
      - "Tank: recompute low_level_flag"
      - "Installation: if current_level_liters <= reorder_point_liters and no PENDING ReplenishmentOrder exists, system auto-creates one (requested_qty via replenishment_order_qty, scheduled_delivery_at = clock + 24h) and increments BulkInstallation.version"
      - "recorded_by_user_id = X-User-ID"
  - method: GET
    path: "/api/telemetry-readings"
    description: "List readings with filters (reverse-reachability for both polymorphic targets)"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "tank_id?", "installation_id?", "source?"]
    output: "TelemetryReading[]"
    side_effects: []
  - method: GET
    path: "/api/telemetry-readings/{readingId}"
    description: "Get one reading"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: TelemetryReading
    side_effects: []

  # --- CylinderAsset ---
  - method: POST
    path: "/api/cylinders"
    description: "Register a cylinder asset"
    roles: [ProductionOperator]
    code: 201
    input: [serial_number, size_code, service_gas, last_hydro_date]
    output: CylinderAsset
    side_effects:
      - "status = IN_STOCK; water_capacity_liters derived from SIZE_SPECS; hydro_due_date and hydro_status computed"
  - method: GET
    path: "/api/cylinders"
    description: "List cylinders with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "status?", "service_gas?", "current_fill_lot_id?", "last_fill_lot_id?"]
    output: "CylinderAsset[]"
    side_effects: []
  - method: GET
    path: "/api/cylinders/{cylinderId}"
    description: "Get one cylinder"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: CylinderAsset
    side_effects: []
  - method: POST
    path: "/api/cylinders/{cylinderId}/hydro-retests"
    description: "Record a hydrostatic retest; PASS extends hydro_due_date"
    roles: [ProductionOperator]
    code: 200
    input: [test_date, result]
    output: CylinderAsset
    side_effects:
      - "Cylinder must be IN_STOCK or QUARANTINED (else ERR_CYLINDER_NOT_AVAILABLE)"
      - "result PASS: last_hydro_date = test_date; hydro_due_date recomputed; a QUARANTINED cylinder stays QUARANTINED (release is a separate QualityManager action)"
      - "result FAIL: cylinder -> QUARANTINED"
      - "Increments CylinderAsset.version by 1"
  - method: POST
    path: "/api/cylinders/{cylinderId}/release-quarantine"
    description: "Release a quarantined cylinder back to stock"
    roles: [QualityManager]
    code: 200
    input: []
    output: CylinderAsset
    side_effects: ["QUARANTINED -> IN_STOCK per state machine; increments CylinderAsset.version by 1"]
  - method: POST
    path: "/api/cylinders/{cylinderId}/decommission"
    description: "Retire or mark lost an in-plant cylinder"
    roles: [QualityManager]
    code: 200
    input: [disposition]
    output: CylinderAsset
    side_effects: ["disposition RETIRED -> RETIRED; LOST -> LOST; only from IN_STOCK or QUARANTINED; increments CylinderAsset.version by 1"]

  # --- FillLot ---
  - method: POST
    path: "/api/fill-lots"
    description: "Plan a fill lot against a storage tank"
    roles: [ProductionOperator]
    code: 201
    input: [tank_id, product_code, target_fill_pressure_bar]
    output: FillLot
    side_effects:
      - "product_code must equal tank.product_code (ERR_PRODUCT_SERVICE_MISMATCH)"
      - "status = PLANNED; draw_estimate_liters = 0 until cylinders assigned"
  - method: GET
    path: "/api/fill-lots"
    description: "List fill lots with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "tank_id?", "status?"]
    output: "FillLot[]"
    side_effects: []
  - method: GET
    path: "/api/fill-lots/{fillLotId}"
    description: "Get one fill lot"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: FillLot
    side_effects: []
  - method: POST
    path: "/api/fill-lots/{fillLotId}/cylinders"
    description: "Assign a cylinder into a PLANNED lot"
    roles: [ProductionOperator]
    code: 201
    input: [cylinder_id]
    output: CylinderAsset
    side_effects:
      - "Cylinder IN_STOCK -> RESERVED per state machine (state, hydro, product-match preconditions)"
      - "Recompute FillLot.draw_estimate_liters (PROVISIONAL)"
      - "Increments CylinderAsset.version and FillLot.version by 1"
  - method: POST
    path: "/api/fill-lots/{fillLotId}/start-fill"
    description: "Begin filling; reserves the estimated draw on the tank"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: FillLot
    side_effects: ["PLANNED -> FILLING per state machine; tank reservation per fill_draw_liters PROVISIONAL"]
  - method: POST
    path: "/api/fill-lots/{fillLotId}/complete-fill"
    description: "Complete the fill with measured per-cylinder residual pressures"
    roles: [ProductionOperator]
    code: 200
    input: [measured_residuals]
    output: FillLot
    side_effects:
      - "FILLING -> AWAITING_ANALYSIS; computes draw_actual_liters (FINAL) from measured_residuals [{cylinder_id, residual_pressure_bar}]"
      - "Tank: reserved_liters -= draw_estimate_liters; drawn_liters += draw_actual_liters; current_level_liters and low_level_flag recomputed"
      - "completed_by_user_id = X-User-ID"
  - method: POST
    path: "/api/fill-lots/{fillLotId}/rework"
    description: "Rework a failed lot; de-quarantines its cylinders back to RESERVED"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: FillLot
    side_effects: ["ANALYSIS_FAILED -> FILLING per state machine"]
  - method: POST
    path: "/api/fill-lots/{fillLotId}/vent"
    description: "Vent a lot; restores tank reservation or drawn volume exactly"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: FillLot
    side_effects: ["-> VENTED per state machine; compensating invariant I-VOLUME on the tank"]
  - method: POST
    path: "/api/fill-lots/{fillLotId}/recall"
    description: "Recall a RELEASED lot; quarantines its cylinders, holds their rentals, flags their customers"
    roles: [QualityManager]
    code: 200
    input: []
    output: FillLot
    side_effects: ["RELEASED -> RECALLED per state machine; 3-link cascade to cylinders, rentals, customers"]

  # --- PurityAnalysis ---
  - method: POST
    path: "/api/purity-analyses"
    description: "Record a lab analysis on a fill lot XOR a blend order; computes PASS/MARGINAL/FAIL"
    roles: [LabAnalyst]
    code: 201
    input: [subject_type, "fill_lot_id?", "blend_order_id?", readings]
    output: PurityAnalysis
    side_effects:
      - "Subject must be AWAITING_ANALYSIS (else ERR_ANALYSIS_INVALID_STATE)"
      - "Segregation: X-User-ID must differ from the subject's completed_by_user_id / blended_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
      - "result computed per purity_result_determination (FILL_LOT) or blend_conformance_result (BLEND_ORDER)"
      - "PASS: subject -> RELEASED (fill lot releases cylinders to FILLED with last_fill_lot_id provenance)"
      - "MARGINAL: subject stays AWAITING_ANALYSIS pending override"
      - "FAIL: fill lot -> ANALYSIS_FAILED with cylinder quarantine cascade; blend -> REWORK"
  - method: GET
    path: "/api/purity-analyses"
    description: "List analyses with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "fill_lot_id?", "blend_order_id?", "result?"]
    output: "PurityAnalysis[]"
    side_effects: []
  - method: GET
    path: "/api/purity-analyses/{analysisId}"
    description: "Get one analysis"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: PurityAnalysis
    side_effects: []
  - method: POST
    path: "/api/purity-analyses/{analysisId}/override"
    description: "QualityManager override of a MARGINAL result to PASS_OVERRIDE"
    roles: [QualityManager]
    code: 200
    input: []
    output: PurityAnalysis
    side_effects: ["RECORDED+MARGINAL -> OVERRIDDEN/PASS_OVERRIDE; subject releases per state machine; override actor != recorder (segregation)"]

  # --- CustomerAccount ---
  - method: POST
    path: "/api/customers"
    description: "Open a customer account"
    roles: [BillingClerk]
    code: 201
    input: [account_name, billing_variant, free_days, credit_limit_cents]
    output: CustomerAccount
    side_effects: ["status = ACTIVE; outstanding_balance_cents = 0; recall_flag = false"]
  - method: GET
    path: "/api/customers"
    description: "List customers"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "status?", "billing_variant?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: GET
    path: "/api/customers/{customerId}"
    description: "Get one customer"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: PATCH
    path: "/api/customers/{customerId}"
    description: "Update credit terms under OCC"
    roles: [BillingClerk]
    code: 200
    input: ["credit_limit_cents?", "free_days?", "billing_variant?", expected_customer_version]
    output: CustomerAccount
    side_effects:
      - "OCC: expected_customer_version must equal current version (else ERR_STALE_VERSION 412)"
      - "Increments CustomerAccount.version by 1"
  - method: POST
    path: "/api/customers/{customerId}/payments"
    description: "Apply a payment against outstanding balance"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: CustomerAccount
    side_effects:
      - "outstanding_balance_cents -= amount_cents (amount_cents > 0; may drive the balance to 0 but never below 0 — excess rejected with ERR_INVALID_REQUEST)"
      - "credit_hold_evaluation release check (<= 80% of limit releases CREDIT_HOLD)"
      - "Increments CustomerAccount.version by 1"

  # --- CylinderRental ---
  - method: POST
    path: "/api/rentals"
    description: "Check out a FILLED cylinder to a customer"
    roles: [BillingClerk]
    code: 201
    input: [customer_id, cylinder_id, daily_rate_cents, planned_days]
    output: CylinderRental
    side_effects:
      - "Customer must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE); cylinder FILLED (ERR_CYLINDER_NOT_AVAILABLE) and not hydro OVERDUE (ERR_HYDRO_RETEST_OVERDUE); credit check (ERR_CREDIT_LIMIT_EXCEEDED, equality allowed)"
      - "Cylinder FILLED -> ON_RENT; out_date/due_date/billed_through_date set"
      - "Increments CylinderAsset.version by 1"
  - method: GET
    path: "/api/rentals"
    description: "List rentals with filters"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "cylinder_id?", "status?"]
    output: "CylinderRental[]"
    side_effects: []
  - method: GET
    path: "/api/rentals/{rentalId}"
    description: "Get one rental"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: CylinderRental
    side_effects: []
  - method: POST
    path: "/api/rentals/{rentalId}/return"
    description: "Return a rented cylinder; computes the final variant charge and posts it"
    roles: [BillingClerk]
    code: 200
    input: [return_condition]
    output: CylinderRental
    side_effects:
      - "Rental -> RETURNED; final_charge_cents per rental_final_charge; outstanding_balance_cents += final_charge_cents"
      - "Cylinder: OK -> IN_STOCK; DAMAGED -> QUARANTINED; RECALL_HOLD return -> QUARANTINED regardless"
      - "credit_hold_evaluation on the customer"
      - "Increments rental, cylinder, and customer versions by 1"
  - method: POST
    path: "/api/rentals/{rentalId}/settle-loss"
    description: "Settle a lost rented cylinder: loss fee plus accrued charges"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CylinderRental
    side_effects:
      - "Rental -> LOST_SETTLED; cylinder -> LOST; final_charge_cents = SIZE_LOSS_FEE + accrued variant base + demurrage - demurrage_billed_cents; posted to outstanding"
      - "SIZE_LOSS_FEE: SMALL 15000, STANDARD 45000, LARGE 80000 cents"
      - "credit_hold_evaluation on the customer"
      - "Increments rental, cylinder, and customer versions by 1"

  # --- Driver ---
  - method: POST
    path: "/api/drivers"
    description: "Register a driver with hazmat endorsements"
    roles: [LogisticsCoordinator]
    code: 201
    input: [driver_name, cdl_class, hazmat_endorsements, medical_card_expiry]
    output: Driver
    side_effects:
      - "status = QUALIFIED when medical_card_expiry >= clock date and all endorsement expiries >= clock date; otherwise CERT_EXPIRED"
  - method: GET
    path: "/api/drivers"
    description: "List drivers"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Driver[]"
    side_effects: []
  - method: GET
    path: "/api/drivers/{driverId}"
    description: "Get one driver"
    roles: [PlantManager, ProductionOperator, LabAnalyst, QualityManager, LogisticsCoordinator, BillingClerk, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: PATCH
    path: "/api/drivers/{driverId}"
    description: "Update certifications; an expiry earlier than the clock flips the driver to CERT_EXPIRED and unassigns routes"
    roles: [LogisticsCoordinator]
    code: 200
    input: ["medical_card_expiry?", "hazmat_endorsements?"]
    output: Driver
    side_effects:
      - "If any required cert expiry < clock date: status -> CERT_EXPIRED; cascade unassigns DRIVER_ASSIGNED/DISPATCHED routes to PLANNED with driver_id cleared"
      - "Increments Driver.version by 1"
  - method: POST
    path: "/api/drivers/{driverId}/set-status"
    description: "SUSPENDED / QUALIFIED transitions (reinstatement revalidates certs)"
    roles: [LogisticsCoordinator]
    code: 200
    input: [target_status]
    output: Driver
    side_effects: ["Driver status transition per state machine; suspension cascades routes to PLANNED; increments Driver.version by 1"]

  # --- DeliveryRoute ---
  - method: POST
    path: "/api/routes"
    description: "Plan a hazmat delivery route"
    roles: [LogisticsCoordinator]
