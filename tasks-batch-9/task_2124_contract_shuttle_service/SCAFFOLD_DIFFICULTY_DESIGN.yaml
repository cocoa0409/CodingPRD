              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c12}", name: "Grace Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 432, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r12: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-801", seat_capacity: 20, is_ada_accessible: false, odometer_km: 2000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v12a: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-802", seat_capacity: 20, is_ada_accessible: false, odometer_km: 2500, service_interval_km: 20000 }
              as: FleetManager
              captures: { v12b: $.data.id }
            - call: "POST /drivers"
