  # ===========================================================================
  - section: errors
    instances:

      - name: invalid_pagination_params_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_PAGINATION_PARAMETERS]
        distinguishing_aspect: "limit=0 violates the pagination floor (min 1) and is rejected 400 ERR_INVALID_PAGINATION_PARAMETERS on a list endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One issuer, one engagement."
          setup_api_calls:
            - *c_default
            - *mk_issuer
