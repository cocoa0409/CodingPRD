              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SOD_VIOLATION"
            - "TellerRequest.${r_id}.status == PENDING (no state change leaked)"

      - name: void_by_posting_teller_id_rejected_sod
        claim_type: violation_to_error
        grounds: [state_machines.TellerTransaction.POSTED_to_VOIDED, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Voiding with X-User-ID equal to the posting teller's id is ERR_SOD_VIOLATION — the manager role alone does not satisfy segregation of duties."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A; a POSTED 10000 deposit by T"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
