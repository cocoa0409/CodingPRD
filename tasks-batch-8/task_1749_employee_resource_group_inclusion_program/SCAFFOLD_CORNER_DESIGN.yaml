  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers fails authentication before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { err: $.data.error_id } }
          assert:
            - "request sent with headers stripped: err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"
      - name: create_group_invalid_enum_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "An out-of-enum category value is a schema violation -> ERR_INVALID_REQUEST 400, checked before any state or business rule."
        test_recipe:
          setup: ["program OPEN"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
          trigger:
