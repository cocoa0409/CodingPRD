- section: endpoints
  instances:
  - name: response_envelope_success_shape
    claim_type: response_envelope
    grounds:
    - response_envelope
    distinguishing_aspect: 'Every success response wraps data in the fixed envelope: meta.api_request_id, meta.api_request_timestamp,
      response_type == object.'
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      assert:
      - response has meta.api_request_id and meta.api_request_timestamp, response_type == 'object', and data carries the Smelter
        fields
      - HTTP status 201
  - name: response_envelope_error_shape
    claim_type: response_envelope
    grounds:
    - response_envelope
    distinguishing_aspect: Every error response uses response_type == 'error' with data.error_id and data.message; no stack
      traces or alternate shapes.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /smelter-ops/smelters/00000000-0000-0000-0000-000000000000
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - response_type == 'error'; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string
  - name: potlines_list_pagination_defaults
    claim_type: pagination_defaults
    grounds:
    - response_envelope
    distinguishing_aspect: 'The list endpoint applies pagination defaults (limit 10, offset 0): with 11 potlines the first
      read returns 10 rows, total_count 11, has_more true; offset 10 returns the final row with has_more false.'
    test_recipe:
