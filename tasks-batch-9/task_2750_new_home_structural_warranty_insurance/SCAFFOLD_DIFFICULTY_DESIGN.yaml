  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_restores_the_claim_incurred_identity_exactly
        grounds:
          - calculations.claim_incurred_conservation
          - endpoints.POST_/warranty/claims/{id}/payments
          - endpoints.POST_/warranty/claims/{id}/payment-reversals
          - entities.ReserveEntry.fields.reversed_entry_id
          - calculations.builder_loss_ratio
        distinguishing_aspect: |
          Conserved quantity #1: Claim.reserve_cents + Claim.paid_cents + Claim.released_cents ==
          Claim.incurred_authorized_cents. A partial payment shifts 300000 from reserve to paid
          WITHOUT changing the sum, and the reversal shifts it back, so the identity holds at all
          three observation points while its components differ at each. The compensation must be
          exact rather than approximately restorative: released_cents must stay 0 (a reversal is not
          a release), incurred_authorized_cents must never move, and because builder_loss_ratio sums
          reserve + paid but not released, the builder's loss_ratio must read 2.3496 before, during
          and after. An implementation that books the reversal as a release, or that re-derives
          incurred from the settlement, leaves visible drift.
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and the canonical 44500000 policy ACTIVE and PAID, premium_cents 363894"
            - "logical clock at 2028-09-01T00:00:00Z so the claim routes to the insurer arm on the BASE STRUCTURAL term"
            - "one WATER_INTRUSION claim, claimed_amount_cents 1000000, substantiation_ratio 1.00: gross 1000000, deductible 100000 (not designated structural), provisional_net 900000, betterment 45000 at the 5 percent tier, net_payable 855000; routed then APPROVED by adjuster-001"
          setup_api_calls:
            - call: "POST /warranty/builders"
