            - "trigger[3] returns HTTP 409 with data.error_id == \"ERR_SURPRISE_AUDIT_IN_PROGRESS\" because ${au_surprise_id} is still in DRAFT"
            - "GET /escrow-audits?escrow_account_id=${ea1_id} returns total_count == 3"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: unremitted_premium_ledger_restored_exactly_by_statement_reopen
        grounds:
          - calculations.unremitted_premium_ledger
          - state_machines.RemittanceStatement.SETTLED_to_DRAFT
          - entities.Agency.fields.unremitted_premium_cents
          - entities.RemittanceStatement.fields.reopen_count
          - entities.PolicyFile.fields.remittance_status
        distinguishing_aspect: |
          The conserved quantity is unremitted PREMIUM owed to the underwriter,
          aggregated over PolicyFile rows. Settlement removes 60000000 from the
          ledger and the compensating reopen puts exactly that back, restoring
          the policies to REPORTED and the posture to RESTRICTED, while
          reopen_count records that the round trip happened rather than being
          erased.
        test_recipe:
          setup:
            - "APPOINTED agency in CA with two ISSUED policy files of gross_premium_cents 30000000 each (closing 2026-07-05 and 2026-07-12), so unremitted_premium_cents is 60000000 and the posture is RESTRICTED."
            - "A statement for 2026-07-01..2026-07-31 carrying both policies, SUBMITTED, RECONCILED (variance 0, late_fee_cents 0, underwriter_share_cents 12000000) and then SETTLED for 12000000."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v1: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-91", closing_date: "2026-07-05", liability_amount_cents: 40000000, gross_premium_cents: 30000000, complex_title_flag: false, expected_agency_version: "${ag_v1}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf1_id: "$.data.id" }
            - call: "POST /policy-files/${pf1_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-91" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v2: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-92", closing_date: "2026-07-12", liability_amount_cents: 40000000, gross_premium_cents: 30000000, complex_title_flag: false, expected_agency_version: "${ag_v2}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf2_id: "$.data.id" }
            - call: "POST /policy-files/${pf2_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-92" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v3: "$.data.version", unremitted_before: "$.data.unremitted_premium_cents", posture_before: "$.data.oversight_posture" }
            - call: "POST /remittance-statements"
              payload: { agency_id: "${ag_id}", period_start: "2026-07-01", period_end: "2026-07-31", expected_agency_version: "${ag_v3}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { st_id: "$.data.id" }
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf1_id}", reported_gross_premium_cents: 30000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf2_id}", reported_gross_premium_cents: 30000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "RECONCILED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { underwriter_share: "$.data.underwriter_share_cents", late_fee: "$.data.late_fee_cents" }
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SETTLED", settled_amount_cents: 12000000 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { unremitted_settled: "$.data.unremitted_premium_cents", posture_settled: "$.data.oversight_posture" }
          trigger:
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "DRAFT", reopen_reason: "Premium restated by the underwriter" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { st_status_after: "$.data.status", st_reopen_count: "$.data.reopen_count" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { unremitted_after: "$.data.unremitted_premium_cents", posture_after: "$.data.oversight_posture" }
            - call: "GET /policy-files"
              payload: { agency_id: "${ag_id}", remittance_status: "REPORTED" }
              as: ComplianceOfficer
              captures: { first_reported_id: "$.data[0].id" }
          assert:
            - "${unremitted_before} == 60000000, ${posture_before} == \"RESTRICTED\", ${underwriter_share} == 12000000 and ${late_fee} == 0"
            - "${unremitted_settled} == 0 and ${posture_settled} == \"OPEN\""
            - "${st_status_after} == \"DRAFT\" and ${st_reopen_count} == 1"
            - "${unremitted_after} == 60000000 — exactly the pre-settlement value, restored rather than recomputed from the settlement amount"
            - "${posture_after} == \"RESTRICTED\" and GET /policy-files?agency_id=${ag_id}&remittance_status=REPORTED returns total_count == 2"

      - name: cpl_exposure_ledger_restored_exactly_by_letter_void
        grounds:
          - calculations.cpl_exposure_ledger
          - state_machines.ClosingProtectionLetter.ISSUED_to_VOIDED
          - entities.Agency.fields.cpl_outstanding_exposure_cents
          - entities.ClosingProtectionLetter.fields.approved_coverage_cents
        distinguishing_aspect: |
          A different conserved quantity — outstanding closing protection
          COVERAGE exposure, aggregated over ISSUED letters rather than over
          policy premium — and a different compensating action (voiding a
          letter). Voiding both removes the letter from the ISSUED set and zeroes
          its approved_coverage_cents, so the ledger returns to its exact
          pre-issuance value of 0 with no residue on the letter row.
        test_recipe:
          setup:
            - "APPOINTED agency in CA, posture OPEN, effective eo_policy_limit_cents 200000000."
            - "One letter requested for 30000000 of FULL_SETTLEMENT coverage: state_cap 100000000, posture_cap 100000000 and eo_sublimit 100000000, so the request itself binds and approved_coverage_cents is 30000000."
            - "No PolicyFile references the letter, so the void precondition holds."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v1: "$.data.version", exposure_before: "$.data.cpl_outstanding_exposure_cents" }
            - call: "POST /closing-protection-letters"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", transaction_ref: "TXN-9", coverage_scope: "FULL_SETTLEMENT", requested_coverage_cents: 30000000, closing_date: "2026-08-20", lender_name: "Bay Federal", complex_title_flag: false, expected_agency_version: "${ag_v1}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /closing-protection-letters/${cpl_id}/state"
              payload: { to_state: "ISSUED", rationale: "Standard settlement" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { cpl_approved: "$.data.approved_coverage_cents" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_issued: "$.data.cpl_outstanding_exposure_cents" }
          trigger:
            - call: "POST /closing-protection-letters/${cpl_id}/state"
              payload: { to_state: "VOIDED", void_reason: "Closing cancelled by the lender" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { cpl_status_after: "$.data.status", cpl_approved_after: "$.data.approved_coverage_cents" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_after: "$.data.cpl_outstanding_exposure_cents" }
          assert:
            - "${exposure_before} == 0 and ${cpl_approved} == 30000000 and ${exposure_issued} == 30000000"
            - "${cpl_status_after} == \"VOIDED\" and ${cpl_approved_after} == 0"
            - "${exposure_after} == 0 — exactly the pre-issuance value, and ${exposure_after} == ${exposure_before}"
            - "GET /closing-protection-letters?agency_id=${ag_id}&status=ISSUED returns total_count == 0"
