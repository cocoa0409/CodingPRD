scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pricing_variant_flat_vs_percup_same_inputs
        grounds:
          - calculations.quoted_subtotal_cents
          - calculations.quoted_total_cents
          - entities.EventBooking.fields.pricing_variant_used
        distinguishing_aspect: |
          Same guest_count, distance, cart, and add-ons produce different quoted_total_cents under FLAT_PACKAGE vs PER_CUP_METERED — pricing-variant divergence on the EventBooking domain.
        test_recipe:
          setup:
            - "Clock is 2026-05-01T00:00:00Z"
            - "ACTIVE Package PKG-FLAT: pricing_model=FLAT, base_hours=2, included_drinks=100, flat_price_cents=60000, per_cup_price_cents=0, per_cup_minimum_cents=0, max_guests=80"
            - "ACTIVE Package PKG-CUP: pricing_model=PER_CUP, base_hours=3, included_drinks=0, flat_price_cents=0, per_cup_price_cents=450, per_cup_minimum_cents=25000, max_guests=200"
            - "ACTIVE CoffeeCart CART-A requires_power_hookup=false, requires_water_hookup=false, max_drinks_per_hour=200"
            - "ACTIVE TravelZone ZONE-1: max_distance_km=25, banded_fee_cents=5000, per_km_rate_cents=200, min_booking_subtotal_cents=0"
            - "ACTIVE Client and one ACTIVE Barista (LEAD, latte_art_certified=true, weekly_hour_cap=40, hourly_rate_cents=3000)"
            - "Two bookings created in QUOTE: B-FLAT on PKG-FLAT and B-CUP on PKG-CUP, both with event_start=2026-05-10T10:00:00Z, event_end=2026-05-10T12:00:00Z, guest_count=40, distance_km=10, venue_provides_power=true, venue_provides_water=true"
            - "Each booking has one OFFERED BaristaAssignment for the barista"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-CUP", pricing_model: "PER_CUP", base_hours: 3, included_drinks: 0, flat_price_cents: 0, per_cup_price_cents: 450, per_cup_minimum_cents: 25000, max_guests: 200 }
              as: OperationsManager
              captures: { pkg_cup_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_flat_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_flat_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
              captures: { asg_flat_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_cup_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-11T10:00:00Z", event_end: "2026-05-11T13:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_cup_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_cup_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
              captures: { asg_cup_id: $.data.id }
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_flat_id}/submit"
              payload: { expected_cart_version: "${cart_v0}", expected_primary_barista_version: "${barista_v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { flat_total: $.data.quoted_total_cents, flat_deposit: $.data.deposit_due_cents, flat_variant: $.data.pricing_variant_used, cart_v1: $.data.version }
            - call: "GET /coffee-cart/carts/${cart_id}"
              as: OperationsManager
              captures: { cart_v_after_flat: $.data.version }
            - call: "GET /coffee-cart/baristas/${barista_id}"
              as: OperationsManager
              captures: { barista_v_after_flat: $.data.version }
            - call: "POST /coffee-cart/bookings/${booking_cup_id}/submit"
              payload: { expected_cart_version: "${cart_v_after_flat}", expected_primary_barista_version: "${barista_v_after_flat}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cup_total: $.data.quoted_total_cents, cup_deposit: $.data.deposit_due_cents, cup_variant: $.data.pricing_variant_used }
          assert:
            - "flat_variant == FLAT_PACKAGE"
            - "cup_variant == PER_CUP_METERED"
            - "flat_total == 62000"
            - "cup_total == 29000"
            - "flat_deposit == 18600"
            - "cup_deposit == 8700"
            - "flat_total != cup_total"

      - name: refund_variant_forward_vs_chronological
        grounds:
          - calculations.cancellation_refund_cents
          - entities.EventBooking.fields.refund_paid_cents
        distinguishing_aspect: |
          Same deposit_paid_cents and same CancellationPolicyTier set produce different refund amounts because the FORWARD_LOOKING variant applies deposit_refund_pct directly while the CHRONOLOGICAL variant applies an additional SHORT_NOTICE_FACTOR — refund-variant divergence on the Payment/refund domain (distinct entity domain from pricing).
        test_recipe:
          setup:
            - "Clock is 2026-05-01T00:00:00Z"
            - "Cancellation tiers: T1 (min=168h, max=-1, pct=1.0, waived=true), T2 (min=72h, max=168h, pct=0.5, waived=true), T3 (min=0h, max=72h, pct=0.0, waived=false)"
            - "Two CONFIRMED bookings, each with deposit_paid_cents=18600 (FLAT pkg, distance 10km, ZONE-1)"
            - "B-LONG has event_start = clock + 200h (notice_hours=200 → tier T1 → FORWARD_LOOKING)"
            - "B-SHORT has event_start = clock + 100h (notice_hours=100 → tier T2 → CHRONOLOGICAL, applies 0.5 haircut)"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/cancellation-tiers"
              payload: { tier_code: "T1", min_notice_hours: 168, max_notice_hours: -1, deposit_refund_pct: 1.0, balance_waived: true }
              as: OperationsManager
            - call: "POST /coffee-cart/cancellation-tiers"
              payload: { tier_code: "T2", min_notice_hours: 72, max_notice_hours: 168, deposit_refund_pct: 0.5, balance_waived: true }
              as: OperationsManager
            - call: "POST /coffee-cart/cancellation-tiers"
              payload: { tier_code: "T3", min_notice_hours: 0, max_notice_hours: 72, deposit_refund_pct: 0.0, balance_waived: false }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-09T08:00:00Z", event_end: "2026-05-09T10:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_long_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_long_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${booking_long_id}/submit"
              payload: { expected_cart_version: "${cart_v0}", expected_primary_barista_version: "${barista_v0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /coffee-cart/carts/${cart_id}"
              as: OperationsManager
              captures: { cart_v1: $.data.version }
            - call: "GET /coffee-cart/baristas/${barista_id}"
              as: OperationsManager
              captures: { barista_v1: $.data.version }
            - call: "POST /coffee-cart/bookings/${booking_long_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 18600, idempotency_key: "dep-long-1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay_long_id: $.data.id }
            - call: "POST /coffee-cart/payments/${pay_long_id}/mark-succeeded"
              as: OperationsManager
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-05T04:00:00Z", event_end: "2026-05-05T06:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_short_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_short_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${booking_short_id}/submit"
              payload: { expected_cart_version: "${cart_v1}", expected_primary_barista_version: "${barista_v1}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /coffee-cart/bookings/${booking_short_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 18600, idempotency_key: "dep-short-1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay_short_id: $.data.id }
            - call: "POST /coffee-cart/payments/${pay_short_id}/mark-succeeded"
              as: OperationsManager
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_long_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { refund_long: $.data.refund_paid_cents }
            - call: "GET /coffee-cart/bookings/${booking_long_id}/payments"
              as: OperationsManager
              captures: { payments_long: $.data }
            - call: "POST /coffee-cart/bookings/${booking_short_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /coffee-cart/bookings/${booking_short_id}/payments"
              as: OperationsManager
              captures: { payments_short: $.data }
          assert:
            - "booking_long status == CANCELLED"
            - "booking_short status == CANCELLED"
            - "B-LONG auto-created REFUND Payment of amount_cents == 18600 (notice_hours=200, T1 pct=1.0, FORWARD_LOOKING)"
            - "B-SHORT auto-created REFUND Payment of amount_cents == 4650 (notice_hours=100, T2 pct=0.5, CHRONOLOGICAL with 0.5 haircut: floor(18600*0.5*0.5)=4650)"
            - "REFUND amounts differ between the two variants for identical deposit_paid_cents"

  # -------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: deposit_clamp_mode_a_multi_input_threshold
        grounds:
          - calculations.deposit_due_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: deposit_due_cents has three interacting inputs (quoted_total_cents, DEPOSIT_MIN_CENTS, DEPOSIT_MAX_CENTS) with non-linear interaction via round-then-clamp; each of the three branches (below min, within range, above max) is exercised with pinned totals.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z"
            - "Three bookings in QUOTE, each on a different FLAT package engineered to hit each clamp branch:"
            - "PKG-LOW flat=2000 cents (raw 30% = 600 → below DEPOSIT_MIN_CENTS=1000)"
            - "PKG-MID flat=60000 cents (raw 30% = 18000 → within [1000, 50000])"
            - "PKG-HIGH flat=200000 cents (raw 30% = 60000 → above DEPOSIT_MAX_CENTS=50000)"
            - "ZONE-1 min_subtotal=0 so all three pass zone gate"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-LOW", pricing_model: "FLAT", base_hours: 1, included_drinks: 10, flat_price_cents: 2000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 20 }
              as: OperationsManager
              captures: { pkg_low_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-MID", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_mid_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-HIGH", pricing_model: "FLAT", base_hours: 8, included_drinks: 1000, flat_price_cents: 200000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 500 }
              as: OperationsManager
              captures: { pkg_high_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_low_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T08:00:00Z", event_end: "2026-05-10T09:00:00Z", guest_count: 10, venue_provides_power: true, venue_provides_water: true, distance_km: 0 }
              as: Client
              as_user_id: "${client_id}"
              captures: { b_low_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${b_low_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${b_low_id}/submit"
              payload: { expected_cart_version: "${cart_v0}", expected_primary_barista_version: "${barista_v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { low_deposit: $.data.deposit_due_cents, low_total: $.data.quoted_total_cents }
            - call: "GET /coffee-cart/carts/${cart_id}"
              as: OperationsManager
              captures: { cart_v1: $.data.version }
            - call: "GET /coffee-cart/baristas/${barista_id}"
              as: OperationsManager
              captures: { barista_v1: $.data.version }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_mid_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-11T08:00:00Z", event_end: "2026-05-11T10:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 0 }
              as: Client
              as_user_id: "${client_id}"
              captures: { b_mid_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${b_mid_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${b_mid_id}/submit"
              payload: { expected_cart_version: "${cart_v1}", expected_primary_barista_version: "${barista_v1}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { mid_deposit: $.data.deposit_due_cents, mid_total: $.data.quoted_total_cents }
            - call: "GET /coffee-cart/carts/${cart_id}"
              as: OperationsManager
              captures: { cart_v2: $.data.version }
            - call: "GET /coffee-cart/baristas/${barista_id}"
              as: OperationsManager
              captures: { barista_v2: $.data.version }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_high_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-12T08:00:00Z", event_end: "2026-05-12T16:00:00Z", guest_count: 400, venue_provides_power: true, venue_provides_water: true, distance_km: 0 }
              as: Client
              as_user_id: "${client_id}"
              captures: { b_high_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${b_high_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${b_high_id}/submit"
              payload: { expected_cart_version: "${cart_v2}", expected_primary_barista_version: "${barista_v2}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { high_deposit: $.data.deposit_due_cents, high_total: $.data.quoted_total_cents }
          trigger: []
          assert:
            - "low_total == 2000 and low_deposit == 1000 (raw 600 clamped up to DEPOSIT_MIN_CENTS)"
            - "mid_total == 60000 and mid_deposit == 18000 (raw 18000 within range, no clamp)"
            - "high_total == 200000 and high_deposit == 50000 (raw 60000 clamped down to DEPOSIT_MAX_CENTS)"

      - name: percup_ceil_then_multiply_mode_b_nested_rounding
        grounds:
          - calculations.quoted_subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order ceil(guest_count * 1.5) THEN multiply by per_cup_price produces a different cent amount than the alternative round-at-end order. With guest_count=41 and per_cup=450, pinned = 62*450 = 27900; alternate = round(41*1.5*450) = round(27675) = 27675 — the two orders diverge by 225 cents.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z"
            - "PER_CUP package PKG-CUP with per_cup_price_cents=450, per_cup_minimum_cents=25000, max_guests=200"
            - "Booking in QUOTE with guest_count=41, distance_km=0"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-CUP", pricing_model: "PER_CUP", base_hours: 3, included_drinks: 0, flat_price_cents: 0, per_cup_price_cents: 450, per_cup_minimum_cents: 25000, max_guests: 200 }
              as: OperationsManager
              captures: { pkg_cup_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
