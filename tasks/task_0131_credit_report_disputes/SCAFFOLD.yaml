# =============================================================================
# Scaffold: task_0131_credit_report_disputes
# Domain : FCRA (Fair Credit Reporting Act) consumer-dispute lifecycle —
#          bureau investigation, furnisher reverification, result notice,
#          reage prohibition, CFPB escalation, credit freeze / credit lock.
# =============================================================================

scenario: |
  Credit Report Disputes under FCRA (Fair Credit Reporting Act): consumer dispute
  submission (online/mail with supporting documents), credit bureau 30-day
  investigation deadline (extendable to 45 days if consumer provides additional
  info), information furnisher reverification (bureau forwards dispute to original
  creditor/furnisher who must verify within timeframe), consumer notification of
  investigation results (written results, free credit report if changes made),
  Reage prohibition (cannot restart statute of limitations on old debts),
  regulatory complaint escalation (CFPB complaint portal), Credit Lock and Credit
  Freeze (free under federal law, freeze blocks new credit inquiries, lock is
  creditor-controlled).

domain_name: fcra-credit-report-disputes
api_prefix: /consumers

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - scheduled_deferred_actions        # 30/45-day FCRA deadlines, clock-driven
    - cascading_side_effects            # dispute -> furnisher inquiry -> result -> tradeline mutation -> free-report grant
    - rate_threshold_triggers           # 30 vs 45-day boundary, 7-year reage boundary
    - ops_run_checkpoint                # POST /_clock/advance + POST /_sweep/run
    - derived_field_reconciliation      # CreditReport.fico_score, dispute_score, posture
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                  # RegulatoryComplaint may reference parent RegulatoryComplaint (refile)
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer legal name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four of SSN, exact 4 digits" }
      - { name: email, type: string, source: input, description: "Contact email; unique" }
      - { name: free_reports_remaining, type: integer, source: computed, default: 1, description: "Annual free reports plus dispute-driven free reports" }
      - { name: freeze_pin, type: string, source: system, description: "Server-issued PIN used to lift a credit freeze; null until first freeze placed" }

  - name: CreditReport
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "Owning Consumer.id" }
      - { name: bureau, type: enum, source: input, description: "EQUIFAX | EXPERIAN | TRANSUNION" }
      - { name: fico_score, type: integer, source: computed, description: "Recomputed whenever any owned TradelineItem mutates" }
      - { name: posture, type: enum, source: computed, description: "OPEN (default) | RESTRICTED (any active Dispute) | FROZEN (CreditFreeze ACTIVE on this bureau)" }
      - { name: last_pulled_day, type: integer, source: system, description: "Clock day on which the report was last generated; null = never pulled" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }

  - name: TradelineItem
    parent: CreditReport
    common_fields: true
    fields:
      - { name: credit_report_id, type: string, source: system, description: "Owning CreditReport.id" }
      - { name: furnisher_id, type: string, source: system, description: "FK -> Furnisher.id; immutable" }
      - { name: account_ref, type: string, source: input, description: "Furnisher-side account reference; unique per (credit_report_id, furnisher_id)" }
      - { name: original_dofd_day, type: integer, source: input, description: "Clock day of Date Of First Delinquency; immutable; used for reage check" }
      - { name: balance_cents, type: integer, source: input, description: "Reported balance, non-negative" }
      - { name: payment_status, type: enum, source: system, description: "CURRENT | LATE_30 | LATE_60 | LATE_90 | CHARGE_OFF | COLLECTION | DELETED" }
      - { name: reported_dofd_day, type: integer, source: system, description: "Currently-reported DOFD; equals original_dofd_day unless a verified correction moves it EARLIER (later moves blocked by reage rule)" }
      - { name: verification_status, type: enum, source: computed, description: "UNVERIFIED | VERIFIED | UPDATED | DELETED" }

  - name: Furnisher
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Furnisher legal name (creditor/collector)" }
      - { name: ecoa_code, type: string, source: input, description: "Equal Credit Opportunity Act code; immutable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — set by PlatformAdmin" }

  - name: Dispute
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "Submitting Consumer.id" }
      - { name: credit_report_id, type: string, source: input, description: "Target CreditReport.id (and therefore bureau)" }
      - { name: tradeline_item_id, type: string, source: input, description: "Target TradelineItem.id" }
      - { name: channel, type: enum, source: input, description: "ONLINE | MAIL — channel-of-submission, immutable" }
      - { name: supporting_documents, type: array, source: input, description: "Array of doc descriptors {kind, sha256}; non-empty" }
      - { name: requested_action, type: enum, source: input, description: "CORRECT_BALANCE | CORRECT_STATUS | DELETE_ITEM | CORRECT_DOFD" }
      - { name: requested_payload, type: object, source: input, description: "Action-specific data, e.g. {new_balance_cents} or {new_dofd_day}" }
      - { name: submitted_day, type: integer, source: system, description: "Clock day on submission" }
      - { name: deadline_day, type: integer, source: computed, description: "submitted_day + 30, extended to submitted_day + 45 once additional-info is accepted" }
      - { name: additional_info_accepted, type: boolean, source: system, default: false, description: "True after a successful POST .../additional_info; flips deadline_day" }
      - { name: investigation_outcome, type: enum, source: system, description: "PENDING | VERIFIED | UPDATED | DELETED | DISMISSED_FRIVOLOUS" }
      - { name: result_notice_id, type: string, source: system, description: "FK -> ResultNotice.id, null until issued" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_INVESTIGATION | RESULTS_PENDING | CLOSED_VERIFIED | CLOSED_UPDATED | CLOSED_DELETED | CLOSED_DISMISSED | ESCALATED" }

  - name: FurnisherInquiry
    parent: Dispute
    common_fields: false
    fields:
      - { name: dispute_id, type: string, source: system, description: "Parent Dispute.id" }
      - { name: furnisher_id, type: string, source: system, description: "Inquiry recipient" }
      - { name: forwarded_day, type: integer, source: system, description: "Clock day on which the bureau forwarded the dispute" }
      - { name: reverification_deadline_day, type: integer, source: computed, description: "forwarded_day + 25; furnisher must respond by this day for the bureau to use the response" }
      - { name: response, type: enum, source: system, description: "PENDING | VERIFIED | UPDATED | DELETED | NO_RESPONSE" }
      - { name: response_day, type: integer, source: system, description: "Clock day of furnisher response; null if NO_RESPONSE" }
      - { name: response_payload, type: object, source: system, description: "Action-specific payload mirroring requested_action, e.g. {new_balance_cents}" }

  - name: ResultNotice
    parent: Dispute
    common_fields: false
    fields:
      - { name: dispute_id, type: string, source: system, description: "Parent Dispute.id; unique" }
      - { name: issued_day, type: integer, source: system, description: "Clock day on which the written notice was issued" }
      - { name: delivery_channel, type: enum, source: system, description: "Mirrors Dispute.channel: ONLINE | MAIL" }
      - { name: outcome, type: enum, source: system, description: "VERIFIED | UPDATED | DELETED | DISMISSED_FRIVOLOUS" }
      - { name: free_report_granted, type: boolean, source: system, description: "True iff outcome in {UPDATED, DELETED}" }
      - { name: summary, type: string, source: system, description: "Human-readable summary of changes" }

  - name: RegulatoryComplaint
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "Filing Consumer.id" }
      - { name: dispute_id, type: string, source: input, description: "FK -> Dispute.id being escalated" }
      - { name: parent_complaint_id, type: string, source: input, description: "Optional FK -> RegulatoryComplaint.id when refiling; null otherwise (self-referential)" }
      - { name: agency, type: enum, source: input, default: "CFPB", description: "CFPB only in v1" }
      - { name: narrative, type: string, source: input, description: "Consumer-written narrative, 1..4000 chars" }
      - { name: filed_day, type: integer, source: system, description: "Clock day of filing" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RESOLVED | REJECTED" }

  - name: CreditFreeze
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "Owning Consumer.id" }
      - { name: bureau, type: enum, source: input, description: "EQUIFAX | EXPERIAN | TRANSUNION" }
      - { name: placed_day, type: integer, source: system, description: "Clock day on which freeze became ACTIVE" }
      - { name: lifted_day, type: integer, source: system, description: "Clock day on which freeze flipped to LIFTED; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED — unique-active per (consumer_id, bureau)" }

  - name: CreditLock
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "Owning Consumer.id" }
      - { name: bureau, type: enum, source: input, description: "EQUIFAX | EXPERIAN | TRANSUNION" }
      - { name: locked_at_day, type: integer, source: system, description: "Clock day on which lock became LOCKED" }
      - { name: status, type: enum, source: system, description: "LOCKED | UNLOCKED — unique-LOCKED per (consumer_id, bureau)" }

  - name: HardInquiry
    parent: CreditReport
    common_fields: false
    fields:
      - { name: credit_report_id, type: string, source: system, description: "Target CreditReport.id" }
      - { name: requesting_furnisher_id, type: string, source: system, description: "Furnisher that requested the pull" }
      - { name: inquiry_day, type: integer, source: system, description: "Clock day of inquiry attempt" }
      - { name: outcome, type: enum, source: system, description: "ACCEPTED | BLOCKED_FREEZE | BLOCKED_LOCK" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------------------------
  # Dispute — the central, non-linear, branching+revert machine.
  # Initial:  RECEIVED
  # Terminal: CLOSED_VERIFIED, CLOSED_UPDATED, CLOSED_DELETED, CLOSED_DISMISSED
  # Note: ESCALATED is a fork-arm reachable from CLOSED_VERIFIED or
  # CLOSED_DISMISSED via RegulatoryComplaint creation; the complaint can
  # transition the dispute back to UNDER_INVESTIGATION on CFPB acceptance
  # (cycle), satisfying non_linear_state_machine.
  # -------------------------------------------------------------------
  - entity: Dispute
    initial_state: RECEIVED
    terminal_states: [CLOSED_VERIFIED, CLOSED_UPDATED, CLOSED_DELETED, CLOSED_DISMISSED]
    transitions:

      - from: RECEIVED
        to: UNDER_INVESTIGATION
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/start_investigation"
        actor: BureauOperator
        preconditions:
          - "CreditReport.posture != FROZEN at the time of trigger (ERR_REPORT_FROZEN)"
          - "supporting_documents is non-empty (ERR_NO_SUPPORTING_DOCUMENTS)"
          - "Dispute is not frivolous per validations priority 12 (ERR_FRIVOLOUS_DISPUTE)"
        side_effects:
          - "Auto-create exactly one FurnisherInquiry with forwarded_day = clock.day and response = PENDING"
          - "Recompute CreditReport.posture -> RESTRICTED via posture_calculation"

      - from: UNDER_INVESTIGATION
        to: UNDER_INVESTIGATION
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/additional_info"
        actor: Consumer
        preconditions:
          - "additional_info_accepted is currently false (ERR_INVALID_STATE_TRANSITION)"
          - "clock.day <= deadline_day (ERR_DISPUTE_DEADLINE_PASSED)"
        side_effects:
          - "additional_info_accepted = true"
          - "deadline_day = submitted_day + 45 (extended)"

      - from: UNDER_INVESTIGATION
        to: RESULTS_PENDING
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/furnisher_response (operator endpoint)"
        actor: BureauOperator
        preconditions:
          - "FurnisherInquiry.response is currently PENDING"
          - "clock.day <= FurnisherInquiry.reverification_deadline_day (ERR_FURNISHER_LATE)"
        side_effects:
          - "FurnisherInquiry.response set per request payload (VERIFIED | UPDATED | DELETED)"
          - "FurnisherInquiry.response_day = clock.day"
          - "FurnisherInquiry.response_payload stored"

      - from: UNDER_INVESTIGATION
        to: RESULTS_PENDING
        trigger: "POST /_sweep/run (system, on deadline)"
        actor: system
        preconditions:
          - "clock.day >= FurnisherInquiry.reverification_deadline_day"
          - "FurnisherInquiry.response is PENDING"
        side_effects:
          - "FurnisherInquiry.response = NO_RESPONSE"
          - "Bureau-only resolution path: outcome is DELETED per FCRA (unverified -> delete)"

      - from: RESULTS_PENDING
        to: CLOSED_VERIFIED
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/issue_result_notice"
        actor: BureauOperator
        preconditions:
          - "FurnisherInquiry.response = VERIFIED"
          - "clock.day <= deadline_day (ERR_DISPUTE_DEADLINE_PASSED)"
        side_effects:
          - "Create ResultNotice with outcome=VERIFIED, free_report_granted=false"
          - "TradelineItem.verification_status = VERIFIED"
          - "Recompute CreditReport.posture (no active disputes remaining -> OPEN)"

      - from: RESULTS_PENDING
        to: CLOSED_UPDATED
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/issue_result_notice"
        actor: BureauOperator
        preconditions:
          - "FurnisherInquiry.response = UPDATED"
          - "Reage check: if requested_action = CORRECT_DOFD, new_dofd_day <= reported_dofd_day (ERR_REAGE_PROHIBITED)"
        side_effects:
          - "Apply furnisher payload to TradelineItem (balance / status / dofd)"
          - "TradelineItem.verification_status = UPDATED"
          - "Recompute CreditReport.fico_score (fico_calculation)"
          - "Create ResultNotice with outcome=UPDATED, free_report_granted=true"
          - "Consumer.free_reports_remaining += 1 (free_report_grant_calculation)"
          - "Recompute CreditReport.posture"

      - from: RESULTS_PENDING
        to: CLOSED_DELETED
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/issue_result_notice"
        actor: BureauOperator
        preconditions:
          - "FurnisherInquiry.response in {DELETED, NO_RESPONSE}"
        side_effects:
          - "TradelineItem.payment_status = DELETED, verification_status = DELETED"
          - "Recompute CreditReport.fico_score (fico_calculation)"
          - "Create ResultNotice with outcome=DELETED, free_report_granted=true"
          - "Consumer.free_reports_remaining += 1 (free_report_grant_calculation)"
          - "Recompute CreditReport.posture"

      - from: RECEIVED
        to: CLOSED_DISMISSED
        trigger: "POST /consumers/{consumerId}/disputes/{disputeId}/dismiss_frivolous"
        actor: BureauOperator
        preconditions:
          - "Dispute is the 4th+ submission by the same consumer on the same tradeline_item_id in the last 365 clock days (frivolous_threshold_check)"
        side_effects:
          - "investigation_outcome = DISMISSED_FRIVOLOUS"
          - "Create ResultNotice with outcome=DISMISSED_FRIVOLOUS, free_report_granted=false"
          - "Recompute CreditReport.posture"

      - from: CLOSED_VERIFIED
        to: ESCALATED
        trigger: "POST /consumers/{consumerId}/regulatory_complaints (with dispute_id)"
        actor: Consumer
        preconditions:
          - "RegulatoryComplaint.dispute_id references this Dispute"
          - "Dispute.status in {CLOSED_VERIFIED, CLOSED_DISMISSED} (ERR_NOT_ESCALATABLE)"
        side_effects:
          - "Dispute.status = ESCALATED"

      - from: CLOSED_DISMISSED
        to: ESCALATED
        trigger: "POST /consumers/{consumerId}/regulatory_complaints (with dispute_id)"
        actor: Consumer
        preconditions:
          - "Same as above"
        side_effects:
          - "Dispute.status = ESCALATED"

      - from: ESCALATED
        to: UNDER_INVESTIGATION
        trigger: "POST /regulatory_complaints/{complaintId}/accept (CFPB accepts -> bureau must reopen) — cycle arm"
        actor: CFPBOperator
        preconditions:
          - "RegulatoryComplaint.status = UNDER_REVIEW"
        side_effects:
          - "deadline_day = clock.day + 30 (fresh investigation clock)"
          - "Auto-create a NEW FurnisherInquiry (cascade: dispute_reopen_cascade)"

  # -------------------------------------------------------------------
  # CreditReport — parallel/compound:
  #  - status axis: ACTIVE -> ARCHIVED
  #  - posture axis: OPEN <-> RESTRICTED <-> FROZEN (derived; satisfies
  #    cross_entity_state_dependency through Dispute and CreditFreeze)
  # -------------------------------------------------------------------
  - entity: CreditReport
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:

      - from: ACTIVE
        to: ACTIVE
        trigger: "system (posture recompute on Dispute create / close, CreditFreeze place / lift)"
        actor: system
        preconditions: []
        side_effects:
          - "posture = FROZEN if CreditFreeze ACTIVE for (consumer_id, bureau) else RESTRICTED if any Dispute on this report has status in {RECEIVED, UNDER_INVESTIGATION, RESULTS_PENDING, ESCALATED} else OPEN"

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /consumers/{consumerId}/credit_reports/{creditReportId}/archive"
        actor: PlatformAdmin
        preconditions:
          - "No Dispute on this report with status in non-terminal set (ERR_REPORT_HAS_OPEN_DISPUTES)"
        side_effects: []

  # -------------------------------------------------------------------
  # RegulatoryComplaint — branching with revert (cycle via REJECTED -> refile)
  # -------------------------------------------------------------------
  - entity: RegulatoryComplaint
    initial_state: FILED
    terminal_states: [RESOLVED, REJECTED]
    transitions:

      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /regulatory_complaints/{complaintId}/accept"
        actor: CFPBOperator
        preconditions: []
        side_effects:
          - "Cascades to Dispute.ESCALATED -> UNDER_INVESTIGATION (see dispute_reopen_cascade)"

      - from: FILED
        to: REJECTED
        trigger: "POST /regulatory_complaints/{complaintId}/reject"
        actor: CFPBOperator
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /regulatory_complaints/{complaintId}/resolve"
        actor: CFPBOperator
        preconditions:
          - "Dispute referenced is in a terminal CLOSED_* state again (ERR_DISPUTE_NOT_RECLOSED)"
        side_effects: []

  # -------------------------------------------------------------------
  # CreditFreeze
  # -------------------------------------------------------------------
  - entity: CreditFreeze
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:

      - from: ACTIVE
        to: LIFTED
        trigger: "POST /consumers/{consumerId}/credit_freezes/{freezeId}/lift"
        actor: Consumer
        preconditions:
          - "Request body PIN equals Consumer.freeze_pin (ERR_INVALID_FREEZE_PIN)"
        side_effects:
          - "Recompute posture on the matching CreditReport (RESTRICTED or OPEN)"

  # -------------------------------------------------------------------
  # CreditLock
  # -------------------------------------------------------------------
  - entity: CreditLock
    initial_state: LOCKED
    terminal_states: []
    transitions:

      - from: LOCKED
        to: UNLOCKED
        trigger: "POST /consumers/{consumerId}/credit_locks/{lockId}/unlock"
        actor: Consumer
        preconditions: []
        side_effects: []

      - from: UNLOCKED
        to: LOCKED
        trigger: "POST /consumers/{consumerId}/credit_locks/{lockId}/relock"
        actor: Consumer
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - scenario: "Consumer submits two disputes simultaneously for the same TradelineItem"
    guarantee: "At most one Dispute is active per TradelineItem; the loser is rejected"
    error_id: ERR_DUPLICATE_ACTIVE_DISPUTE
    http_status: 409
    serialization: "First-writer-wins on (consumer_id, tradeline_item_id) where existing dispute is in non-terminal status"

  - scenario: "Bureau operator issues result notice while sweep deletes the same dispute for furnisher non-response"
    guarantee: "Exactly one resolution path commits; the loser is rejected because the dispute already left RESULTS_PENDING"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    serialization: "First-writer-wins on Dispute.status; sweep takes the lock per Dispute row, operator request retries after"

  - scenario: "Two CreditFreeze placements on the same (consumer_id, bureau) submitted in parallel"
    guarantee: "Only one ACTIVE CreditFreeze per (consumer_id, bureau); the second is rejected"
    error_id: ERR_FREEZE_ALREADY_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on (consumer_id, bureau) when status=ACTIVE"

  - scenario: "Furnisher reverification response races the sweep that flips response to NO_RESPONSE on deadline"
    guarantee: "If clock.day <= reverification_deadline_day, operator wins; otherwise the sweep's NO_RESPONSE stands and the operator response is rejected as late"
    error_id: ERR_FURNISHER_LATE
    http_status: 409
    serialization: "Deadline boundary is inclusive of operator response on deadline_day; first-writer-wins thereafter"

  - scenario: "Consumer files a regulatory complaint twice for the same Dispute"
    guarantee: "At most one RegulatoryComplaint per Dispute may be in {FILED, UNDER_REVIEW}; the second is rejected"
    error_id: ERR_COMPLAINT_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on (dispute_id) where status in non-terminal set; refile allowed only via parent_complaint_id after parent is REJECTED"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- Rule 1 / dual_variant_calc instance #1 -----------------------
  - name: fico_calculation
    trigger: "TradelineItem mutation via Dispute close (CLOSED_UPDATED or CLOSED_DELETED) OR system recompute"
    algorithm: weighted_scoring
    formula: |
      # Inputs:
      #   reports CreditReport, with owned non-DELETED TradelineItems T = {t1..tn}.
      # Weights (per FCRA-style simplified FICO):
      #   payment_history_weight   = 0.35
      #   utilization_weight       = 0.30
      #   age_weight               = 0.15
      #   mix_weight               = 0.10
      #   recent_inquiries_weight  = 0.10
      # Per-item payment penalty (payment_score):
      #   CURRENT     -> 100
      #   LATE_30     -> 70
      #   LATE_60     -> 40
      #   LATE_90     -> 20
      #   CHARGE_OFF  -> 0
      #   COLLECTION  -> 0
      #   DELETED items are excluded from T.
      # If T is empty after exclusions, define mean(payment_score)=100.
      # Utilization metric:
      #   total_balance_cents = sum(t.balance_cents for t in T)
      #   util_pct = min(100, total_balance_cents / max(1, len(T) * 1000000) * 100)
      #     # 1,000,000 cents = $10,000 nominal per-item limit
      #   utilization_score = max(0, 100 - util_pct)   # If T empty: utilization_score=100
      # age_score(T) = 100 (constant in v1; FCRA scenario doesn't model age in this scaffold)
      # mix_score(T) = 50 if len(T) == 1 else 100
      #                (single-item portfolios penalized for lack of mix)
      # inquiries_score(reports.recent_hard_inquiries):
      #   inquiries = count of HardInquiry on this report with outcome=ACCEPTED
      #   inquiries_score = max(0, 100 - 20 * inquiries)
      # PINNED ROUNDING ORDER (mode-b distinguishing aspect, also used by
      # Rule 2 instance #2): compute each weighted component as a FLOAT,
      # sum the floats, multiply by 5.5, add 300, then round_half_up ONCE
      # at the very end. Do NOT round per-component. Alternative orderings
      # (round each weighted component to int, then sum) would yield
      # different scores by ±1 in many cases; the scaffold rejects them.
      raw =   payment_history_weight * mean(payment_score(t) for t in T)
            + utilization_weight     * utilization_score
            + age_weight             * age_score(T)
            + mix_weight             * mix_score(T)
            + recent_inquiries_weight* inquiries_score(reports.recent_hard_inquiries)
      fico_score = round_half_up(300 + 5.5 * raw)   # ONE rounding, at the end
      fico_score = max(300, min(850, fico_score))   # range clamped to [300, 850]
    constants:
      PAYMENT_HISTORY_WEIGHT: 0.35
      UTILIZATION_WEIGHT: 0.30
      AGE_WEIGHT: 0.15
      MIX_WEIGHT: 0.10
      RECENT_INQUIRIES_WEIGHT: 0.10
      PER_ITEM_NOMINAL_LIMIT_CENTS: 1000000
      ROUND_MODE: round_half_up
    precision: "integer, round_half_up after final multiplication"
    variants:
      - name: provisional
        when: "GET /credit_reports/{id}/projected_fico — what-if pull while a Dispute is in non-terminal status"
        difference: |
          Recomputed assuming the in-flight Dispute resolves in the consumer's
          favor: simulate furnisher response = UPDATED with requested_payload
          OR (if requested_action = DELETE_ITEM) treat the targeted
          TradelineItem as if payment_status = DELETED. The provisional run
          ALWAYS includes the in-flight dispute's projected outcome — even
          before any FurnisherInquiry response exists.
      - name: final
        when: "Stored CreditReport.fico_score on every CLOSED_* transition"
        difference: |
          Uses only post-transition (committed) TradelineItem state, with the
          actual furnisher response applied. If the in-flight dispute closed
          VERIFIED, the targeted item is unchanged. If the dispute closed
          DISMISSED_FRIVOLOUS, the targeted item is unchanged.

  # ---- Rule 1 / dual_variant_calc instance #2 -----------------------
  - name: dispute_risk_score
    trigger: "Dispute creation (POST /consumers/{consumerId}/disputes) AND on every additional_info / start_investigation"
    algorithm: weighted_scoring
    formula: |
      # Domain: Consumer (operates on dispute-history of the Consumer, not the
      # CreditReport — distinct entity domain from fico_calculation).
      # Inputs:
      #   prior_disputes_365 = count of Consumer.disputes with submitted_day >= clock.day - 365
      #   prior_dismissed_365 = count of those with status = CLOSED_DISMISSED
      #   prior_escalated_365 = count of those with status = ESCALATED at any point
      #   has_supporting_docs = bool(len(supporting_documents) > 0)
      raw =   2 * prior_disputes_365
            + 5 * prior_dismissed_365
            - 1 * (1 if has_supporting_docs else 0)
            + 3 * prior_escalated_365
      dispute_risk_score = max(0, min(100, 10 * raw))
    constants:
      WEIGHT_DISPUTES: 2
      WEIGHT_DISMISSED: 5
      WEIGHT_DOCS: -1
      WEIGHT_ESCALATED: 3
      MULTIPLIER: 10
      FLOOR: 0
      CEILING: 100
    precision: "integer, no rounding (all integer arithmetic)"
    variants:
      - name: provisional
        when: "Computed on POST /consumers/{consumerId}/disputes BEFORE Dispute row is committed; used by frivolous_threshold_check"
        difference: |
          Excludes the dispute currently being submitted from the count
          (treats it as not-yet-existing). Used to decide whether to allow
          creation in the first place.
      - name: final
        when: "Recomputed and persisted on each subsequent transition"
        difference: |
          Includes the now-committed dispute in counts. Used by downstream
          UI / audit endpoints (GET /consumers/{id}/risk).

  # ---- Rule 2 / combinatorial_formula instance #1 (mode a: ≥3 inputs, non-linear, tiered-rate selection) ----
  - name: free_report_grant_calculation
    trigger: "Dispute -> CLOSED_UPDATED or CLOSED_DELETED transitions"
    algorithm: aggregation
    formula: |
      # FCRA: a free credit report is granted to the consumer once per dispute
      # whose outcome triggered ANY change.
      # 3 inputs interact non-linearly:
      #   (a) outcome ∈ {UPDATED, DELETED}              -> boolean grant gate
      #   (b) actual_field_changed (TradelineItem mutated)  -> boolean change gate
      #   (c) consumer.has_pending_freeze (any CreditFreeze ACTIVE)  -> tier selector
      # Non-linear interaction: a grant is issued ONLY IF (a AND b);
      # and the grant SIZE is tier-selected by (c):
      #   tier_grant = 2 if has_pending_freeze else 1
      # (Rationale: a frozen consumer recovering from identity-theft gets
      # a double credit per successful dispute change.)
      # Then:
      #   free_reports_remaining =
      #       min(MAX_BALANCE, free_reports_remaining + tier_grant)
      grant = (1 if outcome in {UPDATED, DELETED} and actual_field_changed else 0)
      tier_grant = 2 * grant if has_pending_freeze else 1 * grant
      free_reports_remaining = min(MAX_BALANCE,
                                   free_reports_remaining + tier_grant)
    constants:
      MAX_BALANCE: 12
      TIER_DEFAULT: 1
      TIER_FROZEN: 2

  # ---- Rule 2 / combinatorial_formula instance #2 (mode c: pinned eval order) ----
  - name: deadline_day_calculation
    trigger: "Dispute creation AND POST .../additional_info AND CFPB re-open cascade"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency between deadline_day, additional_info_accepted,
      # and reverification_deadline_day. The scaffold PINS this evaluation order:
      #   STEP 1: base_deadline = submitted_day + 30
      #   STEP 2: if additional_info_accepted == true AND step-1 base has not
      #           already expired (i.e. clock.day <= base_deadline at the moment
      #           additional_info was accepted), extended_deadline = submitted_day + 45
      #           else extended_deadline = base_deadline
      #   STEP 3: reverification_deadline_day = forwarded_day + 25
      #           (independent of extended_deadline by design — furnisher
      #           response window is 25 clock days regardless of extension)
      #   STEP 4: On the CFPB re-open cascade:
      #             submitted_day_for_clock_purposes = original_submitted_day
      #             deadline_day = clock.day + 30  # fresh clock
      #             additional_info_accepted = false  # resets
      # The "circular" appearance is that additional_info_accepted depends on
      # deadline_day (you can only request an extension before deadline), and
      # deadline_day depends on additional_info_accepted (extension flips it).
      # The pinned order above breaks the cycle deterministically.
    constants:
      BASE_DAYS: 30
      EXTENSION_DAYS: 15      # 30 + 15 = 45
      REVERIFY_DAYS: 25

  # ---- Rule 3 not a calc (state machine) ----
  # ---- Rule 6 / boundary_precision_check (numeric) — pinned here ----
  - name: posture_calculation
    trigger: "Dispute create/close, CreditFreeze place/lift, system recompute"
    algorithm: derived
    formula: |
      # Boundary precision: "OPEN" requires ZERO active disputes (>= 0, exactly == 0)
      active_disputes = count(Dispute D where D.credit_report_id == this.id
                                          AND D.status in {RECEIVED,
                                                           UNDER_INVESTIGATION,
                                                           RESULTS_PENDING,
                                                           ESCALATED})
      active_freezes  = count(CreditFreeze F where F.consumer_id == this.consumer_id
                                              AND F.bureau == this.bureau
                                              AND F.status == ACTIVE)
      if active_freezes > 0:
        posture = FROZEN
      elif active_disputes >= 1:                # >=1 is the boundary
        posture = RESTRICTED
      else:
        posture = OPEN                          # active_disputes == 0 exactly

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC matrix; for Consumer-bound resources, X-User-ID must equal the resource's consumer_id"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment resource IDs must exist; validate left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (credit_report_id, tradeline_item_id, dispute_id, parent_complaint_id, freeze PIN-keyed freeze) must exist and belong to the same Consumer"
    error_id: ERR_CROSS_CONSUMER_REFERENCE
    http_status: 422
    applies_to: "POST .../disputes, POST .../regulatory_complaints, lift/unlock endpoints"

  - priority: 5
    category: state
    check: "Target resource must be in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "CreditReport.posture must not be FROZEN at start_investigation (FCRA does NOT freeze the dispute process itself, but our scaffold blocks new investigations on a frozen report; lifting the freeze first is required)"
    error_id: ERR_REPORT_FROZEN
    http_status: 409
    applies_to: "POST .../disputes/{id}/start_investigation"

  - priority: 7
    category: business_safety
    check: "Reage prohibition: a CORRECT_DOFD update must not move reported_dofd_day LATER than the existing reported_dofd_day"
    error_id: ERR_REAGE_PROHIBITED
    http_status: 409
    applies_to: "POST .../disputes/{id}/issue_result_notice when requested_action = CORRECT_DOFD"

  - priority: 8
    category: business_safety
    check: "Reage prohibition (alternate trigger): direct furnisher response carrying new_dofd_day > tradeline.reported_dofd_day"
    error_id: ERR_REAGE_PROHIBITED
    http_status: 409
    applies_to: "POST .../disputes/{id}/furnisher_response"

  - priority: 9
    category: business_temporal
    check: "Dispute deadline window: operator actions on a dispute must occur on or before deadline_day"
    error_id: ERR_DISPUTE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST .../disputes/{id}/furnisher_response, POST .../disputes/{id}/issue_result_notice, POST .../disputes/{id}/additional_info"

  - priority: 10
    category: business_temporal
    check: "Furnisher reverification window: furnisher_response must arrive by reverification_deadline_day; otherwise sweep flips response to NO_RESPONSE"
    error_id: ERR_FURNISHER_LATE
    http_status: 409
    applies_to: "POST .../disputes/{id}/furnisher_response"

  - priority: 11
    category: business_referential
    check: "Supporting documents are mandatory at submission and at start_investigation"
    error_id: ERR_NO_SUPPORTING_DOCUMENTS
    http_status: 422
    applies_to: "POST .../disputes, POST .../disputes/{id}/start_investigation"

  - priority: 12
    category: business_constraint
    check: "Frivolous-dispute threshold: more than 3 submissions on the same tradeline_item_id in 365 days is frivolous"
    error_id: ERR_FRIVOLOUS_DISPUTE
    http_status: 409
    applies_to: "POST .../disputes, POST .../disputes/{id}/start_investigation"

  - priority: 13
    category: business_referential
    check: "At most one active Dispute per TradelineItem (status not in CLOSED_*)"
    error_id: ERR_DUPLICATE_ACTIVE_DISPUTE
    http_status: 409
    applies_to: "POST .../disputes"

  - priority: 14
    category: business_constraint
    check: "Hard inquiry blocked when CreditFreeze is ACTIVE on the (consumer, bureau); separate code when CreditLock is LOCKED"
    error_id: "ERR_HARD_INQUIRY_BLOCKED_BY_FREEZE | ERR_HARD_INQUIRY_BLOCKED_BY_LOCK"
    http_status: 409
    applies_to: "POST /credit_reports/{id}/hard_inquiries"

  - priority: 15
    category: business_constraint
    check: "CreditFreeze.lift requires correct PIN"
    error_id: ERR_INVALID_FREEZE_PIN
    http_status: 403
    applies_to: "POST .../credit_freezes/{id}/lift"

  - priority: 16
    category: business_constraint
    check: "Regulatory complaint may only escalate a Dispute in {CLOSED_VERIFIED, CLOSED_DISMISSED}; rejected refiles must reference parent_complaint_id"
    error_id: ERR_NOT_ESCALATABLE
    http_status: 409
    applies_to: "POST /consumers/{id}/regulatory_complaints"

  - priority: 17
    category: business_constraint
    check: "Only one open RegulatoryComplaint per Dispute (status in {FILED, UNDER_REVIEW})"
    error_id: ERR_COMPLAINT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /consumers/{id}/regulatory_complaints"

  - priority: 18
    category: business_constraint
    check: "Freeze uniqueness: at most one ACTIVE CreditFreeze per (consumer_id, bureau)"
    error_id: ERR_FREEZE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /consumers/{id}/credit_freezes"

  - priority: 19
    category: business_constraint
    check: "Lock uniqueness: at most one LOCKED CreditLock per (consumer_id, bureau)"
    error_id: ERR_LOCK_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /consumers/{id}/credit_locks"

  - priority: 20
    category: business_referential
    check: "Annual free-report cap: free_reports_remaining must be > 0 before a free credit report can be pulled"
    error_id: ERR_NO_FREE_REPORTS_REMAINING
    http_status: 409
    applies_to: "POST /credit_reports/{id}/pull_free"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Consumer ----
  - { method: POST, path: "/consumers",                                       description: "Create Consumer",                                 roles: [PlatformAdmin],                          code: 201, input: [full_name, ssn_last4, email], output: Consumer,            side_effects: ["free_reports_remaining=1", "freeze_pin=null"] }
  - { method: GET,  path: "/consumers/{consumerId}",                          description: "Get Consumer",                                    roles: [Consumer, PlatformAdmin],               code: 200, input: [], output: Consumer,                                       side_effects: [] }
  - { method: GET,  path: "/consumers/{consumerId}/risk",                     description: "Get final-variant dispute_risk_score",            roles: [Consumer, PlatformAdmin],               code: 200, input: [], output: object,                                         side_effects: [] }

  # ---- Furnisher (operator catalogue) ----
  - { method: POST, path: "/furnishers",                                      description: "Register Furnisher",                              roles: [PlatformAdmin],                          code: 201, input: [legal_name, ecoa_code], output: Furnisher,                  side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/furnishers/{furnisherId}",                        description: "Get Furnisher",                                   roles: [PlatformAdmin, BureauOperator, Furnisher], code: 200, input: [], output: Furnisher,                                    side_effects: [] }

  # ---- CreditReport ----
  - { method: POST, path: "/consumers/{consumerId}/credit_reports",            description: "Create a CreditReport for a bureau",              roles: [PlatformAdmin],                          code: 201, input: [bureau], output: CreditReport,                                side_effects: ["status=ACTIVE", "posture=OPEN", "fico_score=300"] }
  - { method: GET,  path: "/consumers/{consumerId}/credit_reports/{creditReportId}", description: "Get a CreditReport (committed)",         roles: [Consumer, PlatformAdmin],               code: 200, input: [], output: CreditReport,                                    side_effects: [] }
  - { method: GET,  path: "/consumers/{consumerId}/credit_reports/{creditReportId}/projected_fico", description: "Compute provisional FICO if all open disputes resolved in consumer's favor", roles: [Consumer], code: 200, input: [], output: object, side_effects: [] }
  - { method: POST, path: "/consumers/{consumerId}/credit_reports/{creditReportId}/pull_free", description: "Consume a free-report grant and bump last_pulled_day", roles: [Consumer],                              code: 200, input: [], output: CreditReport,                                    side_effects: ["free_reports_remaining -= 1", "last_pulled_day = clock.day"] }
  - { method: POST, path: "/consumers/{consumerId}/credit_reports/{creditReportId}/archive", description: "Archive a CreditReport",          roles: [PlatformAdmin],                          code: 200, input: [], output: CreditReport,                                    side_effects: ["status=ARCHIVED"] }

  # ---- TradelineItem ----
  - { method: POST, path: "/credit_reports/{creditReportId}/tradeline_items",  description: "Add a TradelineItem (operator/furnisher seed)",  roles: [PlatformAdmin, Furnisher],              code: 201, input: [furnisher_id, account_ref, original_dofd_day, balance_cents, payment_status], output: TradelineItem, side_effects: ["reported_dofd_day = original_dofd_day", "verification_status=UNVERIFIED", "fico_calculation recompute"] }
  - { method: GET,  path: "/credit_reports/{creditReportId}/tradeline_items/{tradelineItemId}", description: "Get a TradelineItem",        roles: [Consumer, PlatformAdmin, BureauOperator, Furnisher], code: 200, input: [], output: TradelineItem,                          side_effects: [] }

  # ---- Dispute ----
  - { method: POST, path: "/consumers/{consumerId}/disputes",                 description: "Submit a Dispute",                                roles: [Consumer],                               code: 201, input: [credit_report_id, tradeline_item_id, channel, supporting_documents, requested_action, requested_payload], output: Dispute, side_effects: ["status=RECEIVED", "submitted_day=clock.day", "deadline_day=submitted_day+30", "dispute_risk_score (provisional) evaluated, frivolous_threshold_check"] }
  - { method: GET,  path: "/consumers/{consumerId}/disputes/{disputeId}",     description: "Get a Dispute",                                   roles: [Consumer, BureauOperator, PlatformAdmin], code: 200, input: [], output: Dispute,                                         side_effects: [] }
  - { method: POST, path: "/consumers/{consumerId}/disputes/{disputeId}/start_investigation", description: "Bureau opens investigation", roles: [BureauOperator],                         code: 200, input: [], output: Dispute,                                                                                             side_effects: ["status=UNDER_INVESTIGATION", "Auto-create FurnisherInquiry", "posture recompute"] }
  - { method: POST, path: "/consumers/{consumerId}/disputes/{disputeId}/additional_info", description: "Consumer submits additional info -> extension to 45 days", roles: [Consumer],                  code: 200, input: [supporting_documents], output: Dispute,                                                                       side_effects: ["additional_info_accepted=true", "deadline_day=submitted_day+45 (deadline_day_calculation)"] }
  - { method: POST, path: "/consumers/{consumerId}/disputes/{disputeId}/furnisher_response", description: "Bureau records furnisher's reverification response", roles: [BureauOperator],         code: 200, input: [response, response_payload], output: Dispute,                                                                  side_effects: ["FurnisherInquiry.response set", "status=RESULTS_PENDING"] }
  - { method: POST, path: "/consumers/{consumerId}/disputes/{disputeId}/issue_result_notice", description: "Bureau issues written results notice", roles: [BureauOperator],                code: 200, input: [], output: ResultNotice,                                                                                       side_effects: ["status -> CLOSED_VERIFIED | CLOSED_UPDATED | CLOSED_DELETED", "free_report_grant_calculation", "fico_calculation"] }
  - { method: POST, path: "/consumers/{consumerId}/disputes/{disputeId}/dismiss_frivolous", description: "Bureau dismisses frivolous dispute", roles: [BureauOperator],                       code: 200, input: [], output: ResultNotice,                                                                                       side_effects: ["status=CLOSED_DISMISSED", "ResultNotice with outcome=DISMISSED_FRIVOLOUS"] }
  - { method: GET,  path: "/consumers/{consumerId}/disputes/{disputeId}/result_notice", description: "Fetch the issued ResultNotice",          roles: [Consumer, BureauOperator, PlatformAdmin], code: 200, input: [], output: ResultNotice,                                    side_effects: [] }

  # ---- RegulatoryComplaint ----
  - { method: POST, path: "/consumers/{consumerId}/regulatory_complaints",     description: "Escalate to CFPB",                                roles: [Consumer],                               code: 201, input: [dispute_id, parent_complaint_id, narrative], output: RegulatoryComplaint,                                            side_effects: ["status=FILED", "Dispute.status=ESCALATED"] }
  - { method: GET,  path: "/regulatory_complaints/{complaintId}",              description: "Get RegulatoryComplaint",                         roles: [Consumer, CFPBOperator, PlatformAdmin], code: 200, input: [], output: RegulatoryComplaint,                                 side_effects: [] }
  - { method: POST, path: "/regulatory_complaints/{complaintId}/accept",       description: "CFPB accepts complaint -> bureau must reopen",    roles: [CFPBOperator],                           code: 200, input: [], output: RegulatoryComplaint,                                                                                 side_effects: ["status=UNDER_REVIEW", "Cascade: Dispute.ESCALATED -> UNDER_INVESTIGATION, new FurnisherInquiry, deadline_day=clock.day+30 (dispute_reopen_cascade)"] }
  - { method: POST, path: "/regulatory_complaints/{complaintId}/reject",       description: "CFPB rejects complaint",                          roles: [CFPBOperator],                           code: 200, input: [], output: RegulatoryComplaint,                                 side_effects: ["status=REJECTED"] }
  - { method: POST, path: "/regulatory_complaints/{complaintId}/resolve",      description: "CFPB marks complaint resolved",                   roles: [CFPBOperator],                           code: 200, input: [], output: RegulatoryComplaint,                                 side_effects: ["status=RESOLVED"] }

  # ---- CreditFreeze ----
  - { method: POST, path: "/consumers/{consumerId}/credit_freezes",            description: "Place a CreditFreeze",                            roles: [Consumer],                               code: 201, input: [bureau], output: CreditFreeze,                                                                                    side_effects: ["status=ACTIVE", "placed_day=clock.day", "Consumer.freeze_pin minted on first ACTIVE freeze", "posture recompute -> FROZEN"] }
  - { method: GET,  path: "/consumers/{consumerId}/credit_freezes/{freezeId}", description: "Get CreditFreeze",                                roles: [Consumer, PlatformAdmin],               code: 200, input: [], output: CreditFreeze,                                       side_effects: [] }
  - { method: POST, path: "/consumers/{consumerId}/credit_freezes/{freezeId}/lift", description: "Lift CreditFreeze with PIN",                 roles: [Consumer],                               code: 200, input: [pin], output: CreditFreeze,                                                                                      side_effects: ["status=LIFTED", "lifted_day=clock.day", "posture recompute"] }

  # ---- CreditLock ----
  - { method: POST, path: "/consumers/{consumerId}/credit_locks",              description: "Engage a CreditLock",                             roles: [Consumer],                               code: 201, input: [bureau], output: CreditLock,                                                                                      side_effects: ["status=LOCKED", "locked_at_day=clock.day"] }
  - { method: POST, path: "/consumers/{consumerId}/credit_locks/{lockId}/unlock", description: "Unlock a CreditLock",                          roles: [Consumer],                               code: 200, input: [], output: CreditLock,                                         side_effects: ["status=UNLOCKED"] }
  - { method: POST, path: "/consumers/{consumerId}/credit_locks/{lockId}/relock", description: "Relock a CreditLock",                          roles: [Consumer],                               code: 200, input: [], output: CreditLock,                                         side_effects: ["status=LOCKED"] }

  # ---- HardInquiry ----
  - { method: POST, path: "/credit_reports/{creditReportId}/hard_inquiries",   description: "Furnisher requests a hard pull",                  roles: [Furnisher],                              code: 201, input: [requesting_furnisher_id], output: HardInquiry,                                                                  side_effects: ["outcome=ACCEPTED | BLOCKED_FREEZE | BLOCKED_LOCK depending on freeze/lock state"] }

  # ---- Test-driving system endpoints (REQUIRED per testability principle) ----
  - { method: POST, path: "/_clock/advance",                                   description: "Advance the test clock by {days}",                roles: [PlatformAdmin],                          code: 200, input: [days], output: object,                                                                                          side_effects: ["clock.day += days; does NOT itself run sweeps — call /_sweep/run to fire deadlines"] }
  - { method: GET,  path: "/_clock",                                            description: "Read the current clock.day",                      roles: [PlatformAdmin, Consumer, BureauOperator, Furnisher, CFPBOperator], code: 200, input: [], output: object,                                                                                              side_effects: [] }
  - { method: POST, path: "/_sweep/run",                                       description: "Run the daily sweep: furnisher non-response flips, deadline-passed dismissals",   roles: [PlatformAdmin],   code: 200, input: [], output: object,                                                                                          side_effects: ["For each FurnisherInquiry with response=PENDING AND clock.day > reverification_deadline_day: response=NO_RESPONSE, Dispute -> RESULTS_PENDING via system arm"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Auth & generic ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE,                      http: 403, condition: "Role not authorized for endpoint, or cross-consumer access" }
  - { id: ERR_NOT_FOUND,                               http: 404, condition: "Resource id in path does not exist" }
  - { id: ERR_INVALID_REQUEST,                         http: 400, condition: "Malformed body / wrong types" }
  - { id: ERR_INVALID_STATE_TRANSITION,                http: 409, condition: "Target resource not in valid state for requested transition" }
  - { id: ERR_CROSS_CONSUMER_REFERENCE,                http: 422, condition: "Body FK belongs to a different Consumer" }

  # --- Dispute lifecycle ---
  - { id: ERR_NO_SUPPORTING_DOCUMENTS,                 http: 422, condition: "supporting_documents missing or empty at submit/start_investigation" }
  - { id: ERR_DUPLICATE_ACTIVE_DISPUTE,                http: 409, condition: "An active Dispute already exists for the (consumer, tradeline_item)" }
  - { id: ERR_FRIVOLOUS_DISPUTE,                       http: 409, condition: ">3 disputes on the same tradeline_item in 365 days" }
  - { id: ERR_DISPUTE_DEADLINE_PASSED,                 http: 409, condition: "Operator action attempted after deadline_day" }
  - { id: ERR_FURNISHER_LATE,                          http: 409, condition: "Furnisher response after reverification_deadline_day" }
  - { id: ERR_REAGE_PROHIBITED,                        http: 409, condition: "Attempt to move reported_dofd_day LATER than current value" }
  - { id: ERR_REPORT_FROZEN,                           http: 409, condition: "start_investigation while CreditReport.posture=FROZEN" }
  - { id: ERR_REPORT_HAS_OPEN_DISPUTES,                http: 409, condition: "Archive attempted while non-terminal disputes exist" }

  # --- Regulatory ---
  - { id: ERR_NOT_ESCALATABLE,                         http: 409, condition: "Dispute not in {CLOSED_VERIFIED, CLOSED_DISMISSED} when escalation attempted" }
  - { id: ERR_COMPLAINT_ALREADY_OPEN,                  http: 409, condition: "Open RegulatoryComplaint exists for the Dispute" }
  - { id: ERR_DISPUTE_NOT_RECLOSED,                    http: 409, condition: "CFPB resolve attempted while underlying Dispute not back in CLOSED_*" }

  # --- Freeze / Lock / Inquiry ---
  - { id: ERR_FREEZE_ALREADY_ACTIVE,                   http: 409, condition: "ACTIVE CreditFreeze already exists for (consumer, bureau)" }
  - { id: ERR_LOCK_ALREADY_ACTIVE,                     http: 409, condition: "LOCKED CreditLock already exists for (consumer, bureau)" }
  - { id: ERR_INVALID_FREEZE_PIN,                      http: 403, condition: "Provided PIN does not match Consumer.freeze_pin" }
  - { id: ERR_HARD_INQUIRY_BLOCKED_BY_FREEZE,          http: 409, condition: "Hard pull attempted while CreditFreeze.status=ACTIVE on (consumer, bureau)" }
  - { id: ERR_HARD_INQUIRY_BLOCKED_BY_LOCK,            http: 409, condition: "Hard pull attempted while CreditLock.status=LOCKED on (consumer, bureau)" }

  # --- Reports ---
  - { id: ERR_NO_FREE_REPORTS_REMAINING,               http: 409, condition: "free_reports_remaining = 0 when pull_free attempted" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Consumer
    description: "End-consumer acting on their own credit identity"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /consumers/{consumerId}/disputes — submit dispute"
      - "POST /consumers/{consumerId}/disputes/{disputeId}/additional_info — request extension"
      - "POST /consumers/{consumerId}/regulatory_complaints — file CFPB escalation"
      - "POST /consumers/{consumerId}/credit_freezes — place freeze"
      - "POST /consumers/{consumerId}/credit_freezes/{freezeId}/lift — lift freeze with PIN"
      - "POST /consumers/{consumerId}/credit_locks — engage lock"
      - "POST /consumers/{consumerId}/credit_locks/{lockId}/unlock — unlock"
      - "POST /consumers/{consumerId}/credit_locks/{lockId}/relock — relock"
      - "POST /consumers/{consumerId}/credit_reports/{creditReportId}/pull_free — consume free pull"
    shared_operations:
      - "GET /consumers/{consumerId} (own)"
      - "GET /consumers/{consumerId}/credit_reports/{creditReportId} (own)"
      - "GET /consumers/{consumerId}/credit_reports/{creditReportId}/projected_fico (own)"
      - "GET /consumers/{consumerId}/disputes/{disputeId} (own)"
      - "GET /consumers/{consumerId}/disputes/{disputeId}/result_notice (own)"
      - "GET /regulatory_complaints/{complaintId} (own)"
      - "GET /credit_reports/{creditReportId}/tradeline_items/{tradelineItemId} (on own report)"
      - "GET /consumers/{consumerId}/credit_freezes/{freezeId} (own)"
      - "GET /_clock"

  - name: BureauOperator
    description: "Credit bureau operator (Equifax / Experian / TransUnion staff) running the FCRA investigation pipeline"
    identity: "opaque"
    exclusive_operations:
      - "POST /consumers/{consumerId}/disputes/{disputeId}/start_investigation"
      - "POST /consumers/{consumerId}/disputes/{disputeId}/furnisher_response"
      - "POST /consumers/{consumerId}/disputes/{disputeId}/issue_result_notice"
      - "POST /consumers/{consumerId}/disputes/{disputeId}/dismiss_frivolous"
    shared_operations:
      - "GET /consumers/{consumerId}/disputes/{disputeId}"
      - "GET /consumers/{consumerId}/disputes/{disputeId}/result_notice"
      - "GET /credit_reports/{creditReportId}/tradeline_items/{tradelineItemId}"
      - "GET /furnishers/{furnisherId}"
      - "GET /_clock"

  - name: Furnisher
    description: "Original creditor / information furnisher; seeds tradelines and requests hard inquiries"
    identity: "entity_backed:Furnisher"
    exclusive_operations:
      - "POST /credit_reports/{creditReportId}/tradeline_items"
      - "POST /credit_reports/{creditReportId}/hard_inquiries"
    shared_operations:
      - "GET /furnishers/{furnisherId} (own)"
      - "GET /credit_reports/{creditReportId}/tradeline_items/{tradelineItemId} (own-furnisher rows)"
      - "GET /_clock"

  - name: CFPBOperator
    description: "Consumer Financial Protection Bureau operator handling regulatory complaints"
    identity: "opaque"
    exclusive_operations:
      - "POST /regulatory_complaints/{complaintId}/accept"
      - "POST /regulatory_complaints/{complaintId}/reject"
      - "POST /regulatory_complaints/{complaintId}/resolve"
    shared_operations:
      - "GET /regulatory_complaints/{complaintId}"
      - "GET /_clock"

  - name: PlatformAdmin
    description: "Operator of the bench platform: seeds Consumers, CreditReports, Furnishers, drives test clock and sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /consumers"
      - "POST /furnishers"
      - "POST /consumers/{consumerId}/credit_reports"
      - "POST /credit_reports/{creditReportId}/tradeline_items"
      - "POST /consumers/{consumerId}/credit_reports/{creditReportId}/archive"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET /consumers/{consumerId}"
      - "GET /consumers/{consumerId}/credit_reports/{creditReportId}"
      - "GET /consumers/{consumerId}/disputes/{disputeId}"
      - "GET /consumers/{consumerId}/disputes/{disputeId}/result_notice"
      - "GET /consumers/{consumerId}/credit_freezes/{freezeId}"
      - "GET /regulatory_complaints/{complaintId}"
      - "GET /credit_reports/{creditReportId}/tradeline_items/{tradelineItemId}"
      - "GET /furnishers/{furnisherId}"
      - "GET /_clock"
