            - "${bill_submitted} == 0 and ${inv_submitted} == 400000 — a SUBMITTED filing is not billable"
            - "${bill_rejected} == 0 and ${inv_rejected} == 400000 — a rejection never enters the ledger"
            - "${f_confirmed} == CONFIRMED with ${f_conf_at} == \"2026-08-01T00:00:00.000Z\""
