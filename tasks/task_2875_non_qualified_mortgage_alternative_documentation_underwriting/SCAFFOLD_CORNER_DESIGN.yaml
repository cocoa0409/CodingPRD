            - "Third trigger call: points_and_fees_total_cents == 3100000 (600000 + 2500000), total_loan_amount_cents == 59400000, points_and_fees_cap_cents == 2970000 and points_and_fees_test_result == FAIL"
            - "Third trigger call: the result changed, so atr_documentation_status is invalidated to INCOMPLETE and safe_harbor_class to NOT_EVALUATED"
            - "Fourth trigger call: HTTP status == 422 and error_id == ERR_HIGH_COST_LOAN_PROHIBITED, not ERR_ATR_DOCUMENTATION_INCOMPLETE - validations[priority=18] runs before priority 19 even though both are violated"
            - "Fifth trigger call: atr_documentation_status == DOCUMENTED again but safe_harbor_class == HIGH_COST_PROHIBITED, because the FAIL branch of calculations.atr_determination outranks the rate-spread branch"
            - "Fifth trigger call: securitization_eligible == false and GET /loan-files/${lf_id} still reports status == UNDERWRITING"

      - name: corner_priority_conflict_state_versus_ceiling
