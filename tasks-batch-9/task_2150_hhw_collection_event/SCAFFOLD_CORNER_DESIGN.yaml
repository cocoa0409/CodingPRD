          assert:
            - "${cost1} == 200000"
            - "${blended} == 100.0 and ${invoiced} == 200000"
            - "${rec_ton} == 2000.0 — exactly on the tier boundary"
            - "${subtotal} == 200000"
            - "${mobil} == 180000 — TIER 2 applies at t == 2000, not TIER 1"
            - "${rebate} == 6000"
            - "${staffing} == 50400"
            - "${pre} == 424400"
            - "${contingency} == 33952"
            - "${total} == 458352"
            - "${participants} == 1 and ${cpp} == 458352"

      - name: certified_staff_hours_excludes_released_assignments
