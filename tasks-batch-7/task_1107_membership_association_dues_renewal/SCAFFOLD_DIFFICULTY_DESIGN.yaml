  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dues_schedule_half_open_interval_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Resource = DuesSchedule for a given category. Interval
          semantics = half-open [effective_from, effective_to).
          Back-to-back schedules (s1.effective_to == s2.effective_from)
          do NOT overlap and are allowed; a one-second overlap is
          rejected. Half-open boundary arithmetic.
        test_recipe:
          setup:
            - "Category PROF"
            - "Schedule S1 PUBLISHED with [2026-01-01, 2027-01-01)"
            - "Schedule S2 DRAFT with [2027-01-01, null) — adjacent, no overlap, should publish cleanly"
            - "Schedule S3 DRAFT with [2026-12-31, null) — 1-day overlap with S1, publish must fail"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s1: $.data.id }
            - call: "POST /api/dues-schedules/${s1}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2027-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 125000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s2: $.data.id }
            - call: "POST /api/dues-schedules/${s2}/increase-notices"
              payload: {}
              as: DuesAdministrator
          trigger:
            - call: "POST /api/dues-schedules/${s2}/publish"
              payload: {}
              as: DuesAdministrator
          assert:
            - "Schedule.${s2}.status == PUBLISHED (adjacent half-open boundary is allowed)"

      - name: membership_term_reinstatement_back_to_back
        grounds:
          - state_machines.Member.transitions.LAPSED_to_REINSTATED
          - calculations.reinstatement_back_dues
        distinguishing_aspect: |
          Resource = MembershipTerm for a given member. Interval
          semantics = closed-open period re-anchor with GAP
          materialized. When reinstatement is approved, the new term
          opens at reinstatement approval date; the lapsed gap
          [lapse_date, reinstate_date) is billed as back-dues via a
          computed DuesInvoice — no interval overlap between the new
          term and the prior CLOSED term, but the system MUST detect
          and price the gap. Different interval semantics from the
          half-open schedule adjacency (this detects gaps, not
          collisions). Different entity (MembershipTerm vs
          DuesSchedule).
        test_recipe:
          setup:
            - "Category PROF (grace=30, reinstate_window=90), chapter, ANNIVERSARY policy, schedule published (annual=120000, bps=2000)"
            - "Member joined 2026-05-01, settled, ACTIVE; clock to 2027-06-15 (past period end 2027-05-01, past grace 2027-05-31) -> LAPSED"
            - "Reinstatement request filed 2027-07-01 -> back-dues invoice created covering lapsed period"
            - "Back-dues invoice settled; approve reinstatement"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv0: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv0}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/verify"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: DuesAdministrator
            - call: "POST /api/_scheduler/run_renewal_cycle"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: DuesAdministrator
            - call: "POST /api/members/${m}/reinstatement-requests"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { rid: $.data.id, back_inv: $.data.back_dues_invoice_id }
            - call: "POST /api/dues-invoices/${back_inv}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /api/members/${m}/reinstatement-requests/${rid}/approve"
              payload: {}
              as: MembershipAdministrator
            - call: "GET /api/members/${m}/membership-terms"
              payload: {}
              as: MembershipAdministrator
          assert:
            - "Member.${m}.status == ACTIVE"
            - "ReinstatementRequest.${rid}.status == APPROVED"
            - "New MembershipTerm opened with opened_by == REINSTATEMENT"
            - "Back-dues invoice ${back_inv} payment_status == SETTLED"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lifetime_dues_paid_conserved_under_settle_then_refund
        grounds:
          - calculations.chapter_share_amount
          - entities.Member.fields.lifetime_dues_paid_cents
          - state_machines.DuesInvoice.transitions
        distinguishing_aspect: |
          Conserved quantity = Member.lifetime_dues_paid_cents (dues
          ledger). Forward action = payment SETTLED (+amount_cents);
          compensating action = refund (-amount_cents). Net drift on
          lifetime_dues_paid_cents MUST be zero after settle+refund
          pair.
        test_recipe:
          setup:
            - "Category PROF, chapter, ANNIVERSARY policy, schedule published (annual=120000)"
            - "Member M joined, initial invoice settled, ACTIVE — lifetime_dues_paid_cents = 120000"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
