          - entities.ValuationOrder.fields.effective_date
          - entities.ValuationOrder.fields.validity_expires_date
          - endpoints.POST_valuation_orders
        distinguishing_aspect: |
          A different resource entity (LoanFile, whose per-valuation_type re-order slot is the
          contended resource) with different interval semantics: not sibling-interval overlap
          but a CLOSED 30-day buffer measured in whole days from one order's effective_date to
          the logical clock. Day 30 is still inside the buffer and refused, day 31 is outside
          and allowed; the buffer is scoped per valuation_type, and a REJECTED order vacates
          its slot immediately.
        test_recipe:
          setup:
            - "The logical clock is set back to 2026-07-01T00:00:00Z."
            - "A DSCR program and a 40000000-cent interest-only investment loan in UNDERWRITING."
            - "A PRIMARY_APPRAISAL ordered with effective_date 2026-07-01T00:00:00Z, still ORDERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /documentation-programs"
              payload: { program_code: "DSCR", name: "Investor DSCR", min_dscr: 1.1000, max_ltv_pct: 85.00, min_fico: 660, min_reserves_months: 6, min_residual_income_cents: 0, second_valuation_ltv_threshold_pct: 90.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: true, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_rb_id: "$.data.id" }
            - call: "POST /borrowers"
