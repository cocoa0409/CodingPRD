      - name: certificate_rejection_four_hop_cascade_stales_the_draft_notice
        grounds:
          - endpoints.POST /exemption-certificates/{id}/review
          - calculations.certificate_deficiency
          - entities.SampleUnit.fields.error_class
          - entities.Audit.fields.projection_status
          - state_machines.Assessment
        distinguishing_aspect: |
          Rejecting a certificate that is linked to a sampled invoice must travel four
          hops: certificate REJECTED with missing_certificate_tax_cents 50000 -> the
          linked SampleUnit redetermined to CERTIFICATE_DEFECT with error_amount_cents
          50000 -> Audit.projection_status STALE -> the DRAFT Assessment cascaded to
          DRAFT_STALE. Because the certificate is linked, Audit.certificate_deficiency_cents
          must stay 0 — the deficiency travels through the unit, and double-counting it
          in both places is the failure this catches.
        test_recipe:
          setup:
            - "The MINI fixture carried to a DRAFT Assessment (one CONSUMABLE purchase of 76208 cents), whose sampled invoice carries exempt_sale_amount_cents 800000 and error_class NO_ERROR."
            - "The audit is then reopened with POST /audits/{id}/reopen-fieldwork, which unfreezes the finding set while leaving the Assessment in DRAFT — the only way to hold a DRAFT notice over a FIELDWORK audit."
            - "The certificate is filed with received_before_sale false, so good_faith_accepted is false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools Inc", permit_number: "P-2710-C2", industry_naics_code: "444140", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000, delinquent_period_count: 0 }
              as: SelectionAnalyst
              captures: { tc_id: "$.data.id" }
            - call: "POST /industry-projects"
