      - name: plan_patient_mismatch_at_sixty_is_reported_ahead_of_the_out_of_range_cycle_at_sixty_five
        claim_type: priority_ordering
        grounds:
          - validations[priority 60]
          - validations[priority 65]
          - errors[ERR_PLAN_PATIENT_MISMATCH]
          - errors[ERR_CYCLE_OUT_OF_RANGE]
        distinguishing_aspect: |
          One request violates both rules at once — the plan belongs to a different patient
          AND cycle_number 99 exceeds total_cycles 6 — and both errors carry HTTP 422, so
          only the error_id distinguishes them. The declared order requires
          ERR_PLAN_PATIENT_MISMATCH. Repairing just the patient then surfaces
          ERR_CYCLE_OUT_OF_RANGE from the same request shape, proving the second rule was
          live all along and merely outranked.
        test_recipe:
          setup:
            - "Standing center, chair, nurse, drug and MID template."
            - "Two patients OWNER and OTHER, each 70 kg; one ACTIVE 6-cycle plan belonging to OWNER."
          setup_api_calls:
