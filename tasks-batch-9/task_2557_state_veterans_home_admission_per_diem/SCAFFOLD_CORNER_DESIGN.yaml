              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Fern Osgood", date_of_birth: "1944-02-02", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
              captures: { score_elig: "$.data.priority_score", class_elig: "$.data.priority_class" }
          trigger:
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 1.50, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { low_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${low_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { err: "$.data.error_id" }
            - call: "GET /svh/applicants/${app_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { score_after_refusal: "$.data.priority_score" }
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 2.00, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { ok_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${ok_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { ok_status: "$.data.status", ok_acuity: "$.data.acuity_points" }
            - call: "GET /svh/applicants/${app_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { score_after_submit: "$.data.priority_score" }
          assert:
            - "class_elig == CLASS_1"
            - "score_elig == 1270"
            - "the 1.50 submit returns HTTP 409"
            - "err == ERR_CARE_LEVEL_MISMATCH"
            - "ClinicalAssessment.${low_id}.status == DRAFT"
            - "ClinicalAssessment.${low_id}.version == 1"
            - "score_after_refusal == 1270"
            - "the 2.00 submit returns HTTP 200"
            - "ok_status == SUBMITTED"
            - "ok_acuity == 120"
            - "score_after_submit == 1390"

      - name: sm_clinical_assessment_double_submit_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ClinicalAssessment.DRAFT_to_SUBMITTED
          - validations[priority=60,ERR_ASSESSMENT_STATE_INVALID]
          - errors.ERR_ASSESSMENT_STATE_INVALID
        distinguishing_aspect: |
          Submitting the same assessment twice is not idempotent-success: the second call answers
          409 ERR_ASSESSMENT_STATE_INVALID, the row stays SUBMITTED at version 2 (not 3), and the
          applicant's priority_score is not credited with the acuity term a second time.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome, one CERTIFIED NURSING CareUnit, and one ELIGIBLE CLASS_1 Applicant (disability 80, residency 6) with one DRAFT NURSING assessment at 3.00 hours."
