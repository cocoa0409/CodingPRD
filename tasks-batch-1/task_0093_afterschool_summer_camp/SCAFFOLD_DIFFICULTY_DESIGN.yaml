  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: session_cancel_depth3_cascade_to_invoice_totals
        grounds:
          - state_machines.Session.OPEN_to_CANCELLED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - calculations.reconcile_offering_counts
          - calculations.compute_invoice_totals
        distinguishing_aspect: |
          Depth-3 chain triggered by SESSION_CANCELLED: cancel withdraws the Enrollment (link 1),
          the withdrawal forces reconcile_offering_counts to drop enrolled_count (link 2, caused by
          link 1), and that count change forces compute_invoice_totals to drop subtotal/total_due
          on the child's DRAFT invoice (link 3, caused by link 2).
        test_recipe:
          setup:
            - "OPEN CAMP session base 20000, one offering, one CONFIRMED child; DRAFT invoice subtotal 21500."
          setup_api_calls:
            - call: "POST /guardians"
