              as_user_id: "${mod_id}"
              captures: { p1_v_post_uphold: "$.data.version" }
            - call: "GET /neighborhood/flag-reports"
              payload: { target_id: "${p1_id}", status: "UPHELD" }
              as: Moderator
              as_user_id: "${mod_id}"
              captures: { fr_upheld_id: "$.data[0].id" }
          trigger:
            - call: "POST /neighborhood/moderation-decisions"
              payload: { moderator_resident_id: "${mod_id}", flag_report_id: "${fr_upheld_id}", decision: "REVERSE", rationale: "false", expected_target_version: "${p1_v_post_uphold}" }
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "GET /neighborhood/residents/${r1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { r1_trust_post: "$.data.trust_score" }
          assert:
            - "Resident.${r1_id}.trust_score before UPHOLD == 100"
            - "Resident.${r1_id}.trust_score after REVERSE == 100"
            - "Conserved quantity trust_score has net delta 0 across UPHOLD/REVERSE cycle"

      - name: critical_incident_create_then_resolve_leaves_unresolved_critical_count_unchanged
        grounds:
          - state_machines.Incident.OPEN_to_ACKNOWLEDGED
          - state_machines.Incident.ACKNOWLEDGED_to_RESOLVED
          - calculations.neighborhood_safety_posture
          - entities.Neighborhood.fields.unresolved_critical_count
        distinguishing_aspect: |
          Conserved quantity: Neighborhood.unresolved_critical_count. Invariant:
          for every CRITICAL Incident create -> ACKNOWLEDGE -> RESOLVE cycle,
          `Neighborhood.unresolved_critical_count(before create) ==
          Neighborhood.unresolved_critical_count(after RESOLVE)`. Different
          conserved quantity from trust_score.
        test_recipe:
          setup:
            - "Neighborhood N1 with unresolved_critical_count=0, safety_posture=OPEN."
            - "Verified Resident R1 in N1; AgencyOfficer OFF1."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/residents"
              payload: { email: "mod@x.com", display_name: "Mod", home_address_line: "1 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { mod_id: "$.data.id" }
            - call: "POST /neighborhood/residents/${mod_id}/promote-moderator"
              payload: {}
              as: PlatformAdmin
            - call: "POST /neighborhood/residents"
              payload: { email: "r1@x.com", display_name: "R1", home_address_line: "2 A St", home_lat: 37.75, home_lng: -122.42, primary_neighborhood_id: "${n1_id}" }
              as: PlatformAdmin
              captures: { r1_id: "$.data.id" }
            - call: "GET /neighborhood/verification-requests"
              payload: { resident_id: "${r1_id}" }
              as: PlatformAdmin
              captures: { vr_r1_id: "$.data[0].id" }
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/claim"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "POST /neighborhood/verification-requests/${vr_r1_id}/approve"
              payload: {}
              as: Moderator
              as_user_id: "${mod_id}"
            - call: "GET /neighborhood/neighborhoods/${n1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { n1_ucount_pre: "$.data.unresolved_critical_count" }
            - call: "POST /neighborhood/incidents"
              payload: { reporter_resident_id: "${r1_id}", neighborhood_id: "${n1_id}", incident_lat: 37.75, incident_lng: -122.42, severity: "CRITICAL", category: "PROPERTY_CRIME", description: "1", occurred_at: "2026-06-01T00:00:00Z" }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { i1_id: "$.data.id" }
            - call: "POST /neighborhood/incidents/${i1_id}/acknowledge"
              payload: {}
              as: AgencyOfficer
              as_user_id: "OFF1"
          trigger:
            - call: "POST /neighborhood/incidents/${i1_id}/resolve"
              payload: {}
              as: AgencyOfficer
              as_user_id: "OFF1"
            - call: "GET /neighborhood/neighborhoods/${n1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { n1_ucount_post: "$.data.unresolved_critical_count", n1_posture_post: "$.data.safety_posture" }
          assert:
            - "Neighborhood.${n1_id}.unresolved_critical_count before create == 0"
            - "Neighborhood.${n1_id}.unresolved_critical_count after RESOLVE == 0"
            - "Neighborhood.${n1_id}.safety_posture returns to \"OPEN\""
