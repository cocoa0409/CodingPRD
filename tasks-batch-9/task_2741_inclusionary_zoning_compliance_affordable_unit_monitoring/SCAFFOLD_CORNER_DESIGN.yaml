      - name: agreement_recording_enforces_path_and_backdating_preconditions
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_51
          - validations.priority_52
          - errors[ERR_AGREEMENT_NOT_REQUIRED]
          - errors[ERR_RECORDING_PREDATES_APPROVAL]
        distinguishing_aspect: |
          The DRAFT -> RECORDED transition carries two preconditions beyond state: the
          project's elected path must actually require an agreement, and the recording date
          may not precede the entitlement approval date. A fee-only project reaches the
          transition with the right state and is still refused with ERR_AGREEMENT_NOT_REQUIRED,
          while an ONSITE project with recorded_at one day before its approval_date is refused
          with ERR_RECORDING_PREDATES_APPROVAL. Neither refusal advances the project.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project PF (R-4, 27 units, approval 2026-01-15) screened SUBJECT with IN_LIEU_FEE elected and a DRAFT agreement."
            - "Project PO (R-2, 10 units, approval 2026-01-15) screened SUBJECT with ONSITE elected and a DRAFT agreement."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Precondition Fee", zoning_district: "R-4", total_units: 27, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { pf_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${pf_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${pf_id}/elect-path", payload: { compliance_path: "IN_LIEU_FEE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${pf_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { af_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Precondition Onsite", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { po_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${po_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${po_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${po_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { ao_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/regulatory-agreements/${af_id}/record", payload: { doc_number: "DOC-PC-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_not_required: $.data.error_id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${ao_id}/record", payload: { doc_number: "DOC-PC-0002", recorded_at: "2026-01-14" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_predates: $.data.error_id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${ao_id}/record", payload: { doc_number: "DOC-PC-0002", recorded_at: "2026-01-15" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_v: $.data.version } }
          assert:
            - "the IN_LIEU_FEE recording returns HTTP 422 with error_id ERR_AGREEMENT_NOT_REQUIRED; RegulatoryAgreement.${af_id}.state is still DRAFT and Project.${pf_id}.state is still PATH_ELECTED"
            - "the 2026-01-14 recording returns HTTP 422 with error_id ERR_RECORDING_PREDATES_APPROVAL; RegulatoryAgreement.${ao_id}.state is still DRAFT"
