              as: Operator
              as_user_id: "${op_a}"
              captures: { err_self: $.data.error_id, msg_self: $.data.message }
            - call: "POST /poct/test-results/${res_id}/post"
              payload: { attestation: "value re-read from the meter display and confirmed" }
