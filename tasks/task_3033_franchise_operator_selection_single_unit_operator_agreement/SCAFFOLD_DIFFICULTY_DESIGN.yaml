# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3033_franchise_operator_selection_single_unit_operator_agreement
#
# Two instances per Difficulty Rule (§0.5). Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and drives empty-DB -> precondition via §1.5 calls.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two calculations, different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: weekly_forecast_provisional_vs_trailing_on_operating_week
        grounds:
          - calculations.weekly_forecast
          - entities.OperatingWeek.fields.forecast_revenue_cents
          - entities.Restaurant.fields.baseline_weekly_revenue_cents
        distinguishing_aspect: |
          Same restaurant, two valid forecast algorithms produce different
          numbers: PROVISIONAL derives 600000 from baseline_weekly_revenue_cents
          * 6/7 when no CLOSED week exists; TRAILING derives 630000 from the
          trailing average of actuals once a CLOSED week exists — the entity
          domain is OperatingWeek forecasting.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Restaurant R1 (baseline_weekly_revenue_cents=700000) AVAILABLE with no weeks."
            - "Week W1 (2026-09-07) created -> PROVISIONAL forecast; clock advanced so W1 opens; W1 closed with actual_revenue_cents=650000."
          setup_api_calls:
            - call: "POST /franchise/restaurants"
              payload: { site_code: "GA-ATL-001", market_code: "GA", baseline_weekly_revenue_cents: 700000, equipment_value_cents: 90000000 }
              as: SystemAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /franchise/restaurants/${r1_id}/make-available"
              payload: {}
              as: SystemAdmin
            - call: "POST /franchise/restaurants/${r1_id}/weeks"
              payload: { week_start_on: "2026-09-07T00:00:00Z" }
              as: FieldConsultant
              captures: { w1_id: $.data.id, w1_forecast: $.data.forecast_revenue_cents, w1_version: $.data.version }
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /franchise/restaurants/${r1_id}/weeks/${w1_id}/close"
              payload: { actual_revenue_cents: 650000, expected_week_version: "${w1_version}" }
              as: FieldConsultant
          trigger:
            - call: "POST /franchise/restaurants/${r1_id}/weeks"
              payload: { week_start_on: "2026-09-14T00:00:00Z" }
              as: FieldConsultant
              captures: { w2_id: $.data.id, w2_forecast: $.data.forecast_revenue_cents }
          assert:
            - "OperatingWeek.${w1_id}.forecast_revenue_cents == 600000 (PROVISIONAL: 700000 * 6/7)"
            - "OperatingWeek.${w2_id}.forecast_revenue_cents == 630000 (TRAILING: avg of [650000])"
            - "OperatingWeek.${w1_id}.planned_labor_hours == 40"
            - "OperatingWeek.${w2_id}.planned_labor_hours == 42"

      - name: revenue_share_provisional_vs_final_kind_divergence_on_statement
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueShareStatement.fields.statement_kind
          - state_machines.RevenueShareStatement.ISSUED_to_VOID
        distinguishing_aspect: |
          Same week actuals, two statement variants: the PROVISIONAL statement
          issued at week close is voidable and does not gate exit completion;
          the FINAL statement produced by finalize is never voidable and is
          required for exit completion — the entity domain is
          RevenueShareStatement lifecycle, distinct from OperatingWeek forecasting.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Candidate approved through the full pipeline, operator created, agreement EXECUTED, operator ACTIVE on restaurant R2."
            - "Week W (2026-09-07) planned, clock advanced past week end, week closed with actual_revenue_cents=10000000 -> PROVISIONAL statement S1 issued (operator_share_cents=3910000)."
