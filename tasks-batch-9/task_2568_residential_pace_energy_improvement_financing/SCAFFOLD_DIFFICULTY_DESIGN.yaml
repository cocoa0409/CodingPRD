            - "A SECOND application A2 is then opened on the SAME parcel (legal because A1 is ASSESSED, which is excluded from the live-application screen) for solar 1000000 / 80000 and left at UNDER_REVIEW."
            - "At 2027-12-14 a PAYOFF_AT_CLOSING quote T1 is raised for a 2027-12-20 closing, so a QUOTED transfer exists when the roll run fires."
