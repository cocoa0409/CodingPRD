      - name: attestation_escalation_after_plan_deadline_then_late_plan
        claim_type: valid_transition
        grounds: [state_machines.Facility.REJECTED_to_ESCALATED, state_machines.Facility.ESCALATED_to_PLAN_SUBMITTED, calculations.penalty_accrual]
        distinguishing_aspect: "Clock-driven auto-transition: REJECTED becomes ESCALATED only when the logical clock passes plan_due_date; a late plan still submits from ESCALATED; penalty keeps accruing from the ORIGINAL rejected_at (35 days x 30000 = 1050000 on 2026-09-05)."
        test_recipe:
          setup:
            - "Facility FS (SIMPLE) with full publish chain, attestation SUBMITTED for 2026, REJECTED at 2026-08-01T00:00:00Z with plan_due_date 2026-09-01T00:00:00Z"
