            - "Fresh token: HTTP 201 with gen2_seq == 2, source == \"REVIEW_DECISION\", applied_credit_cents == 0, amortization_basis_cents == 150000000, amortization_years == 4, forgiven_by_cap_cents == 0, installment_count == 16, quarterly_installment_cents == 9375000, final_installment_cents == 9375000 and first_due_date == \"2026-09-30T00:00:00Z\"."
            - "GET /payment-schedules/${ps_id} now reports status == \"SUPERSEDED\", and its 28 installments are all VOID."
            - "GET /liability-assessments/${la_id} reports award_adjustment_cents == 100000000, net_assessed_cents == 150000000, active_schedule_generation == 2 and version greater than la_v2."
            - "GET /employers/${emp_id} reports outstanding_liability_cents == 150000000 and GET /controlled-groups/${cg_id} reports joint_exposure_cents == 150000000 with exposure_score == 1500.0000."

      - name: the_five_level_cascade_chain_is_covered_by_the_vacate_depth_probe
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        distinguishing_aspect: |
          A five-link chain verified end to end, with ordering sensitivity and no drift in
          the conserved allocation, is precisely the depth probe's subject.
        excluded_because:
          difficulty_instance: vacate_award_unwinds_schedule_installments_employer_and_group_depth_five
          rationale: "The depth probe walks all five links and reconciles the conserved PLAN_UVB_ALLOCATION identity across them; the four-link delinquency chain is covered by collection_sweep_delinquency_propagates_to_employer_credit_watch_depth_four."

      - name: the_dual_variant_allocation_layer_is_covered_by_the_divergence_depth_probe
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        distinguishing_aspect: |
          Both variants on one dataset with the delta pinned is the layer's whole claim.
        excluded_because:
          difficulty_instance: allocation_method_dollar_basis_versus_cbu_basis_divergence
          rationale: "The depth probe runs both bases over identical data and asserts the delta; the other dual-variant pair, capped versus uncapped amortization, is covered by amortization_cap_variant_capped_forgiveness_versus_mass_withdrawal_rejection."

      - name: the_rate_threshold_boundaries_are_covered_by_the_inclusive_threshold_depth_probes
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers"
        distinguishing_aspect: |
          Every threshold in this domain is inclusive on its lower side, and each needs an
          at-boundary and just-past-boundary pair on the same fixture.
        excluded_because:
          difficulty_instance: de_minimis_phaseout_inclusive_at_exactly_ten_million_cents
          rationale: "The depth probes drive the de minimis phaseout at 10000000 and 10000001 and the decline ratio at 0.300000 and 0.300033; the delinquency-count threshold is covered by collection_sweep_delinquency_propagates_to_employer_credit_watch_depth_four."

  # =======================================================================
  # SECTION: consistency_model - immediate visibility of every cascade.
  # =======================================================================
  - section: consistency_model
    instances:

      - name: the_whole_issuance_cascade_is_visible_in_the_issue_response_itself
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "response_envelope.data"
          - "state_machines.LiabilityAssessment.transitions.DRAFT_to_ISSUED"
        distinguishing_aspect: |
          The consistency model is immediate, so the single issue response must already
          reflect a cascade that touches six other rows: a schedule, 28 installments, the
          employer's derived balance, the controlled group's score, the anchor valuation's
          conserved allocation and the withdrawal event's status. No follow-up read may be
          required to observe any of them, and a re-read immediately afterwards must return
          identical values - an eventual-consistency implementation that queues the
          denormalised fields returns zeros in the first response and the real numbers only
          later.
        test_recipe:
          setup:
            - "The baseline with a DRAFT assessment: net 250000000, annual payment 50000000, at the default clock 2026-08-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
