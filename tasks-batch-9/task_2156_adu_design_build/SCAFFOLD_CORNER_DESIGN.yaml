scaffold_corner_design:

  - section: entities
    instances:
      - name: create_jurisdiction_returns_201_with_ordinance_fields
        claim_type: Creation
        grounds: ["entities.Jurisdiction", "endpoints"]
        distinguishing_aspect: "POST /jurisdictions with every required ordinance field returns 201 and echoes name, code, the four geometry limits and the four fee fields, plus a server-minted id, created_at, updated_at and version == 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45, separate_meter_required: false, str_min_lease_days: 7, str_prohibited: false }
              as: PlatformAdmin
              captures: { jur_id: $.data.id, jur_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "Jurisdiction.${jur_id}.code == 'PLMD' and Jurisdiction.${jur_id}.local_max_detached_sqft == 1000"
            - "the captured jur_v == 1"
            - "the response id is a bare UUID with no type prefix"

      - name: create_jurisdiction_omitting_optionals_applies_declared_defaults
        claim_type: Defaults
        grounds: ["entities.Jurisdiction.fields.correction_response_days", "entities.Jurisdiction.fields.separate_meter_required", "entities.Jurisdiction.fields.str_min_lease_days", "entities.Jurisdiction.fields.str_prohibited"]
        distinguishing_aspect: "Omitting correction_response_days, separate_meter_required, str_min_lease_days and str_prohibited yields exactly 60, false, 30 and false."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Modesto", code: "MDST", local_max_detached_sqft: 900, local_rear_setback_ft: 5.0, local_side_setback_ft: 5.0, local_max_height_ft: 16.0, plan_check_base_fee_cents: 100000, plan_check_rate_per_sqft_cents: 80, impact_fee_per_sqft_cents: 700, utility_capacity_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          assert:
            - "Jurisdiction.${jur_id}.correction_response_days == 60"
            - "Jurisdiction.${jur_id}.separate_meter_required == false"
            - "Jurisdiction.${jur_id}.str_min_lease_days == 30"
            - "Jurisdiction.${jur_id}.str_prohibited == false"

      - name: create_inspector_omitting_daily_capacity_defaults_to_four
        claim_type: Defaults
        grounds: ["entities.Inspector.fields.daily_capacity", "entities.Inspector.fields.status"]
        distinguishing_aspect: "An Inspector created without daily_capacity or status carries daily_capacity 4 and status ACTIVE, and GET /inspectors/{id}/availability on an untouched date reports remaining_slots 4."
        test_recipe:
          setup: ["One Jurisdiction PLMD exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /inspectors"
              payload: { jurisdiction_id: "${jur_id}", full_name: "M. Duong", certifications: ["STRUCTURAL", "FINAL"] }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "GET /inspectors/${insp_id}/availability"
              payload: { slot_date: "2026-09-02" }
              as: ProjectManager
              captures: { rem: $.data.remaining_slots, cap: $.data.daily_capacity }
          assert:
            - "Inspector.${insp_id}.daily_capacity == 4 and Inspector.${insp_id}.status == 'ACTIVE'"
            - "the captured cap == 4 and rem == 4"

      - name: get_property_by_id_returns_stored_row
        claim_type: Retrieval
        grounds: ["entities.Property", "endpoints"]
        distinguishing_aspect: "GET /properties/{id} returns the same lot_sqft, existing_dwelling_sqft, electrical_service_amps and existing_water_meter_size_in that were posted, with response_type 'object'."
        test_recipe:
          setup: ["Jurisdiction PLMD and Property P2 exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: FinanceAdvisor
          assert:
            - "HTTP status is 200 and response_type == 'object'"
            - "Property.${prop_id}.lot_sqft == 8000 and Property.${prop_id}.existing_dwelling_sqft == 1450"
            - "Property.${prop_id}.occupied == true and Property.${prop_id}.in_str_overlay == false and Property.${prop_id}.existing_mortgage_balance_cents == 0"

      - name: list_adu_projects_returns_pagination_envelope
        claim_type: Listing
        grounds: ["entities.AduProject", "endpoints"]
        distinguishing_aspect: "GET /adu-projects?property_id=...&limit=1 returns response_type 'array' with total_count 2, has_more true and exactly one element."
        test_recipe:
          setup: ["Property P2 in PLMD carries two AduProject rows."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: DesignLead
              captures: { prop_v2: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v2}", unit_type: "CONVERSION", proposed_sqft: 500, proposed_height_ft: 12.0, rear_setback_ft: 4.0, side_setback_ft: 4.0, bedrooms: 1, contract_base_price_cents: 15000000 }
              as: DesignLead
          trigger:
            - call: "GET /adu-projects"
              payload: { property_id: "${prop_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == 'array', total_count == 2, has_more == true, limit == 1, offset == 0"
            - "the data array holds exactly 1 element"

      - name: get_adu_project_unknown_id_returns_project_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "GET /adu-projects/{id} with a well-formed but unknown UUID returns 404 with error_id ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /adu-projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and the captured err_id == 'ERR_PROJECT_NOT_FOUND'"
            - "response_type == 'error'"

      - name: create_property_missing_lot_sqft_returns_validation
        claim_type: Required Fields
        grounds: ["validations[priority=25]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /properties without lot_sqft, a required input with no default, returns 422 ERR_VALIDATION and persists nothing."
        test_recipe:
          setup: ["Jurisdiction PLMD exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and the captured err_id == 'ERR_VALIDATION'"
            - "GET /properties?jurisdiction_id=${jur_id} returns total_count == 0"

      - name: create_adu_project_unit_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=26]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "unit_type 'GARAGE_LOFT' is outside the declared enum {DETACHED_NEW, ATTACHED, CONVERSION, JADU} and returns 422 ERR_VALIDATION without bumping Property.version."
        test_recipe:
          setup: ["Property P2 in PLMD exists at version 1."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { prop_id: $.data.id, prop_v: $.data.version }
          trigger:
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}", unit_type: "GARAGE_LOFT", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and the captured err_id == 'ERR_VALIDATION'"
            - "Property.${prop_id}.version == 1"

      - name: create_adu_project_with_unknown_property_returns_property_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=11]", "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "Body-level foreign keys are resolved before the OCC check: an unknown property_id returns 404 ERR_PROPERTY_NOT_FOUND, not 412."
        test_recipe:
          setup: ["Empty database apart from one Jurisdiction."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id, jur_v: $.data.version }
          trigger:
            - call: "POST /adu-projects"
              payload: { property_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", expected_property_version: "${jur_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and the captured err_id == 'ERR_PROPERTY_NOT_FOUND'"
            - "the captured err_id != 'ERR_STALE_PROPERTY_VERSION'"

  - section: state_machines
    instances:
      - name: select_pathway_twice_returns_project_phase_invalid
        claim_type: Invalid Transitions
        grounds: ["state_machines.AduProject.INTAKE_to_FEASIBILITY_CLEARED", "errors[ERR_PROJECT_PHASE_INVALID]"]
        distinguishing_aspect: "The INTAKE -> FEASIBILITY_CLEARED transition has no counterpart from FEASIBILITY_CLEARED, so a second select-pathway on the same project returns 409 ERR_PROJECT_PHASE_INVALID and leaves approved_pathway at its first value."
        test_recipe:
          setup: ["AduProject B on Property P2 in PLMD with a LOCAL_ORDINANCE screening already selected, so status == FEASIBILITY_CLEARED and approved_pathway == 'LOCAL_ORDINANCE'."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_id: $.data.id }
            - call: "POST /adu-projects/${proj_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr1_id: $.data.id }
            - call: "POST /adu-projects/${proj_id}/select-pathway"
              payload: { screening_id: "${scr1_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_id}/feasibility-screenings"
              payload: { pathway: "STATUTORY_MINISTERIAL" }
              as: DesignLead
              captures: { scr2_id: $.data.id }
          trigger:
            - call: "POST /adu-projects/${proj_id}/select-pathway"
              payload: { screening_id: "${scr2_id}" }
              as: DesignLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and the captured err_id == 'ERR_PROJECT_PHASE_INVALID'"
            - "AduProject.${proj_id}.approved_pathway == 'LOCAL_ORDINANCE'"
            - "AduProject.${proj_id}.status == 'FEASIBILITY_CLEARED'"

      - name: resolve_correction_item_twice_returns_correction_item_state_invalid
        claim_type: Idempotency
        grounds: ["state_machines.CorrectionItem.OPEN_to_RESOLVED", "errors[ERR_CORRECTION_ITEM_STATE_INVALID]"]
        distinguishing_aspect: "RESOLVED is terminal for CorrectionItem: a second resolve returns 409 ERR_CORRECTION_ITEM_STATE_INVALID and does not move resolved_on_date."
        test_recipe:
          setup: ["PermitSubmittal S1 on AduProject B is in CORRECTIONS_REQUIRED with one BLOCKING CorrectionItem already RESOLVED."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000, correction_response_days: 45 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_id: $.data.id }
            - call: "POST /adu-projects/${proj_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_id: $.data.id }
            - call: "POST /adu-projects/${proj_id}/select-pathway"
              payload: { screening_id: "${scr_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_id: $.data.id }
            - call: "POST /utility-connections/${uc_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_id: $.data.id }
            - call: "POST /permit-submittals/${sub_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_id}/plan-check-result"
              payload: { outcome: "CORRECTIONS_REQUIRED", correction_items: [ { discipline: "FIRE", severity: "BLOCKING", description: "Add smoke and CO alarm locations" } ] }
              as: PlanChecker
            - call: "GET /permit-submittals/${sub_id}/correction-items"
              payload: {}
              as: DesignLead
              captures: { ci_id: "$.data[0].id" }
            - call: "POST /correction-items/${ci_id}/resolve"
              payload: {}
              as: DesignLead
          trigger:
            - call: "POST /correction-items/${ci_id}/resolve"
              payload: {}
              as: DesignLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and the captured err_id == 'ERR_CORRECTION_ITEM_STATE_INVALID'"
            - "CorrectionItem.${ci_id}.status == 'RESOLVED'"
            - "CorrectionItem.${ci_id}.version == 2"

      - name: change_order_reject_branch_leaves_contract_untouched
        claim_type: Side Effect Execution
        grounds: ["state_machines.ChangeOrder.SUBMITTED_to_REJECTED", "entities.AduProject.fields.contract_price_current_cents"]
        distinguishing_aspect: "The REJECT branch of the SUBMITTED fork records decided_by_user_id and nothing else: builder_fee_cents stays 0, contract_price_current_cents stays 24000000 and approved_change_order_count stays 0, in contrast with the APPROVE branch."
        test_recipe:
          setup: ["AduProject B on Property P2 in PLMD at status PERMITTED with one SUBMITTED ChangeOrder for +2000000 cents."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${jur_id}", address_line: "12 Sage Ct", lot_sqft: 8000, existing_dwelling_sqft: 1450, electrical_service_amps: 400, existing_water_meter_size_in: 1.0, pre_adu_value_cents: 80000000 }
              as: DesignLead
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_id: $.data.id }
            - call: "POST /adu-projects/${proj_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_id: $.data.id }
            - call: "POST /adu-projects/${proj_id}/select-pathway"
              payload: { screening_id: "${scr_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_id: $.data.id }
            - call: "POST /utility-connections/${uc_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_id: $.data.id }
            - call: "POST /permit-submittals/${sub_id}/submit"
              payload: {}
              as: DesignLead
            - call: "POST /permit-submittals/${sub_id}/plan-check-result"
              payload: { outcome: "APPROVED" }
              as: PlanChecker
            - call: "GET /adu-projects/${proj_id}"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_id}"
              captures: { proj_v: $.data.version }
            - call: "POST /adu-projects/${proj_id}/change-orders"
              payload: { expected_adu_project_version: "${proj_v}", title: "Upgrade siding", scope_items: ["Swap fiber cement for cedar"], cost_delta_cents: 2000000, schedule_delta_days: 5 }
              as: Homeowner
              as_user_id: "${prop_id}"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${prop_id}"
          trigger:
            - call: "POST /change-orders/${co_id}/decide"
              payload: { decision: "REJECT" }
              as: ProjectManager
          assert:
            - "ChangeOrder.${co_id}.status == 'REJECTED'"
            - "ChangeOrder.${co_id}.builder_fee_cents == 0"
            - "ChangeOrder.${co_id}.decided_by_user_id is not null"
            - "AduProject.${proj_id}.contract_price_current_cents == 24000000"
            - "AduProject.${proj_id}.approved_change_days == 0"
            - "AduProject.${proj_id}.approved_change_order_count == 0"

      - name: plan_check_result_on_prepared_submittal_returns_submittal_state_invalid
        claim_type: Precondition Enforcement
