      - name: a_second_verification_run_replaces_the_first_and_the_score_ignores_the_old_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.mandatory_element_compliance_score.input_set
          - state_machines.ArtworkVersion.ELEMENTS_VERIFIED_to_ELEMENTS_VERIFIED
          - entities.ArtworkVersion.fields.check_run_no
          - validations[priority=7]
          - errors[ERR_ELEMENT_CHECK_NOT_FOUND]
          - endpoints[GET /element-checks]
        distinguishing_aspect: |
          The score's input set is scoped to the CURRENT check_run_no, and the re-run
          deletes the previous rows rather than layering on top of them. Both halves are
          probed with one saved id: the run-1 FAIL row must be gone (404 on its waiver,
          and check_run_no=1 lists empty), and the unfiltered list must hold exactly 7
          rows all stamped run 2. An implementation that appends returns 14 rows and
          double-counts the 10-point deduction as a score of 80.0; one that keeps the
          old rows but scopes the score correctly still fails the 404.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]); ArtworkAsset (CARTON / COATED_PAPER / US)."
            - "ArtworkVersion v1 carries date_code_zone 120 mm2 (below the 150 minimum) and correct values for the other six elements; it is never edited."
            - "verify-elements has run twice, so the version is ELEMENTS_VERIFIED with check_run_no 2, and the DATE_CODE_ZONE row id captured from run 1 no longer exists."
            - "GET /element-checks lists rows in ELEMENT_ORDER, so index 3 of the unfiltered list is the run-2 DATE_CODE_ZONE row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
