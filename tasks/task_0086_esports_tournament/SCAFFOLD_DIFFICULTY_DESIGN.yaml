# =============================================================================
# Esports Tournament Management System — Scaffold Difficulty Design (§1.8)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules.
# Every `grounds:` entry resolves to a declared element in SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains (≥ 2)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: prize_share_provisional_vs_final
        grounds:
          - calculations.prize_share_provisional
          - calculations.prize_share_provisional.variants.prize_share_final
          - state_machines.PrizePayout.PROVISIONAL_to_FINALIZED
          - state_machines.PrizePayout.PROVISIONAL_to_CLAWED_BACK
          - state_machines.TeamRegistration.REGISTERED_to_DISQUALIFIED
          - entities.PrizePayout.fields.gross_amount_cents
          - entities.Tournament.fields.prize_tier_table
        distinguishing_aspect: |
          Provisional and Final operate on the Tournament prize-pool domain — Provisional
          (forward_looking) includes TeamRegistration rows in {REGISTERED, DISQUALIFIED}
          and writes PrizePayout.gross_amount_cents at each placement. Final
          (chronological — DQ now considered terminal) restricts to {REGISTERED} only and
          reassigns placements upward, so for identical inputs (3 tiers + 3 teams) the two
          variants produce identical numbers BEFORE any disqualification and divergent
          numbers AFTER: the disqualified team's CLAWED_BACK row stays at gross=0 under
          Provisional, while Final shifts the next-ranked team into that slot.
        test_recipe:
          setup:
            - "Clock=2026-01-01T00:00:00Z"
            - "Tournament T with format=ROUND_ROBIN, region=GLOBAL, entry_fee_cents=10000, entry_fee_currency=USD, base_prize_pool_cents=1000000, prize_tier_table=[{placement:1,percentage_bps:5500},{placement:2,percentage_bps:3000},{placement:3,percentage_bps:1000}], min_age=16, min_team_ranking_points=0"
            - "Three TeamRegistration rows T1, T2, T3 all driven to REGISTERED via pay-entry-fee (each 5 MAIN identity-verified PlayerContracts)"
            - "Tournament moved through ROSTER_LOCKED → BRACKET_PUBLISHED → IN_PROGRESS → COMPLETED with final placement T1=1st, T2=2nd, T3=3rd"
          trigger:
            - "Provisional payouts auto-emitted on COMPLETED transition: PrizePayout for T1=550000, T2=300000, T3=100000, MVP=50000 (sum=1000000)"
            - "Issue MatchIncident UPHELD with penalty_type=DISQUALIFICATION subject_type=TEAM subject_id=T2 → cascade fires PrizePayout(T2).status=CLAWED_BACK, gross_amount_cents=0"
            - "POST /tournaments/{T}/finalize-prize-pool"
          assert:
            - "Before DQ: PrizePayout(T1).gross_amount_cents == 550000"
            - "Before DQ: PrizePayout(T2).gross_amount_cents == 300000"
            - "Before DQ: PrizePayout(T3).gross_amount_cents == 100000"
            - "Before DQ: MVP PrizePayout.gross_amount_cents == 50000"
            - "After DQ + finalize: PrizePayout(T1).gross_amount_cents == 550000"
            - "After DQ + finalize: PrizePayout(T2).gross_amount_cents == 0 AND status == CLAWED_BACK"
            - "After DQ + finalize: PrizePayout(T3).gross_amount_cents == 300000 (placement shifted upward to 2nd)"
            - "After DQ + finalize: a null-team PrizePayout for placement=3 has gross_amount_cents == 100000 (placement-3 slot retained but unallocated)"

      - name: contagion_risk_apply_vs_appeal_reversal
        grounds:
          - calculations.contagion_risk_score
          - calculations.contagion_risk_score.variants.contagion_risk_score_appeal_reversal
          - state_machines.MatchIncident.UNDER_REVIEW_to_RULED
          - state_machines.MatchIncident.APPEALED_to_RULED
          - entities.MatchIncident.fields.penalty_type
          - entities.MatchIncident.fields.classification
        distinguishing_aspect: |
          contagion_risk_score operates on the Team-risk domain (a different entity domain
          from prize_share). The forward variant adds a weighted delta with half-life decay
          on the existing accumulated_risk; the appeal-reversal variant subtracts the exact
          delta originally added, without re-applying decay between the rule and the appeal.
          For identical inputs the two variants leave the team's accumulated risk diverged
          by precisely the contribution of the overturned incident.
        test_recipe:
          setup:
            - "Clock=2026-01-01T00:00:00Z"
            - "Team team_x with accumulated_risk = 0"
            - "Tournament T in IN_PROGRESS with a LIVE Match m1 between team_x and team_y"
          trigger:
            - "POST /match-incidents (subject_type=TEAM subject_id=team_x classification=CHEATING_SUSPICION)"
            - "POST /match-incidents/{iid}/assign → /rule with ruling=UPHELD penalty_type=FINE fine_amount_cents=10000"
            - "Compute expected delta: base_weight(FINE)=3 × classification_multiplier(CHEATING_SUSPICION)=3.0 → delta=9; decayed_old=0 → new_risk=9"
            - "POST /match-incidents/{iid}/appeal then POST /match-incidents/{iid}/appeal-decide with decision=OVERTURN"
          assert:
            - "After rule: team_x.accumulated_risk == 9"
            - "After overturn: team_x.accumulated_risk == 0 (delta=9 subtracted exactly; no re-decay applied)"
            - "MatchIncident.ruling == OVERTURNED AND MatchIncident.penalty_type == NONE"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (≥ 2)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tax_withholding_tiered_round_then_sum_mode_b
        grounds:
          - calculations.tax_withholding
          - calculations.tax_withholding.constants.TAX_BRACKETS
          - calculations.tax_withholding.constants.FX_RATE
          - calculations.tax_withholding.constants.MIN_PAYOUT_FLOOR_CENTS
          - entities.PrizePayout.fields.tax_withheld_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The formula rounds tax at each
          jurisdiction tier slice, then sums; it does NOT sum all slices then round once.
          The scaffold pins round-then-sum: for KR brackets [(100000000, 2200), (500000000, 3500),
          (...,4500)] applied to gross 600000000, the slice rounds (100000000*0.22 +
          400000000*0.35 + 100000000*0.45) where each slice is round_half_up independently;
          the alternative "sum then round" of (600000000 * blended_rate) yields a different
          number on tie-edge values.
        test_recipe:
          setup:
            - "Tournament T with entry_fee_currency=KRW, base_prize_pool_cents=600000000"
            - "Recipient jurisdiction KR pinned via IdentityVerification at signing"
            - "T progressed through to COMPLETED with the recipient at placement 1 (100% of pool)"
          trigger:
            - "POST /tournaments/{T}/finalize-prize-pool"
            - "Compute expected: slice1 = round_half_up(100000000*2200/10000)=22000000; slice2 = round_half_up(400000000*3500/10000)=140000000; slice3 = round_half_up(100000000*4500/10000)=45000000; total_tax = 22000000+140000000+45000000 = 207000000"
          assert:
            - "PrizePayout(placement=1).tax_withheld_cents == 207000000"
            - "PrizePayout(placement=1).net_amount_cents == 393000000"

      - name: bracket_pairing_pinned_evaluation_order_mode_c
        grounds:
          - calculations.bracket_pairing
          - entities.Tournament.fields.seeding_rule
          - entities.Tournament.fields.format
          - entities.TeamRegistration.fields.ranking_points_snapshot
          - entities.TeamRegistration.fields.seed_number
          - state_machines.Tournament.ROSTER_LOCKED_to_BRACKET_PUBLISHED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with explicit evaluation order. Seeding
          depends on ranking_points_snapshot (pinned at REGISTERED), but the BYE assignment
          in turn depends on the seeding ORDER, and the bye recipient differs by format:
          SWISS gives bye to LOWEST-seed (highest seed number), DOUBLE_ELIMINATION gives bye
          to HIGHEST-seed (seed 1). With identical inputs (5 teams, ranking_points_snapshot
          = [100, 90, 80, 70, 60]) the SWISS bracket and the DOUBLE_ELIMINATION bracket
          place the bye on different teams; the scaffold pins this order via the formula
          branch.
        test_recipe:
          setup:
            - "Tournament T_swiss with format=SWISS and 5 REGISTERED teams ordered ranking_points_snapshot [100,90,80,70,60]"
            - "Tournament T_de  with format=DOUBLE_ELIMINATION and the same 5 teams"
          trigger:
            - "POST /tournaments/{T_swiss}/publish-bracket"
            - "POST /tournaments/{T_de}/publish-bracket"
          assert:
            - "T_swiss: Match with is_bye=true has team_a_id == team with ranking_points_snapshot==60 (lowest-seed)"
            - "T_de:    Match with is_bye=true has team_a_id == team with ranking_points_snapshot==100 (highest-seed)"
            - "Both: seed_number assignment is deterministic and identical across the two tournaments for the four non-bye teams"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities (≥ 2)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: match_incident_appeal_cycle
        grounds:
          - state_machines.MatchIncident
          - state_machines.MatchIncident.RULED_to_APPEALED
          - state_machines.MatchIncident.APPEALED_to_RULED
          - state_machines.MatchIncident.RULED_to_CLOSED
          - entities.MatchIncident.fields.appeal_count
        distinguishing_aspect: |
          The MatchIncident state machine is cyclic: RULED → APPEALED → RULED. The cycle
          can fire at most once (appeal_count cap = MAX_APPEALS = 1). This is a true cycle
          on the MatchIncident entity, distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Tournament T in IN_PROGRESS with a LIVE Match"
            - "MatchIncident i1 filed and assigned"
          trigger:
            - "POST /match-incidents/{i1}/rule (ruling=UPHELD penalty_type=WARNING) → status=RULED"
            - "POST /match-incidents/{i1}/appeal → status=APPEALED, appeal_count=1"
            - "POST /match-incidents/{i1}/appeal-decide (decision=AFFIRM) → status=RULED"
            - "POST /match-incidents/{i1}/appeal → should fail because appeal_count == 1"
          assert:
            - "After first appeal: MatchIncident.status == APPEALED AND MatchIncident.appeal_count == 1"
            - "After appeal-decide: MatchIncident.status == RULED"
            - "Second appeal attempt: HTTP 409 with error_id == ERR_APPEAL_LIMIT_REACHED"

      - name: transfer_offer_branching_with_counter_loop
        grounds:
          - state_machines.TransferOffer
          - state_machines.TransferOffer.PROPOSED_to_COUNTERED
          - state_machines.TransferOffer.PROPOSED_to_ACCEPTED_BY_FROM
          - state_machines.TransferOffer.ACCEPTED_BY_BOTH_to_LEAGUE_APPROVED
          - state_machines.TransferOffer.ACCEPTED_BY_BOTH_to_REJECTED
          - state_machines.TransferOffer.PROPOSED_to_EXPIRED
          - entities.TransferOffer.fields.history
        distinguishing_aspect: |
          The TransferOffer state machine is branching (diamond): PROPOSED forks into
          {COUNTERED, ACCEPTED_BY_FROM, REJECTED, EXPIRED}; ACCEPTED_BY_BOTH branches into
          {LEAGUE_APPROVED, REJECTED} with divergent side-effect sets (LEAGUE_APPROVED
          rebinds PlayerContract.team_id and emits AuditLogEntry; REJECTED leaves
          PlayerContract untouched). This is a different entity from Rule 3 instance 1.
        test_recipe:
          setup:
            - "TransferWindow w open. Two TransferOffers o1, o2 with same player_id but different to_team_id"
          trigger:
            - "POST /transfer-offers/{o1}/counter → o1.status=COUNTERED, history length=1"
            - "POST /transfer-offers/{o1}/accept (by to_team) → o1.status=ACCEPTED_BY_FROM"
            - "POST /transfer-offers/{o1}/co-accept → o1.status=ACCEPTED_BY_BOTH"
            - "POST /transfer-offers/{o1}/league-approve → o1.status=LEAGUE_APPROVED; player_id's PlayerContract.team_id reassigned"
            - "POST /transfer-offers/{o2}/co-accept then league-approve → REJECTED branch fired because cooling-off active"
          assert:
            - "o1.status == LEAGUE_APPROVED"
            - "PlayerContract(player_id).team_id == to_team_id of o1"
            - "o2.status == REJECTED (or HTTP 409 with ERR_COOLING_OFF_ACTIVE on the league-approve call)"
            - "AuditLogEntry exists with subject_type=TRANSFER_OFFER subject_id=o1.id action='APPROVE_TRANSFER'"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers (≥ 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disqualification_cascade_depth_3
        grounds:
          - state_machines.MatchIncident.UNDER_REVIEW_to_RULED
          - state_machines.TeamRegistration.REGISTERED_to_DISQUALIFIED
          - state_machines.Match.SCHEDULED_to_FORFEITED
          - state_machines.Match.LIVE_to_FORFEITED
          - state_machines.PrizePayout.PROVISIONAL_to_CLAWED_BACK
        distinguishing_aspect: |
          Trigger: POST /match-incidents/{iid}/rule with penalty_type=DISQUALIFICATION
          (subject_type=TEAM). Depth-3 chain — hop 1: MatchIncident rule UPHELD mutates
          TeamRegistration.REGISTERED→DISQUALIFIED; that DQ mutation itself mutates every
          non-terminal Match for that team to FORFEITED (hop 2 caused by hop 1, not by the
          original rule call); each forfeit then mutates downstream Match.team_a_id/team_b_id
          via bracket-advance (hop 3 caused by hop 2). Each link is caused by the previous
          link.
        test_recipe:
          setup:
            - "Tournament T in IN_PROGRESS with a 4-team single-elimination bracket; team_x has won round 1 and is scheduled for round-2 match m2"
            - "PrizePayout PROVISIONAL row already exists for team_x (synthetic — pre-complete provisional emission via complete-tournament)"
          trigger:
            - "POST /match-incidents (subject_type=TEAM subject_id=team_x classification=CHEATING_SUSPICION)"
            - "POST /match-incidents/{iid}/assign → /rule (ruling=UPHELD penalty_type=DISQUALIFICATION)"
          assert:
            - "Hop 1: TeamRegistration(team_x).status == DISQUALIFIED"
            - "Hop 2: Match m2.status == FORFEITED AND m2.winner_team_id == the_other_side"
            - "Hop 3: Round-3 Match m3 has team_a_id/team_b_id updated to reflect m2's new winner (bracket-advance)"
            - "PrizePayout(team_x).status == CLAWED_BACK AND gross_amount_cents == 0"

      - name: transfer_approval_cascade_depth_2
        grounds:
          - state_machines.TransferOffer.ACCEPTED_BY_BOTH_to_LEAGUE_APPROVED
          - entities.PlayerContract.fields.team_id
          - entities.AuditLogEntry
          - entities.TeamRegistration.fields.entry_fee_paid_cents
        distinguishing_aspect: |
          Trigger: POST /transfer-offers/{oid}/league-approve. Depth-2 chain originating
          from a different transition than the disqualification cascade — hop 1:
          PlayerContract.team_id reassigned from from_team to to_team; hop 2 caused by hop
          1: a TransferLedger entry is appended adjusting from_team.entry_fee_paid_cents
          (debit) and to_team.entry_fee_paid_cents (credit) for the transfer_fee_cents
          (after FX), and an AuditLogEntry is appended referencing the new
          PlayerContract.team_id value.
        test_recipe:
          setup:
            - "Two registered teams from_team and to_team with PlayerContract pc bound to from_team in ACTIVE"
            - "TransferOffer o in ACCEPTED_BY_BOTH with transfer_fee_cents=50000 transfer_fee_currency=USD"
          trigger:
            - "POST /transfer-offers/{o}/league-approve (decision=APPROVE)"
          assert:
            - "Hop 1: PlayerContract(pc).team_id == to_team.id"
            - "Hop 2: AuditLogEntry exists referencing pc with action='APPROVE_TRANSFER' AND payload contains the new team_id"
            - "Hop 2: from_team.entry_fee_paid_cents incremented by 50000 (credit); to_team.entry_fee_paid_cents decremented by 50000 (debit)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥ 2)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pair
        grounds:
          - validations[priority=6]   # state — ERR_INVALID_STATE
          - validations[priority=8]   # business_safety — ERR_PLAYER_UNDERAGE
          - state_machines.TeamRegistration.FEE_PENDING_to_REGISTERED
        distinguishing_aspect: |
          Pair: (state) ERR_INVALID_STATE vs (business_safety) ERR_PLAYER_UNDERAGE. With a
          TeamRegistration already in REGISTERED state AND a roster containing an underage
          player, the request to /pay-entry-fee fires both checks; priority ordering
          (priority 6 before priority 8) MUST surface ERR_INVALID_STATE. The opposite order
          would surface ERR_PLAYER_UNDERAGE.
        test_recipe:
          setup:
            - "Tournament T (min_age=18) and TeamRegistration r already in REGISTERED state with one MAIN player age=16"
          trigger:
            - "POST /team-registrations/{r}/pay-entry-fee"
          assert:
            - "HTTP 409 AND error_id == ERR_INVALID_STATE (state check wins over business_safety underage)"

      - name: business_temporal_vs_business_fiscal_pair
        grounds:
          - validations[priority=14]  # business_temporal — ERR_WINDOW_CLOSED
          - validations[priority=23]  # business_fiscal — ERR_ENTRY_FEE_INSUFFICIENT
          - state_machines.TransferOffer.ACCEPTED_BY_BOTH_to_LEAGUE_APPROVED
        distinguishing_aspect: |
          Different error-category pair: (business_temporal) ERR_WINDOW_CLOSED vs
          (business_fiscal) ERR_ENTRY_FEE_INSUFFICIENT. A TransferOffer at ACCEPTED_BY_BOTH
          whose window has closed AND whose to_team has insufficient cash on hand to cover
          transfer_fee_cents would fire both — priority ordering (14 before 23) MUST surface
          ERR_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "TransferWindow w closed (Clock.now >= closes_at)"
            - "TransferOffer o in ACCEPTED_BY_BOTH; to_team has entry_fee_paid_cents < transfer_fee_cents"
          trigger:
            - "POST /transfer-offers/{o}/league-approve"
          assert:
            - "HTTP 409 AND error_id == ERR_WINDOW_CLOSED (temporal check wins over fiscal check)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥ 2)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ranking_points_threshold_strict_lt_rejects
        grounds:
          - validations[priority=17]  # ERR_TEAM_RANKING_INSUFFICIENT
          - entities.Tournament.fields.min_team_ranking_points
          - entities.TeamRegistration.fields.ranking_points_snapshot
        distinguishing_aspect: |
          Numeric metric on POST /team-registrations/{rid}/pay-entry-fee. Boundary:
          ranking_points_snapshot >= min_team_ranking_points succeeds; strictly less fails.
          For min_team_ranking_points=500: sum=500 SUCCESS, sum=499 FAIL.
        test_recipe:
          setup:
            - "Tournament T with min_team_ranking_points=500"
            - "Team r_pass with 5 MAIN players summing to ranking_points=500 (e.g., 100 each)"
            - "Team r_fail with 5 MAIN players summing to ranking_points=499 (e.g., 100,100,100,100,99)"
          trigger:
            - "POST /team-registrations/{r_pass}/pay-entry-fee"
            - "POST /team-registrations/{r_fail}/pay-entry-fee"
          assert:
            - "r_pass: HTTP 200 AND TeamRegistration.status == REGISTERED AND ranking_points_snapshot == 500"
            - "r_fail: HTTP 422 AND error_id == ERR_TEAM_RANKING_INSUFFICIENT"

      - name: empty_set_publish_bracket
        grounds:
          - validations[priority=22]  # ERR_INSUFFICIENT_TEAMS
          - state_machines.Tournament.ROSTER_LOCKED_to_BRACKET_PUBLISHED
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (POST /tournaments/{tid}/publish-bracket),
          different metric (count vs sum). Tournament with zero REGISTERED teams fails;
          exactly 2 succeeds; exactly 1 fails. Distinct interval semantics from the numeric
          threshold check above.
        test_recipe:
          setup:
            - "Tournament T_empty with 0 REGISTERED teams (status=ROSTER_LOCKED)"
            - "Tournament T_one with 1 REGISTERED team"
            - "Tournament T_two with 2 REGISTERED teams"
          trigger:
            - "POST /tournaments/{T_empty}/publish-bracket"
            - "POST /tournaments/{T_one}/publish-bracket"
            - "POST /tournaments/{T_two}/publish-bracket"
          assert:
            - "T_empty: HTTP 422 error_id == ERR_INSUFFICIENT_TEAMS"
            - "T_one: HTTP 422 error_id == ERR_INSUFFICIENT_TEAMS"
            - "T_two: HTTP 200 AND Tournament.status == BRACKET_PUBLISHED"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥ 2)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: player_contract_active_requires_team_eligible
        grounds:
          - state_machines.PlayerContract.PENDING_SIGNATURES_to_ACTIVE
          - entities.TeamRegistration.fields.status
          - validations[priority=6]   # state on cross-entity precondition
        distinguishing_aspect: |
          Entity pair: PlayerContract × TeamRegistration. PlayerContract.PENDING_SIGNATURES
          → ACTIVE is blocked when the TeamRegistration referenced by team_id is in
          WITHDRAWN or DISQUALIFIED (ERR_TEAM_NOT_ELIGIBLE). Tests one valid + one
          rejected transition.
        test_recipe:
          setup:
            - "PlayerContract pc in PENDING_SIGNATURES, one signature remaining"
            - "TeamRegistration r in REGISTERED for the team_id case_A"
            - "TeamRegistration r in WITHDRAWN for the team_id case_B (separate fixture)"
          trigger:
            - "case_A: POST /player-contracts/{pc_A}/sign as the final signatory"
            - "case_B: POST /player-contracts/{pc_B}/sign as the final signatory"
          assert:
            - "case_A: HTTP 200 AND PlayerContract.status == ACTIVE AND signed_version_id != null"
            - "case_B: HTTP 409 AND error_id == ERR_TEAM_NOT_ELIGIBLE"

      - name: transfer_league_approve_requires_contract_active
        grounds:
          - state_machines.TransferOffer.ACCEPTED_BY_BOTH_to_LEAGUE_APPROVED
          - entities.PlayerContract.fields.status
        distinguishing_aspect: |
          Different entity pair: TransferOffer × PlayerContract. League approval blocked
          when the player's current PlayerContract.status != ACTIVE (e.g., EXPIRED, TERMINATED).
          Distinct from PlayerContract × TeamRegistration above.
        test_recipe:
          setup:
            - "TransferOffer o in ACCEPTED_BY_BOTH for player_id p"
            - "case_A: PlayerContract pc(p).status == ACTIVE"
            - "case_B: PlayerContract pc(p).status == EXPIRED (advanced clock past term_end)"
          trigger:
            - "case_A: POST /transfer-offers/{o_A}/league-approve"
            - "case_B: POST /transfer-offers/{o_B}/league-approve"
          assert:
            - "case_A: HTTP 200 AND TransferOffer.status == LEAGUE_APPROVED"
            - "case_B: HTTP 409 AND error_id == ERR_CONTRACT_NOT_ACTIVE"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥ 2)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: match_time_overlap_half_open_no_buffer
        grounds:
          - validations[priority=18]  # ERR_MATCH_TIME_CONFLICT
          - entities.Match.fields.scheduled_start
          - entities.Match.fields.scheduled_end
        distinguishing_aspect: |
          Resource: a TeamRegistration's schedule. Interval semantics: half-open
          [scheduled_start, scheduled_end), no buffer. Two matches touching at exact
          end==start do NOT overlap; one overlapping by even 1s DOES. Distinct from the
          referee buffered semantics below.
        test_recipe:
          setup:
            - "Tournament T in BRACKET_PUBLISHED with team_x"
            - "Match m1: team_x, scheduled_start=10:00 scheduled_end=11:00"
            - "Candidate Match m2_touch: team_x, scheduled_start=11:00 scheduled_end=12:00 (touches; should succeed)"
            - "Candidate Match m2_overlap: team_x, scheduled_start=10:59 scheduled_end=11:59 (overlaps by 1m; should fail)"
          trigger:
            - "PATCH /matches/{m2_touch}/ with scheduled_start=11:00 scheduled_end=12:00"
            - "PATCH /matches/{m2_overlap}/ with scheduled_start=10:59 scheduled_end=11:59"
          assert:
            - "m2_touch: HTTP 200"
            - "m2_overlap: HTTP 409 AND error_id == ERR_MATCH_TIME_CONFLICT"

      - name: referee_double_booked_buffered_interval
        grounds:
          - validations[priority=19]  # ERR_REFEREE_DOUBLE_BOOKED
          - entities.Referee
        distinguishing_aspect: |
          Resource: a Referee. Interval semantics: BUFFERED — the occupied geometry is
          [scheduled_start-15m, scheduled_end+15m]. Different geometric treatment from
          Rule 8 instance 1: a match that touches end==start on the match side STILL
          collides on the referee side because of the 15-minute buffer, so a
          referee-assignment that would succeed for a team would fail here.
        test_recipe:
          setup:
            - "Referee rf assigned to Match m1 (10:00-11:00)"
            - "Candidate Match m2 scheduled_start=11:10 scheduled_end=12:10 (touches buffer)"
            - "Candidate Match m3 scheduled_start=11:20 scheduled_end=12:20 (outside buffer)"
          trigger:
            - "POST /matches/{m2}/assign-referee with referee_user_id=rf"
            - "POST /matches/{m3}/assign-referee with referee_user_id=rf"
          assert:
            - "m2: HTTP 409 AND error_id == ERR_REFEREE_DOUBLE_BOOKED (within +15m buffer)"
            - "m3: HTTP 200 (outside buffer)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥ 2)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: prize_pool_conservation_on_clawback_and_finalize
        grounds:
          - state_machines.PrizePayout.PROVISIONAL_to_CLAWED_BACK
          - state_machines.PrizePayout.PROVISIONAL_to_FINALIZED
          - state_machines.Tournament.COMPLETED_to_PRIZES_DISTRIBUTED
          - validations[priority=21]  # ERR_PRIZE_POOL_INVARIANT
        distinguishing_aspect: |
          Conserved quantity: SUM(PrizePayout.gross_amount_cents WHERE
          tournament_id=T.id) — the total prize-pool cash. The cascade
          {RULE_UPHELD-DISQUALIFICATION → TeamRegistration DISQUALIFIED → PrizePayout
          CLAWED_BACK} reduces some rows to 0; the FINALIZE recompute MUST emit a
          null-team retained row (or reallocate) so the sum returns exactly to
          Tournament.total_prize_pool_cents. distribute-prizes hard-checks the
          invariant via ERR_PRIZE_POOL_INVARIANT.
        test_recipe:
          setup:
            - "Tournament T from Rule 1 instance 1 (pool=1000000, three tiers + MVP, T2 DQ'd after COMPLETED)"
          trigger:
            - "POST /tournaments/{T}/finalize-prize-pool"
            - "POST /tournaments/{T}/distribute-prizes"
          assert:
            - "After finalize: sum(PrizePayout.gross_amount_cents) == 1000000 (== Tournament.total_prize_pool_cents)"
            - "distribute-prizes returns HTTP 200 (invariant held); Tournament.status == PRIZES_DISTRIBUTED"
            - "Counter-check: removing the null-team retained 100000 row would cause distribute-prizes to fail with ERR_PRIZE_POOL_INVARIANT"

      - name: contagion_risk_conservation_on_appeal_overturn
        grounds:
          - calculations.contagion_risk_score
          - calculations.contagion_risk_score.variants.contagion_risk_score_appeal_reversal
          - state_machines.MatchIncident.UNDER_REVIEW_to_RULED
          - state_machines.MatchIncident.APPEALED_to_RULED
        distinguishing_aspect: |
          Different conserved quantity: Team.accumulated_risk (a risk-points scalar, NOT
          cash). The forward rule + overturn-appeal pair MUST leave Team.accumulated_risk
          unchanged modulo decay between the two events. Pinned formula: post_overturn =
          pre_rule with the exact delta added by the rule subtracted at overturn.
        test_recipe:
          setup:
            - "Team team_x with accumulated_risk = 0 (clean slate)"
            - "Two incidents: i1 UPHELD with delta=9 (FINE × CHEATING), i2 UPHELD with delta=5 (FORFEIT × LATENCY)"
          trigger:
            - "Rule i1 → accumulated_risk = 9"
            - "Rule i2 → accumulated_risk = 14"
            - "Appeal i1 → OVERTURNED → accumulated_risk = 14 - 9 = 5 (i1 delta subtracted exactly, no decay re-applied between rule and appeal because Clock did not advance)"
          assert:
            - "After both rules: team_x.accumulated_risk == 14"
            - "After i1 overturn: team_x.accumulated_risk == 5"
            - "Invariant: (final_risk + sum_of_overturned_deltas) == sum_of_all_upheld_deltas (5 + 9 == 14)"
