      - name: recredit_requires_paid_item
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recredit requests are only valid against PAID items; a merely PRESENTED item yields ERR_INVALID_STATE."
        test_recipe:
          setup: ["eligible account with a PRESENTED (not paid) item"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
