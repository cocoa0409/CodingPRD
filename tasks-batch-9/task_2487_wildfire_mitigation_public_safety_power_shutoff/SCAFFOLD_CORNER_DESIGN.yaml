            - "the second read returns exactly the CHARLIE row with total_count 1"
            - "Circuit.${alpha_id}.upstream_circuit_id is null"
            - "the third call returns HTTP 404 with data.error_id == ERR_CIRCUIT_NOT_FOUND"

      - name: event_scope_rows_are_reachable_from_both_of_their_parents
