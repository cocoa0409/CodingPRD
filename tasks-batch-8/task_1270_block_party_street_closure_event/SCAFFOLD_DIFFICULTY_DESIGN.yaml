# =============================================================================
# Task 1270 — Scaffold Difficulty Design (Test Targeting Index), SKILL §1.8
# 9 rules x 2 instances. All chains replayable from empty DB via §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: petition_support_metric_modes_diverge
        grounds:
          - calculations.petition_support_metric
          - calculations.petition_required_signatures
          - entities.Petition.fields.support_mode
        distinguishing_aspect: |
          Civic domain (Petition): for identical signature rows, the DISTINCT_HOUSEHOLD
          variant (RESIDENTIAL) counts 2 while SIGNATURE_COUNT counts 3 — the two
          variants produce different threshold verdicts for the same data.
        test_recipe:
          setup:
            - "RESIDENTIAL segment with household_count=5 -> required_signatures=3, support_mode=DISTINCT_HOUSEHOLD"
            - "Petition holds 3 ACTIVE signatures from only 2 distinct household addresses"
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Ann Lee", email: "ann@x.com", phone: "555-1", address: "10 Maple Ave" }
              as: Anonymous
              captures: { org_id: $.data.id }
            - call: "POST /street-segments"
              payload: { name: "Maple 100", jurisdiction: CITY, segment_kind: RESIDENTIAL, household_count: 5, business_count: 0, intersects_arterial: false, length_m: 48 }
              as: CityAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CityAdmin
            - call: "POST /petitions"
              payload: { segment_id: "${seg_id}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { pet_id: $.data.id, pet_required: $.data.required_signatures }
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "1 Maple Ave", signer_name: "Sam One", signer_email: "s1@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "1 Maple Ave", signer_name: "Sam Two", signer_email: "s2@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "2 Maple Ave", signer_name: "Sam Three", signer_email: "s3@x.com" }
              as: Neighbor
          trigger:
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "3 Maple Ave", signer_name: "Sam Four", signer_email: "s4@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          assert:
            - "Petition.${pet_id}.required_signatures == 3 and support_mode == DISTINCT_HOUSEHOLD"
            - "First submit rejected with ERR_SIGNATURE_THRESHOLD_NOT_MET because distinct_household_count == 2 < 3 although valid_signature_count == 3 >= 3"
            - "After the third distinct household signs, second submit succeeds and Petition.status == SUBMITTED"
      - name: permit_fee_provisional_vs_final_diverge
        grounds:
          - calculations.permit_fee_provisional
          - calculations.permit_fee_final
          - entities.PermitApplication.fields.provisional_fee_cents
          - entities.PermitApplication.fields.final_fee_cents
        distinguishing_aspect: |
          Fiscal domain (PermitApplication, different entity domain than the Petition
          instance): provisional (submit) = 13200 with no discount/surcharge/tax; final
          (issue) = 12502 after the large-event discount, admin surcharge and taxed
          per-line equipment totals — identical application fields, different numbers.
        test_recipe:
          setup:
            - "CITY RESIDENTIAL segment (household_count=5); verified petition; clock 2026-06-01"
            - "Application: Sat 2026-06-20 14:00-22:00, attendance 100, amplified_sound=true, alcohol_served=false"
            - "TCP created in DRAFT with 4 barricades / 20 cones / 2 signs before submit so provisional equipment estimate = 1700"
            - "Reservations 4 BARRICADE + 20 CONE + 2 SIGN; deposit 10000; insurance VERIFIED; plans approved; issued"
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Ann Lee", email: "ann@x.com", phone: "555-1", address: "10 Maple Ave" }
              as: Anonymous
              captures: { org_id: $.data.id }
            - call: "POST /street-segments"
              payload: { name: "Maple 100", jurisdiction: CITY, segment_kind: RESIDENTIAL, household_count: 5, business_count: 0, intersects_arterial: false, length_m: 48 }
              as: CityAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CityAdmin
            - call: "POST /petitions"
              payload: { segment_id: "${seg_id}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "1 Maple Ave", signer_name: "Sam One", signer_email: "s1@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "2 Maple Ave", signer_name: "Sam Two", signer_email: "s2@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "3 Maple Ave", signer_name: "Sam Three", signer_email: "s3@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /petitions/${pet_id}/verify"
              payload: { decision: APPROVE }
              as: PermitOfficer
            - call: "POST /permit-applications"
              payload: { petition_id: "${pet_id}", event_start_at: "2026-06-20T14:00:00Z", event_end_at: "2026-06-20T22:00:00Z", expected_attendance: 100, amplified_sound: true, alcohol_served: false, food_vendors: false }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/traffic-control-plans"
              payload: { barricade_count: 4, cone_count: 20, sign_count: 2, emergency_lane_width_m: 6.5, emergency_lane_continuous: true, placement_notes: "both ends plus midblock" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tcp_id: $.data.id }
            - call: "POST /permit-applications/${app_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { app_prov: $.data.provisional_fee_cents, app_v: $.data.version }
            - call: "POST /traffic-control-plans/${tcp_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /traffic-control-plans/${tcp_id}/review"
              payload: { decision: APPROVE }
              as: TrafficReviewer
            - call: "POST /permit-applications/${app_id}/sound-plans"
              payload: { speaker_count: 4, max_db_at_property_line: 60, planned_sound_end: "21:30" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /sound-plans/${sp_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /sound-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyReviewer
            - call: "POST /permit-applications/${app_id}/insurance-certificates"
              payload: { kind: CERTIFICATE, expected_application_version: "${app_v}", insurer_name: "Acme Mutual", policy_number: "P-100", coverage_amount_cents: 100000000, expires_on: "2026-12-31" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /insurance-certificates/${ic_id}/review"
              payload: { decision: APPROVE }
              as: SafetyReviewer
            - call: "POST /equipment-stocks"
              payload: { depot_name: "Depot A", equipment_kind: BARRICADE, total_units: 10 }
              as: CityAdmin
            - call: "POST /equipment-stocks"
              payload: { depot_name: "Depot A", equipment_kind: CONE, total_units: 30 }
              as: CityAdmin
            - call: "POST /equipment-stocks"
              payload: { depot_name: "Depot A", equipment_kind: SIGN, total_units: 5 }
              as: CityAdmin
            - call: "POST /permit-applications/${app_id}/equipment-reservations"
              payload: { equipment_kind: BARRICADE, units: 4 }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /permit-applications/${app_id}/equipment-reservations"
              payload: { equipment_kind: CONE, units: 20 }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /permit-applications/${app_id}/equipment-reservations"
              payload: { equipment_kind: SIGN, units: 2 }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /permit-applications/${app_id}/deposits"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /permit-applications/${app_id}/approve"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /permit-applications/${app_id}/issue"
              payload: {}
              as: PermitOfficer
              captures: { app_final: $.data.final_fee_cents, app_eq: $.data.equipment_total_cents }
          assert:
            - "PermitApplication.${app_id}.provisional_fee_cents == 13200 (fee_subtotal 11500 + plan estimate 1700, frozen at submit)"
            - "PermitApplication.${app_id}.final_fee_cents == 12502 (discounted fee 10350 + surcharge 311 + equipment 1841)"
            - "PermitApplication.${app_id}.equipment_total_cents == 1841 (1083 + 541 + 217 with per-line tax)"
            - "provisional_fee_cents != final_fee_cents for identical application fields"
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_fee_discount_and_surcharge_order
        grounds:
          - calculations.permit_fee_final
          - calculations.deposit_required
        distinguishing_aspect: |
          Mode (a) plus pinned evaluation order: fee depends on >= 3 interacting inputs
          (attendance tier, alcohol flag, STATE_ROUTE surcharge) with the large-event
          discount eligibility evaluated on the PRE-discount fee_subtotal + deposit and
          the 3% admin surcharge applied to the discounted fee only, never to deposit
          or equipment — any other order yields a different total.
        test_recipe:
          setup:
            - "STATE_ROUTE MIXED_USE segment (household_count=2, business_count=2 -> required_signatures=3, SIGNATURE_COUNT mode)"
            - "Application: Mon 2026-07-20 14:00-22:00, attendance 200, alcohol_served=true, amplified_sound=false"
            - "TCP 1 barricade (length_m=12 -> minimum 1); one 1-unit BARRICADE reservation; deposit 45000; insurance VERIFIED; approved"
          setup_api_calls:
            - call: "POST /organizers"
              payload: { full_name: "Bo Chen", email: "bo@x.com", phone: "555-2", address: "7 State Rd" }
              as: Anonymous
