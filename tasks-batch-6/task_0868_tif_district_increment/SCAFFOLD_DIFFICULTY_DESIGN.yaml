scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: increment_provisional_vs_final_capture
        grounds:
          - calculations.increment_capture
          - state_machines.IncrementRecord.CERTIFIED_to_FINALIZED
          - entities.IncrementRecord.fields.captured_increment_cents
        distinguishing_aspect: "On the IncrementRecord domain, the PROVISIONAL capture assumes full collection (captured 38800000) while the FINAL capture at collection_rate 0.95 yields 36860000 — a -1940000 fund true-up for identical incremental EAV and rate."
        test_recipe:
          setup:
            - "District certified with base_eav 1,000,000,000 and aggregate rate 0.08 (School .05 + County .02 + Municipal .01)."
            - "Increment record for 2026 at current_eav 1,500,000,000 captured provisionally (fund +38,800,000)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Riverside TIF", municipality_name: "Riverside", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School 200", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /increment-records/${ir_id}/finalize"
              payload: { collection_rate: 0.95 }
              as: CountyClerk
          assert:
            - "IncrementRecord.${ir_id}.variant_state == FINAL"
            - "IncrementRecord.${ir_id}.gross_increment_cents == 38000000"
            - "IncrementRecord.${ir_id}.captured_increment_cents == 36860000"
            - "ProjectFund(district ${d_id}).lifetime_increment_cents == 36860000"
            - "ProjectFund(district ${d_id}).balance_cents == 36860000"

      - name: annual_surplus_gross_vs_net
        grounds:
          - calculations.annual_surplus_determination
          - state_machines.AnnualReport.FILED_to_ACCEPTED
          - entities.AnnualReport.fields.surplus_declared_cents
        distinguishing_aspect: "On the AnnualReport domain, the GROSS variant reserves only near-term senior debt service (1,000,000 → surplus 455,000) while NET reserves full senior outstanding (10,000,000 → surplus 0) for identical fund balance 1,455,000 and bond."
        test_recipe:
          setup:
            - "District G (surplus_policy GROSS) and District N (surplus_policy NET), each certified with the same three bodies, each fund credited 1,455,000 via a 2026 increment, each with one SENIOR bond (principal 10,000,000, 0% interest, 2026-2035)."
            - "A filed 2027 annual report on each."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Gross TIF", municipality_name: "Alpha", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23, surplus_policy: "GROSS" }
              as: MunicipalAdmin
              captures: { dG: $.data.id }
            - call: "POST /tif-districts/${dG}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dG}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dG}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dG}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { dG_ver: $.data.version }
            - call: "POST /tif-districts/${dG}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 118750000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${dG}", obligation_type: "BOND", principal_cents: 10000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { obG: $.data.id }
            - call: "POST /obligations/${obG}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${obG}/register"
              payload: { priority_rank: 1, expected_district_version: "${dG_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "POST /tif-districts/${dG}/annual-reports"
              payload: { report_tax_year: 2027 }
              as: CountyClerk
              captures: { arG: $.data.id }
            - call: "POST /annual-reports/${arG}/file"
              payload: {}
              as: CountyClerk
            - call: "GET /tif-districts/${dG}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { fG_ver: "$.data[0].version" }
            - call: "POST /tif-districts"
              payload: { name: "Net TIF", municipality_name: "Beta", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23, surplus_policy: "NET" }
              as: MunicipalAdmin
              captures: { dN: $.data.id }
            - call: "POST /tif-districts/${dN}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dN}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dN}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dN}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { dN_ver: $.data.version }
            - call: "POST /tif-districts/${dN}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 118750000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${dN}", obligation_type: "BOND", principal_cents: 10000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { obN: $.data.id }
            - call: "POST /obligations/${obN}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${obN}/register"
              payload: { priority_rank: 1, expected_district_version: "${dN_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "POST /tif-districts/${dN}/annual-reports"
              payload: { report_tax_year: 2027 }
              as: CountyClerk
              captures: { arN: $.data.id }
            - call: "POST /annual-reports/${arN}/file"
              payload: {}
              as: CountyClerk
            - call: "GET /tif-districts/${dN}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { fN_ver: "$.data[0].version" }
          trigger:
            - call: "POST /annual-reports/${arG}/accept"
              payload: { expected_fund_version: "${fG_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
            - call: "POST /annual-reports/${arN}/accept"
              payload: { expected_fund_version: "${fN_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
          assert:
            - "AnnualReport.${arG}.surplus_basis == GROSS"
            - "AnnualReport.${arG}.obligation_reserve_cents == 1000000"
            - "AnnualReport.${arG}.surplus_declared_cents == 455000"
            - "AnnualReport.${arN}.surplus_basis == NET"
            - "AnnualReport.${arN}.obligation_reserve_cents == 10000000"
            - "AnnualReport.${arN}.surplus_declared_cents == 0"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: disbursement_min_of_three_with_interest_first
        grounds:
          - calculations.disbursement_allocation
          - state_machines.Disbursement.__create___to_PAID
          - entities.Disbursement.fields.interest_portion_cents
        distinguishing_aspect: "Mode (a): amount is bounded by min(fund_balance 38,800,000, outstanding 21,000,000, annual_cap +inf) and the 5,000,000 paid splits interest-before-principal into 1,000,000 + 4,000,000."
        test_recipe:
          setup:
            - "Certified district, fund 38,800,000 from a 2026 increment."
            - "SENIOR bond (principal 20,000,000 @500bps) registered by admin-1, one year of interest accrued (accrued 1,000,000, outstanding 21,000,000)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Dbrs TIF", municipality_name: "Gamma", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 500, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "POST /obligations/${ob_id}/accrue-interest"
              payload: { accrual_tax_year: 2026 }
              as: MunicipalAdmin
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
          trigger:
            - call: "POST /obligations/${ob_id}/disbursements"
              payload: { amount_cents: 5000000, disbursement_tax_year: 2026, expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
              captures: { disb_id: $.data.id }
          assert:
            - "Disbursement.${disb_id}.interest_portion_cents == 1000000"
            - "Disbursement.${disb_id}.principal_portion_cents == 4000000"
            - "Obligation.${ob_id}.accrued_interest_cents == 0"
            - "Obligation.${ob_id}.principal_remaining_cents == 16000000"
            - "Obligation.${ob_id}.outstanding_balance_cents == 16000000"
            - "ProjectFund(district ${d_id}).balance_cents == 33800000"

      - name: surplus_split_largest_remainder
        grounds:
          - calculations.surplus_taxing_body_split
          - state_machines.AnnualReport.FILED_to_ACCEPTED
          - entities.SurplusDistribution.fields.amount_cents
        distinguishing_aspect: "Mode (b): splitting surplus 970,001 by weights .625/.25/.125 floors to 606250/242500/121250 (sum 970000) then the single remainder cent goes to the largest fractional part (School .625) → 606251/242500/121250."
        test_recipe:
          setup:
            - "Certified GROSS district with three bodies, no senior obligations, fund 970,001 from a 2026 increment; a filed 2027 report."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Split TIF", municipality_name: "Delta", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23, surplus_policy: "GROSS" }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
              captures: { tb_school: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
              captures: { tb_county: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
              captures: { tb_city: $.data.id }
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 112500013 }
              as: CountyClerk
            - call: "POST /tif-districts/${d_id}/annual-reports"
              payload: { report_tax_year: 2027 }
              as: CountyClerk
              captures: { ar_id: $.data.id }
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: CountyClerk
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
          trigger:
            - call: "POST /annual-reports/${ar_id}/accept"
              payload: { expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
          assert:
            - "AnnualReport.${ar_id}.surplus_declared_cents == 970001"
            - "SurplusDistribution(district ${d_id}, taxing_body ${tb_school}).amount_cents == 606251"
            - "SurplusDistribution(district ${d_id}, taxing_body ${tb_county}).amount_cents == 242500"
            - "SurplusDistribution(district ${d_id}, taxing_body ${tb_city}).amount_cents == 121250"
            - "sum of SurplusDistribution.amount_cents for district ${d_id} == 970001"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: obligation_review_revision_cycle
        grounds:
          - state_machines.Obligation.UNDER_REVIEW_to_PROPOSED
          - state_machines.Obligation.PROPOSED_to_UNDER_REVIEW
          - state_machines.Obligation.UNDER_REVIEW_to_REGISTERED
        distinguishing_aspect: "Cycle on Obligation: UNDER_REVIEW→PROPOSED (return) then PROPOSED→UNDER_REVIEW (resubmit) then →REGISTERED, proving the revision loop, not a linear pipeline."
        test_recipe:
          setup:
            - "Certified district; a BOND obligation submitted (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Cycle TIF", municipality_name: "Eps", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 5000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /obligations/${ob_id}/return"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
          assert:
            - "Obligation.${ob_id}.status == REGISTERED after the return→resubmit→register loop"
            - "Obligation.${ob_id}.seniority == SENIOR"

      - name: increment_finalize_reopen_cycle
        grounds:
          - state_machines.IncrementRecord.CERTIFIED_to_FINALIZED
          - state_machines.IncrementRecord.FINALIZED_to_CERTIFIED
          - entities.IncrementRecord.fields.variant_state
        distinguishing_aspect: "Cycle on IncrementRecord (different entity than Obligation): CERTIFIED→FINALIZED→CERTIFIED with the fund delta applied then reversed."
        test_recipe:
          setup:
            - "Certified district, 2026 increment captured provisionally (fund 38,800,000)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Rec TIF", municipality_name: "Zeta", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
              captures: { ir_id: $.data.id }
            - call: "POST /increment-records/${ir_id}/finalize"
              payload: { collection_rate: 0.95 }
              as: CountyClerk
          trigger:
            - call: "POST /increment-records/${ir_id}/reopen"
              payload: {}
              as: CountyClerk
          assert:
            - "IncrementRecord.${ir_id}.status == CERTIFIED"
            - "IncrementRecord.${ir_id}.variant_state == PROVISIONAL"
            - "IncrementRecord.${ir_id}.captured_increment_cents == 38800000"
            - "ProjectFund(district ${d_id}).lifetime_increment_cents == 38800000"
            - "ProjectFund(district ${d_id}).balance_cents == 38800000"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: decertify_sweep_to_taxing_bodies
        grounds:
          - state_machines.TifDistrict.CERTIFIED_to_DECERTIFIED
          - calculations.surplus_taxing_body_split
          - entities.TaxingBody.fields.total_surplus_received_cents
        distinguishing_aspect: "Depth-3 cascade from decertify(EXPIRATION): District→DEFEASE the PAYG note→sweep fund balance 970,001 into SurplusDistribution rows→each row raises its TaxingBody.total_surplus_received_cents."
        test_recipe:
          setup:
            - "Certified GROSS district, fund 970,001 from a 2026 increment; one registered subordinate DEVELOPER_NOTE (principal 5,000,000) never disbursed."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Decert TIF", municipality_name: "Eta", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23, surplus_policy: "GROSS" }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
              captures: { tb_school: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
              captures: { tb_county: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
              captures: { tb_city: $.data.id }
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 112500013 }
              as: CountyClerk
            - call: "POST /developers"
              payload: { legal_name: "Acme Dev", contact_email: "a@x.com" }
              as: MunicipalAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", developer_id: "${dev_id}", obligation_type: "DEVELOPER_NOTE", principal_cents: 5000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /tif-districts/${d_id}/decertify"
              payload: { termination_type: "EXPIRATION", termination_tax_year: 2048 }
              as: MunicipalAdmin
          assert:
            - "TifDistrict.${d_id}.status == DECERTIFIED"
            - "Obligation.${ob_id}.status == DEFEASED"
            - "Obligation.${ob_id}.outstanding_balance_cents == 0"
            - "ProjectFund(district ${d_id}).status == CLOSED"
            - "ProjectFund(district ${d_id}).balance_cents == 0"
            - "TaxingBody.${tb_school}.total_surplus_received_cents == 606251"
            - "TaxingBody.${tb_county}.total_surplus_received_cents == 242500"
            - "TaxingBody.${tb_city}.total_surplus_received_cents == 121250"

      - name: disbursement_satisfies_and_clears_district
        grounds:
          - state_machines.Disbursement.__create___to_PAID
          - state_machines.Obligation.REGISTERED_to_SATISFIED
          - entities.TifDistrict.fields.obligations_cleared
        distinguishing_aspect: "Depth-3 cascade from a disbursement (different trigger): Disbursement→reduces Obligation.outstanding_balance to 0→Obligation auto REGISTERED→SATISFIED→District.obligations_cleared becomes true."
        test_recipe:
          setup:
            - "Certified district, fund 38,800,000; a single registered SENIOR bond (principal 20,000,000, 0% interest)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Bubble TIF", municipality_name: "Theta", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
