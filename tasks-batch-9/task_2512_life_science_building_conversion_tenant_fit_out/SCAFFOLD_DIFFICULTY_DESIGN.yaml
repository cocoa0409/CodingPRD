  # ===========================================================================
  # RULE 9 - compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reservation_cancel_restores_building_pools_without_drift
        grounds:
          - calculations.building_capacity_pools
          - state_machines.CapacityReservation.RESERVED_to_CANCELLED
          - concurrency_rules[reservation-create-stale-building]
          - entities.Building.fields.exhaust_available_cfm
          - entities.Building.fields.power_available_kw
        distinguishing_aspect: |
          Cancelling an 18000.00 CFM / 250.00 kW reservation returns the building to exactly
          80000.00 / 1200.00 available with 0.00 reserved - the same values observed before the
          reservation existed - and the conservation identity total == available + reserved +
          committed holds at all three observation points, so a CANCELLED row must contribute to
          neither bucket rather than leaving a rounding or double-subtraction residue.
        test_recipe:
          setup:
            - "Building with 60000 CFM riser and 800 kW emergency power, conversion-approved"
            - "LAB_EXHAUST scope item (+20000 CFM) and EMERGENCY_POWER scope item (+400 kW) are both COMPLETE, so pools are 80000.00 CFM / 1200.00 kW"
            - "Lease executed on floor 2; project PR is P_ISSUED"
