  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_expected_subscription_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[modification-create-stale-subscription]
          - errors[ERR_STALE_SUBSCRIPTION_VERSION]
          - validations[priority=7]
        distinguishing_aspect: |
          The version the caller read before the first modification (1) is no longer current after
          it (2): replaying it is 412 ERR_STALE_SUBSCRIPTION_VERSION, nothing is mutated, and the
          same request with 2 succeeds - so the OCC field is the subscription's version, not the
          modification's.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A, read at version 1."
            - "A FREQUENCY_CHANGE to 8 was applied with expected_subscription_version 1, taking the subscription to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "FREQUENCY_CHANGE", expected_subscription_version: "${v1}", frequency_weeks: 8 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "GET /subscriptions/${s_a_id}"
              payload: {}
              as: RetentionSpecialist
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "ADDON_ADD", expected_subscription_version: "${v1}", addon_code: "MUG", addon_qty: 1 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { e_occ: $.data.error_id }
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "ADDON_ADD", expected_subscription_version: "${v2}", addon_code: "MUG", addon_qty: 1 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { mod2_id: $.data.id }
          assert:
            - "First response status is 412 and ${e_occ} == ERR_STALE_SUBSCRIPTION_VERSION"
            - "After the rejected call: Subscription.${s_a_id}.addons is the empty array, committed_price_cents == 4999 and version == 2"
            - "Second response status is 201"
            - "SubscriptionModification.${mod2_id}.delta_price_cents == 1299"
            - "Subscription.${s_a_id}.committed_price_cents == 6298"
            - "Subscription.${s_a_id}.version == 3"
            - "GET /subscription-modifications?subscription_id=${s_a_id} returns meta.total_count == 2"

      - name: stale_expected_campaign_version_from_before_launch_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[target-create-stale-campaign]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - validations[priority=8]
        distinguishing_aspect: |
          Launching is itself a write, so the DRAFT-era version 1 is stale the moment the campaign
          goes LAUNCHED: targeting with 1 is 412 ERR_STALE_CAMPAIGN_VERSION and the OCC rule
          (priority 8) outranks even the lapse check (priority 41) - a never-lapsed subscriber still
          gets the 412, not ERR_SUBSCRIBER_NOT_LAPSED.
        test_recipe:
          setup:
            - "Clock 2026-02-07; subscriber A registered and never subscribed; campaign WB_OCC created (version 1) and then launched (version 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /winback-campaigns"
              payload: { code: "WB_OCC", name: "OCC Probe", min_days_since_lapse: 0, max_days_since_lapse: 120, offer_discount_pct: 0.2000 }
              as: RetentionSpecialist
              captures: { camp_id: $.data.id, camp_v1: $.data.version }
            - call: "POST /winback-campaigns/${camp_id}/launch"
              payload: {}
              as: RetentionSpecialist
              captures: { camp_v2: $.data.version }
          trigger:
            - call: "POST /winback-campaigns/${camp_id}/targets"
              payload: { subscriber_id: "${sub_a_id}", expected_campaign_version: "${camp_v1}" }
              as: RetentionSpecialist
              captures: { e_occ2: $.data.error_id }
          assert:
            - "Response status is 412"
            - "${e_occ2} == ERR_STALE_CAMPAIGN_VERSION"
            - "${e_occ2} != ERR_SUBSCRIBER_NOT_LAPSED"
            - "WinBackCampaign.${camp_id}.state == LAUNCHED"
            - "WinBackCampaign.${camp_id}.version == 2"
            - "WinBackCampaign.${camp_id}.targeted_count == 0"
            - "GET /winback-targets?winback_campaign_id=${camp_id} returns meta.total_count == 0"

      - name: subscription_version_increments_once_per_write_including_indirect_ones
        claim_type: optimistic_concurrency
        grounds:
          - entities.Subscription.fields.version
          - endpoints["POST /payment-methods"].side_effects
          - endpoints["POST /cancellation-sessions/{id}/complete"].side_effects
        distinguishing_aspect: |
          The counter tracks writes to the row, not calls that name it: signup leaves version 1, a
          direct modification makes it 2, attaching a new card repoints the subscription to 3
          without any subscription-scoped call, and completing a cancellation makes it 4 - reads in
          between never move it.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "FREQUENCY_CHANGE", expected_subscription_version: "${v1}", frequency_weeks: 8 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "GET /subscriptions/${s_a_id}"
              payload: {}
              as: RetentionSpecialist
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "1881", exp_month: 6, exp_year: 2031, network: "MASTERCARD" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { pm_b_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "OTHER" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/complete"
              payload: { confirm: true }
              as: Subscriber
              as_user_id: "${sub_a_id}"
          assert:
            - "After the modification: Subscription.${s_a_id}.version == 2"
            - "The GET returns 200 and Subscription.${s_a_id}.version is still 2"
            - "After the new card: Subscription.${s_a_id}.payment_method_id == ${pm_b_id} and version == 3"
            - "PaymentMethod.${pm_a_id}.status == REPLACED"
            - "PaymentMethod.${pm_b_id}.status == ACTIVE"
            - "Opening the session and capturing the reason leave Subscription.${s_a_id}.version at 3"
            - "After completion: Subscription.${s_a_id}.lifecycle_state == PENDING_CANCEL and version == 4"
            - "Subscription.${s_a_id}.cancel_effective_at == 2026-03-07T00:00:00Z"

      - name: three_hop_cascade_from_one_write_off
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / write_off_cascade_invoice_subscription_subscriber_session
          rationale: "The named §1.8 instance verifies the four-hop chain end to end from a single decline."

      - name: both_margin_variants_on_one_grant
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / save_offer_margin_per_cycle_versus_blended_term_guardrail
          rationale: "The named §1.8 instance asserts both variants and the guardrail decision they drive."

  # ===========================================================================
  - section: consistency model
    instances:

      - name: addon_add_is_visible_in_the_same_response_and_on_reread
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.committed_price_cents
          - entities.SubscriptionModification.fields.delta_price_cents
        distinguishing_aspect: |
          There is no lag anywhere in the write path: the 201 body of the ADDON_ADD already carries
          delta_price_cents 1299, and the immediately following read of the subscription shows
          committed_price_cents 6298 and the MUG entry in addons - no second call, sweep or clock
          move is needed to reconcile the derived price.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100) offering MUG 1299 / 520; subscriber A subscribed with no addons at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "ADDON_ADD", expected_subscription_version: "${v1}", addon_code: "MUG", addon_qty: 1 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { mod_id: $.data.id }
            - call: "GET /subscriptions/${s_a_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_a_id}"
          assert:
            - "First response status is 201"
            - "SubscriptionModification.${mod_id}.state == APPLIED"
            - "SubscriptionModification.${mod_id}.delta_price_cents == 1299"
            - "SubscriptionModification.${mod_id}.prior_snapshot.addons is the empty array"
            - "Second response status is 200"
            - "Subscription.${s_a_id}.addons == [{ code: MUG, qty: 1 }]"
            - "Subscription.${s_a_id}.committed_price_cents == 6298"
            - "Subscription.${s_a_id}.baseline_price_cents == 4999"
            - "Subscription.${s_a_id}.version == 2"
            - "The signup Invoice keeps amount_cents 4999 and cogs_cents 2100: the addon affects only future cycles"
