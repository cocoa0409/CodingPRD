            - call: "POST /engagement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Risk Census", cycle_kind: "CENSUS", bank_id: "${rbank_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", min_n_default: 3 }
              as: HRAdmin
