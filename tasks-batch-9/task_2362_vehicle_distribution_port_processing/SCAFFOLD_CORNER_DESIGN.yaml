        claim_type: Cascade down
        grounds:
          - state_machines.ReleaseOrder.transitions.ALLOCATED_to_CANCELLED_BY_HOLD
          - state_machines.Vehicle.transitions.ALLOCATED_to_SHIPPING_READY
        excluded_because:
          difficulty_instance: transitive_cascade / hold_application_cascade_depth_four_cancels_allocation_and_reverses_accruals
