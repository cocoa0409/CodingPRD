- rule_id: resource_temporal_overlap
  instances:
  - name: weather_window_half_open_overlap
    grounds:
    - errors[ERR_WINDOW_OVERLAP]
    - calculations.freeze_thaw_eligibility
    distinguishing_aspect: 'Interval semantics = half-open [opens_at, closes_at) on the Season''s

      window set: overlap by 12h is rejected, while a successor opening

      exactly at the predecessor''s closes_at (zero gap, adjacency) is allowed.

      '
    test_recipe:
      setup:
      - Season OPEN (version captured); window W1 [2027-03-01T00:00:00Z, 2027-03-10T00:00:00Z) already declared (FORECAST)
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
