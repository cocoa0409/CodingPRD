          - state_machines.CurtailmentOrder
          - entities.Turbine.fields.effective_power_limit_kw
          - entities.WindFarm.fields.turbine_count
        distinguishing_aspect: |
          The consistency model is immediate, so no derived value may lag by a request: the turbine's
