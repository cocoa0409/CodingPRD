  - { id: ERR_DISPUTE_WINDOW_OPEN, http: 422, condition: "Pay from PENDING attempted while now <= dispute_deadline_at" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: CarrierAdmin
    description: "Carrier operations administrator: fleet, shippers, drivers, settlement payment, clock"
    identity: opaque
    exclusive_operations:
      - "POST /haul/shippers"
      - "POST /haul/drivers"
      - "POST /haul/trailers"
      - "POST /haul/settlements/{id}/pay"
      - "POST /haul/_clock/set_current_utc"
    shared_operations:
      - "POST /haul/drivers/{id}/duty-events (with CarrierAdmin or Driver)"
      - "POST /haul/trailers/{id}/washouts (with WashoutOperator)"
      - "All GET endpoints (Any)"
  - name: Dispatcher
    description: "Plans loads, allocates compartments, assigns drivers, manages weather holds, counters disputes"
    identity: opaque
    exclusive_operations:
      - "POST /haul/loads"
      - "POST /haul/loads/{id}/allocations"
      - "POST /haul/allocations/{id}/release"
      - "POST /haul/loads/{id}/finalize-plan"
      - "POST /haul/loads/{id}/reopen-plan"
      - "POST /haul/loads/{id}/assign-driver"
      - "POST /haul/loads/{id}/unassign-driver"
      - "POST /haul/loads/{id}/cancel"
      - "POST /haul/settlements/{id}/counter"
    shared_operations:
      - "POST /haul/loads/{id}/weather-holds (with Driver)"
      - "POST /haul/weather-holds/{id}/release (with Driver)"
      - "All GET endpoints (Any)"
  - name: ComplianceOfficer
    description: "Verifies health papers and brand inspections (never own uploads), reviews welfare incidents"
    identity: opaque
    exclusive_operations:
      - "POST /haul/loads/{id}/health-papers"
      - "POST /haul/health-papers/{id}/verify"
      - "POST /haul/health-papers/{id}/reject"
      - "POST /haul/loads/{id}/brand-inspections"
      - "POST /haul/brand-inspections/{id}/verify"
      - "POST /haul/brand-inspections/{id}/reject"
      - "POST /haul/loads/{id}/verify-paperwork"
      - "POST /haul/incidents/{id}/start-review"
      - "POST /haul/incidents/{id}/close"
    shared_operations: ["All GET endpoints (Any)"]
  - name: Driver
    description: "Entity-backed driver; operates own assigned loads, logs duty events, reports incidents"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /haul/loads/{id}/depart"
      - "POST /haul/loads/{id}/rest-unload"
      - "POST /haul/loads/{id}/resume-transit"
      - "POST /haul/loads/{id}/arrive"
      - "POST /haul/incidents"
    shared_operations:
      - "POST /haul/drivers/{id}/duty-events (own id only; with CarrierAdmin)"
      - "POST /haul/loads/{id}/weather-holds (own load; with Dispatcher)"
      - "POST /haul/weather-holds/{id}/release (own load; with Dispatcher)"
      - "POST /haul/loads/{id}/weight-tickets (with ConsigneeAgent)"
      - "All GET endpoints (Any)"
  - name: ConsigneeAgent
    description: "Receiving agent at destination: delivery tickets, delivery confirmation, weight disputes"
    identity: opaque
    exclusive_operations:
      - "POST /haul/loads/{id}/deliver"
      - "POST /haul/settlements/{id}/dispute"
      - "POST /haul/settlements/{id}/accept-original"
      - "POST /haul/settlements/{id}/redispute"
      - "POST /haul/settlements/{id}/accept-counter"
    shared_operations:
      - "POST /haul/loads/{id}/weight-tickets (with Driver)"
      - "All GET endpoints (Any)"
  - name: WashoutOperator
    description: "Biosecurity wash station operator"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /haul/trailers/{id}/washouts (with CarrierAdmin)"
      - "All GET endpoints (Any)"
  - name: Any
    description: "Wildcard: every authenticated role may perform these shared read operations"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
