  - rule_id: transitive_cascade
    instances:
      - name: forecast_embargo_cascades_four_levels_to_net_payable
        grounds:
          - calculations.embargo_determination
          - calculations.leg_posture_derivation
          - state_machines.SegmentAssignment.RESERVED_to_RELEASED
          - state_machines.Reservation.CONFIRMED_to_REBOOK_REQUIRED
          - calculations.reservation_charge_assembly
        distinguishing_aspect: |
          Origin is a temperature forecast update. Chain: forecast -> governing_embargo_rule_id and posture
          EMBARGOED (level 1) -> the CHECKED segment is RELEASED and booked_checked_count decremented
          (level 2) -> the reservation is driven to REBOOK_REQUIRED with refunded_amount 33180 (level 3) ->
          reservation_charge_assembly rewrites net_payable_amount to 0 (level 4).
        test_recipe:
          setup:
            - "CHECKED itinerary confirmed on AN101 HKG->LAX departing 2026-09-10T02:00Z with one RESERVED segment priced 33180, booked_checked_count 1 and posture OPEN"
            - "A TemperatureEmbargoRule on HKG with direction ORIGIN, season 06-01 to 09-30, forecast_high_limit_c 29.5, forecast_low_limit_c -5.0 and applies_to_routings [CHECKED, CARGO]"
            - "The rule is not governing yet because the leg forecast is 25/15"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
