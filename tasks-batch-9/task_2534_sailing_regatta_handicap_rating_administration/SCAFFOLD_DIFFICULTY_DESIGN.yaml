            - "Race 1 at 14:00 is STARTED and all three results are recorded at clock 2026-08-05T18:00:00Z, so results_closed_utc is 18:00 and the window runs to 19:30 inclusive."
            - "Entry B is then withdrawn while the division still holds two assigned entries, so the division stays CONFIRMED and the race stays unblocked."
            - "The clock is advanced to 2026-08-05T21:00:00Z, ninety minutes past the limit instant."
