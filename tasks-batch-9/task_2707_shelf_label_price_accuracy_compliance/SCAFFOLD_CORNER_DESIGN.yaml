            - "${swept} == 3 (every non-REMOVED sign of the store is examined, DRAFT included), ${expired} == 1, ${noncomp} == 1"
            - "PromoSignage.${sign_exp}.status == EXPIRED_PENDING_REMOVAL and compliance_state == EXPIRED_NOT_REMOVED — the pinned order gives expiry priority even though its missing_disclosure_codes == [UNIT_PRICE] is non-empty"
            - "PromoSignage.${sign_live}.status == NON_COMPLIANT and compliance_state == MISSING_DISCLOSURE"
            - "PromoSignage.${sign_draft}.status is still DRAFT and compliance_state is still NOT_APPLICABLE"
            - "${posture} == RESTRICTED and Store.${store_a}.compliance_posture == RESTRICTED (signage_violation_count == 2 >= 1, with zero findings, zero failed audits and backlog 0)"

