            - "100.00 total -- HTTP 201; EvaluationForm.${f1}.behavior_weight_total == 100.00 and compliance_behavior_count == 1"
            - "no compliance-critical behaviour (weights DO total 100.00) -- HTTP 422 ERR_NO_COMPLIANCE_BEHAVIOR, proving priority 31 passed before priority 32 ran"
            - "duplicate DISCLOSE code (weights total 100.00 and a compliance behaviour is present) -- HTTP 422 ERR_DUPLICATE_BEHAVIOR_CODE"
