  - section: calculations
    instances:
      - name: supervision_tier_takes_the_worse_of_two_axes
        claim_type: correct_result
        grounds:
          - calculations.supervision_tier
          - calculations.supervision_tier.constants.COGNITION_BAND
          - calculations.supervision_tier.constants.FUNCTION_BAND
        distinguishing_aspect: "The tier is max(cognition_band, function_band), not the cognition axis and not an average: an INTACT resident who is WHEELCHAIR_DEPENDENT lands in TIER_2 while a SEVERE_IMPAIRMENT resident who is INDEPENDENT lands in TIER_3."
        test_recipe:
          setup:
            - "two residents with deliberately mismatched axes, one driven by mobility and one driven by cognition"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Mobility Driven", room_number: "401A", admission_date: "2026-07-18" }
              as: ActivityDirector
              captures: { rm_id: $.data.id }
            - call: "POST /recreation/residents"
              payload: { full_name: "Cognition Driven", room_number: "401B", admission_date: "2026-07-18" }
              as: ActivityDirector
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /recreation/residents/${rm_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "WHEELCHAIR_DEPENDENT", interest_domains: ["CREATIVE"], preferred_group_size: "SMALL", effective_date: "2026-07-18" }
              as: RecreationTherapist
            - call: "POST /recreation/residents/${rc_id}/assessments"
              payload: { cognitive_level: "SEVERE_IMPAIRMENT", functional_mobility: "INDEPENDENT", interest_domains: ["SPIRITUAL"], preferred_group_size: "ONE_TO_ONE", effective_date: "2026-07-18" }
              as: RecreationTherapist
          assert:
            - "both responses are 201"
            - "Resident.${rm_id}.supervision_tier == TIER_2, from FUNCTION_BAND[WHEELCHAIR_DEPENDENT] == 2 beating COGNITION_BAND[INTACT] == 1"
            - "Resident.${rc_id}.supervision_tier == TIER_3, from COGNITION_BAND[SEVERE_IMPAIRMENT] == 3 beating FUNCTION_BAND[INDEPENDENT] == 1"
            - "Resident.${rm_id}.cognitive_level == INTACT and Resident.${rm_id}.functional_mobility == WHEELCHAIR_DEPENDENT"
      - name: supervision_tier_governing_assessment_is_latest_effective_date
        claim_type: input_set_filtering
        grounds:
          - calculations.supervision_tier
          - calculations.supervision_tier.input_set
          - entities.Resident.fields.interest_domains
        distinguishing_aspect: "The governing assessment is chosen by effective_date DESC, NOT by creation order: filing a backdated assessment after a newer one leaves supervision_tier and the mirrored interest_domains on the newer row."
        test_recipe:
          setup:
            - "one resident with a first assessment effective 2026-07-25 (INTACT / INDEPENDENT, TIER_1, interests [SOCIAL])"
            - "a backdated assessment effective 2026-07-20 (SEVERE_IMPAIRMENT / BEDBOUND, TIER_3, interests [SPIRITUAL]) is filed afterwards, so creation order and effective_date order disagree"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Backdated Bea", room_number: "402A", admission_date: "2026-07-19" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-25" }
              as: RecreationTherapist
              captures: { newer_id: $.data.id }
          trigger:
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "SEVERE_IMPAIRMENT", functional_mobility: "BEDBOUND", interest_domains: ["SPIRITUAL"], preferred_group_size: "ONE_TO_ONE", effective_date: "2026-07-20" }
              as: RecreationTherapist
              captures: { older_id: $.data.id }
          assert:
            - "the response status is 201 and the backdated assessment is stored"
            - "Resident.${res_id}.supervision_tier == TIER_1, still governed by assessment ${newer_id}"
            - "Resident.${res_id}.functional_mobility == INDEPENDENT, not BEDBOUND"
            - "Resident.${res_id}.interest_domains == [\"SOCIAL\"], not [\"SPIRITUAL\"]"
            - "GET /recreation/assessments?resident_id=${res_id} returns both ${newer_id} and ${older_id} with total_count 2, so the loser is retained rather than deleted"
      - name: engagement_index_rounds_half_up_to_three_decimals
        claim_type: precision
        grounds:
          - calculations.resident_engagement_index
          - calculations.resident_engagement_index.constants.ENGAGEMENT_POINTS
          - calculations.resident_engagement_index.precision
        distinguishing_aspect: "REFUSED records sit in the denominator while contributing zero points, producing the non-terminating 1/12 that pins the 3-decimal round_half_up: 0.083, not 0.08 and not 0.0833."
