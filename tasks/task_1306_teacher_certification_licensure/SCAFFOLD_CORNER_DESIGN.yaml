  - section: calculations
    instances:
      - name: risk_score_decay_band_old_felony_clears
        claim_type: correct_result
        grounds: [calculations.background_risk_score]
        distinguishing_aspect: "Decay band: FELONY_VIOLENT conviction 12 years old -> 100 x 0.25 = 25 < 40 and outside the 10-year forced-flag lookback -> CLEARED."
        test_recipe:
          setup: ["application; background check with one FELONY_VIOLENT CONVICTION dated 2014-08-01"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Gus Gu", email: "gus@x.com", date_of_birth: "1985-05-05T00:00:00Z", ssn_last4: "1010", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [ { offense_category: "FELONY_VIOLENT", offense_date: "2014-08-01T00:00:00Z", disposition: "CONVICTION" } ] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
          trigger:
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator, captures: { risk: $.data.risk_score, st: $.data.status } }
          assert:
            - "BackgroundCheck.${bg}.risk_score == 25"
            - "BackgroundCheck.${bg}.status == 'CLEARED'"

      - name: forced_flag_violent_conviction_within_lookback
        claim_type: constants_applied
        grounds: [calculations.background_risk_score, "errors[ERR_BACKGROUND_NOT_CLEARED]"]
        distinguishing_aspect: "Forced flag beats score: FELONY_VIOLENT conviction 8 years old scores only 25 (< 40) but is inside the 10-year lookback -> FLAGGED anyway."
        test_recipe:
          setup: ["application; background check with one FELONY_VIOLENT CONVICTION dated 2018-08-01"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Han Ha", email: "han@x.com", date_of_birth: "1986-06-06T00:00:00Z", ssn_last4: "1011", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
