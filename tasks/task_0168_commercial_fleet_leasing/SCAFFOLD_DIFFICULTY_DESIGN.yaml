scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overage_provisional_vs_final
        grounds:
          - calculations.overage_settlement
          - state_machines.OverageSettlement.DRAFT_to_FINAL
          - entities.OverageSettlement.fields.provisional_balance_cents
          - entities.OverageSettlement.fields.balance_cents
        distinguishing_aspect: |
          The provisional variant uses the latest accepted TelematicsEvent reading as-of now()
          (forward-looking), while the final variant uses only events strictly inside the calendar
          month (chronological). With telematics events posted AFTER period_end, provisional and
          final produce different numbers on the OverageSettlement entity domain.
        test_recipe:
          setup:
            - "Create FleetManager-driven lessee L, vehicle V (vehicle_class=CLASS_5, odometer_baseline_miles=0), lease LA with monthly_mileage_allowance=1000, overage_rate_cents_per_mile=25, tiered_overage_enabled=false."
            - "Activate LA; clock at 2026-03-15T00:00:00.000Z. Telematics events for V: (2026-03-01T00:00:00, odom=0), (2026-03-31T23:59:59, odom=1800), (2026-04-02T00:00:00, odom=2500)."
            - "Advance clock to 2026-04-02T12:00:00.000Z."
          trigger:
            - "POST /overage-settlements {lease_agreement_id: LA, period_year: 2026, period_month: 3} -> S (DRAFT)."
            - "POST /overage-settlements/S/finalize."
          assert:
            - "After create, S.provisional_overage_miles == 1500 and S.provisional_balance_cents == 37500 (forward-looking uses odom=2500 minus baseline 0 minus allowance 1000)."
            - "After finalize, S.final_overage_miles == 800 and S.balance_cents == 20000 (chronological uses odom=1800 minus 0 minus 1000)."
            - "S.provisional_balance_cents != S.balance_cents."

      - name: collision_with_vs_without_telematics_discount
        grounds:
          - calculations.collision_settlement
          - state_machines.CollisionClaim.UNDER_REVIEW_to_APPROVED
          - entities.CollisionClaim.fields.lessee_deductible_cents
          - entities.TelematicsEvent.fields.fault_code
        distinguishing_aspect: |
          Two valid resolutions of the SAME approval action on the CollisionClaim entity domain
          (different from the OverageSettlement domain above): with a fault_code in the
          (incident-24h, incident] window the deductible equals the raw amount; without one, after
          revision the deductible drops 25%. Same approval inputs, different deductible.
        test_recipe:
          setup:
            - "Create lessee L, vehicle V, lease LA (ACTIVE)."
            - "Variant A: post telematics event at (incident_ts - 1h) with fault_code='P0420'."
            - "Variant B: post telematics events at (incident_ts - 1h) with fault_code='' (empty)."
            - "Both: file collision claim CA with estimate_cents=300000; start review; request revision; PATCH revised_estimate_cents=200000."
          trigger:
            - "POST /collision-claims/CA/approve in each variant."
          assert:
            - "Variant A (fault code present): CA.lessee_deductible_cents == 200000 (no discount; raw = min(200000, 250000))."
            - "Variant B (no fault code, revision_round==1): CA.lessee_deductible_cents == 150000 (25% discount of 200000)."
            - "Variant A and Variant B produce different deductible from identical estimate inputs."

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overage_tiered_pricing_three_inputs
        grounds:
          - calculations.overage_settlement
          - entities.LeaseAgreement.fields.tiered_overage_enabled
          - entities.LeaseAgreement.fields.overage_rate_cents_per_mile
          - entities.LeaseAgreement.fields.monthly_mileage_allowance
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (overage_miles, overage_rate_cents_per_mile, tier breakpoints)
          and non-linear interaction (tier selection branches with multiplicative bps factors), exercising
          combinatorial complexity along the tier-selection axis.
        test_recipe:
          setup:
            - "Lessee L, vehicle V (odometer_baseline=0), lease LA with monthly_mileage_allowance=1000, overage_rate_cents_per_mile=25, tiered_overage_enabled=true."
            - "Telematics: (2026-03-01T00:00:00, odom=0), (2026-03-31T23:59:59, odom=3500)."
            - "Clock at 2026-04-01T01:00:00."
          trigger:
            - "POST /overage-settlements {lease_agreement_id: LA, period_year:2026, period_month:3} -> S."
            - "POST /overage-settlements/S/finalize."
          assert:
            - "overage_miles == 2500 (3500 - 0 - 1000)."
            - "tier1 = 500 * 25 = 12500."
            - "tier2 = round_half_up(1500 * 25 * 12500 / 10000) = 46875."
            - "tier3 = round_half_up(500 * 25 * 15000 / 10000) = 18750."
            - "S.balance_cents == 78125."

      - name: ifta_per_jurisdiction_round_then_sum_order
        grounds:
          - calculations.ifta_tax
          - entities.IFTAQuarter.fields.total_tax_cents
          - entities.FuelCardTransaction.fields.jurisdiction
          - entities.FuelCardTransaction.fields.gallons
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins per-jurisdiction round_half_up
          first, sum after — sum-then-round would diverge by 1–2 cents. This is a different mode from the
          tiered-pricing instance above (which is mode (a)).
        test_recipe:
          setup:
            - "Lessee L base_jurisdiction=CA; vehicle V vehicle_class=CLASS_8; lease LA ACTIVE; fuel card FC ACTIVE."
            - "Three fuel txns in Q1 2026: (jurisdiction=CA, gallons=10.5, amount=4000), (jurisdiction=TX, gallons=7.3, amount=2800), (jurisdiction=NY, gallons=5.1, amount=2100)."
            - "Open IFTAQuarter Q for L (year=2026, quarter=1). Advance clock to 2026-04-01T00:00:00."
          trigger:
            - "POST /ifta-quarters/Q/prepare."
          assert:
            - "Per-jurisdiction tax_owed: round_half_up(10.5 * 87)=914, round_half_up(7.3 * 20)=146, round_half_up(5.1 * 45)=230; sum = 1290 cents."
            - "tax_credit = round_half_up((10.5 + 7.3 + 5.1) * 87) = round_half_up(22.9 * 87) = round_half_up(1992.3) = 1992 cents."
            - "Q.total_taxable_gallons == 22.9 and Q.total_tax_cents == 1290 - 1992 == -702 (refund)."
            - "Sum-then-round of un-rounded per-j amounts (914.5 + 146.0 + 229.5 = 1290.0 rounded to 1290) would differ from the pinned per-jurisdiction order only when fractional cents accumulate; the scaffold disallows it regardless."

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: collision_claim_revision_cycle
        grounds:
          - state_machines.CollisionClaim.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.CollisionClaim.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.CollisionClaim.fields.revision_round
        distinguishing_aspect: |
          Cyclic shape: UNDER_REVIEW → REVISION_REQUESTED → UNDER_REVIEW; revision_round counts the
          loops and is bounded by MAX_REVISION_ROUNDS. The cycle lives entirely on the CollisionClaim entity.
        test_recipe:
          setup:
            - "Lessee L, vehicle V, lease LA ACTIVE."
            - "POST collision claim CA with estimate_cents=100000."
            - "POST /collision-claims/CA/start-review."
          trigger:
            - "Loop: POST /collision-claims/CA/request-revision (round 1), PATCH /collision-claims/CA {revised_estimate_cents: 80000, version: vN} (back to UNDER_REVIEW), POST /collision-claims/CA/request-revision (round 2), PATCH again."
          assert:
            - "After first cycle: CA.claim_status == UNDER_REVIEW, CA.revision_round == 1."
            - "After second cycle: CA.claim_status == UNDER_REVIEW, CA.revision_round == 2."
            - "Third POST /collision-claims/CA/request-revision returns ERR_REVISION_LIMIT_REACHED (MAX_REVISION_ROUNDS = 2)."

      - name: lease_agreement_compound_with_default_branch
        grounds:
          - state_machines.LeaseAgreement.ACTIVE_to_IN_RETURN
          - state_machines.LeaseAgreement.ACTIVE_to_DEFAULTED
          - state_machines.LeaseAgreement.IN_RETURN_to_CLOSED
          - entities.LeaseAgreement.fields.lease_state
        distinguishing_aspect: |
          Branching fork-join on a DIFFERENT entity than CollisionClaim: ACTIVE forks to either IN_RETURN
          (normal return path) or DEFAULTED (cascade from Lessee suspension), with distinct side-effect
          sets per branch (begin-return generates a DRAFT settlement and flips vehicle IN_SHOP; DEFAULTED
          grounds vehicle and BLOCKs fuel cards).
        test_recipe:
          setup:
            - "Two lessees: L1 with normal return path; L2 will accumulate a large balance (collision approve $5000 deductible)."
            - "Each gets vehicle V1/V2 + lease LA1/LA2 ACTIVE."
          trigger:
            - "L1 path: POST /lease-agreements/LA1/begin-return."
            - "L2 path: collision approve (boosts outstanding_balance_cents above DEFAULT_THRESHOLD_CENTS), then POST /lessees/L2/suspend."
          assert:
            - "LA1.lease_state == IN_RETURN AND V1.vehicle_status == IN_SHOP AND a DRAFT OverageSettlement was generated."
            - "LA2.lease_state == DEFAULTED AND V2.vehicle_status == GROUNDED AND all FuelCards under LA2 have card_status == BLOCKED."
            - "The two branches produce different side-effect sets from the same ACTIVE starting state."

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspend_to_default_to_block_cards
        grounds:
          - state_machines.Lessee.ACTIVE_to_SUSPENDED
          - state_machines.LeaseAgreement.ACTIVE_to_DEFAULTED
          - entities.FuelCard.fields.card_status
        distinguishing_aspect: |
          Depth-3 chain triggered by lessee suspension: Lessee.suspend → LeaseAgreement.DEFAULTED → FuelCard.BLOCKED.
          Each link is caused by the previous link, not by the original action.
        test_recipe:
          setup:
            - "Lessee L (ACTIVE), vehicle V, lease LA (ACTIVE), fuel card FC under LA (ACTIVE)."
            - "Accumulate outstanding_balance_cents >= DEFAULT_THRESHOLD_CENTS via collision approval."
          trigger:
            - "POST /lessees/L/suspend."
          assert:
            - "Hop 1: L.account_status == SUSPENDED."
            - "Hop 2: LA.lease_state == DEFAULTED (caused by L flipping SUSPENDED above threshold)."
            - "Hop 3: FC.card_status == BLOCKED (caused by LA flipping to DEFAULTED)."

      - name: ifta_file_to_txn_locked_to_balance_immutable
        grounds:
          - state_machines.IFTAQuarter.READY_to_CLOSED
          - entities.FuelCardTransaction.fields.txn_status
          - entities.IFTAQuarter.fields.filing_status
        distinguishing_aspect: |
          Depth-2+ chain triggered by IFTA filing (a DIFFERENT trigger from the suspension cascade above):
          IFTAQuarter.file → eligible POSTED txns flip to IFTA_INCLUDED → subsequent attempts to post new
          txns inside the closed window are rejected. The trigger and the propagated targets differ from
          the suspension chain.
        test_recipe:
          setup:
            - "Lessee L base_jurisdiction=CA, vehicle V class=CLASS_8, lease LA ACTIVE, fuel card FC ACTIVE."
            - "Post two POSTED txns in Q1 2026 (CA gallons=10, TX gallons=5)."
            - "Open IFTAQuarter Q. Advance clock past quarter end. POST /ifta-quarters/Q/prepare."
          trigger:
            - "POST /ifta-quarters/Q/file."
            - "Attempt POST /fuel-card-transactions for an extra Q1-dated txn."
          assert:
            - "Hop 1: Q.filing_status == CLOSED."
            - "Hop 2: Both pre-existing POSTED ifta_eligible txns now have txn_status == IFTA_INCLUDED."
            - "Hop 3: The new Q1-dated POST returns 409 ERR_QUARTER_CLOSED."

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_card_limit
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CARD_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_fiscal (priority 13). Posting a fuel txn to a CLOSED card
          AND with an amount that would exceed monthly_limit_cents — state check at priority 6 wins
          over the fiscal check at priority 13.
        test_recipe:
          setup:
            - "Lessee L ACTIVE, vehicle V, lease LA ACTIVE, fuel card FC monthly_limit_cents=100000."
            - "Close LA via begin-return + finalize-return so FC.card_status == CLOSED."
          trigger:
            - "POST /fuel-card-transactions {fuel_card_id: FC, amount_cents: 200000, gallons: 50, jurisdiction: CA, posted_at: now}."
          assert:
            - "Response status == 409 and error_id == ERR_CARD_INACTIVE (state-level fails first, NOT ERR_CARD_LIMIT_EXCEEDED)."
            - "Demonstrates state-priority precedence over business_fiscal."

      - name: business_safety_vs_business_referential_for_return
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_OPEN_COLLISION_BLOCKS_RETURN]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DIFFERENT pair from above: business_safety (priority 9) vs state (priority 6).
          When begin-return is called on a lease that is already CLOSED (state-fail) AND also has open
          collisions (safety-fail), the state check at priority 6 wins; the safety error is not raised.
          This pair (state vs business_safety) is distinct from (state vs business_fiscal) above.
        test_recipe:
          setup:
            - "Lessee L, vehicle V, lease LA. Activate LA. File a collision claim CA (still FILED, so collision_open_count=1)."
            - "Use an admin call sequence: begin-return, finalize-return is blocked by collision. Instead, force a state mismatch: try begin-return twice — second call hits LA.lease_state == IN_RETURN."
          trigger:
            - "POST /lease-agreements/LA/begin-return a second time (LA is already IN_RETURN)."
          assert:
            - "Response error_id == ERR_INVALID_STATE (state check wins at priority 6), NOT ERR_OPEN_COLLISION_BLOCKS_RETURN (business_safety at priority 9)."
            - "Different error-category pair from the (state vs business_fiscal) case above."

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: card_limit_equal_boundary
        grounds:
          - validations[priority=13]
          - errors[ERR_CARD_LIMIT_EXCEEDED]
          - entities.FuelCard.fields.monthly_limit_cents
        distinguishing_aspect: |
          Numeric threshold at the equal boundary (<= allowed, > rejected): one fuel txn whose amount makes
          current_period_spend_cents EXACTLY equal monthly_limit_cents must succeed; one cent more must fail.
          Endpoint: POST /fuel-card-transactions.
        test_recipe:
          setup:
            - "Lessee L ACTIVE, vehicle V, lease LA ACTIVE, fuel card FC monthly_limit_cents=100000, current_period_spend_cents=0."
            - "Clock at 2026-03-15T00:00:00."
          trigger:
            - "POST /fuel-card-transactions amount_cents=100000 (exactly at the cap)."
            - "Then POST /fuel-card-transactions amount_cents=1 (one cent over)."
          assert:
            - "First call: 201; FC.current_period_spend_cents == 100000."
            - "Second call: 422 ERR_CARD_LIMIT_EXCEEDED (boundary is <= allowed, strictly > rejected)."

      - name: actual_cents_zero_boundary
        grounds:
          - validations[priority=17]
          - errors[ERR_ACTUAL_COST_REQUIRED]
          - entities.MaintenanceTicket.fields.actual_cents
        distinguishing_aspect: |
          Zero-quantity boundary on a DIFFERENT metric (actual_cents) and a DIFFERENT endpoint
          (POST /maintenance-tickets/{id}/close): actual_cents == 0 is rejected, actual_cents == 1 succeeds.
        test_recipe:
          setup:
            - "Lessee, vehicle, lease ACTIVE."
            - "POST maintenance ticket; start it (status IN_SHOP)."
          trigger:
            - "POST /maintenance-tickets/{id}/close {actual_cents: 0}."
            - "POST /maintenance-tickets/{id}/close {actual_cents: 1} after creating a fresh ticket."
          assert:
            - "First call: 422 ERR_ACTUAL_COST_REQUIRED (zero quantity rejected, > 0 required)."
            - "Second call: 200, ticket CLOSED with actual_cents=1."

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_active_requires_vehicle_available
        grounds:
          - state_machines.LeaseAgreement.DRAFT_to_ACTIVE
          - entities.Vehicle.fields.vehicle_status
          - errors[ERR_VEHICLE_ALREADY_ALLOCATED]
        distinguishing_aspect: |
          Entity pair: LeaseAgreement → Vehicle. LeaseAgreement.activate requires Vehicle.vehicle_status == AVAILABLE.
        test_recipe:
          setup:
            - "Vehicle V; lease LA1 ACTIVE (V.vehicle_status==ALLOCATED, current_lease_id=LA1)."
            - "Second draft lease LA2 referencing the same V."
          trigger:
            - "POST /lease-agreements/LA2/activate."
          assert:
            - "Response 409 with error_id == ERR_VEHICLE_ALREADY_ALLOCATED."
            - "LA2.lease_state remains DRAFT."

      - name: settlement_dispute_requires_lessee_active
        grounds:
          - state_machines.OverageSettlement.FINAL_to_DISPUTED
          - state_machines.Lessee.ACTIVE_to_SUSPENDED
          - entities.Lessee.fields.account_status
        distinguishing_aspect: |
          DIFFERENT entity pair: OverageSettlement → Lessee. A dispute requires the LeaseAgreement to be
          in {ACTIVE, IN_RETURN}, which is itself dependent on Lessee.account_status not being SUSPENDED
          driving lease to DEFAULTED. The pair (OverageSettlement, Lessee) is different from (LeaseAgreement, Vehicle).
        test_recipe:
          setup:
            - "Lessee L, vehicle V, lease LA ACTIVE; OverageSettlement S finalized (FINAL)."
            - "Push L.outstanding_balance_cents >= DEFAULT_THRESHOLD_CENTS via collision approval; POST /lessees/L/suspend."
          trigger:
            - "POST /overage-settlements/S/dispute (X-User-Role=Lessee, X-User-ID=L)."
          assert:
            - "Response 409 with error_id == ERR_INVALID_STATE (LA.lease_state == DEFAULTED, dispute requires ACTIVE/IN_RETURN)."

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_period_month_collision
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_SETTLEMENT_PERIOD]
          - entities.OverageSettlement.fields.period_year
          - entities.OverageSettlement.fields.period_month
        distinguishing_aspect: |
          Interval semantics: closed-month buckets keyed by (year, month). Two settlements for the same
          lease at the same (year, month) bucket collide — strict equality on the bucket key. Resource: OverageSettlement.
        test_recipe:
          setup:
            - "Lessee L, vehicle V, lease LA ACTIVE."
            - "POST /overage-settlements {lease_agreement_id: LA, period_year:2026, period_month:3} -> S1 (DRAFT)."
          trigger:
            - "POST /overage-settlements {lease_agreement_id: LA, period_year:2026, period_month:3} a second time."
          assert:
            - "Response 409 with error_id == ERR_DUPLICATE_SETTLEMENT_PERIOD."
            - "S1 remains the only row for that bucket."

      - name: fuel_txn_in_closed_quarter_window
        grounds:
          - validations[priority=11]
          - errors[ERR_QUARTER_CLOSED]
          - state_machines.IFTAQuarter.READY_to_CLOSED
          - entities.FuelCardTransaction.fields.posted_at
        distinguishing_aspect: |
          DIFFERENT interval semantics — a half-open [Q1_start, Q1_end] inclusive window on the IFTAQuarter
          resource that, once CLOSED, rejects any new POSTED txn whose posted_at falls inside it.
          The geometric treatment (half-open quarter window vs equality on (year,month) bucket) differs;
          resource is FuelCardTransaction (different entity than OverageSettlement above).
        test_recipe:
          setup:
            - "Lessee L, vehicle V CLASS_8, lease LA ACTIVE, fuel card FC ACTIVE."
            - "Open IFTAQuarter Q for L (2026 Q1). Advance clock to 2026-04-02 to satisfy quarter_end_date."
            - "POST /ifta-quarters/Q/prepare, then POST /ifta-quarters/Q/file."
          trigger:
            - "POST /fuel-card-transactions with posted_at=2026-02-15T12:00:00 (inside the closed Q1 window)."
          assert:
            - "Response 409 with error_id == ERR_QUARTER_CLOSED."
            - "POST /fuel-card-transactions with posted_at=2026-04-15T12:00:00 (outside Q1 window) succeeds with 201."

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: outstanding_balance_invariant_dispute_then_paid_excluded
        grounds:
          - state_machines.OverageSettlement.FINAL_to_PAID
          - state_machines.CollisionClaim.UNDER_REVIEW_to_APPROVED
          - entities.Lessee.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity #1: Lessee.outstanding_balance_cents. Approving a collision deductible D
          increments the balance by D; marking the resulting settlement PAID decrements by exactly D.
          The pair (approve + mark-paid) on the same amount leaves the balance unchanged from its pre-approve value.
        test_recipe:
          setup:
            - "Lessee L starting outstanding_balance_cents=0, vehicle, lease LA ACTIVE."
            - "Capture B0 = L.outstanding_balance_cents (== 0)."
          trigger:
            - "File and approve a collision claim with raw deductible D = 120000 cents (estimate=120000, no revision, fault_code present)."
            - "Create an OverageSettlement S with provisional_balance_cents=120000 (one-off scenario, by aligning miles), finalize it (balance_cents=120000), POST /overage-settlements/S/mark-paid."
          assert:
            - "After approve: L.outstanding_balance_cents == B0 + 120000."
            - "After mark-paid: L.outstanding_balance_cents == B0 + 120000 + 0 - 120000 == B0."
            - "Named invariant: outstanding_balance_cents_after = outstanding_balance_cents_before + collision.lessee_deductible_cents - settlement.balance_cents == B0."

      - name: vehicle_lease_link_invariant_activate_finalize
        grounds:
          - state_machines.LeaseAgreement.DRAFT_to_ACTIVE
          - state_machines.LeaseAgreement.IN_RETURN_to_CLOSED
          - entities.Vehicle.fields.current_lease_id
          - entities.Vehicle.fields.vehicle_status
        distinguishing_aspect: |
          Conserved quantity #2: the (Vehicle.current_lease_id, Vehicle.vehicle_status) pair. DIFFERENT
          type of conserved quantity from a money balance — it is a relational link, conserved by the
          pair (activate, finalize-return) that returns the vehicle to (null, AVAILABLE).
        test_recipe:
          setup:
            - "Vehicle V created AVAILABLE with current_lease_id=null. Lessee L. Lease LA DRAFT."
            - "Capture (V.current_lease_id, V.vehicle_status) == (null, 'AVAILABLE')."
          trigger:
            - "POST /lease-agreements/LA/activate."
            - "POST /lease-agreements/LA/begin-return."
            - "Close any open tickets, settle outstanding overage rows."
            - "POST /lease-agreements/LA/finalize-return."
          assert:
            - "After activate: (V.current_lease_id, V.vehicle_status) == (LA.id, 'ALLOCATED')."
            - "After finalize-return: (V.current_lease_id, V.vehicle_status) == (null, 'AVAILABLE')."
            - "Pinned invariant: the pair returns to its initial value exactly — no drift, no orphan link, no stuck IN_SHOP state."
