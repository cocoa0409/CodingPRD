      - name: suspended_distributor_cannot_open_a_new_batch_or_countersign
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - endpoints[POST /purchase-batches/{batch_id}/settle-recovery]
          - entities.Distributor.status
        distinguishing_aspect: |
          A written-off recovery suspends the distributor, and suspension then
          blocks exactly three write paths: opening a new batch, countersigning a
          letter, and requesting a new recovery. Everything else the distributor
          already had open keeps working — lines still land in a batch that was
          already RECEIVED and audit-markup still runs — so a blanket "suspended
          distributors are read-only" implementation fails this.
