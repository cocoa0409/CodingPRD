      - name: withdrawn_label_is_locked_and_blocks_deposit_initiation
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.BeverageProduct.terminal_states
          - errors[ERR_INVALID_REGISTRATION_STATE]
          - errors[ERR_PRODUCT_NOT_REGISTERED]
          - validations[priority=22]
        distinguishing_aspect: "WITHDRAWN accepts no registration action at all — not SUBMIT, not SUSPEND, not a second WITHDRAW — and a deposit initiation against it fails the separate priority-22 registration check with ERR_PRODUCT_NOT_REGISTERED."
        test_recipe:
          setup:
            - "OPEN ProgramPeriod 2026Q3; one label taken DRAFT -> SUBMITTED -> REGISTERED -> WITHDRAWN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
