# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests (task 1824)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Difficulty-covered corners are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: c_term_create_missing_required_field
        claim_type: required_fields
        grounds: ["entities.WorkloadTerm.fields.start_date", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /workload-terms without required start_date is rejected 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_VALIDATION (http 400); no WorkloadTerm is persisted"

      - name: c_term_defaults_applied
        claim_type: defaults
        grounds: ["entities.WorkloadTerm.fields.lecture_multiplier", "entities.WorkloadTerm.fields.union_max_overload_credits"]
        distinguishing_aspect: "Omitting every optional policy field applies the documented defaults (lecture_multiplier 1.0, lab 0.75, seminar 1.25, online premium 0.5, threshold 40, bonus 1.0, comp rate 150000, union cap 6, notice 14, stipend 100000, flat release 80000, base_teaching_credits 12)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id", t_lecture: "$.data.lecture_multiplier", t_cap: "$.data.union_max_overload_credits", t_base: "$.data.base_teaching_credits", t_status: "$.data.status" } }
          assert:
            - "WorkloadTerm.${t_id}.lecture_multiplier == 1.0 and union_max_overload_credits == 6 and base_teaching_credits == 12"
            - "WorkloadTerm.${t_id}.status == DRAFT and comp_budget_spent_cents == 0"

      - name: c_faculty_create_with_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.FacultyMember"]
        distinguishing_aspect: "Client-supplied id is ignored; server mints its own UUID and version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /faculty-members", payload: { id: "11111111-1111-1111-1111-111111111111", full_name: "Anna Aho", email: "anna@x.edu", rank: "LECTURER", base_salary_cents: 7000000 }, as: DepartmentChair, captures: { f_id: "$.data.id", f_v: "$.data.version" } }
          assert:
            - "FacultyMember.${f_id}.id != 11111111-1111-1111-1111-111111111111 (server-minted)"
            - "FacultyMember.${f_id}.version == 1 and status == ACTIVE and is_union_covered == true (default)"

      - name: c_assignment_create_with_credit_units_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Assignment.fields.credit_units"]
        distinguishing_aspect: "Client-supplied credit_units is ignored; the server computes 3.0 from the formula."
        test_recipe:
          setup: ["Term OPEN; CS-301; Anna qualified; S1 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
          trigger:
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}", credit_units: 99 }, as: DepartmentChair, captures: { a1_id: "$.data.id", a1_cr: "$.data.credit_units" } }
          assert:
            - "Assignment.${a1_id}.credit_units == 3.0 (computed 3.0 x lecture_multiplier 1.0; input 99 ignored)"

      - name: c_term_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TERM_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown termId returns 404 ERR_TERM_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /workload-terms/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_TERM_NOT_FOUND (http 404)"]

      - name: c_faculty_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FACULTY_NOT_FOUND]"]
        distinguishing_aspect: "Unknown facultyId -> 404 ERR_FACULTY_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /faculty-members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_FACULTY_NOT_FOUND (http 404)"]

      - name: c_course_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_COURSE_NOT_FOUND]"]
        distinguishing_aspect: "Unknown courseId -> 404 ERR_COURSE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /courses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_COURSE_NOT_FOUND (http 404)"]

      - name: c_qualification_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_QUALIFICATION_NOT_FOUND]"]
        distinguishing_aspect: "Unknown qualificationId -> 404 ERR_QUALIFICATION_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /qualifications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_QUALIFICATION_NOT_FOUND (http 404)"]

      - name: c_section_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SECTION_NOT_FOUND]"]
        distinguishing_aspect: "Unknown sectionId -> 404 ERR_SECTION_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /course-sections/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_SECTION_NOT_FOUND (http 404)"]

      - name: c_assignment_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ASSIGNMENT_NOT_FOUND]"]
        distinguishing_aspect: "Unknown assignmentId -> 404 ERR_ASSIGNMENT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /assignments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_ASSIGNMENT_NOT_FOUND (http 404)"]

      - name: c_grant_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_GRANT_NOT_FOUND]"]
        distinguishing_aspect: "Unknown grantId -> 404 ERR_GRANT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /release-time-grants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_GRANT_NOT_FOUND (http 404)"]

      - name: c_overload_request_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_OVERLOAD_REQUEST_NOT_FOUND]"]
        distinguishing_aspect: "Unknown requestId -> 404 ERR_OVERLOAD_REQUEST_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /overload-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_OVERLOAD_REQUEST_NOT_FOUND (http 404)"]

      - name: c_load_sheet_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LOAD_SHEET_NOT_FOUND]"]
        distinguishing_aspect: "Unknown loadSheetId -> 404 ERR_LOAD_SHEET_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /load-sheets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DepartmentChair, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_LOAD_SHEET_NOT_FOUND (http 404)"]

      - name: c_body_fk_existence_left_to_right
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", "errors[ERR_TERM_NOT_FOUND]", "errors[ERR_FACULTY_NOT_FOUND]"]
        distinguishing_aspect: "Body FKs are validated in declared input order: bogus term_id masks a bogus faculty_id (ERR_TERM_NOT_FOUND first); with a valid term, the bogus faculty_id surfaces ERR_FACULTY_NOT_FOUND."
        test_recipe:
          setup: ["one term exists"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /release-time-grants", payload: { term_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", faculty_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", grant_type: "SABBATICAL", credits_released: 1, start_date: "2026-08-24", end_date: "2026-12-11" }, as: DepartmentChair, captures: { err1: "$.data.error_id" } }
            - { call: "POST /release-time-grants", payload: { term_id: "${t_id}", faculty_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", grant_type: "SABBATICAL", credits_released: 1, start_date: "2026-08-24", end_date: "2026-12-11" }, as: DepartmentChair, captures: { err2: "$.data.error_id" } }
          assert:
            - "First call: ${err1} == ERR_TERM_NOT_FOUND (term validated before faculty)"
            - "Second call: ${err2} == ERR_FACULTY_NOT_FOUND"

      - name: c_sections_list_pagination_and_filter
        claim_type: listing
        grounds: ["endpoints[GET /course-sections]", "response_envelope"]
        distinguishing_aspect: "limit/offset paginate with total_count and has_more; status filter narrows the result set."
        test_recipe:
          setup: ["Term OPEN; CS-301; three sections 01/02/03 (01 SCHEDULED, 02/03 still PROPOSED)"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "IN_PERSON", meeting_day: "TUE", start_minute: 540, end_minute: 600 }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "03", modality: "IN_PERSON", meeting_day: "WED", start_minute: 540, end_minute: 600 }, as: DepartmentChair }
          trigger:
            - { call: "GET /course-sections", payload: { term_id: "${t_id}", limit: 2, offset: 0 }, as: DepartmentChair }
            - { call: "GET /course-sections", payload: { term_id: "${t_id}", status: "SCHEDULED" }, as: DepartmentChair, captures: { first_status: "$.data[0].status" } }
          assert:
            - "First GET: data array length == 2, total_count == 3, has_more == true"
            - "Second GET: total_count == 1 and every returned row has status == SCHEDULED (${first_status} == SCHEDULED)"

      - name: c_loadsheet_auto_created_on_first_assignment
        claim_type: creation
        grounds: ["entities.LoadSheet", "endpoints[POST /assignments]"]
        distinguishing_aspect: "No create endpoint exists for LoadSheet; the first assignment for (term, faculty) materializes exactly one row carrying the provisional credit."
        test_recipe:
          setup: ["Term OPEN; CS-301; Anna qualified; S1 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "GET /load-sheets", payload: { term_id: "${t_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { sheet_teaching: "$.data[0].teaching_credits", sheet_obligation: "$.data[0].effective_obligation_credits" } }
          assert:
            - "GET /load-sheets?term_id&faculty_id returns exactly 1 row"
            - "row.teaching_credits == 3.0 and effective_obligation_credits == 12.0 and overload_credits == 0.0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_term_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.WorkloadTerm"]
        distinguishing_aspect: "A newly created term starts in DRAFT with comp_budget_spent_cents 0 and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_status: "$.data.status", t_v: "$.data.version", t_spent: "$.data.comp_budget_spent_cents" } }
          assert:
            - "status == DRAFT; version == 1; comp_budget_spent_cents == 0"

      - name: c_term_invalid_transition_draft_to_published
        claim_type: invalid_transition
        grounds: ["state_machines.WorkloadTerm", "errors[ERR_INVALID_TERM_STATE]"]
        distinguishing_aspect: "PUBLISHED is only reachable from LOCKED; DRAFT -> PUBLISHED is rejected and the term stays DRAFT."
        test_recipe:
          setup: ["one DRAFT term"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "PUBLISHED" }, as: DepartmentChair, captures: { err: "$.data.error_id" } }
            - { call: "GET /workload-terms/${t_id}", as: DepartmentChair, captures: { t_status: "$.data.status" } }
          assert:
            - "${err} == ERR_INVALID_TERM_STATE (http 409)"
            - "WorkloadTerm.${t_id}.status == DRAFT (unchanged)"

      - name: c_term_publish_lockdown_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.WorkloadTerm", "errors[ERR_INVALID_TERM_STATE]"]
        distinguishing_aspect: "PUBLISHED is terminal: further lifecycle transitions and policy PATCHes are both rejected."
        test_recipe:
          setup: ["Term with zero sections driven DRAFT -> OPEN -> LOCKED -> PUBLISHED (publish preconditions vacuously satisfied)"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "LOCKED" }, as: DepartmentChair }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "PUBLISHED" }, as: DepartmentChair, captures: { t_pub_v: "$.data.version", t_pub_status: "$.data.status" } }
          trigger:
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "LOCKED" }, as: DepartmentChair, captures: { err1: "$.data.error_id" } }
            - { call: "PATCH /workload-terms/${t_id}", payload: { expected_term_version: "${t_pub_v}", lab_multiplier: 0.5 }, as: DepartmentChair, captures: { err2: "$.data.error_id" } }
          assert:
            - "Publish succeeded from LOCKED: ${t_pub_status} == PUBLISHED"
            - "Transition attempt: ${err1} == ERR_INVALID_TERM_STATE"
            - "Policy edit attempt: ${err2} == ERR_INVALID_TERM_STATE (PATCH allowed only while DRAFT)"

      - name: c_assignment_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Assignment", "errors[ERR_INVALID_ASSIGNMENT_TRANSITION]"]
        distinguishing_aspect: "DECLINED is terminal: a later CONFIRMED attempt is rejected and the assignment stays DECLINED."
        test_recipe:
          setup: ["Term OPEN; CS-301; Anna qualified; S1 SCHEDULED; A1 PROPOSED then DECLINED by Anna"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f1_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "DECLINED" }, as: FacultyMember, as_user_id: "${f1_id}" }
          trigger:
            - { call: "POST /assignments/${a1_id}/transition", payload: { to_state: "CONFIRMED" }, as: FacultyMember, as_user_id: "${f1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_ASSIGNMENT_TRANSITION (http 409); Assignment.${a1_id} remains DECLINED"

      - name: c_faculty_separated_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FacultyMember", "errors[ERR_INVALID_FACULTY_STATE]"]
        distinguishing_aspect: "SEPARATED is terminal: PATCH back to ACTIVE is rejected."
        test_recipe:
          setup: ["Faculty Anna ACTIVE, no assignments"]
          setup_api_calls:
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "LECTURER", base_salary_cents: 7000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
