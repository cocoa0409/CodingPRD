              as_user_id: "u_ops_1"
              captures: { acc2_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${pw_id}", account_id: "${acc1_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 600000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${pw_id}"
              captures: { rw1_id: $.data.id }
            - call: "POST /deal-registrations/${rw1_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pw_id}"
            - call: "POST /deal-registrations/${rw1_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
