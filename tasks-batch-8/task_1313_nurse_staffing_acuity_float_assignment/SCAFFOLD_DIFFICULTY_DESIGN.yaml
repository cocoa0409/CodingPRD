          Error-category pair (business_safety vs business_fiscal): the shift is ADEQUATE (offers
          forbidden as a safety/staffing-integrity rule) AND the 36000-cent reserve exceeds the
          30000-cent budget; priority 7 ERR_SHIFT_ADEQUATELY_STAFFED must win over priority 10
          ERR_INCENTIVE_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "ICU unit with incentive_budget_cents 30000; DAY shift required 2 with two ACCEPTED assignments (one charge) -> ADEQUATE"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU H", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 30000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "H One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "H Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n2: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { sh_v2: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
