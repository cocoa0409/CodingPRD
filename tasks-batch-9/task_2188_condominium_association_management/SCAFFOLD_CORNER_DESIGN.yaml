              payload: { association_id: "${assoc}", subject_type: "VENDOR_CONTRACT", subject_id: "${contract1}", choice: "YES", voter_owner_id: "${dir1}", meeting_id: "${meeting2}" }
            - call: "POST /vendor-contracts/${contract1}/approve"
              as: BoardDirector
