# SCAFFOLD.yaml - seed tables for task_3249_gamified_learning_streaks_placement_testing_subscription_conversion
# Sections 1.0-1.7. The 1.8 Test Targeting Index lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and the
# 1.9 Coverage Index lives in SCAFFOLD_CORNER_DESIGN.yaml; neither key appears in this file.
# Logical clock: the server default time is 2026-09-01T00:00:00Z (see POST /_clock/set_current_utc).

scenario: |
  Gamified Learning Streaks, Placement Testing & Subscription Conversion (Duolingo):
  course progression with lesson trees, skill decay and review scheduling, streak
  mechanics with freezes, repair purchases and time zone handling, placement testing
  to skip content with calibration against course units, heart and energy limits
  gating practice for free users with subscription removal of limits, leaderboard
  leagues with promotion and demotion and cheating detection, notification cadence
  tuned against engagement without triggering uninstalls, subscription conversion
  offers timed to engagement milestones with family plan sharing, certification test
  products with proctoring and score reporting to institutions
domain_name: "duolingo-gamified-learning"
api_prefix: ""
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: "Graph constraint"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Derived field reconciliation"
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Learner
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "learner-visible profile name"
      - name: timezone_id
        type: string
        source: input
        description: "IANA time zone id used to anchor the streak day boundary"
      - name: program_tier
        type: enum
        source: input
        description: "billing tier attached to the learner; drives heart/energy limits"
        constraints: "one of FREE | PLUS_FAMILY | CERTIFICATION_ELITE"
      - name: streak_anchor_date
        type: datetime
        source: computed
        description: "local-calendar date (00:00:00Z-normalized) of the learner's current streak day, derived from timezone_id"
      - name: xp_total
        type: integer
        source: computed
        description: "lifetime experience points, recomputed on every practice attempt and league settlement"
      - name: gems_balance
        type: integer
        source: computed
        description: "gem currency starting at 0, credited by the support grant endpoint and debited by streak repair"
      - name: leaf_count
        type: integer
        source: computed
        description: "derived count of LessonNode rows in this unit whose state is BRONZE, SILVER, GOLD or LEGENDARY"
      - name: hearts_available
        type: integer
        source: computed
        description: "remaining failed-attempt allowance in the current streak day window"
      - name: energy_units
        type: integer
        source: computed
        description: "accrued practice energy units, starting at ENERGY_START_UNITS, debited one unit per accepted attempt and regenerated on a time interval"
      - name: energy_anchor_at
        type: datetime
        source: computed
        description: "timestamp at which energy_units was last computed; start of the current regeneration accrual interval"
  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> Learner.id; owner of this subscription record"
      - name: plan_code
        type: enum
        source: input
        description: "subscribed plan; determines seat quota and limit removal"
        constraints: "one of FREE | PLUS_FAMILY | CERTIFICATION_ELITE"
      - name: seats_total
        type: integer
        source: input
        description: "family-plan seat quota; FREE and single-seat plans carry 1"
      - name: seats_used
        type: integer
        source: computed
        description: "count of FamilyMembership rows in INVITED or ACTIVE status"
      - name: status
        type: enum
        source: computed
        description: "billing lifecycle state"
        constraints: "one of FREE | ACTIVE | IN_GRACE | EXPIRED"
      - name: current_period_end
        type: datetime
        source: computed
        description: "end of the paid period; grace window starts here"
      - name: auto_renew
        type: boolean
        source: input
        description: "whether the period rolls forward at current_period_end"
      - name: limits_removed
        type: boolean
        source: computed
        description: "true only when status is ACTIVE and plan_code is not FREE"
  - name: FamilyMembership
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; family plan the seat belongs to"
      - name: member_learner_id
        type: string
        source: input
        description: "FK -> Learner.id; learner occupying the seat"
      - name: seat_role
        type: enum
        source: input
        description: "seat role within the family plan"
        constraints: "one of OWNER | MEMBER"
      - name: status
        type: enum
        source: computed
        description: "seat lifecycle state"
        constraints: "one of INVITED | ACTIVE | REMOVED"
      - name: invited_at
        type: datetime
        source: computed
        description: "timestamp the seat invitation was minted"
  - name: CourseUnit
    parent: null
    common_fields: false
    fields:
      - name: unit_index
        type: integer
        source: input
        description: "monotonic position of the unit inside the course tree; index 1 is the first unit"
      - name: title
        type: string
        source: input
        description: "unit display title"
      - name: cefr_band
        type: enum
        source: input
        description: "difficulty band of the unit"
        constraints: "one of A1 | A2 | B1 | B2 | C1"
      - name: unlock_index
        type: integer
        source: input
        description: "minimum number of completed units required before this unit unlocks"
      - name: crown_count
        type: computed
        description: "derived count of LessonNode rows in this unit whose state is BRONZE, SILVER, GOLD or LEGENDARY"
      - name: total_nodes
        type: integer
        source: input
        description: "declared number of lesson nodes the unit contains"
  - name: LessonNode
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> CourseUnit.id; unit this node belongs to"
      - name: prerequisite_node_id
        type: string
        source: input
        description: "FK -> LessonNode.id; self-referential prerequisite edge (null for a unit's root node)"
      - name: node_index
        type: integer
        source: input
        description: "position of the node inside its unit; node 1 is the unit root"
      - name: state
        type: enum
        source: computed
        description: "crown progression state of the node"
        constraints: "one of LOCKED | UNLOCKED | BRONZE | SILVER | GOLD | LEGENDARY | DECAYED"
      - name: decay_level
        type: integer
        source: computed
        description: "accumulated decay steps applied to the node since its last review"
        constraints: "0 <= decay_level <= 4"
      - name: decay_meter
        type: integer
        source: computed
        description: "decay points accrued since last_reviewed_at; a fifth point demotes the node one crown tier"
      - name: last_reviewed_at
        type: datetime
        source: computed
        description: "timestamp of the most recent successful practice attempt on this node"
      - name: review_due_at
        type: datetime
        source: computed
        description: "timestamp at which the node next becomes due for spaced review"
  - name: PracticeAttempt
    parent: null
    common_fields: false
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> Learner.id; learner who submitted the attempt"
      - name: lesson_node_id
        type: string
        source: input
        description: "FK -> LessonNode.id; node practiced"
      - name: recorded_at
        type: datetime
        source: input
        description: "client-supplied timestamp of the practice session"
      - name: response_ms
        type: integer
        source: input
        description: "elapsed milliseconds for the attempt, used by the cheating-detection rule"
        constraints: "0 <= response_ms <= 600000"
      - name: correct
        type: boolean
        source: input
        description: "whether the attempt was answered correctly"
      - name: is_placement_attempt
        type: boolean
        source: input
        description: "true when the attempt is a placement-test item that must not consume hearts"
        default: false
      - name: outcome
        type: enum
        source: computed
        description: "terminal disposition of the attempt"
        constraints: "one of ACCEPTED | REJECTED_LIMIT | REJECTED_DECAY_CAP"
      - name: xp_awarded
        type: integer
        source: computed
        description: "experience points credited by the tiered scoring rule"
  - name: StreakState
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "learner this streak row tracks; ownership is enforced by comparing X-User-ID to this field"
      - name: current_length
        type: integer
        source: computed
        description: "consecutive qualified days ending at focus_date"
      - name: focus_date
        type: datetime
        source: computed
        description: "local-calendar date currently under evaluation, derived from Learner.timezone_id"
      - name: freeze_tokens
        type: integer
        source: computed
        description: "equipped frozen-day capacity; each token absorbs one missed day"
      - name: status
        type: enum
        source: computed
        description: "streak lifecycle state"
        constraints: "one of ALIVE | FROZEN | BROKEN | REPAIRED"
      - name: last_qualified_local_date
        type: datetime
        source: computed
        description: "local-calendar date of the most recent day that met the daily goal"
      - name: local_date_offset_days
        type: integer
        source: input
        description: "fixed offset in days between the learner's local calendar and UTC"
      - name: repair_cost_gems
        type: integer
        source: computed
        description: "gems charged for the most recent repair, computed from the tiered repair schedule"
      - name: repair_purchases_this_month
        type: integer
        source: computed
        description: "count of repair purchases inside the current calendar month"
  - name: PlacementTest
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> Learner.id; learner sitting the placement test"
      - name: course_id
        type: string
        source: input
        description: "FK -> CourseUnit.id; unit that anchors the test"
      - name: status
        type: enum
        source: computed
        description: "placement session lifecycle state"
        constraints: "one of CREATED | IN_PROGRESS | SCORED | CALIBRATED | ABANDONED | CERTIFIED"
      - name: administered_at
        type: datetime
        source: input
        description: "client-supplied timestamp at which the session was administered"
      - name: graded_at
        type: datetime
        source: computed
        description: "server timestamp of the most recent scoring mutation"
      - name: total_items
        type: integer
        source: input
        description: "number of items presented in the placement test, whether it is an institution-graded or self-serve session, and which of the two boundary anchors applies"
        constraints: "5 <= total_items <= 50; is_institution_graded is true exactly when proctor_user_id is non-empty"
      - name: comprehension_score
        type: integer
        source: input
        description: "raw items-per-minute comprehension sub-score"
      - name: accuracy_score
        type: integer
        source: input
        description: "raw response latency sub-score"
      - name: calibrated_cefr_band
        type: enum
        source: computed
        description: "placement band assigned by the combined sub-score formula"
        constraints: "one of A1 | A2 | B1 | B2 | C1"
      - name: placed_unit_index
        type: integer
        source: computed
        description: "unit index the learner is placed into; monotonic non-decreasing across calibrations"
      - name: free_probe_used
        type: boolean
        source: computed
        description: "whether the learner's one free placement probe has been consumed"
      - name: is_institution_graded
        type: boolean
        source: computed
        description: "true exactly when proctor_user_id is non-empty; selects the placement boundary anchor"
      - name: proctor_user_id
        type: string
        source: input
        description: "opaque operator id of the proctor supervising a certification-lab session"
  - name: League
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "league tier for this settlement round"
        constraints: "one of BRONZE | SILVER | GOLD | SAPPHIRE | RUBY"
      - name: week_start
        type: datetime
        source: input
        description: "Monday 00:00:00Z anchoring the scoring week"
      - name: status
        type: enum
        source: computed
        description: "settlement lifecycle state"
        constraints: "one of FORMING | ACTIVE | SETTLING | CLOSED"
      - name: member_count
        type: integer
        source: computed
        description: "number of LeagueStanding rows in GOOD_STANDING or FLAGGED standing"
      - name: promotion_cutoff_rank
        type: integer
        source: computed
        description: "rank at or below which a standing is promoted"
      - name: demotion_cutoff_rank
        type: integer
        source: computed
        description: "rank at or above which a standing is demoted"
      - name: settled_at
        type: datetime
        source: computed
        description: "timestamp the demotion sweep completed"
  - name: LeagueStanding
    parent: null
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league this standing belongs to"
      - name: learner_id
        type: string
        source: input
        description: "competing learner; ownership is enforced by comparing X-User-ID to this field"
      - name: weekly_xp
        type: integer
        source: computed
        description: "experience points accrued inside the league week window"
      - name: standing
        type: enum
        source: computed
        description: "standing eligibility state"
        constraints: "one of GOOD_STANDING | FLAGGED | PROMOTED | DEMOTED"
      - name: rank
        type: integer
        source: computed
        description: "competition rank after the weekly-XP ranking expression is applied"
      - name: flag_reason
        type: string
        source: computed
        description: "populated only when standing is FLAGGED; records the anti-cheat trigger"
      - name: settled_outcome
        type: enum
        source: computed
        description: "outcome recorded by the settlement sweep"
        constraints: "one of NONE | PROMOTED | DEMOTED | HELD"
  - name: CertificationExam
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "FK -> Learner.id; candidate sitting the exam"
      - name: product_code
        type: enum
        source: input
        description: "certification product purchased"
        constraints: "one of DET_BASIC | DET_PRO | DET_INSTITUTIONAL"
      - name: status
        type: enum
        source: computed
        description: "exam lifecycle state"
        constraints: "one of PURCHASED | PROCTORING | SUBMITTED | SCORED | REPORTED | VOID | EXPIRED"
      - name: purchased_at
        type: datetime
        source: computed
        description: "timestamp the exam product was purchased"
      - name: proctored_by_user_id
        type: string
        source: input
        description: "opaque operator id of the assigned proctor"
      - name: proctor_started_at
        type: datetime
        source: computed
        description: "timestamp the proctoring window opened"
      - name: score_band
        type: enum
        source: computed
        description: "certification band assigned by the certification scoring rule"
        constraints: "one of NOT_CERTIFIED | PASS | STRONG_PASS | DISTINCTION"
      - name: raw_score
        type: integer
        source: input
        description: "candidate's raw exam score"
      - name: report_id
        type: string
        source: computed
        description: "FK -> ScoreReport.id; institutional report generated for this exam"
      - name: expires_at
        type: datetime
        source: computed
        description: "timestamp the unreported exam lapses"
  - name: EngagementOffer
    parent: null
    common_fields: true
    fields:
      - name: learner_id
        type: string
        source: input
        description: "learner targeted by the offer; ownership is enforced by comparing X-User-ID to this field"
      - name: milestone_code
        type: enum
        source: input
        description: "engagement milestone that qualified the learner"
        constraints: "one of STREAK_7 | STREAK_30 | PLACEMENT_SKIP | LEAGUE_PROMOTION | HEART_DEPLETION"
      - name: discount_pct
        type: integer
        source: computed
        description: "computed conversion discount percentage"
      - name: status
        type: enum
        source: computed
        description: "offer lifecycle state"
        constraints: "one of ISSUED | REDEEMED | EXPIRED | SUPPRESSED"
      - name: issued_at
        type: datetime
        source: computed
        description: "timestamp the offer was minted"
      - name: expires_at
        type: datetime
        source: computed
        description: "timestamp the issue window closes"
      - name: scored_tier
        type: enum
        source: computed
        description: "tier the offer is priced at after the family-plan family share is applied"
        constraints: "one of PLUS | PLUS_FAMILY"
  - name: ScoreReport
    parent: null
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: input
        description: "FK -> CertificationExam.id; exam this report summarizes"
      - name: learner_id
        type: string
        source: input
        description: "reported candidate; the learner is reachable through the parent CertificationExam"
      - name: institution_name
        type: string
        source: input
        description: "receiving institution for the report"
      - name: institution_learner_code
        type: string
        source: input
        description: "institution-facing candidate identifier"
      - name: score_band
        type: enum
        source: computed
        description: "certification band carried into the institutional record"
        constraints: "one of NOT_CERTIFIED | PASS | STRONG_PASS | DISTINCTION"
      - name: raw_score
        type: integer
        source: computed
        description: "candidate raw score as finalized at scoring time"
      - name: reported_at
        type: datetime
        source: computed
        description: "timestamp the report was minted"
state_machines:
  - entity: CourseUnit
    initial_state: LOCKED_UNIT
    terminal_states: [COMPLETED]
    transitions:
      - from: LOCKED_UNIT
        to: AVAILABLE
        trigger: "system event: unit unlock posture recomputation"
        actor: system
        preconditions:
          - "count of CourseUnit rows in state COMPLETED whose unit_index < this.unit_index is >= this.unlock_index"
        side_effects:
          - "every LessonNode in this unit whose prerequisite_node_id is null transitions LOCKED -> UNLOCKED"
          - "recompute Learner.leaf_count for every learner holding a LessonNode in this unit"
        note: "compound machine: the unit state is derived from the crown states of its LessonNode children"
      - from: AVAILABLE
        to: IN_PROGRESS
        trigger: "POST /lesson-nodes/{id}/practice"
        actor: Learner
        preconditions:
          - "lesson_node.unit_id == this unit's id"
          - "lesson_node.state == UNLOCKED"
        side_effects:
          - "CourseUnit.state = IN_PROGRESS"
          - "LessonNode.state = BRONZE"
          - "Learner.xp_total += PracticeAttempt.xp_awarded"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system event: bubbled up when the last LessonNode child reaches BRONZE or better"
        actor: system
        preconditions:
          - "every LessonNode in this unit has state IN {BRONZE, SILVER, GOLD, LEGENDARY}"
        side_effects:
          - "every CourseUnit u2 whose unlock_index >= this.unit_index + 1 and whose preceding units are all COMPLETED transitions LOCKED_UNIT -> AVAILABLE"
          - "recompute CourseUnit.crown_count for every unit in the course"
          - "recompute Learner.leaf_count for every learner holding a LessonNode in this unit"
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "PUT /lesson-nodes/{id}/review"
        actor: Learner
        preconditions:
          - "lesson_node.unit_id == this unit's id"
          - "lesson_node.state == DECAYED"
        side_effects:
          - "CourseUnit.state = IN_PROGRESS"
          - "recompute CourseUnit.crown_count"
        note: "cycle edge: a decayed node pulls its completed unit back into in-progress until the node is restored"

  - entity: LessonNode
    initial_state: LOCKED
    terminal_states: []
    transitions:
      - from: LOCKED
        to: UNLOCKED
        trigger: "system event: prerequisite satisfaction check"
        actor: system
        preconditions:
          - "unit.state IN {AVAILABLE, IN_PROGRESS}"
          - "prerequisite_node_id is null OR prerequisite LessonNode.state IN {BRONZE, SILVER, GOLD, LEGENDARY}"
        side_effects:
          - "refresh LessonNode.updated_at"
      - from: UNLOCKED
        to: BRONZE
        trigger: "POST /lesson-nodes/{id}/practice with correct=true"
        actor: Learner
        preconditions:
          - "lesson_node.state == UNLOCKED"
          - "PracticeAttempt.outcome == ACCEPTED for this call"
        side_effects:
          - "LessonNode.last_reviewed_at = PracticeAttempt.recorded_at"
          - "LessonNode.review_due_at = PracticeAttempt.recorded_at + INTERVAL_DAYS[BRONZE]"
          - "LessonNode.decay_meter = 0"
          - "recompute Learner.leaf_count"
          - "StreakState transitions EVALUATING -> QUALIFIED for the learner's focus_date"
          - "EngagementOffer issued when the learner's StreakState.current_length reaches 7 or 30"
      - from: BRONZE
        to: SILVER
        trigger: "POST /lesson-nodes/{id}/practice with correct=true"
        actor: Learner
        preconditions:
          - "lesson_node.state == BRONZE"
          - "PracticeAttempt.outcome == ACCEPTED for this call"
        side_effects:
          - "LessonNode.last_reviewed_at = PracticeAttempt.recorded_at"
          - "LessonNode.review_due_at = PracticeAttempt.recorded_at + INTERVAL_DAYS[SILVER]"
          - "LessonNode.decay_meter = 0"
          - "recompute Learner.leaf_count"
      - from: SILVER
        to: GOLD
        trigger: "POST /lesson-nodes/{id}/practice with correct=true"
        actor: Learner
        preconditions:
          - "lesson_node.state == SILVER"
          - "PracticeAttempt.outcome == ACCEPTED for this call"
        side_effects:
          - "LessonNode.last_reviewed_at = PracticeAttempt.recorded_at"
          - "LessonNode.review_due_at = PracticeAttempt.recorded_at + INTERVAL_DAYS[GOLD]"
          - "LessonNode.decay_meter = 0"
          - "recompute Learner.leaf_count"
      - from: GOLD
        to: LEGENDARY
        trigger: "POST /lesson-nodes/{id}/practice with correct=true"
        actor: Learner
        preconditions:
          - "lesson_node.state == GOLD"
          - "Learner.program_tier IN {PLUS_FAMILY, CERTIFICATION_ELITE}"
          - "PracticeAttempt.outcome == ACCEPTED for this call"
        side_effects:
          - "LessonNode.state = LEGENDARY"
          - "LessonNode.review_due_at = PracticeAttempt.recorded_at + INTERVAL_DAYS[LEGENDARY]"
          - "recompute Learner.leaf_count"
      - from: UNLOCKED
        to: DECAYED
        trigger: "system event: skill decay sweep"
        actor: system
        preconditions:
          - "lesson_node.decay_meter >= DECAY_POINTS_PER_TIER"
          - "current clock timestamp >= lesson_node.review_due_at"
        side_effects:
          - "LessonNode.decay_level += 1"
          - "LessonNode.decay_meter = 0"
          - "recompute Learner.leaf_count"
      - from: BRONZE
        to: DECAYED
        trigger: "system event: skill decay sweep"
        actor: system
        preconditions:
          - "lesson_node.decay_meter >= DECAY_POINTS_PER_TIER"
          - "current clock timestamp >= lesson_node.review_due_at"
        side_effects:
          - "LessonNode.decay_level += 1"
          - "LessonNode.decay_meter = 0"
          - "every LessonNode n2 whose prerequisite_node_id == this node's id and whose state == UNLOCKED with no other satisfied prerequisite transitions UNLOCKED -> LOCKED"
          - "recompute Learner.leaf_count"
          - "StreakState.status = BROKEN for the learner when the decayed node was the learner's only qualified node on StreakState.focus_date"
      - from: SILVER
        to: DECAYED
        trigger: "system event: skill decay sweep"
        actor: system
        preconditions:
          - "lesson_node.decay_meter >= DECAY_POINTS_PER_TIER"
          - "current clock timestamp >= lesson_node.review_due_at"
        side_effects:
          - "LessonNode.decay_level += 1"
          - "LessonNode.decay_meter = 0"
          - "every LessonNode n2 whose prerequisite_node_id == this node's id and whose state == UNLOCKED with no other satisfied prerequisite transitions UNLOCKED -> LOCKED"
          - "recompute Learner.leaf_count"
      - from: GOLD
        to: DECAYED
        trigger: "system event: skill decay sweep"
        actor: system
        preconditions:
          - "lesson_node.decay_meter >= DECAY_POINTS_PER_TIER"
          - "current clock timestamp >= lesson_node.review_due_at"
        side_effects:
          - "LessonNode.decay_level += 1"
          - "LessonNode.decay_meter = 0"
          - "every LessonNode n2 whose prerequisite_node_id == this node's id and whose state == UNLOCKED with no other satisfied prerequisite transitions UNLOCKED -> LOCKED"
          - "recompute Learner.leaf_count"
      - from: LEGENDARY
        to: DECAYED
        trigger: "system event: skill decay sweep"
        actor: system
        preconditions:
          - "lesson_node.decay_meter >= DECAY_POINTS_PER_TIER"
          - "current clock timestamp >= lesson_node.review_due_at"
        side_effects:
          - "LessonNode.decay_level += 1"
          - "LessonNode.decay_meter = 0"
          - "recompute CourseUnit.crown_count"
          - "recompute Learner.leaf_count"
      - from: DECAYED
        to: UNLOCKED
        trigger: "PUT /lesson-nodes/{id}/review"
        actor: Learner
        preconditions:
          - "lesson_node.state == DECAYED"
          - "lesson_node.decay_level < DECAY_LEVEL_FLOOR"
        side_effects:
          - "LessonNode.state = UNLOCKED"
          - "LessonNode.decay_meter = 0"
          - "every LessonNode n2 whose prerequisite_node_id == this node's id and whose state == LOCKED and whose other prerequisites are satisfied transitions LOCKED -> UNLOCKED"
          - "PracticeAttempt for this review transitions RECORDED -> ACCEPTED"
      - from: DECAYED
        to: LOCKED
        trigger: "PUT /lesson-nodes/{id}/review"
        actor: Learner
        preconditions:
          - "lesson_node.state == DECAYED"
          - "lesson_node.decay_level == DECAY_LEVEL_FLOOR"
        side_effects:
          - "LessonNode.state = LOCKED"
          - "LessonNode.decay_meter = 0"
          - "recompute Learner.leaf_count"
          - "PracticeAttempt for this review transitions RECORDED -> REJECTED_DECAY_CAP"
        note: "retention floor: a node decayed four times cannot be re-practiced and is demoted to LOCKED"
  - entity: StreakState
    initial_state: EVALUATING
    terminal_states: []
    transitions:
      - from: EVALUATING
        to: QUALIFIED
        trigger: "POST /lesson-nodes/{id}/practice with an ACCEPTED attempt"
        actor: Learner
        preconditions:
          - "PracticeAttempt.outcome == ACCEPTED"
          - "local calendar date of PracticeAttempt.recorded_at == StreakState.focus_date"
        side_effects:
          - "StreakState.current_length += 1"
          - "StreakState.last_qualified_local_date = StreakState.focus_date"
          - "EngagementOffer issued with milestone_code STREAK_7 when current_length reaches 7"
          - "EngagementOffer issued with milestone_code STREAK_30 when current_length reaches 30"
          - "recompute Learner.xp_total"
      - from: QUALIFIED
        to: QUALIFIED
        trigger: "POST /lesson-nodes/{id}/practice with an ACCEPTED attempt"
        actor: Learner
        preconditions:
          - "StreakState.status == QUALIFIED"
          - "local calendar date of PracticeAttempt.recorded_at == StreakState.focus_date"
        side_effects:
          - "StreakState.current_length unchanged"
          - "refresh StreakState.updated_at"
        note: "the focus_date is already qualified; only the first accepted attempt of a local day extends the streak"
      - from: QUALIFIED
        to: EVALUATING
        trigger: "POST /_events/auto-transition with event_type STREAK_DAY_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "StreakState.status == QUALIFIED"
          - "StreakState.focus_date < current local calendar date"
        side_effects:
          - "StreakState.focus_date advances by 1 local day"
        note: "cycle edge: a qualified day closes into the next day's evaluation"
      - from: REPAIRED
        to: EVALUATING
        trigger: "POST /_events/auto-transition with event_type STREAK_DAY_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "StreakState.status == REPAIRED"
          - "StreakState.focus_date < current local calendar date"
        side_effects:
          - "StreakState.focus_date advances by 1 local day"
        note: "cycle edge: a repaired streak resumes daily evaluation"
      - from: FROZEN
        to: EVALUATING
        trigger: "POST /_events/auto-transition with event_type STREAK_DAY_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "StreakState.status == FROZEN"
          - "StreakState.focus_date < current local calendar date"
        side_effects:
          - "StreakState.focus_date advances by 1 local day"
        note: "cycle edge: a frozen streak resumes daily evaluation"
      - from: EVALUATING
        to: FROZEN
        trigger: "POST /_events/auto-transition with event_type STREAK_DAY_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "StreakState.freeze_tokens >= 1"
          - "no PracticeAttempt with outcome ACCEPTED exists for the learner on StreakState.focus_date"
          - "StreakState.focus_date < current local calendar date"
        side_effects:
          - "StreakState.freeze_tokens -= 1"
          - "StreakState.current_length unchanged"
          - "StreakState.focus_date advances by 1 local day"
      - from: EVALUATING
        to: BROKEN
        trigger: "POST /_events/auto-transition with event_type STREAK_DAY_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "StreakState.freeze_tokens == 0"
          - "no PracticeAttempt with outcome ACCEPTED exists for the learner on StreakState.focus_date"
          - "StreakState.focus_date < current local calendar date"
        side_effects:
          - "StreakState.current_length = 0"
          - "ComputeStreakRepairCost evaluated for the learner"
          - "EngagementOffer issued with milestone_code HEART_DEPLETION when the learner's hearts_available == 0"
          - "StreakState.focus_date advances by 1 local day"
      - from: BROKEN
        to: QUALIFIED
        trigger: "POST /lesson-nodes/{id}/practice with an ACCEPTED attempt"
        actor: Learner
        preconditions:
          - "PracticeAttempt.outcome == ACCEPTED"
          - "local calendar date of PracticeAttempt.recorded_at == StreakState.focus_date"
        side_effects:
          - "StreakState.current_length = 1"
          - "StreakState.last_qualified_local_date = StreakState.focus_date"
          - "StreakState.repair_cost_gems = 0"
          - "recompute Learner.xp_total"
      - from: BROKEN
        to: REPAIRED
        trigger: "POST /streaks/{id}/repair"
        actor: Learner
        preconditions:
          - "StreakState.status == BROKEN"
          - "Learner.gems_balance >= ComputeStreakRepairCost.purchase_debit"
          - "StreakState.repair_purchases_this_month < MONTHLY_REPAIR_CAP"
          - "clock timestamp <= StreakState.focus_date + REPAIR_WINDOW_DAYS"
        side_effects:
          - "Learner.gems_balance -= ComputeStreakRepairCost.purchase_debit"
          - "StreakState.current_length restored to the length active immediately before the break"
          - "StreakState.repair_purchases_this_month += 1"
          - "StreakState.repair_cost_gems = ComputeStreakRepairCost.purchase_debit"
          - "recompute ComputeStreakRepairCost for the learner"

  - entity: Subscription
    initial_state: FREE
    terminal_states: [EXPIRED]
    transitions:
      - from: FREE
        to: ACTIVE
        trigger: "POST /subscriptions"
        actor: Learner
        preconditions:
          - "Subscription.plan_code IN {PLUS_FAMILY, CERTIFICATION_ELITE}"
          - "no other Subscription row with the same learner_id has status ACTIVE"
        side_effects:
          - "Subscription.current_period_end = current clock timestamp + PERIOD_DAYS"
          - "recompute Subscription.limits_removed"
          - "recompute Learner.hearts_available"
          - "recompute Learner.energy_units"
          - "every FamilyMembership whose subscription_id == this subscription and whose status == INVITED transitions INVITED -> ACTIVE"
      - from: ACTIVE
        to: FREE
        trigger: "PUT /subscriptions/{id}"
        actor: Learner
        preconditions:
          - "Subscription.auto_renew == false"
          - "current clock timestamp >= Subscription.current_period_end"
        side_effects:
          - "recompute Subscription.limits_removed"
          - "every FamilyMembership whose subscription_id == this subscription and whose status == ACTIVE transitions ACTIVE -> REMOVED"
          - "recompute Learner.hearts_available for every learner whose membership was removed"
        note: "cyclic shape: a lapsed FREE subscription can be re-activated by POST /subscriptions, producing FREE -> ACTIVE -> FREE -> ACTIVE rounds"
      - from: ACTIVE
        to: IN_GRACE
        trigger: "POST /_events/auto-transition with event_type SUBSCRIPTION_RENEWAL"
        actor: PlatformAdmin
        preconditions:
          - "current clock timestamp >= Subscription.current_period_end"
          - "Subscription.auto_renew == true"
        side_effects:
          - "recompute Subscription.limits_removed"
        note: "limits remain removed while the subscription is IN_GRACE"
      - from: IN_GRACE
        to: ACTIVE
        trigger: "PUT /subscriptions/{id} with auto_renew true"
        actor: PlatformAdmin
        preconditions:
          - "Subscription.status == IN_GRACE"
        side_effects:
          - "Subscription.current_period_end = current clock timestamp + PERIOD_DAYS"
          - "recompute Subscription.limits_removed"
      - from: IN_GRACE
        to: EXPIRED
        trigger: "POST /_events/auto-transition with event_type SUBSCRIPTION_RENEWAL"
        actor: PlatformAdmin
        preconditions:
          - "current clock timestamp >= Subscription.current_period_end + GRACE_DAYS"
        side_effects:
          - "Subscription.limits_removed = false"
          - "recompute Learner.hearts_available for every learner holding a FamilyMembership under this subscription"
          - "every FamilyMembership under this subscription transitions ACTIVE -> REMOVED"
          - "every EngagementOffer for a learner under this subscription whose status == ISSUED transitions ISSUED -> EXPIRED"

  - entity: FamilyMembership
    initial_state: INVITED
    terminal_states: [REMOVED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "PUT /subscriptions/{id} with add_seat_learner_id"
        actor: Learner
        preconditions:
          - "Subscription.seats_used < Subscription.seats_total"
          - "Subscription.status == ACTIVE"
          - "no other FamilyMembership with subscription_id == this subscription and member_learner_id == this learner has status IN {INVITED, ACTIVE}"
        side_effects:
          - "Subscription.seats_used += 1"
          - "recompute Learner.hearts_available for member_learner_id"
          - "recompute Learner.energy_units for member_learner_id"
          - "recompute EngagementOffer.scored_tier for every ISSUED EngagementOffer of member_learner_id"
      - from: ACTIVE
        to: REMOVED
        trigger: "system event: subscription lapse or seat revocation"
        actor: system
        preconditions:
          - "Subscription.status IN {FREE, EXPIRED} OR PlatformAdmin revoked the seat"
        side_effects:
          - "Subscription.seats_used -= 1"
          - "recompute Learner.hearts_available for member_learner_id"
          - "recompute Learner.energy_units for member_learner_id"
          - "recompute EngagementOffer.scored_tier for every ISSUED EngagementOffer of member_learner_id"
      - from: INVITED
        to: REMOVED
        trigger: "PUT /subscriptions/{id} with remove_seat_learner_id"
        actor: Learner
        preconditions:
          - "Subscription.status IN {FREE, EXPIRED} OR the acting learner owns the Subscription"
        side_effects:
          - "recompute EngagementOffer.scored_tier for every ISSUED EngagementOffer of member_learner_id"
  - entity: PlacementTest
    initial_state: CREATED
    terminal_states: [CERTIFIED, ABANDONED]
    transitions:
      - from: CREATED
        to: IN_PROGRESS
        trigger: "POST /placement-tests/{id}/attempts"
        actor: Learner
        preconditions:
          - "PlacementTest.free_probe_used == true OR Learner.program_tier IN {PLUS_FAMILY, CERTIFICATION_ELITE}"
        side_effects:
          - "PlacementTest.graded_at = current clock timestamp"
      - from: IN_PROGRESS
        to: SCORED
        trigger: "PUT /placement-tests/{id}"
        actor: Learner
        preconditions:
          - "count of PracticeAttempt rows with is_placement_attempt == true whose lesson_node_id is parented by a CourseUnit with unit_index <= PlacementTest.placed_unit_index is >= PlacementTest.total_items"
        side_effects:
          - "PlacementTest.graded_at = current clock timestamp"
          - "ComputePlacementBand evaluated for this placement test"
          - "recompute Learner.xp_total"
      - from: SCORED
        to: CALIBRATED
        trigger: "POST /placement-tests/{id}/calibrate"
        actor: Learner
        preconditions:
          - "PlacementTest.status IN {SCORED, CALIBRATED}"
          - "PlacementTest.calibrated_cefr_band is not null"
        side_effects:
          - "PlacementTest.placed_unit_index = max(existing placed_unit_index, ComputePlacementBand.placed_unit_index)"
          - "every LessonNode in units with unit_index < PlacementTest.placed_unit_index whose state == LOCKED and whose prerequisites are satisfied transitions LOCKED -> UNLOCKED"
          - "recompute Learner.leaf_count"
        note: "cycle edge: SCORED -> CALIBRATED -> SCORED loops on each recalibration; placed_unit_index is monotonic non-decreasing across the loop"
      - from: CALIBRATED
        to: SCORED
        trigger: "PUT /placement-tests/{id}"
        actor: Learner
        preconditions:
          - "PlacementTest.status == CALIBRATED"
        side_effects:
          - "PlacementTest.calibrated_cefr_band = null"
          - "ComputePlacementBand re-evaluated for this placement test"
      - from: SCORED
        to: CERTIFIED
        trigger: "POST /certification-exams"
        actor: Learner
        preconditions:
          - "PlacementTest.status == SCORED"
          - "PlacementTest.calibrated_cefr_band IN {B2, C1}"
          - "PlacementTest.proctor_user_id is a non-empty operator id"
          - "Learner.program_tier == CERTIFICATION_ELITE"
        side_effects:
          - "a CertificationExam row is created with status PURCHASED and learner_id = PlacementTest.learner_id"
          - "PlacementTest.status = CERTIFIED"
          - "recompute Learner.xp_total"
      - from: CREATED
        to: ABANDONED
        trigger: "DELETE /placement-tests/{id}"
        actor: Learner
        preconditions:
          - "PlacementTest.status == CREATED"
        side_effects:
          - "PlacementTest.free_probe_used = false"

  - entity: League
    initial_state: FORMING
    terminal_states: [CLOSED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "POST /leagues/{id}/standings"
        actor: Learner
        preconditions:
          - "Subscription.limits_removed == true for the learner OR the learner holds a FamilyMembership in status ACTIVE"
        side_effects:
          - "League.member_count += 1"
          - "recompute League.member_count"
      - from: ACTIVE
        to: SETTLING
        trigger: "POST /_events/auto-transition with event_type LEAGUE_WEEK_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "current clock timestamp >= League.week_start + LEAGUE_WEEK_DAYS"
          - "League.status == ACTIVE"
        side_effects:
          - "ComputeLeagueFlags evaluated for this league"
          - "every LeagueStanding in this league whose ComputeLeagueFlags.flagged is true transitions GOOD_STANDING -> FLAGGED"
      - from: SETTLING
        to: CLOSED
        trigger: "POST /_events/auto-transition with event_type LEAGUE_WEEK_CLOSE"
        actor: PlatformAdmin
        preconditions:
          - "League.status == SETTLING OR League.status == CLOSED"
        side_effects:
          - "ComputeLeagueFlags evaluated for this league"
          - "ComputeLeagueRanking evaluated for this league"
          - "League.settled_at = current clock timestamp"
          - "every LeagueStanding in this league whose standing == GOOD_STANDING transitions GOOD_STANDING -> PROMOTED when rank <= promotion_cutoff_rank"
          - "every LeagueStanding in this league whose standing == GOOD_STANDING transitions GOOD_STANDING -> DEMOTED when rank >= demotion_cutoff_rank"
          - "recompute Learner.leaf_count for every learner demoted by this sweep"
          - "EngagementOffer issued with milestone_code LEAGUE_PROMOTION for every learner whose standing was PROMOTED"
        note: "cycle edge: after the demotion sweep the league reopens, and a demoted learner whose weekly_xp recovers is re-ranked and promoted again"
      - from: CLOSED
        to: ACTIVE
        trigger: "POST /_events/auto-transition with event_type LEAGUE_WEEK_OPEN"
        actor: PlatformAdmin
        preconditions:
          - "every LeagueStanding in this league whose standing == DEMOTED has been re-ranked with weekly_xp above League.demotion_cutoff_rank"
        side_effects:
          - "League.week_start = current clock timestamp"
          - "every DEMOTED LeagueStanding in this league transitions DEMOTED -> GOOD_STANDING"
          - "recompute ComputeLeagueRanking for this league"

  - entity: LeagueStanding
    initial_state: GOOD_STANDING
    terminal_states: [PROMOTED, DEMOTED]
    transitions:
      - from: GOOD_STANDING
        to: FLAGGED
        trigger: "system event: league settlement anti-cheat sweep"
        actor: system
        preconditions:
          - "ComputeLeagueFlags.cheat_flag_condition_ref_count >= CHEAT_REF_THRESHOLD"
        side_effects:
          - "LeagueStanding.flag_reason = 'HIGH_ASYMMETRY_FAST_REFERENCES'"
          - "LeagueStanding.standing excluded from the ComputeLeagueRanking candidate set"
          - "recompute League.member_count"
      - from: FLAGGED
        to: GOOD_STANDING
        trigger: "POST /_events/auto-transition with event_type LEAGUE_WEEK_OPEN"
        actor: PlatformAdmin
        preconditions:
          - "LeagueStanding.standing == FLAGGED"
          - "League.status == SETTLING OR League.status == CLOSED"
        side_effects:
          - "LeagueStanding.flag_reason = null"
          - "LeagueStanding.standing included in the ComputeLeagueRanking candidate set again"
      - from: GOOD_STANDING
        to: PROMOTED
        trigger: "system event: league settlement sweep"
        actor: system
        preconditions:
          - "ComputeLeagueRanking.rank <= League.promotion_cutoff_rank"
          - "LeagueStanding.standing == GOOD_STANDING"
        side_effects:
          - "LeagueStanding.settled_outcome = PROMOTED"
          - "recompute Learner.xp_total for this learner"
          - "EngagementOffer issued with milestone_code LEAGUE_PROMOTION"
      - from: GOOD_STANDING
        to: DEMOTED
        trigger: "system event: league demotion sweep"
        actor: system
        preconditions:
          - "ComputeLeagueRanking.rank >= League.demotion_cutoff_rank"
          - "LeagueStanding.standing == GOOD_STANDING"
        side_effects:
          - "LeagueStanding.settled_outcome = DEMOTED"
          - "recompute Learner.leaf_count for this learner"
          - "every LessonNode whose state IN {BRONZE, SILVER, GOLD, LEGENDARY} and whose unit_id belongs to a CourseUnit with state COMPLETED and whose learner_id == LeagueStanding.learner_id increases decay_meter by 1"

  - entity: CertificationExam
    initial_state: PURCHASED
    terminal_states: [REPORTED, VOID, EXPIRED]
    transitions:
      - from: PURCHASED
        to: PROCTORING
        trigger: "POST /certification-exams/{id}/proctor"
        actor: CertificationProctor
        preconditions:
          - "CertificationExam.proctor_user_id is a non-empty operator id"
          - "current clock timestamp <= CertificationExam.expires_at"
        side_effects:
          - "CertificationExam.proctor_started_at = current clock timestamp"
      - from: PROCTORING
        to: SUBMITTED
        trigger: "POST /certification-exams/{id}/submit"
        actor: Learner
        preconditions:
          - "CertificationExam.status == PROCTORING"
          - "current clock timestamp <= CertificationExam.proctor_started_at + PROCTOR_WINDOW_HOURS"
        side_effects:
          - "CertificationExam.raw_score = the submitted score"
          - "ComputeCertificationBand evaluated for this exam"
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /certification-exams/{id}/score"
        actor: CertificationProctor
        preconditions:
          - "CertificationExam.status == SUBMITTED"
          - "ComputeCertificationBand.band is not null"
        side_effects:
          - "CertificationExam.score_band = ComputeCertificationBand.band corrected by any proctor discipline penalty"
          - "recompute ComputeCertificationBand for this exam"
      - from: SCORED
        to: REPORTED
        trigger: "POST /certification-exams/{id}/reports"
        actor: CertificationProctor
        preconditions:
          - "CertificationExam.status == SCORED"
          - "CertificationExam.score_band IN {PASS, STRONG_PASS, DISTINCTION}"
        side_effects:
          - "a ScoreReport row is created referencing this exam"
          - "CertificationExam.report_id = the created ScoreReport id"
          - "recompute Learner.xp_total for this learner"
      - from: PROCTORING
        to: VOID
        trigger: "POST /certification-exams/{id}/score with void_reason"
        actor: CertificationProctor
        preconditions:
          - "CertificationExam.status == PROCTORING"
          - "an integrity violation was observed during the proctoring window"
        side_effects:
          - "CertificationExam.score_band = NOT_CERTIFIED"
          - "every EngagementOffer for this learner whose status == ISSUED transitions ISSUED -> SUPPRESSED"
      - from: PURCHASED
        to: EXPIRED
        trigger: "POST /_events/auto-transition with event_type EXAM_EXPIRY"
        actor: PlatformAdmin
        preconditions:
          - "current clock timestamp > CertificationExam.expires_at"
          - "CertificationExam.status == PURCHASED"
        side_effects:
          - "CertificationExam.status = EXPIRED"

  - entity: EngagementOffer
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED, SUPPRESSED]
    transitions:
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_events/auto-transition with event_type OFFER_EXPIRY"
        actor: PlatformAdmin
        preconditions:
          - "current clock timestamp > EngagementOffer.expires_at"
          - "EngagementOffer.status == ISSUED"
        side_effects:
          - "refresh EngagementOffer.updated_at"
      - from: ISSUED
        to: SUPPRESSED
        trigger: "system event: notification fatigue suppression"
        actor: system
        preconditions:
          - "count of PracticeAttempt rows for this learner whose recorded_at falls inside the trailing 24-hour window is >= NOTIFY_FATIGUE_CAP"
        side_effects:
          - "EngagementOffer.status = SUPPRESSED"
      - from: ISSUED
        to: REDEEMED
        trigger: "PUT /subscriptions/{id}"
        actor: Learner
        preconditions:
          - "EngagementOffer.status == ISSUED"
          - "Subscription.plan_code IN {PLUS_FAMILY, CERTIFICATION_ELITE}"
          - "current clock timestamp <= EngagementOffer.expires_at"
        side_effects:
          - "Subscription.seats_total preserved"
          - "EngagementOffer.status = REDEEMED"
concurrency_rules:
  - rule_id: placement-test-create-stale-learner
    parent_entity: Learner
    write_endpoint: "POST /placement-tests"
    occ_field: "expected_learner_version"
    description: |
      Creating a PlacementTest whose expected_learner_version no longer matches the
      Learner's current version is rejected. The product allows a later placement
      session to supersede an earlier one, so a sequential second create succeeds on
      its own merits; it is rejected only because the writer's view of the Learner
      predates the version advance performed by an earlier create.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: certification-exam-create-stale-learner
    parent_entity: Learner
    write_endpoint: "POST /certification-exams"
    occ_field: "expected_learner_version"
    description: |
      Purchasing a CertificationExam whose expected_learner_version no longer matches
      the Learner's current version is rejected. A superseding purchase is legitimate
      under the product rules, so the create is refused solely because the client's
      observed Learner version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: ComputeStreakDayBoundary
    trigger: "on every streak evaluation, practice attempt, and day-close sweep"
    algorithm: interval_merge
    formula: |
      local_now_seconds = floor(clock_utc_seconds) + StreakState.local_date_offset_days * 86400
      focus_local_midnight = local_now_seconds - (local_now_seconds mod 86400)
      elapsed_seconds = local_now_seconds - focus_local_midnight
      streak_day_remaining_seconds = DAY_SECONDS - elapsed_seconds
      day_close_due = (streak_day_remaining_seconds <= STREAK_DAY_CLOSE_BUFFER_SECONDS)
      focus_date = epoch_seconds(focus_local_midnight)
    input_set: "Learner.timezone_id, StreakState.local_date_offset_days, and the logical clock; no PracticeAttempt rows are read"
    constants:
      DAY_SECONDS: 86400
      STREAK_DAY_CLOSE_BUFFER_SECONDS: 3600
    precision: "whole seconds, truncation toward zero"
    variants:
      - name: fixed_offset_boundary
        when: "StreakState.local_date_offset_days is supplied on the streak row (pinned default)"
        difference: "the boundary adds the fixed day offset, so every local day is exactly 86400 seconds and streak_day_remaining_seconds is independent of the learner's timezone_id"
      - name: dst_adjusted_boundary
        when: "Learner.timezone_id carries a daylight-saving transition inside the focus window"
        difference: "the focus window is 82800 or 90000 seconds long, so streak_day_remaining_seconds and day_close_due differ from fixed_offset_boundary by up to 3600 seconds on the transition day"

  - name: ComputeHeartAndEnergyLimits
    trigger: "on every POST /lesson-nodes/{id}/practice and on every Subscription state change"
    algorithm: threshold
    formula: |
      IF Learner.program_tier IN {PLUS_FAMILY, CERTIFICATION_ELITE} AND Subscription.limits_removed == true:
          gate = UNLIMITED
          hearts_available = null
          energy_units = null
      ELSE:
          day_start_utc = ComputeStreakDayBoundary.focus_date
          hearts_used_today = count of PracticeAttempt rows where learner_id = L
                              AND correct == false
                              AND is_placement_attempt == false
                              AND recorded_at >= day_start_utc
                              AND recorded_at <  day_start_utc + 86400
          hearts_available = max(0, FREE_HEARTS_PER_DAY - hearts_used_today)
          elapsed = max(0, clock_utc - Learner.energy_anchor_at)
          energy_units = min(ENERGY_CAP, Learner.energy_units + floor(elapsed / ENERGY_REGEN_SECONDS) * ENERGY_UNITS_PER_INTERVAL)
          gate = EXAM_ALLOWED when (hearts_available >= 1 AND energy_units >= 1) else EXAM_BLOCKED
          on an accepted attempt, after the gate check: Learner.energy_units = energy_units - 1
                                                   Learner.energy_anchor_at = clock_utc
    input_set: "PracticeAttempt rows for the learner inside the half-open local focus-day window [focus_date, focus_date + 86400); attempts with is_placement_attempt = true are excluded from hearts_used_today"
    constants:
      FREE_HEARTS_PER_DAY: 5
      ENERGY_START_UNITS: 10
      ENERGY_CAP: 30
      ENERGY_REGEN_SECONDS: 900
      ENERGY_UNITS_PER_INTERVAL: 5
    precision: "integer counts; no rounding"
    variants:
      - name: continuous_regen
        when: "Learner.program_tier == FREE (pinned default)"
        difference: "energy credits only complete 900-second intervals, so a learner 899 seconds past energy_anchor_at holds the same energy_units as at anchor time"
      - name: quantized_daily_regen
        when: "the learner holds a Subscription with plan_code CERTIFICATION_ELITE whose status is IN_GRACE"
        difference: "energy is credited once per local day boundary instead of once per 900 seconds, so a learner who practices at 00:05 local holds 5 fewer energy_units than continuous_regen yields at the same instant"

  - name: ComputePracticeXpAward
    trigger: "on every PracticeAttempt row whose outcome becomes ACCEPTED"
    algorithm: threshold
    formula: |
      base = BASE_BY_STATE[lesson_node.state]
      speed_bonus = 3 when response_ms < FAST_MS else (1 when response_ms < MEDIUM_MS else 0)
      streak_multiplier = 1.50 when StreakState.current_length >= 100
                          else 1.25 when StreakState.current_length >= 10
                          else 1.10 when StreakState.current_length >= 2
                          else 1.00
      xp_awarded = 0 when correct == false
                   else round_half_up((base + speed_bonus) * streak_multiplier)
    input_set: "the LessonNode row being practiced, the PracticeAttempt row's response_ms, and StreakState.current_length before this attempt is applied"
    constants:
      FAST_MS: 3000
      MEDIUM_MS: 8000
      BASE_BY_STATE: { UNLOCKED: 10, BRONZE: 8, SILVER: 6, GOLD: 4, LEGENDARY: 2, DECAYED: 2, LOCKED: 0 }
    precision: "integer, round_half_up"
    variants:
      - name: standard_streak_multiplier
        when: "Learner.program_tier IN {PLUS_FAMILY, CERTIFICATION_ELITE}"
        difference: "the full streak_multiplier ladder applies, so a 2-day streak on an UNLOCKED node answered in 2500 ms awards round_half_up((10 + 3) * 1.10) = 14 xp"
      - name: free_tier_multiplier_cap
        when: "Learner.program_tier == FREE"
        difference: "streak_multiplier is capped at 1.00 regardless of current_length, so the same attempt awards round_half_up((10 + 3) * 1.00) = 13 xp"

  - name: ComputePlacementSubScore
    trigger: "on every POST /placement-tests/{id}/items for the completed placement test"
    algorithm: aggregation
    formula: |
      combined = comprehension_score + accuracy_score
      unit_credit = floor(combined / SUBSCORE_DIVISOR)
      count_credit = floor(total_items / ITEMS_PER_UNIT)
      raw_placed_unit_index = min(PLACEMENT_MAX_UNIT_INDEX, unit_credit + count_credit)
    input_set: "the PlacementTest row's comprehension_score, accuracy_score, and total_items"
    constants:
      SUBSCORE_DIVISOR: 40
      ITEMS_PER_UNIT: 5
      PLACEMENT_MAX_UNIT_INDEX: 12
    precision: "integer, truncation toward zero on division, round_half_up on the summed metric"
    variants:
      - name: dropped_remainder_segments
        when: "proctor_user_id is empty (pinned default)"
        difference: "unit_credit truncates the combined sub-score, so comprehension_score 120 with accuracy_score 80 yields floor(200/40) = 5 units"
      - name: counted_remainder_segments
        when: "proctor_user_id is a non-empty operator id"
        difference: "unit_credit is computed as ceil(combined / SUBSCORE_DIVISOR), so the same combined sub-score of 200 is unchanged at 5 but a combined sub-score of 201 yields 6 units instead of 5"

  - name: ComputePlacementBand
    trigger: "on PUT /placement-tests/{id} with action CALIBRATE and with action SUBMIT_SCORES"
    algorithm: constraint_propagation
    formula: |
      combined_score = comprehension_score + accuracy_score
      candidate_band = C1 when combined_score >= 180
                       else B2 when combined_score >= 140
                       else B1 when combined_score >= 100
                       else A2 when combined_score >= 60
                       else A1
      raw_placed_unit_index = ComputePlacementSubScore.raw_placed_unit_index
      hard_cap_index = max(unit_index of CourseUnit rows whose state IN {COMPLETED, IN_PROGRESS})
                       else PLACEMENT_MAX_UNIT_INDEX
      placed_unit_index = min(raw_placed_unit_index, hard_cap_index)
      calibrated_cefr_band = candidate_band when hard_cap_index >= raw_placed_unit_index
                             else cefr_band of the CourseUnit with the largest unit_index among COMPLETED units
    input_set: "the PlacementTest row's sub-scores and its is_institution_graded flag, which selects the hard-cap anchor"
    constants:
      BAND_CUTOFFS: { C1: 180, B2: 140, B1: 100, A2: 60 }
      PLACEMENT_MAX_UNIT_INDEX: 12
    precision: "integer sub-scores; band boundaries are inclusive lower bounds"
    variants:
      - name: completed_unit_cap
        when: "PlacementTest.is_institution_graded is false (self-serve session)"
        difference: "hard_cap_index is the largest unit_index among CourseUnit rows in state COMPLETED, so combined sub-scores of 200 with 20 items cap placed_unit_index at the single completed unit 1"
      - name: tested_unit_cap
        when: "PlacementTest.is_institution_graded is true (proctor_user_id non-empty)"
        difference: "hard_cap_index also counts units in state IN_PROGRESS, so the identical sub-scores place the learner at unit 2 and calibrated_cefr_band becomes that unit's band"

  - name: ComputeSkillDecayAndReviewSchedule
    trigger: "on the daily skill decay sweep and after every accepted review attempt"
    algorithm: decay_function
    formula: |
      days_since_review = floor((clock_utc - LessonNode.last_reviewed_at) / 86400 seconds)
      decay_points = CAP_TO_TIER - 1 when Learner's Subscription.status == EXPIRED
                     else min(DECAY_POINTS_PER_TIER, floor(days_since_review / DECAY_GRACE_DAYS))
      decay_meter = decay_points
      review_interval_days = min(INTERVAL_DAYS_BY_STATE[LessonNode.state], MAX_REVIEW_DEPTH_DAYS)
      review_due_at = LessonNode.last_reviewed_at + review_interval_days * 86400 seconds
    input_set: "LessonNode rows whose state IN {UNLOCKED, BRONZE, SILVER, GOLD, LEGENDARY}; rows already in DECAYED or LOCKED are excluded"
    constants:
      DECAY_GRACE_DAYS: 2
      DECAY_POINTS_PER_TIER: 5
      MAX_REVIEW_DEPTH_DAYS: 10
      INTERVAL_DAYS_BY_STATE: { UNLOCKED: 1, BRONZE: 1, SILVER: 2, GOLD: 3, LEGENDARY: 5 }
    precision: "integer days; the decay sweep fires when decay_meter >= DECAY_POINTS_PER_TIER"
    variants:
      - name: standard_decay_curve
        when: "the learner's Subscription.status IN {FREE, ACTIVE, IN_GRACE} (pinned default)"
        difference: "decay_meter reaches DECAY_POINTS_PER_TIER at 10 days since review, so a node untouched for 10 days transitions to DECAYED"
      - name: expired_subscriber_decay_curve
        when: "the learner's Subscription.status == EXPIRED"
        difference: "decay_meter is capped at DECAY_POINTS_PER_TIER - 1, so the same node stalls at decay_meter 4 and never transitions to DECAYED even after 40 days"

  - name: ComputeLeagueRanking
    trigger: "on POST /_events/auto-transition with event_type LEAGUE_WEEK_CLOSE while the league is SETTLING, and on event_type LEAGUE_WEEK_OPEN"
    algorithm: aggregation
    formula: |
      for each LeagueStanding S in the league whose standing == GOOD_STANDING:
          attempts = PracticeAttempt rows where learner_id == S.learner_id
                     AND recorded_at >= League.week_start
                     AND recorded_at <  League.week_start + LEAGUE_WEEK_DAYS * 86400
          exact_attempt_xp(a) = (BASE_BY_STATE[node.state] + speed_bonus(a)) * streak_multiplier(a)
          weekly_xp(S) = sum over a in attempts of round_half_up(exact_attempt_xp(a))
          attempt_count(S) = count of attempts
      promotion_cutoff_rank = min(PROMOTION_CUTOFF_RANK, member_count)
      demotion_cutoff_rank = max(1, member_count - DEMOTION_SPAN + 1)
      rank(S) = 1 + count of eligible S' where
                weekly_xp(S') > weekly_xp(S)
                OR (weekly_xp(S') == weekly_xp(S) AND attempt_count(S') > attempt_count(S))
                OR (weekly_xp(S') == weekly_xp(S) AND attempt_count(S') == attempt_count(S)
                    AND S'.created_at < S.created_at)
    input_set: "LeagueStanding rows whose standing == GOOD_STANDING; FLAGGED, PROMOTED and DEMOTED rows are excluded from the candidate set"
    constants:
      LEAGUE_WEEK_DAYS: 7
      PROMOTION_CUTOFF_RANK: 3
      DEMOTION_SPAN: 3
      LEAGUE_SIZE: 10
    precision: "integer xp; per-attempt round_half_up is pinned before summation, the sum is never re-rounded"
    variants:
      - name: per_attempt_rounding
        when: "the settlement sweep runs while the league is SETTLING (pinned default; the demotion sweep runs last, so a standing that satisfies both cutoffs settles as DEMOTED)"
        difference: "weekly_xp sums each attempt's already-rounded xp_awarded, so ten attempts of exact 7.5 xp total 80 and the standing is ranked on 80"
      - name: sum_then_round
        when: "the league is re-ranked by event_type LEAGUE_WEEK_OPEN"
        difference: "weekly_xp rounds the exact sum once, so the same ten attempts total round_half_up(75.0) = 75 and the standing can fall across the promotion_cutoff_rank boundary"

  - name: ComputeLeagueFlags
    trigger: "on the anti-cheat sweep during POST /_events/auto-transition with event_type LEAGUE_WEEK_CLOSE"
    algorithm: weighted_scoring
    formula: |
      first pass, pinned evaluation order:
          preliminary_weekly_xp(S) = ComputeLeagueRanking per_attempt_rounding value
          preliminary_top_id = argmax over eligible S of (preliminary_weekly_xp(S),
                                tie-break attempt_count DESC, then LeagueStanding.created_at ASC)
      second pass:
          top_weekly_xp = preliminary_weekly_xp(preliminary_top_id)
          median_weekly_xp = median of preliminary_weekly_xp over eligible standings
          aggression_score = round_half_up(1000 * top_weekly_xp / (1 + median_weekly_xp))
          benchmark_node_id = the LessonNode with the lowest node_index across all
                              PracticeAttempt rows of preliminary_top_id inside the league week
          cheat_flag_condition_ref_count = count of PracticeAttempt rows by preliminary_top_id
                              inside the league week whose lesson_node_id == benchmark_node_id
                              AND response_ms < FAST_ANSWER_MS
          accuracy_break = correct_count(preliminary_top_id) / max(1, attempt_count(preliminary_top_id))
      flagged = (cheat_flag_condition_ref_count >= CHEAT_REF_THRESHOLD
                 AND aggression_score >= AGGRESSION_MIN)
                OR (aggression_score >= AGGRESSION_MIN AND accuracy_break < ACCURACY_BREAK_MIN)
    input_set: "PracticeAttempt rows for the preliminary top learner inside the league week; the preliminary candidate set is frozen before the flag pass runs"
    constants:
      CHEAT_REF_THRESHOLD: 8
      AGGRESSION_MIN: 2000
      FAST_ANSWER_MS: 800
      ACCURACY_BREAK_MIN: 0.5
    precision: "aggression_score integer, round_half_up; accuracy_break is an unrounded ratio"
    variants:
      - name: pinned_preliminary_recount
        when: "the anti-cheat sweep runs before the demotion sweep, while the league is SETTLING (pinned default)"
        difference: "ref_count and aggression_score are computed from the frozen preliminary candidate set, so a top learner with 10 fast references on the lowest-index node is flagged"
      - name: mutation_aware_recount
        when: "the anti-cheat sweep is replayed by event_type LEAGUE_WEEK_OPEN after the demotion sweep"
        difference: "ref_count is recounted against the post-demotion candidate set, so a learner demoted earlier in the same settlement records a lower ref_count and escapes the flag"

  - name: ComputeStreakRepairCost
    trigger: "on the BROKEN transition of StreakState and on POST /streaks/{id}/repair"
    algorithm: tiered_pricing
    formula: |
      segment_index = min(4, floor(current_length_at_break / 30))
      tier_rate_gems = TIER_RATE_GEMS[segment_index]
      length_bonus_gems = round_half_up((current_length_at_break mod 30) * LENGTH_BONUS_RATE)
      display_price_gems = min(MONTHLY_REPAIR_CAP_GEMS, tier_rate_gems + length_bonus_gems)
      inflated_gems = round_half_up((tier_rate_gems + length_bonus_gems) * (1 + REPAIR_INFLATION_RATE * repair_purchases_this_month))
      purchase_debit = min(MONTHLY_REPAIR_CAP_GEMS, inflated_gems)
    input_set: "StreakState.current_length_at_break and StreakState.repair_purchases_this_month; lifetime streak days do not enter the price"
    constants:
      TIER_RATE_GEMS: [1, 2, 4, 6, 8]
      LENGTH_BONUS_RATE: 0.05
      REPAIR_INFLATION_RATE: 0.5
      MONTHLY_REPAIR_CAP_GEMS: 20
      MONTHLY_REPAIR_CAP: 3
    precision: "whole gems, round_half_up"
    variants:
      - name: single_round_inflated_debit
        when: "repair_purchases_this_month >= 1"
        difference: "the inflation multiplier is applied to the summed tier_rate_gems + length_bonus_gems and rounded once, so a second repair of a 17-day streak debits round_half_up((1 + 1) * 1.5) = 3 gems"
      - name: per_term_rounded_debit
        when: "the repair is priced by the family-plan repair flow (the learner holds a FamilyMembership in status ACTIVE)"
        difference: "each term is multiplied and rounded separately before summing, so the same second repair debits round_half_up(1 * 1.5) + round_half_up(1 * 1.5) = 4 gems while display_price_gems stays 2"

  - name: ComputeNotificationCadence
    trigger: "on every EngagementOffer issue and on every practice attempt accepted for the learner"
    algorithm: waterfall_allocation
    formula: |
      daily_slot_quota = NOTIFY_BASE_DAILY_CAP
      daily_slot_quota += 2 when Learner.program_tier == CERTIFICATION_ELITE
      daily_slot_quota += 1 when an EngagementOffer for this learner has status == ISSUED
      slots_used_today = count of PracticeAttempt rows where learner_id == L
                         AND recorded_at >= ComputeStreakDayBoundary.focus_date
                         AND recorded_at <  ComputeStreakDayBoundary.focus_date + 86400
      remaining_slots = max(0, daily_slot_quota - slots_used_today)
      cadence = ALLOWED when remaining_slots >= 1 else SUPPRESSED
      urgency_rank = 0 when StreakState.status == BROKEN
                     else 1 when StreakState.freeze_tokens == 0 AND StreakState.status == EVALUATING
                     else 2 when Learner.hearts_available <= 1
                     else 3
    input_set: "PracticeAttempt rows for the learner inside the cadence window and the learner's StreakState row"
    constants:
      NOTIFY_BASE_DAILY_CAP: 3
      NOTIFY_FATIGUE_CAP: 3
    precision: "integer counts"
    variants:
      - name: fixed_local_day_cadence
        when: "StreakState.status IN {EVALUATING, QUALIFIED, FROZEN, REPAIRED} (pinned default)"
        difference: "slots_used_today counts only rows inside the local focus day, so a learner who practiced twice before local midnight and twice after is measured at 2 for the new day"
      - name: rolling_window_cadence
        when: "StreakState.status == BROKEN (win-back flow)"
        difference: "slots_used_today counts rows in the trailing 24-hour rolling window, so the same learner is measured at 4, remaining_slots falls to 0, and the offer is suppressed"
  - name: ComputeCertificationBand
    trigger: "on POST /certification-exams/{id}/score and on POST /certification-exams/{id}/reports"
    algorithm: threshold
    formula: |
      normalized_score = min(100, max(0, CertificationExam.raw_score + discipline_penalty))
      band_lookup = DISTINCTION when normalized_score >= 85
                    else STRONG_PASS when normalized_score >= 75
                    else PASS when normalized_score >= 60
                    else NOT_CERTIFIED
    input_set: "the CertificationExam row's raw_score and the proctor-supplied discipline_penalty; the institution weighting multiplier is only present when the delivery_mode is INSTITUTION"
    constants:
      BAND_CUTOFFS: { DISTINCTION: 85, STRONG_PASS: 75, PASS: 60 }
      ONE_STEP_DEMOTION_PENALTY: -10
    precision: "integer score; band boundaries are inclusive lower bounds"
    variants:
      - name: post_penalty_normalization
        when: "proctor_user_id is a non-empty operator id (pinned default for a proctored session)"
        difference: "the discipline penalty is added to raw_score before the band lookup, so raw_score 78 with discipline_penalty 0 lands on STRONG_PASS"
      - name: pre_penalty_band_then_demote
        when: "the exam is delivered self-serve (proctor_user_id empty) or discipline_penalty <= ONE_STEP_DEMOTION_PENALTY"
        difference: "the band is looked up on the unadjusted raw_score and demoted exactly one step when the penalty is at or below the demotion threshold, so raw_score 78 with discipline_penalty -10 yields PASS instead of the post_penalty_normalization value STRONG_PASS"

  - name: ComputeCertificationDiscount
    trigger: "on EngagementOffer issue and on PUT /subscriptions/{id} when an ISSUED offer is redeemed"
    algorithm: tiered_pricing
    formula: |
      milestone_bonus_pct = MILESTONE_DISCOUNT[milestone_code]
      streak_bonus_pct = min(STREAK_BONUS_CAP_PCT,
                             floor(max(0, StreakState.current_length - 7) / 7) * STREAK_BONUS_STEP_PCT)
      discount_pct = min(MAX_DISCOUNT_PCT, BASE_DISCOUNT_PCT + milestone_bonus_pct + streak_bonus_pct)
      total_due_cents = round_half_up(BASE_MONTHLY_FEE_CENTS * Subscription.seats_total * (100 - discount_pct) / 100)
      scored_tier = PLUS_FAMILY when Subscription.seats_total >= 2 else PLUS
    input_set: "the triggering milestone row, the learner's StreakState row, and Subscription.seats_total; seats_total is read before any cascade that changes it"
    constants:
      BASE_DISCOUNT_PCT: 10
      MAX_DISCOUNT_PCT: 40
      STREAK_BONUS_STEP_PCT: 2
      STREAK_BONUS_CAP_PCT: 10
      MILESTONE_DISCOUNT: { STREAK_7: 5, STREAK_30: 15, PLACEMENT_SKIP: 10, LEAGUE_PROMOTION: 10, HEART_DEPLETION: 20 }
      BASE_MONTHLY_FEE_CENTS: 6999
    precision: "discount_pct integer; total_due_cents whole cents, round_half_up"
    variants:
      - name: aggregate_rounding
        when: "the family plan is priced as a whole on PUT /subscriptions/{id} (pinned default)"
        difference: "the seat multiplier is applied before rounding, so a 17 percent discount on a 4-seat family yields round_half_up(6999 * 4 * 0.83) = 23237 cents"
      - name: per_seat_rounding
        when: "the same offer is re-quoted by the family-plan seat preview flow"
        difference: "each seat is rounded then multiplied, so the identical inputs yield 4 * round_half_up(6999 * 0.83) = 23236 cents and the total_due_cents differs by 1 cent"
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /learners"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the operation per the §1.7 matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "the Learner named by X-User-ID (entity_backed roles) or by learner_id in the body or query exists"
    error_id: ERR_LEARNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /lesson-nodes/{id}/practice; PUT /lesson-nodes/{id}/review; POST /streak-states/{id}/repair; POST /placement-tests; PUT /placement-tests/{id}; POST /leagues; PUT /leagues/{id}; POST /subscriptions; PUT /subscriptions/{id}; POST /certification-exams; PUT /certification-exams/{id}; POST /_inject/gems; GET /subscriptions; GET /placement-tests; GET /certification-exams; GET /engagement-offers"
  - priority: 4
    category: existence
    check: "the LessonNode named in the path exists, resolved left-to-right after the learner"
    error_id: ERR_LESSON_NODE_NOT_FOUND
    http_status: 404
    applies_to: "POST /lesson-nodes/{id}/practice; PUT /lesson-nodes/{id}/review; PUT /placement-tests/{id}"
  - priority: 5
    category: existence
    check: "the Subscription named in the path exists"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /subscriptions/{id}; PUT /subscriptions/{id}"
  - priority: 6
    category: existence
    check: "the CourseUnit named in the path or referenced by course_id exists"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /course-units/{id}; GET /lesson-nodes; POST /placement-tests"
  - priority: 7
    category: state
    check: "expected_learner_version in the request body equals the current Learner.version for OCC-guarded creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /placement-tests; POST /certification-exams"
  - priority: 8
    category: state
    check: "LessonNode.state IN {UNLOCKED, BRONZE, SILVER, GOLD, LEGENDARY} for a practice attempt"
    error_id: ERR_NODE_LOCKED
    http_status: 409
    applies_to: "POST /lesson-nodes/{id}/practice"
  - priority: 9
    category: state
    check: "LessonNode.state == DECAYED for a review attempt"
    error_id: ERR_NODE_NOT_DECAYED
    http_status: 409
    applies_to: "PUT /lesson-nodes/{id}/review"
  - priority: 10
    category: state
    check: "StreakState.status == BROKEN for a repair purchase"
    error_id: ERR_STREAK_NOT_BROKEN
    http_status: 409
    applies_to: "POST /streak-states/{id}/repair"
  - priority: 11
    category: state
    check: "Subscription.status == ACTIVE when add_seat_learner_id is supplied"
    error_id: ERR_SUBSCRIPTION_INACTIVE
    http_status: 409
    applies_to: "PUT /subscriptions/{id}"
  - priority: 12
    category: state
    check: "PlacementTest.status IN {CREATED, IN_PROGRESS, SCORED, CALIBRATED} for the requested placement operation"
    error_id: ERR_PLACEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "PUT /placement-tests/{id}"
  - priority: 13
    category: state
    check: "CertificationExam.status == PROCTORING for SUBMIT_SCORE and for voiding"
    error_id: ERR_EXAM_NOT_PROCTORING
    http_status: 409
    applies_to: "PUT /certification-exams/{id}"
  - priority: 14
    category: state
    check: "the League referenced by league_id is in status ACTIVE for a settlement sweep"
    error_id: ERR_LEAGUE_NOT_SETTLING
    http_status: 409
    applies_to: "POST /_events/auto-transition with event_type LEAGUE_WEEK_CLOSE"
  - priority: 15
    category: business_safety
    check: "the attempt is not part of a detected cheat pattern: at most CHEAT_REF_THRESHOLD attempts on the same lesson_node_id with response_ms < FAST_ANSWER_MS inside one local focus day"
    error_id: ERR_CHEAT_PATTERN_DETECTED
    http_status: 422
    applies_to: "POST /lesson-nodes/{id}/practice"
  - priority: 16
    category: business_temporal
    check: "the logical clock is at or before StreakState.focus_date + REPAIR_WINDOW_DAYS at repair time"
    error_id: ERR_REPAIR_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /streak-states/{id}/repair"
  - priority: 17
    category: business_temporal
    check: "the logical clock is at or before CertificationExam.proctor_started_at + PROCTOR_WINDOW_HOURS at submission time"
    error_id: ERR_PROCTOR_WINDOW_EXPIRED
    http_status: 422
    applies_to: "PUT /certification-exams/{id}"
  - priority: 18
    category: business_temporal
    check: "the lesson_node_id submitted as a placement item belongs to a CourseUnit whose unit_index is <= max(PlacementTest.placed_unit_index, PLACEMENT_PROBE_SPAN)"
    error_id: ERR_PLACEMENT_UNIT_OUT_OF_RANGE
    http_status: 422
    applies_to: "PUT /placement-tests/{id}"
  - priority: 19
    category: business_referential
    check: "LessonNode.prerequisite_node_id is null, or the referenced prerequisite LessonNode.state IN {BRONZE, SILVER, GOLD, LEGENDARY}"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 409
    applies_to: "POST /lesson-nodes/{id}/practice; PUT /lesson-nodes/{id}/review"
  - priority: 20
    category: business_constraint
    check: "LessonNode.decay_level < DECAY_LEVEL_FLOOR at review time"
    error_id: ERR_DECAY_RETENTION_FLOOR
    http_status: 409
    applies_to: "PUT /lesson-nodes/{id}/review"
  - priority: 21
    category: business_constraint
    check: "ComputeHeartAndEnergyLimits.hearts_available >= 1 for a non-placement practice attempt"
    error_id: ERR_HEARTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /lesson-nodes/{id}/practice"
  - priority: 22
    category: business_constraint
    check: "ComputeHeartAndEnergyLimits.energy_units >= 1 for a non-placement practice attempt"
    error_id: ERR_ENERGY_EXHAUSTED
    http_status: 409
    applies_to: "POST /lesson-nodes/{id}/practice"
  - priority: 23
    category: business_constraint
    check: "StreakState.repair_purchases_this_month < MONTHLY_REPAIR_CAP"
    error_id: ERR_REPAIR_MONTHLY_CAP
    http_status: 409
    applies_to: "POST /streak-states/{id}/repair"
  - priority: 24
    category: business_constraint
    check: "Subscription.seats_used < Subscription.seats_total"
    error_id: ERR_SEAT_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "PUT /subscriptions/{id}"
  - priority: 25
    category: business_constraint
    check: "PlacementTest.free_probe_used == false OR Learner.program_tier IN {PLUS_FAMILY, CERTIFICATION_ELITE}"
    error_id: ERR_PLACEMENT_PROBE_USED
    http_status: 402
    applies_to: "PUT /placement-tests/{id}"
  - priority: 26
    category: business_fiscal
    check: "Learner.gems_balance >= ComputeStreakRepairCost.purchase_debit"
    error_id: ERR_INSUFFICIENT_GEMS
    http_status: 402
    applies_to: "POST /streak-states/{id}/repair"
  - priority: 27
    category: business_fiscal
    check: "EngagementOffer.status == ISSUED and the logical clock is at or before EngagementOffer.expires_at for a discounted subscription write"
    error_id: ERR_OFFER_NOT_REDEEMABLE
    http_status: 409
    applies_to: "PUT /subscriptions/{id}"
  - priority: 28
    category: business_constraint
    check: "every required input field is present and every enum field holds a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
endpoints:
  - method: POST
    path: "/learners"
    description: "register a learner; mints the StreakState row and a FREE Subscription row for the learner"
    roles: [Anonymous]
    code: 201
    input: ["display_name", "timezone_id", "local_date_offset_days", "program_tier?"]
    output: Learner
    side_effects:
      - "a StreakState row is created with status EVALUATING, focus_date equal to the learner's local calendar date, and current_length 0"
      - "a Subscription row is created with status FREE, plan_code FREE, seats_total 1 and seats_used 0"
      - "StreakState.repair_cost_gems is initialized to 0"
  - method: GET
    path: "/learners/{id}"
    description: "read a learner profile with its derived counters"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: []
    output: Learner
    side_effects: []
  - method: PATCH
    path: "/learners/{id}"
    description: "update mutable learner profile fields; recomputes derived counters and retimes issued offers"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["expected_learner_version", "display_name?", "timezone_id?", "local_date_offset_days?", "program_tier?"]
    output: Learner
    side_effects:
      - "increments Learner.version by 1"
      - "recompute ComputeHeartAndEnergyLimits for the learner"
      - "recompute Learner.streak_anchor_date"
      - "when timezone_id or local_date_offset_days changes, every EngagementOffer of the learner whose status is ISSUED transitions ISSUED -> EXPIRED so that a re-timed learner can be re-engaged"
  - method: POST
    path: "/course-units"
    description: "create a course unit in the lesson tree"
    roles: [PlatformAdmin]
    code: 201
    input: ["unit_index", "title", "cefr_band", "unlock_index", "total_nodes"]
    output: CourseUnit
    side_effects:
      - "CourseUnit.crown_count initialized to 0"
  - method: GET
    path: "/course-units/{id}/nodes"
    description: "list the lesson nodes belonging to a unit, ordered by node_index"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LessonNode[]
    side_effects: []
  - method: POST
    path: "/course-units/{id}/nodes"
    description: "append a lesson node to a unit, optionally chained to a prerequisite node"
    roles: [PlatformAdmin]
    code: 201
    input: ["node_index", "prerequisite_node_id?"]
    output: LessonNode
    side_effects:
      - "LessonNode.state = LOCKED"
      - "when prerequisite_node_id is null and the parent unit state is IN {AVAILABLE, IN_PROGRESS}, LessonNode transitions LOCKED -> UNLOCKED"
  - method: GET
    path: "/lesson-nodes"
    description: "list lesson nodes, optionally filtered by unit or by prerequisite node"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["unit_id?", "prerequisite_node_id?", "limit?", "offset?"]
    output: LessonNode[]
    side_effects: []
  - method: GET
    path: "/lesson-nodes/{id}"
    description: "read the current practice state of a lesson node"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: []
    output: LessonNode
    side_effects: []
  - method: POST
    path: "/lesson-nodes/{id}/practice"
    description: "submit a practice attempt against a lesson node; consumes hearts and energy for FREE learners"
    roles: [Learner]
    code: 201
    input: ["learner_id", "recorded_at", "response_ms", "correct", "is_placement_attempt?"]
    output: PracticeAttempt
    side_effects:
      - "ComputeHeartAndEnergyLimits evaluated for the learner"
      - "ComputePracticeXpAward evaluated for the attempt"
      - "Learner.xp_total += PracticeAttempt.xp_awarded"
      - "when correct is true and outcome is ACCEPTED, LessonNode advances one crown tier"
      - "LessonNode.review_due_at = recorded_at + ComputeSkillDecayAndReviewSchedule.review_interval_days"
      - "StreakState transitions EVALUATING -> QUALIFIED when this is the learner's first accepted attempt on StreakState.focus_date"
      - "EngagementOffer issued with milestone_code STREAK_7 or STREAK_30 when current_length reaches the milestone"
      - "recompute Learner.leaf_count"
  - method: PUT
    path: "/lesson-nodes/{id}/review"
    description: "restore a decayed lesson node through spaced review, or demote it to LOCKED at the retention floor"
    roles: [Learner]
    code: 200
    input: ["learner_id", "expected_node_version"]
    output: LessonNode
    side_effects:
      - "increments LessonNode.version by 1"
      - "LessonNode transitions DECAYED -> UNLOCKED when decay_level < DECAY_LEVEL_FLOOR, otherwise DECAYED -> LOCKED"
      - "recompute ComputeSkillDecayAndReviewSchedule for the node"
      - "recompute Learner.leaf_count"
  - method: GET
    path: "/practice-attempts"
    description: "list practice attempts ordered by recorded_at ascending, optionally filtered by learner or by lesson node"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["learner_id?", "lesson_node_id?", "limit?", "offset?"]
    output: PracticeAttempt[]
    side_effects: []
  - method: GET
    path: "/streak-states"
    description: "list streak rows, optionally filtered by learner"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["learner_id?", "limit?", "offset?"]
    output: StreakState[]
    side_effects: []
  - method: GET
    path: "/practice-attempts/{id}"
    description: "read a single practice attempt with its awarded experience points"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: []
    output: PracticeAttempt
    side_effects: []
  - method: POST
    path: "/streak-states/{id}/repair"
    description: "purchase a streak repair, debiting gems and restoring the length active before the break"
    roles: [Learner]
    code: 200
    input: ["expected_streak_version"]
    output: StreakState
    side_effects:
      - "increments StreakState.version by 1"
      - "recompute ComputeStreakRepairCost for the learner"
      - "Learner.gems_balance -= ComputeStreakRepairCost.purchase_debit"
      - "StreakState transitions BROKEN -> REPAIRED"
      - "StreakState.repair_purchases_this_month += 1"
      - "StreakState.repair_cost_gems = ComputeStreakRepairCost.purchase_debit"
  - method: GET
    path: "/learners/{id}/family-memberships"
    description: "list the family seats held by a learner across subscriptions"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FamilyMembership[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}/family-memberships"
    description: "list the family seats belonging to a subscription"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FamilyMembership[]
    side_effects: []
  - method: POST
    path: "/placement-tests"
    description: "open a placement session for a learner against a course anchor unit"
    roles: [Learner]
    code: 201
    input: ["learner_id", "course_id", "administered_at", "total_items", "expected_learner_version"]
    output: PlacementTest
    side_effects:
      - "increments Learner.version by 1"
      - "PlacementTest.status = CREATED"
      - "PlacementTest.graded_at is left null until the session is scored"
  - method: GET
    path: "/placement-tests"
    description: "list placement sessions ordered by created_at ascending, optionally filtered by learner or by course anchor"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["learner_id?", "course_id?", "limit?", "offset?"]
    output: PlacementTest[]
    side_effects: []
  - method: GET
    path: "/placement-tests/{id}"
    description: "read a placement session with its sub-scores and calibration state"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: []
    output: PlacementTest
    side_effects: []
  - method: PUT
    path: "/placement-tests/{id}"
    description: "present a placement item, submit raw sub-scores, or calibrate the band against the course tree"
    roles: [Learner]
    code: 200
    input: ["action", "lesson_node_id?", "recorded_at?", "response_ms?", "correct?", "comprehension_score?", "accuracy_score?", "proctor_user_id?"]
    output: PlacementTest
    side_effects:
      - "action PRESENT_ITEM records a PracticeAttempt with is_placement_attempt true and transitions CREATED -> IN_PROGRESS"
      - "action SUBMIT_SCORES stores the sub-scores and transitions IN_PROGRESS -> SCORED or CALIBRATED -> SCORED"
      - "action CALIBRATE transitions SCORED -> CALIBRATED, sets PlacementTest.proctor_user_id when supplied, and recomputes ComputePlacementBand"
      - "on CALIBRATE, every LessonNode in units below PlacementTest.placed_unit_index whose prerequisites are satisfied transitions LOCKED -> UNLOCKED"
      - "on CALIBRATE, recompute Learner.leaf_count"
      - "on CALIBRATE, EngagementOffer issued with milestone_code PLACEMENT_SKIP when placed_unit_index is at least 5"
      - "PlacementTest.graded_at = current clock timestamp on SUBMIT_SCORES and on CALIBRATE"
  - method: GET
    path: "/subscriptions"
    description: "list subscription records ordered by created_at ascending, optionally filtered by learner or status"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["learner_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}"
    description: "read a subscription with seat usage and limit-removal posture"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions"
    description: "subscribe a learner to a paid plan, removing heart and energy limits"
    roles: [Learner]
    code: 201
    input: ["learner_id", "plan_code", "seats_total", "auto_renew"]
    output: Subscription
    side_effects:
      - "Subscription transitions FREE -> ACTIVE"
      - "recompute Subscription.limits_removed"
      - "recompute Learner.hearts_available and Learner.energy_units"
      - "every INVITED FamilyMembership under this subscription transitions INVITED -> ACTIVE"
  - method: PUT
    path: "/subscriptions/{id}"
    description: "change plan, redeem an offer, add or remove a family seat, or cancel the subscription"
    roles: [Learner]
    code: 200
    input: ["expected_subscription_version", "plan_code?", "auto_renew?", "offer_id?", "add_seat_learner_id?", "remove_seat_learner_id?", "cancel?"]
    output: Subscription
    side_effects:
      - "increments Subscription.version by 1"
      - "when offer_id is supplied, recompute ComputeCertificationDiscount and transition the EngagementOffer ISSUED -> REDEEMED"
      - "when add_seat_learner_id is supplied, a FamilyMembership is minted in status ACTIVE and Subscription.seats_used += 1"
      - "when remove_seat_learner_id is supplied, the matching FamilyMembership transitions INVITED -> REMOVED or ACTIVE -> REMOVED and Subscription.seats_used -= 1"
      - "when cancel is true, Subscription.auto_renew = false, every ACTIVE FamilyMembership under this subscription transitions ACTIVE -> REMOVED, and Subscription.seats_used = 0"
      - "recompute Subscription.limits_removed"
      - "recompute Learner.hearts_available and Learner.energy_units for the owner and for every member whose seat changed"
      - "Subscription transitions ACTIVE -> FREE when auto_renew is false and the clock is at or past Subscription.current_period_end"
  - method: POST
    path: "/leagues"
    description: "open a league round at a tier for the given week; also joins the acting learner as a standing"
    roles: [PlatformAdmin, Learner]
    code: 201
    input: ["tier", "week_start", "learner_id?"]
    output: League
    side_effects:
      - "League.status = FORMING and League.promotion_cutoff_rank and League.demotion_cutoff_rank are pinned from the league-size constants"
      - "when learner_id is supplied, a LeagueStanding row is created in status GOOD_STANDING and League.member_count becomes 1"
  - method: PUT
    path: "/leagues/{id}"
    description: "run the settlement sweep: flag cheaters, rank the eligible standings, promote and demote them, and re-join a learner"
    roles: [PlatformAdmin]
    code: 200
    input: ["action", "learner_id?"]
    output: League
    side_effects:
      - "action JOIN mints a LeagueStanding in status GOOD_STANDING for learner_id and increments League.member_count"
      - "action SETTLE runs the anti-cheat pass, so every standing whose ComputeLeagueFlags.flagged is true transitions GOOD_STANDING -> FLAGGED"
      - "action SETTLE runs ComputeLeagueRanking over the eligible standings, then transitions ranked standings GOOD_STANDING -> PROMOTED or GOOD_STANDING -> DEMOTED"
      - "action SETTLE issues an EngagementOffer with milestone_code LEAGUE_PROMOTION for every promoted learner"
      - "action SETTLE sets League.settled_at to the current clock timestamp"
      - "action REOPEN advances League.week_start to the current clock timestamp and transitions DEMOTED standings back to GOOD_STANDING"
      - "recompute League.member_count"
  - method: GET
    path: "/league-standings/{id}"
    description: "read a single league standing with its rank and weekly experience points"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: []
    output: LeagueStanding
    side_effects: []
  - method: GET
    path: "/league-standings"
    description: "list league standings, optionally filtered by league, by learner, or by standing id"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["league_id?", "learner_id?", "id?", "limit?", "offset?"]
    output: LeagueStanding[]
    side_effects: []
  - method: POST
    path: "/certification-exams"
    description: "purchase a certification exam product from a scored placement session"
    roles: [Learner]
    code: 201
    input: ["learner_id", "product_code", "proctor_user_id", "proctor_window_hours", "expected_learner_version"]
    output: CertificationExam
    side_effects:
      - "increments Learner.version by 1"
      - "CertificationExam.status = PURCHASED"
      - "CertificationExam.expires_at = current clock timestamp + proctor_window_hours * 3600 seconds"
      - "the PlacementTest whose status is SCORED and whose placed_unit_index is at least 5 transitions SCORED -> CERTIFIED"
  - method: GET
    path: "/certification-exams/{id}"
    description: "read a certification exam with its proctoring window and score band"
    roles: [Learner, CertificationProctor, PlatformAdmin]
    code: 200
    input: []
    output: CertificationExam
    side_effects: []
  - method: PUT
    path: "/certification-exams/{id}"
    description: "advance the exam: open proctoring, submit the raw score, finalize the band with a discipline penalty, or void the session"
    roles: [CertificationProctor, Learner]
    code: 200
    input: ["action", "proctor_user_id?", "discipline_score?", "raw_score?", "discipline_penalty?", "void_reason?"]
    output: CertificationExam
    side_effects:
      - "action PROCTOR transitions PURCHASED -> PROCTORING, sets CertificationExam.proctor_user_id and sets proctor_started_at to the current clock timestamp"
      - "action SUBMIT_SCORE transitions PROCTORING -> SUBMITTED and sets CertificationExam.raw_score"
      - "action FINALIZE transitions SUBMITTED -> SCORED and recomputes ComputeCertificationBand"
      - "action FINALIZE sets CertificationExam.score_band = ComputeCertificationBand.band"
      - "action FINALIZE with void_reason transitions PROCTORING -> VOID, sets score_band to NOT_CERTIFIED, and transitions every ISSUED EngagementOffer for the learner to SUPPRESSED"
  - method: POST
    path: "/certification-exams/{id}/reports"
    description: "generate the institutional score report for a passed exam"
    roles: [CertificationProctor]
    code: 201
    input: ["institution_name", "institution_learner_code"]
    output: ScoreReport
    side_effects:
      - "a ScoreReport row is created carrying the exam's learner_id, raw_score and score_band"
      - "CertificationExam transitions SCORED -> REPORTED and CertificationExam.report_id is set to the created report id"
  - method: GET
    path: "/certification-exams"
    description: "list certification exams, optionally filtered by learner, report or status"
    roles: [Learner, PlatformAdmin]
    code: 200
    input: ["learner_id?", "report_id?", "status?", "limit?", "offset?"]
    output: CertificationExam[]
    side_effects: []
  - method: GET
    path: "/score-reports"
    description: "list institutional score reports, optionally filtered by exam, learner, institution or id"
    roles: [CertificationProctor, PlatformAdmin]
    code: 200
    input: ["exam_id?", "learner_id?", "institution_name?", "id?", "limit?", "offset?"]
    output: ScoreReport[]
    side_effects: []
  - method: GET
    path: "/score-reports/{id}"
    description: "read a single institutional score report"
    roles: [CertificationProctor, PlatformAdmin]
    code: 200
    input: []
    output: ScoreReport
    side_effects: []
  - method: POST
    path: "/engagement-offers"
    description: "issue a conversion offer for an engagement milestone, priced by the discount schedule"
    roles: [PlatformAdmin]
    code: 201
    input: ["learner_id", "milestone_code"]
    output: EngagementOffer
    side_effects:
      - "EngagementOffer.issued_at = current clock timestamp and EngagementOffer.expires_at = issued_at + OFFER_WINDOW_DAYS"
      - "recompute ComputeCertificationDiscount for the offer"
      - "recompute ComputeNotificationCadence for the learner"
      - "EngagementOffer.status = SUPPRESSED when ComputeNotificationCadence.cadence is SUPPRESSED, otherwise ISSUED"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the logical clock. The server's startup default logical time is exactly 2026-09-01T00:00:00Z and the clock never falls back to real wall-clock time before the first call"
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects:
      - "every time-derived calculation recomputes against the new clock value"
  - method: POST
    path: "/_events/auto-transition"
    description: "fire the system sweeps: streak day close, skill decay, league week close and week open, subscription renewal, offer and exam expiry"
    roles: [PlatformAdmin]
    code: 200
    input: ["event_type"]
    output: null
    side_effects:
      - "event_type STREAK_DAY_CLOSE fires the streak freeze sweep once per learner whose local date is ahead of StreakState.focus_date, advancing focus_date by one day and applying the FROZEN or BROKEN transition when no accepted attempt exists on the closed day"
      - "event_type SKILL_DECAY runs ComputeSkillDecayAndReviewSchedule and demotes every lesson node whose decay_meter reaches DECAY_POINTS_PER_TIER"
      - "event_type SUBSCRIPTION_RENEWAL transitions ACTIVE subscriptions past their period end into IN_GRACE, and IN_GRACE subscriptions past their grace window into EXPIRED"
      - "event_type LEAGUE_WEEK_CLOSE drives the league ACTIVE to SETTLING to CLOSED, flagging and ranking the standings"
      - "event_type LEAGUE_WEEK_OPEN drives the league CLOSED back to ACTIVE and restores DEMOTED standings to GOOD_STANDING"
      - "event_type OFFER_EXPIRY transitions ISSUED EngagementOffer rows past their expiry to EXPIRED"
      - "event_type EXAM_EXPIRY transitions PURCHASED CertificationExam rows past their expiry to EXPIRED"
  - method: POST
    path: "/_inject/payment_outcome"
    description: "record the renewal payment outcome for a subscription in grace"
    roles: [PlatformAdmin]
    code: 200
    input: ["subscription_id", "outcome"]
    output: Subscription
    side_effects:
      - "Subscription transitions IN_GRACE -> ACTIVE when outcome is SUCCEEDED"
  - method: POST
    path: "/_inject/gems"
    description: "grant gems to a learner for support and remediation flows"
    roles: [PlatformAdmin]
    code: 200
    input: ["learner_id", "gems"]
    output: Learner
    side_effects:
      - "Learner.gems_balance += gems"
      - "increments Learner.version by 1"
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, or an enum field carries a member outside its declared set"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "the X-User-ID header is absent or empty on an endpoint that requires it"
  - id: ERR_INSUFFICIENT_GEMS
    http: 402
    condition: "a streak repair is attempted while Learner.gems_balance is below ComputeStreakRepairCost.purchase_debit"
  - id: ERR_PLACEMENT_PROBE_USED
    http: 402
    condition: "a FREE learner whose placement test already carries free_probe_used true starts another placement session"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting X-User-Role is not listed in the endpoint's roles, or a learner acts on another learner's resource"
  - id: ERR_LEARNER_NOT_FOUND
    http: 404
    condition: "the learner named by X-User-ID or by learner_id in the body or query does not exist"
  - id: ERR_LESSON_NODE_NOT_FOUND
    http: 404
    condition: "the lesson node named in the path does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "the subscription named in the path does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "the course unit named in the path or by course_id does not exist"
  - id: ERR_PREREQUISITE_NOT_MET
    http: 409
    condition: "the lesson node's prerequisite_node_id references a node whose state is not in {BRONZE, SILVER, GOLD, LEGENDARY}"
  - id: ERR_NODE_LOCKED
    http: 409
    condition: "a practice attempt targets a lesson node whose state is LOCKED"
  - id: ERR_NODE_NOT_DECAYED
    http: 409
    condition: "a review attempt targets a lesson node whose state is not DECAYED"
  - id: ERR_STREAK_NOT_BROKEN
    http: 409
    condition: "a repair is purchased while StreakState.status is not BROKEN"
  - id: ERR_SUBSCRIPTION_INACTIVE
    http: 409
    condition: "a family seat is added when the subscription's status is not ACTIVE"
  - id: ERR_SEAT_QUOTA_EXCEEDED
    http: 409
    condition: "a family seat is added while Subscription.seats_used equals Subscription.seats_total"
  - id: ERR_PLACEMENT_NOT_ACTIVE
    http: 409
    condition: "a placement operation targets a session whose status is not one of {CREATED, IN_PROGRESS, SCORED, CALIBRATED}"
  - id: ERR_EXAM_NOT_PROCTORING
    http: 409
    condition: "an exam submission or void targets an exam whose status is not PROCTORING"
  - id: ERR_LEAGUE_NOT_SETTLING
    http: 409
    condition: "a settlement sweep is fired while the league is not ACTIVE at the week close, or not SETTLING on the closing sweep"
  - id: ERR_DECAY_RETENTION_FLOOR
    http: 409
    condition: "a review targets a decayed node whose decay_level already equals DECAY_LEVEL_FLOOR"
  - id: ERR_HEARTS_EXHAUSTED
    http: 409
    condition: "a non-placement practice attempt is submitted while ComputeHeartAndEnergyLimits.hearts_available is 0"
  - id: ERR_ENERGY_EXHAUSTED
    http: 409
    condition: "a non-placement practice attempt is submitted while ComputeHeartAndEnergyLimits.energy_units is 0"
  - id: ERR_REPAIR_MONTHLY_CAP
    http: 409
    condition: "a repair is purchased while StreakState.repair_purchases_this_month equals MONTHLY_REPAIR_CAP"
  - id: ERR_OFFER_NOT_REDEEMABLE
    http: 409
    condition: "a discounted subscription write names an offer whose status is not ISSUED, or whose expiry has passed"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_learner_version on a placement or exam create, or expected_subscription_version on a subscription write, does not match the parent's current version"
  - id: ERR_CHEAT_PATTERN_DETECTED
    http: 422
    condition: "the learner already holds CHEAT_REF_THRESHOLD practice attempts on this lesson node inside one local focus day with response_ms below FAST_ANSWER_MS"
  - id: ERR_REPAIR_WINDOW_EXPIRED
    http: 422
    condition: "a repair is purchased after StreakState.focus_date plus REPAIR_WINDOW_DAYS"
  - id: ERR_PROCTOR_WINDOW_EXPIRED
    http: 422
    condition: "an exam score is submitted after CertificationExam.proctor_started_at plus PROCTOR_WINDOW_HOURS"
  - id: ERR_PLACEMENT_UNIT_OUT_OF_RANGE
    http: 422
    condition: "a placement session's total_items falls outside [5, 50], or the placement item count exceeds total_items, or a placement item names a lesson node whose unit_index exceeds max(PlacementTest.placed_unit_index, PLACEMENT_PROBE_SPAN)"

roles:
  - name: Learner
    description: "the practicing learner; owns lesson progress, streaks, placement sessions, subscriptions and league standings"
    identity: "entity_backed:Learner"
    exclusive_operations:
      - "POST /learners"
      - "PATCH /learners/{id}"
      - "POST /lesson-nodes/{id}/practice"
      - "PUT /lesson-nodes/{id}/review"
      - "POST /streak-states/{id}/repair"
      - "POST /placement-tests"
      - "PUT /placement-tests/{id} with action PRESENT_ITEM"
      - "PUT /placement-tests/{id} with action SUBMIT_SCORES"
      - "PUT /placement-tests/{id} with action CALIBRATE"
      - "POST /subscriptions"
      - "PUT /subscriptions/{id} with cancel true or offer_id"
      - "POST /certification-exams"
      - "PUT /certification-exams/{id} with action SUBMIT_SCORE"
    shared_operations:
      - "GET /learners/{id}"
      - "GET /course-units/{id}"
      - "GET /course-units/{id}/nodes"
      - "GET /lesson-nodes"
      - "GET /practice-attempts"
      - "GET /streak-states"
      - "POST /streak-states/{id}/freezes"
      - "GET /placement-tests/{id}"
      - "GET /subscriptions"
      - "GET /subscriptions/{id}"
      - "GET /subscriptions/{id}/family-memberships"
      - "GET /family-memberships"
      - "GET /leagues/{id}"
      - "GET /leagues/{id}/standings"
      - "GET /leagues/{id}/all-standings"
      - "GET /certification-exams/{id}"
      - "GET /engagement-offers"
  - name: CertificationProctor
    description: "an opaque operator who supervises proctored certification sessions and files institutional score reports"
    identity: "opaque"
    exclusive_operations:
      - "PUT /certification-exams/{id} with action PROCTOR"
      - "PUT /certification-exams/{id} with action FINALIZE"
      - "POST /certification-exams/{id}/reports"
      - "GET /score-reports"
      - "GET /score-reports/{id}"
    shared_operations:
      - "GET /certification-exams/{id}"
  - name: PlatformAdmin
    description: "an opaque operator who seeds the lesson tree, runs sweeps, sets the logical clock and injects support data"
    identity: "opaque"
    exclusive_operations:
      - "POST /course-units"
      - "POST /course-units/{id}/nodes"
      - "PUT /leagues/{id}"
      - "POST /engagement-offers"
      - "POST /_clock/set_current_utc"
      - "POST /_events/auto-transition"
      - "POST /_inject/payment_outcome"
      - "POST /_inject/gems"
    shared_operations:
      - "GET /learners/{id}"
      - "GET /course-units/{id}"
      - "GET /course-units/{id}/nodes"
      - "GET /lesson-nodes"
      - "GET /practice-attempts"
      - "GET /streak-states"
      - "POST /streak-states/{id}/freezes"
      - "GET /placement-tests/{id}"
      - "GET /subscriptions"
      - "GET /subscriptions/{id}"
      - "GET /subscriptions/{id}/family-memberships"
      - "GET /family-memberships"
      - "GET /leagues/{id}"
      - "GET /leagues/{id}/standings"
      - "GET /leagues/{id}/all-standings"
      - "GET /certification-exams/{id}"
      - "GET /score-reports"
      - "GET /engagement-offers"
  - name: Anonymous
    description: "an unauthenticated caller who may only register a new learner"
    identity: "opaque"
    exclusive_operations:
      - "POST /learners"
    shared_operations: []
