# =============================================================================
# Task 1814 — Move-In/Move-Out Inspection & Deposit Accounting
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1814. Move-In/Move-Out Inspection & Deposit Accounting (residential property
  manager): condition documentation with photos at move-in, damage vs normal
  wear determination at move-out, itemized deduction statement within statutory
  deadline, deposit interest requirement by jurisdiction, disputed deduction &
  small claims exposure, carpet/paint depreciation schedules, key/fob return &
  lock change charges, unclaimed deposit escheatment

domain_name: move-in-out-deposit-accounting
api_prefix: /pm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: JurisdictionProfile
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code (e.g. CA-ACT)" }
      - { name: deposit_return_deadline_days, type: integer, source: input, description: "Calendar days after move-out within which the itemized statement must be issued" }
      - { name: dispute_window_days, type: integer, source: input, description: "Calendar days after statement issuance during which the tenant may open a dispute" }
      - { name: interest_required, type: boolean, source: input, description: "Whether deposits must accrue interest" }
      - { name: annual_interest_rate_bp, type: integer, source: input, description: "Annual deposit interest rate in basis points" }
      - { name: interest_basis, type: enum, source: input, description: "ACTUAL_DAYS | WHOLE_YEARS — selects the deposit_interest variant" }
      - { name: stale_check_days, type: integer, source: input, description: "Days after sent_at when an uncashed disbursement becomes STALE_DATED" }
      - { name: small_claims_cap_cents, type: integer, source: input, description: "Maximum total tenant recovery in small claims" }
      - { name: bad_faith_multiplier, type: integer, source: input, description: "Damages multiplier applied when the statement was issued late" }
      - { name: lock_change_allowed, type: boolean, source: input, description: "Whether a lock-change charge may be billed for unreturned keys" }
      - { name: allow_actual_cost_charge, type: boolean, source: input, description: "Whether documented actual repair cost may be charged instead of depreciated value" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: jurisdiction_profile_id, type: string, source: input, description: "FK -> JurisdictionProfile.id; governing jurisdiction for deadline, interest, and penalty rules" }
      - { name: key_charge_cents, type: integer, source: input, description: "Fee per unreturned key" }
      - { name: fob_charge_cents, type: integer, source: input, description: "Fee per unreturned fob" }
      - { name: lock_change_cents, type: integer, source: input, description: "Lock-change charge billed when at least one key is unreturned and the jurisdiction allows it" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: unit_number, type: string, source: input, description: "Unit label" }
      - { name: carpet_installed_on, type: string, source: input, description: "Date (YYYY-MM-DD) current carpet was installed" }
      - { name: carpet_life_years, type: integer, source: input, description: "Expected useful life of carpet in years" }
      - { name: paint_applied_on, type: string, source: input, description: "Date (YYYY-MM-DD) interior was last painted" }
      - { name: paint_life_years, type: integer, source: input, description: "Expected useful life of interior paint in years" }
      - { name: occupancy_status, type: enum, source: computed, description: "AVAILABLE | OCCUPIED | RESERVED — derived from non-terminal tenancies on this unit" }

  - name: Tenancy
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: tenant_display_name, type: string, source: input, description: "Tenant legal name" }
      - { name: forwarding_address, type: string, source: input, default: null, description: "Forwarding address for the refund; may be set until statement issuance" }
      - { name: lease_start_on, type: string, source: input, description: "Lease start date (YYYY-MM-DD); half-open interval start" }
      - { name: lease_end_on, type: string, source: input, description: "Lease end date (YYYY-MM-DD); half-open interval end" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Monthly rent" }
      - { name: deposit_cents, type: integer, source: input, description: "Security deposit held" }
      - { name: keys_issued, type: integer, source: input, description: "Keys issued at move-in" }
      - { name: fobs_issued, type: integer, source: input, description: "Fobs issued at move-in" }
      - { name: keys_returned, type: integer, source: system, default: 0, description: "Keys returned so far" }
      - { name: fobs_returned, type: integer, source: system, default: 0, description: "Fobs returned so far" }
      - { name: move_in_on, type: string, source: system, default: null, description: "Date set when the MOVE_IN inspection completes" }
      - { name: notice_given_on, type: string, source: system, default: null, description: "Date notice to vacate was recorded" }
      - { name: move_out_on, type: string, source: system, default: null, description: "Date set when the MOVE_OUT inspection completes; drives deadline and interest cutoff" }
      - { name: interest_accrued_cents, type: integer, source: computed, default: 0, description: "Deposit interest accrued through move_out_on per deposit_interest" }
      - { name: pending_deductions_cents, type: integer, source: computed, default: 0, description: "Sum of this tenancy's DeductionItem.amount_cents in status DRAFT" }
      - { name: total_deductions_cents, type: integer, source: computed, default: 0, description: "Sum of this tenancy's DeductionItem.amount_cents in status BILLED" }
      - { name: refund_paid_cents, type: integer, source: computed, default: 0, description: "Sum of CASHED REFUND disbursement amounts" }
      - { name: penalty_paid_cents, type: integer, source: computed, default: 0, description: "Sum of CASHED PENALTY disbursement amounts; outside the deposit ledger" }
      - { name: escheated_cents, type: integer, source: computed, default: 0, description: "Sum of ESCHEATED disbursement amounts remitted to the state" }
      - { name: balance_remaining_cents, type: integer, source: computed, description: "deposit_cents + interest_accrued_cents - total_deductions_cents + released_cents - refund_paid_cents - escheated_cents - reserved_cents" }
      - { name: released_cents, type: integer, source: computed, default: 0, description: "Deductions released back to the tenant by dispute outcomes on the current statement" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum of SENT REFUND disbursement amounts (funds in flight)" }
      - { name: status, type: enum, source: system, description: "PENDING_MOVE_IN | OCCUPIED | NOTICE_GIVEN | VACATED | SETTLED | ESCHEATED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id" }
      - { name: kind, type: enum, source: input, description: "MOVE_IN | MOVE_OUT" }
      - { name: inspector_user_id, type: string, source: input, description: "Opaque user id of the Inspector role assigned to perform this inspection" }
      - { name: scheduled_start_at, type: string, source: input, description: "ISO8601 start of the appointment window; closed interval start" }
      - { name: scheduled_end_at, type: string, source: input, description: "ISO8601 end of the appointment window; closed interval end" }
      - { name: completed_at, type: string, source: system, default: null, description: "Timestamp of completion from the logical clock" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPLETED" }

  - name: InspectionItem
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id" }
      - { name: area_name, type: string, source: input, description: "Area or surface (e.g. living_room_carpet)" }
      - { name: category, type: enum, source: input, description: "CARPET | PAINT | OTHER — selects the depreciation schedule" }
      - { name: condition, type: enum, source: input, description: "NEW | GOOD | FAIR | WORN | DAMAGED | MISSING" }
      - { name: photo_count, type: integer, source: input, description: "Number of attached condition photos; >= 1 required when condition is WORN, DAMAGED, or MISSING" }
      - { name: determination, type: enum, source: input, default: "UNASSESSED", description: "UNASSESSED | NORMAL_WEAR | TENANT_DAMAGE; MOVE_OUT items must be assessed before completion" }
      - { name: linked_move_in_item_id, type: string, source: input, default: null, description: "FK -> InspectionItem.id; the matching item from this tenancy's COMPLETED MOVE_IN inspection" }
      - { name: replacement_cost_cents, type: integer, source: input, default: null, description: "Full replacement cost; required when determination is TENANT_DAMAGE" }
      - { name: actual_repair_cents, type: integer, source: input, default: null, description: "Documented actual repair cost; selects the ACTUAL_COST damage_charge variant when the jurisdiction allows it" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text notes" }

  - name: DeductionItem
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id" }
      - { name: inspection_item_id, type: string, source: system, default: null, description: "FK -> InspectionItem.id; set for system-created MOVE_OUT_DAMAGE deductions" }
      - { name: statement_id, type: string, source: system, default: null, description: "FK -> DepositStatement.id; set when swept into an issued statement" }
      - { name: source, type: enum, source: input, description: "MOVE_OUT_DAMAGE | KEY_NOT_RETURNED | FOB_NOT_RETURNED | LOCK_CHANGE | UNPAID_RENT | CLEANING | OTHER" }
      - { name: description, type: string, source: input, description: "Itemized description shown on the statement" }
      - { name: quantity, type: integer, source: system, default: 1, description: "Units charged (key/fob counts); 1 for non-counted sources" }
      - { name: amount_cents, type: integer, source: computed, description: "Charge amount; system-computed for depreciation and key/fob/lock sources, copied from input for manual sources" }
      - { name: status, type: enum, source: system, description: "DRAFT | BILLED" }

  - name: DepositStatement
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: system, description: "FK -> Tenancy.id" }
      - { name: statement_seq, type: integer, source: system, description: "Per-tenancy sequence number starting at 1; ordering key for supersession" }
      - { name: issued_at, type: string, source: system, default: null, description: "Timestamp of issuance from the logical clock" }
      - { name: deadline_on, type: string, source: computed, default: null, description: "move_out_on + deposit_return_deadline_days; issuance is timely when date(issued_at) <= deadline_on" }
      - { name: late, type: boolean, source: computed, default: null, description: "True when issued after deadline_on; marks the statutory violation and drives the bad-faith multiplier in small_claims_exposure" }
      - { name: interest_cents, type: integer, source: computed, default: 0, description: "Interest credited on this statement (snapshot of tenancy interest at issuance)" }
      - { name: deduction_total_cents, type: integer, source: computed, default: 0, description: "Sum of BILLED deductions swept at issuance (billed regardless of lateness)" }
      - { name: released_cents, type: integer, source: system, default: 0, description: "Amount of the disputed portion released back to the tenant by dispute outcomes" }
      - { name: refund_due_cents, type: integer, source: computed, default: 0, description: "deposit_cents + interest_cents - deduction_total_cents + released_cents (0 while DRAFT)" }
      - { name: projected_deductions_cents, type: integer, source: computed, default: 0, description: "While DRAFT: mirrors tenancy.pending_deductions_cents" }
      - { name: projected_refund_cents, type: integer, source: computed, default: 0, description: "While DRAFT: deposit_cents + interest_accrued_cents - projected_deductions_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | SUPERSEDED | SETTLED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> DepositStatement.id" }
      - { name: tenancy_id, type: string, source: system, description: "FK -> Tenancy.id; copied from the statement at creation" }
      - { name: disputed_amount_cents, type: integer, source: input, description: "Portion of the deduction total being disputed" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: counter_amount_cents, type: integer, source: system, default: null, description: "Manager's counter-offer: amount of the disputed portion the manager keeps" }
      - { name: exposure_cents, type: integer, source: computed, default: null, description: "Small-claims exposure computed at escalation per small_claims_exposure" }
      - { name: status, type: enum, source: system, description: "OPEN | MANAGER_COUNTERED | CLOSED_AGREED | ESCALATED_SMALL_CLAIMS | COURT_RESOLVED | WITHDRAWN" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: tenancy_id, type: string, source: input, description: "FK -> Tenancy.id" }
      - { name: statement_id, type: string, source: input, description: "FK -> DepositStatement.id; must be the tenancy's current non-superseded statement" }
      - { name: kind, type: enum, source: input, description: "REFUND | PENALTY" }
      - { name: amount_cents, type: integer, source: input, description: "Disbursement amount; REFUND is reserved against balance_remaining_cents at creation" }
      - { name: payee_name, type: string, source: input, description: "Payee on the check" }
      - { name: sent_at, type: string, source: system, description: "Timestamp of creation from the logical clock; checks are considered mailed immediately" }
      - { name: cashed_at, type: string, source: system, default: null, description: "Timestamp when marked cashed" }
      - { name: escheatment_reference, type: string, source: system, default: null, description: "State remittance reference recorded at escheat" }
      - { name: status, type: enum, source: system, description: "SENT | CASHED | REVERSED | STALE_DATED | ESCHEATED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Tenancy
    initial_state: PENDING_MOVE_IN
    terminal_states: [ESCHEATED]
    transitions:
      - from: PENDING_MOVE_IN
        to: OCCUPIED
        trigger: "POST /pm/inspections/{id}/complete with kind MOVE_IN"
        actor: Inspector
        preconditions:
          - "Inspection.kind == MOVE_IN and status == DRAFT"
          - "All items satisfy the photo documentation rule (ERR_PHOTO_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "Tenancy.move_in_on = date of logical clock"
          - "Unit.occupancy_status recomputed to OCCUPIED"
      - from: OCCUPIED
        to: NOTICE_GIVEN
        trigger: "POST /pm/tenancies/{id}/give_notice"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "Tenancy.notice_given_on = date of logical clock"
          - "Unit.occupancy_status recomputed to RESERVED"
      - from: NOTICE_GIVEN
        to: VACATED
        trigger: "POST /pm/inspections/{id}/complete with kind MOVE_OUT"
        actor: Inspector
        preconditions:
          - "Inspection.kind == MOVE_OUT and status == DRAFT"
          - "Every item has determination != UNASSESSED (ERR_ITEM_NOT_ASSESSED)"
          - "Photo documentation rule holds on all items (ERR_PHOTO_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "Tenancy.move_out_on = date of logical clock"
          - "Cascade link 1: create DeductionItems — one per TENANT_DAMAGE item with charge > 0 (damage_charge), plus key/fob/lock deductions from unreturned counts (key_fob_lock_charge)"
          - "Cascade link 2: each DeductionItem creation recomputes Tenancy.pending_deductions_cents"
          - "Cascade link 3: the pending_deductions_cents change recomputes the DRAFT DepositStatement's projected_deductions_cents and projected_refund_cents, when one exists"
          - "deposit_interest accrual runs: Tenancy.interest_accrued_cents set"
          - "Unit.occupancy_status recomputed to AVAILABLE"
      - from: VACATED
        to: SETTLED
        trigger: "system (automatic when the current statement becomes SETTLED)"
        actor: system
        preconditions:
          - "Current DepositStatement reaches SETTLED"
        side_effects: []
      - from: SETTLED
        to: VACATED
        trigger: "system (automatic when a CASHED REFUND disbursement is reversed)"
        actor: system
        preconditions:
          - "refund_paid_cents falls below the statement refund_due_cents after the reversal"
        side_effects:
          - "Statement reverts SETTLED -> ISSUED"
      - from: VACATED
        to: ESCHEATED
        trigger: "system (automatic on escheat completion)"
        actor: system
        preconditions:
          - "A disbursement escheat leaves balance_remaining_cents == 0 AND no SENT disbursements remain"
        side_effects: []

  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /pm/inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "Cross-entity gate: Tenancy.status == PENDING_MOVE_IN for kind MOVE_IN; == NOTICE_GIVEN for kind MOVE_OUT (ERR_INVALID_STATE_TRANSITION)"
          - "MOVE_OUT: all items assessed (ERR_ITEM_NOT_ASSESSED)"
          - "Photo documentation rule holds (ERR_PHOTO_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "completed_at = logical clock"
          - "MOVE_IN: tenancy PENDING_MOVE_IN -> OCCUPIED"
          - "MOVE_OUT: tenancy NOTICE_GIVEN -> VACATED; deduction-creation cascade fires"

  - entity: DepositStatement
    initial_state: DRAFT
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /pm/statements/{id}/issue"
        actor: PropertyManager
        preconditions:
          - "Tenancy.status == VACATED (ERR_TENANCY_NOT_VACATED)"
        side_effects:
          - "issued_at = logical clock; deadline_on = move_out_on + deposit_return_deadline_days; late = date(issued_at) > deadline_on"
          - "Sweep all DRAFT DeductionItems of the tenancy to BILLED with statement_id set (deductions are billed even when late; lateness is exposed via the late flag and punished through the small-claims multiplier, not forfeiture)"
          - "statement_totals: interest_cents, deduction_total_cents, refund_due_cents computed"
          - "Tenancy.total_deductions_cents and pending_deductions_cents recomputed"
      - from: ISSUED
        to: DISPUTED
        trigger: "system (automatic when a Dispute is opened against this statement)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /pm/statements/{id}/reopen"
        actor: PropertyManager
        preconditions:
          - "An active dispute (OPEN, MANAGER_COUNTERED, or ESCALATED_SMALL_CLAIMS) exists for this statement"
        side_effects:
          - "Compensating action: this statement's BILLED DeductionItems revert to DRAFT (statement_id cleared)"
          - "released_cents reset to 0; refund_due_cents reset to 0; issued_at/deadline_on/late cleared"
          - "The active Dispute -> WITHDRAWN"
          - "Tenancy.total_deductions_cents and pending_deductions_cents recomputed"
      - from: DISPUTED
        to: ISSUED
        trigger: "system (automatic when the active dispute reaches CLOSED_AGREED or COURT_RESOLVED)"
        actor: system
        preconditions: []
        side_effects:
          - "statement_totals recompute refund_due_cents with updated released_cents"
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system (automatic when POST /pm/statements creates a newer statement for the same tenancy)"
        actor: system
        preconditions: []
        side_effects:
          - "The active Dispute -> WITHDRAWN"
      - from: ISSUED
        to: SETTLED
        trigger: "system (automatic when refund_paid_cents >= refund_due_cents and no dispute of this statement is in OPEN, MANAGER_COUNTERED, or ESCALATED_SMALL_CLAIMS)"
        actor: system
        preconditions: []
        side_effects:
          - "Bubble up: Tenancy VACATED -> SETTLED"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [CLOSED_AGREED, COURT_RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: MANAGER_COUNTERED
        trigger: "POST /pm/disputes/{id}/counter"
        actor: PropertyManager
        preconditions:
          - "counter_amount_cents <= disputed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "counter_amount_cents recorded"
      - from: MANAGER_COUNTERED
        to: CLOSED_AGREED
        trigger: "POST /pm/disputes/{id}/close_agreed"
        actor: Tenant
        preconditions:
          - "Acting Tenant's X-User-ID equals dispute.tenancy_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "Statement.released_cents += (disputed_amount_cents - counter_amount_cents)"
          - "Statement DISPUTED -> ISSUED; refund_due_cents recomputed"
      - from: OPEN
        to: ESCALATED_SMALL_CLAIMS
        trigger: "POST /pm/disputes/{id}/escalate"
        actor: Tenant
        preconditions:
          - "Acting Tenant's X-User-ID equals dispute.tenancy_id"
        side_effects:
          - "small_claims_exposure computes exposure_cents"
      - from: MANAGER_COUNTERED
        to: ESCALATED_SMALL_CLAIMS
        trigger: "POST /pm/disputes/{id}/escalate"
        actor: Tenant
        preconditions:
          - "Acting Tenant's X-User-ID equals dispute.tenancy_id"
        side_effects:
          - "small_claims_exposure computes exposure_cents"
      - from: ESCALATED_SMALL_CLAIMS
        to: COURT_RESOLVED
        trigger: "POST /pm/disputes/{id}/resolve_court"
        actor: PropertyManager
        preconditions:
          - "awarded_amount_cents <= disputed_amount_cents (ERR_AWARD_EXCEEDS_DISPUTED)"
        side_effects:
          - "court_resolution_settlement: released_cents += awarded_amount_cents; penalty disbursement auto-created when the statement was late"
          - "Statement DISPUTED -> ISSUED; refund_due_cents recomputed"
      - from: OPEN
        to: WITHDRAWN
        trigger: "system (automatic when the statement is reopened or superseded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MANAGER_COUNTERED
        to: WITHDRAWN
        trigger: "system (automatic when the statement is reopened or superseded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Disbursement
    initial_state: SENT
    terminal_states: [REVERSED, ESCHEATED]
    transitions:
      - from: SENT
        to: CASHED
        trigger: "POST /pm/disbursements/{id}/mark_cashed"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "cashed_at = logical clock; Tenancy.reserved_cents -= amount_cents"
          - "REFUND: refund_paid_cents += amount_cents; if this brings refund_paid_cents >= statement refund_due_cents and no active dispute: statement ISSUED -> SETTLED (bubble up)"
          - "PENALTY: penalty_paid_cents += amount_cents"
      - from: SENT
        to: STALE_DATED
        trigger: "system (POST /pm/ops/run_daily_cycle when logical clock > sent_at + stale_check_days)"
        actor: system
        preconditions:
          - "logical clock timestamp > sent_at + stale_check_days (strictly greater)"
        side_effects:
          - "Cascade link 1: this disbursement flips to STALE_DATED, voiding the uncashed check"
          - "Cascade link 2: the flip releases the reservation — Tenancy.reserved_cents -= amount_cents, balance_remaining_cents recomputed"
      - from: STALE_DATED
        to: ESCHEATED
        trigger: "POST /pm/disbursements/{id}/escheat"
        actor: PropertyManager
        preconditions:
          - "escheatment_reference must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "escheatment_reference recorded; Tenancy.escheated_cents += amount_cents; balance_remaining_cents -= amount_cents"
          - "If balance_remaining_cents == 0 and no SENT disbursements remain: Tenancy -> ESCHEATED"
      - from: CASHED
        to: REVERSED
        trigger: "POST /pm/disbursements/{id}/reverse"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "Compensating action: REFUND — refund_paid_cents -= amount_cents; PENALTY — penalty_paid_cents -= amount_cents"
          - "If tenancy was SETTLED and refund_paid_cents now < refund_due_cents: Tenancy SETTLED -> VACATED and statement SETTLED -> ISSUED"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: statement-create-stale-tenancy
    parent_entity: Tenancy
    write_endpoint: "POST /pm/statements"
    occ_field: expected_tenancy_version
    description: |
      Creating a DepositStatement against a Tenancy whose version has advanced
      since the client last observed it is rejected. A successful creation
      supersedes a DISPUTED predecessor and bumps Tenancy.version, so a second
      create carrying the previously observed version is working from stale
      state and must fail with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: deposit_interest
    trigger: "MOVE_OUT inspection completion (accrues through move_out_on)"
    algorithm: threshold
    formula: |
      if jurisdiction.interest_required == false: interest = 0
      variant ACTUAL_DAYS:
        days = move_out_on - move_in_on (whole days)
        interest = round_half_up(deposit_cents * annual_interest_rate_bp / 10000 * days / 365)
      variant WHOLE_YEARS:
        years = floor((move_out_on - move_in_on) / 365)
        interest = SUM over i in 1..years of round_half_up(deposit_cents * annual_interest_rate_bp / 10000)
        (round per completed year, THEN sum — rounding order is pinned; do not
        compute years * deposit * rate and round once)
    input_set: "Tenancy.deposit_cents, move_in_on, move_out_on; JurisdictionProfile of the tenancy's property"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer cents, round_half_up"
    variants:
      - name: ACTUAL_DAYS
        when: "jurisdiction.interest_basis == ACTUAL_DAYS"
        difference: "Daily accrual including partial years; single final rounding"
      - name: WHOLE_YEARS
        when: "jurisdiction.interest_basis == WHOLE_YEARS"
        difference: "Only completed 365-day years accrue; per-year rounding then sum"

  - name: damage_charge
    trigger: "MOVE_OUT inspection completion, once per item with determination == TENANT_DAMAGE"
    algorithm: decay_function
    formula: |
      category CARPET: installed_on = unit.carpet_installed_on, life_days = unit.carpet_life_years * 365
      category PAINT:  installed_on = unit.paint_applied_on,   life_days = unit.paint_life_years * 365
      age_days = move_out_on - installed_on
      residual_fraction = max(0, life_days - age_days) / life_days
      variant DEPRECIATED (default):
        charge = round_half_up(replacement_cost_cents * residual_fraction)
      variant ACTUAL_COST (only when jurisdiction.allow_actual_cost_charge == true
                           AND item.actual_repair_cents is provided):
        charge = min(actual_repair_cents, replacement_cost_cents)   # no depreciation
      category OTHER: charge = replacement_cost_cents (no schedule)
      NORMAL_WEAR determination: no deduction is created.
      If computed charge == 0: no DeductionItem is created.
    input_set: "MOVE_OUT InspectionItems with determination TENANT_DAMAGE; Unit depreciation schedules; JurisdictionProfile.allow_actual_cost_charge"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer cents, round_half_up"
    variants:
      - name: DEPRECIATED
        when: "default; straight-line residual of the schedule"
        difference: "Charge shrinks with item age; zero at or beyond end of life"
      - name: ACTUAL_COST
        when: "jurisdiction allows it and documented actual cost is provided"
        difference: "Documented cost capped at full replacement; ignores age"

  - name: key_fob_lock_charge
    trigger: "MOVE_OUT inspection completion, after damage deductions"
    algorithm: tiered_pricing
    formula: |
      missing_keys = keys_issued - keys_returned
      missing_fobs = fobs_issued - fobs_returned
      if missing_keys > 0: create DeductionItem(KEY_NOT_RETURNED, quantity = missing_keys,
        amount = missing_keys * property.key_charge_cents)
      if missing_fobs > 0: create DeductionItem(FOB_NOT_RETURNED, quantity = missing_fobs,
        amount = missing_fobs * property.fob_charge_cents)
      if missing_keys > 0 AND jurisdiction.lock_change_allowed == true:
        create DeductionItem(LOCK_CHANGE, quantity = 1, amount = property.lock_change_cents)
      (Conditional branch: the lock-change line exists only when at least one key
      is missing AND the jurisdiction permits it; counts are snapshotted at
      move-out completion — key returns are closed once the tenancy is VACATED.)
    input_set: "Tenancy keys/fobs issued and returned; Property fee schedule; JurisdictionProfile.lock_change_allowed"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: statement_totals
    trigger: "POST /pm/statements/{id}/issue; recomputed on dispute close_agreed / resolve_court"
    algorithm: aggregation
    formula: |
      at issuance:
        deadline_on = move_out_on + jurisdiction.deposit_return_deadline_days
        late = date(issued_at) > deadline_on
        deduction_total_cents = SUM(amount_cents of swept DRAFT lines, each already rounded to cents at creation) — per-line rounding then sum; the lines become BILLED whether or not the statement is late
        interest_cents = tenancy.interest_accrued_cents
        refund_due_cents = deposit_cents + interest_cents - deduction_total_cents
      on dispute resolution:
        refund_due_cents = deposit_cents + interest_cents - deduction_total_cents + released_cents
    input_set: "Tenancy DRAFT deductions at issuance; DepositStatement.released_cents afterwards"
    constants: {}
    precision: "integer cents; per-line rounding at line creation, then sum"
    variants: []

  - name: small_claims_exposure
    trigger: "POST /pm/disputes/{id}/escalate"
    algorithm: threshold
    formula: |
      base = disputed_amount_cents
      if statement.late == true: base = disputed_amount_cents * jurisdiction.bad_faith_multiplier
      exposure_cents = min(jurisdiction.small_claims_cap_cents, base)
    input_set: "Dispute.disputed_amount_cents; DepositStatement.late; JurisdictionProfile caps"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: court_resolution_settlement
    trigger: "POST /pm/disputes/{id}/resolve_court"
    algorithm: waterfall_allocation
    formula: |
      released_delta = awarded_amount_cents
      statement.released_cents += released_delta
      tenant_total_recovery = min(dispute.exposure_cents,
                                  awarded_amount_cents * (statement.late ? jurisdiction.bad_faith_multiplier : 1))
      penalty_cents = tenant_total_recovery - awarded_amount_cents
      if penalty_cents > 0: auto-create Disbursement(kind = PENALTY, amount = penalty_cents, status SENT)
      statement refund_due_cents recomputed per statement_totals
    input_set: "Dispute (escalated), DepositStatement.late, JurisdictionProfile"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: deposit_reconciliation
    trigger: "on every mutation of tenancy money fields (invariant documentation)"
    algorithm: aggregation
    formula: |
      balance_remaining_cents = deposit_cents + interest_accrued_cents
                                - total_deductions_cents + released_cents
                                - refund_paid_cents - escheated_cents - reserved_cents
      where total_deductions_cents sums BILLED DeductionItems of the tenancy,
      released_cents mirrors the current statement's released_cents,
      reserved_cents sums SENT REFUND disbursements, and
      escheated_cents sums ESCHEATED disbursements.
    input_set: "All DeductionItems and Disbursements of the tenancy"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: unit_occupancy_derivation
    trigger: "tenancy creation and every tenancy status change"
    algorithm: aggregation
    formula: |
      if any tenancy of the unit has status == OCCUPIED: OCCUPIED
      elif any tenancy of the unit has status IN {NOTICE_GIVEN, PENDING_MOVE_IN}: RESERVED
      else: AVAILABLE
    input_set: "Tenancies of the unit with status NOT IN {SETTLED, ESCHEATED}"
    constants: {}
    precision: "n/a"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be permitted on the endpoint; for Tenant (entity_backed:Tenancy) the X-User-ID must equal the tenancy_id of the target resource"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body must parse and contain all required fields with well-typed, non-negative values (schema check precedes id resolution)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path and body-referenced resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "State preconditions: every action endpoint requires a from-state that exists in its machine (ERR_INVALID_STATE_TRANSITION); issue additionally requires the tenancy VACATED (ERR_TENANCY_NOT_VACATED); dispute creation requires the referenced statement ISSUED or DISPUTED (ERR_STATEMENT_NOT_DISPUTABLE); disbursement creation — only when the referenced statement IS the tenancy's current (latest statement_seq) statement — requires it ISSUED or SETTLED (ERR_INVALID_STATE_TRANSITION while the current statement is DRAFT; non-current references are the referential concern of priority 7)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_TENANCY_NOT_VACATED | ERR_STATEMENT_NOT_DISPUTABLE"
    http_status: 409
    applies_to: "all action endpoints (complete, give_notice, issue, reopen, counter, close_agreed, escalate, resolve_court, mark_cashed, reverse, escheat); POST /pm/disputes; POST /pm/disbursements"
  - priority: 6
    category: business_temporal
    check: "Dispute creation date must satisfy date(now) <= statement issued date + dispute_window_days"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /pm/disputes"
  - priority: 7
    category: business_referential
    check: "Referenced objects must be the live ones: disbursement.statement_id must be the tenancy's current non-superseded statement; linked_move_in_item_id must point to an item of this tenancy's COMPLETED MOVE_IN inspection"
    error_id: "ERR_STATEMENT_SUPERSEDED | ERR_ITEM_LINK_MISMATCH"
    http_status: 409
    applies_to: "POST /pm/disbursements; POST /pm/inspections/{id}/items"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and scheduling: jurisdiction code unique; one active statement per tenancy; at most one dispute per statement in OPEN, MANAGER_COUNTERED, or ESCALATED_SMALL_CLAIMS; tenancy lease intervals on a unit must not overlap (half-open); an inspector's DRAFT inspection windows must not overlap (closed)"
    error_id: "ERR_DUPLICATE_JURISDICTION_CODE | ERR_STATEMENT_ALREADY_ACTIVE | ERR_DISPUTE_ALREADY_OPEN | ERR_UNIT_OCCUPANCY_OVERLAP | ERR_INSPECTOR_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "POST /pm/jurisdiction-profiles; POST /pm/statements; POST /pm/disputes; POST /pm/tenancies; POST /pm/inspections"
  - priority: 9
    category: business_safety
    check: "Compliance documentation: items with condition WORN/DAMAGED/MISSING require photo_count >= 1; MOVE_OUT completion requires every item assessed"
    error_id: "ERR_PHOTO_DOCUMENTATION_REQUIRED | ERR_ITEM_NOT_ASSESSED"
    http_status: 422
    applies_to: "POST /pm/inspections/{id}/items; POST /pm/inspections/{id}/complete"
  - priority: 10
    category: business_fiscal
    check: "Money sanity: REFUND disbursement amount <= balance_remaining_cents; disputed_amount_cents in [1, deduction_total_cents]; awarded_amount_cents <= disputed_amount_cents; return counts <= issued counts"
    error_id: "ERR_AMOUNT_EXCEEDS_BALANCE | ERR_DISPUTE_AMOUNT_INVALID | ERR_AWARD_EXCEEDS_DISPUTED | ERR_RETURN_COUNT_EXCEEDS_ISSUED"
    http_status: 409
    applies_to: "POST /pm/disbursements; POST /pm/disputes; POST /pm/disputes/{id}/resolve_court; POST /pm/tenancies/{id}/record_key_return"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock & ops checkpoint ---
  - method: POST
    path: "/pm/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [ManagerAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/pm/ops/run_daily_cycle"
    description: "Ops-run checkpoint: flips SENT disbursements whose sent_at + stale_check_days is strictly before the logical clock to STALE_DATED, releasing their balance reservations"
    roles: [ManagerAdmin]
    code: 200
    input: []
    output: { stale_dated_count: integer, stale_dated_disbursement_ids: "string[]" }
    side_effects:
      - "Each flip recomputes the owning Tenancy.reserved_cents and balance_remaining_cents"

  # --- JurisdictionProfile ---
  - method: POST
    path: "/pm/jurisdiction-profiles"
    description: "Create a jurisdiction rule profile"
    roles: [ManagerAdmin]
    code: 201
    input: [code, deposit_return_deadline_days, dispute_window_days, interest_required, annual_interest_rate_bp, interest_basis, stale_check_days, small_claims_cap_cents, bad_faith_multiplier, lock_change_allowed, allow_actual_cost_charge]
    output: JurisdictionProfile
    side_effects: ["ERR_DUPLICATE_JURISDICTION_CODE if code already exists"]

  - method: GET
    path: "/pm/jurisdiction-profiles/{id}"
    description: "Get a jurisdiction profile"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: JurisdictionProfile
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/pm/properties"
    description: "Create a property with its key/fob/lock fee schedule"
    roles: [ManagerAdmin]
    code: 201
    input: [name, address, jurisdiction_profile_id, key_charge_cents, fob_charge_cents, lock_change_cents]
    output: Property
    side_effects: []

  - method: GET
    path: "/pm/properties/{id}"
    description: "Get a property"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/pm/properties"
    description: "List properties"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["jurisdiction_profile_id?", "limit?", "offset?"]
    output: "Property[]"
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/pm/units"
    description: "Create a unit with carpet/paint depreciation schedules"
    roles: [ManagerAdmin]
    code: 201
    input: [property_id, unit_number, carpet_installed_on, carpet_life_years, paint_applied_on, paint_life_years]
    output: Unit
    side_effects: ["occupancy_status = AVAILABLE"]

  - method: GET
    path: "/pm/units/{id}"
    description: "Get a unit"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/pm/units"
    description: "List units"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: "Unit[]"
    side_effects: []

  # --- Tenancy ---
  - method: POST
    path: "/pm/tenancies"
    description: "Create a tenancy; half-open lease interval [lease_start_on, lease_end_on) must not overlap another tenancy on the same unit (adjacency allowed)"
    roles: [PropertyManager]
    code: 201
    input: [unit_id, tenant_display_name, lease_start_on, lease_end_on, monthly_rent_cents, deposit_cents, keys_issued, fobs_issued, "forwarding_address?"]
    output: Tenancy
    side_effects:
      - "status = PENDING_MOVE_IN; keys_returned = fobs_returned = 0; all money counters 0"
      - "Unit.occupancy_status recomputed (PENDING_MOVE_IN counts as RESERVED)"
      - "ERR_UNIT_OCCUPANCY_OVERLAP when lease interval overlaps an existing tenancy of the unit"

  - method: GET
    path: "/pm/tenancies/{id}"
    description: "Get a tenancy"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: Tenancy
    side_effects: []

  - method: GET
    path: "/pm/tenancies"
    description: "List tenancies"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "Tenancy[]"
    side_effects: []

  - method: POST
    path: "/pm/tenancies/{id}/give_notice"
    description: "Record tenant's notice to vacate; OCCUPIED -> NOTICE_GIVEN"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Tenancy
    side_effects: ["notice_given_on = date of logical clock; increments Tenancy.version by 1"]

  - method: POST
    path: "/pm/tenancies/{id}/record_key_return"
    description: "Record absolute returned key/fob counts; allowed only while OCCUPIED or NOTICE_GIVEN"
    roles: [PropertyManager]
    code: 200
    input: [keys_returned, fobs_returned]
    output: Tenancy
    side_effects:
      - "ERR_RETURN_COUNT_EXCEEDS_ISSUED when a returned count exceeds the issued count"
      - "increments Tenancy.version by 1"

  # --- Inspection ---
  - method: POST
    path: "/pm/inspections"
    description: "Schedule an inspection; the inspector's DRAFT windows are closed intervals and must not touch or overlap (adjacency conflicts)"
    roles: [PropertyManager]
    code: 201
    input: [tenancy_id, kind, inspector_user_id, scheduled_start_at, scheduled_end_at]
    output: Inspection
    side_effects:
      - "status = DRAFT"
      - "ERR_INSPECTOR_SCHEDULE_CONFLICT when another DRAFT inspection for the same inspector_user_id satisfies start <= other.end AND other.start <= end"

  - method: GET
    path: "/pm/inspections/{id}"
    description: "Get an inspection"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/pm/inspections"
    description: "List inspections"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["tenancy_id?", "inspector_user_id?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: POST
    path: "/pm/inspections/{id}/items"
    description: "Add a condition item with photo count to a DRAFT inspection"
    roles: [Inspector]
    code: 201
    input: [area_name, category, condition, photo_count, "determination?", "linked_move_in_item_id?", "replacement_cost_cents?", "actual_repair_cents?", "notes?"]
    output: InspectionItem
    side_effects:
      - "ERR_PHOTO_DOCUMENTATION_REQUIRED when condition in {WORN, DAMAGED, MISSING} and photo_count < 1"
      - "ERR_ITEM_LINK_MISMATCH when linked_move_in_item_id does not belong to this tenancy's COMPLETED MOVE_IN inspection"
      - "ERR_INVALID_REQUEST when determination == TENANT_DAMAGE but replacement_cost_cents is absent"

  - method: POST
    path: "/pm/inspections/{id}/complete"
    description: "Complete an inspection; fires the tenancy lifecycle transition and, for MOVE_OUT, the deduction cascade and interest accrual"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "completed_at = logical clock; prior COMPLETED inspection of same tenancy+kind -> SUPERSEDED"
      - "MOVE_IN: Tenancy PENDING_MOVE_IN -> OCCUPIED, move_in_on set"
      - "MOVE_OUT: Tenancy NOTICE_GIVEN -> VACATED, move_out_on set; damage_charge + key_fob_lock_charge create DeductionItems; pending_deductions_cents recompute cascades to the DRAFT statement's projections; deposit_interest accrues"

  # --- InspectionItem ---
  - method: GET
    path: "/pm/inspection-items/{id}"
    description: "Get an inspection item"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: InspectionItem
    side_effects: []

  - method: GET
    path: "/pm/inspection-items"
    description: "List inspection items"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["inspection_id?", "linked_move_in_item_id?", "limit?", "offset?"]
    output: "InspectionItem[]"
    side_effects: []

  # --- DeductionItem ---
  - method: POST
    path: "/pm/deductions"
    description: "Create a manual deduction (UNPAID_RENT, CLEANING, OTHER) while the tenancy is NOTICE_GIVEN or VACATED"
    roles: [PropertyManager]
    code: 201
    input: [tenancy_id, source, description, amount_cents]
    output: DeductionItem
    side_effects:
      - "status = DRAFT; quantity = 1"
      - "Tenancy.pending_deductions_cents recomputed; DRAFT statement projections recomputed"

  - method: GET
    path: "/pm/deductions/{id}"
    description: "Get a deduction"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: DeductionItem
    side_effects: []

  - method: GET
    path: "/pm/deductions"
    description: "List deductions"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["tenancy_id?", "inspection_item_id?", "statement_id?", "status?", "limit?", "offset?"]
    output: "DeductionItem[]"
    side_effects: []

  # --- DepositStatement ---
  - method: POST
    path: "/pm/statements"
    description: "Create a DRAFT statement for a tenancy in NOTICE_GIVEN or VACATED; supersedes a DISPUTED predecessor (create-with-supersede, OCC-guarded)"
    roles: [PropertyManager]
    code: 201
    input: [tenancy_id, expected_tenancy_version]
    output: DepositStatement
    side_effects:
      - "statement_seq = max(existing seq) + 1; status = DRAFT"
      - "ERR_STALE_VERSION (412) when expected_tenancy_version != tenancy.version"
      - "ERR_STATEMENT_ALREADY_ACTIVE when a DRAFT or ISSUED statement exists"
      - "A DISPUTED predecessor -> SUPERSEDED and its active dispute -> WITHDRAWN"
      - "increments Tenancy.version by 1"

  - method: GET
    path: "/pm/statements/{id}"
    description: "Get a statement"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: DepositStatement
    side_effects: []

  - method: GET
    path: "/pm/statements"
    description: "List statements"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["tenancy_id?", "status?", "limit?", "offset?"]
    output: "DepositStatement[]"
    side_effects: []

  - method: POST
    path: "/pm/statements/{id}/issue"
    description: "Issue the itemized statement; sweeps DRAFT deductions to BILLED and stamps the late flag when past the statutory deadline"
    roles: [PropertyManager]
    code: 200
    input: []
    output: DepositStatement
    side_effects:
      - "statement_totals computed; late flag set; deductions swept DRAFT -> BILLED"
      - "Tenancy.total_deductions_cents / pending_deductions_cents recomputed; increments Tenancy.version by 1"

  - method: POST
    path: "/pm/statements/{id}/reopen"
    description: "Reopen a DISPUTED statement for revision; compensates the billed deductions back to DRAFT and withdraws the active dispute"
    roles: [PropertyManager]
    code: 200
    input: []
    output: DepositStatement
    side_effects:
      - "BILLED -> DRAFT on this statement's lines; released_cents and computed totals reset"
      - "Active dispute -> WITHDRAWN; increments Tenancy.version by 1"

  # --- Dispute ---
  - method: POST
    path: "/pm/disputes"
    description: "Tenant opens a dispute against an ISSUED or DISPUTED statement within the dispute window"
    roles: [Tenant]
    code: 201
    input: [statement_id, disputed_amount_cents, reason]
    output: Dispute
    side_effects:
      - "tenancy_id copied from statement; X-User-ID must equal the statement's tenancy_id"
      - "Statement ISSUED -> DISPUTED"
      - "ERR_DISPUTE_ALREADY_OPEN when a dispute in OPEN, MANAGER_COUNTERED, or ESCALATED_SMALL_CLAIMS exists for the statement"

  - method: GET
    path: "/pm/disputes/{id}"
    description: "Get a dispute"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/pm/disputes"
    description: "List disputes"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["statement_id?", "tenancy_id?", "status?", "limit?", "offset?"]
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/pm/disputes/{id}/counter"
    description: "Manager counter-offers: keeps counter_amount_cents of the disputed portion"
    roles: [PropertyManager]
    code: 200
    input: [counter_amount_cents]
    output: Dispute
    side_effects: ["status OPEN -> MANAGER_COUNTERED"]

  - method: POST
    path: "/pm/disputes/{id}/close_agreed"
    description: "Tenant accepts the counter: the rest of the disputed portion is released back"
    roles: [Tenant]
    code: 200
    input: []
    output: Dispute
    side_effects: ["statement.released_cents += disputed - counter; statement -> ISSUED"]

  - method: POST
    path: "/pm/disputes/{id}/escalate"
    description: "Tenant escalates to small claims; computes exposure_cents"
    roles: [Tenant]
    code: 200
    input: []
    output: Dispute
    side_effects: ["small_claims_exposure computes exposure_cents"]

  - method: POST
    path: "/pm/disputes/{id}/resolve_court"
    description: "Record the court outcome; awarded_amount_cents is the portion of the disputed amount awarded back to the tenant"
    roles: [PropertyManager]
    code: 200
    input: [awarded_amount_cents]
    output: Dispute
    side_effects:
      - "court_resolution_settlement: released_cents += awarded; auto PENALTY disbursement when the statement was late"
      - "statement -> ISSUED; refund_due_cents recomputed"

  # --- Disbursement ---
  - method: POST
    path: "/pm/disbursements"
    description: "Create a disbursement against the current statement; REFUND amounts reserve against balance_remaining_cents immediately (status SENT, sent_at = clock)"
    roles: [PropertyManager]
    code: 201
    input: [tenancy_id, statement_id, kind, amount_cents, payee_name]
    output: Disbursement
    side_effects:
      - "status = SENT; sent_at = logical clock"
      - "REFUND: Tenancy.reserved_cents += amount_cents; ERR_AMOUNT_EXCEEDS_BALANCE when amount > balance_remaining_cents (PENALTY exempt)"
      - "ERR_STATEMENT_SUPERSEDED when statement_id is not the current statement; statement must be ISSUED or SETTLED"

  - method: GET
    path: "/pm/disbursements/{id}"
    description: "Get a disbursement"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/pm/disbursements"
    description: "List disbursements"
    roles: [ManagerAdmin, PropertyManager, Inspector, Tenant]
    code: 200
    input: ["tenancy_id?", "statement_id?", "status?", "limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []

  - method: POST
    path: "/pm/disbursements/{id}/mark_cashed"
    description: "Mark a SENT disbursement as cashed"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Disbursement
    side_effects:
      - "cashed_at = logical clock; reserved_cents -= amount"
      - "REFUND: refund_paid_cents += amount; may settle the statement and tenancy (bubble up)"

  - method: POST
    path: "/pm/disbursements/{id}/reverse"
    description: "Reverse a CASHED disbursement (returned/stop-payment check); compensates refund_paid_cents and reopens settlement"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["refund_paid_cents or penalty_paid_cents decremented; SETTLED statement/tenancy revert"]

  - method: POST
    path: "/pm/disbursements/{id}/escheat"
    description: "Remit a stale-dated (unclaimed) disbursement to the state"
    roles: [PropertyManager]
    code: 200
    input: [escheatment_reference]
    output: Disbursement
    side_effects:
      - "status STALE_DATED -> ESCHEATED; escheated_cents += amount; balance_remaining_cents -= amount"
      - "Tenancy -> ESCHEATED when balance reaches 0 and nothing remains SENT"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on endpoint, or Tenant X-User-ID does not own the target tenancy" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, wrong type, negative amount, or structurally invalid value" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested action has no transition from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_tenancy_version does not match the tenancy's current version (OCC)" }
  - { id: ERR_DUPLICATE_JURISDICTION_CODE, http: 409, condition: "JurisdictionProfile code already exists" }
  - { id: ERR_UNIT_OCCUPANCY_OVERLAP, http: 409, condition: "Lease interval overlaps another tenancy on the same unit (half-open; adjacency allowed)" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "Inspector already has a DRAFT inspection whose closed window touches or overlaps (adjacency conflicts)" }
  - { id: ERR_TENANCY_NOT_VACATED, http: 409, condition: "Statement issuance requires the tenancy in VACATED" }
  - { id: ERR_STATEMENT_NOT_DISPUTABLE, http: 409, condition: "Dispute target statement is not ISSUED or DISPUTED" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute opened after issued date + dispute_window_days" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "An active dispute already exists for the statement" }
  - { id: ERR_STATEMENT_ALREADY_ACTIVE, http: 409, condition: "A DRAFT or ISSUED statement already exists for the tenancy" }
  - { id: ERR_STATEMENT_SUPERSEDED, http: 409, condition: "Referenced statement is not the tenancy's current non-superseded statement" }
  - { id: ERR_ITEM_LINK_MISMATCH, http: 409, condition: "linked_move_in_item_id is not an item of this tenancy's COMPLETED MOVE_IN inspection" }
  - { id: ERR_ITEM_NOT_ASSESSED, http: 409, condition: "MOVE_OUT completion blocked: an item still has determination UNASSESSED" }
  - { id: ERR_PHOTO_DOCUMENTATION_REQUIRED, http: 422, condition: "Condition WORN/DAMAGED/MISSING requires photo_count >= 1" }
  - { id: ERR_AMOUNT_EXCEEDS_BALANCE, http: 409, condition: "REFUND disbursement exceeds the tenancy's balance_remaining_cents" }
  - { id: ERR_DISPUTE_AMOUNT_INVALID, http: 409, condition: "disputed_amount_cents outside [1, deduction_total_cents]" }
  - { id: ERR_AWARD_EXCEEDS_DISPUTED, http: 409, condition: "awarded_amount_cents exceeds the disputed amount" }
  - { id: ERR_RETURN_COUNT_EXCEEDS_ISSUED, http: 422, condition: "Returned key/fob count exceeds the issued count" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ManagerAdmin
    description: "Property-company administrator: owns configuration (jurisdictions, properties, units) and ops checkpoints"
    identity: opaque
    exclusive_operations:
      - "POST /pm/jurisdiction-profiles"
      - "POST /pm/properties"
      - "POST /pm/units"
      - "POST /pm/_clock/set_current_utc"
      - "POST /pm/ops/run_daily_cycle"
    shared_operations:
      - "All GET endpoints"

  - name: PropertyManager
    description: "Property manager operator: runs tenancies, statements, deductions, disbursements, and the manager side of disputes"
    identity: opaque
    exclusive_operations:
      - "POST /pm/tenancies"
      - "POST /pm/tenancies/{id}/give_notice"
      - "POST /pm/tenancies/{id}/record_key_return"
      - "POST /pm/inspections"
      - "POST /pm/deductions"
      - "POST /pm/statements"
      - "POST /pm/statements/{id}/issue"
      - "POST /pm/statements/{id}/reopen"
      - "POST /pm/disputes/{id}/counter"
      - "POST /pm/disputes/{id}/resolve_court"
      - "POST /pm/disbursements"
      - "POST /pm/disbursements/{id}/mark_cashed"
      - "POST /pm/disbursements/{id}/reverse"
      - "POST /pm/disbursements/{id}/escheat"
    shared_operations:
      - "All GET endpoints"

  - name: Inspector
    description: "Field inspector: documents condition items and completes inspections"
    identity: opaque
    exclusive_operations:
      - "POST /pm/inspections/{id}/items"
      - "POST /pm/inspections/{id}/complete"
    shared_operations:
      - "All GET endpoints"

  - name: Tenant
    description: "Tenant of a tenancy: opens and drives disputes on their own statements"
    identity: "entity_backed:Tenancy"
    exclusive_operations:
      - "POST /pm/disputes"
      - "POST /pm/disputes/{id}/close_agreed"
      - "POST /pm/disputes/{id}/escalate"
    shared_operations:
      - "All GET endpoints"
