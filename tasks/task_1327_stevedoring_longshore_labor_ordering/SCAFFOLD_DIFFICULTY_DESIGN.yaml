# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Stevedoring & Longshore Labor Ordering
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. All numeric asserts were
# computed by executing the pinned formulas against the pinned setup literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_totals
        grounds:
          - calculations.invoice_calculation
          - entities.Invoice.fields.rate_variant
          - state_machines.Invoice.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Billing domain: the same vessel call yields total_cents 2870900 under the
          PROVISIONAL variant (planned moves/tons + required-headcount estimate, no
          equipment line) and 2962100 under the FINAL variant (actuals + APPROVED
          timesheets + real equipment windows) — the variants diverge because the
          equipment line exists only in FINAL and the discount tier is keyed on the
          different pre-discount subtotals.
        test_recipe:
          setup:
            - "Vessel V (planned_moves 600, planned_tons 400, mph target 25.0, credit limit 500000000), BERTHED"
            - "Shift S DAY 2026-08-10 08:00-16:00 OPEN_FOR_ORDERS; gang order G headcount 2 (HOLDMAN, RTG x1) PLACED"
            - "Invoice created while DRAFT: provisional lines from planned figures -> total 2870900"
            - "Then full work performed: 4 move records (150 moves, 100 tons, 60 min each, 0 stoppage),"
            - "two approved 480-minute timesheets, one 480-minute RTG assignment; shift CLOSED; vessel COMPLETED"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Variant", voyage_number: "V-101", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 600, planned_tons: 400, contracted_mph_target: 25.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "HOLD_GANG", required_classification: "HOLDMAN", required_headcount: 2, required_equipment_type: "RTG", required_equipment_count: 1 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/invoices"
              payload: { vessel_call_id: "${v}" }
              as: BillingClerk
              captures: { inv: $.data.id, prov_total: $.data.total_cents }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/equipment-units"
              payload: { unit_code: "RTG-1", equipment_type: "RTG" }
              as: StevedoreAdmin
              captures: { e1: $.data.id }
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${g}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T08:00:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
            - call: "GET /api/gang-orders/${g}"
              as: StevedoreSuperintendent
              captures: { g_v_now: $.data.version }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v_now}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id", a2: "$.data[1].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/dispatch-assignments/${a2}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/move-records"
              payload: { gang_order_id: "${g}", period_start_utc: "2026-08-10T08:00:00Z", period_end_utc: "2026-08-10T09:00:00Z", moves_count: 150, tons_lifted: 100, stoppage_minutes: 0 }
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/move-records"
              payload: { gang_order_id: "${g}", period_start_utc: "2026-08-10T09:00:00Z", period_end_utc: "2026-08-10T10:00:00Z", moves_count: 150, tons_lifted: 100, stoppage_minutes: 0 }
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/move-records"
              payload: { gang_order_id: "${g}", period_start_utc: "2026-08-10T10:00:00Z", period_end_utc: "2026-08-10T11:00:00Z", moves_count: 150, tons_lifted: 100, stoppage_minutes: 0 }
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/move-records"
              payload: { gang_order_id: "${g}", period_start_utc: "2026-08-10T11:00:00Z", period_end_utc: "2026-08-10T12:00:00Z", moves_count: 150, tons_lifted: 100, stoppage_minutes: 0 }
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/gang-orders/${g}/complete"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries"
              payload: { gang_order_id: "${g}", worker_id: "${w1}", work_minutes: 480, meal_break_taken: true }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { t1: $.data.id }
            - call: "POST /api/timesheet-entries"
              payload: { gang_order_id: "${g}", worker_id: "${w2}", work_minutes: 480, meal_break_taken: true }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { t2: $.data.id }
            - call: "POST /api/timesheet-entries/${t1}/submit"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries/${t1}/approve"
              as: PayrollClerk
              as_user_id: "pay-1"
            - call: "POST /api/timesheet-entries/${t2}/submit"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries/${t2}/approve"
              as: PayrollClerk
              as_user_id: "pay-1"
            - call: "POST /api/vessel-calls/${v}/complete"
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/invoices/${inv}/finalize"
              as: BillingClerk
              captures: { fin_total: $.data.total_cents, fin_sub: $.data.subtotal_cents }
          assert:
            - "Invoice.${inv} at creation: rate_variant == PROVISIONAL, container_line_cents == 2670000, tonnage_line_cents == 248000, manhour_line_cents == 104000, equipment_line_cents == 0, subtotal_cents == 3022000, discount_cents == 151100, total_cents == 2870900"
            - "Invoice.${inv} after finalize: rate_variant == FINAL, container_line_cents == 2670000, tonnage_line_cents == 248000, manhour_line_cents == 104000, equipment_line_cents == 96000, subtotal_cents == 3118000, discount_cents == 155900, total_cents == 2962100"
            - "provisional total 2870900 != final total 2962100 for identical vessel data lineage"

      - name: claim_provisional_5050_vs_fault_weighted
        grounds:
          - calculations.damage_liability
          - entities.DamageClaim.fields.provisional_stevedore_share_cents
          - entities.DamageClaim.fields.final_stevedore_liability_cents
          - state_machines.DamageClaim.REPORTED_to_ACCEPTED
          - state_machines.DamageClaim.ACCEPTED_to_SETTLED
        distinguishing_aspect: |
          Claims domain (distinct from the billing-domain invoice instance): a claim of
          10000000 cents carries provisional_stevedore_share_cents 5000000 (flat 50%),
          while the FINAL fault-weighted computation at settle yields
          max(0, min(round(10000000*60/100), 25000000) - 50000) = 5950000 — different
          algorithm, different result, different entity domain.
        test_recipe:
          setup:
            - "Vessel, DAY shift, gang order G (headcount 1, HOLDMAN, RTG x0) worked and WORKING with W1 checked in"
            - "DamageClaim on G reported by foreman W1 with estimated_amount_cents 10000000"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Claim", voyage_number: "C-201", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 100, planned_tons: 50, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "HOLD_GANG", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/damage-claims"
              payload: { gang_order_id: "${g}", cargo_ref: "MSKU-123456", damage_description: "Crushed container corner post", estimated_amount_cents: 10000000 }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { cl: $.data.id, prov_share: $.data.provisional_stevedore_share_cents }
          trigger:
            - call: "POST /api/damage-claims/${cl}/decide"
              payload: { decision: "ACCEPTED", fault_pct: 60 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /api/damage-claims/${cl}/settle"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { fin_liab: $.data.final_stevedore_liability_cents }
          assert:
            - "DamageClaim.${cl}.provisional_stevedore_share_cents == 5000000 (round_half_up(10000000 * 0.50))"
            - "DamageClaim.${cl} after decide: status == ACCEPTED, decided_by_user_id == 'adj-1'"
            - "DamageClaim.${cl}.final_stevedore_liability_cents == 5950000 (max(0, min(6000000, 25000000) - 50000))"
            - "provisional 5000000 != final 5950000 for the same estimated_amount_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: payroll_tiered_overtime_meal_penalty_night
        grounds:
          - calculations.payroll_gross_pay
          - state_machines.TimesheetEntry.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: work_minutes 540 crosses the
          480 OT breakpoint, NIGHT period multiplier 1.10 scales the base BEFORE the OT
          multiplier, and the missing meal break adds 60 penalty minutes at straight rate.
          Pinned result: round_half_up((480 + 60*1.5 + 60) * (4000*1.10) / 60) = 46200;
          the same 540 minutes WITH a meal break yields 41800 — the 6000-cent delta is the
          meal-penalty interaction.
        test_recipe:
          setup:
            - "Vessel V, NIGHT shift 18:00-02:00 (+1 day), gang order G headcount 2 completed after work"
            - "W1 timesheet 540 minutes, meal_break_taken false; W2 timesheet 540 minutes, meal_break_taken true"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Nights", voyage_number: "N-301", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 100, planned_tons: 50, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "NIGHT", start_utc: "2026-08-10T18:00:00Z", end_utc: "2026-08-11T02:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "HOLD_GANG", required_classification: "HOLDMAN", required_headcount: 2, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id", a2: "$.data[1].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/dispatch-assignments/${a2}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/gang-orders/${g}/complete"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries"
              payload: { gang_order_id: "${g}", worker_id: "${w1}", work_minutes: 540, meal_break_taken: false }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { t1: $.data.id }
            - call: "POST /api/timesheet-entries"
              payload: { gang_order_id: "${g}", worker_id: "${w2}", work_minutes: 540, meal_break_taken: true }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { t2: $.data.id }
            - call: "POST /api/timesheet-entries/${t1}/submit"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries/${t2}/submit"
              as: GangForeman
              as_user_id: "${w1}"
          trigger:
            - call: "POST /api/timesheet-entries/${t1}/approve"
              as: PayrollClerk
              as_user_id: "pay-1"
            - call: "POST /api/timesheet-entries/${t2}/approve"
              as: PayrollClerk
              as_user_id: "pay-1"
          assert:
            - "TimesheetEntry.${t1}: straight_minutes == 480, ot_minutes == 60, dt_minutes == 0, meal_penalty_minutes == 60, gross_pay_cents == 46200"
            - "TimesheetEntry.${t2}: straight_minutes == 480, ot_minutes == 60, dt_minutes == 0, meal_penalty_minutes == 0, gross_pay_cents == 41800"
            - "t1.gross_pay_cents - t2.gross_pay_cents == 4400 (exactly 60 minutes at the NIGHT-adjusted base 4400 cents/hour)"

      - name: invoice_manhour_line_rounded_once_after_sum
        grounds:
          - calculations.invoice_calculation
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the manhour line sums ALL approved minutes
          FIRST and rounds once: round_half_up((77+113) * 6500 / 60) = 20583. The
          forbidden per-timesheet order would give round(77*6500/60)=8342 plus
          round(113*6500/60)=12242 = 20584 — one cent apart; the scaffold pins 20583.
        test_recipe:
          setup:
            - "Vessel completed after one gang (headcount 2, no equipment) worked with zero move records"
            - "Approved timesheets: W1 77 minutes (meal taken), W2 113 minutes (meal taken), DAY shift"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Rounding", voyage_number: "R-401", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 0, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 2, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id", a2: "$.data[1].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/dispatch-assignments/${a2}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/gang-orders/${g}/complete"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries"
              payload: { gang_order_id: "${g}", worker_id: "${w1}", work_minutes: 77, meal_break_taken: true }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { t1: $.data.id }
            - call: "POST /api/timesheet-entries"
              payload: { gang_order_id: "${g}", worker_id: "${w2}", work_minutes: 113, meal_break_taken: true }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { t2: $.data.id }
            - call: "POST /api/timesheet-entries/${t1}/submit"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries/${t1}/approve"
              as: PayrollClerk
              as_user_id: "pay-1"
            - call: "POST /api/timesheet-entries/${t2}/submit"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "POST /api/timesheet-entries/${t2}/approve"
              as: PayrollClerk
              as_user_id: "pay-1"
            - call: "POST /api/vessel-calls/${v}/complete"
              as: StevedoreSuperintendent
            - call: "POST /api/invoices"
              payload: { vessel_call_id: "${v}" }
              as: BillingClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /api/invoices/${inv}/finalize"
              as: BillingClerk
          assert:
            - "Invoice.${inv}.manhour_line_cents == 20583 (round_half_up(190 * 6500 / 60); per-entry rounding would give 20584 and is forbidden)"
            - "Invoice.${inv}.container_line_cents == 0 and tonnage_line_cents == 0 and equipment_line_cents == 0 (no actual work recorded)"
            - "Invoice.${inv}.subtotal_cents == 20583 and discount_cents == 0 and total_cents == 20583"

      - name: invoice_discount_tier_keyed_on_prediscount_subtotal
        grounds:
          - calculations.invoice_calculation
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned: the 5% tier is selected using the
          PRE-discount subtotal (3000000 exactly, >= semantics), even though applying the
          discount drops the payable total to 2850000, below the tier threshold. An
          implementation keying the tier on the post-discount total would misclassify.
        test_recipe:
          setup:
            - "Vessel completed; actuals engineered so the pre-discount subtotal is exactly 3000000:"
            - "600 moves (2670000) + 400 tons (248000) + one approved 480-minute timesheet (52000) + one 150-minute RTG window (30000); no suspensions"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Tier", voyage_number: "T-501", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 600, planned_tons: 400, contracted_mph_target: 25.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
