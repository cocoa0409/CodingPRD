          trigger:
            - call: "POST /engagement/employees"
              payload: { external_ref: "NF01", unit_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
