  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: replenish_finalize_to_site_posture_depth3
        grounds:
          - state_machines.ReplenishOrder.PLACED_to_FINALIZED
          - entities.InventoryBalance.fields.on_order
          - entities.InventoryBalance.fields.on_hand
          - entities.StockLot
          - entities.Site.fields.effective_status
        distinguishing_aspect: |
          Depth-3 chain triggered by finalize: (1) finalize moves each line's
          units on_order -> on_hand on InventoryBalance; (2) each perishable
          line's receipt creates a StockLot; (3) with no ReplenishOrder left in
          PLACED the Site's derived posture falls back to OPERATING — three
          hops, each caused by the previous.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; PERISHABLE product SKU-MILK price 350 with balance row (on_hand 0). One DRAFT replenish order of 12 milk placed (site posture OPENED_REPLENISH while PLACED)."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-MILK", name: "Whole Milk 1L", price_cents: 350, product_class: "PERISHABLE" }
              as: SiteOps
              captures: { prod_milk: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_milk}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_milk: $.data.id }
            - call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-1001", lines: [ { product_id: "${prod_milk}", qty: 12, unit_cost_cents: 180 } ], expected_at: "2026-09-11T08:00:00Z", idempotency_key: "po-1001-key" }
              as: SiteOps
              captures: { ro_milk: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_milk}/place"
              payload: {}
              as: SiteOps
            - call: "GET /mfc/sites/${site_id}"
              payload: {}
              as: SiteOps
              captures: { posture_mid: $.data.effective_status }
          trigger:
            - call: "POST /mfc/replenish-orders/${ro_milk}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-20T00:00:00Z" } }
              as: SiteOps
            - call: "GET /mfc/inventory-balances/${bal_milk}"
              payload: {}
              as: SiteOps
              captures: { oh: $.data.on_hand, oo: $.data.on_order }
            - call: "GET /mfc/stock-lots"
              payload: {}
              as: SiteOps
              captures: { lot_qty: "$.data[0].remaining_qty", lot_status: "$.data[0].status" }
            - call: "GET /mfc/sites/${site_id}"
              payload: {}
              as: SiteOps
              captures: { posture_end: $.data.effective_status }
          assert:
            - "While PLACED: posture_mid == OPENED_REPLENISH and InventoryBalance.${bal_milk}.on_order was 12, on_hand 0"
            - "After finalize: on_hand == 12 and on_order == 0 (hop 1)"
            - "Exactly one StockLot exists for (site, milk) with remaining_qty == 12 and status == FRESH (hop 2)"
            - "posture_end == OPERATING (hop 3 — derived site posture recomputed from the last PLACED order leaving PLACED)"

      - name: batch_seal_commit_cascade_depth3
        grounds:
          - state_machines.PickBatch.OPEN_to_SEALED
          - state_machines.Order.PICKING_to_AWAITING_HANDOFF
          - entities.InventoryBalance.fields.reserved
          - entities.StockLot.fields.remaining_qty
        distinguishing_aspect: |
          Different trigger (batch seal, not replenish finalize) and a different
          depth-3 chain: (1) seal flips each appended Order PICKING ->
          AWAITING_HANDOFF; (2) each flip commits InventoryBalance (reserved -=
          qty, on_hand -= qty); (3) each perishable line consumes StockLots
          earliest-expiry-first — the lot drawdown is caused by the balance
          commit, not by the seal directly.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; PERISHABLE SKU-MILK 350 with two FRESH lots: L1 expires 2026-09-12 qty 3, L2 expires 2026-09-18 qty 10 (received via two replenish finalize calls). Order of 4 milk appended to a batch."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-MILK", name: "Whole Milk 1L", price_cents: 350, product_class: "PERISHABLE" }
              as: SiteOps
              captures: { prod_milk: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_milk}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_milk: $.data.id }
            - &ro_l1
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-L1", lines: [ { product_id: "${prod_milk}", qty: 3, unit_cost_cents: 180 } ], expected_at: "2026-09-10T08:00:00Z", idempotency_key: "po-l1-key" }
              as: SiteOps
              captures: { ro_l1: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_l1}/place"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/replenish-orders/${ro_l1}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-12T00:00:00Z" } }
              as: SiteOps
            - &ro_l2
              call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-L2", lines: [ { product_id: "${prod_milk}", qty: 10, unit_cost_cents: 180 } ], expected_at: "2026-09-10T09:00:00Z", idempotency_key: "po-l2-key" }
              as: SiteOps
              captures: { ro_l2: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_l2}/place"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/replenish-orders/${ro_l2}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-18T00:00:00Z" } }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - &o_milk
              call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_milk}", qty: 4 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_milk: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Sam Sealer" }
              as: SiteOps
              captures: { picker_2: $.data.id }
            - &b_milk
              call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { b_milk: $.data.id }
            - call: "POST /mfc/pick-batches/${b_milk}/orders"
              payload: { order_id: "${o_milk}" }
              as: Picker
              as_user_id: "${picker_1}"
          trigger:
            - call: "POST /mfc/pick-batches/${b_milk}/seal"
              payload: {}
              as: Picker
              as_user_id: "${picker_2}"
            - call: "GET /mfc/inventory-balances/${bal_milk}"
              payload: {}
              as: SiteOps
              captures: { oh2: $.data.on_hand, rv2: $.data.reserved }
            - call: "GET /mfc/stock-lots"
              payload: {}
              as: SiteOps
              captures: { l1_left: "$.data[0].remaining_qty", l2_left: "$.data[1].remaining_qty" }
          assert:
            - "Order.${o_milk}.status == AWAITING_HANDOFF (hop 1)"
            - "InventoryBalance.${bal_milk}: on_hand == 9 and reserved == 0 (hop 2 — 13 on hand minus 4 committed)"
            - "Lot drawdown earliest-expiry-first (hop 3): L1 remaining_qty == 0 and L2 remaining_qty == 9 (3 from L1 then 1 from L2)"
            - "PickBatch.${b_milk}.status == SEALED and sealed_by_id == ${picker_2}"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: radius_vs_insufficient_stock_priority
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_DELIVERY_RADIUS_EXCEEDED
          - errors.ERR_INSUFFICIENT_STOCK
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: a placement
          that is BOTH out of delivery radius AND short on stock must surface
          ERR_DELIVERY_RADIUS_EXCEEDED (priority 6 safety) — never the fiscal
          stock error — because safety outranks fiscal in the pinned order.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A radius 5.0; product SKU-CHIPS with balance on_hand 0 (no stock); customer of age."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 9.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_dual: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_DELIVERY_RADIUS_EXCEEDED"
            - "error_id != ERR_INSUFFICIENT_STOCK and != ERR_PRODUCT_UNSELLABLE — the safety check fires first"
            - "GET /orders?customer_id=${cust_id} returns 0 rows"

      - name: self_seal_vs_batch_empty_priority
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_SELF_SEAL_FORBIDDEN
          - errors.ERR_BATCH_FULL
        distinguishing_aspect: |
          Different error-category pair — business_safety (segregation of
          duties) vs business_constraint (capacity): the owning picker sealing
          their own batch is refused with ERR_SELF_SEAL_FORBIDDEN even though
          the batch is also empty (which would be ERR_BATCH_EMPTY); the safety
          check is evaluated before the constraint check.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; picker Pat owns an OPEN batch with no orders."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { b_empty: $.data.id }
          trigger:
            - call: "POST /mfc/pick-batches/${b_empty}/seal"
              payload: {}
              as: Picker
              as_user_id: "${picker_1}"
              captures: { err_self: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SELF_SEAL_FORBIDDEN"
            - "error_id != ERR_BATCH_EMPTY — segregation-of-duties (safety) outranks the empty-batch constraint"
            - "PickBatch.${b_empty}.status is still OPEN and sealed_by_id is null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: fee_waiver_threshold_exact_vs_one_cent_below
        grounds:
          - calculations.delivery_fee
          - entities.Site.fields.fee_waiver_threshold_cents
        distinguishing_aspect: |
          Metric: delivery fee waiver on subtotal cents (>=). An ACTIVE FAM
          member's basket of exactly 3000 cents waives the 199 fee to 0; a
          basket of 2999 cents pays the full fee — reachable through POST
          /orders.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z (off-peak). Site SITE-A (waiver threshold 3000). STANDARD SKU-CHIPS 500 and SKU-SODA 300 stocked 50 each. Customer with ACTIVE FAM membership, wallet 0."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-SODA", name: "Soda", price_cents: 300, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_soda: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_soda}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_soda: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/inventory-balances/${bal_soda}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - &memb_c
              call: "POST /mfc/memberships"
              payload: { customer_id: "${cust_id}", tier: "FAM", monthly_fee_cents: 1000 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 6 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_eq: $.data.id, fee_eq: $.data.delivery_fee_cents }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 5 }, { product_id: "${prod_soda}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_below: $.data.id, fee_below: $.data.delivery_fee_cents }
          assert:
            - "Order.${o_eq}: subtotal_cents == 3000 and delivery_fee_cents == 0 — exact threshold waives (>=)"
            - "Order.${o_below}: subtotal_cents == 2999 and delivery_fee_cents == 199 — one cent below does not waive"
            - "Order.${o_below}.total_cents == 2999 + 0 + 199 == 3198"

      - name: batch_line_cap_inclusive_boundary
        grounds:
          - calculations.batch_capacity_check
          - entities.Site.fields.batch_max_lines
        distinguishing_aspect: |
          Different metric (order-count capacity, an integer ceiling on distinct
          orders) reached through a different endpoint (POST
          /pick-batches/{id}/orders): with batch_max_lines == 2 the second
          append succeeds (len becomes 2, not yet >= 2 at check time) and the
          third append is rejected — the cap is inclusive of the existing count.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A (batch_max_lines 2, batch_max_items 20). SKU-CHIPS stocked 50. Customer of age; three PLACED orders of 1 chips each; picker Pat's OPEN batch."
