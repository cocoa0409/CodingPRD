scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 / 9 — entities  (claim-extraction-guide: From Table 1)
  # ===========================================================================
  - section: entities
    instances:

      - name: program_year_creation_applies_every_statutory_default
        claim_type: defaults
        grounds:
          - entities.ProgramYear.fields
          - endpoints[POST /program-years]
        distinguishing_aspect: "A ProgramYear created with only its three required inputs must materialise all fifteen optional statutory dials at their declared defaults; any omitted default silently changes penalty, escalation and NIA arithmetic downstream."
        test_recipe:
          setup:
            - "Empty database; logical clock moved to 2026-01-01 so calendar_year 2026 is the current program year"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
              captures: { py_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "response data.calendar_year == 2026"
            - "response data.ira_annual_limit_cents == 700000"
            - "response data.default_contribution_rate_bp == 500"
            - "response data.catch_up_limit_cents == 100000"
            - "response data.escalation_increment_bp == 100"
            - "response data.escalation_cap_bp == 800"
            - "response data.escalation_seasoning_days == 180"
            - "response data.opt_out_window_days == 30"
            - "response data.remittance_due_days == 7"
            - "response data.notice_period_days == 90"
            - "response data.sustained_notice_days == 180"
            - "response data.register_penalty_initial_cents_per_employee == 25000"
            - "response data.register_penalty_sustained_cents_per_employee == 50000"
            - "response data.remit_penalty_monthly_rate_bp == 150"
            - "response data.remit_penalty_floor_cents == 10000"
            - "response data.remit_penalty_cap_bp == 5000"
            - "response data.nia_daily_rate_bp == 2"
            - "response data.correction_deadline_month_day == 04-15"

      - name: program_year_and_investment_option_carry_no_version_and_no_mutator
        claim_type: immutability
        grounds:
          - entities.ProgramYear.common_fields
          - entities.InvestmentOption.common_fields
          - endpoints
        distinguishing_aspect: "Both configuration entities declare common_fields: false, so their rows expose id and created_at but NEITHER updated_at NOR version, and §1.5 offers no PATCH, PUT or DELETE for either — statutory parameters and the fund menu are append-only by construction."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; one ProgramYear for 2026 and one InvestmentOption on the menu"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
              captures: { opt_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "response data has an id and a created_at"
            - "response data has no version key"
            - "response data has no updated_at key"
            - "GET /investment-options/${opt_id} returns the same row with no version key"
            - "GET /program-years returns rows with no version key and no updated_at key"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path targets /program-years or /investment-options"

      - name: investment_option_creation_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.InvestmentOption.fields
          - endpoints[POST /investment-options]
        distinguishing_aspect: "A fund created with all seven inputs echoes each one verbatim and defaults status to OPEN; target_year is optional and must survive as the supplied integer rather than being coerced or dropped."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; fund menu empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /investment-options"
              payload: { fund_code: "BND010", name: "Core Bond Index", category: "BOND_INDEX", expense_ratio_bp: 12, default_eligible: false }
              as: ProgramAdministrator
              captures: { bnd_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "response response_type == object"
            - "response meta contains api_request_id and api_request_timestamp"
            - "response data.fund_code == BND010"
            - "response data.name == Core Bond Index"
            - "response data.category == BOND_INDEX"
            - "response data.expense_ratio_bp == 12"
            - "response data.default_eligible == false"
            - "response data.target_year == null"
            - "response data.status == OPEN"
            - "GET /investment-options/${bnd_id} returns data.fund_code == BND010 and data.status == OPEN"

      - name: investment_option_listing_paginates_and_filters_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /investment-options]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count reports the size of the FILTERED set, not the page or the table: with three funds on the menu and limit 2, page one reports total_count 3 with has_more true, page two reports has_more false, and a category filter narrows total_count to 1 while keeping the same envelope keys."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured"
            - "Exactly three InvestmentOption rows exist: TDF2045 and TDF2040 in TARGET_DATE and MMKT01 in CAPITAL_PRESERVATION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2040", name: "Target Retirement 2040", category: "TARGET_DATE", target_year: 2040, expense_ratio_bp: 25, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
          trigger:
            - call: "GET /investment-options"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdministrator
            - call: "GET /investment-options"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdministrator
            - call: "GET /investment-options"
              payload: { category: "CAPITAL_PRESERVATION" }
              as: Participant
              as_user_id: "any-participant-reader"
          assert:
            - "the first trigger call returns response_type == array with data length 2, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second trigger call returns data length 1, total_count == 3, offset == 2 and has_more == false"
            - "the third trigger call returns data length 1, total_count == 1, limit == 10, offset == 0 and has_more == false"
            - "the third trigger call's single row has fund_code == MMKT01"

      - name: employer_read_with_unknown_uuid_returns_employer_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /employers/{id}]
          - errors.ERR_EMPLOYER_NOT_FOUND
          - validations.v_path_target_exists
        distinguishing_aspect: "A well-formed UUID that matches no row is a 404 existence failure and not a 422 shape failure; the path id is syntactically valid so only the store lookup can reject it."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; no Employer rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "response status == 404"
            - "response response_type == error"
            - "response data.error_id == ERR_EMPLOYER_NOT_FOUND"
            - "response data.error_id != ERR_INVALID_REQUEST"

      - name: employer_creation_without_employee_count_is_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Employer.fields.employee_count
          - validations.v_request_shape
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "employee_count has source: input and no default, so omitting it cannot be papered over — without it wave_tier and registration_deadline are underivable, so the request must fail at priority 5 rather than creating a tier-less employer."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; no Employer rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /employers"
              payload: { ein: "44-1000001", legal_name: "Missing Count Partners", worksite_state: "CA" }
              as: ProgramAdministrator
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /employers/{any id} is impossible because no Employer row was created"

      - name: participant_age_and_catch_up_flag_are_computed_from_date_of_birth
        claim_type: computed_fields
        grounds:
          - entities.Participant.fields.age_at_year_end
          - entities.Participant.fields.catch_up_eligible
          - calculations.participant_contribution_headroom.constants.catch_up_age_floor
        distinguishing_aspect: "age_at_year_end is a year-end age, not an age as of today: at clock 2026-01-01 a participant born 1976-12-31 is already 50 for the year and catch_up_eligible, while one born 1977-01-01 is 49 and is not — the flag flips on birth YEAR, never on birth month."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01 with ProgramYear 2026 configured (catch_up_limit_cents 100000)"
            - "No Participant rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /participants"
              payload: { full_name: "Ines Ortega", date_of_birth: "1976-12-31", email: "ines.ortega@x.example", ssn_last4: "9001", state_resident: true }
              as: ProgramAdministrator
              captures: { p_old_id: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "Karl Weiss", date_of_birth: "1977-01-01", email: "karl.weiss@x.example", ssn_last4: "9002", state_resident: true }
              as: ProgramAdministrator
              captures: { p_young_id: "$.data.id" }
          assert:
            - "Participant.${p_old_id}.age_at_year_end == 50"
            - "Participant.${p_old_id}.catch_up_eligible == true"
            - "Participant.${p_young_id}.age_at_year_end == 49"
            - "Participant.${p_young_id}.catch_up_eligible == false"
            - "Participant.${p_old_id}.indirect_rollover_count == 0"
            - "Participant.${p_young_id}.indirect_rollover_count == 0"

      - name: employer_system_and_computed_fields_are_server_generated_on_creation
        claim_type: system_fields
        grounds:
          - entities.Employer.fields.registration_status
          - entities.Employer.fields.compliance_status
          - entities.Employer.fields.non_fiduciary_acknowledged
          - entities.Employer.fields.unremitted_deduction_cents
          - entities.Employer.common_fields
        distinguishing_aspect: "Creation supplies only the four input fields, yet the response must already carry id, created_at, updated_at, version 1 and every system/computed field at its declared seed — an employer is never created mid-lifecycle, so registration_status PENDING_REGISTRATION, non_fiduciary_acknowledged false and unremitted_deduction_cents 0 are not optional."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; no Employer rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id", emp_v: "$.data.version" }
          assert:
            - "response status == 201"
            - "response data.id is a non-empty string and response data.created_at and response data.updated_at are present"
            - "response data.version == 1"
            - "response data.registration_status == PENDING_REGISTRATION"
            - "response data.compliance_status == COMPLIANT"
            - "response data.non_fiduciary_acknowledged == false"
            - "response data.payroll_contact_email == null"
            - "response data.registered_at == null"
            - "response data.unremitted_deduction_cents == 0"
            - "response data.last_recount_effective_date == null"
            - "response data.wave_tier == WAVE_2"
            - "response data.registration_deadline == 2026-12-31"

      - name: investment_option_rejects_a_category_outside_the_declared_enum
        claim_type: type_constraints
        grounds:
          - entities.InvestmentOption.fields.category
          - validations.v_request_shape
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "category is a closed enum of four values; an out-of-enum string must be refused at priority 5 rather than stored, because default_investment_option_selection partitions the menu by exactly those four categories and an unknown fifth would be invisible to both candidate pools."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; fund menu empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /investment-options"
              payload: { fund_code: "REIT01", name: "Global Real Estate", category: "REAL_ESTATE", expense_ratio_bp: 55, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "REIT01", name: "Global Real Estate", category: "EQUITY_INDEX", expense_ratio_bp: 55, default_eligible: true }
              as: ProgramAdministrator
              captures: { reit_id: "$.data.id" }
          assert:
            - "the first trigger call returns status == 422 with data.error_id == ERR_INVALID_REQUEST"
            - "immediately after the first trigger call, GET /investment-options returns total_count == 0"
            - "the second trigger call returns status == 201 with data.category == EQUITY_INDEX"
            - "InvestmentOption.${reit_id}.status == OPEN"

      - name: exemption_certification_under_an_unknown_employer_is_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ExemptionCertification.parent
          - validations.v_path_target_exists
          - errors.ERR_EMPLOYER_NOT_FOUND
        distinguishing_aspect: "ExemptionCertification declares Employer as its parent, so the parent lookup at priority 3 runs before any body validation, before the enforcement hold at priority 45 and before the coverage-window check at priority 58 — a well-formed filing under a nonexistent employer is a 404, never a 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured; no Employer rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /employers/00000000-0000-4000-8000-000000000404/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "44-2000002", plan_effective_date: "2026-01-01", attestation_accepted: true }
              as: ProgramAdministrator
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_EMPLOYER_NOT_FOUND"
            - "response data.error_id != ERR_ENFORCEMENT_HOLD"
            - "response data.error_id != ERR_EXEMPTION_WINDOW_CLOSED"

      - name: enrollment_is_the_employer_participant_junction_and_is_unique_per_pair
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Enrollment.fields.employer_id
          - entities.Enrollment.fields.participant_id
          - validations.v_duplicate_active_enrollment
          - errors.ERR_DUPLICATE_ENROLLMENT
        distinguishing_aspect: "Enrollment is the many-to-many junction of the graph: the same participant may hold one enrollment at each of two employers, but a second live enrollment for the SAME pair is refused, so uniqueness is on the pair and not on either endpoint alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured with default_contribution_rate_bp 500"
            - "Two registered employers, Delta Fabrication and Harbor Micro Foods; one participant, Rosa Lim"
            - "Rosa already holds one NOTIFIED enrollment at Delta Fabrication"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { empA_id: "$.data.id" }
            - call: "POST /employers/${empA_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${empA_id}"
            - call: "POST /employers"
              payload: { ein: "55-1112223", legal_name: "Harbor Micro Foods Inc", worksite_state: "CA", employee_count: 40 }
              as: ProgramAdministrator
              captures: { empB_id: "$.data.id" }
            - call: "POST /employers/${empB_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "hr@harbormicro.example" }
              as: Employer
              as_user_id: "${empB_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${empA_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${empA_id}"
              captures: { enrA_id: "$.data.id" }
          trigger:
            - call: "POST /employers/${empB_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-06", annual_compensation_cents: 4800000 }
              as: Employer
              as_user_id: "${empB_id}"
              captures: { enrB_id: "$.data.id" }
            - call: "POST /employers/${empA_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-07", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${empA_id}"
          assert:
            - "the first trigger call returns status == 201"
            - "Enrollment.${enrB_id}.employer_id == ${empB_id}"
            - "Enrollment.${enrB_id}.participant_id == ${par_id}"
            - "Enrollment.${enrA_id}.employer_id == ${empA_id}"
            - "the second trigger call returns status == 409 with data.error_id == ERR_DUPLICATE_ENROLLMENT"
            - "GET /enrollments with participant_id ${par_id} returns total_count == 2"
            - "GET /enrollments with employer_id ${empA_id} returns total_count == 1"

  # ===========================================================================
  # SECTION 2 / 9 — state_machines  (claim-extraction-guide: From Table 2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: enrollment_starts_in_notified_with_the_program_default_rate
        claim_type: initial_state
        grounds:
          - state_machines.Enrollment.initial_state
          - entities.Enrollment.fields.opt_out_deadline
          - calculations.default_rate_and_escalation
        distinguishing_aspect: "A freshly created enrollment is NOTIFIED, never ACTIVE: no account exists yet, first_contribution_date is null, and opt_out_deadline is date(created_at) + opt_out_window_days = 2026-01-31 rather than hire_date + 30, so the window is anchored on notification and not on hire."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 with default_contribution_rate_bp 500 and opt_out_window_days at its default of 30"
            - "Delta Fabrication registered; participant Rosa Lim exists; no Enrollment and no ParticipantAccount rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
          trigger:
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
          assert:
            - "response status == 201"
            - "Enrollment.${enr_id}.enrollment_status == NOTIFIED"
            - "Enrollment.${enr_id}.contribution_rate_bp == 500"
            - "Enrollment.${enr_id}.rate_source == DEFAULT"
            - "Enrollment.${enr_id}.opt_out_deadline == 2026-01-31"
