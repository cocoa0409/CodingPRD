  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_across_hold_cancel_and_decline
        grounds:
          - endpoints.POST_bidders_bidder_id_deposits
          - endpoints.POST_bidder-registrations
          - state_machines.BidderRegistration.APPROVED_to_CANCELLED
          - state_machines.BidderRegistration.REQUESTED_to_DECLINED
          - entities.Bidder.fields.deposit_total_cents
        distinguishing_aspect: |
          Across a hold, an approved-then-cancelled registration, a declined
          registration and a final smaller hold, deposit_total_cents never moves
          from 1500000 and the invariant total == held + available + forfeited holds
          at all five checkpoints, ending at held 1000000 and available 500000.
        test_recipe:
          setup:
            - "US yard with three TIMED_ONLINE auctions (online events are exempt from the teardown-buffer conflict rule)"
            - "one US bidder with a single 1500000 cash deposit: total 1500000, held 0, available 1500000"
