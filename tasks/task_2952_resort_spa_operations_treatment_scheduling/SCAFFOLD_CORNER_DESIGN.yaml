        captures: { inA: $.data.id }
      - call: POST /intake-forms/${inA}/consent
        payload: { consent_version: "2026.1" }
        as: Guest
        as_user_id: "${gA}"
      - call: POST /intake-forms/${inA}/submit
        payload: {}
        as: Guest
        as_user_id: "${gA}"
      - call: POST /guests
        payload: { full_name: "Guest No Consent", resort_room_number: "1602", folio_limit_cents: 500000 }
        as: SpaCoordinator
        captures: { gB: $.data.id, gB_v: $.data.version }
