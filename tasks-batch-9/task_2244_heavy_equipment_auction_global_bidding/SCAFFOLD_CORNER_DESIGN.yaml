# =============================================================================
# §1.9 Scaffold Corner Design — task_2244 Heavy Equipment Auction & Global Bidding
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walked section-by-section against
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# is the depth probe; corners already asserted there appear here as
# `excluded_because:` stubs naming the covering instance.
#
# Every chain starts from an empty database. The logical clock defaults to
# 2026-08-01T00:00:00Z and is pinned explicitly wherever a temporal rule is in
# play. All money is in whole cents; every formula-derived literal below was
# computed against the §1.3 formulas and their constants.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: yard_creation_returns_persisted_record_with_envelope
        claim_type: creation
        grounds:
          - endpoints[POST /yards]
          - entities.Yard.fields.code
          - entities.Yard.fields.country_code
        distinguishing_aspect: >
          POST /yards with every input field supplied returns 201 with the §1.0
          object envelope and a Yard at version 1 whose stored code is YRD-HOU.
        test_recipe:
          setup:
            - empty database; logical clock pinned to the 2026-08-01T00:00:00Z default
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: POST /yards
              payload:
                code: YRD-HOU
                country_code: US
                teardown_buffer_minutes: 90
                loadout_deadline_days: 14
                currency_code: USD
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
          assert:
            - HTTP status is 201
            - meta.api_request_id and meta.api_request_timestamp are present and response_type == "object"
            - Yard.code == "YRD-HOU" and Yard.country_code == "US"
            - Yard.teardown_buffer_minutes == 90 and Yard.loadout_deadline_days == 14 and Yard.currency_code == "USD"
            - Yard.version == 1 and Yard.created_at == "2026-08-01T00:00:00Z"

      - name: yard_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Yard.fields.teardown_buffer_minutes
          - entities.Yard.fields.loadout_deadline_days
          - entities.Yard.fields.currency_code
        distinguishing_aspect: >
          Omitting the three optional Yard inputs yields exactly
          teardown_buffer_minutes 120, loadout_deadline_days 10 and
          currency_code USD rather than nulls.
        test_recipe:
          setup:
            - empty database
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: POST /yards
              payload: { code: YRD-BNE, country_code: AU }
              as: PlatformAdmin
          assert:
            - HTTP status is 201
            - Yard.teardown_buffer_minutes == 120
            - Yard.loadout_deadline_days == 10
            - Yard.currency_code == "USD"

      - name: bidder_tier_and_deposit_ledger_fields_are_computed
        claim_type: computed_fields
        grounds:
          - entities.Bidder.fields.country_tier
          - entities.Bidder.fields.deposit_available_cents
          - calculations.bidder_exposure_and_bid_cap
        distinguishing_aspect: >
          A Brazilian bidder is stamped country_tier TIER_B by the
          COUNTRY_TIER_B_CODES constant while every deposit ledger field starts
          at 0, none of which the client supplied.
        test_recipe:
          setup:
            - empty database
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: POST /bidders
              payload: { legal_name: Andes Maquinaria Ltda, country_code: BR, tax_id: BR-4711 }
              as: PlatformAdmin
          assert:
            - HTTP status is 201
            - Bidder.country_tier == "TIER_B"
            - Bidder.deposit_total_cents == 0 and Bidder.deposit_held_cents == 0 and Bidder.deposit_available_cents == 0
            - Bidder.deposit_forfeited_cents == 0 and Bidder.open_exposure_cents == 0
            - Bidder.default_strike_count == 0 and Bidder.lifetime_purchase_cents == 0

      - name: get_unknown_auction_returns_404_auction_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_AUCTION_NOT_FOUND]
        distinguishing_aspect: >
          A well-formed but unknown auction id on GET /auctions/{auction_id}
          returns ERR_AUCTION_NOT_FOUND with HTTP 404, not an empty object.
        test_recipe:
          setup:
            - empty database; no Auction row exists
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: GET /auctions/00000000-0000-4000-8000-000000000000
              payload: {}
              as: AuctionOperator
              captures: { err_id: "$.data.error_id" }
          assert:
            - HTTP status is 404
            - response_type == "error" and data.error_id == "ERR_AUCTION_NOT_FOUND"

      - name: consignment_without_agreement_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /consignments]
        distinguishing_aspect: >
          Dropping the required agreement_type from POST /consignments returns
          ERR_INVALID_REQUEST (400) and creates no Consignment row.
        test_recipe:
          setup:
            - one Consignor (Lone Star Fleet, US, FLEET_OWNER) exists
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
          trigger:
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { err_id: "$.data.error_id" }
            - call: GET /consignors/${consignor_id}/consignments
              payload: {}
              as: PlatformAdmin
          assert:
            - first call HTTP status is 400 with data.error_id == "ERR_INVALID_REQUEST"
            - 'GET /consignors/${consignor_id}/consignments: meta.total_count == 0 and data == []'

      - name: lot_model_year_below_range_and_bad_enum_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.Lot.fields.model_year
          - entities.Consignor.fields.seller_type
          - validations[priority=3]
        distinguishing_aspect: >
          model_year 1959 violates the declared 1960..2030 numeric range and
          seller_type LESSOR is outside the declared enum domain; both return
          ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - one Consignor and one DRAFT RESERVE Consignment exist
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { consignment_id: "$.data.id" }
          trigger:
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Caterpillar
                model: D8T
                model_year: 1959
                serial_number: CAT-D8T-9001
                hour_meter_reading: 6200
                weight_kg: 36000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { err_year: "$.data.error_id" }
            - call: POST /consignors
              payload: { legal_name: Gulf Coast Leasing, country_code: US, seller_type: LESSOR }
              as: PlatformAdmin
              captures: { err_enum: "$.data.error_id" }
          assert:
            - POST /lots HTTP status is 400 with data.error_id == "ERR_INVALID_REQUEST"
            - POST /consignors HTTP status is 400 with data.error_id == "ERR_INVALID_REQUEST"
            - no Lot row and exactly one Consignor row exist after both calls

      - name: unknown_foreign_keys_in_request_bodies_are_rejected_as_not_found
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=5]
          - errors[ERR_CONSIGNOR_NOT_FOUND]
          - errors[ERR_CONSIGNMENT_NOT_FOUND]
        distinguishing_aspect: >
          On the flat topology every body FK is resolved before anything else:
          an unknown consignor_id yields ERR_CONSIGNOR_NOT_FOUND and an unknown
          consignment_id yields ERR_CONSIGNMENT_NOT_FOUND, each 404.
        test_recipe:
          setup:
            - one Consignor exists so the acting identity is valid; no Consignment exists
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
          trigger:
            - call: POST /consignments
              payload:
                consignor_id: 00000000-0000-4000-8000-0000000000aa
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { err_consignor: "$.data.error_id" }
            - call: POST /lots
              payload:
                consignment_id: 00000000-0000-4000-8000-0000000000bb
                make: Komatsu
                model: PC490
                model_year: 2020
                serial_number: KOM-PC490-0001
                hour_meter_reading: 4100
                weight_kg: 48000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { err_consignment: "$.data.error_id" }
          assert:
            - POST /consignments HTTP status is 404 with data.error_id == "ERR_CONSIGNOR_NOT_FOUND"
            - POST /lots HTTP status is 404 with data.error_id == "ERR_CONSIGNMENT_NOT_FOUND"

      - name: lot_listing_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /lots]
          - response_envelope.pagination_fields
        distinguishing_aspect: >
          With three lots on one consignment, GET /lots?limit=2&offset=0 returns
          two rows with total_count 3 and has_more true, and offset=2 returns the
          remaining row with has_more false.
        test_recipe:
          setup:
            - one Consignor, one DRAFT RESERVE Consignment and three Lots created in serial order
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { consignment_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Caterpillar
                model: D8T
                model_year: 2019
                serial_number: CAT-D8T-0001
                hour_meter_reading: 6200
                weight_kg: 36000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot1_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Komatsu
                model: WA470
                model_year: 2018
                serial_number: KOM-WA470-0002
                hour_meter_reading: 8800
                weight_kg: 24000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot2_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Volvo
                model: EC220
                model_year: 2021
                serial_number: VOL-EC220-0003
                hour_meter_reading: 2100
                weight_kg: 9000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot3_id: "$.data.id" }
          trigger:
            - call: GET /lots
              payload: { consignment_id: "${consignment_id}", limit: 2, offset: 0 }
              as: AuctionOperator
            - call: GET /lots
              payload: { consignment_id: "${consignment_id}", limit: 2, offset: 2 }
              as: AuctionOperator
          assert:
            - 'first page: response_type == "array", len(data) == 2, meta.total_count == 3, meta.limit == 2, meta.offset == 0, meta.has_more == true'
            - 'second page: len(data) == 1, meta.total_count == 3, meta.offset == 2, meta.has_more == false'
            - the three returned ids are exactly ${lot1_id}, ${lot2_id} and ${lot3_id} with no duplicates across pages

      - name: lot_retrieval_returns_the_stored_lot
        claim_type: retrieval
        grounds:
          - endpoints[GET /lots/{lot_id}]
          - entities.Lot.fields.serial_number
          - entities.Lot.fields.lifecycle_status
        distinguishing_aspect: >
          GET /lots/{lot_id} echoes the stored serial_number CAT-D8T-0001 and the
          two initial state fields INTAKE and TITLE_PENDING for the created row.
        test_recipe:
          setup:
            - one Consignor, one DRAFT RESERVE Consignment and one Lot exist
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { consignment_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Caterpillar
                model: D8T
                model_year: 2019
                serial_number: CAT-D8T-0001
                hour_meter_reading: 6200
                weight_kg: 36000
                title_required: true
                reserve_price_cents: 10000000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot1_id: "$.data.id" }
          trigger:
            - call: GET /lots/${lot1_id}
              payload: {}
              as: Bidder
          assert:
            - HTTP status is 200 and data.id == ${lot1_id}
            - Lot.serial_number == "CAT-D8T-0001" and Lot.weight_kg == 36000 and Lot.hour_meter_reading == 6200
            - Lot.title_required == true and Lot.reserve_price_cents == 10000000
            - Lot.lifecycle_status == "INTAKE" and Lot.title_status == "TITLE_PENDING"
            - Lot.auction_id is null and Lot.high_bid_cents == 0

      - name: bidder_registration_paddle_number_is_system_allocated
        claim_type: system_fields
        grounds:
          - entities.BidderRegistration.fields.paddle_number
          - endpoints[POST /bidder-registrations]
        distinguishing_aspect: >
          Paddle numbers are minted by the server starting at 101 and increment
          per auction, so two registrations at the same auction hold 101 and 102
          while the client supplied neither.
        test_recipe:
          setup:
            - one yard, one SCHEDULED LIVE_ONSITE auction, two TIER_A bidders each funded with 200000 of deposit
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /yards
              payload: { code: YRD-DAL, country_code: US, teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: USD }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: POST /auctions
              payload:
                yard_id: ${yard_id}
                kind: LIVE_ONSITE
                reserve_policy: RESERVE_ALLOWED
                premium_schedule_code: STANDARD
                window_start: "2026-08-10T14:00:00Z"
                window_end: "2026-08-10T22:00:00Z"
              as: AuctionOperator
              captures: { auction_id: "$.data.id" }
            - call: POST /bidders
              payload: { legal_name: Rio Grande Contractors, country_code: US }
              as: PlatformAdmin
              captures: { bidder1_id: "$.data.id" }
            - call: POST /bidders/${bidder1_id}/deposits
              payload: { amount_cents: 200000, reference: WIRE-A-1 }
              as: SettlementOfficer
            - call: POST /bidders
              payload: { legal_name: Prairie Earthworks, country_code: CA }
              as: PlatformAdmin
              captures: { bidder2_id: "$.data.id" }
            - call: POST /bidders/${bidder2_id}/deposits
              payload: { amount_cents: 200000, reference: WIRE-B-1 }
              as: SettlementOfficer
          trigger:
            - call: POST /bidder-registrations
              payload: { bidder_id: "${bidder1_id}", auction_id: "${auction_id}", deposit_hold_cents: 100000 }
              as: Bidder
              as_user_id: ${bidder1_id}
              captures: { reg1_id: "$.data.id" }
            - call: POST /bidder-registrations
              payload: { bidder_id: "${bidder2_id}", auction_id: "${auction_id}", deposit_hold_cents: 100000 }
              as: Bidder
              as_user_id: ${bidder2_id}
              captures: { reg2_id: "$.data.id" }
          assert:
            - both calls return 201 with status == "REQUESTED" and version == 1
            - BidderRegistration.${reg1_id}.paddle_number == 101
            - BidderRegistration.${reg2_id}.paddle_number == 102
            - BidderRegistration.${reg1_id}.created_at == "2026-08-01T00:00:00Z"
            - Bidder.${bidder1_id}.deposit_held_cents == 100000 and Bidder.${bidder1_id}.deposit_available_cents == 100000

      - name: bid_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.Bid.fields.placed_at
          - entities.Bid.fields.status
          - endpoints[POST /bids]
        distinguishing_aspect: >
          Bid is declared with common_fields false, so the created Bid exposes
          id/created_at only, carries no version, is stamped placed_at from the
          logical clock, and §1.5 declares no PATCH or DELETE for /bids/{bid_id}.
        test_recipe:
          setup:
            - one yard, one CATALOG_READY lot with clear title, one OPEN LIVE_ONSITE auction with the lot assigned
            - one US TIER_A bidder funded with 2000000 and an APPROVED registration holding 1500000
            - logical clock moved into the auction window at 2026-08-10T16:00:00Z
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /yards
              payload: { code: YRD-DAL, country_code: US, teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: USD }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { consignment_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Caterpillar
                model: D8T
                model_year: 2019
                serial_number: CAT-D8T-0001
                hour_meter_reading: 6200
                weight_kg: 36000
                reserve_price_cents: 10000000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot1_id: "$.data.id" }
            - call: POST /consignments/${consignment_id}/submit
              payload: {}
              as: Consignor
              as_user_id: ${consignor_id}
            - call: POST /consignments/${consignment_id}/intake-decision
              payload: { decision: ACCEPT }
              as: AuctionOperator
            - call: POST /lots/${lot1_id}/lien-search
              payload: { lien_search_reference: LS-0001 }
              as: ComplianceOfficer
            - call: POST /lots/${lot1_id}/lien-result
              payload: { encumbrance_found: false }
              as: ComplianceOfficer
            - call: POST /lots/${lot1_id}/condition-reports
              payload:
                structural_score: 83.5
                powertrain_score: 77.5
                hydraulics_score: 64.5
                tires_score: 58.5
                observed_hour_meter_reading: 6200
                hour_meter_verified: true
              as: IntakeInspector
              as_user_id: inspector-1
              captures: { report1_id: "$.data.id" }
            - call: POST /condition-reports/${report1_id}/publish
              payload: {}
              as: IntakeInspector
              as_user_id: inspector-1
            - call: POST /auctions
              payload:
                yard_id: ${yard_id}
                kind: LIVE_ONSITE
                reserve_policy: RESERVE_ALLOWED
                premium_schedule_code: STANDARD
                window_start: "2026-08-10T14:00:00Z"
                window_end: "2026-08-10T22:00:00Z"
              as: AuctionOperator
              captures: { auction_id: "$.data.id" }
            - call: POST /auctions/${auction_id}/lot-assignments
              payload: { lot_id: "${lot1_id}" }
              as: AuctionOperator
            - call: POST /bidders
              payload: { legal_name: Rio Grande Contractors, country_code: US }
              as: PlatformAdmin
              captures: { bidder1_id: "$.data.id" }
            - call: POST /bidders/${bidder1_id}/deposits
              payload: { amount_cents: 2000000, reference: WIRE-A-1 }
              as: SettlementOfficer
            - call: POST /bidder-registrations
              payload: { bidder_id: "${bidder1_id}", auction_id: "${auction_id}", deposit_hold_cents: 1500000 }
              as: Bidder
              as_user_id: ${bidder1_id}
              captures: { reg1_id: "$.data.id" }
            - call: POST /bidder-registrations/${reg1_id}/credit-decision
              payload: { decision: APPROVE, approved_credit_limit_cents: 0 }
              as: SettlementOfficer
              as_user_id: credit-officer-1
            - call: POST /auctions/${auction_id}/open
              payload: {}
              as: AuctionOperator
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-10T16:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: POST /bids
              payload: { registration_id: "${reg1_id}", lot_id: "${lot1_id}", amount_cents: 11000000 }
              as: Bidder
              as_user_id: ${bidder1_id}
              captures: { bid1_id: "$.data.id" }
            - call: GET /bids/${bid1_id}
              payload: {}
              as: Bidder
              as_user_id: ${bidder1_id}
          assert:
            - POST /bids returns 201 with data.id present and data.status == "ACTIVE"
            - Bid.placed_at == "2026-08-10T16:00:00Z"
            - the Bid payload contains no `version` and no `updated_at` key (common_fields false)
            - §1.5 declares no PATCH /bids/{bid_id} and no DELETE /bids/{bid_id}
            - GET /bids/${bid1_id} returns the identical amount_cents 11000000 and placed_at value
            - Lot.${lot1_id}.high_bid_cents == 11000000

  # ===========================================================================
  # SECTION 2 — STATE MACHINES (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: consignment_and_lot_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Consignment.initial_state
          - state_machines.Lot.initial_state
          - entities.Lot.fields.title_status
        distinguishing_aspect: >
          A freshly created Consignment is DRAFT and its Lot occupies both
          declared initial states at once - lifecycle_status INTAKE and
          title_status TITLE_PENDING - with advance_outstanding_cents mirroring
          the advance actually paid.
        test_recipe:
          setup:
            - one Consignor exists
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
          trigger:
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
                advance_paid_cents: 2000000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { consignment_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Caterpillar
                model: D8T
                model_year: 2019
                serial_number: CAT-D8T-0001
                hour_meter_reading: 6200
                weight_kg: 36000
              as: Consignor
              as_user_id: ${consignor_id}
          assert:
            - Consignment.status == "DRAFT" and Consignment.advance_outstanding_cents == 2000000
            - Consignment.unsold_lot_count == 0 and Consignment.reoffer_lot_count == 0
            - Lot.lifecycle_status == "INTAKE" and Lot.title_status == "TITLE_PENDING"
            - Lot.auction_id is null and Lot.high_bid_cents == 0
            - Consignor.${consignor_id}.open_consignment_count == 1

      - name: refurbishment_rework_lap_returns_the_order_to_in_progress
        claim_type: valid_transition
        grounds:
          - state_machines.RefurbishmentOrder.QA_REVIEW_to_REWORK
          - state_machines.RefurbishmentOrder.REWORK_to_IN_PROGRESS
          - entities.RefurbishmentOrder.fields.rework_round
        distinguishing_aspect: >
          QA_REWORK followed by START drives the order QA_REVIEW -> REWORK ->
          IN_PROGRESS and leaves rework_round == 1, proving the cyclic edge is
          counted rather than swallowed.
        test_recipe:
          setup:
            - one Consignor, one RESERVE Consignment, one INSPECTED lot with a DRAFT refurbishment order
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: POST /consignments
              payload:
                consignor_id: ${consignor_id}
                agreement_type: RESERVE
                commission_schedule_code: RESERVE_STD
                refurb_authorization_cap_cents: 500000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { consignment_id: "$.data.id" }
            - call: POST /lots
              payload:
                consignment_id: ${consignment_id}
                make: Caterpillar
                model: D8T
                model_year: 2019
                serial_number: CAT-D8T-0001
                hour_meter_reading: 6200
                weight_kg: 36000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot1_id: "$.data.id" }
            - call: POST /lots/${lot1_id}/condition-reports
              payload:
                structural_score: 83.5
                powertrain_score: 77.5
                hydraulics_score: 64.5
                tires_score: 58.5
                observed_hour_meter_reading: 6200
                hour_meter_verified: true
              as: IntakeInspector
              as_user_id: inspector-1
              captures: { report1_id: "$.data.id" }
            - call: POST /refurbishment-orders
              payload: { lot_id: "${lot1_id}", scope_note: "replace final drive seals and pressure wash", estimated_cost_cents: 400000 }
              as: IntakeInspector
              as_user_id: inspector-1
              captures: { order1_id: "$.data.id" }
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: START }
              as: IntakeInspector
              as_user_id: inspector-1
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: SUBMIT_QA, actual_cost_cents: 420000 }
              as: IntakeInspector
              as_user_id: inspector-1
          trigger:
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: QA_REWORK, qa_note: "seal weeping under load test" }
              as: IntakeInspector
              as_user_id: inspector-2
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: START }
              as: IntakeInspector
              as_user_id: inspector-1
          assert:
            - QA_REWORK returns 200 with status == "REWORK" and rework_round == 1
            - START returns 200 with status == "IN_PROGRESS" and rework_round == 1
            - RefurbishmentOrder.actual_cost_cents == 420000 is preserved across both transitions
            - Lot.${lot1_id}.lifecycle_status == "INSPECTED" (the refurbishment loop does not move the lot)

      - name: third_refurbishment_rework_lap_is_rejected_at_max_rework_rounds
        claim_type: cyclic_loop_limit
        grounds:
          - validations[priority=28]
          - errors[ERR_MAX_REWORK_ROUNDS_EXCEEDED]
          - entities.RefurbishmentOrder.fields.rework_round
        distinguishing_aspect: >
          The rework cycle is bounded at MAX_REWORK_ROUNDS = 2, so the third
          QA_REWORK returns ERR_MAX_REWORK_ROUNDS_EXCEEDED (422) while
          rework_round stays 2 and the order stays in QA_REVIEW.
        test_recipe:
          setup:
            - a refurbishment order that has already absorbed two rework laps and is back in QA_REVIEW
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /consignors
              payload: { legal_name: Lone Star Fleet, country_code: US, seller_type: FLEET_OWNER }
