          The cap is per-product configuration, not a program constant: 130000 of claimed savings is
          legal on the solar product (cap 300000) and illegal on the hvac product (cap 120000) inside
          the SAME application, and the boundary is inclusive, so exactly 120000 on the hvac product
          passes. An implementation that caches one cap or compares with strict `<` mis-handles two of
          the three probes.
