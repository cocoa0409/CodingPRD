              payload: { decision_category: "DEACTIVATED", decision_basis: "First S4 physical assault establishing the standing enforcement action.", expected_incident_version: "${inc1_v_ready}" }
              as: SafetyInvestigator
            - call: "GET /safety/accounts/${acct_id}"
