scenario: |
  Generate task harder than expert level!

  2614. Charitable Solicitation Registration (nonprofit compliance office): state-by-state registration
  requirements based on solicitation activity, online presence and donor locations, initial registration
  with governing documents, financial statements and officer disclosures, annual renewal calendar with
  varying fiscal-year-based deadlines and extension requests, financial statement threshold requirements
  for review or audit by state, professional fundraiser and fundraising counsel registration with
  contract filing obligations, disclosure statement requirements in solicitation materials by state,
  charitable sales promotion and commercial co-venture filings with cause marketing partners,
  delinquency, penalty and cease-solicitation order remediation
domain_name: charitable-solicitation-registration
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Organization and ProfessionalFundraiser are joined many-to-many by
  # FundraisingContract and CoventurePromotion; StateRegistration is self-referential
  # through supersedes_registration_id; StateProfile is a value-keyed configuration
  # node every calculation reads. No single ownership tree exists.

  state_machine_shape: cyclic
  # StateRegistration loops SUBMITTED -> DEFICIENT -> SUBMITTED; EnforcementAction loops
  # ESCALATED -> REMEDIATION_SUBMITTED -> ESCALATED. Organization carries two independent
  # derived state dimensions (solicitation_posture, filing_posture) that evolve on their
  # own axes and gate child operations.

  relationship_patterns:
    - one_to_many          # Organization -> StateRegistration, FinancialStatement, OfficerDisclosure
    - many_to_many         # Organization <-> ProfessionalFundraiser via FundraisingContract / CoventurePromotion
    - self_referential     # StateRegistration.supersedes_registration_id -> StateRegistration.id
    - cross_aggregate      # StateRegistration reads FinancialStatement + StateProfile across aggregates

  role_model: segregation_of_duties
  # A registration may not be certified by an officer who prepared any document on it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Organization
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the charitable organization.
        constraints: "1..200 chars, non-empty"
      - name: ein
        type: string
        source: input
        description: Federal employer identification number.
        constraints: "exactly 9 digits; unique across all Organization rows"
      - name: domicile_state_code
        type: string
        source: input
        description: Two-letter code of the state of incorporation / principal office.
        constraints: "must match an existing StateProfile.state_code"
      - name: fiscal_year_end_month
        type: integer
        source: input
        description: Calendar month in which the organization's fiscal year ends.
        constraints: "1..12 inclusive"
      - name: has_online_donation_page
        type: boolean
        source: input
        default: false
        description: True when the organization operates an interactive online donation page.
      - name: lifecycle_status
        type: enum
        source: input
        default: ACTIVE
        description: Corporate lifecycle status.
        constraints: "one of {ACTIVE, DISSOLVED}"
      - name: solicitation_posture
        type: enum
        source: computed
        default: CLEAR
        description: >-
          Derived solicitation gate, dimension 1 of this entity's two independent state
          dimensions. CLEAR when ceased_state_codes is empty; RESTRICTED when
          ceased_state_codes has exactly one element and that element is not
          domicile_state_code; HALTED when ceased_state_codes contains
          domicile_state_code OR len(ceased_state_codes) >= 2.
        constraints: "one of {CLEAR, RESTRICTED, HALTED}"
      - name: filing_posture
        type: enum
        source: computed
        default: CURRENT
        description: >-
          Derived filing gate, dimension 2. DELINQUENT when
          delinquent_registration_count >= 1, otherwise CURRENT.
        constraints: "one of {CURRENT, DELINQUENT}"
      - name: registered_state_count
        type: integer
        source: computed
        default: 0
        description: "Count of StateRegistration rows for this organization with status == REGISTERED."
      - name: delinquent_registration_count
        type: integer
        source: computed
        default: 0
        description: "Count of StateRegistration rows for this organization with status == DELINQUENT."
      - name: ceased_state_codes
        type: array
        source: computed
        default: []
        description: >-
          Distinct state_code values of StateRegistration rows for this organization with
          status == CEASED, sorted ascending by state_code.
      - name: penalty_outstanding_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Sum of EnforcementAction.penalty_cents over this organization's actions whose
          status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}. Conserved quantity of
          invariant penalty_ledger_conservation.

  - name: StateProfile
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter state code; the natural key of this configuration row.
        constraints: "exactly 2 uppercase letters; unique across all StateProfile rows"
      - name: registration_required
        type: boolean
        source: input
        description: True when this state requires charitable solicitation registration at all.
      - name: renewal_due_rule
        type: enum
        source: input
        description: Rule this state uses to derive the annual renewal deadline from the fiscal year end.
        constraints: "one of {FYE_PLUS_4M_15D, FYE_PLUS_6M, CALENDAR_MAY_15}"
      - name: assurance_basis
        type: enum
        source: input
        description: Which financial metric this state measures against its review/audit thresholds.
        constraints: "one of {CONTRIBUTIONS_ONLY, GROSS_REVENUE}"
      - name: review_threshold_cents
        type: integer
        source: input
        description: Metric value at or above which an independent REVIEW is required.
        constraints: ">= 0"
      - name: audit_threshold_cents
        type: integer
        source: input
        description: Metric value at or above which an independent AUDIT is required.
        constraints: ">= review_threshold_cents"
      - name: donor_count_trigger
        type: integer
        source: input
        default: 25
        description: Donor count at or above which solicitation activity triggers registration.
      - name: contribution_trigger_cents
        type: integer
        source: input
        default: 2500000
        description: Contribution total at or above which solicitation activity triggers registration.
      - name: online_presence_counts
        type: boolean
        source: input
        default: false
        description: True when targeted web solicitation alone triggers registration in this state.
      - name: extension_allowed
        type: boolean
        source: input
        default: false
        description: True when this state accepts renewal deadline extension requests.
      - name: extension_max_days
        type: integer
        source: input
        default: 0
        description: Maximum number of days this state will extend a renewal deadline.
      - name: disclosure_required_clauses
        type: array
        source: input
        default: []
        description: >-
          Base clause set this state requires in solicitation materials. Members drawn from
          the canonical clause order [REGISTRATION_DISCLOSURE, FINANCIAL_STATEMENT_AVAILABILITY,
          PAID_SOLICITOR_IDENTITY, TAX_DEDUCTIBILITY, PERCENT_TO_CHARITY].
      - name: fundraiser_contract_filing_days
        type: integer
        source: input
        default: 10
        description: Days after contract_start within which a fundraising contract must be filed.
      - name: fundraiser_bond_minimum_cents
        type: integer
        source: input
        default: 0
        description: Minimum surety bond a professional fundraiser must post to register in this state.
      - name: coventure_filing_required
        type: boolean
        source: input
        default: false
        description: True when commercial co-venture promotions must be filed before activation.
      - name: coventure_buffer_days
        type: integer
        source: input
        default: 0
        description: Mandatory separation in days between consecutive promotion windows for one co-venturer.
      - name: base_filing_fee_cents
        type: integer
        source: input
        default: 2500
        description: Floor of the filing fee clamp for this state.
      - name: online_surcharge_cents
        type: integer
        source: input
        default: 0
        description: Surcharge added when the registrant runs an online donation page and online_presence_counts is true.
      - name: per_contract_fee_cents
        type: integer
        source: input
        default: 0
        description: Per-filed-fundraising-contract component of the filing fee.
      - name: filing_fee_cap_cents
        type: integer
        source: input
        default: 30000
        description: Ceiling of the filing fee clamp for this state.
      - name: late_fee_base_cents
        type: integer
        source: input
        default: 2000
        description: First-month late fee used by the escalating monthly penalty accrual.
      - name: late_fee_escalation_pct
        type: number
        source: input
        default: 0.1
        description: Per-month escalation fraction applied to late_fee_base_cents.
      - name: late_fee_cap_cents
        type: integer
        source: input
        default: 50000
        description: Ceiling applied to the summed monthly late fees.
      - name: cure_period_days
        type: integer
        source: input
        default: 30
        description: Days after an enforcement action is issued within which it must be remediated.
      - name: reinstatement_fee_cents
        type: integer
        source: input
        default: 12500
        description: Undiscounted reinstatement fee used by the remediation settlement calculation.

  - name: SolicitationActivity
    parent: Organization
    common_fields: false
    kind: event
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the charity whose solicitation activity this row records."
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the state where donors were solicited.
        constraints: "must match an existing StateProfile.state_code"
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the activity falls in.
        constraints: "2000..2100"
      - name: donor_count
        type: integer
        source: input
        description: Number of distinct donors located in this state during the fiscal year.
        constraints: ">= 0"
      - name: contributions_cents
        type: integer
        source: input
        description: Contributions received from donors located in this state during the fiscal year.
        constraints: ">= 0"
      - name: channels
        type: array
        source: input
        description: Solicitation channels used in this state.
        constraints: "non-empty; members from {MAIL, PHONE, EMAIL, WEB_PASSIVE, WEB_TARGETED, EVENT, GRANT_REQUEST}"
      - name: triggers_registration
        type: boolean
        source: computed
        description: Output of the registration_trigger_evaluation calculation for this row.
      - name: trigger_reasons
        type: array
        source: computed
        description: >-
          Ordered subset of [DONOR_COUNT, CONTRIBUTION_TOTAL, TARGETED_ONLINE_PRESENCE]
          naming which clauses of registration_trigger_evaluation fired, in that canonical order.

  - name: FinancialStatement
    parent: Organization
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the charity this statement belongs to."
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the statement covers.
        constraints: "2000..2100"
      - name: total_revenue_cents
        type: integer
        source: input
        description: Total revenue including contributions and government grants.
        constraints: ">= contributions_cents"
      - name: contributions_cents
        type: integer
        source: input
        description: Contributions from the public, excluding government grants.
        constraints: ">= 0"
      - name: government_grant_cents
        type: integer
        source: input
        default: 0
        description: Government grant revenue included in total_revenue_cents.
        constraints: ">= 0"
      - name: program_expense_cents
        type: integer
        source: input
        description: Program service expense.
        constraints: ">= 0"
      - name: fundraising_expense_cents
        type: integer
        source: input
        description: Fundraising expense.
        constraints: ">= 0"
      - name: management_expense_cents
        type: integer
        source: input
        description: Management and general expense.
        constraints: ">= 0"
      - name: assurance_level
        type: enum
        source: input
        default: NONE
        description: Level of independent assurance actually obtained for this statement.
        constraints: "one of {NONE, REVIEW, AUDIT}"
      - name: statement_status
        type: enum
        source: system
        default: CURRENT
        description: >-
          CURRENT on creation. Set to SUPERSEDED when a later statement for the same
          (organization_id, fiscal_year) is created.
        constraints: "one of {CURRENT, SUPERSEDED}"
      - name: functional_expense_total_cents
        type: integer
        source: computed
        description: "program_expense_cents + fundraising_expense_cents + management_expense_cents."
      - name: program_ratio
        type: number
        source: computed
        description: >-
          program_expense_cents / functional_expense_total_cents, rounded half-up to 4 decimals;
          0.0 when functional_expense_total_cents == 0.

  - name: OfficerDisclosure
    parent: Organization
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the charity this officer serves."
      - name: officer_name
        type: string
        source: input
        description: Full name of the officer or director.
      - name: title
        type: enum
        source: input
        description: Office held.
        constraints: "one of {PRESIDENT, TREASURER, SECRETARY, EXECUTIVE_DIRECTOR, BOARD_CHAIR}"
      - name: is_certifying_officer
        type: boolean
        source: input
        default: false
        description: True when this officer is authorized to certify state filings.
      - name: annual_compensation_cents
        type: integer
        source: input
        default: 0
        description: Annual compensation disclosed for this officer.
        constraints: ">= 0"
      - name: criminal_conviction_disclosed
        type: boolean
        source: input
        default: false
        description: True when the officer discloses a criminal conviction.
      - name: conviction_explanation
        type: string
        source: input
        default: null
        description: Narrative required whenever criminal_conviction_disclosed is true.
      - name: disclosure_status
        type: enum
        source: computed
        description: >-
          INCOMPLETE when criminal_conviction_disclosed == true AND conviction_explanation is
          null or an empty string; COMPLETE otherwise.
        constraints: "one of {COMPLETE, INCOMPLETE}"

  - name: StateRegistration
    parent: Organization
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the registrant charity."
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the state being registered in.
        constraints: "must match an existing StateProfile.state_code"
      - name: registration_type
        type: enum
        source: input
        description: Whether this filing opens a registration or renews one.
        constraints: "one of {INITIAL, RENEWAL}"
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year this filing reports on; drives renewal_due_date.
        constraints: "2000..2100"
      - name: coverage_start
        type: datetime
        source: input
        description: Inclusive start of the registration coverage interval (ISO 8601 UTC).
      - name: coverage_end
        type: datetime
        source: input
        description: Exclusive end of the registration coverage interval (ISO 8601 UTC).
        constraints: "strictly after coverage_start"
      - name: financial_statement_id
        type: string
        source: input
        description: "FK -> FinancialStatement.id; the statement supporting this filing."
      - name: supersedes_registration_id
        type: string
        source: input
        default: null
        description: >-
          FK -> StateRegistration.id; the prior REGISTERED registration in the same state that
          this RENEWAL replaces. Null for INITIAL filings.
      - name: certified_by_officer_id
        type: string
        source: system
        default: null
        description: >-
          FK -> OfficerDisclosure.id; the certifying officer whose X-User-ID submitted this filing.
          Stamped on the DRAFT/DEFICIENT -> SUBMITTED transition.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle state of this filing.
        constraints: "one of {DRAFT, SUBMITTED, DEFICIENT, REGISTERED, EXPIRED, DELINQUENT, CEASED, WITHDRAWN}"
      - name: renewal_due_date
        type: datetime
        source: computed
        description: Output of renewal_deadline_derivation for (fiscal_year, Organization.fiscal_year_end_month, StateProfile.renewal_due_rule).
      - name: extended_due_date
        type: datetime
        source: computed
        default: null
        description: >-
          renewal_due_date + granted_days of the single GRANTED ExtensionRequest on this filing;
          null while no ExtensionRequest on this filing has status == GRANTED.
      - name: effective_due_date
        type: datetime
        source: computed
        description: "extended_due_date when it is non-null, else renewal_due_date."
      - name: required_financial_attestation
        type: enum
        source: computed
        description: Output of assurance_requirement_derivation against the linked FinancialStatement.
        constraints: "one of {NONE, REVIEW, AUDIT}"
      - name: filing_fee_cents
        type: integer
        source: computed
        description: Output of filing_fee_assessment; recomputed on create and on each submit.
      - name: deficiency_round_count
        type: integer
        source: system
        default: 0
        description: Number of times this filing has entered DEFICIENT.
      - name: deficiency_reasons
        type: array
        source: system
        default: []
        description: Reason codes recorded by the most recent SUBMITTED -> DEFICIENT transition.
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent transition into SUBMITTED.
      - name: registered_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the transition into REGISTERED.

  - name: RegistrationDocument
    parent: StateRegistration
    common_fields: true
    kind: resource
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> StateRegistration.id; the filing this document is attached to."
      - name: doc_type
        type: enum
        source: input
        description: Kind of supporting document.
        constraints: "one of {GOVERNING_DOCUMENT, IRS_DETERMINATION_LETTER, FINANCIAL_STATEMENT, OFFICER_DISCLOSURE_FORM, REVIEW_REPORT, AUDIT_OPINION}"
      - name: prepared_by_officer_id
        type: string
        source: input
        description: "FK -> OfficerDisclosure.id; the officer who prepared this document."
      - name: page_count
        type: integer
        source: input
        description: Page count of the attachment.
        constraints: ">= 1"
      - name: review_status
        type: enum
        source: system
        default: ATTACHED
        description: >-
          ATTACHED on creation; set to ACCEPTED by the SUBMITTED -> REGISTERED transition and
          to REJECTED by the SUBMITTED -> DEFICIENT transition.
        constraints: "one of {ATTACHED, ACCEPTED, REJECTED}"

  - name: ExtensionRequest
    parent: StateRegistration
    common_fields: true
    kind: resource
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> StateRegistration.id; the filing whose deadline is being extended."
      - name: basis
        type: enum
        source: input
        description: Statutory basis of the request.
        constraints: "one of {IRS_990_EXTENSION, STATE_HARDSHIP}"
      - name: requested_days
        type: integer
        source: input
        description: Days of extension requested; ignored when basis == IRS_990_EXTENSION.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Decision state of the request.
        constraints: "one of {PENDING, GRANTED, DENIED, SUPERSEDED}"
      - name: granted_days
        type: integer
        source: computed
        default: 0
        description: Output of extension_grant_length; 0 until status == GRANTED.
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the request left PENDING.

  - name: ProfessionalFundraiser
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the fundraising firm.
      - name: fundraiser_type
        type: enum
        source: input
        description: Statutory classification of the firm.
        constraints: "one of {PROFESSIONAL_SOLICITOR, FUNDRAISING_COUNSEL, COMMERCIAL_COVENTURER}"
      - name: bond_amount_cents
        type: integer
        source: input
        default: 0
        description: Surety bond amount the firm has posted.
        constraints: ">= 0"
      - name: bond_expires_at
        type: datetime
        source: input
        description: Expiry instant of the surety bond (ISO 8601 UTC).
      - name: registry_status
        type: enum
        source: computed
        description: >-
          REGISTERED when at least one FundraiserRegistration for this firm has status == ACTIVE;
          LAPSED when the firm has at least one FundraiserRegistration and none is ACTIVE;
          UNREGISTERED when the firm has no FundraiserRegistration rows.
        constraints: "one of {UNREGISTERED, REGISTERED, LAPSED}"

  - name: FundraiserRegistration
    parent: ProfessionalFundraiser
    common_fields: true
    kind: resource
    fields:
      - name: fundraiser_id
        type: string
        source: input
        description: "FK -> ProfessionalFundraiser.id; the registering firm."
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the state the firm is registering in.
        constraints: "must match an existing StateProfile.state_code"
      - name: bond_on_file_cents
        type: integer
        source: input
        description: Bond amount filed with this state.
        constraints: ">= 0"
      - name: expires_at
        type: datetime
        source: input
        description: Expiry instant of this state registration (ISO 8601 UTC).
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: ACTIVE on creation; set to LAPSED by the compliance sweep once expires_at is at or before the logical clock.
        constraints: "one of {ACTIVE, LAPSED}"

  - name: FundraisingContract
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the charity client."
      - name: fundraiser_id
        type: string
        source: input
        description: "FK -> ProfessionalFundraiser.id; the retained firm."
      - name: state_codes
        type: array
        source: input
        description: Two-letter state codes in which this contract will be performed.
        constraints: "non-empty; every element must match an existing StateProfile.state_code"
      - name: contract_start
        type: datetime
        source: input
        description: Inclusive start of the contract term (ISO 8601 UTC).
      - name: contract_end
        type: datetime
        source: input
        description: Exclusive end of the contract term (ISO 8601 UTC).
        constraints: "strictly after contract_start"
      - name: compensation_type
        type: enum
        source: input
        description: How the firm is paid.
        constraints: "one of {FLAT_FEE, PERCENT_OF_GROSS, HOURLY}"
      - name: percent_of_gross
        type: number
        source: input
        default: 0
        description: Fraction of gross receipts retained; must be > 0 when compensation_type == PERCENT_OF_GROSS.
        constraints: "0..1 inclusive"
      - name: flat_fee_cents
        type: integer
        source: input
        default: 0
        description: Flat compensation; must be > 0 when compensation_type == FLAT_FEE.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Filing state of the contract.
        constraints: "one of {DRAFT, FILED, LATE_FILED, VOIDED}"
      - name: filing_due_date
        type: datetime
        source: computed
        description: >-
          contract_start + min(StateProfile.fundraiser_contract_filing_days) over state_codes,
          expressed in whole days.
      - name: filed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the contract was filed.
      - name: late_filing_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: >-
          LATE_CONTRACT_SURCHARGE_CENTS when the filing transition landed in LATE_FILED,
          otherwise 0.

  - name: CoventurePromotion
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the benefiting charity."
      - name: coventurer_id
        type: string
        source: input
        description: "FK -> ProfessionalFundraiser.id; the commercial co-venturer running the promotion."
      - name: state_codes
        type: array
        source: input
        description: Two-letter state codes in which the charitable sales promotion runs.
        constraints: "non-empty; every element must match an existing StateProfile.state_code"
      - name: promo_start
        type: datetime
        source: input
        description: Inclusive start of the promotion window (ISO 8601 UTC).
      - name: promo_end
        type: datetime
        source: input
        description: Inclusive end of the promotion window (ISO 8601 UTC).
        constraints: "at or after promo_start"
      - name: guaranteed_minimum_cents
        type: integer
        source: input
        default: 0
        description: Guaranteed minimum benefit to the charity regardless of units sold.
        constraints: ">= 0"
      - name: per_unit_cents
        type: integer
        source: input
        default: 0
        description: Benefit to the charity per unit sold.
        constraints: ">= 0"
      - name: projected_units
        type: integer
        source: input
        default: 0
        description: Units the co-venturer projects to sell during the window.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Filing and settlement state of the promotion.
        constraints: "one of {DRAFT, FILED, ACTIVE, SETTLED, DEFICIENT_REMITTANCE, HALTED}"
      - name: projected_benefit_cents
        type: integer
        source: computed
        description: Output of coventure_benefit_determination under variant projected_guarantee_basis.
      - name: actual_units
        type: integer
        source: system
        default: 0
        description: Units reported at settlement.
      - name: remitted_cents
        type: integer
        source: system
        default: 0
        description: Amount actually remitted to the charity at settlement.
      - name: final_benefit_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Output of coventure_benefit_determination under variant actual_settlement_basis;
          0 until the promotion is settled.
      - name: shortfall_cents
        type: integer
        source: computed
        default: 0
        description: "max(0, final_benefit_cents - remitted_cents); 0 until the promotion is settled."
      - name: disclosure_clause_required
        type: boolean
        source: computed
        description: True when any state in state_codes has StateProfile.coventure_filing_required == true.

  - name: DisclosureStatement
    parent: Organization
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the soliciting charity."
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the state whose disclosure law governs this material.
        constraints: "must match an existing StateProfile.state_code"
      - name: material_type
        type: enum
        source: input
        description: Medium of the solicitation material.
        constraints: "one of {WEB, PRINT, PHONE_SCRIPT, EMAIL}"
      - name: included_clauses
        type: array
        source: input
        description: Clauses actually present in the material; members from the canonical clause order.
      - name: required_clauses
        type: array
        source: computed
        description: Output of disclosure_requirement_resolution, in canonical clause order.
      - name: missing_clauses
        type: array
        source: computed
        description: "required_clauses minus included_clauses, in canonical clause order."
      - name: compliance_status
        type: enum
        source: computed
        description: COMPLIANT when missing_clauses is empty, otherwise NON_COMPLIANT.
        constraints: "one of {COMPLIANT, NON_COMPLIANT}"

  - name: EnforcementAction
    parent: Organization
    common_fields: true
    kind: resource
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the respondent charity."
      - name: registration_id
        type: string
        source: input
        description: "FK -> StateRegistration.id; the filing at issue."
      - name: state_code
        type: string
        source: system
        description: Copied from the linked StateRegistration.state_code at creation.
      - name: action_type
        type: enum
        source: input
        description: Kind of enforcement action.
        constraints: "one of {DELINQUENCY_NOTICE, PENALTY_ASSESSMENT, CEASE_SOLICITATION_ORDER}"
      - name: penalty_cents
        type: integer
        source: computed
        description: >-
          The penalty_cents_override from the request when supplied; otherwise the output of
          late_penalty_accrual for the linked registration at the current logical clock.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Enforcement lifecycle state.
        constraints: "one of {OPEN, REMEDIATION_SUBMITTED, CURED, ESCALATED, VACATED}"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the action was created.
      - name: cure_deadline
        type: datetime
        source: computed
        description: "issued_at + StateProfile.cure_period_days for the action's state_code, in whole days."
      - name: settlement_total_cents
        type: integer
        source: computed
        default: 0
        description: >-
          Output of remediation_settlement_total, stamped by the transition into
          REMEDIATION_SUBMITTED; 0 before that transition.
      - name: remediation_note
        type: string
        source: system
        default: null
        description: Narrative supplied with the remediation submission.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StateRegistration
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    shape: "cyclic revision loop (SUBMITTED -> DEFICIENT -> SUBMITTED) plus a fork-join branch out of SUBMITTED"
    transitions:

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /state-registrations/{id}/submit"
        actor: CertifyingOfficer
        preconditions:
          - "StateProfile for state_code exists and registration_required == true"
          - "Organization.solicitation_posture != HALTED"
          - "the acting X-User-ID resolves to an OfficerDisclosure of this Organization with is_certifying_officer == true"
          - "no RegistrationDocument on this filing has prepared_by_officer_id == the acting X-User-ID"
          - "RegistrationDocument set on this filing contains doc_type GOVERNING_DOCUMENT and FINANCIAL_STATEMENT; plus REVIEW_REPORT when required_financial_attestation == REVIEW; plus AUDIT_OPINION when required_financial_attestation == AUDIT"
          - "the linked FinancialStatement has statement_status == CURRENT"
          - "the linked FinancialStatement.assurance_level is at or above required_financial_attestation on the ordered scale NONE < REVIEW < AUDIT"
        side_effects:
          - "sets submitted_at = current logical clock"
          - "sets certified_by_officer_id = acting X-User-ID"
          - "recomputes filing_fee_cents via filing_fee_assessment"
          - "recomputes required_financial_attestation via assurance_requirement_derivation"
          - "increments StateRegistration.version by 1"

      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /state-registrations/{id}/submit"
        actor: CertifyingOfficer
        preconditions:
          - "same preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "clears deficiency_reasons to []"
          - "sets submitted_at = current logical clock; sets certified_by_officer_id = acting X-User-ID"
          - "recomputes filing_fee_cents and required_financial_attestation"
          - "increments StateRegistration.version by 1"
        note: "Closes the revision cycle; deficiency_round_count is NOT reset, so it accumulates across rounds."

      - from: SUBMITTED
        to: REGISTERED
        trigger: "POST /state-registrations/{id}/review with decision == APPROVE"
        actor: StateRegulator
        preconditions:
          - "no other StateRegistration for the same (organization_id, state_code) with status IN {SUBMITTED, REGISTERED, DELINQUENT, CEASED} has a coverage interval overlapping this filing's [coverage_start, coverage_end) under half-open semantics"
          - "when supersedes_registration_id is non-null, that target has organization_id and state_code equal to this filing's and status IN {REGISTERED, DELINQUENT}"
        side_effects:
          - "sets status = REGISTERED and registered_at = current logical clock"
          - "sets review_status = ACCEPTED on every RegistrationDocument of this filing"
          - "CASCADE L1: when supersedes_registration_id is non-null, the target StateRegistration transitions REGISTERED -> EXPIRED"
          - "CASCADE L2 (caused by L1): every EnforcementAction with registration_id == the expired target and status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED} transitions to CURED"
          - "CASCADE L3 (caused by L2): Organization.penalty_outstanding_cents, delinquent_registration_count and filing_posture are recomputed; Organization.version increments by 1"
          - "recomputes Organization.registered_state_count and Organization.ceased_state_codes"
          - "increments StateRegistration.version by 1"
        note: "APPROVE branch of the fork out of SUBMITTED; side-effect set is disjoint from the DEFICIENT branch."

      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /state-registrations/{id}/review with decision == DEFICIENT"
        actor: StateRegulator
        preconditions:
          - "deficiency_reasons supplied in the request is a non-empty array"
        side_effects:
          - "sets status = DEFICIENT, deficiency_reasons = the supplied array, and increments deficiency_round_count by 1"
          - "sets review_status = REJECTED on every RegistrationDocument of this filing"
          - "does NOT touch Organization.registered_state_count, penalty_outstanding_cents or either posture dimension"
          - "increments StateRegistration.version by 1"
        note: "DEFICIENT branch of the fork out of SUBMITTED."

      - from: REGISTERED
        to: DELINQUENT
        trigger: "POST /compliance-sweeps (system sweep at the logical clock)"
        actor: system
        preconditions:
          - "effective_due_date is strictly before the current logical clock"
          - "no StateRegistration for the same (organization_id, state_code) with registration_type == RENEWAL, status == REGISTERED and supersedes_registration_id == this filing's id exists"
        side_effects:
          - "sets status = DELINQUENT"
          - "CASCADE D1: creates an EnforcementAction with action_type = DELINQUENCY_NOTICE, status = OPEN, registration_id = this filing, penalty_cents = late_penalty_accrual at the sweep clock, cure_deadline = sweep clock + StateProfile.cure_period_days"
          - "CASCADE D2 (caused by D1): Organization.penalty_outstanding_cents increases by the new action's penalty_cents; delinquent_registration_count increases by 1; filing_posture is recomputed to DELINQUENT; Organization.version increments by 1"
          - "CASCADE D3 (caused by D2, only when filing_posture became DELINQUENT): every ExtensionRequest with status == PENDING on any StateRegistration of this Organization transitions PENDING -> DENIED with decided_at = sweep clock"
          - "increments StateRegistration.version by 1"
        note: "Sweep processes candidate registrations in created_at ASC order."

      - from: DELINQUENT
        to: CEASED
        trigger: "POST /enforcement-actions/{id}/decide with decision == ESCALATE"
        actor: StateRegulator
        preconditions:
          - "the deciding EnforcementAction has registration_id == this filing"
        side_effects:
          - "sets status = CEASED"
          - "recomputes Organization.ceased_state_codes and solicitation_posture; increments Organization.version by 1"
          - "increments StateRegistration.version by 1"

      - from: CEASED
        to: REGISTERED
        trigger: "POST /enforcement-actions/{id}/decide with decision == CURE"
        actor: StateRegulator
        preconditions:
          - "the deciding EnforcementAction has registration_id == this filing and status == REMEDIATION_SUBMITTED"
        side_effects:
          - "sets status = REGISTERED"
          - "recomputes Organization.ceased_state_codes, solicitation_posture, registered_state_count, delinquent_registration_count, penalty_outstanding_cents and filing_posture; increments Organization.version by 1"
          - "increments StateRegistration.version by 1"
        note: "Closes the cease-order remediation cycle DELINQUENT -> CEASED -> REGISTERED."

      - from: DELINQUENT
        to: REGISTERED
        trigger: "POST /enforcement-actions/{id}/decide with decision == CURE"
        actor: StateRegulator
        preconditions:
          - "the deciding EnforcementAction has registration_id == this filing and status == REMEDIATION_SUBMITTED"
        side_effects:
          - "sets status = REGISTERED"
          - "recomputes Organization.delinquent_registration_count, registered_state_count, penalty_outstanding_cents and filing_posture; increments Organization.version by 1"
          - "increments StateRegistration.version by 1"

      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /state-registrations/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "no EnforcementAction with registration_id == this filing has status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"
        side_effects:
          - "sets status = WITHDRAWN"
          - "decrements Organization.registered_state_count by 1 and recomputes filing_posture; increments Organization.version by 1"
          - "increments StateRegistration.version by 1"
        note: "Compensating action for SUBMITTED -> REGISTERED under invariant registered_state_count_conservation."

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /state-registrations/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "no EnforcementAction with registration_id == this filing has status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"
        side_effects:
          - "sets status = WITHDRAWN"
          - "leaves Organization.registered_state_count unchanged because a DRAFT filing was never counted"
          - "increments StateRegistration.version by 1"

      - from: REGISTERED
        to: EXPIRED
        trigger: "SUBMITTED -> REGISTERED of a RENEWAL whose supersedes_registration_id targets this filing"
        actor: system
        preconditions:
          - "this filing is the supersede target named by the newly REGISTERED renewal"
        side_effects:
          - "sets status = EXPIRED"
          - "decrements Organization.registered_state_count by 1"
          - "increments StateRegistration.version by 1"
        note: "Link L1 of the review-approve cascade."

      - from: DELINQUENT
        to: EXPIRED
        trigger: "SUBMITTED -> REGISTERED of a RENEWAL whose supersedes_registration_id targets this filing"
        actor: system
        preconditions:
          - "this filing is the supersede target named by the newly REGISTERED renewal"
        side_effects:
          - "sets status = EXPIRED"
          - "decrements Organization.delinquent_registration_count by 1"
          - "increments StateRegistration.version by 1"
        note: "Link L1 of the review-approve cascade when the predecessor had already been swept into DELINQUENT; filing the renewal is therefore itself a cure path, and link L2 closes the predecessor's OPEN delinquency notice."

  - entity: EnforcementAction
    initial_state: OPEN
    terminal_states: [CURED, VACATED]
    shape: "cyclic escalation loop (REMEDIATION_SUBMITTED -> ESCALATED -> REMEDIATION_SUBMITTED) plus a fork out of REMEDIATION_SUBMITTED"
    transitions:

      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /enforcement-actions/{id}/remediate"
        actor: ComplianceOfficer
        preconditions:
          - "the current logical clock is at or before cure_deadline"
        side_effects:
          - "sets status = REMEDIATION_SUBMITTED and remediation_note = the supplied note"
          - "stamps settlement_total_cents via remediation_settlement_total"
          - "leaves Organization.penalty_outstanding_cents unchanged because REMEDIATION_SUBMITTED is still an outstanding status"
          - "increments EnforcementAction.version by 1"

      - from: ESCALATED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /enforcement-actions/{id}/remediate"
        actor: ComplianceOfficer
        preconditions:
          - "the current logical clock is at or before cure_deadline"
        side_effects:
          - "sets status = REMEDIATION_SUBMITTED and remediation_note = the supplied note"
          - "re-stamps settlement_total_cents via remediation_settlement_total"
          - "increments EnforcementAction.version by 1"
        note: "Closes the escalation cycle; a cease-solicitation order can be remediated repeatedly."

      - from: REMEDIATION_SUBMITTED
        to: CURED
        trigger: "POST /enforcement-actions/{id}/decide with decision == CURE"
        actor: StateRegulator
        preconditions:
          - "settlement_total_cents > 0"
        side_effects:
          - "sets status = CURED"
          - "CASCADE C1: the linked StateRegistration transitions CEASED -> REGISTERED or DELINQUENT -> REGISTERED"
          - "CASCADE C2 (caused by C1): Organization.ceased_state_codes, solicitation_posture, delinquent_registration_count, filing_posture, registered_state_count and penalty_outstanding_cents are recomputed; Organization.version increments by 1"
          - "increments EnforcementAction.version by 1"

      - from: REMEDIATION_SUBMITTED
        to: ESCALATED
        trigger: "POST /enforcement-actions/{id}/decide with decision == ESCALATE"
        actor: StateRegulator
        preconditions:
          - "the linked StateRegistration.status IN {DELINQUENT, CEASED}"
        side_effects:
          - "sets status = ESCALATED and action_type = CEASE_SOLICITATION_ORDER"
          - "CASCADE E1: the linked StateRegistration transitions DELINQUENT -> CEASED when its status is DELINQUENT"
          - "CASCADE E2 (caused by E1): Organization.ceased_state_codes gains the registration's state_code and solicitation_posture is recomputed; Organization.version increments by 1"
          - "CASCADE E3 (caused by E2, only when solicitation_posture became RESTRICTED or HALTED): every CoventurePromotion of this Organization with status IN {FILED, ACTIVE} whose state_codes contains the registration's state_code transitions to HALTED"
          - "increments EnforcementAction.version by 1"
        note: "ESCALATE branch of the fork out of REMEDIATION_SUBMITTED; side-effect set is disjoint from the CURE branch."

      - from: OPEN
        to: ESCALATED
        trigger: "POST /enforcement-actions/{id}/decide with decision == ESCALATE"
        actor: StateRegulator
        preconditions:
          - "the current logical clock is strictly after cure_deadline"
          - "the linked StateRegistration.status IN {DELINQUENT, CEASED}"
        side_effects:
          - "identical cascade E1/E2/E3 chain as REMEDIATION_SUBMITTED -> ESCALATED"
          - "sets action_type = CEASE_SOLICITATION_ORDER"
          - "increments EnforcementAction.version by 1"
        note: "Escalation without a remediation submission is only available once the cure window has closed."

      - from: OPEN
        to: VACATED
        trigger: "POST /enforcement-actions/{id}/vacate"
        actor: StateRegulator
        preconditions:
          - "vacate_reason supplied in the request is a non-empty string"
        side_effects:
          - "sets status = VACATED"
          - "Organization.penalty_outstanding_cents decreases by this action's penalty_cents; delinquent_registration_count and filing_posture are recomputed; Organization.version increments by 1"
          - "increments EnforcementAction.version by 1"
        note: "Compensating action for action creation under invariant penalty_ledger_conservation."

      - from: ESCALATED
        to: VACATED
        trigger: "POST /enforcement-actions/{id}/vacate"
        actor: StateRegulator
        preconditions:
          - "vacate_reason supplied in the request is a non-empty string"
        side_effects:
          - "sets status = VACATED"
          - "the linked StateRegistration transitions CEASED -> REGISTERED"
          - "Organization.penalty_outstanding_cents decreases by this action's penalty_cents; ceased_state_codes, solicitation_posture, registered_state_count, delinquent_registration_count and filing_posture are recomputed; Organization.version increments by 1"
          - "increments EnforcementAction.version by 1"

      - from: REMEDIATION_SUBMITTED
        to: VACATED
        trigger: "POST /enforcement-actions/{id}/vacate"
        actor: StateRegulator
        preconditions:
          - "vacate_reason supplied in the request is a non-empty string"
        side_effects:
          - "sets status = VACATED"
          - "Organization.penalty_outstanding_cents decreases by this action's penalty_cents; delinquent_registration_count and filing_posture are recomputed; Organization.version increments by 1"
          - "increments EnforcementAction.version by 1"

  - entity: Organization
    initial_state: "solicitation_posture = CLEAR and filing_posture = CURRENT"
    terminal_states: []
    shape: "two independent derived state dimensions on one row; each dimension evolves on its own axis and both gate child operations"
    transitions:

      - from: CLEAR
        to: RESTRICTED
        trigger: "recomputation of ceased_state_codes after any StateRegistration enters CEASED"
        actor: system
        preconditions:
          - "len(ceased_state_codes) == 1 after recomputation and that element != domicile_state_code"
        side_effects:
          - "sets solicitation_posture = RESTRICTED; leaves filing_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: solicitation_posture"

      - from: CLEAR
        to: HALTED
        trigger: "recomputation of ceased_state_codes after any StateRegistration enters CEASED"
        actor: system
        preconditions:
          - "ceased_state_codes contains domicile_state_code after recomputation"
        side_effects:
          - "sets solicitation_posture = HALTED; leaves filing_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: solicitation_posture — a cease order in the state of domicile skips RESTRICTED entirely"

      - from: RESTRICTED
        to: HALTED
        trigger: "recomputation of ceased_state_codes after a second StateRegistration enters CEASED"
        actor: system
        preconditions:
          - "len(ceased_state_codes) >= 2 OR ceased_state_codes contains domicile_state_code"
        side_effects:
          - "sets solicitation_posture = HALTED; leaves filing_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: solicitation_posture"

      - from: RESTRICTED
        to: CLEAR
        trigger: "recomputation of ceased_state_codes after a CEASED StateRegistration returns to REGISTERED"
        actor: system
        preconditions:
          - "ceased_state_codes is empty after recomputation"
        side_effects:
          - "sets solicitation_posture = CLEAR; leaves filing_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: solicitation_posture"

      - from: HALTED
        to: RESTRICTED
        trigger: "recomputation of ceased_state_codes after a CEASED StateRegistration returns to REGISTERED"
        actor: system
        preconditions:
          - "len(ceased_state_codes) == 1 after recomputation and that element != domicile_state_code"
        side_effects:
          - "sets solicitation_posture = RESTRICTED; leaves filing_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: solicitation_posture"

      - from: HALTED
        to: CLEAR
        trigger: "recomputation of ceased_state_codes after all CEASED StateRegistrations return to REGISTERED"
        actor: system
        preconditions:
          - "ceased_state_codes is empty after recomputation"
        side_effects:
          - "sets solicitation_posture = CLEAR; leaves filing_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: solicitation_posture"

      - from: CURRENT
        to: DELINQUENT
        trigger: "recomputation of delinquent_registration_count after any StateRegistration enters DELINQUENT"
        actor: system
        preconditions:
          - "delinquent_registration_count >= 1 after recomputation"
        side_effects:
          - "sets filing_posture = DELINQUENT; leaves solicitation_posture untouched"
          - "denies every PENDING ExtensionRequest on this Organization's registrations (cascade link D3)"
          - "increments Organization.version by 1"
        note: "dimension: filing_posture"

      - from: DELINQUENT
        to: CURRENT
        trigger: "recomputation of delinquent_registration_count after the last DELINQUENT StateRegistration leaves DELINQUENT"
        actor: system
        preconditions:
          - "delinquent_registration_count == 0 after recomputation"
        side_effects:
          - "sets filing_posture = CURRENT; leaves solicitation_posture untouched"
          - "increments Organization.version by 1"
        note: "dimension: filing_posture"

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, SUPERSEDED]
    shape: "fork out of PENDING with three exits, one of them system-driven"
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /extension-requests/{id}/decide with decision == GRANT"
        actor: StateRegulator
        preconditions:
          - "StateProfile.extension_allowed == true for the linked registration's state_code"
          - "StateProfile.extension_max_days >= 1"
          - "the linked StateRegistration.status IN {DRAFT, SUBMITTED, DEFICIENT, REGISTERED}"
        side_effects:
          - "sets status = GRANTED, granted_days = extension_grant_length output, decided_at = current logical clock"
          - "sets the linked StateRegistration.extended_due_date = renewal_due_date + granted_days and recomputes effective_due_date; increments StateRegistration.version by 1"
          - "increments ExtensionRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /extension-requests/{id}/decide with decision == DENY"
        actor: StateRegulator
        preconditions:
          - "the linked StateRegistration exists"
        side_effects:
          - "sets status = DENIED and decided_at = current logical clock"
          - "leaves the linked StateRegistration.extended_due_date untouched"
          - "increments ExtensionRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "cascade link D3 of REGISTERED -> DELINQUENT (POST /compliance-sweeps)"
        actor: system
        preconditions:
          - "the owning Organization.filing_posture became DELINQUENT in this sweep"
        side_effects:
          - "sets status = DENIED and decided_at = sweep clock"
          - "increments ExtensionRequest.version by 1"
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /extension-requests for the same registration_id"
        actor: system
        preconditions:
          - "a newer ExtensionRequest for the same registration_id has just been created"
        side_effects:
          - "sets status = SUPERSEDED and decided_at = current logical clock"
          - "increments ExtensionRequest.version by 1"
      - from: GRANTED
        to: SUPERSEDED
        trigger: "POST /extension-requests for the same registration_id"
        actor: system
        preconditions:
          - "a newer ExtensionRequest for the same registration_id has just been created"
        side_effects:
          - "sets status = SUPERSEDED and decided_at = current logical clock"
          - "clears the linked StateRegistration.extended_due_date to null and recomputes effective_due_date; increments StateRegistration.version by 1"
          - "increments ExtensionRequest.version by 1"
        note: "The later request legitimately replaces the earlier grant, which is why this create is guarded by OCC rule extension-supersede-stale-registration."

  - entity: FundraisingContract
    initial_state: DRAFT
    terminal_states: [VOIDED]
    shape: "branch on filing timeliness, plus a system-driven void"
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /fundraising-contracts/{id}/file"
        actor: FundraiserAgent
        preconditions:
          - "the acting X-User-ID equals fundraiser_id"
          - "every state_code in state_codes has a FundraiserRegistration for this fundraiser with status == ACTIVE"
          - "the current logical clock is at or before filing_due_date"
        side_effects:
          - "sets status = FILED, filed_at = current logical clock, late_filing_surcharge_cents = 0"
          - "recomputes compliance_status on every DisclosureStatement of the client Organization whose state_code is in state_codes"
          - "increments FundraisingContract.version by 1"
      - from: DRAFT
        to: LATE_FILED
        trigger: "POST /fundraising-contracts/{id}/file"
        actor: FundraiserAgent
        preconditions:
          - "the acting X-User-ID equals fundraiser_id"
          - "every state_code in state_codes has a FundraiserRegistration for this fundraiser with status == ACTIVE"
          - "the current logical clock is strictly after filing_due_date and at or before filing_due_date + CONTRACT_FILING_HARD_STOP_DAYS"
        side_effects:
          - "sets status = LATE_FILED, filed_at = current logical clock, late_filing_surcharge_cents = LATE_CONTRACT_SURCHARGE_CENTS"
          - "recomputes compliance_status on every DisclosureStatement of the client Organization whose state_code is in state_codes"
          - "increments FundraisingContract.version by 1"
        note: "Timeliness branch; the two exits out of DRAFT differ in their surcharge side effect."
      - from: FILED
        to: VOIDED
        trigger: "cascade link F2 of FundraiserRegistration ACTIVE -> LAPSED (POST /compliance-sweeps)"
        actor: system
        preconditions:
          - "state_codes contains the lapsed FundraiserRegistration.state_code"
        side_effects:
          - "sets status = VOIDED"
          - "CASCADE F3 (caused by F2): recomputes required_clauses, missing_clauses and compliance_status on every DisclosureStatement of the client Organization whose state_code is in state_codes"
          - "increments FundraisingContract.version by 1"
      - from: LATE_FILED
        to: VOIDED
        trigger: "cascade link F2 of FundraiserRegistration ACTIVE -> LAPSED (POST /compliance-sweeps)"
        actor: system
        preconditions:
          - "state_codes contains the lapsed FundraiserRegistration.state_code"
        side_effects:
          - "sets status = VOIDED"
          - "CASCADE F3 (caused by F2): recomputes required_clauses, missing_clauses and compliance_status on the client Organization's DisclosureStatement rows for those states"
          - "increments FundraisingContract.version by 1"

  - entity: FundraiserRegistration
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /compliance-sweeps (system sweep at the logical clock)"
        actor: system
        preconditions:
          - "expires_at is at or before the current logical clock"
        side_effects:
          - "CASCADE F1: sets status = LAPSED and recomputes ProfessionalFundraiser.registry_status"
          - "CASCADE F2 (caused by F1): every FundraisingContract of this fundraiser with status IN {FILED, LATE_FILED} whose state_codes contains this state_code transitions to VOIDED"
          - "increments FundraiserRegistration.version by 1"
        note: "Sweep processes candidate fundraiser registrations in created_at ASC order."

  - entity: CoventurePromotion
    initial_state: DRAFT
    terminal_states: [SETTLED, HALTED]
    shape: "linear filing pipeline with a settlement fork and a system-driven halt"
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /coventure-promotions/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "the co-venturer has a FundraiserRegistration with status == ACTIVE for every state in state_codes that has coventure_filing_required == true"
          - "the current logical clock is strictly before promo_start"
        side_effects:
          - "sets status = FILED"
          - "recomputes projected_benefit_cents via coventure_benefit_determination variant projected_guarantee_basis"
          - "recomputes compliance_status on the client Organization's DisclosureStatement rows whose state_code is in state_codes"
          - "increments CoventurePromotion.version by 1"
      - from: FILED
        to: ACTIVE
        trigger: "POST /coventure-promotions/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Organization.solicitation_posture == CLEAR"
          - "the current logical clock is at or after promo_start and at or before promo_end"
        side_effects:
          - "sets status = ACTIVE"
          - "increments CoventurePromotion.version by 1"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /coventure-promotions/{id}/settle"
        actor: CertifyingOfficer
        preconditions:
          - "the acting X-User-ID resolves to an OfficerDisclosure of the client Organization with is_certifying_officer == true"
          - "the current logical clock is strictly after promo_end"
          - "remitted_cents >= final_benefit_cents computed under variant actual_settlement_basis"
        side_effects:
          - "sets actual_units and remitted_cents from the request; sets final_benefit_cents via coventure_benefit_determination variant actual_settlement_basis; sets shortfall_cents = 0"
          - "sets status = SETTLED"
          - "increments CoventurePromotion.version by 1"
      - from: ACTIVE
        to: DEFICIENT_REMITTANCE
        trigger: "POST /coventure-promotions/{id}/settle"
        actor: CertifyingOfficer
        preconditions:
          - "the acting X-User-ID resolves to an OfficerDisclosure of the client Organization with is_certifying_officer == true"
          - "the current logical clock is strictly after promo_end"
          - "remitted_cents < final_benefit_cents computed under variant actual_settlement_basis"
        side_effects:
          - "sets actual_units, remitted_cents, final_benefit_cents and shortfall_cents = final_benefit_cents - remitted_cents"
          - "sets status = DEFICIENT_REMITTANCE"
          - "increments CoventurePromotion.version by 1"
        note: "Settlement fork; the boundary between the two exits is remitted_cents >= final_benefit_cents."
      - from: DEFICIENT_REMITTANCE
        to: SETTLED
        trigger: "POST /coventure-promotions/{id}/settle"
        actor: CertifyingOfficer
        preconditions:
          - "the acting X-User-ID resolves to an OfficerDisclosure of the client Organization with is_certifying_officer == true"
          - "remitted_cents supplied in this request >= final_benefit_cents recomputed from the supplied actual_units"
        side_effects:
          - "overwrites actual_units, remitted_cents, final_benefit_cents; sets shortfall_cents = 0 and status = SETTLED"
          - "increments CoventurePromotion.version by 1"
        note: "Cure path for a deficient remittance."
      - from: FILED
        to: HALTED
        trigger: "cascade link E3 of EnforcementAction -> ESCALATED"
        actor: system
        preconditions:
          - "the owning Organization.solicitation_posture became RESTRICTED or HALTED and state_codes contains the ceased registration's state_code"
        side_effects:
          - "sets status = HALTED"
          - "increments CoventurePromotion.version by 1"
      - from: ACTIVE
        to: HALTED
        trigger: "cascade link E3 of EnforcementAction -> ESCALATED"
        actor: system
        preconditions:
          - "the owning Organization.solicitation_posture became RESTRICTED or HALTED and state_codes contains the ceased registration's state_code"
        side_effects:
          - "sets status = HALTED"
          - "increments CoventurePromotion.version by 1"

  - entity: FinancialStatement
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "POST /financial-statements for the same (organization_id, fiscal_year)"
        actor: system
        preconditions:
          - "a newer FinancialStatement with the same organization_id and fiscal_year has just been created"
        side_effects:
          - "CASCADE R1: sets statement_status = SUPERSEDED"
          - "CASCADE R2 (caused by R1): every StateRegistration with financial_statement_id == this statement and status IN {DRAFT, SUBMITTED, DEFICIENT} is repointed to the new statement's id and has required_financial_attestation recomputed; StateRegistration.version increments by 1"
          - "CASCADE R3 (caused by R2): any such StateRegistration in status SUBMITTED whose recomputed required_financial_attestation now exceeds the new statement's assurance_level on the scale NONE < REVIEW < AUDIT transitions SUBMITTED -> DEFICIENT with deficiency_reasons = [ASSURANCE_LEVEL_INSUFFICIENT] and deficiency_round_count incremented by 1"
          - "increments FinancialStatement.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: extension-supersede-stale-registration
    parent_entity: StateRegistration
    write_endpoint: "POST /extension-requests"
    occ_field: "expected_registration_version"
    description: |
      Creating an ExtensionRequest against a StateRegistration whose version has advanced
      since the client last observed it is rejected with a stale-version error. The rule is
      needed because a new request legitimately supersedes any earlier PENDING or GRANTED
      request on the same filing (see ExtensionRequest PENDING/GRANTED -> SUPERSEDED), so
      the create itself cannot be rejected by a state precondition; only the version check
      tells the caller that the deadline picture it reasoned about has already moved.
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412

  - rule_id: restatement-supersede-stale-organization
    parent_entity: Organization
    write_endpoint: "POST /financial-statements"
    occ_field: "expected_organization_version"
    description: |
      Creating a FinancialStatement against an Organization whose version has advanced since
      the client last observed it is rejected with a stale-version error. A restatement for a
      fiscal year that already has a CURRENT statement legitimately supersedes it and repoints
      open filings (cascade R1/R2/R3), so the create is never blocked by a state precondition;
      the version check is what tells the preparer that the organization's posture, penalty
      ledger or registration counts changed under it.
    error_id: ERR_STALE_ORGANIZATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: renewal_deadline_derivation
    trigger: "POST /state-registrations (create) and every recomputation of StateRegistration.effective_due_date"
    algorithm: interval_merge
    formula: |
      # Step 1 — fiscal year end date
      fye_month = Organization.fiscal_year_end_month
      fye_end   = last calendar day of (fiscal_year, fye_month) at 00:00:00.000Z

      # Step 2 — state rule. Month arithmetic runs FIRST and clamps the day-of-month
      # to the last day of the target month; day arithmetic runs SECOND.
      if StateProfile.renewal_due_rule == "FYE_PLUS_4M_15D":
          anchor = add_months(fye_end, 4)          # clamp day to last day of target month
          renewal_due_date = add_days(anchor, 15)
      elif StateProfile.renewal_due_rule == "FYE_PLUS_6M":
          renewal_due_date = add_months(fye_end, 6)   # clamp day; no day arithmetic
      elif StateProfile.renewal_due_rule == "CALENDAR_MAY_15":
          renewal_due_date = date(year(fye_end) + 1, 5, 15) at 00:00:00.000Z

      # Step 3 — effective deadline
      extended_due_date  = renewal_due_date + granted_days of the ExtensionRequest on this
                           filing whose status == GRANTED, else null
      effective_due_date = extended_due_date if extended_due_date is not null
                           else renewal_due_date
    input_set: >-
      Exactly one StateProfile row (matched on StateRegistration.state_code) and the owning
      Organization row. At most one ExtensionRequest per filing may hold status == GRANTED,
      because creating a new request drives every earlier PENDING/GRANTED request to SUPERSEDED.
    constants: {}
    precision: "whole days; all instants at 00:00:00.000Z"
    variants: []
    note: >-
      Pinned order matters. For fiscal_year_end_month == 12, FYE_PLUS_4M_15D yields
      add_months(2025-12-31, 4) = 2026-04-30 (day clamped from 31 to 30) then +15 days =
      2026-05-15. Adding 15 days first would give 2026-05-15 -> add_months -> 2026-09-15.

  - name: assurance_requirement_derivation
    trigger: "POST /state-registrations (create), the DRAFT/DEFICIENT -> SUBMITTED transition, and cascade link R2 of a financial restatement"
    algorithm: threshold
    formula: |
      fs = the FinancialStatement referenced by StateRegistration.financial_statement_id
      sp = the StateProfile matched on StateRegistration.state_code

      if sp.assurance_basis == "CONTRIBUTIONS_ONLY":
          metric = fs.contributions_cents
      else:  # GROSS_REVENUE
          metric = fs.total_revenue_cents

      if   metric >= sp.audit_threshold_cents:  required_financial_attestation = "AUDIT"
      elif metric >= sp.review_threshold_cents: required_financial_attestation = "REVIEW"
      else:                                     required_financial_attestation = "NONE"
    input_set: >-
      The single FinancialStatement named by financial_statement_id regardless of its
      statement_status, and the single StateProfile for state_code. No aggregation over
      sibling statements.
    constants: {}
    precision: "integer cents; comparisons are inclusive at the threshold (>=)"
    variants:
      - name: contributions_only_basis
        when: "StateProfile.assurance_basis == CONTRIBUTIONS_ONLY"
        difference: >-
          Measures fs.contributions_cents, which excludes government_grant_cents and all
          non-contribution revenue, so a grant-heavy statement can fall below the review
          threshold that the same statement clears under the other variant.
      - name: gross_revenue_basis
        when: "StateProfile.assurance_basis == GROSS_REVENUE"
        difference: >-
          Measures fs.total_revenue_cents, which includes government_grant_cents and program
          revenue, so the same FinancialStatement can require REVIEW or AUDIT in this state
          while requiring NONE in a CONTRIBUTIONS_ONLY state.

  - name: filing_fee_assessment
    trigger: "POST /state-registrations (create) and the DRAFT/DEFICIENT -> SUBMITTED transition"
    algorithm: tiered_pricing
    formula: |
      fs = FinancialStatement referenced by StateRegistration.financial_statement_id
      sp = StateProfile for StateRegistration.state_code
      org = owning Organization

      # (1) tier selection on the supporting statement's public support
      if   fs.contributions_cents <  2500000:  tier_base =  2500
      elif fs.contributions_cents < 10000000:  tier_base =  5000
      elif fs.contributions_cents < 50000000:  tier_base = 15000
      else:                                    tier_base = 40000

      # (2) conditional online surcharge — both flags must hold
      online_surcharge = sp.online_surcharge_cents
                         if (org.has_online_donation_page and sp.online_presence_counts)
                         else 0

      # (3) per-contract component: count FundraisingContract rows with
      #     organization_id == org.id, status IN {FILED, LATE_FILED},
      #     and state_codes containing sp.state_code
      contract_component = sp.per_contract_fee_cents * filed_contract_count_in_state

      # (4) raw sum, then the INITIAL multiplier, then the clamp — in this order
      raw = tier_base + online_surcharge + contract_component
      if StateRegistration.registration_type == "INITIAL":
          raw = round_half_up(raw * INITIAL_FILING_MULTIPLIER)
      filing_fee_cents = min(sp.filing_fee_cap_cents, max(sp.base_filing_fee_cents, raw))
    input_set: >-
      One FinancialStatement (by id), one StateProfile (by state_code), one Organization, and
      the set of FundraisingContract rows for that Organization with status IN {FILED,
      LATE_FILED} whose state_codes array contains the filing's state_code. DRAFT and VOIDED
      contracts are excluded. No time window applies; the count is taken at evaluation time.
    constants:
      INITIAL_FILING_MULTIPLIER: 1.5
      TIER_1_UPPER_EXCLUSIVE_CENTS: 2500000
      TIER_2_UPPER_EXCLUSIVE_CENTS: 10000000
      TIER_3_UPPER_EXCLUSIVE_CENTS: 50000000
      TIER_1_BASE_CENTS: 2500
      TIER_2_BASE_CENTS: 5000
      TIER_3_BASE_CENTS: 15000
      TIER_4_BASE_CENTS: 40000
    precision: "integer cents, round_half_up applied once at the INITIAL multiplier step"
    variants: []
    note: >-
      Combinatorial mode (a): four inputs (contributions tier, two boolean flags, a
      cross-aggregate contract count, registration_type) interact non-linearly through a
      tier selection, a conditional branch, a multiplier and a nested min/max clamp. Applying
      the clamp before the multiplier yields a different fee whenever the cap binds.

  - name: late_penalty_accrual
    trigger: "creation of an EnforcementAction whose request omits penalty_cents_override, including cascade link D1 of REGISTERED -> DELINQUENT"
    algorithm: aggregation
    formula: |
      sp   = StateProfile for the linked StateRegistration.state_code
      due  = linked StateRegistration.effective_due_date
      now  = current logical clock

      days_late = floor((now - due) / 1 day)          # 0 when now <= due
      if days_late <= 0:
          penalty_cents = 0
      else:
          months_late = ceil(days_late / 30)
          # Round EACH month to whole cents, THEN sum, THEN cap. This order is pinned.
          per_month[i] = round_half_up(sp.late_fee_base_cents *
                                       (1 + sp.late_fee_escalation_pct * (i - 1)))
                         for i = 1 .. months_late
          subtotal      = sum(per_month[1..months_late])
          penalty_cents = min(subtotal, sp.late_fee_cap_cents)
    input_set: >-
      One StateProfile, one StateRegistration (its effective_due_date only), and the logical
      clock. Months are indexed 1..months_late ascending; no other EnforcementAction rows
      participate.
    constants:
      DAYS_PER_ACCRUAL_MONTH: 30
    precision: "integer cents; round_half_up per month index, never on the subtotal"
    variants: []
    note: >-
      Combinatorial mode (b): rounding order is observable. With late_fee_base_cents = 2004,
      late_fee_escalation_pct = 0.125 and months_late = 4 the pinned per-month-then-sum order
      yields 2004 + 2255 + 2505 + 2756 = 9520, while summing the unrounded monthly amounts
      first (2004 * 4.75 = 9519.0) and rounding once yields 9519.

  - name: remediation_settlement_total
    trigger: "the OPEN -> REMEDIATION_SUBMITTED and ESCALATED -> REMEDIATION_SUBMITTED transitions"
    algorithm: waterfall_allocation
    formula: |
      sp = StateProfile for this EnforcementAction.state_code

      # Evaluation order is pinned as 1 -> 2 -> 3 -> 4. The discount tier is keyed on
      # penalty_subtotal, NOT on total_due_cents.
      # (1)
      penalty_subtotal = sum(EnforcementAction.penalty_cents) over actions with the SAME
                         registration_id as this action and status IN
                         {OPEN, REMEDIATION_SUBMITTED, ESCALATED}, this action included
      # (2)
      if   penalty_subtotal >= 50000: discount_pct = 0.20
      elif penalty_subtotal >= 20000: discount_pct = 0.10
      else:                           discount_pct = 0.00
      # (3)
      reinstatement_fee_cents = round_half_up(sp.reinstatement_fee_cents * (1 - discount_pct))
      # (4)
      settlement_total_cents  = penalty_subtotal + reinstatement_fee_cents
    input_set: >-
      EnforcementAction rows sharing this action's registration_id whose status IN
      {OPEN, REMEDIATION_SUBMITTED, ESCALATED}, ordered irrelevantly because the operator is
      a sum. CURED and VACATED actions are excluded. No time window; the sum is taken at
      transition time.
    constants:
      DISCOUNT_TIER_2_MIN_CENTS: 20000
      DISCOUNT_TIER_3_MIN_CENTS: 50000
      DISCOUNT_TIER_2_PCT: 0.10
      DISCOUNT_TIER_3_PCT: 0.20
    precision: "integer cents, round_half_up applied once at step 3"
    variants: []
    note: >-
      Combinatorial mode (c): the definition looks circular because total_due_cents depends on
      the fee and the fee depends on a tier that a careless reader keys on total_due_cents. The
      pinned order resolves it. With penalty_subtotal = 18000 and reinstatement_fee_cents =
      12500 the correct answer is 0.00 discount -> 12500 -> 30500; keying the tier on the total
      (30500 >= 20000 -> 0.10) would instead yield 11250 -> 29250.

  - name: coventure_benefit_determination
    trigger: "the DRAFT -> FILED transition (projected variant) and each settle transition (actual variant)"
    algorithm: forward_looking
    formula: |
      projected_benefit_cents = max(guaranteed_minimum_cents,
                                    per_unit_cents * projected_units)
      final_benefit_cents     = max(guaranteed_minimum_cents,
                                    per_unit_cents * actual_units)
      shortfall_cents         = max(0, final_benefit_cents - remitted_cents)
    input_set: >-
      Fields of the single CoventurePromotion row. projected_units comes from the create
      payload; actual_units comes from the settle payload. No other rows participate.
    constants: {}
    precision: "integer cents; no rounding is required because both terms are integers"
    variants:
      - name: projected_guarantee_basis
        when: "evaluated at the DRAFT -> FILED transition, before any units are reported"
        difference: >-
          Uses projected_units, so the per-unit term dominates whenever the co-venturer
          projects optimistically and the guaranteed minimum never binds.
      - name: actual_settlement_basis
        when: "evaluated at the ACTIVE -> SETTLED / ACTIVE -> DEFICIENT_REMITTANCE transitions"
        difference: >-
          Uses actual_units, so the guaranteed minimum can bind where it did not bind under the
          projected variant. With guaranteed_minimum_cents = 500000, per_unit_cents = 250,
          projected_units = 3000 and actual_units = 1600 the two variants return 750000 and
          500000 from identical stored inputs.

  - name: disclosure_requirement_resolution
    trigger: "POST /disclosure-statements, and every recomputation triggered by a FundraisingContract or CoventurePromotion status change touching the statement's state_code"
    algorithm: constraint_propagation
    formula: |
      CANONICAL_ORDER = [REGISTRATION_DISCLOSURE, FINANCIAL_STATEMENT_AVAILABILITY,
                         PAID_SOLICITOR_IDENTITY, TAX_DEDUCTIBILITY, PERCENT_TO_CHARITY]
      sp = StateProfile for DisclosureStatement.state_code

      required = set(sp.disclosure_required_clauses)

      # conditional clause 1 — a filed professional solicitor engagement in this state
      if exists FundraisingContract with organization_id == this.organization_id
             and status IN {FILED, LATE_FILED}
             and state_codes contains this.state_code
             and its ProfessionalFundraiser.fundraiser_type == "PROFESSIONAL_SOLICITOR":
          required = required + {PAID_SOLICITOR_IDENTITY}

      # conditional clause 2 — a live charitable sales promotion in this state
      if exists CoventurePromotion with organization_id == this.organization_id
             and status IN {FILED, ACTIVE}
             and state_codes contains this.state_code:
          required = required + {PERCENT_TO_CHARITY}

      required_clauses = required sorted by index in CANONICAL_ORDER
      missing_clauses  = [c for c in required_clauses if c not in included_clauses]
      compliance_status = "COMPLIANT" if missing_clauses == [] else "NON_COMPLIANT"
    input_set: >-
      One StateProfile; FundraisingContract rows for this organization with status IN
      {FILED, LATE_FILED} whose state_codes contains state_code (DRAFT and VOIDED excluded);
      CoventurePromotion rows for this organization with status IN {FILED, ACTIVE} whose
      state_codes contains state_code (DRAFT, SETTLED, DEFICIENT_REMITTANCE and HALTED
      excluded). Both existence probes are order-insensitive.
    constants:
      CANONICAL_CLAUSE_ORDER: [REGISTRATION_DISCLOSURE, FINANCIAL_STATEMENT_AVAILABILITY, PAID_SOLICITOR_IDENTITY, TAX_DEDUCTIBILITY, PERCENT_TO_CHARITY]
    precision: "exact set semantics; output arrays are emitted in CANONICAL_CLAUSE_ORDER"
    variants: []
    note: >-
      Empty-set boundary: when sp.disclosure_required_clauses == [] and neither existence probe
      fires, required_clauses == [] and missing_clauses == [], so compliance_status is COMPLIANT
      even though included_clauses is also empty.

  - name: registration_trigger_evaluation
    trigger: "POST /solicitation-activities"
    algorithm: threshold
    formula: |
      sp = StateProfile for SolicitationActivity.state_code
      reasons = []
      if not sp.registration_required:
          triggers_registration = false; trigger_reasons = []
      else:
          if donor_count         >= sp.donor_count_trigger:        reasons += [DONOR_COUNT]
          if contributions_cents >= sp.contribution_trigger_cents: reasons += [CONTRIBUTION_TOTAL]
          if sp.online_presence_counts and "WEB_TARGETED" in channels:
                                                                   reasons += [TARGETED_ONLINE_PRESENCE]
          trigger_reasons        = reasons in the order [DONOR_COUNT, CONTRIBUTION_TOTAL, TARGETED_ONLINE_PRESENCE]
          triggers_registration  = len(reasons) > 0
    input_set: "The single SolicitationActivity row being created and one StateProfile."
    constants: {}
    precision: "integer comparisons, inclusive at the trigger value (>=)"
    variants: []

  - name: extension_grant_length
    trigger: "the PENDING -> GRANTED transition of ExtensionRequest"
    algorithm: threshold
    formula: |
      sp = StateProfile for the linked StateRegistration.state_code
      if basis == "IRS_990_EXTENSION":
          granted_days = min(IRS_990_EXTENSION_DAYS, sp.extension_max_days)
      else:  # STATE_HARDSHIP
          granted_days = min(requested_days, sp.extension_max_days)
    input_set: "One ExtensionRequest row and one StateProfile."
    constants:
      IRS_990_EXTENSION_DAYS: 180
    precision: "whole days"
    variants: []
    note: "requested_days is ignored entirely under the IRS_990_EXTENSION basis."

  - name: contract_filing_deadline
    trigger: "POST /fundraising-contracts (create)"
    algorithm: interval_merge
    formula: |
      candidate_days = [StateProfile(sc).fundraiser_contract_filing_days for sc in state_codes]
      filing_due_date = contract_start + min(candidate_days) days
      hard_stop       = filing_due_date + CONTRACT_FILING_HARD_STOP_DAYS days
    input_set: >-
      One StateProfile per element of state_codes; the strictest (smallest) window governs the
      whole multi-state contract.
    constants:
      CONTRACT_FILING_HARD_STOP_DAYS: 60
      LATE_CONTRACT_SURCHARGE_CENTS: 10000
    precision: "whole days"
    variants: []

  - name: penalty_ledger_conservation
    trigger: "every EnforcementAction creation, vacate, cure, and every cascade that touches enforcement status"
    algorithm: aggregation
    formula: |
      Organization.penalty_outstanding_cents
        == sum(EnforcementAction.penalty_cents
               for actions with organization_id == Organization.id
               and status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED})
    input_set: >-
      All EnforcementAction rows of the organization whose status IN {OPEN,
      REMEDIATION_SUBMITTED, ESCALATED}; CURED and VACATED rows are excluded. Order-insensitive
      sum, no time window.
    constants: {}
    precision: "integer cents, exact equality"
    variants: []
    note: >-
      Conserved-quantity invariant. Forward action: creating an EnforcementAction with
      penalty_cents = P raises the ledger by exactly P. Compensating action: POST
      /enforcement-actions/{id}/vacate lowers it by exactly P, so the ledger returns to its
      pre-action value with zero drift even though the intervening registration transitions
      bumped several other fields.

  - name: registered_state_count_conservation
    trigger: "every StateRegistration transition into or out of REGISTERED"
    algorithm: aggregation
    formula: |
      Organization.registered_state_count
        == count(StateRegistration for organization_id == Organization.id
                 with status == REGISTERED)
      AND
      Organization.delinquent_registration_count
        == count(StateRegistration for organization_id == Organization.id
                 with status == DELINQUENT)
    input_set: >-
      All StateRegistration rows of the organization; only the exact statuses REGISTERED and
      DELINQUENT are counted. SUBMITTED, DEFICIENT, DRAFT, EXPIRED, CEASED and WITHDRAWN rows
      contribute to neither counter.
    constants: {}
    precision: "exact integer equality"
    variants: []
    note: >-
      Conserved-quantity invariant of a different kind from penalty_ledger_conservation: a
      cardinality rather than a monetary ledger. Forward action: review APPROVE raises
      registered_state_count by exactly 1. Compensating action: POST
      /state-registrations/{id}/withdraw lowers it by exactly 1, restoring the pre-approval
      count even though registered_at and the document review_status values remain stamped.

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, enums in range, integers non-negative where constrained, arrays non-empty where constrained, ISO 8601 datetimes parseable, coverage_end > coverage_start, contract_end > contract_start, promo_end >= promo_start, fiscal_year_end_month in 1..12"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "path-referenced resource exists, validated left-to-right in the path"
    error_id: "ERR_ORGANIZATION_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_REGISTRATION_DOCUMENT_NOT_FOUND | ERR_FUNDRAISER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_ENFORCEMENT_ACTION_NOT_FOUND | ERR_EXTENSION_REQUEST_NOT_FOUND | ERR_STATE_PROFILE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "body-referenced foreign keys exist, validated in the order organization_id, state_code / state_codes, financial_statement_id, registration_id, prepared_by_officer_id, fundraiser_id, coventurer_id, supersedes_registration_id"
    error_id: "ERR_ORGANIZATION_NOT_FOUND | ERR_STATE_PROFILE_NOT_FOUND | ERR_FINANCIAL_STATEMENT_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_OFFICER_NOT_FOUND | ERR_FUNDRAISER_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 6
    category: auth
    check: "entity_backed role owns the target: FundraiserAgent's X-User-ID equals the target fundraiser_id; CertifyingOfficer's X-User-ID resolves to an OfficerDisclosure of the target Organization with is_certifying_officer == true"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /fundraiser-registrations, POST /fundraising-contracts/{id}/file, POST /state-registrations/{id}/submit, POST /coventure-promotions/{id}/settle"

  - priority: 7
    category: state
    check: "expected_registration_version equals the target StateRegistration.version"
    error_id: ERR_STALE_REGISTRATION_VERSION
    http_status: 412
    applies_to: "POST /extension-requests"

  - priority: 8
    category: state
    check: "expected_organization_version equals the target Organization.version"
    error_id: ERR_STALE_ORGANIZATION_VERSION
    http_status: 412
    applies_to: "POST /financial-statements"

  - priority: 9
    category: state
    check: "StateRegistration.status is in the transition's from-set for the requested operation"
    error_id: ERR_INVALID_REGISTRATION_STATE
    http_status: 409
    applies_to: "POST /state-registrations/{id}/submit, POST /state-registrations/{id}/review, POST /state-registrations/{id}/withdraw, POST /registration-documents"

  - priority: 10
    category: state
    check: "EnforcementAction.status is in the transition's from-set for the requested operation"
    error_id: ERR_INVALID_ENFORCEMENT_STATE
    http_status: 409
    applies_to: "POST /enforcement-actions/{id}/remediate, POST /enforcement-actions/{id}/decide, POST /enforcement-actions/{id}/vacate"

  - priority: 11
    category: state
    check: "FundraisingContract.status == DRAFT for a file operation"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /fundraising-contracts/{id}/file"

  - priority: 12
    category: state
    check: "CoventurePromotion.status is in the transition's from-set: DRAFT for file, FILED for activate, {ACTIVE, DEFICIENT_REMITTANCE} for settle"
    error_id: ERR_INVALID_PROMOTION_STATE
    http_status: 409
    applies_to: "POST /coventure-promotions/{id}/file, POST /coventure-promotions/{id}/activate, POST /coventure-promotions/{id}/settle"

  - priority: 13
    category: state
    check: "ExtensionRequest.status == PENDING for a decide operation"
    error_id: ERR_EXTENSION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /extension-requests/{id}/decide"

  - priority: 14
    category: business_safety
    check: "Organization.solicitation_posture != HALTED"
    error_id: ERR_SOLICITATION_HALTED
    http_status: 409
    applies_to: "POST /state-registrations, POST /state-registrations/{id}/submit, POST /coventure-promotions"

  - priority: 15
    category: business_safety
    check: "Organization.solicitation_posture == CLEAR"
    error_id: ERR_SOLICITATION_RESTRICTED
    http_status: 409
    applies_to: "POST /coventure-promotions/{id}/activate"

  - priority: 16
    category: business_safety
    check: "no RegistrationDocument on the filing has prepared_by_officer_id equal to the acting CertifyingOfficer's X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /state-registrations/{id}/submit"

  - priority: 17
    category: business_safety
    check: "every OfficerDisclosure of the Organization has disclosure_status == COMPLETE"
    error_id: ERR_OFFICER_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /state-registrations/{id}/submit"

  - priority: 18
    category: business_safety
    check: "StateProfile.registration_required == true for the requested state_code"
    error_id: ERR_STATE_REGISTRATION_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /state-registrations"

  - priority: 19
    category: business_referential
    check: "every state_code on the contract has a FundraiserRegistration for the contract's fundraiser with status == ACTIVE"
    error_id: ERR_FUNDRAISER_NOT_REGISTERED_IN_STATE
    http_status: 422
    applies_to: "POST /fundraising-contracts/{id}/file, POST /coventure-promotions/{id}/file"

  - priority: 20
    category: business_referential
    check: "supersedes_registration_id, when supplied, targets a StateRegistration with the same organization_id and state_code and status IN {REGISTERED, DELINQUENT}"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /state-registrations, POST /state-registrations/{id}/review"

  - priority: 21
    category: business_referential
    check: "the FinancialStatement referenced by financial_statement_id has statement_status == CURRENT and belongs to the same organization_id"
    error_id: ERR_FINANCIAL_STATEMENT_SUPERSEDED
    http_status: 422
    applies_to: "POST /state-registrations, POST /state-registrations/{id}/submit"

  - priority: 22
    category: business_temporal
    check: >-
      the filing's coverage interval, treated as half-open [coverage_start, coverage_end), does
      not overlap the coverage interval of any other StateRegistration for the same
      (organization_id, state_code) with status IN {SUBMITTED, REGISTERED, DELINQUENT, CEASED}.
      Abutting intervals where new.coverage_start == existing.coverage_end are accepted.
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /state-registrations, POST /state-registrations/{id}/review"

  - priority: 23
    category: business_temporal
    check: >-
      for every state_code shared with an existing CoventurePromotion of the same coventurer_id
      whose status IN {DRAFT, FILED, ACTIVE}, the closed windows [promo_start, promo_end] must be
      separated by more than StateProfile.coventure_buffer_days: reject when
      new.promo_start <= existing.promo_end + buffer_days AND
      existing.promo_start <= new.promo_end + buffer_days.
    error_id: ERR_PROMOTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /coventure-promotions"

  - priority: 24
    category: business_temporal
    check: "the logical clock is at or before filing_due_date + CONTRACT_FILING_HARD_STOP_DAYS"
    error_id: ERR_CONTRACT_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fundraising-contracts/{id}/file"

  - priority: 25
    category: business_temporal
    check: "the logical clock is at or before EnforcementAction.cure_deadline for a remediate operation; strictly after cure_deadline for an ESCALATE decision taken from status OPEN"
    error_id: ERR_CURE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /enforcement-actions/{id}/remediate, POST /enforcement-actions/{id}/decide"

  - priority: 26
    category: business_temporal
    check: "the logical clock is strictly before promo_start for file, within [promo_start, promo_end] for activate, and strictly after promo_end for the first settle of a promotion"
    error_id: ERR_PROMOTION_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /coventure-promotions/{id}/file, POST /coventure-promotions/{id}/activate, POST /coventure-promotions/{id}/settle"

  - priority: 27
    category: business_constraint
    check: "no other StateRegistration exists for the same (organization_id, state_code, fiscal_year) with status not in {EXPIRED, WITHDRAWN}"
    error_id: ERR_DUPLICATE_STATE_REGISTRATION
    http_status: 409
    applies_to: "POST /state-registrations"

  - priority: 28
    category: business_constraint
    check: "ein is not already used by another Organization; state_code is not already used by another StateProfile"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /organizations, POST /state-profiles"

  - priority: 29
    category: business_constraint
    check: "the filing carries a RegistrationDocument of doc_type GOVERNING_DOCUMENT and one of FINANCIAL_STATEMENT, plus REVIEW_REPORT when required_financial_attestation == REVIEW, plus AUDIT_OPINION when required_financial_attestation == AUDIT"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /state-registrations/{id}/submit"

  - priority: 30
    category: business_constraint
    check: "StateProfile.extension_allowed == true and StateProfile.extension_max_days >= 1 for the filing's state"
    error_id: ERR_EXTENSION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /extension-requests, POST /extension-requests/{id}/decide"

  - priority: 31
    category: business_constraint
    check: "Organization.filing_posture == CURRENT"
    error_id: ERR_FILING_POSTURE_DELINQUENT
    http_status: 409
    applies_to: "POST /extension-requests"

  - priority: 32
    category: business_constraint
    check: "bond_on_file_cents >= StateProfile.fundraiser_bond_minimum_cents and the fundraiser's bond_expires_at is strictly after expires_at"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /fundraiser-registrations"

  - priority: 33
    category: business_constraint
    check: "no other FundraiserRegistration with status == ACTIVE exists for the same (fundraiser_id, state_code)"
    error_id: ERR_DUPLICATE_FUNDRAISER_REGISTRATION
    http_status: 409
    applies_to: "POST /fundraiser-registrations"

  - priority: 34
    category: business_fiscal
    check: "the linked FinancialStatement.assurance_level is at or above required_financial_attestation on the ordered scale NONE < REVIEW < AUDIT"
    error_id: ERR_ASSURANCE_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /state-registrations/{id}/submit"

  - priority: 35
    category: business_fiscal
    check: "remitted_cents and actual_units in a settle request are non-negative and remitted_cents <= final_benefit_cents + REMITTANCE_OVERPAY_TOLERANCE_CENTS is NOT enforced; instead a shortfall routes the transition to DEFICIENT_REMITTANCE rather than failing"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /coventure-promotions/{id}/settle"
    note: "Recorded so implementers do not invent a remittance-shortfall error; the shortfall is a state branch, not a rejection."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- configuration -------------------------------------------------------
  - method: POST
    path: "/state-profiles"
    description: "Create the per-state registration rule set. All fields other than the six required ones fall back to their §1.1 defaults."
    roles: [SystemAdmin]
    code: 201
    input: ["state_code", "registration_required", "renewal_due_rule", "assurance_basis", "review_threshold_cents", "audit_threshold_cents", "donor_count_trigger?", "contribution_trigger_cents?", "online_presence_counts?", "extension_allowed?", "extension_max_days?", "disclosure_required_clauses?", "fundraiser_contract_filing_days?", "fundraiser_bond_minimum_cents?", "coventure_filing_required?", "coventure_buffer_days?", "base_filing_fee_cents?", "online_surcharge_cents?", "per_contract_fee_cents?", "filing_fee_cap_cents?", "late_fee_base_cents?", "late_fee_escalation_pct?", "late_fee_cap_cents?", "cure_period_days?", "reinstatement_fee_cents?"]
    output: StateProfile
    side_effects: ["none beyond creating the configuration row"]

  - method: GET
    path: "/state-profiles/{state_code}"
    description: "Read one state's rule set by its two-letter code."
    roles: [SystemAdmin, ComplianceOfficer, CertifyingOfficer, StateRegulator, FundraiserAgent]
    code: 200
    input: []
    output: StateProfile
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["all subsequent deadline, cure-window and promotion-window comparisons use the new instant"]

  # ---- organizations -------------------------------------------------------
  - method: POST
    path: "/organizations"
    description: "Register a charitable organization in the compliance office's roster."
    roles: [ComplianceOfficer, SystemAdmin]
    code: 201
    input: ["legal_name", "ein", "domicile_state_code", "fiscal_year_end_month", "has_online_donation_page?", "lifecycle_status?"]
    output: Organization
    side_effects: ["initialises solicitation_posture = CLEAR, filing_posture = CURRENT, all counters to 0 and penalty_outstanding_cents to 0"]

  - method: GET
    path: "/organizations"
    description: "Paginated roster of organizations, optionally filtered by posture."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["solicitation_posture?", "filing_posture?", "domicile_state_code?", "limit?", "offset?"]
    output: "Organization[]"
    side_effects: []

  - method: GET
    path: "/organizations/{id}"
    description: "Read one organization including its derived postures, counters and penalty ledger."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin, FundraiserAgent]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: PATCH
    path: "/organizations/{id}"
    description: "Amend the organization's mutable profile fields."
    roles: [ComplianceOfficer]
    code: 200
    input: ["fiscal_year_end_month?", "has_online_donation_page?", "legal_name?", "lifecycle_status?"]
    output: Organization
    side_effects: ["recomputes renewal_due_date and effective_due_date on every StateRegistration of this organization whose status IN {DRAFT, SUBMITTED, DEFICIENT, REGISTERED}", "increments Organization.version by 1"]

  - method: GET
    path: "/organizations/{id}/compliance-calendar"
    description: "Computed read: one calendar entry per StateRegistration of this organization, each carrying state_code, fiscal_year, renewal_due_date, effective_due_date, status and required_financial_attestation, ordered by effective_due_date ASC then state_code ASC."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["fiscal_year?"]
    output: "{ organization_id: string, entry_count: integer, entries: object, next_effective_due_date: datetime, delinquent_state_codes: string }"
    side_effects: []

  - method: GET
    path: "/organizations/{id}/solicitation-activities"
    description: "Reverse lookup of SolicitationActivity rows filed for this organization, ordered created_at ASC."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["state_code?", "fiscal_year?", "limit?", "offset?"]
    output: "SolicitationActivity[]"
    side_effects: []

  - method: GET
    path: "/organizations/{id}/financial-statements"
    description: "Reverse lookup of FinancialStatement rows for this organization, ordered created_at ASC."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["fiscal_year?", "statement_status?", "limit?", "offset?"]
    output: "FinancialStatement[]"
    side_effects: []

  - method: GET
    path: "/organizations/{id}/officer-disclosures"
    description: "Reverse lookup of OfficerDisclosure rows for this organization, ordered created_at ASC."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["is_certifying_officer?", "limit?", "offset?"]
    output: "OfficerDisclosure[]"
    side_effects: []

  - method: GET
    path: "/organizations/{id}/disclosure-statements"
    description: "Reverse lookup of DisclosureStatement rows for this organization, ordered created_at ASC."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["state_code?", "compliance_status?", "limit?", "offset?"]
    output: "DisclosureStatement[]"
    side_effects: []

  # ---- solicitation footprint ---------------------------------------------
  - method: POST
    path: "/solicitation-activities"
    description: "Record one fiscal year of solicitation activity in one state and evaluate whether it triggers registration."
    roles: [ComplianceOfficer]
    code: 201
    input: [organization_id, state_code, fiscal_year, donor_count, contributions_cents, channels]
    output: SolicitationActivity
    side_effects: ["computes triggers_registration and trigger_reasons via registration_trigger_evaluation"]

  # ---- financial statements ------------------------------------------------
  - method: POST
    path: "/financial-statements"
    description: "File or restate the organization's financial statement for a fiscal year. Guarded by OCC rule restatement-supersede-stale-organization."
    roles: [ComplianceOfficer]
    code: 201
    input: ["organization_id", "fiscal_year", "total_revenue_cents", "contributions_cents", "program_expense_cents", "fundraising_expense_cents", "management_expense_cents", "expected_organization_version", "government_grant_cents?", "assurance_level?"]
    output: FinancialStatement
    side_effects: ["computes functional_expense_total_cents and program_ratio", "CASCADE R1/R2/R3: drives any prior CURRENT statement for the same (organization_id, fiscal_year) to SUPERSEDED, repoints open StateRegistration rows to this statement and re-derives their required_financial_attestation, and drives a SUBMITTED filing to DEFICIENT when the new assurance_level no longer covers it", "increments Organization.version by 1"]

  # ---- officers ------------------------------------------------------------
  - method: POST
    path: "/officer-disclosures"
    description: "File an officer or director disclosure for the organization."
    roles: [ComplianceOfficer]
    code: 201
    input: ["organization_id", "officer_name", "title", "is_certifying_officer?", "annual_compensation_cents?", "criminal_conviction_disclosed?", "conviction_explanation?"]
    output: OfficerDisclosure
    side_effects: ["computes disclosure_status"]

  # ---- state registrations -------------------------------------------------
  - method: POST
    path: "/state-registrations"
    description: "Open an INITIAL or RENEWAL state registration filing in DRAFT."
    roles: [ComplianceOfficer]
    code: 201
    input: ["organization_id", "state_code", "registration_type", "fiscal_year", "coverage_start", "coverage_end", "financial_statement_id", "supersedes_registration_id?"]
    output: StateRegistration
    side_effects: ["computes renewal_due_date and effective_due_date via renewal_deadline_derivation", "computes required_financial_attestation via assurance_requirement_derivation", "computes filing_fee_cents via filing_fee_assessment"]

  - method: GET
    path: "/state-registrations"
    description: "Filtered, paginated list of registration filings."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["organization_id?", "state_code?", "status?", "fiscal_year?", "financial_statement_id?", "supersedes_registration_id?", "certified_by_officer_id?", "limit?", "offset?"]
    output: "StateRegistration[]"
    side_effects: []

  - method: GET
    path: "/state-registrations/{id}"
    description: "Read one registration filing with all computed deadline and fee fields."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: []
    output: StateRegistration
    side_effects: []

  - method: POST
    path: "/state-registrations/{id}/submit"
    description: "Certify and submit the filing to the state; only a certifying officer who prepared none of its documents may do this."
    roles: [CertifyingOfficer]
    code: 200
    input: ["certification_note?"]
    output: StateRegistration
    side_effects: ["DRAFT|DEFICIENT -> SUBMITTED", "stamps submitted_at and certified_by_officer_id", "recomputes filing_fee_cents and required_financial_attestation"]

  - method: POST
    path: "/state-registrations/{id}/review"
    description: "State regulator's adjudication of a submitted filing."
    roles: [StateRegulator]
    code: 200
    input: ["decision", "deficiency_reasons?"]
    output: StateRegistration
    side_effects: ["SUBMITTED -> REGISTERED on APPROVE, running cascade L1/L2/L3", "SUBMITTED -> DEFICIENT on DEFICIENT, incrementing deficiency_round_count and rejecting documents"]

  - method: POST
    path: "/state-registrations/{id}/withdraw"
    description: "Withdraw a DRAFT or REGISTERED filing; the compensating action for approval."
    roles: [ComplianceOfficer]
    code: 200
    input: [withdraw_reason]
    output: StateRegistration
    side_effects: ["DRAFT|REGISTERED -> WITHDRAWN", "decrements Organization.registered_state_count when the filing was REGISTERED", "increments Organization.version by 1"]

  - method: GET
    path: "/state-registrations/{id}/extension-requests"
    description: "Reverse lookup of ExtensionRequest rows on this filing, ordered created_at ASC."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []

  # ---- registration documents ---------------------------------------------
  - method: POST
    path: "/registration-documents"
    description: "Attach a supporting document to a DRAFT or DEFICIENT filing."
    roles: [ComplianceOfficer]
    code: 201
    input: [registration_id, doc_type, prepared_by_officer_id, page_count]
    output: RegistrationDocument
    side_effects: ["sets review_status = ATTACHED"]

  - method: GET
    path: "/registration-documents"
    description: "Filtered, paginated list of supporting documents."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["registration_id?", "prepared_by_officer_id?", "doc_type?", "review_status?", "limit?", "offset?"]
    output: "RegistrationDocument[]"
    side_effects: []

  - method: GET
    path: "/registration-documents/{id}"
    description: "Read one supporting document."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: []
    output: RegistrationDocument
    side_effects: []

  # ---- extensions ----------------------------------------------------------
  - method: POST
    path: "/extension-requests"
    description: "Request a renewal deadline extension. Guarded by OCC rule extension-supersede-stale-registration; a new request supersedes any earlier PENDING or GRANTED request on the same filing."
    roles: [ComplianceOfficer]
    code: 201
    input: [registration_id, basis, requested_days, expected_registration_version]
    output: ExtensionRequest
    side_effects: ["drives every earlier PENDING or GRANTED ExtensionRequest on the same filing to SUPERSEDED, clearing extended_due_date when a GRANTED one is superseded", "increments StateRegistration.version by 1"]

  - method: POST
    path: "/extension-requests/{id}/decide"
    description: "State regulator grants or denies the extension."
    roles: [StateRegulator]
    code: 200
    input: [decision]
    output: ExtensionRequest
    side_effects: ["PENDING -> GRANTED sets granted_days via extension_grant_length and pushes StateRegistration.extended_due_date", "PENDING -> DENIED leaves the deadline untouched"]

  # ---- professional fundraisers -------------------------------------------
  - method: POST
    path: "/professional-fundraisers"
    description: "Enter a fundraising firm into the state registry."
    roles: [SystemAdmin]
    code: 201
    input: ["legal_name", "fundraiser_type", "bond_expires_at", "bond_amount_cents?"]
    output: ProfessionalFundraiser
    side_effects: ["sets registry_status = UNREGISTERED"]

  - method: GET
    path: "/professional-fundraisers/{id}"
    description: "Read one fundraising firm and its derived registry status."
    roles: [SystemAdmin, ComplianceOfficer, StateRegulator, FundraiserAgent]
    code: 200
    input: []
    output: ProfessionalFundraiser
    side_effects: []

  - method: POST
    path: "/fundraiser-registrations"
    description: "Register the acting firm in one state with a posted bond."
    roles: [FundraiserAgent]
    code: 201
    input: [fundraiser_id, state_code, bond_on_file_cents, expires_at]
    output: FundraiserRegistration
    side_effects: ["sets status = ACTIVE", "recomputes ProfessionalFundraiser.registry_status"]

  - method: GET
    path: "/professional-fundraisers/{id}/registrations"
    description: "Reverse lookup of FundraiserRegistration rows for this firm, ordered created_at ASC."
    roles: [SystemAdmin, ComplianceOfficer, StateRegulator, FundraiserAgent]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: "FundraiserRegistration[]"
    side_effects: []

  # ---- fundraising contracts ----------------------------------------------
  - method: POST
    path: "/fundraising-contracts"
    description: "Draft a fundraising contract between a charity and a firm across one or more states."
    roles: [ComplianceOfficer]
    code: 201
    input: ["organization_id", "fundraiser_id", "state_codes", "contract_start", "contract_end", "compensation_type", "percent_of_gross?", "flat_fee_cents?"]
    output: FundraisingContract
    side_effects: ["computes filing_due_date via contract_filing_deadline"]

  - method: POST
    path: "/fundraising-contracts/{id}/file"
    description: "File the contract with the states; lands in FILED or LATE_FILED depending on the logical clock."
    roles: [FundraiserAgent]
    code: 200
    input: []
    output: FundraisingContract
    side_effects: ["DRAFT -> FILED or DRAFT -> LATE_FILED", "sets late_filing_surcharge_cents", "recomputes compliance_status on the client's DisclosureStatement rows for the contract's states"]

  - method: GET
    path: "/fundraising-contracts"
    description: "Filtered, paginated list of fundraising contracts."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin, FundraiserAgent]
    code: 200
    input: ["organization_id?", "fundraiser_id?", "status?", "state_code?", "limit?", "offset?"]
    output: "FundraisingContract[]"
    side_effects: []

  - method: GET
    path: "/fundraising-contracts/{id}"
    description: "Read one fundraising contract."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin, FundraiserAgent]
    code: 200
    input: []
    output: FundraisingContract
    side_effects: []

  # ---- co-venture promotions ----------------------------------------------
  - method: POST
    path: "/coventure-promotions"
    description: "Create a charitable sales promotion / commercial co-venture in DRAFT."
    roles: [ComplianceOfficer]
    code: 201
    input: ["organization_id", "coventurer_id", "state_codes", "promo_start", "promo_end", "guaranteed_minimum_cents?", "per_unit_cents?", "projected_units?"]
    output: CoventurePromotion
    side_effects: ["computes disclosure_clause_required", "computes projected_benefit_cents via coventure_benefit_determination variant projected_guarantee_basis"]

  - method: POST
    path: "/coventure-promotions/{id}/file"
    description: "File the promotion with the states that require a co-venture filing."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CoventurePromotion
    side_effects: ["DRAFT -> FILED", "recomputes projected_benefit_cents", "recomputes compliance_status on the client's DisclosureStatement rows for the promotion's states"]

  - method: POST
    path: "/coventure-promotions/{id}/activate"
    description: "Start the promotion; requires a fully clear solicitation posture."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CoventurePromotion
    side_effects: ["FILED -> ACTIVE"]

  - method: POST
    path: "/coventure-promotions/{id}/settle"
    description: "Report units sold and the amount remitted; routes to SETTLED or DEFICIENT_REMITTANCE."
    roles: [CertifyingOfficer]
    code: 200
    input: [actual_units, remitted_cents]
    output: CoventurePromotion
    side_effects: ["sets final_benefit_cents via coventure_benefit_determination variant actual_settlement_basis and shortfall_cents", "ACTIVE -> SETTLED or ACTIVE -> DEFICIENT_REMITTANCE; DEFICIENT_REMITTANCE -> SETTLED on a cure"]

  - method: GET
    path: "/coventure-promotions"
    description: "Filtered, paginated list of co-venture promotions."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin, FundraiserAgent]
    code: 200
    input: ["organization_id?", "coventurer_id?", "status?", "state_code?", "limit?", "offset?"]
    output: "CoventurePromotion[]"
    side_effects: []

  - method: GET
    path: "/coventure-promotions/{id}"
    description: "Read one co-venture promotion with both benefit variants materialised."
    roles: [ComplianceOfficer, CertifyingOfficer, StateRegulator, SystemAdmin, FundraiserAgent]
    code: 200
    input: []
    output: CoventurePromotion
    side_effects: []

  # ---- disclosure statements ----------------------------------------------
  - method: POST
    path: "/disclosure-statements"
    description: "Register a piece of solicitation material and evaluate its state disclosure compliance."
    roles: [ComplianceOfficer]
    code: 201
    input: [organization_id, state_code, material_type, included_clauses]
    output: DisclosureStatement
    side_effects: ["computes required_clauses, missing_clauses and compliance_status via disclosure_requirement_resolution"]

  # ---- enforcement ---------------------------------------------------------
  - method: POST
    path: "/enforcement-actions"
    description: "Issue an enforcement action against a filing. When penalty_cents_override is omitted the penalty is derived by late_penalty_accrual at the current logical clock."
    roles: [StateRegulator]
    code: 201
    input: ["organization_id", "registration_id", "action_type", "penalty_cents_override?"]
    output: EnforcementAction
    side_effects: ["copies state_code from the linked filing, stamps issued_at and cure_deadline", "raises Organization.penalty_outstanding_cents by penalty_cents", "increments Organization.version by 1"]

  - method: POST
    path: "/enforcement-actions/{id}/remediate"
    description: "Submit a remediation packet and compute the settlement amount owed."
    roles: [ComplianceOfficer]
    code: 200
    input: [remediation_note]
    output: EnforcementAction
    side_effects: ["OPEN|ESCALATED -> REMEDIATION_SUBMITTED", "stamps settlement_total_cents via remediation_settlement_total"]

  - method: POST
    path: "/enforcement-actions/{id}/decide"
    description: "Cure or escalate the action; escalation issues a cease-solicitation order and runs cascade E1/E2/E3."
    roles: [StateRegulator]
    code: 200
    input: [decision]
    output: EnforcementAction
    side_effects: ["REMEDIATION_SUBMITTED -> CURED with cascade C1/C2", "OPEN|REMEDIATION_SUBMITTED -> ESCALATED with cascade E1/E2/E3", "increments Organization.version by 1"]

  - method: POST
    path: "/enforcement-actions/{id}/vacate"
    description: "Vacate the action; the compensating action for issuance under penalty_ledger_conservation."
    roles: [StateRegulator]
    code: 200
    input: [vacate_reason]
    output: EnforcementAction
    side_effects: ["OPEN|REMEDIATION_SUBMITTED|ESCALATED -> VACATED", "lowers Organization.penalty_outstanding_cents by penalty_cents", "restores a CEASED filing to REGISTERED when vacating from ESCALATED", "increments Organization.version by 1"]

  - method: GET
    path: "/enforcement-actions"
    description: "Filtered, paginated list of enforcement actions."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: ["organization_id?", "registration_id?", "status?", "action_type?", "state_code?", "limit?", "offset?"]
    output: "EnforcementAction[]"
    side_effects: []

  - method: GET
    path: "/enforcement-actions/{id}"
    description: "Read one enforcement action including its settlement total."
    roles: [ComplianceOfficer, StateRegulator, SystemAdmin]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  # ---- periodic sweep ------------------------------------------------------
  - method: POST
    path: "/compliance-sweeps"
    description: "Run the delinquency and lapse sweep at the current logical clock. Candidate registrations and fundraiser registrations are each processed in created_at ASC order."
    roles: [SystemAdmin, StateRegulator]
    code: 200
    input: ["state_code?"]
    output: "{ swept_at: datetime, delinquent_registration_count: integer, delinquent_registration_ids: string, enforcement_action_ids: string, lapsed_fundraiser_registration_ids: string, voided_contract_ids: string, denied_extension_request_ids: string }"
    side_effects: ["REGISTERED -> DELINQUENT with cascade D1/D2/D3", "FundraiserRegistration ACTIVE -> LAPSED with cascade F1/F2/F3", "increments Organization.version by 1 for each affected organization"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent, empty, or not one of the five roles declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a FundraiserAgent acts on a FundraiserRegistration or FundraisingContract whose fundraiser_id is not the acting X-User-ID, or a CertifyingOfficer acts on a resource whose organization_id differs from the organization of the OfficerDisclosure identified by X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the CertifyingOfficer submitting a filing is the prepared_by_officer_id of at least one RegistrationDocument attached to that same filing, or the CertifyingOfficer settling a promotion is the same officer who certified the promotion's client filing for that state"

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, has the wrong type, violates an enum domain, or breaks a documented field-level range (negative cents, fiscal_year_end_month outside 1..12, coverage_end <= coverage_start, promo_end <= promo_start, contract_end <= contract_start, requested_days <= 0, page_count <= 0, empty state_codes array)"

  # ---- not found -----------------------------------------------------------
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "the path or payload organization_id matches no Organization"
  - id: ERR_STATE_PROFILE_NOT_FOUND
    http: 404
    condition: "a referenced state_code (path, payload, or any element of state_codes) matches no StateProfile"
  - id: ERR_FINANCIAL_STATEMENT_NOT_FOUND
    http: 404
    condition: "the payload financial_statement_id matches no FinancialStatement"
  - id: ERR_OFFICER_NOT_FOUND
    http: 404
    condition: "the payload prepared_by_officer_id, or the X-User-ID of a CertifyingOfficer, matches no OfficerDisclosure"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "the path or payload registration_id matches no StateRegistration"
  - id: ERR_REGISTRATION_DOCUMENT_NOT_FOUND
    http: 404
    condition: "the path id matches no RegistrationDocument"
  - id: ERR_EXTENSION_REQUEST_NOT_FOUND
    http: 404
    condition: "the path id matches no ExtensionRequest"
  - id: ERR_FUNDRAISER_NOT_FOUND
    http: 404
    condition: "the path or payload fundraiser_id matches no ProfessionalFundraiser"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "the path id matches no FundraisingContract"
  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "the path id matches no CoventurePromotion"
  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http: 404
    condition: "the path id matches no EnforcementAction"

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_REGISTRATION_VERSION
    http: 412
    condition: "POST /extension-requests carries expected_registration_version different from the current StateRegistration.version"
  - id: ERR_STALE_ORGANIZATION_VERSION
    http: 412
    condition: "POST /financial-statements carries expected_organization_version different from the current Organization.version"

  # ---- state errors --------------------------------------------------------
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "the requested StateRegistration transition is not declared from the filing's current status, including any write to a document or extension of a filing that is no longer DRAFT or DEFICIENT"
  - id: ERR_INVALID_ENFORCEMENT_STATE
    http: 409
    condition: "the requested EnforcementAction transition is not declared from the action's current status (e.g. remediating a CURED or VACATED action, deciding an OPEN action with decision CURE)"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "the requested FundraisingContract transition is not declared from the contract's current status (e.g. filing a contract already FILED, LATE_FILED or VOID)"
  - id: ERR_INVALID_PROMOTION_STATE
    http: 409
    condition: "the requested CoventurePromotion transition is not declared from the promotion's current status (e.g. activating a DRAFT promotion, settling a FILED promotion)"
  - id: ERR_EXTENSION_ALREADY_DECIDED
    http: 409
    condition: "POST /extension-requests/{id}/decide targets an ExtensionRequest whose status is not PENDING"

  # ---- solicitation posture gates -----------------------------------------
  - id: ERR_SOLICITATION_HALTED
    http: 409
    condition: "the organization's solicitation_posture is HALTED and the request would create or advance any solicitation artifact"
  - id: ERR_SOLICITATION_RESTRICTED
    http: 409
    condition: "the organization's solicitation_posture is RESTRICTED and the request would activate a co-venture promotion or file a new fundraising contract"
  - id: ERR_FILING_POSTURE_DELINQUENT
    http: 409
    condition: "the organization's filing_posture is DELINQUENT and the request opens a new INITIAL StateRegistration in an additional state"

  # ---- business rule errors -----------------------------------------------
  - id: ERR_OFFICER_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "a filing is submitted while at least one of the organization's OfficerDisclosure rows has disclosure_status INCOMPLETE, or the organization has no OfficerDisclosure with is_certifying_officer true"
  - id: ERR_STATE_REGISTRATION_NOT_REQUIRED
    http: 422
    condition: "a StateRegistration is opened for a state whose StateProfile.registration_required is false and whose activity triggers were not met"
  - id: ERR_FUNDRAISER_NOT_REGISTERED_IN_STATE
    http: 422
    condition: "a FundraisingContract is filed for a state where the firm holds no ACTIVE FundraiserRegistration"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_registration_id is present but the target belongs to another organization or state, is not for the immediately preceding fiscal_year, or is not in status REGISTERED or DELINQUENT"
  - id: ERR_FINANCIAL_STATEMENT_SUPERSEDED
    http: 422
    condition: "the referenced FinancialStatement has statement_status SUPERSEDED"
  - id: ERR_ASSURANCE_LEVEL_INSUFFICIENT
    http: 422
    condition: "the filing's financial statement carries an assurance_level weaker than required_financial_attestation at submission time"
  - id: ERR_REQUIRED_DOCUMENT_MISSING
    http: 422
    condition: "at submission the filing lacks an ATTACHED RegistrationDocument for a doc_type the state and attestation level require"
  - id: ERR_EXTENSION_NOT_ALLOWED
    http: 422
    condition: "an extension is requested for a state whose StateProfile.extension_allowed is false"
  - id: ERR_BOND_INSUFFICIENT
    http: 422
    condition: "bond_on_file_cents is below the state's fundraiser_bond_minimum_cents, or the firm's bond_expires_at is at or before the current logical clock"
  - id: ERR_CONTRACT_FILING_WINDOW_CLOSED
    http: 422
    condition: "the contract is filed more than CONTRACT_FILING_HARD_STOP_DAYS (60) days past its filing_due_date, after which the state accepts no filing at all"
  - id: ERR_CURE_WINDOW_EXPIRED
    http: 422
    condition: "remediation is submitted after the EnforcementAction's cure_deadline"
  - id: ERR_PROMOTION_WINDOW_NOT_OPEN
    http: 422
    condition: "activation is requested outside the promotion's [promo_start, promo_end) window measured against the current logical clock"

  # ---- temporal and uniqueness conflicts ----------------------------------
  - id: ERR_COVERAGE_PERIOD_OVERLAP
    http: 409
    condition: "the new filing's half-open [coverage_start, coverage_end) interval overlaps that of an existing non-terminal filing for the same organization and state; adjacency where one interval's end equals the other's start is permitted"
  - id: ERR_PROMOTION_WINDOW_CONFLICT
    http: 409
    condition: "the new promotion's closed [promo_start, promo_end] window, widened by the state's coventure_buffer_days on each side, touches that of an existing non-terminal promotion for the same organization and state"
  - id: ERR_DUPLICATE_STATE_REGISTRATION
    http: 409
    condition: "a non-terminal StateRegistration already exists for the same (organization_id, state_code, fiscal_year)"
  - id: ERR_DUPLICATE_FUNDRAISER_REGISTRATION
    http: 409
    condition: "an ACTIVE FundraiserRegistration already exists for the same (fundraiser_id, state_code)"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "Organization.ein, StateProfile.state_code, or ProfessionalFundraiser.legal_name collides with an existing row"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ComplianceOfficer
    description: "Nonprofit compliance office staff who assemble filings, financial statements, disclosures, contracts and promotions, and who answer enforcement actions."
    identity: "opaque"
    exclusive_operations:
      - "PATCH /organizations/{id}"
      - "POST /solicitation-activities"
      - "POST /financial-statements"
      - "POST /officer-disclosures"
      - "POST /disclosure-statements"
      - "POST /state-registrations"
      - "POST /registration-documents"
      - "POST /state-registrations/{id}/withdraw"
      - "POST /extension-requests"
      - "POST /fundraising-contracts"
      - "POST /coventure-promotions"
      - "POST /coventure-promotions/{id}/file"
      - "POST /coventure-promotions/{id}/activate"
      - "POST /enforcement-actions/{id}/remediate"
    shared_operations:
      - "POST /organizations"
      - "GET /organizations"
      - "GET /organizations/{id}"
      - "GET /organizations/{id}/compliance-calendar"
      - "GET /organizations/{id}/solicitation-activities"
      - "GET /organizations/{id}/financial-statements"
      - "GET /organizations/{id}/officer-disclosures"
      - "GET /organizations/{id}/disclosure-statements"
      - "GET /state-profiles/{state_code}"
      - "GET /state-registrations"
      - "GET /state-registrations/{id}"
      - "GET /state-registrations/{id}/extension-requests"
      - "GET /registration-documents"
      - "GET /registration-documents/{id}"
      - "GET /professional-fundraisers/{id}"
      - "GET /professional-fundraisers/{id}/registrations"
      - "GET /fundraising-contracts"
      - "GET /fundraising-contracts/{id}"
      - "GET /coventure-promotions"
      - "GET /coventure-promotions/{id}"
      - "GET /enforcement-actions"
      - "GET /enforcement-actions/{id}"

  - name: CertifyingOfficer
    description: "The officer or director who personally certifies a filing under penalty of perjury and signs off co-venture settlements. Cannot have prepared any document in the packet being certified."
    identity: "entity_backed:OfficerDisclosure"
    exclusive_operations:
      - "POST /state-registrations/{id}/submit"
      - "POST /coventure-promotions/{id}/settle"
    shared_operations:
      - "GET /organizations"
      - "GET /organizations/{id}"
      - "GET /organizations/{id}/compliance-calendar"
      - "GET /organizations/{id}/financial-statements"
      - "GET /organizations/{id}/officer-disclosures"
      - "GET /state-profiles/{state_code}"
      - "GET /state-registrations"
      - "GET /state-registrations/{id}"
      - "GET /registration-documents"
      - "GET /registration-documents/{id}"
      - "GET /coventure-promotions"
      - "GET /coventure-promotions/{id}"

  - name: StateRegulator
    description: "State charities bureau examiner who adjudicates filings and extension requests, issues and disposes of enforcement actions, and may run the delinquency sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /state-registrations/{id}/review"
      - "POST /extension-requests/{id}/decide"
      - "POST /enforcement-actions"
      - "POST /enforcement-actions/{id}/decide"
      - "POST /enforcement-actions/{id}/vacate"
    shared_operations:
      - "POST /compliance-sweeps"
      - "GET /organizations"
      - "GET /organizations/{id}"
      - "GET /organizations/{id}/compliance-calendar"
      - "GET /organizations/{id}/solicitation-activities"
      - "GET /organizations/{id}/financial-statements"
      - "GET /organizations/{id}/officer-disclosures"
      - "GET /organizations/{id}/disclosure-statements"
      - "GET /state-profiles/{state_code}"
      - "GET /state-registrations"
      - "GET /state-registrations/{id}"
      - "GET /state-registrations/{id}/extension-requests"
      - "GET /registration-documents"
      - "GET /registration-documents/{id}"
      - "GET /professional-fundraisers/{id}"
      - "GET /professional-fundraisers/{id}/registrations"
      - "GET /fundraising-contracts"
      - "GET /fundraising-contracts/{id}"
      - "GET /coventure-promotions"
      - "GET /coventure-promotions/{id}"
      - "GET /enforcement-actions"
      - "GET /enforcement-actions/{id}"

  - name: FundraiserAgent
    description: "Agent of a professional fundraiser or fundraising counsel firm. Registers the firm state by state and files its charity contracts. X-User-ID is the firm's ProfessionalFundraiser id."
    identity: "entity_backed:ProfessionalFundraiser"
    exclusive_operations:
      - "POST /fundraiser-registrations"
      - "POST /fundraising-contracts/{id}/file"
    shared_operations:
      - "GET /organizations/{id}"
      - "GET /state-profiles/{state_code}"
      - "GET /professional-fundraisers/{id}"
      - "GET /professional-fundraisers/{id}/registrations"
      - "GET /fundraising-contracts"
      - "GET /fundraising-contracts/{id}"
      - "GET /coventure-promotions"
      - "GET /coventure-promotions/{id}"

  - name: SystemAdmin
    description: "Platform operator who seeds state rule sets and the fundraiser registry, drives the logical clock, and runs the sweep. Holds no filing or adjudication authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /state-profiles"
      - "POST /professional-fundraisers"
