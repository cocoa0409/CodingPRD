              as: Group
              as_user_id: "${gb17_id}"
              captures: { err17: "$.data.error_id" }
          assert:
            - "${err17} == ERR_INVALID_STATE"
            - "ActivityBooking.${ab17_id}.activity_booking_status == PENDING_PAYMENT"
            - "ActivityBooking.${ab17_id}.activity_rate_total_cents == 30000"

  - rule_id: resource_temporal_overlap
    instances:

      - name: lifeguard_rotation_buffer_breach_rejected
        grounds:
          - state_machines.LifeguardShift.transitions.SCHEDULED_to_ON_DUTY
          - entities.LifeguardShift.fields.end_minute
        distinguishing_aspect: |
          A rotation-buffer rule on a staffer: a shift starting exactly at the prior
          COMPLETED shift's end_minute is rejected because it leaves zero of the
          30-minute rotation buffer, while the standing shift itself stays COMPLETED.
        test_recipe:
          setup:
            - "Resort with a rostered lifeguard, an attraction, and a COMPLETED shift for 540-660"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Wisconsin Dells", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r18_id: "$.data.id" }
