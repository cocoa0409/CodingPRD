              as: DispatchAdmin
              captures: { ag: "$.data.id" }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v1: "$.data.id" }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T13:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T13:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/coolers"
              payload: { label: "C1", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 10, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o1: "$.data.id" }
            - call: "PATCH /api/donation-offers/${o1}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 10, pickup_window_start: "2026-08-02T13:00:00Z", pickup_window_end: "2026-08-02T14:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o2: "$.data.id" }
