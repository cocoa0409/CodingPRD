  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: isa_cap_money_conserved_under_payment_refund
        grounds:
          - state_machines.Payment.SETTLED_to_SETTLED
          - entities.ISAContract.fields.amount_paid_cents
          - entities.ISAContract.fields.remaining_cap_cents
        distinguishing_aspect: |
          Conserved quantity = ISA money: amount_paid_cents + remaining_cap_cents == cap_cents (3000000) holds before
          AND after a payment refund; refunding a 102000 settled payment reverses the ledger leaving the invariant intact.
        test_recipe:
          setup:
            - "ACTIVE ISAContract cap_cents=3000000 with one SETTLED payment of 102000 (amount_paid_cents=102000, remaining_cap_cents=2898000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS I1", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Ivy", email: "ivy@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "ISA", deposit_amount_cents: 200000, isa_income_share_pct: 0.17, isa_cap_cents: 3000000, isa_term_months: 24, isa_income_threshold_cents: 400000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts/${coh}/start"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr}", session_date: "2026-02-02T00:00:00Z", present: true, cumulative_progress_pct: 100 }
              as: AdmissionsOfficer
            - call: "POST /enrollments/${enr}/graduate"
              payload: {}
              as: AdmissionsOfficer
            - call: "GET /isa-contracts?enrollment_id=${enr}"
              payload: {}
              as: ServicingOfficer
              captures: { isa: "$.data[0].id" }
            - call: "POST /income-reports"
              payload: { isa_contract_id: "${isa}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", gross_income_cents: 600000, employment_status: "EMPLOYED" }
              as: ServicingOfficer
              captures: { ir: $.data.id, pay: $.data.payment_id }
            - call: "POST /payments/${pay}/settle"
              payload: {}
              as: ServicingOfficer
          trigger:
            - call: "POST /payments/${pay}/refund"
              payload: {}
              as: ServicingOfficer
              captures: { rstatus: $.data.refund_status }
            - call: "GET /isa-contracts/${isa}"
              payload: {}
              as: ServicingOfficer
              captures: { paid: $.data.amount_paid_cents, rem: $.data.remaining_cap_cents }
          assert:
            - "ISAContract.${isa}.amount_paid_cents == 0 (reversed by refund)"
            - "ISAContract.${isa}.remaining_cap_cents == 3000000"
            - "ISAContract.${isa}.amount_paid_cents + ISAContract.${isa}.remaining_cap_cents == 3000000 (cap conserved)"

      - name: cohort_seats_conserved_under_enroll_withdraw
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Cohort.fields.seats_committed
          - entities.Cohort.fields.seats_available
        distinguishing_aspect: |
          Conserved quantity = cohort SEATS (different type than money): seats_committed + seats_available == capacity (5)
          holds before AND after an enroll (commits a seat) paired with its withdraw (releases the seat).
        test_recipe:
          setup:
            - "OPEN cohort capacity=5 with one ENROLLED enrollment (seats_committed=1, seats_available=4)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AdmissionsOfficer
            - call: "POST /cohorts"
              payload: { name: "FS I2", track: "FULLSTACK", capacity: 5, tuition_sticker_cents: 1500000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-05-01T00:00:00Z", cirr_period_label: "H1-2026" }
              as: AdmissionsOfficer
              captures: { coh: $.data.id }
            - call: "POST /cohorts/${coh}/open"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /applicants"
              payload: { cohort_id: "${coh}", full_name: "Iggy", email: "iggy@x.com", reported_prior_income_cents: 0 }
              as: AdmissionsOfficer
              captures: { app: $.data.id }
            - call: "POST /applicants/${app}/admit"
              payload: {}
              as: AdmissionsOfficer
            - call: "POST /enrollments"
              payload: { applicant_id: "${app}", financing_choice: "UPFRONT", deposit_amount_cents: 200000 }
              as: AdmissionsOfficer
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: { refund_reason: "COOLING_OFF" }
              as: AdmissionsOfficer
            - call: "GET /cohorts/${coh}"
              payload: {}
              as: AdmissionsOfficer
              captures: { committed: $.data.seats_committed, available: $.data.seats_available }
          assert:
            - "Cohort.${coh}.seats_committed == 0 (seat released by withdraw)"
            - "Cohort.${coh}.seats_available == 5"
            - "Cohort.${coh}.seats_committed + Cohort.${coh}.seats_available == 5 (seats conserved)"
