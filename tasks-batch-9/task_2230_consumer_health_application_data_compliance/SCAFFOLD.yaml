  - method: GET
    path: "/health-data/breach-incidents/{id}"
    description: "Reads one breach incident with both rule deadlines"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: BreachIncident
    side_effects: []
  - method: GET
    path: "/health-data/breach-incidents"
    description: "Lists breach incidents, filterable by product"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "state?", "limit?", "offset?"]
    output: BreachIncident[]
    side_effects: []
  - method: POST
    path: "/health-data/breach-incidents/{id}/assess"
    description: "Assesses reportability under both the health-specific and the general breach rules"
    roles: [SecurityEngineer]
    code: 200
    input: []
    output: BreachIncident
    side_effects: ["DISCOVERED -> REPORTABLE or DISCOVERED -> NOT_REPORTABLE", "runs calculations.breach_notification_deadline", "adds exposure_contribution_cents to AppProduct.exposure_cents on the REPORTABLE branch only"]
  - method: POST
    path: "/health-data/breach-incidents/{id}/notify"
    description: "Records notification of the breach before the governing deadline"
    roles: [SecurityEngineer]
    code: 200
    input: [media_notice_sent]
    output: BreachIncident
    side_effects: ["REPORTABLE -> NOTIFIED", "stamps notified_at and records media_notice_sent"]
  - method: POST
    path: "/health-data/breach-incidents/{id}/retract"
    description: "Retracts a reportability finding and compensates its exposure contribution exactly"
    roles: [SecurityEngineer]
    code: 200
    input: []
    output: BreachIncident
    side_effects: ["REPORTABLE -> DISCOVERED", "clears all three deadlines and media_notice_required", "subtracts the prior exposure_contribution_cents from AppProduct.exposure_cents and resets it to 0"]

  - method: POST
    path: "/health-data/security-risk-assessments"
    description: "Documents a security risk assessment and scores residual risk"
    roles: [SecurityEngineer]
    code: 201
    input: [app_product_id, assessment_label, admin_control_score, technical_control_score, physical_control_score, vendor_oversight_score, documented_gap_count, "remediation_plan_present?"]
    output: SecurityRiskAssessment
    side_effects: ["creates the assessment in DRAFT", "runs calculations.residual_risk_score and writes residual_risk_score and risk_tier"]
  - method: GET
    path: "/health-data/security-risk-assessments/{id}"
    description: "Reads one security risk assessment"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: SecurityRiskAssessment
    side_effects: []
  - method: GET
    path: "/health-data/security-risk-assessments"
    description: "Lists security risk assessments, filterable by product"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "state?", "risk_tier?", "limit?", "offset?"]
    output: SecurityRiskAssessment[]
    side_effects: []
  - method: PATCH
    path: "/health-data/security-risk-assessments/{id}"
    description: "Revises the control scores and gap count of a draft assessment"
    roles: [SecurityEngineer]
    code: 200
    input: ["admin_control_score?", "technical_control_score?", "physical_control_score?", "vendor_oversight_score?", "documented_gap_count?", "remediation_plan_present?"]
    output: SecurityRiskAssessment
    side_effects: ["re-runs calculations.residual_risk_score and rewrites residual_risk_score and risk_tier"]
  - method: POST
    path: "/health-data/security-risk-assessments/{id}/finalize"
    description: "Finalizes the assessment and refreshes the product's security program state"
    roles: [SecurityEngineer]
    code: 200
    input: []
    output: SecurityRiskAssessment
    side_effects: ["DRAFT -> FINALIZED", "stamps finalized_at", "recomputes AppProduct.security_program_state from risk_tier"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role names no declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approver is the assessment's submitter, or the publisher is the policy's author"
  - id: ERR_CONSUMER_SCOPE_VIOLATION
    http: 403
    condition: "a Consumer caller acts on a ConsentRecord or ConsumerRequest whose consumer_id differs from the caller's X-User-ID"
  - id: ERR_APP_PRODUCT_NOT_FOUND
    http: 404
    condition: "the app_product_id path segment or body field names no AppProduct"
  - id: ERR_CONSUMER_NOT_FOUND
    http: 404
    condition: "the consumer_id path segment or body field names no Consumer"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "the vendor_id or subprocessor_of_id path segment or body field names no Vendor"
  - id: ERR_DATA_ELEMENT_NOT_FOUND
    http: 404
    condition: "the data_element_id or derived_from_element_id path segment or body field names no DataElement"
  - id: ERR_PURPOSE_NOT_FOUND
    http: 404
    condition: "the processing_purpose_id path segment or body field names no ProcessingPurpose"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an {id} path segment for an ApplicabilityAssessment, ElementPurposeMapping, ConsentRecord, PrivacyPolicyVersion, ConsumerRequest, DeletionTask, GeofenceZone, GeofenceCampaign, BreachIncident or SecurityRiskAssessment resolves to no row, or the applicability_assessment_id / consumer_request_id / geofence_zone_id body field names no row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent, an enum value is not a declared member, a numeric field is out of range, named_third_party_count exceeds disclosed_third_party_count, or a computed/system field is supplied as input"
  - id: ERR_CROSS_PRODUCT_REFERENCE
    http: 409
    condition: "foreign keys inside one request body resolve to rows belonging to different AppProducts"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a from-state the requested transition declares"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is already in one of its terminal states"
  - id: ERR_ELEMENT_RETIRED
    http: 409
    condition: "an operation requiring DataElement.status == ACTIVE is attempted on a RETIRED element"
  - id: ERR_POLICY_NOT_IN_REVIEW
    http: 409
    condition: "publish or return-to-draft is attempted on a PrivacyPolicyVersion whose state != IN_REVIEW"
  - id: ERR_VENDOR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "notify or reissue is attempted for a DeletionTask whose Vendor.agreement_state != EXECUTED"
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_app_product_version does not equal the current AppProduct.version"
  - id: ERR_STALE_CONSUMER_VERSION
    http: 412
    condition: "expected_consumer_version does not equal the current Consumer.version"
  - id: ERR_GEOFENCE_PROHIBITED
    http: 403
    condition: "campaign activation is attempted on a GeofenceZone whose prohibition_rule == PROHIBITED_ALL"
  - id: ERR_GEOFENCE_STANDOFF_VIOLATION
    http: 422
    condition: "GeofenceCampaign.standoff_meters is strictly less than the zone's min_standoff_meters"
  - id: ERR_MINOR_SALE_PROHIBITED
    http: 403
    condition: "a SELL grant is attempted for a Consumer whose age_band IN {MINOR_13_16, UNDER_13}"
  - id: ERR_CONSENT_BUNDLING_PROHIBITED
    http: 422
    condition: "a grant call carries more or fewer than one axis in its axes array"
  - id: ERR_COLLECTION_CONSENT_REQUIRED
    http: 409
    condition: "a SHARE grant is attempted while collection_state != GRANTED"
  - id: ERR_SHARING_CONSENT_REQUIRED
    http: 409
    condition: "a SELL grant is attempted while sharing_state != GRANTED"
  - id: ERR_DUPLICATE_ELEMENT_KEY
    http: 409
    condition: "element_key already exists on the same app_product_id"
  - id: ERR_DUPLICATE_PURPOSE_KEY
    http: 409
    condition: "purpose_key already exists on the same app_product_id"
  - id: ERR_DUPLICATE_CONSUMER_REF
    http: 409
    condition: "external_ref already exists on the same app_product_id"
  - id: ERR_DUPLICATE_VENDOR_NAME
    http: 409
    condition: "vendor_name already exists on the same app_product_id"
  - id: ERR_DERIVATION_SOURCE_REQUIRED
    http: 422
    condition: "source_kind == DERIVED_INFERENCE without derived_from_element_id, or derived_from_element_id supplied with a different source_kind"
  - id: ERR_INFERENCE_CYCLE
    http: 422
    condition: "the derivation walk from derived_from_element_id revisits an element id"
  - id: ERR_INFERENCE_DEPTH_EXCEEDED
    http: 422
    condition: "the derivation walk from derived_from_element_id would exceed MAX_INFERENCE_DEPTH hops"
  - id: ERR_ELEMENT_PARENT_RETIRED
    http: 409
    condition: "reinstate is attempted on an element whose derivation parent has status == RETIRED"
  - id: ERR_ASSESSMENT_REVISION_LIMIT
    http: 409
    condition: "revise is attempted when revision_count has already reached MAX_ASSESSMENT_REVISIONS"
  - id: ERR_VERIFICATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "request-more-info is attempted when verification_rounds_used has already reached MAX_VERIFICATION_ROUNDS"
  - id: ERR_TASK_ATTEMPT_LIMIT
    http: 409
    condition: "notify or reissue is attempted when attempt_count has already reached MAX_TASK_ATTEMPTS"
  - id: ERR_EXTENSION_ALREADY_GRANTED
    http: 409
    condition: "extend is attempted when extension_granted is already true"
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "submit-review references an ApplicabilityAssessment whose state != APPROVED, or finalize runs on a product with no APPROVED assessment"
  - id: ERR_APPLICABILITY_UNDETERMINED
    http: 409
    condition: "mapping activation is attempted while AppProduct.applicability_status NOT IN {DUAL_TRACK, CHD_REGULATED}"
  - id: ERR_VENDOR_REQUIRED_FOR_DISCLOSURE
    http: 422
    condition: "a mapping on a purpose whose third_party_disclosure_required == true has vendor_id null"
  - id: ERR_VENDOR_AGREEMENT_DEFICIENT
    http: 409
    condition: "mapping activation references a Vendor whose agreement_compliance == DEFICIENT or whose agreement_state != EXECUTED"
  - id: ERR_FLOW_DOWN_CLAUSE_MISSING
    http: 422
    condition: "execute-agreement is attempted while flow_down_clause == false"
  - id: ERR_AUDIT_RIGHTS_MISSING
    http: 422
    condition: "execute-agreement is attempted while audit_rights_clause == false"
  - id: ERR_SUBPROCESSOR_PARENT_NOT_EXECUTED
    http: 409
    condition: "execute-agreement is attempted on a subprocessor whose parent Vendor.agreement_state != EXECUTED"
  - id: ERR_POLICY_LAPSED
    http: 409
    condition: "mapping or campaign activation is attempted while AppProduct.policy_compliance_state == LAPSED"
  - id: ERR_EFFECTIVE_DATE_IN_PAST
    http: 422
    condition: "publish is attempted with effective_from earlier than the logical clock date"
  - id: ERR_POLICY_WINDOW_OVERLAP
    http: 409
    condition: "publish is attempted with an effective_from inside the half-open window of another PUBLISHED, SUPERSEDED_PENDING_UPDATE or SUPERSEDED version on the same product"
  - id: ERR_WINDOW_END_BEFORE_START
    http: 422
    condition: "a campaign is created with window_end_at not strictly later than window_start_at"
  - id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http: 409
    condition: "campaign activation collides with the closed window of another PLANNED, ACTIVE or PAUSED campaign on the same zone, including at a touching endpoint"
  - id: ERR_ZONE_COOLDOWN_ACTIVE
    http: 409
    condition: "campaign activation from PLANNED occurs strictly less than ZONE_COOLDOWN_HOURS hours after the zone's last_campaign_activated_at"
  - id: ERR_VERIFICATION_WINDOW_EXPIRED
    http: 409
    condition: "resubmit-identity arrives after verification_window_ends_at"
  - id: ERR_VERIFICATION_TOKEN_MISMATCH
    http: 422
    condition: "the verification_token supplied on verify does not equal the Consumer.verification_token"
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 409
    condition: "fulfill is attempted after response_deadline_at"
  - id: ERR_DELETION_TASKS_OUTSTANDING
    http: 409
    condition: "fulfill is attempted while outstanding_task_count > 0"
  - id: ERR_NOTIFICATION_DEADLINE_PASSED
    http: 409
    condition: "notify is attempted after the breach incident's governing_deadline_at"
  - id: ERR_MEDIA_NOTICE_REQUIRED
    http: 422
    condition: "notify is attempted with media_notice_sent false while media_notice_required is true"
  - id: ERR_POLICY_COMPLETENESS_BELOW_THRESHOLD
    http: 422
    condition: "publish is attempted with completeness_score below POLICY_PUBLISH_THRESHOLD"
  - id: ERR_REMEDIATION_PLAN_REQUIRED
    http: 422
    condition: "finalize is attempted with risk_tier IN {HIGH, CRITICAL} and remediation_plan_present false"
  - id: ERR_NO_ACTIVE_ELEMENTS
    http: 409
    condition: "submit is attempted on a product with no DataElement whose status == ACTIVE"

roles:
  - name: PlatformAdmin
    description: "operator of the compliance platform; registers products, consumers and geofence zones and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /health-data/app-products"
      - "PATCH /health-data/app-products/{id}"
      - "POST /health-data/consumers"
      - "POST /health-data/geofence-zones"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /health-data/consent-records"
      - "every GET endpoint except the consumer-scoped reads reserved to Consumer"
  - name: PrivacyOfficer
    description: "owns applicability assessments, policy drafting, vendor agreements and consumer rights fulfillment"
    identity: "opaque"
    exclusive_operations:
      - "POST /health-data/applicability-assessments"
      - "POST /health-data/applicability-assessments/{id}/submit"
      - "POST /health-data/applicability-assessments/{id}/revise"
      - "POST /health-data/privacy-policy-versions"
      - "POST /health-data/privacy-policy-versions/{id}/submit-review"
      - "POST /health-data/vendors"
      - "PATCH /health-data/vendors/{id}"
      - "POST /health-data/vendors/{id}/execute-agreement"
      - "POST /health-data/vendors/{id}/terminate-agreement"
      - "POST /health-data/consumer-requests/{id}/request-more-info"
      - "POST /health-data/consumer-requests/{id}/verify"
      - "POST /health-data/consumer-requests/{id}/extend"
      - "POST /health-data/consumer-requests/{id}/fulfill"
      - "POST /health-data/consumer-requests/{id}/deny"
      - "POST /health-data/deletion-tasks/{id}/notify"
      - "POST /health-data/deletion-tasks/{id}/confirm"
      - "POST /health-data/deletion-tasks/{id}/fail"
      - "POST /health-data/deletion-tasks/{id}/reissue"
    shared_operations:
      - "POST /health-data/consent-records"
      - "every GET endpoint"
  - name: ComplianceApprover
    description: "independent reviewer who approves assessments and publishes policies; segregated from the submitter and the author"
    identity: "opaque"
    exclusive_operations:
      - "POST /health-data/applicability-assessments/{id}/approve"
      - "POST /health-data/applicability-assessments/{id}/return"
      - "POST /health-data/privacy-policy-versions/{id}/return-to-draft"
      - "POST /health-data/privacy-policy-versions/{id}/publish"
    shared_operations:
      - "every GET endpoint"
  - name: DataSteward
    description: "maintains the data element inventory, processing purposes, element-purpose mappings and geofence campaigns"
    identity: "opaque"
    exclusive_operations:
      - "POST /health-data/data-elements"
      - "PATCH /health-data/data-elements/{id}"
      - "POST /health-data/data-elements/{id}/retire"
      - "POST /health-data/data-elements/{id}/reinstate"
      - "POST /health-data/processing-purposes"
      - "POST /health-data/element-purpose-mappings"
      - "POST /health-data/element-purpose-mappings/{id}/activate"
      - "POST /health-data/element-purpose-mappings/{id}/suspend"
      - "POST /health-data/element-purpose-mappings/{id}/retire"
      - "POST /health-data/geofence-campaigns"
      - "POST /health-data/geofence-campaigns/{id}/activate"
      - "POST /health-data/geofence-campaigns/{id}/pause"
      - "POST /health-data/geofence-campaigns/{id}/end"
    shared_operations:
      - "every GET endpoint"
  - name: SecurityEngineer
    description: "records breaches, assesses reportability and documents the security risk program"
    identity: "opaque"
    exclusive_operations:
      - "POST /health-data/breach-incidents"
      - "POST /health-data/breach-incidents/{id}/assess"
      - "POST /health-data/breach-incidents/{id}/notify"
      - "POST /health-data/breach-incidents/{id}/retract"
      - "POST /health-data/security-risk-assessments"
      - "PATCH /health-data/security-risk-assessments/{id}"
      - "POST /health-data/security-risk-assessments/{id}/finalize"
    shared_operations:
      - "every GET endpoint"
  - name: Consumer
    description: "natural person exercising consent and rights; X-User-ID is the Consumer.id"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /health-data/consent-records/{id}/grants"
      - "POST /health-data/consent-records/{id}/withdrawals"
      - "POST /health-data/consumer-requests"
      - "POST /health-data/consumer-requests/{id}/resubmit-identity"
    shared_operations:
      - "GET /health-data/consumers/{id}"
      - "GET /health-data/consent-records/{id}"
      - "GET /health-data/consent-records"
      - "GET /health-data/consumer-requests/{id}"
      - "GET /health-data/consumer-requests"
