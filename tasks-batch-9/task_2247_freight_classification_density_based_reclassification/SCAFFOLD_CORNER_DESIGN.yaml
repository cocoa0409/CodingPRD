  # =========================================================================
  # Section 8 — Complexity layers (§1.2 complexity_profile.layers)
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: activation_with_a_stale_customer_version_is_rejected_then_retried
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate_program_activation]
          - errors.ERR_STALE_CUSTOMER_VERSION
          - endpoints[POST /ltl/rate-programs/{id}/activate]
        distinguishing_aspect: "The first activation itself bumps Customer.version, so replaying the same expected_customer_version for a second program returns 412 ERR_STALE_CUSTOMER_VERSION with the incumbent untouched, and only the refetched version lets the swap through."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; published NMFC-2026A with profile CP1; customer ACME whose version is captured at creation."
            - "Two APPROVED programs for ACME -- PA (CLASS_BASED 4200/35%/12500) and PB (DENSITY_BASED 3900/30%/11000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v0: "$.data.version" }
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { pa: "$.data.id" }
            - call: "POST /ltl/rate-programs/${pa}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "DENSITY_BASED", base_rate_per_cwt_cents: 3900, discount_pct: 0.3, min_charge_cents: 11000 }
              as: PricingAnalyst
              captures: { pb: "$.data.id" }
            - call: "POST /ltl/rate-programs/${pb}/approve"
              payload: {}
              as: PricingAnalyst
          trigger:
            - call: "POST /ltl/rate-programs/${pa}/activate"
              payload: { expected_customer_version: "${cust1_v0}" }
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${pb}/activate"
              payload: { expected_customer_version: "${cust1_v0}" }
              as: PricingAnalyst
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /ltl/customers/${cust1}"
              payload: {}
              as: PricingAnalyst
              captures: { cust1_v1: "$.data.version" }
            - call: "POST /ltl/rate-programs/${pb}/activate"
              payload: { expected_customer_version: "${cust1_v1}" }
              as: PricingAnalyst
              captures: { pb_status: "$.data.status" }
          assert:
            - "trigger[1] returns 200 with RateProgram.${pa}.status == ACTIVE and Customer.${cust1}.active_program_type == CLASS_BASED"
            - "trigger[2] returns 412 ERR_STALE_CUSTOMER_VERSION"
            - "after trigger[2] RateProgram.${pb}.status is still APPROVED and RateProgram.${pa}.status is still ACTIVE"
            - "after trigger[2] Customer.${cust1}.active_program_type == CLASS_BASED and active_rate_program_id == ${pa}"
            - "trigger[3] returns a version strictly greater than ${cust1_v0}"
            - "trigger[4] returns 200 with status ACTIVE and pinned_tariff_version_id ${tv1}"
            - "RateProgram.${pa}.status == RETIRED with retired_at 2026-01-10T08:00:00Z"
            - "Customer.${cust1}.active_program_type == DENSITY_BASED and active_rate_program_id == ${pb}"

