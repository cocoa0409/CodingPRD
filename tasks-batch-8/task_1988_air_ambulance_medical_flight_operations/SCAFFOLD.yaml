# =============================================================================
# Task 1988 — Air Ambulance & Medical Flight Operations (Air Methods style)
# SCAFFOLD.yaml — §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  1988. Air Ambulance & Medical Flight Operations (Air Methods style operator): mission request triage & clinical acceptance, aircraft/crew configuration by patient acuity, weather minimums & alternate decision, bed-to-bed timeline & ground transport coordination, insurance authorization vs emergency transport billing, membership program & balance-billing protection, international repatriation documentation, clinical record & QA review

domain_name: air-ambulance-ops
api_prefix: /air-ambulance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — FK links, no URL nesting)
# =============================================================================
entities:
  - name: Base
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Base station name" }
      - { name: region, type: string, source: input, description: "Operating region code, e.g. SW-US" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> Base.id; home base" }
      - { name: tail_number, type: string, source: input, description: "Registration/tail number, unique across fleet" }
      - { name: aircraft_class, type: enum, source: input, description: "ROTOR_WING | FIXED_WING", constraints: "enum {ROTOR_WING, FIXED_WING}" }
      - { name: medical_config, type: enum, source: input, description: "BLS_CAPABLE | ALS_CAPABLE | CCT_CAPABLE; capability rank BLS<ALS<CCT", constraints: "enum {BLS_CAPABLE, ALS_CAPABLE, CCT_CAPABLE}" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | MAINTENANCE", default: AVAILABLE, constraints: "enum {AVAILABLE, ASSIGNED, MAINTENANCE}" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> Base.id; home base" }
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: crew_role, type: enum, source: input, description: "PILOT | NURSE | PARAMEDIC", constraints: "enum {PILOT, NURSE, PARAMEDIC}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMEDIATION_HOLD | INACTIVE", default: ACTIVE, constraints: "enum {ACTIVE, REMEDIATION_HOLD, INACTIVE}" }
      - { name: deficiency_points_90d, type: integer, source: computed, default: 0, description: "Sum of deficiency_points from PatientCareReport QA reviews authored by this member whose qa-reviewed-at lies in the rolling 90-day window ending at logical now" }
      - { name: duty_minutes_calendar_day, type: integer, source: computed, default: 0, description: "C5 calendar_day variant: minutes of this member's shifts (OPEN or CLOSED) falling on the UTC calendar date of logical now — reporting view, NOT the dispatch gate" }

  - name: CrewShift
    parent: null
    common_fields: true
    fields:
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; shift owner" }
      - { name: planned_start_iso, type: datetime, source: input, description: "Planned duty start (ISO 8601 UTC)" }
      - { name: planned_end_iso, type: datetime, source: input, description: "Planned duty end (ISO 8601 UTC); must be strictly after planned_start_iso" }
      - { name: actual_end_iso, type: datetime, source: system, description: "Set to logical now when the shift is closed" }
      - { name: planned_minutes, type: integer, source: computed, description: "= (planned_end_iso - planned_start_iso) in whole minutes" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN, constraints: "enum {OPEN, CLOSED}" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: weight_kg, type: number, source: input, description: "Patient weight in kg, > 0" }

  - name: MembershipSubscription
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; covered member" }
      - { name: tier, type: enum, source: input, description: "STANDARD | FAMILY", constraints: "enum {STANDARD, FAMILY}" }
      - { name: effective_from, type: string, source: input, description: "ISO date YYYY-MM-DD; membership covers transports completed on or after this date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | TERMINATED", default: ACTIVE, constraints: "enum {ACTIVE, LAPSED, TERMINATED}" }
      - { name: lapsed_at, type: datetime, source: system, description: "Logical now when status entered LAPSED; null otherwise" }

  - name: MissionRequest
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: transport_class, type: enum, source: input, description: "EMERGENCY_SCENE | EMERGENCY_INTERFACILITY | SCHEDULED_INTERFACILITY | INTERNATIONAL_REPATRIATION", constraints: "enum {EMERGENCY_SCENE, EMERGENCY_INTERFACILITY, SCHEDULED_INTERFACILITY, INTERNATIONAL_REPATRIATION}" }
      - { name: origin_facility, type: string, source: input, description: "Pickup facility or scene descriptor" }
      - { name: destination_facility, type: string, source: input, description: "Requested receiving facility" }
      - { name: destination_country, type: string, source: input, required: false, description: "ISO country; required iff transport_class == INTERNATIONAL_REPATRIATION" }
      - { name: reported_cardio, type: integer, source: input, description: "Requester-reported cardio subscale 0-10", constraints: "integer 0..10" }
      - { name: reported_resp, type: integer, source: input, description: "Requester-reported respiratory subscale 0-10", constraints: "integer 0..10" }
      - { name: reported_neuro, type: integer, source: input, description: "Requester-reported neuro subscale 0-10", constraints: "integer 0..10" }
      - { name: reported_interventions, type: integer, source: input, description: "Count of active interventions 0-10", constraints: "integer 0..10" }
      - { name: onset_iso, type: datetime, source: input, description: "Symptom/event onset timestamp; drives deterioration modifier" }
      - { name: triage_acuity_score, type: number, source: computed, description: "C2 triage variant over reported subscales, 2dp round_half_up" }
      - { name: acceptance_acuity_score, type: number, source: computed, description: "C2 acceptance variant over clinician-verified subscales + deterioration modifier" }
      - { name: acuity_tier, type: enum, source: computed, description: "BLS | ALS | CCT from acceptance score (>=7.0 CCT, >=4.0 ALS, else BLS)", constraints: "enum {BLS, ALS, CCT}" }
      - { name: emergency_override, type: boolean, source: input, default: false, description: "MedicalDirector declares emergency at triage; bypasses ERR_AUTH_REQUIRED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | TRIAGED | PENDING_INFO | ACCEPTED | DECLINED", default: RECEIVED, constraints: "enum {RECEIVED, TRIAGED, PENDING_INFO, ACCEPTED, DECLINED}" }

  - name: Mission
    parent: null
    common_fields: true
    fields:
      - { name: mission_request_id, type: string, source: input, description: "FK -> MissionRequest.id; exactly one Mission per request" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; assigned tail" }
      - { name: transport_class, type: enum, source: system, description: "Snapshot of MissionRequest.transport_class at accept" }
      - { name: acuity_tier, type: enum, source: system, description: "Snapshot of MissionRequest.acuity_tier at accept" }
      - { name: destination_facility, type: string, source: system, description: "From request at accept; rewritten by divert" }
      - { name: estimated_loaded_miles, type: number, source: input, description: "Dispatch estimate of patient-loaded miles" }
      - { name: planned_launch_iso, type: datetime, source: input, description: "Planned wheels-up; aircraft occupancy window start" }
      - { name: planned_duration_min, type: integer, source: input, description: "Planned minutes; aircraft occupancy window = [planned_launch_iso, planned_launch_iso + planned_duration_min), half-open" }
      - { name: alternate_destination, type: string, source: input, required: false, description: "Filed alternate facility; required at launch when latest weather decision is MARGINAL" }
      - { name: launched_at, type: datetime, source: system, description: "Logical now at LAUNCHED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical now at COMPLETED" }
      - { name: last_weather_decision, type: enum, source: system, description: "GO | MARGINAL | NO_GO | null; copied from newest WeatherAssessment", constraints: "enum {GO, MARGINAL, NO_GO} or null" }
      - { name: ground_coordination_status, type: enum, source: computed, description: "NEEDS_REPLAN if a CANCELLED DESTINATION leg exists with no later non-CANCELLED DESTINATION leg; else PENDING if any non-CANCELLED leg not COMPLETED; else COORDINATED", constraints: "enum {COORDINATED, PENDING, NEEDS_REPLAN}" }
      - { name: status, type: enum, source: system, description: "PLANNING | LAUNCHED | WEATHER_HOLD | AT_PATIENT | IN_TRANSIT | DIVERTED | AT_DESTINATION | COMPLETED | ABORTED | CANCELLED", default: PLANNING, constraints: "enum {PLANNING, LAUNCHED, WEATHER_HOLD, AT_PATIENT, IN_TRANSIT, DIVERTED, AT_DESTINATION, COMPLETED, ABORTED, CANCELLED}" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: role_in_mission, type: enum, source: input, description: "PILOT | NURSE | PARAMEDIC", constraints: "enum {PILOT, NURSE, PARAMEDIC}" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED | COMPLETED", default: ASSIGNED, constraints: "enum {ASSIGNED, RELEASED, COMPLETED}" }

  - name: WeatherAssessment
    parent: null
    common_fields: false
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id" }
      - { name: ceiling_ft, type: integer, source: input, description: "Cloud ceiling AGL feet, >= 0" }
      - { name: visibility_sm, type: number, source: input, description: "Statute miles, >= 0" }
      - { name: wind_kt, type: integer, source: input, description: "Crosswind component knots, >= 0" }
      - { name: precip, type: enum, source: input, description: "NONE | LIGHT | HEAVY | ICE", constraints: "enum {NONE, LIGHT, HEAVY, ICE}" }
      - { name: day_night, type: enum, source: input, description: "DAY | NIGHT", constraints: "enum {DAY, NIGHT}" }
      - { name: terrain, type: enum, source: input, description: "FLAT | MOUNTAINOUS", constraints: "enum {FLAT, MOUNTAINOUS}" }
      - { name: decision, type: enum, source: computed, description: "GO | MARGINAL | NO_GO per C3", constraints: "enum {GO, MARGINAL, NO_GO}" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical now at creation; assessment stale after 60 minutes" }

  - name: GroundTransportLeg
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id" }
      - { name: leg_type, type: enum, source: input, description: "ORIGIN | DESTINATION", constraints: "enum {ORIGIN, DESTINATION}" }
      - { name: provider_name, type: string, source: input, description: "Ground EMS provider" }
      - { name: scheduled_pickup_iso, type: datetime, source: input, description: "Planned pickup instant" }
      - { name: estimated_ground_miles, type: number, source: input, required: false, description: "Planned ground miles" }
      - { name: bed_reservation_id, type: string, source: input, required: false, description: "FK -> BedReservation.id; DESTINATION legs may link the held bed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ENROUTE | AT_BEDSIDE | COMPLETED | CANCELLED", default: SCHEDULED, constraints: "enum {SCHEDULED, ENROUTE, AT_BEDSIDE, COMPLETED, CANCELLED}" }

  - name: BedReservation
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id" }
      - { name: facility_name, type: string, source: input, description: "Receiving facility holding the bed" }
      - { name: bed_type, type: enum, source: input, description: "ICU | CCU | MED_SURGE | NICU", constraints: "enum {ICU, CCU, MED_SURGE, NICU}" }
      - { name: hold_until_iso, type: datetime, source: input, description: "Hold expiry instant" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED | CONSUMED", default: HELD, constraints: "enum {HELD, CONFIRMED, RELEASED, CONSUMED}" }

  - name: InsuranceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer" }
      - { name: policy_number, type: string, source: input, description: "Member policy number" }
      - { name: approved_amount_cents, type: integer, source: input, required: false, description: "Approved amount when decision PARTIAL" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | PARTIAL | DENIED | APPEALED", default: REQUESTED, constraints: "enum {REQUESTED, APPROVED, PARTIAL, DENIED, APPEALED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id; exactly one Invoice per mission" }
      - { name: membership_id, type: string, source: system, description: "FK -> MembershipSubscription.id; bound at finalize when member dimension evaluates MEMBER_PROTECTED, else null" }
      - { name: estimated_loaded_miles, type: number, source: system, description: "Snapshot from Mission at creation" }
      - { name: actual_loaded_miles, type: number, source: input, description: "Flight-log loaded miles entered at finalize" }
      - { name: base_line_cents, type: integer, source: computed, description: "Liftoff base fee line (C1)" }
      - { name: mileage_line_cents, type: integer, source: computed, description: "Mileage line, rounded half-up to cents before surcharge (C4)" }
      - { name: fuel_line_cents, type: integer, source: computed, description: "7% of the ROUNDED mileage line, rounded half-up (C4 pinned order)" }
      - { name: acuity_line_cents, type: integer, source: computed, description: "Acuity surcharge line per tier snapshot" }
      - { name: logistics_line_cents, type: integer, source: computed, description: "4% of pre-logistics subtotal when subtotal >= 2500000 (C7 pinned evaluation order)" }
      - { name: ground_line_cents, type: integer, source: computed, description: "45000 per included ground leg; provisional counts legs in {SCHEDULED, ENROUTE, AT_BEDSIDE, COMPLETED}, final counts COMPLETED only" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "C1 provisional variant total at creation" }
      - { name: final_total_cents, type: integer, source: computed, description: "C1 final variant total at finalize" }
      - { name: insurer_paid_cents, type: integer, source: system, default: 0, description: "Cumulative payer payments (reset to 0 on appeal)" }
      - { name: contractual_adjustment_cents, type: integer, source: system, default: 0, description: "Cumulative contractual adjustment (reset to 0 on appeal)" }
      - { name: member_writeoff_cents, type: integer, source: system, default: 0, description: "Balance-bill protection write-off" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "= final_total_cents - insurer_paid_cents - contractual_adjustment_cents - member_writeoff_cents" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; hard cap 2" }
      - { name: claim_status, type: enum, source: system, description: "DRAFT | FINALIZED | SUBMITTED | PAID | PARTIALLY_PAID | DENIED | APPEALED | RESUBMITTED", default: DRAFT, constraints: "enum {DRAFT, FINALIZED, SUBMITTED, PAID, PARTIALLY_PAID, DENIED, APPEALED, RESUBMITTED}" }
      - { name: member_adjustment_status, type: enum, source: system, description: "UNEVALUATED | MEMBER_PROTECTED | NON_MEMBER | WRITEOFF_POSTED | BALANCE_BILLED (parallel dimension, independent of claim_status)", default: UNEVALUATED, constraints: "enum {UNEVALUATED, MEMBER_PROTECTED, NON_MEMBER, WRITEOFF_POSTED, BALANCE_BILLED}" }

  - name: RepatriationCase
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id; exactly one case per mission" }
      - { name: destination_country, type: string, source: input, description: "ISO country of receiving facility" }
      - { name: receiving_facility, type: string, source: input, description: "Receiving facility abroad" }
      - { name: documents, type: array, source: input, description: "Appended document entries: {doc_type, document_number, issued_iso, expires_iso?}; doc_type in {PASSPORT, VISA, FIT_TO_FLY, CUSTOMS_PRECLEARANCE}" }
      - { name: status, type: enum, source: system, description: "COLLECTING | READY_TO_FLY", default: COLLECTING, constraints: "enum {COLLECTING, READY_TO_FLY}" }

  - name: PatientCareReport
    parent: null
    common_fields: true
    fields:
      - { name: mission_id, type: string, source: input, description: "FK -> Mission.id; exactly one PCR per mission" }
      - { name: author_crew_id, type: string, source: input, description: "FK -> CrewMember.id; must equal X-User-ID of the FlightCrew caller" }
      - { name: vitals_summary, type: string, source: input, description: "Vitals narrative" }
      - { name: interventions_summary, type: string, source: input, description: "Interventions narrative" }
      - { name: meds_summary, type: string, source: input, description: "Medications narrative" }
      - { name: last_review_points, type: integer, source: system, default: 0, description: "deficiency_points from the most recent qa-review" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical now of the most recent submit" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | QA_APPROVED | QA_FLAGGED | AMENDED", default: DRAFT, constraints: "enum {DRAFT, SUBMITTED, QA_APPROVED, QA_FLAGGED, AMENDED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Aircraft
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /air-ambulance/mission-requests/{id}/accept (mission creation binds this tail)"
        actor: Dispatcher
        preconditions:
          - "Aircraft.status in {AVAILABLE, ASSIGNED} — a tail may hold multiple non-overlapping future bookings; MAINTENANCE rejects (ERR_AIRCRAFT_NOT_AVAILABLE)"
          - "No other non-terminal Mission on this aircraft whose [planned_launch_iso, planned_launch_iso + planned_duration_min) half-open window overlaps the new mission's window (ERR_AIRCRAFT_SCHEDULE_CONFLICT); windows touching endpoint-to-startpoint are allowed"
        side_effects:
          - "Aircraft.version += 1"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (cascade: the LAST non-terminal Mission bound to this tail reaches COMPLETED, ABORTED, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Aircraft.version += 1"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "PUT /air-ambulance/aircraft/{id} {status: MAINTENANCE}"
        actor: OpsAdmin
        preconditions:
          - "Aircraft.status in {AVAILABLE, MAINTENANCE} (from ASSIGNED -> ERR_INVALID_STATE)"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "PUT /air-ambulance/aircraft/{id} {status: AVAILABLE}"
        actor: OpsAdmin
        preconditions:
          - "Aircraft.status in {AVAILABLE, MAINTENANCE} (from ASSIGNED -> ERR_INVALID_STATE)"
        side_effects: []

  - entity: CrewMember
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: REMEDIATION_HOLD
        trigger: "system (cascade: C8 — deficiency_points_90d reaches >= 15 after a qa-review)"
        actor: system
        preconditions: []
        side_effects:
          - "Every CrewAssignment with crew_member_id == this member AND status == ASSIGNED on a Mission in PLANNING -> RELEASED (C8 cascade hop 3)"
      - from: REMEDIATION_HOLD
        to: ACTIVE
        trigger: "PUT /air-ambulance/crew-members/{id} {status: ACTIVE}"
        actor: OpsAdmin
        preconditions:
          - "CrewMember.status == REMEDIATION_HOLD (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "PUT /air-ambulance/crew-members/{id} {status: INACTIVE}"
        actor: OpsAdmin
        preconditions:
          - "CrewMember.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "PUT /air-ambulance/crew-members/{id} {status: ACTIVE}"
        actor: OpsAdmin
        preconditions:
          - "CrewMember.status == INACTIVE (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: CrewShift
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "PUT /air-ambulance/crew-shifts/{id} {status: CLOSED}"
        actor: OpsAdmin | FlightCrew
        preconditions:
          - "CrewShift.status == OPEN (else ERR_INVALID_STATE)"
          - "FlightCrew caller: crew_member_id must equal X-User-ID (else ERR_FORBIDDEN)"
        side_effects:
          - "actual_end_iso := logical now"

  - entity: MembershipSubscription
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "PUT /air-ambulance/memberships/{id} {status: LAPSED}"
        actor: BillingSpecialist
        preconditions:
          - "MembershipSubscription.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "lapsed_at := logical now"
      - from: LAPSED
        to: ACTIVE
        trigger: "PUT /air-ambulance/memberships/{id} {status: ACTIVE} (reinstatement)"
        actor: BillingSpecialist
        preconditions:
          - "MembershipSubscription.status == LAPSED (else ERR_INVALID_STATE)"
          - "logical now <= lapsed_at + 30 days inclusive (else ERR_REINSTATE_WINDOW_EXPIRED)"
        side_effects:
          - "lapsed_at := null"
      - from: ACTIVE
        to: TERMINATED
        trigger: "PUT /air-ambulance/memberships/{id} {status: TERMINATED}"
        actor: BillingSpecialist
        preconditions:
          - "MembershipSubscription.status in {ACTIVE, LAPSED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: LAPSED
        to: TERMINATED
        trigger: "PUT /air-ambulance/memberships/{id} {status: TERMINATED}"
        actor: BillingSpecialist
        preconditions:
          - "MembershipSubscription.status in {ACTIVE, LAPSED} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: MissionRequest
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /air-ambulance/mission-requests/{id}/triage"
        actor: MedicalDirector
        preconditions:
          - "MissionRequest.status == RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "acceptance_acuity_score := C2 acceptance variant over verified subscales + deterioration modifier"
          - "acuity_tier := tier of acceptance score (>= 7.0 CCT, >= 4.0 ALS, else BLS)"
      - from: TRIAGED
        to: PENDING_INFO
        trigger: "POST /air-ambulance/mission-requests/{id}/request-info"
        actor: MedicalDirector
        preconditions:
          - "MissionRequest.status == TRIAGED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING_INFO
        to: TRIAGED
        trigger: "POST /air-ambulance/mission-requests/{id}/provide-info"
        actor: Dispatcher
        preconditions:
          - "MissionRequest.status == PENDING_INFO (else ERR_INVALID_STATE)"
        side_effects:
          - "acceptance_acuity_score := C2 acceptance variant over updated subscales + deterioration modifier (recomputed)"
          - "acuity_tier := tier of recomputed acceptance score"
      - from: TRIAGED
        to: ACCEPTED
        trigger: "POST /air-ambulance/mission-requests/{id}/accept"
        actor: Dispatcher
        preconditions:
          - "MissionRequest.status == TRIAGED (else ERR_REQUEST_NOT_TRIAGED)"
          - "Aircraft medical_config rank >= acuity_tier rank (else ERR_ACUITY_EXCEEDS_CONFIG)"
          - "Crew composition covers tier: every tier requires {PILOT, NURSE}; CCT additionally requires PARAMEDIC; each supplied crew role filled by exactly one ACTIVE CrewAssignment (else ERR_CREW_COMPOSITION_INCOMPLETE / ERR_CREW_UNAVAILABLE)"
          - "If transport_class in {SCHEDULED_INTERFACILITY, INTERNATIONAL_REPATRIATION} and emergency_override == false: an InsuranceAuthorization for the eventual mission is NOT required at accept, but see launch gate (auth is validated at launch); no fiscal check at accept"
        side_effects:
          - "Create Mission (status PLANNING) with snapshots transport_class, acuity_tier, destination_facility"
          - "Aircraft AVAILABLE -> ASSIGNED (see Aircraft machine; includes window-overlap check)"
          - "Create one CrewAssignment per crew entry (status ASSIGNED); each referenced CrewMember must be ACTIVE (ERR_CREW_UNAVAILABLE)"
      - from: TRIAGED
        to: DECLINED
        trigger: "POST /air-ambulance/mission-requests/{id}/decline"
        actor: MedicalDirector
        preconditions:
          - "MissionRequest.status in {TRIAGED, PENDING_INFO} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING_INFO
        to: DECLINED
        trigger: "POST /air-ambulance/mission-requests/{id}/decline"
        actor: MedicalDirector
        preconditions:
          - "MissionRequest.status in {TRIAGED, PENDING_INFO} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Mission
    initial_state: PLANNING
    terminal_states: [COMPLETED, ABORTED, CANCELLED]
    transitions:
      - from: PLANNING
        to: LAUNCHED
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: LAUNCHED}"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status == PLANNING (else ERR_INVALID_STATE)"
          - "Aircraft.status == ASSIGNED and aircraft_id unchanged (else ERR_AIRCRAFT_NOT_AVAILABLE)"
          - "Newest WeatherAssessment (ordered by created_at DESC; equal created_at broken by server receipt sequence, never by id) exists, is fresh (logical now <= assessed_at + 60 min, else ERR_WEATHER_ASSESSMENT_STALE), decision == GO; decision == MARGINAL requires alternate_destination non-null (else ERR_ALTERNATE_REQUIRED); decision == NO_GO or no assessment (else ERR_BELOW_WEATHER_MINIMUMS)"
          - "All ASSIGNED CrewAssignments reference CrewMember.status == ACTIVE (else ERR_CREW_UNAVAILABLE)"
          - "If transport_class in {SCHEDULED_INTERFACILITY, INTERNATIONAL_REPATRIATION} and MissionRequest.emergency_override == false: an InsuranceAuthorization on this mission with status APPROVED or PARTIAL exists (else ERR_AUTH_REQUIRED)"
          - "If transport_class == INTERNATIONAL_REPATRIATION: RepatriationCase.status == READY_TO_FLY (else ERR_REPATRIATION_NOT_READY); on this check the case's documents are re-validated — a FIT_TO_FLY doc older than 72h or an expired PASSPORT/VISA demotes the case to COLLECTING and fails with ERR_DOC_EXPIRED"
        side_effects:
          - "launched_at := logical now"
      - from: LAUNCHED
        to: WEATHER_HOLD
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: WEATHER_HOLD}"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status == LAUNCHED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: WEATHER_HOLD
        to: LAUNCHED
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: LAUNCHED}"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status == WEATHER_HOLD (else ERR_INVALID_STATE)"
          - "Newest WeatherAssessment (same ordering: created_at DESC, receipt-sequence tie-break) is fresh (<= 60 min) and decision == GO (else ERR_BELOW_WEATHER_MINIMUMS)"
        side_effects: []
        note: "Hold-resume loop: LAUNCHED -> WEATHER_HOLD -> LAUNCHED may repeat; each resume consumes a fresh GO assessment"
      - from: LAUNCHED
        to: AT_PATIENT
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: AT_PATIENT}"
        actor: FlightCrew
        preconditions:
          - "Mission.status == LAUNCHED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: AT_PATIENT
        to: IN_TRANSIT
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: IN_TRANSIT}"
        actor: FlightCrew
        preconditions:
          - "Mission.status == AT_PATIENT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_TRANSIT
        to: DIVERTED
        trigger: "POST /air-ambulance/missions/{id}/divert"
        actor: FlightCrew
        preconditions:
          - "Mission.status == IN_TRANSIT (else ERR_INVALID_STATE)"
        side_effects:
          - "Mission.destination_facility := new_destination_facility"
          - "Cascade hop 1: every BedReservation on this mission with facility_name != new_destination_facility and status in {HELD, CONFIRMED} -> RELEASED"
          - "Cascade hop 2: every GroundTransportLeg whose bed_reservation_id points at a bed released in hop 1 and status in {SCHEDULED, ENROUTE} -> CANCELLED"
          - "Cascade hop 3: Mission.ground_coordination_status recomputed (becomes NEEDS_REPLAN when a DESTINATION leg was cancelled without replacement)"
      - from: IN_TRANSIT
        to: AT_DESTINATION
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: AT_DESTINATION}"
        actor: FlightCrew
        preconditions:
          - "Mission.status == IN_TRANSIT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DIVERTED
        to: AT_DESTINATION
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: AT_DESTINATION}"
        actor: FlightCrew
        preconditions:
          - "Mission.status == DIVERTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: AT_DESTINATION
        to: COMPLETED
        trigger: "POST /air-ambulance/missions/{id}/advance {to_state: COMPLETED}"
        actor: FlightCrew
        preconditions:
          - "Mission.status == AT_DESTINATION (else ERR_INVALID_STATE)"
          - "Every non-CANCELLED GroundTransportLeg on this mission has status COMPLETED (else ERR_GROUND_LEGS_PENDING)"
        side_effects:
          - "completed_at := logical now"
          - "Aircraft ASSIGNED -> AVAILABLE"
          - "All CrewAssignments ASSIGNED -> COMPLETED"
          - "BedReservation in {HELD, CONFIRMED} on this mission -> CONSUMED"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /air-ambulance/missions/{id}/abort"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status == PLANNING (else ERR_INVALID_STATE)"
        side_effects:
          - "Aircraft ASSIGNED -> AVAILABLE"
          - "All CrewAssignments ASSIGNED -> RELEASED"
          - "GroundTransportLegs in {SCHEDULED, ENROUTE} -> CANCELLED; each such DESTINATION leg's linked BedReservation in {HELD, CONFIRMED} -> RELEASED (cascade hop 2)"
      - from: LAUNCHED
        to: ABORTED
        trigger: "POST /air-ambulance/missions/{id}/abort"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status in {LAUNCHED, WEATHER_HOLD, AT_PATIENT, IN_TRANSIT} (else ERR_INVALID_STATE)"
        side_effects:
          - "Aircraft ASSIGNED -> AVAILABLE (cascade hop 1)"
          - "All CrewAssignments ASSIGNED -> RELEASED"
          - "GroundTransportLegs in {SCHEDULED, ENROUTE} -> CANCELLED (cascade hop 1)"
          - "Each cancelled DESTINATION leg's linked BedReservation in {HELD, CONFIRMED} -> RELEASED (cascade hop 2, caused by the leg cancellation)"
      - from: WEATHER_HOLD
        to: ABORTED
        trigger: "POST /air-ambulance/missions/{id}/abort"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status in {LAUNCHED, WEATHER_HOLD, AT_PATIENT, IN_TRANSIT} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade set as LAUNCHED -> ABORTED"
      - from: AT_PATIENT
        to: ABORTED
        trigger: "POST /air-ambulance/missions/{id}/abort"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status in {LAUNCHED, WEATHER_HOLD, AT_PATIENT, IN_TRANSIT} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade set as LAUNCHED -> ABORTED"
      - from: IN_TRANSIT
        to: ABORTED
        trigger: "POST /air-ambulance/missions/{id}/abort"
        actor: Dispatcher | FlightCrew
        preconditions:
          - "Mission.status in {LAUNCHED, WEATHER_HOLD, AT_PATIENT, IN_TRANSIT} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade set as LAUNCHED -> ABORTED"

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "system (cascade: mission abort/cancel, or C8 remediation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (cascade: owning Mission reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GroundTransportLeg
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ENROUTE
        trigger: "PUT /air-ambulance/ground-legs/{id} {status: ENROUTE}"
        actor: Dispatcher
        preconditions:
          - "GroundTransportLeg.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Owning Mission.status not in {COMPLETED, ABORTED, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ENROUTE
        to: AT_BEDSIDE
        trigger: "PUT /air-ambulance/ground-legs/{id} {status: AT_BEDSIDE}"
        actor: Dispatcher
        preconditions:
          - "GroundTransportLeg.status == ENROUTE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: AT_BEDSIDE
        to: COMPLETED
        trigger: "PUT /air-ambulance/ground-legs/{id} {status: COMPLETED}"
        actor: Dispatcher
        preconditions:
          - "GroundTransportLeg.status == AT_BEDSIDE (else ERR_INVALID_STATE)"
        side_effects:
          - "Owning Mission.ground_coordination_status recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PUT /air-ambulance/ground-legs/{id} {status: CANCELLED} or system cascade (mission abort / divert hop 2)"
        actor: Dispatcher | system
        preconditions:
          - "GroundTransportLeg.status in {SCHEDULED, ENROUTE} (else ERR_INVALID_STATE)"
        side_effects:
          - "If leg_type == DESTINATION and bed_reservation_id set and that bed in {HELD, CONFIRMED}: BedReservation -> RELEASED"
          - "Owning Mission.ground_coordination_status recomputed"
      - from: ENROUTE
        to: CANCELLED
        trigger: "PUT /air-ambulance/ground-legs/{id} {status: CANCELLED} or system cascade"
        actor: Dispatcher | system
        preconditions:
          - "GroundTransportLeg.status in {SCHEDULED, ENROUTE} (else ERR_INVALID_STATE)"
        side_effects:
          - "If leg_type == DESTINATION and bed_reservation_id set and that bed in {HELD, CONFIRMED}: BedReservation -> RELEASED"
          - "Owning Mission.ground_coordination_status recomputed"

  - entity: BedReservation
    initial_state: HELD
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "PUT /air-ambulance/bed-reservations/{id} {status: CONFIRMED}"
        actor: Dispatcher
        preconditions:
          - "BedReservation.status == HELD (else ERR_INVALID_STATE)"
        side_effects: []
      - from: HELD
        to: RELEASED
        trigger: "PUT /air-ambulance/bed-reservations/{id} {status: RELEASED} or system cascade (divert hop 1 / leg-cancel / mission abort)"
        actor: Dispatcher | system
        preconditions:
          - "BedReservation.status in {HELD, CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: "PUT /air-ambulance/bed-reservations/{id} {status: RELEASED} or system cascade"
        actor: Dispatcher | system
        preconditions:
          - "BedReservation.status in {HELD, CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: HELD
        to: CONSUMED
        trigger: "system (cascade: owning Mission reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CONSUMED
        trigger: "system (cascade: owning Mission reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InsuranceAuthorization
    initial_state: REQUESTED
    terminal_states: []
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "PUT /air-ambulance/insurance-authorizations/{id} {status: APPROVED}"
        actor: BillingSpecialist
        preconditions:
          - "Status in {REQUESTED, APPEALED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: REQUESTED
        to: PARTIAL
        trigger: "PUT /air-ambulance/insurance-authorizations/{id} {status: PARTIAL, approved_amount_cents}"
        actor: BillingSpecialist
        preconditions:
          - "Status in {REQUESTED, APPEALED} (else ERR_INVALID_STATE)"
          - "approved_amount_cents present and > 0 (else ERR_VALIDATION)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "PUT /air-ambulance/insurance-authorizations/{id} {status: DENIED}"
        actor: BillingSpecialist
        preconditions:
          - "Status in {REQUESTED, APPEALED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DENIED
        to: APPEALED
        trigger: "PUT /air-ambulance/insurance-authorizations/{id} {status: APPEALED}"
        actor: BillingSpecialist
        preconditions:
          - "Status == DENIED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: APPEALED
        to: APPROVED
        trigger: "PUT /air-ambulance/insurance-authorizations/{id} {status: APPROVED}"
        actor: BillingSpecialist
        preconditions:
          - "Status in {REQUESTED, APPEALED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: APPEALED
        to: DENIED
        trigger: "PUT /air-ambulance/insurance-authorizations/{id} {status: DENIED}"
        actor: BillingSpecialist
        preconditions:
          - "Status in {REQUESTED, APPEALED} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: []
    note: "PARALLEL state dimensions: claim_status and member_adjustment_status evolve independently on the same row."
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /air-ambulance/invoices/{id}/finalize"
        actor: BillingSpecialist
        preconditions:
          - "claim_status == DRAFT (else ERR_INVALID_STATE)"
          - "Owning Mission.status == COMPLETED (else ERR_MISSION_NOT_COMPLETED)"
        side_effects:
          - "C1 final variant + C4 rounding + C7 tier recompute all line fields and final_total_cents from actual_loaded_miles"
          - "member dimension evaluates: if a MembershipSubscription for the mission's patient exists with status == ACTIVE and effective_from <= date(mission.completed_at), member_adjustment_status := MEMBER_PROTECTED and membership_id bound; else NON_MEMBER"
      - from: FINALIZED
        to: SUBMITTED
        trigger: "POST /air-ambulance/invoices/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim_status == FINALIZED (else ERR_INVALID_STATE)"
          - "The mission's PatientCareReport has status == QA_APPROVED (else ERR_PCR_NOT_APPROVED)"
          - "date(logical now) <= date(mission.completed_at) + 90 days inclusive (else ERR_TIMELY_FILING_EXPIRED)"
        side_effects: []
      - from: SUBMITTED
        to: PAID
        trigger: "POST /air-ambulance/invoices/{id}/payer-response {outcome: PAID}"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {SUBMITTED, RESUBMITTED} (else ERR_INVALID_STATE)"
          - "paid_cents + contractual_adjustment_cents <= final_total_cents (else ERR_LEDGER_IMBALANCE)"
        side_effects:
          - "C6 waterfall: insurer_paid_cents := paid_cents; contractual_adjustment_cents := adjustment; patient_responsibility_cents recomputed"
          - "If member_adjustment_status == NON_MEMBER: member_adjustment_status := BALANCE_BILLED"
      - from: SUBMITTED
        to: PARTIALLY_PAID
        trigger: "POST /air-ambulance/invoices/{id}/payer-response {outcome: PARTIALLY_PAID}"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {SUBMITTED, RESUBMITTED} (else ERR_INVALID_STATE)"
          - "paid_cents + contractual_adjustment_cents <= final_total_cents (else ERR_LEDGER_IMBALANCE)"
        side_effects:
          - "C6 waterfall applied; if member_adjustment_status == NON_MEMBER -> BALANCE_BILLED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /air-ambulance/invoices/{id}/payer-response {outcome: DENIED}"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {SUBMITTED, RESUBMITTED} (else ERR_INVALID_STATE)"
          - "paid_cents + contractual_adjustment_cents <= final_total_cents (else ERR_LEDGER_IMBALANCE)"
        side_effects:
          - "C6 waterfall applied"
      - from: RESUBMITTED
        to: PAID
        trigger: "POST /air-ambulance/invoices/{id}/payer-response {outcome: PAID}"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {SUBMITTED, RESUBMITTED} (else ERR_INVALID_STATE)"
          - "paid_cents + contractual_adjustment_cents <= final_total_cents (else ERR_LEDGER_IMBALANCE)"
        side_effects:
          - "C6 waterfall applied; NON_MEMBER -> BALANCE_BILLED"
      - from: RESUBMITTED
        to: PARTIALLY_PAID
        trigger: "POST /air-ambulance/invoices/{id}/payer-response {outcome: PARTIALLY_PAID}"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {SUBMITTED, RESUBMITTED} (else ERR_INVALID_STATE)"
          - "paid_cents + contractual_adjustment_cents <= final_total_cents (else ERR_LEDGER_IMBALANCE)"
        side_effects:
          - "C6 waterfall applied; NON_MEMBER -> BALANCE_BILLED"
      - from: RESUBMITTED
        to: DENIED
        trigger: "POST /air-ambulance/invoices/{id}/payer-response {outcome: DENIED}"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {SUBMITTED, RESUBMITTED} (else ERR_INVALID_STATE)"
          - "paid_cents + contractual_adjustment_cents <= final_total_cents (else ERR_LEDGER_IMBALANCE)"
        side_effects:
          - "C6 waterfall applied"
      - from: DENIED
        to: APPEALED
        trigger: "POST /air-ambulance/invoices/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "claim_status == DENIED (else ERR_INVALID_STATE)"
          - "appeal_count < 2 (else ERR_APPEAL_LIMIT)"
        side_effects:
          - "appeal_count += 1"
          - "insurer_paid_cents := 0 and contractual_adjustment_cents := 0 (compensation: reverses the denied posting so the ledger invariant holds with the zeroed posting)"
      - from: APPEALED
        to: RESUBMITTED
        trigger: "POST /air-ambulance/invoices/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "claim_status in {FINALIZED, APPEALED} (else ERR_INVALID_STATE)"
          - "PatientCareReport QA_APPROVED (else ERR_PCR_NOT_APPROVED)"
          - "Timely-filing window (else ERR_TIMELY_FILING_EXPIRED)"
        side_effects: []
      - from: UNEVALUATED
        to: MEMBER_PROTECTED
        trigger: "system (member dimension evaluated at finalize)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNEVALUATED
        to: NON_MEMBER
        trigger: "system (member dimension evaluated at finalize)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MEMBER_PROTECTED
        to: WRITEOFF_POSTED
        trigger: "POST /air-ambulance/invoices/{id}/member-writeoff"
        actor: BillingSpecialist
        preconditions:
          - "member_adjustment_status == MEMBER_PROTECTED (else ERR_MEMBERSHIP_NOT_ELIGIBLE)"
          - "claim_status in {PAID, PARTIALLY_PAID, DENIED} (a payer response has been posted; else ERR_INVALID_STATE)"
        side_effects:
          - "C6 waterfall: member_writeoff_cents := patient_responsibility_cents; patient_responsibility_cents := 0"
      - from: NON_MEMBER
        to: BALANCE_BILLED
        trigger: "system (at first payer-response when member dimension is NON_MEMBER)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RepatriationCase
    initial_state: COLLECTING
    terminal_states: []
    transitions:
      - from: COLLECTING
        to: READY_TO_FLY
        trigger: "POST /air-ambulance/repatriation-cases/{id}/verify"
        actor: MedicalDirector
        preconditions:
          - "RepatriationCase.status == COLLECTING (else ERR_INVALID_STATE)"
          - "documents contains all four types {PASSPORT, VISA, FIT_TO_FLY, CUSTOMS_PRECLEARANCE} (else ERR_DOCS_INCOMPLETE)"
          - "PASSPORT and VISA entries have expires_iso > logical now; FIT_TO_FLY issued_iso within 72h (logical now - issued_iso <= 72h inclusive); else ERR_DOC_EXPIRED"
        side_effects: []
      - from: READY_TO_FLY
        to: COLLECTING
        trigger: "system (lazy demotion: launch gate re-validation finds an expired document)"
        actor: system
        preconditions: []
        side_effects:
          - "Case demoted; the triggering launch fails with ERR_DOC_EXPIRED"
        note: "Cycle COLLECTING -> READY_TO_FLY -> COLLECTING repeats as documents expire"

  - entity: PatientCareReport
    initial_state: DRAFT
    terminal_states: [QA_APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /air-ambulance/patient-care-reports/{id}/submit"
        actor: FlightCrew
        preconditions:
          - "Status in {DRAFT, AMENDED} (else ERR_INVALID_STATE)"
          - "X-User-ID == author_crew_id (else ERR_FORBIDDEN)"
          - "Owning Mission.status == COMPLETED (else ERR_MISSION_NOT_COMPLETED)"
          - "logical now <= mission.completed_at + 24h inclusive (else ERR_PCR_WINDOW_EXPIRED)"
        side_effects:
          - "submitted_at := logical now"
      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /air-ambulance/patient-care-reports/{id}/submit"
        actor: FlightCrew
        preconditions:
          - "Status in {DRAFT, AMENDED} (else ERR_INVALID_STATE)"
          - "X-User-ID == author_crew_id (else ERR_FORBIDDEN)"
          - "Owning Mission.status == COMPLETED (else ERR_MISSION_NOT_COMPLETED)"
          - "logical now <= mission.completed_at + 24h inclusive (else ERR_PCR_WINDOW_EXPIRED)"
        side_effects:
          - "submitted_at := logical now"
      - from: SUBMITTED
        to: QA_APPROVED
        trigger: "POST /air-ambulance/patient-care-reports/{id}/qa-review {outcome: APPROVED}"
        actor: QaReviewer
        preconditions:
          - "Status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != author_crew_id (segregation of duties; else ERR_SELF_REVIEW_FORBIDDEN)"
        side_effects:
          - "last_review_points := deficiency_points (0 expected)"
      - from: SUBMITTED
        to: QA_FLAGGED
        trigger: "POST /air-ambulance/patient-care-reports/{id}/qa-review {outcome: FLAGGED}"
        actor: QaReviewer
        preconditions:
          - "Status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != author_crew_id (else ERR_SELF_REVIEW_FORBIDDEN)"
        side_effects:
          - "last_review_points := deficiency_points"
          - "C8 cascade hop 1: author CrewMember.deficiency_points_90d += deficiency_points"
          - "C8 cascade hop 2: if deficiency_points_90d >= 15, CrewMember.status ACTIVE -> REMEDIATION_HOLD"
          - "C8 cascade hop 3 (caused by hop 2): that member's CrewAssignments with status ASSIGNED on PLANNING missions -> RELEASED"
      - from: QA_FLAGGED
        to: AMENDED
        trigger: "POST /air-ambulance/patient-care-reports/{id}/amend"
        actor: FlightCrew
        preconditions:
          - "Status in {QA_FLAGGED, AMENDED} (else ERR_INVALID_STATE)"
          - "X-User-ID == author_crew_id (else ERR_FORBIDDEN)"
          - "expected_patient_care_report_version == current version (OCC; else ERR_STALE_VERSION)"
        side_effects:
          - "PatientCareReport.version += 1"
        note: "QA cycle: SUBMITTED -> QA_FLAGGED -> AMENDED -> SUBMITTED may repeat until approved"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /air-ambulance/patient-care-reports/{id}/amend"
        actor: FlightCrew
        preconditions:
          - "Status in {QA_FLAGGED, AMENDED} (else ERR_INVALID_STATE)"
          - "X-User-ID == author_crew_id (else ERR_FORBIDDEN)"
          - "expected_patient_care_report_version == current version (OCC; else ERR_STALE_VERSION)"
        side_effects:
          - "PatientCareReport.version += 1"
        note: "Further edits before resubmission; self-loop keeps the OCC version check observable on sequential amends (state guard passes, version guard is what fires)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: weather-assessment-stale-mission
    parent_entity: Mission
    write_endpoint: "POST /air-ambulance/weather-assessments"
    occ_field: expected_mission_version
    description: |
      Posting a WeatherAssessment against a Mission whose version has advanced
      since the client last observed it is rejected. Each posted assessment
      mutates the Mission (last_weather_decision + version bump), so a writer
      holding a stale observed version must re-read before filing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pcr-amend-stale-record
    parent_entity: PatientCareReport
    write_endpoint: "POST /air-ambulance/patient-care-reports/{id}/amend"
    occ_field: expected_patient_care_report_version
    description: |
      Amending a QA_FLAGGED PatientCareReport whose version has advanced since
      the author last observed it is rejected; the record remains QA_FLAGGED
      after a successful amend, so version arithmetic is the only correct
      staleness signal.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: mission_transport_charge
    code: C1
    trigger: "POST /air-ambulance/invoices (provisional variant) and POST /air-ambulance/invoices/{id}/finalize (final variant)"
    algorithm: tiered_pricing
    formula: |
      Pinned evaluation order (C7): mileage_line -> fuel_line -> subtotal ->
      logistics tier keyed on PRE-LOGISTICS subtotal -> logistics_line ->
      ground_line -> total. All money integer cents; every line rounded
      half-up to whole cents BEFORE summation (C4 pinned rounding order).
        miles      = variant mile figure (see variants)
        base_line      = BASE_LIFTOFF[aircraft_class]
        mileage_line   = round_half_up(miles * PER_MILE[aircraft_class])
        fuel_line      = round_half_up(mileage_line * FUEL_PCT / 100)
        acuity_line    = ACUITY_FEE[acuity_tier]
        subtotal       = base_line + mileage_line + fuel_line + acuity_line
        logistics_line = round_half_up(subtotal * LOGISTICS_PCT / 100)
                         if subtotal >= LOGISTICS_THRESHOLD else 0
        ground_line    = GROUND_LEG_FLAT * (count of included ground legs)
        total          = subtotal + logistics_line + ground_line
    input_set: "Mission snapshot (transport_class, acuity_tier, aircraft_class of assigned tail) + Mission's GroundTransportLegs; provisional counts legs in {SCHEDULED, ENROUTE, AT_BEDSIDE, COMPLETED}, final counts legs in {COMPLETED} only"
    constants:
      BASE_LIFTOFF_ROTOR: 1800000
      BASE_LIFTOFF_FIXED: 950000
      PER_MILE_ROTOR: 16000
      PER_MILE_FIXED: 4500
      FUEL_PCT: 7
      ACUITY_FEE_BLS: 0
      ACUITY_FEE_ALS: 120000
      ACUITY_FEE_CCT: 350000
      LOGISTICS_THRESHOLD: 2500000
      LOGISTICS_PCT: 4
      GROUND_LEG_FLAT: 45000
      PROVISIONAL_MILE_FACTOR: 1.15
    precision: "integer cents; each line round_half_up to whole cents before summation"
    variants:
      - name: provisional_quote
        when: "Invoice creation (mission accepted, actuals unknown)"
        difference: "miles = ceil(estimated_loaded_miles * 1.15) to whole miles; ground legs counted in pre-completion statuses; result stored in provisional_total_cents"
      - name: final_settlement
        when: "Invoice finalize after mission COMPLETED"
        difference: "miles = actual_loaded_miles exactly as entered (no pad factor, fractional miles allowed); ground legs counted only when COMPLETED; result stored in final_total_cents"

  - name: patient_acuity_score
    code: C2
    trigger: "POST /air-ambulance/mission-requests (triage variant) and POST /air-ambulance/mission-requests/{id}/triage or /provide-info (acceptance variant)"
    algorithm: weighted_scoring
    formula: |
      score = w_cardio*cardio + w_resp*resp + w_neuro*neuro + w_interv*interventions
      Acceptance variant adds DETERIORATION_BONUS when (triage_time - onset_iso) < 120 minutes.
      Tier mapping on the ACCEPTANCE score: score >= 7.0 -> CCT; score >= 4.0 -> ALS; else BLS (>= inclusive at both breaks).
    input_set: "triage variant: requester-reported subscales (reported_*); acceptance variant: clinician-verified subscales (verified_* at triage, updated_* at provide-info)"
    constants:
      TRIAGE_W: { cardio: 0.30, resp: 0.30, neuro: 0.20, interv: 0.20 }
      ACCEPTANCE_W: { cardio: 0.25, resp: 0.35, neuro: 0.25, interv: 0.15 }
      DETERIORATION_BONUS: 2.0
      DETERIORATION_WINDOW_MIN: 120
      TIER_CCT_MIN: 7.0
      TIER_ALS_MIN: 4.0
    precision: "2 decimal places, round_half_up; bonus added after rounding the weighted sum"
    variants:
      - name: triage_score
        when: "Request intake; only requester-reported values exist"
        difference: "Uses TRIAGE_W weights and reported_* subscales; no deterioration bonus; stored in triage_acuity_score"
      - name: acceptance_score
        when: "MedicalDirector triage or provide-info recompute"
        difference: "Uses ACCEPTANCE_W weights and verified/updated subscales plus deterioration bonus; identical patient data yields a different score than triage_score; stored in acceptance_acuity_score and drives acuity_tier"

  - name: weather_minimums_decision
    code: C3
    trigger: "POST /air-ambulance/weather-assessments"
    algorithm: threshold
    formula: |
      required_ceiling = BASE_CEIL[aircraft_class][day_night] + (MOUNTAIN_CEIL_BONUS if terrain == MOUNTAINOUS else 0)
      required_vis     = BASE_VIS[aircraft_class][day_night]
      NO_GO if any: precip == ICE
                    OR wind_kt > XWIND_MAX[aircraft_class]
                    OR ceiling_ft < required_ceiling
                    OR visibility_sm < required_vis
      else MARGINAL if any: precip == HEAVY
                    OR ceiling_ft < required_ceiling * MARGINAL_CEIL_FACTOR   (strictly less)
                    OR visibility_sm < required_vis + MARGINAL_VIS_PAD        (strictly less)
                    OR wind_kt > XWIND_MAX[aircraft_class] - MARGINAL_XWIND_PAD
      else GO.
      Boundary pins: ceiling == required_ceiling passes (>= semantics);
      visibility == required_vis passes; ceiling == required*1.2 exactly is GO
      (not MARGINAL); wind == XWIND_MAX passes (violation is strict >).
    input_set: "Single WeatherAssessment payload + assigned Aircraft.aircraft_class"
    constants:
      BASE_CEIL: { ROTOR_WING_DAY: 500, ROTOR_WING_NIGHT: 800, FIXED_WING_DAY: 800, FIXED_WING_NIGHT: 1200 }
      BASE_VIS: { ROTOR_WING_DAY: 1.0, ROTOR_WING_NIGHT: 3.0, FIXED_WING_DAY: 2.0, FIXED_WING_NIGHT: 3.0 }
      MOUNTAIN_CEIL_BONUS: 500
      XWIND_MAX: { ROTOR_WING: 25, FIXED_WING: 30 }
      MARGINAL_XWIND_PAD: 5
      MARGINAL_CEIL_FACTOR: 1.2
      MARGINAL_VIS_PAD: 0.5
      ASSESSMENT_TTL_MIN: 60
    precision: "visibility compared at 1 decimal place; ceiling integer feet"

  - name: invoice_aggregation_rounding
    code: C4
    trigger: "Inside mission_transport_charge at invoice creation and finalize"
    algorithm: aggregation
    formula: |
      PINNED ORDER (mode b): round each line to whole cents with round_half_up
      FIRST, then sum the rounded lines. The fuel line is computed from the
      ALREADY-ROUNDED mileage line. The logistics line is computed from the
      sum of already-rounded base/mileage/fuel/acuity lines. Summing unrounded
      values and rounding once at the end is FORBIDDEN and produces different
      cents (e.g. actual_loaded_miles 16.6666 ROTOR: pinned mileage 266666,
      fuel 18667, total-with-base 2085333; naive single-rounding yields 2085332).
    input_set: "The five charge lines of one invoice"
    constants: {}
    precision: "integer cents, round_half_up, per line then sum"

  - name: crew_duty_fatigue_window
    code: C5
    trigger: "POST /air-ambulance/crew-shifts"
    algorithm: chronological
    formula: |
      For the candidate shift S = [planned_start_iso, planned_end_iso):
      (1) Overlap: reject if any existing CrewShift of the same member
          (OPEN or CLOSED) intersects S with positive-minute intersection
          (ERR_SHIFT_OVERLAP); zero-length touching is handled by rule (2).
      (2) Rest buffer: let E = max actual/planned end of the member's shifts
          ending <= S.start; require S.start - E >= REST_MIN_MIN minutes
          (ERR_INSUFFICIENT_REST); exactly 600 minutes passes (>= inclusive).
      (3) Duty projection: window W = [S.planned_end - 24h, S.planned_end];
          projected = sum of minutes of all the member's shifts (OPEN or
          CLOSED, processed in planned_start ASC order, ties broken by
          created_at ASC) intersecting W, plus S.planned_minutes;
          require projected <= MAX_DUTY_MIN (ERR_DUTY_LIMIT_EXCEEDED);
          exactly 840 passes (<= inclusive), 841 fails.
    input_set: "All CrewShifts (OPEN and CLOSED) of the candidate member"
    constants:
      MAX_DUTY_MIN: 840
      REST_MIN_MIN: 600
      ROLLING_WINDOW_H: 24
    precision: "whole minutes"
    variants:
      - name: rolling_24h_gate
        when: "Dispatch legality gate at crew-shift creation"
        difference: "Duty minutes counted in the rolling window [planned_end - 24h, planned_end]; this is the ONLY variant that accepts/rejects a shift"
      - name: calendar_day_report
        when: "Compliance reporting view surfaced as CrewMember.duty_minutes_calendar_day"
        difference: "Duty minutes counted per UTC calendar date; a shift crossing midnight splits its minutes across two dates, so the same shift history yields a different number than the rolling window (e.g. a 20:00-08:00 shift counts 240+480 by calendar but 720 contiguous by rolling window)"

  - name: member_balance_waterfall
    code: C6
    trigger: "POST /air-ambulance/invoices/{id}/payer-response and POST /air-ambulance/invoices/{id}/member-writeoff and POST /air-ambulance/invoices/{id}/appeal (compensation zeroing)"
    algorithm: waterfall_allocation
    formula: |
      Ordered buckets over final_total_cents:
        1. insurer_paid_cents            (set by payer-response)
        2. contractual_adjustment_cents  (set by payer-response)
        3. member_writeoff_cents         (set by member-writeoff)
        4. patient_responsibility_cents  (remainder)
      Guard: paid + adjustment <= final_total_cents else ERR_LEDGER_IMBALANCE.
      patient_responsibility = final_total - paid - adjustment - writeoff >= 0.
      Appeal compensation: appeal resets insurer_paid_cents and
      contractual_adjustment_cents to 0 (the denied posting is reversed);
      member_writeoff_cents is NOT reset (write-off requires claim response).
      CONSERVED INVARIANT (holds after every posting/appeal/writeoff):
        insurer_paid + contractual_adjustment + member_writeoff
          + patient_responsibility == final_total_cents
    input_set: "Single Invoice row"
    constants:
      TIMELY_FILING_DAYS: 90
    precision: "integer cents"

  - name: logistics_surcharge_tier
    code: C7
    trigger: "Inside mission_transport_charge at invoice creation and finalize"
    algorithm: threshold
    formula: |
      Mode (c) circular-looking dependency, evaluation order pinned:
      total = subtotal + logistics_line, and logistics_line is keyed on a tier
      of the total's magnitude — RESOLVED by evaluating the tier against the
      PRE-LOGISTICS subtotal, never the post-surcharge total:
        subtotal = base + mileage + fuel + acuity  (all already rounded)
        logistics_line = round_half_up(subtotal * 4 / 100) if subtotal >= 2500000 else 0
        total = subtotal + logistics_line + ground_line
      No fixed point is computed; the threshold test reads subtotal only.
      Boundary: subtotal == 2500000 exactly triggers the surcharge (>= inclusive).
    input_set: "The four pre-logistics charge lines of one invoice"
    constants:
      LOGISTICS_THRESHOLD: 2500000
      LOGISTICS_PCT: 4
    precision: "integer cents, round_half_up"

  - name: qa_deficiency_cascade
    code: C8
    trigger: "POST /air-ambulance/patient-care-reports/{id}/qa-review with outcome FLAGGED"
    algorithm: threshold
    formula: |
      author.deficiency_points_90d = sum of deficiency_points over all
      qa-reviews with outcome FLAGGED on PCRs authored by this CrewMember
      whose review instant lies in [logical now - 90 days, logical now],
      processed in review created_at ASC order.
      On crossing: deficiency_points_90d >= REMEDIATION_THRESHOLD (>= inclusive;
      exactly 15 triggers) flips CrewMember.status ACTIVE -> REMEDIATION_HOLD,
      which itself releases that member's ASSIGNED CrewAssignments on PLANNING
      missions (see PatientCareReport machine side effects).
    input_set: "FLAGGED qa-reviews on the author's PCRs inside the rolling 90-day window"
    constants:
      REMEDIATION_THRESHOLD: 15
      WINDOW_DAYS: 90
    precision: "integer points"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# several checks fail on the same request)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles; FlightCrew ownership checks (author_crew_id == X-User-ID on PCR create/submit/amend; crew_member_id == X-User-ID on shift create/close); QaReviewer segregation: X-User-ID != author_crew_id on qa-review", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all (segregation rule returns ERR_SELF_REVIEW_FORBIDDEN on qa-review)" }
  - { priority: 3, category: existence, check: "Every id in path and body FK exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Request shape: required fields present, types correct, enum members valid, ranges respected (subscales 0-10, miles > 0, positive cents)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource in a valid from-state for the requested transition (generic off-transition rejections)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 6, category: state, check: "accept requires MissionRequest.status == TRIAGED", error_id: ERR_REQUEST_NOT_TRIAGED, http_status: 409, applies_to: ["POST /air-ambulance/mission-requests/{id}/accept"] }
  - { priority: 7, category: business_safety, check: "accept: Aircraft.medical_config rank >= request acuity_tier rank (CCT needs CCT_CAPABLE, ALS needs ALS_CAPABLE or better)", error_id: ERR_ACUITY_EXCEEDS_CONFIG, http_status: 422, applies_to: ["POST /air-ambulance/mission-requests/{id}/accept"] }
  - { priority: 8, category: business_safety, check: "accept / crew-assignment create: crew composition covers tier minimum {PILOT, NURSE} (+PARAMEDIC for CCT) with no duplicate role_in_mission on the mission", error_id: ERR_CREW_COMPOSITION_INCOMPLETE, http_status: 422, applies_to: ["POST /air-ambulance/mission-requests/{id}/accept", "POST /air-ambulance/crew-assignments"] }
  - { priority: 9, category: business_safety, check: "Referenced CrewMember.status == ACTIVE when assigned to a mission or when launching", error_id: ERR_CREW_UNAVAILABLE, http_status: 422, applies_to: ["POST /air-ambulance/mission-requests/{id}/accept", "POST /air-ambulance/crew-assignments", "POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 10, category: business_safety, check: "crew-shift create: rolling duty projection <= 840 minutes (C5; 840 passes, 841 fails)", error_id: ERR_DUTY_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /air-ambulance/crew-shifts"] }
  - { priority: 11, category: business_safety, check: "crew-shift create: >= 600 minutes rest since the member's latest prior shift end (exactly 600 passes)", error_id: ERR_INSUFFICIENT_REST, http_status: 422, applies_to: ["POST /air-ambulance/crew-shifts"] }
  - { priority: 12, category: business_safety, check: "launch/resume: newest WeatherAssessment exists and is fresh (<= 60 min); decision GO required (MARGINAL allowed at PLANNING launch only when alternate_destination filed)", error_id: ERR_BELOW_WEATHER_MINIMUMS, http_status: 422, applies_to: ["POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 13, category: business_safety, check: "launch: decision MARGINAL but alternate_destination null", error_id: ERR_ALTERNATE_REQUIRED, http_status: 422, applies_to: ["POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 14, category: business_safety, check: "launch/resume: newest assessment older than 60 minutes", error_id: ERR_WEATHER_ASSESSMENT_STALE, http_status: 422, applies_to: ["POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 15, category: business_referential, check: "accept: aircraft not in MAINTENANCE; launch: mission's aircraft still bound and not MAINTENANCE", error_id: ERR_AIRCRAFT_NOT_AVAILABLE, http_status: 409, applies_to: ["POST /air-ambulance/missions/{id}/advance", "POST /air-ambulance/mission-requests/{id}/accept"] }
  - { priority: 16, category: business_referential, check: "invoice finalize / PCR submit: owning Mission COMPLETED", error_id: ERR_MISSION_NOT_COMPLETED, http_status: 409, applies_to: ["POST /air-ambulance/invoices/{id}/finalize", "POST /air-ambulance/patient-care-reports/{id}/submit"] }
  - { priority: 17, category: business_referential, check: "invoice submit: mission's PatientCareReport QA_APPROVED", error_id: ERR_PCR_NOT_APPROVED, http_status: 422, applies_to: ["POST /air-ambulance/invoices/{id}/submit"] }
  - { priority: 18, category: business_referential, check: "launch of INTERNATIONAL_REPATRIATION: case READY_TO_FLY", error_id: ERR_REPATRIATION_NOT_READY, http_status: 422, applies_to: ["POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 19, category: business_temporal, check: "accept: half-open aircraft occupancy windows on the same tail must not overlap; endpoint-touching adjacency allowed", error_id: ERR_AIRCRAFT_SCHEDULE_CONFLICT, http_status: 409, applies_to: ["POST /air-ambulance/mission-requests/{id}/accept"] }
  - { priority: 20, category: business_temporal, check: "crew-shift create: candidate window must not overlap any existing shift of the member (positive-minute intersection); rest rule at priority 11 applies separately", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: ["POST /air-ambulance/crew-shifts"] }
  - { priority: 21, category: business_temporal, check: "invoice submit within 90 days of mission completion date (inclusive)", error_id: ERR_TIMELY_FILING_EXPIRED, http_status: 422, applies_to: ["POST /air-ambulance/invoices/{id}/submit"] }
  - { priority: 22, category: business_temporal, check: "PCR submit within 24h of mission completion (inclusive)", error_id: ERR_PCR_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /air-ambulance/patient-care-reports/{id}/submit"] }
  - { priority: 23, category: business_temporal, check: "repatriation verify: PASSPORT/VISA unexpired, FIT_TO_FLY <= 72h old (inclusive); launch-gate revalidation demotes stale cases", error_id: ERR_DOC_EXPIRED, http_status: 422, applies_to: ["POST /air-ambulance/repatriation-cases/{id}/verify", "POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 24, category: business_temporal, check: "membership reinstatement within 30 days of lapse (inclusive)", error_id: ERR_REINSTATE_WINDOW_EXPIRED, http_status: 422, applies_to: ["PUT /air-ambulance/memberships/{id}"] }
  - { priority: 25, category: business_temporal, check: "member-writeoff eligibility snapshot: membership ACTIVE and effective_from <= mission completion date", error_id: ERR_MEMBERSHIP_NOT_ELIGIBLE, http_status: 422, applies_to: ["POST /air-ambulance/invoices/{id}/member-writeoff"] }
  - { priority: 26, category: business_constraint, check: "repatriation verify: all four document types present", error_id: ERR_DOCS_INCOMPLETE, http_status: 422, applies_to: ["POST /air-ambulance/repatriation-cases/{id}/verify"] }
  - { priority: 27, category: business_constraint, check: "uniqueness: one Invoice per mission, one RepatriationCase per mission, one PatientCareReport per mission, one Mission per request", error_id: ERR_DUPLICATE_INVOICE, http_status: 409, applies_to: ["POST /air-ambulance/invoices", "POST /air-ambulance/repatriation-cases", "POST /air-ambulance/patient-care-reports", "POST /air-ambulance/mission-requests/{id}/accept"], note: "error_id respectively ERR_DUPLICATE_INVOICE / ERR_DUPLICATE_REPATRIATION_CASE / ERR_DUPLICATE_PCR / ERR_REQUEST_NOT_TRIAGED (accepted request leaves TRIAGED)" }
  - { priority: 28, category: business_fiscal, check: "launch of SCHEDULED_INTERFACILITY / INTERNATIONAL_REPATRIATION without APPROVED or PARTIAL InsuranceAuthorization and no emergency_override", error_id: ERR_AUTH_REQUIRED, http_status: 422, applies_to: ["POST /air-ambulance/missions/{id}/advance"] }
  - { priority: 29, category: business_fiscal, check: "payer-response: paid + adjustment <= final_total_cents", error_id: ERR_LEDGER_IMBALANCE, http_status: 422, applies_to: ["POST /air-ambulance/invoices/{id}/payer-response"] }
  - { priority: 30, category: business_fiscal, check: "appeal: appeal_count < 2", error_id: ERR_APPEAL_LIMIT, http_status: 422, applies_to: ["POST /air-ambulance/invoices/{id}/appeal"] }
  - { priority: 31, category: business_fiscal, check: "OCC: expected_*_version equals current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /air-ambulance/weather-assessments", "POST /air-ambulance/patient-care-reports/{id}/amend"] }
  - { priority: 32, category: state, check: "mission completion: every non-CANCELLED ground leg COMPLETED", error_id: ERR_GROUND_LEGS_PENDING, http_status: 409, applies_to: ["POST /air-ambulance/missions/{id}/advance"] }

# =============================================================================
# §1.5 API Endpoint Table (flat: FK in body, filter lists; actions on /{id})
# =============================================================================
endpoints:
  # --- Base / fleet / crew administration ---
  - { method: POST, path: "/air-ambulance/bases", description: "Create an operations base", roles: [OpsAdmin], code: 201, input: [name, region], output: Base, side_effects: [] }
  - { method: GET, path: "/air-ambulance/bases/{id}", description: "Read a base", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: Base, side_effects: [] }
  - { method: POST, path: "/air-ambulance/aircraft", description: "Register an aircraft at a base", roles: [OpsAdmin], code: 201, input: [base_id, tail_number, aircraft_class, medical_config], output: Aircraft, side_effects: ["status := AVAILABLE"] }
  - { method: GET, path: "/air-ambulance/aircraft/{id}", description: "Read an aircraft", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: Aircraft, side_effects: [] }
  - { method: GET, path: "/air-ambulance/aircraft", description: "List aircraft with filters and pagination", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["base_id?", "status?", "limit?", "offset?"], output: "Aircraft[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/aircraft/{id}", description: "Set aircraft status MAINTENANCE <-> AVAILABLE (ASSIGNED is system-owned)", roles: [OpsAdmin], code: 200, input: [status], output: Aircraft, side_effects: ["Aircraft.version += 1"] }
  - { method: POST, path: "/air-ambulance/crew-members", description: "Onboard a crew member", roles: [OpsAdmin], code: 201, input: [base_id, full_name, crew_role], output: CrewMember, side_effects: ["status := ACTIVE", "deficiency_points_90d := 0"] }
  - { method: GET, path: "/air-ambulance/crew-members/{id}", description: "Read a crew member", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: CrewMember, side_effects: [] }
  - { method: GET, path: "/air-ambulance/crew-members", description: "List crew members with filters and pagination", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["base_id?", "status?", "crew_role?", "limit?", "offset?"], output: "CrewMember[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/crew-members/{id}", description: "Set crew member status (ACTIVE <-> REMEDIATION_HOLD clears hold; ACTIVE <-> INACTIVE)", roles: [OpsAdmin], code: 200, input: [status], output: CrewMember, side_effects: ["CrewMember.version += 1"] }
  - { method: POST, path: "/air-ambulance/crew-shifts", description: "Plan a duty shift; runs C5 overlap/rest/duty checks", roles: [OpsAdmin, FlightCrew], code: 201, input: [crew_member_id, planned_start_iso, planned_end_iso], output: CrewShift, side_effects: ["C5 crew_duty_fatigue_window evaluation"] }
  - { method: GET, path: "/air-ambulance/crew-shifts/{id}", description: "Read a crew shift", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: CrewShift, side_effects: [] }
  - { method: GET, path: "/air-ambulance/crew-shifts", description: "List crew shifts (reverse FK to CrewMember)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["crew_member_id?", "status?", "limit?", "offset?"], output: "CrewShift[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/crew-shifts/{id}", description: "Close an open shift; actual_end_iso := logical now", roles: [OpsAdmin, FlightCrew], code: 200, input: [status], output: CrewShift, side_effects: ["actual_end_iso := logical now", "CrewShift.version += 1"] }
  # --- Patients & membership program ---
  - { method: POST, path: "/air-ambulance/patients", description: "Register a patient", roles: [Dispatcher], code: 201, input: [full_name, date_of_birth, weight_kg], output: Patient, side_effects: [] }
  - { method: GET, path: "/air-ambulance/patients/{id}", description: "Read a patient", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: Patient, side_effects: [] }
  - { method: POST, path: "/air-ambulance/memberships", description: "Enroll a patient in the membership program (balance-billing protection)", roles: [BillingSpecialist], code: 201, input: [patient_id, tier, effective_from], output: MembershipSubscription, side_effects: ["status := ACTIVE"] }
  - { method: GET, path: "/air-ambulance/memberships/{id}", description: "Read a membership", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: MembershipSubscription, side_effects: [] }
  - { method: GET, path: "/air-ambulance/memberships", description: "List memberships (reverse FK to Patient)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["patient_id?", "status?", "limit?", "offset?"], output: "MembershipSubscription[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/memberships/{id}", description: "Lapse / reinstate / terminate a membership", roles: [BillingSpecialist], code: 200, input: [status], output: MembershipSubscription, side_effects: ["lapse sets lapsed_at; reinstate clears it", "MembershipSubscription.version += 1"] }
  # --- Mission intake, triage, acceptance ---
  - { method: POST, path: "/air-ambulance/mission-requests", description: "Intake a transport request; computes triage_acuity_score (C2 triage variant)", roles: [Dispatcher], code: 201, input: [patient_id, transport_class, origin_facility, destination_facility, "destination_country?", reported_cardio, reported_resp, reported_neuro, reported_interventions, onset_iso], output: MissionRequest, side_effects: ["C2 triage variant -> triage_acuity_score", "status := RECEIVED"] }
  - { method: GET, path: "/air-ambulance/mission-requests/{id}", description: "Read a mission request", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: MissionRequest, side_effects: [] }
  - { method: GET, path: "/air-ambulance/mission-requests", description: "List mission requests (reverse FK to Patient) with pagination", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["patient_id?", "status?", "limit?", "offset?"], output: "MissionRequest[]", side_effects: [] }
  - { method: POST, path: "/air-ambulance/mission-requests/{id}/triage", description: "MedicalDirector clinical triage; computes acceptance score + tier (C2 acceptance variant)", roles: [MedicalDirector], code: 200, input: [verified_cardio, verified_resp, verified_neuro, verified_interventions, "emergency_override?"], output: MissionRequest, side_effects: ["C2 acceptance variant -> acceptance_acuity_score, acuity_tier", "status RECEIVED -> TRIAGED"] }
  - { method: POST, path: "/air-ambulance/mission-requests/{id}/request-info", description: "Send the request back for more information (TRIAGED -> PENDING_INFO)", roles: [MedicalDirector], code: 200, input: [info_note], output: MissionRequest, side_effects: [] }
  - { method: POST, path: "/air-ambulance/mission-requests/{id}/provide-info", description: "Supply updated clinicals (PENDING_INFO -> TRIAGED); recomputes acceptance score", roles: [Dispatcher], code: 200, input: [updated_cardio, updated_resp, updated_neuro, updated_interventions, info_note], output: MissionRequest, side_effects: ["C2 acceptance variant recompute -> acceptance_acuity_score, acuity_tier"] }
  - { method: POST, path: "/air-ambulance/mission-requests/{id}/accept", description: "Accept a TRIAGED request: creates Mission (PLANNING), assigns aircraft + crew", roles: [Dispatcher], code: 201, input: [aircraft_id, crew, estimated_loaded_miles, planned_launch_iso, planned_duration_min, "alternate_destination?"], output: Mission, side_effects: ["MissionRequest TRIAGED -> ACCEPTED", "Aircraft AVAILABLE -> ASSIGNED (window overlap check)", "CrewAssignment rows created ASSIGNED", "snapshots transport_class, acuity_tier, destination_facility"] }
  - { method: POST, path: "/air-ambulance/mission-requests/{id}/decline", description: "Decline a request on clinical grounds", roles: [MedicalDirector], code: 200, input: [reason], output: MissionRequest, side_effects: ["status -> DECLINED"] }
  # --- Mission execution ---
  - { method: GET, path: "/air-ambulance/missions/{id}", description: "Read a mission (includes computed ground_coordination_status)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: Mission, side_effects: [] }
  - { method: GET, path: "/air-ambulance/missions", description: "List missions (reverse FKs to MissionRequest, Aircraft)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_request_id?", "aircraft_id?", "status?", "limit?", "offset?"], output: "Mission[]", side_effects: [] }
  - { method: POST, path: "/air-ambulance/missions/{id}/advance", description: "Advance flight state: LAUNCHED | WEATHER_HOLD | AT_PATIENT | IN_TRANSIT | AT_DESTINATION | COMPLETED per Mission machine gates", roles: [Dispatcher, FlightCrew], code: 200, input: [to_state], output: Mission, side_effects: ["launch gates: weather freshness/decision, alternate on MARGINAL, auth gate, repatriation gate", "COMPLETED releases aircraft + assignments, consumes beds, stamps completed_at"] }
  - { method: POST, path: "/air-ambulance/missions/{id}/abort", description: "Abort (post-launch) or cancel (PLANNING) with reason; fires release cascades", roles: [Dispatcher, FlightCrew], code: 200, input: [reason_code], output: Mission, side_effects: ["aircraft -> AVAILABLE", "assignments -> RELEASED", "ground legs SCHEDULED/ENROUTE -> CANCELLED", "cancelled DESTINATION legs release linked beds (hop 2)"] }
  - { method: POST, path: "/air-ambulance/missions/{id}/divert", description: "Divert to an alternate facility (IN_TRANSIT -> DIVERTED); fires bed/ground cascades", roles: [FlightCrew], code: 200, input: [new_destination_facility, reason], output: Mission, side_effects: ["destination_facility rewritten", "mismatched beds RELEASED (hop 1)", "linked DESTINATION legs CANCELLED (hop 2)", "ground_coordination_status recomputed (hop 3)"] }
  - { method: POST, path: "/air-ambulance/weather-assessments", description: "File a weather assessment for a mission (OCC on Mission.version); computes decision (C3)", roles: [FlightCrew], code: 201, input: [mission_id, ceiling_ft, visibility_sm, wind_kt, precip, day_night, terrain, expected_mission_version], output: WeatherAssessment, side_effects: ["C3 weather_minimums_decision -> decision", "Mission.last_weather_decision := decision", "increments Mission.version by 1"] }
  - { method: GET, path: "/air-ambulance/weather-assessments/{id}", description: "Read a weather assessment", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: WeatherAssessment, side_effects: [] }
  - { method: GET, path: "/air-ambulance/weather-assessments", description: "List weather assessments (reverse FK to Mission)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "decision?", "limit?", "offset?"], output: "WeatherAssessment[]", side_effects: [] }
  - { method: POST, path: "/air-ambulance/crew-assignments", description: "Add a crew member to a PLANNING mission", roles: [Dispatcher], code: 201, input: [mission_id, crew_member_id, role_in_mission], output: CrewAssignment, side_effects: ["mission must be PLANNING", "member must be ACTIVE", "role must not duplicate an ASSIGNED role on the mission"] }
  - { method: GET, path: "/air-ambulance/crew-assignments/{id}", description: "Read a crew assignment", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: GET, path: "/air-ambulance/crew-assignments", description: "List crew assignments (reverse FKs to Mission, CrewMember)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "crew_member_id?", "status?", "limit?", "offset?"], output: "CrewAssignment[]", side_effects: [] }
  # --- Bed-to-bed coordination ---
  - { method: POST, path: "/air-ambulance/ground-legs", description: "Coordinate a ground ambulance leg for a mission", roles: [Dispatcher], code: 201, input: [mission_id, leg_type, provider_name, scheduled_pickup_iso, "estimated_ground_miles?", "bed_reservation_id?"], output: GroundTransportLeg, side_effects: ["mission must be non-terminal", "ground_coordination_status recomputed"] }
  - { method: GET, path: "/air-ambulance/ground-legs/{id}", description: "Read a ground leg", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: GroundTransportLeg, side_effects: [] }
  - { method: GET, path: "/air-ambulance/ground-legs", description: "List ground legs (reverse FKs to Mission, BedReservation)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "bed_reservation_id?", "status?", "limit?", "offset?"], output: "GroundTransportLeg[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/ground-legs/{id}", description: "Advance or cancel a ground leg (SCHEDULED->ENROUTE->AT_BEDSIDE->COMPLETED; cancel from SCHEDULED/ENROUTE)", roles: [Dispatcher], code: 200, input: [status], output: GroundTransportLeg, side_effects: ["cancel of DESTINATION leg releases linked bed", "ground_coordination_status recomputed"] }
  - { method: POST, path: "/air-ambulance/bed-reservations", description: "Hold a receiving-facility bed for a mission", roles: [Dispatcher], code: 201, input: [mission_id, facility_name, bed_type, hold_until_iso], output: BedReservation, side_effects: ["mission must be non-terminal", "status := HELD"] }
  - { method: GET, path: "/air-ambulance/bed-reservations/{id}", description: "Read a bed reservation", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: BedReservation, side_effects: [] }
  - { method: GET, path: "/air-ambulance/bed-reservations", description: "List bed reservations (reverse FK to Mission)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "status?", "limit?", "offset?"], output: "BedReservation[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/bed-reservations/{id}", description: "Confirm or release a bed hold", roles: [Dispatcher], code: 200, input: [status], output: BedReservation, side_effects: ["BedReservation.version += 1"] }
  # --- Insurance authorization vs emergency billing ---
  - { method: POST, path: "/air-ambulance/insurance-authorizations", description: "Request payer authorization for a mission", roles: [BillingSpecialist], code: 201, input: [mission_id, payer_name, policy_number], output: InsuranceAuthorization, side_effects: ["status := REQUESTED"] }
  - { method: GET, path: "/air-ambulance/insurance-authorizations/{id}", description: "Read an authorization", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: InsuranceAuthorization, side_effects: [] }
  - { method: GET, path: "/air-ambulance/insurance-authorizations", description: "List authorizations (reverse FK to Mission)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "status?", "limit?", "offset?"], output: "InsuranceAuthorization[]", side_effects: [] }
  - { method: PUT, path: "/air-ambulance/insurance-authorizations/{id}", description: "Decide or appeal an authorization (REQUESTED->APPROVED/PARTIAL/DENIED; DENIED->APPEALED; APPEALED->APPROVED/DENIED)", roles: [BillingSpecialist], code: 200, input: [status, "approved_amount_cents?"], output: InsuranceAuthorization, side_effects: ["InsuranceAuthorization.version += 1"] }
  # --- Billing / membership write-off ---
  - { method: POST, path: "/air-ambulance/invoices", description: "Create the mission invoice; computes provisional totals (C1 provisional + C4 + C7)", roles: [BillingSpecialist], code: 201, input: [mission_id], output: Invoice, side_effects: ["C1 provisional_quote + C4 rounding + C7 tier -> line fields + provisional_total_cents", "claim_status := DRAFT", "member_adjustment_status := UNEVALUATED"] }
  - { method: GET, path: "/air-ambulance/invoices/{id}", description: "Read an invoice (all lines, totals, ledger fields)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/air-ambulance/invoices", description: "List invoices (reverse FKs to Mission, MembershipSubscription)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "membership_id?", "claim_status?", "member_adjustment_status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/air-ambulance/invoices/{id}/finalize", description: "Enter actual loaded miles; computes final totals (C1 final + C4 + C7) and evaluates member dimension", roles: [BillingSpecialist], code: 200, input: [actual_loaded_miles], output: Invoice, side_effects: ["C1 final_settlement + C4 + C7 -> final_total_cents", "claim_status DRAFT -> FINALIZED", "member dimension: MEMBER_PROTECTED (bind membership_id) or NON_MEMBER"] }
  - { method: POST, path: "/air-ambulance/invoices/{id}/submit", description: "Submit claim to payer (from FINALIZED -> SUBMITTED or APPEALED -> RESUBMITTED); gates: PCR QA_APPROVED, 90-day timely filing", roles: [BillingSpecialist], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/air-ambulance/invoices/{id}/payer-response", description: "Post payer adjudication; C6 waterfall updates ledger; NON_MEMBER auto -> BALANCE_BILLED", roles: [BillingSpecialist], code: 200, input: [outcome, paid_cents, contractual_adjustment_cents], output: Invoice, side_effects: ["C6 member_balance_waterfall", "claim_status -> PAID | PARTIALLY_PAID | DENIED", "member dim NON_MEMBER -> BALANCE_BILLED"] }
  - { method: POST, path: "/air-ambulance/invoices/{id}/appeal", description: "Appeal a denial (cap 2); compensation zeroes paid/adjustment", roles: [BillingSpecialist], code: 200, input: [], output: Invoice, side_effects: ["appeal_count += 1", "insurer_paid_cents := 0", "contractual_adjustment_cents := 0", "claim_status DENIED -> APPEALED"] }
  - { method: POST, path: "/air-ambulance/invoices/{id}/member-writeoff", description: "Apply membership balance-billing protection: write off residual patient responsibility", roles: [BillingSpecialist], code: 200, input: [], output: Invoice, side_effects: ["C6 waterfall: member_writeoff_cents := patient_responsibility_cents; patient_responsibility_cents := 0", "member dim MEMBER_PROTECTED -> WRITEOFF_POSTED"] }
  # --- International repatriation ---
  - { method: POST, path: "/air-ambulance/repatriation-cases", description: "Open a repatriation documentation case for an INTERNATIONAL_REPATRIATION mission", roles: [Dispatcher], code: 201, input: [mission_id, destination_country, receiving_facility], output: RepatriationCase, side_effects: ["status := COLLECTING"] }
  - { method: GET, path: "/air-ambulance/repatriation-cases/{id}", description: "Read a repatriation case", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: RepatriationCase, side_effects: [] }
  - { method: GET, path: "/air-ambulance/repatriation-cases", description: "List repatriation cases (reverse FK to Mission)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "status?", "limit?", "offset?"], output: "RepatriationCase[]", side_effects: [] }
  - { method: POST, path: "/air-ambulance/repatriation-cases/{id}/documents", description: "Append a travel/clinical document to the case", roles: [Dispatcher], code: 201, input: [doc_type, document_number, issued_iso, "expires_iso?"], output: RepatriationCase, side_effects: ["documents array appended", "RepatriationCase.version += 1"] }
  - { method: POST, path: "/air-ambulance/repatriation-cases/{id}/verify", description: "Verify document completeness/validity; COLLECTING -> READY_TO_FLY", roles: [MedicalDirector], code: 200, input: [], output: RepatriationCase, side_effects: ["doc completeness check (ERR_DOCS_INCOMPLETE)", "doc validity check (ERR_DOC_EXPIRED)"] }
  # --- Clinical record & QA ---
  - { method: POST, path: "/air-ambulance/patient-care-reports", description: "Author the mission's clinical record (one per mission)", roles: [FlightCrew], code: 201, input: [mission_id, author_crew_id, vitals_summary, interventions_summary, meds_summary], output: PatientCareReport, side_effects: ["author_crew_id must equal X-User-ID", "status := DRAFT"] }
  - { method: GET, path: "/air-ambulance/patient-care-reports/{id}", description: "Read a clinical record", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: [], output: PatientCareReport, side_effects: [] }
  - { method: GET, path: "/air-ambulance/patient-care-reports", description: "List clinical records (reverse FKs to Mission, CrewMember)", roles: [OpsAdmin, Dispatcher, MedicalDirector, FlightCrew, BillingSpecialist, QaReviewer], code: 200, input: ["mission_id?", "author_crew_id?", "status?", "limit?", "offset?"], output: "PatientCareReport[]", side_effects: [] }
  - { method: POST, path: "/air-ambulance/patient-care-reports/{id}/submit", description: "Submit for QA (DRAFT/AMENDED -> SUBMITTED); gates: mission COMPLETED, 24h window", roles: [FlightCrew], code: 200, input: [], output: PatientCareReport, side_effects: ["submitted_at := logical now"] }
  - { method: POST, path: "/air-ambulance/patient-care-reports/{id}/qa-review", description: "QA adjudication APPROVED/FLAGGED with deficiency points; segregation of duties enforced; C8 cascade on FLAGGED", roles: [QaReviewer], code: 200, input: [outcome, deficiency_points], output: PatientCareReport, side_effects: ["C8 qa_deficiency_cascade on FLAGGED: author points +=, threshold -> REMEDIATION_HOLD -> assignment release"] }
  - { method: POST, path: "/air-ambulance/patient-care-reports/{id}/amend", description: "Amend a QA_FLAGGED record (OCC on PCR version)", roles: [FlightCrew], code: 200, input: [expected_patient_care_report_version, "vitals_summary?", "interventions_summary?", "meds_summary?"], output: PatientCareReport, side_effects: ["QA_FLAGGED -> AMENDED", "increments PatientCareReport.version by 1"] }
  # --- Test-driving clock ---
  - { method: POST, path: "/air-ambulance/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default before any set call: 2026-08-01T00:00:00Z; never falls back to wall-clock", roles: [OpsAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or FlightCrew ownership check failed (PCR author / shift owner)" }
  - { id: ERR_SELF_REVIEW_FORBIDDEN, http: 403, condition: "QaReviewer X-User-ID equals the PCR author_crew_id (segregation of duties)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK references a non-existent resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, invalid enum member, out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_REQUEST_NOT_TRIAGED, http: 409, condition: "accept called on a MissionRequest whose status != TRIAGED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_ACUITY_EXCEEDS_CONFIG, http: 422, condition: "Aircraft medical_config rank below the request's acuity_tier rank" }
  - { id: ERR_CREW_COMPOSITION_INCOMPLETE, http: 422, condition: "Assigned crew roles do not cover the tier minimum {PILOT, NURSE} (+PARAMEDIC for CCT), or a role is duplicated" }
  - { id: ERR_CREW_UNAVAILABLE, http: 422, condition: "Referenced crew member not ACTIVE at assignment or launch" }
  - { id: ERR_DUTY_LIMIT_EXCEEDED, http: 422, condition: "Projected rolling-24h duty minutes would exceed 840 (> 840 fails; == 840 passes)" }
  - { id: ERR_INSUFFICIENT_REST, http: 422, condition: "Less than 600 minutes rest since the member's latest prior shift end (== 600 passes)" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Candidate shift window intersects an existing shift of the same member with positive-minute overlap" }
  - { id: ERR_BELOW_WEATHER_MINIMUMS, http: 422, condition: "Launch/resume with no weather assessment, or latest assessment decision NO_GO" }
  - { id: ERR_ALTERNATE_REQUIRED, http: 422, condition: "Launch with latest decision MARGINAL and no alternate_destination filed" }
  - { id: ERR_WEATHER_ASSESSMENT_STALE, http: 422, condition: "Newest assessment older than 60 minutes at launch/resume" }
  - { id: ERR_AIRCRAFT_NOT_AVAILABLE, http: 409, condition: "Aircraft not AVAILABLE at accept, or no longer ASSIGNED to this mission at launch" }
  - { id: ERR_AIRCRAFT_SCHEDULE_CONFLICT, http: 409, condition: "Half-open planned occupancy window overlaps another non-terminal mission on the same tail" }
  - { id: ERR_AUTH_REQUIRED, http: 422, condition: "SCHEDULED_INTERFACILITY / INTERNATIONAL_REPATRIATION launch without APPROVED/PARTIAL authorization and no emergency_override" }
  - { id: ERR_REPATRIATION_NOT_READY, http: 422, condition: "INTERNATIONAL_REPATRIATION launch without a READY_TO_FLY repatriation case" }
  - { id: ERR_MISSION_NOT_COMPLETED, http: 409, condition: "Invoice finalize or PCR submit before the mission is COMPLETED" }
  - { id: ERR_PCR_NOT_APPROVED, http: 422, condition: "Invoice submit while the mission's PCR is not QA_APPROVED" }
  - { id: ERR_PCR_WINDOW_EXPIRED, http: 422, condition: "PCR submit later than 24h after mission completion (== 24h passes)" }
  - { id: ERR_TIMELY_FILING_EXPIRED, http: 422, condition: "Claim submit later than 90 days after the completion date (== 90 days passes)" }
  - { id: ERR_LEDGER_IMBALANCE, http: 422, condition: "payer-response paid + adjustment exceeds final_total_cents" }
  - { id: ERR_APPEAL_LIMIT, http: 422, condition: "Appeal attempted when appeal_count >= 2" }
  - { id: ERR_MEMBERSHIP_NOT_ELIGIBLE, http: 422, condition: "member-writeoff when member dimension is not MEMBER_PROTECTED (non-member, lapsed, or effective_from after completion date)" }
  - { id: ERR_REINSTATE_WINDOW_EXPIRED, http: 422, condition: "Membership reinstatement more than 30 days after lapse (== 30 days passes)" }
  - { id: ERR_DOCS_INCOMPLETE, http: 422, condition: "Repatriation verify without all four document types present" }
  - { id: ERR_DOC_EXPIRED, http: 422, condition: "PASSPORT/VISA expired or FIT_TO_FLY older than 72h at verify or launch-gate revalidation" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "Second invoice for the same mission" }
  - { id: ERR_DUPLICATE_REPATRIATION_CASE, http: 409, condition: "Second repatriation case for the same mission" }
  - { id: ERR_DUPLICATE_PCR, http: 409, condition: "Second patient care report for the same mission" }
  - { id: ERR_GROUND_LEGS_PENDING, http: 409, condition: "Mission completion while a non-CANCELLED ground leg is not COMPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Operations administrator: fleet/base/crew registry, crew status, logical clock"
    identity: opaque
    exclusive_operations: ["POST /air-ambulance/bases", "POST /air-ambulance/aircraft", "PUT /air-ambulance/aircraft/{id}", "POST /air-ambulance/crew-members", "PUT /air-ambulance/crew-members/{id}", "POST /air-ambulance/_clock/set_current_utc"]
    shared_operations: ["POST /air-ambulance/crew-shifts", "PUT /air-ambulance/crew-shifts/{id}", "all GET endpoints"]
  - name: Dispatcher
    description: "Communications-center dispatcher: intake, coordination, acceptance logistics"
    identity: opaque
