# =============================================================================
# SCAFFOLD.yaml — Flight Dispatch & Release Management (airline dispatch center)
# =============================================================================

scenario: |
  1172. Flight Dispatch & Release Management (airline dispatch center): flight plan & route optimization with weather/wind, fuel calculation & alternate airport selection, weight and balance & payload optimization, MEL/CDL item impact on release, dispatcher/captain joint responsibility & signature, en-route monitoring & diversion recommendation, delay/cancel decision & operational control record, dispatch workload & desk assignment

domain_name: flight-dispatch-release
api_prefix: /dispatch

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: iata_code, type: string, source: input, description: "Unique airport IATA code", constraints: "unique across all stations" }
      - { name: runway_length_m, type: integer, source: input, description: "Longest available runway in meters" }
      - { name: alternate_distance_nm, type: integer, source: input, description: "Distance in NM from the arrival station being planned for, used when this station is evaluated as an alternate candidate" }
      - { name: min_ceiling_ft, type: integer, source: input, description: "Minimum legal ceiling in feet for releases naming this station as destination" }
      - { name: min_visibility_m, type: integer, source: input, description: "Minimum legal visibility in meters for releases naming this station as destination" }
      - { name: status, type: enum, source: input, default: OPEN, description: "OPEN | CLOSED — CLOSED stations are excluded from alternate selection and divert targets", constraints: "enum: OPEN, CLOSED" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_no, type: string, source: input, description: "Unique tail registration", constraints: "unique across all aircraft" }
      - { name: type_code, type: string, source: input, description: "Aircraft type code, e.g. A320" }
      - { name: oew_kg, type: integer, source: input, description: "Operating empty weight in kg" }
      - { name: mzfw_kg, type: integer, source: input, description: "Maximum zero-fuel weight in kg" }
      - { name: mtow_kg, type: integer, source: input, description: "Maximum takeoff weight in kg" }
      - { name: mlw_kg, type: integer, source: input, description: "Maximum landing weight in kg" }
      - { name: fuel_capacity_kg, type: integer, source: input, description: "Maximum usable fuel in kg" }
      - { name: cruise_tas_kts, type: integer, source: input, description: "True airspeed in knots used for all time/fuel estimates" }
      - { name: burn_kg_per_hour, type: integer, source: input, description: "Base cruise fuel burn in kg per hour at reference zero-fuel weight" }
      - { name: min_runway_m, type: integer, source: input, description: "Minimum runway length in meters this type requires" }
      - { name: lemac_m, type: number, source: input, description: "Leading edge of mean aerodynamic chord in meters, for CG %MAC" }
      - { name: mac_m, type: number, source: input, description: "Mean aerodynamic chord length in meters, for CG %MAC" }

  - name: Dispatcher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dispatcher full name" }
      - { name: license_no, type: string, source: input, description: "Unique dispatcher license number; doubles as person identity for segregation-of-duties checks", constraints: "unique across all dispatchers" }
      - { name: max_active_legs, type: integer, source: input, default: 6, description: "Maximum number of legs with ops_status in {SCHEDULED, DEPARTED} that may be assigned to this dispatcher" }
      - { name: workload_leg_count, type: integer, source: computed, description: "Flat workload variant: count of FlightLeg with dispatcher_id == this dispatcher and ops_status IN {SCHEDULED, DEPARTED}" }
      - { name: weighted_load_score, type: integer, source: computed, description: "Departure-weighted workload variant: sum over the same leg set of tier weight by hours from current clock to sched_dep_utc: <=2h -> 3, <=6h -> 2, else 1" }

  - name: Captain
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Captain full name" }
      - { name: license_no, type: string, source: input, description: "Unique captain license number; doubles as person identity for segregation-of-duties checks", constraints: "unique across all captains" }
      - { name: qualified_type_codes, type: array, source: input, description: "Aircraft type codes this captain is type-rated on" }

  - name: Desk
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique desk code", constraints: "unique across all desks" }
      - { name: region, type: string, source: input, description: "Geographic region the desk covers" }
      - { name: max_dispatchers, type: integer, source: input, description: "Maximum dispatchers whose shifts may cover any single instant at this desk" }
      - { name: active_shift_count, type: integer, source: computed, description: "Count of DeskShift rows with desk_id == this desk whose window covers the current clock (half-open [start, end))" }
      - { name: free_slots, type: integer, source: computed, description: "= max_dispatchers - active_shift_count" }

  - name: DeskShift
    parent: null
    common_fields: true
    fields:
      - { name: dispatcher_id, type: string, source: input, description: "FK -> Dispatcher.id; dispatcher working this shift" }
      - { name: desk_id, type: string, source: input, description: "FK -> Desk.id; desk worked; server-selected via desk_auto_select when omitted on create" }
      - { name: shift_start_utc, type: datetime, source: input, description: "Shift window start (inclusive)" }
      - { name: shift_end_utc, type: datetime, source: input, description: "Shift window end (exclusive)" }
      - { name: status, type: enum, source: computed, description: "Derived from the logical clock: now < start -> PLANNED; start <= now < end -> ACTIVE; now >= end -> ENDED", constraints: "enum: PLANNED, ACTIVE, ENDED" }

  - name: FlightLeg
    parent: null
    common_fields: true
    fields:
      - { name: flight_no, type: string, source: input, description: "Published flight number" }
      - { name: dep_station_id, type: string, source: input, description: "FK -> Station.id; departure station" }
      - { name: arr_station_id, type: string, source: input, description: "FK -> Station.id; scheduled arrival station" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; assigned tail" }
      - { name: captain_id, type: string, source: input, description: "FK -> Captain.id; pilot in command" }
      - { name: dispatcher_id, type: string, source: input, description: "FK -> Dispatcher.id; dispatcher of record; server-selected via dispatcher_auto_select when omitted on create" }
      - { name: diverted_from_leg_id, type: string, source: system, description: "FK -> FlightLeg.id; set only on continuation legs created by POST /dispatch/legs/{id}/divert; null otherwise", constraints: "nullable" }
      - { name: distance_nm, type: integer, source: input, description: "Planned great-circle route distance in NM" }
      - { name: sched_dep_utc, type: datetime, source: input, description: "Current scheduled departure (mutated by delay)" }
      - { name: sched_arr_utc, type: datetime, source: input, description: "Current scheduled arrival (mutated by delay)" }
      - { name: actual_dep_utc, type: datetime, source: system, description: "Wheels-up time recorded on depart; null until DEPARTED", constraints: "nullable" }
      - { name: ops_status, type: enum, source: system, description: "SCHEDULED -> DEPARTED -> ARRIVED | DIVERTED; SCHEDULED -> CANCELLED", constraints: "enum: SCHEDULED, DEPARTED, ARRIVED, DIVERTED, CANCELLED" }
      - { name: monitor_status, type: enum, source: system, description: "Parallel dimension: UNMONITORED -> MONITORING <-> ALERTED -> CLOSED", constraints: "enum: UNMONITORED, MONITORING, ALERTED, CLOSED" }
      - { name: delay_count, type: integer, source: system, default: 0, description: "Number of accepted delay decisions on this leg" }

  - name: FlightPlan
    parent: null
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: input, description: "FK -> FlightLeg.id; leg this plan belongs to" }
      - { name: plan_seq, type: integer, source: system, description: "Per-leg monotone sequence, starts at 1, incremented on each POST /dispatch/plans for the leg" }
      - { name: route_code, type: string, source: input, description: "Route string, e.g. 'DCT KLOSE DCT'" }
      - { name: cruise_altitude_ft, type: integer, source: input, description: "Planned cruise altitude" }
      - { name: forecast_wind_kts, type: integer, source: input, description: "Forecast average wind component in knots; positive = tailwind" }
      - { name: wind_assumption, type: enum, source: input, description: "FORECAST = use forecast_wind_kts; WORST_CASE = assume 50 kt headwind regardless of forecast", constraints: "enum: FORECAST, WORST_CASE" }
      - { name: status, type: enum, source: system, description: "COMPUTED -> LOCKED -> COMPUTED (recompute cycle); COMPUTED | LOCKED -> SUPERSEDED", constraints: "enum: COMPUTED, LOCKED, SUPERSEDED" }
      - { name: ground_speed_kts, type: integer, source: computed, description: "= cruise_tas_kts + effective wind component for the chosen assumption" }
      - { name: trip_time_min, type: integer, source: computed, description: "= round_half_up(distance_nm / ground_speed_kts * 60, 0)" }
      - { name: burn_eff_kg_per_hour, type: integer, source: computed, description: "Weight-adjusted burn per weight_adjusted_burn calculation" }
      - { name: trip_fuel_kg, type: integer, source: computed, description: "Per trip_fuel calculation (round_half_up to 1 kg)" }
      - { name: mel_fuel_penalty_kg, type: integer, source: computed, description: "= round_half_up(trip_fuel_exact * sum of fuel_penalty_pct over OPEN MelCdlItem on the aircraft / 100)" }
      - { name: contingency_kg, type: integer, source: computed, description: "= round_half_up(max(0.05 * penalized trip fuel exact, MIN_CONTINGENCY_KG))" }
      - { name: alternate_fuel_kg, type: integer, source: computed, description: "= round_half_up(selected alternate distance / cruise_tas_kts * burn_eff exact)" }
      - { name: final_reserve_kg, type: integer, source: computed, description: "= round_half_up(burn_eff exact * FINAL_RESERVE_H)" }
      - { name: required_fuel_kg, type: integer, source: computed, description: "= round_half_up(penalized trip exact + contingency exact + alternate exact + reserve exact); single final rounding per required_fuel calculation" }
      - { name: alternate_station_id, type: string, source: computed, description: "FK -> Station.id; alternate chosen by alternate_selection at compute/recompute time", constraints: "nullable" }

  - name: PayloadManifest
    parent: null
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: input, description: "FK -> FlightLeg.id; one non-terminal manifest per leg" }
      - { name: plan_id, type: string, source: system, description: "FK -> FlightPlan.id; the LOCKED plan whose fuel figures were frozen into this manifest's weight checks at last write" }
      - { name: pax_count, type: integer, source: input, description: "Passenger count" }
      - { name: bags_count, type: integer, source: input, description: "Checked bag count" }
      - { name: cargo_kg, type: number, source: input, description: "Cargo weight in kg, may carry one decimal" }
      - { name: pax_weight_kg, type: integer, source: computed, description: "= round_half_up(pax_count * PAX_KG)" }
      - { name: baggage_kg, type: integer, source: computed, description: "= round_half_up(bags_count * BAG_KG)" }
      - { name: cargo_billed_kg, type: integer, source: computed, description: "= round_half_up(cargo_kg)" }
      - { name: total_payload_kg, type: integer, source: computed, description: "= pax_weight_kg + baggage_kg + cargo_billed_kg (component-first rounding, pinned in manifest_weight_rollup)" }
      - { name: zero_fuel_weight_kg, type: integer, source: computed, description: "= aircraft.oew_kg + total_payload_kg" }
      - { name: takeoff_weight_kg, type: integer, source: computed, description: "= zero_fuel_weight_kg + pinned plan.required_fuel_kg" }
      - { name: landing_weight_kg, type: integer, source: computed, description: "= takeoff_weight_kg - pinned penalized trip fuel (plan.trip_fuel_kg + plan.mel_fuel_penalty_kg)" }
      - { name: cg_percent_mac, type: number, source: computed, description: "Center of gravity in %MAC, 2 decimals round_half_up, per cg_percent_mac calculation" }
      - { name: max_payload_kg, type: integer, source: computed, description: "Single-pass payload envelope per max_payload_envelope calculation, using the pinned plan's fuel figures" }

  - name: MelCdlItem
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; deferred defect is on this tail" }
      - { name: item_code, type: string, source: input, description: "MEL/CDL item reference code" }
      - { name: category, type: enum, source: input, description: "MEL | CDL", constraints: "enum: MEL, CDL" }
      - { name: deferral_category, type: enum, source: input, description: "Repair interval class: A <= 1 day, B <= 3 days, C <= 10 days, D <= 30 days from creation clock", constraints: "enum: A, B, C, D" }
      - { name: fuel_penalty_pct, type: number, source: input, default: 0, description: "Percent penalty applied to trip fuel while this item is OPEN" }
      - { name: payload_penalty_kg, type: integer, source: input, default: 0, description: "Weight in kg subtracted from max_payload_kg while this item is OPEN" }
      - { name: minima_bump, type: boolean, source: input, default: false, description: "When OPEN, destination minima rise by ALT_MINIMA_BUMP_CEILING_FT / ALT_MINIMA_BUMP_VIS_M" }
      - { name: repair_deadline_utc, type: datetime, source: input, description: "Repair deadline; item auto-expires when the logical clock passes it" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLEARED | EXPIRED", constraints: "enum: OPEN, CLEARED, EXPIRED" }

  - name: WeatherPackage
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station this observation/forecast covers" }
      - { name: valid_from_utc, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_to_utc, type: datetime, source: input, description: "Validity window end (exclusive); half-open [from, to) semantics" }
      - { name: ceiling_ft, type: integer, source: input, description: "Forecast/observed ceiling in feet" }
      - { name: visibility_m, type: integer, source: input, description: "Forecast/observed visibility in meters" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUPERSEDED (via replace)", constraints: "enum: ACTIVE, SUPERSEDED" }

  - name: FlightRelease
    parent: null
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: input, description: "FK -> FlightLeg.id; released leg" }
      - { name: plan_id, type: string, source: system, description: "FK -> FlightPlan.id; the LOCKED plan this release was created against" }
      - { name: dispatcher_id, type: string, source: system, description: "FK -> Dispatcher.id; snapshot of leg.dispatcher_id at creation — the accountable dispatcher" }
      - { name: captain_id, type: string, source: system, description: "FK -> Captain.id; snapshot of leg.captain_id at creation — the accountable captain" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_SIGNATURES -> RELEASED -> UNDER_AMENDMENT -> PENDING_SIGNATURES (amendment cycle); DRAFT | PENDING_SIGNATURES | UNDER_AMENDMENT -> CANCELLED; RELEASED -> CLOSED", constraints: "enum: DRAFT, PENDING_SIGNATURES, RELEASED, UNDER_AMENDMENT, CANCELLED, CLOSED" }
      - { name: cycle_seq, type: integer, source: system, default: 1, description: "Signature cycle; incremented on recall, amend, and every auto-amendment cascade; a ReleaseSignature is valid iff its cycle_seq equals the release's current cycle_seq" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Number of RELEASED -> UNDER_AMENDMENT transitions (manual or cascade)" }

  - name: ReleaseSignature
    parent: null
    common_fields: false
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> FlightRelease.id; release this signature applies to" }
      - { name: signer_role, type: enum, source: system, description: "DISPATCHER | CAPTAIN — derived from the caller's X-User-Role", constraints: "enum: DISPATCHER, CAPTAIN" }
      - { name: signer_id, type: string, source: system, description: "Caller's X-User-ID (Dispatcher.id or Captain.id)" }
      - { name: cycle_seq, type: integer, source: system, description: "Release cycle_seq at signing time; signature is valid iff it equals the release's current cycle_seq" }
      - { name: signed_at_utc, type: datetime, source: system, description: "Logical clock at signing" }

  - name: OperationalControlRecord
    parent: null
    common_fields: false
    fields:
      - { name: leg_id, type: string, source: system, description: "FK -> FlightLeg.id; leg this record belongs to" }
      - { name: release_id, type: string, source: system, description: "FlightRelease id when the action pertains to a release, else null (plain field, not an FK)", constraints: "nullable" }
      - { name: actor_role, type: enum, source: system, description: "Dispatcher | Captain | DispatchSupervisor | system", constraints: "enum: Dispatcher, Captain, DispatchSupervisor, system" }
      - { name: actor_id, type: string, source: system, description: "Caller's X-User-ID, or 'system'", constraints: "nullable" }
      - { name: action, type: enum, source: system, description: "LEG_CREATED | DELAY_DECISION | CANCEL_DECISION | DEPARTURE | ARRIVAL | DIVERSION | RELEASE_CREATED | RELEASE_SUBMITTED | SIGNATURE_RECORDED | RELEASE_RECALLED | RELEASE_AMENDED | RELEASE_AUTO_AMENDED | DIVERT_RECOMMENDED | MEL_EXPIRED", constraints: "enum: LEG_CREATED, DELAY_DECISION, CANCEL_DECISION, DEPARTURE, ARRIVAL, DIVERSION, RELEASE_CREATED, RELEASE_SUBMITTED, SIGNATURE_RECORDED, RELEASE_RECALLED, RELEASE_AMENDED, RELEASE_AUTO_AMENDED, DIVERT_RECOMMENDED, MEL_EXPIRED" }
      - { name: from_status, type: string, source: system, description: "Status before the action (entity-dependent), null when not applicable", constraints: "nullable" }
      - { name: to_status, type: string, source: system, description: "Status after the action, null when not applicable", constraints: "nullable" }
      - { name: note, type: string, source: system, description: "Free-form note, e.g. delay reason", constraints: "nullable" }
      - { name: recorded_at_utc, type: datetime, source: system, description: "Logical clock when recorded" }

  - name: MonitoringEvent
    parent: null
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: input, description: "FK -> FlightLeg.id; leg being monitored" }
      - { name: fuel_remaining_kg, type: integer, source: input, description: "Reported fuel on board at observation time" }
      - { name: eta_destination_utc, type: datetime, source: input, description: "Current estimated time of arrival at the scheduled destination" }
      - { name: dest_ceiling_ft, type: integer, source: input, description: "Latest destination ceiling report, feet; omit when unchanged", constraints: "nullable" }
      - { name: dest_visibility_m, type: integer, source: input, description: "Latest destination visibility report, meters; omit when unchanged", constraints: "nullable" }
      - { name: projected_arrival_fuel_kg, type: integer, source: computed, description: "= fuel_remaining_kg - remaining trip estimate (see fuel_margin_recommendation)" }
      - { name: fuel_margin_kg, type: integer, source: computed, description: "= projected_arrival_fuel_kg - pinned plan.final_reserve_kg" }
      - { name: recommendation, type: enum, source: computed, description: "NONE | CONSIDER_DIVERT | RECOMMEND_DIVERT per fuel_margin_recommendation thresholds and destination weather", constraints: "enum: NONE, CONSIDER_DIVERT, RECOMMEND_DIVERT" }
      - { name: status, type: enum, source: system, description: "OPEN -> ACKNOWLEDGED", constraints: "enum: OPEN, ACKNOWLEDGED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FlightLeg
    field: ops_status
    initial_state: SCHEDULED
    terminal_states: [ARRIVED, DIVERTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /dispatch/legs/{legId}/depart"
        actor: Dispatcher
        preconditions:
          - "caller is leg.assigned dispatcher (ERR_NOT_ASSIGNED_DISPATCHER)"
          - "a FlightRelease for this leg exists with status RELEASED (ERR_INVALID_STATE)"
          - "an ACTIVE DeskShift for leg.dispatcher_id covers the current clock on any desk (ERR_NO_ACTIVE_SHIFT)"
          - "no MelCdlItem on leg.aircraft_id has status EXPIRED (ERR_MEL_ITEM_EXPIRED)"
        side_effects:
          - "actual_dep_utc := current clock"
          - "monitor_status: UNMONITORED -> MONITORING"
          - "write OperationalControlRecord(action=DEPARTURE)"
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /dispatch/legs/{legId}/arrive"
        actor: Dispatcher
        preconditions:
          - "caller is leg.assigned dispatcher (ERR_NOT_ASSIGNED_DISPATCHER)"
        side_effects:
          - "monitor_status -> CLOSED"
          - "FlightRelease for this leg: RELEASED -> CLOSED (other non-terminal states -> CANCELLED)"
          - "dispatcher workload_leg_count and weighted_load_score drop this leg"
          - "write OperationalControlRecord(action=ARRIVAL)"
      - from: DEPARTED
        to: DIVERTED
        trigger: "POST /dispatch/legs/{legId}/divert"
        actor: "Dispatcher or Captain"
        preconditions:
          - "divert_station_id references a Station with status OPEN (ERR_INVALID_STATE)"
          - "divert_station_id != leg.arr_station_id and != leg.dep_station_id (ERR_INVALID_REQUEST)"
        side_effects:
          - "monitor_status -> CLOSED"
          - "create continuation FlightLeg: ops_status=SCHEDULED, monitor_status=UNMONITORED, diverted_from_leg_id=this leg, dep_station_id=divert target, arr_station_id/aircraft_id/captain_id/dispatcher_id copied, distance_nm/sched_dep_utc/sched_arr_utc from request"
          - "any non-terminal FlightRelease for this leg -> CANCELLED"
          - "write OperationalControlRecord(action=DIVERSION) on both legs"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dispatch/legs/{legId}/cancel"
        actor: Dispatcher
        preconditions:
          - "caller is leg.assigned dispatcher (ERR_NOT_ASSIGNED_DISPATCHER)"
        side_effects:
          - "any non-terminal FlightRelease for this leg -> CANCELLED"
          - "dispatcher workload_leg_count and weighted_load_score drop this leg"
          - "write OperationalControlRecord(action=CANCEL_DECISION)"

  - entity: FlightLeg
    field: monitor_status
    initial_state: UNMONITORED
    terminal_states: [CLOSED]
    transitions:
      - from: UNMONITORED
        to: MONITORING
        trigger: "system (on SCHEDULED -> DEPARTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MONITORING
        to: ALERTED
        trigger: "system (a MonitoringEvent is created with recommendation IN {CONSIDER_DIVERT, RECOMMEND_DIVERT})"
        actor: system
        preconditions: []
        side_effects:
          - "when recommendation == RECOMMEND_DIVERT: write OperationalControlRecord(action=DIVERT_RECOMMENDED)"
      - from: ALERTED
        to: MONITORING
        trigger: "POST /dispatch/monitoring-events/{eventId}/acknowledge"
        actor: Dispatcher
        preconditions:
          - "event.status == OPEN (ERR_INVALID_STATE)"
          - "fires only when, after this acknowledge, no other MonitoringEvent for the same leg remains with status OPEN and recommendation != NONE (sibling-state-dependent)"
        side_effects: []
      - from: MONITORING
        to: CLOSED
        trigger: "system (on DEPARTED -> ARRIVED or DEPARTED -> DIVERTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALERTED
        to: CLOSED
        trigger: "system (on DEPARTED -> ARRIVED or DEPARTED -> DIVERTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FlightPlan
    field: status
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: LOCKED
        trigger: "POST /dispatch/plans/{planId}/lock"
        actor: Dispatcher
        preconditions:
          - "caller is the dispatcher assigned to plan.leg_id (ERR_NOT_ASSIGNED_DISPATCHER)"
          - "an ACTIVE WeatherPackage for the leg's arrival station covers the current sched_arr_utc (ERR_WEATHER_NOT_CURRENT)"
          - "that package's ceiling/visibility meet the arrival station minima (plus MEL minima bump when any OPEN MelCdlItem with minima_bump exists on the aircraft) (ERR_WEATHER_BELOW_MINIMA)"
          - "required_fuel_kg <= aircraft.fuel_capacity_kg (ERR_FUEL_EXCEEDS_CAPACITY)"
        side_effects: []
      - from: LOCKED
        to: COMPUTED
        trigger: "POST /dispatch/plans/{planId}/recompute, or system cascade from weather_revalidation"
        actor: "Dispatcher or system"
        preconditions:
          - "manual recompute: caller is the dispatcher assigned to plan.leg_id (ERR_NOT_ASSIGNED_DISPATCHER)"
        side_effects:
          - "re-derive every computed field per current OPEN MelCdlItem set, current alternate_selection pool, and the stored wind_assumption (recompute keeps the same route_code/cruise_altitude_ft/forecast_wind_kts/wind_assumption inputs)"
          - "weight reference zfw_ref now uses the current manifest's total_payload_kg when a manifest exists (manifest created after first compute changes burn_eff_kg_per_hour on recompute)"
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system (a newer FlightPlan is created for the same leg)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system (a newer FlightPlan is created for the same leg — only reachable when no non-terminal FlightRelease references this plan)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FlightRelease
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURES
        trigger: "POST /dispatch/releases/{releaseId}/submit"
        actor: Dispatcher
        preconditions:
          - "caller == release.dispatcher_id (ERR_NOT_ASSIGNED_DISPATCHER)"
          - "release.plan_id refers to a FlightPlan with status LOCKED (ERR_PLAN_NOT_LOCKED)"
          - "a PayloadManifest exists for release.leg_id (ERR_MANIFEST_MISSING) and all fiscal weight checks pass against the pinned plan (ERR_MZFW_EXCEEDED / ERR_MTOW_EXCEEDED / ERR_MLW_EXCEEDED / ERR_CG_OUT_OF_ENVELOPE / ERR_PAYLOAD_EXCEEDS_LIMIT)"
          - "no MelCdlItem on the leg's aircraft has status EXPIRED (ERR_MEL_ITEM_EXPIRED)"
          - "an ACTIVE WeatherPackage for the arrival station covers current sched_arr_utc and meets minima (ERR_WEATHER_NOT_CURRENT / ERR_WEATHER_BELOW_MINIMA)"
          - "plan.required_fuel_kg <= aircraft.fuel_capacity_kg (ERR_FUEL_EXCEEDS_CAPACITY)"
        side_effects:
          - "write OperationalControlRecord(action=RELEASE_SUBMITTED)"
      - from: UNDER_AMENDMENT
        to: PENDING_SIGNATURES
        trigger: "POST /dispatch/releases/{releaseId}/submit"
        actor: Dispatcher
        preconditions:
          - "same preconditions as DRAFT -> PENDING_SIGNATURES, all re-evaluated against current world state"
        side_effects:
          - "write OperationalControlRecord(action=RELEASE_SUBMITTED)"
      - from: PENDING_SIGNATURES
        to: RELEASED
        trigger: "system (after a POST /dispatch/releases/{id}/sign leaves both a valid DISPATCHER and a valid CAPTAIN ReleaseSignature with cycle_seq == release.cycle_seq)"
        actor: system
        preconditions: []
        side_effects:
          - "dispatcher of record becomes jointly responsible with captain; write OperationalControlRecord(action=SIGNATURE_RECORDED) was already written by sign"
      - from: PENDING_SIGNATURES
        to: DRAFT
        trigger: "POST /dispatch/releases/{releaseId}/recall"
        actor: Dispatcher
        preconditions:
          - "caller == release.dispatcher_id (ERR_NOT_ASSIGNED_DISPATCHER)"
        side_effects:
          - "cycle_seq += 1 (all existing signatures become stale)"
          - "write OperationalControlRecord(action=RELEASE_RECALLED)"
      - from: RELEASED
        to: UNDER_AMENDMENT
        trigger: "POST /dispatch/releases/{releaseId}/amend, or system cascade (delay_auto_amend, weather_revalidation, mel_expiry_sweep)"
        actor: "Dispatcher or system"
        preconditions:
          - "manual amend: caller == release.dispatcher_id (ERR_NOT_ASSIGNED_DISPATCHER)"
        side_effects:
          - "cycle_seq += 1 (all existing signatures become stale)"
          - "amendment_count += 1"
          - "write OperationalControlRecord(action=RELEASE_AMENDED or RELEASE_AUTO_AMENDED)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /dispatch/legs/{legId}/cancel cascade, or POST /dispatch/legs/{legId}/divert cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_SIGNATURES
        to: CANCELLED
        trigger: "POST /dispatch/legs/{legId}/cancel or divert cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_AMENDMENT
        to: CANCELLED
        trigger: "POST /dispatch/legs/{legId}/cancel or divert cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: CLOSED
        trigger: "system (on leg DEPARTED -> ARRIVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /dispatch/legs/{legId}/divert cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_SIGNATURES
        to: DRAFT
        trigger: "system cascade (weather_revalidation or mel_expiry_sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "cycle_seq += 1 (all existing signatures become stale)"
          - "write OperationalControlRecord(action=RELEASE_AUTO_AMENDED)"

  - entity: MelCdlItem
    field: status
    initial_state: OPEN
    terminal_states: [CLEARED, EXPIRED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /dispatch/mel-items/{itemId}/clear"
        actor: DispatchSupervisor
        preconditions: []
        side_effects:
          - "item stops contributing fuel_penalty_pct / payload_penalty_kg / minima_bump to all calculations from this point on"
      - from: OPEN
        to: EXPIRED
        trigger: "system (POST /dispatch/_clock/set_current_utc sweep: repair_deadline_utc < new clock)"
        actor: system
        preconditions: []
        side_effects:
          - "for every FlightLeg with this aircraft and ops_status IN {SCHEDULED, DEPARTED}: a non-terminal FlightRelease in status RELEASED -> UNDER_AMENDMENT (cycle_seq += 1, amendment_count += 1); status PENDING_SIGNATURES -> DRAFT (cycle_seq += 1)"
          - "write OperationalControlRecord(action=MEL_EXPIRED) per affected leg"

  - entity: WeatherPackage
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /dispatch/weather-packages/{packageId}/replace"
        actor: DispatchSupervisor
        preconditions: []
        side_effects:
          - "replacement package created with status ACTIVE"
          - "weather_revalidation cascade runs for LOCKED plans of legs arriving at this station"

  - entity: MonitoringEvent
    field: status
    initial_state: OPEN
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /dispatch/monitoring-events/{eventId}/acknowledge"
        actor: Dispatcher
        preconditions:
          - "caller is the dispatcher assigned to the event's leg (ERR_NOT_ASSIGNED_DISPATCHER)"
        side_effects:
          - "leg monitor_status ALERTED -> MONITORING when no other OPEN alerting event remains for the leg"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-leg
    parent_entity: FlightLeg
    write_endpoint: "POST /dispatch/plans"
    occ_field: expected_leg_version
    description: |
      Creating a FlightPlan against a FlightLeg whose version has advanced
      since the client last observed it is rejected. A plan creation
      legitimately supersedes the leg's current non-SUPERSEDED plan, so a
      writer working from a stale leg view (e.g. another dispatcher just
      created plan N+1, or a delay bumped the schedule) must be forced to
      re-read before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: weather-replace-stale-station
    parent_entity: Station
    write_endpoint: "POST /dispatch/weather-packages/{packageId}/replace"
    occ_field: expected_station_version
    description: |
      Replacing a WeatherPackage of a Station whose version has advanced
      since the client last observed it is rejected. A replacement
      legitimately supersedes the target package (latest forecast wins), so
      a forecaster whose view of the station predates another create/replace
      must re-read before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All rounding is decimal round_half_up. "rhu(x)" = round_half_up to 1 kg.
# =============================================================================
calculations:
  - name: weight_adjusted_burn
    trigger: "FlightPlan create (POST /dispatch/plans) and recompute"
    algorithm: threshold
    formula: |
      zfw_ref = aircraft.oew_kg + (manifest.total_payload_kg of the leg's manifest if one exists, else 0)
      steps = ceil(zfw_ref / WEIGHT_STEP_KG)          # ceil(50000/10000)=5; ceil(50001/10000)=6
      burn_eff_exact = aircraft.burn_kg_per_hour * (1 + steps * WEIGHT_STEP_PCT)
      burn_eff_kg_per_hour = rhu(burn_eff_exact)
    input_set: "Aircraft of the leg; the leg's current PayloadManifest when present (any total_payload_kg)"
    constants:
      WEIGHT_STEP_KG: 10000
      WEIGHT_STEP_PCT: 0.01
    precision: "integer kg/h, round_half_up; steps computed with exact ceil (50000 exactly -> 5 steps)"

  - name: trip_fuel
    trigger: "FlightPlan create and recompute"
    algorithm: forward_looking
    formula: |
      wind_eff = forecast_wind_kts                        # variant FORECAST
      wind_eff = -WORST_HEADWIND_KTS                      # variant WORST_CASE
      ground_speed_kts = aircraft.cruise_tas_kts + wind_eff
      trip_time_min = rhu(distance_nm / ground_speed_kts * 60, 0)
      trip_exact = (distance_nm / ground_speed_kts) * burn_eff_exact
      mel_pct = sum(fuel_penalty_pct of MelCdlItem where aircraft_id == leg.aircraft_id AND status == OPEN)
      trip_fuel_kg = rhu(trip_exact)                       # unpenalized, exposed on the plan
      mel_fuel_penalty_kg = rhu(trip_exact * mel_pct / 100)
      penalized_trip_exact = trip_exact * (1 + mel_pct / 100)
    input_set: "Leg distance_nm; aircraft cruise/burn; OPEN MelCdlItem rows for the aircraft at compute time (CLEARED/EXPIRED excluded)"
    constants:
      WORST_HEADWIND_KTS: 50
    precision: "integer kg, round_half_up; penalized_trip_exact kept unrounded for required_fuel"
    variants:
      - name: forecast_wind
        when: "wind_assumption == FORECAST (rejected at create when any OPEN MelCdlItem with fuel_penalty_pct > 0 exists — ERR_WORST_CASE_REQUIRED)"
        difference: "uses the client-supplied forecast_wind_kts; ground_speed = tas + forecast_wind_kts"
      - name: worst_case_wind
        when: "wind_assumption == WORST_CASE (mandatory when any OPEN MelCdlItem has fuel_penalty_pct > 0)"
        difference: "ignores forecast_wind_kts; ground_speed = tas - 50; for identical legs yields strictly more trip fuel than forecast_wind whenever forecast_wind_kts > -50"

  - name: required_fuel
    trigger: "FlightPlan create and recompute (after trip_fuel)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a) combinatorial: >= 3 inputs, nested max, conditional MEL branch.
      contingency_exact = max(0.05 * penalized_trip_exact, MIN_CONTINGENCY_KG)
      contingency_kg = rhu(contingency_exact)
      alternate_exact = (alternate.alternate_distance_nm / aircraft.cruise_tas_kts) * burn_eff_exact
      alternate_fuel_kg = rhu(alternate_exact)
      reserve_exact = burn_eff_exact * FINAL_RESERVE_H
      final_reserve_kg = rhu(reserve_exact)
      required_fuel_kg = rhu(penalized_trip_exact + contingency_exact + alternate_exact + reserve_exact)
      # PINNED: contingency is computed on the PENALIZED trip; a single final
      # rounding is applied to required_fuel_kg (no intermediate rounding feeds it).
    input_set: "penalized trip from trip_fuel; selected alternate Station; aircraft burn/capacity; OPEN MelCdlItem rows"
    constants:
      MIN_CONTINGENCY_KG: 100
      CONTINGENCY_PCT: 0.05
      FINAL_RESERVE_H: 0.5
    precision: "integer kg, round_half_up; exactly one rounding at the final sum"

  - name: manifest_weight_rollup
    trigger: "PayloadManifest create (POST /dispatch/manifests) and update (PUT /dispatch/manifests/{id})"
    algorithm: aggregation
    formula: |
      # Mode (b) nested rounding — order PINNED: round each component first, then sum.
      pax_weight_kg   = rhu(pax_count * PAX_KG)
      baggage_kg      = rhu(bags_count * BAG_KG)
      cargo_billed_kg = rhu(cargo_kg)
      total_payload_kg = pax_weight_kg + baggage_kg + cargo_billed_kg
      # (Component-first differs from sum-then-round: pax 1, bags 1, cargo 0.4 -> 101, not 100.)
      zero_fuel_weight_kg = aircraft.oew_kg + total_payload_kg
      takeoff_weight_kg   = zero_fuel_weight_kg + plan.required_fuel_kg          # pinned plan fuel
      landing_weight_kg   = takeoff_weight_kg - (plan.trip_fuel_kg + plan.mel_fuel_penalty_kg)
    input_set: "Manifest inputs; the leg's LOCKED FlightPlan pinned at write time (manifest.plan_id)"
    constants:
      PAX_KG: 87.5
      BAG_KG: 12.5
    precision: "integer kg; components rounded half_up to 1 kg BEFORE summing"

  - name: max_payload_envelope
    trigger: "PayloadManifest create/update (with manifest_weight_rollup)"
    algorithm: constraint_propagation
    formula: |
      # Mode (c) circular-looking dependency PINNED to a single pass:
      #   fuel figures come ONLY from the pinned LOCKED plan (frozen);
      #   payload limits are then derived; payload changes NEVER re-derive fuel
      #   inside this calculation — an explicit plan recompute + re-lock is the
      #   only way to refresh them (derived-field reconciliation is explicit).
      mel_payload_penalty = sum(payload_penalty_kg of OPEN MelCdlItem on the aircraft)
      max_payload_kg = min(
          aircraft.mzfw_kg - aircraft.oew_kg,
          aircraft.mtow_kg - aircraft.oew_kg - plan.required_fuel_kg,
          aircraft.mlw_kg  - aircraft.oew_kg - (plan.required_fuel_kg - plan.trip_fuel_kg - plan.mel_fuel_penalty_kg)
      ) - mel_payload_penalty
      # Validations: zero_fuel_weight_kg <= mzfw_kg (ERR_MZFW_EXCEEDED);
      #   takeoff_weight_kg <= mtow_kg (ERR_MTOW_EXCEEDED);
      #   landing_weight_kg <= mlw_kg (ERR_MLW_EXCEEDED);
      #   total_payload_kg <= max_payload_kg (ERR_PAYLOAD_EXCEEDS_LIMIT, boundary: equality is ACCEPTED).
    input_set: "Aircraft limits; pinned plan fuel figures; OPEN MelCdlItem payload penalties"
    precision: "integer kg"

  - name: cg_percent_mac
    trigger: "PayloadManifest create/update"
    algorithm: weighted_scoring
    formula: |
      moment = oew_kg*ARM_OEW + pax_weight_kg*ARM_PAX + baggage_kg*ARM_BAG
               + cargo_billed_kg*ARM_CARGO + plan.required_fuel_kg*ARM_FUEL
      arm = moment / takeoff_weight_kg
      cg_percent_mac = rhu(((arm - aircraft.lemac_m) / aircraft.mac_m) * 100, 2)
      envelope = [CG_MIN_NORMAL, CG_MAX_NORMAL]
      if any OPEN MelCdlItem with category == CDL exists on the aircraft:
          envelope = [CG_MIN_CDL, CG_MAX_CDL]      # conditional narrowing
      cg_percent_mac < envelope.min or > envelope.max -> ERR_CG_OUT_OF_ENVELOPE
      # Boundary: exactly on a bound is ACCEPTED (inclusive envelope).
    input_set: "Manifest rounded components; pinned plan fuel; aircraft lemac/mac; OPEN CDL items"
    constants:
      ARM_OEW: 18.0
      ARM_PAX: 17.6
      ARM_BAG: 18.4
      ARM_CARGO: 19.5
      ARM_FUEL: 18.1
      CG_MIN_NORMAL: 20.0
      CG_MAX_NORMAL: 31.0
      CG_MIN_CDL: 22.0
      CG_MAX_CDL: 30.0
    precision: "2 decimal places, round_half_up"

  - name: alternate_selection
    trigger: "FlightPlan create and recompute"
    algorithm: weighted_scoring
    formula: |
      # Selector policy — all four elements pinned:
      eligibility: Station s where s.status == OPEN
                   AND s.id NOT IN {leg.dep_station_id, leg.arr_station_id}
                   AND s.alternate_distance_nm <= MAX_ALTERNATE_DISTANCE_NM
                   AND s.runway_length_m >= aircraft.min_runway_m
      ranking:     alternate_distance_nm ASC
      tie-break:   created_at ASC (never id)
      empty pool:  reject plan creation with ERR_NO_SUITABLE_ALTERNATE
      selected station becomes plan.alternate_station_id
    input_set: "All Station rows; the leg; the aircraft"
    constants:
      MAX_ALTERNATE_DISTANCE_NM: 200

  - name: fuel_margin_recommendation
    trigger: "MonitoringEvent create (POST /dispatch/monitoring-events)"
    algorithm: threshold
    formula: |
      plan = the FlightPlan referenced by the leg's release (pinned at release creation);
             remaining_estimate = (eta_destination_utc - current_clock) in hours * plan.burn_eff_kg_per_hour (exact)
      projected_arrival_fuel_kg = rhu(fuel_remaining_kg - remaining_estimate)
      fuel_margin_kg = projected_arrival_fuel_kg - plan.final_reserve_kg
      fuel_rec:  fuel_margin_kg >= DIVERT_MARGIN_KG        -> NONE
                 0 <= fuel_margin_kg < DIVERT_MARGIN_KG    -> CONSIDER_DIVERT
                 fuel_margin_kg < 0                        -> RECOMMEND_DIVERT
      weather_rec: if dest_ceiling_ft < required_ceiling OR dest_visibility_m < required_vis -> RECOMMEND_DIVERT
                   else NONE
                   (required_* = arrival station minima + ALT_MINIMA_BUMP_* when any OPEN
                    MelCdlItem with minima_bump exists on the aircraft; omitted event
                    weather fields are treated as above-minima)
      recommendation = the more severe of fuel_rec and weather_rec (NONE < CONSIDER_DIVERT < RECOMMEND_DIVERT)
      # Boundary pinned: margin exactly 500 -> NONE; exactly 0 -> CONSIDER_DIVERT; -1 -> RECOMMEND_DIVERT.
    input_set: "Event inputs; pinned plan of the leg's release; arrival Station minima; OPEN MelCdlItem minima bumps"
    constants:
      DIVERT_MARGIN_KG: 500
      ALT_MINIMA_BUMP_CEILING_FT: 200
      ALT_MINIMA_BUMP_VIS_M: 500
    precision: "integer kg, round_half_up"

  - name: dispatcher_workload
    trigger: "computed on read of Dispatcher; leg create/cancel/arrive/divert; release-independent (leg-based)"
    algorithm: aggregation
    formula: |
      leg_set = FlightLeg where dispatcher_id == D AND ops_status IN {SCHEDULED, DEPARTED}
      flat variant:  workload_leg_count = count(leg_set)
      weighted variant: weighted_load_score = sum over leg_set of tier,
        tier = 3 when hours(clock -> sched_dep_utc) <= 2
               2 when 2 < hours <= 6
               1 when hours > 6
      # Dual variant: identical leg set, two algorithms, different scalar results
      # (e.g. legs departing +1h and +10h -> flat 2, weighted 4).
    input_set: "FlightLeg rows of the dispatcher in ops_status {SCHEDULED, DEPARTED}; logical clock"
    variants:
      - name: flat_count
        when: "capacity gate on leg create and auto-select eligibility (reject/exclude when workload_leg_count >= max_active_legs; boundary: == max rejects)"
        difference: "unweighted count"
      - name: departure_weighted
        when: "tie-break inside dispatcher_auto_select and desk load ranking inside desk_auto_select"
        difference: "tiered urgency weighting by hours-to-departure; differs from flat_count whenever the leg set is non-homogeneous in time"

  - name: dispatcher_auto_select
    trigger: "POST /dispatch/legs when dispatcher_id is omitted"
    algorithm: weighted_scoring
    formula: |
      eligibility: Dispatcher d with an ACTIVE DeskShift (window covers current clock, any desk)
                   AND d.workload_leg_count < d.max_active_legs
      ranking:     workload_leg_count ASC
      tie-break:   weighted_load_score ASC, then created_at ASC (never id)
      empty pool:  ERR_NO_DISPATCHER_AVAILABLE
    input_set: "All dispatchers, their shifts, current clock"

  - name: desk_auto_select
    trigger: "POST /dispatch/desk-shifts when desk_id is omitted"
    algorithm: weighted_scoring
    formula: |
      eligibility: Desk k where k.active_shift_count < k.max_dispatchers
      ranking:     sum of weighted_load_score over dispatchers holding an ACTIVE shift at k, ASC
                   (empty desk scores 0)
      tie-break:   created_at ASC (never id)
      empty pool:  ERR_NO_DESK_AVAILABLE
      # Capacity boundary: overlapping-window shift count == max_dispatchers -> desk ineligible.
    input_set: "All desks, ACTIVE DeskShift rows, dispatcher weighted scores"

  - name: mel_expiry_sweep
    trigger: "POST /dispatch/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      for each MelCdlItem with status == OPEN AND repair_deadline_utc < new_clock,
      ordered by repair_deadline_utc ASC, tie-break created_at ASC (never id):
        item -> EXPIRED
        cascade per MelCdlItem state machine (releases auto-amend / roll back to DRAFT,
        OperationalControlRecord(action=MEL_EXPIRED) per affected leg)
      # CLEARED items never expire: the sweep only touches OPEN rows.
    input_set: "OPEN MelCdlItem rows past deadline"

  - name: delay_auto_amend
    trigger: "POST /dispatch/legs/{legId}/delay (after leg times update)"
    algorithm: threshold
    formula: |
      delay_minutes = (new_dep_utc - previous sched_dep_utc) in whole minutes
      if delay_minutes >= DELAY_REVIEW_THRESHOLD_MIN and the leg's FlightRelease is RELEASED:
          release -> UNDER_AMENDMENT (cycle_seq += 1, amendment_count += 1,
          OperationalControlRecord(action=RELEASE_AUTO_AMENDED))
      # Boundary pinned: exactly 60 minutes triggers (>=); 59 does not.
      # Cascade chain: delay mutates FlightLeg (1) -> release auto-amends (2)
      # -> cycle_seq bump invalidates the release's existing signatures (3).
    input_set: "The delayed leg and its non-terminal release"
    constants:
      DELAY_REVIEW_THRESHOLD_MIN: 60

  - name: weather_revalidation
    trigger: "POST /dispatch/weather-packages/{packageId}/replace (after replacement is ACTIVE)"
    algorithm: constraint_propagation
    formula: |
      for each FlightPlan P with status LOCKED whose leg.arr_station_id == replaced station,
      ordered by P.created_at ASC (never id):
        re-check: an ACTIVE WeatherPackage covers sched_arr_utc AND meets minima
        if check fails:
          P -> COMPUTED (hop 1)
          release referencing P: RELEASED -> UNDER_AMENDMENT, PENDING_SIGNATURES -> DRAFT
            (cycle_seq += 1; amendment_count += 1 when from RELEASED) (hop 2)
          existing signatures become stale via cycle_seq mismatch (hop 3)
          OperationalControlRecord(action=RELEASE_AUTO_AMENDED)
      # Cascade trigger differs from delay_auto_amend; chain depth 3.
    input_set: "LOCKED FlightPlan rows arriving at the station; their releases"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of Dispatcher, Captain, DispatchSupervisor"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller's role is in the endpoint's roles list; for entity-backed roles acting on a leg-scoped resource, X-User-ID must equal the leg's dispatcher_id (ERR_NOT_ASSIGNED_DISPATCHER) or captain_id (ERR_NOT_ASSIGNED_CAPTAIN) when the endpoint is ownership-restricted"
    error_id: "ERR_UNAUTHORIZED_ROLE / ERR_NOT_ASSIGNED_DISPATCHER / ERR_NOT_ASSIGNED_CAPTAIN"
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references (leg_id, station_id, aircraft_id, dispatcher_id, captain_id, desk_id, divert_station_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "OCC: expected_leg_version == FlightLeg.version on POST /dispatch/plans; expected_station_version == Station.version on POST /dispatch/weather-packages/{id}/replace"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dispatch/plans, POST /dispatch/weather-packages/{id}/replace"

  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the transition (release sign requires PENDING_SIGNATURES — ERR_RELEASE_NOT_PENDING; monitoring/divert/arrive require DEPARTED — ERR_LEG_NOT_IN_FLIGHT / ERR_INVALID_STATE; other transitions per state_machines)"
    error_id: "ERR_INVALID_STATE / ERR_RELEASE_NOT_PENDING / ERR_LEG_NOT_IN_FLIGHT"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "No MelCdlItem on the leg's aircraft is EXPIRED (submit, sign, depart); any OPEN MelCdlItem with fuel_penalty_pct > 0 forces wind_assumption == WORST_CASE at plan create (ERR_WORST_CASE_REQUIRED); captain is type-qualified for the aircraft at leg create and release submit (ERR_CAPTAIN_NOT_QUALIFIED); captain.license_no != dispatcher.license_no at leg create (ERR_DUAL_ROLE_ASSIGNMENT); desk-shift rest rule (ERR_REST_VIOLATION)"
    error_id: "ERR_MEL_ITEM_EXPIRED / ERR_WORST_CASE_REQUIRED / ERR_CAPTAIN_NOT_QUALIFIED / ERR_DUAL_ROLE_ASSIGNMENT / ERR_REST_VIOLATION"
    http_status: 409
    applies_to: "plan create, release submit/sign, leg create/depart, desk-shift create"

  - priority: 7
    category: business_constraint
    check: "Uniqueness (iata_code, tail_no, license_no, desk code — ERR_DUPLICATE_RESOURCE); one non-terminal manifest per leg (ERR_MANIFEST_EXISTS); one non-terminal release per leg (ERR_RELEASE_EXISTS); no new plan while a non-terminal release references a LOCKED plan (ERR_PLAN_IN_USE); no second valid signature in the same slot of the same cycle (ERR_DUPLICATE_SIGNATURE); desk-shift windows of one dispatcher never intersect (ERR_SHIFT_OVERLAP); ACTIVE weather windows of one station never intersect (ERR_WEATHER_WINDOW_OVERLAP)"
    error_id: "ERR_DUPLICATE_RESOURCE / ERR_MANIFEST_EXISTS / ERR_RELEASE_EXISTS / ERR_PLAN_IN_USE / ERR_DUPLICATE_SIGNATURE / ERR_SHIFT_OVERLAP / ERR_WEATHER_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "create endpoints, sign"

  - priority: 8
    category: business_temporal
    check: "Windows well-formed: shift_end > shift_start, weather valid_to > valid_from (ERR_WINDOW_INVALID); delay new_dep_utc strictly after current sched_dep_utc and new_arr_utc strictly after new_dep_utc (ERR_DELAY_INVALID_TIME); MEL repair_deadline_utc within deferral-category interval from creation clock: A <= 1 day, B <= 3, C <= 10, D <= 30 (ERR_REPAIR_WINDOW_EXCEEDED); depart requires an ACTIVE shift covering now (ERR_NO_ACTIVE_SHIFT)"
    error_id: "ERR_WINDOW_INVALID / ERR_DELAY_INVALID_TIME / ERR_REPAIR_WINDOW_EXCEEDED / ERR_NO_ACTIVE_SHIFT"
    http_status: 422
    applies_to: "desk-shift create, weather create/replace, delay, mel create, depart"

  - priority: 9
    category: business_referential
    check: "Manifest create/update and release submit require the leg's current non-SUPERSEDED plan to be LOCKED (ERR_PLAN_NOT_LOCKED); release create requires a manifest for the leg (ERR_MANIFEST_MISSING)"
    error_id: "ERR_PLAN_NOT_LOCKED / ERR_MANIFEST_MISSING"
    http_status: 409
    applies_to: "manifest create/update, release create/submit"

  - priority: 10
    category: business_fiscal
    check: "Weight/fuel economics, evaluated last: MZFW/MTOW/MLW (ERR_MZFW_EXCEEDED, ERR_MTOW_EXCEEDED, ERR_MLW_EXCEEDED), CG envelope (ERR_CG_OUT_OF_ENVELOPE), payload <= max_payload_kg (ERR_PAYLOAD_EXCEEDS_LIMIT), required_fuel_kg <= fuel_capacity_kg (ERR_FUEL_EXCEEDS_CAPACITY), alternate pool non-empty (ERR_NO_SUITABLE_ALTERNATE), dispatcher capacity (ERR_DISPATCHER_OVERLOADED), desk capacity / selector pools (ERR_DESK_OVERLOADED, ERR_NO_DESK_AVAILABLE, ERR_NO_DISPATCHER_AVAILABLE)"
    error_id: "ERR_MZFW_EXCEEDED / ERR_MTOW_EXCEEDED / ERR_MLW_EXCEEDED / ERR_CG_OUT_OF_ENVELOPE / ERR_PAYLOAD_EXCEEDS_LIMIT / ERR_FUEL_EXCEEDS_CAPACITY / ERR_NO_SUITABLE_ALTERNATE / ERR_DISPATCHER_OVERLOADED / ERR_DESK_OVERLOADED / ERR_NO_DESK_AVAILABLE / ERR_NO_DISPATCHER_AVAILABLE"
    http_status: 422
    applies_to: "manifest create/update, release create/submit, plan create/lock, leg create, desk-shift create"

  - priority: 0
    category: business_constraint
    check: "Malformed body: missing required field, wrong type, unknown field, invalid enum member, non-positive quantities (ERR_INVALID_REQUEST). NOTE: malformed-body rejection runs before all other checks (structural parse); listed as priority 0 for ordering only."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Stations (DispatchSupervisor config) ---
  - method: POST
    path: "/dispatch/stations"
    description: "Create a Station"
    roles: [DispatchSupervisor]
    code: 201
    input: [iata_code, runway_length_m, alternate_distance_nm, min_ceiling_ft, min_visibility_m, "status?"]
    output: Station
    side_effects: ["status defaults to OPEN"]

  - method: GET
    path: "/dispatch/stations/{stationId}"
    description: "Get a Station"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/dispatch/stations"
    description: "List Stations with pagination (limit/offset) and optional status filter"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Station[]"
    side_effects: []

  # --- Aircraft ---
  - method: POST
    path: "/dispatch/aircraft"
    description: "Create an Aircraft"
    roles: [DispatchSupervisor]
    code: 201
    input: [tail_no, type_code, oew_kg, mzfw_kg, mtow_kg, mlw_kg, fuel_capacity_kg, cruise_tas_kts, burn_kg_per_hour, min_runway_m, lemac_m, mac_m]
    output: Aircraft
    side_effects: []

  - method: GET
    path: "/dispatch/aircraft/{aircraftId}"
    description: "Get an Aircraft"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  # --- Dispatchers ---
  - method: POST
    path: "/dispatch/dispatchers"
    description: "Create a Dispatcher"
    roles: [DispatchSupervisor]
    code: 201
    input: [name, license_no, "max_active_legs?"]
    output: Dispatcher
    side_effects: ["workload_leg_count = 0, weighted_load_score = 0"]

  - method: GET
    path: "/dispatch/dispatchers/{dispatcherId}"
    description: "Get a Dispatcher (includes computed workload fields)"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: Dispatcher
    side_effects: []

  # --- Captains ---
  - method: POST
    path: "/dispatch/captains"
    description: "Create a Captain"
    roles: [DispatchSupervisor]
    code: 201
    input: [name, license_no, qualified_type_codes]
    output: Captain
    side_effects: []

  - method: GET
    path: "/dispatch/captains/{captainId}"
    description: "Get a Captain"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: Captain
    side_effects: []

  # --- Desks ---
  - method: POST
    path: "/dispatch/desks"
    description: "Create a Desk"
    roles: [DispatchSupervisor]
    code: 201
    input: [code, region, max_dispatchers]
    output: Desk
    side_effects: ["active_shift_count = 0, free_slots = max_dispatchers"]

  - method: GET
    path: "/dispatch/desks/{deskId}"
    description: "Get a Desk (includes computed active_shift_count and free_slots at the current clock)"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: Desk
    side_effects: []

  # --- Desk shifts ---
  - method: POST
    path: "/dispatch/desk-shifts"
    description: "Assign a dispatcher to a desk for a shift window; desk_id omitted -> desk_auto_select picks the desk"
    roles: [DispatchSupervisor]
    code: 201
    input: [dispatcher_id, shift_start_utc, shift_end_utc, "desk_id?"]
    output: DeskShift
    side_effects:
      - "validates window shape (ERR_WINDOW_INVALID), dispatcher overlap (ERR_SHIFT_OVERLAP), rest buffer >= REST_BUFFER_MIN between non-overlapping shifts of the same dispatcher (ERR_REST_VIOLATION), desk capacity at every covered instant (ERR_DESK_OVERLOADED)"

  - method: GET
    path: "/dispatch/desk-shifts/{shiftId}"
    description: "Get a DeskShift"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: DeskShift
    side_effects: []

  - method: GET
    path: "/dispatch/desk-shifts"
    description: "List DeskShifts, filterable by dispatcher_id and/or desk_id"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["dispatcher_id?", "desk_id?", "limit?", "offset?"]
    output: "DeskShift[]"
    side_effects: []

  # --- Flight legs ---
  - method: POST
    path: "/dispatch/legs"
    description: "Create a FlightLeg (ops_status=SCHEDULED, monitor_status=UNMONITORED); dispatcher_id omitted -> dispatcher_auto_select"
    roles: [Dispatcher]
    code: 201
    input: [flight_no, dep_station_id, arr_station_id, aircraft_id, captain_id, distance_nm, sched_dep_utc, sched_arr_utc, "dispatcher_id?"]
    output: FlightLeg
    side_effects:
      - "dispatcher_id set explicitly (must equal caller) or via dispatcher_auto_select"
      - "captain qualification and license segregation checks"
      - "write OperationalControlRecord(action=LEG_CREATED)"

  - method: GET
    path: "/dispatch/legs/{legId}"
    description: "Get a FlightLeg"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []

  - method: GET
    path: "/dispatch/legs"
    description: "List FlightLegs with pagination and FK filters (also the reverse-lookup for continuation legs via diverted_from_leg_id)"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["dep_station_id?", "arr_station_id?", "aircraft_id?", "captain_id?", "dispatcher_id?", "diverted_from_leg_id?", "ops_status?", "limit?", "offset?"]
    output: "FlightLeg[]"
    side_effects: []

  - method: POST
    path: "/dispatch/legs/{legId}/delay"
    description: "Delay decision: push schedule out; >= DELAY_REVIEW_THRESHOLD_MIN auto-amends a RELEASED release"
    roles: [Dispatcher]
    code: 200
    input: [new_dep_utc, new_arr_utc, reason_code]
    output: FlightLeg
    side_effects:
      - "sched_dep_utc/sched_arr_utc updated, delay_count += 1, version += 1"
      - "write OperationalControlRecord(action=DELAY_DECISION)"
      - "delay_auto_amend cascade per calculation"

  - method: POST
    path: "/dispatch/legs/{legId}/cancel"
    description: "Cancel decision: leg SCHEDULED -> CANCELLED; cascades to release"
    roles: [Dispatcher]
    code: 200
    input: [reason_code]
    output: FlightLeg
    side_effects:
      - "non-terminal FlightRelease -> CANCELLED"
      - "write OperationalControlRecord(action=CANCEL_DECISION)"

  - method: POST
    path: "/dispatch/legs/{legId}/depart"
    description: "Mark departure; requires RELEASED release and an ACTIVE shift for the assigned dispatcher"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightLeg
    side_effects:
      - "ops_status -> DEPARTED, monitor_status -> MONITORING, actual_dep_utc := clock"
      - "write OperationalControlRecord(action=DEPARTURE)"

  - method: POST
    path: "/dispatch/legs/{legId}/arrive"
    description: "Mark arrival at destination"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightLeg
    side_effects:
      - "ops_status -> ARRIVED, monitor_status -> CLOSED"
      - "release RELEASED -> CLOSED"
      - "write OperationalControlRecord(action=ARRIVAL)"

  - method: POST
    path: "/dispatch/legs/{legId}/divert"
    description: "Joint dispatcher/captain diversion decision; creates the continuation leg"
    roles: [Dispatcher, Captain]
    code: 201
    input: [divert_station_id, distance_nm, sched_dep_utc, sched_arr_utc, reason_code]
    output: FlightLeg
    side_effects:
      - "this leg -> DIVERTED, monitor -> CLOSED; non-terminal release -> CANCELLED"
      - "continuation FlightLeg created (diverted_from_leg_id = this leg); response is the continuation leg"
      - "write OperationalControlRecord(action=DIVERSION) on both legs"

  # --- Flight plans ---
  - method: POST
    path: "/dispatch/plans"
    description: "Create + compute a FlightPlan for a leg (OCC on the leg); supersedes prior non-SUPERSEDED plans"
    roles: [Dispatcher]
    code: 201
    input: [leg_id, route_code, cruise_altitude_ft, forecast_wind_kts, wind_assumption, expected_leg_version]
    output: FlightPlan
    side_effects:
      - "runs weight_adjusted_burn, trip_fuel, required_fuel, alternate_selection; status=COMPUTED"
      - "prior non-SUPERSEDED plans of the leg -> SUPERSEDED (rejected instead with ERR_PLAN_IN_USE when a non-terminal release references a LOCKED plan)"
      - "increments FlightLeg.version by 1"

  - method: GET
    path: "/dispatch/plans/{planId}"
    description: "Get a FlightPlan"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: FlightPlan
    side_effects: []

  - method: GET
    path: "/dispatch/plans"
    description: "List FlightPlans, filterable by leg_id / alternate_station_id"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["leg_id?", "alternate_station_id?", "limit?", "offset?"]
    output: "FlightPlan[]"
    side_effects: []

  - method: POST
    path: "/dispatch/plans/{planId}/lock"
    description: "Lock a COMPUTED plan (validates destination weather, minima, fuel capacity)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightPlan
    side_effects: ["status COMPUTED -> LOCKED"]

  - method: POST
    path: "/dispatch/plans/{planId}/recompute"
    description: "Re-derive a LOCKED plan against current weather/MEL/manifest (LOCKED -> COMPUTED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightPlan
    side_effects: ["status LOCKED -> COMPUTED; all computed fields re-derived"]

  # --- Payload manifests ---
  - method: POST
    path: "/dispatch/manifests"
    description: "Create the payload manifest for a leg (requires a LOCKED plan; one per leg)"
    roles: [Dispatcher]
    code: 201
    input: [leg_id, pax_count, bags_count, cargo_kg]
    output: PayloadManifest
    side_effects:
      - "pins plan_id := leg's current LOCKED plan; runs manifest_weight_rollup, max_payload_envelope, cg_percent_mac"

  - method: GET
    path: "/dispatch/manifests/{manifestId}"
    description: "Get a PayloadManifest"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: PayloadManifest
    side_effects: []

  - method: GET
    path: "/dispatch/manifests"
    description: "List PayloadManifests, filterable by leg_id / plan_id"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["leg_id?", "plan_id?", "limit?", "offset?"]
    output: "PayloadManifest[]"
    side_effects: []

  - method: PUT
    path: "/dispatch/manifests/{manifestId}"
    description: "Update manifest load figures; re-runs weight/CG checks against the CURRENT LOCKED plan and re-pins plan_id"
    roles: [Dispatcher]
    code: 200
    input: ["pax_count?", "bags_count?", "cargo_kg?"]
    output: PayloadManifest
    side_effects: ["re-runs manifest_weight_rollup, max_payload_envelope, cg_percent_mac"]

  # --- MEL / CDL ---
  - method: POST
    path: "/dispatch/mel-items"
    description: "Defer an MEL/CDL item on an aircraft"
    roles: [DispatchSupervisor]
    code: 201
    input: [aircraft_id, item_code, category, deferral_category, repair_deadline_utc, "fuel_penalty_pct?", "payload_penalty_kg?", "minima_bump?"]
    output: MelCdlItem
    side_effects: ["status = OPEN; repair window validated against deferral_category"]

  - method: GET
    path: "/dispatch/mel-items/{itemId}"
    description: "Get a MelCdlItem"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: MelCdlItem
    side_effects: []

  - method: GET
    path: "/dispatch/mel-items"
    description: "List MelCdlItems, filterable by aircraft_id / status"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["aircraft_id?", "status?", "limit?", "offset?"]
    output: "MelCdlItem[]"
    side_effects: []

  - method: POST
    path: "/dispatch/mel-items/{itemId}/clear"
    description: "Clear an OPEN deferral (repair accomplished)"
    roles: [DispatchSupervisor]
    code: 200
    input: []
    output: MelCdlItem
    side_effects: ["status OPEN -> CLEARED"]

  # --- Weather packages ---
  - method: POST
    path: "/dispatch/weather-packages"
    description: "Publish a weather package for a station; half-open windows of ACTIVE packages must not overlap"
    roles: [DispatchSupervisor]
    code: 201
    input: [station_id, valid_from_utc, valid_to_utc, ceiling_ft, visibility_m]
    output: WeatherPackage
    side_effects: ["status = ACTIVE; increments Station.version by 1"]

  - method: GET
    path: "/dispatch/weather-packages/{packageId}"
    description: "Get a WeatherPackage"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: WeatherPackage
    side_effects: []

  - method: GET
    path: "/dispatch/weather-packages"
    description: "List WeatherPackages, filterable by station_id"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: "WeatherPackage[]"
    side_effects: []

  - method: POST
    path: "/dispatch/weather-packages/{packageId}/replace"
    description: "Replace (supersede) a package with a corrected forecast (OCC on the station); runs weather_revalidation"
    roles: [DispatchSupervisor]
    code: 201
    input: [valid_from_utc, valid_to_utc, ceiling_ft, visibility_m, expected_station_version]
    output: WeatherPackage
    side_effects:
      - "target package -> SUPERSEDED; new package ACTIVE; increments Station.version by 1"
      - "overlap validated against other ACTIVE packages (the replaced one excluded)"
      - "weather_revalidation cascade per calculation"

  # --- Releases ---
  - method: POST
    path: "/dispatch/releases"
    description: "Open a dispatch release for a leg (DRAFT); snapshots dispatcher/captain/plan"
    roles: [Dispatcher]
    code: 201
    input: [leg_id]
    output: FlightRelease
    side_effects:
      - "requires LOCKED plan + valid manifest; snapshots plan_id/dispatcher_id/captain_id"
      - "write OperationalControlRecord(action=RELEASE_CREATED)"

  - method: GET
    path: "/dispatch/releases/{releaseId}"
    description: "Get a FlightRelease"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: FlightRelease
    side_effects: []

  - method: GET
    path: "/dispatch/releases"
    description: "List FlightReleases, filterable by leg_id / plan_id / dispatcher_id / captain_id"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["leg_id?", "plan_id?", "dispatcher_id?", "captain_id?", "limit?", "offset?"]
    output: "FlightRelease[]"
    side_effects: []

  - method: POST
    path: "/dispatch/releases/{releaseId}/submit"
    description: "Submit a DRAFT or UNDER_AMENDMENT release for joint signature (full revalidation)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightRelease
    side_effects: ["status -> PENDING_SIGNATURES; write OperationalControlRecord(action=RELEASE_SUBMITTED)"]

  - method: POST
    path: "/dispatch/releases/{releaseId}/sign"
    description: "Sign the release; signature slot derived from caller role (Dispatcher or Captain); second valid signature auto-releases"
    roles: [Dispatcher, Captain]
    code: 200
    input: ["statement?"]
    output: FlightRelease
    side_effects:
      - "append ReleaseSignature(release_id, signer_role from X-User-Role, signer_id from X-User-ID, cycle_seq = release.cycle_seq)"
      - "when both slots hold valid signatures for the current cycle_seq: status -> RELEASED"
      - "write OperationalControlRecord(action=SIGNATURE_RECORDED)"

  - method: POST
    path: "/dispatch/releases/{releaseId}/recall"
    description: "Recall a PENDING_SIGNATURES release to DRAFT (invalidates signatures via cycle_seq += 1)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightRelease
    side_effects: ["cycle_seq += 1; write OperationalControlRecord(action=RELEASE_RECALLED)"]

  - method: POST
    path: "/dispatch/releases/{releaseId}/amend"
    description: "Amend a RELEASED release (RELEASED -> UNDER_AMENDMENT; signatures invalidated)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightRelease
    side_effects: ["cycle_seq += 1; amendment_count += 1; write OperationalControlRecord(action=RELEASE_AMENDED)"]

  - method: GET
    path: "/dispatch/releases/{id}/signatures"
    description: "List ReleaseSignatures of a release (append-only; validity = cycle_seq match)"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReleaseSignature[]"
    side_effects: []

  # --- En-route monitoring ---
  - method: POST
    path: "/dispatch/monitoring-events"
    description: "File a position/fuel report for a DEPARTED leg; computes margin and recommendation"
    roles: [Dispatcher]
    code: 201
    input: [leg_id, fuel_remaining_kg, eta_destination_utc, "dest_ceiling_ft?", "dest_visibility_m?"]
    output: MonitoringEvent
    side_effects:
      - "runs fuel_margin_recommendation"
      - "recommendation IN {CONSIDER_DIVERT, RECOMMEND_DIVERT} -> leg monitor_status MONITORING -> ALERTED"
      - "recommendation == RECOMMEND_DIVERT -> write OperationalControlRecord(action=DIVERT_RECOMMENDED)"

  - method: GET
    path: "/dispatch/monitoring-events/{eventId}"
    description: "Get a MonitoringEvent"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: []
    output: MonitoringEvent
    side_effects: []

  - method: GET
    path: "/dispatch/monitoring-events"
    description: "List MonitoringEvents, filterable by leg_id"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["leg_id?", "limit?", "offset?"]
    output: "MonitoringEvent[]"
    side_effects: []

  - method: POST
    path: "/dispatch/monitoring-events/{eventId}/acknowledge"
    description: "Acknowledge an OPEN event; returns leg monitor to MONITORING when it was the last OPEN alerting event"
    roles: [Dispatcher]
    code: 200
    input: []
    output: MonitoringEvent
    side_effects: ["event OPEN -> ACKNOWLEDGED; conditional monitor_status ALERTED -> MONITORING"]

  # --- Operational control records ---
  - method: GET
    path: "/dispatch/legs/{id}/control-records"
    description: "List OperationalControlRecords for a leg (audit trail, append-only)"
    roles: [Dispatcher, Captain, DispatchSupervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: "OperationalControlRecord[]"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/dispatch/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Triggers mel_expiry_sweep and clock-derived recomputes (DeskShift.status, Desk.active_shift_count, weighted_load_score tiers)."
    roles: [DispatchSupervisor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["mel_expiry_sweep per calculation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_ASSIGNED_DISPATCHER, http: 403, condition: "Dispatcher caller is not the dispatcher of record on the target leg/release/plan/manifest/monitoring-event" }
  - { id: ERR_NOT_ASSIGNED_CAPTAIN, http: 403, condition: "Captain caller is not the captain of record on the target leg/release" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, unknown field, invalid enum, non-positive quantity, divert target equals dep/arr" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_leg_version != FlightLeg.version on plan create; expected_station_version != Station.version on weather replace" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation (wrong from-state, terminal-state lockdown, divert target CLOSED)" }
  - { id: ERR_RELEASE_NOT_PENDING, http: 409, condition: "Sign attempted on a release not in PENDING_SIGNATURES" }
  - { id: ERR_LEG_NOT_IN_FLIGHT, http: 409, condition: "Monitoring event created for a leg not in ops_status DEPARTED" }
  - { id: ERR_RELEASE_EXISTS, http: 409, condition: "A non-terminal FlightRelease already exists for the leg" }
  - { id: ERR_MANIFEST_EXISTS, http: 409, condition: "A PayloadManifest already exists for the leg" }
  - { id: ERR_PLAN_IN_USE, http: 409, condition: "New plan creation blocked: a non-terminal release references the leg's LOCKED plan" }
  - { id: ERR_PLAN_NOT_LOCKED, http: 409, condition: "Operation requires the leg's current plan to be LOCKED (manifest write, release create/submit)" }
  - { id: ERR_MANIFEST_MISSING, http: 409, condition: "Release create/submit requires a PayloadManifest for the leg" }
  - { id: ERR_MEL_ITEM_EXPIRED, http: 409, condition: "An EXPIRED MelCdlItem exists on the aircraft (submit, sign, depart)" }
  - { id: ERR_WORST_CASE_REQUIRED, http: 409, condition: "OPEN MelCdlItem with fuel_penalty_pct > 0 forces wind_assumption == WORST_CASE at plan create" }
  - { id: ERR_WEATHER_NOT_CURRENT, http: 422, condition: "No ACTIVE WeatherPackage covers the current sched_arr_utc at the arrival station (plan lock, release submit)" }
  - { id: ERR_WEATHER_BELOW_MINIMA, http: 422, condition: "Covering weather is below arrival-station minima (plus MEL bump)" }
  - { id: ERR_CAPTAIN_NOT_QUALIFIED, http: 422, condition: "Captain lacks the aircraft type_code in qualified_type_codes" }
  - { id: ERR_DUAL_ROLE_ASSIGNMENT, http: 422, condition: "Leg create: captain.license_no == dispatcher.license_no (same person cannot hold both joint-responsibility slots)" }
  - { id: ERR_REST_VIOLATION, http: 409, condition: "Non-overlapping shifts of one dispatcher separated by < REST_BUFFER_MIN (30) minutes" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Shift windows of one dispatcher intersect (half-open)" }
  - { id: ERR_WEATHER_WINDOW_OVERLAP, http: 409, condition: "ACTIVE weather windows of one station intersect (half-open; adjacency allowed)" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "Window end not strictly after start (desk shift, weather package)" }
  - { id: ERR_DELAY_INVALID_TIME, http: 422, condition: "Delay new_dep_utc must be strictly after current sched_dep_utc and new_arr_utc strictly after new_dep_utc" }
  - { id: ERR_REPAIR_WINDOW_EXCEEDED, http: 422, condition: "repair_deadline_utc exceeds the deferral-category interval from creation clock (A: 1 day, B: 3, C: 10, D: 30)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Unique field collision (iata_code, tail_no, license_no, desk code)" }
  - { id: ERR_DUPLICATE_SIGNATURE, http: 409, condition: "A valid signature already exists for the caller's slot in the current cycle" }
  - { id: ERR_MZFW_EXCEEDED, http: 422, condition: "zero_fuel_weight_kg > aircraft.mzfw_kg" }
  - { id: ERR_MTOW_EXCEEDED, http: 422, condition: "takeoff_weight_kg > aircraft.mtow_kg" }
  - { id: ERR_MLW_EXCEEDED, http: 422, condition: "landing_weight_kg > aircraft.mlw_kg" }
  - { id: ERR_CG_OUT_OF_ENVELOPE, http: 422, condition: "cg_percent_mac outside the applicable envelope (normal [20.0, 31.0]; CDL-narrowed [22.0, 30.0])" }
  - { id: ERR_PAYLOAD_EXCEEDS_LIMIT, http: 422, condition: "total_payload_kg > max_payload_kg (equality accepted)" }
  - { id: ERR_FUEL_EXCEEDS_CAPACITY, http: 422, condition: "required_fuel_kg > aircraft.fuel_capacity_kg" }
  - { id: ERR_NO_SUITABLE_ALTERNATE, http: 422, condition: "Alternate selection pool empty (status/distance/runway filters)" }
  - { id: ERR_DISPATCHER_OVERLOADED, http: 409, condition: "Explicit dispatcher assignment with workload_leg_count >= max_active_legs" }
  - { id: ERR_DESK_OVERLOADED, http: 409, condition: "Desk shift would make concurrent shift count exceed max_dispatchers at some covered instant" }
  - { id: ERR_NO_ACTIVE_SHIFT, http: 422, condition: "Depart requires an ACTIVE DeskShift for the assigned dispatcher covering the current clock" }
  - { id: ERR_NO_DESK_AVAILABLE, http: 422, condition: "desk_auto_select pool empty" }
  - { id: ERR_NO_DISPATCHER_AVAILABLE, http: 422, condition: "dispatcher_auto_select pool empty" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Licensed aircraft dispatcher; owns planning, manifests, releases, monitoring, delay/cancel decisions for assigned legs; shares joint responsibility with the captain via the DISPATCHER signature slot"
    identity: "entity_backed:Dispatcher"
    exclusive_operations:
      - "POST /dispatch/legs — create leg (auto- or self-assignment)"
      - "POST /dispatch/plans, POST /dispatch/plans/{id}/lock, POST /dispatch/plans/{id}/recompute"
      - "POST /dispatch/manifests, PUT /dispatch/manifests/{id}"
      - "POST /dispatch/releases, submit, recall, amend"
      - "POST /dispatch/legs/{id}/delay, cancel, depart, arrive"
      - "POST /dispatch/monitoring-events, POST /dispatch/monitoring-events/{id}/acknowledge"
    shared_operations:
      - "POST /dispatch/releases/{id}/sign — DISPATCHER slot (shared with Captain; slot derived from role)"
      - "POST /dispatch/legs/{id}/divert — joint operational-control decision (shared with Captain)"
      - "All GET endpoints (shared with Captain, DispatchSupervisor)"

  - name: Captain
    description: "Pilot in command; jointly responsible for the dispatch release via the CAPTAIN signature slot; joint authority on diversions"
    identity: "entity_backed:Captain"
    exclusive_operations: []
    shared_operations:
      - "POST /dispatch/releases/{id}/sign — CAPTAIN slot (must equal release.captain_id; cannot sign the DISPATCHER slot)"
      - "POST /dispatch/legs/{id}/divert — joint operational-control decision (shared with Dispatcher)"
      - "All GET endpoints (shared with Dispatcher, DispatchSupervisor)"

  - name: DispatchSupervisor
    description: "Dispatch-center operations supervisor; manages reference data (stations, aircraft, dispatchers, captains, desks), desk-shift assignment, MEL/CDL deferrals, weather packages, and the logical clock; has no release-signature authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /dispatch/stations, /dispatch/aircraft, /dispatch/dispatchers, /dispatch/captains, /dispatch/desks"
      - "POST /dispatch/desk-shifts"
      - "POST /dispatch/mel-items, POST /dispatch/mel-items/{id}/clear"
      - "POST /dispatch/weather-packages, POST /dispatch/weather-packages/{id}/replace"
      - "POST /dispatch/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (shared with Dispatcher, Captain)"

# Segregation of duties (role_model): the DISPATCHER and CAPTAIN signature slots
# are filled exclusively by callers of the matching role, and leg creation
# rejects a captain whose license_no equals the assigned dispatcher's
# (ERR_DUAL_ROLE_ASSIGNMENT) so the same physical person can never hold both
# slots of the joint responsibility.
