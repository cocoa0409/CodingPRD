              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases/${lease_id}/terms"
              payload: { percentage_rent_rate_bps: 700 }
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/insurance-endorsements"
