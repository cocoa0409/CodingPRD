            - { call: "GET /opportunities/${opp_id}", as: IntegrationManager, captures: { opp_status: $.data.status } }
          assert:
            - "captured ep_status == VERIFIED (auto bubble-up; no explicit endpoint call)"
            - "captured opp_status == CONSUMED (mark-aired side effect)"
      - name: proposal_reject_frees_opportunity
        claim_type: side_effect_execution
        grounds: [state_machines.ScriptOpportunity.PITCHED_to_IDENTIFIED, state_machines.IntegrationProposal.NETWORK_REVIEW_to_REJECTED]
        distinguishing_aspect: "Network rejection cascades to the opportunity, returning it PITCHED -> IDENTIFIED so another proposal can use it."
        test_recipe:
