              as: TournamentDirector
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500, rain_date_terms: "PARTIAL_CREDIT", rain_date_credit_pct: 0.5 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "POSTPONE" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "RESUME" }
              as: TournamentDirector
          trigger:
            - call: "POST /outing-ops/outings/${o_id}/finance-transition"
              payload: { action: "REMIT", expected_outing_version: "${o_v0}", remittance_cents: 0, remittance_reference: "WIRE-STALE" }
              as: CharityTreasurer
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION (priority 8), not HTTP 412 ERR_STALE_OUTING_VERSION (priority 11)"
            - "Outing.${o_id}.finance_status == COLLECTING, beneficiary_remittance_cents == 0, remittance_reference == null"
            - "Outing.${o_id}.version == ${o_v0} + 3 (the three play transitions, and nothing from the rejected finance call)"
            - "replaying the same payload with the CURRENT expected_outing_version (${o_v0} + 3) still returns 409 ERR_INVALID_STATE_TRANSITION, so the 409 was a genuine state verdict and not a mislabelled version failure; the 412 leg of rule 11 is exercised on its own in §1.9"

  - rule_id: boundary_precision_check
    instances:
      - name: token_benefit_gsv_exactly_on_the_ceiling_is_disregarded
        grounds:
          - calculations.charitable_deductible
          - calculations.charitable_deductible.constants.TOKEN_GSV_CAP_CENTS
          - calculations.charitable_deductible.constants.TOKEN_GSV_PCT
          - entities.CharitableReceipt.fields.deductible_amount_cents
        boundary_metric: "declared PackageTier.gsv_cents against token_ceiling = min(1300, round_half_up(0.02 * payment_cents))"
        endpoint: "POST /outing-ops/receipts"
        distinguishing_aspect: |
          A 65000-cent package makes the two arms of the token ceiling meet exactly:
          round_half_up(0.02 * 65000) = 1300 = TOKEN_GSV_CAP_CENTS. The comparison is
          `<=`, so a goods-and-services value sitting exactly ON the ceiling is
          disregarded entirely (gsv_cents written as 0, the whole 65000 deductible) while
          one cent above it is fully subtracted (deductible 63699). The one-cent step in
          the input produces a 1301-cent step in the output, so an implementation using
          `<` loses the entire boundary case.
        test_recipe:
          setup:
            - "Outing OPEN with field_capacity_teams 2 (eight slots)."
            - "Two TEAM tiers, both priced 65000 with four player slots: TOKEN with gsv_cents 1300 and OVER with gsv_cents 1301."
            - "One CONFIRMED registration on each tier, each paid in full."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CharityTreasurer
            - call: "POST /outing-ops/outings"
              payload: { name: "Token Ceiling Cup", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 2, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TOKEN", kind: "TEAM", price_cents: 65000, player_slots: 4, gsv_cents: 1300, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_token: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "OVER", kind: "TEAM", price_cents: 65000, player_slots: 4, gsv_cents: 1301, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_over: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_token}", buyer_name: "On The Line Co", player_count: 4 }
              as: TournamentDirector
              captures: { r_token: $.data.id }
            - call: "POST /outing-ops/registrations/${r_token}/payment"
              payload: { amount_cents: 65000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_over}", buyer_name: "One Cent Over Co", player_count: 4 }
              as: TournamentDirector
              captures: { r_over: $.data.id }
            - call: "POST /outing-ops/registrations/${r_over}/payment"
              payload: { amount_cents: 65000 }
              as: CharityTreasurer
          trigger:
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_token}" }
              as: CharityTreasurer
              captures: { rec_token: $.data.id }
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_over}" }
              as: CharityTreasurer
              captures: { rec_over: $.data.id }
          assert:
            - "ON the boundary - CharitableReceipt.${rec_token}.payment_cents == 65000, gsv_cents == 0, deductible_amount_cents == 65000, receipt_number == 'GR-0001'"
            - "one cent OVER - CharitableReceipt.${rec_over}.payment_cents == 65000, gsv_cents == 1301, deductible_amount_cents == 63699, receipt_number == 'GR-0002'"
            - "Outing.${o_id}.receipted_deductible_total_cents == 128699"
            - "Registration.${r_token}.receipt_issued == true and Registration.${r_over}.receipt_issued == true"

      - name: admin_fee_tier_boundary_at_exactly_two_million_before_fee
        grounds:
          - calculations.net_proceeds_rollup
          - calculations.net_proceeds_rollup.constants.ADMIN_FEE_TIER_1_LIMIT_CENTS
          - entities.Outing.fields.admin_fee_cents
          - entities.Outing.fields.net_proceeds_cents
        boundary_metric: "net_proceeds_before_fee_cents against ADMIN_FEE_TIER_1_LIMIT_CENTS (2000000)"
        endpoint: "POST /outing-ops/registrations/{id}/payment then POST /outing-ops/registrations/{id}/amend-tier"
        distinguishing_aspect: |
          A different metric on a different endpoint. The tier ladder uses a strict `<`
          on the FIRST limit, so 1999999 is still the 5% band and exactly 2000000 has
          already crossed into the 3.5% band. Direct costs are pinned at 100000 (four
          guaranteed players at 25000, no food-and-beverage shortfall), so a one-cent move
          in the package price walks the before-fee net across the limit. The fee is then
          charged on GROSS, so the crossing makes the fee FALL from 105000 to 73500 and the
          net JUMP by 31501 cents - a monotonicity trap for any implementation that keys
          the tier off the after-fee net.
        test_recipe:
          setup:
            - "Outing OPEN, prize_pool_cents 0, field_capacity_teams 1."
            - "Contract with rate_per_player_cents 25000, guaranteed_player_count 4, fnb_minimum_cents 0 and fnb_per_player_cents 0, SIGNED, so direct_costs_cents is exactly 100000."
            - "Two TEAM tiers with four player slots: EDGE_LOW priced 2099999 and EDGE_HIGH priced 2100000."
            - "One registration on EDGE_LOW, paid in full."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Fee Ladder Invitational", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 25000, guaranteed_player_count: 4, fnb_minimum_cents: 0, fnb_per_player_cents: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "EDGE_LOW", kind: "TEAM", price_cents: 2099999, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_low: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "EDGE_HIGH", kind: "TEAM", price_cents: 2100000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_high: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_low}", buyer_name: "Edge Case Capital", player_count: 4 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 2099999 }
              as: CharityTreasurer
              captures: { r_v1: $.data.version }
          trigger:
            - call: "POST /outing-ops/registrations/${r_id}/amend-tier"
              payload: { package_tier_id: "${t_high}", expected_registration_version: "${r_v1}", amount_cents: 1 }
              as: TournamentDirector
          assert:
            - "one cent BELOW the limit (state after setup) - Outing.${o_id}.gross_revenue_cents == 2099999, course_charge_cents == 100000, fnb_shortfall_cents == 0, direct_costs_cents == 100000, net_proceeds_before_fee_cents == 1999999, admin_fee_cents == 105000, net_proceeds_cents == 1894999"
            - "EXACTLY ON the limit (state after the trigger) - Outing.${o_id}.gross_revenue_cents == 2100000, net_proceeds_before_fee_cents == 2000000, admin_fee_cents == 73500, net_proceeds_cents == 1926500"
            - "the crossing is non-monotonic: one extra cent of revenue raises net_proceeds_cents by 31501 cents"
            - "Registration.${r_id}.amount_paid_cents == 2100000 and status == AMENDED"

      - name: asset_remaining_capacity_zero_is_a_rejection
        grounds:
          - calculations.asset_occupancy_availability
          - validations[priority=28]
          - errors.ERR_ASSET_CAPACITY_EXCEEDED
          - entities.SponsorshipAsset.fields.remaining_capacity
        boundary_metric: "SponsorshipAsset.remaining_capacity against 1 (>= 1 admits, exactly 0 rejects)"
        endpoint: "POST /outing-ops/sponsor-allocations"
        distinguishing_aspect: |
          A third metric on a third endpoint, and an integer boundary rather than a money
          one: capacity is consumed at RESERVED, not at COMMITTED, so the very first
          allocation drives remaining_capacity from 1 to 0 and the next request on the same
          asset - still an entirely valid, entitled, in-window request - must fail with
          ERR_ASSET_CAPACITY_EXCEEDED. The trap is treating capacity as consumed only once
          fulfilment completes, which lets the second allocation through.
        test_recipe:
          setup:
            - "Outing OPEN with a SPONSOR tier GOLD priced 250000, entitled_asset_type HOLE_SIGN, entitled_asset_count 2."
            - "Two CONFIRMED sponsor registrations on that tier, so each carries entitled_asset_balance 2."
            - "One HOLE_SIGN asset on hole 11 with capacity 1, exclusive false, list_price_cents 50000."
            - "The first sponsor already holds a PACKAGE_ENTITLEMENT allocation on that asset, left in RESERVED (never committed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/outings"
              payload: { name: "Capacity Boundary Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "GOLD", kind: "SPONSOR", price_cents: 250000, player_slots: 0, gsv_cents: 0, inventory_cap: 5, entitled_asset_type: "HOLE_SIGN", entitled_asset_count: 2 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "First Sponsor Bank", player_count: 0 }
              as: SponsorshipManager
              captures: { r1_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r1_id}/payment"
              payload: { amount_cents: 250000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Second Sponsor Trust", player_count: 0 }
              as: SponsorshipManager
              captures: { r2_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r2_id}/payment"
              payload: { amount_cents: 250000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/sponsorship-assets"
              payload: { outing_id: "${o_id}", asset_type: "HOLE_SIGN", label: "Hole 11 tee sign", hole_number: 11, capacity: 1, exclusive: false, list_price_cents: 50000, fulfillment_due_at: "2026-09-15T00:00:00Z" }
              as: SponsorshipManager
              captures: { a_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r1_id}", sponsorship_asset_id: "${a_id}", source: "PACKAGE_ENTITLEMENT" }
              as: SponsorshipManager
              captures: { al1_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r2_id}", sponsorship_asset_id: "${a_id}", source: "PACKAGE_ENTITLEMENT" }
              as: SponsorshipManager
              captures: { err_id: $.data.error_id }
          assert:
            - "at remaining_capacity 1 the setup allocation succeeded: SponsorAllocation.${al1_id}.status == RESERVED"
            - "SponsorshipAsset.${a_id}.reserved_count == 1, committed_count == 0, fulfilled_count == 0, remaining_capacity == 0, status == RESERVED"
            - "the trigger returns HTTP 409 with error_id ERR_ASSET_CAPACITY_EXCEEDED even though the second sponsor is fully entitled"
            - "Registration.${r2_id}.entitled_asset_balance == 2 (a rejected allocation consumes no entitlement)"
            - "Outing.${o_id}.reserved_asset_slot_count == 1, unchanged by the rejection"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: outing_cannot_open_registration_while_contract_is_draft
        grounds:
          - validations[priority=12]
          - errors.ERR_CONTRACT_NOT_SIGNED
          - state_machines.Outing.DRAFT_to_OPEN
          - state_machines.CourseContract.DRAFT_to_SIGNED
        entity_pair: [Outing, CourseContract]
        distinguishing_aspect: |
          The gate on Outing.play_status DRAFT -> OPEN lives on a DIFFERENT row: the
          outing's own fields are all complete and a PackageTier exists, yet the transition
          is refused until the CourseContract reaches SIGNED or AMENDED. The same request,
          replayed unchanged after the course signs, succeeds - so the failure is purely a
          function of the other entity's state.
        test_recipe:
          setup:
            - "Outing in DRAFT with one TEAM PackageTier, so the no-tier guard is satisfied."
            - "A CourseContract exists for the outing but is still in DRAFT - it has never been signed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Unsigned Course Open", beneficiary_name: "Northside Youth Fund", format: "BEST_BALL", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 4, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_CONTRACT_NOT_SIGNED"
            - "Outing.${o_id}.play_status == DRAFT and reopen_count == 0"
            - "CourseContract.${c_id}.status == DRAFT and signed_at == null"
            - "after POST /outing-ops/contracts/${c_id}/lifecycle action=SIGN as CourseOperations, the identical trigger succeeds with 200 and Outing.${o_id}.play_status == OPEN"

      - name: allocation_cannot_commit_while_its_registration_is_unpaid
        grounds:
          - state_machines.SponsorAllocation.RESERVED_to_COMMITTED
          - errors.ERR_REGISTRATION_NOT_REVENUE_RECOGNIZED
          - state_machines.Registration.PENDING_PAYMENT_to_CONFIRMED
          - calculations.net_proceeds_rollup
        entity_pair: [SponsorAllocation, Registration]
        distinguishing_aspect: |
          A different entity pair and a different direction: the child allocation is
          blocked by its PARENT registration's payment state. Reserving inventory is allowed
          on an unpaid sponsor registration - the hold is real - but COMMIT would recognize
          the upsell as revenue, so it is refused with
          ERR_REGISTRATION_NOT_REVENUE_RECOGNIZED while the registration is still
          PENDING_PAYMENT. Paying the registration, and nothing else, unblocks the identical
          COMMIT.
        test_recipe:
          setup:
            - "Outing OPEN with a SPONSOR tier priced 250000."
            - "A sponsor registration left in PENDING_PAYMENT - deliberately not paid."
            - "A HOLE_SIGN asset with capacity 1 and list_price_cents 50000, and an UPSELL allocation on it in RESERVED (upsell needs no entitlement balance)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/outings"
              payload: { name: "Unpaid Sponsor Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "GOLD", kind: "SPONSOR", price_cents: 250000, player_slots: 0, gsv_cents: 0, inventory_cap: 5, entitled_asset_type: "HOLE_SIGN", entitled_asset_count: 1 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Slow Pay Motors", player_count: 0 }
              as: SponsorshipManager
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/sponsorship-assets"
              payload: { outing_id: "${o_id}", asset_type: "HOLE_SIGN", label: "Hole 5 tee sign", hole_number: 5, capacity: 1, exclusive: true, list_price_cents: 50000, fulfillment_due_at: "2026-09-15T00:00:00Z" }
              as: SponsorshipManager
              captures: { a_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r_id}", sponsorship_asset_id: "${a_id}", source: "UPSELL" }
              as: SponsorshipManager
              captures: { al_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "COMMIT" }
              as: SponsorshipManager
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_REGISTRATION_NOT_REVENUE_RECOGNIZED"
            - "SponsorAllocation.${al_id}.status == RESERVED and committed_at == null"
            - "SponsorshipAsset.${a_id}.reserved_count == 1, committed_count == 0, remaining_capacity == 0, status == RESERVED (the reservation itself was always legal)"
            - "Outing.${o_id}.gross_revenue_cents == 0 - the 50000 upsell is NOT recognized while the allocation is only RESERVED"
            - "after POST /outing-ops/registrations/${r_id}/payment amount_cents 250000 as CharityTreasurer, the identical COMMIT succeeds: SponsorAllocation.${al_id}.status == COMMITTED, SponsorshipAsset.${a_id}.committed_count == 1 and Outing.${o_id}.gross_revenue_cents == 300000"

      - name: allocation_cannot_be_reserved_against_a_withdrawn_asset
        grounds:
          - validations[priority=28]
          - errors.ERR_ASSET_WITHDRAWN
          - state_machines.SponsorshipAsset.AVAILABLE_to_WITHDRAWN
          - calculations.asset_occupancy_availability
        entity_pair: [SponsorAllocation, SponsorshipAsset]
        distinguishing_aspect: |
          A third pair where the dependency runs the other way - the child cannot be
          BORN because the referenced inventory row has left the market. The asset was
          created with capacity 2 and has never been occupied, so the only reason to refuse
          is its WITHDRAWN status; the declared order puts the withdrawn check ahead of the
          capacity comparison, so the answer must be ERR_ASSET_WITHDRAWN and not the
          ERR_ASSET_CAPACITY_EXCEEDED that a naive implementation reports after
          WITHDRAW forced remaining_capacity to 0.
        test_recipe:
          setup:
            - "Outing OPEN with a SPONSOR tier entitling two HOLE_SIGN units."
            - "A CONFIRMED sponsor registration with entitled_asset_balance 2."
            - "A HOLE_SIGN asset with capacity 2, never allocated, then WITHDRAWN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/outings"
              payload: { name: "Withdrawn Sign Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "GOLD", kind: "SPONSOR", price_cents: 250000, player_slots: 0, gsv_cents: 0, inventory_cap: 5, entitled_asset_type: "HOLE_SIGN", entitled_asset_count: 2 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Pulled Sign Partners", player_count: 0 }
              as: SponsorshipManager
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 250000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/sponsorship-assets"
              payload: { outing_id: "${o_id}", asset_type: "HOLE_SIGN", label: "Hole 9 double sign", hole_number: 9, capacity: 2, exclusive: false, list_price_cents: 50000, fulfillment_due_at: "2026-09-15T00:00:00Z" }
              as: SponsorshipManager
              captures: { a_id: $.data.id }
            - call: "POST /outing-ops/sponsorship-assets/${a_id}/inventory"
              payload: { action: "WITHDRAW" }
              as: SponsorshipManager
          trigger:
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r_id}", sponsorship_asset_id: "${a_id}", source: "PACKAGE_ENTITLEMENT" }
              as: SponsorshipManager
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_ASSET_WITHDRAWN, not ERR_ASSET_CAPACITY_EXCEEDED"
            - "SponsorshipAsset.${a_id}.status == WITHDRAWN, capacity == 2, remaining_capacity == 0, reserved_count == 0"
            - "Registration.${r_id}.entitled_asset_balance == 2, untouched by the rejection"
            - "Outing.${o_id}.reserved_asset_slot_count == 0"
            - "after POST /outing-ops/sponsorship-assets/${a_id}/inventory action=RESTORE, remaining_capacity is back to 2 and the identical trigger succeeds with 201 and SponsorAllocation.status == RESERVED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: tee_sheet_slot_is_half_open_per_starting_hole
        grounds:
          - validations[priority=21]
          - errors.ERR_TEE_SLOT_CONFLICT
          - entities.Team.fields.slot_occupancy_start
          - entities.Team.fields.slot_occupancy_end
          - entities.CourseContract.fields.tee_interval_minutes
        resource: "the tee sheet of one starting_hole within one Outing"
        interval_semantics: "HALF-OPEN [tee_time, tee_time + tee_interval_minutes) - a group teeing off exactly when the previous interval ends is accepted"
        distinguishing_aspect: |
          The resource key is the pair (Outing, starting_hole), and the interval is
          half-open with a 10-minute width taken from the contract. 12:10 is therefore
          admissible against a 12:00 group while 12:09 - one minute inside the same
          interval - is refused, and the very same 12:09 request is admissible on hole 2
          because that is a different resource. Note the tee sheet is drafted while the
          outing is still OPEN: the scaffold puts no play_status gate on tee-assignment.
        test_recipe:
          setup:
            - "Outing OPEN, start_format TEE_TIME, wave A 2026-09-19T12:00:00Z to 2026-09-19T16:30:00Z."
            - "Contract SIGNED with tee_interval_minutes 10 and cart_allowance_count 4."
            - "One registration for three players and three single-player teams ALPHA, BRAVO and CHARLIE."
            - "ALPHA already occupies hole 1 at 12:00, so its slot is [12:00, 12:10)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CourseOperations
            - call: "POST /outing-ops/outings"
              payload: { name: "Tee Sheet Open", beneficiary_name: "Northside Youth Fund", format: "STROKE_PLAY", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500, tee_interval_minutes: 10, cart_allowance_count: 4 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TRIO", kind: "INDIVIDUAL", price_cents: 90000, player_slots: 3, gsv_cents: 18000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Slot Testers", player_count: 3 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "S1", handicap_index: 12.0 }
              as: TournamentDirector
              captures: { p1_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "S2", handicap_index: 12.0 }
              as: TournamentDirector
              captures: { p2_id: $.data.id }
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r_id}", full_name: "S3", handicap_index: 12.0 }
              as: TournamentDirector
              captures: { p3_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 90000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "ALPHA", player_ids: ["${p1_id}"] }
              as: TournamentDirector
              captures: { tm_a: $.data.id }
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "BRAVO", player_ids: ["${p2_id}"] }
              as: TournamentDirector
              captures: { tm_b: $.data.id, tm_b_v: $.data.version }
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "CHARLIE", player_ids: ["${p3_id}"] }
              as: TournamentDirector
              captures: { tm_c: $.data.id, tm_c_v: $.data.version }
            - call: "GET /outing-ops/teams/${tm_a}"
              payload: {}
              as: CourseOperations
              captures: { tm_a_v: $.data.version }
            - call: "POST /outing-ops/teams/${tm_a}/tee-assignment"
              payload: { expected_team_version: "${tm_a_v}", wave: "A", starting_hole: 1, tee_time: "2026-09-19T12:00:00Z", cart_number: 1 }
              as: CourseOperations
          trigger:
            - call: "POST /outing-ops/teams/${tm_b}/tee-assignment"
              payload: { expected_team_version: "${tm_b_v}", wave: "A", starting_hole: 1, tee_time: "2026-09-19T12:10:00Z", cart_number: 2 }
              as: CourseOperations
            - call: "POST /outing-ops/teams/${tm_c}/tee-assignment"
