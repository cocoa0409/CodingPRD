          setup:
            - "Created in order: repA (REPORTER, 0 active), photogB (PHOTOGRAPHER, 0 active), repC (REPORTER, 2 ACCEPTED on [14:00,15:00) + [15:00,16:00)), repE (REPORTER, 1 ACCEPTED on [16:00,17:00)), repD (REPORTER, ON_LEAVE)"
