      - name: invoice_periods_must_be_elapsed_and_non_overlapping_unless_the_incumbent_is_void
        claim_type: Temporal validation
        grounds:
          - validations.priority_30
          - validations.priority_31
          - errors.ERR_INVOICE_PERIOD_NOT_ELAPSED
          - errors.ERR_INVOICE_PERIOD_OVERLAP
          - state_machines.ParticipationInvoice.ISSUED_to_VOID
          - calculations.participation_fee.invariant
        distinguishing_aspect: |
          The same period is refused, then accepted, then refused again, then accepted again, driven only
          by time and by the incumbent's status. billing_period_end 2026-09-01T00:00:00Z is in the future
          at the default clock (ERR_INVOICE_PERIOD_NOT_ELAPSED) but qualifies the instant the clock
          equals it - the comparison is strictly "later than", not "at or later than". A second invoice
          overlapping the issued one is refused, and VOID removes the incumbent from the overlap test
          (priority 30 lists ISSUED, PAID, DELINQUENT and WRITTEN_OFF only), so the identical period can
          be re-issued for the identical 267500 cents.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with declared_annual_patient_volume 120000, so the PROVISIONAL monthly volume is ceil(120000 / 12) == 10000 units, entirely inside TIER_1: 10000 x 1.75 == 17500, plus BASE_PLATFORM_FEE_CENTS 250000, times the UNGRADED multiplier 1.00 == 267500 cents."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Glassford Regional Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 120000, primary_contact_email: "hie@glassford.example" }
              as: HieAdmin
              captures: { pV6_id: $.data.id, pV6_fee: $.data.provisional_monthly_fee_cents, pV6_bal_0: $.data.outstanding_balance_cents }
            - call: "POST /hie/participants/${pV6_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pV6_id}"
            - call: "POST /hie/participants/${pV6_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
          trigger:
            - call: "POST /hie/participants/${pV6_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { errV6_a: $.data.error_id }
            - call: "POST /hie/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HieAdmin
              captures: { clockV6: $.data.current_utc }
            - call: "POST /hie/participants/${pV6_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { invV6_1: $.data.id, invV6_1_total: $.data.total_cents, invV6_1_status: $.data.status, invV6_1_volume: $.data.volume_fee_cents }
            - call: "GET /hie/participants/${pV6_id}"
              payload: {}
              as: HieAdmin
              captures: { pV6_bal_1: $.data.outstanding_balance_cents }
            - call: "POST /hie/participants/${pV6_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-15T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { errV6_b: $.data.error_id }
            - call: "POST /hie/participation-invoices/${invV6_1}/administrative-transitions"
              payload: { action: "VOID", reason: "Issued against the wrong basis variant; reissuing." }
              as: HieAdmin
              captures: { invV6_1_status_after: $.data.status }
            - call: "GET /hie/participants/${pV6_id}"
              payload: {}
              as: HieAdmin
              captures: { pV6_bal_2: $.data.outstanding_balance_cents }
            - call: "POST /hie/participants/${pV6_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { invV6_2: $.data.id, invV6_2_total: $.data.total_cents, invV6_2_status: $.data.status }
            - call: "GET /hie/participants/${pV6_id}"
              payload: {}
              as: HieAdmin
              captures: { pV6_bal_3: $.data.outstanding_balance_cents }
          assert:
            - "${pV6_fee} == 267500"
            - "${pV6_bal_0} == 0"
            - "${errV6_a} == ERR_INVOICE_PERIOD_NOT_ELAPSED"
            - "${clockV6} == 2026-09-01T00:00:00Z"
            - "${invV6_1_volume} == 17500"
            - "${invV6_1_total} == 267500"
            - "${invV6_1_status} == ISSUED"
            - "${pV6_bal_1} == 267500"
