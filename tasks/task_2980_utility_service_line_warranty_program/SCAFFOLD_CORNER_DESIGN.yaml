            - "GET /dispatches/${d1} reports status SUPERSEDED and cancellation_reason SUPERSEDED_BY_REDISPATCH"
            - "GET /contractors/${c_a} reports open_dispatch_count 0 and GET /contractors/${c_b} reports open_dispatch_count 1"
            - "GET /enrollments/${enrollment_id} reports annual_benefit_reserved_cents 156000  # the 228000 hold moved with the supersede, it did not add up"
            - "${breached} == [${d2}], ${probated} == [] and ${cancelled} == []  # the sweep is inclusive at exactly sla_deadline_at, and one breach is below SLA_BREACH_PROBATION_THRESHOLD 2"
            - "GET /dispatches/${d2} reports status SLA_BREACHED and cancellation_reason null; GET /contractors/${c_b} reports sla_breach_count 1, status ACTIVE and open_dispatch_count 0"
            - "GET /claims/${claim_id} still reports status DISPATCHED  # a breach is not a cancellation"

      - name: benefit_estimate_and_settlement_diverge_on_the_same_dispatch
        claim_type: variant_divergence
        grounds:
          - calculations.dispatch_benefit_settlement.variants
        excluded_because:
          difficulty_instance: benefit_provisional_estimate_vs_final_settlement_diverge
          rationale: "§1.8 runs both variants over one dispatch and asserts the provisional 228000 against the final waterfall settlement, including the direction and size of the delta, which is the whole divergence claim for this rule."

      - name: completion_reconciles_the_provisional_reservation_into_the_final_benefit
        claim_type: reconciliation
        grounds:
          - calculations.dispatch_benefit_settlement.reconciliation
        excluded_because:
          difficulty_instance: benefit_provisional_estimate_vs_final_settlement_diverge
          rationale: "The same §1.8 instance asserts that completion releases annual_benefit_reserved_cents before posting the BENEFIT_CHARGE, so the inter-variant delta never leaks into annual_benefit_used_cents - the reconciliation claim verbatim."

      - name: emergency_and_standard_weight_sets_pick_different_contractors
        claim_type: variant_selection
        grounds:
          - calculations.contractor_selection_score.variants
        excluded_because:
          difficulty_instance: contractor_score_emergency_and_standard_weights_pick_different_winners
          rationale: "§1.8 runs one identical contractor pool under a ROUTINE and an EMERGENCY claim and asserts the winner flips, which is the variant-selection claim for the only urgency-driven weight switch in the scaffold."

      - name: contractor_windows_touching_at_the_buffer_edge_conflict
        claim_type: interval_merge
        grounds:
          - calculations.contractor_visit_window_conflict
        excluded_because:
          difficulty_instance: contractor_visit_windows_collide_across_the_travel_buffer
          rationale: "§1.8 already walks the half-open-plus-buffer boundary at window_end + 44 and + 45 minutes and confirms that COMPLETED, CANCELLED, SLA_BREACHED and SUPERSEDED dispatches stop blocking."

      - name: campaign_drop_dates_inside_the_spacing_window_conflict
        claim_type: interval_merge
        grounds:
          - calculations.campaign_drop_window_conflict
        excluded_because:
          difficulty_instance: campaign_drop_dates_collide_inside_the_partner_spacing_window
          rationale: "§1.8 tests gap_days 20 versus exactly 21 against min_days_between_drops and shows that withdrawing a sibling frees its window, covering both the boundary and the state filter."

      - name: annual_usage_equal_to_the_cap_exhausts_it
        claim_type: aggregation
        grounds:
          - calculations.dispatch_benefit_settlement
          - state_machines.Enrollment.transitions.WITHIN_CAP_to_ANNUAL_CAP_EXHAUSTED
        excluded_because:
          difficulty_instance: annual_cap_exhausts_when_usage_equals_cap_exactly
          rationale: "§1.8 drives annual_benefit_used_cents to exactly annual_cap_cents and asserts the >= boundary flips cap_status, which is the running-total boundary claim for this aggregate."

  # ===========================================================================
  # Section 4 - validations
  # ===========================================================================
  - section: validations
    instances:

      - name: pagination_bounds_reject_limit_zero_and_limit_over_one_hundred
        claim_type: violation_to_error
        grounds:
          - validations.pagination-bounds
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The bounds are inclusive on both ends of the legal range: limit 0 and limit 101 are rejected while limit 1 and limit 100 are accepted, and a negative offset is rejected even though limit itself is legal - so the rule cannot be implemented as a single max check."
        test_recipe:
          setup:
            - "Two partners exist so that a limit of 1 leaves a second page to detect."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_a: $.data.id }
            - call: "POST /partners"
              payload: { name: "Cascadia Sewer", utility_type: "WASTEWATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_b: $.data.id }
          trigger:
            - call: "GET /partners?limit=0"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { err_low: $.data.error_id }
            - call: "GET /partners?limit=101"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { err_high: $.data.error_id }
            - call: "GET /partners?offset=-1"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { err_offset: $.data.error_id }
            - call: "GET /partners?limit=100"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { ok_first: "$.data[0].id", ok_second: "$.data[1].id" }
            - call: "GET /partners?limit=1&offset=1"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { page_first: "$.data[0].id" }
          assert:
            - "${err_low} == ERR_INVALID_PAGINATION with HTTP 400  # limit < 1"
            - "${err_high} == ERR_INVALID_PAGINATION with HTTP 400  # limit > 100"
            - "${err_offset} == ERR_INVALID_PAGINATION with HTTP 400  # offset < 0 with a defaulted, legal limit"
            - "limit=100 - HTTP 200 with response_type array, limit 100, offset 0, total_count 2, has_more false  # 100 is the inclusive ceiling"
            - "limit=100 - ${ok_first} == ${partner_a} and ${ok_second} == ${partner_b}  # created_at ASC"
            - "limit=1&offset=1 - HTTP 200 with limit 1, offset 1, total_count 2, has_more false and exactly one element ${page_first} == ${partner_b}  # limit 1 is the inclusive floor"
            - "GET /partners with no pagination parameters returns limit 10 and offset 0"

      - name: appeal_decided_by_the_denying_adjuster_is_segregation_of_duties
