      - name: lines_reconcile_and_release_hold_on_the_wrong_report_status_return_cost_report_state_invalid
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COST_REPORT_STATE_INVALID
          - validations.priority_70
          - state_machines.CostReport.status
        distinguishing_aspect: |
          RECONCILED is terminal for line appends AND for a second reconcile decision, while
          release-hold is legal only from RECONCILIATION_HELD - so release-hold on a perfectly
          healthy OPEN report is a state error, not a posture error. That distinction separates
          priority 70 from priority 74 and is the pair an implementation most easily conflates.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr: $.data.id }
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "03-100", quantity: 200, unit_rate: 62.5000, markup_pct: 0.0000, disputed: false }
              as: ConstructionManager
          trigger:
            - call: "POST /cost-reports/${cr}/release-hold"
              payload: { release_note: "nothing is being held" }
              as: OwnerRepresentative
              captures: { e1: $.data.error_id }
            - call: "POST /cost-reports/${cr}/reconcile"
              payload: { decision: "RECONCILE" }
              as: OwnerRepresentative
              captures: { crv: $.data.version }
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "03-200", quantity: 10, unit_rate: 100.0000, markup_pct: 0.0000, disputed: false }
              as: ConstructionManager
              captures: { e3: $.data.error_id }
            - call: "POST /cost-reports/${cr}/reconcile"
              payload: { decision: "DISPUTE" }
              as: OwnerRepresentative
              captures: { e4: $.data.error_id }
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_COST_REPORT_STATE_INVALID, NOT ERR_POSTURE_NOT_RECOVERED: the report is OPEN, so the status gate at priority 70 answers first"
            - "trigger call 2 returns 200 with status == RECONCILED and reported_cost_total == 12500.00 (200 * 62.5000)"
            - "trigger call 3 returns 409 with data.error_id == ERR_COST_REPORT_STATE_INVALID and CostReport.${cr}.line_count is still 1 with reported_cost_total still 12500.00"
            - "trigger call 4 returns 409 with data.error_id == ERR_COST_REPORT_STATE_INVALID: a RECONCILED report cannot be re-decided into DISPUTED"
            - "CostReport.${cr}.version == ${crv} after both refusals"

      - name: bond_claim_actions_out_of_order_or_on_an_unbonded_subcontract_return_bond_claim_state_invalid
