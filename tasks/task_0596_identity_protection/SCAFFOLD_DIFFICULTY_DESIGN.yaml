  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: thaw_window_closed_interval_touching_endpoint_collides
        grounds:
          - validations[priority=16]
          - errors[ERR_THAW_WINDOW_OVERLAP]
          - entities.ThawWindow.fields.window_start
          - entities.ThawWindow.fields.window_end
        distinguishing_aspect: |
          Interval semantics #1, on the BureauProfile resource: CLOSED intervals with capacity 1 —
          adjacency IS collision. A second window starting at exactly 12:00:00Z, the instant the first
          window ends, is rejected with ERR_THAW_WINDOW_OVERLAP because both endpoints are inclusive.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-05-01T00:00:00Z."
            - "Verified subscriber; the EQUIFAX BureauProfile driven to FROZEN (freeze-request FREEZE, then confirm)."
            - "One ThawWindow already scheduled on that profile: 2026-06-01T09:00:00Z .. 2026-06-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "to1@example.com", full_name: "Eve Sandoz", date_of_birth: "1982-02-22", ssn_last4: "3690", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "GET /idp/subscribers/${sub_id}/bureau-profiles"
              payload: {}
              as: PlatformAdmin
              captures: { bp_eq: "$.data[0].id" }
            - call: "POST /idp/bureau-profiles/${bp_eq}/freeze-request"
              payload: { action: "FREEZE" }
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /idp/bureau-profiles/${bp_eq}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/bureau-profiles/${bp_eq}/thaw-windows"
              payload: { window_start: "2026-06-01T09:00:00Z", window_end: "2026-06-01T12:00:00Z", purpose: "MORTGAGE_APPLICATION" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { tw1: $.data.id }
          trigger:
            - call: "POST /idp/bureau-profiles/${bp_eq}/thaw-windows"
              payload: { window_start: "2026-06-01T12:00:00Z", window_end: "2026-06-01T15:00:00Z", purpose: "AUTO_LOAN" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Trigger returns HTTP 409 with error_id == 'ERR_THAW_WINDOW_OVERLAP'  # closed intervals: 12:00:00Z is inside both"
            - "GET /idp/bureau-profiles/${bp_eq}/thaw-windows returns exactly 1 element (only ${tw1})"
            - "BureauProfile.${bp_eq}.freeze_status == FROZEN"
            - "A window of 2026-06-01T12:00:01Z .. 2026-06-01T15:00:00Z would instead be accepted"

      - name: engagement_half_open_plus_60min_buffer_capacity_conflict
        grounds:
          - validations[priority=17]
          - errors[ERR_ENGAGEMENT_CAPACITY_EXCEEDED]
          - entities.SpecialistEngagement.fields.window_start
          - entities.SpecialistEngagement.fields.window_end
          - entities.Specialist.fields.max_concurrent_engagements
        distinguishing_aspect: |
          Interval semantics #2, on a DIFFERENT resource entity (Specialist) and with DIFFERENT interval
          arithmetic from the ThawWindow rule: HALF-OPEN [start, end) intervals, each extended by a
          60-minute buffer past end, tested against an AGGREGATE capacity of
          max_concurrent_engagements = 1. A window starting at 11:00:00Z (exactly the first window's
          exclusive end) still collides because the buffer runs the first occupation to 12:00:00Z.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-05-01T00:00:00Z."
            - "One TIER2 specialist with max_caseload 3 and max_concurrent_engagements 1; one case assigned to them."
            - "One engagement already booked on that specialist: 2026-06-02T09:00:00Z .. 2026-06-02T11:00:00Z (buffer-extended occupation runs to 2026-06-02T12:00:00Z)."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ADVANTAGE", monthly_fee_cents: 1999, insurance_limit_cents: 500000, max_family_members: 2, child_monitoring_included: false, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "to2@example.com", full_name: "Sim Katz", date_of_birth: "1977-07-07", ssn_last4: "1470", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Sol Adeyemi", tier: "TIER2", max_caseload: 3, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "ACCOUNT_TAKEOVER", severity: "MEDIUM", source_detail: "bank login from new country" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v1: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", expected_specialist_version: "${sp_v1}" }
              as: PlatformAdmin
              captures: { eng1: $.data.id }
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v2: $.data.version }
          trigger:
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-06-02T11:00:00Z", window_end: "2026-06-02T12:00:00Z", expected_specialist_version: "${sp_v2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Trigger returns HTTP 409 with error_id == 'ERR_ENGAGEMENT_CAPACITY_EXCEEDED'  # buffer runs engagement 1 to 12:00:00Z and capacity is 1"
            - "GET /idp/specialist-engagements filtered by specialist_id == ${sp_id} returns exactly 1 element (only ${eng1})"
            - "RestorationCase.${case_id}.status == IN_PROGRESS (set by the first engagement, unchanged by the rejected one)"
            - "A window of 2026-06-02T12:00:00Z .. 2026-06-02T13:00:00Z would instead be accepted (half-open: the buffered occupation ends at 12:00:00Z exclusive)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pay_then_reverse_conserves_insurance_budget
        grounds:
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - state_machines.InsuranceClaim.PAID_to_REVERSED
          - calculations.insurance_remaining
          - entities.Subscriber.fields.insurance_remaining_cents
        distinguishing_aspect: |
          Conserved quantity #1 — MONEY. The invariant
          Plan.insurance_limit_cents == Subscriber.insurance_remaining_cents + sum(approved_cents over
          PAID claims) must hold before pay (500000 == 500000 + 0), after pay
          (500000 == 125497 + 374503), and after the compensating reverse (500000 == 500000 + 0), with
          insurance_remaining_cents landing back on exactly 500000 — zero drift.
        test_recipe:
          setup:
            - "Plan with insurance_limit_cents = 500000; verified subscriber; case resolved."
            - "Claim with the six-line expense array (LEGAL_FEES 120000 doc, LOST_WAGES 333333 doc, TRAVEL 4501 doc, TRAVEL 4501 doc, CHILDCARE 30001 undoc, NOTARY 2501 doc) submitted and APPROVED with approved_cents == 374503."
            - "Subscriber.insurance_remaining_cents is still 500000 and insurance_status AVAILABLE (approval alone does not move the ledger)."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "ci1@example.com", full_name: "Ada Lu", date_of_birth: "1986-06-16", ssn_last4: "7531", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Ivo Renn", tier: "TIER2", max_caseload: 3, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "SSN used for unemployment claim" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-05-15T09:00:00Z", window_end: "2026-05-15T11:00:00Z", expected_specialist_version: "${sp_v}" }
              as: PlatformAdmin
            - call: "POST /idp/restoration-cases/${case_id}/resolve"
              payload: { resolution_summary: "Unemployment claim voided." }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
            - call: "GET /idp/restoration-cases/${case_id}"
              payload: {}
              as: PlatformAdmin
              captures: { case_v: $.data.version }
            - call: "POST /idp/insurance-claims"
              payload:
                case_id: "${case_id}"
                expected_case_version: "${case_v}"
                expenses:
                  - { category: "LEGAL_FEES", amount_cents: 120000, documented: true }
                  - { category: "LOST_WAGES", amount_cents: 333333, documented: true }
                  - { category: "TRAVEL", amount_cents: 4501, documented: true }
                  - { category: "TRAVEL", amount_cents: 4501, documented: true }
                  - { category: "CHILDCARE", amount_cents: 30001, documented: false }
                  - { category: "NOTARY", amount_cents: 2501, documented: true }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /idp/insurance-claims/${claim_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /idp/insurance-claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-005"
          trigger:
            - call: "POST /idp/insurance-claims/${claim_id}/pay"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-011"
            - call: "POST /idp/insurance-claims/${claim_id}/reverse"
              payload: { reversal_reason: "Duplicate disbursement detected by treasury" }
              as: PlatformAdmin
              as_user_id: "admin-011"
          assert:
            - "Before trigger 1: Subscriber.${sub_id}.insurance_remaining_cents == 500000"
            - "After trigger 1: InsuranceClaim.${claim_id}.status == PAID AND Subscriber.${sub_id}.insurance_remaining_cents == 125497"
            - "After trigger 1: 500000 == 125497 + 374503 (limit == remaining + sum of approved_cents over PAID claims)"
            - "After trigger 2: InsuranceClaim.${claim_id}.status == REVERSED AND approved_cents is still 374503"
            - "After trigger 2: Subscriber.${sub_id}.insurance_remaining_cents == 500000 AND insurance_status == AVAILABLE"
            - "After trigger 2: 500000 == 500000 + 0 (no PAID claims remain; zero drift)"

      - name: assign_then_resolve_conserves_open_caseload
        grounds:
          - state_machines.RestorationCase.OPEN_to_ASSIGNED
          - state_machines.RestorationCase.IN_PROGRESS_to_RESOLVED
          - calculations.specialist_active_case_count
          - entities.Specialist.fields.active_case_count
          - state_machines.Specialist.AT_CAPACITY_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity #2 — a COUNT, not money, and therefore a different type of conserved
          quantity from the insurance-budget invariant. The invariant
          sum(Specialist.active_case_count) == count(RestorationCase with non-null specialist_id and
          status in {ASSIGNED, IN_PROGRESS, PENDING_SUBSCRIBER}) holds at 0 before assign, at 1 after
          assign, and returns to 0 after the compensating resolve, with Specialist.status flipping
          AVAILABLE -> AT_CAPACITY -> AVAILABLE around it.
        test_recipe:
          setup:
            - "One TIER2 specialist with max_caseload 1 (so a single case saturates them)."
            - "Verified subscriber with one confirmed-fraud alert, hence one OPEN case."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ADVANTAGE", monthly_fee_cents: 1999, insurance_limit_cents: 500000, max_family_members: 2, child_monitoring_included: false, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "ci2@example.com", full_name: "Roan Petit", date_of_birth: "1999-01-31", ssn_last4: "8642", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Wren Solo", tier: "TIER2", max_caseload: 1, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "email in breach list" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-05-16T09:00:00Z", window_end: "2026-05-16T11:00:00Z", expected_specialist_version: "${sp_v}" }
              as: PlatformAdmin
            - call: "POST /idp/restoration-cases/${case_id}/resolve"
              payload: { resolution_summary: "Credentials rotated; no loss." }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
          assert:
            - "Before trigger 1: Specialist.${sp_id}.active_case_count == 0 AND status == AVAILABLE"
            - "After trigger 1: Specialist.${sp_id}.active_case_count == 1 AND status == AT_CAPACITY"
            - "After trigger 4: Specialist.${sp_id}.active_case_count == 0 AND status == AVAILABLE (compensated, zero drift)"
            - "After trigger 4: RestorationCase.${case_id}.status == RESOLVED"
            - "After trigger 4: Alert.${a_id}.status == RESOLVED (cross-entity compensation hop)"
            - "After trigger 4: Subscriber.${sub_id}.risk_score == 10 AND underwriting_risk_score == 10 (the confirmed alert no longer contributes)"
