              as: TerminalOperator
              captures: { t1_w4: $.data.id }
          assert:
            - "t1_err_overlap == ERR_WINDOW_OVERLAP (intersection check fires before buffer check)"
            - "t1_err_buffer == ERR_WINDOW_BUFFER_VIOLATION (12h gap < 24h buffer)"
            - "ServiceWindow.${t1_w4} created with status PLANNED (exactly 24h after existing end passes — inclusive boundary)"
