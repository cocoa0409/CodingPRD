              as: TestEngineer
              captures: { fat_id: $.data.id }
            - call: "POST /factory-acceptance-tests/${fat_id}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-02-10T08:00:00Z" }
              as: TestEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /factory-acceptance-tests/${fat_id}/start"
              payload: { run_by_user_id: "u_te_1" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat_id}/test-reports"
              payload: { winding_temp_rise_c: 55, temp_rise_limit_c: 65, short_circuit_current_ka: 25, arc_duration_ms: 200, working_distance_mm: 455 }
              as: TestEngineer
              captures: { rep_id: $.data.id }
            - call: "POST /test-reports/${rep_id}/issue"
              payload: {}
              as: QualityEngineer
              as_user_id: "u_te_1"
            - call: "POST /factory-acceptance-tests/${fat_id}/conclude"
              payload: { result: "PASS" }
              as: TestEngineer
            - call: "GET /engineered-orders/${ord_id}"
              payload: {}
              as: PlantAdmin
              captures: { ord_v2: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/compliance-labels"
              payload: { submittal_drawing_id: "${dwg1_id}", test_report_id: "${rep_id}", generated_by_user_id: "u_co_1", expected_engineered_order_version: "${ord_v2}" }
              as: ComplianceOfficer
              captures: { lbl_id: $.data.id }
            - call: "POST /compliance-labels/${lbl_id}/generate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
            - call: "POST /compliance-labels/${lbl_id}/verify"
              payload: { verified_by_user_id: "u_qe_1" }
              as: QualityEngineer
              as_user_id: "u_qe_1"
            - call: "POST /compliance-labels/${lbl_id}/issue"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
            - call: "GET /engineered-orders/${ord_id}"
              payload: {}
              as: PlantAdmin
              captures: { ord_v3: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/shipment-releases"
              payload: { stage_index: 1, stage_share_bp: 10000, is_final_stage: true, expected_engineered_order_version: "${ord_v3}" }
              as: LogisticsCoordinator
              captures: { shp_id: $.data.id }
            - call: "POST /shipment-releases/${shp_id}/clear"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /shipment-releases/${shp_id}/stage"
              payload: {}
