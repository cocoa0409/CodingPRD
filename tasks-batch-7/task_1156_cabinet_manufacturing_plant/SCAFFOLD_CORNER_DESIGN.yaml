              payload: { order_line_id: "${l1_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/finish-batches/${fb_id}/assign"
              payload: { order_line_id: "${l2_id}" }
              as: FinishSupervisor
            - call: "POST /kcma/finish-batches/${fb_id}/qc-record"
              payload: { measured_delta_e: 1.0 }
              as: FinishSupervisor
            - call: "POST /kcma/delivery-routes"
              payload: { route_code: "RT-1", route_date: "2026-05-04", capacity_cu_ft: 100.0 }
              as: ShippingCoordinator
              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o_id}"
