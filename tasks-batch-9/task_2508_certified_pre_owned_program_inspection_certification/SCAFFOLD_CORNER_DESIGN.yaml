      - name: unknown_item_code_rejects_whole_results_batch
        claim_type: violation_to_error
        grounds:
          - validations.priority_17
          - errors.ERR_UNKNOWN_CHECKLIST_ITEM
          - state_machines.Inspection.DRAFT_to_IN_PROGRESS
        distinguishing_aspect: |
          The results PUT is all-or-nothing. A batch whose first two rows are perfectly valid and
          whose third names an item_code that exists on a DIFFERENT template must leave the
          inspection untouched: attempt_count stays 0, status stays DRAFT, and no InspectionResult
          row is written. An implementation that streams rows and validates as it goes leaves two
          orphan results and an attempt_count of 1.
        test_recipe:
          setup:
            - "Two published templates: MPI-172 with P1, S1, B1 and MPI-OTHER with the single item X9. Inspection I1 uses MPI-172 and is still DRAFT."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
