            - "BenefitPeriod.${per_sep_id}.allocated_cents == 62500 and rollover_in_cents == 12500"
            - "the ${ord_backdated_id} deliver returns 409 with error_id ERR_TAX_MONTH_LOCKED and the order stays CONFIRMED"
            - "the ${ord_sep_id} deliver succeeds and creates a second ImputedIncomeRecord for tax_month 2026-09 in status ACCRUING"
