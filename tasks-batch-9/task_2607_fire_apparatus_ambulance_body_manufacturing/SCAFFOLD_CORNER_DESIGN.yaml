            - "after POST /certification-tests: certification_status == \"IN_TESTING\" and build_status is still \"MID_CON_HELD\""
            - "after the PASS: certification_status == \"CERTIFIED\", build_status still \"MID_CON_HELD\", long_lead_status still \"CONFIRMED\", weight_status \"WITHIN_LIMITS\""

      - name: certification_retest_cycle_leaves_build_dimension_untouched
        claim_type: Idempotency
        grounds:
          - state_machines.UnitOrder.certification_status.REJECTED_TESTING_to_IN_TESTING
          - errors.ERR_INVALID_CERTIFICATION_STATE
        excluded_because:
          difficulty_instance: non_linear_state_machine / certification_retest_cycle_leaves_build_dimension_frozen
          rationale: "The named §1.8 instance already drives IN_TESTING -> REJECTED_TESTING -> IN_TESTING -> CERTIFIED with build_status pinned at MID_CON_HELD and asserts the third submission's 409 ERR_INVALID_CERTIFICATION_STATE."

      - name: change_order_negotiation_cycle_repeats_without_bound
        claim_type: Idempotency
        grounds:
          - state_machines.ChangeOrder.IN_NEGOTIATION_to_SUBMITTED
          - entities.ChangeOrder.fields.revision_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / change_order_negotiation_loop_increments_revision_count
          rationale: "The named §1.8 instance runs the SUBMITTED -> IN_NEGOTIATION -> SUBMITTED loop twice and asserts revision_count == 2 plus the 409 on revise from SUBMITTED."

      - name: approval_cascade_down_through_certification_and_trip
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.UnitOrder.certification_status.CERTIFIED_to_NOT_SUBMITTED
          - state_machines.InspectionTrip.SCHEDULED_to_CANCELLED_system
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_approval_cascades_weight_certification_build_and_trip
          rationale: "All four CASCADE A hops plus the ledger sync are asserted hop-by-hop by the named §1.8 instance."

      - name: supersede_cascade_voids_entries_and_flags_drift
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BidSpecification.RELEASED_to_SUPERSEDED
          - state_machines.ComplianceMatrixEntry.PENDING_to_VOID
        excluded_because:
          difficulty_instance: transitive_cascade / specification_supersede_cascades_void_drift_and_certification
          rationale: "CASCADE B hops 1-3 (SUPERSEDED, VOID entries, spec_drift_flag, INVALIDATED test) are asserted by the named §1.8 instance."

      - name: rescind_compensates_money_and_weight_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_RESCINDED
        excluded_because:
          difficulty_instance: compensating_invariant / rescind_restores_money_and_axle_loads_without_undoing_state_hops
          rationale: "The named §1.8 instance asserts the compensation and the deliberate non-compensation of certification, build and trip state."

      - name: reservation_release_cascade_frees_slot_and_cancels_trip
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChassisReservation.RESERVED_to_RELEASED
          - state_machines.InspectionTrip.SCHEDULED_to_CANCELLED_system
        excluded_because:
          difficulty_instance: compensating_invariant / reservation_release_conserves_slot_count_and_frees_bay_capacity
          rationale: "CASCADE C hops 1-3 (slot counts, AT_RISK long lead, cancelled PRE_CONSTRUCTION trip) are asserted by the named §1.8 instance."

      - name: production_start_guarded_on_program_and_reservation_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.UnitOrder.build_status.PRE_CON_HELD_to_IN_PRODUCTION
          - errors.ERR_PROGRAM_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / production_start_blocked_by_program_auto_suspension_from_sibling_award
          rationale: "The named §1.8 instance drives the guarded transition through ERR_PROGRAM_NOT_ACTIVE and ERR_SOFT_CEILING_STILL_BREACHED to a successful start-production."

  - section: calculations
    instances:

      - name: change_order_line_markup_tax_and_cap_boundary
        claim_type: Correct Result
        grounds:
          - calculations.change_order_price_delta
          - validations[priority=47]
          - validations[priority=3]
          - errors.ERR_MARKUP_CAP_EXCEEDED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          A two-line change order prices to exactly 1599300 — markup then 6.5% tax
          on the taxable line only, each rounded half-up — and the 22.0 markup cap
          is inclusive: 22.0 is admitted while 22.01 is 422
          ERR_MARKUP_CAP_EXCEEDED, and a 13-element line_items array is 400
          ERR_INVALID_REQUEST from the shape check at priority 3.
        test_recipe:
          setup:
            - "one UnitOrder at build_status MID_CON_HELD on an ACTIVE program with contract_ceiling_cents 400000000, with a HELD MID_CONSTRUCTION trip to hang change orders on"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Markup program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
            - call: "POST /plant-bays"
              payload: { name: "Bay A", max_concurrent_visitors: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", committee_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_pre_id: $.data.id }
            - call: "POST /inspection-trips/${trip_pre_id}/hold"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Freightline Custom Chassis", component_type: "CHASSIS", total_slot_count: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", unit_order_id: "${unit_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res_id: $.data.id }
            - call: "POST /chassis-reservations/${res_id}/confirm"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /unit-orders/${unit_id}/start-production"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "MID_CONSTRUCTION", scheduled_start: "2026-09-20T08:00:00Z", scheduled_end: "2026-09-20T16:00:00Z", committee_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { trip_mid_id: $.data.id }
            - call: "POST /inspection-trips/${trip_mid_id}/hold"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /unit-orders/${unit_id}"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_v1: $.data.version }
          trigger:
            - call: "POST /change-orders"
              payload: { unit_order_id: "${unit_id}", inspection_trip_id: "${trip_mid_id}", line_items: [{ description: "Stainless steel body upgrade", quantity: 2, unit_cost_cents: 500000, markup_pct: 22.0, is_taxable: true }, { description: "Committee travel reimbursement", quantity: 1, unit_cost_cents: 300000, markup_pct: 0.0, is_taxable: false }], weight_delta_front_kg: 0, weight_delta_rear_kg: 0, expected_unit_order_version: "${unit_v1}" }
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { co_ok_id: $.data.id }
            - call: "GET /unit-orders/${unit_id}"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_v2: $.data.version }
            - call: "POST /change-orders"
              payload: { unit_order_id: "${unit_id}", inspection_trip_id: "${trip_mid_id}", line_items: [{ description: "Chrome package", quantity: 1, unit_cost_cents: 400000, markup_pct: 22.01, is_taxable: true }], weight_delta_front_kg: 0, weight_delta_rear_kg: 0, expected_unit_order_version: "${unit_v2}" }
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { e_markup: $.data.error_id }
            - call: "POST /change-orders"
              payload: { unit_order_id: "${unit_id}", inspection_trip_id: "${trip_mid_id}", line_items: [{ description: "L1", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L2", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L3", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L4", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L5", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L6", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L7", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L8", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L9", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L10", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L11", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L12", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }, { description: "L13", quantity: 1, unit_cost_cents: 100, markup_pct: 0.0, is_taxable: false }], weight_delta_front_kg: 0, weight_delta_rear_kg: 0, expected_unit_order_version: "${unit_v2}" }
              as: CustomerCommitteeRep
              as_user_id: "${prog_id}"
              captures: { e_thirteen: $.data.error_id }
          assert:
            - "the first change order is admitted 201 with ChangeOrder.${co_ok_id}.price_delta_cents == 1599300 (line 1: base 1000000, marked 1220000, tax 79300 -> 1299300; line 2: 300000 with no tax)"
            - "ChangeOrder.${co_ok_id}.status == \"DRAFT\", revision_count == 0, raised_by_user_id == ${prog_id}, applied_at == null"
            - "UnitOrder.${unit_id}.open_change_order_count == 1 while change_order_total_cents is still 0 — only APPROVED change orders enter the total"
            - "${e_markup} == ERR_MARKUP_CAP_EXCEEDED with HTTP 422 — the cap is inclusive at 22.0, so 22.01 is the first rejected value"
            - "${e_thirteen} == ERR_INVALID_REQUEST with HTTP 400 — line_items may hold at most 12 elements"
            - "GET /change-orders?unit_order_id=${unit_id} returns total_count == 1 and UnitOrder.${unit_id}.open_change_order_count is still 1 after both rejections"

      - name: option_premium_and_tier_three_bond_rate_applied
        claim_type: Constants Applied
        grounds:
          - calculations.unit_award_price
          - entities.ApparatusProgram.fields.options_exercised_count
          - validations[priority=48]
          - errors.ERR_OPTION_LIMIT_EXCEEDED
        distinguishing_aspect: |
          On a 100000000-cent base awarded in its base year, the option unit adds a
          3.5% premium (3500000) and its 103500000 subtotal lands in bond tier 3
          (0.75%, fee 776250) for a price of 104276250, while the sibling base unit
          at subtotal 100000000 pays 750000 — and a second option award is 409
          ERR_OPTION_LIMIT_EXCEEDED because options_exercised_count already equals
          max_option_units 1.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with base_year 2026, base_unit_price_cents 100000000, escalation_index_pct_per_year 4.0, max_option_units 1, contract_ceiling_cents 800000000"
            - "one RELEASED specification on that program"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Option program", agency_name: "Metro Fire District", base_year: 2026, base_unit_price_cents: 100000000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 800000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Aerial spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "AERIAL", requirement_text: "105 ft rear mount aerial", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1", option_unit: true }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { opt_unit_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { base_unit_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1", option_unit: true }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { e_option: $.data.error_id }
          assert:
            - "UnitOrder.${opt_unit_id}.option_unit == true and price_cents == 104276250 (escalated 100000000, premium 3500000, subtotal 103500000 > BOND_TIER_2_MAX_CENTS so rate 0.75%, fee 776250)"
            - "UnitOrder.${base_unit_id}.option_unit == false and price_cents == 100750000 (subtotal 100000000 == BOND_TIER_2_MAX_CENTS, rate 1.00%, fee 750000)"
            - "ApparatusProgram.${prog_id}.options_exercised_count == 1 after the option award and stays 1 after the base award"
            - "ApparatusProgram.${prog_id}.committed_cents == 205026250 and status is still \"ACTIVE\" (soft ceiling 720000000)"
            - "${e_option} == ERR_OPTION_LIMIT_EXCEEDED with HTTP 409; options_exercised_count stays 1, committed_cents stays 205026250, and GET /unit-orders?program_id=${prog_id} returns total_count == 2"

      - name: compliance_score_input_set_filtering_across_dispositions
        claim_type: Input Set Filtering
        grounds:
          - calculations.compliance_readiness_score
          - entities.ComplianceMatrixEntry.fields.disposition
          - entities.SpecClause.fields.mandatory
        distinguishing_aspect: |
          The pinned four-clause reference is reproduced exactly: mandatory COMPLY +
          mandatory PENDING exception + optional ACCEPTED alternate + optional with
          NO entry gives strict 50.00 and provisional 87.50 over total_weight 8, and
          rejecting the pending exception drops provisional to 50.00 while strict
          stays 50.00.
        test_recipe:
          setup:
            - "one BidSpecification in DRAFT with clauses C1 (mandatory), C2 (mandatory), C3 (optional), C4 (optional)"
            - "entries: C1 COMPLY, C2 EXCEPTION left PENDING, C3 ALTERNATE disposed ACCEPTED, C4 answered by nobody"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Scoring program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Scoring spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C2", category: "AERIAL", requirement_text: "105 ft rear mount aerial", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c2_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C3", category: "PAINT", requirement_text: "Two tone paint scheme", mandatory: false, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c3_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C4", category: "ELECTRICAL", requirement_text: "Scene lighting package", mandatory: false, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c4_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c2_id}", response: "EXCEPTION", exception_text: "Offering 100 ft rear mount" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry2_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c3_id}", response: "ALTERNATE", exception_text: "Single colour with reflective striping" }
              as: BodyEngineer
              as_user_id: "eng-1"
              captures: { entry3_id: $.data.id }
            - call: "POST /compliance-entries/${entry3_id}/dispose"
              payload: { disposition: "ACCEPTED" }
              as: PurchasingOfficer
              as_user_id: "po-author"
          trigger:
            - call: "GET /specifications/${spec_id}"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /compliance-entries/${entry2_id}/dispose"
              payload: { disposition: "REJECTED", disposition_note: "Aerial reach is a hard requirement" }
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "GET /specifications/${spec_id}"
              as: PurchasingOfficer
              as_user_id: "po-author"
          assert:
            - "the first read shows clause_count == 4, mandatory_clause_count == 2, compliance_score_strict == 50.00 and compliance_score_provisional == 87.50 (total_weight 3+3+1+1 == 8; strict counts C1+C3 == 4; provisional counts C1+C2+C3 == 7)"
            - "the dispose returns 200 with ComplianceMatrixEntry.${entry2_id}.disposition == \"REJECTED\""
            - "the second read shows compliance_score_strict == 50.00 unchanged and compliance_score_provisional == 50.00 — a REJECTED exception leaves BOTH variants' compliant sets"
            - "C4 having no ComplianceMatrixEntry at all keeps its weight 1 in total_weight while contributing to neither numerator"
            - "restrictive_clause_ratio_pct == 0.00 throughout and the specification is still \"DRAFT\""

      - name: restrictive_ratio_counts_mandatory_clauses_only
        claim_type: Input Set Filtering
        grounds:
          - calculations.restrictive_clause_ratio
          - entities.SpecClause.fields.is_restrictive
          - entities.BidSpecification.fields.restrictive_clause_ratio_pct
        distinguishing_aspect: |
          Optional clauses never enter the ratio even when is_restrictive is true: a
          specification whose only clauses are two restrictive OPTIONAL ones reports
          the pinned empty-set value 0.00, and after three mandatory clauses of
          which one is restrictive the ratio is 33.33 (round_half_up of 100/3), not
          20.00 as an all-clause denominator would give.
        test_recipe:
          setup:
            - "one BidSpecification in DRAFT with no clauses yet"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Ratio program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Ratio spec" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /specifications/${spec_id}/clauses"
