  - rule_id: boundary_precision_check
    instances:
      - name: dead_pixel_ppm_exact_limit_passes
        grounds:
          - calculations.cabinet_dead_pixel_ppm
          - entities.DisplayModel.fields.dead_pixel_ppm_limit
          - state_machines.Cabinet.BURN_IN_to_BURN_IN_PASSED
          - state_machines.Cabinet.BURN_IN_to_QUARANTINED
        distinguishing_aspect: |
          Metric dead_pixel_ppm on endpoint POST /burn-in-runs/{id}/complete.
          FP10-IN has exactly 1024 pixels per cabinet, so one dead pixel is
          976.5625 ppm -> 976.56 after rounding, which is byte-equal to
          dead_pixel_ppm_limit. Three sibling cabinets in one chamber window
          straddle the limit at 0.00 (below), 976.56 (exactly at, must PASS
          because the comparison is <=) and 1953.13 (above, must QUARANTINE).
          Different metric and different endpoint from the SLA-deadline and
          empty-spare-pool boundaries in this block.
        test_recipe:
          setup:
            - "FP10-IN display model (cabinet_pixel_count 1024, dead_pixel_ppm_limit 976.56, burn_in_hours_required 24, module_dead_pixel_max 3)."
            - "A 3x1 RETAIL project, engineering APPROVED, with three cabinets at (1,1), (1,2), (1,3)."
            - "Each cabinet holds exactly one INSTALLED module: M-A with dead_pixel_count 0, M-B with 1, M-C with 2."
            - "Chamber CH-1 (slot_capacity 4, turnaround_minutes 60) holds three SCHEDULED runs over the same 24h window, 1 slot each (3 <= 4)."
            - "The clock has been advanced to the shared window_end."
