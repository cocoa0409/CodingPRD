- rule_id: cross_entity_state_dependency
  instances:
  - name: call_route_blocked_when_contract_closed
    grounds:
    - state_machines.Call.WAITING_to_ASSIGNED
    - entities.Contract.fields.status
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: 'Call -> Contract pair: the WAITING -> ASSIGNED transition''s

      precondition reads the parent Contract''s status; a CLOSED contract

      makes routing fail ERR_INVALID_STATE even though the call, queue and

      certified agent are all individually valid.

      '
    test_recipe:
      setup:
      - 'Clock at 2026-09-01. Contract created, SL activated, contract activated, then closed (no open invoices/incidents; queue closed first
        to satisfy the close precondition). One WAITING call remains... no: queue close requires no live calls, so the call is created AFTER closure
        is impossible (contract CLOSED blocks POST /calls? No — POST /calls has no contract-state precondition; only route does). Call registered
        while contract ACTIVE; queue emptied, queue closed, contract closed; then a fresh call is registered and routed.'
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - *id004
      - call: POST /queues/${q_id}/transition
        payload:
          to_status: CLOSED
        as: OpsManager
      - call: POST /contracts/${c_id}/transition
        payload:
          to_status: CLOSED
        as: OpsManager
      - call: POST /calls
        payload:
          contract_id: ${c_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          xcall: $.data.id
      trigger:
      - call: POST /calls/${xcall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
        captures:
          route_err: $.data.error_id
      assert:
      - the response status is 409 and route_err == ERR_INVALID_STATE (contract CLOSED)
      - Call.${xcall}.status remains WAITING with queue_id null
  - name: surge_window_multiplier_changes_staffing_target_and_gross
    grounds:
    - calculations.staffing_target
    - calculations.gross_fee
    - entities.SurgeWindow.fields.status
    - state_machines.SurgeWindow.DECLARED_to_ACTIVE
    distinguishing_aspect: 'InvoiceLine -> SurgeWindow pair (different pair than Call->Contract):

      the line''s staffing_target and the invoice''s gross_cents are computed

      from the surge window''s auto-transitioned state at period end — a

      window ACTIVE at the clock sets multiplier 1.5 (target 15, gross

      56000 for 1 agent... pinned: 50000 + round_half_up(4000*1.5) = 56000);

      the same window CANCELLED before activation drops the multiplier to

      1.0 (target 10, gross 54000) on otherwise identical data.

      '
