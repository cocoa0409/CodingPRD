              as_user_id: "${ag_st}"
              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "VEHICLE", description: "2019 Ford F-250 three-quarter ton pickup", acquisition_cost_cents: 3217467, acquisition_date: "2019-03-15", vin: "1FT7W2BT9KEB12345", odometer_reading: 184320, title_number: "TX-88231" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag_st}"
            - call: "POST /assets/${a1}/condition-assessments"
