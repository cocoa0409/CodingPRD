# =============================================================================
# Task 1198 — Planogram & Category Management Service (category captain agency)
# =============================================================================
# Difficulty target: harder than Expert (per task brief). Dense coupling between
# capacity math, dual-variant calculations, branching/cyclic state machines,
# cross-entity posture gating, and segregation-of-duties RBAC.

scenario: |
  1198. Planogram & Category Management Service (category captain agency):
  category role & assortment optimization, planogram authoring & store-cluster
  variants, shelf capacity vs demand days-of-supply, new-item cut-in &
  discontinuation timing, compliance audit & photo scoring, supplier funding &
  category captain conflict, space-to-sales analysis, reset labor scheduling

domain_name: planogram-category-management
api_prefix: /

# =============================================================================
# §0 — Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_target: "harder_than_expert"
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - segregation_of_duties

  entity_topology: hybrid
  state_machine_shape: compound  # plus branching + cyclic on individual machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 — Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 — Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Retailer name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: compliance_threshold_pct, type: integer, source: input, default: 85, description: "Minimum acceptable audit compliance score" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Category
    parent: Retailer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: code, type: string, source: input, description: "Category code (unique within retailer)" }
      - { name: role, type: enum, source: input, description: "DESTINATION | ROUTINE | CONVENIENCE | SEASONAL" }
      - { name: annual_sales_cents, type: integer, source: input, description: "Baseline annual sales used by space-to-sales" }
      - { name: total_linear_feet, type: integer, source: input, description: "Total shelf linear feet available for this category per store (per cluster variant)" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | ARCHIVED" }
      - { name: active_planogram_id, type: string, source: system, required: false, description: "Currently ACTIVE Planogram for this category (null until first activation)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Supplier
    parent: Retailer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: name, type: string, source: input, description: "Supplier name" }
      - { name: is_captain, type: boolean, source: input, default: false, description: "Whether this supplier currently serves as category captain" }
      - { name: captain_category_id, type: string, source: system, required: false, description: "FK -> Category.id; set when supplier is appointed captain of exactly one category" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Product
    parent: Retailer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: category_id, type: string, source: input, description: "FK -> Category.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: sku, type: string, source: input, description: "SKU code unique within retailer" }
      - { name: width_in, type: number, source: input, description: "Facings width per unit (inches)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per unit" }
      - { name: weekly_demand_units, type: integer, source: input, description: "Baseline weekly unit demand" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | LISTED | DISCONTINUING | DELISTED" }
      - { name: discontinuation_effective_date, type: datetime, source: input, required: false, description: "ISO date at which LISTED → DELISTED (must be set before DISCONTINUING → DELISTED transition completes)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Planogram
    parent: Category
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: category_id, type: string, source: system, description: "FK -> Category.id" }
      - { name: name, type: string, source: input, description: "Planogram name" }
      - { name: variant, type: enum, source: input, description: "BASE | CLUSTER_A | CLUSTER_B — variants targeting different store clusters" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | ACTIVE | SUPERSEDED | REJECTED" }
      - { name: version_note, type: string, source: input, required: false, description: "Author note" }
      - { name: total_facings, type: integer, source: computed, description: "Sum of facings across non-deleted lines" }
      - { name: total_capacity_units, type: integer, source: computed, description: "Sum of capacity_units across lines" }
      - { name: shelf_utilization_pct, type: number, source: computed, description: "Sum(width_in * facings) / (category.total_linear_feet * 12) * 100" }
      - { name: submitted_by_captain_supplier_id, type: string, source: system, required: false, description: "FK -> Supplier.id; recorded on /submit from X-User-ID of CategoryCaptain caller; used by segregation-of-duties check on /approve" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PlanogramLine
    parent: Planogram
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: planogram_id, type: string, source: system, description: "FK -> Planogram.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: position_index, type: integer, source: input, description: "Left-to-right shelf position; unique within planogram" }
      - { name: facings, type: integer, source: input, description: "Number of facings" }
      - { name: capacity_units, type: integer, source: input, description: "Units that fit on allocated shelf (>= facings)" }
      - { name: days_of_supply, type: number, source: computed, description: "capacity_units / (product.weekly_demand_units / 7)" }
      - { name: dos_flag, type: enum, source: computed, description: "UNDERSTOCK | OK | OVERSTOCK — computed per dos thresholds" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Store
    parent: Retailer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: store_code, type: string, source: input, description: "Unique store code within retailer" }
      - { name: cluster, type: enum, source: input, description: "BASE | CLUSTER_A | CLUSTER_B — which planogram variant this store executes" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: AuditEvent
    parent: Store
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id" }
      - { name: planogram_id, type: string, source: input, description: "FK -> Planogram.id being audited" }
      - { name: photo_url, type: string, source: input, description: "URL of audit photo" }
      - { name: submitted_by_role, type: enum, source: system, description: "Role that submitted (FieldAuditor)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCORED | REJECTED" }
      - { name: matched_facings, type: integer, source: system, required: false, description: "Facings judged compliant in the photo (set when scored)" }
      - { name: total_facings_expected, type: integer, source: system, required: false, description: "Planogram's total_facings snapshot at score time" }
      - { name: compliance_score_pct, type: integer, source: computed, required: false, description: "floor(100 * matched / expected); only set when status=SCORED" }
      - { name: compliance_outcome, type: enum, source: computed, required: false, description: "PASS | WARN | FAIL — derived from score vs thresholds" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FundingDeal
    parent: Retailer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: category_id, type: string, source: input, description: "FK -> Category.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id providing funding" }
      - { name: amount_cents, type: integer, source: input, description: "Funding amount" }
      - { name: starts_at, type: datetime, source: input, description: "Funding window start (ISO)" }
      - { name: ends_at, type: datetime, source: input, description: "Funding window end (ISO)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | ACTIVE | CLOSED | REJECTED" }
      - { name: coi_flag, type: enum, source: computed, description: "NONE | CAPTAIN_SELF_DEALING | CAPTAIN_BLOCKING_RIVAL — conflict-of-interest flag derived from captainship + affected planogram lines" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ResetProject
    parent: Category
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: category_id, type: string, source: system, description: "FK -> Category.id" }
      - { name: planogram_id, type: string, source: input, description: "FK -> Planogram.id to install (must be APPROVED)" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id where reset happens" }
      - { name: scheduled_start, type: datetime, source: input, description: "Reset window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Reset window end" }
      - { name: status, type: enum, source: system, description: "PROPOSED | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: labor_hours_estimated, type: number, source: computed, description: "facings_total * 0.05 + product_changes * 0.25 (rounded half-up to 0.1h)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ResetCrew
    parent: Retailer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: max_concurrent_projects, type: integer, source: input, default: 1, description: "Crew concurrency cap" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ResetAssignment
    parent: ResetProject
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: reset_project_id, type: string, source: system, description: "FK -> ResetProject.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> ResetCrew.id" }
      - { name: assigned_start, type: datetime, source: input, description: "Crew window start (must lie within project window)" }
      - { name: assigned_end, type: datetime, source: input, description: "Crew window end (must lie within project window)" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 — State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: CANDIDATE
    terminal_states: [DELISTED]
    transitions:
      - from: CANDIDATE
        to: LISTED
        trigger: "POST /retailers/{rid}/products/{pid}/list (cut-in)"
        actor: CategoryManager
        preconditions:
          - "category.status == OPEN"
          - "product has not previously been LISTED (no cut-in cycle) OR product is being cut-in after DELISTED (re-list allowed)"
        side_effects:
          - "set status=LISTED"

      - from: LISTED
        to: DISCONTINUING
        trigger: "POST /retailers/{rid}/products/{pid}/discontinue"
        actor: CategoryManager
        preconditions:
          - "discontinuation_effective_date is set on the product and is in the future"
        side_effects:
          - "set status=DISCONTINUING"
          - "any PlanogramLine on a DRAFT/IN_REVIEW planogram referencing this product is flagged (dos_flag recomputed to OVERSTOCK if demand would shrink)"

      - from: DISCONTINUING
        to: DELISTED
        trigger: "system — automatic at discontinuation_effective_date via run_clock"
        actor: system
        preconditions:
          - "current_utc >= discontinuation_effective_date"
        side_effects:
          - "set status=DELISTED"
          - "delete all PlanogramLine rows referencing this product on DRAFT/IN_REVIEW planograms (cascade)"
          - "for ACTIVE planograms: leave the line but flag it for reset (no auto-edit)"

      - from: DISCONTINUING
        to: LISTED
        trigger: "POST /retailers/{rid}/products/{pid}/cancel-discontinuation"
        actor: CategoryManager
        preconditions:
          - "current_utc < discontinuation_effective_date"
        side_effects:
          - "set status=LISTED"
          - "clear discontinuation_effective_date"

      - from: DELISTED
        to: CANDIDATE
        trigger: "POST /retailers/{rid}/products/{pid}/relist"
        actor: CategoryManager
        preconditions: []
        side_effects:
          - "set status=CANDIDATE (must go through list flow again)"

  - entity: Planogram
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/submit"
        actor: CategoryCaptain
        preconditions:
          - "category.status == OPEN"
          - "planogram has at least one PlanogramLine"
          - "shelf_utilization_pct <= 100"
        side_effects: []

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/approve"
        actor: CategoryManager
        preconditions:
          - "no PlanogramLine on the planogram references a Product with status == DELISTED"
          - "no PlanogramLine with dos_flag == UNDERSTOCK unless category.role == CONVENIENCE"
          - "segregation_of_duties: approver (CategoryManager user id) != original submitter's recorded captain_user_id"
        side_effects:
          - "if any FundingDeal for the same category with status=PROPOSED overlaps the planogram window: recompute coi_flag on those deals"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/reject"
        actor: CategoryManager
        preconditions: []
        side_effects:
          - "set status=REJECTED"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/activate"
        actor: CategoryManager
        preconditions:
          - "no other ACTIVE planogram for the same (category_id, variant)"
          - "category.status == OPEN"
        side_effects:
          - "set category.active_planogram_id = this planogram id when variant == BASE"
          - "any ResetProject referencing the previously-ACTIVE planogram of same (category_id, variant) in status PROPOSED or SCHEDULED transitions to CANCELLED (cascade)"
          - "any ResetAssignment under those cancelled projects transitions to RELEASED (cascade depth-2)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — automatic when another planogram for same (category_id, variant) becomes ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "set status=SUPERSEDED"
          - "if category.active_planogram_id pointed to this planogram: clear it (replaced by successor on BASE variant)"

      - from: APPROVED
        to: DRAFT
        trigger: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/return-to-draft"
        actor: CategoryCaptain
        preconditions:
          - "planogram has never been ACTIVE"
        side_effects: []

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/return-to-draft"
        actor: CategoryCaptain
        preconditions: []
        side_effects: []
        note: "Cyclic: author can iterate DRAFT → IN_REVIEW → DRAFT indefinitely until approved or rejected."

  - entity: AuditEvent
    initial_state: SUBMITTED
    terminal_states: [SCORED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /retailers/{rid}/stores/{sid}/audits/{aid}/score"
        actor: AuditReviewer
        preconditions:
          - "matched_facings is provided in payload"
          - "0 <= matched_facings <= planogram.total_facings (snapshot at submission)"
          - "referenced planogram.status in {ACTIVE, SUPERSEDED}"
        side_effects:
          - "compute compliance_score_pct = floor(100 * matched_facings / total_facings_expected)"
          - "compute compliance_outcome via thresholds (PASS/WARN/FAIL)"
          - "if compliance_outcome == FAIL and planogram.status == ACTIVE: create a new PROPOSED ResetProject for (store_id, planogram.category_id, planogram_id) with a 14-day window starting tomorrow (cascade)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retailers/{rid}/stores/{sid}/audits/{aid}/reject"
        actor: AuditReviewer
        preconditions: []
        side_effects: []

  - entity: FundingDeal
    initial_state: PROPOSED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /retailers/{rid}/funding-deals/{fdid}/approve"
        actor: RetailerAdmin
        preconditions:
          - "supplier.status implicitly valid (supplier exists)"
          - "coi_flag != CAPTAIN_BLOCKING_RIVAL — deals flagged as blocking rival require rejection path instead"
        side_effects:
          - "set status=APPROVED"

      - from: APPROVED
        to: ACTIVE
        trigger: "system — automatic at starts_at via run_clock"
        actor: system
        preconditions:
          - "current_utc >= starts_at"
        side_effects:
          - "set status=ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "system — automatic at ends_at via run_clock"
        actor: system
        preconditions:
          - "current_utc >= ends_at"
        side_effects:
          - "set status=CLOSED"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /retailers/{rid}/funding-deals/{fdid}/reject"
        actor: RetailerAdmin
        preconditions: []
        side_effects:
          - "set status=REJECTED"

  - entity: ResetProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: SCHEDULED
        trigger: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/schedule"
        actor: ResetCoordinator
        preconditions:
          - "scheduled_start < scheduled_end"
          - "no other ResetProject for same store_id in {SCHEDULED, IN_PROGRESS} whose [scheduled_start, scheduled_end) overlaps this window"
          - "referenced planogram.status == APPROVED or ACTIVE"
        side_effects:
          - "set status=SCHEDULED"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system — automatic at scheduled_start via run_clock"
        actor: system
        preconditions:
          - "current_utc >= scheduled_start"
        side_effects:
          - "set status=IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/complete"
        actor: ResetCoordinator
        preconditions:
          - "at least one ResetAssignment with status=ASSIGNED exists on this project"
        side_effects:
          - "set status=COMPLETED"
          - "release all ASSIGNED ResetAssignments (status=RELEASED)"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/cancel"
        actor: ResetCoordinator
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/cancel"
        actor: ResetCoordinator
        preconditions: []
        side_effects:
          - "release all ASSIGNED ResetAssignments"

  - entity: Category
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /retailers/{rid}/categories/{cid}/lock"
        actor: CategoryManager
        preconditions: []
        side_effects:
          - "set status=LOCKED"
          - "block any new Product cut-in and any new Planogram submission under this category"

      - from: LOCKED
        to: OPEN
        trigger: "POST /retailers/{rid}/categories/{cid}/unlock"
        actor: CategoryManager
        preconditions: []
        side_effects:
          - "set status=OPEN"

      - from: OPEN
        to: ARCHIVED
        trigger: "POST /retailers/{rid}/categories/{cid}/archive"
        actor: CategoryManager
        preconditions:
          - "no Planogram in {DRAFT, IN_REVIEW, APPROVED, ACTIVE} for this category"
          - "no ResetProject in {PROPOSED, SCHEDULED, IN_PROGRESS} for this category"
        side_effects:
          - "set status=ARCHIVED"
          - "all LISTED products in this category → DISCONTINUING with effective_date = now (cascade)"

  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions: []
    note: "Supplier has no status field beyond creation; captainship is data, not a state machine."

# =============================================================================
# §1.2.1 — Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: planogram-activate-stale-category
    parent_entity: Category
    write_endpoint: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/activate"
    occ_field: "expected_category_version"
    description: |
      Activating a Planogram against a Category whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      writer has just activated a different planogram on the same (category,
      variant) — which legitimately supersedes the prior one — and the current
      writer's view of the category is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: product-discontinue-stale-product
    parent_entity: Product
    write_endpoint: "POST /retailers/{rid}/products/{pid}/discontinue"
    occ_field: "expected_product_version"
    description: |
      Discontinuing a Product whose version has advanced since the client last
      observed it is rejected. A preceding mutation (e.g., a cut-in/list or a
      prior cancel-discontinuation) legitimately advanced the product version,
      so a second writer holding the older version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: funding-approve-stale-deal
    parent_entity: FundingDeal
    write_endpoint: "POST /retailers/{rid}/funding-deals/{fdid}/approve"
    occ_field: "expected_funding_deal_version"
    description: |
      Approving a FundingDeal whose version has advanced since the client last
      observed it is rejected. A prior approve/reject or a coi_flag recompute
      (triggered by a planogram approval) already bumped the deal's version, so
      the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reset-schedule-stale-project
    parent_entity: ResetProject
    write_endpoint: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/schedule"
    occ_field: "expected_reset_project_version"
    description: |
      Scheduling a ResetProject whose version has advanced since the client
      last observed it is rejected. A preceding cancel/side-effect cascade
      bumped the project version, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 — Calculation Rules Table
# =============================================================================
calculations:
  - name: days_of_supply
    trigger: "on PlanogramLine create/update; on Product.weekly_demand_units change; on capacity_units change"
    algorithm: forward_looking
    formula: |
      dos = capacity_units / (product.weekly_demand_units / 7.0)
      if product.weekly_demand_units == 0:
        dos = +infinity  (encoded as 9999.0 sentinel)
    input_set: "PlanogramLine joined to Product; Product.status must be in {LISTED, DISCONTINUING} — CANDIDATE/DELISTED products do not contribute to dos"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "while planogram.status in {DRAFT, IN_REVIEW} — uses current weekly_demand_units snapshot, no rounding to shelf-pack multiples"
        difference: "returns raw float; sentinel 9999.0 used for zero-demand"
      - name: finalized
        when: "when planogram transitions to APPROVED — dos is recomputed and snapped down to the nearest 0.5-day boundary (floor to 0.5 step); sentinel preserved"
        difference: "snapped to 0.5-day grid; the same line may produce a different (smaller-or-equal) dos after approval than it did as DRAFT"

  - name: dos_flag_classification
    trigger: "after days_of_supply recompute"
    algorithm: threshold
    formula: |
      if dos < DOS_UNDERSTOCK_DAYS:  flag = UNDERSTOCK
      elif dos > DOS_OVERSTOCK_DAYS: flag = OVERSTOCK
      else:                          flag = OK
      # boundary is EXACTLY: dos == DOS_UNDERSTOCK_DAYS counts as OK (>=);
      # dos == DOS_OVERSTOCK_DAYS counts as OK (<=)
    constants:
      DOS_UNDERSTOCK_DAYS: 3.0
      DOS_OVERSTOCK_DAYS: 21.0
    input_set: "single PlanogramLine"
    precision: "threshold comparison on rounded dos value"

  - name: space_to_sales_share_gap
    trigger: "on demand — via GET /retailers/{rid}/categories/{cid}/space-to-sales"
    algorithm: aggregation
    formula: |
      For the category's ACTIVE planogram (per variant):
        space_share_pct[line] = 100 * (line.facings * product.width_in) / sum(all lines facings*width)
        sales_share_pct[line] = 100 * product.weekly_demand_units / sum(all lines weekly_demand_units)
        gap_pct[line] = space_share_pct[line] - sales_share_pct[line]
    input_set: "ACTIVE planogram(s) of the category; lines joined to Product where Product.status == LISTED"
    precision: "2 decimal places, round_half_up; per-line rounding applied BEFORE the sum check"
    variants:
      - name: absolute_gap
        when: "default"
        difference: "gap_pct as signed percentage-point difference"
      - name: indexed_ratio
        when: "when ?mode=indexed query param supplied"
        difference: "gap_ratio = space_share / sales_share (division-by-zero when sales_share == 0 → +infinity encoded as 999.0); same input lines, different output magnitude"

  - name: labor_hours_estimate
    trigger: "on ResetProject create/update; on Planogram total_facings change while project is PROPOSED"
    algorithm: aggregation
    formula: |
      product_changes = count of PlanogramLine on target planogram whose product_id is not present on the store's currently-installed planogram for the category (or all lines if no install yet)
      raw = planogram.total_facings * 0.05 + product_changes * 0.25
      labor_hours_estimated = round_half_up(raw, 1)   # one decimal
    input_set: "ResetProject + target Planogram + store's installed planogram"
    precision: "1 decimal place, round_half_up"

  - name: compliance_score
    trigger: "on AuditEvent score"
    algorithm: aggregation
    formula: |
      if total_facings_expected == 0:
        compliance_score_pct = 0
      else:
        compliance_score_pct = floor(100 * matched_facings / total_facings_expected)
    input_set: "single AuditEvent"
    precision: "integer percent, floor"

  - name: compliance_outcome_classification
    trigger: "after compliance_score compute"
    algorithm: threshold
    formula: |
      if compliance_score_pct >= retailer.compliance_threshold_pct: outcome = PASS
      elif compliance_score_pct >= retailer.compliance_threshold_pct - 10: outcome = WARN
      else: outcome = FAIL
      # boundary: score == threshold → PASS (>=, not >)
    input_set: "single AuditEvent + Retailer"
    precision: "integer comparison on already-floored score"

  - name: shelf_utilization
    trigger: "on PlanogramLine create/update/delete; on Product.width_in change for products on the planogram"
    algorithm: aggregation
    formula: |
      used_inches = sum(line.facings * product.width_in for lines in planogram where product.status in {LISTED, DISCONTINUING})
      available_inches = category.total_linear_feet * 12
      shelf_utilization_pct = 100 * used_inches / available_inches
      # round to 1 decimal, half-up
    input_set: "Planogram joined to Category and Product"
    precision: "1 decimal place, round_half_up"

  - name: captain_conflict_flag
    trigger: "on FundingDeal create; on Planogram approval affecting the same category; on Supplier captainship change"
    algorithm: constraint_propagation
    formula: |
      Let S = supplier funding the deal; C = deal.category_id
      if S.is_captain AND S.captain_category_id == C:
        # captain funding own category — scrutinize affected lines
        affected = lines in any APPROVED/ACTIVE planogram of C where product.supplier_id == S.id
        rival_lines = lines in same planograms where product.supplier_id != S.id
        if affected increases share of shelf vs prior ACTIVE planogram AND rival_lines decreases:
          coi_flag = CAPTAIN_SELF_DEALING
        else:
          coi_flag = NONE
      elif S.is_captain AND S.captain_category_id != C:
        coi_flag = NONE   # captain of another category — fine
      else:
        # non-captain supplier: check whether a rival captain's planogram excludes this supplier
        C_captain = the supplier with captain_category_id == C (if any)
        if C_captain exists AND no PlanogramLine in any APPROVED/ACTIVE planogram of C references a product with supplier_id == S.id:
          coi_flag = CAPTAIN_BLOCKING_RIVAL
        else:
          coi_flag = NONE
    input_set: "FundingDeal + Supplier + Captain + Planograms + PlanogramLines"
    precision: "enum outcome"

  - name: reset_window_overlap
    trigger: "on ResetProject schedule; on ResetAssignment create"
    algorithm: interval_merge
    formula: |
      Two ResetProjects conflict if same store_id AND
        [a.scheduled_start, a.scheduled_end) ∩ [b.scheduled_start, b.scheduled_end) ≠ ∅
      # half-open: a.scheduled_end == b.scheduled_start does NOT conflict (back-to-back allowed)
      Two ResetAssignments conflict if same crew_id AND
        [a.assigned_start, a.assigned_end) ∩ [b.assigned_start, b.assigned_end) ≠ ∅
      # aggregate capacity: count of ASSIGNED assignments on the crew at any instant
      # must not exceed crew.max_concurrent_projects
    input_set: "ResetProject (same store) / ResetAssignment (same crew)"
    precision: "datetime compare, half-open intervals"

# =============================================================================
# §1.4 — Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to invoke the endpoint (RBAC matrix)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters resolve to existing entities within the same retailer scope (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC expected_*_version (when present) matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "OCC-guarded endpoints (activate, discontinue, approve funding, schedule reset)"

  - priority: 5
    category: state
    check: "Entity in correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "segregation-of-duties: CategoryManager approving a planogram must not be the same user-id as the CategoryCaptain who submitted it"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/approve"

  - priority: 7
    category: business_safety
    check: "coi_flag != CAPTAIN_BLOCKING_RIVAL for funding-deal approval"
    error_id: ERR_CAPTAIN_CONFLICT
    http_status: 422
    applies_to: "POST /retailers/{rid}/funding-deals/{fdid}/approve"

  - priority: 8
    category: business_temporal
    check: "ResetProject window: scheduled_start < scheduled_end; no overlap with same-store project in {SCHEDULED, IN_PROGRESS} using half-open interval arithmetic"
    error_id: ERR_RESET_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/schedule"

  - priority: 9
    category: business_temporal
    check: "ResetAssignment window must lie inside its project's window and not overlap another ASSIGNED assignment for the same crew (half-open); crew concurrent-project cap must not be exceeded at any instant"
    error_id: ERR_CREW_OVERLAP
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/reset-projects/{rpid}/assignments"

  - priority: 10
    category: business_referential
    check: "Referenced Product must exist, be in {LISTED, DISCONTINUING} for PlanogramLine create"
    error_id: ERR_PRODUCT_NOT_LISTABLE
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/lines"

  - priority: 11
    category: business_constraint
    check: "Planogram submission: shelf_utilization_pct <= 100; at least one line; no line references DELISTED product"
    error_id: ERR_PLANOGRAM_INVALID
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/submit"

  - priority: 12
    category: business_constraint
    check: "Planogram approval: no UNDERSTOCK line unless category.role == CONVENIENCE"
    error_id: ERR_UNDERSTOCK_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/approve"

  - priority: 13
    category: business_constraint
    check: "Planogram activation: no other ACTIVE planogram for same (category_id, variant)"
    error_id: ERR_DUPLICATE_ACTIVE_VARIANT
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/activate"

  - priority: 14
    category: business_temporal
    check: "Product discontinuation: discontinuation_effective_date must be in the future at the moment of /discontinue"
    error_id: ERR_DISCONTINUATION_DATE_PAST
    http_status: 422
    applies_to: "POST /retailers/{rid}/products/{pid}/discontinue"

  - priority: 15
    category: business_constraint
    check: "Category archive: no non-terminal planogram, no non-terminal reset project"
    error_id: ERR_CATEGORY_HAS_OPEN_WORK
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/archive"

  - priority: 16
    category: business_constraint
    check: "Audit score: matched_facings in [0, total_facings_expected]"
    error_id: ERR_AUDIT_SCORE_RANGE
    http_status: 422
    applies_to: "POST /retailers/{rid}/stores/{sid}/audits/{aid}/score"

  - priority: 17
    category: business_constraint
    check: "PlanogramLine: capacity_units >= facings >= 1; position_index unique within planogram"
    error_id: ERR_LINE_INVALID
    http_status: 422
    applies_to: "POST /retailers/{rid}/categories/{cid}/planograms/{pid}/lines"

# =============================================================================
# §1.5 — API Endpoint Table
# =============================================================================
endpoints:
  # --- Retailer ---
  - method: POST
    path: "/retailers"
    description: "Create retailer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "compliance_threshold_pct?"]
    output: Retailer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/retailers/{id}"
    description: "Get retailer"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  # --- Category ---
  - method: POST
    path: "/retailers/{id}/categories"
    description: "Create category"
    roles: [CategoryManager]
    code: 201
    input: [code, role, annual_sales_cents, total_linear_feet]
    output: Category
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/retailers/{id}/categories"
    description: "List categories"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: "Category[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/categories/{cid}"
    description: "Get category"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: Category
    side_effects: []

  - method: POST
    path: "/retailers/{id}/categories/{cid}/lock"
    description: "Lock category"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Category
    side_effects: ["status → LOCKED"]

  - method: POST
    path: "/retailers/{id}/categories/{cid}/unlock"
    description: "Unlock category"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Category
    side_effects: ["status → OPEN"]

  - method: POST
    path: "/retailers/{id}/categories/{cid}/archive"
    description: "Archive category"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Category
    side_effects: ["status → ARCHIVED; LISTED products → DISCONTINUING"]

  - method: GET
    path: "/retailers/{id}/categories/{cid}/space-to-sales"
    description: "Space-to-sales analysis for category"
    roles: [CategoryManager, CategoryCaptain, RetailerAdmin]
    code: 200
    input: ["mode?"]
    output: "{ lines: [{planogram_line_id, product_id, space_share_pct, sales_share_pct, gap_pct? , gap_ratio?}] }"
    side_effects: []

  # --- Supplier ---
  - method: POST
    path: "/retailers/{id}/suppliers"
    description: "Create supplier"
    roles: [RetailerAdmin]
    code: 201
    input: [name]
    output: Supplier
    side_effects: ["is_captain=false"]

  - method: GET
    path: "/retailers/{id}/suppliers"
    description: "List suppliers"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain]
    code: 200
    input: []
    output: "Supplier[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/suppliers/{sid}"
    description: "Get supplier"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/retailers/{id}/suppliers/{sid}/appoint-captain"
    description: "Appoint supplier as captain of a category"
    roles: [RetailerAdmin]
    code: 200
    input: [category_id]
    output: Supplier
    side_effects:
      - "set is_captain=true; captain_category_id=category_id"
      - "if another supplier was captain of that category: that supplier.is_captain=false and captain_category_id=null (single-captain invariant)"
      - "recompute coi_flag on all PROPOSED/APPROVED FundingDeals in that category"

  # --- Product ---
  - method: POST
    path: "/retailers/{id}/products"
    description: "Create product (CANDIDATE)"
    roles: [CategoryManager, CategoryCaptain]
    code: 201
    input: [category_id, supplier_id, sku, width_in, unit_cost_cents, weekly_demand_units]
    output: Product
    side_effects: ["status=CANDIDATE"]

  - method: GET
    path: "/retailers/{id}/products"
    description: "List products (optionally filter by category_id, supplier_id, status)"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: ["category_id?", "supplier_id?", "status?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/products/{pid}"
    description: "Get product"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/retailers/{id}/products/{pid}/list"
    description: "Cut-in / list product"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status → LISTED"]

  - method: POST
    path: "/retailers/{id}/products/{pid}/discontinue"
    description: "Discontinue product (OCC on product)"
    roles: [CategoryManager]
    code: 200
    input: [discontinuation_effective_date, expected_product_version]
    output: Product
    side_effects: ["status → DISCONTINUING; increments Product.version by 1"]

  - method: POST
    path: "/retailers/{id}/products/{pid}/cancel-discontinuation"
    description: "Cancel discontinuation"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status → LISTED; clear discontinuation_effective_date"]

  - method: POST
    path: "/retailers/{id}/products/{pid}/relist"
    description: "Re-list delisted product (back to CANDIDATE)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status → CANDIDATE"]

  # --- Planogram ---
  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms"
    description: "Create planogram (DRAFT)"
    roles: [CategoryCaptain, CategoryManager]
    code: 201
    input: [name, variant, "version_note?"]
    output: Planogram
    side_effects: ["status=DRAFT; total_facings=0; total_capacity_units=0; shelf_utilization_pct=0"]

  - method: GET
    path: "/retailers/{id}/categories/{cid}/planograms"
    description: "List planograms for category"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: ["variant?", "status?"]
    output: "Planogram[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}"
    description: "Get planogram"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: Planogram
    side_effects: []

  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/submit"
    description: "Submit planogram for review"
    roles: [CategoryCaptain]
    code: 200
    input: []
    output: Planogram
    side_effects: ["status → IN_REVIEW; record submitter captain_user_id"]

  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/approve"
    description: "Approve planogram (segregation-of-duties enforced)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Planogram
    side_effects: ["status → APPROVED; finalize dos per finalized variant; recompute coi_flag on PROPOSED funding deals in same category"]

  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/reject"
    description: "Reject planogram"
    roles: [CategoryManager]
    code: 200
    input: []
    output: Planogram
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/return-to-draft"
    description: "Return planogram to DRAFT (author iterate)"
    roles: [CategoryCaptain]
    code: 200
    input: []
    output: Planogram
    side_effects: ["status → DRAFT"]

  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/activate"
    description: "Activate planogram (OCC on category)"
    roles: [CategoryManager]
    code: 200
    input: [expected_category_version]
    output: Planogram
    side_effects:
      - "status → ACTIVE; increments Category.version by 1"
      - "previously-ACTIVE planogram of same (category_id, variant) → SUPERSEDED"
      - "ResetProject referencing superseded planogram in {PROPOSED, SCHEDULED} → CANCELLED; their ASSIGNED ResetAssignments → RELEASED"

  # --- PlanogramLine ---
  - method: POST
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/lines"
    description: "Add line to planogram"
    roles: [CategoryCaptain, CategoryManager]
    code: 201
    input: [product_id, position_index, facings, capacity_units]
    output: PlanogramLine
    side_effects: ["compute dos + dos_flag; recompute planogram totals and shelf_utilization_pct"]

  - method: GET
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/lines"
    description: "List lines of planogram"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: "PlanogramLine[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/lines/{lid}"
    description: "Get planogram line"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: PlanogramLine
    side_effects: []

  - method: DELETE
    path: "/retailers/{id}/categories/{cid}/planograms/{pid}/lines/{lid}"
    description: "Delete planogram line (DRAFT only)"
    roles: [CategoryCaptain, CategoryManager]
    code: 204
    input: []
    output: null
    side_effects: ["recompute planogram totals and shelf_utilization_pct"]

  # --- Store ---
  - method: POST
    path: "/retailers/{id}/stores"
    description: "Create store"
    roles: [RetailerAdmin]
    code: 201
    input: [store_code, cluster]
    output: Store
    side_effects: []

  - method: GET
    path: "/retailers/{id}/stores"
    description: "List stores"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: ["cluster?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/stores/{sid}"
    description: "Get store"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain, FieldAuditor, AuditReviewer, ResetCoordinator]
    code: 200
    input: []
    output: Store
    side_effects: []

  # --- Audit ---
  - method: POST
    path: "/retailers/{id}/stores/{sid}/audits"
    description: "Submit audit event (photo)"
    roles: [FieldAuditor]
    code: 201
    input: [planogram_id, photo_url]
    output: AuditEvent
    side_effects: ["status=SUBMITTED; snapshot total_facings_expected from planogram at submission time"]

  - method: GET
    path: "/retailers/{id}/stores/{sid}/audits"
    description: "List audits for store"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, FieldAuditor, AuditReviewer]
    code: 200
    input: ["status?"]
    output: "AuditEvent[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/stores/{sid}/audits/{aid}"
    description: "Get audit"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, FieldAuditor, AuditReviewer]
    code: 200
    input: []
    output: AuditEvent
    side_effects: []

  - method: POST
    path: "/retailers/{id}/stores/{sid}/audits/{aid}/score"
    description: "Score audit"
    roles: [AuditReviewer]
    code: 200
    input: [matched_facings]
    output: AuditEvent
    side_effects: ["status → SCORED; compute compliance_score_pct and compliance_outcome; on FAIL with ACTIVE planogram → create PROPOSED ResetProject"]

  - method: POST
    path: "/retailers/{id}/stores/{sid}/audits/{aid}/reject"
    description: "Reject audit"
    roles: [AuditReviewer]
    code: 200
    input: []
    output: AuditEvent
    side_effects: ["status → REJECTED"]

  # --- Funding ---
  - method: POST
    path: "/retailers/{id}/funding-deals"
    description: "Propose funding deal"
    roles: [RetailerAdmin, CategoryCaptain]
    code: 201
    input: [category_id, supplier_id, amount_cents, starts_at, ends_at]
    output: FundingDeal
    side_effects: ["status=PROPOSED; compute coi_flag"]

  - method: GET
    path: "/retailers/{id}/funding-deals"
    description: "List funding deals"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain]
    code: 200
    input: ["category_id?", "supplier_id?", "status?"]
    output: "FundingDeal[]"
    side_effects: []

  - method: GET
    path: "/retailers/{id}/funding-deals/{fdid}"
    description: "Get funding deal"
    roles: [PlatformAdmin, RetailerAdmin, CategoryManager, CategoryCaptain]
    code: 200
    input: []
    output: FundingDeal
    side_effects: []

  - method: POST
    path: "/retailers/{id}/funding-deals/{fdid}/approve"
    description: "Approve funding deal (OCC on deal)"
