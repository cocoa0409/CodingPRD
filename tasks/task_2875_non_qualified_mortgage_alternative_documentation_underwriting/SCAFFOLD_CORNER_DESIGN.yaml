          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: "Five requests each violate two or three rules at once and every one returns the LOWEST-priority-number error: a missing role header on a non-existent loan id yields ERR_MISSING_ROLE_HEADER (not 404), an unknown role yields ERR_UNKNOWN_ROLE, a wrong-role create with a bad foreign key yields ERR_UNAUTHORIZED, a correct role with a bad foreign key and a missing field yields ERR_BORROWER_NOT_FOUND (not 400), and only a fully resolvable request surfaces ERR_INVALID_REQUEST."
