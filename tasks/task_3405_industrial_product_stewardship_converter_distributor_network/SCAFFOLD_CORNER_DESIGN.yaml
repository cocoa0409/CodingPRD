      - name: quality_auditor_cannot_authorize_converter
        claim_type: RBAC denial
        grounds:
          - roles.ChannelManager.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "authorize is ChannelManager-exclusive; a QualityAuditor — even the one who recorded a passing audit — gets 403 ERR_UNAUTHORIZED at the role gate (priority 2), distinct from the SoD check (priority 4)."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Converter AUDIT_RECORDED with score 90 by qa-1."
          setup_api_calls:
            - *k_clock
            - call: "POST /stewardship/converters"
              payload: { name: "ConvertOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_id: $.data.id }
            - call: "POST /stewardship/converters/${conv_id}/record-audit"
              payload: { audit_score: 90, audit_standard: "ISO9001" }
              as: QualityAuditor
              as_user_id: "qa-1"
          trigger:
            - call: "POST /stewardship/converters/${conv_id}/authorize"
              payload: {}
              as: QualityAuditor
              as_user_id: "qa-1"
              captures: { qa_err: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_UNAUTHORIZED (actual ${qa_err})"
            - "Converter.${conv_id}.status stays AUDIT_RECORDED"

      - name: channel_manager_cannot_pay_accrual
        claim_type: RBAC denial
        grounds:
          - roles.FinanceController.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "pay is FinanceController-exclusive: the ChannelManager who created the program cannot pay out a CLAIMED accrual (403 ERR_UNAUTHORIZED)."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Program ACTIVATED then CLOSED at period end; accrual FINALIZED and CLAIMED by the distributor."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }], budget_cap_cents: 1000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "GET /stewardship/rebate-accruals"
              payload: { program_id: "${prog_id}" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { acc_id: "$.data[0].id" }
            - call: "POST /stewardship/rebate-accruals/${acc_id}/claim"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /stewardship/rebate-accruals/${acc_id}/pay"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { pay_err: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_UNAUTHORIZED (actual ${pay_err})"
            - "RebateAccrual.${acc_id}.status stays CLAIMED"

      - name: converter_cannot_claim_distributor_accrual
        claim_type: RBAC denial
        grounds:
          - validations[priority=3]
          - errors.ERR_OWNERSHIP_VIOLATION
        distinguishing_aspect: "Entity-backed ownership: claim passes the role gate for Converter but the accrual's partner is a different distributor — 403 ERR_OWNERSHIP_VIOLATION at priority 3."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Program CLOSED; accrual FINALIZED for distributor ${dist_id}. A converter exists."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - call: "POST /stewardship/converters"
              payload: { name: "Other Converter BV", home_territory_code: "DE" }
