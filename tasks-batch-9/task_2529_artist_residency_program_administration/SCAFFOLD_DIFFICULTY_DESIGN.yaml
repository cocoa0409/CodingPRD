  # ===================================================================================
  # RULE 6 - boundary_precision_check
  # Differentiation: three DIFFERENT metrics on three DISTINCT endpoints.
  #   1. cumulative_taxable_cents vs WITHHOLDING_EXEMPT_THRESHOLD_CENTS  -> NUMERIC THRESHOLD,
  #      probed at threshold-30000 / EXACTLY at / threshold+30000
  #      endpoint POST /stipend-disbursements/{id}/settlement
  #   2. eligible candidate pool for a discipline minimum                -> EMPTY SET / ZERO COUNT
  #      endpoint POST /cycles/{id}/lock-slate
  #   3. provisional mean landing exactly on a half-cent                 -> ROUNDING TIE
  #      endpoint POST /panel-assignments/{id}/scores
  # ===================================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: cumulative_withholding_zero_exactly_at_threshold
        grounds: "§1.3 calculations.stipend_withholding (taxable_slice, WITHHOLDING_EXEMPT_THRESHOLD_CENTS 60000, NRA_WITHHOLDING_RATE 0.30); §1.5 POST /stipend-disbursements/{id}/settlement; §1.1 StipendDisbursement.cumulative_taxable_cents"
        distinguishing_aspect: |
          NUMERIC THRESHOLD boundary. taxable_slice is a difference of two clamps,
          max(0, cumulative_after - 60000) - max(0, cumulative_before - 60000), so the exempt
          threshold is INCLUSIVE: a resident whose cumulative gross reaches exactly 60000 still has
          zero withheld, and only the 60001st cent is taxed. Choosing an override rate of 15000/wk
          makes each 2-week period exactly 30000, which walks the cumulative total onto the
          threshold dead-on (30000 / 60000 / 90000) instead of stepping over it. An
          off-by-one implementation that uses `>=` on the wrong side, or that taxes
          (cumulative_after - threshold) without subtracting the already-taxed part, withholds 0 at
          D2 but then over-withholds 9000 vs 9000 at D3 - so D2 is the only call that separates the
          two readings.
        test_recipe:
          setup: |
            CHAIN-SHORT: an invited 8-week residency for a MEXICAN applicant (is_international true,
            treaty_country false, so tax_form_type '1042S' and withholding_rate 0.30). The stipend
            schedule is generated by FinanceOfficer fin-01 with weekly_rate_override_cents 15000,
            producing 4 disbursements of 30000 each (2 weeks x 15000). Payment is performed by a
            DIFFERENT FinanceOfficer fin-02 so P59 segregation of duties is satisfied. Only D1..D3
            are paid, keeping P65 (obligations outstanding, which guards only the highest
            period_index) out of the picture.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Nayeli Cruz", email: "nayeli.cruz@example.org",
                         affiliation_org: "Taller Norte", citizenship_country: "MX",
                         treaty_country: false, declared_annual_income_cents: 1800000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}", weekly_rate_override_cents: 15000 }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "GET /stipend-disbursements"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { d1: "$.data[0].id", d2: "$.data[1].id", d3: "$.data[2].id", d4: "$.data[3].id" }
          trigger:
            - call: "POST /stipend-disbursements/${d1}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-16" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "POST /stipend-disbursements/${d2}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-30" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "POST /stipend-disbursements/${d3}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-12-14" }
              as: FinanceOfficer
              as_user_id: "fin-02"
          assert:
            - "pre-state: 4 SCHEDULED disbursements in ascending period_index, each gross_cents == 30000; Residency.tax_form_type == '1042S'; Residency.stipend_total_cents == 120000 (15000 x 8) after the rate override re-based it"
            - "D1 (BELOW the threshold): cumulative_taxable_cents == 30000, taxable slice max(0,30000-60000) - max(0,0-60000) == 0, withholding_cents == 0, net_cents == 30000, withholding_rate == 0.30"
            - "D2 (EXACTLY AT the threshold): cumulative_taxable_cents == 60000, taxable slice max(0,60000-60000) - max(0,30000-60000) == 0 - 0 == 0, withholding_cents == 0, net_cents == 30000 - at the exact threshold nothing is withheld"
            - "D3 (JUST OVER the threshold): cumulative_taxable_cents == 90000, taxable slice max(0,90000-60000) - max(0,60000-60000) == 30000 - 0 == 30000, withholding_cents == round_half_up(30000 x 0.30) == 9000, net_cents == 21000"
            - "the exclusive reading is refuted: an implementation treating the threshold as exclusive would withhold round_half_up(0 x 0.30) == 0 at D2 anyway but must not withhold on the 60000th cent, so D2's withholding_cents == 0 AND D3's == 9000 together pin the boundary"
            - "the double-clamp is load-bearing: subtracting the already-exempt portion is what keeps D3 at 9000 rather than round_half_up(90000 x 0.30) == 27000"
            - "residency ledgers after the three PAY calls: stipend_paid_gross_cents == 90000 and withholding_to_date_cents == 9000"
            - "GET /residencies/${res}/tax-report then reports annual_gross_cents 90000, annual_taxable_cents max(0, 90000 - 60000) == 30000, statutory_liability_cents round_half_up(30000 x 0.30) == 9000, withheld_actual_cents 9000 and reconciliation_delta_cents 0 - stepping onto the threshold exactly produces NO drift between the two variants"
            - "D4 is deliberately left SCHEDULED, so paid_period_count == 3"

      - name: discipline_minimum_unfillable_on_empty_eligible_set
        grounds: "§1.3 calculations.slate_allocation bucket 1 (empty-candidate-set edge); §1.4 P52-range ERR_DISCIPLINE_MINIMUM_UNFILLABLE (422); §1.5 POST /cycles/{id}/lock-slate"
        distinguishing_aspect: |
          EMPTY SET / ZERO COUNT boundary, on a different metric and a different endpoint from
          instance 1. Bucket 1 walks disciplines in Discipline.code ASC and slices pool[:
          cohort_min_slots]. When a discipline attracted ZERO eligible applications the slice is an
          empty list, the loop body never executes, and a naive implementation happily proceeds
          because "no iterations" reads as "no failure". The post-loop count check
          per_discipline[d.code] < d.cohort_min_slots is the only thing that catches it. The
          discipline is named PRINT so that code ASC puts the EMPTY pool FIRST - the failure must be
          detected before any slot is handed out, and afterwards NOTHING may be offered even though
          the second discipline's pool was perfectly fillable.
        test_recipe:
          setup: |
            One cycle with cohort_target_size 10, alumni_reserve_pct 0.25 and TWO disciplines, each
            with cohort_min_slots 1: PRINT (Printmaking) and SCULPT (Sculpture). A single applicant
            applies to SCULPT, is advanced and scored by two panelists to 80.00, which is above
            slate_min_score 60.00. PRINT receives no applications at all - its eligible pool is the
            empty set. Cycle.panel_review_complete becomes true (slate_ready_count == 1 and no
            application left in PANEL_REVIEW), so P60 passes and the slate lock reaches the
            allocation algorithm. A dedicated chair with no scoring assignments satisfies P59.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "PRINT", name: "Printmaking", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 4, required_capability_tags: ["PRINT_PRESS"],
                         required_ventilation_class: "NONE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc_print: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc_sculpt: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc_sculpt}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
