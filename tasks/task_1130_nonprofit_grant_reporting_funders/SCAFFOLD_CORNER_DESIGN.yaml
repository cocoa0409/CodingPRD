            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 5000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 5000 }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FUND_EXCEEDED (422)"

      - name: expense_create_on_draft_grant_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRANT_NOT_ACTIVE]", "validations[priority=5]"]
        distinguishing_aspect: "Creating an expense while the grant is still DRAFT (never activated) fails ERR_GRANT_NOT_ACTIVE."
        test_recipe:
          setup: ["Grant in DRAFT (line + fund exist, never activated)"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-E3", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
          trigger:
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 5000 }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_GRANT_NOT_ACTIVE (409)"

      - name: finding_respond_on_resolved_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_FINDING_NOT_OPEN]", state_machines.AuditFinding]
        distinguishing_aspect: "respond on a RESOLVED finding fails ERR_FINDING_NOT_OPEN; RESOLVED is terminal."
        test_recipe:
          setup: ["Grant ACTIVE; engagement CONDUCTED; finding OBSERVATION moved OPEN -> RESPONSE_SUBMITTED -> RESOLVED"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-E4", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "DESK_REVIEW", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "OBSERVATION", description: "obs" }, as: Auditor, captures: { f1: $.data.id } }
            - { call: "POST /audit-findings/${f1}/respond", payload: { response_text: "r" }, as: GrantsOfficer }
            - { call: "POST /audit-findings/${f1}/resolve", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /audit-findings/${f1}/respond", payload: { response_text: "again" }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FINDING_NOT_OPEN (409)"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: officer_cannot_post_expense_forbidden
        claim_type: rbac_deny
        grounds: [roles.FinanceManager, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /expenses/{id}/post is FinanceManager-exclusive; GrantsOfficer is rejected ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Grant ACTIVE; DRAFT expense e1"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-R1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 5000 }, as: GrantsOfficer, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /expenses/${e1}/post", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403)"

      - name: funder_cannot_review_other_funders_grant
        claim_type: ownership_scope
        grounds: [roles.Funder, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Funder f2 calling start-review on a report of f1's grant is rejected ERR_FORBIDDEN — funder identity is scoped to grant.funder_id."
        test_recipe:
          setup: ["Funders f1, f2; grant under f1 ACTIVE; R1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /funders", payload: { name: "F2", funder_type: "STATE", contact_email: "f2@x.org" }, as: SystemAdmin, captures: { f2: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-R2", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer }
          trigger:
            - { call: "POST /reports/${r1}/start-review", payload: {}, as: Funder, as_user_id: "${f2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403): f2 is not the awarding funder of this grant"

      - name: sod_expense_create_then_post_same_user
        claim_type: segregation_of_duties
        grounds: ["validations[priority=4]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.Expense.fields.created_by_user_id]
        distinguishing_aspect: "The same person (X-User-ID u-1) who created an expense cannot post it even when wearing the FinanceManager role — SoD binds the person, not the role."
        test_recipe:
          setup: ["Grant ACTIVE; expense created by officer with X-User-ID u-1"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-R3", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 5000 }, as: GrantsOfficer, as_user_id: "u-1", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "u-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (403)"

      - name: sod_match_verify_own_documentation
        claim_type: segregation_of_duties
        grounds: ["validations[priority=4]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.MatchContribution.fields.documented_by_user_id]
        distinguishing_aspect: "The person who documented a match contribution (u-9) cannot verify it; a different FinanceManager (fin-2) can."
        test_recipe:
          setup: ["Grant ACTIVE; CASH contribution documented by u-9"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-R4", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/match-contributions", payload: { contribution_type: "CASH", source_name: "D1", valuation_basis: "ACTUAL_COST", documented_value_cents: 7000000 }, as: GrantsOfficer, captures: { m1: $.data.id } }
            - { call: "POST /match-contributions/${m1}/document", payload: { documentation_ref: "doc" }, as: GrantsOfficer, as_user_id: "u-9" }
          trigger:
            - { call: "POST /match-contributions/${m1}/verify", payload: {}, as: FinanceManager, as_user_id: "u-9", captures: { err: $.data.error_id } }
            - { call: "POST /match-contributions/${m1}/verify", payload: {}, as: FinanceManager, as_user_id: "fin-2", captures: { st: $.data.status } }
          assert:
            - "same user u-9: err == ERR_SEGREGATION_OF_DUTIES (403)"
            - "different user fin-2: st == VERIFIED"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: budget_line_expended_reconciles_on_allocate_and_void
        claim_type: derived_field_reconciliation
        grounds: [entities.BudgetLine.fields.expended_cents, state_machines.ExpenseAllocation.ACTIVE_to_VOIDED]
        distinguishing_aspect: "BudgetLine.expended_cents rises to 2000000 after allocation and returns to 0 after the parent expense void — the derived field reconciles on both the forward and compensating paths."
        test_recipe:
          setup: ["Grant ACTIVE; POSTED expense 2000000 fully allocated to l1/fu1"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-L1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 2000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 2000000 }, as: GrantsOfficer }
            - { call: "GET /grants/${g1}/budget-lines", payload: {}, as: GrantsOfficer, captures: { ex1: "$.data[0].expended_cents" } }
            - { call: "POST /expenses/${e1}/void", payload: {}, as: FinanceManager }
            - { call: "GET /grants/${g1}/budget-lines", payload: {}, as: GrantsOfficer, captures: { ex2: "$.data[0].expended_cents" } }
          assert:
            - "ex1 == 2000000 after allocation"
            - "ex2 == 0 after the void cascade"

      - name: layer_cascade_coverage
        claim_type: cascade_chain
        grounds: [state_machines.Grant.ACTIVE_to_SUSPENDED, state_machines.ModificationRequest.SUBMITTED_to_APPROVED]
        excluded_because:
          difficulty_instance: material_weakness_freeze_chain
          rationale: "N-level cascade ordering asserted end-to-end by the named depth-3 difficulty instance (and nce_approval_calendar_extension for the depth-2 counterpart)."

      - name: layer_occ_success_path
        claim_type: stale_version_occ
        grounds: ["concurrency_rules[modification-approve-stale-grant]"]
        excluded_because:
          difficulty_instance: nce_approval_calendar_extension
          rationale: "Correct-version approval succeeding with version +1 asserted there; stale-version rejection asserted in corner modification_approve_stale_version_rejected."

  # ===========================================================================
  # Section: consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: allocation_visible_immediately_on_expense_read
        claim_type: immediate_visibility
        grounds: [entities.Expense.fields.unallocated_cents]
        excluded_because:
          difficulty_instance: allocation_gated_on_expense_posted
          rationale: "Same-request visibility of unallocated_cents == 60000 immediately after the allocation POST is asserted there — immediate consistency, no lag."
