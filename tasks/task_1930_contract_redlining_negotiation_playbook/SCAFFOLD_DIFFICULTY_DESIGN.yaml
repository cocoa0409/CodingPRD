      - name: deviation_parallel_dimension_blocked_recover_loop
        grounds:
          - state_machines.Negotiation
          - state_machines.Deviation
        distinguishing_aspect: |
          Negotiation.approval_status is a PARALLEL state dimension evolving
          independently from draft_status. The path NO_DEVIATIONS ->
          DEVIATIONS_PENDING -> BLOCKED -> DEVIATIONS_PENDING ->
          APPROVED_WITH_DEVIATIONS exercises a fork-join loop on the
          approval dimension while draft_status stays in REDLINING. The
          BLOCKED -> DEVIATIONS_PENDING transition requires withdrawal of
          the REJECTED deviation — a revert path unique to this dimension.
        test_recipe:
          setup:
            - "Negotiation in REDLINING with playbook containing two clauses (A, B)"
            - "Drafter = ca; Assigned approver = lc (LEGAL_COUNSEL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
