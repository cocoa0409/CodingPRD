# =============================================================================
# Property Disposition & Sale Process Management — benchmark seed tables
# =============================================================================

scenario: |
  Property Disposition & Sale Process Management (institutional owner disposition team): hold/sell analysis & broker selection, offering memorandum & data room preparation, call for offers & bidder qualification, purchase agreement negotiation & deposit structure, buyer due diligence coordination & retrade defense, loan payoff/defeasance & prepayment penalty, closing statement & proration review, post-closing escrow & indemnity

domain_name: property-disposition-sale
api_prefix: /disposition

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation      # call-for-offers, PSA negotiation, retrade defense
  secondary_archetype: compliance_audit           # segregation of duties, gated approvals, immutable money trail
  complexity_layers:
    - optimistic_concurrency                      # OCC on Asset.version for superseding creates
    - cascading_side_effects                      # retrade -> price -> commission/statement; termination -> deposits -> asset ledger
    - derived_field_reconciliation                # statements go STALE when price/payoff change; completeness recompute
    - rate_threshold_triggers                     # tiered commission, step-down bands, hysteresis recommendation band
  entity_topology: flat                           # peer entities joined by FK references; no URL nesting of writes
  state_machine_shape: parallel                   # Asset carries marketing_status x deal_status as independent dimensions
  relationship_patterns:
    - one_to_many                                 # Asset -> analyses/bidders/bids/psas/payoffs; PSA -> deposits/dd-items/statements/escrows
    - cross_aggregate                             # PSA references winning Bid; Bid references Bidder; Statement reads Payoff/Engagement
  role_model: segregation_of_duties               # preparer != approver on analysis, documents, closing statement
  consistency_model: immediate                    # every cascade is atomic within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property name" }
      - { name: market, type: string, source: input, description: "Market / metro label" }
      - { name: asset_type, type: enum, source: input, description: "OFFICE | INDUSTRIAL | RETAIL | MULTIFAMILY", constraints: "one of the four enum values" }
      - { name: noi_cents, type: integer, source: input, description: "Annual in-place net operating income", constraints: "> 0" }
      - { name: noi_growth_bps, type: integer, source: input, description: "Assumed annual NOI growth, basis points", constraints: "0..2000" }
      - { name: book_value_cents, type: integer, source: input, description: "Carrying book value", constraints: ">= 0" }
      - { name: guidance_price_cents, type: integer, source: input, description: "Asking guidance price; base of bidder proof-of-funds threshold", constraints: "> 0" }
      - { name: loan_balance_cents, type: integer, source: input, description: "Outstanding loan principal; 0 means unlevered asset", constraints: ">= 0" }
      - { name: loan_rate_bps, type: integer, source: input, description: "Note coupon, basis points; 0 when loan_balance_cents == 0", constraints: ">= 0" }
      - { name: loan_maturity_date, type: datetime, source: input, description: "Loan maturity; null when unlevered" , constraints: "nullable" }
      - { name: monthly_debt_service_cents, type: integer, source: input, description: "Level monthly debt service; 0 when unlevered", constraints: ">= 0" }
      - { name: remaining_term_months, type: integer, source: input, description: "Remaining loan payments; 0 when unlevered", constraints: ">= 0" }
      - { name: prepayment_type, type: enum, source: input, description: "NONE | STEP_DOWN | YIELD_MAINTENANCE; NONE when unlevered" }
      - { name: prepayment_lockout_until, type: datetime, source: input, description: "Defeasance/payoff locked out before this instant; null = no lockout", constraints: "nullable" }
      - { name: defeasance_allowed, type: boolean, source: input, default: false, description: "Whether note permits defeasance substitution" }
      - { name: defeasance_fee_cents, type: integer, source: input, default: 0, description: "Flat defeasance administrative fee" }
      - { name: marketing_status, type: enum, source: system, description: "EVALUATION | LISTED | OFFERS_OPEN | OFFERS_CLOSED | WITHDRAWN — independent dimension 1" }
      - { name: deal_status, type: enum, source: system, description: "IDLE | PSA_DRAFT | PSA_EXECUTED | DD_ACTIVE | BINDING | CLOSING | SOLD — independent dimension 2" }
      - { name: offers_deadline, type: datetime, source: system, description: "Bid cutoff set by open_offers; null until then", constraints: "nullable" }
      - { name: last_campaign_closed_at, type: datetime, source: system, description: "When offers last closed; drives 7-day relist cooling gap", constraints: "nullable" }
      - { name: forfeited_deposits_cents, type: integer, source: system, default: 0, description: "Cumulative forfeited earnest money credited to owner" }
      - { name: final_sale_price_cents, type: integer, source: system, description: "Recorded at record_closing; null until SOLD", constraints: "nullable" }

  - name: HoldSellAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; analysis subject" }
      - { name: cap_rate_bps, type: integer, source: input, description: "Direct-capitalization rate, bps", constraints: "> 0" }
      - { name: discount_rate_bps, type: integer, source: input, description: "DCF discount rate, bps", constraints: "> 0" }
      - { name: exit_cap_rate_bps, type: integer, source: input, description: "Terminal cap rate, bps", constraints: "> 0" }
      - { name: hold_years, type: integer, source: input, description: "DCF hold horizon in years", constraints: "3..10" }
      - { name: selected_method, type: enum, source: input, description: "DIRECT_CAP | DCF — which variant feeds hold_value_cents / recommendation" }
      - { name: est_sale_price_cents, type: integer, source: input, description: "Estimated gross sale price", constraints: "> 0" }
      - { name: est_selling_costs_cents, type: integer, source: input, description: "Estimated costs of sale", constraints: ">= 0" }
      - { name: hold_value_direct_cap_cents, type: integer, source: computed, description: "Hold value under direct capitalization variant" }
      - { name: hold_value_dcf_cents, type: integer, source: computed, description: "Hold value under DCF variant" }
      - { name: hold_value_cents, type: integer, source: computed, description: "= the variant selected by selected_method" }
      - { name: sell_net_cents, type: integer, source: computed, description: "= est_sale_price_cents - est_selling_costs_cents" }
      - { name: value_gap_cents, type: integer, source: computed, description: "= sell_net_cents - hold_value_cents" }
      - { name: recommendation, type: enum, source: computed, description: "SELL | HOLD | MARGINAL from hysteresis band around hold_value_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "Opaque id of creating AssetAnalyst" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque id of InvestmentCommittee decider; null until decided", constraints: "nullable" }

  - name: BrokerEngagement
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; listing subject" }
      - { name: broker_firm_name, type: string, source: input, description: "Brokerage firm name" }
      - { name: broker_user_id, type: string, source: input, description: "Opaque X-User-ID of the Broker operating this engagement" }
      - { name: window_start, type: datetime, source: input, description: "Exclusivity window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusivity window end (INCLUSIVE — closed-interval overlap semantics)", constraints: "> window_start" }
      - { name: commission_provisional_cents, type: integer, source: computed, description: "Tiered commission on PSA price at execute; recomputed on every retrade; null until PSA executed", constraints: "nullable" }
      - { name: commission_final_cents, type: integer, source: computed, description: "Tiered commission on final price at record_closing; null until then", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | EXPIRED | TERMINATED | COMPLETED" }

  - name: OfferingPackage
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; marketing subject" }
      - { name: documents, type: array, source: input, description: "Appended via upload_document: { category, file_name, doc_status, uploaded_by_user_id, verified_by_user_id, uploaded_at, verified_at }; doc_status: UPLOADED | VERIFIED | SUPERSEDED", constraints: "at most one non-SUPERSEDED document per category" }
      - { name: verified_categories_count, type: integer, source: computed, description: "Distinct categories with >= 1 VERIFIED document" }
      - { name: completeness_pct, type: integer, source: computed, description: "floor(verified_categories_count * 100 / 8); publish gate is == 100" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | IN_REVIEW" }
      - { name: published_at, type: datetime, source: system, description: "Last publish instant; null until first publish", constraints: "nullable" }

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; registration subject" }
      - { name: organization_name, type: string, source: input, description: "Bidder organization legal name" }
      - { name: proof_of_funds_cents, type: integer, source: input, description: "Evidence of funds amount", constraints: "> 0" }
      - { name: qualification_status, type: enum, source: system, description: "PENDING | QUALIFIED | DISQUALIFIED" }
      - { name: access_windows, type: array, source: system, description: "Data-room grants: { window_start, window_end, window_status: ACTIVE | EXPIRED, granted_at }; half-open [start, end) overlap semantics per bidder" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: bidder_id, type: string, source: input, description: "FK -> Bidder.id; must equal Buyer's X-User-ID" }
      - { name: price_cents, type: integer, source: input, description: "Offer price", constraints: "> 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Proposed initial earnest money", constraints: "> 0" }
      - { name: dd_period_days, type: integer, source: input, description: "Requested due-diligence period length", constraints: "1..90" }
      - { name: closing_period_days, type: integer, source: input, description: "Days from execution to closing", constraints: "1..180" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SHORTLISTED | SELECTED | REJECTED | WITHDRAWN" }
      - { name: improvement_count, type: integer, source: system, default: 0, description: "Number of successful improve calls" }

  - name: PurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id" }
      - { name: bid_id, type: string, source: input, description: "FK -> Bid.id; the SELECTED bid" }
      - { name: proration_convention, type: enum, source: input, description: "ACTUAL_365 | BANKERS_360 — day-count variant locked at creation" }
      - { name: buyer_bidder_id, type: string, source: system, description: "Copied from bid.bidder_id; ownership handle for Buyer actions" }
      - { name: price_cents, type: integer, source: system, description: "Current price; initialized from bid.price_cents, reduced by accepted retrades" }
      - { name: original_price_cents, type: integer, source: system, description: "Immutable snapshot of bid.price_cents at creation" }
      - { name: executed_at, type: datetime, source: system, description: "Set at execute; null in DRAFT", constraints: "nullable" }
      - { name: dd_deadline, type: datetime, source: system, description: "= executed_at + bid.dd_period_days days; null in DRAFT", constraints: "nullable" }
      - { name: closing_date, type: datetime, source: system, description: "Input at execute; proration cutoff; null in DRAFT", constraints: "nullable" }
      - { name: initial_deposit_cents, type: integer, source: computed, description: "max(round_half_up(price * 300bps), MIN_DEPOSIT); frozen at execute" }
      - { name: additional_deposit_cents, type: integer, source: computed, description: "round_half_up(price * 200bps); frozen at execute" }
      - { name: accepted_retrade_total_cents, type: integer, source: system, default: 0, description: "Running sum of accepted retrade reductions" }
      - { name: termination_reason, type: enum, source: system, description: "BUYER_DD | BUYER_DEFAULT | SELLER_DEFAULT | MUTUAL; null unless TERMINATED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | DD_ACTIVE | BINDING | CLOSING | CLOSED | TERMINATED | SUPERSEDED" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: psa_id, type: string, source: system, description: "FK -> PurchaseAgreement.id; auto-created pair at execute" }
      - { name: kind, type: enum, source: system, description: "INITIAL | ADDITIONAL" }
      - { name: amount_cents, type: integer, source: system, description: "Frozen at execute from PSA computed schedule" }
      - { name: due_date, type: datetime, source: system, description: "INITIAL: executed_at + 3 days; ADDITIONAL: dd_deadline" }
      - { name: posted_at, type: datetime, source: system, description: "When funds recorded; null until posted", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DUE | POSTED | DELINQUENT | REFUNDED | FORFEITED | APPLIED" }

  - name: DueDiligenceItem
    parent: null
    common_fields: true
    fields:
      - { name: psa_id, type: string, source: input, description: "FK -> PurchaseAgreement.id" }
      - { name: category, type: enum, source: input, description: "PHYSICAL | FINANCIAL | LEGAL | ENVIRONMENTAL | TITLE" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: requested_reduction_cents, type: integer, source: input, description: "Price reduction demanded", constraints: "> 0" }
      - { name: accepted_reduction_cents, type: integer, source: system, description: "min(requested, 2% of current price) when accepted; null otherwise", constraints: "nullable" }
      - { name: filed_at, type: datetime, source: system, description: "Filing timestamp; retrade window check against psa.dd_deadline" }
      - { name: status, type: enum, source: system, description: "OPEN | ACCEPTED | REJECTED | CONTESTED | WITHDRAWN | RESCINDED" }

  - name: LoanPayoff
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; loan being retired" }
      - { name: method, type: enum, source: input, description: "PAYOFF | DEFEASANCE" }
      - { name: reinvestment_rate_bps, type: integer, source: input, description: "Treasury reinvestment rate, bps", constraints: ">= 0" }
      - { name: accrued_days, type: integer, source: input, description: "Days of accrued interest owed at anticipated settlement", constraints: "0..31" }
      - { name: anticipated_settlement_date, type: datetime, source: input, description: "Planned settlement; lockout checked against it" }
      - { name: quoted_at, type: datetime, source: system, description: "Quote timestamp (logical clock)" }
      - { name: quote_expires_at, type: datetime, source: system, description: "= quoted_at + 10 days" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "round_half_up(balance * rate * accrued_days / 360)" }
      - { name: prepayment_penalty_cents, type: integer, source: computed, description: "STEP_DOWN band or YIELD_MAINTENANCE with 1% floor; 0 for DEFEASANCE method" }
      - { name: defeasance_cost_cents, type: integer, source: computed, description: "PV of remaining debt service + balloon + fee; 0 for PAYOFF method" }
      - { name: total_estimated_cost_cents, type: integer, source: computed, description: "PAYOFF: balance + accrued + penalty; DEFEASANCE: defeasance_cost" }
      - { name: final_total_cents, type: integer, source: computed, description: "Recomputed at settle with clock position; null until SETTLED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | STALE | SETTLED" }

  - name: ClosingStatement
    parent: null
    common_fields: true
    fields:
      - { name: psa_id, type: string, source: input, description: "FK -> PurchaseAgreement.id" }
      - { name: convention, type: enum, source: system, description: "Copied from psa.proration_convention: ACTUAL_365 | BANKERS_360" }
      - { name: closing_date, type: datetime, source: system, description: "Copied from psa.closing_date; seller is responsible through the day BEFORE closing" }
      - { name: property_tax_annual_cents, type: integer, source: input, description: "Annual property tax, unpaid at closing (seller credit to buyer)", constraints: ">= 0" }
      - { name: tax_period_start, type: datetime, source: input, description: "Start of the tax fiscal period (day 1)" }
      - { name: rent_monthly_cents, type: integer, source: input, description: "Month-of-closing rent already collected by seller (credit to buyer for closing day onward)", constraints: ">= 0" }
      - { name: cam_annual_cents, type: integer, source: input, description: "Annual CAM prepaid by seller (buyer reimburses closing day onward)", constraints: ">= 0" }
      - { name: proration_buyer_credit_cents, type: integer, source: computed, description: "tax seller share + rent buyer share; per-line round_half_up then sum" }
      - { name: proration_buyer_debit_cents, type: integer, source: computed, description: "CAM buyer share; per-line round_half_up" }
      - { name: deposits_applied_cents, type: integer, source: computed, description: "Sum of POSTED deposits at statement creation" }
      - { name: commission_cents, type: integer, source: computed, description: "Tiered commission on current PSA price at creation" }
      - { name: payoff_total_cents, type: integer, source: computed, description: "CONFIRMED payoff total_estimated_cost_cents; 0 when none CONFIRMED" }
      - { name: holdback_cents, type: integer, source: computed, description: "max(round_half_up(price * 50bps), MIN_HOLDBACK)" }
      - { name: buyer_due_cents, type: integer, source: computed, description: "price + debit - credit - deposits_applied" }
      - { name: seller_net_cents, type: integer, source: computed, description: "price + debit - credit - commission - payoff_total - holdback" }
      - { name: prepared_by_user_id, type: string, source: system, description: "ClosingOfficer who submitted" }
      - { name: approved_by_user_id, type: string, source: system, description: "DispositionManager who approved; must differ from preparer", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | DISPUTED | STALE | FINALIZED" }

  - name: EscrowHoldback
    parent: null
    common_fields: true
    fields:
      - { name: psa_id, type: string, source: system, description: "FK -> PurchaseAgreement.id; auto-created at record_closing" }
      - { name: purpose, type: enum, source: system, description: "INDEMNITY (only purpose)" }
      - { name: amount_cents, type: integer, source: system, description: "= statement.holdback_cents at creation" }
      - { name: available_cents, type: integer, source: computed, description: "= amount - released_to_seller - paid_to_claims" }
      - { name: released_to_seller_cents, type: integer, source: system, default: 0, description: "Cumulative releases to seller" }
      - { name: paid_to_claims_cents, type: integer, source: system, default: 0, description: "Cumulative claim payouts" }
      - { name: release_date, type: datetime, source: system, description: "= closing_date + 365 days" }
      - { name: claims, type: array, source: system, description: "{ claim_id (server-assigned sequential per escrow: C1, C2, ...), amount_cents, reason, claim_status: FILED | PAID | DENIED, filed_by_user_id, decided_by_user_id, paid_amount_cents, filed_at, decided_at }" }
      - { name: status, type: enum, source: system, description: "HELD | PARTIALLY_RELEASED | RELEASED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Asset
    initial_state: "marketing_status=EVALUATION, deal_status=IDLE"
    terminal_states: ["marketing_status=WITHDRAWN", "deal_status=SOLD"]
    note: "PARALLEL DIMENSIONS: marketing_status and deal_status evolve independently on the same row. Cross-dimension gates: open_offers requires deal_status == IDLE; execute requires marketing_status == OFFERS_CLOSED; withdraw blocks all deal transitions except record_closing is impossible (no CLOSING possible)."
    transitions:
      - from: "marketing EVALUATION"
        to: "marketing LISTED"
        trigger: "POST /disposition/assets/{id}/list"
        actor: DispositionManager
        preconditions:
          - "marketing_status == EVALUATION (ERR_INVALID_STATE_TRANSITION)"
          - "latest non-SUPERSEDED HoldSellAnalysis for asset is APPROVED (ERR_ANALYSIS_NOT_APPROVED)"
          - "that analysis recommendation != HOLD (ERR_HOLD_RECOMMENDED)"
          - "an ACTIVE BrokerEngagement exists for asset (ERR_NO_ACTIVE_ENGAGEMENT)"
        side_effects: []
      - from: "marketing OFFERS_CLOSED"
        to: "marketing LISTED"
        trigger: "POST /disposition/assets/{id}/list (relist)"
        actor: DispositionManager
        preconditions:
          - "marketing_status == OFFERS_CLOSED (ERR_INVALID_STATE_TRANSITION)"
          - "deal_status == IDLE (no live PSA chain) (ERR_INVALID_STATE_TRANSITION)"
          - "clock >= last_campaign_closed_at + 7 days (ERR_RELIST_COOLING_PERIOD)"
        side_effects: []
      - from: "marketing LISTED"
        to: "marketing OFFERS_OPEN"
        trigger: "POST /disposition/assets/{id}/open_offers"
        actor: DispositionManager
        preconditions:
          - "marketing_status == LISTED (ERR_INVALID_STATE_TRANSITION)"
          - "deal_status == IDLE (ERR_INVALID_STATE_TRANSITION)"
          - "asset's OfferingPackage status == PUBLISHED (ERR_PACKAGE_NOT_PUBLISHED)"
          - "input offers_deadline strictly after current clock time (ERR_INVALID_REQUEST)"
        side_effects:
          - "offers_deadline = input offers_deadline"
      - from: "marketing OFFERS_OPEN"
        to: "marketing OFFERS_CLOSED"
        trigger: "POST /disposition/assets/{id}/close_offers"
        actor: DispositionManager
        preconditions:
          - "marketing_status == OFFERS_OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "clock >= offers_deadline (ERR_INVALID_STATE_TRANSITION — cannot close before deadline)"
        side_effects:
          - "last_campaign_closed_at = clock"
      - from: "marketing EVALUATION | LISTED | OFFERS_OPEN | OFFERS_CLOSED"
        to: "marketing WITHDRAWN"
        trigger: "POST /disposition/assets/{id}/withdraw"
        actor: DispositionManager
        preconditions:
          - "deal_status must be IDLE (ERR_INVALID_STATE_TRANSITION — live deal blocks withdrawal)"
        side_effects:
          - "all PENDING Bidder registrations -> DISQUALIFIED"
          - "all SUBMITTED | SHORTLISTED Bids -> REJECTED"
      - from: "deal IDLE"
        to: "deal PSA_DRAFT"
        trigger: "system (cascade of POST /disposition/psas success)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "deal PSA_DRAFT"
        to: "deal PSA_EXECUTED"
        trigger: "system (cascade of PSA execute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "deal PSA_EXECUTED"
        to: "deal DD_ACTIVE"
        trigger: "system (cascade of PSA open_dd)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "deal DD_ACTIVE"
        to: "deal BINDING"
        trigger: "system (cascade of PSA DD_ACTIVE -> BINDING lapse)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "deal BINDING"
        to: "deal CLOSING"
        trigger: "system (cascade of PSA begin_closing)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "deal CLOSING"
        to: "deal BINDING"
        trigger: "system (cascade when its ClosingStatement flips APPROVED -> STALE while deal CLOSING — closing gate re-opens)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "deal CLOSING"
        to: "deal SOLD"
        trigger: "system (cascade of PSA record_closing)"
        actor: system
        preconditions: []
        side_effects:
          - "final_sale_price_cents = psa.price_cents"
      - from: "deal PSA_DRAFT | PSA_EXECUTED | DD_ACTIVE | BINDING"
        to: "deal IDLE"
        trigger: "system (cascade of PSA terminate / supersede — deal unwinds)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HoldSellAnalysis
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    note: "CYCLIC revision loop: REJECTED -> DRAFT via revise. Create-with-supersede: POST /disposition/analyses marks any existing DRAFT | SUBMITTED analysis of the same asset SUPERSEDED (OCC-guarded, see concurrency_rules)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /disposition/analyses/{id}/submit"
        actor: AssetAnalyst
        preconditions:
          - "X-User-ID == created_by_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /disposition/analyses/{id}/decide {decision: APPROVE}"
        actor: InvestmentCommittee
        preconditions:
          - "decider X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /disposition/analyses/{id}/decide {decision: REJECT}"
        actor: InvestmentCommittee
        preconditions:
          - "decider X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /disposition/analyses/{id}/revise"
        actor: AssetAnalyst
        preconditions:
          - "X-User-ID == created_by_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "decided_by_user_id = null"
      - from: "DRAFT | SUBMITTED"
        to: SUPERSEDED
        trigger: "system (cascade of a newer HoldSellAnalysis created on the same asset)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BrokerEngagement
    initial_state: PROPOSED
    terminal_states: [EXPIRED, TERMINATED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /disposition/engagements/{id}/activate"
        actor: DispositionManager
        preconditions:
          - "no other engagement of same asset with status PROPOSED | ACTIVE whose [window_start, window_end] CLOSED-interval overlaps this one (ERR_ENGAGEMENT_WINDOW_OVERLAP; adjacency start == prior end IS overlap)"
          - "window_end > clock (ERR_INVALID_REQUEST — cannot activate an already-past window)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep on POST /disposition/_clock/set_current_utc when clock > window_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "PROPOSED | ACTIVE"
        to: TERMINATED
        trigger: "POST /disposition/engagements/{id}/terminate"
        actor: DispositionManager
        preconditions:
          - "asset deal_status == IDLE (ERR_INVALID_STATE_TRANSITION — cannot cut broker mid-deal)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascade of PSA record_closing on its asset)"
        actor: system
        preconditions: []
        side_effects:
          - "commission_final_cents computed on final price"

  - entity: OfferingPackage
    initial_state: DRAFT
    terminal_states: []
    note: "CYCLIC publish loop: PUBLISHED -> IN_REVIEW (auto on document supersede while marketing != OFFERS_OPEN) -> PUBLISHED via publish."
    transitions:
      - from: "DRAFT | IN_REVIEW"
        to: PUBLISHED
        trigger: "POST /disposition/packages/{id}/publish"
        actor: DispositionManager
        preconditions:
          - "completeness_pct == 100, i.e. all 8 categories hold a VERIFIED document (ERR_PACKAGE_INCOMPLETE)"
          - "an ACTIVE BrokerEngagement exists for the asset (ERR_NO_ACTIVE_ENGAGEMENT)"
        side_effects:
          - "published_at = clock"
      - from: PUBLISHED
        to: IN_REVIEW
        trigger: "system (cascade of upload_document superseding a VERIFIED document while asset.marketing_status != OFFERS_OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "completeness_pct recomputed (superseded category may drop below full)"
      - from: "DRAFT | PUBLISHED | IN_REVIEW"
        to: "(unchanged — document append)"
        trigger: "POST /disposition/packages/{id}/upload_document"
        actor: AssetAnalyst | Broker
        preconditions:
          - "asset.marketing_status != OFFERS_OPEN (ERR_DATA_ROOM_LOCKED)"
          - "category in the 8 required categories (ERR_INVALID_REQUEST)"
        side_effects:
          - "append document doc_status=UPLOADED, uploaded_by_user_id = X-User-ID"
          - "if a non-SUPERSEDED document already exists for that category, that document -> SUPERSEDED"
          - "completeness_pct recomputed"
      - from: "(unchanged — document verification)"
        to: "(unchanged)"
        trigger: "POST /disposition/packages/{id}/verify_document"
        actor: AssetAnalyst | DispositionManager
        preconditions:
          - "a UPLOADED document exists for input category (ERR_INVALID_STATE_TRANSITION)"
          - "verifier X-User-ID != that document's uploaded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "document doc_status -> VERIFIED; verified_by_user_id = X-User-ID"
          - "completeness_pct recomputed"

  - entity: Bidder
    initial_state: PENDING
    terminal_states: []
    note: "CYCLIC re-qualification: DISQUALIFIED -> PENDING via reapply with fresh proof of funds."
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /disposition/bidders/{id}/qualify"
        actor: DispositionManager
        preconditions:
          - "asset.marketing_status != WITHDRAWN (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "evaluates proof_of_funds_cents >= 25% of asset.guidance_price_cents (integer compare, >= inclusive); if below, bidder -> DISQUALIFIED instead and caller receives ERR_INSUFFICIENT_PROOF_OF_FUNDS"
      - from: PENDING
        to: DISQUALIFIED
        trigger: "POST /disposition/bidders/{id}/qualify (threshold not met)"
        actor: DispositionManager
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system (cascade of Asset withdraw)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: DISQUALIFIED
        trigger: "system (cascade of Asset withdraw)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISQUALIFIED
        to: PENDING
        trigger: "POST /disposition/bidders/{id}/reapply"
        actor: Broker | DispositionManager
        preconditions:
          - "asset.marketing_status not in {WITHDRAWN} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "proof_of_funds_cents = input value"
      - from: "(unchanged — access grant append)"
        to: "(unchanged)"
        trigger: "POST /disposition/bidders/{id}/grant_access"
        actor: Broker | DispositionManager
        preconditions:
          - "qualification_status == QUALIFIED (ERR_BIDDER_NOT_QUALIFIED)"
          - "asset package status == PUBLISHED (ERR_PACKAGE_NOT_PUBLISHED)"
          - "window_end > window_start (ERR_INVALID_REQUEST)"
          - "no ACTIVE access_window on this bidder with HALF-OPEN [start, end) overlap (ERR_ACCESS_WINDOW_OVERLAP; adjacency start == prior end is ALLOWED)"
        side_effects:
          - "append access window window_status=ACTIVE, granted_at = clock"
          - "system (clock sweep): window -> EXPIRED when clock >= window_end"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [SELECTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /disposition/bids/{id}/improve (best-and-final price improvement)"
        actor: Buyer
        preconditions:
          - "bidder ownership: X-User-ID == bid.bidder_id (ERR_FORBIDDEN_ROLE)"
          - "asset.marketing_status == OFFERS_OPEN and clock <= asset.offers_deadline (ERR_OFFERS_DEADLINE_PASSED)"
          - "new price_cents strictly greater than current price_cents (ERR_BID_IMPROVEMENT_TOO_LOW)"
        side_effects:
          - "price_cents = input; improvement_count += 1"
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /disposition/bids/{id}/shortlist"
        actor: DispositionManager
        preconditions:
          - "asset.marketing_status == OFFERS_CLOSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SHORTLISTED
        to: SELECTED
        trigger: "POST /disposition/bids/{id}/select"
        actor: DispositionManager
        preconditions:
          - "asset.deal_status == IDLE (ERR_INVALID_STATE_TRANSITION — a deal chain is already live)"
        side_effects:
          - "all other bids of the same asset in SUBMITTED | SHORTLISTED -> REJECTED (cascade)"
      - from: "SUBMITTED | SHORTLISTED"
        to: WITHDRAWN
        trigger: "POST /disposition/bids/{id}/withdraw"
        actor: Buyer
        preconditions:
          - "X-User-ID == bid.bidder_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: "SUBMITTED | SHORTLISTED"
        to: REJECTED
        trigger: "system (cascade of a sibling select, or of Asset withdraw)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PurchaseAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED, SUPERSEDED]
    note: "Creation supersedes an existing DRAFT PSA of the same asset (OCC-guarded). DD_ACTIVE -> BINDING via lapse_dd once the logical clock passes dd_deadline (termination right lapses)."
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /disposition/psas/{id}/execute"
        actor: DispositionManager
        preconditions:
          - "asset.marketing_status == OFFERS_CLOSED (ERR_INVALID_STATE_TRANSITION)"
          - "input closing_date strictly after clock (ERR_INVALID_REQUEST)"
        side_effects:
          - "executed_at = clock; dd_deadline = executed_at + bid.dd_period_days days; closing_date = input"
          - "initial_deposit_cents / additional_deposit_cents computed and frozen"
          - "auto-create Deposit INITIAL (due executed_at + 3 days) and Deposit ADDITIONAL (due dd_deadline), status DUE"
          - "asset deal_status -> PSA_EXECUTED"
          - "engagement.commission_provisional_cents = tiered commission on price_cents"
      - from: EXECUTED
        to: DD_ACTIVE
        trigger: "POST /disposition/psas/{id}/open_dd"
        actor: DispositionManager
        preconditions:
          - "INITIAL Deposit of this PSA is POSTED (ERR_DEPOSIT_NOT_POSTED)"
        side_effects:
          - "asset deal_status -> DD_ACTIVE"
      - from: DD_ACTIVE
        to: BINDING
        trigger: "POST /disposition/psas/{id}/lapse_dd"
        actor: DispositionManager
        preconditions:
          - "clock > dd_deadline (ERR_INVALID_STATE_TRANSITION — termination right not yet lapsed)"
        side_effects:
          - "asset deal_status -> BINDING"
          - "all DueDiligenceItems still OPEN | CONTESTED -> WITHDRAWN (retrade window lapsed)"
      - from: BINDING
        to: CLOSING
        trigger: "POST /disposition/psas/{id}/begin_closing"
        actor: DispositionManager
        preconditions:
          - "if asset.loan_balance_cents > 0: a CONFIRMED LoanPayoff exists for the asset (ERR_PAYOFF_NOT_CONFIRMED)"
          - "an APPROVED ClosingStatement exists for this PSA (ERR_STATEMENT_NOT_APPROVED)"
          - "all Deposits of this PSA are POSTED (ERR_DEPOSIT_NOT_POSTED)"
        side_effects:
          - "asset deal_status -> CLOSING"
      - from: CLOSING
        to: BINDING
        trigger: "system (cascade: its ClosingStatement flipped APPROVED -> STALE)"
        actor: system
        preconditions: []
        side_effects:
          - "asset deal_status -> BINDING"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /disposition/psas/{id}/record_closing"
        actor: DispositionManager | ClosingOfficer
        preconditions:
          - "a SETTLED LoanPayoff exists when asset.loan_balance_cents > 0 (ERR_PAYOFF_NOT_CONFIRMED)"
          - "an APPROVED ClosingStatement exists (ERR_STATEMENT_NOT_APPROVED)"
        side_effects:
          - "all POSTED Deposits -> APPLIED"
          - "APPROVED ClosingStatement -> FINALIZED"
          - "auto-create EscrowHoldback: amount_cents = statement.holdback_cents, release_date = closing_date + 365 days, status HELD"
          - "asset deal_status -> SOLD; final_sale_price_cents = price_cents"
          - "ACTIVE BrokerEngagement -> COMPLETED with commission_final_cents computed on price_cents"
      - from: "DD_ACTIVE"
        to: TERMINATED
        trigger: "POST /disposition/psas/{id}/terminate {reason: BUYER_DD}"
        actor: Buyer | DispositionManager
        preconditions:
          - "Buyer caller: X-User-ID == psa.buyer_bidder_id (ERR_FORBIDDEN_ROLE); Buyer may only use BUYER_DD and only while DD_ACTIVE (ERR_INVALID_STATE_TRANSITION past lapse)"
        side_effects:
          - "all POSTED Deposits -> REFUNDED; all DUE | DELINQUENT Deposits -> REFUNDED with amount released = 0 recorded"
          - "asset deal_status -> IDLE"
          - "OPEN | CONTESTED | ACCEPTED DueDiligenceItems -> WITHDRAWN"
      - from: "EXECUTED | DD_ACTIVE | BINDING | CLOSING"
        to: TERMINATED
        trigger: "POST /disposition/psas/{id}/terminate {reason: BUYER_DEFAULT | SELLER_DEFAULT | MUTUAL}"
        actor: DispositionManager
        preconditions:
          - "BUYER_DEFAULT requires status EXECUTED | DD_ACTIVE | BINDING | CLOSING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "BUYER_DEFAULT: all POSTED Deposits -> FORFEITED; asset.forfeited_deposits_cents += sum(forffeited amounts); asset deal_status -> IDLE"
          - "SELLER_DEFAULT | MUTUAL: all POSTED Deposits -> REFUNDED; asset deal_status -> IDLE"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade of a newer PSA created on the same asset)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deposit
    initial_state: DUE
    terminal_states: [REFUNDED, FORFEITED, APPLIED]
    transitions:
      - from: DUE
        to: POSTED
        trigger: "POST /disposition/deposits/{id}/post"
        actor: ClosingOfficer
        preconditions:
          - "status == DUE (ERR_INVALID_STATE_TRANSITION — a deposit whose due date passed has already been swept to DELINQUENT)"
          - "psa.status not in {TERMINATED, CLOSED, SUPERSEDED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "posted_at = clock"
      - from: DUE
        to: DELINQUENT
        trigger: "system (clock sweep when clock > due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POSTED
        to: REFUNDED
        trigger: "system (cascade of PSA terminate with reason BUYER_DD | SELLER_DEFAULT | MUTUAL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POSTED
        to: FORFEITED
        trigger: "system (cascade of PSA terminate with reason BUYER_DEFAULT)"
        actor: system
        preconditions: []
        side_effects:
          - "asset.forfeited_deposits_cents += amount_cents"
      - from: POSTED
        to: APPLIED
        trigger: "system (cascade of PSA record_closing)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DueDiligenceItem
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, RESCINDED]
    note: "CYCLIC contest loop: CONTESTED -> OPEN via supplement (buyer adds evidence), may loop repeatedly until window closes. ACCEPTED -> RESCINDED is the compensating action that must leave zero drift."
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /disposition/dd-items/{id}/respond {decision: ACCEPT}"
        actor: DispositionManager
        preconditions:
          - "psa.status == DD_ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "aggregate cap: accepted_retrade_total_cents + accepted <= round_half_up(original_price_cents * 500bps) (ERR_RETRADE_CAP_EXCEEDED)"
        side_effects:
          - "accepted_reduction_cents = min(requested_reduction_cents, round_half_up(psa.price_cents * 200bps))"
          - "psa.price_cents -= accepted_reduction_cents; psa.accepted_retrade_total_cents += accepted_reduction_cents"
          - "engagement.commission_provisional_cents recomputed on new price (cascade hop 2)"
          - "any ClosingStatement of this PSA in PENDING_REVIEW | APPROVED -> STALE (cascade hop 2); if asset deal_status == CLOSING and its statement flipped, deal CLOSING -> BINDING and psa CLOSING -> BINDING (cascade hop 3)"
      - from: OPEN
        to: REJECTED
        trigger: "POST /disposition/dd-items/{id}/respond {decision: REJECT}"
        actor: DispositionManager
        preconditions:
          - "psa.status == DD_ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: OPEN
        to: CONTESTED
        trigger: "POST /disposition/dd-items/{id}/respond {decision: CONTEST}"
        actor: DispositionManager
        preconditions:
          - "psa.status == DD_ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: CONTESTED
        to: OPEN
        trigger: "POST /disposition/dd-items/{id}/supplement"
        actor: Buyer
        preconditions:
          - "X-User-ID == psa.buyer_bidder_id (ERR_FORBIDDEN_ROLE)"
          - "clock <= psa.dd_deadline (ERR_RETRADE_WINDOW_CLOSED)"
        side_effects:
          - "requested_reduction_cents replaced when supplied"
      - from: "OPEN | CONTESTED"
        to: WITHDRAWN
        trigger: "system (cascade of PSA lapse or terminate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /disposition/dd-items/{id}/rescind"
        actor: DispositionManager
        preconditions:
          - "psa.status == DD_ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "psa.price_cents += accepted_reduction_cents; psa.accepted_retrade_total_cents -= accepted_reduction_cents (exact reversal, no drift)"
          - "engagement.commission_provisional_cents recomputed on restored price"
          - "any ClosingStatement of this PSA in PENDING_REVIEW | APPROVED -> STALE"

  - entity: LoanPayoff
    initial_state: QUOTED
    terminal_states: [SETTLED]
    note: "CYCLIC quote refresh: QUOTED -> STALE (expiry) -> QUOTED via requote with fresh rates."
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /disposition/payoffs/{id}/confirm"
        actor: LoanServicer
        preconditions:
          - "status == QUOTED (ERR_INVALID_STATE_TRANSITION); a quote whose expiry has passed has already been swept to STALE by the clock"
        side_effects:
          - "any ClosingStatement of any non-terminal PSA of this asset in PENDING_REVIEW | APPROVED -> STALE (payoff_total input changed — derived-field reconciliation)"
      - from: QUOTED
        to: STALE
        trigger: "system (clock sweep when clock > quote_expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STALE
        to: QUOTED
        trigger: "POST /disposition/payoffs/{id}/requote"
        actor: DispositionManager
        preconditions: []
        side_effects:
          - "quoted_at = clock; quote_expires_at = clock + 10 days; all computed fields recomputed with current inputs"
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /disposition/payoffs/{id}/settle"
        actor: ClosingOfficer
        preconditions:
          - "asset deal_status == CLOSING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "final_total_cents recomputed as of clock (final variant of loan_exit_cost)"

  - entity: ClosingStatement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    note: "CYCLIC dispute loop: PENDING_REVIEW -> DISPUTED -> (submit) -> PENDING_REVIEW. STALE is a derived-field reconciliation posture, re-entered from PENDING_REVIEW | APPROVED."
    transitions:
      - from: "DRAFT | DISPUTED | STALE"
        to: PENDING_REVIEW
        trigger: "POST /disposition/statements/{id}/submit"
        actor: ClosingOfficer
        preconditions: []
        side_effects:
          - "all computed fields recomputed against current PSA price / payoff / deposits before entering review"
          - "prepared_by_user_id = X-User-ID"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /disposition/statements/{id}/approve"
        actor: DispositionManager
        preconditions:
          - "approver X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: PENDING_REVIEW
        to: DISPUTED
        trigger: "POST /disposition/statements/{id}/dispute"
        actor: Buyer
        preconditions:
          - "X-User-ID == psa.buyer_bidder_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: "PENDING_REVIEW | APPROVED"
        to: STALE
        trigger: "system (cascade: retrade accepted/rescinded on the PSA, or payoff confirm, changing a computed input)"
        actor: system
        preconditions: []
        side_effects:
          - "if psa.status == CLOSING: psa -> BINDING and asset deal_status CLOSING -> BINDING (closing gate re-opens)"
      - from: APPROVED
        to: FINALIZED
        trigger: "system (cascade of PSA record_closing)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EscrowHoldback
    initial_state: HELD
    terminal_states: [RELEASED]
    note: "PARTIALLY_RELEASED entered on any partial release while available stays > 0; RELEASED when available_cents reaches 0 by any path (release or claim payouts). Auto full release at release_date when no FILED claims."
    transitions:
      - from: HELD
        to: PARTIALLY_RELEASED
        trigger: "POST /disposition/escrows/{id}/release (partial amount)"
        actor: DispositionManager
        preconditions:
          - "no claim with claim_status == FILED exists (ERR_RELEASE_BLOCKED_BY_CLAIMS)"
          - "0 < amount_cents < available_cents (ERR_INVALID_REQUEST); amount == available transitions to RELEASED instead"
        side_effects:
          - "released_to_seller_cents += amount; available_cents recomputed"
      - from: "HELD | PARTIALLY_RELEASED"
        to: RELEASED
        trigger: "POST /disposition/escrows/{id}/release (amount == available) OR system (clock sweep at/after release_date with no FILED claims) OR system (claim payouts exhaust available)"
        actor: DispositionManager | system
        preconditions:
          - "manual path: no FILED claims (ERR_RELEASE_BLOCKED_BY_CLAIMS)"
        side_effects:
          - "released_to_seller_cents += prior available; available_cents = 0"
      - from: "(unchanged — claim filed)"
        to: "(unchanged)"
        trigger: "POST /disposition/escrows/{id}/file_claim"
        actor: Buyer
        preconditions:
          - "status != RELEASED (ERR_INVALID_STATE_TRANSITION)"
          - "clock <= release_date (ERR_INVALID_STATE_TRANSITION — indemnity window lapsed)"
          - "X-User-ID == psa.buyer_bidder_id (ERR_FORBIDDEN_ROLE)"
          - "amount_cents > 0 (ERR_INVALID_REQUEST) and amount_cents <= available_cents (ERR_CLAIM_EXCEEDS_AVAILABLE)"
        side_effects:
          - "append claim {claim_id server-minted, claim_status FILED, filed_by_user_id = X-User-ID, filed_at = clock}"
      - from: "(unchanged — claim decided)"
        to: "(unchanged; may flip to RELEASED when payout exhausts available)"
        trigger: "POST /disposition/escrows/{id}/decide_claim"
        actor: DispositionManager
        preconditions:
          - "claim exists and claim_status == FILED (ERR_INVALID_STATE_TRANSITION)"
          - "decision DENY: claim -> DENIED, no money moves"
          - "decision PAY: paid_amount_cents required, 0 < paid <= min(claim.amount_cents, available_cents) (ERR_CLAIM_EXCEEDS_AVAILABLE); decider X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "PAY: paid_to_claims_cents += paid_amount_cents; available_cents recomputed; claim -> PAID with paid_amount_cents; if available_cents == 0 -> status RELEASED"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: analysis-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /disposition/analyses"
    occ_field: expected_asset_version
    description: |
      Creating a HoldSellAnalysis legitimately supersedes the asset's existing
      DRAFT | SUBMITTED analysis. A creator whose request carries an
      expected_asset_version older than the asset's current version is working
      from a stale view of the asset (e.g., another analyst's create already
      superseded the prior draft and bumped Asset.version) and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: psa-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /disposition/psas"
    occ_field: expected_asset_version
    description: |
      Creating a PurchaseAgreement legitimately supersedes the asset's existing
      DRAFT PSA and flips deal_status to PSA_DRAFT. A request carrying an
      expected_asset_version older than the asset's current version is rejected
      as stale, because another writer may have already created or superseded a
      draft against a newer asset state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hold_sell_valuation
    trigger: "POST /disposition/analyses (computed at creation; frozen on the analysis row thereafter)"
    algorithm: forward_looking
    formula: |
      DIRECT_CAP variant:
        hold_value_direct_cap_cents = round_half_up(asset.noi_cents * 10000 / cap_rate_bps)
      DCF variant (n = hold_years, g = asset.noi_growth_bps/10000, d = discount_rate_bps/10000):
        NOI_y = asset.noi_cents * (1+g)^y  for y = 1..n+1   (float, NO per-year rounding)
        TV = NOI_{n+1} * 10000 / exit_cap_rate_bps
        hold_value_dcf_cents = round_half_up( SUM_{y=1..n} NOI_y/(1+d)^y + TV/(1+d)^n )
        (single rounding at the end)
      sell_net_cents = est_sale_price_cents - est_selling_costs_cents
      hold_value_cents = the variant named by selected_method
      value_gap_cents = sell_net_cents - hold_value_cents
      Recommendation (hysteresis band, INTEGER arithmetic, inclusive boundaries):
        SELL     if sell_net_cents * 100 >= hold_value_cents * 105
        HOLD     if sell_net_cents * 100 <= hold_value_cents * 95
        MARGINAL otherwise
    input_set: "the subject Asset (any marketing_status) + analysis input fields; asset state does not filter the calc"
    constants:
      SELL_BAND_NUM: 105
      HOLD_BAND_NUM: 95
      BAND_DEN: 100
    precision: "integer cents; round_half_up; integer cross-multiplication for the band comparisons"
    variants:
      - name: DIRECT_CAP
        when: "selected_method == DIRECT_CAP"
        difference: "hold_value_cents uses NOI / cap rate; ignores growth and discount assumptions"
      - name: DCF
        when: "selected_method == DCF"
        difference: "hold_value_cents uses discounted cash flow + terminal value; for the same asset inputs the two variants differ (e.g. NOI $2.5M, cap 550bps, growth 300bps, discount 800bps, exit 600bps, 5y: DIRECT_CAP 4,545,454,545 vs DCF 4,472,790,059)"

  - name: bidder_qualification_threshold
    trigger: "POST /disposition/bidders/{id}/qualify"
    algorithm: threshold
    formula: |
      QUALIFIED if proof_of_funds_cents * 100 >= asset.guidance_price_cents * 25
      else DISQUALIFIED (caller receives ERR_INSUFFICIENT_PROOF_OF_FUNDS)
      Boundary: exact equality QUALIFIES (>=, inclusive). Integer cross-multiplication, no floats.
    input_set: "the Bidder (must be PENDING) + its Asset.guidance_price_cents"
    constants:
      QUALIFY_PCT: 25
    precision: "integer arithmetic"

  - name: deposit_schedule
    trigger: "POST /disposition/psas/{id}/execute"
    algorithm: aggregation
    formula: |
      initial_deposit_cents    = max(round_half_up(price_cents * 300 / 10000), MIN_DEPOSIT_CENTS)
      additional_deposit_cents = round_half_up(price_cents * 200 / 10000)
      INITIAL due_date    = executed_at + 3 days
      ADDITIONAL due_date = dd_deadline
      Amounts are FROZEN at execute; later retrades do NOT re-amount existing deposits.
    input_set: "PSA price at execute + bid timing fields"
    constants:
      INITIAL_BPS: 300
      ADDITIONAL_BPS: 200
      MIN_DEPOSIT_CENTS: 10000000
      INITIAL_DUE_DAYS: 3
    precision: "integer cents, round_half_up per component"

  - name: retrade_cap_enforcement
    trigger: "POST /disposition/dd-items/{id}/respond {decision: ACCEPT}"
    algorithm: chronological
    formula: |
      On each accept (evaluation order = order of respond calls; running state):
        per_item_cap = round_half_up(psa.price_cents * RETRADE_ITEM_CAP_BPS / 10000)   # cap keyed on CURRENT price
        accepted     = min(item.requested_reduction_cents, per_item_cap)
        aggregate_cap = round_half_up(psa.original_price_cents * RETRADE_AGGREGATE_CAP_BPS / 10000)  # keyed on ORIGINAL price
        if psa.accepted_retrade_total_cents + accepted > aggregate_cap:
          reject whole accept with ERR_RETRADE_CAP_EXCEEDED (no partial application; item stays OPEN)
        else:
          apply: price_cents -= accepted; accepted_retrade_total_cents += accepted
      Order matters: per-item caps shrink as price falls, so the same set of requests
      accepted in a different order can yield different accepted amounts.
    input_set: "PSA current price_cents, original_price_cents, accepted_retrade_total_cents; the item being accepted"
    constants:
      RETRADE_ITEM_CAP_BPS: 200
      RETRADE_AGGREGATE_CAP_BPS: 500
    precision: "integer cents, round_half_up per cap"

  - name: broker_commission
    trigger: "PSA execute (provisional variant); every retrade accept/rescind (provisional recompute); PSA record_closing (final variant)"
    algorithm: tiered_pricing
    formula: |
      tier1_amount = min(price, TIER1_CAP)
      tier2_amount = min(max(price - TIER1_CAP, 0), TIER1_CAP)          # second $15M slice
      tier3_amount = max(price - TIER2_CAP, 0)
      commission = round_half_up(tier1_amount * 200/10000)
                 + round_half_up(tier2_amount * 150/10000)
                 + round_half_up(tier3_amount * 100/10000)              # round PER TIER, then sum (pinned order)
      commission = max(commission, MIN_FEE_CENTS)                        # floor applied AFTER tier sum
    input_set: "PSA price_cents (provisional: price at execute / after each retrade; final: price at record_closing)"
    constants:
      TIER1_CAP: 1500000000
      TIER2_CAP: 3000000000
      TIER1_BPS: 200
      TIER2_BPS: 150
      TIER3_BPS: 100
      MIN_FEE_CENTS: 25000000
    precision: "integer cents; round_half_up per tier, sum of rounded tiers, then floor"
    variants:
      - name: provisional
        when: "PSA executed but not CLOSED; stored on engagement.commission_provisional_cents"
        difference: "computed on the then-current price; recomputed on every retrade accept/rescind"
      - name: final
        when: "PSA record_closing; stored on engagement.commission_final_cents"
        difference: "computed once on the final price; when retrades changed the price, final != provisional (e.g. price 5,000,000,000 -> 72,500,000 provisional; after retrades to 4,841,200,000 -> 70,912,000 final)"

  - name: prepayment_penalty
    trigger: "POST /disposition/payoffs (and requote) when method == PAYOFF"
    algorithm: threshold
    formula: |
      STEP_DOWN (asset.prepayment_type == STEP_DOWN), bands on asset.remaining_term_months m:
        m > 48        -> penalty = round_half_up(balance * 500/10000)
        36 < m <= 48  -> 400bps
        24 < m <= 36  -> 300bps
        12 < m <= 24  -> 200bps
        0 < m <= 12   -> 100bps
        m == 0        -> 0
        (boundary m == 48 falls in the 400bps band: strict > on the upper edge)
      YIELD_MAINTENANCE (asset.prepayment_type == YIELD_MAINTENANCE):
        i = reinvestment_rate_bps / 10000 / 12
        annuity_factor = (1 - (1+i)^(-m)) / i        # if reinvestment_rate_bps == 0: annuity_factor = m
        raw = balance * max(0, loan_rate_bps - reinvestment_rate_bps)/10000 / 12 * annuity_factor
        penalty = max(round_half_up(raw), round_half_up(balance * 100/10000))   # 1% floor
      NONE -> penalty = 0
      DEFEASANCE method -> penalty = 0 (cost carried by defeasance_cost instead)
    input_set: "Asset loan block (balance, rate, remaining_term_months, prepayment_type) + payoff reinvestment_rate_bps"
    constants:
      YM_FLOOR_BPS: 100
      SD_BAND_5: 500
      SD_BAND_4: 400
      SD_BAND_3: 300
      SD_BAND_2: 200
      SD_BAND_1: 100
    precision: "integer cents; float math inside annuity_factor; round_half_up once at the end; floor after rounding"

  - name: defeasance_cost
    trigger: "POST /disposition/payoffs (and requote) when method == DEFEASANCE"
    algorithm: constraint_propagation
    formula: |
      i = reinvestment_rate_bps / 10000 / 12 ; m = asset.remaining_term_months
      PV = SUM_{t=1..m} asset.monthly_debt_service_cents / (1+i)^t
         + asset.loan_balance_cents / (1+i)^m          # balloon of remaining principal at t = m
      defeasance_cost_cents = round_half_up(PV) + asset.defeasance_fee_cents
      ROUNDING ORDER (pinned): the PV sum is carried in full float precision and rounded
      ONCE at the end; rounding each monthly term before summing is a different algorithm
      and yields a different cent (e.g. ds 19,000,000, m 46, bal 3,000,000,000, r 400bps:
      round-once 3,383,231,264 vs round-per-month 3,383,231,265 — the pinned answer is 3,383,231,264).
      Lockout/eligibility: method DEFEASANCE requires asset.defeasance_allowed == true
      (ERR_DEFEASANCE_NOT_ALLOWED); both methods require
      anticipated_settlement_date > asset.prepayment_lockout_until when set (ERR_LOAN_LOCKED_OUT).
    input_set: "Asset loan block + defeasance fee + payoff reinvestment_rate_bps"
    constants:
      QUOTE_VALIDITY_DAYS: 10
    precision: "float accumulation, single round_half_up at end, fee added after rounding"
    variants:
      - name: payoff_route
        when: "method == PAYOFF"
        difference: "total = balance + accrued + prepayment_penalty (penalty per prepayment_type)"
      - name: defeasance_route
        when: "method == DEFEASANCE"
        difference: "total = defeasance_cost; the two routes give different totals for identical loan inputs (3B balance, 650bps note, 400bps reinvestment, 46 months, ds 19,000,000, fee 50,000,000, 12 accrued days: PAYOFF 3,272,632,822 vs DEFEASANCE 3,433,231,264)"

  - name: accrued_interest
    trigger: "POST /disposition/payoffs (and requote)"
    algorithm: aggregation
    formula: |
      accrued_interest_cents = round_half_up(loan_balance_cents * loan_rate_bps/10000 * accrued_days / 360)
      (30/360-style accrual basis, pinned)
    input_set: "Asset loan block + payoff accrued_days"
    constants:
      ACCRUAL_BASIS_DAYS: 360
    precision: "integer cents, round_half_up"

  - name: proration_set
    trigger: "POST /disposition/statements (and recompute on submit)"
    algorithm: interval_merge
    formula: |
      Seller is responsible through the day BEFORE closing_date; buyer from closing_date onward.
      ACTUAL_365 variant (convention == ACTUAL_365): real calendar day counts, year divisor 365.
        tax_seller_days  = calendar days from tax_period_start through closing_date - 1 day
        tax_seller_share = round_half_up(property_tax_annual_cents * tax_seller_days / 365)   # credit to buyer
        rent_buyer_days  = calendar days from closing_date through last day of closing month
        rent_buyer_share = round_half_up(rent_monthly_cents * rent_buyer_days / days_in_closing_month)  # credit to buyer
        cam_buyer_days   = 365 - tax_seller_days                       # remainder of tax-year-aligned period
        cam_buyer_share  = round_half_up(cam_annual_cents * cam_buyer_days / 365)             # debit to buyer
      BANKERS_360 variant (convention == BANKERS_360): 30-day months, 360-day year.
        tax_seller_days  = 30 * (full months elapsed before closing month) + (closing_day - 1)
        tax_seller_share = round_half_up(property_tax_annual_cents * tax_seller_days / 360)
        rent_buyer_days  = 30 - closing_day + 1
        rent_buyer_share = round_half_up(rent_monthly_cents * rent_buyer_days / 30)
        cam_buyer_days   = 360 - tax_seller_days
        cam_buyer_share  = round_half_up(cam_annual_cents * cam_buyer_days / 360)
      proration_buyer_credit_cents = tax_seller_share + rent_buyer_share
      proration_buyer_debit_cents  = cam_buyer_share
      ROUNDING ORDER (pinned): round each line, then sum (sum-then-round is a different algorithm).
      Worked divergence (identical inputs, closing 2026-03-15, tax 18,250,000 from 2026-01-01,
      rent 4,960,000, CAM 7,300,000): ACTUAL_365 -> tax 3,650,000 / rent 2,720,000 / CAM 5,840,000
      (credit 6,370,000, debit 5,840,000); BANKERS_360 -> tax 3,751,389 / rent 2,645,333 /
      CAM 5,799,444 (credit 6,396,722, debit 5,799,444).
    input_set: "statement inputs + PSA closing_date and convention"
    constants:
      ACTUAL_YEAR_DAYS: 365
      BANKERS_YEAR_DAYS: 360
      BANKERS_MONTH_DAYS: 30
    precision: "integer cents; per-line round_half_up, then sum of rounded lines"
    variants:
      - name: ACTUAL_365
        when: "psa.proration_convention == ACTUAL_365"
        difference: "real day counts over a 365-day year"
      - name: BANKERS_360
        when: "psa.proration_convention == BANKERS_360"
        difference: "30/360 day counts; produces different cents for identical inputs (see worked divergence)"

  - name: closing_settlement_totals
    trigger: "POST /disposition/statements (and recompute on submit)"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER (pinned — circular-looking dependency resolved):
        1. price            = psa.price_cents (AFTER all accepted retrades)
        2. commission_cents = broker_commission(price)          # tiered, depends on (1)
        3. payoff_total_cents = confirmed payoff total_estimated_cost_cents, else 0
        4. holdback_cents   = max(round_half_up(price * HOLDBACK_BPS/10000), MIN_HOLDBACK_CENTS)  # depends on (1)
        5. deposits_applied_cents = sum of POSTED deposits of the PSA at creation time
        6. buyer_due_cents  = price + proration_buyer_debit_cents - proration_buyer_credit_cents - deposits_applied_cents
        7. seller_net_cents = price + proration_buyer_debit_cents - proration_buyer_credit_cents
                              - commission_cents - payoff_total_cents - holdback_cents
      Worked (price 1,800,000,000, ACTUAL_365 prorations credit 6,370,000 / debit 5,840,000,
      commission 34,500,000, payoff 833,833,333, holdback 9,000,000, deposits 90,000,000):
        buyer_due = 1,709,470,000 ; seller_net = 922,136,667.
    input_set: "PSA (price, deposits), confirmed LoanPayoff, proration outputs, engagement tier constants"
    constants:
      HOLDBACK_BPS: 50
      MIN_HOLDBACK_CENTS: 1000000
    precision: "integer cents; each component rounded by its own rule before summation"

  - name: escrow_partition_identity
    trigger: "escrow release / decide_claim / auto-release sweep"
    algorithm: waterfall_allocation
    formula: |
      CONSERVED QUANTITY (invariant, checked after every escrow mutation):
        amount_cents == available_cents + released_to_seller_cents + paid_to_claims_cents
      Claim payouts are processed one decide_claim at a time; paid_amount <= min(claim.amount, available).
      When available_cents reaches 0 by any path, status -> RELEASED.
    input_set: "the EscrowHoldback row"
    constants: {}
    precision: "integer cents"

  - name: deposit_cash_conservation
    trigger: "PSA terminate (any reason) and record_closing"
    algorithm: aggregation
    formula: |
      CONSERVED QUANTITY (invariant over a terminated PSA):
        sum(amount_cents of Deposits that reached POSTED)
          == sum(amount_cents of Deposits now REFUNDED)
           + sum(amount_cents of Deposits now FORFEITED)
      and asset.forfeited_deposits_cents increases by exactly the FORFEITED sum.
      Forward/compensating pair: post then terminate-with-refund leaves buyer whole and
      forfeited_deposits_cents unchanged; post then BUYER_DEFAULT moves the same cents to
      forfeited_deposits_cents with zero refunds.
    input_set: "all Deposits of the PSA + Asset.forfeited_deposits_cents"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "caller role is listed in the endpoint's roles; entity-backed ownership: Buyer X-User-ID must equal the Bidder id underlying the resource (bid.bidder_id / psa.buyer_bidder_id)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "every id in path and request body resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "request-body schema: required fields present, enums valid, integer ranges respected, window_end > window_start, amounts > 0 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: state
    check: "target entity is in a from-state of the invoked transition (generic state-machine rejection)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "bid create/improve requires asset.marketing_status == OFFERS_OPEN"
    error_id: ERR_OFFERS_NOT_OPEN
    http_status: 409
    applies_to: "POST /disposition/bids; POST /disposition/bids/{id}/improve"
  - priority: 7
    category: business_safety
    check: "segregation of duties: analysis decider != creator; document verifier != uploader; statement approver != preparer; claim decider != filer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "decide / verify_document / approve / decide_claim"
  - priority: 8
    category: business_temporal
    check: "bid create/improve requires clock <= asset.offers_deadline"
    error_id: ERR_OFFERS_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /disposition/bids; POST /disposition/bids/{id}/improve"
  - priority: 9
    category: business_temporal
    check: "dd-item create/supplement requires clock <= psa.dd_deadline"
    error_id: ERR_RETRADE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /disposition/dd-items; POST /disposition/dd-items/{id}/supplement"
  - priority: 12
    category: business_temporal
    check: "engagement create/activate window must not CLOSED-interval overlap another PROPOSED|ACTIVE engagement of the same asset (adjacency start == prior end IS overlap)"
    error_id: ERR_ENGAGEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /disposition/engagements; POST /disposition/engagements/{id}/activate"
  - priority: 13
    category: business_temporal
    check: "grant_access window must not HALF-OPEN overlap an ACTIVE window of the same bidder (adjacency allowed)"
    error_id: ERR_ACCESS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /disposition/bidders/{id}/grant_access"
  - priority: 14
    category: business_temporal
    check: "relist requires clock >= last_campaign_closed_at + 7 days"
    error_id: ERR_RELIST_COOLING_PERIOD
    http_status: 409
    applies_to: "POST /disposition/assets/{id}/list (from OFFERS_CLOSED)"
  - priority: 15
    category: business_temporal
    check: "payoff/defeasance anticipated_settlement_date must be after asset.prepayment_lockout_until when set"
    error_id: ERR_LOAN_LOCKED_OUT
    http_status: 409
    applies_to: "POST /disposition/payoffs"
  - priority: 16
    category: business_referential
    check: "bid create requires bidder.qualification_status == QUALIFIED"
    error_id: ERR_BIDDER_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /disposition/bids"
  - priority: 17
    category: business_referential
    check: "grant_access requires bidder QUALIFIED and package PUBLISHED"
    error_id: ERR_PACKAGE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /disposition/bidders/{id}/grant_access"
  - priority: 18
    category: business_referential
    check: "psa create requires bid.status == SELECTED and bid.asset_id == asset_id"
    error_id: ERR_BID_NOT_SELECTED
    http_status: 409
    applies_to: "POST /disposition/psas"
  - priority: 19
    category: business_referential
    check: "asset list requires latest analysis APPROVED; recommendation HOLD separately rejected"
    error_id: ERR_ANALYSIS_NOT_APPROVED
    http_status: 409
    applies_to: "POST /disposition/assets/{id}/list"
  - priority: 20
    category: business_referential
    check: "asset list blocked when latest APPROVED analysis recommendation == HOLD"
    error_id: ERR_HOLD_RECOMMENDED
    http_status: 409
    applies_to: "POST /disposition/assets/{id}/list"
  - priority: 21
    category: business_referential
    check: "asset list / package publish require an ACTIVE engagement"
    error_id: ERR_NO_ACTIVE_ENGAGEMENT
    http_status: 409
    applies_to: "POST /disposition/assets/{id}/list; POST /disposition/packages/{id}/publish"
  - priority: 22
    category: business_referential
    check: "open_offers requires package PUBLISHED"
    error_id: ERR_PACKAGE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /disposition/assets/{id}/open_offers"
  - priority: 23
    category: business_referential
    check: "begin_closing/record_closing require CONFIRMED (resp. SETTLED) payoff when asset leveraged"
    error_id: ERR_PAYOFF_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /disposition/psas/{id}/begin_closing; POST /disposition/psas/{id}/record_closing"
  - priority: 24
    category: business_referential
    check: "begin_closing/record_closing require an APPROVED closing statement"
    error_id: ERR_STATEMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /disposition/psas/{id}/begin_closing; POST /disposition/psas/{id}/record_closing"
  - priority: 25
    category: business_referential
    check: "open_dd/begin_closing require INITIAL (resp. all) deposits POSTED"
    error_id: ERR_DEPOSIT_NOT_POSTED
    http_status: 409
    applies_to: "POST /disposition/psas/{id}/open_dd; POST /disposition/psas/{id}/begin_closing"
  - priority: 26
    category: business_constraint
    check: "method DEFEASANCE requires asset.defeasance_allowed == true"
    error_id: ERR_DEFEASANCE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /disposition/payoffs"
  - priority: 27
    category: business_constraint
    check: "document upload/supersede blocked while asset.marketing_status == OFFERS_OPEN"
    error_id: ERR_DATA_ROOM_LOCKED
    http_status: 409
    applies_to: "POST /disposition/packages/{id}/upload_document"
  - priority: 28
    category: business_constraint
    check: "publish requires completeness_pct == 100"
    error_id: ERR_PACKAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /disposition/packages/{id}/publish"
  - priority: 29
    category: business_constraint
    check: "retrade accept must fit per-item cap (2% of current price) and aggregate cap (5% of original price)"
    error_id: ERR_RETRADE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /disposition/dd-items/{id}/respond"
  - priority: 30
    category: business_fiscal
    check: "bid create requires deposit_cents >= max(round_half_up(price * 300bps), MIN_DEPOSIT_CENTS)"
    error_id: ERR_DEPOSIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /disposition/bids"
  - priority: 31
    category: business_fiscal
    check: "bidder qualification threshold (25% of guidance, inclusive)"
    error_id: ERR_INSUFFICIENT_PROOF_OF_FUNDS
    http_status: 422
    applies_to: "POST /disposition/bidders/{id}/qualify"
  - priority: 32
    category: business_fiscal
    check: "claim amount <= available; release blocked while FILED claims exist"
    error_id: ERR_CLAIM_EXCEEDS_AVAILABLE
    http_status: 422
    applies_to: "POST /disposition/escrows/{id}/file_claim; POST /disposition/escrows/{id}/decide_claim"
  - priority: 33
    category: business_fiscal
    check: "bid improve requires strictly greater price than current"
    error_id: ERR_BID_IMPROVEMENT_TOO_LOW
    http_status: 422
    applies_to: "POST /disposition/bids/{id}/improve"
  - priority: 34
    category: business_fiscal
    check: "manual escrow release rejected while any claim is FILED"
    error_id: ERR_RELEASE_BLOCKED_BY_CLAIMS
    http_status: 409
    applies_to: "POST /disposition/escrows/{id}/release"
  - priority: 35
    category: business_constraint
    check: "OCC: expected_asset_version must equal current Asset.version on superseding creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /disposition/analyses; POST /disposition/psas"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/disposition/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Setting the clock triggers the system sweep: engagement expiry (ACTIVE past window_end -> EXPIRED), deposit delinquency (DUE past due_date -> DELINQUENT), payoff quote staleness (QUOTED past quote_expires_at -> STALE), access-window expiry (ACTIVE past end -> EXPIRED), escrow auto-release (at/after release_date with no FILED claims -> RELEASED)."
    roles: [DispositionManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["system sweep of all clock-driven auto-transitions"]

  # --- Asset ---
  - method: POST
    path: "/disposition/assets"
    description: "Create an Asset (marketing EVALUATION, deal IDLE)"
    roles: [DispositionManager, AssetAnalyst]
    code: 201
    input: [name, market, asset_type, noi_cents, noi_growth_bps, book_value_cents, guidance_price_cents, loan_balance_cents, loan_rate_bps, loan_maturity_date, monthly_debt_service_cents, remaining_term_months, prepayment_type, "prepayment_lockout_until?", defeasance_allowed, "defeasance_fee_cents?"]
    output: Asset
    side_effects: []
  - method: GET
    path: "/disposition/assets"
    description: "List (sorted by created_at ascending) assets with optional status filters and pagination"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: ["marketing_status?", "deal_status?", "limit?", "offset?"]
    output: "Asset[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}"
    description: "Get one Asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: POST
    path: "/disposition/assets/{id}/list"
    description: "List (sorted by created_at ascending) for sale (EVALUATION -> LISTED) or relist (OFFERS_CLOSED -> LISTED with 7-day cooling gap)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: Asset
    side_effects: ["marketing_status -> LISTED; increments Asset.version by 1"]
  - method: POST
    path: "/disposition/assets/{id}/open_offers"
    description: "Open call for offers with deadline"
    roles: [DispositionManager]
    code: 200
    input: [offers_deadline]
    output: Asset
    side_effects: ["marketing_status -> OFFERS_OPEN; sets offers_deadline; increments Asset.version by 1"]
  - method: POST
    path: "/disposition/assets/{id}/close_offers"
    description: "Close call for offers (clock must be >= offers_deadline)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: Asset
    side_effects: ["marketing_status -> OFFERS_CLOSED; sets last_campaign_closed_at; increments Asset.version by 1"]
  - method: POST
    path: "/disposition/assets/{id}/withdraw"
    description: "Withdraw asset from market (terminal for marketing dimension)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: Asset
    side_effects: ["marketing_status -> WITHDRAWN; PENDING|QUALIFIED bidders -> DISQUALIFIED; SUBMITTED|SHORTLISTED bids -> REJECTED; increments Asset.version by 1"]
  - method: GET
    path: "/disposition/assets/{id}/analyses"
    description: "List (sorted by created_at ascending) HoldSellAnalysis of an asset (FK reverse reachability)"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "HoldSellAnalysis[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}/engagements"
    description: "List (sorted by created_at ascending) BrokerEngagement of an asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "BrokerEngagement[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}/packages"
    description: "List (sorted by created_at ascending) OfferingPackage of an asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "OfferingPackage[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}/bidders"
    description: "List (sorted by created_at ascending) Bidder registrations of an asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "Bidder[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}/bids"
    description: "List (sorted by created_at ascending) Bids of an asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "Bid[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}/psas"
    description: "List (sorted by created_at ascending) PurchaseAgreements of an asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "PurchaseAgreement[]"
    side_effects: []
  - method: GET
    path: "/disposition/assets/{id}/payoffs"
    description: "List (sorted by created_at ascending) LoanPayoffs of an asset"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "LoanPayoff[]"
    side_effects: []

  # --- HoldSellAnalysis ---
  - method: POST
    path: "/disposition/analyses"
    description: "Create a HoldSellAnalysis (DRAFT); supersedes existing DRAFT|SUBMITTED analyses of the asset. OCC-guarded."
    roles: [AssetAnalyst]
    code: 201
    input: [asset_id, expected_asset_version, cap_rate_bps, discount_rate_bps, exit_cap_rate_bps, hold_years, selected_method, est_sale_price_cents, est_selling_costs_cents]
    output: HoldSellAnalysis
    side_effects: ["computes hold/sell valuation fields + recommendation", "existing DRAFT|SUBMITTED analyses of asset -> SUPERSEDED", "increments Asset.version by 1"]
  - method: POST
    path: "/disposition/analyses/{id}/submit"
    description: "Submit analysis for committee decision (creator only)"
    roles: [AssetAnalyst]
    code: 200
    input: []
    output: HoldSellAnalysis
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/disposition/analyses/{id}/decide"
    description: "Committee approve/reject (decider != creator)"
    roles: [InvestmentCommittee]
    code: 200
    input: [decision]
    output: HoldSellAnalysis
    side_effects: ["status -> APPROVED | REJECTED; sets decided_by_user_id"]
  - method: POST
    path: "/disposition/analyses/{id}/revise"
    description: "Return REJECTED analysis to DRAFT (creator only)"
    roles: [AssetAnalyst]
    code: 200
    input: []
    output: HoldSellAnalysis
    side_effects: ["status -> DRAFT; clears decided_by_user_id"]

  # --- BrokerEngagement ---
  - method: POST
    path: "/disposition/engagements"
    description: "Create engagement (PROPOSED); closed-interval overlap rejected vs PROPOSED|ACTIVE engagements of the asset"
    roles: [DispositionManager]
    code: 201
    input: [asset_id, broker_firm_name, broker_user_id, window_start, window_end]
    output: BrokerEngagement
    side_effects: []
  - method: POST
    path: "/disposition/engagements/{id}/activate"
    description: "Activate engagement (overlap re-checked; window must not be past)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: BrokerEngagement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/disposition/engagements/{id}/terminate"
    description: "Terminate engagement (blocked mid-deal)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: BrokerEngagement
    side_effects: ["status -> TERMINATED"]

  # --- OfferingPackage ---
  - method: POST
    path: "/disposition/packages"
    description: "Create OfferingPackage (DRAFT) for an asset"
    roles: [AssetAnalyst, Broker]
    code: 201
    input: [asset_id]
    output: OfferingPackage
    side_effects: []
  - method: POST
    path: "/disposition/packages/{id}/upload_document"
    description: "Upload one or more documents; same-category upload supersedes prior non-SUPERSEDED doc; blocked while OFFERS_OPEN"
    roles: [AssetAnalyst, Broker]
    code: 200
    input: [documents]
    output: OfferingPackage
    side_effects: ["appends UPLOADED docs", "prior same-category doc -> SUPERSEDED", "PUBLISHED package -> IN_REVIEW when a VERIFIED doc was superseded", "completeness_pct recomputed"]
  - method: POST
    path: "/disposition/packages/{id}/verify_document"
    description: "Verify UPLOADED documents by category (verifier != uploader per doc)"
    roles: [AssetAnalyst, DispositionManager]
    code: 200
    input: [categories]
    output: OfferingPackage
    side_effects: ["docs -> VERIFIED", "completeness_pct recomputed"]
  - method: POST
    path: "/disposition/packages/{id}/publish"
    description: "Publish package (requires completeness_pct == 100 and an ACTIVE engagement)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: OfferingPackage
    side_effects: ["status -> PUBLISHED; published_at = clock"]

  # --- Bidder ---
  - method: GET
    path: "/disposition/bidders/{id}"
    description: "Get one Bidder"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: Bidder
    side_effects: []
  - method: POST
    path: "/disposition/bidders"
    description: "Register a Bidder (PENDING)"
    roles: [Broker, DispositionManager]
    code: 201
    input: [asset_id, organization_name, proof_of_funds_cents]
    output: Bidder
    side_effects: []
  - method: POST
    path: "/disposition/bidders/{id}/qualify"
    description: "Evaluate 25% proof-of-funds threshold; QUALIFIED or DISQUALIFIED"
    roles: [DispositionManager]
    code: 200
    input: []
    output: Bidder
    side_effects: ["qualification_status -> QUALIFIED | DISQUALIFIED"]
  - method: POST
    path: "/disposition/bidders/{id}/reapply"
    description: "DISQUALIFIED -> PENDING with fresh proof of funds"
    roles: [Broker, DispositionManager]
    code: 200
    input: [proof_of_funds_cents]
    output: Bidder
    side_effects: ["qualification_status -> PENDING; proof_of_funds_cents replaced"]
  - method: POST
    path: "/disposition/bidders/{id}/grant_access"
    description: "Grant data-room access window (half-open overlap rejected per bidder; adjacency allowed)"
    roles: [Broker, DispositionManager]
    code: 200
    input: [window_start, window_end]
    output: Bidder
    side_effects: ["appends ACTIVE access window"]

  # --- Bid ---
  - method: POST
    path: "/disposition/bids"
    description: "Submit a bid (bidder must be QUALIFIED and equal to caller; asset OFFERS_OPEN; deadline; deposit minimum)"
    roles: [Buyer]
    code: 201
    input: [asset_id, bidder_id, price_cents, deposit_cents, dd_period_days, closing_period_days]
    output: Bid
    side_effects: []
  - method: GET
    path: "/disposition/bids/{id}"
    description: "Get one Bid"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/disposition/bidders/{id}/bids"
    description: "List (sorted by created_at ascending) Bids of a bidder (FK reverse reachability for Bid.bidder_id)"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "Bid[]"
    side_effects: []
  - method: POST
    path: "/disposition/bids/{id}/improve"
    description: "Best-and-final price improvement (strictly greater price; before deadline)"
    roles: [Buyer]
    code: 200
    input: [price_cents]
    output: Bid
    side_effects: ["price_cents replaced; improvement_count += 1"]
  - method: POST
    path: "/disposition/bids/{id}/shortlist"
    description: "Shortlist a submitted bid (asset must be OFFERS_CLOSED)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["status -> SHORTLISTED"]
  - method: POST
    path: "/disposition/bids/{id}/select"
    description: "Select winning bid; cascades all other SUBMITTED|SHORTLISTED bids of the asset to REJECTED"
    roles: [DispositionManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["status -> SELECTED", "sibling bids -> REJECTED"]
  - method: POST
    path: "/disposition/bids/{id}/withdraw"
    description: "Bidder withdraws own bid"
    roles: [Buyer]
    code: 200
    input: []
    output: Bid
    side_effects: ["status -> WITHDRAWN"]

  # --- PurchaseAgreement ---
  - method: POST
    path: "/disposition/psas"
    description: "Create PSA (DRAFT) from a SELECTED bid; supersedes existing DRAFT PSA of the asset. OCC-guarded."
    roles: [DispositionManager]
    code: 201
    input: [asset_id, bid_id, proration_convention, expected_asset_version]
    output: PurchaseAgreement
    side_effects: ["existing DRAFT psa of asset -> SUPERSEDED", "asset deal_status -> PSA_DRAFT", "increments Asset.version by 1", "price_cents/original_price_cents = bid.price_cents; buyer_bidder_id copied"]
  - method: GET
    path: "/disposition/psas/{id}"
    description: "Get one PurchaseAgreement"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: []
  - method: GET
    path: "/disposition/bids/{id}/psas"
    description: "List (sorted by created_at ascending) PurchaseAgreements created from a bid (FK reverse reachability for PurchaseAgreement.bid_id)"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "PurchaseAgreement[]"
    side_effects: []
  - method: POST
    path: "/disposition/psas/{id}/execute"
    description: "Execute PSA; computes deposit schedule, dd_deadline; auto-creates INITIAL + ADDITIONAL deposits; provisional commission"
    roles: [DispositionManager]
    code: 200
    input: [closing_date]
    output: PurchaseAgreement
    side_effects: ["status -> EXECUTED", "creates 2 DUE deposits", "asset deal_status -> PSA_EXECUTED", "engagement.commission_provisional_cents computed"]
  - method: POST
    path: "/disposition/psas/{id}/open_dd"
    description: "Open due diligence (requires INITIAL deposit POSTED)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status -> DD_ACTIVE", "asset deal_status -> DD_ACTIVE"]
  - method: POST
    path: "/disposition/psas/{id}/lapse_dd"
    description: "Lapse the due-diligence termination right (DD_ACTIVE -> BINDING) once clock > dd_deadline"
    roles: [DispositionManager]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status -> BINDING", "asset deal_status -> BINDING", "OPEN|CONTESTED dd-items -> WITHDRAWN"]
  - method: POST
    path: "/disposition/psas/{id}/begin_closing"
    description: "Move BINDING -> CLOSING (requires CONFIRMED payoff when leveraged, APPROVED statement, all deposits POSTED)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status -> CLOSING", "asset deal_status -> CLOSING"]
  - method: POST
    path: "/disposition/psas/{id}/terminate"
    description: "Terminate PSA; deposit disposition depends on reason (BUYER_DD/SELLER_DEFAULT/MUTUAL refund, BUYER_DEFAULT forfeit)"
    roles: [DispositionManager, Buyer]
    code: 200
    input: [reason]
    output: PurchaseAgreement
    side_effects: ["status -> TERMINATED", "deposits -> REFUNDED | FORFEITED", "asset deal_status -> IDLE", "BUYER_DEFAULT: asset.forfeited_deposits_cents += forfeited sum"]
  - method: POST
    path: "/disposition/psas/{id}/record_closing"
    description: "Close the sale; finalizes statement, applies deposits, settles into escrow, completes engagement, marks asset SOLD"
    roles: [DispositionManager, ClosingOfficer]
    code: 200
    input: []
    output: PurchaseAgreement
    side_effects: ["status -> CLOSED", "POSTED deposits -> APPLIED", "APPROVED statement -> FINALIZED", "creates EscrowHoldback HELD", "engagement -> COMPLETED with commission_final_cents", "asset deal_status -> SOLD; final_sale_price_cents set"]
  - method: GET
    path: "/disposition/psas/{id}/deposits"
    description: "List (sorted by created_at ascending) Deposits of a PSA (creation order: INITIAL then ADDITIONAL)"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "Deposit[]"
    side_effects: []
  - method: GET
    path: "/disposition/psas/{id}/dd-items"
    description: "List (sorted by created_at ascending) DueDiligenceItems of a PSA"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "DueDiligenceItem[]"
    side_effects: []
  - method: GET
    path: "/disposition/psas/{id}/statements"
    description: "List (sorted by created_at ascending) ClosingStatements of a PSA"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "ClosingStatement[]"
    side_effects: []
  - method: GET
    path: "/disposition/psas/{id}/escrows"
    description: "List (sorted by created_at ascending) EscrowHoldbacks of a PSA (0 or 1)"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: "EscrowHoldback[]"
    side_effects: []

  # --- Deposit ---
  - method: POST
    path: "/disposition/deposits/{id}/post"
    description: "Record deposit funds received (on or before due_date)"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status -> POSTED; posted_at = clock"]

  # --- DueDiligenceItem ---
  - method: POST
    path: "/disposition/dd-items"
    description: "Buyer files a DD finding / retrade demand (PSA must be DD_ACTIVE; clock <= dd_deadline)"
    roles: [Buyer]
    code: 201
    input: [psa_id, category, description, requested_reduction_cents]
    output: DueDiligenceItem
    side_effects: ["status OPEN; filed_at = clock"]
  - method: POST
    path: "/disposition/dd-items/{id}/respond"
    description: "Seller response: ACCEPT (applies capped reduction cascade), REJECT, or CONTEST"
    roles: [DispositionManager]
    code: 200
    input: [decision]
    output: DueDiligenceItem
    side_effects: ["ACCEPT: price reduction cascade (PSA price, commission recompute, statements STALE, closing-gate reopen)", "REJECT/CONTEST: item -> REJECTED | CONTESTED"]
  - method: POST
    path: "/disposition/dd-items/{id}/supplement"
    description: "Buyer supplements a CONTESTED item, re-opening it (within retrade window)"
    roles: [Buyer]
    code: 200
    input: ["requested_reduction_cents?"]
    output: DueDiligenceItem
    side_effects: ["status CONTESTED -> OPEN"]
  - method: POST
    path: "/disposition/dd-items/{id}/rescind"
    description: "Rescind an ACCEPTED reduction (compensating action; exact price restore)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: DueDiligenceItem
    side_effects: ["status -> RESCINDED", "PSA price/total restored exactly", "commission recomputed", "statements STALE"]

  # --- LoanPayoff ---
  - method: POST
    path: "/disposition/payoffs"
    description: "Request payoff or defeasance quote (lockout and defeasance-eligibility enforced)"
    roles: [DispositionManager]
    code: 201
    input: [asset_id, method, reinvestment_rate_bps, accrued_days, anticipated_settlement_date]
    output: LoanPayoff
    side_effects: ["status QUOTED; quoted_at = clock; quote_expires_at = clock + 10 days; computed cost fields"]
  - method: POST
    path: "/disposition/payoffs/{id}/confirm"
    description: "LoanServicer confirms a live quote (flips dependent statements STALE)"
    roles: [LoanServicer]
    code: 200
    input: []
    output: LoanPayoff
    side_effects: ["status -> CONFIRMED", "PENDING_REVIEW|APPROVED statements of the asset's PSAs -> STALE"]
  - method: POST
    path: "/disposition/payoffs/{id}/requote"
    description: "Refresh a STALE quote with optional new inputs"
    roles: [DispositionManager]
    code: 200
    input: ["reinvestment_rate_bps?", "accrued_days?", "anticipated_settlement_date?"]
    output: LoanPayoff
    side_effects: ["status -> QUOTED; recomputed fields; new expiry"]
  - method: POST
    path: "/disposition/payoffs/{id}/settle"
    description: "Settle the CONFIRMED payoff at closing (final variant recompute)"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: LoanPayoff
    side_effects: ["status -> SETTLED; final_total_cents computed"]

  # --- ClosingStatement ---
  - method: POST
    path: "/disposition/statements"
    description: "Create DRAFT closing statement for a PSA (PSA must be EXECUTED | DD_ACTIVE | BINDING | CLOSING); computes prorations and totals"
    roles: [ClosingOfficer]
    code: 201
    input: [psa_id, property_tax_annual_cents, tax_period_start, rent_monthly_cents, cam_annual_cents]
    output: ClosingStatement
    side_effects: ["status DRAFT; all computed fields per proration_set + closing_settlement_totals"]
  - method: POST
    path: "/disposition/statements/{id}/submit"
    description: "Submit for approval (recomputes all derived fields first; records preparer)"
    roles: [ClosingOfficer]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["status -> PENDING_REVIEW; recompute; prepared_by_user_id set"]
  - method: POST
    path: "/disposition/statements/{id}/approve"
    description: "Approve statement (approver != preparer)"
    roles: [DispositionManager]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["status -> APPROVED; approved_by_user_id set"]
  - method: POST
    path: "/disposition/statements/{id}/dispute"
    description: "Buyer disputes a PENDING_REVIEW statement"
    roles: [Buyer]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["status -> DISPUTED"]

  # --- EscrowHoldback ---
  - method: GET
    path: "/disposition/escrows/{id}"
    description: "Get one EscrowHoldback"
    roles: [DispositionManager, AssetAnalyst, InvestmentCommittee, Broker, ClosingOfficer, LoanServicer, Buyer]
    code: 200
    input: []
    output: EscrowHoldback
    side_effects: []
  - method: POST
    path: "/disposition/escrows/{id}/release"
    description: "Release holdback to seller (partial or full; blocked while FILED claims exist; full auto-release at release_date)"
    roles: [DispositionManager]
    code: 200
    input: ["amount_cents?"]
    output: EscrowHoldback
    side_effects: ["released_to_seller_cents += amount; available recomputed; status PARTIALLY_RELEASED | RELEASED"]
  - method: POST
    path: "/disposition/escrows/{id}/file_claim"
    description: "Buyer files an indemnity claim (amount <= available; within indemnity window)"
    roles: [Buyer]
    code: 201
    input: [amount_cents, reason]
    output: EscrowHoldback
    side_effects: ["appends FILED claim"]
  - method: POST
    path: "/disposition/escrows/{id}/decide_claim"
    description: "Decide a FILED claim: DENY (no money) or PAY paid_amount_cents (decider != filer)"
    roles: [DispositionManager]
    code: 200
    input: [claim_id, decision, "paid_amount_cents?"]
    output: EscrowHoldback
    side_effects: ["PAY: paid_to_claims_cents += paid; available recomputed; claim -> PAID; available == 0 -> RELEASED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on endpoint, or entity-backed ownership mismatch (Buyer acting on another bidder's resource)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempts both sides of a segregated step (analysis create vs decide; document upload vs verify; statement prepare vs approve; claim file vs decide)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, range violation, window_end <= window_start, non-positive amount" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Entity not in a valid from-state for the invoked transition (incl. terminal lockdown and Buyer terminating with BUYER_DD after DD lapse)" }
  - { id: ERR_OFFERS_NOT_OPEN, http: 409, condition: "Bid create/improve while asset.marketing_status != OFFERS_OPEN" }
  - { id: ERR_OFFERS_DEADLINE_PASSED, http: 409, condition: "Bid create/improve while marketing OFFERS_OPEN but clock > offers_deadline" }
  - { id: ERR_RETRADE_WINDOW_CLOSED, http: 409, condition: "DD item create/supplement after psa.dd_deadline" }
  - { id: ERR_ENGAGEMENT_WINDOW_OVERLAP, http: 409, condition: "Engagement window closed-interval overlaps another PROPOSED|ACTIVE engagement of the same asset (adjacency IS overlap)" }
  - { id: ERR_ACCESS_WINDOW_OVERLAP, http: 409, condition: "Data-room access window half-open overlaps an ACTIVE window of the same bidder (adjacency allowed)" }
  - { id: ERR_RELIST_COOLING_PERIOD, http: 409, condition: "Relist attempted before last_campaign_closed_at + 7 days" }
  - { id: ERR_LOAN_LOCKED_OUT, http: 409, condition: "anticipated_settlement_date <= asset.prepayment_lockout_until" }
  - { id: ERR_BIDDER_NOT_QUALIFIED, http: 409, condition: "Bid create or grant_access with bidder not in QUALIFIED status" }
  - { id: ERR_PACKAGE_NOT_PUBLISHED, http: 409, condition: "open_offers or grant_access while the asset's package is not PUBLISHED" }
  - { id: ERR_BID_NOT_SELECTED, http: 409, condition: "PSA create references a bid not in SELECTED status (or of another asset)" }
  - { id: ERR_ANALYSIS_NOT_APPROVED, http: 409, condition: "Asset list attempted without an APPROVED latest analysis" }
  - { id: ERR_HOLD_RECOMMENDED, http: 409, condition: "Asset list attempted while latest APPROVED analysis recommends HOLD" }
  - { id: ERR_NO_ACTIVE_ENGAGEMENT, http: 409, condition: "Asset list or package publish without an ACTIVE BrokerEngagement" }
  - { id: ERR_PAYOFF_NOT_CONFIRMED, http: 409, condition: "begin_closing without CONFIRMED payoff, or record_closing without SETTLED payoff, on a leveraged asset" }
  - { id: ERR_STATEMENT_NOT_APPROVED, http: 409, condition: "begin_closing / record_closing without an APPROVED closing statement" }
  - { id: ERR_DEPOSIT_NOT_POSTED, http: 409, condition: "open_dd without INITIAL deposit POSTED; begin_closing without all deposits POSTED" }
  - { id: ERR_DEFEASANCE_NOT_ALLOWED, http: 409, condition: "method DEFEASANCE on an asset with defeasance_allowed == false" }
  - { id: ERR_DATA_ROOM_LOCKED, http: 409, condition: "Document upload/supersede while asset.marketing_status == OFFERS_OPEN" }
  - { id: ERR_PACKAGE_INCOMPLETE, http: 422, condition: "Publish with completeness_pct < 100 (fewer than 8 verified categories)" }
  - { id: ERR_RETRADE_CAP_EXCEEDED, http: 422, condition: "Accept would push accepted_retrade_total_cents above 5% of original_price_cents" }
  - { id: ERR_DEPOSIT_BELOW_MINIMUM, http: 422, condition: "Bid deposit_cents below max(3% of price, MIN_DEPOSIT_CENTS)" }
  - { id: ERR_INSUFFICIENT_PROOF_OF_FUNDS, http: 422, condition: "Qualification below 25% of guidance price (bidder transitions to DISQUALIFIED)" }
  - { id: ERR_CLAIM_EXCEEDS_AVAILABLE, http: 422, condition: "Claim file/decide amount exceeds escrow available_cents" }
  - { id: ERR_BID_IMPROVEMENT_TOO_LOW, http: 422, condition: "Improve price not strictly greater than current price" }
  - { id: ERR_RELEASE_BLOCKED_BY_CLAIMS, http: 409, condition: "Manual escrow release while a claim is FILED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_asset_version does not match current Asset.version on superseding create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DispositionManager
    description: "Institutional owner's disposition lead; drives marketing, selection, PSA lifecycle, retrade responses, escrow decisions"
    identity: opaque
    exclusive_operations: [assets.list, assets.open_offers, assets.close_offers, assets.withdraw, engagements.create, engagements.activate, engagements.terminate, packages.publish, bidders.qualify, bids.shortlist, bids.select, psas.create, psas.execute, psas.open_dd, psas.begin_closing, psas.record_closing, payoffs.create, payoffs.requote, statements.approve, escrows.release, escrows.decide_claim, dd_items.respond, dd_items.rescind, clock.set_current_utc]
    shared_operations: [packages.upload_document, packages.verify_document, bidders.create, bidders.reapply, bidders.grant_access, psas.terminate, read_endpoints]
  - name: AssetAnalyst
    description: "Underwriting analyst; builds hold/sell analyses and assembles the data room"
    identity: opaque
    exclusive_operations: [analyses.create, analyses.submit, analyses.revise, packages.create]
    shared_operations: [packages.upload_document, packages.verify_document, assets.create, read_endpoints]
  - name: InvestmentCommittee
    description: "Approval authority for hold/sell recommendations; segregated from analysis authors"
    identity: opaque
    exclusive_operations: [analyses.decide]
    shared_operations: [read_endpoints]
  - name: Broker
    description: "External listing broker operating under an engagement; administers bidders and data room"
    identity: opaque
    exclusive_operations: []
    shared_operations: [packages.create, packages.upload_document, bidders.create, bidders.reapply, bidders.grant_access, read_endpoints]
  - name: Buyer
    description: "Prospective purchaser; acts strictly as its own Bidder entity (X-User-ID == Bidder.id)"
    identity: "entity_backed:Bidder"
    exclusive_operations: [bids.create, bids.improve, bids.withdraw, dd_items.create, dd_items.supplement, statements.dispute, escrows.file_claim]
    shared_operations: [psas.terminate, read_endpoints]
  - name: ClosingOfficer
    description: "Settlement agent; records deposits, prepares closing statements, settles payoffs"
    identity: opaque
    exclusive_operations: [deposits.post, statements.create, statements.submit, payoffs.settle]
    shared_operations: [psas.record_closing, read_endpoints]
  - name: LoanServicer
    description: "Existing lender's servicer; confirms payoff/defeasance quotes"
    identity: opaque
    exclusive_operations: [payoffs.confirm]
    shared_operations: [read_endpoints]
