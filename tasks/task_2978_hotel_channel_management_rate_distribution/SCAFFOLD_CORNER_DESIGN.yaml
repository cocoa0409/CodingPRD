              captures: { inv_id: $.data.id }
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_id: $.data.id }
            - call: "POST /distribution/reservations/${res_id}/cancel"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /distribution/reservations/${res_id}/cancel"
              payload: {}
              as: RevenueManager
          assert:
            - "HTTP 409 with data.error_id == ERR_RESERVATION_NOT_CANCELLABLE"
            - "Reservation.${res_id}.reservation_state == CANCELLED with cancelled_at still 2026-08-25T00:00:00.000Z (unchanged by the second attempt)"
            - "InventoryDay.${inv_id} == { allocated_units: 0, committed_units: 0, shared_pool_units: 11, pooled_state: OPEN } - no double credit"
            - "Channel.${brand_id} == { gross_revenue_cents: 0, net_revenue_cents: 0, room_nights_sold: 0, bookings_count: 1, cancellations_count: 1 } - the monotonic counters record one booking and one cancellation, not two cancellations"

      - name: inventory_day_moves_open_to_tight_when_capacity_is_reached_but_pool_remains
        claim_type: valid_transition
        grounds:
          - state_machines.InventoryDay.transitions[OPEN->TIGHT]
          - calculations.inventory_pool_state
          - entities.InventoryDay.fields.pooled_state
        distinguishing_aspect: |
          TIGHT is the band between capacity and ceiling: a 10-unit allotment on a capacity-10 room
          type with ceiling 11 gives allocated 10 + committed 0 >= 10 while shared_pool_units is still
          1, so the day is TIGHT rather than EXHAUSTED - the two thresholds are distinct.
        test_recipe:
          setup:
            - "Property HTL-SFO (overbooking_pct_bp 1000) with room type KING capacity 10 -> overbooking_ceiling_units 11, inventory day 2026-09-10 open at allocated 0 / committed 0 / shared 11 and pooled_state OPEN."
            - "Channel OTA1 with a HEALTHY connection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "GET /distribution/room-types/${king_id}"
              payload: {}
              as: RevenueManager
              captures: { king_v1: $.data.version }
          trigger:
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 10, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v1}" }
              as: RevenueManager
              captures: { alloc_id: $.data.id }
            - call: "POST /distribution/allocations/${alloc_id}/release"
              payload: {}
              as: RevenueManager
          assert:
            - "The allotment is accepted with HTTP 201 (10 + 0 + 0 == 10 <= 11)"
            - "InventoryDay.${inv_id} == { allocated_units: 10, committed_units: 0, shared_pool_units: 1, overbooking_ceiling_units: 11, pooled_state: TIGHT } - TIGHT, not EXHAUSTED, because one shared unit survives"
            - "The invariant still holds: 11 == 10 + 0 + 1"
            - "After the release: InventoryDay.${inv_id}.pooled_state == OPEN again with allocated_units 0 and shared_pool_units 11 (the TIGHT -> OPEN edge)"

      - name: batch_state_is_derived_from_its_child_jobs
        claim_type: compound
        grounds:
          - calculations.batch_state_rollup
          - state_machines.DistributionBatch
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_forks_two_jobs_settles_partially_applied_then_joins_to_applied
          rationale: "That §1.8 instance drives a two-job batch through PARTIALLY_APPLIED and back to APPLIED, asserting total_jobs, applied_jobs, rejected_jobs and the re-derived batch_state at every hop."

      - name: cancellation_reverses_every_side_effect_of_the_booking
        claim_type: compensation
        grounds:
          - state_machines.Reservation.transitions[CONFIRMED->CANCELLED]
          - calculations.inventory_pool_state
        excluded_because:
          difficulty_instance: compensating_invariant / unit_conservation_survives_allotment_draw_pool_draw_cancellation_and_release
          rationale: "That §1.8 instance asserts the allotment edge, the pool edge and the release edge all unwind to the exact start state with no drift."

  - section: calculations
    instances:
      - name: rate_plan_derivation_depth_two_is_accepted_and_a_third_level_is_refused
        claim_type: constants_applied
        grounds:
          - calculations.resolved_base_amount.constants.MAX_DERIVATION_DEPTH
          - errors[ERR_DERIVATION_DEPTH_EXCEEDED]
          - validations[priority=17]
        distinguishing_aspect: |
          MAX_DERIVATION_DEPTH == 2 is a >= boundary on the ancestor CHAIN, not on the child count:
          depth 0, 1 and 2 all create cleanly and each stores a different resolved amount, while the
          first plan that would sit at depth 3 is refused with 409 ERR_DERIVATION_DEPTH_EXCEEDED.
        test_recipe:
          setup:
            - "Property HTL-SFO in USD."
            - "Root plan BAR (PUBLIC, base 25000, floor 18000, ceiling 40000) at derivation_depth 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
          trigger:
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "CORP", rate_class: "NEGOTIATED", parent_rate_plan_id: "${bar_id}", offset_kind: "PERCENT", offset_bp: -1500, floor_amount_cents: 15000, ceiling_amount_cents: 40000, negotiated_account_code: "ACME" }
              as: RevenueManager
              captures: { corp_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "CORPPKG", rate_class: "PACKAGE", parent_rate_plan_id: "${corp_id}", offset_kind: "AMOUNT", offset_amount_cents: 8000, floor_amount_cents: 20000, ceiling_amount_cents: 60000, package_inclusion_cents: 2500 }
              as: RevenueManager
              captures: { corppkg_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "TOODEEP", rate_class: "PACKAGE", parent_rate_plan_id: "${corppkg_id}", offset_kind: "AMOUNT", offset_amount_cents: 1000, floor_amount_cents: 20000, ceiling_amount_cents: 60000 }
              as: RevenueManager
          assert:
            - "BAR: derivation_depth == 0 and resolved_base_amount_cents == 25000 (its own base_amount_cents)"
            - "CORP: HTTP 201 with derivation_depth == 1 and resolved_base_amount_cents == round_half_up(25000 * 8500 / 10000) == 21250"
            - "CORPPKG: HTTP 201 with derivation_depth == 2 and resolved_base_amount_cents == 21250 + 8000 == 29250 - the AMOUNT branch reads the PARENT's resolved amount, not the root's"
            - "TOODEEP: HTTP 409 with data.error_id == ERR_DERIVATION_DEPTH_EXCEEDED and no plan is stored"
            - "GET /distribution/rate-plans?property_id=${prop_id} returns total_count == 3 - the refused plan left no row behind"

      - name: quoted_rate_clamps_up_to_the_plan_floor_only_when_the_stack_digs_below_it
        claim_type: correct_result
        grounds:
          - calculations.sell_rate_resolution
          - endpoints[GET /distribution/channel-mappings/{id}/quoted-rate]
        distinguishing_aspect: |
          The S5 clamp is a two-sided min/max applied AFTER the channel adjustment: with both
          promotions live the running rate falls to 21500 and is lifted to the 22000 floor, while the
          very same plan and channel one day later - when the GEO window has closed - lands at 22500
          and is returned untouched. The response exposes channel_adjusted_cents 21500 next to
          clamped_cents 22000, so the clamp is observable rather than inferred.
        test_recipe:
          setup:
            - "Property HTL-SFO (required_image_count 5), room type KING (capacity 10, master hash 'kingv1', 5 images)."
            - "Channel BRAND: DIRECT_BRAND, commission_bp 0, sell_adjustment_bp 0, allows_member_rate true, geo_market_codes ['US-CA'], with a HEALTHY connection."
            - "Plan FLOORED (PUBLIC, base 25000, floor 22000, ceiling 40000) ACTIVE, mapped to BRAND x KING."
            - "Two APPROVED promotions on FLOORED: MEMBER10 (MEMBER_RATE, PERCENT 1000, 2026-09-01..2026-09-30) and GEO10USD (GEO_OFFER, AMOUNT 1000, 2026-09-10..2026-09-11, geo ['US-CA']). Submit runs as rm-1 and approve as rd-1 so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "BRAND", channel_kind: "DIRECT_BRAND", commission_bp: 0, sell_adjustment_bp: 0, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /distribution/channels/${brand_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://brand.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "FLOORED", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 22000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { plan_id: $.data.id }
            - call: "POST /distribution/rate-plans/${plan_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${plan_id}", channel_id: "${brand_id}", room_type_id: "${king_id}", external_rate_code: "FLOORED-BRAND-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/rate-plans/${plan_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { member_promo_id: $.data.id }
            - call: "POST /distribution/promotions/${member_promo_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${member_promo_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/rate-plans/${plan_id}/promotions"
              payload: { code: "GEO10USD", promo_kind: "GEO_OFFER", discount_kind: "AMOUNT", discount_amount_cents: 1000, start_date: "2026-09-10", end_date: "2026-09-11", geo_market_codes: ["US-CA"] }
              as: RevenueManager
              captures: { geo_promo_id: $.data.id }
            - call: "POST /distribution/promotions/${geo_promo_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${geo_promo_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
          trigger:
            - call: "GET /distribution/channel-mappings/${map_id}/quoted-rate"
              payload: { stay_date: "2026-09-10", member_flag: true, geo_market_code: "US-CA" }
              as: RevenueManager
            - call: "GET /distribution/channel-mappings/${map_id}/quoted-rate"
              payload: { stay_date: "2026-09-12", member_flag: true, geo_market_code: "US-CA" }
              as: RevenueManager
          assert:
            - "2026-09-10 (both promotions live): { base_amount_cents: 25000, promotion_discount_cents: 3500, discount_cap_cents: 7500, channel_adjusted_cents: 21500, clamped_cents: 22000, sell_amount_cents: 22000 } with applied_promotion_codes == [MEMBER10, GEO10USD]"
            - "The stack is under the cap (3500 <= floor(25000 * 3000 / 10000) == 7500), so the 21500 -> 22000 move is the FLOOR clamp and not the cap"
            - "2026-09-12 (GEO window closed on 09-11): { base_amount_cents: 25000, promotion_discount_cents: 2500, discount_cap_cents: 7500, channel_adjusted_cents: 22500, clamped_cents: 22500, sell_amount_cents: 22500 } with applied_promotion_codes == [MEMBER10]"
            - "22500 sits inside [22000, 40000] so clamped_cents == channel_adjusted_cents - the clamp is inert, proving it is a bound and not a floor-add"

      - name: overlapping_min_stay_windows_take_the_strictest_value_not_their_sum
        claim_type: interval_merge
        grounds:
          - calculations.restriction_effect_resolution
          - errors[ERR_MIN_STAY_NOT_MET]
          - validations[priority=19]
        distinguishing_aspect: |
          Two MIN_STAY windows overlap on 2026-09-11 because they differ in scope (one plan-agnostic,
          one scoped to BAR), and MIN_STAY reads only the ARRIVAL date. An arrival inside the overlap
          takes max(2, 3) == 3 and refuses a 2-night stay, while an arrival one day earlier sees only
          the 2-night window and the identical 2-night request succeeds - summing to 5 or taking the
          min of 2 would both misjudge one of the two calls.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING capacity 10, inventory days 2026-09-10, 2026-09-11 and 2026-09-12."
            - "Channel BRAND (commission_bp 0) with a HEALTHY connection, plan BAR (base 25000) ACTIVE."
            - "MIN_STAY 2 over 2026-09-10..2026-09-11 with rate_plan_id omitted (applies to every plan) and MIN_STAY 3 over 2026-09-11..2026-09-12 scoped to BAR - the differing scope keys are why both may be ACTIVE at once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "BRAND", channel_kind: "DIRECT_BRAND", commission_bp: 0 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /distribution/channels/${brand_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://brand.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-11" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-12" }
              as: RevenueManager
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", value_nights: 2, start_date: "2026-09-10", end_date: "2026-09-11" }
              as: RevenueManager
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", rate_plan_id: "${bar_id}", restriction_type: "MIN_STAY", value_nights: 3, start_date: "2026-09-11", end_date: "2026-09-12" }
              as: RevenueManager
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-11", nights: 2 }
              as: RevenueManager
