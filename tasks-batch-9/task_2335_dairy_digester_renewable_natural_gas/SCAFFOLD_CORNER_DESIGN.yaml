# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Coverage Index)
# task_2335_dairy_digester_renewable_natural_gas
#
# Breadth walk of references/claim-extraction-guide.md's nine sections against
# SCAFFOLD.yaml §1.1-§1.7. Depth corners already owned by SCAFFOLD_DIFFICULTY_
# DESIGN.yaml appear as `excluded_because:` stubs citing that instance by name.
#
# Fixture conventions shared by every instance below:
#   * logical clock starts at 2026-08-01T00:00:00Z
#   * user ids: u-admin (PlatformAdmin), u-ops (ProjectOperator),
#     u-sched (PipelineScheduler), u-verifier (CreditVerifier),
#     u-program (ProgramAdministrator), u-fin-a / u-fin-b (FinanceController,
#     segregation of duties), DairyPartner acts as ${dairyN_id}
#   * canonical plant: "Tulare Digester 1", 6000.000 m3, MESOPHILIC, target
#     38.0 C, hydraulic 500.000 t/day, reserve target 4000000 cents, annual debt
#     service 18000000 cents, dscr_minimum 1.250 -> design_max_olr 3.500
#   * canonical day 2026-08-03 with one 150.000 t LAGOON delivery at 8.0 % TS /
#     82.0 % VS -> net 150.000, vs 9.840, haul_tonne_km 1800.00, OLR 1.640
#   * canonical close (38.4 C / 15 min / 2400.0 / 8000.0 / 196000.000 scf /
#     62.0 % CH4) -> ratio 0.300, stress_points 1, STABLE, raw_hhv 626.20,
#     raw_gas_mmbtu 122.735
#   * canonical conditioning (96.5 / 1.5 / 3.5 / 5.0) -> pipeline_gas_scf
#     123408.912, pipeline_hhv 974.65, pipeline_gas_mmbtu 120.280
#
# Every numeric literal in `assert:` was produced by executing the named §1.3
# formula with its declared constants (Decimal, ROUND_HALF_UP / ROUND_FLOOR as
# the `precision:` field states).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: entity_dairy_creation_returns_201_with_prospect_status_and_zero_counters
        claim_type: creation
        grounds:
          - endpoints[POST /dairies]
          - entities.Dairy.fields.status
          - entities.Dairy.fields.active_agreement_count
          - entities.Dairy.fields.contracted_agreement_count
          - entities.Dairy.fields.pan_applied_ytd_kg
          - response_envelope
        distinguishing_aspect: >
          A Dairy created with all six required inputs is returned at HTTP 201 with
          status PROSPECT, all three derived counters at zero and version 1 - no
          agreement or nutrient history is assumed at birth.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
          trigger:
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "response_type == object"
            - "Dairy.${dairy1_id}.status == PROSPECT"
            - "Dairy.${dairy1_id}.active_agreement_count == 0"
            - "Dairy.${dairy1_id}.contracted_agreement_count == 0"
            - "Dairy.${dairy1_id}.pan_applied_ytd_kg == 0.000"
            - "Dairy.${dairy1_id}.haul_distance_km == 12.0"
            - "Dairy.${dairy1_id}.version == 1"

      - name: entity_facility_design_max_olr_is_computed_from_thermal_regime
        claim_type: computed_fields
        grounds:
          - calculations.design_olr_limit
          - entities.DigesterFacility.fields.design_max_olr
          - entities.DigesterFacility.fields.thermal_regime
          - endpoints[POST /facilities]
        distinguishing_aspect: >
          design_max_olr is never an input: the MESOPHILIC plant is stamped 3.500 and
          the THERMOPHILIC plant 4.500 from calculations.design_olr_limit constants,
          even though both facilities were created with identical volumes.
        test_recipe:
          setup:
            - "One mesophilic 6000 m3 facility already registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { meso_id: "$.data.id" }
          trigger:
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 2", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "THERMOPHILIC", target_temperature_c: 54.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { thermo_id: "$.data.id" }
            - call: "GET /facilities/${meso_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
          assert:
            - "HTTP status == 201"
            - "DigesterFacility.${thermo_id}.thermal_regime == THERMOPHILIC"
            - "DigesterFacility.${thermo_id}.design_max_olr == 4.500"
            - "DigesterFacility.${meso_id}.design_max_olr == 3.500"

      - name: entity_facility_creation_defaults_every_ledger_and_posture_field
        claim_type: defaults
        grounds:
          - entities.DigesterFacility.fields.ops_posture
          - entities.DigesterFacility.fields.distribution_posture
          - entities.DigesterFacility.fields.posture_override_active
          - entities.DigesterFacility.fields.reserve_balance_cents
          - entities.DigesterFacility.fields.mass_control_residual_tonnes
          - entities.DigesterFacility.fields.dscr_current
        distinguishing_aspect: >
          A brand-new DigesterFacility starts STABLE / OPEN with posture_override_active
          false, reserve_balance_cents 0, dscr_current 0 and mass_control_residual_tonnes
          exactly 0.000, so the mass-control invariant holds before any feedstock exists.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
          trigger:
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "DigesterFacility.${facility_id}.ops_posture == STABLE"
            - "DigesterFacility.${facility_id}.distribution_posture == OPEN"
            - "DigesterFacility.${facility_id}.posture_override_active == false"
            - "DigesterFacility.${facility_id}.reserve_balance_cents == 0"
            - "DigesterFacility.${facility_id}.dscr_current == 0"
            - "DigesterFacility.${facility_id}.total_manure_received_tonnes == 0.000"
            - "DigesterFacility.${facility_id}.mass_control_residual_tonnes == 0.000"

      - name: entity_dairy_detail_read_returns_the_stored_master_data
        claim_type: retrieval
        grounds:
          - endpoints[GET /dairies/{id}]
          - entities.Dairy.fields.manure_management_baseline
          - entities.Dairy.fields.annual_nitrogen_budget_kg
        distinguishing_aspect: >
          GET /dairies/{id} answers HTTP 200 with the exact stored baseline
          (SOLID_STORAGE), haul distance 30.0 and nitrogen budget 12000.000 written at
          creation - the read path never recomputes master data.
        test_recipe:
          setup:
            - "One Dairy created with SOLID_STORAGE baseline, haul_distance_km 30.0 and annual_nitrogen_budget_kg 12000.000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Kings River Dairy", county: "Kings", herd_size: 2200, manure_management_baseline: "SOLID_STORAGE", haul_distance_km: 30.0, annual_nitrogen_budget_kg: 12000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy2_id: "$.data.id" }
          trigger:
            - call: "GET /dairies/${dairy2_id}"
              payload: {}
              as: ProjectOperator
              as_user_id: "u-ops"
          assert:
            - "HTTP status == 200"
            - "response_type == object"
            - "Dairy.${dairy2_id}.name == Kings River Dairy"
            - "Dairy.${dairy2_id}.county == Kings"
            - "Dairy.${dairy2_id}.herd_size == 2200"
            - "Dairy.${dairy2_id}.manure_management_baseline == SOLID_STORAGE"
            - "Dairy.${dairy2_id}.haul_distance_km == 30.0"
            - "Dairy.${dairy2_id}.annual_nitrogen_budget_kg == 12000.000"

      - name: entity_dairy_list_applies_county_filter_with_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /dairies]
          - response_envelope
          - entities.Dairy.fields.county
        distinguishing_aspect: >
          With three dairies on file (two in Tulare, one in Kings), GET
          /dairies?county=Tulare&status=PROSPECT returns exactly 2 rows with
          total_count 2 and has_more false - the Kings row is filtered out, not paged out.
        test_recipe:
          setup:
            - "Three PROSPECT dairies: two in county Tulare, one in county Kings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /dairies"
              payload: { name: "Sierra Bend Dairy", county: "Tulare", herd_size: 1800, manure_management_baseline: "DAILY_SPREAD", haul_distance_km: 8.0, annual_nitrogen_budget_kg: 9000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy3_id: "$.data.id" }
            - call: "POST /dairies"
              payload: { name: "Kings River Dairy", county: "Kings", herd_size: 2200, manure_management_baseline: "SOLID_STORAGE", haul_distance_km: 30.0, annual_nitrogen_budget_kg: 12000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy2_id: "$.data.id" }
          trigger:
            - call: "GET /dairies?status=PROSPECT&county=Tulare&limit=10&offset=0"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "u-program"
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "total_count == 2"
            - "has_more == false"
            - "limit == 10"
            - "offset == 0"
            - "the returned id set == {${dairy1_id}, ${dairy3_id}}"
            - "${dairy2_id} is absent from the returned id set"

      - name: entity_agreement_creation_stamps_system_fields_and_initial_version
        claim_type: system_fields
        grounds:
          - endpoints[POST /feedstock-agreements]
          - entities.FeedstockAgreement.fields.status
          - entities.FeedstockAgreement.fields.negotiation_round
          - entities.FeedstockAgreement.fields.signed_at
        distinguishing_aspect: >
          POST /feedstock-agreements stamps a server id, created_at and updated_at equal
          to the logical clock 2026-08-01T00:00:00Z and version 1, while signed_at stays
          null and negotiation_round 0 until the DairyPartner acts.
        test_recipe:
          setup:
            - "One Dairy and one facility registered; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
          trigger:
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 6.50, term_start_date: "2026-07-01", term_end_date: "2027-06-30", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "FeedstockAgreement.${agr1_id}.id is a non-empty server-minted string"
            - "FeedstockAgreement.${agr1_id}.created_at == 2026-08-01T00:00:00Z"
            - "FeedstockAgreement.${agr1_id}.updated_at == 2026-08-01T00:00:00Z"
            - "FeedstockAgreement.${agr1_id}.version == 1"
            - "FeedstockAgreement.${agr1_id}.status == DRAFT"
            - "FeedstockAgreement.${agr1_id}.negotiation_round == 0"
            - "FeedstockAgreement.${agr1_id}.signed_at == null"

      - name: entity_facility_creation_missing_dscr_minimum_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=60]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /facilities]
        distinguishing_aspect: >
          Omitting the required dscr_minimum on POST /facilities is rejected with
          ERR_INVALID_REQUEST at HTTP 400 and no DigesterFacility row is created.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
          trigger:
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /facilities?limit=10&offset=0"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
          assert:
            - "first call HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "second call total_count == 0"

      - name: entity_delivery_tare_not_below_gross_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.FeedstockDelivery.fields.tare_tonnes
          - validations[priority=60]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          tare_tonnes carries the declared range ">= 0 and < gross_tonnes", so a load
          booked with gross_tonnes 150.000 and tare_tonnes 150.000 is rejected with
          ERR_INVALID_REQUEST (400) before any mass or loading-rate arithmetic runs.
        test_recipe:
          setup:
            - "One ACTIVE agreement between Vista Verde Dairy and Tulare Digester 1 for the 2026-07-01..2027-06-30 term."
            - "One OPEN OperationsDay 2026-08-03 with no deliveries."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /feedstock-agreements"
              payload: { dairy_id: "${dairy1_id}", facility_id: "${facility_id}", committed_tonnes_per_day: 180.000, minimum_total_solids_pct: 6.50, term_start_date: "2026-07-01", term_end_date: "2027-06-30", revenue_share_pct: 0.2200, revenue_share_basis: "NET", curtailable: true }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { agr1_id: "$.data.id" }
            - call: "POST /feedstock-agreements/${agr1_id}/offer"
              payload: { cover_note: "August 2026 term sheet" }
              as: ProjectOperator
              as_user_id: "u-ops"
            - call: "POST /feedstock-agreements/${agr1_id}/sign"
              payload: { signatory_name: "R. Alvarez" }
              as: DairyPartner
              as_user_id: "${dairy1_id}"
            - call: "POST /ops-days"
              payload: { facility_id: "${facility_id}", ops_date: "2026-08-03" }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { day1_id: "$.data.id" }
          trigger:
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "${agr1_id}", ops_day_id: "${day1_id}", gross_tonnes: 150.000, tare_tonnes: 150.000, total_solids_pct: 8.0, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /ops-days/${day1_id}"
              payload: {}
              as: ProjectOperator
              as_user_id: "u-ops"
          assert:
            - "first call HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "OperationsDay.${day1_id}.organic_loading_rate == 0.000"

      - name: entity_delivery_creation_with_unknown_agreement_returns_agreement_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=40]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - entities.FeedstockDelivery.fields.agreement_id
          - entities.FeedstockDelivery.fields.ops_day_id
        distinguishing_aspect: >
          With BOTH body foreign keys unresolvable, the flat topology's priority-40 rule
          answers ERR_AGREEMENT_NOT_FOUND (404) - the first FK in the endpoint input
          order - never ERR_OPS_DAY_NOT_FOUND.
        test_recipe:
          setup:
            - "One facility registered; no FeedstockAgreement and no OperationsDay exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
          trigger:
            - call: "POST /feedstock-deliveries"
              payload: { agreement_id: "agr-does-not-exist", ops_day_id: "day-does-not-exist", gross_tonnes: 150.000, tare_tonnes: 0.000, total_solids_pct: 8.0, volatile_solids_pct_of_ts: 82.0 }
              as: ProjectOperator
              as_user_id: "u-ops"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_AGREEMENT_NOT_FOUND"
            - "error_id != ERR_OPS_DAY_NOT_FOUND"

      - name: entity_unknown_dairy_id_on_detail_read_returns_dairy_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_DAIRY_NOT_FOUND]
          - endpoints[GET /dairies/{id}]
        distinguishing_aspect: >
          A path id that matches no Dairy row answers ERR_DAIRY_NOT_FOUND at HTTP 404
          with the error envelope, not an empty 200 object.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
          trigger:
            - call: "GET /dairies/dairy-does-not-exist"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response_type == error"
            - "error_id == ERR_DAIRY_NOT_FOUND"

      - name: entity_agreement_revise_leaves_the_term_dates_untouched
        claim_type: immutability
        grounds:
          - state_machines.FeedstockAgreement.transitions.COUNTERED_to_DRAFT
          - endpoints[POST /feedstock-agreements/{id}/revise]
          - entities.FeedstockAgreement.fields.term_start_date
          - entities.FeedstockAgreement.fields.term_end_date
        distinguishing_aspect: >
          The revise endpoint overwrites exactly the three commercial terms; the
          contract term window 2026-07-01..2027-06-30 and negotiation_round 1 survive
          the COUNTERED -> DRAFT move because no §1.5 input can restate them.
        test_recipe:
          setup:
            - "One agreement offered to Vista Verde Dairy and countered once by that dairy (negotiation_round 1, status COUNTERED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
              payload: { name: "Vista Verde Dairy", county: "Tulare", herd_size: 3200, manure_management_baseline: "LAGOON", haul_distance_km: 12.0, annual_nitrogen_budget_kg: 24000.000 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { dairy1_id: "$.data.id" }
