              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 0.50, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error envelope error_id == ERR_DETECTION_LIMIT_BELOW_CAPABILITY"
            - "GET /lab-results?sample_id=${s_id} returns total_count == 0"

      - name: a_lab_result_sitting_on_both_detection_limit_bounds_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=72]
          - validations[priority=73]
          - endpoints[POST /lab-results]
          - entities.LabResult
        distinguishing_aspect: "detection_limit_ng_per_l equals BOTH bounds at once (required_mrl 2.00 and lowest_achievable_dl 2.00): priority 72 uses a strict `>` and priority 73 a strict `<`, so equality must pass on both and the row must be created in SUBMITTED."
        test_recipe:
          setup:
            - "PFOA requires an MRL of 2.00 and the laboratory's lowest achievable DL is exactly 2.00."
            - "A PFOA sample is collected, shipped and received; analysis is 120 h after collection, well inside the 336 h METHOD_533 holding time."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
