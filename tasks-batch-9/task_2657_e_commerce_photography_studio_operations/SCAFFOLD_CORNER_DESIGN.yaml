            - "RetouchTask.${task_id}.task_state == \"IN_PROGRESS\" after the first call"
            - "second call: status == 422 and error_id == \"ERR_TALENT_TYPE_MISMATCH\""
            - "third call: status == 200"
            - "RetouchTask.${task_id}.task_state == \"SUBMITTED\""
            - "RetouchTask.${task_id}.assigned_retoucher_id == ${rt1_id}"

      - name: request_missing_x_user_id_header_is_unauthenticated
        claim_type: authentication
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "Priority 1 outranks every other check: a create call with an empty X-User-ID (and, in the second variant, an unknown role string) is 401 ERR_UNAUTHENTICATED before any payload, FK or role reasoning happens, so the malformed body is never reported."
        test_recipe:
          setup:
            - "Only the clock is set; the vendor create payload below is deliberately incomplete so that a 400 would be visible if authentication did not run first."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/vendors"
              payload: { vendor_code: "NRTH" }
              as: StudioAdmin
              as_user_id: ""
            - call: "POST /studio/vendors"
              payload: { vendor_code: "NRTH" }
              as: StudioIntern
              as_user_id: "intern-01"
          assert:
            - "first call (X-User-ID sent empty, i.e. header effectively absent): status == 401 and error_id == \"ERR_UNAUTHENTICATED\""
            - "second call (X-User-Role is not one of the seven declared roles): status == 401 and error_id == \"ERR_UNAUTHENTICATED\""
            - "neither call reports ERR_INVALID_REQUEST for the missing name field"
            - "GET /studio/styles?limit=10&offset=0 as StudioAdmin still returns total_count == 0"

  # ======================================== Cross-cutting complexity layers
  - section: cross-cutting complexity layers
    instances:
      - name: booking_create_carries_the_session_version_it_was_planned_against
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-session]
          - errors[ERR_STALE_SESSION_VERSION]
          - validations[priority=23]
        distinguishing_aspect: "A session accepts many bookings, so nothing about the second create is illegal by state - only the version is stale. The first booking bumps ShootSession.version, the replay of the original expected_session_version is 412 ERR_STALE_SESSION_VERSION with no booking written, and the same body with the refreshed version succeeds and bumps the version again."
        test_recipe:
          setup:
            - "A BOOKED 09:00-13:00 MODEL session with one photographer booking already created; the producer still holds the version read at session creation."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 0, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Kip Lund", talent_type: "STYLIST", hourly_rate_cents: 9000, day_rate_cents: 50000, minimum_call_hours: 0, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
              captures: { bk1_id: $.data.id }
            - call: "GET /studio/shoot-sessions/${ses_id}"
              as: Producer
              captures: { ses_v2: $.data.version }
          trigger:
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${sl_id}", role_on_set: "STYLIST", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
            - call: "GET /studio/talent-bookings?session_id=${ses_id}&limit=10&offset=0"
              as: Producer
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${sl_id}", role_on_set: "STYLIST", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v2}" }
              as: Producer
              captures: { bk2_id: $.data.id }
            - call: "GET /studio/shoot-sessions/${ses_id}"
              as: Producer
          assert:
            - "first call: status == 412 and error_id == \"ERR_STALE_SESSION_VERSION\""
            - "second call: total_count == 1 - the refused create wrote nothing"
            - "third call: status == 201"
            - "TalentBooking.${bk2_id}.booking_state == \"HELD\""
            - "fourth call: version is strictly greater than ${ses_v2} - every accepted write increments it"
            - "ses_v2 is strictly greater than ses_v1"

      - name: shot_list_item_create_carries_the_style_version_it_was_planned_against
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shot-item-create-stale-style]
          - errors[ERR_STALE_STYLE_VERSION]
          - validations[priority=24]
        distinguishing_aspect: "The second OCC rule guards a different parent with a different field and code: adding the BACK angle with the style version observed before the FRONT angle existed is 412 ERR_STALE_STYLE_VERSION, and required_item_count stays at 1 until the refreshed version is used."
        test_recipe:
          setup:
            - "Style TOP1001 on an APPAREL_TOP profile requiring FRONT and BACK; the FRONT item already exists."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT", "BACK"], required_detail_shots: 0, min_on_model_shots: 0, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { sty_v1: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "STILL_ANGLE", angle_code: "FRONT", estimated_minutes: 30, expected_style_version: "${sty_v1}", required: true }
              as: Producer
              captures: { it1_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { sty_v2: $.data.version }
          trigger:
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "STILL_ANGLE", angle_code: "BACK", estimated_minutes: 30, expected_style_version: "${sty_v1}", required: true }
              as: Producer
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "STILL_ANGLE", angle_code: "BACK", estimated_minutes: 30, expected_style_version: "${sty_v2}", required: true }
              as: Producer
              captures: { it2_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
          assert:
            - "first call: status == 412 and error_id == \"ERR_STALE_STYLE_VERSION\""
            - "second call: required_item_count == 1"
            - "third call: status == 201"
            - "ShotListItem.${it2_id}.item_state == \"PLANNED\""
            - "fourth call: required_item_count == 2 and version is strictly greater than ${sty_v2}"

      - name: the_third_late_return_puts_the_vendor_on_coordination_hold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.sample_return_lateness
          - constants_global.VENDOR_HOLD_STRIKES
          - errors[ERR_VENDOR_COORDINATION_HOLD]
          - validations[priority=33]
        distinguishing_aspect: "The strike counter is cumulative and the hold uses >=, so intake is still open after two late returns and closes on the third; the boundary is exercised by receiving a box between strike two and strike three (accepted) and again after strike three (409 ERR_VENDOR_COORDINATION_HOLD)."
        test_recipe:
          setup:
            - "Vendor NRTH has a 1-day sample SLA. Three boxes are received on 2026-08-01 (due 2026-08-02T08:00Z) and parked in RETURN_PENDING."
            - "The clock is then moved to 2026-08-05T08:00Z so each return is 259200 overdue seconds = 3 whole days late."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 1 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1002", vendor_id: "${v_id}", declared_style_number: "TOP1002" }
              as: SampleCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1003", vendor_id: "${v_id}", declared_style_number: "TOP1003" }
              as: SampleCoordinator
              captures: { s3_id: $.data.id }
            - call: "POST /studio/samples/${s1_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${s2_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${s3_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${s1_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${s2_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${s3_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1004", vendor_id: "${v_id}", declared_style_number: "TOP1004" }
              as: SampleCoordinator
              captures: { s4_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1005", vendor_id: "${v_id}", declared_style_number: "TOP1005" }
              as: SampleCoordinator
              captures: { s5_id: $.data.id }
          trigger:
            - call: "POST /studio/samples/${s1_id}/return"
              payload: { condition_note: "creased" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${s2_id}/return"
              payload: {}
              as: SampleCoordinator
            - call: "GET /studio/vendors/${v_id}"
              as: SampleCoordinator
            - call: "POST /studio/samples/${s4_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${s3_id}/return"
              payload: {}
              as: SampleCoordinator
            - call: "GET /studio/vendors/${v_id}"
              as: SampleCoordinator
            - call: "POST /studio/samples/${s5_id}/receive"
              payload: {}
              as: SampleCoordinator
          assert:
            - "Sample.${s1_id}.due_return_at == \"2026-08-02T08:00:00.000Z\""
            - "Sample.${s1_id}.return_days_late == 3 and Sample.${s1_id}.custody_state == \"RETURNED\""
            - "third call (two strikes recorded): late_return_count == 2 and coordination_hold == false"
            - "fourth call: status == 200 - intake is still open one strike below the threshold"
            - "Sample.${s4_id}.custody_state == \"RECEIVED\""
            - "sixth call (third strike recorded): late_return_count == 3 and coordination_hold == true"
            - "seventh call: status == 409 and error_id == \"ERR_VENDOR_COORDINATION_HOLD\""
            - "Sample.${s5_id}.custody_state == \"EXPECTED\" - the refused intake left the box untouched"

      - name: style_requirement_counter_reconciles_after_create_and_after_waive
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Style.fields.required_item_count
          - entities.Style.fields.delivered_asset_count
          - state_machines.ShotListItem.transitions
        distinguishing_aspect: "The derived counter is exercised in both directions on one style: it rises with each required item created, ignores an item created with required=false, and falls again when a required item is waived - and delivered_asset_count never moves because nothing was shot."
        test_recipe:
          setup:
            - "Style TOP1001 on an APPAREL_TOP profile that requires FRONT and BACK."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT", "BACK"], required_detail_shots: 0, min_on_model_shots: 0, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "STILL_ANGLE", angle_code: "FRONT", estimated_minutes: 30, expected_style_version: "${v1}", required: true }
              as: Producer
              captures: { it1_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { v2: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "STILL_ANGLE", angle_code: "BACK", estimated_minutes: 30, expected_style_version: "${v2}", required: true }
              as: Producer
              captures: { it2_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { v3: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "DETAIL", angle_code: "FRONT", estimated_minutes: 15, expected_style_version: "${v3}", required: false }
              as: Producer
              captures: { it3_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
            - call: "POST /studio/shot-list-items/${it2_id}/waive"
              payload: { reason: "back angle dropped from the brief" }
              as: Producer
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
          assert:
            - "second call: required_item_count == 1"
            - "fourth call: required_item_count == 2"
            - "sixth call: required_item_count == 2 - the optional DETAIL item is not a requirement"
            - "ShotListItem.${it3_id}.required == false"
            - "eighth call: required_item_count == 1 and delivered_asset_count == 0"
            - "ShotListItem.${it2_id}.item_state == \"WAIVED\""
            - "ShotListItem.${it1_id}.item_state == \"PLANNED\" - waiving a sibling touched nothing else"

      - name: cascading_side_effects_layer_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / report_lost_sample_blocks_style_then_items_then_unlocks_session"
          rationale: "That instance walks the deepest declared chain end-to-end (sample LOST -> style BLOCKED -> every non-terminal shot item BLOCKED -> locked session unlocked) and asserts the ordering-sensitive intermediate states, and its sibling deliver_asset_completes_style_and_pushes_sample_into_return_queue covers the upward cascade; a separate corner instance would only replay them."

      - name: dual_variant_calculation_layer_is_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / cost_per_style_provisional_vs_final_diverge_on_one_snapshot"
          rationale: "Both variants of cost_per_style are computed from a single fixture snapshot there, with the delta and the recommended_source selector asserted; retouch_turnaround_gross_breaches_while_net_sits_on_the_sla does the same for the second dual-variant calculation."

      - name: release_selector_policy_is_covered_by_the_difficulty_design
        claim_type: selector_policy
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / model_booking_confirmation_waits_on_release_signature_state"
          rationale: "The selector that picks the release document backing a model booking - signature state first, then scope sufficiency against the session's required_usage_scope - is exercised there across the DRAFT/SIGNED and ECOM_ONLY/FULL_BUYOUT axes; the errors table instance a_signed_ecom_only_release_cannot_cover_a_full_buyout_session covers the scope arm of the same selector."

  # ================================================ Consistency model: immediate
