          - state_machines.Order.PROOF_PENDING_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity #2 — money (a different conserved type than capacity units): captured fresh tender
          that is later refunded on a full-refund cancel MUST reappear cent-for-cent in
          Customer.store_credit_cents. A 6900 deposit captured then refunded on a PROOF_PENDING cancel leaves
          store_credit_cents == 6900, zero monetary drift.
        test_recipe:
