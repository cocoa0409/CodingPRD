        distinguishing_aspect: "The same OCC discipline guards production-run scheduling: a run create carrying a pre-run-create plant version is rejected 412 even though the slot would otherwise be free."
        test_recipe:
          setup:
            - "Plant (version captured), ACTIVE line."
          setup_api_calls:
