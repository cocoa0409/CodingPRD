        distinguishing_aspect: "Disposition decisions are QualityEngineer-exclusive; a TestEngineer decide attempt gets 403."
        test_recipe:
          setup: ["Lot of 2 (1 pass, 1 hard-fail) completed -> AWAITING_DISPOSITION with auto PENDING review"]
