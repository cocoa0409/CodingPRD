        claim_type: Ownership Enforcement
        grounds:
          - validations[priority=6]
          - roles.RetailPartner.identity
          - errors.ERR_NOT_OWNER
        distinguishing_aspect: "For RetailPartner the ownership anchor is the partner_id in the request body rather than a path id, so partner B naming partner A in the payload is refused with 403 ERR_NOT_OWNER even though the order genuinely belongs to partner A."
