              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
