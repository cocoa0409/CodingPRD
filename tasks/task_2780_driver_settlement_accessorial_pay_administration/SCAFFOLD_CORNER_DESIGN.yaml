  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_pay_package_version_outranks_the_pending_revision_guard
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pay-package-revise-stale]
          - validations[priority=15]
          - validations[priority=19]
          - errors[ERR_STALE_PAY_PACKAGE_VERSION]
          - endpoints[POST /driver-pay/pay-packages/{id}/revise]
        distinguishing_aspect: |
          The declared OCC rule for pay-package-revise-stale is the only guard that can catch a client acting on
          a stale view, and it sits at priority 15 - ahead of the pending-revision guard at 19. So replaying the
          pre-revise version yields 412 ERR_STALE_PAY_PACKAGE_VERSION, not the 409
          ERR_PAY_PACKAGE_REVISION_PENDING that the same call would earn with a freshly read version, and no
          second DRAFT successor is created. Re-reading the version and retrying then reaches the 409, which
          proves both guards are live and correctly ordered.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "ACTIVE package PKG_OCCP with PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "its version has been read once into ${pkg_occp_v1} and no write has happened since"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased OCC Package", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_occp: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_occp}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_occp}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_occp}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "GET /driver-pay/pay-packages/${pkg_occp}"
              payload: {}
              as: PayrollAdmin
              captures: { pkg_occp_v1: $.data.version }
          trigger:
            - call: "POST /driver-pay/pay-packages/${pkg_occp}/revise"
              payload: { expected_pay_package_version: "${pkg_occp_v1}", name: "Leased OCC Package v2" }
              as: PayrollAdmin
              captures: { pkg_occp2: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_occp}/revise"
              payload: { expected_pay_package_version: "${pkg_occp_v1}", name: "Leased OCC Package v2 again" }
              as: PayrollAdmin
              captures: { err_occp: $.data.error_id }
            - call: "GET /driver-pay/pay-packages/${pkg_occp}"
              payload: {}
              as: PayrollAdmin
              captures: { pkg_occp_v2: $.data.version }
            - call: "POST /driver-pay/pay-packages/${pkg_occp}/revise"
              payload: { expected_pay_package_version: "${pkg_occp_v2}", name: "Leased OCC Package v3" }
              as: PayrollAdmin
              captures: { err_occp2: $.data.error_id }
            - call: "GET /driver-pay/pay-packages"
              payload: { supersedes_pay_package_id: "${pkg_occp}" }
              as: ComplianceAuditor
          assert:
            - "the first revise returns HTTP 201 and PayPackage.${pkg_occp2}.supersedes_pay_package_id == ${pkg_occp}"
            - "the first revise incremented PayPackage.${pkg_occp}.version, so ${pkg_occp_v2} != ${pkg_occp_v1}"
            - "the replay with ${pkg_occp_v1} returns HTTP 412 with error_id ERR_STALE_PAY_PACKAGE_VERSION"
            - "the replay does NOT return ERR_PAY_PACKAGE_REVISION_PENDING, because priority 15 precedes priority 19"
            - "the retry with the freshly read ${pkg_occp_v2} returns HTTP 409 with error_id ERR_PAY_PACKAGE_REVISION_PENDING"
            - "the successor listing returns exactly 1 row, ${pkg_occp2}, so neither failed call created a second DRAFT"
            - "PayPackage.${pkg_occp}.status is still ACTIVE with has_pending_revision == true"
      - name: a_stale_settlement_version_outranks_the_no_pending_corrections_guard
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settlement-apply-corrections-stale]
          - validations[priority=16]
          - validations[priority=51]
          - errors[ERR_STALE_SETTLEMENT_VERSION]
          - endpoints[POST /driver-pay/settlements/{id}/apply-corrections]
        distinguishing_aspect: |
          apply-corrections is repeatable while the settlement stays DRAFT, so no state precondition can detect a
          client that swept once and then replayed its old view - only the version check can, and at priority 16
          it fires before the priority-51 emptiness check. Replaying ${stl_occs_v1} after a successful sweep
          therefore returns 412 ERR_STALE_SETTLEMENT_VERSION rather than 409 ERR_NO_PENDING_CORRECTIONS, and the
          single -2318 RETRO_CORRECTION line is neither duplicated nor renumbered.
