      - name: future_specimen_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_FUTURE_SPECIMEN]"
        distinguishing_aspect: "Culture collected after the current logical clock -> ERR_FUTURE_SPECIMEN."
        test_recipe:
          setup: ["H; MB; MD; P; clock default 2026-08-01T00:00:00Z"]
