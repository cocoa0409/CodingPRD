            - "after trigger[1]: included_sublease_rent_cents == 0, gross_percentage_rent_cents == 3600000, base_rent_offset_credit_cents == 3000000, amount_due_cents == 600000"
            - "after trigger[1]: Lease.${lease_id}.arrears_balance_cents == 600000, not the 1100000 the pre-settlement credit would have produced"
            - "Lease.${lease_id}.next_revaluation_date advanced by revaluation_interval_years when the settlement landed"

      - name: allocation_extinguishes_senior_mortgage_and_shrinks_the_next_waterfall_input_set
        grounds:
          - calculations.loss_proceeds_allocation
          - state_machines.LossEvent.ADJUSTED_to_ALLOCATED
          - entities.LeaseholdMortgage.fields.outstanding_principal_cents
          - entities.LossEvent.fields.allocation_detail
        distinguishing_aspect: |
          The cascade runs through a calculation's input set rather than through a status field alone:
          allocating the first event pays the senior mortgage to zero, the zero balance flips it to
          EXTINGUISHED, and EXTINGUISHED is exactly the status the waterfall's input_set excludes - so the
          second event's allocation_detail has one row where the first had two. The two events are
          identical in every input except the pool, so an implementation that re-reads the mortgage stack
          without the status filter produces a two-row detail and a wrong junior payoff.
