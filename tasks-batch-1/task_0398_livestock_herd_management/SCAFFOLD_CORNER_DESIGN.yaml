              captures: { load: $.data.current_au_load }
          assert:
            - "Pasture.${oc}.current_au_load == 2.0"
            - "Herd.${ho3}.total_au_load == 2.0"

  # =========================================================================
  - section: endpoints
    instances:
      - name: trace_chain_ordered_for_animal
        claim_type: Computed read
        grounds: [entities.TraceEvent, endpoints]
        distinguishing_aspect: "GET /animals/{id}/trace returns the animal's TraceEvents in ascending occurred_on order, beginning with the BIRTH event from registration followed by a MOVEMENT event."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + 454 kg animal applied into a PEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HE1", species: "CATTLE", premises_id: "PRE-1" }
              as: HerdManager
              captures: { he1: $.data.id }
            - call: "POST /pastures"
              payload: { name: "EP1", kind: "PEN", capacity_au: 10 }
              as: HerdManager
              captures: { ep1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${he1}", ear_tag: "E010", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { e10: $.data.id }
            - call: "POST /animals/${e10}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 454.0 }
              as: HerdManager
            - call: "POST /movement-records"
              payload: { animal_id: "${e10}", to_pasture_id: "${ep1}", effective_from: "2026-03-21T00:00:00Z" }
              as: HerdManager
              captures: { mvE: $.data.id }
            - call: "GET /animals/${e10}"
              as: HerdManager
              captures: { e10_v1: $.data.version }
            - call: "POST /movement-records/${mvE}/apply"
              payload: { expected_animal_version: "${e10_v1}" }
              as: HerdManager
          trigger:
            - call: "GET /animals/${e10}/trace"
              as: Auditor
              captures: { first_type: "$.data[0].event_type" }
          assert:
            - "trace[0].event_type == BIRTH"
            - "trace[1].event_type == MOVEMENT"

      - name: list_animals_filtered_by_herd_paginated
        claim_type: Standard CRUD
        grounds: [endpoints, entities.Animal.fields.herd_id, response_envelope]
        distinguishing_aspect: "GET /animals?herd_id={id} returns only that herd's animals as an array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Clock 2026-04-01; herd with two animals."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HE2", species: "CATTLE", premises_id: "PRE-2" }
              as: HerdManager
              captures: { he2: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${he2}", ear_tag: "E020", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
            - call: "POST /animals"
              payload: { herd_id: "${he2}", ear_tag: "E021", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
          trigger:
            - call: "GET /animals?herd_id=${he2}&limit=10&offset=0"
              as: HerdManager
              captures: { first: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "meta.total_count == 2 for this herd filter"

  # =========================================================================
  - section: errors
    instances:
      - name: error_animal_not_active_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_ANIMAL_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / movement_apply_requires_animal_not_terminal
          rationale: "ERR_ANIMAL_NOT_ACTIVE is asserted as the failure path of that §1.8 instance (applying a movement on a CULLED animal)."

      - name: error_pasture_over_capacity_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_PASTURE_OVER_CAPACITY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pasture_aggregate_au_capacity_overlap
          rationale: "ERR_PASTURE_OVER_CAPACITY is asserted directly by that §1.8 instance."

      - name: error_rest_period_violation_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_REST_PERIOD_VIOLATION]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pasture_grazing_rest_gap_adjacency
          rationale: "ERR_REST_PERIOD_VIOLATION is asserted directly by that §1.8 instance."

      - name: error_withdrawal_not_cleared_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_WITHDRAWAL_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ticket_requires_animal_meat_clear
          rationale: "ERR_WITHDRAWAL_NOT_CLEARED is asserted as the failure path of that §1.8 instance."

      - name: error_empty_lot_already_covered
        claim_type: Violation -> Error
        grounds: ["errors[ERR_EMPTY_LOT]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / sell_empty_lot_zero_head_count
          rationale: "ERR_EMPTY_LOT is asserted directly by that §1.8 instance."

      - name: error_invalid_pedigree_triggerable
        claim_type: Violation -> Error
        grounds: ["errors[ERR_INVALID_PEDIGREE]", "validations[priority=6]"]
        distinguishing_aspect: "Creating an animal whose existing dam_animal_id references a MALE/STEER animal (wrong sex, but it exists so existence passes) returns ERR_INVALID_PEDIGREE (422)."
        test_recipe:
          setup: ["Clock 2026-04-01; herd with one STEER animal to misuse as a dam."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HX1", species: "CATTLE", premises_id: "PRX-1" }
              as: HerdManager
              captures: { hx1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hx1}", ear_tag: "X010", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { steerDam: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { herd_id: "${hx1}", ear_tag: "X011", sex: "STEER", birth_date: "2026-01-01", birth_weight_kg: 38.0, dam_animal_id: "${steerDam}" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INVALID_PEDIGREE"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_calf_visible_in_response
        claim_type: immediate
        grounds: [state_machines.BreedingRecord.CONFIRMED_PREGNANT_to_CALVED, entities.BreedingRecord.fields.calf_animal_id]
        distinguishing_aspect: "On CALVED the breeding record's response immediately carries calf_animal_id, and the calf Animal is immediately GET-able and present in the herd's animal list (all changes visible within the same request flow)."
        test_recipe:
          setup: ["Clock 2026-12-01; CATTLE herd + FEMALE dam; breeding OPEN->BRED->CONFIRMED_PREGNANT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HM1", species: "CATTLE", premises_id: "PRM-1" }
              as: HerdManager
              captures: { hm1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hm1}", ear_tag: "M010", sex: "FEMALE", birth_date: "2022-01-01", birth_weight_kg: 42.0 }
              as: HerdManager
              captures: { damM: $.data.id }
            - call: "POST /breeding-records"
              payload: { dam_animal_id: "${damM}", bred_on: "2026-02-01" }
              as: HerdManager
              captures: { brM: $.data.id }
            - call: "POST /breeding-records/${brM}/transition"
              payload: { to_status: "BRED" }
              as: HerdManager
            - call: "POST /breeding-records/${brM}/transition"
              payload: { to_status: "CONFIRMED_PREGNANT" }
              as: Veterinarian
          trigger:
            - call: "POST /breeding-records/${brM}/transition"
              payload: { to_status: "CALVED", calved_on: "2026-11-15", calf_ear_tag: "M011", calf_birth_weight_kg: 39.0, calf_sex: "FEMALE" }
              as: HerdManager
              captures: { calf: $.data.calf_animal_id }
            - call: "GET /animals/${calf}"
              as: HerdManager
              captures: { calf_ls: $.data.life_status, calf_dam: $.data.dam_animal_id }
          assert:
            - "BreedingRecord.${brM}.status == CALVED"
            - "Animal.${calf}.life_status == ACTIVE"
            - "Animal.${calf}.dam_animal_id == ${damM}"
            - "Herd.${hm1}.active_animal_count == 2"
