      - name: corner_auth_header_family_rejected_before_everything_else
        claim_type: Priority Ordering
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: |
          The two header errors sit at the very top of the ladder, so they have
          to be returned for requests that are ALSO wrong in a more obvious way:
          a headerless GET of an id that does not exist is 401
          ERR_MISSING_AUTH_HEADERS and not 404, and a request carrying an
          invented role is 401 ERR_UNKNOWN_ROLE even when that request would
          have been refused as unauthorized anyway. Presence is checked before
          membership, so a request that omits X-User-Id while sending a bogus
          X-User-Role reports the missing header, not the unknown role.
        test_recipe:
          setup:
            - "one clinic, so that at least one request below targets a real entity"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "Gate Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "GET /dme/clinics/${clinic_id}"
              payload: {}
              as: "<both auth headers omitted>"
              captures: { err_no_headers: $.data.error_id }
            - call: "GET /dme/clinics/${clinic_id}"
              payload: {}
              as: "<X-User-Role present, X-User-Id empty string>"
              captures: { err_empty_user: $.data.error_id }
            - call: "GET /dme/clinics/99999999-9999-4999-8999-999999999989"
              payload: {}
              as: "<both auth headers omitted>"
              captures: { err_headers_beat_404: $.data.error_id }
            - call: "GET /dme/clinics/${clinic_id}"
              payload: {}
              as: SupplyChainIntern
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /dme/clinics"
              payload: { name: "Ghost Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: practiceadmin
              captures: { err_case_role: $.data.error_id }
            - call: "GET /dme/clinics/${clinic_id}"
              payload: {}
              as: "<X-User-Role: SupplyChainIntern, X-User-Id omitted>"
              captures: { err_missing_beats_unknown: $.data.error_id }
          assert:
            - "${err_no_headers} == ERR_MISSING_AUTH_HEADERS with HTTP 401"
            - "${err_empty_user} == ERR_MISSING_AUTH_HEADERS with HTTP 401: an empty header value is treated as absent, not as an unknown actor"
            - "${err_headers_beat_404} == ERR_MISSING_AUTH_HEADERS, NOT ERR_CLINIC_NOT_FOUND: priority 1 precedes every existence check"
            - "${err_unknown_role} == ERR_UNKNOWN_ROLE with HTTP 401 for a role outside the six declared in §1.7"
            - "${err_case_role} == ERR_UNKNOWN_ROLE: role names are matched exactly, so a lower-cased spelling is not one of the six, and no Clinic was created"
            - "${err_missing_beats_unknown} == ERR_MISSING_AUTH_HEADERS, NOT ERR_UNKNOWN_ROLE: presence (priority 1) is decided before membership (priority 2)"
            - "GET /dme/clinics/${clinic_id} with a valid header pair still returns 200, so the rejected requests left no side effect"

  - section: rbac
    instances:
      - name: corner_exclusive_operations_denied_to_every_other_role_rejected
        claim_type: Role Denial
        grounds:
          - roles.PracticeAdmin.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.InventoryManager.exclusive_operations
          - roles.InsuranceCoordinator.exclusive_operations
          - roles.OrthoPhysician.exclusive_operations
          - roles.DmeFitter.exclusive_operations
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The role model is peer segregation of duties, so there is no senior
          role: PracticeAdmin owns the master data yet cannot create a par level,
          verify coverage, sign a note or dispense, and the roles that perform
          those clinical and financial steps cannot register clinics or attest
          suppliers. Each denial below picks a request that is otherwise
          completely valid -- correct payload, correct entity, correct state --
          so the only reason it fails is the acting role, and every one of them
          returns the same 403 ERR_UNAUTHORIZED rather than a domain error.
        test_recipe:
          setup:
            - "one clinic with a physician and a fitter, a patient, a supplier, an off-shelf product, a shelf with stock, and one encounter documented and coverage-verified"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "Peer Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
