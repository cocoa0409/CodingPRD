      - name: an_exit_needs_ninety_days_notice_and_only_an_active_carrier_may_file
        claim_type: temporal_validation
        grounds:
          - errors[ERR_EXIT_NOTICE_TOO_SHORT]
          - errors[ERR_CARRIER_NOT_ACTIVE]
          - validations[priority=10][error_id=ERR_EXIT_NOTICE_TOO_SHORT]
          - validations[priority=6][error_id=ERR_CARRIER_NOT_ACTIVE]
          - endpoints[POST /plan/carriers/{id}/licensing-amendment]
        distinguishing_aspect: |
          The 90-day floor is inclusive - exactly 90 days out is accepted - and once the notice is on
          file the carrier is no longer ACTIVE, so both a second exit notice and a licensing
          amendment are refused at priority 6. Dropping out of the ACTIVE set also re-apportions the
          quota: Beacon's share leaves the denominator entirely.
