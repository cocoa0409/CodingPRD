      - name: per_visit_family_share_is_clipped_by_the_monthly_cap_remainder
        claim_type: correct_result
        grounds:
          - calculations.visit_family_share_cents
          - calculations.family_ledger
          - state_machines.ServiceVisit.billing_status[PENDING -> ACCRUED]
          - state_machines.ServiceVisit.billing_status[PENDING -> CAPPED]
        distinguishing_aspect: |
          Three identical 2-unit visits at a pinned rate of 100 000 cents and a TIER_1 rate of 0.05
          each compute a raw share of 10 000, but the TIER_1 monthly cap of 12 000 clips them
          differently: the first accrues in full (ACCRUED 10 000), the second is clipped to the
          remaining 2 000 (CAPPED, not ACCRUED, because the stored share is less than the raw share),
          and the third gets 0 with the cap remainder already at zero. month_accrued_cents stops at
          12 000 and never exceeds the cap.
