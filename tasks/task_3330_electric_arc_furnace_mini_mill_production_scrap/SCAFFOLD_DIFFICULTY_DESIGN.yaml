              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-ABORT", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/abort"
              payload: {}
              as: MillOperator
          assert:
            - "Heat.${heat_id}.status == ABORTED"
            - "ScrapLot.${lot_id}.remaining_tons == 20 (fully restored — the 8t draw is compensated exactly)"
            - "ScrapLot.${lot_id}.status == RECEIVED (status reverts, not just the counter)"
            - "invariant: sum(remaining_tons over mill lots) == 20 before the charge and == 20 after the abort"

      - name: order_cancel_releases_allocation
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - endpoints.POST_/mills/{millId}/allocation-runs
          - endpoints.POST_/mills/{millId}/customer-accounts/{accountId}/orders/{orderId}/cancel
        distinguishing_aspect: |
          Conserved quantity: division allocation tons. sum(Order.allocated_tons)
          over non-cancelled orders <= available CAST uncommitted heat tons, and
          a cancel of an ALLOCATED order MUST release exactly its allocated
          tonnage back to the pool (allocated_tons → 0). Different conserved
          quantity (allocation pool) than the scrap-inventory invariant above.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. CONSTRUCTION mill; SHREDDED 2026-09 index 38000; grade GR40."
            - "CONTRACT account; order O1 8t fulfillment 2026-09 CONFIRMED (version 2)."
            - "One CAST heat H1 with 8t (tap 2026-09-08T12:00Z); allocation run assigns O1 → O1 ALLOCATED with allocated_tons == 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Contract Builders Inc", market: "CONSTRUCTION", pricing_mode: "CONTRACT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 8, fulfillment_month: "2026-09", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: AccountManager
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Coastal Scrap Co", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 30000, committed_tons: 50 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 25, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-ALLOC", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-08T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets"
              payload: { cu_pct: 0.002, mn_pct: 0.006 }
              as: Metallurgist
              captures: { sheet_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/confirm"
              payload: {}
              as: Metallurgist
            - call: "POST /mills/${mill_id}/heats/${heat_id}/tap"
              payload: {}
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/cast"
              payload: {}
              as: MillOperator
            - call: "POST /mills/${mill_id}/allocation-runs"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/cancel"
              payload: {}
              as: AccountManager
          assert:
            - "before the cancel: Order.${ord_id}.status == ALLOCATED and allocated_tons == 8"
            - "after the cancel: Order.${ord_id}.status == CANCELLED and allocated_tons == 0 (exact release, no residue)"
            - "a subsequent POST /mills/${mill_id}/allocation-runs reports assigned_tons == 0 (the cancelled order is out of the eligible pool and no other order exists)"
