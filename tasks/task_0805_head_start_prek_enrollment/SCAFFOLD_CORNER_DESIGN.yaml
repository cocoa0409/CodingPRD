scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Program", "endpoints./programs"]
        distinguishing_aspect: "POST /programs with all required fields returns 201; response echoes program_type and mints id, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { pt: "$.data.program_type", ver: "$.data.version" }
          assert:
            - "${pt} == \"HEAD_START\""
            - "${ver} == 1"

      - name: get_program_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Program", "errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET /programs/{unknown uuid} returns ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_PROGRAM_NOT_FOUND\""

      - name: create_family_missing_required_categorical_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Family", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /families omitting categorical_eligibility (required, no default) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000 }
              as: EnrollmentSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_VALIDATION\""

      - name: family_homeless_status_defaults_false
        claim_type: Defaults
        grounds: ["entities.Family.fields.homeless_status"]
        distinguishing_aspect: "POST /families without homeless_status applies the default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { hs: "$.data.homeless_status" }
          assert:
            - "${hs} == false"

      - name: cohort_slot_accounting_computed_on_create
        claim_type: Computed Fields
        grounds: ["entities.AgeCohort.fields.available_slots", "entities.AgeCohort.fields.selection_status"]
        distinguishing_aspect: "A freshly created cohort with funded_slots 3 has filled_slots 0, reserved_slots 0, available_slots 3, selection_status OPEN."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 3, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { avail: "$.data.available_slots", sel: "$.data.selection_status", filled: "$.data.filled_slots" }
          assert:
            - "${avail} == 3"
            - "${filled} == 0"
            - "${sel} == \"OPEN\""

      - name: application_status_draft_and_system_fields_on_create
        claim_type: System Fields
        grounds: ["entities.Application.fields.status"]
        distinguishing_aspect: "POST /applications returns status DRAFT with a server-minted id and version 1, regardless of any status supplied by the client."
        test_recipe:
          setup: ["Program, cohort, and family exist."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { st: "$.data.status", ver: "$.data.version" }
          assert:
            - "${st} == \"DRAFT\""
            - "${ver} == 1"

      - name: create_cohort_invalid_enum_age_band_returns_validation
        claim_type: Type Constraints
        grounds: ["entities.AgeCohort.fields.age_band", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /cohorts with age_band outside the declared enum returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "TEENAGER", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_VALIDATION\""

      - name: create_application_unknown_family_returns_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Application.fields.family_id", "errors[ERR_FAMILY_NOT_FOUND]"]
        distinguishing_aspect: "POST /applications with an unknown family_id returns ERR_FAMILY_NOT_FOUND (404)."
        test_recipe:
          setup: ["A program and cohort exist; no family with the referenced id."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "00000000-0000-4000-8000-000000000000", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_FAMILY_NOT_FOUND\""

  # =================================================================
  - section: state_machines
    instances:
      - name: waitlist_from_draft_returns_not_eligible
        claim_type: Invalid Transitions
        grounds: ["state_machines.Application.ELIGIBLE_to_WAITLISTED", "errors[ERR_APPLICATION_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Calling waitlist on a DRAFT (never-verified) application returns ERR_APPLICATION_NOT_ELIGIBLE (409)."
        test_recipe:
          setup: ["A DRAFT application exists (not submitted, not verified)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_APPLICATION_NOT_ELIGIBLE\""

      - name: verify_from_draft_returns_not_submitted
        claim_type: Invalid Transitions
        grounds: ["state_machines.Application.SUBMITTED_to_ELIGIBLE", "errors[ERR_APPLICATION_NOT_SUBMITTED]"]
        distinguishing_aspect: "verify-eligibility on a DRAFT application returns ERR_APPLICATION_NOT_SUBMITTED (409)."
        test_recipe:
          setup: ["A DRAFT application exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_APPLICATION_NOT_SUBMITTED\""

      - name: accept_twice_second_returns_offer_not_pending
        claim_type: Idempotency
        grounds: ["state_machines.Offer.PENDING_to_ACCEPTED", "errors[ERR_OFFER_NOT_PENDING]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED offer a second time returns ERR_OFFER_NOT_PENDING (409); no second enrollment is created."
        test_recipe:
          setup: ["Offer for AB already ACCEPTED (enrollment created); cohort version re-read after accept."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { cv1: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${cv1}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { cv2: "$.data.version" }
          trigger:
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${cv2}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_OFFER_NOT_PENDING\""

      - name: home_visit_complete_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.HomeVisit.SCHEDULED_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already-COMPLETED home visit returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Enrollment ACTIVE for AB with one COMPLETED home visit."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /enrollments?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /home-visits"
              payload: { enrollment_id: "${enr_id}", scheduled_date: "2026-04-01", window_start: "13:00", window_end: "14:00" }
              as: FamilyServicesWorker
              captures: { hv_id: "$.data.id" }
            - call: "POST /home-visits/${hv_id}/complete"
              payload: {}
              as: FamilyServicesWorker
          trigger:
            - call: "POST /home-visits/${hv_id}/complete"
              payload: {}
              as: FamilyServicesWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_INVALID_STATE\""

  # =================================================================
  - section: validations
    instances:
      - name: submit_age_out_of_band_alone_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_AGE_OUT_OF_BAND]"]
        distinguishing_aspect: "A first-time (non-duplicate) submit whose child age (79mo) falls outside the PRESCHOOL_4 band [48,60] returns ERR_AGE_OUT_OF_BAND (422)."
        test_recipe:
          setup: ["A DRAFT application, child dob 2020-01-10 (79mo), targeting a PRESCHOOL_4 cohort; no other application for the child."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Ol", child_last_name: "B", child_dob: "2020-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_AGE_OUT_OF_BAND\""

      - name: accept_after_expiry_returns_offer_expired
        claim_type: Temporal validation
        grounds: ["validations[priority=12]", "errors[ERR_OFFER_EXPIRED]", "entities.Offer.fields.offer_expires_at"]
        distinguishing_aspect: "With the logical clock advanced past offer_expires_at (offered 2026-03-01, expires 2026-03-11), accept returns ERR_OFFER_EXPIRED (409) even though expected_cohort_version is current."
        test_recipe:
          setup: ["Application AB OFFERED with a PENDING offer; clock advanced to 2026-03-12 (past the 10-day window)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_OFFER_EXPIRED\""

      - name: transition_prereq_insufficient_visits_returns_error
        claim_type: Cascading validation
        grounds: ["validations[priority=15]", "errors[ERR_TRANSITION_PREREQ_NOT_MET]"]
        distinguishing_aspect: "Enrollment COMPLIANT but with only 1 COMPLETED home visit (<2) — transition-plan complete returns ERR_TRANSITION_PREREQ_NOT_MET (409)."
        test_recipe:
          setup: ["Enrollment ACTIVE for AB, health COMPLIANT (one IMMUNIZATION UP_TO_DATE), only ONE COMPLETED home visit, DRAFT transition plan."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
