      - name: drive_window_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DRIVE_WINDOW_INVALID]"]
        distinguishing_aspect: "starts_at must be strictly before ends_at: equal bounds are rejected with ERR_DRIVE_WINDOW_INVALID."
        test_recipe:
          setup: ["ACTIVE steward; ACTIVE school"]
          setup_api_calls:
