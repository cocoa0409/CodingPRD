              payload: {}
              as: SourcingManager
              captures: { inv_after: "$.data.invoice_total_cents", out_after: "$.data.committed_volume_outstanding" }
          assert:
            - "st_proposed == \"PROPOSED\" and st_revoked == \"REVOKED\""
            - "err_proposed == \"ERR_ALLOCATION_NOT_COMMITTED\" with status 409"
            - "err_revoked == \"ERR_ALLOCATION_NOT_COMMITTED\" as well -- REVOKED is terminal, not settleable"
            - "st_after == \"PROPOSED\" and amount_after is null"
