            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-w.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dw1: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-w.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dw2: $.data.id }
            - call: "POST /pap/documents/${dw1}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${dw2}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /pap/screenings/${scr_id}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
            - call: "POST /pap/applications"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", screening_id: "${scr_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { app_id: $.data.id }
            - call: "POST /pap/applications/${app_id}/claim"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /pap/applications/${app_id}/decision"
              payload: { decision: "APPROVED" }
              as: CaseWorker
              as_user_id: "cw_1"
              captures: { enr_id: $.data.enrollment_id }
            - call: "POST /pap/inventory-lots"
              payload: { program_id: "${prog_id}", lot_number: "LOT-BAD", quantity_received: 50, unit_cost_per_unit: "100.0000", expiry_date: "2026-05-31" }
              as: ProgramAdministrator
              captures: { lot_bad: $.data.id }
            - call: "POST /pap/inventory-lots"
              payload: { program_id: "${prog_id}", lot_number: "LOT-GOOD", quantity_received: 5, unit_cost_per_unit: "100.0000", expiry_date: "2026-06-01" }
              as: ProgramAdministrator
              captures: { lot_good: $.data.id }
          trigger:
            - call: "POST /pap/shipments"
              payload: { enrollment_id: "${enr_id}", quantity_units: 5, destination: "PATIENT", idempotency_key: "ship-b1" }
              as: CaseWorker
