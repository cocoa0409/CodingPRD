# =============================================================================
# §1.8 Scaffold Difficulty Design — Heavy Truck Uptime Case Management &
# Warranty Administration (Daimler Truck North America)
#
# Test Targeting Index. 2+ instances per rule, every instance grounded in
# SCAFFOLD.yaml §1.1–§1.7. Test recipes are replayable from empty-DB using
# only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: reliability_score_incremental_vs_snapshot_divergence
        grounds:
          - calculations.reliability_score_update
          - state_machines.Case.PENDING_CLOSE_to_CLOSED
          - endpoints.POST_/_ops/run
        distinguishing_aspect: |
          The same fleet event stream is scored twice: incremental (event-driven
          at Case close) versus snapshot (recomputed from history at ops_run).
          Both produce the same total only when no event was lost; the test
          verifies that the snapshot variant catches a missed penalty the
          incremental variant applied, confirming the two variants agree AND
          that they follow different code paths (event-driven vs chronological
          replay over the Case table).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet with one Truck, one Dealer+Bay."
            - "A Case opened at 09:00, driven through TRIAGE/SCHEDULED/IN_SERVICE/PENDING_CLOSE, closed at 2026-09-03T10:00:00Z (49 hours → >24h downtime penalty applies)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Delta Haulers", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-ops-1"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP8834", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 100000, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "Atlanta Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "BAY-7" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_v: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T13:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v}" }
              as: UptimeCoordinator
            # discover the auto-created DRAFT WorkOrder id
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders"
              payload: {}
              as: UptimeCoordinator
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/authorize"
              payload: { diagnostic_minutes_authorized: 60 }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/start-service"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/complete"
              payload: { labor_minutes_actual: 180, repair_outcome: "FIXED" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/request-close"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/close"
              payload: {}
              as: UptimeCoordinator
          trigger:
            - call: "POST /_ops/run"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { score_after_snapshot: $.data.reliability_score }
          assert:
            - "Case.${case_id}.downtime_hours == 49.00"
            - "after Case close (incremental): Fleet.reliability_score == 990 (1000 - 10 downtime penalty)"
            - "after POST /_ops/run (snapshot variant): Fleet.${fleet_id}.reliability_score == 990 (snapshot agrees with incremental — no double-count, no missing penalty)"
            - "ReliabilityReport for ops_run_index == 1 records reliability_score == 990"

      - name: coverage_proration_time_vs_mileage_divergence
        grounds:
          - calculations.coverage_proration
          - entities.CoverageContract.fields.prorated_credit_cents
          - state_machines.CoverageContract.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          The coverage_proration calculation has two valid proration bases
          (time-based and mileage-based) that produce different credits for the
          same contract; the algorithm selects the smaller (OEM-favorable) one.
          The test pins a scenario where time_credit > mileage_credit, proving
          the mileage branch was selected (1,500,000 cents), not the time branch
          (2,500,000 cents).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet with one Truck."
            - "CoverageContract on the truck: starts_on 2026-01-01, ends_on 2027-01-01 (365 days), max_miles 200000, premium 1000000 cents. At contract start, odometer was 100000 (captured at creation)."
            - "Truck odometer updated to 150000 (used 50000 of 200000 miles → mileage_credit = 1000000 * (200000-50000)/200000 = 750000)."
            - "Clock at 2026-07-01 (181 days elapsed → time_credit = 1000000 * (365-181)/365 = round_half_up(504109.589...) = 504110)."
            - "min(750000, 504110) = 504110 — so this test inverts: we want the mileage branch smaller. Set odometer to 170000 → used 70000 → mileage_credit = 1000000 * 130000/200000 = 650000."
            - "Set clock to 2026-04-01 → elapsed 90 days → time_credit = 1000000 * 275/365 = 753425 (round_half_up(753424.657...))."
            - "min(650000, 753425) = 650000 — mileage branch wins."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Mileage Heavy Freight", home_region: "MW" }
              as: FleetManager
              as_user_id: "fm-ops-2"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP9901", model_code: "CASCADIA_126", in_service_on: "2025-12-15T00:00:00Z", odometer_miles: 100000, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/coverage-contracts"
              payload: { contract_type: "EXTENDED_POWERTRAIN", starts_on: "2026-01-01T00:00:00Z", ends_on: "2027-01-01T00:00:00Z", max_miles: 200000, premium_cents: 1000000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { contract_id: $.data.id }
            - call: "PUT /fleets/${fleet_id}/trucks/${truck_id}"
              payload: { odometer_miles: 170000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: UptimeCoordinator
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/coverage-contracts/${contract_id}/cancel"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
          assert:
            - "CoverageContract.${contract_id}.contract_status == CANCELLED"
            - "CoverageContract.${contract_id}.prorated_credit_cents == 650000"
            - "CoverageContract.${contract_id}.prorated_credit_cents != 753425 (time branch rejected)"
            - "CoverageContract.${contract_id}.prorated_credit_cents != 1000000 (full refund not given for partial consumption)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: expedite_decision_three_input_threshold_tiebreak
        grounds:
          - calculations.expedite_decision
          - calculations.expedite_freight_cost
          - endpoints.POST_/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/part-orders/{partOrderId}/evaluate-expedite
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear interaction and
          conditional branches: expedite_decision consumes dealer_repair_hours_est,
          downtime_rate_cents_per_hour, distance_band, quantity,
          part_weight_kg_per_unit, and part_cost_cents; produces three discrete
          outcomes (OVERNIGHT/STANDARD/DENIED) via nested min/max and tie-break
          (>= favors OVERNIGHT). The test pins an exact tie between
          overnight_gain and standard_gain to verify the OVERNIGHT preference.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay in place; Case in IN_SERVICE."
            - "PartOrder with quantity=2, part_weight_kg_per_unit=5.0, part_cost_cents=1200000."
            - "expedite inputs: distance_band=INTRA_REGION (base 15000, per_kg 300), dealer_repair_hours_est=10, downtime_rate_cents_per_hour=100000."
            - "weight_total_kg = 10.0; overnight_cost = 15000 + 300*10 = 18000."
            - "standard_cost = round_half_up(0.4 * 18000) = 7200."
            - "downtime_cost = round_half_up(10 * 100000) = 1000000."
            - "overnight_gain = 1000000 - 18000 = 982000."
            - "standard_gain = round_half_up(0.6 * 1000000) - 7200 = 600000 - 7200 = 592800."
            - "overnight_gain (982000) > standard_gain (592800) → EXPEDITE_OVERNIGHT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Expedite Test Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-expedite"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0001", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 50000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "SE Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_v: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T13:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v}" }
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders"
              payload: {}
              as: UptimeCoordinator
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/authorize"
              payload: { diagnostic_minutes_authorized: 30 }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/start-service"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/part-orders"
              payload: { part_number: "A0001404439", quantity: 2, part_weight_kg_per_unit: 5.0, part_cost_cents: 1200000 }
              as: PartsManager
              captures: { part_order_id: $.data.id }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/part-orders/${part_order_id}/evaluate-expedite"
              payload: { dealer_repair_hours_est: 10, downtime_rate_cents_per_hour: 100000, distance_band: "INTRA_REGION" }
              as: PartsManager
              captures: { decided: $.data.expedite_decision }
          assert:
            - "PartOrder.${part_order_id}.expedite_decision == EXPEDITE_OVERNIGHT"
            - "PartOrder.${part_order_id}.expedite_cost_cents == 18000"
            - "PartOrder.${part_order_id}.downtime_cost_cents == 1000000"
            - "Case.${case_id}.expedite_count == 1"

      - name: labor_time_standard_nested_tier_boundary_minute_math
        grounds:
          - calculations.labor_time_standard
          - entities.WarrantyClaim.fields.labor_minutes_claimed
          - endpoints.POST_/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/submit
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters AND a tiered-rate
          selection on top: labor_time_standard picks a base from a fault-code
          table, multiplies by a claim-type factor (BASE_WARRANTY 1.0 vs
          EXTENDED_COVERAGE 1.1), rounds half-up to 2 decimals, then compares
          minutes against hours*60 with INCLUSIVE equality. The test drives a
          claim at exactly the inclusive boundary (264 minutes for 4.4 hours)
          proving that the equality is inclusive; +1 minute fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; Case with closed service."
            - "Truck has an ACTIVE EXTENDED_POWERTRAIN CoverageContract."
            - "Claim: fault_code SPN3216_FMI4 (base 4.0h), claim_type EXTENDED_COVERAGE (mult 1.1) → labor_hours_allowed = round_half_up(4.0*1.1, 2) = 4.40h."
            - "labor_minutes_claimed = 4.40*60 = 264 (inclusive boundary)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Boundary Fleet", home_region: "PNW" }
              as: FleetManager
              as_user_id: "fm-boundary"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0002", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 80000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "Portland Freightliner", region: "PNW", hourly_labor_rate_cents: 20000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/coverage-contracts"
              payload: { contract_type: "EXTENDED_POWERTRAIN", starts_on: "2026-01-01T00:00:00Z", ends_on: "2027-01-01T00:00:00Z", max_miles: 200000, premium_cents: 1000000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_v: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T13:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v}" }
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders"
              payload: {}
              as: UptimeCoordinator
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/authorize"
              payload: { diagnostic_minutes_authorized: 30 }
              as: UptimeCoordinator
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/start-service"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/complete"
              payload: { labor_minutes_actual: 264, repair_outcome: "FIXED" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/request-close"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims"
              payload: { claim_type: "EXTENDED_COVERAGE", labor_minutes_claimed: 264, parts_claimed_cents: 50000 }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}"
              payload: {}
              as: UptimeCoordinator
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/submit"
              payload: { expected_case_version: "${case_v}" }
              as: WarrantyAdmin
          assert:
            - "the response status is 200"
            - "WarrantyClaim.${claim_id}.labor_hours_allowed == 4.40"
            - "WarrantyClaim.${claim_id}.submission_status == SUBMITTED"
            - "WarrantyClaim.${claim_id}.labor_amount_allowed_cents == round_half_up(4.40 * 20000) == 88000"
            # negative: 265 minutes should fail
            - "a second claim with labor_minutes_claimed=265 returns 422 ERR_LABOR_MINUTES_EXCEED_STANDARD"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: case_pending_close_to_in_service_cycle
        grounds:
          - state_machines.Case.PENDING_CLOSE_to_IN_SERVICE
          - state_machines.Case.IN_SERVICE_to_PENDING_CLOSE
        distinguishing_aspect: |
          The Case machine contains an explicit cycle PENDING_CLOSE → IN_SERVICE
          (reopen-service) followed by IN_SERVICE → PENDING_CLOSE (request-close
          again). This is non-linear (cyclic) on the Case entity. The test walks
          the cycle twice and verifies that open_case_count, bay state, and
          downtime_hours all reconcile.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; Case driven to PENDING_CLOSE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "Cycle Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-cycle"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0010", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 60000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "Cycle Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
