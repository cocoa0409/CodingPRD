      - "Submission REJECTED -> APPEAL_PENDING (METADATA_REJECTED is not appealable)"
      - "Enforces the APPEAL_WINDOW_DAYS temporal gate, the CONTESTED disposition gate and the one-live-appeal gate"

  - method: GET
    path: /appeal-requests
    description: "List appeals."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor]
    input: ["submission_id?", "state?", "appeal_type?", "limit?", "offset?"]
