          - "publisher X-User-ID != submitted_by_user_id of every included ActualCostEntry (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "published_by_user_id set"
          - "Invoice created (status ISSUED, issued_on = clock, due_on = clock + 30d) for every non-withdrawn participation whose delta_cents > 0, principal_cents = delta_cents; invoices are created in participation sequence_order ASC (tie-break created_at ASC)"
          - "each participation that received an invoice: INSTALLED -> BILLED"
          - "project.latest_true_up_run_id = this run"
      - from: PUBLISHED
        to: SETTLED
        trigger: "POST /api/true-up-runs/{id}/transition {to: SETTLED}"
        actor: ProgramManager
        preconditions: ["every Invoice of this run is PAID|VOID (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (cascade: a new TrueUpRun is created for the same project)"
        actor: system
        preconditions: []
        side_effects: ["its invoices in ISSUED|DISPUTED -> VOID"]

  - entity: Invoice
