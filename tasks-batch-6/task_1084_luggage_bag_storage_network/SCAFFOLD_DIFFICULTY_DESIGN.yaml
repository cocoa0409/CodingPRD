              payload: { name: "A", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { locA: $.data.id }
            - call: "POST /locations/${locA}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { locA_v: $.data.version }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "B", address: "2 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { locB: $.data.id }
            - call: "POST /locations/${locB}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { locB_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${locA}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${locA_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkgA: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "${locB}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-12", check_out_date: "2026-06-16", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${locB_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second overlapping booking on the host's other location fails with error_id == ERR_HOST_CONCURRENCY_EXCEEDED"

