# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3107_destination_medicine_referral_intake_multi_specialty_visit
# Scenario: Destination Medicine Referral Intake & Multi-Specialty Visit
#           Bundling (Mayo Clinic)
# =============================================================================

scenario: |
  Destination Medicine Referral Intake & Multi-Specialty Visit Bundling (Mayo Clinic): remote referral intake with medical record acquisition and case review before travel authorization, appointment bundling that compresses multiple specialist visits, imaging and testing into a short itinerary, out-of-state and international patient financial clearance with deposits and estimate letters, travel, lodging and interpreter coordination for patients and companions, integrated practice model where a single care team coordinates specialists, second opinion and remote consultation products for patients who do not travel, results communication back to the referring physician with continuity plans, capacity allocation between local and destination patients

domain_name: destination-medicine
api_prefix: ""   # routes are rooted at / (e.g. /referrals, /visit-cases, /slots)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SpecialtyService
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique specialty code (e.g. CARD, NEUR, ORTH); unique across all services" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: destination_daily_capacity, type: integer, source: input, constraints: ">= 1", description: "Per-day capacity pool reserved for destination (referral-routed) patients" }
      - { name: service_window_start_min, type: integer, source: input, constraints: "0..1439, < service_window_end_min", description: "Daily bookable window start, minutes from midnight" }
      - { name: service_window_end_min, type: integer, source: input, constraints: "0..1440, > service_window_start_min", description: "Daily bookable window end, minutes from midnight (exclusive)" }
      - { name: supports_imaging, type: boolean, source: input, default: false, description: "Whether IMAGING type visits may be scheduled under this service" }
      - { name: supports_remote_products, type: boolean, source: input, default: true, description: "Whether SECOND_OPINION / REMOTE_CONSULT cases may target this service" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: patient, type: object, source: input, description: "Inline patient payload; cascade-creates the Patient record. Keys: full_name (required), date_of_birth (required), residence_country (required, ISO 3166-1 alpha-2; non-'US' marks the case international), residence_state (required for US residents; must differ from the system home state 'MN' or the case is rejected), preferred_language (required, BCP-47; non-'en' requires interpreter), needs_interpreter (optional bool; default derived from preferred_language != 'en')" }
      - { name: referring_physician_name, type: string, source: input, description: "External referring physician full name" }
      - { name: referring_physician_contact, type: string, source: input, description: "Contact handle (email or phone) for results transmission" }
      - { name: reason, type: string, source: input, description: "Clinical reason for referral" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | RECORDS_PENDING | IN_REVIEW | REVIEWED | DECLINED | CLOSED", description: "Intake pipeline state; single linear pipeline with a DECLINED branch" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: system, description: "Copied from the creating Referral's patient.full_name" }
      - { name: date_of_birth, type: string, source: system, description: "Copied from the creating Referral's patient.date_of_birth" }
      - { name: residence_country, type: string, source: system, description: "Copied from the creating Referral's patient.residence_country" }
      - { name: residence_state, type: string, source: system, description: "Copied from the creating Referral's patient.residence_state; null for international patients" }
      - { name: preferred_language, type: string, source: system, description: "Copied from the creating Referral's patient.preferred_language" }
      - { name: is_international, type: boolean, source: computed, description: "= residence_country != 'US'" }
      - { name: requires_interpreter, type: boolean, source: computed, description: "= patient.needs_interpreter when supplied, else preferred_language != 'en'" }

  - name: MedicalRecord
    parent: Referral
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; owning referral" }
      - { name: record_type, type: enum, source: input, constraints: "IMAGING | LAB | PATHOLOGY | CLINICAL_NOTES | MEDICATION_LIST", description: "Category of the medical record" }
      - { name: source_facility, type: string, source: input, description: "Originating facility name" }
      - { name: received_at, type: datetime, source: system, description: "Server-stamped receipt time (logical clock)" }
      - { name: status, type: enum, source: system, constraints: "RECEIVED | VERIFIED | REJECTED", description: "Verification pipeline; REJECTED requires reason and returns referral to RECORDS_PENDING" }

  - name: VisitCase
    parent: Referral
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; owning referral" }
      - { name: case_type, type: enum, source: input, constraints: "DESTINATION | SECOND_OPINION | REMOTE_CONSULT", description: "DESTINATION requires travel + itinerary; the other two are remote products" }
      - { name: assigned_coordinator_id, type: string, source: input, description: "X-User-ID of the IntakeCoordinator who owns the case (fixed at creation)" }
      - { name: care_team_specialty_ids, type: array, source: input, constraints: "DESTINATION: 2..4 distinct SpecialtyService ids; remote products: exactly 1", description: "The integrated care team: specialties whose visits/tests bundle into one itinerary" }
      - { name: review_days_used, type: integer, source: system, description: "Count of distinct calendar dates on which case reviews were recorded; drives the fatigue guard" }
      - { name: fatigue_score, type: integer, source: system, default: 0, description: "Case-level fatigue accumulator; +2 per record verified, -3 per completed remote consult (floor 0); SUM condition at >= 10 auto-withdraws the case" }
      - { name: status, type: enum, source: system, constraints: "INTAKE | AWAITING_FINANCIAL | FINANCIAL_CLEARED | SCHEDULING | SCHEDULED | READY_TO_TRAVEL | COMPLETED | WITHDRAWN | DECLINED", description: "Case pipeline; SUM-derived fatigue auto-transition to WITHDRAWN documented in state_machines" }
      - { name: deposit_amount_cents, type: integer, source: system, description: "Estimated deposit computed at review-approval via deposit_estimate (tiered)" }

  - name: CaseReview
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the CaseReviewer; segregation-of-duties checked against VisitCase.assigned_coordinator_id" }
      - { name: outcome, type: enum, source: input, constraints: "APPROVE | DECLINE", description: "APPROVE moves case toward AWAITING_FINANCIAL; DECLINE moves case to DECLINED" }
      - { name: notes, type: string, source: input, description: "Review rationale" }
      - { name: reviewed_on_date, type: string, source: system, description: "Calendar date (logical clock) on which this review was recorded; drives review_days_used" }

  - name: EstimateLetter
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id" }
      - { name: itinerary_revision_at_issue, type: integer, source: system, description: "Itinerary.revision at the moment this letter was issued; staleness detection compares against current revision" }
      - { name: provisional_estimate_cents, type: integer, source: system, description: "Provisional-variant itinerary total at issue time" }
      - { name: final_estimate_cents, type: integer, source: system, description: "Finalized-variant itinerary total at issue time; used for settled billing" }
      - { name: deposit_amount_cents, type: integer, source: system, description: "Deposit computed from final_estimate_cents via deposit_estimate tiers; applied to FinancialClearance" }
      - { name: is_stale, type: boolean, source: computed, description: "= itinerary_revision_at_issue < current Itinerary.revision" }
      - { name: status, type: enum, source: system, constraints: "ISSUED | SUPERSEDED", description: "Only one ISSUED letter per case at a time; issuing a fresh one supersedes the prior" }

  - name: FinancialClearance
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id (1:1)" }
      - { name: required_deposit_cents, type: integer, source: system, description: "Deposit required before itinerary confirmation; set from the ISSUED EstimateLetter" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Running total of DEPOSIT payments recorded against this clearance" }
      - { name: holds_released, type: boolean, source: system, default: false, description: "True after forfeiture released all HELD slots; a released clearance cannot return to PENDING" }
      - { name: status, type: enum, source: system, constraints: "PENDING | CLEARED | FORFEITED | SETTLED | WAIVED", description: "Clearance lifecycle; CLEARED is reversible (insurance verification can reopen), FORFEITED/SETTLED/WAIVED are terminal" }

  - name: Itinerary
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id (1:1); created at case review approval" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on every confirmed-slot reschedule or cancellation; drives estimate-letter staleness" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Dual-variant total: provisional variant of itinerary_total_estimate over current slots" }
      - { name: final_total_cents, type: integer, source: computed, description: "Dual-variant total: final variant of itinerary_total_estimate over current slots" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | CONFIRMED | LOCKED | CANCELLED", description: "Bundling lifecycle; confirm requires every non-cancelled slot CONFIRMED and clearance CLEARED" }

  - name: AppointmentSlot
    parent: SpecialtyService
    common_fields: true
    fields:
      - { name: specialty_service_id, type: string, source: system, description: "FK -> SpecialtyService.id; the service pool this slot draws against" }
      - { name: slot_date, type: string, source: input, description: "Calendar date (YYYY-MM-DD)" }
      - { name: start_min, type: integer, source: input, constraints: "0..1439", description: "Start minute from midnight; half-open interval [start_min, end_min)" }
      - { name: end_min, type: integer, source: input, constraints: "1..1440, > start_min", description: "End minute from midnight (exclusive)" }
      - { name: status, type: enum, source: system, constraints: "OPEN | HELD | CONFIRMED | RELEASED | CANCELLED", description: "Slot lifecycle; HELD slots consume reserved capacity" }

  - name: Visit
    parent: Itinerary
    common_fields: true
    fields:
      - { name: itinerary_id, type: string, source: system, description: "FK -> Itinerary.id" }
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id (denormalized for filtering)" }
      - { name: appointment_slot_id, type: string, source: system, description: "FK -> AppointmentSlot.id; the slot this visit occupies" }
      - { name: specialty_service_id, type: string, source: system, description: "FK -> SpecialtyService.id (denormalized from the slot)" }
      - { name: visit_type, type: enum, source: input, constraints: "CONSULT | IMAGING | LAB_TEST | PROCEDURE", description: "IMAGING requires the service's supports_imaging flag; LAB_TEST/PROCEDURE inherit slot pricing" }
      - { name: listed_price_cents, type: integer, source: input, constraints: "> 0", description: "Base price fed into itinerary_total_estimate" }
      - { name: sequencing_priority, type: integer, source: input, constraints: "1..99", description: "Same-day ordering key; ascending, ties broken by created_at ASC" }
      - { name: status, type: enum, source: system, constraints: "PENDING | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", description: "Per-visit lifecycle; cancellation releases the slot and bumps Itinerary.revision" }

  - name: LogisticsArrangement
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id" }
      - { name: arrangement_type, type: enum, source: input, constraints: "TRAVEL | LODGING | INTERPRETER", description: "INTERPRETER requires Patient.requires_interpreter == true" }
      - { name: details, type: string, source: input, description: "Free-form details (carrier, hotel, language pair)" }
      - { name: companion_count, type: integer, source: input, constraints: "0..2", description: "Number of companions traveling with the patient" }
      - { name: status, type: enum, source: system, constraints: "REQUESTED | BOOKED | CANCELLED", description: "REQUESTED -> BOOKED via confirm; cascade-cancelled when the case withdraws" }

  - name: Communication
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id" }
      - { name: comm_type, type: enum, source: input, constraints: "RESULTS_TO_REFERRER | CONTINUITY_PLAN", description: "RESULTS_TO_REFERRER transmits findings; CONTINUITY_PLAN sets follow-up ownership" }
      - { name: body, type: string, source: input, description: "Message body" }
      - { name: continuity_plan, type: object, source: input, constraints: "required iff comm_type == CONTINUITY_PLAN; keys: owner (LOCAL_PHYSICIAN | DESTINATION_TEAM | SHARED), follow_up_weeks (1..52)", description: "Structured continuity plan handed to the referring physician" }
      - { name: sent_at, type: datetime, source: system, description: "Server-stamped send time (logical clock)" }

  - name: BillingTransaction
    parent: VisitCase
    common_fields: true
    fields:
      - { name: visit_case_id, type: string, source: system, description: "FK -> VisitCase.id" }
      - { name: financial_clearance_id, type: string, source: system, description: "FK -> FinancialClearance.id" }
      - { name: txn_type, type: enum, source: input, constraints: "DEPOSIT | SETTLEMENT | REFUND", description: "DEPOSIT accrues to deposit_paid_cents; SETTLEMENT requires >= 3 COMPLETED visits; REFUND reverses a DEPOSIT" }
      - { name: amount_cents, type: integer, source: input, constraints: "> 0; SETTLEMENT amount is server-overwritten to final_total_cents - deposit_paid_cents", description: "Gross amount of the transaction" }
      - { name: status, type: enum, source: system, constraints: "POSTED | VOID", description: "REFUND voids its source DEPOSIT" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [DECLINED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: RECORDS_PENDING
        trigger: "POST /referrals/{id}/medical-records (first record receipt)"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == SUBMITTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "MedicalRecord created with status RECEIVED"

      - from: RECORDS_PENDING
        to: IN_REVIEW
        trigger: "POST /referrals/{id}/submit-review"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECORDS_PENDING (ERR_INVALID_STATE)"
          - "Count of MedicalRecord with status == VERIFIED >= 1 (ERR_NO_VERIFIED_RECORDS)"
        side_effects: []

      - from: RECORDS_PENDING
        to: RECORDS_PENDING
        trigger: "POST /referrals/{id}/medical-records/{id}/reject"
        actor: CaseReviewer
        preconditions:
          - "MedicalRecord.status == RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "MedicalRecord.status -> REJECTED"
          - "Referral stays RECORDS_PENDING (self-transition recorded for audit)"

      - from: IN_REVIEW
        to: REVIEWED
        trigger: "POST /visit-cases with outcome resolved via first CaseReview APPROVE (see VisitCase machine)"
        actor: CaseReviewer
        preconditions:
          - "Referral.status == IN_REVIEW"
        side_effects:
          - "Referral.status -> REVIEWED when its VisitCase reaches AWAITING_FINANCIAL"

      - from: IN_REVIEW
        to: DECLINED
        trigger: "CaseReview outcome DECLINE on any case of this referral"
        actor: CaseReviewer
        preconditions: []
        side_effects:
          - "VisitCase.status -> DECLINED"

      - from: REVIEWED
        to: CLOSED
        trigger: "VisitCase COMPLETED (see VisitCase machine)"
        actor: system
        preconditions:
          - "A RESULTS_TO_REFERRER Communication exists for the case (ERR_RESULTS_NOT_TRANSMITTED)"
          - "A CONTINUITY_PLAN Communication exists for the case (ERR_CONTINUITY_PLAN_MISSING)"
        side_effects: []

  - entity: MedicalRecord
    initial_state: RECEIVED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /referrals/{id}/medical-records/{id}/verify"
        actor: CaseReviewer
        preconditions:
          - "MedicalRecord.status == RECEIVED (ERR_INVALID_STATE)"
          - "Reviewer is not the IntakeCoordinator who created the parent referral's case pipeline entry for this record (segregation of duties: ERR_SEGREGATION_OF_DUTIES when reviewer_id == the record's receiving coordinator)"
        side_effects:
          - "VisitCase.fatigue_score += 2 for every VisitCase under this referral that is in a non-terminal status (FATIGUE cascade link 1)"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /referrals/{id}/medical-records/{id}/reject"
        actor: CaseReviewer
        preconditions:
          - "MedicalRecord.status == RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "Referral stays RECORDS_PENDING"

  - entity: VisitCase
    initial_state: INTAKE
    terminal_states: [COMPLETED, WITHDRAWN, DECLINED]
    transitions:
      - from: INTAKE
        to: AWAITING_FINANCIAL
        trigger: "POST /visit-cases/{id}/reviews with outcome APPROVE"
        actor: CaseReviewer
        preconditions:
          - "VisitCase.status == INTAKE (ERR_INVALID_STATE)"
          - "Referral.status == IN_REVIEW (ERR_REFERRAL_NOT_IN_REVIEW)"
          - "reviewer X-User-ID != VisitCase.assigned_coordinator_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Reviewer has recorded reviews on fewer than 3 distinct calendar dates for this case (ERR_FATIGUE_GUARD: review_days_used would exceed 3)"
        side_effects:
          - "CaseReview persisted; VisitCase.review_days_used recomputed as count(distinct reviewed_on_date)"
          - "Itinerary created (status DRAFT, revision 1) for DESTINATION cases"
          - "FinancialClearance created (status PENDING, deposit_paid_cents 0)"
          - "deposit_amount_cents computed via deposit_estimate (provisional itinerary is empty at approval -> tier floor applies: base estimate from care-team size)"
          - "Referral.status -> REVIEWED"

      - from: INTAKE
        to: DECLINED
        trigger: "POST /visit-cases/{id}/reviews with outcome DECLINE"
        actor: CaseReviewer
        preconditions:
          - "VisitCase.status == INTAKE (ERR_INVALID_STATE)"
          - "Referral.status == IN_REVIEW (ERR_REFERRAL_NOT_IN_REVIEW)"
          - "reviewer X-User-ID != VisitCase.assigned_coordinator_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Referral.status -> DECLINED"
          - "Cascade: any LogisticsArrangement in REQUESTED/BOOKED -> CANCELLED"

      - from: AWAITING_FINANCIAL
        to: FINANCIAL_CLEARED
        trigger: "system (FinancialClearance -> CLEARED bubbles up)"
        actor: system
        preconditions:
          - "FinancialClearance.status == CLEARED"
        side_effects:
          - "VisitCase.status -> FINANCIAL_CLEARED"

      - from: FINANCIAL_CLEARED
        to: SCHEDULING
        trigger: "POST /visit-cases/{id}/slot-holds (first hold) — booking opens scheduling"
        actor: IntakeCoordinator
        preconditions:
          - "VisitCase.status == FINANCIAL_CLEARED (ERR_INVALID_STATE; booking before clearance)"
          - "expected_case_version == VisitCase.version (ERR_STALE_VERSION)"
        side_effects:
          - "VisitCase.status -> SCHEDULING"
          - "VisitCase.version += 1"

      - from: SCHEDULING
        to: SCHEDULED
        trigger: "POST /itineraries/{id}/confirm"
        actor: IntakeCoordinator
        preconditions:
          - "Itinerary.status == DRAFT (ERR_INVALID_STATE)"
          - "FinancialClearance.status == CLEARED (ERR_FINANCIAL_CLEARANCE_REQUIRED)"
          - "Every Visit under the itinerary with status PENDING is CONFIRMED (ERR_UNCONFIRMED_VISITS_REMAIN)"
          - "Itinerary spans <= 5 distinct slot_date values (ERR_ITINERARY_WINDOW_EXCEEDED)"
        side_effects:
          - "Itinerary.status -> CONFIRMED"
          - "VisitCase.status -> SCHEDULED"

      - from: SCHEDULED
        to: READY_TO_TRAVEL
        trigger: "POST /visit-cases/{id}/authorize-travel"
        actor: IntakeCoordinator
        preconditions:
          - "VisitCase.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Itinerary.status == CONFIRMED (ERR_INVALID_STATE)"
          - "ISSUED EstimateLetter exists and is_stale == false (ERR_STALE_ESTIMATE_LETTER)"
          - "Every LogisticsArrangement with arrangement_type == INTERPRETER required by Patient.requires_interpreter is BOOKED (ERR_INTERPRETER_NOT_BOOKED)"
        side_effects:
          - "VisitCase.status -> READY_TO_TRAVEL"

      - from: READY_TO_TRAVEL
        to: COMPLETED
        trigger: "system (auto-transition when every non-CANCELLED Visit under the itinerary reaches a terminal state COMPLETED or NO_SHOW, and at least one Visit is COMPLETED)"
        actor: system
        preconditions:
          - "All Visit.status in {COMPLETED, NO_SHOW, CANCELLED} and count(COMPLETED) >= 1"
        side_effects:
          - "VisitCase.status -> COMPLETED"
          - "Referral.status -> CLOSED only after both required Communications exist; otherwise VisitCase stays COMPLETED and Referral closure is re-evaluated on each Communication creation"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /visit-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "VisitCase.status in {INTAKE, AWAITING_FINANCIAL, FINANCIAL_CLEARED, SCHEDULING} (ERR_INVALID_STATE after SCHEDULED)"
        side_effects:
          - "Cascade: AppointmentSlot HELD by this case -> RELEASED (capacity pool decremented)"
          - "Cascade: LogisticsArrangement REQUESTED/BOOKED -> CANCELLED"
          - "Cascade: Itinerary DRAFT -> CANCELLED; Visits PENDING -> CANCELLED"

      - from: AWAITING_FINANCIAL
        to: WITHDRAWN
        trigger: "POST /visit-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["VisitCase.status in withdrawable set"]
        side_effects: ["Same cascade as INTAKE -> WITHDRAWN"]

      - from: FINANCIAL_CLEARED
        to: WITHDRAWN
        trigger: "POST /visit-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["VisitCase.status in withdrawable set"]
        side_effects: ["Same cascade as INTAKE -> WITHDRAWN"]

      - from: SCHEDULING
        to: WITHDRAWN
        trigger: "POST /visit-cases/{id}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["VisitCase.status in withdrawable set"]
        side_effects: ["Same cascade as INTAKE -> WITHDRAWN"]

      - from: "INTAKE | AWAITING_FINANCIAL | FINANCIAL_CLEARED | SCHEDULING"
        to: WITHDRAWN
        trigger: "system (fatigue auto-withdrawal: fatigue_score >= 10 after any fatigue increment)"
        actor: system
        preconditions:
          - "fatigue_score >= 10 (SUM condition on the fatigue accumulator)"
        side_effects:
          - "Same release cascade as manual withdrawal"
          - "note: threshold is >= 10, not > 10"

  - entity: FinancialClearance
    initial_state: PENDING
    terminal_states: [FORFEITED, SETTLED, WAIVED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system (deposit_paid_cents >= required_deposit_cents after a DEPOSIT posts)"
        actor: system
        preconditions:
          - "deposit_paid_cents >= required_deposit_cents (boundary: equality clears)"
          - "required_deposit_cents > 0 (a zero-required clearance clears immediately on creation only when deposit tier floor is 0; otherwise waits for deposit)"
        side_effects:
          - "Bubble up: VisitCase.status AWAITING_FINANCIAL -> FINANCIAL_CLEARED"

      - from: CLEARED
        to: PENDING
        trigger: "POST /visit-cases/{id}/financial-clearance/reopen"
        actor: FinancialCounselor
        preconditions:
          - "FinancialClearance.status == CLEARED (ERR_INVALID_STATE)"
          - "FinancialClearance.holds_released == false (ERR_CLEARANCE_HOLD_RELEASED)"
        side_effects:
          - "Bubble up: VisitCase.status FINANCIAL_CLEARED -> AWAITING_FINANCIAL (re-derivation on read of case progress)"
          - "Case already in SCHEDULING/SCHEDULED is NOT demoted; reopen only affects clearance state"

      - from: PENDING
        to: FORFEITED
        trigger: "POST /visit-cases/{id}/financial-clearance/forfeit (deadline breach: logical clock beyond itinerary earliest slot_date minus DEPOSIT_DEADLINE_DAYS without clearing)"
        actor: FinancialCounselor
        preconditions:
          - "FinancialClearance.status == PENDING (ERR_INVALID_STATE)"
          - "Logical clock date > earliest HELD slot_date of the case itinerary minus 14 days (ERR_DEADLINE_NOT_BREACHED when not yet breached)"
        side_effects:
          - "Cascade depth-3: FinancialClearance FORFEITED -> every AppointmentSlot HELD by this case -> RELEASED (capacity freed) -> each corresponding Visit PENDING -> CANCELLED -> Itinerary.status DRAFT -> CANCELLED and Itinerary.revision += 1"
          - "FinancialClearance.holds_released = true"
          - "VisitCase.status -> WITHDRAWN"

      - from: CLEARED
        to: SETTLED
        trigger: "POST /visit-cases/{id}/billing-transactions with txn_type SETTLEMENT"
        actor: FinancialCounselor
        preconditions:
          - "FinancialClearance.status == CLEARED (ERR_INVALID_STATE)"
          - "count(Visit.status == COMPLETED under the itinerary) >= 3 (ERR_MINIMUM_COMPLETED_VISITS)"
          - "VisitCase.status == COMPLETED"
        side_effects:
          - "BillingTransaction.amount_cents overwritten to max(0, itinerary.final_total_cents - deposit_paid_cents)"
          - "Compensating invariant: deposit_paid_cents + SETTLEMENT amount == final_total_cents at settle time"

      - from: PENDING
        to: WAIVED
        trigger: "POST /visit-cases/{id}/financial-clearance/waive"
        actor: FinancialCounselor
        preconditions:
          - "FinancialClearance.status == PENDING (ERR_INVALID_STATE)"
          - "Patient.is_international == false (international patients may not be waived: ERR_INTERNATIONAL_WAIVER_FORBIDDEN)"
        side_effects:
          - "Bubble up: VisitCase AWAITING_FINANCIAL -> FINANCIAL_CLEARED"

  - entity: AppointmentSlot
    initial_state: OPEN
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: OPEN
        to: HELD
        trigger: "POST /visit-cases/{id}/slot-holds"
        actor: IntakeCoordinator
        preconditions:
          - "AppointmentSlot.status == OPEN (ERR_SLOT_NOT_OPEN)"
          - "Half-open interval [start_min, end_min) does not overlap any HELD/CONFIRMED slot for the same specialty_service_id and slot_date (ERR_SLOT_OVERLAP; adjacency allowed: end_min == other.start_min is NOT overlap)"
          - "count(HELD + CONFIRMED slots for service, slot_date) < SpecialtyService.destination_daily_capacity (ERR_CAPACITY_EXHAUSTED; boundary: reaching exactly capacity blocks the NEXT hold)"
          - "start_min >= service_window_start_min and end_min <= service_window_end_min (ERR_OUTSIDE_SERVICE_WINDOW)"
        side_effects:
          - "Visit created (status PENDING) under the case itinerary bound to this slot"
          - "Itinerary.provisional_total_cents / final_total_cents recomputed"
          - "VisitCase.version += 1"

      - from: HELD
        to: CONFIRMED
        trigger: "POST /slots/{id}/confirm"
        actor: IntakeCoordinator
        preconditions:
          - "AppointmentSlot.status == HELD (ERR_INVALID_STATE)"
          - "FinancialClearance of the owning case is CLEARED or WAIVED (ERR_FINANCIAL_CLEARANCE_REQUIRED)"
        side_effects:
          - "Visit.status PENDING -> CONFIRMED"

      - from: HELD
        to: RELEASED
        trigger: "POST /slots/{id}/release or cascade from withdrawal/forfeiture"
        actor: IntakeCoordinator | system
        preconditions:
          - "AppointmentSlot.status == HELD (ERR_INVALID_STATE; CONFIRMED slots must be cancelled via visit cancellation)"
        side_effects:
          - "Visit.status PENDING -> CANCELLED"
          - "Itinerary.revision += 1; totals recomputed"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel (visit-level cancellation)"
        actor: IntakeCoordinator
        preconditions:
          - "Visit.status == CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "AppointmentSlot.status -> CANCELLED (terminal; slot cannot be reused)"
          - "Itinerary.revision += 1; totals recomputed (staleness: existing ISSUED EstimateLetter becomes is_stale = true)"

  - entity: Visit
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /slots/{id}/confirm (slot confirmation drives visit)"
        actor: IntakeCoordinator
        preconditions: ["See AppointmentSlot HELD -> CONFIRMED"]
        side_effects: []

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: IntakeCoordinator
        preconditions:
          - "Visit.status == CONFIRMED (ERR_INVALID_STATE)"
          - "Same-day sequencing: no other Visit on the same itinerary + slot_date with a lower sequencing_priority still in CONFIRMED (ERR_SEQUENCING_VIOLATION; ties broken by created_at ASC)"
          - "Logical clock date >= slot_date (ERR_VISIT_NOT_DUE)"
        side_effects:
          - "For REMOTE_CONSULT cases: VisitCase.fatigue_score = max(0, fatigue_score - 3) (compensating decrement)"
          - "Re-evaluate VisitCase auto-completion"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (logical clock advanced past slot_date end-of-day with visit still CONFIRMED) or POST /visits/{id}/mark-no-show"
        actor: IntakeCoordinator | system
        preconditions:
          - "Visit.status == CONFIRMED"
          - "Logical clock date > slot_date (ERR_VISIT_NOT_DUE otherwise)"
        side_effects:
          - "Re-evaluate VisitCase auto-completion"

      - from: PENDING
        to: CANCELLED
        trigger: "Cascade from slot release"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: IntakeCoordinator
        preconditions:
          - "Visit.status == CONFIRMED"
        side_effects:
          - "AppointmentSlot -> CANCELLED; Itinerary.revision += 1"

  - entity: Itinerary
    initial_state: DRAFT
    terminal_states: [LOCKED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /itineraries/{id}/confirm"
        actor: IntakeCoordinator
        preconditions: ["See VisitCase SCHEDULING -> SCHEDULED"]
        side_effects: ["VisitCase -> SCHEDULED"]

      - from: CONFIRMED
        to: LOCKED
        trigger: "POST /itineraries/{id}/lock"
        actor: IntakeCoordinator
        preconditions:
          - "Itinerary.status == CONFIRMED"
          - "VisitCase.status == READY_TO_TRAVEL (travel authorized)"
        side_effects:
          - "All subsequent rescheduling rejected (ERR_INVALID_STATE); locked itineraries are immutable"

      - from: DRAFT
        to: CANCELLED
        trigger: "Cascade from case withdrawal or clearance forfeiture"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LogisticsArrangement
    initial_state: REQUESTED
    terminal_states: [BOOKED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: BOOKED
        trigger: "POST /visit-cases/{id}/logistics/{id}/confirm"
        actor: LogisticsCoordinator
        preconditions:
          - "LogisticsArrangement.status == REQUESTED (ERR_INVALID_STATE)"
          - "For INTERPRETER: Patient.requires_interpreter == true (ERR_INTERPRETER_NOT_REQUIRED)"
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /visit-cases/{id}/logistics/{id}/cancel or cascade"
        actor: LogisticsCoordinator | system
        preconditions: []
        side_effects: []

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /visit-cases/{id}/logistics/{id}/cancel or cascade"
        actor: LogisticsCoordinator | system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: slot-hold-stale-case
    parent_entity: VisitCase
    write_endpoint: "POST /visit-cases/{id}/slot-holds"
    occ_field: expected_case_version
    description: |
      Placing a slot hold against a VisitCase whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      coordinator has just booked or released a slot on the same case (each of
      which legitimately advances the case version under the bundling rules) and
      the current writer's view of the itinerary is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: itinerary_total_estimate
    trigger: "slot hold placed, slot released, visit cancelled, estimate letter issuance"
    algorithm: tiered_pricing
    formula: |
      Dual-variant totals over the visit set V = {Visit under itinerary where status IN
      {PENDING, CONFIRMED, COMPLETED}} (CANCELLED and NO_SHOW excluded).

      Per-visit effective price (mode (a): >=3 inputs, non-linear interaction):
        bundled_count = |V| at evaluation time
        discount_pct =
          0.00 if bundled_count <= 2
          0.05 if bundled_count == 3
          0.10 if bundled_count >= 4
        international_multiplier = 1.20 if Patient.is_international else 1.00
        effective_price(visit) = round_half_up(
          visit.listed_price_cents * (1 - discount_pct) * international_multiplier
        ) to whole cents

      Provisional variant: per-visit prices are rounded FIRST, then summed:
        provisional_total_cents = sum( effective_price(v) for v in V )
      Final variant: sum raw values FIRST, then round once at the end:
        final_total_cents = round_half_up(
          sum( v.listed_price_cents * (1 - discount_pct) * international_multiplier for v in V )
        )
      The rounding-order difference (mode (b)) means provisional >= final whenever any
      per-visit product has a fractional cent, and the two totals diverge.
    constants:
      DISCOUNT_TIER_3: 0.05
      DISCOUNT_TIER_4: 0.10
      INTERNATIONAL_MULTIPLIER: 1.20
    precision: "whole cents, round_half_up; provisional rounds per-visit then sums, final sums then rounds once"
    variants:
      - name: provisional
        when: "Shown on estimate letters as the conservative (higher) quote; recomputed on every itinerary mutation"
        difference: "Rounds each visit price to whole cents before summing"
      - name: final
        when: "Used for settlement billing after visits complete"
        difference: "Sums unrounded per-visit products and rounds the grand total once"

  - name: deposit_estimate
    trigger: "case review approval (APPROVE) and estimate letter issuance"
    algorithm: threshold
    formula: |
      Tiered deposit on the FINAL estimate, with boundary >= semantics (mode (a)):
        final_est = itinerary.final_total_cents at evaluation time
        if final_est >= 500000:  deposit = round_half_up(final_est * 0.30)
        elif final_est >= 100000: deposit = round_half_up(final_est * 0.20)
        else:                      deposit = round_half_up(final_est * 0.10)
      At approval time the itinerary has no visits; the base estimate used is
      care_team_size * BASE_VISIT_CENTS (150000) as the provisional seed, so the tier
      is well-defined even with an empty itinerary. International patients use the same
      tiers on the multiplied estimate. Boundary: exactly 500000 takes the 30% tier;
      exactly 100000 takes the 20% tier.
    constants:
      TIER_HIGH_FLOOR_CENTS: 500000
      TIER_MID_FLOOR_CENTS: 100000
      RATE_HIGH: 0.30
      RATE_MID: 0.20
      RATE_LOW: 0.10
      BASE_VISIT_CENTS: 150000
    precision: "whole cents, round_half_up"

  - name: capacity_utilization
    trigger: "slot hold placement (precondition evaluation)"
    algorithm: threshold
    formula: |
      used(svc, date) = count(AppointmentSlot where specialty_service_id == svc,
        slot_date == date, status IN {HELD, CONFIRMED})
      A hold is allowed iff used < destination_daily_capacity (strict <).
      Note the aggregate-capacity interval semantics: two HELD slots on the same date
      count 2 against the pool regardless of their time intervals, while the
      half-open overlap rule independently forbids time collisions.
    constants: {}
    precision: "integer counts"

  - name: slot_interval_overlap
    trigger: "slot creation and hold placement"
    algorithm: interval_merge
    formula: |
      Two slots A, B on the same service+date overlap iff
        A.start_min < B.end_min AND B.start_min < A.end_min
      (half-open [start, end) semantics). Adjacency is legal: A.end_min == B.start_min
      does NOT overlap. Slots on different services or different dates never overlap.
    constants: {}
    precision: "integer minutes"

  - name: review_fatigue_accumulation
    trigger: "MedicalRecord verify (increment), REMOTE_CONSULT visit complete (decrement), every increment re-checks withdrawal threshold"
    algorithm: aggregation
    formula: |
      On MedicalRecord -> VERIFIED: fatigue_score += 2 for each non-terminal VisitCase
      under the same referral.
      On REMOTE_CONSULT Visit -> COMPLETED: fatigue_score = max(0, fatigue_score - 3).
      After any increment: if fatigue_score >= 10 (SUM threshold, >= semantics) and
      VisitCase.status IN {INTAKE, AWAITING_FINANCIAL, FINANCIAL_CLEARED, SCHEDULING},
      auto-transition VisitCase -> WITHDRAWN with the standard release cascade.
      Circular-look resolution (mode (c)): the withdrawal check runs AFTER the
      increment lands; the compensating decrement on remote consult completion is
      evaluated only for cases still in a non-terminal state (a completed case is
      terminal and never withdraws).
    constants:
      VERIFY_INCREMENT: 2
      REMOTE_CONSULT_DECREMENT: 3
      WITHDRAWAL_THRESHOLD: 10
    precision: "integer points, floor 0"

  - name: itinerary_window_compression
    trigger: "itinerary confirmation"
    algorithm: aggregation
    formula: |
      span_days = count(distinct slot_date over Visits with status IN {PENDING, CONFIRMED}
      under the itinerary). Confirmation requires span_days <= 5 (boundary: exactly 5
      distinct dates is allowed; 6 is rejected with ERR_ITINERARY_WINDOW_EXCEEDED).
    constants:
      MAX_WINDOW_DAYS: 5
    precision: "integer days"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, enums valid, types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 5
    category: state
    check: "Entity state precondition for the transition (per state_machines)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_case_version matches VisitCase.version on slot-hold"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /visit-cases/{id}/slot-holds"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: CaseReviewer must not be the assigned IntakeCoordinator of the case; MedicalRecord verifier must not be its receiving coordinator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /visit-cases/{id}/reviews, POST /referrals/{id}/medical-records/{id}/verify"

  - priority: 8
    category: business_safety
    check: "INTERPRETER arrangement requires Patient.requires_interpreter == true"
    error_id: ERR_INTERPRETER_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /visit-cases/{id}/logistics"

  - priority: 9
    category: business_referential
    check: "care_team_specialty_ids all exist; DESTINATION cases 2..4 distinct, remote exactly 1; referral exists and is IN_REVIEW"
    error_id: ERR_INVALID_CARE_TEAM
    http_status: 422
    applies_to: "POST /visit-cases"

  - priority: 10
    category: business_referential
    check: "Remote products (SECOND_OPINION, REMOTE_CONSULT) may only target services with supports_remote_products == true"
    error_id: ERR_REMOTE_PRODUCT_UNSUPPORTED
    http_status: 422
    applies_to: "POST /visit-cases"

  - priority: 11
    category: business_temporal
    check: "Slot window inside service window; slot_date not in the past (logical clock)"
    error_id: ERR_OUTSIDE_SERVICE_WINDOW
    http_status: 422
    applies_to: "POST /specialty-services/{id}/slots"

  - priority: 12
    category: business_temporal
    check: "Half-open interval overlap against HELD/CONFIRMED slots on same service+date"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /specialty-services/{id}/slots, POST /visit-cases/{id}/slot-holds"

  - priority: 13
    category: business_temporal
    check: "Itinerary spans <= 5 distinct dates at confirmation"
    error_id: ERR_ITINERARY_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /itineraries/{id}/confirm"

  - priority: 14
    category: business_constraint
    check: "IMAGING visit_type only on services with supports_imaging == true"
    error_id: ERR_IMAGING_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /visit-cases/{id}/slot-holds"

  - priority: 15
    category: business_constraint
    check: "Capacity pool: used(HELD+CONFIRMED) < destination_daily_capacity"
    error_id: ERR_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /visit-cases/{id}/slot-holds"

  - priority: 16
    category: business_fiscal
    check: "Financial clearance must be CLEARED or WAIVED before slot confirmation / itinerary confirmation"
    error_id: ERR_FINANCIAL_CLEARANCE_REQUIRED
    http_status: 402
    applies_to: "POST /slots/{id}/confirm, POST /itineraries/{id}/confirm"

  - priority: 17
    category: business_fiscal
    check: "International patients may not receive deposit waivers"
    error_id: ERR_INTERNATIONAL_WAIVER_FORBIDDEN
    http_status: 422
    applies_to: "POST /visit-cases/{id}/financial-clearance/waive"

  - priority: 18
    category: business_fiscal
    check: "Settlement requires >= 3 COMPLETED visits and case COMPLETED"
    error_id: ERR_MINIMUM_COMPLETED_VISITS
    http_status: 409
    applies_to: "POST /visit-cases/{id}/billing-transactions (SETTLEMENT)"

  - priority: 19
    category: business_fiscal
    check: "Authorize-travel requires a fresh (non-stale) ISSUED estimate letter"
    error_id: ERR_STALE_ESTIMATE_LETTER
    http_status: 409
    applies_to: "POST /visit-cases/{id}/authorize-travel"

  - priority: 20
    category: business_referential
    check: "Referral closure requires both RESULTS_TO_REFERRER and CONTINUITY_PLAN communications"
    error_id: ERR_RESULTS_NOT_TRANSMITTED
    http_status: 409
    applies_to: "system closure evaluation"

  - priority: 21
    category: business_safety
    check: "Review fatigue guard: reviewer may not record reviews on more than 3 distinct dates per case"
    error_id: ERR_FATIGUE_GUARD
    http_status: 409
    applies_to: "POST /visit-cases/{id}/reviews"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no retroactive transitions fire"]

  # --- Specialty Services ---
  - method: POST
    path: "/specialty-services"
    description: "Register a specialty service with its destination capacity pool"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, destination_daily_capacity, service_window_start_min, service_window_end_min, "supports_imaging?", "supports_remote_products?"]
    output: SpecialtyService
    side_effects: []

  - method: GET
    path: "/specialty-services"
    description: "List specialty services"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: "SpecialtyService[]"
    side_effects: []

  - method: GET
    path: "/specialty-services/{id}"
    description: "Get one specialty service"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: SpecialtyService
    side_effects: []

  # --- Slots ---
  - method: POST
    path: "/specialty-services/{id}/slots"
    description: "Open an appointment slot in the service pool"
    roles: [PlatformAdmin]
    code: 201
    input: [slot_date, start_min, end_min]
    output: AppointmentSlot
    side_effects: ["Overlap + window validations"]

  - method: GET
    path: "/specialty-services/{id}/slots"
    description: "List slots for a service (reverse-reachability for AppointmentSlot.specialty_service_id)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["slot_date?", "status?", "limit?", "offset?"]
    output: "AppointmentSlot[]"
    side_effects: []

  - method: GET
    path: "/slots/{id}"
    description: "Get one slot"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: []

  - method: POST
    path: "/slots/{id}/confirm"
    description: "Confirm a HELD slot; drives its Visit PENDING -> CONFIRMED"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["Visit.status -> CONFIRMED"]

  - method: POST
    path: "/slots/{id}/release"
    description: "Release a HELD slot back to OPEN pool (terminal RELEASED)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["Visit -> CANCELLED; Itinerary.revision += 1; totals recomputed"]

  # --- Referrals & intake ---
  - method: POST
    path: "/referrals"
    description: "Submit a remote referral; cascade-creates the Patient record"
    roles: [IntakeCoordinator]
    code: 201
    input: [patient, referring_physician_name, referring_physician_contact, reason]
    output: Referral
    side_effects: ["Patient created; Referral.status = SUBMITTED"]

  - method: GET
    path: "/referrals"
    description: "List referrals"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: GET
    path: "/referrals/{id}"
    description: "Get one referral"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals/{id}/patient"
    description: "Reverse-reachability: fetch the Patient created by this referral (array of 0..1)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Get one patient"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/referrals/{id}/medical-records"
    description: "Register receipt of a medical record (SUBMITTED -> RECORDS_PENDING on first receipt)"
    roles: [IntakeCoordinator]
    code: 201
    input: [record_type, source_facility]
    output: MedicalRecord
    side_effects: ["Referral SUBMITTED -> RECORDS_PENDING"]

  - method: GET
    path: "/referrals/{id}/medical-records"
    description: "List records of a referral (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MedicalRecord[]"
    side_effects: []

  - method: GET
    path: "/medical-records/{id}"
    description: "Get one medical record"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: []

  - method: POST
    path: "/referrals/{id}/medical-records/{id}/verify"
    description: "Verify a record; segregation-of-duties vs receiving coordinator; fatigue +2 cascade"
    roles: [CaseReviewer]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: ["fatigue_score += 2 on non-terminal cases of the referral"]

  - method: POST
    path: "/referrals/{id}/medical-records/{id}/reject"
    description: "Reject a record"
    roles: [CaseReviewer]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: ["Referral stays RECORDS_PENDING"]

  - method: POST
    path: "/referrals/{id}/submit-review"
    description: "Move referral RECORDS_PENDING -> IN_REVIEW (requires >= 1 VERIFIED record)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: []

  # --- Visit Cases ---
  - method: POST
    path: "/visit-cases"
    description: "Open a visit case against an IN_REVIEW referral with its care team"
    roles: [IntakeCoordinator]
    code: 201
    input: [referral_id, case_type, care_team_specialty_ids]
    output: VisitCase
    side_effects: ["assigned_coordinator_id = X-User-ID; status = INTAKE"]

  - method: GET
    path: "/visit-cases"
    description: "List visit cases (filtered list reverse-reachability by referral_id)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["referral_id?", "status?", "limit?", "offset?"]
    output: "VisitCase[]"
    side_effects: []

  - method: GET
    path: "/visit-cases/{id}"
    description: "Get one visit case"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: VisitCase
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/reviews"
    description: "Record a case review (APPROVE creates itinerary + clearance; DECLINE declines)"
    roles: [CaseReviewer]
    code: 201
    input: [outcome, notes]
    output: CaseReview
    side_effects: ["Per VisitCase state machine; reviewer_id = X-User-ID"]

  - method: GET
    path: "/visit-cases/{id}/reviews"
    description: "List reviews of a case (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CaseReview[]"
    side_effects: []

  - method: GET
    path: "/reviews/{id}"
    description: "Get one case review"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: CaseReview
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/withdraw"
    description: "Withdraw a case (manual)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: VisitCase
    side_effects: ["Release cascade per state machine"]

  - method: POST
    path: "/visit-cases/{id}/authorize-travel"
    description: "Authorize travel once scheduled, with fresh estimate letter and interpreter booked"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: VisitCase
    side_effects: ["VisitCase SCHEDULED -> READY_TO_TRAVEL"]

  # --- Financial ---
  - method: GET
    path: "/visit-cases/{id}/financial-clearance"
    description: "Fetch the case's clearance (array of 0..1; reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: "FinancialClearance[]"
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/financial-clearance/waive"
    description: "Waive the deposit (domestic patients only)"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: FinancialClearance
    side_effects: ["Clearance PENDING -> WAIVED; case bubbles to FINANCIAL_CLEARED"]

  - method: POST
    path: "/visit-cases/{id}/financial-clearance/reopen"
    description: "Reopen a CLEARED clearance (insurance verification reversal)"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: FinancialClearance
    side_effects: ["Clearance CLEARED -> PENDING"]

  - method: POST
    path: "/visit-cases/{id}/financial-clearance/forfeit"
    description: "Forfeit a PENDING clearance past the deposit deadline; depth-3 release cascade"
    roles: [FinancialCounselor]
    code: 200
    input: []
    output: FinancialClearance
    side_effects: ["Clearance -> FORFEITED; held slots RELEASED; visits CANCELLED; itinerary CANCELLED; case WITHDRAWN"]

  - method: GET
    path: "/financial-clearances/{id}"
    description: "Get one financial clearance"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: FinancialClearance
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/estimate-letters"
    description: "Issue an estimate letter snapshotting itinerary totals and deposit"
    roles: [FinancialCounselor]
    code: 201
    input: []
    output: EstimateLetter
    side_effects: ["Prior ISSUED letter -> SUPERSEDED; FinancialClearance.required_deposit_cents updated"]

  - method: GET
    path: "/visit-cases/{id}/estimate-letters"
    description: "List estimate letters of a case (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "EstimateLetter[]"
    side_effects: []

  - method: GET
    path: "/estimate-letters/{id}"
    description: "Get one estimate letter"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: EstimateLetter
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/billing-transactions"
    description: "Record a DEPOSIT / SETTLEMENT / REFUND transaction"
    roles: [FinancialCounselor]
    code: 201
    input: [txn_type, amount_cents]
    output: BillingTransaction
    side_effects: ["DEPOSIT: deposit_paid_cents += amount; threshold check -> CLEARED. REFUND: source DEPOSIT voided, deposit_paid_cents -= amount. SETTLEMENT: amount overwritten per calc."]

  - method: GET
    path: "/visit-cases/{id}/billing-transactions"
    description: "List billing transactions (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["txn_type?", "limit?", "offset?"]
    output: "BillingTransaction[]"
    side_effects: []

  - method: GET
    path: "/billing-transactions/{id}"
    description: "Get one billing transaction"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: BillingTransaction
    side_effects: []

  - method: GET
    path: "/billing-transactions"
    description: "Filtered-list reverse-reachability over BillingTransaction FKs (financial_clearance_id)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["financial_clearance_id?", "txn_type?", "limit?", "offset?"]
    output: "BillingTransaction[]"
    side_effects: []

  # --- Itinerary / bundling ---
  - method: GET
    path: "/visit-cases/{id}/itinerary"
    description: "Fetch the case itinerary (array of 0..1; reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: "Itinerary[]"
    side_effects: []

  - method: GET
    path: "/itineraries/{id}"
    description: "Get one itinerary"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: Itinerary
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/slot-holds"
    description: "Hold an OPEN slot for this case (OCC-guarded); creates the PENDING Visit"
    roles: [IntakeCoordinator]
    code: 201
    input: [appointment_slot_id, visit_type, listed_price_cents, sequencing_priority, expected_case_version]
    output: Visit
    side_effects: ["Slot OPEN -> HELD; Visit created PENDING; case FINANCIAL_CLEARED -> SCHEDULING on first hold; VisitCase.version += 1; totals recomputed"]

  - method: POST
    path: "/itineraries/{id}/confirm"
    description: "Confirm the itinerary (all visits confirmed, clearance ok, window <= 5 days)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Itinerary
    side_effects: ["Itinerary DRAFT -> CONFIRMED; VisitCase SCHEDULING -> SCHEDULED"]

  - method: POST
    path: "/itineraries/{id}/lock"
    description: "Lock a CONFIRMED itinerary after travel authorization"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Itinerary
    side_effects: ["Itinerary -> LOCKED; further rescheduling rejected"]

  - method: GET
    path: "/itineraries/{id}/visits"
    description: "List visits of an itinerary (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []

  - method: GET
    path: "/visits/{id}"
    description: "Get one visit"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/visits"
    description: "Filtered-list reverse-reachability over Visit FKs (visit_case_id, appointment_slot_id, specialty_service_id)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["visit_case_id?", "appointment_slot_id?", "specialty_service_id?", "status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []

  - method: POST
    path: "/visits/{id}/complete"
    description: "Mark a CONFIRMED visit completed (sequencing guard)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: ["REMOTE_CONSULT case: fatigue -3; case completion re-evaluation"]

  - method: POST
    path: "/visits/{id}/mark-no-show"
    description: "Mark a CONFIRMED visit as no-show"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: ["Case completion re-evaluation"]

  - method: POST
    path: "/visits/{id}/cancel"
    description: "Cancel a CONFIRMED visit; slot -> CANCELLED; itinerary revision += 1"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: ["Slot -> CANCELLED; totals recomputed; estimate letters go stale"]

  # --- Logistics ---
  - method: POST
    path: "/visit-cases/{id}/logistics"
    description: "Request a travel/lodging/interpreter arrangement"
    roles: [LogisticsCoordinator]
    code: 201
    input: [arrangement_type, details, companion_count]
    output: LogisticsArrangement
    side_effects: []

  - method: GET
    path: "/visit-cases/{id}/logistics"
    description: "List arrangements of a case (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["arrangement_type?", "status?", "limit?", "offset?"]
    output: "LogisticsArrangement[]"
    side_effects: []

  - method: GET
    path: "/logistics-arrangements/{id}"
    description: "Get one logistics arrangement"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: LogisticsArrangement
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/logistics/{id}/confirm"
    description: "Book a REQUESTED arrangement"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: LogisticsArrangement
    side_effects: []

  - method: POST
    path: "/visit-cases/{id}/logistics/{id}/cancel"
    description: "Cancel a REQUESTED or BOOKED arrangement"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: LogisticsArrangement
    side_effects: []

  # --- Communications ---
  - method: POST
    path: "/visit-cases/{id}/communications"
    description: "Send results to referrer or set the continuity plan"
    roles: [CaseReviewer]
    code: 201
    input: [comm_type, body, "continuity_plan?"]
    output: Communication
    side_effects: ["Re-evaluate referral closure when case COMPLETED"]

  - method: GET
    path: "/visit-cases/{id}/communications"
    description: "List communications of a case (reverse-reachability)"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: ["comm_type?", "limit?", "offset?"]
    output: "Communication[]"
    side_effects: []

  - method: GET
    path: "/communications/{id}"
    description: "Get one communication"
    roles: [PlatformAdmin, IntakeCoordinator, CaseReviewer, FinancialCounselor, LogisticsCoordinator]
    code: 200
    input: []
    output: Communication
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, or type mismatch" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that permits this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match VisitCase.version on slot hold" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer is the assigned coordinator of the case, or record verifier is its receiving coordinator" }
  - { id: ERR_NO_VERIFIED_RECORDS, http: 409, condition: "submit-review with zero VERIFIED medical records" }
  - { id: ERR_REFERRAL_NOT_IN_REVIEW, http: 409, condition: "VisitCase creation or review against a referral not IN_REVIEW" }
  - { id: ERR_INVALID_CARE_TEAM, http: 422, condition: "Care team size/composition violates case-type rules or references unknown services" }
  - { id: ERR_REMOTE_PRODUCT_UNSUPPORTED, http: 422, condition: "Remote product case targets a service with supports_remote_products == false" }
  - { id: ERR_OUTSIDE_SERVICE_WINDOW, http: 422, condition: "Slot outside the service's daily window or in the past" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open interval collision with a HELD/CONFIRMED slot on the same service+date" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Hold attempted on a slot not OPEN" }
  - { id: ERR_CAPACITY_EXHAUSTED, http: 409, condition: "HELD+CONFIRMED count already equals destination_daily_capacity" }
  - { id: ERR_IMAGING_NOT_SUPPORTED, http: 422, condition: "IMAGING visit type on a service without supports_imaging" }
  - { id: ERR_ITINERARY_WINDOW_EXCEEDED, http: 422, condition: "Itinerary spans more than 5 distinct dates" }
  - { id: ERR_UNCONFIRMED_VISITS_REMAIN, http: 409, condition: "Itinerary confirmation with PENDING visits remaining" }
  - { id: ERR_FINANCIAL_CLEARANCE_REQUIRED, http: 402, condition: "Operation requires clearance CLEARED or WAIVED" }
  - { id: ERR_INTERNATIONAL_WAIVER_FORBIDDEN, http: 422, condition: "Deposit waiver requested for an international patient" }
  - { id: ERR_DEADLINE_NOT_BREACHED, http: 409, condition: "Forfeit attempted before the deposit deadline has passed" }
  - { id: ERR_CLEARANCE_HOLD_RELEASED, http: 409, condition: "Reopen attempted after holds were released (forfeiture)" }
  - { id: ERR_MINIMUM_COMPLETED_VISITS, http: 409, condition: "Settlement with fewer than 3 COMPLETED visits" }
  - { id: ERR_STALE_ESTIMATE_LETTER, http: 409, condition: "Authorize-travel with no fresh ISSUED estimate letter" }
  - { id: ERR_INTERPRETER_NOT_BOOKED, http: 409, condition: "Authorize-travel while a required interpreter arrangement is not BOOKED" }
  - { id: ERR_INTERPRETER_NOT_REQUIRED, http: 422, condition: "Interpreter arrangement requested for a patient who does not require one" }
  - { id: ERR_RESULTS_NOT_TRANSMITTED, http: 409, condition: "Referral closure attempted without a RESULTS_TO_REFERRER communication" }
  - { id: ERR_CONTINUITY_PLAN_MISSING, http: 409, condition: "Referral closure attempted without a CONTINUITY_PLAN communication" }
  - { id: ERR_SEQUENCING_VIOLATION, http: 409, condition: "Completing a visit while a lower-priority same-day visit is still CONFIRMED" }
  - { id: ERR_VISIT_NOT_DUE, http: 409, condition: "Complete/no-show attempted before the slot date (logical clock)" }
  - { id: ERR_FATIGUE_GUARD, http: 409, condition: "Reviewer would exceed 3 distinct review dates on this case" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator; owns service catalog, slots, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /specialty-services"
      - "POST /specialty-services/{id}/slots"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: IntakeCoordinator
    description: "Destination-medicine intake coordinator; owns referrals, cases, booking, travel authorization; entity-backed identity not tied to a persisted entity"
    identity: opaque
    exclusive_operations:
      - "POST /referrals"
      - "POST /referrals/{id}/medical-records"
      - "POST /referrals/{id}/submit-review"
      - "POST /visit-cases"
      - "POST /visit-cases/{id}/withdraw"
      - "POST /visit-cases/{id}/authorize-travel"
      - "POST /visit-cases/{id}/slot-holds"
      - "POST /slots/{id}/confirm"
      - "POST /slots/{id}/release"
      - "POST /itineraries/{id}/confirm"
      - "POST /itineraries/{id}/lock"
      - "POST /visits/{id}/complete"
      - "POST /visits/{id}/mark-no-show"
      - "POST /visits/{id}/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: CaseReviewer
    description: "Physician reviewer; verifies records, reviews cases, sends communications; segregation-of-duties against the assigned coordinator"
    identity: opaque
    exclusive_operations:
      - "POST /referrals/{id}/medical-records/{rid}/verify"
      - "POST /referrals/{id}/medical-records/{rid}/reject"
      - "POST /visit-cases/{id}/reviews"
      - "POST /visit-cases/{id}/communications"
    shared_operations:
      - "All GET endpoints"

  - name: FinancialCounselor
    description: "Financial counselor; owns estimate letters, deposits, waivers, forfeits, settlements"
    identity: opaque
    exclusive_operations:
      - "POST /visit-cases/{id}/estimate-letters"
      - "POST /visit-cases/{id}/financial-clearance/waive"
      - "POST /visit-cases/{id}/financial-clearance/reopen"
      - "POST /visit-cases/{id}/financial-clearance/forfeit"
      - "POST /visit-cases/{id}/billing-transactions"
    shared_operations:
      - "All GET endpoints"

  - name: LogisticsCoordinator
    description: "Travel/lodging/interpreter coordinator"
    identity: opaque
    exclusive_operations:
      - "POST /visit-cases/{id}/logistics"
      - "POST /visit-cases/{id}/logistics/{aid}/confirm"
      - "POST /visit-cases/{id}/logistics/{aid}/cancel"
    shared_operations:
      - "All GET endpoints"
