            - "final call: HTTP 200 and DataPacket.${pkb_id}.qc_status == PASSED (equality at exactly 70.00 passes)"
            - "qc_score is NOT 70 or 69 (the score keeps 2 decimals) and NOT 69.60/70.10 (the FARM_RECORD source weight is 0.6, not 0.8 or 1.0)"
            - "completeness_status is STILL PARTIAL after the successful PASS (56.00 < 85.00), so the boundary crossed is the qc one only"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_creation_gated_on_baseline_status_and_ownership
        grounds:
          - validations[priority 20 ERR_BASELINE_NOT_APPROVED]
          - validations[priority 20 ERR_BASELINE_ENROLLMENT_MISMATCH]
          - state_machines.Baseline
          - endpoints[POST /quantification-runs]
          - concurrency_rules[run-create-stale-enrollment]
        distinguishing_aspect: |
          Creating a quantification run is legal only if a THIRD entity is in the right state and
          belongs to the right parent: the named Baseline must be APPROVED and must belong to the
          same Enrollment. E11 deliberately owns a REJECTED baseline as well as its APPROVED one,
          and E12 owns an APPROVED baseline of its own, so the same endpoint answers
          ERR_BASELINE_NOT_APPROVED, ERR_BASELINE_ENROLLMENT_MISMATCH and 201 depending only on
          which foreign entity is named - the enrollment, the packet set and the OCC token are
          identical in all three calls.
