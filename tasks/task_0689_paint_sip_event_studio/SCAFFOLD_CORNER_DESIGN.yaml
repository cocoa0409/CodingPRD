# =============================================================================
# §1.9 Scaffold Corner Design (Breadth coverage index)
# Paint & Sip Event Studio — enumerates testable claims not covered by §1.8.
# Default logical clock: 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_studio_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Studio, endpoints]
        distinguishing_aspect: "POST /studio-ops/studios with name + room_capacity_seats returns 201, status defaults ACTIVE, and system mints id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room A", room_capacity_seats: 25 }
              as: StudioManager
              captures: { sid: $.data.id, v: $.data.version }
          trigger:
            - call: "GET /studio-ops/studios/${sid}"
              payload: {}
              as: StudioManager
          assert:
            - "Studio.${sid}.status == ACTIVE"
            - "Studio.${sid}.room_capacity_seats == 25"
            - "Studio.${sid}.version == 1 and id is a server-minted UUID."

      - name: create_event_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.StudioEvent, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /studio-ops/events omitting price_cents_per_seat returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["A studio exists."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room B", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "NoPrice", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response is 400 with data.error_id == ERR_VALIDATION (price_cents_per_seat missing)."

      - name: get_event_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.StudioEvent, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /studio-ops/events/{unknown} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /studio-ops/events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response is 404 with data.error_id == ERR_NOT_FOUND."

      - name: event_default_fields_applied
        claim_type: Defaults
        grounds: [entities.StudioEvent.fields.kit_fee_cents, entities.StudioEvent.fields.byob_allowed, entities.StudioEvent.fields.fundraiser_donation_pct]
        distinguishing_aspect: "Omitting kit_fee_cents/byob_allowed/min_age/fundraiser_donation_pct applies defaults 0/false/0/0 and status DRAFT."
        test_recipe:
          setup: ["A studio exists."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room C", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Defaults", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
          assert:
            - "StudioEvent.${eid}.kit_fee_cents == 0, byob_allowed == false, min_age == 0, fundraiser_donation_pct == 0, status == DRAFT."

      - name: event_computed_seat_fields_ignore_input
        claim_type: Computed Fields
        grounds: [entities.StudioEvent.fields.seats_available, entities.StudioEvent.fields.seats_reserved, calculations.event_seat_ledger]
        distinguishing_aspect: "seats_reserved/seats_available are computed; a fresh event has seats_reserved==0 and seats_available==seats_capacity regardless of any client-supplied value."
        test_recipe:
          setup: ["A studio exists."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room D", room_capacity_seats: 12 }
              as: StudioManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Ledger", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 12, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
          assert:
            - "StudioEvent.${eid}.seats_reserved == 0 and seats_available == 12 and walk_in_seats == 0."

      - name: attendee_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Attendee]
        distinguishing_aspect: "Attendee has common_fields:false: it carries only id and created_at (no version, updated_at) and has no update endpoint."
        test_recipe:
          setup: ["A reservation exists to own the attendee."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room E", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Att", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Att Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "att@x.com", full_name: "Att", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 1, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${rid}", full_name: "A1", age_years: 30, waiver_signed: true }
              as: Customer
              as_user_id: "${cid}"
              captures: { att_id: $.data.id }
          assert:
            - "Attendee.${att_id} response carries id and created_at but no version/updated_at field."

      - name: duplicate_customer_email_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.email, "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "Registering a second customer with an email already used (case-insensitive) returns 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["A customer dup@x.com already registered."]
          setup_api_calls:
            - call: "POST /studio-ops/customers"
              payload: { email: "dup@x.com", full_name: "First", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /studio-ops/customers"
              payload: { email: "DUP@x.com", full_name: "Second", birthdate: "1991-01-01T00:00:00Z" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_DUPLICATE_RESOURCE."

      - name: reservation_reference_not_found_bad_customer
        claim_type: Parent Relationships
        grounds: [entities.Reservation.fields.customer_id, "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Reservation create with a non-existent customer_id returns 422 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["OPEN event exists; customer_id in body does not exist."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room F", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Ref", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Ref Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "00000000-0000-4000-8000-000000000abc", booking_mode: "PUBLIC", seats: 1, expected_event_version: "${ev_v}" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response is 422 with data.error_id == ERR_REFERENCE_NOT_FOUND."

      - name: list_events_paginated_envelope
        claim_type: Listing
        grounds: [entities.StudioEvent, endpoints]
        distinguishing_aspect: "GET /studio-ops/events?limit=1 returns an array response_type with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two events in one studio."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "Room G", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "E1", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "E2", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T13:00:00Z", end_utc: "2026-04-05T15:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
          trigger:
            - call: "GET /studio-ops/events?studio_id=${sid}&limit=1&offset=0"
              payload: {}
              as: StudioManager
          assert:
            - "response_type == array; meta present; total_count == 2 and has_more == true with one item returned."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_reservation_twice_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Reservation.HELD_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED reservation returns 409 ERR_INVALID_STATE; no second credit granted."
        test_recipe:
          setup: ["A HELD reservation already cancelled once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "SM1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Sm", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "SM1 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "sm1@x.com", full_name: "SM1", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 2, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
            - call: "POST /studio-ops/reservations/${rid}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /studio-ops/reservations/${rid}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "Second cancel returns 409 with data.error_id == ERR_INVALID_STATE."

      - name: open_event_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.StudioEvent.SCHEDULED_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST .../open on a DRAFT (never scheduled) event returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT event."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "SM2", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "SM2 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
          trigger:
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_INVALID_STATE."

      - name: schedule_event_without_artist_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.StudioEvent.DRAFT_to_SCHEDULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST .../schedule on a DRAFT event with no ASSIGNED artist fails the staffing precondition with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT event with no assignments."]
          setup_api_calls:
            - call: "POST /studio-ops/studios"
              payload: { name: "SM3", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "SM3 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
          trigger:
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_INVALID_STATE (no ASSIGNED artist)."

      - name: close_event_before_start_returns_not_started
        claim_type: Precondition Enforcement
        grounds: [state_machines.StudioEvent.OPEN_to_CLOSED, "errors[ERR_EVENT_NOT_STARTED]"]
        distinguishing_aspect: "POST .../close while clock now < start_utc returns 409 ERR_EVENT_NOT_STARTED."
        test_recipe:
          setup: ["OPEN event starting 2026-04-10; clock at default 2026-04-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "SM4", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "S4", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "SM4 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-10T10:00:00Z", end_utc: "2026-04-10T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio-ops/events/${eid}/close"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_EVENT_NOT_STARTED."

      - name: confirm_unpaid_reservation_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.HELD_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST .../confirm on a HELD reservation with payment_status UNPAID returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["HELD UNPAID reservation."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "SM5", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "S5", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "SM5 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "s5@x.com", full_name: "S5", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 2, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations/${rid}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_INVALID_STATE (payment_status UNPAID)."

      - name: new_reservation_initial_state_held_unpaid
        claim_type: Initial State
        grounds: [state_machines.Reservation.HELD_to_CONFIRMED, entities.Reservation.fields.status, entities.Reservation.fields.payment_status]
        distinguishing_aspect: "A freshly created reservation starts in booking status HELD and payment_status UNPAID."
        test_recipe:
          setup: ["OPEN event."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "SM6", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "S6", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "SM6 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "s6@x.com", full_name: "S6", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 1, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          assert:
            - "Reservation.${rid}.status == HELD and payment_status == UNPAID and version == 1."

  # ===========================================================================
  - section: calculations
    instances:
      - name: pricing_mid_tier_seats4_10pct
        claim_type: Constants Applied
        grounds: [calculations.reservation_pricing, entities.Reservation.fields.group_discount_pct]
        distinguishing_aspect: "Boundary on the mid tier: seats==4 selects 10% discount; 4 seats @5000 => base 20000, total 18000 (distinct from the seats>=8 instance in §1.8)."
        test_recipe:
          setup: ["OPEN event price 5000/seat, capacity 10."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "CC1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Cc", hourly_rate_cents: 0 }
              as: StudioManager
