            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_f}", home_school_id: "${sch_a}", away_school_id: "${sch_b}", starts_at: "2026-09-25T18:00:00Z", ends_at: "2026-09-25T20:00:00Z", travel_miles: 20, expected_sport_season_version: "${sv2}" }
              as: AssociationAdmin
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /athletics/contests/${c2}/forfeit"
              payload: { forfeiting_school_id: "${sch_a}" }
              as: AssociationAdmin
              captures: { forfeit_resp_status: $.data.status }
            - call: "GET /athletics/schools/${sch_a}"
              payload: {}
              as: AssociationAdmin
              captures: { sanction_now: $.data.sanction_status, forfeits_now: $.data.forfeit_count }
          assert:
            - "${forfeit_resp_status} == FORFEITED"
            - "${sanction_now} == PROBATION"
            - "${forfeits_now} == 2"
            - "Contest.${c2}.forfeiting_school_id == ${sch_a}"
            - "Contest.${c2}.result_recorded_at == 2026-09-02T09:00:00Z"
