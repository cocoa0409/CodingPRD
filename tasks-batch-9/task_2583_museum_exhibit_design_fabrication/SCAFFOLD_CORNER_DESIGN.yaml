            - "${h3} == ERR_INVALID_INTERACTIVE_STATE with HTTP 409 - FABRICATED is outside the loop, so a third submission cannot re-enter it"
            - "${st6} == FABRICATED, ${it6} == 2 and ${ver6} == 87.58 - the refused submission changed nothing"

      - name: advancing_to_installation_is_refused_while_one_pending_material_review_restricts_the_posture
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ExhibitProject.FABRICATION_to_INSTALLATION
          - calculations.project_readiness_posture
          - validations.priority_42
          - errors.ERR_PROJECT_POSTURE_RESTRICTED
        distinguishing_aspect: |
          posture is a pure function of five counters, and only TWO gates in the whole
          API demand OPEN rather than merely not-frozen: the advance to INSTALLATION
          and the closeout. The claim pins the exact membership of the pending
          counter: a spec sitting in SUBMITTED restricts, a spec sitting in
          CONSERVATOR_REVIEW still restricts, and a spec that the conservator clears
          only CONDITIONALLY does NOT restrict - CONDITIONAL is outside
          {SUBMITTED, CONSERVATOR_REVIEW}, so the gate opens even though the material
          was never unconditionally approved. Nothing about the material blocks
          anything else; the identical project passes every other precondition
          throughout.
        test_recipe:
          setup:
            - "project in FABRICATION, case C-01 APPROVED, material Powder-coated aluminium housing APPROVED, drawing SD-601 APPROVED for 142500 cents, so every non-posture precondition of the INSTALLATION advance already holds"
