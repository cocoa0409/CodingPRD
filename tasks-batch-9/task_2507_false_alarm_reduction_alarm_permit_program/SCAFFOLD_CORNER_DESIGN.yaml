            - "exactly one AlarmPermit exists for the system: GET /false-alarm-program/alarm-permits?alarm_system_id=${system1_id} returns total_count 1 with id ${permit1_id} in status ACTIVE"
            - "AlarmSystem.${system1_id}.status is still PERMITTED and its version did not change"
            - "no second PERMIT_ISSUE_FEE invoice was raised — AlarmSite.${site_id}.outstanding_balance_cents is still 5500"

