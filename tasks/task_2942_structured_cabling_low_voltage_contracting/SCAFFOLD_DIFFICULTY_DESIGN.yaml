        distinguishing_aspect: |
          A different category pair from link_not_recorded_rejects_before_segregation_of_duties:
          business_safety (priority 80, ERR_PLENUM_RATING_REQUIRED, 422) versus
          business_constraint (priority 185, ERR_PATHWAY_FILL_EXCEEDED, 422) on POST
          /cabling/link-routes. The candidate is a CMR-jacketed CAT6 routed into an in-plenum
          EMT_CONDUIT whose allowed area is 53.00 sq mm against a 95.03 sq mm cable, so the fill
          rule is violated too. Both errors are 422, so only the error_id distinguishes them and
          the fire-safety rule must answer.
