  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - entities.CertificationCycle.fields.submission_window_open
        distinguishing_aspect: "Interval semantics: half-open [open, close) on the CertificationCycle resource timeline — a new cycle whose open EQUALS an existing cycle's close is adjacency, not overlap (accepted), while open one day earlier collides (409) — a different geometry than the assessment-center slot pools."
        test_recipe:
          setup:
            - "Empty database; clock at default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "NB-A", components: [ { code: "CKA", kind: "ASSESSMENT", weight: 0.40 }, { code: "P1", kind: "PORTFOLIO", weight: 0.20 }, { code: "P2", kind: "PORTFOLIO", weight: 0.20 }, { code: "P3", kind: "PORTFOLIO", weight: 0.20 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75, max_attempts_per_component: 2 }
              as: BoardAdministrator
              captures: { cyc_a: $.data.id }
          trigger:
            - call: "POST /cycles"
              payload: { code: "NB-B", components: [ { code: "CKA", kind: "ASSESSMENT", weight: 0.40 }, { code: "P1", kind: "PORTFOLIO", weight: 0.20 }, { code: "P2", kind: "PORTFOLIO", weight: 0.20 }, { code: "P3", kind: "PORTFOLIO", weight: 0.20 } ], submission_window_open: "2027-03-01T00:00:00Z", submission_window_close: "2027-05-01T00:00:00Z", retake_window_close: "2027-05-15T00:00:00Z", certification_threshold: 1.75, max_attempts_per_component: 2 }
              as: BoardAdministrator
              captures: { cyc_b: $.data.id }
            - call: "POST /cycles"
              payload: { code: "NB-C", components: [ { code: "CKA", kind: "ASSESSMENT", weight: 0.40 }, { code: "P1", kind: "PORTFOLIO", weight: 0.20 }, { code: "P2", kind: "PORTFOLIO", weight: 0.20 }, { code: "P3", kind: "PORTFOLIO", weight: 0.20 } ], submission_window_open: "2027-02-28T00:00:00Z", submission_window_close: "2027-04-30T00:00:00Z", retake_window_close: "2027-05-15T00:00:00Z", certification_threshold: 1.75, max_attempts_per_component: 2 }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Cycle NB-B is created (201): its open 2027-03-01T00:00:00Z EQUALS NB-A's close — half-open adjacency is not overlap"
            - "Cycle NB-C is rejected 409 ERR_CYCLE_WINDOW_OVERLAP: open 2027-02-28 falls strictly inside NB-A's [2027-01-01, 2027-03-01)"
            - "The overlap check applies even though NB-A is still DRAFT (DRAFT/OPEN/SCORING cycles all block)"

