            - "${err_rm_reads_discounts} == ERR_UNAUTHORIZED — the only GET in §1.5 that ResourceManager is not on"
            - "${err_consultant_opens_period} == ERR_UNAUTHORIZED, NOT ERR_NOT_RESOURCE_OWNER: the caller owns the row but the endpoint is FinanceController-exclusive, and priority 2 fires before priority 6"
            - "GET /consultants?limit=10 as ResourceManager still has total_count == 1 and GET /assignments as ResourceManager has total_count == 0 — every refusal was inert"

      - name: consultant_role_cannot_touch_another_consultants_rows
        claim_type: ERR_NOT_RESOURCE_OWNER
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
