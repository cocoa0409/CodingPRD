  - rule_id: combinatorial_formula
    instances:

      - name: fee_marginal_tiers_with_single_platform_tier
        grounds:
          - calculations.advisory_fee_household_aggregation
          - calculations.advisory_fee_household_aggregation.constants.ATTRIBUTABLE_TIERS
          - calculations.advisory_fee_household_aggregation.constants.PLATFORM_TIERS
          - calculations.household_fee_basis
        distinguishing_aspect: "The formula takes three interacting inputs — the progressive attributable ladder, the single-tier platform rate selected by the aggregate balance, and the pro-ration denominator — so a 320000000-cent household is not the sum of flat rates: the ladder contributes 3379999 cents at 110 and 90 bps while the whole 320000000-cent balance pays 6 bps platform fee, yielding 3571999 annual cents and 890553 for 91 days."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED BILLING entitlement, firm_posture OPEN."
            - "Household with two OPEN billable accounts whose combined C1 basis is exactly 320000000 cents (200000000 + 120000000)."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_bil
            - *c_ent_bil_grant
            - *c_house
            - *c_acct_a
            - *c_acct_a_act
            - *c_tx_a
            - *c_lot_a
            - *c_tx_a_out
            - *c_tx_a_recv
            - *c_acct_b
            - *c_acct_b_act
            - *c_tx_b
            - *c_lot_b
            - *c_tx_b_out
            - *c_tx_b_recv
          trigger:
            - call: "POST /ria/billing-runs"
              payload: { firm_id: "${f_id}", household_id: "${h_id}", period_start_date: "2026-09-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z", fee_variant_used: "HOUSEHOLD_AGGREGATED", stated_invoice_cents: 890553 }
              as: AdvisorOperationsLead
              captures: { br_id: $.data.id }
          assert:
            - "Household.${h_id}.household_fee_basis_cents == 320000000"
            - "Household.${h_id}.household_annual_fee_cents == 3571999"
            - "FeeBillingRun.${br_id}.gross_fee_cents == 890553"
            - "the attributable component is 3379999 (250000000 at 110 bps plus 69999999 at 90 bps) and the platform component is 192000 (320000000 at 6 bps)"
            - "FeeBillingRun.${br_id}.net_fee_cents == 890553 because no FeeCredit was available"
            - "FeeBillingRun.${br_id}.billing_run_status == SETTLED"

      - name: carryover_chronological_grading_order
        grounds:
          - calculations.cost_basis_carryover
          - calculations.cost_basis_carryover.input_set
          - entities.TransferLot.fields.lot_inventory_date
          - state_machines.TransferLot.PENDING_to_STAMPED
        distinguishing_aspect: "Grading is order-sensitive: two lots with the same shipment but inventory dates straddling the transfer's submission instant grade HIGH (2020-01-02) and MEDIUM (2025-12-31) respectively, and the HIGH-only carryover is 1200000 even though the MEDIUM lot carries a larger 2400000-cent basis — reversing the lot order would not change the grades, but treating 'reported basis' as the carryover would produce 3600000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED TRADING_AUTHORIZATION entitlement, firm_posture OPEN."
            - "One household with OPEN account RIA-500001 carrying no positions."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_tr
            - *c_ent_tr_grant
            - *c_house
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-500001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_id: $.data.id }
            - call: "POST /ria/accounts/${acct_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/asset-transfers"
              payload: { receiving_account_id: "${acct_id}", firm_id: "${f_id}", delivering_firm_name: "Prior Custodian LLC", method: "ACAT" }
              as: AdvisorOperationsLead
              captures: { tx_id: $.data.id }
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "BND", quantity_micros: 2000000000, sent_cost_basis_cents: 2400000, lot_inventory_date: "2025-12-31T00:00:00Z", valuation_price_micros: 90000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/transfers/${tx_id}/lots"
              payload: { symbol: "VTI", quantity_micros: 4000000000, sent_cost_basis_cents: 1200000, lot_inventory_date: "2020-01-02T00:00:00Z", valuation_price_micros: 250000000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
          assert:
            - "AssetTransfer.${tx_id}.carryover_cents == 1200000"
            - "AssetTransfer.${tx_id}.sent_basis_confidence == HIGH"
            - "AssetTransfer.${tx_id}.cost_basis_complete == false"
            - "GET /ria/asset-transfers/${tx_id}/lots returns VTI with basis_confidence_grade HIGH and lot_inventory_date 2020-01-02T00:00:00Z"
            - "GET /ria/asset-transfers/${tx_id}/lots returns BND with basis_confidence_grade MEDIUM and lot_inventory_date 2025-12-31T00:00:00Z"
            - "AssetTransfer.${tx_id}.carryover_cents != 3600000"
            - "the account's account_fee_basis_cents equals 1000000 from the VTI market value alone, since the MEDIUM-grade BND lot is uncosted"

      - name: block_nested_rounding_allocate_then_round
        grounds:
