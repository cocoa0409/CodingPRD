      - name: injury_hold_registration_promotion_cascade
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.ClassRegistration.REGISTERED_to_CANCELLED
          - state_machines.ClassRegistration.WAITLISTED_to_REGISTERED
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Trigger = SEVERE InjuryReport (different from the sibling's closure). Depth-3 chain: report -> Member SUSPENDED
          (hop 1) -> the member's future REGISTERED ClassRegistration CANCELLED (hop 2) -> waitlist head promoted to
          REGISTERED on that class (hop 3), conserving the seat.
