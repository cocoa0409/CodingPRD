      - name: store_retrieval_returns_stored_and_zeroed_posture_fields
        claim_type: retrieval
        grounds:
          - entities.Store.fields.compliance_status
          - entities.Store.fields.penalty_exposure_total_usd
          - entities.Store.fields.vented_loss_lbs
        distinguishing_aspect: "A freshly created store round-trips its four input fields unchanged and reports every derived posture field at its zero value with compliance_status COMPLIANT - so later assertions about AT_RISK or exposure totals are measured against a known-zero baseline."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One store created and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id, store_version: $.data.version }
          trigger:
            - call: "GET /stores/${store_id}"
              payload: {}
              as: ComplianceManager
              captures: { got_code: $.data.store_code, got_status: $.data.compliance_status }
          assert:
            - "HTTP 200 with response_type == object"
            - "Store.${store_id}.name == Northgate Market, store_code == NG-001, state_code == CA, region == WEST"
            - "Store.${store_id}.compliance_status == COMPLIANT, chronic_leaker_flag == false"
            - "Store.${store_id}.regulated_system_count == 0, open_leak_event_count == 0, overdue_leak_event_count == 0, mandated_retrofit_count == 0"
            - "Store.${store_id}.total_regulated_charge_lbs == 0.0, vented_loss_lbs == 0.0, penalty_exposure_total_usd == 0.00, version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: manual_leak_event_starts_open_with_stamped_deadline_schedule
        claim_type: initial_state
        grounds:
          - state_machines.LeakEvent.NEW_to_OPEN
          - calculations.leak_deadline_schedule
        distinguishing_aspect: "A regulator-independent manual declaration enters at initial_state OPEN with the whole deadline schedule stamped from detected_at (not from the clock at some later moment): initial_repair_deadline and repair_deadline are both 2026-08-31, verification_deadline is still null, and the 30-day extension budget starts untouched."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 60.0, initial 0.0 - REGULATED with an empty charge)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
          trigger:
            - call: "POST /leak-events"
              payload: { system_id: "${sys1_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id, event_status: $.data.status }
          assert:
            - "HTTP 201"
            - "LeakEvent.${event_id}.status == OPEN"
            - "LeakEvent.${event_id}.initial_repair_deadline == 2026-08-31T00:00:00Z and repair_deadline == 2026-08-31T00:00:00Z"
            - "LeakEvent.${event_id}.verification_deadline == null and last_repair_completed_at == null"
            - "LeakEvent.${event_id}.extension_days_granted_total == 0, extension_days_remaining == 30"
            - "LeakEvent.${event_id}.repair_attempt_count == 0, failed_verification_count == 0, late_repair_flag == false"
            - "LeakEvent.${event_id}.threshold_pct_applied == 20.0, leak_rate_pct_at_detection == 0.0, triggering_service_record_id == null"
            - "RefrigerantSystem.${sys1_id}.compliance_state == LEAK_OPEN and exceedance_count_12mo == 1"
            - "Store.${store_id}.open_leak_event_count == 1 and compliance_status == AT_RISK"

      - name: second_manual_leak_event_on_same_system_cannot_be_declared_twice
        claim_type: idempotency
        grounds:
          - state_machines.LeakEvent.NEW_to_OPEN.preconditions
          - validations[priority=13]
          - errors[ERR_OPEN_LEAK_EVENT_EXISTS]
        distinguishing_aspect: "The same declaration repeated while the first event is still non-terminal is a 409 ERR_OPEN_LEAK_EVENT_EXISTS, not a second event and not a silent no-op; the store's open_leak_event_count stays 1, so the duplicate never double-counts the posture."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 60.0, initial 0.0), one manually declared OPEN LeakEvent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sys1_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event1_id: $.data.id }
          trigger:
            - call: "POST /leak-events"
              payload: { system_id: "${sys1_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_OPEN_LEAK_EVENT_EXISTS"
            - "GET /leak-events?system_id=${sys1_id} returns total_count 1 with data[0].id == ${event1_id}"
            - "RefrigerantSystem.${sys1_id}.exceedance_count_12mo == 1 (unchanged)"
            - "Store.${store_id}.open_leak_event_count == 1 and compliance_status == AT_RISK"

      - name: verified_closed_leak_event_is_terminal_and_rejects_further_repair
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LeakEvent.terminal_states
          - state_machines.LeakEvent.FOLLOWUP_PENDING_to_VERIFIED_CLOSED
          - validations[priority=11]
          - errors[ERR_LEAK_EVENT_TERMINAL]
        distinguishing_aspect: "Walking a leak event all the way to VERIFIED_CLOSED (repair, INITIAL PASS, FOLLOWUP PASS) locks it: a further repair attempt is 409 ERR_LEAK_EVENT_TERMINAL, the closing test flips the attempt to VERIFIED, and the system falls back to COMPLIANT with a re-based leak-rate baseline."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z then 2026-08-08T00:00:00Z. One store, R-404A, SYS1 (full 60.0, initial 0.0), T1 (repairs), T2 (verifies), EQ1, no cylinder needed."
            - "Manual LeakEvent E1 detected 2026-08-01; RepairAttempt A1 by T1 completed 2026-08-05T09:00:00Z; INITIAL PASS by T2 at 08-08T10:00; FOLLOWUP PASS by T2 at 08-08T11:00."
