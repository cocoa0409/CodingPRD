# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Custom Picture Framing — Expert. 9 rule_ids × 2 instances = 18 instances.
# All formula-derived asserts are pre-computed literals (round_half_up, 2 dp).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_final_diverge_on_measured_dims
        grounds:
          - calculations.quote_estimate_total
          - calculations.final_invoice_total
          - calculations.line_cost
          - state_machines.FramingOrder.QUOTED_to_IN_PRODUCTION
          - entities.FramingOrder.fields.estimate_total
          - entities.FramingOrder.fields.final_invoice_total
        distinguishing_aspect: |
          Dual-variant lives on the FramingOrder pricing domain: estimate_total uses nominal
          intake dims with sum-then-round, final_invoice_total uses measured dims with
          round-per-line; for the same single line they yield 211.37 vs 215.00.
        test_recipe:
          setup:
            - "STANDARD customer (loyalty_discount_pct 0.00); order rush_requested=true, deposit_pct=0.30"
            - "One FrameLine 16x20 nominal, conservation glass+package, dry-mount, molding 0.45/ui (estimate_subtotal 183.80)"
            - "Order QUOTED (estimate_total 211.37); line measured to 16.25x20.5 (final_subtotal 186.96); deposit 63.41 paid; production started; one COMPLETED task on a glass bench is NOT required (no fragile); mark-ready computes final"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann Estimate", email: "ann@x.com", phone: "555-0100", loyalty_tier: "STANDARD" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Assembly 1", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", rush_requested: true, deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${order_v}", artwork_label: "Poster", nominal_width_in: 16, nominal_height_in: 20, molding_rate_per_ui: 0.45, mat_border_in: 2, mat_layers: 2, glass_type: "CONSERVATION", mounting_type: "DRY_MOUNT", conservation_package: true }
              as: FrameDesigner
              captures: { line_id: $.data.id, est_sub: $.data.estimate_subtotal }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 16.25, measured_height_in: 20.5 }
              as: FrameDesigner
              captures: { final_sub: $.data.final_subtotal }
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
              captures: { est_total: $.data.estimate_total, dep_req: $.data.deposit_required, order_v2: $.data.version }
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 63.41 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
            - call: "POST /production-tasks"
              payload: { order_id: "${order_id}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 60 }
              as: FrameProductionTech
              captures: { task_id: $.data.id }
            - call: "POST /production-tasks/${task_id}/complete"
              payload: {}
              as: FrameProductionTech
          trigger:
            - call: "POST /framing-orders/${order_id}/mark-ready"
              payload: {}
              as: FrameProductionTech
              captures: { final_total: $.data.final_invoice_total }
          assert:
            - "FramingOrder.${order_id}.estimate_total == 211.37"
            - "FramingOrder.${order_id}.final_invoice_total == 215.00"
            - "FramingOrder.${order_id}.estimate_total != FramingOrder.${order_id}.final_invoice_total"
            - "FrameLine.${line_id}.estimate_subtotal == 183.80"
            - "FrameLine.${line_id}.final_subtotal == 186.96"

      - name: customer_forward_risk_vs_settled_reputation_diverge
        grounds:
          - calculations.forward_no_show_risk
          - calculations.settled_reputation
          - entities.Customer.fields.no_show_risk_score
          - entities.Customer.fields.settled_reputation_score
          - state_machines.FramingOrder.READY_to_PICKED_UP
          - state_machines.FramingOrder.INTAKE_to_CANCELLED
        distinguishing_aspect: |
          Dual-variant lives on the Customer scoring domain (different entity from instance 1):
          no_show_risk_score is forward-looking over open orders while settled_reputation_score
          replays terminal history chronologically; after one ABANDON they read 5 and 70.
        test_recipe:
          setup:
            - "STANDARD customer; create order A (open) -> open_order_count 1 -> forward risk 5"
            - "Create order B and cancel it (ABANDON) -> settled history [ABANDON] -> settled 70; B leaves open set"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Risk", email: "bo@x.com", phone: "555-0101", loyalty_tier: "STANDARD" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_a: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_b: $.data.id }
          trigger:
            - call: "POST /framing-orders/${order_b}/cancel"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: FrontDeskClerk
              captures: { fwd: $.data.no_show_risk_score, settled: $.data.settled_reputation_score, openc: $.data.open_order_count }
          assert:
            - "Customer.${cust_id}.open_order_count == 1"
            - "Customer.${cust_id}.no_show_risk_score == 5"
            - "Customer.${cust_id}.settled_reputation_score == 70"
            - "Customer.${cust_id}.no_show_risk_score != Customer.${cust_id}.settled_reputation_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discount_rounding_order_sum_then_round_vs_round_per_line
        grounds:
          - calculations.quote_estimate_total
          - calculations.final_invoice_total
          - calculations.line_cost
          - entities.Customer.fields.loyalty_discount_pct
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: estimate pins SUM-THEN-ROUND
          (round((c1+c2+c3)*0.9)=185.64) while final pins ROUND-PER-LINE-THEN-SUM
          (round(c1*0.9)+round(c2*0.9)+round(c3*0.9)=185.65); the cent differs.
        test_recipe:
          setup:
            - "PREFERRED customer (loyalty_discount_pct 0.10); order no rush, deposit_pct 0.50"
            - "Three lines: 8x10 (64.47), 11x14 (73.65), 9x12 (68.15), all REGULAR glass molding 0.30/ui mat_border 2"
            - "Each measured to identical dims so final_subtotal == estimate_subtotal per line; estimate 185.64, final 185.65"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy Round", email: "cy@x.com", phone: "555-0102", loyalty_tier: "PREFERRED" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Assembly R", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", rush_requested: false, deposit_pct: 0.50 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "L1", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30, mat_border_in: 2, mat_layers: 1, glass_type: "REGULAR" }
              as: FrameDesigner
              captures: { l1: $.data.id, v1: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v1}", artwork_label: "L2", nominal_width_in: 11, nominal_height_in: 14, molding_rate_per_ui: 0.30, mat_border_in: 2, mat_layers: 1, glass_type: "REGULAR" }
              as: FrameDesigner
              captures: { l2: $.data.id, v2: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v2}", artwork_label: "L3", nominal_width_in: 9, nominal_height_in: 12, molding_rate_per_ui: 0.30, mat_border_in: 2, mat_layers: 1, glass_type: "REGULAR" }
              as: FrameDesigner
              captures: { l3: $.data.id }
            - call: "POST /frame-lines/${l1}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /frame-lines/${l2}/measure"
              payload: { measured_width_in: 11, measured_height_in: 14 }
              as: FrameDesigner
            - call: "POST /frame-lines/${l3}/measure"
              payload: { measured_width_in: 9, measured_height_in: 12 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
              captures: { est_total: $.data.estimate_total, dep_req: $.data.deposit_required }
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 92.82 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${order_id}/start-production"
              payload: {}
              as: FrameProductionTech
            - call: "POST /production-tasks"
              payload: { order_id: "${order_id}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 90 }
              as: FrameProductionTech
              captures: { task_id: $.data.id }
            - call: "POST /production-tasks/${task_id}/complete"
              payload: {}
              as: FrameProductionTech
          trigger:
            - call: "POST /framing-orders/${order_id}/mark-ready"
              payload: {}
              as: FrameProductionTech
              captures: { final_total: $.data.final_invoice_total }
          assert:
            - "FramingOrder.${order_id}.estimate_total == 185.64"
            - "FramingOrder.${order_id}.final_invoice_total == 185.65"
            - "FramingOrder.${order_id}.final_invoice_total - FramingOrder.${order_id}.estimate_total == 0.01"

      - name: line_cost_tiered_oversize_with_conservation_multiplier
        grounds:
          - calculations.line_cost
          - entities.FrameLine.fields.estimate_subtotal
          - entities.FrameLine.fields.glass_type
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: line_cost selects an oversize tier by
          united-inches (OVERSIZE_TIER1 at ui>=80), multiplies materials by CONSERVATION_MULT
          conditionally, and adds mounting upcharge — 30x40 museum/hinge/conservation = 603.20.
        test_recipe:
          setup:
            - "Any customer; order; one big line 30x40 museum glass, conservation_hinge mount, conservation_package=true, molding 0.60/ui, mat_border 3, mat_layers 2 (ui=82 -> oversize 40)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Di Big", email: "di@x.com", phone: "555-0103" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Big", nominal_width_in: 30, nominal_height_in: 40, molding_rate_per_ui: 0.60, mat_border_in: 3, mat_layers: 2, glass_type: "MUSEUM", mounting_type: "CONSERVATION_HINGE", conservation_package: true }
              as: FrameDesigner
              captures: { line_id: $.data.id, sub: $.data.estimate_subtotal }
          assert:
            - "FrameLine.${line_id}.estimate_subtotal == 603.20"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: framing_order_parallel_production_and_payment_dimensions
        grounds:
          - state_machines.FramingOrder.production_status
          - state_machines.FramingOrder.payment_status
          - entities.FramingOrder.fields.production_status
          - entities.FramingOrder.fields.payment_status
        distinguishing_aspect: |
          FramingOrder carries two independent state dimensions: a DEPOSIT payment advances
          payment_status DEPOSIT_DUE->DEPOSIT_PAID while production_status stays QUOTED, so
          the two axes evolve independently on the same row.
        test_recipe:
          setup:
            - "Order QUOTED with deposit_required computed; one measured line"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ed Par", email: "ed@x.com", phone: "555-0104" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "P", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30, mat_border_in: 2, mat_layers: 1, glass_type: "REGULAR" }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
              captures: { dep_req: $.data.deposit_required }
          trigger:
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "GET /framing-orders/${order_id}"
              payload: {}
              as: FrontDeskClerk
              captures: { prod: $.data.production_status, pay: $.data.payment_status }
          assert:
            - "FramingOrder.${order_id}.production_status == QUOTED"
            - "FramingOrder.${order_id}.payment_status == DEPOSIT_PAID"

      - name: frame_line_branching_and_order_intake_quote_cycle
        grounds:
          - state_machines.FrameLine.DRAFT_to_MEASURED
          - state_machines.FrameLine.DRAFT_to_VOID
          - state_machines.FramingOrder.INTAKE_to_QUOTED
          - state_machines.FramingOrder.QUOTED_to_INTAKE
        distinguishing_aspect: |
          Non-linearity on a different entity (FrameLine + the FramingOrder revision cycle):
          one DRAFT line forks to VOID, another to MEASURED, and the order loops QUOTED->INTAKE
          (reopen) ->QUOTED, a cycle no linear pipeline admits.
        test_recipe:
          setup:
            - "Order INTAKE with two DRAFT lines; void line A, measure line B"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fi Cyc", email: "fi@x.com", phone: "555-0105" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "A", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_a: $.data.id, v1: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v1}", artwork_label: "B", nominal_width_in: 9, nominal_height_in: 12, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_b: $.data.id }
            - call: "POST /frame-lines/${line_a}/void"
              payload: {}
              as: FrameDesigner
            - call: "POST /frame-lines/${line_b}/measure"
              payload: { measured_width_in: 9, measured_height_in: 12 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
          trigger:
            - call: "POST /framing-orders/${order_id}/reopen-intake"
              payload: {}
              as: FrameDesigner
              captures: { prod: $.data.production_status }
          assert:
            - "FrameLine.${line_a}.line_status == VOID"
            - "FrameLine.${line_b}.line_status == MEASURED"
            - "FramingOrder.${order_id}.production_status == INTAKE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_triggers_refund_then_amount_paid_then_balance_due
        grounds:
          - state_machines.FramingOrder.INTAKE_to_CANCELLED
          - calculations.order_ledger
          - entities.Payment.fields.kind
          - entities.FramingOrder.fields.amount_paid
          - entities.FramingOrder.fields.balance_due
        distinguishing_aspect: |
          Depth-3 chain from the CANCEL trigger: cancel creates a REFUND Payment, the new
          Payment forces order_ledger to recompute amount_paid, and the changed amount_paid
          forces balance_due to recompute — each link caused by the previous, not by cancel directly.
        test_recipe:
          setup:
            - "STANDARD customer; QUOTED order with one measured line, deposit 25.00 paid (amount_paid 25.00)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gus Casc", email: "gus@x.com", phone: "555-0106" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "C", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
          trigger:
            - call: "POST /framing-orders/${order_id}/cancel"
              payload: {}
              as: FrontDeskClerk
              captures: { paid: $.data.amount_paid, bal: $.data.balance_due, pay_status: $.data.payment_status }
          assert:
            - "FramingOrder.${order_id}.production_status == CANCELLED"
            - "FramingOrder.${order_id}.payment_status == REFUNDED"
            - "FramingOrder.${order_id}.amount_paid == 0.00"
            - "FramingOrder.${order_id}.balance_due == 64.47"

      - name: pickup_triggers_open_count_then_no_show_risk_recompute
        grounds:
          - state_machines.FramingOrder.READY_to_PICKED_UP
          - calculations.forward_no_show_risk
          - entities.Customer.fields.open_order_count
          - entities.Customer.fields.no_show_risk_score
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (PICKUP): pickup removes the order from the
          open set -> Customer.open_order_count recomputes -> the smaller open set forces
          no_show_risk_score to recompute; with two other open orders remaining, risk falls to 10.
        test_recipe:
          setup:
            - "STANDARD customer with three open orders; order X driven to READY then PAID_IN_FULL"
            - "Order X has one 8x10 line (estimate 64.47); deposit 25.00 then balance paid to reach final 64.47"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hal Pick", email: "hal@x.com", phone: "555-0107" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Asm P", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { o1: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { o2: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { ox: $.data.id, vx0: $.data.version }
            - call: "POST /framing-orders/${ox}/frame-lines"
              payload: { expected_order_version: "${vx0}", artwork_label: "X", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { lx: $.data.id }
            - call: "POST /frame-lines/${lx}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${ox}/quote"
              payload: {}
              as: FrameDesigner
              captures: { dep: $.data.deposit_required }
            - call: "POST /framing-orders/${ox}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${ox}/start-production"
              payload: {}
              as: FrameProductionTech
            - call: "POST /production-tasks"
              payload: { order_id: "${ox}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 30 }
              as: FrameProductionTech
              captures: { tx: $.data.id }
            - call: "POST /production-tasks/${tx}/complete"
              payload: {}
              as: FrameProductionTech
            - call: "POST /framing-orders/${ox}/mark-ready"
              payload: {}
              as: FrameProductionTech
              captures: { final_x: $.data.final_invoice_total }
            - call: "POST /framing-orders/${ox}/payments"
              payload: { kind: "BALANCE", amount: 39.47 }
              as: FrontDeskClerk
          trigger:
            - call: "POST /framing-orders/${ox}/pickup"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: FrontDeskClerk
              captures: { openc: $.data.open_order_count, fwd: $.data.no_show_risk_score }
          assert:
            - "FramingOrder.${ox}.production_status == PICKED_UP"
            - "Customer.${cust_id}.open_order_count == 2"
            - "Customer.${cust_id}.no_show_risk_score == 10"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pickup_of_unready_unpaid_order
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.FramingOrder.READY_to_PICKED_UP
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BALANCE_OUTSTANDING]
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_fiscal (priority 11): a pickup on
          a QUOTED order that is also unpaid violates both, and the lower-priority state check
          ERR_INVALID_STATE (409) must win over ERR_BALANCE_OUTSTANDING (402).
        test_recipe:
          setup:
            - "Order QUOTED (not READY) and not PAID_IN_FULL — both the state and fiscal checks would fail"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ivy Pri", email: "ivy@x.com", phone: "555-0108" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
