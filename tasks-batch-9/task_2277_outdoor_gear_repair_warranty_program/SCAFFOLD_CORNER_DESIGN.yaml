# ============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Outdoor Gear Repair & Warranty Program
# Walked row-by-row against references/claim-extraction-guide.md; every corner the
# nine §0.5 Difficulty Rules already own is emitted as an `excluded_because:` stub.
# Every one of the 65 §1.6 error ids is triggered by at least one instance here or
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# ============================================================================

scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: service_center_creation_returns_envelope_with_derived_defaults
        claim_type: creation
        grounds:
          - entities.ServiceCenter
          - endpoints[POST /gear-service/service-centers]
          - response_envelope
        distinguishing_aspect: "A center created with only the three required inputs must come back 201 inside the {data, error} envelope with liability_posture OPEN, every rollup at zero, last_queue_review_at null and version 1."
        test_recipe:
          setup: ["empty database; logical clock pinned to 2026-06-15T09:00:00Z"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
          assert:
            - "HTTP 201 with body shape { data: {...}, error: null }"
            - "ServiceCenter.${sc_id}.name == 'Cascade Service Hub' and region_code == 'US-OR' and liability_cap_cents == 5000000"
            - "ServiceCenter.${sc_id}.open_liability_cents == 0 and liability_utilization_pct == 0.00 and liability_posture == OPEN"
            - "ServiceCenter.${sc_id}.active_queue_depth == 0 and current_surge_multiplier == 1.00 and breached_commitment_count == 0 and last_queue_review_at == null"
            - "ServiceCenter.${sc_id}.version == 1 and created_at == 2026-06-15T09:00:00Z"

      - name: gear_model_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.GearModel
          - endpoints[GET /gear-service/gear-models/{id}]
        distinguishing_aspect: "GET by id echoes every stored input field plus the derived parts/design signals; a model with no PartLot rows reads NO_SUPPORT and repairability_flag NONE."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one GearModel with no part lots and no claims"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
          trigger:
            - call: "GET /gear-service/gear-models/${gm2_id}"
              payload: {}
              as: ServiceAgent
          assert:
            - "HTTP 200; data.model_code == 'TNT-ASCENT-2', data.category == 'TENT_SHELTER', data.msrp_cents == 79900, data.warranty_years == 5"
            - "data.lifetime_warranty == false, data.discontinued_at == null, data.successor_model_id == null"
            - "data.parts_support_status == NO_SUPPORT (no PartLot row exists for this model)"
            - "data.defect_claim_count == 0, data.wear_denial_count == 0, data.irreparable_count == 0, data.repairability_flag == NONE"

      - name: gear_items_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /gear-service/gear-items]
          - entities.GearItem.fields.disposition_status
        distinguishing_aspect: "The filtered list honours owner_customer_id plus limit/offset and reports total_count over the FILTERED set (3), not the table (3), while returning only the first 2 rows ordered by created_at ASC."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one customer owning three registered items on the same model"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_a_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00418", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88214", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_b_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00419", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88215", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_c_id: $.data.id }
          trigger:
            - call: "GET /gear-service/gear-items"
              payload: { owner_customer_id: "${cust_id}", disposition_status: "WITH_CUSTOMER", limit: 2, offset: 0 }
              as: ServiceAgent
          assert:
            - "HTTP 200 with data.total_count == 3, data.has_more == true and exactly 2 rows returned"
            - "the two rows are ${item_a_id} then ${item_b_id} (created_at ASC)"
            - "every returned row has disposition_status == WITH_CUSTOMER"
            - "Customer.${cust_id}.lifetime_claim_count == 0"

      - name: repair_order_read_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_REPAIR_ORDER_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unregistered UUID on the order read must answer ERR_REPAIR_ORDER_NOT_FOUND (404), not an empty 200 body."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; no RepairOrder rows exist"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /gear-service/repair-orders/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ServiceAgent
          assert:
            - "HTTP 404 with error.error_id == ERR_REPAIR_ORDER_NOT_FOUND and data == null"

      - name: path_ids_across_registries_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_SERVICE_CENTER_NOT_FOUND]
          - errors[ERR_GEAR_MODEL_NOT_FOUND]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_GEAR_ITEM_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_TECHNICIAN_NOT_FOUND]
          - errors[ERR_ESTIMATE_NOT_FOUND]
          - errors[ERR_PART_LOT_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_WORK_BLOCK_NOT_FOUND]
        distinguishing_aspect: "Each registry answers with ITS OWN not-found error id for an unregistered path id — the 404 vocabulary is per-entity, never a single generic code."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; empty database apart from the clock"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /gear-service/service-centers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
            - call: "GET /gear-service/gear-models/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdmin
            - call: "GET /gear-service/customers/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/gear-items/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/warranty-claims/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/claim-assessments/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/technicians/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProgramAdmin
            - call: "GET /gear-service/repair-estimates/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/part-lots/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PartsCoordinator
            - call: "GET /gear-service/parts-reservations/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PartsCoordinator
            - call: "GET /gear-service/work-blocks/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ServiceAgent
          assert:
            - "the eleven calls answer 404 with error_id ERR_SERVICE_CENTER_NOT_FOUND, ERR_GEAR_MODEL_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_GEAR_ITEM_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_TECHNICIAN_NOT_FOUND, ERR_ESTIMATE_NOT_FOUND, ERR_PART_LOT_NOT_FOUND, ERR_RESERVATION_NOT_FOUND and ERR_WORK_BLOCK_NOT_FOUND respectively"
            - "every response carries data == null"

      - name: warranty_claim_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /gear-service/warranty-claims]
        distinguishing_aspect: "Intake with gear_item_id and intake_kind omitted must answer ERR_INVALID_REQUEST (422) before any existence or state check runs, and must not create a DRAFT claim."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one center registered"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", customer_narrative: "Something failed." }
              as: ServiceAgent
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /gear-service/warranty-claims?service_center_id=${sc_id} returns 0 rows"

      - name: part_lot_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.PartLot.fields.low_watermark_units
          - entities.PartLot.fields.substitution_allowed
          - entities.PartLot.fields.status
        distinguishing_aspect: "Omitting low_watermark_units, substitution_allowed and substitute_for_part_code must default the lot to watermark 0 / substitution off / null substitute code, which makes a 4-unit lot AVAILABLE rather than LOW."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one GearModel registered"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
          trigger:
            - call: "POST /gear-service/part-lots"
              payload: { gear_model_id: "${gm2_id}", part_code: "AS2-FLOOR-PANEL", part_kind: "FABRIC_PANEL", on_hand_units: 4, unit_price_cents: 4200 }
              as: PartsCoordinator
              captures: { lot_id: $.data.id }
          assert:
            - "PartLot.${lot_id}.low_watermark_units == 0, substitution_allowed == false, substitute_for_part_code == null"
            - "PartLot.${lot_id}.on_hand_units == 4, reserved_units == 0, available_units == 4, status == AVAILABLE"
            - "GearModel.${gm2_id}.parts_support_status == SUPPORTED (flipped by the new AVAILABLE lot)"

      - name: gear_item_computed_valuation_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.GearItem.fields.replacement_value_depreciated_cents
          - entities.GearItem.fields.age_months
          - entities.GearItem.fields.warranty_state
          - calculations.replacement_value
        distinguishing_aspect: "Client-supplied values for age_months, warranty_state and both replacement valuations are discarded: the server recomputes 37 / IN_WARRANTY / 52430 / 89910 from purchase_date, msrp and the clock."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; TNT-ASCENT-2 discontinued with successor TNT-ASCENT-3 (msrp 99900)"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-3", name: "Ascent 3P Tent", category: "TENT_SHELTER", msrp_cents: 99900, release_year: 2024, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm3_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5, discontinued_at: "2024-03-01T00:00:00Z", successor_model_id: "${gm3_id}" }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B", age_months: 3, warranty_state: "LIFETIME", replacement_value_depreciated_cents: 1, replacement_value_successor_cents: 2, disposition_status: "RESOLD" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
          assert:
            - "GearItem.${item_id}.age_months == 37 (not the supplied 3)"
            - "GearItem.${item_id}.warranty_state == IN_WARRANTY (not the supplied LIFETIME)"
            - "GearItem.${item_id}.replacement_value_depreciated_cents == 52430 and replacement_value_successor_cents == 89910"
            - "GearItem.${item_id}.disposition_status == WITH_CUSTOMER (not the supplied RESOLD)"
            - "GearItem.${item_id}.trade_in_credit_cents == 0, refurb_list_price_cents == null, resale_price_cents == null"

      - name: technician_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Technician
          - entities.Technician.fields.scheduled_minutes_open
        distinguishing_aspect: "id / created_at / updated_at / version are minted by the server and client-supplied values for them (and for the computed minute counters) are ignored on technician creation."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one center registered"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /gear-service/technicians"
              payload: { service_center_id: "${sc_id}", employee_code: "T-101", full_name: "Ines Park", certifications: [{ work_type: "FABRIC", level: 3 }], id: "deadbeef-0000-4000-8000-000000000000", version: 99, created_at: "2001-01-01T00:00:00Z", scheduled_minutes_open: 500, completed_minutes: 500 }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
          assert:
            - "Technician.${t1_id}.id is a server-minted UUID != 'deadbeef-0000-4000-8000-000000000000'"
            - "Technician.${t1_id}.version == 1 and created_at == 2026-06-15T09:00:00Z and updated_at == 2026-06-15T09:00:00Z"
            - "Technician.${t1_id}.scheduled_minutes_open == 0 and completed_minutes == 0"
            - "Technician.${t1_id}.status == ACTIVE (default) and certifications == [{ work_type: FABRIC, level: 3 }]"

      - name: gear_model_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds:
          - entities.GearModel.fields.category
          - validations[priority=9]
        distinguishing_aspect: "A category outside the five declared enum values and a release_year outside 2000..2100 both answer ERR_INVALID_REQUEST; no GearModel row is created."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; empty catalog"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-BAD-1", name: "Bad Tent", category: "CAMP_KITCHEN", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-BAD-2", name: "Bad Year Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 1899, warranty_years: 5 }
              as: ProgramAdmin
          assert:
            - "both calls answer HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /gear-service/gear-models?category=TENT_SHELTER returns 0 rows"

      - name: claim_assessment_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ClaimAssessment
          - endpoints[GET /gear-service/claim-assessments/{id}]
        distinguishing_aspect: "ClaimAssessment declares common_fields false: the row exposes id and created_at only — no version, no updated_at — and §1.5 offers no PATCH/DELETE for it, so a bench finding is corrected by superseding it, never by editing."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one SUBMITTED claim on AS2-00417 assessed by T-101"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
            - call: "POST /gear-service/technicians"
              payload: { service_center_id: "${sc_id}", employee_code: "T-101", full_name: "Ines Park", certifications: [{ work_type: "FABRIC", level: 3 }] }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /gear-service/warranty-claims"
              payload: { service_center_id: "${sc_id}", gear_item_id: "${item_id}", intake_kind: "WARRANTY_CLAIM", reported_defect_type: "SEAM_FAILURE", customer_narrative: "Floor seam split." }
              as: ServiceAgent
              captures: { claim_id: $.data.id }
            - call: "POST /gear-service/warranty-claims/${claim_id}/submit"
              payload: {}
              as: ServiceAgent
              captures: { claim_v1: $.data.version }
            - call: "POST /gear-service/warranty-claims/${claim_id}/assessments"
              payload: { expected_claim_version: "${claim_v1}", determination: "MANUFACTURING_DEFECT", required_work_types: ["FABRIC"], estimated_labor_lines: [{ work_type: "FABRIC", minutes: 120 }], estimated_parts_cents: 4200, defect_notes: "Factory bond line failure." }
              as: RepairTechnician
              as_user_id: "${t1_id}"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "GET /gear-service/claim-assessments/${asmt_id}"
              payload: {}
              as: ServiceAgent
          assert:
            - "HTTP 200; data carries id and created_at == 2026-06-15T09:00:00Z"
            - "data has NO version field and NO updated_at field"
            - "data.assessor_technician_id == ${t1_id} (taken from X-User-ID, never from the body) and is_superseded == false"
            - "data.estimated_repair_cost_cents == 22390"

      - name: gear_item_parent_model_must_exist_not_found
        claim_type: parent_relationships
        grounds:
          - entities.GearItem.fields.gear_model_id
          - validations[priority=7]
          - errors[ERR_GEAR_MODEL_NOT_FOUND]
        distinguishing_aspect: "A body-supplied FK to a non-existent GearModel answers ERR_GEAR_MODEL_NOT_FOUND (404) — the body FK check is a 404, not a 422 shape error."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z; one customer registered, no GearModel with the referenced id"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /gear-service/gear-items"
