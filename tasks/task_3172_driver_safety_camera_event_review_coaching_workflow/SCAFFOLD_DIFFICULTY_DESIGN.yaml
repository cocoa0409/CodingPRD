            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_tw: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_tw}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_tw: $.data.id }
            - call: "POST /api/footage-clips/${cl_tw}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_tw}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_tw}"
              payload: {}
              as: SafetyManager
              captures: { ev_tw_v: $.data.version }
            - call: "POST /api/safety-events/${ev_tw}/review"
              payload: { action: "CONFIRM", rationale: "confirmed at T0", expected_event_version: "${ev_tw_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/safety-events/${ev_tw}/exoneration-claims"
              payload: { claim_ref: "CLM-LATE-1" }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err_tw: $.data.error_id }
          assert:
            - "HTTP 422 and err_tw == ERR_EXONERATION_WINDOW_EXPIRED  (31 days > confirmed_at + 30 days)"
            - "err_tw != ERR_CLAIM_REQUIRES_CONFIRMED_COLLISION  (priority 8 temporal wins over priority 9 referential)"
            - "GET /api/safety-events/${ev_tw}/exoneration-claims returns 0 rows"

