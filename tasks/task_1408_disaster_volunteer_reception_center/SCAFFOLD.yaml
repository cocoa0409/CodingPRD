# =============================================================================
# PRD Benchmark Seed Tables — task_1408_disaster_volunteer_reception_center
# =============================================================================

scenario: |
  Disaster Volunteer Reception Center Operations (county volunteer reception center): spontaneous volunteer intake & registration, skill/credential verification & background check by role, assignment matching to requesting agencies, safety briefing, PPE issuance & liability waiver, transportation & shift scheduling to sites, hour tracking for federal cost-share documentation, demobilization & volunteer recognition, unaffiliated volunteer risk management

domain_name: disaster-volunteer-reception-center
api_prefix: /vrc

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph        # peer entities joined by junction FKs (DeploymentAssignment, SeatBooking); flat /vrc/<collection> URLs
  state_machine_shape: parallel # Incident runs lifecycle_status x operational_posture as two independent dimensions; Volunteer/HourEntry are cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (13 entities)
# All entities carry common_fields: true -> id (server-minted UUID, identity
# only, never used for business decisions), created_at, updated_at (ISO 8601
# UTC, 3 fractional digits), version (integer, starts 1, +1 per mutation).
# The logical clock (POST /vrc/_clock/set_current_utc) is the ONLY time source;
# server startup default is 2026-08-01T00:00:00Z and never falls back to
# wall-clock time.
# =============================================================================
entities:
  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, required: true, description: "Human-readable incident name (e.g., 'Riverton Flood 2026')" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVATION | ACTIVE | DEMOBILIZATION | CLOSED", default: ACTIVATION, constraints: "one of {ACTIVATION, ACTIVE, DEMOBILIZATION, CLOSED}" }
      - { name: operational_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived per calculation posture_derivation; gates child write operations", constraints: "one of {OPEN, RESTRICTED, FROZEN}" }
      - { name: ppe_stock, type: object, source: input, required: true, description: "Map of item_type -> integer on-hand units; keys exactly {GLOVES, MASK, HARD_HAT, VEST, GOGGLES}, each integer >= 0; decremented by PPE issuance, restored on RETURNED close" }
      - { name: provisional_cost_share_cents, type: integer, source: computed, description: "Sum of entry_value_cents over HourEntry in {SUBMITTED, DISPUTED, VERIFIED} for this incident; per-entry values rounded before summation", default: 0 }
      - { name: verified_cost_share_cents, type: integer, source: computed, description: "Sum of entry_value_cents over HourEntry in {VERIFIED} only", default: 0 }
      - { name: federal_share_cents, type: integer, source: computed, description: "round_half_up(verified_cost_share_cents * 0.75)", default: 0 }
      - { name: state_share_cents, type: integer, source: computed, description: "round_half_up(verified_cost_share_cents * 0.125)", default: 0 }
      - { name: local_share_cents, type: integer, source: computed, description: "verified_cost_share_cents - federal_share_cents - state_share_cents (remainder absorption; NOT independently rounded)", default: 0 }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of ACTIVATION->ACTIVE; null until activated", constraints: "nullable" }
      - { name: demobilized_at, type: datetime, source: system, description: "Logical-clock timestamp of ACTIVE->DEMOBILIZATION; null until then", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of DEMOBILIZATION->CLOSED; null until then", constraints: "nullable" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, required: true, description: "FK -> Incident.id; incident the volunteer registered at" }
      - { name: full_name, type: string, source: input, required: true, description: "Volunteer full legal name" }
      - { name: phone, type: string, source: input, required: true, description: "Contact phone (free-form string, non-empty)" }
      - { name: email, type: string, source: input, required: true, description: "Contact email (free-form string, non-empty)" }
      - { name: home_locality, type: string, source: input, required: true, description: "City/town of residence (drives local-vs-spontaneous reporting)" }
      - { name: status, type: enum, source: system, description: "REGISTERED | VETTING | CLEARED | READY | DEPLOYED | SUSPENDED | DEMOBILIZED | WITHDRAWN | REJECTED", default: REGISTERED }
      - { name: registered_by_user_id, type: string, source: system, description: "X-User-ID of the creating call; for Volunteer self-registration this equals the newly minted volunteer id; used by segregation-of-duties checks" }
      - { name: committed_hours, type: number, source: computed, description: "Sum of SiteShift.duration_hours over this volunteer's DeploymentAssignments in {CONFIRMED, CHECKED_IN}; 2-decimal precision", default: 0.0 }
      - { name: verified_hours_total, type: number, source: computed, description: "Sum of hours over this volunteer's HourEntry in {VERIFIED}; 2-decimal precision", default: 0.0 }
      - { name: current_risk_score, type: integer, source: computed, description: "Decayed risk points per calculation volunteer_risk_score (variant current); never negative", default: 0 }
      - { name: lifetime_risk_score, type: integer, source: computed, description: "Undecayed lifetime risk points per calculation volunteer_risk_score (variant lifetime)", default: 0 }
      - { name: recognition_tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD — assigned at demobilization per calculation recognition_tier", default: NONE }
      - { name: demobilized_at, type: datetime, source: system, description: "Logical-clock timestamp of demobilization; null until DEMOBILIZED", constraints: "nullable" }

  - name: SkillCredential
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, required: true, description: "FK -> Volunteer.id; holder of the claimed credential" }
      - { name: skill_code, type: enum, source: input, required: true, description: "GENERAL_LABOR | CHAINSAW | MEDICAL | CDL | SHELTER_OPS | TRANSLATION", constraints: "one of the six skill codes" }
      - { name: credential_class, type: enum, source: input, required: true, description: "STANDARD | ADVANCED", constraints: "one of {STANDARD, ADVANCED}" }
      - { name: evidence_notes, type: string, source: input, description: "Optional free-text evidence pointer (license no., issuer)", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: input, required: true, description: "Credential expiry; system sweep flips VERIFIED -> EXPIRED when logical clock passes this instant" }
      - { name: status, type: enum, source: system, description: "CLAIMED | VERIFIED | REJECTED | EXPIRED", default: CLAIMED }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying VettingOfficer; null until first verification", constraints: "nullable" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent verification; null until then", constraints: "nullable" }

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, required: true, description: "FK -> Volunteer.id; subject of the check" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CLEARED | FLAGGED | EXPIRED", default: REQUESTED }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the VettingOfficer who cleared/flagged; null until adjudicated", constraints: "nullable" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of CLEARED/FLAGGED; null until then", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: system, description: "Set at clearance: adjudicated_at + 720h; system sweep flips CLEARED -> EXPIRED at/past this instant; null until cleared", constraints: "nullable" }

  - name: Clearance
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, required: true, description: "FK -> Volunteer.id; holder" }
      - { name: clearance_type, type: enum, source: input, required: true, description: "SAFETY_BRIEFING | LIABILITY_WAIVER", constraints: "one of {SAFETY_BRIEFING, LIABILITY_WAIVER}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: ACTIVE }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp at creation (briefing completion / waiver signature instant)" }
      - { name: valid_until, type: datetime, source: system, description: "SAFETY_BRIEFING: completed_at + 72h (valid strictly before this instant; EXPIRED at/past it). LIABILITY_WAIVER: null (never expires)", constraints: "nullable" }
      - { name: revoked_reason, type: string, source: system, description: "Reason recorded on revoke; null unless REVOKED", constraints: "nullable" }

  - name: SupportRequest
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, required: true, description: "FK -> Incident.id" }
      - { name: requesting_agency, type: string, source: input, required: true, description: "Free-form name of the requesting agency (e.g., 'County Public Works')" }
      - { name: site_name, type: string, source: input, required: true, description: "Site the work is at; assignments must use a SiteShift whose site_name matches exactly (case-sensitive)" }
      - { name: required_skill, type: enum, source: input, required: true, description: "Skill code required of assigned volunteers", constraints: "one of the six skill codes (see SkillCredential.skill_code)" }
      - { name: min_credential_class, type: enum, source: input, required: true, description: "Minimum credential class", constraints: "one of {STANDARD, ADVANCED}" }
      - { name: headcount_needed, type: integer, source: input, required: true, description: "Number of volunteers requested", constraints: "integer >= 1" }
      - { name: criticality, type: enum, source: input, required: true, description: "STANDARD | CRITICAL; CRITICAL unfilled requests feed posture_derivation", constraints: "one of {STANDARD, CRITICAL}" }
      - { name: window_start, type: datetime, source: input, required: true, description: "Earliest work start the agency accepts (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, required: true, description: "Latest work end the agency accepts; must be strictly after window_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | MATCHING | FILLED | COMPLETED | CANCELLED", default: DRAFT }
      - { name: filled_count, type: integer, source: computed, description: "Count of this request's DeploymentAssignments in {CONFIRMED, CHECKED_IN, COMPLETED}", default: 0 }

  - name: SiteShift
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, required: true, description: "FK -> Incident.id" }
      - { name: site_name, type: string, source: input, required: true, description: "Work site name; matched case-sensitively against SupportRequest.site_name" }
      - { name: hazard_level, type: enum, source: input, required: true, description: "GREEN | AMBER | RED; RED shifts require ADVANCED credential class on assignments and feed posture_derivation", constraints: "one of {GREEN, AMBER, RED}" }
      - { name: start_at, type: datetime, source: input, required: true, description: "Shift window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, required: true, description: "Shift window end; strictly after start_at; minimum duration 0.25h" }
      - { name: capacity, type: integer, source: input, required: true, description: "Maximum rostered volunteers", constraints: "integer >= 1" }
      - { name: duration_hours, type: number, source: computed, description: "(end_at - start_at) in hours, 2-decimal precision" }
      - { name: rostered_count, type: integer, source: computed, description: "Count of this shift's DeploymentAssignments in {CONFIRMED, CHECKED_IN, COMPLETED}", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN_FOR_ROSTER | LOCKED | CANCELLED", default: SCHEDULED }

  - name: DeploymentAssignment
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: computed, description: "FK -> Incident.id; copied from the referenced SupportRequest at creation" }
      - { name: volunteer_id, type: string, source: input, required: true, description: "FK -> Volunteer.id" }
      - { name: support_request_id, type: string, source: input, required: true, description: "FK -> SupportRequest.id" }
      - { name: site_shift_id, type: string, source: input, required: true, description: "FK -> SiteShift.id" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | DECLINED | NO_SHOW | RECALLED", default: PROPOSED }
      - { name: origin, type: enum, source: system, description: "MANUAL (POST /vrc/assignments) | AUTO_MATCH (POST /vrc/support-requests/{id}/auto-match)", default: MANUAL }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in; null until CHECKED_IN", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED", constraints: "nullable" }

  - name: TransportTrip
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, required: true, description: "FK -> Incident.id" }
      - { name: site_shift_id, type: string, source: input, required: true, description: "FK -> SiteShift.id; the shift this trip ferries volunteers to" }
      - { name: vehicle_id, type: string, source: input, required: true, description: "Free-form vehicle identifier; turnaround-overlap rule scopes on this string" }
      - { name: seat_capacity, type: integer, source: input, required: true, description: "Passenger seats available", constraints: "integer >= 1" }
      - { name: depart_at, type: datetime, source: input, required: true, description: "Departure instant (ISO 8601 UTC)" }
      - { name: arrive_estimate_at, type: datetime, source: input, required: true, description: "Estimated arrival; strictly after depart_at" }
      - { name: booked_seats, type: integer, source: computed, description: "Count of this trip's SeatBookings in {BOOKED, BOARDED}", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DEPARTED | ARRIVED | CANCELLED", default: SCHEDULED }

  - name: SeatBooking
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, required: true, description: "FK -> TransportTrip.id" }
      - { name: assignment_id, type: string, source: input, required: true, description: "FK -> DeploymentAssignment.id; the assignment the volunteer is travelling for" }
      - { name: volunteer_id, type: string, source: computed, description: "FK -> Volunteer.id; copied from the referenced DeploymentAssignment at creation" }
      - { name: status, type: enum, source: system, description: "BOOKED | BOARDED | NO_SHOW | CANCELLED", default: BOOKED }

  - name: PPEIssuance
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, required: true, description: "FK -> Volunteer.id; recipient" }
      - { name: item_type, type: enum, source: input, required: true, description: "GLOVES | MASK | HARD_HAT | VEST | GOGGLES", constraints: "one of the five PPE item types" }
      - { name: quantity, type: integer, source: input, required: true, description: "Units issued", constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, description: "ISSUED | RETURNED | DAMAGED | LOST", default: ISSUED }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close; null while ISSUED", constraints: "nullable" }

  - name: HourEntry
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, required: true, description: "FK -> DeploymentAssignment.id; the completed assignment these hours belong to" }
      - { name: work_date, type: string, source: input, required: true, description: "ISO 8601 calendar date (YYYY-MM-DD, UTC); must equal the UTC date of the assignment's SiteShift.start_at" }
      - { name: hours, type: number, source: input, required: true, description: "Hours worked; 0 < hours <= 16, multiple of 0.25, and <= the assignment shift's duration_hours" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | DISPUTED | REJECTED_FINAL", default: SUBMITTED }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creator; never changed by resubmit; segregation-of-duties target" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying SiteSupervisor; null until VERIFIED", constraints: "nullable" }
      - { name: dispute_count, type: integer, source: system, description: "Number of times disputed; second dispute flips entry to REJECTED_FINAL", default: 0 }
      - { name: resubmit_count, type: integer, source: system, description: "Number of times resubmitted from DISPUTED", default: 0 }
      - { name: dispute_reason, type: string, source: system, description: "Reason from the most recent dispute; null until disputed", constraints: "nullable" }
      - { name: entry_value_cents, type: integer, source: computed, description: "Cost-share value of this entry per calculation entry_cost_share_value; fixed at creation and recomputed on resubmit; excluded from incident totals only while REJECTED_FINAL" }

  - name: RiskReport
    parent: null
    common_fields: true
    fields:
      - { name: subject_volunteer_id, type: string, source: input, required: true, description: "FK -> Volunteer.id; volunteer the report is about" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the creator; segregation-of-duties target" }
      - { name: severity, type: enum, source: input, required: true, description: "LOW | MEDIUM | HIGH | CRITICAL", constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}" }
      - { name: category, type: enum, source: input, required: true, description: "SAFETY_VIOLATION | MISCONDUCT | NO_SHOW_PATTERN | OTHER", constraints: "one of the four categories" }
      - { name: description, type: string, source: input, required: true, description: "Free-text narrative" }
      - { name: occurred_at, type: datetime, source: input, required: true, description: "When the reported conduct occurred (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "FILED | SUBSTANTIATED | DISMISSED", default: FILED }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the RiskOfficer who substantiated/dismissed; null until then", constraints: "nullable" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of SUBSTANTIATED/DISMISSED; risk-score decay ages from this instant", constraints: "nullable" }
      - { name: points_awarded, type: integer, source: system, description: "Risk points granted on substantiation: LOW=5, MEDIUM=15, HIGH=30, CRITICAL=60; null unless SUBSTANTIATED", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table (13 machines)
# "posture recompute" side effect = recalculate Incident.operational_posture per
# calculation posture_derivation. "suspension cascade" = the side-effect list of
# the Volunteer -> SUSPENDED transition, reused wherever referenced.
# =============================================================================
state_machines:
  - entity: Incident
    initial_state: ACTIVATION        # lifecycle_status dimension
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVATION
        to: ACTIVE
        trigger: "POST /vrc/incidents/{incidentId}/activate"
        actor: VRCManager
        preconditions:
          - "lifecycle_status == ACTIVATION (else ERR_INVALID_STATE)"
        side_effects:
          - "activated_at := logical clock now"
          - "posture recompute"
      - from: ACTIVE
        to: DEMOBILIZATION
        trigger: "POST /vrc/incidents/{incidentId}/begin-demobilization"
        actor: VRCManager
        preconditions:
          - "lifecycle_status == ACTIVE (else ERR_INVALID_STATE)"
          - "No DeploymentAssignment of this incident in CHECKED_IN (else ERR_OPEN_ASSIGNMENTS)"
        side_effects:
          - "demobilized_at := logical clock now"
          - "Intake/matching writes now rejected with ERR_INCIDENT_DEMOBILIZING (see validations P5b)"
      - from: DEMOBILIZATION
        to: CLOSED
        trigger: "POST /vrc/incidents/{incidentId}/close"
        actor: VRCManager
        preconditions:
          - "lifecycle_status == DEMOBILIZATION (else ERR_INVALID_STATE)"
          - "All Volunteers of this incident in {DEMOBILIZED, WITHDRAWN, REJECTED}"
          - "All SupportRequests of this incident in {COMPLETED, CANCELLED}"
          - "All HourEntries of this incident's assignments in {VERIFIED, REJECTED_FINAL}"
          - "All PPEIssuances of this incident's volunteers in {RETURNED, DAMAGED, LOST}"
          - "All TransportTrips of this incident in {ARRIVED, CANCELLED}"
          - "All SiteShifts of this incident in {CANCELLED}"
          - "Any unmet condition -> ERR_INCIDENT_CLOSING_BLOCKED"
        side_effects:
          - "closed_at := logical clock now"
          - "operational_posture frozen at its final value; incident becomes read-only"
    # Parallel dimension: operational_posture (OPEN | RESTRICTED | FROZEN) is a
    # computed state orthogonal to lifecycle_status. It re-derives on: risk
    # report substantiation, support-request publish/fill/cancel/complete,
    # shift open-roster/cancel, and every clock-set sweep. It has no explicit
    # transitions of its own; see calculation posture_derivation.

  - entity: Volunteer
    initial_state: REGISTERED
    terminal_states: [DEMOBILIZED, WITHDRAWN, REJECTED]
    transitions:
      - from: REGISTERED
        to: VETTING
        trigger: "POST /vrc/volunteers/{volunteerId}/submit-for-vetting"
        actor: IntakeCoordinator
        preconditions:
          - "status == REGISTERED (else ERR_INVALID_STATE)"
          - "Incident lifecycle_status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE / ERR_INCIDENT_DEMOBILIZING per P5)"
          - "At least one SkillCredential of this volunteer in any status exists (else ERR_NO_CREDENTIALS_CLAIMED)"
        side_effects: []
      - from: VETTING
        to: CLEARED
        trigger: "system (automatic, evaluated after every BackgroundCheck and SkillCredential mutation on this volunteer)"
        actor: system
        preconditions:
          - "Exists BackgroundCheck of this volunteer in CLEARED with expires_at > now"
          - "At least one SkillCredential of this volunteer in VERIFIED"
        side_effects: []
      - from: CLEARED
        to: VETTING
        trigger: "system (automatic regression when the auto-promotion precondition stops holding, e.g., clock sweep expires the last CLEARED BackgroundCheck or the last VERIFIED SkillCredential)"
        actor: system
        preconditions:
          - "No BackgroundCheck in CLEARED with expires_at > now, OR zero SkillCredentials in VERIFIED"
        side_effects: []
      - from: CLEARED
        to: READY
        trigger: "POST /vrc/volunteers/{volunteerId}/mark-ready"
        actor: IntakeCoordinator
        preconditions:
          - "status == CLEARED (else ERR_INVALID_STATE)"
          - "Exists Clearance(SAFETY_BRIEFING) ACTIVE with valid_until > now"
          - "Exists Clearance(LIABILITY_WAIVER) ACTIVE"
          - "Exists BackgroundCheck CLEARED with expires_at > now"
          - "At least one SkillCredential VERIFIED"
          - "Any missing prerequisite -> ERR_READINESS_INCOMPLETE (message names each missing item)"
        side_effects: []
      - from: READY
        to: DEPLOYED
        trigger: "system (automatic when this volunteer's first DeploymentAssignment enters CHECKED_IN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLOYED
        to: READY
        trigger: "system (automatic when this volunteer's last CHECKED_IN DeploymentAssignment leaves CHECKED_IN via complete/recall)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: CLEARED
        trigger: "system (cascade: Clearance(LIABILITY_WAIVER) of this volunteer is REVOKED while volunteer is READY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VETTING
        to: REJECTED
        trigger: "system (cascade: a BackgroundCheck of this volunteer is FLAGGED while volunteer is VETTING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: SUSPENDED
        trigger: "POST /vrc/volunteers/{volunteerId}/suspend OR system (current_risk_score >= 50 after a substantiation) OR system (BackgroundCheck FLAGGED while CLEARED)"
        actor: RiskOfficer
        preconditions:
          - "status in {VETTING, CLEARED, READY, DEPLOYED} (else ERR_INVALID_STATE)"
        side_effects:
          - "SUSPENSION CASCADE, applied in this exact order:"
          - "1. Each DeploymentAssignment of this volunteer in {PROPOSED, ACCEPTED, CONFIRMED} -> CANCELLED; each in CHECKED_IN -> RECALLED"
          - "2. Per cancelled/recalled assignment: volunteer.committed_hours released; parent SupportRequest.filled_count recomputed (FILLED -> MATCHING if filled_count < headcount_needed; MATCHING -> OPEN if filled_count == 0 and no assignments remain in {PROPOSED, ACCEPTED}); parent SiteShift.rostered_count recomputed (LOCKED -> OPEN_FOR_ROSTER if rostered_count < capacity)"
          - "3. Each SeatBooking of this volunteer in {BOOKED, BOARDED} -> CANCELLED; owning TransportTrip.booked_seats recomputed"
          - "4. Incident posture recompute"
        note: "Same transition shape applies from VETTING, READY, DEPLOYED (precondition list identical; only the from-state differs)"
      - from: READY
        to: SUSPENDED
        trigger: "same as CLEARED -> SUSPENDED"
        actor: RiskOfficer
        preconditions: ["status in {VETTING, CLEARED, READY, DEPLOYED} (else ERR_INVALID_STATE)"]
        side_effects: ["SUSPENSION CASCADE as defined on CLEARED -> SUSPENDED"]
      - from: DEPLOYED
        to: SUSPENDED
        trigger: "same as CLEARED -> SUSPENDED"
        actor: RiskOfficer
        preconditions: ["status in {VETTING, CLEARED, READY, DEPLOYED} (else ERR_INVALID_STATE)"]
        side_effects: ["SUSPENSION CASCADE as defined on CLEARED -> SUSPENDED (CHECKED_IN assignments become RECALLED)"]
      - from: VETTING
        to: SUSPENDED
        trigger: "same as CLEARED -> SUSPENDED"
        actor: RiskOfficer
        preconditions: ["status in {VETTING, CLEARED, READY, DEPLOYED} (else ERR_INVALID_STATE)"]
        side_effects: ["SUSPENSION CASCADE as defined on CLEARED -> SUSPENDED"]
      - from: SUSPENDED
        to: VETTING
        trigger: "POST /vrc/volunteers/{volunteerId}/reinstate"
        actor: RiskOfficer
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_STATE)"
          - "lifetime_risk_score < 100 (else ERR_VOLUNTEER_BLACKLISTED)"
          - "Exists a BackgroundCheck of this volunteer in REQUESTED (a fresh re-vetting check; else ERR_INVALID_STATE)"
        side_effects: []
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /vrc/volunteers/{volunteerId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "status in {REGISTERED, VETTING, CLEARED, READY} (else ERR_INVALID_STATE)"
          - "If actor role is Volunteer, X-User-ID must equal this volunteer's id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Each DeploymentAssignment in {PROPOSED, ACCEPTED, CONFIRMED} -> CANCELLED with committed-hours / filled_count / rostered_count release (same release steps as suspension cascade items 1-2 and 4; no RECALLED conversion)"
          - "Each SeatBooking in {BOOKED, BOARDED} -> CANCELLED; owning trip booked_seats recomputed"
        note: "Same transition shape applies from VETTING, CLEARED, READY"
      - from: VETTING
        to: WITHDRAWN
        trigger: "POST /vrc/volunteers/{volunteerId}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["status in {REGISTERED, VETTING, CLEARED, READY} (else ERR_INVALID_STATE)", "Volunteer-role ownership check as above"]
        side_effects: ["same release cascade as REGISTERED -> WITHDRAWN"]
      - from: CLEARED
        to: WITHDRAWN
        trigger: "POST /vrc/volunteers/{volunteerId}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["status in {REGISTERED, VETTING, CLEARED, READY} (else ERR_INVALID_STATE)", "Volunteer-role ownership check as above"]
        side_effects: ["same release cascade as REGISTERED -> WITHDRAWN"]
      - from: READY
        to: WITHDRAWN
        trigger: "POST /vrc/volunteers/{volunteerId}/withdraw"
        actor: IntakeCoordinator
        preconditions: ["status in {REGISTERED, VETTING, CLEARED, READY} (else ERR_INVALID_STATE)", "Volunteer-role ownership check as above"]
        side_effects: ["same release cascade as REGISTERED -> WITHDRAWN"]
      - from: CLEARED
        to: DEMOBILIZED
        trigger: "POST /vrc/volunteers/{volunteerId}/demobilize"
        actor: VRCManager
        preconditions:
          - "status in {CLEARED, READY, SUSPENDED} (else ERR_INVALID_STATE)"
          - "Incident lifecycle_status in {ACTIVE, DEMOBILIZATION} (else ERR_INCIDENT_NOT_ACTIVE)"
          - "No DeploymentAssignment of this volunteer in {PROPOSED, ACCEPTED, CONFIRMED, CHECKED_IN} (else ERR_OPEN_ASSIGNMENTS)"
          - "No PPEIssuance of this volunteer in ISSUED (else ERR_UNRETURNED_PPE)"
        side_effects:
          - "recognition_tier := recognition_tier calculation over verified_hours_total and lifetime_risk_score"
          - "demobilized_at := logical clock now"
        note: "Same transition shape applies from READY and SUSPENDED"
      - from: READY
        to: DEMOBILIZED
        trigger: "POST /vrc/volunteers/{volunteerId}/demobilize"
        actor: VRCManager
        preconditions: ["same as CLEARED -> DEMOBILIZED"]
        side_effects: ["same as CLEARED -> DEMOBILIZED"]
      - from: SUSPENDED
        to: DEMOBILIZED
        trigger: "POST /vrc/volunteers/{volunteerId}/demobilize"
        actor: VRCManager
        preconditions: ["same as CLEARED -> DEMOBILIZED"]
        side_effects: ["same as CLEARED -> DEMOBILIZED"]

  - entity: SkillCredential
    initial_state: CLAIMED
    terminal_states: [REJECTED]
    transitions:
      - from: CLAIMED
        to: VERIFIED
        trigger: "POST /vrc/credentials/{credentialId}/verify"
        actor: VettingOfficer
        preconditions:
          - "status in {CLAIMED, EXPIRED} (else ERR_INVALID_STATE)"
          - "Parent Volunteer not in {WITHDRAWN, REJECTED, DEMOBILIZED} (else ERR_INVALID_STATE)"
        side_effects:
          - "verified_by_user_id := X-User-ID; verified_at := now"
          - "Volunteer VETTING->CLEARED auto-transition re-evaluated"
        note: "EXPIRED -> VERIFIED is the credential-renewal loop (same endpoint, same preconditions)"
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /vrc/credentials/{credentialId}/verify"
        actor: VettingOfficer
        preconditions: ["same as CLAIMED -> VERIFIED"]
        side_effects: ["same as CLAIMED -> VERIFIED"]
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /vrc/credentials/{credentialId}/reject"
        actor: VettingOfficer
        preconditions:
          - "status in {CLAIMED, EXPIRED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: EXPIRED
        to: REJECTED
        trigger: "POST /vrc/credentials/{credentialId}/reject"
        actor: VettingOfficer
        preconditions: ["status in {CLAIMED, EXPIRED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (clock sweep on POST /vrc/_clock/set_current_utc: VERIFIED credential with expires_at <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "If this was the volunteer's last VERIFIED credential and volunteer is CLEARED: CLEARED -> VETTING regression"

  - entity: BackgroundCheck
    initial_state: REQUESTED
    terminal_states: [FLAGGED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: CLEARED
        trigger: "POST /vrc/background-checks/{checkId}/clear"
        actor: VettingOfficer
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != subject Volunteer.registered_by_user_id (else ERR_SOD_CLEARANCE_VIOLATION)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; adjudicated_at := now; expires_at := now + 720h"
          - "Volunteer VETTING->CLEARED auto-transition re-evaluated"
      - from: REQUESTED
        to: FLAGGED
        trigger: "POST /vrc/background-checks/{checkId}/flag"
        actor: VettingOfficer
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != subject Volunteer.registered_by_user_id (else ERR_SOD_CLEARANCE_VIOLATION)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; adjudicated_at := now"
          - "If volunteer VETTING: volunteer -> REJECTED"
          - "If volunteer in {CLEARED, READY, DEPLOYED}: volunteer -> SUSPENDED with SUSPENSION CASCADE"
          - "Incident posture recompute"
      - from: CLEARED
        to: EXPIRED
        trigger: "system (clock sweep: CLEARED check with expires_at <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "If no other CLEARED unexpired BackgroundCheck remains and volunteer is CLEARED: CLEARED -> VETTING regression"

  - entity: Clearance
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /vrc/clearances/{clearanceId}/revoke"
        actor: RiskOfficer
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "revoked_reason := input reason"
          - "If clearance_type == LIABILITY_WAIVER and volunteer is READY: volunteer READY -> CLEARED"
          - "If clearance_type == LIABILITY_WAIVER and volunteer is DEPLOYED: volunteer -> SUSPENDED with SUSPENSION CASCADE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: SAFETY_BRIEFING clearance with valid_until <= now; LIABILITY_WAIVER never expires)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupportRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /vrc/support-requests/{requestId}/publish"
        actor: AgencyCoordinator
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "Incident lifecycle_status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE / ERR_INCIDENT_DEMOBILIZING per P5)"
        side_effects: ["Incident posture recompute"]
      - from: OPEN
        to: MATCHING
        trigger: "system (automatic: auto-match or manual assignment creation leaves at least one non-terminal assignment for this request)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MATCHING
        to: OPEN
        trigger: "system (automatic regression: filled_count == 0 and no assignments remain in {PROPOSED, ACCEPTED})"
        actor: system
        preconditions: []
        side_effects: ["Incident posture recompute"]
      - from: MATCHING
        to: FILLED
        trigger: "system (automatic: filled_count reaches headcount_needed, i.e., filled_count == headcount_needed)"
        actor: system
        preconditions: []
        side_effects: ["Incident posture recompute"]
      - from: OPEN
        to: FILLED
        trigger: "system (automatic: filled_count == headcount_needed reached directly from OPEN, e.g., single manual confirm filling a headcount-1 request)"
        actor: system
        preconditions: []
        side_effects: ["Incident posture recompute"]
      - from: FILLED
        to: MATCHING
        trigger: "system (automatic regression: filled_count drops below headcount_needed after cancel/no-show/recall/suspension cascade)"
        actor: system
        preconditions: []
        side_effects: ["Incident posture recompute"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /vrc/support-requests/{requestId}/cancel"
        actor: AgencyCoordinator
        preconditions:
          - "status in {OPEN, MATCHING, FILLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Each DeploymentAssignment of this request in {PROPOSED, ACCEPTED, CONFIRMED} -> CANCELLED; CHECKED_IN -> RECALLED; committed-hours / rostered_count release per assignment"
          - "Each SeatBooking on those assignments in {BOOKED, BOARDED} -> CANCELLED; owning trip booked_seats recomputed"
          - "Incident posture recompute"
        note: "Same transition shape applies from MATCHING and FILLED"
      - from: MATCHING
        to: CANCELLED
        trigger: "POST /vrc/support-requests/{requestId}/cancel"
        actor: AgencyCoordinator
        preconditions: ["status in {OPEN, MATCHING, FILLED} (else ERR_INVALID_STATE)"]
        side_effects: ["same cancellation cascade as OPEN -> CANCELLED"]
      - from: FILLED
        to: CANCELLED
        trigger: "POST /vrc/support-requests/{requestId}/cancel"
        actor: AgencyCoordinator
        preconditions: ["status in {OPEN, MATCHING, FILLED} (else ERR_INVALID_STATE)"]
        side_effects: ["same cancellation cascade as OPEN -> CANCELLED"]
      - from: MATCHING
        to: COMPLETED
        trigger: "POST /vrc/support-requests/{requestId}/complete"
        actor: AgencyCoordinator
        preconditions:
          - "status in {MATCHING, FILLED} (else ERR_INVALID_STATE)"
          - "No assignment of this request in {PROPOSED, ACCEPTED, CONFIRMED, CHECKED_IN} (else ERR_OPEN_ASSIGNMENTS)"
          - "No HourEntry on this request's assignments in {SUBMITTED, DISPUTED} (else ERR_HOURS_UNRESOLVED)"
        side_effects: ["Incident posture recompute"]
        note: "Same transition shape applies from FILLED"
      - from: FILLED
        to: COMPLETED
        trigger: "POST /vrc/support-requests/{requestId}/complete"
        actor: AgencyCoordinator
        preconditions: ["same as MATCHING -> COMPLETED"]
        side_effects: ["Incident posture recompute"]

  - entity: SiteShift
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN_FOR_ROSTER
        trigger: "POST /vrc/shifts/{shiftId}/open-roster"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Incident lifecycle_status == ACTIVE (else ERR_INCIDENT_NOT_ACTIVE / ERR_INCIDENT_DEMOBILIZING per P5)"
          - "now < end_at (else ERR_SHIFT_WINDOW_PASSED)"
        side_effects: ["Incident posture recompute"]
      - from: OPEN_FOR_ROSTER
        to: LOCKED
        trigger: "system (automatic: rostered_count reaches capacity, rostered_count == capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: OPEN_FOR_ROSTER
        trigger: "system (automatic regression: rostered_count drops below capacity after cancel/no-show/recall/suspension)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vrc/shifts/{shiftId}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "status in {SCHEDULED, OPEN_FOR_ROSTER, LOCKED} (else ERR_INVALID_STATE)"
        side_effects:
          - "SHIFT CANCELLATION CASCADE, in this exact order:"
          - "1. Each DeploymentAssignment on this shift in {PROPOSED, ACCEPTED, CONFIRMED} -> CANCELLED; CHECKED_IN -> RECALLED; per assignment: volunteer.committed_hours released; SupportRequest.filled_count recomputed (FILLED -> MATCHING if below headcount; MATCHING -> OPEN if empty of {PROPOSED, ACCEPTED} and filled_count == 0)"
          - "2. Each TransportTrip with site_shift_id == this shift in {SCHEDULED} -> CANCELLED; DEPARTED trips are unaffected"
          - "3. Each SeatBooking on those trips in {BOOKED, BOARDED} -> CANCELLED; trip booked_seats recomputed"
          - "4. Incident posture recompute"
        note: "Same transition shape applies from OPEN_FOR_ROSTER and LOCKED"
      - from: OPEN_FOR_ROSTER
        to: CANCELLED
        trigger: "POST /vrc/shifts/{shiftId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in {SCHEDULED, OPEN_FOR_ROSTER, LOCKED} (else ERR_INVALID_STATE)"]
        side_effects: ["SHIFT CANCELLATION CASCADE as defined on SCHEDULED -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /vrc/shifts/{shiftId}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["status in {SCHEDULED, OPEN_FOR_ROSTER, LOCKED} (else ERR_INVALID_STATE)"]
        side_effects: ["SHIFT CANCELLATION CASCADE as defined on SCHEDULED -> CANCELLED"]

  - entity: DeploymentAssignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED, DECLINED, NO_SHOW, RECALLED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /vrc/assignments/{assignmentId}/accept"
        actor: Volunteer
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "X-User-ID == this assignment's volunteer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /vrc/assignments/{assignmentId}/decline"
        actor: Volunteer
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "X-User-ID == this assignment's volunteer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "SupportRequest recompute: MATCHING -> OPEN if filled_count == 0 and no {PROPOSED, ACCEPTED} assignments remain"
          - "Incident posture recompute"
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /vrc/assignments/{assignmentId}/confirm"
        actor: IntakeCoordinator
        preconditions:
          - "status == ACCEPTED (else ERR_INVALID_STATE)"
          - "Incident operational_posture != FROZEN (else ERR_POSTURE_FROZEN)"
          - "SiteShift.status in {OPEN_FOR_ROSTER} (LOCKED fails with ERR_SHIFT_CAPACITY_REACHED; CANCELLED/SCHEDULED fail with ERR_INVALID_STATE)"
          - "SiteShift.rostered_count < SiteShift.capacity (else ERR_SHIFT_CAPACITY_REACHED)"
          - "Re-run of the business_safety checks of POST /vrc/assignments (skill match, class minimum, hazard gating, BackgroundCheck still CLEARED-unexpired)"
          - "Re-run of the volunteer double-booking check against this volunteer's other assignments in {CONFIRMED, CHECKED_IN} (else ERR_DOUBLE_BOOKED_SHIFT)"
          - "committed_hours + shift.duration_hours <= 40.00 (else ERR_WEEKLY_HOUR_CAP; equality allowed)"
        side_effects:
          - "volunteer.committed_hours += shift.duration_hours"
          - "shift.rostered_count += 1; if rostered_count == capacity: shift -> LOCKED"
          - "request.filled_count += 1; if filled_count == headcount_needed: request OPEN/MATCHING -> FILLED; else if request OPEN: request -> MATCHING"
          - "Incident posture recompute"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /vrc/assignments/{assignmentId}/check-in"
        actor: SiteSupervisor
        preconditions:
          - "status == CONFIRMED (else ERR_INVALID_STATE)"
          - "Incident operational_posture != FROZEN (else ERR_POSTURE_FROZEN)"
          - "SiteShift.status in {OPEN_FOR_ROSTER, LOCKED} (else ERR_INVALID_STATE)"
          - "shift.start_at - 30min <= now <= shift.end_at (else ERR_OUTSIDE_CHECKIN_WINDOW)"
          - "Volunteer has Clearance(SAFETY_BRIEFING) ACTIVE with valid_until > now (else ERR_BRIEFING_NOT_CURRENT)"
          - "Volunteer has Clearance(LIABILITY_WAIVER) ACTIVE (else ERR_WAIVER_NOT_SIGNED)"
          - "Volunteer has at least one PPEIssuance in ISSUED (else ERR_PPE_NOT_ISSUED)"
        side_effects:
          - "checked_in_at := now"
          - "If volunteer READY: volunteer -> DEPLOYED"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /vrc/assignments/{assignmentId}/complete"
        actor: SiteSupervisor
        preconditions:
          - "status == CHECKED_IN (else ERR_INVALID_STATE)"
        side_effects:
          - "completed_at := now"
          - "volunteer.committed_hours -= shift.duration_hours"
          - "If volunteer has no other CHECKED_IN assignments: volunteer DEPLOYED -> READY"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /vrc/assignments/{assignmentId}/no-show"
        actor: SiteSupervisor
        preconditions:
          - "status == CONFIRMED (else ERR_INVALID_STATE)"
          - "now >= shift.end_at (else ERR_TOO_EARLY_FOR_NO_SHOW)"
        side_effects:
          - "volunteer.committed_hours -= shift.duration_hours"
          - "shift.rostered_count -= 1 (LOCKED -> OPEN_FOR_ROSTER regression if below capacity)"
          - "request.filled_count -= 1 (FILLED -> MATCHING regression if below headcount_needed; MATCHING -> OPEN if empty)"
          - "volunteer risk: +10 NO_SHOW points recorded with event time = shift.end_at (feeds volunteer_risk_score)"
          - "Incident posture recompute"
      - from: CHECKED_IN
        to: RECALLED
        trigger: "POST /vrc/assignments/{assignmentId}/recall"
        actor: RiskOfficer
        preconditions:
          - "status == CHECKED_IN (else ERR_INVALID_STATE)"
        side_effects:
          - "volunteer.committed_hours -= shift.duration_hours"
          - "shift.rostered_count -= 1 and request.filled_count -= 1 with the same auto-regressions as no-show"
          - "If volunteer has no other CHECKED_IN assignments: volunteer DEPLOYED -> READY"
          - "Incident posture recompute"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /vrc/assignments/{assignmentId}/cancel OR cascade (shift cancel, request cancel, volunteer suspend/withdraw)"
        actor: IntakeCoordinator
        preconditions:
          - "status in {PROPOSED, ACCEPTED, CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects:
          - "If was CONFIRMED: volunteer.committed_hours -= shift.duration_hours; shift.rostered_count -= 1 (LOCKED regression); request.filled_count -= 1 (FILLED/MATCHING regressions)"
          - "If was PROPOSED/ACCEPTED: request MATCHING -> OPEN regression if it becomes empty"
          - "SeatBookings of this assignment in {BOOKED, BOARDED} -> CANCELLED; owning trip booked_seats recomputed"
          - "Incident posture recompute"
        note: "Same transition shape applies from ACCEPTED and CONFIRMED"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "same as PROPOSED -> CANCELLED"
        actor: IntakeCoordinator
        preconditions: ["status in {PROPOSED, ACCEPTED, CONFIRMED} (else ERR_INVALID_STATE)"]
        side_effects: ["same cancellation release as PROPOSED -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "same as PROPOSED -> CANCELLED"
        actor: IntakeCoordinator
        preconditions: ["status in {PROPOSED, ACCEPTED, CONFIRMED} (else ERR_INVALID_STATE)"]
        side_effects: ["same cancellation release as PROPOSED -> CANCELLED"]

  - entity: TransportTrip
    initial_state: SCHEDULED
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /vrc/trips/{tripId}/depart"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Incident operational_posture != FROZEN (else ERR_POSTURE_FROZEN)"
        side_effects: []
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /vrc/trips/{tripId}/arrive"
        actor: LogisticsCoordinator
        preconditions:
          - "status == DEPARTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vrc/trips/{tripId}/cancel OR cascade (owning SiteShift cancelled)"
        actor: LogisticsCoordinator
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE; DEPARTED trips cannot be cancelled)"
        side_effects:
          - "Each SeatBooking of this trip in {BOOKED, BOARDED} -> CANCELLED"
          - "booked_seats recomputed (to 0)"

  - entity: SeatBooking
    initial_state: BOOKED
    terminal_states: [BOARDED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: BOARDED
        trigger: "POST /vrc/seat-bookings/{bookingId}/board"
        actor: SiteSupervisor
        preconditions:
          - "status == BOOKED (else ERR_INVALID_STATE)"
          - "TransportTrip.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Volunteer has Clearance(SAFETY_BRIEFING) ACTIVE with valid_until > now (else ERR_BRIEFING_NOT_CURRENT)"
          - "Volunteer has Clearance(LIABILITY_WAIVER) ACTIVE (else ERR_WAIVER_NOT_SIGNED)"
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /vrc/seat-bookings/{bookingId}/mark-no-show"
        actor: SiteSupervisor
        preconditions:
          - "status == BOOKED (else ERR_INVALID_STATE)"
          - "TransportTrip.status == DEPARTED (else ERR_INVALID_STATE)"
        side_effects:
          - "trip.booked_seats -= 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /vrc/seat-bookings/{bookingId}/cancel OR cascade (trip cancel, assignment cancel, volunteer suspend/withdraw)"
        actor: LogisticsCoordinator
        preconditions:
          - "status in {BOOKED, BOARDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "trip.booked_seats -= 1"
        note: "BOARDED -> CANCELLED is cascade-only (volunteer suspension/withdrawal pulls boarded volunteers off the manifest)"
      - from: BOARDED
        to: CANCELLED
        trigger: "cascade only (volunteer suspend/withdraw)"
        actor: system
        preconditions: []
        side_effects: ["trip.booked_seats -= 1"]

  - entity: PPEIssuance
    initial_state: ISSUED
    terminal_states: [RETURNED, DAMAGED, LOST]
    transitions:
      - from: ISSUED
        to: RETURNED
        trigger: "POST /vrc/ppe-issuances/{issuanceId}/close with outcome=RETURNED"
        actor: LogisticsCoordinator
        preconditions:
          - "status == ISSUED (else ERR_INVALID_STATE)"
        side_effects:
          - "Incident ppe_stock[item_type] += quantity (compensating restore)"
          - "closed_at := now"
      - from: ISSUED
        to: DAMAGED
        trigger: "POST /vrc/ppe-issuances/{issuanceId}/close with outcome=DAMAGED"
        actor: LogisticsCoordinator
        preconditions:
          - "status == ISSUED (else ERR_INVALID_STATE)"
        side_effects: ["closed_at := now (stock NOT restored)"]
      - from: ISSUED
        to: LOST
        trigger: "POST /vrc/ppe-issuances/{issuanceId}/close with outcome=LOST"
        actor: LogisticsCoordinator
        preconditions:
          - "status == ISSUED (else ERR_INVALID_STATE)"
        side_effects: ["closed_at := now (stock NOT restored)"]

  - entity: HourEntry
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED_FINAL]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /vrc/hour-entries/{entryId}/verify"
        actor: SiteSupervisor
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != entry.submitted_by_user_id (else ERR_SOD_HOUR_VERIFICATION)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "volunteer.verified_hours_total += hours"
          - "Incident cost-share fields recomputed (entry enters the verified-only input set; it was already inside the provisional input set)"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /vrc/hour-entries/{entryId}/dispute (first dispute: dispute_count becomes 1)"
        actor: SiteSupervisor
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != entry.submitted_by_user_id (else ERR_SOD_HOUR_VERIFICATION)"
        side_effects:
          - "dispute_count += 1; dispute_reason := input reason"
          - "Incident provisional_cost_share_cents unchanged (DISPUTED remains inside the provisional input set)"
      - from: SUBMITTED
        to: REJECTED_FINAL
        trigger: "POST /vrc/hour-entries/{entryId}/dispute (second dispute: dispute_count becomes 2)"
        actor: SiteSupervisor
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != entry.submitted_by_user_id (else ERR_SOD_HOUR_VERIFICATION)"
          - "dispute_count == 1 already (enforced by transition shape: only a resubmitted entry can be disputed again)"
        side_effects:
          - "dispute_count := 2; dispute_reason := input reason"
          - "Incident provisional_cost_share_cents -= entry_value_cents (entry leaves the provisional input set)"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /vrc/hour-entries/{entryId}/resubmit"
        actor: Volunteer
        preconditions:
          - "status == DISPUTED (else ERR_INVALID_STATE)"
          - "If actor role is Volunteer: X-User-ID == assignment.volunteer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "New hours satisfy the same shape rules as creation (else ERR_INVALID_REQUEST)"
        side_effects:
          - "hours := input hours; resubmit_count += 1; entry_value_cents recomputed"
          - "submitted_by_user_id UNCHANGED (original submitter remains the SoD target)"
          - "Incident provisional_cost_share_cents adjusted by the entry_value_cents delta"

  - entity: RiskReport
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: FILED
        to: SUBSTANTIATED
        trigger: "POST /vrc/risk-reports/{reportId}/substantiate"
        actor: RiskOfficer
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != report.reporter_user_id (else ERR_SOD_RISK_ADJUDICATION)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; adjudicated_at := now"
          - "points_awarded := severity mapping {LOW: 5, MEDIUM: 15, HIGH: 30, CRITICAL: 60}"
          - "volunteer.current_risk_score and lifetime_risk_score recomputed (lifetime += points_awarded)"
          - "If volunteer.current_risk_score >= 50 and volunteer in {CLEARED, READY, DEPLOYED}: volunteer -> SUSPENDED with SUSPENSION CASCADE"
          - "Incident posture recompute (a CRITICAL substantiation inside the rolling 24h window forces FROZEN)"
      - from: FILED
        to: DISMISSED
        trigger: "POST /vrc/risk-reports/{reportId}/dismiss"
        actor: RiskOfficer
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != report.reporter_user_id (else ERR_SOD_RISK_ADJUDICATION)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; adjudicated_at := now"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: volunteer-profile-patch-occ
    parent_entity: Volunteer
    write_endpoint: "PATCH /vrc/volunteers/{volunteerId}"
    occ_field: expected_volunteer_version
    description: |
      Patching a Volunteer profile (phone/email/home_locality) with an
      expected_volunteer_version lower than the volunteer's current version is
      rejected. This captures the case where another writer has mutated the
      volunteer record (profile edit, status change, or any cascaded field
      update) since the client last observed it, making the client's base
      revision stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: support-request-edit-occ
    parent_entity: SupportRequest
    write_endpoint: "PUT /vrc/support-requests/{requestId}"
    occ_field: expected_support_request_version
    description: |
      Editing a DRAFT/OPEN SupportRequest with an expected_support_request_version
      lower than the request's current version is rejected. Assignment
      confirmations and auto-match activity bump the request's version via
      filled_count recomputes, so a client's previously observed version goes
      stale and its blind edit must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (10 rules)
# All datetimes are logical-clock ISO 8601 UTC. All money is integer cents.
# No selector/ranking/tie-break may ever use entity id; deterministic fallbacks
# use created_at ASC then last_name/first_name ASC where noted.
# =============================================================================
calculations:
  - name: shift_duration_hours
    trigger: "SiteShift creation (stored as duration_hours); read by committed-hours and entry-value rules"
    algorithm: aggregation
    formula: |
      duration_hours = (end_at - start_at) / 3600 seconds, expressed with exactly
      2 decimal places. Validation guarantees end_at > start_at and duration >= 0.25.
    input_set: "the SiteShift being created"
    precision: "2 decimal places, round_half_up"

  - name: volunteer_committed_hours
    trigger: "DeploymentAssignment confirm (add), complete/no-show/recall/cancel of a CONFIRMED or CHECKED_IN assignment (release)"
    algorithm: aggregation
    formula: |
      Volunteer.committed_hours =
        SUM(SiteShift.duration_hours)
        over DeploymentAssignments a WHERE a.volunteer_id == volunteer.id
          AND a.status IN {CONFIRMED, CHECKED_IN}
      Confirm adds the shift's duration; complete/no-show/recall/cancel releases it.
      INVARIANT (compensating pair): confirm followed by cancel of the same
      assignment returns committed_hours to its pre-confirm value exactly.
    input_set: "assignments of the volunteer in {CONFIRMED, CHECKED_IN} only; PROPOSED/ACCEPTED never contribute"
    precision: "2 decimal places, round_half_up"

  - name: weekly_committed_cap_check
    trigger: "DeploymentAssignment confirm (POST /vrc/assignments/{id}/confirm)"
    algorithm: threshold
    formula: |
      projected = volunteer.committed_hours + assignment.shift.duration_hours
      if projected > 40.00: reject ERR_WEEKLY_HOUR_CAP
      if projected == 40.00 exactly: ALLOWED (boundary is inclusive)
    input_set: "volunteer's current committed_hours plus the candidate shift duration"
    constants:
      COMMITTED_HOUR_CAP: 40.00
    precision: "2 decimal places"

  - name: entry_cost_share_value
    trigger: "HourEntry creation; recomputed on resubmit with new hours"
    algorithm: tiered_pricing
    formula: |
      rate_class = credential_class of the volunteer's VERIFIED SkillCredential
                   whose skill_code == the assignment's SupportRequest.required_skill
                   (the qualifying credential; uniqueness guaranteed by assignment
                   creation validation)
      rate = RATE_STANDARD_CENTS if rate_class == STANDARD else RATE_ADVANCED_CENTS
      normal_hours = min(hours, OT_DAILY_THRESHOLD)
      overtime_hours = hours - normal_hours
      entry_value_cents = round_half_up(normal_hours * rate + overtime_hours * rate * OT_MULTIPLIER)
    input_set: "the single HourEntry; its assignment; the qualifying credential"
    constants:
      RATE_STANDARD_CENTS: 2800
      RATE_ADVANCED_CENTS: 4600
      OT_DAILY_THRESHOLD: 8.0
      OT_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up applied once per entry BEFORE any summation"

  - name: incident_cost_share_rollup
    trigger: "HourEntry create / verify / dispute / resubmit; read on GET /vrc/incidents/{id}"
    algorithm: aggregation
    formula: |
      Per-entry values are always rounded to integer cents first (see
      entry_cost_share_value); the rollup then sums integer cents only.
      provisional_cost_share_cents =
        SUM(entry_value_cents) over HourEntries of this incident's assignments
        with status IN {SUBMITTED, DISPUTED, VERIFIED}
      verified_cost_share_cents =
        SUM(entry_value_cents) over HourEntries with status == VERIFIED
      federal_share_cents = round_half_up(verified_cost_share_cents * 0.75)
      state_share_cents   = round_half_up(verified_cost_share_cents * 0.125)
      local_share_cents   = verified_cost_share_cents - federal_share_cents - state_share_cents
      EVALUATION ORDER (pinned): compute federal, then state, then local by
      subtraction. local_share_cents MUST NOT be computed as an independent
      rounding of total * 0.125.
    input_set: "HourEntries joined through DeploymentAssignment.incident_id == incident.id; status filter per variant"
    constants:
      FEDERAL_SHARE: 0.75
      STATE_SHARE: 0.125
      LOCAL_SHARE: 0.125
    precision: "integer cents; per-entry round_half_up before summation; per-share round_half_up with local remainder absorption"
    variants:
      - name: provisional
        when: "documentation-in-progress view used during the incident (input set includes unverified claims)"
        difference: "includes SUBMITTED and DISPUTED entries; diverges from verified whenever any non-VERIFIED, non-REJECTED_FINAL entry exists"
      - name: verified
        when: "audited final view used for federal cost-share documentation and close-out"
        difference: "VERIFIED entries only; strictly smaller than provisional when unverified claims exist; basis for the three share splits"

  - name: volunteer_risk_score
    trigger: "RiskReport substantiation; assignment no-show; clock-set sweep (decay re-evaluation); read on GET /vrc/volunteers/{id}"
    algorithm: decay_function
    formula: |
      Points sources, each with an event time t_event:
        (a) SUBSTANTIATED RiskReport: points_awarded by severity {LOW:5, MEDIUM:15, HIGH:30, CRITICAL:60}, t_event = adjudicated_at
        (b) NO_SHOW DeploymentAssignment: 10 points, t_event = the no-show shift's end_at
      Step decay for age_hours = (now - t_event) in hours:
        age_hours < 168            -> full points
        168 <= age_hours < 720     -> floor(points / 2)
        age_hours >= 720           -> 0
      current_risk_score = SUM(decayed points) over all sources; floor at 0.
      lifetime_risk_score = SUM(undecayed points) over all sources, forever.
      Suspension trigger: immediately after a substantiation, if
      current_risk_score >= SUSPEND_THRESHOLD and volunteer in {CLEARED, READY,
      DEPLOYED}: auto-suspend (see RiskReport SUBSTANTIATED side effects).
    input_set: "all SUBSTANTIATED RiskReports and all NO_SHOW DeploymentAssignments of the volunteer, regardless of age (decay zeroes old ones for the current variant)"
    constants:
      SUSPEND_THRESHOLD: 50
      BLACKLIST_THRESHOLD: 100
      NO_SHOW_PENALTY: 10
      DECAY_STEP1_HOURS: 168
      DECAY_STEP2_HOURS: 720
    precision: "integer points; floor division for the half-life step"
    variants:
      - name: current
        when: "operational risk decisions: auto-suspension, posture FROZEN window, gating"
        difference: "step-decayed; old substantiations and no-shows stop counting after 720h"
      - name: lifetime
        when: "reinstatement blacklist check (>= 100 -> ERR_VOLUNTEER_BLACKLISTED) and GOLD recognition cap"
        difference: "never decays; identical raw inputs yield lifetime >= current, with strict divergence once any source is older than 168h"

  - name: recognition_tier
    trigger: "POST /vrc/volunteers/{id}/demobilize (single evaluation at demobilization; result stored on Volunteer.recognition_tier)"
    algorithm: threshold
    formula: |
      base_tier = GOLD   if verified_hours_total >= 60.00
                  SILVER if verified_hours_total >= 24.00
                  BRONZE if verified_hours_total >= 8.00
                  NONE   otherwise
      Boundaries are INCLUSIVE (24.00 exactly -> SILVER).
      Risk cap: if base_tier == GOLD and lifetime_risk_score >= 20: tier = SILVER
      else tier = base_tier.
    input_set: "the demobilizing volunteer's verified_hours_total and lifetime_risk_score"
    constants:
      GOLD_HOURS: 60.00
      SILVER_HOURS: 24.00
      BRONZE_HOURS: 8.00
      GOLD_RISK_CAP: 20

  - name: posture_derivation
    trigger: "recomputed on: RiskReport substantiation; SupportRequest publish / filled_count change / cancel / complete; SiteShift open-roster / cancel; clock-set sweep"
    algorithm: threshold
    formula: |
      unfilled_critical = count of the incident's SupportRequests with
        criticality == CRITICAL AND status IN {OPEN, MATCHING}
      recent_critical_substantiation = exists RiskReport of a volunteer of this
        incident with status == SUBSTANTIATED, severity == CRITICAL, and
        adjudicated_at > now - 24h
      red_shift_open = exists SiteShift of this incident with hazard_level == RED
        AND status IN {OPEN_FOR_ROSTER, LOCKED}
      if recent_critical_substantiation: operational_posture = FROZEN
      elif unfilled_critical >= 3 OR red_shift_open: operational_posture = RESTRICTED
      else: operational_posture = OPEN
      FROZEN is evaluated strictly before RESTRICTED (FROZEN wins ties).
    input_set: "the incident's SupportRequests, SiteShifts, and its volunteers' RiskReports, with the status filters above"
    constants:
      CRITICAL_UNFILLED_THRESHOLD: 3
      FROZEN_WINDOW_HOURS: 24

  - name: auto_match_candidate_ranking
    trigger: "POST /vrc/support-requests/{requestId}/auto-match"
    algorithm: selector_policy
    formula: |
      ELIGIBILITY FILTER (all must hold for a candidate volunteer of the same incident):
        - Volunteer.status == READY
        - exists VERIFIED SkillCredential with skill_code == request.required_skill
          AND credential_class >= request.min_credential_class (ADVANCED >= STANDARD)
        - exists BackgroundCheck CLEARED with expires_at > now
        - Clearance(SAFETY_BRIEFING) ACTIVE with valid_until > now AND Clearance(LIABILITY_WAIVER) ACTIVE
        - no existing DeploymentAssignment of this volunteer in {PROPOSED, ACCEPTED, CONFIRMED, CHECKED_IN} for THIS request
        - volunteer.committed_hours + candidate shift duration_hours <= 40.00
        - candidate shift does not temporally overlap the volunteer's {CONFIRMED, CHECKED_IN} shifts (half-open rule)
      SHIFT SELECTION for each candidate (in ranked order):
        eligible shifts = SiteShifts of this incident with site_name == request.site_name,
          status == OPEN_FOR_ROSTER, rostered_count < capacity,
          window_start <= start_at AND end_at <= window_end (containment),
          and (hazard_level != RED OR candidate's qualifying credential class == ADVANCED)
        pick shift with earliest start_at; tie-break: created_at ASC
      RANKING of candidates: verified_hours_total ASC, then created_at ASC,
        then (last_name, first_name) ASC lexicographic. NEVER use id.
      PLACEMENT: walk ranked candidates; for each, place on its selected shift
        (recompute shift remaining capacity after each placement) until
        headcount_needed PROPOSED assignments exist or candidates/shifts exhaust;
        skip a candidate for whom no eligible shift has capacity and continue.
      EMPTY-POOL FALLBACK: if zero placements were made, reject with
        ERR_NO_ELIGIBLE_PLACEMENTS (422) and leave the request unchanged.
    input_set: "volunteers of the request's incident; SiteShifts of the same incident"
    precision: "n/a (deterministic selector)"

  - name: volunteer_shift_overlap_check
    trigger: "POST /vrc/assignments (manual propose) and POST /vrc/assignments/{id}/confirm (re-check)"
    algorithm: interval_merge
    formula: |
      The volunteer's occupied intervals = [shift.start_at, shift.end_at) of their
      assignments in {CONFIRMED, CHECKED_IN} (HALF-OPEN: the end instant itself is free).
      Candidate interval [s, e) from the target shift conflicts iff
        s < occupied_end AND occupied_start < e   for any occupied interval.
      ADJACENCY IS LEGAL: a shift starting exactly at another's end_at
      (s == occupied_end) does NOT conflict.
    input_set: "the volunteer's assignments in {CONFIRMED, CHECKED_IN} joined to their SiteShifts"
    precision: "instant-exact comparison of ISO 8601 timestamps"

  - name: vehicle_turnaround_conflict_check
    trigger: "POST /vrc/trips"
    algorithm: interval_merge
    formula: |
      For the same vehicle_id, consider all existing TransportTrips in
      {SCHEDULED, DEPARTED} (CANCELLED and ARRIVED trips free the vehicle).
      The new trip conflicts with an existing trip iff BOTH hold:
        new.depart_at < existing.arrive_estimate_at + TURNAROUND_MINUTES
        AND existing.depart_at < new.arrive_estimate_at + TURNAROUND_MINUTES
      Conflict -> ERR_VEHICLE_TURNAROUND_CONFLICT.
      BUFFER SEMANTICS: unlike the volunteer shift rule, plain adjacency is NOT
      sufficient — each trip must depart at least TURNAROUND_MINUTES after the
      other's estimated arrival; a gap of exactly TURNAROUND_MINUTES minutes
      is required and sufficient (gap == 45min legal, gap < 45min illegal).
    input_set: "TransportTrips of the same incident with the same vehicle_id in {SCHEDULED, DEPARTED}"
    constants:
      TURNAROUND_MINUTES: 45
    precision: "instant-exact comparison"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# Category order within business rules: safety -> referential -> temporal ->
# constraint (uniqueness) -> capacity/fiscal. SoD sits immediately after
# resource-state checks (it requires a loaded resource).
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path and body resource ids exist, validated left-to-right (path first, then body references in declared input order)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: existence
    check: "Request body shape: required fields present, types correct, enum members valid, numeric rules (quantity >= 1, headcount >= 1, 0 < hours <= 16, hours a multiple of 0.25, end strictly after start, ppe_stock has exactly the five item keys)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: state
    check: "Incident lifecycle gate: writes that create/modify operational data require lifecycle_status == ACTIVE; in DEMOBILIZATION only demobilize, hour-entry create/verify/dispute/resubmit, request complete/cancel, PPE close, risk substantiate/dismiss, trip arrive are permitted; CLOSED rejects everything"
    error_id: "ERR_INCIDENT_NOT_ACTIVE (ACTIVATION/CLOSED) or ERR_INCIDENT_DEMOBILIZING (DEMOBILIZATION)"
    http_status: 409
    applies_to: "all non-GET endpoints scoped to an incident"
  - priority: 6
    category: state
    check: "Incident posture gate: FROZEN rejects POST /vrc/assignments, auto-match, check-in, trip depart (ERR_POSTURE_FROZEN); RESTRICTED rejects auto-match only (ERR_POSTURE_RESTRICTED); posture is only evaluated while lifecycle == ACTIVE"
    error_id: "ERR_POSTURE_FROZEN | ERR_POSTURE_RESTRICTED"
    http_status: 409
    applies_to: "POST /vrc/assignments, POST /vrc/support-requests/{id}/auto-match, POST /vrc/assignments/{id}/check-in, POST /vrc/trips/{id}/depart"
  - priority: 7
    category: state
    check: "Target resource state precondition for the requested transition (per state_machines); creation-time related-entity state preconditions: POST /vrc/hour-entries requires the assignment COMPLETED; POST /vrc/seat-bookings requires the trip SCHEDULED and the assignment in {CONFIRMED, CHECKED_IN}; POST /vrc/background-checks requires the volunteer in {VETTING, SUSPENDED}; POST /vrc/ppe-issuances requires the volunteer in {READY, DEPLOYED}; credential verify/reject require the parent volunteer not in {WITHDRAWN, REJECTED, DEMOBILIZED}; PATCH volunteer only from {REGISTERED, VETTING, CLEARED, READY}; PUT support-request only from {DRAFT, OPEN} and headcount_needed >= filled_count (else ERR_INVALID_REQUEST); plus OCC expected_*_version match on PATCH /vrc/volunteers/{id} and PUT /vrc/support-requests/{id}"
    error_id: "ERR_INVALID_STATE | ERR_STALE_VERSION"
    http_status: "409 | 412"
    applies_to: "all transition endpoints, the two OCC writes, and the creation endpoints named in the check"
  - priority: 8
    category: state
    check: "Segregation of duties: BackgroundCheck clear/flag requires X-User-ID != volunteer.registered_by_user_id; HourEntry verify/dispute requires X-User-ID != entry.submitted_by_user_id; RiskReport substantiate/dismiss requires X-User-ID != report.reporter_user_id; Volunteer-role ownership: accept/decline/resubmit/withdraw require X-User-ID == the subject volunteer id"
    error_id: "ERR_SOD_CLEARANCE_VIOLATION | ERR_SOD_HOUR_VERIFICATION | ERR_SOD_RISK_ADJUDICATION | ERR_NOT_RESOURCE_OWNER"
    http_status: 403
    applies_to: "the nine endpoints named in the check"
  - priority: 9
    category: business_safety
    check: "Assignment safety: volunteer status == READY (else ERR_VOLUNTEER_NOT_READY) with a VERIFIED credential whose skill_code == request.required_skill (else ERR_SKILL_MISMATCH) and credential_class >= request.min_credential_class (else ERR_CREDENTIAL_CLASS_INSUFFICIENT); RED-hazard shifts require ADVANCED class (else ERR_HAZARD_CREDENTIAL_REQUIRED); BackgroundCheck CLEARED and unexpired (else ERR_BACKGROUND_CHECK_LAPSED)"
    error_id: "ERR_VOLUNTEER_NOT_READY | ERR_SKILL_MISMATCH | ERR_CREDENTIAL_CLASS_INSUFFICIENT | ERR_HAZARD_CREDENTIAL_REQUIRED | ERR_BACKGROUND_CHECK_LAPSED"
    http_status: 422
    applies_to: "POST /vrc/assignments, POST /vrc/assignments/{id}/confirm, auto-match candidate filter"
  - priority: 10
    category: business_safety
    check: "Gate-document safety: check-in and seat board require ACTIVE briefing (valid_until > now; ERR_BRIEFING_NOT_CURRENT) and ACTIVE waiver (ERR_WAIVER_NOT_SIGNED); check-in additionally requires >= 1 PPEIssuance in ISSUED (ERR_PPE_NOT_ISSUED); PPE issuance requires ACTIVE waiver (ERR_WAIVER_NOT_SIGNED)"
    error_id: "ERR_BRIEFING_NOT_CURRENT | ERR_WAIVER_NOT_SIGNED | ERR_PPE_NOT_ISSUED"
    http_status: 422
    applies_to: "check-in, seat-booking board, POST /vrc/ppe-issuances"
  - priority: 11
    category: business_referential
    check: "Assignment coherence: shift.site_name == request.site_name AND request.window_start <= shift.start_at AND shift.end_at <= request.window_end; trip.site_shift_id shift exists and belongs to the trip's incident; hour-entry assignment belongs to the acting volunteer (Volunteer role)"
    error_id: "ERR_SITE_WINDOW_MISMATCH | ERR_RESOURCE_NOT_FOUND | ERR_NOT_RESOURCE_OWNER"
    http_status: "422 | 404 | 403"
    applies_to: "POST /vrc/assignments, POST /vrc/trips, POST /vrc/hour-entries"
  - priority: 12
    category: business_temporal
    check: "Interval rules: volunteer double-booking half-open overlap (ERR_DOUBLE_BOOKED_SHIFT); vehicle turnaround buffer (ERR_VEHICLE_TURNAROUND_CONFLICT); volunteer trip double-booking half-open overlap on overlapping trip windows (ERR_DOUBLE_BOOKED_TRIP); check-in window [start_at - 30min, end_at] (ERR_OUTSIDE_CHECKIN_WINDOW); no-show only at/after shift end (ERR_TOO_EARLY_FOR_NO_SHOW); open-roster requires now < end_at (ERR_SHIFT_WINDOW_PASSED)"
    error_id: "ERR_DOUBLE_BOOKED_SHIFT | ERR_VEHICLE_TURNAROUND_CONFLICT | ERR_DOUBLE_BOOKED_TRIP | ERR_OUTSIDE_CHECKIN_WINDOW | ERR_TOO_EARLY_FOR_NO_SHOW | ERR_SHIFT_WINDOW_PASSED"
    http_status: 409
    applies_to: "POST /vrc/assignments, confirm, POST /vrc/trips, POST /vrc/seat-bookings, check-in, no-show, open-roster"
  - priority: 13
    category: business_constraint
    check: "Uniqueness/duplicate rules: at most one BackgroundCheck REQUESTED per volunteer (ERR_CHECK_ALREADY_PENDING); at most one ACTIVE Clearance per (volunteer, clearance_type) (ERR_CLEARANCE_ALREADY_ACTIVE); at most one HourEntry per (assignment, work_date) with status != REJECTED_FINAL (ERR_DUPLICATE_HOUR_ENTRY); at most one non-CANCELLED SeatBooking per (assignment, trip)"
    error_id: "ERR_CHECK_ALREADY_PENDING | ERR_CLEARANCE_ALREADY_ACTIVE | ERR_DUPLICATE_HOUR_ENTRY | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /vrc/background-checks, POST /vrc/clearances, POST /vrc/hour-entries, POST /vrc/seat-bookings"
  - priority: 14
    category: business_fiscal
    check: "Capacity/quota rules: shift rostered_count < capacity on confirm (ERR_SHIFT_CAPACITY_REACHED); trip booked_seats < seat_capacity on booking (ERR_SEAT_CAPACITY_REACHED); PPE stock sufficient — quantity <= ppe_stock[item_type], equality allowed (ERR_PPE_STOCK_INSUFFICIENT); committed-hours cap projected <= 40.00, equality allowed (ERR_WEEKLY_HOUR_CAP)"
    error_id: "ERR_SHIFT_CAPACITY_REACHED | ERR_SEAT_CAPACITY_REACHED | ERR_PPE_STOCK_INSUFFICIENT | ERR_WEEKLY_HOUR_CAP"
    http_status: "409 | 422"
    applies_to: "confirm, POST /vrc/seat-bookings, POST /vrc/ppe-issuances"
  - priority: 15
    category: business_constraint
    check: "auto-match must create at least one PROPOSED placement; an empty eligible pool or zero eligible shift capacity rejects the whole call with no state change"
    error_id: ERR_NO_ELIGIBLE_PLACEMENTS
    http_status: 422
    applies_to: "POST /vrc/support-requests/{id}/auto-match"

# =============================================================================
# Section 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# GET list endpoints accept the noted FK filters plus limit?/offset? and return
# paginated arrays. `roles: *all_roles` means any authenticated role may read.
# =============================================================================
endpoints:
  # --- Incident ---
  - method: POST
    path: "/vrc/incidents"
    description: "Create an incident (lifecycle ACTIVATION, posture OPEN)"
    roles: [VRCManager]
    code: 201
    input: [name, ppe_stock]
    output: Incident
    side_effects: ["computed share fields initialized to 0", "version := 1"]
  - method: GET
    path: "/vrc/incidents/{incidentId}"
    description: "Get one incident including posture and cost-share fields"
    roles: &all_roles [VRCManager, IntakeCoordinator, VettingOfficer, LogisticsCoordinator, SiteSupervisor, RiskOfficer, AgencyCoordinator, Volunteer]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/vrc/incidents/{incidentId}/activate"
    description: "ACTIVATION -> ACTIVE"
    roles: [VRCManager]
    code: 200
    input: []
    output: Incident
    side_effects: ["lifecycle_status := ACTIVE", "activated_at := now", "increments Incident.version by 1"]
  - method: POST
    path: "/vrc/incidents/{incidentId}/begin-demobilization"
    description: "ACTIVE -> DEMOBILIZATION (no CHECKED_IN assignments may remain)"
    roles: [VRCManager]
    code: 200
    input: []
    output: Incident
    side_effects: ["lifecycle_status := DEMOBILIZATION", "demobilized_at := now", "increments Incident.version by 1"]
  - method: POST
    path: "/vrc/incidents/{incidentId}/close"
    description: "DEMOBILIZATION -> CLOSED after full close-out preconditions"
    roles: [VRCManager]
    code: 200
    input: []
    output: Incident
    side_effects: ["lifecycle_status := CLOSED", "closed_at := now", "increments Incident.version by 1"]
  - method: GET
    path: "/vrc/incidents/{id}/volunteers"
    description: "List volunteers of an incident (reverse of Volunteer.incident_id)"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Volunteer[]"
    side_effects: []
  - method: GET
    path: "/vrc/incidents/{id}/support-requests"
    description: "List support requests of an incident"
    roles: *all_roles
    code: 200
    input: ["status?", "criticality?", "limit?", "offset?"]
    output: "SupportRequest[]"
    side_effects: []
  - method: GET
    path: "/vrc/incidents/{id}/shifts"
    description: "List site shifts of an incident"
    roles: *all_roles
    code: 200
    input: ["status?", "hazard_level?", "site_name?", "limit?", "offset?"]
    output: "SiteShift[]"
    side_effects: []

  # --- Volunteer ---
  - method: POST
    path: "/vrc/volunteers"
    description: "Intake registration of a spontaneous volunteer (status REGISTERED)"
    roles: [IntakeCoordinator, Volunteer]
    code: 201
    input: [incident_id, full_name, phone, email, home_locality]
    output: Volunteer
    side_effects: ["registered_by_user_id := X-User-ID (or the new volunteer id for self-registration)", "status := REGISTERED", "version := 1"]
  - method: GET
    path: "/vrc/volunteers/{volunteerId}"
    description: "Get one volunteer incl. committed_hours, risk scores, recognition_tier"
    roles: *all_roles
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: PATCH
    path: "/vrc/volunteers/{volunteerId}"
    description: "OCC-guarded profile edit (phone/email/home_locality); not allowed in DEPLOYED/SUSPENDED/DEMOBILIZED/WITHDRAWN/REJECTED (ERR_INVALID_STATE)"
    roles: [IntakeCoordinator, Volunteer]
    code: 200
    input: [expected_volunteer_version, "phone?", "email?", "home_locality?"]
    output: Volunteer
    side_effects: ["increments Volunteer.version by 1"]
  - method: POST
    path: "/vrc/volunteers/{volunteerId}/submit-for-vetting"
    description: "REGISTERED -> VETTING (requires >= 1 claimed credential)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status := VETTING", "increments Volunteer.version by 1"]
  - method: POST
    path: "/vrc/volunteers/{volunteerId}/mark-ready"
    description: "CLEARED -> READY after briefing/waiver/BG/credential gate"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status := READY", "increments Volunteer.version by 1"]
  - method: POST
    path: "/vrc/volunteers/{volunteerId}/suspend"
    description: "{VETTING, CLEARED, READY, DEPLOYED} -> SUSPENDED with full suspension cascade"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["SUSPENSION CASCADE (assignments, seats, request/shift recomputes, posture)", "increments Volunteer.version by 1"]
  - method: POST
    path: "/vrc/volunteers/{volunteerId}/reinstate"
    description: "SUSPENDED -> VETTING (requires a REQUESTED background check; lifetime score < 100)"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["status := VETTING", "increments Volunteer.version by 1"]
  - method: POST
    path: "/vrc/volunteers/{volunteerId}/withdraw"
    description: "{REGISTERED, VETTING, CLEARED, READY} -> WITHDRAWN with release cascade"
    roles: [IntakeCoordinator, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["release cascade (assignments/seats/recomputes)", "increments Volunteer.version by 1"]
  - method: POST
    path: "/vrc/volunteers/{volunteerId}/demobilize"
    description: "{CLEARED, READY, SUSPENDED} -> DEMOBILIZED; computes recognition_tier"
    roles: [VRCManager]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["recognition_tier := recognition_tier calculation", "demobilized_at := now", "increments Volunteer.version by 1"]
  - method: GET
    path: "/vrc/volunteers/{id}/credentials"
    description: "List a volunteer's skill credentials"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SkillCredential[]"
    side_effects: []
  - method: GET
    path: "/vrc/volunteers/{id}/background-checks"
    description: "List a volunteer's background checks"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []
  - method: GET
    path: "/vrc/volunteers/{id}/clearances"
    description: "List a volunteer's clearances (briefings and waivers)"
    roles: *all_roles
    code: 200
    input: ["clearance_type?", "status?", "limit?", "offset?"]
    output: "Clearance[]"
    side_effects: []
  - method: GET
    path: "/vrc/volunteers/{id}/ppe-issuances"
    description: "List a volunteer's PPE issuances"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PPEIssuance[]"
    side_effects: []
  - method: GET
    path: "/vrc/volunteers/{id}/risk-reports"
    description: "List risk reports whose subject is this volunteer"
    roles: *all_roles
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: "RiskReport[]"
    side_effects: []

  # --- SkillCredential ---
  - method: POST
    path: "/vrc/credentials"
    description: "Claim a skill credential (status CLAIMED)"
    roles: [IntakeCoordinator, Volunteer]
    code: 201
    input: [volunteer_id, skill_code, credential_class, expires_at, "evidence_notes?"]
    output: SkillCredential
    side_effects: ["status := CLAIMED", "version := 1"]
  - method: POST
    path: "/vrc/credentials/{credentialId}/verify"
    description: "CLAIMED or EXPIRED -> VERIFIED (EXPIRED path is the renewal loop)"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: SkillCredential
    side_effects: ["verified_by_user_id/verified_at set", "volunteer CLEARED auto-transition re-evaluated", "increments SkillCredential.version by 1"]
  - method: POST
    path: "/vrc/credentials/{credentialId}/reject"
    description: "CLAIMED or EXPIRED -> REJECTED"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: SkillCredential
    side_effects: ["status := REJECTED", "increments SkillCredential.version by 1"]

  # --- BackgroundCheck ---
  - method: POST
    path: "/vrc/background-checks"
    description: "Open a background check (volunteer must be VETTING or SUSPENDED; one REQUESTED at a time)"
    roles: [VettingOfficer]
    code: 201
    input: [volunteer_id]
    output: BackgroundCheck
    side_effects: ["status := REQUESTED", "version := 1"]
  - method: POST
    path: "/vrc/background-checks/{checkId}/clear"
    description: "REQUESTED -> CLEARED (SoD vs registrar); sets expires_at = now + 720h"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["expires_at := now + 720h", "volunteer CLEARED auto-transition re-evaluated", "increments BackgroundCheck.version by 1"]
  - method: POST
    path: "/vrc/background-checks/{checkId}/flag"
    description: "REQUESTED -> FLAGGED (SoD vs registrar); cascades volunteer to REJECTED or SUSPENDED"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["volunteer REJECTED (from VETTING) or SUSPENDED cascade", "posture recompute", "increments BackgroundCheck.version by 1"]

  # --- Clearance ---
  - method: POST
    path: "/vrc/clearances"
    description: "Record a completed safety briefing or signed liability waiver (status ACTIVE)"
    roles: [IntakeCoordinator]
    code: 201
    input: [volunteer_id, clearance_type]
    output: Clearance
    side_effects: ["completed_at := now", "SAFETY_BRIEFING: valid_until := now + 72h; LIABILITY_WAIVER: valid_until := null", "version := 1"]
  - method: POST
    path: "/vrc/clearances/{clearanceId}/revoke"
    description: "ACTIVE -> REVOKED; waiver revocation regresses/suspends the volunteer"
    roles: [RiskOfficer, VRCManager]
    code: 200
    input: [reason]
    output: Clearance
    side_effects: ["waiver revoke: READY -> CLEARED or DEPLOYED -> SUSPENDED cascade", "increments Clearance.version by 1"]

  # --- SupportRequest ---
  - method: POST
    path: "/vrc/support-requests"
    description: "Agency files a support request (status DRAFT)"
    roles: [AgencyCoordinator]
    code: 201
    input: [incident_id, requesting_agency, site_name, required_skill, min_credential_class, headcount_needed, criticality, window_start, window_end]
    output: SupportRequest
    side_effects: ["status := DRAFT", "filled_count := 0", "version := 1"]
  - method: GET
    path: "/vrc/support-requests/{requestId}"
    description: "Get one support request (incl. filled_count and version)"
    roles: *all_roles
    code: 200
    input: []
    output: SupportRequest
    side_effects: []
  - method: PUT
    path: "/vrc/support-requests/{requestId}"
    description: "OCC-guarded edit of a DRAFT/OPEN request"
    roles: [AgencyCoordinator]
    code: 200
    input: [expected_support_request_version, "headcount_needed?", "window_start?", "window_end?", "criticality?", "min_credential_class?"]
    output: SupportRequest
    side_effects: ["increments SupportRequest.version by 1"]
  - method: POST
    path: "/vrc/support-requests/{requestId}/publish"
    description: "DRAFT -> OPEN"
    roles: [AgencyCoordinator]
    code: 200
    input: []
    output: SupportRequest
    side_effects: ["status := OPEN", "posture recompute", "increments SupportRequest.version by 1"]
  - method: POST
    path: "/vrc/support-requests/{requestId}/auto-match"
    description: "Ranked selector creates PROPOSED assignments up to headcount_needed (see auto_match_candidate_ranking); blocked in RESTRICTED/FROZEN posture"
    roles: [IntakeCoordinator]
    code: 201
    input: []
    output: "{ created_assignment_ids: array, proposed_count: integer, remaining_need: integer, request_status: string }"
    side_effects: ["PROPOSED assignments created with origin AUTO_MATCH", "request OPEN -> MATCHING when >= 1 placement", "posture recompute"]
  - method: POST
    path: "/vrc/support-requests/{requestId}/cancel"
    description: "{OPEN, MATCHING, FILLED} -> CANCELLED with assignment/seat release cascade"
    roles: [AgencyCoordinator]
    code: 200
    input: []
    output: SupportRequest
    side_effects: ["cancellation cascade (assignments, seat bookings, recomputes)", "posture recompute", "increments SupportRequest.version by 1"]
  - method: POST
    path: "/vrc/support-requests/{requestId}/complete"
    description: "{MATCHING, FILLED} -> COMPLETED (no open assignments, no unresolved hour entries)"
    roles: [AgencyCoordinator]
    code: 200
    input: []
    output: SupportRequest
    side_effects: ["status := COMPLETED", "posture recompute", "increments SupportRequest.version by 1"]

  # --- SiteShift ---
  - method: POST
    path: "/vrc/shifts"
    description: "Schedule a site shift (status SCHEDULED)"
    roles: [LogisticsCoordinator]
    code: 201
    input: [incident_id, site_name, hazard_level, start_at, end_at, capacity]
    output: SiteShift
    side_effects: ["duration_hours computed", "rostered_count := 0", "version := 1"]
  - method: GET
    path: "/vrc/shifts/{shiftId}"
    description: "Get one site shift"
    roles: *all_roles
    code: 200
    input: []
    output: SiteShift
    side_effects: []
  - method: POST
    path: "/vrc/shifts/{shiftId}/open-roster"
    description: "SCHEDULED -> OPEN_FOR_ROSTER (requires now < end_at)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: SiteShift
    side_effects: ["status := OPEN_FOR_ROSTER", "posture recompute", "increments SiteShift.version by 1"]
  - method: POST
    path: "/vrc/shifts/{shiftId}/cancel"
    description: "{SCHEDULED, OPEN_FOR_ROSTER, LOCKED} -> CANCELLED with shift cancellation cascade"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: SiteShift
    side_effects: ["SHIFT CANCELLATION CASCADE (assignments, trips, seat bookings, recomputes)", "increments SiteShift.version by 1"]

  # --- DeploymentAssignment ---
  - method: POST
    path: "/vrc/assignments"
    description: "Manually propose an assignment (origin MANUAL); full validation chain per P5-P14"
    roles: [IntakeCoordinator]
    code: 201
    input: [volunteer_id, support_request_id, site_shift_id]
    output: DeploymentAssignment
    side_effects: ["status := PROPOSED", "request OPEN -> MATCHING", "posture recompute", "version := 1"]
  - method: GET
    path: "/vrc/assignments/{assignmentId}"
    description: "Get one assignment"
    roles: *all_roles
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: []
  - method: GET
    path: "/vrc/assignments"
    description: "Filtered assignment list (reverse channel for incident/volunteer/request/shift FKs)"
    roles: *all_roles
    code: 200
    input: ["incident_id?", "volunteer_id?", "support_request_id?", "site_shift_id?", "status?", "limit?", "offset?"]
    output: "DeploymentAssignment[]"
    side_effects: []
  - method: POST
    path: "/vrc/assignments/{assignmentId}/accept"
    description: "PROPOSED -> ACCEPTED (volunteer self only)"
    roles: [Volunteer]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["status := ACCEPTED", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/decline"
    description: "PROPOSED -> DECLINED (volunteer self only)"
    roles: [Volunteer]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["request MATCHING -> OPEN regression if emptied", "posture recompute", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/confirm"
    description: "ACCEPTED -> CONFIRMED; re-runs safety/temporal checks, debits committed hours, may lock shift / fill request"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["volunteer.committed_hours += shift.duration_hours", "shift.rostered_count += 1 (LOCKED at capacity)", "request.filled_count += 1 (FILLED at headcount)", "posture recompute", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/cancel"
    description: "{PROPOSED, ACCEPTED, CONFIRMED} -> CANCELLED with compensating release"
    roles: [IntakeCoordinator, VRCManager]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["committed-hours/rostered/filled release", "seat bookings -> CANCELLED", "posture recompute", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/check-in"
    description: "CONFIRMED -> CHECKED_IN within the check-in window; briefing/waiver/PPE gates"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["checked_in_at := now", "volunteer READY -> DEPLOYED on first check-in", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/complete"
    description: "CHECKED_IN -> COMPLETED; releases committed hours"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["completed_at := now", "committed_hours release", "volunteer DEPLOYED -> READY when last CHECKED_IN closes", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/no-show"
    description: "CONFIRMED -> NO_SHOW at/after shift end; +10 risk points, releases committed hours"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["committed/rostered/filled release with regressions", "NO_SHOW_PENALTY risk points at shift.end_at", "posture recompute", "increments DeploymentAssignment.version by 1"]
  - method: POST
    path: "/vrc/assignments/{assignmentId}/recall"
    description: "CHECKED_IN -> RECALLED (safety recall); releases committed hours"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: DeploymentAssignment
    side_effects: ["committed/rostered/filled release with regressions", "volunteer DEPLOYED -> READY when last CHECKED_IN closes", "posture recompute", "increments DeploymentAssignment.version by 1"]

  # --- TransportTrip ---
  - method: POST
    path: "/vrc/trips"
    description: "Schedule a vehicle trip to a shift site (vehicle turnaround-buffer rule applies)"
    roles: [LogisticsCoordinator]
    code: 201
    input: [incident_id, site_shift_id, vehicle_id, seat_capacity, depart_at, arrive_estimate_at]
    output: TransportTrip
    side_effects: ["status := SCHEDULED", "booked_seats := 0", "version := 1"]
  - method: GET
    path: "/vrc/trips/{tripId}"
    description: "Get one trip"
    roles: *all_roles
    code: 200
    input: []
    output: TransportTrip
    side_effects: []
  - method: GET
    path: "/vrc/trips"
    description: "Filtered trip list (reverse channel for incident_id and site_shift_id FKs)"
    roles: *all_roles
    code: 200
    input: ["incident_id?", "site_shift_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: "TransportTrip[]"
    side_effects: []
  - method: POST
    path: "/vrc/trips/{tripId}/depart"
    description: "SCHEDULED -> DEPARTED (blocked while posture FROZEN)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TransportTrip
    side_effects: ["status := DEPARTED", "increments TransportTrip.version by 1"]
  - method: POST
    path: "/vrc/trips/{tripId}/arrive"
    description: "DEPARTED -> ARRIVED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TransportTrip
    side_effects: ["status := ARRIVED", "increments TransportTrip.version by 1"]
  - method: POST
    path: "/vrc/trips/{tripId}/cancel"
    description: "SCHEDULED -> CANCELLED; cancels the trip's BOOKED/BOARDED seat bookings"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: TransportTrip
    side_effects: ["seat bookings -> CANCELLED", "booked_seats := 0", "increments TransportTrip.version by 1"]

  # --- SeatBooking ---
  - method: POST
    path: "/vrc/seat-bookings"
    description: "Book a seat for a CONFIRMED/CHECKED_IN assignment; capacity + volunteer trip-overlap rules apply"
    roles: [LogisticsCoordinator]
    code: 201
    input: [trip_id, assignment_id]
    output: SeatBooking
    side_effects: ["volunteer_id copied from assignment", "trip.booked_seats += 1", "version := 1"]
  - method: GET
    path: "/vrc/seat-bookings/{bookingId}"
    description: "Get one seat booking"
    roles: *all_roles
    code: 200
    input: []
    output: SeatBooking
    side_effects: []
  - method: GET
    path: "/vrc/seat-bookings"
    description: "Filtered seat-booking list (reverse channel for trip/assignment/volunteer FKs)"
    roles: *all_roles
    code: 200
    input: ["trip_id?", "assignment_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: "SeatBooking[]"
    side_effects: []
  - method: POST
    path: "/vrc/seat-bookings/{bookingId}/board"
    description: "BOOKED -> BOARDED (trip still SCHEDULED; briefing + waiver gates)"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: SeatBooking
    side_effects: ["status := BOARDED", "increments SeatBooking.version by 1"]
  - method: POST
    path: "/vrc/seat-bookings/{bookingId}/cancel"
    description: "BOOKED -> CANCELLED; frees the seat"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: SeatBooking
    side_effects: ["trip.booked_seats -= 1", "increments SeatBooking.version by 1"]
  - method: POST
    path: "/vrc/seat-bookings/{bookingId}/mark-no-show"
    description: "BOOKED -> NO_SHOW after the trip has DEPARTED; frees the seat"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: SeatBooking
    side_effects: ["trip.booked_seats -= 1", "increments SeatBooking.version by 1"]

  # --- PPEIssuance ---
  - method: POST
    path: "/vrc/ppe-issuances"
    description: "Issue PPE to a READY/DEPLOYED volunteer; requires ACTIVE waiver; decrements incident stock"
    roles: [LogisticsCoordinator]
    code: 201
    input: [volunteer_id, item_type, quantity]
    output: PPEIssuance
    side_effects: ["Incident.ppe_stock[item_type] -= quantity", "version := 1"]
  - method: POST
    path: "/vrc/ppe-issuances/{issuanceId}/close"
    description: "ISSUED -> RETURNED (stock restored) | DAMAGED | LOST (stock not restored)"
    roles: [LogisticsCoordinator]
    code: 200
    input: [outcome]
    output: PPEIssuance
    side_effects: ["outcome == RETURNED: Incident.ppe_stock[item_type] += quantity", "closed_at := now", "increments PPEIssuance.version by 1"]

  # --- HourEntry ---
  - method: POST
    path: "/vrc/hour-entries"
    description: "Report worked hours for a COMPLETED assignment (status SUBMITTED)"
    roles: [Volunteer, SiteSupervisor]
    code: 201
    input: [assignment_id, work_date, hours]
    output: HourEntry
    side_effects: ["submitted_by_user_id := X-User-ID", "entry_value_cents computed", "Incident provisional_cost_share_cents += entry_value_cents", "version := 1"]
  - method: POST
    path: "/vrc/hour-entries/{entryId}/verify"
    description: "SUBMITTED -> VERIFIED (SoD vs submitter); feeds verified cost-share"
    roles: [SiteSupervisor]
    code: 200
    input: []
    output: HourEntry
    side_effects: ["volunteer.verified_hours_total += hours", "Incident verified rollup and share fields recomputed", "increments HourEntry.version by 1"]
  - method: POST
    path: "/vrc/hour-entries/{entryId}/dispute"
    description: "SUBMITTED -> DISPUTED; a second dispute after resubmit -> REJECTED_FINAL"
    roles: [SiteSupervisor]
    code: 200
    input: [reason]
    output: HourEntry
    side_effects: ["dispute_count += 1", "second dispute: REJECTED_FINAL and provisional rollup -= entry_value_cents", "increments HourEntry.version by 1"]
  - method: POST
    path: "/vrc/hour-entries/{entryId}/resubmit"
    description: "DISPUTED -> SUBMITTED with corrected hours (submitted_by unchanged)"
    roles: [Volunteer, SiteSupervisor]
    code: 200
    input: [hours]
    output: HourEntry
    side_effects: ["hours and entry_value_cents recomputed", "resubmit_count += 1", "provisional rollup adjusted by delta", "increments HourEntry.version by 1"]
  - method: GET
    path: "/vrc/assignments/{id}/hour-entries"
    description: "List hour entries of an assignment (reverse of HourEntry.assignment_id)"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "HourEntry[]"
    side_effects: []

  # --- RiskReport ---
  - method: POST
    path: "/vrc/risk-reports"
    description: "File a conduct/safety report against a volunteer (status FILED)"
    roles: [SiteSupervisor, IntakeCoordinator, LogisticsCoordinator]
    code: 201
    input: [subject_volunteer_id, severity, category, description, occurred_at]
    output: RiskReport
    side_effects: ["reporter_user_id := X-User-ID", "version := 1"]
  - method: POST
    path: "/vrc/risk-reports/{reportId}/substantiate"
    description: "FILED -> SUBSTANTIATED (SoD vs reporter); applies points; may auto-suspend and freeze posture"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: RiskReport
    side_effects: ["points_awarded by severity", "volunteer risk scores recomputed", "threshold auto-suspension cascade at current_risk_score >= 50", "posture recompute (CRITICAL inside 24h -> FROZEN)", "increments RiskReport.version by 1"]
  - method: POST
    path: "/vrc/risk-reports/{reportId}/dismiss"
    description: "FILED -> DISMISSED (SoD vs reporter)"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: RiskReport
    side_effects: ["adjudicated_at := now", "increments RiskReport.version by 1"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/vrc/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Setting the clock triggers the expiry sweep (VERIFIED credentials, CLEARED background checks, ACTIVE briefings whose deadline has passed) and a posture recompute."
    roles: [VRCManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["expiry sweeps: SkillCredential VERIFIED -> EXPIRED, BackgroundCheck CLEARED -> EXPIRED, Clearance(SAFETY_BRIEFING) ACTIVE -> EXPIRED where deadline <= to_iso8601", "volunteer CLEARED -> VETTING regressions", "posture recompute"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication / authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or X-User-Role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Volunteer-role caller's X-User-ID does not equal the target volunteer id (accept/decline/resubmit/withdraw, hour-entry create)" }

  # --- Existence / shape ---
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path or referenced-body resource id does not exist; message names which resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body shape violation: missing required field, wrong type, invalid enum member, non-positive quantity, hours not a multiple of 0.25 or outside (0, 16], end not strictly after start, ppe_stock keys wrong, unknown payload field, headcount reduced below filled_count" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_volunteer_version / expected_support_request_version does not match the entity's current version" }

  # --- Incident lifecycle / posture ---
  - { id: ERR_INCIDENT_NOT_ACTIVE, http: 409, condition: "Write requires lifecycle ACTIVE but incident is ACTIVATION or CLOSED" }
  - { id: ERR_INCIDENT_DEMOBILIZING, http: 409, condition: "Intake/matching write attempted while lifecycle is DEMOBILIZATION (volunteer registration, credential create, request create/publish, shift create/open-roster, assignment create, auto-match, check-in, trip create/depart, seat booking, PPE issuance)" }
  - { id: ERR_INCIDENT_CLOSING_BLOCKED, http: 409, condition: "Close precondition unmet: non-terminal volunteers, requests, hour entries, PPE issuances, trips, or shifts remain" }
  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "operational_posture == FROZEN blocks assignment create/confirm, auto-match, check-in, and trip depart" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "operational_posture == RESTRICTED blocks auto-match" }

  # --- Generic state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition; message names entity and required state(s)" }

  # --- Volunteer pipeline ---
  - { id: ERR_NO_CREDENTIALS_CLAIMED, http: 409, condition: "submit-for-vetting with zero SkillCredential records for the volunteer" }
  - { id: ERR_READINESS_INCOMPLETE, http: 409, condition: "mark-ready while any of: ACTIVE briefing (valid_until > now), ACTIVE waiver, CLEARED unexpired background check, >= 1 VERIFIED credential is missing; message names each missing item" }
  - { id: ERR_VOLUNTEER_NOT_READY, http: 409, condition: "Assignment proposal requires Volunteer.status == READY" }
  - { id: ERR_VOLUNTEER_BLACKLISTED, http: 403, condition: "reinstate attempted while lifetime_risk_score >= 100" }
  - { id: ERR_CHECK_ALREADY_PENDING, http: 409, condition: "Second REQUESTED BackgroundCheck for the same volunteer" }
  - { id: ERR_BACKGROUND_CHECK_LAPSED, http: 422, condition: "Assignment propose/confirm while no CLEARED unexpired BackgroundCheck exists for the volunteer" }

  # --- Segregation of duties ---
  - { id: ERR_SOD_CLEARANCE_VIOLATION, http: 403, condition: "BackgroundCheck clear/flag by the same X-User-ID that registered the volunteer" }
  - { id: ERR_SOD_HOUR_VERIFICATION, http: 403, condition: "HourEntry verify/dispute by the same X-User-ID that submitted the entry" }
  - { id: ERR_SOD_RISK_ADJUDICATION, http: 403, condition: "RiskReport substantiate/dismiss by the same X-User-ID that filed the report" }

  # --- Assignment safety ---
  - { id: ERR_SKILL_MISMATCH, http: 422, condition: "No VERIFIED credential of the volunteer matches the request's required_skill" }
  - { id: ERR_CREDENTIAL_CLASS_INSUFFICIENT, http: 422, condition: "Matching credential's class is below the request's min_credential_class" }
  - { id: ERR_HAZARD_CREDENTIAL_REQUIRED, http: 422, condition: "Assignment onto a RED-hazard shift requires credential_class ADVANCED" }
  - { id: ERR_BRIEFING_NOT_CURRENT, http: 422, condition: "Check-in or seat board without an ACTIVE SAFETY_BRIEFING with valid_until > now" }
  - { id: ERR_WAIVER_NOT_SIGNED, http: 422, condition: "PPE issuance, check-in, or seat board without an ACTIVE LIABILITY_WAIVER" }
  - { id: ERR_PPE_NOT_ISSUED, http: 422, condition: "Check-in without at least one PPEIssuance in ISSUED for the volunteer" }

  # --- Referential / temporal ---
  - { id: ERR_SITE_WINDOW_MISMATCH, http: 422, condition: "Assignment shift's site_name differs from the request's site_name, or the shift window is not contained in the request window" }
  - { id: ERR_DOUBLE_BOOKED_SHIFT, http: 409, condition: "Candidate shift interval [start_at, end_at) intersects one of the volunteer's CONFIRMED/CHECKED_IN shift intervals (half-open; adjacency allowed)" }
  - { id: ERR_DOUBLE_BOOKED_TRIP, http: 409, condition: "Volunteer already holds a non-CANCELLED seat booking on a trip whose [depart_at, arrive_estimate_at) half-open interval intersects the candidate trip's" }
  - { id: ERR_VEHICLE_TURNAROUND_CONFLICT, http: 409, condition: "Same vehicle_id has a SCHEDULED/DEPARTED trip whose window, padded by 45 minutes on both sides, intersects the new trip's padded window" }
  - { id: ERR_OUTSIDE_CHECKIN_WINDOW, http: 409, condition: "Check-in attempted outside [shift.start_at - 30min, shift.end_at]" }
  - { id: ERR_TOO_EARLY_FOR_NO_SHOW, http: 409, condition: "no-show attempted before shift.end_at" }
  - { id: ERR_SHIFT_WINDOW_PASSED, http: 409, condition: "open-roster attempted at/after shift end_at" }

  # --- Constraint / capacity / fiscal ---
  - { id: ERR_CLEARANCE_ALREADY_ACTIVE, http: 409, condition: "Second ACTIVE clearance of the same type for the same volunteer" }
  - { id: ERR_DUPLICATE_HOUR_ENTRY, http: 409, condition: "An HourEntry with status != REJECTED_FINAL already exists for the same (assignment_id, work_date)" }
  - { id: ERR_SHIFT_CAPACITY_REACHED, http: 409, condition: "Confirm would exceed shift capacity (rostered_count == capacity; the confirming assignment that exactly reaches capacity is allowed and locks the shift)" }
  - { id: ERR_SEAT_CAPACITY_REACHED, http: 409, condition: "Booking would exceed trip seat_capacity (booked_seats == seat_capacity; the booking that exactly fills the last seat is allowed)" }
  - { id: ERR_PPE_STOCK_INSUFFICIENT, http: 409, condition: "Issuance quantity > incident ppe_stock[item_type] (issuing exactly the remaining stock is allowed)" }
  - { id: ERR_WEEKLY_HOUR_CAP, http: 422, condition: "Confirm would push volunteer.committed_hours + shift.duration_hours strictly above 40.00 (exactly 40.00 is allowed)" }
  - { id: ERR_NO_ELIGIBLE_PLACEMENTS, http: 422, condition: "auto-match found zero placeable candidates (empty eligible pool or no eligible shift capacity)" }

  # --- Demobilization / completion gates ---
  - { id: ERR_OPEN_ASSIGNMENTS, http: 409, condition: "demobilize/begin-demobilization/complete while assignments remain in non-terminal states" }
  - { id: ERR_UNRETURNED_PPE, http: 409, condition: "demobilize while any PPEIssuance of the volunteer is still ISSUED" }
  - { id: ERR_HOURS_UNRESOLVED, http: 409, condition: "request complete while any HourEntry on its assignments is SUBMITTED or DISPUTED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: VRCManager
    description: "County VRC manager; owns incident lifecycle, demobilization, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/incidents — create incident"
      - "POST /vrc/incidents/{id}/activate | /begin-demobilization | /close"
      - "POST /vrc/volunteers/{id}/demobilize"
      - "POST /vrc/_clock/set_current_utc"
    shared_operations:
      - "POST /vrc/assignments/{id}/cancel (with IntakeCoordinator)"
      - "POST /vrc/clearances/{id}/revoke (with RiskOfficer)"
      - "all GET endpoints"
  - name: IntakeCoordinator
    description: "Front-desk intake staff; registers volunteers, records briefings/waivers, proposes and confirms assignments, runs auto-match"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/volunteers/{id}/submit-for-vetting | /mark-ready"
      - "POST /vrc/clearances"
      - "POST /vrc/assignments"
      - "POST /vrc/assignments/{id}/confirm"
      - "POST /vrc/support-requests/{id}/auto-match"
    shared_operations:
      - "POST /vrc/volunteers and PATCH /vrc/volunteers/{id} (with Volunteer)"
      - "POST /vrc/credentials (with Volunteer)"
      - "POST /vrc/volunteers/{id}/withdraw (with Volunteer)"
      - "POST /vrc/assignments/{id}/cancel (with VRCManager)"
      - "POST /vrc/risk-reports (with SiteSupervisor, LogisticsCoordinator)"
      - "all GET endpoints"
  - name: VettingOfficer
    description: "Credentialing specialist; verifies credentials and adjudicates background checks (segregated from intake)"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/credentials/{id}/verify | /reject"
      - "POST /vrc/background-checks and /{id}/clear | /flag"
    shared_operations:
      - "all GET endpoints"
  - name: LogisticsCoordinator
    description: "Site/transport/supply logistics; owns shifts, trips, seat bookings, PPE stock"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/shifts and /{id}/open-roster | /cancel"
      - "POST /vrc/trips and /{id}/depart | /arrive | /cancel"
      - "POST /vrc/seat-bookings and /{id}/cancel"
      - "POST /vrc/ppe-issuances and /{id}/close"
    shared_operations:
      - "POST /vrc/risk-reports (with SiteSupervisor, IntakeCoordinator)"
      - "all GET endpoints"
  - name: SiteSupervisor
    description: "On-site supervisor; checks volunteers in/out, boards vehicles, verifies or disputes hours, files risk reports"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/assignments/{id}/check-in | /complete | /no-show"
      - "POST /vrc/seat-bookings/{id}/board | /mark-no-show"
      - "POST /vrc/hour-entries/{id}/verify | /dispute"
    shared_operations:
      - "POST /vrc/hour-entries and /{id}/resubmit (with Volunteer)"
      - "POST /vrc/risk-reports (with IntakeCoordinator, LogisticsCoordinator)"
      - "all GET endpoints"
  - name: RiskOfficer
    description: "Volunteer risk management; adjudicates risk reports, suspends/reinstates, recalls deployed volunteers"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/risk-reports/{id}/substantiate | /dismiss"
      - "POST /vrc/volunteers/{id}/suspend | /reinstate"
      - "POST /vrc/assignments/{id}/recall"
    shared_operations:
      - "POST /vrc/clearances/{id}/revoke (with VRCManager)"
      - "all GET endpoints"
  - name: AgencyCoordinator
    description: "Requesting-agency liaison; files and manages support requests"
    identity: opaque
    exclusive_operations:
      - "POST /vrc/support-requests and PUT /vrc/support-requests/{id}"
      - "POST /vrc/support-requests/{id}/publish | /cancel | /complete"
    shared_operations:
      - "all GET endpoints"
  - name: Volunteer
    description: "Spontaneous unaffiliated volunteer; self-registers, accepts/declines assignments, reports own hours"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /vrc/assignments/{id}/accept | /decline"
    shared_operations:
      - "POST /vrc/volunteers and PATCH /vrc/volunteers/{id} (self; ownership-checked)"
      - "POST /vrc/volunteers/{id}/withdraw (self or IntakeCoordinator)"
      - "POST /vrc/credentials (own record)"
      - "POST /vrc/hour-entries and /{id}/resubmit (own assignments; ownership-checked)"
      - "all GET endpoints"
