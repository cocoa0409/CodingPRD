        excluded_because:
          difficulty_instance: combinatorial_formula / kit_assembly_rounding_order_round_per_line_then_sum
          rationale: "The named §1.8 instance pins the round-then-sum order against the sum-then-round reading on the same three-line kit."

      - name: cost_per_sample_variant_selection_and_reconciliation
        claim_type: variant_selection
        grounds:
