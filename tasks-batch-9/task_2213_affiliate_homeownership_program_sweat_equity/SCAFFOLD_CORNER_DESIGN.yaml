      - name: impact_report_over_an_empty_period_returns_integer_zeros
        claim_type: aggregation
        grounds: [calculations.households_served_report, "endpoints.POST /homeownership/grant-awards/{id}/impact-reports", entities.GrantAward.fields.status, entities.GrantAward.fields.period_start, entities.GrantAward.fields.period_end]
        distinguishing_aspect: "The documented EMPTY-SET boundary: a grant whose reporting window closes before any household has ever closed must report the integer 0 for every numeric field — never null and never a division-by-zero — with an empty households array, a negative target_variance, and the award still flipping to REPORTED."
        test_recipe:
          setup:
            - "Canonical program with no households at all, and one OPEN grant award covering 2026-01-01 to 2026-03-31 with a target of 4 households. The logical clock is 2026-08-01, so the window is entirely in the past and no ApplicantHousehold has ever reached CLOSED."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/grant-awards", payload: { program_id: "${prog_id}", award_code: "FHLB-2026-Q1", donor_name: "Federal Home Loan Bank", amount_cents: 2500000, period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-03-31T00:00:00.000Z", households_served_target: 4 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { grant_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/grant-awards/${grant_id}/impact-reports", payload: {}, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/grant-awards/${grant_id}", as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "HTTP 200 and response_type == object"
            - "households_served == 0, persons_served == 0, sweat_equity_hours == 0, cost_total_cents == 0, subsidy_total_cents == 0 — every one the integer 0, none of them null"
            - "cost_per_household_cents == 0 and subsidy_per_household_cents == 0 rather than an error, because the households_served == 0 guard short-circuits the division"
            - "target_variance == -4 (0 served minus the target of 4), so the field is signed"
            - "The households itemization is the empty array []"
            - "basis == CASH_BASIS, since restricted_to_in_kind_reporting was omitted and defaults to false"
            - "The award re-read shows status == REPORTED and its version incremented by 1"

      - name: weekly_volunteer_cap_accepts_exactly_forty_hours_then_refuses_one_more
        claim_type: interval_merge
        grounds: [calculations.volunteer_shift_overlap_and_weekly_cap, entities.VolunteerProfile.fields.assigned_hours_committed, "validations[priority=31]", errors.ERR_VOLUNTEER_WEEKLY_CAP_EXCEEDED, "endpoints.POST /homeownership/shift-assignments"]
        distinguishing_aspect: "The aggregate boundary on a calendar-anchored week: four disjoint 10-hour reservations on Monday 2026-08-03 through Thursday 2026-08-06 sum to exactly ADULT_WEEKLY_CAP_HOURS 40.00 and the fourth is ACCEPTED, while a single further hour on Friday 2026-08-07 — inside the same Monday-anchored week and overlapping nothing — is refused. RESERVED seats count toward the week, so no confirmation is needed."
        test_recipe:
          setup:
            - "Canonical program, one READY_TO_BUILD site and one adult volunteer whose waiver runs to 2027-12-31. Five OPEN shifts sit on the same site: 2026-08-03, 08-04, 08-05 and 08-06 each from 08:00 to 18:00 (10 hours), and 2026-08-07 from 08:00 to 09:00 (1 hour). They are on distinct days, so the closed 60-minute site cleanup buffer never binds. The volunteer holds RESERVED seats on the first three, so assigned_hours_committed is 30.0. The clock is 2026-08-01, before every start_at."
