# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: salon_create_applies_defaults
        claim_type: creation
        grounds: ["entities.SalonAccount"]
        distinguishing_aspect: "POST /api/salon-accounts returns 201 with status PENDING_VERIFICATION, tier SILVER, all computed counters 0, version 1."
        test_recipe:
          setup: ["A consultant exists to onboard the salon"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C N", territory_codes: ["WA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon N", territory_code: "WA", assigned_consultant_id: "${c_id}" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
          assert:
            - "SalonAccount.${s_id}.status == PENDING_VERIFICATION and tier == SILVER"
            - "education_credit_points == 0, diversion_strike_points == 0, diversion_risk_score == 0, trailing_12m_delivered_volume_cents == 0"
            - "version == 1 and suspension_reason == null and tier_override_active == false"

      - name: salon_create_missing_required_field
        claim_type: required_fields
        grounds: ["entities.SalonAccount.fields.legal_name"]
        distinguishing_aspect: "Omitting required legal_name is rejected with ERR_INVALID_REQUEST (400) before any state is persisted."
        test_recipe:
          setup: ["A consultant exists"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C M", territory_codes: ["WA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/salon-accounts", payload: { territory_code: "WA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: salon_create_unknown_field_returns_400
        claim_type: type_constraints
        grounds: ["validations[priority=2]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A body field not declared in the endpoint input (client-supplied id) is rejected, not silently ignored."
        test_recipe:
          setup: ["A consultant exists"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C U", territory_codes: ["WA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon U", territory_code: "WA", id: "00000000-0000-4000-8000-000000000000" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (unknown/system field in body)"

      - name: product_create_invalid_hazmat_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Product.fields.hazmat_class"]
        distinguishing_aspect: "hazmat_class outside {NONE, AEROSOL, FLAMMABLE_LIQUID} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A brand exists"]
          setup_api_calls:
            - { call: "POST /api/brands", payload: { name: "BrandE0" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-E0", name: "Bad", variant_type: RETAIL, hazmat_class: "EXPLOSIVE", base_price_cents: 1000, weight_grams: 100 }, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: exclusive_window_inverted_returns_400
        claim_type: type_constraints
        grounds: ["entities.BrandTerritoryExclusive.fields.effective_to"]
        distinguishing_aspect: "effective_to <= effective_from is rejected with ERR_INVALID_TIME_WINDOW (strict inequality)."
        test_recipe:
          setup: ["A brand exists"]
          setup_api_calls:
            - { call: "POST /api/brands", payload: { name: "BrandE1" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/brands/${b_id}/territory-exclusives", payload: { territory_code: "OR", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TIME_WINDOW (equal endpoints are not strictly increasing)"

      - name: credit_ledger_entries_have_no_version_field
        claim_type: immutability
        grounds: ["entities.EducationCreditEntry"]
        distinguishing_aspect: "EducationCreditEntry has common_fields false: entries expose id and created_at but no version and no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["ACTIVE SILVER salon with one SUBMITTED order (provisional accrual posted)"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C L", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon L", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-L-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic: "$.data.id" } }
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandL" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-L1", name: "Gel", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 10000, weight_grams: 100 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
          trigger:
            - { call: "GET /api/salon-accounts/${s_id}/credit-ledger", payload: {}, as: DistributionAdmin }
          assert:
            - "Exactly one entry: entry_type == PROVISIONAL_ACCRUAL, points == 10"
            - "The entry object has keys id and created_at but no version and no updated_at"

      - name: salon_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SALON_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET of a random salon UUID returns ERR_SALON_ACCOUNT_NOT_FOUND and the error envelope shape (meta + response_type error + data.error_id/message)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/salon-accounts/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SALON_ACCOUNT_NOT_FOUND (http 404)"
            - "Error envelope: meta.api_request_id present, response_type == 'error', data.message present"

      - name: license_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LICENSE_NOT_FOUND]"]
        distinguishing_aspect: "ERR_LICENSE_NOT_FOUND (404) on unknown license id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/licenses/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_LICENSE_NOT_FOUND"]

      - name: brand_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_BRAND_NOT_FOUND]"]
        distinguishing_aspect: "ERR_BRAND_NOT_FOUND (404) on unknown brand id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/brands/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_BRAND_NOT_FOUND"]

      - name: product_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "ERR_PRODUCT_NOT_FOUND (404) on unknown product id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/products/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_PRODUCT_NOT_FOUND"]

      - name: consultant_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CONSULTANT_NOT_FOUND]"]
        distinguishing_aspect: "ERR_CONSULTANT_NOT_FOUND (404) on unknown consultant id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/sales-consultants/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_CONSULTANT_NOT_FOUND"]

      - name: route_plan_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ROUTE_PLAN_NOT_FOUND]"]
        distinguishing_aspect: "ERR_ROUTE_PLAN_NOT_FOUND (404) on unknown route plan id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/route-plans/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_ROUTE_PLAN_NOT_FOUND"]

      - name: route_stop_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ROUTE_STOP_NOT_FOUND]"]
        distinguishing_aspect: "ERR_ROUTE_STOP_NOT_FOUND (404) on unknown route stop id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/route-stops/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_ROUTE_STOP_NOT_FOUND"]

      - name: order_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "ERR_ORDER_NOT_FOUND (404) on unknown order id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/orders/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_ORDER_NOT_FOUND"]

      - name: order_item_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "ERR_ORDER_ITEM_NOT_FOUND (404) on unknown order item id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/order-items/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_ORDER_ITEM_NOT_FOUND"]

      - name: shipment_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SHIPMENT_NOT_FOUND]"]
        distinguishing_aspect: "ERR_SHIPMENT_NOT_FOUND (404) on unknown shipment id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/shipments/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_SHIPMENT_NOT_FOUND"]

      - name: promotion_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROMOTION_NOT_FOUND]"]
        distinguishing_aspect: "ERR_PROMOTION_NOT_FOUND (404) on unknown promotion id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/promotions/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_PROMOTION_NOT_FOUND"]

      - name: redemption_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_REDEMPTION_NOT_FOUND]"]
        distinguishing_aspect: "ERR_REDEMPTION_NOT_FOUND (404) on unknown redemption id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/promotion-redemptions/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_REDEMPTION_NOT_FOUND"]

      - name: diversion_case_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_DIVERSION_CASE_NOT_FOUND]"]
        distinguishing_aspect: "ERR_DIVERSION_CASE_NOT_FOUND (404) on unknown diversion case id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /api/diversion-cases/00000000-0000-4000-8000-000000000000", payload: {}, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_DIVERSION_CASE_NOT_FOUND"]

  - section: state_machines
    instances:
      - name: license_verify_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ProfessionalLicense.SUBMITTED_to_VERIFIED", "errors[ERR_INVALID_LICENSE_STATE]"]
        distinguishing_aspect: "Verify on an already-VERIFIED license fails with ERR_INVALID_LICENSE_STATE; the salon stays ACTIVE and version does not advance."
        test_recipe:
          setup: ["Salon with a VERIFIED license"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 1", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon 1", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-1", issuing_state: "CA", license_type: BARBER, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic: "$.data.id" } }
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_LICENSE_STATE"
            - "ProfessionalLicense.${lic}.status remains VERIFIED"

      - name: diversion_case_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DiversionCase.UNDER_REVIEW_to_SUBSTANTIATED", "errors[ERR_INVALID_DIVERSION_CASE_STATE]"]
        distinguishing_aspect: "SUBSTANTIATED is terminal: a second substantiate fails with ERR_INVALID_DIVERSION_CASE_STATE and no extra strike points are awarded."
        test_recipe:
          setup: ["ACTIVE salon; diversion case already SUBSTANTIATED (strikes 1, MINOR)"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 2", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon 2", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-2", issuing_state: "CA", license_type: BARBER, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic: "$.data.id" } }
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "Brand2" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-2", name: "Wax", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 3000, weight_grams: 100 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/diversion-cases", payload: { salon_account_id: "${s_id}", product_id: "${p1}", severity: MINOR, evidence_note: "flea market booth", hold_shipments: false }, as: SalesConsultant, as_user_id: "${c_id}", captures: { dc: "$.data.id" } }
            - { call: "POST /api/diversion-cases/${dc}/start-review", payload: {}, as: ComplianceOfficer, as_user_id: "officer-a" }
            - { call: "POST /api/diversion-cases/${dc}/substantiate", payload: {}, as: ComplianceOfficer, as_user_id: "officer-a" }
          trigger:
            - { call: "POST /api/diversion-cases/${dc}/substantiate", payload: {}, as: ComplianceOfficer, as_user_id: "officer-b", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_DIVERSION_CASE_STATE"
            - "SalonAccount.${s_id}.diversion_strike_points == 1 (unchanged)"

      - name: order_cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Order.DRAFT_to_CANCELLED", "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED order fails with ERR_INVALID_ORDER_STATE; no double reversal entries are posted."
        test_recipe:
          setup: ["ACTIVE salon with a DRAFT order that gets cancelled"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 3", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon 3", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-3", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic: "$.data.id" } }
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "Brand3" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-3", name: "Clay", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 3000, weight_grams: 100 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/cancel", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /api/orders/${o_id}/cancel", payload: {}, as: SalonBuyer, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE"
            - "Order.${o_id}.fulfillment_status remains CANCELLED"

      - name: shipment_void_label_cycle_restores_planned
        claim_type: cyclic
        grounds: ["state_machines.Shipment.LABEL_CREATED_to_PLANNED", "entities.Order.fields.shipping_total_cents"]
        distinguishing_aspect: "Voiding a label cycles the shipment LABEL_CREATED -> PLANNED and withdraws its 1200-cent GROUND charge from the order totals (grand_total returns to net_merch)."
        test_recipe:
          setup: ["ACTIVE SILVER salon; APPROVED order of 1 x RETAIL 6000; shipment GROUND created and labelled"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 4", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon 4", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-4", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic: "$.data.id" } }
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "Brand4" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-4", name: "Paste", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 6000, weight_grams: 100 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o_id}/approve", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/order-items?order_id=${o_id}", payload: {}, as: DistributionAdmin, captures: { it0: "$.data[0].id" } }
            - { call: "POST /api/orders/${o_id}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${it0}", quantity: 1 } ] }, as: WarehouseOperator, captures: { sh: "$.data.id" } }
            - { call: "POST /api/shipments/${sh}/create-label", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/shipments/${sh}/void-label", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/shipments/${sh}", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: DistributionAdmin }
          assert:
            - "Shipment.${sh}.status == PLANNED (cycle back)"
            - "Order.${o_id}.shipping_total_cents == 0 and grand_total_cents == 6000 (net_merch restored)"

      - name: route_plan_autocompletes_when_all_stops_terminal
        claim_type: compound
        grounds: ["state_machines.RoutePlan.PUBLISHED_to_COMPLETED", "state_machines.RouteStop.SCHEDULED_to_COMPLETED"]
        distinguishing_aspect: "Compound shape: completing the plan's only stop bubbles up and flips the RoutePlan PUBLISHED -> COMPLETED without a direct plan transition call."
        test_recipe:
          setup: ["PUBLISHED route plan with exactly one SCHEDULED stop"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 5", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon 5", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
