          assert:
            - "purpose MONTHLY returns 400 ERR_INVALID_REQUEST — an undeclared enum member is a shape failure, not a 422"
            - "REAL_ESTATE with no closing_date returns 422 ERR_FIELD_COMBINATION_INVALID, and INITIAL WITH a closing_date returns the same code — the rule is 'present exactly when', so both polarities fire"
            - "scheduled_end_at equal to scheduled_start_at returns 422 ERR_FIELD_COMBINATION_INVALID: the bound is strict, so a zero-length window is not a shape error but a cross-field error"
