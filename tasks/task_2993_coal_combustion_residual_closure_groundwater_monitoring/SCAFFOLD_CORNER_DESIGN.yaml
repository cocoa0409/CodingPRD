              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/monitoring-programs/${prog_id}/certify-network"
