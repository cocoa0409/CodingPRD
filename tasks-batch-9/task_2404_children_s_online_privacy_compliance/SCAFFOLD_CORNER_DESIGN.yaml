          setup:
            - "Clock at 2026-08-01T00:00:00Z; service with NO determination evidence and determination never run."
            - "Fully valid surroundings: ACTIVE neutral age screen, activity CLUB requiring SCREEN_NAME, retention schedule (SCREEN_NAME, PARTICIPATION_CORE) 30 days ANONYMIZE effective 2026-01-01..2026-12-31, PUBLISHED notice, consent GRANTED via KNOWLEDGE_BASED_AUTH."
