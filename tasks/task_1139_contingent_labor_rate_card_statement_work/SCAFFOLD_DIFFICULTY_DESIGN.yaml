            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/engagements/${e1_id}/milestones"
              payload: { name: "M", amount_cents: 1000000, due_date: "2026-06-30" }
              as: HiringManager
              captures: { m_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/close", payload: {}, as: HiringManager }
          trigger:
            - call: "POST /v1/milestones/${m_id}/deliver"
              payload: {}
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { err: "$.data.error_id", m_acc: "$.data.acceptance_status" }
          assert:
            - "error_id == ERR_ENGAGEMENT_NOT_ACTIVE (http 409) — Milestone delivery gated on Engagement.status == ACTIVE"
            - "Milestone.${m_id}.acceptance_status remains PENDING (no partial mutation)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_card_half_open_window_overlap
        grounds:
          - validations[priority=8]
          - state_machines.RateCard.DRAFT_to_ACTIVE
          - entities.RateCard
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on the
          composite rate-card key (role, skill, geo) — windows touching at one
          endpoint are NOT an overlap (adjacency allowed, gap 0 allowed).
          Resource: the rate-card key. Distinct semantics and resource from
          worker_closed_interval_double_booking (closed inclusive intervals on
          Worker).
        test_recipe:
          setup:
            - "Card A ACTIVE for SWE/JAVA/US-CA with window [2026-05-01, 2026-08-01)"
            - "Card B DRAFT same key, overlapping window [2026-06-01, 2026-09-01)"
            - "Card C DRAFT same key, adjacent window [2026-08-01, 2026-11-01)"
            - "Card D DRAFT different skill (SWE/PYTHON/US-CA), same window as B"
          setup_api_calls:
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-05-01", effective_to: "2026-08-01" }
              as: ProgramAdmin
              captures: { ra_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${ra_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12500, max_markup_pct: 0.25, effective_from: "2026-06-01", effective_to: "2026-09-01" }
              as: ProgramAdmin
              captures: { rb_id: "$.data.id" }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 13000, max_markup_pct: 0.25, effective_from: "2026-08-01", effective_to: "2026-11-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "PYTHON", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12500, max_markup_pct: 0.25, effective_from: "2026-06-01", effective_to: "2026-09-01" }
              as: ProgramAdmin
              captures: { rd_id: "$.data.id" }
          trigger:
            - call: "POST /v1/rate-cards/${rb_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err_b: "$.data.error_id" }
            - call: "POST /v1/rate-cards/${rc_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { st_c: "$.data.status" }
            - call: "POST /v1/rate-cards/${rd_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { st_d: "$.data.status" }
          assert:
            - "Card B activation rejected: ERR_RATE_CARD_WINDOW_OVERLAP ([2026-06-01, 2026-09-01) intersects A's [2026-05-01, 2026-08-01))"
            - "Card C activation succeeds (status ACTIVE): [2026-08-01, 2026-11-01) only touches A's exclusive end — half-open adjacency is not overlap"
            - "Card D activation succeeds (status ACTIVE): identical window to B but different skill_code — the resource is the composite key, not the calendar"
            - "Card B remains DRAFT after rejection"

      - name: worker_closed_interval_double_booking
        grounds:
          - validations[priority=8]
          - entities.Assignment
          - entities.Worker
        distinguishing_aspect: |
          Interval semantics: CLOSED inclusive intervals on the Worker resource
          — two assignments sharing even a single calendar day conflict
          (touching IS overlap), unlike the half-open rate-card rule where
          touching is allowed. Resource: Worker. Endpoint: POST
          /v1/assignments — distinct from rate-cards activate.
        test_recipe:
          setup:
            - "Worker W1 (supplier S1) with ACTIVE assignment A1 [2026-05-01, 2026-06-30] on engagement E1"
            - "Engagement E2 ACTIVE with ACCEPTED offer O2 for S1"
          setup_api_calls:
