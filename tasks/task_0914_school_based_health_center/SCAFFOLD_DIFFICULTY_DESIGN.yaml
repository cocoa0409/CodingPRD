  - rule_id: boundary_precision_check
    instances:

      - name: dose_valid_exactly_on_grace_adjusted_earliest_date_invalid_one_day_before
        grounds:
          - calculations.immunization_dose_validity
          - entities.ImmunizationDose.fields.earliest_valid_date
          - entities.ImmunizationDose.fields.strict_earliest_valid_date
          - state_machines.ImmunizationDose.null_to_VALID
          - state_machines.ImmunizationDose.null_to_INVALID_TOO_EARLY
        distinguishing_aspect: |
          Numeric-threshold boundary on the immunization interval metric, reached
          through POST /sbhc/students/{id}/immunization-doses. With HEPB dose 1 on
          2025-09-01 the strict due date is 2025-09-29 and the grace-adjusted
          earliest_valid_date is 2025-09-25. A dose on 2025-09-24 is
          INVALID_TOO_EARLY and a dose on exactly 2025-09-25 is VALID, pinning the
          comparison as >= rather than >.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school, one MEDICAL clinician, one student with an ACTIVE 2025-2026 enrollment."
            - "One VALID HEPB dose 1 administered on 2025-09-01 on file."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/clinicians"
              payload: { full_name: "Dana Reyes NP", discipline: "MEDICAL", license_number: "NP-1001" }
              as: SbhcAdmin
              captures: { clin_med_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v1: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v1}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /sbhc/students/${stu_id}/immunization-doses"
              payload: { series_code: "HEPB", dose_number: 1, administered_date: "2025-09-01" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { hepb1_id: "$.data.id" }
          trigger:
            - call: "POST /sbhc/students/${stu_id}/immunization-doses"
              payload: { series_code: "HEPB", dose_number: 2, administered_date: "2025-09-24" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { early_dose_id: "$.data.id", early_status: "$.data.status" }
            - call: "POST /sbhc/students/${stu_id}/immunization-doses"
              payload: { series_code: "HEPB", dose_number: 2, administered_date: "2025-09-25" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { edge_dose_id: "$.data.id", edge_status: "$.data.status" }
          assert:
            - "ImmunizationDose.${early_dose_id}.status == INVALID_TOO_EARLY"
            - "ImmunizationDose.${early_dose_id}.invalid_reason == MIN_INTERVAL_NOT_MET"
            - "ImmunizationDose.${early_dose_id}.earliest_valid_date == 2025-09-25"
            - "ImmunizationDose.${early_dose_id}.strict_earliest_valid_date == 2025-09-29"
            - "ImmunizationDose.${edge_dose_id}.status == VALID"
            - "ImmunizationDose.${edge_dose_id}.earliest_valid_date == 2025-09-25"
            - "ImmunizationDose.${edge_dose_id}.invalid_reason is null"
            - "Student.${stu_id}.valid_dose_count == 2"
            - "Student.${stu_id}.invalid_dose_count == 1"
            - "Student.${stu_id}.total_dose_count == 3"
            - "Student.${stu_id}.immunization_compliance_status == NON_COMPLIANT"

      - name: report_rates_return_zero_on_empty_referral_and_visit_sets
        grounds:
          - calculations.referral_closure_rate
          - calculations.report_visit_partition
          - entities.AggregateReport.fields.referral_closure_rate_all
          - entities.AggregateReport.fields.referral_closure_rate_excluding_lost
          - validations[priority=8]
        distinguishing_aspect: |
          An empty-collection boundary on a DIFFERENT metric and a DIFFERENT
          endpoint from the dose-interval boundary: POST /sbhc/reports over a
          period containing zero visits and zero referrals must return exactly
          0.0000 for both closure-rate variants rather than dividing by zero, and
          all six visit counts and all five money buckets must be 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school; no students, no visits and no referrals exist."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
          trigger:
            - call: "POST /sbhc/reports"
              payload: { period_start_date: "2026-04-01", period_end_date: "2026-04-30", school_id: "${school_id}" }
              as: SbhcAdmin
              captures: { rep_id: "$.data.id" }
          assert:
            - "AggregateReport.${rep_id}.total_visits == 0"
            - "AggregateReport.${rep_id}.scheduled_visit_count == 0"
            - "AggregateReport.${rep_id}.in_progress_visit_count == 0"
            - "AggregateReport.${rep_id}.completed_visit_count == 0"
            - "AggregateReport.${rep_id}.cancelled_visit_count == 0"
            - "AggregateReport.${rep_id}.no_show_visit_count == 0"
            - "AggregateReport.${rep_id}.referral_total_count == 0"
            - "AggregateReport.${rep_id}.referral_closed_count == 0"
            - "AggregateReport.${rep_id}.referral_lost_count == 0"
            - "AggregateReport.${rep_id}.referral_closure_rate_all == 0.0000"
            - "AggregateReport.${rep_id}.referral_closure_rate_excluding_lost == 0.0000"
            - "AggregateReport.${rep_id}.gross_charge_total_cents == 0"
            - "AggregateReport.${rep_id}.patient_responsibility_total_cents == 0"
            - "AggregateReport.${rep_id}.payer_billed_total_cents == 0"
            - "AggregateReport.${rep_id}.write_off_total_cents == 0"
            - "AggregateReport.${rep_id}.no_charge_total_cents == 0"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: visit_create_gated_by_school_program_status
        grounds:
          - state_machines.School.ACTIVE_to_SUSPENDED
          - state_machines.School.SUSPENDED_to_ACTIVE
          - state_machines.Visit.null_to_SCHEDULED
          - validations[priority=14]
          - errors[ERR_SCHOOL_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Visit -> School: whether a Visit may be created at all depends
          on School.program_status, a field on a different aggregate. The identical
          create payload fails with ERR_SCHOOL_SUSPENDED while the site is SUSPENDED
          and succeeds once the site is reinstated, with no change to the student,
          the enrollment or the consent in between.
        test_recipe:
          setup:
