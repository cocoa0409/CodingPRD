  - rule_id: cross_entity_state_dependency
    instances:
      - name: placement_gated_by_target_ensemble_roster_state
        grounds:
          - validations[priority=41]
          - state_machines.Ensemble.FORMING_to_SEATED
          - entities.Ensemble.fields.roster_state
          - entities.Placement.fields.ensemble_id
          - errors.ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS
        distinguishing_aspect: |
          Entity pair Placement -> Ensemble: whether a Placement may be created
          depends on the roster_state of a DIFFERENT entity, the target Ensemble.
          The identical request body (same audition, same offer_kind, same
          capacity headroom - E1 still has filled 1 of max_count 2) is refused
          against the SEATED ensemble and accepted against the FORMING one, so
          only the other entity's state can explain the difference. Two ensembles
          keep the Season pinned at PLACEMENT, isolating the ensemble gate from
          the season gate in the same rule.
