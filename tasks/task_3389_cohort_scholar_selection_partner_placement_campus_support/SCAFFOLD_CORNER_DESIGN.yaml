# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_3389: Cohort Scholar Selection, Partner Placement & Campus Support
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values
# follow the claim-extraction guide. Instances already exercised as the
# failure/success path of a §1.8 difficulty instance appear as
# excluded_because stubs. Logical clock boots at 2026-09-01T00:00:00Z; the
# standard fixture window is cycle "2027", nomination window
# 2026-09-01T00:00:00Z..2026-11-30T23:59:59Z (default clock is inside it).
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: city_program_creation_stamps_system_fields
        claim_type: creation
        grounds: [entities.CityProgram]
        distinguishing_aspect: "POST /api/city-programs returns 201 with all input fields echoed plus server-stamped id (UUID), created_at, updated_at, and version == 1; a follow-up GET returns the identical representation."
        test_recipe:
          setup: ["Empty database; logical clock at the 2026-09-01T00:00:00Z default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id, cpv: $.data.version, cpcode: $.data.code } }
            - { call: "GET /api/city-programs/${cp}", as: ProgramAdmin, captures: { cp2: $.data.id, cpname: $.data.name } }
          assert:
            - "Create returns HTTP 201; data.id is a UUID, data.version == 1 (captured ${cpv}), data.code == ATL (captured ${cpcode})"
            - "GET /api/city-programs/${cp} returns the same id and name == Atlanta (captured ${cp2}, ${cpname}) — immediate consistency"
            - "data.created_at == 2026-09-01T00:00:00Z logical-clock default (millisecond fraction allowed), not wall-clock time"
      - name: nominee_create_missing_required_full_name
        claim_type: required_fields
        grounds: [entities.Nominee.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input full_name on POST /api/nominees returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["City program and partner exist; window open"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
          trigger:
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}" }, as: Nominator, as_user_id: "${np}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (captured ${err})"
            - "GET /api/nominees?city_program_id=${cp} returns total_count == 0"
      - name: nominee_first_generation_defaults_false
        claim_type: defaults
        grounds: [entities.Nominee.fields.first_generation]
        distinguishing_aspect: "Omitting optional first_generation yields false in the created nominee; passing true is honored."
        test_recipe:
          setup: ["City program and partner exist; window open"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
          trigger:
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "No Flag" }, as: Nominator, as_user_id: "${np}", captures: { fg1: $.data.first_generation } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Flagged", first_generation: true }, as: Nominator, as_user_id: "${np}", captures: { fg2: $.data.first_generation } }
          assert:
            - "First nominee first_generation == false (captured ${fg1}) — default applied"
            - "Second nominee first_generation == true (captured ${fg2}) — explicit value honored"
      - name: partner_quota_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.NominatingPartner.fields.nomination_quota, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "nomination_quota must satisfy 1 <= quota <= 20: 0 and 21 both fail with 400 ERR_INVALID_REQUEST while 20 succeeds."
        test_recipe:
          setup: ["City program exists"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
          trigger:
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "Zero Quota HS", kind: "HIGH_SCHOOL", nomination_quota: 0 }, as: ProgramAdmin, captures: { err0: $.data.error_id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "Big Quota HS", kind: "HIGH_SCHOOL", nomination_quota: 21 }, as: ProgramAdmin, captures: { err21: $.data.error_id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "Edge Quota HS", kind: "HIGH_SCHOOL", nomination_quota: 20 }, as: ProgramAdmin, captures: { ok20: $.data.id } }
          assert:
            - "quota 0 -> 400 ERR_INVALID_REQUEST (captured ${err0}); quota 21 -> 400 ERR_INVALID_REQUEST (captured ${err21})"
            - "quota 20 (the inclusive upper bound) -> 201 (captured ${ok20})"
      - name: evaluation_record_has_no_version_field
        claim_type: immutability
        grounds: [entities.Evaluation]
        distinguishing_aspect: "Evaluation declares common_fields: false (append-only record): its serialized form carries id and created_at but no version and no updated_at, and the API surface has no evaluation update endpoint."
        test_recipe:
          setup: ["Nominee in ROUND_1 with one submitted evaluation"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One", nominator_id: "${np}" }, as: ProgramAdmin, captures: { n1: $.data.id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a", captures: { e1: $.data.id } }
          trigger:
            - { call: "GET /api/nominees/${n1}/evaluations", as: ProgramAdmin }
          assert:
            - "The listed evaluation ${e1} exposes id, created_at, nominee_id, round_number, assessor_ref, the three dimension scores and weighted_score"
            - "The serialized evaluation has NO version key and NO updated_at key (common_fields: false)"
      - name: cohort_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed UUID that does not exist returns 404 ERR_NOT_FOUND (not 400, not an empty object)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/cohorts/00000000-0000-0000-0000-000000000000", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND (captured ${err})"
      - name: nominees_list_paginates_and_filters
        claim_type: listing
        grounds: [response_envelope, entities.Nominee]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more, and composes with the status filter: 3 NOMINATED nominees, limit=2 -> 2 items with has_more true and total_count 3; offset=2 -> 1 item with has_more false; status=ROUND_1 -> total_count 0."
        test_recipe:
          setup: ["Three nominees, all in NOMINATED status"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One" }, as: Nominator, as_user_id: "${np}" }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom Two" }, as: Nominator, as_user_id: "${np}" }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom Three" }, as: Nominator, as_user_id: "${np}" }
          trigger:
            - { call: "GET /api/nominees?city_program_id=${cp}&status=NOMINATED&limit=2", as: ProgramAdmin }
            - { call: "GET /api/nominees?city_program_id=${cp}&status=NOMINATED&limit=2&offset=2", as: ProgramAdmin }
            - { call: "GET /api/nominees?city_program_id=${cp}&status=ROUND_1", as: ProgramAdmin }
          assert:
            - "Page 1: data has 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset=2): data has 1 item, total_count == 3, has_more == false"
            - "Filter status=ROUND_1: total_count == 0 and data is empty (filter composes with pagination metadata)"
      - name: partner_nominations_used_is_computed
        claim_type: computed_fields
        grounds: [entities.NominatingPartner.fields.nominations_used, entities.Nominee.fields.round_1_score]
        distinguishing_aspect: "Computed fields are server-derived: a fresh partner shows nominations_used == 0, and a nominee's round_1_score is null until the second evaluation lands (input-set filtering), then becomes the rounded average."
        test_recipe:
          setup: ["Partner created; one nominee advanced to ROUND_1"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id, used0: $.data.nominations_used } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One" }, as: Nominator, as_user_id: "${np}", captures: { n1: $.data.id, r1null: $.data.round_1_score } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
          trigger:
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 60, teamwork: 60, group_presence: 60 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "GET /api/nominees/${n1}", as: ProgramAdmin, captures: { r1one: $.data.round_1_score } }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 61, teamwork: 59, group_presence: 60 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "GET /api/nominees/${n1}", as: ProgramAdmin, captures: { r1two: $.data.round_1_score } }
            - { call: "GET /api/city-programs/${cp}/partners", as: ProgramAdmin, captures: { used1: "$.data[0].nominations_used" } }
          assert:
            - "Fresh partner nominations_used == 0 (captured ${used0}); after one nomination it reads 1 (captured ${used1})"
            - "At creation round_1_score is null (captured ${r1null}); after ONE evaluation it is still null (captured ${r1one}) — the input set requires >= 2 evaluations"
            - "After the second evaluation round_1_score == 601 (captured ${r1two}: weighted 600 and 601, round_half_up(600.5) = 601)"
  - section: state_machines
    instances:
      - name: entities_boot_into_declared_initial_states
        claim_type: initial_state
        grounds: [state_machines.Nominee, state_machines.PartnerAgreement, state_machines.Cohort, state_machines.Offer]
        distinguishing_aspect: "Each machine's documented initial state is what a fresh entity actually shows: agreement DRAFT at create, nominee NOMINATED with current_round 0, cohort FORMING with a zeroed ledger and null invoice, offer OFFERED with expires_at 14 days out."
        test_recipe:
          setup: ["Standard program/college/agreement/mentor scaffold; one nominee fully assessed to SELECTED"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/partner-colleges", payload: { name: "Elm College" }, as: ProgramAdmin, captures: { coll: $.data.id, collv: $.data.version } }
            - { call: "POST /api/partner-agreements", payload: { partner_college_id: "${coll}", admissions_cycle: "2027", cohort_size: 3, tuition_annual_cents: 6123460, expected_college_version: "${collv}" }, as: ProgramAdmin, captures: { agr: $.data.id, agrst: $.data.status } }
            - { call: "POST /api/partner-agreements/${agr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/mentors", payload: { partner_college_id: "${coll}", full_name: "Prof Elm" }, as: ProgramAdmin, captures: { men: $.data.id } }
            - { call: "POST /api/cohorts", payload: { agreement_id: "${agr}", city_program_id: "${cp}", mentor_id: "${men}" }, as: ProgramAdmin, captures: { coh: $.data.id, cohst: $.data.status, cohcom: $.data.seats_committed, cohinv: $.data.invoice_total_cents } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One" }, as: Nominator, as_user_id: "${np}", captures: { n1: $.data.id, n1st: $.data.status, n1rnd: $.data.current_round } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
          trigger:
            - { call: "POST /api/offers", payload: { nominee_id: "${n1}", cohort_id: "${coh}" }, as: SelectionOfficer, captures: { o1: $.data.id, o1st: $.data.status, o1exp: $.data.expires_at } }
          assert:
            - "Agreement was DRAFT at creation (captured ${agrst})"
            - "Nominee was NOMINATED with current_round == 0 at creation (captured ${n1st}, ${n1rnd})"
            - "Cohort was FORMING with seats_committed == 0 and invoice_total_cents == null at creation (captured ${cohst}, ${cohcom}, ${cohinv})"
            - "Offer ${o1} is OFFERED (captured ${o1st}) and expires_at (captured ${o1exp}) is exactly 14 days after its created_at"
      - name: nominee_waitlist_before_round_3_and_thin_evals_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Nominee, "errors[ERR_INVALID_STATE]", "errors[ERR_INSUFFICIENT_EVALUATIONS]"]
        distinguishing_aspect: "From ROUND_1 the WAITLIST decision is not a declared transition (ERR_INVALID_STATE), and ADVANCE with only one evaluation fails the >= 2 gate (ERR_INSUFFICIENT_EVALUATIONS) before any cutoff arithmetic runs."
        test_recipe:
          setup: ["Nominee in ROUND_1 with exactly one evaluation"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One" }, as: Nominator, as_user_id: "${np}", captures: { n1: $.data.id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
          trigger:
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "WAITLIST" }, as: SelectionOfficer, captures: { errw: $.data.error_id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer, captures: { erra: $.data.error_id } }
          assert:
            - "WAITLIST from ROUND_1 -> 409 ERR_INVALID_STATE (captured ${errw}): WAITLIST exists only on ROUND_3"
            - "ADVANCE with 1 evaluation -> 422 ERR_INSUFFICIENT_EVALUATIONS (captured ${erra})"
            - "Nominee remains ROUND_1 with round_1_score null after both rejections"
      - name: accepted_offer_and_placed_nominee_are_terminal_locked
        claim_type: terminal_lockdown
        grounds: [state_machines.Offer, state_machines.Nominee, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ACCEPTED offer rejects a second accept (idempotency of the transition), and the PLACED nominee rejects any further decision — both terminal-adjacent states lock out repeats."
        test_recipe:
          setup: ["Nominee n1 SELECTED; offer o1 created and accepted (n1 now PLACED)"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/partner-colleges", payload: { name: "Elm College" }, as: ProgramAdmin, captures: { coll: $.data.id, collv: $.data.version } }
            - { call: "POST /api/partner-agreements", payload: { partner_college_id: "${coll}", admissions_cycle: "2027", cohort_size: 3, tuition_annual_cents: 6123460, expected_college_version: "${collv}" }, as: ProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /api/partner-agreements/${agr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/mentors", payload: { partner_college_id: "${coll}", full_name: "Prof Elm" }, as: ProgramAdmin, captures: { men: $.data.id } }
            - { call: "POST /api/cohorts", payload: { agreement_id: "${agr}", city_program_id: "${cp}", mentor_id: "${men}" }, as: ProgramAdmin, captures: { coh: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One" }, as: Nominator, as_user_id: "${np}", captures: { n1: $.data.id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/offers", payload: { nominee_id: "${n1}", cohort_id: "${coh}" }, as: SelectionOfficer, captures: { o1: $.data.id } }
            - { call: "POST /api/offers/${o1}/accept", payload: {}, as: Nominee, as_user_id: "${n1}" }
          trigger:
            - { call: "POST /api/offers/${o1}/accept", payload: {}, as: Nominee, as_user_id: "${n1}", captures: { err2: $.data.error_id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "DROP" }, as: SelectionOfficer, captures: { errd: $.data.error_id } }
          assert:
            - "Second accept -> 409 ERR_INVALID_STATE (captured ${err2}): ACCEPTED has no accept transition"
