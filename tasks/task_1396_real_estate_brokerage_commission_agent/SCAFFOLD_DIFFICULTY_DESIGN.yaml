              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "7 Drift Ave", gross_commission_cents: 5000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/unsettle"
              payload: {}
              as: TransactionCoordinator
            - call: "GET /brokerage/agents/${ag_id}"
              payload: {}
              as: BrokerAdmin
              captures: { deb: $.data.debit_balance_cents, cnt: $.data.settled_deal_count }
            - call: "GET /brokerage/anniversary-periods?agent_id=${ag_id}"
              payload: {}
              as: BrokerAdmin
              captures: { cd_acc: "$.data[0].company_dollar_accrued_cents", roy_acc: "$.data[0].royalty_accrued_cents" }
          trigger_note: "GET calls are observation, not mutation"
          assert:
            - "after settle+unsettle: debit_balance_cents == 0 and settled_deal_count == 0"
            - "company_dollar_accrued_cents == 0 and royalty_accrued_cents == 0 (exact restoration, cap room returned)"
            - "ledger shows FEE_SHORTFALL_ACCRUAL +27710 then FEE_SHORTFALL_REVERSAL -27710; running balance returns to 0"

      - name: trust_conservation_across_release_and_void
        grounds:
          - calculations.trust_conservation
          - entities.TrustTransaction
          - state_machines.DisbursementLeg
        distinguishing_aspect: |
          Conserved quantity: trust funds (a DIFFERENT quantity than the debit
          ledger). Close receipt +1000000; releasing all three created legs drains the
          deal to a zero net trust position; every TrustTransaction row keeps
          the global balance >= 0 and sum(RECEIPT + RELEASE) == 0 per fully
          disbursed deal.
        test_recipe:
