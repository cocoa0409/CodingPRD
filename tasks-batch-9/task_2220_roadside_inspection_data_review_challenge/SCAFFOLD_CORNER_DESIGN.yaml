              payload: {}
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
            - call: "POST /data-challenges/${ch_id}/review"
              payload: { action: "ASSIGN", review_note: "Opening review of the brake violation." }
              as: FmcsaReviewOfficer
              as_user_id: "review_officer_1"
          trigger:
            - call: "POST /data-challenges/${ch_id}/review"
              payload: { action: "RESOLVE_ACCEPT", review_note: "Accepting without a court outcome." }
              as: FmcsaReviewOfficer
