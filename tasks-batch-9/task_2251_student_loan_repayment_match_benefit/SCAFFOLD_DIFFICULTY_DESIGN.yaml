        grounds:
          - state_machines.Employee.ACTIVE_to_TERMINATED
          - calculations.vesting_and_forfeiture
          - calculations.forfeiture_offset_waterfall
          - entities.ForfeitureRecord.fields.amount_cents
          - entities.FundingBatch.fields.forfeiture_offset_cents
          - entities.PlanYear.fields.forfeiture_balance_cents
        distinguishing_aspect: |
          Cascade of depth 4 originating from a different triggering transition — Employee ACTIVE ->
          TERMINATED: vesting evaluation forfeits the allocation (link 1), the forfeited allocation
          creates a ForfeitureRecord (link 2), the new ForfeitureRecord grows the plan-year forfeiture
          pool (link 3), and the grown pool drives the waterfall that sets the PENDING batch's
          forfeiture_offset_cents to 20000 and net_funding_cents to 0 (link 4).
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment."
