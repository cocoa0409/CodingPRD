              captures: { pr_id: $.data.id }
            - call: "POST /plan-reviews/${pr_id}/transition"
              payload: { action: "START_REVIEW" }
              as: PlanReviewer
              as_user_id: "pr-1"
            - call: "POST /plan-reviews/${pr_id}/transition"
              payload: { action: "APPROVE" }
              as: PlanReviewer
              as_user_id: "pr-1"
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01", plan_review_id: "${pr_id}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
