            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
          trigger:
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 40 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 409 and ${err_id} == ERR_MOLD_NOT_PPAP_APPROVED"
            - "PPAPSubmission.${ppap_id}.status == DRAFT and submitted_by_user_id == null"
            - "Mold.${mold_id}.status == NEW"

