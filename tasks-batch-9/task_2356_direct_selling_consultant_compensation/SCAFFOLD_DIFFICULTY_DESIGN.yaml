            - call: "POST /direct-selling/enrollment-applications/${app_p_id}/identity-decision"
              payload: { decision: "FAIL", failure_reason: "document illegible" }
              as: ComplianceOfficer
              captures: { s_after_fail: "$.data.status", id_after_fail: "$.data.identity_status", fail_reason: "$.data.identity_failure_reason" }
            - call: "POST /direct-selling/enrollment-applications/${app_p_id}/identity-submission"
              payload: { identity_document_reference: "DOC-PIA-2" }
              as: Applicant
              as_user_id: "${app_p_id}"
              captures: { s_after_sub2: "$.data.status", id_after_sub2: "$.data.identity_status", att2: "$.data.identity_attempt_count", cleared_reason: "$.data.identity_failure_reason" }
            - call: "POST /direct-selling/enrollment-applications/${app_p_id}/identity-decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              captures: { s_after_verify: "$.data.status", id_after_verify: "$.data.identity_status" }
            - call: "POST /direct-selling/enrollment-applications/${app_p_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { cons_p_id: "$.data.id", p_rank: "$.data.rank_code", p_depth: "$.data.genealogy_depth" }
          assert:
            - "p_kit_total == 11129 (9900 + rhu(14900 * 825 / 10000) = 9900 + 1229) with p_identity == UNVERIFIED and p_attempts == 0"
            - "s_after_agreement == DRAFT with agr_status == ACCEPTED and agr_at == 2026-08-01T00:00:00Z (agreement dimension moved, status did not)"
            - "s_after_kit == DRAFT with kit_status == PAID (kit dimension moved while identity_status is still UNVERIFIED)"
            - "s_after_sub1 == DRAFT, id_after_sub1 == PENDING_REVIEW, att1 == 1"
            - "s_after_fail == DRAFT and id_after_fail == FAILED and fail_reason == document illegible (attempt 1 < max_identity_attempts 2, so the application is NOT rejected)"
            - "s_after_sub2 == DRAFT, id_after_sub2 == PENDING_REVIEW, att2 == 2, cleared_reason == null (the FAILED -> PENDING_REVIEW cycle edge re-entered)"
            - "s_after_verify == READY_FOR_APPROVAL and id_after_verify == VERIFIED (the third dimension completing flips the compound status)"
            - "cons_p_id is non-null with p_rank == CONSULTANT, p_depth == 0, status == ACTIVE, and the application status == APPROVED with created_consultant_id == cons_p_id"

      - name: order_payment_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.ProductOrder.PENDING_to_PAID
          - state_machines.ProductOrder.NEW_to_SHIPPED
          - state_machines.ProductOrder.SHIPPED_to_DELIVERED
          - entities.ProductOrder.fields.payment_status
          - entities.ProductOrder.fields.fulfillment_status
          - validations[priority=35]
        distinguishing_aspect: |
          Entity ProductOrder, a different entity from the enrollment machine: payment_status
          and fulfillment_status are parallel dimensions over one row, and the guard is
