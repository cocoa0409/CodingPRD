              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_id: $.data.id }
            - call: "POST /api/lois/${loi_id}/accept"
              as: ListingAgent
            - call: "GET /api/transactions?listing_id=${lst_id}"
              as: ListingAgent
              captures: { tx_id: "$.data[0].id" }
            - call: "GET /api/escrow-deposits?transaction_id=${tx_id}"
              as: EscrowOfficer
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /api/escrow-deposits/${esc_id}/fund"
              payload: { funding_reference: "WIRE-1" }
              as: EscrowOfficer
          trigger:
            - call: "POST /api/transactions/${tx_id}/terminate"
              payload: { reason: "buyer walked during inspection window" }
              as: ListingAgent
            - call: "GET /api/escrow-deposits/${esc_id}"
              as: EscrowOfficer
          assert:
            - "trigger[1] response data.status == REFUNDED"
            - "trigger[1] response data.refunded_usd == 100000.00"
            - "trigger[1] response data.released_usd == 0 and data.forfeited_usd == 0"
            - "released_usd + refunded_usd + forfeited_usd == deposit_amount_usd == 100000.00 (net buyer funds unchanged)"
            - "GET /api/listings/${lst_id}: status == ACTIVE"

      - name: listing_open_transaction_cardinality_conserved
        grounds:
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Listing.UNDER_CONTRACT_to_ACTIVE
          - state_machines.Transaction.OPENED_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity = open-transaction cardinality per listing (not
          funds): accept (+1 open Transaction, Listing UNDER_CONTRACT) paired
          with terminate (-1, Listing ACTIVE) restores count to 0; a second
          accept re-establishes exactly 1 — Listing.status == UNDER_CONTRACT
          iff exactly one non-terminal Transaction references it.
        test_recipe:
          setup:
            - "ACTIVE listing; QUALIFIED buyer; LOI-1 SUBMITTED"
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_1: $.data.id }
            - call: "POST /api/lois/${loi_1}/accept"
              as: ListingAgent
          trigger:
            - call: "GET /api/transactions?listing_id=${lst_id}"
              as: ListingAgent
              captures: { open_after_accept: "$.data[0].id" }
            - call: "POST /api/transactions/${open_after_accept}/terminate"
              payload: { reason: "buyer walked during inspection window" }
              as: BrokerPrincipal
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_2: $.data.id }
            - call: "POST /api/lois/${loi_2}/accept"
              as: ListingAgent
          assert:
            - "after first accept: GET /api/transactions?listing_id has exactly 1 row, Listing.status == UNDER_CONTRACT"
            - "after terminate: non-terminal Transaction count for listing == 0, Listing.status == ACTIVE (cardinality restored)"
            - "after second accept: exactly 1 non-terminal Transaction (status OPENED, loi_id == ${loi_2}), Listing.status == UNDER_CONTRACT"
            - "first Transaction remains queryable with status == TERMINATED (terminal rows do not count)"
