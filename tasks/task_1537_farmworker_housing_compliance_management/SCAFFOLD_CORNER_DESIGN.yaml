        distinguishing_aspect: "Two APPLIED treatments merge on the unit: end dates 2026-08-13 (applied 08-10 + 3) and 2026-08-16 (applied 08-11 + 5) -> unit.pest_exclusion_end_date == 2026-08-16."
        test_recipe:
          setup: ["site OPEN; unit CERTIFIED"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /pest-treatments", payload: { unit_id: "${u_id}", treatment_type: "ROUTINE", scheduled_date: "2026-08-10", reentry_buffer_days: 3 }, as: SiteManager, captures: { p1: $.data.id } }
            - { call: "POST /pest-treatments", payload: { unit_id: "${u_id}", treatment_type: "TARGETED", scheduled_date: "2026-08-11", reentry_buffer_days: 5 }, as: SiteManager, captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /pest-treatments/${p1}", payload: { status: "APPLIED" }, as: SiteManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T08:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /pest-treatments/${p2}", payload: { status: "APPLIED" }, as: SiteManager }
          trigger:
            - { call: "GET /housing-units/${u_id}", as: OperatorAdmin, captures: { end: $.data.pest_exclusion_end_date, under: $.data.under_pest_exclusion } }
          assert:
            - "under == true"
            - "end == 2026-08-16 — merged exclusion takes the max end across APPLIED treatments"

  # ===========================================================================
  - section: validations
    instances:
      - name: priority_pair_state_fiscal_claim
        claim_type: priority_conflict
        grounds: ["validations[priority=7.5]", "validations[priority=17]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_cancelled_tenancy_payment
          rationale: "The state-vs-fiscal dual-failure is asserted in the named §1.8 instance."

      - name: priority_pair_safety_referential_claim
        claim_type: priority_conflict
        grounds: ["validations[priority=11]", "validations[priority=16]"]
        excluded_because:
          difficulty_instance: safety_beats_referential_on_pest_blocked_activation
          rationale: "The safety-vs-referential dual-failure is asserted in the named §1.8 instance."

      - name: season_overlap_gap_claim
        claim_type: temporal_validation
        grounds: ["validations[priority=14]", calculations.season_window_gap_check]
        excluded_because:
          difficulty_instance: season_window_closed_interval_gap_rule
          rationale: "Closed-interval overlap, 14-day gap rejection, and 15-day acceptance are asserted in the named §1.8 instance."

      - name: pest_exclusion_boundary_claim
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", calculations.pest_exclusion_window]
        excluded_because:
          difficulty_instance: pest_exclusion_closed_buffer_vs_movein
          rationale: "The closed-buffer move-in boundary and premature-clear rejection are asserted in the named §1.8 instance."

      - name: cert_validity_error_claim
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_NO_VALID_CERTIFICATION]"]
        excluded_because:
          difficulty_instance: activation_requires_valid_certification
          rationale: "The expired-cert activation rejection and the lazy EXPIRED flip are asserted in the named §1.8 instance."

      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers is rejected 400 before any role or existence check."
        test_recipe:
          setup: ["one site exists"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin }
          trigger:
            - { call: "GET /housing-sites", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER with HTTP 400 (request sent without the user-context headers)"

      - name: role_denied_site_create_by_intake_coordinator
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]", roles.OperatorAdmin]
        distinguishing_aspect: "POST /housing-sites is exclusive to OperatorAdmin; IntakeCoordinator gets 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS with HTTP 403"

      - name: body_fk_existence_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_HOUSEHOLD_NOT_FOUND]", "errors[ERR_UNIT_NOT_FOUND]"]
        distinguishing_aspect: "Body FKs validate in declared input order (household_id before unit_id): both-bogus yields ERR_HOUSEHOLD_NOT_FOUND; valid household + bogus unit yields ERR_UNIT_NOT_FOUND."
        test_recipe:
          setup: ["site + building + unit exist; one household exists (PENDING_ELIGIBILITY is fine — existence is checked before business)"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /households", payload: { head_of_household_name: "Fam FK", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
          trigger:
            - { call: "POST /tenancies", payload: { household_id: "00000000-0000-4000-8000-0000000000aa", unit_id: "00000000-0000-4000-8000-0000000000bb", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "00000000-0000-4000-8000-0000000000bb", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_HOUSEHOLD_NOT_FOUND (household_id is validated before unit_id)"
            - "err2 == ERR_UNIT_NOT_FOUND"

      - name: occ_stale_season_window_create
        claim_type: violation_to_error
        grounds: ["concurrency_rules[season-window-create-stale-site]", "errors[ERR_STALE_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "A second window create carrying the pre-first-create site version is rejected 412; the first create legitimately succeeded and bumped the version."
        test_recipe:
          setup: ["site created (version observed at v1); window W1 created against v1 (site now v2)"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W1", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W2", planned_open_date: "2026-12-15", planned_close_date: "2027-03-31", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /season-windows/${w1}", as: OperatorAdmin, captures: { w1_st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION with HTTP 412"
            - "w1_st == PLANNED — the rejected create did not supersede it"

      - name: occ_stale_authorization_create
        claim_type: violation_to_error
        grounds: ["concurrency_rules[authorization-create-stale-household]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second authorization create carrying the stale household version is rejected 412 and does not supersede the ACTIVE authorization."
        test_recipe:
          setup: ["household created (version observed at v1); authorization A1 created against v1 (household now v2)"]
          setup_api_calls:
            - { call: "POST /households", payload: { head_of_household_name: "Fam OCC", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id, hh_v: $.data.version } }
            - { call: "POST /deduction-authorizations", payload: { household_id: "${hh_id}", cap_percent: 0.25, purpose: "RENT", effective_date: "2026-08-01", expected_household_version: "${hh_v}" }, as: IntakeCoordinator, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /deduction-authorizations", payload: { household_id: "${hh_id}", cap_percent: 0.35, purpose: "RENT_AND_UTILITIES", effective_date: "2026-08-01", expected_household_version: "${hh_v}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /deduction-authorizations/${a1}", as: IntakeCoordinator, captures: { a1_st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION with HTTP 412"
            - "a1_st == ACTIVE — no supersession happened"

      - name: occ_stale_tenancy_create
        claim_type: violation_to_error
        grounds: ["concurrency_rules[tenancy-create-stale-unit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A tenancy create carrying a unit version that a prior create already advanced is rejected 412."
        test_recipe:
          setup: ["site OPEN; certified unit; ELIGIBLE households H1 and H2 with 1 member each; T1 created against unit version observed before T1"]
