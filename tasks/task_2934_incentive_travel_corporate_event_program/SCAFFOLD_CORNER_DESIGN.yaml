        shows "REJECTED" — the sibling rejection is not deferred.
      - The first GET /qualifiers/${qa_id} shows committed_cost_cents 921765 and ${qb_id} shows 521409,
        recomputed from the newly stamped basis rather than from the pre-execution zero.
      - The first GET /deposit-milestones?contract_id=${c1_id} returns all three rows still "SCHEDULED"
        with requires_finance_review false, because the cascade left budget_posture "OK" — the absence
        of the fourth-level write is visible immediately too.
      - The first GET /supplier-contracts/${c1_id}/exposure-projection already returns contract_value_cents
        2310000 and the attrition-basis figure 1848000 as the binding basis.
      - 'The second round of reads returns byte-identical bodies apart from meta.api_request_id and meta.api_request_timestamp:
        nothing converged between the two reads, because nothing was left pending after the first.'
      - No endpoint in §1.5 exposes a job id, a "pending" or "processing" status, or any retry hint —
        there is nothing in the API surface for a client to poll.
