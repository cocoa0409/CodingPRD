              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_missing_row: $.data.error_id }
            - call: "POST /rating-cycles/${c1}/dimension-overrides"
              payload: { overrides: [{ dimension_score_id: "${acc}", raw_points: 20 }, { dimension_score_id: "${tra}", raw_points: 21 }], override_reason: "transparency deserves more than the maximum", expected_rating_cycle_version: "${c1_v}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { e_range: $.data.error_id }
            - call: "GET /rating-cycles/${c1}/dimension-scores?dimension=ACCOUNTABILITY"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { acc_raw_untouched: "$.data[0].raw_points", acc_status_untouched: "$.data[0].status" }
            - call: "POST /rating-cycles/${c1}/dimension-overrides"
              payload: { overrides: [{ dimension_score_id: "${acc}", raw_points: 20 }, { dimension_score_id: "${tra}", raw_points: 18 }], override_reason: "documented analyst judgement on both dimensions", expected_rating_cycle_version: "${c1_v}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1_sum: $.data.weighted_sum_final, c1_final: $.data.final_composite_score, c1_grade: $.data.grade, c1_status: $.data.status, c1_v_after: $.data.version }
            - call: "GET /rating-cycles/${c1}/dimension-scores?status=OVERRIDDEN"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { overridden_first: "$.data[0].id" }
          assert:
            - "${acc_raw} == 21, ${acc_max} == 24 and ${tra_max} == 20: the automated pass scored the accountability dimension 21 of 24 and transparency 20 of 20"
            - "${e_missing_row} == ERR_DIMENSION_SCORE_NOT_FOUND with HTTP 404: the second entry resolves to no DimensionScore of ${c1}"
            - "${e_range} == ERR_INVALID_REQUEST with HTTP 400: raw_points 21 exceeds max_points ${tra_max} for the transparency row, and the array is rejected as a unit"
            - "${acc_raw_untouched} == 21 and ${acc_status_untouched} == COMPUTED: the valid first entry of both rejected batches was never applied, so the endpoint rolls back rather than skipping"
            - "The two rejected batches left RatingCycle.${c1}.version at ${c1_v}, which is why the accepted batch can reuse the same expected_rating_cycle_version without re-reading the cycle"
            - "After the accepted batch both named rows are OVERRIDDEN with overridden_by_user_id analyst-1 and override_reason stored, the accountability row reads raw_points 20 with normalized_score 83.33, and the transparency row reads raw_points 18 with normalized_score 90.00"
            - "${c1_sum} == 81.58: the four per-dimension terms are 0.40*72.50 == 29.00, 0.25*83.33 == 20.83, 0.20*90.00 == 18.00 and 0.15*91.67 == 13.75, each rounded to 2 decimals before the sum"
            - "${c1_final} == 80.08 and ${c1_grade} == MEETS_STANDARDS: band B is read from the pre-penalty 81.58, so the single failed standard costs 1.50"
            - "${c1_status} == SCORED and ${c1_v_after} == ${c1_v} + 1: the override is a SCORED -> SCORED self-loop, not a rewind"
            - "${overridden_first} is one of ${acc} or ${tra} and the OVERRIDDEN filter returns total_count == 2, while the COMPUTED filter returns total_count == 2 for the untouched financial and impact rows"
      - name: an_appeal_links_a_cycle_to_a_correction_and_both_ends_must_exist
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/appeals
          - endpoints.GET_/appeals
          - validations[priority=7]
          - errors.ERR_RATING_CYCLE_NOT_FOUND
          - errors.ERR_CORRECTION_REQUEST_NOT_FOUND
          - entities.Appeal.fields.correction_request_id
        distinguishing_aspect: |
          POST /appeals is the only create in the catalogue carrying two foreign
          keys that must both resolve, and §1.4 pins the order they are checked in:
          left to right, in the order the input list declares them. The batch of
          three malformed requests therefore has to answer with the cycle's error
          when both keys are bad, which is the only observable difference between
          left-to-right resolution and whatever order a query planner happens to
          pick. The accepted request is then read back through both reverse
          lookups, so the association is proved from each end rather than from the
          create response alone.
