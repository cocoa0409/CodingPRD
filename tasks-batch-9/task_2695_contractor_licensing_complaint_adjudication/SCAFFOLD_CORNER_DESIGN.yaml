          setup:
            - "the exact state left by corner_approve_with_no_aggregate_room_denies_as_cap_exhausted: claim1 APPROVED at 1500000, claim2 DENIED at 0, balance 5000000, clock 2026-11-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
