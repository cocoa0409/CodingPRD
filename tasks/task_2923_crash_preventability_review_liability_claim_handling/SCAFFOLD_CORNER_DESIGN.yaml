            - "${e_auth} == ERR_UNAUTHENTICATED with HTTP 401 (the X-User-ID header is omitted entirely) — priority 1 outranks the unknown field `camera_channel`, the absent crash and everything else"
            - "${e_shape} == ERR_INVALID_REQUEST with HTTP 400 — with a valid actor, the priority-5 unknown-field rejection outranks the priority-10 path lookup, so the response is NOT ERR_CRASH_NOT_FOUND"
            - "${e_path} == ERR_CRASH_NOT_FOUND with HTTP 404 once the body is clean — the path FK is checked at priority 10"
