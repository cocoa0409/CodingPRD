          The checkride endpoint is not a blind status setter: the destination depends on comparing
          checkride_valid_until with date(clock_now), and the comparison is INCLUSIVE. Filing a
          checkride that expired yesterday (2026-08-31) stores the dates but lands on EXPIRED, while a
          checkride valid through exactly today (2026-09-01) lands on QUALIFIED - the one-day
          difference flips the outcome. Advancing the clock one day past that date then expires the
          same row without any request against it, and re-filing walks EXPIRED -> QUALIFIED, which is
          the cycle that makes this machine non-linear. Every attempt overwrites both stored dates.
          
