  # ===========================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS — the four declared layers of §1.2:
  # optimistic_concurrency (all three §1.2.1 rules), cascading_side_effects,
  # dual_variant_calculation and rate_threshold_triggers.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_a_second_run_cannot_be_scheduled_on_a_machine_version_the_first_run_bumped
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[run-schedule-stale-machine]
          - validations.priority_38
          - validations.priority_63
          - errors[ERR_STALE_MACHINE_VERSION]
        distinguishing_aspect: "Creating the first run bumps PaperMachine.version, so a scheduler still holding the pre-creation version is refused with 412 ERR_STALE_MACHINE_VERSION. The second window is deliberately chosen to ALSO collide with the first (12:00-16:00 against 06:00-14:00, before any buffer widening), which pins the ordering: OCC at priority 38 must answer before the window-conflict check at priority 63, so the response is 412 and never 409 ERR_MACHINE_WINDOW_CONFLICT. Re-reading the version and moving the window then succeeds."
        test_recipe:
          setup: ["The spine (PM1 RUNNABLE, one APPROVED 20.000-ton TL_140 batch) plus one SCHEDULED run occupying 2026-09-01 06:00-14:00 created with the machine's then-current version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-grade-specs"
              payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.50, min_sct_kn_m: 2.50, requires_deink_pulp: false, rank_order: 10 }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 5600, max_tons_per_hour: 20.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 2.500 }
              as: MillPlanner
              as_user_id: "planner-1"
