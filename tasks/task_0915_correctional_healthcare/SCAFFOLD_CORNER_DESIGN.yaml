              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { ref_v1: $.data.version }
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref}", appointment_at: "2026-05-05T08:00:00Z", expected_referral_version: "${ref_v1}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { trip1: $.data.id }
          trigger:
            - call: "POST /transport-orders"
              payload: { referral_id: "${ref}", appointment_at: "2026-05-06T08:00:00Z", expected_referral_version: "${ref_v1}" }
              as: CustodyOfficer
              as_user_id: "u-co-1"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 412 with error_id ERR_STALE_REFERRAL_VERSION"
            - "TransportOrder.${trip1}.status == DRAFT"
            - "GET /specialty-referrals/${ref}/transport-orders returns exactly 1 row"

      - name: rate_threshold_consecutive_refusals_escalate_to_prescriber
        claim_type: rate_threshold_triggers
        grounds:
          - entities.MedicationOrder.fields.consecutive_refused_count
          - entities.MedicationOrder.fields.escalated_to_prescriber
          - state_machines.MedicationAdministration.SCHEDULED_to_REFUSED
          - state_machines.MedicationAdministration.SCHEDULED_to_ADMINISTERED
        distinguishing_aspect: "Two consecutive refusals leave escalated_to_prescriber false; the third reaches CONSECUTIVE_REFUSED_ESCALATION and sets it true, and a later ADMINISTERED dose resets the counter to 0 while the flag stays true."
        test_recipe:
          setup:
            - "One inmate with an ACTIVE DOT order carrying four scheduled doses."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2400", full_name: "Hana Kuo", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-01T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d1: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-02T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d2: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-03T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d3: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-04T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { d4: $.data.id }
          trigger:
            - call: "POST /medication-administrations/${d1}/record"
              payload: { outcome: "REFUSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /medication-administrations/${d2}/record"
              payload: { outcome: "REFUSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /medication-administrations/${d3}/record"
              payload: { outcome: "REFUSED" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${d4}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "After the second refusal MedicationOrder.${ord}.consecutive_refused_count == 2 and escalated_to_prescriber == false"
            - "After the third refusal MedicationOrder.${ord}.escalated_to_prescriber == true"
            - "MedicationOrder.${ord}.consecutive_refused_count == 0 after the ADMINISTERED dose"
            - "MedicationOrder.${ord}.consecutive_missed_count == 0"
            - "MedicationOrder.${ord}.escalated_to_prescriber == true"
            - "MedicationOrder.${ord}.adherence_pct == 25.00"

      - name: cascading_side_effects_death_freeze_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Inmate.IN_CUSTODY_to_DECEASED
        excluded_because:
          difficulty_instance: death_event_depth5_freeze_discontinue_void_deescalate
          rationale: "The five-level death cascade is asserted end to end by that difficulty instance."

      - name: dual_variant_calculation_layer_copay
        claim_type: dual_variant_calculation
        grounds:
          - calculations.copay_amount
        excluded_because:
          difficulty_instance: copay_funded_vs_indigent_lien_variant
          rationale: "Both branches and their divergent ledger effects are asserted by that difficulty instance."

  - section: consistency_model
    instances:

      - name: immediate_consistency_charge_visible_in_see_response
        claim_type: immediate
        grounds:
          - state_machines.SickCallRequest.SCHEDULED_to_SEEN
          - entities.SickCallRequest.fields.copay_charge_id
        distinguishing_aspect: "The consistency model is immediate: the POST /sick-call-requests/{id}/see response itself already carries the non-null copay_charge_id and seen_at, with no second read required."
        test_recipe:
          setup:
            - "One funded inmate with a sick-call request triaged ROUTINE and scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2410", full_name: "Ida Lemos", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, memo: "commissary deposit" }
              as: HealthServicesAdmin
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "wrist swelling", encounter_type: "SICK_CALL" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { sc: $.data.id }
            - call: "POST /sick-call-requests/${sc}/triage"
              payload: { acuity: "ROUTINE" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /sick-call-requests/${sc}/schedule"
              payload: {}
              as: Nurse
              as_user_id: "u-nurse-1"
          trigger:
            - call: "POST /sick-call-requests/${sc}/see"
              payload: {}
              as: Provider
              as_user_id: "u-prov-1"
              captures: { chg: $.data.copay_charge_id }
          assert:
            - "The see response has status == SEEN and a non-null copay_charge_id"
            - "CopayCharge.${chg}.amount_cents == 500"
            - "Inmate.${inm}.account_balance_cents == 500"
            - "SickCallRequest.${sc}.seen_at == 2026-05-01T00:00:00.000Z"

