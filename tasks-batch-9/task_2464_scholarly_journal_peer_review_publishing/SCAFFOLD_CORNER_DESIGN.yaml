          rationale: "The buffered closed-interval conflict and the first legal start date after the buffer are the whole subject of that §1.8 instance."
  - section: rbac
    instances:
      - name: author_cannot_issue_an_editorial_decision
        claim_type: role_permission
        grounds:
          - rbac.Author
          - endpoints[POST /manuscripts/{id}/decisions]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The decision endpoint lists only HandlingEditor, so the corresponding author - who may submit,
          revise, relicense and approve proofs on the very same manuscript - is refused with 403
          ERR_UNAUTHORIZED before any state or review-count check runs, and no Decision row appears.
        test_recipe:
          setup:
            - "One journal with min_completed_reviews_for_decision 1 and a manuscript in DECISION_PENDING with one ACCEPT review, so the only thing missing is the right role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
