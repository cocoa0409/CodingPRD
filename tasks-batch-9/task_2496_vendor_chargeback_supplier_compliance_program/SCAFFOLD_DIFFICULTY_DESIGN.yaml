      - name: deduction_posting_depends_on_allocated_chargeback_dispute_state
        grounds:
          - validations[priority=29]
          - errors.ERR_CHARGEBACK_DISPUTE_OPEN
          - state_machines.Chargeback.dispute_status.NONE_to_OPEN
          - endpoints[POST /compliance/deductions/{id}/post]
        distinguishing_aspect: |
          A DIFFERENT entity pair, Deduction -> Chargeback. The Deduction itself is a perfectly
          valid DRAFT with a within-ceiling allocation, yet posting is blocked purely by the
          dispute_status of a chargeback it points at; the same post succeeds once that dispute is
          decided and the chargeback leaves OPEN. Blocking depends on the OTHER entity's state, not
          on any field of the deduction.
