      - name: waiver_review_loop_survives_two_info_requests_and_third_is_rejected
        grounds:
          - state_machines.EligibilityWaiver
          - entities.EligibilityWaiver.fields.info_request_count
          - validations.priority_29
        distinguishing_aspect: |
          UNDER_REVIEW and INFO_REQUESTED form a cycle that must be traversed twice and then
          refuse a third lap: info_request_count 0 -> 1 -> 2 with the waiver legally back in
          UNDER_REVIEW, and the third REQUEST_INFO returning ERR_WAIVER_ROUNDS_EXHAUSTED (409)
          while the waiver stays UNDER_REVIEW rather than moving or resetting the counter.
