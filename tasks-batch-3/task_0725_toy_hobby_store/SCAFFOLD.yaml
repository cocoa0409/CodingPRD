      - { name: points_redeemed, type: integer, source: computed, description: "Cumulative points ever redeemed/reversed-out", constraints: ">= 0" }
      - { name: points_balance, type: integer, source: computed, description: "lifetime_points - points_redeemed; conserved quantity", constraints: ">= 0" }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD, derived from lifetime_points", default: BRONZE }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
