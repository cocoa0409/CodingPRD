      - name: return_to_sender_four_hop_cascade_to_screening_tier
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_RETURNED
          - state_machines.Order.LABELED_to_RETURNED
          - calculations.consumer_rolling_volume_liters
          - calculations.consumer_compliance_risk_score
          - entities.VolumeLedgerEntry.fields.event_type
          - entities.Order.fields.excise_reversed_cents
          - entities.Winery.fields.excise_reversed_cents
          - entities.Consumer.fields.return_credit_count
          - entities.Consumer.fields.screening_tier
        distinguishing_aspect: |
          One RETURN_TO_SENDER scan propagates four hops — shipment RETURNED, order RETURNED with
          both tax fields reversed, a RETURN_CREDIT ledger entry of -4.500 L, recomputed consumer
          volume and risk — and the fourth hop is observable because risk_score_screening moves
          45 -> 50 and screening_tier flips STANDARD -> ELEVATED at the threshold.
