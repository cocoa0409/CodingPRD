          - state_machines.WorkupCase.case_status
          - state_machines.ReimbursementClaim.status
        distinguishing_aspect: |
          Seven state fields across six entities are asserted at birth in a single chain, including the
          three-dimensional WorkupCase whose dimensions start independently (OPEN / PENDING /
          UNSCHEDULED) and the cascade-created children (ClearanceItem PENDING, ReimbursementClaim
          PROVISIONAL) that no client ever POSTs directly.
