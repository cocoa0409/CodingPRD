          - entities.Certification.fields.listing_syndicated_at
        distinguishing_aspect: |
          The listing endpoints are gated by a different entity's state at two separate moments: a
          SUBMITTED certification refuses listing creation, and after the certification is
          administratively decertified the already-published listing is forced to WITHDRAWN so a fresh
          syndication of the very same listing now fails on the listing's own state instead. The same
          two calls therefore fail for two different reasons on either side of one approval.
