scenario: "Generate task harder than expert level! 2463. Conference Revenue Distribution & Membership Change (collegiate athletic conference office): media rights revenue pooling with distribution formulas by member, appearance and postseason performance, postseason unit distribution and bowl or tournament revenue allocation with expense reimbursement, new member admission with entry fee, phased distribution schedule and voting requirements, departing member exit fees, notice periods and grant-of-rights obligations, scheduling formula construction with protected rivalries and travel partner considerations, championship event hosting, revenue and expense allocation, compliance and governance services provided to members, budget approval, reserve policy and audit reporting to the membership"
domain_name: "conference-revenue-distribution-membership-change"
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Conference is the aggregate root; RevenuePool -> DistributionRun -> DistributionLine and
  # BowlAppearance -> PostseasonUnit are strict hierarchies, while Member, Venue,
  # ProtectedRivalry, ScheduleGame, ChampionshipEvent and Ballot form cross-cutting graph
  # edges (including self-referential Member.travel_partner_member_id and
  # DistributionRun.superseded_by_run_id).

  state_machine_shape: cyclic
  # MembershipAction loops VOTING -> PROPOSED (amend) -> VOTING and branches
  # VOTING -> {APPROVED, REJECTED}; BowlAppearance loops UNDER_REVIEW ->
  # REVISION_REQUESTED -> UNDER_REVIEW; Member loops FULL_SHARE ->
  # WITHDRAWAL_NOTICED -> FULL_SHARE (rescission) and self-loops on
  # ADMITTED_PHASING; RevenuePool loops OPEN -> BOOKS_CLOSED -> OPEN and
  # auto-reverts to DRAFT on a revenue restatement.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The user who computes a DistributionRun may not post it; the user who proposes a
  # MembershipAction may not close its voting; the Auditor who issues a report may
  # not be either of those users.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # Deliberately above the §0.4 Expert band (15 entities / 78 endpoints / 57 error codes /
  # 12 state machines / 11 calculations with 4 declared variants) because the scenario
  # requests a task harder than expert level. The added surface is mostly thin reverse-
  # reachability GETs mandated by §1.5; the density lives in §1.3 and §1.4.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Conference
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the conference office
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: calendar month (1-12) in which the conference fiscal year opens
        default: 7
        constraints: "1 <= fiscal_year_start_month <= 12"
      - name: current_fiscal_year
        type: integer
        source: input
        description: fiscal year the conference is currently operating in; anchors the postseason-unit rolling window and the ADMIT budget precondition
        default: 2027
      - name: unit_value_cents
        type: integer
        source: input
        description: cash value in cents of one validated postseason unit
        default: 34000000
      - name: phase_schedule_years
        type: integer
        source: input
        description: number of phasing years a PETITIONED member serves before reaching FULL_SHARE
        default: 3
        constraints: "phase_schedule_years >= 1"
      - name: governance_status
        type: enum
        source: computed
        description: FORMING while charter membership is still being seated; OPERATING once the first BudgetProposal reaches APPROVED
        default: FORMING
        constraints: "one of {FORMING, OPERATING}"
      - name: approved_operating_expense_cents
        type: integer
        source: computed
        description: proposed_operating_expense_cents copied from the most recently APPROVED BudgetProposal
        default: 0
      - name: approved_governance_expense_cents
        type: integer
        source: computed
        description: proposed_governance_expense_cents copied from the most recently APPROVED BudgetProposal
        default: 0
      - name: reserve_target_cents
        type: integer
        source: computed
        description: "ceil(approved_operating_expense_cents * RESERVE_TARGET_BPS / 10000); see calculations.reserve_posture_derivation"
        default: 0
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: cash in the conference reserve; moved by reserve transfers and by a POSTED DistributionRun's reserve sweep
        default: 0
      - name: reserve_posture
        type: enum
        source: computed
        description: derived funding posture gating distribution-run creation and championship-event creation
        default: OPEN
        constraints: "one of {OPEN, RESERVE_RESTRICTED, FROZEN}"
      - name: funded_ratio_bps
        type: integer
        source: computed
        description: "10000 when reserve_target_cents is 0, else floor(reserve_balance_cents * 10000 / reserve_target_cents); see calculations.reserve_posture_derivation"
        default: 10000
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: cents held back from members - PROVISIONAL distribution withholding plus approved bowl reimbursement residuals
        default: 0
      - name: governance_fee_revenue_cents
        type: integer
        source: computed
        description: cumulative governance service fees retained from POSTED distribution lines
        default: 0
      - name: validated_postseason_unit_count
        type: integer
        source: computed
        description: conference-wide count of PostseasonUnit rows in status VALIDATED; the conserved quantity of the bowl approve/void compensation pair
        default: 0

  - name: Member
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference this institution belongs to"
      - name: name
        type: string
        source: input
        description: member institution display name
      - name: institution_code
        type: string
        source: input
        description: short institution code, unique across the conference
        constraints: "unique; 2-8 uppercase characters"
      - name: admission_path
        type: enum
        source: input
        description: CHARTER seats the member directly at FULL_SHARE and is only accepted while Conference.governance_status == FORMING; PETITIONED creates the member in PETITIONED and requires an ADMIT MembershipAction
        constraints: "one of {CHARTER, PETITIONED}"
      - name: status
        type: enum
        source: computed
        description: membership lifecycle state
        default: PETITIONED
        constraints: "one of {PETITIONED, ADMISSION_DENIED, ADMITTED_PHASING, FULL_SHARE, WITHDRAWAL_NOTICED, DEPARTED}"
      - name: home_venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue at which this member hosts its home games"
      - name: travel_partner_member_id
        type: string
        source: input
        description: "FK -> Member.id; self-referential travel partner used by the schedule compliance score; null when the member travels unpaired"
        default: null
        constraints: "must not equal this member's own id"
      - name: primary_contact_email
        type: string
        source: input
        description: athletics business office contact address
      - name: grant_of_rights_through_fiscal_year
        type: integer
        source: input
        description: last fiscal year covered by the member's grant of rights; distributions to a WITHDRAWAL_NOTICED member are withheld against the exit settlement while this year has not elapsed
      - name: entry_fee_cents
        type: integer
        source: input
        description: admission entry fee assessed on a PETITIONED member
        default: 0
      - name: entry_fee_paid_cents
        type: integer
        source: computed
        description: cumulative entry fee payments received
        default: 0
      - name: phase_year
        type: integer
        source: computed
        description: number of completed phasing advances; 0 for CHARTER members
        default: 0
      - name: distribution_phase_bps
        type: integer
        source: computed
        description: "share multiplier in basis points; min(10000, floor(10000 * phase_year / (Conference.phase_schedule_years + 1))) for ADMITTED_PHASING, 10000 for FULL_SHARE and WITHDRAWAL_NOTICED, 0 otherwise"
        default: 0
      - name: voting_weight_bps
        type: integer
        source: computed
        description: ballot weight in basis points; 10000 for FULL_SHARE, distribution_phase_bps for ADMITTED_PHASING, 0 for PETITIONED, ADMISSION_DENIED, WITHDRAWAL_NOTICED and DEPARTED
        default: 0
      - name: withdrawal_notice_at
        type: datetime
        source: computed
        description: logical-clock instant at which the withdrawal notice was filed
        default: null
      - name: withdrawal_effective_fiscal_year
        type: integer
        source: computed
        description: fiscal year in which the departure takes effect, supplied on the withdrawal notice
        default: null
      - name: notice_days
        type: integer
        source: computed
        description: "whole days from withdrawal_notice_at to the first day of withdrawal_effective_fiscal_year; drives the exit fee notice multiplier"
        default: null
      - name: last_full_annual_distribution_cents
        type: integer
        source: computed
        description: this member's gross_share_cents on the most recently POSTED FINAL_AUDITED MEDIA_RIGHTS DistributionRun; the exit settlement base
        default: 0
      - name: exit_settlement_total_cents
        type: integer
        source: computed
        description: base assessment plus surcharge computed when the withdrawal notice is filed
        default: 0
      - name: exit_settlement_paid_cents
        type: integer
        source: computed
        description: cumulative grant-of-rights offsets applied from POSTED distribution lines
        default: 0
      - name: schedule_compliance_score
        type: integer
        source: computed
        description: 0-100 score from calculations.schedule_compliance_score; gates championship-event hosting
        default: 100

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: venue display name
      - name: city
        type: string
        source: input
        description: city in which the venue sits
      - name: seating_capacity
        type: integer
        source: input
        description: fixed seats available for ticketed events
        constraints: "seating_capacity > 0"
      - name: concurrent_event_capacity
        type: integer
        source: input
        description: how many ChampionshipEvent half-open windows may overlap on this venue at once
        default: 1
        constraints: "concurrent_event_capacity >= 1"

  - name: RevenuePool
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; owning conference"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year whose revenue this pool books
      - name: pool_type
        type: enum
        source: input
        description: revenue category pooled
        constraints: "one of {MEDIA_RIGHTS, POSTSEASON_UNIT, CHAMPIONSHIP}"
      - name: allocation_method
        type: enum
        source: input
        description: branch selector inside calculations.distribution_share_allocation
        constraints: "one of {APPEARANCE_PERFORMANCE_WEIGHTED, EQUAL_SHARE, UNIT_BASED}"
      - name: gross_revenue_cents
        type: integer
        source: input
        description: gross receipts booked into the pool; restated upward by a settled ChampionshipEvent's participant pool
        constraints: "gross_revenue_cents >= 0"
      - name: estimated_expense_cents
        type: integer
        source: input
        description: pre-audit expense estimate used by the PROVISIONAL variant
        constraints: "estimated_expense_cents >= 0"
      - name: audited_expense_cents
        type: integer
        source: computed
        description: audited expense supplied at close-books and used by the FINAL_AUDITED variant; cleared when the pool auto-reverts to DRAFT
        default: null
      - name: status
        type: enum
        source: computed
        description: pool lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, BOOKS_CLOSED, CLOSED}"

  - name: DistributionRun
    parent: RevenuePool
    common_fields: true
    fields:
      - name: revenue_pool_id
        type: string
        source: input
        description: "FK -> RevenuePool.id; the pool being allocated"
      - name: variant
        type: enum
        source: input
        description: which branch of calculations.distribution_share_allocation is applied
        constraints: "one of {PROVISIONAL, FINAL_AUDITED}"
      - name: status
        type: enum
        source: computed
        description: run lifecycle state
        default: COMPUTED
        constraints: "one of {COMPUTED, POSTED, REVERSED, SUPERSEDED}"
      - name: net_pool_cents
        type: integer
        source: computed
        description: gross_revenue_cents minus the variant's expense basis
      - name: reserve_draw_cents
        type: integer
        source: computed
        description: cents swept to the conference reserve; computed at run creation, applied to Conference.reserve_balance_cents only at POST
      - name: distributable_cents
        type: integer
        source: computed
        description: net_pool_cents minus reserve_draw_cents
      - name: total_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps across this run's DistributionLine rows
      - name: computed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who created the run; the segregation-of-duties reference for posting
      - name: posted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the Treasurer who posted the run
        default: null
      - name: posted_at
        type: datetime
        source: computed
        description: logical-clock instant at which the run was posted
        default: null
      - name: superseded_by_run_id
        type: string
        source: computed
        description: "FK -> DistributionRun.id; self-referential pointer to the newer run that superseded this one"
        default: null

  - name: DistributionLine
    parent: DistributionRun
    common_fields: false
    fields:
      - name: distribution_run_id
        type: string
        source: input
        description: "FK -> DistributionRun.id; the run this line belongs to"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member paid on this line"
      - name: weight_bps
        type: integer
        source: computed
        description: allocation weight in basis points after the phase multiplier
      - name: gross_share_cents
        type: integer
        source: computed
        description: "floor(distributable_cents * weight_bps / total_weight_bps) plus any remainder cent awarded"
      - name: remainder_cent_awarded
        type: integer
        source: computed
        description: 0 or 1 - whether this line received a remainder cent in the waterfall pass
        default: 0
      - name: withheld_cents
        type: integer
        source: computed
        description: "PROVISIONAL escrow withholding, ceil(gross_share_cents * PROVISIONAL_WITHHOLD_BPS / 10000); 0 on FINAL_AUDITED"
      - name: governance_fee_cents
        type: integer
        source: computed
        description: flat governance and compliance service fee retained from this line
      - name: gor_offset_cents
        type: integer
        source: computed
        description: grant-of-rights offset applied against the member's outstanding exit settlement
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: gross_share_cents minus withheld_cents, governance_fee_cents and gor_offset_cents
      - name: status
        type: enum
        source: computed
        description: ACTIVE while the parent run is COMPUTED or POSTED; VOIDED when the parent run is SUPERSEDED or REVERSED
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"

  - name: BowlAppearance
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the institution that appeared in the event"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year of the appearance
      - name: event_name
        type: string
        source: input
        description: bowl or tournament name
      - name: event_tier
        type: enum
        source: input
        description: event classification
        constraints: "one of {BOWL, TOURNAMENT}"
      - name: payout_cents
        type: integer
        source: input
        description: gross payout received for the appearance
        constraints: "payout_cents >= 0"
      - name: submitted_expense_cents
        type: integer
        source: input
        description: expenses the member claims for reimbursement
        constraints: "submitted_expense_cents >= 0"
      - name: travel_miles
        type: integer
        source: input
        description: one-way travel distance used for the travel allowance
        constraints: "travel_miles >= 0"
      - name: units_claimed
        type: integer
        source: input
        description: number of postseason units the appearance claims
        constraints: "units_claimed >= 0"
      - name: allowable_expense_cents
        type: integer
        source: computed
        description: "min(submitted_expense_cents, ALLOWABLE_EXPENSE_CAP_CENTS)"
        default: 0
      - name: travel_allowance_cents
        type: integer
        source: computed
        description: "min(travel_miles * TRAVEL_RATE_CENTS_PER_MILE, TRAVEL_ALLOWANCE_CAP_CENTS)"
        default: 0
      - name: reimbursement_ceiling_cents
        type: integer
        source: computed
        description: "ceil(payout_cents * band_bps / 10000) where band_bps is selected by the payout tier"
        default: 0
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "min(allowable_expense_cents + travel_allowance_cents, reimbursement_ceiling_cents)"
        default: 0
      - name: residual_to_pool_cents
        type: integer
        source: computed
        description: payout_cents minus reimbursed_cents; credited to Conference.escrow_balance_cents on approval and debited back on void
        default: 0
      - name: status
        type: enum
        source: computed
        description: review lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, VOIDED}"

  - name: PostseasonUnit
    parent: BowlAppearance
    common_fields: false
    fields:
      - name: bowl_appearance_id
        type: string
        source: input
        description: "FK -> BowlAppearance.id; the appearance that generated this unit"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member credited with the unit"
      - name: fiscal_year
        type: integer
        source: computed
        description: copied from the parent BowlAppearance.fiscal_year; the rolling-window key
      - name: unit_index
        type: integer
        source: computed
        description: 1-based ordinal of the unit within its appearance
      - name: status
        type: enum
        source: computed
        description: PROVISIONAL while the appearance is under review, VALIDATED on approval, VOIDED on void
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, VALIDATED, VOIDED}"

  - name: MembershipAction
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference voting on the action"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the institution the action concerns"
      - name: action_type
        type: enum
        source: input
        description: ADMIT seats a PETITIONED member as ADMITTED_PHASING; WITHDRAW releases a WITHDRAWAL_NOTICED member to DEPARTED
        constraints: "one of {ADMIT, WITHDRAW}"
      - name: effective_fiscal_year
        type: integer
        source: input
        description: fiscal year the admission or withdrawal takes effect; must be strictly greater than Conference.current_fiscal_year
      - name: entry_fee_cents
        type: integer
        source: input
        description: entry fee assessed on an ADMIT; copied to the subject Member on execution
        default: 0
      - name: rationale
        type: string
        source: input
        description: free-text justification circulated to the membership with the ballot
      - name: status
        type: enum
        source: computed
        description: action lifecycle state
        default: PROPOSED
        constraints: "one of {PROPOSED, VOTING, APPROVED, REJECTED, EXECUTED, WITHDRAWN}"
      - name: required_approval_bps
        type: integer
        source: computed
        description: approval threshold in basis points - ADMIT_APPROVAL_BPS for ADMIT, WITHDRAW_APPROVAL_BPS for WITHDRAW
      - name: quorum_weight_bps
        type: integer
        source: computed
        description: quorum threshold in basis points of total eligible voting weight
        default: 6000
      - name: eligible_weight_bps
        type: integer
        source: computed
        description: sum of voting_weight_bps over members with voting_weight_bps > 0 at the moment voting closed
        default: 0
      - name: cast_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps over this action's non-voided ballots
        default: 0
      - name: for_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps over ballots with choice FOR
        default: 0
      - name: against_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps over this action's non-voided ballots with choice AGAINST
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: "true when cast_weight_bps * 10000 >= eligible_weight_bps * quorum_weight_bps; see calculations.vote_tally"
        default: false
      - name: approval_ratio_bps
        type: integer
        source: computed
        description: "floor(for_weight_bps * 10000 / (for_weight_bps + against_weight_bps)); ABSTAIN excluded from the denominator"
        default: 0
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Commissioner who proposed the action; segregation-of-duties reference for close-voting
      - name: closed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the Commissioner who closed the voting
        default: null
      - name: amend_count
        type: integer
        source: computed
        description: number of VOTING to PROPOSED amendment loops taken; capped by AMEND_LIMIT
        default: 0

  - name: Ballot
    parent: null
    common_fields: false
    fields:
      - name: membership_action_id
        type: string
        source: input
        description: "FK -> MembershipAction.id; the membership action being voted on; null when this ballot votes a budget"
        default: null
      - name: budget_proposal_id
        type: string
        source: input
        description: "FK -> BudgetProposal.id; the budget being voted on; null when this ballot votes a membership action"
        default: null
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member casting the ballot"
      - name: choice
        type: enum
        source: input
        description: ballot selection
        constraints: "one of {FOR, AGAINST, ABSTAIN}"
      - name: weight_bps
        type: integer
        source: computed
        description: Member.voting_weight_bps snapshotted at cast time
      - name: status
        type: enum
        source: computed
        description: CAST normally; VOIDED when the parent MembershipAction loops back to PROPOSED via amend
        default: CAST
        constraints: "one of {CAST, VOIDED}"
      - name: cast_by_user_id
        type: string
        source: system
        description: X-User-ID of the member representative who cast the ballot

  - name: BudgetProposal
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference whose budget this is"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the budget covers
      - name: proposed_operating_expense_cents
        type: integer
        source: input
        description: proposed conference operating expense; also the reserve target basis
        constraints: "proposed_operating_expense_cents >= 0"
      - name: proposed_governance_expense_cents
        type: integer
        source: input
        description: proposed compliance and governance services expense billed to members
        constraints: "proposed_governance_expense_cents >= 0"
      - name: status
        type: enum
        source: computed
        description: budget lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, VOTING, APPROVED, REJECTED}"
      - name: required_approval_bps
        type: integer
        source: computed
        description: BUDGET_APPROVAL_BPS threshold in basis points
        default: 6670
      - name: eligible_weight_bps
        type: integer
        source: computed
        description: sum of voting_weight_bps over eligible members at the moment voting closed
        default: 0
      - name: cast_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps over this proposal's ballots
        default: 0
      - name: for_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps over ballots with choice FOR
        default: 0
      - name: against_weight_bps
        type: integer
        source: computed
        description: sum of weight_bps over this proposal's ballots with choice AGAINST
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: "true when cast_weight_bps * 10000 >= eligible_weight_bps * 6000; see calculations.vote_tally"
        default: false
      - name: approval_ratio_bps
        type: integer
        source: computed
        description: "floor(for_weight_bps * 10000 / (for_weight_bps + against_weight_bps))"
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceOfficer who prepared the proposal
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the FinanceOfficer who closed the voting into APPROVED
        default: null

  - name: ProtectedRivalry
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference protecting the rivalry"
      - name: member_a_id
        type: string
        source: input
        description: "FK -> Member.id; first party to the rivalry"
      - name: member_b_id
        type: string
        source: input
        description: "FK -> Member.id; second party to the rivalry"
      - name: required_annual_meetings
        type: integer
        source: input
        description: meetings the pair must schedule per fiscal year
        default: 1
        constraints: "required_annual_meetings >= 1"
      - name: label
        type: string
        source: input
        description: display name of the rivalry trophy or series
      - name: status
        type: enum
        source: computed
        description: ACTIVE while protected; LAPSED once no non-CANCELLED meeting remains for Conference.current_fiscal_year
        default: ACTIVE
        constraints: "one of {ACTIVE, LAPSED}"

  - name: ScheduleGame
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference owning the schedule"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the game counts toward
      - name: home_member_id
        type: string
        source: input
        description: "FK -> Member.id; home participant, whose home_venue_id must equal venue_id"
      - name: away_member_id
        type: string
        source: input
        description: "FK -> Member.id; visiting participant"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; where the game is played"
      - name: protected_rivalry_id
        type: string
        source: input
        description: "FK -> ProtectedRivalry.id; the rivalry this game satisfies; null for non-rivalry games"
        default: null
      - name: game_date
        type: datetime
        source: input
        description: scheduled kickoff instant; the point occupation checked against the member rest buffer
      - name: media_designated
        type: boolean
        source: input
        description: whether the game counts as a media appearance in the distribution weight
        default: false
      - name: status
        type: enum
        source: computed
        description: game lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PLAYED, CANCELLED}"

  - name: ChampionshipEvent
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference staging the event"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue occupied for the half-open event window"
      - name: host_member_id
        type: string
        source: input
        description: "FK -> Member.id; the member hosting and receiving the host share"
      - name: revenue_pool_id
        type: string
        source: input
        description: "FK -> RevenuePool.id; the pool credited with the participant pool at settlement"
      - name: sport
        type: string
        source: input
        description: sport the championship is contested in
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the event settles into
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the venue occupation window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the venue occupation window
        constraints: "window_end > window_start"
      - name: ticket_revenue_cents
        type: integer
        source: computed
        description: ticket receipts supplied at settlement
        default: 0
      - name: sponsorship_revenue_cents
        type: integer
        source: computed
        description: sponsorship receipts supplied at settlement
        default: 0
      - name: event_expense_cents
        type: integer
        source: computed
        description: event operating expense supplied at settlement
        default: 0
      - name: net_event_revenue_cents
        type: integer
        source: computed
        description: ticket_revenue_cents plus sponsorship_revenue_cents minus event_expense_cents
        default: 0
      - name: host_share_cents
        type: integer
        source: computed
        description: "ceil(net_event_revenue_cents * HOST_SHARE_BPS / 10000) when net is positive, else 0"
        default: 0
      - name: participant_pool_cents
        type: integer
        source: computed
        description: net_event_revenue_cents minus host_share_cents; added to the linked pool's gross_revenue_cents
        default: 0
      - name: status
        type: enum
        source: computed
        description: event lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HOST_AT_RISK, HOSTED, SETTLED, CANCELLED}"

  - name: AuditReport
    parent: Conference
    common_fields: true
    fields:
      - name: conference_id
        type: string
        source: input
        description: "FK -> Conference.id; the conference reported to"
      - name: distribution_run_id
        type: string
        source: input
        description: "FK -> DistributionRun.id; the run being attested"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year covered by the report
      - name: opinion
        type: enum
        source: input
        description: auditor's opinion on the attested run
        constraints: "one of {UNQUALIFIED, QUALIFIED, ADVERSE}"
      - name: note
        type: string
        source: input
        description: narrative accompanying the opinion in the report to the membership
      - name: reconciliation_delta_cents
        type: integer
        source: computed
        description: "net_pool_cents minus (reserve_draw + sum of net_payable + withheld + governance_fee + gor_offset); must be 0 to issue"
        default: 0
      - name: status
        type: enum
        source: computed
        description: report lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, ACCEPTED}"
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the Auditor who issued the report
        default: null
      - name: accepted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the Commissioner who recorded membership acceptance
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: Conference
    initial_state: FORMING
    terminal_states: [OPERATING]
    transitions:
      - from: FORMING
        to: OPERATING
        trigger: "POST /budget-proposals/{id}/close-voting resolving to APPROVED"
        actor: FinanceOfficer
        preconditions:
          - "BudgetProposal.status == VOTING"
          - "vote_tally passes quorum and BUDGET_APPROVAL_BPS"
        side_effects:
          - "Conference.approved_operating_expense_cents = BudgetProposal.proposed_operating_expense_cents"
          - "Conference.approved_governance_expense_cents = BudgetProposal.proposed_governance_expense_cents"
          - "recompute Conference.reserve_target_cents via calculations.reserve_posture_derivation"
          - "recompute Conference.reserve_posture via calculations.reserve_posture_derivation"
          - "increments Conference.version by 1"
        note: "Closes the CHARTER admission window - POST /members with admission_path CHARTER is rejected once governance_status == OPERATING."

  - entity: Member
    initial_state: PETITIONED
    terminal_states: [ADMISSION_DENIED, DEPARTED]
    transitions:
      - from: PETITIONED
        to: FULL_SHARE
        trigger: "POST /members with admission_path == CHARTER"
        actor: Commissioner
        preconditions:
          - "Conference.governance_status == FORMING"
          - "institution_code is unique across the conference"
        side_effects:
          - "Member.distribution_phase_bps = 10000"
          - "Member.voting_weight_bps = 10000"
        note: "Charter seating is atomic with creation - the row is never observable in PETITIONED."
      - from: PETITIONED
        to: ADMITTED_PHASING
        trigger: "POST /membership-actions/{id}/execute where action_type == ADMIT"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == APPROVED"
          - "MembershipAction.action_type == ADMIT"
          - "Member.status == PETITIONED"
        side_effects:
          - "Member.phase_year = 1"
          - "recompute Member.distribution_phase_bps via calculations.member_phase_schedule"
          - "Member.voting_weight_bps = Member.distribution_phase_bps"
          - "MembershipAction.status = EXECUTED"
          - "increments Member.version by 1"
      - from: PETITIONED
        to: ADMISSION_DENIED
        trigger: "POST /membership-actions/{id}/close-voting resolving to REJECTED where action_type == ADMIT"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == VOTING"
          - "vote_tally fails quorum or ADMIT_APPROVAL_BPS"
        side_effects:
          - "MembershipAction.status = REJECTED"
          - "Member.voting_weight_bps = 0"
          - "increments Member.version by 1"
      - from: ADMITTED_PHASING
        to: ADMITTED_PHASING
        trigger: "POST /members/{id}/phase-advance"
        actor: Commissioner
        preconditions:
          - "Member.status == ADMITTED_PHASING"
          - "Member.entry_fee_paid_cents >= Member.entry_fee_cents"
          - "resulting distribution_phase_bps < 10000"
        side_effects:
          - "Member.phase_year increments by 1"
          - "recompute Member.distribution_phase_bps via calculations.member_phase_schedule"
          - "Member.voting_weight_bps = Member.distribution_phase_bps"
          - "increments Member.version by 1"
        note: "Self-loop: the phased distribution schedule steps one year per call."
      - from: ADMITTED_PHASING
        to: FULL_SHARE
        trigger: "POST /members/{id}/phase-advance whose resulting distribution_phase_bps reaches 10000"
        actor: Commissioner
        preconditions:
          - "Member.status == ADMITTED_PHASING"
          - "Member.entry_fee_paid_cents >= Member.entry_fee_cents"
          - "phase_year + 1 >= Conference.phase_schedule_years + 1"
        side_effects:
          - "Member.phase_year increments by 1"
          - "Member.distribution_phase_bps = 10000"
          - "Member.voting_weight_bps = 10000"
          - "increments Member.version by 1"
      - from: FULL_SHARE
        to: WITHDRAWAL_NOTICED
        trigger: "POST /members/{id}/withdrawal-notice"
        actor: Commissioner
        preconditions:
          - "Member.status == FULL_SHARE"
          - "withdrawal_effective_fiscal_year > Conference.current_fiscal_year"
        side_effects:
          - "Member.withdrawal_notice_at = logical clock now"
          - "Member.notice_days computed from withdrawal_notice_at to the first day of withdrawal_effective_fiscal_year"
          - "compute Member.exit_settlement_total_cents via calculations.exit_settlement_assessment"
          - "Member.voting_weight_bps = 0"
          - "increments Member.version by 1"
      - from: WITHDRAWAL_NOTICED
        to: FULL_SHARE
        trigger: "POST /members/{id}/withdrawal-notice/rescind"
        actor: Commissioner
        preconditions:
          - "Member.status == WITHDRAWAL_NOTICED"
          - "no MembershipAction with action_type WITHDRAW for this member is in status VOTING, APPROVED or EXECUTED"
          - "Member.exit_settlement_paid_cents == 0"
        side_effects:
          - "Member.withdrawal_notice_at = null"
          - "Member.notice_days = null"
          - "Member.withdrawal_effective_fiscal_year = null"
          - "Member.exit_settlement_total_cents = 0"
          - "Member.voting_weight_bps = 10000"
          - "increments Member.version by 1"
        note: "Cycle: the rescission returns the member to FULL_SHARE, making the machine non-linear."
      - from: WITHDRAWAL_NOTICED
        to: DEPARTED
        trigger: "POST /membership-actions/{id}/execute where action_type == WITHDRAW"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == APPROVED"
          - "MembershipAction.action_type == WITHDRAW"
          - "Member.status == WITHDRAWAL_NOTICED"
        side_effects:
          - "Member.distribution_phase_bps = 0"
          - "Member.voting_weight_bps = 0"
          - "MembershipAction.status = EXECUTED"
          - "cascade hop 2: every ScheduleGame with this member as home or away participant in status SCHEDULED transitions to CANCELLED"
          - "increments Member.version by 1"

  - entity: RevenuePool
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /revenue-pools/{id}/open"
        actor: FinanceOfficer
        preconditions:
          - "RevenuePool.status == DRAFT"
          - "Conference.governance_status == OPERATING"
        side_effects:
          - "increments RevenuePool.version by 1"
      - from: OPEN
        to: BOOKS_CLOSED
        trigger: "POST /revenue-pools/{id}/close-books"
        actor: FinanceOfficer
        preconditions:
          - "RevenuePool.status == OPEN"
          - "every BowlAppearance with fiscal_year == RevenuePool.fiscal_year is in status APPROVED or VOIDED"
        side_effects:
          - "RevenuePool.audited_expense_cents = supplied audited_expense_cents"
          - "increments RevenuePool.version by 1"
      - from: BOOKS_CLOSED
        to: OPEN
        trigger: "POST /revenue-pools/{id}/reopen"
        actor: FinanceOfficer
        preconditions:
          - "RevenuePool.status == BOOKS_CLOSED"
          - "no DistributionRun on this pool is in status POSTED"
        side_effects:
          - "RevenuePool.audited_expense_cents = null"
          - "every DistributionRun on this pool in status COMPUTED transitions to SUPERSEDED"
          - "increments RevenuePool.version by 1"
        note: "Cycle: books can be reopened, so the pool machine is not a one-way pipeline."
      - from: BOOKS_CLOSED
        to: CLOSED
        trigger: "POST /revenue-pools/{id}/close"
        actor: FinanceOfficer
        preconditions:
          - "RevenuePool.status == BOOKS_CLOSED"
          - "at least one DistributionRun on this pool is in status POSTED"
        side_effects:
          - "increments RevenuePool.version by 1"
      - from: OPEN
        to: DRAFT
        trigger: "system - ChampionshipEvent settlement restates RevenuePool.gross_revenue_cents"
        actor: system
        preconditions:
          - "RevenuePool.status == OPEN"
        side_effects:
          - "RevenuePool.gross_revenue_cents increases by ChampionshipEvent.participant_pool_cents"
          - "cascade hop 4: every DistributionRun on this pool in status COMPUTED transitions to SUPERSEDED"
          - "increments RevenuePool.version by 1"
        note: "Auto-revert: a restated gross forces the pool back to DRAFT so the allocation must be re-opened and recomputed."
      - from: BOOKS_CLOSED
        to: DRAFT
        trigger: "system - ChampionshipEvent settlement restates RevenuePool.gross_revenue_cents"
        actor: system
        preconditions:
          - "RevenuePool.status == BOOKS_CLOSED"
        side_effects:
          - "RevenuePool.gross_revenue_cents increases by ChampionshipEvent.participant_pool_cents"
          - "RevenuePool.audited_expense_cents = null"
          - "cascade hop 4: every DistributionRun on this pool in status COMPUTED transitions to SUPERSEDED"
          - "increments RevenuePool.version by 1"

  - entity: DistributionRun
    initial_state: COMPUTED
    terminal_states: [REVERSED, SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: POSTED
        trigger: "POST /distribution-runs/{id}/post"
        actor: Treasurer
        preconditions:
          - "DistributionRun.status == COMPUTED"
          - "X-User-ID != DistributionRun.computed_by_user_id"
          - "when variant == FINAL_AUDITED, an AuditReport for this run is in status ISSUED"
          - "RevenuePool.status is OPEN or BOOKS_CLOSED"
        side_effects:
          - "DistributionRun.posted_at = logical clock now"
          - "DistributionRun.posted_by_user_id = X-User-ID"
          - "Conference.reserve_balance_cents increases by DistributionRun.reserve_draw_cents"
          - "recompute Conference.reserve_posture via calculations.reserve_posture_derivation"
          - "Conference.escrow_balance_cents increases by the sum of DistributionLine.withheld_cents"
          - "Conference.governance_fee_revenue_cents increases by the sum of DistributionLine.governance_fee_cents"
          - "for each line with gor_offset_cents > 0, Member.exit_settlement_paid_cents increases by gor_offset_cents"
          - "when variant == FINAL_AUDITED and pool_type == MEDIA_RIGHTS, each line's Member.last_full_annual_distribution_cents = line.gross_share_cents"
          - "increments Conference.version by 1"
      - from: POSTED
        to: REVERSED
        trigger: "POST /distribution-runs/{id}/reverse"
        actor: Treasurer
        preconditions:
          - "DistributionRun.status == POSTED"
          - "RevenuePool.status != CLOSED"
        side_effects:
          - "every DistributionLine of this run transitions ACTIVE to VOIDED"
          - "Conference.reserve_balance_cents decreases by DistributionRun.reserve_draw_cents"
          - "Conference.escrow_balance_cents decreases by the sum of DistributionLine.withheld_cents"
          - "Conference.governance_fee_revenue_cents decreases by the sum of DistributionLine.governance_fee_cents"
          - "for each line with gor_offset_cents > 0, Member.exit_settlement_paid_cents decreases by gor_offset_cents"
          - "recompute Conference.reserve_posture via calculations.reserve_posture_derivation"
          - "increments Conference.version by 1"
        note: "Compensation: every POST side effect on cents is reversed, so calculations.pool_reconciliation_identity holds again with the pool back to its pre-post totals."
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "POST /revenue-pools/{id}/distribution-runs creating a newer run on the same pool, or a pool auto-revert to DRAFT, or POST /revenue-pools/{id}/reopen"
        actor: system
        preconditions:
          - "DistributionRun.status == COMPUTED"
        side_effects:
          - "DistributionRun.superseded_by_run_id = the newer run's id when a newer run caused it, else null"
          - "cascade hop 5: every DistributionLine of this run transitions ACTIVE to VOIDED"

  - entity: DistributionLine
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system - parent DistributionRun transitions to SUPERSEDED or REVERSED"
        actor: system
        preconditions:
          - "DistributionLine.status == ACTIVE"
        side_effects:
          - "the line is excluded from calculations.pool_reconciliation_identity for its run"

  - entity: BowlAppearance
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /bowl-appearances/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == SUBMITTED"
        side_effects:
          - "increments BowlAppearance.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /bowl-appearances/{id}/request-revision"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == UNDER_REVIEW"
        side_effects:
          - "increments BowlAppearance.version by 1"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /bowl-appearances/{id}/resubmit"
        actor: MemberRepresentative
        preconditions:
          - "BowlAppearance.status == REVISION_REQUESTED"
          - "X-User-ID == BowlAppearance.member_id"
        side_effects:
          - "BowlAppearance.submitted_expense_cents, travel_miles and units_claimed replaced by the supplied values"
          - "PostseasonUnit rows for this appearance are deleted and recreated at the new units_claimed count in status PROVISIONAL"
          - "increments BowlAppearance.version by 1"
        note: "Cycle: the revision loop can be taken any number of times before approval."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /bowl-appearances/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == UNDER_REVIEW"
        side_effects:
          - "compute allowable_expense_cents, travel_allowance_cents, reimbursement_ceiling_cents, reimbursed_cents and residual_to_pool_cents via calculations.bowl_expense_reimbursement"
          - "Conference.escrow_balance_cents increases by residual_to_pool_cents"
          - "cascade hop 2: every PostseasonUnit of this appearance transitions PROVISIONAL to VALIDATED"
          - "cascade hop 3: Conference.validated_postseason_unit_count increases by units_claimed"
          - "increments Conference.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /bowl-appearances/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == SUBMITTED"
        side_effects:
          - "every PostseasonUnit of this appearance transitions PROVISIONAL to VOIDED"
          - "increments BowlAppearance.version by 1"
      - from: UNDER_REVIEW
        to: VOIDED
        trigger: "POST /bowl-appearances/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == UNDER_REVIEW"
        side_effects:
          - "every PostseasonUnit of this appearance transitions PROVISIONAL to VOIDED"
          - "increments BowlAppearance.version by 1"
      - from: REVISION_REQUESTED
        to: VOIDED
        trigger: "POST /bowl-appearances/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == REVISION_REQUESTED"
        side_effects:
          - "every PostseasonUnit of this appearance transitions PROVISIONAL to VOIDED"
          - "increments BowlAppearance.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /bowl-appearances/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "BowlAppearance.status == APPROVED"
          - "no PostseasonUnit of this appearance is referenced by a DistributionLine whose run is POSTED"
        side_effects:
          - "Conference.escrow_balance_cents decreases by residual_to_pool_cents"
          - "every PostseasonUnit of this appearance transitions VALIDATED to VOIDED"
          - "Conference.validated_postseason_unit_count decreases by units_claimed"
          - "increments Conference.version by 1"
        note: "Compensation: exactly reverses the APPROVED side effects, so Conference.validated_postseason_unit_count and Conference.escrow_balance_cents return to their pre-approval values."

  - entity: PostseasonUnit
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: VALIDATED
        trigger: "system - parent BowlAppearance transitions UNDER_REVIEW to APPROVED"
        actor: system
        preconditions:
          - "PostseasonUnit.status == PROVISIONAL"
        side_effects:
          - "the unit becomes eligible for calculations.postseason_unit_valuation and for a UNIT_BASED pool allocation"
      - from: VALIDATED
        to: VOIDED
        trigger: "system - parent BowlAppearance transitions APPROVED to VOIDED"
        actor: system
        preconditions:
          - "PostseasonUnit.status == VALIDATED"
        side_effects:
          - "the unit leaves Conference.validated_postseason_unit_count"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system - parent BowlAppearance transitions to VOIDED from SUBMITTED, UNDER_REVIEW or REVISION_REQUESTED"
        actor: system
        preconditions:
          - "PostseasonUnit.status == PROVISIONAL"
        side_effects:
          - "the unit is permanently excluded from every valuation"

  - entity: MembershipAction
    initial_state: PROPOSED
    terminal_states: [REJECTED, EXECUTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: VOTING
        trigger: "POST /membership-actions/{id}/open-voting"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == PROPOSED"
          - "at least one Member has voting_weight_bps > 0"
        side_effects:
          - "MembershipAction.required_approval_bps = ADMIT_APPROVAL_BPS for ADMIT, WITHDRAW_APPROVAL_BPS for WITHDRAW"
          - "increments MembershipAction.version by 1"
      - from: VOTING
        to: PROPOSED
        trigger: "POST /membership-actions/{id}/amend"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == VOTING"
          - "MembershipAction.amend_count < AMEND_LIMIT"
        side_effects:
          - "every Ballot of this action transitions CAST to VOIDED"
          - "MembershipAction.cast_weight_bps = 0, for_weight_bps = 0, approval_ratio_bps = 0"
          - "MembershipAction.amend_count increments by 1"
          - "increments MembershipAction.version by 1"
        note: "Cycle: negotiation rounds loop VOTING to PROPOSED to VOTING; AMEND_LIMIT is the termination condition."
      - from: VOTING
        to: APPROVED
        trigger: "POST /membership-actions/{id}/close-voting where vote_tally passes"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == VOTING"
          - "X-User-ID != MembershipAction.proposed_by_user_id"
          - "cast_weight_bps * 10000 >= eligible_weight_bps * quorum_weight_bps"
          - "approval_ratio_bps >= required_approval_bps"
        side_effects:
          - "MembershipAction.eligible_weight_bps, cast_weight_bps, for_weight_bps and approval_ratio_bps set from calculations.vote_tally"
          - "MembershipAction.closed_by_user_id = X-User-ID"
          - "increments MembershipAction.version by 1"
      - from: VOTING
        to: REJECTED
        trigger: "POST /membership-actions/{id}/close-voting where vote_tally fails"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == VOTING"
          - "X-User-ID != MembershipAction.proposed_by_user_id"
          - "quorum fails or approval_ratio_bps < required_approval_bps"
        side_effects:
          - "MembershipAction.eligible_weight_bps, cast_weight_bps, for_weight_bps and approval_ratio_bps set from calculations.vote_tally"
          - "MembershipAction.closed_by_user_id = X-User-ID"
          - "when action_type == ADMIT, Member.status transitions PETITIONED to ADMISSION_DENIED"
          - "increments MembershipAction.version by 1"
        note: "Branching: APPROVED and REJECTED are divergent forks from VOTING with different side-effect sets."
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /membership-actions/{id}/execute"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == APPROVED"
          - "for ADMIT, Member.status == PETITIONED; for WITHDRAW, Member.status == WITHDRAWAL_NOTICED"
        side_effects:
          - "for ADMIT, Member.status transitions PETITIONED to ADMITTED_PHASING"
          - "cascade hop 1 for WITHDRAW, Member.status transitions WITHDRAWAL_NOTICED to DEPARTED"
          - "cascade hop 2 for WITHDRAW, every ScheduleGame with the member in status SCHEDULED transitions to CANCELLED"
          - "cascade hop 3 for WITHDRAW, every ProtectedRivalry involving the member left with no non-CANCELLED meeting in Conference.current_fiscal_year transitions ACTIVE to LAPSED"
          - "cascade hop 4 for WITHDRAW, recompute schedule_compliance_score for every counterpart member of a LAPSED rivalry"
          - "cascade hop 5 for WITHDRAW, every ChampionshipEvent in status SCHEDULED hosted by a counterpart whose recomputed schedule_compliance_score < HOST_ELIGIBILITY_SCORE_MIN transitions to HOST_AT_RISK"
          - "increments MembershipAction.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /membership-actions/{id}/withdraw"
        actor: Commissioner
        preconditions:
          - "MembershipAction.status == PROPOSED"
        side_effects:
          - "every Ballot of this action transitions CAST to VOIDED"
          - "increments MembershipAction.version by 1"

  - entity: Ballot
    initial_state: CAST
    terminal_states: [VOIDED]
    transitions:
      - from: CAST
        to: VOIDED
        trigger: "system - parent MembershipAction transitions VOTING to PROPOSED via amend, or PROPOSED to WITHDRAWN"
        actor: system
        preconditions:
          - "Ballot.status == CAST"
        side_effects:
          - "the ballot no longer contributes to calculations.vote_tally"

  - entity: BudgetProposal
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: VOTING
        trigger: "POST /budget-proposals/{id}/open-voting"
        actor: FinanceOfficer
        preconditions:
          - "BudgetProposal.status == DRAFT"
          - "at least one Member has voting_weight_bps > 0"
        side_effects:
          - "BudgetProposal.required_approval_bps = BUDGET_APPROVAL_BPS"
          - "increments BudgetProposal.version by 1"
      - from: VOTING
        to: APPROVED
        trigger: "POST /budget-proposals/{id}/close-voting where vote_tally passes"
        actor: FinanceOfficer
        preconditions:
          - "BudgetProposal.status == VOTING"
          - "cast_weight_bps * 10000 >= eligible_weight_bps * 6000"
          - "approval_ratio_bps >= BUDGET_APPROVAL_BPS"
        side_effects:
          - "BudgetProposal.eligible_weight_bps, cast_weight_bps, for_weight_bps and approval_ratio_bps set from calculations.vote_tally"
          - "BudgetProposal.approved_by_user_id = X-User-ID"
          - "Conference.governance_status transitions FORMING to OPERATING when still FORMING"
          - "Conference.approved_operating_expense_cents and approved_governance_expense_cents updated"
          - "recompute Conference.reserve_target_cents and Conference.reserve_posture"
          - "increments BudgetProposal.version by 1"
          - "increments Conference.version by 1"
      - from: VOTING
        to: REJECTED
        trigger: "POST /budget-proposals/{id}/close-voting where vote_tally fails"
        actor: FinanceOfficer
        preconditions:
          - "BudgetProposal.status == VOTING"
          - "quorum fails or approval_ratio_bps < BUDGET_APPROVAL_BPS"
        side_effects:
          - "BudgetProposal.eligible_weight_bps, cast_weight_bps, for_weight_bps and approval_ratio_bps set from calculations.vote_tally"
          - "no Conference field changes"
          - "increments BudgetProposal.version by 1"
        note: "Branching: the fork sets a disjoint side-effect list from the APPROVED branch."

  - entity: ScheduleGame
    initial_state: SCHEDULED
    terminal_states: [PLAYED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PLAYED
        trigger: "POST /schedule-games/{id}/play"
        actor: ScheduleCoordinator
        preconditions:
          - "ScheduleGame.status == SCHEDULED"
          - "both participants are in status ADMITTED_PHASING, FULL_SHARE or WITHDRAWAL_NOTICED"
        side_effects:
          - "recompute schedule_compliance_score for both participants"
          - "increments ScheduleGame.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /schedule-games/{id}/cancel, or system cascade from a WITHDRAW execution"
        actor: ScheduleCoordinator
        preconditions:
          - "ScheduleGame.status == SCHEDULED"
        side_effects:
          - "cascade hop 3: when protected_rivalry_id is set and no non-CANCELLED meeting remains for that rivalry in Conference.current_fiscal_year, the ProtectedRivalry transitions ACTIVE to LAPSED"
          - "cascade hop 4: recompute schedule_compliance_score for both participants and for every counterpart of a rivalry that just LAPSED"
          - "cascade hop 5: every ChampionshipEvent in status SCHEDULED hosted by a member whose recomputed schedule_compliance_score < HOST_ELIGIBILITY_SCORE_MIN transitions to HOST_AT_RISK"
          - "increments ScheduleGame.version by 1"

  - entity: ProtectedRivalry
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system - the last non-CANCELLED ScheduleGame satisfying this rivalry in Conference.current_fiscal_year is cancelled"
        actor: system
        preconditions:
          - "ProtectedRivalry.status == ACTIVE"
          - "count of ScheduleGame rows with protected_rivalry_id == this rivalry, fiscal_year == Conference.current_fiscal_year and status in {SCHEDULED, PLAYED} is 0"
        side_effects:
          - "a LAPSED rivalry counts as unmet in calculations.schedule_compliance_score for both parties"

  - entity: ChampionshipEvent
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HOST_AT_RISK
        trigger: "system - the host member's recomputed schedule_compliance_score falls below HOST_ELIGIBILITY_SCORE_MIN"
        actor: system
        preconditions:
          - "ChampionshipEvent.status == SCHEDULED"
          - "Member.schedule_compliance_score < HOST_ELIGIBILITY_SCORE_MIN"
        side_effects:
          - "the event may still be hosted but is flagged to the membership in the audit report"
          - "increments ChampionshipEvent.version by 1"
      - from: HOST_AT_RISK
        to: SCHEDULED
        trigger: "system - the host member's recomputed schedule_compliance_score returns to HOST_ELIGIBILITY_SCORE_MIN or above"
        actor: system
        preconditions:
          - "ChampionshipEvent.status == HOST_AT_RISK"
          - "Member.schedule_compliance_score >= HOST_ELIGIBILITY_SCORE_MIN"
        side_effects:
          - "increments ChampionshipEvent.version by 1"
        note: "Cycle: host eligibility oscillates with the schedule compliance score."
      - from: SCHEDULED
        to: HOSTED
        trigger: "POST /championship-events/{id}/host"
        actor: ScheduleCoordinator
        preconditions:
          - "ChampionshipEvent.status == SCHEDULED"
        side_effects:
          - "increments ChampionshipEvent.version by 1"
      - from: HOST_AT_RISK
        to: HOSTED
        trigger: "POST /championship-events/{id}/host"
        actor: ScheduleCoordinator
        preconditions:
          - "ChampionshipEvent.status == HOST_AT_RISK"
        side_effects:
          - "increments ChampionshipEvent.version by 1"
      - from: HOSTED
        to: SETTLED
        trigger: "POST /championship-events/{id}/settle"
        actor: FinanceOfficer
        preconditions:
          - "ChampionshipEvent.status == HOSTED"
          - "the linked RevenuePool.status is DRAFT, OPEN or BOOKS_CLOSED"
        side_effects:
          - "cascade hop 1: compute net_event_revenue_cents, host_share_cents and participant_pool_cents via calculations.championship_event_settlement"
          - "cascade hop 2: the linked RevenuePool.gross_revenue_cents increases by participant_pool_cents"
          - "cascade hop 3: because gross_revenue_cents changed, that RevenuePool in status OPEN or BOOKS_CLOSED auto-reverts to DRAFT and audited_expense_cents is cleared"
          - "cascade hop 4: because the pool reverted to DRAFT, every DistributionRun on that pool in status COMPUTED transitions to SUPERSEDED"
          - "cascade hop 5: because those runs became SUPERSEDED, every DistributionLine on them transitions ACTIVE to VOIDED"
          - "increments ChampionshipEvent.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /championship-events/{id}/cancel"
        actor: ScheduleCoordinator
        preconditions:
          - "ChampionshipEvent.status == SCHEDULED"
        side_effects:
          - "the venue window is released for calculations of venue overlap"
          - "increments ChampionshipEvent.version by 1"
      - from: HOST_AT_RISK
        to: CANCELLED
        trigger: "POST /championship-events/{id}/cancel"
        actor: ScheduleCoordinator
        preconditions:
          - "ChampionshipEvent.status == HOST_AT_RISK"
        side_effects:
          - "the venue window is released for calculations of venue overlap"
          - "increments ChampionshipEvent.version by 1"

  - entity: AuditReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /audit-reports/{id}/issue"
        actor: Auditor
        preconditions:
          - "AuditReport.status == DRAFT"
          - "the linked DistributionRun.status == COMPUTED"
          - "reconciliation_delta_cents == 0"
          - "X-User-ID != DistributionRun.computed_by_user_id"
        side_effects:
          - "AuditReport.reconciliation_delta_cents recomputed via calculations.pool_reconciliation_identity"
          - "AuditReport.issued_by_user_id = X-User-ID"
          - "the linked DistributionRun becomes postable when variant == FINAL_AUDITED"
          - "increments AuditReport.version by 1"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /audit-reports/{id}/accept"
        actor: Commissioner
        preconditions:
          - "AuditReport.status == ISSUED"
          - "the linked DistributionRun.status == POSTED"
        side_effects:
          - "AuditReport.accepted_by_user_id = X-User-ID"
          - "increments AuditReport.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: distribution-run-create-stale-pool
    parent_entity: RevenuePool
    write_endpoint: "POST /revenue-pools/{id}/distribution-runs"
    occ_field: "expected_pool_version"
    description: |
      Creating a DistributionRun against a RevenuePool whose version has
      advanced since the client last read it is rejected. Creating a run
      legitimately supersedes any prior COMPUTED run on the same pool, so a
      writer holding a stale view of the pool would otherwise silently
      supersede an allocation it never saw, and would compute against a
      restated gross_revenue_cents or a cleared audited_expense_cents.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

  - rule_id: ballot-cast-stale-action
    parent_entity: MembershipAction
    write_endpoint: "POST /membership-actions/{id}/ballots"
    occ_field: "expected_action_version"
    description: |
      Casting a ballot against a MembershipAction whose version has advanced
      since the client last read it is rejected. An amendment loop voids every
      prior ballot and bumps the action version, so a stale ballot would be
      counted against a proposal text the representative never saw.
    error_id: ERR_STALE_ACTION_VERSION
    http_status: 412

  - rule_id: reserve-transfer-stale-conference
    parent_entity: Conference
    write_endpoint: "POST /conference/reserve-transfers"
    occ_field: "expected_conference_version"
    description: |
      A reserve transfer against a Conference whose version has advanced since
      the client last read it is rejected. Posting a distribution run, approving
      a budget and approving a bowl appearance all move reserve_balance_cents,
      reserve_target_cents or escrow_balance_cents, so a transfer sized from a
      stale balance would drive reserve_posture to an unintended value.
    error_id: ERR_STALE_CONFERENCE_VERSION
    http_status: 412

  - rule_id: member-profile-update-stale-member
    parent_entity: Member
    write_endpoint: "PATCH /members/{id}"
    occ_field: "expected_member_version"
    description: |
      Updating a Member profile whose version has advanced since the client last
      read it is rejected. Phase advances, withdrawal notices, rescissions and
      schedule-compliance recomputes all bump the member version, so a stale
      profile write would reinstate a travel partner or home venue that the
      newer state has already invalidated.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# All rates are basis points and all arithmetic is integer arithmetic on
# cents, so no floating-point rounding is ever observable.
# =====================================================================
calculations:

  - name: reserve_posture_derivation
    trigger: "on POST /conference/reserve-transfers, on a BudgetProposal reaching APPROVED, and on a DistributionRun transitioning to POSTED or REVERSED"
    algorithm: threshold
    formula: |
      reserve_target_cents = ceil(Conference.approved_operating_expense_cents * RESERVE_TARGET_BPS / 10000)
      if reserve_target_cents == 0:
          reserve_posture = OPEN
      elif reserve_balance_cents * 10000 <  reserve_target_cents * POSTURE_FROZEN_BPS:
          reserve_posture = FROZEN
      elif reserve_balance_cents * 10000 <  reserve_target_cents * POSTURE_RESTRICTED_BPS:
          reserve_posture = RESERVE_RESTRICTED
      else:
          reserve_posture = OPEN
      funded_ratio_bps = 10000 if reserve_target_cents == 0
                         else floor(reserve_balance_cents * 10000 / reserve_target_cents)
    input_set: "Conference.reserve_balance_cents and Conference.approved_operating_expense_cents; approved_operating_expense_cents comes only from the most recently APPROVED BudgetProposal"
    constants:
      RESERVE_TARGET_BPS: 1500
      POSTURE_FROZEN_BPS: 2500
      POSTURE_RESTRICTED_BPS: 6000
    precision: "integer cents; comparisons are cross-multiplied so no division occurs; the boundary is inclusive on the OPEN side (funded ratio exactly 6000 bps is OPEN, exactly 2500 bps is RESERVE_RESTRICTED)"

  - name: member_phase_schedule
    trigger: "on POST /members with admission_path CHARTER, on a MembershipAction ADMIT execution, and on POST /members/{id}/phase-advance"
    algorithm: threshold
    formula: |
      if Member.status in {PETITIONED, ADMISSION_DENIED, DEPARTED}:
          distribution_phase_bps = 0
      elif Member.status in {FULL_SHARE, WITHDRAWAL_NOTICED}:
          distribution_phase_bps = 10000
      else:   # ADMITTED_PHASING
          distribution_phase_bps = min(10000,
              floor(10000 * Member.phase_year / (Conference.phase_schedule_years + 1)))
      voting_weight_bps = 0                       if Member.status in {PETITIONED, ADMISSION_DENIED, WITHDRAWAL_NOTICED, DEPARTED}
                          else 10000              if Member.status == FULL_SHARE
                          else distribution_phase_bps
    input_set: "the single Member row plus Conference.phase_schedule_years"
    constants:
      DEFAULT_PHASE_SCHEDULE_YEARS: 3
    precision: "integer basis points; with phase_schedule_years == 3 the ladder is phase_year 1 -> 2500, 2 -> 5000, 3 -> 7500, 4 -> 10000 (and the member becomes FULL_SHARE at 10000)"

  - name: distribution_share_allocation
    trigger: "on POST /revenue-pools/{id}/distribution-runs"
    algorithm: waterfall_allocation
    formula: |
      # --- step 1: net pool (expense basis is variant-dependent) ---
      expense_cents = RevenuePool.estimated_expense_cents      if variant == PROVISIONAL
                      else RevenuePool.audited_expense_cents   # FINAL_AUDITED
      net_pool_cents = RevenuePool.gross_revenue_cents - expense_cents

      # --- step 2: reserve sweep, capped by the remaining shortfall ---
      sweep_bps = RESERVE_SWEEP_BPS_RESTRICTED if Conference.reserve_posture == RESERVE_RESTRICTED
                  else RESERVE_SWEEP_BPS_OPEN
      shortfall_cents  = max(0, Conference.reserve_target_cents - Conference.reserve_balance_cents)
      reserve_draw_cents = min(ceil(net_pool_cents * sweep_bps / 10000), shortfall_cents)
      distributable_cents = net_pool_cents - reserve_draw_cents

      # --- step 3: per-member raw weight, branching on allocation_method ---
      for member in eligible_members:                      # see input_set
          if RevenuePool.allocation_method == EQUAL_SHARE:
              raw_bps = BASE_WEIGHT_BPS
          elif RevenuePool.allocation_method == UNIT_BASED:
              raw_bps = BASE_WEIGHT_BPS * validated_unit_count(member, RevenuePool.fiscal_year)
          else:   # APPEARANCE_PERFORMANCE_WEIGHTED
              raw_bps = BASE_WEIGHT_BPS
                        + APPEARANCE_WEIGHT_BPS  * media_appearance_count(member, variant)
                        + PERFORMANCE_WEIGHT_BPS * postseason_berth_count(member, variant)
          weight_bps = floor(raw_bps * member.distribution_phase_bps / 10000)
      # a member whose weight lands on exactly 0 receives no DistributionLine at all,
      # so a zero-weight member is never charged the governance service fee
      line_members = [member for member in eligible_members if weight_bps > 0]
      total_weight_bps = sum(weight_bps over line_members)
      if total_weight_bps == 0: reject with ERR_EMPTY_ALLOCATION_BASIS

      # --- step 4: PINNED ROUNDING ORDER - floor every line, then hand out
      #     the leftover cents one at a time. Rounding half-up per line and
      #     summing is explicitly NOT the rule and yields different cents.
      for member in line_members: gross_share_cents = floor(distributable_cents * weight_bps / total_weight_bps)
      remainder_cents = distributable_cents - sum(gross_share_cents)
      order = line_members sorted by (weight_bps DESC, Member.created_at ASC)
      for k in 0 .. remainder_cents - 1:
          line = order[k mod len(order)]
          line.gross_share_cents += 1
          line.remainder_cent_awarded += 1
    input_set: |
      eligible_members = Member rows with conference_id == RevenuePool.conference_id and
      status in {ADMITTED_PHASING, FULL_SHARE, WITHDRAWAL_NOTICED}, enumerated in
      Member.created_at ASC order. Members in PETITIONED, ADMISSION_DENIED or DEPARTED are excluded.
      media_appearance_count(member, variant) = count of ScheduleGame rows with
      fiscal_year == RevenuePool.fiscal_year, media_designated == true, and
      (home_member_id == member.id or away_member_id == member.id), whose status is in
      {SCHEDULED, PLAYED} for variant PROVISIONAL and in {PLAYED} for variant FINAL_AUDITED.
      postseason_berth_count(member, variant) = count of BowlAppearance rows with
      member_id == member.id and fiscal_year == RevenuePool.fiscal_year, whose status is in
      {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED} for variant PROVISIONAL and in
      {APPROVED} for variant FINAL_AUDITED.
      validated_unit_count(member, fy) = count of PostseasonUnit rows with member_id == member.id,
      fiscal_year == fy and status == VALIDATED.
    constants:
      BASE_WEIGHT_BPS: 10000
      APPEARANCE_WEIGHT_BPS: 1500
      PERFORMANCE_WEIGHT_BPS: 2500
      RESERVE_SWEEP_BPS_OPEN: 500
      RESERVE_SWEEP_BPS_RESTRICTED: 1500
    precision: "integer cents, floor per line then remainder cents distributed in (weight_bps DESC, created_at ASC) order; the reserve sweep uses ceil"
    variants:
      - name: PROVISIONAL
        when: "requested with variant == PROVISIONAL; only accepted while RevenuePool.status == OPEN"
        difference: "expense basis is estimated_expense_cents; the appearance count includes SCHEDULED games and the berth count includes appearances still under review; PROVISIONAL_WITHHOLD_BPS is escrowed on every line"
      - name: FINAL_AUDITED
        when: "requested with variant == FINAL_AUDITED; only accepted while RevenuePool.status == BOOKS_CLOSED"
        difference: "expense basis is audited_expense_cents; only PLAYED games and APPROVED appearances count; nothing is escrowed; posting the run writes Member.last_full_annual_distribution_cents"

  - name: distribution_line_offsets
    trigger: "on POST /revenue-pools/{id}/distribution-runs, immediately after distribution_share_allocation sets gross_share_cents"
    algorithm: threshold
    formula: |
      withheld_cents = ceil(gross_share_cents * PROVISIONAL_WITHHOLD_BPS / 10000)
                       if DistributionRun.variant == PROVISIONAL else 0
      governance_fee_cents = GOVERNANCE_SERVICE_FEE_CENTS
      available_cents = gross_share_cents - withheld_cents - governance_fee_cents

      gor_applies = Member.status == WITHDRAWAL_NOTICED
                    and Member.grant_of_rights_through_fiscal_year >= RevenuePool.fiscal_year
                    and (Member.exit_settlement_total_cents - Member.exit_settlement_paid_cents) > 0
      if gor_applies:
          gor_cap_cents     = floor(Member.exit_settlement_total_cents * GOR_WITHHOLD_CAP_BPS / 10000)
          outstanding_cents = Member.exit_settlement_total_cents - Member.exit_settlement_paid_cents
          gor_offset_cents  = min(gor_cap_cents, outstanding_cents, max(0, available_cents))
      else:
          gor_offset_cents  = 0

      net_payable_cents = available_cents - gor_offset_cents
    input_set: "the single DistributionLine plus its Member row and the parent RevenuePool.fiscal_year; Member.exit_settlement_paid_cents is read as of run creation and only advanced when the run is POSTED"
    constants:
      PROVISIONAL_WITHHOLD_BPS: 1000
      GOVERNANCE_SERVICE_FEE_CENTS: 1250000
      GOR_WITHHOLD_CAP_BPS: 5000
    precision: "integer cents; the withholding uses ceil and the grant-of-rights cap uses floor"

  - name: postseason_unit_valuation
    trigger: "on GET /members/{id}/postseason-unit-valuation and when a UNIT_BASED RevenuePool distribution run is computed"
    algorithm: aggregation
    formula: |
      if Member.status == WITHDRAWAL_NOTICED:                 # CURRENT_YEAR_ONLY variant
          window_start_fiscal_year = Conference.current_fiscal_year
      else:                                                   # ROLLING_SIX_YEAR variant
          window_start_fiscal_year = Conference.current_fiscal_year - (ROLLING_WINDOW_YEARS - 1)
      window_end_fiscal_year = Conference.current_fiscal_year
      validated_unit_count = count of PostseasonUnit rows with
          member_id == Member.id, status == VALIDATED and
          window_start_fiscal_year <= fiscal_year <= window_end_fiscal_year
      valuation_cents = validated_unit_count * Conference.unit_value_cents
    input_set: "PostseasonUnit rows in status VALIDATED only; PROVISIONAL and VOIDED units are excluded. Both window bounds are inclusive."
    constants:
      ROLLING_WINDOW_YEARS: 6
    precision: "integer cents; exact multiplication, no rounding"
    variants:
      - name: ROLLING_SIX_YEAR
        when: "Member.status is ADMITTED_PHASING, FULL_SHARE or DEPARTED"
        difference: "counts validated units over the six fiscal years ending at Conference.current_fiscal_year inclusive"
      - name: CURRENT_YEAR_ONLY
        when: "Member.status == WITHDRAWAL_NOTICED"
        difference: "a member under notice is valued on Conference.current_fiscal_year alone, so historical units drop out of the entitlement entirely"

  - name: bowl_expense_reimbursement
    trigger: "on POST /bowl-appearances/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      allowable_expense_cents = min(submitted_expense_cents, ALLOWABLE_EXPENSE_CAP_CENTS)
      travel_allowance_cents  = min(travel_miles * TRAVEL_RATE_CENTS_PER_MILE,
                                    TRAVEL_ALLOWANCE_CAP_CENTS)
      band_bps = REIMB_BAND_HIGH_BPS if payout_cents >= REIMB_BAND_HIGH_PAYOUT_CENTS
                 else REIMB_BAND_LOW_BPS
      reimbursement_ceiling_cents = ceil(payout_cents * band_bps / 10000)
      reimbursed_cents = min(allowable_expense_cents + travel_allowance_cents,
                             reimbursement_ceiling_cents)
      residual_to_pool_cents = payout_cents - reimbursed_cents
    input_set: "the single BowlAppearance row; event_tier is descriptive only - the band is selected by payout_cents, not by tier"
    constants:
      ALLOWABLE_EXPENSE_CAP_CENTS: 8000000
      TRAVEL_RATE_CENTS_PER_MILE: 95
      TRAVEL_ALLOWANCE_CAP_CENTS: 2500000
      REIMB_BAND_HIGH_PAYOUT_CENTS: 10000000
      REIMB_BAND_HIGH_BPS: 6000
      REIMB_BAND_LOW_BPS: 8500
    precision: "integer cents; the ceiling uses ceil. Four inputs interact through two independent min() caps and one payout-tier branch, so the result is not a linear function of any single input - a larger payout can lower the reimbursement by moving the band from 8500 to 6000 bps."

  - name: exit_settlement_assessment
    trigger: "on POST /members/{id}/withdrawal-notice"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The surcharge bracket is keyed on
      # base_assessment_cents, NOT on the total that includes the surcharge.
      # Bracketing on the total would be circular (total depends on the
      # surcharge, the surcharge on the bracket, the bracket on the total);
      # this rule breaks the loop by fixing base as the bracket key.
      #   step 1  notice_days           = whole days from withdrawal_notice_at to the
      #                                   first day of withdrawal_effective_fiscal_year
      #   step 2  notice_multiplier_bps = NOTICE_MULT_LONG_BPS   if notice_days >= 730
      #                                   NOTICE_MULT_MEDIUM_BPS if 365 <= notice_days < 730
      #                                   NOTICE_MULT_SHORT_BPS  if notice_days < 365
      #   step 3  base_assessment_cents = ceil(Member.last_full_annual_distribution_cents
      #                                        * notice_multiplier_bps / 10000)
      #   step 4  surcharge_bracket_bps = SURCHARGE_BRACKET_1_BPS if base_assessment_cents <  BRACKET_1_CEILING_CENTS
      #                                   SURCHARGE_BRACKET_2_BPS if BRACKET_1_CEILING_CENTS <= base_assessment_cents < BRACKET_2_CEILING_CENTS
      #                                   SURCHARGE_BRACKET_3_BPS if base_assessment_cents >= BRACKET_2_CEILING_CENTS
      #   step 5  surcharge_cents       = ceil(base_assessment_cents * surcharge_bracket_bps / 10000)
      #   step 6  exit_settlement_total_cents = base_assessment_cents + surcharge_cents
      # step 4 MUST read base_assessment_cents from step 3 and MUST NOT re-read
      # the step 6 total.
    input_set: "the single Member row; last_full_annual_distribution_cents is the member's gross_share_cents on the most recently POSTED FINAL_AUDITED MEDIA_RIGHTS DistributionRun, and is 0 when no such run exists"
    constants:
      NOTICE_MULT_LONG_BPS: 10000
      NOTICE_MULT_MEDIUM_BPS: 20000
      NOTICE_MULT_SHORT_BPS: 30000
      NOTICE_LONG_DAYS: 730
      NOTICE_MEDIUM_DAYS: 365
      BRACKET_1_CEILING_CENTS: 100000000
      BRACKET_2_CEILING_CENTS: 300000000
      SURCHARGE_BRACKET_1_BPS: 200
      SURCHARGE_BRACKET_2_BPS: 350
      SURCHARGE_BRACKET_3_BPS: 500
    precision: "integer cents, ceil at steps 3 and 5"

  - name: vote_tally
    trigger: "on POST /membership-actions/{id}/close-voting and on POST /budget-proposals/{id}/close-voting"
    algorithm: weighted_scoring
    formula: |
      eligible_weight_bps = sum of Member.voting_weight_bps over Member rows with
                            conference_id == the ballot subject's conference_id
                            and voting_weight_bps > 0
      counted_ballots     = Ballot rows attached to this action or proposal with status == CAST
      cast_weight_bps     = sum of weight_bps over counted_ballots          # ABSTAIN included
      for_weight_bps      = sum of weight_bps over counted_ballots with choice == FOR
      against_weight_bps  = sum of weight_bps over counted_ballots with choice == AGAINST
      decisive_weight_bps = for_weight_bps + against_weight_bps             # ABSTAIN excluded
      approval_ratio_bps  = 0 if decisive_weight_bps == 0
                            else floor(for_weight_bps * 10000 / decisive_weight_bps)
      quorum_met          = cast_weight_bps * 10000 >= eligible_weight_bps * QUORUM_BPS
      required_bps        = ADMIT_APPROVAL_BPS    if action_type == ADMIT
                            WITHDRAW_APPROVAL_BPS if action_type == WITHDRAW
                            BUDGET_APPROVAL_BPS   for a BudgetProposal
      outcome             = APPROVED if (quorum_met and approval_ratio_bps >= required_bps)
                            else REJECTED
    input_set: "Ballot rows with status == CAST only; VOIDED ballots (voided by an amendment loop) are excluded. eligible_weight_bps is snapshotted at close-voting time, so a member who filed a withdrawal notice mid-vote leaves both the numerator and the denominator."
    constants:
      QUORUM_BPS: 6000
      ADMIT_APPROVAL_BPS: 7500
      WITHDRAW_APPROVAL_BPS: 6000
      BUDGET_APPROVAL_BPS: 6670
    precision: "integer basis points, floor on the ratio; both the quorum and the approval comparison are inclusive (>=), so a ratio of exactly 7500 bps approves an ADMIT"

  - name: schedule_compliance_score
    trigger: "on POST /schedule-games, on POST /schedule-games/{id}/play, on POST /schedule-games/{id}/cancel, on a ProtectedRivalry transition to LAPSED, on GET /members/{id}/schedule-compliance, and as cascade hop 4 of a WITHDRAW execution"
    algorithm: weighted_scoring
    formula: |
      fy = Conference.current_fiscal_year
      unmet_rivalry_count = count of ProtectedRivalry rows with
          (member_a_id == Member.id or member_b_id == Member.id) and
          ( status == LAPSED
            or ( status == ACTIVE and
                 count of ScheduleGame rows with protected_rivalry_id == rivalry.id
                 and fiscal_year == fy and status in {SCHEDULED, PLAYED}
                 < rivalry.required_annual_meetings ) )
      if Member.travel_partner_member_id is null:
          travel_partner_gap_count = 0
      else:
          travel_partner_gap_count = count of ScheduleGame rows G with
              away_member_id == Member.id, fiscal_year == fy, status in {SCHEDULED, PLAYED},
              for which NO ScheduleGame row P exists with
                  away_member_id == Member.travel_partner_member_id,
                  venue_id == G.venue_id, fiscal_year == fy,
                  status in {SCHEDULED, PLAYED} and
                  abs(days_between(P.game_date, G.game_date)) <= TRAVEL_PAIR_WINDOW_DAYS
      home_game_count = count of ScheduleGame rows with home_member_id == Member.id,
                        fiscal_year == fy, status in {SCHEDULED, PLAYED}
      away_game_count = count of ScheduleGame rows with away_member_id == Member.id,
                        fiscal_year == fy, status in {SCHEDULED, PLAYED}
      schedule_compliance_score = max(0,
            100
          - RIVALRY_PENALTY         * unmet_rivalry_count
          - TRAVEL_PARTNER_PENALTY  * travel_partner_gap_count
          - HOME_IMBALANCE_PENALTY  * max(0, home_game_count - away_game_count - 1))
    input_set: "ScheduleGame rows in status SCHEDULED or PLAYED for Conference.current_fiscal_year only; CANCELLED games are excluded, which is what makes a cancellation lower the score"
    constants:
      RIVALRY_PENALTY: 15
      TRAVEL_PARTNER_PENALTY: 8
      HOME_IMBALANCE_PENALTY: 5
      TRAVEL_PAIR_WINDOW_DAYS: 3
      HOST_ELIGIBILITY_SCORE_MIN: 90
    precision: "integer score clamped at 0; a score below HOST_ELIGIBILITY_SCORE_MIN blocks championship-event creation and flips a SCHEDULED event to HOST_AT_RISK"

  - name: championship_event_settlement
    trigger: "on POST /championship-events/{id}/settle"
    algorithm: aggregation
    formula: |
      net_event_revenue_cents = ticket_revenue_cents + sponsorship_revenue_cents
                                - event_expense_cents
      host_share_cents        = ceil(net_event_revenue_cents * HOST_SHARE_BPS / 10000)
                                if net_event_revenue_cents > 0 else 0
      participant_pool_cents  = net_event_revenue_cents - host_share_cents
      linked RevenuePool.gross_revenue_cents += participant_pool_cents
    input_set: "the three revenue and expense amounts supplied on the settle call; the linked RevenuePool must be in status DRAFT, OPEN or BOOKS_CLOSED"
    constants:
      HOST_SHARE_BPS: 2000
    precision: "integer cents, ceil on the host share; when net_event_revenue_cents <= 0 the host share is 0 and the entire (possibly negative) net flows to the participant pool"

  - name: pool_reconciliation_identity
    trigger: "on POST /audit-reports/{id}/issue and on GET /distribution-runs/{id}/reconciliation"
    algorithm: aggregation
    formula: |
      lines = DistributionLine rows with distribution_run_id == run.id and status == ACTIVE
      total_net_payable_cents     = sum of lines.net_payable_cents
      total_withheld_cents        = sum of lines.withheld_cents
      total_governance_fee_cents  = sum of lines.governance_fee_cents
      total_gor_offset_cents      = sum of lines.gor_offset_cents
      reconciliation_delta_cents  = run.net_pool_cents
                                    - ( run.reserve_draw_cents
                                      + total_net_payable_cents
                                      + total_withheld_cents
                                      + total_governance_fee_cents
                                      + total_gor_offset_cents )
      # INVARIANT: reconciliation_delta_cents == 0 for every run whose lines are
      # all ACTIVE. Not a single cent of net_pool_cents may vanish into rounding:
      # the pinned remainder pass in distribution_share_allocation exists exactly
      # to conserve this quantity. Reversing a POSTED run must restore every
      # Conference-level counter it moved, leaving the identity intact.
    input_set: "DistributionLine rows with status == ACTIVE for the run under audit, enumerated in Member.created_at ASC order; VOIDED lines are excluded and a run whose lines are all VOIDED reconciles to net_pool_cents"
    constants: {}
    precision: "exact integer cents; any non-zero delta rejects the audit report with ERR_RECONCILIATION_IMBALANCE"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role == MemberRepresentative, X-User-ID equals the Member.id addressed by the path or named by the request body's member_id"
    error_id: ERR_NOT_MEMBER_OWNER
    http_status: 403
    applies_to: "PATCH /members/{id}, POST /members/{id}/entry-fee-payments, POST /members/{id}/bowl-appearances, POST /bowl-appearances/{id}/resubmit, POST /membership-actions/{id}/ballots, POST /budget-proposals/{id}/ballots"

  - priority: 5
    category: existence
    check: "exactly one Conference exists before any other write is accepted"
    error_id: ERR_CONFERENCE_NOT_INITIALIZED
    http_status: 409
    applies_to: "all writes except POST /conference and POST /_clock/set_current_utc"

  - priority: 6
    category: existence
    check: "no Conference row already exists"
    error_id: ERR_CONFERENCE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /conference"

  - priority: 8
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_REVENUE_POOL_NOT_FOUND | ERR_DISTRIBUTION_RUN_NOT_FOUND | ERR_BOWL_APPEARANCE_NOT_FOUND | ERR_MEMBERSHIP_ACTION_NOT_FOUND | ERR_BUDGET_PROPOSAL_NOT_FOUND | ERR_PROTECTED_RIVALRY_NOT_FOUND | ERR_SCHEDULE_GAME_NOT_FOUND | ERR_CHAMPIONSHIP_EVENT_NOT_FOUND | ERR_AUDIT_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 10
    category: business_constraint
    check: "every required input field is present, every enum value is declared, every *_cents and count field is a non-negative integer, and every datetime parses as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 11
    category: business_constraint
    check: "1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 12
    category: existence
    check: "every foreign key in the request body resolves to an existing row"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_REVENUE_POOL_NOT_FOUND | ERR_DISTRIBUTION_RUN_NOT_FOUND | ERR_PROTECTED_RIVALRY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /members, POST /revenue-pools, POST /membership-actions, POST /budget-proposals, POST /protected-rivalries, POST /schedule-games, POST /championship-events, POST /audit-reports, POST /membership-actions/{id}/ballots, POST /budget-proposals/{id}/ballots, PATCH /members/{id}"

  - priority: 14
    category: business_constraint
    check: "institution_code is not already used by another Member in this conference"
    error_id: ERR_DUPLICATE_INSTITUTION_CODE
    http_status: 409
    applies_to: "POST /members"

  - priority: 15
    category: business_constraint
    check: "paired member references are distinct - home_member_id != away_member_id, member_a_id != member_b_id, and travel_partner_member_id != the member's own id"
    error_id: ERR_MEMBER_PAIR_INVALID
    http_status: 422
    applies_to: "POST /schedule-games, POST /protected-rivalries, POST /members, PATCH /members/{id}"

  - priority: 16
    category: business_constraint
    check: "no other ACTIVE or LAPSED ProtectedRivalry already links the same unordered member pair in this conference"
    error_id: ERR_DUPLICATE_RIVALRY
    http_status: 409
    applies_to: "POST /protected-rivalries"

  - priority: 18
    category: state
    check: "the OCC version supplied in expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_POOL_VERSION | ERR_STALE_ACTION_VERSION | ERR_STALE_CONFERENCE_VERSION | ERR_STALE_MEMBER_VERSION"
    http_status: 412
    applies_to: "POST /revenue-pools/{id}/distribution-runs, POST /membership-actions/{id}/ballots, POST /conference/reserve-transfers, PATCH /members/{id}"

  - priority: 20
    category: state
    check: "admission_path == CHARTER is only accepted while Conference.governance_status == FORMING"
    error_id: ERR_CHARTER_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /members"

  - priority: 22
    category: state
    check: "the addressed RevenuePool is in the status the operation requires - DRAFT for open, OPEN for close-books and for a PROVISIONAL run, BOOKS_CLOSED for reopen, close and a FINAL_AUDITED run"
    error_id: ERR_POOL_STATE_INVALID
    http_status: 409
    applies_to: "POST /revenue-pools/{id}/open, POST /revenue-pools/{id}/close-books, POST /revenue-pools/{id}/reopen, POST /revenue-pools/{id}/close, POST /revenue-pools/{id}/distribution-runs"

  - priority: 23
    category: state
    check: "the addressed DistributionRun is in the status the operation requires - COMPUTED for post, POSTED for reverse"
    error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /distribution-runs/{id}/post, POST /distribution-runs/{id}/reverse, POST /audit-reports"

  - priority: 24
    category: state
    check: "the addressed BowlAppearance is in the status the operation requires - SUBMITTED for begin-review, UNDER_REVIEW for request-revision and approve, REVISION_REQUESTED for resubmit, and any non-VOIDED status for void"
    error_id: ERR_APPEARANCE_STATE_INVALID
    http_status: 409
    applies_to: "POST /bowl-appearances/{id}/begin-review, POST /bowl-appearances/{id}/request-revision, POST /bowl-appearances/{id}/resubmit, POST /bowl-appearances/{id}/approve, POST /bowl-appearances/{id}/void"

  - priority: 25
    category: state
    check: "the addressed MembershipAction is in the status the operation requires - PROPOSED for open-voting and withdraw, VOTING for ballots, amend and close-voting, APPROVED for execute"
    error_id: ERR_ACTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /membership-actions/{id}/open-voting, POST /membership-actions/{id}/withdraw, POST /membership-actions/{id}/ballots, POST /membership-actions/{id}/amend, POST /membership-actions/{id}/close-voting, POST /membership-actions/{id}/execute"

  - priority: 26
    category: state
    check: "the addressed BudgetProposal is in the status the operation requires - DRAFT for open-voting, VOTING for ballots and close-voting"
    error_id: ERR_PROPOSAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /budget-proposals/{id}/open-voting, POST /budget-proposals/{id}/ballots, POST /budget-proposals/{id}/close-voting"

  - priority: 27
    category: state
    check: "the addressed ScheduleGame is in status SCHEDULED"
    error_id: ERR_GAME_STATE_INVALID
    http_status: 409
    applies_to: "POST /schedule-games/{id}/play, POST /schedule-games/{id}/cancel"

  - priority: 28
    category: state
    check: "the addressed ChampionshipEvent is in the status the operation requires - SCHEDULED or HOST_AT_RISK for host and cancel, HOSTED for settle"
    error_id: ERR_EVENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /championship-events/{id}/host, POST /championship-events/{id}/settle, POST /championship-events/{id}/cancel"

  - priority: 29
    category: state
    check: "the addressed AuditReport is in the status the operation requires - DRAFT for issue, ISSUED for accept"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /audit-reports/{id}/issue, POST /audit-reports/{id}/accept"

  - priority: 30
    category: state
    check: "the addressed Member is in the status the operation requires - ADMITTED_PHASING for phase-advance, FULL_SHARE for withdrawal-notice, WITHDRAWAL_NOTICED for rescind, PETITIONED for an entry-fee payment, and not DEPARTED or ADMISSION_DENIED for any other write"
    error_id: ERR_MEMBER_STATE_INVALID
    http_status: 409
    applies_to: "POST /members/{id}/phase-advance, POST /members/{id}/withdrawal-notice, POST /members/{id}/withdrawal-notice/rescind, POST /members/{id}/entry-fee-payments, PATCH /members/{id}, POST /members/{id}/bowl-appearances, POST /schedule-games, POST /membership-actions"

  - priority: 31
    category: business_constraint
    check: "MembershipAction.amend_count < AMEND_LIMIT"
    error_id: ERR_AMEND_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /membership-actions/{id}/amend"

  - priority: 33
    category: business_safety
    check: "the acting X-User-ID differs from the user who performed the preceding step - the DistributionRun.computed_by_user_id when posting, the MembershipAction.proposed_by_user_id when closing voting, and the DistributionRun.computed_by_user_id when issuing the audit report"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /distribution-runs/{id}/post, POST /membership-actions/{id}/close-voting, POST /audit-reports/{id}/issue"

  - priority: 35
    category: business_safety
    check: "no PostseasonUnit of the appearance is referenced by a DistributionLine whose parent DistributionRun is POSTED"
    error_id: ERR_UNITS_ALREADY_DISTRIBUTED
    http_status: 409
    applies_to: "POST /bowl-appearances/{id}/void"

  - priority: 38
    category: business_temporal
    check: "neither participant already has a ScheduleGame in status SCHEDULED or PLAYED whose game_date is fewer than REST_BUFFER_DAYS calendar days from the requested game_date; a gap of exactly REST_BUFFER_DAYS is accepted"
    error_id: ERR_MEMBER_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /schedule-games"

  - priority: 39
    category: business_temporal
    check: "the count of ChampionshipEvent rows on the same venue in status SCHEDULED, HOST_AT_RISK or HOSTED whose half-open window [window_start, window_end) intersects the requested half-open window is strictly less than Venue.concurrent_event_capacity; a window that starts exactly at another's window_end does not intersect"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /championship-events"

  - priority: 40
    category: business_temporal
    check: "withdrawal_effective_fiscal_year is strictly greater than Conference.current_fiscal_year"
    error_id: ERR_INVALID_EFFECTIVE_YEAR
    http_status: 422
    applies_to: "POST /members/{id}/withdrawal-notice"

  - priority: 42
    category: business_constraint
    check: "venue_id equals the home member's home_venue_id"
    error_id: ERR_VENUE_NOT_HOME_VENUE
    http_status: 422
    applies_to: "POST /schedule-games"

  - priority: 44
    category: business_constraint
    check: "window_end is strictly after window_start"
    error_id: ERR_INVALID_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /championship-events"

  - priority: 46
    category: business_constraint
    check: "the voting member has voting_weight_bps > 0"
    error_id: ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE
    http_status: 409
    applies_to: "POST /membership-actions/{id}/ballots, POST /budget-proposals/{id}/ballots"

  - priority: 47
    category: business_constraint
    check: "the member has no existing Ballot in status CAST on this membership action or budget proposal"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /membership-actions/{id}/ballots, POST /budget-proposals/{id}/ballots"

  - priority: 52
    category: business_referential
    check: "an ADMIT MembershipAction requires a BudgetProposal in status APPROVED for Conference.current_fiscal_year"
    error_id: ERR_NO_APPROVED_BUDGET
    http_status: 409
    applies_to: "POST /membership-actions"

  - priority: 54
    category: business_referential
    check: "every BowlAppearance with fiscal_year == RevenuePool.fiscal_year is in status APPROVED or VOIDED"
    error_id: ERR_BOWL_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /revenue-pools/{id}/close-books"

  - priority: 56
    category: business_referential
    check: "a FINAL_AUDITED DistributionRun may only be posted when an AuditReport for that run is in status ISSUED"
    error_id: ERR_AUDIT_REPORT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /distribution-runs/{id}/post"

  - priority: 57
    category: business_referential
    check: "the host member's schedule_compliance_score is at least HOST_ELIGIBILITY_SCORE_MIN"
    error_id: ERR_HOST_COMPLIANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /championship-events"

  - priority: 58
    category: business_referential
    check: "the ChampionshipEvent's linked RevenuePool is in status DRAFT, OPEN or BOOKS_CLOSED so it can still absorb restated revenue"
    error_id: ERR_POOL_CLOSED_TO_REVENUE
    http_status: 409
    applies_to: "POST /championship-events/{id}/settle"

  - priority: 59
    category: business_referential
    check: "the run's reconciliation_delta_cents is exactly 0"
    error_id: ERR_RECONCILIATION_IMBALANCE
    http_status: 422
    applies_to: "POST /audit-reports/{id}/issue"

  - priority: 62
    category: business_fiscal
    check: "Conference.reserve_posture is not FROZEN"
    error_id: ERR_RESERVE_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /revenue-pools/{id}/distribution-runs, POST /championship-events"

  - priority: 64
    category: business_fiscal
    check: "a FINAL_AUDITED run requires RevenuePool.audited_expense_cents to be set"
    error_id: ERR_AUDITED_EXPENSE_MISSING
    http_status: 409
    applies_to: "POST /revenue-pools/{id}/distribution-runs"

  - priority: 66
    category: business_fiscal
    check: "total_weight_bps over the eligible member set is strictly greater than 0"
    error_id: ERR_EMPTY_ALLOCATION_BASIS
    http_status: 422
    applies_to: "POST /revenue-pools/{id}/distribution-runs"

  - priority: 68
    category: business_fiscal
    check: "Member.entry_fee_paid_cents >= Member.entry_fee_cents"
    error_id: ERR_ENTRY_FEE_OUTSTANDING
    http_status: 402
    applies_to: "POST /members/{id}/phase-advance"

  - priority: 69
    category: business_fiscal
    check: "entry_fee_paid_cents + amount_cents <= Member.entry_fee_cents"
    error_id: ERR_ENTRY_FEE_OVERPAYMENT
    http_status: 422
    applies_to: "POST /members/{id}/entry-fee-payments"

  - priority: 70
    category: business_fiscal
    check: "a WITHDRAWAL transfer amount does not exceed Conference.reserve_balance_cents"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /conference/reserve-transfers"

# =====================================================================
# §1.5 Endpoint Inventory
# api_prefix is the empty string, so every path below is the full path.
# Optional input fields are marked with a trailing '?'.
# =====================================================================
endpoints:

  # ---------------- logical clock ----------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the deterministic logical clock. The default logical clock is 2026-08-01T00:00:00Z; every test that depends on a date sets it explicitly first."
    roles: [PlatformAdmin]
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects:
      - "all subsequent server-side reads of the current instant return to_iso8601"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---------------- conference ----------------
  - method: POST
    path: /conference
    description: "Initialise the single conference office record in governance_status FORMING."
    roles: [PlatformAdmin]
    input: ["name", "fiscal_year_start_month?", "current_fiscal_year?", "unit_value_cents?", "phase_schedule_years?"]
    output: Conference
    side_effects:
      - "creates the Conference with governance_status FORMING, reserve_balance_cents 0, reserve_target_cents 0, reserve_posture OPEN, escrow_balance_cents 0, validated_postseason_unit_count 0, version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CONFERENCE_ALREADY_EXISTS]

  - method: GET
    path: /conference
    description: "Read the conference record including its reserve posture and OCC version."
    roles: [Commissioner, FinanceOfficer, Treasurer, Auditor, ComplianceOfficer, ScheduleCoordinator, PlatformAdmin, MemberRepresentative]
    input: []
    output: Conference
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED]

  - method: POST
