  - rule_id: resource_temporal_overlap
    instances:
      - name: construction_windows_touch_is_allowed_overlap_by_one_second_is_not_and_the_recheck_bites_at_decision
        grounds:
          - validations.priority_10_interval_overlap
          - errors.ERR_INTERVAL_OVERLAP
          - state_machines.AlterationRequest.SUBMITTED_to_APPROVED
          - state_machines.AlterationRequest.APPROVED_to_APPROVAL_REVOKED
          - entities.Lease.fields.gfa_allocated_sqft
        distinguishing_aspect: |
          The site is the contested resource and the window is half-open, so an end that equals the next
          start is legal while a one-second bite is not. The rule is enforced at two different moments
          against two different populations: at creation against already-APPROVED windows, and again at
          decision time - two mutually overlapping requests can both be created while both are SUBMITTED,
          and only the second approval is refused. Revoking the first approval releases the window and the
