            - "Auto-citation exists with rule_code == LATE_STATUS, source == AUTO_LATE_STATUS, fine_amount_cents == 25000 (hop 1)"
            - "withdraw attempt rejected error_id == ERR_LISTING_FLAGGED (hop 2: flag gates withdrawal)"
            - "After citation pay: Listing.${listing_id}.accuracy_flag == CLEAN (hop 3: citation -> listing unflag) and status still PENDING"
            - "Member.${mb_id}.sanction_credit_balance_cents == 25000 (fine accrued as credit)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: screening_overdue_loses_to_screener_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_SCREENING_CONFLICT]
          - errors[ERR_SCREENING_OVERDUE]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 7) vs business_temporal
          (priority 9): the complainant themself attempts to screen their own case
          AFTER the 45-day grievance deadline — both ERR_SCREENING_CONFLICT and
          ERR_SCREENING_OVERDUE fire, and the safety error must win.
        test_recipe:
          setup:
            - "Association A; members MC (complainant), MR (respondent); EthicsCase E filed by MC at 2026-09-10 (grievance_review_due_at = 2026-10-25)"
            - "Clock advanced to 2026-10-26 (screening overdue)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "PV1", name: "Priority Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MC", full_name: "Complainant" }
              as: AssociationStaff
              captures: { mc_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MR", full_name: "Respondent" }
              as: AssociationStaff
              captures: { mr_id: $.data.id }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/ethics-cases"
              payload: { respondent_member_id: "${mr_id}", article_code: "A16" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { case_id: $.data.id, due_at: $.data.grievance_review_due_at }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-26T00:00:00Z" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${assoc_id}/ethics-cases/${case_id}/screen"
              payload: { outcome: "FORWARDED" }
              as: GrievanceMember
              as_user_id: "${mc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCREENING_CONFLICT (priority 7 business_safety beats priority 9 business_temporal)"
            - "error_id != ERR_SCREENING_OVERDUE despite clock being past grievance_review_due_at"
            - "EthicsCase.${case_id}.status == GRIEVANCE_SCREENING (unchanged)"
      - name: stale_version_loses_to_not_found_but_beats_comp_prohibition
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_COMP_DISPLAY_PROHIBITED]
        distinguishing_aspect: |
          Error-category pair business_constraint-OCC (priority 5) vs
          business_constraint-policy (priority 8) — different pair from instance 1:
          activating a listing with offer_comp_cents > 0 under COMP_DISPLAY_OFF
          while ALSO passing a stale expected_association_version on a concurrent
          policy-revision create are tested separately: (i) policy-revision POST
          with stale version AND invalid enum-free payload still yields
          ERR_STALE_VERSION (OCC before any business check), and (ii) listing
          activation with offer_comp under OFF yields ERR_COMP_DISPLAY_PROHIBITED
          — but a listing in WRONG state (already SOLD) with offer_comp > 0 under
          OFF yields ERR_INVALID_STATE (priority 6 beats priority 8).
        test_recipe:
          setup:
            - "Association A; broker+agent MB; office O; revision R1 COMP_DISPLAY_ON active; second revision R2 COMP_DISPLAY_OFF activated (association.version advanced to 3 by the two revision creates)"
            - "Listing L1 ACTIVE with offer_comp_cents = 0; listing L2 SOLD; listing L3 DRAFT with offer_comp_cents = 500000 created BEFORE R2 activated (draft holds the input; prohibition checked at activation)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "PV2", name: "Priority Two", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
              captures: { assoc_v_after_r1: $.data.version }
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-P2A", property_address: "1 Prio Pl", list_price_cents: 20000000, offer_comp_cents: 500000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing3_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-P2B", property_address: "2 Prio Pl", list_price_cents: 20000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing2_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing2_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing2_id}/status"
              payload: { to_status: "PENDING", business_effective_at: "2026-09-02T00:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing2_id}/status"
              payload: { to_status: "SOLD", business_effective_at: "2026-09-02T01:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R2", effective_at: "2026-09-05T00:00:00Z", comp_display_mode: "COMP_DISPLAY_OFF", expected_association_version: "${assoc_v_after_r1}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R3", effective_at: "2026-09-20T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v_after_r1} - 1" }
              as: AssociationStaff
              captures: { stale_err: $.data.error_id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing3_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
              captures: { comp_err: $.data.error_id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing2_id}/status"
              payload: { to_status: "WITHDRAWN", business_effective_at: "2026-09-05T00:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { state_err: $.data.error_id }
          assert:
            - "stale_err == ERR_STALE_VERSION (priority 5 OCC beats any business check on the revision create; association.version advanced past the stale value by R2's create)"
            - "comp_err == ERR_COMP_DISPLAY_PROHIBITED (priority 8: offer_comp_cents 500000 > 0 under COMP_DISPLAY_OFF at activation)"
            - "state_err == ERR_INVALID_STATE (priority 6 beats priority 8: SOLD listing cannot transition at all, flag/policy checks never reached)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: status_change_48h_boundary_exact
        grounds:
          - calculations.status_change_lateness
          - entities.StatusChange.fields.late_by_hours
          - errors[ERR_LISTING_FLAGGED]
        distinguishing_aspect: |
          Numeric-threshold metric on the /status endpoint: a change recorded
          exactly 48h00m00s after the business event is TIMELY (late_by_hours 0,
          no citation, flag stays CLEAN); one hour later (49h) flips to
          late_by_hours 1 with auto-citation and FLAGGED — the >= vs > boundary
          sits on the lateness metric reached via POST .../listings/{id}/status.
        test_recipe:
          setup:
            - "Association A; FineSchedule LATE_STATUS 25000c from 2026-01-01; broker+agent MB; office O; COMP_DISPLAY_ON revision active"
            - "Listing LA ACTIVE; business event at 2026-09-03T00:00:00Z; clock at exactly 2026-09-05T00:00:00Z (48h00m later)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "BP1", name: "Boundary Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/fine-schedules"
              payload: { rule_code: "LATE_STATUS", fine_amount_cents: 25000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-B48A", property_address: "48 Boundary Way", list_price_cents: 30000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing_a_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_a_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-B49A", property_address: "49 Boundary Way", list_price_cents: 30000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing_b_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_b_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_a_id}/status"
              payload: { to_status: "PENDING", business_effective_at: "2026-09-03T00:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T01:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_b_id}/status"
              payload: { to_status: "PENDING", business_effective_at: "2026-09-03T00:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
