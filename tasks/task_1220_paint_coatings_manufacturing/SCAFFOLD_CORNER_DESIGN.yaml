      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Authentication is priority 1: a call without X-User-Role is rejected with 401 ERR_UNAUTHENTICATED even when the referenced resource does not exist (auth beats existence, priority 4)."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "GET /coatings/mills/11111111-2222-3333-4444-555555555555", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED and HTTP 401 (not ERR_NOT_FOUND — priority ordering 1 < 4)"

      - name: existence_beats_state_on_missing_order_cancel
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "Cancelling a non-existent order returns 404 ERR_NOT_FOUND (existence, priority 4), not a state error — even though cancel is a state-transition endpoint."
        test_recipe:
          setup: ["empty DB; clock default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /coatings/orders/11111111-2222-3333-4444-555555555555/cancel", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP 404"

      - name: order_batch_mismatch_on_schedule_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ORDER_BATCH_MISMATCH]"]
        distinguishing_aspect: "Scheduling validates referential integrity between order and batch: a batch created for order O1 cannot schedule order O2."
        test_recipe:
          setup: ["F1 ACTIVE; M1; CU1; orders O1 and O2 PLACED; batch B1 created with order_id O1 (PLANNED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/customers"
              payload: { name: "Sunbelt Paints AZ", home_state_code: "AZ", annual_credit_cap_cents: 50000 }
              as: PlantManager
              captures: { cu1: $.data.id }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu1}", destination_state_code: "AZ", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 3, size_code: "GALLON" } ] }
              as: Dealer
              as_user_id: "${cu1}"
              captures: { o1: $.data.id }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu1}", destination_state_code: "AZ", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 5, size_code: "GALLON" } ] }
              as: Dealer
              as_user_id: "${cu1}"
              captures: { o2: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z", order_id: "${o1}" }
              as: ProductionOperator
              captures: { b1: $.data.id }
          trigger:
            - { call: "POST /coatings/orders/${o2}/schedule", payload: { batch_id: "${b1}" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ORDER_BATCH_MISMATCH (batch ${b1}.order_id == ${o1} != ${o2})"
            - "SalesOrder.${o2}.status stays PLACED"

      - name: mill_capacity_exact_boundary
        claim_type: boundary
        grounds: ["validations[priority=10]", "errors[ERR_MILL_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Capacity check is inclusive at the limit: planned_gallons exactly equal to capacity_gallons (200) is accepted; 201 is rejected with ERR_MILL_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["F1 ACTIVE; M1 capacity 200"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
          trigger:
            - { call: "POST /coatings/batches", payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 200, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }, as: ProductionOperator, captures: { b_ok: $.data.id } }
            - { call: "POST /coatings/batches", payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 201, mill_window_start: "2026-06-11T08:00:00Z", mill_window_end: "2026-06-11T12:00:00Z" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "Batch.${b_ok}.status == PLANNED (200 == capacity, allowed)"
            - "err == ERR_MILL_CAPACITY_EXCEEDED (201 > 200)"

      - name: claim_window_inclusive_30_day_boundary
        claim_type: boundary
        grounds: [calculations.claim_window, "errors[ERR_CLAIM_WINDOW_EXPIRED]"]
        distinguishing_aspect: "The 30-day claim window is inclusive to the second: a claim exactly 30 days after shipped_at is created; one second later is ERR_CLAIM_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Full chain: CU1; 3-gal batch with cans K1, K2 shipped 2026-06-15T09:00:00Z to AZ order"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
