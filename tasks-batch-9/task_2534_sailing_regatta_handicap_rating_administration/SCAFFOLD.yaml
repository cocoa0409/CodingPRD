scenario: |
  Generate task harder than expert level!

  2534. Sailing Regatta & Handicap Rating Administration (yacht club racing committee): boat rating certificate issuance with measurement data and rating rule selection, class and division assignment by rating band and boat type with fleet minimums, notice of race and sailing instructions publication with amendment procedures, course selection, start sequence and recall procedures with individual and general recall rules, scoring systems including corrected time calculation and discard rules across a series, protest hearings with jury composition, evidence and penalty decisions, safety requirements, crew registration and equipment inspection, race committee volunteer staffing and mark boat logistics
domain_name: sailing-regatta-handicap-administration
api_prefix: "/regatta-ops"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # flat: 14 peer entities linked exclusively by FK fields carried in request
  # bodies. No entity is nested inside another entity's URL path: every
  # collection lives directly under /regatta-ops/<collection>, and every
  # parent -> child traversal happens through a filtered list endpoint
  # (GET /regatta-ops/entries?division_id=..., GET /regatta-ops/race-results?race_id=...).
  # The only sub-path segments that exist are action verbs on a single
  # resource (/entries/{id}/accept) and one computed read
  # (/entries/{id}/series-standing) — never a child collection.

  state_machine_shape: cyclic
  # RatingCertificate cycles ISSUED -> SUSPENDED -> ISSUED (measurement
  # re-verification loop); Race cycles SEQUENCE_STARTED -> GENERAL_RECALLED ->
  # SEQUENCE_STARTED (restart loop, with a black-flag threshold that changes
  # the semantics of the third attempt); Protest cycles DECIDED -> REOPENED ->
  # HEARING_SCHEDULED -> HEARD -> DECIDED (rehearing loop, capped at one
  # reopen). Entry additionally carries two independent state dimensions on
  # the same row (registration_status x inspection_status) that advance
  # without gating each other, and Regatta/Division are compound machines
  # whose state is re-derived from child counts.

  relationship_patterns:
    - one_to_many        # Regatta -> Division/Entry/Race/Protest/DutyAssignment/RaceDocument/MarkBoat
    - self_referential   # RatingCertificate.supersedes_certificate_id, Division.merged_into_division_id, RaceDocument.amends_document_id
    - cross_aggregate    # Entry.certificate_id pins a RatingCertificate owned by the boat registry, not by the regatta
    - polymorphic_free   # no polymorphic FK: every FK names exactly one target entity

  role_model: segregation_of_duties
  # A member seated on the jury panel of a regatta may not be the helm of an
  # entry in that regatta, may not hold a CONFIRMED PRO duty assignment for
  # that regatta, and the Measurer who signed an entry's pinned certificate
  # may not be the panel chair hearing a protest that targets that entry.

  consistency_model: immediate
  # Every cascade in this scaffold completes inside the triggering request:
  # certificate suspension re-derives entry status, division counts, and race
  # start-blocking in the same transaction; scoring a race re-derives every
  # series standing in the regatta before the response is emitted.

  difficulty_level: beyond_expert
  # 14 entities, 70 endpoints, 34 error codes, 8 calculations (3 dual-variant
  # or order-pinned), 8 state machines (3 cyclic, 1 with independent
  # dimensions, 2 compound), 2 OCC races, 3 temporal-overlap geometries.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Regatta
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Regatta title as printed on the notice of race"
        constraints: "1..120 chars, non-blank"
      - name: host_club_name
        type: string
        source: input
        description: "Organizing authority (yacht club) running the event"
      - name: scoring_system
        type: enum
        source: input
        description: "Series scoring system applied to every race of this regatta"
        constraints: "one of LOW_POINT, BONUS_POINT"
      - name: discard_policy
        type: enum
        source: input
        default: NONE
        description: "Series discard rule, consumed by calculations.series_standing"
        constraints: "one of NONE, ONE_PER_FIVE, ONE_PER_FOUR"
      - name: handicap_basis
        type: enum
        source: input
        default: PER_CERTIFICATE
        description: "Selects which corrected_time variant applies to every RaceResult of this regatta"
        constraints: "one of PER_CERTIFICATE, UNIFIED_TOD"
      - name: planned_race_count
        type: integer
        source: input
        description: "Number of races scheduled for the series; drives the auto SCORED transition"
        constraints: ">= 1 and <= 20"
      - name: fleet_minimum
        type: integer
        source: input
        default: 3
        description: "Regatta-wide floor on assigned entries per division at confirmation time"
        constraints: ">= 2 and <= 20"
      - name: protest_time_limit_minutes
        type: integer
        source: input
        default: 90
        description: "Minutes after Race.results_closed_utc during which a protest may be filed"
        constraints: ">= 15 and <= 480"
      - name: jury_quorum_required
        type: integer
        source: input
        default: 3
        description: "Non-recused seated members (chair included) a JuryPanel needs to reach SEATED"
        constraints: ">= 2 and <= 7"
      - name: safety_category
        type: enum
        source: input
        description: "Offshore safety category; CAT_3 and CAT_2 additionally require a SAFETY_BOAT on station"
        constraints: "one of CAT_4, CAT_3, CAT_2"
      - name: series_start_utc
        type: datetime
        source: input
        description: "First scheduled warning signal of the series; certificate validity and crew safety-course validity are tested against this instant"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Compound lifecycle state re-derived from documents, divisions and scored races"
        constraints: "one of DRAFT, NOR_PUBLISHED, SI_PUBLISHED, RACING, SCORED"
      - name: nor_revision
        type: integer
        source: computed
        default: 0
        description: "Highest revision among RaceDocument rows with doc_type NOR for this regatta"
      - name: si_revision
        type: integer
        source: computed
        default: 0
        description: "Highest revision among RaceDocument rows with doc_type SI for this regatta"
      - name: confirmed_division_count
        type: integer
        source: computed
        default: 0
        description: "Count of Division rows with regatta_id equal to this row and status CONFIRMED"
      - name: final_race_count
        type: integer
        source: computed
        default: 0
        description: "Count of Race rows for this regatta with scoring_status FINAL and voided_race false semantics (start_status not ABANDONED)"

  - name: ClubMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Member legal name"
      - name: email
        type: string
        source: input
        description: "Login handle; unique across all ClubMember rows"
        constraints: "case-insensitive unique, must contain @"
      - name: measurer_license_id
        type: string
        source: input
        default: null
        description: "Non-null licence number required to act as Measurer"
      - name: judge_certification_level
        type: enum
        source: input
        default: NONE
        description: "Judging qualification; REGIONAL or above may chair a jury panel"
        constraints: "one of NONE, CLUB, REGIONAL, NATIONAL, INTERNATIONAL"
      - name: safety_course_expiry_utc
        type: datetime
        source: input
        default: null
        description: "Expiry of the member sea-survival course; tested when the member is added to a crew manifest"
      - name: assigned_duty_minutes
        type: integer
        source: computed
        default: 0
        description: "Duty-minutes ledger, equal to the summed window length of this member DutyAssignment rows with status in PROPOSED or CONFIRMED"

  - name: Boat
    parent: null
    common_fields: true
    fields:
      - name: sail_number
        type: string
        source: input
        description: "Sail number carried on the mainsail; unique across all Boat rows"
        constraints: "case-insensitive unique, 3..12 chars"
      - name: boat_name
        type: string
        source: input
        description: "Boat name"
      - name: owner_member_id
        type: string
        source: input
        description: "FK -> ClubMember.id; owner of record who may submit entries for this boat"
      - name: boat_type
        type: enum
        source: input
        description: "Hull family; drives the rating type multiplier and division boat_type_filter matching"
        constraints: "one of MONOHULL, MULTIHULL, KEELBOAT_SPORT"
      - name: loa_meters
        type: number
        source: input
        description: "Length overall in metres, declared by the owner (documentation only, never an input to any rating formula)"
        constraints: "> 0 and <= 40"

  - name: RatingCertificate
    parent: null
    common_fields: true
    fields:
      - name: boat_id
        type: string
        source: input
        description: "FK -> Boat.id; the measured boat"
      - name: rule_code
        type: enum
        source: input
        description: "Rating rule selected at measurement time; fixes which rating_value scale is minted"
        constraints: "one of TOD_PHRF, TOT_ORC"
      - name: sail_area_m2
        type: number
        source: input
        description: "Measured upwind sail area in square metres"
        constraints: "> 0 and <= 400"
      - name: hull_length_m
        type: number
        source: input
        description: "Measured hull length in metres"
        constraints: "> 0 and <= 40"
      - name: displacement_kg
        type: number
        source: input
        description: "Measured displacement in kilograms"
        constraints: "> 0 and <= 100000"
      - name: draft_m
        type: number
        source: input
        description: "Measured maximum draft in metres; above 2.20 attracts the deep-draft penalty"
        constraints: "> 0 and <= 6"
      - name: measured_by_member_id
        type: string
        source: system
        description: "FK -> ClubMember.id; X-User-ID of the Measurer who created the certificate"
      - name: raw_speed_index
        type: number
        source: computed
        description: "Intermediate speed index from calculations.certificate_rating_value, rounded HALF_UP to 4 decimals before the rule branch"
      - name: rating_value
        type: number
        source: computed
        description: "Rule-scaled handicap: seconds-per-mile allowance when rule_code is TOD_PHRF, time-correction factor when rule_code is TOT_ORC"
      - name: band_key_spm
        type: number
        source: computed
        description: "Always-TOD-scale seconds-per-mile projection of rating_value, used as the sole key for division rating-band matching"
      - name: valid_from
        type: datetime
        source: input
        description: "Start of the certificate validity window (inclusive)"
      - name: valid_until
        type: datetime
        source: input
        description: "End of the certificate validity window (inclusive)"
        constraints: "must be strictly after valid_from"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Certificate lifecycle state"
        constraints: "one of DRAFT, ISSUED, SUSPENDED, SUPERSEDED"
      - name: suspension_reason_code
        type: string
        source: input
        default: null
        description: "Reason code recorded by the suspend action, cleared to null on reinstate"
      - name: supersedes_certificate_id
        type: string
        source: system
        default: null
        description: "FK -> RatingCertificate.id; the previously ISSUED certificate of the same boat that this row displaced at issue time"

  - name: Division
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta this division belongs to"
      - name: code
        type: string
        source: input
        description: "Division letter or class code as printed in the sailing instructions"
        constraints: "unique per regatta_id, 1..8 chars"
      - name: boat_type_filter
        type: enum
        source: input
        description: "Hull family this division accepts; ANY accepts every boat_type"
        constraints: "one of MONOHULL, MULTIHULL, KEELBOAT_SPORT, ANY"
      - name: rating_band_low
        type: number
        source: input
        description: "Inclusive lower bound of the accepted RatingCertificate.band_key_spm range"
      - name: rating_band_high
        type: number
        source: input
        description: "EXCLUSIVE upper bound of the accepted RatingCertificate.band_key_spm range"
        constraints: "must be strictly greater than rating_band_low"
      - name: min_entries
        type: integer
        source: input
        default: 3
        description: "Division-level fleet minimum; the effective floor at confirmation is max(min_entries, Regatta.fleet_minimum)"
        constraints: ">= 2 and <= 20"
      - name: status
        type: enum
        source: system
        default: PROVISIONAL
        description: "PROVISIONAL until confirmed; MERGED once absorbed by another division"
        constraints: "one of PROVISIONAL, CONFIRMED, MERGED"
      - name: merged_into_division_id
        type: string
        source: system
        default: null
        description: "FK -> Division.id; absorbing division selected by calculations.division_merge_target_selection, null unless status is MERGED"
      - name: assigned_entry_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry rows with division_id equal to this row and registration_status in SUBMITTED or ACCEPTED"
      - name: accepted_entry_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry rows with division_id equal to this row and registration_status exactly ACCEPTED; this is the N_div used by calculations.race_points_and_places"

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta being entered"
      - name: boat_id
        type: string
        source: input
        description: "FK -> Boat.id; the boat being entered"
      - name: certificate_id
        type: string
        source: input
        description: "FK -> RatingCertificate.id; certificate pinned at submission time and never re-pointed, so a later supersede leaves this entry on the old certificate"
      - name: helm_member_id
        type: string
        source: input
        description: "FK -> ClubMember.id; person steering, who must also appear in crew_manifest with position HELM"
      - name: division_id
        type: string
        source: system
        default: null
        description: "FK -> Division.id; assigned by the division selector, null until assign-division runs"
      - name: declared_crew_count
        type: integer
        source: input
        description: "Crew size declared on the entry form, including the helm"
        constraints: ">= 1 and <= 20"
      - name: crew_manifest
        type: array
        source: input
        default: []
        description: "Append-only-by-endpoint list of objects {member_id (a ClubMember.id), position, weight_kg} maintained by POST and DELETE /entries/{id}/crew"
        constraints: "at most one element with position HELM; member_id unique within the array; position in HELM, TACTICIAN, TRIM, BOW, FLOATER"
      - name: registered_crew_count
        type: integer
        source: computed
        default: 0
        description: "Length of crew_manifest"
      - name: crew_weight_kg
        type: number
        source: computed
        default: 0
        description: "Sum of crew_manifest weight_kg values, rounded HALF_UP to 1 decimal"
      - name: registration_status
        type: enum
        source: system
        default: SUBMITTED
        description: "First independent state dimension: paperwork lifecycle of the entry"
        constraints: "one of SUBMITTED, ACCEPTED, RATING_INVALID, WITHDRAWN"
      - name: inspection_status
        type: enum
        source: system
        default: NOT_INSPECTED
        description: "Second independent state dimension: equipment inspection outcome, advanced only by POST /entries/{id}/inspect"
        constraints: "one of NOT_INSPECTED, PASSED, FAILED"
      - name: equipment_deficiency_code
        type: string
        source: input
        default: null
        description: "Deficiency recorded by a FAILED inspection, cleared to null when a later inspection PASSES"
      - name: series_points_gross
        type: number
        source: computed
        default: 0
        description: "Sum of RaceResult.points over this entry non-voided results in races with scoring_status FINAL, per calculations.series_standing"
      - name: series_points_net
        type: number
        source: computed
        default: 0
        description: "series_points_gross minus the discarded results, per calculations.series_standing"
      - name: discarded_race_numbers
        type: array
        source: computed
        default: []
        description: "Race.race_number values whose points were discarded from series_points_net, ascending"
      - name: series_rank
        type: integer
        source: computed
        default: null
        description: "1-based rank within the entry division by calculations.series_standing ranking, null while the division has zero FINAL races"

  - name: Race
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta this race belongs to"
      - name: race_number
        type: integer
        source: input
        description: "Series race number as printed in the sailing instructions"
        constraints: "unique per regatta_id, >= 1 and <= 20"
      - name: course_code
        type: enum
        source: input
        description: "Selected course; WINDWARD_LEEWARD and TRIANGLE require a MARK_BOAT_DRIVER on station"
        constraints: "one of WINDWARD_LEEWARD, TRIANGLE, DISTANCE_COASTAL"
      - name: course_distance_nm
        type: number
        source: input
        description: "Sailed distance in nautical miles, the multiplier of the time-on-distance allowance"
        constraints: "> 0 and <= 300"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Scheduled warning-signal instant; the prestart occupancy window of the start line is [scheduled_start_utc - 5 min, scheduled_start_utc]"
      - name: actual_start_utc
        type: datetime
        source: system
        default: null
        description: "Instant recorded by POST /races/{id}/start, null until the fleet is away"
      - name: start_status
        type: enum
        source: system
        default: PENDING
        description: "Start-line dimension of the race lifecycle, including the recall loop"
        constraints: "one of PENDING, SEQUENCE_STARTED, GENERAL_RECALLED, STARTED, ABANDONED"
      - name: scoring_status
        type: enum
        source: system
        default: NOT_SCORED
        description: "Scoring dimension of the race lifecycle, advanced by result entry and by POST /races/{id}/score"
        constraints: "one of NOT_SCORED, PROVISIONAL, FINAL"
      - name: general_recall_count
        type: integer
        source: computed
        default: 0
        description: "Count of RecallEvent rows for this race with recall_type GENERAL"
      - name: black_flag_active
        type: boolean
        source: computed
        default: false
        description: "True once general_recall_count >= 2; makes every OCS result of the next attempt non-discardable"
      - name: staffing_ready
        type: boolean
        source: computed
        default: false
        description: "Latest evaluation of calculations.race_staffing_readiness, refreshed on POST /races/{id}/start-sequence"
      - name: staffed_position_codes
        type: array
        source: computed
        default: []
        description: "Sorted distinct DutyAssignment.position values counted as on station by calculations.race_staffing_readiness"
      - name: start_blocked_reason
        type: enum
        source: system
        default: null
        description: "Set to DIVISION_UNDER_MINIMUM when a division of this regatta reverts to PROVISIONAL, cleared to null when that division is re-confirmed"
        constraints: "null or DIVISION_UNDER_MINIMUM"
      - name: points_pool_total
        type: number
        source: computed
        default: 0
        description: "Sum of RaceResult.points over this race non-voided results, rounded HALF_UP to 1 decimal; the conserved quantity of the abandon compensation invariant"
      - name: results_closed_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the most recent RaceResult of this race was created; the protest window opens from here"
      - name: rescore_count
        type: integer
        source: computed
        default: 0
        description: "Number of times a jury decision or reopen forced a re-run of calculations.race_points_and_places on this race"
      - name: abandon_reason_code
        type: string
        source: input
        default: null
        description: "Reason code recorded by POST /races/{id}/abandon"

  - name: RaceResult
    parent: null
    common_fields: true
    fields:
      - name: race_id
        type: string
        source: input
        description: "FK -> Race.id; the race sailed"
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the competitor scored, unique per race_id"
      - name: finish_status
        type: enum
        source: input
        description: "Scoring abbreviation; FINISHED, DNF, DNS, RET, DNC accepted on create, OCS minted by individual recall, DSQ and RDG minted by jury decisions"
        constraints: "one of FINISHED, DNF, DNS, RET, OCS, DSQ, DNC, RDG"
      - name: elapsed_seconds
        type: number
        source: input
        default: null
        description: "Elapsed time from start signal to finish in seconds; required when finish_status is FINISHED, must be null otherwise"
        constraints: "> 0 and <= 604800"
      - name: penalty_percent
        type: number
        source: input
        default: 0
        description: "Scoring-penalty percentage taken by the boat under the sailing instructions, applied by calculations.race_points_and_places"
        constraints: "one of 0, 20, 30, 40"
      - name: corrected_seconds
        type: number
        source: computed
        default: null
        description: "Handicap-corrected time from calculations.corrected_time, null unless finish_status is FINISHED"
      - name: place
        type: integer
        source: computed
        default: null
        description: "Finishing place within the division after correction, null for non-finishers and while the race is NOT_SCORED"
      - name: points
        type: number
        source: computed
        default: 0
        description: "Race points from calculations.race_points_and_places, rounded HALF_UP to 1 decimal before entering any series total"
      - name: discardable
        type: boolean
        source: computed
        default: true
        description: "False for DSQ results minted by a jury penalty decision and for OCS results recorded while Race.black_flag_active is true"
      - name: voided
        type: boolean
        source: computed
        default: false
        description: "True once POST /races/{id}/abandon voids the race; voided results carry points 0 and place null and are excluded from every series total"

  - name: RecallEvent
    parent: null
    common_fields: false
    fields:
      - name: race_id
        type: string
        source: input
        description: "FK -> Race.id; the race whose start was recalled"
      - name: recall_type
        type: enum
        source: input
        description: "GENERAL recalls the whole fleet, INDIVIDUAL penalises one identified boat"
        constraints: "one of INDIVIDUAL, GENERAL"
      - name: entry_id
        type: string
        source: input
        default: null
        description: "FK -> Entry.id; required for INDIVIDUAL, must be null for GENERAL"
      - name: recorded_by_member_id
        type: string
        source: system
        description: "FK -> ClubMember.id; X-User-ID of the RaceOfficer who made the signal"
      - name: signal_utc
        type: datetime
        source: input
        description: "Instant the recall signal was displayed"
      - name: reason_code
        type: string
        source: input
        description: "Recall reason code, e.g. PREMATURE_START or UNIDENTIFIED_BOATS"
      - name: resulting_start_status
        type: enum
        source: computed
        description: "Race.start_status immediately after this event was recorded"
        constraints: "one of SEQUENCE_STARTED, GENERAL_RECALLED, STARTED"
      - name: black_flag_applied
        type: boolean
        source: computed
        default: false
        description: "True when Race.black_flag_active was true at signal time, which makes the minted OCS result non-discardable"

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: system
        description: "FK -> Regatta.id; copied from the protested race at filing time"
      - name: race_id
        type: string
        source: input
        description: "FK -> Race.id; the race in whose incident the protest arose"
      - name: protestor_entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the entry lodging the protest"
      - name: protestee_entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the entry protested against, which must differ from protestor_entry_id"
      - name: rule_cited
        type: string
        source: input
        description: "Racing rule number alleged to have been broken"
      - name: incident_utc
        type: datetime
        source: input
        description: "Instant of the alleged incident, which must fall between Race.actual_start_utc and Race.results_closed_utc inclusive"
      - name: filed_utc
        type: datetime
        source: system
        description: "Logical-clock instant at which the protest was lodged"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Hearing lifecycle including the reopen loop"
        constraints: "one of FILED, HEARING_SCHEDULED, HEARD, DECIDED, REOPENED, INVALID"
      - name: jury_panel_id
        type: string
        source: system
        default: null
        description: "FK -> JuryPanel.id; panel bound at schedule-hearing time, cleared to null when a recusal drops the panel below quorum"
      - name: hearing_utc
        type: datetime
        source: system
        default: null
        description: "Scheduled hearing instant, cleared to null when the panel loses quorum"
      - name: decision
        type: enum
        source: system
        default: NONE
        description: "Jury outcome recorded by POST /protests/{id}/decide"
        constraints: "one of NONE, PENALTY_DSQ, PENALTY_SCORING_20, DISMISSED, REDRESS_GRANTED"
      - name: penalty_target_entry_id
        type: string
        source: input
        default: null
        description: "FK -> Entry.id; entry carrying the penalty or receiving redress, required for PENALTY_DSQ, PENALTY_SCORING_20 and REDRESS_GRANTED"
      - name: redress_race_number
        type: integer
        source: input
        default: null
        description: "Race.race_number whose result is replaced by an averaged RDG score, required for REDRESS_GRANTED and forbidden otherwise"
      - name: evidence_log
        type: array
        source: input
        default: []
        description: "Append-only list of objects {kind, summary, submitted_by_entry_id (an Entry.id), recorded_utc} written by POST /protests/{id}/evidence"
        constraints: "kind in WRITTEN_STATEMENT, WITNESS, GPS_TRACK, PHOTO"
      - name: evidence_count
        type: integer
        source: computed
        default: 0
        description: "Length of evidence_log; a hearing may not be held below 1"
      - name: invalid_reason_code
        type: string
        source: input
        default: null
        description: "Validity reason recorded by POST /protests/{id}/invalidate"
      - name: reopen_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this protest has been reopened; capped at 1"

  - name: JuryPanel
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta this panel serves"
      - name: chair_member_id
        type: string
        source: input
        description: "FK -> ClubMember.id; panel chair, who must hold judge_certification_level in REGIONAL, NATIONAL or INTERNATIONAL"
      - name: seats
        type: array
        source: input
        default: []
        description: "List of objects {member_id (a ClubMember.id), seat_role, recused, seated_utc} maintained by POST /jury-panels/{id}/seats and /recuse; the chair occupies the first element with seat_role CHAIR"
        constraints: "member_id unique within the array; seat_role in CHAIR, MEMBER"
      - name: seated_member_count
        type: integer
        source: computed
        default: 0
        description: "Count of seats elements whose recused flag is false"
      - name: status
        type: enum
        source: system
        default: FORMING
        description: "FORMING below quorum, SEATED once seated_member_count reaches Regatta.jury_quorum_required"
        constraints: "one of FORMING, SEATED"

  - name: RaceDocument
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta this document governs"
      - name: doc_type
        type: enum
        source: input
        description: "NOR is the notice of race, SI the sailing instructions"
        constraints: "one of NOR, SI"
      - name: revision
        type: integer
        source: computed
        description: "1 for the original publication, incremented by one per amendment of the same doc_type within the regatta"
      - name: body_summary
        type: string
        source: input
        description: "Human-readable summary of the published text or of the amendment"
      - name: effective_utc
        type: datetime
        source: input
        description: "Instant from which this revision governs; amendments must be strictly later than the revision they amend"
      - name: amends_document_id
        type: string
        source: input
        default: null
        description: "FK -> RaceDocument.id; the PUBLISHED revision this amendment supersedes, null for revision 1"
      - name: status
        type: enum
        source: system
        default: PUBLISHED
        description: "PUBLISHED until an amendment of the same doc_type supersedes it"
        constraints: "one of PUBLISHED, SUPERSEDED"

  - name: DutyAssignment
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta being staffed"
      - name: race_id
        type: string
        source: input
        default: null
        description: "FK -> Race.id; null means the assignment covers the whole regatta and counts towards every race of it"
      - name: member_id
        type: string
        source: input
        description: "FK -> ClubMember.id; the volunteer on duty"
      - name: mark_boat_id
        type: string
        source: input
        default: null
        description: "FK -> MarkBoat.id; required when position is MARK_BOAT_DRIVER or SAFETY_BOAT, forbidden otherwise"
      - name: position
        type: enum
        source: input
        description: "Race committee position filled by this assignment"
        constraints: "one of PRO, TIMEKEEPER, SIGNALS, MARK_BOAT_DRIVER, SAFETY_BOAT"
      - name: window_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the duty window"
      - name: window_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the duty window; member windows are half-open so back-to-back assignments touching at one instant do not collide"
        constraints: "must be strictly after window_start_utc"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "PROPOSED on creation, CONFIRMED once the volunteer accepts, RELEASED when the assignment is given back"
        constraints: "one of PROPOSED, CONFIRMED, RELEASED"
      - name: duty_minutes
        type: integer
        source: computed
        description: "Whole minutes between window_start_utc and window_end_utc; contributes to ClubMember.assigned_duty_minutes while status is PROPOSED or CONFIRMED"
      - name: release_reason_code
        type: string
        source: input
        default: null
        description: "Reason code recorded by POST /duty-assignments/{id}/release"

  - name: MarkBoat
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: "FK -> Regatta.id; the regatta the boat is chartered for"
      - name: call_sign
        type: string
        source: input
        description: "VHF call sign, unique per regatta_id"
      - name: crew_capacity
        type: integer
        source: input
        description: "Maximum people the boat may carry"
        constraints: ">= 1 and <= 12"
      - name: concurrent_assignment_limit
        type: integer
        source: input
        default: 2
        description: "Maximum number of non-RELEASED DutyAssignment rows whose windows overlap this boat at any instant"
        constraints: ">= 1 and <= 6"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        default: 20
        description: "Buffer added to BOTH ends of every existing window before overlap is tested for this boat, so windows that merely touch still collide"
        constraints: ">= 0 and <= 120"
      - name: committed_minutes
        type: integer
        source: computed
        default: 0
        description: "Summed duty_minutes of this boat DutyAssignment rows with status in PROPOSED or CONFIRMED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Regatta
    dimension: status
    shape: compound
    initial_state: DRAFT
    terminal_states: [SCORED]
    transitions:
      - from: DRAFT
        to: NOR_PUBLISHED
        trigger: "POST /race-documents with doc_type NOR (revision 1)"
        actor: RegattaChair
        preconditions:
          - "Regatta.status == DRAFT"
          - "no RaceDocument with this regatta_id and doc_type NOR exists"
          - "payload expected_regatta_version equals Regatta.version"
        side_effects:
          - "sets Regatta.nor_revision = 1"
          - "increments Regatta.version by 1"
        note: "Publishing the notice of race is what opens the event; divisions and entries may only be created from NOR_PUBLISHED onwards."
      - from: NOR_PUBLISHED
        to: SI_PUBLISHED
        trigger: "POST /race-documents with doc_type SI (revision 1)"
        actor: RegattaChair
        preconditions:
          - "Regatta.status == NOR_PUBLISHED"
          - "Regatta.nor_revision >= 1"
          - "payload expected_regatta_version equals Regatta.version"
        side_effects:
          - "sets Regatta.si_revision = 1"
          - "increments Regatta.version by 1"
      - from: SI_PUBLISHED
        to: RACING
        trigger: "POST /regattas/{id}/open-racing"
        actor: RegattaChair
        preconditions:
          - "Regatta.status == SI_PUBLISHED"
          - "Regatta.si_revision >= 1"
          - "Regatta.confirmed_division_count >= 1"
          - "no Division of this regatta has status PROVISIONAL and assigned_entry_count >= 1"
          - "at least one JuryPanel of this regatta has status SEATED"
        side_effects:
          - "freezes entry submission: POST /entries is rejected from RACING onwards"
          - "increments Regatta.version by 1"
      - from: RACING
        to: SCORED
        trigger: "system, evaluated at the end of POST /races/{id}/score"
        actor: system
        preconditions:
          - "Regatta.status == RACING"
          - "Regatta.final_race_count == Regatta.planned_race_count after this score run"
          - "no Protest of this regatta has status in FILED, HEARING_SCHEDULED, HEARD or REOPENED"
        side_effects:
          - "increments Regatta.version by 1"
        note: "Compound bubble-up: the parent transitions only because its children (races and protests) reached the required aggregate state. An outstanding protest keeps the regatta in RACING even when every planned race is FINAL."

  - entity: RatingCertificate
    dimension: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /rating-certificates/{id}/issue"
        actor: Measurer
        preconditions:
          - "RatingCertificate.status == DRAFT"
          - "X-User-ID equals RatingCertificate.measured_by_member_id"
          - "logical clock is within [valid_from, valid_until]"
        side_effects:
          - "hop 1: sets status ISSUED"
          - "hop 2 (caused by hop 1): the previously ISSUED certificate of the same boat_id, if any, moves to SUPERSEDED and this row records supersedes_certificate_id = that certificate id"
          - "increments Boat.version by 1"
        note: "Superseding never re-points Entry.certificate_id: entries stay pinned to the certificate they were submitted with."
      - from: ISSUED
        to: SUSPENDED
        trigger: "POST /rating-certificates/{id}/suspend"
        actor: Measurer
        preconditions:
          - "RatingCertificate.status == ISSUED"
          - "payload suspension_reason_code is present and non-blank"
        side_effects:
          - "hop 1: sets status SUSPENDED and suspension_reason_code = payload reason_code"
          - "hop 2 (caused by hop 1): every Entry whose certificate_id equals this certificate and whose registration_status is ACCEPTED moves to RATING_INVALID"
          - "hop 3 (caused by hop 2): every Division holding one of those entries re-derives assigned_entry_count and accepted_entry_count; a Division with status CONFIRMED whose refreshed assigned_entry_count < max(Division.min_entries, Regatta.fleet_minimum) reverts to PROVISIONAL"
          - "hop 4 (caused by hop 3): every Race of that reverted division regatta whose start_status is PENDING gets start_blocked_reason = DIVISION_UNDER_MINIMUM"
          - "increments Boat.version by 1"
        note: "Four-hop transitive cascade: certificate -> entry -> division -> race. Each hop is caused by the previous hop, not by the suspend call itself."
      - from: SUSPENDED
        to: ISSUED
        trigger: "POST /rating-certificates/{id}/reinstate"
        actor: Measurer
        preconditions:
          - "RatingCertificate.status == SUSPENDED"
          - "logical clock is within [valid_from, valid_until]"
        side_effects:
          - "hop 1: sets status ISSUED and suspension_reason_code = null"
          - "hop 2 (caused by hop 1): every Entry with this certificate_id and registration_status RATING_INVALID returns to SUBMITTED, NOT to ACCEPTED, so the chair must re-accept it"
          - "hop 3 (caused by hop 2): the divisions of those entries re-derive assigned_entry_count and accepted_entry_count"
          - "increments Boat.version by 1"
        note: "Closes the ISSUED -> SUSPENDED -> ISSUED cycle. accepted_entry_count does NOT recover here because the entries land in SUBMITTED."
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system, during POST /rating-certificates/{id}/issue of a newer certificate for the same boat"
        actor: system
        preconditions:
          - "RatingCertificate.status == ISSUED"
          - "the newly issued certificate has the same boat_id"
        side_effects:
          - "the newer certificate records supersedes_certificate_id = this row id"

  - entity: Division
    dimension: status
    shape: compound
    initial_state: PROVISIONAL
    terminal_states: [MERGED]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "POST /divisions/{id}/confirm"
        actor: RegattaChair
        preconditions:
          - "Division.status == PROVISIONAL"
          - "Regatta.status in NOR_PUBLISHED or SI_PUBLISHED"
          - "Division.assigned_entry_count >= max(Division.min_entries, Regatta.fleet_minimum)"
        side_effects:
          - "sets status CONFIRMED"
          - "clears start_blocked_reason to null on every Race of this regatta whose start_blocked_reason is DIVISION_UNDER_MINIMUM and for which no other division of the regatta remains PROVISIONAL with assigned_entry_count >= 1"
          - "increments Regatta.version by 1 and refreshes Regatta.confirmed_division_count"
      - from: CONFIRMED
        to: PROVISIONAL
        trigger: "system, when a cascade drops assigned_entry_count below the effective floor"
        actor: system
        preconditions:
          - "Division.status == CONFIRMED"
          - "refreshed Division.assigned_entry_count < max(Division.min_entries, Regatta.fleet_minimum)"
        side_effects:
          - "sets status PROVISIONAL"
          - "sets start_blocked_reason = DIVISION_UNDER_MINIMUM on every Race of the regatta whose start_status is PENDING"
          - "refreshes Regatta.confirmed_division_count"
        note: "Revert edge that makes the machine non-linear and drives the certificate-suspension cascade hop 3 and hop 4."
      - from: PROVISIONAL
        to: MERGED
        trigger: "POST /divisions/{id}/merge"
        actor: RegattaChair
        preconditions:
          - "Division.status == PROVISIONAL"
          - "Division.assigned_entry_count < max(Division.min_entries, Regatta.fleet_minimum)"
          - "calculations.division_merge_target_selection returns a non-empty candidate set"
        side_effects:
          - "hop 1: sets status MERGED and merged_into_division_id = the selected target id"
          - "hop 2 (caused by hop 1): every Entry with division_id equal to this division is re-pointed to the target division"
          - "hop 3 (caused by hop 2): the target division re-derives assigned_entry_count and accepted_entry_count, and a target with status PROVISIONAL whose refreshed assigned_entry_count >= max(target.min_entries, Regatta.fleet_minimum) auto-transitions to CONFIRMED"
          - "hop 4 (caused by hop 3): every Race of the regatta whose start_blocked_reason is DIVISION_UNDER_MINIMUM is cleared to null once no division of the regatta remains PROVISIONAL with assigned_entry_count >= 1"
          - "refreshes Regatta.confirmed_division_count"

  - entity: Entry
    dimension: registration_status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /entries/{id}/accept"
        actor: RegattaChair
        preconditions:
          - "Entry.registration_status == SUBMITTED"
          - "Entry.division_id is not null"
          - "Entry.inspection_status == PASSED"
          - "Entry.registered_crew_count == Entry.declared_crew_count"
          - "RatingCertificate(Entry.certificate_id).status == ISSUED"
          - "RatingCertificate(Entry.certificate_id).valid_from <= Regatta.series_start_utc <= valid_until"
          - "every crew_manifest member has safety_course_expiry_utc >= Regatta.series_start_utc"
          - "Division(Entry.division_id).status in PROVISIONAL or CONFIRMED"
        side_effects:
          - "sets registration_status ACCEPTED"
          - "refreshes Division.assigned_entry_count and Division.accepted_entry_count"
        note: "Cross-entity guard: the Entry cannot advance unless a row of a different aggregate (RatingCertificate) is in ISSUED with a validity window covering the series start."
      - from: ACCEPTED
        to: RATING_INVALID
        trigger: "system, hop 2 of the certificate suspension cascade"
        actor: system
        preconditions:
          - "Entry.registration_status == ACCEPTED"
          - "the pinned RatingCertificate moved ISSUED -> SUSPENDED in this request"
        side_effects:
          - "sets registration_status RATING_INVALID"
          - "refreshes the division counts, which may revert the division to PROVISIONAL"
      - from: RATING_INVALID
        to: SUBMITTED
        trigger: "system, hop 2 of the certificate reinstatement cascade"
        actor: system
        preconditions:
          - "Entry.registration_status == RATING_INVALID"
          - "the pinned RatingCertificate moved SUSPENDED -> ISSUED in this request"
        side_effects:
          - "sets registration_status SUBMITTED"
          - "refreshes the division counts"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Competitor or RegattaChair
        preconditions:
          - "Entry.registration_status == SUBMITTED"
          - "when the actor is Competitor, X-User-ID equals Entry.helm_member_id"
        side_effects:
          - "sets registration_status WITHDRAWN and division_id stays as it was for audit"
          - "refreshes the division counts, which may revert the division to PROVISIONAL"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Competitor or RegattaChair
        preconditions:
          - "Entry.registration_status == ACCEPTED"
          - "no Race of this regatta with scoring_status FINAL holds a non-voided RaceResult for this entry"
          - "when the actor is Competitor, X-User-ID equals Entry.helm_member_id"
        side_effects:
          - "sets registration_status WITHDRAWN"
          - "refreshes the division counts, which may revert the division to PROVISIONAL and block pending races"

  - entity: Entry
    dimension: inspection_status
    shape: cyclic
    initial_state: NOT_INSPECTED
    terminal_states: []
    transitions:
      - from: NOT_INSPECTED
        to: PASSED
        trigger: "POST /entries/{id}/inspect with outcome PASS"
        actor: RaceOfficer
        preconditions:
          - "Entry.registration_status in SUBMITTED, ACCEPTED or RATING_INVALID"
          - "Entry.registered_crew_count >= 1"
        side_effects:
          - "sets inspection_status PASSED and equipment_deficiency_code = null"
      - from: NOT_INSPECTED
        to: FAILED
        trigger: "POST /entries/{id}/inspect with outcome FAIL"
        actor: RaceOfficer
        preconditions:
          - "Entry.registration_status in SUBMITTED, ACCEPTED or RATING_INVALID"
          - "payload equipment_deficiency_code is present"
        side_effects:
          - "sets inspection_status FAILED and equipment_deficiency_code = payload value"
      - from: FAILED
        to: PASSED
        trigger: "POST /entries/{id}/inspect with outcome PASS"
        actor: RaceOfficer
        preconditions:
          - "Entry.inspection_status == FAILED"
        side_effects:
          - "sets inspection_status PASSED and clears equipment_deficiency_code to null"
      - from: PASSED
        to: FAILED
        trigger: "POST /entries/{id}/inspect with outcome FAIL"
        actor: RaceOfficer
        preconditions:
          - "Entry.inspection_status == PASSED"
          - "payload equipment_deficiency_code is present"
        side_effects:
          - "sets inspection_status FAILED and equipment_deficiency_code = payload value"
          - "an already ACCEPTED entry KEEPS registration_status ACCEPTED: the two dimensions of Entry advance independently and a later inspection failure never rewrites the paperwork dimension"
        note: "This is the independent-dimension pair on one row: registration_status and inspection_status each have their own edges, and only the SUBMITTED -> ACCEPTED edge reads the other dimension."

  - entity: Race
    dimension: start_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [ABANDONED]
    transitions:
      - from: PENDING
        to: SEQUENCE_STARTED
        trigger: "POST /races/{id}/start-sequence"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == PENDING"
          - "Race.start_blocked_reason is null"
          - "Regatta.status == RACING"
          - "the newest PUBLISHED RaceDocument of doc_type SI for this regatta has effective_utc <= the current logical clock"
          - "calculations.race_staffing_readiness returns true for this race"
        side_effects:
          - "sets start_status SEQUENCE_STARTED"
          - "refreshes staffing_ready = true and staffed_position_codes"
        note: "Cross-entity guard on a second pair: the Race cannot advance while the newest SI revision is still pending, which is exactly the state an amendment published with a future effective_utc creates."
      - from: SEQUENCE_STARTED
        to: GENERAL_RECALLED
        trigger: "POST /races/{id}/recall with recall_type GENERAL"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == SEQUENCE_STARTED"
          - "payload entry_id is null"
          - "payload signal_utc >= Race.scheduled_start_utc - 5 minutes"
        side_effects:
          - "appends a RecallEvent with resulting_start_status GENERAL_RECALLED"
          - "increments general_recall_count by 1"
          - "sets black_flag_active = true once general_recall_count >= 2"
        note: "Recall loop edge. The count threshold is cumulative across the whole race, never reset."
      - from: GENERAL_RECALLED
        to: SEQUENCE_STARTED
        trigger: "POST /races/{id}/start-sequence"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == GENERAL_RECALLED"
          - "Race.start_blocked_reason is null"
          - "calculations.race_staffing_readiness returns true for this race"
        side_effects:
          - "sets start_status SEQUENCE_STARTED"
          - "leaves general_recall_count and black_flag_active unchanged, so the third attempt runs under black flag"
        note: "Closes the SEQUENCE_STARTED -> GENERAL_RECALLED -> SEQUENCE_STARTED cycle."
      - from: SEQUENCE_STARTED
        to: STARTED
        trigger: "POST /races/{id}/start"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == SEQUENCE_STARTED"
          - "payload actual_start_utc >= Race.scheduled_start_utc - 5 minutes"
        side_effects:
          - "sets start_status STARTED and actual_start_utc = payload actual_start_utc"
      - from: STARTED
        to: ABANDONED
        trigger: "POST /races/{id}/abandon"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == STARTED"
          - "payload reason_code is present"
        side_effects:
          - "hop 1: sets start_status ABANDONED, abandon_reason_code, scoring_status NOT_SCORED and points_pool_total 0"
          - "hop 2 (caused by hop 1): every RaceResult of this race gets voided true, points 0, place null, corrected_seconds null"
          - "hop 3 (caused by hop 2): calculations.series_standing re-runs for every ACCEPTED entry of the regatta, so each series_points_gross drops by exactly the points this race had awarded that entry"
          - "refreshes Regatta.final_race_count"
        note: "Compensating action for the whole scoring chain; the conserved quantity is stated in calculations.series_points_conservation."
      - from: SEQUENCE_STARTED
        to: ABANDONED
        trigger: "POST /races/{id}/abandon"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == SEQUENCE_STARTED"
          - "payload reason_code is present"
        side_effects:
          - "sets start_status ABANDONED and abandon_reason_code; no RaceResult exists yet so nothing is voided"

  - entity: Race
    dimension: scoring_status
    shape: cyclic
    initial_state: NOT_SCORED
    terminal_states: []
    transitions:
      - from: NOT_SCORED
        to: PROVISIONAL
        trigger: "POST /race-results (first result of the race) or the OCS result minted by an INDIVIDUAL recall"
        actor: RaceOfficer
        preconditions:
          - "Race.start_status == STARTED"
          - "Race.scoring_status == NOT_SCORED"
        side_effects:
          - "sets scoring_status PROVISIONAL"
          - "sets results_closed_utc = current logical clock"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /races/{id}/score"
        actor: RaceOfficer
        preconditions:
          - "Race.scoring_status == PROVISIONAL"
          - "Race.start_status == STARTED"
          - "every Division of the regatta with accepted_entry_count >= 1 has status CONFIRMED"
        side_effects:
          - "hop 1: mints a DNC RaceResult for every ACCEPTED entry of the regatta that has no result for this race"
          - "hop 2 (caused by hop 1): calculations.race_points_and_places runs over the complete result set per division, writing place, points and Race.points_pool_total"
          - "hop 3 (caused by hop 2): calculations.series_standing runs for every ACCEPTED entry of the regatta, writing series_points_gross, series_points_net, discarded_race_numbers and series_rank"
          - "hop 4 (caused by hop 3): Regatta.final_race_count is refreshed and the Regatta may bubble up RACING -> SCORED"
          - "sets scoring_status FINAL"
      - from: FINAL
        to: FINAL
        trigger: "system, re-scoring forced by a jury decision or by reopening a protest"
        actor: system
        preconditions:
          - "Race.scoring_status == FINAL"
          - "a RaceResult of this race was rewritten by a jury decision or by the reversal of one"
        side_effects:
          - "increments rescore_count by 1"
          - "re-runs calculations.race_points_and_places then calculations.series_standing, in that order"
        note: "Self-loop: the state label does not change but the derived scoring payload does, which is why rescore_count exists as the observable."
      - from: FINAL
        to: NOT_SCORED
        trigger: "POST /races/{id}/abandon"
        actor: RaceOfficer
        preconditions:
          - "Race.scoring_status == FINAL"
          - "Race.start_status == STARTED"
        side_effects:
          - "voids every result of the race and re-runs calculations.series_standing"

  - entity: Protest
    dimension: status
    shape: cyclic
    initial_state: FILED
    terminal_states: [INVALID]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /protests/{id}/schedule-hearing"
        actor: JuryChair
        preconditions:
          - "Protest.status == FILED"
          - "JuryPanel(payload jury_panel_id).status == SEATED"
          - "JuryPanel.seated_member_count >= Regatta.jury_quorum_required"
          - "X-User-ID equals JuryPanel.chair_member_id"
          - "no seats element of the panel with recused false names the helm of protestor_entry_id or of protestee_entry_id"
          - "the panel chair is not the measured_by_member_id of the certificate pinned by protestee_entry_id"
          - "payload hearing_utc > current logical clock"
        side_effects:
          - "sets status HEARING_SCHEDULED, jury_panel_id and hearing_utc"
        note: "Cross-entity guard on the Protest/JuryPanel pair plus the segregation-of-duties checks."
      - from: HEARING_SCHEDULED
        to: FILED
        trigger: "system, hop 3 of the recusal cascade"
        actor: system
        preconditions:
          - "Protest.status == HEARING_SCHEDULED"
          - "the bound JuryPanel fell below Regatta.jury_quorum_required in this request"
        side_effects:
          - "sets status FILED, jury_panel_id null and hearing_utc null"
      - from: HEARING_SCHEDULED
        to: HEARD
        trigger: "POST /protests/{id}/hear"
        actor: JuryChair
        preconditions:
          - "Protest.status == HEARING_SCHEDULED"
          - "Protest.evidence_count >= 1"
          - "current logical clock >= Protest.hearing_utc"
          - "X-User-ID equals JuryPanel(Protest.jury_panel_id).chair_member_id"
        side_effects:
          - "sets status HEARD"
      - from: HEARD
        to: DECIDED
        trigger: "POST /protests/{id}/decide"
        actor: JuryChair
        preconditions:
          - "Protest.status == HEARD"
          - "X-User-ID equals JuryPanel(Protest.jury_panel_id).chair_member_id"
          - "payload decision is one of PENALTY_DSQ, PENALTY_SCORING_20, DISMISSED, REDRESS_GRANTED"
          - "payload penalty_target_entry_id is one of protestor_entry_id or protestee_entry_id unless decision is DISMISSED"
          - "Race(Protest.race_id).scoring_status == FINAL"
        side_effects:
          - "hop 1: sets status DECIDED, decision and penalty_target_entry_id (and redress_race_number for REDRESS_GRANTED)"
          - "hop 2 (caused by hop 1): for PENALTY_DSQ the target RaceResult of Protest.race_id is rewritten to finish_status DSQ with elapsed_seconds null, corrected_seconds null and discardable false; for PENALTY_SCORING_20 that result keeps its finish_status but takes penalty_percent 20; for REDRESS_GRANTED the target result of race_number redress_race_number is rewritten to finish_status RDG per calculations.redress_points_average; DISMISSED rewrites nothing"
          - "hop 3 (caused by hop 2): calculations.race_points_and_places re-runs for the affected race and increments Race.rescore_count"
          - "hop 4 (caused by hop 3): calculations.series_standing re-runs for every ACCEPTED entry of the affected division, so a non-discardable DSQ can push a different race out of discarded_race_numbers"
          - "the Regatta may bubble up RACING -> SCORED once no protest of the regatta is open"
      - from: DECIDED
        to: REOPENED
        trigger: "POST /protests/{id}/reopen"
        actor: JuryChair
        preconditions:
          - "Protest.status == DECIDED"
          - "Protest.reopen_count == 0"
          - "X-User-ID equals JuryPanel(Protest.jury_panel_id).chair_member_id"
        side_effects:
          - "hop 1: sets status REOPENED, increments reopen_count to 1, sets decision NONE and hearing_utc null"
          - "hop 2 (caused by hop 1): the RaceResult rewritten by the reversed decision is restored to the finish_status it carried before the decision, with discardable true and penalty_percent 0"
          - "hop 3 (caused by hop 2): calculations.race_points_and_places and then calculations.series_standing re-run, restoring every series_points_gross to its pre-decision value"
        note: "Compensating action for the decision cascade; capped at one reopen per protest."
      - from: REOPENED
        to: HEARING_SCHEDULED
        trigger: "POST /protests/{id}/schedule-hearing"
        actor: JuryChair
        preconditions:
          - "Protest.status == REOPENED"
          - "JuryPanel(payload jury_panel_id).status == SEATED"
          - "payload hearing_utc > current logical clock"
        side_effects:
          - "sets status HEARING_SCHEDULED, jury_panel_id and hearing_utc"
        note: "Closes the DECIDED -> REOPENED -> HEARING_SCHEDULED -> HEARD -> DECIDED cycle."
      - from: FILED
        to: INVALID
        trigger: "POST /protests/{id}/invalidate"
        actor: JuryChair
        preconditions:
          - "Protest.status in FILED or REOPENED"
          - "payload reason_code is present"
        side_effects:
          - "sets status INVALID and invalid_reason_code"
          - "the Regatta may bubble up RACING -> SCORED once no protest of the regatta is open"

  - entity: JuryPanel
    dimension: status
    shape: cyclic
    initial_state: FORMING
    terminal_states: []
    transitions:
      - from: FORMING
        to: SEATED
        trigger: "POST /jury-panels/{id}/seats (bubble-up once quorum is reached)"
        actor: RegattaChair
        preconditions:
          - "JuryPanel.status == FORMING"
          - "refreshed seated_member_count >= Regatta.jury_quorum_required"
        side_effects:
          - "sets status SEATED"
      - from: SEATED
        to: FORMING
        trigger: "POST /jury-panels/{id}/recuse"
        actor: JuryChair
        preconditions:
          - "JuryPanel.status == SEATED"
          - "refreshed seated_member_count < Regatta.jury_quorum_required"
        side_effects:
          - "hop 1: marks the named seats element recused true and decrements seated_member_count"
          - "hop 2 (caused by hop 1): sets status FORMING because quorum is lost"
          - "hop 3 (caused by hop 2): every Protest bound to this panel with status HEARING_SCHEDULED reverts to FILED with jury_panel_id null and hearing_utc null"
        note: "Three-hop cascade seat -> panel -> protest, triggered from a different transition than the certificate cascade."

  - entity: DutyAssignment
    dimension: status
    shape: linear
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /duty-assignments/{id}/confirm"
        actor: RegattaChair
        preconditions:
          - "DutyAssignment.status == PROPOSED"
          - "no seats element with recused false on any SEATED JuryPanel of this regatta names this member_id when position is PRO"
        side_effects:
          - "sets status CONFIRMED; ClubMember.assigned_duty_minutes is unchanged because PROPOSED already counted"
      - from: PROPOSED
        to: RELEASED
        trigger: "POST /duty-assignments/{id}/release"
        actor: RegattaChair
        preconditions:
          - "DutyAssignment.status == PROPOSED"
        side_effects:
          - "sets status RELEASED and release_reason_code"
          - "decrements ClubMember.assigned_duty_minutes by duty_minutes and MarkBoat.committed_minutes by duty_minutes when mark_boat_id is set"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /duty-assignments/{id}/release"
        actor: RegattaChair
        preconditions:
          - "DutyAssignment.status == CONFIRMED"
          - "no Race of this regatta whose staffing depends on this assignment has start_status SEQUENCE_STARTED"
        side_effects:
          - "sets status RELEASED and release_reason_code"
          - "decrements ClubMember.assigned_duty_minutes by duty_minutes and MarkBoat.committed_minutes by duty_minutes when mark_boat_id is set"
          - "frees the window so a later assignment on the same member or mark boat no longer collides"
        note: "Compensating action for calculations.duty_minutes_ledger."

  - entity: RaceDocument
    dimension: status
    shape: linear
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, during POST /race-documents that carries amends_document_id pointing at this row"
        actor: system
        preconditions:
          - "RaceDocument.status == PUBLISHED"
          - "the amendment has the same regatta_id and doc_type"
          - "the amendment effective_utc is strictly after this row effective_utc"
        side_effects:
          - "sets status SUPERSEDED"
          - "the amendment takes revision = this row revision + 1 and refreshes Regatta.nor_revision or Regatta.si_revision"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: certificate-create-stale-boat
    parent_entity: Boat
    write_endpoint: "POST /rating-certificates"
    occ_field: "expected_boat_version"
    description: |
      Creating a RatingCertificate for a Boat whose version has advanced past
      the value the client last observed is rejected. This is the
      create-with-supersede shape: a fresh measurement legitimately displaces
      the boat previously ISSUED certificate at issue time, so a second
      certificate create against the same boat is perfectly valid product
      behaviour when the client view is current — the only defect is that the
      submitter is working from a stale picture of the boat measurement
      history. Every certificate create, issue, suspend and reinstate bumps
      Boat.version, so a submitter who has not re-read the boat is told to
      refresh instead of silently stacking a second draft on top of an
      unnoticed one.
    error_id: ERR_STALE_BOAT_VERSION
    http_status: 412
  - rule_id: document-publish-stale-regatta
    parent_entity: Regatta
    write_endpoint: "POST /race-documents"
    occ_field: "expected_regatta_version"
    description: |
      Publishing a RaceDocument (an original notice of race or sailing
      instructions, or an amendment to either) against a Regatta whose version
      has advanced past the value the client last observed is rejected. An
      amendment legitimately supersedes the prior revision, so a second
      publication is valid product behaviour on a current view; the stale
      version merely proves the publisher has not seen the revision that landed
      in between, which would silently renumber revisions and re-point
      amends_document_id at an already SUPERSEDED row.
    error_id: ERR_STALE_REGATTA_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: certificate_rating_value
    trigger: "POST /rating-certificates (once, at creation; measurement inputs are immutable afterwards)"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — speed index (three measured inputs, non-linear interaction)
      base            = sqrt(sail_area_m2) / (displacement_kg ** (1.0/3.0))
      length_factor   = max(1.00, min(1.60, hull_length_m / 8.0))
      draft_penalty   = 0.03 if draft_m > 2.20 else 0.00     # strict >
      type_multiplier = 1.00 if boat_type == MONOHULL
                        else 0.82 if boat_type == MULTIHULL
                        else 0.94                            # KEELBOAT_SPORT
      raw_speed_index = round_half_up(base * length_factor
                                      * (1.0 - draft_penalty)
                                      * type_multiplier, 4)
      # STEP 2 — rule branch. The 4-decimal rounding of raw_speed_index above
      # happens BEFORE this branch; rounding after the branch is forbidden and
      # shifts rating_value by up to 0.1 spm.
      if rule_code == TOD_PHRF:
          rating_value = max(-30.0, min(300.0,
                             round_half_up(420.0 - 380.0 * raw_speed_index, 1)))
          band_key_spm = rating_value
      else:                                                   # TOT_ORC
          rating_value = max(0.5000, min(1.6000,
                             round_half_up(0.4000 + 0.7000 * raw_speed_index, 4)))
          band_key_spm = round_half_up(420.0 - 542.8571 * (rating_value - 0.4000), 1)
    input_set: "The four measured fields of this certificate plus Boat.boat_type of the referenced boat. Boat.loa_meters is documentation only and never enters the formula."
    constants:
      LENGTH_FACTOR_FLOOR: 1.00
      LENGTH_FACTOR_CEIL: 1.60
      LENGTH_DIVISOR: 8.0
      DEEP_DRAFT_THRESHOLD_M: 2.20
      DEEP_DRAFT_PENALTY: 0.03
      TYPE_MULTIPLIER_MONOHULL: 1.00
      TYPE_MULTIPLIER_MULTIHULL: 0.82
      TYPE_MULTIPLIER_KEELBOAT_SPORT: 0.94
      TOD_INTERCEPT: 420.0
      TOD_SLOPE: 380.0
      TOD_CLAMP_LOW: -30.0
      TOD_CLAMP_HIGH: 300.0
      TOT_INTERCEPT: 0.4000
      TOT_SLOPE: 0.7000
      TOT_CLAMP_LOW: 0.5000
      TOT_CLAMP_HIGH: 1.6000
      BAND_KEY_SLOPE: 542.8571
    precision: "raw_speed_index 4 decimals round_half_up; TOD rating_value and band_key_spm 1 decimal round_half_up; TOT rating_value 4 decimals round_half_up"

  - name: corrected_time
    trigger: "POST /race-results (on create) and again whenever calculations.race_points_and_places re-runs for the race"
    algorithm: dual_variant
    formula: |
      # Applies only when finish_status == FINISHED; otherwise corrected_seconds is null.
      cert  = RatingCertificate(Entry(entry_id).certificate_id)     # the PINNED certificate
      dist  = Race(race_id).course_distance_nm
      basis = Regatta(Race.regatta_id).handicap_basis

      if basis == UNIFIED_TOD or cert.rule_code == TOD_PHRF:
          # variant TIME_ON_DISTANCE
          allowance_spm = cert.rating_value if cert.rule_code == TOD_PHRF
                          else cert.band_key_spm
          corrected_seconds = round_half_up(elapsed_seconds - allowance_spm * dist, 1)
      else:
          # variant TIME_ON_TIME (basis PER_CERTIFICATE and rule_code TOT_ORC)
          corrected_seconds = round_half_up(elapsed_seconds * cert.rating_value, 1)
    input_set: "One RaceResult with finish_status FINISHED, its entry pinned certificate, the race course_distance_nm and the regatta handicap_basis. Results with any other finish_status are excluded and keep corrected_seconds null."
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants:
      - name: TIME_ON_DISTANCE
        when: "Regatta.handicap_basis == UNIFIED_TOD (any rule_code), or handicap_basis == PER_CERTIFICATE with cert.rule_code == TOD_PHRF"
        difference: "Subtracts a distance-scaled allowance, so the handicap effect grows with course_distance_nm and is unaffected by how long the boat took."
      - name: TIME_ON_TIME
        when: "Regatta.handicap_basis == PER_CERTIFICATE and cert.rule_code == TOT_ORC"
        difference: "Multiplies elapsed time by a factor, so the handicap effect grows with elapsed_seconds and ignores course_distance_nm entirely. For one and the same TOT_ORC certificate and one and the same elapsed time, the two variants return different corrected_seconds, and on a long light-wind race they can invert the finishing order."

  - name: race_points_and_places
    trigger: "POST /races/{id}/score (hop 2) and every re-run forced by POST /protests/{id}/decide or /reopen"
    algorithm: chronological
    formula: |
      # Evaluated per Division D of the race regatta with accepted_entry_count >= 1.
      N_div      = D.accepted_entry_count                # ACCEPTED entries of D at score time
      candidates = RaceResult rows with race_id == R.id, voided == false,
                   and Entry(entry_id).division_id == D.id
      finishers  = candidates with finish_status == FINISHED, ordered by
                   corrected_seconds ASC, then elapsed_seconds ASC,
                   then Entry.created_at ASC          # never by id
      # slots 1..k in that order; a tie group is a maximal run of finishers whose
      # corrected_seconds are equal (already 1-decimal values).
      base_points(slot) = slot                                   if scoring_system == LOW_POINT
                        = BONUS_TABLE[slot]                      if scoring_system == BONUS_POINT and slot <= 6
                        = slot + 6.0                             if scoring_system == BONUS_POINT and slot >= 7
      for each tie group occupying slots s .. s+m-1:
          place        = s                     for every member of the group
          group_points = round_half_up(mean(base_points(slot) for slot in s..s+m-1), 1)
      # scoring penalty taken under the sailing instructions, never worse than DNF
      if penalty_percent > 0 and finish_status == FINISHED:
          points = round_half_up(min(group_points + penalty_percent/100.0 * N_div,
                                     float(N_div + 1)), 1)
      else:
          points = group_points
      # non-finishers (place stays null)
      DNF, DNS, RET, OCS, DSQ -> points = float(N_div + 1)
      DNC                     -> points = float(N_div + 2)
      RDG                     -> points from calculations.redress_points_average (not recomputed here)
      R.points_pool_total = round_half_up(sum of points over every non-voided
                                          result of R across all divisions, 1)
    input_set: "Non-voided RaceResult rows of the race whose entry is ACCEPTED and assigned to the division being scored. Entries with registration_status SUBMITTED, RATING_INVALID or WITHDRAWN are excluded from both N_div and the result set; their rows, if any, keep points 0."
    constants:
      BONUS_TABLE: { 1: 0.0, 2: 3.0, 3: 5.7, 4: 8.0, 5: 10.0, 6: 11.7 }
      BONUS_TAIL_OFFSET: 6.0
      DNC_EXTRA: 2
      NON_FINISHER_EXTRA: 1
    precision: "points 1 decimal round_half_up; the average of a tie group is rounded once, at the group level"

  - name: series_standing
    trigger: "POST /races/{id}/score (hop 3), POST /races/{id}/abandon (hop 3), POST /protests/{id}/decide (hop 4), POST /protests/{id}/reopen (hop 3), and read-only on GET /entries/{id}/series-standing"
    algorithm: aggregation
    formula: |
      # Per ACCEPTED Entry E in division D.
      counted = Race rows with regatta_id == E.regatta_id, scoring_status == FINAL
                and start_status != ABANDONED, ordered by race_number ASC
      per_race = [ RaceResult(race_id=r.id, entry_id=E.id).points
                   for r in counted if that result exists and voided == false ]
      # ROUNDING ORDER IS PINNED: each element of per_race was already rounded to
      # 1 decimal by race_points_and_places. gross sums those ROUNDED values.
      # Summing the unrounded per-race values and rounding the total afterwards
      # is FORBIDDEN and differs by up to 0.1 per three fractional races.
      gross     = round_half_up(sum(per_race), 1)
      completed = len(counted)
      discard_count = 0                                if discard_policy == NONE
                    = (1 if completed >= 5 else 0)     if discard_policy == ONE_PER_FIVE
                    = min(2, completed // 4)           if discard_policy == ONE_PER_FOUR
      pool      = E results in counted races with voided == false and discardable == true
      discards  = the discard_count highest points in pool; when two pool entries
                  carry equal points, the one from the HIGHER race_number is
                  discarded first (never by id)
      net       = round_half_up(gross - sum(points of discards), 1)
      discarded_race_numbers = sorted race_number values of discards
      # ranking inside D over ACCEPTED entries
      rank order: net ASC, then
        (t1) more results with place == 1; if equal, more with place == 2; ... up to place == N_div
        (t2) lower points in the counted race with the highest race_number
        (t3) Entry.created_at ASC
      rank = null for every entry of D while completed == 0
    input_set: "Only races with scoring_status FINAL and start_status other than ABANDONED enter the series. PROVISIONAL and NOT_SCORED races contribute nothing, and voided results are skipped even inside a FINAL race."
    constants:
      DISCARD_ONE_PER_FIVE_THRESHOLD: 5
      DISCARD_ONE_PER_FOUR_DIVISOR: 4
      DISCARD_ONE_PER_FOUR_CAP: 2
    precision: "gross and net 1 decimal round_half_up"
    variants:
      - name: LOW_POINT_SERIES
        when: "Regatta.scoring_system == LOW_POINT"
        difference: "Finishing slot n is worth exactly n points, so the gap between consecutive slots is always 1.0 and a tie group average is a whole or half number."
      - name: BONUS_POINT_SERIES
        when: "Regatta.scoring_system == BONUS_POINT"
        difference: "Slots are worth 0, 3, 5.7, 8, 10, 11.7 then slot+6, so the same finishing places yield a different gross, a different discard choice (the biggest-gap race changes) and possibly a different rank order than LOW_POINT on identical race data. Tie-group averages such as mean(3.0, 5.7, 8.0) = 5.5666... are the reason the per-race rounding order above is load-bearing."

  - name: redress_points_average
    trigger: "POST /protests/{id}/decide with decision REDRESS_GRANTED"
    algorithm: constraint_propagation
    formula: |
      # The value looks circular: the redress score depends on the entry other
      # race points, while the series discard set depends on the redress score.
      # The evaluation order below is the definition, and it is not iterated.
      T  = Entry(penalty_target_entry_id)
      R* = the Race of this regatta with race_number == redress_race_number
      step 1: ensure race_points_and_places is current for every counted race except R*
      step 2: avg_source = T non-voided results in counted races other than R*
              whose finish_status is in {FINISHED, DNF, DNS, RET, OCS}
              # DSQ, DNC and any other RDG result are EXCLUDED from the average
      step 3: if avg_source is empty -> reject with ERR_REDRESS_NOT_COMPUTABLE
              redress_points = round_half_up(mean(points of avg_source), 1)
      step 4: T result in R* becomes finish_status RDG, points = redress_points,
              place = null, corrected_seconds = null, discardable = true
      step 5: race_points_and_places re-runs for R* (other rows unchanged), then
              series_standing re-runs for every ACCEPTED entry of the division
      step 6: redress_points is NOT recomputed after step 5, even though the
              discard set and the ranks it feeds may have moved. The fixed point
              is defined by step 3 alone.
    input_set: "The target entry results in FINAL, non-abandoned races other than the redress race, restricted to finish_status FINISHED, DNF, DNS, RET, OCS."
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: entry_division_assignment_selection
    trigger: "POST /entries/{id}/assign-division"
    algorithm: selector
    formula: |
      key        = RatingCertificate(Entry.certificate_id).band_key_spm
      boat_type  = Boat(Entry.boat_id).boat_type
      eligible   = Division rows with regatta_id == Entry.regatta_id
                   AND status IN {PROVISIONAL, CONFIRMED}
                   AND (boat_type_filter == boat_type OR boat_type_filter == ANY)
                   AND rating_band_low <= key
                   AND key < rating_band_high            # low inclusive, high EXCLUSIVE
      rank       = eligible sorted by
                   (r1) (rating_band_high - rating_band_low) ASC   # narrowest band wins
                   (r2) rating_band_low ASC
                   (r3) created_at ASC                             # never id
      if eligible is empty -> reject with ERR_NO_ELIGIBLE_DIVISION and leave
                              Entry.division_id null
      else Entry.division_id = rank[0].id and both divisions counts refresh
    input_set: "Divisions of the same regatta in status PROVISIONAL or CONFIRMED. MERGED divisions are never eligible."
    constants: {}
    precision: "band comparison on 1-decimal band_key_spm values, no tolerance"

  - name: division_merge_target_selection
    trigger: "POST /divisions/{id}/merge"
    algorithm: selector
    formula: |
      src        = the division being merged
      mid(d)     = (d.rating_band_low + d.rating_band_high) / 2.0
      eligible   = Division rows with regatta_id == src.regatta_id
                   AND id != src.id
                   AND status IN {PROVISIONAL, CONFIRMED}
                   AND (boat_type_filter == src.boat_type_filter
                        OR boat_type_filter == ANY)
      rank       = eligible sorted by
                   (r1) abs(mid(d) - mid(src)) ASC
                   (r2) rating_band_low ASC
                   (r3) created_at ASC                             # never id
      if eligible is empty -> reject with ERR_NO_MERGE_TARGET and leave src
                              PROVISIONAL
      else target = rank[0]
    input_set: "Sibling divisions of the same regatta in status PROVISIONAL or CONFIRMED whose boat_type_filter equals the source filter or is ANY."
    constants: {}
    precision: "band midpoint compared as an exact float over 1-decimal inputs"

  - name: race_staffing_readiness
    trigger: "POST /races/{id}/start-sequence (both the PENDING and the GENERAL_RECALLED edge)"
    algorithm: aggregation
    formula: |
      R      = the race, S = R.scheduled_start_utc
      window = [S - 30 minutes, S + 120 minutes]
      on_station = DutyAssignment rows with regatta_id == R.regatta_id
                   AND status == CONFIRMED
                   AND (race_id == R.id OR race_id IS NULL)
                   AND window_start_utc <= S - 30 minutes
                   AND window_end_utc   >= S + 120 minutes
      counts = per-position counts over on_station
      required = { PRO: 1, TIMEKEEPER: 1, SIGNALS: 1 }
      if R.course_code IN {WINDWARD_LEEWARD, TRIANGLE}: required[MARK_BOAT_DRIVER] = 1
      if Regatta.safety_category IN {CAT_3, CAT_2}:      required[SAFETY_BOAT]     = 1
      staffing_ready = every required position p has counts[p] >= required[p]
      staffed_position_codes = sorted distinct positions present in on_station
      if not staffing_ready -> reject with ERR_STAFFING_INCOMPLETE
    input_set: "Only CONFIRMED duty assignments whose window fully covers the required coverage window count. PROPOSED and RELEASED assignments are ignored, and a partially overlapping window contributes nothing at all."
    constants:
      PRESTART_COVERAGE_MINUTES: 30
      POSTSTART_COVERAGE_MINUTES: 120
    precision: "whole minutes; window comparison uses <= and >= so an exactly-flush window counts"

  - name: duty_minutes_ledger
    trigger: "POST /duty-assignments (create), POST /duty-assignments/{id}/release"
    algorithm: aggregation
    formula: |
      duty_minutes(a)               = whole minutes between a.window_start_utc and a.window_end_utc
      ClubMember.assigned_duty_minutes(m) = sum(duty_minutes(a) for a in DutyAssignment
                                                where a.member_id == m
                                                and a.status IN {PROPOSED, CONFIRMED})
      MarkBoat.committed_minutes(b)       = sum(duty_minutes(a) for a in DutyAssignment
                                                where a.mark_boat_id == b
                                                and a.status IN {PROPOSED, CONFIRMED})
      # CONSERVED QUANTITY (compensating-action invariant):
      #   sum over every ClubMember of assigned_duty_minutes
      #   == sum over every DutyAssignment with status IN {PROPOSED, CONFIRMED}
      #      of duty_minutes
      # Creating an assignment and then releasing it MUST leave both sides of the
      # identity exactly at their pre-create values: no half-decrement, no
      # residue on the mark boat, and confirming in between changes nothing
      # because PROPOSED already counted.
    input_set: "Duty assignments in status PROPOSED or CONFIRMED only. RELEASED rows are excluded from both ledgers but remain queryable."
    constants: {}
    precision: "integer minutes, truncation impossible because both endpoints of a window are whole minutes"

  - name: series_points_conservation
    trigger: "audited after POST /races/{id}/score, POST /races/{id}/abandon, POST /protests/{id}/decide and POST /protests/{id}/reopen"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (compensating-action invariant), evaluated per regatta:
      #   sum over ACCEPTED entries E of E.series_points_gross
      #   == sum over Race R of the regatta with scoring_status FINAL
      #      and start_status != ABANDONED of R.points_pool_total
      # Scoring a race adds exactly one term to each side. Abandoning a FINAL
      # race removes exactly one term from each side: every entry
      # series_points_gross drops by precisely the points that race had awarded
      # it, R.points_pool_total becomes 0 and R leaves the counted set, so the
      # identity holds again with zero drift. Reopening a protest restores both
      # sides to their pre-decision values.
    input_set: "ACCEPTED entries of the regatta and its races with scoring_status FINAL and start_status other than ABANDONED."
    constants: {}
    precision: "1 decimal place on both sides, compared exactly"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing row decides the response, so a request that violates
#     several rows is always answered with the lowest-priority-number error)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "For an entity_backed role (RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor), X-User-ID resolves to an existing ClubMember row"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 403
    applies_to: "all except POST /club-members"
  - priority: 3
    category: auth
    check: "The acting role appears in the endpoint roles list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "When the acting role is Measurer, ClubMember.measurer_license_id of the acting member is non-null"
    error_id: ERR_MEASURER_NOT_LICENSED
    http_status: 403
    applies_to: "POST /rating-certificates and every /rating-certificates/{id}/* action"
  - priority: 5
    category: auth
    check: "Acting-party identity: when the acting role is Competitor, X-User-ID equals Entry.helm_member_id of the entry being acted on (or Boat.owner_member_id for POST /boats, or Entry.helm_member_id of protestor_entry_id for POST /protests); when the acting role is JuryChair on a protest action, X-User-ID equals JuryPanel.chair_member_id of the panel bound to that protest (or of the panel named in the payload for schedule-hearing) and equals JuryPanel.chair_member_id for a recusal"
    error_id: ERR_NOT_ACTING_PARTY
    http_status: 403
    applies_to: "POST /boats, POST /entries, /entries/{id}/crew, /entries/{id}/withdraw, POST /protests, /protests/{id}/evidence, /protests/{id}/schedule-hearing, /protests/{id}/hear, /protests/{id}/decide, /protests/{id}/reopen, /protests/{id}/invalidate, /jury-panels/{id}/recuse"
  - priority: 6
    category: business_constraint
    check: "Request body parses, every required input field of the endpoint is present and non-null, no unknown field is present, every enum value is a declared member, and every numeric field satisfies its declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET collection endpoint"
  - priority: 8
    category: existence
    check: "Every id in the path resolves, checked left to right, and then every FK field in the body resolves, checked in the field order declared by the endpoint input list"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 9
    category: state
    check: "expected_boat_version equals Boat.version of the referenced boat"
    error_id: ERR_STALE_BOAT_VERSION
    http_status: 412
    applies_to: "POST /rating-certificates"
  - priority: 10
    category: state
    check: "expected_regatta_version equals Regatta.version of the referenced regatta"
    error_id: ERR_STALE_REGATTA_VERSION
    http_status: 412
    applies_to: "POST /race-documents"
  - priority: 11
    category: state
    check: "The target row is in a state from which the requested transition exists in section 1.2, on the dimension the endpoint advances"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint (POST /<collection>/{id}/<verb>)"
  - priority: 12
    category: state
    check: "Regatta.status is NOR_PUBLISHED or SI_PUBLISHED when creating divisions, is not DRAFT when creating entries (the too-late cases RACING and SCORED are answered by priority 13), and is RACING when starting a sequence, recording results or scoring"
    error_id: ERR_REGATTA_PHASE_INVALID
    http_status: 409
    applies_to: "POST /divisions, POST /entries, POST /races/{id}/start-sequence, POST /race-results, POST /races/{id}/score"
  - priority: 13
    category: state
    check: "Entries may not be submitted once Regatta.status has reached RACING or SCORED"
    error_id: ERR_ENTRIES_CLOSED
    http_status: 409
    applies_to: "POST /entries"
  - priority: 14
    category: state
    check: "Race.start_blocked_reason is null"
    error_id: ERR_RACE_START_BLOCKED
    http_status: 409
    applies_to: "POST /races/{id}/start-sequence"
  - priority: 15
    category: business_temporal
    check: "The newest PUBLISHED RaceDocument of doc_type SI for the regatta has effective_utc <= the current logical clock"
    error_id: ERR_SAILING_INSTRUCTIONS_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /races/{id}/start-sequence"
  - priority: 16
    category: business_temporal
    check: "The logical clock has reached Protest.hearing_utc"
    error_id: ERR_HEARING_NOT_DUE
    http_status: 409
    applies_to: "POST /protests/{id}/hear"
  - priority: 17
    category: state
    check: "The entry named by a protest, an evidence submission or a result is not WITHDRAWN"
    error_id: ERR_ENTRY_WITHDRAWN
    http_status: 409
    applies_to: "POST /protests, POST /protests/{id}/evidence, POST /race-results, POST /races/{id}/recall"
    note: "Rule-5 pair A, higher-priority member: a protest filed against a withdrawn entry AFTER the protest window closed fails here (state, 409), not with ERR_PROTEST_WINDOW_CLOSED (business_temporal, 422)."
  - priority: 18
    category: business_safety
    check: "Every crew_manifest member of the entry has safety_course_expiry_utc that is non-null and >= Regatta.series_start_utc"
    error_id: ERR_CREW_SAFETY_COURSE_EXPIRED
    http_status: 422
    applies_to: "POST /entries/{id}/crew, POST /entries/{id}/accept"
    note: "Rule-5 pair B, higher-priority member: an entry whose crew safety course lapsed AND whose pinned certificate band no longer matches its division fails here (business_safety, 422), not with ERR_DIVISION_BAND_MISMATCH (business_constraint, 422)."
  - priority: 19
    category: business_safety
    check: "Entry.inspection_status is PASSED"
    error_id: ERR_EQUIPMENT_INSPECTION_NOT_PASSED
    http_status: 422
    applies_to: "POST /entries/{id}/accept"
  - priority: 20
    category: business_safety
    check: "calculations.race_staffing_readiness returns true: PRO, TIMEKEEPER and SIGNALS are on station, a MARK_BOAT_DRIVER is on station for WINDWARD_LEEWARD and TRIANGLE courses, and a SAFETY_BOAT is on station when Regatta.safety_category is CAT_3 or CAT_2"
    error_id: ERR_STAFFING_INCOMPLETE
    http_status: 422
    applies_to: "POST /races/{id}/start-sequence"
  - priority: 21
    category: business_safety
    check: "A member seated and non-recused on a SEATED JuryPanel of the regatta is not the helm of any Entry of that regatta, does not appear in any crew_manifest of that regatta, and does not hold a CONFIRMED DutyAssignment with position PRO for that regatta; and the panel chair is not the measured_by_member_id of the certificate pinned by either entry named in the protest"
    error_id: ERR_JURY_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: "POST /jury-panels, POST /jury-panels/{id}/seats, POST /duty-assignments/{id}/confirm, POST /protests/{id}/schedule-hearing"
  - priority: 22
    category: business_referential
    check: "mark_boat_id is present when position is MARK_BOAT_DRIVER or SAFETY_BOAT and absent otherwise, and the referenced MarkBoat has the same regatta_id as the assignment"
    error_id: ERR_MARK_BOAT_ASSIGNMENT_INVALID
    http_status: 422
    applies_to: "POST /duty-assignments"
  - priority: 23
    category: business_referential
    check: "Cross-parent coherence: race_id, entry_id, division_id, certificate_id and jury_panel_id all resolve to rows belonging to the same regatta (or, for a certificate, to the boat named by the entry)"
    error_id: ERR_CROSS_REGATTA_REFERENCE
    http_status: 409
    applies_to: "POST /entries, POST /race-results, POST /protests, POST /protests/{id}/schedule-hearing, POST /duty-assignments, POST /races/{id}/recall"
  - priority: 24
    category: business_referential
    check: "amends_document_id, when present, names a PUBLISHED RaceDocument of the same regatta_id and the same doc_type; and it is absent exactly when no PUBLISHED document of that doc_type exists"
    error_id: ERR_AMENDMENT_TARGET_INVALID
    http_status: 409
    applies_to: "POST /race-documents"
  - priority: 25
    category: business_constraint
    check: "RatingCertificate(Entry.certificate_id).status is ISSUED"
    error_id: ERR_CERTIFICATE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /entries/{id}/assign-division, POST /entries/{id}/accept"
  - priority: 26
    category: business_temporal
    check: "RatingCertificate.valid_from <= Regatta.series_start_utc <= RatingCertificate.valid_until, both bounds inclusive"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /entries, POST /entries/{id}/accept"
  - priority: 27
    category: business_constraint
    check: "Entry.registered_crew_count equals Entry.declared_crew_count and exactly one crew_manifest element has position HELM with member_id equal to Entry.helm_member_id"
    error_id: ERR_CREW_MANIFEST_INCOMPLETE
    http_status: 422
    applies_to: "POST /entries/{id}/accept"
  - priority: 28
    category: business_constraint
    check: "The certificate band_key_spm of the entry still satisfies rating_band_low <= key < rating_band_high of Entry.division_id, and Boat.boat_type still matches the division boat_type_filter"
    error_id: ERR_DIVISION_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /entries/{id}/accept"
    note: "Rule-5 pair B, lower-priority member."
  - priority: 29
    category: business_constraint
    check: "calculations.entry_division_assignment_selection returns a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_DIVISION
    http_status: 422
    applies_to: "POST /entries/{id}/assign-division"
  - priority: 30
    category: business_constraint
    check: "Division.assigned_entry_count >= max(Division.min_entries, Regatta.fleet_minimum)"
    error_id: ERR_FLEET_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "POST /divisions/{id}/confirm"
  - priority: 31
    category: business_constraint
    check: "calculations.division_merge_target_selection returns a non-empty candidate set"
    error_id: ERR_NO_MERGE_TARGET
    http_status: 409
    applies_to: "POST /divisions/{id}/merge"
  - priority: 32
    category: business_constraint
    check: "Uniqueness: Boat.sail_number globally, ClubMember.email globally, Division.code per regatta, Race.race_number per regatta, MarkBoat.call_sign per regatta, RaceResult per (race_id, entry_id), one non-recused seat per member per panel, and one crew_manifest element per member per entry"
    error_id: ERR_DUPLICATE_RECORD
    http_status: 409
    applies_to: "POST /boats, POST /club-members, POST /divisions, POST /races, POST /mark-boats, POST /race-results, POST /jury-panels/{id}/seats, POST /entries/{id}/crew"
  - priority: 33
    category: business_temporal
    check: "The prestart occupancy window [scheduled_start_utc - 5 min, scheduled_start_utc] of the new race must not overlap the same closed window of any existing non-ABANDONED race of the same regatta, and consecutive races additionally need a 3-minute gap between one window end and the next window start"
    error_id: ERR_START_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /races"
  - priority: 34
    category: business_temporal
    check: "The half-open duty window [window_start_utc, window_end_utc) must not overlap any non-RELEASED DutyAssignment window of the same member_id; windows that merely touch at one instant do NOT collide"
    error_id: ERR_MEMBER_DUTY_OVERLAP
    http_status: 409
    applies_to: "POST /duty-assignments"
  - priority: 35
    category: business_temporal
    check: "For the named mark boat, the number of non-RELEASED assignments whose window, widened by turnaround_buffer_minutes at BOTH ends, intersects the new window must stay below MarkBoat.concurrent_assignment_limit; a touching window collides because of the buffer"
    error_id: ERR_MARK_BOAT_OVERBOOKED
    http_status: 409
    applies_to: "POST /duty-assignments"
  - priority: 36
    category: business_temporal
    check: "Race.results_closed_utc is non-null, i.e. at least one result has been recorded for the protested race"
    error_id: ERR_PROTEST_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /protests"
  - priority: 37
    category: business_temporal
    check: "The logical clock at filing time is <= Race.results_closed_utc + Regatta.protest_time_limit_minutes, inclusive at the exact limit instant"
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /protests"
    note: "Rule-5 pair A, lower-priority member."
  - priority: 38
    category: business_constraint
    check: "protestor_entry_id differs from protestee_entry_id, and incident_utc lies between Race.actual_start_utc and Race.results_closed_utc inclusive"
    error_id: ERR_PROTEST_PARTIES_INVALID
    http_status: 422
    applies_to: "POST /protests"
  - priority: 39
    category: business_constraint
    check: "On POST /jury-panels the chair_member_id holds judge_certification_level in REGIONAL, NATIONAL or INTERNATIONAL; on POST /protests/{id}/schedule-hearing the panel named in the payload additionally has seated_member_count >= Regatta.jury_quorum_required. A panel is created with the chair alone and reaches quorum through POST /jury-panels/{id}/seats."
    error_id: ERR_JURY_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /jury-panels, POST /protests/{id}/schedule-hearing"
  - priority: 40
    category: business_constraint
    check: "Protest.evidence_count >= 1"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 409
    applies_to: "POST /protests/{id}/hear"
  - priority: 41
    category: business_constraint
    check: "Protest.reopen_count == 0"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /protests/{id}/reopen"
  - priority: 42
    category: business_constraint
    check: "decision payload coherence: penalty_target_entry_id present unless decision is DISMISSED and naming one of the two parties; redress_race_number present exactly when decision is REDRESS_GRANTED and naming a FINAL, non-abandoned race of the regatta"
    error_id: ERR_DECISION_PAYLOAD_INVALID
    http_status: 422
    applies_to: "POST /protests/{id}/decide"
  - priority: 43
    category: business_constraint
    check: "calculations.redress_points_average finds at least one source result for the target entry"
    error_id: ERR_REDRESS_NOT_COMPUTABLE
    http_status: 422
    applies_to: "POST /protests/{id}/decide"
  - priority: 44
    category: business_constraint
    check: "elapsed_seconds is present when finish_status is FINISHED and absent for every other finish_status; finish_status on create is limited to FINISHED, DNF, DNS, RET and DNC"
    error_id: ERR_RESULT_PAYLOAD_INVALID
    http_status: 422
    applies_to: "POST /race-results"
  - priority: 45
    category: business_constraint
    check: "Entry.registration_status of the scored entry is ACCEPTED"
    error_id: ERR_ENTRY_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /race-results, POST /races/{id}/recall"
  - priority: 46
    category: business_constraint
    check: "recall payload coherence: entry_id is present for INDIVIDUAL and null for GENERAL, and signal_utc >= scheduled_start_utc - 5 minutes"
    error_id: ERR_RECALL_PAYLOAD_INVALID
    http_status: 422
    applies_to: "POST /races/{id}/recall"
  - priority: 47
    category: business_temporal
    check: "An amendment effective_utc is strictly later than the effective_utc of the document it amends"
    error_id: ERR_AMENDMENT_NOT_LATER
    http_status: 422
    applies_to: "POST /race-documents"
  - priority: 48
    category: business_constraint
    check: "Measurement inputs are inside their declared ranges and valid_until is strictly after valid_from"
    error_id: ERR_MEASUREMENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /rating-certificates"
  - priority: 49
    category: business_constraint
    check: "Every Division of the regatta with accepted_entry_count >= 1 has status CONFIRMED before a race may be scored"
    error_id: ERR_DIVISION_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /races/{id}/score"
  - priority: 50
    category: business_temporal
    check: "actual_start_utc >= Race.scheduled_start_utc - 5 minutes"
    error_id: ERR_START_TIME_INVALID
    http_status: 422
    applies_to: "POST /races/{id}/start"
  - priority: 51
    category: business_temporal
    check: "hearing_utc is strictly later than the logical clock"
    error_id: ERR_HEARING_TIME_INVALID
    http_status: 422
    applies_to: "POST /protests/{id}/schedule-hearing"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
#     Every path is rooted at api_prefix "/regatta-ops". Every single-resource
#     read is exactly `/regatta-ops/<collection>/{id}`; every child collection
#     exposes one filtered list carrying ALL of its FK fields as optional
#     filters, which is the reverse-reachability channel for cascade-created
#     rows (RecallEvent, DNC results) that no creation response ever returns.
# ---------------------------------------------------------------------------
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/regatta-ops/_clock/set_current_utc"
    description: "Sets the server logical clock used by every deadline, window and expiry rule. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ClubAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "logical clock is set to to_iso8601; no business row is touched"

  # --- ClubMember -----------------------------------------------------------
  - method: POST
    path: "/regatta-ops/club-members"
    description: "Enrols a club member who may later act as owner, helm, crew, measurer, judge or volunteer."
    roles: [ClubAdmin]
    code: 201
    input: [full_name, email, "measurer_license_id?", "judge_certification_level?", "safety_course_expiry_utc?"]
    output: ClubMember
    side_effects:
      - "assigned_duty_minutes initialised to 0"
  - method: PATCH
    path: "/regatta-ops/club-members/{id}"
    description: "Updates the credentials a member holds: measurer licence, judge certification level and safety-course expiry."
    roles: [ClubAdmin]
    code: 200
    input: ["measurer_license_id?", "judge_certification_level?", "safety_course_expiry_utc?"]
    output: ClubMember
    side_effects:
      - "increments ClubMember.version by 1"
  - method: GET
    path: "/regatta-ops/club-members/{id}"
    description: "Reads one club member including the assigned_duty_minutes ledger."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: ClubMember
    side_effects: []
  - method: GET
    path: "/regatta-ops/club-members"
    description: "Lists club members, optionally filtered by judge certification level."
    roles: [ClubAdmin, RegattaChair, JuryChair]
    code: 200
    input: ["judge_certification_level?", "limit?", "offset?"]
    output: ClubMember[]
    side_effects: []

  # --- Boat -----------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/boats"
    description: "Registers a boat under an owning member. loa_meters is recorded for documentation only and never enters any formula."
    roles: [ClubAdmin, Competitor]
    code: 201
    input: [sail_number, boat_name, owner_member_id, boat_type, loa_meters]
    output: Boat
    side_effects:
      - "Boat.version starts at 1, which is the value a certificate creation must echo in expected_boat_version"
  - method: GET
    path: "/regatta-ops/boats/{id}"
    description: "Reads one boat, including the version that the certificate-creation OCC check compares against."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, Competitor]
    code: 200
    input: []
    output: Boat
    side_effects: []
  - method: GET
    path: "/regatta-ops/boats"
    description: "Lists boats, optionally filtered by owning member or hull type."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, Competitor]
    code: 200
    input: ["owner_member_id?", "boat_type?", "limit?", "offset?"]
    output: Boat[]
    side_effects: []

  # --- RatingCertificate ----------------------------------------------------
  - method: POST
    path: "/regatta-ops/rating-certificates"
    description: "Files measurement data and mints a DRAFT certificate under the selected rating rule. Requires expected_boat_version so a measurer who read the boat before another certificate landed is rejected."
    roles: [Measurer]
    code: 201
    input: [boat_id, rule_code, sail_area_m2, hull_length_m, displacement_kg, draft_m, valid_from, valid_until, expected_boat_version]
    output: RatingCertificate
    side_effects:
      - "runs calculations.certificate_rating_value to set raw_speed_index, rating_value and band_key_spm"
      - "sets measured_by_member_id to the X-User-ID of the acting Measurer"
      - "status starts at DRAFT"
      - "increments Boat.version by 1"
  - method: POST
    path: "/regatta-ops/rating-certificates/{id}/issue"
    description: "Issues a DRAFT certificate, superseding whatever certificate the boat previously held."
    roles: [Measurer]
    code: 200
    input: []
    output: RatingCertificate
    side_effects:
      - "RatingCertificate.status DRAFT -> ISSUED"
      - "any other ISSUED certificate of the same boat moves to SUPERSEDED and its id is stored in this row's supersedes_certificate_id"
      - "entries that pinned the superseded certificate keep pointing at it and are NOT re-pointed"
      - "increments Boat.version by 1"
  - method: POST
    path: "/regatta-ops/rating-certificates/{id}/suspend"
    description: "Suspends an ISSUED certificate on a measurement irregularity and runs the four-hop invalidation cascade down to blocked race starts."
    roles: [Measurer]
    code: 200
    input: [suspension_reason_code]
    output: RatingCertificate
    side_effects:
      - "RatingCertificate.status ISSUED -> SUSPENDED"
      - "hop 2: every SUBMITTED or ACCEPTED Entry pinning this certificate moves to RATING_INVALID"
      - "hop 3: each affected Division re-derives assigned_entry_count and accepted_entry_count, and a CONFIRMED division that falls under max(min_entries, Regatta.fleet_minimum) reverts to PROVISIONAL"
      - "hop 4: every PENDING Race of that regatta gets start_blocked_reason = DIVISION_UNDER_MINIMUM"
      - "increments Boat.version by 1"
  - method: POST
    path: "/regatta-ops/rating-certificates/{id}/reinstate"
    description: "Returns a SUSPENDED certificate to ISSUED and unwinds the invalidation cascade."
    roles: [Measurer]
    code: 200
    input: []
    output: RatingCertificate
    side_effects:
      - "RatingCertificate.status SUSPENDED -> ISSUED"
      - "every RATING_INVALID Entry pinning this certificate returns to SUBMITTED and division counts are re-derived"
      - "a PROVISIONAL division that regains max(min_entries, Regatta.fleet_minimum) assigned entries is NOT auto-confirmed; the chair must confirm it again"
      - "start_blocked_reason is cleared on every PENDING Race of the regatta whose divisions all meet the minimum"
      - "increments Boat.version by 1"
  - method: GET
    path: "/regatta-ops/rating-certificates/{id}"
    description: "Reads one certificate with its computed rating_value and band_key_spm."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: RatingCertificate
    side_effects: []
  - method: GET
    path: "/regatta-ops/rating-certificates"
    description: "Lists certificates, filterable by boat, issuing measurer, superseded predecessor or status. Reverse-reachability channel for certificates that a cascade moved to SUPERSEDED."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["boat_id?", "measured_by_member_id?", "supersedes_certificate_id?", "status?", "rule_code?", "limit?", "offset?"]
    output: RatingCertificate[]
    side_effects: []

  # --- Regatta --------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/regattas"
    description: "Opens a regatta in DRAFT with its scoring system, discard policy, handicap basis, fleet minimum, protest time limit, jury quorum and safety category."
    roles: [ClubAdmin, RegattaChair]
    code: 201
    input: [name, host_club_name, scoring_system, "discard_policy?", "handicap_basis?", planned_race_count, "fleet_minimum?", "protest_time_limit_minutes?", "jury_quorum_required?", safety_category, series_start_utc]
    output: Regatta
    side_effects:
      - "status starts at DRAFT; nor_revision, si_revision, confirmed_division_count and final_race_count all start at 0"
      - "Regatta.version starts at 1, which is the value a document publication must echo in expected_regatta_version"
  - method: POST
    path: "/regatta-ops/regattas/{id}/open-racing"
    description: "Moves a regatta from SI_PUBLISHED to RACING, closing entry submission."
    roles: [RegattaChair]
    code: 200
    input: []
    output: Regatta
    side_effects:
      - "Regatta.status SI_PUBLISHED -> RACING"
      - "increments Regatta.version by 1"
  - method: GET
    path: "/regatta-ops/regattas/{id}"
    description: "Reads one regatta, including the version the document-publication OCC check compares against and the derived counters."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: Regatta
    side_effects: []
  - method: GET
    path: "/regatta-ops/regattas"
    description: "Lists regattas, optionally filtered by lifecycle status."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Regatta[]
    side_effects: []

  # --- RaceDocument ---------------------------------------------------------
  - method: POST
    path: "/regatta-ops/race-documents"
    description: "Publishes a notice of race or sailing instructions, or an amendment to the current revision of one. Requires expected_regatta_version, so a chair who drafted against an older regatta snapshot is rejected."
    roles: [RegattaChair]
    code: 201
    input: [regatta_id, doc_type, body_summary, effective_utc, "amends_document_id?", expected_regatta_version]
    output: RaceDocument
    side_effects:
      - "revision is computed as the amended document's revision + 1, or 1 when amends_document_id is absent"
      - "the amended document moves to SUPERSEDED"
      - "Regatta.nor_revision or Regatta.si_revision is set to the new revision"
      - "Regatta.status DRAFT -> NOR_PUBLISHED on the first NOR, NOR_PUBLISHED -> SI_PUBLISHED on the first SI"
      - "increments Regatta.version by 1"
  - method: GET
    path: "/regatta-ops/race-documents/{id}"
    description: "Reads one notice-of-race or sailing-instructions revision."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: RaceDocument
    side_effects: []
  - method: GET
    path: "/regatta-ops/race-documents"
    description: "Lists published and superseded documents, filterable by regatta, amended predecessor, type or status."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["regatta_id?", "amends_document_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: RaceDocument[]
    side_effects: []

  # --- Division -------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/divisions"
    description: "Creates a PROVISIONAL division as a rating band (low inclusive, high exclusive) restricted to a hull type or ANY."
    roles: [RegattaChair]
    code: 201
    input: [regatta_id, code, boat_type_filter, rating_band_low, rating_band_high, "min_entries?"]
    output: Division
    side_effects:
      - "status starts at PROVISIONAL with assigned_entry_count and accepted_entry_count at 0"
  - method: POST
    path: "/regatta-ops/divisions/{id}/confirm"
    description: "Confirms a division once it carries at least max(min_entries, Regatta.fleet_minimum) assigned entries."
    roles: [RegattaChair]
    code: 200
    input: []
    output: Division
    side_effects:
      - "Division.status PROVISIONAL -> CONFIRMED"
      - "increments Regatta.confirmed_division_count by 1"
      - "clears start_blocked_reason on every PENDING Race of the regatta once no CONFIRMED division is under its minimum"
      - "increments Regatta.version by 1"
  - method: POST
    path: "/regatta-ops/divisions/{id}/merge"
    description: "Merges an under-subscribed PROVISIONAL division into the absorbing division chosen by calculations.division_merge_target_selection."
    roles: [RegattaChair]
    code: 200
    input: []
    output: Division
    side_effects:
      - "Division.status PROVISIONAL -> MERGED and merged_into_division_id is set to the selected target"
      - "hop 2: every SUBMITTED or ACCEPTED Entry of the merged division is re-pointed to the target division"
      - "hop 3: both divisions re-derive assigned_entry_count and accepted_entry_count"
      - "hop 4: the target division auto-transitions PROVISIONAL -> CONFIRMED when it now meets max(min_entries, Regatta.fleet_minimum), bumping Regatta.confirmed_division_count"
      - "increments Regatta.version by 1"
  - method: GET
    path: "/regatta-ops/divisions/{id}"
    description: "Reads one division with its derived assigned and accepted entry counts."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: Division
    side_effects: []
  - method: GET
    path: "/regatta-ops/divisions"
    description: "Lists divisions, filterable by regatta, absorbing division, status or hull-type filter."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["regatta_id?", "merged_into_division_id?", "status?", "boat_type_filter?", "limit?", "offset?"]
    output: Division[]
    side_effects: []

  # --- Entry ----------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/entries"
    description: "Submits an entry, pinning the certificate id supplied at submission time. The pin is never re-pointed by a later supersede."
    roles: [RegattaChair, Competitor]
    code: 201
    input: [regatta_id, boat_id, certificate_id, helm_member_id, declared_crew_count]
    output: Entry
    side_effects:
      - "registration_status starts at SUBMITTED and inspection_status at NOT_INSPECTED, as two independent dimensions"
      - "crew_manifest starts empty with registered_crew_count 0 and crew_weight_kg 0"
  - method: POST
    path: "/regatta-ops/entries/{id}/crew"
    description: "Registers one crew member on the entry manifest with a sailing position and weight."
    roles: [RegattaChair, Competitor]
    code: 200
    input: [member_id, position, weight_kg]
    output: Entry
    side_effects:
      - "appends to crew_manifest, increments registered_crew_count by 1 and adds weight_kg to crew_weight_kg"
      - "increments Entry.version by 1"
  - method: DELETE
    path: "/regatta-ops/entries/{id}/crew/{member_id}"
    description: "Removes one crew member from the entry manifest. Reserved to the Competitor who helms the entry."
    roles: [Competitor]
    code: 200
    input: []
    output: Entry
    side_effects:
      - "removes the manifest element, decrements registered_crew_count by 1 and subtracts that element's weight_kg from crew_weight_kg"
      - "increments Entry.version by 1"
  - method: POST
    path: "/regatta-ops/entries/{id}/assign-division"
    description: "Assigns the entry to a division using calculations.entry_division_assignment_selection over the pinned certificate's band_key_spm and the boat's hull type."
    roles: [RegattaChair]
    code: 200
    input: []
    output: Entry
    side_effects:
      - "sets division_id to the selected division"
      - "increments that division's assigned_entry_count by 1"
      - "increments Entry.version by 1"
  - method: POST
    path: "/regatta-ops/entries/{id}/inspect"
    description: "Records the equipment inspection outcome on the inspection dimension, which never rewrites the registration dimension."
    roles: [RaceOfficer]
    code: 200
    input: [outcome, "equipment_deficiency_code?"]
    output: Entry
    side_effects:
      - "inspection_status moves to PASSED for outcome PASS and FAILED for outcome FAIL"
      - "an ACCEPTED entry that fails inspection keeps registration_status ACCEPTED and stays in its division counts"
      - "increments Entry.version by 1"
  - method: POST
    path: "/regatta-ops/entries/{id}/accept"
    description: "Accepts the entry into its division after the safety, crew-manifest, certificate and band checks pass."
    roles: [RegattaChair]
    code: 200
    input: []
    output: Entry
    side_effects:
      - "Entry.registration_status SUBMITTED -> ACCEPTED"
      - "increments the division's accepted_entry_count by 1"
      - "increments Entry.version by 1"
  - method: POST
    path: "/regatta-ops/entries/{id}/withdraw"
    description: "Withdraws the entry from the series, releasing it from its division counts."
    roles: [RegattaChair, Competitor]
    code: 200
    input: []
    output: Entry
    side_effects:
      - "Entry.registration_status -> WITHDRAWN, a terminal state"
      - "decrements the division's assigned_entry_count, and accepted_entry_count when the entry had been ACCEPTED"
      - "a CONFIRMED division that falls under max(min_entries, Regatta.fleet_minimum) reverts to PROVISIONAL and sets start_blocked_reason = DIVISION_UNDER_MINIMUM on every PENDING Race of the regatta"
      - "already-FINAL race results of the entry are left untouched and keep their points in points_pool_total"
      - "increments Entry.version by 1"
  - method: GET
    path: "/regatta-ops/entries/{id}"
    description: "Reads one entry with both status dimensions, the crew manifest and the series point columns."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: Entry
    side_effects: []
  - method: GET
    path: "/regatta-ops/entries"
    description: "Lists entries, filterable by regatta, boat, pinned certificate, helm, division and either status dimension. Reverse-reachability channel for entries a cascade moved to RATING_INVALID."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["regatta_id?", "boat_id?", "certificate_id?", "helm_member_id?", "division_id?", "registration_status?", "inspection_status?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []
  - method: GET
    path: "/regatta-ops/entries/{id}/series-standing"
    description: "Computed read: runs calculations.series_standing for the entry and returns gross points, net points after discards, the discarded race numbers, the number of counted races, the division rank and the tie-break trace."
    roles: [ClubAdmin, RegattaChair, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: "{ entry_id: string, division_id: string, gross_points: number, net_points: number, discarded_race_numbers: integer[], races_counted: integer, rank: integer, tie_break_trace: string }"
    side_effects: []

  # --- MarkBoat -------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/mark-boats"
