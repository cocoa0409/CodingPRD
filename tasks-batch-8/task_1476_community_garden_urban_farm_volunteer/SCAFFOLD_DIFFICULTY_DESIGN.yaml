            - { call: "POST /api/volunteers", payload: { full_name: "V Four", email: "v4@x.com", date_of_birth: "1990-05-23" }, as: GardenAdmin, captures: { v4_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v2_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v2_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v3_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v3_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v4_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v4_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { s2_id: $.data.id } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v3_id}" }, as: Volunteer, as_user_id: "${v3_id}", captures: { s3_id: $.data.id } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v4_id}" }, as: Volunteer, as_user_id: "${v4_id}", captures: { s4_id: $.data.id } }
            - { call: "POST /api/shift-signups/${s1_id}/confirm", as: GardenAdmin }
            - { call: "POST /api/shift-signups/${s2_id}/confirm", as: GardenAdmin }
            - { call: "POST /api/shift-signups/${s3_id}/confirm", as: GardenAdmin }
            - { call: "POST /api/shift-signups/${s4_id}/confirm", as: GardenAdmin, captures: { s4_st: $.data.status } }
            - { call: "GET /api/shift-slots/${slot_id}", as: GardenAdmin, captures: { cnt_before: $.data.confirmed_count, st_before: $.data.status, wl_before: $.data.waitlist_count } }
          trigger:
            - { call: "POST /api/shift-signups/${s2_id}/cancel", as: GardenAdmin }
          assert:
            - "s4_st == WAITLISTED and wl_before == 1 and cnt_before == 3 and st_before == FULL"
            - "GET /api/shift-signups/${s4_id}: status == CONFIRMED and waitlist_position == null"
            - "GET /api/shift-slots/${slot_id}: confirmed_count == 3 (conserved across cancel+promotion), waitlist_count == 0, status == FULL"

      - name: water_budget_partition_conserved_across_commit_cancel_log
        grounds:
          - calculations.water_budget_projection
          - state_machines.IrrigationSchedule.SCHEDULED_to_CANCELLED
          - state_machines.IrrigationSchedule.SCHEDULED_to_LOGGED
          - entities.Season.fields.water_remaining_gallons
        distinguishing_aspect: |
          Conserved quantity = the season water budget partition: committed + actual + remaining
          == water_budget_gallons (1000) at every step of create / cancel / log-meter. Cancelling
          A returns its 700 to remaining; logging B moves 400 out of committed but lands 380 in
          actual, so remaining RISES by the 20-gallon shortfall (600 -> 620) while the partition
          sum stays 1000. Different conserved quantity than tool units and slot spots.
        test_recipe:
          setup:
            - "Season PLANTING, water_budget_gallons 1000"
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
          trigger:
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { sv1: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z1", planned_start_at: "2026-08-20T10:00:00Z", planned_end_at: "2026-08-20T11:00:00Z", planned_gallons: 700, expected_season_version: "${sv1}" }, as: GardenAdmin, captures: { irr_a: $.data.id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { c1: $.data.water_committed_gallons, a1: $.data.water_actual_gallons, r1: $.data.water_remaining_gallons } }
            - { call: "POST /api/irrigation-schedules/${irr_a}/transition", payload: { to_state: "CANCELLED" }, as: GardenAdmin }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { c2: $.data.water_committed_gallons, r2: $.data.water_remaining_gallons, sv2: $.data.version } }
            - { call: "POST /api/irrigation-schedules", payload: { season_id: "${season_id}", zone: "Z2", planned_start_at: "2026-08-21T10:00:00Z", planned_end_at: "2026-08-21T11:00:00Z", planned_gallons: 400, expected_season_version: "${sv2}" }, as: GardenAdmin, captures: { irr_b: $.data.id } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { c3: $.data.water_committed_gallons, r3: $.data.water_remaining_gallons } }
            - { call: "POST /api/irrigation-schedules/${irr_b}/log-meter", payload: { gallons_actual: 380 }, as: GardenAdmin, captures: { b_status: $.data.status, b_var: $.data.variance_flag } }
            - { call: "GET /api/seasons/${season_id}", as: GardenAdmin, captures: { c4: $.data.water_committed_gallons, a4: $.data.water_actual_gallons, r4: $.data.water_remaining_gallons } }
          assert:
            - "after create A: c1 == 700, a1 == 0, r1 == 300 (sum 1000)"
            - "after cancel A: c2 == 0, r2 == 1000 (sum 1000 — cancel fully compensates)"
            - "after create B: c3 == 400, r3 == 600 (sum 1000)"
            - "b_status == LOGGED and b_var == false (380 <= floor(400*1.10) == 440)"
            - "after log B(380): c4 == 0, a4 == 380, r4 == 620 (sum 1000 — the 20-gallon shortfall accrues to remaining, not a drift)"
