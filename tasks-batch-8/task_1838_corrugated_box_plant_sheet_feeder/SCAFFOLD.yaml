# =============================================================================
# PRD Benchmark Scaffold — Corrugated Box Plant & Sheet Feeder
# =============================================================================

scenario: |
  1838. Corrugated Box Plant & Sheet Feeder (Packaging Corp of America plant): board combination & ECT/burst spec, corrugator run scheduling & trim optimization, die-cut vs slotted routing, print plate & ink color, sheet-feeder supply vs internal board, freight-heavy pricing radius, inventory program & release order, damage/board-warp claim

domain_name: corrugated-box-plant
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references; no nested creation URLs
  state_machine_shape: branching   # BoxOrder forks DIE_CUT_QUEUED | SLOTTED_QUEUED; InventoryProgram cycles ACTIVE -> REPLENISHMENT_NEEDED -> ACTIVE
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # claim filer (CustomerService) may not adjudicate the same claim (ClaimsAdjuster); peer role ownership elsewhere
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FKs declared on children)
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Customer legal name" }
      - { name: ship_to_city, type: string, source: input, description: "Primary ship-to city" }
      - { name: distance_miles_from_plant, type: number, source: input, description: "Road miles from plant to primary ship-to; drives freight tier (> 0)" }
      - { name: credit_limit_dollars, type: number, source: input, description: "Maximum open order exposure allowed (>= 0)" }
      - { name: credit_exposure_dollars, type: number, source: computed, default: 0, description: "Sum of committed_value_dollars over this customer's BoxOrders with status IN {ACCEPTED, SCHEDULED, AWAITING_CONVERTING, DIE_CUT_QUEUED, SLOTTED_QUEUED, CONVERTING, PRODUCED}" }

  - name: BoardGrade
    parent: null
    common_fields: true
    fields:
      - { name: grade_code, type: string, source: input, description: "Unique board combination code (e.g. '32C'); unique across all BoardGrades" }
      - { name: liner_combo, type: string, source: input, description: "Liner/medium combination, e.g. '35/23/35'" }
      - { name: flute, type: enum, source: input, description: "B | C | E | BC" }
      - { name: ect_rating_lbs_per_in, type: integer, source: input, description: "Edge-crush-test rating (> 0)" }
      - { name: burst_rating_psi, type: integer, source: input, description: "Mullen burst rating (> 0)" }
      - { name: basis_weight_lbs_per_msf, type: number, source: input, description: "Combined board basis weight per 1000 sq ft (> 0)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED" }

  - name: WorkShift
    parent: null
    common_fields: true
    fields:
      - { name: machine_code, type: enum, source: input, description: "CORRUGATOR | DIE_CUTTER | FFG (flexo folder gluer = slotted line)" }
      - { name: shift_date, type: string, source: input, description: "ISO date YYYY-MM-DD of the shift" }
      - { name: start_minute, type: integer, source: input, description: "Shift window start, minutes since midnight (>= 0)" }
      - { name: end_minute, type: integer, source: input, description: "Shift window end, minutes since midnight (> start_minute)" }
      - { name: capacity_minutes, type: integer, source: computed, description: "= end_minute - start_minute" }
      - { name: scheduled_minutes, type: integer, source: computed, default: 0, description: "Sum of (end_minute - start_minute) over CorrugatorRuns on this shift with status IN {SCHEDULED, COMPLETED} plus ConvertingBookings with status IN {QUEUED, RUNNING, COMPLETED}" }
      - { name: available_minutes, type: integer, source: computed, description: "= capacity_minutes - scheduled_minutes" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CANCELLED" }

  - name: CorrugatorRun
    parent: null
    common_fields: true
    fields:
      - { name: work_shift_id, type: string, source: input, description: "FK -> WorkShift.id; shift must have machine_code CORRUGATOR" }
      - { name: board_grade_id, type: string, source: input, description: "FK -> BoardGrade.id; every attached order must match this grade" }
      - { name: start_minute, type: integer, source: input, description: "Run window start within shift window (>= shift.start_minute)" }
      - { name: end_minute, type: integer, source: input, description: "Run window end (<= shift.end_minute, > start_minute)" }
      - { name: web_width_in, type: number, source: input, description: "Corrugator web width in inches (> 0)" }
      - { name: consumed_width_in, type: number, source: computed, default: 0, description: "Sum of (outs x blank_width_in) over attached orders" }
      - { name: trim_waste_in, type: number, source: computed, description: "= web_width_in - consumed_width_in" }
      - { name: trim_waste_pct, type: number, source: computed, description: "= round(100 * trim_waste_in / web_width_in, 2) half-up" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: BoxOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: board_grade_id, type: string, source: input, description: "FK -> BoardGrade.id" }
      - { name: routing_type, type: enum, source: input, description: "DIE_CUT | SLOTTED — selects die-cutter vs flexo-folder-gluer converting branch" }
      - { name: board_source, type: enum, source: input, description: "INTERNAL (plant corrugates) | SHEET_FEEDER (sheets purchased from a sheet feeder)" }
      - { name: sheet_supplier_name, type: string, source: input, description: "Sheet feeder name; required iff board_source = SHEET_FEEDER, forbidden when INTERNAL", default: null }
      - { name: quantity, type: integer, source: input, description: "Ordered box count (> 0)" }
      - { name: blank_width_in, type: number, source: input, description: "Blank width across the corrugator web (> 0)" }
      - { name: blank_length_in, type: number, source: input, description: "Blank length along the web (> 0)" }
      - { name: min_ect_required, type: integer, source: input, description: "Customer minimum ECT spec (>= 0); must be <= grade ect_rating" }
      - { name: ink_colors, type: array, source: input, default: [], description: "Print ink color set, e.g. [BLACK, RED]; drives color surcharge and changeover gap" }
      - { name: color_count, type: integer, source: computed, default: 0, description: "= length(ink_colors)" }
      - { name: corrugator_run_id, type: string, source: system, default: null, description: "FK -> CorrugatorRun.id; set on attach, cleared when the order reverts to ACCEPTED" }
      - { name: area_sqft_per_box, type: number, source: computed, description: "= round(blank_width_in * blank_length_in / 144, 4) half-up" }
      - { name: committed_value_dollars, type: number, source: computed, default: 0, description: "= quote_total_dollars of the ACCEPTED PriceQuote; 0 before acceptance" }
      - { name: produced_qty, type: integer, source: system, default: null, description: "Actual produced quantity, set when the ConvertingBooking completes" }
      - { name: invoice_billable_msf, type: number, source: computed, default: null, description: "FINAL-variant billable MSF computed at invoicing from produced_qty" }
      - { name: invoice_merchandise_dollars, type: number, source: computed, default: null, description: "FINAL-variant merchandise total at invoicing" }
      - { name: invoice_discount_dollars, type: number, source: computed, default: null, description: "FINAL-variant volume discount at invoicing" }
      - { name: invoice_freight_dollars, type: number, source: computed, default: null, description: "FINAL-variant freight charge at invoicing" }
      - { name: invoice_total_dollars, type: number, source: computed, default: null, description: "FINAL-variant invoice total at invoicing" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | QUOTED | ACCEPTED | SCHEDULED | AWAITING_CONVERTING | DIE_CUT_QUEUED | SLOTTED_QUEUED | CONVERTING | PRODUCED | INVOICED | CANCELLED" }

  - name: PriceQuote
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> BoxOrder.id (parent order from the creation path)" }
      - { name: unit_price_per_msf, type: number, source: input, description: "Merchandise rate per 1000 sq ft before color surcharge (> 0)" }
      - { name: expires_on, type: string, source: input, description: "ISO date YYYY-MM-DD; acceptance on a later logical date fails" }
      - { name: billable_msf, type: number, source: computed, description: "PROVISIONAL variant: round(quantity * area_sqft_per_box / 1000, 4) half-up" }
      - { name: freight_tier, type: enum, source: computed, description: "LOCAL | REGIONAL | NATIONAL from customer distance_miles_from_plant" }
      - { name: merchandise_total_dollars, type: number, source: computed, description: "PROVISIONAL merchandise total, 2dp half-up" }
      - { name: discount_pct, type: number, source: computed, description: "Volume discount tier keyed on merchandise_total_dollars only" }
      - { name: discount_dollars, type: number, source: computed, description: "round(merchandise_total_dollars * discount_pct, 2) half-up" }
      - { name: freight_charge_dollars, type: number, source: computed, description: "round(billable_msf * tier rate, 2) half-up" }
      - { name: quote_total_dollars, type: number, source: computed, description: "= merchandise_total_dollars - discount_dollars + freight_charge_dollars" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACCEPTED | SUPERSEDED | EXPIRED | INVOICED" }

  - name: ConvertingBooking
    parent: null
    common_fields: true
    fields:
      - { name: work_shift_id, type: string, source: input, description: "FK -> WorkShift.id; machine must match order routing (DIE_CUT -> DIE_CUTTER, SLOTTED -> FFG)" }
      - { name: box_order_id, type: string, source: input, description: "FK -> BoxOrder.id; order must be AWAITING_CONVERTING" }
      - { name: start_minute, type: integer, source: input, description: "Booking window start within shift window" }
      - { name: end_minute, type: integer, source: input, description: "Booking window end (> start_minute, <= shift.end_minute)" }
      - { name: ink_colors, type: array, source: system, description: "Snapshot of the order's ink_colors at booking time; drives the changeover gap" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | RUNNING | COMPLETED | CANCELLED" }

  - name: InventoryProgram
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; program owner" }
      - { name: board_grade_id, type: string, source: input, description: "FK -> BoardGrade.id; standing item spec" }
      - { name: program_name, type: string, source: input, description: "Program label" }
      - { name: routing_type, type: enum, source: input, description: "DIE_CUT | SLOTTED — standing spec copied to auto-created replenishment orders" }
      - { name: blank_width_in, type: number, source: input, description: "Standing spec blank width (> 0)" }
      - { name: blank_length_in, type: number, source: input, description: "Standing spec blank length (> 0)" }
      - { name: reorder_point, type: integer, source: input, description: "On-hand level at or below which replenishment is triggered (>= 0)" }
      - { name: replenishment_qty, type: integer, source: input, description: "Quantity of the auto-created replenishment BoxOrder (> 0)" }
      - { name: on_hand_qty, type: integer, source: system, default: 0, description: "Physical program stock; += receipt qty, -= shipped release qty" }
      - { name: committed_qty, type: integer, source: computed, default: 0, description: "Sum of qty over ReleaseOrders with status IN {PENDING, APPROVED}" }
      - { name: available_qty, type: integer, source: computed, description: "= on_hand_qty - committed_qty" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | REPLENISHMENT_NEEDED" }

  - name: ReleaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InventoryProgram.id (parent program from the creation path)" }
      - { name: qty, type: integer, source: input, description: "Release quantity (> 0, <= program available_qty at creation)" }
      - { name: requested_ship_date, type: string, source: input, description: "ISO date YYYY-MM-DD requested by the customer" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | SHIPPED | CANCELLED" }

  - name: QualityClaim
    parent: null
    common_fields: true
    fields:
      - { name: box_order_id, type: string, source: input, description: "FK -> BoxOrder.id; order must be INVOICED" }
      - { name: claim_type, type: enum, source: input, description: "TRANSIT_DAMAGE | BOARD_WARP" }
      - { name: defective_qty_claimed, type: integer, source: input, description: "Claimed defective boxes (> 0)" }
      - { name: measured_warp_pct, type: number, source: input, default: null, description: "Measured warp as % of span; required iff claim_type = BOARD_WARP and must be >= 2.0" }
      - { name: per_box_price_dollars, type: number, source: computed, description: "= round(order.invoice_merchandise_dollars / order.produced_qty, 4) half-up, snapshotted at filing" }
      - { name: provisional_credit_dollars, type: number, source: computed, description: "FILING variant: round(defective_qty_claimed * per_box_price_dollars, 2) half-up" }
      - { name: defective_qty_verified, type: integer, source: input, default: null, description: "Verified defective quantity, supplied at resolve time" }
      - { name: actual_return_freight_dollars, type: number, source: input, default: null, description: "Documented return freight, supplied at resolve time" }
      - { name: final_credit_dollars, type: number, source: computed, default: null, description: "RESOLUTION variant: round(defective_qty_verified * per_box_price_dollars, 2) + min(actual_return_freight_dollars, 500.00); 0.00 when rejected" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the CustomerService filer, captured at creation" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ClaimsAdjuster at resolution; must differ from filed_by_user_id" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | RESOLVED_CREDIT | RESOLVED_REJECTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BoardGrade
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/board-grades/{id}/discontinue"
        actor: PlantAdmin
        preconditions:
          - "Grade is ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Increments BoardGrade.version by 1"
        note: "Existing orders are unaffected; new order creation and quote acceptance referencing a DISCONTINUED grade fail with ERR_GRADE_DISCONTINUED."

  - entity: WorkShift
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/work-shifts/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "Shift is OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: every CorrugatorRun on this shift with status SCHEDULED -> CANCELLED"
          - "Cascade link 1': every ConvertingBooking on this shift with status IN {QUEUED, RUNNING} -> CANCELLED"
          - "Cascade link 2 (from each run cancellation): every attached BoxOrder in SCHEDULED reverts to ACCEPTED and its corrugator_run_id is cleared"
          - "Cascade link 2' (from each booking cancellation): the booked BoxOrder reverts to AWAITING_CONVERTING (from DIE_CUT_QUEUED | SLOTTED_QUEUED | CONVERTING)"
          - "shift_capacity_rollup recomputes scheduled_minutes / available_minutes on this shift"
          - "Increments WorkShift.version by 1"

  - entity: CorrugatorRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/corrugator-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "Run is SCHEDULED (else ERR_INVALID_STATE)"
          - "Run's WorkShift is OPEN (else ERR_INVALID_STATE)"
          - "run.trim_waste_in <= 8.0 (else ERR_TRIM_WASTE_EXCESSIVE; run stays SCHEDULED)"
        side_effects:
          - "Every attached BoxOrder transitions SCHEDULED -> AWAITING_CONVERTING (corrugator_run_id retained for traceability)"
          - "shift_capacity_rollup recomputes the shift's scheduled_minutes (run keeps occupying minutes as COMPLETED)"
          - "Increments CorrugatorRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/corrugator-runs/{id}/cancel or WorkShift cancel cascade"
        actor: ProductionPlanner
        preconditions:
          - "Run is SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Every attached BoxOrder in SCHEDULED reverts to ACCEPTED and its corrugator_run_id is cleared"
          - "shift_capacity_rollup recomputes the shift's scheduled_minutes / available_minutes (cancelled run frees its minutes)"
          - "Increments CorrugatorRun.version by 1"

  - entity: BoxOrder
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /api/box-orders/{id}/quotes (first quote on the order)"
        actor: SalesRep
        preconditions:
          - "Order is DRAFT (else ERR_INVALID_STATE)"
          - "expected_order_version matches order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "PriceQuote created OPEN with all computed pricing fields (PROVISIONAL variant)"
          - "Increments BoxOrder.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /api/box-orders/{id}/quotes (re-quote)"
        actor: SalesRep
        preconditions:
          - "Order is QUOTED (else ERR_INVALID_STATE)"
          - "expected_order_version matches order.version (else ERR_STALE_VERSION)"
        side_effects:
          - "New PriceQuote created OPEN; every other OPEN PriceQuote on this order -> SUPERSEDED"
          - "Increments BoxOrder.version by 1"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /api/price-quotes/{quoteId}/accept"
        actor: SalesRep
        preconditions:
          - "Quote is OPEN (else ERR_QUOTE_NOT_OPEN)"
          - "Logical clock date <= quote.expires_on (else quote -> EXPIRED and ERR_QUOTE_EXPIRED)"
          - "Order's BoardGrade is ACTIVE (else ERR_GRADE_DISCONTINUED)"
          - "customer.credit_exposure_dollars + quote.quote_total_dollars <= customer.credit_limit_dollars (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Quote OPEN -> ACCEPTED; every other OPEN quote on the order -> SUPERSEDED"
          - "order.committed_value_dollars := quote.quote_total_dollars"
          - "credit_exposure_rollup recomputes customer.credit_exposure_dollars"
          - "Increments BoxOrder.version by 1"
      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /api/corrugator-runs/{runId}/orders (attach)"
        actor: ProductionPlanner
        preconditions:
          - "Order is ACCEPTED (else ERR_INVALID_STATE)"
          - "order.board_source == INTERNAL (else ERR_BOARD_SOURCE_MISMATCH)"
          - "order.board_grade_id == run.board_grade_id (else ERR_ORDER_GRADE_MISMATCH)"
          - "Run is SCHEDULED and its shift is OPEN (else ERR_INVALID_STATE)"
          - "consumed_width_in + outs * order.blank_width_in <= run.web_width_in (else ERR_TRIM_WIDTH_EXCEEDS_WEB)"
        note: "Trim-waste acceptability (<= 8.0 in) is judged at run completion, not per attach, so multi-order runs can be built up incrementally."
        side_effects:
          - "order.corrugator_run_id := run.id"
          - "trim_optimization recomputes run.consumed_width_in / trim_waste_in / trim_waste_pct"
          - "Increments BoxOrder.version by 1 and CorrugatorRun.version by 1"
      - from: ACCEPTED
        to: AWAITING_CONVERTING
        trigger: "POST /api/box-orders/{id}/mark-sheets-received"
        actor: ProductionPlanner
        preconditions:
          - "Order is ACCEPTED (else ERR_INVALID_STATE)"
          - "order.board_source == SHEET_FEEDER (else ERR_BOARD_SOURCE_MISMATCH)"
        side_effects:
          - "Increments BoxOrder.version by 1"
        note: "Sheet-feeder orders skip the corrugator entirely; purchased sheets arrive pre-combined."
      - from: SCHEDULED
        to: AWAITING_CONVERTING
        trigger: "POST /api/corrugator-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "Parent run completes (see CorrugatorRun.SCHEDULED_to_COMPLETED)"
        side_effects: []
      - from: SCHEDULED
        to: ACCEPTED
        trigger: "Run cancel or WorkShift cancel cascade"
        actor: system
        preconditions:
          - "Parent run is cancelled"
        side_effects:
          - "order.corrugator_run_id cleared"
      - from: AWAITING_CONVERTING
        to: DIE_CUT_QUEUED
        trigger: "POST /api/converting-bookings (routing_type == DIE_CUT branch)"
        actor: ProductionPlanner
        preconditions:
          - "Order is AWAITING_CONVERTING (else ERR_INVALID_STATE)"
          - "Booking shift machine_code == DIE_CUTTER (else ERR_MACHINE_TYPE_MISMATCH)"
          - "Booking window inside shift window (else ERR_OUTSIDE_SHIFT_WINDOW)"
          - "Append-after-latest changeover rule satisfied (else ERR_BOOKING_CHANGEOVER_CONFLICT)"
        side_effects:
          - "ConvertingBooking created QUEUED with ink_colors snapshotted from the order"
          - "shift_capacity_rollup recomputes the booking shift's scheduled_minutes / available_minutes"
          - "Increments BoxOrder.version by 1"
      - from: AWAITING_CONVERTING
        to: SLOTTED_QUEUED
        trigger: "POST /api/converting-bookings (routing_type == SLOTTED branch)"
        actor: ProductionPlanner
        preconditions:
          - "Order is AWAITING_CONVERTING (else ERR_INVALID_STATE)"
          - "Booking shift machine_code == FFG (else ERR_MACHINE_TYPE_MISMATCH)"
          - "Booking window inside shift window (else ERR_OUTSIDE_SHIFT_WINDOW)"
          - "Append-after-latest changeover rule satisfied (else ERR_BOOKING_CHANGEOVER_CONFLICT)"
        side_effects:
          - "ConvertingBooking created QUEUED with ink_colors snapshotted from the order"
          - "shift_capacity_rollup recomputes the booking shift's scheduled_minutes / available_minutes"
          - "Increments BoxOrder.version by 1"
        note: "Divergent branch: SLOTTED bookings target FFG shifts; DIE_CUT bookings target DIE_CUTTER shifts."
      - from: DIE_CUT_QUEUED
        to: CONVERTING
        trigger: "POST /api/converting-bookings/{id}/start"
        actor: ProductionPlanner
        preconditions: ["Booking is QUEUED and its shift is OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["Increments BoxOrder.version by 1"]
      - from: SLOTTED_QUEUED
        to: CONVERTING
        trigger: "POST /api/converting-bookings/{id}/start"
        actor: ProductionPlanner
        preconditions: ["Booking is QUEUED and its shift is OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["Increments BoxOrder.version by 1"]
      - from: CONVERTING
        to: PRODUCED
        trigger: "POST /api/converting-bookings/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "Booking is RUNNING (else ERR_INVALID_STATE)"
          - "floor(0.90 * order.quantity) <= produced_qty <= ceil(1.10 * order.quantity) (else ERR_OVERRUN_TOLERANCE_EXCEEDED)"
        side_effects:
          - "order.produced_qty := produced_qty"
          - "shift_capacity_rollup recomputes the booking shift's scheduled_minutes (booking stays counted as COMPLETED)"
          - "Increments BoxOrder.version by 1"
      - from: DIE_CUT_QUEUED
        to: AWAITING_CONVERTING
        trigger: "Booking cancel or WorkShift cancel cascade"
        actor: system
        preconditions: ["Booked ConvertingBooking is cancelled"]
        side_effects: []
      - from: SLOTTED_QUEUED
        to: AWAITING_CONVERTING
        trigger: "Booking cancel or WorkShift cancel cascade"
        actor: system
        preconditions: ["Booked ConvertingBooking is cancelled"]
        side_effects: []
      - from: CONVERTING
        to: AWAITING_CONVERTING
        trigger: "Booking cancel (from RUNNING) or WorkShift cancel cascade"
        actor: system
        preconditions: ["Running ConvertingBooking is cancelled"]
        side_effects: ["order.produced_qty discarded (remains null)"]
      - from: PRODUCED
        to: INVOICED
        trigger: "POST /api/box-orders/{id}/invoice"
        actor: SalesRep
        preconditions:
          - "Order is PRODUCED (else ERR_INVALID_STATE)"
        side_effects:
          - "freight_tiered_pricing FINAL variant computes invoice_billable_msf / invoice_merchandise_dollars; volume_discount_total computes invoice_discount_dollars / invoice_freight_dollars / invoice_total_dollars from produced_qty at the accepted quote's locked unit_price_per_msf"
          - "The ACCEPTED PriceQuote -> INVOICED"
          - "credit_exposure_rollup recomputes customer.credit_exposure_dollars (INVOICED orders leave the exposure set)"
          - "Increments BoxOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Order in {DRAFT, QUOTED, ACCEPTED, SCHEDULED, AWAITING_CONVERTING, DIE_CUT_QUEUED, SLOTTED_QUEUED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "OPEN PriceQuotes on the order -> SUPERSEDED; ACCEPTED quote unchanged but order leaves the exposure set"
          - "If order was SCHEDULED: detach from its CorrugatorRun (corrugator_run_id cleared); trim_optimization recomputes the run's consumed_width_in / trim_waste_in / trim_waste_pct"
          - "If order was DIE_CUT_QUEUED | SLOTTED_QUEUED: its QUEUED ConvertingBooking -> CANCELLED; shift_capacity_rollup recomputes that shift"
          - "credit_exposure_rollup recomputes customer.credit_exposure_dollars"
          - "Increments BoxOrder.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Same cancellable set"]
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Same cancellable set"]
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Same cancellable set"]
        side_effects: ["Same as DRAFT -> CANCELLED (run detach fires)"]
      - from: AWAITING_CONVERTING
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Same cancellable set"]
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: DIE_CUT_QUEUED
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Same cancellable set"]
        side_effects: ["Same as DRAFT -> CANCELLED (booking cancellation fires)"]
      - from: SLOTTED_QUEUED
        to: CANCELLED
        trigger: "POST /api/box-orders/{id}/cancel"
        actor: SalesRep
        preconditions: ["Same cancellable set"]
        side_effects: ["Same as DRAFT -> CANCELLED (booking cancellation fires)"]

  - entity: PriceQuote
    initial_state: OPEN
    terminal_states: [SUPERSEDED, EXPIRED, INVOICED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /api/price-quotes/{id}/accept"
        actor: SalesRep
        preconditions: ["See BoxOrder.QUOTED_to_ACCEPTED"]
        side_effects: ["Increments PriceQuote.version by 1"]
      - from: OPEN
        to: SUPERSEDED
        trigger: "A newer quote is created on the same order, another quote on the order is accepted, or the order is cancelled"
        actor: system
        preconditions: []
        side_effects: ["Increments PriceQuote.version by 1"]
      - from: OPEN
        to: EXPIRED
        trigger: "Accept attempt when the logical clock date is later than expires_on"
        actor: system
        preconditions: []
        side_effects: ["The accept request fails with ERR_QUOTE_EXPIRED; increments PriceQuote.version by 1"]
      - from: ACCEPTED
        to: INVOICED
        trigger: "POST /api/box-orders/{id}/invoice on the parent order"
        actor: system
        preconditions: ["Parent order is PRODUCED"]
        side_effects: ["Increments PriceQuote.version by 1"]

  - entity: ConvertingBooking
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /api/converting-bookings/{id}/start"
        actor: ProductionPlanner
        preconditions: ["Booking QUEUED, shift OPEN (else ERR_INVALID_STATE)"]
        side_effects:
          - "Booked BoxOrder -> CONVERTING"
          - "Increments ConvertingBooking.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /api/converting-bookings/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "Booking RUNNING (else ERR_INVALID_STATE)"
          - "produced_qty within +/-10% of order.quantity (else ERR_OVERRUN_TOLERANCE_EXCEEDED)"
        side_effects:
          - "Booked BoxOrder -> PRODUCED with produced_qty set"
          - "shift_capacity_rollup recomputes the shift"
          - "Increments ConvertingBooking.version by 1"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /api/converting-bookings/{id}/cancel or order cancel cascade or shift cancel cascade"
        actor: ProductionPlanner
        preconditions: ["Booking QUEUED (else ERR_INVALID_STATE)"]
        side_effects:
          - "Booked BoxOrder reverts to AWAITING_CONVERTING"
          - "shift_capacity_rollup recomputes the shift (minutes freed)"
          - "Increments ConvertingBooking.version by 1"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /api/converting-bookings/{id}/cancel or shift cancel cascade"
        actor: ProductionPlanner
        preconditions: ["Booking RUNNING (else ERR_INVALID_STATE)"]
        side_effects:
          - "Booked BoxOrder reverts from CONVERTING to AWAITING_CONVERTING"
          - "shift_capacity_rollup recomputes the shift (minutes freed)"
          - "Increments ConvertingBooking.version by 1"

  - entity: InventoryProgram
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/inventory-programs/{id}/suspend"
        actor: PlantAdmin
        preconditions: ["Program in {ACTIVE, REPLENISHMENT_NEEDED} (else ERR_INVALID_STATE)"]
        side_effects: ["Increments InventoryProgram.version by 1"]
      - from: REPLENISHMENT_NEEDED
        to: SUSPENDED
        trigger: "POST /api/inventory-programs/{id}/suspend"
        actor: PlantAdmin
        preconditions: ["Program in {ACTIVE, REPLENISHMENT_NEEDED} (else ERR_INVALID_STATE)"]
        side_effects: ["Increments InventoryProgram.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/inventory-programs/{id}/reactivate"
        actor: PlantAdmin
        preconditions: ["Program is SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects:
          - "Status becomes ACTIVE unconditionally (threshold re-evaluated on next ship/receipt)"
          - "Increments InventoryProgram.version by 1"
      - from: ACTIVE
        to: REPLENISHMENT_NEEDED
        trigger: "reorder_threshold_check after a release ships"
        actor: system
        preconditions: ["on_hand_qty after decrement <= reorder_point"]
        side_effects:
          - "Auto-creates a replenishment BoxOrder in DRAFT: customer_id/board_grade_id/routing_type/blank dimensions copied from the program, quantity = replenishment_qty, board_source = INTERNAL, ink_colors = [], min_ect_required = 0"
          - "Increments InventoryProgram.version by 1"
      - from: REPLENISHMENT_NEEDED
        to: ACTIVE
        trigger: "reorder_threshold_check after a receipt"
        actor: system
        preconditions: ["on_hand_qty after increment > reorder_point (strictly greater)"]
        side_effects: ["Increments InventoryProgram.version by 1"]

  - entity: ReleaseOrder
    initial_state: PENDING
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/release-orders/{id}/approve"
        actor: PlantAdmin
        preconditions:
          - "Release is PENDING (else ERR_INVALID_STATE)"
          - "Program status IN {ACTIVE, REPLENISHMENT_NEEDED} (else ERR_PROGRAM_NOT_RELEASABLE)"
        side_effects: ["Increments ReleaseOrder.version by 1 (commit already counted from creation)"]
      - from: APPROVED
        to: SHIPPED
        trigger: "POST /api/release-orders/{id}/ship"
        actor: ProductionPlanner
        preconditions:
          - "Release is APPROVED (else ERR_INVALID_STATE)"
          - "Program status IN {ACTIVE, REPLENISHMENT_NEEDED} (else ERR_PROGRAM_NOT_RELEASABLE)"
        side_effects:
          - "Cascade link 1: program.on_hand_qty -= qty; program.committed_qty -= qty (program_balance_rollup)"
          - "Cascade link 2: reorder_threshold_check — if on_hand_qty now <= reorder_point, program -> REPLENISHMENT_NEEDED"
          - "Cascade link 3: on the flip to REPLENISHMENT_NEEDED, auto-create the replenishment BoxOrder in DRAFT"
          - "Increments ReleaseOrder.version by 1 and InventoryProgram.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/release-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Release is PENDING (else ERR_INVALID_STATE)"
          - "Acting customer owns the program (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "program.committed_qty -= qty (program_balance_rollup); on_hand_qty unchanged"
          - "Increments ReleaseOrder.version by 1 and InventoryProgram.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/release-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Release is APPROVED (else ERR_INVALID_STATE)"
          - "Acting customer owns the program (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "program.committed_qty -= qty (program_balance_rollup); on_hand_qty unchanged"
          - "Increments ReleaseOrder.version by 1 and InventoryProgram.version by 1"

  - entity: QualityClaim
    initial_state: OPEN
    terminal_states: [RESOLVED_CREDIT, RESOLVED_REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/quality-claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions: ["Claim is OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["Increments QualityClaim.version by 1"]
      - from: UNDER_REVIEW
        to: RESOLVED_CREDIT
        trigger: "POST /api/quality-claims/{id}/resolve with outcome = CREDIT"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "adjudicating X-User-ID != filed_by_user_id (else ERR_SOD_CLAIM_SELF_ADJUDICATION)"
          - "defective_qty_verified present and 0 <= verified <= order.produced_qty (else ERR_INVALID_QUANTITY)"
        side_effects:
          - "claim_credit RESOLUTION variant computes final_credit_dollars; adjudicated_by_user_id stamped"
          - "Increments QualityClaim.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_REJECTED
        trigger: "POST /api/quality-claims/{id}/resolve with outcome = REJECTED"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "adjudicating X-User-ID != filed_by_user_id (else ERR_SOD_CLAIM_SELF_ADJUDICATION)"
        side_effects:
          - "final_credit_dollars := 0.00; adjudicated_by_user_id stamped"
          - "Increments QualityClaim.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-order
    parent_entity: BoxOrder
    write_endpoint: "POST /api/box-orders/{orderId}/quotes"
    occ_field: expected_order_version
    description: |
      Creating a PriceQuote against a BoxOrder whose version has advanced since
      the client last observed it is rejected. A re-quote legitimately supersedes
      the prior OPEN quote and bumps BoxOrder.version, so a second create that
      still carries the previously observed version is stale and fails with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: freight_tiered_pricing
    trigger: "PriceQuote creation (PROVISIONAL variant) and POST /api/box-orders/{id}/invoice (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      area_sqft_per_box = ROUND4(blank_width_in * blank_length_in / 144)
      billable_msf      = ROUND4(Q * area_sqft_per_box / 1000)      # Q = quantity (PROVISIONAL) | produced_qty (FINAL)
      rate_per_msf      = unit_price_per_msf + COLOR_SURCHARGE_PER_MSF * color_count
      routing_mult      = 1.12 if routing_type == DIE_CUT else 1.00
      merchandise_total = ROUND2(billable_msf * rate_per_msf * routing_mult)
      freight_tier      = LOCAL if distance_miles_from_plant <= 150.00
                          else REGIONAL if <= 400.00 else NATIONAL
      freight_charge    = ROUND2(billable_msf * TIER_RATE[freight_tier])
    input_set: "The parent BoxOrder (quantity or produced_qty, dimensions, routing_type, ink_colors) and its CustomerAccount.distance_miles_from_plant; unit_price_per_msf locked from the quote"
    constants:
      LOCAL_MAX_MILES: 150.00
      REGIONAL_MAX_MILES: 400.00
      TIER_RATE_LOCAL: 18.00
      TIER_RATE_REGIONAL: 32.00
      TIER_RATE_NATIONAL: 47.00
      COLOR_SURCHARGE_PER_MSF: 1.50
      DIE_CUT_ROUTING_MULT: 1.12
    precision: "area and billable_msf at 4 decimal places, money at 2 decimal places, round_half_up at each pinned step"
    variants:
      - name: PROVISIONAL
        when: "PriceQuote creation"
        difference: "Q = order.quantity (ordered count)"
      - name: FINAL
        when: "Invoicing"
        difference: "Q = order.produced_qty (actual count); rates re-derived from the same locked unit price, so totals diverge whenever produced_qty != quantity"

  - name: volume_discount_total
    trigger: "PriceQuote creation (quote fields) and invoicing (invoice fields), immediately after freight_tiered_pricing"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order — removes the circular reading "total sets tier, tier sets total":
      #   1) merchandise_total (from freight_tiered_pricing)
      #   2) discount tier keyed on merchandise_total ONLY (never on merchandise + freight, never on the post-discount total)
      #   3) discount_dollars
      #   4) grand total = merchandise - discount + freight
      discount_pct  = 0.00 if merchandise_total < 5000.00
                      else 0.02 if merchandise_total < 20000.00 else 0.04
      discount      = ROUND2(merchandise_total * discount_pct)
      grand_total   = merchandise_total - discount + freight_charge     # exact 2dp subtraction/addition, no further rounding
    input_set: "merchandise_total and freight_charge of the quote or invoice being computed"
    constants:
      TIER1_MIN_DOLLARS: 5000.00
      TIER1_PCT: 0.02
      TIER2_MIN_DOLLARS: 20000.00
      TIER2_PCT: 0.04
    precision: "2 decimal places, round_half_up on the discount multiplication only"

  - name: claim_credit
    trigger: "QualityClaim creation (FILING variant) and resolve with outcome CREDIT (RESOLUTION variant)"
    algorithm: aggregation
    formula: |
      per_box_price      = ROUND4(order.invoice_merchandise_dollars / order.produced_qty)   # snapshotted at filing
      provisional_credit = ROUND2(defective_qty_claimed * per_box_price)
      final_credit       = ROUND2(defective_qty_verified * per_box_price) + MIN(COALESCE(actual_return_freight_dollars, 0), FREIGHT_REIMB_CAP)
    input_set: "The claim's quantities and the INVOICED parent BoxOrder's invoice_merchandise_dollars / produced_qty"
    constants:
      FREIGHT_REIMB_CAP: 500.00
    precision: "per_box at 4 decimal places, credits at 2 decimal places, round_half_up"
    variants:
      - name: FILING
        when: "Claim creation"
        difference: "Uses defective_qty_claimed and no freight reimbursement"
      - name: RESOLUTION
        when: "Resolve with outcome CREDIT"
        difference: "Uses defective_qty_verified and adds capped freight reimbursement; diverges from FILING whenever verified != claimed or freight > 0"

  - name: trim_optimization
    trigger: "Attach (POST /api/corrugator-runs/{id}/orders), detach via order cancel, run cancel"
    algorithm: aggregation
    formula: |
      consumed_width_in = SUM(outs * blank_width_in) over orders currently attached to the run
      trim_waste_in     = web_width_in - consumed_width_in
      trim_waste_pct    = ROUND2(100 * trim_waste_in / web_width_in)
      # Feasibility gates enforced as validations: consumed_width_in <= web_width_in at attach;
      # trim_waste_in <= MAX_TRIM_WASTE_IN at run completion (attach is incremental)
    input_set: "BoxOrders with corrugator_run_id == run.id and status == SCHEDULED, in any order (summation is order-insensitive)"
    constants:
      MAX_TRIM_WASTE_IN: 8.0
    precision: "widths exact decimals; trim_waste_pct 2 decimal places round_half_up"

  - name: shift_capacity_rollup
    trigger: "WorkShift creation; CorrugatorRun create/complete/cancel; ConvertingBooking create/start/complete/cancel"
    algorithm: aggregation
    formula: |
      capacity_minutes  = end_minute - start_minute
      scheduled_minutes = SUM(end_minute - start_minute) over CorrugatorRuns on this shift with status IN {SCHEDULED, COMPLETED}
                        + SUM(end_minute - start_minute) over ConvertingBookings on this shift with status IN {QUEUED, RUNNING, COMPLETED}
      available_minutes = capacity_minutes - scheduled_minutes
    input_set: "Runs and bookings on this WorkShift; CANCELLED runs/bookings contribute 0"
    precision: "integer minutes"
    variants: []

  - name: program_balance_rollup
    trigger: "InventoryProgram creation/receipt; ReleaseOrder create/approve/ship/cancel"
    algorithm: aggregation
    formula: |
      committed_qty = SUM(qty) over ReleaseOrders of this program with status IN {PENDING, APPROVED}
      available_qty = on_hand_qty - committed_qty
    input_set: "ReleaseOrders of the program in PENDING or APPROVED status only (SHIPPED and CANCELLED excluded)"
    precision: "integer units"
    variants: []

  - name: credit_exposure_rollup
    trigger: "Quote acceptance, order cancellation, invoicing"
    algorithm: aggregation
    formula: |
      credit_exposure_dollars = SUM(committed_value_dollars) over the customer's BoxOrders
        with status IN {ACCEPTED, SCHEDULED, AWAITING_CONVERTING, DIE_CUT_QUEUED, SLOTTED_QUEUED, CONVERTING, PRODUCED}
    input_set: "The CustomerAccount's BoxOrders in the listed pipeline states; DRAFT/QUOTED (uncommitted) and INVOICED/CANCELLED excluded"
    precision: "2 decimal places, round_half_up (sum of already-rounded 2dp values)"
    variants: []

  - name: reorder_threshold_check
    trigger: "After every release ship (decrement) and every receipt (increment) on an InventoryProgram"
    algorithm: threshold
    formula: |
      if status == ACTIVE and on_hand_qty <= reorder_point:      status = REPLENISHMENT_NEEDED (+ auto-create replenishment BoxOrder)
      if status == REPLENISHMENT_NEEDED and on_hand_qty > reorder_point:  status = ACTIVE
      # boundary: on_hand_qty == reorder_point flips INTO REPLENISHMENT_NEEDED but does NOT flip back to ACTIVE
    input_set: "The InventoryProgram whose on_hand_qty just changed"
    precision: "integer comparison, inclusive <="
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "For Customer-role writes, the CustomerAccount id in X-User-ID owns the target (program.customer_id == X-User-ID)", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: ["POST /api/inventory-programs/{id}/release-orders", "POST /api/release-orders/{id}/cancel"] }
  - { priority: 3, category: existence, check: "Every path id and every body-supplied FK resolves to an existing entity", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource is in a state from which the requested transition is defined (generic wrong-state)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "expected_order_version equals the BoxOrder's current version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /api/box-orders/{id}/quotes"] }
  - { priority: 4, category: state, check: "Release create/approve/ship only while program status permits (create requires ACTIVE; approve/ship require ACTIVE or REPLENISHMENT_NEEDED)", error_id: ERR_PROGRAM_NOT_RELEASABLE, http_status: 409, applies_to: ["POST /api/inventory-programs/{id}/release-orders", "POST /api/release-orders/{id}/approve", "POST /api/release-orders/{id}/ship"] }
  - { priority: 4, category: state, check: "Quote accept requires the quote to be OPEN", error_id: ERR_QUOTE_NOT_OPEN, http_status: 409, applies_to: ["POST /api/price-quotes/{id}/accept"] }
  - { priority: 5, category: business_safety, check: "order.min_ect_required <= board_grade.ect_rating_lbs_per_in (equality passes)", error_id: ERR_ECT_SPEC_NOT_MET, http_status: 422, applies_to: ["POST /api/box-orders"] }
  - { priority: 5, category: business_safety, check: "BOARD_WARP claims require measured_warp_pct >= 2.0 (equality passes)", error_id: ERR_WARP_BELOW_THRESHOLD, http_status: 422, applies_to: ["POST /api/quality-claims"] }
  - { priority: 6, category: business_constraint, check: "Request body well-formed: required fields present, enums valid, numeric > 0 where required, end_minute > start_minute", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: business_constraint, check: "Quantities that must be strictly positive or within a stated range (qty > 0; 0 <= defective_qty_verified <= produced_qty)", error_id: ERR_INVALID_QUANTITY, http_status: 400, applies_to: ["POST /api/inventory-programs/{id}/release-orders", "POST /api/inventory-programs/{id}/receipts", "POST /api/quality-claims/{id}/resolve"] }
  - { priority: 6, category: business_constraint, check: "board_source == SHEET_FEEDER requires sheet_supplier_name; INTERNAL forbids it", error_id: ERR_SUPPLIER_REQUIRED, http_status: 422, applies_to: ["POST /api/box-orders"] }
  - { priority: 6, category: business_constraint, check: "board_source consistency downstream: only INTERNAL orders attach to corrugator runs; only SHEET_FEEDER orders take mark-sheets-received", error_id: ERR_BOARD_SOURCE_MISMATCH, http_status: 422, applies_to: ["POST /api/corrugator-runs/{id}/orders", "POST /api/box-orders/{id}/mark-sheets-received"] }
  - { priority: 6, category: business_constraint, check: "grade_code unique across BoardGrades", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: ["POST /api/board-grades"] }
  - { priority: 6, category: business_constraint, check: "Machine compatibility: CorrugatorRun only on CORRUGATOR shifts; ConvertingBooking DIE_CUT only on DIE_CUTTER, SLOTTED only on FFG", error_id: ERR_MACHINE_TYPE_MISMATCH, http_status: 422, applies_to: ["POST /api/corrugator-runs", "POST /api/converting-bookings"] }
  - { priority: 6, category: business_constraint, check: "Attached order's board_grade_id equals the run's board_grade_id", error_id: ERR_ORDER_GRADE_MISMATCH, http_status: 422, applies_to: ["POST /api/corrugator-runs/{id}/orders"] }
  - { priority: 4, category: state, check: "Run/booking creation and order attach require the parent WorkShift to be OPEN", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /api/corrugator-runs", "POST /api/converting-bookings", "POST /api/corrugator-runs/{id}/orders"] }
  - { priority: 6, category: business_constraint, check: "After attach, consumed_width_in <= run.web_width_in (exact fit allowed)", error_id: ERR_TRIM_WIDTH_EXCEEDS_WEB, http_status: 422, applies_to: ["POST /api/corrugator-runs/{id}/orders"] }
  - { priority: 6, category: business_constraint, check: "At run completion, trim_waste_in <= 8.0 (exactly 8.0 allowed)", error_id: ERR_TRIM_WASTE_EXCESSIVE, http_status: 422, applies_to: ["POST /api/corrugator-runs/{id}/complete"] }
  - { priority: 6, category: business_constraint, check: "produced_qty within [floor(0.90 * quantity), ceil(1.10 * quantity)] inclusive", error_id: ERR_OVERRUN_TOLERANCE_EXCEEDED, http_status: 422, applies_to: ["POST /api/converting-bookings/{id}/complete"] }
  - { priority: 6, category: business_constraint, check: "Segregation of duties: resolving X-User-ID differs from claim.filed_by_user_id", error_id: ERR_SOD_CLAIM_SELF_ADJUDICATION, http_status: 422, applies_to: ["POST /api/quality-claims/{id}/resolve"] }
  - { priority: 7, category: business_referential, check: "Referenced BoardGrade is ACTIVE at order creation and at quote acceptance", error_id: ERR_GRADE_DISCONTINUED, http_status: 422, applies_to: ["POST /api/box-orders", "POST /api/price-quotes/{id}/accept"] }
  - { priority: 8, category: business_temporal, check: "Run/booking window lies inside its shift window [start_minute, end_minute] (inclusive both ends)", error_id: ERR_OUTSIDE_SHIFT_WINDOW, http_status: 422, applies_to: ["POST /api/corrugator-runs", "POST /api/converting-bookings"] }
  - { priority: 8, category: business_temporal, check: "Corrugator runs on the same shift use pairwise half-open [start, end) overlap: reject if new.start < existing.end AND existing.start < new.end for any non-CANCELLED run; adjacency (new.start == existing.end) is allowed", error_id: ERR_RUN_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/corrugator-runs"] }
  - { priority: 8, category: business_temporal, check: "Converting bookings append after the latest existing non-CANCELLED booking on the shift: new.start_minute >= prev.end_minute + gap, gap = 15 when ink sets are equal else 45 (shift with no prior bookings: any in-window start)", error_id: ERR_BOOKING_CHANGEOVER_CONFLICT, http_status: 409, applies_to: ["POST /api/converting-bookings"] }
  - { priority: 8, category: business_temporal, check: "Quote accept on or before expires_on per the logical clock; a later date marks the quote EXPIRED and fails", error_id: ERR_QUOTE_EXPIRED, http_status: 409, applies_to: ["POST /api/price-quotes/{id}/accept"] }
  - { priority: 9, category: business_fiscal, check: "At accept: customer.credit_exposure_dollars + quote.quote_total_dollars <= customer.credit_limit_dollars (equality passes)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /api/price-quotes/{id}/accept"] }
  - { priority: 9, category: business_fiscal, check: "Release creation: qty <= program.available_qty (equality passes)", error_id: ERR_INSUFFICIENT_PROGRAM_BALANCE, http_status: 422, applies_to: ["POST /api/inventory-programs/{id}/release-orders"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Sets the logical clock; before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time", roles: [PlantAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [logical clock advanced] }

  - { method: POST, path: "/api/customer-accounts", description: "Create a customer account", roles: [SalesRep], code: 201, input: [account_name, ship_to_city, distance_miles_from_plant, credit_limit_dollars], output: CustomerAccount, side_effects: [credit_exposure_dollars initialized to 0] }
  - { method: GET, path: "/api/customer-accounts/{id}", description: "Fetch one customer (exposure visible here)", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: CustomerAccount, side_effects: [] }

  - { method: POST, path: "/api/board-grades", description: "Register a board combination with ECT/burst spec", roles: [PlantAdmin], code: 201, input: [grade_code, liner_combo, flute, ect_rating_lbs_per_in, burst_rating_psi, basis_weight_lbs_per_msf], output: BoardGrade, side_effects: [] }
  - { method: GET, path: "/api/board-grades/{id}", description: "Fetch one board grade", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: BoardGrade, side_effects: [] }
  - { method: POST, path: "/api/board-grades/{id}/discontinue", description: "Discontinue a grade (blocks future orders/acceptances)", roles: [PlantAdmin], code: 200, input: [], output: BoardGrade, side_effects: ["BoardGrade ACTIVE -> DISCONTINUED"] }

  - { method: POST, path: "/api/box-orders", description: "Create a box order (routing, board source, ECT spec, ink colors)", roles: [SalesRep], code: 201, input: [customer_id, board_grade_id, routing_type, board_source, "sheet_supplier_name?", quantity, blank_width_in, blank_length_in, min_ect_required, "ink_colors?"], output: BoxOrder, side_effects: ["area_sqft_per_box and color_count computed; status DRAFT"] }
  - { method: GET, path: "/api/box-orders/{id}", description: "Fetch one box order", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: BoxOrder, side_effects: [] }
  - { method: GET, path: "/api/box-orders", description: "List box orders with optional filters", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["customer_id?", "board_grade_id?", "corrugator_run_id?", "status?", "limit?", "offset?"], output: "BoxOrder[]", side_effects: [] }
  - { method: POST, path: "/api/box-orders/{id}/cancel", description: "Cancel a cancellable order; cascades to run trim, bookings, quotes, exposure", roles: [SalesRep], code: 200, input: [], output: BoxOrder, side_effects: ["BoxOrder -> CANCELLED with per-state cascades (see state machine)"] }
  - { method: POST, path: "/api/box-orders/{id}/mark-sheets-received", description: "SHEET_FEEDER orders: sheets arrived from the feeder; order ready for converting", roles: [ProductionPlanner], code: 200, input: [], output: BoxOrder, side_effects: ["BoxOrder ACCEPTED -> AWAITING_CONVERTING"] }
  - { method: POST, path: "/api/box-orders/{id}/invoice", description: "Invoice a PRODUCED order with FINAL-variant pricing from produced_qty", roles: [SalesRep], code: 200, input: [], output: BoxOrder, side_effects: ["FINAL pricing computed into invoice_* fields; ACCEPTED quote -> INVOICED; customer exposure recomputed"] }

  - { method: POST, path: "/api/box-orders/{id}/quotes", description: "Create a price quote on an order (OCC on expected_order_version; supersedes prior OPEN quotes)", roles: [SalesRep], code: 201, input: [unit_price_per_msf, expires_on, expected_order_version], output: PriceQuote, side_effects: ["freight_tiered_pricing PROVISIONAL variant + volume_discount_total compute the quote fields; prior OPEN quotes -> SUPERSEDED; order DRAFT -> QUOTED (or QUOTED -> QUOTED); increments BoxOrder.version by 1"] }
  - { method: GET, path: "/api/box-orders/{id}/quotes", description: "List quotes of an order", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["limit?", "offset?"], output: "PriceQuote[]", side_effects: [] }
  - { method: POST, path: "/api/price-quotes/{id}/accept", description: "Accept an OPEN quote (expiry, grade-active, and credit-limit checks)", roles: [SalesRep], code: 200, input: [], output: PriceQuote, side_effects: ["quote OPEN -> ACCEPTED; order QUOTED -> ACCEPTED; committed_value_dollars set; exposure recomputed"] }

  - { method: POST, path: "/api/work-shifts", description: "Open a machine shift window", roles: [ProductionPlanner], code: 201, input: [machine_code, shift_date, start_minute, end_minute], output: WorkShift, side_effects: ["capacity_minutes computed; scheduled_minutes = 0"] }
  - { method: GET, path: "/api/work-shifts/{id}", description: "Fetch one work shift (capacity/scheduled/available visible here)", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: WorkShift, side_effects: [] }
  - { method: POST, path: "/api/work-shifts/{id}/cancel", description: "Cancel a shift; cascades to runs, bookings, and their orders", roles: [ProductionPlanner], code: 200, input: [], output: WorkShift, side_effects: ["runs SCHEDULED -> CANCELLED; bookings QUEUED|RUNNING -> CANCELLED; orders revert per cascade"] }

  - { method: POST, path: "/api/corrugator-runs", description: "Schedule a corrugator run on a CORRUGATOR shift (half-open overlap check)", roles: [ProductionPlanner], code: 201, input: [work_shift_id, board_grade_id, start_minute, end_minute, web_width_in], output: CorrugatorRun, side_effects: ["status SCHEDULED; shift_capacity_rollup recomputes shift"] }
  - { method: GET, path: "/api/corrugator-runs/{id}", description: "Fetch one corrugator run (trim fields visible here)", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: CorrugatorRun, side_effects: [] }
  - { method: GET, path: "/api/corrugator-runs", description: "List corrugator runs with optional filters", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["work_shift_id?", "board_grade_id?", "status?", "limit?", "offset?"], output: "CorrugatorRun[]", side_effects: [] }
  - { method: POST, path: "/api/corrugator-runs/{id}/orders", description: "Attach an ACCEPTED INTERNAL order to a run with an out count (trim gates)", roles: [ProductionPlanner], code: 200, input: [box_order_id, outs], output: CorrugatorRun, side_effects: ["order ACCEPTED -> SCHEDULED, corrugator_run_id set; trim_optimization recomputes run widths"] }
  - { method: POST, path: "/api/corrugator-runs/{id}/complete", description: "Complete a run; attached orders advance to AWAITING_CONVERTING", roles: [ProductionPlanner], code: 200, input: [], output: CorrugatorRun, side_effects: ["run -> COMPLETED; attached orders SCHEDULED -> AWAITING_CONVERTING"] }
  - { method: POST, path: "/api/corrugator-runs/{id}/cancel", description: "Cancel a scheduled run; attached orders revert to ACCEPTED", roles: [ProductionPlanner], code: 200, input: [], output: CorrugatorRun, side_effects: ["run -> CANCELLED; attached orders revert SCHEDULED -> ACCEPTED; shift rollup recomputed"] }

  - { method: POST, path: "/api/converting-bookings", description: "Book an AWAITING_CONVERTING order onto a DIE_CUTTER or FFG shift (ink changeover gap rule)", roles: [ProductionPlanner], code: 201, input: [box_order_id, work_shift_id, start_minute, end_minute], output: ConvertingBooking, side_effects: ["booking QUEUED with ink snapshot; order -> DIE_CUT_QUEUED | SLOTTED_QUEUED by routing; shift rollup recomputed"] }
  - { method: GET, path: "/api/converting-bookings/{id}", description: "Fetch one converting booking", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: ConvertingBooking, side_effects: [] }
  - { method: GET, path: "/api/converting-bookings", description: "List converting bookings with optional filters", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["work_shift_id?", "box_order_id?", "status?", "limit?", "offset?"], output: "ConvertingBooking[]", side_effects: [] }
  - { method: POST, path: "/api/converting-bookings/{id}/start", description: "Start a queued booking", roles: [ProductionPlanner], code: 200, input: [], output: ConvertingBooking, side_effects: ["booking QUEUED -> RUNNING; order -> CONVERTING"] }
  - { method: POST, path: "/api/converting-bookings/{id}/complete", description: "Complete a running booking with the produced quantity (+/-10% overrun gate)", roles: [ProductionPlanner], code: 200, input: [produced_qty], output: ConvertingBooking, side_effects: ["booking RUNNING -> COMPLETED; order -> PRODUCED with produced_qty"] }
  - { method: POST, path: "/api/converting-bookings/{id}/cancel", description: "Cancel a queued or running booking; order reverts to AWAITING_CONVERTING", roles: [ProductionPlanner], code: 200, input: [], output: ConvertingBooking, side_effects: ["booking -> CANCELLED; order reverts to AWAITING_CONVERTING; shift rollup recomputed"] }

  - { method: POST, path: "/api/inventory-programs", description: "Create a customer inventory (VMI) program with reorder point", roles: [SalesRep], code: 201, input: [customer_id, board_grade_id, program_name, routing_type, blank_width_in, blank_length_in, reorder_point, replenishment_qty], output: InventoryProgram, side_effects: ["on_hand_qty = 0, committed_qty = 0, status ACTIVE"] }
  - { method: GET, path: "/api/inventory-programs/{id}", description: "Fetch one inventory program (balances visible here)", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: [], output: InventoryProgram, side_effects: [] }
  - { method: GET, path: "/api/inventory-programs", description: "List inventory programs with optional filters", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["customer_id?", "board_grade_id?", "status?", "limit?", "offset?"], output: "InventoryProgram[]", side_effects: [] }
  - { method: POST, path: "/api/inventory-programs/{id}/receipts", description: "Receive produced goods into program stock", roles: [ProductionPlanner], code: 200, input: [qty], output: InventoryProgram, side_effects: ["on_hand_qty += qty; program_balance_rollup recomputes available_qty; reorder_threshold_check may flip REPLENISHMENT_NEEDED -> ACTIVE; increments InventoryProgram.version by 1"] }
  - { method: POST, path: "/api/inventory-programs/{id}/suspend", description: "Suspend a program (blocks releases)", roles: [PlantAdmin], code: 200, input: [], output: InventoryProgram, side_effects: ["program ACTIVE|REPLENISHMENT_NEEDED -> SUSPENDED"] }
  - { method: POST, path: "/api/inventory-programs/{id}/reactivate", description: "Reactivate a suspended program", roles: [PlantAdmin], code: 200, input: [], output: InventoryProgram, side_effects: ["program SUSPENDED -> ACTIVE"] }

  - { method: POST, path: "/api/inventory-programs/{id}/release-orders", description: "Customer releases stock against its own program", roles: [Customer], code: 201, input: [qty, requested_ship_date], output: ReleaseOrder, side_effects: ["release PENDING; committed_qty += qty (program_balance_rollup)"] }
  - { method: GET, path: "/api/inventory-programs/{id}/release-orders", description: "List release orders of a program", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["status?", "limit?", "offset?"], output: "ReleaseOrder[]", side_effects: [] }
  - { method: POST, path: "/api/release-orders/{id}/approve", description: "Approve a pending release", roles: [PlantAdmin], code: 200, input: [], output: ReleaseOrder, side_effects: ["release PENDING -> APPROVED"] }
  - { method: POST, path: "/api/release-orders/{id}/ship", description: "Ship an approved release; decrements stock and may trigger replenishment", roles: [ProductionPlanner], code: 200, input: [], output: ReleaseOrder, side_effects: ["release -> SHIPPED; on_hand/committed decremented; reorder_threshold_check cascade may flip program and auto-create DRAFT replenishment BoxOrder"] }
  - { method: POST, "path": "/api/release-orders/{id}/cancel", description: "Customer cancels its own pending/approved release; commitment restored", roles: [Customer], code: 200, input: [], output: ReleaseOrder, side_effects: ["release -> CANCELLED; committed_qty -= qty"] }

  - { method: POST, path: "/api/quality-claims", description: "File a damage/board-warp claim against an INVOICED order", roles: [CustomerService], code: 201, input: [box_order_id, claim_type, defective_qty_claimed, "measured_warp_pct?"], output: QualityClaim, side_effects: ["per_box_price_dollars snapshotted; provisional_credit_dollars computed; filed_by_user_id stamped"] }
  - { method: GET, path: "/api/box-orders/{id}/quality-claims", description: "List claims filed against an order", roles: [PlantAdmin, SalesRep, ProductionPlanner, CustomerService, ClaimsAdjuster, Customer], code: 200, input: ["limit?", "offset?"], output: "QualityClaim[]", side_effects: [] }
  - { method: POST, path: "/api/quality-claims/{id}/start-review", description: "Open claim enters adjudication review", roles: [ClaimsAdjuster], code: 200, input: [], output: QualityClaim, side_effects: ["claim OPEN -> UNDER_REVIEW"] }
  - { method: POST, path: "/api/quality-claims/{id}/resolve", description: "Adjudicate a claim (segregation of duties enforced); computes final credit", roles: [ClaimsAdjuster], code: 200, input: [outcome, "defective_qty_verified?", "actual_return_freight_dollars?"], output: QualityClaim, side_effects: ["claim -> RESOLVED_CREDIT | RESOLVED_REJECTED; final_credit_dollars computed (RESOLUTION variant); adjudicated_by_user_id stamped"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Customer-role caller does not own the target program/release" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive number, end <= start" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "Quantity out of its allowed range (qty <= 0; verified qty outside 0..produced_qty)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match the BoxOrder's current version (OCC)" }
  - { id: ERR_PROGRAM_NOT_RELEASABLE, http: 409, condition: "Release create/approve/ship while program status does not permit it" }
  - { id: ERR_QUOTE_NOT_OPEN, http: 409, condition: "Accept attempted on a quote that is not OPEN" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted after quote.expires_on per the logical clock; quote marked EXPIRED" }
  - { id: ERR_ECT_SPEC_NOT_MET, http: 422, condition: "order.min_ect_required exceeds the grade's ect_rating_lbs_per_in" }
  - { id: ERR_WARP_BELOW_THRESHOLD, http: 422, condition: "BOARD_WARP claim with measured_warp_pct < 2.0" }
  - { id: ERR_SUPPLIER_REQUIRED, http: 422, condition: "SHEET_FEEDER order without sheet_supplier_name, or INTERNAL order with one" }
  - { id: ERR_BOARD_SOURCE_MISMATCH, http: 422, condition: "INTERNAL order sent to mark-sheets-received, or SHEET_FEEDER order attached to a corrugator run" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "board grade_code already exists" }
  - { id: ERR_MACHINE_TYPE_MISMATCH, http: 422, condition: "Run on a non-CORRUGATOR shift, or booking machine incompatible with routing_type" }
  - { id: ERR_ORDER_GRADE_MISMATCH, http: 422, condition: "Attached order's grade differs from the run's grade" }
  - { id: ERR_TRIM_WIDTH_EXCEEDS_WEB, http: 422, condition: "Attach would push consumed_width_in above web_width_in" }
  - { id: ERR_TRIM_WASTE_EXCESSIVE, http: 422, condition: "Attach would leave trim_waste_in above 8.0 inches" }
  - { id: ERR_OVERRUN_TOLERANCE_EXCEEDED, http: 422, condition: "produced_qty outside the +/-10% inclusive band around quantity" }
  - { id: ERR_SOD_CLAIM_SELF_ADJUDICATION, http: 422, condition: "Resolving user id equals the claim's filed_by_user_id" }
  - { id: ERR_GRADE_DISCONTINUED, http: 422, condition: "Order creation or quote acceptance references a DISCONTINUED grade" }
  - { id: ERR_OUTSIDE_SHIFT_WINDOW, http: 422, condition: "Run/booking window not contained in the shift window" }
  - { id: ERR_RUN_WINDOW_OVERLAP, http: 409, condition: "Corrugator run overlaps another non-CANCELLED run on the shift (half-open; adjacency allowed)" }
  - { id: ERR_BOOKING_CHANGEOVER_CONFLICT, http: 409, condition: "Booking violates the append-after-latest rule with the 15/45-minute ink changeover gap" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Acceptance would push customer exposure above credit_limit_dollars" }
  - { id: ERR_INSUFFICIENT_PROGRAM_BALANCE, http: 422, condition: "Release qty exceeds program available_qty" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator: master data, program governance, release approval, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/board-grades, POST /api/board-grades/{id}/discontinue"
      - "POST /api/inventory-programs/{id}/suspend, POST /api/inventory-programs/{id}/reactivate"
      - "POST /api/release-orders/{id}/approve"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SalesRep
    description: "Sales representative: customers, orders, quotes, invoicing, program setup"
    identity: opaque
    exclusive_operations:
      - "POST /api/customer-accounts"
      - "POST /api/box-orders, POST /api/box-orders/{id}/cancel, POST /api/box-orders/{id}/invoice"
      - "POST /api/box-orders/{id}/quotes, POST /api/price-quotes/{id}/accept"
      - "POST /api/inventory-programs"
    shared_operations: ["all GET endpoints"]
  - name: ProductionPlanner
    description: "Production planner: shifts, corrugator runs, converting bookings, receipts, shipments"
    identity: opaque
    exclusive_operations:
      - "POST /api/work-shifts, POST /api/work-shifts/{id}/cancel"
      - "POST /api/corrugator-runs and its orders/complete/cancel actions"
      - "POST /api/converting-bookings and its start/complete/cancel actions"
      - "POST /api/box-orders/{id}/mark-sheets-received"
      - "POST /api/inventory-programs/{id}/receipts"
      - "POST /api/release-orders/{id}/ship"
    shared_operations: ["all GET endpoints"]
  - name: CustomerService
    description: "Customer service representative: claim intake"
    identity: opaque
    exclusive_operations: ["POST /api/quality-claims"]
    shared_operations: ["all GET endpoints"]
  - name: ClaimsAdjuster
    description: "Claims adjudicator: reviews and resolves claims; may not resolve a claim filed under the same user id (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/quality-claims/{id}/start-review"
      - "POST /api/quality-claims/{id}/resolve"
    shared_operations: ["all GET endpoints"]
  - name: Customer
    description: "Customer account holder: releases stock against its own inventory programs"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /api/inventory-programs/{id}/release-orders"
      - "POST /api/release-orders/{id}/cancel"
    shared_operations: ["all GET endpoints"]
