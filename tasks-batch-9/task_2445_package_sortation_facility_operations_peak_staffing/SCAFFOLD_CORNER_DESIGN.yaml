      - name: resolving_and_closing_twice_refused
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_INVALID_EXCEPTION_STATE
          - state_machines.PackageException.OPEN_to_RESOLVED
          - state_machines.InjuryReport.OPEN_to_CLOSED
        distinguishing_aspect: "One error id guards two terminal transitions: a second resolve on a RESOLVED exception and a second close on a CLOSED injury both return ERR_INVALID_EXCEPTION_STATE, and neither double-applies its counter side effect."
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1, 500 packages inducted, one OPEN DAMAGED exception of 50 packages debited from work-in-process, and one OPEN FIRST_AID injury"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-A", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", priority_class: "STANDARD", manifest_package_count: 500 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "DAMAGED", package_count: 50 }
              as: SortSupervisor
              captures: { exc_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Bruised Bailey", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
            - call: "POST /sortation/injury-reports"
              payload: { sort_center_id: "${center_id}", worker_id: "${w_id}", severity: "FIRST_AID", body_part: "FINGER", occurred_at: "2026-08-03T08:00:00Z" }
              as: SortSupervisor
              captures: { injury_id: $.data.id }
          trigger:
            - call: "POST /sortation/package-exceptions/${exc_id}/resolve"
              payload: { resolution: "DISPOSE" }
              as: SortSupervisor
            - call: "POST /sortation/package-exceptions/${exc_id}/resolve"
              payload: { resolution: "DISPOSE" }
              as: SortSupervisor
            - call: "POST /sortation/injury-reports/${injury_id}/close"
              payload: { lost_time_days: 1 }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "POST /sortation/injury-reports/${injury_id}/close"
              payload: { lost_time_days: 1 }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "the first resolve returns HTTP 200 with data.status == RESOLVED, and SortCenter.${center_id}.disposed_package_count == 50 with exception_hold_count == 0"
            - "the second resolve returns HTTP 409 with data.error_id == ERR_INVALID_EXCEPTION_STATE and disposed_package_count stays 50 (no double debit)"
            - "the first close returns HTTP 200 with data.status == CLOSED and data.lost_time_days == 1"
            - "the second close returns HTTP 409 with data.error_id == ERR_INVALID_EXCEPTION_STATE"
            - "the conservation identity still holds: 500 == 450 + 0 + 50 + 0"

