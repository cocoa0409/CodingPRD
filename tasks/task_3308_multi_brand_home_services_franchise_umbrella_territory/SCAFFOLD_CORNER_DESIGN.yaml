        distinguishing_aspect: "reclaim is exclusive to FranchiseAdmin, so the franchisee that holds the territory is denied with 403 ERR_UNAUTHORIZED and the territory stays PENDING_REALLOCATION."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Territory MS-01 is PENDING_REALLOCATION, formerly held by Mosaic Central LLC."
