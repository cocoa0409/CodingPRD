# =============================================================================
# SCAFFOLD — task_2731_privatized_military_family_housing_management
# §1.0–§1.7 seed tables. Single source of truth for PRD, unit tests, and
# reference implementation.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2731. Privatized Military Family Housing Management (Balfour Beatty Communities):
  waitlist by rank category, bedroom eligibility and dependent composition, basic
  allowance for housing rent-setting and allotment collection, move-in inspection
  with tenant bill of rights acknowledgment, work-order priority classification and
  habitability escalation, environmental hazard (mold, lead) response protocol and
  displacement lodging, resident dispute resolution with the installation housing
  office, occupancy and reinvestment account performance metrics, deployment and
  permanent-change-of-station lease termination rights

domain_name: privatized-military-family-housing
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every business path is a
  # top-level collection (`/leases`, `/work-orders`, `/hazard-cases`). No
  # nested ownership URLs — the only sub-resource GETs exist to satisfy FK
  # reverse-reachability for children that are never returned by a create.

  state_machine_shape: parallel
  # Lease carries two INDEPENDENT dimensions on one row
  # (occupancy_status × allotment_status) that advance on different triggers.
  # WorkOrder is cyclic (ASSIGNED→IN_PROGRESS→COMPLETED→REOPENED→ASSIGNED),
  # WaitlistApplication is cyclic (PENDING→OFFERED→PENDING on decline),
  # DisputeCase is cyclic (UNDER_REVIEW→PROPOSED_RESOLUTION→RESIDENT_REJECTED→
  # UNDER_REVIEW) with a hard round cap, and HazardCase is a branching
  # fork-join (ASSESSED→{REMEDIATION_IN_PROGRESS | DISPLACEMENT_ACTIVE}→
  # CLEARANCE_PENDING→CLOSED) with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Installation→HousingUnit, Lease→AllotmentTransaction
    - self_referential     # WorkOrder.parent_work_order_id → WorkOrder.id
    - cross_aggregate      # HazardCase→WorkOrder, DisputeCase→AllotmentTransaction

  role_model: segregation_of_duties
  # The EnvironmentalSpecialist who assessed a HazardCase may not certify its
  # clearance; the PropertyManager user who proposed a dispute resolution may
  # not be the InstallationHousingOffice user who decides the escalation.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 64 endpoints (41 writes, 23 reads) / 46 error codes /
  # 18 calculations of which 2 are dual-variant families and 2 are compensating
  # invariants / 9 state-machine dimensions across 8 entities / 3 OCC races /
  # a 46-row single-file validation ladder spanning eight categories.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- 1. Installation --------------------------------------------------------
  - name: Installation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Installation name, e.g. Fort Cavazos Family Housing" }
      - { name: branch, type: enum, source: input, description: "Owning service branch", constraints: "ARMY | NAVY | AIR_FORCE | MARINE_CORPS" }
      - { name: mha_code, type: string, source: input, description: "Military Housing Area code used for BAH lookup, e.g. TX-FTC" }
      - { name: bill_of_rights_version, type: string, source: input, description: "Currently published Tenant Bill of Rights version string the resident must acknowledge at move-in, e.g. 2026.1" }
      - { name: turn_buffer_days, type: integer, source: input, default: 5, description: "Whole days of unit turn time required between a prior lease termination_effective_date and the start_date of the next lease on the same unit", constraints: ">= 0" }
      - { name: offer_response_hours, type: integer, source: input, default: 72, description: "Hours a waitlist offer stays open before it may no longer be accepted", constraints: ">= 1" }
      - { name: decline_limit, type: integer, source: input, default: 2, description: "Number of declines after which a WaitlistApplication becomes EXPIRED", constraints: ">= 1" }
      - { name: decline_penalty_days, type: integer, source: input, default: 15, description: "Whole days added to WaitlistApplication.effective_control_date each time an offer is declined and the application returns to PENDING", constraints: ">= 0" }
      - { name: incentive_base_pct, type: number, source: input, default: 0.03, description: "Fraction of net collected allotments forming the base performance incentive fee", constraints: "0 <= x <= 1" }
      - { name: total_unit_count, type: integer, source: computed, description: "Count of HousingUnit rows with this installation_id" }
      - { name: available_unit_count, type: integer, source: computed, description: "Count of this installation's HousingUnit rows with status == AVAILABLE" }
      - { name: assigned_unit_count, type: integer, source: computed, description: "Count of this installation's HousingUnit rows with status == ASSIGNED" }
      - { name: occupied_unit_count, type: integer, source: computed, description: "Count of this installation's HousingUnit rows with status == OCCUPIED" }
      - { name: offline_unit_count, type: integer, source: computed, description: "Count of this installation's HousingUnit rows with status == OFFLINE_MAINTENANCE" }
      - { name: hazard_hold_unit_count, type: integer, source: computed, description: "Count of this installation's HousingUnit rows with status == HAZARD_HOLD" }
      - { name: pending_application_count, type: integer, source: computed, description: "Count of this installation's WaitlistApplication rows with status == PENDING" }
      - { name: offer_run_epoch, type: integer, source: system, default: 0, description: "Incremented by 1 by every completed waitlist offer run" }
      - { name: last_offer_run_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent waitlist offer run" }

  # --- 2. BahRate (immutable configuration) -----------------------------------
  - name: BahRate
    parent: null
    common_fields: false
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; the installation whose mha_code this rate row prices" }
      - { name: pay_grade, type: string, source: input, description: "Pay grade the rate applies to", constraints: "E1..E9 | W1..W5 | O1..O10" }
      - { name: with_dependents, type: boolean, source: input, description: "true = with-dependents rate, false = without-dependents rate" }
      - { name: effective_year, type: integer, source: input, description: "Calendar year the rate table is effective for", constraints: "2024..2030" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Full monthly BAH entitlement in cents", constraints: "> 0" }
      - { name: utility_allowance_cents, type: integer, source: input, description: "Portion of the entitlement carved out as the tenant utility allowance, in cents", constraints: ">= 0 and < monthly_rate_cents" }

  # --- 3. HousingUnit ---------------------------------------------------------
  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; installation that owns the unit" }
      - { name: unit_code, type: string, source: input, description: "Street address code of the unit, unique within installation_id" }
      - { name: bedroom_count, type: integer, source: input, description: "Number of bedrooms in the unit", constraints: "1..5" }
      - { name: unit_type, type: enum, source: input, description: "Construction type driving the rent adjustment percentage", constraints: "SFH | DUPLEX | TOWNHOME | APARTMENT" }
      - { name: designated_rank_category, type: enum, source: input, description: "Rank category this unit's inventory is designated for; the waitlist offer run only offers it to applications with a matching rank_category", constraints: "JUNIOR_ENLISTED | SENIOR_ENLISTED | WARRANT_OFFICER | JUNIOR_OFFICER | SENIOR_OFFICER" }
      - { name: historic_flag, type: boolean, source: input, default: false, description: "true when the unit is on the historic register, adding a rent premium before the statutory BAH cap is applied" }
      - { name: accessibility_features, type: array, source: input, default: [], description: "Zero or more accessibility feature codes present in the unit", constraints: "each element in ROLL_IN_SHOWER | ZERO_STEP_ENTRY | WIDENED_DOORWAYS" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "Inventory status", constraints: "AVAILABLE | ASSIGNED | OCCUPIED | OFFLINE_MAINTENANCE | HAZARD_HOLD" }
      - { name: hazard_hold_reason, type: string, source: system, default: null, description: "Free-text reason stamped when status becomes HAZARD_HOLD; cleared when the hold is released" }
      - { name: last_lease_end_date, type: string, source: system, default: null, description: "ISO date (YYYY-MM-DD) termination_effective_date of the most recently TERMINATED Lease on this unit; input to the turn-buffer rule" }

  # --- 4. ServiceMember -------------------------------------------------------
  - name: ServiceMember
    parent: null
    common_fields: true
    fields:
      - { name: dodid, type: string, source: input, description: "DoD ID number, globally unique across ServiceMember rows" }
      - { name: last_name, type: string, source: input, description: "Sponsor last name" }
      - { name: first_name, type: string, source: input, description: "Sponsor first name" }
      - { name: branch, type: enum, source: input, description: "Service branch", constraints: "ARMY | NAVY | AIR_FORCE | MARINE_CORPS" }
      - { name: pay_grade, type: string, source: input, description: "Current pay grade", constraints: "E1..E9 | W1..W5 | O1..O10" }
      - { name: rank_category, type: enum, source: computed, description: "Derived from pay_grade by calculations.rank_category_derivation", constraints: "JUNIOR_ENLISTED | SENIOR_ENLISTED | WARRANT_OFFICER | JUNIOR_OFFICER | SENIOR_OFFICER" }
      - { name: deployment_status, type: enum, source: system, default: "NOT_DEPLOYED", description: "Set by POST /service-members/{id}/orders", constraints: "NOT_DEPLOYED | DEPLOYED | RETURNED" }
      - { name: deployment_orders_ref, type: string, source: system, default: null, description: "Order number backing a DEPLOYED status; required for a DEPLOYMENT lease termination right" }
      - { name: expected_return_date, type: string, source: system, default: null, description: "ISO date the member is expected to return from deployment" }
      - { name: pcs_orders_ref, type: string, source: system, default: null, description: "Order number backing permanent-change-of-station orders; required for a PCS lease termination right" }
      - { name: pcs_report_date, type: string, source: system, default: null, description: "ISO date (report-no-later-than) on the PCS orders" }
      - { name: dependent_count, type: integer, source: computed, description: "Count of Dependent rows for this member with is_full_time_custody == true" }

  # --- 5. Dependent -----------------------------------------------------------
  - name: Dependent
    parent: null
    common_fields: true
    fields:
      - { name: service_member_id, type: string, source: input, description: "FK -> ServiceMember.id; sponsoring member" }
      - { name: relationship, type: enum, source: input, description: "Relationship to the sponsor", constraints: "SPOUSE | CHILD | OTHER_AUTHORIZED" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date (YYYY-MM-DD); drives age-at-control-date bedroom sharing" }
      - { name: gender, type: enum, source: input, description: "Used only for same-gender child bedroom sharing", constraints: "MALE | FEMALE" }
      - { name: is_full_time_custody, type: boolean, source: input, default: true, description: "false dependents are excluded from ServiceMember.dependent_count and from bedroom eligibility" }

  # --- 6. WaitlistApplication -------------------------------------------------
  - name: WaitlistApplication
    parent: null
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; installation whose waitlist is joined" }
      - { name: service_member_id, type: string, source: input, description: "FK -> ServiceMember.id; sponsor applying for family housing" }
      - { name: pcs_orders_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) on the orders that establish the housing control date" }
      - { name: expected_arrival_date, type: string, source: input, description: "ISO date the family expects to arrive at the installation" }
      - { name: accessibility_required, type: boolean, source: input, default: false, description: "true restricts the candidate unit pool to units whose accessibility_features contain ROLL_IN_SHOWER" }
      - { name: rank_category, type: enum, source: computed, description: "Snapshot of ServiceMember.rank_category at application creation; never re-derived except by recertify", constraints: "JUNIOR_ENLISTED | SENIOR_ENLISTED | WARRANT_OFFICER | JUNIOR_OFFICER | SENIOR_OFFICER" }
      - { name: dependent_count_at_application, type: integer, source: computed, description: "Snapshot of ServiceMember.dependent_count at application creation; re-snapshotted by recertify" }
      - { name: bedroom_eligibility, type: integer, source: computed, description: "Bedrooms the family is entitled to, per calculations.bedroom_eligibility_determination" }
      - { name: effective_control_date, type: string, source: computed, description: "ISO date used as the primary waitlist sort key, per calculations.effective_control_date_determination" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Waitlist lifecycle", constraints: "PENDING | OFFERED | ACCEPTED | EXPIRED | HOUSED" }
      - { name: decline_count, type: integer, source: system, default: 0, description: "Number of offers this application has declined" }
      - { name: offer_count, type: integer, source: system, default: 0, description: "Number of offers this application has received" }
      - { name: offered_unit_id, type: string, source: system, default: null, description: "FK -> HousingUnit.id; unit currently or most recently offered to this application" }
      - { name: offer_expires_at, type: datetime, source: system, default: null, description: "Instant after which the open offer may no longer be accepted" }

  # --- 7. Lease (parallel state dimensions) -----------------------------------
  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> WaitlistApplication.id; the ACCEPTED application this lease realises" }
      - { name: housing_unit_id, type: string, source: input, description: "FK -> HousingUnit.id; leased unit" }
      - { name: service_member_id, type: string, source: system, description: "FK -> ServiceMember.id; copied from the application at creation" }
      - { name: start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) lease term begins" }
      - { name: term_months, type: integer, source: input, description: "Initial lease term in whole months", constraints: "1..24" }
      - { name: occupancy_status, type: enum, source: system, default: "PENDING_MOVE_IN", description: "Occupancy dimension; advances independently of allotment_status", constraints: "PENDING_MOVE_IN | OCCUPIED | NOTICE_GIVEN | TERMINATED" }
      - { name: allotment_status, type: enum, source: system, default: "NOT_STARTED", description: "Rent-collection dimension; advances independently of occupancy_status", constraints: "NOT_STARTED | ACTIVE | SUSPENDED | CLOSED" }
      - { name: rent_basis, type: enum, source: system, default: "OFFER_PROVISIONAL", description: "Which variant of calculations.gross_rent_determination produced the currently stored rent fields", constraints: "OFFER_PROVISIONAL | MOVE_IN_FINAL" }
      - { name: rent_effective_year, type: integer, source: computed, description: "effective_year of the BahRate row used for the currently stored rent fields" }
      - { name: gross_rent_cents, type: integer, source: computed, description: "Monthly gross rent charged to the tenant, per calculations.gross_rent_determination" }
      - { name: utility_allowance_cents, type: integer, source: computed, description: "Utility allowance carved out of the entitlement for the selected BahRate row" }
      - { name: net_rent_cents, type: integer, source: computed, description: "= gross_rent_cents - utility_allowance_cents; the amount collected by allotment" }
      - { name: daily_rent_cents, type: integer, source: computed, description: "Per-day proration rate, per calculations.daily_rent_rate; rounded once and then multiplied by day counts" }
      - { name: bill_of_rights_version_ack, type: string, source: system, default: null, description: "Tenant Bill of Rights version string the resident acknowledged at move-in inspection" }
      - { name: bill_of_rights_ack_at, type: datetime, source: system, default: null, description: "Instant the resident acknowledged the Tenant Bill of Rights" }
      - { name: termination_reason, type: enum, source: system, default: null, description: "Reason recorded by the termination notice", constraints: "PCS | DEPLOYMENT | SEPARATION | CONVENIENCE | LANDLORD" }
      - { name: termination_notice_date, type: string, source: system, default: null, description: "ISO date the notice was given" }
      - { name: termination_effective_date, type: string, source: system, default: null, description: "ISO date the tenancy ends; last day the unit is occupied under this lease" }
      - { name: early_termination_fee_cents, type: integer, source: computed, default: 0, description: "Fee assessed at termination, per calculations.early_termination_settlement" }
      - { name: settlement_total_cents, type: integer, source: computed, default: 0, description: "Final amount owed at termination, per calculations.early_termination_settlement" }
      - { name: allotment_balance_cents, type: integer, source: computed, default: 0, description: "= SUM(AllotmentTransaction.amount_cents) over rows whose lease_id equals this lease id; the conserved ledger quantity" }
      - { name: abatement_total_cents, type: integer, source: computed, default: 0, description: "= SUM(AllotmentTransaction.amount_cents) restricted to type IN {ABATEMENT, ARREARS_ADJUSTMENT} for this lease; returns to 0 when an abatement is fully reinstated" }

  # --- 8. MoveInInspection ----------------------------------------------------
  - name: MoveInInspection
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease being inspected before move-in" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the walkthrough is scheduled" }
      - { name: conducted_by_user_id, type: string, source: system, description: "X-User-ID of the PropertyManager who scheduled and conducted the inspection" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Inspection lifecycle", constraints: "SCHEDULED | DEFICIENCIES_LOGGED | TENANT_ACKNOWLEDGED | COMPLETED" }
      - { name: deficiencies, type: array, source: system, default: [], description: "Append-only array of deficiency objects { deficiency_code, room, severity, status, work_order_id }. deficiency_code is unique within the inspection; severity in COSMETIC | FUNCTIONAL | HABITABILITY_CRITICAL; status in OPEN | WORK_ORDER_CREATED | RESOLVED; work_order_id holds the WorkOrder.id spawned for the entry (null until spawned) and is a cross-entity handle, not a declared foreign key on this entity. deficiency_code must be one of the WorkOrder.category enum values, and the WorkOrder spawned for a HABITABILITY_CRITICAL entry copies it verbatim as its category" }
      - { name: deficiency_count, type: integer, source: computed, default: 0, description: "Length of the deficiencies array" }
      - { name: critical_open_count, type: integer, source: computed, default: 0, description: "Count of deficiencies entries with severity == HABITABILITY_CRITICAL and status != RESOLVED" }
      - { name: tenant_signature_name, type: string, source: system, default: null, description: "Printed name supplied by the resident at acknowledgment" }
      - { name: tenant_signature_at, type: datetime, source: system, default: null, description: "Instant the resident signed" }
      - { name: bill_of_rights_version_ack, type: string, source: system, default: null, description: "Tenant Bill of Rights version acknowledged; must equal Installation.bill_of_rights_version" }

  # --- 9. WorkOrder (cyclic; self-referential) --------------------------------
  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: housing_unit_id, type: string, source: input, description: "FK -> HousingUnit.id; unit the work is performed in" }
      - { name: lease_id, type: string, source: input, default: null, description: "FK -> Lease.id; lease under which the work was requested; null for work on a vacant unit" }
      - { name: parent_work_order_id, type: string, source: input, default: null, description: "FK -> WorkOrder.id; the work order whose incomplete repair spawned this follow-on order" }
      - { name: inspection_deficiency_code, type: string, source: system, default: null, description: "deficiency_code of the MoveInInspection.deficiencies entry that spawned this order; a cross-entity handle resolved together with lease_id, not a declared foreign key" }
      - { name: category, type: enum, source: input, description: "Trade category driving the base severity tier", constraints: "NO_HEAT | NO_WATER | GAS_LEAK | SEWAGE_BACKUP | ELECTRICAL | PLUMBING_LEAK | HVAC | APPLIANCE | COSMETIC | GROUNDS | MOLD_SUSPECTED | LEAD_SUSPECTED" }
      - { name: description, type: string, source: input, description: "Resident or inspector narrative" }
      - { name: habitability_impact, type: boolean, source: input, default: false, description: "true when the condition makes any part of the dwelling uninhabitable" }
      - { name: priority_class, type: enum, source: computed, description: "Per calculations.work_order_priority_classification", constraints: "EMERGENCY | URGENT | ROUTINE" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant the order was created; anchor for both SLA clocks" }
      - { name: response_due_at, type: datetime, source: computed, description: "Deadline for first response, per calculations.work_order_priority_classification" }
      - { name: completion_due_at, type: datetime, source: computed, description: "Deadline for completion, per calculations.work_order_priority_classification" }
      - { name: first_response_at, type: datetime, source: system, default: null, description: "Instant the order was first assigned to a technician" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Instant of the most recent completion" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "Per calculations.habitability_escalation_eligibility; strictly-after comparison against completion_due_at" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "Habitability escalation ladder position", constraints: "0 | 1 | 2" }
      - { name: escalated_at, type: datetime, source: system, default: null, description: "Instant of the most recent escalation" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times the resident has reopened this order" }
      - { name: assigned_tech_user_id, type: string, source: system, default: null, description: "X-User-ID of the MaintenanceTech currently assigned" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "Work lifecycle; COMPLETED is re-enterable via REOPENED, CLOSED is terminal", constraints: "SUBMITTED | ASSIGNED | IN_PROGRESS | COMPLETED | REOPENED | CLOSED" }

  # --- 10. HazardCase (branching fork-join) -----------------------------------
  - name: HazardCase
    parent: null
    common_fields: true
    fields:
      - { name: housing_unit_id, type: string, source: input, description: "FK -> HousingUnit.id; unit where the hazard was reported" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease of the affected household" }
      - { name: source_work_order_id, type: string, source: input, default: null, description: "FK -> WorkOrder.id; the MOLD_SUSPECTED / LEAD_SUSPECTED work order that surfaced the hazard" }
      - { name: remediation_work_order_id, type: string, source: system, default: null, description: "FK -> WorkOrder.id; remediation order created by the assessment; its completion drives the fork-join back to CLEARANCE_PENDING" }
      - { name: hazard_type, type: enum, source: input, description: "Hazard family, selecting the severity threshold ladder", constraints: "MOLD | LEAD_PAINT | LEAD_WATER" }
      - { name: reported_symptoms, type: string, source: input, description: "Reporter narrative" }
      - { name: affected_area_sqft, type: number, source: system, default: null, description: "Visible mold area in square feet, supplied by the assessment; null for lead hazards" }
      - { name: lead_level_ppm, type: number, source: system, default: null, description: "Lead concentration in ppm (LEAD_PAINT) or ppb (LEAD_WATER), supplied by the assessment; null for mold" }
      - { name: assessment_severity, type: enum, source: computed, default: null, description: "Per calculations.hazard_assessment_severity", constraints: "SEVERITY_1 | SEVERITY_2 | SEVERITY_3" }
      - { name: child_under_six_present, type: boolean, source: computed, default: false, description: "true when the lease's sponsor has a full-time-custody Dependent whose age at the assessment date is < 6 years" }
      - { name: displacement_required, type: boolean, source: computed, default: false, description: "Per calculations.hazard_assessment_severity; selects the DISPLACEMENT_ACTIVE fork" }
      - { name: assessed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the EnvironmentalSpecialist who assessed the case" }
      - { name: assessed_at, type: datetime, source: system, default: null, description: "Instant of assessment; anchor of the abatement day count" }
      - { name: cleared_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the EnvironmentalSpecialist who certified clearance; must differ from assessed_by_user_id" }
      - { name: clearance_test_passed, type: boolean, source: system, default: null, description: "Result of the post-remediation clearance test" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "Hazard protocol lifecycle", constraints: "REPORTED | ASSESSED | REMEDIATION_IN_PROGRESS | DISPLACEMENT_ACTIVE | CLEARANCE_PENDING | CLOSED | VOIDED" }

  # --- 11. DisplacementLodging ------------------------------------------------
  - name: DisplacementLodging
    parent: null
    common_fields: true
    fields:
      - { name: hazard_case_id, type: string, source: input, description: "FK -> HazardCase.id; case authorising the displacement" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; displaced household's lease" }
      - { name: start_date, type: string, source: input, description: "ISO date of first lodging night; interval start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date of planned checkout; interval end (EXCLUSIVE) — a night is counted for each date in [start_date, end_date)" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Contract lodging rate per night in cents before the nightly cap is applied", constraints: "> 0" }
      - { name: occupants_count, type: integer, source: input, description: "Authorised occupants drawing per diem", constraints: ">= 1" }
      - { name: actual_end_date, type: string, source: system, default: null, description: "ISO exclusive checkout date recorded at close; drives nights_displaced" }
      - { name: nights_displaced, type: integer, source: computed, default: 0, description: "Whole nights between start_date (inclusive) and actual_end_date (exclusive); 0 while AUTHORIZED" }
      - { name: per_night_authorized_cents, type: integer, source: computed, default: 0, description: "Per calculations.displacement_lodging_authorization" }
      - { name: lodging_authorized_cents, type: integer, source: computed, default: 0, description: "Per calculations.displacement_lodging_authorization" }
      - { name: rent_abatement_cents, type: integer, source: computed, default: 0, description: "Per calculations.displacement_rent_abatement; magnitude of the abatement credited to the lease at close" }
      - { name: status, type: enum, source: system, default: "AUTHORIZED", description: "Lodging lifecycle", constraints: "AUTHORIZED | CLOSED" }

  # --- 12. DisputeCase (cyclic with round cap) --------------------------------
  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease the dispute concerns" }
      - { name: service_member_id, type: string, source: system, description: "FK -> ServiceMember.id; copied from the lease at creation" }
      - { name: category, type: enum, source: input, description: "Dispute subject", constraints: "RENT_CHARGE | MAINTENANCE_QUALITY | HABITABILITY | DAMAGE_CLAIM | UTILITY_BILLING" }
      - { name: description, type: string, source: input, description: "Resident narrative" }
      - { name: status, type: enum, source: system, default: "UNDER_REVIEW", description: "Dispute lifecycle with a rebuttal loop", constraints: "UNDER_REVIEW | PROPOSED_RESOLUTION | RESIDENT_REJECTED | ESCALATED_INSTALLATION | CLOSED_RESOLVED" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of resolution proposals made; capped by DISPUTE_ROUND_CAP" }
      - { name: proposed_remedy, type: string, source: system, default: null, description: "Text of the most recent proposal" }
      - { name: credit_offer_cents, type: integer, source: system, default: 0, description: "Rent credit offered in the most recent proposal" }
      - { name: proposed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the PropertyManager who made the most recent proposal" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the InstallationHousingOffice user who decided the escalation; must differ from proposed_by_user_id" }
      - { name: credit_award_cents, type: integer, source: system, default: 0, description: "Credit finally awarded; posted to the lease ledger as a REFUND transaction" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant the dispute was opened" }
      - { name: resolution_due_at, type: datetime, source: computed, description: "= opened_at + DISPUTE_RESOLUTION_DAYS days" }
      - { name: escalated_at, type: datetime, source: system, default: null, description: "Instant the dispute was escalated to the installation housing office" }

  # --- 13. AllotmentTransaction (append-only ledger event) --------------------
  - name: AllotmentTransaction
    parent: null
    common_fields: false
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease whose allotment ledger this row belongs to" }
      - { name: period_month, type: string, source: system, description: "Billing period in YYYY-MM form" }
      - { name: type, type: enum, source: system, description: "Ledger row kind; CHARGE and ARREARS_ADJUSTMENT are positive, ABATEMENT, REFUND are negative, EARLY_TERMINATION_FEE is positive", constraints: "CHARGE | ABATEMENT | REFUND | ARREARS_ADJUSTMENT | EARLY_TERMINATION_FEE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents" }
      - { name: source_ref, type: string, source: system, description: "What produced the row, e.g. ALLOTMENT_RUN:2026-09, HAZARD_ABATEMENT:<hazard_case_id>, DISPUTE_AWARD:<dispute_case_id>, TERMINATION_SETTLEMENT:<lease_id>" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant the row was posted" }
      - { name: running_balance_cents, type: integer, source: system, description: "Lease ledger balance immediately after this row, ordered by posted_at ASC then created_at ASC" }

  # --- 14. ReinvestmentAccount ------------------------------------------------
  - name: ReinvestmentAccount
    parent: null
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; installation whose project account this is" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the account covers", constraints: "2024..2030" }
      - { name: opening_balance_cents, type: integer, source: input, description: "Balance carried in at the start of the fiscal year", constraints: ">= 0" }
      - { name: contributions_cents, type: integer, source: computed, default: 0, description: "Accumulated reinvestment contributions credited by allotment runs and termination settlements" }
      - { name: expenditures_cents, type: integer, source: computed, default: 0, description: "Accumulated authorised expenditures" }
      - { name: closing_balance_cents, type: integer, source: computed, description: "= opening_balance_cents + contributions_cents - expenditures_cents" }
      - { name: occupancy_basis, type: enum, source: input, description: "Variant of calculations.occupancy_rate_determination every metrics run on this account uses; fixed at account creation", constraints: "UNIT_DAY_WEIGHTED | MONTH_END_SNAPSHOT" }
      - { name: occupancy_rate_pct, type: number, source: computed, default: null, description: "Occupancy percentage produced by the most recent metrics run, 2 decimal places" }
      - { name: net_collected_cents, type: integer, source: computed, default: 0, description: "Net collected allotments in scope of the most recent metrics run" }
      - { name: habitability_penalty_pct, type: number, source: computed, default: 0, description: "Penalty fraction applied to the incentive fee, per calculations.performance_incentive_fee" }
      - { name: performance_incentive_fee_cents, type: integer, source: computed, default: 0, description: "Fee earned by the project owner, per calculations.performance_incentive_fee" }
      - { name: metrics_run_epoch, type: integer, source: system, default: 0, description: "Incremented by 1 by every metrics run" }
      - { name: last_metrics_run_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent metrics run" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- HousingUnit: inventory posture ----------------------------------------
  - entity: HousingUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system, inside POST /installations/{id}/waitlist-offer-run — the unit is selected for the winning application"
        actor: system
        preconditions:
          - "HousingUnit.status == AVAILABLE"
          - "a candidate WaitlistApplication exists per calculations.waitlist_offer_selection"
        side_effects:
          - "sets WaitlistApplication.status = OFFERED, offered_unit_id = this unit id, offer_expires_at = clock + Installation.offer_response_hours hours, offer_count += 1"
          - "recomputes Installation.available_unit_count and Installation.assigned_unit_count"
          - "increments HousingUnit.version by 1"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /waitlist-applications/{id}/decline-offer"
        actor: ServiceMember
        preconditions:
          - "HousingUnit.status == ASSIGNED"
          - "WaitlistApplication.offered_unit_id == this unit id"
        side_effects:
          - "clears WaitlistApplication.offered_unit_id and offer_expires_at"
          - "recomputes Installation.available_unit_count and Installation.assigned_unit_count — the sum of the five per-status counts is unchanged (see calculations.unit_inventory_conservation)"
          - "increments HousingUnit.version by 1"
      - from: ASSIGNED
        to: OCCUPIED
        trigger: "POST /leases/{id}/move-in"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == ASSIGNED"
          - "Lease.housing_unit_id == this unit id"
        side_effects:
          - "recomputes Installation.assigned_unit_count and Installation.occupied_unit_count"
          - "increments HousingUnit.version by 1"
      - from: OCCUPIED
        to: HAZARD_HOLD
        trigger: "system, second hop of the assessment cascade — HazardCase entered DISPLACEMENT_ACTIVE"
        actor: system
        preconditions:
          - "HousingUnit.status == OCCUPIED"
          - "HazardCase.housing_unit_id == this unit id AND HazardCase.status == DISPLACEMENT_ACTIVE"
        side_effects:
          - "sets HousingUnit.hazard_hold_reason = '<hazard_type> SEVERITY_3 or SEVERITY_2 with child under six'"
          - "third hop: because the unit entered HAZARD_HOLD, every Lease on this unit with allotment_status == ACTIVE transitions to SUSPENDED"
          - "recomputes Installation.occupied_unit_count and Installation.hazard_hold_unit_count"
          - "increments HousingUnit.version by 1"
      - from: HAZARD_HOLD
        to: OCCUPIED
        trigger: "system — POST /hazard-cases/{id}/clearance with clearance_test_passed == true, or POST /hazard-cases/{id}/void"
        actor: system
        preconditions:
          - "HousingUnit.status == HAZARD_HOLD"
          - "no other HazardCase on this unit has status IN {DISPLACEMENT_ACTIVE, REMEDIATION_IN_PROGRESS, CLEARANCE_PENDING}"
        side_effects:
          - "clears HousingUnit.hazard_hold_reason"
          - "every Lease on this unit with allotment_status == SUSPENDED returns to ACTIVE"
          - "recomputes Installation.occupied_unit_count and Installation.hazard_hold_unit_count"
          - "increments HousingUnit.version by 1"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /leases/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == OCCUPIED"
          - "Lease.occupancy_status transitions to TERMINATED in the same request"
        side_effects:
          - "sets HousingUnit.last_lease_end_date = Lease.termination_effective_date"
          - "recomputes Installation.occupied_unit_count and Installation.available_unit_count"
          - "increments HousingUnit.version by 1"
      - from: AVAILABLE
        to: OFFLINE_MAINTENANCE
        trigger: "POST /housing-units/{id}/status with status == OFFLINE_MAINTENANCE"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == AVAILABLE"
        side_effects:
          - "recomputes Installation.available_unit_count and Installation.offline_unit_count"
          - "increments HousingUnit.version by 1"
      - from: OFFLINE_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /housing-units/{id}/status with status == AVAILABLE"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == OFFLINE_MAINTENANCE"
        side_effects:
          - "recomputes Installation.available_unit_count and Installation.offline_unit_count"
          - "increments HousingUnit.version by 1"
        note: "OFFLINE_MAINTENANCE units stay in BOTH occupancy denominators (see calculations.occupancy_rate_determination): taking a unit offline lowers the rate rather than shrinking the denominator."
      - from: AVAILABLE
        to: HAZARD_HOLD
        trigger: "POST /housing-units/{id}/status with status == HAZARD_HOLD and hazard_hold_reason supplied"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == AVAILABLE"
          - "hazard_hold_reason is present in the request body"
        side_effects:
          - "stamps hazard_hold_reason"
          - "recomputes Installation.available_unit_count and Installation.hazard_hold_unit_count"
          - "increments HousingUnit.version by 1"
        note: "Operator-placed hold on a vacant unit, e.g. a suspected mold finding during turn. Distinct from the system hold the assessment cascade places on an OCCUPIED unit."
      - from: ASSIGNED
        to: HAZARD_HOLD
        trigger: "POST /housing-units/{id}/status with status == HAZARD_HOLD and hazard_hold_reason supplied"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == ASSIGNED"
          - "hazard_hold_reason is present in the request body"
        side_effects:
          - "stamps hazard_hold_reason"
          - "any Lease already written on this unit stays PENDING_MOVE_IN; POST /leases/{id}/move-in is now blocked by validations[priority=29]"
          - "recomputes Installation.assigned_unit_count and Installation.hazard_hold_unit_count"
          - "increments HousingUnit.version by 1"
      - from: HAZARD_HOLD
        to: AVAILABLE
        trigger: "POST /housing-units/{id}/status with status == AVAILABLE"
        actor: PropertyManager
        preconditions:
          - "HousingUnit.status == HAZARD_HOLD"
          - "no HazardCase on this unit has status IN {REPORTED, ASSESSED, REMEDIATION_IN_PROGRESS, DISPLACEMENT_ACTIVE, CLEARANCE_PENDING}"
        side_effects:
          - "clears hazard_hold_reason"
          - "recomputes Installation.hazard_hold_unit_count and Installation.available_unit_count; the five-counter sum is unchanged (calculations.unit_inventory_conservation)"
          - "increments HousingUnit.version by 1"
        note: "Compensating edge for the operator-placed hold. A unit that was ASSIGNED before the hold returns to AVAILABLE, not ASSIGNED — releasing a hold never re-reserves inventory."

  # --- WaitlistApplication: cyclic offer loop --------------------------------
  - entity: WaitlistApplication
    initial_state: PENDING
    terminal_states: [EXPIRED, HOUSED]
    transitions:
      - from: PENDING
        to: OFFERED
        trigger: "system, inside POST /installations/{id}/waitlist-offer-run"
        actor: system
        preconditions:
          - "WaitlistApplication.status == PENDING"
          - "the application is the winner of calculations.waitlist_offer_selection for the unit under consideration"
        side_effects:
          - "sets offered_unit_id, offer_expires_at = clock + Installation.offer_response_hours hours, offer_count += 1"
          - "HousingUnit.status AVAILABLE -> ASSIGNED"
          - "recomputes Installation.pending_application_count"
          - "increments WaitlistApplication.version by 1"
      - from: OFFERED
        to: PENDING
        trigger: "POST /waitlist-applications/{id}/decline-offer, when decline_count + 1 < Installation.decline_limit"
        actor: ServiceMember
        preconditions:
          - "WaitlistApplication.status == OFFERED"
          - "the acting ServiceMember owns the application (X-User-ID == service_member_id)"
        side_effects:
          - "decline_count += 1"
          - "effective_control_date += Installation.decline_penalty_days days"
          - "HousingUnit.status ASSIGNED -> AVAILABLE; offered_unit_id and offer_expires_at cleared"
          - "recomputes Installation.pending_application_count"
          - "increments WaitlistApplication.version by 1"
        note: "This is the cycle edge: an application may re-enter PENDING and be offered again in a later run."
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /waitlist-applications/{id}/decline-offer, when decline_count + 1 >= Installation.decline_limit"
        actor: ServiceMember
        preconditions:
          - "WaitlistApplication.status == OFFERED"
        side_effects:
          - "decline_count += 1; effective_control_date is NOT advanced because the application does not return to PENDING"
          - "HousingUnit.status ASSIGNED -> AVAILABLE; offered_unit_id and offer_expires_at cleared"
          - "recomputes Installation.pending_application_count"
          - "increments WaitlistApplication.version by 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /waitlist-applications/{id}/accept-offer"
        actor: ServiceMember
        preconditions:
          - "WaitlistApplication.status == OFFERED"
          - "clock <= offer_expires_at (acceptance exactly at offer_expires_at is allowed)"
          - "the acting ServiceMember owns the application"
        side_effects:
          - "HousingUnit.status remains ASSIGNED (the unit is now held for lease creation)"
          - "increments WaitlistApplication.version by 1"
      - from: ACCEPTED
        to: HOUSED
        trigger: "POST /leases"
        actor: PropertyManager
        preconditions:
          - "WaitlistApplication.status == ACCEPTED"
          - "the created Lease references this application_id"
        side_effects:
          - "increments WaitlistApplication.version by 1"

  # --- Lease dimension 1: occupancy_status ----------------------------------
  - entity: Lease
    dimension: occupancy_status
    initial_state: PENDING_MOVE_IN
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_MOVE_IN
        to: OCCUPIED
        trigger: "POST /leases/{id}/move-in"
        actor: PropertyManager
        preconditions:
          - "Lease.occupancy_status == PENDING_MOVE_IN"
          - "a MoveInInspection on this lease has status IN {TENANT_ACKNOWLEDGED, COMPLETED}"
          - "that inspection's critical_open_count == 0"
          - "HousingUnit.status == ASSIGNED (cross-entity guard: a unit in HAZARD_HOLD blocks move-in)"
        side_effects:
          - "re-runs calculations.gross_rent_determination under the MOVE_IN_FINAL variant and overwrites gross_rent_cents, utility_allowance_cents, net_rent_cents, daily_rent_cents, rent_effective_year; sets rent_basis = MOVE_IN_FINAL"
          - "allotment_status NOT_STARTED -> ACTIVE (independent dimension advanced by the same trigger)"
          - "HousingUnit.status ASSIGNED -> OCCUPIED"
          - "WaitlistApplication.status is unchanged (already HOUSED)"
          - "increments Lease.version by 1"
      - from: OCCUPIED
        to: NOTICE_GIVEN
        trigger: "POST /leases/{id}/termination-notice"
        actor: ServiceMember
        preconditions:
          - "Lease.occupancy_status == OCCUPIED"
          - "the acting ServiceMember owns the lease"
          - "for termination_reason == PCS the member has pcs_orders_ref set; for DEPLOYMENT the member has deployment_orders_ref set"
          - "requested_effective_date >= notice_date + required_notice_days(termination_reason)"
        side_effects:
          - "records termination_reason, termination_notice_date, termination_effective_date = requested_effective_date"
          - "allotment_status is NOT changed by the notice"
          - "increments Lease.version by 1"
      - from: NOTICE_GIVEN
        to: TERMINATED
        trigger: "POST /leases/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "Lease.occupancy_status == NOTICE_GIVEN"
          - "clock date >= Lease.termination_effective_date"
        side_effects:
          - "runs calculations.early_termination_settlement, storing early_termination_fee_cents and settlement_total_cents"
          - "allotment_status ACTIVE|SUSPENDED -> CLOSED"
          - "HousingUnit.status OCCUPIED -> AVAILABLE and last_lease_end_date = termination_effective_date"
          - "increments Lease.version by 1"

  # --- Lease dimension 2: allotment_status ----------------------------------
  - entity: Lease
    dimension: allotment_status
    initial_state: NOT_STARTED
    terminal_states: [CLOSED]
    transitions:
      - from: NOT_STARTED
        to: ACTIVE
        trigger: "system, inside POST /leases/{id}/move-in"
        actor: system
        preconditions:
          - "Lease.allotment_status == NOT_STARTED"
          - "Lease.occupancy_status transitions to OCCUPIED in the same request"
        side_effects:
          - "the lease becomes eligible for POST /installations/{id}/allotment-run charge posting"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, third hop of the assessment cascade — HousingUnit entered HAZARD_HOLD"
        actor: system
        preconditions:
          - "Lease.allotment_status == ACTIVE"
          - "HousingUnit.status == HAZARD_HOLD"
        side_effects:
          - "fourth hop: because allotment_status became SUSPENDED, an AllotmentTransaction of type ABATEMENT is posted with amount_cents = -(daily_rent_cents * abatement_days) per calculations.hazard_abatement_posting, source_ref = 'HAZARD_ABATEMENT:<hazard_case_id>'"
          - "recomputes Lease.allotment_balance_cents and Lease.abatement_total_cents from the ledger"
          - "increments Lease.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — HousingUnit left HAZARD_HOLD after clearance or void"
        actor: system
        preconditions:
          - "Lease.allotment_status == SUSPENDED"
          - "HousingUnit.status == OCCUPIED"
        side_effects:
          - "when the release came from POST /hazard-cases/{id}/void, an AllotmentTransaction of type ARREARS_ADJUSTMENT is posted with amount_cents = +abs(sum of ABATEMENT rows whose source_ref is 'HAZARD_ABATEMENT:<hazard_case_id>'), restoring Lease.allotment_balance_cents to its pre-abatement value and driving abatement_total_cents back to 0"
          - "when the release came from POST /hazard-cases/{id}/clearance, NO reinstating row is posted — the abatement is earned and stays on the ledger"
          - "increments Lease.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, inside POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "Lease.allotment_status IN {ACTIVE, SUSPENDED}"
          - "Lease.occupancy_status transitions to TERMINATED in the same request"
        side_effects:
          - "second hop: because allotment_status became CLOSED, settlement rows are posted — a CHARGE row for the prorated final period and, when early_termination_fee_cents > 0, an EARLY_TERMINATION_FEE row; Lease.allotment_balance_cents is recomputed"
          - "third hop: because settlement rows were posted, the ReinvestmentAccount for (installation_id, fiscal_year of termination_effective_date) has contributions_cents increased by round_half_up(settlement_charges_cents * REINVESTMENT_CONTRIBUTION_PCT)"
          - "fourth hop: because contributions_cents changed, ReinvestmentAccount.closing_balance_cents is recomputed and ReinvestmentAccount.version is incremented by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system, inside POST /leases/{id}/terminate"
        actor: system
        preconditions:
          - "Lease.allotment_status == SUSPENDED"
          - "Lease.occupancy_status transitions to TERMINATED in the same request"
        side_effects:
          - "identical settlement and reinvestment cascade as the ACTIVE -> CLOSED edge; abatement rows already on the ledger reduce base_cents inside calculations.early_termination_settlement"

  # --- MoveInInspection -----------------------------------------------------
  - entity: MoveInInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: DEFICIENCIES_LOGGED
        trigger: "POST /move-in-inspections/{id}/deficiencies"
        actor: PropertyManager
        preconditions:
          - "MoveInInspection.status IN {SCHEDULED, DEFICIENCIES_LOGGED}"
          - "deficiency_code is not already present in the deficiencies array"
        side_effects:
          - "appends the deficiency object with status = OPEN and work_order_id = null"
          - "recomputes deficiency_count and critical_open_count"
          - "increments MoveInInspection.version by 1"
      - from: SCHEDULED
        to: TENANT_ACKNOWLEDGED
        trigger: "POST /move-in-inspections/{id}/tenant-acknowledge"
        actor: ServiceMember
        preconditions:
          - "MoveInInspection.status IN {SCHEDULED, DEFICIENCIES_LOGGED}"
          - "bill_of_rights_version equals Installation.bill_of_rights_version of the lease's unit's installation"
          - "the acting ServiceMember owns the lease"
        side_effects:
          - "stamps tenant_signature_name, tenant_signature_at = clock, bill_of_rights_version_ack"
          - "sets Lease.bill_of_rights_version_ack and Lease.bill_of_rights_ack_at, incrementing Lease.version by 1"
          - "increments MoveInInspection.version by 1"
        note: "An inspection with zero logged deficiencies acknowledges straight from SCHEDULED."
      - from: DEFICIENCIES_LOGGED
        to: TENANT_ACKNOWLEDGED
        trigger: "POST /move-in-inspections/{id}/tenant-acknowledge"
        actor: ServiceMember
        preconditions:
          - "MoveInInspection.status == DEFICIENCIES_LOGGED"
          - "bill_of_rights_version equals Installation.bill_of_rights_version"
          - "the acting ServiceMember owns the lease"
        side_effects:
          - "stamps tenant_signature_name, tenant_signature_at, bill_of_rights_version_ack; sets Lease.bill_of_rights_ack_at (Lease.version += 1)"
          - "second hop: because the inspection was acknowledged, every deficiencies entry with severity == HABITABILITY_CRITICAL and status == OPEN flips to WORK_ORDER_CREATED and a WorkOrder is created for it (category from the entry, habitability_impact = true, inspection_deficiency_code = the entry's deficiency_code); the created work order id is written back into the entry"
          - "third hop: because those work orders were created, MoveInInspection.critical_open_count is recomputed (it stays equal to the number of non-RESOLVED critical entries, so move-in remains blocked until each spawned order completes)"
          - "increments MoveInInspection.version by 1"
      - from: TENANT_ACKNOWLEDGED
        to: COMPLETED
        trigger: "system — the last non-RESOLVED HABITABILITY_CRITICAL deficiency's work order is completed"
        actor: system
        preconditions:
          - "MoveInInspection.status == TENANT_ACKNOWLEDGED"
          - "critical_open_count becomes 0 after the deficiency entry flips to RESOLVED"
        side_effects:
          - "increments MoveInInspection.version by 1"
        note: "An inspection acknowledged with no HABITABILITY_CRITICAL deficiencies auto-completes in the same acknowledge request because critical_open_count is already 0."

  # --- WorkOrder: cyclic repair loop with a hard reopen cap ------------------
  - entity: WorkOrder
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/assign"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status IN {SUBMITTED, REOPENED}"
        side_effects:
          - "sets assigned_tech_user_id and first_response_at = clock when first_response_at is null"
          - "increments WorkOrder.version by 1"
      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/assign"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status == REOPENED"
        side_effects:
          - "sets assigned_tech_user_id; first_response_at is left at its original value"
          - "increments WorkOrder.version by 1"
        note: "Cycle edge closing the loop REOPENED -> ASSIGNED -> IN_PROGRESS -> COMPLETED -> REOPENED."
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: MaintenanceTech
        preconditions:
          - "WorkOrder.status == ASSIGNED"
          - "assigned_tech_user_id is not null"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete, when reopen_count < REOPEN_LIMIT"
        actor: MaintenanceTech
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "WorkOrder.reopen_count < REOPEN_LIMIT (2)"
        side_effects:
          - "sets completed_at = clock and recomputes sla_breached"
          - "when inspection_deficiency_code is set: the matching MoveInInspection.deficiencies entry flips to RESOLVED (second hop); when that drives critical_open_count to 0 the inspection transitions TENANT_ACKNOWLEDGED -> COMPLETED (third hop)"
          - "when this order is a HazardCase.remediation_work_order_id: the case transitions REMEDIATION_IN_PROGRESS|DISPLACEMENT_ACTIVE -> CLEARANCE_PENDING (second hop); if the case was DISPLACEMENT_ACTIVE every AUTHORIZED DisplacementLodging on it is closed with actual_end_date = clock date, computing nights_displaced, per_night_authorized_cents, lodging_authorized_cents and rent_abatement_cents (third hop); because those lodgings closed, the ReinvestmentAccount for (installation_id, calendar year of the close date) has expenditures_cents increased by the sum of the closed lodgings' lodging_authorized_cents (fourth hop); because expenditures_cents changed, closing_balance_cents is recomputed and ReinvestmentAccount.version is incremented by 1 (fifth hop)"
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /work-orders/{id}/complete, when reopen_count >= REOPEN_LIMIT"
        actor: MaintenanceTech
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "WorkOrder.reopen_count >= REOPEN_LIMIT (2)"
        side_effects:
          - "sets completed_at = clock and recomputes sla_breached; the same deficiency / hazard cascades as the COMPLETED edge fire"
          - "increments WorkOrder.version by 1"
        note: "Divergent branch of the same trigger: the reopen budget is spent, so the order lands in the terminal state instead of the re-enterable one."
      - from: COMPLETED
        to: REOPENED
        trigger: "POST /work-orders/{id}/reopen"
        actor: ServiceMember | PropertyManager
        preconditions:
          - "WorkOrder.status == COMPLETED"
          - "WorkOrder.reopen_count < REOPEN_LIMIT (2)"
          - "when the actor is a ServiceMember: WorkOrder.reopen_count < RESIDENT_REOPEN_LIMIT (1) — a resident is allowed one reopen per order and must ask the housing office for any further reopen"
          - "when the actor is a ServiceMember, that member owns the lease referenced by lease_id"
        side_effects:
          - "reopen_count += 1; completed_at cleared; assigned_tech_user_id cleared"
          - "completion_due_at is NOT recomputed — the original SLA clock keeps running, so a reopened order can already be past due"
          - "when inspection_deficiency_code is set the matching deficiencies entry returns from RESOLVED to WORK_ORDER_CREATED and MoveInInspection.critical_open_count is recomputed; an inspection in COMPLETED returns to TENANT_ACKNOWLEDGED"
          - "increments WorkOrder.version by 1"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /work-orders/{id}/escalate"
        actor: ServiceMember | PropertyManager | InstallationHousingOffice
        preconditions:
          - "WorkOrder.status IN {SUBMITTED, ASSIGNED, IN_PROGRESS, REOPENED}"
          - "calculations.habitability_escalation_eligibility returns an eligible level > current escalation_level"
        side_effects:
          - "escalation_level += 1, capped at MAX_ESCALATION_LEVEL (2); escalated_at = clock; sla_breached recomputed"
          - "escalated orders count against ReinvestmentAccount.habitability_penalty_pct at the next metrics run"
          - "increments WorkOrder.version by 1"
        note: "Escalation is a self-loop on the work lifecycle: status is preserved while the escalation ladder advances. The same edge exists from ASSIGNED, IN_PROGRESS and REOPENED."

  # --- HazardCase: branching fork-join --------------------------------------
  - entity: HazardCase
    initial_state: REPORTED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /hazard-cases/{id}/assess"
        actor: EnvironmentalSpecialist
        preconditions:
          - "HazardCase.status == REPORTED"
          - "for hazard_type == MOLD, affected_area_sqft is supplied; for LEAD_PAINT and LEAD_WATER, lead_level_ppm is supplied"
        side_effects:
          - "runs calculations.hazard_assessment_severity, storing assessment_severity, child_under_six_present and displacement_required"
          - "stamps assessed_by_user_id = X-User-ID and assessed_at = clock"
          - "creates the remediation WorkOrder (category MOLD_SUSPECTED for MOLD, LEAD_SUSPECTED for lead types, habitability_impact = displacement_required) and stores its id in remediation_work_order_id"
          - "immediately forks per the two system edges below"
          - "increments HazardCase.version by 1"
      - from: ASSESSED
        to: REMEDIATION_IN_PROGRESS
        trigger: "system, same request as assess — displacement_required == false"
        actor: system
        preconditions:
          - "HazardCase.status == ASSESSED"
          - "HazardCase.displacement_required == false"
        side_effects:
          - "HousingUnit.status is NOT changed; the household stays in place"
          - "Lease.allotment_status is NOT changed; no ABATEMENT row is posted"
        note: "Branch A of the fork — divergent side-effect set from branch B."
      - from: ASSESSED
        to: DISPLACEMENT_ACTIVE
        trigger: "system, same request as assess — displacement_required == true"
        actor: system
        preconditions:
          - "HazardCase.status == ASSESSED"
          - "HazardCase.displacement_required == true"
        side_effects:
          - "second hop: HousingUnit.status OCCUPIED -> HAZARD_HOLD with hazard_hold_reason stamped"
          - "third hop: because the unit entered HAZARD_HOLD, Lease.allotment_status ACTIVE -> SUSPENDED"
          - "fourth hop: because the allotment was suspended, an ABATEMENT AllotmentTransaction is posted and Lease.allotment_balance_cents / abatement_total_cents are recomputed"
          - "the household becomes eligible for POST /displacement-lodgings"
        note: "Branch B of the fork — same trigger, four-deep cascade the other branch does not run."
      - from: REMEDIATION_IN_PROGRESS
        to: CLEARANCE_PENDING
        trigger: "system — the remediation WorkOrder reached COMPLETED or CLOSED"
        actor: system
        preconditions:
          - "HazardCase.status == REMEDIATION_IN_PROGRESS"
          - "the WorkOrder identified by remediation_work_order_id has status IN {COMPLETED, CLOSED}"
        side_effects:
          - "no lodging or ledger effects on this branch"
      - from: DISPLACEMENT_ACTIVE
        to: CLEARANCE_PENDING
        trigger: "system — the remediation WorkOrder reached COMPLETED or CLOSED"
        actor: system
        preconditions:
          - "HazardCase.status == DISPLACEMENT_ACTIVE"
          - "the WorkOrder identified by remediation_work_order_id has status IN {COMPLETED, CLOSED}"
        side_effects:
          - "every DisplacementLodging on this case with status == AUTHORIZED is closed with actual_end_date = clock date, recomputing nights_displaced, per_night_authorized_cents, lodging_authorized_cents and rent_abatement_cents"
          - "the ReinvestmentAccount for (installation_id, calendar year of the close date) has expenditures_cents increased by the sum of the closed lodgings' lodging_authorized_cents and closing_balance_cents recomputed (version += 1); when no such account row exists the hop is skipped silently"
          - "no ledger row is posted for the lodging: the ledger abatement was already posted when the allotment was suspended, and DisplacementLodging.rent_abatement_cents is the reconciliation figure the installation compares against it"
        note: "Join point: both fork branches converge here, but only branch B carries the lodging closure side-effect set."
      - from: CLEARANCE_PENDING
        to: CLOSED
        trigger: "POST /hazard-cases/{id}/clearance with clearance_test_passed == true"
        actor: EnvironmentalSpecialist
        preconditions:
          - "HazardCase.status == CLEARANCE_PENDING"
          - "X-User-ID != HazardCase.assessed_by_user_id (segregation of duties)"
        side_effects:
          - "stamps cleared_by_user_id and clearance_test_passed = true"
          - "HousingUnit.status HAZARD_HOLD -> OCCUPIED with hazard_hold_reason cleared (only when no other open case holds the unit)"
          - "Lease.allotment_status SUSPENDED -> ACTIVE with NO reinstating ledger row: the abatement is earned and stays"
          - "increments HazardCase.version by 1"
      - from: CLEARANCE_PENDING
        to: REMEDIATION_IN_PROGRESS
        trigger: "POST /hazard-cases/{id}/clearance with clearance_test_passed == false"
        actor: EnvironmentalSpecialist
        preconditions:
          - "HazardCase.status == CLEARANCE_PENDING"
          - "X-User-ID != HazardCase.assessed_by_user_id"
        side_effects:
          - "stamps clearance_test_passed = false and clears cleared_by_user_id"
          - "creates a follow-on WorkOrder with parent_work_order_id = remediation_work_order_id and repoints remediation_work_order_id at it"
          - "HousingUnit.status stays HAZARD_HOLD when the case had displaced the household"
          - "increments HazardCase.version by 1"
        note: "Cycle edge: a failed clearance test sends the case back around the remediation loop."
      - from: ASSESSED
        to: VOIDED
        trigger: "POST /hazard-cases/{id}/void"
        actor: PlatformAdmin | InstallationHousingOffice
        preconditions:
          - "HazardCase.status IN {ASSESSED, REMEDIATION_IN_PROGRESS, DISPLACEMENT_ACTIVE, CLEARANCE_PENDING}"
        side_effects:
          - "HousingUnit.status HAZARD_HOLD -> OCCUPIED with hazard_hold_reason cleared"
          - "Lease.allotment_status SUSPENDED -> ACTIVE and a compensating ARREARS_ADJUSTMENT AllotmentTransaction restores every ABATEMENT posted for this case, returning Lease.allotment_balance_cents to its pre-abatement value and abatement_total_cents to 0"
          - "every AUTHORIZED DisplacementLodging on the case is closed with actual_end_date = start_date, giving nights_displaced == 0"
          - "increments HazardCase.version by 1"
        note: "Compensating action for the assessment cascade. The same edge exists from REMEDIATION_IN_PROGRESS, DISPLACEMENT_ACTIVE and CLEARANCE_PENDING."

  # --- DisplacementLodging --------------------------------------------------
  - entity: DisplacementLodging
    initial_state: AUTHORIZED
    terminal_states: [CLOSED]
    transitions:
      - from: AUTHORIZED
        to: CLOSED
        trigger: "POST /displacement-lodgings/{id}/close, or system closure when the case leaves DISPLACEMENT_ACTIVE"
        actor: PropertyManager | system
        preconditions:
          - "DisplacementLodging.status == AUTHORIZED"
          - "actual_end_date >= start_date"
        side_effects:
          - "runs calculations.displacement_lodging_authorization and calculations.displacement_rent_abatement, storing nights_displaced, per_night_authorized_cents, lodging_authorized_cents and rent_abatement_cents"
          - "the ReinvestmentAccount for (installation_id, calendar year of actual_end_date) has expenditures_cents increased by lodging_authorized_cents and closing_balance_cents recomputed (version += 1); this cascaded expenditure is NOT subject to the balance sufficiency check, which guards only POST /reinvestment-accounts/{id}/expenditures"
          - "no AllotmentTransaction row is posted; rent_abatement_cents is a reconciliation figure only"
          - "increments DisplacementLodging.version by 1"

  # --- DisputeCase: cyclic rebuttal loop with a round cap -------------------
  - entity: DisputeCase
    initial_state: UNDER_REVIEW
    terminal_states: [CLOSED_RESOLVED]
    transitions:
      - from: UNDER_REVIEW
        to: PROPOSED_RESOLUTION
        trigger: "POST /dispute-cases/{id}/propose-resolution"
        actor: PropertyManager
        preconditions:
          - "DisputeCase.status == UNDER_REVIEW"
          - "DisputeCase.round_count < DISPUTE_ROUND_CAP (3)"
        side_effects:
          - "round_count += 1; stores proposed_remedy, credit_offer_cents, proposed_by_user_id = X-User-ID"
          - "increments DisputeCase.version by 1"
      - from: PROPOSED_RESOLUTION
        to: CLOSED_RESOLVED
        trigger: "POST /dispute-cases/{id}/respond with accept == true"
        actor: ServiceMember
        preconditions:
          - "DisputeCase.status == PROPOSED_RESOLUTION"
          - "the acting ServiceMember owns the lease"
        side_effects:
          - "credit_award_cents = credit_offer_cents"
          - "when credit_award_cents > 0 an AllotmentTransaction of type REFUND with amount_cents = -credit_award_cents and source_ref = 'DISPUTE_AWARD:<dispute_case_id>' is posted, then Lease.allotment_balance_cents is recomputed"
          - "increments DisputeCase.version by 1"
      - from: PROPOSED_RESOLUTION
        to: RESIDENT_REJECTED
        trigger: "POST /dispute-cases/{id}/respond with accept == false"
        actor: ServiceMember
        preconditions:
          - "DisputeCase.status == PROPOSED_RESOLUTION"
          - "the acting ServiceMember owns the lease"
        side_effects:
          - "forks immediately per the two system edges below, based on round_count"
          - "increments DisputeCase.version by 1"
      - from: RESIDENT_REJECTED
        to: UNDER_REVIEW
        trigger: "system, same request as respond(accept=false) — round_count < DISPUTE_ROUND_CAP"
        actor: system
        preconditions:
          - "DisputeCase.status == RESIDENT_REJECTED"
          - "DisputeCase.round_count < DISPUTE_ROUND_CAP (3)"
        side_effects:
          - "credit_offer_cents is left on the record as the standing offer; no ledger row is posted"
        note: "Cycle edge: the negotiation returns to the property manager for another round."
      - from: RESIDENT_REJECTED
        to: ESCALATED_INSTALLATION
        trigger: "system, same request as respond(accept=false) — round_count >= DISPUTE_ROUND_CAP"
        actor: system
        preconditions:
          - "DisputeCase.status == RESIDENT_REJECTED"
          - "DisputeCase.round_count >= DISPUTE_ROUND_CAP (3)"
        side_effects:
          - "escalated_at = clock; the case leaves the property manager's authority"
        note: "Automatic termination condition of the loop — the resident cannot be kept in an endless negotiation."
      - from: ESCALATED_INSTALLATION
        to: CLOSED_RESOLVED
        trigger: "POST /dispute-cases/{id}/installation-decision"
        actor: InstallationHousingOffice
        preconditions:
          - "DisputeCase.status == ESCALATED_INSTALLATION"
          - "X-User-ID != DisputeCase.proposed_by_user_id (segregation of duties)"
        side_effects:
          - "stores decided_by_user_id and credit_award_cents"
          - "when credit_award_cents > 0 a REFUND AllotmentTransaction is posted and Lease.allotment_balance_cents is recomputed"
          - "increments DisputeCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: rent-redetermination-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /leases/{id}/rent-redetermination"
    occ_field: "expected_lease_version"
    description: |
      A rent redetermination carrying a lease version older than the lease's
      current version is rejected. Redetermination is legitimately repeatable —
      a second redetermination against an up-to-date view succeeds and produces
      the same or a new rent — so the operation cannot be guarded by a state
      precondition; only the stale-version check distinguishes a writer whose
      view of gross_rent_cents predates an intervening move-in, hazard
      abatement or dispute award.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

  - rule_id: recertify-stale-application
    parent_entity: WaitlistApplication
    write_endpoint: "POST /waitlist-applications/{id}/recertify"
    occ_field: "expected_application_version"
    description: |
      Recertifying dependent composition against a WaitlistApplication whose
      version has advanced since the client last read it is rejected.
      Recertification is legitimately repeatable in the PENDING state, so a
      second sequential recertification from a fresh read succeeds; the stale
      version check is what catches a writer who did not observe an intervening
      offer, decline penalty or earlier recertification.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: expenditure-stale-account
    parent_entity: ReinvestmentAccount
    write_endpoint: "POST /reinvestment-accounts/{id}/expenditures"
    occ_field: "expected_account_version"
    description: |
      Authorising an expenditure against a ReinvestmentAccount whose version
      has advanced is rejected. Expenditures are legitimately repeatable while
      closing_balance_cents remains sufficient, so a second sequential
      expenditure from a fresh read succeeds; the stale-version check is what
      stops a writer from spending against a balance that an intervening
      allotment run, termination settlement or earlier expenditure has already
      moved.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: rank_category_derivation
    trigger: "POST /service-members (stamps ServiceMember.rank_category); re-read whenever an application snapshots rank_category"
    algorithm: threshold
    formula: |
      n = integer suffix of pay_grade
      if pay_grade starts with 'E': JUNIOR_ENLISTED if n <= 6 else SENIOR_ENLISTED
      if pay_grade starts with 'W': WARRANT_OFFICER
      if pay_grade starts with 'O': JUNIOR_OFFICER if n <= 3 else SENIOR_OFFICER
    input_set: "The pay_grade string supplied at ServiceMember creation. No other entity participates."
    constants:
      ENLISTED_SENIOR_FLOOR: 7
      OFFICER_SENIOR_FLOOR: 4
    precision: "exact enum selection; E6 is JUNIOR_ENLISTED and E7 is SENIOR_ENLISTED"

  - name: bedroom_eligibility_determination
    trigger: "POST /waitlist-applications and POST /waitlist-applications/{id}/recertify (stamps WaitlistApplication.bedroom_eligibility)"
    algorithm: aggregation
    formula: |
      control = WaitlistApplication.effective_control_date (already computed, see
                calculations.effective_control_date_determination)
      D = Dependent rows WHERE service_member_id = application.service_member_id
                          AND is_full_time_custody == true
      # age in whole years: the number of times the dependent's birthday has
      # occurred on or before `control`. A birthday falling exactly on `control`
      # counts as having been reached.
      age(d) = (control.year - dob.year)
               - (1 if (control.month, control.day) < (dob.month, dob.day) else 0)

      base_bedrooms = 1                          # sponsor, plus SPOUSE if present
      children      = [d in D where d.relationship == CHILD]
      others        = [d in D where d.relationship == OTHER_AUTHORIZED]

      private_children = [c in children where age(c) >= 10]
      shared_children  = [c in children where age(c) <  10]

      shared_bedrooms = 0
      for g in [MALE, FEMALE]:                   # fixed evaluation order MALE then FEMALE
          k = count(c in shared_children where c.gender == g)
          shared_bedrooms += ceil(k / 2)         # two same-gender under-10 children share

      raw = base_bedrooms + shared_bedrooms + count(private_children) + count(others)
      bedroom_eligibility = min(max(raw, 1), MAX_BEDROOMS)
    input_set: "Only full-time-custody Dependent rows of the application's sponsor. is_full_time_custody == false rows are excluded entirely, as are dependents added after the snapshot unless recertify re-runs the rule."
    constants:
      SHARED_AGE_CEILING: 10
      CHILDREN_PER_SHARED_BEDROOM: 2
      MAX_BEDROOMS: 5
    precision: "integer bedrooms; age comparison is `>= 10` so a child whose tenth birthday falls exactly on the control date requires a private bedroom"

  - name: effective_control_date_determination
    trigger: "POST /waitlist-applications (initial value); POST /waitlist-applications/{id}/decline-offer when the application returns to PENDING; POST /waitlist-applications/{id}/recertify"
    algorithm: chronological
    formula: |
      at creation:
        base = pcs_orders_date
        if ServiceMember.deployment_status == DEPLOYED at the moment of creation:
            base = base - DEPLOYMENT_CREDIT_DAYS days
        effective_control_date = base
      on each decline that returns the application to PENDING:
        effective_control_date = effective_control_date
                                 + Installation.decline_penalty_days days
      on recertify:
        effective_control_date is recomputed from the CURRENT pcs_orders_date and
        deployment_status, then the accumulated decline penalty
        (decline_count * Installation.decline_penalty_days days) is re-applied.
    input_set: "pcs_orders_date from the application body, ServiceMember.deployment_status, Installation.decline_penalty_days, WaitlistApplication.decline_count."
    constants:
      DEPLOYMENT_CREDIT_DAYS: 30
    precision: "whole calendar days, ISO YYYY-MM-DD"

  - name: waitlist_offer_selection
    trigger: "POST /installations/{id}/waitlist-offer-run"
    algorithm: waterfall_allocation
    formula: |
      # (1) unit iteration order — the waterfall
      units = HousingUnit WHERE installation_id = <path id> AND status == 'AVAILABLE'
      order units BY bedroom_count ASC, then created_at ASC        # never by id
      # (2) per unit, the eligibility filter defining the candidate set
      for each unit u in that order:
          C = WaitlistApplication WHERE installation_id = <path id>
                                    AND status == 'PENDING'
                                    AND bedroom_eligibility == u.bedroom_count
                                    AND rank_category == u.designated_rank_category
                                    AND (accessibility_required == false
                                         OR 'ROLL_IN_SHOWER' in u.accessibility_features)
                                    AND application not already offered in this run
      # (3) ranking expression, (4) tie-break
          order C BY effective_control_date ASC,
                     bedroom_eligibility DESC,
                     created_at ASC                                # never by id
      # (5) empty-pool fallback
          if C is empty: skip this unit and continue — no error, no offer, and the
                         unit keeps status AVAILABLE
          winner = first element of C
          offer winner the unit (application PENDING -> OFFERED, unit AVAILABLE -> ASSIGNED)
      # the run itself is always a success response even when it creates no offer
      Installation.offer_run_epoch += 1 ; Installation.last_offer_run_at = clock
    input_set: "Only status == AVAILABLE units and status == PENDING applications at the path installation. OFFLINE_MAINTENANCE, HAZARD_HOLD, ASSIGNED and OCCUPIED units never participate; OFFERED, ACCEPTED, EXPIRED and HOUSED applications never participate."
    constants:
      OFFERS_PER_APPLICATION_PER_RUN: 1
    precision: "deterministic: exact bedroom equality (not >=), exact rank-category equality, and a created_at ASC final tie-break. An empty candidate pool is not an error."

  - name: gross_rent_determination
    trigger: "POST /leases (OFFER_PROVISIONAL variant); POST /leases/{id}/move-in and POST /leases/{id}/rent-redetermination (MOVE_IN_FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # (1) select the rate row
      wd   = (dependent_count_source >= 1)
      rate = BahRate WHERE installation_id = unit.installation_id
                       AND pay_grade       = ServiceMember.pay_grade
                       AND with_dependents = wd
                       AND effective_year  = year_source
      if no such row: ERR_BAH_RATE_NOT_ON_FILE
      # (2) unit-type adjustment, historic premium, then the statutory cap
      adj = { SFH: 0.00, DUPLEX: -0.02, TOWNHOME: -0.03, APARTMENT: -0.05 }[unit.unit_type]
      g   = round_half_up(rate.monthly_rate_cents * (1 + adj))
      if unit.historic_flag:
          g = g + round_half_up(rate.monthly_rate_cents * HISTORIC_PREMIUM_PCT)
      gross_rent_cents        = min(g, rate.monthly_rate_cents)     # rent may never exceed BAH
      utility_allowance_cents = rate.utility_allowance_cents
      net_rent_cents          = gross_rent_cents - utility_allowance_cents
      rent_effective_year     = year_source
    input_set: "Exactly one BahRate row, selected by the four-part key. The two variants differ only in `year_source` and `dependent_count_source`, and therefore may select DIFFERENT BahRate rows for the same lease."
    constants:
      HISTORIC_PREMIUM_PCT: 0.015
      UNIT_TYPE_ADJ_SFH: 0.00
      UNIT_TYPE_ADJ_DUPLEX: -0.02
      UNIT_TYPE_ADJ_TOWNHOME: -0.03
      UNIT_TYPE_ADJ_APARTMENT: -0.05
    precision: "round_half_up to whole cents; the multiplication is rounded BEFORE the historic premium is added and BEFORE the min() cap is applied"
    variants:
      - name: OFFER_PROVISIONAL
        when: "POST /leases — the rent quoted on the lease at signing, before the family arrives"
        difference: "year_source = calendar year of WaitlistApplication.effective_control_date; dependent_count_source = WaitlistApplication.dependent_count_at_application (the snapshot). Sets rent_basis = OFFER_PROVISIONAL."
      - name: MOVE_IN_FINAL
        when: "POST /leases/{id}/move-in and POST /leases/{id}/rent-redetermination — the rent actually collected"
        difference: "year_source = calendar year of Lease.start_date (redetermination uses the calendar year of the supplied effective_date); dependent_count_source = the sponsor's CURRENT ServiceMember.dependent_count. Sets rent_basis = MOVE_IN_FINAL. For a control date in 2025 and a start date in 2026 the two variants read different BahRate rows and produce different gross_rent_cents for identical lease inputs."

  - name: daily_rent_rate
    trigger: "recomputed together with net_rent_cents by every run of calculations.gross_rent_determination"
    algorithm: aggregation
    formula: |
      daily_rent_cents = round_half_up(net_rent_cents * 12 / DAYS_PER_RENT_YEAR)
    input_set: "The lease's currently stored net_rent_cents only."
    constants:
      DAYS_PER_RENT_YEAR: 365
    precision: "round_half_up to whole cents ONCE, here. Every downstream day-count multiplication (proration, abatement, settlement) multiplies this already-rounded integer; it never re-derives a fractional daily rate."

  - name: work_order_priority_classification
    trigger: "POST /work-orders (stamps priority_class, response_due_at, completion_due_at)"
    algorithm: threshold
    formula: |
      # (1) base tier from the reported category
      tier = CATEGORY_TIER[category]          # 3 = EMERGENCY, 2 = URGENT, 1 = ROUTINE
      # (2) two independent upward bumps, applied with max() so neither can lower the tier
      if habitability_impact == true:
          tier = max(tier, HABITABILITY_FLOOR_TIER)          # 2
      if category in {MOLD_SUSPECTED, LEAD_SUSPECTED}:
          tier = max(tier, HAZARD_SUSPECTED_FLOOR_TIER)      # 2
      # (3) vulnerability escalation — only when BOTH bumps' conditions hold
      if habitability_impact == true
         and the unit's OCCUPIED lease sponsor has a full-time-custody CHILD
             dependent under 6 years old as of reported_at:
          tier = 3
      priority_class = { 3: EMERGENCY, 2: URGENT, 1: ROUTINE }[tier]
      # (4) SLA clocks, measured from reported_at (the logical clock at creation)
      response_due_at   = reported_at + RESPONSE_HOURS[priority_class]   hours
      completion_due_at = reported_at + COMPLETION_HOURS[priority_class] hours
      # (5) the habitability hard cap, applied AFTER the table lookup
      if habitability_impact == true:
          completion_due_at = min(completion_due_at,
                                  reported_at + HABITABILITY_MAX_COMPLETION_HOURS hours)
    input_set: "The submitted category and habitability_impact flag, plus the Dependent rows of the sponsor on the unit's OCCUPIED lease (if any). A unit with no OCCUPIED lease can never take the vulnerability escalation."
    constants:
      CATEGORY_TIER_NO_HEAT: 3
      CATEGORY_TIER_NO_WATER: 3
      CATEGORY_TIER_GAS_LEAK: 3
      CATEGORY_TIER_SEWAGE_BACKUP: 3
      CATEGORY_TIER_ELECTRICAL: 2
      CATEGORY_TIER_PLUMBING_LEAK: 2
      CATEGORY_TIER_HVAC: 2
      CATEGORY_TIER_MOLD_SUSPECTED: 2
      CATEGORY_TIER_LEAD_SUSPECTED: 2
      CATEGORY_TIER_APPLIANCE: 1
      CATEGORY_TIER_COSMETIC: 1
      CATEGORY_TIER_GROUNDS: 1
      HABITABILITY_FLOOR_TIER: 2
      HAZARD_SUSPECTED_FLOOR_TIER: 2
      VULNERABLE_CHILD_AGE_CEILING: 6
      RESPONSE_HOURS_EMERGENCY: 4
      RESPONSE_HOURS_URGENT: 24
      RESPONSE_HOURS_ROUTINE: 120
      COMPLETION_HOURS_EMERGENCY: 24
      COMPLETION_HOURS_URGENT: 72
      COMPLETION_HOURS_ROUTINE: 720
      HABITABILITY_MAX_COMPLETION_HOURS: 72
    precision: "whole hours added to reported_at; both due timestamps are stored to whole seconds in ISO-8601 Z form"

  - name: habitability_escalation_eligibility
    trigger: "POST /work-orders/{id}/escalate (gate); also evaluated by POST /work-orders/{id}/complete to stamp sla_breached"
    algorithm: threshold
    formula: |
      now      = logical clock
      overdue  = hours between completion_due_at and now (negative if not yet due)
      target   = WorkOrder.escalation_level + 1        # 1 or 2; 2 is the maximum
      needed   = ESCALATION_HOURS[priority_class][target]
      eligible = (overdue >= needed)                    # NOTE: >=, inclusive
      if not eligible: ERR_ESCALATION_NOT_DUE
      # independently, at completion:
      sla_breached = (completed_at > completion_due_at) # NOTE: >, strict
    input_set: "One WorkOrder row and the logical clock. Escalation never looks at sibling work orders."
    constants:
      ESCALATION_HOURS_EMERGENCY_L1: 0
      ESCALATION_HOURS_EMERGENCY_L2: 24
      ESCALATION_HOURS_URGENT_L1: 24
      ESCALATION_HOURS_URGENT_L2: 96
      ESCALATION_HOURS_ROUTINE_L1: 240
      ESCALATION_HOURS_ROUTINE_L2: 480
      MAX_ESCALATION_LEVEL: 2
    precision: "whole seconds. The EMERGENCY level-1 threshold of 0 hours means the clock standing exactly at completion_due_at makes escalation eligible (overdue == 0 >= 0) while sla_breached would still be false (strict >). One second earlier, escalation returns ERR_ESCALATION_NOT_DUE."

  - name: hazard_assessment_severity
    trigger: "POST /hazard-cases/{id}/assess"
    algorithm: threshold
    formula: |
      if hazard_type == MOLD:
          m = affected_area_sqft
          severity = SEVERITY_1 if m <= MOLD_S1_MAX_SQFT                      # <= 10
                     else SEVERITY_2 if m <= MOLD_S2_MAX_SQFT                 # <= 30
                     else SEVERITY_3
      if hazard_type == LEAD_PAINT:
          p = lead_level_ppm
          severity = SEVERITY_1 if p <  LEAD_PAINT_S2_MIN_PPM                 # < 5000
                     else SEVERITY_2 if p < LEAD_PAINT_S3_MIN_PPM             # < 10000
                     else SEVERITY_3
      if hazard_type == LEAD_WATER:
          p = lead_level_ppm
          severity = SEVERITY_1 if p <  LEAD_WATER_S2_MIN_PPM                 # < 10
                     else SEVERITY_2 if p < LEAD_WATER_S3_MIN_PPM             # < 15
                     else SEVERITY_3
      displacement_required = (severity == SEVERITY_3)
                              or (severity == SEVERITY_2 and child_under_six_present)
    input_set: "The single HazardCase row's hazard_type plus the measurement supplied at assessment. MOLD reads affected_area_sqft and ignores lead_level_ppm; both LEAD types read lead_level_ppm and ignore affected_area_sqft."
    constants:
      MOLD_S1_MAX_SQFT: 10
      MOLD_S2_MAX_SQFT: 30
      LEAD_PAINT_S2_MIN_PPM: 5000
      LEAD_PAINT_S3_MIN_PPM: 10000
      LEAD_WATER_S2_MIN_PPM: 10
      LEAD_WATER_S3_MIN_PPM: 15
    precision: "MOLD boundaries are inclusive upper bounds (exactly 10 sqft is SEVERITY_1, exactly 30 sqft is SEVERITY_2); LEAD boundaries are inclusive lower bounds (exactly 5000 ppm paint is SEVERITY_2, exactly 15 ppm water is SEVERITY_3). SEVERITY_2 alone does not displace unless a child under six is present."

  - name: hazard_abatement_posting
    trigger: "fourth hop of the assessment cascade — fires when HazardCase entered DISPLACEMENT_ACTIVE and the unit's Lease had allotment_status ACTIVE immediately before the suspension hop"
    algorithm: chronological
    formula: |
      lease   = the HazardCase's lease (allotment_status was ACTIVE before this request)
      d       = assessed_at date
      period  = 'YYYY-MM' of d
      last    = last calendar day of that month
      days    = (last - d) in whole days + 1        # inclusive of the assessment day
      amount  = -(lease.daily_rent_cents * days)    # negative: a credit to the resident
      post AllotmentTransaction { type: ABATEMENT, period_month: period,
                                  amount_cents: amount,
                                  source_ref: 'HAZARD_ABATEMENT:' + hazard_case.id }
    input_set: "The lease's stored daily_rent_cents and the assessment date only. Prior ABATEMENT rows for the same period are not netted out; each qualifying hazard posts its own row."
    constants:
      ABATEMENT_INCLUDES_ASSESSMENT_DAY: true
    precision: "whole cents; the negative sign is part of amount_cents, and running_balance_cents therefore decreases"

  - name: displacement_lodging_authorization
    trigger: "POST /displacement-lodgings/{id}/close"
    algorithm: aggregation
    formula: |
      nights_displaced         = (actual_end_date - start_date) in whole days   # half-open
      per_night_authorized_cents = min(nightly_rate_cents, MAX_NIGHTLY_RATE_CENTS)
                                   + PER_OCCUPANT_MEAL_CENTS * occupants_count
      lodging_authorized_cents = per_night_authorized_cents * nights_displaced
    input_set: "One DisplacementLodging row. The nightly cap applies to the room rate only; the per-occupant meal allowance is added after the cap and is itself uncapped."
    constants:
      MAX_NIGHTLY_RATE_CENTS: 25000
      PER_OCCUPANT_MEAL_CENTS: 6900
    precision: "whole cents, integer nights. Intervals are half-open [start_date, actual_end_date): a lodging closed on its own start_date yields 0 nights and 0 cents."

  - name: displacement_rent_abatement
    trigger: "POST /displacement-lodgings/{id}/close, computed alongside calculations.displacement_lodging_authorization"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round the per-day figure FIRST, then multiply by nights.
      per_day             = lease.daily_rent_cents          # already rounded once at rent-setting
      rent_abatement_cents = per_day * nights_displaced
      # The forbidden alternative — summing an unrounded daily fraction across the
      # nights and rounding the total exactly once — differs by up to nights-1 cents
      # and MUST NOT be used.
    input_set: "The lease's stored daily_rent_cents and the nights computed above. rent_abatement_cents is a reconciliation figure recorded on the DisplacementLodging row; it posts no AllotmentTransaction."
    constants:
      ROUNDING_ORDER: PER_DAY_ROUND_THEN_MULTIPLY
    precision: "round_half_up applied once at rent-setting, never again here. For net_rent_cents 218150 (daily 7172) and 10 nights the answer is 71720; summing 218150*12/365 unrounded over 10 nights and rounding once would give 71721, which is wrong."

  - name: early_termination_settlement
    trigger: "POST /leases/{id}/terminate"
    algorithm: waterfall_allocation
    formula: |
      # PINNED five-step order. Every step consumes the previous step's output.
      # 1. proration of the final partial month
      period_start   = first day of the month containing termination_effective_date
      prorated_days  = (termination_effective_date - period_start) in whole days + 1
      prorated_rent  = lease.daily_rent_cents * prorated_days
      # 2. outstanding dispute credits already awarded on this lease
      awarded_credit = SUM(DisputeCase.credit_award_cents
                           WHERE lease_id = lease.id AND status == CLOSED_RESOLVED)
      # 3. the fee base — credits reduce the base BEFORE the tier is chosen
      fee_base       = max(0, prorated_rent - awarded_credit)
      # 4. tier selection on the reduced base, then the reason rate
      tier_rate      = FEE_TIER_LOW_RATE  if fee_base <  FEE_TIER_BREAK_CENTS   # 0.05
                       else FEE_TIER_HIGH_RATE                                  # 0.08
      reason_rate    = 0.00 if termination_reason in {PCS, DEPLOYMENT, SEPARATION, LANDLORD}
                       else tier_rate                    # only CONVENIENCE pays a fee
      # 5. the fee, then the total
      early_termination_fee_cents = round_half_up(fee_base * reason_rate)
      settlement_total_cents      = fee_base + early_termination_fee_cents
    input_set: "The lease's daily_rent_cents, its CLOSED_RESOLVED DisputeCase credit awards, and the supplied termination_reason. Disputes in any other status contribute nothing."
    constants:
      FEE_TIER_BREAK_CENTS: 100000
      FEE_TIER_LOW_RATE: 0.05
      FEE_TIER_HIGH_RATE: 0.08
      STATUTORY_FEE_EXEMPT_REASONS: "PCS | DEPLOYMENT | SEPARATION | LANDLORD"
    precision: "round_half_up to whole cents, once, at step 5. Applying the credit AFTER tier selection, or after the fee, yields a different total; the pinned order above is authoritative."

  - name: allotment_charge_posting
    trigger: "POST /installations/{id}/allotment-run"
    algorithm: aggregation
    formula: |
      period = the supplied period_month ('YYYY-MM')
      L      = Lease WHERE housing_unit.installation_id = <path id>
                       AND allotment_status == 'ACTIVE'
      order L BY created_at ASC                       # deterministic posting order
      for each lease in L:
          if an AllotmentTransaction with (lease_id, period_month = period,
                                           type = CHARGE) already exists: skip it
          post AllotmentTransaction { type: CHARGE, period_month: period,
                                      amount_cents: lease.net_rent_cents,
                                      source_ref: 'ALLOTMENT_RUN:' + period }
      net_collected_cents = SUM(amount_cents of EVERY AllotmentTransaction row of
                                these leases for this period_month, all types)
    input_set: "Only leases whose allotment_status is ACTIVE. NOT_STARTED, SUSPENDED and CLOSED leases are skipped, as are leases that already carry a CHARGE row for the period (making the run idempotent per period)."
    constants:
      CHARGE_ROWS_PER_LEASE_PER_PERIOD: 1
    precision: "whole cents; net_collected_cents nets ABATEMENT credits (negative) against CHARGE debits, so it can be lower than the gross charged"

  - name: occupancy_rate_determination
    trigger: "POST /reinvestment-accounts/{id}/metrics-run"
    algorithm: weighted_scoring
    formula: |
      # shared inputs
      units = HousingUnit WHERE installation_id = account.installation_id
      P     = the supplied period_month; first_day .. last_day; D = days in month
      # variant-specific numerator, see `variants` below
      occupancy_rate_pct = round_half_up(100 * numerator / denominator, 2)
    input_set: "Every HousingUnit of the installation forms the denominator, including OFFLINE_MAINTENANCE and HAZARD_HOLD units — taking a unit offline lowers the occupancy rate rather than shrinking the denominator."
    constants:
      OCCUPANCY_DECIMALS: 2
    precision: "round_half_up to 2 decimal places, stored as a number such as 90.00"
    variants:
      - name: UNIT_DAY_WEIGHTED
        when: "account.occupancy_basis == UNIT_DAY_WEIGHTED"
        difference: "numerator = SUM over units of the number of days in the period on which that unit had a lease with occupancy_status OCCUPIED or NOTICE_GIVEN (a lease counts from its start_date through the earlier of its termination_effective_date and last_day, inclusive); denominator = count(units) * D. A mid-month move-in therefore contributes only its tail of the month."
      - name: MONTH_END_SNAPSHOT
        when: "account.occupancy_basis == MONTH_END_SNAPSHOT"
        difference: "numerator = count of units whose status is OCCUPIED on last_day; denominator = count(units). Any unit occupied on the final day counts fully regardless of when the family arrived. For two units where one is occupied all 30 days of 2026-09 and the other from 2026-09-07 (24 days), UNIT_DAY_WEIGHTED gives 90.00 while MONTH_END_SNAPSHOT gives 100.00 — a 10.00-point divergence that lands the installation in different incentive multiplier bands."

  - name: performance_incentive_fee
    trigger: "POST /reinvestment-accounts/{id}/metrics-run, immediately after calculations.occupancy_rate_determination"
    algorithm: tiered_pricing
    formula: |
      base_fee = round_half_up(net_collected_cents * Installation.incentive_base_pct)
      r = occupancy_rate_pct
      mult = OCC_MULT_BAND_0 if r <  OCC_BAND_1_MIN            # 0.00 below 85
             else OCC_MULT_BAND_1 if r < OCC_BAND_2_MIN        # 0.50 for 85 .. <92
             else OCC_MULT_BAND_2 if r < OCC_BAND_3_MIN        # 1.00 for 92 .. <96
             else OCC_MULT_BAND_3                             # 1.25 at 96 and above
      escalated = count(WorkOrder WHERE housing_unit.installation_id = account.installation_id
                                    AND escalation_level >= 1
                                    AND reported_at within the period)
      habitability_penalty_pct = min(HABITABILITY_PENALTY_CAP_PCT,
                                     HABITABILITY_PENALTY_STEP_PCT * escalated)
      performance_incentive_fee_cents =
          round_half_up(base_fee * mult * (1 - habitability_penalty_pct))
      contributions_cents = contributions_cents
                            + round_half_up(net_collected_cents * REINVESTMENT_CONTRIB_PCT)
      closing_balance_cents = opening_balance_cents + contributions_cents - expenditures_cents
    input_set: "net_collected_cents from the allotment run for the same period, the occupancy rate just computed, and this installation's work orders escalated to level 1 or 2 within the period. Work orders at escalation_level 0 never penalise."
    constants:
      OCC_BAND_1_MIN: 85
      OCC_BAND_2_MIN: 92
      OCC_BAND_3_MIN: 96
      OCC_MULT_BAND_0: 0.00
      OCC_MULT_BAND_1: 0.50
      OCC_MULT_BAND_2: 1.00
      OCC_MULT_BAND_3: 1.25
      HABITABILITY_PENALTY_STEP_PCT: 0.05
      HABITABILITY_PENALTY_CAP_PCT: 0.50
      REINVESTMENT_CONTRIB_PCT: 0.10
    precision: "round_half_up to whole cents at base_fee, again at the final fee, and again at the contribution. Band edges are inclusive lower bounds: exactly 92.00 pays the 1.00 multiplier, 91.99 pays 0.50."

  - name: unit_inventory_conservation
    trigger: "every write that changes a HousingUnit.status, and every HousingUnit creation"
    algorithm: aggregation
    formula: |
      # compensating invariant — must hold after EVERY request that touches units
      Installation.total_unit_count = available_unit_count
                                    + assigned_unit_count
                                    + occupied_unit_count
                                    + offline_unit_count
                                    + hazard_hold_unit_count
      and each of the five counters equals the live count of the installation's
      HousingUnit rows in the matching status.
    input_set: "All HousingUnit rows of the installation, in every status."
    constants:
      TRACKED_STATUS_COUNT: 5
    precision: "exact integers; a unit released from HAZARD_HOLD back to AVAILABLE moves one count from hazard_hold_unit_count to available_unit_count and leaves the total unchanged"

  - name: allotment_ledger_conservation
    trigger: "every AllotmentTransaction insertion"
    algorithm: aggregation
    formula: |
      # compensating invariant across the append-only ledger
      rows = AllotmentTransaction WHERE lease_id = L ordered by created_at ASC
      each row's running_balance_cents = previous row's running_balance_cents
                                         + this row's amount_cents
                                         (the first row's previous value is 0)
      Lease.allotment_balance_cents = running_balance_cents of the last row
      Lease.abatement_total_cents   = -SUM(amount_cents WHERE type in
                                           {ABATEMENT, ARREARS_ADJUSTMENT})
      # NET, not gross: a compensating positive ARREARS_ADJUSTMENT cancels the
      # ABATEMENT it reverses and drives abatement_total_cents back to 0.
    input_set: "Every AllotmentTransaction row of the lease, in created_at order. Rows are never updated or deleted; a correction is a new signed row."
    constants:
      LEDGER_APPEND_ONLY: true
    precision: "whole cents; abatement_total_cents is reported as a positive magnitude even though the underlying ABATEMENT rows are negative, and returns to exactly 0 once every abatement on the lease has been reversed. REFUND rows from dispute awards are deliberately excluded from abatement_total_cents — they are credits, not habitability abatements."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST violated rule determines the response and short-circuits the
#      rest — no later rule may pre-empt an earlier one)
# =============================================================================
validations:

  # --- auth (1-3) -------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when the acting role is ServiceMember, X-User-ID must equal the ServiceMember.id that owns the addressed resource (application.service_member_id, lease.service_member_id, dispute.service_member_id, or the sponsor of the addressed Dependent)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include ServiceMember"

  # --- request shape (4) ------------------------------------------------------
  - priority: 4
    category: existence
    check: "all required body fields are present, every enum value is a declared member, integers are integers, monetary fields are non-negative integers unless explicitly signed, ISO dates/datetimes parse, and limit/offset are within 1..100 / >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # --- existence (5-15), validated left-to-right along the path then the body -
  - priority: 5
    category: existence
    check: "the addressed Installation exists"
    error_id: ERR_INSTALLATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /installations/{id}, GET /installations/{id}/bah-rates, POST /installations/{id}/waitlist-offer-run, POST /installations/{id}/allotment-run, and any body carrying installation_id"
  - priority: 6
    category: existence
    check: "the addressed HousingUnit exists"
    error_id: ERR_HOUSING_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /housing-units/{id}, POST /housing-units/{id}/status, and any body carrying housing_unit_id"
  - priority: 7
    category: existence
    check: "the addressed ServiceMember exists"
    error_id: ERR_SERVICE_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-members/{id}, GET /service-members/{id}/dependents, POST /service-members/{id}/orders, and any body carrying service_member_id"
  - priority: 8
    category: existence
    check: "the addressed WaitlistApplication exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /waitlist-applications/{id}, POST /waitlist-applications/{id}/*, and POST /leases with application_id"
  - priority: 9
    category: existence
    check: "the addressed Lease exists"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /leases/{id}, GET /leases/{id}/*, POST /leases/{id}/*, and any body carrying lease_id"
  - priority: 10
    category: existence
    check: "the addressed MoveInInspection exists"
    error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /move-in-inspections/{id}, POST /move-in-inspections/{id}/deficiencies, POST /move-in-inspections/{id}/tenant-acknowledge"
  - priority: 11
    category: existence
    check: "the addressed WorkOrder exists, and any supplied parent_work_order_id or source_work_order_id resolves"
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /work-orders/{id}, POST /work-orders/{id}/*, POST /work-orders with parent_work_order_id, POST /hazard-cases with source_work_order_id"
  - priority: 12
    category: existence
    check: "the addressed HazardCase exists"
    error_id: ERR_HAZARD_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /hazard-cases/{id}, POST /hazard-cases/{id}/*, POST /displacement-lodgings with hazard_case_id"
  - priority: 13
    category: existence
    check: "the addressed DisplacementLodging exists"
    error_id: ERR_LODGING_NOT_FOUND
    http_status: 404
    applies_to: "GET /displacement-lodgings/{id}, POST /displacement-lodgings/{id}/close"
  - priority: 14
    category: existence
    check: "the addressed DisputeCase exists"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /dispute-cases/{id}, POST /dispute-cases/{id}/*"
  - priority: 15
    category: existence
    check: "the addressed ReinvestmentAccount exists"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /reinvestment-accounts/{id}, POST /reinvestment-accounts/{id}/expenditures, POST /reinvestment-accounts/{id}/metrics-run"

  # --- optimistic concurrency (16-18) ----------------------------------------
  - priority: 16
    category: state
    check: "expected_lease_version equals the stored Lease.version"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /leases/{id}/rent-redetermination"
  - priority: 17
    category: state
    check: "expected_application_version equals the stored WaitlistApplication.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /waitlist-applications/{id}/recertify"
  - priority: 18
    category: state
    check: "expected_account_version equals the stored ReinvestmentAccount.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /reinvestment-accounts/{id}/expenditures"

  # --- state preconditions (19-28) -------------------------------------------
  - priority: 19
    category: state
    check: "the requested transition is declared for the current state of the request's PRIMARY target resource in §1.2. This rung is evaluated ONLY when that current state is not one of the entity's terminal states: a resource already parked in a terminal state is not judged here but one rung down, by priority 20, so that the caller learns the tenancy or case is finished rather than that the verb was wrong. Cascade targets are not judged here either; they are governed by the business rules further down the ladder"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 20
    category: state
    check: "the entity is not already in a terminal state (WaitlistApplication HOUSED/EXPIRED, Lease TERMINATED, MoveInInspection COMPLETED, WorkOrder CLOSED, HazardCase CLOSED/VOIDED, DisplacementLodging CLOSED, DisputeCase CLOSED_RESOLVED)"
    error_id: ERR_TERMINAL_STATE_LOCKED
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 21
    category: state
    check: "for accept-offer, the logical clock is at or before WaitlistApplication.offer_expires_at"
    error_id: ERR_OFFER_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /waitlist-applications/{id}/accept-offer"
  - priority: 22
    category: state
    check: "for lease creation, the referenced WaitlistApplication.status is ACCEPTED"
    error_id: ERR_APPLICATION_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /leases"
  - priority: 23
    category: state
    check: "for lease creation, the referenced HousingUnit.status is ASSIGNED and it is the unit the application was offered"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /leases"
  - priority: 24
    category: state
    check: "for move-in, the lease has a MoveInInspection whose status is TENANT_ACKNOWLEDGED or COMPLETED"
    error_id: ERR_INSPECTION_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /leases/{id}/move-in"
  - priority: 25
    category: state
    check: "the lease's occupancy_status is OCCUPIED or NOTICE_GIVEN"
    error_id: ERR_LEASE_NOT_OCCUPIED
    http_status: 409
    applies_to: "POST /leases/{id}/termination-notice, POST /leases/{id}/terminate, POST /dispute-cases"
  - priority: 26
    category: state
    check: "the HazardCase has been assessed (status is not REPORTED) before lodging authorization or clearance"
    error_id: ERR_HAZARD_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /displacement-lodgings, POST /hazard-cases/{id}/clearance"
  - priority: 27
    category: state
    check: "a dispute credit greater than 0 may only be awarded while the lease's allotment_status is ACTIVE or SUSPENDED; a CLOSED allotment ledger accepts no further credit"
    error_id: ERR_ALLOTMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /dispute-cases/{id}/respond with accepted == true and credit_offer_cents > 0, POST /dispute-cases/{id}/installation-decision with credit_award_cents > 0"
  - priority: 28
    category: state
    check: "the WorkOrder's reopen_count is below the reopen budget of the requesting actor — RESIDENT_REOPEN_LIMIT (1) when the actor is a ServiceMember, REOPEN_LIMIT (2) when the actor is a PropertyManager"
    error_id: ERR_REOPEN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /work-orders/{id}/reopen"

  # --- business_safety (29-31) — habitability and compliance ------------------
  - priority: 29
    category: business_safety
    check: "the HousingUnit is not in HAZARD_HOLD; a unit under an environmental hazard hold may not be leased or moved into. HAZARD_HOLD units are simply not AVAILABLE, so the offer run skips them without raising this error"
    error_id: ERR_HAZARD_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /leases, POST /leases/{id}/move-in"
  - priority: 30
    category: business_safety
    check: "the lease's MoveInInspection has critical_open_count == 0, i.e. no HABITABILITY_CRITICAL deficiency entry is still in status OPEN or WORK_ORDER_CREATED"
    error_id: ERR_UNRESOLVED_CRITICAL_DEFICIENCY
    http_status: 409
    applies_to: "POST /leases/{id}/move-in"
  - priority: 31
    category: business_safety
    check: "segregation of duties: the X-User-ID certifying a hazard clearance differs from HazardCase.assessed_by_user_id, and the X-User-ID rendering an installation dispute decision differs from DisputeCase.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hazard-cases/{id}/clearance, POST /dispute-cases/{id}/installation-decision"

  # --- business_referential (32-34) ------------------------------------------
  - priority: 32
    category: business_referential
    check: "a supplied lease_id and housing_unit_id must agree: the lease must be the unit's current non-TERMINATED lease"
    error_id: ERR_LEASE_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /work-orders, POST /hazard-cases, POST /displacement-lodgings"
  - priority: 33
    category: business_referential
    check: "a supplied parent_work_order_id or source_work_order_id must belong to the same HousingUnit as the row being created"
    error_id: ERR_WORK_ORDER_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /work-orders, POST /hazard-cases"
  - priority: 34
    category: business_referential
    check: "termination_reason PCS requires ServiceMember.pcs_orders_ref to be on file; DEPLOYMENT requires deployment_orders_ref and deployment_status DEPLOYED"
    error_id: ERR_ORDERS_NOT_ON_FILE
    http_status: 422
    applies_to: "POST /leases/{id}/termination-notice"

  # --- business_constraint (35-39) ------------------------------------------
  - priority: 35
    category: business_constraint
    check: "the sponsor has at least one full-time-custody Dependent; unaccompanied members are not eligible for family housing"
    error_id: ERR_NOT_ELIGIBLE_FAMILY_HOUSING
    http_status: 422
    applies_to: "POST /waitlist-applications"
  - priority: 36
    category: business_constraint
    check: "the sponsor has no other WaitlistApplication at this installation in status PENDING, OFFERED or ACCEPTED"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 422
    applies_to: "POST /waitlist-applications"
  - priority: 37
    category: business_constraint
    check: "HousingUnit.bedroom_count equals WaitlistApplication.bedroom_eligibility"
    error_id: ERR_BEDROOM_MISMATCH
    http_status: 422
    applies_to: "POST /leases"
  - priority: 38
    category: business_constraint
    check: "HousingUnit.designated_rank_category equals WaitlistApplication.rank_category"
    error_id: ERR_RANK_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /leases"
  - priority: 39
    category: business_constraint
    check: "DisplacementLodging.occupants_count does not exceed 2 + the sponsor's full-time-custody dependent count"
    error_id: ERR_OCCUPANTS_EXCEED_AUTHORIZED
    http_status: 422
    applies_to: "POST /displacement-lodgings"

  # --- business_temporal (40-44) --------------------------------------------
  - priority: 40
    category: business_temporal
    check: "the requested lodging interval [start_date, end_date) does not overlap any AUTHORIZED or CLOSED DisplacementLodging interval on the same lease; adjacency (previous end_date == new start_date) is allowed"
    error_id: ERR_LODGING_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /displacement-lodgings"
  - priority: 41
    category: business_temporal
    check: "the new lease's start_date is at least Installation.turn_buffer_days whole days after the unit's last_lease_end_date"
    error_id: ERR_UNIT_TURN_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /leases"
  - priority: 42
    category: business_temporal
    check: "termination_effective_date is at least 30 whole days after termination_notice_date, except for PCS and DEPLOYMENT reasons which permit 14"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /leases/{id}/termination-notice"
  - priority: 43
    category: business_temporal
    check: "the work order is overdue by at least the escalation threshold hours for its priority_class and target level"
    error_id: ERR_ESCALATION_NOT_DUE
    http_status: 409
    applies_to: "POST /work-orders/{id}/escalate"
  - priority: 44
    category: business_temporal
    check: "no metrics run has already been recorded for this ReinvestmentAccount and period_month, and the requested period is not in the future relative to the logical clock"
    error_id: ERR_PERIOD_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /reinvestment-accounts/{id}/metrics-run"

  # --- business_fiscal (45-46) — money checks last --------------------------
  - priority: 45
    category: business_fiscal
    check: "a BahRate row exists for (installation_id, pay_grade, with_dependents, effective_year) as selected by the active variant"
    error_id: ERR_BAH_RATE_NOT_ON_FILE
    http_status: 422
    applies_to: "POST /leases, POST /leases/{id}/move-in, POST /leases/{id}/rent-redetermination"
  - priority: 46
    category: business_fiscal
    check: "the requested expenditure does not exceed ReinvestmentAccount.closing_balance_cents"
    error_id: ERR_REINVESTMENT_BALANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /reinvestment-accounts/{id}/expenditures (never the cascaded lodging expenditure)"

# =============================================================================
# §1.5 API Endpoint Table
#   Roles: PlatformAdmin | PropertyManager | ServiceMember | MaintenanceTech
#          | EnvironmentalSpecialist | InstallationHousingOffice
#   Every path template uses the literal placeholder {id}.
# =============================================================================
endpoints:

  # --- test-driving surface ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to the supplied instant. Every deadline, SLA, expiry and period rule in this domain reads this clock, never wall time. Before the first call the clock reads exactly 2026-08-01T00:00:00Z, which is the mandatory startup default and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock; no business entity is modified"]

  # --- Installation -----------------------------------------------------------
  - method: POST
    path: "/installations"
    description: "Registers a privatized housing project at an installation, with its turn, offer and incentive policy knobs."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "branch", "mha_code", "bill_of_rights_version", "turn_buffer_days?", "offer_response_hours?", "decline_limit?", "decline_penalty_days?", "incentive_base_pct?"]
    output: Installation
    side_effects: ["all six unit counters and pending_application_count initialise to 0", "offer_run_epoch initialises to 0 and last_offer_run_at to null"]
  - method: GET
    path: "/installations/{id}"
    description: "Reads one installation with its live inventory counters."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: Installation
    side_effects: []
  - method: GET
    path: "/installations/{id}/bah-rates"
    description: "Lists the BAH rate table rows on file for this installation. Reverse-reachability channel for BahRate.installation_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["pay_grade?", "with_dependents?", "effective_year?", "limit?", "offset?"]
    output: BahRate[]
    side_effects: []
  - method: POST
    path: "/installations/{id}/waitlist-offer-run"
    description: "Ops-run checkpoint. Walks the installation's AVAILABLE units in bedroom_count ASC then created_at ASC order and offers each one to the highest-ranked eligible PENDING application, per calculations.waitlist_offer_selection."
    roles: [PropertyManager, InstallationHousingOffice]
    code: 200
    input: []
    output: Installation
    side_effects: ["each matched WaitlistApplication moves PENDING -> OFFERED with offered_unit_id, offer_count += 1 and offer_expires_at = clock + offer_response_hours", "each matched HousingUnit moves AVAILABLE -> ASSIGNED", "units with an empty candidate pool are skipped without error", "increments offer_run_epoch by 1 and stamps last_offer_run_at", "recomputes available_unit_count, assigned_unit_count and pending_application_count"]
  - method: POST
    path: "/installations/{id}/allotment-run"
    description: "Ops-run checkpoint. Posts one CHARGE AllotmentTransaction per ACTIVE lease for the supplied period_month, per calculations.allotment_charge_posting."
    roles: [PropertyManager, PlatformAdmin]
    code: 200
    input: [period_month]
    output: Installation
    side_effects: ["one CHARGE AllotmentTransaction per ACTIVE lease lacking one for the period, in created_at ASC lease order", "each lease's allotment_balance_cents advances to the new running balance", "leases that already carry a CHARGE row for the period are skipped, making a repeat run a no-op"]

  # --- BahRate ---------------------------------------------------------------
  - method: POST
    path: "/bah-rates"
    description: "Loads one immutable BAH rate row. BahRate carries no version and has no update endpoint; a corrected rate is a new row for a new effective_year."
    roles: [PlatformAdmin]
    code: 201
    input: [installation_id, pay_grade, with_dependents, effective_year, monthly_rate_cents, utility_allowance_cents]
    output: BahRate
    side_effects: []

  # --- HousingUnit -----------------------------------------------------------
  - method: POST
    path: "/housing-units"
    description: "Adds a housing unit to an installation's inventory in status AVAILABLE."
    roles: [PlatformAdmin, PropertyManager]
    code: 201
    input: ["installation_id", "unit_code", "bedroom_count", "unit_type", "designated_rank_category", "historic_flag?", "accessibility_features?"]
    output: HousingUnit
    side_effects: ["Installation.total_unit_count += 1 and available_unit_count += 1, preserving calculations.unit_inventory_conservation"]
  - method: GET
    path: "/housing-units/{id}"
    description: "Reads one housing unit."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: HousingUnit
    side_effects: []
  - method: GET
    path: "/housing-units"
    description: "Lists housing units, filterable by installation, status and bedroom count. Reverse-reachability channel for HousingUnit.installation_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: ["installation_id?", "status?", "bedroom_count?", "unit_type?", "limit?", "offset?"]
    output: HousingUnit[]
    side_effects: []
  - method: POST
    path: "/housing-units/{id}/status"
    description: "Operator-driven unit status change: AVAILABLE <-> OFFLINE_MAINTENANCE, AVAILABLE|ASSIGNED -> HAZARD_HOLD (hazard_hold_reason required), HAZARD_HOLD -> AVAILABLE."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: ["status", "hazard_hold_reason?"]
    output: HousingUnit
    side_effects: ["moves the unit along the §1.2 HousingUnit machine", "recomputes the five Installation status counters", "clears hazard_hold_reason on any transition out of HAZARD_HOLD"]

  # --- ServiceMember / Dependent --------------------------------------------
  - method: POST
    path: "/service-members"
    description: "Registers a sponsor. rank_category is derived from pay_grade by calculations.rank_category_derivation and any supplied value is ignored."
    roles: [PlatformAdmin, InstallationHousingOffice]
    code: 201
    input: [dodid, last_name, first_name, branch, pay_grade]
    output: ServiceMember
    side_effects: ["stamps rank_category from pay_grade", "deployment_status initialises to NOT_DEPLOYED and dependent_count to 0"]
  - method: GET
    path: "/service-members/{id}"
    description: "Reads one sponsor."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: ServiceMember
    side_effects: []
  - method: GET
    path: "/service-members/{id}/dependents"
    description: "Lists a sponsor's dependents. Reverse-reachability channel for Dependent.service_member_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["relationship?", "is_full_time_custody?", "limit?", "offset?"]
    output: Dependent[]
    side_effects: []
  - method: POST
    path: "/service-members/{id}/orders"
    description: "Records deployment, PCS or promotion orders against a sponsor. Deployment status drives both the waitlist control-date credit and the DEPLOYMENT lease-termination right; pay_grade carries a promotion."
    roles: [PlatformAdmin, InstallationHousingOffice]
    code: 200
    input: ["deployment_status?", "deployment_orders_ref?", "expected_return_date?", "pcs_orders_ref?", "pcs_report_date?", "pay_grade?"]
    output: ServiceMember
    side_effects: ["updates the supplied orders fields only; already-stamped WaitlistApplication.effective_control_date values are NOT retroactively adjusted until the application is recertified", "when pay_grade is supplied it replaces ServiceMember.pay_grade and ServiceMember.rank_category is re-derived per calculations.rank_category_derivation; already-stamped WaitlistApplication.rank_category values are NOT retroactively adjusted until the application is recertified"]
  - method: POST
    path: "/dependents"
    description: "Adds a dependent to a sponsor's family composition."
    roles: [PlatformAdmin, ServiceMember, InstallationHousingOffice]
    code: 201
    input: ["service_member_id", "relationship", "date_of_birth", "gender", "is_full_time_custody?"]
    output: Dependent
    side_effects: ["ServiceMember.dependent_count is recomputed as the count of full-time-custody dependents", "existing WaitlistApplication.bedroom_eligibility snapshots are NOT recomputed until recertify runs"]

  # --- WaitlistApplication ---------------------------------------------------
  - method: POST
    path: "/waitlist-applications"
    description: "Places a sponsor on an installation's family-housing waitlist. Snapshots rank_category, dependent_count_at_application and bedroom_eligibility, and computes the effective control date."
    roles: [ServiceMember, InstallationHousingOffice]
    code: 201
    input: ["installation_id", "service_member_id", "pcs_orders_date", "expected_arrival_date", "accessibility_required?"]
    output: WaitlistApplication
    side_effects: ["runs calculations.effective_control_date_determination then calculations.bedroom_eligibility_determination", "copies ServiceMember.rank_category and dependent_count into the snapshot fields", "status initialises to PENDING; decline_count and offer_count initialise to 0", "Installation.pending_application_count += 1"]
  - method: GET
    path: "/waitlist-applications/{id}"
    description: "Reads one waitlist application with its snapshot and offer state."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: []
    output: WaitlistApplication
    side_effects: []
  - method: GET
    path: "/waitlist-applications"
    description: "Lists waitlist applications. Reverse-reachability channel for installation_id, service_member_id and offered_unit_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["installation_id?", "service_member_id?", "offered_unit_id?", "status?", "limit?", "offset?"]
    output: WaitlistApplication[]
    side_effects: []
  - method: POST
    path: "/waitlist-applications/{id}/recertify"
    description: "Annual or event-driven recertification. Re-runs the control-date and bedroom-eligibility rules against the sponsor's CURRENT orders and dependents. Optimistically concurrent on WaitlistApplication.version."
    roles: [PlatformAdmin, InstallationHousingOffice]
    code: 200
    input: ["expected_application_version", "pcs_orders_date?"]
    output: WaitlistApplication
    side_effects: ["re-runs calculations.effective_control_date_determination, re-applying decline_count * decline_penalty_days", "re-runs calculations.bedroom_eligibility_determination and re-snapshots rank_category and dependent_count_at_application", "increments WaitlistApplication.version by 1"]
  - method: POST
    path: "/waitlist-applications/{id}/accept-offer"
    description: "Sponsor accepts the offered unit. Must be called while the offer window is open."
    roles: [ServiceMember, InstallationHousingOffice]
    code: 200
    input: []
    output: WaitlistApplication
    side_effects: ["status OFFERED -> ACCEPTED", "the offered HousingUnit stays ASSIGNED, reserved for this sponsor until the lease is created", "Installation.pending_application_count is recomputed"]
  - method: POST
    path: "/waitlist-applications/{id}/decline-offer"
    description: "Sponsor declines the offered unit. Returns the application to PENDING with a control-date penalty, or expires it once the installation's decline_limit is reached."
    roles: [ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["decline_reason?"]
    output: WaitlistApplication
    side_effects: ["decline_count += 1", "when decline_count < Installation.decline_limit: status OFFERED -> PENDING, offered_unit_id and offer_expires_at cleared, effective_control_date advanced by decline_penalty_days", "when decline_count reaches Installation.decline_limit: status OFFERED -> EXPIRED (terminal)", "the released HousingUnit returns ASSIGNED -> AVAILABLE and the Installation counters are recomputed"]

  # --- Lease -----------------------------------------------------------------
  - method: POST
    path: "/leases"
    description: "Creates the lease for an ACCEPTED application on its offered unit. Rent is set with the OFFER_PROVISIONAL variant of calculations.gross_rent_determination."
    roles: [PropertyManager]
    code: 201
    input: ["application_id", "housing_unit_id", "start_date", "term_months"]
    output: Lease
    side_effects: ["runs calculations.gross_rent_determination (OFFER_PROVISIONAL) and calculations.daily_rent_rate, stamping rent_basis, rent_effective_year, gross_rent_cents, utility_allowance_cents, net_rent_cents and daily_rent_cents", "occupancy_status initialises to PENDING_MOVE_IN and allotment_status to NOT_STARTED", "WaitlistApplication.status ACCEPTED -> HOUSED (terminal)", "HousingUnit stays ASSIGNED until move-in", "Installation.pending_application_count is recomputed"]
  - method: GET
    path: "/leases/{id}"
    description: "Reads one lease with both status dimensions and all money fields."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/leases"
    description: "Lists leases. Reverse-reachability channel for application_id, housing_unit_id and service_member_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: ["application_id?", "housing_unit_id?", "service_member_id?", "occupancy_status?", "allotment_status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: GET
    path: "/leases/{id}/move-in-inspections"
    description: "Lists the lease's move-in inspections. Reverse-reachability channel for MoveInInspection.lease_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MoveInInspection[]
    side_effects: []
  - method: GET
    path: "/leases/{id}/allotment-transactions"
    description: "Lists the lease's append-only allotment ledger in created_at ASC order. Reverse-reachability channel for AllotmentTransaction.lease_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["period_month?", "type?", "limit?", "offset?"]
    output: AllotmentTransaction[]
    side_effects: []
  - method: POST
    path: "/leases/{id}/rent-redetermination"
    description: "Re-prices an existing lease with the MOVE_IN_FINAL variant for the calendar year of the supplied effective_date. Optimistically concurrent on Lease.version."
    roles: [PropertyManager, PlatformAdmin]
    code: 200
    input: ["expected_lease_version", "effective_date"]
    output: Lease
    side_effects: ["re-runs calculations.gross_rent_determination (MOVE_IN_FINAL) and calculations.daily_rent_rate against the sponsor's CURRENT dependent_count", "sets rent_basis to MOVE_IN_FINAL and rent_effective_year to the effective_date's year", "increments Lease.version by 1", "posts no AllotmentTransaction; the new rent applies to subsequent allotment runs only"]
  - method: POST
    path: "/leases/{id}/move-in"
    description: "Records the family's arrival. Finalises rent, opens the allotment, and takes the unit to OCCUPIED."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["re-runs calculations.gross_rent_determination (MOVE_IN_FINAL) and calculations.daily_rent_rate; rent_basis becomes MOVE_IN_FINAL", "occupancy_status PENDING_MOVE_IN -> OCCUPIED and allotment_status NOT_STARTED -> ACTIVE", "HousingUnit ASSIGNED -> OCCUPIED and the Installation counters are recomputed", "increments Lease.version by 1"]
  - method: POST
    path: "/leases/{id}/termination-notice"
    description: "Resident or landlord notice of termination. PCS and DEPLOYMENT orders shorten the required notice period and waive the early-termination fee."
    roles: [PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["termination_reason", "termination_notice_date", "termination_effective_date"]
    output: Lease
    side_effects: ["occupancy_status OCCUPIED -> NOTICE_GIVEN", "stores termination_reason, termination_notice_date and termination_effective_date", "increments Lease.version by 1"]
  - method: POST
    path: "/leases/{id}/terminate"
    description: "Closes out a lease that is under notice, computing the final settlement per calculations.early_termination_settlement."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["runs calculations.early_termination_settlement, stamping early_termination_fee_cents and settlement_total_cents", "posts an EARLY_TERMINATION_FEE AllotmentTransaction when the fee is non-zero, advancing allotment_balance_cents", "occupancy_status NOTICE_GIVEN -> TERMINATED (terminal) and allotment_status ACTIVE -> CLOSED", "HousingUnit OCCUPIED -> AVAILABLE with last_lease_end_date set to termination_effective_date, arming the turn-buffer rule for the next lease", "recomputes the Installation unit counters", "increments Lease.version by 1"]

  # --- MoveInInspection ------------------------------------------------------
  - method: POST
    path: "/move-in-inspections"
    description: "Schedules the move-in inspection for a lease that is still PENDING_MOVE_IN."
    roles: [PropertyManager]
    code: 201
    input: ["lease_id", "scheduled_date"]
    output: MoveInInspection
    side_effects: ["status initialises to SCHEDULED, deficiency_count and critical_open_count to 0", "conducted_by_user_id is stamped from the acting X-User-ID"]
  - method: GET
    path: "/move-in-inspections/{id}"
    description: "Reads one move-in inspection with its deficiency list and acknowledgment record."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, InstallationHousingOffice]
    code: 200
    input: []
    output: MoveInInspection
    side_effects: []
  - method: POST
    path: "/move-in-inspections/{id}/deficiencies"
    description: "Logs the walk-through deficiency list. No work order is created here: each HABITABILITY_CRITICAL entry spawns its habitability work order later, at tenant acknowledgment."
    roles: [PropertyManager]
    code: 200
    input: ["deficiencies"]
    output: MoveInInspection
    side_effects: ["status SCHEDULED -> DEFICIENCIES_LOGGED", "appends each supplied { deficiency_code, room, severity } entry with status OPEN and work_order_id null", "recomputes deficiency_count and critical_open_count", "no WorkOrder is created here; HABITABILITY_CRITICAL entries spawn their work orders at tenant acknowledgment"]
  - method: POST
    path: "/move-in-inspections/{id}/tenant-acknowledge"
    description: "Records the resident's signature on the inspection and on the Tenant Bill of Rights version supplied."
    roles: [ServiceMember]
    code: 200
    input: ["tenant_signature_name", "bill_of_rights_version_ack"]
    output: MoveInInspection
    side_effects: ["status SCHEDULED or DEFICIENCIES_LOGGED -> TENANT_ACKNOWLEDGED", "stamps tenant_signature_name, tenant_signature_at and bill_of_rights_version_ack", "copies the acknowledged version onto the Lease as bill_of_rights_version_ack with bill_of_rights_ack_at (Lease.version += 1)", "second hop: every HABITABILITY_CRITICAL deficiency entry in status OPEN flips to WORK_ORDER_CREATED and spawns a WorkOrder on the unit with category equal to the entry's deficiency_code, habitability_impact true and inspection_deficiency_code set, classified by calculations.work_order_priority_classification", "third hop: critical_open_count is recomputed from the non-RESOLVED critical entries, so move-in stays blocked until each spawned order completes", "an inspection acknowledged with no HABITABILITY_CRITICAL entries auto-completes to COMPLETED in this same request"]

  # --- WorkOrder -------------------------------------------------------------
  - method: POST
    path: "/work-orders"
    description: "Submits a maintenance request. Priority class and both SLA clocks are derived by calculations.work_order_priority_classification."
    roles: [PropertyManager, ServiceMember, MaintenanceTech]
    code: 201
    input: ["housing_unit_id", "lease_id?", "parent_work_order_id?", "category", "description", "habitability_impact?"]
    output: WorkOrder
    side_effects: ["stamps priority_class, reported_at, response_due_at and completion_due_at", "status initialises to SUBMITTED, escalation_level and reopen_count to 0, sla_breached to false", "MOLD_SUSPECTED and LEAD_SUSPECTED categories are floored at URGENT even when habitability_impact is false"]
  - method: GET
    path: "/work-orders/{id}"
    description: "Reads one work order with its SLA and escalation state."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "Lists work orders. Reverse-reachability channel for housing_unit_id, lease_id and the self-referential parent_work_order_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: ["housing_unit_id?", "lease_id?", "parent_work_order_id?", "status?", "priority_class?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/assign"
    description: "Assigns a technician and records the first response."
    roles: [PropertyManager]
    code: 200
    input: ["assigned_tech_user_id"]
    output: WorkOrder
    side_effects: ["status SUBMITTED -> ASSIGNED or REOPENED -> ASSIGNED", "stamps first_response_at on the first assignment only"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Technician begins work."
    roles: [MaintenanceTech]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status ASSIGNED -> IN_PROGRESS"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Technician completes the work order, stamping the SLA breach flag."
    roles: [MaintenanceTech]
    code: 200
    input: ["completion_note?"]
    output: WorkOrder
    side_effects: ["status IN_PROGRESS -> COMPLETED when reopen_count < 2, or IN_PROGRESS -> CLOSED (terminal) when reopen_count has already reached 2", "completed_at stamped and sla_breached set from a STRICT comparison completed_at > completion_due_at", "when inspection_deficiency_code is set: that MoveInInspection.deficiencies entry flips to RESOLVED, critical_open_count is recomputed, and an inspection whose critical_open_count reaches 0 advances TENANT_ACKNOWLEDGED -> COMPLETED", "when this order is a HazardCase.remediation_work_order_id: the case advances REMEDIATION_IN_PROGRESS or DISPLACEMENT_ACTIVE -> CLEARANCE_PENDING, closing every AUTHORIZED DisplacementLodging on the case and cascading their lodging_authorized_cents into the ReinvestmentAccount"]
  - method: POST
    path: "/work-orders/{id}/reopen"
    description: "Resident or manager reopens a completed work order that did not resolve the problem."
    roles: [PropertyManager, ServiceMember]
    code: 200
    input: ["reopen_reason"]
    output: WorkOrder
    side_effects: ["status COMPLETED -> REOPENED and reopen_count += 1", "completed_at is cleared; response_due_at and completion_due_at are NOT recomputed, so the original SLA clocks continue to run", "rejected with ERR_REOPEN_LIMIT_REACHED when the caller's reopen budget is spent: a ServiceMember may only reopen an order whose reopen_count is still 0, a PropertyManager one whose reopen_count is still below 2"]
  - method: POST
    path: "/work-orders/{id}/escalate"
    description: "Habitability escalation to the installation housing office. Allowed only once the overdue hours reach the threshold for the order's priority class and target level. A self-loop: status is preserved while escalation_level advances."
    roles: [ServiceMember, PropertyManager, InstallationHousingOffice]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["escalation_level += 1 (capped at 2) and escalated_at stamped; status is unchanged", "an EMERGENCY order becomes escalatable at exactly completion_due_at, one full second before sla_breached could become true", "escalated orders feed habitability_penalty_pct in calculations.performance_incentive_fee"]

  # --- HazardCase ------------------------------------------------------------
  - method: POST
    path: "/hazard-cases"
    description: "Opens an environmental hazard case (mold or lead) against a unit, optionally sourced from a MOLD_SUSPECTED / LEAD_SUSPECTED work order."
    roles: [PropertyManager, ServiceMember, EnvironmentalSpecialist]
    code: 201
    input: ["housing_unit_id", "lease_id?", "source_work_order_id?", "hazard_type", "reported_symptoms"]
    output: HazardCase
    side_effects: ["status initialises to REPORTED", "no HousingUnit status change and no ledger effect: reporting a hazard is not yet a finding. The unit only enters HAZARD_HOLD if the certified assessment concludes displacement is required"]
  - method: GET
    path: "/hazard-cases/{id}"
    description: "Reads one hazard case with its assessment and clearance record."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: HazardCase
    side_effects: []
  - method: GET
    path: "/hazard-cases"
    description: "Lists hazard cases. Reverse-reachability channel for housing_unit_id, lease_id, source_work_order_id and remediation_work_order_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, MaintenanceTech, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: ["housing_unit_id?", "lease_id?", "source_work_order_id?", "remediation_work_order_id?", "hazard_type?", "status?", "limit?", "offset?"]
    output: HazardCase[]
    side_effects: []
  - method: POST
    path: "/hazard-cases/{id}/assess"
    description: "Certified assessment. Grades severity per calculations.hazard_assessment_severity, forks into the remediation-only or displacement branch, and posts the habitability rent abatement."
    roles: [EnvironmentalSpecialist]
    code: 200
    input: ["affected_area_sqft?", "lead_level_ppm?", "child_under_six_present"]
    output: HazardCase
    side_effects: ["stamps assessment_severity, displacement_required, child_under_six_present, assessed_by_user_id and assessed_at", "creates the remediation WorkOrder on the unit (category MOLD_SUSPECTED for MOLD, LEAD_SUSPECTED for the lead types, habitability_impact = displacement_required) and stores its id as remediation_work_order_id", "status REPORTED -> ASSESSED, then immediately forks: -> REMEDIATION_IN_PROGRESS when displacement_required is false, or -> DISPLACEMENT_ACTIVE when it is true", "branch B only: HousingUnit OCCUPIED -> HAZARD_HOLD, then Lease.allotment_status ACTIVE -> SUSPENDED, then a negative ABATEMENT AllotmentTransaction per calculations.hazard_abatement_posting advancing allotment_balance_cents and abatement_total_cents", "branch A leaves the unit, the lease and the ledger untouched"]
  - method: POST
    path: "/hazard-cases/{id}/clearance"
    description: "Post-remediation clearance test. Segregation of duties: the certifying user may not be the assessor."
    roles: [EnvironmentalSpecialist]
    code: 200
    input: ["clearance_test_passed"]
    output: HazardCase
    side_effects: ["stamps clearance_test_passed and cleared_by_user_id", "on pass: status CLEARANCE_PENDING -> CLOSED (terminal), HousingUnit HAZARD_HOLD -> OCCUPIED with hazard_hold_reason cleared, and Lease.allotment_status SUSPENDED -> ACTIVE with NO reinstating ledger row — the abatement is earned and stays", "on fail: status CLEARANCE_PENDING -> REMEDIATION_IN_PROGRESS, a follow-on WorkOrder is created with parent_work_order_id = the old remediation order, remediation_work_order_id is repointed to it, and the unit stays in HAZARD_HOLD"]
  - method: POST
    path: "/hazard-cases/{id}/void"
    description: "Compensating transition. Voids a hazard case opened in error and reverses every side effect it caused."
    roles: [PlatformAdmin, InstallationHousingOffice]
    code: 200
    input: ["void_reason"]
    output: HazardCase
    side_effects: ["status -> VOIDED (terminal) from ASSESSED, REMEDIATION_IN_PROGRESS, DISPLACEMENT_ACTIVE or CLEARANCE_PENDING", "any open remediation WorkOrder is driven to CLOSED", "any AUTHORIZED DisplacementLodging is closed with actual_end_date equal to its start_date, yielding nights_displaced 0 and lodging_authorized_cents 0", "every ABATEMENT AllotmentTransaction this case posted is reversed by an equal and opposite ARREARS_ADJUSTMENT row, returning Lease.allotment_balance_cents to its pre-abatement value and abatement_total_cents to 0 with no drift", "HousingUnit HAZARD_HOLD -> OCCUPIED, Lease.allotment_status SUSPENDED -> ACTIVE, and the Installation counters are recomputed"]

  # --- DisplacementLodging ---------------------------------------------------
  - method: POST
    path: "/displacement-lodgings"
    description: "Authorises temporary lodging for a displaced family. Intervals are half-open [start_date, end_date) and may not overlap another lodging on the same lease."
    roles: [PropertyManager, EnvironmentalSpecialist]
    code: 201
    input: ["hazard_case_id", "lease_id", "start_date", "end_date", "nightly_rate_cents", "occupants_count"]
    output: DisplacementLodging
    side_effects: ["status initialises to AUTHORIZED with nights_displaced, per_night_authorized_cents, lodging_authorized_cents and rent_abatement_cents all 0 until closure"]
  - method: GET
    path: "/displacement-lodgings/{id}"
    description: "Reads one lodging authorisation."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: []
    output: DisplacementLodging
    side_effects: []
  - method: GET
    path: "/displacement-lodgings"
    description: "Lists lodging authorisations. Reverse-reachability channel for hazard_case_id and lease_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, EnvironmentalSpecialist, InstallationHousingOffice]
    code: 200
    input: ["hazard_case_id?", "lease_id?", "status?", "limit?", "offset?"]
    output: DisplacementLodging[]
    side_effects: []
  - method: POST
    path: "/displacement-lodgings/{id}/close"
    description: "Closes the lodging on the actual return date and computes the authorised lodging cost and the reconciliation abatement."
    roles: [PropertyManager]
    code: 200
    input: ["actual_end_date"]
    output: DisplacementLodging
    side_effects: ["runs calculations.displacement_lodging_authorization and calculations.displacement_rent_abatement", "status AUTHORIZED -> CLOSED (terminal)", "the ReinvestmentAccount for (installation_id, calendar year of actual_end_date) has expenditures_cents increased by lodging_authorized_cents and closing_balance_cents recomputed, with version += 1; this cascaded expenditure bypasses the balance-sufficiency check and is skipped silently when no account row exists"]

  # --- DisputeCase -----------------------------------------------------------
  - method: POST
    path: "/dispute-cases"
    description: "Resident opens a dispute against the landlord over rent, maintenance quality, habitability, damage or utility billing."
    roles: [ServiceMember]
    code: 201
    input: ["lease_id", "service_member_id", "category", "description"]
    output: DisputeCase
    side_effects: ["status initialises to UNDER_REVIEW with round_count 0", "stamps opened_at and resolution_due_at = opened_at + 30 days"]
  - method: GET
    path: "/dispute-cases/{id}"
    description: "Reads one dispute case with its negotiation round history."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []
  - method: GET
    path: "/dispute-cases"
    description: "Lists dispute cases. Reverse-reachability channel for lease_id and service_member_id."
    roles: [PlatformAdmin, PropertyManager, ServiceMember, InstallationHousingOffice]
    code: 200
    input: ["lease_id?", "service_member_id?", "category?", "status?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []
  - method: POST
    path: "/dispute-cases/{id}/propose-resolution"
    description: "Landlord proposes a remedy and an optional rent credit."
    roles: [PropertyManager]
    code: 200
    input: ["proposed_remedy", "credit_offer_cents"]
    output: DisputeCase
    side_effects: ["status UNDER_REVIEW -> PROPOSED_RESOLUTION", "round_count += 1 and proposed_by_user_id stamped from the acting X-User-ID", "stores proposed_remedy and credit_offer_cents"]
  - method: POST
    path: "/dispute-cases/{id}/respond"
    description: "Resident accepts or rejects the proposed resolution. A third rejection auto-escalates to the installation housing office."
    roles: [ServiceMember]
    code: 200
    input: ["accepted"]
    output: DisputeCase
    side_effects: ["on accept: status PROPOSED_RESOLUTION -> CLOSED_RESOLVED with credit_award_cents = credit_offer_cents, and a REFUND AllotmentTransaction of amount_cents = -credit_award_cents is posted, advancing Lease.allotment_balance_cents; rejected with ERR_ALLOTMENT_NOT_ACTIVE when the credit is positive and the lease ledger is CLOSED", "on reject with round_count < 3: status PROPOSED_RESOLUTION -> RESIDENT_REJECTED then automatically -> UNDER_REVIEW for another round", "on reject with round_count == 3: status PROPOSED_RESOLUTION -> RESIDENT_REJECTED then automatically -> ESCALATED_INSTALLATION with escalated_at stamped, and no further landlord proposal is accepted"]
  - method: POST
    path: "/dispute-cases/{id}/installation-decision"
    description: "Installation housing office decides an escalated dispute. Segregation of duties: the deciding user may not be the user who proposed the landlord's resolution."
    roles: [InstallationHousingOffice]
    code: 200
    input: ["credit_award_cents", "decision_note?"]
    output: DisputeCase
    side_effects: ["status ESCALATED_INSTALLATION -> CLOSED_RESOLVED (terminal)", "stamps credit_award_cents and decided_by_user_id", "posts a REFUND AllotmentTransaction of amount_cents = -credit_award_cents when the award is positive, advancing Lease.allotment_balance_cents; rejected with ERR_ALLOTMENT_NOT_ACTIVE when the lease ledger is CLOSED", "the awarded credit reduces the fee base in calculations.early_termination_settlement for any later termination of this lease"]

  # --- ReinvestmentAccount ---------------------------------------------------
  - method: POST
    path: "/reinvestment-accounts"
    description: "Opens a reinvestment account for an installation and pins its occupancy measurement basis, which is immutable thereafter. An installation may carry more than one account row (e.g. two fiscal years, or two rows measuring the same period under different bases); the lodging-closure cascade targets the account rows whose fiscal_year equals the calendar year of the close date, in created_at ASC order."
    roles: [PlatformAdmin]
    code: 201
    input: ["installation_id", "fiscal_year", "opening_balance_cents", "occupancy_basis"]
    output: ReinvestmentAccount
    side_effects: ["contributions_cents and expenditures_cents initialise to 0 and closing_balance_cents to opening_balance_cents", "occupancy_rate_pct, net_collected_cents, habitability_penalty_pct and performance_incentive_fee_cents initialise to 0", "metrics_run_epoch initialises to 0 and last_metrics_run_at to null"]
  - method: GET
    path: "/reinvestment-accounts/{id}"
    description: "Reads one reinvestment account with its performance metrics."
    roles: [PlatformAdmin, PropertyManager, InstallationHousingOffice]
    code: 200
    input: []
    output: ReinvestmentAccount
    side_effects: []
  - method: GET
    path: "/reinvestment-accounts"
    description: "Lists reinvestment accounts. Reverse-reachability channel for ReinvestmentAccount.installation_id."
    roles: [PlatformAdmin, PropertyManager, InstallationHousingOffice]
    code: 200
    input: ["installation_id?", "fiscal_year?", "occupancy_basis?", "limit?", "offset?"]
    output: ReinvestmentAccount[]
    side_effects: []
  - method: POST
    path: "/reinvestment-accounts/{id}/expenditures"
    description: "Draws from the reinvestment account for a capital project. Optimistically concurrent on ReinvestmentAccount.version and gated on the available balance."
    roles: [PropertyManager, PlatformAdmin]
    code: 200
    input: ["expected_account_version", "amount_cents", "purpose"]
    output: ReinvestmentAccount
    side_effects: ["expenditures_cents += amount_cents and closing_balance_cents recomputed", "rejected with ERR_REINVESTMENT_BALANCE_INSUFFICIENT when amount_cents exceeds closing_balance_cents", "increments ReinvestmentAccount.version by 1"]
  - method: POST
    path: "/reinvestment-accounts/{id}/metrics-run"
    description: "Ops-run checkpoint. Computes the period's occupancy rate under the account's pinned basis, the net collected allotments, the habitability penalty and the performance incentive fee."
    roles: [PropertyManager, PlatformAdmin]
    code: 200
    input: ["period_month"]
    output: ReinvestmentAccount
    side_effects: ["runs calculations.occupancy_rate_determination under the account's occupancy_basis, then calculations.performance_incentive_fee", "stamps occupancy_rate_pct, net_collected_cents, habitability_penalty_pct and performance_incentive_fee_cents", "contributions_cents grows by 10% of net_collected_cents and closing_balance_cents is recomputed", "increments metrics_run_epoch by 1, stamps last_metrics_run_at, and increments version by 1", "a second run for the same period_month is rejected with ERR_PERIOD_ALREADY_POSTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "the acting role is not listed in the endpoint's §1.5 roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "a ServiceMember acts on an application, lease, dispute or dependent belonging to a different sponsor" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, undeclared enum value, malformed date, negative money where unsigned, or limit/offset out of range" }
  - { id: ERR_INSTALLATION_NOT_FOUND, http: 404, condition: "the addressed or referenced Installation does not exist" }
  - { id: ERR_HOUSING_UNIT_NOT_FOUND, http: 404, condition: "the addressed or referenced HousingUnit does not exist" }
  - { id: ERR_SERVICE_MEMBER_NOT_FOUND, http: 404, condition: "the addressed or referenced ServiceMember does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "the addressed or referenced WaitlistApplication does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "the addressed or referenced Lease does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "the addressed MoveInInspection does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "the addressed WorkOrder, or a referenced parent_work_order_id / source_work_order_id, does not exist" }
  - { id: ERR_HAZARD_CASE_NOT_FOUND, http: 404, condition: "the addressed or referenced HazardCase does not exist" }
  - { id: ERR_LODGING_NOT_FOUND, http: 404, condition: "the addressed DisplacementLodging does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "the addressed DisputeCase does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "the addressed ReinvestmentAccount does not exist" }
  - { id: ERR_STALE_LEASE_VERSION, http: 412, condition: "expected_lease_version does not match the stored Lease.version on rent redetermination" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match the stored WaitlistApplication.version on recertification" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match the stored ReinvestmentAccount.version on expenditure" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "the requested transition is not declared for the entity's current state" }
  - { id: ERR_TERMINAL_STATE_LOCKED, http: 409, condition: "the entity is already in a terminal state and admits no further transition" }
  - { id: ERR_OFFER_WINDOW_CLOSED, http: 409, condition: "accept-offer called after WaitlistApplication.offer_expires_at" }
  - { id: ERR_APPLICATION_NOT_ACCEPTED, http: 409, condition: "lease creation against an application whose status is not ACCEPTED" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "lease creation against a unit that is not ASSIGNED to this application" }
  - { id: ERR_INSPECTION_NOT_ACKNOWLEDGED, http: 409, condition: "move-in attempted before the tenant acknowledged the move-in inspection and Bill of Rights" }
  - { id: ERR_LEASE_NOT_OCCUPIED, http: 409, condition: "an operation requiring an occupied or noticed lease was attempted on a lease in another occupancy_status" }
  - { id: ERR_HAZARD_NOT_ASSESSED, http: 409, condition: "lodging authorisation or clearance attempted on a hazard case still in REPORTED" }
  - { id: ERR_ALLOTMENT_NOT_ACTIVE, http: 409, condition: "a dispute credit greater than 0 was awarded against a lease whose allotment ledger is CLOSED" }
  - { id: ERR_REOPEN_LIMIT_REACHED, http: 409, condition: "reopen attempted after the caller's reopen budget is spent — a resident reopening an order already reopened once, or a manager reopening one already reopened twice" }
  - { id: ERR_HAZARD_HOLD_ACTIVE, http: 409, condition: "lease creation or move-in attempted on a unit in HAZARD_HOLD" }
  - { id: ERR_UNRESOLVED_CRITICAL_DEFICIENCY, http: 409, condition: "move-in attempted while the inspection's critical_open_count is greater than 0" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the same X-User-ID both assessed and cleared a hazard case, or both proposed and decided a dispute" }
  - { id: ERR_LEASE_UNIT_MISMATCH, http: 422, condition: "a supplied lease_id and housing_unit_id do not refer to the same current tenancy" }
  - { id: ERR_WORK_ORDER_UNIT_MISMATCH, http: 422, condition: "a referenced parent or source work order belongs to a different housing unit" }
  - { id: ERR_ORDERS_NOT_ON_FILE, http: 422, condition: "PCS or DEPLOYMENT termination claimed without the corresponding orders on the sponsor's record" }
  - { id: ERR_NOT_ELIGIBLE_FAMILY_HOUSING, http: 422, condition: "waitlist application from a sponsor with no full-time-custody dependents" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 422, condition: "the sponsor already has a PENDING, OFFERED or ACCEPTED application at this installation" }
  - { id: ERR_BEDROOM_MISMATCH, http: 422, condition: "the unit's bedroom_count does not equal the application's bedroom_eligibility" }
  - { id: ERR_RANK_CATEGORY_MISMATCH, http: 422, condition: "the unit's designated_rank_category does not equal the application's rank_category" }
  - { id: ERR_OCCUPANTS_EXCEED_AUTHORIZED, http: 422, condition: "lodging occupants_count exceeds 2 plus the sponsor's full-time-custody dependent count" }
  - { id: ERR_LODGING_INTERVAL_OVERLAP, http: 409, condition: "the requested half-open lodging interval overlaps an existing lodging interval on the same lease" }
  - { id: ERR_UNIT_TURN_BUFFER_VIOLATION, http: 409, condition: "the new lease start_date falls fewer than turn_buffer_days after the unit's last_lease_end_date" }
  - { id: ERR_NOTICE_PERIOD_TOO_SHORT, http: 422, condition: "termination_effective_date is closer to termination_notice_date than the reason's minimum notice period" }
  - { id: ERR_ESCALATION_NOT_DUE, http: 409, condition: "escalation attempted before the overdue hours reach the threshold for the priority class and target level" }
  - { id: ERR_PERIOD_ALREADY_POSTED, http: 409, condition: "a metrics run already exists for this account and period_month, or the period is in the future" }
  - { id: ERR_BAH_RATE_NOT_ON_FILE, http: 422, condition: "no BahRate row exists for the installation, pay grade, dependency status and effective year the active variant selects" }
  - { id: ERR_REINVESTMENT_BALANCE_INSUFFICIENT, http: 422, condition: "the requested expenditure exceeds the account's closing_balance_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Balfour Beatty corporate systems operator. Loads installations, BAH rate tables, unit inventory, sponsor records and fiscal-year reinvestment accounts, and holds the compensating void power over hazard cases."
    identity: "opaque"
    exclusive_operations:
      - "POST /installations"
      - "POST /bah-rates"
      - "POST /reinvestment-accounts"
    shared_operations:
      - "POST /housing-units and POST /housing-units/{id}/status (with PropertyManager)"
      - "POST /service-members, POST /service-members/{id}/orders, POST /dependents (with InstallationHousingOffice)"
      - "POST /waitlist-applications/{id}/recertify (with InstallationHousingOffice)"
      - "POST /hazard-cases/{id}/void (with InstallationHousingOffice)"
      - "POST /leases/{id}/rent-redetermination, POST /installations/{id}/allotment-run, POST /reinvestment-accounts/{id}/expenditures, POST /reinvestment-accounts/{id}/metrics-run (with PropertyManager)"
      - "all GET endpoints"

  - name: PropertyManager
    description: "On-site privatized housing project manager. Runs the offer and allotment cycles, writes leases, conducts move-in inspections, dispatches maintenance, authorises displacement lodging and proposes dispute resolutions."
    identity: "opaque"
    exclusive_operations:
      - "POST /leases"
      - "POST /leases/{id}/move-in"
      - "POST /leases/{id}/terminate"
      - "POST /move-in-inspections"
      - "POST /move-in-inspections/{id}/deficiencies"
      - "POST /work-orders/{id}/assign"
      - "POST /displacement-lodgings/{id}/close"
      - "POST /dispute-cases/{id}/propose-resolution"
    shared_operations:
      - "POST /installations/{id}/waitlist-offer-run (with InstallationHousingOffice)"
      - "POST /housing-units, POST /housing-units/{id}/status (with PlatformAdmin)"
      - "POST /work-orders (with ServiceMember, MaintenanceTech)"
      - "POST /work-orders/{id}/reopen (with ServiceMember)"
      - "POST /work-orders/{id}/escalate (with ServiceMember, InstallationHousingOffice)"
      - "POST /hazard-cases (with ServiceMember, EnvironmentalSpecialist)"
      - "POST /displacement-lodgings (with EnvironmentalSpecialist)"
      - "POST /leases/{id}/termination-notice (with ServiceMember, InstallationHousingOffice)"
      - "POST /leases/{id}/rent-redetermination, POST /installations/{id}/allotment-run, POST /reinvestment-accounts/{id}/expenditures, POST /reinvestment-accounts/{id}/metrics-run (with PlatformAdmin)"
      - "all GET endpoints"

  - name: ServiceMember
    description: "The sponsor (uniformed resident or applicant). Applies for housing, accepts or declines offers, signs the move-in inspection and Bill of Rights, submits and reopens work orders, reports hazards, gives termination notice and opens disputes."
    identity: "entity_backed:ServiceMember"
    exclusive_operations:
      - "POST /move-in-inspections/{id}/tenant-acknowledge"
      - "POST /dispute-cases"
      - "POST /dispute-cases/{id}/respond"
    shared_operations:
      - "POST /waitlist-applications, POST /waitlist-applications/{id}/accept-offer, POST /waitlist-applications/{id}/decline-offer (with InstallationHousingOffice)"
      - "POST /dependents (with PlatformAdmin, InstallationHousingOffice)"
      - "POST /work-orders (with PropertyManager, MaintenanceTech)"
      - "POST /work-orders/{id}/reopen (with PropertyManager)"
      - "POST /work-orders/{id}/escalate (with PropertyManager, InstallationHousingOffice)"
      - "POST /hazard-cases (with PropertyManager, EnvironmentalSpecialist)"
      - "POST /leases/{id}/termination-notice (with PropertyManager, InstallationHousingOffice)"
      - "GET endpoints for their own applications, leases, inspections, work orders, hazard cases, lodgings, disputes and allotment ledger, plus unit and installation reads"

  - name: MaintenanceTech
    description: "Assigned maintenance technician. Starts and completes work orders and may raise new ones discovered on site; never assigns, escalates, prices or leases."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/complete"
    shared_operations:
      - "POST /work-orders (with PropertyManager, ServiceMember)"
      - "GET /housing-units, GET /housing-units/{id}, GET /leases, GET /leases/{id}, GET /work-orders, GET /work-orders/{id}, GET /hazard-cases, GET /hazard-cases/{id}, GET /move-in-inspections/{id}, GET /installations/{id}"

  - name: EnvironmentalSpecialist
    description: "Certified mold and lead assessor. Grades hazard severity, certifies clearance and may authorise displacement lodging. Segregation of duties forbids the same specialist user from both assessing and clearing one case."
    identity: "opaque"
    exclusive_operations:
      - "POST /hazard-cases/{id}/assess"
      - "POST /hazard-cases/{id}/clearance"
    shared_operations:
      - "POST /hazard-cases (with PropertyManager, ServiceMember)"
      - "POST /displacement-lodgings (with PropertyManager)"
      - "GET /installations/{id}, GET /housing-units, GET /housing-units/{id}, GET /service-members/{id}, GET /leases, GET /leases/{id}, GET /work-orders, GET /work-orders/{id}, GET /hazard-cases, GET /hazard-cases/{id}, GET /displacement-lodgings, GET /displacement-lodgings/{id}"

  - name: InstallationHousingOffice
    description: "Government housing office at the installation. Maintains sponsor and orders records, recertifies waitlist applications, co-runs the offer cycle, escalates habitability failures and renders the binding decision on escalated resident disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /dispute-cases/{id}/installation-decision"
    shared_operations:
      - "POST /service-members, POST /service-members/{id}/orders, POST /dependents (with PlatformAdmin)"
      - "POST /waitlist-applications, POST /waitlist-applications/{id}/accept-offer, POST /waitlist-applications/{id}/decline-offer (with ServiceMember)"
      - "POST /waitlist-applications/{id}/recertify (with PlatformAdmin)"
      - "POST /installations/{id}/waitlist-offer-run (with PropertyManager)"
      - "POST /work-orders/{id}/escalate (with PropertyManager, ServiceMember)"
      - "POST /hazard-cases/{id}/void (with PlatformAdmin)"
      - "POST /leases/{id}/termination-notice (with PropertyManager, ServiceMember)"
      - "all GET endpoints"
