      - name: repeating_a_completed_step_yields_three_distinct_409_state_codes
        claim_type: error_triggerable
        grounds:
          - validations[priority=7]
          - errors[ERR_POSTING_INVALID_STATE]
          - errors[ERR_INSTRUMENT_INVALID_ACCOUNTING_STATE]
          - errors[ERR_EXCEPTION_INVALID_STATE]
        distinguishing_aspect: |
          Three different repeats produce three different codes, so a single generic
          conflict code would be wrong: posting collateral twice reports the posting's
          state, designating twice reports the instrument's accounting dimension (not
          its trade dimension, which is still legitimately EXECUTED), and denying an
          already APPROVED exception reports the exception's state while leaving
          decided_by_user_id at the original approver.
