      - name: notice_period_shortfall_is_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_NOTICE_PERIOD_TOO_SHORT
        excluded_because:
          difficulty_instance: notice_days_exactly_equal_to_required_is_accepted
          rationale: >-
            That boundary_precision_check instance probes required-1, required and required+1 on
            the same version, so the shortfall refusal and its exact boundary are already pinned.

      - name: sandbox_interval_overlap_is_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SANDBOX_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: sandbox_lease_adjacent_start_allowed_overlap_rejected
          rationale: >-
            That resource_temporal_overlap instance already contrasts the permitted adjacency
            with the refused one-second overlap on the same developer and product.

      - name: incident_inside_the_coalesce_buffer_is_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_INCIDENT_COALESCE_WINDOW
        excluded_because:
          difficulty_instance: incident_coalesce_buffer_sixty_minutes_after_resolution
          rationale: >-
            That resource_temporal_overlap instance probes 59, 60 and 61 minutes after the prior
            incident's resolved_at for the same product and severity.

      - name: ungrantable_version_lifecycle_is_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_VERSION_NOT_GRANTABLE
        excluded_because:
          difficulty_instance: application_submit_requires_grantable_version_lifecycle
          rationale: >-
            That cross_entity_state_dependency instance walks PREVIEW, GENERAL_AVAILABILITY,
            DEPRECATION_ANNOUNCED and SUNSET against each requested tier.

      - name: escalation_without_partner_entitlement_is_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ESCALATION_NOT_ENTITLED
        excluded_because:
          difficulty_instance: support_escalation_requires_partner_entitlement
          rationale: >-
            That cross_entity_state_dependency instance already escalates the same case before
            and after the reporting developer's PARTNER assignment is active.

      - name: revision_limit_and_appeal_limit_are_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REVISION_LIMIT_REACHED
          - errors.ERR_APPEAL_ALREADY_FILED
        excluded_because:
          difficulty_instance: access_application_revision_cycle_capped_at_three_rounds
          rationale: >-
            That non_linear_state_machine instance exhausts the three revision rounds and the
            single-appeal cap in its companion instance; both refusals are asserted there.

      - name: standing_and_terms_gates_are_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DEVELOPER_STANDING_BLOCKED
          - errors.ERR_TOS_VERSION_STALE
        excluded_because:
          difficulty_instance: assignment_activation_requires_developer_good_standing
          rationale: >-
            That cross_entity_state_dependency instance drives standing through RESTRICTED and
            back, and the stale-terms refusal is pinned by the priority-conflict instance that
            pairs it with a deprecated version.

      - name: assignment_not_active_is_refused
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ASSIGNMENT_NOT_ACTIVE
        excluded_because:
          difficulty_instance: suspend_reinstate_conserves_sustained_rpm_pool
          rationale: >-
            That compensating_invariant instance suspends an assignment and then attempts the
            usage-window and upgrade-request writes that priority 12 refuses.

  - section: rbac
