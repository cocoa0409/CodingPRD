scenario: |
  Agent Profit Share & Downline Attribution (Keller Williams): market center profit
  computation with agent commission caps that convert to full agent retention after a
  threshold, profit share distribution to agents who attributed the recruitment of
  other agents across multiple downline levels, sponsor attribution disputes and
  documentation at agent onboarding, market center-level accounting where profit
  share is funded from office profit not agent commissions, agent transfer between
  market centers with downline preservation, vesting rules for profit share
  continuation after an agent leaves, cap year timing and rollover for agents
  joining mid-year, associate leadership council governance over office finances

domain_name: agent-profit-share
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation        # provisional vs final profit / cap replay produce divergent numbers for identical data
  secondary_archetype: graph_constraint           # sponsor tree materialized as a 7-level downline closure
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid                          # market-center tree + cross-cutting sponsor graph closure
  state_machine_shape: branching                   # cycles (dispute appeal, resolution amend, cap revert) + fork/join (transfers, distributions)
  relationship_patterns:
    - one_to_many
    - self_referential                             # Agent.sponsor_agent_id -> Agent.id; SponsorshipEdge parent/child both -> Agent.id
    - cross_aggregate
  role_model: segregation_of_duties                # preliminary closer may not ratify final close
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: MarketCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market center display name" }
      - { name: region_code, type: string, source: input, description: "Region code (e.g. SW-TX)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; starts ACTIVE", constraints: "ACTIVE|SUSPENDED" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: market_center_id, type: string, source: system, description: "FK -> MarketCenter.id; home market center, rewritten on transfer completion" }
      - { name: sponsor_agent_id, type: string, source: input, description: "FK -> Agent.id; optional sponsoring agent (null for a center's first agent); re-pointed on dispute overturn", constraints: "nullable; must be an ACTIVE Agent in the same MarketCenter at enrollment" }
      - { name: full_name, type: string, source: input, description: "Agent full name" }
      - { name: email, type: string, source: input, description: "Agent email; unique across the system" }
      - { name: join_date, type: datetime, source: input, description: "Enrollment date; anchors cap year, dispute window, vesting clock" }
      - { name: membership_status, type: enum, source: system, description: "ENROLLED_PENDING_DOCS -> ACTIVE -> DEPARTED", constraints: "ENROLLED_PENDING_DOCS|ACTIVE|DEPARTED" }
      - { name: cap_status, type: enum, source: system, description: "UNCAPPED | CAPPED; independent state dimension from membership_status", constraints: "UNCAPPED|CAPPED" }
      - { name: cap_year_start, type: datetime, source: system, description: "Inclusive start of the current cap year; equals join_date at enrollment, advances at each anniversary rollover" }
      - { name: cap_year_end, type: datetime, source: system, description: "Exclusive end of the current cap year; cap_year_start + 1 year" }
      - { name: accrued_company_dollar, type: number, source: computed, description: "Company dollar accrued in the current cap year; reset to 0.00 on cap-year rollover" }
      - { name: pending_payable_profit_share, type: number, source: computed, description: "Sum of this agent's ProfitShareDistribution.amount with status PAYABLE" }
      - { name: lifetime_profit_share, type: number, source: computed, description: "Sum of this agent's ProfitShareDistribution.amount with status PAID" }
      - { name: departure_date, type: datetime, source: system, description: "Set by POST /agents/{id}/depart; null while membership_status != DEPARTED", default: null }
      - { name: vested, type: boolean, source: computed, description: "True iff the linked VestingSchedule.status == VESTED" }

  - name: SponsorshipEdge
    parent: null
    common_fields: true
    fields:
      - { name: parent_agent_id, type: string, source: system, description: "FK -> Agent.id; the upline (sponsor-side) agent" }
      - { name: child_agent_id, type: string, source: system, description: "FK -> Agent.id; the downline (sponsored-side) agent" }
      - { name: depth_level, type: integer, source: computed, description: "Tree distance parent->child, 1..7; closure is capped at 7 levels" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; SUPERSEDED when a dispute overturn re-points the subtree", constraints: "ACTIVE|SUPERSEDED" }

  - name: OnboardingDocument
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; agent this document belongs to" }
      - { name: document_type, type: enum, source: input, description: "SPONSOR_ATTESTATION | ICA_SIGNED | W9", constraints: "SPONSOR_ATTESTATION|ICA_SIGNED|W9" }
      - { name: document_ref, type: string, source: input, description: "Opaque document reference (storage key)" }
      - { name: attested_sponsor_agent_id, type: string, source: input, description: "Agent id named as sponsor on a SPONSOR_ATTESTATION; required iff document_type == SPONSOR_ATTESTATION; MAY differ from Agent.sponsor_agent_id (that mismatch is what a dispute litigates)", default: null }
      - { name: received_at, type: datetime, source: system, description: "Server receipt timestamp (logical clock)" }

  - name: SponsorshipDispute
    parent: null
    common_fields: true
    fields:
      - { name: filer_agent_id, type: string, source: system, description: "FK -> Agent.id; taken from X-User-ID of the filing Agent" }
      - { name: sponsored_agent_id, type: string, source: input, description: "FK -> Agent.id; agent whose sponsor attribution is disputed" }
      - { name: current_sponsor_agent_id, type: string, source: computed, description: "Snapshot of sponsored_agent.sponsor_agent_id at filing time" }
      - { name: evidence_document_id, type: string, source: input, description: "FK -> OnboardingDocument.id; must be a SPONSOR_ATTESTATION on the sponsored agent attesting the filer" }
      - { name: reason, type: string, source: input, description: "Free-text dispute rationale" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing" }
      - { name: window_deadline, type: datetime, source: computed, description: "sponsored_agent.join_date + 90 days; filing is accepted iff filed_at <= window_deadline (inclusive)" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> RESOLVED_UPHELD | RESOLVED_OVERTURNED | DISMISSED; RESOLVED_* -> REOPENED -> UNDER_REVIEW", constraints: "FILED|UNDER_REVIEW|RESOLVED_UPHELD|RESOLVED_OVERTURNED|DISMISSED|REOPENED" }
      - { name: resolution, type: enum, source: system, description: "UPHELD | OVERTURNED | DISMISSED; set by resolve", default: null, constraints: "UPHELD|OVERTURNED|DISMISSED" }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed; max 1", default: 0 }

  - name: CommissionEvent
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; producing agent" }
      - { name: market_center_id, type: string, source: computed, description: "FK -> MarketCenter.id; snapshot of the agent's home center at posting" }
      - { name: gross_commission, type: number, source: input, description: "Gross commission income, dollars; must be > 0" }
      - { name: occurred_on, type: datetime, source: input, description: "Business date of the commission; drives cap-year selection and period attribution (calendar month)" }
      - { name: external_ref, type: string, source: input, description: "External ledger reference; unique per market center" }
      - { name: status, type: enum, source: system, description: "POSTED -> SETTLED | VOID", constraints: "POSTED|SETTLED|VOID" }
      - { name: company_dollar, type: number, source: computed, description: "Provisional company-dollar split computed at posting (includes POSTED accruals)" }
      - { name: agent_retained, type: number, source: computed, description: "gross_commission - company_dollar at posting" }
      - { name: final_company_dollar, type: number, source: computed, description: "Final company dollar from the chronological SETTLED-only replay at period final close; null until then", default: null }
      - { name: cap_applied, type: boolean, source: computed, description: "True when the cap bound (not the rate) determined company_dollar" }

  - name: ProfitSharePeriod
    parent: null
    common_fields: true
    fields:
      - { name: market_center_id, type: string, source: system, description: "FK -> MarketCenter.id" }
      - { name: period_month, type: string, source: input, description: "Calendar month 'YYYY-MM'; unique per market center", constraints: "format YYYY-MM; unique per market_center_id" }
      - { name: status, type: enum, source: system, description: "OPEN -> PRELIMINARY_CLOSED -> FINAL_CLOSE_PENDING -> FINAL_CLOSED; FINAL_CLOSE_PENDING -> PRELIMINARY_CLOSED on resolution rejection", constraints: "OPEN|PRELIMINARY_CLOSED|FINAL_CLOSE_PENDING|FINAL_CLOSED" }
      - { name: provisional_profit, type: number, source: computed, description: "Forward-looking profit: company dollar from POSTED+SETTLED events in the month minus expenses plus adjustments" }
      - { name: final_profit, type: number, source: computed, description: "Chronological profit: SETTLED-only replayed company dollar minus expenses plus adjustments; null until final close", default: null }
      - { name: provisional_pool, type: number, source: computed, description: "round2(0.52 * provisional_profit) at preliminary close" }
      - { name: profit_share_pool, type: number, source: computed, description: "round2(0.52 * final_profit) at final close", default: null }
      - { name: distributed_total, type: number, source: computed, description: "Sum of this period's distribution amounts with status PROJECTION or PAYABLE; recomputed on every distribution create/transition (uses provisional_pool basis before final close, profit_share_pool after)" }
      - { name: center_retained_amount, type: number, source: computed, description: "Current pool minus distributed_total (provisional_pool before final close, profit_share_pool after); invariant: distributed_total + center_retained_amount == current pool" }
      - { name: preliminary_closed_by, type: string, source: system, description: "X-User-ID of the MarketCenterAdmin who ran preliminary close; segregation-of-duties key" }

  - name: ProfitShareLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> ProfitSharePeriod.id" }
      - { name: entry_type, type: enum, source: input, description: "EXPENSE (amount debited from profit) | ADJUSTMENT (signed)", constraints: "EXPENSE|ADJUSTMENT" }
      - { name: amount, type: number, source: input, description: "Dollar amount; EXPENSE must be > 0; ADJUSTMENT may be negative" }
      - { name: memo, type: string, source: input, description: "Optional memo", default: null }

  - name: ProfitShareDistribution
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> ProfitSharePeriod.id" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; recipient" }
      - { name: basis, type: enum, source: system, description: "PROVISIONAL (preliminary close) | FINAL (final close)", constraints: "PROVISIONAL|FINAL" }
      - { name: amount, type: number, source: computed, description: "Sum of the recipient's scaled allocation lines, remainder-adjusted" }
      - { name: level_breakdown, type: array, source: computed, description: "Per-line entries { source_agent_id, depth_level, entitlement, scaled_amount }" }
      - { name: status, type: enum, source: system, description: "PROJECTION -> PAYABLE -> PAID; PROJECTION -> CLAWED_BACK (dispute overturn); PROJECTION|PAYABLE -> FORFEITED (departed unvested)", constraints: "PROJECTION|PAYABLE|PAID|CLAWED_BACK|FORFEITED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; transferring agent (X-User-ID at request)" }
      - { name: from_market_center_id, type: string, source: computed, description: "FK -> MarketCenter.id; snapshot of agent's center at request" }
      - { name: to_market_center_id, type: string, source: input, description: "FK -> MarketCenter.id; destination center" }
      - { name: effective_date, type: datetime, source: input, description: "Date the transfer takes effect; must not fall inside a source-center period whose status is PRELIMINARY_CLOSED, FINAL_CLOSE_PENDING, or FINAL_CLOSED" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED -> COMPLETED; REQUESTED -> REJECTED; REQUESTED|APPROVED -> CANCELLED", constraints: "REQUESTED|APPROVED|REJECTED|CANCELLED|COMPLETED" }
      - { name: downline_preserved, type: boolean, source: system, description: "Always true: sponsorship closure edges follow the transferring agent unchanged", default: true }

  - name: VestingSchedule
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; 1:1, created at enrollment" }
      - { name: vesting_start_date, type: datetime, source: system, description: "Equals agent.join_date" }
      - { name: service_months_provisional, type: integer, source: computed, description: "Whole calendar months between join_date and departure_date (provisional variant)" }
      - { name: service_days_final, type: integer, source: computed, description: "Exact days between join_date and departure_date (final variant)" }
      - { name: vested_ratio_provisional, type: number, source: computed, description: "min(1, service_months_provisional / 36), 4 decimal places round_half_up" }
      - { name: vested_ratio_final, type: number, source: computed, description: "min(1, service_days_final / 1095), 4 decimal places round_half_up" }
      - { name: status, type: enum, source: system, description: "ACCRUING -> VESTED | FORFEITED at departure; VESTED iff service_days_final >= 1095", constraints: "ACCRUING|VESTED|FORFEITED" }

  - name: GovernanceResolution
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> ProfitSharePeriod.id" }
      - { name: resolution_type, type: enum, source: input, description: "FINAL_CLOSE_RATIFICATION", constraints: "FINAL_CLOSE_RATIFICATION" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> RATIFIED | REJECTED; REJECTED -> DRAFT via amend", constraints: "DRAFT|PROPOSED|RATIFIED|REJECTED" }
      - { name: notes, type: string, source: input, description: "Optional notes supplied at amend", default: null }
      - { name: proposed_by, type: string, source: system, description: "X-User-ID of the proposer" }
      - { name: ratified_by, type: string, source: system, description: "X-User-ID of the ALC chair who ratified; must differ from period.preliminary_closed_by", default: null }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Agent
    initial_state: "membership_status=ENROLLED_PENDING_DOCS, cap_status=UNCAPPED"
    terminal_states: ["membership_status=DEPARTED"]
    note: "Two independent state dimensions evolve on the same Agent row: membership_status (document-gated lifecycle) and cap_status (threshold-driven, reversible). A transition on one dimension never changes the other."
    transitions:
      - from: "membership_status=ENROLLED_PENDING_DOCS"
        to: "membership_status=ACTIVE"
        trigger: "POST /agents/{id}/onboarding-documents (automatic, on receipt of the complete document set)"
        actor: system
        preconditions:
          - "ICA_SIGNED and W9 documents present"
          - "If Agent.sponsor_agent_id is not null: a SPONSOR_ATTESTATION document is also present"
        side_effects:
          - "Agent.version incremented"
      - from: "membership_status=ACTIVE"
        to: "membership_status=DEPARTED"
        trigger: "POST /agents/{id}/depart"
        actor: MarketCenterAdmin
        preconditions:
          - "No TransferRequest for this agent in status REQUESTED or APPROVED (ERR_TRANSFER_IN_PROGRESS)"
        side_effects:
          - "VestingSchedule evaluated: service_days_final = days(join_date, departure_date); status -> VESTED iff service_days_final >= 1095 else FORFEITED; both ratio variants computed"
          - "If VestingSchedule.status == FORFEITED: this agent's ProfitShareDistributions with status PROJECTION or PAYABLE -> FORFEITED; each such transition recomputes the owning ProfitSharePeriod.distributed_total"
          - "If VestingSchedule.status == FORFEITED: this agent is excluded from future distribution entitlement sets (edges remain for historical attribution)"
          - "Agent.version incremented"
      - from: "cap_status=UNCAPPED"
        to: "cap_status=CAPPED"
        trigger: "POST /commission-events (automatic, when accrued_company_dollar after split >= 20000.00)"
        actor: system
        preconditions: []
        side_effects:
          - "Subsequent commission splits yield company_dollar 0.00 until rollover"
      - from: "cap_status=CAPPED"
        to: "cap_status=UNCAPPED"
        trigger: "POST /commission-events/{id}/void (automatic, when voiding drops accrued_company_dollar strictly below 20000.00), or POST /commission-events (automatic cap-year rollover when occurred_on >= cap_year_end resets accrued_company_dollar to 0.00)"
        actor: system
        preconditions: []
        side_effects:
          - "On rollover: cap_year_start advances by whole years until occurred_on < cap_year_end; accrued_company_dollar = 0.00 before the new split is applied"

  - entity: CommissionEvent
    initial_state: POSTED
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: POSTED
        to: SETTLED
        trigger: "POST /commission-events/{id}/settle"
        actor: MarketCenterAdmin
        preconditions: []
        side_effects:
          - "Event becomes eligible for the final chronological replay and FINAL profit basis"
      - from: POSTED
        to: VOID
        trigger: "POST /commission-events/{id}/void"
        actor: MarketCenterAdmin
        preconditions:
          - "No ProfitSharePeriod covering occurred_on's month for the event's market_center_id has status FINAL_CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "Agent.accrued_company_dollar -= event.company_dollar; if result < 20000.00 and cap_status == CAPPED then cap_status -> UNCAPPED"
          - "OPEN/PRELIMINARY_CLOSED periods for the month recompute provisional_profit"
          - "Agent.version incremented"

  - entity: SponsorshipDispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /sponsorship-disputes/{id}/open-review"
        actor: RegionalDirector
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /sponsorship-disputes/{id}/resolve with outcome UPHELD"
        actor: RegionalDirector
        preconditions: []
        side_effects: ["Recorded sponsor stands; no tree mutation"]
      - from: UNDER_REVIEW
        to: RESOLVED_OVERTURNED
        trigger: "POST /sponsorship-disputes/{id}/resolve with outcome OVERTURNED"
        actor: RegionalDirector
        preconditions: []
        side_effects:
          - "Sponsored Agent.sponsor_agent_id re-pointed to filer_agent_id; Agent.version incremented"
          - "All ACTIVE SponsorshipEdge rows with child in the re-pointed subtree -> SUPERSEDED; replacement closure edges (depth_level <= 7) created along the new sponsor chain"
          - "ProfitShareDistributions with basis PROVISIONAL and status PROJECTION whose level_breakdown references a SUPERSEDED edge -> CLAWED_BACK; replacement PROJECTION distributions regenerated from the new closure; owning period's distributed totals recomputed"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /sponsorship-disputes/{id}/resolve with outcome DISMISSED"
        actor: RegionalDirector
        preconditions: []
        side_effects: []
      - from: RESOLVED_UPHELD
        to: REOPENED
        trigger: "POST /sponsorship-disputes/{id}/appeal"
        actor: Agent
        preconditions:
          - "X-User-ID == filer_agent_id (ERR_FORBIDDEN otherwise)"
          - "appeal_count < 1 (ERR_APPEAL_EXHAUSTED otherwise)"
        side_effects: ["appeal_count += 1"]
      - from: RESOLVED_OVERTURNED
        to: REOPENED
        trigger: "POST /sponsorship-disputes/{id}/appeal"
        actor: Agent
        preconditions:
          - "X-User-ID == filer_agent_id (ERR_FORBIDDEN otherwise)"
          - "appeal_count < 1 (ERR_APPEAL_EXHAUSTED otherwise)"
        side_effects: ["appeal_count += 1"]
      - from: REOPENED
        to: UNDER_REVIEW
        trigger: "POST /sponsorship-disputes/{id}/open-review"
        actor: RegionalDirector
        preconditions: []
        side_effects: []

  - entity: ProfitSharePeriod
    initial_state: OPEN
    terminal_states: [FINAL_CLOSED]
    transitions:
      - from: OPEN
        to: PRELIMINARY_CLOSED
        trigger: "POST /profit-share-periods/{id}/preliminary-close"
        actor: MarketCenterAdmin
        preconditions:
          - "provisional_profit > 0 (ERR_PROFIT_NOT_POSITIVE)"
          - "Acting X-User-ID is an Agent with membership_status ACTIVE enrolled in this period's market center (ERR_MCA_NOT_CENTER_AGENT)"
        side_effects:
          - "provisional_profit and provisional_pool computed (forward-looking: POSTED + SETTLED events in the month)"
          - "PROJECTION distributions (basis PROVISIONAL) created per profit_share_distribution with scaling and remainder adjustment against provisional_pool"
          - "preliminary_closed_by set to X-User-ID"
      - from: PRELIMINARY_CLOSED
        to: FINAL_CLOSE_PENDING
        trigger: "POST /governance-resolutions/{id}/propose for this period's resolution"
        actor: MarketCenterAdmin
        preconditions:
          - "A GovernanceResolution for this period exists with status DRAFT"
        side_effects: []
      - from: FINAL_CLOSE_PENDING
        to: FINAL_CLOSED
        trigger: "POST /governance-resolutions/{id}/ratify"
        actor: ALCChair
        preconditions:
          - "GovernanceResolution status == PROPOSED"
          - "X-User-ID (ALC chair agent id) != period.preliminary_closed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "final_profit computed by chronological replay of SETTLED events only (occurred_on ASC, tie-break CommissionEvent.created_at ASC); CommissionEvent.final_company_dollar populated per event"
          - "profit_share_pool = round2(0.52 * final_profit); ERR_PROFIT_NOT_POSITIVE if final_profit <= 0"
          - "Cascade: each PROJECTION distribution of this period -> PAYABLE with FINAL recomputation -> each recipient Agent.pending_payable_profit_share recomputed -> each linked VestingSchedule of DEPARTED recipients re-evaluated (continuation eligibility); Agent.version incremented per touched agent"
          - "distributed_total and center_retained_amount recomputed against profit_share_pool; invariant distributed_total + center_retained_amount == profit_share_pool"
      - from: FINAL_CLOSE_PENDING
        to: PRELIMINARY_CLOSED
        trigger: "POST /governance-resolutions/{id}/reject"
        actor: ALCChair
        preconditions:
          - "GovernanceResolution status == PROPOSED"
        side_effects: ["Resolution -> REJECTED; period reopens for re-proposal"]

  - entity: GovernanceResolution
    initial_state: DRAFT
    terminal_states: [RATIFIED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /governance-resolutions/{id}/propose"
        actor: MarketCenterAdmin
        preconditions:
          - "Owning period status == PRELIMINARY_CLOSED (ERR_INVALID_STATE otherwise)"
        side_effects: ["Owning period -> FINAL_CLOSE_PENDING"]
      - from: PROPOSED
        to: RATIFIED
        trigger: "POST /governance-resolutions/{id}/ratify"
        actor: ALCChair
        preconditions:
          - "X-User-ID != owning period.preliminary_closed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["Owning period -> FINAL_CLOSED (full cascade per ProfitSharePeriod.FINAL_CLOSE_PENDING->FINAL_CLOSED)"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /governance-resolutions/{id}/reject"
        actor: ALCChair
        preconditions: []
        side_effects: ["Owning period FINAL_CLOSE_PENDING -> PRELIMINARY_CLOSED"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /governance-resolutions/{id}/amend"
        actor: MarketCenterAdmin
        preconditions: []
        side_effects: []

  - entity: ProfitShareDistribution
    initial_state: PROJECTION
    terminal_states: [PAID, CLAWED_BACK, FORFEITED]
    transitions:
      - from: PROJECTION
        to: PAYABLE
        trigger: "Period final close cascade (governance ratification)"
        actor: system
        preconditions: []
        side_effects:
          - "amount recomputed under FINAL basis; level_breakdown rewritten"
          - "Recipient Agent.pending_payable_profit_share recomputed; Agent.version incremented"
      - from: PAYABLE
        to: PAID
        trigger: "POST /profit-share-distributions/{id}/mark-paid"
        actor: MarketCenterAdmin
        preconditions: []
        side_effects:
          - "Agent.lifetime_profit_share += amount; Agent.pending_payable_profit_share -= amount; Agent.version incremented"
      - from: PROJECTION
        to: CLAWED_BACK
        trigger: "SponsorshipDispute resolve OVERTURNED cascade"
        actor: system
        preconditions: []
        side_effects: ["Replacement PROJECTION distribution regenerated from the new sponsorship closure"]
      - from: PROJECTION
        to: FORFEITED
        trigger: "POST /agents/{id}/depart when the recipient's VestingSchedule evaluates FORFEITED"
        actor: system
        preconditions: []
        side_effects: ["Owning period.distributed_total recomputed"]
      - from: PAYABLE
        to: FORFEITED
        trigger: "POST /agents/{id}/depart when the recipient's VestingSchedule evaluates FORFEITED"
        actor: system
        preconditions: []
        side_effects: ["Owning period.distributed_total recomputed; recipient Agent.pending_payable_profit_share recomputed"]

  - entity: TransferRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /transfer-requests/{id}/approve"
        actor: MarketCenterAdmin
        preconditions:
          - "Destination MarketCenter.status == ACTIVE (ERR_CENTER_NOT_ACTIVE)"
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: MarketCenterAdmin
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /transfer-requests/{id}/cancel"
        actor: Agent
        preconditions: ["X-User-ID == agent_id (ERR_FORBIDDEN otherwise)"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /transfer-requests/{id}/cancel"
        actor: Agent
        preconditions: ["X-User-ID == agent_id (ERR_FORBIDDEN otherwise)"]
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /transfer-requests/{id}/complete"
        actor: MarketCenterAdmin
        preconditions:
          - "Both from_market_center_id and to_market_center_id have status ACTIVE (ERR_CENTER_NOT_ACTIVE)"
          - "Logical clock >= effective_date (ERR_TRANSFER_NOT_EFFECTIVE)"
        side_effects:
          - "Agent.market_center_id := to_market_center_id; membership_status unchanged (ACTIVE stays ACTIVE)"
          - "SponsorshipEdge closure preserved verbatim (downline follows the transferring agent; downline_preserved == true)"
          - "Cap year preserved: cap_year_start, cap_year_end, accrued_company_dollar and cap_status carry over unchanged (no reset on transfer)"
          - "Agent.version incremented"

  - entity: VestingSchedule
    initial_state: ACCRUING
    terminal_states: [VESTED, FORFEITED]
    transitions:
      - from: ACCRUING
        to: VESTED
        trigger: "POST /agents/{id}/depart when service_days_final >= 1095"
        actor: system
        preconditions: []
        side_effects: ["Agent.vested := true; agent remains eligible for profit share continuation on periods after departure"]
      - from: ACCRUING
        to: FORFEITED
        trigger: "POST /agents/{id}/depart when service_days_final < 1095"
        actor: system
        preconditions: []
        side_effects: ["Agent.vested := false; outstanding PROJECTION/PAYABLE distributions -> FORFEITED"]

  - entity: MarketCenter
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /market-centers/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["New agent enrollment, period creation, and transfer approvals blocked while SUSPENDED (ERR_CENTER_NOT_ACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /market-centers/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: commission-post-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /commission-events"
    occ_field: "expected_agent_version"
    description: |
      Posting a CommissionEvent against an Agent whose version has advanced
      since the client last observed it is rejected. A second sequential posting
      carrying the previously observed version observes unchanged business state
      (commission posting is always legitimate for an ACTIVE agent), so the
      stale-version check is the only rejection path.
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412
  - rule_id: transfer-request-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /agents/{id}/transfer-requests"
    occ_field: "expected_agent_version"
    description: |
      Creating a TransferRequest against an Agent whose version has advanced
      since the client last observed it is rejected. A second sequential request
      carrying the previously observed version would otherwise legitimately
      succeed, so the stale-version check is the only rejection path.
    error_id: ERR_STALE_AGENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: agent_cap_split
    trigger: "POST /commission-events (provisional, at posting)"
    algorithm: threshold
    formula: |
      # Inputs: gross_commission, accrued_company_dollar (after any rollover), cap_status.
      # Conditional branch: if occurred_on >= cap_year_end, roll the cap year first
      # (advance cap_year_start/cap_year_end by whole years until occurred_on < cap_year_end,
      #  reset accrued_company_dollar to 0.00, cap_status -> UNCAPPED).
      effective_cap = 20000.00
      raw_company = round2(gross_commission * 0.30)
      remaining = max(0.00, effective_cap - accrued_company_dollar)
      company_dollar = min(raw_company, remaining)
      agent_retained = round2(gross_commission - company_dollar)
      cap_applied = (raw_company > remaining)
      accrued_after = round2(accrued_company_dollar + company_dollar)
      if accrued_after >= 20000.00: cap_status -> CAPPED   # boundary is inclusive (>=)
    input_set: "The single CommissionEvent being posted and its Agent's current accrual state"
    constants:
      COMPANY_DOLLAR_RATE: 0.30
      ANNUAL_CAP: 20000.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "At posting time; accrual includes this and prior POSTED+SETTLED events of the cap year"
        difference: "company_dollar reflects the forward-looking accrual including unsettled events"
      - name: FINAL
        when: "At period final close; chronological replay over SETTLED events only (see final_cap_replay)"
        difference: "final_company_dollar may differ from company_dollar when some events never settle; replay is per-agent across the whole cap year, not per period"

  - name: final_cap_replay
    trigger: "ProfitSharePeriod FINAL_CLOSE_PENDING -> FINAL_CLOSED (per affected agent, for every period of the cap year being closed)"
    algorithm: chronological
    formula: |
      # Per agent: replay SETTLED events of the cap year to produce final_company_dollar.
      # Evaluation order is pinned (this is the circular-looking dependency made explicit):
      #   (1) sort events occurred_on ASC, tie-break CommissionEvent.created_at ASC;
      #   (2) reset a replay accrual to 0.00 at each cap-year anniversary crossed during replay;
      #   (3) per event: final_company_dollar = min(round2(gross*0.30), max(0, 20000 - replay_accrued));
      #   (4) replay_accrued += final_company_dollar.
      # The order matters: which of two same-day events absorbs the last capped dollar is
      # decided by created_at ASC, never by id and never by gross size.
    input_set: "CommissionEvents with status SETTLED belonging to the agent within the cap year covering the closing period's month"
    constants:
      COMPANY_DOLLAR_RATE: 0.30
      ANNUAL_CAP: 20000.00
    precision: "2 decimal places, round_half_up"

  - name: market_center_profit
    trigger: "POST /profit-share-periods/{id}/preliminary-close (PROVISIONAL) and governance ratification (FINAL)"
    algorithm: aggregation
    formula: |
      # expenses = sum of ProfitShareLedgerEntry.amount where entry_type == EXPENSE
      # adjustments = sum of ProfitShareLedgerEntry.amount where entry_type == ADJUSTMENT (signed)
      # PROVISIONAL: company_total = sum(company_dollar) over events of this center with
      #   occurred_on in period_month and status IN {POSTED, SETTLED}
      # FINAL: company_total = sum(final_company_dollar) over events with status == SETTLED
      #   and occurred_on in period_month (values from final_cap_replay)
      # profit = round2(company_total - expenses + adjustments)
      # pool = round2(0.52 * profit)
    input_set: "Ledger entries of the period; CommissionEvents of the period's market center whose occurred_on falls in period_month, filtered by status per variant"
    constants:
      PROFIT_SHARE_POOL_RATE: 0.52
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Preliminary close"
        difference: "Includes POSTED (unsettled) events via their provisional company_dollar; an event that never settles inflates provisional_profit relative to final_profit"
      - name: FINAL
        when: "Final close (ratification)"
        difference: "SETTLED only, replayed company dollar; diverges from PROVISIONAL whenever any POSTED event exists or a replay split differs"

  - name: profit_share_distribution
    trigger: "Preliminary close (basis PROVISIONAL against provisional_pool) and final close (basis FINAL against profit_share_pool)"
    algorithm: waterfall_allocation
    formula: |
      # Per recipient agent R with ACTIVE downline SponsorshipEdges (status ACTIVE):
      #   entitlement_line = round2(LEVEL_RATES[depth_level] * attributable(child))
      #   where attributable(child) = child's company dollar for the period
      #   (provisional company_dollar for PROVISIONAL basis; final_company_dollar for FINAL basis),
      #   excluding children whose VestingSchedule.status == FORFEITED.
      # Rounding order is pinned: round each entitlement LINE first (2dp half-up), THEN sum.
      #   (sum-then-round is prohibited; it produces different cents.)
      # gross_total = sum of all entitlement lines across all recipients.
      # If gross_total > pool: scale each line by (pool / gross_total), round each scaled line
      #   2dp half-up, then remainder-adjust: delta = round2(pool - sum(scaled lines));
      #   apply delta to the single line with the largest pre-rounding fractional part;
      #   tie-break: lower depth_level first, then recipient Agent.created_at ASC, then
      #   source child Agent.created_at ASC.
      # If gross_total <= pool: no scaling; center_retained_amount = round2(pool - gross_total).
      # Lines with entitlement 0.00 are omitted; a recipient with no positive lines gets
      #   no ProfitShareDistribution row at all.
      # Agent distribution amount = sum of that agent's scaled lines.
      # Conservation: sum(distribution amounts) + center_retained_amount == profit_share_pool.
    input_set: "Agents of the period's market center (plus, for FINAL basis, DEPARTED agents whose VestingSchedule.status == VESTED); ACTIVE SponsorshipEdge closure rows; per-child attributable company dollar for the period"
    constants:
      LEVEL_RATES: { "1": 0.50, "2": 0.10, "3": 0.05, "4": 0.05, "5": 0.075, "6": 0.10, "7": 0.125 }
    precision: "2 decimal places, round_half_up; scale factor carried at full precision until per-line rounding"

  - name: downline_attribution_closure
    trigger: "Agent enrollment with a sponsor; SponsorshipDispute resolve OVERTURNED"
    algorithm: topological
    formula: |
      # Walk the sponsor chain upward from the new sponsor: level 1 = direct sponsor,
      # level 2 = sponsor's sponsor, ... stop at depth_level 7 or when an ancestor has
      # sponsor_agent_id null. Create one SponsorshipEdge(parent=ancestor, child, depth_level)
      # per ancestor reached. Cycle guard: if the new sponsor chain already contains the
      # child agent's id, reject with ERR_SPONSOR_CYCLE.
      # On dispute overturn: SUPERSEDE every ACTIVE edge whose child is in the re-pointed
      # subtree (child == sponsored agent or any descendant via ACTIVE edges), then rebuild
      # the closure for the subtree root along the new sponsor chain and re-derive descendants'
      # edges whose paths crossed the root.
    input_set: "Agent sponsor chain (self-referential Agent.sponsor_agent_id); existing ACTIVE SponsorshipEdge rows"
    constants:
      MAX_DEPTH: 7
    precision: "integer depths"

  - name: vesting_ratio
    trigger: "POST /agents/{id}/depart"
    algorithm: threshold
    formula: |
      # Provisional variant: whole calendar months between join_date and departure_date.
      #   service_months_provisional = (dep_y*12+dep_m) - (join_y*12+join_m) - (1 if dep_day < join_day else 0)
      #   vested_ratio_provisional = min(1, service_months_provisional / 36), 4dp half-up
      # Final variant: exact day arithmetic.
      #   service_days_final = days(join_date, departure_date)
      #   vested_ratio_final = min(1, service_days_final / 1095), 4dp half-up
      #   VESTED iff service_days_final >= 1095   (boundary is inclusive)
    input_set: "Agent.join_date and the departure_date supplied at departure"
    constants:
      VESTING_DAYS: 1095
      VESTING_MONTHS: 36
    precision: "ratios at 4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Reporting/projection surfaces"
        difference: "Whole-month granularity; an agent departing on the day before their join-day anniversary in month 36 scores 35/36 = 0.9722"
      - name: FINAL
        when: "Departure adjudication (status VESTED/FORFEITED)"
        difference: "Exact-day granularity; the same departure can score 1095/1095 = 1.0000 and VEST"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except none (every endpoint requires both headers)" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path parameters resolve to existing resources, validated left-to-right", error_id: ERR_AGENT_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids (per-resource error ids: ERR_MARKET_CENTER_NOT_FOUND, ERR_AGENT_NOT_FOUND, ERR_PERIOD_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_COMMISSION_EVENT_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_RESOLUTION_NOT_FOUND, ERR_DISTRIBUTION_NOT_FOUND)" }
  - { priority: 4, category: existence, check: "Body-referenced ids exist (agent_id, sponsor_agent_id, to_market_center_id, evidence_document_id, sponsored_agent_id)", error_id: ERR_AGENT_NOT_FOUND, http_status: 404, applies_to: "POST endpoints with body FKs (per-resource error ids as in priority 3)" }
  - { priority: 5, category: business_constraint, check: "Required input fields present and well-formed (period_month matches YYYY-MM; enums valid; document_type in set)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 6, category: state, check: "Target resource in a valid source state for the requested transition (includes: agent membership ACTIVE for commission posting; period OPEN for ledger entries and preliminary close; distribution PAYABLE for mark-paid; dispute FILED/REOPENED for open-review, UNDER_REVIEW for resolve; resolution DRAFT for propose, PROPOSED for ratify/reject, REJECTED for amend; transfer REQUESTED for approve/reject, REQUESTED|APPROVED for cancel, APPROVED for complete; event POSTED for settle/void)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_temporal, check: "Dispute filed_at <= sponsored_agent.join_date + 90 days (inclusive)", error_id: ERR_DISPUTE_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /sponsorship-disputes" }
  - { priority: 8, category: business_temporal, check: "TransferRequest.effective_date must not fall inside any source-center ProfitSharePeriod (month containment) whose status is PRELIMINARY_CLOSED, FINAL_CLOSE_PENDING, or FINAL_CLOSED", error_id: ERR_TRANSFER_WINDOW_CONFLICT, http_status: 422, applies_to: "POST /agents/{id}/transfer-requests" }
  - { priority: 9, category: business_temporal, check: "CommissionEvent.occurred_on >= agent.cap_year_start (backdated postings into closed cap years rejected; postings at/after cap_year_end trigger rollover, not rejection)", error_id: ERR_BACKDATED_COMMISSION, http_status: 422, applies_to: "POST /commission-events" }
  - { priority: 10, category: business_temporal, check: "Transfer completion requires logical clock >= effective_date", error_id: ERR_TRANSFER_NOT_EFFECTIVE, http_status: 422, applies_to: "POST /transfer-requests/{id}/complete" }
  - { priority: 11, category: business_referential, check: "sponsor_agent_id references an ACTIVE agent enrolled in the same market center as the enrollee", error_id: ERR_SPONSOR_CROSS_CENTER, http_status: 422, applies_to: "POST /market-centers/{id}/agents" }
  - { priority: 12, category: business_referential, check: "Dispute evidence_document_id is a SPONSOR_ATTESTATION document belonging to the sponsored agent whose attested_sponsor_agent_id equals the filer", error_id: ERR_EVIDENCE_INVALID, http_status: 422, applies_to: "POST /sponsorship-disputes" }
  - { priority: 13, category: business_referential, check: "Dispute filer and sponsored agent are enrolled in the same market center", error_id: ERR_SPONSOR_CROSS_CENTER, http_status: 422, applies_to: "POST /sponsorship-disputes" }
  - { priority: 14, category: business_referential, check: "Preliminary close actor (X-User-ID) is an Agent with membership_status ACTIVE in the period's market center", error_id: ERR_MCA_NOT_CENTER_AGENT, http_status: 422, applies_to: "POST /profit-share-periods/{id}/preliminary-close" }
  - { priority: 15, category: business_constraint, check: "No self-sponsorship and no sponsor cycle (new sponsor chain must not contain the child)", error_id: ERR_SPONSOR_CYCLE, http_status: 422, applies_to: "POST /market-centers/{id}/agents, dispute overturn side effects" }
  - { priority: 16, category: business_constraint, check: "period_month unique per market center", error_id: ERR_PERIOD_MONTH_CONFLICT, http_status: 409, applies_to: "POST /market-centers/{id}/profit-share-periods" }
  - { priority: 17, category: business_constraint, check: "Destination center differs from current center; destination exists and is ACTIVE", error_id: ERR_TRANSFER_SELF_CENTER, http_status: 422, applies_to: "POST /agents/{id}/transfer-requests (ERR_CENTER_NOT_ACTIVE 422 if destination SUSPENDED)" }
  - { priority: 18, category: business_constraint, check: "No other TransferRequest for this agent in status REQUESTED or APPROVED", error_id: ERR_TRANSFER_IN_PROGRESS, http_status: 409, applies_to: "POST /agents/{id}/transfer-requests, POST /agents/{id}/depart" }
  - { priority: 19, category: business_constraint, check: "Dispute filer is neither the sponsored agent nor the current sponsor of record; appeal_count < 1 on appeal; appellant is the original filer", error_id: ERR_DISPUTE_NOT_ACTIONABLE, http_status: 422, applies_to: "POST /sponsorship-disputes (ERR_APPEAL_EXHAUSTED 422 / ERR_FORBIDDEN 403 on appeal)" }
  - { priority: 20, category: business_fiscal, check: "gross_commission > 0; ledger EXPENSE amount > 0; provisional_profit > 0 at preliminary close; final_profit > 0 at ratification", error_id: ERR_NONPOSITIVE_AMOUNT, http_status: 422, applies_to: "POST /commission-events, POST /profit-share-periods/{id}/ledger-entries (ERR_PROFIT_NOT_POSITIVE 422 for the two close operations)" }
  - { priority: 21, category: business_safety, check: "Segregation of duties: governance ratifier X-User-ID != period.preliminary_closed_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /governance-resolutions/{id}/ratify" }
  - { priority: 22, category: state, check: "OCC: expected_agent_version matches the agent's current version", error_id: ERR_STALE_AGENT_VERSION, http_status: 412, applies_to: "POST /commission-events, POST /agents/{id}/transfer-requests" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-09-01T00:00:00Z and the server MUST NOT fall back to wall-clock time before this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Re-evaluates time-gated rules lazily on next read/write (no eager sweep)"]

  # --- MarketCenter ---
  - { method: POST, path: "/market-centers", description: "Create a market center", roles: [PlatformAdmin], code: 201, input: [name, region_code], output: MarketCenter, side_effects: ["status initialized ACTIVE"] }
  - { method: GET, path: "/market-centers/{id}", description: "Get one market center", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: MarketCenter, side_effects: [] }
  - { method: POST, path: "/market-centers/{id}/suspend", description: "Suspend a market center", roles: [PlatformAdmin], code: 200, input: [], output: MarketCenter, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/market-centers/{id}/reactivate", description: "Reactivate a market center", roles: [PlatformAdmin], code: 200, input: [], output: MarketCenter, side_effects: ["status -> ACTIVE"] }
  - { method: GET, path: "/market-centers/{id}/agents", description: "List agents of a market center", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["limit?", "offset?", "membership_status?"], output: "Agent[]", side_effects: [] }

  # --- Agent ---
  - { method: POST, path: "/market-centers/{id}/agents", description: "Enroll an agent into a market center; creates the VestingSchedule and the SponsorshipEdge closure (<= 7 levels) when sponsor_agent_id is given. PlatformAdmin is permitted so a brand-new center can bootstrap its first agent before any MarketCenterAdmin identity exists.", roles: [PlatformAdmin, MarketCenterAdmin], code: 201, input: [full_name, email, join_date, "sponsor_agent_id?"], output: Agent, side_effects: ["membership_status ENROLLED_PENDING_DOCS; cap year initialized [join_date, join_date + 1 year); accrued_company_dollar 0.00; VestingSchedule ACCRUING created; sponsorship closure edges created"] }
  - { method: GET, path: "/agents", description: "List agents with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["sponsor_agent_id?", "market_center_id?", "membership_status?", "limit?", "offset?"], output: "Agent[]", side_effects: [] }
  - { method: GET, path: "/agents/{id}", description: "Get one agent (includes version for OCC)", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: Agent, side_effects: [] }
  - { method: POST, path: "/agents/{id}/onboarding-documents", description: "Attach an onboarding document; membership auto-activates when the required set is complete", roles: [PlatformAdmin, MarketCenterAdmin], code: 201, input: [document_type, document_ref, "attested_sponsor_agent_id?"], output: OnboardingDocument, side_effects: ["If ICA_SIGNED + W9 (+ SPONSOR_ATTESTATION when sponsored) present: membership_status -> ACTIVE, Agent.version incremented"] }
  - { method: GET, path: "/agents/{id}/onboarding-documents", description: "List an agent's onboarding documents", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["limit?", "offset?"], output: "OnboardingDocument[]", side_effects: [] }
  - { method: GET, path: "/agents/{id}/downline", description: "Sponsorship edges where this agent is the upline (parent)", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["status?", "limit?", "offset?"], output: "SponsorshipEdge[]", side_effects: [] }
  - { method: GET, path: "/agents/{id}/upline", description: "Sponsorship edges where this agent is the downline (child)", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["status?", "limit?", "offset?"], output: "SponsorshipEdge[]", side_effects: [] }
  - { method: GET, path: "/agents/{id}/vesting-schedule", description: "The agent's vesting schedule (array of length 0 or 1)", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: "VestingSchedule[]", side_effects: [] }
  - { method: POST, path: "/agents/{id}/depart", description: "Record an agent's departure; evaluates vesting and forfeits unvested outstanding distributions", roles: [MarketCenterAdmin], code: 200, input: [departure_date], output: Agent, side_effects: ["membership_status -> DEPARTED; VestingSchedule evaluated (VESTED iff service_days_final >= 1095); unvested PROJECTION/PAYABLE distributions -> FORFEITED with period total recomputation"] }
  - { method: POST, path: "/agents/{id}/transfer-requests", description: "Request transfer of this agent to another market center (OCC on agent version)", roles: [Agent], code: 201, input: [to_market_center_id, effective_date, expected_agent_version], output: TransferRequest, side_effects: ["Agent.version incremented by 1"] }
  - { method: GET, path: "/sponsorship-edges", description: "List sponsorship closure edges with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["parent_agent_id?", "child_agent_id?", "status?", "depth_level?", "limit?", "offset?"], output: "SponsorshipEdge[]", side_effects: [] }

  # --- SponsorshipDispute ---
  - { method: POST, path: "/sponsorship-disputes", description: "File a sponsor-attribution dispute (filer = X-User-ID agent)", roles: [Agent], code: 201, input: [sponsored_agent_id, evidence_document_id, reason], output: SponsorshipDispute, side_effects: ["status FILED; window_deadline computed; filed_at from logical clock"] }
  - { method: GET, path: "/sponsorship-disputes", description: "List disputes with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["filer_agent_id?", "sponsored_agent_id?", "evidence_document_id?", "status?", "limit?", "offset?"], output: "SponsorshipDispute[]", side_effects: [] }
  - { method: GET, path: "/sponsorship-disputes/{id}", description: "Get one dispute", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: SponsorshipDispute, side_effects: [] }
  - { method: POST, path: "/sponsorship-disputes/{id}/open-review", description: "Move FILED or REOPENED dispute to UNDER_REVIEW", roles: [RegionalDirector], code: 200, input: [], output: SponsorshipDispute, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/sponsorship-disputes/{id}/resolve", description: "Resolve an UNDER_REVIEW dispute; OVERTURNED re-points the sponsor chain and rebuilds the closure", roles: [RegionalDirector], code: 200, input: [outcome], output: SponsorshipDispute, side_effects: ["On OVERTURNED: sponsored agent re-pointed, subtree edges SUPERSEDED + rebuilt, affected PROJECTION distributions CLAWED_BACK and regenerated"] }
  - { method: POST, path: "/sponsorship-disputes/{id}/appeal", description: "Appeal a resolved dispute (filer only, at most once)", roles: [Agent], code: 200, input: [reason], output: SponsorshipDispute, side_effects: ["status -> REOPENED; appeal_count += 1"] }

  # --- CommissionEvent ---
  - { method: POST, path: "/commission-events", description: "Post a commission event (OCC on agent version); computes the provisional cap split, may flip cap_status, may roll the cap year", roles: [MarketCenterAdmin], code: 201, input: [agent_id, gross_commission, occurred_on, external_ref, expected_agent_version], output: CommissionEvent, side_effects: ["agent_cap_split PROVISIONAL; Agent.accrued_company_dollar updated; cap_status flip at >= 20000.00; cap-year rollover when occurred_on >= cap_year_end; Agent.version incremented by 1"] }
  - { method: GET, path: "/commission-events", description: "List commission events with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["agent_id?", "market_center_id?", "status?", "limit?", "offset?"], output: "CommissionEvent[]", side_effects: [] }
  - { method: GET, path: "/commission-events/{id}", description: "Get one commission event", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: CommissionEvent, side_effects: [] }
  - { method: POST, path: "/commission-events/{id}/settle", description: "Settle a POSTED event (eligible for FINAL replay)", roles: [MarketCenterAdmin], code: 200, input: [], output: CommissionEvent, side_effects: ["status -> SETTLED"] }
  - { method: POST, path: "/commission-events/{id}/void", description: "Void a POSTED event (compensates the provisional accrual; may un-cap the agent)", roles: [MarketCenterAdmin], code: 200, input: [], output: CommissionEvent, side_effects: ["status -> VOID; Agent.accrued_company_dollar -= company_dollar; cap_status reverts below 20000.00; Agent.version incremented by 1"] }

  # --- ProfitSharePeriod / Ledger / Governance ---
  - { method: POST, path: "/market-centers/{id}/profit-share-periods", description: "Open a monthly profit-share period for a market center", roles: [MarketCenterAdmin], code: 201, input: [period_month], output: ProfitSharePeriod, side_effects: ["status OPEN; uniqueness of period_month per center enforced"] }
  - { method: GET, path: "/profit-share-periods", description: "List periods with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["market_center_id?", "status?", "limit?", "offset?"], output: "ProfitSharePeriod[]", side_effects: [] }
  - { method: GET, path: "/profit-share-periods/{id}", description: "Get one period", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: ProfitSharePeriod, side_effects: [] }
  - { method: POST, path: "/profit-share-periods/{id}/ledger-entries", description: "Append an expense or adjustment entry (OPEN periods only)", roles: [MarketCenterAdmin], code: 201, input: [entry_type, amount, "memo?"], output: ProfitShareLedgerEntry, side_effects: ["provisional_profit recomputed"] }
  - { method: GET, path: "/profit-share-periods/{id}/ledger-entries", description: "List ledger entries of a period", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["limit?", "offset?"], output: "ProfitShareLedgerEntry[]", side_effects: [] }
  - { method: POST, path: "/profit-share-periods/{id}/preliminary-close", description: "Preliminary close: computes forward-looking profit, provisional pool, and PROJECTION distributions; records preliminary_closed_by", roles: [MarketCenterAdmin], code: 200, input: [], output: ProfitSharePeriod, side_effects: ["market_center_profit PROVISIONAL; profit_share_distribution PROVISIONAL; status -> PRELIMINARY_CLOSED"] }
  - { method: GET, path: "/profit-share-periods/{id}/distributions", description: "List distributions of a period", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["status?", "basis?", "limit?", "offset?"], output: "ProfitShareDistribution[]", side_effects: [] }
  - { method: POST, path: "/profit-share-periods/{id}/governance-resolutions", description: "Draft a FINAL_CLOSE_RATIFICATION resolution for a PRELIMINARY_CLOSED period", roles: [MarketCenterAdmin], code: 201, input: [resolution_type], output: GovernanceResolution, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/profit-share-periods/{id}/governance-resolutions", description: "List resolutions of a period", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["limit?", "offset?"], output: "GovernanceResolution[]", side_effects: [] }
  - { method: POST, path: "/governance-resolutions/{id}/propose", description: "Propose a DRAFT resolution; moves the period to FINAL_CLOSE_PENDING", roles: [MarketCenterAdmin], code: 200, input: [], output: GovernanceResolution, side_effects: ["status -> PROPOSED; period -> FINAL_CLOSE_PENDING"] }
  - { method: POST, path: "/governance-resolutions/{id}/amend", description: "Amend a REJECTED resolution back to DRAFT", roles: [MarketCenterAdmin], code: 200, input: ["notes?"], output: GovernanceResolution, side_effects: ["status -> DRAFT"] }
  - { method: POST, path: "/governance-resolutions/{id}/ratify", description: "ALC chair ratifies: final close with chronological replay, FINAL distributions, and the ratification cascade", roles: [ALCChair], code: 200, input: [], output: GovernanceResolution, side_effects: ["Segregation-of-duties check vs preliminary_closed_by; period -> FINAL_CLOSED; distributions -> PAYABLE; recipients' pending_payable_profit_share recomputed; departed recipients' vesting re-evaluated"] }
  - { method: POST, path: "/governance-resolutions/{id}/reject", description: "ALC chair rejects: period returns to PRELIMINARY_CLOSED", roles: [ALCChair], code: 200, input: [], output: GovernanceResolution, side_effects: ["status -> REJECTED; period FINAL_CLOSE_PENDING -> PRELIMINARY_CLOSED"] }
  - { method: GET, path: "/governance-resolutions/{id}", description: "Get one governance resolution", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: GovernanceResolution, side_effects: [] }
  - { method: GET, path: "/profit-share-distributions", description: "List distributions with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["agent_id?", "period_id?", "status?", "limit?", "offset?"], output: "ProfitShareDistribution[]", side_effects: [] }
  - { method: GET, path: "/profit-share-distributions/{id}", description: "Get one distribution", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: ProfitShareDistribution, side_effects: [] }
  - { method: POST, path: "/profit-share-distributions/{id}/mark-paid", description: "Mark a PAYABLE distribution paid; credits recipient lifetime totals", roles: [MarketCenterAdmin], code: 200, input: [], output: ProfitShareDistribution, side_effects: ["status -> PAID; Agent.lifetime_profit_share += amount; pending_payable_profit_share -= amount; Agent.version incremented"] }

  # --- TransferRequest ---
  - { method: GET, path: "/transfer-requests", description: "List transfer requests with filters", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: ["agent_id?", "from_market_center_id?", "to_market_center_id?", "status?", "limit?", "offset?"], output: "TransferRequest[]", side_effects: [] }
  - { method: GET, path: "/transfer-requests/{id}", description: "Get one transfer request", roles: [PlatformAdmin, MarketCenterAdmin, RegionalDirector, ALCChair, Agent], code: 200, input: [], output: TransferRequest, side_effects: [] }
  - { method: POST, path: "/transfer-requests/{id}/approve", description: "Approve a REQUESTED transfer", roles: [MarketCenterAdmin], code: 200, input: [], output: TransferRequest, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/transfer-requests/{id}/reject", description: "Reject a REQUESTED transfer", roles: [MarketCenterAdmin], code: 200, input: [], output: TransferRequest, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/transfer-requests/{id}/cancel", description: "Cancel a REQUESTED or APPROVED transfer (requesting agent only)", roles: [Agent], code: 200, input: [], output: TransferRequest, side_effects: ["status -> CANCELLED"] }
  - { method: POST, path: "/transfer-requests/{id}/complete", description: "Complete an APPROVED transfer at/after its effective date; re-homes the agent preserving cap year and downline", roles: [MarketCenterAdmin], code: 200, input: [], output: TransferRequest, side_effects: ["Agent.market_center_id := to_market_center_id; downline and cap year preserved; Agent.version incremented"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint; or ownership violation (cancel/appeal by non-owner)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing or malformed (bad enum, bad period_month format)" }
  - { id: ERR_MARKET_CENTER_NOT_FOUND, http: 404, condition: "Market center id does not exist" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "Agent id (path or body) does not exist" }
  - { id: ERR_PERIOD_NOT_FOUND, http: 404, condition: "Profit-share period id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Sponsorship dispute id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "Onboarding document id does not exist" }
  - { id: ERR_COMMISSION_EVENT_NOT_FOUND, http: 404, condition: "Commission event id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "Transfer request id does not exist" }
  - { id: ERR_RESOLUTION_NOT_FOUND, http: 404, condition: "Governance resolution id does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "Profit share distribution id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid source state for the requested transition (includes voiding an event whose month is FINAL_CLOSED)" }
  - { id: ERR_STALE_AGENT_VERSION, http: 412, condition: "expected_agent_version does not match the agent's current version (OCC)" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "Dispute filed after sponsored agent's join_date + 90 days (deadline is inclusive)" }
  - { id: ERR_TRANSFER_WINDOW_CONFLICT, http: 422, condition: "Transfer effective_date falls inside a source-center period that is PRELIMINARY_CLOSED, FINAL_CLOSE_PENDING, or FINAL_CLOSED" }
  - { id: ERR_BACKDATED_COMMISSION, http: 422, condition: "CommissionEvent.occurred_on precedes the agent's current cap_year_start" }
  - { id: ERR_TRANSFER_NOT_EFFECTIVE, http: 422, condition: "Transfer completion attempted before effective_date (logical clock)" }
  - { id: ERR_SPONSOR_CROSS_CENTER, http: 422, condition: "Sponsor (or dispute counterparty) belongs to a different market center, or sponsor is not ACTIVE" }
  - { id: ERR_SPONSOR_CYCLE, http: 422, condition: "Sponsorship would create a cycle (self-sponsor or ancestor loop)" }
  - { id: ERR_EVIDENCE_INVALID, http: 422, condition: "Evidence document is not a SPONSOR_ATTESTATION of the sponsored agent attesting the filer" }
  - { id: ERR_DISPUTE_NOT_ACTIONABLE, http: 422, condition: "Filer is the sponsored agent themself or the current sponsor of record" }
  - { id: ERR_APPEAL_EXHAUSTED, http: 422, condition: "appeal_count already at maximum (1)" }
  - { id: ERR_PERIOD_MONTH_CONFLICT, http: 409, condition: "A period for this market center and period_month already exists" }
  - { id: ERR_TRANSFER_SELF_CENTER, http: 422, condition: "Transfer destination equals the agent's current market center" }
  - { id: ERR_TRANSFER_IN_PROGRESS, http: 409, condition: "Another TransferRequest for this agent is REQUESTED or APPROVED" }
  - { id: ERR_CENTER_NOT_ACTIVE, http: 422, condition: "Market center is SUSPENDED (enrollment, period creation, transfer approval/completion blocked)" }
  - { id: ERR_NONPOSITIVE_AMOUNT, http: 422, condition: "gross_commission <= 0 or EXPENSE ledger amount <= 0" }
  - { id: ERR_PROFIT_NOT_POSITIVE, http: 422, condition: "provisional_profit <= 0 at preliminary close or final_profit <= 0 at ratification" }
  - { id: ERR_MCA_NOT_CENTER_AGENT, http: 422, condition: "Preliminary-close actor is not an ACTIVE agent of the period's market center" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Ratifier is the same user who ran preliminary close on the period" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages market centers and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /market-centers", "POST /market-centers/{id}/suspend", "POST /market-centers/{id}/reactivate", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "POST /market-centers/{id}/agents", "POST /agents/{id}/onboarding-documents"]
  - name: MarketCenterAdmin
    description: "Market center administrator; an ACTIVE agent of the center operating its books (segregated from ALC ratification of the same period)"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /agents/{id}/depart", "POST /commission-events", "POST /commission-events/{id}/settle", "POST /commission-events/{id}/void", "POST /market-centers/{id}/profit-share-periods", "POST /profit-share-periods/{id}/ledger-entries", "POST /profit-share-periods/{id}/preliminary-close", "POST /profit-share-periods/{id}/governance-resolutions", "POST /governance-resolutions/{id}/propose", "POST /governance-resolutions/{id}/amend", "POST /profit-share-distributions/{id}/mark-paid", "POST /transfer-requests/{id}/approve", "POST /transfer-requests/{id}/reject", "POST /transfer-requests/{id}/complete"]
    shared_operations: ["all GET endpoints", "POST /market-centers/{id}/agents", "POST /agents/{id}/onboarding-documents"]
  - name: RegionalDirector
    description: "Regional officer adjudicating sponsorship disputes"
    identity: opaque
    exclusive_operations: ["POST /sponsorship-disputes/{id}/open-review", "POST /sponsorship-disputes/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
  - name: ALCChair
    description: "Associate Leadership Council chair; an agent of the center who ratifies or rejects final closes"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /governance-resolutions/{id}/ratify", "POST /governance-resolutions/{id}/reject"]
    shared_operations: ["all GET endpoints"]
  - name: Agent
    description: "Enrolled agent; files disputes, appeals, and own transfer requests"
    identity: "entity_backed:Agent"
    exclusive_operations: ["POST /sponsorship-disputes", "POST /sponsorship-disputes/{id}/appeal", "POST /agents/{id}/transfer-requests", "POST /transfer-requests/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
