      - name: service_cycle_create_and_release_are_shared_but_the_steps_are_technician_only
        claim_type: shared_operations
        grounds:
          - roles.ServiceTechnician.exclusive_operations
          - roles.ServiceTechnician.shared_operations
          - roles.PoolOperator.shared_operations
          - validations[priority=25]
        distinguishing_aspect: "Three consecutive endpoints on one cycle have three different role shapes: create is shared (PoolOperator + ServiceTechnician), record-step is technician-EXCLUSIVE, release is shared again. The operator is therefore refused in the middle of a workflow it opened, and the shared release is exactly what satisfies priority 25 here — the only actor who both may release and differs from the tester is the operator."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; pool HB-50L with two kegs, both IN_FLOAT; service centre capacity 2, intake buffer 4."
            - "The operator books K-0001 in at 09:00Z (the shared create, and the declared IN_FLOAT -> IN_SERVICE recertification pull)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
