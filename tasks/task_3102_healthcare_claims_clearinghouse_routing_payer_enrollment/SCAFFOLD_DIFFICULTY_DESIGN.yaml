          Numeric threshold boundary with >= semantics: trailing_billable_units_3m
          == TIER_2_FLOOR (exactly 10000) yields TIER_2, while 9999 yields TIER_1.
          Tests the inclusive-floor boundary on a numeric metric.
        test_recipe:
          setup:
            - "Provider prov_a ACTIVE."
            - "Three FINALIZED UsageInvoice rows for periods 2026-06, 2026-07, 2026-08 with billable_units summing to exactly 10000 (e.g. 5000 + 3000 + 2000)."
            - "A new invoice inv for 2026-09 in OPEN state with claim_units=0."
