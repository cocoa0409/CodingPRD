        distinguishing_aspect: "Each delivered_lines element is individually well-shaped, but the collection is checked against the visit's own recorded line set: an unstocked product is refused at line time, a second line for the same product is refused, and at completion both an over-delivery (21 of 20) and a product that was never requested are refused."
