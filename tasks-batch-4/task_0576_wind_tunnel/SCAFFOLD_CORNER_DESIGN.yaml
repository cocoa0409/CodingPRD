            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
          trigger:
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 5 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_INSUFFICIENT_MINUTES"]

      - name: checkin_over_weight_returns_weight_limit_exceeded
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_WEIGHT_LIMIT_EXCEEDED]", entities.Tunnel.fields.max_weight_kg]
        distinguishing_aspect: "Check-in where member weight 121 > tunnel max 120 returns ERR_WEIGHT_LIMIT_EXCEEDED (strictly greater)."
        test_recipe:
