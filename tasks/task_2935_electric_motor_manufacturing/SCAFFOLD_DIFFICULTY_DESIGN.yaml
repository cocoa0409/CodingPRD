            - "${out_after_cancel} == 200 and ${rem_after_cancel} == 300 (the cancellation credits back exactly 300)"
            - "trigger 7 returns HTTP 200 with ${oc_status} == CONFIRMED (quantity 300 == remaining 300 is allowed at the inclusive boundary)"
