      - name: all_units_terminal_bubbles_shipment_to_ready_for_return
        claim_type: Bubble up
        grounds:
          - state_machines.IntakeShipment.status.IN_PROCESS_to_READY_FOR_RETURN
        excluded_because:
          difficulty_instance: transitive_cascade / condemn_determination_cascades_five_hops_to_loaner_recall
          rationale: "That instance asserts units_in_process 0, status READY_FOR_RETURN, open_shipment_count 0 and loaner_recall_due_at 2026-08-15 as hops 4-5 of the cascade."

      - name: label_void_reverses_every_original_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.IntakeShipment.status.READY_FOR_RETURN_to_IN_PROCESS
          - state_machines.CertificationLabel.status.ACTIVE_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / label_void_compensates_five_hops_and_unlocks_settlement
          rationale: "That instance asserts all five reversal hops including final_total_cents null and loaner_recall_due_at null."

      - name: unit_recon_and_custody_are_independent_state_dimensions
        claim_type: parallel
        grounds:
          - state_machines.EquipmentUnit.recon_status
          - state_machines.EquipmentUnit.custody_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / unit_recon_and_custody_axes_advance_independently
          rationale: "That instance reaches the (REPAIR_PENDING, STAGED_FOR_RETURN) combination that only two independent axes can represent."

  # ===========================================================================
  - section: calculations
    instances:

      - name: severity_index_applies_condition_multiplier_then_material_offset
        claim_type: Constants Applied
        grounds:
          - calculations.shell_test_severity_index
          - calculations.shell_test_severity_index.constants.CONDITION_MULTIPLIER
          - calculations.shell_test_severity_index.constants.MATERIAL_OFFSET
        distinguishing_aspect: |
          Identical impact readings to the AMBIENT/POLYCARBONATE baseline
          (300/300/300 -> 300.0 PASS) become 370.0 CONDEMN under HOT conditioning
          on an ABS shell: 300.0 * 1.15 = 345.0, then + 25 = 370.0 > repair_si_max
          360.0. The multiplier is applied to the weighted sum and the material
          offset only afterwards — reversing the order would give
          (300.0 + 25) * 1.15 = 373.75 and a different stored index.
        test_recipe:
          setup:
            - "one ABS ModelSpec AB-2026 (pass 300.0 / repair 360.0), one unit inspected CLEAR, a calibrated bench"
          setup_api_calls:
            - *k_clock
            - &k_model_abs
              call: "POST /model-specs"
              payload: { manufacturer: "Schutt", model_code: "AB-2026", standard_code: "ND002", shell_material: "ABS", max_service_life_years: 10, warranty_years: 5, record_retention_years: 3, pass_si_max: 300.0, repair_si_max: 360.0, max_retest_count: 3, required_component_codes: ["SHELL"], component_criteria: [{ code: "SHELL", metric: "crack_length_mm", metric_direction: "HIGHER_IS_WORSE", replace_threshold: 4.0, fail_threshold: 6.0, unit: "mm" }] }
              as: PlantManager
              captures: { model_abs_id: $.data.id }
            - *k_acct
            - *k_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "AB-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_abs_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - *k_bench
            - *k_cal
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "HOT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /shell-tests/${t1_id}/record-impacts"
              payload: { peak_g_front: 300, peak_g_side: 300, peak_g_crown: 300 }
              as: Technician
              as_user_id: "tech-1"
          assert:
            - "HTTP 200"
            - "ShellTest.${t1_id}.severity_index == 370.0"
            - "ShellTest.${t1_id}.computed_result == CONDEMN"
            - "ShellTest.${t1_id}.status == COMPLETED"
            - "EquipmentUnit.${u1_id}.recon_status == TESTED"
            - "EquipmentUnit.${u1_id}.retest_count == 0"

      - name: severity_index_rounds_half_up_to_one_decimal_place
        claim_type: Precision
        grounds:
          - calculations.shell_test_severity_index.precision
          - calculations.shell_test_severity_index
        distinguishing_aspect: |
          The only rounding step lands exactly on a half at the second decimal:
          site terms 125.0 + 90.0 + 60.0 = 275.0, HOT 275.0 * 1.15 = 316.25,
          + ABS 25 = 341.25, and ROUND_HALF_UP to 1 dp must store 341.3 (not
          341.2 as banker's rounding or truncation would give). 341.3 is still
          <= repair_si_max 360.0, so the band is REPAIR, not CONDEMN.
        test_recipe:
          setup:
            - "same ABS setup as severity_index_applies_condition_multiplier_then_material_offset, HOT session"
          setup_api_calls:
            - *k_clock
            - *k_model_abs
            - *k_acct
            - *k_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "AB-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_abs_id}", manufacture_date: "2018-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - call: "POST /equipment-units/${u1_id}/disassemble"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${u1_id}/inspections"
              payload: { component_code: "SHELL", measurement_value: 1.50, measurement_unit: "mm", note: "no crown cracking" }
              as: Technician
              as_user_id: "tech-1"
            - *k_bench
            - *k_cal
            - call: "POST /shell-tests"
              payload: { equipment_unit_id: "${u1_id}", test_bench_id: "${bench_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", conditioning: "HOT" }
              as: Technician
              as_user_id: "tech-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /shell-tests/${t1_id}/record-impacts"
              payload: { peak_g_front: 250, peak_g_side: 300, peak_g_crown: 300 }
              as: Technician
              as_user_id: "tech-1"
          assert:
            - "HTTP 200"
            - "ShellTest.${t1_id}.severity_index == 341.3"
