      - name: every_write_endpoint_called_by_a_wrong_role_returns_forbidden
        claim_type: other_roles_denied
        grounds:
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles
          - response_envelope.error
        distinguishing_aspect: |
          The breadth complement of the permitted sweep: twelve writes, one per role boundary in §1.7, are
          each issued by a role that is neither an owner nor a sharer, and every one must return 403
          ERR_ROLE_NOT_PERMITTED. Three of them address the all-zeros uuid, which shows priority 2 is
          evaluated before the priority-3 existence check, and the closing reads prove that not one
          refusal left a row or moved a state.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Nothing else exists: no work order, no instrument, no chamber, no assembly, no classification."
            - "Each call below picks a role that §1.7 lists neither in the endpoint's exclusive_operations nor in its shared_operations."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-X", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: ProcessTechnician
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-X", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcessTechnician
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-X" }
              as: MetrologyTechnician
              as_user_id: "mt-001"
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-X", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: OpticsEngineer
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-X", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z" }
              as: ProcessTechnician
            - call: "POST /optics/coating-chambers"
              payload: { chamber_code: "CH-2540-X", slot_capacity: 2 }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/metrology-reports/00000000-0000-0000-0000-000000000000/sign"
              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/inspection-records/00000000-0000-0000-0000-000000000000/waiver"
              payload: { justification: "Cosmetic dig outside the clear aperture, cleared by review." }
              as: MetrologyTechnician
              as_user_id: "mt-001"
            - call: "POST /optics/assemblies/00000000-0000-0000-0000-000000000000/release"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/optical-designs"
              payload: { limit: 10, offset: 0 }
              as: OpticsEngineer
            - call: "GET /optics/glass-lots"
              payload: { limit: 10, offset: 0 }
              as: ProcurementOfficer
            - call: "GET /optics/metrology-instruments"
              payload: { limit: 10, offset: 0 }
              as: PlantAdmin
              as_user_id: "pa-001"
          assert:
            - "all twelve writes return HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED and response_type error"
            - "the three calls on the all-zeros uuid return 403 and not 404, so the role check runs before the existence check"
            - "the clock call by a QualityManager is refused too: POST /_clock/set_current_utc is PlantAdmin-exclusive"
            - "the design list still holds exactly 1 row (OD-2540-A) and the lot list exactly 1 row (GL-2540-1)"
            - "the instrument list is empty"
            - "OpticalDesign.${d1}.design_status == RELEASED and version unchanged: the refused tolerance-analysis neither re-ran the stack nor moved the state"
            - "GlassLot.${g1}.certificate_reference == CERT-2540-1, unchanged by the refused certification"

      - name: a_report_cannot_be_signed_by_its_own_recorder_but_may_be_signed_by_quality
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_12
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.MetrologyReport.DRAFT_to_SIGNED
          - roles.MetrologyTechnician
          - roles.QualityManager
        distinguishing_aspect: |
          Signing is a shared operation with an identity condition on top of the role condition: mt-001,
          who recorded the report, is a MetrologyTechnician and therefore passes the role check yet is
          refused with 403 ERR_SEGREGATION_OF_DUTIES, while a QualityManager — a role that can never
          record a report at all — signs it successfully. The refusal must leave the report DRAFT and the
          work order in POLISHING, so no verdict was computed on the way out.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio_at_scheduling is 0.0500 and instrument_status is CALIBRATED."
            - "WO-2540-1 (element_count 2) has one POLISHING run r1 that was started and completed with material_removed_nm 800.0, so run_status is AWAITING_METROLOGY."
            - "MetrologyTechnician mt-001 recorded report rep1 on that run with surface_rms_waves 0.0200 and surface_roughness_nm_rms 0.8000; report_status is DRAFT."
            - "The POLISHING figure gate is 0.025 * 3 == 0.075 waves and the roughness gate is 1.2 nm, so the report will be ACCEPTED once it is signed by someone else."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
            - call: "POST /optics/process-runs/${r1}/start"
              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/process-runs/${r1}/complete"
              payload: { material_removed_nm: 800.0 }
              as: ProcessTechnician
            - call: "POST /optics/metrology-reports"
              payload: { process_run_id: "${r1}", surface_rms_waves: 0.0200, surface_roughness_nm_rms: 0.8000 }
              as: MetrologyTechnician
              as_user_id: "mt-001"
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /optics/metrology-reports/${rep1}/sign"
              payload: {}
              as: MetrologyTechnician
              as_user_id: "mt-001"
            - call: "GET /optics/metrology-reports/${rep1}"
              payload: {}
              as: MetrologyTechnician
              as_user_id: "mt-002"
            - call: "GET /optics/work-orders/${w1}"
              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/metrology-reports/${rep1}/sign"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
            - call: "GET /optics/metrology-reports/${rep1}"
              payload: {}
              as: QualityManager
              as_user_id: "qm-002"
            - call: "GET /optics/work-orders/${w1}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/process-runs/${r1}"
              payload: {}
              as: ProcessTechnician
          assert:
            - "the self-signature by mt-001 returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "MetrologyReport.${rep1}.report_status is still DRAFT with verdict null and signed_by_user_id null after the refusal"
            - "WorkOrder.${w1}.process_status is still POLISHING and ProcessRun.${r1}.run_status is still AWAITING_METROLOGY"
            - "the signature by QualityManager qm-001 returns HTTP 200 with report_status SIGNED and signed_by_user_id qm-001"
            - "MetrologyReport.${rep1}.recorded_by_user_id == mt-001 is unchanged, so both identities are retained"
            - "the signed report's verdict == ACCEPTED (0.0200 <= 0.0750 and 0.8000 <= 1.2000)"
            - "ProcessRun.${r1}.run_status == ACCEPTED and WorkOrder.${w1}.process_status == FIGURING"

      - name: the_quality_manager_who_inspected_may_not_waive_the_same_record
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_12
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.InspectionRecord.FAILED_to_WAIVED
          - roles.QualityManager
        distinguishing_aspect: |
          POST /optics/inspection-records is shared with QualityManager while the waiver is
          QualityManager-exclusive, so the same person can be both inspector and waiver-granter — and that
          is exactly what the segregation rule forbids: qm-001, who recorded the failing record, is
          refused with 403 even though the defect is waivable, and qm-002 then grants the identical
          waiver.
