            - "AuditRequest.${ar}.entry_count == 4   # 1 meeting + 3 closed resolutions; unapproved minutes excluded"

      - name: consent_required_count_snapshot_evaluation_order
        grounds:
          - calculations.consent_required_count
          - state_machines.Resolution.DRAFT_to_CIRCULATING
          - state_machines.Resolution.CIRCULATING_to_CONSENT_ADOPTED
        distinguishing_aspect: |
          Mode (c): the recused set feeds the required count while disclosures can later be
          cleared by board action — a circular-looking dependency. The pinned evaluation order
          snapshots S and R at circulation: a post-circulation clearance of the recusing
          disclosure does NOT change consent_required_count (stays 3), and the consent adopts
          on exactly the 3 non-recused signatures.
        test_recipe:
          setup:
            - "Corporation with ADOPTED bylaws (consent_unanimity_required=true, consent_window_days=10)"
            - "4 ACTIVE directors D1..D4; D4 has an OPEN disclosure for related_party 'Acme'"
            - "Resolution origin WRITTEN_CONSENT with related_party 'Acme'; circulated at default clock 2026-05-01T00:00:00Z -> deadline 2026-05-11T00:00:00Z, required = 4 - 1 = 3"
