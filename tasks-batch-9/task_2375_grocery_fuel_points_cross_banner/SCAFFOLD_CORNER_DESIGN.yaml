          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: "The balance test uses points_debited_at_auth rather than points_committed: a member with 300 points committing 500 is refused 422 ERR_INSUFFICIENT_POINTS because the computed debit is 500, while a commitment of 1500 against the SAME 300-point balance is also refused even though its capped debit is 1000 — no partial authorisation is ever issued."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a member holding 300 points; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
