            - "ConversionProject.${proj_id}.included_unit_count == 1 and ConversionProject.${proj_id}.bp_conservation_total == 10000  # the sweep is exact, never dipping to 5000"
            - "ConversionProject.${proj_id}.total_unit_count == 2  # the declared unit count is input, not recomputed"
            - "cascade stop line: DeclarationPackage.${dp_id}.status == RECORDED  # the declared edge is PLAT_CERTIFIED -> DRAFT only, so a RECORDED package is NOT dragged back to DRAFT"
            - "DeclarationPackage.${dp_id}.plat_revision unchanged from its pre-trigger value"
            - "InitialBudget.${ib_id}.status == ADOPTED and InitialBudget.${ib_id}.total_annual_expense_cents == 1080000  # a withdrawal re-splits the budget, it does not re-derive the total"

