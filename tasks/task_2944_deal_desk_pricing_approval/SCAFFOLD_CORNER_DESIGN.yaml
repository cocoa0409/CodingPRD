      - name: revrec_waterfall_puts_the_rounding_residual_on_the_last_allocable_line
        claim_type: waterfall_allocation
        grounds:
          - calculations.C7_revrec_allocation
          - entities.RevRecAssessment.fields.allocation_lines
          - entities.RevRecAssessment.fields.allocation_residual_cents
          - entities.RevRecAssessment.fields.allocable_amount_cents
          - entities.RevRecAssessment.fields.snapshot_quote_version
        distinguishing_aspect: |
          Every allocable line except the last takes its floored standalone-selling-price share and the
          last line created absorbs the remainder: on a 6245148-cent multi-element quote with SSPs
          7200000 and 800000 the Core Platform line takes floor(6245148 * 0.9) = 5620633 while the
          Implementation Services line takes 6245148 - 5620633 = 624515, one cent above its own floored
          share 624514, so allocation_residual_cents is exactly 1.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote, term_months 24 (multiplier 0.95), payment_terms_days 30 (no uplift)."
            - "A Core Platform line of quantity 60 at requested_discount_pct 0.15 created at 2026-08-01T00:00:00Z (band 2 tier discount 0.10, no bundle, MARGINAL_PROGRESSIVE net 5688600, extended_list_cents 7200000)."
            - "An Implementation Services line of quantity 4 at requested_discount_pct 0.10 created one hour later at 2026-08-01T01:00:00Z so the created_at ASC allocation order is unambiguous (net 684000, extended_list_cents 800000)."
            - "Net subtotal 6372600 earns the tier-1 rebate round_half_up(0.02 * 6372600) = 127452, so final_net_total_cents is 6245148 with no usage line to exclude."
