        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NOT_HARVESTABLE_CATEGORY]"]
        distinguishing_aspect: "Harvesting a HELMET SKU from a donor bike is rejected: helmets enter stock only via restock (purchased), never via harvest."
