            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "COMPLETE_STRUCTURE_REMOVAL" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/backfill-plans", payload: { design_disturbed_area_sqft: 10000, planned_protected_area_sqft: 9500, fill_volume_cu_yd: 500, required_compaction_pct: 95.0 }, as: SiteSupervisor, captures: { bp_id: $.data.id } }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "APPROVE" }, as: StructuralEngineer, as_user_id: "bv-be-1" }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_BACKFILL" }, as: SiteSupervisor }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "RECORD_COMPACTION", compaction_pct: 96.0 }, as: SiteSupervisor }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "VERIFY_EROSION", measured_protected_area_sqft: 9180, measured_disturbed_area_sqft: 10200 }, as: MunicipalInspector }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "COMPLETE" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "SUBMIT_FINAL_REVIEW" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/final-inspections", payload: { inspection_type: "FINAL_LOT", scheduled_date: "2026-08-20" }, as: MunicipalInspector, captures: { fi_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/final-inspections/${fi_id}/transition", payload: { action: "PASS" }, as: MunicipalInspector, captures: { fi_st: $.data.status } }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_st: $.data.status, p_rate: $.data.diversion_rate, p_tier: $.data.diversion_tier } }
          assert:
            - "${p_rate} == 0.5 exactly (6.0/12.0) and ${p_tier} == SILVER (>= 0.5000, < 0.7500)"
            - "PASS accepted at the exact boundary: ${fi_st} == PASSED"
            - "bubble-up: ${p_st} == CLOSED (lot closure)"

      - name: compaction_exactly_required_passes
        grounds:
          - state_machines.BackfillPlan.APPROVED_to_COMPACTION_VERIFIED
          - entities.BackfillPlan.fields.compaction_pct_achieved
        distinguishing_aspect: |
          Metric: compaction percentage. compaction_pct == 95.0 exactly equals
          required_compaction_pct 95.0 and PASSES (>=); 94.99 fails. Endpoint:
          POST /demolition/backfill-plans/{id}/transition (RECORD_COMPACTION) —
          distinct endpoint and metric from the dust and diversion boundaries.
        test_recipe:
          setup:
            - "Two projects each with an APPROVED backfill plan requiring 95.0."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Compact A", address: "51 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { pa: $.data.id } }
            - { call: "POST /demolition/projects/${pa}/backfill-plans", payload: { design_disturbed_area_sqft: 8000, planned_protected_area_sqft: 7600, fill_volume_cu_yd: 300, required_compaction_pct: 95.0 }, as: SiteSupervisor, captures: { bpa: $.data.id } }
            - { call: "POST /demolition/backfill-plans/${bpa}/transition", payload: { action: "APPROVE" }, as: StructuralEngineer, as_user_id: "cmp-a-1" }
            - { call: "POST /demolition/projects", payload: { name: "Compact B", address: "53 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /demolition/projects/${pb}/backfill-plans", payload: { design_disturbed_area_sqft: 8000, planned_protected_area_sqft: 7600, fill_volume_cu_yd: 300, required_compaction_pct: 95.0 }, as: SiteSupervisor, captures: { bpb: $.data.id } }
            - { call: "POST /demolition/backfill-plans/${bpb}/transition", payload: { action: "APPROVE" }, as: StructuralEngineer, as_user_id: "cmp-a-1" }
          trigger:
            - { call: "POST /demolition/backfill-plans/${bpa}/transition", payload: { action: "RECORD_COMPACTION", compaction_pct: 94.99 }, as: SiteSupervisor, captures: { err_a: $.data.error_id } }
            - { call: "POST /demolition/backfill-plans/${bpb}/transition", payload: { action: "RECORD_COMPACTION", compaction_pct: 95.0 }, as: SiteSupervisor, captures: { st_b: $.data.status, pct_b: $.data.compaction_pct_achieved } }
          assert:
            - "94.99 < 95.0: ${err_a} == ERR_COMPACTION_BELOW_SPEC and plan stays APPROVED"
            - "95.0 == 95.0: passes (>=); ${st_b} == COMPACTION_VERIFIED and ${pct_b} == 95.0"

      - name: notification_wait_window_exactly_72h
        grounds:
