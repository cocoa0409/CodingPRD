              as_user_id: "${ps_id}"
              captures: { e_ldstate: $.data.error_id }
          assert:
            - "Lead.${ld_id}.status == DISQUALIFIED"
            - "Lead.${ld_id}.disqualification_reason == NOT_QUALIFIED"
            - "EnrollmentCounselor.${co_id}.open_pipeline_count == 0"
            - "response status == 409"
            - "${e_ldstate} == 'ERR_LEAD_INVALID_STATE'"

      - name: withdrawal_stales_the_open_statement_and_recalculate_restores_calculated
        claim_type: idempotency
        grounds:
          - state_machines.RemittanceStatement.CALCULATED|UNIVERSITY_APPROVED_to_STALE
          - state_machines.RemittanceStatement.STALE_to_CALCULATED
          - entities.RemittanceStatement.fields.requires_recalculation
        distinguishing_aspect: "The CALCULATED <-> STALE cycle edge: a withdrawal whose term_start_date falls inside the statement's closed period sets requires_recalculation true, and RECALCULATE returns the statement to CALCULATED with the same 86962-cent net payable and approved_by_user_id cleared."
        test_recipe:
          setup:
            - "EXECUTED Partnership with no marketing spend posted, LAUNCHED Program, one ACTIVE Enrollment S-2001 (term 2026-09-01..2026-12-15, paid 562500 on 2026-09-05)."
            - "A CALCULATED September statement (2026-09-01..2026-09-30) cut at clock 2026-10-01 with recognized_revenue_cents 159198 and net_payable_cents 86962."
            - "The Enrollment is then WITHDRAWN with withdrawal_date 2026-09-08, which stales the statement."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
            - &k_clock_oct1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_get_ps_v
              call: "GET /partnerships/${ps_id}"
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { ps_v: $.data.version }
            - &k_stmt_sept
              call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-09-01", period_end: "2026-09-30", expected_partnership_version: "${ps_v}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st_id: $.data.id }
            - &k_withdraw_sep8
              call: "POST /enrollments/${en_id}/academic-actions"
              payload: { action: "WITHDRAW", withdrawal_date: "2026-09-08", withdrawal_reason: "Employer sponsorship withdrawn" }
              as: UniversityBursar
              as_user_id: "bursar-1"
          trigger:
            - call: "POST /remittance-statements/${st_id}/actions"
              payload: { action: "RECALCULATE" }
              as: UniversityBursar
              as_user_id: "bursar-1"
          assert:
            - "Enrollment.${en_id}.status == WITHDRAWN"
            - "Enrollment.${en_id}.refunded_cents == 281250"
            - "RemittanceStatement.${st_id}.status == CALCULATED"
            - "RemittanceStatement.${st_id}.requires_recalculation == false"
            - "RemittanceStatement.${st_id}.recognized_revenue_cents == 159198"
            - "RemittanceStatement.${st_id}.net_payable_cents == 86962"
            - "RemittanceStatement.${st_id}.approved_by_user_id == null"

      - name: wind_down_cascade_down_the_program_tree
        claim_type: side_effect_execution
        grounds:
          - state_machines.Partnership.EXECUTED_to_WIND_DOWN
          - state_machines.Program.LAUNCHED_to_TEACH_OUT
        excluded_because:
          difficulty_instance: wind_down_chains_partnership_to_program_to_leads_and_courses_to_counselor_inactive
          rationale: "The full four-hop cascade-down side effect is asserted end-to-end by the named §1.8 instance."

      - name: counselor_two_state_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.EnrollmentCounselor
        excluded_because:
          difficulty_instance: counselor_parallel_dimensions_advance_independently
          rationale: "The parallel-dimension independence claim is the subject of the named §1.8 instance."

  - section: calculations
    instances:
      - name: demand_score_clamps_every_component_and_applies_the_modality_factor_once
        claim_type: constants_applied
        grounds:
          - calculations.program_demand_score
          - calculations.program_demand_score.constants
        distinguishing_aspect: "Every declared cap binds at once: projection 900 clamps at PROJECTION_CAP 400 (40 points), 40 competitors drive the competition component to the 0 floor, a 60 percent wage premium clamps at WAGE_PREMIUM_CAP 20 (20 points) and 20 employer partners clamp at EMPLOYER_CAP 15 (15 points), giving raw 75 and, after the single SYNCHRONOUS factor 0.92, exactly 69.00 for both variants."
        test_recipe:
          setup:
            - "EXECUTED Partnership."
            - "No Program yet; the Program about to be created has prior_year_inquiry_volume 6000 so the CONFIRMED projection 600 also clamps at the cap and both variants land on the same score."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
          trigger:
            - call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MEd Online"
                cip_code: "13.0401"
                delivery_modality: "SYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 30
                enrollment_cap: 40
                projected_annual_enrollments: 900
                competitor_program_count: 40
                regional_wage_premium_pct: 60.0
                employer_partner_count: 20
                prior_year_inquiry_volume: 6000
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
                required_service_domains: ["MARKETING"]
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { pgc_id: $.data.id }
          assert:
            - "Program.${pgc_id}.demand_score_screening == 69.00"
            - "Program.${pgc_id}.demand_score_confirmed == 69.00"
            - "Program.${pgc_id}.status == DRAFT"

      - name: recognition_lines_follow_the_cumulative_curve_across_two_consecutive_periods
        claim_type: correct_result
        grounds:
          - calculations.recognized_tuition_revenue
          - calculations.net_remittance_payable
          - endpoints[POST /partnerships/{id}/remittance-statements]
        distinguishing_aspect: "The mandatory cumulative-minus-prior form is visible across two periods of the same 106-day term: September recognises cum(09-30) 159198 and October recognises cum(10-31) 323703 minus 159198 = 164505, so the two period lines never drift from the curve."
        test_recipe:
          setup:
            - "EXECUTED Partnership (PERIOD_STRAIGHT_LINE), LAUNCHED Program, ACTIVE Enrollment S-2001 of 9 credits (tuition_charged_cents 562500, term 2026-09-01..2026-12-15) paid in full on 2026-09-05."
            - "One marketing SPEND of 300000 cents posted 2026-09-05, so unrecouped_marketing_spend_cents is 300000 while both statements are cut."
            - "A September statement cut at clock 2026-10-01, then the clock advanced to 2026-11-01 for the October statement."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
            - &k_spend_300k
              call: "POST /programs/${pg_id}/marketing-spend-entries"
              payload: { entry_type: "SPEND", channel: "PAID_SEARCH", amount_cents: 300000, spend_date: "2026-09-05" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { sp_id: $.data.id }
            - *k_clock_oct1
            - *k_get_ps_v
            - *k_stmt_sept
            - &k_clock_nov1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_get_ps_v2
              call: "GET /partnerships/${ps_id}"
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { ps_v2: $.data.version }
          trigger:
            - call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-10-01", period_end: "2026-10-31", expected_partnership_version: "${ps_v2}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st_oct_id: $.data.id }
          assert:
            - "RemittanceStatement.${st_id}.recognized_revenue_cents == 159198"
            - "RemittanceStatement.${st_id}.net_payable_cents == 73919"
            - "RemittanceStatement.${st_oct_id}.line_count == 1"
            - "RemittanceStatement.${st_oct_id}.recognized_revenue_cents == 164505"
            - "RemittanceStatement.${st_oct_id}.share_gross_cents == 94590"
            - "RemittanceStatement.${st_oct_id}.marketing_recoupment_cents == 14188"
            - "RemittanceStatement.${st_oct_id}.subtotal_cents == 80402"
            - "RemittanceStatement.${st_oct_id}.holdback_cents == 4020"
            - "RemittanceStatement.${st_oct_id}.net_payable_cents == 76382"
            - "Partnership.${ps_id}.contract_year_recognized_cents == 323703"

      - name: amended_revenue_share_tiers_apply_marginal_rates_across_a_straddled_boundary
        claim_type: constants_applied
        grounds:
          - calculations.partner_share_gross
          - endpoints[PATCH /partnerships/{id}/terms]
          - entities.Partnership.fields.revenue_share_tiers
        distinguishing_aspect: "With tiers amended to 100000 at 0.60, 200000 at 0.50 and the remainder at 0.40, the single 159198-cent recognition line straddles the first boundary and is paid marginally — 100000*0.60 + 59198*0.50 = 89599 — not at the average or the top rate (159198*0.60 = 95519 is wrong)."
        test_recipe:
          setup:
            - "EXECUTED Partnership whose revenue_share_tiers were amended under OCC to [{100000, 0.60}, {200000, 0.50}, {null, 0.40}] while still EXECUTED."
            - "LAUNCHED Program with the ACTIVE Enrollment S-2001 paid in full and a 300000-cent marketing SPEND posted."
            - "Logical clock at 2026-10-01."
