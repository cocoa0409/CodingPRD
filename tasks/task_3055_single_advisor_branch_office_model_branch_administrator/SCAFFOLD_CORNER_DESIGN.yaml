  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: patch_branch_stale_version_occ
        claim_type: computed_read
        grounds:
          - concurrency_rules[branch-attribute-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential PATCHes carrying the same observed version: first succeeds (version 1->2), second with stale expected 1 -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Branch created (version 1)."]
          setup_api_calls:
            - call: "POST /branch-office/territories"
              payload: { community_name: "Occ Town 2", household_capacity: 100 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Occ Town 2", site_address: "22 Occ St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id, br_v: $.data.version }
          trigger:
            - call: "PATCH /branch-office/branches/${br_id}"
              payload: { expected_branch_version: "${br_v}", household_count: 10 }
              as: HomeOfficeAdmin
            - call: "PATCH /branch-office/branches/${br_id}"
              payload: { expected_branch_version: "${br_v}", household_count: 20 }
              as: HomeOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds; Branch.version == 2 and household_count == 10"
            - "Second PATCH returns error_id == ERR_STALE_VERSION (412) and household_count stays 10"
      - name: charge_post_to_finalized_period
        claim_type: conditional_action
        grounds:
          - validations[priority=15]
          - errors[ERR_PERIOD_FINALIZED]
