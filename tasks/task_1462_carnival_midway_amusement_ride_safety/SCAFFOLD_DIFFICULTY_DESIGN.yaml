  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wind_resume_hysteresis_exact_boundary
        grounds:
          - calculations.wind_shutdown_sweep
          - state_machines.Ride."daily_status=WEATHER_HOLD_to_daily_status=OPEN"
          - errors[ERR_WIND_ABOVE_LIMIT]
        distinguishing_aspect: |
          Metric: wind mph, endpoint POST /midway/rides/{id}/resume. The hold triggers
          at wind == limit (30 >= 30); resume requires wind <= limit - 3: at exactly 27
          the resume succeeds, at 28 it fails with ERR_WIND_ABOVE_LIMIT — a strict
          inequality boundary, not a >= one.
        test_recipe:
          setup:
            - "Permitted fair; THRILL ride wind_limit_mph 30, OPEN on day 2026-08-03"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
