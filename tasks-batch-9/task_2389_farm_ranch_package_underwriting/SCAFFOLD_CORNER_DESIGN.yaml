            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
            - &k_end_get
              call: "GET /farm-policies/${pol_id}"
