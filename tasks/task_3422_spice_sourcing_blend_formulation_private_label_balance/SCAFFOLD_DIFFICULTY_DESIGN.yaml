# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances. Every instance is self-contained from empty-DB and
# replays only endpoints declared in SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: blend_selection_cost_min_vs_fifo_age
        grounds:
          - calculations.blend_lot_selection
          - calculations.blend_cost_rollup
          - entities.BlendRun.fields.selection_policy
        distinguishing_aspect: |
          Same formula, same three ACCEPTED lots, same target_batch_kg — only
          BlendRun.selection_policy differs (COST_MIN vs FIFO_AGE on the
          BlendRun domain); the two runs commit different lot sets and different
          cost_total_cents (39330 vs 43470).
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED BLACK_PEPPER lots: L1 crop 2024 cost 500, L2 crop 2025 cost 400, L3 crop 2026 cost 300 (all flavor 100.0, moisture 8.0, 100 kg, allergen NONE)"
            - "ACTIVE single-line formula PEP: BLACK_PEPPER 100%, min_lot_flavor_units 50, target_flavor_units 100.0, tolerance 2.0"
            - "two COMMITTED BlendRuns over the same formula with target_batch_kg 100, differing only in selection_policy"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2024, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 500, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { l1: $.data.id } }
            - { call: "POST /spice/lots/${l1}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l1}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l1}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l1}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 400, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { l2: $.data.id } }
            - { call: "POST /spice/lots/${l2}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l2}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l2}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l2}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2026, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 300, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { l3: $.data.id } }
            - { call: "POST /spice/lots/${l3}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l3}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l3}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l3}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/formulas", payload: { product_code: "PEP-100", name: "Pure Pepper", brand_type: BRANDED, target_flavor_units: 100.0, flavor_tolerance_pct: 2.0, max_moisture_pct: 10.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 100.0, allergen_profile: NONE, organic_required: false, min_lot_flavor_units: 50.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 100 }, as: FlavorScientist, captures: { br_cm: $.data.id } }
            - { call: "POST /spice/blend-runs/${br_cm}/commit", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: FIFO_AGE, target_batch_kg: 100 }, as: FlavorScientist, captures: { br_fa: $.data.id } }
            - { call: "POST /spice/blend-runs/${br_fa}/commit", payload: {}, as: FlavorScientist }
            - { call: "GET /spice/blend-runs/${br_cm}", payload: {}, as: FlavorScientist, captures: { cm_total: $.data.cost_total_cents } }
            - { call: "GET /spice/blend-runs/${br_fa}", payload: {}, as: FlavorScientist, captures: { fa_total: $.data.cost_total_cents } }
          trigger:
            - { call: "GET /spice/blend-runs/${br_cm}", payload: {}, as: FlavorScientist }
            - { call: "GET /spice/blend-runs/${br_fa}", payload: {}, as: FlavorScientist }
          assert:
            - "COST_MIN run ${br_cm}: status == COMMITTED, cost_total_cents == 39330 (L3 40.000 kg @300 + L2 40.000 @400 + L1 20.000 @500 = 38000; overhead round_half_up(38000*0.035) = 1330)"
            - "FIFO_AGE run ${br_fa}: status == COMMITTED, cost_total_cents == 43470 (L1 40.000 @500 + L2 40.000 @400 + L3 20.000 @300 = 42000; overhead 1470)"
            - "allocation for lot ${l1} is 20.000 kg in the COST_MIN run but 40.000 kg in the FIFO_AGE run — identical inputs, different selected sets"
            - "both runs residual_flavor_pct == 0.0 and spec_status == WITHIN_SPEC (flavors identical), so the cost delta is attributable to selection order alone"

      - name: recall_scope_provisional_vs_final
        grounds:
          - calculations.recall_scope
          - entities.RecallCase.fields.scope_policy
          - entities.FinishedBatch.fields.genealogy_lot_ids
        distinguishing_aspect: |
          Same suspect lot, two RecallCases differing only in scope_policy on the
          RecallCase domain: FINAL sees only direct genealogy (1 batch, 50 kg);
          PROVISIONAL adds the supplier+spice+crop_year cohort and sweeps in the
          second batch (2 batches, 100 kg).
        test_recipe:
          setup:
            - "supplier S; six ACCEPTED BLACK_PEPPER crop-2025 lots: L1/LA/LB cost 900/910/920 (consumed into batch B1), L2/LC/LD cost 100/110/120 (consumed into batch B2); all flavor 100.0, moisture 8.0, 100 kg"
            - "ACTIVE formula PEP-C (BLACK_PEPPER 100%, min flavor 50); two COMMITTED COST_MIN blend runs of 50 kg each (B1 before L2/LC/LD were accepted, so B1 genealogy = {L1,LA,LB}; B2 genealogy = {L2,LC,LD})"
            - "two COMPLETED production runs producing batches B1 and B2 (50 kg each)"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Andes Spice Co", origin_country: "PE" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "La Vera", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 900, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { l1: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "La Vera", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 910, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { la: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "La Vera", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 920, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lb: $.data.id } }
            - { call: "POST /spice/lots/${l1}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l1}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l1}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l1}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/formulas", payload: { product_code: "PEP-C", name: "Cohort Pepper", brand_type: BRANDED, target_flavor_units: 100.0, flavor_tolerance_pct: 2.0, max_moisture_pct: 10.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 100.0, allergen_profile: NONE, organic_required: false, min_lot_flavor_units: 50.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 50 }, as: FlavorScientist, captures: { br1: $.data.id } }
            - { call: "POST /spice/blend-runs/${br1}/commit", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "La Vera", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { l2: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "La Vera", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 110, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lc: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "La Vera", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 120, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { ld: $.data.id } }
            - { call: "POST /spice/lots/${l2}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l2}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l2}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${l2}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${ld}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${ld}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${ld}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${ld}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 50 }, as: FlavorScientist, captures: { br2: $.data.id } }
            - { call: "POST /spice/blend-runs/${br2}/commit", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/lines", payload: { name: "Line-R", capacity_kg_per_shift: 1000, supported_changeover_classes: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION] }, as: PlatformAdmin, captures: { ln: $.data.id } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v1: $.data.version } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br1}", quantity_kg: 50, window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-07T11:00:00Z", expected_line_version: "${ln_v1}" }, as: ProductionScheduler, captures: { r1: $.data.id } }
            - { call: "POST /spice/production-runs/${r1}/complete", payload: {}, as: ProductionScheduler }
            - { call: "GET /spice/batches", payload: {}, as: QualityManager, captures: { b1: "$.data[0].id" } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v2: $.data.version } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br2}", quantity_kg: 50, window_start: "2026-09-07T11:00:00Z", window_end: "2026-09-07T14:00:00Z", expected_line_version: "${ln_v2}" }, as: ProductionScheduler, captures: { r2: $.data.id } }
            - { call: "POST /spice/production-runs/${r2}/complete", payload: {}, as: ProductionScheduler }
          trigger:
            - { call: "POST /spice/recall-cases", payload: { trigger_type: LOT_SUSPECT, suspect_lot_id: "${l1}", scope_policy: FINAL }, as: RecallCoordinator, captures: { rc_fin: $.data.id } }
            - { call: "POST /spice/recall-cases/${rc_fin}/initiate", payload: {}, as: RecallCoordinator }
            - { call: "POST /spice/recall-cases", payload: { trigger_type: LOT_SUSPECT, suspect_lot_id: "${l1}", scope_policy: PROVISIONAL }, as: RecallCoordinator, captures: { rc_pro: $.data.id } }
            - { call: "POST /spice/recall-cases/${rc_pro}/initiate", payload: {}, as: RecallCoordinator }
            - { call: "GET /spice/recall-cases/${rc_fin}", payload: {}, as: RecallCoordinator }
            - { call: "GET /spice/recall-cases/${rc_pro}", payload: {}, as: RecallCoordinator }
          assert:
            - "FINAL case ${rc_fin}: affected_batch_ids == [${b1}] exactly (direct genealogy only), affected_quantity_kg == 50"
            - "PROVISIONAL case ${rc_pro}: affected_batch_ids has length 2 and contains ${b1}; affected_quantity_kg == 100 (cohort lots ${l2}, ${lc}, ${ld} pull in batch 2)"
            - "PROVISIONAL affected set is a strict superset of FINAL's — same suspect, same database, different scope_policy"
            - "batch ${b1} genealogy_lot_ids == [${l1}, ${la}, ${lb}] (COST_MIN order), proving B2's genealogy excludes ${l1}"

  - rule_id: combinatorial_formula
    instances:
      - name: blend_allocation_multi_constraint_mode_a
        grounds:
          - calculations.blend_lot_selection
          - calculations.blend_cost_rollup
        distinguishing_aspect: |
          Mode (a) combinatorial instance: a 2-line formula where per-line needed
          kg, per-lot remaining, the 40% single-lot cap, and per-line
          min_lot_flavor_units interact through nested min() allocation; the cap
          binds on every line (48/32 kg), forcing a third lot into each line.
        test_recipe:
          setup:
            - "supplier S; ACCEPTED pepper lots P1 crop 2024 flavor 90 cost 300 qty 100, P2 crop 2025 flavor 85 cost 280 qty 100, P3 crop 2025 flavor 88 cost 320 qty 100; ACCEPTED paprika lots K1 flavor 60 cost 200 qty 50, K2 flavor 55 cost 180 qty 60, K3 flavor 58 cost 220 qty 40 (all moisture 8.0, allergen NONE)"
            - "ACTIVE formula GRILL-42: BLACK_PEPPER 60% (min flavor 80), PAPRIKA 40% (min flavor 50); target_flavor_units 75.0, tolerance 2.0, max moisture 10.0"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Global Spice Ltd", origin_country: "VN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Dak Lak", crop_year: 2024, quantity_kg: 100, flavor_intensity_units: 90.0, moisture_pct: 8.0, cost_per_kg_cents: 300, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { p1: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Dak Lak", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 85.0, moisture_pct: 8.0, cost_per_kg_cents: 280, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { p2: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Dak Lak", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 88.0, moisture_pct: 8.0, cost_per_kg_cents: 320, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { p3: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: PAPRIKA, origin_region: "Szeged", crop_year: 2025, quantity_kg: 50, flavor_intensity_units: 60.0, moisture_pct: 8.0, cost_per_kg_cents: 200, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { k1: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: PAPRIKA, origin_region: "Szeged", crop_year: 2025, quantity_kg: 60, flavor_intensity_units: 55.0, moisture_pct: 8.0, cost_per_kg_cents: 180, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { k2: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: PAPRIKA, origin_region: "Szeged", crop_year: 2026, quantity_kg: 40, flavor_intensity_units: 58.0, moisture_pct: 8.0, cost_per_kg_cents: 220, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { k3: $.data.id } }
            - { call: "POST /spice/lots/${p1}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${p1}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${p1}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${p1}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${p2}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${p2}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${p2}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${p2}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${p3}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
