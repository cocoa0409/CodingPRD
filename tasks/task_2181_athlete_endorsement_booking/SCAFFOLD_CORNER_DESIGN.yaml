          setup:
            - "Only one athlete exists; every id used below is a well-formed UUID that resolves to nothing."
          setup_api_calls:
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
