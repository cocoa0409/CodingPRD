            - "PumpHouse.${ph1_id}.active_session_count == 1 and PumpHouse.${ph1_id}.peak_committed_gpm == 1200"
  - rule_id: resource_temporal_overlap
    instances:

      - name: pump_house_aggregate_gpm_half_open_sweep_rejects_and_admits_touching_window
        grounds:
          - calculations.pump_capacity_sweep
          - validations[priority=42]
          - errors[ERR_PUMP_CAPACITY_EXCEEDED]
          - entities.PumpHouse.fields.max_gpm
          - entities.PumpHouse.fields.peak_committed_gpm
          - entities.SnowmakingSession.fields.gpm
        distinguishing_aspect: |
          The shared resource is a PumpHouse and the interval semantics are AGGREGATE half-open: each peer
          individually fits under max_gpm 2400 and the candidate is only 400 gpm, but the boundary interval
          [11:00, 12:00) carries 1200 + 900 + 400 = 2500 and must be refused. The same sweep then admits a
          300 gpm window starting exactly when peer A ends, because [window_start, window_end) means a
          touching interval is not an overlap - so the rule rejects on summed occupancy and admits on
          adjacency, in the same setup. peak_committed_gpm is finally read at 2100, which comes from the
          peer-only interval [10:00, 12:00) that the admitted session never intersects, so the peak cannot be
          computed from the candidate's own window alone. The three sessions live on three DIFFERENT terrain
          areas so that no supersede rule perturbs the peer set.
        test_recipe:
          setup:
            - "A season with plant_max_gpm 6000 and pump house PH1 ONLINE with max_gpm 2400; no day plan is needed because session create is legal in PRESEASON."
            - "Three terrain areas T1, T2 and T3 share the same serving lift and the same pump house."
            - "Peer A on T1: [08:00, 12:00) at 1200 gpm, water_af_reserved 0.884. Peer B on T2: [10:00, 14:00) at 900 gpm, water_af_reserved 0.663."
            - "Candidate C on T3: [11:00, 13:00) at 400 gpm - overlaps both peers over [11:00, 12:00)."
            - "Candidate D on T3: [12:00, 14:00) at 300 gpm - touches A's end at 12:00 and overlaps only B, water_af_reserved 0.110."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { t1_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T2", name: "Meadow", terrain_class: "GREEN", acres: 14.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { t2_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T3", name: "Cirque", terrain_class: "BLACK", acres: 8.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { t3_id: $.data.id }
            - call: "POST /mountain-ops/pump-houses"
              payload: { season_id: "${season_id}", pump_house_code: "PH1", name: "Base Pumphouse", max_gpm: 2400, gun_count: 40, status: "ONLINE" }
              as: SnowmakingSupervisor
              captures: { ph1_id: $.data.id }
            - call: "GET /mountain-ops/terrain-areas/${t1_id}"
              payload: {  }
              as: SnowmakingSupervisor
              captures: { ta1_v: $.data.version }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${t1_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta1_v}" }
              as: SnowmakingSupervisor
              captures: { sess_a_id: $.data.id }
            - call: "GET /mountain-ops/terrain-areas/${t2_id}"
              payload: {  }
              as: SnowmakingSupervisor
              captures: { ta2_v: $.data.version }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${t2_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T14:00:00Z", gun_count: 24, gpm: 900, expected_terrain_area_version: "${ta2_v}" }
              as: SnowmakingSupervisor
              captures: { sess_b_id: $.data.id }
            - call: "GET /mountain-ops/terrain-areas/${t3_id}"
              payload: {  }
              as: SnowmakingSupervisor
              captures: { ta3_v1: $.data.version }
          trigger:
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${t3_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z", gun_count: 10, gpm: 400, expected_terrain_area_version: "${ta3_v1}" }
              as: SnowmakingSupervisor
              captures: { sess_c_id: $.data.id, err_id: $.data.error_id }
            - call: "GET /mountain-ops/terrain-areas/${t3_id}"
              payload: {  }
              as: SnowmakingSupervisor
              captures: { ta3_v2: $.data.version }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${t3_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T14:00:00Z", gun_count: 8, gpm: 300, expected_terrain_area_version: "${ta3_v2}" }
              as: SnowmakingSupervisor
              captures: { sess_d_id: $.data.id }
            - call: "GET /mountain-ops/pump-houses/${ph1_id}"
              payload: {  }
              as: SnowmakingSupervisor
            - call: "GET /mountain-ops/seasons/${season_id}/snow-accounting"
              payload: {  }
              as: SnowmakingSupervisor
          assert:
            - "candidate C is rejected with error_id ERR_PUMP_CAPACITY_EXCEEDED and HTTP 422, because [11:00, 12:00) would carry 2500 gpm against max_gpm 2400"
            - "the rejection is NOT ERR_PLANT_CAPACITY_EXCEEDED - 2500 is far below plant_max_gpm 6000 and the pump-house sweep runs first"
            - "${ta3_v2} == ${ta3_v1}: the rejected create did not increment TerrainArea.version"
            - "candidate D is accepted with SnowmakingSession.${sess_d_id}.state == SCHEDULED and water_af_reserved == 0.110, even though it starts exactly when peer A ends"
            - "PumpHouse.${ph1_id}.peak_committed_gpm == 2100, taken from the peer-only interval [10:00, 12:00) rather than from any interval D occupies"
            - "PumpHouse.${ph1_id}.active_session_count == 0 - nothing has started running"
            - "GET /mountain-ops/seasons/${season_id}/snow-accounting data.water_reserved_af == 1.657   # 0.884 + 0.663 + 0.110"
            - "TerrainArea.${t3_id}.opening_state == PREP, moved out of CLOSED only by the accepted create"

      - name: operator_turnaround_buffer_rejects_thirty_minute_gap_on_lift_staff_assignment
        grounds:
          - validations[priority=39]
          - errors[ERR_OPERATOR_DOUBLE_BOOKED]
          - entities.LiftStaffAssignment.fields.shift_start
          - entities.LiftStaffAssignment.fields.shift_end
          - entities.LiftStaffAssignment.fields.operator_code
          - entities.Lift.fields.staffed_operator_count
        distinguishing_aspect: |
          A different resource entity and deliberately different interval semantics from the pump-house
          sweep: the resource is a human operator identified by operator_code, and the conflict test is not
          overlap at all but a 30 minute OPERATOR_TURNAROUND_MINUTES buffer around each shift. Two shifts that
          do not overlap by any amount still conflict when the gap is 15 minutes, and the boundary case is a
          gap of exactly 30 minutes, which is admissible because the declared test is
          new.shift_start < peer.shift_end + 30. So where the pump house admits touching intervals and
          rejects on summed occupancy, this rule rejects strictly disjoint intervals and never sums anything.
          The role_on_lift differs from the peer's, so the role-slot rule at priority 38 stays satisfied and
          cannot mask the result.
        test_recipe:
          setup:
            - "A season and lift L1 with required_operator_count 2; no inspection or day plan is needed because assignment creation is unaffected by them."
            - "Peer assignment: operator OP-1 as TOP_OP over [2026-08-01T06:00:00Z, 2026-08-01T14:00:00Z), state ASSIGNED."
            - "First candidate: the same operator OP-1 as MID_LOAD over [2026-08-01T14:15:00Z, 2026-08-01T18:00:00Z) - a 15 minute gap, inside the buffer."
            - "Second candidate: the same operator OP-1 as MID_LOAD over [2026-08-01T14:30:00Z, 2026-08-01T18:00:00Z) - a gap of exactly 30 minutes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "TOP_OP", shift_start: "2026-08-01T06:00:00Z", shift_end: "2026-08-01T14:00:00Z" }
              as: LiftOpsManager
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "MID_LOAD", shift_start: "2026-08-01T14:15:00Z", shift_end: "2026-08-01T18:00:00Z" }
              as: LiftOpsManager
              captures: { err_id: $.data.error_id }
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "MID_LOAD", shift_start: "2026-08-01T14:30:00Z", shift_end: "2026-08-01T18:00:00Z" }
              as: LiftOpsManager
              captures: { asg2_id: $.data.id }
            - call: "GET /mountain-ops/lifts/${lift_id}/staff-assignments"
              payload: { state: "ASSIGNED" }
              as: LiftOpsManager
          assert:
            - "the 15 minute gap is rejected with error_id ERR_OPERATOR_DOUBLE_BOOKED and HTTP 409, even though the two shifts do not overlap by a single second"
            - "the rejection is NOT ERR_LIFT_ROLE_SLOT_CONFLICT - MID_LOAD is unoccupied"
            - "the 30 minute gap is accepted: LiftStaffAssignment.${asg2_id}.state == ASSIGNED with shift_start == 2026-08-01T14:30:00Z"
            - "LiftStaffAssignment.${asg1_id}.state == ASSIGNED, untouched by either attempt"
            - "Lift.${lift_id}.staffed_operator_count == 2, so the lift now satisfies validations[priority=37]"
            - "GET /mountain-ops/lifts/${lift_id}/staff-assignments?state=ASSIGNED returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:

      - name: season_water_ledger_conserved_across_session_abort
        grounds:
          - calculations.season_snow_accounting
          - calculations.snowmaking_water_volume
          - state_machines.SnowmakingSession.SCHEDULED_to_ABORTED
          - entities.SeasonConfig.fields.water_reserved_af
          - entities.SeasonConfig.fields.water_used_af
          - entities.SeasonConfig.fields.snow_produced_swe_af
          - entities.SnowmakingSession.fields.abort_reason
        distinguishing_aspect: |
          The conserved quantity is a continuous physical inventory measured in acre-feet: the identity
          water_used_af + water_reserved_af + water_right_remaining_af == water_right_seasonal_af must hold
          after every create, complete and abort. Two sessions push it out of balance in opposite directions -
          one completes, retiring its 1.547 AF reservation and drawing 1.326 AF, and one is aborted by a wind
          cascade, which must release its whole 0.902 AF reservation and draw nothing. The compensation is
          exact rather than approximate: the aborted row contributes to NONE of the three ledgers, so
          water_reserved_af must return to exactly 0.000 and the remaining right to exactly 248.674, while
          snow_produced_swe_af keeps only the completed row's 1.127 AF of snow-water equivalent.
        test_recipe:
          setup:
            - "Open-mountain bootstrap with water_right_seasonal_af 250.000 and pump house PH1 ONLINE (max_gpm 2400)."
            - "Session A on T1: [05:00, 12:00) at 1200 gpm, water_af_reserved 1.547. Session B on T1: [12:00, 19:00) at 700 gpm, water_af_reserved 0.902. The windows only touch, so B is never superseded by A."
            - "A runs 05:00-07:00, pauses, resumes at 09:00 and completes at 13:00 with accumulated_run_minutes 360, water_af_actual 1.326 and snow_swe_af round_half_up(1.326 * 0.85, 3) = 1.127."
            - "B is still SCHEDULED when the trigger fires, so the wind cascade aborts it with abort_reason TERRAIN_HOLD."
