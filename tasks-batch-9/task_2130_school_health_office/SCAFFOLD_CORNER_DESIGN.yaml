              captures: { stu_id: $.data.id, stu_v0: $.data.version }
            - call: "POST /health-office/action-plans"
              payload: { student_id: "${stu_id}", condition_code: "ASTHMA", severity_score: 3, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-01T00:00:00Z", expected_student_version: "${stu_v0}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /health-office/action-plans/${p1_id}/submit"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/action-plans/${p1_id}/guardian-consent"
              payload: {}
              as: Guardian
              as_user_id: "${stu_id}"
            - call: "POST /health-office/action-plans/${p1_id}/decision"
              payload: { decision: "APPROVE" }
              as: SchoolPhysician
              as_user_id: "phys-md-01"
              captures: { p1_status: $.data.status }
            - call: "GET /health-office/students/${stu_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { stu_v1: $.data.version }
          trigger:
            - call: "POST /health-office/action-plans"
              payload: { student_id: "${stu_id}", condition_code: "ASTHMA", severity_score: 4, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-02T00:00:00Z", expected_student_version: "${stu_v1}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
            - call: "GET /health-office/students/${stu_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { stu_v2: $.data.version }
            - call: "POST /health-office/action-plans"
              payload: { student_id: "${stu_id}", condition_code: "ASTHMA", severity_score: 4, requires_stock_epinephrine: false, self_carry_requested: false, effective_from: "2026-08-02T00:00:00Z", expected_student_version: "${stu_v2}", supersedes_action_plan_id: "${p1_id}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { p2_id: $.data.id }
