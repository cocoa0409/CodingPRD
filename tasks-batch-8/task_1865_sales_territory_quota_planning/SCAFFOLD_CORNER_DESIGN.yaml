          setup: ["Plan OPEN; T ACTIVE; rep R2 has no assignment to T"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R2", email: "r2@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: 90000 }, as: SalesRep, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_TERRITORY_MEMBER (HTTP 409)"

      - name: submission_non_positive_quota_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AMOUNT_NOT_POSITIVE]"]
        distinguishing_aspect: "proposed_quota_cents == 0 is rejected with 422 even when state, membership and uniqueness all pass."
        test_recipe:
          setup: ["Plan OPEN; T ACTIVE; rep R assigned to T"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: 0 }, as: SalesRep, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_AMOUNT_NOT_POSITIVE (HTTP 422)"

      - name: headcount_capacity_enforced_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_HEADCOUNT_EXCEEDED]"]
        distinguishing_aspect: "Territory with headcount_capacity 1 accepts the first ACTIVE assignment and rejects the second."
        test_recipe:
          setup: ["Plan OPEN; T ACTIVE capacity 1; reps R1, R2"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 1 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R1", email: "r1@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r1: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R2", email: "r2@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r1}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r2}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_HEADCOUNT_EXCEEDED (HTTP 409)"

      - name: new_hire_without_ramp_schedule_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_RAMP_SCHEDULE_REQUIRED]"]
        distinguishing_aspect: "hire_date 2027-02-10 falls inside the 2027 plan year, so ramp_schedule_id is conditionally required; omitting it is a 422."
        test_recipe:
          setup: ["Plan OPEN; T ACTIVE capacity 5; rep hired 2027-02-10"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "NH", email: "nh@x.com", hire_date: "2027-02-10" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-02-10" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RAMP_SCHEDULE_REQUIRED (HTTP 422)"

      - name: credit_to_unassigned_account_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ACCOUNT_UNASSIGNED]"]
        distinguishing_aspect: "A booking for an account with assigned_territory_id null cannot route to any rep."
