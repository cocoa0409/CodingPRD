        grounds:
          - calculations.vessel_selection_scoring
          - entities.SelectionNotice.fields.rank
        distinguishing_aspect: |
          Selector policy determinism: two eligible vessels with identical
          scores (both 80.0000 — null recency, clean, no gear match) are ranked
          by tie-break 1 (last_observed_end_date ASC NULLS FIRST — both null),
          then tie-break 2 (Vessel.created_at ASC): the earlier-registered
          vessel takes rank 1. Vessel.id MUST NOT decide the order.
        test_recipe:
          setup:
            - "Fishery F priority_gear POT; operator OP; vessels VA (created first) and VB (created second), both LONGLINE, no history -> identical score 80.0000"
            - "Plan P projected 200/0 -> required 60 -> 2 selected"
