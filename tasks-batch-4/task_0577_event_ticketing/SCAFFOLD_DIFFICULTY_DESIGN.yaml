            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b1}" }, as: Buyer, as_user_id: "${b1}", captures: { tk1: $.data.id } }
            - { call: "POST /queue-tokens/${tk1}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b2}" }, as: Buyer, as_user_id: "${b2}", captures: { tk2: $.data.id } }
            - { call: "POST /queue-tokens/${tk2}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b1}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b1}", captures: { h1: $.data.id } }
            - { call: "GET /events/${ev}", payload: {}, as: BoxOffice, captures: { ev_v2: $.data.version } }
          trigger:
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b2}", expected_event_version: "${ev_v2}" }, as: Buyer, as_user_id: "${b2}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:20:00Z" }, as: BoxOffice }
            - { call: "POST /events/${ev}/sweep-holds", payload: {}, as: BoxOffice }
            - { call: "GET /events/${ev}", payload: {}, as: BoxOffice, captures: { ev_v3: $.data.version } }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b2}", expected_event_version: "${ev_v3}" }, as: Buyer, as_user_id: "${b2}", captures: { h2: $.data.id } }
          assert:
            - "first hold-B2 attempt: response status == 409 and error_id == ERR_SEAT_UNAVAILABLE"
            - "after sweep at 10:20 (past expires_at 10:15): Hold.${h1}.status == EXPIRED"
            - "second hold-B2 attempt succeeds: Hold.${h2}.status == ACTIVE"

      - name: queue_admission_window_inclusive_overlap
        grounds:
          - state_machines.QueueToken.transitions.WAITING_to_ADMITTED
          - errors[ERR_ALREADY_ADMITTED]
          - entities.QueueToken.fields.purchase_deadline
        distinguishing_aspect: "QueueToken resource on a different (inclusive) interval semantic: a buyer already ADMITTED with purchase_deadline >= clock cannot be admitted for a second token (ERR_ALREADY_ADMITTED); the block is inclusive of the deadline instant, unlike the seat hold's half-open expiry."
        test_recipe:
          setup:
            - "Event ONSALE, purchase_window_minutes 30; buyer B holds two WAITING tokens; first admitted at clock 2026-06-01T10:00Z (deadline 10:30)."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: BoxOffice }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk1: $.data.id } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk2: $.data.id } }
            - { call: "POST /queue-tokens/${tk1}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:30:00Z" }, as: BoxOffice }
          trigger:
            - { call: "POST /queue-tokens/${tk2}/admit", payload: {}, as: BoxOffice, captures: { err: $.data.error_id } }
          assert:
            - "response status == 409"
            - "error_id == ERR_ALREADY_ADMITTED (deadline 10:30 is inclusive: clock==deadline still blocks)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_count_conservation_hold_then_release
        grounds:
          - calculations.seat_inventory_counts
          - entities.Event.fields.seats_available
          - entities.Event.fields.seats_held
          - entities.Event.fields.seats_sold
        distinguishing_aspect: "Conserved quantity = seat count: for every event, seats_available + seats_held + seats_sold == total_capacity. Holding 2 seats (available 0, held 2) then releasing the hold (available 2, held 0) leaves the sum at total_capacity==2 both before and after."
        test_recipe:
          setup:
            - "Event ONSALE with exactly 2 seats; buyer B admitted; B holds both seats then releases the hold."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}", "${s2}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "GET /events/${ev}", payload: {}, as: BoxOffice, captures: { held_avail: $.data.seats_available, held_held: $.data.seats_held } }
          trigger:
            - { call: "POST /holds/${h}/release", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /events/${ev}", payload: {}, as: BoxOffice, captures: { rel_avail: $.data.seats_available, rel_held: $.data.seats_held } }
          assert:
            - "while held: Event.${ev}.seats_available == 0 and Event.${ev}.seats_held == 2 and Event.${ev}.seats_sold == 0 (sum == total_capacity 2)"
            - "after release: Event.${ev}.seats_available == 2 and Event.${ev}.seats_held == 0 and Event.${ev}.seats_sold == 0 (sum == total_capacity 2)"

      - name: money_conservation_credit_refund_equals_amount
        grounds:
          - calculations.buyer_credit_ledger
          - calculations.refund_amount
          - entities.Buyer.fields.credit_balance_cents
          - entities.RefundRequest.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = money: a CREDIT-destination refund of a single 9990 face ticket raises buyer.credit_balance_cents from 0 to exactly the refund amount_cents (9990); no other operation moves the balance."
        test_recipe:
          setup:
            - "Buyer B with a PAID 1-seat order (ticket face 9990); credit_balance_cents starts 0."
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "Gig", venue_name: "Hall", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { ord_v: $.data.version } }
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "CREDIT", expected_order_version: "${ord_v}" }, as: Buyer, as_user_id: "${b}", captures: { rr: $.data.id, amt: $.data.amount_cents } }
          trigger:
            - { call: "POST /refund-requests/${rr}/approve", payload: {}, as: BoxOffice }
            - { call: "GET /buyers/${b}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { credit: $.data.credit_balance_cents } }
          assert:
            - "RefundRequest.${rr}.amount_cents == 9990"
            - "Buyer.${b}.credit_balance_cents == 9990"
            - "Order.${o}.status == REFUNDED"
