              captures: { jobB_id: $.data.id, jobB_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${jobB_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${jobB_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
