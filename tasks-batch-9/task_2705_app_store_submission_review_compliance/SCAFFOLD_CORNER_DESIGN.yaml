        distinguishing_aspect: "A CONSUMABLE item created without subscriber_retention_months starts status DRAFT with subscriber_retention_months 0, reported_gross_cents 0, commission_cents 0, commission_rate_applied null and reported_period_label null."
        test_recipe:
