      - name: addl_medicare_threshold_exact_no_charge
        grounds:
          - calculations.medicare_addl_calc
          - endpoints.POST_/paychecks
          - entities.Paycheck.fields.addl_medicare_cents
        distinguishing_aspect: |
          Boundary on the additional Medicare YTD threshold ($200,000.00 = 20,000,000c) reached
          on POST /paychecks: an Employee whose ytd_medicare_wages_cents is exactly 19,800,000c
          and a new REGULAR $2,000 paycheck (200,000c) takes new_ytd to EXACTLY 20,000,000c —
          the threshold itself contributes zero Additional Medicare (the rule applies strictly
          ABOVE, NOT at-the-threshold). addl_medicare_cents == 0. Metric: medicare-YTD threshold;
          endpoint: POST /paychecks.
