scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: quoted_vs_final_fee_preparer_upgrade
        grounds:
          - calculations.prep_fee_quote
          - calculations.prep_fee_final
          - state_machines.TaxReturn.PREPARING_to_FILED
        distinguishing_aspect: |
          Same components and same return produce two different fees: quoted_fee_cents
          uses the ASSOCIATE multiplier at creation (27500) while final_fee_cents is
          recomputed at filing after the preparer was upgraded to SENIOR (34400).
        test_recipe:
          setup:
            - "Office O1 posture OK; preparer P1 tier ASSOCIATE; client C1 exists"
            - "Return R1 for C1 with components [1040_SIMPLE, 1040_MULTI_STATE] in PREPARING with quoted_fee_cents 27500"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "Pat Assoc", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/preparers/${prep1}/upgrade"
              payload: { tier: "SENIOR" }
              as: OfficeManager
          trigger:
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
          assert:
            - "TaxReturn.${ret1}.quoted_fee_cents == 27500"
            - "TaxReturn.${ret1}.final_fee_cents == 34400"
            - "TaxReturn.${ret1}.status == FILED"
      - name: payout_variant_preparer_vs_client_data_error
        grounds:
          - calculations.reimbursement_payout
          - entities.Claim.fields.error_attribution
        distinguishing_aspect: |
          Identical notice figures (tax_delta 38000, interest 323, PLUS product) yield
          payout_total 43323 under PREPARER_ERROR attribution but only 323 under
          CLIENT_DATA_ERROR on a second return processed through the same pipeline.
        test_recipe:
          setup:
            - "Office O1 with escrow 100000000; preparer P1 (ASSOCIATE); clients C1 and C2"
            - "Two identical FILED returns R1 (client C1) and R2 (client C2), each components [1040_ITEMIZED, 1040_MULTI_STATE] (credits 35000), each with a PLUS product (premium 19800)"
            - "Notices N1 (on R1) and N2 (on R2): FEDERAL, tax_delta 38000, penalty 5000, due_at 2026-10-01"
            - "Claims CL1 (on R1/N1) and CL2 (on R2/N2) with return versions captured after each intake"
            - "Clock at 2026-11-01 (31 days past due); both notices PAID (interest 323 each)"
            - "CL1 scoped IN_SCOPE with PREPARER_ERROR by manager cm-A; CL2 scoped IN_SCOPE with CLIENT_DATA_ERROR by manager cm-A"
            - "Agent A1 (max_parallel 5); both claims ASSIGNED with window [2026-11-02, 2026-12-02) and POAs EXECUTED (claims in REPRESENTING)"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/escrows"
              payload: { office_id: "${off1}", funded_cents: 100000000 }
              as: ProgramAdmin
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "Pat Assoc", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client Two", email: "c2@example.com" }
              as: OfficeManager
              captures: { cli2: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_ITEMIZED", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli2}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_ITEMIZED", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ret2: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/returns/${ret2}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "PLUS" }
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret2}", tier: "PLUS" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "FEDERAL", notice_reference: "CP2000-1", tax_delta_cents: 38000, penalty_cents: 5000, issued_at: "2026-09-15T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "POST /tax/notices"
              payload: { return_id: "${ret2}", authority_type: "FEDERAL", notice_reference: "CP2000-2", tax_delta_cents: 38000, penalty_cents: 5000, issued_at: "2026-09-15T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n2: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "GET /tax/returns/${ret2}"
              as: CaseManager
              captures: { v2: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret2}", notice_id: "${n2}", expected_return_version: "${v2}" }
              as: CaseManager
              captures: { cl2: $.data.id }
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tax/notices/${n1}/pay"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/notices/${n2}/pay"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/claims/${cl2}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "CLIENT_DATA_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/agents"
              payload: { full_name: "Agent One", license_number: "EA-001", max_parallel: 5 }
              as: ProgramAdmin
              captures: { ag1: $.data.id }
            - call: "POST /tax/claims/${cl1}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-11-02T00:00:00Z", window_end: "2026-12-02T00:00:00Z" }
              as: CaseManager
            - call: "POST /tax/claims/${cl2}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-11-02T00:00:00Z", window_end: "2026-12-02T00:00:00Z" }
              as: CaseManager
            - call: "POST /tax/claims/${cl1}/poa"
              payload: { agent_id: "${ag1}", expires_at: "2027-06-01T00:00:00Z" }
              as: CaseManager
              captures: { poa1: $.data.id, poav1: $.data.version }
            - call: "POST /tax/claims/${cl2}/poa"
              payload: { agent_id: "${ag1}", expires_at: "2027-06-01T00:00:00Z" }
              as: CaseManager
              captures: { poa2: $.data.id, poav2: $.data.version }
            - call: "POST /tax/claims/${cl1}/poa/execute"
              payload: { expected_poa_version: "${poav1}" }
              as: CaseManager
            - call: "POST /tax/claims/${cl2}/poa/execute"
              payload: { expected_poa_version: "${poav2}" }
              as: CaseManager
          trigger:
            - call: "POST /tax/claims/${cl1}/resolve"
              payload: {}
              as: CaseManager
              as_user_id: "cm-B"
            - call: "POST /tax/claims/${cl2}/resolve"
              payload: {}
              as: CaseManager
              as_user_id: "cm-B"
          assert:
            - "Claim.${cl1}.payout_base_cents == 38000"
            - "Claim.${cl1}.payout_interest_cents == 323"
            - "Claim.${cl1}.payout_penalty_cents == 5000"
            - "Claim.${cl1}.payout_total_cents == 43323"
            - "Claim.${cl1}.final_liability_cents == 81323"
            - "Claim.${cl2}.payout_base_cents == 0"
            - "Claim.${cl2}.payout_interest_cents == 323"
            - "Claim.${cl2}.payout_penalty_cents == 0"
            - "Claim.${cl2}.payout_total_cents == 323"
            - "Claim.${cl2}.final_liability_cents == 323"
  - rule_id: combinatorial_formula
    instances:
      - name: fee_tiered_multiplier_modes
        grounds:
          - calculations.prep_fee_quote
          - calculations.prep_fee_quote.constants.TIER_MULTIPLIER
        distinguishing_aspect: |
          Mode (a) combinatorics: >= 3 inputs (component credits, tier multiplier,
          rounding unit) with non-linear interaction; ASSOCIATE (27500), SENIOR
          (34400), MASTER (41300), ENROLLED_AGENT (48100) for the same components.
        test_recipe:
          setup:
            - "Office O1; four preparers P-A/P-S/P-M/P-E at tiers ASSOCIATE/SENIOR/MASTER/ENROLLED_AGENT; clients C-A/C-S/C-M/C-E"
            - "Four returns R-A/R-S/R-M/R-E each with components [1040_SIMPLE, 1040_MULTI_STATE] (credits 27500)"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P A", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { pa: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P S", tier: "SENIOR" }
              as: OfficeManager
              captures: { ps: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P M", tier: "MASTER" }
              as: OfficeManager
              captures: { pm: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P E", tier: "ENROLLED_AGENT" }
              as: OfficeManager
              captures: { pe: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "C A", email: "ca@example.com" }
              as: OfficeManager
              captures: { ca: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "C S", email: "cs@example.com" }
              as: OfficeManager
              captures: { cs: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "C M", email: "cm@example.com" }
              as: OfficeManager
              captures: { cm: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "C E", email: "ce@example.com" }
              as: OfficeManager
              captures: { ce: $.data.id }
          trigger:
            - call: "POST /tax/returns"
              payload: { client_id: "${ca}", office_id: "${off1}", preparer_id: "${pa}", tax_year: 2025, components: ["1040_SIMPLE", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ra: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cs}", office_id: "${off1}", preparer_id: "${ps}", tax_year: 2025, components: ["1040_SIMPLE", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { rs: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cm}", office_id: "${off1}", preparer_id: "${pm}", tax_year: 2025, components: ["1040_SIMPLE", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { rm: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${ce}", office_id: "${off1}", preparer_id: "${pe}", tax_year: 2025, components: ["1040_SIMPLE", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { re: $.data.id }
          assert:
            - "TaxReturn.${ra}.quoted_fee_cents == 27500"
            - "TaxReturn.${rs}.quoted_fee_cents == 34400"
            - "TaxReturn.${rm}.quoted_fee_cents == 41300"
            - "TaxReturn.${re}.quoted_fee_cents == 48100"
      - name: interest_boundary_rounding
        grounds:
          - calculations.interest_accrual
          - state_machines.AuthorityNotice.OPEN_to_PAID
        distinguishing_aspect: |
          Mode (b) nested-rounding: the pinned rule computes the full float product and
          rounds ONCE. At tax_delta 38000 and 45 days the pinned rule gives 468 cents,
          while the forbidden round-per-day-then-multiply order gives 46.85 dollars.
          Boundary day counts 0 and 31 are pinned separately.
        test_recipe:
          setup:
            - "Office O1; preparer P1; client C1; FILED return R1 (components [1040_SIMPLE])"
            - "Three unlinked notices on R1: N0 (due 2026-10-01, tax_delta 38000), N1 (same, paid on due date), N45 (same)"
            - "Clock starts at 2026-09-01 default"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "Pat Assoc", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 38000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-2", tax_delta_cents: 38000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n45: $.data.id }
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /tax/notices/${n1}/pay"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tax/notices/${n45}/pay"
              payload: {}
              as: OfficeManager
          assert:
            - "AuthorityNotice.${n1}.interest_cents == 0 (paid on due date: days == 0)"
            - "AuthorityNotice.${n45}.interest_cents == 468 (45 days, round once on the full product)"
      - name: accrual_vs_payout_liability_fold
        grounds:
          - calculations.reimbursement_payout
          - calculations.escrow_accrual_expected
          - entities.OfficeEscrow.fields.expected_accrual_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: payout_total (base + interest + penalty) is
          computed first, then final_liability = payout_total + payout_base folds the
          base in twice (105425 vs payout 55425), and the escrow accrual = round_half_up(
          payout_total * 1.10) per claim (60968) — three distinct quantities from one
          resolution, all pinned as literals.
        test_recipe:
          setup:
            - "Office O1 with escrow funded 100000000; preparer P1; client C1"
            - "FILED return R1 (components [1040_ITEMIZED, 1040_MULTI_STATE]) with PLUS product (premium 19800)"
            - "Notice N1: FEDERAL, tax_delta 50000, penalty 5000, due 2026-10-01; claim CL1 opened, clock at 2026-11-01 (31 days, interest 424), N1 PAID"
            - "CL1 scoped IN_SCOPE PREPARER_ERROR by cm-A; assigned to agent A1 with POA executed (REPRESENTING)"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/escrows"
              payload: { office_id: "${off1}", funded_cents: 100000000 }
              as: ProgramAdmin
              captures: { esc1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "Pat Assoc", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_ITEMIZED", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "PLUS" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "FEDERAL", notice_reference: "CP2000-1", tax_delta_cents: 50000, penalty_cents: 5000, issued_at: "2026-09-15T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tax/notices/${n1}/pay"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/agents"
              payload: { full_name: "Agent One", license_number: "EA-001", max_parallel: 3 }
              as: ProgramAdmin
              captures: { ag1: $.data.id }
            - call: "POST /tax/claims/${cl1}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-11-02T00:00:00Z", window_end: "2026-12-02T00:00:00Z" }
              as: CaseManager
            - call: "POST /tax/claims/${cl1}/poa"
              payload: { agent_id: "${ag1}", expires_at: "2027-06-01T00:00:00Z" }
              as: CaseManager
              captures: { poa1: $.data.id, poav1: $.data.version }
            - call: "POST /tax/claims/${cl1}/poa/execute"
              payload: { expected_poa_version: "${poav1}" }
              as: CaseManager
          trigger:
            - call: "POST /tax/claims/${cl1}/resolve"
              payload: {}
              as: CaseManager
              as_user_id: "cm-B"
          assert:
            - "Claim.${cl1}.payout_total_cents == 55425"
            - "Claim.${cl1}.final_liability_cents == 105425"
            - "OfficeEscrow.${esc1}.paid_out_cents == 105425"
            - "OfficeEscrow.${esc1}.expected_accrual_cents == 60968"
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_info_loop_and_reopen_cycle
        grounds:
          - state_machines.Claim.TRIAGE_to_INFO_NEEDED
          - state_machines.Claim.INFO_NEEDED_to_TRIAGE
          - state_machines.Claim.RESOLVED_to_REOPENED
        distinguishing_aspect: |
          Claim is cyclic: TRIAGE -> INFO_NEEDED -> TRIAGE (info loop) and, after a
          full resolution, RESOLVED -> REOPENED -> SCOPE_CONFIRMED -> RESOLVED
          (reopen cycle), with escrow credited and re-debited across the cycle.
        test_recipe:
          setup:
            - "Office O1 with escrow 100000000; preparer P1; client C1; FILED return R1 ([1040_ITEMIZED, 1040_MULTI_STATE]) with PLUS product"
            - "Notice N1 (FEDERAL, tax_delta 50000, penalty 5000, due 2026-10-01); claim CL1 opened (TRIAGE), return version captured before intake"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/escrows"
              payload: { office_id: "${off1}", funded_cents: 100000000 }
              as: ProgramAdmin
              captures: { esc1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "Pat Assoc", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_ITEMIZED", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "PLUS" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "FEDERAL", notice_reference: "CP2000-1", tax_delta_cents: 50000, penalty_cents: 5000, issued_at: "2026-09-15T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /tax/claims/${cl1}/request-info"
