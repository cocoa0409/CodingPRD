      - name: enum_and_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_6
          - entities.Show.fields.competition_level
          - entities.CompetitionDivision.fields.discipline
          - entities.CompetitionDivision.fields.division_share_bp
          - entities.CompetitionDivision.fields.max_jump_height_cm
          - entities.Ring.fields.surface_type
          - entities.Official.fields.license_level
          - entities.Official.fields.license_roles
          - entities.ShowClass.fields.max_entries
        distinguishing_aspect: |
          Every declared enum, every numeric range and the inter-field constraint
          max_jump_height_cm >= min_jump_height_cm are checked at priority 6, ahead
          of any business rule. An implementation that stores unknown enum members
          verbatim, or that only clamps division_share_bp at write time, passes the
          happy path and fails all eight probes here.
        test_recipe:
          setup:
            - "One DRAFT show with one JUMPER division (share 3333) so the valid-reference paths resolve."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
