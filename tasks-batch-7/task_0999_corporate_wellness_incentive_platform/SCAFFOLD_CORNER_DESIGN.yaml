# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 0999 — Corporate Wellness Program & Incentive Platform
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections/claim_types follow
# references/claim-extraction-guide.md. `excluded_because` stubs mark corners
# already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml instances.
# Default logical clock (unset): 2026-05-01T00:00:00Z.
# Standard fixtures (same as §1.8): employer 120000/50000/10000/7500/k=5/
# kiosk=2/limit=5000; program 2026-01-01..2027-01-01, thresholds 500/1500/3000,
# awards 10000/30000/60000, cap 0.30, sessions 4.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: employer_creation_echoes_config
        claim_type: creation
        grounds: [entities.Employer]
        distinguishing_aspect: "POST /wellness/employers persists all eight config inputs verbatim and initializes version to 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /wellness/employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Employer.${emp_id}.name == Acme"
            - "Employer.${emp_id}.k_anonymity_threshold == 5"
            - "Employer.${emp_id}.kiosk_capacity == 2"
            - "Employer.${emp_id}.version == 1"

      - name: employee_create_missing_required_email_rejected
        claim_type: required_fields
        grounds: [entities.Employee.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field email yields ERR_INVALID_REQUEST (400); no Employee persisted."
        test_recipe:
          setup: ["employer exists"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", full_name: "No Email", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /wellness/employers/${emp_id}/employees afterwards returns total_count == 0"

      - name: enrollment_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Enrollment.fields.ra_eligible, entities.Enrollment.fields.points_balance_provisional]
        distinguishing_aspect: "Creating an enrollment without ra_eligible applies default false and initializes INVITED/PENDING with zero balances."
        test_recipe:
          setup: ["employer + DRAFT program + employee exist"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.ra_eligible == false"
            - "Enrollment.${enr_id}.participation_status == INVITED"
            - "Enrollment.${enr_id}.verification_status == PENDING"
            - "Enrollment.${enr_id}.points_balance_provisional == 0"
            - "Enrollment.${enr_id}.points_balance_settled == 0"
            - "Enrollment.${enr_id}.auto_referral_count == 0"

      - name: activity_event_points_granted_input_ignored
        claim_type: computed_fields
        grounds: [entities.ActivityEvent.fields.points_granted, calculations.activity_points_conversion]
        distinguishing_aspect: "Client-supplied points_granted is ignored; the server computes floor(100000/1000)=100."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + ACTIVE enrollment"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
          trigger:
            - call: "POST /wellness/activity-events"
              payload: { enrollment_id: "${enr_id}", device_source: "fitbit", external_event_id: "evt-1", activity_type: "STEPS", quantity: 100000, occurred_at: "2026-04-15T10:00:00Z", points_granted: 99999 }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { ev_id: $.data.id }
          assert:
            - "ActivityEvent.${ev_id}.points_granted == 100 (server-computed; client 99999 ignored)"

      - name: program_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", entities.WellnessProgram]
        distinguishing_aspect: "GET with a well-formed but nonexistent program UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wellness/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: challenge_publish_from_published_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Challenge.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second publish on an already-PUBLISHED challenge fails with ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["employer + ACTIVE program + PUBLISHED challenge"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/challenges"
              payload: { program_id: "${prog_id}", name: "Spring Steps", activity_type: "STEPS", goal_quantity: 100000, points_reward: 250, starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-06-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wellness/challenges/${ch_id}/publish"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /wellness/challenges/${ch_id}/publish"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminated_enrollment_reinstate_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Enrollment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal for the participation axis; reinstate from TERMINATED fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + enrollment TERMINATED"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/enrollments/${enr_id}/terminate"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /wellness/enrollments/${enr_id}/reinstate"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Enrollment.${enr_id}.participation_status == TERMINATED (unchanged)"

      - name: invoice_pay_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.VendorInvoice.APPROVED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pay requires APPROVED; paying a DRAFT invoice fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["employer + ACTIVE program + one ACTIVE enrollment + DRAFT invoice (never submitted)"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/vendor-invoices"
              payload: { program_id: "${prog_id}", vendor_name: "WellCo", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: VendorManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /wellness/vendor-invoices/${inv_id}/pay"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: referral_discharge_sessions_insufficient
        claim_type: precondition_enforcement
        grounds: [state_machines.CoachingReferral.ENGAGED_to_DISCHARGED, "errors[ERR_REFERRAL_SESSIONS_INSUFFICIENT]"]
        distinguishing_aspect: "Discharge with 1 of 4 required sessions fails with ERR_REFERRAL_SESSIONS_INSUFFICIENT; referral stays ENGAGED."
        test_recipe:
          setup: ["employer + ACTIVE program (coaching_required_sessions=4) + employee + ACTIVE enrollment + referral ENGAGED by coach-1 with 1 session logged"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/coaching-referrals"
              payload: { enrollment_id: "${enr_id}", reason: "HIGH_RISK" }
              as: BenefitsAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /wellness/coaching-referrals/${ref_id}/engage"
              payload: {}
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-02", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
          trigger:
            - call: "POST /wellness/coaching-referrals/${ref_id}/discharge"
              payload: { outcome: "GOALS_MET" }
              as: Coach
              as_user_id: "coach-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_SESSIONS_INSUFFICIENT"
            - "CoachingReferral.${ref_id}.status == ENGAGED (unchanged)"
            - "CoachingReferral.${ref_id}.sessions_completed == 1"

      - name: program_settle_with_open_awards_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WellnessProgram.CLOSED_to_SETTLED, "errors[ERR_PROGRAM_HAS_OPEN_AWARDS]"]
        distinguishing_aspect: "Settle is blocked while any award is not APPLIED; a CONFIRMED award yields ERR_PROGRAM_HAS_OPEN_AWARDS."
        test_recipe:
          setup: ["employer + program ACTIVE then CLOSED + employee + ACTIVE enrollment + award computed after close and CONFIRMED"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/programs/${prog_id}/close"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/incentive-awards/compute"
              payload: { program_id: "${prog_id}" }
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}/incentive-awards"
              payload: {}
              as: BenefitsAdmin
              captures: { aw_id: "$.data[0].id" }
            - call: "POST /wellness/incentive-awards/${aw_id}/confirm"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "POST /wellness/programs/${prog_id}/settle"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_HAS_OPEN_AWARDS"
            - "WellnessProgram.${prog_id}.status == CLOSED (unchanged)"

      - name: screening_no_show_on_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.BiometricScreening.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "Advancing the logical clock past slot_end flips a SCHEDULED screening to NO_SHOW via the system sweep."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + ACTIVE enrollment + screening SCHEDULED at HQ 2026-04-20T10:00-10:30"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/biometric-screenings"
              payload: { enrollment_id: "${enr_id}", clinic_location: "HQ", slot_start: "2026-04-20T10:00:00Z", slot_end: "2026-04-20T10:30:00Z" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wellness/enrollments/${enr_id}/biometric-screenings"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "BiometricScreening.${scr_id}.status == NO_SHOW"

      - name: challenge_clock_sweep_fails_incomplete_participation
        claim_type: side_effect_execution
        grounds: [state_machines.Challenge.ACTIVE_to_COMPLETED, state_machines.ChallengeParticipation.JOINED_to_FAILED]
        distinguishing_aspect: "Clock sweep past ends_at completes the challenge and resolves a JOINED participation with insufficient progress to FAILED; no BONUS entry is created and completed_count stays 0."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + ACTIVE enrollment; STEPS challenge goal 100000 window 2026-04-01..2026-04-30 PUBLISHED; participation JOINED; one in-window event of 50000 steps"]
          setup_api_calls:
