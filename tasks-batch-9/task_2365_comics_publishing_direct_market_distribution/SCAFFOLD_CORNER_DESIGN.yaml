  - name: priority_ordering_role_check_at_priority_2_beats_existence_at_priority_4
    claim_type: priority_ordering
    grounds: [validations.priority_2, validations.priority_4, 'errors[ERR_UNAUTHORIZED]', 'errors[ERR_TITLE_NOT_FOUND]']
    distinguishing_aspect: 'A ManagingEditor greenlighting a title id that does not exist gets 403 ERR_UNAUTHORIZED,
      not 404: the RBAC check at priority 2 short-circuits before path resolution at priority 4, so an
      unauthorised caller cannot probe which ids exist.'
    test_recipe:
      setup: [empty database, 'logical clock 2026-08-01T00:00:00Z']
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/titles/00000000-0000-0000-0000-000000000055/greenlight
        payload: {}
        as: ManagingEditor
        captures: {e1: $.data.error_id}
      - call: POST /comics/titles/00000000-0000-0000-0000-000000000055/greenlight
        payload: {}
        as: EditorInChief
        captures: {e2: $.data.error_id}
      assert: ['first trigger: status == 403 with error_id == ERR_UNAUTHORIZED (priority 2 before 4)',
        'second trigger: status == 404 with error_id == ERR_TITLE_NOT_FOUND, proving the id really is
          absent and that the first response was ordering, not existence', no Title row exists after either
          call]
  - name: priority_conflict_state_check_precedes_the_credit_check
    claim_type: priority_conflict
    grounds: [validations.priority_8, validations.priority_27, 'errors[ERR_INVALID_STATE]']
    excluded_because: {difficulty_instance: state_priority_8_beats_fiscal_priority_27_on_order_resubmit,
      rationale: 'That §1.8 instance builds an order that violates both the state rule and the credit
        rule and asserts ERR_INVALID_STATE, plus the mirror case where only the credit rule is violated.'}
