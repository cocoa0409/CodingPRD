scaffold_corner_design:
- section: entities
  instances:
  - name: seller_create_missing_required_field_rejected
    claim_type: required_fields
    grounds:
    - validations[priority=2]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: A seller creation omitting a required input is refused before persistence, so the required-field guard is the observable one.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z and no seller exists
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      trigger:
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb Bad
          country_code: US
        captures:
          e_missing: $.data.error_id
      assert:
      - the response error_id == ERR_INVALID_REQUEST with http 400
      - refurbishment_capacity_units is the missing required field
      - GET /v1/sellers reports total_count 0
  - name: device_listing_enum_type_constraint_rejected
    claim_type: type_constraints
    grounds:
    - validations[priority=2]
    - entities.DeviceListing.fields.cosmetic_grade
    distinguishing_aspect: An undeclared enum member is refused by the type constraint rather than by any state or business rule.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z, definition RB16-DEF ACTIVE, seller A approved
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB16-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB16-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB16-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb RB16A
          country_code: US
          refurbishment_capacity_units: 500
        captures:
          sid_A: $.data.id
      - call: POST /v1/sellers/${sid_A}/verify-documents
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers/${sid_A}/audit-records
        as: ComplianceReviewer
        payload:
          audit_scheduled_for: '2026-09-05T00:00:00Z'
          audit_scope_note: battery tear-down and screen swap
          declared_monthly_throughput: 400
        captures:
          aid_A: $.data.id
      - call: POST /v1/audit-records/${aid_A}/transition
        as: ComplianceReviewer
        payload:
          target_state: PASSED
          audit_score: 88
          auditor_user_id: op_auditor
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      - call: POST /v1/sellers/${sid_A}/listings
        as: Seller
        payload:
          model_code: APL-IP13-128
          imei: '890123456789011'
          cosmetic_grade: GOOD
          functional_grade: MINOR_FAULTS
          battery_health_pct: 88
          carrier_lock_status: UNLOCKED
          part_provenance: OEM_EQUIVALENT
          provenance_doc_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          list_price_cents: 150000
        as_user_id: ${sid_A}
        captures:
          lid_A: $.data.id
      - call: POST /v1/listings/${lid_A}/review
        as: ComplianceReviewer
        payload:
          decision: APPROVED
          reviewer_user_id: op_reviewer
        captures:
          res_A: $.data.servicing_reservation_id
      trigger:
      - call: POST /v1/sellers/${sid_A}/listings
        as: Seller
        payload:
          model_code: APL-IP13-128
          imei: '890123456789101'
          cosmetic_grade: PRISTINE
          functional_grade: MINOR_FAULTS
          battery_health_pct: 88
          carrier_lock_status: UNLOCKED
          part_provenance: OEM_ONLY
          list_price_cents: 150000
        as_user_id: ${sid_A}
        captures:
          e_enum: $.data.error_id
      assert:
      - the response error_id == ERR_INVALID_REQUEST with http 400
      - PRISTINE is not a member of {FLAWLESS, GOOD, FAIR, POOR}
      - no listing is created
  - name: seller_computed_tier_and_floor_ignore_input_values
    claim_type: computed_fields
    grounds:
    - entities.Seller.fields.performance_tier
    - entities.Seller.fields.exposure_floor_cents
    distinguishing_aspect: Seller.performance_tier and exposure_floor_cents are computed fields, so a create call that supplies them has the supplied values ignored.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z and no seller exists
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      trigger:
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb Injected
          country_code: US
          refurbishment_capacity_units: 500
        captures:
          sid_i: $.data.id
          tier_i: $.data.performance_tier
          floor_i: $.data.exposure_floor_cents
          onb_i: $.data.onboarding_state
          lsi_i: $.data.latest_score_id
      - call: POST /v1/sellers/${sid_i}/audit-records
        as: ComplianceReviewer
        payload:
          audit_scheduled_for: '2026-09-05T00:00:00Z'
          audit_scope_note: battery tear-down and screen swap
          declared_monthly_throughput: 400
        captures:
          aid_i: $.data.id
      - call: POST /v1/audit-records/${aid_i}/transition
        as: ComplianceReviewer
        payload:
          target_state: PASSED
          audit_score: 88
          auditor_user_id: op_auditor
        captures:
          onb2_i: $.data.audit_state
          ssv_i: $.data.seller_id
      assert:
      - Seller.${sid_i}.performance_tier == PROBATION, so the computed tier starts at the floor rather than at an injected value
      - Seller.${sid_i}.exposure_floor_cents == 0 for a freshly approved seller
      - Seller.${sid_i}.latest_score_id is null until a service-score section closes, so the computed foreign key is not settable by the client
      - Seller.${sid_i}.onboarding_state advances only through the declared transitions
  - name: seller_read_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - validations[priority=4]
    - errors[ERR_RESOURCE_NOT_FOUND]
    distinguishing_aspect: A read against a syntactically valid but absent seller id is refused by the existence guard.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z and no seller exists
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      trigger:
      - call: GET /v1/sellers/00000000-0000-4000-8000-000000000000
        as: PlatformAdmin
        captures:
          e_nf: $.data.error_id
      assert:
      - the response error_id == ERR_RESOURCE_NOT_FOUND with http 404
      - no seller row is created
  - name: trade_in_listing_pagination_envelope
    claim_type: listing
    grounds:
    - endpoints[GET /v1/trade-ins]
    - response_envelope.pagination_fields
    distinguishing_aspect: A list read carries the four pagination fields and honours limit and offset over a three-row collection.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z and three trade-in submissions exist
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/trade-ins
        as: Consumer
        payload:
          customer_ref: cust_pg1
          submitted_model_code: APL-IP13-128
          self_declared_cosmetic_grade: FLAWLESS
          self_declared_functional_grade: FULLY_FUNCTIONAL
          self_declared_battery_health_pct: 95
          self_declared_carrier_lock_status: UNLOCKED
        captures:
          pg1: $.data.id
          pq_pg1: $.data.provisional_quote_cents
          tv_pg1: $.data.version
      - call: POST /v1/trade-ins
        as: Consumer
        payload:
          customer_ref: cust_pg2
          submitted_model_code: APL-IP13-128
          self_declared_cosmetic_grade: FLAWLESS
          self_declared_functional_grade: FULLY_FUNCTIONAL
          self_declared_battery_health_pct: 95
          self_declared_carrier_lock_status: UNLOCKED
        captures:
          pg2: $.data.id
          pq_pg2: $.data.provisional_quote_cents
          tv_pg2: $.data.version
      - call: POST /v1/trade-ins
        as: Consumer
        payload:
          customer_ref: cust_pg3
          submitted_model_code: APL-IP13-128
          self_declared_cosmetic_grade: GOOD
          self_declared_functional_grade: MINOR_FAULTS
          self_declared_battery_health_pct: 90
          self_declared_carrier_lock_status: UNLOCKED
        captures:
          pg3: $.data.id
          pq_pg3: $.data.provisional_quote_cents
          tv_pg3: $.data.version
      trigger:
      - call: GET /v1/trade-ins?limit=2&offset=0
        as: PlatformAdmin
        captures:
          p1: $.data.0.id
          p2: $.data.1.id
      - call: GET /v1/trade-ins?limit=1&offset=1
        as: PlatformAdmin
        captures:
          o1: $.data.0.id
      assert:
      - the limit-2 read returns two rows and the pagination envelope carries total_count 3 with has_more true
      - the row returned at offset 1 differs from the row at offset 0
      - limit above the declared maximum of 100 is refused by the request guard
  - name: withdrawn_listing_releases_imei_uniqueness
    claim_type: immutability
    grounds:
    - state_machines.DeviceListing.DRAFT_to_WITHDRAWN
    - entities.DeviceListing.fields.imei
    distinguishing_aspect: A withdrawn listing is exempt from the imei uniqueness filter, so the same imei may be relisted afterwards through the re-submit loop.
    test_recipe:
      setup:
      - clock 2026-12-01T00:00:00Z, seller A approved with listing A WITHDRAWN after being delisted
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB17-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB17-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB17-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb RB17A
          country_code: US
          refurbishment_capacity_units: 500
        captures:
          sid_A: $.data.id
      - call: POST /v1/sellers/${sid_A}/verify-documents
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers/${sid_A}/audit-records
        as: ComplianceReviewer
        payload:
          audit_scheduled_for: '2026-09-05T00:00:00Z'
          audit_scope_note: battery tear-down and screen swap
          declared_monthly_throughput: 400
        captures:
          aid_A: $.data.id
      - call: POST /v1/audit-records/${aid_A}/transition
        as: ComplianceReviewer
        payload:
          target_state: PASSED
          audit_score: 88
          auditor_user_id: op_auditor
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      - call: POST /v1/sellers/${sid_A}/listings
        as: Seller
        payload:
          model_code: APL-IP13-128
          imei: '890123456789011'
          cosmetic_grade: GOOD
          functional_grade: MINOR_FAULTS
          battery_health_pct: 88
          carrier_lock_status: UNLOCKED
          part_provenance: OEM_EQUIVALENT
          provenance_doc_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          list_price_cents: 150000
        as_user_id: ${sid_A}
        captures:
          lid_A: $.data.id
      - call: POST /v1/listings/${lid_A}/review
        as: ComplianceReviewer
        payload:
          decision: APPROVED
          reviewer_user_id: op_reviewer
        captures:
          res_A: $.data.servicing_reservation_id
      - call: POST /v1/listings/${lid_A}/withdraw
        as: Seller
        payload:
          withdrawal_reason: seller requested removal
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      trigger:
      - call: POST /v1/listings/${lid_A}/submit
        as: Seller
        payload:
          expected_seller_version: ${vv_A}
        captures:
          st_w: $.data.listing_state
      assert:
      - DeviceListing.${lid_A}.listing_state == UNDER_REVIEW after re-submission from WITHDRAWN
      - the WITHDRAWN row no longer blocks its own imei, so the re-submit is admitted
      - the returned listing carries the same imei 890123456789011
- section: state_machines
  instances:
  - name: listing_withdraw_from_listed_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.DeviceListing.LISTED_to_DELISTED
    - endpoints[POST /v1/listings/{id}/withdraw]
    distinguishing_aspect: WITHDRAWN is reachable only from DRAFT, UNDER_REVIEW or DELISTED, so a withdraw attempted on a LISTED row is refused on the state ground.
    test_recipe:
      setup:
      - clock 2026-12-01T00:00:00Z, seller A approved with listing A LISTED
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB18-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB18-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB18-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers
        as: PlatformAdmin
        payload:
          legal_name: Refurb RB18A
          country_code: US
          refurbishment_capacity_units: 500
        captures:
          sid_A: $.data.id
      - call: POST /v1/sellers/${sid_A}/verify-documents
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers/${sid_A}/audit-records
        as: ComplianceReviewer
        payload:
          audit_scheduled_for: '2026-09-05T00:00:00Z'
          audit_scope_note: battery tear-down and screen swap
          declared_monthly_throughput: 400
        captures:
          aid_A: $.data.id
      - call: POST /v1/audit-records/${aid_A}/transition
        as: ComplianceReviewer
        payload:
          target_state: PASSED
          audit_score: 88
          auditor_user_id: op_auditor
      - call: GET /v1/sellers/${sid_A}
        as: PlatformAdmin
        captures:
          vv_A: $.data.version
      - call: POST /v1/sellers/${sid_A}/listings
        as: Seller
        payload:
          model_code: APL-IP13-128
          imei: '890123456789011'
          cosmetic_grade: GOOD
          functional_grade: MINOR_FAULTS
          battery_health_pct: 88
          carrier_lock_status: UNLOCKED
          part_provenance: OEM_EQUIVALENT
          provenance_doc_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          list_price_cents: 150000
        as_user_id: ${sid_A}
        captures:
          lid_A: $.data.id
      - call: POST /v1/listings/${lid_A}/review
        as: ComplianceReviewer
        payload:
          decision: APPROVED
          reviewer_user_id: op_reviewer
        captures:
          res_A: $.data.servicing_reservation_id
      trigger:
      - call: POST /v1/listings/${lid_A}/withdraw
        as: Seller
        payload:
          withdrawal_reason: seller requested removal
        captures:
          e_wd: $.data.error_id
      assert:
      - the response error_id == ERR_INVALID_STATE with http 409
      - DeviceListing.${lid_A}.listing_state stays LISTED
      - the listing's servicing reservation is untouched
  - name: grading_definition_retire_requires_clock_past_effective_from
    claim_type: precondition_enforcement
    grounds:
    - state_machines.GradingDefinition.ACTIVE_to_RETIRED
    - entities.GradingDefinition.fields.effective_from
    distinguishing_aspect: Retirement is admissible only once the logical clock has reached effective_from, so a definition effective in the future cannot be retired early.
    test_recipe:
      setup:
      - clock 2026-09-02T00:00:00Z and definition RB19-DEF ACTIVE with effective_from 2027-01-01
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB19-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2027-01-01T00:00:00Z'
        captures:
          d_future: $.data.id
      - call: POST /v1/grading-definitions/${d_future}/activate
        as: ComplianceReviewer
        payload: {}
      trigger:
      - call: POST /v1/grading-definitions/${d_future}/retire
        as: ComplianceReviewer
        payload:
          retirement_note: too early
        captures:
          e_early: $.data.error_id
      assert:
      - the response error_id == ERR_INVALID_STATE with http 409
      - GET /v1/grading-definitions/${d_future} still reports definition_state == ACTIVE
      - the clock at 2026-09-02T00:00:00Z is earlier than effective_from
  - name: grading_definition_retire_then_reinstate_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.GradingDefinition.ACTIVE_to_RETIRED
    - state_machines.GradingDefinition.RETIRED_to_ACTIVE
    distinguishing_aspect: The cyclic reinstatement edge is exercisable once the clock is past effective_from, proving the RETIRED to ACTIVE reverse edge exists.
    test_recipe:
      setup:
      - clock 2026-12-01T00:00:00Z and definition RB20-DEF ACTIVE with effective_from 2026-08-01
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB20-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 79
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB20-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB20-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      trigger:
      - call: POST /v1/grading-definitions/${def_RB20-DEF}/retire
        as: ComplianceReviewer
        payload:
          retirement_note: seasonal rotation
        captures:
          r19: $.data.definition_state
      - call: POST /v1/grading-definitions/${def_RB20-DEF}/reinstate
        as: ComplianceReviewer
        payload: {}
        captures:
          r20: $.data.definition_state
          ro20: $.data.retired_on
      assert:
      - the retire call returns definition_state RETIRED
      - the reinstate call returns definition_state ACTIVE
      - the reinstated definition carries retired_on null, so the cycle is complete
  - name: trade_in_second_revision_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.TradeInSubmission.PRICE_REVISED_to_INSPECTED
    - validations[priority=17]
    distinguishing_aspect: The one-free-revision rule bounds the revision cycle, so a second revision attempt on the same submission is refused.
    test_recipe:
      setup:
      - clock 2026-12-01T00:00:00Z, one submission already revised once
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
      - call: POST /v1/trade-ins
        as: Consumer
        payload:
          customer_ref: cust_rev1
          submitted_model_code: APL-IP13-128
          self_declared_cosmetic_grade: GOOD
          self_declared_functional_grade: MINOR_FAULTS
          self_declared_battery_health_pct: 90
          self_declared_carrier_lock_status: UNLOCKED
        captures:
          rev1: $.data.id
          pq_rev1: $.data.provisional_quote_cents
          tv_rev1: $.data.version
      - call: POST /v1/trade-ins/${rev1}/inspection
        as: TradeInInspector
        payload:
          inspected_cosmetic_grade: FAIR
          inspected_functional_grade: MINOR_FAULTS
          inspected_battery_health_pct: 82
          inspected_carrier_lock_status: UNLOCKED
      - call: POST /v1/trade-ins/${rev1}/inspection-revision
        as: TradeInInspector
        payload: {}
        captures:
          fq_rev1: $.data.final_quote_cents
          rev_rev1: $.data.revision_count
      trigger:
      - call: POST /v1/trade-ins/${rev1}/inspection-revision
        as: TradeInInspector
        payload: {}
        captures:
          e_rev: $.data.error_id
      assert:
      - the response error_id == ERR_REVISION_LIMIT_REACHED with http 409
      - TradeInSubmission.${rev1}.revision_count stays 1
      - TradeInSubmission.${rev1}.submission_state stays PRICE_REVISED
  - name: warranty_claim_terminal_state_locked
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.WarrantyClaim.terminal_states
    - validations[priority=18]
    distinguishing_aspect: RESOLVED is terminal, so an evidence submission attempted after routing is refused on the terminal ground.
    test_recipe:
      setup:
      - clock 2026-12-01T00:00:00Z, seller A approved with one claim already RESOLVED
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        as: PlatformAdmin
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
      - call: POST /v1/grading-definitions
        as: ComplianceReviewer
        payload:
          definition_code: RB21-DEF
          cosmetic_thresholds:
            FLAWLESS: 97
            GOOD: 90
            FAIR: 75
            POOR: 50
          functional_thresholds:
            FULLY_FUNCTIONAL: 95
            MINOR_FAULTS: 80
            MAJOR_FAULTS: 60
          battery_floor_pct: 80
          effective_from: '2026-08-01T00:00:00Z'
        captures:
          def_RB21-DEF: $.data.id
      - call: POST /v1/grading-definitions/${def_RB21-DEF}/activate
        as: ComplianceReviewer
        payload: {}
      - call: POST /v1/sellers
