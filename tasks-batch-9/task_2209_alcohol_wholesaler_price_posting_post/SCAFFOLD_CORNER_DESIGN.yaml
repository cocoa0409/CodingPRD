            - "The immediately following GET /wholesalers/${whA} shows assessed_penalty_cents == 4000 and penalty_exposure_cents == 4000, with late_filing_penalty_accrued_cents == 0, correction_penalty_accrued_cents == 0 and frivolous_amendment_penalty_accrued_cents == 0."
