              captures: { v_cs: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_cs}", security_id: "${sec_cs}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_cs}" }
              as: AccountHolder
