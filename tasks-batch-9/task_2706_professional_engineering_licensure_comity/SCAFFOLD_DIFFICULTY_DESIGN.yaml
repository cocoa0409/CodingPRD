            - "ExperienceRecord.${er_t2}.raw_months == 1"
            - "ExperienceRecord.${er_t2}.credited_months == 1"
            - "trigger[5] response.data.verified_experience_months == 48"
            - "trigger[6] http_status == 201"
            - "trigger[6] response.data.status == \"APPROVED_TO_SIT\""
            - "trigger[6] response.data.attempt_number == 1"
            - "trigger[6] response.data.authorization_expires_at == \"2027-08-01T00:00:00.000Z\""
            - "Application.${app_tomas}.status == EXAM_APPROVED"
            - "Application.${app_tomas}.verified_experience_months == 48"
            - "Application.${app_tomas}.fee_assessment_cents == 30000"
