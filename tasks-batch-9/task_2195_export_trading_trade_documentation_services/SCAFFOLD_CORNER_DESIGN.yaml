      - name: corner_occ_booking_stale_sailing_after_a_cancel_released_capacity
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.booking-stale-sailing
          - errors[ERR_STALE_SAILING_VERSION]
          - endpoints.POST /freight-bookings/{booking_id}/cancel
          - calculations.sailing_capacity_ledger
        distinguishing_aspect: "Capacity is the shared resource, so the sailing's version moves under the client twice — once when the first booking charges 1200.000 kg and once when the cancel releases it — leaving the client's original read two writes stale even though the free capacity happens to be identical again. The cancel also returns the order to COMPLIANCE_CLEARED, which is what makes a re-book legal and isolates priority 13 from priority 11 and priority 31."
        test_recipe:
          setup:
            - "one compliance-cleared order, one sailing of capacity 2000.000 kg, gross weight 1200.000 kg"
            - "the client keeps the version it read at sailing creation and never refreshes until told to"
