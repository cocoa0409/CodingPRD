            - call: "POST /circulation/audit-findings"
              payload: { engagement_id: "${eng_id}", subscriber_id: "${sub_big_id}", finding_type: "UNSUPPORTED_QUALIFICATION", severity: "CRITICAL", affected_copies: 500 }
              as: CirculationAuditor
