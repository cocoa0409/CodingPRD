              as: Registrar
              captures: { err: $.data.error_id }
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-12", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-12T17:00:00Z", testing_ends_at: "2026-10-15T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win3_id: $.data.id }
          assert:
            - "${err} == ERR_WINDOW_SCHEDULE_CONFLICT ([2026-10-12T12:00, 2026-10-14T17:00) intersects [2026-10-10T09:00, 2026-10-12T17:00))"
            - "adjacent window created: ${win3_id} is a non-null id (start == W1 end is allowed under half-open semantics)"
      - name: course_booking_same_day_conflict
        grounds:
          - validations[priority=11]
          - errors[ERR_SESSION_SAME_DAY_CONFLICT]
          - state_machines.CourseAttendance.creation
