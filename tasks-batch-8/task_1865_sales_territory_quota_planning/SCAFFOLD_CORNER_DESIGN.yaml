            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments/${asg}/end", payload: { effective_to: "2027-06-30" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/rep-assignments/${asg}/end", payload: { effective_to: "2027-06-30" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First end: RepAssignment.${asg}.status == ENDED, effective_to == 2027-06-30"
            - "Second end: ${err} == ERR_INVALID_STATE_TRANSITION (HTTP 409)"

      - name: dispute_upheld_branch_side_effects
        claim_type: side_effect_execution
        grounds: ["state_machines.OwnershipDispute.UNDER_REVIEW_to_RESOLVED_UPHELD"]
        excluded_because:
          difficulty_instance: dispute_fork_divergent_side_effects
          rationale: "UPHELD reassignment and OVERRULED no-op are asserted as the divergent fork arms of the named §1.8 instance."

      - name: change_request_cycle_traversal
        claim_type: valid_transition
        grounds: ["state_machines.TerritoryChangeRequest.APPROVED_to_PENDING"]
        excluded_because:
          difficulty_instance: change_request_approve_return_cycle
          rationale: "The PENDING-APPROVED-PENDING-APPROVED-APPLIED cycle including decided_by clearing is asserted in the named §1.8 instance."

      - name: allocation_supersede_side_effect
        claim_type: side_effect_execution
        grounds: ["state_machines.TopDownAllocation.APPLIED_to_SUPERSEDED"]
        excluded_because:
          difficulty_instance: allocation_pool_conservation_on_reapply
          rationale: "Supersede of the prior APPLIED run and quota conservation are asserted in the named §1.8 instance."

  - section: calculations
    instances:
      - name: allocation_zero_weight_equal_split
        claim_type: correct_result
        grounds: ["calculations.allocation_largest_remainder"]
        distinguishing_aspect: "Total potential W == 0 falls back to an equal split: pool 100000 over three zero-potential children lands 33334 on the earliest-created child and 33333 on the other two (remainder cents by created_at ASC)."
        test_recipe:
          setup: ["Plan OPEN; root R with ACTIVE children A, B, C created in that order, all potential 0"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "A", potential_cents: 0, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { ta: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "B", potential_cents: 0, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tb: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "C", potential_cents: 0, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tc: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ta}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tc}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
          assert:
            - "Territory.${ta}.assigned_quota_cents == 33334 (floor(100000/3) == 33333 plus the single remainder cent to earliest created_at)"
            - "Territory.${tb}.assigned_quota_cents == 33333 and Territory.${tc}.assigned_quota_cents == 33333"
            - "Sum of the three shares == 100000"

      - name: allocation_leaf_scope_lands_full_pool
        claim_type: correct_result
        grounds: ["calculations.allocation_largest_remainder", "entities.TopDownAllocation.fields.results"]
        distinguishing_aspect: "Applying to a scope with zero ACTIVE children is legal: the scope retains the entire pool and results is an empty array."
        test_recipe:
          setup: ["Plan OPEN; single ACTIVE leaf territory T (no children); DRAFT allocation on T with pool 100000 (== company target)"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
          assert:
            - "Territory.${t}.assigned_quota_cents == 100000 (leaf landing, not an error)"
            - "TopDownAllocation.${al}.results == [] (empty array) and status == APPLIED"

      - name: booking_split_remainder_to_earliest_assignment
        claim_type: precision
        grounds: ["calculations.credit_split_at_booking"]
        distinguishing_aspect: "99999 cents over two eligible reps splits 50000/49999 with the remainder cent going to the assignment with the earlier created_at, not the earlier rep id."
        test_recipe:
          setup: ["Plan COMMUNICATED; leaf T with reps R1 (assignment created first) and R2 ACTIVE; account A assigned to T; clock 2027-06-05"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R1", email: "r1@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r1: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R2", email: "r2@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r2: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r1}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { a1: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r2}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { a2: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${t}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "SMB", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 99999, booking_date: "2027-06-05" }, as: SalesOpsAdmin }
          assert:
            - "Exactly two BOOKING events created: 50000 credited to ${r1} (earlier assignment ${a1} created_at) and 49999 to ${r2}"
            - "RepAssignment.${a1}.attainment_cents == 50000 and RepAssignment.${a2}.attainment_cents == 49999; sum == 99999"

      - name: ramp_day15_hire_boundary
        claim_type: constants_applied
        grounds: ["calculations.ramp_quota"]
        distinguishing_aspect: "RAMP_DAY_CUTOFF 15: a rep hired 2027-03-15 counts March as tenure month 1 (ramped 75000 on base 120000) while 2027-03-16 pushes month 1 to April (ramped 65000) — identical except for the hire day."
        test_recipe:
          setup: ["Plan OPEN; root R pool 240000 split evenly to leaf children T15 and T16 (120000 each); ramp schedule [0, .25, .5, .75, 1 x8]; rep R15 hired 2027-03-15 assigned to T15, rep R16 hired 2027-03-16 assigned to T16"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 240000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T15", potential_cents: 1, headcount_capacity: 2, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { t15: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T16", potential_cents: 1, headcount_capacity: 2, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { t16: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${t15}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${t16}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 240000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/ramp-schedules", payload: { name: "Std", multipliers: [0.00, 0.25, 0.50, 0.75, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00] }, as: SalesOpsAdmin, captures: { ramp: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R15", email: "r15@x.com", hire_date: "2027-03-15" }, as: SalesOpsAdmin, captures: { r15: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R16", email: "r16@x.com", hire_date: "2027-03-16" }, as: SalesOpsAdmin, captures: { r16: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r15}", territory_id: "${t15}", effective_from: "2027-01-01", ramp_schedule_id: "${ramp}" }, as: SalesOpsAdmin, captures: { a15: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r16}", territory_id: "${t16}", effective_from: "2027-01-01", ramp_schedule_id: "${ramp}" }, as: SalesOpsAdmin, captures: { a16: $.data.id } }
          assert:
            - "RepAssignment.${a15}.base_quota_cents == 120000 and ramped_quota_cents == 75000 (March counts: 0+2500+5000+7500+6x10000)"
            - "RepAssignment.${a16}.base_quota_cents == 120000 and ramped_quota_cents == 65000 (March is month 0: 0+0+2500+5000+7500+5x10000)"

      - name: ramp_tenure_beyond_schedule_is_fully_ramped
        claim_type: correct_result
        grounds: ["calculations.ramp_quota"]
        distinguishing_aspect: "Tenure index >= 13 maps to multiplier 1.00: a rep hired 2025-03-10 ramps to the full 120000 (12 x 10000) even with a ramp schedule attached."
