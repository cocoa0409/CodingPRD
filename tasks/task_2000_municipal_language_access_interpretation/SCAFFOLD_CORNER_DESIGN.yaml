          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (HTTP 403); GET /departments total_count still 1"

      - name: liaison_cannot_act_for_other_department
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "Ownership scope: liaison of deptA creating a request against deptB's id -> 403 ERR_FORBIDDEN_ROLE even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["Departments A and B exist"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept A", service_area_code: "SA-C34", annual_budget_cents: 100000 }
