            - "${auth} == 1000000, ${comm} == 0, ${disb} == 9000 and ${avail} == 941000  # 1000000 - 50000 reserve floor - 9000 spent"
            - "${auth} == ${avail} + ${comm} + ${disb} + 50000  # the reserve floor is the only wedge in the identity"
            - "${w7_count} == 2 and ${w7_area} == 9000 and ${w7_conveyed} == 0 and ${w7_cure} == 0"
            - "${w7_auth} == 1000000 and ${w7_disb} == 9000  # the ledger totals are authority-wide and ignore situs_ward"

      - name: packet_creation_links_property_and_funding_source_both_ways
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /land-bank/acquisition-packets]
          - validations[priority=45]
          - errors.ERR_FUNDING_SOURCE_NOT_FOUND
        distinguishing_aspect: "A packet is a cross-reference between a Property and a FundingSource, and both sides must resolve: an unknown funding_source_id is 404 ERR_FUNDING_SOURCE_NOT_FOUND even though the property is real, and once the link is created the same packet is reachable from a property_id query and from a funding_source_id query."
        test_recipe:
          setup:
            - "One real parcel and one real source."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Link Line", source_type: "GRANT", authorized_cents: 900000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203240", address: "3240 Zelkova Ln", situs_ward: 5, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "00000000-0000-4000-8000-0000000000f1", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Zelkova Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { err_fk: $.data.error_id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Zelkova Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "GET /land-bank/acquisition-packets?property_id=${p_id}"
              payload: { property_id: "${p_id}" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { by_property: "$.data[0].id", by_property_total: $.meta.total_count }
            - call: "GET /land-bank/acquisition-packets?funding_source_id=${fs_id}"
              payload: { funding_source_id: "${fs_id}" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { by_source: "$.data[0].id", by_source_total: $.meta.total_count }
          assert:
            - "HTTP 404 and ${err_fk} == ERR_FUNDING_SOURCE_NOT_FOUND  # body foreign keys are resolved at priority 45"
            - "HTTP 201 for the second attempt; exactly one AcquisitionPacket exists"
            - "${by_property} == ${pk_id} and ${by_property_total} == 1"
            - "${by_source} == ${pk_id} and ${by_source_total} == 1  # the same row is reachable from either endpoint of the link"

      - name: nested_collections_list_oldest_first_with_status_filters
        claim_type: standard_crud
        grounds:
          - endpoints[GET /land-bank/properties/{id}/title-actions]
          - endpoints[GET /land-bank/funding-sources/{id}/demolition-runs]
        distinguishing_aspect: "Two nested collections are ordered by their own sequence rather than by id: the parcel's title actions come back oldest first with round_no 1 then 2 and a status filter isolates the second, and a source's demolition runs come back in run_sequence order with a status filter isolating the PLANNED one."
        test_recipe:
          setup:
            - "One ACQUIRED parcel that has been through two title rounds: round 1 adjudicated DEFECT_REMAINS, round 2 adjudicated CLEARED."
            - "One DEMOLITION_ONLY source authorized 1000000 (available 950000) carrying two PLANNED runs on ward 41, a ward with no eligible parcels, so both runs stay PLANNED with run_sequence 1 and 2."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Nested List Acquisition Line", source_type: "GENERAL_FUND", authorized_cents: 900000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_acq_id: $.data.id }
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Nested List Demolition Line", source_type: "GRANT", authorized_cents: 1000000, restriction: "DEMOLITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_dem_id: $.data.id, fs_dem_v1: $.data.version }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203250", address: "3250 Alder Row", situs_ward: 9, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_acq_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Alder Row Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-780" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4980-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "QUIET_TITLE_SUIT" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta1_id: $.data.id, ta1_round: $.data.round_no }
            - call: "POST /land-bank/title-actions/${ta1_id}/adjudicate"
              payload: { outcome: "DEFECT_REMAINS", defect_count: 2 }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "LIEN_RELEASE" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta2_id: $.data.id, ta2_round: $.data.round_no }
            - call: "POST /land-bank/title-actions/${ta2_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_dem_id}", budget_cents: 400000, situs_ward_filter: 41, expected_funding_source_version: "${fs_dem_v1}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { run1_id: $.data.id, run1_seq: $.data.run_sequence }
            - call: "GET /land-bank/funding-sources/${fs_dem_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { fs_dem_v2: $.data.version }
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_dem_id}", budget_cents: 300000, situs_ward_filter: 41, expected_funding_source_version: "${fs_dem_v2}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { run2_id: $.data.id, run2_seq: $.data.run_sequence }
          trigger:
            - call: "GET /land-bank/properties/${p_id}/title-actions"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { ta_first: "$.data[0].id", ta_first_round: "$.data[0].round_no", ta_total: $.meta.total_count }
            - call: "GET /land-bank/properties/${p_id}/title-actions?status=CLEARED"
              payload: { status: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta_cleared: "$.data[0].id", ta_cleared_total: $.meta.total_count }
            - call: "GET /land-bank/funding-sources/${fs_dem_id}/demolition-runs"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { run_first: "$.data[0].id", run_first_seq: "$.data[0].run_sequence", run_total: $.meta.total_count }
            - call: "GET /land-bank/funding-sources/${fs_dem_id}/demolition-runs?status=PLANNED&limit=1&offset=1"
              payload: { status: "PLANNED", limit: 1, offset: 1 }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { run_page: "$.data[0].id", run_page_total: $.meta.total_count, run_page_more: $.meta.has_more }
          assert:
            - "${ta1_round} == 1 and ${ta2_round} == 2  # round_no is the prior action count plus one"
            - "${ta_first} == ${ta1_id} and ${ta_first_round} == 1 and ${ta_total} == 2  # oldest first"
            - "${ta_cleared} == ${ta2_id} and ${ta_cleared_total} == 1  # the DEFECT_REMAINS row is filtered out"
            - "${run1_seq} == 1 and ${run2_seq} == 2"
            - "${run_first} == ${run1_id} and ${run_first_seq} == 1 and ${run_total} == 2"
            - "${run_page} == ${run2_id} and ${run_page_total} == 2 and ${run_page_more} == false  # offset 1 of 2 is the last page"

      - name: order_completion_action_endpoint_applies_every_side_effect
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /land-bank/maintenance-orders/{id}/complete]
        excluded_because:
          difficulty_instance: funds_conserved_across_order_cancellation
          rationale: "Both halves of the completion action - the SCHEDULED->COMPLETED transition with its parcel stamp and the estimate-release / actual-disbursement ledger move - are already asserted end to end by the §1.8 compensating-invariant instance and by the secure-order side-effect instance in this file's state_machines section."

      - name: demolition_run_execute_is_a_skip_over_bulk_action
        claim_type: bulk_action
        grounds:
          - endpoints[POST /land-bank/demolition-runs/{id}/execute]
          - calculations.demolition_run_allocation
        excluded_because:
          difficulty_instance: demolition_run_execute_depth_four_funding_cascade
          rationale: "Partial-success semantics for the run (selected parcels get orders, unaffordable parcels are skipped rather than aborting the run, and the admin fee is committed once) is the §1.8 transitive-cascade fixture; the VOID branch when every candidate is dropped is covered separately in this file's state_machines section."

      - name: listing_is_a_conditional_action_on_title_and_demolition_state
        claim_type: conditional_action
        grounds:
          - endpoints[POST /land-bank/properties/{id}/list]
          - validations[priority=63]
          - validations[priority=66]
        excluded_because:
          difficulty_instance: recommend_blocked_by_conveyed_property_custody
          rationale: "The conditional-action claim for listing - permitted only when title_status is CLEAR and no DEMOLITION order is still SCHEDULED - is asserted by listing_with_clouded_title_rejected and listing_blocked_while_demolition_order_scheduled in this file, and the cross-entity gating pattern itself is the §1.8 cross-entity-state-dependency instance."

  # ===========================================================================
  - section: errors
    instances:
      - name: unknown_path_resource_not_found_family_returns_resource_specific_ids
        claim_type: every_error_triggerable
        grounds:
          - validations[priority=40]
          - errors.ERR_PACKET_NOT_FOUND
          - errors.ERR_TITLE_ACTION_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_RUN_NOT_FOUND
          - errors.ERR_APPLICATION_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_APPLICANT_NOT_FOUND
          - errors.ERR_FUNDING_SOURCE_NOT_FOUND
        distinguishing_aspect: "Every path resource names itself when it is missing: eight well-formed but unknown UUIDs on eight different resources produce eight distinct 404 ids rather than one generic ERR_NOT_FOUND, and the two action endpoints among them (adjudicate, execute) resolve the path before looking at the body or the state."
        test_recipe:
          setup:
            - "An empty store; no fixture is needed because every call targets a well-formed UUID that was never minted."
          setup_api_calls: []
          trigger:
            - call: "GET /land-bank/acquisition-packets/00000000-0000-4000-8000-0000000000a1"
              payload: {}
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { e_packet: $.data.error_id }
            - call: "POST /land-bank/title-actions/00000000-0000-4000-8000-0000000000a2/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { e_title: $.data.error_id }
            - call: "GET /land-bank/maintenance-orders/00000000-0000-4000-8000-0000000000a3"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { e_order: $.data.error_id }
            - call: "POST /land-bank/demolition-runs/00000000-0000-4000-8000-0000000000a4/execute"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { e_run: $.data.error_id }
            - call: "GET /land-bank/disposition-applications/00000000-0000-4000-8000-0000000000a5"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { e_app: $.data.error_id }
            - call: "GET /land-bank/development-agreements/00000000-0000-4000-8000-0000000000a6"
              payload: {}
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { e_agreement: $.data.error_id }
            - call: "GET /land-bank/applicants/00000000-0000-4000-8000-0000000000a7"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { e_applicant: $.data.error_id }
            - call: "GET /land-bank/funding-sources/00000000-0000-4000-8000-0000000000a8"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { e_source: $.data.error_id }
          assert:
            - "all eight responses are HTTP 404"
            - "${e_packet} == ERR_PACKET_NOT_FOUND and ${e_title} == ERR_TITLE_ACTION_NOT_FOUND"
            - "${e_order} == ERR_ORDER_NOT_FOUND and ${e_run} == ERR_RUN_NOT_FOUND"
            - "${e_app} == ERR_APPLICATION_NOT_FOUND and ${e_agreement} == ERR_AGREEMENT_NOT_FOUND"
            - "${e_applicant} == ERR_APPLICANT_NOT_FOUND and ${e_source} == ERR_FUNDING_SOURCE_NOT_FOUND"
            - "no rows of any kind were created by these calls"

      - name: unknown_path_resource_outranks_unknown_body_foreign_key_rejected
        claim_type: every_error_triggerable
        grounds:
          - validations[priority=40]
          - validations[priority=45]
          - errors.ERR_PROPERTY_NOT_FOUND
          - errors.ERR_CONTRACTOR_NOT_FOUND
        distinguishing_aspect: "One request carries two dangling references - an unknown property in the path and an unknown contractor in the body - and the ladder answers with the path resource (ERR_PROPERTY_NOT_FOUND at priority 40); repairing only the path then surfaces ERR_CONTRACTOR_NOT_FOUND from priority 45, which proves the two checks are separate stages rather than one merged lookup."
        test_recipe:
          setup:
            - "One ACQUIRED parcel and one ANY funding source; no contractor with the referenced id exists."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "FK Order Line", source_type: "GRANT", authorized_cents: 900000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203260", address: "3260 Basswood Ln", situs_ward: 5, lot_area_sqft: 10000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Basswood Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-790" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4990-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /land-bank/properties/00000000-0000-4000-8000-0000000000b1/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "00000000-0000-4000-8000-0000000000b2", funding_source_id: "${fs_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { e_path: $.data.error_id }
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "MOW", contractor_id: "00000000-0000-4000-8000-0000000000b2", funding_source_id: "${fs_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-06T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { e_body: $.data.error_id }
          assert:
            - "HTTP 404 and ${e_path} == ERR_PROPERTY_NOT_FOUND  # the path wins even though the body is also dangling"
            - "HTTP 404 and ${e_body} == ERR_CONTRACTOR_NOT_FOUND"
            - "no MaintenanceOrder exists and FundingSource.${fs_id}.committed_cents == 0"

      - name: missing_auth_headers_and_unknown_role_rejected
        claim_type: every_error_triggerable
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is the very first rung: a missing X-User-ID, a missing X-User-Role and a syntactically valid but undeclared role such as CountyAuditor are all 401 ERR_UNAUTHENTICATED - never 403 ERR_ROLE_NOT_PERMITTED - and the check runs before the body is parsed, so an otherwise perfect parcel registration is still refused."
        test_recipe:
          setup:
            - "An empty store; the payload itself is a valid parcel registration in all three attempts."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203270", address: "3270 Catalpa Ln", situs_ward: 5, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "__omit_x_user_id_header__"
              captures: { e_no_id: $.data.error_id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203270", address: "3270 Catalpa Ln", situs_ward: 5, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: "__omit_x_user_role_header__"
              as_user_id: "intake-1"
              captures: { e_no_role: $.data.error_id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203270", address: "3270 Catalpa Ln", situs_ward: 5, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: "CountyAuditor"
              as_user_id: "auditor-1"
              captures: { e_bad_role: $.data.error_id }
          assert:
            - "all three responses are HTTP 401"
            - "${e_no_id} == ERR_UNAUTHENTICATED and ${e_no_role} == ERR_UNAUTHENTICATED and ${e_bad_role} == ERR_UNAUTHENTICATED"
            - "no Property row was created, so parcel_id APN-203270 is still free"

  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_performs_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - rbac.IntakeOfficer.exclusive_operations
          - rbac.BoardClerk.exclusive_operations
          - rbac.DispositionOfficer.exclusive_operations
          - rbac.InventoryManager.exclusive_operations
          - rbac.CountyTreasurer.exclusive_operations
        distinguishing_aspect: "Five opaque staff roles each drive their own exclusive write in one pass - registry intake, funding authorization, applicant intake, contractor onboarding and the tax-roll posting - so the permitted half of the matrix is asserted before any denial is."
        test_recipe:
          setup:
            - "An empty store; each call is the first exercise of that role's exclusive write."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203280", address: "3280 Dogwood Row", situs_ward: 6, lot_area_sqft: 6000, assessed_value_cents: 400000, structure_present: true, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Role Matrix Line", source_type: "GRANT", authorized_cents: 900000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/applicants"
              payload: { legal_name: "Ursula Bergman", applicant_type: "INDIVIDUAL", contact_email: "ursula@example.com" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { appl_id: $.data.id }
            - call: "POST /land-bank/contractors"
              payload: { name: "Dogwood Row Crews", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["MOW", "SECURE"] }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /land-bank/properties/${p_id}/tax-roll-posting"
              payload: { delinquent_tax_balance_cents: 48000, tax_year: 2025 }
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { balance: $.data.delinquent_tax_balance_cents }
          assert:
            - "HTTP 201 for the parcel, the source, the applicant and the contractor"
            - "HTTP 200 for the tax-roll posting and ${balance} == 48000"
            - "Property.${p_id}.custody_status == PROSPECT, FundingSource.${fs_id}.status == ACTIVE, Applicant.${appl_id}.eligibility_status == ELIGIBLE and Contractor.${ctr_id}.debarred == false"

      - name: other_roles_exclusive_operations_are_rejected
        claim_type: denied_operations
        grounds:
          - rbac
          - validations[priority=20]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The denial half of the matrix, one attempt per role boundary: registry intake refused to the DispositionOfficer, funding authorization refused to the IntakeOfficer, listing refused to the InventoryManager, run planning refused to the BoardClerk and the tax-roll posting refused to the DispositionOfficer - all 403 ERR_ROLE_NOT_PERMITTED with no state change, and none of them downgraded to 401."
        test_recipe:
          setup:
            - "One PROSPECT parcel and one ANY source exist so that every attempted call is well-formed and would have succeeded under the right role."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203290", address: "3290 Elderberry Row", situs_ward: 6, lot_area_sqft: 6000, assessed_value_cents: 400000, structure_present: true, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Denial Matrix Line", source_type: "GRANT", authorized_cents: 900000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id, fs_v: $.data.version }
          trigger:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203291", address: "3291 Elderberry Row", situs_ward: 6, lot_area_sqft: 6000, assessed_value_cents: 400000, structure_present: true, structure_condition_grade: "C", vacancy_months: 3 }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { e1: $.data.error_id }
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Unauthorized Line", source_type: "GRANT", authorized_cents: 100000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { e2: $.data.error_id }
            - call: "POST /land-bank/properties/${p_id}/list"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { e3: $.data.error_id }
            - call: "POST /land-bank/demolition-runs"
              payload: { funding_source_id: "${fs_id}", budget_cents: 100000, expected_funding_source_version: "${fs_v}" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { e4: $.data.error_id }
            - call: "POST /land-bank/properties/${p_id}/tax-roll-posting"
              payload: { delinquent_tax_balance_cents: 1000, tax_year: 2025 }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { e5: $.data.error_id }
          assert:
            - "all five responses are HTTP 403"
            - "${e1} == ERR_ROLE_NOT_PERMITTED and ${e2} == ERR_ROLE_NOT_PERMITTED and ${e3} == ERR_ROLE_NOT_PERMITTED and ${e4} == ERR_ROLE_NOT_PERMITTED and ${e5} == ERR_ROLE_NOT_PERMITTED"
            - "exactly one Property and one FundingSource exist; Property.${p_id}.custody_status == PROSPECT and delinquent_tax_balance_cents == 0"
            - "FundingSource.${fs_id}.version == ${fs_v} and open_run_count == 0"

      - name: applicant_cannot_act_on_another_applicants_application
        claim_type: denied_operations
        grounds:
          - validations[priority=25]
          - rbac.Applicant.identity
          - errors.ERR_NOT_APPLICATION_OWNER
        distinguishing_aspect: "The Applicant role is entity-backed, so carrying the right role is not enough: applicant B holding X-User-Role Applicant submits applicant A's application and gets 403 ERR_NOT_APPLICATION_OWNER at priority 25, ahead of every program gate; A's own submit on the same row then succeeds unchanged."
        test_recipe:
          setup:
            - "A LISTED grade C parcel assessed 100000 (HOMEOWNER_SALE quote 100000) with a DRAFT application belonging to applicant A, plus an unrelated applicant B."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Owner Check Line", source_type: "GENERAL_FUND", authorized_cents: 900000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
