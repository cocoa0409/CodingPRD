# =============================================================================
# PRD Benchmark Scaffold — Task 2325
# Load Planning & Weight and Balance Control (airline load control center)
# Difficulty band: Expert+ (14 entities / 48 endpoints / 9 calculations /
#                  7 state machines / 2 OCC rules / 6 roles)
# =============================================================================

scenario: |
  2325. Load Planning & Weight and Balance Control (airline load control center):
  aircraft weight limits by runway, temperature and altitude with
  performance-limited payload calculation, passenger, bag and cargo distribution
  across compartments to meet center-of-gravity envelopes, standard versus actual
  passenger weight programs and their documentation, last-minute change handling
  for gate-checked bags, standby passengers and cargo offloads, hazardous
  materials acceptance, notification to captain and segregation requirements,
  load sheet issuance, captain acceptance and post-departure amendments, offload
  prioritization rules when weight-restricted, load audit and discrepancy
  investigation.

domain_name: load-control-weight-balance
api_prefix: "/"

# =============================================================================
# Step 0.3 — Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Aircraft->Compartment and Runway->PerformanceBand are strict trees;
  # Flight->LoadPlan->{PaxDistributionLine, BagAllocation, LoadSheet} is a tree;
  # CargoItem and PaxDistributionLine/BagAllocation carry cross-cutting
  # compartment_id references that span into the Aircraft tree.

  state_machine_shape: parallel
  # Flight carries two independent state dimensions (status x load_release_state);
  # LoadPlan is cyclic (COMPUTED -> RESTRICTED -> COMPUTED via offload);
  # LoadSheet is branching (ISSUED -> {ACCEPTED, REJECTED_BY_CAPTAIN} -> AMENDED).

  relationship_patterns:
    - one_to_many          # Aircraft->Compartment, Flight->LoadPlan, LoadPlan->BagAllocation
    - cross_aggregate      # BagAllocation.compartment_id / CargoItem.assigned_compartment_id
    - polymorphic          # LastMinuteChange.change_kind targets pax, bag or cargo mass

  role_model: segregation_of_duties
  # The user who issues a LoadSheet may not accept it as Captain; the user who
  # accepts a HazmatDeclaration may not be the user who closes its LoadAudit.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Aircraft
  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - name: registration
        type: string
        source: input
        required: true
        description: "Aircraft registration mark, unique across Aircraft"
        constraints: "unique; 5-8 chars"
      - name: type_code
        type: string
        source: input
        required: true
        description: "ICAO aircraft type code; joins to PerformanceBand.aircraft_type_code"
      - name: basic_empty_weight_kg
        type: number
        source: input
        required: true
        description: "Basic empty weight in kg (airframe + fixed equipment, no crew, no fuel)"
        constraints: "> 0"
      - name: basic_index
        type: number
        source: input
        required: true
        description: "Index units of the basic empty weight moment, already normalised by index_c/index_k"
      - name: max_takeoff_weight_kg
        type: number
        source: input
        required: true
        description: "Structural MTOW in kg"
      - name: max_landing_weight_kg
        type: number
        source: input
        required: true
        description: "Structural MLW in kg"
      - name: max_zero_fuel_weight_kg
        type: number
        source: input
        required: true
        description: "Structural MZFW in kg"
      - name: max_taxi_weight_kg
        type: number
        source: input
        required: true
        description: "Structural maximum taxi (ramp) weight in kg"
      - name: ref_arm_m
        type: number
        source: input
        required: true
        description: "Reference arm (datum station) in metres used by the index formula"
      - name: lemac_m
        type: number
        source: input
        required: true
        description: "Leading edge of mean aerodynamic chord, arm in metres"
      - name: mac_length_m
        type: number
        source: input
        required: true
        description: "Length of the mean aerodynamic chord in metres"
      - name: index_c
        type: number
        source: input
        required: true
        description: "Index scaling constant C (kg*m per index unit)"
      - name: index_k
        type: number
        source: input
        required: true
        description: "Index offset constant K added to every index so values stay positive"
      - name: fuel_arm_m
        type: number
        source: input
        required: true
        description: "Effective arm in metres of the usable fuel mass (single-arm approximation)"
      - name: seat_count
        type: integer
        source: input
        required: true
        description: "Certified passenger seat count, carried for documentation only; per-zone seating is limited by Compartment.seat_capacity, never by this field"
      - name: zfw_fwd_limit_pct_mac
        type: number
        source: input
        required: true
        description: "Forward zero-fuel-weight CG limit in %MAC (inclusive lower bound)"
      - name: zfw_aft_limit_pct_mac
        type: number
        source: input
        required: true
        description: "Aft zero-fuel-weight CG limit in %MAC (inclusive upper bound)"
      - name: tow_fwd_limit_pct_mac
        type: number
        source: input
        required: true
        description: "Forward takeoff CG limit in %MAC (inclusive lower bound)"
      - name: tow_aft_limit_pct_mac
        type: number
        source: input
        required: true
        description: "Aft takeoff CG limit in %MAC below the envelope knee (inclusive upper bound)"
      - name: tow_knee_weight_kg
        type: number
        source: input
        required: true
        description: "Takeoff weight above which the aft takeoff CG limit is reduced by tow_aft_knee_adjust_pct_mac"
      - name: tow_aft_knee_adjust_pct_mac
        type: number
        source: input
        required: true
        description: "Signed %MAC adjustment applied to tow_aft_limit_pct_mac when takeoff_weight_kg > tow_knee_weight_kg"
        constraints: "<= 0"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Aircraft availability posture"
        default: "IN_SERVICE"
        constraints: "IN_SERVICE | GROUNDED"

  # ------------------------------------------------------------- Compartment
  - name: Compartment
    parent: Aircraft
    common_fields: true
    fields:
      - name: aircraft_id
        type: string
        source: input
        required: true
        description: "FK -> Aircraft.id; the aircraft this compartment belongs to"
      - name: code
        type: string
        source: input
        required: true
        description: "Compartment code, unique per aircraft_id (e.g. OA, OB, H1, H4)"
        constraints: "unique per (aircraft_id, code)"
      - name: kind
        type: enum
        source: input
        required: true
        description: "Whether the compartment seats passengers or carries bags/cargo"
        constraints: "CABIN_ZONE | HOLD"
      - name: arm_m
        type: number
        source: input
        required: true
        description: "Compartment centroid arm in metres from the datum"
      - name: max_weight_kg
        type: number
        source: input
        required: true
        description: "Structural maximum load in kg for this compartment"
      - name: running_load_limit_kg_per_m
        type: number
        source: input
        required: true
        description: "Maximum running load in kg per metre of compartment length (HOLD only; ignored for CABIN_ZONE)"
      - name: length_m
        type: number
        source: input
        required: true
        description: "Usable compartment length in metres used for the running-load check"
      - name: seat_capacity
        type: integer
        source: input
        required: true
        description: "Seats available in this compartment (0 for HOLD)"
        default: 0

  # ------------------------------------------------------------------ Runway
  - name: Runway
    parent: null
    common_fields: true
    fields:
      - name: airport_code
        type: string
        source: input
        required: true
        description: "ICAO airport code"
      - name: designator
        type: string
        source: input
        required: true
        description: "Runway designator, unique per airport_code (e.g. 04, 22L)"
        constraints: "unique per (airport_code, designator)"
      - name: elevation_ft
        type: number
        source: input
        required: true
        description: "Runway threshold elevation in feet, feeds the altitude penalty"
      - name: length_m
        type: number
        source: input
        required: true
        description: "Takeoff run available in metres (documentation only)"
      - name: slot_capacity_per_window
        type: integer
        source: input
        required: true
        description: "Maximum number of departures whose off-block instant may fall inside one departure slot window"
        default: 2
      - name: status
        type: enum
        source: computed
        required: true
        description: "Runway usability posture"
        default: "OPEN"
        constraints: "OPEN | CLOSED"

  # -------------------------------------------------------- PerformanceBand
  - name: PerformanceBand
    parent: Runway
    common_fields: true
    fields:
      - name: runway_id
        type: string
        source: input
        required: true
        description: "FK -> Runway.id; the runway this performance band applies to"
      - name: aircraft_type_code
        type: string
        source: input
        required: true
        description: "Aircraft type code this band applies to; matched against Aircraft.type_code"
      - name: temp_lo_c
        type: number
        source: input
        required: true
        description: "Inclusive lower outside-air-temperature bound of the band in Celsius"
      - name: temp_hi_c
        type: number
        source: input
        required: true
        description: "Exclusive upper outside-air-temperature bound of the band in Celsius"
      - name: base_limit_weight_kg
        type: number
        source: input
        required: true
        description: "Sea-level, zero-wind, dry-runway performance limit weight in kg for this band"

  # ----------------------------------------------------------- WeightProgram
  - name: WeightProgram
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        required: true
        description: "Weight program code, unique across WeightProgram"
        constraints: "unique"
      - name: program_kind
        type: enum
        source: input
        required: true
        description: "STANDARD applies table weights per passenger category; ACTUAL requires a weighed value per cabin zone"
        constraints: "STANDARD | ACTUAL"
      - name: male_kg
        type: number
        source: input
        required: true
        description: "Standard weight in kg for an adult male passenger including hand baggage"
      - name: female_kg
        type: number
        source: input
        required: true
        description: "Standard weight in kg for an adult female passenger including hand baggage"
      - name: child_kg
        type: number
        source: input
        required: true
        description: "Standard weight in kg for a child passenger including hand baggage"
      - name: infant_kg
        type: number
        source: input
        required: true
        description: "Standard weight in kg for an infant carried on an adult's lap"
      - name: checked_bag_kg
        type: number
        source: input
        required: true
        description: "Standard weight in kg used per checked bag when BagAllocation.bag_weight_kg is omitted"
      - name: documentation_ref
        type: string
        source: input
        required: true
        description: "Regulatory documentation reference substantiating this program; required for the load sheet audit trail"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Whether the program may be attached to new Flights"
        default: "ACTIVE"
        constraints: "ACTIVE | WITHDRAWN"

  # ------------------------------------------------------------------ Flight
  - name: Flight
    parent: null
    common_fields: true
    fields:
      - name: flight_number
        type: string
        source: input
        required: true
        description: "Commercial flight designator"
      - name: aircraft_id
        type: string
        source: input
        required: true
        description: "FK -> Aircraft.id; the airframe operating this flight"
      - name: departure_runway_id
        type: string
        source: input
        required: true
        description: "FK -> Runway.id; the departure runway whose performance bands limit takeoff weight"
      - name: weight_program_id
        type: string
        source: input
        required: true
        description: "FK -> WeightProgram.id; the passenger weight program in force for this flight"
      - name: scheduled_off_block_utc
        type: datetime
        source: input
        required: true
        description: "Scheduled off-block instant (ISO 8601 UTC); start of the aircraft occupancy interval and of the runway slot window"
      - name: scheduled_on_block_utc
        type: datetime
        source: input
        required: true
        description: "Scheduled on-block instant at destination (ISO 8601 UTC); end of the aircraft occupancy interval"
        constraints: "> scheduled_off_block_utc"
      - name: crew_weight_kg
        type: number
        source: input
        required: true
        description: "Total operating crew and pantry weight in kg"
      - name: crew_arm_m
        type: number
        source: input
        required: true
        description: "Effective arm in metres of the crew and pantry mass"
      - name: ramp_fuel_kg
        type: number
        source: input
        required: true
        description: "Fuel on board at engine start in kg"
      - name: taxi_fuel_kg
        type: number
        source: input
        required: true
        description: "Fuel burned between engine start and takeoff in kg"
      - name: trip_fuel_kg
        type: number
        source: input
        required: true
        description: "Fuel burned between takeoff and landing in kg"
        constraints: "<= ramp_fuel_kg - taxi_fuel_kg"
      - name: outside_air_temp_c
        type: number
        source: input
        required: true
        description: "Forecast outside air temperature in Celsius at departure, selects the PerformanceBand"
      - name: headwind_component_kt
        type: number
        source: input
        required: true
        description: "Runway headwind component in knots; negative values are tailwinds and earn no credit"
      - name: runway_condition
        type: enum
        source: input
        required: true
        description: "Reported runway surface condition, applies a multiplicative contamination factor"
        constraints: "DRY | WET | CONTAMINATED"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Flight planning lifecycle dimension"
        default: "PLANNING"
        constraints: "PLANNING | LOAD_CONTROLLED | DEPARTED | CLOSED | CANCELLED"
      - name: load_release_state
        type: enum
        source: computed
        required: true
        description: "Independent load-release dimension that evolves separately from status"
        default: "OPEN"
        constraints: "OPEN | HELD_FOR_DG | RELEASED"
      - name: dry_operating_weight_kg
        type: number
        source: computed
        required: true
        description: "Aircraft.basic_empty_weight_kg + crew_weight_kg; recomputed by calculate_dry_operating_weight"
      - name: dry_operating_index
        type: number
        source: computed
        required: true
        description: "Aircraft.basic_index plus the crew index delta; recomputed by calculate_dry_operating_weight"
      - name: performance_limited_takeoff_weight_kg
        type: number
        source: computed
        required: true
        description: "Runway/temperature/altitude/wind/condition limited takeoff weight in kg from calculate_performance_limited_takeoff_weight"
      - name: allowed_payload_kg
        type: number
        source: computed
        required: true
        description: "Maximum payload in kg permitted by the most restrictive of the five weight limits; from calculate_allowed_payload"
      - name: limiting_factor
        type: enum
        source: computed
        required: true
        description: "Which limit produced allowed_payload_kg"
        default: "PERFORMANCE"
        constraints: "PERFORMANCE | MTOW | MZFW | MLW | MAX_TAXI"
      - name: dg_hold_count
        type: integer
        source: computed
        required: true
        description: "Number of HazmatDeclaration rows in SUBMITTED status on this flight's cargo; > 0 forces load_release_state HELD_FOR_DG"
        default: 0

  # ---------------------------------------------------------------- LoadPlan
  - name: LoadPlan
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        required: true
        description: "FK -> Flight.id; the flight this load plan distributes"
      - name: revision_no
        type: integer
        source: computed
        required: true
        description: "1 for the first plan on a flight, incremented for each superseding plan"
        default: 1
      - name: status
        type: enum
        source: computed
        required: true
        description: "Load plan lifecycle; cycles between COMPUTED and RESTRICTED until the plan balances"
        default: "DRAFT"
        constraints: "DRAFT | COMPUTED | RESTRICTED | SHEET_ISSUED | SUPERSEDED"
      - name: gate_bag_policy
        type: enum
        source: input
        required: true
        description: "How gate-checked bags are absorbed once the plan is computed"
        default: "ABSORB_INTO_UNDERLOAD"
        constraints: "ABSORB_INTO_UNDERLOAD | DEFER_ALL"
      - name: offload_strategy
        type: enum
        source: input
        required: true
        description: "Which offload waterfall variant calculate_offload_selection applies when weight-restricted"
        default: "PRIORITY_FIRST"
        constraints: "PRIORITY_FIRST | FEWEST_PIECES"
      - name: base_payload_kg
        type: number
        source: computed
        required: true
        description: "Payload in kg from pax lines, bag allocations and non-gate cargo, frozen at compute time"
        default: 0
      - name: frozen_underload_kg
        type: number
        source: computed
        required: true
        description: "Flight.allowed_payload_kg - base_payload_kg captured at compute time; negative means weight-restricted"
        default: 0
      - name: restriction_status
        type: enum
        source: computed
        required: true
        description: "Frozen at compute time from frozen_underload_kg; not re-derived when gate bags are absorbed"
        default: "UNRESTRICTED"
        constraints: "UNRESTRICTED | WEIGHT_RESTRICTED"
      - name: planned_payload_kg
        type: number
        source: computed
        required: true
        description: "base_payload_kg plus accepted gate-bag weight minus offloaded cargo weight; the live payload figure"
        default: 0
      - name: deferred_bag_weight_kg
        type: number
        source: computed
        required: true
        description: "Total weight in kg of gate bags that could not be absorbed and were deferred to the next flight"
        default: 0
      - name: zero_fuel_weight_kg
        type: number
        source: computed
        required: true
        description: "Flight.dry_operating_weight_kg + planned_payload_kg"
        default: 0
      - name: index_zfw
        type: number
        source: computed
        required: true
        description: "Zero-fuel-weight index in index units from calculate_balance_chain"
        default: 0
      - name: mac_zfw_pct
        type: number
        source: computed
        required: true
        description: "Zero-fuel-weight centre of gravity in %MAC"
        default: 0
      - name: takeoff_weight_kg
        type: number
        source: computed
        required: true
        description: "zero_fuel_weight_kg + Flight.ramp_fuel_kg - Flight.taxi_fuel_kg"
        default: 0
      - name: index_tow
        type: number
        source: computed
        required: true
        description: "Takeoff index in index units"
        default: 0
      - name: mac_tow_pct
        type: number
        source: computed
        required: true
        description: "Takeoff centre of gravity in %MAC"
        default: 0
      - name: taxi_weight_kg
        type: number
        source: computed
        required: true
        description: "zero_fuel_weight_kg + Flight.ramp_fuel_kg"
        default: 0
      - name: landing_weight_kg
        type: number
        source: computed
        required: true
        description: "takeoff_weight_kg - Flight.trip_fuel_kg"
        default: 0
      - name: underload_kg
        type: number
        source: computed
        required: true
        description: "Flight.allowed_payload_kg - planned_payload_kg; the live spare payload capacity"
        default: 0
      - name: envelope_ok
        type: boolean
        source: computed
        required: true
        description: "True when both mac_zfw_pct and mac_tow_pct sit inside their weight-adjusted CG limits"
        default: false
      - name: rounding_mode
        type: enum
        source: input
        required: true
        description: "Pins the nested rounding order for the index chain; PER_LINE_THEN_SUM is the contract default"
        default: "PER_LINE_THEN_SUM"
        constraints: "PER_LINE_THEN_SUM | SUM_THEN_ROUND"

  # ------------------------------------------------------ PaxDistributionLine
  - name: PaxDistributionLine
    parent: LoadPlan
    common_fields: true
    fields:
      - name: load_plan_id
        type: string
        source: input
        required: true
        description: "FK -> LoadPlan.id; the plan this seating line belongs to"
      - name: compartment_id
        type: string
        source: input
        required: true
        description: "FK -> Compartment.id; must be a CABIN_ZONE compartment on the flight's aircraft"
      - name: male_count
        type: integer
        source: input
        required: true
        description: "Adult male passengers seated in this cabin zone"
        default: 0
      - name: female_count
        type: integer
        source: input
        required: true
        description: "Adult female passengers seated in this cabin zone"
        default: 0
      - name: child_count
        type: integer
        source: input
        required: true
        description: "Children occupying a seat in this cabin zone"
        default: 0
      - name: infant_count
        type: integer
        source: input
        required: true
        description: "Lap infants in this cabin zone; do not consume seats"
        default: 0
      - name: actual_weight_kg
        type: number
        source: input
        required: false
        description: "Weighed total passenger mass in kg for this zone; required when the flight's WeightProgram.program_kind is ACTUAL, forbidden when STANDARD"
      - name: line_weight_kg
        type: number
        source: computed
        required: true
        description: "Passenger mass in kg for this line under the flight's weight program variant"
        default: 0
      - name: index_delta
        type: number
        source: computed
        required: true
        description: "Index units contributed by line_weight_kg at the compartment arm, rounded to 2 decimals"
        default: 0

  # ----------------------------------------------------------- BagAllocation
  - name: BagAllocation
    parent: LoadPlan
    common_fields: true
    fields:
      - name: load_plan_id
        type: string
        source: input
        required: true
        description: "FK -> LoadPlan.id; the plan this hold allocation belongs to"
      - name: compartment_id
        type: string
        source: input
        required: true
        description: "FK -> Compartment.id; must be a HOLD compartment on the flight's aircraft"
      - name: bag_count
        type: integer
        source: input
        required: true
        description: "Number of checked bags allocated to this hold"
        default: 0
      - name: bag_weight_kg
        type: number
        source: input
        required: false
        description: "Weighed total bag mass in kg; when omitted the system uses bag_count * WeightProgram.checked_bag_kg"
      - name: effective_weight_kg
        type: number
        source: computed
        required: true
        description: "bag_weight_kg when supplied, otherwise bag_count * WeightProgram.checked_bag_kg"
        default: 0
      - name: index_delta
        type: number
        source: computed
        required: true
        description: "Index units contributed by effective_weight_kg at the compartment arm, rounded to 2 decimals"
        default: 0

  # -------------------------------------------------------------- CargoItem
  - name: CargoItem
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        required: true
        description: "FK -> Flight.id; the flight this consignment is booked on"
      - name: awb_number
        type: string
        source: input
        required: true
        description: "Air waybill number, unique per flight_id"
        constraints: "unique per (flight_id, awb_number)"
      - name: item_kind
        type: enum
        source: input
        required: true
        description: "Consignment category; drives the offload waterfall bucket and gate-bag handling"
        constraints: "GENERAL | MAIL | COMPANY | GATE_BAG"
      - name: weight_kg
        type: number
        source: input
        required: true
        description: "Gross consignment weight in kg"
        constraints: "> 0"
      - name: length_m
        type: number
        source: input
        required: true
        description: "Footprint length in metres used for the running-load check"
        constraints: "> 0"
      - name: is_dangerous_goods
        type: boolean
        source: input
        required: true
        description: "True when the consignment requires a HazmatDeclaration before load sheet issuance"
        default: false
      - name: assigned_compartment_id
        type: string
        source: input
        required: false
        description: "FK -> Compartment.id; HOLD compartment this consignment is stowed in, null until assigned"
      - name: offload_priority_rank
        type: integer
        source: computed
        required: true
        description: "Waterfall bucket rank: COMPANY 1, GENERAL 2, MAIL 3, GATE_BAG 4; lower rank is offloaded first"
        default: 2
      - name: status
        type: enum
        source: computed
        required: true
        description: "Consignment acceptance and stowage lifecycle"
        default: "BOOKED"
        constraints: "BOOKED | ACCEPTED | LOADED | OFFLOADED | DEFERRED | REJECTED"

  # -------------------------------------------------------- HazmatDeclaration
  - name: HazmatDeclaration
    parent: CargoItem
    common_fields: true
    fields:
      - name: cargo_item_id
        type: string
        source: input
        required: true
        description: "FK -> CargoItem.id; the dangerous-goods consignment being declared"
      - name: un_number
        type: string
        source: input
        required: true
        description: "UN identification number of the substance"
      - name: imo_class
        type: enum
        source: input
        required: true
        description: "Hazard class governing segregation"
        constraints: "CLASS_1 | CLASS_2 | CLASS_3 | CLASS_5 | CLASS_8"
      - name: packing_group
        type: enum
        source: input
        required: true
        description: "Packing group of the substance"
        constraints: "I | II | III"
      - name: segregation_group
        type: enum
        source: input
        required: true
        description: "Segregation group; OXIDISER may not share a compartment with FLAMMABLE"
        constraints: "FLAMMABLE | OXIDISER | CORROSIVE | INERT"
      - name: quantity_kg
        type: number
        source: input
        required: true
        description: "Net quantity of dangerous goods in kg; must not exceed the parent CargoItem.weight_kg"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Acceptance state of the declaration"
        default: "SUBMITTED"
        constraints: "SUBMITTED | ACCEPTED | REJECTED"
      - name: accepted_by_user_id
        type: string
        source: computed
        required: false
        description: "Opaque X-User-ID of the DangerousGoodsOfficer who accepted this declaration"
      - name: notoc_issued
        type: boolean
        source: computed
        required: true
        description: "True once the notification to captain listing this declaration has been issued with the load sheet"
        default: false

  # --------------------------------------------------------------- LoadSheet
  - name: LoadSheet
    parent: LoadPlan
    common_fields: true
    fields:
      - name: load_plan_id
        type: string
        source: input
        required: true
        description: "FK -> LoadPlan.id; the plan this sheet documents"
      - name: sheet_no
        type: integer
        source: computed
        required: true
        description: "1 for the first sheet on a plan, incremented for each reissue"
        default: 1
      - name: status
        type: enum
        source: computed
        required: true
        description: "Sheet lifecycle; branches on captain decision and re-converges on AMENDED"
        default: "ISSUED"
        constraints: "ISSUED | ACCEPTED | REJECTED_BY_CAPTAIN | AMENDED | SUPERSEDED"
      - name: issued_by_user_id
        type: string
        source: computed
        required: true
        description: "Opaque X-User-ID of the LoadController who issued the sheet"
      - name: accepted_by_user_id
        type: string
        source: computed
        required: false
        description: "Opaque X-User-ID of the Captain who accepted the sheet; must differ from issued_by_user_id"
      - name: notoc_reference
        type: string
        source: computed
        required: false
        description: "Notification-to-captain reference string, present when the flight carries accepted dangerous goods"
      - name: weight_program_documentation_ref
        type: string
        source: computed
        required: true
        description: "Snapshot of WeightProgram.documentation_ref taken at issuance for the audit trail"
      - name: issued_takeoff_weight_kg
        type: number
        source: computed
        required: true
        description: "LoadPlan.takeoff_weight_kg snapshot at issuance"
      - name: issued_index_tow
        type: number
        source: computed
        required: true
        description: "LoadPlan.index_tow snapshot at issuance"
      - name: issued_payload_kg
        type: number
        source: computed
        required: true
        description: "LoadPlan.planned_payload_kg snapshot at issuance"
      - name: lmc_allowance_kg
        type: number
        source: computed
        required: true
        description: "Maximum cumulative absolute last-minute-change weight in kg permitted on this sheet from calculate_lmc_allowance"
        default: 0
      - name: lmc_net_weight_delta_kg
        type: number
        source: computed
        required: true
        description: "Signed sum of applied LastMinuteChange.weight_delta_kg on this sheet"
        default: 0
      - name: lmc_absolute_weight_delta_kg
        type: number
        source: computed
        required: true
        description: "Sum of absolute values of applied LastMinuteChange.weight_delta_kg on this sheet"
        default: 0
      - name: final_takeoff_weight_kg
        type: number
        source: computed
        required: true
        description: "issued_takeoff_weight_kg + lmc_net_weight_delta_kg"
        default: 0
      - name: final_index_tow
        type: number
        source: computed
        required: true
        description: "issued_index_tow plus the signed sum of applied LastMinuteChange.index_delta"
        default: 0
      - name: final_mac_tow_pct
        type: number
        source: computed
        required: true
        description: "Takeoff CG in %MAC recomputed from final_takeoff_weight_kg and final_index_tow"
        default: 0
      - name: final_payload_kg
        type: number
        source: computed
        required: true
        description: "issued_payload_kg + lmc_net_weight_delta_kg"
        default: 0

  # -------------------------------------------------------- LastMinuteChange
  - name: LastMinuteChange
    parent: LoadSheet
    common_fields: true
    fields:
      - name: load_sheet_id
        type: string
        source: input
        required: true
        description: "FK -> LoadSheet.id; the sheet being amended"
      - name: change_kind
        type: enum
        source: input
        required: true
        description: "Which mass class the change moves"
        constraints: "PAX_ADD | PAX_REMOVE | BAG_ADD | BAG_REMOVE | CARGO_OFFLOAD"
      - name: compartment_id
        type: string
        source: input
        required: true
        description: "FK -> Compartment.id; where the mass is added or removed, fixing the index arm"
      - name: male_count
        type: integer
        source: input
        required: true
        description: "Adult males added or removed for PAX_ADD / PAX_REMOVE; 0 otherwise"
        default: 0
      - name: female_count
        type: integer
        source: input
        required: true
        description: "Adult females added or removed for PAX_ADD / PAX_REMOVE; 0 otherwise"
        default: 0
      - name: mass_kg
        type: number
        source: input
        required: true
        description: "Absolute mass in kg moved for BAG_ADD / BAG_REMOVE / CARGO_OFFLOAD; 0 for pax changes"
        default: 0
      - name: weight_delta_kg
        type: number
        source: computed
        required: true
        description: "Signed weight change in kg; positive for PAX_ADD and BAG_ADD, negative for PAX_REMOVE, BAG_REMOVE and CARGO_OFFLOAD"
        default: 0
      - name: index_delta
        type: number
        source: computed
        required: true
        description: "Signed index units contributed by weight_delta_kg at the compartment arm, rounded to 2 decimals"
        default: 0
      - name: status
        type: enum
        source: computed
        required: true
        description: "Whether the change was applied to the sheet"
        default: "APPLIED"
        constraints: "APPLIED | REVERSED"

  # --------------------------------------------------------------- LoadAudit
  - name: LoadAudit
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        required: true
        description: "FK -> Flight.id; the departed flight being audited"
      - name: basis
        type: enum
        source: input
        required: true
        description: "Which documented figures the weighed actuals are compared against"
        constraints: "DOCUMENTED_BASIS | FINAL_BASIS"
      - name: actual_pax_weight_kg
        type: number
        source: input
        required: true
        description: "Weighed total passenger mass in kg recovered after departure"
      - name: actual_bag_weight_kg
        type: number
        source: input
        required: true
        description: "Weighed total checked-bag mass in kg recovered after departure"
      - name: actual_cargo_weight_kg
        type: number
        source: input
        required: true
        description: "Weighed total cargo mass in kg recovered after departure"
      - name: pax_delta_kg
        type: number
        source: computed
        required: true
        description: "actual_pax_weight_kg minus the basis passenger figure"
        default: 0
      - name: bag_delta_kg
        type: number
        source: computed
        required: true
        description: "actual_bag_weight_kg minus the basis bag figure"
        default: 0
      - name: cargo_delta_kg
        type: number
        source: computed
        required: true
        description: "actual_cargo_weight_kg minus the basis cargo figure"
        default: 0
      - name: total_absolute_discrepancy_kg
        type: number
        source: computed
        required: true
        description: "Sum of the absolute values of the three deltas"
        default: 0
      - name: severity
        type: enum
        source: computed
        required: true
        description: "Discrepancy severity from calculate_audit_discrepancy thresholds"
        default: "NONE"
        constraints: "NONE | MINOR | MAJOR | CRITICAL"
      - name: status
        type: enum
        source: computed
        required: true
        description: "Investigation lifecycle"
        default: "OPEN"
        constraints: "OPEN | INVESTIGATING | CLOSED"
      - name: closed_by_user_id
        type: string
        source: computed
        required: false
        description: "Opaque X-User-ID of the AuditInspector who closed the investigation"
      - name: finding_note
        type: string
        source: input
        required: false
        description: "Investigator narrative recorded when the audit is closed"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # -------- Flight, dimension 1 of 2: planning lifecycle -------------------
  - entity: Flight
    dimension: status
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: LOAD_CONTROLLED
        trigger: "POST /load-plans/{id}/compute (only when the computed plan reaches LoadPlan.status COMPUTED)"
        actor: LoadController
        preconditions:
          - "Flight.status == PLANNING"
          - "the computing LoadPlan.flight_id == Flight.id"
          - "the computed LoadPlan.restriction_status == UNRESTRICTED"
          - "the computed LoadPlan.envelope_ok == true"
        side_effects:
          - "Flight.updated_at refreshed; Flight.version incremented by 1"
        note: "When the plan lands in RESTRICTED the flight stays PLANNING; this is cascade hop 3 of the apply-offload chain."
      - from: LOAD_CONTROLLED
        to: DEPARTED
        trigger: "POST /flights/{id}/depart"
        actor: LoadController
        preconditions:
          - "Flight.status == LOAD_CONTROLLED"
          - "Flight.load_release_state == RELEASED"
        side_effects:
          - "every CargoItem with flight_id == Flight.id and status == ACCEPTED and assigned_compartment_id == null transitions to DEFERRED"
          - "Flight.version incremented by 1"
      - from: DEPARTED
        to: CLOSED
        trigger: "POST /flights/{id}/close"
        actor: LoadControlAdmin
        preconditions:
          - "Flight.status == DEPARTED"
          - "every LoadAudit with flight_id == Flight.id has status == CLOSED"
        side_effects:
          - "Flight.version incremented by 1"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /flights/{id}/cancel"
        actor: LoadControlAdmin
        preconditions:
          - "Flight.status == PLANNING"
        side_effects:
          - "every LoadPlan with flight_id == Flight.id and status IN {DRAFT, COMPUTED, RESTRICTED} transitions to SUPERSEDED"
          - "every CargoItem with flight_id == Flight.id and status IN {BOOKED, ACCEPTED} transitions to OFFLOADED"
          - "Flight.version incremented by 1"
      - from: LOAD_CONTROLLED
        to: CANCELLED
        trigger: "POST /flights/{id}/cancel"
        actor: LoadControlAdmin
        preconditions:
          - "Flight.status == LOAD_CONTROLLED"
          - "no LoadSheet on any LoadPlan of this flight has status == ACCEPTED"
        side_effects:
          - "every LoadPlan with flight_id == Flight.id and status IN {DRAFT, COMPUTED, RESTRICTED, SHEET_ISSUED} transitions to SUPERSEDED"
          - "every LoadSheet on those plans with status IN {ISSUED, REJECTED_BY_CAPTAIN} transitions to SUPERSEDED"
          - "every CargoItem with flight_id == Flight.id and status IN {BOOKED, ACCEPTED, LOADED} transitions to OFFLOADED"
          - "Flight.version incremented by 1"

  # -------- Flight, dimension 2 of 2: load release (parallel + cyclic) -----
  - entity: Flight
    dimension: load_release_state
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: HELD_FOR_DG
        trigger: "POST /hazmat-declarations (creation of a declaration in SUBMITTED status)"
        actor: RampAgent
        preconditions:
          - "Flight.status IN {PLANNING, LOAD_CONTROLLED}"
          - "the declaration's CargoItem.flight_id == Flight.id"
        side_effects:
          - "Flight.dg_hold_count recomputed as the count of HazmatDeclaration rows in SUBMITTED status on this flight's cargo"
          - "Flight.version incremented by 1"
        note: "Runs on the status dimension's PLANNING or LOAD_CONTROLLED state without changing it — the two dimensions advance independently."
      - from: HELD_FOR_DG
        to: HELD_FOR_DG
        trigger: "POST /hazmat-declarations (a further declaration while a hold is already in force)"
        actor: RampAgent
        preconditions:
          - "Flight.dg_hold_count >= 1"
        side_effects:
          - "Flight.dg_hold_count incremented by 1"
          - "Flight.version incremented by 1"
      - from: HELD_FOR_DG
        to: OPEN
        trigger: "POST /hazmat-declarations/{id}/accept or POST /hazmat-declarations/{id}/reject (the last SUBMITTED declaration on the flight is resolved)"
        actor: DangerousGoodsOfficer
        preconditions:
          - "after this resolution Flight.dg_hold_count == 0"
        side_effects:
          - "Flight.dg_hold_count set to 0"
          - "Flight.version incremented by 1"
        note: "Cycle OPEN -> HELD_FOR_DG -> OPEN may repeat any number of times before release."
      - from: OPEN
        to: RELEASED
        trigger: "POST /load-sheets/{id}/accept"
        actor: Captain
        preconditions:
          - "Flight.load_release_state == OPEN"
          - "Flight.dg_hold_count == 0"
          - "the accepting LoadSheet's LoadPlan.flight_id == Flight.id"
        side_effects:
          - "cascade hop 2: every CargoItem with flight_id == Flight.id, status == ACCEPTED and assigned_compartment_id != null transitions to LOADED"
          - "Flight.version incremented by 1"

  # -------- LoadPlan: cyclic ----------------------------------------------
  - entity: LoadPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /load-plans/{id}/compute"
        actor: LoadController
        preconditions:
          - "LoadPlan.status == DRAFT"
          - "Flight.status == PLANNING"
          - "every PaxDistributionLine and BagAllocation on this plan references a Compartment on Flight.aircraft_id"
          - "calculate_allowed_payload yields base_payload_kg <= Flight.allowed_payload_kg"
          - "calculate_balance_chain yields envelope_ok == true"
        side_effects:
          - "LoadPlan.base_payload_kg, frozen_underload_kg, restriction_status, planned_payload_kg set by calculate_base_payload"
          - "LoadPlan.zero_fuel_weight_kg, index_zfw, mac_zfw_pct, takeoff_weight_kg, index_tow, mac_tow_pct, taxi_weight_kg, landing_weight_kg, underload_kg, envelope_ok set by calculate_balance_chain"
          - "each PaxDistributionLine.line_weight_kg and index_delta set by calculate_pax_line_weight"
          - "each BagAllocation.effective_weight_kg and index_delta set by calculate_bag_allocation_weight"
          - "cascade hop 3: Flight.status PLANNING -> LOAD_CONTROLLED"
          - "LoadPlan.version incremented by 1"
      - from: DRAFT
        to: RESTRICTED
        trigger: "POST /load-plans/{id}/compute (base payload exceeds Flight.allowed_payload_kg)"
        actor: LoadController
        preconditions:
          - "LoadPlan.status == DRAFT"
          - "Flight.status == PLANNING"
          - "calculate_base_payload yields frozen_underload_kg < 0"
        side_effects:
          - "LoadPlan.restriction_status set to WEIGHT_RESTRICTED and frozen_underload_kg set to the negative value"
          - "LoadPlan balance fields set by calculate_balance_chain against the un-offloaded distribution"
          - "Flight.status left unchanged at PLANNING"
          - "LoadPlan.version incremented by 1"
      - from: RESTRICTED
        to: COMPUTED
        trigger: "POST /load-plans/{id}/apply-offload"
        actor: LoadController
        preconditions:
          - "LoadPlan.status == RESTRICTED"
          - "calculate_offload_selection returns a selection whose offloaded_total_kg >= -LoadPlan.frozen_underload_kg"
          - "the post-offload distribution satisfies calculate_balance_chain envelope_ok == true"
        side_effects:
          - "cascade hop 1: each selected CargoItem transitions to OFFLOADED and its assigned_compartment_id is cleared"
          - "cascade hop 2: LoadPlan.planned_payload_kg, underload_kg and the whole balance chain recomputed from the surviving distribution"
          - "cascade hop 3: Flight.status PLANNING -> LOAD_CONTROLLED"
          - "LoadPlan.version incremented by 1"
      - from: COMPUTED
        to: DRAFT
        trigger: "POST /pax-lines, POST /bag-allocations, DELETE /pax-lines/{id} or POST /cargo-items/{id}/assign against a COMPUTED plan"
        actor: LoadController
        preconditions:
          - "LoadPlan.status == COMPUTED"
          - "no LoadSheet on this plan has status IN {ISSUED, ACCEPTED, AMENDED}"
        side_effects:
          - "all LoadPlan computed balance fields reset to 0 and envelope_ok reset to false"
          - "Flight.status LOAD_CONTROLLED -> PLANNING"
          - "LoadPlan.version incremented by 1"
        note: "The DRAFT -> COMPUTED -> DRAFT loop is the plan revision cycle; it may repeat any number of times."
      - from: COMPUTED
        to: SHEET_ISSUED
        trigger: "POST /load-sheets"
        actor: LoadController
        preconditions:
          - "LoadPlan.status == COMPUTED"
          - "LoadPlan.envelope_ok == true"
          - "every CargoItem on the flight with is_dangerous_goods == true has a HazmatDeclaration in ACCEPTED status"
        side_effects:
          - "a LoadSheet is created in ISSUED status with the snapshot fields"
          - "LoadPlan.version incremented by 1"
      - from: SHEET_ISSUED
        to: COMPUTED
        trigger: "POST /load-sheets/{id}/reject"
        actor: Captain
        preconditions:
          - "LoadPlan.status == SHEET_ISSUED"
          - "the rejected LoadSheet.status == ISSUED"
        side_effects:
          - "the rejected LoadSheet transitions to REJECTED_BY_CAPTAIN"
          - "LoadPlan.version incremented by 1"
        note: "Second arm of the revision cycle: a rejected sheet returns the plan to COMPUTED so a corrected sheet can be issued."
      - from: SHEET_ISSUED
        to: SUPERSEDED
        trigger: "POST /load-plans (a new plan is created on the same flight)"
        actor: LoadController
        preconditions:
          - "LoadPlan.status IN {DRAFT, COMPUTED, RESTRICTED, SHEET_ISSUED}"
          - "no LoadSheet on this plan has status IN {ACCEPTED, AMENDED}"
        side_effects:
          - "every LoadSheet on this plan with status IN {ISSUED, REJECTED_BY_CAPTAIN} transitions to SUPERSEDED"
          - "LoadPlan.version incremented by 1"

  # -------- LoadSheet: branching ------------------------------------------
  - entity: LoadSheet
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, AMENDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /load-sheets/{id}/accept"
        actor: Captain
        preconditions:
          - "LoadSheet.status == ISSUED"
          - "X-User-ID != LoadSheet.issued_by_user_id"
          - "Flight.dg_hold_count == 0"
        side_effects:
          - "LoadSheet.accepted_by_user_id set to X-User-ID"
          - "cascade hop 1: Flight.load_release_state OPEN -> RELEASED"
          - "LoadSheet.version incremented by 1"
      - from: ISSUED
        to: REJECTED_BY_CAPTAIN
        trigger: "POST /load-sheets/{id}/reject"
        actor: Captain
        preconditions:
          - "LoadSheet.status == ISSUED"
          - "X-User-ID != LoadSheet.issued_by_user_id"
        side_effects:
          - "the parent LoadPlan transitions SHEET_ISSUED -> COMPUTED"
          - "Flight.load_release_state left unchanged at OPEN"
          - "LoadSheet.version incremented by 1"
        note: "Divergent branch: accept releases the load and loads the cargo; reject reopens the plan and touches no CargoItem."
      - from: REJECTED_BY_CAPTAIN
        to: SUPERSEDED
        trigger: "POST /load-sheets (reissue on the same plan)"
        actor: LoadController
        preconditions:
          - "LoadSheet.status IN {ISSUED, REJECTED_BY_CAPTAIN}"
        side_effects:
          - "the reissued LoadSheet.sheet_no is set to the superseded sheet_no + 1"
          - "LoadSheet.version incremented by 1"
      - from: ACCEPTED
        to: AMENDED
        trigger: "POST /load-sheets/{id}/amend"
        actor: LoadController
        preconditions:
          - "LoadSheet.status == ACCEPTED"
          - "Flight.status == DEPARTED"
        side_effects:
          - "LoadSheet.final_takeoff_weight_kg, final_index_tow, final_mac_tow_pct and final_payload_kg recomputed from the applied LastMinuteChange rows"
          - "LoadSheet.version incremented by 1"
        note: "Post-departure amendment; join point where both LMC-bearing and untouched sheets converge."

  # -------- CargoItem -----------------------------------------------------
  - entity: CargoItem
    initial_state: BOOKED
    terminal_states: [REJECTED, OFFLOADED, DEFERRED]
    transitions:
      - from: BOOKED
        to: ACCEPTED
        trigger: "POST /cargo-items (auto-acceptance when item_kind != GATE_BAG and is_dangerous_goods == false)"
        actor: system
        preconditions:
          - "CargoItem.item_kind != GATE_BAG"
          - "CargoItem.is_dangerous_goods == false"
        side_effects:
          - "CargoItem.offload_priority_rank set from item_kind"
      - from: BOOKED
        to: ACCEPTED
        trigger: "POST /cargo-items/{id}/accept"
        actor: RampAgent
        preconditions:
          - "CargoItem.status == BOOKED"
          - "Flight.status IN {PLANNING, LOAD_CONTROLLED}"
          - "if CargoItem.is_dangerous_goods == true then a HazmatDeclaration with cargo_item_id == CargoItem.id has status == ACCEPTED"
        side_effects:
          - "CargoItem.version incremented by 1"
      - from: BOOKED
        to: REJECTED
        trigger: "POST /cargo-items/{id}/reject or POST /hazmat-declarations/{id}/reject"
        actor: RampAgent
        preconditions:
          - "CargoItem.status == BOOKED"
        side_effects:
          - "CargoItem.assigned_compartment_id cleared"
          - "CargoItem.version incremented by 1"
      - from: ACCEPTED
        to: LOADED
        trigger: "POST /load-sheets/{id}/accept (cascade from Flight.load_release_state -> RELEASED)"
        actor: system
        preconditions:
          - "CargoItem.status == ACCEPTED"
          - "CargoItem.assigned_compartment_id != null"
          - "Flight.load_release_state == RELEASED"
        side_effects:
          - "cascade hop 3: every HazmatDeclaration with cargo_item_id == CargoItem.id and status == ACCEPTED has notoc_issued set to true"
          - "CargoItem.version incremented by 1"
      - from: ACCEPTED
        to: OFFLOADED
        trigger: "POST /load-plans/{id}/apply-offload or POST /flights/{id}/cancel"
        actor: LoadController
        preconditions:
          - "CargoItem.status == ACCEPTED"
          - "CargoItem.id is in calculate_offload_selection's selected set, or the flight is being cancelled"
        side_effects:
          - "CargoItem.assigned_compartment_id cleared"
          - "CargoItem.version incremented by 1"
      - from: LOADED
        to: OFFLOADED
        trigger: "POST /flights/{id}/cancel"
        actor: LoadControlAdmin
        preconditions:
          - "CargoItem.status == LOADED"
          - "Flight.status == LOAD_CONTROLLED"
        side_effects:
          - "CargoItem.assigned_compartment_id cleared"
          - "CargoItem.version incremented by 1"
      - from: BOOKED
        to: DEFERRED
        trigger: "POST /load-plans/{id}/gate-bags (the gate bag cannot be absorbed)"
        actor: RampAgent
        preconditions:
          - "CargoItem.item_kind == GATE_BAG"
          - "LoadPlan.gate_bag_policy == DEFER_ALL, or CargoItem.weight_kg > LoadPlan.underload_kg"
        side_effects:
          - "LoadPlan.deferred_bag_weight_kg increased by CargoItem.weight_kg"
      - from: ACCEPTED
        to: DEFERRED
        trigger: "POST /flights/{id}/depart"
        actor: LoadController
        preconditions:
          - "CargoItem.status == ACCEPTED"
          - "CargoItem.assigned_compartment_id == null"
          - "Flight.status == LOAD_CONTROLLED"
        side_effects:
          - "CargoItem.version incremented by 1"

  # -------- HazmatDeclaration ---------------------------------------------
  - entity: HazmatDeclaration
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /hazmat-declarations/{id}/accept"
        actor: DangerousGoodsOfficer
        preconditions:
          - "HazmatDeclaration.status == SUBMITTED"
          - "the parent CargoItem.status IN {BOOKED, ACCEPTED}"
          - "no other HazmatDeclaration in ACCEPTED status on a CargoItem sharing the same assigned_compartment_id has an incompatible segregation_group"
        side_effects:
          - "HazmatDeclaration.accepted_by_user_id set to X-User-ID"
          - "Flight.dg_hold_count decremented by 1, and Flight.load_release_state HELD_FOR_DG -> OPEN when it reaches 0"
          - "HazmatDeclaration.version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /hazmat-declarations/{id}/reject"
        actor: DangerousGoodsOfficer
        preconditions:
          - "HazmatDeclaration.status == SUBMITTED"
        side_effects:
          - "the parent CargoItem transitions BOOKED -> REJECTED"
          - "Flight.dg_hold_count decremented by 1, and Flight.load_release_state HELD_FOR_DG -> OPEN when it reaches 0"
          - "HazmatDeclaration.version incremented by 1"

  # -------- LoadAudit -----------------------------------------------------
  - entity: LoadAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /load-audits/{id}/investigate"
        actor: AuditInspector
        preconditions:
          - "LoadAudit.status == OPEN"
          - "LoadAudit.severity IN {MAJOR, CRITICAL}"
        side_effects:
          - "LoadAudit.version incremented by 1"
      - from: INVESTIGATING
        to: CLOSED
        trigger: "POST /load-audits/{id}/close"
        actor: AuditInspector
        preconditions:
          - "LoadAudit.status == INVESTIGATING"
          - "finding_note is present and non-empty"
          - "X-User-ID differs from every HazmatDeclaration.accepted_by_user_id on this flight's cargo"
        side_effects:
          - "LoadAudit.closed_by_user_id set to X-User-ID"
          - "LoadAudit.version incremented by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /load-audits/{id}/close"
        actor: AuditInspector
        preconditions:
          - "LoadAudit.status == OPEN"
          - "LoadAudit.severity IN {NONE, MINOR}"
          - "X-User-ID differs from every HazmatDeclaration.accepted_by_user_id on this flight's cargo"
        side_effects:
          - "LoadAudit.closed_by_user_id set to X-User-ID"
          - "LoadAudit.version incremented by 1"

  # -------- LastMinuteChange ----------------------------------------------
  - entity: LastMinuteChange
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /last-minute-changes/{id}/reverse"
        actor: LoadController
        preconditions:
          - "LastMinuteChange.status == APPLIED"
          - "the parent LoadSheet.status IN {ISSUED, ACCEPTED}"
        side_effects:
          - "LoadSheet.lmc_net_weight_delta_kg and lmc_absolute_weight_delta_kg recomputed over the remaining APPLIED rows in created_at ASC order"
          - "LoadSheet.final_takeoff_weight_kg, final_index_tow, final_mac_tow_pct and final_payload_kg recomputed"
          - "LastMinuteChange.version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: load-plan-create-stale-flight
    parent_entity: Flight
    write_endpoint: "POST /load-plans"
    occ_field: "expected_flight_version"
    description: |
      Creating a LoadPlan against a Flight whose version has advanced since the
      client last read it is rejected. A new plan legitimately supersedes the
      prior non-terminal plan on that flight, so the write cannot be refused by
      any state precondition; the stale expected_flight_version is the only
      signal that the caller's view of the flight (its allowed payload, its
      conditions, its existing plan) is out of date.
    error_id: ERR_STALE_FLIGHT_VERSION
    http_status: 412

  - rule_id: load-sheet-issue-stale-plan
    parent_entity: LoadPlan
    write_endpoint: "POST /load-sheets"
    occ_field: "expected_load_plan_version"
    description: |
      Issuing a LoadSheet against a LoadPlan whose version has advanced since
      the client last read it is rejected. A reissued sheet legitimately
      supersedes the prior ISSUED or REJECTED_BY_CAPTAIN sheet on the same plan,
      so no state precondition blocks the write; the stale
      expected_load_plan_version is the only signal that the balance figures the
      caller intends to snapshot are no longer the plan's current figures.
    error_id: ERR_STALE_LOAD_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: calculate_dry_operating_weight
    description: "Dry operating weight and dry operating index of the flight (airframe plus crew and pantry, no payload, no fuel)."
    trigger: "POST /flights, and PATCH /flights/{id}/conditions"
    algorithm: aggregation
    inputs: [Aircraft.basic_empty_weight_kg, Aircraft.basic_index, Aircraft.ref_arm_m, Aircraft.index_c, Flight.crew_weight_kg, Flight.crew_arm_m]
    input_set: "Exactly one Aircraft (Flight.aircraft_id) and the Flight's own crew fields; no child entities participate."
    formula: |
      dry_operating_weight_kg = Aircraft.basic_empty_weight_kg + Flight.crew_weight_kg
      crew_index_delta       = round2(Flight.crew_weight_kg * (Flight.crew_arm_m - Aircraft.ref_arm_m) / Aircraft.index_c)
      dry_operating_index    = round2(Aircraft.basic_index + crew_index_delta)
    constants: {}
    precision: "2 decimal places, round_half_up (applied to the crew index delta before it is added to basic_index)"

  - name: calculate_performance_limited_takeoff_weight
    description: "Runway-, temperature-, altitude-, wind- and surface-condition-limited takeoff weight for the flight's departure runway."
    trigger: "POST /flights, and PATCH /flights/{id}/conditions"
    algorithm: threshold
    inputs: [Runway.elevation_ft, PerformanceBand.temp_lo_c, PerformanceBand.temp_hi_c, PerformanceBand.base_limit_weight_kg, Flight.outside_air_temp_c, Flight.headwind_component_kt, Flight.runway_condition]
    input_set: |
      The single PerformanceBand whose runway_id == Flight.departure_runway_id,
      whose aircraft_type_code == Aircraft.type_code, and whose temperature
      interval contains Flight.outside_air_temp_c under lower-inclusive /
      upper-exclusive semantics: temp_lo_c <= outside_air_temp_c < temp_hi_c.
      When no band matches, the flight cannot be created (ERR_NO_PERFORMANCE_BAND).
      Bands on one runway/type never overlap, so at most one row matches.
    formula: |
      band            = the PerformanceBand selected by input_set
      altitude_penalty = round2(ALTITUDE_PENALTY_PER_1000FT * Runway.elevation_ft / 1000)
      temperature_penalty = round2(TEMP_PENALTY_PER_C * max(0, Flight.outside_air_temp_c - band.temp_lo_c))
      wind_credit     = round2(min(MAX_WIND_CREDIT_KG, max(0, Flight.headwind_component_kt) * WIND_CREDIT_PER_KT))
      raw             = (band.base_limit_weight_kg - altitude_penalty - temperature_penalty + wind_credit)
                        * CONTAMINATION_FACTOR[Flight.runway_condition]
      performance_limited_takeoff_weight_kg = floor(raw / PERF_ROUNDING_STEP) * PERF_ROUNDING_STEP
    constants:
      ALTITUDE_PENALTY_PER_1000FT: 220
      TEMP_PENALTY_PER_C: 130
      WIND_CREDIT_PER_KT: 90
      MAX_WIND_CREDIT_KG: 900
      PERF_ROUNDING_STEP: 10
      CONTAMINATION_FACTOR: { DRY: 1.00, WET: 0.93, CONTAMINATED: 0.85 }
    precision: |
      Each penalty and the wind credit are rounded to 2 decimals, round_half_up,
      BEFORE the contamination factor multiplies the bracket; the final result is
      floored (never rounded) to the next lower multiple of PERF_ROUNDING_STEP.
      The evaluation order is pinned: penalties first, then the bracket, then the
      multiplicative factor, then the floor.

  - name: calculate_allowed_payload
    description: "Maximum payload the flight may carry, taken as the most restrictive of the performance, structural takeoff, zero-fuel, landing and taxi limits."
    trigger: "POST /flights, and PATCH /flights/{id}/conditions"
    algorithm: waterfall_allocation
    inputs: [Flight.performance_limited_takeoff_weight_kg, Flight.dry_operating_weight_kg, Flight.ramp_fuel_kg, Flight.taxi_fuel_kg, Flight.trip_fuel_kg, Aircraft.max_takeoff_weight_kg, Aircraft.max_zero_fuel_weight_kg, Aircraft.max_landing_weight_kg, Aircraft.max_taxi_weight_kg]
    input_set: "The Flight row and its Aircraft; all five candidate limits are always evaluated, none is skipped."
    formula: |
      takeoff_fuel_kg = Flight.ramp_fuel_kg - Flight.taxi_fuel_kg
      landing_fuel_kg = takeoff_fuel_kg - Flight.trip_fuel_kg
      cand_PERFORMANCE = Flight.performance_limited_takeoff_weight_kg - Flight.dry_operating_weight_kg - takeoff_fuel_kg
      cand_MTOW        = Aircraft.max_takeoff_weight_kg            - Flight.dry_operating_weight_kg - takeoff_fuel_kg
      cand_MZFW        = Aircraft.max_zero_fuel_weight_kg          - Flight.dry_operating_weight_kg
      cand_MLW         = Aircraft.max_landing_weight_kg            - Flight.dry_operating_weight_kg - landing_fuel_kg
      cand_MAX_TAXI    = Aircraft.max_taxi_weight_kg               - Flight.dry_operating_weight_kg - Flight.ramp_fuel_kg
      allowed_payload_kg = max(0, round2(min(cand_PERFORMANCE, cand_MTOW, cand_MZFW, cand_MLW, cand_MAX_TAXI)))
      limiting_factor    = the FIRST candidate equal to that minimum in the fixed
                           precedence order PERFORMANCE, MTOW, MZFW, MLW, MAX_TAXI
                           (ties resolved by this order, never by id)
    constants: {}
    precision: "2 decimal places, round_half_up; allowed_payload_kg is floored at 0 and never negative"

  - name: calculate_pax_line_weight
    description: "Passenger mass and index contribution of one cabin-zone distribution line."
    trigger: "POST /pax-lines, and re-evaluated by POST /load-plans/{id}/compute"
    algorithm: aggregation
    inputs: [PaxDistributionLine.male_count, PaxDistributionLine.female_count, PaxDistributionLine.child_count, PaxDistributionLine.infant_count, PaxDistributionLine.actual_weight_kg, WeightProgram.male_kg, WeightProgram.female_kg, WeightProgram.child_kg, WeightProgram.infant_kg, Compartment.arm_m, Aircraft.ref_arm_m, Aircraft.index_c]
    input_set: "All PaxDistributionLine rows whose load_plan_id == the plan being computed; deleted lines are excluded because DELETE removes the row."
    formula: |
      line_weight_kg = per the variant selected by WeightProgram.program_kind
      index_delta    = round2(line_weight_kg * (Compartment.arm_m - Aircraft.ref_arm_m) / Aircraft.index_c)
    constants: {}
    precision: "line_weight_kg to 2 decimals round_half_up; index_delta to 2 decimals round_half_up"
    variants:
      - name: standard_weight_program
        when: "WeightProgram.program_kind == STANDARD"
        difference: |
          line_weight_kg = male_count * WeightProgram.male_kg
                         + female_count * WeightProgram.female_kg
                         + child_count * WeightProgram.child_kg
                         + infant_count * WeightProgram.infant_kg
          PaxDistributionLine.actual_weight_kg must be absent (ERR_ACTUAL_WEIGHT_NOT_PERMITTED).
      - name: actual_weight_program
        when: "WeightProgram.program_kind == ACTUAL"
        difference: |
          line_weight_kg = PaxDistributionLine.actual_weight_kg verbatim; the four
          counts are used only for the seat-capacity check and contribute no mass.
          actual_weight_kg is mandatory (ERR_ACTUAL_WEIGHT_REQUIRED). For identical
          counts the two variants therefore yield different line_weight_kg, a
          different index_zfw and a different mac_zfw_pct.

  - name: calculate_bag_allocation_weight
    description: "Checked-bag mass and index contribution of one hold allocation."
    trigger: "POST /bag-allocations, and re-evaluated by POST /load-plans/{id}/compute"
    algorithm: aggregation
    inputs: [BagAllocation.bag_count, BagAllocation.bag_weight_kg, WeightProgram.checked_bag_kg, Compartment.arm_m, Compartment.length_m, Compartment.running_load_limit_kg_per_m, Aircraft.ref_arm_m, Aircraft.index_c]
    input_set: "All BagAllocation rows whose load_plan_id == the plan being computed."
    formula: |
      effective_weight_kg = BagAllocation.bag_weight_kg when supplied,
                            otherwise BagAllocation.bag_count * WeightProgram.checked_bag_kg
      index_delta         = round2(effective_weight_kg * (Compartment.arm_m - Aircraft.ref_arm_m) / Aircraft.index_c)
      running_load        = (effective_weight_kg + sum of CargoItem.weight_kg for cargo with
                             assigned_compartment_id == this compartment and status IN {ACCEPTED, LOADED})
                            / Compartment.length_m
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: calculate_base_payload
    description: "Frozen payload figure of the plan at compute time, the frozen underload it implies, and the live planned payload once gate bags and offloads have moved."
    trigger: "POST /load-plans/{id}/compute, POST /load-plans/{id}/apply-offload, POST /load-plans/{id}/gate-bags"
    algorithm: aggregation
    inputs: [PaxDistributionLine.line_weight_kg, BagAllocation.effective_weight_kg, CargoItem.weight_kg, CargoItem.status, CargoItem.item_kind, CargoItem.assigned_compartment_id, Flight.allowed_payload_kg]
    input_set: |
      (a) every PaxDistributionLine with load_plan_id == plan.id;
      (b) every BagAllocation with load_plan_id == plan.id;
      (c) every CargoItem with flight_id == plan.flight_id, status IN {ACCEPTED, LOADED},
          assigned_compartment_id != null and item_kind != GATE_BAG.
      CargoItem rows in BOOKED, REJECTED, OFFLOADED or DEFERRED status and every
      GATE_BAG row are excluded from base_payload_kg. Order of summation is
      irrelevant because the per-row values are already rounded.
    formula: |
      base_payload_kg   = sum(a.line_weight_kg) + sum(b.effective_weight_kg) + sum(c.weight_kg)
      frozen_underload_kg = round2(Flight.allowed_payload_kg - base_payload_kg)
      restriction_status  = WEIGHT_RESTRICTED when frozen_underload_kg < 0 else UNRESTRICTED
      # live payload, recomputed on every gate-bag absorption and every offload:
      accepted_gate_bag_kg = sum of CargoItem.weight_kg for rows with item_kind == GATE_BAG
                             and status IN {ACCEPTED, LOADED} on this flight
      offloaded_kg         = sum of CargoItem.weight_kg for rows counted in (c) at compute
                             time that have since moved to OFFLOADED
      planned_payload_kg   = round2(base_payload_kg + accepted_gate_bag_kg - offloaded_kg)
      underload_kg         = round2(Flight.allowed_payload_kg - planned_payload_kg)
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: frozen_restriction_posture
        when: "read of LoadPlan.restriction_status after any gate-bag absorption or offload"
        difference: |
          restriction_status and frozen_underload_kg are frozen at the compute
          transition and are NOT re-derived afterwards, while planned_payload_kg
          and underload_kg are live. A plan computed UNRESTRICTED whose gate bags
          drive underload_kg to exactly 0 still reads restriction_status
          UNRESTRICTED.

  - name: calculate_balance_chain
    description: "Full index and centre-of-gravity chain: zero-fuel weight and index, takeoff weight and index, taxi and landing weight, %MAC at both weights, and the envelope verdict."
    trigger: "POST /load-plans/{id}/compute, POST /load-plans/{id}/apply-offload, POST /load-plans/{id}/gate-bags"
    algorithm: constraint_propagation
    inputs: [Flight.dry_operating_weight_kg, Flight.dry_operating_index, LoadPlan.planned_payload_kg, LoadPlan.rounding_mode, PaxDistributionLine.index_delta, BagAllocation.index_delta, CargoItem.weight_kg, CargoItem.assigned_compartment_id, Flight.ramp_fuel_kg, Flight.taxi_fuel_kg, Flight.trip_fuel_kg, Aircraft.ref_arm_m, Aircraft.lemac_m, Aircraft.mac_length_m, Aircraft.index_c, Aircraft.index_k, Aircraft.fuel_arm_m]
    input_set: |
      The same three collections as calculate_base_payload's input_set, plus the
      Flight fuel figures. Cargo index contributions use each CargoItem's
      assigned Compartment.arm_m; unassigned cargo contributes nothing because it
      is not in the payload either.
    formula: |
      # step 1 — index accumulation, evaluation order pinned by LoadPlan.rounding_mode
      raw_delta(w, arm) = w * (arm - Aircraft.ref_arm_m) / Aircraft.index_c
      PER_LINE_THEN_SUM (contract default):
        index_zfw = Flight.dry_operating_index
                  + sum over pax lines  of round2(raw_delta(line_weight_kg, arm))
                  + sum over bag allocs of round2(raw_delta(effective_weight_kg, arm))
                  + sum over cargo rows of round2(raw_delta(weight_kg, arm))
      SUM_THEN_ROUND:
        index_zfw = round2( Flight.dry_operating_index
                  + sum over ALL of the above rows of raw_delta(...) )       # single rounding
      # step 2 — weights
      zero_fuel_weight_kg = round2(Flight.dry_operating_weight_kg + LoadPlan.planned_payload_kg)
      takeoff_fuel_kg     = Flight.ramp_fuel_kg - Flight.taxi_fuel_kg
      takeoff_weight_kg   = round2(zero_fuel_weight_kg + takeoff_fuel_kg)
      taxi_weight_kg      = round2(zero_fuel_weight_kg + Flight.ramp_fuel_kg)
      landing_weight_kg   = round2(takeoff_weight_kg - Flight.trip_fuel_kg)
      index_tow           = round2(index_zfw + round2(raw_delta(takeoff_fuel_kg, Aircraft.fuel_arm_m)))
      # step 3 — %MAC, computed from index and weight (never from a stored arm)
      pct_mac(index, weight) =
        arm = Aircraft.ref_arm_m + (index - Aircraft.index_k) * Aircraft.index_c / weight
        round2((arm - Aircraft.lemac_m) / Aircraft.mac_length_m * 100)
      mac_zfw_pct = pct_mac(index_zfw, zero_fuel_weight_kg)
      mac_tow_pct = pct_mac(index_tow, takeoff_weight_kg)
      # step 4 — envelope, with the weight-dependent aft knee
      aft_tow_effective_pct = Aircraft.tow_aft_limit_pct_mac
                            + (Aircraft.tow_aft_knee_adjust_pct_mac
                               if takeoff_weight_kg > Aircraft.tow_knee_weight_kg else 0)
      envelope_ok = (Aircraft.zfw_fwd_limit_pct_mac <= mac_zfw_pct <= Aircraft.zfw_aft_limit_pct_mac)
                and (Aircraft.tow_fwd_limit_pct_mac <= mac_tow_pct <= aft_tow_effective_pct)
    constants: {}
    precision: |
      2 decimal places, round_half_up at every step named by round2 above. The
      nested rounding ORDER is pinned by LoadPlan.rounding_mode and the two modes
      are permitted to disagree in the last cent of index and in the last cent of
      %MAC; PER_LINE_THEN_SUM is the default for every plan created without an
      explicit rounding_mode.
    variants:
      - name: per_line_then_sum
        when: "LoadPlan.rounding_mode == PER_LINE_THEN_SUM"
        difference: "Each row's index delta is rounded to 2 decimals before summation; accumulated rounding is retained."
      - name: sum_then_round
        when: "LoadPlan.rounding_mode == SUM_THEN_ROUND"
        difference: "All raw index deltas are summed at full precision and rounded exactly once, yielding a different index_zfw (and hence mac_zfw_pct) for the same distribution."

  - name: calculate_offload_selection
    description: "Which consignments are offloaded when the plan is weight-restricted, and the resulting relieved weight."
    trigger: "GET /load-plans/{id}/offload-preview (read-only) and POST /load-plans/{id}/apply-offload"
    algorithm: waterfall_allocation
    inputs: [LoadPlan.frozen_underload_kg, LoadPlan.offload_strategy, CargoItem.offload_priority_rank, CargoItem.weight_kg, CargoItem.status, CargoItem.assigned_compartment_id, CargoItem.created_at]
    input_set: |
      Candidate set: every CargoItem with flight_id == plan.flight_id,
      status == ACCEPTED, assigned_compartment_id != null and item_kind != GATE_BAG.
      Rows in BOOKED, LOADED, OFFLOADED, DEFERRED or REJECTED status never enter
      the candidate set. When the candidate set is empty and excess_weight_kg > 0
      the operation fails with ERR_OFFLOAD_INSUFFICIENT.
    formula: |
      excess_weight_kg = max(0, -LoadPlan.frozen_underload_kg)
      candidates       = the set defined by input_set, ordered by the strategy below
      selected = []; running = 0
      for c in candidates:
          if running >= excess_weight_kg: break
          selected.append(c); running = running + c.weight_kg
      offloaded_total_kg   = running
      offloaded_piece_count = len(selected)
      if offloaded_total_kg < excess_weight_kg: fail ERR_OFFLOAD_INSUFFICIENT
    constants: {}
    precision: "2 decimal places, round_half_up on offloaded_total_kg"
    variants:
      - name: priority_first
        when: "LoadPlan.offload_strategy == PRIORITY_FIRST"
        difference: |
          Ordering: offload_priority_rank ASC (COMPANY 1, GENERAL 2, MAIL 3,
          GATE_BAG 4), then weight_kg DESC, then created_at ASC. Lowest-value
          traffic leaves first even if that means offloading several pieces.
      - name: fewest_pieces
        when: "LoadPlan.offload_strategy == FEWEST_PIECES"
        difference: |
          Ordering: weight_kg DESC, then offload_priority_rank ASC, then
          created_at ASC. Minimises handling actions, so for the same excess it
          can offload strictly less total weight and a strictly smaller piece
          count than priority_first, leaving a different planned_payload_kg.

  - name: calculate_lmc_allowance
    description: "Cumulative last-minute-change allowance granted by a load sheet, and the running LMC totals it caps."
    trigger: "POST /load-sheets (allowance), POST /last-minute-changes (running totals)"
    algorithm: threshold
    inputs: [LoadPlan.underload_kg, LastMinuteChange.change_kind, LastMinuteChange.male_count, LastMinuteChange.female_count, LastMinuteChange.mass_kg, WeightProgram.male_kg, WeightProgram.female_kg, Compartment.arm_m, Aircraft.ref_arm_m, Aircraft.index_c]
    input_set: "Every LastMinuteChange with load_sheet_id == sheet.id and status == APPLIED; REVERSED rows contribute 0 to both running totals."
    formula: |
      # at issuance
      lmc_allowance_kg = min(LMC_HARD_CAP_KG, max(0, LoadPlan.underload_kg))
      # per change
      signed_mass = for PAX_ADD:      + (male_count * WeightProgram.male_kg + female_count * WeightProgram.female_kg)
                    for PAX_REMOVE:   - (male_count * WeightProgram.male_kg + female_count * WeightProgram.female_kg)
                    for BAG_ADD:      + mass_kg
                    for BAG_REMOVE:   - mass_kg
                    for CARGO_OFFLOAD:- mass_kg
      weight_delta_kg = round2(signed_mass)
      index_delta     = round2(weight_delta_kg * (Compartment.arm_m - Aircraft.ref_arm_m) / Aircraft.index_c)
      # running totals over APPLIED rows, in created_at ASC order
      lmc_net_weight_delta_kg      = round2(sum of weight_delta_kg)
      lmc_absolute_weight_delta_kg = round2(sum of abs(weight_delta_kg))
      # admission test for a new change, evaluated BEFORE it is persisted
      admit = (lmc_absolute_weight_delta_kg + abs(weight_delta_kg) <= lmc_allowance_kg)
    constants:
      LMC_HARD_CAP_KG: 500
    precision: "2 decimal places, round_half_up"

  - name: calculate_audit_discrepancy
    description: "Post-departure comparison of weighed actuals against the documented figures, and the severity it triggers."
    trigger: "POST /load-audits"
    algorithm: threshold
    inputs: [LoadAudit.basis, LoadAudit.actual_pax_weight_kg, LoadAudit.actual_bag_weight_kg, LoadAudit.actual_cargo_weight_kg, LoadPlan.base_payload_kg, LoadSheet.final_payload_kg, LoadSheet.lmc_net_weight_delta_kg]
    input_set: |
      The single LoadPlan on the flight with status IN {SHEET_ISSUED, COMPUTED}
      and the highest revision_no (ties impossible: revision_no is unique per
      flight), plus, for FINAL_BASIS, the single LoadSheet on that plan with
      status IN {ACCEPTED, AMENDED}. When FINAL_BASIS is requested and no such
      sheet exists the audit is rejected with ERR_NO_ACCEPTED_SHEET.
    formula: |
      documented_pax_kg   = sum of PaxDistributionLine.line_weight_kg on that plan
      documented_bag_kg   = sum of BagAllocation.effective_weight_kg on that plan
      documented_cargo_kg = sum of CargoItem.weight_kg for rows in status LOADED on the flight
      basis figures per variant (see variants)
      pax_delta_kg   = round2(actual_pax_weight_kg   - basis_pax_kg)
      bag_delta_kg   = round2(actual_bag_weight_kg   - basis_bag_kg)
      cargo_delta_kg = round2(actual_cargo_weight_kg - basis_cargo_kg)
      total_absolute_discrepancy_kg = round2(abs(pax_delta_kg) + abs(bag_delta_kg) + abs(cargo_delta_kg))
      severity = NONE     when total_absolute_discrepancy_kg == 0
                 MINOR    when 0   <  total_absolute_discrepancy_kg <= MINOR_MAX_KG
                 MAJOR    when MINOR_MAX_KG <  total_absolute_discrepancy_kg <= MAJOR_MAX_KG
                 CRITICAL when total_absolute_discrepancy_kg >  MAJOR_MAX_KG
      status = OPEN in every case; only severity MAJOR or CRITICAL may be moved to INVESTIGATING
    constants:
      MINOR_MAX_KG: 500
      MAJOR_MAX_KG: 1000
    precision: "2 decimal places, round_half_up; the severity boundaries are inclusive on the upper end (500 is MINOR, 500.01 is MAJOR)"
    variants:
      - name: documented_basis
        when: "LoadAudit.basis == DOCUMENTED_BASIS"
        difference: |
          basis_pax_kg = documented_pax_kg, basis_bag_kg = documented_bag_kg,
          basis_cargo_kg = documented_cargo_kg — the figures as computed on the
          plan, ignoring every applied LastMinuteChange.
      - name: final_basis
        when: "LoadAudit.basis == FINAL_BASIS"
        difference: |
          basis_pax_kg = documented_pax_kg + (sum of weight_delta_kg over APPLIED
          LastMinuteChange rows on the accepted sheet whose change_kind IN
          {PAX_ADD, PAX_REMOVE}); basis_bag_kg = documented_bag_kg + (same sum
          restricted to {BAG_ADD, BAG_REMOVE}); basis_cargo_kg =
          documented_cargo_kg + (same sum restricted to {CARGO_OFFLOAD}). For the
          same weighed actuals the two bases therefore produce different deltas
          and can produce a different severity band.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: |
      Request body shape: every required input field present, every enum value a
      declared member, every weight/length/count field >= 0 (CargoItem.weight_kg
      and Compartment.length_m strictly > 0), limit in 1..100 and offset >= 0 on
      list endpoints.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every path-templated id resolves to an existing row, validated left to right"
    error_id: "ERR_AIRCRAFT_NOT_FOUND | ERR_COMPARTMENT_NOT_FOUND | ERR_RUNWAY_NOT_FOUND | ERR_PERFORMANCE_BAND_NOT_FOUND | ERR_WEIGHT_PROGRAM_NOT_FOUND | ERR_FLIGHT_NOT_FOUND | ERR_LOAD_PLAN_NOT_FOUND | ERR_PAX_LINE_NOT_FOUND | ERR_BAG_ALLOCATION_NOT_FOUND | ERR_CARGO_ITEM_NOT_FOUND | ERR_DECLARATION_NOT_FOUND | ERR_LOAD_SHEET_NOT_FOUND | ERR_LAST_MINUTE_CHANGE_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path-templated id"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_AIRCRAFT_NOT_FOUND | ERR_COMPARTMENT_NOT_FOUND | ERR_RUNWAY_NOT_FOUND | ERR_WEIGHT_PROGRAM_NOT_FOUND | ERR_FLIGHT_NOT_FOUND | ERR_LOAD_PLAN_NOT_FOUND | ERR_CARGO_ITEM_NOT_FOUND | ERR_LOAD_SHEET_NOT_FOUND"
    http_status: 404
    applies_to: "POST /compartments, POST /performance-bands, POST /flights, POST /load-plans, POST /pax-lines, POST /bag-allocations, POST /cargo-items, POST /cargo-items/{id}/assign, POST /hazmat-declarations, POST /load-sheets, POST /last-minute-changes, POST /load-audits"

  - priority: 6
    category: business_referential
    check: "uniqueness: Aircraft.registration; (Compartment.aircraft_id, code); (Runway.airport_code, designator); WeightProgram.code; (CargoItem.flight_id, awb_number); one PaxDistributionLine per (load_plan_id, compartment_id); one BagAllocation per (load_plan_id, compartment_id)"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /aircraft, POST /compartments, POST /runways, POST /weight-programs, POST /cargo-items, POST /pax-lines, POST /bag-allocations"

  - priority: 7
    category: state
    check: "configuration posture of referenced config rows: Aircraft.status == IN_SERVICE, Runway.status == OPEN, WeightProgram.status == ACTIVE"
    error_id: "ERR_AIRCRAFT_GROUNDED | ERR_RUNWAY_CLOSED | ERR_WEIGHT_PROGRAM_WITHDRAWN"
    http_status: 409
    applies_to: "POST /flights"

  - priority: 8
    category: state
    check: |
      Flight.status satisfies the called transition's from-state / precondition
      set. The explicit requirements are: PLANNING for
      POST /load-plans/{id}/compute and POST /load-plans/{id}/apply-offload;
      PLANNING or LOAD_CONTROLLED for POST /load-plans, POST /pax-lines,
      POST /bag-allocations, POST /cargo-items, POST /cargo-items/{id}/accept,
      POST /cargo-items/{id}/assign and POST /flights/{id}/cancel;
      LOAD_CONTROLLED for POST /flights/{id}/depart; DEPARTED for
      POST /flights/{id}/close and POST /load-sheets/{id}/amend; and
      LOAD_CONTROLLED, DEPARTED or CLOSED for POST /load-audits.
    error_id: ERR_FLIGHT_INVALID_STATE
    http_status: 409
    applies_to: "POST /load-plans, POST /load-plans/{id}/compute, POST /load-plans/{id}/apply-offload, POST /pax-lines, POST /bag-allocations, POST /cargo-items, POST /cargo-items/{id}/accept, POST /cargo-items/{id}/assign, POST /flights/{id}/depart, POST /flights/{id}/close, POST /flights/{id}/cancel, POST /load-sheets/{id}/amend, POST /load-audits"

  - priority: 9
    category: state
    check: "Flight.load_release_state satisfies the called operation's requirement (depart requires RELEASED; load sheet acceptance requires dg_hold_count == 0)"
    error_id: ERR_LOAD_NOT_RELEASED
    http_status: 409
    applies_to: "POST /flights/{id}/depart, POST /load-sheets/{id}/accept"

  - priority: 10
    category: state
    check: "LoadPlan.status satisfies the called transition's from-state"
    error_id: ERR_PLAN_INVALID_STATE
    http_status: 409
    applies_to: "POST /load-plans/{id}/compute, POST /load-plans/{id}/apply-offload, POST /load-plans/{id}/gate-bags, POST /load-sheets, POST /pax-lines, POST /bag-allocations, DELETE /pax-lines/{id}"

  - priority: 11
    category: state
    check: "LoadSheet.status satisfies the called transition's from-state; LastMinuteChange creation requires status IN {ISSUED, ACCEPTED}"
    error_id: ERR_SHEET_INVALID_STATE
    http_status: 409
    applies_to: "POST /load-sheets/{id}/accept, POST /load-sheets/{id}/reject, POST /load-sheets/{id}/amend, POST /last-minute-changes"

  - priority: 12
    category: state
    check: "CargoItem.status satisfies the called transition's from-state"
    error_id: ERR_CARGO_INVALID_STATE
    http_status: 409
    applies_to: "POST /cargo-items/{id}/accept, POST /cargo-items/{id}/reject, POST /cargo-items/{id}/assign, POST /hazmat-declarations"

  - priority: 13
    category: state
    check: "HazmatDeclaration.status == SUBMITTED for accept and reject"
    error_id: ERR_DECLARATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /hazmat-declarations/{id}/accept, POST /hazmat-declarations/{id}/reject"

  - priority: 14
    category: state
    check: "LoadAudit.status satisfies the called transition's from-state, and severity IN {MAJOR, CRITICAL} for investigate"
    error_id: ERR_AUDIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /load-audits/{id}/investigate, POST /load-audits/{id}/close"

  - priority: 15
    category: state
    check: "OCC: the supplied expected_flight_version equals Flight.version, and the supplied expected_load_plan_version equals LoadPlan.version"
    error_id: "ERR_STALE_FLIGHT_VERSION | ERR_STALE_LOAD_PLAN_VERSION"
    http_status: 412
    applies_to: "POST /load-plans, POST /load-sheets"

  - priority: 16
    category: business_referential
    check: "the referenced Compartment.aircraft_id equals the Flight.aircraft_id of the plan, cargo or sheet being modified"
    error_id: ERR_COMPARTMENT_NOT_ON_AIRCRAFT
    http_status: 422
    applies_to: "POST /pax-lines, POST /bag-allocations, POST /cargo-items/{id}/assign, POST /load-plans/{id}/gate-bags, POST /last-minute-changes"

  - priority: 17
    category: business_referential
    check: "Compartment.kind matches its usage: CABIN_ZONE for PaxDistributionLine and for PAX_ADD/PAX_REMOVE changes; HOLD for BagAllocation, cargo assignment, gate bags and BAG_ADD/BAG_REMOVE/CARGO_OFFLOAD changes"
    error_id: ERR_COMPARTMENT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /pax-lines, POST /bag-allocations, POST /cargo-items/{id}/assign, POST /load-plans/{id}/gate-bags, POST /last-minute-changes"

  - priority: 18
    category: business_referential
    check: "weight-program field discipline: actual_weight_kg is mandatory when the flight's WeightProgram.program_kind == ACTUAL and forbidden when it is STANDARD"
    error_id: "ERR_ACTUAL_WEIGHT_REQUIRED | ERR_ACTUAL_WEIGHT_NOT_PERMITTED"
    http_status: 422
    applies_to: "POST /pax-lines"

  - priority: 19
    category: business_referential
    check: "exactly one PerformanceBand exists for (Flight.departure_runway_id, Aircraft.type_code) whose interval contains Flight.outside_air_temp_c under temp_lo_c <= t < temp_hi_c"
    error_id: ERR_NO_PERFORMANCE_BAND
    http_status: 422
    applies_to: "POST /flights, PATCH /flights/{id}/conditions"

  - priority: 20
    category: business_referential
    check: "a LoadAudit with basis == FINAL_BASIS requires a LoadSheet in status ACCEPTED or AMENDED on the flight's highest-revision_no plan"
    error_id: ERR_NO_ACCEPTED_SHEET
    http_status: 409
    applies_to: "POST /load-audits"

  - priority: 21
    category: business_safety
    check: "a HazmatDeclaration may only be created for a CargoItem whose is_dangerous_goods == true"
    error_id: ERR_NOT_DANGEROUS_GOODS
    http_status: 409
    applies_to: "POST /hazmat-declarations"

  - priority: 22
    category: business_safety
    check: "HazmatDeclaration.quantity_kg <= parent CargoItem.weight_kg"
    error_id: ERR_DG_QUANTITY_EXCEEDS_ITEM
    http_status: 422
    applies_to: "POST /hazmat-declarations"

  - priority: 23
    category: business_safety
    check: "accepting a declaration whose segregation_group is FLAMMABLE is refused when a declaration in ACCEPTED status on another CargoItem sharing the same assigned_compartment_id has segregation_group OXIDISER, and vice versa; CORROSIVE and INERT are compatible with every group"
    error_id: ERR_DG_SEGREGATION_CONFLICT
    http_status: 409
    applies_to: "POST /hazmat-declarations/{id}/accept"

  - priority: 24
    category: business_safety
    check: "every CargoItem on the flight with is_dangerous_goods == true and status IN {BOOKED, ACCEPTED, LOADED} has a HazmatDeclaration in ACCEPTED status before a load sheet may be issued; a still-undeclared consignment blocks issuance even though it is not yet in the payload"
    error_id: ERR_DG_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /load-sheets"

  - priority: 25
    category: business_safety
    check: "segregation of duties: the X-User-ID accepting or rejecting a load sheet must differ from LoadSheet.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /load-sheets/{id}/accept, POST /load-sheets/{id}/reject"

  - priority: 26
    category: business_safety
    check: "segregation of duties: the X-User-ID closing a load audit must differ from every HazmatDeclaration.accepted_by_user_id recorded on that flight's cargo"
    error_id: ERR_AUDIT_SEGREGATION_CONFLICT
    http_status: 409
    applies_to: "POST /load-audits/{id}/close"

  - priority: 27
    category: business_safety
    check: "male_count + female_count + child_count on a PaxDistributionLine must not exceed Compartment.seat_capacity; infant_count is excluded because lap infants consume no seat"
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /pax-lines"

  - priority: 28
    category: business_safety
    check: "for each HOLD compartment, BagAllocation.effective_weight_kg plus the weight_kg of every CargoItem assigned to it in status IN {ACCEPTED, LOADED} must not exceed Compartment.max_weight_kg"
    error_id: ERR_COMPARTMENT_OVERLOAD
    http_status: 422
    applies_to: "POST /bag-allocations, POST /cargo-items/{id}/assign, POST /load-plans/{id}/gate-bags"

  - priority: 29
    category: business_safety
    check: "for each HOLD compartment, (BagAllocation.effective_weight_kg + assigned cargo weight) / Compartment.length_m must not exceed Compartment.running_load_limit_kg_per_m"
    error_id: ERR_RUNNING_LOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /bag-allocations, POST /cargo-items/{id}/assign, POST /load-plans/{id}/gate-bags"

  - priority: 30
    category: business_safety
    check: "calculate_balance_chain must yield envelope_ok == true; a compute, offload or gate-bag absorption that would leave mac_zfw_pct or mac_tow_pct outside its weight-adjusted limits is refused and no field is persisted"
    error_id: ERR_CG_OUT_OF_ENVELOPE
    http_status: 422
    applies_to: "POST /load-plans/{id}/compute, POST /load-plans/{id}/apply-offload, POST /load-plans/{id}/gate-bags"

  - priority: 31
    category: business_temporal
    check: "Flight.scheduled_on_block_utc > Flight.scheduled_off_block_utc"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /flights"

  - priority: 32
    category: business_temporal
    check: |
      Aircraft occupancy, CLOSED-interval semantics with a trailing turnaround
      buffer: flight F occupies
      [F.scheduled_off_block_utc, F.scheduled_on_block_utc + 45 minutes]
      on F.aircraft_id, inclusive at BOTH ends. A new flight is refused when its
      occupancy interval shares at least one instant with the occupancy interval
      of an existing flight on the same aircraft_id whose status IN
      {PLANNING, LOAD_CONTROLLED, DEPARTED}. Intervals that merely touch at an
      endpoint DO collide.
    error_id: ERR_AIRCRAFT_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /flights"

  - priority: 33
    category: business_temporal
    check: |
      Runway departure slot, HALF-OPEN window with aggregate capacity: the window
      of a departure at instant T is [W, W + 10 minutes) where W is T floored to
      the nearest 10-minute boundary measured from the top of the hour. A new
      flight is refused when the count of existing flights on the same
      departure_runway_id with status IN {PLANNING, LOAD_CONTROLLED, DEPARTED}
      whose scheduled_off_block_utc falls inside the SAME window already equals
      Runway.slot_capacity_per_window. A departure exactly at W + 10 minutes
      belongs to the NEXT window and never collides.
    error_id: ERR_RUNWAY_SLOT_FULL
    http_status: 409
    applies_to: "POST /flights"

  - priority: 34
    category: business_fiscal
    check: "fuel figures are consistent: taxi_fuel_kg <= ramp_fuel_kg and trip_fuel_kg <= ramp_fuel_kg - taxi_fuel_kg"
    error_id: ERR_FUEL_FIGURES_INCONSISTENT
    http_status: 422
    applies_to: "POST /flights, PATCH /flights/{id}/conditions"

  - priority: 35
    category: business_fiscal
    check: "calculate_offload_selection must relieve at least the excess weight; an empty or insufficient candidate set is refused"
    error_id: ERR_OFFLOAD_INSUFFICIENT
    http_status: 409
    applies_to: "POST /load-plans/{id}/apply-offload"

  - priority: 36
    category: business_fiscal
    check: "lmc_absolute_weight_delta_kg + abs(new weight_delta_kg) <= LoadSheet.lmc_allowance_kg"
    error_id: ERR_LMC_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /last-minute-changes"

  - priority: 37
    category: business_fiscal
    check: "closing a load audit requires a non-empty finding_note"
    error_id: ERR_FINDING_NOTE_REQUIRED
    http_status: 422
    applies_to: "POST /load-audits/{id}/close"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- Aircraft
  - method: POST
    path: "/aircraft"
    description: "Register an airframe with its structural limits, index constants and CG envelope."
    roles: [LoadControlAdmin]
    code: 201
    input: [registration, type_code, basic_empty_weight_kg, basic_index, max_takeoff_weight_kg, max_landing_weight_kg, max_zero_fuel_weight_kg, max_taxi_weight_kg, ref_arm_m, lemac_m, mac_length_m, index_c, index_k, fuel_arm_m, seat_count, zfw_fwd_limit_pct_mac, zfw_aft_limit_pct_mac, tow_fwd_limit_pct_mac, tow_aft_limit_pct_mac, tow_knee_weight_kg, tow_aft_knee_adjust_pct_mac]
    output: Aircraft
    side_effects: ["Aircraft.status initialised to IN_SERVICE"]

  - method: GET
    path: "/aircraft/{id}"
    description: "Read one airframe."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: GET
    path: "/aircraft"
    description: "List airframes."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Aircraft[]
    side_effects: []

  - method: POST
    path: "/aircraft/{id}/ground"
    description: "Ground an airframe so it can no longer be assigned to new flights."
    roles: [LoadControlAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["Aircraft.status set to GROUNDED", "Aircraft.version incremented by 1"]

  # ------------------------------------------------------------- Compartment
  - method: POST
    path: "/compartments"
    description: "Declare a cabin zone or hold on an airframe."
    roles: [LoadControlAdmin]
    code: 201
    input: [aircraft_id, code, kind, arm_m, max_weight_kg, running_load_limit_kg_per_m, length_m, "seat_capacity?"]
    output: Compartment
    side_effects: []

  - method: GET
    path: "/compartments/{id}"
    description: "Read one compartment."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: Compartment
    side_effects: []

  - method: GET
    path: "/aircraft/{id}/compartments"
    description: "List the compartments of one airframe (reverse reachability for Compartment.aircraft_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Compartment[]
    side_effects: []

  # ------------------------------------------------------------------ Runway
  - method: POST
    path: "/runways"
    description: "Register a departure runway with its elevation and slot capacity."
    roles: [LoadControlAdmin]
    code: 201
    input: [airport_code, designator, elevation_ft, length_m, "slot_capacity_per_window?"]
    output: Runway
    side_effects: ["Runway.status initialised to OPEN"]

  - method: GET
    path: "/runways/{id}"
    description: "Read one runway."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: Runway
    side_effects: []

  - method: POST
    path: "/runways/{id}/close"
    description: "Close a runway so it can no longer be selected for new flights."
    roles: [LoadControlAdmin]
    code: 200
    input: []
    output: Runway
    side_effects: ["Runway.status set to CLOSED", "Runway.version incremented by 1"]

  # -------------------------------------------------------- PerformanceBand
  - method: POST
    path: "/performance-bands"
    description: "Publish a temperature band and its sea-level performance limit weight for one runway and aircraft type."
    roles: [LoadControlAdmin]
    code: 201
    input: [runway_id, aircraft_type_code, temp_lo_c, temp_hi_c, base_limit_weight_kg]
    output: PerformanceBand
    side_effects: []

  - method: GET
    path: "/performance-bands/{id}"
    description: "Read one performance band."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: PerformanceBand
    side_effects: []

  - method: GET
    path: "/runways/{id}/performance-bands"
    description: "List the performance bands of one runway (reverse reachability for PerformanceBand.runway_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["aircraft_type_code?", "limit?", "offset?"]
    output: PerformanceBand[]
    side_effects: []

  # ----------------------------------------------------------- WeightProgram
  - method: POST
    path: "/weight-programs"
    description: "Publish a standard or actual passenger weight program with its regulatory documentation reference."
    roles: [LoadControlAdmin]
    code: 201
    input: [code, program_kind, male_kg, female_kg, child_kg, infant_kg, checked_bag_kg, documentation_ref]
    output: WeightProgram
    side_effects: ["WeightProgram.status initialised to ACTIVE"]

  - method: GET
    path: "/weight-programs/{id}"
    description: "Read one weight program."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: WeightProgram
    side_effects: []

  - method: POST
    path: "/weight-programs/{id}/withdraw"
    description: "Withdraw a weight program so it can no longer be attached to new flights."
    roles: [LoadControlAdmin]
    code: 200
    input: []
    output: WeightProgram
    side_effects: ["WeightProgram.status set to WITHDRAWN", "WeightProgram.version incremented by 1"]

  # ------------------------------------------------------------------ Flight
  - method: POST
    path: "/flights"
    description: "Create a flight, select its performance band and derive its dry operating figures and allowed payload."
    roles: [LoadController, LoadControlAdmin]
    code: 201
    input: [flight_number, aircraft_id, departure_runway_id, weight_program_id, scheduled_off_block_utc, scheduled_on_block_utc, crew_weight_kg, crew_arm_m, ramp_fuel_kg, taxi_fuel_kg, trip_fuel_kg, outside_air_temp_c, headwind_component_kt, runway_condition]
    output: Flight
    side_effects:
      - "calculate_dry_operating_weight sets dry_operating_weight_kg and dry_operating_index"
      - "calculate_performance_limited_takeoff_weight sets performance_limited_takeoff_weight_kg"
      - "calculate_allowed_payload sets allowed_payload_kg and limiting_factor"
      - "Flight.status initialised to PLANNING, load_release_state to OPEN, dg_hold_count to 0"

  - method: GET
    path: "/flights/{id}"
    description: "Read one flight with its derived weight limits."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: GET
    path: "/flights"
    description: "List flights filtered by airframe, runway, weight program or status (reverse reachability for Flight.aircraft_id, Flight.departure_runway_id and Flight.weight_program_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["aircraft_id?", "departure_runway_id?", "weight_program_id?", "status?", "limit?", "offset?"]
    output: Flight[]
    side_effects: []

  - method: PATCH
    path: "/flights/{id}/conditions"
    description: "Revise the departure conditions or fuel figures of a flight and re-derive its weight limits."
    roles: [LoadController]
    code: 200
    input: ["outside_air_temp_c?", "headwind_component_kt?", "runway_condition?", "ramp_fuel_kg?", "taxi_fuel_kg?", "trip_fuel_kg?"]
    output: Flight
    side_effects:
      - "calculate_performance_limited_takeoff_weight re-run"
      - "calculate_allowed_payload re-run, refreshing allowed_payload_kg and limiting_factor"
      - "Flight.version incremented by 1"

  - method: POST
    path: "/flights/{id}/depart"
    description: "Record off-block departure of a load-controlled, released flight."
    roles: [LoadController]
    code: 200
    input: []
    output: Flight
    side_effects:
      - "Flight.status LOAD_CONTROLLED -> DEPARTED"
      - "every CargoItem in ACCEPTED status with assigned_compartment_id == null transitions to DEFERRED"
      - "Flight.version incremented by 1"

  - method: POST
    path: "/flights/{id}/close"
    description: "Close a departed flight once every load audit on it is closed."
    roles: [LoadControlAdmin]
    code: 200
    input: []
    output: Flight
    side_effects: ["Flight.status DEPARTED -> CLOSED", "Flight.version incremented by 1"]

  - method: POST
    path: "/flights/{id}/cancel"
    description: "Cancel a flight, superseding its plans and sheets and offloading its cargo."
    roles: [LoadControlAdmin]
    code: 200
    input: []
    output: Flight
    side_effects:
      - "Flight.status -> CANCELLED"
      - "every non-terminal LoadPlan on the flight transitions to SUPERSEDED"
      - "every LoadSheet in ISSUED or REJECTED_BY_CAPTAIN status transitions to SUPERSEDED"
      - "every CargoItem in BOOKED, ACCEPTED or LOADED status transitions to OFFLOADED"
      - "Flight.version incremented by 1"

  # ---------------------------------------------------------------- LoadPlan
  - method: POST
    path: "/load-plans"
    description: "Open a load plan on a flight; supersedes the flight's prior non-terminal plan. Guarded by OCC on Flight.version."
    roles: [LoadController]
    code: 201
    input: [flight_id, expected_flight_version, "gate_bag_policy?", "offload_strategy?", "rounding_mode?"]
    output: LoadPlan
    side_effects:
      - "LoadPlan.revision_no set to the flight's highest existing revision_no + 1, or 1 for the first plan"
      - "every prior LoadPlan on the flight in DRAFT, COMPUTED, RESTRICTED or SHEET_ISSUED status transitions to SUPERSEDED"
      - "every LoadSheet on those plans in ISSUED or REJECTED_BY_CAPTAIN status transitions to SUPERSEDED"
      - "increments Flight.version by 1"

  - method: GET
    path: "/load-plans/{id}"
    description: "Read one load plan with its balance chain."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: LoadPlan
    side_effects: []

  - method: GET
    path: "/flights/{id}/load-plans"
    description: "List the load plans of one flight (reverse reachability for LoadPlan.flight_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LoadPlan[]
    side_effects: []

  - method: POST
    path: "/load-plans/{id}/compute"
    description: "Compute the plan: payload, underload, index chain, %MAC at zero-fuel and takeoff weight, and the envelope verdict."
    roles: [LoadController]
    code: 200
    input: []
    output: LoadPlan
    side_effects:
      - "calculate_pax_line_weight sets line_weight_kg and index_delta on every PaxDistributionLine of the plan"
      - "calculate_bag_allocation_weight sets effective_weight_kg and index_delta on every BagAllocation of the plan"
      - "calculate_base_payload sets base_payload_kg, frozen_underload_kg, restriction_status, planned_payload_kg and underload_kg"
      - "calculate_balance_chain sets zero_fuel_weight_kg, index_zfw, mac_zfw_pct, takeoff_weight_kg, index_tow, mac_tow_pct, taxi_weight_kg, landing_weight_kg and envelope_ok"
      - "LoadPlan.status DRAFT -> COMPUTED, or DRAFT -> RESTRICTED when frozen_underload_kg < 0"
      - "Flight.status PLANNING -> LOAD_CONTROLLED only when the plan reaches COMPUTED"
      - "LoadPlan.version incremented by 1"

  - method: POST
    path: "/load-plans/{id}/apply-offload"
    description: "Apply the plan's offload strategy to relieve the weight restriction and recompute the balance chain."
    roles: [LoadController]
    code: 200
    input: []
    output: LoadPlan
    side_effects:
      - "calculate_offload_selection selects the consignments; each transitions ACCEPTED -> OFFLOADED with assigned_compartment_id cleared"
      - "calculate_base_payload refreshes planned_payload_kg and underload_kg"
      - "calculate_balance_chain refreshes the whole index and %MAC chain"
      - "LoadPlan.status RESTRICTED -> COMPUTED"
      - "Flight.status PLANNING -> LOAD_CONTROLLED"
      - "LoadPlan.version incremented by 1"

  - method: GET
    path: "/load-plans/{id}/offload-preview"
    description: "Read-only preview of calculate_offload_selection for the plan's current strategy; persists nothing."
    roles: [LoadControlAdmin, LoadController]
    code: 200
    input: []
    output: "{ strategy: string, excess_weight_kg: number, offloaded_total_kg: number, offloaded_piece_count: integer, offloaded_awb_numbers: string[] }"
    side_effects: []

  - method: POST
    path: "/load-plans/{id}/gate-bags"
    description: "Present a gate-checked bag to a computed plan; it is absorbed into the live underload or deferred."
    roles: [RampAgent, LoadController]
    code: 201
    input: [awb_number, weight_kg, length_m, compartment_id]
    output: CargoItem
    side_effects:
      - "a CargoItem with item_kind GATE_BAG and offload_priority_rank 4 is created"
      - "when LoadPlan.gate_bag_policy == ABSORB_INTO_UNDERLOAD and weight_kg <= LoadPlan.underload_kg the bag is ACCEPTED, assigned to the compartment and calculate_base_payload plus calculate_balance_chain are re-run"
      - "otherwise the bag transitions BOOKED -> DEFERRED and LoadPlan.deferred_bag_weight_kg increases by weight_kg"
      - "LoadPlan.restriction_status and frozen_underload_kg are NOT re-derived"
      - "LoadPlan.version incremented by 1"

  # ------------------------------------------------------ PaxDistributionLine
  - method: POST
    path: "/pax-lines"
    description: "Seat a passenger mix in one cabin zone of a load plan."
    roles: [LoadController]
    code: 201
    input: [load_plan_id, compartment_id, "male_count?", "female_count?", "child_count?", "infant_count?", "actual_weight_kg?"]
    output: PaxDistributionLine
    side_effects:
      - "calculate_pax_line_weight sets line_weight_kg and index_delta"
      - "a COMPUTED LoadPlan is returned to DRAFT and its balance fields reset to 0"
      - "Flight.status LOAD_CONTROLLED -> PLANNING when the plan is returned to DRAFT"

  - method: GET
    path: "/pax-lines/{id}"
    description: "Read one passenger distribution line."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: PaxDistributionLine
    side_effects: []

  - method: GET
    path: "/pax-lines"
    description: "List passenger distribution lines by plan or compartment (reverse reachability for PaxDistributionLine.load_plan_id and compartment_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["load_plan_id?", "compartment_id?", "limit?", "offset?"]
    output: PaxDistributionLine[]
    side_effects: []

  - method: DELETE
    path: "/pax-lines/{id}"
    description: "Remove a passenger distribution line from a plan that has not been sheeted."
    roles: [LoadController]
    code: 204
    input: []
    output: null
    side_effects:
      - "the PaxDistributionLine row is deleted"
      - "a COMPUTED LoadPlan is returned to DRAFT and its balance fields reset to 0"
      - "Flight.status LOAD_CONTROLLED -> PLANNING when the plan is returned to DRAFT"

  # ----------------------------------------------------------- BagAllocation
  - method: POST
    path: "/bag-allocations"
    description: "Allocate checked bags to one hold of a load plan."
    roles: [LoadController, RampAgent]
    code: 201
    input: [load_plan_id, compartment_id, bag_count, "bag_weight_kg?"]
    output: BagAllocation
    side_effects:
      - "calculate_bag_allocation_weight sets effective_weight_kg and index_delta"
      - "a COMPUTED LoadPlan is returned to DRAFT and its balance fields reset to 0"
      - "Flight.status LOAD_CONTROLLED -> PLANNING when the plan is returned to DRAFT"

  - method: GET
    path: "/bag-allocations/{id}"
    description: "Read one bag allocation."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: BagAllocation
    side_effects: []

  - method: GET
    path: "/bag-allocations"
    description: "List bag allocations by plan or compartment (reverse reachability for BagAllocation.load_plan_id and compartment_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["load_plan_id?", "compartment_id?", "limit?", "offset?"]
    output: BagAllocation[]
    side_effects: []

  # -------------------------------------------------------------- CargoItem
  - method: POST
    path: "/cargo-items"
    description: "Book a consignment onto a flight; non-dangerous, non-gate-bag consignments are auto-accepted."
    roles: [RampAgent]
    code: 201
    input: [flight_id, awb_number, item_kind, weight_kg, length_m, "is_dangerous_goods?"]
    output: CargoItem
    side_effects:
      - "CargoItem.offload_priority_rank set from item_kind (COMPANY 1, GENERAL 2, MAIL 3, GATE_BAG 4)"
      - "CargoItem.status set to ACCEPTED when item_kind != GATE_BAG and is_dangerous_goods == false, otherwise BOOKED"

  - method: GET
    path: "/cargo-items/{id}"
    description: "Read one consignment."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: CargoItem
    side_effects: []

  - method: GET
    path: "/cargo-items"
    description: "List consignments by flight, compartment, status or kind (reverse reachability for CargoItem.flight_id and assigned_compartment_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["flight_id?", "assigned_compartment_id?", "status?", "item_kind?", "limit?", "offset?"]
    output: CargoItem[]
    side_effects: []

  - method: POST
    path: "/cargo-items/{id}/assign"
    description: "Stow a consignment in a hold, subject to the compartment weight and running-load limits."
    roles: [RampAgent, LoadController]
    code: 200
    input: [assigned_compartment_id]
    output: CargoItem
    side_effects:
      - "CargoItem.assigned_compartment_id set"
      - "a COMPUTED LoadPlan on the flight is returned to DRAFT and its balance fields reset to 0"
      - "CargoItem.version incremented by 1"

  - method: POST
    path: "/cargo-items/{id}/accept"
    description: "Accept a booked consignment for carriage; dangerous goods require an accepted declaration first."
    roles: [RampAgent]
    code: 200
    input: []
    output: CargoItem
    side_effects: ["CargoItem.status BOOKED -> ACCEPTED", "CargoItem.version incremented by 1"]

  - method: POST
    path: "/cargo-items/{id}/reject"
    description: "Refuse a booked consignment."
    roles: [RampAgent]
    code: 200
    input: []
    output: CargoItem
    side_effects: ["CargoItem.status BOOKED -> REJECTED", "assigned_compartment_id cleared", "CargoItem.version incremented by 1"]

  # -------------------------------------------------------- HazmatDeclaration
  - method: POST
    path: "/hazmat-declarations"
    description: "Declare dangerous goods on a consignment; places the flight's load release on hold."
    roles: [RampAgent]
    code: 201
    input: [cargo_item_id, un_number, imo_class, packing_group, segregation_group, quantity_kg]
    output: HazmatDeclaration
    side_effects:
      - "HazmatDeclaration.status initialised to SUBMITTED and notoc_issued to false"
      - "Flight.dg_hold_count incremented by 1 and Flight.load_release_state set to HELD_FOR_DG"
      - "Flight.version incremented by 1"

  - method: GET
    path: "/hazmat-declarations/{id}"
    description: "Read one dangerous-goods declaration."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: HazmatDeclaration
    side_effects: []

  - method: GET
    path: "/cargo-items/{id}/hazmat-declarations"
    description: "List the declarations of one consignment (reverse reachability for HazmatDeclaration.cargo_item_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HazmatDeclaration[]
    side_effects: []

  - method: POST
    path: "/hazmat-declarations/{id}/accept"
    description: "Accept a dangerous-goods declaration after the segregation check."
    roles: [DangerousGoodsOfficer]
    code: 200
    input: []
    output: HazmatDeclaration
    side_effects:
      - "HazmatDeclaration.status SUBMITTED -> ACCEPTED and accepted_by_user_id set to X-User-ID"
      - "Flight.dg_hold_count decremented by 1; load_release_state HELD_FOR_DG -> OPEN when it reaches 0"
      - "Flight.version incremented by 1"

  - method: POST
    path: "/hazmat-declarations/{id}/reject"
    description: "Reject a dangerous-goods declaration and refuse its consignment."
    roles: [DangerousGoodsOfficer]
    code: 200
    input: []
    output: HazmatDeclaration
    side_effects:
      - "HazmatDeclaration.status SUBMITTED -> REJECTED"
      - "the parent CargoItem transitions BOOKED -> REJECTED"
      - "Flight.dg_hold_count decremented by 1; load_release_state HELD_FOR_DG -> OPEN when it reaches 0"
      - "Flight.version incremented by 1"

  # --------------------------------------------------------------- LoadSheet
  - method: POST
    path: "/load-sheets"
    description: "Issue a load sheet snapshotting the plan's balance figures and the weight-program documentation. Guarded by OCC on LoadPlan.version."
    roles: [LoadController]
    code: 201
    input: [load_plan_id, expected_load_plan_version]
    output: LoadSheet
    side_effects:
      - "LoadSheet.sheet_no set to the plan's highest existing sheet_no + 1, or 1 for the first sheet"
      - "issued_by_user_id set to X-User-ID; issued_takeoff_weight_kg, issued_index_tow, issued_payload_kg and weight_program_documentation_ref snapshotted"
      - "notoc_reference set when the flight carries a HazmatDeclaration in ACCEPTED status"
      - "calculate_lmc_allowance sets lmc_allowance_kg; the final_* fields are seeded from the issued_* snapshots"
      - "every prior LoadSheet on the plan in ISSUED or REJECTED_BY_CAPTAIN status transitions to SUPERSEDED"
      - "LoadPlan.status COMPUTED -> SHEET_ISSUED"
      - "increments LoadPlan.version by 1"

  - method: GET
    path: "/load-sheets/{id}"
    description: "Read one load sheet with its issued and final figures."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: LoadSheet
    side_effects: []

  - method: GET
    path: "/load-plans/{id}/load-sheets"
    description: "List the load sheets of one plan (reverse reachability for LoadSheet.load_plan_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LoadSheet[]
    side_effects: []

  - method: POST
    path: "/load-sheets/{id}/accept"
    description: "Captain acceptance of the load sheet; releases the load and loads the stowed cargo."
    roles: [Captain]
    code: 200
    input: []
    output: LoadSheet
    side_effects:
      - "LoadSheet.status ISSUED -> ACCEPTED and accepted_by_user_id set to X-User-ID"
      - "Flight.load_release_state OPEN -> RELEASED"
      - "every CargoItem in ACCEPTED status with assigned_compartment_id != null transitions to LOADED"
      - "every HazmatDeclaration in ACCEPTED status on those consignments has notoc_issued set to true"
      - "LoadSheet.version incremented by 1"

  - method: POST
    path: "/load-sheets/{id}/reject"
    description: "Captain rejection of the load sheet; reopens the plan for correction."
    roles: [Captain]
    code: 200
    input: []
    output: LoadSheet
    side_effects:
      - "LoadSheet.status ISSUED -> REJECTED_BY_CAPTAIN"
      - "LoadPlan.status SHEET_ISSUED -> COMPUTED"
      - "Flight.load_release_state left unchanged and no CargoItem is touched"
      - "LoadSheet.version incremented by 1"

  - method: POST
    path: "/load-sheets/{id}/amend"
    description: "Post-departure amendment: freeze the sheet's final figures from the applied last-minute changes."
    roles: [LoadController]
    code: 200
    input: []
    output: LoadSheet
    side_effects:
      - "LoadSheet.status ACCEPTED -> AMENDED"
      - "final_takeoff_weight_kg, final_index_tow, final_mac_tow_pct and final_payload_kg recomputed"
      - "LoadSheet.version incremented by 1"

  # -------------------------------------------------------- LastMinuteChange
  - method: POST
    path: "/last-minute-changes"
    description: "Record a last-minute change against an issued or accepted load sheet, within its allowance."
    roles: [LoadController]
    code: 201
    input: [load_sheet_id, change_kind, compartment_id, "male_count?", "female_count?", "mass_kg?"]
    output: LastMinuteChange
    side_effects:
      - "calculate_lmc_allowance sets weight_delta_kg and index_delta; status initialised to APPLIED"
      - "LoadSheet.lmc_net_weight_delta_kg, lmc_absolute_weight_delta_kg, final_takeoff_weight_kg, final_index_tow, final_mac_tow_pct and final_payload_kg refreshed"
      - "LoadSheet.version incremented by 1"

  - method: GET
    path: "/last-minute-changes/{id}"
    description: "Read one last-minute change."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: LastMinuteChange
    side_effects: []

  - method: GET
    path: "/last-minute-changes"
    description: "List last-minute changes by sheet or compartment (reverse reachability for LastMinuteChange.load_sheet_id and compartment_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["load_sheet_id?", "compartment_id?", "status?", "limit?", "offset?"]
    output: LastMinuteChange[]
    side_effects: []

  - method: POST
    path: "/last-minute-changes/{id}/reverse"
    description: "Reverse an applied last-minute change, returning both the sheet's index and its allowance consumption to their prior values."
    roles: [LoadController]
    code: 200
    input: []
    output: LastMinuteChange
    side_effects:
      - "LastMinuteChange.status APPLIED -> REVERSED"
      - "LoadSheet.lmc_net_weight_delta_kg and lmc_absolute_weight_delta_kg recomputed over the remaining APPLIED rows"
      - "LoadSheet.final_takeoff_weight_kg, final_index_tow, final_mac_tow_pct and final_payload_kg recomputed"
      - "LastMinuteChange.version incremented by 1"

  # --------------------------------------------------------------- LoadAudit
  - method: POST
    path: "/load-audits"
    description: "Open a load audit on a flight whose load is already controlled, comparing weighed actuals against the chosen basis. Permitted while Flight.status IN {LOAD_CONTROLLED, DEPARTED, CLOSED}; DOCUMENTED_BASIS may be requested from any of the three, FINAL_BASIS additionally requires an ACCEPTED or AMENDED load sheet on the flight's highest-revision_no plan."
    roles: [AuditInspector]
    code: 201
    input: [flight_id, basis, actual_pax_weight_kg, actual_bag_weight_kg, actual_cargo_weight_kg]
    output: LoadAudit
    side_effects:
      - "calculate_audit_discrepancy sets pax_delta_kg, bag_delta_kg, cargo_delta_kg, total_absolute_discrepancy_kg and severity"
      - "LoadAudit.status initialised to OPEN"

  - method: GET
    path: "/load-audits/{id}"
    description: "Read one load audit."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: []
    output: LoadAudit
    side_effects: []

  - method: GET
    path: "/flights/{id}/load-audits"
    description: "List the load audits of one flight (reverse reachability for LoadAudit.flight_id)."
    roles: [LoadControlAdmin, LoadController, RampAgent, DangerousGoodsOfficer, Captain, AuditInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LoadAudit[]
    side_effects: []

  - method: POST
    path: "/load-audits/{id}/investigate"
    description: "Open an investigation on a major or critical discrepancy."
    roles: [AuditInspector]
    code: 200
    input: []
    output: LoadAudit
    side_effects: ["LoadAudit.status OPEN -> INVESTIGATING", "LoadAudit.version incremented by 1"]

  - method: POST
    path: "/load-audits/{id}/close"
    description: "Close a load audit with a finding note, subject to the audit segregation-of-duties rule."
    roles: [AuditInspector]
    code: 200
    input: [finding_note]
    output: LoadAudit
    side_effects: ["LoadAudit.status -> CLOSED", "closed_by_user_id set to X-User-ID", "LoadAudit.version incremented by 1"]

  # ------------------------------------------------------- test-driving clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Test-driving endpoint that positions the server's logical clock. Before any
      call to this endpoint the logical clock reads exactly the fixed startup
      default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock
      time. Every scheduled off-block, slot window and audit timestamp is
      evaluated against this logical clock.
    roles: [LoadControlAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["the logical clock is set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent or naming an undeclared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum member, negative weight/count, or out-of-range pagination parameter"
  - id: ERR_AIRCRAFT_NOT_FOUND
    http: 404
    condition: "aircraft id in the path or body does not exist"
  - id: ERR_COMPARTMENT_NOT_FOUND
    http: 404
    condition: "compartment id in the path or body does not exist"
  - id: ERR_RUNWAY_NOT_FOUND
    http: 404
    condition: "runway id in the path or body does not exist"
  - id: ERR_PERFORMANCE_BAND_NOT_FOUND
    http: 404
    condition: "performance band id in the path does not exist"
  - id: ERR_WEIGHT_PROGRAM_NOT_FOUND
    http: 404
    condition: "weight program id in the path or body does not exist"
  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "flight id in the path or body does not exist"
  - id: ERR_LOAD_PLAN_NOT_FOUND
    http: 404
    condition: "load plan id in the path or body does not exist"
  - id: ERR_PAX_LINE_NOT_FOUND
    http: 404
    condition: "passenger distribution line id in the path does not exist"
  - id: ERR_BAG_ALLOCATION_NOT_FOUND
    http: 404
    condition: "bag allocation id in the path does not exist"
  - id: ERR_CARGO_ITEM_NOT_FOUND
    http: 404
    condition: "cargo item id in the path or body does not exist"
  - id: ERR_DECLARATION_NOT_FOUND
    http: 404
    condition: "hazmat declaration id in the path does not exist"
  - id: ERR_LOAD_SHEET_NOT_FOUND
    http: 404
    condition: "load sheet id in the path or body does not exist"
  - id: ERR_LAST_MINUTE_CHANGE_NOT_FOUND
    http: 404
    condition: "last-minute-change id in the path does not exist"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "load audit id in the path does not exist"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "a uniqueness constraint from validation priority 6 is violated"
  - id: ERR_AIRCRAFT_GROUNDED
    http: 409
    condition: "the referenced Aircraft.status == GROUNDED at flight creation"
  - id: ERR_RUNWAY_CLOSED
    http: 409
    condition: "the referenced Runway.status == CLOSED at flight creation"
  - id: ERR_WEIGHT_PROGRAM_WITHDRAWN
    http: 409
    condition: "the referenced WeightProgram.status == WITHDRAWN at flight creation"
  - id: ERR_FLIGHT_INVALID_STATE
    http: 409
    condition: "Flight.status does not permit the requested operation"
  - id: ERR_LOAD_NOT_RELEASED
    http: 409
    condition: "departure attempted while Flight.load_release_state != RELEASED, or sheet acceptance attempted while Flight.dg_hold_count > 0"
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "LoadPlan.status does not permit the requested operation"
  - id: ERR_SHEET_INVALID_STATE
    http: 409
    condition: "LoadSheet.status does not permit the requested operation"
  - id: ERR_CARGO_INVALID_STATE
    http: 409
    condition: "CargoItem.status does not permit the requested operation"
  - id: ERR_DECLARATION_INVALID_STATE
    http: 409
    condition: "HazmatDeclaration.status != SUBMITTED when accept or reject is called"
  - id: ERR_AUDIT_INVALID_STATE
    http: 409
    condition: "LoadAudit.status does not permit the requested operation, or investigate called on severity NONE or MINOR"
  - id: ERR_STALE_FLIGHT_VERSION
    http: 412
    condition: "expected_flight_version does not equal the current Flight.version"
  - id: ERR_STALE_LOAD_PLAN_VERSION
    http: 412
    condition: "expected_load_plan_version does not equal the current LoadPlan.version"
  - id: ERR_COMPARTMENT_NOT_ON_AIRCRAFT
    http: 422
    condition: "the referenced compartment belongs to a different aircraft than the flight's"
  - id: ERR_COMPARTMENT_KIND_MISMATCH
    http: 422
    condition: "a CABIN_ZONE compartment is used for bags or cargo, or a HOLD compartment is used for passengers"
  - id: ERR_ACTUAL_WEIGHT_REQUIRED
    http: 422
    condition: "actual_weight_kg omitted while the flight's weight program is ACTUAL"
  - id: ERR_ACTUAL_WEIGHT_NOT_PERMITTED
    http: 422
    condition: "actual_weight_kg supplied while the flight's weight program is STANDARD"
  - id: ERR_NO_PERFORMANCE_BAND
    http: 422
    condition: "no performance band covers the flight's runway, aircraft type and outside air temperature"
  - id: ERR_NO_ACCEPTED_SHEET
    http: 409
    condition: "a FINAL_BASIS audit is requested but the flight has no ACCEPTED or AMENDED load sheet"
  - id: ERR_NOT_DANGEROUS_GOODS
    http: 409
    condition: "a hazmat declaration is submitted for a consignment whose is_dangerous_goods == false"
  - id: ERR_DG_QUANTITY_EXCEEDS_ITEM
    http: 422
    condition: "HazmatDeclaration.quantity_kg exceeds the parent CargoItem.weight_kg"
  - id: ERR_DG_SEGREGATION_CONFLICT
    http: 409
    condition: "acceptance would place FLAMMABLE and OXIDISER dangerous goods in the same compartment"
  - id: ERR_DG_NOT_ACCEPTED
    http: 409
    condition: "load sheet issuance attempted while a dangerous-goods consignment on the flight has no accepted declaration"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the captain acting on a load sheet is the same user id that issued it"
  - id: ERR_AUDIT_SEGREGATION_CONFLICT
    http: 409
    condition: "the user closing a load audit also accepted a dangerous-goods declaration on that flight"
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 422
    condition: "seated passengers on a cabin-zone line exceed Compartment.seat_capacity"
  - id: ERR_COMPARTMENT_OVERLOAD
    http: 422
    condition: "bags plus assigned cargo in a hold exceed Compartment.max_weight_kg"
  - id: ERR_RUNNING_LOAD_EXCEEDED
    http: 422
    condition: "bags plus assigned cargo per metre exceed Compartment.running_load_limit_kg_per_m"
  - id: ERR_CG_OUT_OF_ENVELOPE
    http: 422
    condition: "the computed zero-fuel or takeoff centre of gravity lies outside its weight-adjusted %MAC limits"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "scheduled_on_block_utc is not strictly later than scheduled_off_block_utc"
  - id: ERR_AIRCRAFT_OCCUPANCY_CONFLICT
    http: 409
    condition: "the new flight's closed occupancy interval, including the 45-minute turnaround buffer, shares an instant with another flight on the same airframe"
  - id: ERR_RUNWAY_SLOT_FULL
    http: 409
    condition: "the runway's 10-minute departure slot window already holds slot_capacity_per_window flights"
  - id: ERR_FUEL_FIGURES_INCONSISTENT
    http: 422
    condition: "taxi fuel exceeds ramp fuel, or trip fuel exceeds takeoff fuel"
  - id: ERR_OFFLOAD_INSUFFICIENT
    http: 409
    condition: "the offload candidate set cannot relieve the excess weight"
  - id: ERR_LMC_ALLOWANCE_EXCEEDED
    http: 422
    condition: "the cumulative absolute last-minute-change weight would exceed LoadSheet.lmc_allowance_kg"
  - id: ERR_FINDING_NOTE_REQUIRED
    http: 422
    condition: "a load audit is closed without a non-empty finding_note"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LoadControlAdmin
    description: "Load control centre supervisor: maintains the reference data (airframes, compartments, runways, performance bands, weight programs), cancels and closes flights, and positions the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /aircraft"
      - "POST /aircraft/{id}/ground"
      - "POST /compartments"
      - "POST /runways"
      - "POST /runways/{id}/close"
      - "POST /performance-bands"
      - "POST /weight-programs"
      - "POST /weight-programs/{id}/withdraw"
      - "POST /flights/{id}/close"
      - "POST /flights/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /flights"
      - "GET /load-plans/{id}/offload-preview"
      - "all GET reads"

  - name: LoadController
    description: "Load controller who builds the distribution, computes the balance, applies offloads, issues the load sheet and records last-minute changes."
    identity: "opaque"
    exclusive_operations:
      - "PATCH /flights/{id}/conditions"
      - "POST /flights/{id}/depart"
      - "POST /load-plans"
      - "POST /load-plans/{id}/compute"
      - "POST /load-plans/{id}/apply-offload"
      - "POST /pax-lines"
      - "DELETE /pax-lines/{id}"
      - "POST /load-sheets"
      - "POST /load-sheets/{id}/amend"
      - "POST /last-minute-changes"
      - "POST /last-minute-changes/{id}/reverse"
    shared_operations:
      - "POST /flights"
      - "POST /bag-allocations"
      - "POST /cargo-items/{id}/assign"
      - "POST /load-plans/{id}/gate-bags"
      - "GET /load-plans/{id}/offload-preview"
      - "all GET reads"

  - name: RampAgent
    description: "Ramp and cargo acceptance agent who books consignments, stows them, presents gate-checked bags and submits dangerous-goods declarations."
    identity: "opaque"
    exclusive_operations:
      - "POST /cargo-items"
      - "POST /cargo-items/{id}/accept"
      - "POST /cargo-items/{id}/reject"
      - "POST /hazmat-declarations"
    shared_operations:
      - "POST /bag-allocations"
      - "POST /cargo-items/{id}/assign"
      - "POST /load-plans/{id}/gate-bags"
      - "all GET reads"

  - name: DangerousGoodsOfficer
    description: "Dangerous-goods acceptance officer who accepts or rejects declarations after the segregation check."
    identity: "opaque"
    exclusive_operations:
      - "POST /hazmat-declarations/{id}/accept"
      - "POST /hazmat-declarations/{id}/reject"
    shared_operations:
      - "all GET reads"

  - name: Captain
    description: "Commander who accepts or rejects the load sheet; may never be the user who issued it."
    identity: "opaque"
    exclusive_operations:
      - "POST /load-sheets/{id}/accept"
      - "POST /load-sheets/{id}/reject"
    shared_operations:
      - "all GET reads"

  - name: AuditInspector
    description: "Post-flight load audit inspector who opens, investigates and closes discrepancy investigations."
    identity: "opaque"
    exclusive_operations:
      - "POST /load-audits"
      - "POST /load-audits/{id}/investigate"
      - "POST /load-audits/{id}/close"
    shared_operations:
      - "all GET reads"
