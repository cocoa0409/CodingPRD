      - name: utility_bill_computed_fields_are_server_owned
        claim_type: computed_fields
        excluded_because:
          difficulty_instance: "dual_variant_calc / bill_peak_basis_variant_divergence_on_utility_bill"
          rationale: |
            UtilityBill carries seven source: computed fields
            (recomputed_amount_usd, recomputed_energy_cost_usd,
            recomputed_demand_cost_usd, recomputed_rider_cost_usd,
            recomputed_surcharge_usd, billable_demand_kw, peak_basis,
            variance_pct). The difficulty instance already creates the bill with
            client-supplied billed_* values, asserts every recomputed_* field is
            null until the explicit recompute action, and then asserts all seven
            at pre-computed literals under both peak-basis variants - including
            that a client-injected peak_basis in the create body is ignored.
            A separate corner test would re-run the same recompute with weaker
            assertions.

  # ===========================================================================
  - section: state_machines
    instances:

      - name: standard_publish_stamps_publisher_and_publication_clock
        claim_type: valid_transition
        grounds: "§1.2 state_machines.SetpointStandard transition standard_publish (DRAFT -> PUBLISHED, side effects status/published_at_iso/published_by_user_id); §1.5 POST /energy-ops/setpoint-standards/{id}/publish"
        distinguishing_aspect: |
          The plain happy-path transition with no cascade: supersedes_standard_id
          is null, so links 1-3 of the publish chain must NOT fire. The two
          stamped provenance fields are asserted at literals - published_at_iso
          equals the logical clock at publication time (not the draft's
          created_at) and published_by_user_id equals the caller's X-User-ID.
        test_recipe:
          setup: "a DRAFT standard created at 2026-08-01T00:00:00Z; the clock is advanced before publication so the two timestamps differ"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_DRY", store_format: "NEIGHBORHOOD", season: "SUMMER", cooling_setpoint_f: 76.0, heating_setpoint_f: 69.0, deadband_f: 2.5, lighting_lux_target: 700 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
            payload: {}
            as: EnergyManager
            as_user_id: "u_publisher_1"
          assert: |
            200. data.id == ${std_id}; status == "PUBLISHED";
            published_at_iso == "2026-08-05T09:30:00Z";
            published_by_user_id == "u_publisher_1"; revision == 1;
            supersedes_standard_id is null;
            created_at == "2026-08-01T00:00:00Z";
            updated_at == "2026-08-05T09:30:00Z"; version == 2.
            No other standard exists, so no predecessor moved to SUPERSEDED and
            no store changed bms_status: GET /energy-ops/setpoint-standards
            returns exactly 1 element in status PUBLISHED.

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds: "§1.2 initial_state of Store.bms_status (NOT_DEPLOYED), Store.energy_posture (NORMAL), SetpointStandard (DRAFT), UtilityBill (RECEIVED), DemandResponseEvent.event_state (SCHEDULED), DemandResponseEvent.settlement_state (PENDING), RefrigerationCase (ARMED), LightingOverride (SCHEDULED), FaultDiagnostic (DETECTED), MaintenanceWorkOrder (OPEN via §1.2 fault_triage_work_order), RetrofitProject (PROPOSED)"
        distinguishing_aspect: |
          One fixture that creates a row of every state-bearing entity and
          asserts all twelve declared initial states in one sweep, including the
          two PARALLEL dimensions of DemandResponseEvent independently
          (event_state SCHEDULED and settlement_state PENDING) and the
          LightingOverride created with a wholly future window, which must land
          in SCHEDULED rather than ACTIVE.
        test_recipe:
          setup: "clock 2026-08-01T12:00:00Z; one commissioned store carrying an account, a bill, a DR event, a case, a future override, a fault and a retrofit project"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-IS", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id", std_status: "$.data.status" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 36000, off_peak_kwh: 54000, billed_kwh: 90000, billed_peak_kw: 300.0, billed_amount_usd: 14410.88 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id", bill_state: "$.data.validation_state" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-PEAK-A", curtailment_start_iso: "2026-08-10T14:00:00Z", curtailment_end_iso: "2026-08-10T18:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { dr_id: "$.data.id", dr_event_state: "$.data.event_state", dr_settlement_state: "$.data.settlement_state" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-IS", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 4200.00 }
              as: PlatformAdmin
              captures: { case_id: "$.data.id", case_state: "$.data.monitoring_state" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "PARKING", override_type: "OCCUPANCY_DISABLE", start_iso: "2026-08-03T18:00:00Z", end_iso: "2026-08-03T22:00:00Z", zone_load_kw: 20.0, requested_reason: "lot resurfacing" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_id: "$.data.id", ovr_state: "$.data.state" }
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "LED_RETROFIT", capex_usd: 260000.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              captures: { proj_id: "$.data.id", proj_state: "$.data.state" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
            payload: { equipment_ref: "RTU-2", equipment_class: "HVAC", fault_code: "FAN-AMPS", severity: "MINOR", occurrence_count: 1, affected_load_kw: 12.0 }
            as: MaintenanceTech
            captures: { fault_id: "$.data.id" }
          assert: |
            Trigger: 201; data.state == "DETECTED" (FaultDiagnostic initial
            state); detected_at_iso == "2026-08-01T12:00:00Z";
            triaged_by_user_id is null.
            Captured initial states from the setup:
              ${std_status} == "DRAFT"     (SetpointStandard)
              ${bill_state} == "RECEIVED"  (UtilityBill, every recomputed_* null)
              ${dr_event_state} == "SCHEDULED" AND
              ${dr_settlement_state} == "PENDING" (both parallel dimensions)
              ${case_state} == "ARMED"     (RefrigerationCase)
              ${ovr_state} == "SCHEDULED"  (LightingOverride: window is wholly in
                                            the future, so NOT "ACTIVE")
              ${proj_state} == "PROPOSED"  (RetrofitProject)
            And from setup call 2, before any commissioning: bms_status ==
            "NOT_DEPLOYED" with energy_posture == "NORMAL".
            MaintenanceWorkOrder's initial state OPEN is asserted by the
            terminal-lockdown instance below, which triages this same fault
            shape and reads work_order_state == "OPEN" from the triage response.

      - name: bms_activation_without_commissioning_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds: "§1.2 state_machines.Store dimension bms_status (transitions bms_commission_initial, bms_activate; bms_activate requires COMMISSIONING); §1.4 priority 60 -> ERR_BMS_STATE_INVALID"
        distinguishing_aspect: |
          Two invalid edges on the CYCLIC bms dimension are asserted from the two
          states that most plausibly look activatable: NOT_DEPLOYED (never
          commissioned) and ACTIVE (already activated). Neither is in the
          transition list for bms-activation, so both must be 409
          ERR_BMS_STATE_INVALID - not an idempotent 200 and not a 422.
        test_recipe:
          setup: "one store, never commissioned; the same store is then commissioned and activated so the second, ACTIVE-state attempt can be made"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-IV", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { err_not_deployed: "$.data.error_id" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { store_v3: "$.data.version" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/bms-activation"
            payload: {}
            as: EnergyManager
            captures: { err_active: "$.data.error_id" }
          assert: |
            Setup call 3 (from NOT_DEPLOYED): 409,
            data.error_id == "ERR_BMS_STATE_INVALID"; the store is unchanged
            (bms_status still "NOT_DEPLOYED", version still 1).
            Setup call 7 succeeded: bms_status "ACTIVE", ${store_v3} == 3.
            Trigger (from ACTIVE): 409,
            data.error_id == "ERR_BMS_STATE_INVALID".
            GET /energy-ops/stores/${store_id} still reports bms_status
            "ACTIVE" and version == 3: the rejected transition bumped nothing.

      - name: publishing_an_already_published_standard_is_rejected
        claim_type: idempotency
        grounds: "§1.2 standard_publish precondition standard.status == DRAFT; §1.4 priority 61 -> ERR_STANDARD_STATE_INVALID"
        distinguishing_aspect: |
          The same trigger twice: the second publish must fail rather than
          silently succeed, and - the part an idempotent implementation gets
          wrong - published_at_iso and published_by_user_id must keep the FIRST
          publisher's stamps even though the clock and the caller both changed
          between the two attempts.
        test_recipe:
          setup: "a DRAFT standard published once at 2026-08-05T09:30:00Z by u_publisher_1; the clock is then advanced"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MARINE", store_format: "EXPRESS", season: "WINTER", cooling_setpoint_f: 72.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
              as_user_id: "u_publisher_1"
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
            payload: {}
            as: EnergyManager
            as_user_id: "u_publisher_2"
            captures: { err: "$.data.error_id" }
          assert: |
            409. data.error_id == "ERR_STANDARD_STATE_INVALID".
            GET /energy-ops/setpoint-standards/${std_id}: status still
            "PUBLISHED"; published_at_iso still "2026-08-05T09:30:00Z" (NOT
            re-stamped to 2026-08-06T11:00:00Z); published_by_user_id still
            "u_publisher_1" (NOT overwritten with u_publisher_2);
            version == 2 (unchanged by the rejected second publish).

      - name: excursion_close_without_documentation_is_refused
        claim_type: precondition_enforcement
        grounds: "§1.2 excursion_close preconditions (state != CLOSED AND disposition != null AND corrective_action_note != null); §1.4 priority 82 -> ERR_FOOD_SAFETY_DOC_INCOMPLETE (422)"
        distinguishing_aspect: |
          The state precondition of priority 66 is SATISFIED (the excursion is
          OPEN, which close accepts), so the only rule that can fire is the
          food-safety documentation completeness check at priority 82 - and it
          must fire even though the excursion is only 15 minutes old with
          mandatory_disposition NONE, i.e. documentation is required
          unconditionally, not only for DISCARD mandates.
        test_recipe:
          setup: |
            commissioned store; one MEDIUM_TEMP case with alarm_high_f 41.0; two
            consecutive breaching readings (42.0 at 10:00, 43.5 at 10:15) open an
            excursion in OPEN with exposure_minutes 15.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:20:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-FD", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-FD", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 4200.00 }
              as: PlatformAdmin
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.0, reading_iso: "2026-08-01T10:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.5, reading_iso: "2026-08-01T10:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_id: "$.data.excursion_id", exc_state: "$.data.excursion_state", exposure: "$.data.exposure_minutes" }
          trigger:
            call: "POST /energy-ops/excursions/${exc_id}/close"
            payload: {}
            as: FoodSafetyOfficer
            captures: { err: "$.data.error_id" }
          assert: |
            From the second reading: ${exc_state} == "OPEN",
            ${exposure} == 15, and the reading response reported
            monitoring_state "ALARM", consecutive_breach_count 2,
            store_energy_posture "CONSTRAINED".
            Trigger: 422; data.error_id == "ERR_FOOD_SAFETY_DOC_INCOMPLETE"
            (NOT ERR_EXCURSION_STATE_INVALID - priority 66 is satisfied).
            GET /energy-ops/excursions/${exc_id}: state still "OPEN";
            closed_at_iso is null; disposition is null;
            corrective_action_note is null.
            GET /energy-ops/refrigeration-cases/${case_id}: monitoring_state
            still "ALARM". GET /energy-ops/stores/${store_id}: energy_posture
            still "CONSTRAINED", alarm_case_count == 1.

      - name: excursion_close_rearms_the_case_and_releases_the_store
        claim_type: side_effect_execution
        grounds: "§1.2 excursion_close side effects (closed_at_iso = clock; cascade case ALARM -> ARMED when no other non-CLOSED excursion remains, resetting consecutive_breach_count; cascade Store recomputes energy_posture) with §1.2 case_rearm_on_close and posture_release_to_normal; §1.3 calculations.store_energy_posture"
        distinguishing_aspect: |
          Every declared side effect of one transition, verified in one response
          plus read-backs: the timestamp stamp, the CONDITIONAL cascade onto the
          parent case (it rearms only because no other non-CLOSED excursion
          remains), the breach-counter reset, and the compound recomputation of
          the grandparent store's posture. The store must land on NORMAL rather
          than stopping at CONSTRAINED, because the case rearm removes the last
          posture input in the SAME request.
        test_recipe:
          setup: |
            the excursion fixture of the previous instance (case in ALARM, store
            CONSTRAINED, excursion OPEN with exposure_minutes 15), then
            documentation recorded: disposition RETAIN + corrective note (allowed
            because mandatory_disposition is NONE at 15 minutes). Clock advanced
            to 2026-08-01T11:00:00Z before the close.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
