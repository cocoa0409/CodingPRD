            - { call: "POST /fixes/${fix}/items/${i1}/remove", payload: {}, as: Stylist, as_user_id: "${st}" }
          assert:
            - "Product.${p1}.available_count == 5, reserved_count == 0, sold_count == 0"
            - "available_count + reserved_count + sold_count == total_stock == 5 (unchanged)"

      - name: ship_then_keepnone_conserves_styling_fee
        grounds:
          - state_machines.Fix.PREVIEW_to_SHIPPED
          - state_machines.Fix.DELIVERED_to_CHECKED_OUT
          - calculations.styling_fee_ledger
          - entities.Fix.fields.styling_fee_forfeited_cents
        distinguishing_aspect: "Ship charges styling_fee_charged_cents=2000; checking out keeping nothing forfeits it, so styling_fee_charged_cents == styling_fee_credit_cents + styling_fee_forfeited_cents (2000 == 0 + 2000) — conserved quantity: styling-fee cents (distinct from inventory units)."
        test_recipe:
          setup:
            - "CA client ACTIVE with a 3-item fix DELIVERED."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: [] }, as: Client, as_user_id: "${c}" }
          assert:
            - "Fix.${fix}.styling_fee_charged_cents == 2000"
            - "Fix.${fix}.styling_fee_credit_cents == 0 and styling_fee_forfeited_cents == 2000"
            - "Fix.${fix}.charge_cents == 0"
