          - state_machines.Delivery.OFFERED_to_CANCELLED
        distinguishing_aspect: "Cancelling a ROUTED order with an OFFERED delivery cancels that delivery (OFFERED -> CANCELLED) and reverses its earnings; the conditional cascade only touches the non-terminal delivery."
