    description: "Create a center under a branch managed by a center manager (caps enforced)"
    roles: [ProgramAdmin]
    code: 201
    input: [branch_id, center_manager_id, name, meeting_day_of_week]
    output: Center
    side_effects: ["manager center count checked against center_cap (ERR_CASELOAD_CAP_EXCEEDED)"]

  - method: GET
    path: "/centers"
    description: "List centers with optional filters"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: ["branch_id?", "center_manager_id?"]
    output: "Center[]"
    side_effects: []

  - method: GET
    path: "/centers/{id}"
