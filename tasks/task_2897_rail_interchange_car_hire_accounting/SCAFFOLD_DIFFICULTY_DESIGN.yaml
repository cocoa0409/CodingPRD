  - rule_id: resource_temporal_overlap
    instances:

      - name: reclaim_windows_are_half_open_so_touching_endpoints_coexist
        grounds:
          - validations.priority_42_ERR_RECLAIM_WINDOW_OVERLAP
          - validations.priority_41_ERR_RECLAIM_WINDOW_TOO_SHORT
          - concurrency_rules.reclaim-file-stale-movement
          - entities.ReclaimClaim.fields.window_from
          - entities.ReclaimClaim.fields.window_to
        distinguishing_aspect: |
          Reclaim windows are HALF-OPEN. Claim A [2026-08-25T00:00:00Z,
          2026-08-26T00:00:00Z) and claim B [2026-08-26T00:00:00Z,
          2026-08-27T00:00:00Z) share the instant 2026-08-26T00:00:00Z as A's exclusive
          end and B's inclusive start, so BOTH are accepted on the same movement; claim C
          [2026-08-25T12:00:00Z, 2026-08-26T12:00:00Z) truly intersects both and is
          refused with 409 ERR_RECLAIM_WINDOW_OVERLAP. The contrast with the embargo
          instance in this same rule — where identical touching endpoints DO conflict —
          is what makes the half-open semantics falsifiable rather than assumed.
