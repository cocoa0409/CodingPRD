    grounds:
    - entities.VendorBlackout.fields.start_date
    - entities.VendorBlackout.fields.end_date
    - entities.VendorBlackout.fields.reopen_buffer_days
    - validations[priority=34]
    - errors[ERR_BLACKOUT_WINDOW_CONFLICT]
    - endpoints[POST /dropship/vendors/{id}/blackouts]
    distinguishing_aspect: 'A different overlap geometry on a different resource: VendorBlackout windows are CLOSED
      date intervals and the conflict rule is inflated by reopen_buffer_days, so two windows that do not touch at
      all can still collide. A gap of exactly 2 days against a buffer of 2 is rejected (the gap must exceed the
      buffer) while a gap of 3 days is accepted - adjacency is fatal here, whereas in the snapshot instance adjacency
      is the accepted case.'
