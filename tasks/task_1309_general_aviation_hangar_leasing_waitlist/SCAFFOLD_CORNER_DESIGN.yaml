            - call: "POST /applications"
              payload: { airport_id: "${ap_fl}", applicant_name: "Fil Two", applicant_contact: "fil2@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N371FL", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_fl2: $.data.id }
            - call: "POST /applications/${app_fl2}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${app_fl2}"
          trigger:
            - call: "GET /applications?status=QUEUED"
              as: AirportManager
            - call: "GET /applications?status=WITHDRAWN"
              as: AirportManager
          assert:
            - "QUEUED filter returns exactly 1 row (${app_fl1})"
            - "WITHDRAWN filter returns exactly 1 row (${app_fl2})"

  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: error_offer_window_expired_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: boundary_precision_check / offer_acceptance_deadline_exact_boundary_expired
          rationale: "Asserted as the failure path of the named §1.8 instance at the exact deadline boundary."

      - name: error_offer_not_open_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_NOT_OPEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_temporal_on_expired_offer_accept
          rationale: "Asserted as the winning error in the state-vs-temporal priority conflict §1.8 instance."

      - name: error_hangar_not_available_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HANGAR_NOT_AVAILABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_requires_hangar_posture_available
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_outstanding_balance_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUTSTANDING_BALANCE]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_balance_termination_gate_boundary
          rationale: "Asserted as the 1-cent-boundary failure of the named §1.8 instance."

      - name: error_not_next_in_queue_covered
        claim_type: violation_to_error
        grounds:
