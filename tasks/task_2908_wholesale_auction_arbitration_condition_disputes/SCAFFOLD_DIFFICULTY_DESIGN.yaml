            - "a second identical sweep at the same clock returns all four counters == 0"

      - name: round_cooldown_closed_interval_rejects_at_the_endpoint_and_admits_one_second_later
        grounds:
          - validations[priority=35]
          - errors.ERR_ROUND_COOLDOWN_ACTIVE
          - entities.NegotiationRound.fields.cooldown_until_utc
          - state_machines.ArbitrationCase.COUNTERED_to_NEGOTIATION
          - state_machines.NegotiationRound.COUNTERED_to_SUPERSEDED
        distinguishing_aspect: |
          The mirror image of the post-sale-inspection interval: the negotiation cooldown
          is CLOSED at its endpoint, so a re-offer at exactly cooldown_until_utc is refused
          and one filed a second later succeeds — the opposite inclusivity to
          psi_window_half_open_rejects_at_minus_1s_and_admits_at_the_endpoint, tested on
