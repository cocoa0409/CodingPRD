            - "after the suspension RecoveryGroup.${g1_id}.posture == RESTRICTED with posture_reason == RUNBOOK_STALE"
            - "the second submission returns 422 with posture_error == ERR_GROUP_NOT_READY, even though Exercise.${exN_id} is in exactly the same SCOPED state exP was"
            - "Exercise.${exN_id}.execution_state remains SCOPED with provisional_impact_score null and required_approval_level null"
            - "Exercise.${exP_id} is unaffected by the suspension — it already left SCOPED and stays PENDING_IMPACT_APPROVAL"

