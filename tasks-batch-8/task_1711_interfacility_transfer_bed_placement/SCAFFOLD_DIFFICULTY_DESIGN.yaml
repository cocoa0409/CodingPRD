      - name: manual_hold_gated_by_bed_status
        grounds:
          - state_machines.BedHold.ACTIVE_to_RELEASED
          - state_machines.Bed.AVAILABLE_to_HELD
          - concurrency_rules[bedhold-create-stale-case]
        distinguishing_aspect: |
          Pair BedHold x Bed (third distinct pair): manual hold placement requires
          the TARGET bed's status == AVAILABLE — an OCCUPIED bed rejects with
          ERR_BED_NOT_AVAILABLE, while an AVAILABLE bed succeeds and supersedes
          (auto-releases) the case's prior ACTIVE hold.
        test_recipe:
          setup:
            - "CRITICAL ICU EMTALA_APPLIES case ACCEPTED at RCV; auto-hold on ICU-01"
            - "ICU-02 marked OCCUPIED via housekeeping; ICU-03 AVAILABLE"
