              as: ProcurementBuyer
              captures: { rod_status_at_boundary: $.data.status, rod_scrapped_at_boundary: $.data.scrapped_lbs, rod_committed_at_boundary: $.data.committed_lbs, rod_remaining_at_boundary: $.data.remaining_lbs }
