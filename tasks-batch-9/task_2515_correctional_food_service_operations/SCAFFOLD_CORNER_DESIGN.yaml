      - name: corner_missing_user_header_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_MISSING_USER_HEADER
          - errors.ERR_MISSING_ROLE_HEADER
        distinguishing_aspect: "The identity header is checked before the role header, so a request that omits both reports ERR_MISSING_USER_HEADER rather than ERR_MISSING_ROLE_HEADER."
        test_recipe:
          setup:
            - "Clock pinned; no domain rows required."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
            - call: "GET /cfs/service-contracts"
              payload: {}
              as: ContractAdministrator
              captures: { no_user_error: $.data.error_id }
              note: "Sent with the X-User-Role header present as ContractAdministrator but the X-User-ID header omitted entirely."
            - call: "GET /cfs/service-contracts"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { no_role_error: $.data.error_id }
              note: "Sent with the X-User-ID header present as ca-001 but the X-User-Role header omitted entirely."
            - call: "GET /cfs/service-contracts"
              payload: {}
              as: ContractAdministrator
              captures: { neither_error: $.data.error_id }
              note: "Sent with both headers omitted."
          assert:
            - "${no_user_error} == ERR_MISSING_USER_HEADER with HTTP 401"
            - "${no_role_error} == ERR_MISSING_ROLE_HEADER with HTTP 401"
            - "${neither_error} == ERR_MISSING_USER_HEADER - priority 1 beats priority 2"

      - name: corner_sharps_audit_over_authorized_rejected
        claim_type: error_triggerable
        grounds:
