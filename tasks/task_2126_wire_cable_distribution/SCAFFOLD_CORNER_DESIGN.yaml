      - name: segregation_of_duties_blocks_self_issue_at_exactly_the_threshold
        claim_type: Conditional validation
        grounds:
          - validations[priority=25]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.Quote.fields.created_by_user_id
          - entities.Quote.fields.issued_by_user_id
        distinguishing_aspect: "A line subtotal of exactly 250000 cents meets SOD_REVIEW_THRESHOLD_CENTS, so rep-1 issuing its own quote is refused with ERR_SEGREGATION_OF_DUTIES (403) while rep-2 issuing the identical quote succeeds and stamps issued_by_user_id rep-2."
        test_recipe:
          setup:
            - "One branch with zero surcharge, one customer, product P3, index CI1."
            - "A DRAFT quote created by rep-1 carrying a single 2500 ft CUT line of P3, which prices to exactly 250000 cents."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
