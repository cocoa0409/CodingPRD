            - "after it ClientAccount.${acct_id}.remaining_reserved_units == 0"
            - "the booking at remainder exactly 0 returns 409 and err_zero_units == ERR_INQUIRY_ALLOWANCE_EXHAUSTED"
            - "InquiryRequest.${inq3_id}.status == ROUTED"

      - name: embargo_release_at_the_exact_instant
        grounds:
          - calculations.fact_check_response_deadline
          - entities.ResearchDocument.fields.embargo_until
          - state_machines.ResearchDocument.EMBARGOED_to_RELEASED
          - errors.ERR_EMBARGO_ACTIVE
        distinguishing_aspect: "Time-boundary crossing on a different metric and endpoint from the allowance boundary: a vendor read one second before embargo_until is refused while the read at exactly embargo_until succeeds, so the release boundary is inclusive."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Published document with embargo_days 14, so embargo_until is 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_an2
            - *k_ven1
            - *k_doc
            - *k_inc_include
            - *k_finalize_include
            - *k_submit
            - *k_approve
            - *k_fc_resp
            - *k_fc_dec
            - *k_publish
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /research/documents/${doc_id}"
              payload: {}
              as: VendorRep
              as_user_id: "${ven1_id}"
              captures: { err_one_second_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /research/documents/${doc_id}"
              payload: {}
              as: VendorRep
              as_user_id: "${ven1_id}"
          assert:
            - "ResearchDocument.${doc_id}.embargo_until == \"2026-09-15T00:00:00Z\""
            - "the read at 2026-09-14T23:59:59Z returns 403 and err_one_second_early == ERR_EMBARGO_ACTIVE"
            - "the read at exactly 2026-09-15T00:00:00Z returns 200 with response_type object"
            - "ResearchDocument.${doc_id}.embargo_status == RELEASED"

      - name: sponsor_minute_share_exact_ceiling
        grounds:
          - calculations.sponsor_minute_share
          - validations[priority=8]
          - errors.ERR_SPONSOR_SHARE_EXCEEDED
          - entities.ConferenceEvent.fields.sponsor_minute_share
        distinguishing_aspect: "Ratio boundary on a third metric and endpoint: 80 sponsor minutes out of 200 total is exactly 0.4000 and is accepted, while the next sponsor row moves the share to 0.4286 and is refused — the gate is <= 0.4000, not < 0.4000."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One event; one ACTIVE vendor to name on sponsor rows."
          setup_api_calls:
            - *k_clock
            - *k_ven1
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id }
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Research keynote 1", session_kind: "RESEARCH_SESSION", duration_minutes: 30 }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Research keynote 2", session_kind: "RESEARCH_SESSION", duration_minutes: 30 }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Research keynote 3", session_kind: "RESEARCH_SESSION", duration_minutes: 30 }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Research keynote 4", session_kind: "RESEARCH_SESSION", duration_minutes: 30 }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Sponsor showcase 1", session_kind: "SPONSOR_KEYNOTE", duration_minutes: 40, sponsor_vendor_id: "${ven1_id}" }
              as: EventProgrammer
          trigger:
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Sponsor showcase 2", session_kind: "SPONSOR_KEYNOTE", duration_minutes: 40, sponsor_vendor_id: "${ven1_id}" }
              as: EventProgrammer
            - call: "POST /research/conference-events/${ev_id}/sessions"
              payload: { session_title: "Sponsor showcase 3", session_kind: "SPONSOR_KEYNOTE", duration_minutes: 10, sponsor_vendor_id: "${ven1_id}" }
              as: EventProgrammer
              captures: { err_share: $.data.error_id }
          assert:
            - "the row that brings the share to exactly 0.4000 is accepted"
            - "ConferenceEvent.${ev_id}.sponsor_minute_share == 0.4"
            - "ConferenceEvent.${ev_id}.sponsor_session_minutes == 80 and research_session_minutes == 120"
            - "the next sponsor row would make the share 0.4286 and returns 409 with err_share == ERR_SPONSOR_SHARE_EXCEEDED"
            - "ConferenceEvent.${ev_id}.sponsor_minute_share is still 0.4"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: inquiry_submission_requires_an_active_seat
        grounds:
          - validations[priority=9]
          - errors.ERR_SEAT_NOT_ACTIVE
          - state_machines.InquiryRequest.SUBMITTED_to_ROUTED
          - state_machines.Seat.PROVISIONED_to_ACTIVE
        distinguishing_aspect: "Entity pair InquiryRequest -> Seat: the SUBMITTED -> ROUTED transition is legal for the inquiry but blocked while the referenced seat is PROVISIONED, and the same request succeeds once the seat's own state machine reaches ACTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with allowance 10; one analyst; one seat still PROVISIONED."
          setup_api_calls:
            - *k_clock
            - *k_acct10
            - *k_an1
            - *k_seat
          trigger:
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Blocked while provisioned", requested_start_utc: "2026-09-20T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { err_seat_state: $.data.error_id }
            - call: "POST /research/seats/${seat_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Accepted after activation", requested_start_utc: "2026-09-20T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_id: $.data.id }
          assert:
            - "the submission from the PROVISIONED seat returns 409 and err_seat_state == ERR_SEAT_NOT_ACTIVE"
            - "Seat.${seat_id}.status == ACTIVE after activation"
            - "the retry returns 201 and InquiryRequest.${inq_id}.status == ROUTED"
            - "InquiryRequest.${inq_id}.analyst_id == ${an1_id}"

      - name: renewal_decision_requires_seat_derived_utilization
        grounds:
          - state_machines.ClientAccount.RENEWAL_REVIEW_to_RENEWED
          - errors.ERR_RENEWAL_UTILIZATION_TOO_LOW
          - calculations.research_utilization_score
          - entities.ClientAccount.fields.utilization_score_active_weighted
        distinguishing_aspect: "Entity pair ClientAccount -> Seat: the RENEWED transition depends on an aggregate over the account's Seat rows, and the gate reads the ACTIVE_WEIGHTED variant — one account passes at 65.00 while its own dashboard reads 35.00, and an account with no activated seats is refused at 0.00."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two accounts whose terms end 2026-11-15, so both are in RENEWAL_REVIEW. Account A has two ACTIVE seats; account B has no seats at all."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - call: "POST /research/clients"
              payload: { legal_name: "Northgate Utilities", industry: "Energy", region: "NA", contract_start_utc: "2025-11-16T00:00:00Z", contract_end_utc: "2026-11-15T00:00:00Z", seat_count_contracted: 10, inquiry_allowance_total: 20, reprint_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { acct_a_id: $.data.id }
            - call: "POST /research/clients"
              payload: { legal_name: "Southgate Utilities", industry: "Energy", region: "NA", contract_start_utc: "2025-11-16T00:00:00Z", contract_end_utc: "2026-11-15T00:00:00Z", seat_count_contracted: 10, inquiry_allowance_total: 20, reprint_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { acct_b_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_a_id}", seat_email: "lead@northgate.example", research_role: "STRATEGIST", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_a_id}"
              captures: { a_seat1_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_a_id}", seat_email: "arch@northgate.example", research_role: "ARCHITECT", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_a_id}"
              captures: { a_seat2_id: $.data.id }
            - call: "POST /research/seats/${a_seat1_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_a_id}"
            - call: "POST /research/seats/${a_seat2_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_a_id}"
          trigger:
            - call: "POST /research/clients/${acct_b_id}/renewal-decisions"
              payload: { decision: "RENEW" }
              as: ResearchDirector
              captures: { err_low_util: $.data.error_id }
            - call: "POST /research/clients/${acct_a_id}/renewal-decisions"
              payload: { decision: "RENEW" }
              as: ResearchDirector
          assert:
            - "both accounts are in RENEWAL_REVIEW before the decisions"
            - "ClientAccount.${acct_b_id}.utilization_score_active_weighted == 0.00 and the RENEW returns 409 with err_low_util == ERR_RENEWAL_UTILIZATION_TOO_LOW"
            - "ClientAccount.${acct_b_id}.contract_status == RENEWAL_REVIEW after the refusal"
            - "ClientAccount.${acct_a_id}.utilization_score == 35.00 and ClientAccount.${acct_a_id}.utilization_score_active_weighted == 65.00"
            - "the RENEW on account A returns 200 and ClientAccount.${acct_a_id}.contract_status == RENEWED"
            - "ClientAccount.${acct_a_id}.renewal_posture == AT_RISK while the renewal still succeeds"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: analyst_inquiry_calendar_pairwise_half_open_overlap
        grounds:
          - validations[priority=8]
          - errors.ERR_INQUIRY_SLOT_OVERLAP
          - state_machines.InquiryRequest.ROUTED_to_SCHEDULED
          - entities.InquiryRequest.fields.duration_minutes
        distinguishing_aspect: "Interval semantics A on the analyst inquiry calendar: raw half-open windows [start, start + duration) with no buffer, so a booking that begins exactly when the previous one ends is accepted and a booking that starts inside a live window is refused."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with allowance 10; one ACTIVE seat; one analyst. One 45-minute inquiry already SCHEDULED for 2026-09-08T10:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_acct10
            - *k_an1
            - *k_seat
            - *k_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Window one", requested_start_utc: "2026-09-08T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief one." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq1_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq1_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Window two", requested_start_utc: "2026-09-08T10:45:00Z", duration_minutes: 45, preparation_notes: "Brief two." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq2_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Window three", requested_start_utc: "2026-09-08T10:30:00Z", duration_minutes: 45, preparation_notes: "Brief three." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq3_id: $.data.id }
          trigger:
            - call: "POST /research/inquiry-requests/${inq2_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T10:45:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /research/inquiry-requests/${inq3_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-08T10:30:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the adjacent booking at 10:45 succeeds and InquiryRequest.${inq2_id}.status == SCHEDULED"
            - "the booking that starts inside [10:00, 10:45) returns 409 and err_overlap == ERR_INQUIRY_SLOT_OVERLAP"
            - "InquiryRequest.${inq3_id}.status == ROUTED and scheduled_start_utc is null"
            - "ClientAccount.${acct_id}.reserved_inquiry_units == 2"

      - name: briefing_calendar_buffer_expanded_overlap
        grounds:
          - validations[priority=8]
          - errors.ERR_BRIEFING_SLOT_CONFLICT
          - state_machines.VendorBriefing.SCREENED_to_SCHEDULED
          - entities.VendorBriefing.fields.requested_start_utc
        distinguishing_aspect: "Interval semantics B on the briefing calendar: the candidate window is expanded by a 15-minute buffer on both sides before it is tested against raw existing windows, so a briefing starting exactly 15 minutes after the previous one ends is accepted while one starting 5 minutes after is refused."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst whose routes include MARKET_OUTLOOK; one ACTIVE vendor. One 45-minute briefing already SCHEDULED for 2026-09-11T15:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_ven1
            - call: "POST /research/vendor-briefings"
              payload: { vendor_id: "${ven1_id}", briefing_topic: "MARKET_OUTLOOK", requested_start_utc: "2026-09-11T15:00:00Z", duration_minutes: 45 }
              as: VendorRep
              as_user_id: "${ven1_id}"
              captures: { brief1_id: $.data.id }
          trigger:
            - call: "POST /research/vendor-briefings"
              payload: { vendor_id: "${ven1_id}", briefing_topic: "MARKET_OUTLOOK", requested_start_utc: "2026-09-11T16:00:00Z", duration_minutes: 45 }
              as: VendorRep
              as_user_id: "${ven1_id}"
              captures: { brief2_id: $.data.id }
            - call: "POST /research/vendor-briefings"
              payload: { vendor_id: "${ven1_id}", briefing_topic: "MARKET_OUTLOOK", requested_start_utc: "2026-09-11T15:50:00Z", duration_minutes: 45 }
              as: VendorRep
              as_user_id: "${ven1_id}"
              captures: { err_buffer: $.data.error_id }
          assert:
            - "VendorBriefing.${brief1_id}.status == SCHEDULED"
            - "the briefing starting exactly 15 minutes after the first ends is accepted and VendorBriefing.${brief2_id}.status == SCHEDULED"
            - "the briefing starting 5 minutes after the first ends returns 409 and err_buffer == ERR_BRIEFING_SLOT_CONFLICT"
            - "only two briefings exist for analyst ${an1_id}"

      - name: platinum_exclusivity_window_overlap_on_the_event
        grounds:
          - validations[priority=8]
          - errors.ERR_SPONSOR_EXCLUSIVITY_OVERLAP
          - entities.Sponsorship.fields.exclusivity_start_utc
          - entities.Sponsorship.fields.tier
        distinguishing_aspect: "Interval semantics C on a third resource: only PLATINUM packages occupy the event's exclusivity resource, so an overlapping PLATINUM window is refused while an adjacent PLATINUM window and an overlapping GOLD window are both accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DRAFT event; two ACTIVE vendors; one PLATINUM sponsorship for vendor 1 already ACTIVE over [2026-10-01T00:00:00Z, 2026-10-05T00:00:00Z)."
          setup_api_calls:
            - *k_clock
            - *k_ven1
            - *k_ven2
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven1_id}", tier: "PLATINUM", amount_cents: 9000000, exclusivity_start_utc: "2026-10-01T00:00:00Z", exclusivity_end_utc: "2026-10-05T00:00:00Z", expected_conference_event_version: "${ev_v}" }
              as: SalesRep
              captures: { sp1_id: $.data.id }
            - call: "POST /research/sponsorships/${sp1_id}/activate"
              payload: {}
              as: EventProgrammer
            - call: "GET /research/conference-events/${ev_id}"
              payload: {}
              as: EventProgrammer
              captures: { ev_v2: $.data.version }
          trigger:
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven2_id}", tier: "PLATINUM", amount_cents: 8000000, exclusivity_start_utc: "2026-10-04T00:00:00Z", exclusivity_end_utc: "2026-10-08T00:00:00Z", expected_conference_event_version: "${ev_v2}" }
              as: SalesRep
              captures: { err_exclusive: $.data.error_id }
            - call: "GET /research/conference-events/${ev_id}"
              payload: {}
              as: EventProgrammer
              captures: { ev_v3: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven2_id}", tier: "PLATINUM", amount_cents: 8000000, exclusivity_start_utc: "2026-10-05T00:00:00Z", exclusivity_end_utc: "2026-10-08T00:00:00Z", expected_conference_event_version: "${ev_v3}" }
              as: SalesRep
              captures: { sp3_id: $.data.id }
            - call: "GET /research/conference-events/${ev_id}"
              payload: {}
              as: EventProgrammer
              captures: { ev_v4: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven2_id}", tier: "GOLD", amount_cents: 2000000, exclusivity_start_utc: "2026-10-04T00:00:00Z", exclusivity_end_utc: "2026-10-08T00:00:00Z", expected_conference_event_version: "${ev_v4}" }
              as: SalesRep
              captures: { sp4_id: $.data.id }
          assert:
            - "the overlapping PLATINUM window returns 409 and err_exclusive == ERR_SPONSOR_EXCLUSIVITY_OVERLAP"
            - "the adjacent PLATINUM window starting exactly at the first window's end is accepted with Sponsorship.${sp3_id}.status == PENDING"
            - "the GOLD package with an overlapping window is accepted with Sponsorship.${sp4_id}.status == PENDING"
            - "ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 9000000"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: inquiry_units_conserved_across_schedule_and_cancel
        grounds:
          - calculations.inquiry_allowance_ledger
          - state_machines.InquiryRequest.SCHEDULED_to_CANCELLED
          - entities.ClientAccount.fields.inquiry_allowance_total
          - entities.ClientAccount.fields.reserved_inquiry_units
        distinguishing_aspect: "Conserved quantity A (inquiry units): the identity inquiry_allowance_total == remaining_reserved_units + reserved_inquiry_units + consumed_inquiry_units holds after a reservation and after its compensating release, in both the free-cancel and the late-cancel branch."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with inquiry_allowance_total 10; one ACTIVE seat; one analyst."
          setup_api_calls:
            - *k_clock
            - *k_acct10
            - *k_an1
            - *k_seat
            - *k_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Reserve then release", requested_start_utc: "2026-09-10T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq1_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq1_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-10T10:00:00Z" }
              as: Analyst
