# =============================================================================
# SCAFFOLD: Free-Admission Museum Complex Visitor Flow & Collection Loans
# Domain: campus of free-admission museums — timed entry passes, security
# screening throughput, fee-based special exhibitions with member presale,
# school groups / education programs / docents, collection loans with
# condition reports and insurance/indemnity, acquisition & deaccession
# committee review with repatriation compliance, federal-vs-trust fund
# separation, research access.
# =============================================================================

scenario: |
  Free-Admission Museum Complex Visitor Flow & Collection Loans (Smithsonian Institution): free general admission with timed entry passes deployed selectively at high-demand museums and exhibitions, capacity and queue management across a campus of museums with security screening throughput, special exhibition ticketing where a fee may be charged with member presale windows, collection loan agreements with borrowing institutions covering condition reporting, courier requirements and insurance or indemnity, acquisition and deaccession review with collections committee approval and repatriation obligations under cultural property law, federal appropriation and trust fund revenue separation governing what activities each may support, volunteer docent programs, school group scheduling and educational program capacity, research collection access for scholars

domain_name: museum-campus-collections
api_prefix: /campus

complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency      # OCC on LoanAgreement + CollectionReview versions
    - cascading_side_effects      # close-day, exhibition-close, deaccession cascades
    - dual_variant_calculation    # provisional vs final premium; settled vs committed funds
    - scheduled / deferred actions # logical clock gates presale windows, slot expiry, member lapse
  entity_topology: flat           # peer entities joined by FK references; no URL nesting below one level
  state_machine_shape: cyclic     # loan negotiation rounds + object loan loop; branching review machines
  relationship_patterns:
    - one_to_many
    - many_to_many                # DocentAssignment junction (Docent x EducationProgram)
    - cross_aggregate             # tickets -> member/fund; loans -> object; reviews -> object/fund
  role_model: segregation_of_duties  # review submitter may not decide; proposer/executor split
  consistency_model: immediate    # every mutation visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (16 entities, all common_fields: true)
# All dates are ISO calendar dates (YYYY-MM-DD) and all datetimes ISO 8601 UTC.
# The campus runs on a logical clock (see POST /_clock/set_current_utc); every
# date/datetime comparison below reads the logical clock, never wall-clock.
# Entry slots: museum entry day runs 10:00-17:30 UTC = 30 quarter-hour slots,
# entry_quarter_hour is an integer slot index 0..29 (slot 0 = 10:00Z).
# =============================================================================
entities:
  - name: Museum
    parent: null
    common_fields: true
    fields:
      - { name: museum_code, type: string, source: input, description: "Unique campus code, e.g. NMAH" }
      - { name: display_name, type: string, source: input, description: "Public museum name" }
      - { name: requires_timed_pass, type: boolean, source: input, description: "True when this museum only admits visitors holding a TimedEntryPass" }
      - { name: quarter_hour_pass_quota, type: integer, source: input, description: "Max RESERVED passes per entry_quarter_hour slot; >= 1" }
      - { name: daily_pass_quota, type: integer, source: input, description: "Max RESERVED+ADMITTED passes per visit_date; >= quarter_hour_pass_quota" }
      - { name: screening_rate_per_quarter_hour, type: integer, source: input, description: "Max admissions security can process per quarter-hour slot; >= 1" }
      - { name: closed_dates, type: array, source: system, description: "List of ISO dates on which the museum is emergency-closed; appended by close-day" }

  - name: TimedEntryPass
    parent: null
    common_fields: true
    fields:
      - { name: museum_id, type: string, source: input, description: "FK -> Museum.id; museum the pass admits to" }
      - { name: visitor_name, type: string, source: input, description: "Visitor full name" }
      - { name: holder_member_id, type: string, source: input, description: "FK -> Member.id; nullable, set when the reservation was made as a member" }
      - { name: visit_date, type: string, source: input, description: "ISO date of the visit" }
      - { name: entry_quarter_hour, type: integer, source: input, description: "Slot index 0..29 for the reserved entry window" }
      - { name: status, type: enum, source: system, description: "RESERVED | ADMITTED | CANCELLED | EXPIRED" }
      - { name: admitted_slot, type: integer, source: system, description: "Slot index at which admission occurred; null until ADMITTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: email, type: string, source: input, description: "Member email, unique" }
      - { name: membership_term_months, type: integer, source: input, description: "Term length in whole months from join date; >= 1" }
      - { name: expires_on, type: string, source: computed, description: "ISO date = join date + membership_term_months calendar months" }
      - { name: member_status, type: enum, source: computed, description: "ACTIVE when current logical date <= expires_on, else LAPSED" }

  - name: SpecialExhibition
    parent: null
    common_fields: true
    fields:
      - { name: museum_id, type: string, source: input, description: "FK -> Museum.id; hosting museum" }
      - { name: revenue_fund_id, type: string, source: input, description: "FK -> FundAccount.id; must reference a TRUST fund; receives ticket receipts and refund debits" }
      - { name: title, type: string, source: input, description: "Exhibition title" }
      - { name: fee_cents, type: integer, source: input, description: "Full public unit price per ticket in cents; may be 0; >= 0" }
      - { name: daily_ticket_quota, type: integer, source: input, description: "Max tickets with status PURCHASED or REDEEMED per visit_date; >= 1" }
      - { name: member_presale_opens_at, type: datetime, source: input, description: "UTC datetime when members may start purchasing" }
      - { name: public_sale_opens_at, type: datetime, source: input, description: "UTC datetime when the public may purchase; must be strictly after member_presale_opens_at" }
      - { name: status, type: enum, source: system, description: "DRAFT | ON_SALE | CLOSED" }

  - name: ExhibitionTicket
    parent: null
    common_fields: true
    fields:
      - { name: exhibition_id, type: string, source: system, description: "FK -> SpecialExhibition.id; from the creation path" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; nullable; required for member presale and member pricing" }
      - { name: buyer_name, type: string, source: input, description: "Ticket buyer / holder name" }
      - { name: visit_date, type: string, source: input, description: "ISO date the ticket admits to the exhibition" }
      - { name: price_paid_cents, type: integer, source: computed, description: "Unit price locked at purchase: member-discounted or full fee" }
      - { name: status, type: enum, source: system, description: "PURCHASED | REDEEMED | REFUNDED" }

  - name: EducationProgram
    parent: null
    common_fields: true
    fields:
      - { name: museum_id, type: string, source: input, description: "FK -> Museum.id" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: gallery_code, type: string, source: input, description: "Gallery room code within the museum" }
      - { name: day_of_week, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN — weekly recurrence day" }
      - { name: start_minute, type: integer, source: input, description: "Minutes since midnight UTC, session start; 0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Minutes since midnight UTC, session end; strictly greater than start_minute" }
      - { name: student_capacity, type: integer, source: input, description: "Max summed headcount of CONFIRMED reservations per visit_date; >= 1" }
      - { name: docent_ratio, type: integer, source: input, description: "One confirmed docent per this many students; >= 1" }
      - { name: max_group_size, type: integer, source: input, description: "Hard cap on a single reservation headcount; >= 1" }
      - { name: required_docent_certification, type: enum, source: input, description: "BASIC | ADVANCED | EXPERT — minimum docent certification" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED" }

  - name: Docent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Docent name" }
      - { name: certification_level, type: enum, source: input, description: "BASIC | ADVANCED | EXPERT" }
      - { name: active, type: boolean, source: input, description: "Whether the docent currently volunteers", default: true }

  - name: DocentAssignment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> EducationProgram.id; from the creation path" }
      - { name: docent_id, type: string, source: input, description: "FK -> Docent.id" }
      - { name: service_date, type: string, source: input, description: "ISO date of service; must fall on the program's day_of_week" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | RELEASED" }

  - name: SchoolGroupReservation
    parent: null
    common_fields: true
    fields:
      - { name: museum_id, type: string, source: input, description: "FK -> Museum.id" }
      - { name: program_id, type: string, source: input, description: "FK -> EducationProgram.id" }
      - { name: school_name, type: string, source: input, description: "School or group name" }
      - { name: headcount, type: integer, source: input, description: "Students in the group; >= 1" }
      - { name: visit_date, type: string, source: input, description: "ISO date of the visit; must fall on the program's day_of_week" }
      - { name: status, type: enum, source: system, description: "REQUESTED (transient at evaluation) | CONFIRMED | WAITLISTED | CANCELLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the group organizer who created it" }

  - name: CollectionObject
    parent: null
    common_fields: true
    fields:
      - { name: accession_number, type: string, source: input, description: "Unique accession number" }
      - { name: title, type: string, source: input, description: "Object title" }
      - { name: declared_value_cents, type: integer, source: input, description: "Curatorial declared value in cents; >= 0" }
      - { name: is_cultural_property, type: boolean, source: input, description: "True when the object is subject to cultural property / repatriation law", default: false }
      - { name: status, type: enum, source: system, description: "IN_COLLECTION | OUT_ON_LOAN | UNDER_CONSERVATION | PENDING_DEACCESSION | DEACCESSIONED | REPATRIATED" }

  - name: LoanAgreement
    parent: null
    common_fields: true
    fields:
      - { name: object_id, type: string, source: system, description: "FK -> CollectionObject.id; from the creation path" }
      - { name: borrower_institution, type: string, source: input, description: "Borrowing institution name (no Borrower entity)" }
      - { name: loan_start_date, type: string, source: input, description: "ISO loan window start (inclusive)" }
      - { name: loan_end_date, type: string, source: input, description: "ISO loan window end (exclusive); strictly after start" }
      - { name: declared_value_cents, type: integer, source: input, description: "Agreed value for insurance/indemnity purposes; >= 0" }
      - { name: coverage_type, type: enum, source: input, description: "INSURANCE | INDEMNITY" }
      - { name: courier_required, type: boolean, source: input, description: "Whether a museum courier must accompany the object" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | AGREED | ACTIVE | CLOSED | CANCELLED" }
      - { name: negotiated_round, type: integer, source: system, description: "Starts at 1 on creation; +1 on every counter" }
      - { name: premium_cents, type: integer, source: computed, description: "Final insurance premium locked at accept per calculation loan_premium_cents FINAL variant; 0 under INDEMNITY" }

  - name: ConditionReport
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> LoanAgreement.id; from the creation path" }
      - { name: report_kind, type: enum, source: input, description: "OUTBOUND (pre-shipment) | RETURN (post-return)" }
      - { name: condition_summary, type: string, source: input, description: "Narrative condition description" }
      - { name: damage_noted, type: boolean, source: input, description: "True when new damage is recorded" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | DISPUTED | SUPERSEDED | CANCELLED" }

  - name: CollectionReview
    parent: null
    common_fields: true
    fields:
      - { name: review_kind, type: enum, source: input, description: "ACQUISITION | DEACCESSION" }
      - { name: object_id, type: string, source: input, description: "FK -> CollectionObject.id; required for DEACCESSION, must be null for ACQUISITION" }
      - { name: fund_id, type: string, source: input, description: "FK -> FundAccount.id; required for ACQUISITION, must be null for DEACCESSION" }
      - { name: proposed_object_title, type: string, source: input, description: "ACQUISITION only: title of the object to acquire" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "ACQUISITION only: estimated purchase price; >= 1" }
      - { name: disposal_method, type: enum, source: input, description: "DEACCESSION only: TRANSFER | SALE | DESTRUCTION | REPATRIATION" }
      - { name: cultural_property_review_completed, type: boolean, source: input, description: "True once cultural-property/repatriation review is complete", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | EXECUTED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted the review" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID that decided the review" }

  - name: FundAccount
    parent: null
    common_fields: true
    fields:
      - { name: fund_code, type: string, source: input, description: "Unique fund code" }
      - { name: fund_type, type: enum, source: input, description: "FEDERAL (appropriation) | TRUST (private/revenue)" }
      - { name: appropriation_cents, type: integer, source: input, description: "Authorized budget authority in cents; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN" }
      - { name: receipts_cents, type: integer, source: computed, description: "TRUST funds only: sum of price_paid_cents on PURCHASED/REDEEMED tickets minus REFUNDED amounts for exhibitions naming this fund" }
      - { name: settled_available_cents, type: integer, source: computed, description: "SETTLED variant: appropriation_cents + receipts_cents - sum(POSTED expenditure amounts)" }
      - { name: committed_available_cents, type: integer, source: computed, description: "COMMITTED variant: settled_available_cents - sum(estimated_cost_cents of APPROVED, unexecuted ACQUISITION reviews on this fund)" }

  - name: Expenditure
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> FundAccount.id; from the creation path" }
      - { name: review_id, type: string, source: system, description: "FK -> CollectionReview.id; set only when the expenditure was posted by an acquisition execute; null otherwise" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount in cents; >= 1" }
      - { name: activity_type, type: enum, source: input, description: "OPERATIONS | EDUCATION | ACQUISITION | EXHIBITION" }
      - { name: memo, type: string, source: input, description: "Free-text memo" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }

  - name: ResearchAccessRequest
    parent: null
    common_fields: true
    fields:
      - { name: object_id, type: string, source: input, description: "FK -> CollectionObject.id" }
      - { name: scholar_name, type: string, source: input, description: "Scholar name" }
      - { name: research_topic, type: string, source: input, description: "Topic / purpose" }
      - { name: visit_start_date, type: string, source: input, description: "ISO first visit day (inclusive)" }
      - { name: visit_end_date, type: string, source: input, description: "ISO last visit day (inclusive); >= visit_start_date" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the scholar" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TimedEntryPass
    initial_state: RESERVED
    terminal_states: [ADMITTED, CANCELLED, EXPIRED]
    transitions:
      - from: RESERVED
        to: ADMITTED
        trigger: "POST /campus/timed-entry-passes/{id}/admit"
        actor: SecurityScreener
        preconditions:
          - "Current logical slot index (floor((current_utc minutes since 10:00Z)/15)) is <= pass.entry_quarter_hour + 2 (30-min grace); if current slot > entry_quarter_hour + 2 the pass first flips to EXPIRED and the call fails ERR_PASS_EXPIRED"
          - "pass.visit_date == current logical date (a pass admits only on its visit date; if visit_date is in the past or future relative to the clock the slot comparison above already fails the call)"
          - "count(passes ADMITTED at the same museum on the same visit_date whose admitted_slot == current slot) < museum.screening_rate_per_quarter_hour (else ERR_SCREENING_THROUGHPUT_FULL)"
        side_effects:
          - "pass.admitted_slot := current slot index; pass.version += 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /campus/timed-entry-passes/{id}/cancel"
        actor: "Public (X-User-ID == pass.created_by_user_id), Member (X-User-ID == pass.holder_member_id), or VisitorServices"
        preconditions: []
        side_effects:
          - "Slot and daily quota for the pass's (museum, visit_date, entry_quarter_hour) become reservable again"
      - from: RESERVED
        to: EXPIRED
        trigger: "system: (a) evaluated lazily at admit time once the grace window has passed; (b) cascade from POST /campus/museums/{id}/close-day when pass.visit_date is added to closed_dates"
        actor: system
        preconditions: []
        side_effects:
          - "On close-day cascade: every RESERVED pass at that museum on that date flips to EXPIRED in one batch"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    note: "member_status is computed from expires_on vs the logical clock; there are no member mutation endpoints beyond creation. LAPSED is entered automatically when current date > expires_on."
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system: logical clock advances past expires_on (computed on every read and every purchase attempt)"
        actor: system
        preconditions: []
        side_effects:
          - "Member-priced and presale purchases for this member become ERR_MEMBER_LAPSED"

  - entity: SpecialExhibition
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ON_SALE
        trigger: "POST /campus/exhibitions/{id}/open-sale"
        actor: ExhibitionManager
        preconditions: []
        side_effects: []
      - from: ON_SALE
        to: CLOSED
        trigger: "POST /campus/exhibitions/{id}/close"
        actor: ExhibitionManager
        preconditions: []
        side_effects:
          - "Every ExhibitionTicket of this exhibition with status PURCHASED flips to REFUNDED (cascade link 1)"
          - "Each such refund debits the exhibition's revenue_fund receipts_cents by that ticket's price_paid_cents (cascade link 2: ticket flip mutates the FundAccount's computed receipts)"

  - entity: ExhibitionTicket
    initial_state: PURCHASED
    terminal_states: [REDEEMED, REFUNDED]
    transitions:
      - from: PURCHASED
        to: REDEEMED
        trigger: "POST /campus/tickets/{id}/redeem"
        actor: SecurityScreener
        preconditions:
          - "Current logical date == ticket.visit_date (else ERR_VISIT_DATE_MISMATCH)"
          - "Exhibition status is ON_SALE (CLOSED exhibitions have no PURCHASED tickets left after the close cascade)"
        side_effects: []
      - from: PURCHASED
        to: REFUNDED
        trigger: "POST /campus/tickets/{id}/refund, or exhibition close cascade"
        actor: VisitorServices | system
        preconditions:
          - "Manual refund only when current logical date <= ticket.visit_date (else ERR_REFUND_WINDOW_CLOSED)"
        side_effects:
          - "revenue_fund receipts_cents debited by price_paid_cents; daily quota for (exhibition, visit_date) freed"

  - entity: EducationProgram
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /campus/education-programs/{id}/cancel"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Every SchoolGroupReservation with program_id == this program and status CONFIRMED or WAITLISTED flips to CANCELLED (cascade link 1)"
          - "Every DocentAssignment with program_id == this program and status ASSIGNED flips to RELEASED; CONFIRMED assignments are left untouched (conditional cascade)"

  - entity: DocentAssignment
    initial_state: ASSIGNED
    terminal_states: [CONFIRMED, RELEASED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /campus/docent-assignments/{id}/confirm"
        actor: "Docent (X-User-ID must equal assignment.docent_id)"
        preconditions:
          - "Program status == SCHEDULED"
        side_effects:
          - "Waitlist re-evaluation for (program_id, service_date): the head-of-queue WAITLISTED reservation is promoted to CONFIRMED if capacity and confirmed-docent count now suffice (strict FIFO, head-of-line blocking)"
      - from: ASSIGNED
        to: RELEASED
        trigger: "cascade from program cancel"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SchoolGroupReservation
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    note: "REQUESTED is evaluated synchronously inside POST /campus/school-reservations: the stored state is CONFIRMED or WAITLISTED, never REQUESTED, per calculation reservation_status_resolution."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "creation evaluation: capacity fits, docents suffice, and no earlier WAITLISTED reservation exists for the same (program_id, visit_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: WAITLISTED
        trigger: "creation evaluation: capacity shortfall, docent shortfall, or an earlier WAITLISTED reservation already queued for the same (program_id, visit_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system promotion: after a cancellation or a docent confirm frees the head of queue"
        actor: system
        preconditions:
          - "Reservation is the earliest-created (created_at ASC) WAITLISTED reservation for its (program_id, visit_date) that fits capacity AND confirmed-docent requirements"
        side_effects: []
      - from: [CONFIRMED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /campus/school-reservations/{id}/cancel (organizer or ProgramCoordinator), or program cancel cascade"
        actor: "Public (X-User-ID == created_by_user_id) | ProgramCoordinator | system"
        preconditions: []
        side_effects:
          - "When a CONFIRMED reservation is cancelled, its headcount is released and the waitlist for (program_id, visit_date) is re-evaluated head-of-line first (transitive link: cancel -> capacity release -> head WAITLISTED reservation promoted to CONFIRMED)"

  - entity: CollectionObject
    initial_state: IN_COLLECTION
    terminal_states: [DEACCESSIONED, REPATRIATED]
    transitions:
      - from: IN_COLLECTION
        to: OUT_ON_LOAN
        trigger: "side effect of LoanAgreement ACTIVATE"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_ON_LOAN
        to: IN_COLLECTION
        trigger: "side effect of LoanAgreement CLOSE when the accepted RETURN report has damage_noted == false"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_ON_LOAN
        to: UNDER_CONSERVATION
        trigger: "side effect of LoanAgreement CLOSE when the accepted RETURN report has damage_noted == true"
        actor: system
        preconditions: []
        side_effects:
          - "Object blocks new loans and research approvals until released"
      - from: UNDER_CONSERVATION
        to: IN_COLLECTION
        trigger: "POST /campus/collection-objects/{id}/release-conservation"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: IN_COLLECTION
        to: PENDING_DEACCESSION
        trigger: "side effect of a DEACCESSION CollectionReview reaching APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: [UNDER_CONSERVATION]
        to: PENDING_DEACCESSION
        trigger: "side effect of a DEACCESSION CollectionReview reaching APPROVED (allowed from conservation hold as well)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DEACCESSION
        to: DEACCESSIONED
        trigger: "side effect of review execute when disposal_method != REPATRIATION"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DEACCESSION
        to: REPATRIATED
        trigger: "side effect of review execute when disposal_method == REPATRIATION"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoanAgreement
    initial_state: PROPOSED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /campus/loan-agreements/{id}/counter by BorrowerRep"
        actor: BorrowerRep
        preconditions:
          - "expected_loan_version == loan.version (OCC)"
        side_effects:
          - "Provided term fields replace the current terms; negotiated_round += 1; loan.version += 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /campus/loan-agreements/{id}/counter by LoansOfficer (lender's counter of the borrower's counter)"
        actor: LoansOfficer
        preconditions:
          - "expected_loan_version == loan.version (OCC)"
        side_effects:
          - "Provided term fields replace the current terms; negotiated_round += 1; loan.version += 1"
      - from: PROPOSED
        to: AGREED
        trigger: "POST /campus/loan-agreements/{id}/accept by BorrowerRep (borrower accepts lender's terms)"
        actor: BorrowerRep
        preconditions:
          - "expected_loan_version == loan.version (OCC)"
          - "Terms valid per calculations loan_terms_validation (courier + indemnity minimums)"
          - "Loan window [loan_start_date, loan_end_date) does not overlap any other AGREED or ACTIVE loan for the same object (overlap is enforced at accept, NOT at propose)"
        side_effects:
          - "premium_cents := loan_premium_cents FINAL variant on current terms; loan.version += 1"
      - from: COUNTERED
        to: AGREED
        trigger: "POST /campus/loan-agreements/{id}/accept by LoansOfficer (lender accepts borrower's counter)"
        actor: LoansOfficer
        preconditions:
          - "expected_loan_version == loan.version (OCC)"
          - "Terms valid per loan_terms_validation"
          - "No overlap with other AGREED or ACTIVE loans for the same object"
        side_effects:
          - "premium_cents := FINAL variant; loan.version += 1"
      - from: AGREED
        to: ACTIVE
        trigger: "POST /campus/loan-agreements/{id}/activate"
        actor: LoansOfficer
        preconditions:
          - "An OUTBOUND ConditionReport for this loan exists with status ACCEPTED (else ERR_CONDITION_REPORT_REQUIRED)"
          - "Object status == IN_COLLECTION (else ERR_OBJECT_NOT_IN_COLLECTION)"
        side_effects:
          - "Object status -> OUT_ON_LOAN; loan.version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /campus/loan-agreements/{id}/close"
        actor: LoansOfficer
        preconditions:
          - "A RETURN ConditionReport for this loan exists with status ACCEPTED (else ERR_CONDITION_REPORT_REQUIRED)"
        side_effects:
          - "Object status -> IN_COLLECTION when the accepted RETURN report has damage_noted == false; -> UNDER_CONSERVATION when damage_noted == true; loan.version += 1"
      - from: [PROPOSED, COUNTERED, AGREED]
        to: CANCELLED
        trigger: "cascade only: deaccession execute of the underlying object cancels all non-terminal loans"
        actor: system
        preconditions: []
        side_effects:
          - "Every non-terminal ConditionReport of the cancelled loan flips to CANCELLED (transitive link: review execute -> object DEACCESSIONED/REPATRIATED... object flip cancels loans -> loan cancellation cancels its reports)"

  - entity: ConditionReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, SUPERSEDED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /campus/condition-reports/{id}/decide {outcome: ACCEPTED}"
        actor: LoansOfficer
        preconditions:
          - "Loan status is AGREED or ACTIVE (reports are only decidable while the loan is live)"
        side_effects: []
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /campus/condition-reports/{id}/decide {outcome: DISPUTED}"
        actor: LoansOfficer
        preconditions:
          - "Loan status is AGREED or ACTIVE"
        side_effects: []
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system: a new ConditionReport of the same report_kind is created for the same loan"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SUBMITTED, DISPUTED]
        to: CANCELLED
        trigger: "cascade from loan cancellation (deaccession execute)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CollectionReview
    initial_state: DRAFT
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /campus/collection-reviews/{id}/submit"
        actor: "Curator (X-User-ID must equal the creator's X-User-ID recorded at create)"
        preconditions: []
        side_effects:
          - "submitted_by_user_id := X-User-ID; review.version += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /campus/collection-reviews/{id}/decide {outcome: APPROVED}"
        actor: CommitteeChair
        preconditions:
          - "expected_review_version == review.version (OCC)"
          - "Segregation of duties: X-User-ID != review.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "DEACCESSION and object.is_cultural_property == true require cultural_property_review_completed == true (else ERR_CULTURAL_PROPERTY_REVIEW_PENDING)"
          - "DEACCESSION: no ACTIVE loan exists for the object (else ERR_OBJECT_ON_ACTIVE_LOAN); AGREED or in-negotiation loans do NOT block approval — they are cascade-cancelled at execute"
          - "ACQUISITION: fund committed_available_cents >= estimated_cost_cents (else ERR_INSUFFICIENT_FUND_AVAILABLE)"
        side_effects:
          - "DEACCESSION: object status -> PENDING_DEACCESSION; review.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /campus/collection-reviews/{id}/decide {outcome: REJECTED}"
        actor: CommitteeChair
        preconditions:
          - "expected_review_version == review.version (OCC)"
          - "Segregation of duties: X-User-ID != review.submitted_by_user_id"
        side_effects:
          - "review.version += 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /campus/collection-reviews/{id}/execute"
        actor: Registrar
        preconditions:
          - "ACQUISITION: fund still ACTIVE and committed_available_cents >= actual_cost_cents given in the execute payload"
          - "DEACCESSION: no ACTIVE loan exists for the object at execute time (re-checked; else ERR_OBJECT_ON_ACTIVE_LOAN); AGREED/PROPOSED/COUNTERED loans are cascade-cancelled instead"
        side_effects:
          - "ACQUISITION: create CollectionObject (title := proposed_object_title, declared_value_cents := actual_cost_cents, status IN_COLLECTION) AND post Expenditure(amount=actual_cost_cents, activity_type=ACQUISITION, review_id=this review) on review.fund_id"
          - "DEACCESSION: object -> DEACCESSIONED (or REPATRIATED when disposal_method == REPATRIATION); all non-terminal LoanAgreements for the object -> CANCELLED; all their non-terminal ConditionReports -> CANCELLED"

  - entity: FundAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /campus/funds/{id}/set-status {status: FROZEN}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "New expenditures, acquisition decides/executes on this fund are blocked (ERR_FUND_FROZEN)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /campus/funds/{id}/set-status {status: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Expenditure
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /campus/expenditures/{id}/void"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Fund settled_available_cents and committed_available_cents rise by amount_cents (compensating invariant)"

  - entity: ResearchAccessRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /campus/research-access-requests/{id}/decide {outcome: APPROVED}"
        actor: Registrar
        preconditions:
          - "Object status == IN_COLLECTION (else ERR_OBJECT_NOT_IN_COLLECTION)"
          - "Closed visit interval [visit_start_date, visit_end_date] overlaps no other APPROVED research visit for the same object (else ERR_RESEARCH_VISIT_CONFLICT)"
          - "Visit interval overlaps no AGREED or ACTIVE loan window for the object (half-open loan window vs closed visit window: overlap iff visit_start_date < loan_end_date AND loan_start_date <= visit_end_date) (else ERR_OBJECT_RESERVED_FOR_LOAN)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /campus/research-access-requests/{id}/decide {outcome: DENIED}"
        actor: Registrar
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: loan-negotiation-stale-version
    parent_entity: LoanAgreement
    write_endpoint: "POST /campus/loan-agreements/{id}/counter"
    occ_field: "expected_loan_version"
    description: |
      Countering a LoanAgreement whose version has advanced beyond the version
      the writer last observed is rejected. The canonical case: the lender's
      counter (COUNTERED -> PROPOSED) legitimately supersedes the borrower's
      view; a second counter carrying the pre-counter version is therefore
      stale and loses with 412. Stated in OCC terms: the request's
      expected_loan_version must equal the loan's current version.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
  - rule_id: loan-accept-stale-version
    parent_entity: LoanAgreement
    write_endpoint: "POST /campus/loan-agreements/{id}/accept"
    occ_field: "expected_loan_version"
    description: |
      Accepting a LoanAgreement on a stale observed version is rejected; an
      intervening counter (which bumps version and negotiated_round) means the
      acceptor has not seen the current terms.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
  - rule_id: review-decide-stale-version
    parent_entity: CollectionReview
    write_endpoint: "POST /campus/collection-reviews/{id}/decide"
    occ_field: "expected_review_version"
    description: |
      Deciding a CollectionReview whose version has advanced since the chair
      last read it (e.g., the curator re-submitted amended terms, which bumps
      version) is rejected with 412.
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pass_slot_availability
    trigger: "POST /campus/museums/{id}/timed-entry-passes (create evaluation)"
    algorithm: threshold
    formula: |
      if museum.requires_timed_pass == false: reject ERR_TIMED_PASS_NOT_USED_HERE
      if visit_date in museum.closed_dates: reject ERR_MUSEUM_CLOSED_ON_DATE
      slot_used  = count(passes at this museum, same visit_date, same entry_quarter_hour, status in {RESERVED, ADMITTED})
      daily_used = count(passes at this museum, same visit_date, status in {RESERVED, ADMITTED})
      reservable = min(museum.quarter_hour_pass_quota - slot_used,
                       museum.daily_pass_quota - daily_used)
      if slot_used >= museum.quarter_hour_pass_quota: reject ERR_SLOT_QUOTA_EXHAUSTED
      elif daily_used >= museum.daily_pass_quota:     reject ERR_DAILY_QUOTA_EXHAUSTED
      # boundary: slot_used == quota - 1 succeeds; slot_used == quota fails
    input_set: "TimedEntryPass rows of the museum with status in {RESERVED, ADMITTED}; CANCELLED and EXPIRED are excluded"
    constants:
      SLOT_COUNT_PER_DAY: 30
      ADMIT_GRACE_SLOTS: 2
    precision: "integer counts; no rounding"

  - name: screening_backlog_minutes
    trigger: "read-side diagnostic computed inside admit evaluation and exposed on Museum GET as screening_backlog_minutes for the current slot"
    algorithm: forward_looking
    formula: |
      pending = count(passes RESERVED at museum for today with entry_quarter_hour <= current slot)
      backlog_FORWARD = max(0, pending - museum.screening_rate_per_quarter_hour) * 15
      backlog_REALIZED = max(0, (admitted_so_far_today / max(1, slots_elapsed_today)) projected forward)
      # pinned: the server reports backlog_FORWARD; REALIZED is the alternative reading used by ops dashboards
    input_set: "passes of the museum on the current logical date"
    constants:
      SLOT_MINUTES: 15
    precision: "whole minutes"
    variants:
      - name: FORWARD
        when: "server-reported value on Museum GET"
        difference: "counts RESERVED demand against one slot of throughput"
      - name: REALIZED
        when: "ops-dashboard reading (documented variant; never server-reported)"
        difference: "extrapolates from ADMITTED counts so far; diverges from FORWARD whenever reserved != admitted pace"

  - name: loan_premium_cents
    trigger: "LoanAgreement accept (both from PROPOSED and from COUNTERED)"
    algorithm: tiered_pricing
    formula: |
      # FINAL variant — evaluation order is pinned; do not reorder:
      # (1) base_unrounded = tier1 + tier2 + tier3 in exact arithmetic
      # (2) base_cents     = round_half_up(base_unrounded)          <- round ONCE here
      # (3) surcharge      = courier_required ? round_half_up(base_cents * COURIER_SURCHARGE_RATE) : 0
      # (4) premium_cents  = base_cents + surcharge                 <- sum of rounded parts
      tier1 = min(declared_value_cents, TIER1_CAP) * TIER1_RATE
      tier2 = min(max(0, declared_value_cents - TIER1_CAP), TIER2_WIDTH) * TIER2_RATE
      tier3 = max(0, declared_value_cents - TIER1_CAP - TIER2_WIDTH) * TIER3_RATE
      # coverage_type == INDEMNITY: premium_cents = 0 (federal indemnity replaces commercial insurance)
    input_set: "the loan's current terms at accept time"
    constants:
      TIER1_CAP: 100000000
      TIER1_RATE: 0.006
      TIER2_WIDTH: 400000000
      TIER2_RATE: 0.0035
      TIER3_RATE: 0.0015
      COURIER_SURCHARGE_RATE: 0.12
      PROVISIONAL_FLAT_RATE: 0.008
      INDEMNITY_MIN_DECLARED_VALUE_CENTS: 500000000
      COURIER_MIN_DECLARED_VALUE_CENTS: 100000000
    precision: "cents; round_half_up applied exactly at steps (2) and (3)"
    variants:
      - name: PROVISIONAL
        when: "quote shown during negotiation (documented estimate; never persisted)"
        difference: "flat 0.8% of declared_value_cents, no tiering, no courier surcharge — for declared 250000000 with courier: PROVISIONAL 2000000 vs FINAL 1260000"
      - name: FINAL
        when: "persisted to loan.premium_cents at accept"
        difference: "tiered base + courier surcharge with the pinned rounding order — for declared 1000075 with courier: pinned 6720; sum-then-round reading gives 6721 and is WRONG"

  - name: loan_terms_validation
    trigger: "LoanAgreement accept (both actors)"
    algorithm: constraint_propagation
    formula: |
      if courier_required == false and declared_value_cents >= COURIER_MIN_DECLARED_VALUE_CENTS:
          reject ERR_COURIER_REQUIRED
      if coverage_type == INDEMNITY:
          require declared_value_cents >= INDEMNITY_MIN_DECLARED_VALUE_CENTS (else ERR_INDEMNITY_MINIMUM_NOT_MET)
          require courier_required == true (else ERR_INDEMNITY_REQUIRES_COURIER)
    input_set: "the loan's current terms"
    constants:
      INDEMNITY_MIN_DECLARED_VALUE_CENTS: 500000000
      COURIER_MIN_DECLARED_VALUE_CENTS: 100000000
    precision: "n/a"

  - name: loan_window_overlap
    trigger: "LoanAgreement accept"
    algorithm: interval_merge
    formula: |
      windows are half-open [loan_start_date, loan_end_date)
      overlap iff self.loan_start_date < other.loan_end_date AND other.loan_start_date < self.loan_end_date
      adjacency (self.start == other.end) is NOT overlap — back-to-back loans are allowed
      only loans in status {AGREED, ACTIVE} for the same object participate
    input_set: "other LoanAgreements of the same object in status AGREED or ACTIVE"
    precision: "date granularity"

  - name: member_unit_price_cents
    trigger: "POST /campus/exhibitions/{id}/tickets"
    algorithm: threshold
    formula: |
      if member_id present and Member.member_status == ACTIVE:
          price_paid_cents = round_half_up(exhibition.fee_cents * (1 - MEMBER_DISCOUNT_PCT))
      else:
          price_paid_cents = exhibition.fee_cents
      # worked values: fee 2500 -> member 2000; fee 2499 -> member 1999; fee 2501 -> member 2001
    input_set: "the exhibition and (optionally) the member"
    constants:
      MEMBER_DISCOUNT_PCT: 0.20
    precision: "round_half_up to whole cents, per single ticket"

  - name: ticket_quota_remaining
    trigger: "POST /campus/exhibitions/{id}/tickets; also refunded on refund/close"
    algorithm: aggregation
    formula: |
      sold = count(tickets of exhibition with visit_date == requested date and status in {PURCHASED, REDEEMED})
      remaining = exhibition.daily_ticket_quota - sold
      purchase allowed iff sold < daily_ticket_quota (boundary: sold == quota is exhausted)
      invariant: for every (exhibition, visit_date), sold + remaining == daily_ticket_quota at all times
    input_set: "tickets of the exhibition for that date; REFUNDED excluded"
    precision: "integer counts"

  - name: presale_window_check
    trigger: "POST /campus/exhibitions/{id}/tickets"
    algorithm: threshold
    formula: |
      half-open windows: member sales allowed when current_utc >= member_presale_opens_at
      public sales allowed when current_utc >= public_sale_opens_at
      at exactly public_sale_opens_at a non-member purchase SUCCEEDS (>= not >)
      before public open, a non-member purchase fails ERR_PRESALE_MEMBER_ONLY
      before member presale open, every purchase fails ERR_SALE_NOT_OPEN
    input_set: "exhibition window fields vs the logical clock"
    precision: "second precision on ISO datetimes"

  - name: reservation_status_resolution
    trigger: "POST /campus/school-reservations (synchronous evaluation) and every promotion re-evaluation"
    algorithm: constraint_propagation
    formula: |
      # evaluation order is PINNED — do not reorder (circular-looking dependency):
      # (1) hard validation first: headcount > program.max_group_size -> reject ERR_GROUP_TOO_LARGE
      #     visit_date weekday != program.day_of_week -> reject ERR_PROGRAM_DAY_MISMATCH
      # (2) capacity: confirmed_headcount = sum(headcount of CONFIRMED reservations for (program, visit_date))
      #     capacity_fits = confirmed_headcount + headcount <= program.student_capacity
      # (3) docents_required = ceil(headcount / program.docent_ratio)
      # (4) docents_confirmed = count(DocentAssignments for (program, service_date == visit_date) with status CONFIRMED)
      # (5) queue_blocked = any earlier-created WAITLISTED reservation exists for (program, visit_date)
      # status := CONFIRMED iff capacity_fits AND docents_confirmed >= docents_required AND NOT queue_blocked
      #           else WAITLISTED
      # NOTE the circularity this resolves: confirmed docents gate confirmation, and confirmation
      # consumes capacity that later groups' docent math is checked against — order (2)->(4)->(5) is normative
    input_set: "reservations and docent assignments of the program for the visit_date"
    precision: "integer counts; ceil division"

  - name: waitlist_promotion
    trigger: "school reservation cancel of a CONFIRMED reservation; docent assignment confirm"
    algorithm: waterfall_allocation
    formula: |
      scan WAITLISTED reservations for (program_id, visit_date) in created_at ASC order
      promote the head to CONFIRMED iff it now satisfies reservation_status_resolution steps (2)-(4)
      STRICT FIFO with head-of-line blocking: if the head does not fit, STOP — do not skip to later entries
      after a successful promotion, re-evaluate the new head; repeat until the head does not fit or the queue is empty
      tie-break: created_at ASC only (millisecond timestamps; never use id)
    input_set: "WAITLISTED reservations of (program, visit_date)"
    precision: "n/a"

  - name: gallery_schedule_overlap
    trigger: "POST /campus/museums/{id}/education-programs (create)"
    algorithm: interval_merge
    formula: |
      each program occupies its gallery with a SETUP BUFFER: occupied = [start_minute - 30, end_minute + 30)
      two programs conflict iff same museum, same gallery_code, same day_of_week, and their
      buffer-expanded half-open intervals intersect
      a gap of exactly 30 minutes between sessions is allowed (expanded intervals touch but do not overlap)
    input_set: "SCHEDULED programs of the same museum + gallery_code + day_of_week"
    constants:
      SETUP_BUFFER_MINUTES: 30
    precision: "minute granularity"

  - name: research_visit_overlap
    trigger: "research-access decide APPROVE"
    algorithm: interval_merge
    formula: |
      research visits are CLOSED intervals [visit_start_date, visit_end_date] — both ends inclusive
      two APPROVED visits for the same object conflict iff visit1.start <= visit2.end AND visit2.start <= visit1.end
      because the interval is closed, visit2.start == visit1.end IS a conflict (contrast with half-open loan windows)
      visit-vs-loan cross check: conflict iff visit_start_date < loan_end_date AND loan_start_date <= visit_end_date
      against loans in {AGREED, ACTIVE}
    input_set: "APPROVED ResearchAccessRequests and AGREED/ACTIVE LoanAgreements of the object"
    precision: "date granularity"

  - name: fund_available_cents
    trigger: "expenditure create; acquisition review decide/execute; FundAccount GET"
    algorithm: aggregation
    formula: |
      settled_available_cents   = appropriation_cents + receipts_cents
                                  - sum(amount_cents of expenditures with status POSTED on this fund)
      committed_available_cents = settled_available_cents
                                  - sum(estimated_cost_cents of ACQUISITION CollectionReviews with status APPROVED
                                        (not yet EXECUTED) naming this fund)
      GATING: expenditure creation and acquisition decide/execute are validated against
      committed_available_cents (the conservative COMMITTED variant)
    input_set: "POSTED expenditures (VOIDED excluded), APPROVED-and-unexecuted acquisition reviews, ticket receipts net of refunds (TRUST funds)"
    precision: "integer cents"
    variants:
      - name: SETTLED
        when: "reported as settled_available_cents"
        difference: "ignores approved-but-unexecuted acquisition commitments"
      - name: COMMITTED
        when: "reported as committed_available_cents AND used for all gating"
        difference: "subtracts acquisition commitments — for appropriation 1000000000, posted 120000000, one APPROVED unexecuted acquisition est 300000000: SETTLED 880000000 vs COMMITTED 580000000; an expenditure of 700000000 passes SETTLED but fails COMMITTED (gated -> ERR_INSUFFICIENT_FUND_AVAILABLE)"

  - name: fund_activity_permission
    trigger: "expenditure create; acquisition decide/execute"
    algorithm: constraint_propagation
    formula: |
      FEDERAL funds: activity_type in {OPERATIONS, EDUCATION} permitted; ACQUISITION and EXHIBITION forbidden
      TRUST funds:   activity_type in {OPERATIONS, EDUCATION, ACQUISITION, EXHIBITION} permitted
      violation -> ERR_FUND_ACTIVITY_NOT_PERMITTED
      (mirrors the federal-appropriation / trust-fund separation: appropriated funds may not
       purchase collection objects; exhibition ticket revenue is trust money)
    input_set: "the fund and the requested activity_type"
    precision: "n/a"

  - name: member_status_calc
    trigger: "every Member read and every member-linked purchase"
    algorithm: threshold
    formula: |
      expires_on = date(created_at) + membership_term_months calendar months
      member_status = ACTIVE iff current logical date <= expires_on else LAPSED
      boundary: on expires_on itself the member is still ACTIVE; the day after -> LAPSED
    input_set: "the member row and the logical clock"
    precision: "date granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list; ownership rules (Member as self, Docent as self, organizer as creator, review submitter as creator) enforced here", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path-referenced resources exist, validated left-to-right (museum before exhibition before ticket)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "Body-referenced FK ids exist (member_id, program_id, docent_id, object_id, fund_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "endpoints taking body FKs" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition exists (per §1.2)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action/transition endpoints" }
  - { priority: 6, category: state, check: "Fund is ACTIVE for expenditure create / acquisition decide / acquisition execute", error_id: ERR_FUND_FROZEN, http_status: 409, applies_to: "POST /campus/funds/{id}/expenditures, review decide/execute on ACQUISITION" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: review decide X-User-ID != review.submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /campus/collection-reviews/{id}/decide" }
  - { priority: 8, category: business_safety, check: "DEACCESSION of a cultural-property object requires cultural_property_review_completed == true", error_id: ERR_CULTURAL_PROPERTY_REVIEW_PENDING, http_status: 422, applies_to: "POST /campus/collection-reviews/{id}/decide (APPROVED)" }
  - { priority: 9, category: business_constraint, check: "Request shape and enum/range validity: required fields present, entry_quarter_hour in 0..29, dates well-formed, end after start, review_kind field pairing (ACQUISITION needs fund_id+estimated_cost_cents+proposed_object_title and null object_id; DEACCESSION needs object_id+disposal_method and null fund_id)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints" }
  - { priority: 10, category: business_constraint, check: "Duplicate pass: one non-terminal pass per (museum, visitor_name, visit_date)", error_id: ERR_DUPLICATE_PASS, http_status: 409, applies_to: "POST /campus/museums/{id}/timed-entry-passes" }
  - { priority: 11, category: business_constraint, check: "Gallery buffer-expanded schedule overlap (calculation gallery_schedule_overlap)", error_id: ERR_GALLERY_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /campus/museums/{id}/education-programs" }
  - { priority: 12, category: business_constraint, check: "Docent certification meets program required_docent_certification; docent active; same docent not already assigned to another SCHEDULED program on the same service_date", error_id: ERR_DOCENT_NOT_CERTIFIED, http_status: 422, applies_to: "POST /campus/education-programs/{id}/docent-assignments" }
  - { priority: 13, category: business_temporal, check: "Museum not closed on visit_date (pass reserve, ticket purchase, reservation create); passes already RESERVED on a closure date are expired by the close-day cascade instead", error_id: ERR_MUSEUM_CLOSED_ON_DATE, http_status: 409, applies_to: "pass create, ticket create, reservation create" }
  - { priority: 14, category: business_temporal, check: "Exhibition sale window: before presale -> ERR_SALE_NOT_OPEN; presale window for non-members -> ERR_PRESALE_MEMBER_ONLY; lapsed member in presale/member price -> ERR_MEMBER_LAPSED", error_id: "ERR_SALE_NOT_OPEN | ERR_PRESALE_MEMBER_ONLY | ERR_MEMBER_LAPSED", http_status: 409, applies_to: "POST /campus/exhibitions/{id}/tickets" }
  - { priority: 15, category: business_temporal, check: "Pass admit grace window (slot <= entry_quarter_hour + 2); refund only on/before visit_date; redeem only on visit_date", error_id: "ERR_PASS_EXPIRED | ERR_REFUND_WINDOW_CLOSED | ERR_VISIT_DATE_MISMATCH", http_status: 409, applies_to: "admit, refund, redeem" }
  - { priority: 16, category: business_constraint, check: "Capacity: slot quota then daily quota (passes); daily ticket quota (tickets); screening throughput (admit); group size vs max_group_size", error_id: "ERR_SLOT_QUOTA_EXHAUSTED | ERR_DAILY_QUOTA_EXHAUSTED | ERR_TICKET_QUOTA_EXHAUSTED | ERR_SCREENING_THROUGHPUT_FULL | ERR_GROUP_TOO_LARGE", http_status: 409, applies_to: "pass create, ticket create, admit, reservation create" }
  - { priority: 17, category: business_referential, check: "Loan accept: no overlap with AGREED/ACTIVE loans of the object (ERR_LOAN_PERIOD_CONFLICT); terms valid (ERR_COURIER_REQUIRED / ERR_INDEMNITY_MINIMUM_NOT_MET / ERR_INDEMNITY_REQUIRES_COURIER); activate/close need accepted condition reports (ERR_CONDITION_REPORT_REQUIRED); object IN_COLLECTION where required (ERR_OBJECT_NOT_IN_COLLECTION)", error_id: "ERR_LOAN_PERIOD_CONFLICT | ERR_COURIER_REQUIRED | ERR_INDEMNITY_MINIMUM_NOT_MET | ERR_INDEMNITY_REQUIRES_COURIER | ERR_CONDITION_REPORT_REQUIRED | ERR_OBJECT_NOT_IN_COLLECTION", http_status: 409, applies_to: "loan accept/activate/close, review submit/decide (deaccession object state)" }
  - { priority: 18, category: business_referential, check: "Deaccession decide/execute: no ACTIVE loan on the object (AGREED and in-negotiation loans are cascade-cancelled at execute); research approve: object IN_COLLECTION, no visit-visit overlap (closed interval), no visit-loan overlap", error_id: "ERR_OBJECT_ON_ACTIVE_LOAN | ERR_RESEARCH_VISIT_CONFLICT | ERR_OBJECT_RESERVED_FOR_LOAN", http_status: 409, applies_to: "review decide/execute, research decide" }
  - { priority: 19, category: business_fiscal, check: "Fund activity permission per fund_type (ERR_FUND_ACTIVITY_NOT_PERMITTED)", error_id: ERR_FUND_ACTIVITY_NOT_PERMITTED, http_status: 422, applies_to: "expenditure create, acquisition decide/execute" }
  - { priority: 20, category: business_fiscal, check: "amount <= fund committed_available_cents (COMMITTED variant gates)", error_id: ERR_INSUFFICIENT_FUND_AVAILABLE, http_status: 409, applies_to: "expenditure create, acquisition decide/execute" }

# =============================================================================
# §1.5 API Endpoint Table (66 endpoints)
# All business paths live under api_prefix /campus. The logical-clock endpoint
# is a test-driving endpoint outside the prefix. List endpoints accept the
# declared filter fields plus the envelope pagination fields limit?/offset?.
# =============================================================================
endpoints:
  # --- test-driving logical clock (outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads that default and never the wall clock. All date/datetime rules in this scaffold read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["Lazy EXPIRED evaluation for passes and LAPSED evaluation for members read the new clock"]

  # --- Museum ---
  - method: POST
    path: "/campus/museums"
    description: "Create a museum"
    roles: [PlatformAdmin]
    code: 201
    input: [museum_code, display_name, requires_timed_pass, quarter_hour_pass_quota, daily_pass_quota, screening_rate_per_quarter_hour]
    output: Museum
    side_effects: ["closed_dates := []"]
  - method: GET
    path: "/campus/museums/{id}"
    description: "Read a museum including closed_dates and the FORWARD screening backlog for the current slot"
    roles: [PlatformAdmin, VisitorServices, SecurityScreener, ExhibitionManager, ProgramCoordinator, LoansOfficer, Registrar, Curator, CommitteeChair, FinanceOfficer, Docent, Scholar, Member, Public]
    code: 200
    input: []
    output: Museum
    side_effects: []
  - method: POST
    path: "/campus/museums/{id}/close-day"
    description: "Emergency-close the museum on a date: appends to closed_dates and cascades RESERVED passes on that date to EXPIRED"
    roles: [PlatformAdmin]
    code: 200
    input: [closure_date]
    output: Museum
    side_effects: ["closed_dates += closure_date", "cascade: RESERVED TimedEntryPasses at this museum on closure_date -> EXPIRED", "increments Museum.version by 1"]

  # --- TimedEntryPass ---
  - method: POST
    path: "/campus/museums/{id}/timed-entry-passes"
    description: "Reserve a timed entry pass (free; general admission is never charged)"
    roles: [Public, Member, VisitorServices]
    code: 201
    input: [visitor_name, visit_date, entry_quarter_hour, "holder_member_id?"]
    output: TimedEntryPass
    side_effects: ["status := RESERVED", "pass_slot_availability evaluation (slot quota, daily quota, duplicate-pass check)"]
  - method: GET
    path: "/campus/timed-entry-passes"
    description: "List passes with filters"
    roles: [PlatformAdmin, VisitorServices, SecurityScreener, Member, Public]
    code: 200
    input: ["museum_id?", "visit_date?", "holder_member_id?", "limit?", "offset?"]
    output: TimedEntryPass[]
    side_effects: []
  - method: POST
    path: "/campus/timed-entry-passes/{id}/cancel"
    description: "Cancel a RESERVED pass (organizer self, holding member self, or VisitorServices)"
    roles: [Public, Member, VisitorServices]
    code: 200
    input: []
    output: TimedEntryPass
    side_effects: ["status -> CANCELLED", "slot and daily quota released"]
  - method: POST
    path: "/campus/timed-entry-passes/{id}/admit"
    description: "Admit a pass holder through security screening for the current slot"
    roles: [SecurityScreener]
    code: 200
    input: []
    output: TimedEntryPass
    side_effects: ["status -> ADMITTED", "admitted_slot := current slot", "screening throughput for (museum, visit_date, current slot) consumed"]

  # --- Member ---
  - method: POST
    path: "/campus/members"
    description: "Register a member; expires_on computed from join date + term"
    roles: [Public, VisitorServices]
    code: 201
    input: [full_name, email, membership_term_months]
    output: Member
    side_effects: ["expires_on computed", "member_status := ACTIVE"]
  - method: GET
    path: "/campus/members/{id}"
    description: "Read a member including computed member_status"
    roles: [PlatformAdmin, VisitorServices, ExhibitionManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- SpecialExhibition ---
  - method: POST
    path: "/campus/museums/{id}/exhibitions"
    description: "Create a special exhibition (fee may be 0)"
    roles: [ExhibitionManager]
    code: 201
    input: [title, fee_cents, daily_ticket_quota, member_presale_opens_at, public_sale_opens_at, revenue_fund_id]
    output: SpecialExhibition
    side_effects: ["status := DRAFT", "revenue_fund must exist and be a TRUST fund"]
  - method: GET
    path: "/campus/exhibitions/{id}"
    description: "Read an exhibition"
    roles: [PlatformAdmin, VisitorServices, ExhibitionManager, Member, Public]
    code: 200
    input: []
    output: SpecialExhibition
    side_effects: []
  - method: GET
    path: "/campus/exhibitions"
    description: "List exhibitions with filters"
    roles: [PlatformAdmin, VisitorServices, ExhibitionManager, Member, Public]
    code: 200
    input: ["museum_id?", "revenue_fund_id?", "limit?", "offset?"]
    output: SpecialExhibition[]
    side_effects: []
  - method: POST
    path: "/campus/exhibitions/{id}/open-sale"
    description: "Move exhibition DRAFT -> ON_SALE"
    roles: [ExhibitionManager]
    code: 200
    input: []
    output: SpecialExhibition
    side_effects: ["status -> ON_SALE"]
  - method: POST
    path: "/campus/exhibitions/{id}/close"
    description: "Close exhibition: all PURCHASED tickets auto-REFUNDED and the revenue fund's receipts debited per ticket"
    roles: [ExhibitionManager]
    code: 200
    input: []
    output: SpecialExhibition
    side_effects: ["status -> CLOSED", "cascade link 1: PURCHASED tickets -> REFUNDED", "cascade link 2: each auto-refund debits revenue_fund receipts_cents by price_paid_cents"]

  # --- ExhibitionTicket ---
  - method: POST
    path: "/campus/exhibitions/{id}/tickets"
    description: "Purchase a ticket; presale/window/member-price/quota rules per calculations"
    roles: [Public, Member]
    code: 201
    input: [buyer_name, visit_date, "member_id?"]
    output: ExhibitionTicket
    side_effects: ["price_paid_cents computed (member_unit_price_cents)", "status := PURCHASED", "revenue_fund receipts_cents credited by price_paid_cents", "daily quota for (exhibition, visit_date) consumed"]
  - method: GET
    path: "/campus/tickets/{id}"
    description: "Read a ticket"
    roles: [PlatformAdmin, VisitorServices, ExhibitionManager, Member, Public]
    code: 200
    input: []
    output: ExhibitionTicket
    side_effects: []
  - method: GET
    path: "/campus/tickets"
    description: "List tickets with filters"
    roles: [PlatformAdmin, VisitorServices, ExhibitionManager]
    code: 200
    input: ["exhibition_id?", "member_id?", "limit?", "offset?"]
    output: ExhibitionTicket[]
    side_effects: []
  - method: POST
    path: "/campus/tickets/{id}/refund"
    description: "Refund a PURCHASED ticket on or before its visit_date"
    roles: [VisitorServices]
    code: 200
    input: []
    output: ExhibitionTicket
    side_effects: ["status -> REFUNDED", "revenue_fund receipts_cents debited by price_paid_cents", "daily quota freed"]
  - method: POST
    path: "/campus/tickets/{id}/redeem"
    description: "Redeem a ticket at the exhibition entrance on its visit_date"
    roles: [SecurityScreener]
    code: 200
    input: []
    output: ExhibitionTicket
    side_effects: ["status -> REDEEMED"]

  # --- Docent ---
  - method: POST
    path: "/campus/docents"
    description: "Register a volunteer docent"
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, certification_level, "active?"]
    output: Docent
    side_effects: []
  - method: GET
    path: "/campus/docents/{id}"
    description: "Read a docent"
    roles: [PlatformAdmin, ProgramCoordinator, Docent]
    code: 200
    input: []
    output: Docent
    side_effects: []

  # --- EducationProgram ---
  - method: POST
    path: "/campus/museums/{id}/education-programs"
    description: "Create a weekly education program; gallery buffer-expanded schedule conflict enforced"
    roles: [ProgramCoordinator]
    code: 201
    input: [title, gallery_code, day_of_week, start_minute, end_minute, student_capacity, docent_ratio, max_group_size, required_docent_certification]
    output: EducationProgram
    side_effects: ["status := SCHEDULED", "gallery_schedule_overlap check"]
  - method: GET
    path: "/campus/education-programs"
    description: "List education programs with filters"
    roles: [PlatformAdmin, ProgramCoordinator, Docent, Public]
    code: 200
    input: ["museum_id?", "limit?", "offset?"]
    output: EducationProgram[]
    side_effects: []
  - method: POST
    path: "/campus/education-programs/{id}/cancel"
    description: "Cancel a program; cascades to its reservations and ASSIGNED docent assignments"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: EducationProgram
    side_effects: ["status -> CANCELLED", "cascade: CONFIRMED/WAITLISTED reservations -> CANCELLED", "conditional cascade: ASSIGNED assignments -> RELEASED (CONFIRMED untouched)"]

  # --- DocentAssignment ---
  - method: POST
    path: "/campus/education-programs/{id}/docent-assignments"
    description: "Assign a docent to a program service date"
    roles: [ProgramCoordinator]
    code: 201
    input: [docent_id, service_date]
    output: DocentAssignment
    side_effects: ["status := ASSIGNED", "certification/active/double-booking checks"]
  - method: GET
    path: "/campus/docent-assignments"
    description: "List docent assignments with filters"
    roles: [PlatformAdmin, ProgramCoordinator, Docent]
    code: 200
    input: ["program_id?", "docent_id?", "limit?", "offset?"]
    output: DocentAssignment[]
    side_effects: []
  - method: POST
    path: "/campus/docent-assignments/{id}/confirm"
    description: "Docent confirms own assignment; triggers waitlist re-evaluation for (program, service_date)"
    roles: [Docent]
    code: 200
    input: []
    output: DocentAssignment
    side_effects: ["status -> CONFIRMED", "waitlist_promotion scan for (program_id, service_date)"]

  # --- SchoolGroupReservation ---
  - method: POST
    path: "/campus/school-reservations"
    description: "Reserve a school group visit; synchronously lands CONFIRMED or WAITLISTED per reservation_status_resolution"
    roles: [Public]
    code: 201
    input: [museum_id, program_id, school_name, headcount, visit_date]
    output: SchoolGroupReservation
    side_effects: ["status := CONFIRMED or WAITLISTED (never stored REQUESTED)", "capacity consumed when CONFIRMED"]
  - method: GET
    path: "/campus/school-reservations"
    description: "List reservations with filters"
    roles: [PlatformAdmin, ProgramCoordinator, Public]
    code: 200
    input: ["museum_id?", "program_id?", "limit?", "offset?"]
    output: SchoolGroupReservation[]
    side_effects: []
  - method: POST
    path: "/campus/school-reservations/{id}/cancel"
    description: "Cancel a CONFIRMED or WAITLISTED reservation; a CONFIRMED cancel triggers waitlist promotion"
    roles: [Public, ProgramCoordinator]
    code: 200
    input: []
    output: SchoolGroupReservation
    side_effects: ["status -> CANCELLED", "when cancelled from CONFIRMED: capacity released and waitlist_promotion scan runs for (program_id, visit_date)"]

  # --- CollectionObject ---
  - method: POST
    path: "/campus/collection-objects"
    description: "Accession a collection object directly (outside acquisition workflow)"
    roles: [Registrar]
    code: 201
    input: [accession_number, title, declared_value_cents, "is_cultural_property?"]
    output: CollectionObject
    side_effects: ["status := IN_COLLECTION"]
  - method: GET
    path: "/campus/collection-objects/{id}"
    description: "Read a collection object"
    roles: [PlatformAdmin, Registrar, LoansOfficer, Curator, CommitteeChair, Scholar]
    code: 200
    input: []
    output: CollectionObject
    side_effects: []
  - method: POST
    path: "/campus/collection-objects/{id}/release-conservation"
    description: "Release an object from UNDER_CONSERVATION back to IN_COLLECTION"
    roles: [Registrar]
    code: 200
    input: []
    output: CollectionObject
    side_effects: ["status -> IN_COLLECTION"]

  # --- LoanAgreement ---
  - method: POST
    path: "/campus/collection-objects/{id}/loan-agreements"
    description: "Open loan negotiation for an object; created directly in PROPOSED with negotiated_round 1"
    roles: [LoansOfficer]
    code: 201
    input: [borrower_institution, loan_start_date, loan_end_date, declared_value_cents, coverage_type, courier_required]
    output: LoanAgreement
    side_effects: ["status := PROPOSED", "object must be IN_COLLECTION (else ERR_OBJECT_NOT_IN_COLLECTION)", "overlap NOT checked at propose (only at accept)"]
  - method: GET
    path: "/campus/loan-agreements"
    description: "List loan agreements with filters"
    roles: [PlatformAdmin, Registrar, LoansOfficer, CommitteeChair, BorrowerRep]
    code: 200
    input: ["object_id?", "limit?", "offset?"]
    output: LoanAgreement[]
    side_effects: []
  - method: POST
    path: "/campus/loan-agreements/{id}/counter"
    description: "Counter the current terms. BorrowerRep: PROPOSED->COUNTERED. LoansOfficer: COUNTERED->PROPOSED. OCC on expected_loan_version."
    roles: [LoansOfficer, BorrowerRep]
    code: 200
    input: [expected_loan_version, "loan_start_date?", "loan_end_date?", "declared_value_cents?", "coverage_type?", "courier_required?"]
    output: LoanAgreement
    side_effects: ["provided term fields replace current terms", "negotiated_round += 1", "increments LoanAgreement.version by 1"]
  - method: POST
    path: "/campus/loan-agreements/{id}/accept"
    description: "Accept current terms. BorrowerRep accepts from PROPOSED; LoansOfficer accepts from COUNTERED. Locks FINAL premium. OCC on expected_loan_version."
    roles: [LoansOfficer, BorrowerRep]
    code: 200
    input: [expected_loan_version]
    output: LoanAgreement
    side_effects: ["status -> AGREED", "premium_cents := loan_premium_cents FINAL", "loan_window_overlap enforced here", "loan_terms_validation enforced here", "increments LoanAgreement.version by 1"]
  - method: POST
    path: "/campus/loan-agreements/{id}/activate"
    description: "Ship the object: AGREED -> ACTIVE; requires an ACCEPTED OUTBOUND condition report and object IN_COLLECTION"
    roles: [LoansOfficer]
    code: 200
    input: []
    output: LoanAgreement
    side_effects: ["status -> ACTIVE", "object status -> OUT_ON_LOAN"]
  - method: POST
    path: "/campus/loan-agreements/{id}/close"
    description: "Register return and close the loan; requires an ACCEPTED RETURN condition report; object returns IN_COLLECTION or UNDER_CONSERVATION when damage noted"
    roles: [LoansOfficer]
    code: 200
    input: []
    output: LoanAgreement
    side_effects: ["status -> CLOSED", "object status -> IN_COLLECTION or UNDER_CONSERVATION per accepted RETURN report damage_noted"]

  # --- ConditionReport ---
  - method: POST
    path: "/campus/loan-agreements/{id}/condition-reports"
    description: "File a condition report for a loan; creating a same-kind report SUPERSEDES the loan's prior DISPUTED report of that kind"
    roles: [LoansOfficer, BorrowerRep]
    code: 201
    input: [report_kind, condition_summary, damage_noted]
    output: ConditionReport
    side_effects: ["status := SUBMITTED", "prior DISPUTED report of same loan+kind -> SUPERSEDED"]
  - method: GET
    path: "/campus/condition-reports"
    description: "List condition reports with filters"
    roles: [PlatformAdmin, Registrar, LoansOfficer, BorrowerRep]
    code: 200
    input: ["loan_id?", "limit?", "offset?"]
    output: ConditionReport[]
    side_effects: []
  - method: POST
    path: "/campus/condition-reports/{id}/decide"
    description: "Accept or dispute a SUBMITTED report"
    roles: [LoansOfficer]
    code: 200
    input: [outcome]
    output: ConditionReport
    side_effects: ["status -> ACCEPTED or DISPUTED per outcome"]

  # --- CollectionReview (acquisition & deaccession) ---
  - method: POST
    path: "/campus/collection-reviews"
    description: "Open a collections-committee review; review_kind determines required field pairing"
    roles: [Curator]
    code: 201
    input: [review_kind, "object_id?", "fund_id?", "proposed_object_title?", "estimated_cost_cents?", "disposal_method?", "cultural_property_review_completed?"]
    output: CollectionReview
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/campus/collection-reviews"
    description: "List collection reviews with filters"
    roles: [PlatformAdmin, Registrar, Curator, CommitteeChair, FinanceOfficer]
    code: 200
    input: ["object_id?", "fund_id?", "limit?", "offset?"]
    output: CollectionReview[]
    side_effects: []
  - method: POST
    path: "/campus/collection-reviews/{id}/submit"
    description: "Submit a DRAFT review to the committee (only by the creating curator's X-User-ID)"
    roles: [Curator]
    code: 200
    input: []
    output: CollectionReview
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id := X-User-ID", "increments CollectionReview.version by 1"]
  - method: POST
    path: "/campus/collection-reviews/{id}/decide"
    description: "Committee chair approves or rejects; segregation of duties vs submitter; OCC on expected_review_version"
    roles: [CommitteeChair]
    code: 200
    input: [outcome, expected_review_version]
    output: CollectionReview
    side_effects: ["status -> APPROVED or REJECTED", "decided_by_user_id := X-User-ID", "APPROVED deaccession: object -> PENDING_DEACCESSION", "increments CollectionReview.version by 1"]
  - method: POST
    path: "/campus/collection-reviews/{id}/execute"
    description: "Execute an APPROVED review: acquisition creates the object and posts the acquisition expenditure; deaccession disposes the object and cascades loan/report cancellation"
    roles: [Registrar]
    code: 200
    input: ["actual_cost_cents?"]
    output: CollectionReview
    side_effects:
      - "ACQUISITION: create CollectionObject (IN_COLLECTION, declared_value_cents := actual_cost_cents) and Expenditure(amount=actual_cost_cents, activity_type=ACQUISITION, review_id=this review) on fund_id; requires fund ACTIVE and committed_available_cents >= actual_cost_cents"
      - "DEACCESSION: object -> DEACCESSIONED or REPATRIATED (disposal_method == REPATRIATION); cascade: non-terminal LoanAgreements of the object -> CANCELLED; their non-terminal ConditionReports -> CANCELLED"

  # --- FundAccount ---
  - method: POST
    path: "/campus/funds"
    description: "Create a fund account"
    roles: [PlatformAdmin]
    code: 201
    input: [fund_code, fund_type, appropriation_cents]
    output: FundAccount
    side_effects: ["status := ACTIVE", "receipts_cents := 0"]
  - method: GET
    path: "/campus/funds/{id}"
    description: "Read a fund including computed receipts / settled_available / committed_available"
    roles: [PlatformAdmin, FinanceOfficer, CommitteeChair, Registrar, Curator, ExhibitionManager]
    code: 200
    input: []
    output: FundAccount
    side_effects: []
  - method: POST
    path: "/campus/funds/{id}/set-status"
    description: "Freeze or unfreeze a fund"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: FundAccount
    side_effects: ["status -> ACTIVE or FROZEN per payload"]

  # --- Expenditure ---
  - method: POST
    path: "/campus/funds/{id}/expenditures"
    description: "Post an expenditure directly in POSTED status; gated by fund status, activity permission, and COMMITTED availability"
    roles: [FinanceOfficer]
    code: 201
    input: [amount_cents, activity_type, memo]
    output: Expenditure
    side_effects: ["status := POSTED", "fund settled_available_cents and committed_available_cents decrease by amount_cents"]
  - method: GET
    path: "/campus/expenditures"
    description: "List expenditures with filters"
    roles: [PlatformAdmin, FinanceOfficer, CommitteeChair]
    code: 200
    input: ["fund_id?", "review_id?", "limit?", "offset?"]
    output: Expenditure[]
    side_effects: []
  - method: POST
    path: "/campus/expenditures/{id}/void"
    description: "Void a POSTED expenditure (compensating action)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["status -> VOIDED", "fund settled_available_cents and committed_available_cents rise by amount_cents"]

  # --- ResearchAccessRequest ---
  - method: POST
    path: "/campus/research-access-requests"
    description: "Scholar requests research access to an object over a closed date interval"
    roles: [Scholar]
    code: 201
    input: [object_id, scholar_name, research_topic, visit_start_date, visit_end_date]
    output: ResearchAccessRequest
    side_effects: ["status := REQUESTED"]
  - method: GET
    path: "/campus/research-access-requests"
    description: "List research access requests with filters"
    roles: [PlatformAdmin, Registrar, Scholar]
    code: 200
    input: ["object_id?", "limit?", "offset?"]
    output: ResearchAccessRequest[]
    side_effects: []
  - method: POST
    path: "/campus/research-access-requests/{id}/decide"
    description: "Registrar approves (with object-state and overlap checks) or denies"
    roles: [Registrar]
    code: 200
    input: [outcome]
    output: ResearchAccessRequest
    side_effects: ["status -> APPROVED or DENIED per outcome"]

  # --- Single-resource reads (also anchor each collection segment for FK reverse-reachability) ---
  - method: GET
    path: "/campus/timed-entry-passes/{id}"
    description: "Read a single timed entry pass"
    roles: [PlatformAdmin, VisitorServices, SecurityScreener, Member, Public]
    code: 200
    input: []
    output: TimedEntryPass
    side_effects: []
  - method: GET
    path: "/campus/education-programs/{id}"
    description: "Read a single education program"
    roles: [PlatformAdmin, ProgramCoordinator, Docent, Public]
    code: 200
    input: []
    output: EducationProgram
    side_effects: []
  - method: GET
    path: "/campus/docent-assignments/{id}"
    description: "Read a single docent assignment"
    roles: [PlatformAdmin, ProgramCoordinator, Docent]
    code: 200
    input: []
    output: DocentAssignment
    side_effects: []
  - method: GET
    path: "/campus/school-reservations/{id}"
    description: "Read a single school group reservation"
    roles: [PlatformAdmin, ProgramCoordinator, Public]
    code: 200
    input: []
    output: SchoolGroupReservation
    side_effects: []
  - method: GET
    path: "/campus/loan-agreements/{id}"
    description: "Read a single loan agreement"
    roles: [PlatformAdmin, Registrar, LoansOfficer, CommitteeChair, BorrowerRep]
    code: 200
    input: []
    output: LoanAgreement
    side_effects: []
  - method: GET
    path: "/campus/condition-reports/{id}"
    description: "Read a single condition report"
    roles: [PlatformAdmin, Registrar, LoansOfficer, BorrowerRep]
    code: 200
    input: []
    output: ConditionReport
    side_effects: []
  - method: GET
    path: "/campus/collection-reviews/{id}"
    description: "Read a single collection review"
    roles: [PlatformAdmin, Registrar, Curator, CommitteeChair, FinanceOfficer]
    code: 200
    input: []
    output: CollectionReview
    side_effects: []
  - method: GET
    path: "/campus/expenditures/{id}"
    description: "Read a single expenditure"
    roles: [PlatformAdmin, FinanceOfficer, CommitteeChair]
    code: 200
    input: []
    output: Expenditure
    side_effects: []
  - method: GET
    path: "/campus/research-access-requests/{id}"
    description: "Read a single research access request"
    roles: [PlatformAdmin, Registrar, Scholar]
    code: 200
    input: []
    output: ResearchAccessRequest
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list, or ownership rule violated (Member/Docent/organizer/submitter acting as someone else)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed date/enum, range violation (slot 0..29, end after start), or review_kind field-pairing violation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists (incl. second cancel, admit of non-RESERVED pass, decide on decided report/review, redeem/refund of non-PURCHASED ticket)" }
  - { id: ERR_TIMED_PASS_NOT_USED_HERE, http: 409, condition: "Pass reservation attempted at a museum with requires_timed_pass == false" }
  - { id: ERR_DUPLICATE_PASS, http: 409, condition: "Visitor already holds a RESERVED or ADMITTED pass for the same museum and visit_date" }
  - { id: ERR_SLOT_QUOTA_EXHAUSTED, http: 409, condition: "quarter_hour_pass_quota reached for the requested slot (slot_used == quota)" }
  - { id: ERR_DAILY_QUOTA_EXHAUSTED, http: 409, condition: "daily_pass_quota reached for the visit_date while slot still has room" }
  - { id: ERR_MUSEUM_CLOSED_ON_DATE, http: 409, condition: "visit_date / closure date is in the museum's closed_dates (reserve, purchase, reservation, admit)" }
  - { id: ERR_PASS_EXPIRED, http: 409, condition: "Admit attempted after the grace window (current slot > entry_quarter_hour + 2); pass flips to EXPIRED" }
  - { id: ERR_SCREENING_THROUGHPUT_FULL, http: 409, condition: "Admissions in the current slot already equal screening_rate_per_quarter_hour (== is full)" }
  - { id: ERR_SALE_NOT_OPEN, http: 409, condition: "Ticket purchase before member_presale_opens_at, or exhibition not ON_SALE" }
  - { id: ERR_PRESALE_MEMBER_ONLY, http: 409, condition: "Non-member purchase strictly before public_sale_opens_at (at exactly public_sale_opens_at purchase succeeds)" }
  - { id: ERR_MEMBER_LAPSED, http: 409, condition: "member_id references a LAPSED member on a presale or member-priced purchase" }
  - { id: ERR_TICKET_QUOTA_EXHAUSTED, http: 409, condition: "PURCHASED+REDEEMED count for (exhibition, visit_date) already equals daily_ticket_quota" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 409, condition: "Manual refund attempted after the ticket's visit_date" }
  - { id: ERR_VISIT_DATE_MISMATCH, http: 409, condition: "Redeem attempted on a date other than the ticket's visit_date" }
  - { id: ERR_GROUP_TOO_LARGE, http: 422, condition: "Reservation headcount > program.max_group_size" }
  - { id: ERR_PROGRAM_DAY_MISMATCH, http: 422, condition: "Reservation visit_date weekday != program.day_of_week (same for docent assignment service_date)" }
  - { id: ERR_PROGRAM_NOT_SCHEDULED, http: 409, condition: "Reservation or assignment attempted against a CANCELLED program" }
  - { id: ERR_DOCENT_NOT_CERTIFIED, http: 422, condition: "Docent certification below program requirement, docent inactive, or docent already assigned to another SCHEDULED program on the same service_date" }
  - { id: ERR_OBJECT_NOT_IN_COLLECTION, http: 409, condition: "Loan create/activate or research approve requires object status IN_COLLECTION" }
  - { id: ERR_LOAN_PERIOD_CONFLICT, http: 409, condition: "Accept would overlap a half-open window of another AGREED or ACTIVE loan for the same object (adjacency allowed)" }
  - { id: ERR_COURIER_REQUIRED, http: 409, condition: "Accept with courier_required == false while declared_value_cents >= 100000000" }
  - { id: ERR_INDEMNITY_MINIMUM_NOT_MET, http: 409, condition: "INDEMNITY coverage with declared_value_cents < 500000000" }
  - { id: ERR_INDEMNITY_REQUIRES_COURIER, http: 409, condition: "INDEMNITY coverage with courier_required == false" }
  - { id: ERR_STALE_LOAN_VERSION, http: 412, condition: "expected_loan_version != loan.version on counter/accept (OCC)" }
  - { id: ERR_CONDITION_REPORT_REQUIRED, http: 409, condition: "Activate without ACCEPTED OUTBOUND report, or close without ACCEPTED RETURN report" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Review decide attempted by the same X-User-ID recorded as submitted_by_user_id" }
  - { id: ERR_CULTURAL_PROPERTY_REVIEW_PENDING, http: 422, condition: "APPROVE of a DEACCESSION review for an is_cultural_property object while cultural_property_review_completed == false" }
  - { id: ERR_OBJECT_ON_ACTIVE_LOAN, http: 409, condition: "Deaccession decide/execute while an AGREED or ACTIVE loan exists for the object" }
  - { id: ERR_FUND_FROZEN, http: 409, condition: "Expenditure create or acquisition decide/execute against a FROZEN fund" }
  - { id: ERR_FUND_ACTIVITY_NOT_PERMITTED, http: 422, condition: "FEDERAL fund used for ACQUISITION or EXHIBITION activity (appropriation/trust separation)" }
  - { id: ERR_INSUFFICIENT_FUND_AVAILABLE, http: 409, condition: "Amount exceeds fund committed_available_cents (COMMITTED variant gates)" }
  - { id: ERR_STALE_REVIEW_VERSION, http: 412, condition: "expected_review_version != review.version on decide (OCC)" }
  - { id: ERR_GALLERY_SCHEDULE_CONFLICT, http: 409, condition: "Education program's buffer-expanded interval intersects another SCHEDULED program in the same museum/gallery/day" }
  - { id: ERR_RESEARCH_VISIT_CONFLICT, http: 409, condition: "Closed visit interval intersects another APPROVED visit for the object (shared boundary day counts)" }
  - { id: ERR_OBJECT_RESERVED_FOR_LOAN, http: 409, condition: "Visit interval intersects an AGREED or ACTIVE loan window for the object" }
  - { id: ERR_NOT_TRUST_FUND, http: 422, condition: "Exhibition revenue_fund_id references a FEDERAL fund; ticket revenue is trust money" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Campus platform operator; owns museums, funds, closures, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /campus/museums, POST /campus/museums/{id}/close-day"
      - "POST /campus/funds, POST /campus/funds/{id}/set-status"
    shared_operations: ["GET endpoints per endpoint roles lists"]
  - name: VisitorServices
    description: "Front-of-house staff; registers members, cancels passes, refunds tickets"
    identity: opaque
    exclusive_operations:
      - "POST /campus/tickets/{id}/refund"
    shared_operations: ["POST /campus/members", "POST /campus/museums/{id}/timed-entry-passes", "POST /campus/timed-entry-passes/{id}/cancel", "GET endpoints"]
  - name: SecurityScreener
    description: "Security checkpoint staff; admits passes and redeems tickets"
    identity: opaque
    exclusive_operations:
      - "POST /campus/timed-entry-passes/{id}/admit"
      - "POST /campus/tickets/{id}/redeem"
    shared_operations: ["GET /campus/museums/{id}", "GET /campus/timed-entry-passes"]
  - name: ExhibitionManager
    description: "Special exhibition staff; owns exhibition lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /campus/museums/{id}/exhibitions"
      - "POST /campus/exhibitions/{id}/open-sale, /close"
    shared_operations: ["GET endpoints"]
  - name: ProgramCoordinator
    description: "Education staff; owns programs, docents, assignments; can cancel any reservation"
    identity: opaque
    exclusive_operations:
      - "POST /campus/docents"
      - "POST /campus/museums/{id}/education-programs, POST /campus/education-programs/{id}/cancel"
      - "POST /campus/education-programs/{id}/docent-assignments"
    shared_operations: ["POST /campus/school-reservations/{id}/cancel", "GET endpoints"]
  - name: Docent
    description: "Volunteer docent; confirms own assignments only"
    identity: "entity_backed:Docent"
    exclusive_operations:
      - "POST /campus/docent-assignments/{id}/confirm (X-User-ID must equal assignment.docent_id)"
    shared_operations: ["GET /campus/docents/{id}", "GET /campus/docent-assignments", "GET /campus/education-programs"]
  - name: Public
    description: "Unaffiliated visitor / group organizer; reserves passes, buys full-price tickets, books school groups, cancels own reservations"
    identity: opaque
    exclusive_operations:
      - "POST /campus/school-reservations"
    shared_operations: ["POST /campus/members", "POST /campus/museums/{id}/timed-entry-passes", "POST /campus/exhibitions/{id}/tickets", "POST /campus/timed-entry-passes/{id}/cancel (own)", "POST /campus/school-reservations/{id}/cancel (own)", "GET endpoints"]
  - name: Member
    description: "Museum member; buys tickets with presale access and member pricing while ACTIVE"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations: ["POST /campus/exhibitions/{id}/tickets (member_id must equal X-User-ID)", "POST /campus/museums/{id}/timed-entry-passes", "POST /campus/timed-entry-passes/{id}/cancel (as holder)", "GET /campus/members/{id} (self)"]
  - name: LoansOfficer
    description: "Registrar's office loans staff; drives loan negotiation, activation, close, condition-report decisions"
    identity: opaque
    exclusive_operations:
      - "POST /campus/collection-objects/{id}/loan-agreements"
      - "POST /campus/loan-agreements/{id}/activate, /close"
      - "POST /campus/condition-reports/{id}/decide"
    shared_operations: ["POST /campus/loan-agreements/{id}/counter (from COUNTERED)", "POST /campus/loan-agreements/{id}/accept (from COUNTERED)", "POST /campus/loan-agreements/{id}/condition-reports", "GET endpoints"]
  - name: BorrowerRep
    description: "Borrowing institution representative; counters and accepts lender proposals, files condition reports"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /campus/loan-agreements/{id}/counter (from PROPOSED)", "POST /campus/loan-agreements/{id}/accept (from PROPOSED)", "POST /campus/loan-agreements/{id}/condition-reports", "GET /campus/loan-agreements", "GET /campus/condition-reports"]
  - name: Registrar
    description: "Collections registrar; accessions objects, releases conservation holds, executes approved reviews, decides research access"
    identity: opaque
    exclusive_operations:
      - "POST /campus/collection-objects, POST /campus/collection-objects/{id}/release-conservation"
      - "POST /campus/collection-reviews/{id}/execute"
      - "POST /campus/research-access-requests/{id}/decide"
    shared_operations: ["GET endpoints"]
  - name: Curator
    description: "Curatorial staff; opens and submits collection reviews"
    identity: opaque
    exclusive_operations:
      - "POST /campus/collection-reviews"
      - "POST /campus/collection-reviews/{id}/submit (must equal creator X-User-ID)"
    shared_operations: ["GET endpoints"]
  - name: CommitteeChair
    description: "Collections committee chair; decides submitted reviews (never own submissions — segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /campus/collection-reviews/{id}/decide"
    shared_operations: ["GET endpoints"]
  - name: FinanceOfficer
    description: "Finance staff; posts and voids expenditures"
    identity: opaque
    exclusive_operations:
      - "POST /campus/funds/{id}/expenditures"
      - "POST /campus/expenditures/{id}/void"
    shared_operations: ["GET /campus/funds/{id}", "GET /campus/expenditures", "GET /campus/collection-reviews"]
  - name: Scholar
    description: "External researcher; requests collection access"
    identity: opaque
    exclusive_operations:
      - "POST /campus/research-access-requests"
    shared_operations: ["GET /campus/research-access-requests", "GET /campus/collection-objects/{id}"]
