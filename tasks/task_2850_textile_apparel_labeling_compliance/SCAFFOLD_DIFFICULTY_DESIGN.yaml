              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-3001", quantity_units: 12000, declared_value_usd: 300000.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /labeling/import-shipments/${sh_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_IDENTITY" }
              as: CustomsOfficer
          assert:
            - "ImportShipment.${sh_id}.posture_at_review == \"OPEN\""
            - "ImportShipment.${sh_id}.penalty_ad_valorem_usd == 30000.00"
            - "ImportShipment.${sh_id}.penalty_statutory_usd == 15000.00"
            - "ImportShipment.${sh_id}.assessment_basis == \"AD_VALOREM\""
            - "ImportShipment.${sh_id}.penalty_assessed_usd == 30000.00"
            - "Brand.${brand_id}.outstanding_penalty_usd == 30000.00"
            - "Brand.${brand_id}.posture == \"SUSPENDED\""

  - rule_id: non_linear_state_machine
    instances:
      - name: style_substantiation_and_origin_dimensions_advance_independently
        grounds:
          - state_machines[entity=Style, dimension=substantiation_state]
          - state_machines[entity=Style, dimension=origin_state]
          - entities.Style.fields.substantiation_state
          - entities.Style.fields.origin_state
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Style carries two orthogonal state dimensions on one row, and each has a non-forward edge: substantiation_state runs FIBER_DECLARED -> FIBER_TEST_PENDING -> FIBER_MISSTATED -> FIBER_TEST_PENDING -> FIBER_SUBSTANTIATED (a branch plus a retest cycle) while origin_state runs ORIGIN_UNDETERMINED -> ORIGIN_DRAFTED -> ORIGIN_ISSUED and then falls all the way back to ORIGIN_UNDETERMINED when the supply graph changes; neither dimension may be perturbed by the other's transitions, so a single combined status field cannot represent the row.
        test_recipe:
          setup:
            - "Market US is registered."
            - "Brand Northline Apparel Co owns style S1 with the five-node supply graph, so the style starts at substantiation_state FIBER_DECLARED and origin_state ORIGIN_UNDETERMINED."
            - "A determination is drafted and issued under SUBSTANTIAL_TRANSFORMATION, moving origin_state to ORIGIN_ISSUED while substantiation_state is untouched."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id, s0_sub: $.data.substantiation_state, s0_org: $.data.origin_state }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "IN", value_added_usd: 3.00, weight_grams: 480.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n2_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "PK", value_added_usd: 2.50, weight_grams: 520.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FABRIC", country_code: "CN", value_added_usd: 6.00, weight_grams: 950.0, is_ornamentation: false, parent_input_id: "${n2_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n4_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "CUT_AND_SEW", country_code: "VN", value_added_usd: 9.00, weight_grams: 900.0, is_ornamentation: false, parent_input_id: "${n4_id}" }
              as: BrandAdmin
