scenario: |
  Microinverter Warranty Claims & Installer Certification (Enphase): installer training and
  certification with design tool access and system commissioning requirements, system
  registration linking serial numbers, site and homeowner for warranty coverage, monitoring
  platform detecting underperforming or failed units with automated diagnostics, warranty
  claim submission with remote diagnostic evidence and replacement unit dispatch, labor
  reimbursement policies that differ by installer certification level and system age, field
  failure trending by production lot with corrective action and proactive replacement
  campaigns, homeowner transfer of warranty at property sale, discontinued product support
  and replacement compatibility across generations

domain_name: microinverter-warranty
api_prefix: /warranty

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 11
  endpoint_count: 38
  error_code_count: 30
  role_count: 4

entities:
  - name: Installer
    parent: null
    common_fields: true
    fields:
      - { name: installer_code, type: string, source: input, description: "Business identifier of the installing company", constraints: "unique across Installer" }
      - { name: company_name, type: string, source: input, description: "Legal company name" }
      - { name: certification_level, type: enum, source: computed, description: "CERTIFIED | GOLD | PLATINUM", constraints: "CERTIFIED | GOLD | PLATINUM; initial CERTIFIED" }
      - { name: certification_status, type: enum, source: computed, description: "PENDING | ACTIVE | SUSPENDED | EXPIRED", constraints: "PENDING | ACTIVE | SUSPENDED | EXPIRED; initial PENDING" }
      - { name: certified_until, type: datetime, source: computed, description: "Instant the current certification lapses; EXPIRED once logical clock passes it" }
      - { name: design_tool_enabled, type: boolean, source: computed, description: "True iff certification_status == ACTIVE and certification_level IN {GOLD, PLATINUM}" }
      - { name: commissioning_enabled, type: boolean, source: computed, description: "True iff certification_status == ACTIVE and completed design projects >= 1" }
      - { name: active_system_count, type: integer, source: computed, description: "SystemRegistrations whose warranty_status IN {ACTIVE, TRANSFERRED}" }
      - { name: claim_approval_rate_pct, type: number, source: computed, description: "approved claims / decided claims * 100 over claims filed by this installer; 100.00 when no claim was decided" }
      - { name: labor_approved_cents_total, type: integer, source: computed, description: "Sum of net_amount_cents for LaborReimbursements in APPROVED or PAID status" }
      - { name: labor_reversed_cents_total, type: integer, source: computed, description: "Sum of net_amount_cents for LaborReimbursements reversed to REJECTED after being APPROVED" }
      - { name: labor_paid_cents_total, type: integer, source: computed, description: "Sum of net_amount_cents for LaborReimbursements in PAID status" }

  - name: DesignProject
    parent: null
    common_fields: true
    fields:
      - { name: installer_id, type: string, source: input, description: "FK -> Installer.id; installer that owns the design" }
      - { name: site_address, type: string, source: input, description: "Street address of the proposed array" }
      - { name: site_postal_code, type: string, source: input, description: "Postal code of the proposed array" }
      - { name: module_count, type: integer, source: input, description: "Number of PV modules in the design", constraints: ">= 1" }
      - { name: dc_capacity_watts, type: integer, source: input, description: "Total DC nameplate watts", constraints: ">= 1" }
      - { name: dc_ac_ratio, type: number, source: computed, description: "dc_capacity_watts / (module_count * CONST.micro_ac_watts), 4 dp" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | COMMISSIONED", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | COMMISSIONED; initial DRAFT" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded when the design is rejected; null otherwise" }

  - name: ProductionLot
    parent: null
    common_fields: false
    fields:
      - { name: lot_code, type: string, source: input, description: "Manufacturing lot code stamped on the unit label", constraints: "unique across ProductionLot" }
      - { name: manufacture_month, type: string, source: input, description: "YYYY-MM of manufacture" }
      - { name: defect_threshold_pct, type: number, source: input, description: "Defect-rate percentage at or above which the lot is escalated", constraints: "> 0; default 5.0" }
      - { name: embed_model_code, type: enum, source: input, description: "Model generation built in this lot: IQ7 | IQ8 | IQ7X_DISCONTINUED" }
      - { name: units_registered_count, type: integer, source: computed, description: "Units with production_lot_id == this lot, any commissioning_state" }
      - { name: failed_unit_count, type: integer, source: computed, description: "Units of this lot whose monitored_status == FAILED (cumulative variant) " }
      - { name: window_failed_unit_count, type: integer, source: computed, description: "Units of this lot that entered FAILED within the trailing 90 days of the lot watch window" }
      - { name: defect_rate_cumulative_pct, type: number, source: computed, description: "failed_unit_count / units_registered_count * 100, 2 dp" }
      - { name: defect_rate_window_pct, type: number, source: computed, description: "window_failed_unit_count / units_registered_count * 100, 2 dp" }
      - { name: lot_status, type: enum, source: computed, description: "NORMAL | WATCH | RECALL", constraints: "NORMAL | WATCH | RECALL; initial NORMAL" }
      - { name: corrective_action_required, type: boolean, source: computed, description: "True iff lot_status == RECALL" }
      - { name: replacement_model_code, type: enum, source: input, description: "Model generation this lot is replaced with: IQ7 | IQ8 | IQ8HC | NONE" }
      - { name: watch_started_at, type: datetime, source: system, description: "Instant the lot first entered WATCH or RECALL; null while NORMAL" }

  - name: SystemRegistration
    parent: null
    common_fields: true
    fields:
      - { name: installer_id, type: string, source: input, description: "FK -> Installer.id; installer that commissioned the system" }
      - { name: design_project_id, type: string, source: input, description: "FK -> DesignProject.id; approved design this system was built from" }
      - { name: site_address, type: string, source: input, description: "Street address covered by the warranty" }
      - { name: site_postal_code, type: string, source: input, description: "Postal code covered by the warranty" }
      - { name: homeowner_name, type: string, source: input, description: "Name of the current warranty holder" }
      - { name: homeowner_email, type: string, source: input, description: "Email of the current warranty holder" }
      - { name: units, type: array, source: input, description: "Commissioning payload: array of {serial_number, model_code, installed_at, production_lot_code}" }
      - { name: commissioned_at, type: datetime, source: input, description: "Commissioning instant supplied with the registration" }
      - { name: warranty_start_at, type: datetime, source: computed, description: "Equal to commissioned_at" }
      - { name: base_warranty_end_at, type: datetime, source: computed, description: "warranty_start_at + CONST.base_term_months, evaluation step 1" }
      - { name: extended_warranty_end_at, type: datetime, source: computed, description: "base_warranty_end_at + extension_months, evaluation step 4" }
      - { name: warranty_status, type: enum, source: computed, description: "ACTIVE | EXPIRED | TRANSFERRED", constraints: "ACTIVE | EXPIRED | TRANSFERRED; initial ACTIVE" }
      - { name: unit_count, type: integer, source: computed, description: "Units with system_id == this system and commissioning_state != DECOMMISSIONED" }
      - { name: replacement_ratio, type: number, source: computed, description: "replaced units / unit_count within base window, 4 dp; evaluation step 2" }
      - { name: coverage_window, type: object, source: computed, description: "{start_at, end_at} closed interval used for overlap checks" }
      - { name: owner_change_count, type: integer, source: computed, description: "Number of APPROVED WarrantyTransfers for this system" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: computed, description: "FK -> SystemRegistration.id; system this microinverter belongs to" }
      - { name: serial_number, type: string, source: input, description: "Factory serial of the microinverter", constraints: "unique across Unit" }
      - { name: model_code, type: enum, source: input, description: "IQ7 | IQ8 | IQ8HC | IQ7X_DISCONTINUED" }
      - { name: production_lot_id, type: string, source: computed, description: "FK -> ProductionLot.id; lot resolved from the commissioned production_lot_code" }
      - { name: installed_at, type: datetime, source: input, description: "Instant this physical unit was installed" }
      - { name: commissioning_state, type: enum, source: computed, description: "PENDING | COMMISSIONED | DECOMMISSIONED", constraints: "PENDING | COMMISSIONED | DECOMMISSIONED; initial PENDING" }
      - { name: monitored_status, type: enum, source: computed, description: "ONLINE | UNDERPERFORMING | FAILED | OFFLINE", constraints: "ONLINE | UNDERPERFORMING | FAILED | OFFLINE; initial ONLINE" }
      - { name: last_performance_ratio, type: number, source: computed, description: "Most recent observed performance ratio, 4 dp" }
      - { name: underperformance_streak_hours, type: integer, source: computed, description: "Consecutive hours of observed ratio below CONST.underperformance_ratio" }
      - { name: failed_at, type: datetime, source: system, description: "Instant the unit last entered FAILED; null when not FAILED" }
      - { name: replacement_count, type: integer, source: computed, description: "ReplacementOrders in INSTALLED status targeting this unit's position" }
      - { name: replacement_window_position, type: integer, source: computed, description: "Unscheduled replacement slots left on this unit's system, seeded at CONST.replacement_limit_per_system (5) and decremented by 1 for every replacement installed on the system" }
      - { name: rma_eligible, type: boolean, source: computed, description: "True iff monitored_status == FAILED and system warranty_status == ACTIVE and model is supportable" }
      - { name: campaign_eligible, type: boolean, source: computed, description: "True iff monitored_status IN {ONLINE, UNDERPERFORMING} and production_lot.lot_status == RECALL" }
      - { name: retired_generation, type: boolean, source: computed, description: "True iff model_code == IQ7X_DISCONTINUED" }
      - { name: direct_replacement_unsupported, type: boolean, source: computed, description: "True iff monitored_status IN {ONLINE, UNDERPERFORMING} and model_code == IQ7X_DISCONTINUED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; microinverter the claim is filed against" }
      - { name: installer_id, type: string, source: input, description: "FK -> Installer.id; installer filing the claim" }
      - { name: claim_kind, type: enum, source: input, description: "DEFECT | UNDERPERFORMANCE | NO_POWER | COMMUNICATION" }
      - { name: remote_diagnostic_ref, type: string, source: input, description: "Reference to the remote diagnostic evidence bundle" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DIAGNOSED | APPROVED | DENIED | DISPATCHED | CLOSED | REOPENED", constraints: "DRAFT | SUBMITTED | DIAGNOSED | APPROVED | DENIED | DISPATCHED | CLOSED | REOPENED; initial DRAFT" }
      - { name: installer_level_at_claim, type: enum, source: computed, description: "Installer.certification_level captured when the claim leaves DRAFT" }
      - { name: system_age_months_at_claim, type: integer, source: computed, description: "Whole months from system warranty_start_at to the claim's submission instant" }
      - { name: diagnostic_source, type: enum, source: computed, description: "REMOTE | REMOTE_VERIFIED; REMOTE_VERIFIED only after diagnose" }
      - { name: labor_eligible, type: boolean, source: computed, description: "True iff the claim is APPROVED, the system is inside the extended window, and the installer level factor > 0" }
      - { name: approved_labor_hours, type: number, source: computed, description: "Hours allowed by the level cap at decision time" }
      - { name: denial_reason, type: string, source: input, description: "Reason recorded when the claim is denied; null otherwise" }
      - { name: reopen_count, type: integer, source: computed, description: "Times the claim was reopened after CLOSED or DENIED" }

  - name: LaborReimbursement
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id; claim the labor is billed against" }
      - { name: installer_id, type: string, source: computed, description: "Copy of WarrantyClaim.installer_id at filing time" }
      - { name: claimed_hours, type: number, source: input, description: "Field hours the installer bills", constraints: "> 0" }
      - { name: allowed_hours, type: number, source: computed, description: "min(claimed_hours, level cap hours), 2 dp" }
      - { name: cap_applied, type: boolean, source: computed, description: "True iff claimed_hours > level cap hours" }
      - { name: hourly_rate_cents, type: integer, source: computed, description: "Level base rate adjusted by the level multiplier and age factor at filing" }
      - { name: age_factor, type: number, source: computed, description: "1.00 | 0.75 | 0.50 | 0.00 selected from the system age band" }
      - { name: level_factor, type: number, source: computed, description: "1.00 | 1.10 | 1.25 selected from the installer certification level" }
      - { name: labor_component_cents, type: integer, source: computed, description: "round_half_up(allowed_hours * base_rate * level_factor * age_factor)" }
      - { name: diagnostic_component_cents, type: integer, source: computed, description: "round_half_up(diagnostic_fee * age_factor)" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Sum of the two rounded components (per-component rounding, pinned)" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | PAID", constraints: "PENDING | APPROVED | REJECTED | PAID; initial PENDING" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded when the reimbursement is rejected" }

  - name: WarrantyTransfer
    parent: null
    common_fields: false
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> SystemRegistration.id; system whose warranty changes hands" }
      - { name: transfer_kind, type: enum, source: input, description: "SALE | INHERITANCE | FORECLOSURE" }
      - { name: new_owner_name, type: string, source: input, description: "Name of the incoming warranty holder" }
      - { name: new_owner_email, type: string, source: input, description: "Email of the incoming warranty holder" }
      - { name: effective_date, type: datetime, source: input, description: "Date the change of ownership takes effect" }
      - { name: preserved_months, type: integer, source: computed, description: "Whole months between effective_date and extended_warranty_end_at, floor at 0" }
      - { name: approval_source, type: enum, source: computed, description: "AUTO | HOMEOWNER_APPROVAL; AUTO when preserved_months <= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED", constraints: "SUBMITTED | APPROVED | REJECTED; initial SUBMITTED" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded when the transfer is rejected" }

  - name: ProactiveCampaign
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot whose failure trend drives the campaign" }
      - { name: origin, type: enum, source: computed, description: "LOT_TREND when created by the corrective-action cascade, MANUAL when created by an operator" }
      - { name: replacement_model_code, type: enum, source: input, description: "IQ7 | IQ8 | IQ8HC; model generation shipped as the proactive replacement" }
      - { name: max_units, type: integer, source: input, description: "Maximum number of target units this campaign will cover", constraints: ">= 1" }
      - { name: guaranteed_units, type: integer, source: input, description: "Number of target units reserved unconditionally before the ranking fills the rest", constraints: ">= 0; default 0; <= max_units" }
      - { name: status, type: enum, source: system, description: "DRAFT | DISPATCHING | COMPLETED | CANCELED", constraints: "DRAFT | DISPATCHING | COMPLETED | CANCELED; initial DRAFT" }
      - { name: target_unit_count, type: integer, source: computed, description: "Units eligible at activation time (monitored_status IN {ONLINE, UNDERPERFORMING} and lot == lot_id)" }
      - { name: dispatched_count, type: integer, source: computed, description: "ReplacementOrders synthesized by activation" }
      - { name: canceled_count, type: integer, source: computed, description: "ReplacementOrders of this campaign later moved to CANCELED" }
      - { name: window_start_at, type: datetime, source: system, description: "Instant the campaign entered DISPATCHING" }
      - { name: window_end_at, type: datetime, source: system, description: "Instant the campaign left DISPATCHING (COMPLETED or CANCELED); null while open" }

  - name: ReplacementOrder
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id; source claim for RMA replacements; null for proactive replacements" }
      - { name: campaign_id, type: string, source: input, description: "FK -> ProactiveCampaign.id; source campaign for proactive replacements; null for RMA replacements" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit whose position the replacement fills" }
      - { name: replacement_model_code, type: enum, source: input, description: "IQ7 | IQ8 | IQ8HC shipped as the replacement" }
      - { name: compatibility_class, type: enum, source: computed, description: "IDENTICAL | COMPATIBLE_UPGRADE | INCOMPATIBLE derived from the replaced model generation", constraints: "IDENTICAL | COMPATIBLE_UPGRADE | INCOMPATIBLE" }
      - { name: status, type: enum, source: system, description: "PENDING_DISPATCH | DISPATCHED | INSTALLED | CANCELED", constraints: "PENDING_DISPATCH | DISPATCHED | INSTALLED | CANCELED; initial PENDING_DISPATCH" }
      - { name: dispatched_at, type: datetime, source: system, description: "Instant the replacement shipped; null until DISPATCHED" }
      - { name: installed_at, type: datetime, source: system, description: "Instant the replacement was commissioned in the field; null until INSTALLED" }

state_machines:
  - entity: Installer
    field: certification_status
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    field_note: "certification_status runs as a CYCLIC machine: PENDING -> ACTIVE -> SUSPENDED -> ACTIVE"
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /warranty/installers/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Installer.certification_status == PENDING"
        side_effects:
          - "Installer.certification_status = ACTIVE"
          - "Installer.certified_until = clock now + CONST.cert_term_months"
          - "Installer.design_tool_enabled recomputed (true iff certification_level IN {GOLD, PLATINUM})"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /warranty/installers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Installer.certification_status == ACTIVE"
        side_effects:
          - "Installer.certification_status = SUSPENDED"
          - "Installer.design_tool_enabled = false"
          - "Installer.commissioning_enabled = false"
          - "Installer.claim_approval_rate_pct recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /warranty/installers/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Installer.certification_status == SUSPENDED"
          - "Installer has zero WarrantyClaims in SUBMITTED or DIAGNOSED status"
        side_effects:
          - "Installer.certification_status = ACTIVE"
          - "Installer.certified_until = clock now + CONST.cert_term_months"
          - "Installer.design_tool_enabled and commissioning_enabled recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy evaluation on read, when clock now > Installer.certified_until)"
        actor: system
        preconditions:
          - "Installer.certification_status == ACTIVE"
          - "clock now strictly after Installer.certified_until"
        side_effects:
          - "Installer.certification_status = EXPIRED"
          - "Installer.design_tool_enabled = false"
          - "Installer.commissioning_enabled = false"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /warranty/installer-levels (PlatformAdmin sets level, which re-issues certification)"
        actor: PlatformAdmin
        preconditions:
          - "Installer.certification_status == EXPIRED"
        side_effects:
          - "Installer.certification_status = ACTIVE"
          - "Installer.certified_until = clock now + CONST.cert_term_months"
          - "Installer.design_tool_enabled and commissioning_enabled recomputed"

  - entity: Unit
    field: monitored_status
    initial_state: ONLINE
    terminal_states: []
    field_note: "monitored_status is a CYCLIC two-phase machine: observe pushes ONLINE -> UNDERPERFORMING -> FAILED, and replace/restore pushes back to ONLINE"
    transitions:
      - from: ONLINE
        to: UNDERPERFORMING
        trigger: "POST /warranty/units/{id}/observations"
        actor: MonitoringService
        preconditions:
          - "Unit.commissioning_state == COMMISSIONED"
          - "observed performance_ratio < CONST.underperformance_ratio (0.95)"
        side_effects:
          - "Unit.last_performance_ratio = observed ratio"
          - "Unit.underperformance_streak_hours += 1"
          - "no WarrantyClaim is created; diagnostics stay advisory"

      - from: UNDERPERFORMING
        to: ONLINE
        trigger: "POST /warranty/units/{id}/observations"
        actor: MonitoringService
        preconditions:
          - "observed performance_ratio >= CONST.underperformance_ratio"
        side_effects:
          - "Unit.underperformance_streak_hours = 0"

      - from: UNDERPERFORMING
        to: FAILED
        trigger: "POST /warranty/units/{id}/diagnostics"
        actor: MonitoringService
        preconditions:
          - "Unit.monitored_status == UNDERPERFORMING"
          - "observed performance_ratio == 0 OR Unit.underperformance_streak_hours >= CONST.failure_streak_hours (24)"
        side_effects:
          - "Unit.monitored_status = FAILED"
          - "Unit.failed_at = clock now"
          - "Unit.rma_eligible recomputed (monitored_status == FAILED and system warranty ACTIVE and model supportable)"
          - "ProductionLot.window_failed_unit_count and failed_unit_count recomputed for Unit.production_lot_id"
          - "ProductionLot.lot_status recomputed by evaluate_lot_defect_rate"
          - "if unit_count >= 10, the recomputed lot_status crosses into RECALL, and no ProactiveCampaign exists for that lot with status IN {DRAFT, DISPATCHING}, a ProactiveCampaign is created in DRAFT with origin LOT_TREND, replacement_model_code = ProductionLot.replacement_model_code, guaranteed_units = 0, and max_units = the count of ONLINE or UNDERPERFORMING units of the lot (the lot-trend hop of the corrective-action cascade)"

      - from: ONLINE
        to: FAILED
        trigger: "POST /warranty/units/{id}/observations"
        actor: MonitoringService
        preconditions:
          - "observed performance_ratio == 0"
        side_effects:
          - "Unit.monitored_status = FAILED"
          - "Unit.failed_at = clock now"
          - "Unit.rma_eligible recomputed"
          - "ProductionLot.failed_unit_count, window_failed_unit_count, defect_rate_cumulative_pct and lot_status recomputed"
          - "if unit_count >= 10 and the recomputed lot_status crosses into RECALL, a ProactiveCampaign is created in DRAFT with origin LOT_TREND exactly as in the ONLINE_to_FAILED transition"

      - from: FAILED
        to: OFFLINE
        trigger: "POST /warranty/units/{id}/observations"
        actor: MonitoringService
        preconditions:
          - "Unit.monitored_status == FAILED"
          - "the observation carries telemetry_absent = true"
        side_effects:
          - "Unit.monitored_status = OFFLINE"
          - "Unit.failed_at preserved (last failure instant is never cleared by going OFFLINE)"

      - from: OFFLINE
        to: ONLINE
        trigger: "POST /warranty/units/{id}/observations"
        actor: MonitoringService
        preconditions:
          - "Unit.monitored_status == OFFLINE"
          - "observed performance_ratio >= CONST.underperformance_ratio"
        side_effects:
          - "Unit.monitored_status = ONLINE"
          - "Unit.underperformance_streak_hours = 0"

      - from: FAILED
        to: ONLINE
        trigger: "POST /warranty/replacement-orders/{id}/install"
        actor: Installer
        preconditions:
          - "Unit.monitored_status == FAILED"
          - "target ReplacementOrder.status == DISPATCHED"
        side_effects:
          - "Unit.monitored_status = ONLINE"
          - "Unit.last_performance_ratio = null"
          - "Unit.underperformance_streak_hours = 0"
          - "Unit.replacement_count += 1"
          - "ReplacementOrder.status = INSTALLED and installed_at = clock now"
          - "source WarrantyClaim (ReplacementOrder.claim_id) transitions DISPATCHED -> CLOSED"
          - "Installer.labor_approved_cents_total recomputed for the claim's installer"

  - entity: WarrantyClaim
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    field_note: "branching machine: DIAGNOSED forks to APPROVED / DENIED, APPROVED forks to DISPATCHED (RMA) or CLOSED (denied replacement), and CLOSED/DENIED can loop back via REOPENED"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /warranty/claims/{id}/submit"
        actor: Installer
        preconditions:
          - "WarrantyClaim.status == DRAFT"
          - "Unit.rma_eligible == true"
          - "Installer.certification_status == ACTIVE"
          - "WarrantyClaim.remote_diagnostic_ref is non-empty"
        side_effects:
          - "WarrantyClaim.installer_level_at_claim = Installer.certification_level"
          - "WarrantyClaim.system_age_months_at_claim = whole months from system warranty_start_at to clock now"
          - "Installer.claim_approval_rate_pct recomputed"

      - from: SUBMITTED
        to: DIAGNOSED
        trigger: "POST /warranty/claims/{id}/diagnose"
        actor: MonitoringService
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "Unit.underperformance_streak_hours > 0 OR Unit.monitored_status == FAILED"
        side_effects:
          - "WarrantyClaim.diagnostic_source = REMOTE_VERIFIED"
          - "WarrantyClaim.status = DIAGNOSED"

      - from: DIAGNOSED
        to: APPROVED
        trigger: "POST /warranty/claims/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyClaim.status == DIAGNOSED"
          - "Unit.monitored_status == FAILED"
          - "SystemRegistration.warranty_status IN {ACTIVE, TRANSFERRED}"
          - "SystemRegistration.replacement_ratio < CONST.max_replacement_ratio (0.50)"
        side_effects:
          - "WarrantyClaim.status = APPROVED"
          - "WarrantyClaim.labor_eligible = true iff system age months <= CONST.labor_extended_months (120) and Installer level factor > 0"
          - "Installer.claim_approval_rate_pct recomputed"
          - "Installer.labor_approved_cents_total recomputed if a LaborReimbursement exists"

      - from: DIAGNOSED
        to: DENIED
        trigger: "POST /warranty/claims/{id}/deny"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyClaim.status == DIAGNOSED"
        side_effects:
          - "WarrantyClaim.status = DENIED"
          - "WarrantyClaim.denial_reason = supplied reason"
          - "any LaborReimbursement in PENDING for this claim moves to REJECTED"
          - "Installer.claim_approval_rate_pct recomputed"

      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /warranty/claims/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyClaim.status == APPROVED"
          - "Unit.rma_eligible == true"
        side_effects:
          - "Resolve the replacement model via resolve_replacement_model"
          - "ReplacementOrder created with status DISPATCHED, dispatched_at = clock now, claim_id = this claim, unit_id = Unit.id, replacement_model_code = resolved model"
          - "WarrantyClaim.status = DISPATCHED"
          - "any LaborReimbursement for this claim in PENDING moves to APPROVED and Installer.labor_approved_cents_total recomputed"
          - "Unit.replacement_count increments when the ReplacementOrder is later installed"

      - from: APPROVED
        to: CLOSED
        trigger: "POST /warranty/claims/{id}/close-unreplaced"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyClaim.status == APPROVED"
          - "no ReplacementOrder with claim_id == this claim exists"
        side_effects:
          - "WarrantyClaim.status = CLOSED"

      - from: DISPATCHED
        to: CLOSED
        trigger: "system (ReplacementOrder reaches INSTALLED, bubbled from the Unit replace transition)"
        actor: system
        preconditions:
          - "the ReplacementOrder whose claim_id == this claim has status INSTALLED"
        side_effects:
          - "WarrantyClaim.status = CLOSED"
          - "any LaborReimbursement for this claim in APPROVED moves to PAID and paid_at stamped"
          - "Installer.labor_paid_cents_total recomputed"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /warranty/claims/{id}/reopen"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyClaim.status == CLOSED"
          - "Unit.monitored_status IN {FAILED, OFFLINE}"
        side_effects:
          - "WarrantyClaim.status = REOPENED"
          - "WarrantyClaim.reopen_count += 1"

      - from: DENIED
        to: REOPENED
        trigger: "POST /warranty/claims/{id}/reopen"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyClaim.status == DENIED"
        side_effects:
          - "WarrantyClaim.status = REOPENED"
          - "WarrantyClaim.reopen_count += 1"
          - "WarrantyClaim.denial_reason = null"

      - from: REOPENED
        to: DIAGNOSED
        trigger: "POST /warranty/claims/{id}/diagnose"
        actor: MonitoringService
        preconditions:
          - "WarrantyClaim.status == REOPENED"
        side_effects:
          - "WarrantyClaim.diagnostic_source = REMOTE_VERIFIED"

  - entity: LaborReimbursement
    field: status
    initial_state: PENDING
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "system (bubbled from WarrantyClaim.DISPATCHED companion transition)"
        actor: system
        preconditions:
          - "the claim's status became DISPATCHED and this reimbursement is PENDING"
        side_effects:
          - "LaborReimbursement.status = APPROVED"
          - "Installer.labor_approved_cents_total recomputed"

      - from: PENDING
        to: REJECTED
        trigger: "system (bubbled from WarrantyClaim.DENIED transition)"
        actor: system
        preconditions:
          - "the claim's status became DENIED and this reimbursement is PENDING"
        side_effects:
          - "LaborReimbursement.status = REJECTED"
          - "LaborReimbursement.rejection_reason = 'claim denied'"

      - from: APPROVED
        to: REJECTED
        trigger: "POST /warranty/labor-reimbursements/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "LaborReimbursement.status == APPROVED"
          - "the source claim status IN {DISPATCHED, CLOSED, REOPENED}"
        side_effects:
          - "LaborReimbursement.status = REJECTED"
          - "Installer.labor_approved_cents_total recomputed"
          - "Installer.labor_reversed_cents_total recomputed"

      - from: APPROVED
        to: PAID
        trigger: "system (bubbled when the ReplacementOrder installs and the claim closes)"
        actor: system
        preconditions:
          - "LaborReimbursement.status == APPROVED"
          - "the source claim status == CLOSED"
        side_effects:
          - "LaborReimbursement.status = PAID"
          - "LaborReimbursement.paid_at = clock now"
          - "Installer.labor_approved_cents_total recomputed"
          - "Installer.labor_paid_cents_total recomputed"

  - entity: WarrantyTransfer
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty/warranty-transfers/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyTransfer.status == SUBMITTED"
          - "the target system warranty_status IN {ACTIVE, EXPIRED}"
        side_effects:
          - "WarrantyTransfer.status = APPROVED"
          - "WarrantyTransfer.approval_source recomputed (AUTO when preserved_months <= 0, HOMEOWNER_APPROVAL otherwise)"
          - "SystemRegistration.warranty_status = TRANSFERRED"
          - "SystemRegistration.homeowner_name and homeowner_email = the transfer's new owner values"
          - "SystemRegistration.owner_change_count += 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty/warranty-transfers/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyTransfer.status == SUBMITTED"
        side_effects:
          - "WarrantyTransfer.status = REJECTED"
          - "WarrantyTransfer.rejection_reason = supplied reason"

      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /warranty/warranty-transfers/{id}/reopen"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyTransfer.status == APPROVED"
        side_effects:
          - "WarrantyTransfer.status = SUBMITTED"
          - "SystemRegistration.homeowner_name and homeowner_email revert to the pre-transfer holder recorded on the transfer"
          - "SystemRegistration.owner_change_count -= 1"

  - entity: ProactiveCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: DRAFT
        to: DISPATCHING
        trigger: "POST /warranty/proactive-campaigns/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "ProactiveCampaign.status == DRAFT"
          - "the source ProductionLot.lot_status == RECALL"
          - "ProactiveCampaign.target_unit_count >= 1"
        side_effects:
          - "ProactiveCampaign.window_start_at = clock now"
          - "one ReplacementOrder with status PENDING_DISPATCH is synthesized for every target unit"
          - "ProactiveCampaign.dispatched_count = number of synthesized orders"
          - "ProactiveCampaign.status = DISPATCHING"

      - from: DISPATCHING
        to: COMPLETED
        trigger: "POST /warranty/proactive-campaigns/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "ProactiveCampaign.status == DISPATCHING"
        side_effects:
          - "ProactiveCampaign.window_end_at = clock now"
          - "ProactiveCampaign.status = COMPLETED"
          - "all ReplacementOrders of this campaign in DISPATCHED move to INSTALLED and the affected Units return to ONLINE"

      - from: DISPATCHING
        to: CANCELED
        trigger: "POST /warranty/proactive-campaigns/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "ProactiveCampaign.status == DISPATCHING"
        side_effects:
          - "ProactiveCampaign.window_end_at = clock now"
          - "ProactiveCampaign.status = CANCELED"
          - "ReplacementOrders of this campaign in PENDING_DISPATCH or DISPATCHED move to CANCELED"
          - "ProactiveCampaign.canceled_count = number of orders canceled by this transition"

  - entity: ReplacementOrder
    field: status
    initial_state: PENDING_DISPATCH
    terminal_states: [INSTALLED, CANCELED]
    transitions:
      - from: PENDING_DISPATCH
        to: DISPATCHED
        trigger: "POST /warranty/replacement-orders/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "ReplacementOrder.status == PENDING_DISPATCH"
        side_effects:
          - "ReplacementOrder.status = DISPATCHED"
          - "ReplacementOrder.dispatched_at = clock now"

      - from: DISPATCHED
        to: INSTALLED
        trigger: "POST /warranty/replacement-orders/{id}/install"
        actor: Installer
        preconditions:
          - "ReplacementOrder.status == DISPATCHED"
          - "the replacement unit serial is not already present on the target system"
          - "Installer.commissioning_enabled == true for the acting installer"
        side_effects:
          - "ReplacementOrder.status = INSTALLED and installed_at = clock now"
          - "target Unit.monitored_status = ONLINE, replacement_count += 1, failed_at preserved for audit"
          - "Unit.retired_generation and Unit.direct_replacement_unsupported recomputed"
          - "if ReplacementOrder.claim_id is set, WarrantyClaim DISPATCHED -> CLOSED and its LaborReimbursement APPROVED -> PAID"
          - "SystemRegistration.replacement_ratio recomputed for the target system"

      - from: PENDING_DISPATCH
        to: CANCELED
        trigger: "POST /warranty/replacement-orders/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "ReplacementOrder.status == PENDING_DISPATCH"
        side_effects:
          - "ReplacementOrder.status = CANCELED"
          - "if ReplacementOrder.campaign_id is set, ProactiveCampaign.canceled_count recomputed"

      - from: DISPATCHED
        to: CANCELED
        trigger: "system (bubbled from ProactiveCampaign.DISPATCHING_to_CANCELED)"
        actor: system
        preconditions:
          - "the source campaign entered CANCELED and this order is DISPATCHED"
        side_effects:
          - "ReplacementOrder.status = CANCELED"
          - "ProactiveCampaign.canceled_count recomputed"

      - from: CANCELED
        to: PENDING_DISPATCH
        trigger: "POST /warranty/replacement-orders/{id}/reactivate"
        actor: PlatformAdmin
        preconditions:
          - "ReplacementOrder.status == CANCELED"
          - "the source claim status IN {APPROVED, DISPATCHED, REOPENED} OR the source campaign status IN {DRAFT, DISPATCHING, CANCELED}"
        side_effects:
          - "ReplacementOrder.status = PENDING_DISPATCH"
          - "ReplacementOrder.dispatched_at = null"
          - "ReplacementOrder.installed_at = null"
          - "if a campaign is attached, ProactiveCampaign.canceled_count recomputed"

concurrency_rules:
  - rule_id: claim-submission-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /warranty/claims"
    occ_field: "expected_unit_version"
    description: |
      Filing a WarrantyClaim against a Unit whose version has advanced since the
      client last observed it is rejected, because the monitoring pipeline or a
      replacement install may have already changed the unit's monitored_status.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: replacement-dispatch-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /warranty/replacement-orders"
    occ_field: "expected_unit_version"
    description: |
      Creating a manual ReplacementOrder against a Unit whose version has advanced
      since the client last observed it is rejected, because the unit may already
      carry a replacement dispatched from another path.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
calculations:
  - name: evaluate_lot_defect_rate
    trigger: "recomputed whenever a Unit of the lot enters or leaves FAILED, and on every ProductionLot read"
    algorithm: threshold
    formula: |
      # Cumulative variant (authoritative for lot_status):
      units_registered_count = count(Unit where production_lot_id == lot.id)
      failed_unit_count = count(Unit where production_lot_id == lot.id
                                and monitored_status == FAILED)
      defect_rate_cumulative_pct = round_half_up(failed_unit_count * 100.0
                                                 / units_registered_count, 2)
      if units_registered_count == 0:
          lot_status = NORMAL
      elif defect_rate_cumulative_pct >= defect_threshold_pct:
          lot_status = RECALL
      elif defect_rate_window_pct >= defect_threshold_pct / 2:
          lot_status = WATCH
      else:
          lot_status = NORMAL
    input_set: "All Unit rows sharing production_lot_id; DECOMMISSIONED units are INCLUDED in both numerator and denominator (a failed unit later removed still counts as a lot failure)"
    constants:
      DEFAULT_DEFECT_THRESHOLD_PCT: 5.0
      WATCH_BAND_DIVISOR: 2
    precision: "percentage to 2 decimal places, round_half_up; the comparison uses the ROUNDED percentage"
    variants:
      - name: cumulative
        when: "every evaluation; the RECALL/WATCH decision above uses this variant"
        difference: "counts every unit of the lot that has ever entered FAILED, regardless of when it failed"
      - name: trailing_window
        when: "reported as Lot.window_failed_unit_count and Lot.defect_rate_window_pct for operator review only; never used for the RECALL decision"
        difference: "counts only units that entered FAILED at an instant inside the trailing 90 days ending at clock now (inclusive on both ends); a lot whose failures all predate that window reports a window rate of 0.00 while its cumulative rate is unchanged"

  - name: compute_warranty_coverage
    trigger: "recomputed lazily on every read of SystemRegistration, WarrantyClaim, or any unit-warranty endpoint"
    algorithm: chronological
    formula: |
      # Fixed evaluation order (steps 1..6); do not reorder.
      # step 1
      base_warranty_end_at = warranty_start_at + CONST.base_term_months months
      # step 2  (replacement_ratio counts only replacements installed inside the base window)
      replacement_ratio = round_half_up(
          count(ReplacementOrder where unit.system_id == system.id
                and status == INSTALLED
                and installed_at <= base_warranty_end_at) / unit_count, 4)
      # step 3
      extension_months = 0
      if replacement_ratio >= CONST.max_replacement_ratio:        # 0.50, inclusive
          extension_months = 0
      elif replacement_ratio >= CONST.replacement_ext_threshold:  # 0.30, inclusive
          extension_months = CONST.partial_extension_months        # 60
      else:
          extension_months = CONST.full_extension_months           # 120
      # step 4
      extended_warranty_end_at = base_warranty_end_at + extension_months months
      # step 5
      coverage_window = { start_at: warranty_start_at, end_at: extended_warranty_end_at }   # CLOSED interval
      # step 6
      if an installed replacement's serial_number appears twice on the system:
          raise ERR_REPLACEMENT_SERIAL_CONFLICT     # rejected at install time, never a status
    input_set: "Units with system_id == system.id and commissioning_state != DECOMMISSIONED; ReplacementOrders in INSTALLED status only"
    constants:
      BASE_TERM_MONTHS: 300
      MAX_REPLACEMENT_RATIO: 0.50
      REPLACEMENT_EXT_THRESHOLD: 0.30
      FULL_EXTENSION_MONTHS: 120
      PARTIAL_EXTENSION_MONTHS: 60
      REPLACEMENT_LIMIT_PER_SYSTEM: 5
      MAX_DC_AC_RATIO: 1.50
    precision: "replacement_ratio to 4 decimal places, round_half_up; month arithmetic is calendar-month exact"
    variants:
      - name: narrow_ratio
        when: "authoritative; drives extension_months"
        difference: "divides the installed-in-base-window numerator by unit_count only, measuring how much of this array has been rebuilt"
      - name: fleet_wide_ratio
        when: "reported on GET /warranty/installers/{id}/portfolio for review only; never used for extension_months"
        difference: "divides the same numerator by Installer.active_system_count instead, so a contractor with one replacement across five systems reports 0.2000 where the authoritative variant reports 1.0000 on the affected system"

  - name: compute_labor_reimbursement
    trigger: "on POST /warranty/labor-reimbursements (rate/level/age snapshot) and on GET /warranty/labor-reimbursements/{id}/quote (read-only recompute)"
    algorithm: tiered_pricing
    formula: |
      # All rates are integer cents; only the two component products are rounded.
      base_rate_cents = CONST.level_base_rate_cents[level]   # PLATINUM 9500 | GOLD 8500 | CERTIFIED 7500
      level_factor    = CONST.level_factor[level]            # PLATINUM 1.25 | GOLD 1.10 | CERTIFIED 1.00
      age_months      = whole months from system.warranty_start_at to the filing instant
      if age_months <= CONST.age_band_1_months:          # <= 60
          age_factor = 1.000
      elif age_months <= CONST.age_band_2_months:        # 61..120
          age_factor = 0.750
      elif age_months <= CONST.age_band_3_months:        # 121..144
          age_factor = 0.375
      else:                                              # > 144
          age_factor = 0.000
      cap_hours     = CONST.level_cap_hours[level]       # PLATINUM 6.0 | GOLD 4.0 | CERTIFIED 2.0
      allowed_hours = min(claimed_hours, cap_hours)
      cap_applied   = claimed_hours > cap_hours
      diagnostic_fee_cents = CONST.diagnostic_fee_cents_by_level[level]  # PLATINUM 12500 | GOLD 8500 | CERTIFIED 6500

      labor_component_cents      = round_half_up(allowed_hours * base_rate_cents * level_factor * age_factor)
      diagnostic_component_cents = round_half_up(diagnostic_fee_cents * age_factor)
      net_amount_cents           = labor_component_cents + diagnostic_component_cents
    input_set: "exactly the LaborReimbursement under evaluation; the claim must be APPROVED for net_amount_cents to become payable"
    constants:
      level_base_rate_cents: { PLATINUM: 9500, GOLD: 8500, CERTIFIED: 7500 }
      level_factor: { PLATINUM: 1.25, GOLD: 1.10, CERTIFIED: 1.00 }
      level_cap_hours: { PLATINUM: 6.0, GOLD: 4.0, CERTIFIED: 2.0 }
      diagnostic_fee_cents_by_level: { PLATINUM: 12500, GOLD: 8500, CERTIFIED: 6500 }
      age_band_1_months: 60
      age_band_2_months: 120
      age_band_3_months: 144
    precision: "each component rounded to integer cents with round_half_up BEFORE summing; the sum of the two rounded components is the final net_amount_cents"
    variants:
      - name: per_component_rounding
        when: "authoritative; persisted as LaborReimbursement.net_amount_cents on every write"
        difference: "rounds labor_component_cents and diagnostic_component_cents independently then sums them — a GOLD installer claiming 2.0 h on a 130-month system yields round_half_up(2.0 * 8500 * 1.10 * 0.375) + round_half_up(8500 * 0.375) = 7013 + 3188 = 10201 cents"
      - name: sum_then_round
        when: "surfaced only as LaborReimbursement.blended_total_cents on GET /warranty/labor-reimbursements/{id}/quote; never persisted and never paid"
        difference: "rounds the unrounded total once — the same GOLD 2.0 h 130-month fixture gives round_half_up(7012.5 + 3187.5) = 10200 cents, so the two variants disagree by exactly 1 cent on that input and agree on every fixture whose components are already whole cents (GOLD 4.0 h at 90 months: 28050 + 6375 = 34425 both ways)"

  - name: resolve_replacement_model
    trigger: "on POST /warranty/claims/{id}/dispatch and on POST /warranty/proactive-campaigns/{id}/activate"
    algorithm: constraint_propagation
    formula: |
      candidate = lot.replacement_model_code
      if unit.model_code IN CONST.GEN1_MODELS:                 # IQ7, IQ7X_DISCONTINUED
          if candidate == IQ7 and unit.model_code == IQ7:
              compatibility_class = IDENTICAL
          else:
              if candidate == IQ7:
                  candidate = IQ8                          # forced GEN1 -> GEN2 promotion
              compatibility_class = COMPATIBLE_UPGRADE
      elif unit.model_code == IQ8:
          if candidate == IQ8:
              compatibility_class = IDENTICAL
          else:
              compatibility_class = COMPATIBLE_UPGRADE
      resolved_model = candidate
      if resolved_model is null:
          error ERR_NO_SUPPORTED_REPLACEMENT
    input_set: "the target Unit and the ProductionLot it belongs to (RMA dispatch uses Unit.production_lot_id; campaigns use the campaign's lot_id)"
    constants:
      GEN1_MODELS: [IQ7, IQ7X_DISCONTINUED]
      GEN2_MODELS: [IQ8, IQ8HC]
      GEN1_TO_GEN2_FORCED: true
    precision: "n/a (enum selection)"
    variants:
      - name: unit_informed
        when: "authoritative for RMA dispatch"
        difference: "reads the replaced unit's model_code, so an IQ7 unit under a lot whose replacement_model_code is IQ7 is promoted to IQ8 while an IQ8 unit under the same lot receives an IQ8 unchanged"
      - name: lot_only
        when: "used only on GET /warranty/proactive-campaigns/{id} to project a single model for the whole campaign"
        difference: "ignores each unit's model_code and ships lot.replacement_model_code to every target, so the preview shows IQ7 for IQ7 targets where RMA dispatch would have promoted them to IQ8"

  - name: evaluate_metering_posture
    trigger: "recomputed on every Unit observation, diagnostic, install, and on GET /warranty/systems/{id}/monitoring-summary"
    algorithm: tiered_pricing
    formula: |
      system_age_months = whole months from system.warranty_start_at to the observation instant
      age_factor        = the compute_labor_reimbursement age band selection (1.000 | 0.750 | 0.375 | 0.000)
      per_unit_rate_cents = round_half_up(CONST.metering_base_rate_cents * age_factor)
      active_units = count(Unit where system_id == system.id and commissioning_state == COMMISSIONED)
      if system.warranty_status != ACTIVE:
          metering_fee_cents = 0
      elif system_age_months <= CONST.metering_free_months:
          metering_fee_cents = 0
      else:
          metering_fee_cents = per_unit_rate_cents * active_units
    input_set: "Units in COMMISSIONED state on the system; a system whose warranty_status is EXPIRED or TRANSFERRED bills zero from the moment the status leaves ACTIVE"
    constants:
      metering_base_rate_cents: 250
      metering_free_months: 60
      entitlement_months: 3
    precision: "per_unit_rate_cents rounded to integer cents with round_half_up; the product is not re-rounded"
    variants:
      - name: per_active_unit
        when: "authoritative"
        difference: "multiplies the age-adjusted unit rate by the count of COMMISSIONED units"
      - name: flat_per_system
        when: "reported on GET /warranty/installers/{id}/portfolio for review only"
        difference: "ignores active_units and charges the age-adjusted unit rate exactly once per system, so the two variants agree only on single-unit systems"

  - name: rank_campaign_target_units
    trigger: "on POST /warranty/proactive-campaigns/{id}/activate, after target_unit_count is recomputed"
    algorithm: waterfall_allocation
    formula: |
      # 1. candidate pool (explicit enum filter)
      candidates = Unit where Unit.production_lot_id == campaign.lot_id
                   and Unit.monitored_status IN {ONLINE, UNDERPERFORMING}
      # 2. guaranteed reservation (first bucket)
      guaranteed = candidates ordered by installed_at ASC, created_at ASC
                            truncated to campaign.guaranteed_units
      # 3. ranked remainder (second bucket) — sort key then tie-breaks
      remainder = candidates minus guaranteed, ordered by
          UNIT_PRIORITY DESC          # UNDERPERFORMING=2, ONLINE=1
          THEN underperformance_streak_hours DESC
          THEN installed_at ASC
          THEN created_at ASC         # final tie-break, never id
      # 4. fill
      selected = guaranteed ++ remainder[0 : campaign.max_units - campaign.guaranteed_units]
      # 5. empty pool
      if len(candidates) == 0:
          raise ERR_NO_CAMPAIGN_TARGETS
    input_set: "Units of the campaign's lot that are ONLINE or UNDERPERFORMING; FAILED, OFFLINE, and DECOMMISSIONED units are excluded because FAILED units are already RMA-eligible"
    constants:
      UNIT_PRIORITY: { UNDERPERFORMING: 2, ONLINE: 1 }
    precision: "n/a (ordering + truncation)"
    variants:
      - name: guaranteed_first
        when: "authoritative"
        difference: "reserves the guaranteed_units oldest candidates unconditionally before the ranked remainder fills the rest, so a recently installed UNDERPERFORMING unit can be displaced by an older ONLINE unit when guaranteed_units > 0"
      - name: pure_rank
        when: "used only on GET /warranty/proactive-campaigns/{id} to preview what ranking alone would pick"
        difference: "drops the guaranteed bucket and ranks the whole pool, so the preview's first N units differ from the activated campaign's whenever guaranteed_units > 0 and a guaranteed candidate would not rank in the top N"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role is permitted for the endpoint per §1.5 roles and §1.7 exclusive/shared operations"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all except GET endpoints reachable by any authenticated role"

  - priority: 3
    category: existence
    check: "the request body is structurally valid: every required input field is present, types match, and numeric/enum values are in range"
    error_id: ERR_INVALID_REQUEST_BODY
    http_status: 400
    applies_to: ["all POST, PUT, and PATCH endpoints"]

  - priority: 4
    category: existence
    check: "the path resource exists; path components are validated left-to-right so the first missing ancestor wins"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} endpoints"

  - priority: 5
    category: existence
    check: "every body-referenced FK (installer_id, unit_id, claim_id, campaign_id, design_project_id, system_id, lot_id) resolves to an existing row"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /warranty/claims", "POST /warranty/replacement-orders", "POST /warranty/labor-reimbursements", "POST /warranty/warranty-transfers", "POST /warranty/proactive-campaigns", "POST /warranty/system-registrations", "POST /warranty/design-projects"]

  - priority: 6
    category: state
    check: "the target resource is in a state that admits the requested transition (checked against §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /warranty/claims/{id}/submit", "POST /warranty/claims/{id}/diagnose", "POST /warranty/claims/{id}/approve", "POST /warranty/claims/{id}/deny", "POST /warranty/claims/{id}/dispatch", "POST /warranty/claims/{id}/close-unreplaced", "POST /warranty/claims/{id}/reopen", "POST /warranty/warranty-transfers/{id}/approve", "POST /warranty/warranty-transfers/{id}/reject", "POST /warranty/warranty-transfers/{id}/reopen", "POST /warranty/proactive-campaigns/{id}/activate", "POST /warranty/proactive-campaigns/{id}/close", "POST /warranty/proactive-campaigns/{id}/cancel", "POST /warranty/replacement-orders/{id}/dispatch", "POST /warranty/replacement-orders/{id}/install", "POST /warranty/replacement-orders/{id}/cancel", "POST /warranty/replacement-orders/{id}/reactivate", "POST /warranty/labor-reimbursements/{id}/reject"]

  - priority: 7
    category: state
    check: "the acting installer owns the claim being submitted, i.e. WarrantyClaim.installer_id == X-User-ID"
    error_id: ERR_NOT_CLAIM_OWNER
    http_status: 403
    applies_to: ["POST /warranty/claims/{id}/submit"]

  - priority: 8
    category: business_safety
    check: "the acting installer's certification_status is ACTIVE"
    error_id: ERR_INSTALLER_NOT_CERTIFIED
    http_status: 403
    applies_to: ["POST /warranty/claims", "POST /warranty/claims/{id}/submit", "POST /warranty/design-projects", "POST /warranty/system-registrations", "POST /warranty/replacement-orders/{id}/install"]

  - priority: 9
    category: business_safety
    check: "the unit's monitored_status is FAILED (the unit actually failed)"
    error_id: ERR_UNIT_NOT_FAILED
    http_status: 409
    applies_to: ["POST /warranty/claims/{id}/approve"]

  - priority: 10
    category: business_safety
    check: "the operating installer holds commissioning_enabled = true (ACTIVE certification plus at least one design project)"
    error_id: ERR_COMMISSIONING_NOT_ENABLED
    http_status: 403
    applies_to: ["POST /warranty/system-registrations", "POST /warranty/replacement-orders/{id}/install"]

  - priority: 11
    category: business_referential
    check: "the design project referenced by a system registration is owned by the same installer and is in APPROVED status"
    error_id: ERR_DESIGN_NOT_APPROVED
    http_status: 409
    applies_to: ["POST /warranty/system-registrations"]

  - priority: 12
    category: business_referential
    check: "the design project referenced by a system registration is owned by the acting installer (DesignProject.installer_id == X-User-ID)"
    error_id: ERR_DESIGN_NOT_OWNED
    http_status: 403
    applies_to: ["POST /warranty/system-registrations"]

  - priority: 13
    category: business_constraint
    check: "every serial_number in the commissioning payload is globally unique across Unit"
    error_id: ERR_SERIAL_ALREADY_REGISTERED
    http_status: 409
    applies_to: ["POST /warranty/system-registrations"]

  - priority: 14
    category: business_constraint
    check: "every production_lot_code in the commissioning payload resolves to an existing ProductionLot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: ["POST /warranty/system-registrations"]

  - priority: 15
    category: business_constraint
    check: "every production_lot_code in the commissioning payload appears in the DesignProject owner allow-list for the acting installer"
    error_id: ERR_LOT_NOT_ASSIGNED
    http_status: 409
    applies_to: ["POST /warranty/system-registrations"]

  - priority: 16
    category: business_temporal
    check: "the proposed coverage_window does not overlap any other coverage_window on the same site_address in warranty_status IN {ACTIVE, TRANSFERRED}"
    error_id: ERR_WARRANTY_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /warranty/system-registrations"]

  - priority: 17
    category: business_constraint
    check: "the unit serial numbers a replacement would introduce are not already installed on the target system"
    error_id: ERR_REPLACEMENT_SERIAL_CONFLICT
    http_status: 409
    applies_to: ["POST /warranty/replacement-orders/{id}/install"]

  - priority: 18
    category: business_constraint
    check: "the resolved replacement model is compatible with the replaced model's generation"
    error_id: ERR_INCOMPATIBLE_REPLACEMENT
    http_status: 409
    applies_to: ["POST /warranty/claims/{id}/dispatch", "POST /warranty/replacement-orders"]

  - priority: 19
    category: business_safety
    check: "the unit's ProductionLot.lot_status is not RECALL"
    error_id: ERR_LOT_RECALL_ACTIVE
    http_status: 409
    applies_to: ["POST /warranty/claims"]

  - priority: 20
    category: business_constraint
    check: "the target system has at least one unscheduled replacement position left (Unit.replacement_window_position > 0); the check is strict, so a system sitting at exactly 1 position admits the request and the resulting install takes it to 0"
    error_id: ERR_REPLACEMENT_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /warranty/claims"]

  - priority: 21
    category: business_fiscal
    check: "the corrected billing month's variance against the current month is within +/- CONST.reconciliation_tolerance_bps (500 bps)"
    error_id: ERR_RECONCILIATION_TOLERANCE_EXCEEDED
    http_status: 422
    applies_to: ["POST /warranty/billing-corrections"]

  - priority: 22
    category: business_fiscal
    check: "the month being corrected is strictly before the current calendar month"
    error_id: ERR_CORRECTION_PERIOD_CLOSED
    http_status: 409
    applies_to: ["POST /warranty/billing-corrections"]

  - priority: 23
    category: business_fiscal
    check: "the variant actually shipped to the unit is compatible with the replaced generation; an INCOMPATIBLE class never reaches here because dispatch rejects it at priority 17"
    error_id: ERR_INCOMPATIBLE_REPLACEMENT
    http_status: 409
    applies_to: ["POST /warranty/labor-reimbursements"]

  - priority: 24
    category: business_fiscal
    check: "the claim has no other LaborReimbursement in PENDING status"
    error_id: ERR_LABOR_ALREADY_PENDING
    http_status: 409
    applies_to: ["POST /warranty/labor-reimbursements"]

  - priority: 25
    category: business_fiscal
    check: "the installer's portfolio claim_approval_rate_pct is strictly greater than CONST.claim_rate_floor_pct (0.00)"
    error_id: ERR_CLAIM_RATE_FLOOR
    http_status: 422
    applies_to: ["POST /warranty/labor-reimbursements"]

  - priority: 26
    category: business_temporal
    check: "the requested certification level is exactly one step above the installer's current level, and the installer has at least CONST.claims_for_level_up decided claims"
    error_id: ERR_LEVEL_UP_NOT_ELIGIBLE
    http_status: 409
    applies_to: ["POST /warranty/installer-levels"]

  - priority: 27
    category: business_constraint
    check: "a design project whose dc_ac_ratio exceeds CONST.max_dc_ac_ratio (1.50) is rejected rather than submitted"
    error_id: ERR_DC_AC_RATIO_EXCEEDED
    http_status: 422
    applies_to: ["POST /warranty/design-projects/{id}/approve"]

  - priority: 28
    category: business_temporal
    check: "the installer's certified_until instant is strictly after the logical clock (an installer whose certification lapsed must be re-issued before new work)"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 403
    applies_to: ["POST /warranty/system-registrations", "POST /warranty/claims"]

  - priority: 29
    category: business_safety
    check: "the acting installer's certification_level is GOLD or PLATINUM (design tool access is reserved to those levels)"
    error_id: ERR_DESIGN_TOOL_NOT_ENABLED
    http_status: 403
    applies_to: ["POST /warranty/design-projects"]

  - priority: 30
    category: business_constraint
    check: "the campaign's target unit pool is non-empty after the ONLINE/UNDERPERFORMING filter"
    error_id: ERR_NO_CAMPAIGN_TARGETS
    http_status: 409
    applies_to: ["POST /warranty/proactive-campaigns/{id}/activate"]

  - priority: 31
    category: business_constraint
    check: "the source ProductionLot.lot_status is RECALL"
    error_id: ERR_LOT_NOT_IN_RECALL
    http_status: 409
    applies_to: ["POST /warranty/proactive-campaigns/{id}/activate"]

  - priority: 32
    category: business_constraint
    check: "the created order is chargeable: exactly one of claim_id or campaign_id is non-null and both are distinct from any other non-CANCELED order for the same unit"
    error_id: ERR_ORDER_NOT_CHARGEABLE
    http_status: 409
    applies_to: ["POST /warranty/replacement-orders", "POST /warranty/claims/{id}/dispatch"]

  - priority: 33
    category: business_fiscal
    check: "the expected_unit_version supplied matches Unit.version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: ["POST /warranty/claims", "POST /warranty/replacement-orders"]

  - priority: 34
    category: business_temporal
    check: "the entitlement window [effective_from, effective_from + 3 months) does not overlap an existing entitlement window on the same unit; adjacency is permitted because intervals are half-open"
    error_id: ERR_ENTITLEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /warranty/billing-entitlements"]

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  - method: POST
    path: "/warranty/installers"
    description: "Register an installing contractor; certification starts PENDING at level CERTIFIED"
    roles: [PlatformAdmin]
    code: 201
    input: ["installer_code", "company_name", "contact_email?"]
    output: Installer
    side_effects: ["Installer.certification_status = PENDING", "Installer.certification_level = CERTIFIED"]

  - method: GET
    path: "/warranty/installers/{id}"
    description: "Read one installer with derived certification and labor totals"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: Installer
    side_effects: ["lazily evaluates certification expiry against the logical clock"]

  - method: POST
    path: "/warranty/installers/{id}/activate"
    description: "Move a PENDING installer to ACTIVE and issue a certification term"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Installer
    side_effects: ["PENDING -> ACTIVE", "certified_until = clock now + CONST.cert_term_months", "design_tool_enabled recomputed"]

  - method: POST
    path: "/warranty/installers/{id}/suspend"
    description: "Suspend an ACTIVE installer; design tool and commissioning access are withdrawn"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Installer
    side_effects: ["ACTIVE -> SUSPENDED", "design_tool_enabled = false", "commissioning_enabled = false"]

  - method: POST
    path: "/warranty/installers/{id}/reinstate"
    description: "Return a SUSPENDED installer to ACTIVE when no claim is mid-flight"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Installer
    side_effects: ["SUSPENDED -> ACTIVE", "certified_until reissued", "design_tool_enabled and commissioning_enabled recomputed"]

  - method: GET
    path: "/warranty/installers/{id}/portfolio"
    description: "Installer portfolio read: active systems, fleet-wide replacement ratio, claim rate, labor totals, flat metering projection"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: { installer_id: string, certification_level: string, certification_status: string, design_tool_enabled: boolean, commissioning_enabled: boolean, active_system_count: integer, fleet_wide_ratio: number, claim_approval_rate_pct: number, labor_approved_cents_total: integer, labor_reversed_cents_total: integer, labor_paid_cents_total: integer, flat_metering_fee_cents: integer }
    side_effects: ["recomputes installer aggregates"]

  - method: POST
    path: "/warranty/installer-levels"
    description: "Set an installer's certification level one step at a time; re-issues certification when the term had lapsed"
    roles: [PlatformAdmin]
    code: 200
    input: ["installer_id", "level"]
    output: Installer
    side_effects: ["Installer.certification_level = level", "EXPIRED -> ACTIVE when a level is re-issued", "certified_until = clock now + CONST.cert_term_months", "design_tool_enabled recomputed"]

  - method: POST
    path: "/warranty/design-projects"
    description: "Open a design project in the design tool; reserved to GOLD and PLATINUM installers"
    roles: [Installer]
    code: 201
    input: ["installer_id", "site_address", "site_postal_code", "module_count", "dc_capacity_watts"]
    output: DesignProject
    side_effects: ["DesignProject.status = DRAFT", "dc_ac_ratio computed"]

  - method: GET
    path: "/warranty/design-projects"
    description: "List design projects, filterable by installer or status"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: ["installer_id?", "status?", "limit?", "offset?"]
    output: DesignProject[]
    side_effects: []

  - method: GET
    path: "/warranty/design-projects/{id}"
    description: "Read one design project"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: DesignProject
    side_effects: []

  - method: POST
    path: "/warranty/design-projects/{id}/submit"
    description: "Submit a DRAFT design for internal approval"
    roles: [Installer]
    code: 200
    input: []
    output: DesignProject
    side_effects: ["DRAFT -> SUBMITTED"]

  - method: POST
    path: "/warranty/design-projects/{id}/approve"
    description: "Approve a submitted design after the DC/AC ratio check"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DesignProject
    side_effects: ["SUBMITTED -> APPROVED", "the project becomes eligible as a commissioning reference"]

  - method: POST
    path: "/warranty/design-projects/{id}/reject"
    description: "Reject a submitted design and record the reason"
    roles: [PlatformAdmin]
    code: 200
    input: ["rejection_reason"]
    output: DesignProject
    side_effects: ["SUBMITTED -> REJECTED"]

  - method: POST
    path: "/warranty/production-lots"
    description: "Create a manufacturing lot with its defect threshold and replacement model"
    roles: [PlatformAdmin]
    code: 201
    input: ["lot_code", "manufacture_month", "embed_model_code", "defect_threshold_pct?", "replacement_model_code"]
    output: ProductionLot
    side_effects: ["lot_status = NORMAL", "defect_rate_cumulative_pct = 0.00"]

  - method: GET
    path: "/warranty/production-lots/{id}"
    description: "Read one lot with its cumulative and trailing-window defect rates"
    roles: [PlatformAdmin, Installer, MonitoringService]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["recomputes evaluate_lot_defect_rate"]

  - method: GET
    path: "/warranty/production-lots/{id}/units"
    description: "List the units registered against a lot"
    roles: [PlatformAdmin, Installer, MonitoringService]
    code: 200
    input: []
    output: Unit[]
    side_effects: []

  - method: POST
    path: "/warranty/lot-actions"
    description: "Operator action on a lot: CLEAR_RECALL, FORCE_WATCH, or OPEN_CAMPAIGN_BY_HAND"
    roles: [PlatformAdmin]
    code: 200
    input: ["lot_id", "action", "reason?"]
    output: ProductionLot
    side_effects: ["CLEAR_RECALL sets lot_status = NORMAL and corrective_action_required = false", "FORCE_WATCH sets lot_status = WATCH", "OPEN_CAMPAIGN_BY_HAND marks the lot RECALL and is the manual entry point to the corrective-action cascade"]

  - method: POST
    path: "/warranty/system-registrations"
    description: "Commission a system: link serial numbers, site, and homeowner to warranty coverage"
    roles: [Installer]
    code: 201
    input: ["installer_id", "design_project_id", "site_address", "site_postal_code", "homeowner_name", "homeowner_email", "commissioned_at", "units"]
    output: SystemRegistration
    side_effects: ["coverage window computed by compute_warranty_coverage", "one Unit row created per payload entry with commissioning_state COMMISSIONED", "Unit.production_lot_id resolved from each entry's production_lot_code", "Unit.replacement_window_position seeded at CONST.replacement_limit_per_system", "Installer.active_system_count recomputed", "Unit.version incremented by 1 (OCC guard on each created Unit)"]

  - method: GET
    path: "/warranty/system-registrations"
    description: "List system registrations, filterable by installer, design project, postal code, or homeowner email"
    roles: [PlatformAdmin, Installer, Homeowner]
    code: 200
    input: ["installer_id?", "design_project_id?", "site_postal_code?", "homeowner_email?", "limit?", "offset?"]
    output: SystemRegistration[]
    side_effects: []

  - method: GET
    path: "/warranty/system-registrations/{id}"
    description: "Read one system registration"
    roles: [PlatformAdmin, Installer, Homeowner]
    code: 200
    input: []
    output: SystemRegistration
    side_effects: ["recomputes compute_warranty_coverage"]

  - method: GET
    path: "/warranty/system-registrations/{id}/units"
    description: "List the units commissioned on a system, returned in commissioning order (the payload order of the original registration)"
    roles: [PlatformAdmin, Installer, Homeowner, MonitoringService]
    code: 200
    input: []
    output: Unit[]
    side_effects: []

  - method: GET
    path: "/warranty/system-registrations/{id}/coverage"
    description: "Coverage read: base term, extension months, replacement ratio, and the closed coverage window"
    roles: [PlatformAdmin, Installer, Homeowner]
    code: 200
    input: []
    output: { system_id: string, warranty_status: string, base_warranty_end_at: datetime, extended_warranty_end_at: datetime, extension_months: integer, replacement_ratio: number, coverage_start_at: datetime, coverage_end_at: datetime }
    side_effects: ["recomputes compute_warranty_coverage"]

  - method: GET
    path: "/warranty/system-registrations/{id}/monitoring-summary"
    description: "Monitoring read: commissioning vintage, active unit count, failure count, unit rate, and monthly metering fee"
    roles: [PlatformAdmin, Installer, MonitoringService]
    code: 200
    input: []
    output: { system_id: string, warranty_status: string, system_age_months: integer, active_units: integer, failed_units: integer, per_unit_rate_cents: integer, metering_fee_cents: integer }
    side_effects: ["recomputes evaluate_metering_posture"]

  - method: GET
    path: "/warranty/units"
    description: "List units, filterable by system, lot, or monitored status"
    roles: [PlatformAdmin, Installer, MonitoringService, Homeowner]
    code: 200
    input: ["system_id?", "production_lot_id?", "monitored_status?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  - method: GET
    path: "/warranty/units/{id}"
    description: "Read one microinverter with its monitoring, eligibility, and concurrency fields"
    roles: [PlatformAdmin, Installer, MonitoringService, Homeowner]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/warranty/units/{id}/observations"
    description: "Ingest a monitoring observation; drives the unit's monitoring state machine"
    roles: [MonitoringService]
    code: 200
    input: ["performance_ratio", "observed_at", "telemetry_absent?"]
    output: Unit
    side_effects: ["monitored_status transitions per the Unit machine", "underperformance_streak_hours updated", "ProductionLot counters and lot_status recomputed on a failure", "Unit.version incremented by 1"]

  - method: POST
    path: "/warranty/units/{id}/diagnostics"
    description: "Run automated diagnostics on an underperforming or silent unit"
    roles: [MonitoringService]
    code: 200
    input: ["performance_ratio?", "telemetry_absent?", "observed_at"]
    output: Unit
    side_effects: ["UNDERPERFORMING -> FAILED when the ratio is zero or the streak reaches CONST.failure_streak_hours", "Unit.failed_at stamped", "Unit.rma_eligible recomputed", "ProductionLot failure counters recomputed", "Unit.version incremented by 1"]

  - method: POST
    path: "/warranty/claims"
    description: "File a warranty claim against a failed unit with remote diagnostic evidence"
    roles: [Installer]
    code: 201
    input: ["unit_id", "installer_id", "claim_kind", "remote_diagnostic_ref", "expected_unit_version"]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status = DRAFT", "Unit.version incremented by 1 (OCC guard on the parent Unit)"]

  - method: GET
    path: "/warranty/claims"
    description: "List claims, filterable by installer, unit, or status"
    roles: [PlatformAdmin, Installer, MonitoringService]
    code: 200
    input: ["installer_id?", "unit_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/warranty/claims/{id}"
    description: "Read one warranty claim"
    roles: [PlatformAdmin, Installer, MonitoringService]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty/claims/{id}/submit"
    description: "Submit a drafted claim for diagnostics; ownership is checked against the acting installer"
    roles: [Installer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["DRAFT -> SUBMITTED", "installer_level_at_claim and system_age_months_at_claim captured", "Installer.claim_approval_rate_pct recomputed"]

  - method: POST
    path: "/warranty/claims/{id}/diagnose"
    description: "Attach verified remote diagnostics to a submitted or reopened claim"
    roles: [MonitoringService]
    code: 200
    input: ["diagnostic_evidence_ref?"]
    output: WarrantyClaim
    side_effects: ["SUBMITTED or REOPENED -> DIAGNOSED", "diagnostic_source = REMOTE_VERIFIED"]

  - method: POST
    path: "/warranty/claims/{id}/approve"
    description: "Approve a diagnosed claim after the failure, coverage, and array-attrition gates"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["DIAGNOSED -> APPROVED", "labor_eligible and approved_labor_hours recomputed", "Installer.claim_approval_rate_pct recomputed"]

  - method: POST
    path: "/warranty/claims/{id}/deny"
    description: "Deny a diagnosed claim with a reason; pending labor for the claim is rejected"
    roles: [PlatformAdmin]
    code: 200
    input: ["denial_reason"]
    output: WarrantyClaim
    side_effects: ["DIAGNOSED -> DENIED", "LaborReimbursement PENDING -> REJECTED (bubble up)", "Installer.claim_approval_rate_pct recomputed"]

  - method: POST
    path: "/warranty/claims/{id}/dispatch"
    description: "Send a replacement unit: creates the ReplacementOrder with the resolved compatible model"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReplacementOrder
    side_effects: ["APPROVED -> DISPATCHED", "resolve_replacement_model applied", "ReplacementOrder created with status DISPATCHED and dispatched_at = clock now", "LaborReimbursement PENDING -> APPROVED (bubble up)", "Unit.version incremented by 1 (OCC guard on the parent Unit)"]

  - method: POST
    path: "/warranty/claims/{id}/close-unreplaced"
    description: "Close an approved claim with no replacement shipped"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["APPROVED -> CLOSED when no ReplacementOrder references the claim"]

  - method: POST
    path: "/warranty/claims/{id}/reopen"
    description: "Reopen a closed or denied claim after a repeat failure"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: WarrantyClaim
    side_effects: ["CLOSED or DENIED -> REOPENED", "reopen_count incremented", "denial_reason cleared when reopened from DENIED"]

  - method: POST
    path: "/warranty/labor-reimbursements"
    description: "Bill field labor against a claim; level, rate, and age factors are snapshotted"
    roles: [Installer]
    code: 201
    input: ["claim_id", "claimed_hours"]
    output: LaborReimbursement
    side_effects: ["LaborReimbursement.status = PENDING", "compute_labor_reimbursement snapshots allowed_hours, hourly_rate_cents, both components and net_amount_cents"]

  - method: GET
    path: "/warranty/labor-reimbursements"
    description: "List labor reimbursements, filterable by claim or installer"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: ["claim_id?", "installer_id?", "limit?", "offset?"]
    output: LaborReimbursement[]
    side_effects: []

  - method: GET
    path: "/warranty/labor-reimbursements/{id}"
    description: "Read one labor reimbursement"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: LaborReimbursement
    side_effects: []

  - method: GET
    path: "/warranty/labor-reimbursements/{id}/quote"
    description: "Read-only recompute showing both rounding variants side by side"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: { reimbursement_id: string, level_used: string, age_factor: number, allowed_hours: number, cap_applied: boolean, labor_component_cents: integer, diagnostic_component_cents: integer, net_amount_cents: integer, blended_total_cents: integer }
    side_effects: ["recomputes compute_labor_reimbursement in both variants"]

  - method: POST
    path: "/warranty/labor-reimbursements/{id}/reject"
    description: "Reverse an approved labor reimbursement after the fact; allowed while the source claim is DISPATCHED, CLOSED, or REOPENED"
    roles: [PlatformAdmin]
    code: 200
    input: ["rejection_reason"]
    output: LaborReimbursement
    side_effects: ["APPROVED -> REJECTED", "Installer.labor_approved_cents_total and labor_reversed_cents_total recomputed"]

  - method: POST
    path: "/warranty/warranty-transfers"
    description: "Record a change of homeowner at property sale; the incoming holder confirms the preserved term"
    roles: [Homeowner]
    code: 201
    input: ["system_id", "transfer_kind", "new_owner_name", "new_owner_email", "effective_date"]
    output: WarrantyTransfer
    side_effects: ["WarrantyTransfer.status = SUBMITTED", "preserved_months computed from the system's extended window"]

  - method: GET
    path: "/warranty/warranty-transfers"
    description: "List ownership transfers, filterable by system or status"
    roles: [PlatformAdmin, Installer, Homeowner]
    code: 200
    input: ["system_id?", "status?", "limit?", "offset?"]
    output: WarrantyTransfer[]
    side_effects: []

  - method: GET
    path: "/warranty/warranty-transfers/{id}"
    description: "Read one ownership transfer"
    roles: [PlatformAdmin, Installer, Homeowner]
    code: 200
    input: []
    output: WarrantyTransfer
    side_effects: []

  - method: POST
    path: "/warranty/warranty-transfers/{id}/approve"
    description: "Approve a transfer, move the system to TRANSFERRED, and confirm the preserved months"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WarrantyTransfer
    side_effects: ["SUBMITTED -> APPROVED", "SystemRegistration.warranty_status = TRANSFERRED", "homeowner_name and homeowner_email updated", "owner_change_count incremented", "approval_source recomputed"]

  - method: POST
    path: "/warranty/warranty-transfers/{id}/reopen"
    description: "Void an approved transfer and return the warranty to the previous holder"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: WarrantyTransfer
    side_effects: ["APPROVED -> SUBMITTED", "SystemRegistration homeowner fields revert", "owner_change_count decremented"]

  - method: POST
    path: "/warranty/proactive-campaigns"
    description: "Open a proactive replacement campaign against a lot with a target and guarantee budget"
    roles: [PlatformAdmin]
    code: 201
    input: ["lot_id", "replacement_model_code", "max_units", "guaranteed_units?"]
    output: ProactiveCampaign
    side_effects: ["ProactiveCampaign.status = DRAFT", "target_unit_count computed from the eligible pool"]

  - method: GET
    path: "/warranty/proactive-campaigns"
    description: "List campaigns, filterable by lot or status"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: ProactiveCampaign[]
    side_effects: []

  - method: GET
    path: "/warranty/proactive-campaigns/{id}"
    description: "Read one campaign"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: ProactiveCampaign
    side_effects: []

  - method: GET
    path: "/warranty/proactive-campaigns/{id}/preview"
    description: "Campaign preview showing what ranking alone would select and the single model a lot-only resolution would ship"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: { campaign_id: string, status: string, lot_only_model_code: string, pure_rank_unit_ids: array, guaranteed_first_unit_ids: array, target_unit_count: integer, max_units: integer, guaranteed_units: integer }
    side_effects: ["recomputes rank_campaign_target_units in both variants"]

  - method: POST
    path: "/warranty/proactive-campaigns/{id}/activate"
    description: "Activate a campaign: synthesize the replacement orders for the selected target units"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProactiveCampaign
    side_effects: ["DRAFT -> DISPATCHING", "ReplacementOrder PENDING_DISPATCH synthesized per selected target unit", "dispatched_count and window_start_at set", "Unit.version incremented by 1 per targeted unit"]

  - method: POST
    path: "/warranty/proactive-campaigns/{id}/close"
    description: "Close a dispatching campaign and stamp the installation window"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProactiveCampaign
    side_effects: ["DISPATCHING -> COMPLETED", "window_end_at set", "outstanding DISPATCHED orders of the campaign move to INSTALLED and their units return to ONLINE"]

  - method: POST
    path: "/warranty/proactive-campaigns/{id}/cancel"
    description: "Cancel a dispatching campaign and withdraw its outstanding orders"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: ProactiveCampaign
    side_effects: ["DISPATCHING -> CANCELED", "window_end_at set", "PENDING_DISPATCH and DISPATCHED orders of the campaign move to CANCELED", "canceled_count recomputed"]

  - method: POST
    path: "/warranty/replacement-orders"
    description: "Create a manual replacement order against a unit"
    roles: [PlatformAdmin]
    code: 201
    input: ["unit_id", "replacement_model_code", "expected_unit_version", "claim_id?"]
    output: ReplacementOrder
    side_effects: ["ReplacementOrder.status = PENDING_DISPATCH", "compatibility_class computed from the replaced model", "Unit.version incremented by 1 (OCC guard on the parent Unit)"]

  - method: GET
    path: "/warranty/replacement-orders"
    description: "List replacement orders in creation order (created_at ASC), filterable by unit, claim, or campaign"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: ["unit_id?", "claim_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: ReplacementOrder[]
    side_effects: []

  - method: GET
    path: "/warranty/replacement-orders/{id}"
    description: "Read one replacement order"
    roles: [PlatformAdmin, Installer]
    code: 200
    input: []
    output: ReplacementOrder
    side_effects: []

  - method: POST
    path: "/warranty/replacement-orders/{id}/dispatch"
    description: "Ship a pending replacement order"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReplacementOrder
    side_effects: ["PENDING_DISPATCH -> DISPATCHED", "dispatched_at set"]

  - method: POST
    path: "/warranty/replacement-orders/{id}/install"
    description: "Commission the replacement in the field; bubbles the source claim to CLOSED and pays its labor"
    roles: [Installer]
    code: 200
    input: ["replacement_serial_number", "installed_at"]
    output: ReplacementOrder
    side_effects: ["DISPATCHED -> INSTALLED", "target Unit returns to ONLINE, replacement_count increments, and failed_at is preserved", "source WarrantyClaim DISPATCHED -> CLOSED", "its LaborReimbursement APPROVED -> PAID", "SystemRegistration.replacement_ratio and Unit.replacement_window_position recomputed", "Installer.labor_paid_cents_total recomputed"]

  - method: POST
    path: "/warranty/replacement-orders/{id}/cancel"
    description: "Cancel a pending or dispatched replacement order"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: ReplacementOrder
    side_effects: ["PENDING_DISPATCH or DISPATCHED -> CANCELED", "ProactiveCampaign.canceled_count recomputed when a campaign is attached"]

  - method: POST
    path: "/warranty/replacement-orders/{id}/reactivate"
    description: "Return a canceled replacement order to PENDING_DISPATCH when the source claim is live or the source campaign is not COMPLETED"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: ReplacementOrder
    side_effects: ["CANCELED -> PENDING_DISPATCH", "dispatched_at and installed_at reset to null", "ProactiveCampaign.canceled_count recomputed when a campaign is attached"]

  - method: POST
    path: "/warranty/billing-corrections"
    description: "Correct the recomputed metering charge of a closed period for one system; the correction is watermarked against the recomputed current-month charge"
    roles: [PlatformAdmin]
    code: 200
    input: ["system_id", "period_month", "corrected_metering_fee_cents"]
    output: { period_month_id: string, system_id: string, period_month: string, original_metering_fee_cents: integer, corrected_metering_fee_cents: integer, current_month_charge_cents: integer, variance_bps: integer, watermarked_total_cents: integer }
    side_effects: ["variance_bps recomputed against the current month", "watermarked_total_cents pinned to the corrected period total"]

  - method: POST
    path: "/warranty/billing-entitlements"
    description: "Record that a unit has entered a billed-replacement entitlement period, reserving a replacement position. The entitlement window is half-open [effective_from, effective_from + CONST.entitlement_months), so a window ending exactly at the next window's start does not overlap it"
    roles: [PlatformAdmin]
    code: 201
    input: ["unit_id", "entitlement_kind", "effective_from"]
    output: { entitlement_id: string, unit_id: string, entitlement_kind: string, effective_from: datetime, status: string }
    side_effects: ["a ReplacementOrder is created for the unit with claim_id null and campaign_id null", "Unit.replacement_count incremented"]

  - method: GET
    path: "/warranty/billing-entitlements"
    description: "List billed-replacement entitlements, filterable by unit"
    roles: [PlatformAdmin]
    code: 200
    input: ["unit_id?", "limit?", "offset?"]
    output: null
    side_effects: []

  - method: POST
    path: "/warranty/share-links"
    description: "Mint a scoped homeowner share link for one system"
    roles: [Homeowner]
    code: 201
    input: ["system_id", "expires_at"]
    output: { share_link_id: string, system_id: string, expires_at: datetime, scope: string }
    side_effects: ["the share link is scoped to exactly one system_id"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every age, expiry, band, and window rule. Before the first call the clock reads the fixed default 2026-09-01T00:00:00Z and never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["every lazy expiry and band evaluation observes the new instant"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unparseable X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role is not listed for the endpoint, or attempts another role's exclusive operation" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path resource or a body-referenced foreign key does not exist" }
  - { id: ERR_INVALID_REQUEST_BODY, http: 400, condition: "A request body is structurally invalid: missing required field, wrong type, or out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state that admits the requested transition" }
  - { id: ERR_NOT_CLAIM_OWNER, http: 403, condition: "The acting installer is not WarrantyClaim.installer_id on the claim being submitted" }
  - { id: ERR_INSTALLER_NOT_CERTIFIED, http: 403, condition: "The acting installer's certification_status is not ACTIVE" }
  - { id: ERR_COMMISSIONING_NOT_ENABLED, http: 403, condition: "The acting installer holds commissioning_enabled = false (no approved design project yet)" }
  - { id: ERR_DESIGN_TOOL_NOT_ENABLED, http: 403, condition: "A CERTIFIED installer attempts to open a design project; design tool access is GOLD and PLATINUM only" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 403, condition: "The installer's certified_until instant is not strictly after the logical clock" }
  - { id: ERR_DESIGN_NOT_APPROVED, http: 409, condition: "The referenced design project is not in APPROVED status when a system is commissioned" }
  - { id: ERR_DESIGN_NOT_OWNED, http: 403, condition: "The referenced design project belongs to a different installer than the commissioning installer" }
  - { id: ERR_DC_AC_RATIO_EXCEEDED, http: 422, condition: "DesignProject.dc_ac_ratio exceeds CONST.max_dc_ac_ratio (1.50) at approval" }
  - { id: ERR_SERIAL_ALREADY_REGISTERED, http: 409, condition: "A serial number in the commissioning payload already exists on another Unit" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "A production_lot_code in the commissioning payload resolves to no ProductionLot" }
  - { id: ERR_LOT_NOT_ASSIGNED, http: 409, condition: "A production_lot_code in the payload is outside the design project's owner allow-list" }
  - { id: ERR_WARRANTY_WINDOW_OVERLAP, http: 409, condition: "The proposed coverage window overlaps a live coverage window on the same site_address" }
  - { id: ERR_REPLACEMENT_SERIAL_CONFLICT, http: 409, condition: "The replacement serial is already installed on the target system" }
  - { id: ERR_INCOMPATIBLE_REPLACEMENT, http: 409, condition: "The resolved replacement model cannot work with the replaced model's generation" }
  - { id: ERR_NO_SUPPORTED_REPLACEMENT, http: 409, condition: "No replacement model can be resolved for the unit's generation" }
  - { id: ERR_LOT_RECALL_ACTIVE, http: 409, condition: "A warranty claim is filed for a unit whose lot is already in RECALL; the campaign path must be used" }
  - { id: ERR_REPLACEMENT_LIMIT_REACHED, http: 409, condition: "The unit's system has no unscheduled replacement position left for this request (replacement_window_position <= 0)" }
  - { id: ERR_ORDER_NOT_CHARGEABLE, http: 409, condition: "The order has neither exactly one of claim_id / campaign_id set, or duplicates a live order for the same unit" }
  - { id: ERR_UNIT_NOT_FAILED, http: 409, condition: "A claim is approved for a unit whose monitored_status is not FAILED" }
  - { id: ERR_LABOR_ALREADY_PENDING, http: 409, condition: "The claim already has a LaborReimbursement in PENDING status" }
  - { id: ERR_CLAIM_RATE_FLOOR, http: 422, condition: "The installer's claim_approval_rate_pct is not strictly above CONST.claim_rate_floor_pct (0.00)" }
  - { id: ERR_RECONCILIATION_TOLERANCE_EXCEEDED, http: 422, condition: "A billing correction's variance against the current month exceeds CONST.reconciliation_tolerance_bps (500 bps)" }
  - { id: ERR_CORRECTION_PERIOD_CLOSED, http: 409, condition: "The month being corrected is not strictly before the current calendar month" }
  - { id: ERR_LEVEL_UP_NOT_ELIGIBLE, http: 409, condition: "The requested level is more than one step above the current level, or the installer lacks CONST.claims_for_level_up decided claims" }
  - { id: ERR_NO_CAMPAIGN_TARGETS, http: 409, condition: "A campaign's eligible pool is empty after the ONLINE/UNDERPERFORMING filter" }
  - { id: ERR_LOT_NOT_IN_RECALL, http: 409, condition: "A campaign is activated for a lot whose lot_status is not RECALL" }
  - { id: ERR_ENTITLEMENT_WINDOW_OVERLAP, http: 409, condition: "A billed-replacement entitlement window overlaps an existing entitlement window on the same unit under half-open interval semantics" }
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "The supplied expected_unit_version does not match Unit.version" }

