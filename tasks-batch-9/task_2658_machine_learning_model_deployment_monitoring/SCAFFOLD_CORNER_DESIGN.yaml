          rationale: "The named §1.8 instance flips operational_state between OPEN, DRAINING and CLOSED and asserts which of create/ramp each state permits."

      - name: serve_windows_may_not_overlap_within_endpoint_and_pattern
        claim_type: Temporal validation
        grounds:
          - validations.priority_61
        excluded_because:
          difficulty_instance: resource_temporal_overlap / serve_window_half_open_with_asymmetric_trailing_cooldown_buffer
          rationale: "The named §1.8 instance tests the half-open geometry on both sides of the trailing cooldown buffer, including the zero-buffer leading edge."

      - name: monitoring_windows_may_not_overlap_within_deployment_and_kind
        claim_type: Temporal validation
        grounds:
          - validations.priority_62
        excluded_because:
          difficulty_instance: resource_temporal_overlap / monitoring_window_fully_closed_zero_buffer_overlap_per_kind
          rationale: "The named §1.8 instance tests the fully-closed geometry including the shared-endpoint touch case and the per-window_kind scoping."

