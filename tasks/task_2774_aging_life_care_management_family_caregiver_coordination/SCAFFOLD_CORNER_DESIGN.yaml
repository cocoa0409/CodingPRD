          rationale: "Independent movement of auth_status and coi_status on one row, including the combined-state matrix, is asserted by the named §1.8 instance."

      - name: invoice_void_releases_entries_and_republishes_retainer
        claim_type: compensation
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
        excluded_because:
          difficulty_instance: "transitive_cascade / invoice_void_five_hop_release_cascade"
          rationale: "All five hops of the void cascade, including entry release and authorization reactivation, are asserted by the named §1.8 instance."

      - name: decision_rescind_terminates_dependent_authorizations
        claim_type: cascade_down
        grounds:
          - state_machines.ConferenceDecision.RATIFIED_to_RESCINDED
        excluded_because:
          difficulty_instance: "transitive_cascade / decision_rescind_four_hop_coverage_cascade"
          rationale: "The rescind cascade through authorizations, coverage hours and the plan's coverage_gap_flag is asserted by the named §1.8 instance."

  - section: calculations
    instances:
      - name: coverage_hours_floors_partial_hour_and_excludes_proposed_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.client_authorized_coverage_hours
          - entities.ServiceAuthorization.fields.coverage_hours
          - state_machines.ServiceAuthorization.PROPOSED_to_AUTHORIZED
        distinguishing_aspect: "coverage_hours floors a partial hour before multiplying by concurrent_caregivers (8.5h x 2 -> 16, not 17), a sub-hour window yields 0, and PROPOSED rows contribute nothing to Client.authorized_coverage_hours until they are AUTHORIZED."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, Client Ada (retainer_floor_cents 0, authorized_concurrent_caregivers 2), surrogate Bram, vendor Northgate, ACCEPTED assessment, ACTIVE care plan."
            - "Authorization P: 2026-09-07T08:00:00Z..16:30:00Z, concurrent_caregivers 2, hourly_cost_cents 4000, left in PROPOSED."
            - "Authorization Q: 2026-09-08T09:00:00Z..09:59:00Z, concurrent_caregivers 1, hourly_cost_cents 4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Ada Nyholm", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Bram Nyholm", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Weekday aide coverage"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc}"
              captures: { cp_v: $.data.version }
          trigger:
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v}", coverage_start: "2026-09-07T08:00:00Z", coverage_end: "2026-09-07T16:30:00Z", concurrent_caregivers: 2, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_p: $.data.id, p_hours: $.data.coverage_hours, p_base: $.data.base_cost_cents }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { hours_while_proposed: $.data.authorized_coverage_hours }
            - call: "PATCH /care/service-authorizations/${auth_p}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { hours_after_p: $.data.authorized_coverage_hours }
            - call: "GET /care/care-plans/${cp}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp_v2: $.data.version }
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v2}", coverage_start: "2026-09-08T09:00:00Z", coverage_end: "2026-09-08T09:59:00Z", concurrent_caregivers: 1, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth_q: $.data.id, q_hours: $.data.coverage_hours, q_base: $.data.base_cost_cents }
            - call: "PATCH /care/service-authorizations/${auth_q}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { q_status: $.data.auth_status }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { hours_after_q: $.data.authorized_coverage_hours }
          assert:
            - "Authorization P: data.coverage_hours == 16 (floor(30600s / 3600) == 8, times 2 caregivers) and data.base_cost_cents == 64000"
            - "Client.${cli}.authorized_coverage_hours == 0 while P is PROPOSED — the row is computed but not aggregated"
            - "After P is AUTHORIZED: Client.${cli}.authorized_coverage_hours == 16"
            - "Authorization Q: data.coverage_hours == 0 (floor(3540s / 3600) == 0, times 1) and data.base_cost_cents == 0"
            - "After Q is AUTHORIZED: data.auth_status == \"AUTHORIZED\" and Client.${cli}.authorized_coverage_hours == 16 — the sub-hour window adds nothing"
            - "Q on 2026-09-08 does not trip ERR_COVERAGE_CAPACITY_EXCEEDED: it does not overlap P's 2026-09-07 window, so the aggregate is 1, not 3"

      - name: retainer_waterfall_partial_draw_and_post_issue_deposit_is_not_retroactive
        claim_type: waterfall_allocation
        grounds:
          - calculations.invoice_totals
          - calculations.client_retainer_and_accrual_ledger
          - endpoints[POST /care/clients/{clientId}/retainer-deposits]
        distinguishing_aspect: "When retainer_balance_cents is smaller than total_due_cents the whole balance is drawn and the remainder becomes balance_due_cents, and a deposit received after the invoice is ISSUED raises the balance without re-deriving the issued invoice's retainer_applied_cents."
        test_recipe:
          setup:
            - "CareManager Dana (hourly_rate_cents 22500), supervisor Iris, billing admin, Client Cleo (billing_increment_min 15, retainer_floor_cents 0)."
            - "Two retainer deposits of 10000 and 5000 cents (append-only)."
            - "One APPROVED CARE_COORDINATION TimeEntry on 2026-08-10, 10:00:00Z..11:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Cleo Marchetti", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 10000, received_at: "2026-08-02T09:00:00Z" }
              as: BillingAdministrator
              captures: { dep1: $.data.retainer_balance_cents }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 5000, received_at: "2026-08-06T09:00:00Z" }
              as: BillingAdministrator
              captures: { dep2: $.data.retainer_balance_cents, dep_total: $.data.retainer_deposits_total_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id, te_amount: $.data.billable_amount_cents }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
          trigger:
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingAdministrator
              captures: { inv: $.data.id, draft_applied: $.data.retainer_applied_cents, draft_balance_due: $.data.balance_due_cents }
            - call: "GET /care/clients/${cli}"
              as: BillingAdministrator
              captures: { bal_while_draft: $.data.retainer_balance_cents }
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { issued_applied: $.data.retainer_applied_cents, issued_balance_due: $.data.balance_due_cents }
            - call: "GET /care/clients/${cli}"
              as: BillingAdministrator
              captures: { bal_after_issue: $.data.retainer_balance_cents, accrual_after_issue: $.data.unbilled_accrual_cents }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 20000, received_at: "2026-09-01T09:00:00Z" }
              as: BillingAdministrator
              captures: { bal_after_dep3: $.data.retainer_balance_cents, total_after_dep3: $.data.retainer_deposits_total_cents }
            - call: "GET /care/invoices/${inv}"
              as: BillingAdministrator
              captures: { final_applied: $.data.retainer_applied_cents, final_balance_due: $.data.balance_due_cents }
          assert:
            - "After the two deposits: Client.${cli}.retainer_deposits_total_cents == 15000 and retainer_balance_cents == 15000"
            - "TimeEntry.${te}.billable_amount_cents == 22500 (60 rounded minutes, rate_multiplier 1.0, after_hours_factor 1.00)"
            - "DRAFT invoice: line_subtotal_cents == 22500, admin_fee_cents == 1575, total_due_cents == 24075, retainer_applied_cents == 15000 (min(15000, 24075)), balance_due_cents == 9075"
            - "While the invoice is DRAFT, Client.${cli}.retainer_balance_cents is still 15000 — the PROVISIONAL retainer figure is a projection and moves no money"
            - "After ISSUED: data.retainer_applied_cents == 15000, data.balance_due_cents == 9075, Client.${cli}.retainer_balance_cents == 0 and unbilled_accrual_cents == 0 (the entry is INVOICED)"
            - "After the 20000 deposit: Client.${cli}.retainer_deposits_total_cents == 35000 and retainer_balance_cents == 20000 (15000 + 20000 - 15000 drawn)"
            - "GET on the issued invoice still returns retainer_applied_cents == 15000 and balance_due_cents == 9075 — the later deposit is not applied retroactively"

      - name: family_report_cadence_boundaries_current_due_overdue
        claim_type: chronological
        grounds:
          - calculations.family_report_cadence_status
          - entities.FamilyContact.fields.report_status
          - endpoints[POST /care/family-contacts/{contactId}/reports]
        distinguishing_aspect: "The cadence status flips on inclusive boundaries anchored to created_at when last_report_sent_at is null: now == due_at is already DUE, now == due_at + 7 days is already OVERDUE with days_overdue 0, and sending a report re-anchors the window."
        test_recipe:
          setup:
            - "Client Dita and long-distance contact Elin with reporting_cadence_days 14, created at 2026-08-01T00:00:00Z, no report ever sent."
            - "due_at == 2026-08-15T00:00:00Z, grace_at == 2026-08-22T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Dita Okonkwo", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Elin Okonkwo", contact_role: "ADULT_CHILD", is_long_distance: true, reporting_cadence_days: 14 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { fc: $.data.id, created: $.data.created_at, status_at_creation: $.data.report_status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T23:59:59Z" }
              as: PracticeAdmin
            - call: "GET /care/family-contacts/${fc}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { s_before_due: $.data.report_status, d_before_due: $.data.days_overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "GET /care/family-contacts/${fc}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { s_at_due: $.data.report_status, d_at_due: $.data.days_overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T23:59:59Z" }
              as: PracticeAdmin
            - call: "GET /care/family-contacts/${fc}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { s_before_grace: $.data.report_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PracticeAdmin
            - call: "GET /care/family-contacts/${fc}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { s_at_grace: $.data.report_status, d_at_grace: $.data.days_overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T12:00:00Z" }
              as: PracticeAdmin
            - call: "GET /care/family-contacts/${fc}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { s_late: $.data.report_status, d_late: $.data.days_overdue }
            - call: "POST /care/family-contacts/${fc}/reports"
              payload: { report_period_start: "2026-08-01", report_period_end: "2026-08-25", summary: "Two aide visits weekly; no falls; PCP follow-up 2026-09-02." }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { sent_at: $.data.last_report_sent_at, count: $.data.reports_sent_count, s_after_report: $.data.report_status }
          assert:
            - "At creation: data.created_at == \"2026-08-01T00:00:00Z\", data.report_status == \"CURRENT\", data.last_report_sent_at == null, data.reports_sent_count == 0"
            - "At 2026-08-14T23:59:59Z: report_status == \"CURRENT\" and days_overdue == 0"
            - "At 2026-08-15T00:00:00Z (== due_at): report_status == \"DUE\" and days_overdue == 0 — the boundary belongs to DUE"
            - "At 2026-08-21T23:59:59Z: report_status == \"DUE\""
            - "At 2026-08-22T00:00:00Z (== due_at + GRACE_DAYS): report_status == \"OVERDUE\" and days_overdue == 0 — the boundary belongs to OVERDUE"
            - "At 2026-08-25T12:00:00Z: report_status == \"OVERDUE\" and days_overdue == 3 (floor(3.5 days))"
            - "After the report: data.last_report_sent_at == \"2026-08-25T12:00:00Z\", data.reports_sent_count == 1, data.report_status == \"CURRENT\" (new due_at 2026-09-08T12:00:00Z) and data.days_overdue == 0"

