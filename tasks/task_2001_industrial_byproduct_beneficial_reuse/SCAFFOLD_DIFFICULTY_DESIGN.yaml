      - name: reject_cascade_to_commitment_suspension_to_booked_cancellations
        grounds:
          - state_machines.Shipment.DELIVERED_to_REJECTED
          - state_machines.OfftakeCommitment.ACTIVE_to_SUSPENDED
          - calculations.rejection_tolerance_posture
        distinguishing_aspect: |
          Depth-3 cascade originating from DELIVERED -> REJECTED (a different trigger than the
          accept cascade): the reject bumps cumulative_rejected_tons past the 20% tolerance
          (20.5 > 20.0; link 1), which itself flips the commitment ACTIVE -> SUSPENDED (link 2),
          which itself auto-cancels every BOOKED sibling shipment and releases their booked
          tonnage (link 3). A DISPATCHED sibling is deliberately NOT cancelled (conditional
          cascade).
        test_recipe:
