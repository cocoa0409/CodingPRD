          assert:
            - "Incident.${i1}.affected_account_count == 1 (the CONFIRMED delivery to account ${a1} projects into scope)"

  - section: validations
    instances:
      - name: mass_channels_refused_at_review
        claim_type: violation_to_error
        grounds: ['validations[priority=8"]', 'errors[ERR_CHANNEL_REFUSED]']
        distinguishing_aspect: "Both refused channels (MASS_MERCHANT and CLUB_STORE) fail APPROVE with ERR_CHANNEL_REFUSED while REJECT remains available."
        test_recipe:
          setup: ["D1 ACTIVE holding T1; two accounts proposed: A1 MASS_MERCHANT, A2 CLUB_STORE"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Big Box", channel: "MASS_MERCHANT", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Club Co", channel: "CLUB_STORE", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /api/accounts/${a2}/review", payload: { decision: "APPROVE" }, as: BrandAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_CHANNEL_REFUSED and err2 == ERR_CHANNEL_REFUSED"
            - "both accounts remain UNDER_REVIEW"

      - name: channel_restricted_product_only_for_independent
        claim_type: conditional_validation
        grounds: ['validations[priority=8"]', 'errors[ERR_PRODUCT_CHANNEL_RESTRICTED]', entities.Product.fields.channel_restricted]
        distinguishing_aspect: "Conditional validation keyed on the product flag: the same authorization succeeds for INDEPENDENT_GROCER and fails for CONVENIENCE only when channel_restricted is true."
        test_recipe:
          setup: ["D1 ACTIVE; product P1 channel_restricted; approved CONVENIENCE account A1 and approved INDEPENDENT_GROCER account A2"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Reserve Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [], channel_restricted: true }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "C-Store", channel: "CONVENIENCE", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Indy", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a2: $.data.id } }
            - { call: "POST /api/accounts/${a2}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a2}", product_id: "${p1}" }, as: BrandAdmin, captures: { auth2: $.data.id } }
          assert:
            - "err == ERR_PRODUCT_CHANNEL_RESTRICTED for the CONVENIENCE account"
            - "AccountProductAuthorization.${auth2}.status == AUTHORIZED for the INDEPENDENT_GROCER account"

      - name: proposal_in_foreign_territory_rejected
        claim_type: cross_entity_validation
        grounds: ['validations[priority=10"]', 'errors[ERR_TERRITORY_VIOLATION]']
        distinguishing_aspect: "Territory exclusivity: a distributor cannot propose an account in a territory granted to a different distributor."
        test_recipe:
          setup: ["D1 holds T1; D2 exists (PROSPECT, no territory)"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/distributors", payload: { code: "D2", name: "Dist Two" }, as: BrandAdmin, captures: { d2: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/accounts", payload: { name: "Poach Store", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TERRITORY_VIOLATION"

      - name: revoked_territory_regrant_blocked_until_cooling_off
        claim_type: temporal_validation
        grounds: [state_machines.Territory.REVOKED_to_OPEN, 'errors[ERR_INVALID_STATE"]']
        distinguishing_aspect: "REVOKED becomes effectively OPEN only after 30 days: regrant at +10 days fails with ERR_INVALID_STATE; at +31 days it succeeds (lazy transition bumps version first)."
        test_recipe:
          setup: ["T1 granted to D1 then revoked at 2026-09-01; D2 exists"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/distributors", payload: { code: "D2", name: "Dist Two" }, as: BrandAdmin, captures: { d2: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin, captures: { t1v2: $.data.version } }
            - { call: "POST /api/territories/${t1}/revoke", payload: {}, as: BrandAdmin, captures: { t1v3: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d2}", expected_territory_version: "${t1v3}" }, as: BrandAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: BrandAdmin }
            - { call: "GET /api/territories", payload: {}, as: BrandAdmin, captures: { t1v4: "$.data[0].version" } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d2}", expected_territory_version: "${t1v4}" }, as: BrandAdmin }
          assert:
            - "err == ERR_INVALID_STATE at +10 days (cooling-off not elapsed)"
            - "at +31 days the grant succeeds and Territory.${t1}.granted_distributor_id == ${d2}"

      - name: dedicated_slicer_required_for_flagged_allergen_product
        claim_type: conditional_validation
        grounds: ['validations[priority=8"]', 'errors[ERR_ALLERGEN_CROSS_CONTACT]', entities.Product.fields.requires_dedicated_slicer]
        distinguishing_aspect: "requires_dedicated_slicer=true overrides the cleaning-window fallback: a freshly cleaned NON-dedicated slicer still fails; a MILK-dedicated slicer passes."
        test_recipe:
          setup: ["approved A1; product P1 allergens [MILK], requires_dedicated_slicer true; slicer S1 NONE with fresh cleaning (via visit submit); slicer S2 dedicated MILK"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
