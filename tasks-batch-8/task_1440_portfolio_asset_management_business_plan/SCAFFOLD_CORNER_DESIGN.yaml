            - { call: "POST /api/capital-projects", payload: { asset_id: "${a1}", plan_id: "${pl1}", name: "X", requested_amount_cents: 30000000, sched_start_month: 1, sched_end_month: 12 }, as: AssetManager, as_user_id: "am-1", captures: { cpx: $.data.id } }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { pl_v1: $.data.version } }
