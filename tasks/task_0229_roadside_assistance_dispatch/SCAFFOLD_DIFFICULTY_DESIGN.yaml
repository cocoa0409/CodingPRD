        grounds:
          - validations[priority=12]
          - entities.BayReservation.fields.reserved_from
          - entities.BayReservation.fields.reserved_until
          - entities.Depot.fields.cleanup_buffer_minutes
        distinguishing_aspect: "Closed-interval-plus-buffer aggregate-capacity semantics on Depot/BayReservation (distinct geometry from the half-open shift rule): with bay_count=1 and cleanup_buffer=30, a reservation at [11:15,12:00] is rejected because the only bay is blocked by [10:00,11:00]+30min buffer = until 11:30."
        test_recipe:
          setup:
            - "A depot with bay_count=1, cleanup_buffer_minutes=30. One ACTIVE reservation [10:00,11:00] (buffered block to 11:30) for an existing TOW call."
          setup_api_calls:
