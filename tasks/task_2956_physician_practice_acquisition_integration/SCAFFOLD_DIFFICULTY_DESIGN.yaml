  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  #   metric 1 : truncated match_rate_bps at RECONCILE_MIN_BPS, via
  #              POST /ehr-migration-batches/{batchId}/progress
  #   metric 2 : empty blocking-task collection, via POST /readiness-tasks
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ehr_match_rate_exactly_9950_bps_reconciles
        grounds:
          - calculations.ehr_reconciliation_match_rate
          - state_machines.EhrMigrationBatch.status.LOADED_to_RECONCILED
          - state_machines.EhrMigrationBatch.status.LOADED_to_FAILED
          - entities.EhrMigrationBatch.fields.match_rate_bps
        distinguishing_aspect: |
          Numeric-threshold boundary on a TRUNCATED ratio: 19900 validated of
          20000 is exactly RECONCILE_MIN_BPS 9950 and reconciles, while 19899 of
          20000 floors to 9949 — not 9950 — and fails, proving the rate is floored
          rather than rounded and that the comparison is `>=` rather than `>`. The
          metric is a basis-point ratio on POST /ehr-migration-batches/{batchId}/progress,
          distinct in both metric and endpoint from the empty-collection boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING."
            - "Batch LO with record_count 20000 already reconciled at 19899 validated / 101 defect: status FAILED, match_rate_bps 9949, retry_count 1."
            - "Batch HI with record_count 20000 in status LOADED, counters still zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "CHARTS-LO", source_system: "ATHENA", chart_type: "STRUCTURED", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_lo_id: "$.data.id" }
            - call: "POST /ehr-migration-batches/${batch_lo_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_lo_id}/progress"
              payload: { action: "LOAD" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_lo_id}/progress"
              payload: { action: "RECONCILE", validated_count: 19899, defect_count: 101, note: "One record short of the floor." }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "CHARTS-HI", source_system: "ATHENA", chart_type: "STRUCTURED", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_hi_id: "$.data.id" }
            - call: "POST /ehr-migration-batches/${batch_hi_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_hi_id}/progress"
              payload: { action: "LOAD" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /ehr-migration-batches/${batch_hi_id}/progress"
              payload: { action: "RECONCILE", validated_count: 19900, defect_count: 100 }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "EhrMigrationBatch.${batch_hi_id}.match_rate_bps == 9950"
            - "EhrMigrationBatch.${batch_hi_id}.status == RECONCILED"
            - "EhrMigrationBatch.${batch_hi_id}.retry_count == 0"
            - "EhrMigrationBatch.${batch_hi_id}.unprocessed_count == 0"
            - "EhrMigrationBatch.${batch_lo_id}.match_rate_bps == 9949 (floor of 9949.5, never rounded up to 9950)"
            - "EhrMigrationBatch.${batch_lo_id}.status == FAILED and retry_count == 1"
            - "A POST /ehr-migration-batches/${batch_hi_id}/progress with action REQUEUE returns ERR_INVALID_STATE_TRANSITION (409) — RECONCILED is terminal"
            - "A RECONCILE with validated_count 19950 and defect_count 100 on a fresh 20000-record batch returns ERR_MIGRATION_COUNT_INVALID (422) only when the sum exceeds record_count; 19900 + 100 == 20000 does not"

      - name: zero_blocking_readiness_tasks_yields_blocked_not_ready
        grounds:
          - calculations.acquisition_readiness_posture
          - entities.ReadinessTask.fields.is_blocking
          - entities.Acquisition.fields.readiness_posture
          - state_machines.ReadinessTask.status.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and a different
          endpoint: an Acquisition whose blocking ReadinessTask set is EMPTY is
          BLOCKED, never READY, and a non-blocking task driven all the way to
          COMPLETE leaves it BLOCKED because non-blocking rows are excluded from
          the set entirely. Only the first is_blocking true row moves the posture,
          and it moves it to AT_RISK rather than READY.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING with readiness_posture BLOCKED and no ReadinessTask rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "REVENUE_CYCLE_GO_LIVE", is_blocking: false, due_on: "2026-10-20" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { nonblocking_task_id: "$.data.id" }
          assert:
            - "ReadinessTask.${nonblocking_task_id}.is_blocking == false and status == OPEN and domain == REVENUE_CYCLE"
            - "Acquisition.${acq_id}.readiness_posture == BLOCKED immediately after creation (count of blocking rows is still 0)"
            - "Driving ${nonblocking_task_id} to IN_PROGRESS then COMPLETE as IntegrationManager leaves Acquisition.${acq_id}.readiness_posture == BLOCKED, not READY"
            - "Creating a second ReadinessTask with task_code COMPLIANCE_TRAINING and is_blocking true moves Acquisition.${acq_id}.readiness_posture to AT_RISK"
            - "Completing that blocking task moves Acquisition.${acq_id}.readiness_posture to READY while ${nonblocking_task_id} is irrelevant to the result"
            - "A second POST /readiness-tasks with task_code REVENUE_CYCLE_GO_LIVE on ${acq_id} returns ERR_DUPLICATE_TASK_CODE (409)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  #   pair 1 : Acquisition  <- ReadinessTask
  #   pair 2 : BillingConversion <- PayerContract
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: acquisition_close_requires_every_blocking_readiness_task_terminal
        grounds:
          - state_machines.Acquisition.deal_status.SIGNED_to_CLOSED
          - state_machines.ReadinessTask.status.IN_PROGRESS_to_COMPLETE
          - state_machines.ReadinessTask.status.OPEN_to_WAIVED
          - validations[priority=41]
          - calculations.acquisition_readiness_posture
        distinguishing_aspect: |
          Acquisition.deal_status SIGNED -> CLOSED is gated on the state of a
          DIFFERENT entity: while the blocking ReadinessTask is IN_PROGRESS the
          posture is AT_RISK and CLOSE returns ERR_READINESS_NOT_READY; the very
          same request succeeds once that task reaches COMPLETE. The dependency
          crosses the Acquisition/ReadinessTask pair, distinct from the
          BillingConversion/PayerContract pair of the other instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SIGNED with compliance_clearance CLEARED, one Physician holding an EXECUTED plan, no PayerContract and no EhrMigrationBatch."
            - "One blocking ReadinessTask COMPLIANCE_TRAINING in status IN_PROGRESS, so readiness_posture is AT_RISK."
