scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_pricing_new_vs_renewal_variant
        grounds:
          - calculations.subscription_pricing
          - state_machines.Subscription.DRAFT_to_ACTIVE
          - state_machines.Subscription.RENEWAL_PENDING_to_RENEWED
          - entities.Subscription.fields.total_price_cents
        distinguishing_aspect: |
          Same per-seat tier weights produce a different subscription total on a NEW subscription
          (total 50000) than on a RENEWAL successor (45000 after the 0.10 loyalty discount), proving the
          dual-variant lives on the Subscription entity domain.
        test_recipe:
          setup:
            - "A season with base_subscription_fee_cents=20000, loyalty_renewal_discount_pct=0.10"
            - "A venue with one PREMIUM seat and one STANDARD seat"
            - "A patron with a DRAFT subscription holding both seats as ASSIGNED SubscriptionSeats"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S1", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z", base_subscription_fee_cents: 20000, loyalty_renewal_discount_pct: 0.10 }
              as: SeasonAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /box-office/venues"
              payload: { name: "Main Hall" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "A", seat_number: 1, price_tier: "PREMIUM" }
              as: SeasonAdmin
              captures: { seat_prem: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "A", seat_number: 2, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_std: $.data.id }
            - call: "POST /box-office/patrons"
              payload: { email: "p1@x.com", full_name: "Pat One" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/subscriptions"
              payload: { season_id: "${season_id}", patron_id: "${patron_id}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_prem}" }
              as: Patron
              as_user_id: "${patron_id}"
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_std}" }
              as: Patron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /box-office/subscriptions/${sub_id}/activate"
              payload: { expected_season_version: "${season_v}" }
              as: BoxOfficeAgent
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.total_price_cents == 50000"
            - "Subscription.${sub_id}.is_renewal == false"

      - name: exchange_fee_flexpass_vs_paid_variant
        grounds:
          - calculations.exchange_fee
          - state_machines.Ticket.ISSUED_to_EXCHANGED
          - entities.Exchange.fields.fee_cents
          - entities.Exchange.fields.mode
        distinguishing_aspect: |
          The same original/target seat pair yields a PAID_EXCHANGE fee_cents=800, whereas a FLEX_PASS on a
          SUBSCRIPTION-origin ticket would waive it to 0; the dual-variant lives on the Exchange entity domain,
          distinct from the subscription_pricing variant.
        test_recipe:
          setup:
            - "An ON_SALE performance with a STANDARD seat sold (PAID) as a SINGLE ticket priced 6000"
            - "A second ON_SALE performance with a free PREMIUM seat priced 13500 at demand 1.5"
            - "An exchange in REQUESTED state from the original ticket to the premium seat, mode PAID_EXCHANGE"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S2", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Show A" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "Hall2" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "B", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_std: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "B", seat_number: 2, price_tier: "PREMIUM" }
              as: SeasonAdmin
              captures: { seat_prem: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf1_id: $.data.id }
            - call: "POST /box-office/performances/${perf1_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf1_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf1_v: $.data.version }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-02T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.5 }
              as: SeasonAdmin
              captures: { perf2_id: $.data.id }
            - call: "POST /box-office/performances/${perf2_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf2_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /box-office/patrons"
              payload: { email: "p2@x.com", full_name: "Pat Two" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf1_id}", seat_id: "${seat_std}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf1_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { orig_ticket: $.data.id }
            - call: "POST /box-office/tickets/${orig_ticket}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
            - call: "POST /box-office/exchanges"
              payload: { original_ticket_id: "${orig_ticket}", target_performance_id: "${perf2_id}", target_seat_id: "${seat_prem}", mode: "PAID_EXCHANGE" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { exch_id: $.data.id }
          trigger:
            - call: "POST /box-office/exchanges/${exch_id}/complete"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Exchange.${exch_id}.status == COMPLETED"
            - "Exchange.${exch_id}.fee_cents == 800"
            - "Exchange.${exch_id}.price_delta_cents == 7500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: single_ticket_three_input_nonlinear_pricing
        grounds:
          - calculations.single_ticket_pricing
          - entities.Performance.fields.demand_multiplier
          - entities.Seat.fields.price_tier
          - entities.Patron.fields.donor_level
        distinguishing_aspect: |
          Mode (a): price_cents is a non-linear function of three inputs — seat tier band, performance
          demand_multiplier, and patron donor discount — computed as floor(tier_base * demand * (1 - donor_pct));
          for PREMIUM at demand 1.5 with a PATRON discount the result is exactly 12150, not the 13500 a
          discount-free buyer pays.
        test_recipe:
          setup:
            - "A PATRON-level patron (lifetime FULFILLED donations 100000) buying a PREMIUM single ticket at demand 1.5"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S3", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Show B" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "Hall3" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "C", seat_number: 1, price_tier: "PREMIUM" }
              as: SeasonAdmin
              captures: { seat_prem: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.5 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "p3@x.com", full_name: "Pat Three" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/donations"
              payload: { patron_id: "${patron_id}", amount_cents: 100000 }
              as: BoxOfficeAgent
              captures: { don_id: $.data.id }
            - call: "POST /box-office/donations/${don_id}/fulfill"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat_prem}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          assert:
            - "Patron.${patron_id}.donor_level == PATRON"
            - "Ticket.${ticket_id}.price_cents == 12150"

      - name: subscription_pricing_round_per_seat_then_sum_order
        grounds:
          - calculations.subscription_pricing
          - entities.SubscriptionSeat.fields.per_seat_price_cents
          - entities.Subscription.fields.total_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to floor-per-seat-THEN-sum (sum-of-floors). With
          base_subscription_fee_cents=3333 and two VALUE seats (weight 0.6), each per_seat floors to 1999 and
          the total is 3998 — NOT the 3999 that floor-of-sum would give, isolating the rounding-order axis,
          a different combinatorial mode than the three-input non-linear pricing above.
        test_recipe:
          setup:
            - "A season with base_subscription_fee_cents=3333"
            - "A DRAFT subscription holding two VALUE seats"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S4", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z", base_subscription_fee_cents: 3333 }
              as: SeasonAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /box-office/venues"
              payload: { name: "Hall4" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "BALC", row_label: "Z", seat_number: 1, price_tier: "VALUE" }
              as: SeasonAdmin
              captures: { seat_v1: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "BALC", row_label: "Z", seat_number: 2, price_tier: "VALUE" }
              as: SeasonAdmin
              captures: { seat_v2: $.data.id }
            - call: "POST /box-office/patrons"
              payload: { email: "p4@x.com", full_name: "Pat Four" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/subscriptions"
              payload: { season_id: "${season_id}", patron_id: "${patron_id}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_v1}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ss1: $.data.id }
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_v2}" }
              as: Patron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /box-office/subscriptions/${sub_id}/activate"
              payload: { expected_season_version: "${season_v}" }
              as: BoxOfficeAgent
          assert:
            - "SubscriptionSeat.${ss1}.per_seat_price_cents == 1999"
            - "Subscription.${sub_id}.total_price_cents == 3998"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_renewal_cycle_loop
        grounds:
          - state_machines.Subscription.ACTIVE_to_RENEWAL_PENDING
          - state_machines.Subscription.RENEWAL_PENDING_to_RENEWED
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          The Subscription machine forms a renewal cycle: an ACTIVE subscription moves to RENEWAL_PENDING then
          RENEWED while a successor subscription (prior_subscription_id set) carries the seats into the next
          cycle — a loop shape, not a one-way pipeline, on the Subscription entity.
        test_recipe:
          setup:
            - "An ACTIVE subscription on a season whose status is RENEWAL_OPEN, moved to RENEWAL_PENDING"
            - "A successor ACTIVE subscription with prior_subscription_id pointing at it"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S5", renewal_window_opens_at: "2026-05-01T00:00:00Z", renewal_window_closes_at: "2026-05-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id, season_v0: $.data.version }
            - call: "POST /box-office/venues"
              payload: { name: "Hall5" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "D", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/patrons"
              payload: { email: "p5@x.com", full_name: "Pat Five" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/subscriptions"
              payload: { season_id: "${season_id}", patron_id: "${patron_id}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: Patron
              as_user_id: "${patron_id}"
            - call: "POST /box-office/subscriptions/${sub_id}/activate"
              payload: { expected_season_version: "${season_v0}" }
              as: BoxOfficeAgent
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons/${season_id}/open-renewal"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/subscriptions/${sub_id}/offer-renewal"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /box-office/subscriptions"
              payload: { season_id: "${season_id}", patron_id: "${patron_id}", prior_subscription_id: "${sub_id}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { succ_id: $.data.id }
            - call: "POST /box-office/subscription-seats"
              payload: { subscription_id: "${succ_id}", seat_id: "${seat_id}" }
              as: Patron
              as_user_id: "${patron_id}"
            - call: "GET /box-office/seasons/${season_id}"
              payload: {}
              as: SeasonAdmin
              captures: { season_v2: $.data.version }
            - call: "POST /box-office/subscriptions/${succ_id}/activate"
              payload: { expected_season_version: "${season_v2}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /box-office/subscriptions/${sub_id}/confirm-renewal"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
          assert:
            - "Subscription.${sub_id}.status == RENEWED"
            - "Subscription.${succ_id}.status == ACTIVE"
            - "Subscription.${succ_id}.is_renewal == true"

      - name: ticket_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Ticket.HELD_to_ISSUED
          - entities.Ticket.fields.payment_status
          - entities.Ticket.fields.fulfillment_status
        distinguishing_aspect: |
          The Ticket carries two independent state dimensions: paying advances fulfillment HELD->ISSUED while
          payment_status moves UNPAID->PAID on its own axis, so the combined state (PAID, ISSUED) is reached by
          one trigger acting on two axes — a parallel-dimension shape on the Ticket entity, distinct from the
          Subscription cycle.
        test_recipe:
          setup:
            - "An ON_SALE performance with one held UNPAID single ticket"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S6", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Show C" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "Hall6" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "E", seat_number: 1, price_tier: "STANDARD" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/performances"
              payload: { production_id: "${prod_id}", venue_id: "${venue_id}", starts_at: "2026-07-01T19:30:00Z", on_sale_at: "2026-06-01T00:00:00Z", demand_multiplier: 1.0 }
              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "p6@x.com", full_name: "Pat Six" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat_id}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v}" }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /box-office/tickets/${ticket_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
          assert:
            - "Ticket.${ticket_id}.payment_status == PAID"
            - "Ticket.${ticket_id}.fulfillment_status == ISSUED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: performance_cancel_depth3_cascade
        grounds:
          - state_machines.Performance.ON_SALE_to_CANCELLED
          - state_machines.Ticket.HELD_to_VOID
          - entities.Patron.fields.account_credit_cents
          - entities.SubscriptionSeat.fields.status
        distinguishing_aspect: |
          Depth-3 chain from one trigger: cancelling the Performance voids a PAID SUBSCRIPTION ticket (link 1)
          -> that void flips the ticket's payment_status to REFUNDED which credits Patron.account_credit_cents
          by 30000 (link 2, caused by link 1) -> the same voided SUBSCRIPTION ticket releases its
          SubscriptionSeat to RELEASED (link 3, caused by link 1), each hop caused by the prior one.
        test_recipe:
          setup:
            - "An ACTIVE subscription whose single PREMIUM seat (per_seat 30000) issued a PAID SUBSCRIPTION ticket on an ON_SALE performance"
          setup_api_calls:
            - call: "POST /box-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: SeasonAdmin
            - call: "POST /box-office/seasons"
              payload: { name: "S7", renewal_window_opens_at: "2026-09-01T00:00:00Z", renewal_window_closes_at: "2026-09-15T00:00:00Z", base_subscription_fee_cents: 20000 }
              as: SeasonAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /box-office/productions"
              payload: { season_id: "${season_id}", title: "Show D" }
              as: SeasonAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /box-office/productions/${prod_id}/announce"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/venues"
              payload: { name: "Hall7" }
              as: SeasonAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /box-office/seats"
              payload: { venue_id: "${venue_id}", section: "ORCH", row_label: "F", seat_number: 1, price_tier: "PREMIUM" }
              as: SeasonAdmin
              captures: { seat_id: $.data.id }
            - call: "POST /box-office/patrons"
              payload: { email: "p7@x.com", full_name: "Pat Seven" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/subscriptions"
