            - { call: "POST /youth-ministry/trips/${trip}/itinerary-items", payload: {segment_type: "SERVICE", title: "paint", start_at: "2027-06-15T08:00:00Z", end_at: "2027-06-15T10:00:00Z", vehicle_code: "bus-1"}, as: TripLeader, as_user_id: "leader-1", captures: {e2: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip}/itinerary-items", payload: {segment_type: "MEAL", title: "lunch", start_at: "2027-06-15T12:00:00Z", end_at: "2027-06-15T13:00:00Z"}, as: TripLeader, as_user_id: "leader-1", captures: {ok_id: $.data.id} }
          assert:
