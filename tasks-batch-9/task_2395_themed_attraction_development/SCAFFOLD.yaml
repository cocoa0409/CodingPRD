  - method: GET
    path: "/show-scenes/{id}/effect-cues"
    description: "Reverse lookup: effect cues on the scene timeline"
    roles: [OwnerRep, CreativeDirector, ShowProgrammer, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "discipline_channel?"]
    output: EffectCue[]
    side_effects: []

  # -------------------------------------------------------------- EffectCue
  - method: POST
    path: "/effect-cues"
    description: "Places a lighting, audio, media, animation or special-effect cue on the scene timeline"
    roles: [ShowProgrammer]
    code: 201
    input: [scene_id, cue_label, discipline_channel, offset_ms, duration_ms]
    output: EffectCue
    side_effects: ["status := PLANNED"]
  - method: GET
    path: "/effect-cues/{id}"
    description: "Reads one effect cue"
    roles: [OwnerRep, CreativeDirector, ShowProgrammer, ProgramAdmin]
    code: 200
    input: []
    output: EffectCue
    side_effects: []
  - method: POST
    path: "/effect-cues/{id}/verify"
    description: "Marks the cue verified on the programming console"
    roles: [ShowProgrammer]
    code: 200
    input: []
    output: EffectCue
    side_effects: ["status := VERIFIED", "increments EffectCue.version by 1"]

  # ----------------------------------------------------------- DesignPackage
  - method: POST
    path: "/design-packages"
    description: "Creates a design package in DRAFT and prices the cost of work; guarded by OCC on the project version (concurrency_rules package-create-stale-project)"
    roles: [CreativeDirector]
    code: 201
    input: [project_id, ride_system_id, package_label, discipline_scope, base_construction_cost_cents, expected_project_version]
    output: DesignPackage
    side_effects:
      - "computes design_fee_cents, contingency_cents and total_cost_of_work_cents via calculations.design_package_cost_of_work"
      - "status := DRAFT"
      - "increments AttractionProject.version by 1"
  - method: GET
    path: "/design-packages/{id}"
    description: "Reads one design package with its priced cost of work and pinned ride-system version"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: DesignPackage
    side_effects: []
  - method: GET
    path: "/design-packages"
    description: "Filtered package list: by project, by ride system, or by status"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: ["project_id?", "ride_system_id?", "status?", "limit?", "offset?"]
    output: DesignPackage[]
    side_effects: []
  - method: POST
    path: "/design-packages/{id}/submit"
    description: "Submits the package for owner approval and pins the ride-system version it was coordinated against"
    roles: [CreativeDirector, OwnerRep]
    code: 200
    input: []
    output: DesignPackage
    side_effects:
      - "pinned_ride_system_version := current RideSystem.version"
      - "submitted_by_user_id := caller X-User-ID"
      - "revision_round incremented when the package was REVISION_REQUESTED"
      - "status := SUBMITTED"
      - "increments DesignPackage.version by 1"
  - method: POST
    path: "/design-packages/{id}/request-revision"
    description: "Owner returns the package for revision, opening another negotiation round"
    roles: [OwnerRep]
    code: 200
    input: [reason]
    output: DesignPackage
    side_effects: ["status := REVISION_REQUESTED", "increments DesignPackage.version by 1"]
  - method: POST
    path: "/design-packages/{id}/revise"
    description: "Designer re-prices the package during a revision round"
    roles: [CreativeDirector]
    code: 200
    input: [base_construction_cost_cents, expected_package_version]
    output: DesignPackage
    side_effects:
      - "recomputes design_fee_cents, contingency_cents and total_cost_of_work_cents via calculations.design_package_cost_of_work"
      - "increments DesignPackage.version by 1"
  - method: POST
    path: "/design-packages/{id}/approve"
    description: "Owner approves the package, commits its cost of work to the ledger and supersedes the previously approved package"
    roles: [OwnerRep]
    code: 200
    input: [expected_package_version]
    output: DesignPackage
    side_effects:
      - "approved_by_user_id := caller X-User-ID"
      - "status := APPROVED"
      - "any other APPROVED DesignPackage of the project cascades to SUPERSEDED"
      - "mints a BudgetLedgerEntry with entry_kind COMMITMENT and amount_cents := total_cost_of_work_cents"
      - "recomputes AttractionProject.committed_cost_cents / forecast_cost_cents and readiness_posture, which may cascade ShowScene freezes"
      - "increments DesignPackage.version by 1 and AttractionProject.version by 1"
  - method: GET
    path: "/design-packages/{id}/safety-reviews"
    description: "Reverse lookup: third-party safety reviews opened against the package"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SafetyReview[]
    side_effects: []

  # ------------------------------------------------------------ SafetyReview
  - method: POST
    path: "/safety-reviews"
    description: "Third-party reviewer opens a review against a submitted or approved package; guarded by OCC on the package version (concurrency_rules review-create-stale-package)"
    roles: [ThirdPartyReviewer]
    code: 201
    input: [design_package_id, standard_code, expected_package_version]
    output: SafetyReview
    side_effects:
      - "reviewer_user_id := caller X-User-ID"
      - "status := IN_REVIEW, open_finding_count := 0"
      - "increments DesignPackage.version by 1"
  - method: GET
    path: "/safety-reviews/{id}"
    description: "Reads one safety review with its open finding count"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: SafetyReview
    side_effects: []
  - method: POST
    path: "/safety-reviews/{id}/clear"
    description: "Clears the review once every finding is closed or waived (or when none was raised)"
    roles: [ThirdPartyReviewer]
    code: 200
    input: []
    output: SafetyReview
    side_effects: ["cleared_at := current logical clock instant", "status := CLEARED", "increments SafetyReview.version by 1"]
  - method: GET
    path: "/safety-reviews/{id}/findings"
    description: "Reverse lookup: findings raised by the review"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "severity?", "status?"]
    output: SafetyFinding[]
    side_effects: []

  # ----------------------------------------------------------- SafetyFinding
  - method: POST
    path: "/safety-findings"
    description: "Raises a non-conformance finding, which issues findings on the review and may freeze the whole program"
    roles: [ThirdPartyReviewer]
    code: 201
    input: [safety_review_id, severity, description, remediation_cost_estimate_cents]
    output: SafetyFinding
    side_effects:
      - "status := OPEN"
      - "SafetyReview.status := FINDINGS_ISSUED on the first finding and open_finding_count incremented"
      - "AttractionProject.open_critical_finding_count / open_major_finding_count recomputed"
      - "AttractionProject.readiness_posture recomputed, which cascades ShowScene rows to HELD when it becomes FROZEN"
      - "increments SafetyReview.version and AttractionProject.version by 1"
  - method: GET
    path: "/safety-findings/{id}"
    description: "Reads one safety finding"
    roles: [OwnerRep, CreativeDirector, RideEngineer, ThirdPartyReviewer, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: SafetyFinding
    side_effects: []
  - method: POST
    path: "/safety-findings/{id}/resolve"
    description: "Contractor records remediation evidence against an open finding"
    roles: [ContractorPM]
    code: 200
    input: [remediation_note]
    output: SafetyFinding
    side_effects: ["remediation_note recorded", "status := RESOLVED", "increments SafetyFinding.version by 1"]
  - method: POST
    path: "/safety-findings/{id}/close"
    description: "Reviewer verifies remediation and closes the finding, which can unfreeze the program"
    roles: [ThirdPartyReviewer]
    code: 200
    input: []
    output: SafetyFinding
    side_effects:
      - "status := CLOSED"
      - "SafetyReview.open_finding_count decremented"
      - "AttractionProject finding counters recomputed"
      - "AttractionProject.readiness_posture recomputed, which releases HELD ShowScene rows when the freeze lifts"
      - "increments SafetyFinding.version, SafetyReview.version and AttractionProject.version by 1"
  - method: POST
    path: "/safety-findings/{id}/waive"
    description: "Owner waives a non-critical finding with written justification"
    roles: [OwnerRep]
    code: 200
    input: [justification]
    output: SafetyFinding
    side_effects:
      - "waiver_justification recorded"
      - "status := WAIVED"
      - "SafetyReview.open_finding_count decremented"
      - "AttractionProject finding counters and readiness_posture recomputed"
      - "increments SafetyFinding.version, SafetyReview.version and AttractionProject.version by 1"

  # --------------------------------------------------- ValueEngineeringItem
  - method: POST
    path: "/value-engineering-items"
    description: "Contractor proposes a value-engineering saving"
    roles: [ContractorPM]
    code: 201
    input: [project_id, title, gross_saving_cents, rework_loss_pct, implementation_cost_cents, capacity_impact_guests_per_hour, scope_impact_delta_cents]
    output: ValueEngineeringItem
    side_effects: ["status := PROPOSED"]
  - method: GET
    path: "/value-engineering-items/{id}"
    description: "Reads one value-engineering item with its net saving and ballot tally"
    roles: [OwnerRep, CreativeDirector, ContractorPM, ProgramAdmin]
    code: 200
    input: []
    output: ValueEngineeringItem
    side_effects: []
  - method: POST
    path: "/value-engineering-items/{id}/open-review"
    description: "Owner opens the three-party ballot on the proposal and fixes its net saving"
    roles: [OwnerRep]
    code: 200
    input: []
    output: ValueEngineeringItem
    side_effects:
      - "net_saving_cents := calculations.ve_item_net_saving"
      - "status := UNDER_REVIEW"
      - "recomputes AttractionProject.forecast_cost_cents"
      - "increments ValueEngineeringItem.version by 1 and AttractionProject.version by 1"
  - method: POST
    path: "/ve-ballots"
    description: "Casts one party's ballot; the third ballot resolves the item, and any veto rejects it immediately"
    roles: [OwnerRep, ContractorPM, CreativeDirector]
    code: 201
    input: [value_engineering_item_id, party_role, decision, "comment?"]
    output: VEBallot
    side_effects:
      - "cast_by_user_id := caller X-User-ID"
      - "ValueEngineeringItem.ballot_count incremented and veto_present set when decision == VETO"
      - "ValueEngineeringItem resolves to ADOPTED (third ballot, no veto, at least 2 APPROVE) or REJECTED (any veto, or third ballot with fewer than 2 APPROVE)"
      - "on ADOPTED: mints a BudgetLedgerEntry with entry_kind VE_SAVING and amount_cents := 0 - net_saving_cents, recomputes committed_cost_cents / forecast_cost_cents and readiness_posture, which may release HELD ShowScene rows"
      - "increments ValueEngineeringItem.version by 1 and, when the item resolves, AttractionProject.version by 1"
  - method: GET
    path: "/value-engineering-items/{id}/ballots"
    description: "Reverse lookup: ballots cast on the item"
    roles: [OwnerRep, CreativeDirector, ContractorPM, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: VEBallot[]
    side_effects: []

