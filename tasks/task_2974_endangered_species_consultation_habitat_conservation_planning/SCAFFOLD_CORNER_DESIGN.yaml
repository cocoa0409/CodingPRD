            - call: "GET /project-actions/${action_id}"
              payload: {}
              as: Auditor
              captures: {e401_id: "$.data.error_id", e401_msg: "$.data.message"}
            - call: "GET /project-actions/${action_id}"
              payload: {}
              as: Anonymous
              captures: {e403_id: "$.data.error_id", e403_msg: "$.data.message"}
            - call: "GET /project-actions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {e404_id: "$.data.error_id", e404_msg: "$.data.message"}
            - call: "POST /project-actions"
