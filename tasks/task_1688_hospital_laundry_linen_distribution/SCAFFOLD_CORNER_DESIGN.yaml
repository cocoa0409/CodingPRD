            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "GET /units/${u1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { qf30: $.data.quality_flag } }
