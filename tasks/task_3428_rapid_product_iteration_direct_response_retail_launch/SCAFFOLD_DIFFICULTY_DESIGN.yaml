            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV200-BBX", channel: "BIG_BOX" }
              as: ProductLead
              captures: { variant2_id: $.data.id }
            - call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV300-CLB", channel: "CLUB" }
              as: ProductLead
              captures: { variant3_id: $.data.id }
            - call: "POST /model-variants/${variant_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
              captures: { v1_lifecycle: $.data.lifecycle }
            - call: "POST /model-variants/${variant2_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
              captures: { v2_lifecycle: $.data.lifecycle }
          trigger:
            - call: "POST /model-variants/${variant3_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
              captures: { err3: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /model-variants/${variant3_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
              captures: { v3_lifecycle: $.data.lifecycle }
          assert:
            - "v1_lifecycle == TOOLED and v2_lifecycle == TOOLED (two parallel engagements fit the slot cap)"
            - "err3 == ERR_TOOLING_SLOTS_FULL (third overlapping window [2026-09-10, 2026-09-24) exceeds 2 slots)"
            - "v3_lifecycle == TOOLED at 2026-09-25 (V1/V2 windows ended at 2026-09-24 exclusive; the slot freed without any explicit release call)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: commitment_create_then_cancel_conserves_partner_capacity
        grounds:
          - invariants.partner_capacity_conservation
          - state_machines.LaunchCommitment.OPEN_to_CANCELLED
          - entities.FactoryPartner.fields.allocated_units
        distinguishing_aspect: |
          Conserved quantity: factory UNIT capacity. The forward action
          (commitment create, allocated 0 -> 300) paired with its compensating
          action (cancel, allocated 300 -> 0) leaves allocated_units exactly
          equal to the sum over OPEN commitments plus OPEN replenishments —
          zero drift after the round trip.
        test_recipe:
          setup:
            - "Variant DR_TESTING with DECIDED_SCALE media; agreement SIGNED (window [2026-10-01, 2027-01-01)); partner capacity 500, allocated 0."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - *k_concept
            - *k_ins_a
            - *k_ins_b
            - *k_clock0910
            - *k_advance
            - *k_advance
            - *k_advance
            - *k_round
            - *k_round_pass
            - *k_advance
            - *k_partner
            - *k_variant
            - *k_tool
            - *k_study
            - *k_complete
            - *k_substantiate
            - *k_media
            - *k_air
            - call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "SCALE"
                order_lines: [ { revenue_cents: 5000, cancels_cents: 0, returns_cents: 0 } ]
              as: MediaBuyer
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: true, window_start: "2026-10-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_id: $.data.id }
            - call: "POST /retail-agreements/${agr_id}/sign"
              payload: {}
              as: RetailExec
              captures: { agr_v: $.data.version }
            - call: "GET /factory-partners/${partner_id}"
              payload: {}
              as: SourcingManager
              captures: { alloc_base: $.data.allocated_units }
          trigger:
            - call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 300, need_by_date: "2026-10-15T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { commitment_id: $.data.id }
            - call: "GET /factory-partners/${partner_id}"
              payload: {}
              as: SourcingManager
              captures: { alloc_mid: $.data.allocated_units }
            - call: "POST /launch-commitments/${commitment_id}/cancel"
              payload: {}
              as: SourcingManager
              captures: { c_status: $.data.status }
            - call: "GET /factory-partners/${partner_id}"
              payload: {}
              as: SourcingManager
              captures: { alloc_end: $.data.allocated_units }
          assert:
            - "alloc_base == 0 and alloc_mid == 300 (create allocated exactly committed_units)"
            - "c_status == CANCELLED"
            - "alloc_end == alloc_base == 0 (compensating cancel restored the invariant: allocated == SUM over OPEN commitments + OPEN replenishments == 0)"

      - name: case_accrue_then_favorable_judgment_conserves_reserve_ledger
        grounds:
          - invariants.litigation_reserve_reconciliation
          - state_machines.PatentCase.ACTIVE_to_JUDGED_FAVORABLE
          - entities.Category.fields.active_reserve_cents
        distinguishing_aspect: |
          Conserved quantity: the legal-reserve MONEY ledger (different from
          unit capacity). Filing accrues a provisional reserve (0 -> 300000);
          the compensating FAVORABLE judgment releases it exactly (300000 -> 0)
          — the category ledger reconciles to its pre-case value with no drift.
        test_recipe:
          setup:
            - "Season OPEN; category base 6; active_reserve_cents == 0."
          setup_api_calls:
            - *k_clock0
            - *k_season
            - *k_cat
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { reserve_base: $.data.active_reserve_cents }
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-4001", claim_cents: 1000000, severity: "MED" }
              as: LegalCounsel
              as_user_id: "lc-jane"
              captures: { case_id: $.data.id }
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { reserve_mid: $.data.active_reserve_cents }
            - call: "POST /launch-seasons/${season_id}/run-review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /patent-cases/${case_id}/record-judgment"
              payload: { outcome: "FAVORABLE" }
              as: LegalCounsel
              captures: { case_status: $.data.status, final_amt: $.data.final_amount_cents }
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: LegalCounsel
              captures: { reserve_end: $.data.active_reserve_cents, exposure_end: $.data.exposure_index, level_end: $.data.exposure_level }
          assert:
            - "reserve_base == 0 and reserve_mid == 300000 (filing accrued round_half_up(1000000 * 0.30))"
            - "case_status == JUDGED_FAVORABLE and final_amt == 0"
            - "reserve_end == reserve_base == 0 (the accrue/release pair reconciled the ledger exactly)"
            - "exposure_end == 6 and level_end == CLEAR (a favorable judgment removes the case from every exposure term; season posture never left SEASON_OPEN)"
