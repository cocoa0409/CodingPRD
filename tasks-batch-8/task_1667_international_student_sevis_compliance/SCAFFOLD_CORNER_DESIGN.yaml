        claim_type: violation_to_error
        grounds: [calculations.address_report_timeliness, entities.AddressReport.fields.status]
        distinguishing_aspect: "Address deadline is inclusive: a report filed exactly 10 days after move_date is REPORTED, while 11 days is FLAGGED_LATE and degrades posture to AT_RISK."
        test_recipe:
          setup: ["Clock 2026-08-11; students A and B exist; A reports move_date 2026-08-01 (10 days), B reports move_date 2026-07-31 (11 days)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_a: $.data.id } }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0087654321", full_name: "Li Wei", email: "li@example.edu", date_of_birth: "2001-09-02", country_of_citizenship: "CN", degree_level: "GRADUATE" }, as: DSO, captures: { stu_b: $.data.id } }
          trigger:
            - { call: "POST /sevis/students/${stu_a}/address-reports", payload: { move_date: "2026-08-01", address_line1: "1 College Ave", city: "Springfield", state_code: "IL", postal_code: "62701" }, as: Student, as_user_id: "${stu_a}", captures: { a_status: $.data.status } }
            - { call: "POST /sevis/students/${stu_b}/address-reports", payload: { move_date: "2026-07-31", address_line1: "2 College Ave", city: "Springfield", state_code: "IL", postal_code: "62701" }, as: Student, as_user_id: "${stu_b}", captures: { b_status: $.data.status } }
            - { call: "GET /sevis/students/${stu_b}", payload: {}, as: DSO, captures: { b_posture: $.data.compliance_posture } }
          assert:
            - "A (exactly 10 days): AddressReport.status == REPORTED"
            - "B (11 days): AddressReport.status == FLAGGED_LATE"
            - "Student B compliance_posture == AT_RISK"

      - name: effective_min_reconciliation_covered_by_difficulty
        claim_type: computed_fields
        grounds: [entities.TermEnrollment.fields.effective_min_credits]
        excluded_because:
          difficulty_instance: rcl_academic_floor_multi_input
          rationale: "Derived-field reconciliation of effective_min_credits after RCL approval is asserted in the named §1.8 instance (12 -> 6)."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: correct_result
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "immediate model: a GET issued right after POST returns the created entity with identical input fields and version 1 — no asynchronous lag."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
          trigger:
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "GET /sevis/students/${stu_id}", payload: {}, as: DSO, captures: { got_name: $.data.full_name, got_sevis: $.data.sevis_id, got_v: $.data.version, got_posture: $.data.compliance_posture } }
          assert:
            - "GET returns full_name == Asha Rao, sevis_id == N0012345678"
            - "version == 1 and compliance_posture == CLEAR in the same read"
