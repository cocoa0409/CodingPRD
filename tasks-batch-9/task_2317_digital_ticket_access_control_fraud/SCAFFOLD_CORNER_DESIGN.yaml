# =============================================================================
# §1.9 Scaffold Corner Design — task_2317 Digital Ticket Access Control & Fraud
#
# Breadth probe over §1.1-§1.7. Section names and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; nothing is invented.
#
# Fixture conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * the logical clock is set to 2026-08-01T00:00:00Z as the first call of every
#     chain, and every Event uses barcode_anchor_at 2026-09-12T18:00:00Z so that
#     epoch 20 == 18:10:00Z, 21 == 18:10:30Z, 22 == 18:11:00Z, 24 == 18:12:00Z,
#     25 == 18:12:30Z
#   * opaque X-User-IDs: admin-1 (VenueAdmin), boa-1 / boa-2 (BoxOfficeAgent),
#     appr-1 (TicketingApprover), gate-op-1 (GateOperator), sec-1
#     (SecurityInvestigator); the Patron role is entity_backed, so its
#     as_user_id is always a captured Patron id
#   * the non-existent-id literal used for 404 probes is
#     00000000-0000-0000-0000-0000000000ff
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Table 1 — Entities
  # entity_topology is flat, so the topology row exercised is
  # "foreign key references validated; cross-reference integrity".
  # ===========================================================================
  - section: entities
    instances:
      - name: event_creation_applies_declared_defaults_and_zeroes_counters
        claim_type: defaults
        grounds:
          - entities.Event.fields.price_cap_regime
          - entities.Event.fields.transfer_limit_per_ticket
          - entities.Event.fields.status
          - entities.Event.fields.live_occupancy
          - entities.Event.fields.peak_live_occupancy
          - entities.Event.fields.entitlements_outstanding
          - entities.Event.fields.settlement_pool_cents
          - endpoints[POST /events]
        distinguishing_aspect: |
          Omitting both optional inputs must yield price_cap_regime VENUE_POLICY and
          transfer_limit_per_ticket 2, with status DRAFT and all four computed counters at
          0 and version 1 — no counter may start at null.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id, regime: $.data.price_cap_regime, limit: $.data.transfer_limit_per_ticket, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP 201 and ${regime} == VENUE_POLICY and ${limit} == 2"
            - "${st} == DRAFT and ${ver} == 1"
            - "Event.${ev_id}.live_occupancy == 0, peak_live_occupancy == 0, entitlements_outstanding == 0, settlement_pool_cents == 0"
            - "Event.${ev_id}.id, created_at and updated_at are all non-null, and created_at == updated_at == 2026-08-01T00:00:00Z"
            - "The response carries meta.api_request_id and meta.api_request_timestamp with response_type == object"

      - name: event_retrieval_returns_the_stored_record_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /events/{id}]
          - entities.Event.fields.fire_code_capacity
          - entities.Event.fields.barcode_anchor_at
        distinguishing_aspect: |
          GET /events/{id} echoes exactly the persisted values written at creation —
          fire_code_capacity 200, barcode_anchor_at 2026-09-12T18:00:00Z,
          price_cap_regime STATUTORY, transfer_limit_per_ticket 1 — with the same
          version 1 and no field dropped.
        test_recipe:
          setup:
            - "One Event created at 2026-08-01T00:00:00Z with explicit non-default price_cap_regime STATUTORY and transfer_limit_per_ticket 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Statutory Matinee"
                venue_name: "Southgate Hall"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "STATUTORY"
                transfer_limit_per_ticket: 1
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /events/${ev_id}"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { got_name: $.data.name, got_cap: $.data.fire_code_capacity, got_regime: $.data.price_cap_regime, got_limit: $.data.transfer_limit_per_ticket, got_anchor: $.data.barcode_anchor_at, got_ver: $.data.version }
          assert:
            - "HTTP 200 and ${got_name} == Statutory Matinee and ${got_cap} == 200"
            - "${got_regime} == STATUTORY and ${got_limit} == 1 — the explicit inputs were not overwritten by the defaults"
            - "${got_anchor} == 2026-09-12T18:00:00Z and ${got_ver} == 1"
            - "Event.${ev_id}.status == DRAFT"

      - name: event_listing_paginates_with_total_count_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /events]
          - response_envelope.pagination_fields
          - entities.Event.fields.status
        distinguishing_aspect: |
          With three events created and one advanced to ON_SALE:
          limit=2&offset=0 returns 2 rows with total_count 3 and has_more true;
          limit=2&offset=2 returns 1 row with has_more false; status=ON_SALE returns
          exactly 1 row with total_count 1.
        test_recipe:
          setup:
            - "Three Events created in order: Aurora Night, Boreal Matinee, Comet Finale; Aurora Night advanced to ON_SALE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /events"
              payload:
                name: "Boreal Matinee"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-13T18:00:00Z"
                doors_open_at: "2026-09-13T18:00:00Z"
                event_start_at: "2026-09-13T19:00:00Z"
                transfer_window_closes_at: "2026-09-13T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev2_id: $.data.id }
            - call: "POST /events"
              payload:
                name: "Comet Finale"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-14T18:00:00Z"
                doors_open_at: "2026-09-14T18:00:00Z"
                event_start_at: "2026-09-14T19:00:00Z"
                transfer_window_closes_at: "2026-09-14T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev3_id: $.data.id }
            - call: "POST /events/${ev1_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /events?limit=2&offset=0"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { p1_total: $.meta.total_count, p1_more: $.meta.has_more }
            - call: "GET /events?limit=2&offset=2"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { p2_total: $.meta.total_count, p2_more: $.meta.has_more }
            - call: "GET /events?status=ON_SALE"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { f_total: $.meta.total_count, f_first_id: "$.data[0].id" }
          assert:
            - "First page: exactly 2 rows returned, ${p1_total} == 3, ${p1_more} == true, response_type == array"
            - "Second page: exactly 1 row returned, ${p2_total} == 3, ${p2_more} == false"
            - "Filtered: ${f_total} == 1 and ${f_first_id} == ${ev1_id}"
            - "Event.${ev2_id}.status == DRAFT and Event.${ev3_id}.status == DRAFT — the filter did not mutate anything"

      - name: ticket_read_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /tickets/{id}]
          - validations[priority=4]
          - errors.ERR_TICKET_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unallocated id on GET /tickets/{id} returns
          ERR_TICKET_NOT_FOUND with HTTP 404 — the collection-specific code, not the
          generic ERR_EVENT_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database apart from the clock; no Ticket has ever been issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /tickets/00000000-0000-0000-0000-0000000000ff"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${err} == ERR_TICKET_NOT_FOUND with HTTP 404 and response_type == error"
            - "${msg} is a non-empty string"
            - "GET /tickets returns total_count == 0 — the probe created nothing"

      - name: access_zone_creation_missing_required_fire_code_capacity_returns_4XX
        claim_type: required_fields
        grounds:
          - endpoints[POST /events/{id}/access-zones]
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - entities.AccessZone.fields.fire_code_capacity
        distinguishing_aspect: |
          fire_code_capacity has source input, no default, and is required, so omitting it
          returns ERR_INVALID_REQUEST (400) and persists no AccessZone — it must not
          silently default to 0 or null.
        test_recipe:
          setup:
            - "One Event in DRAFT (zone creation is only permitted in DRAFT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /access-zones?event_id=${ev_id} has total_count == 0"
            - "Event.${ev_id}.version == 1 — a rejected child creation does not bump the parent"

      - name: access_zone_creation_applies_credential_capacity_and_comp_discount_defaults
        claim_type: defaults
        grounds:
          - entities.AccessZone.fields.credential_capacity
          - entities.AccessZone.fields.comp_discount_pct
          - entities.AccessZone.fields.posture
          - entities.AccessZone.fields.occupancy_count
          - entities.AccessZone.fields.issued_entitlement_count
          - entities.AccessZone.fields.comp_forgone_cents
        distinguishing_aspect: |
          Omitting credential_capacity and comp_discount_pct yields 0 and 0.85
          respectively — note the asymmetry: the capacity default is a hard zero that
          blocks every credential approval, while the discount default is 0.85.
        test_recipe:
          setup:
            - "One Event in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 100, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id, cred_cap: $.data.credential_capacity, disc: $.data.comp_discount_pct, posture: $.data.posture }
          assert:
            - "HTTP 201 and ${cred_cap} == 0 and ${disc} == 0.85"
            - "${posture} == OPEN — the ratio 0 / 100 is below RESTRICTED_RATIO 0.90"
            - "AccessZone.${z_id}.occupancy_count == 0, issued_entitlement_count == 0, comp_forgone_cents == 0, version == 1"
            - "AccessZone.${z_id}.event_id == ${ev_id}"

      - name: ticket_creation_rejects_client_supplied_system_fields
        claim_type: system_fields
        grounds:
          - endpoints[POST /tickets]
          - entities.Ticket.fields.barcode_seed
          - entities.Ticket.fields.lifecycle_status
          - entities.Ticket.fields.credential_request_id
          - validations[priority=3]
        distinguishing_aspect: |
          barcode_seed, lifecycle_status and credential_request_id all have source system
          and are absent from POST /tickets' input, so a body carrying them is rejected
          with ERR_INVALID_REQUEST (400) rather than silently ignored; the follow-up clean
          creation proves the server mints barcode_seed itself.
        test_recipe:
          setup:
            - "Event ON_SALE with AccessZone GA1; Ada verified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 200, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
          trigger:
            - call: "POST /tickets"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_id}"
                holder_patron_id: "${p_ada_id}"
                ticket_type: "PAID"
                face_value_cents: 12000
                barcode_seed: "SEED-FORGED"
                lifecycle_status: "RESOLD"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err: $.data.error_id }
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id, seed: $.data.barcode_seed, life: $.data.lifecycle_status }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400 for the body carrying system fields"
            - "The rejected attempt persisted nothing: after it, Event.${ev_id}.entitlements_outstanding was still 0"
            - "${seed} is a non-null server-minted string and is NOT equal to SEED-FORGED"
            - "${life} == ISSUED and Ticket.${t_id}.admission_status == NOT_ADMITTED and device_binding_status == UNBOUND"
            - "Ticket.${t_id}.credential_request_id == null — direct issuance is not credential-backed"
            - "Event.${ev_id}.settlement_pool_cents == 12000 and entitlements_outstanding == 1 and AccessZone.${z_id}.issued_entitlement_count == 1"

      - name: enum_and_range_constraints_rejected_on_ticket_and_credential_request
        claim_type: type_constraints
        grounds:
          - entities.Ticket.fields.ticket_type
          - entities.CredentialRequest.fields.quantity
          - entities.CredentialRequest.fields.valid_until
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Four separate shape violations must all land on ERR_INVALID_REQUEST (400):
          ticket_type outside {PAID, COMP, WILL_CALL, CREDENTIAL}; quantity 0 below the
          declared minimum 1; quantity 51 above the declared maximum 50; and
          valid_until exactly equal to valid_from, which fails the strictly-after rule.
        test_recipe:
          setup:
            - "Event ON_SALE with AccessZone GA1 (credential_capacity 8); Ada verified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 200, face_value_reference_cents: 8750, credential_capacity: 8 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
          trigger:
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "VIP", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /credential-requests"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_id}"
                recipient_patron_id: "${p_ada_id}"
                distribution_type: "COMP"
                quantity: 0
                valid_from: "2026-09-12T18:00:00Z"
                valid_until: "2026-09-12T22:00:00Z"
                justification: "Zero quantity probe"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err_low: $.data.error_id }
            - call: "POST /credential-requests"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_id}"
                recipient_patron_id: "${p_ada_id}"
                distribution_type: "COMP"
                quantity: 51
                valid_from: "2026-09-12T18:00:00Z"
                valid_until: "2026-09-12T22:00:00Z"
                justification: "Over-maximum quantity probe"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err_high: $.data.error_id }
            - call: "POST /credential-requests"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_id}"
                recipient_patron_id: "${p_ada_id}"
                distribution_type: "COMP"
                quantity: 1
                valid_from: "2026-09-12T18:00:00Z"
                valid_until: "2026-09-12T18:00:00Z"
                justification: "Zero-length window probe"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err_window: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_low} == ERR_INVALID_REQUEST with HTTP 400 (quantity minimum is 1)"
            - "${err_high} == ERR_INVALID_REQUEST with HTTP 400 (quantity maximum is 50)"
            - "${err_window} == ERR_INVALID_REQUEST with HTTP 400 (valid_until must be strictly after valid_from)"
            - "GET /tickets?event_id=${ev_id} has total_count == 0 and GET /credential-requests?event_id=${ev_id} has total_count == 0"
            - "Event.${ev_id}.entitlements_outstanding == 0 and AccessZone.${z_id}.issued_entitlement_count == 0"

      - name: scan_event_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.ScanEvent
          - endpoints[GET /scan-events/{id}]
          - entities.ScanEvent.fields.recorded_at
          - entities.ScanEvent.fields.source
        distinguishing_aspect: |
          ScanEvent is declared common_fields false, so its read shape carries id and
          created_at but NO version and NO updated_at, and §1.5 declares no update or
          delete endpoint for it — the only mutation path is appending new events.
        test_recipe:
          setup:
