  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_version_on_short_close
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[contract-short-close-stale-version"
        distinguishing_aspect: "Short-close with an expected_contract_version that does not match the current Contract.version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["PTBF contract partially received; client holds a stale version from before the receipt."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-OSC", legal_name: "OccSC", counterparty_kind: "SUPPLIER", credit_limit_usd: 10000000 }
              as: Trader
              captures: { sup_osc: $.data.id }
            - call: "POST /roastery/counterparties/${sup_osc}/contracts"
              payload: { contract_ref: "C-OSC", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 5000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_osc: $.data.id, c_osc_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_osc}/shipments"
              payload: { shipment_ref: "SH-OSC", planned_lbs: 2000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_osc: $.data.id }
            - call: "POST /roastery/shipments/${sh_osc}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_osc}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_osc}/receive"
              payload: { received_lbs: 2000, lot_code: "L-OSC", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
          trigger:
            - call: "POST /roastery/contracts/${c_osc}/short-close"
              payload: { expected_contract_version: "${c_osc_v0}" }
              as: Trader
              captures: { osc_err: $.data.error_id }
          assert:
            - "osc_err == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "Note: receive bumped Contract.version from v0 to v0+1, so the held version is stale"

      - name: occ_stale_version_on_recipe_approve
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[recipe-approve-stale-product-version"
        distinguishing_aspect: "Recipe approve with a stale expected_product_version returns ERR_STALE_VERSION."
        test_recipe:
          setup: ["Product + DRAFT recipe; product version advanced by a prior recipe approval (now superseded)."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/roast-profiles"
              payload: { profile_code: "RP-ORA", charge_temp_c: 200, target_drop_temp_c: 210, expected_yield_loss_pct: 0.16, shrinkage_alert_band_pct: 0.02 }
