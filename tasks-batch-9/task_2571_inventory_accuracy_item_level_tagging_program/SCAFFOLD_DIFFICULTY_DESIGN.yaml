  - rule_id: transitive_cascade
    instances:

      - name: adjustment_post_cascades_position_to_store_fulfillment
        grounds:
          - state_machines.Adjustment.UNPOSTED_to_POSTED
          - calculations.position_promising_state
          - calculations.store_fulfillment_posture
          - entities.Store.fields.fulfillment_status
          - entities.CountSchedule.fields.cadence_days
        distinguishing_aspect: |
          Triggering transition: Adjustment posting_state UNPOSTED -> POSTED. Depth 5, and every link
          is CAUSED BY the previous one, not fanned out from the trigger: hop 1 flips posting_state;
          hop 2 exists only because hop 1 changed the POSTED set, re-deriving on_hand_units to -5;
          hop 3 exists only because hop 2 made on_hand_units negative, flipping promising_state to
          BLOCKED; hop 4 exists only because hop 3 changed a position's promising_state, re-deriving
          the store's blocked ratio to 10000 bps and fulfillment_status to SUSPENDED; hop 5 exists
          only because hop 4 produced SUSPENDED, halving every ACTIVE CountSchedule's cadence. The
          other instance of this rule is triggered by a VarianceInvestigation CAUSE_APPROVED -> CLOSED
          transition instead.
        test_recipe:
          setup:
            - "Category APPAREL (variance_tolerance_value_cents 20000, min_accuracy_pct 97.00); Store S100; Vendor VEND1; Item TEE-001 at 1234 cents."
            - "Exactly ONE stock position at S100 — TEE-001 with opening on-hand 5 units — so a single blocked position is 100 percent of the store."
            - "One ACTIVE CountSchedule for (S100, APPAREL) with cadence_days 30 and first_due_date 2026-09-01, so its pre-cascade next_due_date is 2026-09-01."
            - "An adjustment of -10 units: value_impact 10 * 1234 = 12340, threshold max(1000, floor(20000 * 1.0 * 1.0)) = 20000, and 12340 < 20000 so approval_state is NOT_REQUIRED and it can be posted with no approval transition at all."
            - "The logical clock is left at its 2026-08-01T00:00:00Z default, which is what hop 5 stamps into next_due_date."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 5, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-09-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "GET /inventory-integrity/stock-positions/${pos_tee1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { pos_v: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: -10, reason_code: "COUNT_VARIANCE", expected_stock_position_version: "${pos_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { adj1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/adjustments/${adj1}/post"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "at creation, Adjustment.${adj1}.value_impact_cents == 12340, authority_threshold_cents == 20000 and approval_state == \"NOT_REQUIRED\""
            - "HOP 1 — response data.posting_state == \"POSTED\" and data.posted_at == \"2026-08-01T00:00:00Z\""
            - "HOP 2 — StockPosition.${pos_tee1}.on_hand_units == -5 and book_value_cents == -6170"
            - "HOP 3 — StockPosition.${pos_tee1}.promising_state == \"BLOCKED\" (negative on-hand is a hard gate, so it outranks the accuracy clause)"
            - "HOP 4 — GET /inventory-integrity/stores/${store_s100}/fulfillment-eligibility returns data.total_position_count == 1, data.blocked_position_count == 1, data.blocked_ratio_bps == 10000, data.accuracy_index_bps == 10000 and data.fulfillment_status == \"SUSPENDED\" — the blocked ratio suspends the store even though the accuracy index is a perfect 10000"
            - "HOP 5 — CountSchedule.${sched1}.cadence_days == 15 (max(MIN_ACCELERATED_CADENCE_DAYS 7, floor(30 / 2))) and next_due_date == \"2026-08-01\", down from 30 and 2026-09-01"
            - "CountSchedule.${sched1}.status is still ACTIVE — acceleration does not pause the schedule"

      - name: investigation_close_cascades_shrink_vendor_tag_sample
        grounds:
          - state_machines.VarianceInvestigation.CAUSE_APPROVED_to_CLOSED
          - calculations.shrink_attribution
          - entities.Vendor.fields.shortage_event_count
          - entities.Vendor.fields.required_verification_sample_pct
          - calculations.tag_verification_outcome
        distinguishing_aspect: |
          Triggering transition: VarianceInvestigation CAUSE_APPROVED -> CLOSED, a different
          transition from the Adjustment posting instance. Depth 4 and again strictly serial: hop 1
          flips the status; hop 2 exists only because hop 1 made the row terminal, so the covering
          period moves 6633 cents out of unresolved_cents into vendor_shortage_cents; hop 3 exists
          only because hop 2 attributed the amount to VENDOR_SHORTAGE, so the vendor takes a
          shortage_event_count increment and a 1500 bps score penalty; hop 4 exists only because hop
          3 lowered the score, re-banding required_verification_sample_pct from 5 to 10 and thereby
          doubling required_sample_units on the next batch that vendor encodes.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1 fresh at 10000 bps / 5 percent; Item TEE-001 at 1234 cents with primary_vendor_id VEND1."
            - "One stock position at S100 for TEE-001 with opening on-hand 100 units."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000."
            - "A submitted count whose single line counts 105 against 100, opening one investigation worth 6633 cents which sits in unresolved_cents."
            - "That investigation is assigned, has VENDOR_SHORTAGE proposed and approved, and is therefore parked in CAUSE_APPROVED immediately before the trigger."
            - "A second TagBatch for VEND1 / TEE-001 / S100 with quantity_encoded 1000 is created in DRAFT before the trigger and left unencoded, so the hop-4 re-band can be observed by encoding it afterwards."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 105, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /inventory-integrity/variance-investigations"
              payload: { count_line_id: "${line_a}" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/assign"
              payload: { assigned_investigator_id: "u_analyst_1" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { inv_a_v: "$.data.version" }
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/propose-cause"
              payload: { proposed_root_cause: "VENDOR_SHORTAGE", evidence_note: "ASN overstated the shipped tag population", expected_investigation_version: "${inv_a_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/approve-cause"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch_next: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/close"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "before the trigger, GET /inventory-integrity/shrink-periods/${sp1}/attribution returns data.unresolved_cents == 6633 and data.vendor_shortage_cents == 0, and Vendor.${vendor1}.tag_compliance_score_bps == 10000 with required_verification_sample_pct == 5"
            - "HOP 1 — response data.status == \"CLOSED\""
            - "HOP 2 — GET /inventory-integrity/shrink-periods/${sp1}/attribution now returns data.vendor_shortage_cents == 6633, data.unresolved_cents == 0, data.total_attributable_variance_cents == 6633, data.provisional_total_shrink_cents == 6633 and data.final_total_shrink_cents == 6633"
            - "HOP 3 — Vendor.${vendor1}.shortage_event_count == 1 and tag_compliance_score_bps == 8500 (10000 - VENDOR_SHORTAGE_PENALTY_BPS 1500)"
            - "HOP 4 — Vendor.${vendor1}.required_verification_sample_pct == 10, and POST /inventory-integrity/tag-batches/${batch_next}/encode with scheme SGTIN_96 and prefix 0614141 freezes required_sample_units at 100, not the 50 it would have frozen before the close"
            - "StockPosition.${pos_tee1}.promising_state == \"RESTRICTED\" — the open-investigation restriction is gone but value_accuracy_pct 94.62 is still below min_accuracy_pct 97.00"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_referential_on_count_line_after_submit
        grounds:
          - validations.priority_40_ERR_COUNT_TASK_INVALID_STATE
          - validations.priority_62_ERR_ITEM_CATEGORY_MISMATCH
          - errors.ERR_COUNT_TASK_INVALID_STATE
          - errors.ERR_ITEM_CATEGORY_MISMATCH
        distinguishing_aspect: |
          Error-category pair: state (priority 40) versus business_referential (priority 62). One
          request violates both — the parent CountTask has already left IN_PROGRESS and the item
          belongs to a different category than the task — and the state error must win. The other two
          instances of this rule use the (business_safety, business_fiscal) and
          (business_constraint, business_temporal) pairs respectively.
        test_recipe:
          setup:
            - "Categories APPAREL and ELEC; Store S100 with reader_capability BOTH."
            - "Item TEE-001 in APPAREL at 1234 cents and Item TV-040 in ELEC at 40000 cents, both stocked at S100 so ERR_ITEM_NOT_STOCKED_AT_STORE (priority 63) cannot fire and muddy the pair."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
            - "An APPAREL count task at S100 with a single in-tolerance line (TEE-001 counted 101 against 100: 1 unit <= 2 and 1327 cents < 20000), submitted so the task sits in COUNTED and coverage was 1/1 = 100.00."
            - "The follow-up line request names TV-040 with read_mode_used HANDHELD, which the store supports, so priority 70 is satisfied and only 40 and 62 remain in conflict."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/categories"
              payload: { code: "ELEC", name: "Electronics", count_cadence_days: 14, variance_tolerance_units: 0, variance_tolerance_value_cents: 4000, min_accuracy_pct: 99.00, landed_cost_uplift_bps: 250, reader_mode_required: "HANDHELD", auto_correct_negative: false }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_elec: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_elec}", primary_vendor_id: "${vendor1}", sku: "TV-040", description: "40 inch panel", unit_cost_cents: 40000, retail_price_cents: 79999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tv: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tv}", baseline_on_hand_units: 30, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tv: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 101, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_ok: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tv}", counted_units: 30, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 409"
            - "response error.code == \"ERR_COUNT_TASK_INVALID_STATE\""
            - "response error.code != \"ERR_ITEM_CATEGORY_MISMATCH\" — priority 40 outranks priority 62"
            - "CountLine.${line_ok}.within_tolerance == true and no CountLine was created for ${item_tv}"
            - "CountTask.${task1}.counted_line_count is still 1 and status is still \"COUNTED\""

      - name: sod_beats_supervisor_cap_on_adjustment_approve
        grounds:
          - validations.priority_50_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_100_ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP
          - global_constants.SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS
        distinguishing_aspect: |
          Error-category pair: business_safety (priority 50) versus business_fiscal (priority 100).
          One approve request violates both — the acting X-User-ID is the very user who requested the
          adjustment, AND the 800000-cent impact exceeds SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS 500000
          so only a ShrinkController could approve it. The self-approval error must win. A different
          category pair from both the (state, business_referential) and
          (business_constraint, business_temporal) instances.
        test_recipe:
          setup:
            - "Category ELEC with variance_tolerance_value_cents 4000; Store S100; Vendor VEND1; Item TV-040 at 40000 cents."
            - "A stock position at S100 for TV-040 with opening on-hand 100 units."
            - "An adjustment of -20 units requested BY u_super_1 acting as InventorySupervisor (a role permitted to create adjustments): value_impact 20 * 40000 = 800000 against a threshold of max(1000, floor(max(5000, min(4000, 100000)) * 1.0 * 1.0)) = 5000, so it is created PENDING."
            - "800000 > 500000, so the fiscal cap rule is armed at priority 100 while the self-approval rule is armed at priority 50."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "ELEC", name: "Electronics", count_cadence_days: 14, variance_tolerance_units: 0, variance_tolerance_value_cents: 4000, min_accuracy_pct: 99.00, landed_cost_uplift_bps: 250, reader_mode_required: "HANDHELD", auto_correct_negative: false }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_elec: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_elec}", primary_vendor_id: "${vendor1}", sku: "TV-040", description: "40 inch panel", unit_cost_cents: 40000, retail_price_cents: 79999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tv: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tv}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tv: "$.data.id" }
            - call: "GET /inventory-integrity/stock-positions/${pos_tv}"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { pos_v: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions/${pos_tv}/adjustments"
              payload: { delta_units: -20, reason_code: "COUNT_VARIANCE", expected_stock_position_version: "${pos_v}" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { adj_big: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/adjustments/${adj_big}/approve"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "at creation, Adjustment.${adj_big}.value_impact_cents == 800000, authority_threshold_cents == 5000, approval_state == \"PENDING\" and requested_by_user_id == \"u_super_1\""
            - "response status 403"
            - "response error.code == \"ERR_SEGREGATION_OF_DUTIES\""
            - "response error.code != \"ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP\" — priority 50 outranks priority 100"
            - "Adjustment.${adj_big}.approval_state is still \"PENDING\" and approved_by_user_id is still null"
            - "the same approve issued by u_super_2 as InventorySupervisor then returns ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP (403), proving the lower-priority rule was merely masked; only u_ctrl_1 as ShrinkController succeeds"

      - name: reader_mode_beats_window_not_due_on_count_task_create
        grounds:
          - validations.priority_70_ERR_READER_MODE_UNSUPPORTED
          - validations.priority_90_ERR_COUNT_WINDOW_NOT_DUE
          - errors.ERR_READER_MODE_UNSUPPORTED
          - errors.ERR_COUNT_WINDOW_NOT_DUE
          - entities.Store.fields.reader_capability
        distinguishing_aspect: |
          Error-category pair: business_constraint (priority 70) versus business_temporal
          (priority 90). One create request violates both — OVERHEAD is not supported by a
          HANDHELD_ONLY store, and the requested window opens 2026-08-01, a month before the
          schedule's next_due_date of 2026-09-01. The reader-capability error must win. A third
          distinct category pair, unlike (state, business_referential) and
          (business_safety, business_fiscal).
        test_recipe:
          setup:
            - "Category APPAREL with reader_mode_required EITHER, so the schedule itself is legal with HANDHELD."
            - "Store S200 with reader_capability HANDHELD_ONLY and overhead_reader_capacity 0."
            - "An ACTIVE CountSchedule for (S200, APPAREL) with reader_mode HANDHELD, first_due_date 2026-09-01 and cadence_days 30, so next_due_date is 2026-09-01."
            - "No other count task exists at that store, so neither ERR_COUNT_WINDOW_OVERLAP (72) nor ERR_OVERHEAD_READER_CAPACITY_EXCEEDED (73) can fire and steal the conflict."
            - "The request asks for reader_mode OVERHEAD over the window 2026-08-01T00:00:00Z..2026-08-03T00:00:00Z, which is a well-formed interval so priority 91 is satisfied."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S200", name: "Store 200", reader_capability: "HANDHELD_ONLY", overhead_reader_capacity: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s200: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s200}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-09-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched2: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched2}", reader_mode: "OVERHEAD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 422"
            - "response error.code == \"ERR_READER_MODE_UNSUPPORTED\""
            - "response error.code != \"ERR_COUNT_WINDOW_NOT_DUE\" — priority 70 outranks priority 90"
            - "no CountTask row was created for ${sched2}; GET /inventory-integrity/count-tasks?count_schedule_id=${sched2} returns an empty data list with total_count 0"
            - "re-issuing the same request with reader_mode HANDHELD then returns ERR_COUNT_WINDOW_NOT_DUE (422), proving the temporal rule was merely masked"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: variance_value_exactly_at_tolerance_opens_investigation
        grounds:
          - calculations.count_variance_valuation
          - entities.CountLine.fields.within_tolerance
          - entities.Category.fields.variance_tolerance_value_cents
          - state_machines.CountTask.IN_PROGRESS_to_COUNTED
        distinguishing_aspect: |
          Metric: variance_value_cents measured against Category.variance_tolerance_value_cents, at
          exact equality. The comparison is a strict `<`, so 6000 == 6000 is OUT of tolerance and an
          investigation opens. Probed through POST /count-tasks/{count_task_id}/submit. The other two
          instances of this rule probe entirely different metrics (a signed delta_units zero point,
          and the empty-population accuracy index) through different endpoints.
        test_recipe:
          setup:
            - "Category HOME with variance_tolerance_units 5, variance_tolerance_value_cents 6000 and landed_cost_uplift_bps 0, so the value metric is exactly units * unit_cost with no rounding noise."
            - "Store S100; Vendor VEND1; Item PAN-01 in HOME at 1500 cents."
            - "One stock position at S100 for PAN-01 with opening on-hand 100 units — the only HOME position, so coverage will be 1/1 = 100.00."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
            - "A started HOME count task with one HANDHELD line counting 104 against 100: variance 4 units (within the 5-unit sub-test) valued exactly 4 * 1500 = 6000 cents, which sits precisely ON the value tolerance."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "HOME", name: "Home", count_cadence_days: 30, variance_tolerance_units: 5, variance_tolerance_value_cents: 6000, min_accuracy_pct: 95.00, landed_cost_uplift_bps: 0, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_home: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_home}", primary_vendor_id: "${vendor1}", sku: "PAN-01", description: "Saute pan", unit_cost_cents: 1500, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_pan: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_pan}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_pan: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_home}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched_home: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched_home}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task_home: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task_home}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task_home}/lines"
              payload: { item_id: "${item_pan}", counted_units: 104, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_pan: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task_home}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "CountLine.${line_pan}.variance_units == 4 and variance_value_cents == 6000"
            - "CountLine.${line_pan}.within_tolerance == false — 6000 < 6000 is false, so exact equality is OUT of tolerance"
            - "response status 200 and data.status == \"COUNTED\" and data.variance_line_count == 1 and data.total_variance_value_cents == 6000"
            - "exactly one VarianceInvestigation exists for ${line_pan}, in status OPEN with variance_value_cents 6000"
            - "GET /inventory-integrity/shrink-periods/${sp1}/attribution returns data.unresolved_cents == 6000"
            - "BOUNDARY-1 — the same fixture with counted_units 103 gives variance_value_cents 4500, within_tolerance true, variance_line_count 0 and NO investigation"
            - "BOUNDARY+1 — the same fixture with counted_units 105 gives variance_units 5 and variance_value_cents 7500, within_tolerance false, and one investigation"

      - name: zero_delta_units_rejected_on_adjustment_create
        grounds:
          - validations.priority_78_ERR_ZERO_DELTA_UNITS
          - entities.Adjustment.fields.delta_units
          - errors.ERR_ZERO_DELTA_UNITS
          - endpoints.POST_/inventory-integrity/stock-positions/{stock_position_id}/adjustments
        distinguishing_aspect: |
          Metric: the signed delta_units magnitude at its zero point — a different metric from the
          value-tolerance comparison and from the accuracy index. Zero is the only rejected value and
          it is rejected symmetrically: -1 and +1 both succeed, so the boundary is a single excluded
          point rather than a one-sided cutoff. Probed through
          POST /inventory-integrity/stock-positions/{stock_position_id}/adjustments, a distinct
          endpoint from the count submit and the store eligibility read.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1; Item TEE-001 at 1234 cents."
            - "One stock position at S100 for TEE-001 with opening on-hand 100 units."
            - "The position version is read immediately before the trigger so the OCC input is fresh and priority 30 cannot pre-empt priority 78."
            - "No investigation is linked, so the adjustment would otherwise be a perfectly legal NOT_REQUIRED row."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "GET /inventory-integrity/stock-positions/${pos_tee1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { pos_v: "$.data.version" }
          trigger:
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: 0, reason_code: "COUNT_VARIANCE", expected_stock_position_version: "${pos_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 422"
            - "response error.code == \"ERR_ZERO_DELTA_UNITS\""
            - "no Adjustment row was created; GET /inventory-integrity/adjustments?stock_position_id=${pos_tee1} returns total_count 0"
            - "StockPosition.${pos_tee1}.version is unchanged by the rejected request, so ${pos_v} is still current"
            - "BOUNDARY-1 — the same request with delta_units -1 returns 201 with value_impact_cents 1234 and approval_state \"NOT_REQUIRED\""
            - "BOUNDARY+1 — the same request with delta_units 1 (against the version refreshed after the -1 create) also returns 201 with value_impact_cents 1234"

      - name: empty_store_reads_ten_thousand_bps_and_eligible
        grounds:
          - calculations.store_fulfillment_posture
          - endpoints.GET_/inventory-integrity/stores/{store_id}/fulfillment-eligibility
          - entities.Store.fields.accuracy_index_bps
          - entities.Store.fields.fulfillment_status
        distinguishing_aspect: |
          Metric: accuracy_index_bps over an EMPTY position population — the degenerate boundary of
          the aggregate, where a naive implementation divides by zero. The pinned answer is the
          vacuous 10000 bps with ELIGIBLE, and the very first position created flips the reading, so
          the boundary is the transition from cardinality 0 to cardinality 1. A different metric from
          the value tolerance and the delta zero point, probed through the distinct endpoint
          GET /inventory-integrity/stores/{store_id}/fulfillment-eligibility.
        test_recipe:
          setup:
            - "Category APPAREL and Vendor VEND1 exist so that a position CAN be created later, but none is created before the trigger."
            - "Store S200 is registered with reader_capability HANDHELD_ONLY and holds exactly zero StockPosition rows."
            - "No count, adjustment, tag batch or investigation touches S200, so every aggregate input is an empty set."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S200", name: "Store 200", reader_capability: "HANDHELD_ONLY", overhead_reader_capacity: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s200: "$.data.id" }
          trigger:
            - call: "GET /inventory-integrity/stores/${store_s200}/fulfillment-eligibility"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 200"
            - "response data.total_position_count == 0"
            - "response data.accuracy_index_bps == 10000 — the empty-set rule, not 0 and not a division error"
            - "response data.blocked_position_count == 0 and data.restricted_position_count == 0"
            - "response data.blocked_ratio_bps == 0 and data.restricted_ratio_bps == 0"
            - "response data.fulfillment_status == \"ELIGIBLE\""
            - "Store.${store_s200}.accuracy_index_bps == 10000 and fulfillment_status == \"ELIGIBLE\""
            - "BOUNDARY+1 — creating one position at S200 for TEE-001 with baseline_on_hand_units 10 keeps accuracy_index_bps at 10000 (an uncounted position defaults to unit_accuracy_pct 100.00) but total_position_count becomes 1, so the aggregate has left the empty-set branch"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: adjustment_post_requires_investigation_closed
        grounds:
          - state_machines.Adjustment.UNPOSTED_to_POSTED
          - validations.priority_60_ERR_INVESTIGATION_NOT_CLOSED
          - entities.VarianceInvestigation.fields.status
          - errors.ERR_INVESTIGATION_NOT_CLOSED
        distinguishing_aspect: |
          Entity pair: Adjustment depends on VarianceInvestigation. The Adjustment itself is perfectly
          eligible on its own terms — posting_state UNPOSTED, approval_state NOT_REQUIRED,
          tag_integrity_hold false — yet posting is refused purely because the OTHER entity is in
          CAUSE_APPROVED rather than CLOSED. Note that CAUSE_APPROVED is deliberately not good enough:
          the guard reads exactly one terminal status. The other instance of this rule uses the
          PhysicalInventory / ShrinkPeriod pair.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1; Item TEE-001 at 1234 cents."
            - "One stock position at S100 for TEE-001 with opening on-hand 100 units."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
            - "A submitted count whose single line counts 105 against 100, opening one investigation worth 6633 cents."
            - "The investigation is assigned, has THEFT proposed and approved, and is left parked in CAUSE_APPROVED — deliberately NOT closed."
            - "An adjustment of -5 units is created against the position linked to that investigation: value_impact 6170, threshold max(1000, floor(20000 * 0.5 * 1.0)) = 10000 because the linked investigation is not CLOSED so the THEFT strictness does NOT apply, giving approval_state NOT_REQUIRED."
