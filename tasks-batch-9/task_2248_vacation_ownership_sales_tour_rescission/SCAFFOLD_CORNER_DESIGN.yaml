      - name: automatic_retraining_assignment_from_rate_threshold
        excluded_because:
          difficulty_instance: rescission_validation_cascades_to_retraining_and_gallery_restriction
          rationale: "That 1.8 instance already asserts the automatic CANCELLATION_RATE_BREACH assignment with cancellation_rate_at_assignment 0.5000 and cycle_index 1 as link 3 of the cascade."

