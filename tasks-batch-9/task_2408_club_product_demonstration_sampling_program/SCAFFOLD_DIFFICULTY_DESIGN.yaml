  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: revoking_approval_returns_the_club_week_case_pool_to_its_exact_prior_total
        grounds:
          - state_machines.DemoEvent.transitions.CONFIRMED_to_SUBMITTED
          - calculations.sample_allocation_waterfall
          - entities.DemoEvent.fields.pool_cases_used
          - entities.DemoEvent.fields.allocated_sample_cases
          - validations[priority=42]
          - errors[ERR_SAMPLE_POOL_EXHAUSTED]
        distinguishing_aspect: |
          REVOKE_APPROVAL is a compensating action on the club-week case pool:
          E1's approval consumes 6 of the product's 10 weekly cases, the
          revocation must release exactly those 6 (pool_remaining back to 10,
          E1.pool_cases_used and allocated_sample_cases back to 0, approved_at
          back to null), and a later event must then be able to draw the whole
          10. Conservation is proven from the other side too: re-approving E1
          afterwards computes bucket1_capacity 0 and fails with
          ERR_SAMPLE_POOL_EXHAUSTED rather than over-issuing cases 11 through
          16. A revocation that merely resets the event's own field without
          removing it from the allocation scope, or that credits the pool twice,
          fails one of these two directions.
        test_recipe:
          setup:
            - "STANDARD manufacturer M — deliberately not PLATINUM — so bucket2_capacity is 0 and the emergency reserve can never mask a pool arithmetic error."
            - "NON_FOOD product P with weekly_sample_case_pool 10 and emergency_reserve_cases 5."
            - "Club C with daily_event_capacity 3, so no capacity rule interferes."
            - "DemoEvent E1 on 2026-09-14 (a Monday, hence the ISO week start) requested_sample_cases 6, approved so pool_cases_used is 6 and pool_remaining is 4."
            - "DemoEvent E2 on 2026-09-16, the same ISO week and the same product and club, requested_sample_cases 10, left SUBMITTED until the trigger."
            - "No SampleShipment exists on E1, which is what makes REVOKE_APPROVAL legal."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Corbell Home Supply", billing_email: "ap@corbell.example", program_tier: "STANDARD", credit_limit_cents: 4000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5718", name: "Corbell Club 5718", region_code: "SW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "CB-BRM-718", name: "Silicone Broom Head", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1600, samples_per_case: 4, weekly_sample_case_pool: 10, emergency_reserve_cases: 5 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 6, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e1_id: "$.data.id" }
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { e1_alloc: "$.data.allocated_sample_cases", e1_pool_used: "$.data.pool_cases_used", e1_reserve_used: "$.data.reserve_cases_used" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-16", day_part: "MIDDAY", requested_sample_cases: 10, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e2_id: "$.data.id" }
            - call: "POST /demo-events/${e2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /clubs/${club_id}/capacity?event_date=2026-09-14&product_id=${product_id}"
              payload: { event_date: "2026-09-14", product_id: "${product_id}" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { pool_before: "$.data.pool_remaining", used_before: "$.data.pool_cases_used", week_start: "$.data.week_start_date" }
          trigger:
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "REVOKE_APPROVAL", reason: "manufacturer deferred the date" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { e1_state_after: "$.data.booking_status", e1_alloc_after: "$.data.allocated_sample_cases" }
            - call: "GET /clubs/${club_id}/capacity?event_date=2026-09-14&product_id=${product_id}"
              payload: { event_date: "2026-09-14", product_id: "${product_id}" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { pool_restored: "$.data.pool_remaining", used_restored: "$.data.pool_cases_used" }
            - call: "POST /demo-events/${e2_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { e2_alloc: "$.data.allocated_sample_cases" }
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { err_reapprove: "$.data.error_id" }
          assert:
            - "${week_start} == 2026-09-14"
            - "${e1_alloc} == 6"
            - "${e1_pool_used} == 6"
            - "${e1_reserve_used} == 0"
            - "${pool_before} == 4"
            - "${used_before} == 6"
            - "${e1_state_after} == SUBMITTED"
            - "${e1_alloc_after} == 0"
            - "DemoEvent.${e1_id}.pool_cases_used == 0"
            - "DemoEvent.${e1_id}.approved_at == null"
            - "${pool_restored} == 10"
            - "${used_restored} == 0"
            - "${e2_alloc} == 10"
            - "DemoEvent.${e2_id}.pool_cases_used == 10"
            - "${err_reapprove} == ERR_SAMPLE_POOL_EXHAUSTED"
            - "the re-approval responds with HTTP 409"
            - "DemoEvent.${e1_id}.booking_status == SUBMITTED"
            - "DemoEvent.${e1_id}.allocated_sample_cases == 0"

      - name: voiding_an_issued_invoice_returns_the_receivable_to_zero_and_clears_the_hold
        grounds:
          - state_machines.EventInvoice.transitions.ISSUED_to_VOID
          - calculations.manufacturer_receivable_rollup
          - calculations.event_invoice_total
          - entities.Manufacturer.fields.outstanding_balance_cents
          - entities.DemoEvent.fields.settlement_status
        distinguishing_aspect: |
          VOID is the exact inverse of ISSUE across three entities at once. The
          49790-cent invoice pushes outstanding_balance_cents from 0 to 49790,
          which exceeds credit_limit_cents 40000 and forces account_status
          ACTIVE -> HOLD; voiding must return the receivable to exactly 0 (not
          to a rounded-down remainder, and not to a negative figure from
          double-subtraction), flip HOLD -> ACTIVE, blank issued_by_user_id and
          issued_at, and walk the event's settlement_status back from INVOICED
          to UNBILLED. Because the rollup is defined as a sum over ISSUED
          invoices rather than an incrementing counter, the money domain here
          contrasts with the case-count domain of the pool instance: the
          invariant is integer-exact rather than merely non-negative.
        test_recipe:
          setup:
            - "Manufacturer M program_tier GOLD with credit_limit_cents 40000, chosen below the eventual invoice total so ISSUE trips the hold."
            - "Club C club_tier FLAGSHIP; NON_FOOD product P (category APPAREL, samples_per_case 4)."
            - "DemoEvent E on 2026-09-14 AFTERNOON (shift 14:15Z-20:15Z), requested_sample_cases 3, no add-ons, CONFIRMED."
            - "3 cases shipped and received in full; reconciliation 12 + 0 + 0 against units_delivered 12 so recon_status is BALANCED and cases_delivered is 3."
            - "One LEAD demonstrator at hourly_rate_cents 2200 checks in at 14:15Z exactly on time and out at 18:45Z for billable_hours 4.50; event CLOSED_OUT."
            - "Invoice: BASE 36750 (28000 x FLAGSHIP 1.25 x AFTERNOON 1.05) + STAFFING 11880 (4.50 x 2200 x LEAD 1.2) + HANDLING 2700 (3 x 900, no cold-chain line on a NON_FOOD_DEMO) = subtotal 51330; GOLD 0.03 with monthly_completed_event_count 1 gives volume_discount_pct 0.03 and discount_cents 1540; total_due_cents 49790."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Ashgrove Outfitters", billing_email: "ap@ashgrove.example", program_tier: "GOLD", credit_limit_cents: 40000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-5819", name: "Ashgrove Club 5819", region_code: "NE", club_tier: "FLAGSHIP", daily_event_capacity: 4, food_station_count: 2, health_permit_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "AO-VST-819", name: "Packable Down Vest", category: "APPAREL", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 5200, samples_per_case: 4, weekly_sample_case_pool: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Signe Halloran", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "AFTERNOON", requested_sample_cases: 3, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/sample-shipments"
              payload: { cases_shipped: 3, carrier_reference: "TRK-77819" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { shipment_id: "$.data.id" }
            - call: "POST /sample-shipments/${shipment_id}/receive"
              payload: { cases_received: 3 }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/assignments"
              payload: { demonstrator_id: "${dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { asg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T19:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /event-assignments/${asg_id}/transitions"
              payload: { action: "CONFIRM" }
              as: Demonstrator
              as_user_id: "${dem_id}"
            - call: "POST /event-assignments/${asg_id}/transitions"
              payload: { action: "CHECK_IN", occurred_at_utc: "2026-09-14T14:15:00Z" }
              as: Demonstrator
              as_user_id: "${dem_id}"
            - call: "POST /event-assignments/${asg_id}/transitions"
              payload: { action: "CHECK_OUT", occurred_at_utc: "2026-09-14T18:45:00Z" }
              as: Demonstrator
              as_user_id: "${dem_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "CLOSE_OUT" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/sample-reconciliation"
              payload: { units_sampled: 12, units_wasted: 0, units_returned: 0 }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { recon_id: "$.data.id" }
            - call: "GET /demo-events/${event_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { ev_v: "$.data.version" }
            - call: "POST /demo-events/${event_id}/invoice"
              payload: { expected_demo_event_version: "${ev_v}" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { inv_id: "$.data.id", inv_subtotal: "$.data.subtotal_cents", inv_discount: "$.data.discount_cents", inv_total: "$.data.total_due_cents" }
            - call: "GET /manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { outstanding_before: "$.data.outstanding_balance_cents", status_before: "$.data.account_status" }
          trigger:
            - call: "POST /event-invoices/${inv_id}/transitions"
              payload: { action: "ISSUE" }
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { issued_state: "$.data.invoice_status" }
            - call: "GET /manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { outstanding_issued: "$.data.outstanding_balance_cents", status_issued: "$.data.account_status" }
            - call: "POST /event-invoices/${inv_id}/transitions"
              payload: { action: "VOID" }
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { void_state: "$.data.invoice_status" }
            - call: "GET /manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { outstanding_voided: "$.data.outstanding_balance_cents", status_voided: "$.data.account_status" }
          assert:
            - "EventAssignment.${asg_id}.billable_hours == 4.50"
            - "EventAssignment.${asg_id}.late_check_in == false"
            - "SampleReconciliation.${recon_id}.recon_status == BALANCED"
            - "${inv_subtotal} == 51330"
            - "${inv_discount} == 1540"
            - "${inv_total} == 49790"
            - "EventInvoice.${inv_id}.line_items has exactly 3 entries"
            - "${outstanding_before} == 0"
            - "${status_before} == ACTIVE"
            - "${issued_state} == ISSUED"
            - "${outstanding_issued} == 49790"
            - "${status_issued} == HOLD"
            - "${void_state} == VOID"
            - "${outstanding_voided} == 0"
            - "${outstanding_voided} == ${outstanding_before}"
            - "${status_voided} == ACTIVE"
            - "EventInvoice.${inv_id}.issued_by_user_id == null"
            - "EventInvoice.${inv_id}.issued_at == null"
            - "EventInvoice.${inv_id}.total_due_cents == 49790"
            - "DemoEvent.${event_id}.settlement_status == UNBILLED"
