scaffold_corner_design:
  - section: entities
    instances:
      - name: create_tract_happy_and_defaults
        claim_type: creation_defaults
        grounds: [entities.ForestTract, response_envelope]
        distinguishing_aspect: "Tract creation returns 201 with server id, status defaulting to OPEN, version 1, null enrollment fields, and the success envelope carries meta.api_request_id."
        test_recipe:
          setup: ["Registry parties exist"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
          assert:
            - "response envelope has meta.api_request_id and response_type == object"
            - "ForestTract.${tr_id}.status == OPEN, version == 1, conservation_enrollment_start is null"

      - name: create_party_registry_entities
        claim_type: creation
        grounds: [entities.Forester, entities.Landowner, entities.Buyer, entities.Contractor]
        distinguishing_aspect: "All four registry parties are creatable via PlatformAdmin; Buyer.prior_defaults defaults to 0 when omitted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/buyers", payload: { company_name: "Blue Mill", license_no: "B-100" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
          assert:
            - "Forester.${f_id}.license_no == F-100"
            - "Buyer.${b_id}.prior_defaults == 0"

      - name: create_tract_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ForestTract.fields.landowner_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required landowner_id on tract create returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["forester registered"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: create_prescription_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.HarvestPrescription.fields.silvicultural_method, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "silvicultural_method outside the declared enum is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["tract + stand exist"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/prescriptions", payload: { stand_id: "${st_id}", cruise_id: "${cr_id}", silvicultural_method: "CLEARCUTT", window_start: "2026-06-01", window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: create_stand_extra_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Unknown request fields (e.g. bogus_field) are rejected with 400 ERR_INVALID_REQUEST rather than silently ignored."
        test_recipe:
          setup: ["tract exists"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE", bogus_field: 1 }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_sale_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SALE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent sale id returns 404 ERR_SALE_NOT_FOUND."
        test_recipe:
          setup: ["forester registered"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "GET /forestry/sales/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_SALE_NOT_FOUND"

      - name: create_tract_with_bad_party_reference_returns_party_not_found
        claim_type: parent_relationships
        grounds: [entities.ForestTract.fields.landowner_id, "errors[ERR_PARTY_NOT_FOUND]"]
        distinguishing_aspect: "Tract create referencing a nonexistent landowner returns 404 ERR_PARTY_NOT_FOUND (existence precedes business checks)."
        test_recipe:
          setup: ["forester registered"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_PARTY_NOT_FOUND"

  - section: endpoints
    instances:
      - name: sales_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /forestry/sales with three sales and limit=2 returns exactly 2 rows with total_count 3 and has_more true; default limit is 10 when omitted."
        test_recipe:
          setup: ["forester/landowner/tract/stand; CERTIFIED cruise; APPROVED prescription; three sales created"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 }, { plot_number: 2, species: "PINE", volume_bf: 1285 }, { plot_number: 3, species: "PINE", volume_bf: 1165 }, { plot_number: 4, species: "PINE", volume_bf: 1285 }, { plot_number: 5, species: "PINE", volume_bf: 1165 }, { plot_number: 6, species: "PINE", volume_bf: 1285 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${cr_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5, 6] }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/prescriptions", payload: { stand_id: "${st_id}", cruise_id: "${cr_id}", silvicultural_method: "CLEARCUT", window_start: "2026-06-01", window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { pr_id: "$.data.id" } }
            - { call: "POST /forestry/prescriptions/${pr_id}/propose", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/prescriptions/${pr_id}/approve", payload: {}, as: Landowner, as_user_id: "${lo_id}" }
            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr_id}", sale_type: "LUMP_SUM", scaling_rule: "DOYLE", advertised_minimum_cents: 7000000, bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-06-01", harvest_window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr_id}", sale_type: "LUMP_SUM", scaling_rule: "DOYLE", advertised_minimum_cents: 7100000, bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-06-01", harvest_window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr_id}", sale_type: "LUMP_SUM", scaling_rule: "DOYLE", advertised_minimum_cents: 7200000, bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-06-01", harvest_window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}" }
          trigger:
            - { call: "GET /forestry/sales?limit=2", payload: {}, as: Forester, as_user_id: "${f_id}" }
          assert:
            - "response data array length == 2, total_count == 3, has_more == true"
            - "GET /forestry/sales without params returns all 3 under default limit 10"

      - name: bids_filtered_list_by_sale
        claim_type: listing
        grounds: [entities.Bid.fields.sale_id, "endpoints[GET /bids]"]
        distinguishing_aspect: "GET /forestry/bids?sale_id=X returns only bids of that sale (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["two OFFERED sales, one with one bid"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/buyers", payload: { company_name: "Blue Mill", license_no: "B-100" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 }, { plot_number: 2, species: "PINE", volume_bf: 1285 }, { plot_number: 3, species: "PINE", volume_bf: 1165 }, { plot_number: 4, species: "PINE", volume_bf: 1285 }, { plot_number: 5, species: "PINE", volume_bf: 1165 }, { plot_number: 6, species: "PINE", volume_bf: 1285 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${cr_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5, 6] }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/prescriptions", payload: { stand_id: "${st_id}", cruise_id: "${cr_id}", silvicultural_method: "CLEARCUT", window_start: "2026-06-01", window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { pr_id: "$.data.id" } }
            - { call: "POST /forestry/prescriptions/${pr_id}/propose", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/prescriptions/${pr_id}/approve", payload: {}, as: Landowner, as_user_id: "${lo_id}" }
            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr_id}", sale_type: "LUMP_SUM", scaling_rule: "DOYLE", advertised_minimum_cents: 7000000, bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-06-01", harvest_window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { sa1_id: "$.data.id" } }
            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr_id}", sale_type: "LUMP_SUM", scaling_rule: "DOYLE", advertised_minimum_cents: 7100000, bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-06-01", harvest_window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { sa2_id: "$.data.id" } }
            - { call: "POST /forestry/sales/${sa1_id}/offer", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/sales/${sa1_id}/open-bidding", payload: {}, as: Forester, as_user_id: "${f_id}", captures: { sa1_v: "$.data.version" } }
            - { call: "POST /forestry/sales/${sa1_id}/bids", payload: { expected_sale_version: "${sa1_v}", deposit_cents: 100000, lump_sum_amount_cents: 8000000 }, as: Buyer, as_user_id: "${b_id}", captures: { bid1_id: "$.data.id" } }
          trigger:
            - { call: "GET /forestry/bids?sale_id=${sa1_id}", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "GET /forestry/bids?sale_id=${sa2_id}", payload: {}, as: Forester, as_user_id: "${f_id}" }
          assert:
            - "GET /forestry/bids?sale_id=${sa1_id} returns exactly [${bid1_id}]"
            - "GET /forestry/bids?sale_id=${sa2_id} returns empty array with total_count 0"
  - section: state_machines
    instances:
      - name: cruise_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.InventoryCruise]
        distinguishing_aspect: "A newly created cruise starts in DRAFT with null certified_volume_bf and null sampling_error_pct."
        test_recipe:
          setup: ["tract + stand"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
          assert:
            - "InventoryCruise.${cr_id}.status == DRAFT and certified_volume_bf is null and n_plots == 1"

      - name: certify_from_draft_returns_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.InventoryCruise, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "certify from DRAFT (skipping finalize-tally/reconcile) is rejected with ERR_INVALID_TRANSITION."
        test_recipe:
          setup: ["cruise in DRAFT"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/cruises/${cr_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_TRANSITION"

      - name: cancel_cancelled_sale_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TimberSale, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A CANCELLED sale is terminal: a second cancel returns ERR_ALREADY_TERMINAL and no side effects fire."
        test_recipe:
          setup: ["sale DRAFT then cancelled"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
            - { call: "POST /forestry/prescriptions", payload: { stand_id: "${st_id}", cruise_id: "${cr_id}", silvicultural_method: "CLEARCUT", window_start: "2026-06-01", window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { pr_id: "$.data.id" } }
