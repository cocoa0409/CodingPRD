            - call: "POST /nature-center/bookings"
              payload: { school_id: "${school_id}", offering_id: "${off_id}", start_utc: "2026-09-29T14:00:00Z", end_utc: "2026-09-29T16:00:00Z", student_count: 30, chaperone_count: 3 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { bk_id: $.data.id, bk_ver: $.data.version }
            - call: "POST /nature-center/bookings/${bk_id}/assign-resources"
              payload: { expected_booking_version: "${bk_ver}", lead_educator_id: "${edu_id}", trail_segment_id: "${trail_id}", animal_id: "${an_id}" }
              as: BookingCoordinator
              as_user_id: "bc-01"
          trigger:
            - call: "POST /nature-center/bookings/${bk_id}/confirm"
              payload: {}
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { st: $.data.delivery_status, req: $.data.required_chaperones }
            - call: "GET /nature-center/trail-segments/${trail_id}"
              payload: {}
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { wk: $.data.visitors_this_week, tcap: $.data.capacity_persons }
            - call: "GET /nature-center/animals/${an_id}"
              payload: {}
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { proj: $.data.projected_exposure_minutes_7d, post: $.data.welfare_posture }
            - call: "GET /nature-center/educators/${edu_id}"
              payload: {}
              as: EducationDirector
              as_user_id: "ed-01"
              captures: { load: $.data.delivery_load_minutes_this_week }
          assert:
            - "${st} == CONFIRMED"
            - "${req} == 3"
            - "${wk} == 33"
            - "${tcap} == 33"
            - "${proj} == 120"
            - "${post} == OPEN"
            - "${load} == 120"
            - "Booking.${bk_id}.chaperone_count == 3"
      - name: confirm_rejects_a_booking_below_the_chaperone_ratio
        claim_type: Violation → Error
        grounds:
          - validations.priority_26
          - errors.ERR_CHAPERONE_RATIO_UNMET
        excluded_because:
          difficulty_instance: confirm_chaperone_safety_beats_trail_weekly_budget_constraint
          rationale: |
            That difficulty instance already confirms a booking whose chaperone count is one adult
            short and asserts ERR_CHAPERONE_RATIO_UNMET together with the untouched trail counters,
            which is strictly stronger than the bare confirm-time rejection this row would test. The
            delivery-time half of priority 26 is genuinely different and is covered separately by
            deliver_recomputes_the_chaperone_ratio_against_the_actual_head_count.
      - name: aid_create_against_a_frozen_fund_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_18
          - errors.ERR_FUND_NOT_OPEN
        excluded_because:
          difficulty_instance: aid_create_fund_state_beats_fund_insufficient_fiscal
          rationale: |
            The cited instance files an over-budget request against a FROZEN fund and pins
            ERR_FUND_NOT_OPEN as the winner over the 402 that a fiscal-first implementation would
            return, so it exercises this rule and its priority in one recipe. A plain frozen-fund
            rejection adds no distinguishing power.
      - name: confirm_at_the_animal_weekly_exposure_cap_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_27
          - errors.ERR_ANIMAL_WELFARE_CAP_REACHED
        excluded_because:
          difficulty_instance: animal_welfare_cap_rejects_at_exactly_the_weekly_ceiling
          rationale: |
            The cited instance already drives projected exposure to the exact minute at which
            projected + duration equals the cap and asserts the rejection there, which is the only
            interesting point of this rule; a mid-range violation would be satisfied by a looser
            comparison than the specification allows.
      - name: assignment_beyond_the_weekly_load_cap_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_48
          - errors.ERR_EDUCATOR_WEEKLY_LOAD_EXCEEDED
        excluded_because:
          difficulty_instance: educator_weekly_load_allowed_at_exactly_the_seasonal_cap
          rationale: |
            The cited instance walks a seasonal educator to exactly the 360-minute cap, accepts that
            assignment, and then rejects the next one — so both sides of the strictly-greater-than
            comparison and the per-employment-type constant are already asserted in one recipe.
      - name: booking_create_for_a_suspended_school_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_17
          - errors.ERR_SCHOOL_SUSPENDED
        excluded_because:
          difficulty_instance: booking_create_blocked_when_school_partner_is_suspended
          rationale: |
            The cited instance reaches SUSPENDED through two recorded no-shows, so it proves the
            derivation of the standing as well as the refusal that follows; asserting the refusal
            against a hand-set status would test strictly less.
      - name: assignment_with_an_expired_curriculum_certification_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_23
          - errors.ERR_EDUCATOR_NOT_CERTIFIED_FOR_GRADE_BAND
        excluded_because:
          difficulty_instance: assign_resources_blocked_when_curriculum_training_lapsed_into_expiry
          rationale: |
            The cited instance advances the logical clock past the 365-day validity window so the
            passing record lapses lazily inside the assignment, which covers this rule plus the lazy
            expiry it depends on. A never-certified educator would be caught by the same code
            without exercising the expiry path.
      - name: confirm_beyond_the_trail_capacity_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_46
          - errors.ERR_TRAIL_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: trail_half_open_occupancy_allows_exact_adjacency_but_aggregate_capacity_rejects
          rationale: |
            The cited instance admits a booking that starts exactly when the recovery buffer of
            another ends and rejects the aggregate that overflows the same trail, so both the
            half-open interval convention and this rule are pinned together.
      - name: assigning_an_educator_to_a_touching_window_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_31
          - errors.ERR_EDUCATOR_TIME_CONFLICT
        excluded_because:
          difficulty_instance: educator_closed_buffered_interval_rejects_touching_endpoints
          rationale: |
            The cited instance places the candidate booking exactly one buffer width away and shows
            the closed interval still rejects it, which subsumes any grosser overlap this row would
            assert; the animal variant with its open interval is covered separately by
            assigning_an_animal_inside_an_occupied_window_is_rejected.

  - section: endpoints
    instances:
      - name: school_and_educator_creates_read_back_through_their_own_get
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST /nature-center/schools
          - endpoints.GET /nature-center/schools/{id}
          - endpoints.POST /nature-center/educators
          - endpoints.GET /nature-center/educators/{id}
        distinguishing_aspect: |
          The two independent roots of the domain are created and read back through their own
          single-resource endpoints, so the round trip covers the input fields, the derived equity
          tier and the initial lifecycle states without any transition having run. Nothing here
          depends on bookings, which keeps the CRUD contract separable from the workflow.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "No schools or educators exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
