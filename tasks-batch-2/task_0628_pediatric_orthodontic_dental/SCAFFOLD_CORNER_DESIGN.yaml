# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7. Stubs (excluded_because) cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_family_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.FamilyAccount, endpoints]
        distinguishing_aspect: "POST /family-accounts with family_name+billing_email+guardian_user_id -> 201; discount_tier_pct==0 and active_plan_count==0 on the response."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /family-accounts"
              payload: { family_name: "Abel", billing_email: "abel@x.com", guardian_user_id: "g-abel" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "FamilyAccount.${fam_id}.discount_tier_pct == 0"
            - "FamilyAccount.${fam_id}.active_plan_count == 0"
            - "FamilyAccount.${fam_id}.version == 1"

      - name: create_patient_returns_201_records_incomplete
        claim_type: Creation
        grounds: [entities.Patient, entities.Patient.fields.records_complete]
        distinguishing_aspect: "A freshly created Patient has records_complete==false (no FINALIZED films yet)."
        test_recipe:
          setup: ["A family account exists."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Boe", billing_email: "boe@x.com", guardian_user_id: "g-boe" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Cy Boe", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Patient.${pat_id}.records_complete == false"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Patient
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /patients/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_patient_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Patient
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients omitting full_name -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A family account exists."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Dao", billing_email: "dao@x.com", guardian_user_id: "g-dao" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_chair_default_turnover_buffer_applied
        claim_type: Defaults
        grounds: [entities.Chair.fields.turnover_buffer_minutes]
        distinguishing_aspect: "POST /chairs omitting turnover_buffer_minutes -> default 10 applied."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /chairs"
              payload: { label: "CX" }
              as: ClinicAdmin
              captures: { chair_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Chair.${chair_id}.turnover_buffer_minutes == 10"
            - "Chair.${chair_id}.active == true"

      - name: patient_records_complete_becomes_true_after_pano_and_ceph_finalized
        claim_type: Computed Fields
        grounds: [entities.Patient.fields.records_complete, state_machines.GrowthRecord.DRAFT_to_FINALIZED]
        distinguishing_aspect: "records_complete flips to true only once BOTH a FINALIZED PANO and a FINALIZED CEPH exist; with only a PANO finalized it stays false."
        test_recipe:
          setup: ["Patient with a FINALIZED PANO but no CEPH yet."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Eko", billing_email: "eko@x.com", guardian_user_id: "g-eko" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Fi Eko", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c1", full_name: "Dr C1", npi: "2034567890" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-01-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c1"
              captures: { pano_id: $.data.id }
            - call: "POST /growth-records/${pano_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c1"
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "CEPH", taken_at: "2026-01-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c1"
              captures: { ceph_id: $.data.id }
          trigger:
            - call: "POST /growth-records/${ceph_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c1"
          assert:
            - "Patient.${pat_id}.records_complete == true"

      - name: list_patients_filtered_by_family_pagination_envelope
        claim_type: Listing
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "GET /patients?family_account_id=... returns an array envelope with total_count and has_more present."
        test_recipe:
          setup: ["One family with one patient."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Gad", billing_email: "gad@x.com", guardian_user_id: "g-gad" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Hu Gad", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "GET /patients?family_account_id=${fam_id}"
              payload: { family_account_id: "${fam_id}" }
              as: FrontDesk
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response_type == array"
            - "total_count == 1"
            - "has_more == false"
            - "first_id == ${pat_id}"

      - name: growth_record_fk_reverse_reachable_by_patient_filter
        claim_type: Parent Relationships
        grounds: [entities.GrowthRecord.fields.patient_id, endpoints]
        distinguishing_aspect: "GET /growth-records?patient_id=... returns the patient's growth records (FK reverse-reachability)."
        test_recipe:
          setup: ["Patient with one DRAFT growth record."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Ino", billing_email: "ino@x.com", guardian_user_id: "g-ino" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Jo Ino", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c2", full_name: "Dr C2", npi: "2134567890" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-01-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c2"
              captures: { gr_id: $.data.id }
          trigger:
            - call: "GET /growth-records?patient_id=${pat_id}"
              payload: { patient_id: "${pat_id}" }
              as: Orthodontist
              as_user_id: "ortho-c2"
              captures: { found: "$.data[0].id" }
          assert:
            - "total_count == 1"
            - "found == ${gr_id}"

      - name: create_patient_wrong_family_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Patient.fields.family_account_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /patients with a non-existent family_account_id -> ERR_NOT_FOUND (404) (FK existence validated)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { family_account_id: "00000000-0000-4000-8000-000000000001", full_name: "Ka", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_appointment_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Appointment.SCHEDULED_to_CANCELLED, state_machines.Appointment.CHECKED_IN_to_COMPLETED]
        distinguishing_aspect: "A COMPLETED appointment cannot be cancelled -> ERR_INVALID_STATE (409); terminal lockdown."
        test_recipe:
          setup: ["An appointment driven to COMPLETED (scheduled -> checked-in -> completed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T15:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Lim", billing_email: "lim@x.com", guardian_user_id: "g-lim" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Mo Lim", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c3", full_name: "Dr C3", npi: "2234567000" }
              as: ClinicAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "CC1", turnover_buffer_minutes: 10 }
              as: ClinicAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", chair_id: "${chair_id}", visit_type: "EMERGENCY", starts_at: "2026-04-01T15:00:00Z", ends_at: "2026-04-01T15:30:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c3"
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: finalize_growth_record_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.GrowthRecord.DRAFT_to_FINALIZED]
        distinguishing_aspect: "Finalizing an already-FINALIZED growth record a second time -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A FINALIZED growth record."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Noe", billing_email: "noe@x.com", guardian_user_id: "g-noe" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Os Noe", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c4", full_name: "Dr C4", npi: "2334567000" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-01-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c4"
              captures: { gr_id: $.data.id }
            - call: "POST /growth-records/${gr_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c4"
          trigger:
            - call: "POST /growth-records/${gr_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c4"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: approve_already_approved_claim_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.InsuranceClaim.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving a claim already in APPROVED -> ERR_INVALID_STATE (409); the second approval does not draw the pool again."
        test_recipe:
          setup: ["A claim APPROVED once (benefit 50000, remaining drops once)."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Poe", billing_email: "poe@x.com", guardian_user_id: "g-poe" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Qi Poe", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c5", full_name: "Dr C5", npi: "2434567000" }
              as: ClinicAdmin
            - call: "POST /insurance-policies"
              payload: { patient_id: "${pat_id}", carrier_name: "Humana", ortho_rider: true, ortho_coverage_pct: 0.50, lifetime_max_cents: 300000 }
              as: BillingSpecialist
              captures: { pol_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", policy_id: "${pol_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-c5"
              captures: { plan_id: $.data.id }
            - call: "POST /insurance-claims"
              payload: { policy_id: "${pol_id}", plan_id: "${plan_id}", billed_amount_cents: 100000 }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /insurance-claims/${claim_id}/approve"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /insurance-claims/${claim_id}/approve"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "InsurancePolicy.${pol_id}.remaining_max_cents == 250000"

      - name: activate_plan_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentPlan.PROPOSED_to_ACTIVE]
        distinguishing_aspect: "Activating a plan still in DRAFT (skipping PROPOSED) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT plan with a phase; patient records complete; never proposed."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Roe", billing_email: "roe@x.com", guardian_user_id: "g-roe" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Sy Roe", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c6", full_name: "Dr C6", npi: "2534567000" }
              as: ClinicAdmin
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-c6"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-phases"
              payload: { plan_id: "${plan_id}", sequence_no: 1, label: "P", phase_fee_cents: 100000 }
              as: Orthodontist
              as_user_id: "ortho-c6"
          trigger:
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: Guardian
              as_user_id: "g-roe"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: terminate_already_terminated_policy_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.InsurancePolicy.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "A TERMINATED policy cannot be terminated again -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A policy already TERMINATED."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Sue", billing_email: "sue@x.com", guardian_user_id: "g-sue" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Te Sue", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${pat_id}", carrier_name: "Kaiser", ortho_rider: false, ortho_coverage_pct: 0.0, lifetime_max_cents: 0 }
              as: BillingSpecialist
              captures: { pol_id: $.data.id }
            - call: "POST /insurance-policies/${pol_id}/terminate"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /insurance-policies/${pol_id}/terminate"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: prior_pano_superseded_when_new_pano_finalized
        claim_type: Side Effect Execution
        grounds: [state_machines.GrowthRecord.FINALIZED_to_SUPERSEDED, state_machines.GrowthRecord.DRAFT_to_FINALIZED]
        distinguishing_aspect: "Finalizing a second PANO supersedes the first FINALIZED PANO -> its status becomes SUPERSEDED while the new one is FINALIZED."
        test_recipe:
          setup: ["Patient with one FINALIZED PANO; a second DRAFT PANO created."]
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Tao", billing_email: "tao@x.com", guardian_user_id: "g-tao" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Ud Tao", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c7", full_name: "Dr C7", npi: "2634567000" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-01-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c7"
              captures: { pano1_id: $.data.id }
            - call: "POST /growth-records/${pano1_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c7"
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c7"
              captures: { pano2_id: $.data.id }
          trigger:
            - call: "POST /growth-records/${pano2_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c7"
          assert:
            - "GrowthRecord.${pano1_id}.status == SUPERSEDED"
            - "GrowthRecord.${pano2_id}.status == FINALIZED"

      - name: retainer_replace_issues_new_retainer
        claim_type: Side Effect Execution
        grounds: [state_machines.Retainer.ISSUED_to_REPLACED, state_machines.TreatmentPlan.ACTIVE_to_RETENTION]
        distinguishing_aspect: "Replacing an ISSUED retainer sets it to REPLACED and a new ISSUED retainer exists for the same plan (list by plan returns 2)."
        test_recipe:
          setup: ["Plan debonded to RETENTION (one ISSUED retainer)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /family-accounts"
              payload: { family_name: "Uxe", billing_email: "uxe@x.com", guardian_user_id: "g-uxe" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Vy Uxe", date_of_birth: "2012-01-01T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-c8", full_name: "Dr C8", npi: "2734567000" }
              as: ClinicAdmin
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "PANO", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c8"
              captures: { pano_id: $.data.id }
            - call: "POST /growth-records/${pano_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c8"
            - call: "POST /growth-records"
              payload: { patient_id: "${pat_id}", record_type: "CEPH", taken_at: "2026-02-01T00:00:00Z" }
              as: Orthodontist
              as_user_id: "ortho-c8"
              captures: { ceph_id: $.data.id }
            - call: "POST /growth-records/${ceph_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-c8"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-c8"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-phases"
