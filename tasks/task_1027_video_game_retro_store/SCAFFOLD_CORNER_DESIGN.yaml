# =============================================================================
# task_1027_video_game_retro_store — §1.9 Scaffold Corner Design
# Breadth probe over §1.1–§1.7 testable claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_minimal_returns_object
        claim_type: Creation
        grounds: [entities.Member.fields.full_name, entities.Member.fields.email]
        distinguishing_aspect: "POST /members with only full_name + email returns 201 with tier defaulting to STANDARD and store_credit_balance_cents=0, loyalty_points=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "Minnie", email: "minnie@x.com" }
              as: Clerk
              captures: { m_id: $.data.id, tier: $.data.tier }
          assert:
            - "Member.${m_id}.tier == STANDARD"
            - "Member.${m_id}.store_credit_balance_cents == 0"
            - "Member.${m_id}.loyalty_points == 0"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} on a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_member_missing_required_email_returns_validation
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /members omitting the required email field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "NoEmail" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

      - name: create_product_invalid_kind_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Product.fields.kind, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products with kind outside {GAME,CONSOLE,ACCESSORY} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { title: "Weird", kind: "TOY", base_price_cents: 1000, base_trade_value_cents: 100 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

      - name: store_credit_entry_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.StoreCreditEntry]
        distinguishing_aspect: "StoreCreditEntry has common_fields:false; a manual adjustment entry exposes id + created_at only, no version and no update endpoint exists."
        test_recipe:
          setup: ["A member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Led", email: "led@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/store-credit/adjustments"
              payload: { amount_cents: 500 }
              as: Manager
              captures: { e_id: $.data.id, amt: $.data.amount_cents }
          assert:
            - "StoreCreditEntry.${e_id}.amount_cents == 500"
            - "StoreCreditEntry.${e_id}.reason == MANUAL_ADJUSTMENT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grade_settled_tradein_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TradeIn.SUBMITTED_to_OFFERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Grading a trade-in already in SETTLED is not a legal from-state; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A trade-in graded A and accepted (SETTLED)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "St", email: "st@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "G", kind: "GAME", base_price_cents: 5000, base_trade_value_cents: 4000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "A", payout_method: "CASH" }
              as: Clerk
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "A" }
              as: Clerk
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "B" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_fulfilled_preorder_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PreOrder.ALLOCATED_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A FULFILLED pre-order (terminal allocation dimension) cannot be cancelled; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A RELEASED pool total_count=1; member holds ALLOCATED pre-order paid in full then FULFILLED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ff", email: "ff@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "PF", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 2000, total_count: 1 }
              as: Manager
              captures: { st_id: $.data.id }
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { st_v: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_id: $.data.id }
            - call: "POST /pre-orders/${po_id}/payments"
              payload: { amount_cents: 6000 }
              as: Clerk
            - call: "POST /pre-orders/${po_id}/fulfill"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /pre-orders/${po_id}/cancel"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: release_already_released_stock_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProductStock.EMBARGOED_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing a pool already in RELEASED (terminal for release_state) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A released pool."]
          setup_api_calls:
            - call: "POST /products"
              payload: { title: "RS", kind: "GAME", base_price_cents: 3000, base_trade_value_cents: 1000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 3000, deposit_cents: 500, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id }
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: return_already_returned_rental_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Rental.CHECKED_OUT_to_RETURNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Returning a rental already in terminal RETURNED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A rental checked out and returned once."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Rr", email: "rr@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "RC", kind: "CONSOLE", base_price_cents: 9000, base_trade_value_cents: 3000, daily_rental_rate_cents: 200 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it_id: $.data.id }
            - call: "POST /rentals"
              payload: { member_id: "${m_id}", inventory_item_id: "${it_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-04T00:00:00Z" }
              as: Clerk
              captures: { r_id: $.data.id }
            - call: "POST /rentals/${r_id}/checkout"
              payload: {}
              as: Clerk
            - call: "POST /rentals/${r_id}/return"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /rentals/${r_id}/return"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: dispute_non_offered_tradein_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TradeIn.OFFERED_to_DISPUTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Disputing a trade-in still in SUBMITTED (never OFFERED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A submitted, ungraded trade-in."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Dn", email: "dn@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "DG", kind: "GAME", base_price_cents: 4000, base_trade_value_cents: 3000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "B", payout_method: "CASH" }
              as: Clerk
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/dispute"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: trade_in_cash_payout_has_no_store_credit_bonus
        claim_type: Correct Result
        grounds: [calculations.trade_in_value]
        distinguishing_aspect: "With payout_method CASH and grade A on base 10000, value is exactly 10000 — the +10% STORE_CREDIT bonus is not applied."
        test_recipe:
          setup: ["A member and product with base_trade_value_cents=10000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ca", email: "ca@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "CashGame", kind: "GAME", base_price_cents: 5000, base_trade_value_cents: 10000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "A", payout_method: "CASH" }
              as: Clerk
              captures: { ti_id: $.data.id, prov: $.data.provisional_value_cents }
          trigger:
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "A" }
              as: Clerk
              captures: { fv: $.data.final_value_cents }
          assert:
            - "TradeIn.${ti_id}.provisional_value_cents == 10000"
            - "TradeIn.${ti_id}.final_value_cents == 10000"

      - name: sale_no_redemption_earns_standard_tier_points
        claim_type: Constants Applied
        grounds: [calculations.loyalty_points_earned, entities.Member.fields.tier]
        distinguishing_aspect: "A STANDARD (rate 1.0) member buying one 10000 item (tax 725, total 10725, no redemption) earns floor(10725/100*1.0)=107 points."
        test_recipe:
          setup: ["A STANDARD member and one AVAILABLE unit priced 10000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Std", email: "std@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "StdGame", kind: "GAME", base_price_cents: 10000, base_trade_value_cents: 4000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it1: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it1}", unit_price_cents: 10000, qty: 1 } ] }
              as: Clerk
              captures: { s_id: $.data.id, pts: $.data.loyalty_points_earned }
          assert:
            - "Sale.${s_id}.tax_total_cents == 725"
            - "Sale.${s_id}.total_cents == 10725"
            - "Sale.${s_id}.loyalty_points_earned == 107"

      - name: manual_adjustment_updates_member_balance
        claim_type: Computed Fields
        grounds: [calculations.store_credit_balance, entities.Member.fields.store_credit_balance_cents]
        distinguishing_aspect: "A single +500 MANUAL_ADJUSTMENT entry makes Member.store_credit_balance_cents == 500 (ledger sum)."
        test_recipe:
          setup: ["A member with a +500 manual adjustment."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Adj", email: "adj@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/store-credit/adjustments"
              payload: { amount_cents: 500 }
              as: Manager
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Clerk
              captures: { bal: $.data.store_credit_balance_cents }
          assert:
            - "Member.${m_id}.store_credit_balance_cents == 500"

  # ===========================================================================
  - section: validations
    instances:
      - name: sale_redeem_exceeds_balance_returns_402
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_INSUFFICIENT_STORE_CREDIT]"]
        distinguishing_aspect: "Redeeming 500 store credit against an available item while balance is 0 (no state violation) returns ERR_INSUFFICIENT_STORE_CREDIT (402)."
        test_recipe:
          setup: ["A member with 0 credit; one AVAILABLE unit priced 1000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ins", email: "ins@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "IG", kind: "GAME", base_price_cents: 1000, base_trade_value_cents: 300 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-items"
              payload: { condition_grade: "A" }
              as: Clerk
              captures: { it1: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { member_id: "${m_id}", lines: [ { inventory_item_id: "${it1}", unit_price_cents: 1000, qty: 1 } ], redeem_store_credit_cents: 500 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INSUFFICIENT_STORE_CREDIT"

      - name: preorder_first_payment_below_deposit_returns_402
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "errors[ERR_INSUFFICIENT_PAYMENT]"]
        distinguishing_aspect: "A first pre-order payment of 500 below the pool deposit_cents=2000 returns ERR_INSUFFICIENT_PAYMENT (402)."
        test_recipe:
          setup: ["A WAITLISTED pre-order on an EMBARGOED pool with deposit 2000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Dp", email: "dp@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "DPG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 2000, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po_id}/payments"
              payload: { amount_cents: 500 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INSUFFICIENT_PAYMENT"

      - name: second_active_preorder_same_pool_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_ONE_ACTIVE_PREORDER]"]
        distinguishing_aspect: "A member with an existing non-terminal pre-order on a pool cannot create a second on the same pool; returns ERR_ONE_ACTIVE_PREORDER (409)."
        test_recipe:
          setup: ["A member with one WAITLISTED pre-order on an EMBARGOED pool."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Dup", email: "dup@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "DupG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 1000, total_count: 3 }
              as: Manager
              captures: { st_id: $.data.id, st_v1: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v1}" }
              as: Clerk
              captures: { po1: $.data.id }
            - call: "GET /product-stocks/${st_id}"
              payload: {}
              as: Clerk
              captures: { st_v2: $.data.version }
          trigger:
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v2}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_ONE_ACTIVE_PREORDER"

      - name: duplicate_registration_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_ALREADY_REGISTERED]"]
        distinguishing_aspect: "Registering the same member twice for a tournament (window open, capacity free) returns ERR_ALREADY_REGISTERED (409)."
        test_recipe:
          setup: ["A tournament with open window and capacity 5; member m1 already registered."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S1", seat_capacity: 8 }
              as: Manager
              captures: { stn_id: $.data.id }
            - call: "POST /tournaments"
              payload: { station_id: "${stn_id}", title: "Open Cup", starts_at: "2026-07-05T10:00:00Z", ends_at: "2026-07-05T12:00:00Z", registration_opens_at: "2026-07-01T00:00:00Z", registration_closes_at: "2026-07-05T09:00:00Z", max_participants: 5 }
              as: Clerk
              captures: { t_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Reg", email: "reg@x.com" }
              as: Clerk
              captures: { m1: $.data.id }
            - call: "POST /tournaments/${t_id}/register"
              payload: { member_id: "${m1}" }
              as: Clerk
          trigger:
            - call: "POST /tournaments/${t_id}/register"
              payload: { member_id: "${m1}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_ALREADY_REGISTERED"

      - name: pagination_limit_zero_returns_400
        claim_type: Violation → Error
        grounds: ["errors[ERR_PAGINATION_INVALID]", endpoints]
        distinguishing_aspect: "GET /pre-orders with limit=0 (below min 1) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pre-orders"
              payload: { limit: 0 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_PAGINATION_INVALID"

      - name: tournament_capacity_full_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_TOURNAMENT_FULL]"]
        distinguishing_aspect: "With the window open, registering a second member into a max_participants=1 tournament (isolated from the window rule) returns ERR_TOURNAMENT_FULL (409)."
        test_recipe:
          setup: ["A max_participants=1 tournament, window open; slot already filled by m1."]
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "S2", seat_capacity: 8 }
              as: Manager
              captures: { stn_id: $.data.id }
            - call: "POST /tournaments"
              payload: { station_id: "${stn_id}", title: "Tiny", starts_at: "2026-07-06T10:00:00Z", ends_at: "2026-07-06T12:00:00Z", registration_opens_at: "2026-07-01T00:00:00Z", registration_closes_at: "2026-07-06T09:00:00Z", max_participants: 1 }
              as: Clerk
              captures: { t_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "One", email: "one@x.com" }
              as: Clerk
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Two", email: "two2@x.com" }
              as: Clerk
              captures: { m2: $.data.id }
            - call: "POST /tournaments/${t_id}/register"
              payload: { member_id: "${m1}" }
              as: Clerk
          trigger:
            - call: "POST /tournaments/${t_id}/register"
              payload: { member_id: "${m2}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_TOURNAMENT_FULL"

      - name: fulfill_allocated_but_unpaid_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_ALLOCATION_NOT_READY]"]
        distinguishing_aspect: "Fulfilling an ALLOCATED pre-order whose payment_status is not PAID_IN_FULL returns ERR_ALLOCATION_NOT_READY (409)."
        test_recipe:
          setup: ["A RELEASED pool total_count=1 with an ALLOCATED, UNPAID pre-order."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Up", email: "up@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "UPG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
