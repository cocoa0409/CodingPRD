    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: IncentiveDecision[]
    side_effects: []

  # --- opportunities (citywide convention leads) ---------------------------
  - method: POST
    path: "/opportunities"
    description: "Creates a citywide convention lead in sales_stage LEAD. supersedes_opportunity_id links a re-bid of a previously LOST lead."
    roles: [SalesManager]
    code: 201
    input: ["planner_id", "event_name", "arrival_date", "departure_date", "peak_rooms_requested", "total_room_nights_requested", "attendance_estimate", "exhibit_sqft_requested", "rate_ceiling_amount", "supersedes_opportunity_id?"]
    output: Opportunity
    side_effects: ["event_nights computed as departure_date - arrival_date in whole nights", "sales_stage set to LEAD, hold_posture set to NONE, all committed / coverage / settlement aggregates initialized to 0", "MeetingPlanner.last_touch_at refreshed"]

  - method: GET
    path: "/opportunities/{id}"
    description: "Reads one opportunity including sales_stage, hold_posture and every derived block aggregate."
    roles: [BureauAdmin, SalesManager, CenterScheduler, IncentiveApprover, ServicesManager, BoardAnalyst, MeetingPlanner, HotelPartner]
    code: 200
    input: []
    output: Opportunity
    side_effects: []

  - method: GET
    path: "/opportunities"
    description: "Lists opportunities with optional planner_id / supersedes_opportunity_id / stage / posture filters and offset pagination (FK reverse-reachability for Opportunity.planner_id and Opportunity.supersedes_opportunity_id)."
    roles: [BureauAdmin, SalesManager, CenterScheduler, BoardAnalyst]
    code: 200
    input: ["planner_id?", "supersedes_opportunity_id?", "sales_stage?", "hold_posture?", "limit?", "offset?"]
    output: Opportunity[]
    side_effects: []

  - method: POST
    path: "/opportunities/{id}/qualify"
    description: "Qualifies a LEAD after the lead-time gate, making it eligible for holds, blocks and bids."
    roles: [SalesManager]
    code: 200
    input: []
    output: Opportunity
    side_effects: ["sales_stage LEAD -> QUALIFIED", "MeetingPlanner.engagement_status set to ENGAGED and last_touch_at refreshed", "increments version by 1"]

  - method: POST
    path: "/opportunities/{id}/lose"
    description: "Marks a lead lost with a reason, releasing every hold and block it still occupies."
    roles: [SalesManager]
    code: 200
    input: [lost_reason]
    output: Opportunity
    side_effects: ["sales_stage -> LOST and lost_reason stored", "CASCADE: SpaceHolds released (with SECOND-hold promotion), RoomBlockCommitments withdrawn, DRAFT BidPackage declined, REQUESTED ServicingOrders cancelled", "MeetingPlanner.lost_count and both score variants recomputed by calculations.planner_relationship_score", "increments version by 1"]

  # --- space holds (convention center date/space coordination) --------------
  - method: POST
    path: "/space-holds"
    description: "Places a date-and-space hold on a hall for a qualified opportunity. The server assigns hold_rank FIRST when nothing conflicts and SECOND when exactly one HELD/CHALLENGED hold conflicts with the buffered window."
    roles: [CenterScheduler]
    code: 201
    input: [opportunity_id, center_hall_id, move_in_start, move_out_end]
    output: SpaceHold
    side_effects: ["hold_rank assigned by calculations.hall_occupation_conflict", "status set to HELD and expires_at set to clock + FIRST_HOLD_DAYS (90 days)", "Opportunity.hold_posture moves to TENTATIVE when the new hold is FIRST"]

  - method: GET
    path: "/space-holds/{id}"
    description: "Reads one hold including rank, status, expiry, challenge deadline and release reason."
    roles: [BureauAdmin, CenterScheduler, SalesManager]
    code: 200
    input: []
    output: SpaceHold
    side_effects: []

  - method: GET
    path: "/space-holds"
    description: "Lists holds with optional opportunity_id / center_hall_id / challenged_by_space_hold_id / status filters and offset pagination (FK reverse-reachability for all three SpaceHold FKs)."
    roles: [BureauAdmin, CenterScheduler, SalesManager]
    code: 200
    input: ["opportunity_id?", "center_hall_id?", "challenged_by_space_hold_id?", "status?", "hold_rank?", "limit?", "offset?"]
    output: SpaceHold[]
    side_effects: []

  - method: POST
    path: "/space-holds/{id}/challenge"
    description: "The SECOND-rank hold named in challenging_space_hold_id challenges the FIRST-rank hold addressed by {id}, forcing that opportunity to go definite or let the space go."
    roles: [CenterScheduler]
    code: 200
    input: [challenging_space_hold_id]
    output: SpaceHold
    side_effects: ["path hold HELD -> CHALLENGED and challenged_by_space_hold_id set to the challenger", "challenge_deadline set to clock + CHALLENGE_RESPONSE_DAYS (14 days)", "the challenged hold's Opportunity.hold_posture moves TENTATIVE -> CHALLENGED"]

  - method: POST
    path: "/space-holds/{id}/release"
    description: "Releases a HELD or CHALLENGED hold, immediately promoting the ranked SECOND hold that was waiting on the same buffered window."
    roles: [CenterScheduler]
    code: 200
    input: []
    output: SpaceHold
    side_effects: ["status -> RELEASED with release_reason SCHEDULER_RELEASE", "calculations.second_hold_promotion_selection promotes at most one waiting SECOND hold to FIRST with a fresh 30-day expiry", "Opportunity.hold_posture of the releasing opportunity -> RELEASED, of the promoted opportunity -> TENTATIVE"]

  - method: POST
    path: "/space-hold-expiry-runs"
    description: "Ops-run checkpoint: expires every HELD hold whose expires_at has passed, releases every CHALLENGED hold whose challenge_deadline has passed, and promotes waiting SECOND holds. Processes holds in (expires_at ASC, created_at ASC) order."
    roles: [BureauAdmin, CenterScheduler]
    code: 200
    input: []
    output: "{ expired_count: integer, lapsed_challenge_count: integer, promoted_count: integer, promoted_space_hold_ids: string[] }"
    side_effects: ["HELD -> EXPIRED with release_reason HOLD_EXPIRED for every hold with clock >= expires_at", "CHALLENGED -> RELEASED with release_reason CHALLENGE_LAPSED for every hold with clock > challenge_deadline", "calculations.second_hold_promotion_selection runs once per vacated window", "affected Opportunity.hold_posture values recomputed"]

  # --- citywide room block ---------------------------------------------------
  - method: POST
    path: "/room-block-commitments"
    description: "Invites one hotel into the citywide block for an opportunity. OCC-guarded on the Opportunity per concurrency_rules commitment-invite-stale-opportunity: expected_opportunity_version must match the version the caller last observed."
    roles: [SalesManager]
    code: 201
    input: [opportunity_id, hotel_id, rooms_peak_invited, expected_opportunity_version]
    output: RoomBlockCommitment
    side_effects: ["status set to INVITED, offer_round set to 0, every room and money aggregate initialized to 0", "increments Opportunity.version by 1"]

  - method: GET
    path: "/room-block-commitments/{id}"
    description: "Reads one commitment including offered/committed rooms, pickup totals and attrition figures."
    roles: [BureauAdmin, SalesManager, HotelPartner, BoardAnalyst]
    code: 200
    input: []
    output: RoomBlockCommitment
    side_effects: []

  - method: GET
    path: "/room-block-commitments"
    description: "Lists commitments with optional opportunity_id / hotel_id / status filters and offset pagination (FK reverse-reachability for both RoomBlockCommitment FKs)."
    roles: [BureauAdmin, SalesManager, HotelPartner, BoardAnalyst]
    code: 200
    input: ["opportunity_id?", "hotel_id?", "status?", "limit?", "offset?"]
    output: RoomBlockCommitment[]
    side_effects: []

  - method: POST
    path: "/room-block-commitments/{id}/offer"
    description: "The property answers the invitation with peak rooms, a negotiated rate under the ceiling, and its cutoff. Repeatable while the bureau has not committed the block."
    roles: [HotelPartner]
    code: 200
    input: [rooms_peak_offered, rate_offered_amount, cutoff_days_before_arrival]
    output: RoomBlockCommitment
    side_effects: ["status INVITED -> OFFERED or OFFERED -> OFFERED with offer_round incremented", "cutoff_date recomputed as Opportunity.arrival_date minus cutoff_days_before_arrival days"]

  - method: POST
    path: "/room-block-commitments/{id}/commit"
    description: "The bureau commits the offered block after the per-night hotel capacity check, freezing the rooms into the citywide total."
    roles: [SalesManager]
    code: 200
    input: []
    output: RoomBlockCommitment
    side_effects: ["status OFFERED -> COMMITTED with rooms_peak_committed frozen at rooms_peak_offered", "Hotel.committed_peak_rooms / committed_room_nights recomputed by calculations.hotel_nightly_block_capacity", "Opportunity block aggregates recomputed by calculations.citywide_block_readiness", "increments Opportunity.version by 1"]

  - method: POST
    path: "/room-block-commitments/{id}/withdraw"
    description: "The property leaves the block. Withdrawing a COMMITTED block can drop citywide coverage below the floor and push a SUBMITTED bid back to DRAFT with its fund charge decommitted."
    roles: [HotelPartner]
    code: 200
    input: [withdraw_reason]
    output: RoomBlockCommitment
    side_effects: ["status -> WITHDRAWN with withdraw_reason stored", "Hotel and Opportunity aggregates recomputed", "CASCADE: SUBMITTED BidPackage -> DRAFT and its IncentiveFund charge decommitted when block_coverage_pct falls below 85.00", "increments Opportunity.version by 1"]

  - method: POST
    path: "/room-block-commitments/{id}/pickup-records"
    description: "The property reports actual rooms occupied for one night of the block; drives the FINAL impact variant and the attrition settlement."
    roles: [HotelPartner]
    code: 201
    input: [night_date, rooms_picked_up, rate_charged_amount]
    output: PickupRecord
    side_effects: ["room_night_revenue_amount computed as rooms_picked_up * rate_charged_amount rounded to 2 decimals", "RoomBlockCommitment.picked_up_room_nights and Hotel.pickup_room_nights increased", "attrition_shortfall_nights and attrition_damages_amount recomputed by calculations.attrition_settlement"]

  - method: GET
    path: "/room-block-commitments/{id}/pickup-records"
    description: "Lists the nightly pickup rows of one commitment (FK reverse-reachability for PickupRecord.room_block_commitment_id)."
    roles: [BureauAdmin, SalesManager, HotelPartner, BoardAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: PickupRecord[]
    side_effects: []

  # --- bid packages ----------------------------------------------------------
  - method: POST
    path: "/bid-packages"
    description: "Opens a bid package for a QUALIFIED opportunity. OCC-guarded on the Opportunity per concurrency_rules bid-package-create-stale-opportunity, because a new package may supersede a DECLINED predecessor."
    roles: [SalesManager]
    code: 201
    input: [opportunity_id, expected_opportunity_version]
    output: BidPackage
    side_effects: ["status set to DRAFT, round_number set to 1, prepared_by_user_id set to the acting X-User-ID", "increments Opportunity.version by 1"]

  - method: GET
    path: "/bid-packages/{id}"
    description: "Reads one bid package including the incentive cap, approved amount, admin fee, total fund charge and payback ratio."
    roles: [BureauAdmin, SalesManager, IncentiveApprover, MeetingPlanner, BoardAnalyst]
    code: 200
    input: []
    output: BidPackage
    side_effects: []

  - method: GET
    path: "/bid-packages"
    description: "Lists bid packages with optional opportunity_id / status filters and offset pagination (FK reverse-reachability for BidPackage.opportunity_id)."
    roles: [BureauAdmin, SalesManager, IncentiveApprover, BoardAnalyst]
    code: 200
    input: ["opportunity_id?", "status?", "limit?", "offset?"]
    output: BidPackage[]
    side_effects: []

  - method: POST
    path: "/bid-packages/{id}/support-letters"
    description: "Attaches a community support letter to a DRAFT bid package. Submission requires at least two DISTINCT letter_type values."
    roles: [SalesManager]
    code: 201
    input: [organization_name, letter_type]
    output: SupportLetter
    side_effects: ["received_at stamped from the logical clock", "BidPackage.support_letter_type_count recomputed as the count of DISTINCT letter_type values on this package"]

  - method: GET
    path: "/bid-packages/{id}/support-letters"
    description: "Lists the support letters of one bid package (FK reverse-reachability for SupportLetter.bid_package_id)."
    roles: [BureauAdmin, SalesManager, IncentiveApprover]
    code: 200
    input: ["letter_type?", "limit?", "offset?"]
    output: SupportLetter[]
    side_effects: []

  - method: POST
    path: "/bid-packages/{id}/request-incentive"
    description: "Requests incentive money for the bid. Snapshots a PROVISIONAL economic impact estimate and computes the incentive cap; the cap is NOT enforced here, only at decision time."
    roles: [SalesManager]
    code: 200
    input: [incentive_request_amount, service_commitment_codes]
    output: BidPackage
    side_effects: ["status DRAFT -> INCENTIVE_PENDING and incentive_requested_by_user_id set to the acting X-User-ID", "a PROVISIONAL EconomicImpactEstimate is created by calculations.economic_impact_estimate", "incentive_cap_amount computed by calculations.incentive_cap"]

  - method: POST
    path: "/bid-packages/{id}/incentive-decisions"
    description: "The incentive approver decides the request against a named fund. Segregation of duties forbids the preparer or requester from deciding. OCC-guarded on the fund per concurrency_rules incentive-decision-stale-fund."
    roles: [IncentiveApprover]
    code: 201
    input: [fund_id, decision, approved_amount, rationale, expected_fund_version]
    output: IncentiveDecision
    side_effects: ["admin_fee_amount, total_charge_amount and tax_payback_ratio computed by calculations.fund_charge_composition", "BidPackage INCENTIVE_PENDING -> APPROVED for APPROVED/REDUCED, or -> DRAFT with round_number incremented for REJECTED", "IncentiveFund.committed_amount increased by total_charge_amount, uncommitted_amount lowered and posture re-derived", "increments IncentiveFund.version by 1"]

  - method: GET
    path: "/bid-packages/{id}/incentive-decisions"
    description: "Lists the incentive decisions recorded against one bid package (FK reverse-reachability for IncentiveDecision.bid_package_id)."
    roles: [BureauAdmin, SalesManager, IncentiveApprover, BoardAnalyst]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: IncentiveDecision[]
    side_effects: []

  - method: POST
    path: "/bid-packages/{id}/submit"
    description: "Submits the approved bid to the planner. Enforces the citywide readiness gates: an active hold, two distinct support-letter types, coverage at or above 85.00% and cutoff spread within 2 days."
    roles: [SalesManager]
    code: 200
    input: [response_due_at]
    output: BidPackage
    side_effects: ["status APPROVED -> SUBMITTED and submitted_at stamped from the logical clock", "Opportunity.sales_stage QUALIFIED -> BIDDING", "increments Opportunity.version by 1"]

  - method: POST
    path: "/bid-packages/{id}/planner-response"
    description: "The meeting planner accepts, declines or requests a revision of a SUBMITTED bid. Acceptance converts the lead to DEFINITE and confirms the hall."
    roles: [MeetingPlanner]
    code: 200
    input: ["response", "decline_reason?"]
    output: BidPackage
    side_effects: ["planner_response stored; status -> ACCEPTED, DECLINED, or DRAFT with round_number incremented for REVISION_REQUESTED below the round limit", "on ACCEPTED: Opportunity -> DEFINITE, definite_room_nights and definite_at set, SpaceHold -> CONFIRMED with conflicting siblings released, MeetingPlanner counters and both score variants recomputed", "on DECLINED: Opportunity -> LOST with the lost_reason derived from decline_reason", "increments Opportunity.version by 1"]

  # --- economic impact -------------------------------------------------------
  - method: POST
    path: "/economic-impact-estimates"
    description: "Computes and stores an economic impact estimate for an opportunity in the requested variant. PROVISIONAL uses the planner's requested figures; FINAL uses reported pickup and confirmed exhibit space."
    roles: [BoardAnalyst, SalesManager]
    code: 201
    input: [opportunity_id, variant]
    output: EconomicImpactEstimate
    side_effects: ["every spend, impact and tax-yield field computed by calculations.economic_impact_estimate for the requested variant", "computed_at stamped from the logical clock"]

  - method: GET
    path: "/opportunities/{id}/economic-impact-estimates"
    description: "Lists the impact snapshots of one opportunity, newest last (FK reverse-reachability for EconomicImpactEstimate.opportunity_id)."
    roles: [BureauAdmin, SalesManager, IncentiveApprover, BoardAnalyst]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: EconomicImpactEstimate[]
    side_effects: []

